# Anton (German-DE, primary) mapped onto the Twist de-DE curriculum.
# Research side: this file cites Anton; twist/ never does.
#
# Each course lists rules "pattern => steps". The pattern is a regular
# expression matched against "Topic » Lesson" (case-sensitive); the first
# rule that matches wins. Steps are Twist step ids without the domain prefix
# given by the course. "=> -" with a reason after "#" excludes a lesson.
# crosswalk/anton-twist.mjs applies the rules and fails on any Anton lesson
# that no rule matches, so nothing is dropped silently.

