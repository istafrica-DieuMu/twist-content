  - code: bw-mathe-2016.k34.1.1.3
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.1 Zahldarstellungen und Zahlbeziehungen verstehen"
    band: end-klasse-4
    text: "Zahlen bis 1.000.000 sprechen, lesen und in Ziffern schreiben"
  - code: bw-mathe-2016.k34.1.1.4
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.1 Zahldarstellungen und Zahlbeziehungen verstehen"
    band: end-klasse-4
    text: "sich sicher im Zahlenraum bis 1.000.000 bewegen (zum Beispiel Zählen in Schritten, Zahlen der Größe nach ordnen, Zahlen verorten)"
  - code: bw-mathe-2016.k34.1.1.5
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.1 Zahldarstellungen und Zahlbeziehungen verstehen"
    band: end-klasse-4
    text: "Zahleigenschaften und Zahlbeziehungen erkennen, beschreiben und darstellen (gerade – ungerade Zahlen, Vorgänger – Nachfolger, Nachbarzahlen, die Hälfte, das Doppelte, größer als, kleiner als, gleich, liegt näher bei, liegt zwischen, runden)"
  - code: bw-mathe-2016.k34.1.1.6
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.1 Zahldarstellungen und Zahlbeziehungen verstehen"
    band: end-klasse-4
    text: "Bedeutungen von großen Zahlen in unterschiedlichen Kontexten erkennen, Zahlen dokumentieren und in unterschiedlichen Kontexten anwenden"
  - code: bw-mathe-2016.k34.1.1.7
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.1 Zahldarstellungen und Zahlbeziehungen verstehen"
    band: end-klasse-4
    text: "Gesetzmäßigkeiten in arithmetischen Mustern erkennen, beschreiben und fortsetzen"
  - code: bw-mathe-2016.k34.1.1.8
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.1 Zahldarstellungen und Zahlbeziehungen verstehen"
    band: end-klasse-4
    text: "arithmetische Muster selbst entwickeln, systematisch verändern und beschreiben"
  - code: bw-mathe-2016.k34.1.2.1
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "die vier Grundrechenarten anwenden und ihre Zusammenhänge verstehen"
  - code: bw-mathe-2016.k34.1.2.2
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "in den vier Grundrechenarten zwischen den Darstellungsebenen wechselseitig übersetzen (Zahlensatz, Handlung, Sprache, Zeichnung)"
  - code: bw-mathe-2016.k34.1.2.3
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "Aufgaben der vier Grundrechenarten lösen"
  - code: bw-mathe-2016.k34.1.2.4
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "Zusammenhänge zwischen Rechenoperationen und Umkehroperationen (Umkehraufgabe) verstehen und beim Kontrollieren von Lösungen anwenden"
  - code: bw-mathe-2016.k34.1.2.5
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "strategische Werkzeuge des Zahlenrechnens im erweiterten Zahlenraum anwenden und aufgabenadäquat nutzen sowie eigene halbschriftliche Lösungswege im erweiterten Zahlenraum entwickeln und notieren: zerlegen und zusammensetzen Analogien bilden von Hilfsaufgaben ableiten Aufgaben verändern Tauschaufgaben"
  - code: bw-mathe-2016.k34.1.2.6
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "eigene Rechenwege beschreiben und begründen"
  - code: bw-mathe-2016.k34.1.2.7
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "verschiedene Rechenwege untersuchen, vergleichen und bewerten"
  - code: bw-mathe-2016.k34.1.2.8
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "fehlerhafte Strategien bei Rechenfehlern aufspüren (Rechenfehler finden, erklären und korrigieren)"
  - code: bw-mathe-2016.k34.1.2.9
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "schriftliche Verfahren der Addition, Subtraktion (Abziehen oder Ergänzen), Multiplikation und Division verstehen"
  - code: bw-mathe-2016.k34.1.2.10
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "schriftliche Verfahren der Addition, der Subtraktion, der Multiplikation wie auch der Division und der Division mit Rest geläufig ausführen und anwenden"
  - code: bw-mathe-2016.k34.1.2.11
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "die Grundaufgaben des Kopfrechnens (Einmaleins) aus dem Gedächtnis abrufen, deren Umkehrungen sicher ableiten und diese Grundkenntnisse auf analoge Aufgaben in größeren Zahlenräumen übertragen und nutzen"
  - code: bw-mathe-2016.k34.1.2.12
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "die ungefähre Größenordnung von Ergebnissen vorhersagen und in der Umkehrung die Plausibilität von Ergebnissen durch Abschätzen überprüfen (Runden, Überschlag)"
  - code: bw-mathe-2016.k34.1.2.13
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "Gesetzmäßigkeiten in arithmetischen Mustern erkennen, beschreiben und fortsetzen: Zahlenfolgen, strukturierte Aufgabenfolgen"
  - code: bw-mathe-2016.k34.1.2.14
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "arithmetische Muster selbst entwickeln, systematisch verändern und beschreiben"
  - code: bw-mathe-2016.k34.1.2.15
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.2 Rechenoperationen verstehen und beherrschen"
    band: end-klasse-4
    text: "einfache funktionale Zusammenhänge (zum Beispiel Anzahl – Preis) mithilfe von Material veranschaulichen und beschreiben"
  - code: bw-mathe-2016.k34.1.3.1
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "Sachaufgaben strukturieren, systematisch variieren, lösen und Ergebnisse auf Plausibilität prüfen"
  - code: bw-mathe-2016.k34.1.3.2
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "Aufgaben zu Sachsituationen finden, erstellen und mit mathematischen Mitteln lösen"
  - code: bw-mathe-2016.k34.1.3.3
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "bei Sachaufgaben entscheiden, ob eine Überschlagsrechnung hinreicht oder ein genaues Ergebnis nötig ist"
  - code: bw-mathe-2016.k34.1.3.4
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "mathematische Darstellungen (Zeichnungen, Diagramme, Tabellen, Skalen) zur Lösung nutzen und präsentieren (zum Beispiel Tafel, Plakat, Computer, ...)"
  - code: bw-mathe-2016.k34.1.3.5
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "mathematische Darstellungen in Sachkontexte übersetzen"
  - code: bw-mathe-2016.k34.1.3.6
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "mathematische Darstellungen in andere Darstellungen übertragen und miteinander vergleichen"
  - code: bw-mathe-2016.k34.1.3.7
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "funktionale Beziehungen in Sachsituationen erkennen, beschreiben und entsprechende Aufgaben lösen"
  - code: bw-mathe-2016.k34.1.3.8
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "einfache Sachaufgaben zur Proportionalität lösen"
  - code: bw-mathe-2016.k34.1.3.9
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "einfache kombinatorische Aufgaben handelnd, zeichnerisch oder rechnerisch lösen (zum Beispiel mit und ohne Zurücklegen, mit und ohne Beachtung der Reihenfolge)"
  - code: bw-mathe-2016.k34.1.3.10
    kind: content
    area: "Zahlen und Operationen"
    group: "3.2.1.3 In Kontexten rechnen"
    band: end-klasse-4
    text: "Knobelaufgaben durch Probieren lösen (zum Beispiel ungeordnetes und systematisches Probieren)"
  - code: bw-mathe-2016.k34.2.1.1
    kind: content
    area: "Raum und Form"
    group: "3.2.2.1 Sich im Raum orientieren"
    band: end-klasse-4
    text: "räumliche Beziehungen erkennen, beschreiben und nutzen (Anordnungen, Wege, Pläne, Ansichten)"
  - code: bw-mathe-2016.k34.2.1.2
    kind: content
    area: "Raum und Form"
    group: "3.2.2.1 Sich im Raum orientieren"
    band: end-klasse-4
    text: "räumliche Konfigurationen in verschiedenen Positionen beschreiben, Zusammenhänge erkennen und Perspektivwechsel durchführen"
  - code: bw-mathe-2016.k34.2.1.3
    kind: content
    area: "Raum und Form"
    group: "3.2.2.1 Sich im Raum orientieren"
    band: end-klasse-4
    text: "sich räumliche Konfigurationen vorstellen und in Gedanken damit operieren (zum Beispiel Abbildungen von ebenen Figuren, Würfelbauten, Kantenmodelle, Schrägbilder, ...)"
  - code: bw-mathe-2016.k34.2.1.4
    kind: content
    area: "Raum und Form"
    group: "3.2.2.1 Sich im Raum orientieren"
    band: end-klasse-4
    text: "geometrische Probleme mithilfe ihres räumlichen Vorstellungsvermögens lösen (zwei- und dreidimensionale Darstellungen von Bauwerken in Beziehung setzen, nach Vorlage bauen, Baupläne erstellen)"
  - code: bw-mathe-2016.k34.2.2.1
    kind: content
    area: "Raum und Form"
    group: "3.2.2.2 Geometrische Figuren erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "Linien, ebene Figuren und Muster frei Hand und mit Hilfsmitteln zeichnen (zum Beispiel Lineal, Schablone, Geodreieck, Zirkel)"
  - code: bw-mathe-2016.k34.2.2.2
    kind: content
    area: "Raum und Form"
    group: "3.2.2.2 Geometrische Figuren erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "ebene Figuren erkennen und benennen, auch in ihrer Erfahrungswelt (Rechteck, Quadrat, Dreieck, Kreis)"
  - code: bw-mathe-2016.k34.2.2.3
    kind: content
    area: "Raum und Form"
    group: "3.2.2.2 Geometrische Figuren erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "ebene Figuren beschreiben, untersuchen und nach Eigenschaften sortieren (Ecke, Seite, parallel, senkrecht)"
  - code: bw-mathe-2016.k34.2.2.4
    kind: content
    area: "Raum und Form"
    group: "3.2.2.2 Geometrische Figuren erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "ebene Figuren herstellen und zeichnen (zum Beispiel frei Hand, mit Lineal, Geodreieck, Zirkel, kariertes und unliniertes Papier)"
  - code: bw-mathe-2016.k34.2.2.5
    kind: content
    area: "Raum und Form"
    group: "3.2.2.2 Geometrische Figuren erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "Körper erkennen und benennen, auch in ihrer Erfahrungswelt (Quader, Würfel, Kugel, Zylinder)"
  - code: bw-mathe-2016.k34.2.2.6
    kind: content
    area: "Raum und Form"
    group: "3.2.2.2 Geometrische Figuren erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "Körper beschreiben, untersuchen und nach Eigenschaften sortieren (Ecke, Kante, Fläche)"
  - code: bw-mathe-2016.k34.2.2.7
    kind: content
    area: "Raum und Form"
    group: "3.2.2.2 Geometrische Figuren erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "Körper herstellen (zum Beispiel Kantenmodell, Vollmodell, Flächenmodell)"
  - code: bw-mathe-2016.k34.2.2.8
    kind: content
    area: "Raum und Form"
    group: "3.2.2.2 Geometrische Figuren erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "Quader- und Würfelnetze (zum Beispiel durch Abwickeln) herstellen, zeichnen und untersuchen"
  - code: bw-mathe-2016.k34.2.3.1
    kind: content
    area: "Raum und Form"
    group: "3.2.2.3 Einfache geometrische Abbildungen erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "achsensymmetrische Figuren herstellen (zum Beispiel falten, schneiden und zeichnen)"
  - code: bw-mathe-2016.k34.2.3.2
    kind: content
    area: "Raum und Form"
    group: "3.2.2.3 Einfache geometrische Abbildungen erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "die Achsensymmetrie ebener Figuren erkennen, beschreiben und nutzen, auch aus ihrer Erfahrungswelt (Spiegelachse, symmetrisch)"
  - code: bw-mathe-2016.k34.2.3.3
    kind: content
    area: "Raum und Form"
    group: "3.2.2.3 Einfache geometrische Abbildungen erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "vorgegebene geometrische Figuren zu achsensymmetrischen Figuren vervollständigen"
  - code: bw-mathe-2016.k34.2.3.4
    kind: content
    area: "Raum und Form"
    group: "3.2.2.3 Einfache geometrische Abbildungen erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "ebene Figuren in Gitternetzen zeichnen sowie vergrößern und verkleinern"
  - code: bw-mathe-2016.k34.2.3.5
    kind: content
    area: "Raum und Form"
    group: "3.2.2.3 Einfache geometrische Abbildungen erkennen, benennen und darstellen"
    band: end-klasse-4
    text: "geometrische Muster erkennen, beschreiben und fortsetzen sowie systematisch verändern und selbst entwickeln (zum Beispiel Bandornamente, Parkettierungen)"
  - code: bw-mathe-2016.k34.2.4.1
    kind: content
    area: "Raum und Form"
    group: "3.2.2.4 Flächen- und Rauminhalte messen und vergleichen"
    band: end-klasse-4
    text: "den Umfang ebener Figuren handelnd bestimmen und untersuchen (zum Beispiel mit Faden, Lineal, durch Abzählen)"
  - code: bw-mathe-2016.k34.2.4.2
    kind: content
    area: "Raum und Form"
    group: "3.2.2.4 Flächen- und Rauminhalte messen und vergleichen"
    band: end-klasse-4
    text: "den Flächeninhalt ebener Figuren durch Auslegen messen, bestimmen und durch Zerlegen vergleichen"
  - code: bw-mathe-2016.k34.2.4.3
    kind: content
    area: "Raum und Form"
    group: "3.2.2.4 Flächen- und Rauminhalte messen und vergleichen"
    band: end-klasse-4
    text: "den Rauminhalt von Körpern vergleichen (zum Beispiel durch Umfüllen) oder mittels Einheitswürfeln bestimmen"
  - code: bw-mathe-2016.k34.3.1.1
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.1 Größenvorstellungen besitzen"
    band: end-klasse-4
    text: "Größen handelnd vergleichen (zum Beispiel Kleiderbügelwaage, Umfüllen)"
  - code: bw-mathe-2016.k34.3.1.2
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.1 Größenvorstellungen besitzen"
    band: end-klasse-4
    text: "mit geeigneten Einheiten in allen relevanten Größenbereichen messen: nichtstandardisiert und standardisiert Längen (km, m, cm, mm) Geldwerte (€, Cent) Zeit (Jahr, Monat, Woche, Tag, h, min, s) Gewichte (t, kg, g) Rauminhalt (l, ml)"
  - code: bw-mathe-2016.k34.3.1.3
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.1 Größenvorstellungen besitzen"
    band: end-klasse-4
    text: "Größenangaben in unterschiedlichen Schreibweisen darstellen und Größenangaben in benachbarte Einheiten umwandeln"
  - code: bw-mathe-2016.k34.3.1.4
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.1 Größenvorstellungen besitzen"
    band: end-klasse-4
    text: "im Alltag vorkommende einfache Bruchzahlen \\( \\left( \\frac{ 1 }{ 4 }, \\frac{ 1 }{ 2 }, \\frac{ 3 }{ 4 }, 1 \\frac{ 1 }{ 4 } \\right) \\) in Verbindung mit Größenangaben nutzen"
  - code: bw-mathe-2016.k34.3.1.5
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.1 Größenvorstellungen besitzen"
    band: end-klasse-4
    text: "zu Repräsentanten aus ihrer Erfahrungswelt passende Größenangaben nennen und Größenangaben passende Repräsentanten zuordnen (zum Beispiel Gewichte: 1 g – Reißnagel, 100 g – Tafel Schokolade, 250 g – Päckchen Butter, 1 kg – Päckchen Mehl, 1 t – Kleinwagen)"
  - code: bw-mathe-2016.k34.3.1.6
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.1 Größenvorstellungen besitzen"
    band: end-klasse-4
    text: "unterschiedliche Messgeräte sachgerecht nutzen (zum Beispiel Meterstab, Bandmaß, Lineal, Uhren, Messbecher)"
  - code: bw-mathe-2016.k34.3.1.7
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.1 Größenvorstellungen besitzen"
    band: end-klasse-4
    text: "ihre Größenvorstellungen beim Schätzen anwenden"
  - code: bw-mathe-2016.k34.3.2.1
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.2 Größen in Sachsituationen anwenden"
    band: end-klasse-4
    text: "wichtige Bezugsgrößen aus ihrer Erfahrungswelt zum Lösen von Sachproblemen heranziehen"
  - code: bw-mathe-2016.k34.3.2.2
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.2 Größen in Sachsituationen anwenden"
    band: end-klasse-4
    text: "Größenangaben aus Darstellungen der realen Welt entnehmen, dokumentieren und deuten (Tabelle, Bilder, Texte)"
  - code: bw-mathe-2016.k34.3.2.3
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.2 Größen in Sachsituationen anwenden"
    band: end-klasse-4
    text: "Sachprobleme aus ihrer Erfahrungswelt lösen und dabei auch passende Näherungswerte verwenden, Größen begründet schätzen"
  - code: bw-mathe-2016.k34.3.2.4
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.2 Größen in Sachsituationen anwenden"
    band: end-klasse-4
    text: "in Sachsituationen funktionale Beziehungen erkennen, auf angemessene Weise darstellen (zum Beispiel Tabelle, Diagramm) und untersuchen"
  - code: bw-mathe-2016.k34.3.2.5
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.2 Größen in Sachsituationen anwenden"
    band: end-klasse-4
    text: "proportionale Beziehungen zur Lösung einfacher Sachprobleme einsetzen"
  - code: bw-mathe-2016.k34.3.2.6
    kind: content
    area: "Größen und Messen"
    group: "3.2.3.2 Größen in Sachsituationen anwenden"
    band: end-klasse-4
    text: "eigene Sachaufgaben erfinden"
  - code: bw-mathe-2016.k34.4.1.1
    kind: content
    area: "Daten, Häufigkeit und Wahrscheinlichkeit"
    group: "3.2.4.1 Daten erfassen und darstellen"
