    band: end-klasse-2
    process: "argumentieren | modellieren"
    text: "lösen Sachsituationen mit Größen und nutzen dabei bekannte Bezugsgrößen aus ihrer Erfahrungswelt (z. B. bei Fermi-Aufgaben) und sinnvolle Bearbeitungshilfen (z. B. Rollenspiel, Zeichnungen, einfache Skizzen)"
  - code: by-mathe-2014.j12.3.3.3
    kind: content
    area: "Größen und Messen"
    group: "3.3 Mit Größen in Sachsituationen umgehen"
    band: end-klasse-2
    process: "argumentieren | modellieren"
    text: "überprüfen nachvollziehbar die Plausibilität der Lösung von Sachproblemen mit Größen unter Rückbezug auf den Sachzusammenhang (z. B. Kann es sein, dass ein Eis 40 € kostet?)"
  - code: by-mathe-2014.j12.4.1.1
    kind: content
    area: "Daten und Zufall"
    group: "4.1 Daten erfassen und strukturiert darstellen"
    band: end-klasse-2
    process: "modellieren | Darstellungen verwenden"
    text: "sammeln und vergleichen Daten (z. B. Lebensalter der Mitschülerinnen und Mitschüler) aus ihrer unmittelbaren Lebenswirklichkeit (z. B. durch Befragung von Personen, durch Beobachtungen zum Wetter) und stellen sie in Strichlisten, einfachen Schaubildern und Tabellen strukturiert dar"
  - code: by-mathe-2014.j12.4.1.2
    kind: content
    area: "Daten und Zufall"
    group: "4.1 Daten erfassen und strukturiert darstellen"
    band: end-klasse-2
    process: "Darstellungen verwenden | kommunizieren"
    text: "entnehmen relevante Daten und Informationen aus verschiedenen Quellen (z. B. Kalender, einfache Tabellen oder Schaubilder) und beschreiben deren Bedeutung"
  - code: by-mathe-2014.j12.4.1.3
    kind: content
    area: "Daten und Zufall"
    group: "4.1 Daten erfassen und strukturiert darstellen"
    band: end-klasse-2
    process: "Probleme lösen | modellieren"
    text: "formulieren zu einfachen Tabellen und Schaubildern, auch im Austausch mit anderen, mathematisch sinnvolle Fragen und ziehen Daten zur Beantwortung heran (z. B. zur Frage: Wie viele Kinder in unserer Klasse haben Haustiere?)"
  - code: by-mathe-2014.j12.4.2.1
    kind: content
    area: "Daten und Zufall"
    group: "4.2 Zufallsexperimente durchführen und Wahrscheinlichkeiten vergleichen"
    band: end-klasse-2
    process: "modellieren | Darstellungen verwenden | kommunizieren"
    text: "führen einfache Zufallsexperimente (z. B. Ziehen von Kugeln aus verschiedenen Säckchen) durch, um sie gemeinsam zu vergleichen, und ziehen einfache Schlüsse (z. B. In einem weißen und einem schwarzen Säckchen sind gleich viele Kugeln; im weißen Säckchen ist die Anzahl der roten Kugeln größer. Also ist die Chance, eine rote Kugel zu ziehen, beim weißen Säckchen größer als beim schwarzen.)"
  - code: by-mathe-2014.j12.4.2.2
    kind: content
    area: "Daten und Zufall"
    group: "4.2 Zufallsexperimente durchführen und Wahrscheinlichkeiten vergleichen"
    band: end-klasse-2
    process: "Darstellungen verwenden | kommunizieren"
    text: "verwenden zur Beschreibung einfacher Zufallsexperimente die Grundbegriffe sicher, möglich und unmöglich sowie die Begriffe wahrscheinlich und unwahrscheinlich in ihrer alltagssprachlichen Bedeutung"
  - code: by-mathe-2014.j34.1.1.1
    kind: content
    area: "Zahlen und Operationen"
    group: "1.1 Zahlen strukturiert darstellen und Zahlbeziehungen formulieren"
    band: end-klasse-4
    process: "argumentieren | Darstellungen verwenden"
    text: "orientieren sich im Zahlenraum bis zur Million durch flexibles Zählen (vorwärts, rückwärts, in Schritten); sie ordnen und vergleichen Zahlen (auch anhand des Zahlenstrahls) und begründen Beziehungen zwischen Zahlen (z. B. Teiler, Vielfache)"
  - code: by-mathe-2014.j34.1.1.2
    kind: content
    area: "Zahlen und Operationen"
    group: "1.1 Zahlen strukturiert darstellen und Zahlbeziehungen formulieren"
    band: end-klasse-4
    process: "argumentieren | Darstellungen verwenden"
    text: "erkennen und nutzen Strukturen bei der Zahlerfassung (z. B. 1000 als 10 H oder als 100 Z) und begründen ihre Vorgehensweise"
  - code: by-mathe-2014.j34.1.1.3
    kind: content
    area: "Zahlen und Operationen"
    group: "1.1 Zahlen strukturiert darstellen und Zahlbeziehungen formulieren"
    band: end-klasse-4
    process: "Darstellungen verwenden | kommunizieren"
    text: "nutzen planvoll und systematisch die Struktur des Zehnersystems (Bündelung, Stellenwert) und begründen Beziehungen zwischen verschiedenen Zahldarstellungen (z. B. Stellenwertschreibweise, Stufenschrift: 734 → 7H 3Z 4E, Zahlwort, Einerwürfel/Zehnerstangen/Hunderterplatten), um sicher über das dekadische Stellenwertsystem zu verfügen"
  - code: by-mathe-2014.j34.1.1.4
    kind: content
    area: "Zahlen und Operationen"
    group: "1.1 Zahlen strukturiert darstellen und Zahlbeziehungen formulieren"
    band: end-klasse-4
    process: "argumentieren | Probleme lösen"
    text: "schätzen und bestimmen Anzahlen (z. B. Reiskörner) und vergleichen Zahlen im Zahlenraum bis zur Million unter Verwendung von Fachbegriffen; sie begründen und bewerten dabei verschiedene Vorgehensweisen (z. B. bei Fermi-Aufgaben)"
  - code: by-mathe-2014.j34.1.1.5
    kind: content
    area: "Zahlen und Operationen"
    group: "1.1 Zahlen strukturiert darstellen und Zahlbeziehungen formulieren"
    band: end-klasse-4
    process: "Darstellungen verwenden | kommunizieren"
    text: "zerlegen Zahlen im Zahlenraum bis zur Million (z. B. 1000 = 100 + 900; 10000 = 1000 + 9000; 100000 = 10000 + 90000; 100000 = 10 ∙ 10000) und erläutern dabei Zusammenhänge und Strukturen"
  - code: by-mathe-2014.j34.1.2.1
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis zur Million rechnen und Strukturen nutzen"
    band: end-klasse-4
    process: "Probleme lösen | Darstellungen verwenden"
    text: "wenden die Zahlensätze des kleinen Einmaleins sowie deren Umkehrungen (z. B. 42 : 7 = 6 oder 42 : 6 = 7 als Umkehrungen von 6 ∙ 7 = 42) automatisiert und flexibel an"
  - code: by-mathe-2014.j34.1.2.2
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis zur Million rechnen und Strukturen nutzen"
    band: end-klasse-4
    process: "argumentieren"
    text: "übertragen, auch beim Kopfrechnen, ihre Kenntnisse zu den Zahlensätzen des kleinen Einmaleins sowie des Einspluseins bis 20 in größere Zahlenräume (z. B. 6 ∙ 4 = 24 → 60 ∙ 4 = 240, 12 + 3 = 15 → 120 + 30 = 150) und verwenden dabei die Fachbegriffe addieren, subtrahieren, multiplizieren, dividieren, Summe und Differenz"
  - code: by-mathe-2014.j34.1.2.3
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis zur Million rechnen und Strukturen nutzen"
    band: end-klasse-4
    process: "Darstellungen verwenden | kommunizieren"
    text: "lösen Aufgaben im Zahlenraum bis zur Million zu allen vier Grundrechenarten"
  - code: by-mathe-2014.j34.1.2.4
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis zur Million rechnen und Strukturen nutzen"
    band: end-klasse-4
    process: "argumentieren | Probleme lösen"
    text: "nutzen und erklären Rechenstrategien und entwickeln vorteilhafte Lösungswege; sie vergleichen und bewerten Rechenwege und begründen ihre Ergebnisse"
  - code: by-mathe-2014.j34.1.2.5
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis zur Million rechnen und Strukturen nutzen"
    band: end-klasse-4
    process: "argumentieren | Darstellungen verwenden"
    text: "entscheiden passend zu einer gegebenen Aufgabe, welche Art der Berechnung zur Lösung angemessen ist (im Kopf, halbschriftlich, schriftlich) und erstellen sinnvolle und nachvollziehbare Notizen (z. B. Rechenstrich, Zwischenergebnisse, Teilrechnungen)"
  - code: by-mathe-2014.j34.1.2.6
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis zur Million rechnen und Strukturen nutzen"
    band: end-klasse-4
    process: "Darstellungen verwenden"
    text: "wenden automatisiert die schriftlichen Verfahren der Addition, der Subtraktion (Abziehverfahren), der Multiplikation (ein- und zweistellige Multiplikatoren) und der Division (Divisoren bis einschließlich 10, auch mit Rest) an"
  - code: by-mathe-2014.j34.1.2.7
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis zur Million rechnen und Strukturen nutzen"
    band: end-klasse-4
    process: "argumentieren"
    text: "begründen, ob Ergebnisse plausibel und richtig sind, indem sie Rechenfehler finden, erklären und korrigieren sowie Ergebnisse durch Überschlag oder Rückbezug auf den Sachzusammenhang überprüfen"
  - code: by-mathe-2014.j34.1.2.8
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis zur Million rechnen und Strukturen nutzen"
    band: end-klasse-4
    process: "argumentieren | Probleme lösen"
    text: "beschreiben arithmetische Muster und deren Gesetzmäßigkeit (z. B. beim Rechnen mit ANNA-Zahlen)"
  - code: by-mathe-2014.j34.1.2.9
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis zur Million rechnen und Strukturen nutzen"
    band: end-klasse-4
    process: "modellieren | Darstellungen verwenden"
    text: "entwickeln arithmetische Muster, setzen diese fort und verändern sie systematisch (z. B. Zahlenfolgen, Aufgabenfolgen mit strukturierten Päckchen)"
  - code: by-mathe-2014.j34.1.3.1
    kind: content
    area: "Zahlen und Operationen"
    group: "1.3 Sachsituationen und Mathematik in Beziehung setzen"
    band: end-klasse-4
    process: "modellieren | kommunizieren"
    text: "entnehmen relevante Informationen aus verschiedenen Quellen (z. B. aus Texten oder Tabellen) und formulieren dazu mathematische Fragestellungen"
  - code: by-mathe-2014.j34.1.3.2
    kind: content
    area: "Zahlen und Operationen"
    group: "1.3 Sachsituationen und Mathematik in Beziehung setzen"
    band: end-klasse-4
    process: "argumentieren | modellieren"
    text: "zeigen bei mehrschrittigen Sachaufgaben Zusammenhänge zwischen den einzelnen Lösungsschritten und der Sachsituation auf und begründen diese auch im Austausch mit anderen"
  - code: by-mathe-2014.j34.1.3.3
    kind: content
    area: "Zahlen und Operationen"
    group: "1.3 Sachsituationen und Mathematik in Beziehung setzen"
    band: end-klasse-4
    process: "argumentieren | modellieren"
    text: "entwickeln, nutzen und bewerten geeignete Darstellungsformen (z. B. Skizzen, Begriffstripel, Texte, Tabellen, Diagramme) für das Bearbeiten mathematischer Probleme"
  - code: by-mathe-2014.j34.1.3.4
    kind: content
    area: "Zahlen und Operationen"
    group: "1.3 Sachsituationen und Mathematik in Beziehung setzen"
    band: end-klasse-4
    process: "modellieren | kommunizieren"
    text: "erweitern und verkürzen Sachsituationen, um Zusammenhänge zu erfassen und zu erklären, und beschaffen sich ggf. geeignete, noch fehlende Informationen (z. B. bei Fermi-Aufgaben)"
  - code: by-mathe-2014.j34.1.3.5
    kind: content
    area: "Zahlen und Operationen"
    group: "1.3 Sachsituationen und Mathematik in Beziehung setzen"
    band: end-klasse-4
    process: "argumentieren | Darstellungen verwenden"
    text: "entwickeln und nutzen Strategien zur Problemlösung (z. B. Vorwärts- oder Rückwärtsarbeiten) und übertragen diese Strategien auf analoge Aufgaben"
  - code: by-mathe-2014.j34.1.3.6
    kind: content
    area: "Zahlen und Operationen"
    group: "1.3 Sachsituationen und Mathematik in Beziehung setzen"
    band: end-klasse-4
    process: "argumentieren | Probleme lösen"
    text: "finden mathematische Lösungen zu Sachsituationen, vergleichen und wertschätzen ihre Lösungswege und begründen auch im Austausch mit anderen, ob ein genaues Ergebnis notwendig ist oder eine Überschlagsrechnung ausreicht (z. B. in Rechenkonferenzen)"
  - code: by-mathe-2014.j34.1.3.7
    kind: content
    area: "Zahlen und Operationen"
    group: "1.3 Sachsituationen und Mathematik in Beziehung setzen"
    band: end-klasse-4
    process: "Probleme lösen | Darstellungen verwenden"
    text: "bestimmen die Anzahl der verschiedenen Möglichkeiten bei einfachen kombinatorischen Aufgabenstellungen (z. B. mögliche Kombinationen von 3 T-Shirts, 3 Hosen und 2 Paar Socken) durch probierendes und systematisches Vorgehen und stellen Ergebnisse strukturiert dar (z. B. in Baumdiagrammen, in Zeichnungen oder in Tabellen)"
  - code: by-mathe-2014.j34.2.1.1
    kind: content
    area: "Raum und Form"
    group: "2.1 Sich im Raum orientieren"
    band: end-klasse-4
    process: "Probleme lösen | modellieren | Darstellungen verwenden"
    text: "erstellen Skizzen und Lagepläne und nutzen diese zur Orientierung im Raum sowohl handelnd als auch in ihrer Vorstellung"
  - code: by-mathe-2014.j34.2.1.2
    kind: content
    area: "Raum und Form"
    group: "2.1 Sich im Raum orientieren"
    band: end-klasse-4
    process: "Probleme lösen | modellieren"
    text: "beschreiben den Zusammenhang zwischen Längen in der Realität und entsprechenden Längen in Skizzen, Lageplänen oder Grundrisszeichnungen. Dabei nutzen sie grundlegende Vorstellungen von maßstäblichem Verkleinern, um sich in der Wirklichkeit zu orientieren"
  - code: by-mathe-2014.j34.2.1.3
    kind: content
    area: "Raum und Form"
    group: "2.1 Sich im Raum orientieren"
    band: end-klasse-4
    process: "Probleme lösen | modellieren | Darstellungen verwenden"
    text: "stellen zwischen zwei- und dreidimensionalen Darstellungen von räumlichen Gebilden (z. B. Würfelgebäude) Beziehungen her, indem sie nach Vorlage bauen oder zu räumlichen Gebilden einfache Baupläne erstellen"
  - code: by-mathe-2014.j34.2.1.4
    kind: content
    area: "Raum und Form"
    group: "2.1 Sich im Raum orientieren"
    band: end-klasse-4
    process: "Probleme lösen | kommunizieren"
    text: "operieren mit ebenen Figuren und Körpern handelnd und in der Vorstellung (z. B. Kippbewegungen, Wege am Kantenmodell, gedankliches Falten von Netzen) und beschreiben dabei Vorgehensweisen und Ergebnisse"
  - code: by-mathe-2014.j34.2.2.1
    kind: content
    area: "Raum und Form"
    group: "2.2 Geometrische Figuren benennen und darstellen"
    band: end-klasse-4
    process: "argumentieren"
    text: "verwenden zutreffend den Begriff rechter Winkel bei der Beschreibung bestimmter Flächen- und Körperformen (z. B. bei Rechteck und Quader)"
  - code: by-mathe-2014.j34.2.2.2
    kind: content
    area: "Raum und Form"
    group: "2.2 Geometrische Figuren benennen und darstellen"
    band: end-klasse-4
    process: "Darstellungen verwenden | kommunizieren"
    text: "beschreiben Gemeinsamkeiten und Unterschiede von Würfeln und anderen Quadern und vergleichen deren Kanten- und Flächenmodelle"
  - code: by-mathe-2014.j34.2.2.3
    kind: content
    area: "Raum und Form"
    group: "2.2 Geometrische Figuren benennen und darstellen"
    band: end-klasse-4
    process: "argumentieren | Probleme lösen | Darstellungen verwenden"
    text: "erstellen und strukturieren verschiedene Netze von Würfeln und Netze von Quadern, die keine Würfel sind; sie verwenden den Fachbegriff deckungsgleich bei der Beschreibung von Netzen (z. B. bei der Suche nach deckungsgleichen Würfelnetzen)"
  - code: by-mathe-2014.j34.2.2.4
    kind: content
    area: "Raum und Form"
    group: "2.2 Geometrische Figuren benennen und darstellen"
    band: end-klasse-4
    process: "argumentieren"
    text: "überprüfen und beschreiben begründet den Zusammenhang zwischen Netzen und Körpern"
  - code: by-mathe-2014.j34.2.2.5
    kind: content
    area: "Raum und Form"
    group: "2.2 Geometrische Figuren benennen und darstellen"
    band: end-klasse-4
    process: "Darstellungen verwenden"
    text: "zeichnen Strecken und Flächenformen frei sowie mit Hilfsmitteln (Lineal, Geodreieck, Zirkel) und berücksichtigen dabei die Eigenschaften der Flächenformen"
  - code: by-mathe-2014.j34.2.3.1
    kind: content
    area: "Raum und Form"
    group: "2.3 Geometrische Abbildungen beschreiben und darstellen"
    band: end-klasse-4
    process: "modellieren | Darstellungen verwenden"
    text: "verkleinern und vergrößern ebene Figuren (z. B. mithilfe des Geobretts oder in Gitternetzen) und nutzen dabei grundlegende Vorstellungen zum Maßstab (z. B. 2 : 1 bedeutet: Die Länge 1 cm ist in der Vergrößerung 2 cm / doppelt so lang.)"
  - code: by-mathe-2014.j34.2.3.2
    kind: content
    area: "Raum und Form"
    group: "2.3 Geometrische Abbildungen beschreiben und darstellen"
    band: end-klasse-4
    process: "Darstellungen verwenden | kommunizieren"
    text: "beschreiben Merkmale achsensymmetrischer Figuren mit den Fachbegriffen Symmetrieachse, deckungsgleich und achsensymmetrisch sowie die Beziehung zwischen einer Figur und deren Spiegelbild; sie zeichnen Symmetrieachsen ein und prüfen nach"
  - code: by-mathe-2014.j34.2.3.3
    kind: content
    area: "Raum und Form"
    group: "2.3 Geometrische Abbildungen beschreiben und darstellen"
    band: end-klasse-4
    process: "Darstellungen verwenden | kommunizieren"
    text: "erzeugen achsensymmetrische Figuren sowie Figuren und deren Spiegelbilder (z. B. durch Zeichnen oder mithilfe eines Spiegels) und beschreiben ihre Vorgehensweise"
  - code: by-mathe-2014.j34.2.4.1
    kind: content
    area: "Raum und Form"
    group: "2.4 Geometrische Muster untersuchen und erstellen"
    band: end-klasse-4
    process: "Darstellungen verwenden | kommunizieren"
    text: "erstellen Parkettierungen und beschreiben deren Gesetzmäßigkeiten"
  - code: by-mathe-2014.j34.2.4.2
    kind: content
    area: "Raum und Form"
    group: "2.4 Geometrische Muster untersuchen und erstellen"
    band: end-klasse-4
    process: "argumentieren | Darstellungen verwenden"
    text: "bestimmen und erklären Gesetzmäßigkeiten (z. B. achsensymmetrische Teilelemente) in Bandornamenten, verändern diese oder setzen sie fort"
  - code: by-mathe-2014.j34.2.5.1
    kind: content
    area: "Raum und Form"
    group: "2.5 Rauminhalte bestimmen und vergleichen"
    band: end-klasse-4
    process: "modellieren | Darstellungen verwenden"
    text: "vergleichen Rauminhalte einfacher Körper durch Bauen mit Einheitswürfeln und durch Auszählen von Einheitswürfeln. Dabei greifen sie auf ihre Kenntnisse zur Messung von Flächeninhalten zurück"
  - code: by-mathe-2014.j34.3.1.1
    kind: content
    area: "Größen und Messen"
    group: "3.1 Messhandlungen durchführen"
    band: end-klasse-4
    process: "Probleme lösen | kommunizieren"
    text: "messen Größen mit selbst gewählten und standardisierten Maßeinheiten (Kilometer und Millimeter, Sekunde, Kilogramm und Gramm, Liter und Milliliter) sowie mit geeigneten Messgeräten (z. B. Meterzähler, Messbecher, Stoppuhr)"
  - code: by-mathe-2014.j34.3.1.2
    kind: content
    area: "Größen und Messen"
    group: "3.1 Messhandlungen durchführen"
    band: end-klasse-4
    process: "Darstellungen verwenden"
    text: "verwenden Abkürzungen zu den standardisierten Maßeinheiten (km und mm, s, kg und g, l und ml) und notieren Messergebnisse bei Meter und Zentimeter sowie bei Euro und Cent auch mit dem im Alltagsgebrauch üblichen Komma"
  - code: by-mathe-2014.j34.3.1.3
    kind: content
    area: "Größen und Messen"
    group: "3.1 Messhandlungen durchführen"
    band: end-klasse-4
    process: "argumentieren | Probleme lösen"
    text: "zerlegen Einheiten innerhalb eines Größenbereichs, wandeln Einheiten um (z. B. 1 l Wasser umfüllen in zwei 500 ml fassende Messbecher oder in vier 250 ml fassende Gefäße) und wechseln Geldbeträge"
  - code: by-mathe-2014.j34.3.1.4
    kind: content
    area: "Größen und Messen"
    group: "3.1 Messhandlungen durchführen"
    band: end-klasse-4
    process: "modellieren | kommunizieren"
    text: "berechnen Zeitspannen sowie Anfangs- und Endzeitpunkte; sie berücksichtigen dabei die Besonderheit des Größenbereiches Zeitspannen (z. B 1 h hat 60 min, 1 min hat 60 s, 1 Tag hat 24 h) und notieren Ergebnisse auch in gemischter Schreibweise (z. B. 1 h 25 min)"
  - code: by-mathe-2014.j34.3.2.1
    kind: content
    area: "Größen und Messen"
    group: "3.2 Größen strukturieren und Größenvorstellungen nutzen"
    band: end-klasse-4
    process: "argumentieren | modellieren"
    text: "schätzen Größen mithilfe von Bezugsgrößen aus der Erfahrungswelt (z. B. Bezugsgrößen für 500&thinsp;ml, 1&thinsp;l, 1&thinsp;kg, 1&thinsp;km) und begründen die Ergebnisse ihrer jeweiligen Schätzung"
  - code: by-mathe-2014.j34.3.2.2
    kind: content
    area: "Größen und Messen"
    group: "3.2 Größen strukturieren und Größenvorstellungen nutzen"
    band: end-klasse-4
    process: "argumentieren | modellieren | Darstellungen verwenden"
    text: "vergleichen und ordnen Längen, Zeitspannen, Massen sowie Hohlmaße; sie überprüfen ihre Ergebnisse ggf. durch Messen und diskutieren diese im Hinblick auf Plausibilität"
  - code: by-mathe-2014.j34.3.2.3
    kind: content
    area: "Größen und Messen"
    group: "3.2 Größen strukturieren und Größenvorstellungen nutzen"
    band: end-klasse-4
    process: "argumentieren | modellieren | Darstellungen verwenden"
