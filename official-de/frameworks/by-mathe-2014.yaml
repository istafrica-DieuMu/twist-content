    text: "beschreiben Ergebnisse von Handlungen (z. B. Falten, Zerlegen, Drehen, Zusammenfügen), die an Flächenformen praktisch und in der Vorstellung durchgeführt werden"
  - code: by-mathe-2014.j12.2.2.1
