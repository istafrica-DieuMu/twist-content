    band: end-klasse-2
    process: "Darstellungen verwenden | kommunizieren"
    text: "bestimmen und beschreiben Gesetzmäßigkeiten (z. B. Wiederholungen) in geometrischen Mustern und setzen diese fort"
  - code: by-mathe-2014.j12.2.5.1
