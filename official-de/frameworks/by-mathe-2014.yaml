    text: "verwenden die Lagebegriffe links/rechts, neben, zwischen, oben/unten, vor/hinter, über/unter, auf/unter und hinten/vorne, um die Lage von Gegenständen bezüglich des eigenen Körpers und Lagebeziehungen von Gegenständen im Raum treffend zu beschreiben"
  - code: by-mathe-2014.j12.2.1.2
