    area: "Raum und Form"
    group: "2.2 Geometrische Figuren benennen und darstellen"
    band: end-klasse-2
    process: "kommunizieren"
    text: "ordnen die Begriffe Zylinder, Prisma, Quader, Würfel, Kegel, Pyramide und Kugel den jeweiligen Körperformen korrekt und routiniert zu"
