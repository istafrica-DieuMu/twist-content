    process: "Probleme lösen | kommunizieren"
    text: "vergleichen, beschreiben und sortieren Flächen- und Körperformen nach selbst gefundenen und vorgegebenen Kriterien (z. B. … kann rollen oder … kann kippen, Anzahl der Ecken und Kanten, Art der Begrenzungsflächen)"
  - code: by-mathe-2014.j12.2.2.2
