  - code: by-mathe-2014.j12.3.1.1
    kind: content
    area: "Größen und Messen"
    group: "3.1 Messhandlungen durchführen"
    band: end-klasse-2
    process: "Probleme lösen | kommunizieren"
    text: "messen Größen mit selbst gewählten Maßeinheiten, geben ihre Messergebnisse mit Maßzahl und der verwendeten Maßeinheit an (z. B. 2 Daumenbreiten, 5 Handspannen, 3 Fuß) und vergleichen Messergebnisse"
  - code: by-mathe-2014.j12.3.1.2
