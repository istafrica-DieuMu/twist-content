    text: "vergleichen Messhandlungen und -ergebnisse beim Messen mit selbst gewählten und standardisierten Maßeinheiten und beurteilen deren Vor- und Nachteile"
  - code: by-mathe-2014.j12.3.1.6
    kind: content
    area: "Größen und Messen"
    group: "3.1 Messhandlungen durchführen"
    band: end-klasse-2
    process: "modellieren | kommunizieren"
    text: "lesen Uhrzeiten ab und bestimmen einfache Zeitspannen über Anfangs- und Endzeitpunkt (z. B. vor vier Stunden, drei Stunden später)"
