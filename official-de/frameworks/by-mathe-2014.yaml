    band: end-klasse-2
    process: "Darstellungen verwenden"
    text: "erkennen und nutzen die 5er- und 10er-Struktur, um Mengen schnell zu erfassen (z. B. am Zwanzigerfeld und am Hunderterfeld)"
  - code: by-mathe-2014.j12.1.1.4
    kind: content
    area: "Zahlen und Operationen"
    group: "1.1 Zahlen strukturiert darstellen und Zahlbeziehungen formulieren"
    band: end-klasse-2
    process: "Darstellungen verwenden"
    text: "nutzen planvoll und systematisch die Struktur des Zehnersystems (Bündelung, Stellenwert) und führen Zahldarstellungen (z. B. Stellenwertschreibweise, Stufenschrift: 34 → 3Z 4E, Zahlwort, Einerwürfel/Zehnerstangen) ineinander über, um sicher über das dekadische Stellenwertsystem zu verfügen"
  - code: by-mathe-2014.j12.1.1.5
    kind: content
    area: "Zahlen und Operationen"
    group: "1.1 Zahlen strukturiert darstellen und Zahlbeziehungen formulieren"
    band: end-klasse-2
    process: "Darstellungen verwenden"
    text: "schätzen und bestimmen Anzahlen und vergleichen Zahlen im Zahlenraum bis Hundert unter Verwendung der Begriffe ist größer als, ist kleiner als, ist gleich, mehr und weniger sowie der Rechenzeichen &gt, &lt und =, um eine Vorstellung von Größenordnungen zu bekommen"
  - code: by-mathe-2014.j12.1.1.6
    kind: content
    area: "Zahlen und Operationen"
    group: "1.1 Zahlen strukturiert darstellen und Zahlbeziehungen formulieren"
    band: end-klasse-2
    process: "Darstellungen verwenden | kommunizieren"
    text: "zerlegen Zahlen im Zahlenraum bis Hundert additiv (z. B. 10 = 1 + 9; 10 = 9 + 1; 32 = 30 + 2) und erläutern dabei Zusammenhänge mithilfe von strukturierten Darstellungen (z. B. Zwanzigerfeld, Hunderterfeld, Hundertertafel und Einerwürfel/Zehnerstangen)"
  - code: by-mathe-2014.j12.1.1.7
    kind: content
    area: "Zahlen und Operationen"
    group: "1.1 Zahlen strukturiert darstellen und Zahlbeziehungen formulieren"
    band: end-klasse-2
    process: "Darstellungen verwenden | kommunizieren"
    text: "schreiben Ziffern und Zahlen deutlich und achten bei Rechnungen und anderen Notizen (z. B. in Skizzen, Tabellen) auf eine übersichtliche Schreibweise, um Rechenfehlern vorzubeugen"
  - code: by-mathe-2014.j12.1.2.1
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis Hundert rechnen und Strukturen nutzen"
    band: end-klasse-2
    process: "modellieren"
    text: "ordnen den vier Grundrechenarten jeweils verschiedene Handlungen und Sachsituationen zu und umgekehrt (Addition als Vereinigen oder Hinzufügen; Subtraktion als Wegnehmen, Ergänzen oder Bestimmen des Unterschieds; Multiplikation als zeitlich-sukzessives Vervielfachen oder räumlich-simultane Gegebenheit; Division – auch mit Rest – als Aufteilen oder Verteilen); sie begründen damit Zusammenhänge zwischen den Grundrechenarten"
  - code: by-mathe-2014.j12.1.2.2
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis Hundert rechnen und Strukturen nutzen"
    band: end-klasse-2
    process: "Probleme lösen | Darstellungen verwenden"
    text: "wenden die Zahlensätze des Einspluseins bis Zwanzig sowie deren Umkehrungen (z. B. 9 – 7 = 2 als Umkehrung von 2 + 7 = 9) automatisiert und flexibel an, wobei sie ihre Kenntnisse auf analoge Plus- und Minusaufgaben übertragen"
  - code: by-mathe-2014.j12.1.2.3
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis Hundert rechnen und Strukturen nutzen"
    band: end-klasse-2
    process: "Darstellungen verwenden"
    text: "wenden Kernaufgaben des kleinen Einmaleins (Einmaleinssätze mit 1, 2, 5, 10 und die Quadratsätze), deren Umkehrungen (z. B. 14 : 7 = 2 oder 14 : 2 = 7 als Umkehrungen von 2 ∙ 7 = 14) sowie Malaufgaben mit 0 automatisiert und flexibel an"
  - code: by-mathe-2014.j12.1.2.4
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis Hundert rechnen und Strukturen nutzen"
    band: end-klasse-2
    process: "Probleme lösen | Darstellungen verwenden"
    text: "nutzen die Kernaufgaben des kleinen Einmaleins (Einmaleinssätze mit 1, 2, 5, 10 und die Quadratsätze) zur Lösung weiterer Aufgaben (z. B. 9 ∙ 8 → 9 ∙ 8 = 10 ∙&nbsp8 – 1 ∙ 8 → 9 ∙ 8 = 80 - 8 = 72)"
  - code: by-mathe-2014.j12.1.2.5
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis Hundert rechnen und Strukturen nutzen"
    band: end-klasse-2
    process: "argumentieren | Probleme lösen"
    text: "nutzen Rechenstrategien (Rechnen in Schritten, Umkehr- und Tauschaufgaben, analoge Aufgaben, Nachbaraufgaben) sowohl im Zahlenraum bis 20 als auch im Zahlenraum bis 100, vergleichen sowie bewerten Rechenwege und begründen ihre Vorgehensweisen"
  - code: by-mathe-2014.j12.1.2.6
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis Hundert rechnen und Strukturen nutzen"
    band: end-klasse-2
    process: "kommunizieren"
    text: "überprüfen, ob Ergebnisse plausibel und richtig sind; sie finden, erklären und korrigieren Rechenfehler"
  - code: by-mathe-2014.j12.1.2.7
    kind: content
    area: "Zahlen und Operationen"
    group: "1.2 Im Zahlenraum bis Hundert rechnen und Strukturen nutzen"
    band: end-klasse-2
    process: "Probleme lösen | kommunizieren"
    text: "erkennen, beschreiben und entwickeln arithmetische Muster (z. B. fortgesetzte Addition einer Zahl, gleich- und gegensinniges Verändern) und setzen diese folgerichtig fort"
  - code: by-mathe-2014.j12.1.3.1
    kind: content
    area: "Zahlen und Operationen"
