    text: "erstellen Anordnungen aus Körpern und geometrische Muster aus ebenen Figuren, um ihre Kenntnisse (z. B. über Flächenformen) zu vertiefen. Dabei vergleichen und beschreiben sie ihre Vorgehensweise"
  - code: by-mathe-2014.j12.2.4.2
    kind: content
    area: "Raum und Form"
