    area: "Größen und Messen"
    group: "3.1 Messhandlungen durchführen"
    band: end-klasse-2
    process: "Probleme lösen | kommunizieren"
    text: "messen Längen und Zeitspannen mit geeigneten Messgeräten (z. B. Lineal, Maßband, Uhr, Kalender) und geben Messergebnisse mit Maßzahl und standardisierten Maßeinheiten an (Meter und Zentimeter, Stunde und Minute, Woche, Monat, Jahr)"
