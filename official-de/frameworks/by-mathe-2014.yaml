    text: "beschreiben Merkmale achsensymmetrischer Figuren (z. B. zwei „gleiche“ Hälften) und überprüfen die Achsensymmetrie sowohl durch Falten als auch durch Kontrolle mit dem Spiegel"
  - code: by-mathe-2014.j12.2.3.3
    kind: content
    area: "Raum und Form"
    group: "2.3 Geometrische Abbildungen erkennen und darstellen"
    band: end-klasse-2
    process: "argumentieren | Darstellungen verwenden"
    text: "erzeugen einfache achsensymmetrische Figuren (z. B. durch Spannen am Geobrett, Falten oder Klecksen) und beschreiben diese mithilfe der Fachbegriffe achsensymmetrisch und Symmetrieachse"
