    band: end-klasse-2
    process: "Darstellungen verwenden"
    text: "verwenden Abkürzungen zu den standardisierten Maßeinheiten (m und cm, h und min, € und ct) und notieren Messergebnisse in ganzzahligen Maßzahlen, bei € und ct sowie m und cm auch in gemischter Schreibweise (z. B. 9 € 30 ct oder 2 m 15 cm)"
  - code: by-mathe-2014.j12.3.1.5
