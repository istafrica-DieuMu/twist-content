    kind: content
    area: "Größen und Messen"
    group: "3.1 Messhandlungen durchführen"
    band: end-klasse-2
    process: "Darstellungen verwenden | kommunizieren"
    text: "benennen und unterscheiden Münzen und Geldscheine und sind damit in der Lage, Geldbeträge in Euro und Cent zu bestimmen und zu vergleichen"
  - code: by-mathe-2014.j12.3.1.4
    kind: content
    area: "Größen und Messen"
