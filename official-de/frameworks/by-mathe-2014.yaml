    text: "ermitteln und vergleichen Flächeninhalte ebener Figuren durch das Auslegen mit Einheitsflächen oder durch das Zerlegen in Teilflächen und erklären ihre Vorgehensweise"
  - code: by-mathe-2014.j12.2.5.2
