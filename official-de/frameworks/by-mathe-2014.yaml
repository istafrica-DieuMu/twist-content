    process: "Darstellungen verwenden | kommunizieren"
    text: "erzeugen ebene Figuren (z. B. durch Legen, Falten, Spannen am Geobrett) sowie Körperformen (z. B. durch Kneten) und beschreiben sie"
  - code: by-mathe-2014.j12.2.3.1
