    text: "nehmen praktisch und in der Vorstellung verschiedene Perspektiven ein, um Ansichten und Lagebeziehungen (von vorne, von hinten, von links, von rechts, von oben, von unten) zu beschreiben"
  - code: by-mathe-2014.j12.2.1.4
