  - code: by-mathe-2014.j12.3.2.2
    kind: content
    area: "Größen und Messen"
    group: "3.2 Größen strukturieren und Größenvorstellungen nutzen"
    band: end-klasse-2
    process: "argumentieren | Darstellungen verwenden"
