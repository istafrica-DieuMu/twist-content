    area: "Raum und Form"
    group: "2.3 Geometrische Abbildungen erkennen und darstellen"
    band: end-klasse-2
    process: "Darstellungen verwenden"
    text: "zeichnen ebene Figuren frei und mit Lineal in Gitternetzen, aber auch ohne strukturelle Hilfe nach und vergleichen die jeweilige Zeichnung mit der Vorlage, um die Eigenschaften der Figuren bewusst wahrzunehmen und wiederzugeben"
  - code: by-mathe-2014.j12.2.3.2
