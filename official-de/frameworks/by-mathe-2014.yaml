    area: "Raum und Form"
    group: "2.2 Geometrische Figuren benennen und darstellen"
    band: end-klasse-2
    process: "argumentieren | modellieren"
    text: "vergleichen und beschreiben die Eigenschaften von Flächenformen mithilfe der Fachbegriffe Ecke und Seite sowie die Eigenschaften von Körperformen mithilfe der Fachbegriffe Ecke, Kante und Seitenfläche und stellen entsprechende Beziehungen her"
  - code: by-mathe-2014.j12.2.2.3
    kind: content
    area: "Raum und Form"
    group: "2.2 Geometrische Figuren benennen und darstellen"
