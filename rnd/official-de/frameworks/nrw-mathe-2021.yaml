    page: 87
    text: "geben die Zahlensätze des kleinen Einspluseins automatisiert wieder und leiten deren Umkehrungen sicher ab"
  - code: nrw-mathe-2021.zo.schnelles-kopfrechnen.3
    kind: content
    area: "Zahlen und Operationen"
    group: "Schnelles Kopfrechnen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p8
    page: 87
    text: "lösen Aufgaben zum schnellen Kopfrechnen im erweiterten Zahlenraum bis 1.000.000"
  - code: nrw-mathe-2021.zo.schnelles-kopfrechnen.4
    kind: content
    area: "Zahlen und Operationen"
    group: "Schnelles Kopfrechnen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p9
    page: 87
    text: "geben die Kernaufgaben automatisiert wieder und leiten weitere Aufgaben des kleinen Einmaleins daraus ab"
  - code: nrw-mathe-2021.zo.schnelles-kopfrechnen.5
    kind: content
    area: "Zahlen und Operationen"
    group: "Schnelles Kopfrechnen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p9
    page: 87
    text: "geben alle Zahlensätze des kleinen Einmaleins automatisiert wieder und leiten deren Umkehraufgaben sicher ab"
  - code: nrw-mathe-2021.zo.zahlenrechnen.1
    kind: content
    area: "Zahlen und Operationen"
    group: "Zahlenrechnen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p10
    page: 87
    text: "lösen Additions- und Subtraktionsaufgaben im Zahlenraum bis 100 unter Ausnutzung von Rechengesetzen und Zerlegungsstrategien mündlich oder halbschriftlich"
  - code: nrw-mathe-2021.zo.zahlenrechnen.2
    kind: content
    area: "Zahlen und Operationen"
    group: "Zahlenrechnen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p10
    page: 87
    text: "lösen Aufgaben aller vier Grundrechenarten unter Ausnutzung von Rechengesetzen und Zerlegungsstrategien mündlich oder halbschriftlich"
  - code: nrw-mathe-2021.zo.zahlenrechnen.3
    kind: content
    area: "Zahlen und Operationen"
    group: "Zahlenrechnen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p11
    page: 88
    text: "rechnen vorteilhaft mithilfe von Zahlbeziehungen (u. a. Nachbarzahlen) und Rechengesetzen (u. a. Kommutativgesetz)"
  - code: nrw-mathe-2021.zo.zahlenrechnen.4
    kind: content
    area: "Zahlen und Operationen"
    group: "Zahlenrechnen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p11
    page: 88
    text: "rechnen vorteilhaft mithilfe von Zahlbeziehungen und Rechengesetzen bei allen vier Grundrechenarten (u. a. Distributivgesetz, Konstanzgesetz)"
  - code: nrw-mathe-2021.zo.zahlenrechnen.5
    kind: content
    area: "Zahlen und Operationen"
    group: "Zahlenrechnen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p12
    page: 88
    text: "beschreiben (eigene) Rechenwege im Zahlenraum bis 100 für andere nachvollziehbar mündlich oder schriftlich"
  - code: nrw-mathe-2021.zo.zahlenrechnen.6
    kind: content
    area: "Zahlen und Operationen"
    group: "Zahlenrechnen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p12
    page: 88
    text: "beschreiben und bewerten unterschiedliche Rechenwege unter dem Aspekt des vorteilhaften Rechnens im Zahlenraum bis 1.000.000 für andere nachvollziehbar mündlich oder schriftlich"
  - code: nrw-mathe-2021.zo.ziffernrechnen.1
    kind: content
    area: "Zahlen und Operationen"
    group: "Ziffernrechnen"
    band: end-klasse-4
    page: 88
    text: "erläutern die schriftlichen Rechenverfahren der Addition (auch mit mehreren Summanden), der Subtraktion (mit einem Subtrahenden), der Multiplikation (auch mit mehrstelligen Faktoren) und der Division (durch einstellige Divisoren) mit Verwendung der Restschreibweise, indem sie die einzelnen Rechenschritte der Algorithmen an Beispielen in nachvollziehbarer Weise beschreiben"
  - code: nrw-mathe-2021.zo.ziffernrechnen.2
    kind: content
    area: "Zahlen und Operationen"
    group: "Ziffernrechnen"
    band: end-klasse-4
    page: 88
    text: "führen die schriftlichen Rechenverfahren der Addition, Subtraktion und Multiplikation sicher aus"
  - code: nrw-mathe-2021.zo.ueberschlagendes-rechnen.1
    kind: content
    area: "Zahlen und Operationen"
    group: "Überschlagendes Rechnen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p13
    page: 89
    text: "geben die ungefähre Größenordnung der Ergebnisse von Aufgaben im Zahlenraum bis 100 an"
  - code: nrw-mathe-2021.zo.ueberschlagendes-rechnen.2
    kind: content
    area: "Zahlen und Operationen"
    group: "Überschlagendes Rechnen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p13
    page: 89
    text: "geben die ungefähre Größenordnung der Ergebnisse von Aufgaben im Zahlenraum bis 1.000.000 an, runden und schätzen dabei mit aufgabenabhängiger Genauigkeit"
  - code: nrw-mathe-2021.zo.ueberschlagendes-rechnen.3
    kind: content
    area: "Zahlen und Operationen"
    group: "Überschlagendes Rechnen"
    band: end-klasse-2
    spans: true
    page: 89
    text: "setzen die Überschlagsergebnisse zu den Aufgabenanforderungen in Beziehung und prüfen sie auf Plausibilität"
  - code: nrw-mathe-2021.zo.flexibles-rechnen.1
    kind: content
    area: "Zahlen und Operationen"
    group: "Flexibles Rechnen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p14
    page: 89
    text: "entscheiden sich aufgabenbezogen oder nach eigenen Präferenzen für eine Strategie des Zahlenrechnens (stellenweise, schrittweise, Hilfsaufgaben, Kopfrechnen) und berechnen Aufgaben"
  - code: nrw-mathe-2021.zo.flexibles-rechnen.2
    kind: content
    area: "Zahlen und Operationen"
    group: "Flexibles Rechnen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p14
    page: 89
    text: "entscheiden sich aufgabenbezogen nach eigenen Präferenzen für eine Strategie des Zahlenrechnens oder ein schriftliches Normalverfahren, verwenden ggf. digitale Mathematikwerkzeuge und berechnen Aufgaben"
  - code: nrw-mathe-2021.rf.raumorientierung-und-raumvorstellung.1
    kind: content
    area: "Raum und Form"
    group: "Raumorientierung und Raumvorstellung"
    band: end-klasse-4
    pair: nrw-mathe-2021.p15
    page: 89
    text: "orientieren sich nach einem Wegeplan im Raum, auch unter Verwendung digitaler Mathematikwerkzeuge"
  - code: nrw-mathe-2021.rf.raumorientierung-und-raumvorstellung.2
    kind: content
    area: "Raum und Form"
    group: "Raumorientierung und Raumvorstellung"
    band: end-klasse-2
    pair: nrw-mathe-2021.p15
    page: 89
    text: "orientieren sich nach mündlicher Anweisung im Raum"
  - code: nrw-mathe-2021.rf.raumorientierung-und-raumvorstellung.3
    kind: content
    area: "Raum und Form"
    group: "Raumorientierung und Raumvorstellung"
    band: end-klasse-4
    page: 89
    text: "beschreiben räumliche Beziehungen anhand von u. a. bildhaften Darstellungen, Anordnungen, Plänen und aus der Vorstellung"
  - code: nrw-mathe-2021.rf.raumorientierung-und-raumvorstellung.4
    kind: content
    area: "Raum und Form"
    group: "Raumorientierung und Raumvorstellung"
    band: end-klasse-2
    pair: nrw-mathe-2021.p16
    page: 89
    text: "beschreiben Wege und Lagebeziehungen (u. a. rechts, links, über, unter, hinter, vor) zwischen konkreten oder bildlich dargestellten Gegenständen"
  - code: nrw-mathe-2021.rf.raumorientierung-und-raumvorstellung.5
    kind: content
    area: "Raum und Form"
    group: "Raumorientierung und Raumvorstellung"
    band: end-klasse-4
    pair: nrw-mathe-2021.p16
    page: 89
    text: "verändern die Lage von ebenen Figuren und Körpern in der Vorstellung und benennen das Ergebnis der Bewegung (u. a. Kippbewegungen eines Würfels)"
  - code: nrw-mathe-2021.rf.ebene-figuren.1
    kind: content
    area: "Raum und Form"
    group: "Ebene Figuren"
    band: end-klasse-2
    pair: nrw-mathe-2021.p17
    page: 90
    text: "identifizieren die geometrischen Grundformen (Rechteck, Quadrat, Dreieck, Kreis) und beschreiben diese mit Fachbegriffen (Seite, Ecke, Kante, Fläche)"
  - code: nrw-mathe-2021.rf.ebene-figuren.2
    kind: content
    area: "Raum und Form"
    group: "Ebene Figuren"
    band: end-klasse-4
    pair: nrw-mathe-2021.p17
    page: 90
    text: "identifizieren weitere ebene Figuren (u. a. Sechseck, Achteck, Parallelogramm) und beschreiben diese mit Fachbegriffen (u. a. senkrecht, waagerecht, parallel, rechter Winkel)"
  - code: nrw-mathe-2021.rf.ebene-figuren.3
    kind: content
    area: "Raum und Form"
    group: "Ebene Figuren"
    band: end-klasse-4
    pair: nrw-mathe-2021.p18
    page: 90
    text: "stellen Muster durch Fortsetzen her (u. a. Bandornamente, Parkettierungen), beschreiben sie und erfinden eigene Muster, auch unter Verwendung digitaler Mathematikwerkzeuge"
  - code: nrw-mathe-2021.rf.ebene-figuren.4
    kind: content
    area: "Raum und Form"
    group: "Ebene Figuren"
    band: end-klasse-2
    pair: nrw-mathe-2021.p18
    page: 90
    text: "stellen Muster durch Legen und Fortsetzen her, beschreiben sie und erfinden eigene Muster, auch unter Verwendung digitaler Mathematikwerkzeuge"
  - code: nrw-mathe-2021.rf.ebene-figuren.5
    kind: content
    area: "Raum und Form"
    group: "Ebene Figuren"
    band: end-klasse-4
    page: 90
    text: "bestimmen und vergleichen den Flächeninhalt ebener Figuren und deren Umfang (u. a. durch Auslegen mit Einheitsquadraten oder Zerlegen in Teilstücke), auch unter Verwendung digitaler Mathematikwerkzeuge"
  - code: nrw-mathe-2021.rf.ebene-figuren.6
    kind: content
    area: "Raum und Form"
    group: "Ebene Figuren"
    band: end-klasse-2
    pair: nrw-mathe-2021.p19
    page: 90
    text: "stellen ebene Figuren her durch Legen, Nachlegen und Auslegen, Zerlegen und Zusammensetzen und Vervollständigen, auch unter Verwendung digitaler Mathematikwerkzeuge"
  - code: nrw-mathe-2021.rf.ebene-figuren.7
    kind: content
    area: "Raum und Form"
    group: "Ebene Figuren"
    band: end-klasse-4
    pair: nrw-mathe-2021.p19
    page: 90
    text: "erstellen ebene Figuren maßstäblich durch Verkleinern und Vergrößern (u. a. auf Gitterpapier)"
  - code: nrw-mathe-2021.rf.koerper.1
    kind: content
    area: "Raum und Form"
    group: "Körper"
    band: end-klasse-2
    pair: nrw-mathe-2021.p20
    page: 90
    text: "identifizieren die geometrischen Körper Würfel, Quader und Kugel (auch in der Umwelt), stellen sie her, sortieren sie nach Eigenschaften und beschreiben diese mit Fachbegriffen"
  - code: nrw-mathe-2021.rf.koerper.2
    kind: content
    area: "Raum und Form"
    group: "Körper"
    band: end-klasse-4
    pair: nrw-mathe-2021.p20
    page: 90
    text: "identifizieren geometrische Körper (u. a. Pyramide, Zylinder), stellen Körpermodelle her, sortieren sie nach geometrischen Eigenschaften und beschreiben diese mit Fachbegriffen"
  - code: nrw-mathe-2021.rf.koerper.3
    kind: content
    area: "Raum und Form"
    group: "Körper"
    band: end-klasse-4
    pair: nrw-mathe-2021.p21
    page: 91
    text: "stellen komplexere Gebäude nach Plan her, auch unter Verwendung digitaler Mathematikwerkzeuge"
  - code: nrw-mathe-2021.rf.koerper.4
    kind: content
    area: "Raum und Form"
    group: "Körper"
    band: end-klasse-4
    page: 91
    text: "ordnen Körpern und Bauwerken ihre zweidimensionalen oder dreidimensionalen Darstellungen zu (u. a. Würfelnetze)"
  - code: nrw-mathe-2021.rf.koerper.5
    kind: content
    area: "Raum und Form"
    group: "Körper"
    band: end-klasse-2
    pair: nrw-mathe-2021.p21
    page: 91
    text: "stellen einfache Würfelgebäude, auch nach Plan her"
  - code: nrw-mathe-2021.rf.koerper.6
    kind: content
    area: "Raum und Form"
    group: "Körper"
    band: end-klasse-4
    page: 91
    text: "bestimmen und vergleichen den Rauminhalt von Körpern mit Einheitswürfeln"
  - code: nrw-mathe-2021.rf.symmetrie.1
    kind: content
    area: "Raum und Form"
    group: "Symmetrie"
    band: end-klasse-2
    pair: nrw-mathe-2021.p22
    page: 91
    text: "identifizieren bei einfachen ebenen Figuren Eigenschaften der Achsensymmetrie (u. a. durch Klappen, Durchstechen, Spiegeln mit dem Spiegel)"
  - code: nrw-mathe-2021.rf.symmetrie.2
    kind: content
    area: "Raum und Form"
    group: "Symmetrie"
    band: end-klasse-4
    pair: nrw-mathe-2021.p22
    page: 91
    text: "fertigen symmetrische Figuren an (u. a. Zeichnen von Spiegelbildern auf Gitterpapier, Spiegeln mit einem Doppelspiegel) und nutzen dabei die Eigenschaften der Achsensymmetrie, auch unter Verwendung digitaler Mathematikwerkzeuge"
  - code: nrw-mathe-2021.rf.zeichnen.1
    kind: content
    area: "Raum und Form"
    group: "Zeichnen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p23
    page: 91
    text: "zeichnen Bögen und zueinander parallele oder senkrechte Geraden mit Zeichengeräten (u. a. Zirkel, Geodreieck)"
  - code: nrw-mathe-2021.rf.zeichnen.2
    kind: content
    area: "Raum und Form"
    group: "Zeichnen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p23
    page: 91
    text: "zeichnen Linien, ebene Figuren und Muster aus freier Hand und mit Hilfsmitteln (u. a. Lineal, Schablone, Gitterpapier)"
  - code: nrw-mathe-2021.rf.zeichnen.3
    kind: content
    area: "Raum und Form"
    group: "Zeichnen"
    band: end-klasse-4
    page: 91
    text: "zeichnen ebene Figuren und Bauwerke in Gitter- und Punkterastern"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.1
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p24
    page: 92
    text: "ermitteln Längen mit Messgeräten (u. a. Lineal, Zollstock) sachlich angemessen"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.2
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p24
    page: 92
    text: "ermitteln Größen (u. a. Längen, Zeitspannen, Rauminhalte und Gewichte (Masse)) mit geeigneten Messgeräten"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.3
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p25
    page: 92
    text: "vergleichen und ordnen Längen, Zeitspannen und Geldbeträge"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.4
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p25
    page: 92
    text: "vergleichen und ordnen Größen (u. a. Datenmengen, Längen, Gewichte (Masse))"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.5
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p26
    page: 92
    text: "geben Größen von vertrauten Objekten an und schätzen mithilfe von Stützpunktvorstellungen (für 1cm, 1m, 1€)"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.6
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p26
    page: 92
    text: "geben Größen von vertrauten Objekten an und schätzen mithilfe von Stützpunktvorstellungen (für 1g, 500g, 1kg, 1t, 1km)"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.7
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p27
    page: 92
    text: "benennen einfache Uhrzeiten (u. a. volle Stunde, halbe Stunde, Viertelstunde, Dreiviertelstunde) auf analogen und digitalen Uhren und stellen diese ein"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.8
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p27
    page: 92
    text: "benennen Uhrzeiten auf analogen und auf digitalen Uhren und stellen diese ein"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.9
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p28
    page: 92
    text: "verwenden zusätzlich die Einheiten für Längen (mm, km), Zeitspannen (Sekunde), Gewichte (Masse) (g, kg, t), Volumina (ml, l) und Datenmengen (Byte, kB, MB) und stellen Größenangaben in unterschiedlichen Schreibweisen dar (umwandeln)"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.10
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p28
    page: 92
    text: "verwenden die Einheiten für Geldwerte (ct, €), Längen (cm, m), Zeitspannen (Minute, Stunde, Tag, Woche, Monat, Jahr) und stellen Größenangaben in unterschiedlichen Schreibweisen dar (umwandeln)"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.11
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-4
    page: 92
    text: "nutzen im Alltag gebräuchliche Bruchzahlen bei Größenangaben und wandeln diese in kleinere Einheiten um (¼, ½, ¾)"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.12
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p29
    page: 92
    text: "rechnen mit Größen (nur ganzzahlige Maßzahlen)"
  - code: nrw-mathe-2021.gm.groessenvorstellung-und-umgang-mit-groessen.13
    kind: content
    area: "Größen und Messen"
    group: "Größenvorstellung und Umgang mit Größen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p29
    page: 92
    text: "rechnen mit Größen (auch mit Dezimalzahlen)"
  - code: nrw-mathe-2021.gm.sachsituationen.1
    kind: content
    area: "Größen und Messen"
    group: "Sachsituationen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p30
    page: 93
    text: "formulieren zu Spiel- und Sachsituationen sowie zu einfachen Sachaufgaben (u. a. Rechengeschichten oder Bildsachaufgaben) mathematische Fragen und Aufgabenstellungen und lösen sie"
  - code: nrw-mathe-2021.gm.sachsituationen.2
    kind: content
    area: "Größen und Messen"
    group: "Sachsituationen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p30
    page: 93
    text: "formulieren zu realen oder simulierten Situationen (auch in projektorientierten Problemkontexten) und zu Sachaufgaben mathematische Fragen und Aufgabenstellungen und lösen sie"
  - code: nrw-mathe-2021.gm.sachsituationen.3
    kind: content
    area: "Größen und Messen"
    group: "Sachsituationen"
    band: end-klasse-4
    pair: nrw-mathe-2021.p31
    page: 93
    text: "nutzen selbstständig Bearbeitungshilfen wie Tabellen, Skizzen, Diagramme zur Lösung von Sachaufgaben (u. a. zur Darstellung funktionaler Beziehungen)"
  - code: nrw-mathe-2021.gm.sachsituationen.4
    kind: content
    area: "Größen und Messen"
    group: "Sachsituationen"
    band: end-klasse-2
    pair: nrw-mathe-2021.p31
    page: 93
    text: "nutzen Bearbeitungshilfen wie Zeichnungen, Skizzen zur Lösung von Sachaufgaben"
  - code: nrw-mathe-2021.gm.sachsituationen.5
    kind: content
    area: "Größen und Messen"
    group: "Sachsituationen"
    band: end-klasse-4
    page: 93
    text: "begründen, ob Näherungswerte (u. a. Schätzen, Überschlagen) ausreichen oder ein genaues Ergebnis nötig ist"
