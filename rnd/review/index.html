<title>Twist Germany Readiness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a school report. Squared-paper header with the verdict, a sticky contents rail, then scorecard, areas, priorities, standards. Royal-blue ink for structure, red correction pen for gaps. */
:root {
  --paper: #f6f7f3;
  --sheet: #ffffff;
  --grid: #e3e8ee;
  --ink: #1b2440;
  --muted: #5d6680;
  --line: #d9dee6;
  --blue: #2a4ea3;
  --red: #c2352b;
  --amber: #a86d10;
  --green: #2c7a4b;
  --display: "Bitter", "Rockwell", Georgia, serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141d; --sheet: #171d29; --grid: #1f2736; --ink: #e6eaf2; --muted: #9aa4ba; --line: #2a3346;
    --blue: #8aa8f0; --red: #f07a70; --amber: #e2ad55; --green: #6cc795; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141d; --sheet: #171d29; --grid: #1f2736; --ink: #e6eaf2; --muted: #9aa4ba; --line: #2a3346;
  --blue: #8aa8f0; --red: #f07a70; --amber: #e2ad55; --green: #6cc795; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 4.5vw, 46px); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 26px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; max-width: 66ch; }
.eyebrow { font: 700 12px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-size: 0.88em; }
.muted { color: var(--muted); }

/* header on squared paper */
header.hero {
  background-color: var(--sheet);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; border-bottom: 1px solid var(--line);
}
.hero-in { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 40px 32px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 32px; align-items: start; }
@media (max-width: 860px) { .hero-in { grid-template-columns: 1fr; } }
.hero-text { display: grid; gap: 14px; min-width: 0; }
.hero-text .sub { font-size: 18px; color: var(--muted); }
.stamp { background: var(--sheet); border: 2px solid var(--blue); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; box-shadow: 4px 4px 0 color-mix(in srgb, var(--blue) 18%, transparent); }
.stamp .label { font: 800 24px/1.1 var(--display); }
.stamp.ok { border-color: var(--green); } .stamp.ok .label { color: var(--green); }
.stamp.cond { border-color: var(--amber); } .stamp.cond .label { color: var(--amber); }
.stamp.no { border-color: var(--red); } .stamp.no .label { color: var(--red); }
.gauge { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; }
.gauge svg { width: 92px; height: 92px; }
.gauge .num { font: 800 26px var(--display); fill: var(--ink); }
.gauge .basis { font-size: 13px; color: var(--muted); }
.summary { display: grid; gap: 8px; }
.summary p { font-size: 16.5px; }

/* layout */
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 36px; }
@media (max-width: 860px) { .wrap { grid-template-columns: 1fr; gap: 20px; } }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; display: grid; gap: 2px; }
nav.toc a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14.5px; padding: 6px 10px; border-left: 3px solid transparent; }
nav.toc a:hover { color: var(--ink); }
nav.toc a.on { color: var(--ink); border-left-color: var(--blue); background: color-mix(in srgb, var(--blue) 7%, transparent); }
nav.toc .sub { padding-left: 22px; font-weight: 400; font-size: 13.5px; }
@media (max-width: 860px) {
  nav.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: flex; overflow-x: auto; background: var(--paper); border-bottom: 1px solid var(--line); padding-block: 6px; scrollbar-width: none; }
  nav.toc a { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; }
  nav.toc a.on { border-bottom-color: var(--blue); background: none; }
  nav.toc .sub { display: none; }
}
main { display: grid; gap: 48px; min-width: 0; }
section { display: grid; gap: 18px; scroll-margin-top: 70px; min-width: 0; }
.head { display: grid; gap: 6px; }

/* conditions */
ol.conds { margin: 0; padding: 0; list-style: none; counter-reset: c; display: grid; gap: 8px; }
ol.conds li { counter-increment: c; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
ol.conds li::before { content: counter(c); font: 800 18px/1.3 var(--display); color: var(--blue); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1 var(--body); padding: 5px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.r-meets { color: var(--green); } .r-partial { color: var(--amber); } .r-gap { color: var(--red); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar button { font: 600 13.5px var(--body); color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.toolbar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* scorecard */
.score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.score-card { text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; cursor: pointer; font: inherit; color: inherit; border-top: 4px solid var(--line); }
.score-card:hover { border-color: var(--muted); }
.score-card.r-meets { border-top-color: var(--green); } .score-card.r-partial { border-top-color: var(--amber); } .score-card.r-gap { border-top-color: var(--red); }
.score-card .nm { font: 700 16.5px/1.25 var(--display); color: var(--ink); }
.score-card .fd { font-size: 14px; color: var(--muted); }
.score-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.pips i.on { background: currentColor; }

/* area detail */
.area { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; scroll-margin-top: 70px; border-left: 5px solid var(--line); }
.area.r-meets { border-left-color: var(--green); } .area.r-partial { border-left-color: var(--amber); } .area.r-gap { border-left-color: var(--red); }
.area .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .cmp { grid-template-columns: 1fr; } }
.cmp > div { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.cmp .std { background: color-mix(in srgb, var(--blue) 6%, var(--sheet)); }
.finding { font-size: 16.5px; font-weight: 600; }
.evid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.evid div { border-top: 2px solid var(--blue); padding-top: 8px; display: grid; gap: 2px; min-width: 0; }
.evid b { font: 800 22px/1.1 var(--display); color: var(--blue); overflow-wrap: anywhere; }
.evid span { font-size: 13.5px; }
.evid small { font-size: 12px; color: var(--muted); }
details.ex { border: 1px solid var(--line); border-radius: var(--r); }
details.ex summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary::before { content: "+"; font: 700 16px var(--mono); color: var(--blue); width: 14px; }
details.ex[open] summary::before { content: "−"; }
.exs { display: grid; gap: 10px; padding: 0 14px 14px; }
.exi { display: grid; gap: 4px; padding: 10px 12px; border-radius: 4px; background: color-mix(in srgb, var(--grid) 55%, var(--sheet)); min-width: 0; }
.exi .k { font: 700 11px var(--body); letter-spacing: 0.08em; text-transform: uppercase; }
.exi .k.twist { color: var(--blue); } .exi .k.standard { color: var(--green); } .exi .k.benchmark { color: var(--amber); }
.exi q { font-family: var(--mono); font-size: 13.5px; quotes: none; overflow-wrap: anywhere; }
.exi .p { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.fix { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; border-top: 1px dashed var(--line); padding-top: 12px; }
.fix .tag { font: 700 12px var(--mono); padding: 3px 7px; border-radius: 4px; background: var(--ink); color: var(--paper); }

/* strengths, priorities, standards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.card.strength { border-left: 4px solid var(--green); }
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .lanes { grid-template-columns: 1fr; } }
.lane { display: grid; gap: 10px; align-content: start; }
.lane > .eyebrow { padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.prio { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.prio .n { font: 800 20px/1 var(--display); color: var(--red); }
.prio .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.prio button { justify-self: start; font: 600 12.5px var(--body); color: var(--blue); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
dl.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.gloss dt { font-weight: 700; font-family: var(--display); }
dl.gloss dd { margin: 0; color: var(--muted); }
@media (max-width: 520px) { dl.gloss { grid-template-columns: 1fr; } dl.gloss dd { margin-bottom: 8px; } }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
footer { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .gauge .arc { transition: stroke-dashoffset 0.8s ease-out; } }
</style>
</head>

<script>
const R = {"title":"Twist Germany Readiness","subtitle":"Grades 1 and 2 are written for German children; grades 3 and 4 are mostly English copies or empty stubs, and the English and Math tracks are not yet shaped for German schools.","date":"2026-10-09","verdict":{"label":"Not ready","score":30,"basis":"Content readiness alone scored 40 (mean of ten area scores, minus 12 for blockers); a further 10 off because the app does not yet deliver German audio, teach examples, answer feedback or one item in seven in grade 1.","headline":"Twist is not ready for a German beta with children: grades 1 and 2 are well written, but the app does not yet show what makes them good, and grades 3 and 4 are not German yet.","summary":["Grades 1 and 2 in the German folder are written for German children, with teaching before practice, three-tier hints and per-answer feedback. That is the strongest part of Twist.","In the app today, much of that does not reach the child: teach examples are not rendered, answer feedback is not integrated, German audio is not published, and 14.1% of grade 1 items (1,784 of 12,613) are dropped because their question type is not supported.","Grade 3 is mostly placeholders (192 of its 316 lesson files), grade 4 Math and English are in English with dollars and inches, and German spelling strategies, syllable reading and joined handwriting are missing.","Next step: fix delivery for grades 1 and 2 in German, then run a closed beta with a small group of families. Grades 3 and 4 need authoring before anyone sees them."],"conditions":["Replace the 192 placeholder lesson parts and the English text in G3 and G4 Math and English with authored German, or hide those grades at launch.","Localise Math to Germany: euro and cent instead of Pennys, Nickel and dollars; metric only; German number formats (3.847, not 3,847).","Decide the English offer: a foreign-language English track (vocabulary, listening, speaking) for G3 and G4, or remove English from the German launch.","Add a German spelling-strategy and syllable-reading strand, plus a mapping of every lesson to a KMK area and a state curriculum, so schools can see the fit.","Offer a Schreibschrift option (or state clearly that only Druckschrift is taught) and decide which state scripts to support.","Fix the placeholder hints (1,160 of 1,832 G3 and 876 of 1,723 G4 guided-practice questions) and complete the German audio (the repo notes say German audio upload waits on a storage-key fix) before any paid release."],"beta":{"label":"Not ready for a closed beta with children","why":["A grade 1 child cannot read the instructions; German audio is not published to the app yet, so German grade 1 has no voice.","The app drops 14.1% of German grade 1 items and 10.7% of grade 2 items (audio_choice 786 and 605, sorting, multi_select, highlight_in_text, drag_and_drop_count, speak, clock_hands_drag).","Teaching examples and answer feedback, Twist's two clearest strengths, are not shown in the app yet.","Grade 1 Math teaches Penny, Nickel, Dime and Quarter in German sentences; a German parent sees this in the first week."],"ready_for":"An internal or teacher-panel content beta (reviewers reading the content in the review app) is possible now for grades 1 and 2.","gate":["German audio published and playing in the app","All 7 dropped question types rendered, or the items rewritten into supported types","Teach examples and answer feedback shown","Euro and metric in grade 1 and 2 Math"]}},"scope":{"reviewed":["Six benchmark crosswalks were opened; the three for the German instruction language (German, Math, English) were read in full for their summaries and key tables.","Research notes: german-insight, type-gaps, mechanics-benchmark, calibration, media-benchmark, anatomy, FINDINGS (all in /Users/diemu/ist/b2c/rnd).","Twist docs: docs/CLAUDE.md, docs/specs/assessment.md (key sections), docs/authoring/german-en-loi-standard.md, docs/authoring/item-quality-rules.md, docs/notes/ship-decisions.md.","All 12 de/ module catalogs (grades 1 to 4, three subjects); structure and lesson titles.","Whole de/ tree scanned by script: 1,216 lesson parts, 397 assessments, 3,151 skill-practice banks, 372 practice sets (language, hint and placeholder counts are my own word-list checks, not a human read).","About 12 lesson-part files read by hand across G1 German, G1 Math, G1 English, G3 German, G3 Math, G4 German, G4 Math.","The app's question mapper and the content repo's media release notes"],"not_reviewed":["No audio or images were listened to or viewed; audio and picture quality are not judged.","No learner or teacher testing; no live app run.","The three crosswalks for the English instruction language were not read beyond the summary in german-insight.","State curricula (Lehrplan documents) were not read; only the standards list supplied with the brief was used.","Language shares come from a word-list heuristic; short numeric items can be misread, so counts are approximate.","Whether the app renders all 19 question types seen in the content is unverified."]},"standards":[{"id":"kmk-de","name":"KMK Bildungsstandards Deutsch, Primarbereich (revised 23.06.2022)","requires":"Four areas by end of Klasse 4: Sprechen und Zuhören; Schreiben; Lesen; Sprachgebrauch und Sprachwissen untersuchen. Binding in all 16 states.","source":"https://www.iqb.hu-berlin.de/bista/ksm/KSM_GS_Deutsch_L_2.pdf"},{"id":"kmk-math","name":"KMK Bildungsstandards Mathematik, Primarbereich","requires":"Five Leitideen (Zahlen und Operationen; Raum und Form; Muster und Strukturen; Größen und Messen; Daten, Häufigkeit und Wahrscheinlichkeit) plus process competences (Problemlösen, Kommunizieren, Argumentieren, Modellieren, Darstellen).","source":"https://www.lis.bremen.de/sixcms/media.php/13/2025_BP%20Mathematik.pdf"},{"id":"vera3","name":"VERA-3 comparison tests","requires":"National tests in Klasse 3 built on the KMK standards; schools and parents read results against them.","source":"https://www.iqb.hu-berlin.de/media/exercise_group_files/VERA-3_Mathematik/Daten_Haeufigkeit_Wahrscheinlichkeit_FachdidaktischesMaterial.pdf"},{"id":"lehrplan","name":"State Lehrpläne (for example LehrplanPLUS Bavaria, NRW Lehrpläne)","requires":"Each state has its own curriculum; the KMK standards are the common floor, so content must be mappable per state.","source":"https://www.lis.bremen.de/sixcms/media.php/13/2025_BP%20Mathematik.pdf"},{"id":"english-fl","name":"Primary English as a foreign language","requires":"Starts in Klasse 3 in most states (Klasse 1 in Brandenburg, Hamburg, Rheinland-Pfalz; Baden-Württemberg and NRW moved back to Klasse 3) and is taught as a foreign language.","source":"https://www.friedrich-verlag.de/grundschule/englisch/didaktik-methodik/early-foreign-language-teaching-14700"},{"id":"handwriting","name":"Handwriting scripts","requires":"All states start with unjoined print script; the joined script (Lateinische Ausgangsschrift, Schulausgangsschrift, Vereinfachte Ausgangsschrift, Grundschrift) varies by state.","source":"https://www.hessenschau.de/politik/bayern-kein-vorbild-hessen-haelt-an-schreibschrift-in-grundschulen-fest-v1,schreibschrift-106.html"},{"id":"daz","name":"German as a second language (DaZ)","requires":"A separate track from native-speaker Deutsch, levelled by CEFR (A1, A2). Verified 2026-10-09 per the review brief; no URL was supplied.","source":""}],"areas":[{"id":"app-delivery","name":"What reaches the child in the app","subject":"All","rating":"gap","score":1,"standard":"A German primary product must work for pre-readers: every instruction spoken, every item playable, feedback on every answer (common practice; KMK Sprechen und Zuhören).","twist_today":"The content has teach steps, three-tier hints, per-answer feedback and audio files. The app renders 12 of the 19 Twist question types, does not show teach examples or answer feedback yet, and German audio is not published.","finding":"The product a child would use today is much thinner than the content: one item in seven in grade 1 is dropped and the German voice is missing.","evidence":[{"metric":"German grade 1 items the app drops","value":"14.1%","note":"1,784 of 12,613; ist-schoolido questionMapper.ts lines 313-322"},{"metric":"German grade 2 items the app drops","value":"10.7%","note":"1,627 of 15,259"},{"metric":"Audio clips per lesson file, grade 3 (en and de)","value":"1.7","note":"548 clips for 316 files; grade 1 English has about 22"}],"examples":[{"kind":"twist","label":"Unsupported types return nothing","text":"case \"audio_choice\": case \"drag_and_drop_count\": case \"sorting\": case \"speak\": ... return null;","path":"/Users/diemu/ist/b2c/ist-schoolido/components/quiz/utils/questionMapper.ts","comment":"Listening items are the largest dropped group: 786 in German grade 1."},{"kind":"twist","label":"German audio not deliverable yet","text":"de/ audio waits for the audio key fix (de/ and en/ clips currently resolve to the same storage key)","path":"/Users/diemu/ist/b2c/schoolido-learning/docs/notes/app-brief-text-rendering-and-inactive-speak.md","comment":"The key is fixed on develop, but nothing is published yet (lesson-tracker.md)."}],"fix":"Render the 7 missing question types (or rewrite those items), show teach examples and feedback, publish German audio, then test grade 1 end to end with a child who cannot read yet.","effort":"L"},{"id":"german-reading-decoding","name":"Lesen lernen (decoding)","subject":"German","rating":"partial","score":3,"standard":"Lesen area of kmk-de: secure letter-sound links, syllable reading, fluent word and sentence reading in Klasse 1 and 2.","twist_today":"G1 has authored letter, letter-sound, short-vowel, umlaut and consonant lessons (A to Z with the German sounds), then one-sentence reading with Wer, Was, Wo, Wann. G2 adds vowels, clusters, word families. Reading comprehension continues to G4.","finding":"The letter-sound work is well made and German-native. Syllable reading, syllable marking and timed word reading, which German teachers use to build fluency, are not in Twist.","evidence":[{"metric":"German lessons with a match in the benchmark's Deutsch course","value":"70 of 103","note":"crosswalk, de German, section 7"},{"metric":"Benchmark Klasse 1 Deutsch lessons vs Twist G1 German lessons","value":"91 vs 26","note":"crosswalk, de German, section 2"},{"metric":"Interaction types the benchmark has and Twist lacks","value":"mark syllables 57 exercises; timed reading 289","note":"type-gaps.md"}],"examples":[{"kind":"twist","label":"G1 letter sounds","text":"Tippe auf den kleinen Buchstaben, den du hörst.","path":"/Users/diemu/ist/b2c/schoolido-learning/content/de/grade-1/german/01-phonics-and-word-recognition/02-letter-sounds/01-cons-1/german-g1-sound-cons-1.json","comment":"Plain child German; every wrong option has a specific feedback line."},{"kind":"benchmark","label":"Anton: Syllable and flash reading","text":"A leading German learning app (studied for inspiration) has a syllable-marking exercise and a word-flash exercise shown for about 2 seconds.","path":"","comment":"German primary teachers check for these; Twist has neither."}],"fix":"Add a syllable strand (Silben klatschen, mark, read) and a timed word-reading mode on the existing choose-one type; reuse the G1 letter-sound lessons as the base.","effort":"M"},{"id":"german-spelling","name":"Rechtschreibung (spelling strategies)","subject":"German","rating":"gap","score":2,"standard":"Schreiben area of kmk-de: pupils spell with strategies (Silbenschwingen, Verlängern, Ableiten, Merkwörter) and use a dictionary.","twist_today":"Spelling shows up as phonics, word families, compounds, affixes, punctuation and capitalization. No lesson named for a spelling strategy exists in the catalogs.","finding":"Strategy-based spelling is the backbone of Klasse 2 and 3 in the benchmark and is the most visible hole for teachers and parents.","evidence":[{"metric":"Benchmark Klasse 3 spelling-strategy lessons with no Twist match const main = document.getElementById("main");
main.innerHTML = `
${R.verdict.beta ? `<section id="beta"><div class="head"><span class="eyebrow">Beta</span><h2>${esc(R.verdict.beta.label)}</h2></div>
  <div class="cmp"><div class="std" style="background:color-mix(in srgb, var(--red) 6%, var(--sheet))"><span class="eyebrow">Why</span><ul class="plain">${R.verdict.beta.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>
  <div><span class="eyebrow">Possible now</span><p>${esc(R.verdict.beta.ready_for)}</p><span class="eyebrow" style="margin-top:10px">Gate for a beta with children</span><ul class="plain">${R.verdict.beta.gate.map((g) => `<li>${esc(g)}</li>`).join("")}</ul></div></div></section>` : ""}
<section id="conditions"><div class="head"><span class="eyebrow">Before launch</span><h2>Conditions for a launch in Germany</h2></div>
  <ol class="conds">${(R.verdict.conditions || []).map((c) => `<li><span>${esc(c)}</span></li>`).join("")}</ol></section>

<section id="scorecard"><div class="head"><span class="eyebrow">Scorecard · ${A.length} areas</span><h2>Where Twist stands against German expectations</h2>
  <p class="muted">${counts.meets} meet the standard, ${counts.partial} partly, ${counts.gap} have a gap. Open a card for the detail.</p></div>
  <div class="toolbar" id="filters" role="group" aria-label="Filter by subject">${subjects.map((s, i) => `<button type="button" data-s="${esc(s)}" aria-pressed="${i === 0}">${esc(s === "All" ? "All subjects" : s)}</button>`).join("")}</div>
  <div class="score-grid" id="cards">${A.map((a) => `<button type="button" class="score-card r-${esc(a.rating)}" data-id="${esc(a.id)}" data-s="${esc(a.subject)}">
    <span class="row"><span class="eyebrow">${esc(a.subject)}</span>${chip(a.rating)}</span>
    <span class="nm">${esc(a.name)}</span><span class="fd">${esc(a.finding)}</span>
    <span class="row">${pips(a.score, a.rating)}<span class="mono muted">${esc(a.effort ? "effort " + a.effort : "")}</span></span></button>`).join("")}</div></section>

<section id="areas"><div class="head"><span class="eyebrow">Detail</span><h2>Area by area</h2></div>
  ${A.map((a) => `<article class="area r-${esc(a.rating)}" id="area-${esc(a.id)}">
    <div class="top"><div class="head"><span class="eyebrow">${esc(a.subject)}</span><h3>${esc(a.name)}</h3></div><span class="toolbar">${chip(a.rating)}${pips(a.score, a.rating)}</span></div>
    <p class="finding">${esc(a.finding)}</p>
    <div class="cmp"><div class="std"><span class="eyebrow">What Germany expects</span><span>${esc(a.standard)}</span></div><div><span class="eyebrow">Twist today</span><span>${esc(a.twist_today)}</span></div></div>
    ${(a.evidence || []).length ? `<div class="evid">${a.evidence.map((e) => `<div><b>${esc(e.value)}</b><span>${esc(e.metric)}</span>${e.note ? `<small>${esc(e.note)}</small>` : ""}</div>`).join("")}</div>` : ""}
    ${(a.examples || []).length ? `<details class="ex"><summary>Examples (${a.examples.length})</summary><div class="exs">${a.examples.map((x) => `<div class="exi"><span class="k ${esc(x.kind)}">${esc({ twist: "Twist", standard: "Standard", benchmark: "Benchmark" }[x.kind] || x.kind)} · ${esc(x.label)}</span><q>${esc(x.text)}</q>${x.path ? `<span class="p">${esc(x.path)}</span>` : ""}<span>${esc(x.comment)}</span></div>`).join("")}</div></details>` : ""}
    <div class="fix"><span class="tag">${esc(a.effort || "?")}</span><span><b>Fix:</b> ${esc(a.fix)}</span></div>
  </article>`).join("")}</section>

${R.comparison ? `<section id="numbers"><div class="head"><span class="eyebrow">In numbers</span><h2>Twist next to Anton</h2><p class="muted">${esc(R.comparison.intro)}</p></div>
  <div style="overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)"><table style="border-collapse:collapse;width:100%;font-size:14.5px;min-width:620px">
  <thead><tr>${["Measure", "Twist", "Anton", "Note"].map((x) => `<th style="text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">${x}</th>`).join("")}</tr></thead>
  <tbody>${R.comparison.rows.map((r) => `<tr><td style="padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600">${esc(r.metric)}</td><td style="padding:10px 12px;border-bottom:1px solid var(--line);color:var(--blue);font-weight:700">${esc(r.twist)}</td><td style="padding:10px 12px;border-bottom:1px solid var(--line)">${esc(r.anton)}</td><td style="padding:10px 12px;border-bottom:1px solid var(--line);color:var(--muted)">${esc(r.note)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
<section id="strengths"><div class="head"><span class="eyebrow">Keep</span><h2>What Twist already does well</h2></div>
  <div class="cards">${(R.strengths || []).map((s) => `<div class="card strength"><h3>${esc(s.title)}</h3><p>${esc(s.detail)}</p><span class="mono muted">${esc(s.evidence)}</span></div>`).join("")}</div></section>

<section id="priorities"><div class="head"><span class="eyebrow">Plan</span><h2>Priorities</h2></div>
  <div class="lanes">${["before launch", "first 3 months", "later"].map((w) => `<div class="lane"><span class="eyebrow">${esc(w)}</span>${(R.priorities || []).filter((p) => (p.when || "").toLowerCase() === w).map((p) => `<div class="prio"><span class="n">${esc(p.rank)}</span><b>${esc(p.action)}</b><span class="muted">${esc(p.why)}</span>
    <span class="meta"><span>effort ${esc(p.effort)}</span></span>${p.area ? `<button type="button" data-go="${esc(p.area)}">See the area</button>` : ""}</div>`).join("") || `<span class="muted">None</span>`}</div>`).join("")}</div></section>

<section id="standards"><div class="head"><span class="eyebrow">Reference</span><h2>Standards this review uses</h2></div>
  <div class="cards">${(R.standards || []).map((s) => `<div class="card"><span class="eyebrow mono">${esc(s.id)}</span><h3>${esc(s.name)}</h3><p>${esc(s.requires)}</p>${s.source ? `<a href="${esc(s.source)}" target="_blank" rel="noopener">Source</a>` : ""}</div>`).join("")}</div></section>

<section id="method"><div class="head"><span class="eyebrow">How</span><h2>Method and scope</h2></div>
  <ul class="plain">${(R.method || []).map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
  <div class="cmp"><div><span class="eyebrow">Reviewed</span><ul class="plain">${((R.scope || {}).reviewed || []).map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div>
  <div><span class="eyebrow">Not reviewed</span><ul class="plain">${((R.scope || {}).not_reviewed || []).map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div></div></section>

<section id="glossary"><div class="head"><span class="eyebrow">Terms</span><h2>Glossary</h2></div>
  <dl class="gloss">${(R.glossary || []).map((g) => `<dt>${esc(g.term)}</dt><dd>${esc(g.meaning)}</dd>`).join("")}</dl></section>`;

// contents rail
const toc = [...(R.verdict.beta ? [["beta", "Beta verdict"]] : []), ["conditions", "Conditions"], ["scorecard", "Scorecard"], ["areas", "Areas"], ...A.map((a) => ["area-" + a.id, a.name, true]), ...(R.comparison ? [["numbers", "Twist and Anton"]] : []), ["strengths", "Strengths"], ["priorities", "Priorities"], ["standards", "Standards"], ["method", "Method"], ["glossary", "Glossary"]];
const nav = document.getElementById("toc");
nav.innerHTML = toc.map(([id, l, sub]) => `<a href="#${id}" data-id="${id}" class="${sub ? "sub" : ""}">${esc(l)}</a>`).join("");
const go = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); };
nav.addEventListener("click", (e) => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); go(a.dataset.id); });
document.querySelectorAll(".score-card").forEach((b) => b.addEventListener("click", () => go("area-" + b.dataset.id)));
document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go("area-" + b.dataset.go)));
document.getElementById("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#filters button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  const s = b.dataset.s;
  document.querySelectorAll(".score-card").forEach((c) => (c.hidden = s !== "All" && c.dataset.s !== s && c.dataset.s !== "All"));
});
const ids = toc.map(([id]) => id);
const obs = new IntersectionObserver((ents) => {
  const vis = ents.filter((x) => x.isIntersecting).map((x) => x.target.id);
  if (!vis.length) return;
  const cur = ids.filter((id) => vis.includes(id)).pop();
  nav.querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.dataset.id === cur));
}, { rootMargin: "-20% 0px -60% 0px" });
ids.forEach((id) => { const el = document.getElementById(id); if (el) obs.observe(el); });
document.getElementById("foot").textContent = `Review dated ${R.date}. Built from the Schoolido R&D research folder and the Twist content repository.`;
</script>

</body>
</html>
