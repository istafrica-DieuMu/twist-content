<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twist Lesson Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#efe9f5; --panel:#ffffff; --ink:#2b0f45; --muted:#6d5f7b; --line:#e3dbea;
  --app:#fbf7ff; --card:#ffffff; --plum:#2b0f45; --accent:#8e3bd1; --accent-soft:#efe0fb;
  --good:#2e9e48; --good-soft:#dff4e3; --bad:#d4483f; --bad-soft:#fbe3e1; --hint:#f6b400; --hint-soft:#fff3cc;
  --red:#E53935; --blue:#1E88E5; --frame:#1d1426;
  --check:#2d5f8a; --check-soft:#e2eef8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#14101a; --panel:#1e1826; --ink:#f1eaf8; --muted:#a99bb8; --line:#352c40; }
}
:root[data-theme="dark"]{ --page:#14101a; --panel:#1e1826; --ink:#f1eaf8; --muted:#a99bb8; --line:#352c40; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px 16px}
/* side panel */
.side{width:340px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.side h1{font-size:18px;margin:0 0 4px}.side p{margin:0 0 12px;color:var(--muted);font-size:13px}
.side label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.side select{width:100%;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.steps{list-style:none;padding:0;margin:6px 0 0;font-size:13px}
.steps li{padding:4px 8px;border-radius:8px;cursor:pointer;display:flex;gap:6px}
.steps li:hover{background:var(--accent-soft);color:#2b0f45}
.steps li.on{background:var(--accent);color:#fff}
.steps .grp{font-weight:700;margin-top:8px;cursor:default;background:none!important;color:var(--muted)!important}
pre.rec{font:11px/1.35 ui-monospace,Menlo,monospace;background:var(--page);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;margin:6px 0 0}
.toggles{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:8px}
/* phone */
.phone{width:390px;height:844px;border-radius:54px;background:var(--frame);padding:12px;box-shadow:0 30px 60px -20px rgba(43,15,69,.45);flex:none;position:relative}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000;z-index:5}
.screen{width:100%;height:100%;border-radius:44px;background:var(--app);overflow:hidden;display:flex;flex-direction:column;color:#2b0f45;font-family:Andika,system-ui,sans-serif;position:relative}
@media (max-width:820px){
  .wrap{flex-direction:column;align-items:center;padding:0 0 24px}
  .phone{width:100%;max-width:430px;height:100svh;border-radius:0;padding:0;box-shadow:none;order:-1}
  .phone::before{display:none}
  .screen{border-radius:0}
  .side{position:static;width:100%;max-width:430px;max-height:none;border-radius:0;border-left:0;border-right:0}
}
.status{height:52px;flex:none}
.top{display:flex;align-items:center;gap:10px;padding:4px 18px 8px;flex:none}
.x{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:18px;color:var(--muted);cursor:pointer}
.bar{flex:1;height:14px;border-radius:8px;background:#eadff3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .35s}
.chip{display:inline-flex;align-items:center;gap:6px;margin:0 18px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--accent-soft);color:#5b1f8f;align-self:flex-start}
.chip.check{background:var(--check-soft);color:var(--check)}
.dots{display:inline-flex;gap:4px;margin-left:4px}.dots b{width:8px;height:8px;border-radius:50%;background:#d6c2e8}.dots b.on{background:#5b1f8f}
.body{flex:1;overflow:auto;padding:12px 20px 8px;display:flex;flex-direction:column;gap:14px}
.prompt{display:flex;gap:12px;align-items:flex-start}
.prompt .t{font-size:24px;line-height:1.25;font-weight:700;flex:1}
.spk{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--plum);background:#fff;cursor:pointer;display:grid;place-items:center}
.spk svg{width:26px;height:26px}.spk.big{width:96px;height:96px;margin:8px auto}.spk.big svg{width:48px;height:48px}
.spk.playing{background:var(--accent-soft)}
.visual{display:flex;justify-content:center;align-items:center;min-height:40px;width:100%}
.visual img{width:150px;height:150px;object-fit:contain}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:14px;margin-top:auto;padding-top:10px}
.opt{position:relative;border:3px solid var(--plum);background:#fff;border-radius:20px;min-height:76px;font:700 30px Andika,sans-serif;color:var(--plum);cursor:pointer;display:grid;place-items:center;padding:8px;box-shadow:0 4px 0 var(--plum);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum)}
.opt img{width:96px;height:96px;object-fit:contain}
.opt.good{background:var(--good-soft);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .3s}
.opt.sel{background:var(--accent-soft)}
.opt.dim{opacity:.45}
.opt .os{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;border:2px solid var(--plum);background:#fff;display:grid;place-items:center;cursor:pointer;z-index:1}
.opt .os svg{width:14px;height:14px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.foot{padding:10px 20px 26px;flex:none;display:flex;flex-direction:column;gap:10px}
.btn{width:100%;border:3px solid var(--plum);background:var(--accent);color:#fff;border-radius:18px;padding:14px;font:700 22px Andika,sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--plum)}
.btn:disabled{opacity:.4;cursor:default}
.btn.light{background:#fff;color:var(--plum)}
.bubble{border-radius:16px;padding:10px 14px;font-size:18px;display:flex;gap:10px;align-items:flex-start}
.bubble.hint{background:var(--hint-soft);border:2px solid var(--hint)}
.bubble.fb{background:var(--bad-soft);border:2px solid var(--bad)}
.bubble.ok{background:var(--good-soft);border:2px solid var(--good)}
.bubble .spk{width:36px;height:36px;border-width:2px}.bubble .spk svg{width:18px;height:18px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.center h2{font-size:30px;margin:0}.center p{font-size:18px;margin:0;color:#6d5f7b}
.center img{width:180px;height:180px;object-fit:contain}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:auto}
.tf .opt{font-size:26px;min-height:96px}
/* drawn */
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{min-width:52px;height:72px;padding:0 10px;border:3px solid var(--plum);border-radius:16px;background:#fff;display:grid;place-items:center;font:700 40px Andika,sans-serif;cursor:default}
.card.tap{cursor:pointer;box-shadow:0 4px 0 var(--plum)}.card.sel{background:var(--accent-soft);border-color:var(--accent)}
.card.good{background:var(--good-soft);border-color:var(--good)}.card.bad{background:var(--bad-soft);border-color:var(--bad)}
.word{font:700 54px Andika,sans-serif;letter-spacing:.02em;text-align:center}
.syl{display:inline-block;position:relative;padding:0 2px 18px}
.syl::after{content:"";position:absolute;left:4%;right:4%;bottom:2px;height:14px;border:4px solid currentColor;border-top:0;border-radius:0 0 60px 60px}
.syl:nth-child(odd){color:#1E6FD9}.syl:nth-child(even){color:#D63A2F}
.wordcard{padding:12px 26px;border:3px solid var(--plum);border-radius:18px;background:#fff}
.frame{font:700 40px Andika,sans-serif;text-align:center;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.gap{min-width:52px;height:62px;border-bottom:5px solid var(--accent);display:inline-grid;place-items:center;color:var(--accent);cursor:pointer;border-radius:6px 6px 0 0;background:var(--accent-soft)}
.gap.filled{color:var(--plum)}
.chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:auto;padding-top:10px}
.chips .opt{min-width:72px;min-height:68px}
.entry{font:700 48px Andika,sans-serif;text-align:center;border:3px solid var(--plum);border-radius:18px;background:#fff;min-height:76px;display:grid;place-items:center;margin:0 auto;width:160px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.pad .opt{min-height:58px;font-size:26px}
.trace{position:relative;width:300px;height:200px;margin:0 auto}
.trace svg,.trace canvas{position:absolute;inset:0;width:300px;height:200px}
.trace canvas{touch-action:none;cursor:crosshair}
.note{font-size:13px;color:#6d5f7b;text-align:center}
.blank{display:inline-block;min-width:1.4em;padding:0 .2em;margin:0 .1em;border-radius:8px;background:var(--accent-soft);color:var(--accent);border-bottom:3px solid var(--accent);text-align:center;line-height:1.1}
.sound{align-self:center;border:3px solid var(--plum);border-radius:999px;background:#fff;padding:6px 18px;font:700 26px Andika,sans-serif;color:var(--plum);cursor:pointer;box-shadow:0 3px 0 var(--plum);display:flex;gap:8px;align-items:center}
.sound svg{width:20px;height:20px}
svg text{font-family:Andika,sans-serif}
.moved{animation:slideup .7s ease-out both}
@keyframes slideup{from{transform:translateY(34px)}to{transform:none}}
.stars{font-size:44px;letter-spacing:6px}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--good-soft);color:var(--good);font-weight:700;font-size:18px}
.badge.no{background:var(--hint-soft);color:#8a6400}
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 28px;margin-top:auto}
.bins{display:grid;gap:12px;margin-top:auto}
.bin{border:3px dashed var(--plum);border-radius:20px;min-height:220px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;cursor:pointer}
.grp{width:100%}
.grp .it{display:inline-grid;place-items:center;position:relative}
.grp .it img{width:100%;height:100%;object-fit:contain}
.grp.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.grp.scat{position:relative}
.grp.scat .it{position:absolute}
.opt .grp.scat{width:100%}
.it.tapped::after{content:attr(data-n);position:absolute;right:-4px;top:-6px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;font:700 17px/26px Andika,sans-serif;text-align:center;border:2px solid #fff}
.it.tapped img{opacity:.55}
.pairview{display:flex;gap:28px;justify-content:center}
.pairview .pv{cursor:pointer;display:grid;place-items:center}
.pairview img{width:130px;height:130px;object-fit:contain}
.list{display:flex;flex-direction:column;gap:10px;width:100%}
.list .btn{font-size:19px;text-align:left;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">

  </aside>
  <div class="phone"><div class="screen" id="screen"></div></div>
</div>

    const els = toks.map((x, i) => { const c = document.createElement("div"); c.className = "card tap"; c.textContent = x; c.onclick = () => { if (st.over) return; sel.has(i) ? sel.delete(i) : sel.add(i); c.classList.toggle("sel"); }; wrap.appendChild(c); return c; });
    const want = [...t.spans].sort().join(","), letters = new Set(t.spans);
    nextBtn(foot, UI.check, () => { const got = [...sel].map((i) => toks[i]).sort().join(","); const ok = got === want; if (!ok) els.forEach((c, i) => { if (sel.has(i)) c.classList.add(letters.has(toks[i]) ? "good" : "bad"); }); answer(ok, got, () => els.forEach((c, i) => { c.classList.remove("sel", "bad"); if (letters.has(toks[i])) c.classList.add("good"); })); if (!ok && !st.over) setTimeout(() => { sel.clear(); els.forEach((c) => c.classList.remove("sel", "good", "bad")); }, 1100); });
  },
  tracing({ t, body, foot, vis, answer }) {
    vis.innerHTML = `<div class="trace">${writing(t.show.text, t.show.mode)}<canvas width="600" height="400"></canvas></div>`;
    const cv = vis.querySelector("canvas"), g = cv.getContext("2d"); let ink = 0, down = false;
    g.lineWidth = 16; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#8e3bd1";
    const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 2, (e.clientY - r.top) * 2]; };
    cv.onpointerdown = (e) => { down = true; cv.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pos(e)); };
    cv.onpointermove = (e) => { if (!down) return; g.lineTo(...pos(e)); g.stroke(); ink++; if (ink > 12) btn.disabled = false; };
    cv.onpointerup = () => { down = false; };
    const n = document.createElement("div"); n.className = "note"; n.textContent = t.show.mode === "trace" ? UI.trace : UI.copy; body.appendChild(n);
    const btn = nextBtn(foot, UI.done, () => answer(true, "", () => {})); btn.disabled = true;
  },
  speak({ t, body, foot, vis, answer }) {
    vis.innerHTML = show(t.show);
    const n = document.createElement("div"); n.className = "note"; n.textContent = UI.speakNote; body.appendChild(n);
    const b = nextBtn(foot, "🎤 " + UI.said, () => { b.disabled = true; b.textContent = "…"; setTimeout(() => answer(true, "", () => {}), 900); });
  },
  matching({ t, body, foot, vis, answer, st }) {
    // Tap a left item (it says its word), then the right item it belongs to.
    const n = t.pairs.length, order = t.pairs.map((_, i) => (i + 1) % n); // right side shown in another order
    const link = Array(n).fill(null); let sel = null; // link[left] = right index
    const g = document.createElement("div"); g.className = "pairs";
    // Sides render at option size, so scattered dots and groups fit their tile.
    const side = (o) => o.drawn === "dots" ? drawn(o, { small: o.layout !== "dice" }) : o.count != null ? pic(o, { small: true }) : o.text != null ? `<span style="font:700 30px Andika,sans-serif;white-space:nowrap">${esc(o.text)}</span>` : show(o);
    const L = t.pairs.map((p, i) => { const b = document.createElement("button"); b.className = "opt"; b.innerHTML = side(p.left); return b; });
    const R = order.map((pi) => { const b = document.createElement("button"); b.className = "opt"; b.innerHTML = side(t.pairs[pi].right); b.dataset.pi = pi; return b; });
    for (let i = 0; i < n; i++) { g.appendChild(L[i]); g.appendChild(R[i]); }
    body.appendChild(g);
    // A colour side marks its pair in that colour; other pairs get one each.
    const PAIR = ["#8e3bd1", "#1E88E5", "#F57C00", "#2e9e48", "#d4483f", "#00897b"];
    const ring = (i) => D.colours[t.pairs[i].left.colour] ?? PAIR[i % PAIR.length];
    const draw = () => {
      L.forEach((b, i) => { b.classList.toggle("sel", sel === i); b.style.outline = link[i] != null ? `5px solid ${ring(i)}` : ""; });
      R.forEach((b, ri) => { const li = link.indexOf(ri); b.style.borderColor = li >= 0 ? ring(li) : ""; b.style.boxShadow = li >= 0 ? `0 4px 0 ${ring(li)}` : ""; });
      btn.disabled = link.includes(null);
    };
    L.forEach((b, i) => b.onclick = () => { if (st.over) return; if (t._pairs?.[i]?.left) play(t._pairs[i].left); sel = sel === i ? null : i; draw(); });
    R.forEach((b, ri) => b.onclick = () => { if (st.over) return; const had = link.indexOf(ri); if (sel == null) { if (had >= 0) { link[had] = null; draw(); } return; } if (had >= 0) link[had] = null; link[sel] = ri; sel = null; draw(); });
    const btn = nextBtn(foot, UI.check, () => {
      const right = link.map((ri, li) => +R[ri].dataset.pi === li), ok = right.every(Boolean);
      if (!ok) right.forEach((r, li) => { if (!r) { L[li].classList.add("bad"); R[link[li]].classList.add("bad"); } });
      answer(ok, link.join(","), () => { t.pairs.forEach((_, li) => link[li] = order.indexOf(li)); L.forEach((b) => b.classList.remove("bad")); R.forEach((b) => b.classList.remove("bad")); draw(); L.concat(R).forEach((b) => b.classList.add("good")); });
      if (!ok && !st.over) setTimeout(() => { right.forEach((r, li) => { if (!r) { L[li].classList.remove("bad"); R[link[li]].classList.remove("bad"); link[li] = null; } }); draw(); }, 1000);
    });
    draw();
  },
  sorting({ t, body, foot, vis, answer, st }) {
    // Tap a picture, then the box it belongs in. Tapping a box says its word.
    const place = t.options.map(() => null); let sel = null;
    const pool = document.createElement("div"); pool.className = "chips"; pool.style.marginTop = "0"; vis.appendChild(pool);
    const binsEl = document.createElement("div"); binsEl.className = "bins"; binsEl.style.gridTemplateColumns = `repeat(${t.bins.length},1fr)`; body.appendChild(binsEl);
    const items = t.options.map((o, i) => { const b = document.createElement("button"); b.className = "opt"; b.innerHTML = show(o); b.style.minHeight = "84px"; b.onclick = () => { if (st.over) return; if (t._options?.[i]) play(t._options[i]); if (place[i] != null) { place[i] = null; sel = null; } else sel = sel === i ? null : i; draw(); }; return b; });
    const boxes = t.bins.map((bn, bi) => { const box = document.createElement("div"); box.className = "bin"; const head = document.createElement("div"); head.innerHTML = show(bn.show); head.firstElementChild?.setAttribute("width", "56"); head.firstElementChild?.setAttribute("height", "56"); box.appendChild(head); const inner = document.createElement("div"); inner.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;justify-content:center"; box.appendChild(inner); box.onclick = (e) => { if (st.over || e.target.closest(".opt")) return; if (t._bins?.[bi]) play(t._bins[bi]); if (sel != null) { place[sel] = bn.id; sel = null; draw(); } }; binsEl.appendChild(box); return inner; });
    const draw = () => {
      items.forEach((b, i) => { b.classList.toggle("sel", sel === i); const target = place[i] == null ? pool : boxes[t.bins.findIndex((bn) => bn.id === place[i])]; b.style.minHeight = place[i] == null ? "84px" : "60px"; b.querySelector("img")?.style.setProperty("width", place[i] == null ? "84px" : "52px"); b.querySelector("img")?.style.setProperty("height", place[i] == null ? "84px" : "52px"); if (b.parentElement !== target) target.appendChild(b); });
      btn.disabled = place.includes(null);
    };
    const btn = nextBtn(foot, UI.check, () => {
      const right = place.map((p, i) => p === t.options[i].bin), ok = right.every(Boolean);
      if (!ok) right.forEach((r, i) => { if (!r) items[i].classList.add("bad"); });
      answer(ok, place.join(","), () => { t.options.forEach((o, i) => place[i] = o.bin); items.forEach((b) => { b.classList.remove("bad"); b.classList.add("good"); }); draw(); });
      if (!ok && !st.over) setTimeout(() => { right.forEach((r, i) => { if (!r) { items[i].classList.remove("bad"); place[i] = null; } }); draw(); }, 1000);
    });
    draw();
  },
  tap_to_count({ t, body, vis, answer, st }) {
    // Tap each picture once (it gets its number), then choose how many.
    vis.innerHTML = pic(t.show); vis.style.width = "100%";
    let n = 0;
    vis.querySelectorAll(".it").forEach((it) => it.onclick = () => { if (st.over || it.classList.contains("tapped")) return; n++; it.dataset.n = n; it.classList.add("tapped"); });
    choice({ t, body, vis: { set innerHTML(v) {} }, answer, st });
  },
  ordering({ t, body, foot, answer, st }) {
    // Tap cards in order to fill the slots; tap a filled slot to empty it.
    const slots = Array(t.slot_count).fill(null);
    const row = document.createElement("div"); row.className = "chips"; row.style.marginTop = "0"; body.appendChild(row);
    const sl = document.createElement("div"); sl.className = "frame"; sl.style.gap = "10px"; body.appendChild(sl);
    const cards = t.options.map((o, i) => { const b = optEl(o, t, i); b.onclick = () => { if (st.over || slots.includes(i)) return; const k = slots.indexOf(null); if (k >= 0) { slots[k] = i; draw(); } }; row.appendChild(b); return b; });
    const draw = () => {
      sl.innerHTML = ""; slots.forEach((ci, k) => { const g = document.createElement("span"); g.className = "gap" + (ci != null ? " filled" : ""); g.style.minWidth = "62px"; g.style.height = "72px"; g.innerHTML = ci == null ? "" : (typeof t.options[ci] === "string" ? esc(t.options[ci]) : show(t.options[ci], { small: true })); g.onclick = () => { if (!st.over && ci != null) { slots[k] = null; draw(); } }; sl.appendChild(g); });
      cards.forEach((b, i) => b.classList.toggle("dim", slots.includes(i)));
      btn.disabled = slots.includes(null);
    };
    const btn = nextBtn(foot, UI.check, () => {
      const got = slots.map((ci) => keyOf(t.options[ci])), ok = got.every((g, k) => g === String(t.answer[k]));
      sl.querySelectorAll(".gap").forEach((g, k) => g.style.background = got[k] === String(t.answer[k]) ? "var(--good-soft)" : "var(--bad-soft)");
      answer(ok, got.join(","), () => { t.answer.forEach((a, k) => slots[k] = t.options.findIndex((o) => keyOf(o) === String(a))); draw(); sl.querySelectorAll(".gap").forEach((g) => g.style.background = "var(--good-soft)"); });
      if (!ok && !st.over) setTimeout(() => { got.forEach((g, k) => { if (g !== String(t.answer[k])) slots[k] = null; }); draw(); }, 1000);
    });
    draw();
  },
  _unknown({ t, foot, body }) { body.insertAdjacentHTML("beforeend", `<div class="note">Typ ${esc(t.type)} ist im Player noch nicht umgesetzt.</div>`); nextBtn(foot); },
};

/* ---------- side panel ---------- */
function sidebar() {
  const ul = $("#steps"); ul.innerHTML = ""; let last = null;
  steps.forEach((s, i) => {
    const grp = s.a ? actName(s.a) + (s.kind === "task" && s.a.activity === "practise" ? ` · ${{ full: "full hints", some: "one hint", none: "no hints" }[s.stage]}` : "") : null;
    if (grp && grp !== last) { const g = document.createElement("li"); g.className = "grp"; g.textContent = grp; ul.appendChild(g); last = grp; }
    const li = document.createElement("li"); if (i === at) li.className = "on";
    li.textContent = s.kind === "task" ? `${s.t.id} · ${s.t.type}${results[i] ? " · " + results[i] : ""}` : s.kind === "learn" ? `Screen ${s.i + 1}` : { start: "Start", stage: "Stage change", checkIntro: "Check starts", end: "End" }[s.kind];
    li.onclick = () => go(i); ul.appendChild(li);
  });
  const s = steps[at], rec = s.t ?? s.s ?? (s.kind === "start" ? { lesson: lesson.n, title: lesson.title, activities: lesson.activities.map((a) => a.activity) } : s.st ? { stage: s.st.support, setting: s.st.setting } : { kind: s.kind });
  $("#rec").textContent = JSON.stringify(rec, (k, v) => k.startsWith("_") && k !== "_audio" ? undefined : v, 2);
  // Keep the current step in view inside the desktop panel; never scroll the page.
  const side = $(".side"), li = ul.querySelector(".on");
  if (li && getComputedStyle(side).position === "sticky") side.scrollTop = Math.max(0, li.offsetTop - side.clientHeight / 2);
}
function pickSet(i) {
  set = D.sets[i]; const L = $("#les"); L.innerHTML = "";
  set.lessons.forEach((l) => L.add(new Option(`${l.n}. ${l.title[set.language] ?? l.title.de}`, l.n)));
  pickLesson(set.lessons[0].n);
}
function pickLesson(n) {
  lesson = set.lessons.find((l) => l.n === +n); $("#les").value = String(n); buildSteps(); go(0);
  try { localStorage.setItem("twist-pos", JSON.stringify([D.sets.indexOf(set), lesson.n])); } catch (e) {}
}
$("#built").textContent = D.built;
D.sets.forEach((s, i) => $("#set").add(new Option(`${s.id.split(".")[0]} · ${s.title[s.language] ?? s.title.de} (${s.year})`, i)));
$("#set").onchange = (e) => pickSet(+e.target.value);
$("#les").onchange = (e) => pickLesson(e.target.value);
$("#auto").onchange = (e) => { try { localStorage.setItem("twist-auto", e.target.checked ? "1" : "0"); } catch (x) {} };
let pos = [0, 1]; try { pos = JSON.parse(localStorage.getItem("twist-pos")) || pos; } catch (e) {}
$("#set").value = String(pos[0] ?? 0); pickSet(pos[0] ?? 0); if (pos[1]) pickLesson(pos[1]);
</script>
