    page: 34
    text: "preparing poems and plays to read aloud and to perform, showing understanding through intonation, tone and volume so that the meaning is clear to an audience"
  - code: nc-english-2014.y56.reading-comprehension.9
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    lead: "understand what they read by:"
    page: 34
    text: "checking that the book makes sense to them, discussing their understanding and exploring the meaning of words in context"
  - code: nc-english-2014.y56.reading-comprehension.10
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    lead: "understand what they read by:"
    page: 34
    text: "asking questions to improve their understanding"
  - code: nc-english-2014.y56.reading-comprehension.11
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    lead: "understand what they read by:"
    page: 34
    text: "drawing inferences such as inferring characters’ feelings, thoughts and motives from their actions, and justifying inferences with evidence"
  - code: nc-english-2014.y56.reading-comprehension.12
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    lead: "understand what they read by:"
    page: 34
    text: "predicting what might happen from details stated and implied"
  - code: nc-english-2014.y56.reading-comprehension.13
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    lead: "understand what they read by:"
    page: 34
    text: "summarising the main ideas drawn from more than one paragraph, identifying key details that support the main ideas"
  - code: nc-english-2014.y56.reading-comprehension.14
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    lead: "understand what they read by:"
    page: 34
    text: "identifying how language, structure and presentation contribute to meaning"
  - code: nc-english-2014.y56.reading-comprehension.15
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    page: 34
    text: "discuss and evaluate how authors use language, including figurative language, considering the impact on the reader"
  - code: nc-english-2014.y56.reading-comprehension.16
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    page: 34
    text: "distinguish between statements of fact and opinion"
  - code: nc-english-2014.y56.reading-comprehension.17
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    page: 34
    text: "retrieve, record and present information from non-fiction"
  - code: nc-english-2014.y56.reading-comprehension.18
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    page: 34
    text: "participate in discussions about books that are read to them and those they can read for themselves, building on their own and others’ ideas and challenging views courteously"
  - code: nc-english-2014.y56.reading-comprehension.19
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    page: 34
    text: "explain and discuss their understanding of what they have read, including through formal presentations and debates, maintaining a focus on the topic and using notes where necessary"
  - code: nc-english-2014.y56.reading-comprehension.20
    kind: content
    area: "Reading – comprehension"
    band: end-year-6
    page: 34
    text: "provide reasoned justifications for their views"
  - code: nc-english-2014.y56.writing-transcription.spelling.1
    kind: content
    area: "Writing – transcription"
    group: "Spelling"
    band: end-year-6
    page: 36
    text: "use further prefixes and suffixes and understand the guidance for adding them"
  - code: nc-english-2014.y56.writing-transcription.spelling.2
    kind: content
    area: "Writing – transcription"
    group: "Spelling"
    band: end-year-6
    page: 36
    text: "spell some words with ‘silent’ letters [for example, knight, psalm, solemn]"
  - code: nc-english-2014.y56.writing-transcription.spelling.3
    kind: content
    area: "Writing – transcription"
    group: "Spelling"
    band: end-year-6
    page: 36
    text: "continue to distinguish between homophones and other words which are often confused"
  - code: nc-english-2014.y56.writing-transcription.spelling.4
    kind: content
    area: "Writing – transcription"
    group: "Spelling"
    band: end-year-6
    page: 36
    text: "use knowledge of morphology and etymology in spelling and understand that the spelling of some words needs to be learnt specifically, as listed in English Appendix 1"
  - code: nc-english-2014.y56.writing-transcription.spelling.5
    kind: content
    area: "Writing – transcription"
    group: "Spelling"
    band: end-year-6
    page: 36
    text: "use dictionaries to check the spelling and meaning of words"
  - code: nc-english-2014.y56.writing-transcription.spelling.6
    kind: content
    area: "Writing – transcription"
    group: "Spelling"
    band: end-year-6
    page: 36
    text: "use the first three or four letters of a word to check spelling, meaning or both of these in a dictionary"
  - code: nc-english-2014.y56.writing-transcription.spelling.7
    kind: content
    area: "Writing – transcription"
    group: "Spelling"
    band: end-year-6
    page: 36
    text: "use a thesaurus"
  - code: nc-english-2014.y56.writing-transcription.handwriting-and-presentation.1
    kind: content
    area: "Writing – transcription"
    group: "Handwriting and presentation"
    band: end-year-6
    lead: "write legibly, fluently and with increasing speed by:"
    page: 36
    text: "choosing which shape of a letter to use when given choices and deciding whether or not to join specific letters"
  - code: nc-english-2014.y56.writing-transcription.handwriting-and-presentation.2
    kind: content
    area: "Writing – transcription"
    group: "Handwriting and presentation"
    band: end-year-6
    lead: "write legibly, fluently and with increasing speed by:"
    page: 36
    text: "choosing the writing implement that is best suited for a task"
  - code: nc-english-2014.y56.writing-composition.1
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "plan their writing by:"
    page: 37
    text: "identifying the audience for and purpose of the writing, selecting the appropriate form and using other similar writing as models for their own"
  - code: nc-english-2014.y56.writing-composition.2
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "plan their writing by:"
    page: 37
    text: "noting and developing initial ideas, drawing on reading and research where necessary"
  - code: nc-english-2014.y56.writing-composition.3
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "plan their writing by:"
    page: 37
    text: "in writing narratives, considering how authors have developed characters and settings in what pupils have read, listened to or seen performed"
  - code: nc-english-2014.y56.writing-composition.4
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "draft and write by:"
    page: 37
    text: "selecting appropriate grammar and vocabulary, understanding how such choices can change and enhance meaning"
  - code: nc-english-2014.y56.writing-composition.5
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "draft and write by:"
    page: 37
    text: "in narratives, describing settings, characters and atmosphere and integrating dialogue to convey character and advance the action"
  - code: nc-english-2014.y56.writing-composition.6
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "draft and write by:"
    page: 37
    text: "précising longer passages"
  - code: nc-english-2014.y56.writing-composition.7
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "draft and write by:"
    page: 37
    text: "using a wide range of devices to build cohesion within and across paragraphs"
  - code: nc-english-2014.y56.writing-composition.8
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "draft and write by:"
    page: 37
    text: "using further organisational and presentational devices to structure text and to guide the reader [for example, headings, bullet points, underlining]"
  - code: nc-english-2014.y56.writing-composition.9
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "evaluate and edit by:"
    page: 37
    text: "assessing the effectiveness of their own and others’ writing"
  - code: nc-english-2014.y56.writing-composition.10
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "evaluate and edit by:"
    page: 37
    text: "proposing changes to vocabulary, grammar and punctuation to enhance effects and clarify meaning"
  - code: nc-english-2014.y56.writing-composition.11
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "evaluate and edit by:"
    page: 37
    text: "ensuring the consistent and correct use of tense throughout a piece of writing"
  - code: nc-english-2014.y56.writing-composition.12
    kind: content
    area: "Writing – composition"
    band: end-year-6
    lead: "evaluate and edit by:"
    page: 37
    text: "ensuring correct subject and verb agreement when using singular and plural, distinguishing between the language of speech and writing and choosing the appropriate register"
  - code: nc-english-2014.y56.writing-composition.13
    kind: content
    area: "Writing – composition"
    band: end-year-6
    page: 37
    text: "proof-read for spelling and punctuation errors"
  - code: nc-english-2014.y56.writing-composition.14
    kind: content
    area: "Writing – composition"
    band: end-year-6
    page: 38
    text: "perform their own compositions, using appropriate intonation, volume, and movement so that meaning is clear"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.1
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "develop their understanding of the concepts set out in English Appendix 2 by:"
    page: 38
    text: "recognising vocabulary and structures that are appropriate for formal speech and writing, including subjunctive forms"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.2
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "develop their understanding of the concepts set out in English Appendix 2 by:"
    page: 38
    text: "using passive verbs to affect the presentation of information in a sentence"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.3
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "develop their understanding of the concepts set out in English Appendix 2 by:"
    page: 38
    text: "using the perfect form of verbs to mark relationships of time and cause"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.4
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "develop their understanding of the concepts set out in English Appendix 2 by:"
    page: 38
    text: "using expanded noun phrases to convey complicated information concisely"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.5
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "develop their understanding of the concepts set out in English Appendix 2 by:"
    page: 38
    text: "using modal verbs or adverbs to indicate degrees of possibility"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.6
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "develop their understanding of the concepts set out in English Appendix 2 by:"
    page: 38
    text: "using relative clauses beginning with who, which, where, when, whose, that or with an implied (i.e. omitted) relative pronoun"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.7
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "develop their understanding of the concepts set out in English Appendix 2 by:"
    page: 38
    text: "learning the grammar for years 5 and 6 in English Appendix 2"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.8
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "indicate grammatical and other features by:"
    page: 38
    text: "using commas to clarify meaning or avoid ambiguity in writing"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.9
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "indicate grammatical and other features by:"
    page: 38
    text: "using hyphens to avoid ambiguity"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.10
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "indicate grammatical and other features by:"
    page: 38
    text: "using brackets, dashes or commas to indicate parenthesis"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.11
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "indicate grammatical and other features by:"
    page: 38
    text: "using semi-colons, colons or dashes to mark boundaries between independent clauses"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.12
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "indicate grammatical and other features by:"
    page: 38
    text: "using a colon to introduce a list"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.13
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    lead: "indicate grammatical and other features by:"
    page: 38
    text: "punctuating bullet points consistently"
  - code: nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.14
    kind: content
    area: "Writing – vocabulary, grammar and punctuation"
    band: end-year-6
    page: 38
    text: "use and understand the grammatical terminology in English Appendix 2 accurately and appropriately in discussing their writing and reading"
