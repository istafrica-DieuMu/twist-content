    area: "Raum und Form"
    group: "Geometrische Figuren erkennen, benennen und darstellen"
    page: 18
    text: "stellen Modelle von Körpern (Vollmodelle, Flächenmodelle, Kantenmodelle) und ebenen Figuren her und untersuchen (z. B. bauen, legen, zerlegen, zusammenfügen, ausschneiden, falten) diese, auch unter Nutzung digitaler Werkzeuge"
  - code: kmk-mathe-2022.rf.7
