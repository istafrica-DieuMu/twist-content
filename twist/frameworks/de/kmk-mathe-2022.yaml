    kind: content
    area: "Muster, Strukturen und funktionaler Zusammenhang"
    group: "Funktionale Beziehungen erkennen, beschreiben und darstellen"
    page: 17
    text: "lösen Sachaufgaben zu funktionalen Zusammenhängen (z. B. Proportionalität)."
  - code: kmk-mathe-2022.rf.1
    kind: content
    area: "Raum und Form"
    group: "Über räumliches Vorstellungsvermögen verfügen"
    page: 17
