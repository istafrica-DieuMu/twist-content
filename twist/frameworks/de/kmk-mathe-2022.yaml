    text: "verstehen und nutzen Strukturen in arithmetischen und geometrischen Darstellungen (z. B. in Zahldarstellungen, Anschauungsmitteln)"
  - code: kmk-mathe-2022.msf.2
    kind: content
    area: "Muster, Strukturen und funktionaler Zusammenhang"
