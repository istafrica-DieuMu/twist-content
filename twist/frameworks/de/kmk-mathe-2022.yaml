    text: "erkennen und beschreiben Strukturen in geometrischen und arithmetischen Mustern (z. B. Zahlenfolgen, Pentominos) und nutzen diese in mathematischen Kontexten (z. B. Verschlüsselungen)"
  - code: kmk-mathe-2022.msf.3
    kind: content
    area: "Muster, Strukturen und funktionaler Zusammenhang"
    group: "Gesetzmäßigkeiten erkennen, beschreiben und darstellen"
    page: 17
    text: "erkennen, stellen Gleichheit von mathematischen Ausdrücken dar und nutzen diese (z. B. Zahlen durch verschiedene Terme ausdrücken, Terme vergleichen)."
  - code: kmk-mathe-2022.msf.4
    kind: content
    area: "Muster, Strukturen und funktionaler Zusammenhang"
    group: "Funktionale Beziehungen erkennen, beschreiben und darstellen"
    page: 17
    text: "erkennen und beschreiben funktionale Beziehungen in Sachsituationen (z. B. Menge - Preis)"
  - code: kmk-mathe-2022.msf.5
    kind: content
    area: "Muster, Strukturen und funktionaler Zusammenhang"
    group: "Funktionale Beziehungen erkennen, beschreiben und darstellen"
    page: 17
    text: "erkennen, beschreiben und stellen funktionale Beziehungen in Tabellen dar"
