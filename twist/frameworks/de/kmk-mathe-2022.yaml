    text: "stellen Daten in Tabellen, Schaubildern und Diagrammen dar, auch unter Nutzung digitaler Werkzeuge, und entnehmen Informationen aus Tabellen, Schaubildern und Diagrammen"
  - code: kmk-mathe-2022.dz.3
    kind: content
    area: "Daten und Zufall"
    group: "Mit Daten umgehen"
