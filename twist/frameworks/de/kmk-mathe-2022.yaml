    text: "erkennen und beschreiben Eigenschaften der Achsensymmetrie und setzen diese mit der Achsenspiegelung in Beziehung"
  - code: kmk-mathe-2022.rf.11
    kind: content
    area: "Raum und Form"
    group: "Geometrische Abbildungen erkennen, benennen und darstellen"
    page: 18
