  - code: kmk-mathe-2022.rf.2
    kind: content
    area: "Raum und Form"
    group: "Über räumliches Vorstellungsvermögen verfügen"
    page: 17
    text: "erkennen, beschreiben und nutzen räumliche Beziehungen (z. B. zwei- und dreidimensionale Darstellungen zueinander in Beziehung setzen, wie Bauplan und Bauwerk, Körper und Netz)"
  - code: kmk-mathe-2022.rf.3
    kind: content
    area: "Raum und Form"
    group: "Über räumliches Vorstellungsvermögen verfügen"
    page: 17
    text: "operieren (z. B. zerlegen, falten, drehen, spiegeln, bauen) mit geometrischen Objekten gedanklich."
  - code: kmk-mathe-2022.rf.4
