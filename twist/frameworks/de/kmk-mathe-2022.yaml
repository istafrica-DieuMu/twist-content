    group: "Zahldarstellungen und Zahlbeziehungen verstehen"
    page: 15
    text: "erkennen, erklären und nutzen den Aufbau des dezimalen Stellenwertsystems (z. B. Bündelungsprinzip, Stellenwertprinzip)"
  - code: kmk-mathe-2022.zo.2
    kind: content
    area: "Zahl und Operation"
    group: "Zahldarstellungen und Zahlbeziehungen verstehen"
    page: 15
    text: "stellen Zahlen bis 1 000 000 auf verschiedene Weise dar (z. B. Anschauungsmittel, Stufenschrift, Stellenwerttabelle, Zifferndarstellung) und setzen diese zueinander in Beziehung"
  - code: kmk-mathe-2022.zo.3
    kind: content
    area: "Zahl und Operation"
    group: "Zahldarstellungen und Zahlbeziehungen verstehen"
    page: 15
    text: "orientieren sich im Zahlenraum bis 1 000 000 (z. B. Zahlen der Größe nach ordnen, Nachbarzahlen bestimmen)."
  - code: kmk-mathe-2022.zo.4
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen verstehen und beherrschen"
    page: 15
    text: "verfügen über ein Operationsverständnis zu den vier Grundrechenarten und erkennen und nutzen die Zusammenhänge zwischen den Operationen"
  - code: kmk-mathe-2022.zo.5
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen verstehen und beherrschen"
    page: 15
    text: "beherrschen die Grundaufgaben des Kopfrechnens (u. a. Zahlzerlegungen, Einspluseins, Einmaleins) gedächtnismäßig und leiten deren Umkehrungen sicher ab"
  - code: kmk-mathe-2022.zo.6
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen verstehen und beherrschen"
    page: 15
    text: "übertragen die Grundaufgaben des Kopfrechnens auf analoge Aufgaben im Zahlenraum bis zur Million"
  - code: kmk-mathe-2022.zo.7
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen verstehen und beherrschen"
    page: 15
    text: "verstehen mündliche und halbschriftliche Rechenstrategien zu den vier Grundrechenarten und setzen diese flexibel ein"
  - code: kmk-mathe-2022.zo.8
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen verstehen und beherrschen"
    page: 15
    text: "beschreiben, vergleichen und bewerten verschiedene Rechenwege; finden, erklären und berichtigen Rechenfehler"
  - code: kmk-mathe-2022.zo.9
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen verstehen und beherrschen"
    page: 15
    text: "erkennen, erklären und nutzen Rechengesetze (z. B. Kommutativgesetz: Tauschaufgaben)"
  - code: kmk-mathe-2022.zo.10
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen verstehen und beherrschen"
    page: 15
    text: "verstehen schriftliche Verfahren der Addition, Subtraktion und Multiplikation, beschreiben den Algorithmus, führen diesen geläufig aus und wenden ihn bei geeigneten Aufgaben an"
  - code: kmk-mathe-2022.zo.11
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen verstehen und beherrschen"
    page: 15
    text: "kontrollieren Lösungen durch geeignete Vorgehensweisen (z. B. Überschlagsrechnung, Umkehroperation)."
  - code: kmk-mathe-2022.zo.12
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen in Kontexten anwenden"
    page: 15
    text: "wenden bei Sachaufgaben Rechenoperationen an und beschreiben die Beziehungen zwischen der Sache und den einzelnen Lösungsschritten"
  - code: kmk-mathe-2022.zo.13
    kind: content
    area: "Zahl und Operation"
    group: "Rechenoperationen in Kontexten anwenden"
    page: 15
    text: "runden und überschlagen sachadäquat."
  - code: kmk-mathe-2022.gm.1
    kind: content
    area: "Größen und Messen"
    group: "Über Größenvorstellungen verfügen"
    page: 16
    text: "vergleichen und ordnen Größen (Geldwerte, Längen, Zeitspannen, Massen, Flächeninhalte und Volumina)"
  - code: kmk-mathe-2022.gm.2
    kind: content
    area: "Größen und Messen"
    group: "Über Größenvorstellungen verfügen"
    page: 16
    text: "kennen Standardeinheiten (zu Geldwerten, Längen, Zeitspannen, Hohlmaßen und zur Masse) und setzen diese im jeweiligen Größenbereich zueinander in Beziehung"
  - code: kmk-mathe-2022.gm.3
    kind: content
    area: "Größen und Messen"
    group: "Über Größenvorstellungen verfügen"
    page: 16
    text: "entwickeln und nutzen Vorstellungen über Repräsentanten für Standardeinheiten und im Alltag bedeutsame Größen (z. B. Höhe der Tür, Dauer der Schulstunde)"
  - code: kmk-mathe-2022.gm.4
    kind: content
    area: "Größen und Messen"
    group: "Über Größenvorstellungen verfügen"
    page: 16
    text: "kennen und verstehen im Alltag gebräuchliche einfache Brüche im Zusammenhang mit Größen (z. B. ½ m, Dreiviertelstunde, ¼ l)."
  - code: kmk-mathe-2022.gm.5
    kind: content
    area: "Größen und Messen"
    group: "Größen messen und Maßangaben bestimmen"
    page: 16
    text: "verstehen und nutzen (u. a. Flächeninhalte durch Auslegen mit Einheitsquadraten, Rauminhalte durch Messen mit Einheitswürfeln) das Grundprinzip des Messens (nicht-standardisierte und standardisierte Einheitsmaße auswählen, wiederholt nutzen und ggf. in Beziehung zu Untereinheiten setzen)"
  - code: kmk-mathe-2022.gm.6
    kind: content
    area: "Größen und Messen"
    group: "Größen messen und Maßangaben bestimmen"
    page: 16
    text: "messen Längen, Zeitspannen, Massen und Hohlmaße mit geeigneten Einheiten und unterschiedlichen Messgeräten sachgerecht"
  - code: kmk-mathe-2022.gm.7
    kind: content
    area: "Größen und Messen"
    group: "Größen messen und Maßangaben bestimmen"
    page: 16
    text: "benennen Größenangaben mit verschiedenen Einheiten und stellen diese in unterschiedlichen Schreibweisen (z. B. 2,5 km | 2500 m | 2 km 500 m) dar."
  - code: kmk-mathe-2022.gm.8
    kind: content
    area: "Größen und Messen"
    group: "Mit Größen in Kontexten umgehen"
    page: 16
    text: "schätzen Größen sachadäquat und mit Bezug zu geeigneten Repräsentanten"
  - code: kmk-mathe-2022.gm.9
    kind: content
    area: "Größen und Messen"
    group: "Mit Größen in Kontexten umgehen"
    page: 16
    text: "rechnen in Sachsituationen angemessen mit Näherungswerten und prüfen Ergebnisse auf Plausibilität"
  - code: kmk-mathe-2022.gm.10
    kind: content
    area: "Größen und Messen"
    group: "Mit Größen in Kontexten umgehen"
    page: 16
    text: "lösen Sachaufgaben mit Größen."
  - code: kmk-mathe-2022.msf.1
