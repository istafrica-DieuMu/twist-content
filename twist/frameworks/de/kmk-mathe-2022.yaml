    page: 18
    text: "untersuchen und vergleichen ebene Figuren und Körper (ebene Figuren auch hinsichtlich des Umfangs und Flächeninhalts, Körper auch hinsichtlich des Rauminhalts)"
  - code: kmk-mathe-2022.rf.8
    kind: content
    area: "Raum und Form"
    group: "Geometrische Figuren erkennen, benennen und darstellen"
