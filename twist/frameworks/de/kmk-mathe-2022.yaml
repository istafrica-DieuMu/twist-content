    area: "Daten und Zufall"
    group: "Mit Daten umgehen"
    page: 19
    text: "lösen einfache kombinatorische Fragestellungen durch systematisches Vorgehen (z. B. systematisches Probieren) oder mit Hilfe von heuristischen Hilfsmitteln (z. B. Skizze, Baumdiagramm, Tabelle)."
  - code: kmk-mathe-2022.dz.5
