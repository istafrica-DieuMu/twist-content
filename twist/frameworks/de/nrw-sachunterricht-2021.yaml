    pair: nrw-sachunterricht-2021.p20
    page: 190
    text: "orientieren sich mit (digitalen) Karten und anderen Hilfsmittel in Räumen (Sonnenstand, markante Punkte, Kompass, Navigationsgeräte, GPS)"
  - code: nrw-sachunterricht-2021.rm.orientierung-in-raeumen.3
    kind: content
    area: "Raum und Mobilität"
    group: "Orientierung in Räumen"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p21
    page: 190
    text: "lesen und zeichnen einfache Pläne von vertrauten Räumen"
  - code: nrw-sachunterricht-2021.rm.orientierung-in-raeumen.4
    kind: content
    area: "Raum und Mobilität"
    group: "Orientierung in Räumen"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p21
    page: 190
    text: "erstellen einfache Modelle ausgewählter Räume ihrer Umgebung und beschreiben das Verhältnis von Wirklichkeit zu ihrer Darstellung"
  - code: nrw-sachunterricht-2021.rm.orientierung-in-raeumen.5
    kind: content
    area: "Raum und Mobilität"
    group: "Orientierung in Räumen"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p22
    page: 190
    text: "unterscheiden Merkmale verschiedener räumlicher Strukturen (ländlich, städtisch)"
  - code: nrw-sachunterricht-2021.rm.orientierung-in-raeumen.6
    kind: content
    area: "Raum und Mobilität"
    group: "Orientierung in Räumen"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p22
    page: 190
    text: "setzen ihre vertraute Umgebung in Beziehung zu größeren räumlichen Einheiten (Nordrhein-Westfalen, Deutschland, Europa, Welt)"
  - code: nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.1
    kind: content
    area: "Raum und Mobilität"
    group: "Räume nutzen und schützen"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p23
    page: 190
    text: "benennen die räumliche Struktur ihrer vertrauten Umgebung (Wohnort, kulturelle Angebote, Freizeitangebote)"
  - code: nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.2
    kind: content
    area: "Raum und Mobilität"
    group: "Räume nutzen und schützen"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p23
    page: 190
    text: "vergleichen Lebenssituationen von Menschen in anderen Räumen mit der eigenen Lebenssituation (u. a. Familienformen, Wohnort, Schule)"
  - code: nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.3
    kind: content
    area: "Raum und Mobilität"
    group: "Räume nutzen und schützen"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p24
    page: 190
    text: "erkunden die Gestaltung und Nutzung eines vertrauten Raums durch den Menschen"
  - code: nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.4
    kind: content
    area: "Raum und Mobilität"
    group: "Räume nutzen und schützen"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p24
    page: 190
    text: "erklären den Einfluss bestimmter Interessen auf die Gestaltung von Räumen (Tourismus, Mobilität)"
  - code: nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.5
    kind: content
    area: "Raum und Mobilität"
    group: "Räume nutzen und schützen"
    band: end-klasse-2
    page: 191
    text: "beschreiben Grundsätze eines nachhaltigen Umgangs mit Räumen"
  - code: nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.6
    kind: content
    area: "Raum und Mobilität"
    group: "Räume nutzen und schützen"
    band: end-klasse-4
    page: 191
    text: "entwickeln Handlungsmöglichkeiten zur Nutzung und zum Schutz von Räumen"
  - code: nrw-sachunterricht-2021.rm.mobilitaet-im-raum.1
    kind: content
    area: "Raum und Mobilität"
    group: "Mobilität im Raum"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p25
    page: 191
    text: "beschreiben verschiedene Formen von Mobilität im vertrauten Raum (u. a. Fußgänger, öffentliche Verkehrsmittel)"
  - code: nrw-sachunterricht-2021.rm.mobilitaet-im-raum.2
    kind: content
    area: "Raum und Mobilität"
    group: "Mobilität im Raum"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p25
    page: 191
    text: "orientieren sich auch mit digitalen Werkzeugen im ÖPNV"
  - code: nrw-sachunterricht-2021.rm.mobilitaet-im-raum.3
    kind: content
    area: "Raum und Mobilität"
    group: "Mobilität im Raum"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p26
    page: 191
    text: "berücksichtigen wichtige Verkehrsregeln und Verkehrszeichen sowie Sicherheitsvorkehrungen (u. a. helle Kleidung, Straßenschilder, Straßenmarkierungen)"
  - code: nrw-sachunterricht-2021.rm.mobilitaet-im-raum.4
    kind: content
    area: "Raum und Mobilität"
    group: "Mobilität im Raum"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p26
    page: 191
    text: "untersuchen die Verhaltensweisen von Verkehrsteilnehmerinnen und Verkehrsteilnehmern unter den Aspekten Verkehrssicherheit und Nachhaltigkeit und prüfen Handlungsalternativen"
  - code: nrw-sachunterricht-2021.rm.mobilitaet-im-raum.5
    kind: content
    area: "Raum und Mobilität"
    group: "Mobilität im Raum"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p27
    page: 191
    text: "fahren mit einem Roller oder Fahrrad einen Parcours"
  - code: nrw-sachunterricht-2021.rm.mobilitaet-im-raum.6
    kind: content
    area: "Raum und Mobilität"
    group: "Mobilität im Raum"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p27
    page: 191
    text: "beherrschen das Fahrrad motorisch sicher und nehmen an einer Fahrradausbildung teil"
  - code: nrw-sachunterricht-2021.tda.bauen-und-konstruieren.1
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Bauen und Konstruieren"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p28
    page: 191
    text: "überprüfen anhand selbstgebauter Fahrzeuge das Bewegungsverhalten rollender Objekte"
  - code: nrw-sachunterricht-2021.tda.bauen-und-konstruieren.2
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Bauen und Konstruieren"
    band: end-klasse-2
    page: 191
    text: "finden Lösungen für einfache technische Aufgaben, planen und realisieren deren Umsetzung"
  - code: nrw-sachunterricht-2021.tda.bauen-und-konstruieren.3
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Bauen und Konstruieren"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p28
    page: 191
    text: "überprüfen die Stabilität selbst konstruierter Modelle und beschreiben die Merkmale stabiler Bauweisen (Materialumformungen, Aussteifungen)"
  - code: nrw-sachunterricht-2021.tda.bauen-und-konstruieren.4
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Bauen und Konstruieren"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p29
    page: 191
    text: "bewerten und optimieren selbst konstruierte Modelle (u. a. Materialökonomie)"
  - code: nrw-sachunterricht-2021.tda.bauen-und-konstruieren.5
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Bauen und Konstruieren"
    band: end-klasse-4
    page: 192
    text: "simulieren und beschreiben das EVA- Prinzip (Eingabe, Verarbeitung, Ausgabe) als Grundprinzip der Datenverarbeitung in Informatiksystemen anhand eines Beispiels"
  - code: nrw-sachunterricht-2021.tda.bauen-und-konstruieren.6
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Bauen und Konstruieren"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p29
    page: 191
    text: "fertigen und nutzen zum Bau ihrer Modelle einfache Modellzeichnungen"
  - code: nrw-sachunterricht-2021.tda.bauen-und-konstruieren.7
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Bauen und Konstruieren"
    band: end-klasse-4
    page: 192
    text: "programmieren eine Sequenz"
  - code: nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.1
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Technische und digitale Entwicklungen"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p30
    page: 192
    text: "benutzen gebräuchliche (auch digitale) Werkzeuge und Materialien sachund sicherheitsgemäß"
  - code: nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.2
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Technische und digitale Entwicklungen"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p30
    page: 192
    text: "untersuchen den Aufbau und die Funktion einfacher technischer Geräte aus ihrem Alltag und beschreiben ihre Wirkungsweise"
  - code: nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.3
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Technische und digitale Entwicklungen"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p31
    page: 192
    text: "beschreiben – auch durch den Einfluss der Digitalisierung – die Entwicklung von Werkzeugen und Maschinen"
  - code: nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.4
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Technische und digitale Entwicklungen"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p31
    page: 192
    text: "erklären die Funktion ausgewählter, auch digitaler, Werkzeuge und Geräte für die Arbeitswelt"
  - code: nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.5
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Technische und digitale Entwicklungen"
    band: end-klasse-4
    page: 192
    text: "bewerten technische und digitale Entwicklungen im Hinblick auf die individuelle und die gesellschaftliche Bedeutung"
  - code: nrw-sachunterricht-2021.tda.arbeit-und-beruf.1
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Arbeit und Beruf"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p32
    page: 192
    text: "erkunden und recherchieren auch mit digitalen Werkzeugen aus dem Alltag bekannte Berufe"
  - code: nrw-sachunterricht-2021.tda.arbeit-und-beruf.2
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Arbeit und Beruf"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p32
    page: 192
    text: "unterscheiden Formen der Arbeitsorganisation und beschreiben die Auswirkungen auf Arbeitsprozesse, Menschen und Umwelt"
  - code: nrw-sachunterricht-2021.tda.arbeit-und-beruf.3
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Arbeit und Beruf"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p33
    page: 192
    text: "ordnen aus dem Alltag bekannte Berufe verschiedenen Arbeitsfeldern zu"
  - code: nrw-sachunterricht-2021.tda.arbeit-und-beruf.4
    kind: content
    area: "Technik, digitale Technologie und Arbeit"
    group: "Arbeit und Beruf"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p33
    page: 192
    text: "stellen auch unter Berücksichtigung der Gender-Perspektive unterschiedliche Berufe dar"
  - code: nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.1
    kind: content
    area: "Zeit und Wandel"
    group: "Orientierung in der Zeit"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p34
    page: 193
    text: "benennen unterschiedliche Zeiteinteilungen und Zeitmessungen (Jahreszeiten, Uhrzeit, Jahreskalender)"
  - code: nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.2
    kind: content
    area: "Zeit und Wandel"
    group: "Orientierung in der Zeit"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p34
    page: 193
    text: "verorten historische Ereignisse auf einer Zeitleiste"
  - code: nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.3
    kind: content
    area: "Zeit und Wandel"
    group: "Orientierung in der Zeit"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p35
    page: 193
    text: "ordnen historische Ereignisse in ihren Kontext ein (Lebensbedingungen, Herrschaftsformen)"
  - code: nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.4
    kind: content
    area: "Zeit und Wandel"
    group: "Orientierung in der Zeit"
    band: end-klasse-4
    page: 193
    text: "unterscheiden Bezeichnungen für größere Zeiträume und wenden sie zur Einordnung und Beschreibung von Ereignissen, Zeiträumen und Veränderungen an (u. a. Jahrhundert, Jahrtausend, Steinzeit)"
  - code: nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.5
    kind: content
    area: "Zeit und Wandel"
    group: "Orientierung in der Zeit"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p35
    page: 193
    text: "stellen wichtige Ereignisse und Daten zur eigenen Lebensgeschichte an einer Zeitleiste dar"
  - code: nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.6
    kind: content
    area: "Zeit und Wandel"
    group: "Orientierung in der Zeit"
    band: end-klasse-4
    page: 193
    text: "erklären anhand von Beispielen langsame Prozesse und abrupte Brüche als Formen des Wandels (u. a. Entwicklung zur Sesshaftigkeit, Veränderung von familiären Lebensformen und Geschlechtern, Erfindung des Computers/ Digitalisierung)"
  - code: nrw-sachunterricht-2021.zw.frueher-heute-und-morgen.1
    kind: content
    area: "Zeit und Wandel"
    group: "Früher, heute und morgen"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p36
    page: 193
    text: "benennen anhand von Beispielen und im Vergleich zu heute Unterschiede in den Lebensgewohnheiten und Lebensbedingungen von Menschen anderer Zeiträume (u. a. Steinzeit)"
  - code: nrw-sachunterricht-2021.zw.frueher-heute-und-morgen.2
    kind: content
    area: "Zeit und Wandel"
    group: "Früher, heute und morgen"
    band: end-klasse-4
    page: 193
    text: "entwickeln Fragen nach Veränderungen menschlichen Zusammenlebens in der Geschichte"
  - code: nrw-sachunterricht-2021.zw.frueher-heute-und-morgen.3
    kind: content
    area: "Zeit und Wandel"
    group: "Früher, heute und morgen"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p36
    page: 193
    text: "ordnen Beispiele aus der Lebenswelt „früher“, „heute“ und “morgen” zu und erklären ihre Zuordnung (Mobilität, Werkzeuge, Spielzeuge)"
  - code: nrw-sachunterricht-2021.zw.frueher-heute-und-morgen.4
    kind: content
    area: "Zeit und Wandel"
    group: "Früher, heute und morgen"
    band: end-klasse-4
    page: 194
    text: "stellen gegenwärtiges, gemeinschaftliches Leben und zukünftige Handlungsmöglichkeiten im Rollenspiel dar"
  - code: nrw-sachunterricht-2021.zw.fakten-und-fiktion.1
    kind: content
    area: "Zeit und Wandel"
    group: "Fakten und Fiktion"
    band: end-klasse-4
    pair: nrw-sachunterricht-2021.p37
    page: 194
    text: "setzen aus unterschiedlichen Verfahren (u. a. Quellenarbeit, Besuch von historischen Orten und Gedenkstätten, Analyse von Erzählungen von Zeitzeugen) gewonnene Erkenntnisse über Historisches als Bilder und Texte in narrativer Form um"
  - code: nrw-sachunterricht-2021.zw.fakten-und-fiktion.2
    kind: content
    area: "Zeit und Wandel"
    group: "Fakten und Fiktion"
    band: end-klasse-2
    pair: nrw-sachunterricht-2021.p37
    page: 194
    text: "unterscheiden die Darstellung historischer Begebenheiten in Sachtexten und Sachbilderbüchern und fiktiven Geschichten"
  - code: nrw-sachunterricht-2021.zw.fakten-und-fiktion.3
    kind: content
    area: "Zeit und Wandel"
    group: "Fakten und Fiktion"
    band: end-klasse-4
    page: 194
    text: "unterscheiden in der Auseinandersetzung mit medialen Geschichtsdarstellungen zwischen Realität und Fiktion (u. a. Computerspiele, filmische Darstellung)"
