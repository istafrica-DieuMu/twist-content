framework: kmk-deutsch-2022
title: "Bildungsstandards im Fach Deutsch für den Primarbereich (Beschluss der KMK vom 23.06.2022)"
url: "https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2022/2022_06_23-Bista-Primarbereich-Deutsch.pdf"
country: DE
domain: lit-de
band: end-klasse-4
standards:
  - code: kmk-deutsch-2022.sz.1
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Zu anderen sprechen"
    page: 12
    text: "äußern sich verständlich und situationsadäquat auch in der gesprochenen Standardsprache"
  - code: kmk-deutsch-2022.sz.2
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Zu anderen sprechen"
    page: 12
    text: "verfügen über einen angemessenen Wortschatz"
  - code: kmk-deutsch-2022.sz.3
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Zu anderen sprechen"
    page: 12
    text: "kommunizieren mit Blick auf Adressaten und Ziele situationsangemessen: erzählen, informieren: berichten, beschreiben, erklären, argumentieren, appellieren"
  - code: kmk-deutsch-2022.sz.4
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Zu anderen sprechen"
    page: 12
    text: "nutzen ihre Vorbereitungen (z. B. Notizen) für die sach- und situationsgerechte Gestaltung vertrauter oder überschaubarer Situationen, z. B. Unterrichtsgespräche, Diskussionen, Präsentationen"
  - code: kmk-deutsch-2022.sz.5
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Zu anderen sprechen"
    page: 12
    text: "bauen Redebeiträge in vertrauten und überschaubaren Situationen für andere nachvollziehbar und sinnvoll auf"
  - code: kmk-deutsch-2022.sz.6
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Zu anderen sprechen"
    page: 12
    text: "berücksichtigen ausgewählte Wirkungen ihrer Redeweise situations- und adressatengerecht: Lautstärke, Betonung, Sprechtempo, Pausen, Körpersprache (Gestik/Mimik), Körperhaltung"
  - code: kmk-deutsch-2022.sz.7
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Zu anderen sprechen"
    page: 12
    text: "geben in vertrauten und überschaubaren Situationen gezielt Feedback zu Redebeiträgen"
  - code: kmk-deutsch-2022.sz.8
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Zu anderen sprechen"
    page: 12
    text: "nutzen technische Möglichkeiten beim digitalen Kommunizieren in vertrauten und überschaubaren Situationen: die eigene Stimme aufzeichnen, Gesprächsregeln beim digital vermittelten Sprechen (Audio- und Videokonferenzen) einhalten."
  - code: kmk-deutsch-2022.sz.9
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Verstehend zuhören"
    page: 12
    text: "können in vertrauten und überschaubaren Kommunikationssituationen, Gesprächsprozesse verfolgen, verstehen und gezielt nachfragen, Verstehen und Nicht-Verstehen zum Ausdruck bringen (z. B. durch Nachfragen)"
  - code: kmk-deutsch-2022.sz.10
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Verstehend zuhören"
    page: 13
    text: "hören in vertrauten und überschaubaren Situationen sinnverstehend zu, geben Informationen wieder und ziehen einfache Schlussfolgerungen, erfassen dem Lernstand entsprechende Hörtexte, Gesprächsphasen oder Gespräche (z. B. zentrale Aussagen sowie Sprech- und Gesprächsabsichten), beurteilen einfache Aussagen zum Gehörten begründet, zeigen Aufmerksamkeit für paraverbale (z. B. Stimmführung, Körpersprache) und nonverbale Äußerungen (z. B. Gestik, Körperhaltung)"
  - code: kmk-deutsch-2022.sz.11
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Verstehend zuhören"
    page: 13
    text: "wenden in vertrauten und überschaubaren Situationen erste kognitive und metakognitive Strategien vor, während und nach dem Zuhören an, z. B. Blickkontakt herstellen, Fragen stellen, Medium mehrmals hören, Hörerwartung aufbauen."
  - code: kmk-deutsch-2022.sz.12
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Mit anderen sprechen"
    page: 13
    text: "beteiligen sich an vertrauten und überschaubaren Gesprächssituationen mit verständlichen, zuhörerbezogenen, themenbezogenen und konstruktiven Beiträgen"
  - code: kmk-deutsch-2022.sz.13
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Mit anderen sprechen"
    page: 13
    text: "beachten (gemeinsam entwickelte) Gesprächsregeln; achten auf eine wertschätzende Gesprächsatmosphäre"
  - code: kmk-deutsch-2022.sz.14
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Mit anderen sprechen"
    page: 13
    text: "formulieren in vertrauten und überschaubaren Situationen angemessen; gehen auf die Gesprächspartnerin bzw. den Gesprächspartner und die jeweilige Situation ein"
  - code: kmk-deutsch-2022.sz.15
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Mit anderen sprechen"
    page: 13
    text: "nehmen in Gesprächen einfache Rollen ein (z. B. Zuhörerin bzw. Zuhören, Sprecherin bzw. Sprecher)"
  - code: kmk-deutsch-2022.sz.16
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Mit anderen sprechen"
    page: 13
    text: "praktizieren ausgewählte Gesprächs- und Lernformen, z. B. Lesetandems, Rechtschreibgespräche, literarische Gespräche, Diskussionen, videogestützte Gespräche, Interviews"
  - code: kmk-deutsch-2022.sz.17
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Mit anderen sprechen"
    page: 13
    text: "wenden erste Gesprächsstrategien an, z. B. Fragen stellen, etwas zusammenfassen, Rückmeldung geben"
  - code: kmk-deutsch-2022.sz.18
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Mit anderen sprechen"
    page: 13
    text: "sprechen über das sprachliche und literarische Lernen sowie über Lernerfahrungen: geben Beobachtungen wieder, beschreiben Sachverhalte, geben Erklärungen und Begründungen, reflektieren."
  - code: kmk-deutsch-2022.sz.19
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Vor anderen sprechen"
    page: 13
    text: "leisten kurze, auch freie Beiträge adressatenorientiert und mit Hilfe eines Stichwortzettels/einer Gliederung/von Notizen/eines Textes, z. B. Kurzreferat, Präsentation, Gedicht"
  - code: kmk-deutsch-2022.sz.20
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Vor anderen sprechen"
    page: 13
    text: "nutzen ausgewählte Werkzeuge für das Sprechen vor anderen, z. B. Tafel, Plakat, Moderationskarten, Präsentationssoftware, Whiteboard"
  - code: kmk-deutsch-2022.sz.21
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Vor anderen sprechen"
    page: 14
    text: "planen und gestalten ausgewählte Formen des Präsentierens, z. B. Standbild, Kurzreferat"
  - code: kmk-deutsch-2022.sz.22
    kind: content
    area: "4.1 Sprechen und Zuhören"
    group: "Vor anderen sprechen"
    page: 14
    text: "planen und gestalten unter Anleitung Formen des szenischen Sprechens und Spielens, z. B. szenische Lesung, Szene, Aufführung, Hörspiel, Videoclip, Standbild, Improvisation."
  - code: kmk-deutsch-2022.sch.1
    kind: content
    area: "4.2 Schreiben"
    group: "Über Schreibfertigkeiten verfügen"
    page: 14
    text: "schreiben Buchstaben, Wörter, Wortgruppen und kurze Sätze flüssig, d. h. zügig, sicher und korrekt (automatisiert)"
  - code: kmk-deutsch-2022.sch.2
    kind: content
    area: "4.2 Schreiben"
    group: "Über Schreibfertigkeiten verfügen"
    page: 14
    text: "schreiben Texte in leserlicher Handschrift und mithilfe digitaler Schreibwerkzeuge"
  - code: kmk-deutsch-2022.sch.3
    kind: content
    area: "4.2 Schreiben"
    group: "Über Schreibfertigkeiten verfügen"
    page: 14
    text: "gestalten Texte (handschriftlich und mithilfe digitaler Schreibwerkzeuge) zielorientiert und übersichtlich, z. B. hinsichtlich Schriftgröße, Blattaufteilung, Seitenränder, Absätze."
  - code: kmk-deutsch-2022.sch.4
    kind: content
    area: "4.2 Schreiben"
    group: "Orthografisch schreiben"
    page: 15
    text: "kennen wortbezogene und zum Teil auch satzbezogene Rechtschreibstrategien und wenden diese an: vergleichen Wortschreibungen (z. B. orthografische Nachbarn: Raum/Saum, Unterscheidungsschreibungen: Wahl/Wal, Ausnahme- und Regelschreibungen: Vater/fahren, Basisschreibungen und abgeleitete Schreibungen: Hund/Hunde; Alternativschreibungen: kennenlernen/kennen lernen) und sprechen über Gemeinsamkeiten und Unterschiede, erschließen sich die Struktur von Kernwörtern, z. B. gliedern in Silben und Wortbestandteile, verlängern, flektieren, ableiten, erweitern, prägen sich Merkwörter ein (z. B. Eigennamen, Ausnahmeschreibungen), unterscheiden zwischen Kernwörtern und Fremdwörtern"
  - code: kmk-deutsch-2022.sch.5
    kind: content
    area: "4.2 Schreiben"
    group: "Orthografisch schreiben"
    page: 15
    text: "schreiben Kernwörter richtig (Inhalts- und Funktionswörter)"
  - code: kmk-deutsch-2022.sch.6
    kind: content
    area: "4.2 Schreiben"
    group: "Orthografisch schreiben"
    page: 15
    text: "schreiben häufig vorkommende Fremdwörter richtig (z. B. Melone, Vulkan, Maschine, Kabine)"
  - code: kmk-deutsch-2022.sch.7
    kind: content
    area: "4.2 Schreiben"
    group: "Orthografisch schreiben"
    page: 15
    text: "schreiben Satzanfänge, Eigennamen und Kerne von Nominalgruppen (Konkreta wie Haus, Buch; gängige Abstrakta wie Liebe, Glück) groß"
  - code: kmk-deutsch-2022.sch.8
    kind: content
    area: "4.2 Schreiben"
    group: "Orthografisch schreiben"
    page: 15
    text: "kennen und nutzen folgende Interpunktionszeichen: Punkt, Komma bei Aufzählungen, Fragezeichen, Ausrufezeichen, Anführungszeichen"
  - code: kmk-deutsch-2022.sch.9
    kind: content
    area: "4.2 Schreiben"
    group: "Orthografisch schreiben"
    page: 15
    text: "verfügen über Fehleraufmerksamkeit und nutzen Strategien zur Klärung orthografischer Fragen"
  - code: kmk-deutsch-2022.sch.10
    kind: content
    area: "4.2 Schreiben"
    group: "Orthografisch schreiben"
    page: 15
    text: "nutzen Rechtschreibhilfen (Wörterbuch und digitale Rechtschreibhilfe)"
  - code: kmk-deutsch-2022.sch.11
    kind: content
    area: "4.2 Schreiben"
    group: "Orthografisch schreiben"
    page: 15
    text: "überprüfen und korrigieren Texte auf orthografische Richtigkeit."
  - code: kmk-deutsch-2022.sch.12
    kind: content
    area: "4.2 Schreiben"
    group: "Texte planen und strukturieren"
    page: 15
    text: "sammeln Ideen, ordnen Informationen und fertigen eine Gliederung an, z. B. numerische Gliederung, Cluster, Mindmap"
  - code: kmk-deutsch-2022.sch.13
    kind: content
    area: "4.2 Schreiben"
    group: "Texte planen und strukturieren"
    page: 15
    text: "sammeln erste sprachliche Mittel: Wörter und Wortfelder"
  - code: kmk-deutsch-2022.sch.14
    kind: content
    area: "4.2 Schreiben"
    group: "Texte planen und strukturieren"
    page: 15
    text: "stellen Überlegungen zu den Adressaten (konkret, bekannt), deren thematischem Vorwissen und ihren angenommenen Lesezielen an"
  - code: kmk-deutsch-2022.sch.15
    kind: content
    area: "4.2 Schreiben"
    group: "Texte planen und strukturieren"
    page: 16
    text: "klären entsprechend dem Schreibziel die Schreibabsicht, Schreibsituation und Textfunktion"
  - code: kmk-deutsch-2022.sch.16
    kind: content
    area: "4.2 Schreiben"
    group: "Texte planen und strukturieren"
    page: 16
    text: "führen einzelne Planungsschritte (Inhalt, Aufbau) kooperativ durch"
  - code: kmk-deutsch-2022.sch.17
    kind: content
    area: "4.2 Schreiben"
    group: "Texte planen und strukturieren"
    page: 16
    text: "nutzen die Möglichkeiten digitaler Schreibwerkzeuge zur Vorbereitung der Textproduktion, z. B. Anlegen von Stoffsammlungen, Mindmaps."
  - code: kmk-deutsch-2022.sch.18
    kind: content
    area: "4.2 Schreiben"
    group: "Texte formulieren"
    page: 16
    text: "formulieren einfache Texte verständlich, kohärenzstiftend, strukturiert und sprachlich angemessen"
  - code: kmk-deutsch-2022.sch.19
    kind: content
    area: "4.2 Schreiben"
    group: "Texte formulieren"
    page: 16
    text: "formulieren Texte für konkrete und überwiegend bekannte Adressaten angemessen"
  - code: kmk-deutsch-2022.sch.20
    kind: content
    area: "4.2 Schreiben"
    group: "Texte formulieren"
    page: 16
    text: "realisieren mit ausgewählten Textsorten grundlegende kommunikative und personale Schreibfunktionen: Ausdrücken: Sich selbst, Erlebtes und Erdachtes, Gedanken und Gefühle (auch auf Basis von Schreibimpulsen wie Texten, Bildern oder Musik), z. B. in den Textsorten: Erlebniserzählung, Fantasieerzählung, Selbstportrait, Gedicht, Darstellen: Beschreiben, Erklären, Informieren, Instruieren, z. B. in den Textsorten: Personen-, Orts- und Bildbeschreibung, Lexikoneintrag, Gebrauchsanweisung, Bastel- oder Spielanleitung, Back- oder Kochrezept, Appellieren: Bitten oder Wünschen, eine Meinung begründen (Argumentieren), z. B. in den Textsorten: Brief, Buch‐, Spiel‐ oder Filmtipp"
  - code: kmk-deutsch-2022.sch.21
    kind: content
    area: "4.2 Schreiben"
    group: "Texte formulieren"
    page: 16
    text: "nutzen unterschiedliche Schreibformen: kooperative (z. B. Schreibkonferenzen), produktive (z. B. Umschreiben, Weiterschreiben) und kreative (z. B. Schreiben zu Bildern)"
  - code: kmk-deutsch-2022.sch.22
    kind: content
    area: "4.2 Schreiben"
    group: "Texte formulieren"
    page: 16
    text: "kennen ausgewählte Möglichkeiten digitaler Textgestaltung und nutzen sie angeleitet"
  - code: kmk-deutsch-2022.sch.23
    kind: content
    area: "4.2 Schreiben"
    group: "Texte formulieren"
    page: 16
    text: "kennen grundlegende Formulierungsstrategien und wenden sie an."
  - code: kmk-deutsch-2022.sch.24
    kind: content
    area: "4.2 Schreiben"
    group: "Texte überarbeiten"
    page: 16
    text: "nutzen ausgewählte textsortenspezifische Kriterien für die Textüberprüfung und ‐ überarbeitung"
  - code: kmk-deutsch-2022.sch.25
    kind: content
    area: "4.2 Schreiben"
    group: "Texte überarbeiten"
    page: 16
    text: "überprüfen auf der Basis von Rückmeldungen (z. B. Lehrkraft, Mitschülerinnen und Mitschüler) Texte nach ausgewählten Kriterien und überarbeiten diese (auch kooperativ, z. B. Textlupe, Schreibkonferenz) im Hinblick auf: Aufbau, Inhalt und Formulierungen, treffende Wortwahl, Rechtschreibung, Gestaltung, Kohärenz (bei kürzeren, einfach aufgebauten Texten) und Verständlichkeit, bekannte Adressaten"
  - code: kmk-deutsch-2022.sch.26
    kind: content
    area: "4.2 Schreiben"
    group: "Texte überarbeiten"
    page: 16
    text: "holen Text-Feedback ein und formulieren selbst auch Feedback zu Texten anderer"
  - code: kmk-deutsch-2022.sch.27
    kind: content
    area: "4.2 Schreiben"
    group: "Texte überarbeiten"
    page: 17
    text: "nutzen bei der Textüberarbeitung angeleitet digitale Schreibwerkzeuge, z. B. Einfügen und Umstellen von Wörtern, Wortgruppen und Sätzen"
  - code: kmk-deutsch-2022.sch.28
    kind: content
    area: "4.2 Schreiben"
    group: "Texte überarbeiten"
    page: 17
    text: "kennen erste Überarbeitungsstrategien (z. B. Text als ersten Entwurf begreifen, sich den Textentwurf laut vorlesen, Planungsnotizen zur Überprüfung des Textes nutzen) und wenden diese an."
  - code: kmk-deutsch-2022.les.1
    kind: content
    area: "4.3 Lesen"
    group: "Lesefertigkeiten: Flüssig lesen"
    page: 17
    text: "nutzen die schriftsprachlichen Informationen (u. a. Silbe, Morphem, Komma, Punkt, Fragezeichen, Großschreibung) beim Lesen"
  - code: kmk-deutsch-2022.les.2
    kind: content
    area: "4.3 Lesen"
    group: "Lesefertigkeiten: Flüssig lesen"
    page: 17
    text: "verfügen bei häufig vorkommenden Wörtern über eine weitgehend sichere Worterkennung und korrigieren sich ggf. selbst"
  - code: kmk-deutsch-2022.les.3
    kind: content
    area: "4.3 Lesen"
    group: "Lesefertigkeiten: Flüssig lesen"
    page: 17
    text: "erlesen unvertraute Wörter anhand größerer Einheiten wie Silbe oder Morphem"
  - code: kmk-deutsch-2022.les.4
    kind: content
    area: "4.3 Lesen"
    group: "Lesefertigkeiten: Flüssig lesen"
    page: 17
    text: "beachten beim Lesen Satzgrenzen und lesen über das Zeilenende hinweg"
  - code: kmk-deutsch-2022.les.5
    kind: content
    area: "4.3 Lesen"
    group: "Lesefertigkeiten: Flüssig lesen"
    page: 17
    text: "lesen dem Lernstand entsprechende Texte nach Vorbereitung sinngestaltend vor"
  - code: kmk-deutsch-2022.les.6
    kind: content
    area: "4.3 Lesen"
    group: "Lesefertigkeiten: Flüssig lesen"
    page: 17
    text: "lesen in angemessenem Tempo."
  - code: kmk-deutsch-2022.les.7
    kind: content
    area: "4.3 Lesen"
    group: "Lesefertigkeiten: Über Lesetechniken verfügen"
    page: 17
    text: "orientieren sich in und zwischen klar strukturierten Texten und verschaffen sich auch mithilfe textueller Lesehilfen (u. a. Überschriften, Zwischenüberschriften, Absätze, Abbildungen, Illustrationen) einen Überblick."
  - code: kmk-deutsch-2022.les.8
    kind: content
    area: "4.3 Lesen"
    group: "Lesefähigkeiten: Leseverstehen"
    page: 18
    text: "ermitteln explizite oder durch einfaches Schließen zu gewinnende Textinformationen auf lokaler Ebene und beachten dabei auch sprachliche Mittel zur Sicherung des Textzusammenhangs"
  - code: kmk-deutsch-2022.les.9
    kind: content
    area: "4.3 Lesen"
    group: "Lesefähigkeiten: Leseverstehen"
    page: 18
    text: "stellen bei multimodalen Texten einfache Bezüge zwischen Text, Bild und Ton her"
  - code: kmk-deutsch-2022.les.10
    kind: content
    area: "4.3 Lesen"
    group: "Lesefähigkeiten: Leseverstehen"
    page: 18
    text: "nutzen bei digitalen Texten Navigationsstrukturen (u. a. Hyperlinks) zur Gewinnung von Textinformationen"
  - code: kmk-deutsch-2022.les.11
    kind: content
    area: "4.3 Lesen"
    group: "Lesefähigkeiten: Leseverstehen"
    page: 18
    text: "verknüpfen Textinformationen, ziehen auch unter Nutzung ihres Vorwissens Schlussfolgerungen und konstruieren ein Gesamtverständnis."
  - code: kmk-deutsch-2022.les.12
    kind: content
    area: "4.3 Lesen"
    group: "Lesefähigkeiten: Über Strategien zum Leseverstehen verfügen"
    page: 18
    text: "bereiten das Lesen vor (z. B. Leseziel formulieren, Vorwissen aktivieren, Erwartungen an den Text formulieren, nach Möglichkeit die Textsorte klären)"
  - code: kmk-deutsch-2022.les.13
    kind: content
    area: "4.3 Lesen"
    group: "Lesefähigkeiten: Über Strategien zum Leseverstehen verfügen"
    page: 18
    text: "lesen Texte organisierend (z. B. für das Leseziel wichtige Aussagen markieren, unbekannte Wörter unterstreichen und nachfragen/nachschlagen) und elaborierend (assoziieren) und reflektierend (das Textverstehen prüfen und ggf. Verstehensschwierigkeiten erkennen und beheben)"
  - code: kmk-deutsch-2022.les.14
    kind: content
    area: "4.3 Lesen"
    group: "Lesefähigkeiten: Über Strategien zum Leseverstehen verfügen"
    page: 18
    text: "bereiten das Lesen nach (z. B. zentrale Textaussagen wiedergeben, wertende Einschätzung zum Text abgeben)."
  - code: kmk-deutsch-2022.tm.1
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Über Textwissen verfügen"
    page: 19
    text: "berichten über ein Spektrum kinderliterarischer Texte und ihre Leseerfahrungen (z. B. Figuren, Handlung, Titel, Autorinnen und Autoren)"
  - code: kmk-deutsch-2022.tm.2
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Über Textwissen verfügen"
    page: 19
    text: "unterscheiden erzählende, lyrische und szenische Texte (einfache Beispiele)"
  - code: kmk-deutsch-2022.tm.3
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Über Textwissen verfügen"
    page: 19
    text: "kennen verschiedene Textsorten aus dem Bereich pragmatischer Texte: informierende (z. B. Lexikonartikel), instruierende (z. B. Spielanleitungen), regulierende (z. B. Klassenregeln)"
  - code: kmk-deutsch-2022.tm.4
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Über Textwissen verfügen"
    page: 19
    text: "ordnen typische Beispiele einer Gattung zu (u. a. Märchen, Fabel, Gedicht, Comic) und entwickeln gattungsspezifische Leseerwartungen"
  - code: kmk-deutsch-2022.tm.5
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Über Textwissen verfügen"
    page: 19
    text: "nutzen ausgewählte auditive und audiovisuelle Medien für persönliche oder schulische Zwecke: z. B. Hörspiele, Lesungen, Hörbücher, Podcasts, Wissenssendungen, Erklärvideos"
  - code: kmk-deutsch-2022.tm.6
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Über Textwissen verfügen"
    page: 19
    text: "nutzen typische Formen digitaler Textstrukturierung (u. a. Links/Hyperlinks, Text-Bild- Kombinationen) beim Lesen sowie beim Recherchieren."
  - code: kmk-deutsch-2022.tm.7
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Sich im Medienangebot orientieren"
    page: 19
    text: "wählen Bücher und Texte unterschiedlicher medialer Form auf der Basis von Interessen und Vorlieben sowie aufgabenbezogen aus; sie begründen und bewerten ihre Auswahl"
  - code: kmk-deutsch-2022.tm.8
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Sich im Medienangebot orientieren"
    page: 19
    text: "können sich in einer Bücherei orientieren"
  - code: kmk-deutsch-2022.tm.9
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Sich im Medienangebot orientieren"
    page: 19
    text: "nutzen unterschiedliche Informationsangebote und Recherchemöglichkeiten (u. a. Internet, Zeitschriften, Zeitungen, Hörfunk, Fernsehen, Bücherei)"
  - code: kmk-deutsch-2022.tm.10
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Sich im Medienangebot orientieren"
    page: 19
    text: "schätzen ausgewählte Informationen in Hinblick auf ihre Aussagekraft angemessen und kritisch ein."
  - code: kmk-deutsch-2022.tm.11
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 19
    text: "beschreiben die eigene Lese- und Medienerfahrung (z. B. mithilfe eines Lese-/Medientagebuchs)"
  - code: kmk-deutsch-2022.tm.12
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 19
    text: "erfassen zentrale Aussagen eines Textes und geben sie wieder"
  - code: kmk-deutsch-2022.tm.13
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 19
    text: "werten Text-Bild-Bezüge für Textverständnis und Deutung aus"
  - code: kmk-deutsch-2022.tm.14
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 19
    text: "vollziehen die Handlungslogik erzählender Texte nach"
  - code: kmk-deutsch-2022.tm.15
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 19
    text: "setzen Informationen zu Raum, Zeit, Handlung, Figuren und Atmosphäre in Vorstellungen um und stellen diese mithilfe handlungs- und produktionsorientierter Verfahren (z. B. in einer Zeichnung, im szenischen Spiel, als Standbild) und im Gespräch dar"
  - code: kmk-deutsch-2022.tm.16
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 20
    text: "nehmen die Perspektive einer literarischen Figur ein und grenzen sich von einer literarischen Figur ab (z. B. im Gespräch, in einem fiktiven Brief, im szenischen Spiel)"
  - code: kmk-deutsch-2022.tm.17
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 20
    text: "nutzen wichtige Fachbegriffe zur Beschreibung literarischer Medien (u. a. Handlung, Figur, Reim, Vers, Sprecher, Dialog, Erzähler)"
  - code: kmk-deutsch-2022.tm.18
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 20
    text: "belegen Deutungsaussagen mit Textstellen"
  - code: kmk-deutsch-2022.tm.19
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 20
    text: "formulieren eigene Gedanken zu Texten und nehmen zu Texten Stellung"
  - code: kmk-deutsch-2022.tm.20
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 20
    text: "stellen Bezüge zwischen unterschiedlichen Texten (auch intermedial, z. B. Märchenfassungen in Literatur und Film; thematische Vergleiche)"
  - code: kmk-deutsch-2022.tm.21
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 20
    text: "tauschen sich mit anderen zu Text- bzw. Medienwahrnehmungen, -deutungen und - wertungen aus (u. a. literarisches Gespräch)"
  - code: kmk-deutsch-2022.tm.22
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte in unterschiedlicher medialer Form erschließen und nutzen"
    page: 20
    text: "entnehmen nicht-linearen Darstellungsformen Informationen (z. B. Tabelle, Diagramm, Karte)."
  - code: kmk-deutsch-2022.tm.23
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Digitale Formate und Umgebungen"
    page: 20
    text: "beschreiben ihre Erfahrungen mit digitalen Formaten und Umgebungen"
  - code: kmk-deutsch-2022.tm.24
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Digitale Formate und Umgebungen"
    page: 20
    text: "setzen sich kritisch mit digitalen Formaten und Umgebungen auseinander"
  - code: kmk-deutsch-2022.tm.25
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Digitale Formate und Umgebungen"
    page: 20
    text: "nutzen digitale Werkzeuge für die Gestaltung eigener medialer Produkte, z. B. für Präsentationen."
  - code: kmk-deutsch-2022.tm.26
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte präsentieren"
    page: 20
    text: "lesen selbstgewählte literarische Texte nach Vorbereitung sinngestaltend vor"
  - code: kmk-deutsch-2022.tm.27
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte präsentieren"
    page: 20
    text: "tragen kurze literarische Texte auswendig vor, auch im Rahmen von Aufführungen"
  - code: kmk-deutsch-2022.tm.28
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte präsentieren"
    page: 20
    text: "wählen ein Kinderbuch selbst aus und stellen es situations- und adressatengerecht vor"
  - code: kmk-deutsch-2022.tm.29
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte präsentieren"
    page: 20
    text: "nutzen Vorlesetechniken und Techniken des Auswendiglernens"
  - code: kmk-deutsch-2022.tm.30
    kind: content
    area: "4.4 Sich mit Texten und anderen Medien auseinandersetzen"
    group: "Texte präsentieren"
    page: 20
    text: "gestalten Texte in unterschiedlicher medialer Form szenisch (auch kooperativ, z. B. im Rahmen von Theateraufführungen)."
  - code: kmk-deutsch-2022.sp.1
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Sprachliche Verständigung als Form des Handelns"
    page: 21
    text: "untersuchen den Zusammenhang zwischen Äußerungsabsicht, sprachlichen Mitteln und Wirkungen"
  - code: kmk-deutsch-2022.sp.2
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Sprachliche Verständigung als Form des Handelns"
    page: 21
    text: "untersuchen an ausgewählten Beispielen, wie sich Adressatenorientierung im sprachlichen Handeln zeigt"
  - code: kmk-deutsch-2022.sp.3
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Sprachliche Verständigung als Form des Handelns"
    page: 21
    text: "sprechen über Verstehens- und Verständigungsprobleme"
  - code: kmk-deutsch-2022.sp.4
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Sprachliche Verständigung als Form des Handelns"
    page: 21
    text: "tauschen sich aus über die Nutzung digitaler Technologien als Werkzeuge der Kommunikation und der Informationsgewinnung (grundlegende Funktionen)."
  - code: kmk-deutsch-2022.sp.5
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Mündliche und schriftliche Kommunikation"
    page: 21
    text: "kennen Unterschiede gesprochener und geschriebener Sprache"
  - code: kmk-deutsch-2022.sp.6
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Mündliche und schriftliche Kommunikation"
    page: 21
    text: "untersuchen und gestalten die Rollen von Sprecher/Schreiber – Hörer/Leser."
  - code: kmk-deutsch-2022.sp.7
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Ausprägungen und Bedingungen sprachlicher Variation und Vielfalt"
    page: 21
    text: "beschreiben eigene Erfahrungen mit sprachlicher Variation und Vielfalt (z. B. Dialekt, Regionalsprache; Mehrsprachigkeit, Standardsprache – Alltagssprache; Sprache in der digitalen Kommunikation; Deutsche Gebärdensprache)"
  - code: kmk-deutsch-2022.sp.8
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Ausprägungen und Bedingungen sprachlicher Variation und Vielfalt"
    page: 21
    text: "untersuchen an ausgewählten Beispielen Gemeinsamkeiten und Unterschiede verschiedener Sprachen (u. a. Herkunftssprachen, Fremdsprachen)."
  - code: kmk-deutsch-2022.sp.9
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Wörter und Sätze"
    page: 22
    text: "identifizieren Wortbausteine und untersuchen Möglichkeiten der Wortbildung (u. a. Ableitung, Komposition)"
  - code: kmk-deutsch-2022.sp.10
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Wörter und Sätze"
    page: 22
    text: "nutzen Wörter, Wendungen und Formulierungsmuster funktional und erweitern ihren Wortschatz"
  - code: kmk-deutsch-2022.sp.11
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Wörter und Sätze"
    page: 22
    text: "nutzen ausgewählte grammatische Operationen und grundlegende Fachbegriffe für die Untersuchung sprachlicher Struktureinheiten (s. Übersicht: Grundlegende sprachliche Strukturen und Begriffe)"
  - code: kmk-deutsch-2022.sp.12
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Wörter und Sätze"
    page: 22
    text: "untersuchen grundlegende Satzstrukturen (insbesondere Prädikat, Satzglieder) und die Stellung des finiten Verbs im Satz"
  - code: kmk-deutsch-2022.sp.13
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Wörter und Sätze"
    page: 22
    text: "untersuchen den Beitrag von Wörtern verschiedener Wortarten (insbesondere Verb, Nomen, Adjektiv, Artikel, Pronomen) zum Aufbau von Sätzen"
  - code: kmk-deutsch-2022.sp.14
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Wörter und Sätze"
    page: 22
    text: "gewinnen Einsichten in sprachliche Strukturen und Gestaltungsmöglichkeiten durch den experimentellen und kreativen Umgang mit Sprache."
  - code: kmk-deutsch-2022.sp.15
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Texte und Gespräche"
    page: 22
    text: "wenden grundlegende Fachbegriffe für die Untersuchung von Texten und Gesprächen an (s. Übersicht: Grundlegende sprachliche Struktureinheiten)"
  - code: kmk-deutsch-2022.sp.16
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Texte und Gespräche"
    page: 22
    text: "untersuchen an ausgewählten Beispielen die sprachliche Gestaltung von Texten (z. B. Reim, Wiederholungen, sprachliche Bilder, Vergleich)."
  - code: kmk-deutsch-2022.sp.17
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Rechtschreibung"
    page: 22
    text: "untersuchen Schreibweisen von Wörtern, Wortgruppen und Sätzen"
  - code: kmk-deutsch-2022.sp.18
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Rechtschreibung"
    page: 22
    text: "tauschen sich über die Schreibung von Wörtern, Wortgruppen und Sätzen aus (z. B. Rechtschreibgespräch)."
  - code: kmk-deutsch-2022.sp.19
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Aussprache"
    page: 22
    text: "nutzen die Konventionen der gesprochenen Standardsprache für die Gestaltung ihrer Äußerungen."
  - code: kmk-deutsch-2022.sp.20
    kind: content
    area: "4.5 Sprache und Sprachgebrauch untersuchen"
    group: "Ressourcen zur deutschen Sprache"
    page: 22
    text: "nutzen Wörterbücher, Grammatiken und digitale Rechtschreibhilfen für das Nachschlagen."
