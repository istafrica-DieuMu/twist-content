skill: lit-en.word-reading.first-tricky-words
formats: [flash, choose]
seconds: { 4-5: 4 }
# Reception: the 16 tricky words of the skill's "I can" line, no more.
# Sentences use only CVC words, sounds of Phase 2 and 3 and these words.
items:
  - { word: the, sentence: "The dog can run." }
  - { word: I, sentence: "I can hop." }
  - { word: to, sentence: "We ran to the shop." }
  - { word: go, sentence: "Go and get a hat." }
  - { word: no, sentence: "No, it is not hot." }
  - { word: he, sentence: "He has a red hat." }
  - { word: she, sentence: "She can run fast." }
  - { word: we, sentence: "We sit on the rug." }
  - { word: me, sentence: "Pass the cup to me." }
  - { word: be, sentence: "Can I be the king?" }
  - { word: was, sentence: "It was a big fish." }
  - { word: my, sentence: "This is my dog." }
  - { word: you, sentence: "Can you hop?" }
  - { word: they, sentence: "They got wet in the rain." }
  - { word: all, sentence: "We all sing." }
  - { word: are, sentence: "The pigs are in the mud." }
