skill: lit-en.spelling.word-list-3-4
formats: [say, choose]
seconds: { 8-10: 15 }
# The statutory word list for Years 3 and 4 (English Appendix 1), all 100
# entries in the list's order. Where the list gives two forms (eight/eighth,
# accident(ally)) both are items; forward(s) keeps forward only. A sentence
# never holds another form of its word, and settles a sound-alike (heard,
# weight, reign, eight, through).
