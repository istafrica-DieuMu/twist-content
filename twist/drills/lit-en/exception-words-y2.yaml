skill: lit-en.spelling.exception-words-y2
formats: [say, choose]
seconds: { 6-7: 12 }
# The Year 2 common exception words of the national curriculum (English
# Appendix 1), all 64, in the list's order. Each sentence settles a
# sound-alike (hour, whole, break, steak, past, would) and never holds a
# word of the same family (child and children, every and everybody).
items:
  - { word: door, sentence: "Shut the door, please." }
  - { word: floor, sentence: "My sock is on the floor." }
  - { word: poor, sentence: "The poor dog was wet and cold." }
  - { word: because, sentence: "I am happy because it is my birthday." }
  - { word: find, sentence: "I can't find my hat." }
  - { word: kind, sentence: "It was kind of you to help." }
  - { word: mind, sentence: "Mind the step!" }
  - { word: behind, sentence: "The cat hid behind the sofa." }
  - { word: child, sentence: "Each child has a book." }
  - { word: children, sentence: "The children are playing in the park." }
  - { word: wild, sentence: "Lions are wild animals." }
  - { word: climb, sentence: "We like to climb trees." }
  - { word: most, sentence: "Most birds can fly." }
  - { word: only, sentence: "There is only one cake left." }
  - { word: both, sentence: "Both of my shoes are muddy." }
  - { word: old, sentence: "Our car is old and rusty." }
  - { word: cold, sentence: "It is cold outside." }
  - { word: gold, sentence: "The king has a gold crown." }
  - { word: hold, sentence: "Hold my hand." }
  - { word: told, sentence: "Mum told me a story." }
  - { word: every, sentence: "I brush my teeth every day." }
  - { word: everybody, sentence: "Everybody clapped at the end." }
  - { word: even, sentence: "Even the cat came to the party." }
  - { word: great, sentence: "We had a great time." }
  - { word: break, sentence: "Don't break the glass." }
  - { word: steak, sentence: "Dad cooked steak for tea." }
  - { word: pretty, sentence: "What a pretty flower!" }
  - { word: beautiful, sentence: "The sunset is beautiful." }
  - { word: after, sentence: "We play after lunch." }
  - { word: fast, sentence: "A cheetah can run very fast." }
  - { word: last, sentence: "I came last in the race." }
  - { word: past, sentence: "We walked past the shop." }
  - { word: father, sentence: "My father reads to me at night." }
  - { word: class, sentence: "Our class has a pet fish." }
  - { word: grass, sentence: "The grass is wet." }
  - { word: pass, sentence: "Pass me the ball." }
  - { word: plant, sentence: "The plant needs some water." }
  - { word: path, sentence: "Walk along the path." }
  - { word: bath, sentence: "I have a bath before bed." }
  - { word: hour, sentence: "The film lasts an hour." }
  - { word: move, sentence: "Move your chair, please." }
  - { word: prove, sentence: "Can you prove you are right?" }
  - { word: improve, sentence: "I want to improve my writing." }
  - { word: sure, sentence: "Are you sure?" }
  - { word: sugar, sentence: "There is no sugar in my tea." }
  - { word: eye, sentence: "I have something in my eye." }
  - { word: could, sentence: "I could see the sea." }
  - { word: should, sentence: "You should wear a coat." }
  - { word: would, sentence: "Would you like a drink?" }
  - { word: who, sentence: "Who is at the door?" }
  - { word: whole, sentence: "I ate the whole apple." }
  - { word: any, sentence: "Have you got any pens?" }
  - { word: many, sentence: "How many sweets are left?" }
  - { word: clothes, sentence: "Put your clothes away." }
  - { word: busy, sentence: "The shop is busy today." }
  - { word: people, sentence: "Lots of people came to the fair." }
  - { word: water, sentence: "Fish live in water." }
