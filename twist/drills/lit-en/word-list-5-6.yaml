# The statutory word list for Years 5 and 6 (English Appendix 1), all 100
# entries in the list's order. Where the list names a second form
# (equip -ped -ment, immediate(ly), sincere(ly)) it is an item too. A
# sentence never holds another form of its word, and settles a sound-alike
# (conscience and conscious, lightning, programme, symbol, queue).
