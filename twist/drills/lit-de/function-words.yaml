# Klasse 1, after the letters st, sp, pf: words and sentences use no v, qu,
# ng, nk, x, y, ck, ss or ß yet. Look-alikes stay together in the bank (der,
# den, dem, dir; ein, eine, einen; auf, aus, auch) as in the lessons.
