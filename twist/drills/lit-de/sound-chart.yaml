skill: lit-de.letters.sound-chart
formats: [flash]
seconds: { 6-7: 3 }
# The fields of an Anlauttabelle: the letter as `word`, its field as the
# sentence ("M wie Maus"). Each field word starts with exactly the letter's
# sound, as in the lesson set (no Ohr for O, no Clown for C), and has a
# picture in the asset bank. V takes its usual sound, as letters-ng-nk-qu-v
# teaches it (V wie Vogel; Vase is a Merkwort there). The set's own fields are kept
# (A wie Ameise, E wie Ente, O wie Ofen, W wie Wal, Z wie Zebra).
items:
  - { word: A, sentence: "A wie Ameise." }
  - { word: Au, sentence: "Au wie Auto." }
  - { word: B, sentence: "B wie Ball." }
  - { word: D, sentence: "D wie Drachen." }
