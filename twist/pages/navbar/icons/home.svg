<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-home" width="31" height="29" viewBox="0 0 62 58" fill="none" aria-hidden="true">
  <!-- walls -->
  <path d="M12 25 V47 Q12 54 19 54 H43 Q50 54 50 47 V25 L31 10 Z" fill="#BB72F2" stroke="#6C2EB7" stroke-width="3" stroke-linejoin="round"/>
  <path d="M15 46 Q15 51 20 51 H42 Q47 51 47 46" stroke="#9A4FD8" stroke-width="3" stroke-linecap="round"/>
  <path d="M17 30 V39" stroke="#D8A0FB" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dark doorway, revealed when the door swings open -->
  <rect class="doorway" x="24" y="33" width="14" height="21" rx="4" fill="#4A1D86" stroke="#6C2EB7" stroke-width="2.5"/>
  <!-- door: hinged on its left edge (x=24) -->
  <g class="door">
    <rect x="24" y="33" width="14" height="21" rx="4" fill="#984BDB" stroke="#6C2EB7" stroke-width="2.5"/>
    <path d="M27.5 37 V42" stroke="#B16AEB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="34.2" cy="44.5" r="1.7" fill="#D8A0FB"/>
  </g>
  <!-- roof -->
  <path d="M6.5 27 L31 7 L55.5 27" stroke="#6C2EB7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M6.5 27 L31 7 L55.5 27" stroke="#AB5FE9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10.5 22.5 L27.5 9" stroke="#D8A0FB" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M43.5 15.5 L46.5 18" stroke="#D8A0FB" stroke-width="2.4" stroke-linecap="round"/>
</svg>
