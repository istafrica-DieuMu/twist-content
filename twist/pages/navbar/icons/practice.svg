<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-practice" width="32" height="28" viewBox="0 0 64 56" fill="none" aria-hidden="true">
  <!-- cap base -->
  <path d="M14 20 V39 Q14 48 32 49 Q50 48 50 39 V20 Z" fill="#A559DA" stroke="#6830A9" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M17.5 41 Q21 45.5 32 46 Q43 45.5 46.5 41" stroke="#8C46C6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M18 30 V36" stroke="#C27FEE" stroke-width="2.2" stroke-linecap="round"/>
  <!-- board -->
  <path d="M32 3 L61 16 L32 29 L3 16 Z" fill="#D193F2" stroke="#6830A9" stroke-width="3" stroke-linejoin="round"/>
  <path d="M10 16 L30 7" stroke="#EBCBFD" stroke-width="2.4" stroke-linecap="round"/>
  <!-- cord across the board to its right edge -->
  <path d="M32 16 Q44 17 53 19.6" stroke="#8C46C6" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="16" r="2.4" fill="#A559DA" stroke="#6830A9" stroke-width="1.8"/>
  <!-- tassel: hangs from the board edge at (53,19.6) -->
  <g class="tassel">
    <path d="M53 19.6 V35" stroke="#8C46C6" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M50.3 35 H55.7 L57.5 44.5 Q53 46.7 48.5 44.5 Z" fill="#A559DA" stroke="#6830A9" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M52 37.5 L51.3 42.5" stroke="#D193F2" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="53" cy="35" r="2" fill="#D193F2" stroke="#6830A9" stroke-width="1.6"/>
  </g>
</svg>
