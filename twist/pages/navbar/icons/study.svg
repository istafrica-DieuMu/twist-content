<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-study" width="32" height="27" viewBox="0 0 64 54" fill="none" aria-hidden="true">
  <!-- cover -->
  <path d="M3 14 V45 Q3 48.5 6.5 48 Q20 46 28 48.5 Q32 51.5 36 48.5 Q44 46 57.5 48 Q61 48.5 61 45 V14 Z" fill="#AE6EE6" stroke="#612EAD" stroke-width="2.5" stroke-linejoin="round"/>
