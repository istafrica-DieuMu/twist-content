    <path d="M52 15 Q44 13.5 37 16.5 M52 21.5 Q44 20 37 23 M52 28 Q44 26.5 37 29.5" stroke="#C084F0" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- spine -->
  <path d="M32 11 V47" stroke="#612EAD" stroke-width="2.5" stroke-linecap="round"/>
</svg>
