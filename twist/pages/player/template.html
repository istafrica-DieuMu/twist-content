<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twist Lesson Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playwrite+DE+Grund&family=Playwrite+GB+J&family=Playwrite+DE+LA&family=Playwrite+DE+SAS&family=Playwrite+DE+VA&family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#efe9f5; --panel:#ffffff; --ink:#2b0f45; --muted:#6d5f7b; --line:#e3dbea;
  --app:#fbf7ff; --card:#ffffff; --plum:#2b0f45; --accent:#8e3bd1; --accent-soft:#efe0fb;
  --good:#2e9e48; --good-soft:#dff4e3; --bad:#d4483f; --bad-soft:#fbe3e1; --hint:#f6b400; --hint-soft:#fff3cc;
  --red:#E53935; --blue:#1E88E5; --frame:#1d1426;
  --check:#2d5f8a; --check-soft:#e2eef8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#14101a; --panel:#1e1826; --ink:#f1eaf8; --muted:#a99bb8; --line:#352c40; }
}
:root[data-theme="dark"]{ --page:#14101a; --panel:#1e1826; --ink:#f1eaf8; --muted:#a99bb8; --line:#352c40; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
/* page: a top bar, the phone in the middle, the steps beside it */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:10px;background:#6849dd;color:#fff;display:grid;place-items:center;font:800 18px "Red Hat Display",sans-serif;flex:none}
.brand b{display:block;font:700 15px "Red Hat Display",sans-serif}.brand small{display:block;font-size:11px;color:var(--muted)}
.brand code{font-size:10.5px}
.pickbtn{display:flex;align-items:center;gap:10px;min-width:0;max-width:420px;flex:1 1 260px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--page);color:var(--ink);cursor:pointer;text-align:left}
.pickbtn:hover,.pickbtn[aria-expanded="true"]{border-color:#6849dd}
.pickbtn .pk{flex:1;min-width:0;display:flex;flex-direction:column}
.pickbtn small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn b{font:600 14px "Red Hat Text",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb-right{margin-left:auto;position:relative}
.tbtn{display:flex;align-items:center;gap:6px;font:600 13px system-ui,sans-serif;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pop[hidden]{display:none}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px;z-index:30}
.pop .tg{display:flex;gap:8px;align-items:center;font-size:13px}
.pop .pl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.scripts{display:flex;flex-direction:column;gap:6px}
.scr{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
.scr:has(input:checked){border-color:#6849dd;background:var(--accent-soft);color:#2b0f45}
.scr input{grid-row:1 / span 3;margin:0;accent-color:#6849dd}
.scr .sn{font:600 12px system-ui,sans-serif}
.scr .ss{font-size:22px;line-height:1.5;color:inherit}
.scr .sd{font-size:11px;color:var(--muted)}.scr:has(input:checked) .sd{color:#5b4b6b}
.pop{width:340px;max-height:calc(100vh - 100px);overflow:auto}
.pop select{width:100%;font:13px system-ui,sans-serif;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.pop .pn{margin:0;font-size:12px;color:var(--muted)}
.drawer{position:fixed;z-index:25;top:70px;left:20px;width:min(460px,calc(100vw - 40px));max-height:calc(100vh - 90px);display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 20px 50px -15px rgba(0,0,0,.45)}
.drawer[hidden]{display:none}
.wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:24px 16px}
.side{width:300px;height:calc(844px * var(--pz,1));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 10px 10px;position:sticky;top:86px}
.sideh{font:700 12px system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 8px 6px}
.steps{list-style:none;padding:0;margin:0;font-size:13px;flex:1;min-height:0;overflow:auto}
.steps li{padding:5px 8px;border-radius:8px;cursor:pointer;display:flex;gap:6px}
.steps li:hover{background:var(--accent-soft);color:#2b0f45}
.steps li.on{background:#6849dd;color:#fff}
.steps .grp{font-weight:700;margin-top:8px;cursor:default;background:none!important;color:var(--muted)!important}
.recd{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.recd summary{font-size:12px;color:var(--muted);cursor:pointer;padding:0 8px}
pre.rec{font:11px/1.35 ui-monospace,Menlo,monospace;background:var(--page);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;margin:6px 0 0}
/* phone */
.phone{width:390px;height:844px;zoom:var(--pz,1);border-radius:54px;background:var(--frame);padding:12px;box-shadow:0 30px 60px -20px rgba(43,15,69,.45);flex:none;position:relative}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000;z-index:5}
.screen{width:100%;height:100%;border-radius:44px;background:var(--app);overflow:hidden;display:flex;flex-direction:column;color:#2b0f45;font-family:Andika,system-ui,sans-serif;position:relative}
@media (max-width:820px){
  .wrap{flex-direction:column;align-items:center;padding:0 0 24px}
  .phone{width:100%;max-width:430px;height:100svh;border-radius:0;padding:0;box-shadow:none;order:-1}
  .phone::before{display:none}
  .screen{border-radius:0}
  .side{position:static;width:100%;max-width:430px;height:auto;max-height:60vh;border-radius:0;border-left:0;border-right:0}
  .topbar{position:static;padding:8px 12px;gap:8px}.brand small{display:none}.drawer{top:auto;bottom:0;left:0;width:100%;max-height:80vh;border-radius:16px 16px 0 0}
}
.status{height:52px;flex:none}
.top{display:flex;align-items:center;gap:10px;padding:4px 18px 8px;flex:none}
.x{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:18px;color:var(--muted);cursor:pointer}
.bar{flex:1;height:14px;border-radius:8px;background:#eadff3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .35s}
.chip{display:inline-flex;align-items:center;gap:6px;margin:0 18px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--accent-soft);color:#5b1f8f;align-self:flex-start}
.chip.check{background:var(--check-soft);color:var(--check)}
.dots{display:inline-flex;gap:4px;margin-left:4px}.dots b{width:8px;height:8px;border-radius:50%;background:#d6c2e8}.dots b.on{background:#5b1f8f}
.body{flex:1;overflow:auto;padding:12px 20px 8px;display:flex;flex-direction:column;gap:14px}
.prompt{display:flex;gap:12px;align-items:flex-start}
.prompt .t{font-size:24px;line-height:1.25;font-weight:700;flex:1}
.prompt .t.passage,.word.passage{font-size:16px!important;line-height:1.45;font-weight:500;white-space:pre-line;text-align:left}
.spk{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--plum);background:#fff;cursor:pointer;display:grid;place-items:center}
.spk svg{width:26px;height:26px}.spk.big{width:96px;height:96px;margin:8px auto}.spk.big svg{width:48px;height:48px}
.spk.playing{background:var(--accent-soft)}
.visual{display:flex;justify-content:center;align-items:center;min-height:40px;width:100%;flex-shrink:0}
.visual img{width:150px;height:150px;object-fit:contain}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:14px;margin-top:auto;padding-top:10px}
.opt{position:relative;border:3px solid var(--plum);background:#fff;border-radius:20px;min-height:76px;font:700 30px Andika,sans-serif;color:var(--plum);cursor:pointer;display:grid;place-items:center;padding:8px;box-shadow:0 4px 0 var(--plum);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum)}
.opt img{width:96px;height:96px;object-fit:contain}
.opt > svg{max-width:100%;height:auto}
.opts.mid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opts.mid .opt{font-size:22px}
.opts.long{grid-template-columns:1fr!important}
.opts.long .opt{font-size:18px;min-height:52px;text-align:left;place-items:center start;padding:10px 16px}
.opt.good{background:var(--good-soft);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .3s}
.opt.sel{background:var(--accent-soft)}
.opt.dim{opacity:.45}
.opt .os{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;border:2px solid var(--plum);background:#fff;display:grid;place-items:center;cursor:pointer;z-index:1}
.opt .os svg{width:14px;height:14px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.foot{padding:10px 20px 26px;flex:none;display:flex;flex-direction:column;gap:10px}
.btn{width:100%;border:3px solid var(--plum);background:var(--accent);color:#fff;border-radius:18px;padding:14px;font:700 22px Andika,sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--plum)}
.btn:disabled{opacity:.4;cursor:default}
.btn.light{background:#fff;color:var(--plum)}
.bubble{border-radius:16px;padding:10px 14px;font-size:18px;display:flex;gap:10px;align-items:flex-start}
.bubble.hint{background:var(--hint-soft);border:2px solid var(--hint)}
.bubble.fb{background:var(--bad-soft);border:2px solid var(--bad)}
.bubble.ok{background:var(--good-soft);border:2px solid var(--good)}
.bubble .spk{width:36px;height:36px;border-width:2px}.bubble .spk svg{width:18px;height:18px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.center h2{font-size:30px;margin:0}.center p{font-size:18px;margin:0;color:#6d5f7b}
.center img{width:180px;height:180px;object-fit:contain}
.center img.mascot-pose{width:230px;height:230px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:auto}
.tf .opt{font-size:26px;min-height:96px}
/* drawn */
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{min-width:52px;height:72px;padding:0 10px;border:3px solid var(--plum);border-radius:16px;background:#fff;display:grid;place-items:center;font:700 40px Andika,sans-serif;cursor:default}
.card.tap{cursor:pointer;box-shadow:0 4px 0 var(--plum)}.card.sel{background:var(--accent-soft);border-color:var(--accent)}
.card.good{background:var(--good-soft);border-color:var(--good)}.card.bad{background:var(--bad-soft);border-color:var(--bad)}
.word{font:700 54px Andika,sans-serif;letter-spacing:.02em;text-align:center}
.syl{display:inline-block;position:relative;padding:0 2px 18px}
.syl::after{content:"";position:absolute;left:4%;right:4%;bottom:2px;height:14px;border:4px solid currentColor;border-top:0;border-radius:0 0 60px 60px}
.syl:nth-child(odd){color:#1E6FD9}.syl:nth-child(even){color:#D63A2F}
.wordcard{padding:12px 26px;border:3px solid var(--plum);border-radius:18px;background:#fff}
.frame{font:700 40px Andika,sans-serif;text-align:center;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.gap{min-width:52px;height:62px;border-bottom:5px solid var(--accent);display:inline-grid;place-items:center;color:var(--accent);cursor:pointer;border-radius:6px 6px 0 0;background:var(--accent-soft)}
.gap.filled{color:var(--plum)}
.chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:auto;padding-top:10px}
.chips .opt{min-width:72px;min-height:68px}
.entry{font:700 48px Andika,sans-serif;text-align:center;border:3px solid var(--plum);border-radius:18px;background:#fff;min-height:76px;display:grid;place-items:center;margin:0 auto;width:160px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.pad .opt{min-height:58px;font-size:26px}
.trace{position:relative;width:300px;height:200px;margin:0 auto}
.trace svg,.trace canvas{position:absolute;inset:0;width:300px;height:200px}
.trace canvas{touch-action:none;cursor:crosshair}
.note{font-size:13px;color:#6d5f7b;text-align:center}
.speakrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.spkchip{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:2px solid #e3d6f0;background:#fff;font:700 16px Andika,sans-serif;color:#2b0f45;cursor:pointer}
.spkchip svg{width:22px;height:22px}
.btn.rec{background:#d4483f;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.blank{display:inline-block;min-width:1.4em;padding:0 .2em;margin:0 .1em;border-radius:8px;background:var(--accent-soft);color:var(--accent);border-bottom:3px solid var(--accent);text-align:center;line-height:1.1}
.sound{align-self:center;border:3px solid var(--plum);border-radius:999px;background:#fff;padding:6px 18px;font:700 26px Andika,sans-serif;color:var(--plum);cursor:pointer;box-shadow:0 3px 0 var(--plum);display:flex;gap:8px;align-items:center}
.sound svg{width:20px;height:20px}
svg text{font-family:Andika,sans-serif}
.soundchart{display:grid;gap:6px;width:100%;max-width:330px;margin:0 auto}
.soundchart .sc{border:2px solid #cbb9dd;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:3px 2px}
.soundchart .sc b{font:700 18px Andika,sans-serif;color:#2b0f45}
.soundchart .sc img{width:40px;height:40px;object-fit:contain}
.soundchart .sc.mark{border-color:#8e3bd1;background:#f4eafd;box-shadow:0 0 0 3px #8e3bd133}
.moved{animation:slideup .7s ease-out both}
@keyframes slideup{from{transform:translateY(34px)}to{transform:none}}
.stars{font-size:44px;letter-spacing:6px}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--good-soft);color:var(--good);font-weight:700;font-size:18px}
.badge.no{background:var(--hint-soft);color:#8a6400}
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 28px;margin-top:auto}
.bins{display:grid;gap:12px;margin-top:auto}
.bin{border:3px dashed var(--plum);border-radius:20px;min-height:220px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;cursor:pointer}
.grp{width:100%}
.grp .it{display:inline-grid;place-items:center;position:relative}
.grp .it img{width:100%;height:100%;object-fit:contain}
.grp.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.grp.scat{position:relative}
.grp.scat .it{position:absolute}
.opt .grp.scat{width:100%}
.it.tapped::after{content:attr(data-n);position:absolute;right:-4px;top:-6px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;font:700 17px/26px Andika,sans-serif;text-align:center;border:2px solid #fff}
.it.tapped img{opacity:.55}
.pairview{display:flex;gap:28px;justify-content:center}
.pairview .pv{cursor:pointer;display:grid;place-items:center}
.pairview img{width:130px;height:130px;object-fit:contain}
.list{display:flex;flex-direction:column;gap:10px;width:100%}
.list .btn{font-size:19px;text-align:left;display:flex;justify-content:space-between}

/* ---------- the app's look (ist-schoolido: QuizHeader, OptionCard, Button, FeedbackBanner) ---------- */
.screen{background:#fff;color:#303030;font-family:"Red Hat Text",system-ui,sans-serif}
.status{height:48px}
.hdr{display:flex;align-items:center;gap:8px;padding:0 16px 12px;min-height:50px;border-bottom:1px solid #dfdfdf;flex:none}
.ib{width:40px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:10px;flex:none}
.ib:hover{background:#f4f2fb}
.stepb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:center;font:500 16px/24px "Red Hat Text",sans-serif;color:#303030}
.stepb .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepb .sub{color:#8a8a8a}
.badge-n{width:30px;height:30px;border-radius:50%;background:#6849dd40;display:grid;place-items:center;position:relative;flex:none}
.badge-n b{width:22px;height:22px;border-radius:50%;background:#6849dd;color:#fff;font:700 12px/22px "Red Hat Display",sans-serif;text-align:center}
.badge-n::before{content:"";position:absolute;top:6px;left:7px;width:4px;height:4px;border-radius:50%;background:#fff;z-index:1}
.pbar{height:8px;border-radius:8px;background:#e5e5e5;margin:8px 20px 0;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:#6849dd;border-radius:8px;transition:width .35s}
.body{padding:16px 20px 8px;gap:16px}
.prompt{align-items:center;gap:8px}
.prompt .mascot{width:86px;height:86px;flex:none;object-fit:contain}
.bubbleq{flex:1;min-width:0;position:relative;background:#FAF9FF;border-radius:16px;padding:12px 12px 12px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 13px rgba(56,43,103,.13)}
.bubbleq::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:#FAF9FF}
.bubbleq .t{font:700 19px/1.3 "Red Hat Display",sans-serif;color:#303030}
.bubbleq .t.short{font-size:28px}
.bubbleq.only{flex:none}
.bubbleq .spk{width:40px;height:40px;border:2px solid #efebff;background:#fff}
.bubbleq .spk svg{width:20px;height:20px}
.spk{border-color:#6849dd}.spk svg path{stroke:#6849dd}.spk svg path:first-child{fill:#6849dd}
.spk.big{border-width:3px}
.visual{flex:0 0 auto;min-height:0}
.visual img{width:min(200px,100%);height:auto;max-height:200px}
.opt{border:2px solid #dfdfdf;border-bottom-width:5px;border-radius:20px;background:#fff;box-shadow:none;font:700 40px "Red Hat Display",sans-serif;color:#303030;min-height:60px}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.sel{background:#efebff;border-color:#947dec;color:#947dec}
.opt.good{background:#e7ffe0;border-color:#5cba41;color:#46972e;box-shadow:none}
.opt.bad{background:#fbe3e1;border-color:#d4483f;color:#b3261e;box-shadow:none}
.opt .os{border:2px solid #dfdfdf;top:-9px;right:-9px;width:26px;height:26px}
.opt .os svg path{stroke:#6849dd}.opt .os svg path:first-child{fill:#6849dd}
.opts{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:7px;margin-top:auto}
.opts.sq .opt{aspect-ratio:1;padding:6px}
.opts.big{display:flex;flex-wrap:wrap;justify-content:center;margin-block:auto}
.opts.big .opt{width:calc((100% - 7px) / 2);max-width:200px}
.opts.sq .opt img{width:100%;height:100%;max-width:none;object-fit:contain}
.opts.sq .opt > svg{width:100%;height:100%}
.opts.tx .opt{aspect-ratio:1.3}
.opts.mid .opt{font-size:24px;aspect-ratio:auto;min-height:76px}
.opts.long .opt{font-size:18px;min-height:64px;aspect-ratio:auto}
.tf .opt{font-size:28px;min-height:110px}
.chips .opt{min-width:68px;min-height:64px}
.pad{gap:7px}.pad .opt{min-height:54px;font-size:26px;border-bottom-width:4px}
.pad.letters{gap:3px}.pad.letters .opt{min-height:42px;font-size:18px;border-radius:9px;border-bottom-width:3px;padding:0;min-width:0}
.entry{font-family:"Red Hat Display",sans-serif;border:2px solid #dfdfdf;border-bottom-width:5px;border-radius:20px}

    <dt>Lesson title</dt><dd>${esc(tOf(set, lesson.title))} <code>lessons[${set.lessons.indexOf(lesson)}].title</code></dd>
    <dt>Start pose</dt><dd><code>${esc(set.pose ?? "start")}</code></dd></dl>`;
  const add = (label, fn, dis) => { const b = document.createElement("button"); b.className = "nbtn"; b.textContent = label; b.disabled = !!dis; b.onclick = fn; nb.appendChild(b); };
  const li = set.lessons.indexOf(lesson);
  add("◀ Lesson", () => pickLesson(set.lessons[li - 1].n), li <= 0);
  add("Lesson ▶", () => pickLesson(set.lessons[li + 1].n), li >= set.lessons.length - 1);
  const si = D.sets.indexOf(set);
  add("Next set ▶", () => pickSet(si + 1), si >= D.sets.length - 1);
  if (F.type) add(`Next ${F.type} ▶`, () => { const k = steps.findIndex((s, j) => j > at && s.kind === "task" && s.t.type === F.type); if (k > 0) go(k); });
}
$("#built").textContent = D.built;

  ["task", ".opts, .tf, .pad, .chips, .pairs, .bins, .slots, .entry, .speakrow, .mic, .saycard, .cards", "Answer area", "By type: options, Yes and No, the keyboard, gap chips, pairs, bins, slots, the microphone."],

  ["checkIntro", ".mascot-pose", "Check pose", "assets/mascot.yaml check poses."],

let LABELS = (() => { try { return localStorage.getItem("twist-labels") === "1"; } catch { return false; } })();
function drawLabels() {
  const scr = $("#screen"); scr.querySelectorAll(".plbl").forEach((x) => x.remove());
  if (!LABELS) return;
  const kind = steps[at]?.kind, z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pz")) || 1;
  const sr = scr.getBoundingClientRect(), seen = new Set();
  for (const [k, sel, name] of PARTS) {
    if (k !== "*" && k !== kind && !(k === "menu")) continue;
    for (const el of scr.querySelectorAll(sel)) {
      if (seen.has(el) || el.closest(".plbl")) continue; seen.add(el);
      const r = el.getBoundingClientRect(); if (!r.width || !r.height) continue;
      const box = document.createElement("div"); box.className = "plbl" + (name === "Activity badge" ? " alt" : r.top - sr.top < 16 * z ? " in" : "");
      Object.assign(box.style, { left: `${(r.left - sr.left) / z}px`, top: `${(r.top - sr.top) / z}px`, width: `${r.width / z}px`, height: `${r.height / z}px` });
      box.innerHTML = `<b>${esc(name)}</b>`; scr.appendChild(box);
      if (sel.includes(",")) break; // one answer area per screen
    }
  }
}
// Redraw the labels whenever the screen changes (sheets, picks, layout).
new MutationObserver(() => { clearTimeout(drawLabels.t); drawLabels.t = setTimeout(drawLabels, 120); }).observe($("#screen"), { childList: true, subtree: true });

    <h3>On every screen</h3><table>${rows("*")}</table>
    ${SCREENS.map(([k, n]) => `<h3>${esc(n)}</h3><table>${rows(k)}</table>`).join("")}
    <h3>Overlays</h3><table>${rows("menu")}</table>
    <h3>Names in the record</h3><table>
      <tr><td><b>File name</b></td><td>The skill's slug: lessons/&lt;curriculum&gt;/&lt;year&gt;/&lt;subject&gt;/&lt;slug&gt;.yaml, where the slug is the last part of the skill id. It never changes once published.</td></tr>
      <tr><td><b>Set title</b></td><td>The record's <code>title</code> (de and en): the name of the whole lesson set, shown on the lesson start and in the lesson list.</td></tr>
      <tr><td><b>Lesson title</b></td><td><code>lessons[n].title</code>: the name of one lesson, shown big on the lesson start and in the lesson button.</td></tr>
      <tr><td><b>Skill</b></td><td><code>skill</code>: the competency the set teaches (competencies/), with its "I can" sentence and its topic, which picks the start pose.</td></tr></table>`;
  $("#anatX").onclick = () => { $("#anat").hidden = true; };
}
$("#openAnat").onclick = () => { anatomy(); $("#anat").hidden = false; toggle($("#openSet"), $("#setPop"), false); };
$("#anat").onclick = (e) => { if (e.target.id === "anat") $("#anat").hidden = true; };
// The phone scales to the window: as big as the height allows, up to 1.4 times, never below 0.75.
const sizePhone = () => { const z = innerWidth <= 820 ? 1 : Math.max(0.75, Math.min(1.4, (innerHeight - 110) / 844, (innerWidth - 400 - (innerWidth >= 1500 ? 480 : 0)) / 420)); document.documentElement.style.setProperty("--pz", z.toFixed(3)); };
sizePhone(); window.addEventListener("resize", sizePhone);
// The lesson drawer and the settings pop-over open from the top bar and close on Escape or a click outside.
const toggle = (btn, panel, open) => { const o = open ?? panel.hidden; panel.hidden = !o; btn.setAttribute("aria-expanded", o); if (o && panel.id === "drawer") setTimeout(() => { $("#q").focus(); panel.querySelector(".rset.on")?.scrollIntoView({ block: "center" }); }); };
$("#openPick").onclick = () => toggle($("#openPick"), $("#drawer"));
$("#openSet").onclick = () => toggle($("#openSet"), $("#setPop"));
const docked = () => matchMedia("(min-width:1500px)").matches;
document.addEventListener("click", (e) => {
  // A filter chip re-renders itself on click, so its target is no longer in the page: not an outside click.
  if (!e.target.isConnected) return;
  if (!docked() && !$("#drawer").hidden && !e.target.closest("#drawer,#openPick")) toggle($("#openPick"), $("#drawer"), false);
  if (!$("#setPop").hidden && !e.target.closest("#setPop,#openSet")) toggle($("#openSet"), $("#setPop"), false);
});
// Re-render on resize, so the layout pass fits the new screen size.
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (steps?.[at]?.kind === "task") go(at); }, 200); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#anat").hidden = true; if (!docked()) toggle($("#openPick"), $("#drawer"), false); toggle($("#openSet"), $("#setPop"), false); } });
$("#q").oninput = (e) => { F.q = e.target.value; saveF(); renderPicker(); };
// Load the chosen Schreibschrift before drawing with it, then redraw.
const loadScript = () => Promise.all([document.fonts?.load(`64px "${SCRIPTS[SCRIPT]}"`), document.fonts?.load(`64px "Playwrite GB J"`)]).then(() => { if (typeof at === "number" && steps?.length) go(at); }).catch(() => {});
loadScript();

document.querySelectorAll("input[name=script]").forEach((r) => { r.checked = r.value === SCRIPT; r.onchange = () => { SCRIPT = r.value; try { localStorage.setItem("twist-script", SCRIPT); } catch {} go(at); loadScript(); }; });
Object.values(SCRIPTS).forEach((f) => document.fonts?.load(`20px "${f}"`));
$("#f-year").onchange = (e) => { F.year = e.target.value; saveF(); renderPicker(); };
$("#f-type").onchange = (e) => { F.type = e.target.value; saveF(); renderPicker(); renderNow(); };
$("#auto").onchange = (e) => { try { localStorage.setItem("twist-auto", e.target.checked ? "1" : "0"); } catch (x) {} };
$("#autonext").onchange = (e) => { try { localStorage.setItem("twist-autonext", e.target.checked ? "1" : "0"); } catch (x) {} };
try { $("#autonext").checked = localStorage.getItem("twist-autonext") !== "0"; } catch (e) {}
// Arrow keys step through the lesson (outside the search box).
document.addEventListener("keydown", (e) => { if (e.target.closest("input,select,textarea")) return; if (e.key === "ArrowRight") go(at + 1); if (e.key === "ArrowLeft") go(at - 1); });
let pos = [0, 1]; try { pos = JSON.parse(localStorage.getItem("twist-pos")) || pos; } catch (e) {}
set = D.sets[pos[0]] ?? D.sets[0]; renderPicker(); pickSet(D.sets.indexOf(set), pos[1]);
</script>
