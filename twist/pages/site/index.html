gths with hand spans, steps or objects and explain why we need standard units.","standards":["kmk-mathe-2022.gm.5","nc-maths-2014.y1.measurement.5"],"set":null},{"id":"math.length.cm-m","domain":"math","topic":"Length","can":"I can measure lengths in centimetres with a ruler, draw lines accurately, and know that 1 m = 100 cm.","standards":["kmk-mathe-2022.gm.2","kmk-mathe-2022.gm.6","nc-maths-2014.y1.measurement.5","nc-maths-2014.y2.measurement.1"],"set":null},{"id":"math.solids.cube-cuboid-sphere","domain":"math","topic":"3D shapes","can":"I can recognise and name cubes, cuboids and spheres and find them around me.","standards":["kmk-mathe-2022.rf.4","kmk-mathe-2022.rf.5","nc-maths-2014.y1.geometry-properties-of-shapes.2","nc-maths-2014.y2.geometry-properties-of-shapes.4"],"set":null},{"id":"math.mass-capacity.compare-mass","domain":"math","topic":"Mass","can":"I can compare and order objects by mass (heavier, lighter, the same), also with a balance.","standards":["kmk-mathe-2022.gm.1","nc-maths-2014.y1.measurement.2","nc-maths-2014.y1.measurement.6","nc-maths-2014.y2.measurement.2"],"set":null},{"id":"math.fractions.halves-quarters","domain":"math","topic":"Fractions","can":"I can split a whole into halves and quarters and check whether the parts are equal.","standards":["kmk-mathe-2022.gm.4","nc-maths-2014.y1.number-fractions.1","nc-maths-2014.y1.number-fractions.2"],"set":null},{"id":"math.angles.turns","domain":"math","topic":"Turns","can":"I can make and describe whole, half, quarter and three-quarter turns, clockwise and anticlockwise.","standards":["nc-maths-2014.y1.geometry-position-and-direction.1","nc-maths-2014.y2.geometry-position-and-direction.2"],"set":null},{"id":"lit-en.phonics.new-graphemes","domain":"lit-en","topic":"Phonics","can":"I know more ways of writing vowel sounds (ay, ou, ie, ea, oy, ir, ue, aw, wh, ph, ew, oe, au, ey) and read words with them.","standards":["nc-english-2014.y1.reading-word-reading.2","nc-english-2014.y1.reading-word-reading.3"],"set":{"title":"New graphemes","file":"twist/lessons/en-GB/year-1/lit-en/new-graphemes.yaml","lessons":[{"n":1,"title":"ay, ou, ie, ea, oy, ir","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"ue, aw, wh, ph, ew, ey","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Year 1 opens with more ways of writing sounds: two letters that make one sound (ay in play, ou in cloud). Lesson 1 takes ay, ou, ie, ea, oy and ir; lesson 2 takes ue, aw, wh, ph, ew and ey, and ends with the skill check. Children read each word and find its picture, spot the grapheme in words, and choose it to finish a word. The voice says sounds, never letter names."}},{"id":"lit-en.phonics.split-digraphs","domain":"lit-en","topic":"Phonics","can":"I can read words with split digraphs (a-e, e-e, i-e, o-e, u-e) such as make, these, like, home, cube.","standards":["nc-english-2014.y1.reading-word-reading.2","nc-english-2014.y1.reading-word-reading.3"],"set":{"title":"Split digraphs","file":"twist/lessons/en-GB/year-1/lit-en/split-digraphs.yaml","lessons":[{"n":1,"title":"a-e und i-e","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"o-e, u-e und e-e","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"In a split digraph two letters make one sound, but a consonant sits between them: a-e in cake, i-e in kite, o-e in nose, u-e in cube, e-e in these. Lesson 1 takes a-e and i-e and shows how the e changes a word (kit, kite); lesson 2 takes o-e, u-e and e-e and ends with the skill check."}},{"id":"lit-en.phonics.alternative-pronunciations","domain":"lit-en","topic":"Phonics","can":"I know that one spelling can stand for different sounds (ow in cow and snow) and try the other sound if a word does not make sense.","standards":["nc-english-2014.y1.reading-word-reading.2","nc-english-2014.y2.reading-word-reading.2"],"set":{"title":"One spelling, two sounds","file":"twist/lessons/en-GB/year-1/lit-en/alternative-pronunciations.yaml","lessons":[{"n":1,"title":"ow und ea","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"ie, ou und y","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Some spellings stand for more than one sound: ow in cow and in snow, ea in leaf and in bread. The reader tries one sound, and if the word makes no sense, tries the other. Lesson 1 takes ow and ea; lesson 2 takes ie (pie, field), ou (mouse, soup) and y (sky, funny), and ends with the skill check."}},{"id":"lit-en.word-reading.exception-words-y1","domain":"lit-en","topic":"Reading words","can":"I can read the Year 1 common exception words and notice which part of the word is unusual.","standards":["nc-english-2014.y1.reading-word-reading.4"],"set":null},{"id":"lit-en.spelling.exception-words-y1","domain":"lit-en","topic":"Spelling","can":"I can spell the Year 1 common exception words and the days of the week.","standards":["nc-english-2014.y1.writing-transcription.spelling.2","nc-english-2014.y1.writing-transcription.spelling.3"],"set":null},{"id":"lit-en.texts.traditional-tales","domain":"lit-en","topic":"Stories and poems","can":"I know key stories, fairy tales and traditional tales well, can retell them and say what makes them special.","standards":["nc-english-2014.y1.reading-comprehension.3","nc-english-2014.y2.reading-comprehension.3"],"set":null},{"id":"lit-en.grammar.sentences-and","domain":"lit-en","topic":"Grammar and punctuation","can":"I can combine words to make a sentence and join words and clauses with and.","standards":["nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.2","nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.5"],"set":null},{"id":"lit-en.composition.say-then-write","domain":"lit-en","topic":"Writing","can":"I say out loud what I am going to write and compose each sentence aloud before I write it.","standards":["nc-english-2014.y1.writing-composition.1","nc-english-2014.y1.writin bbit, sunset).","standards":["nc-english-2014.y1.reading-word-reading.6","nc-english-2014.y2.reading-word-reading.3"],"set":null},{"id":"lit-en.word-reading.contractions","domain":"lit-en","topic":"Reading words","can":"I can read contractions (I'm, I'll, we'll) and know that the apostrophe shows missing letters.","standards":["nc-english-2014.y1.reading-word-reading.7"],"set":null},{"id":"lit-en.word-reading.decodable-books","domain":"lit-en","topic":"Reading words","can":"I can read aloud books that match my phonics and re-read them until I read them fluently.","standards":["nc-english-2014.y1.reading-word-reading.8","nc-english-2014.y1.reading-word-reading.9","nc-english-2014.y2.reading-word-reading.7","nc-english-2014.y2.reading-word-reading.8"],"set":null},{"id":"lit-en.comprehension.check-sense","domain":"lit-en","topic":"Understanding stories","can":"I check that what I read makes sense and go back to correct myself when it does not.","standards":["nc-english-2014.y1.reading-comprehension.8","nc-english-2014.y2.reading-comprehension.10"],"set":null},{"id":"lit-en.spelling.plural-s-es","domain":"lit-en","topic":"Spelling","can":"I can add -s or -es to make plurals and verb forms (dogs, wishes, he runs).","standards":["nc-english-2014.y1.writing-transcription.spelling.6","nc-english-2014.y1.writing-transcription.spelling.9"],"set":null},{"id":"lit-en.texts.poems-by-heart","domain":"lit-en","topic":"Stories and poems","can":"I can learn rhymes and short poems by heart and recite them with expression.","standards":["nc-english-2014.y1.reading-comprehension.5","nc-english-2014.y2.reading-comprehension.8","nc-english-2014.y56.reading-comprehension.7"],"set":null},{"id":"lit-en.handwriting.letter-families","domain":"lit-en","topic":"Handwriting","can":"I know the handwriting families of letters that are formed in a similar way and practise them.","standards":["nc-english-2014.y1.writing-transcription.handwriting.5"],"set":null},{"id":"lit-en.grammar.capitals-names","domain":"lit-en","topic":"Grammar and punctuation","can":"I use capital letters for names of people, places, days of the week and for I.","standards":["nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.4"],"set":null},{"id":"lit-en.composition.reread-check","domain":"lit-en","topic":"Writing","can":"I re-read what I have written to check it makes sense.","standards":["nc-english-2014.y1.writing-composition.4","nc-english-2014.y2.writing-composition.9","nc-english-2014.y2.writing-composition.8"],"set":null},{"id":"lit-en.comprehension.title-events","domain":"lit-en","topic":"Understanding stories","can":"I can talk about why the title and the main events of a story matter.","standards":["nc-english-2014.y1.reading-comprehension.9","nc-english-2014.y1.reading-comprehension.13"],"set":null},{"id":"lit-en.spelling.un-ing-ed-er-est","domain":"lit-en","topic":"Spelling","can":"I can add un- and the endings -ing, -ed, -er and -est when the root word does not change (unkind, helping, quickest).","standards":["nc-english-2014.y1.writing-transcription.spelling.7","nc-english-2014.y1.writing-transcription.spelling.8","nc-english-2014.y1.writing-transcription.spelling.9"],"set":null},{"id":"lit-en.grammar.terms-y1","domain":"lit-en","topic":"Grammar and punctuation","can":"I know and use the words letter, capital letter, word, singular, plural, sentence, punctuation, full stop, question mark and exclamation mark.","standards":["nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.6"],"set":null},{"id":"lit-en.composition.read-own-writing","domain":"lit-en","topic":"Writing","can":"I read my writing aloud clearly, with intonation that makes the meaning clear.","standards":["nc-english-2014.y1.writing-composition.6","nc-english-2014.y2.writing-composition.11","nc-english-2014.y34.writing-composition.10"],"set":null},{"id":"lit-en.speaking.ask-questions","domain":"lit-en","topic":"Speaking and listening","can":"I ask relevant questions to understand more.","standards":["nc-english-2014.y1to6.spoken-language.2"],"set":null},{"id":"lit-en.comprehension.simple-inference","domain":"lit-en","topic":"Understanding stories","can":"I can work out what a character feels or wants from what they say and do.","standards":["nc-english-2014.y1.reading-comprehension.10","nc-english-2014.y2.reading-comprehension.11"],"set":null},{"id":"lit-en.spelling.dictation-y1","domain":"lit-en","topic":"Spelling","can":"I can write simple dictated sentences with the sounds and tricky words I have learnt.","standards":["nc-english-2014.y1.writing-transcription.spelling.10","nc-english-2014.y2.writing-transcription.spelling.9","nc-english-2014.y34.writing-transcription.spelling.6"],"set":null},{"id":"lit-en.speaking.build-vocabulary","domain":"lit-en","topic":"Speaking and listening","can":"I use strategies to learn and use new words (asking, guessing from context, word maps).","standards":["nc-english-2014.y1to6.spoken-language.3"],"set":null},{"id":"lit-en.comprehension.word-meanings","domain":"lit-en","topic":"Words in texts","can":"I can talk about what words mean and link new words to words I know.","standards":["nc-english-2014.y1.reading-comprehension.6","nc-english-2014.y2.reading-comprehension.6","nc-english-2014.y2.reading-comprehension.7"],"set":null}]},{"id":"year-2","label":"Year 2","skills":[{"id":"math.numbers-to-100.bundle-tens","domain":"math","topic":"Numbers to 100","can":"I can group objects into tens, count tens and ones, and use this to estimate and check large amounts.","standards":["kmk-mathe-2022.zo.1","nc-maths-2014.y2.number-number-and-place-value.3"],"set":{"title":"Making tens","file":"twist/lessons/en-GB/year-2/math/bundle-tens.yaml","lessons":[{"n":1,"title":"Zehner und Einer","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Schätzen und prüfen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Year 2 opens with place value: grouping things into tens and counting tens and ones (3 tens and 4 ones make 34), then using tens to estimate a big amount and check it. Lesson 1 groups and counts; lesson 2 estimates and checks, and ends with the skill check. Base ten blocks are the Dienes children use in class."}},{"id":"math.numbers-to-100.place-value","domain":"math","topic":"Numbers to 100","can":"I can show two-digit numbers in a tens-and-ones chart and with tens rods and ones cubes.","standards":["kmk-mathe-2022.zo.1","kmk-mathe-2022.zo.2","nc-maths-2014.y2.number-number-and-place-value.2"],"set":{"title":"Place value to 100","file":"twist/lessons/en-GB/year-2/math/place-value-to-100.yaml","lessons":[{"n":1,"title":"Zehner und Einer zeigen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Auf verschiedene Arten zerlegen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Two-digit numbers in a tens and ones chart (T, O), with base ten blocks and in the part-whole model England uses: 34 is 30 and 4. Lesson 1 moves between blocks, chart and part-whole model; lesson 2 partitions in more than one way (34 is also 20 and 14), as Year 2 asks, and ends with the skill check."}},{"id":"math.numbers-to-100.order-compare","domain":"math","topic":"Numbers to 100","can":"I can order and compare numbers to 100 and find the neighbouring numbers and tens.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y2.number-number-and-place-value.4"],"set":{"title":"Comparing and ordering to 100","file":"twist/lessons/en-GB/year-2/math/order-compare-to-100.yaml","lessons":[{"n":1,"title":"Zehner zuerst vergleichen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Eins mehr, zehn mehr","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Year 2 compares numbers to 100 with \u003c, > and =, looking at the tens first. Lesson 1 compares and orders; lesson 2 finds one more, one less, ten more and ten less, and the multiples of ten either side of a number, and ends with the skill check."}},{"id":"math.numbers-to-100.double-halve","domain":"math","topic":"Numbers to 100","can":"I can double numbers to 50 and halve even numbers to 100.","standards":["kmk-mathe-2022.zo.5"],"set":{"title":"Doubling and halving to 100","file":"twist/lessons/en-GB/year-2/math/double-halve-to-100.yaml","lessons":[{"n":1,"title":"Verdoppeln","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Halbieren","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Doubling numbers to 50 and halving even numbers to 100 by partitioning: double 34 is double 30 and double 4. Lesson 1 doubles; lesson 2 halves, including an odd number of tens (half of 50 is 25), with sharing between two friends, and ends with the skill check."}},{"id":"math.numbers-to-100.number-puzzles","domain":"math","topic":"Numbers to 100","can":"I can solve number riddles to 100 that combine clues about place value and neighbours.","standards":["kmk-mathe-2022.pk-probleme.2","nc-maths-2014.y2.number-number-and-place-value.6"],"set":{"title":"Number riddles to 100","file":"twist/lessons/en-GB/year-2/math/number-puzzles-to-100.yaml","lessons":[{"n":1,"title":"Zwei Hinweise","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Drei Hinweise","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"\"I am thinking of a number\" riddles that combine clues about tens, ones, odd and even, and one more or ten more. Lesson 1 uses one or two clues; lesson 2 uses three and checks the answer against every clue, and ends with the skill check."}},{"id":"math.add-sub-to-20.commutative","domain":"math","topic":"Adding and subtracting to 10","can":"I can find turnaround additions (3 + 5 = 5 + 3) and use them to make adding easier.","standards":["kmk-mathe-2022.zo.9","nc-maths-2014.y2.number-addition-and-subtraction.8"],"set":{"title":"Adding in any order","file":"twist/lessons/en-GB/year-2/math/commutative.yaml","lessons":[{"n":1,"title":"Gleich viel","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Tauschen macht es leichter","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Addition can be done in any order: 4 + 9 and 9 + 4 are both 13, but subtraction cannot. Lesson 1 sees this with counters and writes the turnaround of an addition within 20; lesson 2 uses it to add more easily (start with the bigger number), also with tens, shows that 9 − 4 is not 4 − 9, and ends with the skill check."}},{"id":"math.add-sub-to-20.inverse","domain":"math","topic":"Adding and subtracting to 10","can":"I can find the inverse of an addition and write fact families (3 + 5, 5 + 3, 8 − 5, 8 − 3).","standards":["kmk-mathe-2022.zo.4","kmk-mathe-2022.zo.5","nc-maths-2014.y2.number-addition-and-subtraction.9"],"set":{"title":"Inverse and fact families","file":"twist/lessons/en-GB/year-2/math/inverse.yaml","lessons":[{"n":1,"title":"Plus und minus gehören zusammen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Aufgabenfamilien","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Addition and subtraction undo each other: 6 + 9 = 15, so 15 − 9 = 6. Lesson 1 writes the inverse of an addition within 20 and uses it to check a subtraction; lesson 2 builds the fact family of four from a part-whole model (6 + 9, 9 + 6, 15 − 9, 15 − 6), uses it for missing numbers, and ends with the skill check."}},{"id":"math.add-sub-to-20.neighbour-facts","domain":"math","topic":"Adding and subtracting to 20","can":"I can use near facts and doubles to work out harder sums from easier ones (4 + 5 is one more than 4 + 4).","standards":["kmk-mathe-2022.zo.7","kmk-mathe-2022.msf.3"],"set":{"title":"Near doubles and near facts","file":"twist/lessons/en-GB/year-2/math/neighbour-facts.yaml","lessons":[{"n":1,"title":"Fast verdoppeln","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Nachbaraufgaben","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":45,"summary":"Working out a harder addition from an easier one you already know. Lesson 1 uses doubles: 6 + 7 is one more than 6 + 6. Lesson 2 uses any known fact next door, one more or one less (8 + 9 from 8 + 8 or 9 + 9, 5 + 9 from 5 + 10), and ends with the skill check."}},{"id":"math.add-sub-to-20.number-walls","domain":"math","topic":"Adding and subtracting to 20","can":"I can complete number walls, number chains and addition tables to 20 and spot patterns in them.","standards":["kmk-mathe-2022.msf.2","kmk-mathe-2022.pk-argumentieren.2"],"set":{"title":"Number walls and number chains","file":"twist/lessons/en-GB/year-2/math/number-walls.yaml","lessons":[{"n":1,"title":"Zahlenmauern","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Rechenketten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Number walls (each brick is the two bricks under it added together) and number chains within 20. Lesson 1 fills the top of a wall and works down to a missing bottom brick by subtracting; lesson 2 follows number chains of adding and subtracting, spots what changes when a bottom brick changes, and ends with the skill check. Addition tables are not in this set yet."}},{"id":"math.word-problems.question-calc-answer","domain":"math","topic":"Word problems","can":"I can solve word problems with a question, a calculation and an answer, and tell important information from unimportant.","standards":["kmk-mathe-2022.zo.12","kmk-mathe-2022.pk-modellieren.1","nc-maths-2014.y2.number-addition-and-subtraction.1"],"set":{"title":"Word problems: question, calculation, answer","file":"twist/lessons/en-GB/year-2/math/word-problems-y2.yaml","lessons":[{"n":1,"title":"Frage und Rechnung","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wichtig und unwichtig","acts":["warm-up","learn","practise","check"],"tasks":21}],"tasks":41,"summary":"Word problems with numbers to 100 in three steps: find the question, choose and do the calculation, and give the answer as a sentence. Lesson 1 decides between add and subtract and works out the answer; lesson 2 spots the number you do not need, picks the answer sentence that really answers the question, and ends with the skill check. Calculations add or subtract tens, or two-digit numbers with no crossing of ten, and the voice reads every story aloud."}},{"id":"math.add-sub-to-100.tens","domain":"math","topic":"Adding and subtracting tens","can":"I can add and subtract multiples of ten (30 + 40, 90 − 60) using facts to 10.","standards":["kmk-mathe-2022.zo.6","nc-maths-2014.y2.number-addition-and-subtraction.3"],"set":{"title":"Adding and subtracting tens","file":"twist/lessons/en-GB/year-2/math/add-sub-tens.yaml","lessons":[{"n":1,"title":"Zehner addieren","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zehner subtrahieren","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Adding and subtracting multiples of ten using facts to 10. Lesson 1 adds tens (30 + 40 = 70, because 3 + 4 = 7) with tens rods; lesson 2 subtracts tens (90 − 60 = 30) and finds the missing tens to make 100, and ends with the skill check."}},{"id":"math.money.amounts-to-20","domain":"math","topic":"Money","can":"I can make and count amounts up to 20 with coins and notes.","standards":["kmk-mathe-2022.gm.1","nc-maths-2014.y2.measurement.3"],"set":null},{"id":"math.shapes.compose","domain":"math","topic":"Shapes","can":"I can lay, copy, split and build shapes from pieces (for example with tangrams).","standards":["kmk-mathe-2022.rf.3","kmk-mathe-2022.rf.6"],"set":null},{"id":"math.patterns.repeating","domain":"math","topic":"Patterns","can":"I can spot, describe and continue patterns of shapes, colours and numbers.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y2.geometry-position-and-direction.1"],"set":null},{"id":"math.symmetry.id o.1","kmk-mathe-2022.zo.2","nc-maths-2014.y3.number-number-and-place-value.2"],"set":{"title":"Place value to 1000","file":"twist/lessons/en-GB/year-3/math/place-value-to-1000.yaml","lessons":[{"n":1,"title":"H, Z und E","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"10 und 100 mehr oder weniger","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Three-digit numbers in a place value chart (H, T, O) and the value of each digit: in 352 the 5 is worth 50. Lesson 1 puts numbers in the chart and partitions them; lesson 2 finds 10 or 100 more or less than a number, which Year 3 asks for, and ends with the skill check."}},{"id":"math.numbers-to-1000.read-write","domain":"math","topic":"Numbers to 1000","can":"I can read numbers to 1000 and write them in digits and in words.","standards":["kmk-mathe-2022.zo.2","nc-maths-2014.y3.number-number-and-place-value.5"],"set":{"title":"Reading and writing numbers to 1000","file":"twist/lessons/en-GB/year-3/math/read-write-to-1000.yaml","lessons":[{"n":1,"title":"Hören und schreiben","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Zahlwörter bis 1000","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"English says three-digit numbers in digit order (three hundred and forty-eight is 348), so the trap is writing each part as heard (300408) or losing a zero (three hundred and four as 34). Lesson 1 hears numbers and writes them in digits; lesson 2 reads and writes number words, including the spelling of forty, and ends with the skill check."}},{"id":"math.numbers-to-1000.number-line","domain":"math","topic":"Numbers to 1000","can":"I can find and mark numbers to 1000 on a number line and a thousand chart.","standards":["kmk-mathe-2022.zo.2","kmk-mathe-2022.zo.3","nc-maths-2014.y3.number-number-and-place-value.4"],"set":{"title":"Number lines to 1000","file":"twist/lessons/en-GB/year-3/math/number-line-to-1000.yaml","lessons":[{"n":1,"title":"Hunderter und Zehner finden","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Pfeile lesen und schätzen","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Number lines to 1000 with different intervals: 0 to 1000 in hundreds, a hundred in tens, a ten in ones. Lesson 1 places multiples of a hundred and of ten; lesson 2 works out the interval first, then reads where an arrow points, and estimates on a line with only its ends labelled. Ends with the skill check."}},{"id":"math.numbers-to-1000.order-compare","domain":"math","topic":"Numbers to 1000","can":"I can order and compare numbers to 1000 and find the neighbouring tens and hundreds.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y3.number-number-and-place-value.3"],"set":{"title":"Comparing and ordering to 1000","file":"twist/lessons/en-GB/year-3/math/order-compare-to-1000.yaml","lessons":[{"n":1,"title":"Von links vergleichen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Nachbarzehner und Nachbarhunderter","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Comparing three-digit numbers from the greatest place value: hundreds, then tens, then ones, with \u003c, > and =, including sides that are sums. Lesson 1 compares and orders; lesson 2 finds the multiples of 10 and 100 either side of a number, and ends with the skill check."}},{"id":"math.numbers-to-1000.sequences","domain":"math","topic":"Numbers to 1000","can":"I can count in steps to 1000 and continue and explain number sequences.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y3.number-number-and-place-value.1"],"set":{"title":"Counting in steps to 1000","file":"twist/lessons/en-GB/year-3/math/sequences-to-1000.yaml","lessons":[{"n":1,"title":"In Vierer-, Achter- und Fünfzigerschritten","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Regeln finden","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Year 3 counts from 0 in multiples of 4, 8, 50 and 100, and in tens from any number across a hundred. Lesson 1 counts in 4s, 8s, 50s and 100s; lesson 2 finds the rule of a sequence, the missing term and the term that breaks the rule, and ends with the skill check."}},{"id":"math.numbers-to-1000.round","domain":"math","topic":"Numbers to 1000","can":"I can round numbers to 1000 to the nearest ten and hundred.","standards":["kmk-mathe-2022.zo.13"],"set":{"title":"Rounding to the nearest 10 and 100","file":"twist/lessons/en-GB/year-3/math/round-to-1000.yaml","lessons":[{"n":1,"title":"Auf Zehner runden","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Auf Hunderter runden","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Rounding finds the nearest multiple of 10 or 100, using the multiples either side from the last skill. Lesson 1 rounds to the nearest 10; lesson 2 rounds to the nearest 100, with the rule that halfway rounds up, and uses rounding to estimate a total in pounds. Ends with the skill check."}},{"id":"math.numbers-to-1000.number-puzzles","domain":"math","topic":"Numbers to 1000","can":"I can solve number riddles to 1000 and make up my own about place value.","standards":["kmk-mathe-2022.pk-probleme.2","nc-maths-2014.y3.number-number-and-place-value.6","nc-maths-2014.y4.number-number-and-place-value.8"],"set":{"title":"Number riddles to 1000","file":"twist/lessons/en-GB/year-3/math/number-puzzles-to-1000.yaml","lessons":[{"n":1,"title":"Rätsel lösen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Rätsel prüfen und erfinden","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"\"I am thinking of a number\" riddles about place value to 1000, and digit card problems (the greatest number you can make with 4, 7 and 2). Lesson 1 solves riddles and digit card problems; lesson 2 checks whether a riddle has exactly one answer and builds the clues for a number, and ends with the skill check."}},{"id":"math.numbers-to-100.hundred-field","domain":"math","topic":"Numbers to 100","can":"I can show numbers on a hundred-dot field and read amounts from it quickly.","standards":["kmk-mathe-2022.msf.1"],"set":{"title":"The 100-dot grid","file":"twist/lessons/en-GB/year-3/math/hundred-field.yaml","lessons":[{"n":1,"title":"Reihen lesen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Auf einen Blick","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"The 100-dot grid is ten rows of ten dots with a gap after five each way, so amounts can be read without counting each dot. Lesson 1 reads full rows as tens and the rest of a row using the five-gap; lesson 2 reads amounts at a glance, finds what is missing to make 100, also for numbers that are not whole tens (63 + 37), and ends with the skill check."}},{"id":"math.numbers-to-100.hundred-square","domain":"math","topic":"Numbers to 100","can":"I can find my way around a hundred square, spot its patterns and describe moves (one row down is ten more).","standards":["kmk-mathe-2022.zo.3","kmk-mathe-2022.msf.1"],"set":{"title":"The hundred square","file":"twist/lessons/en-GB/year-3/math/hundred-square.yaml","lessons":[{"n":1,"title":"Nachbarn auf der Tafel","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Wege und Muster","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Finding the way on a hundred square: one step right is one more, one row down is ten more. Lesson 1 finds hidden numbers next to, above and below a number; lesson 2 follows moves, spots column patterns, and uses the square to add 9 and 11 (one row down, one step left or right), and ends with the skill check."}},{"id":"math.mult-div.table-3-6-9","domain":"math","topic":"Times tables","can":"I know the 3, 6 and 9 times tables.","standards":["kmk-mathe-2022.zo.5","kmk-mathe-2022.ms tcard or an invitation.","standards":["kmk-fremdsprachen-gs-2013.schreiben","nc-languages-2014.ks2.foreign-language.11"],"set":null},{"id":"fl.speaking.about-me","domain":"fl","topic":"Speaking","can":"I can talk about myself in a few connected sentences (family, hobbies, what I like doing).","standards":["kmk-fremdsprachen-gs-2013.sprechen"],"set":null},{"id":"fl.speaking.present","domain":"fl","topic":"Speaking","can":"I can present a short prepared text, for example about my pet or favourite animal.","standards":["kmk-fremdsprachen-gs-2013.sprechen","nc-languages-2014.ks2.foreign-language.6"],"set":null},{"id":"fl.culture-strategies.self-check","domain":"fl","topic":"Learning strategies","can":"I can judge what I can already do in the new language and set myself a next goal.","standards":["kmk-fremdsprachen-gs-2013.sprachlernkompetenz"],"set":null},{"id":"fl.reading.read-aloud","domain":"fl","topic":"Reading","can":"I can read a short familiar text aloud so that others understand, with accurate pronunciation and intonation.","standards":["nc-languages-2014.ks2.foreign-language.5"],"set":null},{"id":"fl.grammar.gender-verbs","domain":"fl","topic":"Language patterns","can":"I know that nouns in the new language can have a gender, choose the matching article and conjugate high-frequency verbs (je suis, tu es, il est).","standards":["nc-languages-2014.ks2.foreign-language.12"],"set":null},{"id":"fl.culture-strategies.dictionary","domain":"fl","topic":"Learning strategies","can":"I can use a bilingual dictionary to find the meaning of a new word.","standards":["nc-languages-2014.ks2.foreign-language.9"],"set":null}]}]}],"frameworks":[{"id":"kmk-deutsch-2022","title":"Bildungsstandards im Fach Deutsch für den Primarbereich (Beschluss der KMK vom 23.06.2022)","count":114,"country":"DE","band":"end-klasse-4","url":"https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2022/2022_06_23-Bista-Primarbereich-Deutsch.pdf"},{"id":"kmk-fremdsprachen-gs-2013","title":"Fremdsprachen in der Grundschule – Sachstand und Konzeptionen 2013 (Bericht der KMK vom 17.10.2013)","count":9,"country":"DE","band":"end-klasse-4","url":"https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2013/2013_10_17-Fremdsprachen-in-der-Grundschule.pdf"},{"id":"kmk-mathe-2022","title":"Bildungsstandards im Fach Mathematik für den Primarbereich (Beschluss der KMK vom 23.06.2022)","count":65,"country":"DE","band":"end-klasse-4","url":"https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2022/2022_06_23-Bista-Primarbereich-Mathe.pdf"},{"id":"eyfs-2026","title":"Early years foundation stage statutory framework for group and school-based providers (from 1 September 2026)","count":36,"country":"GB-ENG","band":"","url":"https://assets.publishing.service.gov.uk/media/6a5f8e4fb00f3323bf1a23a1/EYFS_group_and_school_based_from_September_2026.pdf"},{"id":"nc-english-2014","title":"National curriculum in England: English programmes of study, key stages 1 and 2","count":220,"country":"GB-ENG","band":"","url":"https://assets.publishing.service.gov.uk/media/5a7de93840f0b62305b7f8ee/PRIMARY_national_curriculum_-_English_220714.pdf"},{"id":"nc-languages-2014","title":"National curriculum in England: languages programmes of study, key stage 2","count":12,"country":"GB-ENG","band":"","url":"https://assets.publishing.service.gov.uk/media/5a7b9246e5274a7318b8f889/PRIMARY_national_curriculum_-_Languages.pdf"},{"id":"nc-maths-2014","title":"National curriculum in England: mathematics programmes of study, key stages 1 and 2","count":241,"country":"GB-ENG","band":"","url":"https://assets.publishing.service.gov.uk/media/5a7da548ed915d2ac884cb07/PRIMARY_national_curriculum_-_Mathematics_220714.pdf"}],"typeSecs":[{"id":"multiple_choice","html":"\u003cp>The child taps one text option. Right: green and a praise phrase. Wrong: red, that option's feedback if there is any, then the hint for the stage.\u003c/p>\n\u003cp>Fields: \u003ccode>options\u003c/code> (strings), \u003ccode>answer\u003c/code> (one of them), \u003ccode>feedback\u003c/code> keyed by wrong option, \u003ccode>keep_order\u003c/code> (optional).\u003c/p>\n\u003cp>The app shows the options in a new random order each time the task is shown, so where an option sits in the record says nothing. \u003ccode>keep_order: true\u003c/code> keeps the record order, for options that read as a scale or a fixed pair (always, sometimes, never; Ja, Nein). The same holds for image_multiple_choice and audio_choice.\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Sum with a drawn model\u003c/td>\u003ctd>\"7 + 5 = _\" over a Zwanzigerfeld, options 10, 12, 13\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How many\u003c/td>\u003ctd>\"Wie viele Bälle sind es?\" over \u003ccode>{ object: ball, count: 3 }\u003c/code>, options 1, 2, 3\u003c/td>\u003ctd>count-to-5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which jump first\u003c/td>\u003ctd>\"Welcher Sprung kommt zuerst?\" over an empty Rechenstrich, options 1, 3, 4\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which sum fits the story\u003c/td>\u003ctd>\"Welche Aufgabe passt? Tom hat 7 Sticker ...\", options 7 + 6, 7 − 6, 6 + 6\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How many, at a glance\u003c/td>\u003ctd>\"Wie viele Punkte?\" over \u003ccode>{ drawn: dots, count: 4, layout: dice, flash: 2 }\u003c/code>\u003c/td>\u003ctd>subitize-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which numeral for this amount\u003c/td>\u003ctd>four dots shown, options 3, 4, 5, with \u003ccode>option_audio: false\u003c/code> (hearing \"vier\" on the option would give the answer)\u003c/td>\u003ctd>write-numerals-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Before or after\u003c/td>\u003ctd>\"Welche Zahl kommt nach 6?\", options 5, 7, 8\u003c/td>\u003ctd>order-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which statement is true\u003c/td>\u003ctd>\"Welches stimmt?\" options 3 &lt; 5, 5 &lt; 3, 3 = 5\u003c/td>\u003ctd>compare-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The sum for a story or picture\u003c/td>\u003ctd>\"Fünf Kinder sitzen im Bus. Zwei steigen ein.\" or a ten-frame with \u003ccode>cross\u003c/code>, options 5 + 2, 5 − 2, 2 − 5\u003c/td>\u003ctd>add-meaning, sub-meaning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Plus or minus?\u003c/td>\u003ctd>a story in \u003ccode>say\u003c/code>, options plus, minus\u003c/td>\u003ctd>sub-meaning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The story for a sum\u003c/td>\u003ctd>\"Welche Geschichte passt zu 5 − 1?\", options are short stories\u003c/td>\u003ctd>add-meaning, sub-meaning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Umkehraufgabe or family member\u003c/td>\u003ctd>options are whole sums, one is the Tauschaufgabe\u003c/td>\u003ctd>inverse\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The answer sentence\u003c/td>\u003ctd>a story and its sum, \"Welcher Antwortsatz passt?\", options are short sentences with the right number in the wrong thing, a wrong number, and the right one\u003c/td>\u003ctd>picture-stories\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which fact is not needed\u003c/td>\u003ctd>a story with one fact too many, \"Welche Angabe brauchst du nicht?\", options are the story's sentences\u003c/td>\u003ctd>question-calc-answer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What the picture is asking\u003c/td>\u003ctd>a picture with a story, \"Was sollst du herausfinden?\", options are short questions\u003c/td>\u003ctd>picture-stories\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which part changes\u003c/td>\u003ctd>\"34 + 5: Was ändert sich?\" options die Einer, die Zehner, beide\u003c/td>\u003ctd>ones-no-bridge, tens-to-two-digit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read a Strichliste or survey\u003c/td>\u003ctd>over a \u003ccode>bar-chart\u003c/code> with \u003ccode>tally: true\u003c/code>, \"Wie viele Kinder mögen Rot?\", \"Welche Farbe mögen die meisten?\", \"Wie viele mehr?\"\u003c/td>\u003ctd>tally\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Area in unit squares\u003c/td>\u003ctd>\"Wie viele Kästchen groß ist die Fläche?\" over a \u003ccode>grid\u003c/code> with coloured \u003ccode>cells\u003c/code> and \u003ccode>halves\u003c/code>\u003c/td>\u003ctd>area-unit-squares\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Copy on the grid\u003c/td>\u003ctd>\"Welche Abzeichnung ist richtig?\" options three \u003ccode>grid\u003c/code> drawings, each with a \u003ccode>key\u003c/code>\u003c/td>\u003ctd>grid-drawing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cube net or not\u003c/td>\u003ctd>\"Ist das ein Würfelnetz?\" over a \u003ccode>grid\u003c/code> of six \u003ccode>cells\u003c/code>; or \"Wo fehlt das sechste Quadrat?\" with \u003ccode>labels\u003c/code> A to D in candidate squares\u003c/td>\u003ctd>nets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>View of a building\u003c/td>\u003ctd>\"Wie sieht das Gebäude von vorne aus?\" over \u003ccode>cubes\u003c/code> in \u003ccode>mode: building\u003c/code>, options \u003ccode>cubes\u003c/code> in \u003ccode>front\u003c/code>, \u003ccode>side\u003c/code> or \u003ccode>top\u003c/code>, each with a \u003ccode>key\u003c/code>\u003c/td>\u003ctd>views\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Count cubes from a plan\u003c/td>\u003ctd>\"Wie viele Würfel braucht man?\" over \u003ccode>cubes\u003c/code> in \u003ccode>mode: plan\u003c/code>\u003c/td>\u003ctd>complex-buildings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Name a fraction\u003c/td>\u003ctd>\"Welcher Teil ist rot?\" over a \u003ccode>fraction\u003c/code>, options \"1/4\", \"3/4\", \"1/3\", \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>name-fractions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sure, possible, impossible\u003c/td>\u003ctd>\"Der Zeiger bleibt auf Gelb stehen.\" over a \u003ccode>spinner\u003c/code>, options sicher, möglich, unmöglich with \u003ccode>keep_order\u003c/code>\u003c/td>\u003ctd>certain-possible-impossible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Misleading chart\u003c/td>\u003ctd>\"Warum täuscht das Diagramm?\" over a \u003ccode>bar-chart\u003c/code> with \u003ccode>from\u003c/code>\u003c/td>\u003ctd>data-critical\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which Rechenweg is this\u003c/td>\u003ctd>a worked calculation in \u003ccode>text\u003c/code> (\"45 + 38 = 45 + 30 + 8\"), \"Welcher Rechenweg ist das?\", options schrittweise, stellenweise, mit Hilfsaufgabe, ergänzen\u003c/td>\u003ctd>describe-methods\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which trick fits\u003c/td>\u003ctd>\"Welcher Trick hilft bei 9 + 9?\", options verdoppeln, Zehnerfreunde, weiterzählen, kleine Aufgabe; feedback on the slow way\u003c/td>\u003ctd>fluency-to-20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which Rechenweg suits\u003c/td>\u003ctd>\"Welcher Weg passt gut zu 56 + 19?\", options name methods; the answer is the one the sum invites (19 is near 20: Hilfsaufgabe) and the record says why in \u003ccode>feedback\u003c/code>\u003c/td>\u003ctd>describe-methods, clever\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Where is the mistake\u003c/td>\u003ctd>a worked calculation with one wrong step, options are its steps or short descriptions of the error\u003c/td>\u003ctd>check\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Überschlag\u003c/td>\u003ctd>\"Ungefähr wie viel ist 48 + 29?\", options are round numbers (60, 80, 100)\u003c/td>\u003ctd>check\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Where the sound is\u003c/td>\u003ctd>over a picture, \"Wo hörst du das sss?\", options am Anfang, in der Mitte, am Ende\u003c/td>\u003ctd>sounds-in-words\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which pronoun fits\u003c/td>\u003ctd>\"Der Hund bellt. Welches Pronomen passt?\" options er, sie, es; or \"Wer ist mit sie gemeint?\" options the nouns of the text\u003c/td>\u003ctd>pronouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which text reads better\u003c/td>\u003ctd>two short texts, one repeating the noun, one with a pronoun, \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>pronouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which sentence pattern\u003c/td>\u003ctd>\"Du willst sagen, was du magst. Welcher Satzanfang passt?\", options I like …, I am …, I can …\u003c/td>\u003ctd>en-about-me\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Name the tense\u003c/td>\u003ctd>a sentence in \u003ccode>text\u003c/code>, \"Welche Zeitform ist das?\", options Präsens, Präteritum, Perfekt, Futur\u003c/td>\u003ctd>verbs-tenses-mixed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which description says more\u003c/td>\u003ctd>options are noun phrases with no, a vague, or two precise adjectives (\"eine schöne Katze\", \"eine kleine, graue Katze\")\u003c/td>\u003ctd>adjectives-describe\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Word type of a word\u003c/td>\u003ctd>\"Was ist laufen?\" options Verb, Nomen, Adjektiv (the word shown lowercase so capitals do not decide)\u003c/td>\u003ctd>verbs-recognise\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sensible rounding in a context\u003c/td>\u003ctd>\"Was schreibt die Zeitung am sinnvollsten?\" over an exact count, options are roundings to different places\u003c/td>\u003ctd>order-to-million\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Name the part of a calculation\u003c/td>\u003ctd>\"Wie heißt 587 in 362 + 225 = 587?\", options Summe, Summand, Differenz, Minuend, Subtrahend\u003c/td>\u003ctd>vocabulary-add-sub\u003c/td>\u003c/tr>\u003ctr>\u003ctd>From the term to the calculation\u003c/td>\u003ctd>\"Bilde die Differenz von 500 und 180\", as text_input or with options 500 − 180, 500 + 180, 180 − 500\u003c/td>\u003ctd>vocabulary-add-sub\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which result fits the Überschlag\u003c/td>\u003ctd>\"Welches Ergebnis passt zum Überschlag? 512 + 289\", options 801, 701, 901; or true_false \"Passt das zum Überschlag?\"; or whole worked calculations as options, one far from its Überschlag\u003c/td>\u003ctd>estimate-to-1000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which sums make 100\u003c/td>\u003ctd>\"Welche Aufgabe ergibt 100?\", options are whole sums (82 + 18, 82 + 28, 82 + 8)\u003c/td>\u003ctd>complement\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which way to put it right\u003c/td>\u003ctd>after a Hilfsaufgabe (\"72 − 30 = 42\"), options eins dazulegen, eins wegnehmen\u003c/td>\u003ctd>clever\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Who calculated right\u003c/td>\u003ctd>two children's worked ways side by side, \"Wer hat richtig gerechnet?\", options beide, nur A, nur B\u003c/td>\u003ctd>describe-methods\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Missing part\u003c/td>\u003ctd>\"7 = 3 + _\" over a split ten-frame, options 3, 4, 5\u003c/td>\u003ctd>partition-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Missing part or whole (England)\u003c/td>\u003ctd>\"The whole is five. One part is four. What is the other part?\" over \u003ccode>{ drawn: part-whole, whole: 5, parts: [4, null] }\u003c/code>\u003c/td>\u003ctd>en-GB partition-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How many more to make ten\u003c/td>\u003ctd>over a ten frame with 7, options 2, 3, 4\u003c/td>\u003ctd>en-GB partition-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One more, one less\u003c/td>\u003ctd>\"Here are three apples. One more apple comes. How many now?\"\u003c/td>\u003ctd>en-GB order-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which is more, said aloud\u003c/td>\u003ctd>\"Which is more, three or seven?\", options 3, 7 (they say themselves)\u003c/td>\u003ctd>en-GB compare-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How many tens and ones\u003c/td>\u003ctd>over \u003ccode>{ drawn: base-ten, tens: 3, ones: 4 }\u003c/code>, options 7, 34, 43\u003c/td>\u003ctd>bundle-tens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Estimate at a glance\u003c/td>\u003ctd>\"Wie viele sind es ungefähr?\" over \u003ccode>{ drawn: hundred-field, filled: 30, flash: 2 }\u003c/code>, options etwa 10, etwa 30, etwa 90\u003c/td>\u003ctd>bundle-tens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read a place-value chart\u003c/td>\u003ctd>over \u003ccode>{ drawn: place-value-chart, columns: [tens, ones], values: [2, 6] }\u003c/code>, options 26, 62, 8\u003c/td>\u003ctd>place-value-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hear a number, find its digits\u003c/td>\u003ctd>the voice says \"Sechsunddreißig\", options 36, 63, 30 with \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>read-write-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read a number word\u003c/td>\u003ctd>the screen says \"dreiundvierzig\", options 34, 43, 40 with \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>read-write-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read the hundred field\u003c/td>\u003ctd>over \u003ccode>{ drawn: hundred-field, filled: 45 }\u003c/code>, options 45, 54, 40\u003c/td>\u003ctd>hundred-field\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hidden number on the hundred square\u003c/td>\u003ctd>over \u003ccode>{ drawn: hundred-square, highlight: [46], hide: [56] }\u003c/code>, \"unter 46\", options 47, 56, 66\u003c/td>\u003ctd>hundred-square\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A move on the hundred square\u003c/td>\u003ctd>\"Start 14, 2 Zeilen nach unten\", options 16, 24, 34\u003c/td>\u003ctd>hundred-square\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Where the arrow points\u003c/td>\u003ctd>over \u003ccode>{ drawn: number-line, from: 30, to: 40, labels: ends, mark: 32 }\u003c/code>, options 32, 23, 38\u003c/td>\u003ctd>number-line-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The rule of a sequence\u003c/td>\u003ctd>\"31, 41, 51, 61\", options +1, +10, −10 with \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>sequences-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which number does not fit\u003c/td>\u003ctd>\"10, 20, 30, 45, 50\", options 20, 45, 50\u003c/td>\u003ctd>sequences-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Number riddle\u003c/td>\u003ctd>\"Größer als 30. Kleiner als 40. Die Einerziffer ist 8.\", options 38, 48, 83\u003c/td>\u003ctd>number-puzzles-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Build a compound from two pictures\u003c/td>\u003ctd>\"Apfel und Baum. Welches Wort entsteht?\" over \u003ccode>{ objects: [apple, tree] }\u003c/code>, options Apfelbaum, Baumapfel, Apfelhaus\u003c/td>\u003ctd>compound-nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What a compound means\u003c/td>\u003ctd>\"Was ist ein Baumhaus?\", options ein Haus, ein Baum\u003c/td>\u003ctd>compound-nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Article of a compound\u003c/td>\u003ctd>\"der, die oder das? Baumhaus\" over the two pictures; the last word decides\u003c/td>\u003ctd>compound-nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Make a noun with an ending\u003c/td>\u003ctd>\"hoffen → ?\", options die Hoffnung, die hoffnung, die Hoffheit\u003c/td>\u003ctd>noun-endings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which word is (not) a noun\u003c/td>\u003ctd>\"Welches Wort ist ein Nomen?\" mutig, Mut, mutiger; the article test\u003c/td>\u003ctd>abstract-nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which sentence is written correctly\u003c/td>\u003ctd>three spellings of one sentence, \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>abstract-nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Theme of a short story\u003c/td>\u003ctd>a two-sentence story in \u003ccode>text\u003c/code>, \"What is the theme?\", options friendship, a sandwich, school dinners (a plot detail is always one option)\u003c/td>\u003ctd>en-GB themes-conventions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The moral of a fable\u003c/td>\u003ctd>options: the moral, a fact from the fable, a detail\u003c/td>\u003ctd>en-GB themes-conventions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Find a fact in a short text\u003c/td>\u003ctd>a text with headings in \u003ccode>text\u003c/code> (lines split with \u003ccode>\\n\u003c/code>; the player sets it as a passage), question at the bottom\u003c/td>\u003ctd>en-GB retrieve-present\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fact or opinion\u003c/td>\u003ctd>\"\\\"Pizza is the tastiest food.\\\" Fact or opinion?\", options fact, opinion\u003c/td>\u003ctd>en-GB fact-opinion\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Evidence for a view\u003c/td>\u003ctd>a short passage and a view in \u003ccode>text\u003c/code>, options three quotations; one is from the text but does not support the view\u003c/td>\u003ctd>en-GB justify-views\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How a word sounds, read from a card\u003c/td>\u003ctd>the word on a letter card, the voice says \"Read the word on the card\", so the child must read it (never say the target word in a reading task)\u003c/td>\u003ctd>en-GB alternative-pronunciations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ask the case question\u003c/td>\u003ctd>\"Wen oder was? \\\"Die Katze fängt eine Maus.\\\"\" with the question in \u003ccode>say\u003c/code>, options the noun groups\u003c/td>\u003ctd>noun-cases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which case is it in\u003c/td>\u003ctd>\"In welchem Fall steht \\\"dem Kind\\\"?\", options Nominativ, Dativ, Akkusativ\u003c/td>\u003ctd>noun-cases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What is the digit worth?\u003c/td>\u003ctd>\"Wie viel ist die 4 in 247 wert?\", options 4, 40, 400\u003c/td>\u003ctd>place-value-to-1000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Round to tens or hundreds\u003c/td>\u003ctd>\"Runde 471 auf Hunderter.\" over a number line with the arrow at 471, options 400, 500, 470\u003c/td>\u003ctd>round-to-1000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which clue makes the riddle unique\u003c/td>\u003ctd>options are clue sentences; one names the missing digit\u003c/td>\u003ctd>number-puzzles-to-1000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Find the Subjekt with Wer oder was?\u003c/td>\u003ctd>\"„Im Sommer fahren wir ans Meer.“ Wer oder was fährt ans Meer?\", options the sentence's Satzglieder (wir, Im Sommer, ans Meer)\u003c/td>\u003ctd>sentences-subject-predicate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Subjekt or Prädikat\u003c/td>\u003ctd>\"„Oma singt ein Lied.“ Was ist „singt“?\", options Prädikat, Subjekt\u003c/td>\u003ctd>sentences-subject-predicate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which words stay together\u003c/td>\u003ctd>\"„Die Kinder spielen im Garten.“ Welche Wörter bleiben beim Umstellen zusammen?\", options one Satzglied and two word pairs that cross a boundary\u003c/td>\u003ctd>sentences-move-parts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How many Satzglieder\u003c/td>\u003ctd>a sentence in \u003ccode>text\u003c/code>, options counts; the word count is always one distractor\u003c/td>\u003ctd>sentences-move-parts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which question finds the Satzglied\u003c/td>\u003ctd>\"„Lena geht in die Bücherei.“ Mit welcher Frage findest du „in die Bücherei“?\", options Wohin?, Woher?, Wen oder was? (or Wem?, Wann?)\u003c/td>\u003ctd>sentences-objects, sentences-place-time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Name the Satzglied\u003c/td>\u003ctd>\"Was ist „eine Geschichte“?\", options Akkusativobjekt, Dativobjekt, Subjekt; or Ortsangabe, Zeitangabe\u003c/td>\u003ctd>sentences-objects, sentences-place-time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which English article\u003c/td>\u003ctd>\"_ orange\" over the picture, options a, an; or \"two _\" over a group, options dogs, dog, a dog\u003c/td>\u003ctd>en-plurals-articles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which reply fits\u003c/td>\u003ctd>the voice asks \"Do you like milk?\" after saying in German whether you like it, options Yes, I do. / Yes, I like. / No, I don't.\u003c/td>\u003ctd>en-food\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which Bindewort fits\u003c/td>\u003ctd>\"Es regnet, _ wir gehen trotzdem raus.\", options aber, und, oder (or weil, dass, wenn)\u003c/td>\u003ctd>sentences-conjunctions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ersatzprobe for das or dass\u003c/td>\u003ctd>\"Passt „dieses“ oder „welches“ in die Lücke? „_ Lied gefällt mir.“\", options Ja, also das / Nein, also dass with \u003ccode>keep_order: true\u003c/code>\u003c/td>\u003ctd>spelling-das-dass\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Who is speaking\u003c/td>\u003ctd>\"Ben antwortet: „Ich war das.“ Wer spricht?\", options the people in the sentence\u003c/td>\u003ctd>sentences-direct-speech\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which sentence is rearranged correctly\u003c/td>\u003ctd>the original is spoken, options three orders, only one with the verb in second place, \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>sentences-move-parts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read a table\u003c/td>\u003ctd>over a \u003ccode>table\u003c/code>, \"Wie viele Bücher hat Mia gelesen?\" or \"Was hat die Klasse am Mittwoch in der 2. Stunde?\"; the table's title stands in \u003ccode>text\u003c/code> above the question\u003c/td>\u003ctd>read-tables, sketches\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How much money\u003c/td>\u003ctd>over \u003ccode>coins\u003c/code>, \"Wie viel Geld ist das?\", options \"1 € 30 ct\", \"1 € 3 ct\", \"3 €\"\u003c/td>\u003ctd>money-euro-cent\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>An option's key (what \u003ccode>answer\u003c/code> names) is the string itself, or for a picture its count, its colour, or its object, in that order. When two options would share a key (a yellow skirt and a yellow dress), give each an explicit \u003ccode>key\u003c/code> (\u003ccode>{ object: skirt, colour: yellow, key: skirt-yellow }\u003c/code>).\u003c/p>\n\u003cp>Twist: \u003ccode>options\u003c/code> become objects with \u003ccode>label\u003c/code>; \u003ccode>answer\u003c/code> becomes the correct option's id.\u003c/p>","uses":{"de-DE":7497,"en-GB":1258},"shot":"../types/shots/multiple_choice.png"},{"id":"image_multiple_choice","html":"\u003cp>As multiple_choice, but the options are pictures from the bank or drawn components.\u003c/p>\n\u003cp>Fields: \u003ccode>options\u003c/code> (list of \u003ccode>{ object }\u003c/code>, \u003ccode>{ object, colour }\u003c/code>, \u003ccode>{ object, count, layout }\u003c/code> or \u003ccode>{ drawn, ... }\u003c/code>), \u003ccode>answer\u003c/code>: the object id, the colour for colour versions, or the count for groups of counted things; for drawn amounts the number shown (ten-frame and hundred-field: \u003ccode>filled\u003c/code>, zwanzigerfeld: both frames together, dots with \u003ccode>groups\u003c/code>: the parts joined with + (\"4+4\"), base-ten and place-value-chart: the number they make).\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Picture that starts with a sound\u003c/td>\u003ctd>\"Was fängt mit L an?\" lamp, sun, fish; answer \u003ccode>lamp\u003c/code>\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Riddle from adjectives\u003c/td>\u003ctd>\"Es ist gelb, krumm und süß. Was ist es?\", options pictures\u003c/td>\u003ctd>adjectives-describe\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Picture that ends with a sound\u003c/td>\u003ctd>\"Bei welchem Wort hörst du das mmm am Ende?\" options pictures\u003c/td>\u003ctd>sounds-in-words\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read a word, find its picture\u003c/td>\u003ctd>\u003ccode>show: { drawn: syllable-arcs, word: Oma }\u003c/code>, options grandma, mum, llama\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Group with a given number\u003c/td>\u003ctd>\"Wo sind 2 Bananen?\" three banana groups of 1, 2 and 3; answer \u003ccode>\"2\"\u003c/code>\u003c/td>\u003ctd>count-to-5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Which has more, fewer\u003c/td>\u003ctd>\"Wo sind mehr?\" two groups; answer is the count of the one with more\u003c/td>\u003ctd>compare-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dot pattern with a given number\u003c/td>\u003ctd>\"Wo sind 6 Punkte?\" three dot patterns; answer \u003ccode>\"6\"\u003c/code>\u003c/td>\u003ctd>subitize-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What rhymes with this?\u003c/td>\u003ctd>\"Was reimt sich auf Haus?\" over \u003ccode>{ object: house }\u003c/code>, options mouse, ball, tree\u003c/td>\u003ctd>rhymes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Odd one out\u003c/td>\u003ctd>\"Welches Wort reimt sich nicht?\" options dog, mouth, cat; answer cat\u003c/td>\u003ctd>rhymes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How many sounds?\u003c/td>\u003ctd>over \u003ccode>{ object: fish }\u003c/code>, options dot rows of 2, 3 and 4; f ... i ... sh is three sounds\u003c/td>\u003ctd>en-GB oral-blending, sounds-in-words\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How many syllables (claps)?\u003c/td>\u003ctd>over \u003ccode>{ object: banana }\u003c/code>, options three dot rows of 1, 2 and 3 claps; answer \u003ccode>\"3\"\u003c/code>\u003c/td>\u003ctd>syllables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Word with n syllables\u003c/td>\u003ctd>\"Welches Wort hat 3 Silben?\" options pictures; each says its word\u003c/td>\u003ctd>syllables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Word with n sounds\u003c/td>\u003ctd>\"Welches Wort hat vier Laute?\" options pictures; each says its word\u003c/td>\u003ctd>sounds-in-words\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Same first sound\u003c/td>\u003ctd>\"Was fängt so an wie Sonne?\" over \u003ccode>{ object: sun }\u003c/code>, options sock, fish, ball\u003c/td>\u003ctd>initial-sound\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hear an instruction, find the action (English)\u003c/td>\u003ctd>hears \"Stand up!\", taps the child standing up of three action pictures\u003c/td>\u003ctd>classroom-phrases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hear a word, find the picture (English)\u003c/td>\u003ctd>hears \"Mouse.\", taps the mouse; the words sound like German ones (Maus, mouse)\u003c/td>\u003ctd>familiar-words\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read a word, find its picture (English)\u003c/td>\u003ctd>\u003ccode>show: { drawn: letter-card, text: \"cloud\" }\u003c/code>, options cloud, clown, clock (same first sounds, so only reading works)\u003c/td>\u003ctd>en-GB new-graphemes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read a word at a glance\u003c/td>\u003ctd>as above, with \u003ccode>flash: 2\u003c/code> on the letter card, so the word must be read whole\u003c/td>\u003ctd>en-GB automatic-decoding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read a sentence, find what it is about\u003c/td>\u003ctd>text \"The bird is in the tree.\", options bird, bread, bee\u003c/td>\u003ctd>en-GB automatic-decoding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Blocks or chart for a number\u003c/td>\u003ctd>\"Wo sind 36?\" options three \u003ccode>base-ten\u003c/code> pictures; or \"Welche Stellentafel zeigt 53?\" three \u003ccode>place-value-chart\u003c/code> pictures\u003c/td>\u003ctd>bundle-tens, place-value-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hundred field for a number\u003c/td>\u003ctd>\"Wo sind 50?\" three \u003ccode>hundred-field\u003c/code> pictures\u003c/td>\u003ctd>hundred-field\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Strichliste for a number\u003c/td>\u003ctd>\"Welche Strichliste zeigt 7?\" options three \u003ccode>bar-chart\u003c/code> tallies with one unlabelled row, each with an explicit \u003ccode>key\u003c/code> (\"7\")\u003c/td>\u003ctd>tally\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shape by its name or a property\u003c/td>\u003ctd>\"Wo ist das Dreieck?\" or \"Wo sind alle Seiten gleich lang?\", options three \u003ccode>shape\u003c/code> pictures in one colour; answer the kind (\u003ccode>square\u003c/code>), \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>basic-shapes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Coins that make an amount\u003c/td>\u003ctd>\"Wo ist genau 1 €?\", options three \u003ccode>coins\u003c/code> groups; answer the total in cent (\"100\")\u003c/td>\u003ctd>money-euro-cent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>More or fewer, against the look\u003c/td>\u003ctd>\"Wo sind mehr Äpfel?\", a scattered group of 3 against a row of 5, answer \"5\"; the wide group looks bigger but has fewer\u003c/td>\u003ctd>compare-to-10, sort-classify\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A drawn component as an option is keyed like a group: by its \u003ccode>count\u003c/code> (dots), \u003ccode>filled\u003c/code> (ten-frame, hundred-field), tens × 10 + ones (base-ten) or its digits read as a number (place-value-chart, \u003ccode>[5, 3]\u003c/code> is 53). Drawn options never speak.\u003c/p>","uses":{"de-DE":1052,"en-GB":313},"shot":"../types/shots/image_multiple_choice.png"},{"id":"audio_choice","html":"\u003cp>The child hears something (a big speaker plays it again) and taps the option that matches. The sound is the question, so options never get their own audio.\u003c/p>\n\u003cp>Fields: \u003ccode>audio\u003c/code> (\u003ccode>{ sound: de.l }\u003c/code> from the bank, or \u003ccode>{ en: \"Red.\" }\u003c/code>), \u003ccode>options\u003c/code> (strings, pictures or swatches), \u003ccode>answer\u003c/code>.\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Sound to letter\u003c/td>\u003ctd>hears \u003ccode>de.l\u003c/code>, taps L among L, M, S\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Syllable to syllable\u003c/td>\u003ctd>hears \u003ccode>de.mo\u003c/code>, taps Mo among Ma, Mo\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>English word to colour\u003c/td>\u003ctd>hears \"Red.\", taps the red swatch\u003c/td>\u003ctd>en-colours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>English word to picture\u003c/td>\u003ctd>hears \"Green.\", taps the frog\u003c/td>\u003ctd>en-colours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>English word to coloured object\u003c/td>\u003ctd>hears \"Blue.\", taps the blue car of three\u003c/td>\u003ctd>en-colours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Number word to numeral\u003c/td>\u003ctd>hears \"Sieben.\" (\u003ccode>audio: { de: \"Sieben.\" }\u003c/code>), taps 7 among 1, 7, 9\u003c/td>\u003ctd>write-numerals-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Blend sounds into a word\u003c/td>\u003ctd>hears \"c ... a ... t.\" or \u003ccode>{ de: \"Fff ... i ... sch.\" }\u003c/code> (pure sounds, never letter names), taps the picture\u003c/td>\u003ctd>en-GB oral-blending, sounds-in-words\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A heard word's first or last sound\u003c/td>\u003ctd>hears \"Bus.\", taps the picture that starts with the same sound (ball)\u003c/td>\u003ctd>en-GB oral-blending\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hear a tricky word, choose its spelling\u003c/td>\u003ctd>hears \"Heart.\", options hart, heart, haert; the sound-alike spelling is always there\u003c/td>\u003ctd>en-GB exception-words-ks2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What a conversation is about\u003c/td>\u003ctd>hears \"I'm hungry. Can I have an apple, please?\", taps \"um Essen\" of three German options\u003c/td>\u003ctd>en-short-dialogues\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A detail from a conversation\u003c/td>\u003ctd>hears \"Is your bag green? No, it's yellow.\", taps \"gelb\"; the wrong word comes first so the child listens to the end\u003c/td>\u003ctd>en-short-dialogues\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What someone can or likes to do\u003c/td>\u003ctd>hears \"I can swim, but I can't dance.\", taps the swimming picture\u003c/td>\u003ctd>en-hobbies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A sound, then the picture that starts with it\u003c/td>\u003ctd>plays a bank sound (\u003ccode>audio: { sound: en.k }\u003c/code>), options pictures (kite, goat, sun); each picture says its word when tapped\u003c/td>\u003ctd>en-GB phonics-g-o-c-k\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One or many\u003c/td>\u003ctd>hears \"Cats.\" or \"A frog.\", options one picture and a group of the same picture (\u003ccode>{ object: cat, count: 4, layout: row }\u003c/code>, key \"4\")\u003c/td>\u003ctd>en-plurals-articles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Likes or does not like\u003c/td>\u003ctd>hears \"I don't like eggs.\", taps one of two German sentences (\"Nein, es mag keine Eier.\"), \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>en-food\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","uses":{"de-DE":1324,"en-GB":307},"shot":"../types/shots/audio_choice.png"},{"id":"true_false","html":"\u003cp>The child taps Ja or Nein. The question sits in \u003ccode>say\u003c/code> so the voice can ask it naturally (\"Zähl die Fische. Sind das drei Fische?\").\u003c/p>\n\u003cp>Fields: \u003ccode>answer\u003c/code> (true or false).\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Do you hear this sound at the start?\u003c/td>\u003ctd>\"Hörst du am Anfang ein L?\" with a ladder\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is this the right number?\u003c/td>\u003ctd>\"Sind das 3 Fische?\" over \u003ccode>{ object: fish, count: 3 }\u003c/code>\u003c/td>\u003ctd>count-to-5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The same amount?\u003c/td>\u003ctd>\"Sind es rote und blaue Punkte gleich viele?\" over \u003ccode>{ drawn: dots, groups: [4, 3], layout: row }\u003c/code>\u003c/td>\u003ctd>compare-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is this comparison true?\u003c/td>\u003ctd>\"Stimmt das? 6 &gt; 3\", the voice reads \"sechs ist größer als drei\"\u003c/td>\u003ctd>compare-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Do these rhyme?\u003c/td>\u003ctd>\"Reimt sich das?\" over \u003ccode>{ objects: [house, mouse] }\u003c/code>; the voice says \"Haus, Maus\"\u003c/td>\u003ctd>rhymes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Same first sound?\u003c/td>\u003ctd>\"Fangen sie gleich an?\" over \u003ccode>{ objects: [sun, sock] }\u003c/code>\u003c/td>\u003ctd>initial-sound\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Does this split work?\u003c/td>\u003ctd>\"Stimmt das? 8 + 5 = 8 + 1 + 4\"\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is this the numeral?\u003c/td>\u003ctd>a card shows 6, the voice asks \"Ist das die Neun?\"; the screen says only \"Stimmt das?\", so the answer cannot be read off the screen\u003c/td>\u003ctd>write-numerals-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is this chart right?\u003c/td>\u003ctd>\"Tim hört dreiundsiebzig und schreibt: drei, sieben\" over a chart showing 3, 7\u003c/td>\u003ctd>read-write-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is the estimate good?\u003c/td>\u003ctd>\"Tom schätzt: etwa siebzig\" over a hundred field with 68\u003c/td>\u003ctd>bundle-tens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Does the answer fit every clue?\u003c/td>\u003ctd>\"Stimmt 75? Größer als 70. Ungerade. Die Einerziffer ist 3.\"\u003c/td>\u003ctd>number-puzzles-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is the riddle unique?\u003c/td>\u003ctd>\"Ist das Rätsel eindeutig? Meine Zahl ist gerade und liegt zwischen 200 und 300.\"\u003c/td>\u003ctd>number-puzzles-to-1000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is this the Subjekt or Prädikat?\u003c/td>\u003ctd>\"„Der Ball rollt unter das Sofa.“ Ist „unter das Sofa“ das Subjekt?\"\u003c/td>\u003ctd>sentences-subject-predicate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rearranged correctly? Verb in second place?\u003c/td>\u003ctd>a rearranged sentence on a letter card, the original spoken; \"Steht das Verb an zweiter Stelle?\"\u003c/td>\u003ctd>sentences-move-parts\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","uses":{"de-DE":3376,"en-GB":580},"shot":"../types/shots/true_false.png"},{"id":"fill_in_blank","html":"\u003cp>A frame with gaps (\u003ccode>_\u003c/code>); the child taps option chips to fill the gaps in order and taps Prüfen. Tapping a filled gap empties it. A chip can fill more than one gap (H: 3, Z: 3, E: 8 needs one 3 chip).\u003c/p>\n\u003cp>Fields: \u003ccode>frame\u003c/code>, \u003ccode>options\u003c/code>, \u003ccode>answer\u003c/code> (a list, one per gap).\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Split a number to make ten\u003c/td>\u003ctd>\"8 + 6 = 8 + _ + _\", answer 2, 4\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Missing letter in a word\u003c/td>\u003ctd>\"_ama\" with a llama, options L, M, O\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ending after a stem\u003c/td>\u003ctd>\"ich lach_\" or \"du malst → mal_\", chips are endings (e, st, t, en)\u003c/td>\u003ctd>verbs-conjugate, verbs-base-form\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prefix in a sentence gap\u003c/td>\u003ctd>\"Der Zug soll gleich _fahren.\", chips are prefixes (ab, auf, ver)\u003c/td>\u003ctd>verbs-prefixes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Neighbours of a number\u003c/td>\u003ctd>\"_ , 5, _\" options 3, 4, 6, 7, answer 4, 6\u003c/td>\u003ctd>order-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sign between two numbers\u003c/td>\u003ctd>\"6 _ 4\" options &lt;, &gt;, =, answer &gt;, \u003ccode>option_audio: false\u003c/code> (hearing \"größer als\" would give it away); with two dice above it in the full stage\u003c/td>\u003ctd>compare-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A number that makes it true\u003c/td>\u003ctd>\"_ &gt; 6\" options 4, 6, 8, answer 8\u003c/td>\u003ctd>compare-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Split of a number\u003c/td>\u003ctd>\"6 = _ + _\" with a split dot picture, answer 4, 2\u003c/td>\u003ctd>partition-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Number house\u003c/td>\u003ctd>\u003ccode>show: { drawn: number-house, roof: 7, rows: [[3, null]] }\u003c/code>, frame \"3 + _ = 7\"\u003c/td>\u003ctd>partition-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tens and ones of an amount\u003c/td>\u003ctd>over base-ten blocks, frame \"_ Zehner und _ Einer\" or \"Z: _  E: _\"\u003c/td>\u003ctd>bundle-tens, place-value-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Record facts from two texts\u003c/td>\u003ctd>\"In autumn they go to: _  Their nests are made of: _\"\u003c/td>\u003ctd>en-GB retrieve-present\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Missing to 100\u003c/td>\u003ctd>over a hundred field with 70, frame \"70 + _ = 100\"\u003c/td>\u003ctd>hundred-field\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Neighbouring tens\u003c/td>\u003ctd>\"Nachbarzehner: _ , 27, _\" options 20, 26, 28, 30\u003c/td>\u003ctd>order-compare-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The whole calculation for a story\u003c/td>\u003ctd>a story in \u003ccode>say\u003c/code>, frame \"_ _ _ = _\", options the numbers, +, − and one wrong number, answer e.g. 6, −, 4, 2\u003c/td>\u003ctd>picture-stories\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Analogieaufgabe\u003c/td>\u003ctd>\"4 + 3 = _ · 34 + 3 = _\", the small sum first, then the one it helps with\u003c/td>\u003ctd>ones-no-bridge, tens-to-two-digit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rechenweg in steps\u003c/td>\u003ctd>\"38 + 5 = 38 + 2 + _ = _\" or \"72 − 35 = 72 − 30 − _ = _\", the child fills the next step and the result; ergänzen in two jumps: \"53 + _ = 60 · 60 + _ = 100 · 53 + _ = 100\"\u003c/td>\u003ctd>ones-bridge, add-two-digit, sub-two-digit, clever, complement\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stellenweise\u003c/td>\u003ctd>\"45 + 38: 40 + 30 = _ · 5 + 8 = _ · _ + _ = _\"\u003c/td>\u003ctd>add-two-digit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Placeholder\u003c/td>\u003ctd>\"45 + _ = 72\", \"_ − 20 = 35\", \"48 + 30 _ 80\" with signs\u003c/td>\u003ctd>equations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Number wall brick\u003c/td>\u003ctd>over a number wall with gaps, frame \"_\" or \"_ · _\" for the gaps from left to right, bottom row first; a gap at the bottom is found by subtracting\u003c/td>\u003ctd>number-walls\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Number chain\u003c/td>\u003ctd>\"4 → +3 → _ → +5 → _\", each arrow does what it says\u003c/td>\u003ctd>number-walls\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Continue a sequence\u003c/td>\u003ctd>\"42, 44, 46, _ , _\"\u003c/td>\u003ctd>sequences-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Double by tens and ones\u003c/td>\u003ctd>\"Das Doppelte von 32\", frame \"60 + _ = _\"\u003c/td>\u003ctd>double-halve-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Split into place values\u003c/td>\u003ctd>\"Zerlege 683.\", frame \"683 = _ + _ + _\"\u003c/td>\u003ctd>place-value-to-1000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Round two ways\u003c/td>\u003ctd>\"Runde 738.\", frame \"auf Zehner: _   auf Hunderter: _\"\u003c/td>\u003ctd>round-to-1000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Join or split a compound\u003c/td>\u003ctd>\"Hand + Schuh = _\" (options include HandSchuh for the one-capital rule); \"Schneemann = _ + _\"\u003c/td>\u003ctd>compound-nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Noun ending\u003c/td>\u003ctd>\"die Ehrlich_\", options heit, keit, ung\u003c/td>\u003ctd>noun-endings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Missing grapheme\u003c/td>\u003ctd>over a bird picture, frame \"b_rd\", options ir, ou, ay\u003c/td>\u003ctd>en-GB new-graphemes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Article in a case\u003c/td>\u003ctd>\"Ich gebe _ Katze _ Futter.\", options der, die, das, dem\u003c/td>\u003ctd>noun-cases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>das or dass in a gap\u003c/td>\u003ctd>\"Das Pferd, _ dort steht, heißt Blitz.\", options das, dass; two gaps for \"dass das\"\u003c/td>\u003ctd>spelling-das-dass\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The punctuation mark in a gap\u003c/td>\u003ctd>\"Der Hund ist klein_ aber er bellt laut.\", options , . ! (also ! . ? after an Aufforderung)\u003c/td>\u003ctd>sentences-conjunctions, verbs-imperative\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The ending a short word takes\u003c/td>\u003ctd>\"do_\" for doll, options ll, l, ff; \"ro_\" for rock, options ck, c, g\u003c/td>\u003ctd>en-GB phonics-ck-e-u-r, phonics-h-b-f-l\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Euro and Cent from coins\u003c/td>\u003ctd>over \u003ccode>coins\u003c/code>, frame \"_ € _ ct\"\u003c/td>\u003ctd>money-euro-cent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fill the gaps of a table\u003c/td>\u003ctd>over a \u003ccode>table\u003c/code> with \"?\" gaps, frame \"2 Tickets: _ €, 3 Tickets: _ €\"\u003c/td>\u003ctd>sketches\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","uses":{"de-DE":2222,"en-GB":406},"shot":"../types/shots/fill_in_blank.png"},{"id":"text_input","html":"\u003cp>The child types a number on an on-screen keypad and taps Prüfen. Used when choosing from options would make the task too easy.\u003c/p>\n\u003cp>Fields: \u003ccode>answer\u003c/code> (a string).\u003c/p>\n\u003cp>Interactions: the result of a sum (\"9 + 7 = _\"); the answer to a story problem (add-bridge-10). Hear a number and write it (\"Einundfünfzig. Schreib die Zahl.\"); read a number word and write it; the end of a hundred-square move; double or halve; solve a riddle (Zahlen bis 100 lessons).\u003c/p>","uses":{"de-DE":1505,"en-GB":279},"shot":"../types/shots/text_input.png"},{"id":"tap_to_count","html":"\u003cp>Pictures of one object; the child taps each once (it gets its number, so none is counted twice), then taps how many there are.\u003c/p>\n\u003cp>Fields: \u003ccode>show: { object, count, layout: row | scattered }\u003c/code>, \u003ccode>options\u003c/code>, \u003ccode>answer\u003c/code>. The build checks that the answer is the number shown.\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Count things in a row\u003c/td>\u003ctd>4 balloons in a row, options 3, 4, 5\u003c/td>\u003ctd>count-to-5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Count scattered things\u003c/td>\u003ctd>8 eggs scattered, options 7, 8, 9\u003c/td>\u003ctd>count-to-10\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Scattered things sit on a loose grid (one cell each, small offsets), so they never overlap and can always be counted.\u003c/p>","uses":{"de-DE":31,"en-GB":23},"shot":"../types/shots/tap_to_count.png"},{"id":"drag_and_drop_count","html":"\u003cp>A Zwanzigerfeld; the child taps counters in the second row to move them up until the first row is full, then taps Prüfen.\u003c/p>\n\u003cp>Fields: \u003ccode>show: { drawn: zwanzigerfeld, filled: [7, 5] }\u003c/code>, \u003ccode>total_items\u003c/code> (counters that can move), \u003ccode>answer\u003c/code> (how many to move).\u003c/p>\n\u003cp>Interactions: fill up to ten (add-bridge-10).\u003c/p>","uses":{"de-DE":2,"en-GB":0},"shot":"../types/shots/drag_and_drop_count.png"},{"id":"point_on_line","html":"\u003cp>A number line; the child taps a tick and taps Prüfen. The marker shows where they tapped, never the number.\u003c/p>\n\u003cp>Fields: \u003ccode>show: { drawn: number-line, from, to, labels, jumps, step }\u003c/code>, \u003ccode>answer\u003c/code> (a number), \u003ccode>feedback\u003c/code> keyed by a tapped value. \u003ccode>step\u003c/code> (1, 5, 10, 100, 1000, 10000 or 100000; 1 if left out) sets which ticks are drawn and can be tapped, so a line from 0 to 100 or 1000 has ticks a child's finger can hit. The answer must sit on a tick.\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Where a sum lands, with or without jump arcs\u003c/td>\u003ctd>0 to 20, \"8 + 5\"\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Find a ten on a long line\u003c/td>\u003ctd>0 to 100, \u003ccode>step: 10\u003c/code>, labels ends, \"Wo ist 60?\"\u003c/td>\u003ctd>number-line-to-10
