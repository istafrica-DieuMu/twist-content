 length, and pictures of lines to pick from, wait for a drawing task and a line component."}},{"id":"math.shapes.more-shapes","domain":"math","topic":"Geometrie","can":"Ich kann weitere Figuren wie Sechseck, Achteck und Parallelogramm erkennen und mit Fachbegriffen beschreiben.","standards":["kmk-mathe-2022.rf.4"],"set":{"title":"Sechseck, Achteck, Parallelogramm","file":"twist/lessons/de-DE/klasse-3/math/more-shapes.yaml","lessons":[{"n":1,"title":"Fünfeck, Sechseck, Achteck","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Vierecke und das Parallelogramm","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 names Vielecke by their corners (Fünfeck, Sechseck, Achteck), learns that a shape with straight sides has as many corners as sides, and finds them in things around us (Stoppschild, Bienenwabe); lesson 2 meets the Parallelogramm as a slanted Viereck, uses the terms Ecke, Seite, parallel and rechter Winkel to tell Quadrat, Rechteck and Parallelogramm apart, and ends with the skill check. Every shape the lesson names is shown with the shape component."}},{"id":"math.solids.more-solids","domain":"math","topic":"Körper","can":"Ich kann Pyramide, Zylinder und Kegel erkennen und Körper nach Ecken, Kanten und Flächen sortieren.","standards":["kmk-mathe-2022.rf.4","nc-maths-2014.y2.geometry-properties-of-shapes.2","nc-maths-2014.y2.geometry-properties-of-shapes.3"],"set":{"title":"Pyramide, Zylinder, Kegel","file":"twist/lessons/de-DE/klasse-3/math/more-solids.yaml","lessons":[{"n":1,"title":"Neue Körper","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Ecken, Kanten, Flächen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 names the Zylinder, the Kegel and the Pyramide by their surfaces (zwei Kreisflächen, ein Kreis und eine Spitze, ein Quadrat und Dreiecke) and finds them in things around us; lesson 2 counts Ecken, Kanten and Flächen of all six solids, sorts solids that can roll from those that cannot, and ends with the skill check."}},{"id":"math.solids.nets","domain":"math","topic":"Körper","can":"Ich kann Würfelnetze erkennen und prüfen, ob sich ein Netz zu einem Würfel falten lässt.","standards":["kmk-mathe-2022.rf.2","kmk-mathe-2022.rf.3","nc-maths-2014.y5.geometry-properties-of-shapes.1","nc-maths-2014.y6.geometry-properties-of-shapes.2"],"set":{"title":"Würfelnetze","file":"twist/lessons/de-DE/klasse-3/math/nets.yaml","lessons":[{"n":1,"title":"Was ist ein Würfelnetz?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Was liegt gegenüber?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 shows that a Würfelnetz is six Quadrate that fold into a Würfel, tells nets from shapes that do not fold (a Rechteck of 2 mal 3, five in a row, a block of four, two Deckel on one side) and finds where the sixth square must go; lesson 2 finds which faces lie opposite each other (in a row of three, the first and the third), uses the rule that opposite faces of a Spielwürfel add up to 7, and ends with the skill check. Folding a net with the finger waits for a 3D folding view."}},{"id":"math.space.plans-maps","domain":"math","topic":"Orientierung","can":"Ich kann mich mit Plänen und Karten orientieren, Wege einzeichnen und mit Koordinaten wie A3 Felder finden.","standards":["kmk-mathe-2022.rf.1"],"set":{"title":"Pläne und Karten","file":"twist/lessons/de-DE/klasse-3/math/plans-maps.yaml","lessons":[{"n":1,"title":"Felder finden","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wege auf dem Plan","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 finds squares on a grid plan with the letter of the column and the number of the row (B2 ist der Brunnen) and names the square of a place; lesson 2 follows and describes routes on the plan (2 Felder nach rechts, 1 Feld nach unten) and ends with the skill check. The plans are tables in text for now; a drawn map with pictures, and drawing a route into it, wait for a map component and a drawing task."}},{"id":"math.space.views","domain":"math","topic":"Orientierung","can":"Ich kann Ansichten von Gegenständen und Würfelgebäuden von vorne, von der Seite und von oben zuordnen.","standards":["kmk-mathe-2022.rf.1","kmk-mathe-2022.rf.2"],"set":{"title":"Ansichten von vorne, von der Seite und von oben","file":"twist/lessons/de-DE/klasse-3/math/views.yaml","lessons":[{"n":1,"title":"Von vorne, von der Seite, von oben","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Gebäude mit zwei Reihen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 matches things around us (Dose, Ball, Partyhut, Pyramide) to how they look from the front, the side and above, and does the same for cube buildings in one row: von vorne you see every tower, von oben only one square per tower, von rechts only the highest tower; lesson 2 takes buildings with two rows, where a higher tower behind looks over a lower one in front and the front row is on the left when you look from the right, matches a building to its views and a view to its building, and ends with the skill check. Walking round a real building waits for a turnable 3D view."}},{"id":"math.area-volume.area-unit-squares","domain":"math","topic":"Flächeninhalt und Umfang","can":"Ich kann den Flächeninhalt von Figuren auf Kästchenpapier bestimmen, auch durch Zerlegen und mit Malaufgaben bei Rechtecken.","standards":["kmk-mathe-2022.gm.5","kmk-mathe-2022.rf.7","nc-maths-2014.y4.measurement.3"],"set":{"title":"Flächeninhalt in Kästchen","file":"twist/lessons/de-DE/klasse-3/math/area-unit-squares.yaml","lessons":[{"n":1,"title":"Kästchen zählen und zerlegen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Rechtecke mit Malaufgaben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 finds the Flächeninhalt of figures on Karopapier by counting the Kästchen they cover, splits harder figures (L, T, U, a cross) into rectangles and adds the parts, and counts two half Kästchen as one. Lesson 2 finds the Flächeninhalt of a rectangle with a Malaufgabe (rows times Kästchen in a row, read from a filled rectangle or an outline), sees that different rectangles can have the same Flächeninhalt, splits figures into two rectangles, and ends with the skill check. Drawing a figure on the grid waits for a draw task."}},{"id":"math.data.plan-survey","domain":"math","topic":"Daten","can":"Ich kann eine einfache Umfrage planen, die Daten in einer Tabelle ordnen und das Ergebnis vorstellen.","standards":["kmk-mathe-2022.dz.1"],"set":{"title":"Eine Umfrage machen","file":"twist/lessons/de-DE/klasse-3/math/plan-survey.yaml","lessons":[{"n":1,"title":"Eine Umfrage planen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Auswerten und vorstellen","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Lesson 1 plans a class survey: a clear question that fits what you want to know, answers to choose from with \"etwas anderes\" for the rest, the right people to ask (the whole class, each child once, not only your friends), a Strichliste to collect the answers, and the steps in order. Lesson 2 counts the answers into a table, checks that the total matches the number of children asked, picks the Säulendiagramm that fits, says the result in a sentence that the data supports (9 von 24 Kindern, not \"alle Kinder\"), and ends with the skill check. Asking real classmates and drawing the chart by hand stay in the classroom."}},{"id":"math.data.read-charts","domain":"math","topic":"Daten","can":"Ich kann Diagramme mit größeren Zahlen und Skalen lesen, Werte vergleichen und daraus Schlüsse ziehen.","standards":["kmk-mathe-2022.dz.2","kmk-mathe-2022.dz.3","nc-maths-2014.y3.statistics.2","nc-maths-2014.y4.statistics.1","nc-maths-2014.y4.statistics.2"],"set":{"title":"Diagramme mit großen Zahlen lesen","file":"twist/lessons/de-DE/klasse-3/math/read-charts.yaml","lessons":[{"n":1,"title":"Skalen lesen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Vergleichen und Schlüsse ziehen","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Lesson 1 reads Säulendiagramme whose Skala goes in fives, tens, twenties, fifties and hundreds: first read the steps, then the number at the end of the bar (not the number of lines), and a bar that ends halfway between two lines (between 400 and 500: 450). Lesson 2 compares the values (how many more, together, doppelt so viele), orders them, decides which statements the chart supports and which it cannot tell (the chart shows that most came on Wednesday, not why), and ends with the skill check. Drawing a chart with a scale waits for a drawing task."}},{"id":"math.chance.compare-chances","domain":"math","topic":"Wahrscheinlichkeit","can":"Ich kann bei Würfel-, Münz- und Glücksradspielen die Chancen vergleichen und meine Vermutung mit Versuchen prüfen.","standards":["kmk-mathe-2022.dz.6"],"set":{"title":"Chancen vergleichen","file":"twist/lessons/de-DE/klasse-3/math/compare-chances.yaml","lessons":[{"n":1,"title":"Welche Chance ist größer?","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Vermuten und ausprobieren","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Lesson 1 compares chances by counting: the fields of a Glücksrad, the numbers on a Würfel that win (2, 4 und 6 sind gerade: 3 von 6), the two sides of a Münze; it also compares fields with the whole wheel (1 rotes von 2 Feldern beats 2 rote von 6 Feldern) and shows that a 6 is as likely as a 1. Lesson 2 makes a Vermutung and checks it with a Versuch in a Strichliste: which wheel fits a result, whether the result fits the guess, why a second Versuch comes out a little differently and why many Versuche tell more than a few. It ends with the skill check. Spinning or rolling in the app waits for an experiment task."}},{"id":"lit-de.nouns.endings","domain":"lit-de","topic":"Nomen","can":"Ich kann Nomen an den Endungen -ung, -heit, -keit und -nis erkennen und aus Verben und Adjektiven Nomen bilden (hoffen, die Hoffnung).","standards":["kmk-deutsch-2022.sp.9"],"set":{"title":"Nomen mit -ung, -heit, -keit und -nis","file":"twist/lessons/de-DE/klasse-3/lit-de/noun-endings.yaml","lessons":[{"n":1,"title":"-ung, -heit und -keit","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"-nis und Nomen im Satz","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":47,"summary":"Words ending in -ung, -heit, -keit and -nis are nouns, and so they are written with a capital. Lesson 1 makes nouns from verbs with -ung (wohnen, die Wohnung) and from adjectives with -heit and -keit (frei, die Freiheit; freundlich, die Freundlichkeit); lesson 2 adds -nis, finds such nouns in a sentence written all in small letters, and ends with the skill check."}},{"id":"lit-de.nouns.abstract","domain":"lit-de","topic":"Nomen","can":"Ich weiß, dass auch Dinge, die man nicht anfassen kann, Nomen sind (die Freude, das Glück).","standards":["kmk-deutsch-2022.sch.7","kmk-deutsch-2022.sp.13"],"set":{"title":"Nomen, die man nicht anfassen kann","file":"twist/lessons/de-DE/klasse-3/lit-de/abstract-nouns.yaml","lessons":[{"n":1,"title":"Die Artikelprobe","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Nomen im Satz finden","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Feelings, ideas and times are nouns too (die Freude, das Glück, der Mut), even though you cannot touch them. Lesson 1 sorts concrete and abstract nouns and uses the article test (can der, die or das go in front?); lesson 2 finds abstract nouns in sentences written all in small letters and ends with the skill check."}},{"id":"lit-de.verbs.present","domain":"lit-de","topic":"Zeitformen","can":"Ich kann die Gegenwart (Präsens) bilden, auch bei starken Verben, die den Selbstlaut ändern (ich gebe, du gibst).","standards":["kmk-deutsch-2022.sp.11"],"set":{"title":"Die Gegenwart","file":"twist/lessons/de-DE/klasse-3/lit-de/verbs-present.yaml","lessons":[{"n":1,"title":"Was jetzt passiert","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Verben, die ihren Selbstlaut ändern","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"The Präsens says what happens now or always. Lesson 1 recalls the endings (ich spiele, du spielst, er spielt) and names the Präsens; lesson 2 adds starke Verben whose vowel changes with du and er, sie, es (geben: du gibst, er gibt; fahren: du fährst, sie fährt; laufen: du läufst), while ich and wir keep the vowel, and ends with the skill check."}},{"id":"lit-de.verbs.simple-past","domain":"lit-de","topic":"Zeitformen","can":"Ich kann die Vergangenheit im Präteritum bilden, bei schwachen und starken Verben (spielte, ging).","standards":["kmk-deutsch-2022.sp.11"],"set":{"title":"Die Vergangenheit im Präteritum","file":"twist/lessons/de-DE/klasse-3/lit-de/verbs-simple-past.yaml","lessons":[{"n":1,"title":"Verben mit -te","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Starke Verben","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"The Präteritum tells what happened, mostly in written stories. Lesson 1 forms it for schwache Verben with -te (spielen, er spielte; malen, wir malten); lesson 2 adds starke Verben that change their vowel and take no -te (gehen, ging; sehen, sah; kommen, kam; finden, fand), and ends with the skill check."}},{"id":"lit-de.adjectives.opposites","domain":"lit-de","topic":"Adjektive","can":"Ich kann zu Adjektiven das Gegenteil finden (warm, kalt; laut, leise).","standards":["kmk-deutsch-2022.sp.10"],"set":{"title":"Gegenteile","file":"twist/lessons/de-DE/klasse-3/lit-de/adjectives-opposites.yaml","lessons":[{"n":1,"title":"heiß und kalt","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"freundlich und unfreundlich","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Adjectives come in pairs of opposites (heiß and kalt). Lesson 1 finds the opposite of an adjective; lesson 2 finds opposites made with un- (freundlich, unfreundlich), uses the opposite in a sentence and ends with the skill check."}},{"id":"lit-de.adjectives.compare","domain":"lit-de","topic":"Adjektive","can":"Ich kann mit Adjektiven vergleichen (groß, größer, am größten) und weiß, wann man so ... wie und als sagt.","standards":["kmk-deutsch-2022.sp.11"],"set":{"title":"Vergleichen mit Adjektiven","file":"twist/lessons/de-DE/klasse-3/lit-de/adjectives-compare.yaml","lessons":[{"n":1,"title":"groß, größer, am größten","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"größer als, so groß wie","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The three steps of comparison (groß, größer, am größten) and when to say \"so … wie\" and \"als\". Lesson 1 forms the steps, also with umlaut (alt, älter, am ältesten); lesson 2 uses \"als\" for different and \"so … wie\" for the same, and ends with the skill check."}},{"id":"lit-de.adjectives.suffixes","domain":"lit-de","topic":"Adjektive","can":"Ich kann Adjektive mit -ig, -lich, -isch und -bar bilden (Sonne, sonnig; Freund, freundlich).","standards":["kmk-deutsch-2022.sp.9"],"set":{"title":"Adjektive mit -ig, -lich, -isch und -bar","file":"twist/lessons/de-DE/klasse-3/lit-de/adjectives-suffixes.yaml","lessons":[{"n":1,"title":"sonnig und freundlich","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"kindisch und essbar","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"New adjectives are made from nouns and verbs with an ending (Sonne, sonnig; Freund, freundlich). Lesson 1 builds adjectives with -ig and -lich and checks the spelling by making the word longer (ruhig, ruhige); lesson 2 adds -isch and -bar and ends with the skill check."}},{"id":"lit-de.adjectives.compounds","domain":"lit-de","topic":"Adjektive","can":"Ich kann zusammengesetzte Adjektive bilden und verstehen (eiskalt, himmelblau, federleicht).","standards":["kmk-deutsch-2022.sp.9","kmk-deutsch-2022.sp.16"],"set":{"title":"Zusammengesetzte Adjektive","file":"twist/lessons/de-DE/klasse-3/lit-de/adjectives-compounds.yaml","lessons":[{"n":1,"title":"eiskalt und federleicht","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"hellblau und dunkelrot","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"A noun and an adjective make a stronger adjective (eiskalt is kalt wie Eis). Lesson 1 says what a compound adjective means and builds it from its two parts; lesson 2 adds colour words with hell- and dunkel-, writes them as one word in small letters and ends with the skill check."}},{"id":"lit-de.sentences.subject-predicate","domain":"lit-de","topic":"Satzglieder","can":"Ich kann in einem Satz das Prädikat und das Subjekt finden (Wer oder was tut etwas?).","standards":["kmk-deutsch-2022.sp.12","kmk-deutsch-2022.sp.11"],"set":{"title":"Subjekt und Prädikat","file":"twist/lessons/de-DE/klasse-3/lit-de/sentences-subject-predicate.yaml","lessons":[{"n":1,"title":"Wer oder was?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Das Subjekt steht nicht immer vorn","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Every sentence has a Prädikat (what someone does or what happens) and a Subjekt (who or what does it), found with the question \"Wer oder was?\". Lesson 1 finds both when the Subjekt comes first and may have several words; lesson 2 finds a Subjekt that stands later, a Prädikat in two parts (fängt … an, hat … gebacken), makes Subjekt and Prädikat agree, and ends with the skill check."}},{"id":"lit-de.sentences.move-parts","domain":"lit-de","topic":"Satzglieder","can":"Ich kann Satzglieder durch Umstellen finden und weiß, dass das Verb im Aussagesatz an zweiter Stelle bleibt.","standards":["kmk-deutsch-2022.sp.12","kmk-deutsch-2022.sp.11"],"set":{"title":"Satzglieder umstellen","file":"twist/lessons/de-DE/klasse-3/lit-de/sentences-move-parts.yaml","lessons":[{"n":1,"title":"Die Umstellprobe","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Satzglieder zählen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The Umstellprobe: words that move together are one Satzglied, and in a statement the verb stays in second place. Lesson 1 moves Satzglieder to the front and finds which words stay together; lesson 2 counts Satzglieder, spots sentences where the verb has left second place, and ends with the skill check."}},{"id":"lit-de.sentences.direct-speech","domain":"lit-de","topic":"Wörtliche Rede","can":"Ich kann wörtliche Rede mit Anführungszeichen schreiben, wenn der Begleitsatz vorne steht.","standards":["kmk-deutsch-2022.sch.8"],"set":{"title":"Wörtliche Rede","file":"twist/lessons/de-DE/klasse-3/lit-de/sentences-direct-speech.yaml","lessons":[{"n":1,"title":"Wer sagt was?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Anführungszeichen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Writing what someone says, with the Begleitsatz in front. Lesson 1 finds the wörtliche Rede and the Begleitsatz and sets the Doppelpunkt after the Begleitsatz; lesson 2 sets the Anführungszeichen (unten am Anfang, oben am Ende), puts the end mark of the spoken sentence inside them, and ends with the skill check."}},{"id":"lit-de.sentences.direct-speech-positions","domain":"lit-de","topic":"Wörtliche Rede","can":"Ich kann die Zeichen bei wörtlicher Rede setzen, wenn der Begleitsatz in der Mitte oder am Ende steht.","standards":["kmk-deutsch-2022.sch.8"],"set":{"title":"Der Begleitsatz hinten und in der Mitte","file":"twist/lessons/de-DE/klasse-3/lit-de/sentences-direct-speech-positions.yaml","lessons":[{"n":1,"title":"Der Begleitsatz hinten","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Der Begleitsatz in der Mitte","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Punctuating direct speech when the Begleitsatz comes after or inside the spoken words. Lesson 1 puts the Begleitsatz at the end („Ich komme mit“, sagt Lea.), where the Punkt of a statement is dropped, a question or exclamation keeps its mark, and a Komma always follows; lesson 2 puts the Begleitsatz in the middle („Morgen“, sagt Lea, „komme ich mit.“), and ends with the skill check."}},{"id":"lit-de.spelling.double-consonants","domain":"lit-de","topic":"Kurze und lange Selbstlaute","can":"Ich weiß, dass nach einem kurzen Selbstlaut oft ein doppelter Mitlaut steht, und schreibe Wörter wie Sonne, Ball, Mutter richtig.","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sch.5"],"set":{"title":"Doppelte Mitlaute","file":"twist/lessons/de-DE/klasse-3/lit-de/double-consonants.yaml","lessons":[{"n":1,"title":"Sonne, Teller, Ball","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wann wird verdoppelt?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"After a short Selbstlaut the one Mitlaut you hear is often written twice. Lesson 1 hears it in Sonne, Teller and Ball and sorts words with and without a double letter; lesson 2 learns when not to double (two different Mitlaute as in Kante and Hund, or a long Selbstlaut as in Hose), and ends with the skill check."}},{"id":"lit-de.spelling.s-sounds","domain":"lit-de","topic":"Besondere Laute","can":"Ich unterscheide s, ss und ß und schreibe sie richtig (Hose, Wasser, Straße).","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sch.5"],"set":{"title":"s, ss oder ß?","file":"twist/lessons/de-DE/klasse-3/lit-de/s-sounds.yaml","lessons":[{"n":1,"title":"Hose oder Wasser?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"ss oder ß?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Three ways to write an s sound. Lesson 1 tells the summende s (Hose, lesen) from the scharfe ss after a short Selbstlaut (Wasser, Kissen); lesson 2 adds ß after a long Selbstlaut or a Zwielaut (Fuß, gießen, beißen) against ss (Fluss, Nuss), and ends with the skill check."}},{"id":"lit-de.spelling.ck-tz","domain":"lit-de","topic":"Kurze und lange Selbstlaute","can":"Ich schreibe nach kurzem Selbstlaut ck statt kk und tz statt zz (Decke, Katze) und unterscheide k und ck, z und tz.","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sch.5"],"set":{"title":"ck und tz","file":"twist/lessons/de-DE/klasse-3/lit-de/ck-tz.yaml","lessons":[{"n":1,"title":"ck oder k?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"tz oder z?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"After a short Selbstlaut, k is written ck and z is written tz. Lesson 1 takes ck (Schnecke, Socke, Rock) against k after a Mitlaut or a long Selbstlaut (Wolke, Haken); lesson 2 takes tz (Katze, Mütze, Platz) against z (Kerze, Pilz, Brezel), and ends with the skill check."}},{"id":"lit-de.spelling.long-i","domain":"lit-de","topic":"Kurze und lange Selbstlaute","can":"Ich weiß, dass das lange i meistens ie geschrieben wird (Biene, Spiel), und kenne Ausnahmen (Tiger, Igel).","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sch.5"],"set":{"title":"Das lange i","file":"twist/lessons/de-DE/klasse-3/lit-de/long-i.yaml","lessons":[{"n":1,"title":"ie oder i?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Ausnahmen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"A long i is mostly written ie. Lesson 1 hears long and short i (Biene, Fisch) and writes ie or i; lesson 2 learns the exceptions with a plain i (Igel, Tiger, Kino, mir, dir, wir) and with ih (ihr, ihm, ihn), and ends with the skill check."}},{"id":"lit-de.spelling.syllable-division","domain":"lit-de","topic":"Silben und Trennung","can":"Ich kann Wörter nach Silben trennen und kenne die Trennungsregeln für doppelte Mitlaute, ck und tz.","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sp.17"],"set":{"title":"Wörter trennen","file":"twist/lessons/de-DE/klasse-3/lit-de/syllable-division.yaml","lessons":[{"n":1,"title":"Nach Silben trennen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Doppelte Mitlaute, ck und tz","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Splitting a word at the end of a line. Lesson 1 splits by syllables, keeps ch and sch together (Ku-chen, Ta-sche) and splits two Mitlaute in the middle (Kis-te); lesson 2 splits double Mitlaute (Son-ne), keeps ck together (Zu-cker) and splits tz (Kat-ze), and ends with the skill check."}},{"id":"lit-de.spelling.capital-advanced","domain":"lit-de","topic":"Groß- und Kleinschreibung","can":"Ich erkenne auch Nomen mit verstecktem Artikel und Wörter, die zu Nomen werden (beim Spielen, das Laufen), und schreibe Eigennamen und Zeitangaben richtig (am Montag, heute Abend).","standards":["kmk-deutsch-2022.sch.7"],"set":{"title":"Groß oder klein?","file":"twist/lessons/de-DE/klasse-3/lit-de/capital-advanced.yaml","lessons":[{"n":1,"title":"Das Lachen, beim Spielen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Namen und Zeitangaben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Capital letters beyond the plain Nomen. Lesson 1 takes Verben that become Nomen after das, beim, zum, vom or im (das Lachen, beim Spielen); lesson 2 takes Eigennamen (Lena, Berlin, der Rhein) and Zeitangaben (am Montag, heute Abend against montags, abends), and ends with the skill check."}},{"id":"lit-de.spelling-strategies.lengthen-double","domain":"lit-de","topic":"Rechtschreibstrategien","can":"Ich kann Verlängern auch für doppelte Mitlaute am Wortende nutzen und auf Verben und Adjektive anwenden (Ball, Bälle; er kommt, kommen).","standards":["kmk-deutsch-2022.sch.4"],"set":{"title":"Verlängern bei doppelten Mitlauten","file":"twist/lessons/de-DE/klasse-3/lit-de/lengthen-double.yaml","lessons":[{"n":1,"title":"Ball, Bälle","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Er kommt, kommen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"At the end of a word or before another letter, a double Mitlaut is hard to hear. Lesson 1 lengthens Nomen and Adjektive (Ball, Bälle; dünn, dünne) to hear it across two syllables; lesson 2 lengthens Verben (er kommt, kommen; sie rennt, rennen), and ends with the skill check."}},{"id":"lit-de.spelling-strategies.choose-strategy","domain":"lit-de","topic":"Rechtschreibstrategien","can":"Ich kann bei einem schwierigen Wort entscheiden, welche Strategie hilft (schwingen, verlängern, ableiten, merken), und das Wort so richtig schreiben.","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sch.9"],"set":{"title":"Welche Strategie hilft?","file":"twist/lessons/de-DE/klasse-3/lit-de/choose-strategy.yaml","lessons":[{"n":1,"title":"Vier Strategien","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Finden, wählen, schreiben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Choosing the spelling strategy that fits the tricky part of a word. Lesson 1 matches words to Schwingen, Verlängern, Ableiten or Merken (Tomate, Hund, Bäume, Vogel); lesson 2 finds the tricky part, picks the strategy and writes the letter, and ends with the skill check."}},{"id":"lit-de.letters.alphabet-order","domain":"lit-de","topic":"Das ABC","can":"Ich kann Wörter auch nach dem zweiten und dritten Buchstaben alphabetisch ordnen.","standards":["kmk-deutsch-2022.sch.10","kmk-deutsch-2022.sp.20"],"set":{"title":"Nach dem ABC ordnen","file":"twist/lessons/de-DE/klasse-3/lit-de/alphabet-order.yaml","lessons":[{"n":1,"title":"Erster und zweiter Buchstabe","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Auch der dritte Buchstabe","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Ordering words alphabetically, the step before using a Wörterbuch. Lesson 1 orders by the first and the second letter (Hase, Hose, Hund); lesson 2 orders by the third letter (Maler, Mantel, Maske) and puts a shorter word before a longer one that starts the same (Ball, Ballon), and ends with the skill check."}},{"id":"lit-de.spelling-strategies.dictionary","domain":"lit-de","topic":"Wörterbuch","can":"Ich kann ein Wort im Wörterbuch schnell finden, auch wenn ich es erst in die Grundform bringen muss.","standards":["kmk-deutsch-2022.sch.10","kmk-deutsch-2022.sp.20"],"set":{"title":"Im Wörterbuch nachschlagen","file":"twist/lessons/de-DE/klasse-3/lit-de/dictionary.yaml","lessons":[{"n":1,"title":"Schnell finden","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Grundform suchen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Finding a word in the Wörterbuch quickly. Lesson 1 finds the part of the book (vorne, in der Mitte, hinten) and uses the Leitwörter at the top of a page; lesson 2 turns a word into the form the Wörterbuch lists (Bäume to Baum, er lief to laufen, größer to groß), and ends with the skill check."}},{"id":"lit-de.spelling-strategies.correct-errors","domain":"lit-de","topic":"Fehler berichtigen","can":"Ich kann Fehler in meinem Text finden und mit einer passenden Strategie oder dem Wörterbuch berichtigen.","standards":["kmk-deutsch-2022.sch.9","kmk-deutsch-2022.sch.11","kmk-deutsch-2022.sch.10"],"set":{"title":"Fehler finden und berichtigen","file":"twist/lessons/de-DE/klasse-3/lit-de/correct-errors.yaml","lessons":[{"n":1,"title":"Wort für Wort lesen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zwei Fehler im Text","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Checking a text for spelling mistakes. Lesson 1 reads word by word, finds one wrong word in a sentence and names the strategy that fixes it; lesson 2 finds two mistakes in a short text, writes the right spelling and collects Fehlerwörter, and ends with the skill check."}},{"id":"lit-de.fluency.word-groups","domain":"lit-de","topic":"Blitzlesen","can":"Ich kann Wortgruppen auf einen Blick erfassen (auf dem Tisch, ein kleiner Hund).","standards":["kmk-deutsch-2022.les.4","kmk-deutsch-2022.les.6"],"set":{"title":"Wortgruppen blitzlesen","file":"twist/lessons/de-DE/klasse-3/lit-de/word-groups.yaml","lessons":[{"n":1,"title":"Auf einen Blick","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wortgruppen im Satz","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Taking in short phrases at a glance. Lesson 1 flashes a phrase for two seconds and the child picks what was written from phrases that differ in one small word; lesson 2 finds the word groups inside a sentence, reads a sentence in groups instead of word by word, and ends with the skill check."}},{"id":"lit-de.fluency.punctuation-reading","domain":"lit-de","topic":"Flüssig lesen","can":"Ich lese über das Zeilenende hinweg, beachte Punkt, Komma und Fragezeichen und lese einen Satz als Ganzes.","standards":["kmk-deutsch-2022.les.1","kmk-deutsch-2022.les.4"],"set":{"title":"Satzzeichen beim Lesen beachten","file":"twist/lessons/de-DE/klasse-3/lit-de/punctuation-reading.yaml","lessons":[{"n":1,"title":"Was die Zeichen sagen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Über das Zeilenende lesen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading a sentence as a whole. Lesson 1 notices Punkt, Komma, Fragezeichen and Ausrufezeichen and what the voice does at each one; lesson 2 reads on past the end of a line, finds where a sentence really ends, reads short sentences aloud for practice, and ends with the skill check."}},{"id":"lit-de.fluency.read-aloud","domain":"lit-de","topic":"Vorlesen","can":"Ich kann einen geübten Text betont und in passendem Tempo vorlesen.","standards":["kmk-deutsch-2022.les.5","kmk-deutsch-2022.les.6","kmk-deutsch-2022.tm.26","kmk-deutsch-2022.tm.29","kmk-deutsch-2022.sz.6"],"set":{"title":"Gut vorlesen","file":"twist/lessons/de-DE/klasse-3/lit-de/read-aloud.yaml","lessons":[{"n":1,"title":"Mit der Stimme malen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Einen Text vorbereiten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading a practised text aloud with expression and at a good pace. Lesson 1 chooses the voice that fits a sentence (laut, leise, fröhlich, traurig, ängstlich) and the word to stress; lesson 2 prepares a text for reading aloud step by step, picks a good pace and reads short passages aloud for practice, and ends with the skill check. The speak tasks run as the record-and-compare fallback and are never scored."}},{"id":"lit-de.comprehension.infer","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann Informationen aus verschiedenen Textstellen verknüpfen und Schlüsse ziehen, die nicht direkt im Text stehen.","standards":["kmk-deutsch-2022.les.11","kmk-deutsch-2022.tm.12"],"set":{"title":"Zwischen den Zeilen lesen","file":"twist/lessons/de-DE/klasse-3/lit-de/infer.yaml","lessons":[{"n":1,"title":"Hinweise sammeln","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Textstellen verbinden","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Drawing conclusions that a text does not state. Lesson 1 reads short texts and works out from clues what the text does not say (the weather, a place, a feeling); lesson 2 links two places in a text to answer a question, tells what stands in the text from what you can work out, and ends with the skill check. Every text is written for Twist."}},{"id":"lit-de.comprehension.notes","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann zu einem Sachtext Stichwörter notieren und den Inhalt damit wiedergeben.","standards":["kmk-deutsch-2022.les.13","kmk-deutsch-2022.les.14","kmk-deutsch-2022.tm.12"],"set":{"title":"Stichwörter notieren","file":"twist/lessons/de-DE/klasse-3/lit-de/notes.yaml","lessons":[{"n":1,"title":"Was schreibe ich auf?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Mit Notizen erzählen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Noting key points from an information text and retelling it from the notes. Lesson 1 finds the words worth noting in a sentence and tells a Stichwort from a whole sentence; lesson 2 fills a note sheet under headings, puts notes in order, retells a text from its notes, and ends with the skill check. The short Sachtexte about animals and plants are written for Twist and use well-established facts. Writing notes freely waits for a free text task type; here the child chooses and places notes."}},{"id":"lit-de.texts-media.fairy-tales","domain":"lit-de","topic":"Märchen","can":"Ich kann Märchen erkennen, typische Märchenmerkmale nennen (Es war einmal, Zauberei, Gut und Böse) und bekannte Märchen nacherzählen.","standards":["kmk-deutsch-2022.tm.4","kmk-deutsch-2022.tm.1"],"set":{"title":"Märchen erkennen und nacherzählen","file":"twist/lessons/de-DE/klasse-3/lit-de/fairy-tales.yaml","lessons":[{"n":1,"title":"Woran erkenne ich ein Märchen?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Märchen nacherzählen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"What makes a Märchen. Lesson 1 finds the typical features (Es war einmal, Zauberei, Gut und Böse, magic numbers, the happy ending) in a short Märchen written for Twist and tells a Märchen from other texts; lesson 2 retells well-known Märchen (Rotkäppchen, Hänsel und Gretel, Der Froschkönig) in the right order, in Twist's own words, and ends with the skill check. Telling a Märchen freely waits for a free text task type."}},{"id":"lit-de.texts-media.story-elements","domain":"lit-de","topic":"Geschichten und Gedichte","can":"Ich kann in Geschichten Figuren, Ort, Zeit und Handlung benennen und mit den Fachbegriffen beschreiben.","standards":["kmk-deutsch-2022.tm.17","kmk-deutsch-2022.tm.15","kmk-deutsch-2022.tm.14","kmk-deutsch-2022.sp.15"],"set":{"title":"Figuren, Ort, Zeit und Handlung","file":"twist/lessons/de-DE/klasse-3/lit-de/story-elements.yaml","lessons":[{"n":1,"title":"Wer, wo und wann?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Handlung","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Naming the parts of a story with the right terms. Lesson 1 finds the Hauptfigur and Nebenfiguren, the Ort and the Zeit in short stories; lesson 2 follows the Handlung through Einleitung, Hauptteil with its Höhepunkt, and Schluss, and ends with the skill check. All stories are written for Twist."}},{"id":"lit-de.texts-media.compare-texts","domain":"lit-de","topic":"Geschichten und Gedichte","can":"Ich kann zwei Fassungen einer Geschichte vergleichen, zum Beispiel ein Märchen als Buch und als Film.","standards":["kmk-deutsch-2022.tm.20"],"set":{"title":"Zwei Fassungen vergleichen","file":"twist/lessons/de-DE/klasse-3/lit-de/compare-texts.yaml","lessons":[{"n":1,"title":"Gleich oder anders?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Buch, Film und Hörspiel","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Comparing two versions of a story. Lesson 1 reads two short versions of the same Märchen, written for Twist, and finds what stays the same and what changes (Figuren, Ort, Ende); lesson 2 compares a story as a book, a film and a Hörspiel, says what each one can show, and ends with the skill check. Watching a real film clip waits for video in the bank; the film versions here are described in words."}},{"id":"lit-de.texts-media.digital-texts","domain":"lit-de","topic":"Medien","can":"Ich kann in digitalen Texten mit Links navigieren und Text, Bild und Ton zusammen verstehen.","standards":["kmk-deutsch-2022.les.10","kmk-deutsch-2022.tm.6","kmk-deutsch-2022.les.9"],"set":{"title":"Digitale Texte lesen","file":"twist/lessons/de-DE/klasse-3/lit-de/digital-texts.yaml","lessons":[{"n":1,"title":"Links folgen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Text, Bild und Ton","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Finding your way in a children's website. Lesson 1 reads a page from a made-up animal lexicon, shown as text with its links in square brackets, and chooses the link that leads to an answer (Startseite, Menü, Suche, Zurück); lesson 2 puts text, picture, video and sound together to answer a question and ends with the skill check. Tapping real links waits for a web page component; here the child chooses the link from options."}},{"id":"lit-de.texts-media.book-choice","domain":"lit-de","topic":"Bücher","can":"Ich kann ein Buch nach meinen Interessen auswählen, es kurz vorstellen und sagen, warum es mir gefällt.","standards":["kmk-deutsch-2022.tm.7","kmk-deutsch-2022.tm.28","kmk-deutsch-2022.tm.1"],"set":{"title":"Ein Buch auswählen und vorstellen","file":"twist/lessons/de-DE/klasse-3/lit-de/book-choice.yaml","lessons":[{"n":1,"title":"Welches Buch passt zu mir?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Mein Buch vorstellen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Choosing a book that suits you and presenting it. Lesson 1 uses the title, the Klappentext and the contents to pick a book for a reader's interests and tells a Sachbuch from a story; lesson 2 builds a short Buchvorstellung in the right order and gives a reason for liking a book, and ends with the skill check. All books are made up for Twist. Presenting a book aloud waits for a spoken, assessed task type."}},{"id":"lit-de.writing.stories","domain":"lit-de","topic":"Erzählen","can":"Ich kann Erlebnis- und Fantasiegeschichten schreiben, spannend erzählen und passende Wörter wählen.","standards":["kmk-deutsch-2022.sch.20","kmk-deutsch-2022.sch.23","kmk-deutsch-2022.sch.21"],"set":{"title":"Spannend erzählen","file":"twist/lessons/de-DE/klasse-3/lit-de/write-stories.yaml","lessons":[{"n":1,"title":"Aufbau und Spannung","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Treffende Wörter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The craft of writing a story, practised by choosing, ordering and filling gaps. Lesson 1 tells Erlebnis from Fantasie, builds a story in Einleitung, Hauptteil and Schluss and makes the Höhepunkt exciting; lesson 2 chooses precise verbs and adjectives, varies sentence beginnings, keeps the Präteritum, and ends with the skill check. Writing a whole story freely waits for the write_text task type."}},{"id":"lit-de.writing.prompt-stories","domain":"lit-de","topic":"Erzählen","can":"Ich kann eine Geschichte zu Reizwörtern schreiben oder eine Geschichte weiterschreiben und umschreiben.","standards":["kmk-deutsch-2022.sch.21","kmk-deutsch-2022.sch.20"],"set":{"title":"Reizwörter, weiterschreiben, umschreiben","file":"twist/lessons/de-DE/klasse-3/lit-de/prompt-stories.yaml","lessons":[{"n":1,"title":"Geschichten zu Reizwörtern","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Weiterschreiben und umschreiben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Writing a story from given words, or continuing and changing one, practised by choosing and ordering. Lesson 1 checks whether a story uses every Reizwort and makes the Reizwörter carry the plot; lesson 2 chooses a continuation that fits the beginning, rewrites an ending or a point of view, and ends with the skill check. Writing the story out freely waits for the write_text task type."}},{"id":"lit-de.writing.purpose","domain":"lit-de","topic":"Texte planen","can":"Ich kann klären, für wen und wozu ich schreibe, und die passende Textart wählen.","standards":["kmk-deutsch-2022.sch.14","kmk-deutsch-2022.sch.15","kmk-deutsch-2022.sch.19"],"set":{"title":"Für wen und wozu schreibe ich?","file":"twist/lessons/de-DE/klasse-3/lit-de/writing-purpose.yaml","lessons":[{"n":1,"title":"Leser und Zweck","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die passende Textart","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Deciding the reader and the purpose before writing, and choosing the kind of text that fits. Lesson 1 names who a text is for and what it should do (einladen, informieren, erklären, unterhalten, sich bedanken); lesson 2 matches a writing task to its Textart and fits the words to the reader (du or Sie, the right greeting), and ends with the skill check. Writing the text itself waits for the write_text task type."}},{"id":"lit-de.writing.revise-correctness","domain":"lit-de","topic":"Texte überarbeiten","can":"Ich kann einen Text auf Rechtschreibung und Grammatik prüfen und berichtigen, auch am Computer.","standards":["kmk-deutsch-2022.sch.11","kmk-deutsch-2022.sch.25","kmk-deutsch-2022.sch.27"],"set":{"title":"Texte auf Fehler prüfen","file":"twist/lessons/de-DE/klasse-3/lit-de/revise-correctness.yaml","lessons":[{"n":1,"title":"Mit der Checkliste prüfen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Am Computer prüfen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Checking a finished text for spelling, punctuation and grammar. Lesson 1 works through a checklist (capital at the start, capital nouns, a mark at the end, a verb that fits) on short sentences; lesson 2 checks on the computer, chooses the right suggestion of the spell checker, finds the mistakes it cannot see (real words in the wrong place, commas, Redezeichen), and ends with the skill check. Correcting a whole text of the child's own waits for a free text task type; here the child finds, chooses and fills."}},{"id":"lit-de.speaking.conversation-rules","domain":"lit-de","topic":"Gespräche führen","can":"Ich kenne Gesprächsregeln (zuhören, ausreden lassen, auf andere eingehen) und erkenne, wann sie in einem Gespräch eingehalten werden.","standards":["kmk-deutsch-2022.sz.13","kmk-deutsch-2022.sz.12","kmk-deutsch-2022.sz.17","kmk-deutsch-2022.sp.15"],"set":{"title":"Gesprächsregeln","file":"twist/lessons/de-DE/klasse-3/lit-de/conversation-rules.yaml","lessons":[{"n":1,"title":"Regeln für gute Gespräche","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Auf andere eingehen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The rules of a good conversation and how to spot them. Lesson 1 learns the rules (zuhören, ausreden lassen, nacheinander sprechen, freundlich bleiben) and finds the rule a speaker breaks in short scenes from class and the Klassenrat; lesson 2 responds to what others said (zustimmen, widersprechen, nachfragen, an eine Idee anknüpfen), tells a reply that responds from one that changes the topic, and ends with the skill check. The speak tasks run as the record-and-compare fallback and are never scored; every scene is written for Twist."}},{"id":"lit-de.speaking.argue","domain":"lit-de","topic":"Sprechen und Zuhören","can":"Ich kann meine Meinung sagen und mit einem Grund stützen, und ich kann jemanden höflich um etwas bitten.","standards":["kmk-deutsch-2022.sz.3","kmk-deutsch-2022.sz.14"],"set":{"title":"Meinung sagen und begründen","file":"twist/lessons/de-DE/klasse-3/lit-de/argue.yaml","lessons":[{"n":1,"title":"Ich finde …, weil …","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Höflich bitten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Saying what you think and why, and asking politely. Lesson 1 tells an opinion from its reason, finds the reason that really supports an opinion and builds sentences with Ich finde … , weil …; lesson 2 asks politely (bitte, könntest du, würden Sie), chooses du or Sie, adds a reason to a request, and ends with the skill check. The speak tasks run as the record-and-compare fallback and are never scored."}},{"id":"lit-de.speaking.record-voice","domain":"lit-de","topic":"Vor anderen sprechen","can":"Ich kann meine Stimme aufnehmen, mir zuhören und meine Aussprache, Lautstärke und mein Tempo verbessern.","standards":["kmk-deutsch-2022.sz.8","kmk-deutsch-2022.sz.6","kmk-deutsch-2022.sp.19"],"set":{"title":"Sich aufnehmen und besser sprechen","file":"twist/lessons/de-DE/klasse-3/lit-de/record-voice.yaml","lessons":[{"n":1,"title":"Laut, deutlich, nicht zu schnell","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Aufnehmen, anhören, verbessern","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Listening to your own voice and making it clearer. Lesson 1 learns three things to listen for (laut genug, deutlich, ein gutes Tempo with pauses at the full stop) and works out what a speaker should practise from what a recording sounds like; lesson 2 follows the steps aufnehmen, anhören, prüfen, verbessern, nochmal aufnehmen, chooses the next thing to work on, and ends with the skill check. Every lesson records the child's voice in speak tasks, which run as the record-and-compare fallback and are never scored; the check asks only what the child knows about it."}},{"id":"lit-de.handwriting.layout","domain":"lit-de","topic":"Texte gestalten","can":"Ich kann einen Text übersichtlich gestalten, mit Überschrift, Absätzen und Rand, mit der Hand und am Computer.","standards":["kmk-deutsch-2022.sch.3","kmk-deutsch-2022.sch.22"],"set":{"title":"Texte übersichtlich gestalten","file":"twist/lessons/de-DE/klasse-3/lit-de/text-layout.yaml","lessons":[{"n":1,"title":"Ein Text mit der Hand","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Ein Text am Computer","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Giving a text a clear shape, so a reader finds their way at a glance. Lesson 1 lays out a text by hand: a heading at the top (often in the middle or underlined with a ruler; classes differ, so only \"at the top\" is marked), a Rand left free on both sides, a new Absatz on a new line whenever something new begins, and a clean line through a mistake instead of scribbling; lesson 2 does the same on the computer: a bigger or bold heading set in the middle with a button, the Eingabetaste for a new Absatz instead of many spaces, one easy-to-read font, and ends with the skill check. The child judges and fixes layouts shown as text and described in words; the app does not draw a page yet."}},{"id":"lit-de.handwriting.keyboard","domain":"lit-de","topic":"Texte gestalten","can":"Ich kann kurze Texte auf der Tastatur schreiben, mit Großbuchstaben, Umlauten und Satzzeichen, und sie am Bildschirm verbessern.","standards":["kmk-deutsch-2022.sch.2","kmk-deutsch-2022.sch.27"],"set":{"title":"Schreiben auf der Tastatur","file":"twist/lessons/de-DE/klasse-3/lit-de/keyboard.yaml","lessons":[{"n":1,"title":"Buchstaben und Leertaste","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Satzzeichen und verbessern","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Typing a short text on a German keyboard and putting it right on the screen. Lesson 1 types words and sentences: the Umschalttaste for a capital, one press of the Leertaste between words, and the keys for ä, ö, ü and ß; lesson 2 adds the Satzzeichen (Punkt and Komma on their own keys, Fragezeichen and Ausrufezeichen with the Umschalttaste), corrects with the Rücktaste and the cursor, reads the red wavy line as a hint and not as the last word, and ends with the skill check. The child chooses keys, orders key presses and finds typing mistakes in short texts; a typing field in the app would let the child type for real."}}]},{"id":"klasse-4","label":"Klasse 4","skills":[{"id":"math.large-numbers.to-10000","domain":"math","topic":"Zahlen bis 10 000","can":"Ich kann Zahlen bis 10 000 bündeln, in die Stellentafel (T, H, Z, E) eintragen, lesen und schreiben.","standards":["kmk-mathe-2022.zo.1","kmk-mathe-2022.zo.2","nc-maths-2014.y4.number-number-and-place-value.4"],"set":{"title":"Zahlen bis 10 000","file":"twist/lessons/de-DE/klasse-4/math/numbers-to-10000.yaml","lessons":[{"n":1,"title":"Zehn Hunderter sind ein Tausender","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"T, H, Z und E","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":3,"title":"Große Zahlen lesen und schreiben","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":71,"summary":"The first lesson of Klasse 4 opens the Zehntausenderraum: ten hundreds make a thousand, as ten tens made a hundred. Lesson 1 bundles hundreds into thousands and counts in thousands; lesson 2 enters four-digit numbers in the Stellentafel (T, H, Z, E) and names the value of each digit; lesson 3 reads and writes them, also as number words, and ends with the skill check."}},{"id":"math.large-numbers.order-to-10000","domain":"math","topic":"Zahlen bis 10 000","can":"Ich kann Zahlen bis 10 000 am Zahlenstrahl finden, ordnen, vergleichen und auf Zehner, Hunderter und Tausender runden.","standards":["kmk-mathe-2022.zo.3","kmk-mathe-2022.zo.13","nc-maths-2014.y4.number-number-and-place-value.2","nc-maths-2014.y4.number-number-and-place-value.5","nc-maths-2014.y4.number-number-and-place-value.6","nc-maths-2014.y4.number-number-and-place-value.7"],"set":{"title":"Ordnen, vergleichen und runden bis 10 000","file":"twist/lessons/de-DE/klasse-4/math/order-to-10000.yaml","lessons":[{"n":1,"title":"Der Zahlenstrahl bis 10 000","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Vergleichen und ordnen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":3,"title":"Runden bis 10 000","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":71,"summary":"Numbers to 10 000 on the Zahlenstrahl, compared from the left and rounded. Lesson 1 finds and reads numbers on lines in thousands and in hundreds; lesson 2 compares and orders; lesson 3 rounds to tens, hundreds and thousands, and ends with the skill check."}},{"id":"math.large-numbers.to-million","domain":"math","topic":"Zahlen bis 1 000 000","can":"Ich kann Zahlen bis 1 000 000 in der Stellentafel darstellen, lesen und schreiben, mit Punkt als Gliederung (250.000).","standards":["kmk-mathe-2022.zo.1","kmk-mathe-2022.zo.2","nc-maths-2014.y5.number-number-and-place-value.1"],"set":{"title":"Zahlen bis 1 000 000","file":"twist/lessons/de-DE/klasse-4/math/numbers-to-million.yaml","lessons":[{"n":1,"title":"Zehntausender und Hunderttausender","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"HT, ZT, T, H, Z und E","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":3,"title":"Große Zahlen lesen und schreiben","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":71,"summary":"The Zahlenraum grows to a million: ten thousands make a Zehntausender, ten Zehntausender a Hunderttausender, ten Hunderttausender a million. Lesson 1 bundles and counts in Zehntausendern and Hunderttausendern; lesson 2 enters six-digit numbers in the Stellentafel (HT, ZT, T, H, Z, E), names the value of each digit and groups the digits in threes; lesson 3 reads and writes them, also as number words, and ends with the skill check."}},{"id":"math.large-numbers.order-to-million","domain":"math","topic":"Zahlen bis 1 000 000","can":"Ich kann Zahlen bis 1 000 000 am Zahlenstrahl finden, ordnen, vergleichen und sinnvoll runden.","standards":["kmk-mathe-2022.zo.3","kmk-mathe-2022.zo.13","nc-maths-2014.y5.number-number-and-place-value.1","nc-maths-2014.y5.number-number-and-place-value.4","nc-maths-2014.y5.number-number-and-place-value.5","nc-maths-2014.y6.number-number-and-place-value.2"],"set":{"title":"Ordnen, vergleichen und runden bis 1 000 000","file":"twist/lessons/de-DE/klasse-4/math/order-to-million.yaml","lessons":[{"n":1,"title":"Der Zahlenstrahl bis 1 000 000","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Vergleichen und ordnen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":3,"title":"Sinnvoll runden","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":68,"summary":"Numbers to a million on the Zahlenstrahl, compared from the left and rounded sensibly. Lesson 1 finds and reads numbers on the line to a million in Hunderttausendern and on a cut-out in Tausendern; lesson 2 compares and orders six-digit numbers; lesson 3 rounds to Tausender, Zehntausender and Hunderttausender and chooses a sensible rounding for real numbers, and ends with the skill check."}},{"id":"math.large-numbers.sequences","domain":"math","topic":"Zahlen bis 1 000 000","can":"Ich kann im Zahlenraum bis 1 000 000 in großen Schritten zählen und Zahlenfolgen fortsetzen.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y4.number-number-and-place-value.1","nc-maths-2014.y5.number-number-and-place-value.2"],"set":{"title":"Zahlenfolgen bis 1 000 000","file":"twist/lessons/de-DE/klasse-4/math/sequences-to-million.yaml","lessons":[{"n":1,"title":"In großen Schritten zählen","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Über die Grenze zählen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":3,"title":"Regeln finden und prüfen","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":64,"summary":"Counting in large steps (1000, 5000, 10 000, 25 000, 50 000, 100 000) and continuing sequences up to a million. Lesson 1 counts forwards and backwards in Tausendern, Zehntausendern and Hunderttausendern; lesson 2 counts across a Zehntausender, a Hunderttausender and up to a million and fills gaps; lesson 3 finds and checks the rule of a sequence, and ends with the skill check."}},{"id":"math.add-sub-to-1000.large-mental","domain":"math","topic":"Rechnen mit großen Zahlen","can":"Ich kann Aufgaben mit großen Zahlen im Kopf lösen, wenn sie zu bekannten Aufgaben passen (7000 + 5000, 250 000 − 50 000).","standards":["kmk-mathe-2022.zo.6","nc-maths-2014.y5.number-addition-and-subtraction.2","nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.4"],"set":{"title":"Große Zahlen im Kopf","file":"twist/lessons/de-DE/klasse-4/math/large-mental.yaml","lessons":[{"n":1,"title":"Mit Tausendern rechnen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zehntausender und Hunderttausender","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Mental addition and subtraction with large round numbers, helped by a small sum. Lesson 1 adds and subtracts whole thousands (7000 + 5000, 15 000 − 8000) using 7 + 5 and 15 − 8; lesson 2 does the same with ten-thousands and hundred-thousands (250 000 − 50 000, 340 000 + 60 000), and ends with the skill check. Typed answers are written without the space; numbers shown on screen keep it."}},{"id":"math.add-sub-to-1000.large-semi-written","domain":"math","topic":"Rechnen mit großen Zahlen","can":"Ich kann große Zahlen halbschriftlich addieren und subtrahieren und das Ergebnis vorher überschlagen.","standards":["kmk-mathe-2022.zo.7"],"set":{"title":"Große Zahlen halbschriftlich","file":"twist/lessons/de-DE/klasse-4/math/large-semi-written.yaml","lessons":[{"n":1,"title":"Überschlagen und schrittweise addieren","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Schrittweise subtrahieren und prüfen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Adding and subtracting four-digit numbers halbschriftlich, with an Überschlag first. Lesson 1 rounds both numbers to thousands for the Überschlag and adds schrittweise (4600 + 2350: first the thousands, then the hundreds, then the tens); lesson 2 subtracts schrittweise, compares the result with the Überschlag to catch mistakes, and ends with the skill check. Four-digit numbers are written without a space (4600), on screen and in typed answers."}},{"id":"math.written-add-sub.large","domain":"math","topic":"Rechnen mit großen Zahlen","can":"Ich kann im Zahlenraum bis 1 000 000 sicher schriftlich addieren und subtrahieren.","standards":["kmk-mathe-2022.zo.10","nc-maths-2014.y4.number-addition-and-subtraction.1","nc-maths-2014.y5.number-addition-and-subtraction.1"],"set":{"title":"Schriftlich rechnen mit großen Zahlen","file":"twist/lessons/de-DE/klasse-4/math/written-large.yaml","lessons":[{"n":1,"title":"Schriftlich addieren","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Schriftlich subtrahieren und die Probe","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Column addition and subtraction with five-digit numbers. Lesson 1 adds, with several Überträge and with numbers of different lengths written stellengerecht, and checks the size with an Überschlag; lesson 2 subtracts with Entbündeln, checks with the Probe (the result plus the number taken away gives the first number), and ends with the skill check. Typed answers are plain digits."}},{"id":"math.written-add-sub.choose-method","domain":"math","topic":"Rechnen mit großen Zahlen","can":"Ich kann entscheiden, ob ich eine Aufgabe im Kopf, halbschriftlich oder schriftlich rechne, und meine Wahl begründen.","standards":["kmk-mathe-2022.zo.8"],"set":{"title":"Im Kopf, halbschriftlich oder schriftlich?","file":"twist/lessons/de-DE/klasse-4/math/choose-method.yaml","lessons":[{"n":1,"title":"Welcher Weg passt?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Warum dieser Weg?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Choosing how to calculate and saying why. Lesson 1 sorts tasks into im Kopf (round numbers, 8000 + 5000), halbschriftlich (a few steps, 6280 + 3450) and schriftlich (many digits, many Überträge); lesson 2 gives the reason for a choice, spots a clever shortcut (29 999 + 1), and ends with the skill check. More than one way can be right; the tasks ask for the way that suits best and say why in the feedback."}},{"id":"math.mult-div-larger.large-mental","domain":"math","topic":"Rechnen mit großen Zahlen","can":"Ich kann mit Stufenzahlen im Kopf malnehmen und teilen (40 · 300, 36 000 : 9).","standards":["kmk-mathe-2022.zo.6","nc-maths-2014.y5.number-multiplication-and-division.5","nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.4"],"set":{"title":"Mit runden Zahlen malnehmen und teilen","file":"twist/lessons/de-DE/klasse-4/math/large-mult-mental.yaml","lessons":[{"n":1,"title":"Malnehmen mit runden Zahlen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Teilen mit runden Zahlen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Mental multiplication and division with round numbers, helped by a small times-table fact. Lesson 1 multiplies (3 · 400, 40 · 300) by using 3 · 4 and counting the zeros, including the trap 50 · 60 = 3000; lesson 2 divides (36 000 : 9, 2400 : 60) by using 36 : 9 and 240 : 6, and ends with the skill check. Typed answers are plain digits."}},{"id":"math.mult-div-larger.multi-digit-semi","domain":"math","topic":"Rechnen mit großen Zahlen","can":"Ich kann mehrstellige Zahlen halbschriftlich miteinander multiplizieren und vierstellige Zahlen schrittweise durch einstellige Zahlen und durch Zehnerzahlen teilen, wenn es aufgeht.","standards":["kmk-mathe-2022.zo.7"],"set":{"title":"Halbschriftlich malnehmen und teilen","file":"twist/lessons/de-DE/klasse-4/math/multi-digit-semi.yaml","lessons":[{"n":1,"title":"Zerlegen und malnehmen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"In Schritten teilen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Multiplying two two-digit numbers and dividing large numbers halbschriftlich. Lesson 1 splits one factor into tens and ones (23 · 45 = 20 · 45 + 3 · 45) and adds the parts; lesson 2 divides four-digit numbers by a one-digit number in steps (2568 : 4 = 2400 : 4 + 160 : 4 + 8 : 4) when it works out exactly, divides by full tens through the one-digit fact (840 : 20: first : 2, then : 10), checks with the Probe, and ends with the skill check. Divisors stay one-digit or full tens, as Klasse 4 Lehrpläne ask; division by other two-digit numbers is left out. Typed answers are plain digits."}},{"id":"math.written-mult-div.mult-one-digit","domain":"math","topic":"Schriftlich malnehmen","can":"Ich kann mehrstellige Zahlen schriftlich mit einer einstelligen Zahl multiplizieren und den Übertrag erklären.","standards":["kmk-mathe-2022.zo.10","nc-maths-2014.y4.number-multiplication-and-division.3"],"set":{"title":"Schriftlich malnehmen mit einer einstelligen Zahl","file":"twist/lessons/de-DE/klasse-4/math/written-mult-one.yaml","lessons":[{"n":1,"title":"Ohne Übertrag","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Mit Übertrag","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Multiplying a multi-digit number by a one-digit number in writing, starting with the ones. Lesson 1 multiplies without Übertrag (231 · 3) and checks the size with an Überschlag; lesson 2 carries the Übertrag to the next place (347 · 6 = 2082), finds the step where an Übertrag was forgotten, and ends with the skill check. Typed answers are plain digits."}},{"id":"math.written-mult-div.mult-multi-digit","domain":"math","topic":"Schriftlich malnehmen","can":"Ich kann schriftlich mit zwei- und mehrstelligen Zahlen multiplizieren und die Teilprodukte stellengerecht addieren.","standards":["kmk-mathe-2022.zo.10","nc-maths-2014.y5.number-multiplication-and-division.4","nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.1"],"set":{"title":"Schriftlich mit zweistelligen Zahlen malnehmen","file":"twist/lessons/de-DE/klasse-4/math/written-mult-multi.yaml","lessons":[{"n":1,"title":"Zweistellig mal zweistellig","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Dreistellig mal zweistellig","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Written multiplication with a two-digit second factor. Lesson 1 works out the two Teilprodukte (23 · 10 and 23 · 4), writes the first one shifted a place to the left and adds them stellengerecht; lesson 2 does the same with three-digit numbers and a Überschlag, and ends with the skill check."}},{"id":"math.written-mult-div.mult-money","domain":"math","topic":"Schriftlich malnehmen","can":"Ich kann Geldbeträge mit Komma schriftlich multiplizieren (3,45 € · 4).","standards":["kmk-mathe-2022.zo.10","kmk-mathe-2022.gm.10","nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.8"],"set":{"title":"Geldbeträge malnehmen","file":"twist/lessons/de-DE/klasse-4/math/written-mult-money.yaml","lessons":[{"n":1,"title":"In Cent rechnen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Einkaufen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Multiplying amounts in Euro with a decimal comma. Lesson 1 turns the amount into Cent, multiplies and turns the result back (3,45 € · 4 = 345 ct · 4 = 1380 ct = 13,80 €); lesson 2 uses this for shopping and checks with a Überschlag, and ends with the skill check."}},{"id":"math.written-mult-div.div-one-digit","domain":"math","topic":"Schriftlich teilen","can":"Ich kann mehrstellige Zahlen schriftlich durch eine einstellige Zahl teilen und jeden Schritt erklären.","standards":["nc-maths-2014.y5.number-multiplication-and-division.6"],"set":{"title":"Schriftlich teilen durch eine einstellige Zahl","file":"twist/lessons/de-DE/klasse-4/math/written-div-one.yaml","lessons":[{"n":1,"title":"Stelle für Stelle teilen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Mit Rest weiterrechnen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Dividing a three- or four-digit number by a one-digit number in writing, starting from the left. Lesson 1 divides place by place when every digit can be divided (846 : 2); lesson 2 brings the next digit down next to the remainder (864 : 4: 6 : 4 is 1 Rest 2, then 24 : 4), checks with the Probe, and ends with the skill check. All divisions come out exactly; typed answers are plain digits."}},{"id":"math.written-mult-div.div-remainder-zeros","domain":"math","topic":"Schriftlich teilen","can":"Ich kann schriftlich mit Rest teilen und Aufgaben lösen, bei denen im Ergebnis eine Null steht.","standards":["nc-maths-2014.y5.number-multiplication-and-division.6"],"set":{"title":"Schriftlich teilen mit Rest und Null","file":"twist/lessons/de-DE/klasse-4/math/written-div-remainder.yaml","lessons":[{"n":1,"title":"Der Rest wandert weiter","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Null im Ergebnis","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Written division that does not come out evenly at every step. Lesson 1 carries the Rest of one place to the next (857 : 4 = 214 Rest 1) and checks with the Probe; lesson 2 writes the Null when a place goes nullmal (624 : 3 = 208, not 28), and ends with the skill check."}},{"id":"math.written-mult-div.check","domain":"math","topic":"Schriftlich teilen","can":"Ich kann schriftliche Mal- und Geteiltaufgaben mit Überschlag und Umkehraufgabe prüfen.","standards":["kmk-mathe-2022.zo.11"],"set":{"title":"Malnehmen und Teilen prüfen","file":"twist/lessons/de-DE/klasse-4/math/written-mult-div-check.yaml","lessons":[{"n":1,"title":"Malaufgaben prüfen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Geteiltaufgaben prüfen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Checking written multiplication and division. Lesson 1 checks a multiplication with a Überschlag and with the Tauschaufgabe and spots a Teilprodukt that is not written stellengerecht (the one for the Zehner one place too far right); lesson 2 checks a division with the Umkehraufgabe (852 : 6 = 142, Probe 142 · 6 = 852) and spots a missing Null, and ends with the skill check."}},{"id":"math.word-problems.estimate-or-exact","domain":"math","topic":"Sachaufgaben","can":"Ich kann entscheiden, ob in einer Sachsituation ein Überschlag reicht oder ein genaues Ergebnis nötig ist.","standards":["kmk-mathe-2022.zo.13","kmk-mathe-2022.gm.9","nc-maths-2014.y5.number-addition-and-subtraction.3","nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.9"],"set":{"title":"Überschlag oder genau?","file":"twist/lessons/de-DE/klasse-4/math/estimate-or-exact.yaml","lessons":[{"n":1,"title":"Reicht ein Überschlag?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Sicher und knapp","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 decides from the situation whether an Überschlag is enough (Reicht das Geld? Passen alle in den Bus?) or an exact answer is needed (Rückgeld, Kassenbon, Medizin); lesson 2 makes the Überschlag safe by rounding up when something must be enough, and calculates exactly when the Überschlag lands close to the limit, then ends with the skill check."}},{"id":"math.word-problems.check-plausible","domain":"math","topic":"Sachaufgaben","can":"Ich kann prüfen, ob mein Ergebnis zur Sachsituation passt, und meine Lösung sonst verbessern.","standards":["kmk-mathe-2022.pk-modellieren.2","kmk-mathe-2022.pk-probleme.3","kmk-mathe-2022.gm.9","nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.9"],"set":{"title":"Kann das stimmen?","file":"twist/lessons/de-DE/klasse-4/math/check-plausible.yaml","lessons":[{"n":1,"title":"Passt das Ergebnis?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Lösungen verbessern","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 asks whether a result fits the situation: is the size possible, is the unit right, does a Rest need one more car or box, is the change more than the money paid? Lesson 2 finds the mistake in a wrong solution (plus instead of mal, a zero too many, the comma forgotten), puts it right, checks it with an Überschlag or the Umkehraufgabe and ends with the skill check."}},{"id":"math.word-problems.complex","domain":"math","topic":"Sachaufgaben","can":"Ich kann komplexe Sachaufgaben mit Informationen aus Texten, Tabellen und Bildern lösen, auch wenn es mehrere Lösungswege gibt.","standards":["kmk-mathe-2022.pk-modellieren.1","kmk-mathe-2022.pk-probleme.1","nc-maths-2014.y5.number-addition-and-subtraction.4","nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.7","nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.8"],"set":{"title":"Knifflige Sachaufgaben","file":"twist/lessons/de-DE/klasse-4/math/complex-problems.yaml","lessons":[{"n":1,"title":"Tabellen und Fahrpläne","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Diagramme und zwei Wege","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 solves problems from price lists and a bus timetable: find the facts the question needs, leave the others out, and compare ways (Familienkarte or single tickets); lesson 2 takes its facts from bar charts, solves the same problem in two ways ((60 + 45 + 75) · 2 € or 120 € + 90 € + 150 €) and ends with the skill check."}},{"id":"math.patterns.proportional","domain":"math","topic":"Zusammenhänge","can":"Ich kann Sachaufgaben mit proportionalen Zusammenhängen lösen, indem ich vom Bekannten auf eins und dann auf die gesuchte Menge schließe.","standards":["kmk-mathe-2022.msf.6","nc-maths-2014.y4.number-multiplication-and-division.4","nc-maths-2014.y5.number-multiplication-and-division.11"],"set":{"title":"Über eins rechnen","file":"twist/lessons/de-DE/klasse-4/math/proportional.yaml","lessons":[{"n":1,"title":"Vom Bekannten auf eins","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Rezepte und Wege","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 works from what is known to one and then to the amount asked for (3 Hefte kosten 6 €, 1 Heft kostet 2 €, 5 Hefte kosten 10 €); lesson 2 scales recipes and journeys by halving, doubling and adding up, compares two ways, notices where \"doppelt so viele, doppelt so viel\" does not hold (an egg takes as long as three) and ends with the skill check."}},{"id":"math.patterns.codes","domain":"math","topic":"Muster","can":"Ich kann Geheimschriften und Codes mit Zahlen entschlüsseln und eigene erfinden.","standards":["kmk-mathe-2022.msf.2"],"set":{"title":"Geheimschriften und Codes","file":"twist/lessons/de-DE/klasse-4/math/codes.yaml","lessons":[{"n":1,"title":"Der Zahlencode","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Codes mit Regeln","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 uses the Zahlencode A = 1 to Z = 26 to decode and encode words, one number for each letter; lesson 2 adds a rule (jede Zahl plus 3, jede Zahl verdoppelt), decodes by working the rule backwards, judges whether an invented code works (no two letters may share a number), cracks Zahlenschloss riddles and ends with the skill check."}},{"id":"math.length.notation","domain":"math","topic":"Längen","can":"Ich kann Längen in verschiedenen Schreibweisen angeben, auch mit Komma (2,5 km = 2500 m = 2 km 500 m).","standards":["kmk-mathe-2022.gm.7","nc-maths-2014.y4.measurement.1","nc-maths-2014.y5.measurement.1","nc-maths-2014.y6.measurement.1","nc-maths-2014.y6.measurement.2"],"set":{"title":"Längen mit Komma","file":"twist/lessons/de-DE/klasse-4/math/length-notation.yaml","lessons":[{"n":1,"title":"Meter, Zentimeter, Millimeter","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Kilometer und Meter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 writes metres and centimetres with a comma like euros and cent (1,25 m = 1 m 25 cm = 125 cm, 1,5 m = 150 cm) and centimetres and millimetres on a ruler (4,5 cm = 45 mm); lesson 2 does the same for kilometres, with three places after the comma (2,5 km = 2 km 500 m = 2500 m, 1,05 km = 1050 m), and ends with the skill check."}},{"id":"math.length.word-problems","domain":"math","topic":"Längen","can":"Ich kann Sachaufgaben mit Längen in verschiedenen Einheiten lösen und das Ergebnis auf Plausibilität prüfen.","standards":["kmk-mathe-2022.gm.9","kmk-mathe-2022.gm.10","nc-maths-2014.y5.measurement.7"],"set":{"title":"Sachaufgaben mit Längen","file":"twist/lessons/de-DE/klasse-4/math/length-word-problems.yaml","lessons":[{"n":1,"title":"Erst in eine Einheit","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"In Schritten rechnen und prüfen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 brings both lengths into one unit before calculating (1,20 m + 85 cm = 120 cm + 85 cm = 205 cm, 1,5 km + 700 m = 2200 m); lesson 2 solves stories in two steps (cut 6 pieces of 70 cm from 5 m), checks whether the result and its unit can be true (a Schulweg of 1200 km?) and ends with the skill check."}},{"id":"math.mass-capacity.calculate-mass","domain":"math","topic":"Gewichte","can":"Ich kann mit Gewichten rechnen, Gewichte in verschiedenen Schreibweisen angeben (1,5 kg = 1500 g) und Sachaufgaben dazu lösen.","standards":["kmk-mathe-2022.gm.7","kmk-mathe-2022.gm.10","nc-maths-2014.y5.measurement.1","nc-maths-2014.y6.measurement.2"],"set":{"title":"Mit Gewichten rechnen","file":"twist/lessons/de-DE/klasse-4/math/mass-calculate.yaml","lessons":[{"n":1,"title":"Gewichte mit Komma","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Sachaufgaben mit Gewichten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 writes masses in different ways, with three places after the comma for the gram (1,5 kg = 1 kg 500 g = 1500 g, 2,05 kg = 2050 g) and meets the Tonne (2,5 t = 2500 kg); lesson 2 adds, subtracts and multiplies masses in shopping, parcel and lift stories, always in one unit first, and ends with the skill check."}},{"id":"math.mass-capacity.l-ml","domain":"math","topic":"Rauminhalte","can":"Ich kann Hohlmaße in Liter und Milliliter angeben, an Messbechern ablesen und weiß, dass 1 l = 1000 ml sind.","standards":["kmk-mathe-2022.gm.2","kmk-mathe-2022.gm.6","nc-maths-2014.y2.measurement.1","nc-maths-2014.y3.measurement.1"],"set":{"title":"Liter und Milliliter","file":"twist/lessons/de-DE/klasse-4/math/capacity-l-ml.yaml","lessons":[{"n":1,"title":"Am Messbecher ablesen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Liter mit Komma","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 learns 1 l = 1000 ml, reads and marks amounts on a measuring jug scale in steps of 100 ml (a number line from 0 to 1000 ml stands in for the jug) and estimates what a glass, a bottle and a bucket hold; lesson 2 writes capacities with a comma (1,5 l = 1500 ml, 0,33 l = 330 ml), finds what is missing to 1 l and ends with the skill check."}},{"id":"math.mass-capacity.calculate-capacity","domain":"math","topic":"Rauminhalte","can":"Ich kann Rauminhalte schätzen, vergleichen und damit rechnen (Wie viele Gläser füllt eine 1-l-Flasche?).","standards":["kmk-mathe-2022.gm.1","kmk-mathe-2022.gm.8","kmk-mathe-2022.gm.10","nc-maths-2014.y5.measurement.5"],"set":{"title":"Mit Rauminhalten rechnen","file":"twist/lessons/de-DE/klasse-4/math/capacity-calculate.yaml","lessons":[{"n":1,"title":"Wie viele Gläser?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Sachaufgaben mit Litern","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 finds how many glasses a bottle fills (1 l : 200 ml = 1000 ml : 200 ml = 5), compares capacities in different units and estimates what a bath or a bucket holds; lesson 2 solves stories with litres: juice for a class party, water for showering and watering, what is left in the can, and ends with the skill check."}},{"id":"math.mass-capacity.data-units","domain":"math","topic":"Datenmengen","can":"Ich kann Datenmengen in Byte, Kilobyte und Megabyte vergleichen und einschätzen, was viel Speicher braucht.","standards":[],"set":{"title":"Datenmengen","file":"twist/lessons/de-DE/klasse-4/math/data-units.yaml","lessons":[{"n":1,"title":"Byte, Kilobyte, Megabyte","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Was braucht viel Speicher?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 meets Byte, Kilobyte and Megabyte (1 KB = 1000 Byte, 1 MB = 1000 KB, kilo means a thousand as in Kilogramm), changes between them and puts sizes in order; lesson 2 judges what needs a lot of storage (a message, a photo, a song, a video), works out how many photos or songs still fit and ends with the skill check. The lessons use the decimal steps of 1000 that phones and shops use."}},{"id":"math.fractions.everyday-measures","domain":"math","topic":"Brüche","can":"Ich kann Brüche aus dem Alltag bei Größen verstehen und in kleinere Einheiten umwandeln (½
