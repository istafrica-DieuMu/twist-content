 m = 50 cm, ¾ h = 45 min, ¼ l = 250 ml).","standards":["kmk-mathe-2022.gm.4"],"set":{"title":"Brüche bei Größen","file":"twist/lessons/de-DE/klasse-4/math/fractions-measures.yaml","lessons":[{"n":1,"title":"Stunden und Meter","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Liter und Kilogramm","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 turns halbe, Viertel- and Dreiviertelstunden into minutes and halbe, Viertel- and Dreiviertelmeter into centimetres: first the whole in the smaller unit (1 h = 60 min, 1 m = 100 cm), then divide by 4 for a quarter and take three of them for three quarters, with a pie and a bar as the model; lesson 2 does the same for Liter and Kilogramm (Viertelliter, Pfund, Dreiviertelkilo), adds anderthalb, and ends with the skill check. Each unit keeps its own whole, so ½ h is 30 min and not 50."}},{"id":"math.fractions.name-fractions","domain":"math","topic":"Brüche","can":"Ich kann einfache Brüche benennen, als Teil eines Ganzen oder einer Menge darstellen und Bild und Bruch zuordnen.","standards":["kmk-mathe-2022.gm.4","nc-maths-2014.y2.number-fractions.1"],"set":{"title":"Brüche benennen","file":"twist/lessons/de-DE/klasse-4/math/name-fractions.yaml","lessons":[{"n":1,"title":"Teile eines Ganzen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Teile einer Menge","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 names a fraction of a whole: a circle, bar or rectangle in equal parts, the Nenner counting all parts and the Zähler the coloured ones; it names Drittel, Fünftel, Sechstel, Achtel and Zehntel and shows that more parts make each part smaller (ein Achtel is less than ein Viertel). Lesson 2 names a fraction of a set (2 of 5 children, one of three equal rows of dots), matches picture, word and number, and ends with the skill check. Fractions are written 3/4 on screen and spoken as words; fraction options are not read aloud."}},{"id":"math.shapes.parallel-perpendicular","domain":"math","topic":"Geometrie","can":"Ich kann parallele und senkrechte Linien erkennen und mit dem Geodreieck zeichnen.","standards":["kmk-mathe-2022.rf.8","kmk-mathe-2022.pk-werkzeuge.4","nc-maths-2014.y3.geometry-properties-of-shapes.4"],"set":{"title":"Parallel und senkrecht","file":"twist/lessons/de-DE/klasse-4/math/parallel-perpendicular.yaml","lessons":[{"n":1,"title":"Parallel oder senkrecht zueinander","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Mit dem Geodreieck prüfen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 recognises parallele Linien (überall gleich weit entfernt, sie treffen sich nie) and Linien, die senkrecht zueinander sind (sie schneiden sich im rechten Winkel), in Zeichen, Buchstaben and things around us, also when they lie schräg; lesson 2 says how the Geodreieck checks both and finds parallel sides and right angles in Rechteck, Quadrat, Parallelogramm, Trapez, Dreieck and Sechseck, and ends with the skill check. Drawing parallels and perpendiculars with the Geodreieck waits for a drawing task."}},{"id":"math.shapes.circles-compass","domain":"math","topic":"Geometrie","can":"Ich kann mit dem Zirkel Kreise und Bögen zeichnen und Mittelpunkt und Radius benennen.","standards":["kmk-mathe-2022.pk-werkzeuge.4"],"set":{"title":"Kreise mit dem Zirkel","file":"twist/lessons/de-DE/klasse-4/math/circles-compass.yaml","lessons":[{"n":1,"title":"Mittelpunkt und Radius","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Mit dem Zirkel zeichnen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 names Mittelpunkt, Kreislinie and Radius (jeder Punkt der Kreislinie ist gleich weit vom Mittelpunkt entfernt) and finds that a circle is twice as wide as its radius; lesson 2 opens the Zirkel on the Lineal to the radius, draws circles and Kreisbögen in words, works with circles around one Mittelpunkt, and ends with the skill check. Drawing a circle with the compass waits for a drawing task."}},{"id":"math.shapes.grid-drawing","domain":"math","topic":"Geometrie","can":"Ich kann Figuren und Bauwerke in Gitter- und Punkteraster übertragen und zeichnen.","standards":["kmk-mathe-2022.rf.8"],"set":{"title":"Figuren im Gitter übertragen","file":"twist/lessons/de-DE/klasse-4/math/grid-drawing.yaml","lessons":[{"n":1,"title":"Figuren übertragen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Punkteraster, größer und kleiner","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 copies figures on Karopapier by counting Kästchen from a corner, counts slanted lines in two steps (3 nach rechts, 2 nach oben), picks the right copy and finds what is wrong with a copy; lesson 2 does the same on the Punkteraster (from point to point), draws a figure doppelt so groß and halb so groß by doubling or halving every side, slanted ones too, and ends with the skill check. Enlarging to other scales is left to math.shapes.scale; buildings on an isometric dot grid and drawing with the finger wait for a drawing task."}},{"id":"math.shapes.tessellations","domain":"math","topic":"Geometrie","can":"Ich kann Bandornamente und Parkettierungen fortsetzen, beschreiben und eigene erfinden.","standards":["kmk-mathe-2022.rf.11","kmk-mathe-2022.msf.2"],"set":{"title":"Bandornamente und Parkette","file":"twist/lessons/de-DE/klasse-4/math/tessellations.yaml","lessons":[{"n":1,"title":"Bandornamente","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Parkette ohne Lücken","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 continues Bandornamente from their Grundmuster, with shapes and with letters, and says whether the Grundmuster is verschoben or gespiegelt (b b b b, b d b d, b p b p); lesson 2 learns what a Parkett is (keine Lücken, nichts liegt übereinander), finds which shapes tile (Quadrat, Rechteck, Dreieck, Sechseck) and which do not (Kreis), counts the shapes that meet at a corner, and ends with the skill check. Inventing and drawing one's own frieze or tessellation waits for a drawing task."}},{"id":"math.shapes.scale","domain":"math","topic":"Geometrie","can":"Ich kann Figuren auf Gitterpapier maßstäblich vergrößern und verkleinern und einfache Maßstäbe auf Plänen nutzen.","standards":["kmk-mathe-2022.rf.9"],"set":{"title":"Vergrößern, verkleinern, Maßstab","file":"twist/lessons/de-DE/klasse-4/math/scale.yaml","lessons":[{"n":1,"title":"Doppelt so groß, halb so groß","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Der Maßstab auf Plänen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 enlarges and reduces rectangles and squares on Kästchenpapier by multiplying or dividing every side (2 und 3 Kästchen doppelt so groß: 4 und 6), shown as Punktefelder with one dot per Kästchen, against the mistake of adding the same number to every side; lesson 2 reads simple scales on plans (1 : 100, 1 cm sind 500 m), from plan to reality and back, and ends with the skill check. Drawing an enlarged figure on squared paper waits for a grid drawing task."}},{"id":"math.solids.complex-buildings","domain":"math","topic":"Körper","can":"Ich kann komplexere Bauwerke nach Plan bauen und Bauwerken ihre Ansichten und Schrägbilder zuordnen.","standards":["kmk-mathe-2022.rf.2","nc-maths-2014.y5.geometry-properties-of-shapes.1"],"set":{"title":"Große Würfelgebäude","file":"twist/lessons/de-DE/klasse-4/math/complex-buildings.yaml","lessons":[{"n":1,"title":"Baupläne und Schrägbilder","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Ansichten großer Gebäude","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads Baupläne with three rows and up to three columns, counts every cube from the plan (also the ones the Schrägbild hides), matches a Bauplan to its Schrägbild and back, where front and back or left and right are easily swapped, and works out how many cubes a Quader still needs; lesson 2 finds the view from the front, from the right and from above of these buildings straight from the plan (in each column, or in each row, the largest number), finds the building for a given view and ends with the skill check. Building with real cubes waits for a hands-on task."}},{"id":"math.space.mental-moves","domain":"math","topic":"Orientierung","can":"Ich kann mir vorstellen, wie eine Figur oder ein Würfel nach dem Drehen oder Kippen aussieht.","standards":["kmk-mathe-2022.rf.3"],"set":{"title":"Drehen und Kippen im Kopf","file":"twist/lessons/de-DE/klasse-4/math/mental-moves.yaml","lessons":[{"n":1,"title":"Figuren drehen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Den Würfel kippen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 turns letters, numbers and shapes in the head (eine halbe Drehung macht aus b ein q, aus 16 wird 91; eine Vierteldrehung stellt ein liegendes Rechteck hochkant) and tells a turn from a mirror image (b gespiegelt ist d); lesson 2 tips a Spielwürfel in the head, using that opposite faces make 7 and that tipping brings the face from the other side on top, and ends with the skill check. Turning a drawn shape by a quarter turn and choosing its picture waits for a drawn component that shows rotated figures and dice in an oblique view."}},{"id":"math.symmetry.several-axes","domain":"math","topic":"Symmetrie","can":"Ich kann Figuren mit mehreren Symmetrieachsen finden und Spiegelbilder auch an schrägen Achsen zeichnen.","standards":["kmk-mathe-2022.rf.10","nc-maths-2014.y4.geometry-properties-of-shapes.3"],"set":{"title":"Mehrere Symmetrieachsen","file":"twist/lessons/de-DE/klasse-4/math/several-axes.yaml","lessons":[{"n":1,"title":"Wie viele Achsen hat die Figur?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Buchstaben und schräge Achsen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 counts the Symmetrieachsen of flat shapes (Rechteck 2, Quadrat 4, gleichseitiges Dreieck 3, regelmäßiges Sechseck 6, Kreis unendlich viele) and shows that the line from corner to corner is an axis of the square but not of the rectangle; lesson 2 counts the axes of capital letters, sorts letters by their number of axes, mirrors an arrow at a schräge Achse in the head, and ends with the skill check. Drawing the mirror image at a diagonal axis waits for a grid drawing task."}},{"id":"math.symmetry.in-environment","domain":"math","topic":"Symmetrie","can":"Ich kann Symmetrie und Spiegelungen in meiner Umwelt, in Mustern und in Kunst erkennen und beschreiben.","standards":["kmk-mathe-2022.rf.11"],"set":{"title":"Symmetrie um uns herum","file":"twist/lessons/de-DE/klasse-4/math/symmetry-environment.yaml","lessons":[{"n":1,"title":"Symmetrie in Natur und Alltag","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Symmetrie in Schrift und Kunst","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 finds symmetry in nature and in things (Schmetterling, Tanne, Tisch von vorn; nicht die Tasse mit Henkel), in flags, and in reflections on water, where the Symmetrieachse is the waagerechtes Ufer; lesson 2 finds symmetry in words (OTTO und UHU senkrecht, KOCH und BOX waagerecht), Spiegelschrift on an ambulance, stars, snowflakes, Mandalas and Klecksbilder, and ends with the skill check. Taking photos of symmetry around the child or making a picture waits for a camera or drawing task."}},{"id":"math.area-volume.perimeter","domain":"math","topic":"Flächeninhalt und Umfang","can":"Ich kann den Umfang von Figuren messen und berechnen und Umfang und Flächeninhalt unterscheiden.","standards":["kmk-mathe-2022.rf.7","nc-maths-2014.y3.measurement.2","nc-maths-2014.y4.measurement.2","nc-maths-2014.y5.measurement.3"],"set":{"title":"Der Umfang","file":"twist/lessons/de-DE/klasse-4/math/perimeter.yaml","lessons":[{"n":1,"title":"Einmal ringsherum","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Umfang im Alltag","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 learns that the Umfang is the length of the edge all the way round and calculates it for rectangles, squares, triangles and figures of 1 cm Kästchen (4 cm und 3 cm: 4 + 3 + 4 + 3 = 14 cm), keeping it apart from the number of Kästchen; lesson 2 uses it in Sachaufgaben (Zaun, Rahmen, eine Runde um den Platz), works back from the Umfang to a side, decides whether a task asks for Umfang or Flächeninhalt, and ends with the skill check. Measuring the sides of a drawn figure with a ruler waits for a measuring task on a drawn figure."}},{"id":"math.area-volume.volume-cubes","domain":"math","topic":"Rauminhalt","can":"Ich kann den Rauminhalt von Würfelgebäuden und Quadern mit Einheitswürfeln bestimmen und vergleichen.","standards":["kmk-mathe-2022.gm.5","kmk-mathe-2022.rf.7","nc-maths-2014.y5.measurement.5"],"set":{"title":"Rauminhalt mit Würfeln","file":"twist/lessons/de-DE/klasse-4/math/volume-cubes.yaml","lessons":[{"n":1,"title":"Schicht für Schicht","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Würfelgebäude vergleichen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 measures the Rauminhalt of a Quader in Einheitswürfeln, layer by layer (eine Schicht 3 · 4 = 12 Würfel, zwei Schichten 24), with one layer shown from above as a Punktefeld and the hidden cubes inside counted too; lesson 2 counts Würfelgebäude from a Bauplan written as numbers, compares Rauminhalte (Turm und Reihe aus 6 Würfeln sind gleich groß), finds the cubes missing to complete a Quader, and ends with the skill check. Counting cubes from an oblique drawing of a building waits for a cube-building drawn component."}},{"id":"math.data.critical","domain":"math","topic":"Daten","can":"Ich kann erkennen, wenn ein Diagramm in die Irre führt, zum Beispiel durch eine abgeschnittene Achse, und es richtig deuten.","standards":["kmk-mathe-2022.dz.3"],"set":{"title":"Diagramme kritisch lesen","file":"twist/lessons/de-DE/klasse-4/math/data-critical.yaml","lessons":[{"n":1,"title":"Wo beginnt die Skala?","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Weitere Tricks erkennen","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Lesson 1 looks at charts whose Skala does not start at 0: the bars are drawn with a cut-off Skala (bar-chart `from`; Skala beginnt bei 90: 98 looks twice as long as 94), so the child checks where the Skala starts, reads the real numbers and works out the real difference, and compares with the honest Säulendiagramm from 0. Lesson 2 adds other tricks: steps of different sizes on the Skala, a Skala with no numbers, pictures drawn bigger, too few or the wrong people asked, and a claim that says more than the data; it ends with the skill check."}},{"id":"math.data.digital-tools","domain":"math","topic":"Daten","can":"Ich kann Daten mit einem digitalen Werkzeug in eine Tabelle eintragen und als Diagramm darstellen lassen.","standards":["kmk-mathe-2022.dz.2"],"set":{"title":"Tabellen und Diagramme am Computer","file":"twist/lessons/de-DE/klasse-4/math/digital-tools.yaml","lessons":[{"n":1,"title":"Daten in eine Tabelle eintragen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Ein Diagramm erstellen lassen","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Lesson 1 enters survey data in a Tabellenprogramm: columns have letters, rows have numbers, a cell is named column first (B3: Spalte B, Zeile 3); headings go in row 1, the answers in column A and the numbers in column B, one thing per cell, the number instead of the strokes, and the entries are checked against the Strichliste. Lesson 2 lets the program draw a Säulendiagramm: mark the cells with the data, choose the chart, give it a title, see that a changed number changes its bar and that a typing mistake (51 for 15) is drawn as well, because the program does not know it is wrong; it ends with the skill check. Tables are drawn as a spreadsheet (table with sheet); typing into a real Tabellenprogramm stays in the classroom."}},{"id":"math.chance.fair-games","domain":"math","topic":"Wahrscheinlichkeit","can":"Ich kann begründen, ob ein Spiel fair ist, indem ich die Möglichkeiten für jeden Spieler zähle.","standards":["kmk-mathe-2022.dz.6","kmk-mathe-2022.pk-argumentieren.3"],"set":{"title":"Ist das Spiel fair?","file":"twist/lessons/de-DE/klasse-4/math/fair-games.yaml","lessons":[{"n":1,"title":"Gleiche Chancen für alle","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Zwei Münzen, zwei Würfel","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Lesson 1 calls a game fair when every player has the same number of ways to win, counted on one Würfel or one Glücksrad (Anna 1, 2, 3 and Ben 4, 5, 6: 3 zu 3, fair; one colour each on a wheel with three red fields and one blue: not fair), and changes a rule to make a game fair. Lesson 2 counts the ways with two Münzen (KK, KZ, ZK, ZZ: mixed happens two ways) and two Würfel (Augensumme 7 six ways, 12 one way, 3 + 4 and 4 + 3 counted apart), decides and explains whether games with them are fair, and ends with the skill check. Playing the games in the app waits for an experiment task."}},{"id":"math.large-numbers.roman-numerals","domain":"math","topic":"Zahlen bis 1 000 000","can":"Ich kann römische Zahlen bis 100 lesen (I bis C), auch auf dem Zifferblatt, und ihr Prinzip mit unserem Stellenwertsystem vergleichen.","standards":["nc-maths-2014.y3.measurement.4","nc-maths-2014.y4.number-number-and-place-value.9"],"set":{"title":"Römische Zahlen","file":"twist/lessons/de-DE/klasse-4/math/roman-numerals.yaml","lessons":[{"n":1,"title":"I, V und X","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"L und C: bis 100","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads and writes römische Zahlzeichen to 20 with I, V and X: a smaller sign to the right of a bigger one adds, one to the left subtracts (IV, IX), and no sign stands more than three times in a row. Lesson 2 adds L and C, reads numbers to 100 in parts (tens, then ones), reads the hours on a clock face with Roman numerals, compares the Roman way with our Stellenwertsystem (an X is always ten, there is no zero) and ends with the skill check. The voice never reads a Roman numeral aloud, and Roman options are not read, so the child must read them."}},{"id":"math.large-numbers.binary","domain":"math","topic":"Zahlen bis 1 000 000","can":"Ich kann kleine Zahlen vom Zehnersystem ins Zweiersystem umwandeln und umgekehrt.","standards":[],"set":{"title":"Das Zweiersystem","file":"twist/lessons/de-DE/klasse-4/math/binary.yaml","lessons":[{"n":1,"title":"Dualzahlen lesen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zahlen ins Zweiersystem","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 sets the Zweiersystem beside our Zehnersystem: only the digits 0 and 1, and each place worth double the one to its right (Einser, Zweier, Vierer, Achter); it reads Dualzahlen up to four places as numbers, also as a row of lamps that are on (1) or off (0). Lesson 2 writes numbers to 31 in the Zweiersystem by taking the biggest place value that fits, writes a 0 for every place not needed, checks by working back, and ends with the skill check. Dualzahlen are spoken digit by digit (eins, null, eins) and never read as decimal numbers; options in binary are not read aloud."}},{"id":"math.written-mult-div.divisibility","domain":"math","topic":"Schriftlich teilen","can":"Ich kann mit Teilbarkeitsregeln prüfen, ob eine Zahl durch 2, 5, 10, 3 oder 9 teilbar ist.","standards":[],"set":{"title":"Teilbarkeitsregeln","file":"twist/lessons/de-DE/klasse-4/math/divisibility.yaml","lessons":[{"n":1,"title":"Teilbar durch 2, 5 und 10","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Teilbar durch 3 und 9","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Telling without dividing whether a number divides evenly. Lesson 1 reads the last digit for 2, 5 and 10; lesson 2 uses the Quersumme for 3 and 9 (234: 2 + 3 + 4 = 9), and ends with the skill check."}},{"id":"math.symmetry.point-symmetry","domain":"math","topic":"Symmetrie","can":"Ich kann punktsymmetrische Figuren erkennen, die bei einer halben Drehung gleich aussehen.","standards":[],"set":{"title":"Punktsymmetrie","file":"twist/lessons/de-DE/klasse-4/math/point-symmetry.yaml","lessons":[{"n":1,"title":"Gleich nach einer halben Drehung","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Punktsymmetrische Figuren","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 learns that a figure is punktsymmetrisch when it looks the same after a half turn about its centre, and checks letters, digits and short words (N, S, Z, H, X, 8, 69, SOS ja; A, T, M, 6 nein), keeping it apart from having a Symmetrieachse; lesson 2 checks shapes (Rechteck, Quadrat, Kreis, Sechseck, schiefes Parallelogramm ja; Dreieck nein), sorts letters, and ends with the skill check. Turning a drawn figure on screen to check waits for a rotate task."}},{"id":"lit-de.nouns.cases","domain":"lit-de","topic":"Die vier Fälle","can":"Ich kann mit Fragen (Wer oder was? Wessen? Wem? Wen oder was?) den Fall eines Nomens bestimmen und Nomen in die vier Fälle setzen.","standards":["kmk-deutsch-2022.sp.11","kmk-deutsch-2022.sp.13"],"set":{"title":"Die vier Fälle","file":"twist/lessons/de-DE/klasse-4/lit-de/noun-cases.yaml","lessons":[{"n":1,"title":"Wer oder was? Wen oder was?","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Wem?","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":3,"title":"Wessen? Und alle vier Fälle","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":68,"summary":"The case questions find the case of a noun: Wer oder was? (Nominativ), Wessen? (Genitiv), Wem? (Dativ), Wen oder was? (Akkusativ). Lesson 1 finds the Nominativ and the Akkusativ; lesson 2 adds the Dativ; lesson 3 adds the Genitiv, puts nouns into a given case and ends with the skill check. The article shows the case: der Hund, des Hundes, dem Hund, den Hund."}},{"id":"lit-de.verbs.perfect","domain":"lit-de","topic":"Zeitformen","can":"Ich kann das Perfekt mit haben und sein bilden (ich habe gespielt, ich bin gelaufen) und weiß, dass man es oft beim Erzählen sagt.","standards":["kmk-deutsch-2022.sp.11","kmk-deutsch-2022.sp.5"],"set":{"title":"Das Perfekt","file":"twist/lessons/de-DE/klasse-4/lit-de/verbs-perfect.yaml","lessons":[{"n":1,"title":"Perfekt mit haben","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Perfekt mit sein","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"The Perfekt is the past we use when we speak: Ich habe gespielt. It has two parts, haben or sein and the Partizip (gespielt, gegessen). Lesson 1 builds the Perfekt with haben, the Partizip with ge-...-t and ge-...-en, and the Satzklammer around the rest of the sentence; lesson 2 adds sein for verbs of moving and changing (ich bin gelaufen, er ist eingeschlafen), sets spoken Perfekt beside written Präteritum, and ends with the skill check. Verbs whose helper differs by region (sitzen, stehen, liegen) are left out."}},{"id":"lit-de.verbs.future","domain":"lit-de","topic":"Zeitformen","can":"Ich kann die Zukunft mit werden bilden (ich werde spielen).","standards":["kmk-deutsch-2022.sp.11"],"set":{"title":"Die Zukunft","file":"twist/lessons/de-DE/klasse-4/lit-de/verbs-future.yaml","lessons":[{"n":1,"title":"Futur mit werden","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Zukunft auch im Präsens","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"The Futur says what will happen: Ich werde spielen. Lesson 1 builds it from a form of werden and the Grundform at the end of the sentence (ich werde, du wirst, er wird, wir werden); lesson 2 shows that German often uses the Präsens with a time word for the future (Morgen fahre ich zu Oma.), finds sentences about the future, and ends with the skill check."}},{"id":"lit-de.verbs.tenses-mixed","domain":"lit-de","topic":"Zeitformen","can":"Ich kann die Zeitformen bestimmen und in einem Text die passende Zeitform durchhalten.","standards":["kmk-deutsch-2022.sp.11","kmk-deutsch-2022.sch.18"],"set":{"title":"Zeitformen bestimmen und durchhalten","file":"twist/lessons/de-DE/klasse-4/lit-de/verbs-tenses-mixed.yaml","lessons":[{"n":1,"title":"Welche Zeitform ist das?","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Eine Zeitform durchhalten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"The four Zeitformen side by side: Präsens, Präteritum, Perfekt and Futur. Lesson 1 names the Zeitform of a sentence by its verb parts (one word or two, werden or haben/sein); lesson 2 keeps one Zeitform through a short text, finds the verb that slips out of it and puts in the form that fits, and ends with the skill check."}},{"id":"lit-de.verbs.imperative","domain":"lit-de","topic":"Verben","can":"Ich kann Verben in der Aufforderungsform verwenden (Komm! Kommt! Lies!).","standards":["kmk-deutsch-2022.sp.11"],"set":{"title":"Die Aufforderungsform","file":"twist/lessons/de-DE/klasse-4/lit-de/verbs-imperative.yaml","lessons":[{"n":1,"title":"Komm! Lies! Räum auf!","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Kommt! Kommen Sie!","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Verbs in the imperative tell someone what to do (Komm! Kommt!). Lesson 1 forms the imperative for one person (komm, lauf), including the verbs that change e to i (lies, gib, nimm) and verbs whose front part moves to the end (Räum auf!); lesson 2 forms it for several people (kommt, lest) and for polite address (Kommen Sie!), sets the exclamation mark, and ends with the skill check."}},{"id":"lit-de.verbs.compound","domain":"lit-de","topic":"Verben","can":"Ich kann zusammengesetzte Verben bilden und weiß, dass sich ihre Vorsilbe im Satz abtrennen kann (einkaufen, ich kaufe ein).","standards":["kmk-deutsch-2022.sp.9","kmk-deutsch-2022.sp.12"],"set":{"title":"Zusammengesetzte Verben","file":"twist/lessons/de-DE/klasse-4/lit-de/verbs-compound.yaml","lessons":[{"n":1,"title":"Ich kaufe heute ein.","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"eingekauft und verkauft","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Verbs built from a front part and a verb (einkaufen, mitbringen, zurückgehen). Lesson 1 builds them and shows that the front part splits off to the end of the sentence (Ich kaufe heute ein.), unlike the Vorsilben ver-, be- and ent- (Ich verkaufe mein Rad.); lesson 2 forms the Perfekt with ge in the middle (eingekauft) and without ge for the fixed Vorsilben (verkauft), and ends with the skill check."}},{"id":"lit-de.sentences.objects","domain":"lit-de","topic":"Satzglieder","can":"Ich kann Dativobjekte (Wem?) und Akkusativobjekte (Wen oder was?) erfragen und bestimmen.","standards":["kmk-deutsch-2022.sp.12"],"set":{"title":"Akkusativobjekt und Dativobjekt","file":"twist/lessons/de-DE/klasse-4/lit-de/sentences-objects.yaml","lessons":[{"n":1,"title":"Wen oder was?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wem?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Objects are found with a question, like the Subjekt. Lesson 1 finds the Akkusativobjekt with \"Wen oder was?\" (Lea malt einen Baum.); lesson 2 finds the Dativobjekt with \"Wem?\" (Lea hilft ihrem Bruder.), tells the two apart in one sentence and ends with the skill check."}},{"id":"lit-de.sentences.place-time","domain":"lit-de","topic":"Satzglieder","can":"Ich kann Orts- und Zeitangaben erfragen und bestimmen (Wo? Wann? Wie lange?).","standards":["kmk-deutsch-2022.sp.12"],"set":{"title":"Orts- und Zeitangaben","file":"twist/lessons/de-DE/klasse-4/lit-de/sentences-place-time.yaml","lessons":[{"n":1,"title":"Wo? Wohin? Woher?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wann? Wie lange?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Satzglieder that say where and when something happens. Lesson 1 finds the Ortsangabe with \"Wo?\", \"Wohin?\" and \"Woher?\" (im Garten, in die Schule); lesson 2 finds the Zeitangabe with \"Wann?\" and \"Wie lange?\" (am Morgen, zwei Stunden), tells both apart in one sentence, and ends with the skill check."}},{"id":"lit-de.sentences.conjunctions","domain":"lit-de","topic":"Sätze verbinden","can":"Ich kann Sätze mit und, oder, aber, weil, dass und wenn verbinden und setze das Komma richtig.","standards":["kmk-deutsch-2022.sp.12","kmk-deutsch-2022.sch.18"],"set":{"title":"Sätze verbinden","file":"twist/lessons/de-DE/klasse-4/lit-de/sentences-conjunctions.yaml","lessons":[{"n":1,"title":"und, oder, aber","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"weil, dass, wenn","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Joining two sentences into one. Lesson 1 joins with und, oder and aber and sets the comma before aber; lesson 2 joins with weil, dass and wenn, where the verb moves to the end of that part and a comma always separates the two parts, and ends with the skill check."}},{"id":"lit-de.sentences.list-commas","domain":"lit-de","topic":"Zeichensetzung","can":"Ich setze bei Aufzählungen Kommas.","standards":["kmk-deutsch-2022.sch.8"],"set":{"title":"Kommas bei Aufzählungen","file":"twist/lessons/de-DE/klasse-4/lit-de/sentences-list-commas.yaml","lessons":[{"n":1,"title":"Äpfel, Birnen und Bananen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"ein großer, schwerer Koffer","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Commas between the items of a list. Lesson 1 sets commas between words in a list and none before und or oder (Äpfel, Birnen und Bananen); lesson 2 lists groups of words and adjectives (ein großer, schwerer Koffer), judges whether a sentence is written correctly, and ends with the skill check."}},{"id":"lit-de.spelling.ph-v-foreign","domain":"lit-de","topic":"Besondere Laute","can":"Ich schreibe Wörter mit ph und v richtig und kann häufige Fremdwörter schreiben (Delfin, Vulkan, Melone).","standards":["kmk-deutsch-2022.sch.6","kmk-deutsch-2022.sch.4"],"set":{"title":"Wörter mit v und ph","file":"twist/lessons/de-DE/klasse-4/lit-de/spelling-ph-v.yaml","lessons":[{"n":1,"title":"Vogel und Vase","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Alphabet und Delfin","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Words where you hear f or w but write v, and words with ph. Lesson 1 takes v as f (Vogel, viel, the prefixes ver- and vor-) and v as w in borrowed words (Vase, Vulkan, Klavier); lesson 2 takes ph (Alphabet, Strophe), words now written with f (Delfin, Telefon, Foto) and common borrowed words (Melone, Computer, Pizza), and ends with the skill check."}},{"id":"lit-de.spelling.similar-words","domain":"lit-de","topic":"Rechtschreibung üben","can":"Ich unterscheide gleich klingende Wörter mit verschiedener Schreibung und Bedeutung (Wal und Wahl, Lid und Lied).","standards":["kmk-deutsch-2022.sch.4"],"set":{"title":"Gleich klingende Wörter","file":"twist/lessons/de-DE/klasse-4/lit-de/spelling-similar-words.yaml","lessons":[{"n":1,"title":"Wal oder Wahl?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Rad oder Rat? seid oder seit?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Words that sound the same but are written differently and mean different things. Lesson 1 takes Wal and Wahl, Lid and Lied, Meer and mehr and decides by the meaning; lesson 2 takes Rad and Rat, seid and seit, Seite and Saite, uses a related word to find the spelling (Rad, Räder; Rat, raten), and ends with the skill check."}},{"id":"lit-de.spelling.das-dass","domain":"lit-de","topic":"Besondere Laute","can":"Ich kann das und dass unterscheiden und richtig schreiben.","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sch.5"],"set":{"title":"das oder dass?","file":"twist/lessons/de-DE/klasse-4/lit-de/spelling-das-dass.yaml","lessons":[{"n":1,"title":"das mit einem s","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"dass mit zwei s","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Telling das from dass with the Ersatzprobe. Lesson 1 shows das as a Begleiter (das Haus), standing alone (Das schmeckt lecker.) and as a word you can swap for welches (Das Bild, das ich male); when dieses, jenes or welches does not fit, it is dass, which a few tasks set as a contrast. Lesson 2 shows dass as a Bindewort after a comma that cannot be swapped (Ich weiß, dass du gern malst.), mixes both, and ends with the skill check."}},{"id":"lit-de.spelling-strategies.compare-spellings","domain":"lit-de","topic":"Fehler berichtigen","can":"Ich kann Schreibungen vergleichen und erklären, warum ein Wort so geschrieben wird (Raum und Saum, Hund und Hunde).","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sp.17","kmk-deutsch-2022.sp.18"],"set":{"title":"Schreibungen vergleichen und erklären","file":"twist/lessons/de-DE/klasse-4/lit-de/compare-spellings.yaml","lessons":[{"n":1,"title":"Warum schreibt man das so?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wer hat recht?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Comparing words to see why they are spelt the way they are. Lesson 1 compares a word with a related or rhyming word (Hund and Hunde, Rad and Räder, Baum and Traum) and picks the explanation; lesson 2 compares two children's spellings of one word, says who is right and why, sorts words by the strategy that explains them, and ends with the skill check."}},{"id":"lit-de.comprehension.strategies","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann vor dem Lesen Fragen an einen Text stellen, beim Lesen prüfen, ob ich alles verstehe, und danach das Wichtigste zusammenfassen.","standards":["kmk-deutsch-2022.les.12","kmk-deutsch-2022.les.13","kmk-deutsch-2022.les.14"],"set":{"title":"Lesestrategien","file":"twist/lessons/de-DE/klasse-4/lit-de/reading-strategies.yaml","lessons":[{"n":1,"title":"Vor dem Lesen und beim Lesen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Nach dem Lesen zusammenfassen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"A plan for reading a Sachtext: before, during and after. Lesson 1 asks questions from the title before reading and checks understanding while reading (read again, work out a word from the sentence, look it up); lesson 2 sums up the main points after reading, leaves out details, checks the questions from before, and ends with the skill check. Every text is written for Twist."}},{"id":"lit-de.comprehension.paragraphs","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann Absätze als Orientierung nutzen und jedem Absatz eine Teilüberschrift geben.","standards":["kmk-deutsch-2022.les.7"],"set":{"title":"Absätze und Teilüberschriften","file":"twist/lessons/de-DE/klasse-4/lit-de/paragraphs.yaml","lessons":[{"n":1,"title":"Worum geht es in jedem Absatz?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Teilüberschriften finden","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Using paragraphs to find one's way in a Sachtext. Lesson 1 counts paragraphs, says what each one is about and finds which paragraph answers a question; lesson 2 gives each paragraph a sub-heading that fits the whole paragraph, puts sub-headings in the order of the text, and ends with the skill check. Every text is written for Twist."}},{"id":"lit-de.comprehension.logic-puzzles","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann Logicals und Texte mit Zahlen und Angaben genau lesen und lösen.","standards":["kmk-deutsch-2022.les.11"],"set":{"title":"Logicals und genaues Lesen","file":"twist/lessons/de-DE/klasse-4/lit-de/logic-puzzles.yaml","lessons":[{"n":1,"title":"Hinweis für Hinweis","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zahlen und Angaben genau lesen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading closely where every word counts. Lesson 1 solves Logicals with three people and three things, starts from the clue that says something for sure, reads small words such as nicht, kein, neben and älter als, and checks a solution against every clue; lesson 2 reads short texts full of times, prices and rules, joins two facts to answer a question, solves Logicals with four people, and ends with the skill check. Every puzzle is written for Twist and has one solution."}},{"id":"lit-de.texts-media.fables-legends","domain":"lit-de","topic":"Märchen","can":"Ich kann Fabeln und Sagen erkennen, die Lehre einer Fabel herausfinden und sie von Märchen unterscheiden.","standards":["kmk-deutsch-2022.tm.4","kmk-deutsch-2022.tm.19"],"set":{"title":"Fabeln und Sagen","file":"twist/lessons/de-DE/klasse-4/lit-de/fables-legends.yaml","lessons":[{"n":1,"title":"Tiere, die wie Menschen handeln","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Sagen und echte Orte","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Fables, legends and how they differ from fairy tales. Lesson 1 reads short fables in which animals talk and act like people, names the animals' typical traits and finds the moral; lesson 2 reads legends tied to real places (Hameln, the Loreley, the Mäuseturm in Bingen), says what a legend explains, sorts fairy tale, fable and legend, and ends with the skill check. Most fables are written for Twist in the classic style; two traditional ones (the two frogs in the milk, the wolf and the lamb) and the well-known legends are retold in our own words."}},{"id":"lit-de.texts-media.character-perspective","domain":"lit-de","topic":"Geschichten und Gedichte","can":"Ich kann mich in eine Figur hineinversetzen, sagen, was sie denkt und fühlt, und meine Meinung mit einer Textstelle begründen.","standards":["kmk-deutsch-2022.tm.16","kmk-deutsch-2022.tm.18","kmk-deutsch-2022.tm.19"],"set":{"title":"Sich in Figuren hineinversetzen","file":"twist/lessons/de-DE/klasse-4/lit-de/character-perspective.yaml","lessons":[{"n":1,"title":"Was fühlt und denkt die Figur?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Aus einer anderen Sicht","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading what characters feel and think. Lesson 1 works out a feeling from what a character does (holding on tight, looking at their shoes), finds the line that shows it and says what the character might be thinking; lesson 2 tells a moment from another character's point of view, backs up an opinion with a line from the text (opinion, line, explanation), and ends with the skill check. Every story is written for Twist."}},{"id":"lit-de.texts-media.recite","domain":"lit-de","topic":"Vortragen","can":"Ich kann ein kurzes Gedicht auswendig lernen und betont vortragen.","standards":["kmk-deutsch-2022.tm.27","kmk-deutsch-2022.tm.29","kmk-deutsch-2022.sz.6"],"set":{"title":"Gedichte auswendig lernen und vortragen","file":"twist/lessons/de-DE/klasse-4/lit-de/recite-poems.yaml","lessons":[{"n":1,"title":"Strophe für Strophe","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Betont vortragen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Learning a short poem by heart and saying it with expression. Lesson 1 learns a poem stanza by stanza and line by line, uses the rhyme words to recall the next line, fills gaps and puts lines in order; lesson 2 picks the word to stress, matches the voice to the mood (quiet, cheerful, calm), sorts good and poor ways of reciting, and ends with the skill check. Speak tasks let the child say lines aloud and compare with the model; they are practice only. Every poem is written for Twist."}},{"id":"lit-de.texts-media.research","domain":"lit-de","topic":"Medien","can":"Ich kann Informationen zu einer Frage in Kinderlexika und auf Kinderseiten im Internet suchen und prüfen, ob sie verlässlich sind.","standards":["kmk-deutsch-2022.tm.9","kmk-deutsch-2022.tm.10"],"set":{"title":"Informationen suchen und prüfen","file":"twist/lessons/de-DE/klasse-4/lit-de/research.yaml","lessons":[{"n":1,"title":"Richtig suchen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Stimmt das wirklich?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Looking up an answer to a question and checking whether it can be trusted. Lesson 1 turns a question into search words, finds the entry in a children's encyclopedia by its first letter, picks the search result that fits and puts the research steps in order; lesson 2 checks whether a page is reliable (who made it, advertising, a second source), spots the source that is wrong, notes the answer with its source, and ends with the skill check. Search results are shown as text lists; the child does not use a live browser."}},{"id":"lit-de.texts-media.media-use","domain":"lit-de","topic":"Medien","can":"Ich kann über meine Erfahrungen mit Hörspielen, Videos, Spielen und Apps sprechen und kritisch darüber nachdenken.","standards":["kmk-deutsch-2022.tm.23","kmk-deutsch-2022.tm.24","kmk-deutsch-2022.tm.5","kmk-deutsch-2022.tm.11"],"set":{"title":"Medien bewusst nutzen","file":"twist/lessons/de-DE/klasse-4/lit-de/media-use.yaml","lessons":[{"n":1,"title":"Was wollen Medien von mir?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Klug mit Medien umgehen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Thinking about the media children use every day: audio stories, videos, games and apps. Lesson 1 asks what a medium wants (informieren, unterhalten, verkaufen) and finds advertising, also where it hides: an Anzeige at the top of a search, a product praised in a video. Lesson 2 reads the Altersfreigabe, sees that a free game can still cost money, keeps personal data private, checks a chain message before passing it on, and says what helps when a video was frightening or screen time ran long; it ends with the skill check. All pages, videos and messages are described in text and written for Twist."}},{"id":"lit-de.texts-media.make-media","domain":"lit-de","topic":"Medien","can":"Ich kann mit einem digitalen Werkzeug ein kleines eigenes Medienprodukt gestalten, zum Beispiel eine Hörgeschichte oder eine Präsentation.","standards":["kmk-deutsch-2022.tm.25","kmk-deutsch-2022.sz.8"],"set":{"title":"Medienbeiträge gestalten","file":"twist/lessons/de-DE/klasse-4/lit-de/make-media.yaml","lessons":[{"n":1,"title":"Präsentation und Plakat","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Eine Hörgeschichte planen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Planning a small media product of your own. The app cannot judge a real slideshow or recording, so the lessons teach and check what goes into a good one. Lesson 1 plans a Präsentation and a Plakat: the steps in order, Stichwörter instead of whole sentences on a Folie, one topic per Folie, large writing and a clear Überschrift, and pictures you may use with their Quelle. Lesson 2 plans a Hörgeschichte: Erzähler, Figuren, Geräusche and Musik, how to make a sound at home, a Drehbuch in order, recording tips and asking before you record or photograph someone; it ends with the skill check. Hearing real sound effects waits for effect sounds in the bank; here they are described in words."}},{"id":"lit-de.writing.feelings","domain":"lit-de","topic":"Erzählen","can":"Ich kann Gefühle und Gedanken in Worte fassen und in einem Text ausdrücken.","standards":["kmk-deutsch-2022.sch.20"],"set":{"title":"Gefühle und Gedanken erzählen","file":"twist/lessons/de-DE/klasse-4/lit-de/write-feelings.yaml","lessons":[{"n":1,"title":"Gefühle zeigen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Was die Figur denkt","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Putting a character's feelings and thoughts into a story. Lesson 1 chooses precise feeling words (enttäuscht, erleichtert, stolz) and shows a feeling through the body instead of only naming it; lesson 2 writes what a character thinks (dachte, fragte sich, überlegte), lets a feeling change from the start of a story to its end, and ends with the skill check. Writing a whole story freely waits for a free text task type; here the child chooses, sorts and fills. Every scene is written for Twist."}},{"id":"lit-de.writing.report","domain":"lit-de","topic":"Berichten","can":"Ich kann einen sachlichen Bericht schreiben, der die W-Fragen beantwortet (Wer? Was? Wann? Wo? Wie? Warum?).","standards":["kmk-deutsch-2022.sch.20","kmk-deutsch-2022.sch.18"],"set":{"title":"Einen Bericht schreiben","file":"twist/lessons/de-DE/klasse-4/lit-de/report.yaml","lessons":[{"n":1,"title":"Die W-Fragen beantworten","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Sachlich im Präteritum","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The knowledge behind a factual report. Lesson 1 answers the W-Fragen (Wer? Was? Wann? Wo? Wie? Warum?), finds the W-Frage a report leaves open and puts events in the order they happened; lesson 2 keeps a report sachlich (no feelings, no suspense, no opinion), writes it in the Präteritum, tells a report from a story, and ends with the skill check. Writing a whole report freely waits for a free text task type; here the child sorts, orders, chooses and fills. Every event is written for Twist."}},{"id":"lit-de.writing.opinion","domain":"lit-de","topic":"Berichten","can":"Ich kann meine Meinung schriftlich begründen, zum Beispiel in einem Buchtipp oder in einem Brief mit einer Bitte.","standards":["kmk-deutsch-2022.sch.20","kmk-deutsch-2022.sch.19"],"set":{"title":"Meinung schriftlich begründen","file":"twist/lessons/de-DE/klasse-4/lit-de/opinion.yaml","lessons":[{"n":1,"title":"Meinung und Argumente","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Ein Brief mit einer Bitte","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The knowledge behind an opinion text. Lesson 1 builds a Buchtipp and a short Meinungstext (Meinung, Argumente mit Beispiel, Schluss), tells a real argument from a sentence that is not one, and links arguments with denn, außerdem and deshalb; lesson 2 writes a letter with a request to the head teacher or the mayor (Anrede, Bitte, Argumente, Gruß), chooses the argument that convinces this reader, and ends with the skill check. Writing a whole letter freely waits for a free text task type; here the child sorts, orders, chooses and fills. Every letter and book is written for Twist."}},{"id":"lit-de.speaking.short-talk","domain":"lit-de","topic":"Vor anderen sprechen","can":"Ich kann mit einem Stichwortzettel einen kurzen Vortrag zu einem Thema vorbereiten und halten.","standards":["kmk-deutsch-2022.sz.19","kmk-deutsch-2022.sz.4","kmk-deutsch-2022.sz.21","kmk-deutsch-2022.sz.6"],"set":{"title":"Einen Kurzvortrag halten","file":"twist/lessons/de-DE/klasse-4/lit-de/short-talk.yaml","lessons":[{"n":1,"title":"Den Vortrag vorbereiten","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Den Vortrag halten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Preparing and giving a short talk from a cue card. Lesson 1 plans a talk (Einleitung, Hauptteil, Schluss), writes Stichwörter instead of whole sentences on the Stichwortzettel and leaves out notes that do not fit the topic; lesson 2 gives the talk (Blickkontakt, frei sprechen, ein Bild zeigen, Fragen beantworten), turns a Stichwort back into a spoken sentence, gives fair feedback, and ends with the skill check. The talks about the honeybee and the red fox use well-established facts and are written for Twist. The speak tasks run as the record-and-compare fallback and are never scored."}},{"id":"lit-de.speaking.interview","domain":"lit-de","topic":"Gespräche führen","can":"Ich kann Fragen für ein Interview vorbereiten und die Antworten festhalten.","standards":["kmk-deutsch-2022.sz.16","kmk-deutsch-2022.sz.17"],"set":{"title":"Ein Interview führen","file":"twist/lessons/de-DE/klasse-4/lit-de/interview.yaml","lessons":[{"n":1,"title":"Gute Fragen vorbereiten","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Nachfragen und notieren","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Planning an interview and noting the answers. Lesson 1 prepares questions: open W-Fragen instead of Ja-Nein-Fragen, questions that fit the goal of the interview, and a polite start and end; lesson 2 holds the interview with a baker, follows up with a Nachfrage, notes the answers as Stichwörter, and ends with the skill check. The people and answers are written for Twist. The speak tasks run as the record-and-compare fallback and are never scored."}},{"id":"lit-de.vocabulary.idioms","domain":"lit-de","topic":"Sprache untersuchen","can":"Ich kann Redewendungen verstehen und erklären (jemandem einen Bären aufbinden).","standards":["kmk-deutsch-2022.sp.10","kmk-deutsch-2022.sp.16"],"set":{"title":"Redewendungen und Sprichwörter","file":"twist/lessons/de-DE/klasse-4/lit-de/idioms.yaml","lessons":[{"n":1,"title":"Was ist gemeint?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Sprichwörter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Sayings that mean more than their words. Lesson 1 takes Redewendungen (Tomaten auf den Augen haben, jemandem einen Bären aufbinden, Schwein haben, auf dem Schlauch stehen), sets the literal picture against what is meant, and matches each to its meaning; lesson 2 adds Sprichwörter (Übung macht den Meister, Lügen haben kurze Beine), tells a Sprichwort from a Redewendung, picks the saying that fits a scene, and ends with the skill check. All scenes are written for Twist."}},{"id":"lit-de.vocabulary.foreign-words","domain":"lit-de","topic":"Sprache untersuchen","can":"Ich kann Fremdwörter im Deutschen erkennen und herausfinden, woher sie kommen und was sie bedeuten.","standards":["kmk-deutsch-2022.sch.6","kmk-deutsch-2022.sp.8"],"set":{"title":"Fremdwörter","file":"twist/lessons/de-DE/klasse-4/lit-de/foreign-words.yaml","lessons":[{"n":1,"title":"Woher kommen die Wörter?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Was bedeutet das Fremdwort?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Words German took from other languages. Lesson 1 spots Fremdwörter in a sentence, sorts them by the language they come from (Englisch, Französisch, Italienisch), learns that they are often not spoken as they are written and so must be learnt as Merkwörter, and meets Lehnwörter that came so long ago that they look German (Fenster, Mauer). Lesson 2 finds the meaning of a Fremdwort from the sentence, swaps in a German word, reads the Herkunftsangabe in a dictionary entry, and ends with the skill check."}},{"id":"lit-de.vocabulary.spoken-written","domain":"lit-de","topic":"Sprache untersuchen","can":"Ich kann Unterschiede zwischen gesprochener und geschriebener Sprache beschreiben und Alltagssprache in Standardsprache umformulieren.","standards":["kmk-deutsch-2022.sp.5","kmk-deutsch-2022.sp.6","kmk-deutsch-2022.sz.1"],"set":{"title":"Gesprochene und geschriebene Sprache","file":"twist/lessons/de-DE/klasse-4/lit-de/spoken-written.yaml","lessons":[{"n":1,"title":"Sprechen und Schreiben","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Umgangssprache und Standardsprache","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"How we speak and how we write. Lesson 1 sets spoken German against written German: short forms (hab, is, nich, 'ne), filler words (äh, halt, also), unfinished sentences and the Perfekt in speech, full sentences and the Präteritum in a written story. Lesson 2 rewrites Umgangssprache in Standardsprache (super krass, voll müde, Kumpel), decides where each fits (with a friend, in a letter to the Bürgermeisterin, in a school report), meets a few words from Dialekte, and ends with the skill check."}},{"id":"lit-de.vocabulary.languages","domain":"lit-de","topic":"Sprache untersuchen","can":"Ich kann Wörter in verschiedenen Sprachen und Dialekten vergleichen und Gemeinsamkeiten und Unterschiede entdecken.","standards":["kmk-deutsch-2022.sp.7","kmk-deutsch-2022.sp.8"],"set":{"title":"Sprachen und Dialekte vergleichen","file":"twist/lessons/de-DE/klasse-4/lit-de/languages.yaml","lessons":[{"n":1,"title":"Wörter aus vielen Sprachen","acts":["learn","practise","check"],"tasks":21},{"n":2,"title":"Dialekte in Deutschland","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"Comparing German with other languages children may speak at home or in class, and with its own Dialekte. Lesson 1 finds words that sound alike across languages (Nacht, night, notte, noche; Haus, house), greets in Englisch, Türkisch, Polnisch, Italienisch and Spanisch, and notices what works differently (the for der, die and das in English, no such article in Turkish, capital nouns only in German, Arabic written from right to left). Lesson 2 takes Dialekte: Brötchen as Semmel, Schrippe, Rundstück or Weckle, Moin and Servus, Sonnabend and Samstag, and ends with the skill check. Every word is shown in Latin letters; hearing the other languages waits for voices in those languages."}},{"id":"lit-de.vocabulary.language-effect","domain":"lit-de","topic":"Sprache untersuchen","can":"Ich kann untersuchen, wie dieselbe Sache freundlich, unhöflich, sachlich oder werbend gesagt werden kann und wie das wirkt.","standards":["kmk-deutsch-2022.sp.1","kmk-deutsch-2022.sp.2","kmk-deutsch-2022.sp.3"],"set":{"title":"Wie Sprache wirkt","file":"twist/lessons/de-DE/klasse-4/lit-de/language-effect.yaml","lessons":[{"n":1,"title":"Freundlich oder verletzend?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Sachlich, werbend, überzeugend","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The same thing can be said in different ways, and each way works differently on the listener. Lesson 1 sets a polite request against a command, sorts friendly from rude and hurtful sentences, asks how the other person feels, and turns a reproach into an Ich-Botschaft. Lesson 2 sets sachlich against werbend, finds the words that advertise (super, am besten, nur heute), learns that a reason convinces more than shouting, and ends with the skill check."}},{"id":"lit-de.vocabulary.digital-communication","domain":"lit-de","topic":"Sprache untersuchen","can":"Ich kann beschreiben, wie Menschen in Nachrichten, Chats und Videoanrufen miteinander sprechen, und welche Regeln dort gelten.","standards":["kmk-deutsch-2022.sp.4","kmk-deutsch-2022.sz.8"],"set":{"title":"Chats, Nachrichten und Videoanrufe","file":"twist/lessons/de-DE/klasse-4/lit-de/digital-communication.yaml","lessons":[{"n":1,"title":"So schreiben wir im Chat","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Regeln im Netz","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"How people talk in messages, chats and video calls, and the rules that hold there. Lesson 1 looks at chat language: short and close to speech, Abkürzungen (LG, vllt, kA), Emojis that show a feeling, and messages that are easy to misread because the reader cannot hear your voice; it sets a chat with friends against a message to the teacher. Lesson 2 takes the Netiquette: Großbuchstaben read as shouting, think before you send, no photos of others without asking, nobody shut out or insulted, telling an adult, and taking turns in a video call; it ends with the skill check. All chats are written for Twist; each emoji is also described in the spoken text."}},{"id":"lit-de.texts-media.ballads","domain":"lit-de","topic":"Märchen","can":"Ich kann eine Ballade als Gedicht erkennen, das eine spannende Geschichte erzählt.","standards":[],"set":{"title":"Balladen","file":"twist/lessons/de-DE/klasse-4/lit-de/ballads.yaml","lessons":[{"n":1,"title":"Gedichte, die Geschichten erzählen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Herr von Ribbeck","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"A Ballade is a poem that tells an exciting story. Lesson 1 reads two short ballads written for Twist (Jan und das Lamm, Grete im Leuchtturm), tells a ballad from a poem without a story and from a story without Verse, finds who speaks, the Höhepunkt and the order of events. Lesson 2 reads Theodor Fontane's \"Herr von Ribbeck auf Ribbeck im Havelland\" (first and last two Strophen quoted, the middle retold), translates its Plattdeutsch lines, says why Ribbeck takes a pear into his grave, looks at the first Strophe of Goethe's \"Erlkönig\", and ends with the skill check. Fontane is quoted word for word from the Cotta edition of 1905 and Goethe from Goethes Werke (Bertelsmann), as on Wikisource, in their original spelling (Thurme, faßt)."}}]},{"id":"stufe-0","label":"Stufe 0","skills":[{"id":"fl.listening.classroom-phrases","domain":"fl","topic":"Hören","can":"Ich verstehe einfache Aufforderungen in der Fremdsprache und reagiere mit einer Handlung (Stand up! Open your book!).","standards":["kmk-fremdsprachen-gs-2013.hoeren","nc-languages-2014.ks2.foreign-language.1"],"set":{"title":"Was sollst du tun?","file":"twist/lessons/de-DE/stufe-0/fl/en-classroom-phrases.yaml","lessons":[{"n":1,"title":"Aufstehen, hinsetzen","acts":["learn","practise","check"],"tasks":20},{"n":2,"title":"Klatschen, springen, winken","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":44,"summary":"The very first English lessons. Children hear short classroom instructions (Stand up! Listen! Clap your hands!) and show they understand by tapping the child who does it. Stufe 0 is oral only: instructions to the child are spoken in German, the English is heard, never read. Lesson 1 brings four instructions, lesson 2 six more, and ends with the skill check over all ten."}},{"id":"fl.listening.familiar-words","domain":"fl","topic":"Hören","can":"Ich erkenne bekannte Wörter, wenn ich sie höre, und zeige auf das passende Bild.","standards":["kmk-fremdsprachen-gs-2013.hoeren","kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Wörter, die ich kenne","file":"twist/lessons/de-DE/stufe-0/fl/en-familiar-words.yaml","lessons":[{"n":1,"title":"Das klingt wie Deutsch","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Zeig auf das Bild","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":45,"summary":"Children hear English words and tap the matching picture. The first words sound almost like German ones (ball, Ball; mouse, Maus; house, Haus), so children can understand English from the very start. Lesson 1 brings six such words, lesson 2 eight more and the classroom instruction Point to the ... ! and ends with the skill check. Oral only: nothing is read."}},{"id":"fl.themes.hello","domain":"fl","topic":"Hallo","can":"Ich kann mich begrüßen, vorstellen und verabschieden und kenne Höflichkeitswörter (please, thank you, sorry).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel","kmk-fremdsprachen-gs-2013.sprechen"],"set":{"title":"Hallo und Tschüss auf Englisch","file":"twist/lessons/de-DE/stufe-0/fl/en-hello.yaml","lessons":[{"n":1,"title":"Hello und goodbye","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"My name is …","acts":["learn","practise","check"],"tasks":20}],"tasks":38,"summary":"Greeting, saying your name and saying goodbye, with please and thank you. Stufe 0 is oral only: instructions are spoken in German, the phrases in English. Lesson 1 brings hello, hi, goodbye, bye and good morning; lesson 2 adds My name is … and What's your name?, please and thank you, and ends with the skill check."}},{"id":"fl.themes.colours","domain":"fl","topic":"Farben","can":"Ich kenne die Farben und kann sagen, welche Farbe etwas hat und welche Farbe ich mag.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Farben auf Englisch","file":"twist/lessons/de-DE/stufe-0/fl/en-colours.yaml","lessons":[{"n":1,"title":"Red, blue, yellow, green","acts":["learn","practise","check"],"tasks":20},{"n":2,"title":"Orange, purple, pink, brown","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":44,"summary":"Eight colours, heard and said before they are ever read. Stufe 0 is oral only: every task can be done without reading. Instructions are spoken in German, the colour words in English. Lesson 1 brings red, blue, yellow and green; lesson 2 adds orange, purple, pink and brown and ends with the skill check. Practice runs in three stages: full hints, one hint, no hints, and the last stage puts the colours on things. Each lesson also pairs colours with things that have them (matching) and sorts pictures by colour (sorting); tapping a colour says its English name."}},{"id":"fl.themes.numbers-to-10","domain":"fl","topic":"Zahlen","can":"Ich kann bis 10 zählen und Anzahlen bis 10 nennen.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Zahlen bis 10 auf Englisch","file":"twist/lessons/de-DE/stufe-0/fl/en-numbers-to-10.yaml","lessons":[{"n":1,"title":"One, two, three, four, five","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Six, seven, eight, nine, ten","acts":["learn","practise","check"],"tasks":20}],"tasks":38,"summary":"The numbers one to ten in English, heard and said before they are read. Stufe 0 is oral only: instructions are spoken in German, the numbers in English. Lesson 1 brings one to five with dice dots; lesson 2 adds six to ten, counts things, and ends with the skill check."}},{"id":"fl.listening.songs-rhymes","domain":"fl","topic":"Hören","can":"Ich verstehe Lieder, Reime und Chants mit Hilfe von Bildern und Bewegungen und singe oder spreche mit.","standards":["kmk-fremdsprachen-gs-2013.hoeren","kmk-fremdsprachen-gs-2013.sprechen","nc-languages-2014.ks2.foreign-language.1","nc-languages-2014.ks2.foreign-language.2","nc-languages-2014.ks2.foreign-language.8"],"set":{"title":"Reime und Mitmachverse","file":"twist/lessons/de-DE/stufe-0/fl/en-songs-rhymes.yaml","lessons":[{"n":1,"title":"Clap your hands","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"A cat in a hat","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":43,"summary":"Two short chants written for Twist. Lesson 1 is an action chant (Clap, clap, clap your hands, jump, jump, jump up high, stand up, sit down, wave and say goodbye!): children hear a line and tap the movement that goes with it, then say what comes next. Lesson 2 is a rhyme chant (A cat in a hat, a bee in a tree, a mouse in a house, and a goat in a boat!): children find where each animal is, finish a line with the rhyming word and speak along, and it ends with the skill check. Oral only: nothing is read."}},{"id":"fl.speaking.imitate","domain":"fl","topic":"Sprechen","can":"Ich kann Wörter und kurze Sätze in der Fremdsprache deutlich nachsprechen und achte dabei auf Aussprache und Betonung.","standards":["kmk-fremdsprachen-gs-2013.sprechen","kmk-fremdsprachen-gs-2013.sprachliche-mittel","nc-languages-2014.ks2.foreign-language.5"],"set":{"title":"Gut zuhören, genau nachsprechen","file":"twist/lessons/de-DE/stufe-0/fl/en-imitate.yaml","lessons":[{"n":1,"title":"Three, thank you","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Whale, water, red","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children hear an English word or a short sentence and say it back, with attention to three sounds German does not have in the same way. Lesson 1 is th: the tongue sits between the teeth (three, thank you, mouth), heard against the German-sounding t and s (tree, mouse). Lesson 2 is w with round lips (whale, water, web), heard against v (van), and the soft English r (red, rabbit, rose); it ends with the skill check. Speaking is practised, not marked: the skill check asks the child to hear the sounds apart, which comes before saying them well. Oral only: nothing is read."}},{"id":"fl.speaking.greet","domain":"fl","topic":"Sprechen","can":"Ich kann jemanden begrüßen und verabschieden, meinen Namen und mein Alter sagen und fragen, wie es jemandem geht.","standards":["kmk-fremdsprachen-gs-2013.sprechen"],"set":{"title":"Hallo, wie geht's?","file":"twist/lessons/de-DE/stufe-0/fl/en-greet.yaml","lessons":[{"n":1,"title":"How are you?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"I'm Mia. I'm seven.","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children greet someone and keep the conversation going. Lesson 1 asks How are you? and answers I'm fine, thank you, I'm OK or I'm sad, then asks back with And you? Lesson 2 adds I'm Mia for the name, How old are you? and I'm seven, puts a whole greeting together from hello to goodbye, and ends with the skill check. Hello, goodbye, please and thank you come from the Hello lessons and are used here in short exchanges. Speaking is practised and not marked; the checks ask whether a reply fits. Oral only: nothing is read."}},{"id":"fl.themes.body","domain":"fl","topic":"Körper","can":"Ich kann Körperteile benennen und auf Anweisungen mit Bewegungen reagieren (Touch your nose!).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel","kmk-fremdsprachen-gs-2013.hoeren"],"set":{"title":"Mein Körper auf Englisch","file":"twist/lessons/de-DE/stufe-0/fl/en-body.yaml","lessons":[{"n":1,"title":"Head, eye, ear, nose, mouth","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Touch your nose!","acts":["learn","practise","check"],"tasks":20}],"tasks":38,"summary":"Body parts in English and simple commands with them (Touch your nose!). Stufe 0 is oral only: instructions are spoken in German, the words and commands in English. Lesson 1 brings head, eye, ear, nose and mouth; lesson 2 adds hand, arm, leg and foot, follows \"Touch your …!\", and ends with the skill check."}},{"id":"fl.themes.family","domain":"fl","topic":"Familie","can":"Ich kann Familienmitglieder benennen und meine Familie kurz vorstellen.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Meine Familie auf Englisch","file":"twist/lessons/de-DE/stufe-0/fl/en-family.yaml","lessons":[{"n":1,"title":"Mum, dad, grandma, grandpa","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"This is my …","acts":["learn","practise","check"],"tasks":20}],"tasks":38,"summary":"Family words in English and introducing your family with \"This is my …\". Stufe 0 is oral only: instructions are spoken in German, the words in English. Lesson 1 brings mum, dad, baby, grandma and grandpa; lesson 2 adds brother and sister, \"This is my …\", and ends with the skill check."}},{"id":"fl.speaking.name-things","domain":"fl","topic":"Sprechen","can":"Ich kann Dinge aus bekannten Themen benennen, wenn ich sie sehe (Farben, Zahlen, Tiere, Schulsachen).","standards":["kmk-fremdsprachen-gs-2013.sprechen","kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Was ist das? Ich sag es auf Englisch","file":"twist/lessons/de-DE/stufe-0/fl/en-name-things.yaml","lessons":[{"n":1,"title":"It's a dog.","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Red, blue, three","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children see a picture and say what it is in English. Lesson 1 names animals and school things with It's a … (It's a dog. It's a pencil.). Lesson 2 names colours and amounts (It's red. Three.) and then both together (a green ball), and ends with the skill check. Most tasks are speaking; between them the child hears a name and decides whether it fits the picture, so the checks can be marked without speech recognition. Oral only: nothing is read."}},{"id":"fl.themes.school","domain":"fl","topic":"Schule","can":"Ich kann Schulsachen benennen und Sätze aus dem Unterricht verstehen und sagen (Can I have a pencil, please?).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Schulsachen auf Englisch","file":"twist/lessons/de-DE/stufe-0/fl/en-school.yaml","lessons":[{"n":1,"title":"Pencil, ruler, rubber","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Can I have a pencil, please?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"School things in English and asking for one politely. Stufe 0 is oral only: instructions are spoken in German, the words in English. Lesson 1 brings pencil, ruler, rubber, scissors and book; lesson 2 adds school bag, pencil case and chair, \"Can I have a …, please?\" with \"Here you are.\", and ends with the skill check."}},{"id":"fl.themes.outside-animals","domain":"fl","topic":"Tiere und Natur","can":"Ich kann Tiere und Dinge in der Natur benennen und sagen, was ein Tier kann.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Tiere und Natur auf Englisch","file":"twist/lessons/de-DE/stufe-0/fl/en-animals.yaml","lessons":[{"n":1,"title":"Bird, fish, frog","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"A bird can fly.","acts":["learn","practise","check"],"tasks":20}],"tasks":38,"summary":"Animals and things outside in English, and what an animal can do (A bird can fly.). Stufe 0 is oral only: instructions are spoken in German, the words in English. Lesson 1 brings bird, fish, frog, snake, mouse and tree, sun, cloud; lesson 2 says what animals can do (fly, swim, jump), with \"It can …\" riddles and true or false \"can\" sentences, and ends with the skill check."}},{"id":"fl.culture-strategies.compare-languages","domain":"fl","topic":"Sprachen vergleichen","can":"Ich kann Wörter in der Fremdsprache und im Deutschen vergleichen und ähnliche Wörter entdecken (house, Haus).","standards":["kmk-fremdsprachen-gs-2013.sprachbewusstheit"],"set":{"title":"Englisch und Deutsch vergleichen","file":"twist/lessons/de-DE/stufe-0/fl/en-compare-languages.yaml","lessons":[{"n":1,"title":"Haus und house","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Falsche Freunde","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":40,"summary":"Children compare English words with German ones. Lesson 1 finds words that sound almost the same (Haus, house; Milch, milk; Wasser, water; Buch, book) and sets them against words that sound quite different (Hund, dog). Lesson 2 meets false friends a child might trip over: the Rock is a skirt in English (rock is a stone), the Hose is trousers, the Handy is a mobile phone and a Kind is a child (kind means nett). It mixes them with true pairs and ends with the skill check. Oral only: nothing is read."}}]},{"id":"lernjahr-1","label":"1. Lernjahr","skills":[{"id":"fl.listening.short-dialogues","domain":"fl","topic":"Hören","can":"Ich verstehe kurze, langsam gesprochene Gespräche zu bekannten Themen und kann sagen, worum es geht.","standards":["kmk-fremdsprachen-gs-2013.hoeren","nc-languages-2014.ks2.foreign-language.1"],"set":{"title":"Kurze Gespräche verstehen","file":"twist/lessons/de-DE/lernjahr-1/fl/en-short-dialogues.yaml","lessons":[{"n":1,"title":"Worum geht es?","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Genau hinhören","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Lernjahr 1 starts by listening to short, slow conversations on familiar topics: meeting someone, pets, food, how someone feels. Lesson 1 finds what a conversation is about and who says what; lesson 2 picks out one detail (a name, an animal, a colour) and ends with the skill check. The conversations are spoken in English; questions and answers are in German or pictures, so the task tests listening, not reading."}},{"id":"fl.grammar.chunks","domain":"fl","topic":"Sprachmuster","can":"Ich kann feste Satzmuster verwenden, um über mich zu sprechen (I am ..., I have got ..., I like ..., I can ...).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel","nc-languages-2014.ks2.foreign-language.4"],"set":{"title":"Über mich sprechen","file":"twist/lessons/de-DE/lernjahr-1/fl/en-about-me.yaml","lessons":[{"n":1,"title":"I am, I have got, I can","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Ein Satz über mich","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Fixed sentence patterns for talking about yourself: I am …, I have got …, I can …, I like …. Lesson 1 hears and matches I am, I have got and I can with pictures and numbers (I am eight. I have got a dog.); lesson 2 adds I like, chooses the right pattern for what you want to say and puts the words of a sentence in order, and ends with the skill check. Instructions are in German; the sentences are spoken in English and shown in short form."}},{"id":"fl.speaking.likes","domain":"fl","topic":"Sprechen","can":"Ich kann sagen, was ich mag und was ich nicht mag, und andere danach fragen.","standards":["kmk-fremdsprachen-gs-2013.sprechen","nc-languages-2014.ks2.foreign-language.3"],"set":{"title":"Was ich mag und nicht mag","file":"twist/lessons/de-DE/lernjahr-1/fl/en-likes.yaml","lessons":[{"n":1,"title":"I like ... und I don't like ...","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Do you like ...?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Saying what you like and do not like, and asking others. Lesson 1 brings I like ... and I don't like ... with food and animals, heard, read and built from word cards; lesson 2 asks Do you like ...?, answers with Yes, I do. and No, I don't., adds My favourite ... is ..., and ends with the skill check. Speaking tasks are practice only."}},{"id":"fl.listening.stories","domain":"fl","topic":"Hören","can":"Ich verstehe eine vorgelesene Bildergeschichte in groben Zügen und bringe die Bilder in die richtige Reihenfolge.","standards":["kmk-fremdsprachen-gs-2013.hoeren","nc-languages-2014.ks2.foreign-language.8"],"set":{"title":"Geschichten hören","file":"twist/lessons/de-DE/lernjahr-1/fl/en-stories.yaml","lessons":[{"n":1,"title":"Worum geht es in der Geschichte?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"First, then, in the end","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Short picture stories read aloud in English: a hungry mouse, a snowman, a kite in a tree, a birthday. Lesson 1 listens for the gist: who is in the story, what it is about and how it ends. Lesson 2 listens for the order of events with first, then and in the end, puts the pictures in order, and ends with the skill check. Questions are in German, so the task tests listening, not reading."}},{"id":"fl.grammar.plurals-articles","domain":"fl","topic":"Sprachmuster","can":"Ich kann Wörter in der Mehrzahl verwenden und den passenden Begleiter wählen (a cat, two cats, the cats).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel","nc-languages-2014.ks2.foreign-language.12"],"set":{"title":"Einzahl, Mehrzahl und Begleiter","file":"twist/lessons/de-DE/lernjahr-1/fl/en-plurals-articles.yaml","lessons":[{"n":1,"title":"a cat, two cats","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"a, an, the","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"English plurals with -s and the articles a, an and the. Lesson 1 hears and builds plurals (a cat, two cats) with pictures of one or many; lesson 2 chooses a or an (a dog, an apple) and shows that \"the\" is the same for every word (der Hund, die Katze, das Ei: the), and ends with the skill check. Instructions are in German; the English is spoken and shown in short form."}},{"id":"fl.grammar.questions","domain":"fl","topic":"Sprachmuster","can":"Ich kann Fragen mit Fragewörtern und Ja-Nein-Fragen bilden und verstehen (What? Where? How many? Do you ...? Can you ...?).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Fragen auf Englisch","file":"twist/lessons/de-DE/lernjahr-1/fl/en-questions.yaml","lessons":[{"n":1,"title":"What? Where? Who? How many?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Can you swim? Yes, I can.","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Questions with a question word and yes-no questions. Lesson 1 brings What?, Where?, Who? and How many?, what each one asks for and which answer fits; lesson 2 asks and answers Can you …?, Do you like …? and Have you got …? with the short answers (Yes, I can. No, I haven't.), builds questions from word cards, and ends with the skill check. Instructions are in German; the English is spoken and shown in short form."}},{"id":"fl.speaking.ask-answer","domain":"fl","topic":"Sprechen","can":"Ich kann einfache Fragen stellen und beantworten (Have you got a pet? Where is the cat? How many?).","standards":["kmk-fremdsprachen-gs-2013.sprechen","nc-languages-2014.ks2.foreign-language.3"],"set":{"title":"Fragen stellen und beantworten","file":"twist/lessons/de-DE/lernjahr-1/fl/en-ask-answer.yaml","lessons":[{"n":1,"title":"Have you got ...? What's this?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Where is ...? How many ...?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Asking simple questions and giving the answer that fits. Lesson 1 asks Have you got ...?, What's this? and What colour is it? and answers them (Yes, I have. It's a book. It's green.); lesson 2 asks Where is ...? and How many ...?, matches each question with the kind of answer it wants (a place, a number), and ends with the skill check. Speaking tasks are practice only."}},{"id":"fl.reading.word-picture","domain":"fl","topic":"Lesen","can":"Ich erkenne bekannte Wörter im Schriftbild wieder und ordne sie Bildern zu.","standards":["kmk-fremdsprachen-gs-2013.lesen","nc-languages-2014.ks2.foreign-language.7"],"set":{"title":"Wörter lesen und Bildern zuordnen","file":"twist/lessons/de-DE/lernjahr-1/fl/en-word-picture.yaml","lessons":[{"n":1,"title":"Kurze Wörter lesen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Genau bis zum Ende lesen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The first English reading: familiar words on a word card, matched to their pictures. Lesson 1 reads short words (cat, sun, bed) among words with the same
