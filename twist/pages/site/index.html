<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twist content guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--panel:#ffffff;--ink:#22192e;--muted:#6d6478;--line:#e7e1d8;--accent:#6b3fd1;--accent-soft:#efe8fd;--good:#2e8b57;--warn:#b7791f;--new:#d9480f;--code:#f4f0ea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17131d;--panel:#211b29;--ink:#efe9f6;--muted:#a79db3;--line:#352c40;--accent:#a98af0;--accent-soft:#2e2540;--good:#5fc28d;--warn:#e0b25c;--new:#ff8a5c;--code:#2a2333}}
:root[data-theme="dark"]{--bg:#17131d;--panel:#211b29;--ink:#efe9f6;--muted:#a79db3;--line:#352c40;--accent:#a98af0;--accent-soft:#2e2540;--good:#5fc28d;--warn:#e0b25c;--new:#ff8a5c;--code:#2a2333}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
a{color:var(--accent)}
code,pre{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em;background:var(--code);border-radius:5px}
code{padding:1px 5px}
pre{padding:12px;overflow:auto}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;letter-spacing:-.01em}
h1{font-size:34px;margin:0 0 6px}
h2{font-size:26px;margin:38px 0 10px}
h3{font-size:19px;margin:26px 0 8px}
h4{font-size:15px;margin:18px 0 6px}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px;border-right:1px solid var(--line);background:var(--panel)}
nav .brand{font-family:Fraunces,serif;font-weight:700;font-size:20px;margin-bottom:2px}
nav .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav a.on,nav a:hover{background:var(--accent-soft);color:var(--accent)}
main{padding:28px 40px 80px;max-width:1120px}
section{display:none}
section.on{display:block}
.lead{color:var(--muted);font-size:16px;max-width:760px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:20px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-family:Fraunces,serif}
.stat span{color:var(--muted);font-size:12.5px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:14px 0}
.chain .lv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:118px;flex:1}
.chain .lv b{display:block;font-size:14px}
.chain .lv small{color:var(--muted);display:block;font-size:12px}
.chain .lv .ex{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--accent);margin-top:4px;display:block}
.chain .ar{align-self:center;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);text-align:left;padding:7px 9px;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=search]{width:100%;max-width:440px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.topic{margin:18px 0 6px;font-weight:600;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0}
.skill summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline}
.skill summary::-webkit-details-marker{display:none}
.skill .can{flex:1}
.skill .meta{color:var(--muted);font-size:12.5px;white-space:nowrap}
.skill .id{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted)}
.skill .body{margin-top:8px;font-size:14px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.pill.todo{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.new{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--new);color:#fff;margin-left:6px;vertical-align:middle;letter-spacing:.03em}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.type{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.type img{width:100%;max-height:330px;object-fit:contain;background:var(--code);display:block}
.type .tb{padding:12px 14px}
.type .tb h4{margin:0 0 4px;font-family:"JetBrains Mono",monospace;font-size:14px}
.type details{font-size:13.5px}
.type summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:6px}
.mocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mocks figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.mocks img{width:100%;border-radius:8px}
.mocks figcaption{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted)}
.doc h3{border-top:1px solid var(--line);padding-top:18px}
.tree{font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.75;white-space:pre;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.tree i{color:var(--muted);font-style:normal}
.open li{margin:4px 0}
.ok{color:var(--good)}
.foot{color:var(--muted);font-size:12.5px;margin-top:40px}
.menu{display:none}
@media (max-width:860px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;padding:12px 16px}nav .brand,nav .sub{width:100%}main{padding:18px 16px 60px}.skill summary{flex-wrap:wrap}.skill .meta{white-space:normal}}
</style>
</head>

  <nav id="nav">
    <div class="brand">Twist</div>

</div>

const D = {"built":"2026-10-14","totals":{"curricula":2,"skills":661,"sets":514,"lessons":1070,"tasks":22945,"pictures":202,"types":15,"components":32},"curricula":[{"id":"de-DE","title":"Deutschland","lang":"de","subjects":{"math":"Mathe","lit-de":"Deutsch","fl":"Englisch"},"frameworks":["kmk-mathe-2022","kmk-deutsch-2022","kmk-fremdsprachen-gs-2013"],"facets":{"currency":"eur","number-format":"de","operation-signs":"de","units":"metric","time-format":"de-24h","date-format":"de","written-subtraction":"abziehen"},"years":[{"id":"klasse-1","label":"Klasse 1","skills":[{"id":"math.numbers-to-20.count-to-5","domain":"math","topic":"Zahlen bis 10","can":"Ich kann bis zu 5 Dinge sicher abzählen und sagen, wie viele es sind.","standards":["kmk-mathe-2022.zo.2"],"set":{"title":"Zählen bis 5","file":"twist/lessons/de-DE/klasse-1/math/count-to-5.yaml","lessons":[{"n":1,"title":"Zählen bis 3","acts":["learn","practise","check"],"tasks":20},{"n":2,"title":"Zählen bis 5","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":44,"summary":"The first maths lessons of Klasse 1. Children count up to 5 things by pointing at each one exactly once, and learn that the last number they say tells how many there are. Lesson 1 counts to 3, lesson 2 to 5, including things that lie scattered, and ends with the skill check. Children tap each picture as they count, so the app can see the one-to-one match."}},{"id":"math.numbers-to-20.count-to-10","domain":"math","topic":"Zahlen bis 10","can":"Ich kann bis zu 10 Dinge abzählen, auch wenn sie durcheinander liegen.","standards":["kmk-mathe-2022.zo.2","eyfs-2026.elg.number.1"],"set":{"title":"Zählen bis 10","file":"twist/lessons/de-DE/klasse-1/math/count-to-10.yaml","lessons":[{"n":1,"title":"Zählen bis 10","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Durcheinander zählen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Children count up to 10 things. Lesson 1 counts things in a row, where it is easy to keep track; lesson 2 counts things that lie scattered, where the trick is to mark what has been counted (tapping does that), and ends with the skill check."}},{"id":"math.numbers-to-20.subitize-to-10","domain":"math","topic":"Zahlen bis 10","can":"Ich kann Anzahlen bis 10 auf einen Blick erkennen, zum Beispiel auf dem Würfel, mit Fingern oder im Zehnerfeld (Kraft der 5).","standards":["kmk-mathe-2022.msf.1","eyfs-2026.elg.number.2"],"set":{"title":"Anzahlen auf einen Blick","file":"twist/lessons/de-DE/klasse-1/math/subitize-to-10.yaml","lessons":[{"n":1,"title":"Würfelbilder","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Die Kraft der 5","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Children learn to see how many without counting one by one. Lesson 1 uses dice patterns to 6, shown for two seconds so counting is not possible. Lesson 2 uses the Kraft der 5: rows of five and the ten-frame, where a full row is five and the rest is added on (seven is five and two). It ends with the skill check."}},{"id":"math.numbers-to-20.write-numerals-to-10","domain":"math","topic":"Zahlen bis 10","can":"Ich kann die Ziffern 0 bis 10 lesen, richtig schreiben und der passenden Anzahl zuordnen.","standards":["kmk-mathe-2022.zo.2","nc-maths-2014.y1.number-number-and-place-value.5"],"set":{"title":"Die Ziffern 0 bis 10","file":"twist/lessons/de-DE/klasse-1/math/write-numerals-to-10.yaml","lessons":[{"n":1,"title":"Die Ziffern 1 bis 5","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Die Ziffern 6 bis 10","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":3,"title":"Null, Zahl und Menge","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":68,"summary":"Children read and write the numerals and match each to its amount. Lesson 1 takes 1 to 5, lesson 2 takes 6 to 10, each with how the numeral is written; lesson 3 adds 0, mixes all of them and ends with the skill check. When a task asks which numeral fits, the numeral options have no speaker, because hearing \"drei\" would give the answer."}},{"id":"math.numbers-to-20.order-to-10","domain":"math","topic":"Zahlen bis 10","can":"Ich kann die Zahlen bis 10 der Reihe nach ordnen und Vorgänger und Nachfolger nennen.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y1.number-number-and-place-value.3","eyfs-2026.elg.numerical-patterns.1"],"set":{"title":"Zahlen ordnen bis 10","file":"twist/lessons/de-DE/klasse-1/math/order-to-10.yaml","lessons":[{"n":1,"title":"Der Reihe nach","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Vorgänger und Nachfolger","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Children put the numbers to 10 in order, forwards and backwards, find them on the number line, and name the number before and after (Vorgänger and Nachfolger). Lesson 1 is the order itself; lesson 2 is the neighbours of a number and ends with the skill check."}},{"id":"math.numbers-to-20.compare-to-10","domain":"math","topic":"Zahlen bis 10","can":"Ich kann Anzahlen und Zahlen bis 10 vergleichen und die Zeichen \u003c, > und = richtig setzen.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y1.number-number-and-place-value.4","eyfs-2026.elg.numerical-patterns.2"],"set":{"title":"Vergleichen bis 10","file":"twist/lessons/de-DE/klasse-1/math/compare-to-10.yaml","lessons":[{"n":1,"title":"Mehr, weniger, gleich viele","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Die Zeichen \u003c, > und =","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":3,"title":"Vergleichen mit Zeichen","acts":["warm-up","practise","check"],"tasks":24}],"tasks":68,"summary":"Children compare amounts and numbers to 10. Lesson 1 compares groups: more, fewer, the same. Lesson 2 brings the signs \u003c, > and =, with one rule to remember: the open side faces the bigger number. Lesson 3 uses the signs with numbers and with pictures, and ends with the skill check. Sign tasks have no option audio, because hearing \"kleiner als\" on a sign would give the answer."}},{"id":"math.numbers-to-20.partition-to-10","domain":"math","topic":"Zahlen bis 10","can":"Ich kann jede Zahl bis 10 auf verschiedene Arten in zwei Teile zerlegen (Zahlenhaus, Partnerzahlen).","standards":["kmk-mathe-2022.zo.5","kmk-mathe-2022.msf.3","nc-maths-2014.y1.number-addition-and-subtraction.2","eyfs-2026.elg.number.1"],"set":{"title":"Zahlen zerlegen bis 10","file":"twist/lessons/de-DE/klasse-1/math/partition-to-10.yaml","lessons":[{"n":1,"title":"Zerlegen mit Plättchen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Das Zahlenhaus","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":3,"title":"Alle Zerlegungen finden","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":68,"summary":"Children split every number to 10 into two parts in different ways. Lesson 1 splits counters into red and blue (5 is 2 and 3). Lesson 2 writes the splits in the Zahlenhaus. Lesson 3 finds all the splits of a number in order, so none is missing, and ends with the skill check. These splits are what later addition and subtraction rest on."}},{"id":"math.add-sub-to-20.add-meaning","domain":"math","topic":"Rechnen bis 10","can":"Ich kann zu Bildern und Geschichten vom Dazukommen und Zusammenlegen passende Plusaufgaben finden.","standards":["kmk-mathe-2022.zo.4"],"set":{"title":"Was bedeutet plus?","file":"twist/lessons/de-DE/klasse-1/math/add-meaning.yaml","lessons":[{"n":1,"title":"Dazu und zusammen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Rechengeschichten","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"The first Rechnen lesson: plus is something coming along (Dazukommen) or two groups put together (Zusammenlegen). Lesson 1 finds the plus sum for a picture or a little story; lesson 2 tells a story for a sum and writes the sum with + and =, and ends with the skill check."}},{"id":"math.add-sub-to-20.add-to-10","domain":"math","topic":"Rechnen bis 10","can":"Ich kann Plusaufgaben bis 10 lösen, zuerst bis 5 und dann bis 10.","standards":["kmk-mathe-2022.zo.5","nc-maths-2014.y1.number-addition-and-subtraction.1","eyfs-2026.elg.number.3"],"set":{"title":"Plusaufgaben bis 10","file":"twist/lessons/de-DE/klasse-1/math/add-to-10.yaml","lessons":[{"n":1,"title":"Plus bis 5","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Plus bis 10","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Solving plus sums to 10, first to 5 and then to 10, by counting on from the bigger number and by using the five in the ten-frame. Lesson 1 adds to 5 and starts counting on; lesson 2 adds to 10 with the Kraft der 5 and ends with the skill check."}},{"id":"math.add-sub-to-20.sub-meaning","domain":"math","topic":"Rechnen bis 10","can":"Ich kann zu Bildern und Geschichten vom Wegnehmen passende Minusaufgaben finden.","standards":["kmk-mathe-2022.zo.4"],"set":{"title":"Was bedeutet minus?","file":"twist/lessons/de-DE/klasse-1/math/sub-meaning.yaml","lessons":[{"n":1,"title":"Weg ist weg","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Plus oder minus?","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Minus is taking away: some go away, are eaten, fly off. Lesson 1 finds the minus sum for a picture with crossed-out counters or a little story; lesson 2 tells a story for a sum, writes it with − and =, and sets plus and minus stories side by side, and ends with the skill check."}},{"id":"math.add-sub-to-20.sub-to-10","domain":"math","topic":"Rechnen bis 10","can":"Ich kann Minusaufgaben bis 10 lösen.","standards":["kmk-mathe-2022.zo.5","nc-maths-2014.y1.number-addition-and-subtraction.1"],"set":{"title":"Minusaufgaben bis 10","file":"twist/lessons/de-DE/klasse-1/math/sub-to-10.yaml","lessons":[{"n":1,"title":"Wegnehmen und rückwärts zählen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Minus bis 10","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Solving minus sums to 10 by taking away in the ten-frame and by counting back on the number line. Lesson 1 takes away and counts back to 5; lesson 2 works to 10, takes away a whole row of five at once, and ends with the skill check."}},{"id":"math.add-sub-to-20.missing-addend","domain":"math","topic":"Rechnen bis 10","can":"Ich kann Ergänzungsaufgaben bis 10 lösen (3 + _ = 8) und zu jeder Zahl die Partnerzahl bis 10 finden.","standards":["kmk-mathe-2022.zo.5","kmk-mathe-2022.msf.3","nc-maths-2014.y1.number-addition-and-subtraction.2","eyfs-2026.elg.number.3"],"set":{"title":"Ergänzen bis 10","file":"twist/lessons/de-DE/klasse-1/math/missing-addend.yaml","lessons":[{"n":1,"title":"Wie viele fehlen?","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Die Zehnerfreunde","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Ergänzungsaufgaben (3 + _ = 8): how many more are needed? Lesson 1 fills up the ten-frame and counts on from the first number to the total; lesson 2 finds the partner number to 10 for every number (die Zehnerfreunde) and ends with the skill check."}},{"id":"math.add-sub-to-20.commutative","domain":"math","topic":"Rechnen bis 10","can":"Ich kann Tauschaufgaben finden und nutzen, um mir das Rechnen leichter zu machen.","standards":["kmk-mathe-2022.zo.9","nc-maths-2014.y2.number-addition-and-subtraction.8"],"set":{"title":"Tauschaufgaben","file":"twist/lessons/de-DE/klasse-1/math/commutative.yaml","lessons":[{"n":1,"title":"Gleich viel","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Tauschen macht es leichter","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Swapping the two numbers of a plus sum gives the same result: 2 + 6 and 6 + 2 are both 8. Lesson 1 sees this in the ten-frame, turned round; lesson 2 uses it to make adding easier (start with the bigger number), learns that it does not work for minus, and ends with the skill check."}},{"id":"math.add-sub-to-20.inverse","domain":"math","topic":"Rechnen bis 10","can":"Ich kann zu einer Plusaufgabe die Umkehraufgabe finden und Aufgabenfamilien bilden (3 + 5, 5 + 3, 8 − 5, 8 − 3).","standards":["kmk-mathe-2022.zo.4","kmk-mathe-2022.zo.5","nc-maths-2014.y2.number-addition-and-subtraction.9"],"set":{"title":"Umkehraufgaben und Aufgabenfamilien","file":"twist/lessons/de-DE/klasse-1/math/inverse.yaml","lessons":[{"n":1,"title":"Plus und minus gehören zusammen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Aufgabenfamilien","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Plus and minus undo each other: 3 + 5 = 8, so 8 − 5 = 3. Lesson 1 finds the Umkehraufgabe of a plus sum in the ten-frame and uses it to check a minus result; lesson 2 builds the whole family of four sums from three numbers (3 + 5, 5 + 3, 8 − 5, 8 − 3) and ends with the skill check."}},{"id":"math.word-problems.picture-stories","domain":"math","topic":"Sachaufgaben","can":"Ich kann zu Bildern und kurzen Rechengeschichten eine passende Aufgabe finden, lösen und die Antwort sagen.","standards":["kmk-mathe-2022.zo.12","kmk-mathe-2022.pk-modellieren.2","nc-maths-2014.y1.number-addition-and-subtraction.4"],"set":{"title":"Rechengeschichten","file":"twist/lessons/de-DE/klasse-1/math/picture-stories.yaml","lessons":[{"n":1,"title":"Was will die Geschichte wissen?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Frage, Rechnung, Antwort","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"A picture or a short story asks a question, and the child finds the sum, works it out and says the answer. Lesson 1 finds what the story asks and the sum for it; lesson 2 adds the answer sentence and mixes plus and minus stories, and ends with the skill check. Stories are spoken; sums and short questions are on screen."}},{"id":"math.numbers-to-20.teens","domain":"math","topic":"Zahlen bis 20","can":"Ich kann die Zahlen von 11 bis 20 als einen Zehner und Einer verstehen, lesen und schreiben.","standards":["kmk-mathe-2022.zo.1","nc-maths-2014.y1.number-number-and-place-value.5","eyfs-2026.elg.numerical-patterns.1"],"set":{"title":"Die Zahlen von 11 bis 20","file":"twist/lessons/de-DE/klasse-1/math/teens.yaml","lessons":[{"n":1,"title":"Ein Zehner und Einer","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Zahlen bis 20 lesen und schreiben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"A number from 11 to 20 is one full ten and some ones. Lesson 1 sees the full ten-frame and the ones in the Zwanzigerfeld and reads the number; lesson 2 writes the numbers with Zehner and Einer, hears that German says the Einer first (vierzehn), and ends with the skill check."}},{"id":"math.numbers-to-20.order-to-20","domain":"math","topic":"Zahlen bis 20","can":"Ich kann die Zahlen bis 20 ordnen, am Zahlenstrahl finden, vorwärts und rückwärts zählen und Zahlenfolgen fortsetzen.","standards":["kmk-mathe-2022.zo.3","kmk-mathe-2022.msf.2","nc-maths-2014.y1.number-number-and-place-value.1","nc-maths-2014.y1.number-number-and-place-value.3","eyfs-2026.elg.numerical-patterns.1"],"set":{"title":"Zahlen bis 20 ordnen","file":"twist/lessons/de-DE/klasse-1/math/order-to-20.yaml","lessons":[{"n":1,"title":"Der Zahlenstrahl bis 20","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Vorwärts und rückwärts","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The numbers to 20 in order. Lesson 1 finds numbers on the Zahlenstrahl to 20, with the long stroke at ten as a landmark, and names the numbers before and after; lesson 2 orders numbers, counts forwards and backwards across ten, continues sequences in steps of 2, and ends with the skill check."}},{"id":"math.numbers-to-20.compare-to-20","domain":"math","topic":"Zahlen bis 20","can":"Ich kann Zahlen bis 20 vergleichen und sagen, um wie viel eine Zahl größer oder kleiner ist.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y1.number-number-and-place-value.4"],"set":{"title":"Zahlen bis 20 vergleichen","file":"twist/lessons/de-DE/klasse-1/math/compare-to-20.yaml","lessons":[{"n":1,"title":"Größer oder kleiner","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Um wie viel mehr?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Comparing numbers to 20 and saying how much bigger or smaller one is. Lesson 1 compares with \u003c, > and = by looking at the Zehner and then the Einer; lesson 2 finds the difference on the Zwanzigerfeld and the Zahlenstrahl (14 is 3 more than 11), and ends with the skill check."}},{"id":"math.numbers-to-20.double-halve-to-20","domain":"math","topic":"Zahlen bis 20","can":"Ich kann Zahlen bis 10 verdoppeln und gerade Zahlen bis 20 halbieren.","standards":["kmk-mathe-2022.zo.5","eyfs-2026.elg.numerical-patterns.3"],"set":{"title":"Verdoppeln und Halbieren bis 20","file":"twist/lessons/de-DE/klasse-1/math/double-halve-to-20.yaml","lessons":[{"n":1,"title":"Verdoppeln","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Halbieren","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Doubling numbers to 10 and halving even numbers to 20. Lesson 1 doubles with the Zwanzigerfeld and dots (the same amount once more, like a mirror); lesson 2 halves by sharing fairly into two equal parts, links halving back to doubling, and ends with the skill check."}},{"id":"math.numbers-to-20.even-odd","domain":"math","topic":"Zahlen bis 20","can":"Ich kann gerade und ungerade Zahlen bis 20 unterscheiden und erklären, woran ich sie erkenne.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y2.number-multiplication-and-division.1","eyfs-2026.elg.numerical-patterns.3"],"set":{"title":"Gerade und ungerade Zahlen","file":"twist/lessons/de-DE/klasse-1/math/even-odd.yaml","lessons":[{"n":1,"title":"Paare bilden","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Gerade und ungerade bis 20","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Even numbers can be shared into pairs with none left over; odd numbers always leave one. Lesson 1 makes pairs with dots up to 10 and sorts numbers; lesson 2 reads even and odd from the last digit to 20, links even numbers to doubles, and ends with the skill check."}},{"id":"math.add-sub-to-20.neighbour-facts","domain":"math","topic":"Rechnen bis 20","can":"Ich kann Nachbaraufgaben und Verdopplungsaufgaben nutzen, um schwierige Aufgaben aus leichten abzuleiten (4 + 5 ist eins mehr als 4 + 4).","standards":["kmk-mathe-2022.zo.7","kmk-mathe-2022.msf.3"],"set":{"title":"Verdopplungs- und Nachbaraufgaben","file":"twist/lessons/de-DE/klasse-1/math/neighbour-facts.yaml","lessons":[{"n":1,"title":"Fast verdoppeln","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Eins mehr oder eins weniger","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":45,"summary":"Working out a harder sum from an easy one you know. Lesson 1 uses the Verdopplungsaufgaben: 6 + 7 is one more than 6 + 6. Lesson 2 uses Nachbaraufgaben one more or one less in both directions (7 + 8 from 8 + 8, 5 + 9 from 5 + 10), and ends with the skill check."}},{"id":"math.add-sub-to-20.number-walls","domain":"math","topic":"Rechnen bis 20","can":"Ich kann Zahlenmauern, Rechenketten und Rechentabellen bis 20 ausfüllen und darin Muster entdecken.","standards":["kmk-mathe-2022.msf.2","kmk-mathe-2022.pk-argumentieren.2"],"set":{"title":"Zahlenmauern und Rechenketten","file":"twist/lessons/de-DE/klasse-1/math/number-walls.yaml","lessons":[{"n":1,"title":"Zahlenmauern","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Rechenketten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Zahlenmauern (each stone is the two stones under it added together) and Rechenketten to 20. Lesson 1 fills a wall upwards and finds a missing stone at the bottom by subtracting; lesson 2 follows Rechenketten with plus and minus, looks at what changes when a bottom stone changes, and ends with the skill check. Rechentabellen are not in this set yet."}},{"id":"math.add-sub-to-20.analog-to-20","domain":"math","topic":"Rechnen bis 20","can":"Ich kann Aufgaben im zweiten Zehner mit verwandten Aufgaben aus dem ersten Zehner lösen (3 + 4 hilft bei 13 + 4).","standards":["kmk-mathe-2022.zo.6","kmk-mathe-2022.msf.3","nc-maths-2014.y1.number-addition-and-subtraction.3"],"set":{"title":"Analogieaufgaben im zweiten Zehner","file":"twist/lessons/de-DE/klasse-1/math/analog-to-20.yaml","lessons":[{"n":1,"title":"Die kleine Aufgabe hilft","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Auch bei Minus","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"A sum in the second ten is the matching small sum plus a ten: 3 + 4 = 7 helps with 13 + 4 = 17, and 8 − 5 = 3 with 18 − 5 = 13. Lesson 1 adds, lesson 2 subtracts and mixes both, and ends with the skill check. No sum here crosses ten; that comes with the Zehnerübergang."}},{"id":"math.add-sub-to-20.add-bridge-10","domain":"math","topic":"Rechnen bis 20","can":"Ich kann Plusaufgaben mit Zehnerübergang lösen, indem ich bis zur 10 ergänze und dann weiterrechne (8 + 5 = 8 + 2 + 3).","standards":["kmk-mathe-2022.zo.7","nc-maths-2014.y1.number-addition-and-subtraction.3"],"set":{"title":"Plusaufgaben mit Zehnerübergang","file":"twist/lessons/de-DE/klasse-1/math/add-bridge-10.yaml","lessons":[{"n":1,"title":"Erst bis zur 10","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Zerlegen und weiterrechnen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":3,"title":"Rechengeschichten","acts":["warm-up","practise","check"],"tasks":22}],"tasks":68,"summary":"Children add a one-digit number that crosses ten by filling up to ten first and adding the rest (8 + 5 = 8 + 2 + 3). Lesson 1 shows it on the Zwanzigerfeld, lesson 2 writes the split down and shows it on the Rechenstrich, lesson 3 uses it in short stories and ends with the skill check. Every lesson practises in three stages: full hints, one hint, no hints."}},{"id":"math.add-sub-to-20.sub-bridge-10","domain":"math","topic":"Rechnen bis 20","can":"Ich kann Minusaufgaben mit Zehnerübergang lösen, indem ich zuerst bis zur 10 zurückrechne (13 − 5 = 13 − 3 − 2).","standards":["kmk-mathe-2022.zo.7","nc-maths-2014.y1.number-addition-and-subtraction.3"],"set":{"title":"Minus mit Zehnerübergang","file":"twist/lessons/de-DE/klasse-1/math/sub-bridge-10.yaml","lessons":[{"n":1,"title":"Erst bis zur 10","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Minus bis 20","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"Subtracting across ten in two steps: first back to 10, then the rest (13 − 5 = 13 − 3 − 2 = 8). Lesson 1 splits the number to take away and goes back to ten on the Rechenstrich; lesson 2 writes the steps, practises with all sums from 11 to 18, and ends with the skill check."}},{"id":"math.add-sub-to-20.fluency-to-20","domain":"math","topic":"Rechnen bis 20","can":"Ich kann alle Aufgaben des kleinen Einspluseins schnell und sicher aus dem Kopf lösen und ihre Umkehraufgaben ableiten.","standards":["kmk-mathe-2022.zo.5","nc-maths-2014.y1.number-addition-and-subtraction.2","nc-maths-2014.y2.number-addition-and-subtraction.3","nc-maths-2014.y2.number-addition-and-subtraction.7"],"set":{"title":"Das kleine Einspluseins","file":"twist/lessons/de-DE/klasse-1/math/fluency-to-20.yaml","lessons":[{"n":1,"title":"Schnell plus rechnen","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Minus aus Plus ableiten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"All the sums of the kleines Einspluseins quickly and surely, using the tricks the child knows (Verdoppeln, Zehnerfreunde, Analogieaufgaben, Zehnerübergang) and deriving minus facts from plus facts. Lesson 1 mixes plus facts and picks a quick way; lesson 2 derives the minus facts with the Umkehraufgabe, mixes both, and ends with a timed skill check: five facts, each answered correctly within the time per task set for the child's age."}},{"id":"math.add-sub-to-20.equations","domain":"math","topic":"Rechnen bis 20","can":"Ich kann Aufgaben und Zahlen mit \u003c, > und = vergleichen und zeigen, dass verschiedene Aufgaben dasselbe Ergebnis haben (7 + 5 = 6 + 6).","standards":["kmk-mathe-2022.msf.3","nc-maths-2014.y1.number-addition-and-subtraction.4"],"set":{"title":"Gleich, größer, kleiner","file":"twist/lessons/de-DE/klasse-1/math/equations.yaml","lessons":[{"n":1,"title":"Aufgabe und Zahl vergleichen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zwei Aufgaben vergleichen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Comparing sums and numbers with \u003c, > and =, and seeing that different sums can have the same result (7 + 5 = 6 + 6). Lesson 1 compares a sum with a number; lesson 2 compares two sums, finds sums that are equal, and ends with the skill check. The = sign means \"is the same as\", not \"the answer comes next\"."}},{"id":"math.word-problems.question-calc-answer","domain":"math","topic":"Sachaufgaben","can":"Ich kann Sachaufgaben mit Frage, Rechnung und Antwort lösen und wichtige von unwichtigen Angaben unterscheiden.","standards":["kmk-mathe-2022.zo.12","kmk-mathe-2022.pk-modellieren.1","nc-maths-2014.y2.number-addition-and-subtraction.1"],"set":{"title":"Sachaufgaben: Frage, Rechnung, Antwort","file":"twist/lessons/de-DE/klasse-1/math/question-calc-answer.yaml","lessons":[{"n":1,"title":"Frage und Rechnung","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wichtig oder unwichtig?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Word problems to 20 in three steps: the question, the calculation and the answer sentence, and telling the facts you need from the ones you do not. Lesson 1 finds the question and the calculation, also across ten; lesson 2 picks out the facts you need when a story has one too many, writes the answer sentence, and ends with the skill check."}},{"id":"math.numbers-to-100.tens","domain":"math","topic":"Zehnerzahlen","can":"Ich kann die Zehnerzahlen bis 100 lesen, schreiben, ordnen und in Zehnerschritten zählen.","standards":["kmk-mathe-2022.zo.1","nc-maths-2014.y1.number-number-and-place-value.2"],"set":{"title":"Zehnerzahlen bis 100","file":"twist/lessons/de-DE/klasse-1/math/tens-to-100.yaml","lessons":[{"n":1,"title":"Zehner bündeln","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"In Zehnerschritten zählen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 builds the Zehnerzahlen from tens rods (3 Zehner sind 30) and reads their names, with the odd ones dreißig, sechzig and siebzig; lesson 2 counts on and back in tens, orders the Zehnerzahlen and finds the missing one, and ends with the skill check."}},{"id":"math.add-sub-to-100.tens","domain":"math","topic":"Rechnen mit Zehnern","can":"Ich kann Zehnerzahlen addieren und subtrahieren (30 + 40, 90 − 60) und dabei das Einspluseins nutzen.","standards":["kmk-mathe-2022.zo.6","nc-maths-2014.y2.number-addition-and-subtraction.3"],"set":{"title":"Mit Zehnerzahlen rechnen","file":"twist/lessons/de-DE/klasse-1/math/add-sub-tens.yaml","lessons":[{"n":1,"title":"Zehner plus Zehner","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zehner minus Zehner","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 adds Zehnerzahlen with the small sum (3 + 4 = 7, also 30 + 40 = 70) using tens rods; lesson 2 subtracts them the same way (9 − 6 = 3, also 90 − 60 = 30), finds the missing Zehnerzahl to 100, and ends with the skill check."}},{"id":"math.money.coins-notes","domain":"math","topic":"Geld","can":"Ich kann alle Münzen und Scheine erkennen und nach ihrem Wert ordnen.","standards":["kmk-mathe-2022.gm.2","nc-maths-2014.y1.measurement.9"],"set":{"title":"Münzen und Scheine","file":"twist/lessons/de-DE/klasse-1/math/money-coins-notes.yaml","lessons":[{"n":1,"title":"Die Münzen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Scheine und was sie wert sind","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 tells the coins apart: the Cent-Münzen (1, 2, 5, 10, 20 and 50 Cent) and the Euro-Münzen (1 € and 2 €), reading the number and the word Cent or Euro on each coin; lesson 2 meets the Scheine (5 €, 10 €, 20 €, 50 €, 100 €), compares what coins and notes are worth and puts them in order by value, and ends with the skill check."}},{"id":"math.money.amounts-to-20","domain":"math","topic":"Geld","can":"Ich kann Geldbeträge bis 20 € mit Münzen und Scheinen legen und zusammenzählen.","standards":["kmk-mathe-2022.gm.1","nc-maths-2014.y2.measurement.3"],"set":{"title":"Geld zählen bis 20 €","file":"twist/lessons/de-DE/klasse-1/math/money-to-20.yaml","lessons":[{"n":1,"title":"Wie viel Geld ist das?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Geld legen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 counts amounts up to 20 € laid out in notes and coins, starting with the note worth the most and counting on (10 € + 5 € + 2 € is 17 €), and counts value, not pieces; lesson 2 lays an amount (14 € = 10 € + 2 € + 2 €), finds that one amount can be laid in more than one way, compares who has more money, and ends with the skill check. Dragging real coins onto a tray waits for a drag-and-drop task."}},{"id":"math.time.sequence-of-day","domain":"math","topic":"Zeit","can":"Ich kann Tagesabläufe ordnen und die Wochentage und Monate der Reihe nach nennen.","standards":["kmk-mathe-2022.gm.2","nc-maths-2014.y1.measurement.4","nc-maths-2014.y1.measurement.8","nc-maths-2014.y1.measurement.10"],"set":{"title":"Tagesablauf, Wochentage und Monate","file":"twist/lessons/de-DE/klasse-1/math/sequence-of-day.yaml","lessons":[{"n":1,"title":"Mein Tag","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Die Wochentage","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":3,"title":"Die Monate","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":60,"summary":"Lesson 1 puts the events of a day in order (morgens, mittags, abends, nachts) and says what comes before and after; lesson 2 names the seven days of the week in order with gestern, heute and morgen; lesson 3 names the twelve months in order and the seasons they belong to, and ends with the skill check."}},{"id":"math.time.full-half-hour","domain":"math","topic":"Uhrzeit","can":"Ich kann volle und halbe Stunden auf der analogen und der digitalen Uhr ablesen und einstellen.","standards":["kmk-mathe-2022.gm.6","nc-maths-2014.y1.measurement.8","nc-maths-2014.y1.measurement.12"],"set":{"title":"Volle und halbe Stunden","file":"twist/lessons/de-DE/klasse-1/math/time-full-half.yaml","lessons":[{"n":1,"title":"Volle Stunden","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Halbe Stunden","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading the clock to the hour and the half hour. Lesson 1 reads full hours from the short hand when the long hand points to 12 (drei Uhr, 3:00); lesson 2 reads halbe Stunden, where the long hand points to 6 and the short hand sits between two numbers (halb vier, 3:30), and ends with the skill check. Setting the hands waits for clock_hands_drag."}},{"id":"math.shapes.basic-shapes","domain":"math","topic":"Formen","can":"Ich kann Kreis, Dreieck, Rechteck und Quadrat erkennen und benennen, auch in meiner Umwelt.","standards":["kmk-mathe-2022.rf.4","kmk-mathe-2022.rf.5","nc-maths-2014.y1.geometry-properties-of-shapes.1"],"set":{"title":"Kreis, Dreieck, Rechteck, Quadrat","file":"twist/lessons/de-DE/klasse-1/math/basic-shapes.yaml","lessons":[{"n":1,"title":"Ecken und Seiten","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Quadrat oder Rechteck?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 names the four flat shapes by their corners and sides (Ein Dreieck hat drei Ecken); lesson 2 tells the square from the rectangle (alle Seiten gleich lang), finds a shape turned or in another colour, finds the shapes in things around us, and ends with the skill check."}},{"id":"math.shapes.compose","domain":"math","topic":"Formen","can":"Ich kann Figuren legen, nachlegen, zerlegen und aus Teilen zusammensetzen (zum Beispiel mit dem Tangram).","standards":["kmk-mathe-2022.rf.3","kmk-mathe-2022.rf.6"],"set":{"title":"Formen legen und zerlegen","file":"twist/lessons/de-DE/klasse-1/math/compose-shapes.yaml","lessons":[{"n":1,"title":"Formen zusammenlegen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zerlegen und nachlegen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 lays shapes from Plättchen on Karopapier: two Dreiecke make a Quadrat, two Quadrate in a row make a Rechteck, and a house or a boat is counted piece by piece; lesson 2 splits shapes (a cut from corner to corner gives two Dreiecke, a straight cut through the middle two Rechtecke), copies a figure exactly from a Vorlage, meets the Tangram and ends with the skill check. Laying real pieces with the finger waits for a drag task on the grid; the Tangram itself is only described, because no component draws its seven pieces."}},{"id":"math.space.position-words","domain":"math","topic":"Orientierung","can":"Ich kann Lagebeziehungen beschreiben und verstehen (rechts, links, oben, unten, vor, hinter, neben, zwischen).","standards":["kmk-mathe-2022.rf.1","nc-maths-2014.y1.geometry-position-and-direction.1"],"set":{"title":"Links, rechts, oben, unten","file":"twist/lessons/de-DE/klasse-1/math/position-words.yaml","lessons":[{"n":1,"title":"Links, rechts, zwischen","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Oben, unten, vor, hinter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":40,"summary":"Lesson 1 finds things in a row by links, rechts, neben and zwischen; lesson 2 uses oben and unten in a stack and vor, hinter, auf and unter in everyday sentences, and ends with the skill check. The skill has no prerequisite, so lesson 1 starts with Learn instead of a warm-up."}},{"id":"math.patterns.repeating","domain":"math","topic":"Muster","can":"Ich kann Muster aus Formen, Farben und Zahlen erkennen, beschreiben und fortsetzen.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y2.geometry-position-and-direction.1"],"set":{"title":"Muster fortsetzen","file":"twist/lessons/de-DE/klasse-1/math/repeating-patterns.yaml","lessons":[{"n":1,"title":"Was kommt als Nächstes?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Lücken und Fehler im Muster","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 finds the part of a shape or colour pattern that repeats (Kreis, Dreieck, Kreis, Dreieck) and continues it; lesson 2 finds the gap in the middle of a pattern, the shape that breaks it and simple number patterns (1, 2, 1, 2), and ends with the skill check."}},{"id":"math.symmetry.identify","domain":"math","topic":"Symmetrie","can":"Ich kann erkennen, ob eine Figur achsensymmetrisch ist, und die Symmetrieachse finden (durch Falten oder mit dem Spiegel).","standards":["kmk-mathe-2022.rf.10","nc-maths-2014.y2.geometry-properties-of-shapes.1"],"set":{"title":"Symmetrie erkennen","file":"twist/lessons/de-DE/klasse-1/math/symmetry-identify.yaml","lessons":[{"n":1,"title":"Passt es beim Falten?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Symmetrieachse","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 folds in the mind: a figure is symmetrisch when both halves fit exactly on each other along the fold (Schmetterling, Herz, die Buchstaben A und T); lesson 2 says where the Symmetrieachse runs (senkrecht durch die Mitte, waagerecht), finds letters and shapes that are not symmetric, and ends with the skill check. Drawing the mirror half waits for a drawing task."}},{"id":"math.data.sort-classify","domain":"math","topic":"Daten","can":"Ich kann Dinge nach Merkmalen sortieren und zählen, wie viele in jeder Gruppe sind.","standards":["kmk-mathe-2022.dz.1","nc-maths-2014.y2.statistics.2"],"set":{"title":"Sortieren und zählen","file":"twist/lessons/de-DE/klasse-1/math/sort-classify.yaml","lessons":[{"n":1,"title":"Was gehört zusammen?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wie viele in jeder Gruppe?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 sorts pictures by one feature (Tier oder Essen, rot oder blau) and finds the one that does not belong; lesson 2 counts how many are in each group, says which group has more, and ends with the skill check."}},{"id":"math.data.tally","domain":"math","topic":"Daten","can":"Ich kann Daten mit Strichlisten erfassen und auszählen, zum Beispiel bei einer Umfrage in der Klasse.","standards":["kmk-mathe-2022.dz.1","nc-maths-2014.y2.statistics.1"],"set":{"title":"Strichlisten","file":"twist/lessons/de-DE/klasse-1/math/tally.yaml","lessons":[{"n":1,"title":"Striche zählen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Eine Umfrage in der Klasse","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads a Strichliste: four strokes and the fifth across make a bundle of 5 (Fünferbündel), so 7 is a bundle and two more; lesson 2 reads a class survey in a Strichliste (Lieblingsobst, Lieblingsfarbe), says which is the most and how many more, and ends with the skill check. Making the strokes with a finger waits for a drawing task."}},{"id":"lit-de.phonological.rhymes","domain":"lit-de","topic":"Laute hören","can":"Ich kann hören, ob sich zwei Wörter reimen, und selbst Reimwörter finden.","standards":["kmk-deutsch-2022.sp.14","kmk-deutsch-2022.sp.16"],"set":{"title":"Reime hören","file":"twist/lessons/de-DE/klasse-1/lit-de/rhymes.yaml","lessons":[{"n":1,"title":"Reimt sich das?","acts":["learn","practise","check"],"tasks":20},{"n":2,"title":"Reimwörter finden","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":44,"summary":"The first Deutsch lessons of Klasse 1, before any letters. Children hear whether two words rhyme (Haus, Maus) and find rhyming words themselves. Lesson 1 judges pairs; lesson 2 finds the rhyme, pairs rhymes and spots the word that does not rhyme, and ends with the skill check. Nothing has to be read: every prompt is spoken, every picture says its word."}},{"id":"lit-de.phonological.syllables","domain":"lit-de","topic":"Laute hören","can":"Ich kann Wörter in Silben klatschen und sagen, wie viele Silben ein Wort hat.","standards":["kmk-deutsch-2022.les.1"],"set":{"title":"Silben klatschen","file":"twist/lessons/de-DE/klasse-1/lit-de/syllables.yaml","lessons":[{"n":1,"title":"Wörter klatschen","acts":["learn","practise","check"],"tasks":20},{"n":2,"title":"Silben sortieren","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":44,"summary":"Children clap words into syllables and say how many there are: Ball is one clap, Ha-se two, Ba-na-ne three. Each clap is shown as a dot, so the answers need no reading. Lesson 1 claps and counts; lesson 2 sorts words by their number of syllables, pairs words with their claps and ends with the skill check."}},{"id":"lit-de.phonological.initial-sound","domain":"lit-de","topic":"Laute hören","can":"Ich kann den Anlaut eines Wortes hören und Wörter mit gleichem Anlaut finden.","standards":["kmk-deutsch-2022.les.1"],"set":{"title":"Anlaute hören","file":"twist/lessons/de-DE/klasse-1/lit-de/initial-sound.yaml","lessons":[{"n":1,"title":"Der erste Laut","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Gleicher Anfang","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Children hear the first sound of a word (Sonne starts with sss) and find words that start with the same sound. There are no letters yet: the sounds are spoken, and every picture says its word. Lesson 1 listens for one sound at a time; lesson 2 pairs and sorts words by their first sound, finds the one that starts differently, and ends with the skill check."}},{"id":"lit-de.letters.sound-chart","domain":"lit-de","topic":"Buchstaben","can":"Ich kann mit einer Anlauttabelle zu einem Laut den passenden Buchstaben finden.","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sp.17"],"set":{"title":"Die Anlauttabelle","file":"twist/lessons/de-DE/klasse-1/lit-de/sound-chart.yaml","lessons":[{"n":1,"title":"Bild und Buchstabe","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Laut für Laut","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"Using an Anlauttabelle before the letters are taught one by one. Each field of the chart is a letter with a picture whose word starts with that letter's sound (M wie Maus). Lesson 1: hear a sound or a word, find the chart picture that starts the same, and with it the letter; keep the sound apart from the letter name (Elefant does not start with L) and from sounds later in the word. Lesson 2 goes through a whole short word sound by sound (Hut: H wie Hund, U wie Uhr, T wie Tisch), puts the chart pictures in order and ends with the skill check. The Learn screens show a small chart (sound-chart, six fields) with the field being talked about marked, and Oma as the three fields O, M, A. Tasks that ask for a sound's field show a short chart of four fields with every option on it and nothing marked, so the child has to find the field; l1-s1 shows one letter as a gap with two options that are not on the chart. Pictures are always named, so each field's word starts with exactly its sound (no Ohr for O, no Elefant for L). Sorting bins and options also carry fields, and tapping one says it (\"M wie Maus\")."}},{"id":"lit-de.letters.l-o-a-m","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne die Buchstaben L, O, A und M mit ihren Lauten und lese erste Silben wie Mo, La, Ma.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"Die Buchstaben L, O, A und M","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-l-o-a-m.yaml","lessons":[{"n":1,"title":"Das L","acts":["learn","practise","check"],"tasks":19},{"n":2,"title":"Das O","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Das A","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":4,"title":"Das M","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":5,"title":"L, O, A und M zusammen","acts":["warm-up","practise","check"],"tasks":22}],"tasks":104,"summary":"The first four letters in Fibel order, chosen because their sounds can be held (lll, ooo, aaa, mmm) and they make words at once: Oma, Mama, Lama. One lesson per letter: hear the sound, find it at the start of words, see and trace the letter, practised in three stages (full hints, one hint, no hints). The fifth lesson blends the first syllables, reads three words and ends with the skill check."}},{"id":"lit-de.handwriting.print-letters","domain":"lit-de","topic":"Schreiben lernen","can":"Ich kann die Buchstaben in Druckschrift in der richtigen Bewegung und Größe zwischen den Linien schreiben.","standards":["kmk-deutsch-2022.sch.1","kmk-deutsch-2022.sch.2"],"set":{"title":"Buchstaben schreiben","file":"twist/lessons/de-DE/klasse-1/lit-de/print-letters.yaml","lessons":[{"n":1,"title":"Das Häuschen","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Striche und Bögen","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Children write print letters in the Häuschen of four lines: small letters like a, o, m live in the Erdgeschoss, tall ones like l and d reach the Dach, and every capital starts at the top line. Each letter starts at the green dot and is written from top to bottom. Lesson 1 sets out the Häuschen with the letters already known (L, O, A, M); lesson 2 adds i, t, e, n, u and d and ends with the skill check. Tracing and copying carry the writing; short choice tasks ask where a letter starts and which floors it uses."}},{"id":"lit-de.decoding.blend-syllables","domain":"lit-de","topic":"Silben lesen","can":"Ich kann Laute zu Silben zusammenziehen (M-a wird Ma) und offene Silben lesen.","standards":["kmk-deutsch-2022.les.1","kmk-deutsch-2022.les.3"],"set":{"title":"Silben lesen","file":"twist/lessons/de-DE/klasse-1/lit-de/blend-syllables.yaml","lessons":[{"n":1,"title":"Ma, Mo, La, Lo","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Silben werden Wörter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children push two sounds together into a syllable (mmm and aaa make Ma) using only the letters they know: L, O, A and M. Lesson 1 reads open syllables (Ma, Mo, La, Lo): hear and find them, fill the missing vowel, spot them among other cards. Lesson 2 reads syllables that start with a vowel (Al, Om, Am), then joins two syllables into the first words (Ma-ma, O-ma, La-ma) and ends with the skill check."}},{"id":"lit-de.phonological.sounds-in-words","domain":"lit-de","topic":"Laute hören","can":"Ich kann hören, ob ein Laut am Anfang, in der Mitte oder am Ende eines Wortes steht, und kurze Wörter in ihre Laute zerlegen.","standards":["kmk-deutsch-2022.les.1","kmk-deutsch-2022.sch.4"],"set":{"title":"Laute im Wort","file":"twist/lessons/de-DE/klasse-1/lit-de/sounds-in-words.yaml","lessons":[{"n":1,"title":"Anfang, Mitte oder Ende?","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Laute zählen und zusammenschieben","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Children hear where a sound sits in a word (mmm at the start of Maus, in the middle of Oma, at the end of Baum) and split short words into all their sounds. There are no letters yet: everything is spoken, and every picture says its word. Lesson 1 finds the place of a sound; lesson 2 counts the sounds of a word, blends heard sounds into a word, and ends with the skill check."}},{"id":"lit-de.letters.i-ie-s-t","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne I, ie, S und T mit ihren Lauten und lese Wörter wie Mama, Oma, Tisch nur mit bekannten Buchstaben.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"Die Buchstaben I, S, T und ie","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-i-ie-s-t.yaml","lessons":[{"n":1,"title":"Das I","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Das S","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Das T","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":4,"title":"Das ie","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":5,"title":"Wörter mit I, S, T und ie","acts":["warm-up","practise","check"],"tasks":22}],"tasks":106,"summary":"The second letter group in Fibel order. One lesson each for I, S and T: hear the sound, find it in words, see and trace the letter, practised in three stages. Lesson 4 brings ie as the spelling of the long iii (Biene, Ziege) and sets it against the short i in Fisch. Lesson 5 reads the first words made only of known letters (Mast, Tim, Salat, Lisa), sorts pictures by their first letter and ends with the skill check."}},{"id":"lit-de.letters.e-n-d-u","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne E, N, D und U mit ihren Lauten und lese und schreibe Wörter damit.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"Die Buchstaben E, N, D und U","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-e-n-d-u.yaml","lessons":[{"n":1,"title":"Das E","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Das N","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Das D","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":4,"title":"Das U","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":5,"title":"Wörter mit E, N, D und U","acts":["warm-up","practise","check"],"tasks":22}],"tasks":106,"summary":"The third letter group in Fibel order. One lesson each for E, N, D and U: hear the sound, find it in words, see and trace the letter, practised in three stages. Each lesson sets the new sound against its nearest neighbour: E against I, N against M, D against T, U against O (Mund and Mond). Lesson 5 reads words made only of known letters (Nase, Ente, Sonne, Tanne, Mond, Mund) and ends with the skill check."}},{"id":"lit-de.decoding.one-syllable-words","domain":"lit-de","topic":"Silben lesen","can":"Ich kann einsilbige Wörter erlesen und dem passenden Bild zuordnen.","standards":["kmk-deutsch-2022.les.2"],"set":{"title":"Kurze Wörter lesen","file":"twist/lessons/de-DE/klasse-1/lit-de/one-syllable-words.yaml","lessons":[{"n":1,"title":"Laut für Laut","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Bis zum letzten Laut","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children read short words of one syllable, made only from the letters they know so far (L, O, A, M, I, ie, S, T, E, N, D, U): Tal, Mus, Tee, Lied in lesson 1, then words that end in two consonants (Mond, Mund, Nest, Ast, Sand) in lesson 2. They hear a word and find it written, read a word and find its picture, answer a yes or no question about what a word means, and tell apart words that differ in one letter. Lesson 2 ends with the skill check."}},{"id":"lit-de.spelling.write-by-sound","domain":"lit-de","topic":"Erste Wörter schreiben","can":"Ich kann lautgetreue Wörter nach Gehör aufschreiben, indem ich mir jedes Wort langsam vorspreche (Mama, Sofa, Limo).","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sch.5"],"set":{"title":"Schreiben, wie man spricht","file":"twist/lessons/de-DE/klasse-1/lit-de/write-by-sound.yaml","lessons":[{"n":1,"title":"Langsam mitsprechen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Längere Wörter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children write words whose spelling follows their sounds (Oma, Nase, Limo, Tomate), using the letters they know. The strategy is the Mitsprechen: say the word slowly, one sound at a time, and write a letter for each sound. They build words from letter cards, fill the missing letter, count sounds and spot a spelling with a sound left out. Lesson 1 has short words of two open syllables; lesson 2 longer ones (Ente, Tomate, Esel) and ends with the skill check. Writing a whole word freely waits for a letter keyboard or handwriting recognition."}},{"id":"lit-de.letters.p-k-b-f","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne P, K, B und F mit ihren Lauten und unterscheide ähnliche Laute wie P und B.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"Die Buchstaben P, K, B und F","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-p-k-b-f.yaml","lessons":[{"n":1,"title":"Das P","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Das K","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Das B","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":4,"title":"Das F","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":5,"title":"Wörter mit P, K, B und F","acts":["warm-up","practise","check"],"tasks":22}],"tasks":106,"summary":"The fourth letter group in Fibel order. One lesson each for P, K, B and F: hear the sound, find it in words, see and trace the letter, practised in three stages. The hand in front of the mouth tells P (a puff) from B (almost none) and K from T; F is set against S. The shapes b, d and p are set side by side. Lesson 5 reads words made only of known letters (Papa, Kanne, Bus, Boot, Apfel, Telefon) and ends with the skill check."}},{"id":"lit-de.decoding.two-syllable-words","domain":"lit-de","topic":"Silben lesen","can":"Ich kann zweisilbige Wörter Silbe für Silbe erlesen (Ro-se, Ta-sche).","standards":["kmk-deutsch-2022.les.1","kmk-deutsch-2022.les.3"],"set":{"title":"Wörter mit zwei Silben lesen","file":"twist/lessons/de-DE/klasse-1/lit-de/two-syllable-words.yaml","lessons":[{"n":1,"title":"Bogen für Bogen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zwei Buchstaben in der Mitte","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children read words of two syllables bit by bit: first syllable, second syllable, then the whole word. Syllable arcs show where to split. Lesson 1 reads words whose first syllable ends in a vowel (Na-se, O-fen, Pu-del); lesson 2 reads words with a closed first syllable (Son-ne, Tas-se, Kis-te), where two consonants meet in the middle, and ends with the skill check. Only letters already taught are used (up to P, K, B, F)."}},{"id":"lit-de.fluency.sight-words-easy","domain":"lit-de","topic":"Blitzlesen","can":"Ich erkenne häufige kurze Wörter auf einen Blick, auch wenn sie nur kurz zu sehen sind (Blitzlesen).","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.les.6"],"set":{"title":"Blitzlesen","file":"twist/lessons/de-DE/klasse-1/lit-de/sight-words-easy.yaml","lessons":[{"n":1,"title":"und, ist, im, am","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"mit, da, du, so, es","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children learn to know short frequent words at a glance, the way a Blitzlesen card game trains them: the word appears for two seconds and is covered, and the child says which word it was. Lesson 1 works with und, ist, im, am, in and an; lesson 2 with mit, da, du, so and es, and ends with the skill check. Words that look alike (im, in; am, an; um, und) are always set side by side, because that is where a quick look goes wrong."}},{"id":"lit-de.handwriting.copy-words","domain":"lit-de","topic":"Erste Wörter schreiben","can":"Ich kann Wörter fehlerfrei abschreiben, indem ich mir Silben oder ganze Wörter merke.","standards":["kmk-deutsch-2022.sch.1","kmk-deutsch-2022.sch.5"],"set":{"title":"Wörter abschreiben","file":"twist/lessons/de-DE/klasse-1/lit-de/copy-words.yaml","lessons":[{"n":1,"title":"Silbe für Silbe abschreiben","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Ganze Wörter merken","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children copy words without mistakes by the Abschreiben steps a class learns: read the word, remember it, write it from memory, then compare. They copy words onto writing lines, keep a flashed word in mind and pick its spelling, and check a copy against the model. Lesson 1 copies syllable by syllable (So-fa, Do-se); lesson 2 remembers whole words with double letters (Tasse, Sonne, Kanne) and ends with the skill check. The app does not yet compare the child's strokes with the model, so the writing tasks are practice and the check rests on the compare and remember tasks."}},{"id":"lit-de.letters.ei-r-h-w","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne Ei, R, H und W mit ihren Lauten und lese Wörter mit dem Zwielaut ei.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"Ei, R, H und W","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-ei-r-h-w.yaml","lessons":[{"n":1,"title":"Das Ei","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Das R","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Das H","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":4,"title":"Das W","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":5,"title":"Wörter mit Ei, R, H und W","acts":["warm-up","practise","check"],"tasks":22}],"tasks":106,"summary":"The fifth letter group in Fibel order. Lesson 1 brings ei, two letters for one sound (Ei, Eis, Bein), and sets it against the ie met before. Lessons 2 to 4 bring R (against L), H (the puff before a vowel, against words with none) and W (against F). Lesson 5 reads words made only of known letters (Hose, Eis, Wolke, Hase, Leiter, Brot) and ends with the skill check."}},{"id":"lit-de.letters.g-au-sch-z","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne G, Au, Sch und Z mit ihren Lauten und weiß, dass sch drei Buchstaben für einen Laut sind.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"G, Au, Sch und Z","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-g-au-sch-z.yaml","lessons":[{"n":1,"title":"Das G","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Das Au","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Das Sch","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":4,"title":"Das Z","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":5,"title":"Wörter mit G, Au, Sch und Z","acts":["warm-up","practise","check"],"tasks":22}],"tasks":106,"summary":"The sixth letter group in Fibel order. One lesson each: G (against K), au (two letters, one sound: Auto, Haus, Baum), sch (three letters for one sound: Schuh, Fisch, Tisch, against S) and Z (t and s together: Zebra, Katze, against S). Lesson 5 reads words made only of known letters (Auto, Schuh, Ziege, Baum, Igel, Schere) and ends with the skill check."}},{"id":"lit-de.decoding.longer-words","domain":"lit-de","topic":"Silben lesen","can":"Ich kann lange Wörter mit drei und mehr Silben erlesen, indem ich sie in Silben gliedere.","standards":["kmk-deutsch-2022.les.3"],"set":{"title":"Lange Wörter lesen","file":"twist/lessons/de-DE/klasse-1/lit-de/longer-words.yaml","lessons":[{"n":1,"title":"Drei Bögen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Lange Wörter knacken","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children read long words by splitting them into syllables first: Ba-na-ne, Kro-ko-dil, Schmet-ter-ling. Syllable arcs show the split while it is new; later the word stands on a plain card and the child finds the syllables alone. Lesson 1 reads words of three open syllables (Banane, Tomate, Telefon); lesson 2 reads harder long words with sch, ei and consonant clusters (Elefant, Ameise, Schmetterling) and ends with the skill check."}},{"id":"lit-de.decoding.word-picture","domain":"lit-de","topic":"Erste Wörter lesen","can":"Ich kann Wörter genau lesen und ähnliche Wörter unterscheiden (Hose, Rose, Dose).","standards":["kmk-deutsch-2022.les.2"],"set":{"title":"Genau lesen","file":"twist/lessons/de-DE/klasse-1/lit-de/word-picture.yaml","lessons":[{"n":1,"title":"Der erste Buchstabe zählt","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Auch die Mitte zählt","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children read words exactly and tell apart words that differ in one letter: Hose and Rose, Maus and Haus, Tanne, Kanne and Tonne. Every task sets such look-alike words against each other, so a guess from the first letters or the length fails. Lesson 1 changes the first letter (Hose, Rose; Fisch, Tisch); lesson 2 changes a letter in the middle or the end (Tanne, Tonne; Bein, Boot, Brot) and ends with the skill check."}},{"id":"lit-de.nouns.recognise","domain":"lit-de","topic":"Nomen","can":"Ich kann Nomen erkennen (Menschen, Tiere, Pflanzen, Dinge) und weiß, dass man sie großschreibt.","standards":["kmk-deutsch-2022.sp.13","kmk-deutsch-2022.sp.11"],"set":{"title":"Nomen erkennen","file":"twist/lessons/de-DE/klasse-1/lit-de/nouns-recognise.yaml","lessons":[{"n":1,"title":"Menschen, Tiere, Pflanzen, Dinge","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Nomen schreibt man groß","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children learn that Nomen are the names for people, animals, plants and things, and that a Nomen always starts with a capital letter. Lesson 1 sorts pictures into Menschen, Tiere, Pflanzen and Dinge and picks the Nomen out of word groups, written in GROSSBUCHSTABEN so the capital letter does not give the Nomen away; lesson 2 uses the capital letter: find every Nomen in a short sentence, pick the right spelling, and ends with the skill check."}},{"id":"lit-de.nouns.articles","domain":"lit-de","topic":"Nomen","can":"Ich kann zu Nomen den bestimmten Artikel (der, die, das) und den unbestimmten Artikel (ein, eine) finden.","standards":["kmk-deutsch-2022.sp.13"],"set":{"title":"der, die, das und ein, eine","file":"twist/lessons/de-DE/klasse-1/lit-de/nouns-articles.yaml","lessons":[{"n":1,"title":"der, die, das","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"ein und eine","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children find the Begleiter of a Nomen: der, die or das, and then ein or eine. The trick a class uses is to say the word aloud with each Begleiter and listen for the one that sounds right. Lesson 1 practises der, die and das with pictures and short word cards; lesson 2 adds ein and eine, links der and das to ein and die to eine, and ends with the skill check."}},{"id":"lit-de.letters.eu-ch-j","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne Eu, Ch und J mit ihren Lauten und höre die zwei Aussprachen von ch (ich, Dach).","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"Eu, Ch und J","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-eu-ch-j.yaml","lessons":[{"n":1,"title":"Das Eu","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Das Ch","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Das J","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":4,"title":"Wörter mit Eu, Ch und J","acts":["warm-up","practise","check"],"tasks":22}],"tasks":85,"summary":"The seventh letter group in Fibel order. Lesson 1 brings eu, written e and u but spoken oi (Eule, Feuer), set against ei and au. Lesson 2 brings ch and its two sounds: light as in ich and Milch, rough as in Dach and Buch; the child sorts words by the two sounds and keeps ch apart from sch. Lesson 3 brings J (Jacke, Junge), set against the long I. Lesson 4 reads words with all three and ends with the skill check."}},{"id":"lit-de.decoding.word-riddles","domain":"lit-de","topic":"Erste Wörter lesen","can":"Ich kann Wortketten und Worträtsel lesen und lösen.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sp.14"],"set":{"title":"Worträtsel und Wortketten","file":"twist/lessons/de-DE/klasse-1/lit-de/word-riddles.yaml","lessons":[{"n":1,"title":"Rätsel lesen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wortketten und Buchstabensalat","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children read and solve short word puzzles. Lesson 1 reads riddles of two short sentences (\"Ich bin rund. Ich rolle.\") and finds the picture that solves them; the voice never reads the riddle, so the child must. Lesson 2 plays Wortketten, where each word starts with the last letter of the word before (Ball, Lama, Apfel), and Buchstabensalat, where mixed-up letters are put back into a word, and ends with the skill check."}},{"id":"lit-de.spelling.gap-words","domain":"lit-de","topic":"Erste Wörter schreiben","can":"Ich kann in Lückenwörtern fehlende Buchstaben ergänzen und Wörter aus Silben und Buchstaben bauen.","standards":["kmk-deutsch-2022.sch.5","kmk-deutsch-2022.sp.17"],"set":{"title":"Lückenwörter","file":"twist/lessons/de-DE/klasse-1/lit-de/gap-words.yaml","lessons":[{"n":1,"title":"Was fehlt?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wörter bauen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children fill the gaps in words and build words from syllables and letters. Lesson 1 fills one missing letter or letter group, including the ones that are one sound but more letters (sch, ei, au, ch, eu): Fi_ becomes Fisch. Lesson 2 builds words from syllable cards with one card too many and from letter cards, and ends with the skill check. The strategy is always the same: say the word slowly and listen where the gap is."}},{"id":"lit-de.decoding.first-sentences","domain":"lit-de","topic":"Erste Sätze lesen","can":"Ich kann kurze Sätze lesen und das passende Bild dazu finden.","standards":["kmk-deutsch-2022.les.4","kmk-deutsch-2022.les.8"],"set":{"title":"Erste Sätze lesen","file":"twist/lessons/de-DE/klasse-1/lit-de/first-sentences.yaml","lessons":[{"n":1,"title":"Ein Satz und ein Bild","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Genau lesen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"Reading a short sentence to the end and finding the picture that fits. Lesson 1: one sentence of three to five words; the last word decides (Der Ball ist rot, Hier sind drei Eier), so the child reads every word before choosing; the child also builds a sentence from word cards. Lesson 2: sentences that differ in one word (Hund, Mund), two sentences that only together name a thing (Es ist gelb. Es ist am Himmel.), and checking a sentence against a picture; it ends with the skill check. Words use only letters taught so far (up to Eu, Ch and J) and the first sight words. The voice never reads the sentence the child has to read."}},{"id":"lit-de.sentences.word-gaps","domain":"lit-de","topic":"Erste Sätze schreiben","can":"Ich kann Wortgrenzen erkennen, aus durcheinander geratenen Wörtern einen Satz bilden (Satzsalat) und Lückensätze ergänzen.","standards":["kmk-deutsch-2022.les.4","kmk-deutsch-2022.sp.12"],"set":{"title":"Wörter, Lücken und Satzsalat","file":"twist/lessons/de-DE/klasse-1/lit-de/word-gaps.yaml","lessons":[{"n":1,"title":"Wo hört ein Wort auf?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Satzsalat und Lückensätze","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children learn where one word ends and the next begins. Lesson 1 counts the words in a spoken sentence, finds the gaps in a Wortschlange (Lenamaltgern) and spots a sentence with a gap in the wrong place. Lesson 2 builds sentences from muddled word cards (Satzsalat), using the capital letter at the start and the Punkt at the end, fills gap sentences with the word that makes sense, and ends with the skill check."}},{"id":"lit-de.handwriting.copy-sentences","domain":"lit-de","topic":"Erste Sätze schreiben","can":"Ich kann kurze Sätze sauber und fehlerfrei abschreiben, mit Abständen zwischen den Wörtern.","standards":["kmk-deutsch-2022.sch.1","kmk-deutsch-2022.sch.3"],"set":{"title":"Sätze abschreiben","file":"twist/lessons/de-DE/klasse-1/lit-de/copy-sentences.yaml","lessons":[{"n":1,"title":"Wort für Wort abschreiben","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zwei Wörter auf einmal merken","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children copy short sentences without mistakes, with the same Abschreiben steps as for words: read, remember, write, compare. A sentence needs three more things than a word: a gap a finger wide between the words, a capital letter at the start and a Punkt at the end. Lesson 1 copies three-word sentences word by word; lesson 2 remembers two words at a time, checks copies for all three things and ends with the skill check. The app does not yet compare the child's strokes with the model, so the writing tasks are practice and the check rests on the compare, remember and order tasks."}},{"id":"lit-de.letters.umlauts","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne die Umlaute Ä, Ö und Ü mit ihren Lauten und lese Wörter damit.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"Die Umlaute Ä, Ö und Ü","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-umlauts.yaml","lessons":[{"n":1,"title":"Das Ä","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Das Ö","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Das Ü","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":4,"title":"Wörter mit Ä, Ö und Ü","acts":["warm-up","practise","check"],"tasks":22}],"tasks":85,"summary":"One lesson each for Ä, Ö and Ü: hear the sound, set it against the vowel without dots (Käse and Kasse, Möhre and Rose, Tür and Kuh), see that the dots make the difference on the page, and meet the umlaut in the plural (Apfel, Äpfel; Ofen, Öfen; Hut, Hüte). Lesson 4 sorts and reads words with all three (Käse, Löffel, Mütze, Würfel, Königin) and ends with the skill check."}},{"id":"lit-de.letters.st-sp-pf","domain":"lit-de","topic":"Buchstaben","can":"Ich kann St, Sp und Pf am Wortanfang lesen und schreiben und weiß, dass man St wie Scht spricht.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"St, Sp und Pf","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-st-sp-pf.yaml","lessons":[{"n":1,"title":"Das St","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Das Sp","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Das Pf","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":4,"title":"Wörter mit St, Sp und Pf","acts":["warm-up","practise","check"],"tasks":22}],"tasks":85,"summary":"Three letter pairs for the start of words. Lessons 1 and 2: St and Sp are spoken scht and schp at the start of a word but written with S only (Stern, Stuhl, Spiegel); the child hears the sound and chooses the spelling, and keeps St and Sp apart from Sch. Lesson 3: Pf is p and f spoken quickly together (Pferd, Apfel, Kopf), set against F. Lesson 4 sorts and reads words with all three and ends with the skill check."}},{"id":"lit-de.fluency.function-words","domain":"lit-de","topic":"Blitzlesen","can":"Ich erkenne kleine Funktionswörter sofort (und, der, die, das, ist, mit, auf, nicht).","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.5"],"set":{"title":"Kleine Wörter blitzschnell lesen","file":"twist/lessons/de-DE/klasse-1/lit-de/function-words.yaml","lessons":[{"n":1,"title":"der, die, das, den","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"ein, eine, auf, nicht, sind","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Blitzlesen with the small words that hold a sentence together. Lesson 1 takes the Begleiter der, die, das and den; lesson 2 takes ein, eine, auf, nicht and sind, finds them inside short sentences, and ends with the skill check. As in the first Blitzlesen lessons, a word is shown for two seconds and covered, and the options are always words that look alike (der and den, die and sie, auf and aus, ein and eine), because that is where a quick look goes wrong."}},{"id":"lit-de.decoding.read-and-do","domain":"lit-de","topic":"Erste Sätze lesen","can":"Ich kann kurze Arbeitsanweisungen lesen und ausführen (Male den Ball rot an).","standards":["kmk-deutsch-2022.les.8"],"set":{"title":"Lesen und tun","file":"twist/lessons/de-DE/klasse-1/lit-de/read-and-do.yaml","lessons":[{"n":1,"title":"Lie
