first letter; lesson 2 reads words that look alike to the end (snake, snail), two-word names (pencil case) and long words (butterfly), and ends with the skill check. The voice never says the word to be read."}},{"id":"fl.writing.copy-words","domain":"fl","topic":"Schreiben","can":"Ich kann bekannte Wörter richtig abschreiben und Bilder beschriften.","standards":["kmk-fremdsprachen-gs-2013.schreiben"],"set":{"title":"Wörter abschreiben","file":"twist/lessons/de-DE/lernjahr-1/fl/en-copy-words.yaml","lessons":[{"n":1,"title":"Genau abschreiben","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Bilder beschriften","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Copying familiar English words exactly and labelling pictures. Lesson 1 copies short words on writing lines, lays them with letter cards, fills missing letters from a model and spots copying mistakes; lesson 2 labels pictures for a picture dictionary with longer words and double letters (rabbit, yellow, giraffe) and ends with the skill check. The model word is always on screen. Writing is traced with a finger; the app accepts any ink for now, so the skill check uses the card and choice tasks only."}},{"id":"fl.reading.sound-spelling","domain":"fl","topic":"Lesen","can":"Ich weiß, dass man in der Fremdsprache anders schreibt, als man spricht, und erkenne häufige Schreibungen wieder (th, ee, oo).","standards":["kmk-fremdsprachen-gs-2013.lesen","kmk-fremdsprachen-gs-2013.sprachbewusstheit","nc-languages-2014.ks2.foreign-language.2"],"set":{"title":"So spricht man, so schreibt man","file":"twist/lessons/de-DE/lernjahr-1/fl/en-sound-spelling.yaml","lessons":[{"n":1,"title":"ee und oo","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"sh, ch und th","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"English is not written the way it sounds. Lesson 1 links ee with a long German i (tree, bee) and oo with a German u (moon, book); lesson 2 links sh with sch, ch with tsch and th with a sound German does not have (three, mouth), and ends with the skill check. Children hear words and choose the spelling, sort pictures by the spelling of their word, fill the missing letters and find words with a spelling."}},{"id":"fl.reading.sentences","domain":"fl","topic":"Lesen","can":"Ich kann kurze Sätze mit bekannten Wörtern lesen und verstehen und dem passenden Bild zuordnen.","standards":["kmk-fremdsprachen-gs-2013.lesen","nc-languages-2014.ks2.foreign-language.7"],"set":{"title":"Kurze Sätze lesen","file":"twist/lessons/de-DE/lernjahr-1/fl/en-sentences.yaml","lessons":[{"n":1,"title":"Satz lesen, Bild finden","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Bild ansehen, Satz finden","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading short English sentences made of familiar words and matching them to pictures. Lesson 1 reads a sentence and finds its picture, where every word counts (a red ball, not a red car); lesson 2 goes the other way, from a picture to its sentence, reads sentences with not, isn't and can't, and ends with the skill check. The voice never reads the sentence to be understood."}},{"id":"fl.writing.words-from-memory","domain":"fl","topic":"Schreiben","can":"Ich kann geübte Wörter aus dem Gedächtnis schreiben und dabei eine Wörterliste zum Nachschauen nutzen.","standards":["kmk-fremdsprachen-gs-2013.schreiben","kmk-fremdsprachen-gs-2013.sprachlernkompetenz","nc-languages-2014.ks2.foreign-language.10"],"set":{"title":"Wörter aus dem Kopf schreiben","file":"twist/lessons/de-DE/lernjahr-1/fl/en-words-from-memory.yaml","lessons":[{"n":1,"title":"Ansehen, zudecken, schreiben, prüfen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"In der Wörterliste nachschauen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Writing practised words without a model and checking them in a word list. Lesson 1 learns look, cover, write, check: the child sees only the picture and lays the word with letter cards (with one card too many), fills missing letters or picks the right spelling. Lesson 2 checks words in an alphabetical word list, finds and corrects mistakes, and ends with the skill check. Typing whole words waits for a letter keyboard; the letter cards stand in for it."}},{"id":"fl.themes.numbers-to-20","domain":"fl","topic":"Zahlen","can":"Ich kann bis 20 zählen, Zahlen bis 20 verstehen und nach Alter und Telefonnummer fragen.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Zahlen bis 20 auf Englisch","file":"twist/lessons/de-DE/lernjahr-1/fl/en-numbers-to-20.yaml","lessons":[{"n":1,"title":"eleven to fifteen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"How old are you?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The numbers eleven to twenty, asking someone's age and saying a phone number. Lesson 1 brings eleven to fifteen and counts on from ten; lesson 2 adds sixteen to twenty, \"How old are you? I'm …\" and phone numbers said digit by digit (zero said as \"oh\"), and ends with the skill check. Children read numerals; the number words are spoken."}},{"id":"fl.listening.details","domain":"fl","topic":"Hören","can":"Ich kann aus einem kurzen Hörtext gezielt Einzelheiten heraushören (Zahlen, Farben, Uhrzeiten, Namen).","standards":["kmk-fremdsprachen-gs-2013.hoeren"],"set":{"title":"Genau hinhören","file":"twist/lessons/de-DE/lernjahr-1/fl/en-details.yaml","lessons":[{"n":1,"title":"Zahlen und Farben heraushören","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Namen und Uhrzeiten heraushören","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Picking one detail out of a short recording. Lesson 1 listens for numbers (an age, how many, a bus number) and colours; lesson 2 listens for names and times on the hour (at four o'clock), and ends with the skill check. Every recording holds a second number, colour or name, so the child must listen for the one the question asks about."}},{"id":"fl.themes.clothes","domain":"fl","topic":"Kleidung","can":"Ich kann Kleidungsstücke benennen und sagen, was jemand trägt.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Kleidung auf Englisch","file":"twist/lessons/de-DE/lernjahr-1/fl/en-clothes.yaml","lessons":[{"n":1,"title":"jumper, jacket, dress, skirt","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"a red jumper","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Clothes words, clothes with a colour, and saying what you are wearing. Lesson 1 brings jumper, jacket, dress and skirt next to the familiar T-shirt, trousers, shoes and hat; lesson 2 puts a colour before the word (a red jumper), says \"I'm wearing …\", and ends with the skill check. Instructions are in German; the English is spoken and shown in short form."}},{"id":"fl.themes.home","domain":"fl","topic":"Zu Hause","can":"Ich kann Zimmer und Möbel benennen und sagen, wo etwas im Haus ist.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Zu Hause","file":"twist/lessons/de-DE/lernjahr-1/fl/en-home.yaml","lessons":[{"n":1,"title":"Möbel und Sachen im Haus","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Zimmer","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Rooms and furniture. Lesson 1 learns the furniture and things in a house by ear and picture (bed, table, chair, lamp, mirror, clock, telephone, oven); lesson 2 learns the rooms (kitchen, bathroom, bedroom, living room, garden), says which room something is in (The oven is in the kitchen.), and ends with the skill check. The rooms and the garden are shown as pictures. Speaking tasks are practice only."}},{"id":"fl.grammar.prepositions","domain":"fl","topic":"Sprachmuster","can":"Ich kann sagen, wo etwas ist (in, on, under, next to, behind).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Wo ist es? in, on, under, next to, behind","file":"twist/lessons/de-DE/lernjahr-1/fl/en-prepositions.yaml","lessons":[{"n":1,"title":"in, on, under","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"next to und behind","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Saying where something is. Lesson 1 brings in, on and under (on means auf, not an); lesson 2 adds next to and behind, answers Where is ...? with It's ..., and ends with the skill check. Children hear where things are and choose the German meaning, fill the gap, build the sentence and say it. A picture of a scene (a cat under a table) needs a scene component the bank does not have yet, so the tasks work with words and sentences."}},{"id":"fl.themes.town","domain":"fl","topic":"In der Stadt","can":"Ich kann Orte in der Stadt benennen und einfache Wegbeschreibungen verstehen.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel","kmk-fremdsprachen-gs-2013.hoeren"],"set":{"title":"In der Stadt","file":"twist/lessons/de-DE/lernjahr-1/fl/en-town.yaml","lessons":[{"n":1,"title":"Orte in der Stadt","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Nach dem Weg fragen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Places in town and simple directions. Lesson 1 learns the places (school, park, shop, library, station, swimming pool, bus stop) and what you do there; lesson 2 understands turn left, turn right and go straight on, follows a short way to a place, and ends with the skill check. The places are shown as pictures (the bus stop as its sign). Directions are shown as arrows. Following a way on a map waits for a map component."}},{"id":"fl.themes.feelings","domain":"fl","topic":"Gefühle","can":"Ich kann sagen, wie ich mich fühle, und fragen, wie es anderen geht (I am happy. Are you tired?).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel","kmk-fremdsprachen-gs-2013.sprechen"],"set":{"title":"Gefühle auf Englisch","file":"twist/lessons/de-DE/lernjahr-1/fl/en-feelings.yaml","lessons":[{"n":1,"title":"I'm happy.","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Are you tired?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Saying how you feel and asking others. Lesson 1 brings happy, sad, angry, tired and scared with \"I'm …\"; lesson 2 asks \"Are you …?\" with the short answers \"Yes, I am.\" and \"No, I'm not.\", and ends with the skill check. Instructions are in German; the English is spoken and shown in short form."}},{"id":"fl.themes.food","domain":"fl","topic":"Essen und Trinken","can":"Ich kann Essen und Getränke benennen, sagen, was ich gern esse, und höflich etwas bestellen.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Essen und Trinken auf Englisch","file":"twist/lessons/de-DE/lernjahr-1/fl/en-food.yaml","lessons":[{"n":1,"title":"I like pizza","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Can I have some juice, please?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Food and drink words, saying what you like and do not like, and asking politely for something. Lesson 1 brings bread, cheese, pizza and ice cream with \"I like …\" and \"I don't like …\"; lesson 2 adds milk, juice and water, \"Can I have …, please?\" and \"Do you like …? Yes, I do. / No, I don't.\", and ends with the skill check. Instructions are in German; the English is spoken and shown in short form."}},{"id":"fl.speaking.describe","domain":"fl","topic":"Sprechen","can":"Ich kann eine Person, ein Tier oder ein Ding mit wenigen Sätzen beschreiben (It is big. It has got a long tail.).","standards":["kmk-fremdsprachen-gs-2013.sprechen","nc-languages-2014.ks2.foreign-language.4","nc-languages-2014.ks2.foreign-language.11"],"set":{"title":"Tiere beschreiben","file":"twist/lessons/de-DE/lernjahr-1/fl/en-describe.yaml","lessons":[{"n":1,"title":"Tierrätsel","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Selbst beschreiben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Describing an animal in a few sentences: It's big and grey. It has got big ears. Lesson 1 understands animal riddles, heard and read, and finds the animal; lesson 2 builds descriptions with It's ... and It has got ..., plural body parts (four legs, two ears) and My cat is ..., and ends with the skill check. Speaking tasks are practice only; the skill check asks for the building blocks of a description."}},{"id":"fl.speaking.role-play","domain":"fl","topic":"Sprechen","can":"Ich kann in kurzen Alltagsgesprächen mitspielen, zum Beispiel beim Einkaufen oder im Café, mit vorgegebenen Redemitteln.","standards":["kmk-fremdsprachen-gs-2013.sprechen","nc-languages-2014.ks2.foreign-language.3"],"set":{"title":"Kleine Rollenspiele","file":"twist/lessons/de-DE/lernjahr-1/fl/en-role-play.yaml","lessons":[{"n":1,"title":"Im Laden","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Auf dem Spielplatz","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Two short everyday scenes with fixed phrases. Lesson 1 is in a shop: Finn buys fruit from Mrs Hill (Can I help you? Can I have …, please? Here you are. How much is it? One pound, please.). Lesson 2 is on a playground in England, where Paula meets Jack (What's your name? Nice to meet you. How old are you? Have you got a pet? Do you want to play?), and it ends with the skill check. The child picks the reply that fits, puts a scene's lines in order and speaks one part. Speaking is practised, not marked; the checks ask for the fitting reply, the order and details heard in a scene."}},{"id":"fl.themes.calendar","domain":"fl","topic":"Kalender","can":"Ich kann Wochentage, Monate und Jahreszeiten nennen und sagen, wann ich Geburtstag habe.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Tage, Monate, Geburtstag","file":"twist/lessons/de-DE/lernjahr-1/fl/en-calendar.yaml","lessons":[{"n":1,"title":"Monday, Tuesday","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"When's your birthday?","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Lesson 1 brings the days of the week, in order, and \"What day is it today? It's Monday.\", with the weekend and the days that are easy to mix up (Tuesday and Thursday). Lesson 2 brings the twelve months, the four seasons and \"When's your birthday? It's in May.\", and ends with the skill check. Instructions are in German; the English is spoken and shown, and a table shows the days and months in order."}},{"id":"fl.themes.weather","domain":"fl","topic":"Wetter","can":"Ich kann das Wetter beschreiben und einen einfachen Wetterbericht verstehen.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel","kmk-fremdsprachen-gs-2013.hoeren"],"set":{"title":"Das Wetter auf Englisch","file":"twist/lessons/de-DE/lernjahr-1/fl/en-weather.yaml","lessons":[{"n":1,"title":"It's sunny.","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"What's the weather like?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Describing the weather and understanding a short weather report. Lesson 1 brings sunny, rainy, cloudy, snowy and windy with \"It's …\"; lesson 2 adds hot and cold, asks \"What's the weather like?\", picks out the weather in a short report for two days, and ends with the skill check. Instructions are in German; the English is spoken and shown in short form."}},{"id":"fl.culture-strategies.where-spoken","domain":"fl","topic":"Die Welt der Sprache","can":"Ich weiß, in welchen Ländern die Fremdsprache gesprochen wird, und kenne einige Orte, Menschen und Dinge von dort.","standards":["kmk-fremdsprachen-gs-2013.interkulturell"],"set":{"title":"Wo man Englisch spricht","file":"twist/lessons/de-DE/lernjahr-1/fl/en-where-spoken.yaml","lessons":[{"n":1,"title":"Wo spricht man Englisch?","acts":["learn","practise","check"],"tasks":20},{"n":2,"title":"Zu Besuch in London","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":44,"summary":"Where English comes from and where it is spoken today. Lesson 1 names the countries: England, Scotland, Wales and Northern Ireland, then Ireland, the USA, Canada, Australia and New Zealand, and the child hears children say where they are from. Lesson 2 visits London and brings a few places and things from there (the red bus, Big Ben, fish and chips, a cup of tea, the pound, driving on the left), and ends with the skill check. Questions and answers are in German; the English is spoken."}},{"id":"fl.culture-strategies.guess-meaning","domain":"fl","topic":"Lernstrategien","can":"Ich kann die Bedeutung unbekannter Wörter mit Hilfe von Bildern, Gesten und dem Zusammenhang erraten.","standards":["kmk-fremdsprachen-gs-2013.sprachlernkompetenz","nc-languages-2014.ks2.foreign-language.9"],"set":{"title":"Neue Wörter erraten","file":"twist/lessons/de-DE/lernjahr-1/fl/en-guess-meaning.yaml","lessons":[{"n":1,"title":"Bilder und ähnliche Wörter","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Der Satz und die Hände helfen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Working out what an unknown English word means instead of giving up. Lesson 1 brings two tricks: look at the picture (hedgehog, snail, octopus) and listen for a German word that sounds alike (garden, summer, milk), with a warning that a word can sound alike and still mean something else (butterfly). Lesson 2 adds two more: the words you know in the sentence (thirsty next to water) and what the speaker does (a wave, a finger on the lips), and ends with the skill check. The English is spoken; questions and answers are in German."}},{"id":"fl.culture-strategies.learn-words","domain":"fl","topic":"Lernstrategien","can":"Ich kenne Wege, mir neue Wörter zu merken (mit Bildern, Bewegungen, Wörterkarten), und nutze ein Bildwörterbuch.","standards":["kmk-fremdsprachen-gs-2013.sprachlernkompetenz","nc-languages-2014.ks2.foreign-language.9"],"set":{"title":"Wörter lernen und behalten","file":"twist/lessons/de-DE/lernjahr-1/fl/en-learn-words.yaml","lessons":[{"n":1,"title":"Bildkarten und Bewegungen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Wörterheft und Bildwörterbuch","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Ways to remember new English words. Lesson 1 brings picture cards (picture on the front, word on the back), saying the word aloud with a movement (jump, clap, wave), and a few words each day instead of many at once. Lesson 2 brings the word notebook (English on the left, German on the right), sorting words by topic, and finding words in a picture dictionary by topic and by ABC, and ends with the skill check. Instructions are in German; the English words are read and heard."}},{"id":"fl.culture-strategies.mediate","domain":"fl","topic":"Sprachmittlung","can":"Ich kann jemandem auf Deutsch sagen, was auf einem einfachen Schild oder in einem kurzen Satz in der Fremdsprache steht.","standards":["kmk-fremdsprachen-gs-2013.sprachmittlung"],"set":{"title":"Für Oma auf Deutsch sagen","file":"twist/lessons/de-DE/lernjahr-1/fl/en-mediate.yaml","lessons":[{"n":1,"title":"Was steht auf dem Schild?","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Kurze Sätze weitersagen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Sprachmittlung: telling someone in German what a short English sign or sentence means. The Becker family is on holiday in London and Grandma speaks no English. Lesson 1 explains signs (OPEN, CLOSED, PUSH, PULL, TOILETS, NO DOGS, WAY OUT) by saying what they mean rather than word for word. Lesson 2 passes on short spoken and written sentences (a waiter, a bus driver, a card from a friend), turning \"I\" into the person who said it, and ends with the skill check. The English is read or heard; the answers are in German."}}]},{"id":"lernjahr-2","label":"2. Lernjahr","skills":[{"id":"fl.themes.hobbies","domain":"fl","topic":"Hobbys und Sport","can":"Ich kann Hobbys und Sportarten benennen und sagen, was ich kann und gern mache.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Hobbys und Sport","file":"twist/lessons/de-DE/lernjahr-2/fl/en-hobbies.yaml","lessons":[{"n":1,"title":"Was machst du gern?","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"I can ... und I like ...","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Lernjahr 2 opens with hobbies and sports: the words (football, swim, dance, paint, read, tennis, guitar, ride a bike, sing) and two chunks to talk about them, I can ... and I like ... . Lesson 1 learns the words by ear and picture; lesson 2 reads and builds short sentences about what someone can do and likes, and ends with the skill check. Speaking tasks are practice only."}},{"id":"fl.themes.numbers-to-100","domain":"fl","topic":"Zahlen","can":"Ich kann Zahlen bis 100 verstehen und sagen und Preise nennen.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Zahlen bis 100 und Preise auf Englisch","file":"twist/lessons/de-DE/lernjahr-2/fl/en-numbers-to-100.yaml","lessons":[{"n":1,"title":"twenty-four","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"How much is it?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The tens and the two-digit numbers to 100, and prices in pence. Lesson 1 brings twenty to a hundred and numbers like twenty-four, where English says the tens first, the other way round from German; lesson 2 asks \"How much is it?\" and answers with prices in pence, said the everyday British way (\"It's forty-five p.\"), and ends with the skill check. Instructions are in German; children read numerals and the English is spoken and shown in short form."}},{"id":"fl.themes.time","domain":"fl","topic":"Uhrzeit","can":"Ich kann nach der Uhrzeit fragen und volle und halbe Stunden angeben.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Die Uhrzeit auf Englisch","file":"twist/lessons/de-DE/lernjahr-2/fl/en-time.yaml","lessons":[{"n":1,"title":"It's three o'clock.","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Half past four","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Asking for the time and saying full and half hours. Lesson 1 brings \"What time is it? It's three o'clock.\"; lesson 2 adds half past (half past four is halb fünf in German: English names the hour that has passed, German the hour that is coming), and ends with the skill check. Instructions are in German; the English is spoken and shown in short form."}},{"id":"fl.grammar.he-she-it","domain":"fl","topic":"Sprachmuster","can":"Ich kann über andere Personen sprechen und das Verb dabei anpassen (She likes ..., He has got ...).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel","kmk-fremdsprachen-gs-2013.sprachbewusstheit","nc-languages-2014.ks2.foreign-language.12"],"set":{"title":"Über andere sprechen","file":"twist/lessons/de-DE/lernjahr-2/fl/en-he-she.yaml","lessons":[{"n":1,"title":"She likes, he plays","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"He has got, she is","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Talking about other people with he and she, and the verb changes that go with it. Lesson 1 sets I like against she likes and I can swim against he can swim (no s after can); lesson 2 sets I have got against he has got and I am against she is, and ends with the skill check. Instructions are in German; the English is spoken and shown in short form."}},{"id":"fl.grammar.now-and-routine","domain":"fl","topic":"Sprachmuster","can":"Ich kann sagen, was jemand gerade tut, und was jemand jeden Tag tut (She is reading. I play football on Mondays.).","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Gerade jetzt und jeden Tag","file":"twist/lessons/de-DE/lernjahr-2/fl/en-now-and-routine.yaml","lessons":[{"n":1,"title":"Was macht sie gerade?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Jetzt oder jeden Tag?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"English has two forms where German has one: She is reading (gerade jetzt) and She reads every day (immer wieder). Lesson 1 says what someone is doing right now with is …-ing, to pictures; lesson 2 sets routines with every day, on Saturdays and the -s for he and she against right now, and ends with the skill check."}},{"id":"fl.themes.jobs","domain":"fl","topic":"Berufe","can":"Ich kann Berufe benennen und sagen, was jemand bei der Arbeit macht.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel"],"set":{"title":"Berufe auf Englisch","file":"twist/lessons/de-DE/lernjahr-2/fl/en-jobs.yaml","lessons":[{"n":1,"title":"He's a doctor.","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"What do you want to be?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Naming jobs and saying what someone does at work. Lesson 1 brings doctor, teacher, farmer, cook, police officer and firefighter with \"He's a …\" and \"She's a …\" (the English job word is the same for women and men); lesson 2 says what each one does (A cook cooks food.) and asks \"What do you want to be?\", with \"I want\", not \"I will\", for ich will, and ends with the skill check. Instructions are in German; the English is spoken and shown in short form."}},{"id":"fl.themes.special-days","domain":"fl","topic":"Feste","can":"Ich kenne Wörter und Bräuche zu Festen wie Geburtstag, Halloween, Weihnachten und Ostern.","standards":["kmk-fremdsprachen-gs-2013.sprachliche-mittel","kmk-fremdsprachen-gs-2013.interkulturell"],"set":{"title":"Feste feiern","file":"twist/lessons/de-DE/lernjahr-2/fl/en-special-days.yaml","lessons":[{"n":1,"title":"Geburtstag und Weihnachten","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Ostern, Halloween und Bonfire Night","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Words, greetings and customs for special days in England. Lesson 1 brings birthdays (Happy birthday!, cake, candles, presents, balloons) and Christmas (Merry Christmas!, Christmas tree, Father Christmas, the stocking, presents on the morning of 25 December rather than on Heiligabend). Lesson 2 brings Easter (Easter eggs, the Easter bunny, the egg hunt), Halloween (witch, ghost, pumpkin, Trick or treat!) and Bonfire Night on 5 November (bonfire, fireworks), and ends with the skill check. The child reads and completes short greetings for cards."}},{"id":"fl.listening.video","domain":"fl","topic":"Hören","can":"Ich verstehe kurze Videos und Animationen zu bekannten Themen mit Hilfe der Bilder.","standards":["kmk-fremdsprachen-gs-2013.hoeren"],"set":{"title":"Kurze Clips verstehen","file":"twist/lessons/de-DE/lernjahr-2/fl/en-video.yaml","lessons":[{"n":1,"title":"Worum geht es im Clip?","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Genau hinschauen und hinhören","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Short clips and cartoons on familiar topics: a dog in the park, baking a cake, the weather report, a visit to the zoo, a race between a snail and a bird. Each clip is a few spoken lines with its pictures on screen, so the child can use what it sees to understand what it hears. Lesson 1 finds what a clip is about with the help of the pictures; lesson 2 listens for details and the order of the scenes, and ends with the skill check. Questions are in German or pictures, so the task tests listening."}},{"id":"fl.reading.short-texts","domain":"fl","topic":"Lesen","can":"Ich kann kurze Texte mit Bildern lesen (Bilderbuchseite, Comic, Steckbrief) und das Wesentliche verstehen.","standards":["kmk-fremdsprachen-gs-2013.lesen","nc-languages-2014.ks2.foreign-language.7"],"set":{"title":"Kurze Texte lesen","file":"twist/lessons/de-DE/lernjahr-2/fl/en-short-texts.yaml","lessons":[{"n":1,"title":"Steckbriefe und Postkarten","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Geschichten und Comics","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Reading short English texts with pictures and understanding the main points: a profile, a postcard from the seaside, a picture-book page about a lost cat, a small comic. Lesson 1 reads profiles and postcards and finds who writes, where they are and what they do; lesson 2 reads short stories and comics, finds who is in them and what happens, puts the events in order, and ends with the skill check. The voice gives the instructions in German and does not read the English text, so the task tests reading."}},{"id":"fl.reading.find-information","domain":"fl","topic":"Lesen","can":"Ich kann einfachen Alltagstexten Informationen entnehmen, zum Beispiel einer Speisekarte, einem Stundenplan oder einer Einladung.","standards":["kmk-fremdsprachen-gs-2013.lesen"],"set":{"title":"Informationen finden","file":"twist/lessons/de-DE/lernjahr-2/fl/en-find-information.yaml","lessons":[{"n":1,"title":"Speisekarten und Stundenpläne","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Einladungen und Plakate","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Finding one piece of information in an everyday English text without reading every word: a café menu, a school timetable, a party invitation, a poster for a school fun day. Lesson 1 reads menus and timetables, drawn as tables, and finds a price, a day or a lesson by row and column; lesson 2 reads invitations and posters and finds when, where and what to bring, and ends with the skill check. The voice asks in German and does not read the English text."}},{"id":"fl.writing.complete-sentences","domain":"fl","topic":"Schreiben","can":"Ich kann Sätze nach einem Muster ergänzen und eigene kurze Sätze danach schreiben (I like ... I have got ...).","standards":["kmk-fremdsprachen-gs-2013.schreiben","nc-languages-2014.ks2.foreign-language.10"],"set":{"title":"Sätze nach Muster schreiben","file":"twist/lessons/de-DE/lernjahr-2/fl/en-complete-sentences.yaml","lessons":[{"n":1,"title":"Das Muster ergänzen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Eigene Sätze nach Muster","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Completing English sentences from a model and building new ones to the same pattern: I like ..., I have got a ..., I can ..., I am ... . Lesson 1 fills the gap in a model sentence from a picture and learns which pattern says what; lesson 2 changes one part of a model to make a new sentence of the child's own, with a capital I, a full stop and a or an, and ends with the skill check. The child writes by choosing word cards and putting them in order; free writing is not marked."}},{"id":"fl.writing.short-text","domain":"fl","topic":"Schreiben","can":"Ich kann mit Hilfe eines Mustertextes einen kurzen Text über mich schreiben, zum Beispiel einen Steckbrief, eine Postkarte oder eine Einladung.","standards":["kmk-fremdsprachen-gs-2013.schreiben","nc-languages-2014.ks2.foreign-language.11"],"set":{"title":"Einen kurzen Text schreiben","file":"twist/lessons/de-DE/lernjahr-2/fl/en-short-text.yaml","lessons":[{"n":1,"title":"Ein Text über mich","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Eine Postkarte schreiben","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Writing a short English text about oneself from a model: an About me profile and a holiday postcard. Lesson 1 takes an About me text apart (name, age, family, pets, likes, can) and builds a new one for a given child; lesson 2 learns the parts of a postcard (Dear ..., where you are, the weather, what you do, Love, ...) and puts one together, and ends with the skill check. The child writes by choosing, ordering and filling gaps; free writing is not marked."}},{"id":"fl.speaking.about-me","domain":"fl","topic":"Sprechen","can":"Ich kann in einigen zusammenhängenden Sätzen über mich erzählen (Familie, Hobbys, was ich gern mache).","standards":["kmk-fremdsprachen-gs-2013.sprechen"],"set":{"title":"Über mich erzählen","file":"twist/lessons/de-DE/lernjahr-2/fl/en-speak-about-me.yaml","lessons":[{"n":1,"title":"Das bin ich","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Was ich gern mache","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Talking about oneself in a few connected sentences: name, age, where you live, family, pets, hobbies and what you like doing. Lesson 1 listens to children introducing themselves and says the first sentences about name, age and family; lesson 2 adds hobbies and likes, joins sentences with and, but and too, and ends with the skill check. Speaking tasks are practice only; the skill check asks for the building blocks of a short talk by listening, choosing and ordering."}},{"id":"fl.speaking.present","domain":"fl","topic":"Sprechen","can":"Ich kann einen kurzen, vorbereiteten Text vortragen, zum Beispiel mein Haustier oder mein Lieblingstier vorstellen.","standards":["kmk-fremdsprachen-gs-2013.sprechen","nc-languages-2014.ks2.foreign-language.6"],"set":{"title":"Etwas kurz vorstellen","file":"twist/lessons/de-DE/lernjahr-2/fl/en-present.yaml","lessons":[{"n":1,"title":"Mein Haustier","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Mein Hobby, mein Lieblingsding","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Giving a short prepared talk in English: my pet, my favourite animal, my hobby, a show-and-tell object. Lesson 1 listens to children presenting their pets and learns the three parts of a talk (a start, three or four facts, an end), then presents a pet or a favourite animal; lesson 2 presents a hobby or a favourite thing, with This is my ... and I like it because ..., and ends with the skill check. Speaking tasks are practice only; the skill check asks for the parts of a talk by listening, choosing and ordering."}},{"id":"fl.culture-strategies.compare-daily-life","domain":"fl","topic":"Die Welt der Sprache","can":"Ich kann den Alltag von Kindern in anderen Ländern mit meinem vergleichen (Schule, Essen, Feste) und Gemeinsamkeiten und Unterschiede nennen.","standards":["kmk-fremdsprachen-gs-2013.interkulturell"],"set":{"title":"Alltag in England und bei uns","file":"twist/lessons/de-DE/lernjahr-2/fl/en-daily-life.yaml","lessons":[{"n":1,"title":"Ein Schultag in England","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Frühstück und Feste","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Comparing a child's day in England with a day here, through Amy, who is nine and lives in England. Lesson 1 is about school: the school uniform, a school day from nine o'clock to half past three, lunch at school (school dinner or packed lunch), and starting school at four or five, so that Amy is in Year 5. Lesson 2 is about breakfast (cereal, toast, the big breakfast at the weekend) and celebrations (Bonfire Night here and not St Martin), and ends with the skill check. Every lesson names what is the same as well as what differs, and says \"many children\", not \"all children\"."}},{"id":"fl.culture-strategies.self-check","domain":"fl","topic":"Lernstrategien","can":"Ich kann einschätzen, was ich in der Fremdsprache schon kann, und mir ein nächstes Ziel setzen.","standards":["kmk-fremdsprachen-gs-2013.sprachlernkompetenz"],"set":{"title":"Was kann ich schon?","file":"twist/lessons/de-DE/lernjahr-2/fl/en-self-check.yaml","lessons":[{"n":1,"title":"I can … oder I'm still learning …","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Mein nächstes Ziel","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Judging honestly what you can already do in English and setting a next goal. Lesson 1 brings \"I can …\" and \"I'm still learning …\", and the rule that you can do something when it works without help, several times; short self-tests (a colour, a number, a day) stand for checking yourself. Lesson 2 chooses a next goal that is one step on (not too easy, not too hard), picks a way to practise from the word-learning tips, and checks again after a few days; it ends with the skill check. Instructions are in German; the I can sentences are read and spoken in English."}}]}]},{"id":"en-GB","title":"England","lang":"en","subjects":{"math":"Maths","lit-en":"English","fl":"French"},"frameworks":["eyfs-2026","nc-maths-2014","nc-english-2014","nc-languages-2014"],"facets":{"currency":"gbp","number-format":"en","operation-signs":"en","units":"metric-imperial","time-format":"en-12h-24h","date-format":"en-gb","written-subtraction":"column-exchange"},"years":[{"id":"reception","label":"Reception","skills":[{"id":"math.numbers-to-20.count-to-5","domain":"math","topic":"Numbers to 10","can":"I can count up to 5 objects reliably and say how many there are.","standards":["kmk-mathe-2022.zo.2"],"set":{"title":"Counting to 5","file":"twist/lessons/en-GB/reception/math/count-to-5.yaml","lessons":[{"n":1,"title":"Zählen bis 3","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Zählen bis 5","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"The first maths lessons of Reception. Children count up to five things by touching each one once, and learn that the last number they say tells them how many there are. Lesson 1 counts to 3, lesson 2 to 5, including things that are spread out, and ends with the skill check. Everything is spoken; number options say themselves when tapped."}},{"id":"math.numbers-to-20.count-to-10","domain":"math","topic":"Numbers to 10","can":"I can count up to 10 objects, even when they are scattered.","standards":["kmk-mathe-2022.zo.2","eyfs-2026.elg.number.1"],"set":{"title":"Counting to 10","file":"twist/lessons/en-GB/reception/math/count-to-10.yaml","lessons":[{"n":1,"title":"Zählen bis 10","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Durcheinander zählen","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Children count up to ten things. Lesson 1 counts things in a line, where it is easy to keep track; lesson 2 counts things that are spread out, where the trick is to mark each one as you count it (tapping does that), and ends with the skill check. All spoken; number options say themselves."}},{"id":"math.numbers-to-20.subitize-to-10","domain":"math","topic":"Numbers to 10","can":"I can see amounts up to 10 at a glance, on dice, fingers or a ten-frame, using groups of 5.","standards":["kmk-mathe-2022.msf.1","eyfs-2026.elg.number.2"],"set":{"title":"Seeing amounts at a glance","file":"twist/lessons/en-GB/reception/math/subitize-to-10.yaml","lessons":[{"n":1,"title":"Würfelbilder","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Die Kraft der 5","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Children see how many without counting one by one (subitising). Lesson 1 uses dice patterns to 5, shown for two seconds, as the EYFS goal asks. Lesson 2 goes on to \"five and a bit\": a full row of a ten frame is five, and seven is five and two. It ends with the skill check."}},{"id":"math.numbers-to-20.order-to-10","domain":"math","topic":"Numbers to 10","can":"I can put the numbers to 10 in order and name the number before and after.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y1.number-number-and-place-value.3","eyfs-2026.elg.numerical-patterns.1"],"set":{"title":"Numbers in order to 10","file":"twist/lessons/en-GB/reception/math/order-to-10.yaml","lessons":[{"n":1,"title":"Der Reihe nach","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Eins mehr, eins weniger","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Children learn the order of the numbers to 10 by counting forwards and backwards, putting amounts in order from fewest to most, and finding one more and one less, as in the EYFS. Written numerals come in Year 1, so everything is spoken or shown as an amount; number options say themselves. Lesson 1 is the order, lesson 2 is one more and one less and ends with the skill check."}},{"id":"math.numbers-to-20.compare-to-10","domain":"math","topic":"Numbers to 10","can":"I can compare amounts and numbers to 10 and use the signs \u003c, > and =.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y1.number-number-and-place-value.4","eyfs-2026.elg.numerical-patterns.2"],"set":{"title":"Comparing to 10","file":"twist/lessons/en-GB/reception/math/compare-to-10.yaml","lessons":[{"n":1,"title":"Mehr, weniger, gleich viele","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Zahlen vergleichen","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Children compare amounts to 10 with the words more, fewer and the same, as the EYFS asks. Lesson 1 compares groups, lined up so the pairs can be seen; lesson 2 compares numbers out loud (\"Which is more, six or four?\") and ends with the skill check. The signs \u003c > = come in Year 1."}},{"id":"math.numbers-to-20.partition-to-10","domain":"math","topic":"Numbers to 10","can":"I can split any number up to 10 into two parts in different ways (number bonds).","standards":["kmk-mathe-2022.zo.5","kmk-mathe-2022.msf.3","nc-maths-2014.y1.number-addition-and-subtraction.2","eyfs-2026.elg.number.1"],"set":{"title":"Number bonds to 10","file":"twist/lessons/en-GB/reception/math/partition-to-10.yaml","lessons":[{"n":1,"title":"Die Teile der 5","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Die Teile der 10","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Children split numbers into two parts and see that the parts make the whole again, using the part-whole model taught in England. Lesson 1 takes the parts of 5 with counters and the part-whole model; lesson 2 takes the parts of 10 on the ten frame and ends with the skill check. The EYFS goal is number bonds to 5 and some to 10. No written sums: the model and spoken questions carry it."}},{"id":"math.add-sub-to-20.add-meaning","domain":"math","topic":"Adding and subtracting to 10","can":"I can find the addition that matches a picture or story of putting together or adding more.","standards":["kmk-mathe-2022.zo.4"],"set":{"title":"Adding more","file":"twist/lessons/en-GB/reception/math/add-meaning.yaml","lessons":[{"n":1,"title":"Es kommen noch mehr","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Zusammen","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"The first adding: more things come along, or two groups are put together. EYFS children tell it as a First, Then, Now story (first there were 3 ducks, then 2 more came, now there are 5). Lesson 1 adds one or two more; lesson 2 puts two groups together and ends with the skill check. No written sums: the pictures and the spoken story carry it."}},{"id":"math.add-sub-to-20.add-to-10","domain":"math","topic":"Adding and subtracting to 10","can":"I can solve additions to 10, first to 5 and then to 10.","standards":["kmk-mathe-2022.zo.5","nc-maths-2014.y1.number-addition-and-subtraction.1","eyfs-2026.elg.number.3"],"set":{"title":"Adding to 10","file":"twist/lessons/en-GB/reception/math/add-to-10.yaml","lessons":[{"n":1,"title":"Weiterzählen","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Plus bis 10","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Adding two small numbers to 10 by counting on from the bigger one, and by seeing the five in a ten frame. Lesson 1 adds to 5 by counting on; lesson 2 adds to 10 using a full row of five, and ends with the skill check. Spoken questions; numbers say themselves."}},{"id":"math.add-sub-to-20.missing-addend","domain":"math","topic":"Adding and subtracting to 10","can":"I can solve missing-number additions to 10 (3 + _ = 8) and find the partner of any number to make 10.","standards":["kmk-mathe-2022.zo.5","kmk-mathe-2022.msf.3","nc-maths-2014.y1.number-addition-and-subtraction.2","eyfs-2026.elg.number.3"],"set":{"title":"How many more?","file":"twist/lessons/en-GB/reception/math/missing-addend.yaml","lessons":[{"n":1,"title":"Wie viele fehlen?","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Zehnerfreunde","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"How many more are needed to make a number? Lesson 1 fills a ten frame up to a number and finds the missing part in the part-whole model; lesson 2 finds the number bonds to 10 (how many more make ten) by counting the empty spaces, and ends with the skill check. Spoken questions; numbers say themselves."}},{"id":"math.numbers-to-20.teens","domain":"math","topic":"Numbers to 20","can":"I can read and write the numbers 11 to 20 and see each as one ten and some ones.","standards":["kmk-mathe-2022.zo.1","nc-maths-2014.y1.number-number-and-place-value.5","eyfs-2026.elg.numerical-patterns.1"],"set":{"title":"Numbers to 20","file":"twist/lessons/en-GB/reception/math/teens.yaml","lessons":[{"n":1,"title":"Weiter als zehn","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Zehn und noch ein paar","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Counting beyond ten: a full ten frame is ten, and the numbers to 20 are ten and some more. Lesson 1 counts on from a full ten frame to say the number; lesson 2 makes teen numbers as ten and some more and finds them among other numbers, and ends with the skill check. Spoken questions; numbers say themselves."}},{"id":"math.numbers-to-20.order-to-20","domain":"math","topic":"Numbers to 20","can":"I can order the numbers to 20, find them on a number line, count on and back, and continue number sequences.","standards":["kmk-mathe-2022.zo.3","kmk-mathe-2022.msf.2","nc-maths-2014.y1.number-number-and-place-value.1","nc-maths-2014.y1.number-number-and-place-value.3","eyfs-2026.elg.numerical-patterns.1"],"set":{"title":"Counting and ordering to 20","file":"twist/lessons/en-GB/reception/math/order-to-20.yaml","lessons":[{"n":1,"title":"Davor und danach","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"In der richtigen Reihenfolge","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Counting forwards and backwards to 20 and finding numbers on a number line. Lesson 1 says the number after and before, across ten; lesson 2 puts numbers in order and finds missing numbers in a count, and ends with the skill check. Spoken questions; numbers say themselves."}},{"id":"math.numbers-to-20.double-halve-to-20","domain":"math","topic":"Numbers to 20","can":"I can double numbers to 10 and halve even numbers to 20.","standards":["kmk-mathe-2022.zo.5","eyfs-2026.elg.numerical-patterns.3"],"set":{"title":"Doubles and sharing","file":"twist/lessons/en-GB/reception/math/double-halve-to-20.yaml","lessons":[{"n":1,"title":"Verdoppeln","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Gerecht teilen","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Double facts to 10 (the Early Learning Goal) and sharing fairly into two equal groups. Lesson 1 makes doubles with dots, the same number twice; lesson 2 shares fairly between two and links halves to doubles, and ends with the skill check. Spoken questions; numbers say themselves."}},{"id":"math.numbers-to-20.even-odd","domain":"math","topic":"Numbers to 20","can":"I can tell even and odd numbers to 20 apart and explain how I know.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y2.number-multiplication-and-division.1","eyfs-2026.elg.numerical-patterns.3"],"set":{"title":"Odd and even","file":"twist/lessons/en-GB/reception/math/even-odd.yaml","lessons":[{"n":1,"title":"Paare bilden","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Gerade oder ungerade?","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Odd and even numbers within 10 (the Early Learning Goal): even numbers make pairs with none left over, odd numbers have one left on its own. Lesson 1 makes pairs with dots; lesson 2 says whether a number is odd or even, and ends with the skill check. Spoken questions; numbers say themselves."}},{"id":"math.mult-div.div-meaning","domain":"math","topic":"Division","can":"I can find and solve the division that matches a grouping or sharing situation.","standards":["kmk-mathe-2022.zo.4","nc-maths-2014.y1.number-multiplication-and-division.1","nc-maths-2014.y2.number-multiplication-and-division.4","eyfs-2026.elg.numerical-patterns.3"],"set":null},{"id":"lit-en.phonological.rhymes","domain":"lit-en","topic":"Hearing sounds","can":"I can hear when words rhyme and find a word that rhymes.","standards":["nc-english-2014.y1.reading-comprehension.4"],"set":{"title":"Hearing rhymes","file":"twist/lessons/en-GB/reception/lit-en/rhymes.yaml","lessons":[{"n":1,"title":"Reimt sich das?","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Reimwörter finden","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Before phonics, children tune their ears. They hear whether two words rhyme (cat, hat) and find rhyming words. Lesson 1 judges pairs; lesson 2 finds the rhyme, pairs rhyming pictures, spots the word that does not rhyme, and ends with the skill check. Nothing to read: every prompt is spoken and every picture says its word."}},{"id":"lit-en.phonological.syllables","domain":"lit-en","topic":"Hearing sounds","can":"I can clap the syllables in a word.","standards":["nc-english-2014.y1.reading-word-reading.6"],"set":{"title":"Clapping syllables","file":"twist/lessons/en-GB/reception/lit-en/syllables.yaml","lessons":[{"n":1,"title":"Wörter klatschen","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Silben sortieren","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Children clap the syllables in a word: cat is one clap, rab-bit two, ba-na-na three. Each clap is a dot, so no reading is needed. Lesson 1 claps and counts; lesson 2 sorts words by their claps and ends with the skill check."}},{"id":"lit-en.phonological.initial-sounds","domain":"lit-en","topic":"Hearing sounds","can":"I can hear the first sound in a word and find words that start with the same sound.","standards":["eyfs-2026.elg.word-reading.1"],"set":{"title":"Hearing first sounds","file":"twist/lessons/en-GB/reception/lit-en/initial-sounds.yaml","lessons":[{"n":1,"title":"Der erste Laut","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Gleicher Anfang","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Children hear the first sound in a word (sun starts with sss) and find words that start with the same sound, ready for phonics. No letters yet: the sounds are spoken and every picture says its word. Lesson 1 listens for one sound at a time; lesson 2 pairs and sorts words by their first sound, finds the one that starts differently, and ends with the skill check."}},{"id":"lit-en.phonological.oral-blending","domain":"lit-en","topic":"Hearing sounds","can":"I can blend spoken sounds into a word (c-a-t, cat) and split a short word into its sounds.","standards":["eyfs-2026.elg.word-reading.2","eyfs-2026.elg.writing.2"],"set":{"title":"Blending sounds","file":"twist/lessons/en-GB/reception/lit-en/oral-blending.yaml","lessons":[{"n":1,"title":"Laute verbinden","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Wörter in Laute zerlegen","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"The step into phonics, still without letters. Children hear a word said sound by sound (c ... a ... t) and blend it into the word (cat), then do the reverse: split a short word into its sounds and count them. Lesson 1 blends; lesson 2 splits and ends with the skill check. The voice says pure sounds, never letter names."}},{"id":"lit-en.phonics.s-a-t-p","domain":"lit-en","topic":"Phonics","can":"I know the sounds for s, a, t, p and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2"],"set":{"title":"The sounds s, a, t, p","file":"twist/lessons/en-GB/reception/lit-en/phonics-s-a-t-p.yaml","lessons":[{"n":1,"title":"s, a, t, p","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"at, sat, tap","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"The first four letters of phonics and their sounds. Lesson 1 links each letter to its sound and to words that start with it; lesson 2 blends the sounds into words (at, sat, pat, tap, sap) and ends with the skill check. The sounds are recorded once and played from the sound bank, so the voice never says a letter name or a bare t or p."}},{"id":"lit-en.word-reading.blend-cvc","domain":"lit-en","topic":"Reading words","can":"I can read short words by saying each sound and blending them (cat, sun, chip).","standards":["eyfs-2026.elg.word-reading.2","nc-english-2014.y1.reading-word-reading.1","nc-english-2014.y1.reading-word-reading.3"],"set":{"title":"Reading short words","file":"twist/lessons/en-GB/reception/lit-en/blend-cvc.yaml","lessons":[{"n":1,"title":"Lesen und finden","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Genau hinsehen","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Reading three-letter words by saying each sound and blending them. Lesson 1 reads a word on a card and finds its picture; lesson 2 hears a word and finds it among words that look alike (cat, cot, cut), reads words with ck and the doubled endings, and ends with the skill check. The voice never says the word the child has to read."}},{"id":"lit-en.comprehension.retell","domain":"lit-en","topic":"Understanding stories","can":"I can retell a story I have heard in my own words, using new words from it.","standards":["eyfs-2026.elg.comprehension.1","eyfs-2026.elg.comprehension.3","nc-english-2014.y1.reading-comprehension.3"],"set":null},{"id":"lit-en.spelling.segment-spell","domain":"lit-en","topic":"Spelling","can":"I can spell words by saying the sounds and writing a letter or letters for each sound.","standards":["eyfs-2026.elg.writing.2","nc-english-2014.y1.writing-transcription.spelling.1","nc-english-2014.y2.writing-transcription.spelling.1"],"set":null},{"id":"lit-en.texts.listen-range","domain":"lit-en","topic":"Stories and poems","can":"I enjoy listening to stories, poems and information books and talking about them.","standards":["nc-english-2014.y1.reading-comprehension.1","nc-english-2014.y2.reading-comprehension.1","eyfs-2026.elg.listening-attention-and-understanding.1"],"set":null},{"id":"lit-en.handwriting.pencil-grip","domain":"lit-en","topic":"Handwriting","can":"I sit well and hold a pencil comfortably with a tripod grip.","standards":["eyfs-2026.elg.fine-motor-skills.1","nc-english-2014.y1.writing-transcription.handwriting.1"],"set":null},{"id":"lit-en.handwriting.lowercase","domain":"lit-en","topic":"Handwriting","can":"I can form lower-case letters in the right direction, starting and finishing in the right place.","standards":["eyfs-2026.elg.writing.1","nc-english-2014.y1.writing-transcription.handwriting.2"],"set":null},{"id":"lit-en.grammar.finger-spaces","domain":"lit-en","topic":"Grammar and punctuation","can":"I leave spaces between words when I write.","standards":["nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.1"],"set":null},{"id":"lit-en.composition.phrases-sentences","domain":"lit-en","topic":"Writing","can":"I can write simple phrases and sentences that other people can read.","standards":["eyfs-2026.elg.writing.3"],"set":null},{"id":"lit-en.speaking.listen-respond","domain":"lit-en","topic":"Speaking and listening","can":"I listen carefully and respond to what I hear with questions, comments and actions.","standards":["eyfs-2026.elg.listening-attention-and-understanding.1","eyfs-2026.elg.listening-attention-and-understanding.2","nc-english-2014.y1to6.spoken-language.1"],"set":null},{"id":"lit-en.phonics.i-n-m-d","domain":"lit-en","topic":"Phonics","can":"I know the sounds for i, n, m, d and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2"],"set":{"title":"The sounds i, n, m, d","file":"twist/lessons/en-GB/reception/lit-en/phonics-i-n-m-d.yaml","lessons":[{"n":1,"title":"i, n, m, d","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"in, man, dip","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"The second set of phonics letters. Lesson 1 links i, n, m and d to their sounds and to words that start with them; lesson 2 blends them with s, a, t and p into words (in, man, dip, pin) and ends with the skill check. The sounds are played from the sound bank, never as letter names."}},{"id":"lit-en.word-reading.first-tricky-words","domain":"lit-en","topic":"Reading words","can":"I can read the first tricky words that do not follow the sounds (the, I, to, go, no, he, she, we, me, be, was, my, you, they, all, are).","standards":["eyfs-2026.elg.word-reading.3"],"set":{"title":"First tricky words","file":"twist/lessons/en-GB/reception/lit-en/first-tricky-words.yaml","lessons":[{"n":1,"title":"the, I, to, go, he, she","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"was, my, you, they","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Tricky words that do not follow the sounds taught so far and are learned by sight. Lesson 1 takes the, I, to, go, no, he, she, we, me and be; lesson 2 takes was, my, you, they, all and are, reads them in short sentences, and ends with the skill check. Each tricky word is heard first, then found and read; the voice never says the word the child has to read in a reading task."}},{"id":"lit-en.comprehension.anticipate","domain":"lit-en","topic":"Understanding stories","can":"I can say what might happen next in a story.","standards":["eyfs-2026.elg.comprehension.2","nc-english-2014.y1.reading-comprehension.11","nc-english-2014.y2.reading-comprehension.13"],"set":null},{"id":"lit-en.speaking.follow-instructions","domain":"lit-en","topic":"Speaking and listening","can":"I can follow instructions with several ideas or actions.","standards":["eyfs-2026.elg.self-regulation.3"],"set":null},{"id":"lit-en.phonics.g-o-c-k","domain":"lit-en","topic":"Phonics","can":"I know the sounds for g, o, c, k and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2"],"set":{"title":"The sounds g, o, c, k","file":"twist/lessons/en-GB/reception/lit-en/phonics-g-o-c-k.yaml","lessons":[{"n":1,"title":"g, o, c, k","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"on, dog, cat","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"The third set of phonics letters. Lesson 1 links g, o, c and k to their sounds, and shows that c and k make the same sound; lesson 2 blends them with the letters so far into words (on, dog, cat, kit) and ends with the skill check. The sounds are played from the sound bank, never as letter names."}},{"id":"lit-en.phonics.ck-e-u-r","domain":"lit-en","topic":"Phonics","can":"I know the sounds for ck, e, u, r and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2"],"set":{"title":"The sounds ck, e, u, r","file":"twist/lessons/en-GB/reception/lit-en/phonics-ck-e-u-r.yaml","lessons":[{"n":1,"title":"e, u, r, ck","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"red, sun, neck","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"The fourth set of phonics letters. Lesson 1 links e, u and r to their sounds and shows ck, two letters for the click sound at the end of a word (duck, sock); lesson 2 blends words with them (red, sun, neck, rock) and ends with the skill check. The sounds are played from the sound bank, never as letter names."}},{"id":"lit-en.phonics.h-b-f-l","domain":"lit-en","topic":"Phonics","can":"I know the sounds for h, b, f, l, ff, ll, ss and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2"],"set":{"title":"The sounds h, b, f, l and ff, ll, ss","file":"twist/lessons/en-GB/reception/lit-en/phonics-h-b-f-l.yaml","lessons":[{"n":1,"title":"h, b, f, l","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"hot, bed, puff, doll","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"The last single letters of the first phonics phase, and three doubled endings. Lesson 1 links h, b, f and l to their sounds; lesson 2 shows that ff, ll and ss at the end of a short word make one sound (puff, doll, miss), blends words with all the letters so far, and ends with the skill check. The sounds are played from the sound bank, never as letter names."}},{"id":"lit-en.phonics.j-v-w-x","domain":"lit-en","topic":"Phonics","can":"I know the sounds for j, v, w, x and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2"],"set":{"title":"The sounds j, v, w, x","file":"twist/lessons/en-GB/reception/lit-en/phonics-j-v-w-x.yaml","lessons":[{"n":1,"title":"j, v, w, x","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"jam, van, web, six","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"Four more letters. Lesson 1 links j, v and w to the sound at the start of a word and x to the sound at the end (fox, box); lesson 2 blends words with them (jam, van, web, six) and ends with the skill check. The sounds are played from the sound bank, never as letter names."}},{"id":"lit-en.phonics.y-z-qu","domain":"lit-en","topic":"Phonics","can":"I know the sounds for y, z, zz, qu and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2"],"set":{"title":"The sounds y, z, zz, qu","file":"twist/lessons/en-GB/reception/lit-en/phonics-y-z-qu.yaml","lessons":[{"n":1,"title":"y, z, qu","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"yes, zip, quiz, buzz","acts":["learn","practise","check"],"tasks":19}],"tasks":37,"summary":"The last letters of the first phonics phase. Lesson 1 links y and z to their sounds and shows that q always comes with u to make one sound (queen); lesson 2 adds zz at the end of a short word (buzz), blends words with all the letters (yes, zip, quiz, fizz), and ends with the skill check. The sounds are played from the sound bank, never as letter names."}},{"id":"lit-en.phonics.ch-sh-th-ng","domain":"lit-en","topic":"Phonics","can":"I know the sounds for ch, sh, th, ng and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2","nc-english-2014.y1.reading-word-reading.2"],"set":null},{"id":"lit-en.word-reading.first-sentences","domain":"lit-en","topic":"Reading words","can":"I can read simple sentences and books that match the sounds I know.","standards":["eyfs-2026.elg.word-reading.3","nc-english-2014.y1.reading-word-reading.8"],"set":null},{"id":"lit-en.texts.predictable-phrases","domain":"lit-en","topic":"Stories and poems","can":"I can join in with repeated phrases in stories and rhymes.","standards":["nc-english-2014.y1.reading-comprehension.4"],"set":null},{"id":"lit-en.speaking.full-sentences","domain":"lit-en","topic":"Speaking and listening","can":"I can talk about my ideas and feelings in full sentences, using past, present and future and joining words like because.","standards":["eyfs-2026.elg.speaking.3","nc-english-2014.y1to6.spoken-language.5"],"set":null},{"id":"lit-en.speaking.explain-why","domain":"lit-en","topic":"Speaking and listening","can":"I can explain why things might happen, using new words from stories and information books.","standards":["eyfs-2026.elg.speaking.2","nc-english-2014.y1to6.spoken-language.7"],"set":null},{"id":"lit-en.phonics.ai-ee-igh-oa","domain":"lit-en","topic":"Phonics","can":"I know the sounds for ai, ee, igh, oa, oo and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2","nc-english-2014.y1.reading-word-reading.2"],"set":null},{"id":"lit-en.phonics.ar-or-ur-ow","domain":"lit-en","topic":"Phonics","can":"I know the sounds for ar, or, ur, ow, oi and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2","nc-english-2014.y1.reading-word-reading.2"],"set":null},{"id":"lit-en.phonics.ear-air-ure-er","domain":"lit-en","topic":"Phonics","can":"I know the sounds for ear, air, ure, er and can read and write simple words with them.","standards":["eyfs-2026.elg.word-reading.1","eyfs-2026.elg.word-reading.2","nc-english-2014.y1.reading-word-reading.2"],"set":null},{"id":"lit-en.phonics.adjacent-consonants","domain":"lit-en","topic":"Phonics","can":"I can read and spell words with consonants next to each other (frog, lamp, stamp).","standards":["eyfs-2026.elg.word-reading.2","nc-english-2014.y1.reading-word-reading.3"],"set":null}]},{"id":"year-1","label":"Year 1","skills":[{"id":"math.numbers-to-20.write-numerals-to-10","domain":"math","topic":"Numbers to 10","can":"I can read and write the numerals 0 to 10 and match each to its amount.","standards":["kmk-mathe-2022.zo.2","nc-maths-2014.y1.number-number-and-place-value.5"],"set":{"title":"Numerals 0 to 10","file":"twist/lessons/en-GB/year-1/math/write-numerals-to-10.yaml","lessons":[{"n":1,"title":"Die Ziffern 1 bis 5","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Die Ziffern 6 bis 10","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":3,"title":"Null und Zahlwörter","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":68,"summary":"Year 1 opens by reading and writing the numerals and matching each to its amount, as children move from Reception's spoken numbers to written ones. Lesson 1 takes 1 to 5, lesson 2 takes 6 to 10, each with how the numeral is formed; lesson 3 adds 0 and the number words one to ten (the National Curriculum asks for numerals and words in Year 1) and ends with the skill check. When a task asks which numeral fits, the numeral options have no speaker, because hearing \"three\" would give the answer."}},{"id":"math.add-sub-to-20.sub-meaning","domain":"math","topic":"Adding and subtracting to 10","can":"I can find the subtraction that matches a picture or story of taking away.","standards":["kmk-mathe-2022.zo.4"],"set":{"title":"What does take away mean?","file":"twist/lessons/en-GB/year-1/math/sub-meaning.yaml","lessons":[{"n":1,"title":"Weg ist weg","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Plus oder minus?","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Subtraction is taking away: some are eaten, fly off or go home. Lesson 1 finds the subtraction for a picture with crossed-out counters or a short story; lesson 2 matches stories to number sentences, writes them with − and =, and sets adding and taking away side by side, and ends with the skill check."}},{"id":"math.add-sub-to-20.sub-to-10","domain":"math","topic":"Adding and subtracting to 10","can":"I can solve subtractions within 10.","standards":["kmk-mathe-2022.zo.5","nc-maths-2014.y1.number-addition-and-subtraction.1"],"set":{"title":"Subtracting to 10","file":"twist/lessons/en-GB/year-1/math/sub-to-10.yaml","lessons":[{"n":1,"title":"Wegnehmen und rückwärts zählen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Minus bis 10","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Subtracting within 10 by taking away in the ten frame and by counting back on the number line. Lesson 1 takes away and counts back within 5, with zero; lesson 2 works within 10, takes away a whole row of five at once, and ends with the skill check."}},{"id":"math.word-problems.picture-stories","domain":"math","topic":"Word problems","can":"I can find the calculation for a picture or a short story, solve it and say the answer.","standards":["kmk-mathe-2022.zo.12","kmk-mathe-2022.pk-modellieren.2","nc-maths-2014.y1.number-addition-and-subtraction.4"],"set":{"title":"Number stories","file":"twist/lessons/en-GB/year-1/math/picture-stories.yaml","lessons":[{"n":1,"title":"Was will die Geschichte wissen?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Frage, Rechnung, Antwort","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"A picture or a short story asks a question, and the child finds the number sentence, works it out and says the answer. Lesson 1 finds what the story asks and the number sentence for it; lesson 2 adds the answer sentence and mixes adding and taking-away stories, and ends with the skill check. Stories are spoken; number sentences and short questions are on screen."}},{"id":"math.numbers-to-20.compare-to-20","domain":"math","topic":"Numbers to 20","can":"I can compare numbers to 20 and say how much bigger or smaller one is.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y1.number-number-and-place-value.4"],"set":{"title":"Comparing numbers to 20","file":"twist/lessons/en-GB/year-1/math/compare-to-20.yaml","lessons":[{"n":1,"title":"Größer oder kleiner","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Um wie viel mehr?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Comparing numbers to 20 and saying how many more or fewer. Lesson 1 compares with more than, less than and equal to, looking at the ten and then the ones, and writes \u003c, > and =; lesson 2 finds how many more on a number line (15 is 3 more than 12), and ends with the skill check."}},{"id":"math.add-sub-to-20.analog-to-20","domain":"math","topic":"Adding and subtracting to 20","can":"I can solve sums in the teens using related facts to 10 (3 + 4 helps with 13 + 4).","standards":["kmk-mathe-2022.zo.6","kmk-mathe-2022.msf.3","nc-maths-2014.y1.number-addition-and-subtraction.3"],"set":{"title":"Using facts to 10 for facts to 20","file":"twist/lessons/en-GB/year-1/math/analog-to-20.yaml","lessons":[{"n":1,"title":"Die kleine Aufgabe hilft","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Auch bei Minus","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"A fact in the teens is a fact to 10 with a ten on top: 3 + 4 = 7 helps with 13 + 4 = 17, and 8 − 5 = 3 with 18 − 5 = 13. Lesson 1 adds, lesson 2 subtracts and mixes both, and ends with the skill check. Nothing here crosses ten."}},{"id":"math.add-sub-to-20.add-bridge-10","domain":"math","topic":"Adding and subtracting to 20","can":"I can add across ten by making ten first and then adding the rest (8 + 5 = 8 + 2 + 3).","standards":["kmk-mathe-2022.zo.7","nc-maths-2014.y1.number-addition-and-subtraction.3"],"set":{"title":"Adding by making ten","file":"twist/lessons/en-GB/year-1/math/add-bridge-10.yaml","lessons":[{"n":1,"title":"Erst die 10 voll machen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zerlegen und springen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Adding across ten by making ten first: 8 + 5 = 8 + 2 + 3 = 13. Lesson 1 makes ten in the double ten frame and adds the rest; lesson 2 splits the second number on paper and on a number line, and ends with the skill check."}},{"id":"math.add-sub-to-20.sub-bridge-10","domain":"math","topic":"Adding and subtracting to 20","can":"I can subtract across ten by going back to ten first (13 − 5 = 13 − 3 − 2).","standards":["kmk-mathe-2022.zo.7","nc-maths-2014.y1.number-addition-and-subtraction.3"],"set":{"title":"Subtracting back through ten","file":"twist/lessons/en-GB/year-1/math/sub-bridge-10.yaml","lessons":[{"n":1,"title":"Erst bis zur 10","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Minus bis 20","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Subtracting across ten in two steps: back to 10 first, then the rest (13 − 5 = 13 − 3 − 2 = 8). Lesson 1 splits the number to take away and hops back to ten on a number line; lesson 2 checks answers with the inverse, practises all facts from 11 to 18, and ends with the skill check."}},{"id":"math.add-sub-to-20.fluency-to-20","domain":"math","topic":"Adding and subtracting to 20","can":"I can recall all addition and subtraction facts to 20 quickly and derive the inverse facts.","standards":["kmk-mathe-2022.zo.5","nc-maths-2014.y1.number-addition-and-subtraction.2","nc-maths-2014.y2.number-addition-and-subtraction.3","nc-maths-2014.y2.number-addition-and-subtraction.7"],"set":{"title":"Number facts to 20","file":"twist/lessons/en-GB/year-1/math/fluency-to-20.yaml","lessons":[{"n":1,"title":"Schnell plus rechnen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Minus aus Plus ableiten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Number bonds and facts to 20, quickly and surely, using the strategies the child knows (doubles, near doubles, number bonds to 10, related facts, making ten) and getting subtraction facts from addition facts. Lesson 1 mixes addition facts and picks a quick strategy; lesson 2 uses the inverse for subtraction facts, mixes both, and ends with the skill check."}},{"id":"math.add-sub-to-20.equations","domain":"math","topic":"Adding and subtracting to 20","can":"I can compare calculations with \u003c, > and = and show that different calculations can have the same result (7 + 5 = 6 + 6).","standards":["kmk-mathe-2022.msf.3","nc-maths-2014.y1.number-addition-and-subtraction.4"],"set":{"title":"Equal to, greater than, less than","file":"twist/lessons/en-GB/year-1/math/equations.yaml","lessons":[{"n":1,"title":"Aufgabe und Zahl vergleichen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zwei Aufgaben vergleichen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Comparing calculations and numbers with \u003c, > and =, and seeing that different calculations can have the same total (7 + 5 = 6 + 6), with missing numbers such as 7 = _ − 9. Lesson 1 compares a calculation with a number; lesson 2 compares two calculations and finds missing numbers, and ends with the skill check. The = sign means \"is the same as\"."}},{"id":"math.numbers-to-100.tens","domain":"math","topic":"Counting in tens","can":"I can read, write and order the multiples of ten to 100 and count in tens.","standards":["kmk-mathe-2022.zo.1","nc-maths-2014.y1.number-number-and-place-value.2"],"set":{"title":"Counting in tens","file":"twist/lessons/en-GB/year-1/math/counting-in-tens.yaml","lessons":[{"n":1,"title":"Zehner zählen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Vorwärts und rückwärts","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The multiples of ten to 100: counting tens, reading and writing them, and putting them in order. Lesson 1 counts tens rods (three tens make thirty) and matches number words to numerals (each word card says itself when tapped); lesson 2 counts on and back in tens, orders the tens and tells fifty from fifteen, and ends with the skill check."}},{"id":"math.money.coins-notes","domain":"math","topic":"Money","can":"I can recognise all coins and notes and order them by value.","standards":["kmk-mathe-2022.gm.2","nc-maths-2014.y1.measurement.9"],"set":null},{"id":"math.time.sequence-of-day","domain":"math","topic":"Time","can":"I can put the events of a day in order and name the days of the week and the months in order.","standards":["kmk-mathe-2022.gm.2","nc-maths-2014.y1.measurement.4","nc-maths-2014.y1.measurement.8","nc-maths-2014.y1.measurement.10"],"set":null},{"id":"math.time.full-half-hour","domain":"math","topic":"Telling the time","can":"I can read and set o'clock and half past on analogue and digital clocks.","standards":["kmk-mathe-2022.gm.6","nc-maths-2014.y1.measurement.8","nc-maths-2014.y1.measurement.12"],"set":null},{"id":"math.shapes.basic-shapes","domain":"math","topic":"Shapes","can":"I can recognise and name circles, triangles, rectangles and squares, also around me.","standards":["kmk-mathe-2022.rf.4","kmk-mathe-2022.rf.5","nc-maths-2014.y1.geometry-properties-of-shapes.1"],"set":null},{"id":"math.space.position-words","domain":"math","topic":"Position and direction","can":"I can describe and understand positions (right, left, above, below, in front of, behind, next to, between).","standards":["kmk-mathe-2022.rf.1","nc-maths-2014.y1.geometry-position-and-direction.1"],"set":null},{"id":"math.numbers-to-100.read-write","domain":"math","topic":"Numbers to 100","can":"I can read and write numbers to 100, also as words, without swapping tens and ones.","standards":["kmk-mathe-2022.zo.2","nc-maths-2014.y1.number-number-and-place-value.2","nc-maths-2014.y2.number-number-and-place-value.5"],"set":null},{"id":"math.numbers-to-100.number-line","domain":"math","topic":"Numbers to 100","can":"I can read and mark numbers to 100 on a number line, also when only the tens are labelled.","standards":["kmk-mathe-2022.zo.2","kmk-mathe-2022.zo.3","nc-maths-2014.y1.number-number-and-place-value.4","nc-maths-2014.y2.number-number-and-place-value.3"],"set":null},{"id":"math.numbers-to-100.sequences","domain":"math","topic":"Numbers to 100","can":"I can count forwards and backwards in steps to 100 from any number and find the rule of a number sequence.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y1.number-number-and-place-value.1","nc-maths-2014.y1.number-number-and-place-value.2","nc-maths-2014.y2.number-number-and-place-value.1"],"set":null},{"id":"math.mult-div.mult-meaning","domain":"math","topic":"Multiplication","can":"I can spot equal groups and write a repeated addition as a multiplication (4 + 4 + 4 = 3 × 4).","standards":["kmk-mathe-2022.zo.4","nc-maths-2014.y1.number-multiplication-and-division.1","nc-maths-2014.y2.number-multiplication-and-division.2"],"set":null},{"id":"math.time.calendar","domain":"math","topic":"Calendar","can":"I can find and write a date on a calendar and work out how many days or weeks lie between two dates.","standards":["kmk-mathe-2022.gm.2","kmk-mathe-2022.dz.2","nc-maths-2014.y1.measurement.11"],"set":null},{"id":"math.length.compare","domain":"math","topic":"Length","can":"I can compare and order lengths directly (longer, shorter, the same).","standards":["kmk-mathe-2022.gm.1","nc-maths-2014.y1.measurement.1","nc-maths-2014.y2.measurement.2"],"set":null},{"id":"math.mass-capacity.compare-capacity","domain":"math","topic":"Capacity","can":"I can compare which container holds more and say whether it is full, half full or empty.","standards":["kmk-mathe-2022.gm.1","nc-maths-2014.y1.measurement.3","nc-maths-2014.y1.measurement.7","nc-maths-2014.y2.measurement.2"],"set":null},{"id":"math.length.non-standard","domain":"math","topic":"Length","can":"I can measure len
