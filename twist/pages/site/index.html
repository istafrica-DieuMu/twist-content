0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Find a number on a section\u003c/td>\u003ctd>40 to 60, labels tens, \"Wo ist 47?\"\u003c/td>\u003ctd>number-line-to-100\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A jump with a negative size (\u003ccode>jumps: [[5, -1]]\u003c/code>) hops back and is labelled −1 (sub-to-10).\u003c/p>\n\u003cp>A number line can also be a picture to read: \u003ccode>show\u003c/code> with \u003ccode>mark: 35\u003c/code> draws the marker at 35, and a multiple_choice asks which number it marks (number-line-to-100).\u003c/p>","uses":{"de-DE":114,"en-GB":63},"shot":"../types/shots/point_on_line.png"},{"id":"highlight_in_text","html":"\u003cp>Letter or word cards; the child taps every card that matches and taps Prüfen.\u003c/p>\n\u003cp>Fields: \u003ccode>show: { drawn: letter-card, text: \"L o l M L a\" }\u003c/code> (cards split on spaces), \u003ccode>spans\u003c/code> (the cards to find). A card matches a span without its trailing punctuation: the span \u003ccode>hoch\u003c/code> finds the card \u003ccode>hoch.\u003c/code>; the build rejects a span that matches no card.\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Every form of a letter\u003c/td>\u003ctd>every upper- and lower-case L in \"L o l M L a\"\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Every noun in a sentence written in small letters\u003c/td>\u003ctd>\"die übung macht mir freude\", spans übung, freude\u003c/td>\u003ctd>noun-endings, abstract-nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The word that does not fit\u003c/td>\u003ctd>\"I eat cake with a sock\", spans sock\u003c/td>\u003ctd>en-GB automatic-decoding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The verb that breaks the tense\u003c/td>\u003ctd>a short text on a letter-card, all in one Zeitform but one verb; spans that verb\u003c/td>\u003ctd>verbs-tenses-mixed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The verb in a sentence\u003c/td>\u003ctd>\"Der Hund schläft im Korb.\", spans schläft; a split verb gives two spans (\"Der Zug fährt gleich ab.\": fährt, ab) or the moved prefix alone\u003c/td>\u003ctd>verbs-recognise, verbs-prefixes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Root word or suffixes of a split word\u003c/td>\u003ctd>\"care less ness\", spans less, ness\u003c/td>\u003ctd>en-GB suffixes-y2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The silent letter\u003c/td>\u003ctd>\"i s l a n d\" split into letters, spans s\u003c/td>\u003ctd>en-GB exception-words-ks2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Every word of the Subjekt\u003c/td>\u003ctd>\"Mein großer Bruder spielt Gitarre.\", spans Mein, großer, Bruder; spans match cards without trailing punctuation, so \"Paul\" finds the card \"Paul.\"\u003c/td>\u003ctd>sentences-subject-predicate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The spoken words or the Begleitsatz\u003c/td>\u003ctd>\"Tom ruft: „Komm schnell her!“\", spans „Komm, schnell, her!“ (cards keep their Anführungszeichen) or Tom, ruft:\u003c/td>\u003ctd>sentences-direct-speech, sentences-direct-speech-positions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Both parts of a split Prädikat\u003c/td>\u003ctd>\"Der Unterricht hört um zwölf auf.\", spans hört, auf.\u003c/td>\u003ctd>sentences-subject-predicate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Where to pause\u003c/td>\u003ctd>a sentence to read aloud, spans the word after which you pause (at a comma or a full stop)\u003c/td>\u003ctd>record-voice\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","uses":{"de-DE":467,"en-GB":73},"shot":"../types/shots/highlight_in_text.png"},{"id":"tracing","html":"\u003cp>Writing lines with the letter. In trace mode it is drawn dashed with a green start dot and the child traces it; in copy mode a model sits on the left and the child writes beside it. The prototype accepts any ink; the app will compare the strokes.\u003c/p>\n\u003cp>Fields: \u003ccode>show: { drawn: writing-lines, text, mode: trace | copy, arrows, script }\u003c/code>, \u003ccode>char\u003c/code>. No hints in any stage: the guide is the help.\u003c/p>\n\u003cp>\u003ccode>script: joined\u003c/code> writes the model in Schreibschrift. Which Ausgangsschrift (SAS, LA, VA or Grundschrift) is the school's choice by Land, so it is a setting, not part of the task; a task about joining never names a join that only one script has.\u003c/p>\n\u003cp>Interactions: trace a letter; copy a letter (letters-l-o-a-m); trace and copy a numeral, 0 to 10 (write-numerals-to-10).\u003c/p>","uses":{"de-DE":214,"en-GB":14},"shot":"../types/shots/tracing.png"},{"id":"speak","html":"\u003cp>The child hears the model and says the word. Speech recognition for young children is not reliable enough to mark, so speak tasks are practice only, never in a skill check (the build warns).\u003c/p>\n\u003cp>Until speech is marked, every speak task runs as the fallback below. It needs no extra fields, so the same records work when listening arrives.\u003c/p>\n\u003col>\u003cli>The prompt plays (the instruction, and the model when \u003ccode>say\u003c/code> has one).\u003c/li>\u003cli>The child taps the microphone (\"Jetzt du\") and speaks. The app records for up to 4 seconds; a second tap stops early.\u003c/li>\u003cli>The app plays the child's recording, then the model. Both stay on screen as speaker chips (\"Du\", \"So klingt es\").\u003c/li>\u003cli>The child taps \"Klingt gleich\" to go on, or \"Nochmal\" to record again.\u003c/li>\u003c/ol>\n\u003cp>The task is never scored and is never wrong. With no microphone (or no permission) step 2 is skipped: the child speaks, then hears the model and taps \"Klingt gleich\". The recording stays on the device and is deleted when the task closes.\u003c/p>\n\u003cp>The model is \u003ccode>say\u003c/code> in the target language, or else \u003ccode>expected_text\u003c/code> as a sentence (\"a skirt\" is said as \"A skirt.\"), so a none-stage task that gives no model up front still lets the child check themselves.\u003c/p>\n\u003cp>Fields: \u003ccode>say\u003c/code> (\u003ccode>{ de: instruction, en: model }\u003c/code>), \u003ccode>show\u003c/code>, \u003ccode>expected_text\u003c/code>.\u003c/p>\n\u003cp>Interactions: say the colour of a crayon; say the colour of a thing (en-colours).\u003c/p>","uses":{"de-DE":326,"en-GB":16},"shot":"../types/shots/speak.png"},{"id":"matching","html":"\u003cp>Two columns; the child taps a left item (it says its word if it has a \u003ccode>say\u003c/code>), then the right item it belongs to. A made pair takes the left item's colour as its border. Prüfen checks all pairs; wrong pairs are undone.\u003c/p>\n\u003cp>Fields: \u003ccode>pairs\u003c/code> (2 to 6), each \u003ccode>{ left, right }\u003c/code>; a side is a bank picture, a drawn component or text, and may carry its own \u003ccode>say\u003c/code>. The app shuffles the right side.\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Colour with a thing that has it\u003c/td>\u003ctd>yellow ↔ banana, green ↔ frog, red ↔ strawberry; tapping a colour says \"Yellow.\"\u003c/td>\u003ctd>en-colours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Numeral with its amount\u003c/td>\u003ctd>3 ↔ three dots on a dice, 5 ↔ five apples; a side can be \u003ccode>{ text: \"3\" }\u003c/code>\u003c/td>\u003ctd>write-numerals-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Number with a split\u003c/td>\u003ctd>7 ↔ 4 + 3, 5 ↔ 2 + 3\u003c/td>\u003ctd>partition-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A sum with its Tauschaufgabe\u003c/td>\u003ctd>1 + 8 ↔ 8 + 1\u003c/td>\u003ctd>commutative\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Number with its number word\u003c/td>\u003ctd>17 ↔ siebzehn, 70 ↔ siebzig, 71 ↔ einundsiebzig, with \u003ccode>option_audio: false\u003c/code> (hearing the cards would give the pairs)\u003c/td>\u003ctd>read-write-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rhyming pairs\u003c/td>\u003ctd>Haus ↔ Maus, Tisch ↔ Fisch, Hose ↔ Rose; every picture says its word\u003c/td>\u003ctd>rhymes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Same first sound\u003c/td>\u003ctd>Sonne ↔ Socke, Fisch ↔ Frosch, Ball ↔ Banane\u003c/td>\u003ctd>initial-sound\u003c/td>\u003c/tr>\u003ctr>\u003ctd>First word with its compound\u003c/td>\u003ctd>a tree picture ↔ Baumhaus; the picture says its word\u003c/td>\u003ctd>compound-nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Compound with its last part or its article\u003c/td>\u003ctd>Regenschirm ↔ Schirm; Haustür ↔ die, with \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>compound-nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Case question with its case\u003c/td>\u003ctd>Wem? ↔ Dativ, four pairs\u003c/td>\u003ctd>noun-cases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shape with its name or its corners\u003c/td>\u003ctd>a \u003ccode>shape\u003c/code> picture ↔ Kreis, or ↔ \"3 Ecken\"\u003c/td>\u003ctd>basic-shapes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Problem and its fix\u003c/td>\u003ctd>a recording problem (\"zu leise\") ↔ what helps (\"näher ans Mikrofon\"); a statement ↔ zustimmen, widersprechen, nachfragen; an interview answer ↔ its Stichwort\u003c/td>\u003ctd>record-voice, conversation-rules, interview\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Twist: \u003ccode>pairs[].left\u003c/code> and \u003ccode>right\u003c/code> become \u003ccode>{ label, image_url }\u003c/code>; \u003ccode>say\u003c/code> becomes the narration of that side.\u003c/p>","uses":{"de-DE":385,"en-GB":32},"shot":"../types/shots/matching.png"},{"id":"sorting","html":"\u003cp>Items at the top, two to five bins below. The child taps an item, then a bin; tapping an item in a bin puts it back. Tapping a bin says its word if it has a \u003ccode>say\u003c/code>. Prüfen checks every item; wrong ones go back.\u003c/p>\n\u003cp>Fields: \u003ccode>bins\u003c/code> (\u003ccode>{ id, show, say }\u003c/code>), \u003ccode>options\u003c/code> (\u003ccode>{ object, bin }\u003c/code>). Twist calls the option's bin \u003ccode>correct_bin_id\u003c/code>.\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pictures by colour\u003c/td>\u003ctd>strawberry, apple → red; frog, leaf → green\u003c/td>\u003ctd>en-colours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Words by syllables\u003c/td>\u003ctd>bins of one, two and three claps; Ball, Hase, Banane ... (each picture says its word)\u003c/td>\u003ctd>syllables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Words by first sound\u003c/td>\u003ctd>bins headed by a sun and a fish; Sonne, Socke / Fisch, Frosch\u003c/td>\u003ctd>initial-sound\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Words by the sound a spelling makes\u003c/td>\u003ctd>bins headed by a cow and a snowman; text cards now, show, town, slow with \u003ccode>option_audio: false\u003c/code> (hearing the cards would give the sound away). Options can be \u003ccode>{ text, bin }\u003c/code> and bins can be \u003ccode>{ show: { text }, say }\u003c/code>\u003c/td>\u003ctd>en-GB alternative-pronunciations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sentences into fact and opinion\u003c/td>\u003ctd>bins fact and opinion, text cards with \u003ccode>option_audio: false\u003c/code>; long text cards get a smaller font\u003c/td>\u003ctd>en-GB fact-opinion\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verbs into trennbar and nicht trennbar\u003c/td>\u003ctd>bins trennbar and nicht trennbar, text cards aufräumen, verlieren, weglaufen, bekommen\u003c/td>\u003ctd>verbs-compound\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Phrases into Ortsangabe and Zeitangabe\u003c/td>\u003ctd>bins \"Ortsangabe (Wo?)\" and \"Zeitangabe (Wann?)\", cards with im and am of both kinds (im Keller, im Herbst, am Strand, am Abend)\u003c/td>\u003ctd>sentences-place-time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Questions a story can or cannot answer\u003c/td>\u003ctd>bins \"kann ich beantworten\" and \"kann ich nicht beantworten\"; after a short story, cards such as \"Wie viele springen nicht?\" and \"Wie tief ist das Becken?\"\u003c/td>\u003ctd>ask-questions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Opinion and reason, argument or not\u003c/td>\u003ctd>bins \"Meinung\" and \"Grund\", or \"Argument\" and \"kein Argument\", cards from one short discussion\u003c/td>\u003ctd>argue, opinion\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What belongs in a report\u003c/td>\u003ctd>bins \"gehört in den Bericht\" and \"gehört nicht hinein\", cards with facts and feelings\u003c/td>\u003ctd>report\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open or yes/no question\u003c/td>\u003ctd>bins \"offene Frage\" and \"Ja-Nein-Frage\"\u003c/td>\u003ctd>interview\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Said, shown or thought\u003c/td>\u003ctd>bins \"gesagt\", \"gezeigt\" and \"gedacht\", cards with ways a character's feelings come across\u003c/td>\u003ctd>write-feelings\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","uses":{"de-DE":364,"en-GB":21},"shot":"../types/shots/sorting.png"},{"id":"ordering","html":"\u003cp>Number or picture cards above, empty slots below. The child taps cards in order to fill the slots from the left; tapping a filled slot empties it. Prüfen checks the whole order; wrong cards go back.\u003c/p>\n\u003cp>Fields: \u003ccode>options\u003c/code> (strings or bank pictures; may include extra cards that do not belong), \u003ccode>slot_count\u003c/code>, \u003ccode>answer\u003c/code> (the cards in slot order). Twist calls the answer \u003ccode>correct_arrangement\u003c/code> and gives options ids.\u003c/p>\n\u003cp>Interactions:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interaction\u003c/th>\u003cth>Example\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Numbers from small to big\u003c/td>\u003ctd>4, 2, 5, 3 into four slots: 2, 3, 4, 5\u003c/td>\u003ctd>order-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Words of a sentence in order\u003c/td>\u003ctd>chunks of an English sentence (\"got\", \"a fish\", \"I\", \"have\") into slots: I have got a fish; the German meaning is spoken\u003c/td>\u003ctd>en-about-me\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Count backwards\u003c/td>\u003ctd>7, 9, 8, 6 from big to small: 9, 8, 7, 6\u003c/td>\u003ctd>order-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Amounts from few to many\u003c/td>\u003ctd>three dot pictures, fewest first\u003c/td>\u003ctd>compare-to-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Two-digit numbers\u003c/td>\u003ctd>45, 18, 81, 54, smallest first\u003c/td>\u003ctd>order-compare-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Build an English sentence from word cards\u003c/td>\u003ctd>\"Bau den Satz: Ich mag Fußball.\" cards football, I, like into I like football, \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>en-hobbies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A sequence in steps\u003c/td>\u003ctd>38, 18, 28, 48 into tens steps\u003c/td>\u003ctd>sequences-to-100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Steps of a story pattern\u003c/td>\u003ctd>the hero's journey: leaves home, goes on a journey, faces a big challenge, comes home changed\u003c/td>\u003ctd>en-GB themes-conventions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Point, evidence, explain\u003c/td>\u003ctd>three sentences of an answer into order\u003c/td>\u003ctd>en-GB justify-views\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The part after weil, dass or wenn\u003c/td>\u003ctd>the whole sentence is spoken, the cards are the second part (\"weil\", \"er\", \"Hunger\", \"hat\"); the verb goes last, \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>sentences-conjunctions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Umstellprobe\u003c/td>\u003ctd>the sentence is spoken, its Satzglieder are cards, \"Beginne mit „Am Morgen“\": the named Satzglied first, the verb second (Am Morgen, trinkt, Opa, einen Kaffee); with a split Prädikat the second part goes last, \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>sentences-move-parts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Parts of a number story\u003c/td>\u003ctd>\"Bau eine Geschichte zu 50 − 20.\", sentence cards for the start, what happens and the question (\"Lisa hat 50 Cent.\", \"Sie kauft einen Lolli für 20 Cent.\", \"Wie viel Geld hat sie noch?\"), \u003ccode>option_audio: false\u003c/code>\u003c/td>\u003ctd>write-stories\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","uses":{"de-DE":624,"en-GB":57},"shot":"../types/shots/ordering.png"}],"ttIntro":"\u003cp>The one place that says what each task type is, how the child works it, and every interaction it supports. A task type is the record's \u003ccode>type\u003c/code>; an interaction is one way of using that type (matching can pair a colour with an object that has it, a word with its picture, a sum with its result).\u003c/p>\n\u003cp>Rules:\u003c/p>\n\u003cul>\u003cli>Lessons in every curriculum use the same types. en-GB lessons are named \"en-GB &lt;lesson&gt;\" where an interaction is England's own.\u003c/li>\u003cli>Write the type or interaction here before the first lesson uses it. The build rejects a task type that has no section in this file.\u003c/li>\u003cli>Each interaction names a lesson that uses it, so there is always a working example to copy.\u003c/li>\u003cli>Field names follow the Twist app's schemas (schoolido-learning/schemas/question-types), with bank ids (\u003ccode>object\u003c/code>, \u003ccode>drawn\u003c/code>, \u003ccode>sound\u003c/code>) in place of image and audio URLs. Where a record field differs from the Twist field, the section says so; a converter maps it.\u003c/li>\u003cli>Hints follow the Practise stage: 3 in the full stage (strategy, think aloud, direct cue), 1 in the some stage, none in the none stage or a Check. Tracing never takes hints.\u003c/li>\u003cli>Options can be heard (a speaker on each) unless hearing them gives the answer away: see Option audio at the end.\u003c/li>\u003c/ul>\n\u003cp>Shared fields on every task: \u003ccode>id\u003c/code>, \u003ccode>type\u003c/code>, \u003ccode>text\u003c/code> (what the screen shows), \u003ccode>say\u003c/code> (what the voice says, if different; \u003ccode>{ de, en }\u003c/code> in foreign-language lessons), \u003ccode>show\u003c/code> (a picture or drawn component), \u003ccode>hints\u003c/code>, \u003ccode>feedback\u003c/code> (per wrong option), \u003ccode>difficulty\u003c/code> (easy, core, stretch; core if left out).\u003c/p>\n\u003cp>\u003ccode>show\u003c/code> can be two pictures side by side: \u003ccode>show: { objects: [house, mouse] }\u003c/code> (for \"Reimt sich das?\"); each picture says its word when tapped.\u003c/p>\n\u003cp>A picture can be crossed out, for a \"not allowed\" sign: \u003ccode>show: { object: dog, crossed: true }\u003c/code> draws a red ring with a line across it (\"Was heißt das Schild?\").\u003c/p>\n\u003cp>\u003ccode>show\u003c/code> can be an Anlauttabelle: \u003ccode>show: { drawn: sound-chart, letters: [m, a, s, l], mark: m }\u003c/code> draws each letter with a picture that starts with its sound; \u003ccode>gaps\u003c/code> shows fields as \"?\", \u003ccode>pictures\u003c/code> names the picture per letter.\u003c/p>\n\u003cp>\u003ccode>show\u003c/code> can carry \u003ccode>flash: 2\u003c/code>: the picture is shown for that many seconds and then covered, so the child has to see the amount at a glance instead of counting. A \"Nochmal sehen\" button shows it again for the same time; in a Check it is not there.\u003c/p>\n\u003cp>Drawn components used by tasks are listed in assets/drawn.yaml. The ones for amounts:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Data\u003c/th>\u003cth>Looks like\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>dots\u003c/code>\u003c/td>\u003ctd>\u003ccode>count\u003c/code>, \u003ccode>layout: dice / five-structure / row / scattered\u003c/code>, \u003ccode>colour_split: [3, 2]\u003c/code>\u003c/td>\u003ctd>dice pips (1 to 6; 7 to 10 as two dice), rows of five (Kraft der 5), a row, or scattered dots\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dots\u003c/code> with \u003ccode>array\u003c/code>\u003c/td>\u003ctd>\u003ccode>array: [3, 4]\u003c/code> (rows, columns), \u003ccode>split_rows: 2\u003c/code>\u003c/td>\u003ctd>a Punktefeld of 3 rows of 4; \u003ccode>split_rows\u003c/code> colours the first rows red and the rest blue (7 · 6 = 5 · 6 + 2 · 6); as an option its key is \"3x4\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dots\u003c/code> with \u003ccode>groups\u003c/code>\u003c/td>\u003ctd>\u003ccode>groups: [4, 3]\u003c/code>, \u003ccode>layout: row / dice\u003c/code>\u003c/td>\u003ctd>two amounts to compare: in rows, one under the other and lined up (red over blue, so pairs show); as dice, side by side\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ten-frame\u003c/code>\u003c/td>\u003ctd>\u003ccode>filled\u003c/code>, \u003ccode>colour_split: [5, 2]\u003c/code>, \u003ccode>cross: 2\u003c/code>\u003c/td>\u003ctd>a 2 by 5 frame with counters; \u003ccode>cross\u003c/code> crosses out the last counters (taken away), or the first with \u003ccode>cross_from: start\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>zwanzigerfeld\u003c/code>\u003c/td>\u003ctd>\u003ccode>filled: [8, 5]\u003c/code>, \u003ccode>move\u003c/code>\u003c/td>\u003ctd>two ten-frames\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>number-house\u003c/code>\u003c/td>\u003ctd>\u003ccode>roof\u003c/code>, \u003ccode>rows: [[3, null]]\u003c/code>\u003c/td>\u003ctd>a roof number over pairs of cells, \u003ccode>null\u003c/code> is a gap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>written-calc\u003c/code>\u003c/td>\u003ctd>\u003ccode>rows: [\"457\", \"326\"]\u003c/code>, \u003ccode>op: +\u003c/code>, \u003ccode>carry: \" 1 \"\u003c/code>, \u003ccode>result: \"7_3\"\u003c/code>\u003c/td>\u003ctd>numbers right-aligned in columns, the sign before the last row, the Übertrag small above the line, the result with gaps; for Entbündeln \u003ccode>above: \" 41\"\u003c/code> writes small digits over the first number and \u003ccode>cross: \" x \"\u003c/code> crosses a digit of it out; as an option its key is the rows joined with\u003c/td>\u003ctd>(\"457\u003c/td>\u003ctd>326\")\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>number-wall\u003c/code>\u003c/td>\u003ctd>\u003ccode>rows: [[3, 5, 2], [8, 7], [null]]\u003c/code>, bottom row first\u003c/td>\u003ctd>the Zahlenmauer: each brick is the sum of the two under it, \u003ccode>null\u003c/code> is a gap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hundred-field\u003c/code>\u003c/td>\u003ctd>\u003ccode>filled\u003c/code>, \u003ccode>colour_split\u003c/code>\u003c/td>\u003ctd>the Hunderterfeld: 10 by 10 dots with gaps after five each way\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hundred-square\u003c/code>\u003c/td>\u003ctd>\u003ccode>highlight: [..]\u003c/code>, \u003ccode>hide: [..]\u003c/code>\u003c/td>\u003ctd>1 to 100 in rows of ten; hidden cells show ?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>base-ten\u003c/code>\u003c/td>\u003ctd>\u003ccode>hundreds\u003c/code>, \u003ccode>tens\u003c/code>, \u003ccode>ones\u003c/code>\u003c/td>\u003ctd>hundred flats (10 by 10, two to a column), tens rods and ones cubes; more than ten loose cubes start a new pair of columns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>place-value-chart\u003c/code>\u003c/td>\u003ctd>\u003ccode>columns: [tens, ones]\u003c/code> (or with \u003ccode>hundreds\u003c/code>, \u003ccode>thousands\u003c/code>, \u003ccode>ten-thousands\u003c/code>, \u003ccode>hundred-thousands\u003c/code>, \u003ccode>millions\u003c/code> in front), \u003ccode>values: [4, null]\u003c/code>\u003c/td>\u003ctd>Stellentafel; HT ZT T H Z E in German, HTh TTh Th H T O in English; six columns shrink to fit; null is a gap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>clock\u003c/code>\u003c/td>\u003ctd>\u003ccode>hour: 1-12\u003c/code>, \u003ccode>minute: 0-59\u003c/code>, \u003ccode>digital: true\u003c/code>\u003c/td>\u003ctd>an analogue clock face; the hour hand moves on with the minutes; \u003ccode>digital\u003c/code> adds the time below; as an option its key is \"3:30\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>part-whole\u003c/code>\u003c/td>\u003ctd>\u003ccode>whole\u003c/code>, \u003ccode>parts: [2, null]\u003c/code>\u003c/td>\u003ctd>England's part-whole model: the whole in a circle above two part circles, \u003ccode>null\u003c/code> is a gap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ruler\u003c/code>\u003c/td>\u003ctd>\u003ccode>to: 15\u003c/code>, \u003ccode>length: 7\u003c/code>, \u003ccode>start: 2\u003c/code>, \u003ccode>colour\u003c/code>\u003c/td>\u003ctd>a ruler in cm with mm ticks (cm and half cm only past 20) and a coloured strip above it, dashed lines from its ends to the scale; \u003ccode>start\u003c/code> sets the strip off zero for the reading-from-zero mistake\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>shape\u003c/code>\u003c/td>\u003ctd>\u003ccode>kind: circle / triangle / square / rectangle / pentagon / hexagon / octagon / parallelogram / trapezoid / cube / cuboid / sphere / cylinder / cone / pyramid\u003c/code>, \u003ccode>colour\u003c/code>, \u003ccode>size\u003c/code>\u003c/td>\u003ctd>a flat shape, or a solid in a simple oblique view with hidden edges dashed; as an option its key is the kind (\"cube\")\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>shape\u003c/code> with \u003ccode>row\u003c/code> or \u003ccode>column\u003c/code>\u003c/td>\u003ctd>\u003ccode>row: [circle, square, triangle, \"?\"]\u003c/code>, \u003ccode>colours: [red, blue, red, null]\u003c/code> or one colour\u003c/td>\u003ctd>shapes side by side (left to right) or stacked (top to bottom); \u003ccode>\"?\"\u003c/code> is a dashed gap, for patterns to continue and for position words (links, rechts, zwischen, oben, unten)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bar-chart\u003c/code>\u003c/td>\u003ctd>\u003ccode>rows: [[Hund, 5], [Katze, 8]]\u003c/code>, \u003ccode>step\u003c/code>, \u003ccode>from\u003c/code>; or \u003ccode>tally: true\u003c/code>\u003c/td>\u003ctd>a bar chart with a scale from 0, or from \u003ccode>from\u003c/code> for a cut-off axis (steps of 1, 2 or 5 by the range), or with \u003ccode>tally\u003c/code> a Strichliste table, the fifth stroke across each four\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>coins\u003c/code>\u003c/td>\u003ctd>\u003ccode>values: [200, 50, 10]\u003c/code> in cent (or pence)\u003c/td>\u003ctd>coins and notes of the curriculum's currency, 500 and up as notes; 1 € and 2 € (£2) two-coloured; as an option its key is the total (\"260\")\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grid\u003c/code>\u003c/td>\u003ctd>\u003ccode>cols: 8\u003c/code>, \u003ccode>rows: 6\u003c/code>, \u003ccode>cells: [[1, 2, blue]]\u003c/code>, \u003ccode>halves: [[3, 2, tl, red]]\u003c/code>, \u003ccode>lines: [[0, 0, 4, 0]]\u003c/code>, \u003ccode>axis: 4\u003c/code>, \u003ccode>labels: [[0, 0, A]]\u003c/code>, \u003ccode>dots: true\u003c/code>\u003c/td>\u003ctd>Karopapier (or a dot grid) counted from the top left; whole squares and corner triangles coloured, lines between grid points, a dashed red mirror line, letters in squares; for area in unit squares, drawing on the grid, symmetry, nets and laying shapes; as an option it needs a \u003ccode>key\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cubes\u003c/code>\u003c/td>\u003ctd>\u003ccode>plan: [[2, 1], [1, 0]]\u003c/code>, \u003ccode>mode: building / plan / front / side / top\u003c/code>, \u003ccode>colour\u003c/code>\u003c/td>\u003ctd>a cube building: plan rows run back to front, each number a stack height; \u003ccode>building\u003c/code> draws it in a slanted view, \u003ccode>plan\u003c/code> the Bauplan with the heights, \u003ccode>front\u003c/code>, \u003ccode>side\u003c/code> (from the right) and \u003ccode>top\u003c/code> the views as squares; as an option it needs a \u003ccode>key\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fraction\u003c/code>\u003c/td>\u003ctd>\u003ccode>kind: circle / bar / rect\u003c/code>, \u003ccode>parts: 4\u003c/code>, \u003ccode>shaded: 1\u003c/code>, \u003ccode>rows\u003c/code>, \u003ccode>colour\u003c/code>\u003c/td>\u003ctd>a pie, a bar or a rectangle in equal parts with the first \u003ccode>shaded\u003c/code> coloured; as an option its key is \"1/4\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>spinner\u003c/code>\u003c/td>\u003ctd>\u003ccode>sectors: [red, red, blue]\u003c/code>\u003c/td>\u003ctd>a Glücksrad with equal sectors and a pointer at the top; as an option it needs a \u003ccode>key\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>table\u003c/code>\u003c/td>\u003ctd>\u003ccode>rows: [[Tag, Fach], [Montag, Mathe]]\u003c/code>, \u003ccode>header: false\u003c/code>, \u003ccode>sheet: true\u003c/code>, \u003ccode>mark: [[1, 1]]\u003c/code>\u003c/td>\u003ctd>a table, the first row a header; \u003ccode>sheet\u003c/code> adds column letters (A, B, C) and row numbers like a spreadsheet, so cell B2 is \u003ccode>rows[1][1]\u003c/code>; \u003ccode>mark\u003c/code> colours cells yellow; \u003ccode>\"?\"\u003c/code> is a gap; as an option it needs a \u003ccode>key\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>Types in use\u003c/h4>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>What the child does\u003c/th>\u003cth>Player\u003c/th>\u003cth>First used\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>multiple_choice\u003c/code>\u003c/td>\u003ctd>taps one of 2 to 4 text options\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>image_multiple_choice\u003c/code>\u003c/td>\u003ctd>taps one of 2 to 4 pictures\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>audio_choice\u003c/code>\u003c/td>\u003ctd>hears a sound or word, taps the matching option\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>true_false\u003c/code>\u003c/td>\u003ctd>taps Ja or Nein\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fill_in_blank\u003c/code>\u003c/td>\u003ctd>fills each gap from option chips\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>text_input\u003c/code>\u003c/td>\u003ctd>types a number on a keypad\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tap_to_count\u003c/code>\u003c/td>\u003ctd>taps each picture once, then taps how many\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>count-to-5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>drag_and_drop_count\u003c/code>\u003c/td>\u003ctd>moves counters until a frame is full\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>point_on_line\u003c/code>\u003c/td>\u003ctd>taps a point on a number line\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>add-bridge-10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>highlight_in_text\u003c/code>\u003c/td>\u003ctd>taps every card that has a letter\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tracing\u003c/code>\u003c/td>\u003ctd>traces or copies a letter with a finger\u003c/td>\u003ctd>yes (any ink counts)\u003c/td>\u003ctd>letters-l-o-a-m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>speak\u003c/code>\u003c/td>\u003ctd>says a word aloud\u003c/td>\u003ctd>yes (fallback: record, compare with the model, self-check)\u003c/td>\u003ctd>en-colours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>matching\u003c/code>\u003c/td>\u003ctd>links each left item with its right item\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>en-colours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sorting\u003c/code>\u003c/td>\u003ctd>puts each item into its bin\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>en-colours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ordering\u003c/code>\u003c/td>\u003ctd>puts cards into slots in the right order\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>order-to-10\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Twist types not used yet: \u003ccode>clock_hands_drag\u003c/code>, \u003ccode>drag_and_drop\u003c/code>, \u003ccode>multi_select\u003c/code>, \u003ccode>pick_side\u003c/code>. Each gets a section here when a lesson first needs it.\u003c/p>","mocks":[{"id":"build_chart","shot":"../types/shots/mock-build_chart.png"},{"id":"clock_hands_drag","shot":"../types/shots/mock-clock_hands_drag.png"},{"id":"dialogue","shot":"../types/shots/mock-dialogue.png"},{"id":"drag_and_drop","shot":"../types/shots/mock-drag_and_drop.png"},{"id":"draw_on_grid","shot":"../types/shots/mock-draw_on_grid.png"},{"id":"multi_select","shot":"../types/shots/mock-multi_select.png"},{"id":"passage","shot":"../types/shots/mock-passage.png"},{"id":"pick_side","shot":"../types/shots/mock-pick_side.png"},{"id":"record_audio","shot":"../types/shots/mock-record_audio.png"},{"id":"self_rating","shot":"../types/shots/mock-self_rating.png"},{"id":"shade_cells","shot":"../types/shots/mock-shade_cells.png"},{"id":"tap_in_picture","shot":"../types/shots/mock-tap_in_picture.png"},{"id":"text_input-letters","shot":"../types/shots/mock-text_input-letters.png"},{"id":"write_text","shot":"../types/shots/mock-write_text.png"}],"components":[{"id":"dots","what":"A group of dots, loose or in a dice pattern, for counting and seeing amounts at a glance","data":"count: 1-20, layout: [scattered, dice, row, five-structure], colour_split: optional, e.g. [3, 2]; or array: [rows, columns] for a Punktefeld, split_rows: n colours the first n rows red and the rest blue","uses":933,"isNew":false},{"id":"ten-frame","what":"A 2 x 5 frame with counters","data":"filled: 0-10, colour_split: optional, e.g. [6, 2], cross: how many of the last counters are crossed out, cross_from: start crosses the first ones instead (the whole top row for minus 5)","uses":307,"isNew":false},{"id":"zwanzigerfeld","what":"Two ten-frames, one above the other, for numbers to 20 and adding across ten","data":"filled: '[first, second] counters, e.g. [8, 5]', move: optional counters moved from the second frame to the first","uses":139,"isNew":false},{"id":"number-line","what":"A number line with ticks, labels and jumps","data":"from: 0, to: 20, labels: [all, tens, ends], jumps: 'list of [start, size]', step: 1 / 5 / 10, mark: a value to point at","uses":405,"isNew":false},{"id":"rechenstrich","what":"An empty number line with jumps and their sizes written above","data":"start: 8, jumps: [2, 3]; a minus jump goes left (start: 43, jumps: [-3, -3]); no jumps draws a dashed ? hop, to the left with back: true","uses":80,"isNew":false},{"id":"equation","what":"A calculation with optional gaps and highlighted parts","data":"text: '8 + 5 = _', gaps: positions, split: optional '5 = 2 + 3' under a number","uses":12,"isNew":false},{"id":"part-whole","what":"The part-whole model used in England, a whole circle above two part circles joined by lines","data":"whole: 5, parts: '[2, 3]', null is a gap shown as ?","uses":67,"isNew":false},{"id":"number-house","what":"A number house (Zahlenhaus) showing a number and its parts","data":"roof: 10, rows: '[[8, 2], [7, 3]]'","uses":47,"isNew":false},{"id":"written-calc","what":"A written column calculation (schriftliches Addieren and Subtrahieren) with the Übertrag","data":"rows: numbers as strings, op: + or -, carry: a string of carried digits aligned to the columns (spaces where none), result: string with _ for a gap, above: small digits over the first number (Entbündeln), cross: x under a digit of the first number crosses it out","uses":277,"isNew":false},{"id":"number-wall","what":"A number wall (Zahlenmauer); each brick is the sum of the two bricks under it","data":"rows: bottom row first, e.g. '[[3, 5, 2], [8, 7], [null]]', null is a gap shown as ?","uses":66,"isNew":false},{"id":"base-ten","what":"Tens rods and ones cubes","data":"hundreds: 0-9 (optional), tens: 0-9, ones: 0-18 (more than 9 ones before bundling)","uses":291,"isNew":false},{"id":"hundred-field","what":"The Hunderterfeld, a 10 by 10 field of dots with gaps after five in both directions","data":"filled: 0-100 (fills row by row), colour_split: optional","uses":164,"isNew":false},{"id":"place-value-chart","what":"A place-value chart (Stellentafel), with columns labelled by language (Z E, T O; H Z E, H T O; T H Z E, Th H T O)","data":"columns: [tens, ones], [hundreds, tens, ones] up to [millions, hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: list with null for a gap","uses":197,"isNew":false},{"id":"hundred-square","what":"A 10 x 10 number square with highlights","data":"highlight: list, hide: list","uses":110,"isNew":false},{"id":"clock","what":"An analogue clock face, with or without a digital display","data":"hour: 1-12, minute: 0-59, digital: optional","uses":274,"isNew":false},{"id":"ruler","what":"A ruler in centimetres with a coloured strip above it to measure","data":"to: the ruler's last cm (15 if left out), length: the strip in cm, to the millimetre (3.8), start: where the strip begins (0 if left out), colour: [red, blue, green]","uses":68,"isNew":false},{"id":"coins","what":"Coins and notes of the curriculum's currency","data":"values: list","uses":153,"isNew":false},{"id":"shape","what":"A 2D shape or a 3D solid, outline or filled","data":"kind: [circle, triangle, square, rectangle, pentagon, hexagon, octagon, parallelogram, trapezoid, cube, cuboid, sphere, cylinder, cone, pyramid], colour: optional","uses":515,"isNew":false},{"id":"letter-card","what":"A letter or a group of letters on a card, upper and lower case","data":"text: 'Mm', style: [print, highlight-first]","uses":1519,"isNew":false},{"id":"syllable-arcs","what":"A word with syllable arcs drawn under it (Silbenbögen)","data":"word: Lama, syllables: [La, ma]","uses":107,"isNew":false},{"id":"writing-lines","what":"School writing lines with a letter or word to trace or copy, in the curriculum's script","data":"text: 'l', mode: [trace, copy], arrows: true, script: joined (Schreibschrift in the school's Ausgangsschrift: SAS, LA, VA or Grundschrift, a setting by Land; print if left out)","uses":264,"isNew":false},{"id":"sound-chart","what":"An Anlauttabelle, each field a letter with a picture whose word starts with that sound (M wie Maus)","data":"letters: [m, a, s] (a short chart, or the whole one if left out), pictures: {m: mouse} (else the first drawn picture with that initial), mark: m (highlights a field), gaps: [s] (fields shown as ?), columns: 5","uses":8,"isNew":true},{"id":"word-card","what":"A word or short sentence in large print, for reading tasks","data":"text: 'Mama', syllable_colours: optional","uses":428,"isNew":false},{"id":"colour-swatch","what":"A plain round patch of one colour","data":"colour: [red, blue, yellow, green, orange, purple, pink, brown, black, white]","uses":73,"isNew":false},{"id":"bar-chart","what":"A bar chart or pictogram from a small table","data":"rows: '[[label, value]]', step, from: scale start above 0 (cut-off axis), tally: true, pictogram_object: optional object id; a label naming a colour (Gelb, Team Grün) draws its bar in that colour, other bars take the palette in order","uses":281,"isNew":false},{"id":"grid","what":"Squared paper (Karopapier) or a dot grid with filled squares, half squares, lines, a mirror line and labels","data":"cols, rows, cells: [[c, r, colour]], halves: [[c, r, corner tl/tr/bl/br, colour]], lines: [[c1, r1, c2, r2]], axis: c, labels: [[c, r, text]], dots: true; as an option it needs a key","uses":256,"isNew":true},{"id":"cubes","what":"A building of cubes from its plan, drawn as a building, as its plan with the heights, or as the view from the front, the right side or the top","data":"plan: [[2, 1], [1, 0]] (rows back to front, columns left to right, stack heights), mode: [building, plan, front, side, top], colour; as an option it needs a key","uses":206,"isNew":true},{"id":"fraction","what":"A circle, bar or rectangle split into equal parts, some of them coloured","data":"kind: [circle, bar, rect], parts, shaded, rows (rect only), colour; as an option its key is shaded/parts","uses":39,"isNew":true},{"id":"spinner","what":"A spinner (Glücksrad) with equal sectors and a pointer","data":"sectors: [red, red, blue], one colour per sector; as an option it needs a key","uses":99,"isNew":true},{"id":"table","what":"A table of rows and columns, with a header row, or as a spreadsheet with column letters and row numbers","data":"rows: [[cells]], header: false, sheet: true, mark: [[r, c]]; '?' is a gap; as an option it needs a key","uses":152,"isNew":true},{"id":"crossed picture","what":"A picture with a red ring and line across it, for a \"not allowed\" sign","data":"show: { object: dog, crossed: true }","uses":5,"isNew":true},{"id":"Schreibschrift","what":"Writing lines in joined script, in the school's Ausgangsschrift (SAS, LA, VA or Grundschrift), a setting by Land","data":"show: { drawn: writing-lines, text, script: joined }","uses":63,"isNew":true}],"reviews":{"passes":[{"date":"2026-10-14","name":"Full de-DE review","scope":"all 338 de-DE lesson sets drafted at the time (Mathe, Deutsch, Englisch)","sets":338,"checked":"correct answers and one right option; native German; hints from nudge to answer; Learn teaches what Practise asks; skill checks that do not repeat earlier tasks; year fit; pictures and components that exist","result":"about 220 lesson sets fixed; letter groups chained as prerequisites","commit":"7d039b19"},{"date":"2026-10-14","name":"Review follow-up and authoring checks","scope":"open points of the full review, and the 30 drafts the parallel session left (Deutsch Klasse 4 media and language, Englisch)","sets":30,"checked":"as above; ballads quotes against Wikisource","result":"Klasse 4 divisors, Klasse 2 Cent range, Nomen/Verb/Adjektiv in every year, timed check for fluency-to-20, new shape kinds and the table component; \"Authoring checks\" written into docs/lesson-anatomy.md and lessons-check.mjs","commit":"3d944218"},{"date":"2026-10-14","name":"Review of the parallel session's committed sets","scope":"the 67 lesson sets committed by the parallel session (Mathe geometry, data, chance, fractions; Deutsch Klasse 1 to 4)","sets":67,"checked":"as above, plus every grid, cube, net, spinner, table and bar chart against the player's drawing code","result":"fixes in about 50 sets; bars take the colour their label names; crossed-out pictures for \"not allowed\" signs; true/false statements on screen","commit":"0afae4f6"},{"date":"2026-10-14","name":"Pictures and narration","scope":"pictures the lessons asked for; narration for every line","checked":"each new picture looked at before it was marked drawn","result":"45 pictures added and used in 25 lesson sets; 51 204 de-DE clips made, none missing","commit":"dcfe4254"},{"date":"2026-10-14","name":"Native German pass","scope":"every screen of all 433 de-DE lesson sets read as a German Grundschule teacher would (what the child sees and hears), about 21 000 screens, then a consistency sweep","sets":433,"checked":"does each screen make sense on its own; native German, not translated English; school terms; spelling, number and unit formats; options parallel; say matches the screen","result":"about 2 500 small fixes in about 330 sets; house choices for the carry (\"Schreib 3, übertrag 1\"), \"Es ist alles richtig.\", \"|\" for separators; joined-capitals names no join that differs by script","commit":"f20878ae"}],"open":[{"what":"A native German speaker reads the screens (a teacher, not a model)","status":"open"},{"what":"joined-capitals states which letters join; that depends on the school's script (VA, LA, SAS)","status":"done","how":"the lesson names no join that differs between SAS, LA and VA (only O, which does not join in any), and the model is drawn in the school's script"},{"what":"No Anlauttabelle component; sound-chart lessons show single pictures","status":"done","how":"a sound-chart component in the player; the sound-chart lesson shows it in Learn and on the \"which field\" tasks"},{"what":"The player draws print on writing lines, never joined-up script (Schreibschrift)","status":"done","how":"writing-lines takes script joined and draws it in the school's Ausgangsschrift (SAS, LA, VA or Grundschrift, a player setting); the three joined-writing lessons use it"},{"what":"en-weather teaches \"It's rainy\"; a native English speaker could weigh it against \"It's raining\"","status":"open"},{"what":"Regional words for a teacher to weigh: Mäppchen or Federtasche (an ä task relies on Mäppchen), Möhre or Karotte (picture-name tasks rely on Möhre), Fasching, Geldbeutel, Brötchen, Pulli","status":"open"},{"what":"Terms that differ by Land or textbook: the carry phrase (now 'Schreib 3, übertrag 1'), entbündeln, Nachbarzehner, Zehnerfreunde, Silbenschwingen, Verbzusatz or Vorsilbe, Wen-Fall or Akkusativ, Viertel vier","status":"open"},{"what":"Stop sounds written as single letters in say (\"fängt mit b an\") may be read as the letter name; listen to a sample","status":"done","how":"the listening model was asked sound or letter name on a sample of 12 clips; 11 were the bare sound, the 12th is a spelling question (\"Warum endet Feld mit d\"), where the letter name is right"}]},"anatomy":[{"title":"The chain","html":"\u003cp>\u003cstrong>Curriculum, Subject, Year, Topic, Skill, Lesson, Activity, Task.\u003c/strong>\u003c/p>\n\u003cp>Each level has a name for the team (and the records), a name teachers use in each country, and sometimes a different name for children. The team name is the same in every market; the other two follow the school.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Team name\u003c/th>\u003cth>England: teachers\u003c/th>\u003cth>England: children\u003c/th>\u003cth>Deutschland: Lehrkräfte\u003c/th>\u003cth>Deutschland: Kinder\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Curriculum\u003c/td>\u003ctd>Curriculum\u003c/td>\u003ctd>\u003c/td>\u003ctd>Lehrplan\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Subject\u003c/td>\u003ctd>Subject\u003c/td>\u003ctd>Maths, English, French\u003c/td>\u003ctd>Fach\u003c/td>\u003ctd>Mathe, Deutsch, Englisch\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Year\u003c/td>\u003ctd>Year group; learning year for French\u003c/td>\u003ctd>Year 2; French year 1\u003c/td>\u003ctd>Klasse; Lernjahr\u003c/td>\u003ctd>Klasse 2; Stufe 0, 1. Lernjahr\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Topic\u003c/td>\u003ctd>Topic\u003c/td>\u003ctd>Topic\u003c/td>\u003ctd>Thema\u003c/td>\u003ctd>Thema\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Skill\u003c/td>\u003ctd>Skill (learning objective)\u003c/td>\u003ctd>\"I can ...\"\u003c/td>\u003ctd>Kompetenz (Lernziel)\u003c/td>\u003ctd>\"Ich kann ...\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Lesson\u003c/td>\u003ctd>Lesson\u003c/td>\u003ctd>Lesson 2 of 4\u003c/td>\u003ctd>Lektion\u003c/td>\u003ctd>Lektion 2 von 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Activity\u003c/td>\u003ctd>Activity (lesson phase)\u003c/td>\u003ctd>Warm up, Learn, Practise, Show what you know\u003c/td>\u003ctd>Phase\u003c/td>\u003ctd>Aufwärmen, Entdecken, Üben, Zeig, was du kannst\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Task\u003c/td>\u003ctd>Task, question\u003c/td>\u003ctd>(no label; just the next thing to do)\u003c/td>\u003ctd>Aufgabe\u003c/td>\u003ctd>Aufgabe\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>How it reads in a sentence: \u003cem>In Year 2 Maths, the topic \"Adding and subtracting to 20\" has six skills. \"I can add across ten\" is taught in three lessons. Each lesson is a few activities (warm up, learn, practise, show what you know) made of about 15 tasks.\u003c/em>\u003c/p>\n\u003cp>What each level is:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Curriculum\u003c/strong>: everything taught in one country, in its own language. Two for now: Deutschland (de-DE) and England (en-GB).\u003c/li>\u003cli>\u003cstrong>Subject\u003c/strong>: one school subject in that curriculum. Behind it sits a shared domain (\u003ccode>math\u003c/code>, \u003ccode>lit-de\u003c/code>, \u003ccode>lit-en\u003c/code>, \u003ccode>fl\u003c/code>), so Mathe and Maths use the same skills where the learning is the same.\u003c/li>\u003cli>\u003cstrong>Year\u003c/strong>: the school year a child is in, which sets what their curriculum expects by the end of it. Foreign languages count by learning year, because schools start them at different ages.\u003c/li>\u003cli>\u003cstrong>Topic\u003c/strong>: a block of related skills; the sections a child sees in a year.\u003c/li>\u003cli>\u003cstrong>Skill\u003c/strong>: one thing the child learns to do, said as \"I can ...\" or \"Ich kann ...\". Placement in a year, mastery and the child's level are all recorded per skill.\u003c/li>\u003cli>\u003cstrong>Lesson\u003c/strong>: one short sitting. A skill is taught over 2 to 6 lessons.\u003c/li>\u003cli>\u003cstrong>Activity\u003c/strong>: one block inside a lesson with one job (below).\u003c/li>\u003cli>\u003cstrong>Task\u003c/strong>: one thing the child does: answer, tap, drag, say, write.\u003c/li>\u003c/ul>\n\u003cp>Two more levels are for the team and teachers only:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Team name\u003c/th>\u003cth>England\u003c/th>\u003cth>Deutschland\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Learning progression\u003c/td>\u003ctd>Learning progression\u003c/td>\u003ctd>Lernstrang\u003c/td>\u003ctd>The skills of one strand in teaching order, across all years (place value, spelling strategies)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Standard\u003c/td>\u003ctd>Statutory requirement; early learning goal\u003c/td>\u003ctd>Kompetenzerwartung; Bildungsstandard\u003c/td>\u003ctd>One line of an official document, quoted, that skills are mapped to\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Earlier names, for reading older notes: a skill was called a step (and a learning goal for a short while); a lesson was called a part; a task was called an item or a question; a topic was called a unit; a year was called a stage; a curriculum was called a profile; a standard was called an objective. In schoolido-learning a skill is still a \u003ccode>skill\u003c/code> and a lesson part is still a \u003ccode>module\u003c/code>.\u003c/p>"},{"title":"Skills and lessons","html":"\u003cp>A skill is taught over several short lessons because the learners are young: attention is short, and a skill sticks better when it comes back over several sittings than when it is drilled in one.\u003c/p>\n\u003cul>\u003cli>A skill has as many lessons as it needs: a small one (read and set half past) may need 2, a large one (written subtraction with exchange) 5 or 6. Sometimes two skills that cannot be taught apart share their lessons.\u003c/li>\u003cli>Lesson length follows the child's age:\u003c/li>\u003c/ul>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Age\u003c/th>\u003cth>Lesson length\u003c/th>\u003cth>Tasks per lesson\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4 to 5\u003c/td>\u003ctd>about 8 minutes\u003c/td>\u003ctd>14 to 24\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 to 7\u003c/td>\u003ctd>about 10 to 12 minutes\u003c/td>\u003ctd>18 to 28\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8 to 10\u003c/td>\u003ctd>about 12 to 15 minutes\u003c/td>\u003ctd>20 to 32\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Most of a lesson is Practise: three stages of 5 or 6 tasks each, so 15 to 18 practice tasks before the check. Learn screens and tracing take longer than a tap, so a lesson with several of them sits at the low end. (Raised after the second round of model lessons, when Practise became three stages; they came out at 18 to 24 tasks.)\u003c/p>\n\u003cul>\u003cli>Each lesson can be finished and left. The next lesson opens straight away; when a skill has more than two lessons, the app suggests the next one on a later day, so the skill spreads over several sittings.\u003c/li>\u003cli>Each lesson builds on the one before: a new part of the skill, the same skill with less help, or a new way of showing it.\u003c/li>\u003cli>The last lesson of a skill ends with the skill check (see Mastery).\u003c/li>\u003c/ul>"},{"title":"Activities","html":"\u003cp>Four general activities make up every lesson. They are deliberately few: the differences between lessons come from settings on the activity, not from more activity names.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Activity\u003c/th>\u003cth>Children see\u003c/th>\u003cth>Deutsch\u003c/th>\u003cth>Job\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Warm-up\u003c/strong>\u003c/td>\u003ctd>Warm up\u003c/td>\u003ctd>Aufwärmen\u003c/td>\u003ctd>Recall what this builds on, or what the last lesson taught\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Learn\u003c/strong>\u003c/td>\u003ctd>Learn\u003c/td>\u003ctd>Entdecken\u003c/td>\u003ctd>Teaching: examples, a demonstration, a model text, a new sound\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Practise\u003c/strong>\u003c/td>\u003ctd>Practise\u003c/td>\u003ctd>Üben\u003c/td>\u003ctd>The long part of the lesson: three stages, from full hints to none\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Check\u003c/strong>\u003c/td>\u003ctd>Show what you know\u003c/td>\u003ctd>Zeig, was du kannst\u003c/td>\u003ctd>Short, no help, counts toward mastery\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Every activity opens with an intro screen: the mascot, the activity's name and one spoken line (\"Wir wärmen uns auf.\", phrases.yaml). The lesson start, each change of practise stage and the lesson end are static screens with the mascot too. Each of these seven screen kinds has three mascot poses (assets/mascot.yaml, files in assets/mascot/: start, warmup, learn, practise, stage, check, end, each -1 to -3). The app picks one by lesson and rotates on, so neighbouring lessons and the two stage changes in one lesson show different poses.\u003c/p>\n\u003ch5>What each activity can be set to\u003c/h5>\n\u003cp>\u003cstrong>Warm-up\u003c/strong> draws its tasks from one of two places:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>Means\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>from: earlier skills\u003c/td>\u003ctd>The skills this one builds on (what used to be the \"starter\")\u003c/td>\u003c/tr>\u003ctr>\u003ctd>from: last lesson\u003c/td>\u003ctd>The previous lesson of the same skill (what used to be the \"recap\")\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Learn\u003c/strong> is shown in one of these ways; no answers are scored:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>Means\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>worked examples\u003c/td>\u003ctd>2 to 4 solved examples, one step at a time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>demonstration\u003c/td>\u003ctd>a narrated animation of the drawn model (ten-frame, number line, letter formation)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>model text\u003c/td>\u003ctd>a text to read or hear before writing or answering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>new sound or word\u003c/td>\u003ctd>hear it, see it, say it (phonics, foreign language)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>do it with me\u003c/td>\u003ctd>the child taps along; nothing is marked\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Practise\u003c/strong> is where the child does most of the work, so it is the longest activity in every lesson. It always runs in three stages, in this order, and the Check comes after the third:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Hints\u003c/th>\u003cth>Tasks\u003c/th>\u003cth>What happens on a miss\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>full\u003c/td>\u003ctd>3 hint levels: a strategy, thinking aloud, a direct cue\u003c/td>\u003ctd>5 or 6\u003c/td>\u003ctd>the next hint opens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>some\u003c/td>\u003ctd>1 hint\u003c/td>\u003ctd>5 or 6\u003c/td>\u003ctd>the hint opens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>none\u003c/td>\u003ctd>no hints\u003c/td>\u003ctd>5 or 6\u003c/td>\u003ctd>after two misses the answer is shown and the task counts as neither right nor wrong\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>What used to be three activities (guided practice, practice, apply) is now one Practise whose help fades as the child goes. The child sees one activity; the app may show a small marker between stages.\u003c/p>\n\u003cp>Practise also has a setting, for the whole activity or for one stage:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>Means\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>plain\u003c/td>\u003ctd>the skill on its own\u003c/td>\u003ctd>8 + 5 = ?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>in context\u003c/td>\u003ctd>a word problem, a sentence, a short text, a speaking task\u003c/td>\u003ctd>Lena has 8 marbles and gets 5 more ...\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A common shape is plain for the first two stages and in context for the last, so the child applies the skill once the hints are gone. A whole Practise can be in context, as in a story lesson.\u003c/p>\n\u003cp>Tasks get harder across the stages as well as losing hints: the full stage starts easy and shows the drawn model; by the none stage the model is often gone and the answer is typed rather than chosen.\u003c/p>\n\u003cp>\u003cstrong>Check\u003c/strong> comes in three sizes, all without help, where only the first try counts:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>Means\u003c/th>\u003cth>Counts for mastery\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>quick check\u003c/td>\u003ctd>3 tasks at the end of a lesson, so the lesson ends on success\u003c/td>\u003ctd>no; it tells the app whether to slow down\u003c/td>\u003c/tr>\u003ctr>\u003ctd>skill check\u003c/td>\u003ctd>4 or 5 tasks at the end of the last lesson of a skill\u003c/td>\u003ctd>yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>timed\u003c/td>\u003ctd>a skill check with a time per task, for facts to know by heart\u003c/td>\u003ctd>yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Every check is spoken by a second voice, a little more focused and serious than the teaching voice, so the child hears that this part counts. The teaching voice comes back when the lesson ends. Which voices these are is set in assets/voices.yaml.\u003c/p>\n\u003ch5>Rules from the model lessons\u003c/h5>\n\u003cp>Writing the first three model lessons (Mathe, Deutsch, Englisch) added these. The build checks every one of them.\u003c/p>\n\u003col>\u003cli>\u003cstrong>Tracing carries its own support.\u003c/strong> The trace guide and arrows are the help, so tracing tasks take no text hints in any stage. In the none stage the child copies the letter without the guide.\u003c/li>\u003cli>\u003cstrong>A skill check never copies a task.\u003c/strong> It may test the same thing again (with four letters there are only so many sounds), but not the identical task with the same options. Quick checks may repeat.\u003c/li>\u003cli>\u003cstrong>Oral lessons need no reading.\u003c/strong> A lesson marked \u003ccode>no_reading\u003c/code> (Stufe 0, ages 4 to 5) has no task where the child must read an option or a prompt; instructions are spoken, options are pictures or sounds. Number options are allowed when each one can be heard (its speaker says it).\u003c/li>\u003cli>\u003cstrong>Speaking is practised, not marked.\u003c/strong> Speech recognition for young children is not reliable enough to decide mastery, so \u003ccode>speak\u003c/code> tasks belong in Practise and are left out of skill checks.\u003c/li>\u003cli>\u003cstrong>Instructions in the home language, at first.\u003c/strong> In Stufe 0 and the first French lessons the instructions are spoken in German or English and only the target words in the new language; classroom phrases in the new language come in as the child learns them.\u003c/li>\u003cli>\u003cstrong>Warm-ups draw only on what came before.\u003c/strong> \u003ccode>builds_on\u003c/code> must be a prerequisite of the skill, directly or further back.\u003c/li>\u003cli>\u003cstrong>Metadata matches the tasks.\u003c/strong> The drawn components and sounds a lesson declares are exactly the ones its tasks use, so the asset lists stay true.\u003c/li>\u003cli>\u003cstrong>A lesson ends on something the child does,\u003c/strong> never on Learn.\u003c/li>\u003c/ol>\n\u003ch5>Leaving activities out\u003c/h5>\n\u003cp>Any activity can be left out, depending on the lesson, the subject and the child's age. Two rules always hold:\u003c/p>\n\u003col>\u003cli>Anything new gets a Learn before the first Practise.\u003c/li>\u003cli>The last lesson of a skill ends with a skill check.\u003c/li>\u003c/ol>\n\u003cp>Examples:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Lesson\u003c/th>\u003cth>Activities\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>First lesson of a new idea\u003c/td>\u003ctd>Warm-up (earlier skills), Learn, Practise, Check (quick)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A middle lesson\u003c/td>\u003ctd>Warm-up (last lesson), Learn (a second model), Practise, Check (quick)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A recap lesson\u003c/td>\u003ctd>Warm-up, Practise, Check; no Learn\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ages 4 to 5\u003c/td>\u003ctd>Learn, Practise, Check (quick, 3 tasks); no Warm-up\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A times-table lesson after the first\u003c/td>\u003ctd>Warm-up, Practise, Check (timed)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Last lesson of a skill\u003c/td>\u003ctd>Warm-up (last lesson), Practise (last stage in context), Check (skill check)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Practise always has all three stages; what changes between lessons is what the tasks ask and whether a stage is in context.\u003c/p>\n\u003ch5>Typical lesson plans by subject\u003c/h5>\n\u003cp>Starting shapes, not fixed templates. Authors change them when a skill is bigger or smaller.\u003c/p>\n\u003cp>\u003cstrong>Maths / Mathe, a new idea\u003c/strong> (place value, a new operation): 3 to 4 lessons. Lesson 1: warm-up, learn with a drawn model (ten-frame, Zwanzigerfeld, number line), practise, quick check. Lesson 2: warm-up, learn with a second model, practise, quick check. Lesson 3: warm-up, practise in context (a word problem, Sachaufgabe). Lesson 4: warm-up, practise, skill check.\u003c/p>\n\u003cp>\u003cstrong>Maths / Mathe, facts to know by heart\u003c/strong> (the 7 times table, number bonds to 10): 2 to 3 lessons with a short learn (work it out from a fact you know), then long practise whose last stage adds speed, timed skill check at the end. Most of the work then happens in practice sessions outside the lessons.\u003c/p>\n\u003cp>\u003cstrong>Deutsch, a group of letters\u003c/strong> (L, O, A, M): one lesson per letter plus one mixed lesson. Each letter lesson: learn (hear the sound, see the letter), practise (find it at the start of words, blend syllables with letters already known, trace and copy it). Mixed lesson: warm-up, practise reading and writing short words with all four, skill check.\u003c/p>\n\u003cp>\u003cstrong>English, phonics\u003c/strong> (s, a, t, p): the same shape as the German letter group, following the school's phonics order.\u003c/p>\n\u003cp>\u003cstrong>Reading\u003c/strong> (find information, read between the lines): 2 to 3 lessons. Learn the strategy on a short text read aloud, practise with full support on a second text, then a new text with practise and the skill check. Texts match the child's age; for ages 4 to 7 they are read aloud.\u003c/p>\n\u003cp>\u003cstrong>Writing and grammar\u003c/strong> (direct speech, a report): learn from a model text, practise on sentences (complete, reorder, correct), then practise in context where the child writes their own sentences or a short text. The skill check uses tasks with answers to choose or short answers to write; free writing is not marked automatically.\u003c/p>\n\u003cp>\u003cstrong>Englisch / French\u003c/strong> (a theme, a language pattern): learn (hear and repeat), practise (match word and picture or meaning, then use it in a short dialogue or phrase, speaking), check. Listening and speaking come before reading and writing, especially in Stufe 0 and for ages 4 to 7.\u003c/p>"},{"title":"Tasks","html":"\u003cp>Tasks are written by hand, so every lesson is checked by a person before a child sees it.\u003c/p>\n\u003cp>Each task records:\u003c/p>\n\u003cul>\u003cli>its task type (one of the Twist question types) and the activity it belongs to;\u003c/li>\u003cli>what the child reads and what the app says aloud (audio is always available for ages 4 to 7);\u003c/li>\u003cli>how it is shown (below) and the data needed to draw it;\u003c/li>\u003cli>the correct answer and feedback for each typical wrong answer;\u003c/li>\u003cli>whether its options can be heard: a picture option says its word and a number is read aloud, unless hearing it would give the answer away (a letter, a syllable, or any option in a \"which one sounds like this\" task);\u003c/li>\u003cli>the hints its Practise stage asks for: three in the full stage (a strategy, thinking aloud, a direct cue), one in the some stage, none in the none stage or in a Check;\u003c/li>\u003cli>difficulty (easy, core, stretch) and the local details it depends on (currency, number format, handwriting script, written-subtraction method).\u003c/li>\u003c/ul>\n\u003ch5>Fewer images\u003c/h5>\n\u003cp>Each task uses the least image-heavy form that still teaches the skill. The lesson records which form it relies on.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Form\u003c/th>\u003cth>Use it for\u003c/th>\u003cth>Made by\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Text\u003c/td>\u003ctd>most reading and writing tasks; word problems for ages 8 to 10\u003c/td>\u003ctd>the author\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Audio\u003c/td>\u003ctd>instructions, sounds, words, dictation, listening\u003c/td>\u003ctd>recorded clips; text-to-speech for sentences\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Drawn\u003c/td>\u003ctd>ten-frames, Zwanzigerfeld, number lines, Rechenstrich, Hundertertafel, place-value charts, clocks, coins and notes, shapes, grids, coordinates, charts\u003c/td>\u003ctd>the app, from data in the task\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Picture\u003c/td>\u003ctd>vocabulary nouns, early word-picture matches, story scenes\u003c/td>\u003ctd>one shared picture library, one picture per concept\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Photo\u003c/td>\u003ctd>only where a real object matters (measuring tools, real coins)\u003c/td>\u003ctd>the shared library\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Pictures are reused by concept across lessons, curricula and languages: one picture of a cat serves Deutsch, English, Englisch and French.\u003c/p>\n\u003ch5>Versions of a task\u003c/h5>\n\u003cp>A task can have versions; the skill and what the task asks stay the same.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>By age\u003c/strong>: 4 to 5 (led by audio, no reading needed, big targets, fewer tasks), 6 to 7 (audio support, short text), 8 to 10 (led by text). An older beginner gets the 8 to 10 version of an early skill.\u003c/li>\u003cli>\u003cstrong>By country\u003c/strong>: € or £, 3,5 or 3.5, \u003ccode>·\u003c/code> or \u003ccode>×\u003c/code>, the written-subtraction method, the handwriting script.\u003c/li>\u003cli>\u003cstrong>By target language\u003c/strong>, for Englisch and French lessons: the words, audio and examples in that language.\u003c/li>\u003c/ul>\n\u003ch5>Authoring checks\u003c/h5>\n\u003cp>Written after the full de-DE review of 2026-10-14, which fixed about 220 lesson sets for the same few mistakes. Each lesson set meets these before it counts as drafted.\u003c/p>\n\u003cp>The build warns on these (lessons-check.mjs):\u003c/p>\n\u003cul>\u003cli>Lesson 1's warm-up comes from earlier skills, never from the last lesson, and those skills are named in \u003ccode>builds_on\u003c/code> as prerequisites.\u003c/li>\u003cli>A skill check never repeats a Practise or Warm-up task; change the numbers, the words or the question.\u003c/li>\u003cli>True/false tasks in a set do not all have the same answer.\u003c/li>\u003cli>Options that differ only in capitals, spaces or hyphens (Dunkelrot, dunkelrot, dunkel rot) sound the same, so they carry \u003ccode>option_audio: false\u003c/code>.\u003c/li>\u003cli>A \"Wo ist der Fehler?\" task always has a mistake; when \"no mistake\" is a possible answer, ask \"Gibt es einen Fehler?\".\u003c/li>\u003cli>German numbers: four digits without a space (4380), five or more grouped with a space (34 500). In \u003ccode>say\u003c/code>, numbers of 10 000 or more are written in words; the voice misreads them in digits. A text with \u003ccode>·\u003c/code> or \u003ccode>|\u003c/code> gets its own \u003ccode>say\u003c/code>, because the voice reads the sign.\u003c/li>\u003cli>Hints say the idea itself, never \"Denk an den Lernteil\".\u003c/li>\u003cli>A true/false task shows its statement on screen, not only \"Stimmt das?\" with the statement in \u003ccode>say\u003c/code>.\u003c/li>\u003cli>List items with a question mark are quoted (\u003ccode>\"Wer?\"\u003c/code>); narration.py reads the files with PyYAML, which rejects them bare.\u003c/li>\u003c/ul>\n\u003cp>The author checks these by reading every task:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>One right answer.\u003c/strong> Work out every answer. No distractor may also be right (a square is also a Parallelogramm; 285 is divisible by 3 as well as 5; Delfin and Delphin are both in the Duden).\u003c/li>\u003cli>\u003cstrong>What the screen shows.\u003c/strong> The question and its data are on screen, not only in \u003ccode>say\u003c/code>. Text, \u003ccode>say\u003c/code>, drawn data and hints give the same numbers. A drawn component shows what the text claims, and only what the component can draw (drawn.yaml).\u003c/li>\u003cli>\u003cstrong>Hints climb.\u003c/strong> A nudge, then the strategy, then the answer. No hint gives the answer away early or repeats the one before.\u003c/li>\u003cli>\u003cstrong>Learn teaches what Practise asks.\u003c/strong> Every word, rule or shape a task needs appears in Learn first (Trapez, über, ß). Metadata \u003ccode>misconceptions.addressed\u003c/code> names the tasks that really address it.\u003c/li>\u003cli>\u003cstrong>The year fits.\u003c/strong> Numbers stay in the year's range (Cent to 100 in Klasse 2), methods follow the Lehrplan (one-digit divisors in Klasse 4), and a Klasse 1 letter task uses only letters already taught.\u003c/li>\u003cli>\u003cstrong>German as a teacher says it.\u003c/strong> Nomen, Verb, Adjektiv in every year (Klasse 1 and 2 may add \"Tunwort\" once, where the term is introduced); German quotes „…“; du-form, short sentences. In Englisch, hints are in German and never mix English nouns into German sentences (\"auf einem chair\").\u003c/li>\u003cli>\u003cstrong>No accidental giveaways.\u003c/strong> A noun is not the only capitalised option; a spoken picture name does not say the answer; options in a sound task are not read aloud.\u003c/li>\u003c/ul>"},{"title":"Mastery","html":"\u003cp>Mastery is recorded per child and per skill. It decides where a child works, what is suggested next, what comes back for recap, and how the child stands against what their year expects.\u003c/p>\n\u003ch5>States\u003c/h5>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>State\u003c/th>\u003cth>English\u003c/th>\u003cth>Deutsch\u003c/th>\u003cth>Means\u003c/th>\u003cth>Reached by\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Not started\u003c/td>\u003ctd>Noch nicht begonnen\u003c/td>\u003ctd>No evidence yet\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Learning\u003c/td>\u003ctd>Lerne ich gerade\u003c/td>\u003ctd>The child has started its lessons\u003c/td>\u003ctd>Opening lesson 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Practised\u003c/td>\u003ctd>Geübt\u003c/td>\u003ctd>The child finished the lessons but has not yet shown the skill reliably\u003c/td>\u003ctd>Finishing the last lesson below the pass mark\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Secure\u003c/td>\u003ctd>Kann ich\u003c/td>\u003ctd>The child can do it now, without help\u003c/td>\u003ctd>Passing the skill check, or a placement check\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Mastered\u003c/td>\u003ctd>Kann ich sicher\u003c/td>\u003ctd>The child can still do it later\u003c/td>\u003ctd>Passing recaps on two days at least a week apart\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Needs a recap\u003c/td>\u003ctd>Wiederholen\u003c/td>\u003ctd>A later recap was missed\u003c/td>\u003ctd>Failing a recap of a secure or mastered skill\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A child sees the states as stars or a badge on each \"I can\" skill. \u003ccode>Needs a recap\u003c/code> puts the skill back into practice sessions; passing the next recap returns it to the state it had.\u003c/p>\n\u003ch5>The skill check\u003c/h5>\n\u003cul>\u003cli>5 tasks for ages 6 and up, 4 for ages 4 to 5, taken from across the skill's lessons and covering each part of the skill at least once.\u003c/li>\u003cli>No hints. Only the first try counts. A shown answer counts as wrong.\u003c/li>\u003cli>Pass mark: at least 4 of 5 (3 of 4 for ages 4 to 5), and every core task of the skill answered correctly at least once in its lessons.\u003c/li>\u003cli>If the child does not pass, the skill stays at \u003ccode>Practised\u003c/code>. The app offers one short extra lesson (Learn again in a different way, then Practise with full support) and a new skill check with different tasks. A child is never asked to repeat all the lessons.\u003c/li>\u003c/ul>\n\u003ch5>Recaps: from secure to mastered\u003c/h5>\n\u003cp>Remembering later is the real aim, so \u003ccode>Secure\u003c/code> is not the end.\u003c/p>\n\u003cul>\u003cli>Recaps come back in practice sessions and topic recaps, spaced out: about 2 days, 1 week, 3 weeks and 2 months after the skill became secure.\u003c/li>\u003cli>A recap of one skill is 2 or 3 tasks, mixed with tasks from other skills.\u003c/li>\u003cli>Mastered: the skill was secure, and the child passed recaps on two different days at least a week apart.\u003c/li>\u003cli>A failed recap (fewer than 2 of 3, or 1 of 2) sets \u003ccode>Needs a recap\u003c/code> and brings the next recap closer.\u003c/li>\u003c/ul>\n\u003ch5>Placement checks: where a child really is\u003c/h5>\n\u003cp>A child does not have to start at the first skill of their year, and does not have to sit through skills they already know.\u003c/p>\n\u003cul>\u003cli>A placement check (Einstufung) for one learning progression asks 1 or 2 tasks per skill, starting at what the child's year expects and moving up after success and down after mistakes, until it finds the edge.\u003c/li>\u003cli>A skill passed in a placement check (2 of 2, or 1 of 1 for ages 4 to 5) becomes \u003ccode>Secure\u003c/code>, and its first recap is scheduled. Skills it builds on in the same progression count as secure too.\u003c/li>\u003cli>The first skill the child misses becomes the next one to learn.\u003c/li>\u003c/ul>\n\u003ch5>What a skill needs first, and access\u003c/h5>\n\u003cul>\u003cli>A skill is suggested when every skill it builds on is at least \u003ccode>Practised\u003c/code>.\u003c/li>\u003cli>A child can still open any skill. If something it builds on is not secure, its first lesson starts with a short recap of that.\u003c/li>\u003c/ul>\n\u003ch5>Level and standing\u003c/h5>\n\u003cul>\u003cli>\u003cstrong>Level\u003c/strong> in a learning progression: the furthest skill the child has reached with everything it builds on secure. This is where the child works in that progression.\u003c/li>\u003cli>\u003cstrong>Standing\u003c/strong> in a subject, shown to parents: the share of the skills in the child's year that are secure or mastered, compared with how far the school year has run. Shown as ahead, on track or catching up. It never blocks the child.\u003c/li>\u003c/ul>\n\u003ch5>What counts, and what does not\u003c/h5>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Counts\u003c/th>\u003cth>Does not count\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Skill checks, first try\u003c/td>\u003ctd>Quick checks at the end of a lesson\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warm-up tasks that recall earlier skills, after the skill is secure\u003c/td>\u003ctd>Practise tasks inside lessons\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recaps in practice sessions\u003c/td>\u003ctd>Answers shown after two misses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Placement checks; start-of-year and end-of-year checks\u003c/td>\u003ctd>Speed, except in a timed skill check\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Skills that are facts to know by heart (number bonds, times tables, Blitzlesen) use the timed skill check: correct, and within a set time per task for the child's age.\u003c/p>\n\u003ch5>Practice outside lessons\u003c/h5>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>English\u003c/th>\u003cth>Deutsch\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Practice session\u003c/td>\u003ctd>Übungsrunde\u003c/td>\u003ctd>About 14 tasks of one skill, or a mix of due recaps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Topic recap\u003c/td>\u003ctd>Themenwiederholung\u003c/td>\u003ctd>Mixed tasks from all skills of a topic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Placement check\u003c/td>\u003ctd>Einstufung\u003c/td>\u003ctd>Finds the child's level in one learning progression\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Start-of-year and end-of-year check\u003c/td>\u003ctd>Eingangs- und Abschlusscheck\u003c/td>\u003ctd>A check across the year's skills, for the whole subject\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch5>Numbers to tune\u003c/h5>\n\u003cp>All thresholds above are starting values: skill check length, pass mark, recap spacing, the mastered rule, the placement rule and the time targets. They are set per age in the app's configuration, not in the content, and should be adjusted from real data once children use the app.\u003c/p>"}],"model":[{"title":"Names","html":"\u003cp>The chain is \u003
