ds the verb in short sentences with the question \"Was tut …?\" and the ich-Probe (ich laufe, ich male); lesson 2 adds verbs for things that happen (es regnet, das Eis schmilzt), tells verbs from Nomen and Adjektiven, and ends with the skill check."}},{"id":"lit-de.verbs.conjugate","domain":"lit-de","topic":"Verben","can":"Ich kann Verben zur Person passend beugen (ich spiele, du spielst, er spielt).","standards":["kmk-deutsch-2022.sp.11","kmk-deutsch-2022.sp.13"],"set":{"title":"Verben beugen","file":"twist/lessons/de-DE/klasse-2/lit-de/verbs-conjugate.yaml","lessons":[{"n":1,"title":"ich, du, er, sie, es","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"wir, ihr, sie","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Das Verb passt sich an, wer etwas tut: ich spiele, du spielst, er spielt. Lesson 1 builds the forms for ich, du and er, sie, es from the word stem and its ending; lesson 2 adds wir, ihr and sie, puts the whole table together, and ends with the skill check. Only regular verbs whose stem does not end in t, d, s or z, so every ending is the plain one."}},{"id":"lit-de.verbs.base-form","domain":"lit-de","topic":"Verben","can":"Ich kann zu einer gebeugten Verbform die Grundform finden (sie läuft, laufen).","standards":["kmk-deutsch-2022.sp.11"],"set":{"title":"Die Grundform finden","file":"twist/lessons/de-DE/klasse-2/lit-de/verbs-base-form.yaml","lessons":[{"n":1,"title":"Die wir-Probe","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Wenn sich der Selbstlaut ändert","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Zu jeder Verbform gehört eine Grundform, so steht das Verb im Wörterbuch: sie spielt, spielen. Lesson 1 finds it with the wir-Probe (wir spielen) for regular verbs; lesson 2 does the same for verbs whose vowel changes (sie läuft, laufen; du isst, essen; er gibt, geben), and ends with the skill check."}},{"id":"lit-de.verbs.prefixes","domain":"lit-de","topic":"Verben","can":"Ich kann Verben mit Vorsilben bilden (ver-, vor-, ab-, auf-, zer-, ent-, be-) und sagen, wie sich die Bedeutung ändert.","standards":["kmk-deutsch-2022.sp.9"],"set":{"title":"Verben mit Vorsilben","file":"twist/lessons/de-DE/klasse-2/lit-de/verbs-prefixes.yaml","lessons":[{"n":1,"title":"Eine Vorsilbe davor","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"ver, ent und be","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Eine Vorsilbe vor dem Verb macht ein neues Verb mit neuer Bedeutung: lesen, vorlesen; kaufen, verkaufen. Lesson 1 builds verbs with auf-, ab-, vor- and zer- and picks the one that fits a sentence; lesson 2 adds ver-, ent- and be-, says what the new verb means, shows that auf-, ab- and vor- move to the end of the sentence (Ich stehe auf.), and ends with the skill check."}},{"id":"lit-de.adjectives.recognise","domain":"lit-de","topic":"Adjektive","can":"Ich kann Adjektive erkennen, die sagen, wie etwas ist (groß, rot, lustig).","standards":["kmk-deutsch-2022.sp.13"],"set":{"title":"Adjektive erkennen","file":"twist/lessons/de-DE/klasse-2/lit-de/adjectives-recognise.yaml","lessons":[{"n":1,"title":"Wie ist es?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Nomen, Verb oder Adjektiv?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Adjektive (Wiewörter) say how someone or something is: groß, rot, lustig. Lesson 1 finds them with the Wie-Frage (\"Wie ist der Ball?\") and in pictures; lesson 2 finds them in sentences, tells them apart from Nomen and Verben, and ends with the skill check."}},{"id":"lit-de.adjectives.describe","domain":"lit-de","topic":"Adjektive","can":"Ich kann mit passenden Adjektiven Menschen, Tiere und Dinge genau beschreiben.","standards":["kmk-deutsch-2022.sp.10","kmk-deutsch-2022.sch.23"],"set":{"title":"Genau beschreiben mit Adjektiven","file":"twist/lessons/de-DE/klasse-2/lit-de/adjectives-describe.yaml","lessons":[{"n":1,"title":"Was passt? Was ist das Gegenteil?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Genauer beschreiben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Choosing adjectives that fit and describe precisely. Lesson 1 picks the adjective that fits a picture and finds opposites (groß und klein, laut und leise); lesson 2 makes a description more precise (ein Hund → ein kleiner, brauner Hund), guesses a thing from adjectives, and ends with the skill check."}},{"id":"lit-de.adjectives.agreement","domain":"lit-de","topic":"Adjektive","can":"Ich kann Adjektive an das Nomen anpassen (der rote Ball, ein roter Ball, die roten Bälle).","standards":["kmk-deutsch-2022.sp.11"],"set":{"title":"Adjektive vor dem Nomen","file":"twist/lessons/de-DE/klasse-2/lit-de/adjectives-agreement.yaml","lessons":[{"n":1,"title":"der, die, das: immer -e","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"ein großer Hund, ein großes Haus","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"An adjective before a noun gets an ending that fits the noun: der rote Ball, ein roter Ball, die roten Bälle. Lesson 1 uses der, die, das (der große Hund, die große Katze, das große Haus: always -e); lesson 2 uses ein and eine (ein großer Hund, eine große Katze, ein großes Haus) and the plural (die großen Hunde), and ends with the skill check. Only the Nominativ is used here."}},{"id":"lit-de.sentences.end-punctuation","domain":"lit-de","topic":"Satzarten","can":"Ich kann Aussagesätze, Fragesätze und Ausrufesätze unterscheiden und das passende Satzschlusszeichen setzen.","standards":["kmk-deutsch-2022.sch.8","kmk-deutsch-2022.sp.12"],"set":{"title":"Punkt, Fragezeichen, Ausrufezeichen","file":"twist/lessons/de-DE/klasse-2/lit-de/sentences-end-punctuation.yaml","lessons":[{"n":1,"title":"Punkt oder Fragezeichen?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Das Ausrufezeichen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The three kinds of sentence and the mark at their end. Lesson 1 tells Aussagesatz (Punkt) from Fragesatz (Fragezeichen), with and without a question word; lesson 2 adds the Ausrufesatz (Ausrufezeichen) for a call, a wish or a strong feeling, sorts all three, and ends with the skill check."}},{"id":"lit-de.sentences.questions","domain":"lit-de","topic":"Satzarten","can":"Ich kann Fragesätze mit und ohne Fragewort bilden und sehe, wo dann das Verb steht.","standards":["kmk-deutsch-2022.sp.12"],"set":{"title":"Fragen stellen","file":"twist/lessons/de-DE/klasse-2/lit-de/sentences-questions.yaml","lessons":[{"n":1,"title":"Wer? Was? Wo? Wann? Wie?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Fragen ohne Fragewort","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Building questions. Lesson 1 asks with a question word (Wer? Was? Wo? Wann? Wie?) and picks the word that fits the answer; lesson 2 builds yes-no questions by putting the verb first (Spielt Tim Fußball?), turns statements into questions, and ends with the skill check."}},{"id":"lit-de.vocabulary.word-fields","domain":"lit-de","topic":"Wortschatz","can":"Ich kann Wortfelder sammeln (gehen, laufen, rennen, schleichen) und das treffende Wort auswählen.","standards":["kmk-deutsch-2022.sp.10","kmk-deutsch-2022.sch.13"],"set":{"title":"Wortfelder","file":"twist/lessons/de-DE/klasse-2/lit-de/word-fields.yaml","lessons":[{"n":1,"title":"Das Wortfeld gehen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Das treffende Wort","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"A Wortfeld holds words with a similar meaning. Lesson 1 collects the Wortfeld gehen (laufen, rennen, schleichen, hüpfen) and tells its words from words that are only about the same topic (Schuh, Weg); lesson 2 adds the Wortfeld sagen (rufen, flüstern, fragen, antworten), picks the word that fits a sentence best, and ends with the skill check."}},{"id":"lit-de.spelling.vowels-consonants","domain":"lit-de","topic":"Laute und Buchstaben","can":"Ich kann Selbstlaute, Umlaute, Zwielaute und Mitlaute unterscheiden und weiß, dass jede Silbe einen Selbstlaut braucht.","standards":["kmk-deutsch-2022.sp.11","kmk-deutsch-2022.sp.17"],"set":{"title":"Selbstlaute, Mitlaute, Umlaute, Zwielaute","file":"twist/lessons/de-DE/klasse-2/lit-de/vowels-consonants.yaml","lessons":[{"n":1,"title":"Selbstlaute und Mitlaute","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Umlaute und Zwielaute","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The kinds of letters and sounds. Lesson 1 tells the Selbstlaute a, e, i, o, u from the Mitlaute and shows that every syllable needs a Selbstlaut; lesson 2 adds the Umlaute ä, ö, ü and the Zwielaute au, ei, eu, and ends with the skill check."}},{"id":"lit-de.spelling.short-long-vowels","domain":"lit-de","topic":"Kurze und lange Selbstlaute","can":"Ich kann hören, ob ein Selbstlaut kurz oder lang gesprochen wird (Hüte, Hütte).","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sp.17"],"set":{"title":"Kurze und lange Selbstlaute","file":"twist/lessons/de-DE/klasse-2/lit-de/short-long-vowels.yaml","lessons":[{"n":1,"title":"Hase oder Ball?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Hüte oder Hütte?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Hearing whether a vowel is short or long. Lesson 1 compares Hase and Ball and sorts pictures by the vowel; lesson 2 takes word pairs that only differ in the length (Hüte, Hütte; Ofen, offen; Beet, Bett), picks the word that fits a sentence, and ends with the skill check."}},{"id":"lit-de.spelling.special-sounds","domain":"lit-de","topic":"Besondere Laute","can":"Ich schreibe Wörter mit sp, st, qu, v, x, chs und äu richtig (Spiel, Quark, Vogel, Hexe, Fuchs, Häuser).","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sch.5"],"set":{"title":"Sp, St, Qu, V, X und chs","file":"twist/lessons/de-DE/klasse-2/lit-de/special-sounds.yaml","lessons":[{"n":1,"title":"Sp und St","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Qu, V, X und chs","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Letters that are not written the way they sound. Lesson 1 takes Sp and St (schp and scht are written Sp and St); lesson 2 takes Qu for kw, V for f in Merkwörter (Vogel, Vater, viel, vor), and x or chs for ks (Hexe, Fuchs, sechs), and ends with the skill check."}},{"id":"lit-de.spelling-strategies.syllable-swinging","domain":"lit-de","topic":"Rechtschreibstrategien","can":"Ich kann Wörter in Silben schwingen und dabei jeden Laut mitsprechen, um sie richtig zu schreiben (Silbenschwingen).","standards":["kmk-deutsch-2022.sch.4"],"set":{"title":"Silben schwingen","file":"twist/lessons/de-DE/klasse-2/lit-de/syllable-swinging.yaml","lessons":[{"n":1,"title":"Silben schwingen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Beim Schreiben mitsprechen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Silbenschwingen as a spelling strategy. Lesson 1 swings words into syllables, counts them and builds words from syllable cards; lesson 2 speaks every sound of each syllable while writing, finds the letters that fast speaking loses (Tomte for Tomate), and ends with the skill check."}},{"id":"lit-de.spelling-strategies.syllable-cores","domain":"lit-de","topic":"Rechtschreibstrategien","can":"Ich finde in jeder Silbe den Silbenkern und kann offene und geschlossene Silben unterscheiden.","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.les.1"],"set":{"title":"Silbenkern, offene und geschlossene Silben","file":"twist/lessons/de-DE/klasse-2/lit-de/syllable-cores.yaml","lessons":[{"n":1,"title":"Der Silbenkern","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Offen oder geschlossen?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 finds the Silbenkern of each syllable, a Selbstlaut or a Zwielaut (o in Ro, au in Mau); lesson 2 tells open syllables that end with the core (Ro-se) from closed ones that end with a Mitlaut (Son-ne), links them to long and short vowels, and ends with the skill check."}},{"id":"lit-de.spelling-strategies.lengthen-dt","domain":"lit-de","topic":"Rechtschreibstrategien","can":"Ich kann Wörter verlängern, um zu hören, ob am Ende d oder t steht (Hund, weil die Hunde).","standards":["kmk-deutsch-2022.sch.4"],"set":{"title":"Verlängern bei d und t","file":"twist/lessons/de-DE/klasse-2/lit-de/lengthen-dt.yaml","lessons":[{"n":1,"title":"Hund mit d, Brot mit t","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Auch Adjektive verlängern","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"At the end of a word d and t sound the same. Lesson 1 makes a noun longer with its plural (Hund, Hunde; Brot, Brote) to hear which letter it is; lesson 2 does the same for Adjektive with a noun (rund, ein runder Ball; bunt, ein buntes Bild), and ends with the skill check."}},{"id":"lit-de.spelling-strategies.lengthen-bp-gk","domain":"lit-de","topic":"Rechtschreibstrategien","can":"Ich kann mit Verlängern auch b und p, g und k am Wortende unterscheiden (Korb, Berg).","standards":["kmk-deutsch-2022.sch.4"],"set":{"title":"Verlängern bei b und p, g und k","file":"twist/lessons/de-DE/klasse-2/lit-de/lengthen-bp-gk.yaml","lessons":[{"n":1,"title":"Korb und Berg","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Gelb, klug und stark","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Verlängern works for b and p and for g and k too. Lesson 1 takes nouns (Korb, Körbe; Berg, Berge; Schrank, Schränke); lesson 2 takes Adjektive (gelb, gelbe; klug, kluge; stark, starke) and mixes all three letter pairs with d and t, and ends with the skill check."}},{"id":"lit-de.spelling-strategies.word-stem","domain":"lit-de","topic":"Wortstamm und Wortfamilie","can":"Ich kann den Wortstamm finden und Wörter einer Wortfamilie sammeln (fahren, Fahrer, Fahrrad).","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sp.9"],"set":{"title":"Wortstamm und Wortfamilie","file":"twist/lessons/de-DE/klasse-2/lit-de/word-stem.yaml","lessons":[{"n":1,"title":"Der Wortstamm","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wortfamilien sammeln","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Words that share a Wortstamm form a Wortfamilie, and the stem is spelt the same in all of them. Lesson 1 finds the stem (fahr in fahren, Fahrer, Fahrrad) and tells real family members from look-alikes (Fahne, Farbe); lesson 2 collects families with parts in front and behind (abfahren, Fahrt), across Nomen, Verben and Adjektive, and ends with the skill check."}},{"id":"lit-de.spelling-strategies.derive-ae-aeu","domain":"lit-de","topic":"Rechtschreibstrategien","can":"Ich kann Wörter mit ä und äu von verwandten Wörtern mit a und au ableiten (Bäume von Baum, er fährt von fahren).","standards":["kmk-deutsch-2022.sch.4"],"set":{"title":"Ableiten bei ä und äu","file":"twist/lessons/de-DE/klasse-2/lit-de/derive-ae-aeu.yaml","lessons":[{"n":1,"title":"ä kommt von a","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"äu kommt von au","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"ä sounds like e, and äu sounds like eu. Lesson 1 finds a related word with a (Hände from Hand, er fährt from fahren) and writes e when there is none (Bett); lesson 2 does the same for äu from au (Bäume from Baum) against eu (heute), and ends with a mixed skill check."}},{"id":"lit-de.spelling-strategies.memory-words","domain":"lit-de","topic":"Merkwörter","can":"Ich weiß, dass manche Wörter Merkwörter sind, und präge sie mir ein (Wörter mit Dehnungs-h, doppeltem Selbstlaut, Wochentage, Monate, Zahlwörter).","standards":["kmk-deutsch-2022.sch.4","kmk-deutsch-2022.sch.5"],"set":{"title":"Merkwörter","file":"twist/lessons/de-DE/klasse-2/lit-de/memory-words.yaml","lessons":[{"n":1,"title":"Uhr und Boot","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wochentage, Monate, Zahlwörter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Some spellings cannot be heard or worked out and must be learnt. Lesson 1 takes words with the Dehnungs-h (Uhr, Kuh, Stuhl) and with a double Selbstlaut (Boot, Meer, Haar) and how to learn them; lesson 2 takes the Wochentage, the Monate and the Zahlwörter, and ends with the skill check."}},{"id":"lit-de.spelling.core-vocabulary","domain":"lit-de","topic":"Rechtschreibung üben","can":"Ich kann die häufigsten Wörter des Grundwortschatzes richtig schreiben, auch im Diktat.","standards":["kmk-deutsch-2022.sch.5"],"set":{"title":"Wörter, die oft vorkommen","file":"twist/lessons/de-DE/klasse-2/lit-de/core-vocabulary.yaml","lessons":[{"n":1,"title":"Kleine Wörter","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wichtige Wörter im Satz","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The most common words of the Grundwortschatz. Lesson 1 takes small words that come in almost every sentence (und, ist, nicht, auch, sehr, schon, immer); lesson 2 takes common Verben and Nomen (gehen, sehen, heute, wieder, Freund, Schule, nach Hause), finds a misspelt word in a sentence, and ends with the skill check. Writing the words in a dictation waits for the letter keyboard (text_input with letters)."}},{"id":"lit-de.fluency.sight-words-longer","domain":"lit-de","topic":"Blitzlesen","can":"Ich erkenne auch längere Wörter des Grundwortschatzes schnell und sicher.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.les.6"],"set":{"title":"Lange Wörter blitzlesen","file":"twist/lessons/de-DE/klasse-2/lit-de/sight-words-longer.yaml","lessons":[{"n":1,"title":"Auf einen Blick","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Lange Wörter in Teilen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Recognising longer words of the Grundwortschatz at a glance. Lesson 1 flashes a word for two seconds and the child picks it from words with the same beginning (Hausaufgaben, Hausmeister, Haustür) or finds its picture; lesson 2 sees long words in parts, finds them among look-alikes on cards, and ends with the skill check."}},{"id":"lit-de.comprehension.read-precisely","domain":"lit-de","topic":"Genau lesen","can":"Ich kann Sätze und Texte genau lesen und merke, wenn ein Wort nicht passt oder ein Satz unsinnig ist.","standards":["kmk-deutsch-2022.les.8","kmk-deutsch-2022.les.13"],"set":{"title":"Genau lesen","file":"twist/lessons/de-DE/klasse-2/lit-de/read-precisely.yaml","lessons":[{"n":1,"title":"Kann das sein?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Genau lesen in Geschichten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading word by word and checking that it makes sense. Lesson 1 judges single sentences (Kann das sein?), taps the word that does not fit and picks the word that belongs there; lesson 2 does the same in short stories and finds the sentence that does not belong to the story, and ends with the skill check."}},{"id":"lit-de.comprehension.find-information","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann in einem Text gezielt Informationen finden, die direkt im Text stehen.","standards":["kmk-deutsch-2022.les.8"],"set":{"title":"Informationen im Text finden","file":"twist/lessons/de-DE/klasse-2/lit-de/find-information.yaml","lessons":[{"n":1,"title":"Die Antwort steht im Text","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Informationen in Sachtexten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Finding answers that stand in the text. Lesson 1 reads short stories, takes the question word as a guide (Wer, Wo, Wann, Wie viele) and finds the sentence with the answer; lesson 2 reads short Sachtexte about animals, sorts what the text says from what it does not say, records facts in gaps, and ends with the skill check."}},{"id":"lit-de.comprehension.key-words","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann Schlüsselwörter in einem Text finden und markieren.","standards":["kmk-deutsch-2022.les.13"],"set":{"title":"Schlüsselwörter finden","file":"twist/lessons/de-DE/klasse-2/lit-de/key-words.yaml","lessons":[{"n":1,"title":"Die wichtigen Wörter","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Schlüsselwörter im Text","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Schlüsselwörter are the few words that carry what matters. Lesson 1 finds them in single sentences, tells them from small words (der, und, im) and marks only the words that answer a question; lesson 2 finds the key words that show what a short Sachtext is about, takes the key word of a question into the text, and ends with the skill check."}},{"id":"lit-de.comprehension.skim","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann einen Text überfliegen und mit Überschriften, Bildern und Absätzen schnell erfassen, worum es geht.","standards":["kmk-deutsch-2022.les.7","kmk-deutsch-2022.les.12"],"set":{"title":"Texte überfliegen","file":"twist/lessons/de-DE/klasse-2/lit-de/skim.yaml","lessons":[{"n":1,"title":"Worum geht es?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Absätze und kleine Überschriften","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Skimming: seeing quickly what a text is about. Lesson 1 looks at the heading and the picture first, names the topic of the whole text (not a detail from one sentence) and picks a heading or picture that fits; lesson 2 uses paragraphs with small headings to find the one paragraph that answers a question, and ends with the skill check."}},{"id":"lit-de.comprehension.infer-words","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann die Bedeutung unbekannter Wörter aus dem Text erschließen oder sie nachschlagen.","standards":["kmk-deutsch-2022.les.13","kmk-deutsch-2022.les.11"],"set":{"title":"Unbekannte Wörter verstehen","file":"twist/lessons/de-DE/klasse-2/lit-de/infer-words.yaml","lessons":[{"n":1,"title":"Der Satz hilft","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Weiterlesen und nachschlagen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Working out what a new word means. Lesson 1 finds the clue in the same sentence or the next one (Der Fuchs ist flink. Kein Hund kann ihn fangen.) and the word in the text that means nearly the same; lesson 2 reads on for the clue, uses a known word inside a long one (verschlafen, Federtasche), knows when to look a word up and under which letter, and ends with the skill check."}},{"id":"lit-de.texts-media.text-types","domain":"lit-de","topic":"Textarten","can":"Ich kann Textarten unterscheiden (Geschichte, Gedicht, Anleitung, Lexikoneintrag, Witz, Brief) und sagen, wozu sie da sind.","standards":["kmk-deutsch-2022.tm.2","kmk-deutsch-2022.tm.3"],"set":{"title":"Textarten","file":"twist/lessons/de-DE/klasse-2/lit-de/text-types.yaml","lessons":[{"n":1,"title":"Textarten erkennen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wozu ist der Text da?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Telling Geschichte, Gedicht, Anleitung, Lexikoneintrag, Witz and Brief apart and knowing what each is for. Lesson 1 recognises each kind by its form (Es war einmal, Verse that rhyme, numbered steps, a heading word with facts, a punch line, Liebe Oma), also when two texts share a topic; lesson 2 says what each kind is for, picks the kind a wish needs (Waffeln backen: ein Rezept), and ends with the skill check."}},{"id":"lit-de.texts-media.instructions","domain":"lit-de","topic":"Textarten","can":"Ich kann Anleitungen und Rezepte lesen und die Schritte in der richtigen Reihenfolge verstehen.","standards":["kmk-deutsch-2022.tm.3","kmk-deutsch-2022.les.8"],"set":{"title":"Anleitungen und Rezepte lesen","file":"twist/lessons/de-DE/klasse-2/lit-de/read-instructions.yaml","lessons":[{"n":1,"title":"Schritt für Schritt","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Rezepte lesen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading an Anleitung or a Rezept and following the steps in order. Lesson 1 reads short Anleitungen (Kakao, Obstspieß, Stein bemalen): what you need, what comes first and next, the order of the steps and the words zuerst, dann, zum Schluss; lesson 2 reads Rezepte, tells Zutaten from Schritte, reads amounts, finds a missing step, and ends with the skill check."}},{"id":"lit-de.texts-media.poems","domain":"lit-de","topic":"Geschichten und Gedichte","can":"Ich kann in Gedichten Reime, Verse und Strophen erkennen und beschreiben, wie ein Gedicht klingt und wirkt.","standards":["kmk-deutsch-2022.tm.17","kmk-deutsch-2022.sp.16"],"set":{"title":"Gedichte untersuchen","file":"twist/lessons/de-DE/klasse-2/lit-de/poems.yaml","lessons":[{"n":1,"title":"Reime und Verse","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Strophen und wie ein Gedicht klingt","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Looking closely at short poems written for Twist. Lesson 1 finds the rhyming words at the ends of the Verse, tells a rhyme from words that only start alike (Haus, Hose), and counts the Verse; lesson 2 counts the Strophen and the Verse in each, says how a poem sounds (fröhlich, traurig, ruhig) and which word shows it, and ends with the skill check."}},{"id":"lit-de.texts-media.text-picture","domain":"lit-de","topic":"Geschichten und Gedichte","can":"Ich kann Text und Bild in Bilderbüchern, Comics und Sachtexten aufeinander beziehen und sagen, was das Bild zusätzlich erzählt.","standards":["kmk-deutsch-2022.tm.13","kmk-deutsch-2022.les.9","kmk-deutsch-2022.tm.4"],"set":{"title":"Text und Bild","file":"twist/lessons/de-DE/klasse-2/lit-de/text-picture.yaml","lessons":[{"n":1,"title":"Passt das Bild zum Text?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Was das Bild dazu erzählt","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Relating a text to its picture. Lesson 1 checks whether a picture fits the text (Lena ist traurig, but the child on the picture laughs) and finds the picture for a sentence or a short Sachtext; lesson 2 says what the picture adds that the text does not say (a feeling, the weather, what an animal looks like), tells Sprechblase, Denkblase and Erzählkasten apart in a comic, and ends with the skill check."}},{"id":"lit-de.writing.lists-cards","domain":"lit-de","topic":"Texte schreiben","can":"Ich kann Listen, kurze Nachrichten, Einladungen und Glückwunschkarten schreiben.","standards":["kmk-deutsch-2022.sch.19","kmk-deutsch-2022.sch.20"],"set":{"title":"Zettel, Einladungen und Karten","file":"twist/lessons/de-DE/klasse-2/lit-de/lists-cards.yaml","lessons":[{"n":1,"title":"Einkaufszettel und Nachrichten","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Einladungen und Glückwunschkarten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Short everyday texts and what goes into them. Lesson 1 writes a Einkaufszettel (one word per line, with the amount, no whole sentences) and a short Nachricht on a Zettel (wo bin ich, wann komme ich zurück, wer schreibt); lesson 2 checks an Einladung with Wer? Was? Wann? Wo?, builds a Glückwunschkarte from Anrede, Glückwunsch and Gruß, picks the wish for the occasion, and ends with the skill check. Writing the text freely waits for a free text task type; here the child chooses, sorts and orders the parts."}},{"id":"lit-de.writing.letters-emails","domain":"lit-de","topic":"Texte schreiben","can":"Ich kann einen Brief und eine E-Mail mit Anrede, Text und Gruß an eine bekannte Person schreiben.","standards":["kmk-deutsch-2022.sch.19","kmk-deutsch-2022.sch.20","kmk-deutsch-2022.sch.14"],"set":{"title":"Brief und E-Mail","file":"twist/lessons/de-DE/klasse-2/lit-de/letters-emails.yaml","lessons":[{"n":1,"title":"Der Brief","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die E-Mail","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The parts of a letter and an e-mail to someone the child knows. Lesson 1 names Ort und Datum, Anrede, Text, Gruß and Name, chooses Lieber or Liebe with the comma after it, and puts the parts of a letter in order; lesson 2 adds what an e-mail has on top (An, Betreff), picks a Betreff that says what the e-mail is about, sees that the computer sets the date, and ends with the skill check. Writing the letter itself waits for a free text task type; here the child chooses and orders the parts."}},{"id":"lit-de.writing.describe","domain":"lit-de","topic":"Beschreiben","can":"Ich kann einen Steckbrief schreiben und Personen, Tiere, Gegenstände oder Bilder genau beschreiben.","standards":["kmk-deutsch-2022.sch.20","kmk-deutsch-2022.sch.18"],"set":{"title":"Genau beschreiben","file":"twist/lessons/de-DE/klasse-2/lit-de/describe.yaml","lessons":[{"n":1,"title":"So sieht es aus","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Der Steckbrief","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Describing things, animals and people so that someone else can picture or find them, and writing a Steckbrief. Lesson 1 asks Farbe? Form? Größe? Woraus? Was ist besonders?, picks the sentence that helps find a lost thing, guesses a thing or an animal from its description and matches a picture to its description; lesson 2 reads and fills Steckbriefe about animals and children, sorts Stichwörter under their headings, keeps opinions out, and ends with the skill check. Writing the description freely waits for a free text task type."}},{"id":"lit-de.writing.instructions","domain":"lit-de","topic":"Beschreiben","can":"Ich kann einen Ablauf in der richtigen Reihenfolge beschreiben, zum Beispiel eine Spielanleitung oder ein Rezept.","standards":["kmk-deutsch-2022.sch.20","kmk-deutsch-2022.sch.18"],"set":{"title":"Anleitungen schreiben","file":"twist/lessons/de-DE/klasse-2/lit-de/write-instructions.yaml","lessons":[{"n":1,"title":"Schritt für Schritt aufschreiben","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Klar und genau","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Writing a short Anleitung that someone else can follow. Lesson 1 puts the steps in order, uses zuerst, dann and zum Schluss, starts with what you need, and finds the step that is missing; lesson 2 writes each step as a clear instruction (Gieß ..., not Ich habe ... gegossen), says exactly how much, picks a heading, keeps story and opinion sentences out, and ends with the skill check. Writing the whole Anleitung freely waits for a free text task type; here the child orders, chooses and sorts steps."}},{"id":"lit-de.writing.story-pictures","domain":"lit-de","topic":"Erzählen","can":"Ich kann zu einer Bildergeschichte eine zusammenhängende Geschichte schreiben, mit Anfang, Mitte und Schluss.","standards":["kmk-deutsch-2022.sch.20","kmk-deutsch-2022.sch.18","kmk-deutsch-2022.sch.21"],"set":{"title":"Zu Bildern erzählen","file":"twist/lessons/de-DE/klasse-2/lit-de/story-pictures.yaml","lessons":[{"n":1,"title":"Anfang, Mitte und Schluss","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Sätze verbinden","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Turning a Bildergeschichte into a connected story. Lesson 1 finds the sentence that tells what happens in a picture (not \"Auf Bild 2 ist ...\"), puts the sentences in order, and names Anfang, Mitte and Schluss; lesson 2 links the sentences with Eines Tages, Plötzlich, Da, Zum Glück and Am Ende instead of und dann, picks a heading, and ends with the skill check. The four stories are written for Twist; each picture is given as one line of text, with a bank picture beside it where one fits. Writing the story freely waits for a free text task type."}},{"id":"lit-de.writing.poems","domain":"lit-de","topic":"Gedichte schreiben","can":"Ich kann nach einem Muster eigene Gedichte schreiben, zum Beispiel ein Elfchen, ein Haiku oder ein Reimgedicht.","standards":["kmk-deutsch-2022.sch.20","kmk-deutsch-2022.sch.21"],"set":{"title":"Gedichte schreiben","file":"twist/lessons/de-DE/klasse-2/lit-de/write-poems.yaml","lessons":[{"n":1,"title":"Das Elfchen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Reime schreiben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Writing poems to a pattern. Lesson 1 builds an Elfchen: one, two, three, four and one word in five lines, what goes into each line, counting words and not letters, and putting the lines in order; lesson 2 writes Reimgedichte: a Reimwort that both rhymes and makes sense, a second Vers that rhymes with the first, rhyme pairs, and ends with the skill check across both patterns. All poems are written for Twist. Writing a poem freely waits for a free text task type; here the child chooses, orders and completes lines."}},{"id":"lit-de.writing.plan","domain":"lit-de","topic":"Texte planen","can":"Ich kann vor dem Schreiben Ideen sammeln, zum Beispiel in einem Cluster, und einen roten Faden planen.","standards":["kmk-deutsch-2022.sch.12","kmk-deutsch-2022.sch.13","kmk-deutsch-2022.sch.17"],"set":{"title":"Ideen sammeln und planen","file":"twist/lessons/de-DE/klasse-2/lit-de/plan-texts.yaml","lessons":[{"n":1,"title":"Ideen sammeln im Cluster","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Der Schreibplan","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Planning before writing. Lesson 1 collects ideas in a Cluster: the Thema in the middle, Stichwörter around it, questions that bring ideas (Wer? Wo? Was passiert?), and only ideas that fit the Thema; lesson 2 crosses out ideas that do not fit, turns the rest into a Schreibplan with Anfang, Mitte and Schluss, and ends with the skill check. Drawing a Cluster freely waits for a free text task type; here the child chooses, sorts and orders ideas."}},{"id":"lit-de.writing.revise","domain":"lit-de","topic":"Texte überarbeiten","can":"Ich kann meinen Text überarbeiten, mit Hilfe einer Checkliste: Wortwahl, Satzanfänge, Reihenfolge, Verständlichkeit.","standards":["kmk-deutsch-2022.sch.24","kmk-deutsch-2022.sch.25","kmk-deutsch-2022.sch.28"],"set":{"title":"Texte überarbeiten","file":"twist/lessons/de-DE/klasse-2/lit-de/revise-texts.yaml","lessons":[{"n":1,"title":"Die Schreibkonferenz","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Den Text verbessern","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Making a text better with others and with a checklist. Lesson 1 runs a Schreibkonferenz: one child reads, the others say what they like and give a friendly, exact tip, the writer decides; it matches problems in a text to the checklist questions (Überschrift, Reihenfolge, Satzanfänge, genaue Wörter, versteht man alles?); lesson 2 changes repeated Satzanfänge, finds more exact words, puts sentences in order, spots an unclear er or sie, and ends with the skill check. Revising a child's own text waits for a free text task type; here the child chooses, orders and matches."}},{"id":"lit-de.speaking.listen-understand","domain":"lit-de","topic":"Sprechen und Zuhören","can":"Ich kann einem Hörtext zuhören, wichtige Informationen wiedergeben und nachfragen, wenn ich etwas nicht verstehe.","standards":["kmk-deutsch-2022.sz.10","kmk-deutsch-2022.sz.9","kmk-deutsch-2022.sz.11"],"set":{"title":"Zuhören und verstehen","file":"twist/lessons/de-DE/klasse-2/lit-de/listen-understand.yaml","lessons":[{"n":1,"title":"Was ist wichtig?","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Weitersagen und nachfragen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":45,"summary":"Listening to a short Hörtext (a message from the teacher, a Durchsage, a child talking about a pet) and taking out what matters. Lesson 1 listens with the W-Fragen Wer, Was, Wo and Wann and answers them from the text; lesson 2 passes the key information on to someone else, asks a precise question when something was missed, and ends with the skill check. Every Hörtext is spoken; the child answers with short sentences, words or pictures. Passing on and asking aloud are practised with speak tasks and not marked."}},{"id":"lit-de.speaking.describe-explain","domain":"lit-de","topic":"Sprechen und Zuhören","can":"Ich kann etwas mündlich beschreiben und erklären, sodass andere es verstehen.","standards":["kmk-deutsch-2022.sz.3","kmk-deutsch-2022.sz.14"],"set":{"title":"Beschreiben und erklären","file":"twist/lessons/de-DE/klasse-2/lit-de/describe-explain.yaml","lessons":[{"n":1,"title":"Genau beschreiben","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Schritt für Schritt erklären","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":45,"summary":"Saying something so that a listener who cannot see it understands. Lesson 1 describes a thing, an animal or a person with Farbe, Form, Größe and what is special about it, and swaps vague words (das Ding, da drüben) for exact ones; lesson 2 explains a game or a way to do something step by step with zuerst, dann, danach and zum Schluss, finds the missing or the unneeded step, and ends with the skill check. The app cannot mark speech, so the child chooses, orders and checks descriptions and explanations; saying them aloud is practised with speak tasks and not marked."}},{"id":"lit-de.handwriting.joined-lowercase","domain":"lit-de","topic":"Schreibschrift","can":"Ich kann die kleinen Buchstaben in Schreibschrift schreiben und miteinander verbinden.","standards":["kmk-deutsch-2022.sch.1","kmk-deutsch-2022.sch.2"],"set":{"title":"Schreibschrift, kleine Buchstaben","file":"twist/lessons/de-DE/klasse-2/lit-de/joined-lowercase.yaml","lessons":[{"n":1,"title":"Unten verbunden","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Oben verbunden","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Children write the small letters in Schreibschrift and join them, so a word is written in one go without lifting the pen. Lesson 1 joins at the bottom: most small letters end low and the joining stroke runs up into the next letter (im, mein, lila); lesson 2 joins at the top after o, w, v and b, sets i-Punkte, Umlaut-Punkte and t-Striche once the word is finished, and ends with the skill check. Tracing and copying on writing lines teach the joins; choice, sorting and true or false tasks check what the child knows about them. No task names one Ausgangsschrift: the joins taught (most letters end low, o, w, v and b end high) hold for the joined scripts German schools use. The player still draws the writing lines in print, so no task says the child can see a join; the spoken text describes the movement instead."}},{"id":"lit-de.handwriting.joined-capitals","domain":"lit-de","topic":"Schreibschrift","can":"Ich kann die großen Buchstaben in Schreibschrift schreiben und an die kleinen anschließen.","standards":["kmk-deutsch-2022.sch.1","kmk-deutsch-2022.sch.2"],"set":{"title":"Schreibschrift, große Buchstaben","file":"twist/lessons/de-DE/klasse-2/lit-de/joined-capitals.yaml","lessons":[{"n":1,"title":"Die großen Buchstaben","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Groß und klein zusammen","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Children write the capital letters in Schreibschrift and go on from them into the small letters of the word. Lesson 1 sets out where the capitals live (from the line up to the Dach) and when a word starts with one (Satzanfang, Nomen, Namen); lesson 2 joins a capital to the rest of the word, and where a capital is not joined, sets the next letter close beside it so the word stays together; it ends with the skill check. Every writing-lines task uses `script: joined`, so the child sees the model in the school's Ausgangsschrift (SAS, LA, VA or Grundschrift, a setting) and can see where a capital joins on. Which capitals join differs between these scripts, so the lesson teaches only what holds in all of them: some capitals join on and some do not, the child follows the model on the lines, and the one capital named as not joining is O, which ends at the top in SAS, LA and VA. Word options for \"which word do you write with a capital\" are shown in small letters, so the capital does not give the answer away."}},{"id":"lit-de.handwriting.joined-fluent","domain":"lit-de","topic":"Schreibschrift","can":"Ich kann Wörter und Sätze flüssig und gut lesbar in Schreibschrift schreiben.","standards":["kmk-deutsch-2022.sch.1","kmk-deutsch-2022.sch.2"],"set":{"title":"Flüssig und leserlich schreiben","file":"twist/lessons/de-DE/klasse-2/lit-de/joined-fluent.yaml","lessons":[{"n":1,"title":"Leserlich schreiben","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Flüssig schreiben","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Children write words and sentences in Schreibschrift so that others can read them, and without stopping after every letter. Lesson 1 looks at what makes writing leserlich: clear letters (an open a turns Hand into Hund), letters of the same size sitting on the line, and a finger gap between words; lesson 2 is about writing flüssig: a loose grip, not pressing too hard, remembering a group of words and writing it in one go, and checking the writing at the end; it ends with the skill check. Copying on writing lines is the practice; the check asks what makes writing easy to read and to write. The models on the writing lines are still drawn in print, so the copy tasks ask the child to write them in Schreibschrift, as in a school Übertragung."}}]},{"id":"klasse-3","label":"Klasse 3","skills":[{"id":"math.numbers-to-1000.hundreds","domain":"math","topic":"Zahlen bis 1000","can":"Ich kann Zehner zu Hundertern bündeln und Zahlen bis 1000 mit Hundertern, Zehnern und Einern darstellen.","standards":["kmk-mathe-2022.zo.1","kmk-mathe-2022.zo.2","nc-maths-2014.y3.number-number-and-place-value.4"],"set":{"title":"Hunderter bündeln","file":"twist/lessons/de-DE/klasse-3/math/hundreds.yaml","lessons":[{"n":1,"title":"Zehn Zehner sind ein Hunderter","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Hunderter, Zehner und Einer","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"The first lesson of Klasse 3 opens the Tausenderraum: ten tens make a hundred, as ten ones made a ten. Lesson 1 bundles tens into hundreds and counts hundreds; lesson 2 shows three-digit numbers with Hunderter, Zehner and Einer, and ends with the skill check."}},{"id":"math.numbers-to-1000.place-value","domain":"math","topic":"Zahlen bis 1000","can":"Ich kann dreistellige Zahlen in die Stellentafel (H, Z, E) eintragen und den Wert jeder Ziffer nennen.","standards":["kmk-mathe-2022.zo.1","kmk-mathe-2022.zo.2","nc-maths-2014.y3.number-number-and-place-value.2"],"set":{"title":"Die Stellentafel bis 1000","file":"twist/lessons/de-DE/klasse-3/math/place-value-to-1000.yaml","lessons":[{"n":1,"title":"H, Z und E","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Was ist die Ziffer wert?","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Three-digit numbers in the Stellentafel (H, Z, E) and the value of each digit: in 352 the 5 is worth 50. Lesson 1 enters numbers in the chart; lesson 2 names what each digit is worth, splits numbers into Hunderter, Zehner and Einer, and ends with the skill check."}},{"id":"math.numbers-to-1000.read-write","domain":"math","topic":"Zahlen bis 1000","can":"Ich kann Zahlen bis 1000 lesen und als Ziffern und Zahlwort schreiben.","standards":["kmk-mathe-2022.zo.2","nc-maths-2014.y3.number-number-and-place-value.5"],"set":{"title":"Zahlen bis 1000 lesen und schreiben","file":"twist/lessons/de-DE/klasse-3/math/read-write-to-1000.yaml","lessons":[{"n":1,"title":"Hören und schreiben","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Zahlwörter bis 1000","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"A three-digit number word in German says the hundreds first and then the two-digit part with its ones first (dreihundertachtundvierzig is 348). Lesson 1 hears numbers and writes them in digits; lesson 2 reads and writes number words, and ends with the skill check."}},{"id":"math.numbers-to-1000.number-line","domain":"math","topic":"Zahlen bis 1000","can":"Ich kann Zahlen bis 1000 am Zahlenstrahl und auf der Tausendertafel finden und eintragen.","standards":["kmk-mathe-2022.zo.2","kmk-mathe-2022.zo.3","nc-maths-2014.y3.number-number-and-place-value.4"],"set":{"title":"Der Zahlenstrahl bis 1000","file":"twist/lessons/de-DE/klasse-3/math/number-line-to-1000.yaml","lessons":[{"n":1,"title":"Hunderter und Zehner finden","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Pfeile lesen","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Zooming in on the Zahlenstrahl: 0 to 1000 in hundreds, one hundred in tens, one ten in ones. Lesson 1 finds hundreds and tens; lesson 2 reads arrows on lines with different steps, and ends with the skill check. The skill's Tausendertafel is the same idea as the Hundertertafel and comes in a later lesson."}},{"id":"math.numbers-to-1000.order-compare","domain":"math","topic":"Zahlen bis 1000","can":"Ich kann Zahlen bis 1000 ordnen und vergleichen und Nachbarzehner und Nachbarhunderter bestimmen.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y3.number-number-and-place-value.3"],"set":{"title":"Ordnen und vergleichen bis 1000","file":"twist/lessons/de-DE/klasse-3/math/order-compare-to-1000.yaml","lessons":[{"n":1,"title":"Von links vergleichen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Nachbarzehner und Nachbarhunderter","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Comparing three-digit numbers from the left: hundreds first, then tens, then ones. Lesson 1 compares and orders; lesson 2 finds Nachbarzehner and Nachbarhunderter, and ends with the skill check."}},{"id":"math.numbers-to-1000.sequences","domain":"math","topic":"Zahlen bis 1000","can":"Ich kann bis 1000 in Schritten zählen und Zahlenfolgen fortsetzen und erklären.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y3.number-number-and-place-value.1"],"set":{"title":"Zahlenfolgen bis 1000","file":"twist/lessons/de-DE/klasse-3/math/sequences-to-1000.yaml","lessons":[{"n":1,"title":"In großen Schritten zählen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Regeln finden und erklären","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Counting in steps (2, 5, 10, 20, 25, 30, 50, 100 and 200) from any start, across hundreds, and explaining the rule of a sequence. Lesson 1 continues sequences, including steps across a hundred (390, 400, 410); lesson 2 finds and explains rules and ends with the skill check."}},{"id":"math.numbers-to-1000.round","domain":"math","topic":"Zahlen bis 1000","can":"Ich kann Zahlen bis 1000 auf Zehner und Hunderter runden.","standards":["kmk-mathe-2022.zo.13"],"set":{"title":"Runden auf Zehner und Hunderter","file":"twist/lessons/de-DE/klasse-3/math/round-to-1000.yaml","lessons":[{"n":1,"title":"Auf Zehner runden","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Auf Hunderter runden","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Rounding finds the nearest ten or hundred, using the Nachbarzehner and Nachbarhunderter from the last skill. Lesson 1 rounds to tens; lesson 2 rounds to hundreds, with the rule for 5 and 50 (round up), and ends with the skill check."}},{"id":"math.numbers-to-1000.number-puzzles","domain":"math","topic":"Zahlen bis 1000","can":"Ich kann Zahlenrätsel bis 1000 lösen und eigene Rätsel zu Stellenwerten erfinden.","standards":["kmk-mathe-2022.pk-probleme.2","nc-maths-2014.y3.number-number-and-place-value.6","nc-maths-2014.y4.number-number-and-place-value.8"],"set":{"title":"Zahlenrätsel bis 1000","file":"twist/lessons/de-DE/klasse-3/math/number-puzzles-to-1000.yaml","lessons":[{"n":1,"title":"Rätsel lösen","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Rätsel prüfen und erfinden","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":48,"summary":"Riddles about place value to 1000. Lesson 1 solves riddles with clues about digits and their values; lesson 2 also judges riddles written by other children (is there exactly one answer?) and builds the clues for a given number, and ends with the skill check."}},{"id":"math.add-sub-to-1000.hundreds","domain":"math","topic":"Rechnen bis 1000","can":"Ich kann Hunderterzahlen und Zehnerzahlen im Zahlenraum bis 1000 addieren und subtrahieren (300 + 400, 470 − 50).","standards":["kmk-mathe-2022.zo.6","nc-maths-2014.y3.number-addition-and-subtraction.1","nc-maths-2014.y3.number-addition-and-subtraction.2","nc-maths-2014.y3.number-addition-and-subtraction.3"],"set":{"title":"Hunderter und Zehner bis 1000","file":"twist/lessons/de-DE/klasse-3/math/add-sub-hundreds.yaml","lessons":[{"n":1,"title":"Mit Hundertern rechnen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Nur eine Stelle ändert sich","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Adding and subtracting whole hundreds and whole tens within 1000. Lesson 1 works with hundreds only (300 + 400, 1000 − 700), helped by the small sum (3 + 4 = 7); lesson 2 adds and subtracts hundreds or tens to a three-digit number without crossing (470 − 50, 345 + 200), where only one place changes, and ends with the skill check."}},{"id":"math.add-sub-to-1000.bridging","domain":"math","topic":"Rechnen bis 1000","can":"Ich kann im Kopf über Zehner und Hunderter hinweg addieren und subtrahieren (380 + 50, 605 − 8).","standards":["kmk-mathe-2022.zo.6","kmk-mathe-2022.zo.7","nc-maths-2014.y3.number-addition-and-subtraction.1","nc-maths-2014.y3.number-addition-and-subtraction.2"],"set":{"title":"Über Zehner und Hunderter rechnen","file":"twist/lessons/de-DE/klasse-3/math/bridging-to-1000.yaml","lessons":[{"n":1,"title":"Über den Hunderter","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Über Zehner und Hunderter mit Einern","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":45,"summary":"Mental adding and subtracting that crosses a ten or a hundred, in steps via the full ten or hundred, as in Klasse 2. Lesson 1 adds and subtracts tens across a hundred (380 + 50 = 380 + 20 + 30); lesson 2 adds and subtracts ones across a ten and sometimes a hundred (605 − 8, 396 + 7), and ends with the skill check."}},{"id":"math.add-sub-to-1000.semi-written","domain":"math","topic":"Rechnen bis 1000","can":"Ich kann dreistellige Zahlen halbschriftlich addieren und subtrahieren und meine Zwischenschritte notieren.","standards":["kmk-mathe-2022.zo.7"],"set":{"title":"Halbschriftlich rechnen bis 1000","file":"twist/lessons/de-DE/klasse-3/math/semi-written-to-1000.yaml","lessons":[{"n":1,"title":"Halbschriftlich addieren","acts":["warm-up","learn","practise","check"],"tasks":23},{"n":2,"title":"Halbschriftlich subtrahieren","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":47,"summary":"Adding and subtracting three-digit numbers halbschriftlich, writing each step down, with the ways from Klasse 2. Lesson 1 adds schrittweise (hundreds, then tens, then ones) and stellenweise; lesson 2 subtracts schrittweise and by ergänzen when the numbers are close together, and ends with the skill check."}},{"id":"math.add-sub-to-1000.clever","domain":"math","topic":"Rechnen bis 1000","can":"Ich kann im Zahlenraum bis 1000 vorteilhaft rechnen und für jede Aufgabe einen passenden Weg wählen.","standards":["kmk-mathe-2022.zo.7","kmk-mathe-2022.zo.8"],"set":{"title":"Geschickt rechnen bis 1000","file":"twist/lessons/de-DE/klasse-3/math/clever-to-1000.yaml","lessons":[{"n":1,"title":"Mit Hilfsaufgabe","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Gleichsinnig verändern und den Weg wählen","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Clever ways within 1000 and choosing a way that suits. Lesson 1 uses a Hilfsaufgabe with a full hundred (458 + 199 = 458 + 200 − 1, 734 − 298 = 734 − 300 + 2) and puts the result right; lesson 2 changes both numbers of a minus sum by the same amount (gleichsinniges Verändern: 523 − 197 = 526 − 200), says which way suits which sum, and ends with the skill check."}},{"id":"math.add-sub-to-1000.estimate","domain":"math","topic":"Rechnen bis 1000","can":"Ich kann vor dem Rechnen überschlagen, wie groß das Ergebnis ungefähr ist, und das Ergebnis damit prüfen.","standards":["kmk-mathe-2022.zo.11","kmk-mathe-2022.zo.13","nc-maths-2014.y3.number-addition-and-subtraction.5","nc-maths-2014.y5.number-addition-and-subtraction.3"],"set":{"title":"Überschlagen","file":"twist/lessons/de-DE/klasse-3/math/estimate-to-1000.yaml","lessons":[{"n":1,"title":"Erst überschlagen","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Mit dem Überschlag prüfen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":45,"summary":"A Überschlag with numbers rounded to hundreds shows roughly how big a result is. Lesson 1 makes the Überschlag for plus and minus sums before calculating; lesson 2 checks results with it (does 597 fit 400 + 400?), finds calculations with a big mistake, and ends with the skill check."}},{"id":"math.add-sub-to-1000.vocabulary","domain":"math","topic":"Rechnen bis 1000","can":"Ich kann die Fachbegriffe Summe, Differenz, addieren und subtrahieren richtig verwenden.","standards":["kmk-mathe-2022.pk-werkzeuge.2"],"set":{"title":"Summe und Differenz","file":"twist/lessons/de-DE/klasse-3/math/vocabulary-add-sub.yaml","lessons":[{"n":1,"title":"Summand und Summe","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Minuend, Subtrahend und Differenz","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"The words for plus and minus calculations. Lesson 1 names the parts of a plus sum (Summand, Summe) and works out \"die Summe von\"; lesson 2 names the parts of a minus sum (Minuend, Subtrahend, Differenz), mixes plus and minus words, and ends with the skill check."}},{"id":"math.written-add-sub.add-no-carry","domain":"math","topic":"Schriftlich rechnen","can":"Ich kann Zahlen stellengerecht untereinander schreiben und schriftlich ohne Übertrag addieren.","standards":["kmk-mathe-2022.zo.10","nc-maths-2014.y3.number-addition-and-subtraction.4"],"set":{"title":"Schriftlich addieren ohne Übertrag","file":"twist/lessons/de-DE/klasse-3/math/add-no-carry.yaml","lessons":[{"n":1,"title":"Stellengerecht untereinander","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Verschieden lange Zahlen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Writing numbers under each other by place value and adding them in columns, starting with the Einer. Lesson 1 places the numbers correctly (Einer under Einer) and adds three-digit numbers with no carrying; lesson 2 adds numbers with different numbers of digits, checks with an Überschlag, and ends with the skill check."}},{"id":"math.written-add-sub.add-carry","domain":"math","topic":"Schriftlich rechnen","can":"Ich kann schriftlich mit Übertrag addieren und erklären, was der Übertrag bedeutet.","standards":["kmk-mathe-2022.zo.10","nc-maths-2014.y3.number-addition-and-subtraction.4","nc-maths-2014.y4.number-addition-and-subtraction.1"],"set":{"title":"Schriftlich addieren mit Übertrag","file":"twist/lessons/de-DE/klasse-3/math/add-carry.yaml","lessons":[{"n":1,"title":"Übertrag zu den Zehnern","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zwei Überträge","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"When a column makes ten or more, the ten moves to the next column as a small Übertrag. Lesson 1 carries from the Einer to the Zehner (347 + 238); lesson 2 carries in two columns and explains what the Übertrag means (ten Einer are one Zehner), and ends with the skill check."}},{"id":"math.written-add-sub.add-several","domain":"math","topic":"Schriftlich rechnen","can":"Ich kann mehr als zwei Zahlen schriftlich addieren, auch mit verschieden vielen Stellen.","standards":["kmk-mathe-2022.zo.10"],"set":{"title":"Mehrere Zahlen schriftlich addieren","file":"twist/lessons/de-DE/klasse-3/math/add-several.yaml","lessons":[{"n":1,"title":"Drei Zahlen untereinander","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Kürzere Zahlen und Übertrag 2","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Adding three numbers in columns, also with different numbers of digits, where a column can make 20 or more and carry a 2. Lesson 1 adds three three-digit numbers; lesson 2 mixes lengths (325 + 48 + 106), carries 2, and ends with the skill check."}},{"id":"math.written-add-sub.sub-no-regroup","domain":"math","topic":"Schriftlich rechnen","can":"Ich kann schriftlich subtrahieren, wenn an keiner Stelle entbündelt oder erweitert werden muss.","standards":["kmk-mathe-2022.zo.10","nc-maths-2014.y3.number-addition-and-subtraction.4"],"set":{"title":"Schriftlich subtrahieren ohne Entbündeln","file":"twist/lessons/de-DE/klasse-3/math/sub-no-regroup.yaml","lessons":[{"n":1,"title":"Minus in Spalten","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Kürzere Zahlen und Probe","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Writing the smaller number under the larger one by place value and subtracting in columns from the Einer, where every column has enough to take away. Lesson 1 subtracts three-digit numbers; lesson 2 subtracts shorter numbers and checks with the Umkehraufgabe, and ends with the skill check."}},{"id":"math.written-add-sub.sub-regroup","domain":"math","topic":"Schriftlich rechnen","can":"Ich kann schriftlich mit Übertrag subtrahieren, mit dem Verfahren, das an meiner Schule gilt, und jeden Schritt erklären.","standards":["kmk-mathe-2022.zo.10","nc-maths-2014.y3.number-addition-and-subtraction.4","nc-maths-2014.y4.number-addition-and-subtraction.1"],"set":{"title":"Schriftlich subtrahieren mit Entbündeln","file":"twist/lessons/de-DE/klasse-3/math/sub-regroup.yaml","lessons":[{"n":1,"title":"Einen Zehner entbündeln","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Einen Hunderter entbündeln","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Written subtraction by Abziehen with Entbündeln, the method this curriculum uses: , sorts the words to the right kind of task, and ends with the skill check."}},{"id":"math.mult-div-larger.tens","domain":"math","topic":"Malnehmen und Teilen","can":"Ich kann Aufgaben mit Zehnerzahlen auf das Einmaleins zurückführen (3 · 40 = 120, 240 : 6 = 40).","standards":["kmk-mathe-2022.zo.6","nc-maths-2014.y3.number-multiplication-and-division.2"],"set":{"title":"Malnehmen und Teilen mit Zehnerzahlen","file":"twist/lessons/de-DE/klasse-3/math/mult-div-tens.yaml","lessons":[{"n":1,"title":"Malnehmen mit Zehnerzahlen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Teilen mit Zehnerzahlen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Times-table facts carried over to tens. Lesson 1 multiplies with a Zehnerzahl (3 · 40 = 120, because 3 · 4 Zehner = 12 Zehner); lesson 2 divides a Zehnerzahl (240 : 6 = 40, because 24 Zehner : 6 = 4 Zehner) and checks with the multiplication, and ends with the skill check."}},{"id":"math.mult-div-larger.multiples-divisors","domain":"math","topic":"Malnehmen und Teilen","can":"Ich kann Vielfache und Teiler einer Zahl finden.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y4.number-multiplication-and-division.2","nc-maths-2014.y5.number-multiplication-and-division.1","nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.5"],"set":{"title":"Vielfache und Teiler","file":"twist/lessons/de-DE/klasse-3/math/multiples-divisors.yaml","lessons":[{"n":1,"title":"Vielfache","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Teiler","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 finds Vielfache: the numbers of a times table (Vielfache von 4 are 4, 8, 12 …); lesson 2 finds the Teiler of a number by looking for multiplications that give it, in pairs (12 = 1 · 12 = 2 · 6 = 3 · 4), and ends with the skill check."}},{"id":"math.mult-div-larger.order-of-operations","domain":"math","topic":"Malnehmen und Teilen","can":"Ich kann Aufgaben mit mehreren Rechenzeichen in der richtigen Reihenfolge lösen (Klammer zuerst, Punkt vor Strich).","standards":["kmk-mathe-2022.zo.9","kmk-mathe-2022.msf.3","nc-maths-2014.y5.number-multiplication-and-division.10","nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.6"],"set":{"title":"Punkt vor Strich und Klammern","file":"twist/lessons/de-DE/klasse-3/math/order-of-operations.yaml","lessons":[{"n":1,"title":"Punkt vor Strich","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Klammern zuerst","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Calculations with more than one sign. Lesson 1 does mal and geteilt before plus and minus (3 + 4 · 2 = 11); lesson 2 does the Klammer first ((3 + 4) · 2 = 14), compares the same numbers with and without Klammer, and ends with the skill check."}},{"id":"math.mult-div-larger.distributive","domain":"math","topic":"Malnehmen und Teilen","can":"Ich kann Malaufgaben durch Zerlegen lösen und erklären, warum das funktioniert (6 · 14 = 6 · 10 + 6 · 4).","standards":["kmk-mathe-2022.zo.7","kmk-mathe-2022.zo.9","nc-maths-2014.y4.number-multiplication-and-division.4"],"set":{"title":"Malaufgaben zerlegen","file":"twist/lessons/de-DE/klasse-3/math/distributive.yaml","lessons":[{"n":1,"title":"Zehner und Einer","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Geschickt zerlegen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Splitting one factor to multiply bigger numbers. Lesson 1 splits a two-digit number into Zehner and Einer (6 · 14 = 6 · 10 + 6 · 4) and shows it on a Punktefeld; lesson 2 splits cleverly, also by taking away (7 · 19 = 7 · 20 − 7 · 1), and ends with the skill check."}},{"id":"math.mult-div-larger.semi-written-mult","domain":"math","topic":"Halbschriftlich malnehmen und teilen","can":"Ich kann zwei- und dreistellige Zahlen halbschriftlich mit einer einstelligen Zahl multiplizieren, auch mit dem Malkreuz.","standards":["kmk-mathe-2022.zo.7","nc-maths-2014.y3.number-multiplication-and-division.2"],"set":{"title":"Halbschriftlich malnehmen","file":"twist/lessons/de-DE/klasse-3/math/semi-written-mult.yaml","lessons":[{"n":1,"title":"Zweistellig mal einstellig","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Dreistellig mal einstellig","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Multiplying by a one-digit number with the steps written down. Lesson 1 splits a two-digit number into Zehner and Einer (7 · 46 = 280 + 42) and shows the Malkreuz; lesson 2 does the same with three-digit numbers (3 · 124 = 300 + 60 + 12), and ends with the skill check."}},{"id":"math.mult-div-larger.semi-written-div","domain":"math","topic":"Halbschriftlich malnehmen und teilen","can":"Ich kann zwei- und dreistellige Zahlen halbschriftlich durch eine einstellige Zahl teilen, auch mit Rest (96 : 4 = 80 : 4 + 16 : 4).","standards":["kmk-mathe-2022.zo.7"],"set":{"title":"Halbschriftlich teilen","file":"twist/lessons/de-DE/klasse-3/math/semi-written-div.yaml","lessons":[{"n":1,"title":"Geschickt zerlegen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Dreistellig und mit Rest","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Dividing by a one-digit number with the steps written down. Lesson 1 splits the number into parts that divide easily (96 : 4 = 80 : 4 + 16 : 4) and checks with the Probe; lesson 2 divides three-digit numbers and numbers that leave a Rest (97 : 4 = 24 Rest 1), and ends with the skill check."}},{"id":"math.mult-div-larger.estimate","domain":"math","topic":"Halbschriftlich malnehmen und teilen","can":"Ich kann Ergebnisse beim Malnehmen und Teilen überschlagen und meine Rechnung damit prüfen.","standards":["kmk-mathe-2022.zo.11","kmk-mathe-2022.zo.13"],"set":{"title":"Überschlagen beim Malnehmen und Teilen","file":"twist/lessons/de-DE/klasse-3/math/mult-div-estimate.yaml","lessons":[{"n":1,"title":"Überschlag beim Malnehmen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Überschlag beim Teilen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Rough results to check multiplying and dividing. Lesson 1 rounds the bigger number to a Zehnerzahl or Hunderterzahl (7 · 48 ≈ 7 · 50 = 350) and judges whether a result can be right; lesson 2 picks a number that divides easily for a Überschlag (396 : 4 ≈ 400 : 4 = 100), and ends with the skill check."}},{"id":"math.patterns.functional-tables","domain":"math","topic":"Zusammenhänge","can":"Ich kann Zusammenhänge wie Menge und Preis in Tabellen darstellen und fehlende Werte ergänzen.","standards":["kmk-mathe-2022.msf.4","kmk-mathe-2022.msf.5"],"set":{"title":"Tabellen mit Menge und Preis","file":"twist/lessons/de-DE/klasse-3/math/functional-tables.yaml","lessons":[{"n":1,"title":"Preistabellen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Tabellen ergänzen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads and fills price tables (1 Heft 3 €, 4 Hefte 12 €), works out the price of one from the price of several, and doubles the price when the amount doubles; lesson 2 uses the same tables for eggs in boxes, legs, litres per minute, joins two columns (2 Hefte und 3 Hefte sind 5 Hefte) and ends with the skill check."}},{"id":"math.money.decimal-notation","domain":"math","topic":"Mit Geld rechnen","can":"Ich kann Geldbeträge mit Komma lesen und schreiben (3,50 € = 3 € 50 ct = 350 ct).","standards":["kmk-mathe-2022.gm.7"],"set":{"title":"Geldbeträge mit Komma","file":"twist/lessons/de-DE/klasse-3/math/money-decimal.yaml","lessons":[{"n":1,"title":"Euro vor dem Komma","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Kleine Centbeträge und vergleichen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads and writes amounts with a Komma: before it the Euro, after it always two digits for the Cent (3,50 € = 3 € 50 ct = 350 ct); lesson 2 handles small Cent amounts (0,05 €, 2,08 €), compares and orders amounts, and ends with the skill check."}},{"id":"math.money.calculate","domain":"math","topic":"Mit Geld rechnen","can":"Ich kann mit Geldbeträgen mit Komma addieren, subtrahieren und sie vervielfachen.","standards":["kmk-mathe-2022.gm.10","nc-maths-2014.y3.measurement.3","nc-maths-2014.y4.number-fractions-including-decimals.10","nc-maths-2014.y4.measurement.4"],"set":{"title":"Mit Geldbeträgen rechnen","file":"twist/lessons/de-DE/klasse-3/math/money-calculate.yaml","lessons":[{"n":1,"title":"Beträge zusammenrechnen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Abziehen und vervielfachen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 adds and subtracts amounts with a Komma, Euro to Euro and Cent to Cent, and changes 100 Cent into a Euro (2,60 € + 1,50 € = 4,10 €); lesson 2 subtracts with change and multiplies a price (3 · 1,20 € = 3,60 €), and ends with the skill check."}},{"id":"math.money.word-problems","domain":"math","topic":"Mit Geld rechnen","can":"Ich kann Sachaufgaben mit Geld lösen, auch mit Preisvergleichen und Angeboten (Was ist günstiger?).","standards":["kmk-mathe-2022.gm.10","kmk-mathe-2022.msf.4","nc-maths-2014.y5.measurement.7"],"set":{"title":"Sachaufgaben mit Geld","file":"twist/lessons/de-DE/klasse-3/math/money-word-problems.yaml","lessons":[{"n":1,"title":"Einkaufen in Schritten","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Was ist günstiger?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 solves shopping stories in steps: what is asked, what is given, the calculation and the Antwortsatz (Was kostet der Einkauf, wie viel bleibt übrig?); lesson 2 compares prices and offers (Was ist günstiger: 3 Hefte für 2,70 € oder 1 Heft für 1 €?), and ends with the skill check."}},{"id":"math.time.minutes","domain":"math","topic":"Uhrzeit","can":"Ich kann die Uhrzeit auf die Minute genau ablesen und einstellen und die Zeiten am Nachmittag mit 13 bis 24 Uhr angeben.","standards":["kmk-mathe-2022.gm.6","nc-maths-2014.y3.measurement.4","nc-maths-2014.y3.measurement.5","nc-maths-2014.y4.measurement.5"],"set":{"title":"Minutengenau und 13 bis 24 Uhr","file":"twist/lessons/de-DE/klasse-3/math/time-minutes.yaml","lessons":[{"n":1,"title":"Auf die Minute genau","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"13 bis 24 Uhr","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads the clock to the minute by counting from the last Fünferschritt (on the 4 plus 3 small marks is 23 minutes); lesson 2 gives afternoon and evening times with 13 to 24 Uhr (3 Uhr nachmittags is 15 Uhr), and ends with the skill check."}},{"id":"math.time.durations","domain":"math","topic":"Zeitpunkt und Zeitdauer","can":"Ich kann Zeitpunkte und Zeitspannen unterscheiden und ausrechnen, wie lange etwas dauert oder wann es endet.","standards":["kmk-mathe-2022.gm.1","kmk-mathe-2022.gm.10","nc-maths-2014.y2.measurement.6","nc-maths-2014.y3.measurement.7"],"set":{"title":"Zeitpunkt und Zeitspanne","file":"twist/lessons/de-DE/klasse-3/math/time-durations.yaml","lessons":[{"n":1,"title":"Wie lange dauert es?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wann endet es?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 tells a Zeitpunkt (um 8:15) from a Zeitspanne (45 Minuten) and works out how long something lasts by jumping to the next full hour (8:15 bis 9:00 sind 45 Minuten); lesson 2 works out when something ends or starts from its length, over the full hour too, and ends with the skill check."}},{"id":"math.time.units","domain":"math","topic":"Zeitpunkt und Zeitdauer","can":"Ich kann Zeiteinheiten umrechnen (Sekunde, Minute, Stunde, Tag, Woche, Monat, Jahr) und kenne Zeitspannen aus dem Alltag (eine Schulstunde dauert 45 Minuten).","standards":["kmk-mathe-2022.gm.2","kmk-mathe-2022.gm.3","nc-maths-2014.y3.measurement.5","nc-maths-2014.y3.measurement.6","nc-maths-2014.y4.measurement.1","nc-maths-2014.y4.measurement.6","nc-maths-2014.y5.measurement.6","nc-maths-2014.y6.measurement.2"],"set":{"title":"Zeiteinheiten umrechnen","file":"twist/lessons/de-DE/klasse-3/math/time-units.yaml","lessons":[{"n":1,"title":"Sekunden, Minuten, Stunden","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Woche, Monat, Jahr","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 converts between Sekunden, Minuten, Stunden and Tagen (1 min = 60 s, 1 h = 60 min, 1 Tag = 24 h); lesson 2 adds Wochen, Monate and Jahre, chooses the right unit for everyday things (eine Schulstunde dauert 45 Minuten), and ends with the skill check."}},{"id":"math.time.timetables","domain":"math","topic":"Zeitpunkt und Zeitdauer","can":"Ich kann Fahrpläne und Zeitpläne lesen und damit Sachaufgaben zur Zeit lösen.","standards":["kmk-mathe-2022.gm.10","nc-maths-2014.y5.statistics.2"],"set":{"title":"Fahrpläne und Zeitpläne","file":"twist/lessons/de-DE/klasse-3/math/timetables.yaml","lessons":[{"n":1,"title":"Fahrpläne lesen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zeitpläne","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads a bus or train timetable (Zeile Haltestelle, Spalte Fahrt), works out how long a ride takes and picks the ride that arrives in time; lesson 2 reads schedules for a Sportfest, a Kinderkino and a Ausflug, works out how long each part lasts, also over the full hour (14:30 bis 16:10 sind 1 Stunde 40 Minuten), and ends with the skill check."}},{"id":"math.length.mm-km","domain":"math","topic":"Längen","can":"Ich kann Millimeter und Kilometer verwenden, zwischen mm, cm, m und km umrechnen und Längen sinnvoll schätzen (1 km ist ein Weg von etwa einer Viertelstunde).","standards":["kmk-mathe-2022.gm.2","kmk-mathe-2022.gm.3","nc-maths-2014.y3.measurement.1"],"set":{"title":"Millimeter und Kilometer","file":"twist/lessons/de-DE/klasse-3/math/length-mm-km.yaml","lessons":[{"n":1,"title":"Millimeter","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Kilometer","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads strips on the ruler in cm and mm (4 cm 5 mm = 45 mm), changes between cm and mm and picks mm for very small things; lesson 2 learns 1 km = 1000 m, changes between km and m (1 km 200 m = 1200 m), picks the unit that fits and estimates a walk (1 km dauert etwa eine Viertelstunde), and ends with the skill check. Drawing a line of a given length waits for a drawing task."}},{"id":"math.mass-capacity.compare-mass","domain":"math","topic":"Gewichte","can":"Ich kann Gegenstände nach ihrem Gewicht vergleichen und ordnen (schwerer, leichter, gleich schwer), auch mit der Balkenwaage.","standards":["kmk-mathe-2022.gm.1","nc-maths-2014.y1.measurement.2","nc-maths-2014.y1.measurement.6","nc-maths-2014.y2.measurement.2"],"set":{"title":"Gewichte vergleichen","file":"twist/lessons/de-DE/klasse-3/math/mass-compare.yaml","lessons":[{"n":1,"title":"Schwerer oder leichter?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Nach dem Gewicht ordnen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 compares two things by weight with a Balkenwaage told in words (die schwerere Seite geht nach unten), learns that big is not always heavy and what Gleichgewicht means; lesson 2 orders three things from two comparisons, compares weights in gleiche Würfel and ends with the skill check. A drawn balance waits for a balance component; the scale is described in text for now."}},{"id":"math.mass-capacity.g-kg","domain":"math","topic":"Gewichte","can":"Ich kann Gewichte in Gramm und Kilogramm angeben, an Waagen ablesen und weiß, dass 1 kg = 1000 g sind.","standards":["kmk-mathe-2022.gm.2","kmk-mathe-2022.gm.6","nc-maths-2014.y2.measurement.1","nc-maths-2014.y3.measurement.1"],"set":{"title":"Gramm und Kilogramm","file":"twist/lessons/de-DE/klasse-3/math/mass-g-kg.yaml","lessons":[{"n":1,"title":"1 Kilogramm hat 1000 Gramm","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Waagen ablesen und rechnen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 learns 1 kg = 1000 g, reads a kitchen scale from 0 to 1000 g in steps of 100 g (drawn as a number line with a pointer) and changes between kg and g (2 kg 300 g = 2300 g); lesson 2 reads a finer scale to 500 g (long ticks at the hundreds, a middle tick at 50 g more), fills up to 1 kg (700 g + 300 g), adds and compares weights in mixed units, and ends with the skill check. A round dial scale waits for a scale component."}},{"id":"math.mass-capacity.estimate-mass","domain":"math","topic":"Gewichte","can":"Ich kann Gewichte mit Stützpunktvorstellungen schätzen (1 g, 500 g, 1 kg) und weiß, dass 1 t = 1000 kg sind.","standards":["kmk-mathe-2022.gm.3","kmk-mathe-2022.gm.8"],"set":{"title":"Gewichte schätzen","file":"twist/lessons/de-DE/klasse-3/math/mass-estimate.yaml","lessons":[{"n":1,"title":"Mit Stützpunkten schätzen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Tonne","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 learns benchmarks to compare with (eine Büroklammer etwa 1 g, eine Packung Nudeln 500 g, eine Packung Mehl 1 kg) and estimates fruit, eggs, pets and a school bag with them; lesson 2 learns 1 t = 1000 kg with a small car as the benchmark, picks g, kg or t for a thing, changes between t and kg, and ends with the skill check."}},{"id":"math.fractions.halves-quarters","domain":"math","topic":"Brüche","can":"Ich kann Ganze in Hälften und Viertel teilen und erkennen, ob die Teile gleich groß sind.","standards":["kmk-mathe-2022.gm.4","nc-maths-2014.y1.number-fractions.1","nc-maths-2014.y1.number-fractions.2"],"set":{"title":"Hälften und Viertel","file":"twist/lessons/de-DE/klasse-3/math/halves-quarters.yaml","lessons":[{"n":1,"title":"Die Hälfte","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Viertel","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 splits a whole into two equal parts (die Hälfte), finds half of an amount on a Punktefeld with one row red and one blue, and checks whether two pieces really are halves; lesson 2 splits into four equal parts (ein Viertel), finds a quarter of an amount, learns that two quarters make a half and that a quarter is smaller than a half, and ends with the skill check. Folding or colouring a drawn shape waits for a shape-parts component; pieces of a pizza or a cake are told in words."}},{"id":"math.shapes.lines-segments","domain":"math","topic":"Geometrie","can":"Ich kann Geraden, Strecken und Linien unterscheiden und Strecken genau messen und zeichnen.","standards":["kmk-mathe-2022.rf.8","kmk-mathe-2022.pk-werkzeuge.4"],"set":{"title":"Gerade, Strecke, Linie","file":"twist/lessons/de-DE/klasse-3/math/lines-segments.yaml","lessons":[{"n":1,"title":"Linien, Strecken und Geraden","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Strecken genau messen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 tells a Linie (gerade oder krumm), a Strecke (gerade, mit zwei Endpunkten) and a Gerade (gerade, ohne Ende) apart, in words and in things around us; lesson 2 measures Strecken exactly on the ruler in cm and mm, also when the ruler does not start at 0, compares Strecken in cm and mm and ends with the skill check. Drawing a Strecke of a given
