cstrong>Curriculum, Subject, Year, Topic, Skill, Lesson, Activity, Task\u003c/strong>. Names for teachers and children in each country are in \u003ca href=\"#\">lesson-anatomy.md\u003c/a>. In the records:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Where it lives\u003c/th>\u003cth>Key\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Curriculum\u003c/td>\u003ctd>curricula/&lt;id&gt;.yaml\u003c/td>\u003ctd>\u003ccode>curriculum\u003c/code> (de-DE, en-GB)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Subject\u003c/td>\u003ctd>a domain (\u003ccode>math\u003c/code>, \u003ccode>lit-de\u003c/code>, \u003ccode>lit-en\u003c/code>, \u003ccode>fl\u003c/code>), named per curriculum in \u003ccode>subjects\u003c/code>\u003c/td>\u003ctd>\u003ccode>domain\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Year\u003c/td>\u003ctd>years/&lt;market&gt;.yaml; placement keys in the curriculum\u003c/td>\u003ctd>year ids (klasse-1, year-2, lernjahr-1, ly-1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Topic\u003c/td>\u003ctd>on each skill\u003c/td>\u003ctd>\u003ccode>topic\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Skill\u003c/td>\u003ctd>competencies/&lt;domain&gt;/&lt;progression&gt;.yaml\u003c/td>\u003ctd>\u003ccode>skills\u003c/code>, \u003ccode>id\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Learning progression\u003c/td>\u003ctd>one file in competencies/\u003c/td>\u003ctd>\u003ccode>progression\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Standard\u003c/td>\u003ctd>frameworks/&lt;country&gt;/&lt;id&gt;.yaml; linked from each skill\u003c/td>\u003ctd>\u003ccode>standards\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lesson, Activity, Task\u003c/td>\u003ctd>lessons/ (to come)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"title":"Records","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Record\u003c/th>\u003cth>Folder\u003c/th>\u003cth>One file holds\u003c/th>\u003cth>Key\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Year list\u003c/td>\u003ctd>years/\u003c/td>\u003ctd>the years of one market\u003c/td>\u003ctd>\u003ccode>market\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Framework\u003c/td>\u003ctd>frameworks/&lt;country&gt;/\u003c/td>\u003ctd>one official document and its standards\u003c/td>\u003ctd>\u003ccode>framework\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Progression\u003c/td>\u003ctd>competencies/&lt;domain&gt;/\u003c/td>\u003ctd>one learning progression and its ordered skills\u003c/td>\u003ctd>\u003ccode>progression\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lesson\u003c/td>\u003ctd>lessons/&lt;curriculum&gt;/&lt;year&gt;/&lt;domain&gt;/\u003c/td>\u003ctd>the lessons of one skill\u003c/td>\u003ctd>\u003ccode>id\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Curriculum\u003c/td>\u003ctd>curricula/\u003c/td>\u003ctd>one curriculum and its placements\u003c/td>\u003ctd>\u003ccode>curriculum\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The schemas in ../schema/ are the exact shape. build.mjs validates every record against them.\u003c/p>"},{"title":"Domains","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Domain\u003c/th>\u003cth>What it covers\u003c/th>\u003cth>Used by\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>math\u003c/code>\u003c/td>\u003ctd>number, operations, measures, shape and space, patterns, data and chance\u003c/td>\u003ctd>every market\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lit-de\u003c/code>\u003c/td>\u003ctd>reading and writing German as the home language, from letters and sounds to texts\u003c/td>\u003ctd>Germany; later Austria, Switzerland\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lit-en\u003c/code>\u003c/td>\u003ctd>reading and writing English as the home language, from phonics to texts\u003c/td>\u003ctd>England\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fl\u003c/code>\u003c/td>\u003ctd>an early foreign language: listening, speaking, reading, writing, themes\u003c/td>\u003ctd>Englisch in Germany, French in England\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Speaking and listening in the home language belong to \u003ccode>lit-de\u003c/code> and \u003ccode>lit-en\u003c/code>. \u003ccode>fl\u003c/code> skills are language-neutral can-do statements; each target language gets its own lessons for them.\u003c/p>"},{"title":"Progressions and skills","html":"\u003cp>A progression is an ordered list of skills in one domain, such as \u003ccode>math.place-value\u003c/code> or \u003ccode>lit-de.spelling-strategies\u003c/code>. Order in the file is the teaching order inside the progression, and it binds: each skill has the skill before it as an implicit hard prerequisite, so no curriculum can place them the other way round. A progression whose skills can come in any order (the times tables, mass and capacity) says \u003ccode>order: free\u003c/code>, and then only the explicit prerequisites bind.\u003c/p>\n\u003cp>A skill is one observable can-do statement, small enough to teach in one lesson and check with one or two items. Each skill has:\u003c/p>\n\u003cul>\u003cli>\u003ccode>id\u003c/code>: \u003ccode>&lt;domain&gt;.&lt;progression&gt;.&lt;slug&gt;\u003c/code>, for example \u003ccode>math.place-value.bundle-tens\u003c/code>. No numbers for order, no grade.\u003c/li>\u003cli>\u003ccode>can_do\u003c/code>: an \"Ich kann ...\" and an \"I can ...\" statement. The German statement is the one German children and teachers read; the English one is for the team and for England. For \u003ccode>lit-de\u003c/code> the German is primary; for \u003ccode>lit-en\u003c/code> the English is.\u003c/li>\u003cli>\u003ccode>prerequisites.hard\u003c/code>: skills that must be secure first. Can cross progressions and domains.\u003c/li>\u003cli>\u003ccode>prerequisites.soft\u003c/code>: skills that help but do not block.\u003c/li>\u003cli>\u003ccode>topic\u003c/code>: the child-facing section label, in German and English. Skills that share a label in the same year form one topic in a grade view.\u003c/li>\u003cli>\u003ccode>standards\u003c/code>: the framework standard codes this skill helps satisfy. The link lives here, on the skill, so framework files can be regenerated from their documents without losing it. Coverage is computed both ways.\u003c/li>\u003cli>\u003ccode>scope\u003c/code>: optional limits that make the skill concrete, such as a number range (\u003ccode>range: 20\u003c/code>) or a set of letters.\u003c/li>\u003cli>\u003ccode>enrichment\u003c/code>: true when no framework standard asks for the skill, with \u003ccode>reason\u003c/code>.\u003c/li>\u003cli>\u003ccode>facets\u003c/code>: the locale facets the skill depends on (below), such as \u003ccode>written-subtraction\u003c/code> or \u003ccode>currency\u003c/code>.\u003c/li>\u003cli>\u003ccode>beyond_framework\u003c/code>: a reason, for a skill no framework standard asks for but schools in the market teach (written division in Germany).\u003c/li>\u003cli>\u003ccode>note\u003c/code>: free text; required when a skill has no standard yet and is not enrichment (for example a skill only the English frameworks will ask for).\u003c/li>\u003c/ul>"},{"title":"Years","html":"\u003cp>A year is where a curriculum places a skill. Two kinds:\u003c/p>\n\u003cul>\u003cli>\u003ccode>grade\u003c/code>: a school year (Reception, Year 1 to 6, Klasse 1 to 4).\u003c/li>\u003cli>\u003ccode>learning-year\u003c/code>: a year of learning a foreign language (Stufe 0, Lernjahr 1 and 2; learning years 1 to 4 for French in England). A curriculum says which grades each learning year usually falls in.\u003c/li>\u003c/ul>\n\u003cp>Year ids are fixed: \u003ccode>reception\u003c/code>, \u003ccode>year-1\u003c/code> to \u003ccode>year-6\u003c/code>, \u003ccode>klasse-1\u003c/code> to \u003ccode>klasse-4\u003c/code>, \u003ccode>stufe-0\u003c/code>, \u003ccode>lernjahr-1\u003c/code>, \u003ccode>lernjahr-2\u003c/code>, \u003ccode>ly-1\u003c/code> to \u003ccode>ly-4\u003c/code>.\u003c/p>"},{"title":"Frameworks and standards","html":"\u003cp>A framework is one official document, generated from the captured text by an extractor in the source folder and never edited by hand. Each standard has:\u003c/p>\n\u003cul>\u003cli>\u003ccode>code\u003c/code>: ours, built from the document's own structure, prefixed with the framework id (\u003ccode>kmk-m22.zo.2.3\u003c/code>). Stable.\u003c/li>\u003cli>\u003ccode>text\u003c/code>: the document's wording, verbatim, in its language.\u003c/li>\u003cli>\u003ccode>page\u003c/code>: the page in the captured file.\u003c/li>\u003cli>\u003ccode>band\u003c/code>: the year or years the document attaches it to (\u003ccode>end-klasse-4\u003c/code>, \u003ccode>klasse-1-2\u003c/code>, \u003ccode>year-3\u003c/code>, \u003ccode>ks2\u003c/code>, \u003ccode>elg\u003c/code>).\u003c/li>\u003c/ul>\n\u003cp>Land Lehrpläne (NRW, Bayern, Baden-Württemberg, Berlin/Brandenburg) are kept as reference files in rnd/official-de/frameworks/, outside twist/. They are not part of the de-DE curriculum.\u003c/p>\n\u003cp>The KMK standards describe the end of Klasse 4. They are the competency base; placement in Klasse 1 to 4 follows the usual German order, checked against the NRW Lehrplan's Klasse 2 and Klasse 4 bands.\u003c/p>"},{"title":"Curricula and placement","html":"\u003cp>A curriculum is one market's curriculum: \u003ccode>de-DE\u003c/code> (one curriculum for Germany, on the KMK standards; no Land curricula for now) and \u003ccode>en-GB\u003c/code> (England, on EYFS and the National Curriculum). It lists:\u003c/p>\n\u003cul>\u003cli>\u003ccode>frameworks\u003c/code>: the framework ids that apply.\u003c/li>\u003cli>\u003ccode>years\u003c/code>: the market's year list.\u003c/li>\u003cli>\u003ccode>learning_years\u003c/code>: for \u003ccode>fl\u003c/code>, which grade each learning year usually starts in, and any Land variants.\u003c/li>\u003cli>\u003ccode>placement\u003c/code>: for each year, the skills placed in it, in teaching order. A skill's year is when the curriculum expects it. Skills not placed are not part of the curriculum.\u003c/li>\u003cli>\u003ccode>facets\u003c/code>: the locale facet values for the market (below).\u003c/li>\u003cli>\u003ccode>domains\u003c/code>: the domains the curriculum covers so far; every skill in them that serves one of the curriculum's frameworks must be placed.\u003c/li>\u003cli>\u003ccode>subjects\u003c/code>: the subject name for each domain in this market (\u003ccode>fl: Englisch\u003c/code>); grade views are grouped by it.\u003c/li>\u003cli>\u003ccode>learning_years\u003c/code>: for \u003ccode>fl\u003c/code>, the target language and the grades each learning year usually falls in.\u003c/li>\u003cli>\u003ccode>out_of_scope\u003c/code>: framework standards the app does not teach, each with a reason (classroom-only activities such as scenic play or a library visit).\u003c/li>\u003c/ul>\n\u003cp>The build checks placement against each standard's band (end of a Klasse, end of Reception, end of a Year). A learning year is compared through the last grade it usually falls in, so French year 4 counts as Year 6.\u003c/p>\n\u003cp>Placement says what is expected by when. It never limits what a child may work on: a learner's proficiency, per progression, decides where they actually work.\u003c/p>"},{"title":"Lessons","html":"\u003cp>A skill is taught over 2 to 6 lessons, each one short sitting. All lessons of one skill in one curriculum live in one file, \u003ccode>lessons/&lt;curriculum&gt;/&lt;year&gt;/&lt;domain&gt;/&lt;slug&gt;.yaml\u003c/code>, written in that curriculum's language. The year folder is where curricula/&lt;curriculum&gt;.yaml places the skill; the build refuses a file in any other folder, so moving a skill to another year means moving its file. The record format is in \u003ca href=\"#\">../lessons/README.md\u003c/a>; how lessons are built and the mastery rule are in \u003ca href=\"#\">lesson-anatomy.md\u003c/a>. Pictures, drawn components and sounds come from the asset bank (\u003ca href=\"../assets/\">../assets/\u003c/a>).\u003c/p>"},{"title":"Locale facets","html":"\u003cp>Market differences that do not need a different skill, applied by the app or by the lesson's variants:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Facet\u003c/th>\u003cth>de-DE\u003c/th>\u003cth>en-GB\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>currency\u003c/code>\u003c/td>\u003ctd>euro, cent (€, ct)\u003c/td>\u003ctd>pound, pence (£, p)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>number-format\u003c/code>\u003c/td>\u003ctd>3.847 and 2,5\u003c/td>\u003ctd>3,847 and 2.5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>operation-signs\u003c/code>\u003c/td>\u003ctd>\u003ccode>·\u003c/code> and \u003ccode>:\u003c/code>\u003c/td>\u003ctd>\u003ccode>×\u003c/code> and \u003ccode>÷\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>units\u003c/code>\u003c/td>\u003ctd>metric\u003c/td>\u003ctd>metric, with miles, pints in context where the NC asks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>time-format\u003c/code>\u003c/td>\u003ctd>24-hour in writing, \"Viertel nach\"\u003c/td>\u003ctd>12-hour with am and pm, \"quarter past\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>date-format\u003c/code>\u003c/td>\u003ctd>12.10.2026\u003c/td>\u003ctd>12/10/2026\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>script\u003c/code>\u003c/td>\u003ctd>Druckschrift, then a Land's Schreibschrift\u003c/td>\u003ctd>print, then joined\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>written-subtraction\u003c/code>\u003c/td>\u003ctd>by Land (from C1)\u003c/td>\u003ctd>column method with exchange\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"title":"Ids","html":"\u003cp>Lowercase ASCII, dot between levels, hyphen inside a level. Umlauts and ß written out: ä ae, ö oe, ü ue, ß ss. Once a curriculum is published an id never changes; renaming means a new id and a \u003ccode>replaces\u003c/code> field on it.\u003c/p>"}],"rnd":[{"file":"rnd/AGENTS.md","title":"rnd: research for Twist"},{"file":"rnd/CLAUDE.md","title":"@AGENTS.md"},{"file":"rnd/FINDINGS.md","title":"Findings"},{"file":"rnd/anatomy.md","title":"Lesson anatomy"},{"file":"rnd/calibration.md","title":"Difficulty calibration"},{"file":"rnd/german-insight.md","title":"German: how"},{"file":"rnd/mechanics-benchmark.md","title":"Lesson mechanics benchmark"},{"file":"rnd/media-benchmark.md","title":"Media benchmark"},{"file":"rnd/reference-set.md","title":"Reference set"},{"file":"rnd/taxonomy.md","title":"Taxonomy"},{"file":"rnd/type-gaps.md","title":"Exercise-type gap list"}],"official":[{"dir":"rnd/official-de","parts":["bebb","bw","by","kmk","nrw"]},{"dir":"rnd/official-gb","parts":["dfe","eyfs"]}]};
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const PAGES = [
  ["overview", "Overview"], ["works", "How a lesson works"], ["model", "The data model"], ["curricula", "Curricula"],
  ["types", "Task types"], ["components", "Components"], ["quality", "Quality and reviews"], ["rnd", "R&D"], ["where", "Where things live"],
];
const subj = (c, d) => c.subjects?.[d] ?? d;

function overview() {
  const t = D.totals;
  const chain = [
    ["Curriculum", "everything one country teaches", "de-DE"],
    ["Subject", "a school subject, on a shared domain", "Mathe (math)"],
    ["Year", "Klasse, or Lernjahr for a language", "klasse-1"],
    ["Topic", "a block of skills a child sees", "Zahlen bis 10"],
    ["Skill", "one \"Ich kann\": the learning objective", "math.numbers-to-20.count-to-5"],
    ["Lesson", "one sitting, 8 to 12 minutes", "Lektion 1 von 2"],
    ["Activity", "warm-up, learn, practise, check", "Üben"],
    ["Task", "one thing the child does", "multiple_choice"],
  ];
  return `<h1>How the Twist content works</h1>
  <p class="lead">Twist is a primary curriculum written competency first: each country's curriculum places shared skills into school years, and every skill is taught by a short set of hand-written lessons. This page explains the pieces and how they fit, from the curricula down to a single task. It is built from the records, so it stays in step as lessons are written (built ${D.built}).</p>
  <div class="stats">
    <div class="stat"><b>${t.curricula}</b><span>curricula</span></div>
    <div class="stat"><b>${t.skills}</b><span>skills in the library</span></div>
    <div class="stat"><b>${t.sets}</b><span>lesson sets</span></div>
    <div class="stat"><b>${t.lessons}</b><span>lessons</span></div>
    <div class="stat"><b>${t.tasks.toLocaleString("en")}</b><span>tasks</span></div>
    <div class="stat"><b>${t.types}</b><span>task types</span></div>
    <div class="stat"><b>${t.components}</b><span>drawn components</span></div>
    <div class="stat"><b>${t.pictures}</b><span>pictures in the bank</span></div>
  </div>
  <h2>The chain</h2>
  <p>Every piece of content sits on one chain. Each level has a name for the team, a name teachers use, and sometimes one for children.</p>
  <div class="chain">${chain.map(([n, w, e], i) => `${i ? '<span class="ar">→</span>' : ""}<div class="lv"><b>${n}</b><small>${w}</small><span class="ex">${esc(e)}</span></div>`).join("")}</div>
  <div class="card"><b>A skill and a lesson set.</b> A skill is one learning objective, "Ich kann bis zu 5 Dinge sicher abzählen". It lives once in the shared library (competencies/) and can be placed in any curriculum. A <b>lesson set</b> is the file that teaches one skill in one curriculum: 2 to 6 lessons, ending in the skill check that decides mastery. de-DE has ${D.curricula.find((c) => c.id === "de-DE")?.years.reduce((n, y) => n + y.skills.filter((s) => s.set).length, 0) ?? 0} lesson sets.</div>
  <h2>How the parts connect</h2>
  <div class="tw"><table><thead><tr><th>Part</th><th>What it holds</th><th>Lives in</th></tr></thead><tbody>
  <tr><td>Frameworks</td><td>The official standards, quoted verbatim with a page reference (KMK, National Curriculum, EYFS)</td><td><code>twist/frameworks/</code></td></tr>
  <tr><td>Competency library</td><td>Every skill, its "Ich kann / I can", prerequisites and the standards it meets</td><td><code>twist/competencies/</code></td></tr>
  <tr><td>Curricula</td><td>Which skills each year places, in teaching order, and the market facets (€, decimal comma, script)</td><td><code>twist/curricula/</code></td></tr>
  <tr><td>Lessons</td><td>One lesson set per placed skill, in the folder of its year</td><td><code>twist/lessons/&lt;curriculum&gt;/&lt;year&gt;/&lt;subject&gt;/</code></td></tr>
  <tr><td>Asset bank</td><td>Pictures, drawn components, sounds and narration</td><td><code>twist/assets/</code></td></tr>
  <tr><td>Views</td><td>Generated overviews: the course as authored, coverage, tracking</td><td><code>twist/views/</code></td></tr>
  </tbody></table></div>`;
}

function docPage(title, lead, secs) {
  const tabs = secs.map((s, i) => `<button data-i="${i}" class="${i ? "" : "on"}">${esc(s.title)}</button>`).join("");
  return `<h1>${title}</h1><p class="lead">${lead}</p><div class="tabs doc-tabs">${tabs}</div><div class="doc">${secs.map((s, i) => `<div class="sec" data-i="${i}" ${i ? "hidden" : ""}><h2>${esc(s.title)}</h2>${s.html}</div>`).join("")}</div>`;
}

let CUR = "de-DE", YEAR = null, SUBJ = "", Q = "";
function curricula() {
  const c = D.curricula.find((x) => x.id === CUR) ?? D.curricula[0];
  if (!YEAR || !c.years.find((y) => y.id === YEAR)) YEAR = c.years[0]?.id;
  const year = c.years.find((y) => y.id === YEAR);
  const done = c.years.reduce((n, y) => n + y.skills.filter((s) => s.set).length, 0), all = c.years.reduce((n, y) => n + y.skills.length, 0);
  const domains = [...new Set(year.skills.map((s) => s.domain))];
  const q = Q.toLowerCase();
  const list = (q ? c.years.flatMap((y) => y.skills.map((s) => ({ ...s, y }))) : year.skills.map((s) => ({ ...s, y: year })))
    .filter((s) => !SUBJ || s.domain === SUBJ)
    .filter((s) => !q || [s.can, s.topic, s.id, s.set?.title, s.set?.file].join(" ").toLowerCase().includes(q));
  let html = "", topic = null, yr = null;
  for (const s of list) {
    if (q && s.y.id !== yr) { yr = s.y.id; html += `<h3>${esc(s.y.label)}</h3>`; topic = null; }
    if (s.topic !== topic) { topic = s.topic; html += `<div class="topic">${esc(subj(c, s.domain))} · ${esc(topic)}</div>`; }
    html += `<details class="skill"><summary><span class="can">${esc(s.can)}</span><span class="meta">${s.set ? `<span class="pill">${s.set.lessons.length} lessons · ${s.set.tasks} tasks</span>` : '<span class="pill todo">no lessons yet</span>'}</span></summary>
      <div class="body"><div class="id">${esc(s.id)}</div>${s.set ? `<p><b>${esc(s.set.title)}</b>: ${esc(s.set.summary)}</p><ol>${s.set.lessons.map((l) => `<li>${esc(l.title)} <span class="id">${l.tasks} tasks · ${l.acts.join(", ")}</span></li>`).join("")}</ol><div class="id">${esc(s.set.file)}</div>` : ""}
      ${s.standards.length ? `<p class="id">Standards: ${s.standards.map(esc).join(", ")}</p>` : ""}</div></details>`;
  }
  return `<h1>Curricula</h1>
  <p class="lead">Each curriculum places skills from the shared library into its school years, in teaching order (twist/curricula/). Open a skill to see its lesson set: the lessons in it, what each one does, and the file it lives in.</p>
  <div class="tabs" id="cur-tabs">${D.curricula.map((x) => `<button data-c="${x.id}" class="${x.id === c.id ? "on" : ""}">${esc(x.title)} (${x.id})</button>`).join("")}</div>
  <div class="card">${done} of ${all} placed skills have lessons. Frameworks: ${c.frameworks.map((f) => `<code>${esc(f)}</code>`).join(" ")}. Facets: ${Object.entries(c.facets).map(([k, v]) => `${esc(k)} <code>${esc(v)}</code>`).join(", ")}.</div>
  <input type="search" id="q" placeholder="Search skills, topics, lesson titles, files" value="${esc(Q)}">
  <div class="tabs" id="year-tabs">${c.years.map((y) => `<button data-y="${y.id}" class="${y.id === YEAR && !q ? "on" : ""}">${esc(y.label)} <span class="id">${y.skills.filter((s) => s.set).length}/${y.skills.length}</span></button>`).join("")}</div>
  <div class="tabs" id="subj-tabs"><button data-s="" class="${SUBJ ? "" : "on"}">All subjects</button>${Object.entries(c.subjects).map(([d, n]) => `<button data-s="${d}" class="${SUBJ === d ? "on" : ""}">${esc(n)}</button>`).join("")}</div>
  <div id="skills">${html || "<p>No skills match.</p>"}</div>`;
}

function types() {
  return `<h1>Task types</h1>
  <p class="lead">Every task a child does is one of these types. A lesson may only use a type once it is documented in twist/docs/task-types.md; the build refuses the rest. Counts are tasks in the lessons today.</p>
  <div class="types">${D.typeSecs.map((t) => `<div class="type">${t.shot ? `<img src="${t.shot}" alt="${t.id}" loading="lazy">` : ""}<div class="tb"><h4>${esc(t.id)}</h4><div class="id">de-DE ${t.uses["de-DE"] ?? 0} · en-GB ${t.uses["en-GB"] ?? 0} tasks</div><details><summary>How it works</summary>${t.html}</details></div></div>`).join("")}</div>
  ${D.mocks.length ? `<h2>Still to build</h2><p>Rough screens for types and interactions the lessons will need next.</p><div class="mocks">${D.mocks.map((m) => `<figure><img src="${m.shot}" alt="${m.id}" loading="lazy"><figcaption>${esc(m.id)}</figcaption></figure>`).join("")}</div>` : ""}`;
}

function components() {
  return `<h1>Components</h1>
  <p class="lead">Drawn components are pictures the app draws from data in the task (a ten-frame from <code>filled: 7</code>), so one component serves thousands of tasks with no artwork. Marked <span class="new">NEW</span> are the ones added most recently.</p>
  <div class="tw"><table><thead><tr><th>Component</th><th>What it draws</th><th>Data</th><th>Uses</th></tr></thead><tbody>
  ${[...D.components].sort((a, b) => (b.isNew - a.isNew) || b.uses - a.uses).map((c) => `<tr><td><code>${esc(c.id)}</code>${c.isNew ? '<span class="new">NEW</span>' : ""}</td><td>${esc(c.what)}</td><td class="id">${esc(c.data ?? "")}</td><td>${c.uses}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function quality() {
  const r = D.reviews, open = (r.open ?? []).filter((o) => o.status !== "done"), closed = (r.open ?? []).filter((o) => o.status === "done");
  const checks = D.anatomy.find((s) => s.title === "Tasks");
  return `<h1>Quality and reviews</h1>
  <p class="lead">Lessons are written by hand and checked twice: by the build (lessons-check.mjs refuses broken records and warns on known mistakes) and by review passes that read every task. Each pass is recorded in twist/reviews.yaml.</p>
  <h2>Review passes</h2><div class="tw"><table><thead><tr><th>Date</th><th>Pass</th><th>Sets</th><th>Result</th><th>Commit</th></tr></thead><tbody>
  ${(r.passes ?? []).map((p) => `<tr><td>${esc(p.date)}</td><td><b>${esc(p.name)}</b><div class="id">${esc(p.scope)}</div></td><td>${p.sets ?? ""}</td><td>${esc(p.result)}</td><td><code>${esc(p.commit ?? "")}</code></td></tr>`).join("")}
  </tbody></table></div>
  <h2>Open points</h2><ul class="open">${open.map((o) => `<li>${esc(o.what)}</li>`).join("") || "<li>none</li>"}</ul>
  ${closed.length ? `<h3>Closed</h3><ul class="open">${closed.map((o) => `<li><span class="ok">✓</span> ${esc(o.what)}${o.how ? `: <span class="id">${esc(o.how)}</span>` : ""}</li>`).join("")}</ul>` : ""}`;
}

function rnd() {
  return `<h1>R&amp;D</h1>
  <p class="lead">The research behind the content: what was studied and what it decided. The material itself is kept in <code>rnd/</code>, out of the way of the content.</p>
  <h2>What was studied</h2>
  <div class="card"><b>Official curricula.</b> The KMK Bildungsstandards for Mathe and Deutsch (2022) and the KMK report on foreign languages in primary school, checked against the Lehrpläne of NRW, Bayern, Baden-Württemberg and Berlin-Brandenburg; for England, the National Curriculum and the EYFS framework. The standards are quoted verbatim in twist/frameworks/ and every skill maps to the standards that ask for it.</div>
  <div class="card"><b>How strong learning apps build lessons.</b> Lesson structure, exercise types, difficulty, media and how German is sequenced in a leading app were captured and compared. That work set the lesson anatomy (warm-up, learn, practise in three support stages, check), the mastery rule, the task types and the decision to draw most visuals from data.</div>
  <div class="card"><b>The content itself.</b> Every lesson has been reviewed: correctness, native German, hint order, year fit, and a dedicated native-German reading of every screen (see Quality and reviews).</div>
  <h2>Frameworks</h2><div class="tw"><table><thead><tr><th>Framework</th><th>Country</th><th>Standards</th></tr></thead><tbody>
  ${D.frameworks.map((f) => `<tr><td><code>${esc(f.id)}</code><div class="id">${esc(f.title)}</div></td><td>${esc(f.country)}</td><td>${f.count}</td></tr>`).join("")}</tbody></table></div>
  <h2>Research documents</h2><ul>${D.rnd.map((r) => `<li>${esc(r.title)} <span class="id">${esc(r.file)}</span></li>`).join("")}</ul>
  <p>Official documents as captured: ${D.official.map((o) => `<code>${esc(o.dir)}</code> (${o.parts.map(esc).join(", ")})`).join("; ")}.</p>`;
}

function where() {
  return `<h1>Where things live</h1>
  <p class="lead">The root holds the content and the research, kept apart. To find a lesson, go by curriculum, year and subject: the folders follow the curriculum file.</p>
  <div class="tree">README.md            <i>start here</i>
twist/               <i>the content</i>
  curricula/         <i>de-DE.yaml, en-GB.yaml: which skills each year places</i>
  competencies/      <i>the shared skill library, by domain and progression</i>
  lessons/           <i>one lesson set per skill</i>
    de-DE/klasse-1/math/count-to-5.yaml
    de-DE/lernjahr-1/fl/en-weather.yaml
  assets/            <i>pictures, drawn components, sounds, narration</i>
  docs/              <i>lesson-anatomy.md, model.md, task-types.md</i>
  views/             <i>generated: course-de-DE.md, tracking.md, coverage</i>
  frameworks/        <i>official standards, quoted</i>
  pages/             <i>this site, the lesson player, the task-type page, the team handoff</i>
rnd/                 <i>research: captures, official documents, write-ups</i></div>
  <h2>Build and check</h2>
  <pre><code>node twist/build.mjs                 # check every record, write the views
node twist/pages/site/build.mjs      # this page
node twist/pages/player/build.mjs    # the lesson player</code></pre>
  <p>The course as authored, year by year with every lesson's file: <code>twist/views/course-de-DE.md</code>. Play any lesson in <code>twist/pages/player/index.html</code>.</p>`;
}

const RENDER = {
  overview, curricula, types, components, quality, rnd, where,
  works: () => docPage("How a lesson works", "From twist/docs/lesson-anatomy.md: the chain, how a skill is split into lessons, the four activities, tasks, the authoring checks and how mastery is decided.", D.anatomy),
  model: () => docPage("The data model", "From twist/docs/model.md: the records, ids, domains, progressions, years, frameworks, placement and locale facets.", D.model),
};
let PAGE = (location.hash || "#overview").slice(1);
function render() {
  if (!RENDER[PAGE]) PAGE = "overview";
  $("#nav").innerHTML = `<div class="brand">Twist</div><div class="sub">How the content works</div>` + PAGES.map(([id, n]) => `<a href="#${id}" class="${id === PAGE ? "on" : ""}">${n}</a>`).join("");
  $("#main").innerHTML = `<section class="on">${RENDER[PAGE]()}</section><p class="foot">Generated by twist/pages/site/build.mjs from the records, ${D.built}.</p>`;
  bind();
}
function bind() {
  document.querySelectorAll(".doc-tabs button").forEach((b) => b.onclick = () => {
    document.querySelectorAll(".doc-tabs button").forEach((x) => x.classList.toggle("on", x === b));
    document.querySelectorAll(".doc .sec").forEach((s) => s.hidden = s.dataset.i !== b.dataset.i);
  });
  document.querySelectorAll("#cur-tabs button").forEach((b) => b.onclick = () => { CUR = b.dataset.c; YEAR = null; SUBJ = ""; render(); });
  document.querySelectorAll("#year-tabs button").forEach((b) => b.onclick = () => { YEAR = b.dataset.y; Q = ""; render(); });
  document.querySelectorAll("#subj-tabs button").forEach((b) => b.onclick = () => { SUBJ = b.dataset.s; render(); });
  const q = $("#q"); if (q) { q.oninput = () => { Q = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); }; }
}
window.addEventListener("hashchange", () => { PAGE = location.hash.slice(1); render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
