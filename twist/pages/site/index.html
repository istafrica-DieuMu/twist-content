s und tu es","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Aufgabenwörter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"Reading a short Arbeitsanweisung and doing what it says. The instruction is on screen and the voice only says \"Lies die Aufgabe und mach, was dort steht\", so the child has to read it. Lesson 1: one-step instructions to tap a thing in a colour, tap every word with a letter, count and write the number, put a given letter in a gap (Setze ein H ein: _ose, where R and D also make words), and judge whether a child did a task right. Lesson 2: the usual instruction words (kreuze an, kreise ein, streiche durch, unterstreiche, schreibe ab), two-step instructions with zuerst and dann, sorting by an instruction, and the skill check. Paper actions such as circling are checked as knowing what the word asks for."}},{"id":"lit-de.nouns.plural","domain":"lit-de","topic":"Nomen","can":"Ich kann zu Nomen die Mehrzahl bilden und Einzahl und Mehrzahl unterscheiden (der Baum, die Bäume).","standards":["kmk-deutsch-2022.sp.11","kmk-deutsch-2022.sp.13"],"set":{"title":"Einzahl und Mehrzahl","file":"twist/lessons/de-DE/klasse-1/lit-de/nouns-plural.yaml","lessons":[{"n":1,"title":"Eins oder viele?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Mehrzahl bilden","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children tell Einzahl from Mehrzahl and form the Mehrzahl of common nouns. Lesson 1 hears and sees one thing against many (der Hund, die Hunde), learns that the Begleiter in the Mehrzahl is always die, and that die alone does not make a Mehrzahl (die Katze is one cat). Lesson 2 forms the Mehrzahl with the counting trick (ein Stern, zwei Sterne): endings e, en, n and er, the a that turns into ä (der Apfel, die Äpfel), and words that stay the same (der Löffel, die Löffel); it ends with the skill check."}},{"id":"lit-de.letters.ng-nk-qu-v","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne ng, nk, Qu und V mit ihren Lauten und lese Wörter wie Ring, Bank, Qualle, Vogel.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"ng, nk, Qu und V","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-ng-nk-qu-v.yaml","lessons":[{"n":1,"title":"ng und nk","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Qu und V","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Wörter mit ng, nk, Qu und V","acts":["warm-up","practise","check"],"tasks":22}],"tasks":64,"summary":"The letter group after St, Sp and Pf. Lesson 1: ng is one sound made at the back of the mouth, with no g to hear (Schlange, Junge, Ring), and nk is that sound with a k after it (Anker, Bank); the child hears which one it is and keeps ng apart from a plain n. Lesson 2: Qu always comes as Q and u together and sounds kw (Qualle, Quadrat); V mostly sounds f (Vogel, Vater) and sometimes w (Pullover), so V words are learnt as Merkwörter. Lesson 3 reads and sorts words with all four and ends with the skill check."}},{"id":"lit-de.letters.c-y-x-aeu-ck-ss","domain":"lit-de","topic":"Buchstaben","can":"Ich kenne die seltenen Buchstaben C, Y und X sowie äu, ck und ß und lese Wörter damit.","standards":["kmk-deutsch-2022.les.2","kmk-deutsch-2022.sch.1"],"set":{"title":"C, Y, X, äu, ck und ß","file":"twist/lessons/de-DE/klasse-1/lit-de/letters-c-y-x-aeu-ck-ss.yaml","lessons":[{"n":1,"title":"ck und ß","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"äu, C, Y und X","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Wörter mit seltenen Buchstaben","acts":["warm-up","practise","check"],"tasks":22}],"tasks":64,"summary":"The last letter group of Klasse 1: rare letters and spellings the child meets in reading. Lesson 1: ck is read as k and comes after a short vowel (Socke, Glocke); ß is read as s and is not a B (Fuß, groß). Lesson 2: äu sounds like eu and comes from au (Maus, Mäuse; Baum, Bäume); C is often read as k (Clown), Y at the end of a word as i (Baby, Pony), X as ks (Hexe, Taxi). Lesson 3 reads words with all six and ends with the skill check. Choosing between k and ck by rule is left to the later spelling skill; here ck is offered against k and kk in short familiar words."}},{"id":"lit-de.letters.alphabet","domain":"lit-de","topic":"Das ABC","can":"Ich kann das ABC aufsagen, die Buchstaben in die richtige Reihenfolge bringen und Wörter nach dem ersten Buchstaben ordnen.","standards":["kmk-deutsch-2022.sch.10","kmk-deutsch-2022.sp.20"],"set":{"title":"Das ABC","file":"twist/lessons/de-DE/klasse-1/lit-de/alphabet.yaml","lessons":[{"n":1,"title":"Von A bis Z","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Wörter nach dem ABC ordnen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"The ABC as a fixed order, once all letters are known. Lesson 1: the 26 letters in order, which letter comes before or after another, a gap in a run of letters; the child says the ABC aloud in parts (speak tasks, practice only). Lesson 2 orders words by their first letter, with word cards and with pictures whose words the child hears, finds the word that fits between two others, and ends with the skill check. Ordering by the second and third letter is the next skill (alphabet-order)."}},{"id":"lit-de.decoding.first-texts","domain":"lit-de","topic":"Erste Texte lesen","can":"Ich kann einen kurzen Text aus wenigen Sätzen lesen und Fragen dazu beantworten.","standards":["kmk-deutsch-2022.les.4","kmk-deutsch-2022.les.8"],"set":{"title":"Erste Texte lesen","file":"twist/lessons/de-DE/klasse-1/lit-de/first-texts.yaml","lessons":[{"n":1,"title":"Die Antwort steht im Text","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Genau nachlesen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading a short text of three to four sentences and answering questions about it. Lesson 1: the answer stands in one sentence; the question word (wer, was, wo, wie viele) says what to look for, and the child goes back to the text to find it. Lesson 2: reading more carefully, where a text names more than one thing of a kind (gern and heute, Papa and Ida) and where a statement has to be checked word by word against the text; it ends with the skill check on a new text. All texts are written for Twist; the voice asks the question but never reads the text."}},{"id":"lit-de.comprehension.order-story","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann die Teile einer kurzen Geschichte in die richtige Reihenfolge bringen.","standards":["kmk-deutsch-2022.tm.14"],"set":{"title":"Geschichten ordnen","file":"twist/lessons/de-DE/klasse-1/lit-de/order-story.yaml","lessons":[{"n":1,"title":"Was passiert zuerst?","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Sätze ordnen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":43,"summary":"Putting the parts of a short story in order. Lesson 1 reads a story of three short sentences and lays its pictures in order, finds what happens first and what is missing in the middle, and learns the order words zuerst, dann and zum Schluss; lesson 2 orders sentence cards with and without order words, uses cause and effect (first the cup falls over, then the table is wet), tells the beginning from the end, and ends with the skill check. All stories are written for Twist."}},{"id":"lit-de.comprehension.headings","domain":"lit-de","topic":"Texte verstehen","can":"Ich kann zu einem kurzen Text die passende Überschrift finden.","standards":["kmk-deutsch-2022.les.7","kmk-deutsch-2022.tm.12"],"set":{"title":"Die passende Überschrift","file":"twist/lessons/de-DE/klasse-1/lit-de/headings.yaml","lessons":[{"n":1,"title":"Was passt darüber?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Überschrift und Text","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Finding the heading that fits a short text. Lesson 1 learns that a Überschrift says in a few words what the whole text is about, and picks it from three: the right one, one that names only a detail, and one about something else; lesson 2 goes the other way, finds the text for a heading, matches headings to short texts, says whether a heading fits, and ends with the skill check. All texts are written for Twist."}},{"id":"lit-de.spelling.capital-nouns","domain":"lit-de","topic":"Groß- und Kleinschreibung","can":"Ich schreibe Nomen und Satzanfänge groß.","standards":["kmk-deutsch-2022.sch.7"],"set":{"title":"Groß oder klein?","file":"twist/lessons/de-DE/klasse-1/lit-de/capital-nouns.yaml","lessons":[{"n":1,"title":"Nomen im Satz schreibt man groß","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Der Satzanfang ist groß","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children write Nomen and the first word of a sentence with a capital letter. Lesson 1 finds the Nomen inside sentences with the Begleiter test (can der, die or das go in front?) and picks the capital or small first letter for a word in a sentence. Lesson 2 adds the start of a sentence: the first word is always written big, also after a Punkt, even when it is not a Nomen; it finds every word that needs a capital in a sentence written all small, and ends with the skill check."}},{"id":"lit-de.spelling.dictation-short","domain":"lit-de","topic":"Erste Sätze schreiben","can":"Ich kann kurze geübte Sätze nach Diktat schreiben.","standards":["kmk-deutsch-2022.sch.1","kmk-deutsch-2022.sch.5"],"set":{"title":"Kurze Sätze nach Diktat","file":"twist/lessons/de-DE/klasse-1/lit-de/dictation-short.yaml","lessons":[{"n":1,"title":"Hören, sprechen, schreiben","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Längere Sätze nach Diktat","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children write short practised sentences they hear, with the steps of a class Diktat: listen to the whole sentence, say it again, write it word by word while speaking along, then check it (Anfang groß, Nomen groß, Lücken, Punkt). Lesson 1 takes three-word sentences (Oma ist da.); lesson 2 takes longer ones with a Nomen inside (Der Hund ist im Haus.) and ends with the skill check. The app cannot yet read free writing, so the child builds the heard sentence from word cards, fills its gaps, picks its spelling and finds the mistake in a written copy."}},{"id":"lit-de.speaking.listen-follow","domain":"lit-de","topic":"Sprechen und Zuhören","can":"Ich kann genau zuhören und mündliche Anweisungen mit mehreren Schritten ausführen.","standards":["kmk-deutsch-2022.sz.10","kmk-deutsch-2022.sz.11"],"set":{"title":"Zuhören und Anweisungen folgen","file":"twist/lessons/de-DE/klasse-1/lit-de/listen-follow.yaml","lessons":[{"n":1,"title":"Hör genau hin","acts":["learn","practise","check"],"tasks":20},{"n":2,"title":"Schritt für Schritt","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":44,"summary":"Listening to a spoken instruction to the end and doing exactly what it says. Lesson 1 listens for the two details that matter (the red ball, not the red crayon) and for two steps in a row; lesson 2 follows three steps with zuerst, dann and zum Schluss, counts the steps, asks again when something was not understood, and ends with the skill check. Every instruction is spoken; the child answers with action pictures, objects or short spoken sentences. Asking again aloud is practised with speak tasks and not marked."}},{"id":"lit-de.speaking.tell","domain":"lit-de","topic":"Erzählen","can":"Ich kann ein Erlebnis oder eine Geschichte verständlich und in der richtigen Reihenfolge erzählen.","standards":["kmk-deutsch-2022.sz.3","kmk-deutsch-2022.sz.5","kmk-deutsch-2022.sz.1"],"set":{"title":"Von Erlebnissen erzählen","file":"twist/lessons/de-DE/klasse-1/lit-de/tell-experiences.yaml","lessons":[{"n":1,"title":"Der Reihe nach","acts":["learn","practise","check"],"tasks":20},{"n":2,"title":"So verstehen dich alle","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":44,"summary":"Telling about something you did so that others can follow. The app cannot mark a child's own telling, so the lessons teach and check what is behind it. Lesson 1 tells in the right order with zuerst, dann, danach and am Ende, puts pictures and sentences of a told experience in order and picks what comes next; lesson 2 starts with who, where and when, finds what a listener still needs, spots the sentence that does not belong, picks a good ending, sorts what helps when telling, and ends with the skill check. Speak tasks let the child tell a sentence aloud and compare it with the model; they are practice only. Every experience told here is written for Twist."}},{"id":"lit-de.speaking.feelings","domain":"lit-de","topic":"Sprechen und Zuhören","can":"Ich kann Gefühle benennen und sagen, wie es mir oder einer Figur geht.","standards":["kmk-deutsch-2022.sz.2","kmk-deutsch-2022.sz.3"],"set":{"title":"Gefühle benennen","file":"twist/lessons/de-DE/klasse-1/lit-de/feelings.yaml","lessons":[{"n":1,"title":"Wie fühlt sich das Kind?","acts":["learn","practise","check"],"tasks":20},{"n":2,"title":"Sag, wie es dir geht","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":44,"summary":"Naming five feelings (fröhlich, traurig, wütend, ängstlich, müde) and saying how you or someone in a story feels. Lesson 1 learns the words with faces, matches face and word, and finds the feeling that fits a short scene; lesson 2 says it in a sentence with ich bin and weil, uses a more exact word than schlecht, says anger in words instead of hitting, follows a feeling that changes in a story, and ends with the skill check. Speak tasks let the child say how someone feels and compare with the model; they are practice only."}},{"id":"lit-de.speaking.rhymes-tongue-twisters","domain":"lit-de","topic":"Sprechen und Zuhören","can":"Ich kann Reime, Abzählverse und Zungenbrecher deutlich nachsprechen.","standards":["kmk-deutsch-2022.sz.6","kmk-deutsch-2022.sp.19"],"set":{"title":"Reime, Abzählverse und Zungenbrecher","file":"twist/lessons/de-DE/klasse-1/lit-de/tongue-twisters.yaml","lessons":[{"n":1,"title":"Abzählverse und Reime","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Zungenbrecher","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Saying rhymes, Abzählverse and Zungenbrecher clearly. The app cannot mark how clearly a child speaks, so the lessons teach and check what is behind it. Lesson 1 learns what an Abzählvers is for, uses the rhyme words to remember the next line, puts lines in order and says them in time; lesson 2 hears the sound a Zungenbrecher repeats, finds the word that keeps it going, learns to practise slowly first and clearly before fast, tells Zungenbrecher from Abzählvers, and ends with the skill check. Speak tasks let the child say lines aloud and compare with the model; they are practice only. Every verse and tongue twister is written for Twist."}},{"id":"lit-de.texts-media.listen-stories","domain":"lit-de","topic":"Geschichten und Gedichte","can":"Ich kann einer vorgelesenen Geschichte zuhören und sagen, wer darin vorkommt und was passiert.","standards":["kmk-deutsch-2022.sz.10","kmk-deutsch-2022.tm.5","kmk-deutsch-2022.tm.14"],"set":{"title":"Geschichten und Gedichte hören","file":"twist/lessons/de-DE/klasse-1/lit-de/listen-stories.yaml","lessons":[{"n":1,"title":"Wer kommt vor?","acts":["learn","practise","check"],"tasks":19},{"n":2,"title":"Was passiert?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":41,"summary":"Listening to a story or a poem read aloud and saying who is in it and what happens. The voice reads every story; the child never has to read it. Lesson 1 learns what a good listener does and finds who is in a story and where it happens; lesson 2 listens for what happens, in what order and how it ends, hears short poems, and ends with the skill check. Retelling aloud is practised with speak tasks and not marked. All stories and poems are written for Twist."}},{"id":"lit-de.texts-media.pictograms","domain":"lit-de","topic":"Bildzeichen und Diagramme","can":"Ich kann Bildzeichen und Symbole aus meinem Alltag lesen und verstehen.","standards":["kmk-deutsch-2022.tm.22","kmk-deutsch-2022.les.9"],"set":{"title":"Bildzeichen verstehen","file":"twist/lessons/de-DE/klasse-1/lit-de/pictograms.yaml","lessons":[{"n":1,"title":"Bildzeichen im Heft","acts":["learn","practise","check"],"tasks":19},{"n":2,"title":"Bildzeichen draußen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":41,"summary":"Reading the picture signs of everyday life. Lesson 1 reads the Bildzeichen that tell a child in a workbook what to do (pencil: write, scissors: cut out, ear: listen, eye: look closely, mouth: say it, crayon: colour in, open book: read) and learns that a sign means an action, not just the thing on it; lesson 2 reads signs outside: the traffic light (one picture with the red man lit, one with the green man lit), the signs for the bus stop, cycle path, toilet, emergency exit and a café, and a red line across a picture that means \"not allowed\", and ends with the skill check."}},{"id":"lit-de.texts-media.tables-charts","domain":"lit-de","topic":"Bildzeichen und Diagramme","can":"Ich kann einfachen Tabellen, Diagrammen und Plänen Informationen entnehmen.","standards":["kmk-deutsch-2022.tm.22"],"set":{"title":"Tabellen und Diagramme lesen","file":"twist/lessons/de-DE/klasse-1/lit-de/simple-tables.yaml","lessons":[{"n":1,"title":"Tabellen und Pläne","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Diagramme lesen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Taking information from simple tables, plans and charts. Lesson 1 reads short tables from school life (the Klassendienste, a Stundenplan, a Sitzplan, drawn as tables): find the right row or column, then read along it to the cell you need; lesson 2 reads Säulendiagramme about the class (favourite animals, the weather of a week), finds the most and the fewest, checks statements, and ends with the skill check. All tables and charts are written for Twist."}},{"id":"lit-de.vocabulary.language-play","domain":"lit-de","topic":"Sprache untersuchen","can":"Ich kann mit Sprache spielen, zum Beispiel mit Zungenbrechern, Wortspielen, Unsinnswörtern und Sprachspielereien.","standards":["kmk-deutsch-2022.sp.14"],"set":{"title":"Mit Sprache spielen","file":"twist/lessons/de-DE/klasse-1/lit-de/language-play.yaml","lessons":[{"n":1,"title":"Quatschwörter und Quatschsätze","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Silben tauschen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Playing with words and sounds. Lesson 1 tells real words from Quatschwörter, finds the Quatschsatz, swaps the first sound of a word to make a new one (Maus, Haus) and makes up Quatschreime; lesson 2 swaps the syllables of a word (Hase, Seha), turns a Quatschwort back into the real word, swaps the parts of a compound and sees the meaning change (Baumhaus, Hausbaum), and ends with the skill check. Speak tasks let the child say a Quatschsatz or a swapped word aloud; they are practice only. Every Quatschwort and Quatschsatz is made up for Twist."}},{"id":"lit-de.writing.words-to-pictures","domain":"lit-de","topic":"Texte schreiben","can":"Ich kann zu Bildern Wörter und kurze Sätze schreiben.","standards":["kmk-deutsch-2022.sch.18","kmk-deutsch-2022.sch.21"],"set":{"title":"Zu Bildern schreiben","file":"twist/lessons/de-DE/klasse-1/lit-de/words-to-pictures.yaml","lessons":[{"n":1,"title":"Ein Wort zum Bild","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Ein Satz zum Bild","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children write words and short sentences about pictures. Lesson 1 names what a picture shows with a word and its Begleiter (die Nase, der Igel): build the word from letter cards, pick its spelling, add the Begleiter. Lesson 2 writes a sentence about a picture with two questions, Wer? and Was tut er?, picks the sentence that fits, builds it from word cards, sees what a half sentence is missing, and ends with the skill check. Free writing is not marked yet, so speak tasks let the child say a sentence of their own as practice."}},{"id":"lit-de.vocabulary.categories","domain":"lit-de","topic":"Wortschatz","can":"Ich kann Wörter nach Oberbegriffen ordnen (Obst, Tiere, Möbel) und zu einem Oberbegriff passende Wörter finden.","standards":["kmk-deutsch-2022.sp.10","kmk-deutsch-2022.sz.2"],"set":{"title":"Oberbegriffe","file":"twist/lessons/de-DE/klasse-1/lit-de/word-categories.yaml","lessons":[{"n":1,"title":"Was gehört zusammen?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Oberbegriffe finden","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Children sort words under an Oberbegriff and find words that belong to one. Lesson 1 works with pictures: sort them into Tiere, Obst and Kleidung, find the one that does not belong, and learn that a Möhre is Gemüse, not Obst. Lesson 2 works with written words: name the Oberbegriff for a group (Tisch, Stuhl, Bett: Möbel), find every word of one group in a list (Fahrzeuge, Schulsachen, Spielzeug), keep apart things that go together from things of the same kind (Schuh and Fuß), and ends with the skill check."}}]},{"id":"klasse-2","label":"Klasse 2","skills":[{"id":"math.numbers-to-100.bundle-tens","domain":"math","topic":"Zahlen bis 100","can":"Ich kann Dinge zu Zehnern bündeln, Zehner und Einer zählen und große Anzahlen so schätzen und prüfen.","standards":["kmk-mathe-2022.zo.1","nc-maths-2014.y2.number-number-and-place-value.3"],"set":{"title":"Zehner bündeln","file":"twist/lessons/de-DE/klasse-2/math/bundle-tens.yaml","lessons":[{"n":1,"title":"Zehner und Einer","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Schätzen und prüfen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"The start of the Hunderterraum. Children bundle things into tens and count tens and ones (3 Zehner und 4 Einer sind 34), then use bundles to estimate a large amount and check the estimate. Lesson 1 bundles and counts; lesson 2 estimates and checks, and ends with the skill check."}},{"id":"math.numbers-to-100.place-value","domain":"math","topic":"Zahlen bis 100","can":"Ich kann zweistellige Zahlen in die Stellentafel (Z, E) eintragen und mit Zehnerstangen und Einerwürfeln darstellen.","standards":["kmk-mathe-2022.zo.1","kmk-mathe-2022.zo.2","nc-maths-2014.y2.number-number-and-place-value.2"],"set":{"title":"Die Stellentafel","file":"twist/lessons/de-DE/klasse-2/math/place-value-to-100.yaml","lessons":[{"n":1,"title":"Zehner links, Einer rechts","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Null und zu viele Einer","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Two-digit numbers in the Stellentafel (Z, E) and with Zehnerstangen and Einerwürfel. Lesson 1 moves between blocks and the chart; lesson 2 adds zero in a column, more than nine ones (12 Einer are 1 Zehner und 2 Einer) and ends with the skill check."}},{"id":"math.numbers-to-100.read-write","domain":"math","topic":"Zahlen bis 100","can":"Ich kann Zahlen bis 100 lesen und schreiben, auch als Zahlwort, und verwechsle dabei Zehner und Einer nicht (vierundzwanzig ist 24, nicht 42).","standards":["kmk-mathe-2022.zo.2","nc-maths-2014.y1.number-number-and-place-value.2","nc-maths-2014.y2.number-number-and-place-value.5"],"set":{"title":"Zahlen lesen und schreiben","file":"twist/lessons/de-DE/klasse-2/math/read-write-to-100.yaml","lessons":[{"n":1,"title":"Hören und schreiben","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Zahlwörter lesen","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"The German number word says the ones first (vierundzwanzig), the digits write the tens first (24). Lesson 1 hears numbers and writes them, tens first; lesson 2 reads number words and digits and finds the swapped number, and ends with the skill check."}},{"id":"math.numbers-to-100.hundred-field","domain":"math","topic":"Zahlen bis 100","can":"Ich kann Zahlen am Hunderterfeld darstellen und Anzahlen dort schnell ablesen.","standards":["kmk-mathe-2022.msf.1"],"set":{"title":"Das Hunderterfeld","file":"twist/lessons/de-DE/klasse-2/math/hundred-field.yaml","lessons":[{"n":1,"title":"Reihen lesen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Auf einen Blick","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"The Hunderterfeld is ten rows of ten dots with gaps after five each way, so amounts can be read without counting each dot. Lesson 1 reads full rows and the rest of a row using the five-gap; lesson 2 reads amounts at a glance, finds how many are missing to 100, and ends with the skill check."}},{"id":"math.numbers-to-100.hundred-square","domain":"math","topic":"Zahlen bis 100","can":"Ich kann mich auf der Hundertertafel orientieren, Muster darin erkennen und Wege beschreiben (eine Zeile weiter ist zehn mehr).","standards":["kmk-mathe-2022.zo.3","kmk-mathe-2022.msf.1"],"set":{"title":"Die Hundertertafel","file":"twist/lessons/de-DE/klasse-2/math/hundred-square.yaml","lessons":[{"n":1,"title":"Nachbarn auf der Tafel","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Wege und Muster","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Finding the way on the Hundertertafel: one step right is one more, one row down is ten more. Lesson 1 finds hidden numbers next to and under a number; lesson 2 follows moves and spots column patterns (every number in a column ends with the same digit), and ends with the skill check."}},{"id":"math.numbers-to-100.number-line","domain":"math","topic":"Zahlen bis 100","can":"Ich kann Zahlen bis 100 am Zahlenstrahl ablesen und eintragen, auch wenn nur die Zehner markiert sind.","standards":["kmk-mathe-2022.zo.2","kmk-mathe-2022.zo.3","nc-maths-2014.y1.number-number-and-place-value.4","nc-maths-2014.y2.number-number-and-place-value.3"],"set":{"title":"Der Zahlenstrahl bis 100","file":"twist/lessons/de-DE/klasse-2/math/number-line-to-100.yaml","lessons":[{"n":1,"title":"Zehner und Striche","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Wohin zeigt der Pfeil?","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Reading and marking numbers on the Zahlenstrahl when only the tens are labelled. Lesson 1 finds tens on the whole line and numbers on a part of it; lesson 2 reads what an arrow points at, uses the five in the middle of each ten, and ends with the skill check."}},{"id":"math.numbers-to-100.order-compare","domain":"math","topic":"Zahlen bis 100","can":"Ich kann Zahlen bis 100 ordnen und vergleichen und Nachbarzahlen und Nachbarzehner bestimmen.","standards":["kmk-mathe-2022.zo.3","nc-maths-2014.y2.number-number-and-place-value.4"],"set":{"title":"Ordnen und vergleichen bis 100","file":"twist/lessons/de-DE/klasse-2/math/order-compare-to-100.yaml","lessons":[{"n":1,"title":"Zehner zuerst vergleichen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Nachbarzahlen und Nachbarzehner","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Comparing two-digit numbers by looking at the tens first, then the ones. Lesson 1 compares and orders numbers with \u003c, > and =; lesson 2 finds Nachbarzahlen and Nachbarzehner (the tens before and after a number), and ends with the skill check."}},{"id":"math.numbers-to-100.sequences","domain":"math","topic":"Zahlen bis 100","can":"Ich kann bis 100 in Schritten vorwärts und rückwärts zählen, von jeder Startzahl aus, und die Regel einer Zahlenfolge finden.","standards":["kmk-mathe-2022.msf.2","nc-maths-2014.y1.number-number-and-place-value.1","nc-maths-2014.y1.number-number-and-place-value.2","nc-maths-2014.y2.number-number-and-place-value.1"],"set":{"title":"Zahlenfolgen bis 100","file":"twist/lessons/de-DE/klasse-2/math/sequences-to-100.yaml","lessons":[{"n":1,"title":"In Schritten zählen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Die Regel finden","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Counting in steps of 2, 5 and 10 from any start, forwards and backwards, and finding the rule of a sequence. Lesson 1 continues sequences with a given step; lesson 2 finds the rule and the missing number, and ends with the skill check."}},{"id":"math.numbers-to-100.double-halve","domain":"math","topic":"Zahlen bis 100","can":"Ich kann Zahlen bis 50 verdoppeln und gerade Zahlen bis 100 halbieren.","standards":["kmk-mathe-2022.zo.5"],"set":{"title":"Verdoppeln und halbieren bis 100","file":"twist/lessons/de-DE/klasse-2/math/double-halve-to-100.yaml","lessons":[{"n":1,"title":"Verdoppeln","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Halbieren","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Doubling numbers to 50 and halving even numbers to 100 by splitting into tens and ones: double 34 is double 30 and double 4. Lesson 1 doubles; lesson 2 halves, including halving an odd number of tens (half of 50 is 25), and ends with the skill check."}},{"id":"math.numbers-to-100.number-puzzles","domain":"math","topic":"Zahlen bis 100","can":"Ich kann Zahlenrätsel bis 100 lösen, bei denen ich mehrere Hinweise zu Stellenwerten und Nachbarzahlen kombiniere.","standards":["kmk-mathe-2022.pk-probleme.2","nc-maths-2014.y2.number-number-and-place-value.6"],"set":{"title":"Zahlenrätsel bis 100","file":"twist/lessons/de-DE/klasse-2/math/number-puzzles-to-100.yaml","lessons":[{"n":1,"title":"Zwei Hinweise","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Drei Hinweise","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Riddles that combine clues about tens, ones and neighbours. Lesson 1 solves riddles with two clues, one clue at a time; lesson 2 uses three clues and checks the answer against every clue, and ends with the skill check."}},{"id":"math.add-sub-to-100.ones-no-bridge","domain":"math","topic":"Rechnen bis 100","can":"Ich kann Einer zu zweistelligen Zahlen addieren und davon subtrahieren, ohne den Zehner zu überschreiten (34 + 5, 47 − 3).","standards":["kmk-mathe-2022.zo.6","nc-maths-2014.y2.number-addition-and-subtraction.4"],"set":{"title":"Einer dazu und weg","file":"twist/lessons/de-DE/klasse-2/math/ones-no-bridge.yaml","lessons":[{"n":1,"title":"Einer dazu","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Einer weg, Einer dazu","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Adding and taking away ones without crossing a ten (34 + 5, 47 − 3). Only the ones change; the tens stay. Lesson 1 adds ones with base-ten blocks and the small sum that helps (4 + 5 helps with 34 + 5); lesson 2 takes ones away, mixes plus and minus, and ends with the skill check."}},{"id":"math.add-sub-to-100.tens-to-two-digit","domain":"math","topic":"Rechnen bis 100","can":"Ich kann ganze Zehner zu zweistelligen Zahlen addieren und davon subtrahieren (34 + 20, 76 − 40).","standards":["kmk-mathe-2022.zo.6","nc-maths-2014.y2.number-addition-and-subtraction.5"],"set":{"title":"Zehner dazu und weg","file":"twist/lessons/de-DE/klasse-2/math/tens-to-two-digit.yaml","lessons":[{"n":1,"title":"Zehner dazu","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Zehner weg, Zehner dazu","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Adding and taking away whole tens (34 + 20, 76 − 40). Only the tens change; the ones stay. Lesson 1 adds tens with base-ten blocks and on the Hundertertafel, where each ten is one row down; lesson 2 takes tens away, mixes tens and ones, and ends with the skill check."}},{"id":"math.add-sub-to-100.ones-bridge","domain":"math","topic":"Rechnen bis 100","can":"Ich kann Einer mit Zehnerübergang addieren und subtrahieren, schrittweise über den vollen Zehner (38 + 5, 43 − 6).","standards":["kmk-mathe-2022.zo.7","nc-maths-2014.y2.number-addition-and-subtraction.4"],"set":{"title":"Einer mit Zehnerübergang","file":"twist/lessons/de-DE/klasse-2/math/ones-bridge.yaml","lessons":[{"n":1,"title":"Über den Zehner dazu","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Über den Zehner zurück","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"Adding and taking away ones across a ten, in steps via the full ten (38 + 5 = 38 + 2 + 3, 43 − 6 = 43 − 3 − 3). Lesson 1 adds: split the ones, jump to the next ten, then jump on, on the Rechenstrich. Lesson 2 takes away back to the full ten and on, and ends with the skill check."}},{"id":"math.add-sub-to-100.complement","domain":"math","topic":"Rechnen bis 100","can":"Ich kann zum nächsten Zehner und auf 100 ergänzen (37 + _ = 40, 64 + _ = 100).","standards":["kmk-mathe-2022.zo.5"],"set":{"title":"Ergänzen bis zum Zehner und bis 100","file":"twist/lessons/de-DE/klasse-2/math/complement.yaml","lessons":[{"n":1,"title":"Bis zum nächsten Zehner","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Bis 100","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Finding what to add to reach the next ten and to reach 100 (37 + _ = 40, 64 + _ = 100). Lesson 1 fills up to the next ten with the Zehnerfreunde of the ones; lesson 2 fills up to 100 in two jumps, first to the next ten, then the tens, and ends with the skill check."}},{"id":"math.add-sub-to-100.add-two-digit","domain":"math","topic":"Rechnen bis 100","can":"Ich kann zwei zweistellige Zahlen addieren und dabei einen Rechenweg wählen (schrittweise, stellenweise, mit Hilfsaufgabe).","standards":["kmk-mathe-2022.zo.7","nc-maths-2014.y2.number-addition-and-subtraction.6"],"set":{"title":"Zweistellige Zahlen addieren","file":"twist/lessons/de-DE/klasse-2/math/add-two-digit.yaml","lessons":[{"n":1,"title":"Schrittweise rechnen","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Stellenweise rechnen","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":3,"title":"Mit Hilfsaufgabe","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":64,"summary":"Adding two two-digit numbers with three Rechenwege. Lesson 1 adds schrittweise on the Rechenstrich (first the tens, then the ones, across a ten when needed); lesson 2 adds stellenweise, tens and ones apart, and bundles ten ones into a ten; lesson 3 adds the Hilfsaufgabe for a number just below a full ten, mixes the three ways and ends with the skill check."}},{"id":"math.add-sub-to-100.sub-two-digit","domain":"math","topic":"Rechnen bis 100","can":"Ich kann zweistellige Zahlen voneinander subtrahieren, durch Abziehen in Schritten oder durch Ergänzen.","standards":["kmk-mathe-2022.zo.7","nc-maths-2014.y2.number-addition-and-subtraction.6"],"set":{"title":"Zweistellige Zahlen subtrahieren","file":"twist/lessons/de-DE/klasse-2/math/sub-two-digit.yaml","lessons":[{"n":1,"title":"Abziehen in Schritten","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Ergänzen","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Subtracting a two-digit number from another in two ways. Lesson 1 takes away in steps on the Rechenstrich: first the tens, then the ones, across a ten when needed. Lesson 2 counts up from the smaller number (ergänzen), says when that is the quicker way, and ends with the skill check."}},{"id":"math.add-sub-to-100.clever","domain":"math","topic":"Rechnen bis 100","can":"Ich kann geschickt rechnen, zum Beispiel mit Nachbaraufgaben (45 + 19 = 45 + 20 − 1) oder durch gleichsinniges Verändern.","standards":["kmk-mathe-2022.zo.7","kmk-mathe-2022.zo.9"],"set":{"title":"Geschickt rechnen","file":"twist/lessons/de-DE/klasse-2/math/clever.yaml","lessons":[{"n":1,"title":"Hilfsaufgaben bei Plus und Minus","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Beide Zahlen verändern","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Two tricks for numbers just below a full ten. Lesson 1 recalls the Hilfsaufgabe for plus and carries it over to minus and to numbers two below a ten: add or take away the full ten, then put right what was too much (63 − 29 = 63 − 30 + 1, 58 + 28 = 58 + 30 − 2). Lesson 2 teaches gleichsinniges Verändern for minus: change both numbers the same way so the second becomes a full ten (52 − 18 = 54 − 20), and ends with the skill check."}},{"id":"math.add-sub-to-100.check","domain":"math","topic":"Rechnen bis 100","can":"Ich kann meine Ergebnisse mit der Umkehraufgabe und durch Überschlagen prüfen und Fehler in Rechnungen finden und erklären.","standards":["kmk-mathe-2022.zo.8","kmk-mathe-2022.zo.11","nc-maths-2014.y2.number-addition-and-subtraction.9"],"set":{"title":"Rechnungen prüfen","file":"twist/lessons/de-DE/klasse-2/math/check.yaml","lessons":[{"n":1,"title":"Umkehraufgabe und Überschlag","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Fehler finden","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":44,"summary":"Checking a result with the Umkehraufgabe and with an estimate (Überschlag), then finding and explaining mistakes in worked calculations. Lesson 1 checks minus with plus and estimates by rounding to tens; lesson 2 finds the forgotten ten, wrongly added ones, the swapped ones, a ten not taken away and the wrong operation, puts them right, and ends with the skill check."}},{"id":"math.add-sub-to-100.describe-methods","domain":"math","topic":"Rechnen bis 100","can":"Ich kann verschiedene Rechenwege vergleichen, meinen Weg erklären und sagen, welcher Weg zu welcher Aufgabe passt.","standards":["kmk-mathe-2022.zo.8","kmk-mathe-2022.pk-kommunizieren.1"],"set":{"title":"Rechenwege vergleichen","file":"twist/lessons/de-DE/klasse-2/math/describe-methods.yaml","lessons":[{"n":1,"title":"Welcher Rechenweg ist das?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Welcher Weg passt?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Naming and comparing Rechenwege. Lesson 1 names the way a calculation is worked (schrittweise, stellenweise, mit Hilfsaufgabe, ergänzen) and works sums the named way; lesson 2 says which way suits a calculation and why, checks two children's ways side by side, and ends with the skill check."}},{"id":"math.add-sub-to-100.equations","domain":"math","topic":"Rechnen bis 100","can":"Ich kann Gleichungen und Ungleichungen bis 100 lösen und Platzhalter in Aufgaben bestimmen.","standards":["kmk-mathe-2022.msf.3","nc-maths-2014.y2.number-addition-and-subtraction.9","nc-maths-2014.y3.number-addition-and-subtraction.6","nc-maths-2014.y5.number-multiplication-and-division.10"],"set":{"title":"Gleichungen und Ungleichungen bis 100","file":"twist/lessons/de-DE/klasse-2/math/equations-to-100.yaml","lessons":[{"n":1,"title":"Der Platzhalter","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Größer, kleiner oder gleich?","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":45,"summary":"Finding the number in a Platzhalter and comparing calculations with \u003c, > and =. Lesson 1 finds a missing number by ergänzen or with the Umkehraufgabe (45 + _ = 72, _ − 20 = 35); lesson 2 sets signs between calculations, finds which numbers make a Ungleichung true, and ends with the skill check."}},{"id":"math.mult-div.mult-meaning","domain":"math","topic":"Malaufgaben","can":"Ich kann gleich große Gruppen erkennen und eine Plusaufgabe mit gleichen Zahlen als Malaufgabe schreiben (4 + 4 + 4 = 3 · 4).","standards":["kmk-mathe-2022.zo.4","nc-maths-2014.y1.number-multiplication-and-division.1","nc-maths-2014.y2.number-multiplication-and-division.2"],"set":{"title":"Was bedeutet mal?","file":"twist/lessons/de-DE/klasse-2/math/mult-meaning.yaml","lessons":[{"n":1,"title":"Gleich große Gruppen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Malaufgabe","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Equal groups and the Malaufgabe: 4 + 4 + 4 is three times four, 3 · 4. Lesson 1 sees equal groups and writes the repeated plus sum; lesson 2 writes it as a Malaufgabe with the Malpunkt, reads 3 · 4 as drei mal vier, and ends with the skill check."}},{"id":"math.mult-div.arrays","domain":"math","topic":"Malaufgaben","can":"Ich kann Malaufgaben als Punktefelder darstellen und zu Bildern und Geschichten passende Malaufgaben finden.","standards":["kmk-mathe-2022.zo.4","kmk-mathe-2022.msf.1","nc-maths-2014.y2.number-multiplication-and-division.4"],"set":{"title":"Malaufgaben im Punktefeld","file":"twist/lessons/de-DE/klasse-2/math/arrays.yaml","lessons":[{"n":1,"title":"Punktefelder lesen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Malaufgaben im Alltag","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The Punktefeld as a picture of a Malaufgabe: rows of equal length, read as Reihen mal Punkte in jeder Reihe. Lesson 1 reads and finds Punktefelder; lesson 2 finds the Malaufgabe for pictures and short stories (egg boxes, rows of chairs, packs of juice), and ends with the skill check."}},{"id":"math.mult-div.commutative","domain":"math","topic":"Malaufgaben","can":"Ich kann Tauschaufgaben beim Malnehmen am Punktefeld zeigen und nutzen (3 · 7 = 7 · 3).","standards":["kmk-mathe-2022.zo.9","nc-maths-2014.y2.number-multiplication-and-division.3","nc-maths-2014.y4.number-multiplication-and-division.2"],"set":{"title":"Tauschaufgaben beim Malnehmen","file":"twist/lessons/de-DE/klasse-2/math/mult-commutative.yaml","lessons":[{"n":1,"title":"Das Feld drehen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Tauschen macht es leichter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"A Punktefeld turned round shows the Tauschaufgabe: 3 · 7 and 7 · 3 have the same result. Lesson 1 reads one field both ways; lesson 2 uses the Tauschaufgabe to work out a hard fact from an easy one (9 · 2 from 2 · 9), and ends with the skill check."}},{"id":"math.mult-div.core-facts","domain":"math","topic":"Einmaleins","can":"Ich kann die Kernaufgaben des Einmaleins (mal 1, mal 2, mal 5, mal 10) auswendig.","standards":["kmk-mathe-2022.zo.5","nc-maths-2014.y2.number-multiplication-and-division.1"],"set":{"title":"Die Kernaufgaben","file":"twist/lessons/de-DE/klasse-2/math/core-facts.yaml","lessons":[{"n":1,"title":"Einmal, zweimal, zehnmal","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Fünfmal: die Hälfte von zehnmal","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The Kernaufgaben of the Einmaleins, known by heart: 1 mal, 2 mal, 10 mal and 5 mal a number. Lesson 1 takes 1 mal (the number stays the same), 2 mal (verdoppeln) and 10 mal (so many Zehner); lesson 2 takes 5 mal as half of 10 mal, mixes all four, and ends with the skill check."}},{"id":"math.mult-div.derive-facts","domain":"math","topic":"Einmaleins","can":"Ich kann schwierige Einmaleinsaufgaben aus Kernaufgaben ableiten, durch Verdoppeln, Nachbaraufgaben oder Zerlegen (7 · 6 = 5 · 6 + 2 · 6).","standards":["kmk-mathe-2022.zo.7","kmk-mathe-2022.zo.9"],"set":{"title":"Schwierige Aufgaben ableiten","file":"twist/lessons/de-DE/klasse-2/math/derive-facts.yaml","lessons":[{"n":1,"title":"Nachbaraufgaben und Verdoppeln","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zerlegen in Kernaufgaben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Hard Einmaleins facts worked out from the Kernaufgaben. Lesson 1 uses the Nachbaraufgabe (9 · 6 is 10 · 6 minus one 6; 6 · 4 is 5 · 4 plus one 4) and verdoppeln (4 · 7 is double 2 · 7); lesson 2 splits a fact into two Kernaufgaben (7 · 6 = 5 · 6 + 2 · 6) on a Punktefeld, and ends with the skill check."}},{"id":"math.mult-div.table-2-4-8","domain":"math","topic":"Einmaleins","can":"Ich kann die Einmaleinsreihen der 2, 4 und 8 und sehe, wie sie durch Verdoppeln zusammenhängen.","standards":["kmk-mathe-2022.zo.5","kmk-mathe-2022.msf.2","nc-maths-2014.y2.number-multiplication-and-division.1","nc-maths-2014.y3.number-multiplication-and-division.1"],"set":{"title":"Die Zweier-, Vierer- und Achterreihe","file":"twist/lessons/de-DE/klasse-2/math/table-2-4-8.yaml","lessons":[{"n":1,"title":"Zweier und Vierer","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Achterreihe","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The Einmaleinsreihen of 2, 4 and 8, linked by verdoppeln. Lesson 1 takes the Zweierreihe and the Viererreihe as its double (3 · 4 is double 3 · 2); lesson 2 takes the Achterreihe as the double of the Viererreihe (4 · 8 is double 4 · 4), and ends with the skill check."}},{"id":"math.mult-div.table-5-10","domain":"math","topic":"Einmaleins","can":"Ich kann die Einmaleinsreihen der 5 und 10 und sehe, wie sie zusammenhängen.","standards":["kmk-mathe-2022.zo.5","kmk-mathe-2022.msf.2","nc-maths-2014.y2.number-multiplication-and-division.1"],"set":{"title":"Die Fünfer- und die Zehnerreihe","file":"twist/lessons/de-DE/klasse-2/math/table-5-10.yaml","lessons":[{"n":1,"title":"Die Zehnerreihe","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Fünferreihe","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The Einmaleinsreihen of 10 and 5 and how they belong together. Lesson 1 takes the Zehnerreihe (every result ends in 0) and counts on in tens; lesson 2 takes the Fünferreihe (results end in 5 or 0), finds each fact as half of the Zehnerreihe, and ends with the skill check."}},{"id":"math.mult-div.table-3-6-9","domain":"math","topic":"Einmaleins","can":"Ich kann die Einmaleinsreihen der 3, 6 und 9.","standards":["kmk-mathe-2022.zo.5","kmk-mathe-2022.msf.2","nc-maths-2014.y3.number-multiplication-and-division.1","nc-maths-2014.y4.number-number-and-place-value.1"],"set":{"title":"Die Dreier-, Sechser- und Neunerreihe","file":"twist/lessons/de-DE/klasse-2/math/table-3-6-9.yaml","lessons":[{"n":1,"title":"Dreier und Sechser","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Die Neunerreihe","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The Einmaleinsreihen of 3, 6 and 9. Lesson 1 takes the Dreierreihe and the Sechserreihe as its double (4 · 6 is double 4 · 3); lesson 2 takes the Neunerreihe from the Zehnerreihe (7 · 9 is 7 · 10 minus 7), and ends with the skill check."}},{"id":"math.mult-div.table-7","domain":"math","topic":"Einmaleins","can":"Ich kann die Einmaleinsreihe der 7.","standards":["kmk-mathe-2022.zo.5","nc-maths-2014.y4.number-number-and-place-value.1"],"set":{"title":"Die Siebenerreihe","file":"twist/lessons/de-DE/klasse-2/math/table-7.yaml","lessons":[{"n":1,"title":"Mit fünf mal sieben","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Tauschen und merken","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"The Einmaleinsreihe of 7, the one with the fewest helpers. Lesson 1 builds it from fünf mal sieben (6 · 7 is 5 · 7 and one more 7); lesson 2 uses Tauschaufgaben, the Zehnerreihe and the two facts to learn by heart (7 · 7 and 7 · 8), and ends with the skill check."}},{"id":"math.mult-div.squares","domain":"math","topic":"Einmaleins","can":"Ich kann die Quadratzahlen bis 10 · 10 und erkenne sie im Punktefeld als Quadrate.","standards":["kmk-mathe-2022.msf.2"],"set":{"title":"Quadratzahlen","file":"twist/lessons/de-DE/klasse-2/math/squares.yaml","lessons":[{"n":1,"title":"Quadrate im Punktefeld","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Alle Quadratzahlen bis 100","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Square numbers to 10 · 10. Lesson 1 sees them as square Punktefelder (as many rows as dots in a row) and tells them from fields that are longer than wide; lesson 2 learns all ten, works out a square from the fact next to it (7 · 7 is 6 · 7 and one more 7), and ends with the skill check."}},{"id":"math.mult-div.div-meaning","domain":"math","topic":"Geteiltaufgaben","can":"Ich kann zu Situationen des Aufteilens und Verteilens passende Geteiltaufgaben finden und lösen.","standards":["kmk-mathe-2022.zo.4","nc-maths-2014.y1.number-multiplication-and-division.1","nc-maths-2014.y2.number-multiplication-and-division.4","eyfs-2026.elg.numerical-patterns.3"],"set":{"title":"Aufteilen und Verteilen","file":"twist/lessons/de-DE/klasse-2/math/div-meaning.yaml","lessons":[{"n":1,"title":"Aufteilen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Verteilen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"What division means. Lesson 1 is Aufteilen (12 apples, three to a bag: how many bags?) and the sign \":\" read as \"geteilt durch\"; lesson 2 is Verteilen (12 strawberries shared fairly among three children: how many each?), tells the two apart, and ends with the skill check."}},{"id":"math.mult-div.div-inverse","domain":"math","topic":"Geteiltaufgaben","can":"Ich kann Geteiltaufgaben mit der passenden Malaufgabe lösen und Aufgaben iner Malaufgabe","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Geteiltaufgaben mit Probe","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Every division fact of the kleines Einmaleins. Lesson 1 takes two divisions from each multiplication, divides by 2, 3, 4, 5 and 10, and learns the rules for dividing by itself and by one; lesson 2 divides by 6, 7, 8 and 9 and checks each result with the Probe, and ends with the skill check."}},{"id":"math.mult-div.remainder","domain":"math","topic":"Geteiltaufgaben","can":"Ich kann Geteiltaufgaben mit Rest lösen und den Rest in einer Sachsituation deuten (17 : 5 = 3 Rest 2).","standards":["kmk-mathe-2022.zo.4","kmk-mathe-2022.zo.12"],"set":{"title":"Geteilt mit Rest","file":"twist/lessons/de-DE/klasse-2/math/remainder.yaml","lessons":[{"n":1,"title":"Was übrig bleibt","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Was bedeutet der Rest?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Divisions that do not come out exactly. Lesson 1 finds how many fit and what is left (17 : 5 = 3 Rest 2), checks with the Probe and learns that the Rest is smaller than the divisor; lesson 2 reads the Rest in a story (one more car for the children left over, or money left over), and ends with the skill check."}},{"id":"math.word-problems.ask-questions","domain":"math","topic":"Sachaufgaben","can":"Ich kann zu einer Sachsituation selbst passende Fragen stellen und herausfinden, welche Fragen sich beantworten lassen.","standards":["kmk-mathe-2022.zo.12","kmk-mathe-2022.pk-modellieren.1"],"set":{"title":"Fragen zu Sachaufgaben stellen","file":"twist/lessons/de-DE/klasse-2/math/ask-questions.yaml","lessons":[{"n":1,"title":"Passende Fragen finden","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Kann ich das beantworten?","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 finds questions that fit a situation and the calculation that answers each one (Wie viele sind es zusammen? Wie viele mehr?); lesson 2 tells questions the story can answer from ones it cannot, finds the missing fact, and ends with the skill check."}},{"id":"math.word-problems.sketches","domain":"math","topic":"Sachaufgaben","can":"Ich kann Skizzen, Tabellen und Rechenstriche nutzen, um eine Sachaufgabe zu verstehen und zu lösen.","standards":["kmk-mathe-2022.pk-darstellen.1","kmk-mathe-2022.pk-probleme.2","nc-maths-2014.y2.number-addition-and-subtraction.2"],"set":{"title":"Sachaufgaben mit Rechenstrich und Tabelle","file":"twist/lessons/de-DE/klasse-2/math/sketches.yaml","lessons":[{"n":1,"title":"Geschichten am Rechenstrich","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Tabellen helfen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 draws a story on the Rechenstrich: dazu, weg and ergänzen (Wie viele fehlen noch bis 60?), and reads which story a Rechenstrich shows; lesson 2 puts a story that grows step by step into a table (jede Woche 5 € mehr) and reads facts from it, and ends with the skill check."}},{"id":"math.word-problems.write-stories","domain":"math","topic":"Sachaufgaben","can":"Ich kann zu einer Rechnung oder einem Bild eine passende Rechengeschichte erfinden.","standards":["kmk-mathe-2022.pk-modellieren.3"],"set":{"title":"Rechengeschichten erfinden","file":"twist/lessons/de-DE/klasse-2/math/write-stories.yaml","lessons":[{"n":1,"title":"Geschichten zu Plus und Minus","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Geschichten zu Mal und Geteilt","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 picks and builds stories that fit a plus or minus calculation (Zu 40 − 15 passt: Im Bus sitzen 40 Leute, 15 steigen aus); lesson 2 builds a story from its parts (Anfang, was passiert, Frage) for a mal or geteilt calculation and nds the wrong one, and ends with the skill check."}},{"id":"math.money.amounts-to-100","domain":"math","topic":"Geld","can":"Ich kann Geldbeträge bis 100 € legen, vergleichen und auf verschiedene Arten zusammensetzen.","standards":["kmk-mathe-2022.gm.1","nc-maths-2014.y2.measurement.4"],"set":{"title":"Geldbeträge bis 100 €","file":"twist/lessons/de-DE/klasse-2/math/money-to-100.yaml","lessons":[{"n":1,"title":"Beträge zusammenzählen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Auf verschiedene Arten legen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 adds up Scheine and Münzen to an amount (50 € + 20 € + 5 € = 75 €), starting with the biggest; lesson 2 puts an amount together in different ways, finds the way with the fewest pieces, compares amounts, and ends with the skill check. Laying coins by dragging waits for drag_and_drop."}},{"id":"math.money.shopping","domain":"math","topic":"Geld","can":"Ich kann beim Einkaufen den Preis zusammenrechnen, passend bezahlen und das Rückgeld berechnen.","standards":["kmk-mathe-2022.gm.10","nc-maths-2014.y2.measurement.5","nc-maths-2014.y3.measurement.3"],"set":{"title":"Einkaufen und Rückgeld","file":"twist/lessons/de-DE/klasse-2/math/money-shopping.yaml","lessons":[{"n":1,"title":"Was kostet alles zusammen?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Rückgeld","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 adds up prices (ein Ball für 8 € und ein Buch für 6 € kosten 14 €) and pays with the right notes and coins; lesson 2 works out the Rückgeld by counting up to the note paid with (Preis 17 €, bezahlt mit 20 €: 3 € zurück), and ends with the skill check."}},{"id":"math.money.euro-cent","domain":"math","topic":"Geld","can":"Ich kann Euro und Cent umrechnen (1 € = 100 ct) und Beträge in Euro und Cent angeben.","standards":["kmk-mathe-2022.gm.2","kmk-mathe-2022.gm.7","nc-maths-2014.y2.measurement.3"],"set":{"title":"Euro und Cent","file":"twist/lessons/de-DE/klasse-2/math/money-euro-cent.yaml","lessons":[{"n":1,"title":"1 Euro hat 100 Cent","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Euro und Cent zusammen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 learns that 1 Euro is 100 Cent: which coins make 1 €, how many Cent are missing to 1 € (70 ct + 30 ct = 1 €), and whether an amount in Cent is more or less than 1 €. Lesson 2 reads and writes mixed amounts in Euro and Cent from coins (2 € 50 ct), tells 5 ct from 50 ct, compares amounts, and ends with the skill check. Cent amounts stay within 100 ct and Euro amounts within 100 €, as Klasse 2 asks; Cent amounts above 100 ct come with the decimal notation later."}},{"id":"math.time.quarter-hours","domain":"math","topic":"Uhrzeit","can":"Ich kann Viertelstunden ablesen und einstellen (Viertel nach, Viertel vor, Dreiviertel).","standards":["kmk-mathe-2022.gm.4","nc-maths-2014.y2.measurement.7"],"set":{"title":"Viertelstunden","file":"twist/lessons/de-DE/klasse-2/math/time-quarter.yaml","lessons":[{"n":1,"title":"Viertel nach und Viertel vor","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Alle Viertel","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading quarter hours. Lesson 1 reads Viertel nach (long hand on the 3, 3:15) and Viertel vor (long hand on the 9, 3:45 is Viertel vor vier); lesson 2 mixes all four positions of the long hand with the digital time, mentions Dreiviertel as the regional word, and ends with the skill check. Setting the hands waits for clock_hands_drag."}},{"id":"math.time.calendar","domain":"math","topic":"Kalender","can":"Ich kann im Kalender ein Datum finden, schreiben und ausrechnen, wie viele Tage oder Wochen zwischen zwei Daten liegen.","standards":["kmk-mathe-2022.gm.2","kmk-mathe-2022.dz.2","nc-maths-2014.y1.measurement.11"],"set":{"title":"Datum und Kalender","file":"twist/lessons/de-DE/klasse-2/math/calendar.yaml","lessons":[{"n":1,"title":"Das Datum","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Tage und Wochen zählen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads and writes a date (der 14. März, 14.03.) and finds the day before and after; lesson 2 counts days and weeks between two dates in one month (vom 3. bis zum 10. sind es 7 Tage, eine Woche) and works out which weekday a date falls on, and ends with the skill check. The month sheet to tap waits for the calendar component, so dates come as text."}},{"id":"math.time.five-minutes","domain":"math","topic":"Uhrzeit","can":"Ich kann die Uhrzeit auf fünf Minuten genau ablesen und einstellen, und ich weiß, dass eine Stunde 60 Minuten und ein Tag 24 Stunden hat.","standards":["kmk-mathe-2022.gm.6","nc-maths-2014.y2.measurement.7","nc-maths-2014.y2.measurement.8"],"set":{"title":"Uhrzeit auf fünf Minuten genau","file":"twist/lessons/de-DE/klasse-2/math/time-five-minutes.yaml","lessons":[{"n":1,"title":"Nach und vor","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Um halb herum","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Reading the clock in steps of five minutes. Lesson 1 counts the long hand in Fünferschritten (on the 4 it is 20 minutes) and says nach and vor (zehn nach drei, zehn vor vier); lesson 2 reads the times around halb (fünf vor halb vier, fünf nach halb vier), learns that an hour has 60 minutes and a day 24 hours, and ends with the skill check."}},{"id":"math.length.compare","domain":"math","topic":"Längen","can":"Ich kann Längen direkt vergleichen und ordnen (länger, kürzer, gleich lang).","standards":["kmk-mathe-2022.gm.1","nc-maths-2014.y1.measurement.1","nc-maths-2014.y2.measurement.2"],"set":{"title":"Längen vergleichen","file":"twist/lessons/de-DE/klasse-2/math/length-compare.yaml","lessons":[{"n":1,"title":"Länger, kürzer, gleich lang","acts":["learn","practise","check"],"tasks":18},{"n":2,"title":"Der Länge nach ordnen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":40,"summary":"Lesson 1 compares two things directly (länger, kürzer, gleich lang) and learns that you line them up at one end; lesson 2 orders three or more lengths, from the shortest to the longest, uses größer and kleiner for heights, and ends with the skill check. The lengths are everyday things and sentences; measuring with a ruler comes in a later skill."}},{"id":"math.mass-capacity.compare-capacity","domain":"math","topic":"Rauminhalte","can":"Ich kann vergleichen, in welches Gefäß mehr passt, und sagen, ob es voll, halb voll oder leer ist.","standards":["kmk-mathe-2022.gm.1","nc-maths-2014.y1.measurement.3","nc-maths-2014.y1.measurement.7","nc-maths-2014.y2.measurement.2"],"set":{"title":"Wo passt mehr hinein?","file":"twist/lessons/de-DE/klasse-2/math/compare-capacity.yaml","lessons":[{"n":1,"title":"Voll, halb voll, leer","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Umfüllen und vergleichen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 compares containers (In einen Eimer passt mehr als in eine Tasse) and says whether one is voll, halb voll or leer; lesson 2 compares by pouring and by counting cups (Die Kanne füllt 4 Becher, die Flasche 6), sees that a tall glass does not always hold more, and ends with the skill check."}},{"id":"math.length.non-standard","domain":"math","topic":"Längen","can":"Ich kann Längen mit Körpermaßen und Gegenständen messen und erklären, warum wir einheitliche Maße brauchen.","standards":["kmk-mathe-2022.gm.5","nc-maths-2014.y1.measurement.5"],"set":{"title":"Messen mit Körpermaßen","file":"twist/lessons/de-DE/klasse-2/math/length-non-standard.yaml","lessons":[{"n":1,"title":"Mit Händen und Füßen messen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Warum wir Zentimeter brauchen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 measures with hand spans, steps, feet and objects (Der Tisch ist 6 Handspannen lang) and reads which measure is longer from the count; lesson 2 sees that big and small hands give different numbers, why we need one measure for everyone (der Zentimeter, der Meter), and ends with the skill check."}},{"id":"math.length.cm-m","domain":"math","topic":"Längen","can":"Ich kann Längen in Zentimetern mit dem Lineal messen und Strecken genau zeichnen, und ich weiß, dass 1 m = 100 cm sind.","standards":["kmk-mathe-2022.gm.2","kmk-mathe-2022.gm.6","nc-maths-2014.y1.measurement.5","nc-maths-2014.y2.measurement.1"],"set":{"title":"Zentimeter und Meter","file":"twist/lessons/de-DE/klasse-2/math/length-cm-m.yaml","lessons":[{"n":1,"title":"Mit dem Lineal messen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"1 Meter hat 100 Zentimeter","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads lengths on the ruler in cm, first from 0 and then from a strip that starts further along (von 2 bis 9 sind es 7 cm); lesson 2 learns 1 m = 100 cm, changes between m and cm (2 m = 200 cm, 1 m 40 cm = 140 cm) and picks cm or m for a thing, and ends with the skill check. Drawing a line of a given length waits for a drawing task."}},{"id":"math.length.estimate","domain":"math","topic":"Längen","can":"Ich kann Längen mit Stützpunktvorstellungen schätzen (1 cm ist so breit wie mein Finger, 1 m ist ein großer Schritt).","standards":["kmk-mathe-2022.gm.3","kmk-mathe-2022.gm.8","nc-maths-2014.y2.measurement.1"],"set":{"title":"Längen schätzen","file":"twist/lessons/de-DE/klasse-2/math/length-estimate.yaml","lessons":[{"n":1,"title":"So lang ist 1 cm, so lang ist 1 m","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Mit Stützpunkten schätzen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 learns benchmarks (1 cm ist so breit wie dein Finger, 1 m ist ein großer Schritt, eine Tür ist etwa 2 m hoch) and picks the length that fits a thing; lesson 2 estimates with a benchmark (Der Tisch ist etwa 2 Schritte lang, also etwa 2 m), spots estimates in the wrong unit, and ends with the skill check."}},{"id":"math.length.calculate","domain":"math","topic":"Längen","can":"Ich kann mit Längenangaben in m und cm rechnen und Sachaufgaben zu Längen lösen.","standards":["kmk-mathe-2022.gm.10","nc-maths-2014.y3.measurement.1","nc-maths-2014.y4.measurement.4"],"set":{"title":"Mit Längen rechnen","file":"twist/lessons/de-DE/klasse-2/math/length-calculate.yaml","lessons":[{"n":1,"title":"Längen plus und minus","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Sachaufgaben mit Längen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 adds and subtracts lengths in cm and says the unit in the answer (35 cm + 40 cm = 75 cm), also up to 1 m (60 cm + 40 cm = 100 cm = 1 m); lesson 2 solves length stories with m and cm (Wie viel fehlt noch bis 1 m? Wie lang sind beide Bretter zusammen?), and ends with the skill check."}},{"id":"math.shapes.properties","domain":"math","topic":"Formen","can":"Ich kann Figuren nach Ecken und Seiten beschreiben und sortieren und erklären, warum ein Quadrat auch ein Rechteck ist.","standards":["kmk-mathe-2022.rf.4","nc-maths-2014.y2.geometry-properties-of-shapes.1","nc-maths-2014.y2.geometry-properties-of-shapes.4"],"set":{"title":"Ecken und Seiten","file":"twist/lessons/de-DE/klasse-2/math/shape-properties.yaml","lessons":[{"n":1,"title":"Ecken und Seiten zählen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Quadrat und Rechteck","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 describes flat shapes by their Ecken and Seiten (Dreieck 3, Viereck 4, Sechseck 6, der Kreis hat keine Ecke) and sorts them by the number of corners, whatever their colour or size; lesson 2 sets Rechteck and Quadrat side by side (four rechte Ecken; in a Quadrat all four sides are gleich lang), explains why every Quadrat is also a Rechteck but not the other way round, and ends with the skill check. Folding and measuring paper shapes waits for a hands-on task."}},{"id":"math.space.follow-directions","domain":"math","topic":"Orientierung","can":"Ich kann Wegbeschreibungen folgen und selbst Wege beschreiben, auch auf einem Gitter mit Pfeilen.","standards":["kmk-mathe-2022.rf.1","nc-maths-2014.y2.geometry-position-and-direction.2"],"set":{"title":"Wege auf dem Gitter","file":"twist/lessons/de-DE/klasse-2/math/follow-directions.yaml","lessons":[{"n":1,"title":"Pfeilen folgen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Wege beschreiben","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 follows arrows on a 3 by 3 Gitter of lettered Felder (von G zweimal nach oben und einmal nach rechts: B) and picks the arrows for a route; lesson 2 works on a 4 by 4 Gitter, describes routes in words (2 nach rechts, 1 nach unten), finds the shortest route and the way back, and ends with the skill check. Following directions on a map and walking a route with a finger wait for a map and a drag task."}},{"id":"math.shapes.draw-freehand-ruler","domain":"math","topic":"Formen","can":"Ich kann Linien, Figuren und Muster frei Hand und mit Lineal oder Schablone auf Kästchenpapier zeichnen.","standards":["kmk-mathe-2022.rf.8","nc-maths-2014.y3.geometry-properties-of-shapes.1"],"set":{"title":"Zeichnen mit Lineal und frei Hand","file":"twist/lessons/de-DE/klasse-2/math/draw-freehand-ruler.yaml","lessons":[{"n":1,"title":"Lineal oder frei Hand?","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Figuren und Muster auf Karopapier","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 chooses the tool (frei Hand for a Wellenlinie or a Baum, das Lineal for straight lines, die Schablone for a Kreis), says how to hold the ruler, and counts how many Kästchen long a line on Karopapier is; lesson 2 picks the right drawing of a Quadrat or Rechteck of given size, finds what is wrong with a drawing (a corner open, a side slanted, sides not equal), continues line patterns and ends with the skill check. The child cannot draw in the app yet, so every task asks which drawing, which tool or what is wrong; drawing on the grid with a finger waits for a drawing task."}},{"id":"math.symmetry.complete","domain":"math","topic":"Symmetrie","can":"Ich kann eine Figur auf Kästchenpapier an einer Achse spiegeln und zu einer symmetrischen Figur ergänzen.","standards":["kmk-mathe-2022.rf.9","kmk-mathe-2022.rf.10","nc-maths-2014.y4.geometry-properties-of-shapes.4"],"set":{"title":"Figuren symmetrisch ergänzen","file":"twist/lessons/de-DE/klasse-2/math/symmetry-complete.yaml","lessons":[{"n":1,"title":"Eine Reihe spiegeln","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Figuren ergänzen und prüfen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 mirrors one row of Kästchen at a senkrechte Spiegelachse, starting next to the axis, and tells mirroring from copying (■ □ □ │ □ □ ■, not ■ □ □ │ ■ □ □); lesson 2 completes and checks figures of two and three rows, mirrors to the left and across a waagerechte Achse, finds the row with a mistake, and ends with the skill check. The figures are rows of Kästchen in the task text, so the child fills each mirrored Kästchen from a chip. Colouring Kästchen on squared paper and drawing the mirror half of a picture wait for a drawing task."}},{"id":"math.solids.cube-cuboid-sphere","domain":"math","topic":"Körper","can":"Ich kann Würfel, Quader und Kugel erkennen, benennen und in meiner Umwelt finden.","standards":["kmk-mathe-2022.rf.4","kmk-mathe-2022.rf.5","nc-maths-2014.y1.geometry-properties-of-shapes.2","nc-maths-2014.y2.geometry-properties-of-shapes.4"],"set":{"title":"Würfel, Quader und Kugel","file":"twist/lessons/de-DE/klasse-2/math/solids.yaml","lessons":[{"n":1,"title":"Körper erkennen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Flächen, Ecken und Kanten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 tells the three Körper apart and names them, in drawings and in things around us (ein Ball ist eine Kugel, ein Buch ist ein Quader), and keeps the Körper apart from the flat shapes (Kugel, nicht Kreis); lesson 2 counts Flächen, Ecken and Kanten (Würfel and Quader: 6, 8, 12; Kugel: keine Ecke, keine Kante), sorts what rolls and what does not, and ends with the skill check. Feeling and building real solids waits for a hands-on task."}},{"id":"math.solids.cube-buildings","domain":"math","topic":"Körper","can":"Ich kann einfache Würfelgebäude nach Bauplan bauen und zu einem Gebäude den Bauplan schreiben.","standards":["kmk-mathe-2022.rf.2","nc-maths-2014.y3.geometry-properties-of-shapes.1"],"set":{"title":"Würfelgebäude und Baupläne","file":"twist/lessons/de-DE/klasse-2/math/cube-buildings.yaml","lessons":[{"n":1,"title":"Türme und Baupläne","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Baupläne mit zwei Reihen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads a Bauplan in one row: each field says how many Würfel stand on top of each other there, the whole building needs the sum of all numbers (Bauplan 3 1 2: 6 Würfel), and the plan starts on the left; lesson 2 reads and writes plans with two rows (hinten and vorne), finds the highest tower, and ends with the skill check. Building with real cubes and drawing a building from a plan wait for a hands-on task and a 3D view of a whole building."}},{"id":"math.area-volume.compare-area","domain":"math","topic":"Flächeninhalt und Umfang","can":"Ich kann Flächen durch Auslegen mit Kästchen vergleichen und sagen, welche Fläche größer ist.","standards":["kmk-mathe-2022.gm.1","kmk-mathe-2022.gm.5","kmk-mathe-2022.rf.7"],"set":{"title":"Flächen vergleichen","file":"twist/lessons/de-DE/klasse-2/math/compare-area.yaml","lessons":[{"n":1,"title":"Kästchen zählen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Figuren auf Kästchenpapier","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 measures a Fläche by the Kästchen that cover it and compares two Flächen by counting, so the longer one is not always the bigger one (a row of 7 is smaller than 2 rows of 4); lesson 2 counts only the coloured Kästchen on Kästchenpapier, sees that many different Figuren can have the same size, compares only with gleich große Kästchen, and ends with the skill check. Covering a shape by dragging tiles onto it waits for a drag task."}},{"id":"math.data.read-tables","domain":"math","topic":"Daten","can":"Ich kann Informationen aus Tabellen und Kalendern ablesen und damit Fragen beantworten.","standards":["kmk-mathe-2022.dz.2","nc-maths-2014.y2.statistics.1","nc-maths-2014.y3.statistics.1","nc-maths-2014.y5.statistics.2"],"set":{"title":"Tabellen lesen","file":"twist/lessons/de-DE/klasse-2/math/read-tables.yaml","lessons":[{"n":1,"title":"Eine Tabelle lesen","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zeilen und Spalten","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads a table with two columns (Eissorte und Kinder, Bücher in den Ferien, Tiere auf dem Bauernhof): find the row, read across, and answer questions about the most, the fewest, how many more and how many together; lesson 2 reads tables with rows and columns, where the answer stands where a row and a column meet (Runden an drei Tagen, ein Stundenplan, ein Wochenkalender), and ends with the skill check. Filling in a table yourself waits for a table task."}},{"id":"math.data.pictograms-bar-charts","domain":"math","topic":"Daten","can":"Ich kann Daten in Bilddiagrammen und Säulendiagrammen darstellen und daraus ablesen.","standards":["kmk-mathe-2022.dz.2","nc-maths-2014.y2.statistics.1","nc-maths-2014.y2.statistics.3","nc-maths-2014.y3.statistics.1"],"set":{"title":"Bilddiagramme und Säulendiagramme","file":"twist/lessons/de-DE/klasse-2/math/pictograms-bar-charts.yaml","lessons":[{"n":1,"title":"Bilddiagramme","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Säulendiagramme","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 reads Bilddiagramme where a dot stands for one child or for two (● = 2 Kinder: count in twos), and turns a Strichliste into a row of the Bilddiagramm; lesson 2 reads Säulendiagramme on a scale in ones and in twos (read the number on the scale, do not count the lines), finds the chart that fits a Strichliste, and ends with the skill check. Drawing the bars or placing the pictures yourself waits for a drawing or drag task."}},{"id":"math.chance.combinations","domain":"math","topic":"Kombinatorik","can":"Ich kann systematisch herausfinden, wie viele Möglichkeiten es gibt (zum Beispiel Kleidung kombinieren), mit Tabelle oder Baumdiagramm.","standards":["kmk-mathe-2022.dz.4","kmk-mathe-2022.pk-probleme.2","nc-maths-2014.y3.number-multiplication-and-division.3","nc-maths-2014.y6.algebra.5"],"set":{"title":"Wie viele Möglichkeiten?","file":"twist/lessons/de-DE/klasse-2/math/combinations.yaml","lessons":[{"n":1,"title":"Kleidung kombinieren","acts":["warm-up","learn","practise","check"],"tasks":20},{"n":2,"title":"Zahlen legen und Spiele zählen","acts":["warm-up","learn","practise","check"],"tasks":22}],"tasks":42,"summary":"Lesson 1 combines clothes and food systematically: take one T-Shirt and go through every Hose, then the next T-Shirt (rot → blau, grau; gelb → blau, grau: 4 Möglichkeiten), so nothing is missed, and sees that 2 T-Shirts and 3 Hosen make 3 + 3 = 6, not 5; lesson 2 lays two-digit numbers from Ziffernkarten in order (1 vorne, 2 vorne, 3 vorne), counts games when everyone plays everyone (Lea gegen Tim is the same game as Tim gegen Lea), and ends with the skill check. Drawing the tree or dressing a figure by dragging waits for a drawing or drag task."}},{"id":"math.chance.certain-possible-impossible","domain":"math","topic":"Wahrscheinlichkeit","can":"Ich kann Ereignisse als sicher, wahrscheinlich, unwahrscheinlich oder unmöglich beschreiben.","standards":["kmk-mathe-2022.dz.5"],"set":{"title":"Sicher, möglich, unmöglich","file":"twist/lessons/de-DE/klasse-2/math/certain-possible-impossible.yaml","lessons":[{"n":1,"title":"Sicher, möglich oder unmöglich","acts":["learn","practise","check"],"tasks":21},{"n":2,"title":"Wahrscheinlich oder unwahrscheinlich","acts":["warm-up","learn","practise","check"],"tasks":25}],"tasks":46,"summary":"Lesson 1 sorts what can happen into sicher, möglich and unmöglich with Glücksräder, a normal Würfel and everyday events (a wheel that is all red always stops on red; a 7 is unmöglich with a Würfel); lesson 2 splits möglich into wahrscheinlich and unwahrscheinlich by counting fields on the wheel or balls in a bag (five red fields and one blue: blue is möglich, but unwahrscheinlich), orders the words from unmöglich to sicher, and ends with the skill check. Spinning a real wheel or drawing balls waits for an experiment task."}},{"id":"lit-de.nouns.compounds","domain":"lit-de","topic":"Nomen","can":"Ich kann zusammengesetzte Nomen bilden und zerlegen und weiß, dass das letzte Wort den Artikel bestimmt (das Haus, die Tür, die Haustür).","standards":["kmk-deutsch-2022.sp.9"],"set":{"title":"Zusammengesetzte Nomen","file":"twist/lessons/de-DE/klasse-2/lit-de/compound-nouns.yaml","lessons":[{"n":1,"title":"Aus zwei Nomen wird eins","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Zerlegen und verstehen","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":3,"title":"Das letzte Wort bestimmt den Artikel","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":68,"summary":"Two nouns make a new one: der Baum und das Haus werden das Baumhaus. Lesson 1 builds compounds from two pictures; lesson 2 splits them into their parts and finds what the word means (ein Baumhaus ist ein Haus); lesson 3 finds the article from the last word and ends with the skill check. Most compounds have no joining letter; a few have one (Kinderzimmer, Sonnenhut), and lesson 3 says so."}},{"id":"lit-de.nouns.pronouns","domain":"lit-de","topic":"Pronomen","can":"Ich kann Nomen durch Pronomen ersetzen (er, sie, es, wir), damit sich ein Text nicht wiederholt.","standards":["kmk-deutsch-2022.sp.13","kmk-deutsch-2022.sch.18"],"set":{"title":"Pronomen","file":"twist/lessons/de-DE/klasse-2/lit-de/pronouns.yaml","lessons":[{"n":1,"title":"Er, sie, es","acts":["warm-up","learn","practise","check"],"tasks":22},{"n":2,"title":"Wir, ihr, sie","acts":["warm-up","learn","practise","check"],"tasks":24}],"tasks":46,"summary":"A pronoun stands for a noun, so a text does not repeat itself: der Hund bellt, er bellt laut. Lesson 1 matches er, sie and es to the article (der, die, das) and finds who a pronoun means; lesson 2 adds the plural sie and the pronouns wir and ihr, chooses the text that repeats less, and ends with the skill check."}},{"id":"lit-de.verbs.recognise","domain":"lit-de","topic":"Verben","can":"Ich kann Verben erkennen, die sagen, was jemand tut oder was geschieht.","standards":["kmk-deutsch-2022.sp.13"],"set":{"title":"Verben erkennen","file":"twist/lessons/de-DE/klasse-2/lit-de/verbs-recognise.yaml","lessons":[{"n":1,"title":"Was tut jemand?","acts":["warm-up","learn","practise","check"],"tasks":21},{"n":2,"title":"Verb, Nomen oder Adjektiv?","acts":["warm-up","learn","practise","check"],"tasks":23}],"tasks":44,"summary":"Verben sagen, was jemand tut oder was geschieht. Lesson 1 fin
