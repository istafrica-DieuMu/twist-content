curriculum: de-DE
title: Deutschland
market: de-DE
domains: [math, lit-de, fl, world]
subjects: { math: Mathe, lit-de: Deutsch, fl: Englisch, world: Sachunterricht }
frameworks: [kmk-mathe-2022, kmk-deutsch-2022, kmk-fremdsprachen-gs-2013, nrw-sachunterricht-2021]
facets:
  currency: eur
  number-format: de
  operation-signs: de
  units: metric
  time-format: de-24h
  date-format: de
  written-subtraction: abziehen   # Bayern prescribes it, Baden-Württemberg allows it, NRW leaves it open
notes: >
  One curriculum for Germany, based on the KMK Bildungsstandards for Mathe
  and Deutsch (end of Klasse 4) and the KMK report on foreign languages in
  primary school (target A1 at the end of Klasse 4). KMK sets no grade order, so steps follow the order of a typical
  German Klasse 1 to 4 course, checked against the Klasse 2 and Klasse 4
  bands of the NRW Lehrplan. KMK has no standards for Sachunterricht, so
  the NRW Lehrplan Sachunterricht (2021) is its framework; its six areas are
  the six world progressions, placed by its Klasse 2 and Klasse 4 bands and
  checked against Bayern, Baden-Württemberg and Berlin/Brandenburg
  (docs/plans/de-DE/sachunterricht.md). Steps KMK does not list but German schools
  teach (written division) are marked beyond_framework; extensions
  (Roman numerals, binary numbers, data sizes, divisibility rules, point
  symmetry) sit at the end of Klasse 4.
learning_years:
  # Englisch as the first foreign language. Most Länder start in Klasse 3;
  # children who start in Klasse 1 or 2 begin with the oral Stufe 0.
  language: en
  stufe-0: { grades: [klasse-1, klasse-2], optional: true }
  lernjahr-1: { grades: [klasse-3] }
  lernjahr-2: { grades: [klasse-4] }
  note: >
    Placement in a learning year is an expectation, not a gate. A child who
    shows readiness in Stufe 0 moves on to Lernjahr 1; an older beginner
    starts in Lernjahr 1 and works through the Stufe 0 steps first, in the
    a8-10 presentation.
out_of_scope:
  kmk-deutsch-2022.sz.7: Feedback to classmates on their talks happens in class, between children.
  kmk-deutsch-2022.sz.15: Taking roles in a group conversation needs other children present.
  kmk-deutsch-2022.sz.18: Talking with the class about one's own learning happens in class.
  kmk-deutsch-2022.sz.20: Board, poster and moderation cards are classroom tools.
  kmk-deutsch-2022.sz.22: Scenic speaking and play are rehearsed and performed together in class.
  kmk-deutsch-2022.sch.16: Cooperative planning of a text needs a writing partner.
  kmk-deutsch-2022.sch.26: Giving and asking for feedback on texts happens between children.
  kmk-deutsch-2022.tm.8: Finding one's way in a library is learnt in a real library.
  kmk-deutsch-2022.tm.21: The literary conversation is a group discussion in class.
  kmk-deutsch-2022.tm.30: Staging texts scenically is done together in class.
  nrw-sachunterricht-2021.kg.koerper-und-entwicklung.4: Puberty is sex education, left to school and family (decided 2026-10-24).
  nrw-sachunterricht-2021.kg.koerper-und-entwicklung.5: Human development from conception to birth is sex education, left to school and family (decided 2026-10-24).
  nrw-sachunterricht-2021.kg.koerper-und-entwicklung.6: Contraception and protection from sexually transmitted infections are sex education, left to school and family (decided 2026-10-24).
  nrw-sachunterricht-2021.dg.leben-in-vielfalt.5: Sexual orientation and gender identity are taught with sex education, left to school and family (decided with it, 2026-10-24).
  nrw-sachunterricht-2021.rm.mobilitaet-im-raum.5: Riding a scooter or bike course is practised on a real course, like the Fahrradprüfung.
  nrw-sachunterricht-2021.tda.bauen-und-konstruieren.6: Model drawings are made and used while building real models in class.
  nrw-sachunterricht-2021.tda.bauen-und-konstruieren.1: Testing how self-built vehicles roll needs real vehicles built in class; the idea is in world.technology.vehicles.
  nrw-sachunterricht-2021.zw.frueher-heute-und-morgen.4: Presenting life now and future actions through play and other forms is done together in class.
# Placed skills that no standard of this curriculum asks for, each with the
# reason Twist keeps it.
enrichment:
  math.written-mult-div.div-one-digit: The KMK standards ask for written addition, subtraction and multiplication only; some Länder, Bavaria among them, still teach written division by a one-digit number in Klasse 4, so Twist keeps it.
  math.written-mult-div.div-remainder-zeros: The KMK standards ask for written addition, subtraction and multiplication only; remainders and zeros in the quotient complete the written division that some Länder still teach in Klasse 4.
  math.large-numbers.roman-numerals: Roman numerals are in no KMK standard; children meet them on clocks and buildings, and comparing them with the decimal system deepens place value.
