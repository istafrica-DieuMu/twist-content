curriculum: en-GB
title: England
market: en-GB
domains: [math, lit-en, fl]
subjects: { math: Maths, lit-en: English, fl: French }
frameworks: [eyfs-2026, nc-maths-2014, nc-english-2014, nc-languages-2014]
facets:
  currency: gbp
  number-format: en
  operation-signs: en
  units: metric-imperial
  time-format: en-12h-24h
  date-format: en-gb
  written-subtraction: column-exchange
learning_years:
  # French in key stage 2. Languages are statutory from Year 3.
  language: fr
  ly-1: { grades: [year-3] }
  ly-2: { grades: [year-4] }
  ly-3: { grades: [year-5] }
  ly-4: { grades: [year-6] }
  note: >
    Placement in a learning year is an expectation, not a gate. A school
    that starts French in key stage 1 begins ly-1 earlier, with the a6-7
    presentation.
notes: >
  The curriculum for England: EYFS (Reception) and the National Curriculum
  (Years 1 to 6). Maths steps sit in the earliest year whose programme of
  study names them; steps the National Curriculum does not name come one
  year after their German Klasse, which is the same age. Every step comes
  after its prerequisites.
out_of_scope:
  eyfs-2026.elg.listening-attention-and-understanding.3: Back-and-forth conversation with teachers and peers happens in the classroom.
  eyfs-2026.elg.speaking.1: Small-group and class discussions need other children.
  eyfs-2026.elg.self-regulation.1: Personal, social and emotional development is outside the subjects Twist teaches.
  eyfs-2026.elg.self-regulation.2: Personal, social and emotional development is outside the subjects Twist teaches.
  eyfs-2026.elg.managing-self.1: Personal, social and emotional development is outside the subjects Twist teaches.
  eyfs-2026.elg.managing-self.2: Personal, social and emotional development is outside the subjects Twist teaches.
  eyfs-2026.elg.managing-self.3: Personal, social and emotional development is outside the subjects Twist teaches.
  eyfs-2026.elg.building-relationships.1: Personal, social and emotional development is outside the subjects Twist teaches.
  eyfs-2026.elg.building-relationships.2: Personal, social and emotional development is outside the subjects Twist teaches.
  eyfs-2026.elg.building-relationships.3: Personal, social and emotional development is outside the subjects Twist teaches.
  eyfs-2026.elg.gross-motor-skills.1: Gross motor skills are physical development, learnt through movement and play.
  eyfs-2026.elg.gross-motor-skills.2: Gross motor skills are physical development, learnt through movement and play.
  eyfs-2026.elg.gross-motor-skills.3: Gross motor skills are physical development, learnt through movement and play.
  eyfs-2026.elg.fine-motor-skills.2: Using scissors, brushes and cutlery is learnt with real tools.
  eyfs-2026.elg.fine-motor-skills.3: Drawing with care is practised on paper in the classroom.
  nc-english-2014.y1to6.spoken-language.6: Collaborative conversation needs other children.
  nc-english-2014.y1to6.spoken-language.9: Discussions, performances, role play and debates happen with a class.
  nc-english-2014.y1to6.spoken-language.11: Building on others' contributions happens in group discussion.
  nc-english-2014.y1.reading-comprehension.12: Taking turns in discussion about books happens in class.
  nc-english-2014.y1.writing-composition.5: Discussing writing with the teacher and other pupils happens in class.
  nc-english-2014.y2.reading-comprehension.14: Taking turns in discussion about books happens in class.
  nc-english-2014.y34.reading-comprehension.16: Taking turns in discussion about books happens in class.
  nc-english-2014.y56.reading-comprehension.18: Building on others' ideas in book discussion happens in class.
