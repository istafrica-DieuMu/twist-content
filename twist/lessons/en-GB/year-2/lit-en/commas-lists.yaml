# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.commas-lists
skill: lit-en.grammar.commas-lists
curriculum: en-GB
language: en
title:
  de: Kommas in Aufzählungen
  en: Commas in lists
summary: >
  In a list, commas separate the items and and joins the last two, with
  no comma before and. Lesson 1 punctuates lists of single things (eggs,
  milk, bread and jam); lesson 2 takes longer items (a red hat, a warm
  scarf and some gloves) and lists inside whole sentences that still need
  a capital letter and a full stop, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.grammar.sentence-punctuation]
  also_practises: [lit-en.grammar.sentence-punctuation]
  vocabulary: { en: [comma, list, item, and, full stop, capital letter] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: single-items, what: { de: "Kommas zwischen einzelne Dinge einer Aufzählung setzen", en: "putting commas between single things in a list" } }
    - { id: no-comma-and, what: { de: "kein Komma vor and: and verbindet die letzten zwei Dinge", en: "no comma before and: and joins the last two things" } }
    - { id: longer-items, what: { de: "Kommas bei längeren Dingen setzen (a red hat, a warm scarf)", en: "commas between longer things (a red hat, a warm scarf)" } }
    - { id: in-sentence, what: { de: "eine Aufzählung im Satz mit Großbuchstaben und Punkt", en: "a list in a sentence with a capital letter and a full stop" } }
  misconceptions:
    - id: comma-before-and
      what: Puts a comma before the and that joins the last two items (cats, dogs, and rabbits)
      addressed: Lesson 1 Learn screen 2; feedback in l1-f2; l1-s2, l1-n3, l2-c2
    - id: and-every-time
      what: Writes and between every item instead of commas (eggs and milk and bread and jam)
      addressed: Lesson 1 Learn screen 1; l1-f4, l1-s4, l2-c5
    - id: comma-inside-item
      what: Puts commas inside a longer item (a red, hat) or between every word
      addressed: Lesson 2 Learn screen 1 shows each item as one block; feedback in l2-f2; l2-s3, l2-n2, l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Kommas zwischen Dingen, en: Commas between things }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Fill the gap: The dog is asleep_"
            say: "Which mark ends this sentence?"
            frame: "The dog is asleep_"
            options: [".", ",", "?"]
            answer: ["."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which sentence is written correctly?"
            say: "Read the sentences yourself. Which one starts and ends the right way?"
            options: ["We went to the park.", "we went to the park.", "We went to the park"]
            answer: "We went to the park."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "eggs and milk and bread and jam\neggs, milk, bread and jam"
            say: "When we write a list, we do not need to write and every time. We put a comma between the things instead. Eggs, comma, milk, comma, bread and jam."
            show: { drawn: letter-card, text: "eggs, milk, bread and jam" }
          - text: "cats, dogs and rabbits"
            say: "Before the last thing, we write and. There is no comma before and. Cats, dogs and rabbits."
          - text: "I can see a bus, a car, a van and a bike."
            say: "A list can be inside a sentence. The sentence still starts with a capital letter and ends with a full stop."
          - text: "comma, comma, and"
            say: "Count the things. Put a comma after each one, except the last two. They are joined by and."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Fill the gaps: red_ blue_ green and yellow"
                say: "Which mark goes in each gap in this list?"
                frame: "red_ blue_ green and yellow"
                options: [",", ".", "?"]
                answer: [",", ","]
                option_audio: false
                hints:
                  - "The gaps are between the things in the list."
                  - "We separate things in a list with a comma."
                  - "A comma in both gaps."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which list is written correctly?"
                say: "Read the lists yourself. Which one has the commas in the right places?"
                options: ["pens, pencils and rulers", "pens, pencils, and rulers", "pens pencils and rulers"]
                answer: "pens, pencils and rulers"
                option_audio: false
                feedback:
                  "pens, pencils, and rulers": "We do not put a comma before the and."
                hints:
                  - "Look at the word and."
                  - "Is there a comma before and?"
                  - "pens, pencils and rulers"
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the word that needs a comma after it."
                say: "One comma is missing from this list. Tap the word that needs a comma after it."
                show: { drawn: letter-card, text: "apples pears, plums and grapes" }
                spans: ["apples"]
                hints:
                  - "Each thing needs a comma after it, except the last two."
                  - "Look at the first thing."
                  - "apples"
              - id: l1-f4
                type: multiple_choice
                text: "Which list uses commas?"
                say: "Read the lists yourself. Which one uses commas instead of lots of ands?"
                options: ["Mum, Dad, Gran and me", "Mum and Dad and Gran and me", "Mum Dad Gran me"]
                answer: "Mum, Dad, Gran and me"
                option_audio: false
                hints:
                  - "Which one has commas between the people?"
                  - "Commas take the place of most of the ands."
                  - "Mum, Dad, Gran and me"
              - id: l1-f5
                type: true_false
                text: "Is it true? \"sun, rain and snow\" is written correctly."
                answer: true
                hints:
                  - "Is there a comma between the first two?"
                  - "Is there no comma before and?"
                  - "Yes, it is right."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Fill the gaps: hats_ coats_ scarves and gloves"
                say: "Which mark goes in each gap in this list?"
                frame: "hats_ coats_ scarves and gloves"
                options: [",", ".", "!"]
                answer: [",", ","]
                option_audio: false
                hints: ["Things in a list are separated by commas."]
              - id: l1-s2
                type: true_false
                text: "Is it true? \"ducks, geese, and swans\" is written correctly."
                answer: false
                hints: ["Look before the and."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the word that needs a comma after it."
                say: "One comma is missing from this list. Tap the word that needs a comma after it."
                show: { drawn: letter-card, text: "Monday, Tuesday Wednesday and Thursday" }
                spans: ["Tuesday"]
                hints: ["Check the gap after each day."]
              - id: l1-s4
                type: multiple_choice
                text: "Which list is written correctly?"
                say: "Read the lists yourself. Which one is right?"
                options: ["lions, tigers and bears", "lions and tigers and, bears", "lions, tigers, bears, and"]
                answer: "lions, tigers and bears"
                option_audio: false
                hints: ["Commas go between the things, and the word and goes before the last one."]
              - id: l1-s5
                type: fill_in_blank
                text: "Fill the gaps: one_ two_ three and four"
                say: "Which mark goes in each gap in this list?"
                frame: "one_ two_ three and four"
                options: [",", ".", "?"]
                answer: [",", ","]
                option_audio: false
                hints: ["The same mark goes in both gaps."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the word that needs a comma after it."
                say: "One comma is missing from this list. Tap the word that needs a comma after it."
                show: { drawn: letter-card, text: "cake, buns biscuits and tarts" }
                spans: ["buns"]
              - id: l1-n2
                type: fill_in_blank
                text: "Fill the gaps: socks_ shoes_ boots and wellies"
                say: "Which mark goes in each gap in this list?"
                frame: "socks_ shoes_ boots and wellies"
                options: [",", ".", "?"]
                answer: [",", ","]
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Which list is written correctly?"
                say: "Read the lists yourself. Which one has the commas in the right places?"
                options: ["frogs, toads and newts", "frogs, toads, and newts", "frogs toads, and newts"]
                answer: "frogs, toads and newts"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Is it true? \"milk, juice and water\" is written correctly."
                answer: true
              - id: l1-n5
                type: sorting
                text: "Sort the lists."
                say: "Read each list. Is it punctuated right or wrong?"
                option_audio: false
                bins:
                  - { id: right, show: { text: "right" }, say: "Right." }
                  - { id: wrong, show: { text: "wrong" }, say: "Wrong." }
                options:
                  - { text: "bees, ants and flies", bin: right }
                  - { text: "bees ants, and flies", bin: wrong }
                  - { text: "Ali, Ben and Cara", bin: right }
                  - { text: "Ali, Ben, and, Cara", bin: wrong }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Fill the gaps: bats_ balls_ nets and hoops"
            say: "Which mark goes in each gap in this list?"
            frame: "bats_ balls_ nets and hoops"
            options: [",", ".", "?"]
            answer: [",", ","]
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Is it true? \"pigs, cows, and sheep\" is written correctly."
            answer: false
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the word that needs a comma after it."
            say: "One comma is missing from this list. Tap the word that needs a comma after it."
            show: { drawn: letter-card, text: "spoons forks, knives and cups" }
            spans: ["spoons"]
          - id: l1-c4
            type: multiple_choice
            text: "How many commas does this list need?\nants bees wasps and flies"
            say: "Read the list yourself. How many commas does it need?"
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c5
            type: multiple_choice
            text: "Which list is written correctly?"
            say: "Read the lists yourself. Which one has the commas in the right places?"
            options: ["boats, trains, and planes", "boats, trains and planes", "boats and, trains and planes"]
            answer: "boats, trains and planes"
            option_audio: false
          - id: l1-c6
            type: sorting
            text: "Is each list right or wrong? Sort them."
            say: "Read each list yourself. Is it punctuated right or wrong? Sort them."
            option_audio: false
            bins:
              - { id: right, show: { text: "right" }, say: "Right." }
              - { id: wrong, show: { text: "wrong" }, say: "Wrong." }
            options:
              - { text: "hens ducks, and geese", bin: wrong }
              - { text: "Jo, Max and Fin", bin: right }
              - { text: "hens, ducks and geese", bin: right }
              - { text: "Jo, Max, and Fin", bin: wrong }

  - n: 2
    title: { de: Längere Aufzählungen in Sätzen, en: Longer lists in sentences }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Fill the gaps: cats_ dogs_ mice and rats"
            say: "Which mark goes in each gap in this list?"
            frame: "cats_ dogs_ mice and rats"
            options: [",", ".", "?"]
            answer: [",", ","]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? \"tea, coffee, and milk\" is written correctly."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "a red hat, a warm scarf and some gloves"
            say: "Sometimes each thing in the list is more than one word: a red hat. A red hat is one thing, so no comma goes inside it. The comma goes after the whole thing."
            show: { drawn: letter-card, text: "a red hat, a warm scarf and some gloves" }
          - text: "In my bag I have a book, an apple, a pencil and my coat."
            say: "Here is a list in a sentence. A capital letter at the start, commas between the things, the word and before the last thing, and a full stop at the end."
          - text: "We ran, jumped, skipped and hopped."
            say: "A list can be of verbs too. Ran, jumped, skipped and hopped. The same rule works."
          - text: "Find each thing. Put a comma after it."
            say: "Read the list. Find where each thing ends. Put a comma there, but not before and."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Fill the gaps: I packed a towel_ a bucket_ a spade and my hat."
                say: "Which mark goes in each gap?"
                frame: "I packed a towel_ a bucket_ a spade and my hat."
                options: [",", ".", "?"]
                answer: [",", ","]
                option_audio: false
                hints:
                  - "Find the things in the list."
                  - "A towel, a bucket, a spade and my hat. A comma after each, except before and."
                  - "A comma in both gaps."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which sentence is written correctly?"
                say: "Read the sentences yourself. Which one has the commas in the right places?"
                options: ["I saw a big dog, a tiny cat and a fat pig.", "I saw a big, dog, a tiny, cat and a fat pig.", "I saw a big dog a tiny cat, and a fat pig."]
                answer: "I saw a big dog, a tiny cat and a fat pig."
                option_audio: false
                feedback:
                  "I saw a big, dog, a tiny, cat and a fat pig.": "A big dog is one thing, so no comma goes inside it."
                hints:
                  - "What are the things in the list?"
                  - "A big dog, a tiny cat and a fat pig. No comma inside a thing."
                  - "I saw a big dog, a tiny cat and a fat pig."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the word that needs a comma after it."
                say: "One comma is missing. Tap the word that needs a comma after it."
                show: { drawn: letter-card, text: "We had soup, fish pie, jelly and ice cream." }
                spans: ["pie"]
                hints:
                  - "Fish pie is one thing."
                  - "Where does fish pie end?"
                  - "pie"
              - id: l2-f4
                type: fill_in_blank
                text: "Fill the gaps: The children sang_ danced_ clapped and cheered_"
                say: "Which mark goes in each gap? Look at the end of the sentence too."
                frame: "The children sang_ danced_ clapped and cheered_"
                options: [",", ".", "?"]
                answer: [",", ",", "."]
                option_audio: false
                hints:
                  - "There are three gaps. The last one ends the sentence."
                  - "Commas between the verbs; a sentence ends with a full stop."
                  - "Comma, comma, full stop."
              - id: l2-f5
                type: true_false
                text: "Is it true? \"Gran grows carrots, peas and beans.\" is written correctly."
                answer: true
                hints:
                  - "Check the capital letter and the full stop."
                  - "Check the commas: one between carrots and peas, none before and."
                  - "Yes, it is right."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Fill the gaps: At the zoo we saw a lion_ a zebra_ a snake and a giraffe."
                say: "Which mark goes in each gap?"
                frame: "At the zoo we saw a lion_ a zebra_ a snake and a giraffe."
                options: [",", ".", "!"]
                answer: [",", ","]
                option_audio: false
                hints: ["Commas between the animals."]
              - id: l2-s2
                type: true_false
                text: "Is it true? \"We need flour, eggs, and sugar.\" is written correctly."
                answer: false
                hints: ["Look just before and."]
              - id: l2-s3
                type: multiple_choice
                text: "Which sentence is written correctly?"
                say: "Read the sentences yourself. Which one has the commas in the right places?"
                options: ["Kai has a blue kite, a yellow ball and a toy car.", "Kai has a blue, kite, a yellow, ball and a toy car.", "Kai has a blue kite a yellow ball, and a toy car."]
                answer: "Kai has a blue kite, a yellow ball and a toy car."
                option_audio: false
                hints: ["A blue kite is one thing."]
              - id: l2-s4
                type: highlight_in_text
                text: "Tap the word that needs a comma after it."
                say: "One comma is missing. Tap the word that needs a comma after it."
                show: { drawn: letter-card, text: "Mia swam, dived splashed and floated." }
                spans: ["dived"]
                hints: ["Check the gap after each verb."]
              - id: l2-s5
                type: ordering
                text: "Put the list in order."
                say: "Put the cards in order to make a list. Look at the comma and the word and."
                options: ["a dog", "and a fish", "a cat,"]
                slot_count: 3
                answer: ["a cat,", "a dog", "and a fish"]
                option_audio: false
                hints: ["The thing with the comma comes first; and comes before the last thing."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Fill the gaps: For lunch I had a sandwich_ a pear_ some crisps and a drink."
                say: "Which mark goes in each gap?"
                frame: "For lunch I had a sandwich_ a pear_ some crisps and a drink."
                options: [",", ".", "?"]
                answer: [",", ","]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Which sentence is written correctly?"
                say: "Read the sentences yourself. Which one has the commas in the right places?"
                options: ["I like hot chips, cold milk and sweet apples.", "I like hot, chips, cold, milk and sweet apples.", "I like hot chips, cold milk, and sweet apples."]
                answer: "I like hot chips, cold milk and sweet apples."
                option_audio: false
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the word that needs a comma after it."
                say: "One comma is missing. Tap the word that needs a comma after it."
                show: { drawn: letter-card, text: "Pack your coat, your hat your gloves and your scarf." }
                spans: ["hat"]
              - id: l2-n4
                type: true_false
                text: "Is it true? \"Ben read, wrote, and drew.\" is written correctly."
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Fill the gaps: We went to the shop_ the park_ the library and home_"
                say: "Which mark goes in each gap? Look at the end of the sentence too."
                frame: "We went to the shop_ the park_ the library and home_"
                options: [",", ".", "?"]
                answer: [",", ",", "."]
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: in-sentence
            type: fill_in_blank
            text: "Fill the gaps: Our class has a hamster_ two fish_ a frog and a stick insect."
            say: "Which mark goes in each gap?"
            frame: "Our class has a hamster_ two fish_ a frog and a stick insect."
            options: [",", ".", "?"]
            answer: [",", ","]
            option_audio: false
          - id: l2-c2
            part: no-comma-and
            type: true_false
            text: "Is it true? \"We played tag, football, and catch.\" is written correctly."
            answer: false
          - id: l2-c3
            part: longer-items
            type: multiple_choice
            text: "Which sentence is written correctly?"
            say: "Read the sentences yourself. Which one has the commas in the right places?"
            options: ["Dad bought a green tent, a small stove and two torches.", "Dad bought a green, tent, a small, stove and two torches.", "Dad bought a green tent a small stove, and two torches."]
            answer: "Dad bought a green tent, a small stove and two torches."
            option_audio: false
          - id: l2-c4
            part: in-sentence
            type: highlight_in_text
            text: "Tap the word that needs a comma after it."
            say: "One comma is missing. Tap the word that needs a comma after it."
            show: { drawn: letter-card, text: "I can hop, skip jump and run." }
            spans: ["skip"]
          - id: l2-c5
            part: single-items
            type: multiple_choice
            text: "Which list uses commas the right way?"
            say: "Read the lists yourself. Which one is right?"
            options: ["shells, stones, sand and seaweed", "shells and stones and sand and seaweed", "shells, stones, sand, and, seaweed"]
            answer: "shells, stones, sand and seaweed"
            option_audio: false
          - id: l2-c6
            part: single-items
            type: fill_in_blank
            text: "Fill the gaps: crayons_ paints_ glue _ paper"
            say: "Which mark or word goes in each gap in this list?"
            frame: "crayons_ paints_ glue _ paper"
            options: [",", "and", "."]
            answer: [",", ",", "and"]
            option_audio: false
          - id: l2-c7
            part: single-items
            type: highlight_in_text
            text: "Tap every word that needs a comma after it."
            say: "Two commas are missing from this list. Tap every word that needs a comma after it."
            show: { drawn: letter-card, text: "rice beans peas and corn" }
            spans: ["rice", "beans"]
          - id: l2-c8
            part: single-items
            type: multiple_choice
            text: "How many commas does this list need?\nmilk bread butter cheese and eggs"
            say: "Read the list yourself. How many commas does it need?"
            options: ["2", "3", "4"]
            answer: "3"
          - id: l2-c9
            part: single-items
            type: true_false
            text: "Is it true? This list needs one more comma.\nTom, Ella Sam and Priya"
            say: "Read the list. Is it true? It needs one more comma."
            answer: true
          - id: l2-c10
            part: no-comma-and
            type: highlight_in_text
            text: "Tap the word that should not have a comma after it."
            say: "One comma in this list is wrong. Tap the word that should not have a comma after it."
            show: { drawn: letter-card, text: "red, green, blue, and pink" }
            spans: ["blue"]
          - id: l2-c11
            part: no-comma-and
            type: multiple_choice
            text: "Where does the word and go in a list?"
            options: ["before the last thing", "after the first thing", "between every thing"]
            answer: "before the last thing"
          - id: l2-c12
            part: no-comma-and
            type: fill_in_blank
            text: "Fill the gap to finish the list: owls, bats _ moths"
            say: "Which word or mark goes in the gap to finish the list?"
            frame: "owls, bats _ moths"
            options: [",", "and", "."]
            answer: ["and"]
            option_audio: false
          - id: l2-c13
            part: no-comma-and
            type: true_false
            text: "Is it true? In a list, you put a comma just before the word and."
            say: "Is it true? In a list, you put a comma just before the word and."
            answer: false
          - id: l2-c14
            part: longer-items
            type: highlight_in_text
            text: "Tap every word that needs a comma after it."
            say: "Two commas are missing. Tap every word that needs a comma after it."
            show: { drawn: letter-card, text: "Gran knitted a long scarf a woolly hat a pair of socks and a jumper." }
            spans: ["scarf", "hat"]
          - id: l2-c15
            part: longer-items
            type: true_false
            text: "Is it true? This sentence needs a comma after red.\nI ate a cheese sandwich, a red apple and a yoghurt."
            say: "Read the sentence. Is it true? It needs a comma after red."
            answer: false
          - id: l2-c16
            part: longer-items
            type: fill_in_blank
            text: "Fill the gaps: We took a big rug_ a basket of food _ a ball_"
            say: "Which mark or word goes in each gap?"
            frame: "We took a big rug_ a basket of food _ a ball_"
            options: [",", "and", "."]
            answer: [",", "and", "."]
            option_audio: false
          - id: l2-c17
            part: longer-items
            type: ordering
            text: "Put the cards in order to make the sentence."
            say: "Put the cards in order to make the sentence."
            options: ["and a party hat.", "a chocolate cake", "Ella got a pink balloon,"]
            slot_count: 3
            answer: ["Ella got a pink balloon,", "a chocolate cake", "and a party hat."]
            option_audio: false
          - id: l2-c18
