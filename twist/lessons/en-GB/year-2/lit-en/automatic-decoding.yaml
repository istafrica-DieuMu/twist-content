                text: "Tap the word that does not fit."
                say: "Read the sentence. Tap the word that does not make sense."
                show: { drawn: letter-card, text: "We play football in the bath" }
                spans: ["bath"]
                hints: ["Where do we play football?"]
              - id: l2-s4
                type: image_multiple_choice
                text: "The boy can swim fast."
                say: "Read the sentence. Tap the picture it is about."
                options: [{ object: swim }, { object: ride-bike }, { object: dance }]
                answer: swim
                hints: ["What can the boy do?"]
              - id: l2-s5
                type: true_false
                text: "The kite is under the sea."
                say: "Read the sentence. Does it make sense?"
                answer: false
                hints: ["Where does a kite fly?"]
              - id: l2-s6
