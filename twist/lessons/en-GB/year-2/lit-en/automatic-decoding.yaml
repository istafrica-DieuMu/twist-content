  - n: 2
    title: { de: Sätze flüssig lesen, en: Reading sentences fluently }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Read the word quickly. Tap the picture."
            say: "The word is shown for a moment. Read it, then tap its picture."
            show: { drawn: letter-card, text: "boat", flash: 2 }
            options: [{ object: boat }, { object: book }, { object: bus }]
            answer: boat
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? Cake and rain have the same ay sound."
            say: "Read the two words in the sentence. Is it true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The snail is slow."
            say: "Read a sentence in one go, as if you were talking. The snail is slow."
            show: { object: snail }
          - text: "The goat can fly."
            say: "When you read smoothly, you notice when something is silly. A goat cannot fly! Fluent readers think about the meaning as they read."
            show: { object: goat }
          - text: "The boat is on the cake."
            say: "Here one word does not fit: a boat goes on the sea, not on a cake. Finding the odd word shows you really read the sentence."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "The bird is in the tree."
                say: "Read the sentence. Tap the picture it is about."
                options: [{ object: bird }, { object: bread }, { object: bee }]
                answer: bird
                hints:
                  - "Who is in the tree?"
                  - "The bird."
                  - "Tap the bird."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "The whale can ride a bike."
                say: "Read the sentence. Does it make sense?"
                answer: false
                hints:
                  - "Can a whale ride a bike?"
                  - "Whales swim in the sea."
                  - "No, it is silly."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the word that does not fit."
                say: "Read the sentence. Tap the word that does not make sense."
                show: { drawn: letter-card, text: "I eat cake with a sock" }
                spans: ["sock"]
                hints:
                  - "What do you eat cake with?"
                  - "A fork or a spoon, not a sock."
                  - "Sock does not fit."
              - id: l2-f4
                type: image_multiple_choice
                text: "The girl paints a rose."
                say: "Read the sentence. Tap the picture it is about."
                options: [{ object: paint }, { object: read }, { object: sing }]
                answer: paint
                hints:
                  - "What does the girl do?"
                  - "She paints."
                  - "Tap the child painting."
              - id: l2-f5
                type: true_false
                text: "The snowman is made of snow."
                say: "Read the sentence. Does it make sense?"
                answer: true
                hints:
                  - "What is a snowman made of?"
                  - "Snow."
                  - "Yes."
              - id: l2-f6
                type: highlight_in_text
                text: "Tap the word that does not fit."
                say: "Read the sentence. Tap the word that does not make sense."
                show: { drawn: letter-card, text: "The cow says moo and can fly" }
                spans: ["fly"]
                hints:
                  - "Read it smoothly. What is silly?"
                  - "Cows say moo, but can they fly?"
                  - "Fly does not fit."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "The clown has a red nose."
                say: "Read the sentence. Tap the picture it is about."
                options: [{ object: clown }, { object: cloud }, { object: clock }]
                answer: clown
                hints: ["Who has a red nose?"]
              - id: l2-s2
                type: true_false
                text: "A cloud is in the sky."
                say: "Read the sentence. Does it make sense?"
                answer: true
                hints: ["Where are clouds?"]
              - id: l2-s3
