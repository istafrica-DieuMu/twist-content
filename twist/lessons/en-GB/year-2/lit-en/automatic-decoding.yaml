                answer: clown
              - id: l1-n3
                type: multiple_choice
                text: "Which words have the same middle sound?"
                say: "Which pair of words has the same middle sound? Read them yourself."
                options: ["leaf and tree", "leaf and bread", "tree and ten"]
                answer: "leaf and tree"
                option_audio: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Read the word quickly. Tap the picture."
                say: "The word is shown for a moment. Read it, then tap its picture."
                show: { drawn: letter-card, text: "rose", flash: 1.5 }
