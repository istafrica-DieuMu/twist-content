# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.automatic-decoding
skill: lit-en.word-reading.automatic-decoding
curriculum: en-GB
language: en
title:
  de: Wörter flüssig lesen
  en: Reading words fluently
summary: >
  Year 2 reading moves from sounding out to reading words at a glance,
  including words with alternative spellings of a sound (rain, play,
  cake). Lesson 1 reads words shown for a moment and finds their pictures;
  lesson 2 reads short sentences fast and spots the word that does not fit,
  and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Wörter lesen, en: Reading words }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.phonics.alternative-pronunciations]
  also_practises: [lit-en.phonics.new-graphemes, lit-en.phonics.split-digraphs]
  vocabulary: { en: [read, word, sentence, quickly, sound out] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: glance, what: { de: ein Wort auf einen Blick lesen und sein Bild finden, en: reading a word at a glance and finding its picture } }
    - { id: same-sound, what: { de: denselben Laut in verschiedenen Schreibweisen erkennen, en: spotting the same sound in different spellings } }
    - { id: sentence-meaning, what: { de: einen Satz flüssig lesen und verstehen, en: reading a sentence fluently and understanding it } }
    - { id: odd-word, what: { de: "das Wort finden, das nicht in den Satz passt", en: "finding the word that does not fit a sentence" } }
  misconceptions:
    - id: always-sound-out
      what: Sounds out every word, even familiar ones, and loses the meaning of the sentence
      addressed: words flash for a moment, so the child learns to see them whole; Learn says to sound out only words they do not know
    - id: same-sound-spellings
      what: Thinks a sound has only one spelling (ay always written ay)
      addressed: lesson 1 Learn sets rain, play and cake side by side
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Auf einen Blick, en: At a glance }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "kite" }
            options: [{ object: kite }, { object: cat }, { object: knife }]
            answer: kite
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "cloud" }
            options: [{ object: cloud }, { object: clown }, { object: clock }]
            answer: cloud
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "rain   play   cake"
            say: "These three words have the same sound, ay, spelt three ways: a i in rain, a y in play, and a, then a letter, then e, in cake."
          - text: "snail"
            say: "Good readers see a word they know and read it straight away, without sounding out every letter. Look at this word for a moment. Snail."
            show: { drawn: letter-card, text: "snail", flash: 2 }
          - text: "Sound out only new words"
            say: "If you do not know a word, sound it out. If you know it, read it in one go. Then you can think about what the sentence means."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Read the word quickly. Tap the picture."
                say: "The word is shown for a moment. Read it, then tap its picture."
                show: { drawn: letter-card, text: "snake", flash: 2 }
                options: [{ object: snake }, { object: snail }, { object: star }]
                answer: snake
                hints:
                  - "Tap See it again and look at the whole word."
                  - "It has a-e in the middle: sn ... ay ... k."
                  - "Snake."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Read the word quickly. Tap the picture."
                say: "The word is shown for a moment. Read it, then tap its picture."
                show: { drawn: letter-card, text: "boat", flash: 2 }
                options: [{ object: bed }, { object: boat }, { object: bus }]
                answer: boat
                hints:
                  - "Look at the middle letters."
                  - "o and a say oh."
                  - "Boat."
              - id: l1-f3
                type: multiple_choice
                text: "Which words have the same middle sound?"
                say: "Which pair of words has the same middle sound? Read them yourself."
                options: ["rain and cake", "rain and ran", "cake and cat"]
                answer: "rain and cake"
                option_audio: false
                hints:
                  - "Say each word in your head."
                  - "ai and a-e both say ay."
                  - "Rain and cake."
              - id: l1-f4
                type: image_multiple_choice
                text: "Read the word quickly. Tap the picture."
                say: "The word is shown for a moment. Read it, then tap its picture."
                show: { drawn: letter-card, text: "whale", flash: 2 }
                options: [{ object: whale }, { object: snail }, { object: shell }]
                answer: whale
                hints:
                  - "It starts with wh."
                  - "wh ... ay ... l."
                  - "Whale."
              - id: l1-f5
                type: true_false
                text: "Is it true? Tray and train have the same ay sound."
                say: "Read the two words in the sentence. Is it true?"
                answer: true
                hints:
                  - "Read both words."
                  - "ay in tray, ai in train."
                  - "Yes, both say ay."
              - id: l1-f6
                type: image_multiple_choice
                text: "Read the word quickly. Tap the picture."
                say: "The word is shown for a moment. Read it, then tap its picture."
                show: { drawn: letter-card, text: "goat", flash: 2 }
                options: [{ object: goat }, { object: duck }, { object: girl }]
                answer: goat
