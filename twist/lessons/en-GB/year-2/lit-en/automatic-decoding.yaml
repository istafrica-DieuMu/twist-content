                text: "Tap the word that does not fit."
                say: "Read the sentence. Tap the word that does not make sense."
                show: { drawn: letter-card, text: "The snake eats with a spoon" }
                spans: ["spoon"]
                hints: ["Does a snake use a spoon?"]

          - support: none
