# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.writing-purposes
skill: lit-en.composition.purposes
curriculum: en-GB
language: en
title:
  de: Für verschiedene Zwecke schreiben
  en: Writing for different purposes
summary: >
  We write in different ways for different jobs. Lesson 1 takes lists
  (short items, one under the other) and labels (a word or two that name
  part of a picture), and choosing which kind of writing a job needs;
  lesson 2 takes instructions (numbered steps that start with a bossy
  verb) and letters (Dear ..., a friendly message, Love from ...), and
  ends with the skill check. The skill check marks choosing and shaping
  the kind of writing; writing a whole text freely is for Practise and
  waits for a free-writing task type.
metadata:
  year: year-2
  topic: { de: Texte schreiben, en: Writing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.composition.real-events]
  also_practises: []
  vocabulary: { en: [purpose, list, label, instructions, letter, recount, bossy verb, step, Dear, Love from] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: choose, what: { de: die passende Textart für einen Zweck wählen, en: choosing the kind of writing a job needs } }
    - { id: lists-labels, what: { de: Listen und Beschriftungen, en: lists and labels } }
    - { id: instructions, what: { de: "Anleitungen: Schritte in Reihenfolge mit Aufforderungsverb", en: "instructions: steps in order with a bossy verb" } }
    - { id: letters, what: { de: "Briefe: Anrede, Nachricht und Gruß", en: "letters: Dear, the message and Love from" } }
  misconceptions:
    - id: one-way-to-write
      what: Writes every text as a story (Once upon a time, I needed some eggs)
      addressed: Lesson 1 Learn screen 1 matches jobs to kinds of writing; l1-f1, l1-s5, l1-n1, l2-c1
    - id: label-as-sentence
      what: Writes a whole sentence as a label, or a list as one long sentence
      addressed: Lesson 1 Learn screens 2 and 3; feedback in l1-f3; l1-s3, l1-n3
    - id: steps-out-of-order
      what: Writes instruction steps in the wrong order or without bossy verbs (You might get a cup)
      addressed: Lesson 2 Learn screen 1; feedback in l2-f2; l2-f1, l2-s1, l2-n1, l2-c3
    - id: letter-no-greeting
      what: Leaves out the greeting and sign-off of a letter
      addressed: Lesson 2 Learn screen 2; l2-f4, l2-s4, l2-n4, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Listen und Beschriftungen, en: Lists and labels }
    goal:
      de: "Wähl die passende Schreibart, eine Liste für die Reise oder eine Beschriftung für den Rüssel eines Elefanten."
      en: "Choose the right kind of writing, like a list for a trip or a label for an elephant's trunk."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Put the recount in order."
            say: "Lily wrote about her trip to the farm. Put her sentences in order."
            options: ["Then we fed the goats.", "First we got on the bus.", "At the end we went home."]
            slot_count: 3
            answer: ["First we got on the bus.", "Then we fed the goats.", "At the end we went home."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "A recount tells about something that really happened. Which is a recount?"
            say: "Read them yourself. Which one tells about something that really happened?"
            options: ["Yesterday I went to the dentist.", "Once upon a time a dragon flew to the moon.", "Mix the flour and the eggs."]
            answer: "Yesterday I went to the dentist."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "a list: to remember things\na label: to name parts of a picture\ninstructions: to tell how to do something\na letter: to send a message to someone"
            say: "We write for different jobs. The job is called the purpose. Each purpose has its own kind of writing."
          - text: "Shopping list\neggs\nmilk\nbread\napples"
            say: "A list helps you remember things. Each item is short and goes on its own line. A list has a title so you know what it is for."
            show: { object: egg }
          - text: "head   wing   beak   tail"
            say: "A label names one part of a picture. It is just a word or two, with a line to the part. A label is not a sentence."
            show: { object: bird }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "You need to remember what to pack for a trip. What should you write?"
                say: "Read the question. What kind of writing should you do?"
                options: ["a list", "a letter", "a story"]
                answer: "a list"
                hints:
                  - "What is the job? To remember things."
                  - "Which kind of writing helps you remember things?"
                  - "a list"
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Match each job with the writing it needs."
                say: "Read each job. Match it with the kind of writing it needs."
                pairs:
                  - { left: { text: "name the parts of a plant" }, right: { text: "labels" } }
                  - { left: { text: "remember what to buy" }, right: { text: "a list" } }
                  - { left: { text: "say thank you to Gran" }, right: { text: "a letter" } }
                hints:
                  - "Think about the job each writing does."
                  - "Labels name parts. A list helps you remember. A letter sends a message."
                  - "plant parts: labels; what to buy: a list; thank Gran: a letter."
              - id: l1-f3
                type: multiple_choice
                text: "Which is a good label for the elephant's trunk?"
                say: "Read them yourself. Which one is a good label?"
                show: { object: elephant }
                options: ["trunk", "This is the long trunk that the elephant uses to drink water.", "Once upon a time"]
                answer: "trunk"
                option_audio: false
                feedback:
                  "This is the long trunk that the elephant uses to drink water.": "That is a whole sentence. A label is just a word or two."
                hints:
                  - "A label is short."
                  - "It names the part in a word or two."
                  - "trunk"
              - id: l1-f4
                type: sorting
                text: "Which belong on a shopping list?"
                say: "Read each one. Does it belong on a shopping list?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "on the list" }, say: "On the list." }
                  - { id: no, show: { text: "not on the list" }, say: "Not on the list." }
                options:
                  - { text: "cheese", bin: yes }
                  - { text: "bananas", bin: yes }
                  - { text: "Dear Sam,", bin: no }
                  - { text: "Once upon a time", bin: no }
                hints:
                  - "A shopping list has things to buy."
                  - "Can you buy it in a shop?"
                  - "cheese and bananas go on the list."
              - id: l1-f5
                type: true_false
                text: "Is it true? In a list, each item goes on its own line."
                answer: true
                hints:
                  - "Think of a shopping list."
                  - "Eggs, milk and bread each had their own line."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "You want to show the parts of a bike. What should you write?"
                say: "Read the question. What kind of writing should you do?"
                options: ["labels", "a letter", "instructions"]
                answer: "labels"
                hints: ["The job is to name parts of a picture."]
              - id: l1-s2
                type: sorting
                text: "Which belong on a list of pets?"
                say: "Read each one. Does it belong on a list of pets?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "on the list" }, say: "On the list." }
                  - { id: no, show: { text: "not on the list" }, say: "Not on the list." }
                options:
                  - { text: "rabbit", bin: yes }
                  - { text: "hamster", bin: yes }
                  - { text: "table", bin: no }
                  - { text: "Love from Ali", bin: no }
                hints: ["Is it a pet?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which is a good label for the fish's fin?"
                say: "Read them yourself. Which one is a good label?"
                show: { object: fish }
                options: ["fin", "The fish has a fin and it swims.", "fish fin water sea"]
                answer: "fin"
                option_audio: false
                hints: ["A label names one part."]
              - id: l1-s4
                type: true_false
                text: "Is it true? A label should be a long sentence."
                answer: false
                hints: ["How many words does a label have?"]
              - id: l1-s5
                type: matching
                text: "Match each job with the writing it needs."
                say: "Read each job. Match it with the kind of writing it needs."
                pairs:
                  - { left: { text: "tell how to make a sandwich" }, right: { text: "instructions" } }
                  - { left: { text: "invite a friend to a party" }, right: { text: "a letter" } }
                  - { left: { text: "remember jobs to do" }, right: { text: "a list" } }
                hints: ["How to do something is instructions."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "You want to tell your teacher what you need for a cake. What should you write?"
                say: "Read the question. What kind of writing should you do?"
                options: ["a list", "labels", "a story"]
                answer: "a list"
              - id: l1-n2
                type: sorting
                text: "Which belong on a list of fruit?"
                say: "Read each one. Does it belong on a list of fruit?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "on the list" }, say: "On the list." }
                  - { id: no, show: { text: "not on the list" }, say: "Not on the list." }
                options:
                  - { text: "pear", bin: yes }
                  - { text: "orange", bin: yes }
                  - { text: "carrot", bin: no }
                  - { text: "Mix it well.", bin: no }
              - id: l1-n3
                type: multiple_choice
                text: "Which is a good label for the giraffe's neck?"
                say: "Read them yourself. Which one is a good label?"
                show: { object: giraffe }
                options: ["neck", "The giraffe has a very long neck.", "Dear giraffe,"]
                answer: "neck"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Is it true? A list has a title to show what it is for."
                answer: true
              - id: l1-n5
                type: matching
                text: "Match each job with the writing it needs."
                say: "Read each job. Match it with the kind of writing it needs."
                pairs:
                  - { left: { text: "name the parts of a car" }, right: { text: "labels" } }
                  - { left: { text: "tell how to plant a seed" }, right: { text: "instructions" } }
                  - { left: { text: "write to a pen pal" }, right: { text: "a letter" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "You want to name the parts of a flower. What should you write?"
            say: "Read the question. What kind of writing should you do?"
            options: ["labels", "a list", "a letter"]
            answer: "labels"
          - id: l1-c2
            type: multiple_choice
            text: "Which is a good label for the rabbit's ear?"
            say: "Read them yourself. Which one is a good label?"
            show: { object: rabbit }
            options: ["ear", "The rabbit can hear with its big ear.", "rabbit, carrot, grass"]
            answer: "ear"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? You write a letter to remember what to buy."
            answer: false
          - id: l1-c4
            type: true_false
            text: "Is it true? A shopping list is written as one long sentence."
            answer: false
          - id: l1-c5
            type: matching
            text: "Which writing does each job need? Match them."
            say: "Read each job yourself. Tap a job, then tap the writing it needs."
            pairs:
              - { left: { text: "name the parts of a boat" }, right: { text: "labels" } }
              - { left: { text: "remember what to pack" }, right: { text: "a list" } }
              - { left: { text: "ask a friend to come to tea" }, right: { text: "a letter" } }
          - id: l1-c6
            type: multiple_choice
            text: "Which one is written as a list?"
            say: "Read them yourself. Which one is written as a list?"
            options: ["Picnic list\nsandwiches\napples\njuice", "For the picnic we need sandwiches and apples and juice."]
            answer: "Picnic list\nsandwiches\napples\njuice"
            option_audio: false

  - n: 2
    title: { de: Anleitungen und Briefe, en: Instructions and letters }
    goal:
      de: "Bring die Schritte einer Anleitung in Reihenfolge, wie beim Händewaschen, und fang einen Brief mit Dear an."
      en: "Put the steps of instructions in order, like how to wash your hands, and start a letter with Dear."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "You want to remember what to take swimming. What should you write?"
            say: "Read the question. What kind of writing should you do?"
            options: ["a list", "labels", "a letter"]
            answer: "a list"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is a good label for the cat's tail?"
            say: "Read them yourself. Which one is a good label?"
            show: { object: cat }
            options: ["tail", "My cat has a long fluffy tail.", "cat, milk, bed"]
            answer: "tail"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "How to make toast\n1. Put the bread in the toaster.\n2. Push the lever down.\n3. Wait for it to pop up.\n4. Spread on some butter."
            say: "Instructions tell you how to do something. They have a title that starts with How to. The steps are numbered and in order. Each step starts with a bossy verb: put, push, wait, spread."
            show: { object: bread }
          - text: "Dear Grandpa,\nThank you for my birthday present. I love the book!\nLove from Maya"
            say: "A letter sends a message to someone. It starts with Dear and their name. Then comes the message. It ends with Love from, or From, and your name."
          - text: "Who is it for? What is it for?"
            say: "Before you write, ask: who is it for, and what is it for? That tells you what kind of writing to use."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "How to wash your hands. Put the steps in order."
                say: "How to wash your hands. Put the steps in order."
                options: ["Dry your hands.", "Wet your hands.", "Rub on some soap."]
                slot_count: 3
                answer: ["Wet your hands.", "Rub on some soap.", "Dry your hands."]
                option_audio: false
                hints:
                  - "What do you do first?"
                  - "You wet your hands before soap. You dry them last."
                  - "Wet, rub on soap, dry."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which is the best step for instructions?"
                say: "Read them yourself. Which one is the best step for instructions?"
                options: ["Pour the milk into a cup.", "I poured the milk into a cup.", "Milk is white."]
                answer: "Pour the milk into a cup."
                option_audio: false
                feedback:
                  "I poured the milk into a cup.": "That tells what you did, like a recount. A step starts with a bossy verb: Pour."
                hints:
                  - "A step tells someone what to do."
                  - "It starts with a bossy verb."
                  - "Pour the milk into a cup."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the bossy verb."
                say: "Read the step. Tap the bossy verb that tells you what to do."
                show: { drawn: letter-card, text: "Cut the paper in half." }
                spans: ["Cut"]
                hints:
                  - "A bossy verb tells you what to do."
                  - "It comes at the start of the step."
                  - "Cut"
              - id: l2-f4
                type: multiple_choice
                text: "How should a letter to your friend Ben start?"
                say: "Read them yourself. How should the letter start?"
                options: ["Dear Ben,", "Love from Ben", "1. Ben"]
                answer: "Dear Ben,"
                option_audio: false
                hints:
                  - "A letter starts with a greeting."
                  - "The greeting is Dear and the name."
                  - "Dear Ben,"
              - id: l2-f5
                type: sorting
                text: "Instructions or letter?"
                say: "Read each part. Does it come from instructions or from a letter?"
                option_audio: false
                bins:
                  - { id: instr, show: { text: "instructions" }, say: "Instructions." }
                  - { id: letter, show: { text: "letter" }, say: "Letter." }
                options:
                  - { text: "How to plant a seed", bin: instr }
                  - { text: "2. Water the soil.", bin: instr }
                  - { text: "Dear Aunty Jo,", bin: letter }
                  - { text: "Love from Kim", bin: letter }
                hints:
                  - "Which ones have How to or a number?"
                  - "Dear and Love from belong to a letter."
                  - "How to and the numbered step are instructions; Dear and Love from are a letter."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "How to brush your teeth. Put the steps in order."
                say: "How to brush your teeth. Put the steps in order."
                options: ["Brush for two minutes.", "Squeeze toothpaste on the brush.", "Rinse your mouth."]
                slot_count: 3
                answer: ["Squeeze toothpaste on the brush.", "Brush for two minutes.", "Rinse your mouth."]
                option_audio: false
                hints: ["You need toothpaste before you brush."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap the bossy verb."
                say: "Read the step. Tap the bossy verb that tells you what to do."
                show: { drawn: letter-card, text: "Stir the soup slowly." }
                spans: ["Stir"]
                hints: ["It is the first word."]
              - id: l2-s3
                type: true_false
                text: "Is it true? Instructions should have numbered steps in order."
                answer: true
                hints: ["Think of how to make toast."]
              - id: l2-s4
                type: multiple_choice
                text: "How should Maya end her letter?"
                say: "Read them yourself. How should Maya end her letter?"
                options: ["Love from Maya", "Dear Maya,", "How to Maya"]
                answer: "Love from Maya"
                option_audio: false
                hints: ["A letter ends with a sign-off and your name."]
              - id: l2-s5
                type: multiple_choice
                text: "Which is the best step for instructions?"
                say: "Read them yourself. Which one is the best step for instructions?"
                options: ["Fold the paper in half.", "The paper was folded.", "I like paper."]
                answer: "Fold the paper in half."
                option_audio: false
                hints: ["Look for the bossy verb at the start."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "How to make a jam sandwich. Put the steps in order."
                say: "How to make a jam sandwich. Put the steps in order."
                options: ["Put the other bread on top.", "Take two slices of bread.", "Spread jam on one slice."]
                slot_count: 3
                answer: ["Take two slices of bread.", "Spread jam on one slice.", "Put the other bread on top."]
                option_audio: false
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the bossy verb."
                say: "Read the step. Tap the bossy verb that tells you what to do."
                show: { drawn: letter-card, text: "Glue the eyes on the mask." }
                spans: ["Glue"]
              - id: l2-n3
                type: multiple_choice
                text: "Which title is best for instructions?"
                say: "Read them yourself. Which title is best for instructions?"
                options: ["How to feed a goldfish", "My goldfish", "Dear goldfish,"]
                answer: "How to feed a goldfish"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? A letter starts with Love from."
                answer: false
              - id: l2-n5
                type: sorting
                text: "Instructions or letter?"
                say: "Read each part. Does it come from instructions or from a letter?"
                option_audio: false
                bins:
                  - { id: instr, show: { text: "instructions" }, say: "Instructions." }
                  - { id: letter, show: { text: "letter" }, say: "Letter." }
                options:
                  - { text: "1. Fill the pot with soil.", bin: instr }
                  - { text: "How to make a kite", bin: instr }
                  - { text: "Dear Mr Lee,", bin: letter }
                  - { text: "I hope you are well.", bin: letter }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: choose
            type: multiple_choice
            text: "You want to tell a friend how to play your new game. What should you write?"
            say: "Read the question. What kind of writing should you do?"
            options: ["instructions", "a list", "labels"]
            answer: "instructions"
          - id: l2-c2
            part: lists-labels
            type: multiple_choice
            text: "Which is a good label for the duck's beak?"
            say: "Read them yourself. Which one is a good label?"
            show: { object: duck }
            options: ["beak", "The duck has an orange beak for eating.", "Dear duck,"]
            answer: "beak"
            option_audio: false
          - id: l2-c3
            part: instructions
            type: ordering
            text: "How to put on your coat. Put the steps in order."
            say: "How to put on your coat. Put the steps in order."
            options: ["Do up the zip.", "Push your arms in the sleeves.", "Pick up your coat."]
            slot_count: 3
            answer: ["Pick up your coat.", "Push your arms in the sleeves.", "Do up the zip."]
            option_audio: false
          - id: l2-c4
            part: letters
            type: multiple_choice
            text: "How should a letter to your teacher, Miss Khan, start?"
            say: "Read them yourself. How should the letter start?"
            options: ["Dear Miss Khan,", "From Miss Khan", "How to Miss Khan"]
            answer: "Dear Miss Khan,"
            option_audio: false
          - id: l2-c5
            part: lists-labels
            type: sorting
            text: "Which belong on a list of things for school?"
            say: "Read each one. Does it belong on a list of things to take to school?"
            option_audio: false
            bins:
              - { id: yes, show: { text: "on the list" }, say: "On the list." }
              - { id: no, show: { text: "not on the list" }, say: "Not on the list." }
            options:
              - { text: "book bag", bin: yes }
              - { text: "water bottle", bin: yes }
              - { text: "Love from Tom", bin: no }
              - { text: "Then we went home.", bin: no }
          - id: l2-c6
            part: choose
            type: matching
            text: "What does each job need? Match them."
            say: "Read each job yourself. Tap a job, then tap the kind of writing it needs."
            pairs:
              - { left: { text: "tell Grandad about your holiday" }, right: { text: "a letter" } }
              - { left: { text: "show the parts of a tractor" }, right: { text: "labels" } }
              - { left: { text: "tell how to feed the hamster" }, right: { text: "instructions" } }
              - { left: { text: "remember who to invite" }, right: { text: "a list" } }
          - id: l2-c7
            part: choose
            type: true_false
            text: "Is it true? Labels are the best way to tell someone how to bake a cake."
            answer: false
          - id: l2-c8
            part: choose
            type: multiple_choice
            text: "You want to thank Aunty Pam for your present. What should you write?"
            say: "Read the question. What kind of writing should you do?"
            options: ["labels", "a list", "a letter"]
            answer: "a letter"
          - id: l2-c9
            part: choose
            type: multiple_choice
            text: "What are instructions for?"
            say: "Read them yourself. What are instructions for?"
            options: ["to name the parts of a picture", "to tell someone how to do something", "to help you remember things"]
            answer: "to tell someone how to do something"
            option_audio: false
          - id: l2-c10
            part: lists-labels
            type: multiple_choice
            text: "Ali wrote a label for the bird's wing: \"The bird has a wing to fly with.\"\nWhat should he change?"
            say: "Read Ali's label. What should he change? Read them yourself."
            show: { object: bird }
            options: ["add Dear at the start", "make it just a word or two", "put a number in front"]
            answer: "make it just a word or two"
            option_audio: false
          - id: l2-c11
            part: lists-labels
            type: true_false
            text: "Is it true? A label names one part of a picture in a word or two."
            answer: true
          - id: l2-c12
            part: lists-labels
            type: sorting
            text: "Which are good labels for a picture of a house?"
            say: "Read each one yourself. Is it a good label for a picture of a house?"
            option_audio: false
