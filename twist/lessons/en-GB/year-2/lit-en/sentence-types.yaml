# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.sentence-types
skill: lit-en.grammar.sentence-types
curriculum: en-GB
language: en
title:
  de: Aussage, Frage, Ausruf und Aufforderung
  en: Statements, questions, exclamations and commands
summary: >
  There are four kinds of sentence, each with its own job. Lesson 1
  takes statements (they tell you something and end with a full stop)
  and questions (they ask something and end with a question mark).
  Lesson 2 takes commands (they tell someone to do something, starting
  with a bossy verb) and exclamations (in Year 2 grammar, a sentence
  that starts with What or How and ends with an exclamation mark: What a
  big cake!), and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.grammar.sentence-punctuation]
  also_practises: [lit-en.grammar.word-classes]
  vocabulary: { en: [statement, question, exclamation, command, full stop, question mark, exclamation mark, bossy verb, capital letter] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: mark-decides
      what: Thinks any sentence with an exclamation mark is an exclamation (Sit down! as an exclamation)
      addressed: Learn screens 1 and 3 of lesson 2; l2-f2 and l2-s3 set a command with ! against an exclamation, with feedback in l2-f2
    - id: question-word-only
      what: Thinks a sentence is only a question if it starts with who, what or where (misses Can you swim?)
      addressed: Learn screen 3 of lesson 1; l1-f4 and l1-s4 ask about questions that start with can or is, with feedback in l1-f4
    - id: statement-ends-question
      what: Puts a question mark after a statement that has a question word in it (I know where you live?)
      addressed: l1-f5 and l1-n4 ask for the end mark of a statement with where or what inside it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Aussagen und Fragen, en: Statements and questions }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which sentence is written correctly?"
            options: ["the dog is big.", "The dog is big.", "The dog is big"]
            answer: "The dog is big."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Finish the sentence."
            say: "Which mark goes at the end of this sentence?"
            frame: "We went to the park_"
            options: [".", ","]
            answer: ["."]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The cat is asleep."
            say: "This is a statement. A statement tells you something. It starts with a capital letter and ends with a full stop."
          - text: "Where is the cat?"
            say: "This is a question. A question asks something and needs an answer. It ends with a question mark."
          - text: "Can you swim?\nIs it raining?"
            say: "Not every question starts with who, what or where. Questions can start with can, is, do or will too. If it asks something, it is a question."
          - text: "I know where the cat is."
            say: "Careful. This sentence has the word where in it, but it does not ask anything. It tells you something. So it is a statement, with a full stop."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Statement or question? Sort them."
                say: "Read each sentence. Does it tell you something, or ask something? Put it in the right group."
                option_audio: false
                bins:
                  - { id: statement, show: { text: "statement" }, say: "Statement." }
                  - { id: question, show: { text: "question" }, say: "Question." }
                options:
                  - { text: "The sun is hot.", bin: statement }
                  - { text: "Who is at the door?", bin: question }
                  - { text: "I like apples.", bin: statement }
                  - { text: "Do you like apples?", bin: question }
                hints:
                  - "Does it ask something? Look at the end mark."
                  - "A question ends with a question mark."
                  - "Statements: The sun is hot. I like apples. Questions: Who is at the door? Do you like apples?"
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Finish the sentence."
                say: "Which mark goes at the end?"
                frame: "What is your name_"
                options: [".", "?", "!"]
                answer: ["?"]
                option_audio: false
                hints:
                  - "Is it telling or asking?"
                  - "It asks for your name."
                  - "A question mark."
              - id: l1-f3
                type: multiple_choice
                text: "What is a statement for?"
                options: ["to tell you something", "to ask something", "to tell someone what to do"]
                answer: "to tell you something"
                option_audio: false
                hints:
                  - "Think of The cat is asleep."
                  - "It gives you a fact."
                  - "To tell you something."
              - id: l1-f4
                type: multiple_choice
                text: "Can we go outside\nWhat kind of sentence is this?"
                say: "Read the sentence: Can we go outside. What kind of sentence is this?"
                options: ["a question", "a statement"]
                answer: "a question"
                option_audio: false
                feedback:
                  "a statement": "It does not start with who or what, but it asks something. Questions can start with can."
                hints:
                  - "Does it ask something?"
                  - "Someone wants an answer: yes or no."
                  - "A question."
              - id: l1-f5
                type: fill_in_blank
                text: "Finish the sentence."
                say: "Which mark goes at the end?"
                frame: "I know what you had for lunch_"
                options: [".", "?"]
                answer: ["."]
                option_audio: false
                hints:
                  - "It has the word what, but does it ask anything?"
                  - "It tells you something I know."
                  - "A full stop."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Finish the sentence."
                say: "Which mark goes at the end?"
                frame: "My bag is red_"
                options: [".", "?"]
                answer: ["."]
                option_audio: false
                hints: ["Is it telling or asking?"]
              - id: l1-s2
                type: multiple_choice
                text: "Which sentence is a question?"
                options: ["Where do you live?", "I live in Leeds.", "Leeds is a city."]
                answer: "Where do you live?"
                option_audio: false
                hints: ["Which one asks something?"]
              - id: l1-s3
                type: ordering
                text: "Make a question from the words."
                say: "Put the words in order to make a question."
                options: ["you", "Are", "hungry?"]
                slot_count: 3
                answer: ["Are", "you", "hungry?"]
                option_audio: false
                hints: ["A question can start with Are."]
              - id: l1-s4
                type: true_false
                text: "Is it your birthday? This sentence is a question."
                say: "Read it. Is it true?"
                answer: true
                hints: ["It asks something."]
              - id: l1-s5
                type: multiple_choice
                text: "What is a question for?"
                options: ["to ask something", "to tell you something", "to show surprise"]
                answer: "to ask something"
                option_audio: false
                hints: ["A question needs an answer."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Finish the sentence."
                say: "Which mark goes at the end?"
                frame: "Will you play with me_"
                options: [".", "?"]
                answer: ["?"]
                option_audio: false
              - id: l1-n2
                type: sorting
                text: "Statement or question? Sort them."
                say: "Read each sentence. Does it tell you something, or ask something? Put it in the right group."
                option_audio: false
                bins:
                  - { id: statement, show: { text: "statement" }, say: "Statement." }
                  - { id: question, show: { text: "question" }, say: "Question." }
                options:
                  - { text: "Is the shop open?", bin: question }
                  - { text: "Grandma has a cat.", bin: statement }
                  - { text: "Why is the sky blue?", bin: question }
                  - { text: "It is my turn.", bin: statement }
              - id: l1-n3
                type: ordering
                text: "Make a statement from the words."
                say: "Put the words in order to make a statement."
                options: ["happy.", "I", "am"]
                slot_count: 3
                answer: ["I", "am", "happy."]
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Finish the sentence."
                say: "Which mark goes at the end?"
                frame: "Mum told me where the keys were_"
                options: [".", "?"]
                answer: ["."]
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "The bus is late. This sentence is a question."
                say: "Read it. Is it true?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Finish the sentence."
            say: "Which mark goes at the end?"
            frame: "Do you have a pet_"
            options: [".", "?"]
            answer: ["?"]
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which sentence is a statement?"
            options: ["How old are you?", "I am seven.", "Are you seven?"]
            answer: "I am seven."
            option_audio: false
          - id: l1-c3
            type: fill_in_blank
            text: "Finish the sentence."
            say: "Which mark goes at the end?"
            frame: "Snow is cold_"
            options: [".", "?"]
            answer: ["."]
            option_audio: false

  - n: 2
    title: { de: Aufforderungen und Ausrufe, en: Commands and exclamations }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Finish the sentence."
            say: "Which mark goes at the end?"
            frame: "When is lunch_"
            options: [".", "?"]
            answer: ["?"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which sentence is a question?"
            options: ["Can I have a turn?", "I had a turn.", "It is your turn."]
            answer: "Can I have a turn?"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Shut the door.\nWash your hands."
            say: "These are commands. A command tells someone to do something. It often starts with a bossy verb: shut, wash, put, come. It ends with a full stop, or an exclamation mark if it is said loudly: Stop!"
          - text: "Please sit down."
            say: "A polite command can start with please. It still tells someone what to do, so it is still a command."
          - text: "What a big cake!\nHow fast you run!"
            say: "These are exclamations. An exclamation shows a strong feeling, like surprise. In Year 2 grammar, an exclamation starts with What or How, and ends with an exclamation mark."
          - text: "statement .   question ?   command . or !   exclamation !"
            say: "Four kinds of sentence. A statement tells. A question asks. A command tells someone to do something. An exclamation shows a strong feeling."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which sentence is a command?"
                options: ["Put your coat on.", "My coat is blue.", "Where is my coat?"]
                answer: "Put your coat on."
                option_audio: false
                hints:
                  - "Which one tells someone to do something?"
                  - "Look for a bossy verb at the start."
                  - "Put your coat on."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Sit down now!\nWhat kind of sentence is this?"
                say: "Read the sentence: Sit down now! What kind of sentence is this?"
                options: ["a command", "an exclamation", "a question"]
                answer: "a command"
                option_audio: false
                feedback:
                  "an exclamation": "It ends with an exclamation mark, but it tells someone what to do, and it does not start with What or How. So it is a command."
                hints:
                  - "Does it tell someone to do something?"
                  - "Sit is a bossy verb."
                  - "A command."
              - id: l2-f3
                type: fill_in_blank
                text: "Finish the exclamation."
                say: "Which word starts this exclamation?"
                frame: "_ a lovely day it is!"
                options: ["What", "Where", "Please"]
                answer: ["What"]
                hints:
                  - "Exclamations start with What or How."
                  - "Which one fits before a lovely day?"
                  - "What."
              - id: l2-f4
                type: multiple_choice
                text: "What is a command for?"
                options: ["to tell someone to do something", "to ask something", "to show surprise"]
                answer: "to tell someone to do something"
                option_audio: false
                hints:
                  - "Think of Wash your hands."
                  - "It is bossy."
                  - "To tell someone to do something."
              - id: l2-f5
                type: sorting
                text: "Command or exclamation? Sort them."
                say: "Read each sentence. Is it a command or an exclamation? Put it in the right group."
                option_audio: false
                bins:
                  - { id: command, show: { text: "command" }, say: "Command." }
                  - { id: exclamation, show: { text: "exclamation" }, say: "Exclamation." }
                options:
                  - { text: "Brush your teeth.", bin: command }
                  - { text: "What a huge dog!", bin: exclamation }
                  - { text: "Come here!", bin: command }
                  - { text: "How tall you are!", bin: exclamation }
                hints:
                  - "Does it start with What or How, or with a bossy verb?"
                  - "Brush and Come are bossy verbs."
                  - "Commands: Brush your teeth. Come here! Exclamations: What a huge dog! How tall you are!"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which sentence is an exclamation?"
                options: ["How cold it is!", "It is cold.", "Is it cold?"]
                answer: "How cold it is!"
                option_audio: false
                hints: ["Look for How or What at the start and ! at the end."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap the bossy verb."
                say: "Read the command. Tap the bossy verb."
                show: { drawn: letter-card, text: "Stir the soup slowly." }
                spans: ["Stir"]
                hints: ["It is the word that tells you what to do."]
              - id: l2-s3
                type: true_false
                text: "Stop! This sentence is an exclamation."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Does it start with What or How? Does it tell someone what to do?"]
              - id: l2-s4
                type: multiple_choice
                text: "What is an exclamation for?"
                options: ["to show a strong feeling", "to ask something", "to tell someone what to do"]
                answer: "to show a strong feeling"
                option_audio: false
                hints: ["Think of What a big cake!"]
              - id: l2-s5
                type: ordering
                text: "Make a command from the words."
                say: "Put the words in order to make a command."
                options: ["the", "Close", "window."]
                slot_count: 3
                answer: ["Close", "the", "window."]
                option_audio: false
                hints: ["A command starts with the bossy verb."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "What kind of sentence? Sort them."
                say: "Read each sentence. Is it a statement, a question, a command or an exclamation? Put it in the right group."
                option_audio: false
                bins:
                  - { id: statement, show: { text: "statement" }, say: "Statement." }
                  - { id: question, show: { text: "question" }, say: "Question." }
                  - { id: command, show: { text: "command" }, say: "Command." }
                  - { id: exclamation, show: { text: "exclamation" }, say: "Exclamation." }
                options:
                  - { text: "Ducks can swim.", bin: statement }
                  - { text: "Can ducks swim?", bin: question }
                  - { text: "Feed the ducks.", bin: command }
                  - { text: "What a funny duck!", bin: exclamation }
              - id: l2-n2
                type: fill_in_blank
                text: "Finish the exclamation."
                say: "Which word starts this exclamation?"
                frame: "_ beautiful the flowers are!"
                options: ["How", "Who", "Pick"]
                answer: ["How"]
              - id: l2-n3
                type: multiple_choice
                text: "Please line up by the door.\nWhat kind of sentence is this?"
                say: "Read the sentence: Please line up by the door. What kind of sentence is this?"
                options: ["a command", "a statement", "a question"]
                answer: "a command"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "What a mess you have made! This sentence is an exclamation."
                say: "Read it. Is it true?"
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Finish the sentence."
                say: "Which mark goes at the end?"
                frame: "What a fast car_"
                options: [".", "?", "!"]
                answer: ["!"]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which sentence is a question?"
            options: ["Is the cake ready?", "The cake is ready.", "Eat the cake."]
            answer: "Is the cake ready?"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Take off your shoes.\nWhat kind of sentence is this?"
            say: "Read the sentence: Take off your shoes. What kind of sentence is this?"
            options: ["a command", "a statement", "an exclamation"]
            answer: "a command"
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "Finish the sentence."
            say: "Which mark goes at the end?"
            frame: "My brother is nine_"
            options: [".", "?", "!"]
            answer: ["."]
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which sentence is an exclamation?"
            options: ["What a brave girl you are!", "Be brave!", "Are you brave?"]
            answer: "What a brave girl you are!"
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "You want to find out what time the film starts. Which sentence do you need?"
            options: ["a question", "a command", "an exclamation"]
            answer: "a question"
            option_audio: false
