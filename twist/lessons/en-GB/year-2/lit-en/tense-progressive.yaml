# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.tense-progressive
skill: lit-en.grammar.tense-progressive
curriculum: en-GB
language: en
title:
  de: Gegenwart, Vergangenheit und Verlaufsform
  en: Present, past and the progressive form
summary: >
  Verbs show when something happens. Lesson 1 takes the present tense
  (she jumps) and the past tense (she jumped, with -ed or a special form
  such as ran or went) and keeps one tense through a short text. Lesson
  2 takes the progressive form, for something that is or was going on:
  she is drumming, he was shouting, they were playing; it ends with the
  skill check.
metadata:
  year: year-2
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.grammar.word-classes]
  also_practises: [lit-en.spelling.suffixes-y2]
  vocabulary: { en: [verb, tense, present tense, past tense, progressive, -ed, -ing, is, are, was, were] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: present-past, what: { de: Gegenwart oder Vergangenheit passend zur Zeit wählen, en: choosing the present or the past tense to fit the time } }
    - { id: past-forms, what: { de: "Vergangenheit mit -ed und mit eigener Form (ran, went)", en: "the past tense with -ed and with its own form (ran, went)" } }
    - { id: consistent, what: { de: in einem Text bei einer Zeitform bleiben, en: keeping to one tense in a text } }
    - { id: progressive, what: { de: "die Verlaufsform (is drumming, was shouting)", en: "the progressive form (is drumming, was shouting)" } }
  misconceptions:
    - id: ed-everywhere
      what: Adds -ed to every verb for the past (runned, goed)
      addressed: Learn screen 3 of lesson 1; l1-f3, l1-s3 and l1-n3 ask for an irregular past form, with feedback in l1-f3
    - id: tense-switch
      what: Switches tense in the middle of a text (Yesterday I go to the park and I played)
      addressed: Learn screen 4 of lesson 1; l1-f5, l1-s4 and l1-n5 find the verb that breaks the tense
    - id: helper-mismatch
      what: Uses the wrong helper verb in the progressive (they was playing, I is running) or leaves it out (she drumming)
      addressed: Learn of lesson 2; l2-f2, l2-s2 and l2-n2 choose is, are, was or were, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Gegenwart und Vergangenheit, en: Present and past }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tap the verb."
            say: "Read the sentence. Tap the verb, the doing word."
            show: { drawn: letter-card, text: "The duck swims." }
            spans: ["swims."]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word is a verb?"
            options: ["jump", "jumper", "happy"]
            answer: "jump"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Today I play.\nYesterday I played."
            say: "Verbs tell you when something happens. Today I play: that is the present tense, happening now. Yesterday I played: that is the past tense, it has already happened."
          - text: "jump → jumped   walk → walked   bake → baked"
            say: "For many verbs, add -ed to make the past tense. If the verb ends in e, just add d: bake, baked."
          - text: "run → ran   go → went   see → saw   eat → ate"
            say: "Some verbs have their own past tense. We do not say runned or goed. We say ran and went. You learn these by using them."
          - text: "Yesterday we went to the beach. We swam and we ate ice cream."
            say: "When you write about the past, keep every verb in the past tense: went, swam, ate. Do not slip back into the present."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Yesterday I _ football."
                say: "Which verb finishes the sentence? Read them yourself."
                options: ["played", "play", "plays"]
                answer: "played"
                option_audio: false
                hints:
                  - "Look at the first word: yesterday."
                  - "Yesterday is in the past, so the verb is in the past tense."
                  - "Played."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Present or past? Sort the verbs."
                say: "Read each verb. Is it happening now, or did it already happen? Put it in the right group."
                option_audio: false
                bins:
                  - { id: present, show: { text: "present" }, say: "Present." }
                  - { id: past, show: { text: "past" }, say: "Past." }
                options:
                  - { text: "walks", bin: present }
                  - { text: "walked", bin: past }
                  - { text: "jumps", bin: present }
                  - { text: "jumped", bin: past }
                hints:
                  - "Look at the endings."
                  - "-ed often means the past."
                  - "Present: walks, jumps. Past: walked, jumped."
              - id: l1-f3
                type: multiple_choice
                text: "Last week Tom _ a race."
                say: "Which verb finishes the sentence? Read them yourself."
                options: ["ran", "runned", "runs"]
                answer: "ran"
                option_audio: false
                feedback:
                  runned: "Run has its own past tense. We say ran."
                hints:
                  - "Last week is in the past."
                  - "Run does not take -ed."
                  - "Ran."
              - id: l1-f4
                type: fill_in_blank
                text: "Put bake in the past tense."
                say: "Change bake into the past tense."
                frame: "Yesterday Gran _ a cake."
                options: ["baked", "bakeed", "bakes"]
                answer: ["baked"]
                option_audio: false
                hints:
                  - "Bake ends in e."
                  - "Just add d."
                  - "Baked."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the verb in the wrong tense."
                say: "This is about yesterday. One verb is in the wrong tense. Tap it."
                show: { drawn: letter-card, text: "Yesterday I went to the park and I play on the swings." }
                spans: ["play"]
                hints:
                  - "All the verbs should be in the past."
                  - "Went is past. Find one that is not."
                  - "Play: it should be played."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Now Mia _ to school every day."
                say: "Which verb finishes the sentence? Read them yourself."
                options: ["walks", "walked"]
                answer: "walks"
                option_audio: false
                hints: ["Now tells you it happens in the present, again and again."]
              - id: l1-s2
                type: fill_in_blank
                text: "Put jump in the past tense."
                say: "Change jump into the past tense."
                frame: "The frog _ into the pond."
                options: ["jumped", "jumps", "jumpt"]
                answer: ["jumped"]
                option_audio: false
                hints: ["Add -ed."]
              - id: l1-s3
                type: multiple_choice
                text: "Yesterday we _ to the zoo."
                say: "Which verb finishes the sentence? Read them yourself."
                options: ["goed", "went", "go"]
                answer: "went"
                option_audio: false
                hints: ["Go has its own past tense."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the verb in the wrong tense."
                say: "This is about last night. One verb is in the wrong tense. Tap it."
                show: { drawn: letter-card, text: "Last night we ate pizza and watch a film." }
                spans: ["watch"]
                hints: ["Ate is past. Which one is not?"]
              - id: l1-s5
                type: true_false
                text: "Saw is the past tense of see."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Today I see, yesterday I ..."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Last summer Ben _ in the sea."
                say: "Which verb finishes the sentence? Read them yourself."
                options: ["swims", "swam", "swimmed"]
                answer: "swam"
                option_audio: false
              - id: l1-n2
                type: sorting
                text: "Present or past? Sort the verbs."
                say: "Read each verb. Is it happening now, or did it already happen? Put it in the right group."
                option_audio: false
                bins:
                  - { id: present, show: { text: "present" }, say: "Present." }
                  - { id: past, show: { text: "past" }, say: "Past." }
                options:
                  - { text: "sees", bin: present }
                  - { text: "saw", bin: past }
                  - { text: "eats", bin: present }
                  - { text: "ate", bin: past }
              - id: l1-n3
                type: multiple_choice
                text: "I _ a big spider this morning."
                say: "Which verb finishes the sentence? Read them yourself."
                options: ["seed", "saw", "see"]
                answer: "saw"
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Put shout in the past tense."
                say: "Change shout into the past tense."
                frame: "Dad _ hooray!"
                options: ["shouted", "shouts", "shoutted"]
                answer: ["shouted"]
                option_audio: false
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the verb in the wrong tense."
                say: "This is about yesterday. One verb is in the wrong tense. Tap it."
                show: { drawn: letter-card, text: "Yesterday it rained, so we stay inside and painted." }
                spans: ["stay"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Yesterday the dog _ a bone."
            say: "Which verb finishes the sentence? Read them yourself."
            options: ["found", "finds", "finded"]
            answer: "found"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Now the baby _ in her cot every night."
            say: "Which verb finishes the sentence? Read them yourself."
            options: ["sleeps", "slept"]
            answer: "sleeps"
            option_audio: false
          - id: l1-c3
            type: fill_in_blank
            text: "Put kick in the past tense."
            say: "Change kick into the past tense."
            frame: "Amy _ the ball."
            options: ["kicked", "kicks", "kickd"]
            answer: ["kicked"]
            option_audio: false
          - id: l1-c4
            type: highlight_in_text
            text: "This is about last Sunday. Tap the verb in the wrong tense."
            say: "This is about last Sunday. One verb is in the wrong tense. Tap it."
            show: { drawn: letter-card, text: "Last Sunday we baked a cake and eat it all." }
            spans: ["eat"]
          - id: l1-c5
            type: true_false
            text: "Is it true? \"She jumps\" is in the past tense."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Yesterday Mum _ me a new book."
            say: "Which verb finishes the sentence? Read them yourself."
            options: ["buyed", "bought", "buys"]
            answer: "bought"
            option_audio: false

  - n: 2
    title: { de: "Die Verlaufsform: is drumming, was shouting", en: "The progressive: is drumming, was shouting" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Yesterday I _ a sandwich."
            say: "Which verb finishes the sentence? Read them yourself."
            options: ["ate", "eated", "eat"]
            answer: "ate"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which verb is in the past tense?"
            options: ["walked", "walks", "walk"]
            answer: "walked"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "She is drumming.\nThey are dancing."
            say: "The progressive form shows that something is going on right now. Use is or are, then a verb with -ing. She is drumming. They are dancing. I am reading."
          - text: "He was shouting.\nWe were playing."
            say: "For something that was going on in the past, use was or were, then the -ing verb. He was shouting. We were playing."
          - text: "I am   he, she, it is   we, they, you are\nI, he, she, it was   we, they, you were"
            say: "Choose the helper that fits. One person: is or was. More than one, or you: are or were. And I am. We do not say they was or I is."
          - text: "run → running   make → making"
            say: "Watch the spelling when you add -ing. Run doubles the n: running. Make drops the e: making."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Look! The birds _ singing."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["are", "is", "was"]
                answer: "are"
                option_audio: false
                hints:
                  - "Is it happening now or in the past?"
                  - "Birds is more than one."
                  - "Are."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Yesterday the children _ playing in the snow."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["were", "was", "are"]
                answer: "were"
                option_audio: false
                feedback:
                  was: "Was is for one person. The children are more than one, so use were."
                hints:
                  - "Yesterday is in the past: was or were."
                  - "Children is more than one."
                  - "Were."
              - id: l2-f3
                type: fill_in_blank
                text: "Add -ing to drum."
                say: "Make the progressive form of drum."
                frame: "Sam is _ in the band."
                options: ["drumming", "drumed", "drums"]
                answer: ["drumming"]
                option_audio: false
                hints:
                  - "After is, use a verb with -ing."
                  - "Drum doubles the m."
                  - "Drumming."
              - id: l2-f4
                type: true_false
                text: "\"He was shouting.\" This tells you about something that was going on in the past."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Look at the helper: was."
                  - "Was is past."
                  - "Yes, it was going on in the past."
              - id: l2-f5
                type: sorting
                text: "Now or in the past? Sort them."
                say: "Read each one. Is it going on now, or was it going on in the past? Put it in the right group."
                option_audio: false
                bins:
                  - { id: now, show: { text: "going on now" }, say: "Going on now." }
                  - { id: past, show: { text: "was going on" }, say: "Was going on." }
                options:
                  - { text: "she is singing", bin: now }
                  - { text: "she was singing", bin: past }
                  - { text: "we are eating", bin: now }
                  - { text: "we were eating", bin: past }
                hints:
                  - "Look at the helper word."
                  - "Is and are are now. Was and were are past."
                  - "Now: is singing, are eating. Past: was singing, were eating."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Add -ing to make."
                say: "Make the progressive form of make."
                frame: "Mum is _ tea."
                options: ["making", "makeing", "maked"]
                answer: ["making"]
                option_audio: false
                hints: ["Drop the e, then add -ing."]
              - id: l2-s2
                type: multiple_choice
                text: "I _ reading my book when the phone rang."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["was", "were", "is"]
                answer: "was"
                option_audio: false
                hints: ["One person, in the past."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap both words of the progressive verb."
                say: "Read the sentence. Tap both words of the verb that shows something going on."
                show: { drawn: letter-card, text: "The cat is chasing a fly." }
                spans: ["is", "chasing"]
                hints: ["Find the helper and the -ing verb."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["They was running.", "They were running.", "They running."]
                answer: "They were running."
                option_audio: false
                hints: ["They is more than one."]
              - id: l2-s5
                type: fill_in_blank
                text: "Add -ing to swim."
                say: "Make the progressive form of swim."
                frame: "The ducks are _."
                options: ["swimming", "swiming", "swam"]
                answer: ["swimming"]
                option_audio: false
                hints: ["Swim doubles the m."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Shh! The baby _ sleeping."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["is", "are", "were"]
                answer: "is"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Last night we _ watching the fireworks."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["were", "was", "are"]
                answer: "were"
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Add -ing to ride."
                say: "Make the progressive form of ride."
                frame: "Ali was _ his bike."
                options: ["riding", "rideing", "rode"]
                answer: ["riding"]
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "\"They are laughing.\" This tells you about something that was going on yesterday."
                say: "Read it. Is it true?"
                answer: false
              - id: l2-n5
                type: highlight_in_text
                text: "Tap both words of the progressive verb."
                say: "Read the sentence. Tap both words of the verb that shows something going on."
                show: { drawn: letter-card, text: "Grandad was digging in the garden." }
                spans: ["was", "digging"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: present-past
            type: multiple_choice
            text: "Last Saturday we _ a castle."
            say: "Which verb finishes the sentence? Read them yourself."
            options: ["visited", "visit", "visits"]
            answer: "visited"
            option_audio: false
          - id: l2-c2
            part: past-forms
            type: multiple_choice
            text: "This morning Jo _ her shoes."
            say: "Which verb finishes the sentence? Read them yourself."
            options: ["losed", "lost", "loses"]
            answer: "lost"
            option_audio: false
          - id: l2-c3
            part: consistent
            type: highlight_in_text
            text: "Tap the verb in the wrong tense."
            say: "This is about last weekend. One verb is in the wrong tense. Tap it."
            show: { drawn: letter-card, text: "Last weekend we visited Gran and she gives us a hug." }
            spans: ["gives"]
          - id: l2-c4
            part: progressive
            type: multiple_choice
            text: "It is happening now. The girls _ skipping in the playground."
            say: "It is happening now. Which word finishes the sentence? Read them yourself."
            options: ["are", "is", "was"]
            answer: "are"
            option_audio: false
          - id: l2-c5
            part: progressive
            type: fill_in_blank
            text: "Add -ing to hop."
            say: "Make the progressive form of hop."
            frame: "The rabbit was _ across the grass."
            options: ["hopping", "hoping", "hoped"]
            answer: ["hopping"]
            option_audio: false
          - id: l2-c6
            part: present-past
            type: true_false
            text: "\"Today Zak goes to swimming club.\"\nIs it true? The verb is in the present tense."
            answer: true
          - id: l2-c7
            part: present-past
            type: sorting
            text: "Is it happening now, or did it happen before? Sort the sentences."
            say: "Read each sentence yourself. Is it in the present tense or the past tense? Put it in the right group."
            option_audio: false
            bins:
              - { id: present, show: { text: "present" }, say: "Present." }
              - { id: past, show: { text: "past" }, say: "Past." }
            options:
              - { text: "The bell rang.", bin: past }
              - { text: "Dad reads the paper.", bin: present }
              - { text: "The bell rings.", bin: present }
              - { text: "Dad cooked our tea.", bin: past }
          - id: l2-c8
            part: present-past
            type: true_false
            text: "\"Yesterday I walk to school.\"\nIs it true? The verb is in the right tense."
            answer: false
          - id: l2-c9
            part: present-past
            type: fill_in_blank
            text: "Choose the verbs."
            say: "Which verbs finish the two sentences?"
            frame: "Today I _ an apple. Yesterday I _ a pear."
            options: ["ate", "eat", "eated"]
            answer: ["eat", "ate"]
            option_audio: false
          - id: l2-c10
            part: past-forms
            type: multiple_choice
            text: "Last night Dad _ me a story."
            say: "Which verb finishes the sentence? Read them yourself."
            options: ["telled", "tells", "told"]
            answer: "told"
            option_audio: false
          - id: l2-c11
            part: past-forms
            type: fill_in_blank
            text: "Put smile in the past tense."
            say: "Change smile into the past tense."
            frame: "The baby _ at me."
            options: ["smileed", "smiled", "smiles"]
            answer: ["smiled"]
            option_audio: false
          - id: l2-c12
            part: past-forms
            type: true_false
            text: "Is it true? The past tense of catch is catched."
            answer: false
          - id: l2-c13
            part: past-forms
            type: matching
            text: "Match each verb to its past tense."
            say: "Read each verb yourself. Tap a verb, then tap its past tense."
            option_audio: false
            pairs:
              - { left: { text: "come" }, right: { text: "came" } }
              - { left: { text: "sing" }, right: { text: "sang" } }
              - { left: { text: "make" }, right: { text: "made" } }
          - id: l2-c14
            part: consistent
            type: highlight_in_text
            text: "This is about yesterday. Tap the verb in the wrong tense."
            say: "This is about yesterday. One verb is in the wrong tense. Tap it."
            show: { drawn: letter-card, text: "Yesterday Ali climbed a tree and falls out." }
            spans: ["falls"]
          - id: l2-c15
            part: consistent
            type: true_false
            text: "\"Last week we made a den and played in it.\"\nIs it true? Both verbs are in the past tense."
            answer: true
          - id: l2-c16
            part: consistent
            type: multiple_choice
            text: "Which sentence keeps to one tense?"
            say: "Which sentence keeps to one tense? Read them yourself."
            options: ["We went to the shop and buy some milk.", "We went to the shop and bought some milk.", "We go to the shop and bought some milk."]
            answer: "We went to the shop and bought some milk."
            option_audio: false
          - id: l2-c17
            part: consistent
            type: highlight_in_text
            text: "This is happening now. Tap the verb in the wrong tense."
            say: "This is happening now. One verb is in the wrong tense. Tap it."
            show: { drawn: letter-card, text: "Now the dog runs to the door and barked." }
            spans: ["barked"]
            difficulty: stretch
          - id: l2-c18
            part: progressive
            type: multiple_choice
            text: "Which one shows something that was going on in the past?"
            options: ["She is painting.", "She was painting.", "She paints."]
            answer: "She was painting."
            option_audio: false
          - id: l2-c19
            part: progressive
            type: fill_in_blank
            text: "Fill the gaps to show it is going on now."
            say: "It is going on right now. Which words fill the gaps?"
            frame: "Right now I _ _ a letter."
            options: ["is", "am", "writing", "wrote"]
            answer: ["am", "writing"]
            option_audio: false
          - id: l2-c20
            part: progressive
            type: true_false
            text: "\"The dogs was barking.\"\nIs it true? This sentence is written correctly."
            answer: false
