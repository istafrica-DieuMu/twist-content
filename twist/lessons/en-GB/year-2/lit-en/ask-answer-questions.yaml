# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.ask-answer-questions
skill: lit-en.comprehension.questions
curriculum: en-GB
language: en
title:
  de: Fragen zu Texten beantworten und stellen
  en: Answering and asking questions about a text
summary: >
  Children answer and ask questions about short stories read aloud.
  Lesson 1 answers who, what, where, when and why questions, finding the
  part of the story that holds the answer and saying why when the story
  only hints at it; lesson 2 asks questions: matching question words to
  what they ask, choosing a question the story can answer, and asking
  questions to find out more, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Geschichten verstehen, en: Understanding stories }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.comprehension.simple-inference]
  also_practises: [lit-en.comprehension.simple-inference]
  vocabulary: { en: [question, answer, who, what, where, when, why, how, clue, question mark] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: who-what, what: { de: "Wer- und Was-Fragen beantworten (Personen, Dinge, was passiert)", en: "answering who and what questions (people, things, what happens)" } }
    - { id: where-when, what: { de: "Wo- und Wann-Fragen beantworten (Orte und Zeiten)", en: answering where and when questions (places and times) } }
    - { id: why, what: { de: Warum-Fragen mit Hinweisen aus der Geschichte beantworten, en: answering why questions from clues in the story } }
    - { id: question-words, what: { de: "das Fragewort wählen, das zur Antwort passt", en: "choosing the question word that fits an answer" } }
    - { id: ask-questions, what: { de: "passende Fragen zu einer Geschichte wählen (beantwortbare und offene Fragen)", en: "choosing good questions about a story (ones it answers, I wonder questions)" } }
  misconceptions:
    - id: answer-from-memory
      what: Answers from what they know or like instead of from the story (the dog is called Rex because their dog is)
      addressed: Lesson 1 Learn screen 4 says go back to the story; feedback in l1-f2; l1-s2, l1-n2
    - id: question-word-mixed
      what: Mixes up what the question words ask (gives a place for a when question)
      addressed: Lesson 1 Learn screens 1 and 2 and lesson 2 Learn screen 2; feedback in l1-f3; l2-f1, l2-s1, l2-n1, l2-c4
    - id: why-not-in-words
      what: Thinks a why answer must be written word for word in the story
      addressed: Lesson 1 Learn screen 5 uses clues; l1-f5, l1-s5, l2-c2
    - id: any-question-fits
      what: Asks questions the story cannot answer, or that are not about the story
      addressed: Lesson 2 Learn screen 3; l2-f3, l2-s3, l2-n3, l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Fragen beantworten, en: Answering questions }
    goal:
      de: "Hör eine kurze Geschichte und beantworte Fragen mit wer, was, wo, wann und warum, zum Beispiel, wohin Leah mit Biscuit ging."
      en: "Listen to a short story and answer who, what, where, when and why questions, like where Leah took Biscuit."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ana's ice cream fell on the floor. Her eyes filled with tears.\n\nHow does Ana feel?"
            say: "Ana's ice cream fell on the floor. Her eyes filled with tears. How does Ana feel?"
            options: ["sad", "happy", "sleepy"]
            answer: "sad"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Max kept looking at the cake and licking his lips.\n\nWhat does Max want?"
            say: "Max kept looking at the cake and licking his lips. What does Max want?"
            options: ["some cake", "to go to bed", "a new coat"]
            answer: "some cake"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Who?   What?   Where?   When?   Why?"
            say: "Here are five question words. What do you think: which one would you use to ask about a place? Have a guess."
          - text: "Who? a person or an animal\nWhat? a thing or what happens\nWhere? a place\nWhen? a time\nWhy? a reason"
            say: "Where! Question words tell you what kind of answer to look for. Who asks for a person or an animal. What asks for a thing, or for what happens. Where asks for a place. When asks for a time. Why asks for a reason."
          - text: "Did you know? The five Ws"
            say: "Did you know? Who, what, where, when and why all start with w and h. News reporters call them the five Ws. They try to answer all five in a news story!"
          - text: "On Saturday, Leah took her dog Biscuit to the beach. Biscuit chased the waves and barked at a crab.\n\nWhere did they go? To the beach."
            say: "Listen to the story. On Saturday, Leah took her dog Biscuit to the beach. Biscuit chased the waves and barked at a crab. Where did they go? Go back to the story and find the place: to the beach."
          - text: "Biscuit was wet and sandy, so Leah gave him a bath.\n\nWhy did Leah give Biscuit a bath?"
            say: "Sometimes the answer is not in the exact words. Biscuit was wet and sandy, so Leah gave him a bath. Why? The clue is wet and sandy. He was dirty from the beach."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Tom and his grandad went fishing at the lake. Tom caught a big silver fish.\n\nWho went fishing?"
                say: "Tom and his grandad went fishing at the lake. Tom caught a big silver fish. Who went fishing?"
                options: ["Tom and his grandad", "Tom and his mum", "a big silver fish"]
                answer: "Tom and his grandad"
                hints:
                  - "Who asks for people."
                  - "Look at the first sentence."
                  - "Tom and his grandad"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Priya's cat is called Smudge. Smudge is grey and likes to sleep in the sun.\n\nWhat is the cat called?"
                say: "Priya's cat is called Smudge. Smudge is grey and likes to sleep in the sun. What is the cat called?"
                options: ["Smudge", "Priya", "Tiger"]
                answer: "Smudge"
                feedback:
                  "Tiger": "Tiger is a good name for a cat, but it is not in the story. Go back to the story."
                hints:
                  - "Find the cat's name in the story."
                  - "Look after the words is called."
                  - "Smudge"
              - id: l1-f3
                type: multiple_choice
                text: "After school, Jay played football in the park. He scored two goals.\n\nWhen did Jay play football?"
                say: "After school, Jay played football in the park. He scored two goals. When did Jay play football?"
                options: ["after school", "in the park", "two goals"]
                answer: "after school"
                feedback:
                  "in the park": "In the park is a place. That answers where. When asks for a time."
                hints:
                  - "When asks for a time."
                  - "Look at the start of the story."
                  - "after school"
              - id: l1-f4
                type: true_false
                text: "Mia planted a seed in a pot. She watered it every day. Soon a green shoot grew.\n\nIs it true? Mia watered the seed every day."
                say: "Mia planted a seed in a pot. She watered it every day. Soon a green shoot grew. Is it true? Mia watered the seed every day."
                answer: true
                hints:
                  - "Find the words every day."
                  - "What did she do with the seed every day?"
                  - "She watered it every day, so it is true."
              - id: l1-f5
                type: multiple_choice
                text: "Ollie put on his coat, his hat and his gloves. Outside, the snow was falling.\n\nWhy did Ollie wrap up warm?"
                say: "Ollie put on his coat, his hat and his gloves. Outside, the snow was falling. Why did Ollie wrap up warm?"
                options: ["It was cold and snowy.", "He was going swimming.", "It was his birthday."]
                answer: "It was cold and snowy."
                feedback:
                  "He was going swimming.": "Swimming in a coat, a hat and gloves? Very soggy! Look at the weather outside."
                hints:
                  - "Why asks for a reason."
                  - "What was the weather like outside?"
                  - "It was cold and snowy."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ruby lost her red ball. She looked under the bed and found it there.\n\nWhere was the ball?"
                say: "Ruby lost her red ball. She looked under the bed and found it there. Where was the ball?"
                options: ["under the bed", "in the garden", "Ruby"]
                answer: "under the bed"
                hints: ["Where asks for a place."]
              - id: l1-s2
                type: multiple_choice
                text: "Sam has a pet rabbit called Hops. Hops eats carrots and lettuce.\n\nWhat does Hops eat?"
                say: "Sam has a pet rabbit called Hops. Hops eats carrots and lettuce. What does Hops eat?"
                options: ["carrots and lettuce", "cheese and bread", "grass and hay"]
                answer: "carrots and lettuce"
                hints: ["Find it in the story, not from what rabbits usually eat."]
              - id: l1-s3
                type: multiple_choice
                text: "In the morning, Zara went to the shop with her dad. They bought milk and eggs.\n\nWho went with Zara?"
                say: "In the morning, Zara went to the shop with her dad. They bought milk and eggs. Who went with Zara?"
                options: ["her dad", "her mum", "the shop"]
                answer: "her dad"
                hints: ["Who asks for a person."]
              - id: l1-s4
                type: true_false
                text: "Ben's kite got stuck in a tall tree. Mum used a long stick to get it down.\n\nIs it true? Ben's kite was stuck on the roof."
                say: "Ben's kite got stuck in a tall tree. Mum used a long stick to get it down. Is it true? Ben's kite was stuck on the roof."
                answer: false
                hints: ["Where did the kite get stuck?"]
              - id: l1-s5
                type: multiple_choice
                text: "Ella yawned and rubbed her eyes. It was very late.\n\nWhy did Ella yawn?"
                say: "Ella yawned and rubbed her eyes. It was very late. Why did Ella yawn?"
                options: ["She was tired.", "She was hungry.", "She was cross."]
                answer: "She was tired."
                hints: ["The clues are yawned and very late."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "On Monday, the class went to the museum. They saw a huge dinosaur.\n\nWhen did the class go to the museum?"
                say: "On Monday, the class went to the museum. They saw a huge dinosaur. When did the class go to the museum?"
                options: ["on Monday", "at the museum", "a huge dinosaur"]
                answer: "on Monday"
              - id: l1-n2
                type: multiple_choice
                text: "Kai's best friend is Noah. They like to build dens in the woods.\n\nWho is Kai's best friend?"
                say: "Kai's best friend is Noah. They like to build dens in the woods. Who is Kai's best friend?"
                options: ["Noah", "Kai", "Leo"]
                answer: "Noah"
              - id: l1-n3
                type: multiple_choice
                text: "The baby bird fell out of its nest. Lily put it gently back.\n\nWhat did Lily do?"
                say: "The baby bird fell out of its nest. Lily put it gently back. What did Lily do?"
                options: ["put the bird back in its nest", "took the bird home", "built a new nest"]
                answer: "put the bird back in its nest"
              - id: l1-n4
                type: true_false
                text: "Dev ran to the bus stop, but the bus had already gone.\n\nIs it true? Dev missed the bus."
                say: "Dev ran to the bus stop, but the bus had already gone. Is it true? Dev missed the bus."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Isla's tummy rumbled. She opened the fridge and made a sandwich.\n\nWhy did Isla make a sandwich?"
                say: "Isla's tummy rumbled. She opened the fridge and made a sandwich. Why did Isla make a sandwich?"
                options: ["She was hungry.", "She was cold.", "She was scared."]
                answer: "She was hungry."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Freddie found a shiny shell on the beach. He put it in his bucket.\n\nWhere did Freddie find the shell?"
            say: "Freddie found a shiny shell on the beach. He put it in his bucket. Where did Freddie find the shell?"
            options: ["on the beach", "in his bucket", "at school"]
            answer: "on the beach"
          - id: l1-c2
            type: multiple_choice
            text: "At bedtime, Gran read Amir a story about a dragon.\n\nWhen did Gran read the story?"
            say: "At bedtime, Gran read Amir a story about a dragon. When did Gran read the story?"
            options: ["at bedtime", "a dragon", "in the kitchen"]
            answer: "at bedtime"
          - id: l1-c3
            type: multiple_choice
            text: "Leo smiled from ear to ear when he opened his present. It was a new bike.\n\nHow did Leo feel?"
            say: "Leo smiled from ear to ear when he opened his present. It was a new bike. How did Leo feel?"
            options: ["happy", "sad", "angry"]
            answer: "happy"
          - id: l1-c4
            type: multiple_choice
            text: "Ivy painted a picture of her cat. She stuck it on the fridge.\n\nWhere did Ivy stick the picture?"
            say: "Ivy painted a picture of her cat. She stuck it on the fridge. Where did Ivy stick the picture?"
            options: ["on the fridge", "on her cat", "at school"]
            answer: "on the fridge"
          - id: l1-c5
            type: true_false
            text: "Ben's dog barked all night, so nobody in the house could sleep.\n\nIs it true? Everyone in the house slept well."
            say: "Ben's dog barked all night, so nobody in the house could sleep. Is it true? Everyone in the house slept well."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Zac and his sister built a snowman in the garden. They gave it a carrot for a nose.\n\nWho built the snowman?"
            say: "Zac and his sister built a snowman in the garden. They gave it a carrot for a nose. Who built the snowman?"
            options: ["Zac and his sister", "Zac and his dad", "the snowman"]
            answer: "Zac and his sister"

  - n: 2
    title: { de: Fragen stellen, en: Asking questions }
    goal:
      de: "Stell selbst Fragen zu einer Geschichte und fang jede mit einem Fragewort wie wo oder warum an."
      en: "Ask your own questions about a story, and start each one with a question word like where or why."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Hannah fed the ducks at the pond. One duck took bread from her hand.\n\nWhere did Hannah feed the ducks?"
            say: "Hannah fed the ducks at the pond. One duck took bread from her hand. Where did Hannah feed the ducks?"
            options: ["at the pond", "from her hand", "at home"]
            answer: "at the pond"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Josh put up his umbrella. Big drops were falling from the sky.\n\nWhy did Josh put up his umbrella?"
            say: "Josh put up his umbrella. Big drops were falling from the sky. Why did Josh put up his umbrella?"
            options: ["It was raining.", "It was sunny.", "It was windy."]
            answer: "It was raining."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Nina's dog dug a hole in the garden and hid a bone."
            say: "Listen. Nina's dog dug a hole in the garden and hid a bone. What do you think: what question could you ask about this? Have a guess."
            show: { object: dog }
          - text: "Who ... ?   What ... ?   Where ... ?   When ... ?   Why ... ?   How ... ?"
            say: "Good readers ask questions as they read. Start a question with a question word, and end it with a question mark. Choose the word for what you want to know."
          - text: "Nina's dog dug a hole in the garden and hid a bone.\n\nWhere did the dog hide the bone? (The story tells us.)\nHow old is the dog? (The story does not tell us.)"
            say: "Some questions can be answered from the story. Some cannot, because the story does not say. Both are good to ask, but only the first kind can be answered by reading."
          - text: "I wonder why the dog hid the bone."
            say: "You can also ask questions to find out more, or to guess what might happen. I wonder why the dog hid the bone. Maybe he wants to save it for later."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Fill the gap: _ did you go on holiday?\nAnswer: to Spain"
                say: "The answer is a place: to Spain. Which question word fits?"
                frame: "_ did you go on holiday?"
                options: ["Where", "When", "Who"]
                answer: ["Where"]
                hints:
                  - "What kind of answer is to Spain?"
                  - "It is a place. Which word asks for a place?"
                  - "Where"
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Match each question word with what it asks."
                say: "Read each question word. Match it with the kind of answer it asks for."
                pairs:
                  - { left: { text: "Who?" }, right: { text: "a person" } }
                  - { left: { text: "When?" }, right: { text: "a time" } }
                  - { left: { text: "Why?" }, right: { text: "a reason" } }
                hints:
                  - "Think of a question with each word."
                  - "Who is at the door? When is lunch? Why are you sad?"
                  - "Who: a person; When: a time; Why: a reason."
              - id: l2-f3
                type: multiple_choice
                text: "Ali baked a cake for his mum. He put six candles on top.\n\nWhich question can the story answer?"
                say: "Ali baked a cake for his mum. He put six candles on top. Which question can the story answer?"
                options: ["How many candles were on the cake?", "What colour is Ali's kitchen?", "Where does Ali's mum work?"]
                answer: "How many candles were on the cake?"
                option_audio: false
                hints:
                  - "Which question is about something the story says?"
                  - "The story tells us about the candles."
                  - "How many candles were on the cake?"
              - id: l2-f4
                type: fill_in_blank
                text: "Fill the gap: _ is your teacher?\nAnswer: Mrs Jones"
                say: "The answer is a person: Mrs Jones. Which question word fits?"
                frame: "_ is your teacher?"
                options: ["Who", "Where", "Why"]
                answer: ["Who"]
                hints:
                  - "What kind of answer is Mrs Jones?"
                  - "A person. Which word asks for a person?"
                  - "Who"
              - id: l2-f5
                type: sorting
                text: "Finn found a puppy in the rain. He took it home and dried it with a towel.\n\nCan the story answer each question? Sort them."
                say: "Listen. Finn found a puppy in the rain. He took it home and dried it with a towel. Sort the questions: can the story answer them or not?"
                option_audio: false
                bins:
                  - { id: can, show: { text: "the story tells us" }, say: "The story tells us." }
                  - { id: cannot, show: { text: "the story does not say" }, say: "The story does not say." }
                options:
                  - { text: "What did Finn find?", bin: can }
                  - { text: "How did Finn dry the puppy?", bin: can }
                  - { text: "What is the puppy called?", bin: cannot }
                  - { text: "How old is Finn?", bin: cannot }
                hints:
                  - "Read the story again: Finn found a puppy in the rain and dried it with a towel."
                  - "Does the story say the puppy's name or Finn's age?"
                  - "What he found and how he dried it: the story tells us. The name and the age: it does not say."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Fill the gap: _ does the film start?\nAnswer: at six o'clock"
                say: "The answer is a time: at six o'clock. Which question word fits?"
                frame: "_ does the film start?"
                options: ["When", "Where", "Who"]
                answer: ["When"]
                hints: ["Which word asks for a time?"]
              - id: l2-s2
                type: multiple_choice
                text: "Which is written as a question?"
                say: "Read them yourself. Which one is written as a question?"
                options: ["Why is the sky blue?", "Why is the sky blue.", "The sky is blue."]
                answer: "Why is the sky blue?"
                option_audio: false
                hints: ["A question ends with a question mark."]
              - id: l2-s3
                type: multiple_choice
                text: "Rosie went to the farm. She fed the lambs and rode on a tractor.\n\nWhich question can the story answer?"
                say: "Rosie went to the farm. She fed the lambs and rode on a tractor. Which question can the story answer?"
                options: ["What did Rosie feed?", "What is the farmer's name?", "How big is the farm?"]
                answer: "What did Rosie feed?"
                option_audio: false
                hints: ["Which question is about something the story says?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Fill the gap: _ are you crying?\nAnswer: because I fell over"
                say: "The answer is a reason: because I fell over. Which question word fits?"
                frame: "_ are you crying?"
                options: ["Why", "When", "Where"]
                answer: ["Why"]
                hints: ["Which word asks for a reason?"]
              - id: l2-s5
                type: multiple_choice
                text: "The old box in the attic was locked. Nobody knew where the key was.\n\nWhich is an \"I wonder\" question about the story?"
                say: "The old box in the attic was locked. Nobody knew where the key was. Which one is a good I wonder question about the story?"
                options: ["I wonder what is inside the box.", "I wonder what is for lunch.", "I wonder if it is Monday."]
                answer: "I wonder what is inside the box."
                option_audio: false
                hints: ["The question must be about the story."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Fill the gap: _ did you put my book?\nAnswer: on the shelf"
                say: "The answer is a place: on the shelf. Which question word fits?"
                frame: "_ did you put my book?"
                options: ["Where", "Who", "When"]
                answer: ["Where"]
              - id: l2-n2
                type: matching
                text: "Match each question with its answer."
                say: "Read each question. Match it with the answer that fits."
                pairs:
                  - { left: { text: "Who is at the door?" }, right: { text: "the postman" } }
                  - { left: { text: "When is lunch?" }, right: { text: "at twelve o'clock" } }
                  - { left: { text: "Where is the cat?" }, right: { text: "on the sofa" } }
              - id: l2-n3
                type: multiple_choice
                text: "Ezra built a sandcastle. A big wave came and knocked it down.\n\nWhich question can the story answer?"
                say: "Ezra built a sandcastle. A big wave came and knocked it down. Which question can the story answer?"
                options: ["What knocked the sandcastle down?", "How old is Ezra?", "What is Ezra's dog called?"]
                answer: "What knocked the sandcastle down?"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? \"Where is the park\" is written correctly as a question."
                answer: false
              - id: l2-n5
                type: sorting
                text: "Maya made a card for Grandad. She drew a red rocket on the front.\n\nCan the story answer each question? Sort them."
                say: "Listen. Maya made a card for Grandad. She drew a red rocket on the front. Sort the questions: can the story answer them or not?"
                option_audio: false
                bins:
                  - { id: can, show: { text: "the story tells us" }, say: "The story tells us." }
                  - { id: cannot, show: { text: "the story does not say" }, say: "The story does not say." }
                options:
                  - { text: "Who was the card for?", bin: can }
                  - { text: "What did Maya draw?", bin: can }
                  - { text: "Where does Grandad live?", bin: cannot }
                  - { text: "Is it Grandad's birthday?", bin: cannot }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: who-what
            type: multiple_choice
            text: "Lola and her brother went to the swimming pool. Lola swam a whole length.\n\nWho swam a whole length?"
            say: "Lola and her brother went to the swimming pool. Lola swam a whole length. Who swam a whole length?"
            options: ["Lola", "her brother", "the swimming pool"]
            answer: "Lola"
          - id: l2-c2
            part: why
            type: multiple_choice
            text: "Theo's ice lolly was dripping down his hand. The sun was very hot.\n\nWhy was the ice lolly dripping?"
            say: "Theo's ice lolly was dripping down his hand. The sun was very hot. Why was the ice lolly dripping?"
            options: ["It was melting in the sun.", "Theo was crying.", "It was raining."]
            answer: "It was melting in the sun."
          - id: l2-c3
            part: where-when
            type: multiple_choice
            text: "On Friday night, Ava had a sleepover at Zoe's house. They watched a film.\n\nWhere was the sleepover?"
            say: "On Friday night, Ava had a sleepover at Zoe's house. They watched a film. Where was the sleepover?"
            options: ["at Zoe's house", "on Friday night", "at Ava's house"]
            answer: "at Zoe's house"
          - id: l2-c4
            part: question-words
            type: fill_in_blank
            text: "Fill the gap: _ is your party?\nAnswer: on Saturday"
            say: "Read the question and its answer: on Saturday. Which question word fits?"
            frame: "_ is your party?"
            options: ["When", "Who", "Why"]
            answer: ["When"]
          - id: l2-c5
            part: ask-questions
