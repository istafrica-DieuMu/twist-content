# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.sight-reading
skill: lit-en.word-reading.sight-reading
curriculum: en-GB
language: en
title:
  de: Häufige Wörter auf einen Blick lesen
  en: Reading familiar words at a glance
summary: >
  Words a child meets on every page (was, saw, went, there, when, said,
  little) should be read at a glance, without sounding out, so that
  reading flows. Lesson 1 flashes single words and sets them beside
  their look-alikes (was and saw, went and want, there and three);
  lesson 2 flashes short phrases and sentences, asks what they said, and
  ends with the skill check.
metadata:
  year: year-2
  topic: { de: Wörter lesen, en: Reading words }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-en.word-reading.automatic-decoding]
  also_practises: [lit-en.word-reading.exception-words-y2]
  vocabulary: { en: [read at a glance, word, sentence, look-alike word] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: look-alikes, what: { de: "ähnliche Wörter auf einen Blick unterscheiden (was und saw)", en: "telling look-alike words apart at a glance (was and saw)" } }
    - { id: whole-word, what: { de: "das ganze Wort lesen, nicht vom Anfang raten (there und three)", en: "reading the whole word, not guessing from its start (there and three)" } }
    - { id: sentences, what: { de: einen kurzen Satz auf einen Blick genau lesen, en: reading a short sentence at a glance and exactly } }
    - { id: meaning, what: { de: "beim schnellen Lesen verstehen, worum es geht", en: understanding a sentence read quickly } }
  misconceptions:
    - id: reversal
      what: Reads a word back to front or swaps look-alikes (saw for was, no for on, went for want)
      addressed: Learn screen 4 sets look-alike pairs side by side; l1-f1, l1-f2 and l1-s2 offer the look-alike, with feedback in l1-f1
    - id: first-letter-guess
      what: Guesses from the first letter (then for there, when for where)
      addressed: Learn screen 5 says to look at the whole word; l1-f4, l1-s4 and l2-f3 set words with the same first letters side by side
    - id: sounds-out-familiar
      what: Sounds out every word, even ones met many times, so reading is slow
      addressed: words and sentences flash for a moment (flash on every practise card), so the child must see them whole
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Wörter auf einen Blick, en: Words at a glance }
    goal:
      de: "Lies Wörter, die du kennst, auf einen Blick und schau bei ähnlichen Wörtern wie was und saw genau hin."
      en: "Read words you know at a glance, and look carefully at look-alikes like was and saw."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Then tap its picture."
            show: { drawn: letter-card, text: "rain" }
            options: [{ object: rabbit }, { object: rain }, { object: rope }]
            answer: rain
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Does it make sense? \"The duck is in the pond.\""
            say: "Read the sentence. Does it make sense?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "the   cat   elephant"
            say: "Which of these words do you think you read most often in books? The, cat or elephant? Have a guess."
          - text: "Did you know? the is the word we use most in English."
            say: "Did you know? The is the word we use most in English. It is in almost every sentence you read! You see it so often that your eyes know it straight away."
            show: { drawn: letter-card, text: "the" }
          - text: "was   said   went   there   little"
            say: "You have met these words many, many times. Good readers do not sound them out any more. They see the whole word and know it straight away."
            show: { drawn: letter-card, text: "was", flash: 2 }
          - text: "was / saw     on / no     went / want"
            say: "Some words look alike. Was and saw use the same letters, but in a different order. Always read from left to right."
          - text: "there / three     when / where"
            say: "Some words start the same way. Do not guess from the first letter. Look at the whole word, from the first letter to the last."
          - text: "The little cat went home."
            say: "Now a whole sentence. Read it in one go, like talking: The little cat went home."
            show: { drawn: letter-card, text: "The little cat went home.", flash: 3 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which word did you see?"
                say: "Look at the card. It will hide. Which word did you see?"
                show: { drawn: letter-card, text: "was", flash: 2 }
                options: ["was", "saw", "has"]
                answer: "was"
                option_audio: false
                feedback:
                  saw: "Saw has the same letters the other way round. The card said was: w first."
                hints:
                  - "Look at the first letter of the card."
                  - "The card started with w."
                  - "Was."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which word did you see?"
                say: "Look at the card. It will hide. Which word did you see?"
                show: { drawn: letter-card, text: "went", flash: 2 }
                options: ["want", "went", "wet"]
                answer: "went"
                option_audio: false
                feedback:
                  wet: "Wet is what you get in the rain! The card had an n before the t: went."
                hints:
                  - "All three start with w."
                  - "Look at the second letter: e or a?"
                  - "Went."
              - id: l1-f3
                type: image_multiple_choice
                text: "Read the word quickly. Tap the picture."
                say: "Read the word before it hides. Then tap its picture."
                show: { drawn: letter-card, text: "baby", flash: 2 }
                options: [{ object: ball }, { object: bed }, { object: baby }]
                answer: baby
                hints:
                  - "All three start with b."
                  - "The word ended with y."
                  - "Baby."
              - id: l1-f4
                type: multiple_choice
                text: "Which word did you see?"
                say: "Look at the card. It will hide. Which word did you see?"
                show: { drawn: letter-card, text: "there", flash: 2 }
                options: ["three", "there", "then"]
                answer: "there"
                option_audio: false
                feedback:
                  three: "Three starts with t h r. The card said there: t h e r e."
                hints:
                  - "All three start with t h."
                  - "Look at the letter after t h."
                  - "There."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap every word that says was."
                say: "Tap every card that says was. Read each one from left to right."
                show: { drawn: letter-card, text: "was saw was has was" }
                spans: ["was"]
                hints:
                  - "Was starts with w."
                  - "Saw starts with s, has starts with h."
                  - "The first, third and fifth cards."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which word did you see?"
                say: "Look at the card. It will hide. Which word did you see?"
                show: { drawn: letter-card, text: "said", flash: 2 }
                options: ["sad", "said", "sand"]
                answer: "said"
                option_audio: false
                hints: ["The word has two vowels in the middle."]
              - id: l1-s2
                type: multiple_choice
                text: "Which word did you see?"
                say: "Look at the card. It will hide. Which word did you see?"
                show: { drawn: letter-card, text: "no", flash: 1.5 }
                options: ["on", "no"]
                answer: "no"
                option_audio: false
                hints: ["Which letter came first?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Read the word quickly. Tap the picture."
                say: "Read the word before it hides. Then tap its picture."
                show: { drawn: letter-card, text: "house", flash: 2 }
                options: [{ object: hedgehog }, { object: house }, { object: mouse }]
                answer: house
                hints: ["It starts with h. Look at the middle: o u."]
              - id: l1-s4
                type: multiple_choice
                text: "Which word did you see?"
                say: "Look at the card. It will hide. Which word did you see?"
                show: { drawn: letter-card, text: "where", flash: 2 }
                options: ["when", "where", "were"]
                answer: "where"
                option_audio: false
                hints: ["Look at the end of the word."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap every word that says went."
                say: "Tap every card that says went."
                show: { drawn: letter-card, text: "want went wet went" }
                spans: ["went"]
                hints: ["Two cards. Look for the e."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which word did you see?"
                say: "Look at the card. It will hide. Which word did you see?"
                show: { drawn: letter-card, text: "saw", flash: 1.5 }
                options: ["was", "saw", "sat"]
                answer: "saw"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which word did you see?"
                say: "Look at the card. It will hide. Which word did you see?"
                show: { drawn: letter-card, text: "come", flash: 1.5 }
                options: ["came", "come", "cone"]
                answer: "come"
                option_audio: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Read the word quickly. Tap the picture."
                say: "Read the word before it hides. Then tap its picture."
                show: { drawn: letter-card, text: "school", flash: 1.5 }
                options: [{ object: school }, { object: shop }, { object: shoe }]
                answer: school
              - id: l1-n4
                type: multiple_choice
                text: "Which word did you see?"
                say: "Look at the card. It will hide. Which word did you see?"
                show: { drawn: letter-card, text: "they", flash: 1.5 }
                options: ["then", "the", "they"]
                answer: "they"
                option_audio: false
              - id: l1-n5
                type: highlight_in_text
                text: "Tap every word that says on."
                say: "Tap every card that says on."
                show: { drawn: letter-card, text: "no on on no on" }
                spans: ["on"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "was", flash: 1.5 }
            options: ["saw", "was", "wax"]
            answer: "was"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "when", flash: 1.5 }
            options: ["when", "where", "then"]
            answer: "when"
            option_audio: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Read the word quickly. Tap the picture."
            say: "Read the word before it hides. Then tap its picture."
            show: { drawn: letter-card, text: "dad", flash: 1.5 }
            options: [{ object: dog }, { object: dad }, { object: duck }]
            answer: dad
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "put", flash: 1.5 }
            options: ["but", "pot", "put"]
            answer: "put"
            option_audio: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Read the word quickly. Tap the picture."
            say: "Read the word before it hides. Then tap its picture."
            show: { drawn: letter-card, text: "goat", flash: 1.5 }
            options: [{ object: boat }, { object: ghost }, { object: goat }]
            answer: goat
            option_audio: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tap every word that says said."
            say: "Tap every card that says said."
            show: { drawn: letter-card, text: "said sad said sand" }
            spans: ["said"]

  - n: 2
    title: { de: Sätze auf einen Blick, en: Sentences at a glance }
    goal:
      de: "Lies kurze Sätze wie we went to the park in einem Zug und prüf trotzdem jedes Wort."
      en: "Read short sentences in one go, like we went to the park, and still check every word."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "there", flash: 2 }
            options: ["there", "three", "these"]
            answer: "there"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "saw", flash: 2 }
            options: ["saw", "was"]
            answer: "saw"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "We went to the park."
            say: "This sentence will hide in a moment. What do you think: can you read it in one go, without sounding out any words? Have a go!"
            show: { drawn: letter-card, text: "We went to the park.", flash: 3 }
          - text: "We went to the park."
            say: "Did you manage it? Read the sentence in one go, like talking. You know every word, so you do not need to sound them out. We went to the park."
            show: { drawn: letter-card, text: "We went to the park.", flash: 3 }
          - text: "They saw a big dog."
            say: "When you read fast, you still need to read every word. Here they saw a big dog. Not a cat. Not a little dog. Check each word as you go."
          - text: "Stop at the full stop."
            say: "A full stop tells you the sentence has ended. Take a little breath, then read on."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Read the sentence quickly. What was it about?"
                say: "Read the sentence before it hides. Then tap what it was about."
                show: { drawn: letter-card, text: "They went to see the cow.", flash: 3 }
                options: [{ object: cow }, { object: cat }, { object: car }]
                answer: cow
                hints:
                  - "Look at the last word."
                  - "It was an animal on a farm."
                  - "The cow."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which sentence did you see?"
                say: "Read the sentence before it hides. Which one did you see? Read them yourself."
                show: { drawn: letter-card, text: "I saw a fox.", flash: 3 }
                options: ["I saw a fox.", "I was a fox.", "I saw a box."]
                answer: "I saw a fox."
                option_audio: false
                feedback:
                  "I was a fox.": "Was and saw have the same letters. The card said saw: s first."
                hints:
                  - "Check the second word."
                  - "Then check the last word."
                  - "I saw a fox."
              - id: l2-f3
                type: multiple_choice
                text: "Which sentence did you see?"
                say: "Read the sentence before it hides. Which one did you see? Read them yourself."
                show: { drawn: letter-card, text: "Where is my hat?", flash: 3 }
                options: ["When is my hat?", "Where is my hat?", "Where is my cat?"]
                answer: "Where is my hat?"
                option_audio: false
                hints:
                  - "Two of them start with Where."
                  - "Then check the last word: hat or cat?"
                  - "Where is my hat?"
              - id: l2-f4
                type: true_false
                text: "Does it make sense? \"The little fish went for a walk.\""
                say: "Read the sentence quickly. Does it make sense?"
                answer: false
                hints:
                  - "Read it in one go."
                  - "Can a fish walk?"
                  - "No, it does not make sense."
              - id: l2-f5
                type: image_multiple_choice
                text: "Read the sentence quickly. What was it about?"
                say: "Read the sentence before it hides. Then tap what it was about."
                show: { drawn: letter-card, text: "Mum said we can have some cake.", flash: 3 }
                options: [{ object: cake }, { object: cat }, { object: kite }]
                answer: cake
                hints:
                  - "What did Mum want them to have?"
                  - "Look at the end of the sentence."
                  - "Cake."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which sentence did you see?"
                say: "Read the sentence before it hides. Which one did you see? Read them yourself."
                show: { drawn: letter-card, text: "We were at the shop.", flash: 3 }
                options: ["We were at the shop.", "We went to the shop.", "We were at the ship."]
                answer: "We were at the shop."
                option_audio: false
                hints: ["Check the second word and the last word."]
              - id: l2-s2
                type: true_false
                text: "Does it make sense? \"There are three ducks on the water.\""
                say: "Read the sentence quickly. Does it make sense?"
                answer: true
                hints: ["Ducks swim on water."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Read the sentence quickly. What was it about?"
                say: "Read the sentence before it hides. Then tap what it was about."
                show: { drawn: letter-card, text: "Look at the moon in the sky.", flash: 3 }
                options: [{ object: sun }, { object: moon }, { object: star }]
                answer: moon
                hints: ["What can you see in the sky at night?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tap the word that does not fit."
                say: "Read the sentence. Tap the word that does not fit."
                show: { drawn: letter-card, text: "They went to school on a banana" }
                spans: ["banana"]
                hints: ["How do you get to school?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which sentence did you see?"
                say: "Read the sentence before it hides. Which one did you see? Read them yourself."
                show: { drawn: letter-card, text: "Here is our house.", flash: 3 }
                options: ["Here is our house.", "There is our house.", "Here is our horse."]
                answer: "Here is our house."
                option_audio: false
                hints: ["Check the first word and the last word."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Read the sentence quickly. What was it about?"
                say: "Read the sentence before it hides. Then tap what it was about."
                show: { drawn: letter-card, text: "My friend has a pet rabbit.", flash: 2.5 }
                options: [{ object: rabbit }, { object: rose }, { object: rope }]
                answer: rabbit
              - id: l2-n2
                type: true_false
                text: "Does it make sense in a story? \"Once upon a time a cat said hello to a pig.\""
                say: "Read the sentence quickly. Does it make sense in a story?"
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Which sentence did you see?"
                say: "Read the sentence before it hides. Which one did you see? Read them yourself."
                show: { drawn: letter-card, text: "\"Come here,\" said Dad.", flash: 2.5 }
                options: ["\"Come here,\" said Dad.", "\"Come there,\" said Dad.", "\"Come here,\" said Mum."]
                answer: "\"Come here,\" said Dad."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Does it make sense? \"The children put the sun in a box.\""
                say: "Read the sentence quickly. Does it make sense?"
                answer: false
              - id: l2-n5
                type: highlight_in_text
                text: "Tap the word that does not fit."
                say: "Read the sentence. Tap the word that does not fit."
                show: { drawn: letter-card, text: "We like to swim in the sofa" }
                spans: ["sofa"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: look-alikes
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "want", flash: 1.5 }
            options: ["went", "want", "wand"]
            answer: "want"
            option_audio: false
          - id: l2-c2
            part: whole-word
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "three", flash: 1.5 }
            options: ["there", "tree", "three"]
            answer: "three"
            option_audio: false
          - id: l2-c3
            part: meaning
            type: image_multiple_choice
            text: "Read the sentence quickly. What was it about?"
            say: "Read the sentence before it hides. Then tap what it was about."
            show: { drawn: letter-card, text: "They saw a frog in the garden.", flash: 2.5 }
            options: [{ object: fox }, { object: frog }, { object: fish }]
            answer: frog
            option_audio: false
          - id: l2-c4
            part: sentences
            type: multiple_choice
            text: "Which sentence did you see?"
            say: "Read the sentence before it hides. Which one did you see? Read them yourself."
            show: { drawn: letter-card, text: "When was the party?", flash: 2.5 }
            options: ["Where was the party?", "When was the party?", "When saw the party?"]
            answer: "When was the party?"
            option_audio: false
          - id: l2-c5
            part: meaning
            type: true_false
            text: "Does it make sense? \"The little boy said thank you for his present.\""
            say: "Read the sentence quickly. Does it make sense?"
            answer: true
          - id: l2-c6
            part: look-alikes
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "of", flash: 1.5 }
            options: ["off", "of", "for"]
            answer: "of"
            option_audio: false
          - id: l2-c7
            part: look-alikes
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "now", flash: 1.5 }
            options: ["own", "won", "now"]
            answer: "now"
            option_audio: false
          - id: l2-c8
            part: look-alikes
            type: highlight_in_text
            text: "Tap every word that says top."
            say: "Tap every card that says top. Read each one from left to right."
            show: { drawn: letter-card, text: "top pot top tap pot" }
            spans: ["top"]
          - id: l2-c9
            part: look-alikes
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "who", flash: 1.5 }
            options: ["how", "who", "why"]
            answer: "who"
            option_audio: false
          - id: l2-c10
            part: whole-word
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "little", flash: 1.5 }
            options: ["listen", "lift", "little"]
            answer: "little"
            option_audio: false
          - id: l2-c11
            part: whole-word
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "could", flash: 1.5 }
            options: ["could", "cold", "cloud"]
            answer: "could"
            option_audio: false
          - id: l2-c12
            part: whole-word
            type: multiple_choice
            text: "Which word did you see?"
            say: "Look at the card. It will hide. Which word did you see?"
            show: { drawn: letter-card, text: "because", flash: 1.5 }
            options: ["become", "before", "because"]
            answer: "because"
            option_audio: false
          - id: l2-c13
            part: whole-word
            type: highlight_in_text
            text: "Tap every word that says where."
            say: "Tap every card that says where. Look at the whole word."
            show: { drawn: letter-card, text: "where were when where wear" }
            spans: ["where"]
          - id: l2-c14
            part: sentences
            type: multiple_choice
            text: "Which sentence did you see?"
            say: "Read the sentence before it hides. Which one did you see? Read them yourself."
            show: { drawn: letter-card, text: "The dog ran home.", flash: 2.5 }
            options: ["The dog came home.", "The dog ran home.", "The dog ran here."]
