# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.narratives
skill: lit-en.composition.narratives
curriculum: en-GB
language: en
title:
  de: Geschichten schreiben
  en: Writing stories
summary: >
  Children build stories about their own experiences and about others,
  real and imagined. Lesson 1 plans a story: who is in it (characters),
  where it happens (setting), the problem and how it is solved, and
  whether it is told with I (my own story) or with he, she or a name.
  Lesson 2 builds a story sentence by sentence: a good opening, time
  words, a middle that keeps to the past tense, and an ending that
  solves the problem; it ends with the skill check. Children order,
  choose and complete sentences. The skill check marks what a screen can
  mark: characters and setting, problem and solution, the opening and
  order, the past tense and who tells the story. Writing their own story
  is left to Practise; free writing is not marked yet.
metadata:
  year: year-2
  topic: { de: Texte schreiben, en: Writing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.composition.short-narrative, lit-en.grammar.tense-progressive]
  also_practises: [lit-en.comprehension.sequence, lit-en.grammar.noun-phrases]
  vocabulary: { en: [story, character, setting, problem, solution, beginning, middle, ending, opening, I, he, she, past tense, plan] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: characters-setting, what: { de: "Figuren und Ort einer Geschichte", en: "the characters and the setting of a story" } }
    - { id: problem-solution, what: { de: "ein Problem und seine Lösung", en: "a problem and its solution" } }
    - { id: opening-order, what: { de: "ein guter Anfang, Zeitwörter und die Reihenfolge", en: "a good opening, time words and the order of a story" } }
    - { id: past-tense, what: { de: "die ganze Geschichte in der Vergangenheit erzählen", en: "keeping the whole story in the past tense" } }
    - { id: voice, what: { de: "mit I oder mit he, she oder einem Namen erzählen und dabei bleiben", en: "telling it with I or with he, she or a name, and keeping to it" } }
  misconceptions:
    - id: no-problem
      what: Writes a list of events with no problem to solve (we went to the park, we had lunch, we went home)
      addressed: Learn screen 4 of lesson 1; l1-f3, l1-s3 and l2-f5 find or choose the problem and the solution, with feedback in l1-f3
    - id: voice-switch
      what: Starts a story with I and switches to she, or mixes who is telling it
      addressed: Learn screen 5 of lesson 1; l1-f5, l1-s5 and l1-n4 decide who tells the story and which sentence keeps the same voice
    - id: tense-drift
      what: Slips from the past tense into the present in the middle of a story
      addressed: l2-f3, l2-s3 and l2-n3 choose the verb that keeps the story in the past, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Eine Geschichte planen, en: Planning a story }
    goal:
      de: "Plane eine Geschichte mit Figuren, einem Ort und einem Problem, das gelöst wird, so wie Lily, die ihren Hund Pip sucht."
      en: "Plan a story with characters, a setting and a problem to solve, like Lily looking for her dog Pip."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Put the sentences in order to tell a short story."
            options: ["He got very wet.", "It started to rain.", "Max went outside."]
            slot_count: 3
            answer: ["Max went outside.", "It started to rain.", "He got very wet."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Yesterday the cat _ on the wall."
            say: "Which verb finishes the sentence? Read them yourself."
            options: ["was sitting", "is sitting", "sits"]
            answer: "was sitting"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Lily and her dog Pip went to the beach."
            say: "Lily and her dog Pip went to the beach. What do you think: what could go wrong? Have a guess, then listen to the story."
            show: { object: dog }
          - text: "Lily and her dog Pip went to the beach. Pip ran off to chase a seagull. Lily could not find him anywhere! At last she heard a bark. Pip was hiding behind a rock. Lily gave him a big hug."
            say: "Listen to the story. Lily and her dog Pip went to the beach. Pip ran off to chase a seagull. Lily could not find him anywhere! At last she heard a bark. Pip was hiding behind a rock. Lily gave him a big hug."
            show: { object: dog }
          - text: "characters: Lily, Pip\nsetting: the beach"
            say: "Every story has characters: the people or animals in it. Here they are Lily and Pip. It has a setting: where it happens. Here, the beach."
          - text: "problem: Pip runs off.\nsolution: Lily finds him behind a rock."
            say: "A good story has a problem, something that goes wrong. Pip runs off. Then the problem is solved: Lily finds him. Without a problem, a story is just a list."
          - text: "I went to the beach.   Lily went to the beach."
            say: "You can write about yourself, with I: I went to the beach. Or about someone else, real or made up, with a name or he or she: Lily went to the beach. Choose one and keep to it."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Lily and her dog Pip went to the beach. Pip ran off to chase a seagull.\n\nWhat is the setting of this story?"
                options: ["the beach", "Lily's school", "a forest"]
                answer: "the beach"
                option_audio: false
                hints:
                  - "The setting is where the story happens."
                  - "Where did Lily and Pip go?"
                  - "The beach."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Character or setting? Sort them."
                say: "Read each card. Is it someone in a story, or a place where a story happens? Put it in the right group."
                option_audio: false
                bins:
                  - { id: character, show: { text: "character" }, say: "Character." }
                  - { id: setting, show: { text: "setting" }, say: "Setting." }
                options:
                  - { text: "a brave knight", bin: character }
                  - { text: "a dark cave", bin: setting }
                  - { text: "a friendly dragon", bin: character }
                  - { text: "a busy park", bin: setting }
                hints:
                  - "Is it a someone or a somewhere?"
                  - "A knight and a dragon can talk and move."
                  - "Characters: knight, dragon. Settings: cave, park."
              - id: l1-f3
                type: multiple_choice
                text: "Which of these is a problem for a story?"
                options: ["Ella's kite gets stuck in a tree.", "Ella has a red kite.", "Ella goes home."]
                answer: "Ella's kite gets stuck in a tree."
                option_audio: false
                feedback:
                  "Ella has a red kite.": "That tells you about the kite, but nothing goes wrong. A problem is something that needs sorting out."
                hints:
                  - "A problem is something that goes wrong."
                  - "Which one would Ella want to fix?"
                  - "The kite gets stuck in a tree."
              - id: l1-f4
                type: multiple_choice
                text: "Ella's kite gets stuck in a tree. Which is a good solution?"
                options: ["Her mum helps her shake the branch, and the kite falls down.", "Ella has a red coat.", "The tree is tall."]
                answer: "Her mum helps her shake the branch, and the kite falls down."
                option_audio: false
                hints:
                  - "A solution sorts out the problem."
                  - "How could Ella get the kite back?"
                  - "Her mum helps her shake the branch."
              - id: l1-f5
                type: multiple_choice
                text: "I fell off my bike at the park.\nWho is telling this story?"
                options: ["the writer, about themselves", "someone else, about a girl called Lily"]
                answer: "the writer, about themselves"
                option_audio: false
                hints:
                  - "Look at the first word."
                  - "I means the writer."
                  - "The writer, about themselves."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is a character?"
                options: ["a cheeky monkey", "a hot desert", "a tall castle"]
                answer: "a cheeky monkey"
                option_audio: false
                feedback:
                  "a tall castle": "A castle cannot talk or laugh, so it is not a character. It could be the setting!"
                hints: ["A character is someone in the story."]
              - id: l1-s2
                type: multiple_choice
                text: "Which setting fits a story about a lost penguin?"
                options: ["an icy beach at the South Pole", "a hot sandy desert", "a busy kitchen"]
                answer: "an icy beach at the South Pole"
                option_audio: false
                hints: ["Where do penguins live?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which story plan has a problem?"
                options: ["Tom goes to the shop. He loses his money. A lady finds it.", "Tom goes to the shop. He buys milk. He goes home.", "Tom likes milk. Tom has a cat."]
                answer: "Tom goes to the shop. He loses his money. A lady finds it."
                option_audio: false
                hints: ["In which plan does something go wrong?"]
              - id: l1-s4
                type: ordering
                text: "Put the story plan in order."
                say: "Put the parts of the plan in order: the beginning, the problem, then the solution."
                options: ["A boy finds the hat on a bench.", "Gran loses her hat at the park.", "Gran goes to the park."]
                slot_count: 3
                answer: ["Gran goes to the park.", "Gran loses her hat at the park.", "A boy finds the hat on a bench."]
                option_audio: false
                hints: ["The solution comes last."]
              - id: l1-s5
                type: multiple_choice
                text: "Raj's story starts: \"Raj went to the zoo.\" Which sentence keeps to the same way of telling it?"
                options: ["He saw a huge elephant.", "I saw a huge elephant."]
                answer: "He saw a huge elephant."
                option_audio: false
                hints: ["The story is about Raj. It is not told with I."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Character or setting? Sort them."
                say: "Read each card. Is it someone in a story, or a place where a story happens? Put it in the right group."
                option_audio: false
                bins:
                  - { id: character, show: { text: "character" }, say: "Character." }
                  - { id: setting, show: { text: "setting" }, say: "Setting." }
                options:
                  - { text: "a grumpy giant", bin: character }
                  - { text: "a snowy mountain", bin: setting }
                  - { text: "my best friend", bin: character }
                  - { text: "our classroom", bin: setting }
              - id: l1-n2
                type: multiple_choice
                text: "Which of these is a problem for a story?"
                options: ["The class hamster escapes from its cage.", "The hamster is brown.", "The hamster likes seeds."]
                answer: "The class hamster escapes from its cage."
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "The hamster escapes. Which is a good solution?"
                options: ["The children find it asleep in a welly.", "The hamster has a wheel.", "It is Monday."]
                answer: "The children find it asleep in a welly."
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "My story starts: \"I woke up early on my birthday.\" Which sentence keeps to the same way of telling it?"
                options: ["I ran downstairs to see my presents.", "She ran downstairs to see her presents."]
                answer: "I ran downstairs to see my presents."
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "A story can be about something that really happened to me."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is a setting?"
            options: ["a spooky castle", "a kind witch", "a little mouse"]
            answer: "a spooky castle"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which story plan has a problem?"
            options: ["Jen plants a seed. A bird eats it. She plants another and covers it with a net.", "Jen plants a seed. She waters it. It grows."]
            answer: "Jen plants a seed. A bird eats it. She plants another and covers it with a net."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "The setting of a story is the people in it."
            say: "Read it. Is it true?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Ollie and his gran went to the seaside. A crab nipped Ollie's toe!\n\nWhat is the problem in this story?"
            say: "Read the story. What is the problem?"
            options: ["Ollie went to the seaside.", "A crab nipped Ollie's toe.", "Ollie has a gran."]
            answer: "A crab nipped Ollie's toe."
            option_audio: false
          - id: l1-c5
            type: sorting
            text: "Who or where? Sort them."
            say: "Read each card yourself. Is it a character or a setting? Sort them."
            option_audio: false
            bins:
              - { id: character, show: { text: "character" }, say: "Character." }
              - { id: setting, show: { text: "setting" }, say: "Setting." }
            options:
              - { text: "a deep, dark forest", bin: setting }
              - { text: "a lonely robot", bin: character }
              - { text: "the moon", bin: setting }
              - { text: "Mrs Green", bin: character }
          - id: l1-c6
            type: multiple_choice
            text: "Which sentence tells the writer's own story?"
            options: ["Jay found a frog in the garden.", "I found a frog in the garden."]
            answer: "I found a frog in the garden."
            option_audio: false

  - n: 2
    title: { de: Satz für Satz erzählen, en: Telling it sentence by sentence }
    goal:
      de: "Bau eine Geschichte Satz für Satz, mit einem guten Anfang, Zeitwörtern wie suddenly und einem guten Ende."
      en: "Build a story one sentence at a time, with a good opening, time words like suddenly, and a happy ending."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is a character?"
            options: ["a clever fox", "a deep river", "a windy hill"]
            answer: "a clever fox"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which of these is a problem for a story?"
            options: ["Ben's boat floats away down the river.", "Ben's boat is blue."]
            answer: "Ben's boat floats away down the river."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "One sunny morning, Zak and his sister went to the woods."
            say: "Here is the first sentence of a story. What do you think: what does it tell you? Have a guess."
          - text: "One sunny morning, Zak and his sister went to the woods."
            say: "It tells you three things! Start with an opening that says when, who and where. One sunny morning: when. Zak and his sister: who. The woods: where."
          - text: "Did you know? Once upon a time ..."
            say: "Did you know? Lots of stories start with Once upon a time. Storytellers in English have started stories that way for more than six hundred years!"
          - text: "First ...   Then ...   Suddenly ...   In the end ..."
            say: "Time words move the story on. First, then, after that. Suddenly is great for when the problem starts. In the end leads to the solution."
          - text: "Zak was climbing a tree when he heard a loud crack."
            say: "Tell the story in the past tense, all the way through. You can use the progressive too: Zak was climbing a tree. Keep every verb in the past."
          - text: "In the end, they found the path home and laughed all the way back."
            say: "Finish with an ending that solves the problem and says how the characters feel. Say each sentence out loud before you write it."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is the best opening for a story?"
                options: ["One snowy evening, Nia and her grandad built a snowman in the garden.", "The end.", "Snow."]
                answer: "One snowy evening, Nia and her grandad built a snowman in the garden."
                option_audio: false
                hints:
                  - "A good opening says when, who and where."
                  - "Which one tells you all three?"
                  - "One snowy evening, Nia and her grandad built a snowman."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which time word shows that the problem starts all of a sudden?"
                say: "Which time word shows that the problem starts all of a sudden?"
                frame: "Nia was patting the snow. _, the snowman's head fell off!"
                options: ["Suddenly", "In the end", "Once upon a time"]
                answer: ["Suddenly"]
                hints:
                  - "The problem happens fast."
                  - "Which word means all at once?"
                  - "Suddenly."
              - id: l2-f3
                type: multiple_choice
                text: "Nia put the head back on. Then she _ a carrot for the nose."
                say: "Which verb keeps the story in the past tense? Read them yourself."
                options: ["found", "finds", "will find"]
                answer: "found"
                option_audio: false
                feedback:
                  finds: "Finds is the present tense. The story is in the past: put, found."
                hints:
                  - "Look at the verb before: put."
                  - "Keep every verb in the past."
                  - "Found."
              - id: l2-f4
                type: ordering
                text: "Put Nia's story in order."
                options: ["Suddenly, the snowman's head fell off!", "One snowy evening, Nia built a snowman.", "In the end, Grandad helped her put it back, and they cheered."]
                slot_count: 3
                answer: ["One snowy evening, Nia built a snowman.", "Suddenly, the snowman's head fell off!", "In the end, Grandad helped her put it back, and they cheered."]
                option_audio: false
                hints:
                  - "The opening says when."
                  - "Suddenly brings the problem; in the end brings the solution."
                  - "Opening, suddenly, in the end."
              - id: l2-f5
                type: multiple_choice
                text: "Which ending solves the problem?\nThe problem: the snowman's head fell off."
                options: ["Grandad helped her put it back, and they cheered.", "It was cold outside.", "Nia has a blue hat."]
                answer: "Grandad helped her put it back, and they cheered."
                option_audio: false
                hints:
                  - "An ending sorts out the problem."
                  - "Which one fixes the snowman?"
                  - "Grandad helped her put it back."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which is the best opening for a story?"
                options: ["Last Saturday, I went fishing with my uncle at the lake.", "Fishing is fun.", "I like fish."]
                answer: "Last Saturday, I went fishing with my uncle at the lake."
                option_audio: false
                hints: ["Look for when, who and where."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which time words show the problem is being solved at the end?"
                say: "Which time words show the problem is being solved at the end?"
                frame: "We looked everywhere for the keys. _, we found them in the fridge!"
                options: ["In the end", "Suddenly", "One day"]
                answer: ["In the end"]
                hints: ["This is the ending of the story."]
              - id: l2-s3
                type: multiple_choice
                text: "The wind howled. The children _ under the blanket."
                say: "Which verb keeps the story in the past tense? Read them yourself."
                options: ["hid", "hide", "are hiding"]
                answer: "hid"
                option_audio: false
                hints: ["Howled is past."]
              - id: l2-s4
                type: ordering
                text: "Put the story in order."
                options: ["In the end, a kind man lifted it down.", "One day, a kitten climbed up a lamp post.", "Then it could not get down."]
                slot_count: 3
                answer: ["One day, a kitten climbed up a lamp post.", "Then it could not get down.", "In the end, a kind man lifted it down."]
                option_audio: false
                hints: ["One day starts it; in the end finishes it."]
              - id: l2-s5
                type: multiple_choice
                text: "Which sentence tells you how a character feels?"
                options: ["Zak felt scared when the branch cracked.", "The tree was tall.", "It was Tuesday."]
                answer: "Zak felt scared when the branch cracked."
                option_audio: false
                hints: ["Look for a feeling word."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is the best opening for a story?"
                options: ["Long ago, in a tiny cottage by the sea, lived a fisherman called Fergus.", "The sea.", "Fergus had a hat."]
                answer: "Long ago, in a tiny cottage by the sea, lived a fisherman called Fergus."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Which time word fits the story?"
                say: "Read the story. Which time word fits?"
                frame: "Fergus was mending his net. _, a huge wave crashed over the boat!"
                options: ["Suddenly", "In the end", "Last week"]
                answer: ["Suddenly"]
              - id: l2-n3
                type: multiple_choice
                text: "The wave knocked Fergus over. He _ onto the side of the boat."
                say: "Which verb keeps the story in the past tense? Read them yourself."
                options: ["held", "holds", "is holding"]
                answer: "held"
                option_audio: false
              - id: l2-n4
                type: ordering
                text: "Put Fergus's story in order."
                options: ["In the end, he rowed safely home.", "Fergus went out in his boat.", "Suddenly, a huge wave crashed over him."]
                slot_count: 3
                answer: ["Fergus went out in his boat.", "Suddenly, a huge wave crashed over him.", "In the end, he rowed safely home."]
                option_audio: false
              - id: l2-n5
                type: multiple_choice
                text: "Which ending solves the problem?\nThe problem: Sam's balloon floated away."
                options: ["The man at the fair gave Sam a new balloon, and Sam smiled.", "The balloon was red.", "Sam had a drink."]
                answer: "The man at the fair gave Sam a new balloon, and Sam smiled."
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: problem-solution
            type: multiple_choice
            text: "Which is a problem for a story?"
            options: ["Amir's lunchbox falls in the pond.", "Amir has a lunchbox.", "Amir eats an apple."]
            answer: "Amir's lunchbox falls in the pond."
            option_audio: false
          - id: l2-c2
            part: opening-order
            type: multiple_choice
            text: "Which is the best opening for a story?"
            options: ["One rainy afternoon, Kit and her friend Sol found a map in the attic.", "A map.", "Kit likes maps."]
            answer: "One rainy afternoon, Kit and her friend Sol found a map in the attic."
            option_audio: false
          - id: l2-c3
            part: past-tense
            type: multiple_choice
            text: "Kit opened the map. She _ a big red X."
            say: "Which verb keeps the story in the past tense? Read them yourself."
            options: ["saw", "sees", "is seeing"]
            answer: "saw"
            option_audio: false
          - id: l2-c4
            part: opening-order
            type: ordering
            text: "Put the story in order."
            options: ["In the end, they dug up a box of old toys.", "Kit and Sol found a map.", "They followed it to the bottom of the garden."]
            slot_count: 3
            answer: ["Kit and Sol found a map.", "They followed it to the bottom of the garden.", "In the end, they dug up a box of old toys."]
            option_audio: false
          - id: l2-c5
            part: voice
            type: multiple_choice
            text: "My story starts: \"I lost my tooth at school.\" Which sentence keeps to the same way of telling it?"
            options: ["My teacher gave me an envelope to put it in.", "Her teacher gave her an envelope to put it in."]
            answer: "My teacher gave me an envelope to put it in."
            option_audio: false
          - id: l2-c6
            part: characters-setting
            type: sorting
            text: "Who or where? Sort them."
            say: "Read each card yourself. Is it a character or a setting? Sort them."
            option_audio: false
            bins:
              - { id: character, show: { text: "character" }, say: "Character." }
              - { id: setting, show: { text: "setting" }, say: "Setting." }
            options:
              - { text: "a sandy island", bin: setting }
              - { text: "a lost puppy", bin: character }
              - { text: "the school playground", bin: setting }
              - { text: "Grandpa Joe", bin: character }
          - id: l2-c7
            part: characters-setting
            type: multiple_choice
            text: "Which setting fits a story about a pirate?"
            options: ["a dentist's waiting room", "a ship on a stormy sea", "a library"]
            answer: "a ship on a stormy sea"
            option_audio: false
          - id: l2-c8
            part: characters-setting
            type: multiple_choice
            text: "Mo and his cat Tiger lived in a flat above a bakery.\n\nWho are the characters?"
            say: "Read the start of the story. Who are the characters?"
            options: ["the flat and the bakery", "Mo and the bakery", "Mo and Tiger"]
            answer: "Mo and Tiger"
            option_audio: false
          - id: l2-c9
            part: characters-setting
            type: true_false
            text: "A character in a story can be an animal."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c10
            part: problem-solution
            type: multiple_choice
            text: "Which is a good solution?\nThe problem: Leo's ball goes over the fence."
            options: ["The fence is brown.", "Leo asks his neighbour, and she throws it back.", "Leo's ball is green."]
