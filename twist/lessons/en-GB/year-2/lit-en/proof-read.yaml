# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.proof-read
skill: lit-en.composition.proof-read
curriculum: en-GB
language: en
title:
  de: Texte auf Fehler prüfen
  en: Proof-reading
summary: >
  Proof-reading means reading your writing slowly, looking for one kind
  of mistake at a time, and putting it right. Lesson 1 checks capital
  letters, full stops and question marks, then spelling of words children
  know (because, said, they); lesson 2 checks grammar (missing words,
  past tense that changes, we was) and ends with the skill check on short
  pieces written by a Year 2 child. Children find the mistake, then
  choose the correction.
metadata:
  year: year-2
  topic: { de: Texte schreiben, en: Writing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.composition.reread-check]
  also_practises: [lit-en.grammar.sentence-punctuation, lit-en.grammar.standard-english]
  vocabulary: { en: [proof-read, mistake, correct, capital letter, full stop, question mark, spelling, tense] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: punctuation, what: { de: "fehlende Großbuchstaben und Satzschlusszeichen finden", en: "finding missing capital letters and end marks" } }
    - { id: spelling, what: { de: falsch geschriebene Wörter finden, en: finding words that are spelt wrong } }
    - { id: grammar, what: { de: "fehlende Wörter, falsche Zeitform und Nicht-Standardenglisch finden", en: "finding missing words, the wrong tense and non-Standard English" } }
    - { id: correct, what: { de: "die richtige Verbesserung wählen, ohne einen neuen Fehler", en: "choosing the right correction, with no new mistake" } }
  misconceptions:
    - id: read-too-fast
      what: Reads the piece quickly as they meant it and misses mistakes
      addressed: Lesson 1 Learn screen 2 says read slowly, one word at a time, one kind of mistake at a time; l1-f1, l1-s1
    - id: only-spelling
      what: Thinks proof-reading only means checking spelling, so misses punctuation and grammar
      addressed: Learn in both lessons names the three checks; l1-f4, l2-f3, l2-s5, l2-c5
    - id: fix-adds-mistake
      what: Changes a word that was right, or fixes one mistake and makes another
      addressed: Choice tasks set a correction that adds a new mistake against the right one; feedback in l1-f5 and l2-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Satzzeichen und Rechtschreibung, en: Punctuation and spelling }
    goal:
      de: "Lies langsam, was jemand geschrieben hat, und verbessere große Anfangsbuchstaben, Satzzeichen und Rechtschreibfehler."
      en: "Read writing slowly and fix capital letters, full stops, question marks and spelling, one thing at a time."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ruby wrote: \"I like to play with my.\"\nWhat is wrong?"
            say: "Ruby read her sentence again. It does not make sense. What is wrong?"
            options: ["A word is missing at the end.", "It needs a question mark.", "Nothing is wrong."]
            answer: "A word is missing at the end."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? \"The cat sat on the mat.\" makes sense."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "my dog is called max"
            say: "Ruby says her sentence has no mistakes. What do you think: is she right? How many mistakes can you find? Have a guess."
            show: { drawn: letter-card, text: "my dog is called max" }
          - text: "Read slowly. Point to each word."
            say: "There are three! My needs a capital letter, Max needs a capital letter, and there is no full stop at the end. Proof-reading means checking your writing for mistakes and putting them right. Read slowly. Point to each word as you read it. Your eyes see more when you go slowly."
          - text: "Did you know?\nParis in the\nthe spring"
            say: "Did you know? Lots of people read this as Paris in the spring. But look again: the word the is there twice! Our brains read so fast that they skip it. That is why good proof-readers read slowly."
          - text: "my dog is called max\nMy dog is called Max."
            say: "First check: punctuation. Does each sentence start with a capital letter? Do names have a capital letter? Does the sentence end with a full stop, a question mark or an exclamation mark?"
            show: { drawn: letter-card, text: "My dog is called Max." }
          - text: "I was sad becos it rained.\nI was sad because it rained."
            say: "Second check: spelling. Look at each word. Does it look right? Becos is how it sounds. The right spelling is because."
          - text: "1. punctuation  2. spelling  3. does it make sense?"
            say: "Check one thing at a time. Punctuation, then spelling, then read it all again to check it makes sense."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the word that needs a capital letter."
                say: "Read the sentence slowly. One word should start with a capital letter. Tap it."
                show: { drawn: letter-card, text: "On Saturday I went to see sam." }
                spans: ["sam"]
                hints:
                  - "Names always start with a capital letter."
                  - "Which word is somebody's name?"
                  - "sam should be Sam."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the word that is spelt wrong."
                say: "Read the sentence slowly. One word is spelt wrong. Tap it."
                show: { drawn: letter-card, text: "Mum sed we can go out." }
                spans: ["sed"]
                hints:
                  - "Look at each word. Does it look right?"
                  - "One word is a tricky word written the way it sounds."
                  - "sed should be said."
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap: Can I come to your party_"
                say: "Which mark should end this sentence?"
                frame: "Can I come to your party_"
                options: ["?", ".", ","]
                answer: ["?"]
                option_audio: false
                hints:
                  - "Is this sentence telling or asking?"
                  - "It asks something. Asking sentences need a special mark."
                  - "A question mark."
              - id: l1-f4
                type: multiple_choice
                text: "Leo wrote: \"we went to the zoo\"\nWhat does Leo need to fix?"
                say: "Read Leo's sentence. What does he need to fix?"
                options: ["a capital letter and a full stop", "a spelling", "nothing"]
                answer: "a capital letter and a full stop"
                hints:
                  - "Look at the start and the end."
                  - "We needs a capital W, and the sentence needs an end mark."
                  - "a capital letter and a full stop"
              - id: l1-f5
                type: multiple_choice
                text: "Ava wrote: \"They wer happy.\"\nWhich is the right correction?"
                say: "Read Ava's sentence. Which one puts the mistake right?"
                options: ["They were happy.", "They where happy.", "they were happy."]
                answer: "They were happy."
                option_audio: false
                feedback:
                  "they were happy.": "The spelling is fixed, but now the capital letter is missing. A correction must not add a new mistake."
                hints:
                  - "Which word is spelt wrong?"
                  - "Wer should be were. Keep the capital T."
                  - "They were happy."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the word that needs a capital letter."
                say: "Read the sentence slowly. One word should start with a capital letter. Tap it."
                show: { drawn: letter-card, text: "My friend lives in london." }
                spans: ["london"]
                hints: ["Names of places need a capital letter."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tap the word that is spelt wrong."
                say: "Read the sentence slowly. One word is spelt wrong. Tap it."
                show: { drawn: letter-card, text: "We had a picnic becos it was hot." }
                spans: ["becos"]
                hints: ["Find the word written the way it sounds."]
              - id: l1-s3
                type: true_false
                text: "Is there a mistake? \"Where is my red coat?\""
                answer: false
                hints: ["Check the capital letter, the spelling and the end mark."]
              - id: l1-s4
                type: fill_in_blank
                text: "Fill the gap: I love my little brother_"
                say: "Which mark should end this sentence?"
                frame: "I love my little brother_"
                options: [".", "?", ","]
                answer: ["."]
                option_audio: false
                hints: ["It is a telling sentence."]
              - id: l1-s5
                type: multiple_choice
                text: "Noah wrote: \"the bus was late.\"\nWhich is the right correction?"
                say: "Read Noah's sentence. Which one puts the mistake right?"
                options: ["The bus was late.", "The bus was late", "The Bus was late."]
                answer: "The bus was late."
                option_audio: false
                hints: ["Only the first word needs a capital letter."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the word that is spelt wrong."
                say: "Read the sentence slowly. One word is spelt wrong. Tap it."
                show: { drawn: letter-card, text: "Thay are going swimming." }
                spans: ["Thay"]
              - id: l1-n2
                type: highlight_in_text
                text: "Tap the word that needs a capital letter."
                say: "Read the sentence slowly. One word should start with a capital letter. Tap it."
                show: { drawn: letter-card, text: "Today is monday." }
                spans: ["monday"]
              - id: l1-n3
                type: fill_in_blank
                text: "Fill the gap: What time is it_"
                say: "Which mark should end this sentence?"
                frame: "What time is it_"
                options: ["?", ".", ","]
                answer: ["?"]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Is there a mistake? \"i can ride a bike.\""
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Isla wrote: \"My frend is kind.\"\nWhich is the right correction?"
                say: "Read Isla's sentence. Which one puts the mistake right?"
                options: ["My friend is kind.", "My freind is kind.", "my friend is kind."]
                answer: "My friend is kind."
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Read the sentence slowly. One word is spelt wrong. Tap it."
            show: { drawn: letter-card, text: "I want to go to skool." }
            spans: ["skool"]
          - id: l1-c2
            type: highlight_in_text
            text: "Tap the word that needs a capital letter."
            say: "Read the sentence slowly. One word should start with a capital letter. Tap it."
            show: { drawn: letter-card, text: "We played with ella." }
            spans: ["ella"]
          - id: l1-c3
            type: fill_in_blank
            text: "Fill the gap: Do you like apples_"
            say: "Which mark should end this sentence?"
            frame: "Do you like apples_"
            options: ["?", ".", ","]
            answer: ["?"]
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Is there a mistake? \"Grandad said it was time for bed.\""
            say: "Read it slowly yourself. Is there a mistake?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Sami wrote: \"We went to the park on tuesday.\"\nWhich is the right correction?"
            say: "Read Sami's sentence. Which one puts the mistake right?"
            options: ["we went to the park on Tuesday.", "We went to the park on Tuesday.", "We went to the Park on tuesday."]
            answer: "We went to the park on Tuesday."
            option_audio: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Read the sentence slowly. One word is spelt wrong. Tap it."
            show: { drawn: letter-card, text: "Wen can we go home?" }
            spans: ["Wen"]

  - n: 2
    title: { de: Grammatik prüfen, en: Checking the grammar }
    goal:
      de: "Prüf, ob Sätze Sinn ergeben, und verbessere Fehler wie fehlende Wörter oder they was statt they were."
      en: "Check that sentences make sense, and fix slips like a missing word or they was instead of they were."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Read the sentence slowly. One word is spelt wrong. Tap it."
            show: { drawn: letter-card, text: "The dog was wet becos it rained." }
            spans: ["becos"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is there a mistake? \"my cat is black.\""
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I went to the and bought milk."
            say: "Read this sentence slowly. What do you think: does it make sense? Have a guess."
          - text: "I went to the and bought milk.\nI went to the shop and bought milk."
            say: "It doesn't: a word is missing! Third check: does it make sense? Sometimes we miss out a word when we write fast. Read it aloud in a quiet voice and you will hear the gap."
          - text: "Yesterday I go to the park.\nYesterday I went to the park."
            say: "Check the tense. If it already happened, the verbs should be in the past: went, played, saw. Do not jump between now and then."
          - text: "We was late. → We were late."
            say: "Check for Standard English too: we were, they were, I did, I saw."
          - text: "Find it. Fix it. Check you did not make a new mistake."
            say: "When you fix a mistake, read the sentence once more. Make sure your fix did not add a new mistake."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Omar wrote: \"I put my book in bag.\"\nWhat is missing?"
                say: "Read Omar's sentence. A word is missing. Which word?"
                options: ["my", "the book", "a full stop"]
                answer: "my"
                hints:
                  - "Read it in a quiet voice. Where do you hear a gap?"
                  - "In bag sounds odd. In whose bag?"
                  - "my: I put my book in my bag."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tap the verb in the wrong tense."
                say: "This happened yesterday. One verb is not in the past. Tap it."
                show: { drawn: letter-card, text: "Yesterday we played football and Tom scores a goal." }
                spans: ["scores"]
                hints:
                  - "Yesterday tells you it already happened."
                  - "Played is in the past. Look at the other verb."
                  - "scores should be scored."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the word that is not Standard English."
                say: "Read the sentence slowly. One word is not Standard English. Tap it."
                show: { drawn: letter-card, text: "We was making a den." }
                spans: ["was"]
                hints:
                  - "Look at the word after We."
                  - "We goes with were."
                  - "was should be were."
              - id: l2-f4
                type: multiple_choice
                text: "Maya wrote: \"Last week I see a fox.\"\nWhich is the right correction?"
                say: "Read Maya's sentence. Which one puts the mistake right?"
                options: ["Last week I saw a fox.", "Last week I seen a fox.", "last week I saw a fox."]
                answer: "Last week I saw a fox."
                option_audio: false
                feedback:
                  "last week I saw a fox.": "The verb is fixed, but the capital letter has gone. A fix must not add a new mistake."
                hints:
                  - "Last week means it already happened."
                  - "See in the past is saw."
                  - "Last week I saw a fox."
              - id: l2-f5
                type: true_false
                text: "Is there a mistake? \"On Sunday we walked to the beach and swam in the sea.\""
                answer: false
                hints:
                  - "Check the capital letters, the spelling and the end."
                  - "Check both verbs: walked and swam. Are they both in the past?"
                  - "No, there is no mistake."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ivy wrote: \"The cat jumped onto wall.\"\nWhat is missing?"
                say: "Read Ivy's sentence. A word is missing. Which word?"
                options: ["the", "cat", "a question mark"]
                answer: "the"
                hints: ["Read it quietly. Onto what?"]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap the verb in the wrong tense."
                say: "This already happened. One verb is not in the past. Tap it."
                show: { drawn: letter-card, text: "Last night I read a book and go to sleep." }
                spans: ["go"]
                hints: ["Last night means the past."]
              - id: l2-s3
                type: true_false
                text: "Is there a mistake? \"They was in the garden.\""
                answer: true
                hints: ["They goes with were."]
              - id: l2-s4
                type: multiple_choice
                text: "Finn wrote: \"I done a painting.\"\nWhich is the right correction?"
                say: "Read Finn's sentence. Which one puts the mistake right?"
                options: ["I did a painting.", "I doed a painting.", "i did a painting."]
                answer: "I did a painting."
                option_audio: false
                hints: ["Without have, write did."]
              - id: l2-s5
                type: sorting
                text: "What kind of mistake is it?"
                say: "Read each sentence. Is the mistake in the punctuation or in the spelling?"
                option_audio: false
                bins:
                  - { id: punct, show: { text: "punctuation" }, say: "Punctuation." }
                  - { id: spell, show: { text: "spelling" }, say: "Spelling." }
                options:
                  - { text: "the sun is hot.", bin: punct }
                  - { text: "The sun is hott.", bin: spell }
                  - { text: "Is it hot", bin: punct }
                  - { text: "It is verry hot.", bin: spell }
                hints: ["Punctuation is capital letters and end marks."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Dev wrote: \"We had fish and for tea.\"\nWhat is missing?"
                say: "Read Dev's sentence. A word is missing. Which word?"
                options: ["chips", "fish", "a full stop"]
                answer: "chips"
                feedback:
                  fish: "Fish and fish for tea? That is a lot of fish! Which word often goes with fish?"
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the verb in the wrong tense."
                say: "This already happened. One verb is not in the past. Tap it."
                show: { drawn: letter-card, text: "Yesterday Gran baked a cake and we eat it." }
                spans: ["eat"]
              - id: l2-n3
                type: true_false
                text: "Is there a mistake? \"We were tired after the walk.\""
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Zoe wrote: \"My dad have a red car.\"\nWhich is the right correction?"
                say: "Read Zoe's sentence. Which one puts the mistake right?"
                options: ["My dad has a red car.", "My dad haves a red car.", "my dad has a red car."]
                answer: "My dad has a red car."
                option_audio: false
              - id: l2-n5
                type: highlight_in_text
                text: "Tap the word that is spelt wrong."
                say: "Read the sentence slowly. One word is spelt wrong. Tap it."
                show: { drawn: letter-card, text: "The peeple clapped and cheered." }
                spans: ["peeple"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: punctuation
            type: highlight_in_text
            text: "Tap the word that needs a capital letter."
            say: "Read the sentence slowly. One word should start with a capital letter. Tap it."
            show: { drawn: letter-card, text: "My teacher is called mr Patel." }
            spans: ["mr"]
          - id: l2-c2
            part: spelling
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Read the sentence slowly. One word is spelt wrong. Tap it."
            show: { drawn: letter-card, text: "We cood see the sea." }
            spans: ["cood"]
          - id: l2-c3
            part: grammar
            type: highlight_in_text
            text: "Tap the verb in the wrong tense."
            say: "This already happened. One verb is not in the past. Tap it."
            show: { drawn: letter-card, text: "On Friday we went to the park and fly a kite." }
            spans: ["fly"]
          - id: l2-c4
            part: correct
            type: multiple_choice
            text: "Ben wrote: \"They was at the pool.\"\nWhich is the right correction?"
            say: "Read Ben's sentence. Which one puts the mistake right?"
            options: ["They were at the pool.", "They was at the pool!", "they were at the pool."]
            answer: "They were at the pool."
            option_audio: false
          - id: l2-c5
            part: punctuation
            type: true_false
            text: "Is there a mistake? \"Where is the park\""
            say: "Read it slowly yourself. Is there a mistake?"
            answer: true
          - id: l2-c6
            part: punctuation
            type: fill_in_blank
            text: "Fill the gap: What a huge wave that was_"
            say: "Which mark should end this sentence?"
            frame: "What a huge wave that was_"
            options: [".", "?", "!"]
            answer: ["!"]
            option_audio: false
          - id: l2-c7
            part: punctuation
            type: highlight_in_text
            text: "Tap the word that needs a capital letter."
            say: "Read the sentence slowly. One word should start with a capital letter. Tap it."
            show: { drawn: letter-card, text: "Mum and i made pancakes." }
            spans: ["i"]
          - id: l2-c8
            part: punctuation
            type: highlight_in_text
            text: "Here are two sentences. Tap the word that needs a capital letter."
            say: "Read the two sentences slowly. One word should start with a capital letter. Tap it."
            show: { drawn: letter-card, text: "We got wet. then the sun came out." }
            spans: ["then"]
          - id: l2-c9
            part: spelling
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Read the sentence slowly. One word is spelt wrong. Tap it."
            show: { drawn: letter-card, text: "Thank you for the beutiful flowers." }
            spans: ["beutiful"]
          - id: l2-c10
            part: spelling
            type: true_false
            text: "Is a word spelt wrong? \"Who left the door open?\""
            say: "Read it slowly yourself. Is a word spelt wrong?"
            answer: false
          - id: l2-c11
            part: spelling
            type: multiple_choice
            text: "Jack wrote: \"I have menny pens in my bag.\"\nWhich word is spelt wrong?"
            say: "Read Jack's sentence. Which word is spelt wrong?"
            options: ["have", "menny", "pens"]
            answer: "menny"
            option_audio: false
          - id: l2-c12
            part: spelling
            type: highlight_in_text
            text: "Tap the two words that are spelt wrong."
            say: "Read the sentence slowly. Two words are spelt wrong. Tap them both."
            show: { drawn: letter-card, text: "We went owt to play on the gras." }
            spans: ["owt", "gras"]
            difficulty: stretch
          - id: l2-c13
            part: grammar
            type: multiple_choice
            text: "Ella wrote: \"We to the beach on Saturday.\"\nWhat is missing?"
            say: "Read Ella's sentence. A word is missing. Which word?"
            options: ["the", "a full stop", "went"]
            answer: "went"
          - id: l2-c14
            part: grammar
            type: highlight_in_text
            text: "Tap the word that is not Standard English."
            say: "Read the sentence slowly. One word is not Standard English. Tap it."
            show: { drawn: letter-card, text: "Yesterday I seen a big dog." }
            spans: ["seen"]
          - id: l2-c15
            part: grammar
            type: true_false
            text: "Is there a mistake? \"Last summer we go to the seaside.\""
            say: "Read it slowly yourself. Is there a mistake?"
            answer: true
          - id: l2-c16
            part: grammar
            type: highlight_in_text
            text: "This already happened. Tap the verb in the wrong tense."
            say: "This already happened. One verb is not in the past. Tap it."
            show: { drawn: letter-card, text: "Last Saturday Mia jumps in the puddles and got wet." }
            spans: ["jumps"]
          - id: l2-c17
            part: correct
            type: multiple_choice
            text: "Ruby wrote: \"I like reading becos it is fun.\"\nWhich is the right correction?"
            say: "Read Ruby's sentence. Which one puts the mistake right?"
            options: ["I like reading becuase it is fun.", "i like reading because it is fun.", "I like reading because it is fun."]
            answer: "I like reading because it is fun."
            option_audio: false
          - id: l2-c18
            part: correct
            type: multiple_choice
            text: "Sam wrote: \"Where is my hat.\"\nWhich is the right correction?"
            say: "Read Sam's sentence. Which one puts the mistake right?"
            options: ["Where is my hat?", "where is my hat?", "Where is my hat!"]
            answer: "Where is my hat?"
            option_audio: false
          - id: l2-c19
            part: correct
            type: multiple_choice
            text: "Ali wrote: \"Yesterday I eat an apple.\"\nWhich is the right correction?"
