# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.sequence
skill: lit-en.comprehension.sequence
curriculum: en-GB
language: en
title:
  de: Ereignisse einer Geschichte ordnen
  en: Putting a story in order
summary: >
  Children put the events of a short story in order and say how one
  event leads to the next. Lesson 1 orders the events of stories read
  aloud, with the time words that help (first, next, then, after that,
  finally). Lesson 2 links events by cause: what made something happen
  (because, so), and what must have happened just before; it ends with
  the skill check. Every story is short, written for Twist, shown on
  screen and read aloud.
metadata:
  year: year-2
  topic: { de: Geschichten verstehen, en: Understanding stories }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.comprehension.retell]
  also_practises: [lit-en.comprehension.questions]
  vocabulary: { en: [first, next, then, after that, finally, beginning, middle, end, because, so, event] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: order-of-telling
      what: Orders events by what was said last or what stands out most, not by when it happened
      addressed: Learn screen 3 of lesson 1 uses the time words; l1-f1, l1-f3 and l1-s1 order events, with feedback in l1-f2
    - id: events-unlinked
      what: Sees events as a list and cannot say why one led to another
      addressed: Learn of lesson 2 links events with because and so; l2-f1, l2-f2 and l2-s2 ask what made something happen, with feedback in l2-f1
    - id: picture-not-text
      what: Answers from the picture or from what usually happens, not from the story
      addressed: l2-f4 and l2-n3 ask about a detail where the usual answer is wrong for this story
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was passiert zuerst?", en: "What happens first?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "In Goldilocks and the Three Bears, what does Goldilocks do first in the house?"
            options: ["She eats the porridge.", "She sleeps in a bed.", "She runs away."]
            answer: "She eats the porridge."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How does the story of the Three Little Pigs end?"
            options: ["The wolf cannot blow down the brick house.", "The pigs build a straw house.", "The pigs leave home."]
            answer: "The wolf cannot blow down the brick house."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Mia flew her kite in the park.\nThe wind blew hard and the kite got stuck in a tree.\nGrandpa fetched a ladder and got the kite down.\nMia said thank you, and they went home for tea."
            say: "Listen to the story. Mia flew her kite in the park. The wind blew hard and the kite got stuck in a tree. Grandpa fetched a ladder and got the kite down. Mia said thank you, and they went home for tea."
            show: { object: kite }
          - text: "beginning: Mia flies her kite.\nmiddle: The kite gets stuck. Grandpa gets it down.\nend: They go home for tea."
            say: "Every story has a beginning, a middle and an end. At the beginning, Mia flies her kite. In the middle, the kite gets stuck and Grandpa gets it down. At the end, they go home."
          - text: "first   next   then   after that   finally"
            say: "Time words help you put events in order. First, Mia flew her kite. Next, it got stuck. Then Grandpa fetched a ladder. After that, he got the kite down. Finally, they went home."
          - text: "Ask: what happened before this? What happened after?"
            say: "When you order a story, take one event and ask: what happened before this? What happened after it? That tells you where it goes."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Mia flew her kite in the park. The wind blew hard and the kite got stuck in a tree. Grandpa fetched a ladder and got the kite down.\n\nPut the events in order."
                say: "Think of Mia's kite story. Put the events in order, from first to last."
                options: ["Grandpa got the kite down.", "Mia flew her kite.", "The kite got stuck in a tree."]
                slot_count: 3
                answer: ["Mia flew her kite.", "The kite got stuck in a tree.", "Grandpa got the kite down."]
                option_audio: false
                hints:
                  - "What did Mia do at the very beginning?"
                  - "The kite had to get stuck before Grandpa could get it down."
                  - "Mia flew her kite. The kite got stuck. Grandpa got it down."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Sam and Dad got out flour, eggs and sugar. They mixed it all in a bowl. They put the cake in the oven. When it was ready, they ate a slice each.\n\nWhat did they do just after they mixed everything?"
                say: "Listen. Sam and Dad got out flour, eggs and sugar. They mixed it all in a bowl. They put the cake in the oven. When it was ready, they ate a slice each. What did they do just after they mixed everything?"
                options: ["They put the cake in the oven.", "They got out the eggs.", "They ate a slice each."]
                answer: "They put the cake in the oven."
                option_audio: false
                feedback:
                  "They ate a slice each.": "That happened at the very end. Just after mixing, the cake went in the oven."
                hints:
                  - "Find the mixing in the story."
                  - "Read the sentence that comes straight after it."
                  - "They put the cake in the oven."
              - id: l1-f3
                type: ordering
                text: "Sam bakes a cake. Put the events in order."
                say: "Put the events of Sam's cake in order, from first to last."
                options: ["They ate a slice each.", "They got out flour, eggs and sugar.", "They put the cake in the oven.", "They mixed it all in a bowl."]
                slot_count: 4
                answer: ["They got out flour, eggs and sugar.", "They mixed it all in a bowl.", "They put the cake in the oven.", "They ate a slice each."]
                option_audio: false
                hints:
                  - "You need things before you can mix them."
                  - "You eat the cake when it is baked."
                  - "Get things out, mix, oven, eat."
              - id: l1-f4
                type: multiple_choice
                text: "Which time word goes at the very end?"
                options: ["finally", "first", "next"]
                answer: "finally"
                hints:
                  - "Think about which word means the last one."
                  - "First starts a list. Next is in the middle."
                  - "Finally."
              - id: l1-f5
                type: fill_in_blank
                text: "Fill in the time words."
                say: "Fill in the time words so the steps are in order."
                frame: "_, Ali rolled a big snowball. _, he gave the snowman a carrot nose."
                options: ["First", "Finally", "Once"]
                answer: ["First", "Finally"]
                hints:
                  - "Which step came first?"
                  - "The nose goes on at the end."
                  - "First, then finally."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "It snowed in the night. In the morning, Ali rolled a big snowball. He gave the snowman a carrot nose. In the afternoon, the sun came out and the snowman melted.\n\nPut the events in order."
                say: "Listen. It snowed in the night. In the morning, Ali rolled a big snowball. He gave the snowman a carrot nose. In the afternoon, the sun came out and the snowman melted. Now put the events in order."
                options: ["The snowman melted.", "It snowed in the night.", "Ali rolled a big snowball.", "He gave the snowman a carrot nose."]
                slot_count: 4
                answer: ["It snowed in the night.", "Ali rolled a big snowball.", "He gave the snowman a carrot nose.", "The snowman melted."]
                option_audio: false
                hints: ["Night, then morning, then afternoon."]
              - id: l1-s2
                type: multiple_choice
                text: "It snowed in the night. In the morning, Ali built a snowman. In the afternoon, the sun came out and the snowman melted.\n\nWhat happened at the end?"
                say: "Listen. It snowed in the night. In the morning, Ali built a snowman. In the afternoon, the sun came out and the snowman melted. What happened at the end?"
                options: ["The snowman melted.", "It snowed.", "Ali built a snowman."]
                answer: "The snowman melted."
                option_audio: false
                hints: ["The afternoon came last."]
                show: { object: snowman }
              - id: l1-s3
                type: true_false
                text: "Mia's kite got stuck in a tree. Grandpa fetched a ladder and got it down.\n\nGrandpa fetched the ladder before the kite got stuck."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Why would Grandpa need a ladder?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which time word goes first?"
                options: ["after that", "first", "finally"]
                answer: "first"
                hints: ["Which word starts a list of steps?"]
              - id: l1-s5
                type: ordering
                text: "Put the time words in order."
                say: "Put the time words in order, from the start to the end."
                options: ["then", "finally", "first", "next"]
                slot_count: 4
                answer: ["first", "next", "then", "finally"]
                hints: ["Finally always comes last."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Leo's tooth was wobbly. At lunch, he bit an apple and the tooth came out. That night he put it under his pillow. In the morning, he found a shiny coin.\n\nPut the events in order."
                say: "Listen. Leo's tooth was wobbly. At lunch, he bit an apple and the tooth came out. That night he put it under his pillow. In the morning, he found a shiny coin. Now put the events in order."
                options: ["He found a shiny coin.", "Leo's tooth was wobbly.", "He put it under his pillow.", "The tooth came out."]
                slot_count: 4
                answer: ["Leo's tooth was wobbly.", "The tooth came out.", "He put it under his pillow.", "He found a shiny coin."]
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Leo's tooth was wobbly. At lunch, he bit an apple and the tooth came out. That night he put it under his pillow. In the morning, he found a shiny coin.\n\nWhat happened at lunch?"
                options: ["The tooth came out.", "He found a coin.", "He went to bed."]
                answer: "The tooth came out."
                option_audio: false
                show: { object: apple }
              - id: l1-n3
                type: true_false
                text: "Leo's tooth came out at lunch. In the morning, he found a shiny coin under his pillow.\n\nLeo found the coin before the tooth came out."
                say: "Read it. Is it true?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Fill in the time words."
                say: "Fill in the time words so the steps are in order."
                frame: "_, Sam got out the eggs. _, he mixed them. _, the cake went in the oven."
                options: ["First", "Next", "Finally"]
                answer: ["First", "Next", "Finally"]
              - id: l1-n5
                type: multiple_choice
                text: "Where in a story do you find the problem being sorted out?"
                options: ["near the end", "in the very first line", "in the title"]
                answer: "near the end"
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Ella planted a seed. She watered it every day. A green shoot came up. Soon there was a big yellow flower.\n\nPut the events in order."
            say: "Listen. Ella planted a seed. She watered it every day. A green shoot came up. Soon there was a big yellow flower. Now put the events in order."
            options: ["A green shoot came up.", "Ella planted a seed.", "There was a big yellow flower."]
            slot_count: 3
            answer: ["Ella planted a seed.", "A green shoot came up.", "There was a big yellow flower."]
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which time word means the last step?"
            options: ["first", "next", "finally"]
            answer: "finally"
          - id: l1-c3
            type: true_false
            text: "Ella planted a seed. She watered it every day. A green shoot came up.\n\nElla watered the seed before the shoot came up."
            say: "Read it. Is it true?"
            answer: true

  - n: 2
    title: { de: "Wie hängt das zusammen?", en: "How are the events linked?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Put the events in order."
            say: "Think of Ali and the snowman. Put the events in order."
            options: ["The snowman melted.", "It snowed.", "Ali built a snowman."]
            slot_count: 3
            answer: ["It snowed.", "Ali built a snowman.", "The snowman melted."]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which time word comes just after first?"
            options: ["finally", "next", "once"]
            answer: "next"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The wind blew hard, so the kite got stuck in a tree."
            say: "Events in a story are linked. The wind blew hard, so the kite got stuck. The wind made it happen. So tells you what happened next because of it."
            show: { object: wind }
          - text: "Grandpa fetched a ladder because the kite was stuck."
            say: "Because tells you why. Grandpa fetched a ladder because the kite was stuck. The kite being stuck is the reason."
          - text: "Why did the snowman melt?\nThe sun came out."
            say: "To link events, ask why. Why did the snowman melt? Because the sun came out. Find the answer in the story, not just in your head."
          - text: "Finn was soaking wet when he came in."
            say: "Sometimes a story does not say everything. Finn was soaking wet when he came in. What must have happened before? Maybe it rained, or he fell in a puddle. Look for clues in the story."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The wind blew hard and the kite got stuck in a tree.\n\nWhy did the kite get stuck?"
                say: "Listen. The wind blew hard and the kite got stuck in a tree. Why did the kite get stuck?"
                options: ["because the wind blew hard", "because Grandpa fetched a ladder", "because Mia went home"]
                answer: "because the wind blew hard"
                option_audio: false
                feedback:
                  "because Grandpa fetched a ladder": "Grandpa came after the kite was stuck, so he cannot be the reason."
                hints:
                  - "Look at what happened just before it got stuck."
                  - "What was the weather doing?"
                  - "Because the wind blew hard."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Link the events."
                say: "Choose the word that links the two events."
                frame: "Jo forgot her coat, _ she got cold."
                options: ["so", "because", "but"]
                answer: ["so"]
                hints:
                  - "Forgetting the coat came first."
                  - "Getting cold is what happened next because of it."
                  - "So."
              - id: l2-f3
                type: fill_in_blank
                text: "Link the events."
                say: "Choose the word that links the two events."
                frame: "The baby cried _ he was hungry."
                options: ["because", "so", "then"]
                answer: ["because"]
                hints:
                  - "The second part tells you why."
                  - "Which word gives a reason?"
                  - "Because."
              - id: l2-f4
                type: multiple_choice
                text: "Raj took his umbrella to school. On the way home, the sun was shining, so he left it closed. He was dry when he got home.\n\nWhy was Raj dry?"
                say: "Listen. Raj took his umbrella to school. On the way home, the sun was shining, so he left it closed. He was dry when he got home. Why was Raj dry?"
                options: ["because it was sunny", "because he used his umbrella", "because he stayed at school"]
                answer: "because it was sunny"
                option_audio: false
                feedback:
                  "because he used his umbrella": "That is what often happens, but here he left it closed. The story says the sun was shining."
                hints:
                  - "Did Raj open his umbrella?"
                  - "The story tells you about the weather."
                  - "Because it was sunny."
              - id: l2-f5
                type: multiple_choice
                text: "Finn came in with muddy boots and a muddy football.\n\nWhat must have happened before?"
                options: ["He played football outside.", "He had a bath.", "He read a book in bed."]
                answer: "He played football outside."
                option_audio: false
                hints:
                  - "Look for the clues: muddy boots, a football."
                  - "Where do you get muddy with a ball?"
                  - "He played football outside."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Link the events."
                say: "Choose the word that links the two events."
                frame: "It was raining, _ we played inside."
                options: ["so", "because", "but"]
                answer: ["so"]
                hints: ["Playing inside happened because of the rain."]
              - id: l2-s2
                type: multiple_choice
                text: "The sun came out and the snowman melted.\n\nWhy did the snowman melt?"
                options: ["because the sun came out", "because Ali built it", "because it snowed"]
                answer: "because the sun came out"
                option_audio: false
                hints: ["What makes snow melt?"]
              - id: l2-s3
                type: true_false
                text: "The dog barked because the postman knocked. The postman knocking made the dog bark."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Because tells you the reason."]
              - id: l2-s4
                type: multiple_choice
                text: "Nia's ice cream was dripping all down her hand.\n\nWhat must have happened?"
                options: ["It was a hot day.", "It was snowing.", "She put it in the freezer."]
                answer: "It was a hot day."
                option_audio: false
                hints: ["What makes ice cream drip?"]
              - id: l2-s5
                type: ordering
                text: "Put the events in order."
                say: "Put the events in order. Think about what made each one happen."
                options: ["So she ran to catch the bus.", "Amy woke up late.", "She got to school just in time."]
                slot_count: 3
                answer: ["Amy woke up late.", "So she ran to catch the bus.", "She got to school just in time."]
                option_audio: false
                hints: ["Why did she have to run?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Link the events."
                say: "Choose the word that links the two events."
                frame: "Tom was tired _ he went to bed early."
                options: ["so", "because", "until"]
                answer: ["so"]
              - id: l2-n2
                type: multiple_choice
                text: "The cat knocked a cup off the table. The cup broke. Mum swept up the pieces.\n\nWhy did Mum sweep up?"
                options: ["because the cup broke", "because the cat was hungry", "because it was bedtime"]
                answer: "because the cup broke"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Zara looked everywhere for her teddy. At last she found it in the washing machine! Her brother laughed.\n\nWhere did Zara find her teddy?"
                options: ["in the washing machine", "on her bed", "in the toy box"]
                answer: "in the washing machine"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Ben fell over, so he hurt his knee. Ben hurt his knee before he fell over."
                say: "Read it. Is it true?"
                answer: false
              - id: l2-n5
                type: ordering
                text: "Put the events in order."
                say: "Put the events in order. Think about what made each one happen."
                options: ["She put on a plaster.", "Kim cut her finger.", "Soon it stopped hurting."]
                slot_count: 3
                answer: ["Kim cut her finger.", "She put on a plaster.", "Soon it stopped hurting."]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Dev lost his library book. He looked under his bed, but it was not there. Then he looked in his schoolbag. The book was at the bottom!\n\nPut the events in order."
            say: "Listen. Dev lost his library book. He looked under his bed, but it was not there. Then he looked in his schoolbag. The book was at the bottom! Now put the events in order."
            options: ["He looked in his schoolbag.", "Dev lost his library book.", "He found the book.", "He looked under his bed."]
            slot_count: 4
            answer: ["Dev lost his library book.", "He looked under his bed.", "He looked in his schoolbag.", "He found the book."]
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Dev lost his library book. He looked under his bed, but it was not there. Then he looked in his schoolbag. The book was at the bottom!\n\nWhat did Dev do just before he found the book?"
            options: ["He looked in his schoolbag.", "He looked under his bed.", "He went to the library."]
            answer: "He looked in his schoolbag."
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "Link the events."
            say: "Choose the word that links the two events."
            frame: "The plant died _ nobody watered it."
            options: ["because", "so", "and"]
            answer: ["because"]
          - id: l2-c4
            type: multiple_choice
            text: "The puppy chewed Dad's slipper. Dad found a hole in it.\n\nWhy was there a hole in the slipper?"
            options: ["because the puppy chewed it", "because Dad wore it out", "because it was old"]
            answer: "because the puppy chewed it"
            option_audio: false
          - id: l2-c5
            type: fill_in_blank
            text: "Fill in the time word."
            say: "Fill in the time word so the steps are in order."
            frame: "_, Kim put on her socks. Then she put on her shoes."
            options: ["First", "Finally", "After that"]
            answer: ["First"]
