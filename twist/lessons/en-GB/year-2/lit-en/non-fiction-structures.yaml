# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.non-fiction-structures
skill: lit-en.texts.non-fiction-structures
curriculum: en-GB
language: en
title:
  de: Sachbücher nutzen
  en: Using information books
summary: >
  Information books are organised so that a reader can find what they
  need without reading every page. Lesson 1 tells an information book
  from a story and uses a contents page and headings, in a book about
  minibeasts. Lesson 2 uses a glossary, which is in alphabetical order,
  and shows that books can be organised by topic, by time order or by
  the alphabet; it ends with the skill check. Contents pages and
  glossaries are drawn as tables; every text is read aloud.
metadata:
  year: year-2
  topic: { de: Sachtexte, en: Information texts }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.word-reading.decodable-books]
  also_practises: [lit-en.comprehension.questions]
  vocabulary: { en: [information book, non-fiction, story, fiction, contents page, heading, glossary, alphabetical order, page, chapter] }
  forms: [text, audio, drawn, picture]
  drawn: [table, letter-card]
  facets: []
  parts:
    - { id: story-or-info, what: { de: ein Sachbuch von einer Geschichte unterscheiden, en: telling an information book from a story } }
    - { id: contents, what: { de: mit dem Inhaltsverzeichnis die richtige Seite finden, en: finding the right page with the contents page } }
    - { id: headings, what: { de: "Überschriften nutzen und die passende wählen", en: "using headings and choosing the one that fits" } }
    - { id: glossary, what: { de: "im Glossar nachsehen, was ein Wort bedeutet", en: "looking up what a word means in the glossary" } }
    - { id: organised, what: { de: "wie ein Sachbuch geordnet ist (nach Thema, nach Zeit, nach dem Alphabet)", en: "how a book is organised (by topic, in time order, in alphabetical order)" } }
  misconceptions:
    - id: read-from-start
      what: Thinks an information book must be read from the first page to find something
      addressed: Learn of lesson 1 shows the contents page; l1-f1, l1-f2 and l1-s1 find a page from the contents, with feedback in l1-f2
    - id: heading-is-first-line
      what: Takes a heading for the first sentence of the text, or picks a heading from one word in the paragraph
      addressed: Learn screen 3 of lesson 1; l1-f4, l1-s3 and l1-n3 choose a heading for a whole paragraph, with feedback in l1-f4
    - id: glossary-contents-swap
      what: Mixes up the glossary and the contents page (looks for a word meaning in the contents)
      addressed: Learn of lesson 2 sets them side by side; l2-f1, l2-f5 and l2-s5 ask which part of the book to use, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Inhaltsverzeichnis und Überschriften, en: Contents pages and headings }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "The snail is on a leaf."
            say: "Read the sentence. Tap the picture it is about."
            options: [{ object: snail }, { object: snake }, { object: sun }]
            answer: snail
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "The bee can buzz."
            say: "Read the sentence. Does it make sense?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Once upon a time, a little ant got lost.\n\nAnts live in big groups called colonies."
            say: "Listen to two books. Once upon a time, a little ant got lost. That is a story. Ants live in big groups called colonies. That is from an information book. It tells you true facts."
            show: { object: ant }
          - text: "Minibeasts: contents"
            say: "An information book has a contents page at the front. It lists what is in the book and the page to turn to. You do not need to read every page."
            show: { drawn: table, rows: [["Contents", "Page"], ["Ants", "2"], ["Bees", "4"], ["Snails", "6"], ["Butterflies", "8"], ["Glossary", "10"]] }
          - text: "What snails eat\nSnails eat leaves and plants. They come out at night and after rain."
            say: "Each part of the book has a heading. The heading tells you what that part is about. This heading is: What snails eat. The words under it are all about snails' food."
            show: { object: snail }
          - text: "Think: what do I want to find out?"
            say: "To use an information book, first think what you want to find out. Then look at the contents and the headings to find the right page."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Minibeasts. Which page tells you about bees?"
                show: { drawn: table, rows: [["Contents", "Page"], ["Ants", "2"], ["Bees", "4"], ["Snails", "6"], ["Butterflies", "8"], ["Glossary", "10"]] }
                options: ["2", "4", "8"]
                answer: "4"
                hints:
                  - "Find the word Bees in the contents."
                  - "Look across to the page number beside it."
                  - "Page 4."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Minibeasts. You want to know how a caterpillar turns into a butterfly. Which page?"
                show: { drawn: table, rows: [["Contents", "Page"], ["Ants", "2"], ["Bees", "4"], ["Snails", "6"], ["Butterflies", "8"], ["Glossary", "10"]] }
                options: ["8", "2", "1"]
                answer: "8"
                feedback:
                  "1": "You do not need to start at page 1. The contents page tells you where butterflies are."
                hints:
                  - "Which minibeast is this about?"
                  - "Find Butterflies in the contents."
                  - "Page 8."
              - id: l1-f3
                type: sorting
                text: "Story or information book? Sort them."
                say: "Read each sentence. Is it from a story, or from an information book? Put it in the right group."
                option_audio: false
                bins:
                  - { id: story, show: { text: "story" }, say: "Story." }
                  - { id: info, show: { text: "information book" }, say: "Information book." }
                options:
                  - { text: "Once upon a time, a bee lost its way home.", bin: story }
                  - { text: "Bees make honey.", bin: info }
                  - { text: "Sam the snail had a big adventure.", bin: story }
                  - { text: "A snail has a shell.", bin: info }
                hints:
                  - "Does it tell you a fact that is always true?"
                  - "Once upon a time and a name like Sam belong to stories."
                  - "Story: the lost bee and Sam the snail. Information: honey and the shell."
              - id: l1-f4
                type: multiple_choice
                text: "Which heading fits?\n\n_\nBees fly from flower to flower. They drink a sweet juice called nectar. They take it back to the hive."
                options: ["How bees find food", "Bees sting", "Flowers"]
                answer: "How bees find food"
                option_audio: false
                feedback:
                  Flowers: "Flowers are in the text, but the part is about what bees do. A heading fits the whole part."
                hints:
                  - "What is the whole part about?"
                  - "It tells you where bees go and what they drink."
                  - "How bees find food."
              - id: l1-f5
                type: true_false
                text: "A contents page is at the front of a book."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Where was the contents page in Minibeasts?"
                  - "You look at it before you start."
                  - "Yes, at the front."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Minibeasts. Which page tells you where ants live?"
                show: { drawn: table, rows: [["Contents", "Page"], ["Ants", "2"], ["Bees", "4"], ["Snails", "6"], ["Butterflies", "8"], ["Glossary", "10"]] }
                options: ["6", "2", "10"]
                answer: "2"
                hints: ["Find Ants in the contents."]
              - id: l1-s2
                type: multiple_choice
                text: "Which book is an information book?"
                options: ["Our Planets", "The Dragon Who Lost His Roar", "Princess Pip's Party"]
                answer: "Our Planets"
                option_audio: false
                hints: ["Which one sounds as if it gives true facts?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which heading fits?\n\n_\nA butterfly lays tiny eggs. A caterpillar hatches from each egg. Later it makes a case around itself and turns into a butterfly."
                options: ["The life of a butterfly", "Eggs for breakfast", "Leaves"]
                answer: "The life of a butterfly"
                option_audio: false
                hints: ["The heading must fit every sentence."]
              - id: l1-s4
                type: true_false
                text: "To find out about snails in Minibeasts, you must read pages 1 to 5 first."
                say: "Read it. Is it true?"
                answer: false
                hints: ["The contents page tells you where to go."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the heading."
                say: "Read the page. Tap every word of the heading."
                show: { drawn: letter-card, text: "Snail shells. A snail can hide inside its shell." }
                spans: ["Snail", "shells"]
                hints: ["The heading comes first and is short."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Our Pets. Which page tells you how to look after a rabbit?"
                show: { drawn: table, rows: [["Contents", "Page"], ["Dogs", "3"], ["Cats", "7"], ["Rabbits", "11"], ["Fish", "15"]] }
                options: ["11", "7", "15"]
                answer: "11"
              - id: l1-n2
                type: multiple_choice
                text: "Our Pets. What is on page 15?"
                show: { drawn: table, rows: [["Contents", "Page"], ["Dogs", "3"], ["Cats", "7"], ["Rabbits", "11"], ["Fish", "15"]] }
                options: ["fish", "dogs", "rabbits"]
                answer: "fish"
              - id: l1-n3
                type: multiple_choice
                text: "Which heading fits?\n\n_\nA dog needs a walk every day. Give it fresh water and food. Brush its coat."
                options: ["Looking after a dog", "Water", "Cats and dogs"]
                answer: "Looking after a dog"
                option_audio: false
              - id: l1-n4
                type: sorting
                text: "Story or information book? Sort them."
                say: "Read each sentence. Is it from a story, or from an information book? Put it in the right group."
                option_audio: false
                bins:
                  - { id: story, show: { text: "story" }, say: "Story." }
                  - { id: info, show: { text: "information book" }, say: "Information book." }
                options:
                  - { text: "Fish breathe through gills.", bin: info }
                  - { text: "The cat put on her best hat.", bin: story }
                  - { text: "Rabbits eat grass and hay.", bin: info }
                  - { text: "Long ago, a dog could talk.", bin: story }
              - id: l1-n5
                type: true_false
                text: "A heading tells you what the next part of the book is about."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Our Pets. Which page tells you about cats?"
            show: { drawn: table, rows: [["Contents", "Page"], ["Dogs", "3"], ["Cats", "7"], ["Rabbits", "11"], ["Fish", "15"]] }
            options: ["3", "7", "11"]
            answer: "7"
          - id: l1-c2
            type: multiple_choice
            text: "Which heading fits?\n\n_\nFish live in water. Some fish live in the sea. Some live in rivers and ponds."
            options: ["Where fish live", "The sea", "Pets"]
            answer: "Where fish live"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Bees make honey. Is this from an information book?"
            say: "Read it. Is this from an information book?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Trains. Which page tells you about stations?"
            show: { drawn: table, rows: [["Contents", "Page"], ["Steam trains", "2"], ["Fast trains", "6"], ["Stations", "10"]] }
            options: ["6", "10", "2"]
            answer: "10"
          - id: l1-c5
            type: true_false
            text: "Once upon a time, a little train wanted to fly. Is this from an information book?"
            say: "Read it. Is this from an information book?"
            answer: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tap every word of the heading."
            say: "Read the page. Tap every word of the heading."
            show: { drawn: letter-card, text: "Ant homes. Ants live in nests under the ground." }
            spans: ["Ant", "homes"]

  - n: 2
    title: { de: Glossar und Ordnung im Buch, en: Glossaries and how books are organised }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Minibeasts. Which page tells you about snails?"
            show: { drawn: table, rows: [["Contents", "Page"], ["Ants", "2"], ["Bees", "4"], ["Snails", "6"], ["Butterflies", "8"], ["Glossary", "10"]] }
            options: ["6", "4", "8"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "A heading tells you what a part of the book is about."
            say: "Read it. Is it true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Minibeasts: glossary"
            say: "Many information books have a glossary near the back. A glossary explains the special words in the book."
            show: { drawn: table, rows: [["Glossary", ""], ["antenna", "a feeler on an insect's head"], ["colony", "a big group of ants living together"], ["hive", "the home of a group of bees"], ["nectar", "a sweet juice in flowers"]] }
          - text: "a b c d e f g h i j k l m n o p q r s t u v w x y z"
            say: "The words in a glossary are in alphabetical order, the order of the alphabet. Antenna starts with a, so it comes first. Nectar starts with n, so it comes later."
          - text: "contents: what is in the book, and where\nglossary: what a word means"
            say: "Use the contents to find where a topic is. Use the glossary to find what a word means."
          - text: "by topic   in time order   in alphabetical order"
            say: "Information books are organised in different ways. A book about minibeasts goes topic by topic. A book about how a frog grows goes in time order: egg, tadpole, frog. A glossary or a dictionary goes in alphabetical order."
            show: { object: frog }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "In Minibeasts you read the word hive. You want to know what it means. Where do you look?"
                options: ["in the glossary", "in the contents", "on the cover"]
                answer: "in the glossary"
                option_audio: false
                feedback:
                  "in the contents": "The contents page tells you where topics are. To find what a word means, use the glossary."
                hints:
                  - "Which part explains special words?"
                  - "It is near the back of the book."
                  - "In the glossary."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Minibeasts glossary. What is nectar?"
                show: { drawn: table, rows: [["Glossary", ""], ["antenna", "a feeler on an insect's head"], ["colony", "a big group of ants living together"], ["hive", "the home of a group of bees"], ["nectar", "a sweet juice in flowers"]] }
                options: ["a sweet juice in flowers", "the home of a group of bees", "a feeler on an insect's head"]
                answer: "a sweet juice in flowers"
                option_audio: false
                hints:
                  - "Find nectar in the left column."
                  - "Read across to the meaning."
                  - "A sweet juice in flowers."
              - id: l2-f3
                type: ordering
                text: "Put the glossary words in alphabetical order."
                options: ["shell", "egg", "wing", "leg"]
                slot_count: 4
                answer: ["egg", "leg", "shell", "wing"]
                hints:
                  - "Look at the first letter of each word."
                  - "e, l, s, w: which comes first in the alphabet?"
                  - "egg, leg, shell, wing."
              - id: l2-f4
                type: multiple_choice
                text: "A book called From Egg to Frog shows an egg, then a tadpole, then a frog. How is it organised?"
                options: ["in time order", "in alphabetical order", "it is a story"]
                answer: "in time order"
                option_audio: false
                hints:
                  - "Look at what comes first, next and last."
                  - "It follows the frog as it grows."
                  - "In time order."
              - id: l2-f5
                type: multiple_choice
                text: "You want to find the page about butterflies. Where do you look?"
                options: ["in the contents", "in the glossary", "on the last page"]
                answer: "in the contents"
                option_audio: false
                hints:
                  - "Do you want a word meaning or a page?"
                  - "The contents page lists topics and pages."
                  - "In the contents."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Minibeasts glossary. What is a colony?"
                show: { drawn: table, rows: [["Glossary", ""], ["antenna", "a feeler on an insect's head"], ["colony", "a big group of ants living together"], ["hive", "the home of a group of bees"], ["nectar", "a sweet juice in flowers"]] }
                options: ["a big group of ants living together", "a sweet juice in flowers", "the home of a group of bees"]
                answer: "a big group of ants living together"
                option_audio: false
                hints: ["Find colony in the left column."]
              - id: l2-s2
                type: ordering
                text: "Put the glossary words in alphabetical order."
                options: ["pond", "frog", "tadpole"]
                slot_count: 3
                answer: ["frog", "pond", "tadpole"]
                hints: ["f, p, t: which letter comes first?"]
              - id: l2-s3
                type: true_false
                text: "In a glossary, the words are in alphabetical order."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Antenna came before nectar."]
              - id: l2-s4
                type: multiple_choice
                text: "A book called Space has a part on the Sun, a part on the Moon and a part on stars. How is it organised?"
                options: ["by topic", "in time order", "in alphabetical order"]
                answer: "by topic"
                option_audio: false
                hints: ["Each part is about a different thing."]
              - id: l2-s5
                type: multiple_choice
                text: "You read the word tadpole and do not know what it means. Where do you look?"
                options: ["in the glossary", "in the contents", "in a story book"]
                answer: "in the glossary"
                option_audio: false
                hints: ["Which part explains words?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Our Pets glossary. What is a hutch?"
                show: { drawn: table, rows: [["Glossary", ""], ["collar", "a band worn round a pet's neck"], ["gills", "the parts a fish breathes with"], ["hutch", "a wooden house for a rabbit"], ["vet", "a doctor for animals"]] }
                options: ["a wooden house for a rabbit", "a doctor for animals", "a band worn round a pet's neck"]
                answer: "a wooden house for a rabbit"
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Put the glossary words in alphabetical order."
                options: ["vet", "collar", "hutch", "gills"]
                slot_count: 4
                answer: ["collar", "gills", "hutch", "vet"]
              - id: l2-n3
                type: multiple_choice
                text: "A book called How to Make a Pizza says: first make the dough, next add the sauce, then bake it. How is it organised?"
                options: ["in time order", "by topic", "in alphabetical order"]
                answer: "in time order"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "The glossary tells you which page a topic is on."
                say: "Read it. Is it true?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Our Pets glossary. Which word means a doctor for animals?"
                show: { drawn: table, rows: [["Glossary", ""], ["collar", "a band worn round a pet's neck"], ["gills", "the parts a fish breathes with"], ["hutch", "a wooden house for a rabbit"], ["vet", "a doctor for animals"]] }
                options: ["vet", "collar", "gills"]
                answer: "vet"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: contents
            type: multiple_choice
            text: "Weather. Which page tells you about snow?"
            show: { drawn: table, rows: [["Contents", "Page"], ["Sun", "2"], ["Rain", "6"], ["Wind", "10"], ["Snow", "14"], ["Glossary", "18"]] }
            options: ["14", "10", "18"]
            answer: "14"
          - id: l2-c2
            part: headings
            type: multiple_choice
            text: "Which heading fits?\n\n_\nSnow falls from the clouds when it is very cold. It is soft and white. You can build a snowman with it."
            options: ["What is snow?", "Building", "Hot days"]
            answer: "What is snow?"
            option_audio: false
          - id: l2-c3
            part: glossary
            type: multiple_choice
            text: "Weather glossary. What does freeze mean?"
            show: { drawn: table, rows: [["Glossary", ""], ["cloud", "lots of tiny drops of water in the sky"], ["freeze", "to turn into ice when it is very cold"], ["puddle", "a small pool of rain on the ground"]] }
            options: ["to turn into ice when it is very cold", "a small pool of rain on the ground", "lots of tiny drops of water in the sky"]
            answer: "to turn into ice when it is very cold"
            option_audio: false
          - id: l2-c4
            part: glossary
            type: multiple_choice
            text: "You want to know what the word puddle means. Where do you look?"
            options: ["in the glossary", "in the contents", "on the cover"]
            answer: "in the glossary"
            option_audio: false
          - id: l2-c5
            part: organised
            type: ordering
            text: "Put the glossary words in alphabetical order."
            options: ["sun", "rain", "wind", "cloud"]
            slot_count: 4
            answer: ["cloud", "rain", "sun", "wind"]
          - id: l2-c6
            part: contents
            type: multiple_choice
            text: "Our Bodies. Which page tells you how to keep your teeth clean?"
            show: { drawn: table, rows: [["Contents", "Page"], ["Eyes", "2"], ["Ears", "5"], ["Teeth", "9"], ["Bones", "12"], ["Glossary", "16"]] }
            options: ["5", "12", "9"]
            answer: "9"
          - id: l2-c7
            part: contents
            type: multiple_choice
            text: "Our Bodies. What is on page 12?"
            show: { drawn: table, rows: [["Contents", "Page"], ["Eyes", "2"], ["Ears", "5"], ["Teeth", "9"], ["Bones", "12"], ["Glossary", "16"]] }
            options: ["teeth", "bones", "eyes"]
            answer: "bones"
          - id: l2-c8
            part: contents
            type: true_false
            text: "Weather. Is it true? The part about wind starts on page 10."
            say: "Look at the contents page. Is it true? The part about wind starts on page ten."
            show: { drawn: table, rows: [["Contents", "Page"], ["Sun", "2"], ["Rain", "6"], ["Wind", "10"], ["Snow", "14"], ["Glossary", "18"]] }
            answer: true
          - id: l2-c9
            part: headings
            type: multiple_choice
            text: "Which heading fits?\n\n_\nYour heart pumps blood all round your body. It beats faster when you run."
            options: ["Running", "Your busy heart", "Blood is red"]
            answer: "Your busy heart"
            option_audio: false
          - id: l2-c10
            part: headings
            type: highlight_in_text
            text: "Tap every word of the heading."
            say: "Read the page. Tap every word of the heading."
            show: { drawn: letter-card, text: "Strong bones. Milk and cheese help them grow." }
            spans: ["Strong", "bones"]
          - id: l2-c11
            part: headings
            type: true_false
            text: "The heading fits the text.\n\nThe sea\nRabbits live under the ground in burrows."
            say: "Read the heading and the text. Is it true? The heading fits the text."
            answer: false
          - id: l2-c12
            part: story-or-info
            type: sorting
            text: "Is each sentence from a story or an information book? Sort them."
            say: "Read each sentence yourself. Is it from a story or from an information book? Sort them."
            option_audio: false
            bins:
              - { id: story, show: { text: "story" }, say: "Story." }
              - { id: info, show: { text: "information book" }, say: "Information book." }
            options:
              - { text: "Ollie the owl was afraid of the dark.", bin: story }
              - { text: "Owls hunt at night.", bin: info }
              - { text: "One night, the Moon came down to play.", bin: story }
              - { text: "The Moon goes round the Earth.", bin: info }
          - id: l2-c13
            part: story-or-info
            type: multiple_choice
            text: "Which book is an information book?"
            options: ["Ollie and the Magic Hat", "All About Owls", "The Giant Who Sneezed"]
