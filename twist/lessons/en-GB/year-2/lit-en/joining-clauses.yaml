# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.joining-clauses
skill: lit-en.grammar.conjunctions-y2
curriculum: en-GB
language: en
title:
  de: Teilsätze mit Bindewörtern verbinden
  en: Joining clauses with conjunctions
summary: >
  A conjunction joins two clauses into one longer sentence. Lesson 1 uses
  and (adds more), but (something different or surprising) and or (a
  choice); lesson 2 uses because (a reason), when (a time), if (something
  that might happen) and that (says more about what someone thinks, says
  or knows), and ends with the skill check. Children choose the
  conjunction that makes sense and match clauses that belong together.
metadata:
  year: year-2
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.grammar.sentences-and]
  also_practises: []
  vocabulary: { en: [conjunction, clause, join, and, but, or, because, when, if, that] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: and-for-everything
      what: Joins every pair of clauses with and, even where but or because fits better (I like cake and I am full)
      addressed: Lesson 1 Learn screen 2 sets and against but; feedback in l1-f2; l1-s1, l1-n3, l2-c1
    - id: because-when-swap
      what: Uses because where the sentence tells a time, or when where it gives a reason; tasks say which one is wanted where both could fit
      addressed: Lesson 2 Learn screens 1 and 2 give the question each one answers (why? when?); feedback in l2-f1; l2-s2, l2-n1
    - id: if-certain
      what: Uses if for something that is certain (if it is Tuesday today)
      addressed: Lesson 2 Learn screen 3 says if is for something that might happen; l2-f4, l2-s4, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "and, but, or", en: "and, but, or" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Fill the gap: I have a cat _ a dog."
            say: "Which joining word fits the gap?"
            frame: "I have a cat _ a dog."
            options: ["and", "the", "is"]
            answer: ["and"]
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Build the sentence."
            say: "Put the words in order to make a sentence. It starts with We. First we ran, then we jumped."
            options: ["and", "We", "ran", "jumped"]
            slot_count: 4
            answer: ["We", "ran", "and", "jumped"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I ate my lunch. I went out to play.\nI ate my lunch and I went out to play."
            say: "A clause is a group of words with a verb in it. A conjunction joins two clauses into one sentence. And adds one more thing."
          - text: "I wanted to play, but it was raining."
            say: "But shows something different or surprising. I wanted to play, but it was raining. The second part does not go the way you expect."
          - text: "We can walk to school or we can take the bus."
            say: "Or gives a choice. You can do one thing or the other."
          - text: "and: one more\nbut: something different\nor: a choice"
            say: "Read both parts, then ask: is it one more thing, something different, or a choice?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Fill the gap: Do you want an apple _ a banana?"
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "Do you want an apple _ a banana?"
                options: ["or", "and", "but"]
                answer: ["or"]
                hints:
                  - "Is this a choice?"
                  - "You can have one of them, not both."
                  - "or"
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fill the gap: The sun was out, _ it was very cold."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "The sun was out, _ it was very cold."
                options: ["but", "and", "or"]
                answer: ["but"]
                feedback:
                  "and": "Sun usually means warm, but it was cold. That is a surprise, so use but."
                hints:
                  - "Is the second part what you would expect?"
                  - "When the sun is out you expect warm, not cold."
                  - "but"
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap: Ella fed the fish _ she cleaned the tank."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "Ella fed the fish _ she cleaned the tank."
                options: ["and", "or", "but"]
                answer: ["and"]
                hints:
                  - "Did Ella do one thing or two things?"
                  - "She did both. That is one more thing."
                  - "and"
              - id: l1-f4
                type: matching
                text: "Match the two parts."
                say: "Read the first part of each sentence. Match it with the part that makes sense."
                pairs:
                  - { left: { text: "I like milk," }, right: { text: "but I don't like cheese." } }
                  - { left: { text: "We can paint" }, right: { text: "or we can draw." } }
                  - { left: { text: "Grandpa sang" }, right: { text: "and we all clapped." } }
                hints:
                  - "Look at the conjunction at the start of each second part."
                  - "But is different, or is a choice, and is one more thing."
                  - "Milk goes with but, paint with or, sang with and."
              - id: l1-f5
                type: multiple_choice
                text: "Which conjunction gives a choice?"
                say: "Read the words yourself. Which one gives a choice?"
                options: ["or", "and", "but"]
                answer: "or"
                hints:
                  - "Think of: tea or juice?"
                  - "You choose one."
                  - "or"

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Fill the gap: I ran fast, _ I did not win."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "I ran fast, _ I did not win."
                options: ["but", "and", "or"]
                answer: ["but"]
                hints: ["Running fast but not winning is a surprise."]
              - id: l1-s2
                type: fill_in_blank
                text: "Fill the gap: You can wear the red hat _ the blue one."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "You can wear the red hat _ the blue one."
                options: ["or", "and", "but"]
                answer: ["or"]
                hints: ["You wear one hat."]
              - id: l1-s3
                type: true_false
                text: "Is it true? \"I was thirsty, but I had a drink.\" makes sense."
                answer: false
                hints: ["Is having a drink when you are thirsty a surprise?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which sentence makes sense?"
                say: "Read the sentences yourself. Which one makes sense?"
                options: ["The bus was late, but we got there on time.", "The bus was late, or we got there on time.", "The bus was late, but we got there late."]
                answer: "The bus was late, but we got there on time."
                option_audio: false
                hints: ["But is for a surprise."]
              - id: l1-s5
                type: fill_in_blank
                text: "Fill the gap: Ali washed up _ Mum dried the plates."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "Ali washed up _ Mum dried the plates."
                options: ["and", "or", "but"]
                answer: ["and"]
                hints: ["Both things happened."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Fill the gap: Shall we go to the park _ stay at home?"
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "Shall we go to the park _ stay at home?"
                options: ["or", "and", "but"]
                answer: ["or"]
              - id: l1-n2
                type: fill_in_blank
                text: "Fill the gap: The cake looked nice, _ it tasted funny."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "The cake looked nice, _ it tasted funny."
                options: ["but", "and", "or"]
                answer: ["but"]
              - id: l1-n3
                type: matching
                text: "Match the two parts."
                say: "Read the first part of each sentence. Match it with the part that makes sense."
                pairs:
                  - { left: { text: "I wanted a pear," }, right: { text: "but there were none left." } }
                  - { left: { text: "We swam in the sea" }, right: { text: "and we built a sandcastle." } }
                  - { left: { text: "Is it Monday" }, right: { text: "or is it Tuesday?" } }
              - id: l1-n4
                type: true_false
                text: "Is it true? \"Do you want peas or carrots?\" uses the right conjunction."
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Fill the gap: The dog barked _ the cat ran up a tree."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "The dog barked _ the cat ran up a tree."
                options: ["and", "or", "but"]
                answer: ["and"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Fill the gap: Would you like juice _ water?"
            say: "Read the sentence. Which conjunction fits the gap?"
            frame: "Would you like juice _ water?"
            options: ["or", "and", "but"]
            answer: ["or"]
          - id: l1-c2
            type: fill_in_blank
            text: "Fill the gap: Sam is small, _ he is very strong."
            say: "Read the sentence. Which conjunction fits the gap?"
            frame: "Sam is small, _ he is very strong."
            options: ["but", "and", "or"]
            answer: ["but"]
          - id: l1-c3
            type: multiple_choice
            text: "Which conjunction adds one more thing?"
            say: "Read the words yourself. Which one adds one more thing?"
            options: ["and", "or", "but"]
            answer: "and"

  - n: 2
    title: { de: "because, when, if, that", en: "because, when, if, that" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Fill the gap: I like rain, _ I don't like wind."
            say: "Read the sentence. Which conjunction fits the gap?"
            frame: "I like rain, _ I don't like wind."
            options: ["but", "and", "or"]
            answer: ["but"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Fill the gap: Is your cat black _ white?"
            say: "Read the sentence. Which conjunction fits the gap?"
            frame: "Is your cat black _ white?"
            options: ["or", "and", "but"]
            answer: ["or"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I put on my coat because it was raining."
            say: "Because gives a reason. It answers the question why? Why did I put on my coat? Because it was raining."
          - text: "I brush my teeth when I get up."
            say: "When tells you the time something happens. It answers the question when?"
          - text: "If it snows, we will make a snowman."
            say: "If is for something that might happen. It might snow, or it might not. If it does, we will make a snowman."
          - text: "I know that you like pizza."
            say: "That tells you what someone thinks, says or knows. I know that you like pizza. Mum said that we can go."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Fill the gap: Zara was happy _ she found her lost toy."
                say: "Read the sentence. Why was Zara happy? Which conjunction fits the gap?"
                frame: "Zara was happy _ she found her lost toy."
                options: ["because", "if", "or"]
                answer: ["because"]
                feedback:
                  "if": "Zara did find her toy, so it is not something that might happen. This is the reason she was happy."
                hints:
                  - "Does the second part give a reason?"
                  - "It tells us why Zara was happy."
                  - "because"
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Fill the gap: The owl wakes up _ it gets dark."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "The owl wakes up _ it gets dark."
                options: ["when", "that", "but"]
                answer: ["when"]
                hints:
                  - "Does the second part tell us a time?"
                  - "It tells us when the owl wakes up."
                  - "when"
              - id: l2-f3
                type: fill_in_blank
                text: "Fill the gap: Mr Shah said _ we could go out."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "Mr Shah said _ we could go out."
                options: ["that", "when", "or"]
                answer: ["that"]
                hints:
                  - "Look at the word said."
                  - "After said, thinks or knows we often use one conjunction."
                  - "that"
              - id: l2-f4
                type: fill_in_blank
                text: "Fill the gap: _ you are cold, put on a jumper."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "_ you are cold, put on a jumper."
                options: ["If", "That", "But"]
                answer: ["If"]
                hints:
                  - "Are you cold for sure, or might you be?"
                  - "You might be cold. That is something that might happen."
                  - "If"
              - id: l2-f5
                type: matching
                text: "Match each conjunction with its job."
                say: "Read each conjunction. Match it with its job."
                pairs:
                  - { left: { text: "because" }, right: { text: "gives a reason" } }
                  - { left: { text: "when" }, right: { text: "says when" } }
                  - { left: { text: "if" }, right: { text: "might happen" } }
                hints:
                  - "Which one answers why?"
                  - "Because answers why. When answers when."
                  - "because: gives a reason, when: says when, if: might happen."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Fill the gap: I think _ it will rain today."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "I think _ it will rain today."
                options: ["that", "because", "or"]
                answer: ["that"]
                hints: ["It tells you what someone thinks."]
              - id: l2-s2
                type: fill_in_blank
                text: "Fill the gap: We sing a song _ it is someone's birthday."
                say: "Read the sentence. It tells you the time we sing. Which conjunction fits the gap?"
                frame: "We sing a song _ it is someone's birthday."
                options: ["when", "that", "or"]
                answer: ["when"]
                hints: ["It answers: when do we sing?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which sentence makes sense?"
                say: "Read the sentences yourself. Which one makes sense?"
                options: ["The plant died because it had no water.", "The plant died because it was green.", "The plant died that it had no water."]
                answer: "The plant died because it had no water."
                option_audio: false
                hints: ["Which one gives a real reason?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Fill the gap: _ we win, we will get a cup."
                say: "Read the sentence. We might win. Which conjunction fits the gap?"
                frame: "_ we win, we will get a cup."
                options: ["If", "That", "Or"]
                answer: ["If"]
                hints: ["It might happen."]
              - id: l2-s5
                type: matching
                text: "Match the two parts."
                say: "Read the first part of each sentence. Match it with the part that makes sense."
                pairs:
                  - { left: { text: "I was tired" }, right: { text: "because I went to bed late." } }
                  - { left: { text: "Wash your hands" }, right: { text: "when you come in." } }
                  - { left: { text: "Kit knows" }, right: { text: "that cats like fish." } }
                hints: ["Ask why, when, or what someone knows."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Fill the gap: The baby cried _ he was hungry."
                say: "Read the sentence. Why did the baby cry? Which conjunction fits the gap?"
                frame: "The baby cried _ he was hungry."
                options: ["because", "if", "or"]
                answer: ["because"]
              - id: l2-n2
                type: fill_in_blank
                text: "Fill the gap: _ you see Dan, say hello."
                say: "Read the sentence. You might see Dan. Which conjunction fits the gap?"
                frame: "_ you see Dan, say hello."
                options: ["If", "That", "But"]
                answer: ["If"]
              - id: l2-n3
                type: fill_in_blank
                text: "Fill the gap: Priya said _ the film was funny."
                say: "Read the sentence. Which conjunction fits the gap?"
                frame: "Priya said _ the film was funny."
                options: ["that", "when", "or"]
                answer: ["that"]
              - id: l2-n4
                type: true_false
                text: "Is it true? \"We had a picnic because the sun was shining.\" makes sense."
                answer: true
              - id: l2-n5
                type: ordering
                text: "Build the second part of the sentence."
                say: "I wore my wellies because it was muddy. Put the cards in order to finish the sentence after I wore my wellies."
                options: ["was", "because", "muddy", "it"]
                slot_count: 4
                answer: ["because", "it", "was", "muddy"]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Fill the gap: I can swim, _ I can't dive."
            say: "Read the sentence. Which conjunction fits the gap?"
            frame: "I can swim, _ I can't dive."
            options: ["but", "and", "or"]
            answer: ["but"]
          - id: l2-c2
            type: fill_in_blank
            text: "Fill the gap: Leo laughed _ the clown fell over."
            say: "Read the sentence. It tells you the time Leo laughed. Which conjunction fits the gap?"
            frame: "Leo laughed _ the clown fell over."
            options: ["when", "that", "or"]
            answer: ["when"]
          - id: l2-c3
            type: fill_in_blank
            text: "Fill the gap: Do you want to read _ play a game?"
            say: "Read the sentence. Which conjunction fits the gap?"
            frame: "Do you want to read _ play a game?"
            options: ["or", "because", "that"]
            answer: ["or"]
          - id: l2-c4
            type: fill_in_blank
            text: "Fill the gap: _ it rains, we will stay inside."
            say: "Read the sentence. It might rain. Which conjunction fits the gap?"
            frame: "_ it rains, we will stay inside."
            options: ["If", "That", "But"]
            answer: ["If"]
          - id: l2-c5
            type: fill_in_blank
            text: "Fill the gap: The road was wet _ it had rained."
            say: "Read the sentence. Why was the road wet? Which conjunction fits the gap?"
            frame: "The road was wet _ it had rained."
            options: ["because", "if", "or"]
            answer: ["because"]
