# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.exception-words-y2
skill: lit-en.word-reading.exception-words-y2
curriculum: en-GB
language: en
title:
  de: Ausnahmewörter lesen (Year 2)
  en: Reading Year 2 tricky words
summary: >
  Common exception words from the Year 2 list do not sound quite the way
  their letters suggest. Lesson 1 takes the families that share a tricky
  part: i says igh in find, kind, child and wild; o says oh in old, cold,
  most and both; oor says or in door, floor and poor. Lesson 2 takes the
  odd ones (eye, could, would, should, who, many, any, water, people,
  busy, great, break) and a says ar in fast, path and father, and ends
  with the skill check. Children find the tricky part, then read the
  whole word at a glance.
metadata:
  year: year-2
  topic: { de: Wörter lesen, en: Reading words }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.word-reading.exception-words-y1]
  also_practises: [lit-en.word-reading.sight-reading]
  vocabulary: { en: [common exception word, tricky word, tricky part, sound, read] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: igh, what: { de: "Wörter lesen, in denen i wie igh klingt (find, child, wild)", en: "reading words where i says igh (find, child, wild)" } }
    - { id: oh-or, what: { de: "Wörter lesen, in denen o wie oh oder oor wie or klingt (old, both, door)", en: "reading words where o says oh or oor says or (old, both, door)" } }
    - { id: odd-ones, what: { de: "die besonderen Wörter lesen (could, eye, who, water, many, great)", en: "reading the odd ones (could, eye, who, water, many, great)" } }
    - { id: in-sentence, what: { de: "schwierige Wörter im Satz lesen und verstehen", en: "reading tricky words in a sentence and understanding it" } }
  misconceptions:
    - id: sound-out-tricky
      what: Sounds out a tricky word letter by letter (find as fin-d, both as both with a short o)
      addressed: Learn names the tricky part of each family; l1-f2 and l1-f3 ask how the tricky part sounds, with feedback on the short sound
    - id: look-alike-words
      what: Reads a word as one that looks like it (door for poor, could for cold, would for wood)
      addressed: audio_choice tasks set look-alike words side by side (l1-f4, l2-f2, l2-s3); feedback in l2-f2 names the difference
    - id: accent-a
      what: Is confused when a teacher reads fast or path with ar, because at home it is said with a short a
      addressed: Learn screen 3 of lesson 2 says both ways are right; l2-f4 asks about the a in father, which has ar everywhere
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wortfamilien: find, old, door", en: "Word families: find, old, door" }
    goal:
      de: "Lies Wortfamilien mit einer schwierigen Stelle wie find, old und door und hör, was die Buchstaben wirklich sagen."
      en: "Read word families with a tricky part, like find, old and door, and notice what the letters really say."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Said." }
            options: ["said", "sad", "sand"]
            answer: "said"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "My friend is at school."
            say: "Read the sentence. Does it make sense?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "find"
            say: "Here is a word you know. What do you think: does the i in find sound like the i in fin, or like the igh in night? Have a guess."
            show: { drawn: letter-card, text: "find" }
          - text: "find   kind   mind   child   wild"
            say: "It sounds like night! These are common exception words. In each one the i says igh, not i. Find, kind, mind, child, wild. The tricky part is the i."
            show: { drawn: letter-card, text: "find" }
          - text: "old   cold   gold   told   most   both"
            say: "Here the o says oh, not o. Old, cold, gold, told, most, both. Only has it too: only."
            show: { drawn: letter-card, text: "cold" }
          - text: "door   floor   poor"
            say: "In these words o o r says or, like in for. Door, floor, poor. They look alike, so look at the first letters too."
            show: { object: door }
          - text: "climb"
            say: "Climb has the igh sound too, and a silent b at the end. You do not say the b."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "door" }
                options: [{ object: door }, { object: dog }, { object: window }]
                answer: door
                hints:
                  - "Start with the first sound: d."
                  - "o o r says or: d ... or."
                  - "Door."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "kind: what sound does the i make?"
                say: "Read the word kind. What sound does the i make?"
                options: ["igh, as in night", "i, as in pin"]
                answer: "igh, as in night"
                option_audio: false
                feedback:
                  "i, as in pin": "That would say kinnd. In kind, find and mind the i says igh."
                hints:
                  - "Kind is in the find family."
                  - "Find, mind, kind all rhyme."
                  - "The i says igh."
              - id: l1-f3
                type: multiple_choice
                text: "both: what sound does the o make?"
                say: "Read the word both. What sound does the o make?"
                options: ["oh, as in go", "o, as in hot"]
                answer: "oh, as in go"
                option_audio: false
                feedback:
                  "o, as in hot": "That would rhyme with moth. In both, most and old the o says oh."
                hints:
                  - "Both is in the old family."
                  - "Most and both sound alike at the start."
                  - "The o says oh."
              - id: l1-f4
                type: audio_choice
                text: "Listen. Tap the word you hear."
                audio: { en: "Poor." }
                options: ["door", "poor", "floor"]
                answer: "poor"
                hints:
                  - "All three end in o o r."
                  - "Listen to the first sound: p."
                  - "Poor."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "This word is climb. Tap the letter you do not say."
                show: { drawn: letter-card, text: "c l i m b" }
                spans: ["b"]
                hints:
                  - "Say climb slowly."
                  - "c ... l ... igh ... m. What is left over?"
                  - "The b."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "child" }
                options: [{ object: chair }, { object: child }, { object: cheese }]
                answer: child
                hints: ["The i says igh: ch ... igh ... l ... d."]
              - id: l1-s2
                type: audio_choice
                text: "Listen. Tap the word you hear."
                audio: { en: "Told." }
                options: ["told", "cold", "hold"]
                answer: "told"
                hints: ["Listen to the first sound: t."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap every word from the find family."
                say: "Tap every word where the i says igh."
                show: { drawn: letter-card, text: "mind pin behind wild fish" }
                spans: ["mind", "behind", "wild"]
                hints: ["Three words. Pin and fish have the short i."]
              - id: l1-s4
                type: true_false
                text: "The floor is wet."
                say: "Read the sentence. Does it make sense?"
                answer: true
                hints: ["Floor rhymes with door."]
              - id: l1-s5
                type: multiple_choice
                text: "The wind is _ today."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["cold", "could", "climb"]
                answer: "cold"
                option_audio: false
                hints: ["The word is in the old family."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Listen. Tap the word you hear."
                audio: { en: "Most." }
                options: ["most", "mist", "must"]
                answer: "most"
              - id: l1-n2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "door", flash: 2 }
                options: [{ object: door }, { object: duck }, { object: doctor }]
                answer: door
              - id: l1-n3
                type: true_false
                text: "The poor dog is cold and wet."
                say: "Read the sentence. Does it make sense?"
                answer: true
              - id: l1-n4
                type: true_false
                text: "I climb into my cup of milk."
                say: "Read the sentence. Does it make sense?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Look _ the door."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["behind", "both", "gold"]
                answer: "behind"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Kind." }
            options: ["kind", "kid", "kit"]
            answer: "kind"
          - id: l1-c2
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Floor." }
            options: ["flower", "floor", "four"]
            answer: "floor"
          - id: l1-c3
            type: multiple_choice
            text: "The king has a crown made of _."
            say: "Which word finishes the sentence? Read them yourself."
            options: ["gold", "good", "goat"]
            answer: "gold"
            option_audio: false
          - id: l1-c4
            type: highlight_in_text
            text: "Tap every word where oor says or."
            say: "Read the words yourself. Tap every word where o o r says or."
            show: { drawn: letter-card, text: "door book floor cool poor" }
            spans: ["door", "floor", "poor"]
          - id: l1-c5
            type: true_false
            text: "The child found a gold coin in the sand."
            say: "Read the sentence. Does it make sense?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which word rhymes with cold?"
            say: "Read the words yourself. Which one rhymes with cold?"
            options: ["could", "told", "clod"]
            answer: "told"
            option_audio: false

  - n: 2
    title: { de: "Die besonders schwierigen Wörter", en: "The trickiest words" }
    goal:
      de: "Lies die schwierigsten Wörter wie eye, people und water als ganze Wörter auf einen Blick."
      en: "Read the trickiest words, like eye, people and water, as whole words at a glance."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Wild." }
            options: ["wild", "will", "wind"]
            answer: "wild"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Then tap its picture."
            show: { drawn: letter-card, text: "child" }
            options: [{ object: child }, { object: chalk }, { object: cheese }]
            answer: child
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "could"
            say: "Look at this word. It has an l in it. What do you think: do you say the l when you read could? Have a guess."
            show: { drawn: letter-card, text: "could" }
          - text: "could   would   should"
            say: "No, you don't! These three words go together. o u l says a short oo, like in book, and the l is silent. Could, would, should."
            show: { drawn: letter-card, text: "could" }
          - text: "fast   path   class   father"
            say: "In these words the a can say ar, as in car: fast, path, class. In many parts of England people say them with a short a. Both ways are right. Father has ar everywhere."
          - text: "eye   who   water   people"
            say: "Some words are odd ones. Eye says igh. Who says hoo. Water says wor-ter. People says pee-pul. Learn them as whole words."
            show: { object: eye }
          - text: "Did you know? eye reads the same backwards: e y e."
            say: "Did you know? Eye is spelt the same forwards and backwards: e, y, e. A word like that is called a palindrome. Mum, dad and level are palindromes too. Can you think of another one?"
            show: { drawn: letter-card, text: "eye" }
          - text: "any   many   busy   great   break"
            say: "Any and many say e, not a: enny, menny. Busy says bizzy. Great and break say ay, as in day."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "water" }
                options: [{ object: water }, { object: whale }, { object: window }]
                answer: water
                feedback:
                  whale: "A whale swims in water, but it would not fit in your glass! Read on after the w: the a says or."
                hints:
                  - "It starts with w."
                  - "The a says or: w ... or ... t ... er."
                  - "Water."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Listen. Tap the word you hear."
                audio: { en: "Could." }
                options: ["cold", "could", "cloud"]
                answer: "could"
                feedback:
                  cold: "Cold has no u. Could has o u l and says cood."
                hints:
                  - "Could goes with would and should."
                  - "Look for o u l d."
                  - "Could."
              - id: l2-f3
                type: multiple_choice
                text: "many: what sound does the a make?"
                say: "Read the word many. What sound does the a make?"
                options: ["e, as in bed", "a, as in cat", "ay, as in day"]
                answer: "e, as in bed"
                option_audio: false
                feedback:
                  "a, as in cat": "That would say mannie. Many and any say e: menny, enny."
                hints:
                  - "Many goes with any."
                  - "Say it: menny."
                  - "The a says e."
              - id: l2-f4
                type: true_false
                text: "In father, the a says ar, as in car."
                say: "Read the sentence. Is it true?"
                answer: true
                hints:
                  - "Say father slowly."
                  - "f ... ar ... th ... er."
                  - "Yes, it says ar."
              - id: l2-f5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "eye" }
                options: [{ object: ear }, { object: egg }, { object: eye }]
                answer: eye
                feedback:
                  egg: "Egg starts with e and says e. Eye looks odd: it says igh."
                hints:
                  - "This word is an odd one."
                  - "e y e says igh."
                  - "Eye."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Listen. Tap the word you hear."
                audio: { en: "Who." }
                options: ["who", "how", "why"]
                answer: "who"
                hints: ["Who says hoo, and the w is silent."]
              - id: l2-s2
                type: multiple_choice
                text: "great: what sound does ea make?"
                say: "Read the word great. What sound do the letters e a make?"
                options: ["ay, as in day", "ee, as in tea"]
                answer: "ay, as in day"
                option_audio: false
                hints: ["Great rhymes with plate."]
              - id: l2-s3
                type: audio_choice
                text: "Listen. Tap the word you hear."
                audio: { en: "Would. Would you like a drink?" }
                options: ["wood", "would", "word"]
                answer: "would"
                hints: ["It goes with could and should."]
              - id: l2-s4
                type: true_false
                text: "The people are busy at the shop."
                say: "Read the sentence. Does it make sense?"
                answer: true
                hints: ["People says pee-pul, busy says bizzy."]
              - id: l2-s5
                type: highlight_in_text
                text: "Tap every word where a says e."
                say: "Tap every word where the a says e, as in bed."
                show: { drawn: letter-card, text: "any cat many hat" }
                spans: ["any", "many"]
                hints: ["Two words. They rhyme."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Listen. Tap the word you hear."
                audio: { en: "Should." }
                options: ["should", "shout", "shed"]
                answer: "should"
              - id: l2-n2
                type: true_false
                text: "Who would like to break a great big egg?"
                say: "Read the question. Does it make sense?"
                answer: true
              - id: l2-n3
                type: true_false
                text: "Many fish can climb a tree."
                say: "Read the sentence. Does it make sense?"
                answer: false
              - id: l2-n4
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "water", flash: 2 }
                options: [{ object: water }, { object: milk }, { object: juice }]
                answer: water
              - id: l2-n5
                type: multiple_choice
                text: "My _ reads me a story."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["father", "fast", "path"]
                answer: "father"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: oh-or
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Both." }
            options: ["both", "bath", "boat"]
            answer: "both"
          - id: l2-c2
            part: igh
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Behind." }
            options: ["behind", "begin", "bend"]
            answer: "behind"
          - id: l2-c3
            part: odd-ones
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "People." }
            options: ["purple", "people", "pebble"]
            answer: "people"
          - id: l2-c4
            part: in-sentence
            type: multiple_choice
            text: "We run _ in the race."
            say: "Which word finishes the sentence? Read them yourself."
            options: ["fast", "father", "find"]
            answer: "fast"
            option_audio: false
          - id: l2-c5
            part: in-sentence
            type: true_false
            text: "A busy bee could fly over the door."
            say: "Read the sentence. Does it make sense?"
            answer: true
          - id: l2-c6
            part: igh
            type: highlight_in_text
            text: "Tap every word where the i says igh."
            say: "Read the words yourself. Tap every word where the i says igh."
            show: { drawn: letter-card, text: "kind sit climb milk find" }
            spans: ["kind", "climb", "find"]
          - id: l2-c7
            part: igh
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Mind." }
            options: ["mend", "mind", "mint"]
            answer: "mind"
          - id: l2-c8
            part: igh
            type: true_false
            text: "A child can climb up a cloud."
            say: "Read the sentence. Does it make sense?"
            answer: false
          - id: l2-c9
            part: igh
            type: multiple_choice
            text: "Which word rhymes with find?"
            say: "Read the words yourself. Which one rhymes with find?"
            options: ["fin", "kind", "fond"]
            answer: "kind"
            option_audio: false
          - id: l2-c10
            part: oh-or
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Only." }
            options: ["on", "owl", "only"]
            answer: "only"
          - id: l2-c11
            part: oh-or
            type: multiple_choice
            text: "The cat is asleep on the _."
            say: "Which word finishes the sentence? Read them yourself."
            options: ["for", "floor", "flow"]
            answer: "floor"
            option_audio: false
          - id: l2-c12
            part: oh-or
            type: highlight_in_text
            text: "Tap every word where the o says oh."
            say: "Read the words yourself. Tap every word where the o says oh."
            show: { drawn: letter-card, text: "most hot told cold dog" }
            spans: ["most", "told", "cold"]
          - id: l2-c13
            part: oh-or
            type: true_false
            text: "My old coat is too small for me now."
            say: "Read the sentence. Does it make sense?"
            answer: true
          - id: l2-c14
            part: odd-ones
            type: image_multiple_choice
            text: "Read the word quickly. Tap the picture."
            say: "The word is shown for a moment. Read it, then tap its picture."
            show: { drawn: letter-card, text: "eye", flash: 1.5 }
            options: [{ object: nose }, { object: eye }, { object: mouth }]
            answer: eye
            option_audio: false
          - id: l2-c15
            part: odd-ones
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Many." }
            options: ["man", "money", "many"]
            answer: "many"
          - id: l2-c16
            part: odd-ones
            type: audio_choice
            text: "Listen. Tap the word you hear."
            audio: { en: "Break." }
            options: ["break", "brick", "bread"]
            answer: "break"
          - id: l2-c17
            part: odd-ones
            type: true_false
            text: "In any, the a says a, as in cat."
            say: "Read the sentence. Is it true?"
            answer: false
          - id: l2-c18
            part: in-sentence
            type: multiple_choice
            text: "_ is at the door?"
            say: "Which word starts the question? Read them yourself."
            options: ["How", "Who", "Why"]
            answer: "Who"
            option_audio: false
          - id: l2-c19
            part: in-sentence
            type: true_false
            text: "My eye can hear a great song."
            say: "Read the sentence. Does it make sense?"
            answer: false
          - id: l2-c20
            part: in-sentence
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the question. Tap the word that does not make sense."
            show: { drawn: letter-card, text: "Would you like a glass of floor?" }
            spans: ["floor"]
