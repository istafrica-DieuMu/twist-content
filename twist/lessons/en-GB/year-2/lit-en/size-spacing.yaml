# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.size-spacing
skill: lit-en.handwriting.size-spacing
curriculum: en-GB
language: en
title:
  de: Buchstabengröße und Wortabstände
  en: Letter size and spacing
summary: >
  Letters come in three sizes on the line: small letters sit between the
  lines (a, c, e, o), tall letters reach up (b, d, h, k, l, t), and
  letters with tails go down below the line (g, j, p, y). Capitals and
  digits are tall too. Lesson 1 sorts and traces letters by size; lesson
  2 leaves a finger space between words and copies short sentences, and
  ends with the skill check. Tracing carries its own support. The app
  cannot yet judge the size and spacing in the child's own copied
  writing: any ink counts. The skill check marks knowing the sizes and
  the spaces; Practise covers writing them.
metadata:
  year: year-2
  topic: { de: Handschrift, en: Handwriting }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.handwriting.capitals-digits]
  also_practises: [lit-en.handwriting.letter-families]
  vocabulary: { en: [small letter, tall letter, tail, capital letter, digit, line, finger space, word, sentence] }
  forms: [drawn, text, audio]
  drawn: [writing-lines, letter-card]
  facets: [script]
  parts:
    - { id: small-tall, what: { de: kleine und große Buchstaben unterscheiden, en: telling small letters from tall letters } }
    - { id: tails, what: { de: Buchstaben mit Unterlänge erkennen, en: knowing the letters whose tails drop below the line } }
    - { id: capitals-digits, what: { de: "Großbuchstaben und Ziffern sind groß und haben keine Unterlänge", en: capitals and digits are tall and never drop below the line } }
    - { id: spacing, what: { de: "Wortabstände zwischen Wörtern, nicht in Wörtern", en: "finger spaces between words, not inside them" } }
  misconceptions:
    - id: all-same-size
      what: Writes every letter the same height, so tall letters and small letters look alike (h like n, l like i)
      addressed: Learn screens 1 to 3 of lesson 1 name the three sizes; l1-f1, l1-s1 and l1-n4 sort letters by size, with feedback in l1-f2
    - id: tails-on-line
      what: Sits g, p and y on the line instead of letting the tail drop below it
      addressed: l1-f3 and l1-s3 ask which letters go below the line; l1-f4 traces y with its tail
    - id: no-spaces
      what: Runs words together with no space, or leaves big gaps inside a word
      addressed: Learn of lesson 2 shows a finger space; l2-f1, l2-f2 and l2-s2 compare sentences with and without spaces, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Klein, groß und mit Unterlänge", en: "Small, tall and tails" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tracing
            text: "Trace the capital H."
            say: "Trace the capital H. Start at the green dot: a line down, another line down, then a line across the middle."
            show: { drawn: writing-lines, text: "H", mode: trace, arrows: true }
            char: "H"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Small d. Which is its capital?"
            say: "Here is a small d. Tap its capital letter."
            frame: "d → _"
            options: ["D", "B", "P"]
            answer: ["D"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "a  c  e  m  n  o  r  s  u"
            say: "These are small letters. They sit on the line and stay low, all the same height. Think of them as sitting in the middle of the lines."
            show: { drawn: writing-lines, text: "acemo", mode: trace, arrows: false }
          - text: "b  d  h  k  l  t"
            say: "These are tall letters. They sit on the line too, but they reach up high. Small t is a little shorter than the others."
            show: { drawn: writing-lines, text: "bdhl", mode: trace, arrows: false }
          - text: "g  j  p  q  y"
            say: "These letters have tails. Their bodies sit on the line, like a small letter, and their tails drop down below the line."
            show: { drawn: writing-lines, text: "gjpy", mode: trace, arrows: false }
          - text: "B  T  4  7"
            say: "Capital letters and digits are tall. They reach up high, like the tall letters, and they never drop below the line."
            show: { drawn: writing-lines, text: "BT47", mode: trace, arrows: false }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Small letter or tall letter? Sort them."
                say: "Look at each letter. Does it stay low, or does it reach up high? Put it in the right group."
                option_audio: false
                bins:
                  - { id: small, show: { text: "small" }, say: "Small." }
                  - { id: tall, show: { text: "tall" }, say: "Tall." }
                options:
                  - { text: "a", bin: small }
                  - { text: "h", bin: tall }
                  - { text: "o", bin: small }
                  - { text: "l", bin: tall }
                hints:
                  - "Does the letter have a tall stick?"
                  - "h and l have sticks that reach up. a and o are round and low."
                  - "Small: a, o. Tall: h, l."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which letter is tall?"
                options: ["n", "h", "m"]
                answer: "h"
                option_audio: false
                feedback:
                  n: "n is a small letter: it stays low. h looks like n with a tall stick."
                hints:
                  - "Look for a stick that reaches up."
                  - "n and m are humps that stay low."
                  - "h."
              - id: l1-f3
                type: multiple_choice
                text: "Which letter has a tail below the line?"
                options: ["a", "g", "d"]
                answer: "g"
                option_audio: false
                hints:
                  - "Look for a letter that drops down."
                  - "d goes up, a stays low."
                  - "g."
              - id: l1-f4
                type: tracing
                text: "Trace the y."
                say: "Trace the small y. Its body sits on the line and its tail goes down below the line."
                show: { drawn: writing-lines, text: "y", mode: trace, arrows: true }
                char: "y"
              - id: l1-f5
                type: tracing
                text: "Trace the word."
                say: "Trace the word dog. Small o in the middle, tall d at the start, and the tail of g goes below the line."
                show: { drawn: writing-lines, text: "dog", mode: trace, arrows: true }
                char: "dog"

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Small, tall or a tail? Sort them."
                say: "Look at each letter. Does it stay low, reach up high, or drop below the line? Put it in the right group."
                option_audio: false
                bins:
                  - { id: small, show: { text: "small" }, say: "Small." }
                  - { id: tall, show: { text: "tall" }, say: "Tall." }
                  - { id: tail, show: { text: "tail" }, say: "Tail." }
                options:
                  - { text: "e", bin: small }
                  - { text: "k", bin: tall }
                  - { text: "p", bin: tail }
                  - { text: "s", bin: small }
                  - { text: "b", bin: tall }
                  - { text: "j", bin: tail }
                hints: ["k and b reach up; p and j drop down."]
              - id: l1-s2
                type: true_false
                text: "Capital letters reach up as high as tall letters."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Think of capital T next to small l."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap every letter with a tail."
                say: "Tap every letter whose tail goes below the line."
                show: { drawn: letter-card, text: "p a y c q" }
                spans: ["p", "y", "q"]
                hints: ["Three letters drop down."]
              - id: l1-s4
                type: tracing
                text: "Trace the word."
                say: "Trace the word hat. The h is tall, the a stays small, and the t is tall but a little shorter."
                show: { drawn: writing-lines, text: "hat", mode: trace, arrows: true }
                char: "hat"
              - id: l1-s5
                type: multiple_choice
                text: "Which one reaches up high?"
                options: ["c", "B", "u"]
                answer: "B"
                option_audio: false
                hints: ["Capital letters are tall."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which letter is small?"
                options: ["l", "e", "k"]
                answer: "e"
                option_audio: false
              - id: l1-n2
                type: tracing
                text: "Copy the word."
                say: "Copy the word jug. The j and the g have tails that go below the line, and the u stays small."
                show: { drawn: writing-lines, text: "jug", mode: copy, arrows: false }
                char: "jug"
              - id: l1-n3
                type: true_false
                text: "The letter p sits on the line and does not go below it."
                say: "Read it. Is it true?"
                answer: false
              - id: l1-n4
                type: sorting
                text: "Small, tall or a tail? Sort them."
                say: "Look at each letter. Does it stay low, reach up high, or drop below the line? Put it in the right group."
                option_audio: false
                bins:
                  - { id: small, show: { text: "small" }, say: "Small." }
                  - { id: tall, show: { text: "tall" }, say: "Tall." }
                  - { id: tail, show: { text: "tail" }, say: "Tail." }
                options:
                  - { text: "u", bin: small }
                  - { text: "d", bin: tall }
                  - { text: "y", bin: tail }
                  - { text: "f", bin: tall }
                  - { text: "g", bin: tail }
                  - { text: "w", bin: small }
              - id: l1-n5
                type: tracing
                text: "Copy the word."
                say: "Copy the word bed. Make the b and the d tall, and keep the e small."
                show: { drawn: writing-lines, text: "bed", mode: copy, arrows: false }
                char: "bed"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which letter is tall?"
            options: ["c", "r", "k"]
            answer: "k"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which letter has a tail below the line?"
            options: ["q", "o", "t"]
            answer: "q"
            option_audio: false
          - id: l1-c3
            type: tracing
            text: "Copy the word."
            say: "Copy the word pig. Let the tails of p and g drop below the line."
            show: { drawn: writing-lines, text: "pig", mode: copy, arrows: false }
            char: "pig"
          - id: l1-c4
            type: sorting
            text: "Small letter or tall letter? Sort them."
            say: "Look at each letter. Does it stay low, or does it reach up high? Put it in the right group."
            option_audio: false
            bins:
              - { id: small, show: { text: "small" }, say: "Small." }
              - { id: tall, show: { text: "tall" }, say: "Tall." }
            options:
              - { text: "b", bin: tall }
              - { text: "c", bin: small }
              - { text: "k", bin: tall }
              - { text: "r", bin: small }
          - id: l1-c5
            type: true_false
            text: "The letter q sits on the line, and its tail goes below the line."
            say: "Read it. Is it true?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which one reaches up high?"
            options: ["s", "w", "D"]
            answer: "D"
            option_audio: false

  - n: 2
    title: { de: Abstände zwischen Wörtern, en: Spaces between words }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which letter has a tail below the line?"
            options: ["y", "b", "s"]
            answer: "y"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: tracing
            text: "Trace the word."
            say: "Trace the word top. Tall t, small o, and the tail of p goes below the line."
            show: { drawn: writing-lines, text: "top", mode: trace, arrows: true }
            char: "top"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Thecatsat.\nThe cat sat."
            say: "Which one is easier to read? The second one. Between words we leave a space. Then the reader can see where one word ends and the next begins."
          - text: "The  cat  sat."
            say: "A good space is about as wide as your finger. Put your finger after a word, then start the next word on the other side. That is a finger space."
            show: { drawn: writing-lines, text: "The cat sat.", mode: trace, arrows: false }
          - text: "c a t   cat"
            say: "Inside a word the letters sit close together. Do not leave big gaps inside a word, only between words."
          - text: "Sam has 2 red pens."
            say: "Capitals and digits are tall, like tall letters. In this sentence, S and 2 reach up high, and the small letters stay low."
            show: { drawn: writing-lines, text: "Sam has 2 red pens.", mode: trace, arrows: false }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which sentence has finger spaces?"
                options: ["Mydogcanrun.", "My dog can run.", "M y d o g can run."]
                answer: "My dog can run."
                option_audio: false
                feedback:
                  "M y d o g can run.": "Those gaps are inside the words. Letters in a word sit close; spaces go between words."
                hints:
                  - "Look for a gap after each word."
                  - "Is there a gap between the letters of one word? That is too many."
                  - "My dog can run."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Does it have finger spaces?\nIliketoswim."
                say: "Look at the sentence. Does it have finger spaces between the words?"
                answer: false
                hints:
                  - "Can you see where each word ends?"
                  - "The words are all squashed together."
                  - "No, there are no spaces."
              - id: l2-f3
                type: multiple_choice
                text: "How many finger spaces do you need?\nWe went home."
                say: "How many finger spaces do you need in the sentence: We went home?"
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Count the words first."
                  - "Three words need a space after the first and after the second."
                  - "2."
              - id: l2-f4
                type: tracing
                text: "Trace the sentence."
                say: "Trace the sentence. Leave a finger space between the words: I can hop."
                show: { drawn: writing-lines, text: "I can hop.", mode: trace, arrows: true }
                char: "I can hop."
              - id: l2-f5
                type: true_false
                text: "In the word dog, the d is taller than the o."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Is d a small letter or a tall letter?"
                  - "d has a tall stick; o stays low."
                  - "Yes, the d is taller."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Does it have finger spaces?\nThe sun is hot."
                say: "Look at the sentence. Does it have finger spaces between the words?"
                answer: true
                hints: ["Look for the gap after each word."]
              - id: l2-s2
                type: multiple_choice
                text: "Which sentence has finger spaces?"
                options: ["A frog is green.", "Afrog isgreen.", "A frogisgreen."]
                answer: "A frog is green."
                option_audio: false
                hints: ["There must be a gap after every word."]
              - id: l2-s3
                type: tracing
                text: "Copy the sentence."
                say: "Copy the sentence. Leave a finger space between the words: Look at me."
                show: { drawn: writing-lines, text: "Look at me.", mode: copy, arrows: false }
                char: "Look at me."
              - id: l2-s4
                type: multiple_choice
                text: "How many finger spaces do you need?\nThe bus is red."
                say: "How many finger spaces do you need in the sentence: The bus is red?"
                options: ["3", "4", "2"]
                answer: "3"
                hints: ["Four words. One space between each pair."]
              - id: l2-s5
                type: true_false
                text: "In the word cat, you leave a finger space between c and a."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Spaces go between words, not inside them."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which sentence has finger spaces?"
                options: ["Wecanplay.", "We can play.", "W e can play."]
                answer: "We can play."
                option_audio: false
              - id: l2-n2
                type: tracing
                text: "Copy the sentence."
                say: "Copy the sentence. Leave a finger space between the words: Ben has a dog."
                show: { drawn: writing-lines, text: "Ben has a dog.", mode: copy, arrows: false }
                char: "Ben has a dog."
              - id: l2-n3
                type: true_false
                text: "Does it have finger spaces?\nMumhasakey."
                say: "Look at the sentence. Does it have finger spaces between the words?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "How many finger spaces do you need?\nI see a big ship."
                say: "How many finger spaces do you need in the sentence: I see a big ship?"
                options: ["4", "5", "3"]
                answer: "4"
              - id: l2-n5
                type: tracing
                text: "Copy the sentence."
                say: "Copy the sentence. The capital and the digit are tall: Jo is 7."
                show: { drawn: writing-lines, text: "Jo is 7.", mode: copy, arrows: false }
                char: "Jo is 7."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: small-tall
            type: sorting
            text: "Sort the letters by their size on the line."
            say: "Put each letter with the letters of the same size: small, tall, or with a tail."
            option_audio: false
            bins:
              - { id: small, show: { text: "small" }, say: "Small." }
              - { id: tall, show: { text: "tall" }, say: "Tall." }
              - { id: tail, show: { text: "tail" }, say: "Tail." }
            options:
              - { text: "m", bin: small }
              - { text: "l", bin: tall }
              - { text: "q", bin: tail }
              - { text: "v", bin: small }
              - { text: "t", bin: tall }
              - { text: "p", bin: tail }
          - id: l2-c2
            part: small-tall
            type: multiple_choice
            text: "Which letter is small?"
            options: ["d", "x", "y"]
            answer: "x"
            option_audio: false
          - id: l2-c3
            part: spacing
            type: multiple_choice
            text: "Which sentence has finger spaces?"
            options: ["Thecakeisbig.", "The cakeis big.", "The cake is big."]
            answer: "The cake is big."
            option_audio: false
          - id: l2-c4
            part: capitals-digits
            type: true_false
            text: "Digits such as 4 and 9 are tall, like capital letters."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c5
            part: spacing
            type: multiple_choice
            text: "How many finger spaces do you need?\nMy cat likes milk."
            say: "How many finger spaces do you need in the sentence: My cat likes milk?"
            options: ["3", "4", "2"]
            answer: "3"
          - id: l2-c6
            part: tails
            type: highlight_in_text
            text: "Tap every letter with a tail."
            say: "Tap every letter whose tail goes below the line."
            show: { drawn: letter-card, text: "g o j b y" }
            spans: ["g", "j", "y"]
          - id: l2-c7
            part: tails
            type: true_false
            text: "The letter y has a tail that drops below the line."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c8
            part: tails
            type: multiple_choice
            text: "Which word has a letter with a tail?"
            options: ["cat", "pen", "bed"]
            answer: "pen"
            option_audio: false
          - id: l2-c9
            part: tails
            type: multiple_choice
            text: "Which word has two letters with tails?"
            options: ["gum", "hat", "gap"]
            answer: "gap"
            option_audio: false
            difficulty: stretch
          - id: l2-c10
            part: tails
            type: multiple_choice
            text: "Which letter does not have a tail?"
            options: ["p", "d", "q"]
            answer: "d"
            option_audio: false
          - id: l2-c11
            part: small-tall
            type: multiple_choice
            text: "Which word has only small letters?"
            options: ["ball", "kite", "moon"]
            answer: "moon"
            option_audio: false
          - id: l2-c12
            part: small-tall
            type: highlight_in_text
            text: "Tap every tall letter."
            say: "Tap every letter that reaches up high."
            show: { drawn: letter-card, text: "h a l e b" }
            spans: ["h", "l", "b"]
          - id: l2-c13
            part: small-tall
            type: true_false
            text: "In the word hen, all three letters are the same size."
            say: "Read it. Is it true?"
            answer: false
          - id: l2-c14
            part: capitals-digits
            type: multiple_choice
            text: "Which one reaches up high?"
            options: ["e", "n", "8"]
            answer: "8"
            option_audio: false
          - id: l2-c15
            part: capitals-digits
            type: true_false
            text: "A capital P drops below the line, like a small p."
            say: "Read it. Is it true?"
            answer: false
          - id: l2-c16
            part: capitals-digits
            type: highlight_in_text
            text: "Tap every letter or digit that reaches up high."
            say: "Tap every letter or digit that reaches up high."
            show: { drawn: letter-card, text: "S a 3 m T" }
            spans: ["S", "3", "T"]
          - id: l2-c17
            part: capitals-digits
            type: sorting
            text: "Tall, or with a tail? Sort them."
            say: "Look at each letter. Does it reach up high, or does its tail drop below the line? Put it in the right group."
            option_audio: false
            bins:
              - { id: tall, show: { text: "tall" }, say: "Tall." }
              - { id: tail, show: { text: "tail" }, say: "Tail." }
            options:
              - { text: "Y", bin: tall }
              - { text: "y", bin: tail }
              - { text: "j", bin: tail }
              - { text: "J", bin: tall }
            difficulty: stretch
          - id: l2-c18
            part: spacing
            type: true_false
            text: "Are the spaces in the right places?\nDa d is ho me."
            say: "Look at the sentence. Are the spaces in the right places?"
            answer: false
          - id: l2-c19
            part: spacing
            type: multiple_choice
            text: "How many finger spaces do you need?\nMum and I went to town."
            say: "How many finger spaces do you need in the sentence: Mum and I went to town?"
            options: ["6", "4", "5"]
            answer: "5"
          - id: l2-c20
            part: spacing
            type: multiple_choice
            text: "Which sentence has a space missing?"
            options: ["I like my bike.", "Ilike my bike.", "I like my red bike."]
            answer: "Ilike my bike."
            option_audio: false
