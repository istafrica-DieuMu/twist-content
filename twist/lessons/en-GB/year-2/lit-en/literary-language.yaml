# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.literary-language
skill: lit-en.texts.literary-language
curriculum: en-GB
language: en
title:
  de: Wiederkehrende Sprache in Geschichten und Gedichten
  en: Story language that comes back
summary: >
  Stories and poems use language that comes back again and again. Lesson
  1 takes story language: openings (once upon a time, long ago), endings
  (happily ever after, the end) and the refrains of traditional tales
  (run, run, as fast as you can). Lesson 2 takes poems: a line that is
  repeated, words that rhyme at the ends of lines, and a pattern that
  comes back in each verse; it ends with the skill check. Every text is
  read aloud and shown on screen.
metadata:
  year: year-2
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.texts.traditional-tales]
  also_practises: [lit-en.phonological.rhymes]
  vocabulary: { en: [story opening, story ending, repeated line, refrain, rhyme, verse, poem, traditional tale] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: openings-endings, what: { de: "Anfänge und Schlüsse von Geschichten erkennen (once upon a time, happily ever after)", en: "spotting story openings and endings (once upon a time, happily ever after)" } }
    - { id: refrains, what: { de: "Sätze erkennen, die in Märchen wiederkommen", en: "spotting lines that come back in traditional tales" } }
    - { id: poem-repeats, what: { de: wiederholte Zeilen und Muster in Gedichten erkennen, en: spotting repeated lines and patterns in poems } }
    - { id: rhyme, what: { de: Reimwörter am Zeilenende erkennen, en: spotting words that rhyme at the ends of lines } }
  misconceptions:
    - id: opening-ending-swap
      what: Mixes up openings and endings (puts happily ever after at the start)
      addressed: Learn screens 1 and 2 of lesson 1; l1-f1 sorts openings from endings, with feedback in l1-f2
    - id: repeat-is-mistake
      what: Thinks a repeated line in a poem or tale is a mistake, not a pattern the writer chose
      addressed: Learn screen 3 of lesson 1 and screen 1 of lesson 2 say why writers repeat lines; l1-f4, l2-f1 and l2-s4 find the repeated line
    - id: rhyme-by-letters
      what: Decides rhymes by the last letter on the page, not by the sound (thinks cat and sit rhyme, or misses blue and shoe)
      addressed: l2-f3 and l2-s2 set a look-alike and a sound-alike ending side by side, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Sprache in Geschichten, en: Story language }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Who did the wolf try to trick in the woods?"
            say: "Think of the fairy tale with the wolf and the girl in the red cape. Who did the wolf try to trick?"
            options: ["Little Red Riding Hood", "Goldilocks", "Jack"]
            answer: "Little Red Riding Hood"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many bears are in the story of Goldilocks?"
            options: ["three", "two", "seven"]
            answer: "three"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Once upon a time ...\nLong, long ago ...\nOne day ..."
            say: "Many stories start with special words. Once upon a time. Long, long ago. One day. When you hear them, you know a story is starting."
          - text: "... and they lived happily ever after.\nThe end."
            say: "Many stories end with special words too. And they lived happily ever after. The end. They tell you the story is over."
          - text: "Run, run, as fast as you can!\nYou can't catch me, I'm the Gingerbread Man!"
            say: "In some tales a line comes back again and again. Each time the Gingerbread Man meets someone, he shouts: Run, run, as fast as you can! You can't catch me, I'm the Gingerbread Man! A line that comes back is called a refrain."
          - text: "Who's that trip-trapping over my bridge?"
            say: "The troll in The Three Billy Goats Gruff asks the same question three times. Each goat hears it. The repeat helps you join in and guess what comes next."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Story openings or story endings? Sort them."
                say: "Read each card. Does it start a story or end a story? Put it in the right group."
                option_audio: false
                bins:
                  - { id: opening, show: { text: "opening" }, say: "Opening." }
                  - { id: ending, show: { text: "ending" }, say: "Ending." }
                options:
                  - { text: "Once upon a time", bin: opening }
                  - { text: "happily ever after", bin: ending }
                  - { text: "Long, long ago", bin: opening }
                  - { text: "The end.", bin: ending }
                hints:
                  - "Ask: is this the first thing I would hear, or the last?"
                  - "Ever after and the end are about when the story is over."
                  - "Openings: Once upon a time, Long, long ago. Endings: happily ever after, The end."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which words start a story?"
                options: ["Once upon a time", "They lived happily ever after.", "The end."]
                answer: "Once upon a time"
                option_audio: false
                feedback:
                  "They lived happily ever after.": "That is how a story ends. Once upon a time starts it."
                hints:
                  - "Think of the first words of a fairy tale."
                  - "Two of them are about the end."
                  - "Once upon a time."
              - id: l1-f3
                type: fill_in_blank
                text: "The Gingerbread Man shouts this every time. Finish the refrain."
                say: "The Gingerbread Man shouts this every time. Finish the line."
                frame: "Run, run, as _ as you can!"
                options: ["fast", "slow", "far"]
                answer: ["fast"]
                hints:
                  - "He wants to get away."
                  - "Nobody can catch him because he is quick."
                  - "Fast."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the words that come back."
                say: "Read the bit of the story. Some words come back three times. Tap them each time."
                show: { drawn: letter-card, text: "Trip-trap went the little goat. Trip-trap went the middle goat. Trip-trap went the big goat." }
                spans: ["Trip-trap"]
                hints:
                  - "Look at the start of each sentence."
                  - "The sound of the goats' hooves comes back."
                  - "Trip-trap, three times."
              - id: l1-f5
                type: true_false
                text: "A story that starts with \"Long, long ago\" is about something happening today."
                say: "Read it. Is it true?"
                answer: false
                hints:
                  - "Think about the word ago."
                  - "Ago means in the past."
                  - "No. It is about a long time ago."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which words end a story?"
                options: ["One day", "and they lived happily ever after.", "Long, long ago"]
                answer: "and they lived happily ever after."
                option_audio: false
                hints: ["Ever after means for the rest of time."]
              - id: l1-s2
                type: fill_in_blank
                text: "Finish the wolf's words."
                say: "The wolf says this at the door of every little pig's house. Finish it."
                frame: "Then I'll huff and I'll puff and I'll _ your house down!"
                options: ["blow", "kick", "pull"]
                answer: ["blow"]
                hints: ["Huff and puff are what you do with your breath."]
              - id: l1-s3
                type: true_false
                text: "In a story, a line that comes back again and again is called a refrain."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Think of Run, run, as fast as you can."]
              - id: l1-s4
                type: multiple_choice
                text: "Who's that trip-trapping over my bridge? Which tale is this from?"
                options: ["The Three Billy Goats Gruff", "Goldilocks and the Three Bears", "Jack and the Beanstalk"]
                answer: "The Three Billy Goats Gruff"
                option_audio: false
                hints: ["Who lives under a bridge?"]
              - id: l1-s5
                type: ordering
                text: "Put the story language in order: start, middle, end."
                say: "Put the cards in order, from the start of a story to the end."
                options: ["The end.", "Once upon a time", "One day"]
                slot_count: 3
                answer: ["Once upon a time", "One day", "The end."]
                option_audio: false
                hints: ["One day is when something starts to happen."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Finish the giant's words."
                say: "The giant in Jack and the Beanstalk says this. Finish it."
                frame: "Fee-fi-fo-_!"
                options: ["fum", "fan", "fish"]
                answer: ["fum"]
              - id: l1-n2
                type: sorting
                text: "Story openings or story endings? Sort them."
                say: "Read each card. Does it start a story or end a story? Put it in the right group."
                option_audio: false
                bins:
                  - { id: opening, show: { text: "opening" }, say: "Opening." }
                  - { id: ending, show: { text: "ending" }, say: "Ending." }
                options:
                  - { text: "There was once a king", bin: opening }
                  - { text: "From that day on, they were friends.", bin: ending }
                  - { text: "In a land far away", bin: opening }
                  - { text: "And that was the end of the wolf.", bin: ending }
              - id: l1-n3
                type: true_false
                text: "\"The end.\" Are these the first words of a story?"
                say: "Read the words. Are these the first words of a story?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Why does the troll ask the same question to each goat?"
                options: ["so we can join in and guess what comes next", "because the writer forgot", "because trolls cannot talk"]
                answer: "so we can join in and guess what comes next"
                option_audio: false
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the story opening."
                say: "Read the start of the story. Tap the words of the story opening."
                show: { drawn: letter-card, text: "Long ago a girl lived by the sea." }
                spans: ["Long", "ago"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which words start a story?"
            options: ["The end.", "Long, long ago", "happily ever after"]
            answer: "Long, long ago"
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "The Gingerbread Man shouts this. Finish the refrain."
            say: "The Gingerbread Man shouts this. Finish the line."
            frame: "You can't _ me, I'm the Gingerbread Man!"
            options: ["catch", "see", "eat"]
            answer: ["catch"]
          - id: l1-c3
            type: true_false
            text: "Happily ever after comes at the end of a story."
            say: "Read it. Is it true?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Which words end a story?"
            options: ["Once there was a bear", "They were never sad again.", "One cold winter's day"]
            answer: "They were never sad again."
            option_audio: false
          - id: l1-c5
            type: fill_in_blank
            text: "Finish the troll's question."
            say: "The troll asks each goat this. Finish it."
            frame: "Who's that _ over my bridge?"
            options: ["running", "trip-trapping", "jumping"]
            answer: ["trip-trapping"]
          - id: l1-c6
            type: true_false
            text: "\"One day\" is the way a story ends."
            say: "Read it. Is it true?"
            answer: false

  - n: 2
    title: { de: Sprache in Gedichten, en: Poem language }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which words end a story?"
            options: ["Once upon a time", "The end.", "One day"]
            answer: "The end."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Finish the troll's question."
            say: "The troll asks each goat this. Finish it."
            frame: "Who's that trip-trapping over my _?"
            options: ["bridge", "house", "boat"]
            answer: ["bridge"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Splash, splash in the rain,\nmy wellies go splash again.\nSplash, splash in the rain,\nI'm off to the park again."
            say: "Listen to this poem. Splash, splash in the rain comes back. A repeated line holds a poem together, and it is fun to say."
            show: { object: wellies }
          - text: "rain ... again"
            say: "Listen to the ends of the lines: rain, again. They rhyme. They end with the same sound. Poems often rhyme at the ends of lines."
          - text: "blue ... shoe     cat ... sit"
            say: "Rhyme is about sound, not letters. Blue and shoe rhyme, even though they are spelt differently. Cat and sit both end in t, but they do not rhyme."
          - text: "I went to the shop and I bought a bun.\nI went to the shop and I bought a plum."
            say: "Some poems repeat a pattern. Each verse starts the same way, and only a few words change. Once you know the pattern, you can join in."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the words that come back."
                say: "Read the poem. Some words come back at the start of each line. Tap them every time."
                show: { drawn: letter-card, text: "Tick-tock goes the clock. Tick-tock in the hall. Tick-tock on the wall." }
                spans: ["Tick-tock"]
                hints:
                  - "Look at the first word of each line."
                  - "The sound of the clock comes back."
                  - "Tick-tock, three times."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Finish the poem with a rhyme."
                say: "Read the poem. Which word rhymes and finishes it?"
                frame: "I saw a little cat, sitting on a _."
                options: ["mat", "chair", "bed"]
                answer: ["mat"]
                hints:
                  - "Listen to the end of the first line: cat."
                  - "Find the word that sounds like cat at the end."
                  - "Mat."
              - id: l2-f3
                type: multiple_choice
                text: "Which word rhymes with blue?"
                say: "Which word rhymes with blue? Read them yourself."
                options: ["shoe", "bell", "bus"]
                answer: "shoe"
                option_audio: false
                feedback:
                  bus: "Bus starts like blue, but the end sounds different. Shoe rhymes: bl-oo, sh-oo."
                hints:
                  - "Say blue out loud. Listen to the end."
                  - "Rhyme is about the end sound, not the letters."
                  - "Shoe."
              - id: l2-f4
                type: true_false
                text: "In a poem, a line that is repeated is a mistake."
                say: "Read it. Is it true?"
                answer: false
                hints:
                  - "Think of Splash, splash in the rain."
                  - "Poets repeat lines on purpose."
                  - "No. It is a pattern the poet chose."
              - id: l2-f5
                type: fill_in_blank
                text: "Keep the pattern going."
                say: "Read the poem. Each verse starts the same way. Fill the gaps to start the next verse."
                frame: "I went to the shop and I bought a bun.\nI went to the shop and I bought a plum.\nI _ to the _ and I bought a pear."
                options: ["went", "shop", "ran", "park"]
                answer: ["went", "shop"]
                hints:
                  - "Look at how the first two lines start."
                  - "Only the last word changes."
                  - "I went to the shop."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Finish the poem with a rhyme."
                say: "Read the poem. Which word rhymes and finishes it?"
                frame: "The sun is hot, the sky is blue.\nI'll play outside, and you can _."
                options: ["too", "go", "run"]
                answer: ["too"]
                hints: ["It must sound like blue."]
              - id: l2-s2
                type: true_false
                text: "Cat and sit rhyme because they both end with t."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Say them: c-at, s-it. Do the ends sound the same?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which word rhymes with bee?"
                say: "Which word rhymes with bee? Read them yourself."
                options: ["tree", "bed", "boat"]
                answer: "tree"
                option_audio: false
                hints: ["Say bee. Listen to the end sound."]
              - id: l2-s4
                type: highlight_in_text
                text: "Tap the words that come back."
                say: "Read the poem. Tap the words that come back."
                show: { drawn: letter-card, text: "Hop, hop, little frog. Hop, hop, on a log. Hop, hop, in the bog." }
                spans: ["Hop", "hop"]
                hints: ["The frog does the same thing at the start of every line."]
              - id: l2-s5
                type: multiple_choice
                text: "Why do poets repeat a line?"
                options: ["so the poem is fun to say and easy to join in", "because they ran out of words", "so the poem is longer"]
                answer: "so the poem is fun to say and easy to join in"
                option_audio: false
                hints: ["Think of joining in with Splash, splash in the rain."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Finish the poem with a rhyme."
                say: "Read the poem. Which word rhymes and finishes it?"
                frame: "My dog is big, my dog is brown.\nHe runs and runs all over _."
                options: ["town", "home", "park"]
                answer: ["town"]
              - id: l2-n2
                type: multiple_choice
                text: "Which word rhymes with night?"
                say: "Which word rhymes with night? Read them yourself."
                options: ["kite", "nest", "nine"]
                answer: "kite"
                option_audio: false
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the words that come back."
                say: "Read the poem. Tap the words that come back."
                show: { drawn: letter-card, text: "Snow, snow, white and cold. Snow, snow, new and old." }
                spans: ["Snow", "snow"]
              - id: l2-n4
                type: true_false
                text: "Blue and shoe rhyme, even though they end with different letters."
                say: "Read it. Is it true?"
                answer: true
              - id: l2-n5
                type: sorting
                text: "Story language or poem language? Sort them."
                say: "Read each card. Is it something you find in a story, or a rhyme from a poem? Put it in the right group."
                option_audio: false
                bins:
                  - { id: story, show: { text: "story opening or ending" }, say: "Story opening or ending." }
                  - { id: poem, show: { text: "rhyming words" }, say: "Rhyming words." }
                options:
                  - { text: "Once upon a time", bin: story }
                  - { text: "rain, again", bin: poem }
                  - { text: "happily ever after", bin: story }
                  - { text: "cat, mat", bin: poem }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: openings-endings
            type: multiple_choice
            text: "Which words start a story?"
            options: ["In a land far away", "The end.", "and they all went home."]
            answer: "In a land far away"
            option_audio: false
          - id: l2-c2
            part: refrains
            type: fill_in_blank
            text: "Finish the wolf's words."
            say: "The wolf says this to each little pig. Finish it."
            frame: "Little pig, little pig, let me come _!"
            options: ["in", "out", "home"]
            answer: ["in"]
          - id: l2-c3
            part: poem-repeats
            type: highlight_in_text
            text: "Tap the words that come back."
            say: "Read the poem. Tap the words that come back."
            show: { drawn: letter-card, text: "Buzz, buzz, busy bee. Buzz, buzz, round the tree." }
            spans: ["Buzz", "buzz"]
          - id: l2-c4
            part: rhyme
            type: multiple_choice
            text: "Which word rhymes with play?"
            say: "Which word rhymes with play? Read them yourself."
            options: ["pig", "day", "plum"]
            answer: "day"
            option_audio: false
          - id: l2-c5
            part: openings-endings
            type: true_false
            text: "\"The end.\" These words tell you a story is over."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c6
            part: openings-endings
            type: sorting
            text: "Does each card start or end a story? Sort them."
            say: "Read each card yourself. Does it start a story or end a story? Sort them."
            option_audio: false
            bins:
              - { id: opening, show: { text: "opening" }, say: "Opening." }
              - { id: ending, show: { text: "ending" }, say: "Ending." }
            options:
              - { text: "And so they all lived together in peace.", bin: ending }
              - { text: "One sunny morning", bin: opening }
              - { text: "From then on, the fox was never seen again.", bin: ending }
              - { text: "Long ago, in a castle by the sea", bin: opening }
          - id: l2-c7
            part: openings-endings
            type: highlight_in_text
            text: "Tap the words of the story ending."
            say: "Read the last line of the story. Tap the words of the story ending."
            show: { drawn: letter-card, text: "The king and queen lived happily ever after." }
            spans: ["happily", "ever", "after"]
          - id: l2-c8
            part: openings-endings
            type: true_false
            text: "\"Once upon a time\" tells you that a story is ending."
            say: "Read it. Is it true?"
            answer: false
          - id: l2-c9
            part: refrains
            type: fill_in_blank
            text: "Finish the bear's words."
            say: "Each bear in Goldilocks and the Three Bears says this. Finish it."
            frame: "Who's been eating my _?"
            options: ["porridge", "bed", "chair"]
            answer: ["porridge"]
          - id: l2-c10
            part: refrains
            type: multiple_choice
            text: "Fee-fi-fo-fum! Which tale is this from?"
            options: ["The Three Little Pigs", "Jack and the Beanstalk", "Goldilocks and the Three Bears"]
            answer: "Jack and the Beanstalk"
            option_audio: false
          - id: l2-c11
            part: refrains
            type: true_false
            text: "In The Three Billy Goats Gruff, the troll asks his question only once."
            say: "Read it. Is it true?"
            answer: false
          - id: l2-c12
            part: refrains
            type: multiple_choice
            text: "\"Who will help me plant this wheat?\" asked the Little Red Hen.\n\"Not I,\" said the cat.\n\"Not I,\" said the dog.\n\nWhich words come back?"
            say: "Read the bit of the story. Which words come back?"
            options: ["the Little Red Hen", "Not I", "plant this wheat"]
            answer: "Not I"
            option_audio: false
          - id: l2-c13
            part: poem-repeats
            type: highlight_in_text
            text: "Tap the words that come back."
            say: "Read the poem. Tap the words that come back, every time."
            show: { drawn: letter-card, text: "Pitter-patter, falls the rain. Pitter-patter, down the lane." }
            spans: ["Pitter-patter"]
          - id: l2-c14
            part: poem-repeats
            type: fill_in_blank
            text: "Keep the pattern going."
            say: "Read the poem. Each line starts the same way. Fill the gaps to start the next line."
            frame: "I can see a red bus.\nI can see a blue car.\nI _ _ a green van."
            options: ["can", "see", "saw", "like"]
            answer: ["can", "see"]
          - id: l2-c15
            part: poem-repeats
            type: multiple_choice
            text: "Rain, rain on the roof,\nsoft and slow.\nRain, rain on the roof,\nwhere did the sun go?\n\nWhich line comes back?"
            say: "Read the poem. Which line comes back?"
            options: ["soft and slow.", "Rain, rain on the roof,", "where did the sun go?"]
            answer: "Rain, rain on the roof,"
            option_audio: false
          - id: l2-c16
            part: poem-repeats
            type: true_false
            text: "In some poems, every verse starts in the same way."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c17
            part: rhyme
            type: multiple_choice
            text: "Which word rhymes with moon?"
            say: "Which word rhymes with moon? Read them yourself."
            options: ["moan", "man", "spoon"]
            answer: "spoon"
            option_audio: false
          - id: l2-c18
            part: rhyme
            type: fill_in_blank
            text: "Finish the poem with a rhyme."
            say: "Read the poem. Which word rhymes and finishes it?"
            frame: "The little fish swam in the sea,\nas happy as a fish can _."
            options: ["swim", "be", "go"]
            answer: ["be"]
          - id: l2-c19
