# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.contractions-possessive
skill: lit-en.spelling.contractions-possessive
curriculum: en-GB
language: en
title:
  de: Kurzformen und Apostroph für Besitz
  en: Contractions and the possessive apostrophe
summary: >
  The apostrophe has two jobs in Year 2. Lesson 1 spells contractions
  (can't, didn't, don't, it's, I'll), where two words are pushed together
  and the apostrophe sits where letters are missing; lesson 2 uses 's to
  show that something belongs to one person or animal (the girl's book,
  Ben's bike), tells it apart from a plain plural s, and ends with the
  skill check covering both jobs.
metadata:
  year: year-2
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.word-reading.contractions]
  also_practises: [lit-en.word-reading.contractions]
  vocabulary: { en: [apostrophe, contraction, short form, missing letter, belongs to, possession, plural] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: apostrophe-in-gap
      what: Puts the apostrophe between the two words instead of where the letters are missing (did'nt, do'nt)
      addressed: Lesson 1 Learn screen 2 shows the o of not dropping out; feedback in l1-f2; l1-s2, l1-n2, l2-c1
    - id: plural-apostrophe
      what: Adds an apostrophe to every plural s (three cat's, apple's for sale)
      addressed: Lesson 2 Learn screen 3 sets the cat's bowl against two cats; feedback in l2-f3; l2-s4, l2-n4, l2-c4
    - id: no-apostrophe
      what: Leaves the apostrophe out (cant, the girls book)
      addressed: l1-f4, l1-s5, l2-f1, l2-n5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Kurzformen schreiben", en: "Spelling contractions" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What does \"I'm\" mean?"
            say: "Read the word on the screen. What does it mean?"
            options: ["I am", "I will", "I have"]
            answer: "I am"
            difficulty: easy
          - id: l1-w2
            type: matching
            text: "Match each short form with its two words."
            say: "Read each short form. Match it with the two words it comes from."
            pairs:
              - { left: { text: "we'll" }, right: { text: "we will" } }
              - { left: { text: "I'll" }, right: { text: "I will" } }
              - { left: { text: "I'm" }, right: { text: "I am" } }
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "cannot → can't"
            say: "A contraction makes words shorter. Usually two words are pushed together. Some letters drop out, and the apostrophe goes where they were. Cannot becomes can't: an n and the o drop out."
            show: { drawn: letter-card, text: "can't" }
          - text: "did not → didn't"
            say: "Did not. The o in not drops out. The apostrophe takes its place, between the n and the t: didn't. It does not go between did and n."
          - text: "do not → don't\nit is → it's\nI will → I'll"
            say: "Do not is don't. It is is it's: the i of is drops out. I will is I'll: the w and the i drop out."
          - text: "has not → hasn't\ncould not → couldn't\nwas not → wasn't\nhave not → haven't"
            say: "Each time, ask: which letters are missing? Put the apostrophe there."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is the short form of \"do not\"?"
                say: "Read the words yourself. Which is the short form of do not?"
                options: ["don't", "dont", "do'nt"]
                answer: "don't"
                option_audio: false
                hints:
                  - "Which letter drops out of not?"
                  - "The o drops out. The apostrophe goes in its place."
                  - "don't"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which is the short form of \"did not\"?"
                say: "Read the words yourself. Which is the short form of did not?"
                options: ["didn't", "did'nt", "didnt"]
                answer: "didn't"
                option_audio: false
                feedback:
                  "did'nt": "The apostrophe goes where the o was, between the n and the t."
                hints:
                  - "Write did and not together, then take out the o."
                  - "didnt with the o gone: the gap is before the t."
                  - "didn't"
              - id: l1-f3
                type: matching
                text: "Match each short form with its two words."
                say: "Read each short form. Match it with the two words it comes from."
                pairs:
                  - { left: { text: "can't" }, right: { text: "cannot" } }
                  - { left: { text: "it's" }, right: { text: "it is" } }
                  - { left: { text: "hasn't" }, right: { text: "has not" } }
                hints:
                  - "Put the missing letters back."
                  - "can't has lost an n and the o; it's has lost the i of is."
                  - "can't is cannot, it's is it is, hasn't is has not."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the word that needs an apostrophe."
                say: "One word in this sentence is missing its apostrophe. Tap it."
                show: { drawn: letter-card, text: "I cant find my shoe." }
                spans: ["cant"]
                hints:
                  - "Which word is two words pushed together?"
                  - "Cannot, made shorter."
                  - "cant should be can't."
              - id: l1-f5
                type: fill_in_blank
                text: "Fill the gap: I will → _"
                say: "Which is the short form of I will?"
                frame: "I will → _"
                options: ["I'll", "Il'l", "Ill"]
                answer: ["I'll"]
                option_audio: false
                hints:
                  - "Which letters drop out of will?"
                  - "The w and the i drop out. ll stays."
                  - "I'll"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is the short form of \"it is\"?"
                say: "Read the words yourself. Which is the short form of it is?"
                options: ["it's", "its'", "it'is"]
                answer: "it's"
                option_audio: false
                hints: ["The i of is drops out."]
              - id: l1-s2
                type: multiple_choice
                text: "Which is spelt correctly?"
                say: "Read the words yourself. Which short form is spelt correctly?"
                options: ["couldn't", "could'nt", "couldnt"]
                answer: "couldn't"
                option_audio: false
                hints: ["The apostrophe goes where the o of not was."]
              - id: l1-s3
                type: true_false
                text: "Is it true? \"can't\" is short for \"cannot\"."
                answer: true
                hints: ["Put the n and the o back in."]
              - id: l1-s4
                type: fill_in_blank
                text: "Fill the gap: has not → _"
                say: "Which is the short form of has not?"
                frame: "has not → _"
                options: ["hasn't", "has'nt", "hasnt"]
                answer: ["hasn't"]
                option_audio: false
                hints: ["The o of not drops out."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the word that needs an apostrophe."
                say: "One word in this sentence is missing its apostrophe. Tap it."
                show: { drawn: letter-card, text: "We dont like rain." }
                spans: ["dont"]
                hints: ["Which word is two words pushed together?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Fill the gap: cannot → _"
                say: "Which is the short form of cannot?"
                frame: "cannot → _"
                options: ["can't", "ca'nt", "cant"]
                answer: ["can't"]
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which is spelt correctly?"
                say: "Read the words yourself. Which short form is spelt correctly?"
                options: ["didn't", "did'nt", "didnt'"]
                answer: "didn't"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Is it true? \"I'll\" is short for \"I am\"."
                answer: false
              - id: l1-n4
                type: matching
                text: "Match each short form with its two words."
                say: "Read each short form. Match it with the two words it comes from."
                pairs:
                  - { left: { text: "don't" }, right: { text: "do not" } }
                  - { left: { text: "couldn't" }, right: { text: "could not" } }
                  - { left: { text: "I'll" }, right: { text: "I will" } }
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the word that needs an apostrophe."
                say: "One word in this sentence is missing its apostrophe. Tap it."
                show: { drawn: letter-card, text: "Its time for bed." }
                spans: ["Its"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is the short form of \"has not\"?"
            say: "Read the words yourself. Which is the short form of has not?"
            options: ["hasn't", "has'nt", "hasnt"]
            answer: "hasn't"
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Fill the gap: it is → _"
            say: "Which is the short form of it is?"
            frame: "it is → _"
            options: ["it's", "its", "i'ts"]
            answer: ["it's"]
            option_audio: false
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the word that needs an apostrophe."
            say: "One word in this sentence is missing its apostrophe. Tap it."
            show: { drawn: letter-card, text: "Tom didnt eat his peas." }
            spans: ["didnt"]

  - n: 2
    title: { de: "Apostroph für Besitz", en: "The apostrophe for belonging" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is the short form of \"could not\"?"
            say: "Read the words yourself. Which is the short form of could not?"
            options: ["couldn't", "could'nt", "couldnt"]
            answer: "couldn't"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? \"don't\" is short for \"do not\"."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "the girl's book"
            say: "An apostrophe and s can also show that something belongs to someone. The book belongs to the girl, so we write the girl's book: girl, apostrophe, s."
            show: { object: book }
          - text: "Ben's bike\nthe dog's ball"
            say: "The bike belongs to Ben: Ben's bike. The ball belongs to the dog: the dog's ball. Who owns it? Write their name, then apostrophe s."
            show: { object: dog }
          - text: "the cat's bowl\ntwo cats"
            say: "Careful. When there is just more than one, like two cats, there is no apostrophe. Only use apostrophe s when something belongs to someone."
            show: { object: cat }
          - text: "Ask: does something belong to it?"
            say: "Ask yourself: does something belong to it? If yes, use apostrophe s. If it just means more than one, write s on its own."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Fill the gap: The hat belongs to Mum. It is _ hat."
                say: "The hat belongs to Mum. Which spelling fits the gap?"
                frame: "It is _ hat."
                options: ["Mum's", "Mums", "Mum"]
                answer: ["Mum's"]
                option_audio: false
                hints:
                  - "Who does the hat belong to?"
                  - "It belongs to Mum, so add apostrophe s."
                  - "Mum's"
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Read: the dog's bone. Who owns the bone?"
                say: "Read the words on the screen. Tap the one who owns the bone."
                options: [{ object: dog }, { object: cat }, { object: boy }]
                answer: dog
                hints:
                  - "Look at the word just before the apostrophe s."
                  - "The word is dog."
                  - "The dog owns the bone."
              - id: l2-f3
                type: fill_in_blank
                text: "Fill the gap: I can see three _ on the farm."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "I can see three _ on the farm."
                options: ["cows", "cow's"]
                answer: ["cows"]
                option_audio: false
                feedback:
                  "cow's": "Nothing belongs to the cows here. There are just more than one, so no apostrophe."
                hints:
                  - "Does something belong to the cows?"
                  - "No, there are just three of them."
                  - "cows"
              - id: l2-f4
                type: multiple_choice
                text: "Which is right for \"the teddy that belongs to the baby\"?"
                say: "Read them yourself. Which one is right?"
                options: ["the baby's teddy", "the babys teddy", "the baby teddy's"]
                answer: "the baby's teddy"
                option_audio: false
                hints:
                  - "Who owns the teddy?"
                  - "The apostrophe s goes on the owner, the baby."
                  - "the baby's teddy"
              - id: l2-f5
                type: highlight_in_text
                text: "Tap the word that needs an apostrophe."
                say: "One word is missing its apostrophe. Something belongs to it. Tap it."
                show: { drawn: letter-card, text: "This is Amirs coat." }
                spans: ["Amirs"]
                hints:
                  - "Who does the coat belong to?"
                  - "The coat belongs to Amir."
                  - "Amirs should be Amir's."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Fill the gap: The car belongs to Dad. It is _ car."
                say: "The car belongs to Dad. Which spelling fits the gap?"
                frame: "It is _ car."
                options: ["Dad's", "Dads", "Dad"]
                answer: ["Dad's"]
                option_audio: false
                hints: ["The car belongs to Dad."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Read: the girl's kite. Who owns the kite?"
                say: "Read the words on the screen. Tap the one who owns the kite."
                options: [{ object: girl }, { object: boy }, { object: teacher }]
                answer: girl
                hints: ["Look at the word before the apostrophe s."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the word that needs an apostrophe."
                say: "One word is missing its apostrophe. Something belongs to it. Tap it."
                show: { drawn: letter-card, text: "The snails shell is brown." }
                spans: ["snails"]
                hints: ["What does the shell belong to?"]
              - id: l2-s4
                type: sorting
                text: "Sort the words."
                say: "Read each one. Does something belong, or is it just more than one? Put it in the right group."
                option_audio: false
                bins:
                  - { id: belongs, show: { text: "belongs to" }, say: "Belongs to." }
                  - { id: more, show: { text: "more than one" }, say: "More than one." }
                options:
                  - { text: "the fox's tail", bin: belongs }
                  - { text: "two foxes", bin: more }
                  - { text: "Mia's pen", bin: belongs }
                  - { text: "four pens", bin: more }
                hints: ["Only the words with apostrophe s show belonging."]
              - id: l2-s5
                type: true_false
                text: "Is it true? \"the boys football\" shows that the football belongs to the boy."
                answer: false
                hints: ["Is there an apostrophe?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Fill the gap: The bed belongs to Gran. It is _ bed."
                say: "The bed belongs to Gran. Which spelling fits the gap?"
                frame: "It is _ bed."
                options: ["Gran's", "Grans", "Gran"]
                answer: ["Gran's"]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Which is right for \"the tail that belongs to the monkey\"?"
                say: "Read them yourself. Which one is right?"
                options: ["the monkey's tail", "the monkeys tail", "the monkey tail's"]
                answer: "the monkey's tail"
                option_audio: false
              - id: l2-n3
                type: image_multiple_choice
                text: "Read: the farmer's pig. Who owns the pig?"
                say: "Read the words on the screen. Tap the one who owns the pig."
                options: [{ object: farmer }, { object: doctor }, { object: cook }]
                answer: farmer
              - id: l2-n4
                type: fill_in_blank
                text: "Fill the gap: We bought six _ at the shop."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "We bought six _ at the shop."
                options: ["apples", "apple's"]
                answer: ["apples"]
                option_audio: false
              - id: l2-n5
                type: highlight_in_text
                text: "Tap the word that needs an apostrophe."
                say: "One word is missing its apostrophe. Something belongs to it. Tap it."
                show: { drawn: letter-card, text: "The teachers desk is tidy." }
                spans: ["teachers"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which is the short form of \"was not\"?"
            say: "Read the words yourself. Which is the short form of was not?"
            options: ["wasn't", "was'nt", "wasnt"]
            answer: "wasn't"
            option_audio: false
          - id: l2-c2
            type: highlight_in_text
            text: "Tap the word that needs an apostrophe."
            say: "One word in this sentence is missing its apostrophe. Tap it."
            show: { drawn: letter-card, text: "I havent got a pencil." }
            spans: ["havent"]
          - id: l2-c3
            type: fill_in_blank
            text: "Fill the gap: The bag belongs to Leo. It is _ bag."
            say: "The bag belongs to Leo. Which spelling fits the gap?"
            frame: "It is _ bag."
            options: ["Leo's", "Leos", "Leo"]
            answer: ["Leo's"]
            option_audio: false
          - id: l2-c4
            type: fill_in_blank
            text: "Fill the gap: There are two _ in the pond."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "There are two _ in the pond."
            options: ["ducks", "duck's"]
            answer: ["ducks"]
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Which is right for \"the web that belongs to the spider\"?"
            say: "Read them yourself. Which one is right?"
            options: ["the spider's web", "the spiders web", "the spider web's"]
            answer: "the spider's web"
            option_audio: false
