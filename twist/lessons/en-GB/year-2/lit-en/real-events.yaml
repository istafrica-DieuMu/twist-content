# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.real-events
skill: lit-en.composition.real-events
curriculum: en-GB
language: en
title:
  de: Über echte Erlebnisse schreiben
  en: Writing about real events
summary: >
  A recount tells what really happened, such as a class trip, in the
  order it happened. Lesson 1 reads a model recount of a trip to a farm
  and finds what makes it a recount: an opening that says who, where and
  when, events in time order, the past tense and I or we, and an ending
  that says how it felt. Lesson 2 builds a recount of a trip to the
  seaside: choosing an opening, putting events in order with time words,
  keeping to true facts and the past tense, and ends with the skill
  check. Free writing of the child's own recount is not marked yet.
metadata:
  year: year-2
  topic: { de: Texte schreiben, en: Writing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.composition.short-narrative]
  also_practises: [lit-en.grammar.tense-progressive, lit-en.comprehension.sequence]
  vocabulary: { en: [recount, trip, opening, ending, time order, first, next, then, after that, finally, past tense, fact] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: opening, what: { de: "eine Einleitung wählen, die sagt, wer, wo und wann", en: "choosing an opening that says who, where and when" } }
    - { id: time-order, what: { de: Ereignisse mit Zeitwörtern in die richtige Reihenfolge bringen, en: putting events in time order with time words } }
    - { id: past-tense, what: { de: Verben in der Vergangenheit verwenden, en: keeping the verbs in the past tense } }
    - { id: true-events, what: { de: "nur wahre Ereignisse aufnehmen, nichts Erfundenes", en: "keeping to what really happened, with nothing made up" } }
    - { id: ending, what: { de: "einen Schluss wählen, der sagt, wie es war", en: choosing an ending that says how it felt } }
  misconceptions:
    - id: made-up-detail
      what: Adds made-up events to a recount (a dragon at the farm), so it turns into a story
      addressed: Learn screen 4 of lesson 1; l1-f4, l1-s4 and l2-f4 sort what belongs in a recount, with feedback in l1-f4
    - id: random-order
      what: Writes events in the order they come to mind, not the order they happened
      addressed: Learn screen 2 of lesson 1; l1-f2, l2-f2 and l2-s2 order events with time words
    - id: present-tense
      what: Writes a recount in the present tense (we go to the farm and we see a cow)
      addressed: Learn screen 3 of lesson 1; l1-f3, l1-s3 and l2-n3 choose the past tense verb, with feedback in l1-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was ist ein Erlebnisbericht?", en: "What is a recount?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Put the sentences in order."
            options: ["We ate it all up.", "Mum made a cake.", "She put it in the oven."]
            slot_count: 3
            answer: ["Mum made a cake.", "She put it in the oven.", "We ate it all up."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which sentence would start a story best?"
            options: ["One morning, Jay woke up early.", "And that was that.", "He was happy at the end."]
            answer: "One morning, Jay woke up early."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Our trip to Oak Farm\n\nOn Tuesday, our class went to Oak Farm on a coach. First, we fed the lambs with bottles of milk. Next, the farmer showed us his pigs. After that, we had our packed lunch in the barn. Finally, we went back to school. It was the best trip ever!"
            say: "Listen to a recount. On Tuesday, our class went to Oak Farm on a coach. First, we fed the lambs with bottles of milk. Next, the farmer showed us his pigs. After that, we had our packed lunch in the barn. Finally, we went back to school. It was the best trip ever!"
            show: { object: farmer }
          - text: "First ... Next ... After that ... Finally ..."
            say: "A recount tells what really happened, in the order it happened. Time words help: first, next, after that, finally."
          - text: "we went   we fed   he showed   we had"
            say: "A recount is about something that has already happened, so the verbs are in the past tense. It uses I or we, because the writer was there."
          - text: "opening: who, where, when\nending: how it felt"
            say: "The opening says who went, where and when: On Tuesday, our class went to Oak Farm. The ending says how it felt: It was the best trip ever! Everything in a recount is true. No made-up dragons!"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Our trip to Oak Farm\n\nOn Tuesday, our class went to Oak Farm on a coach. First, we fed the lambs with bottles of milk. Next, the farmer showed us his pigs. After that, we had our packed lunch in the barn. Finally, we went back to school. It was the best trip ever!\n\nWhen did the class go?"
                options: ["on Tuesday", "on Saturday", "last summer"]
                answer: "on Tuesday"
                option_audio: false
                hints:
                  - "Look at the opening sentence."
                  - "The opening says who, where and when."
                  - "On Tuesday."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Our trip to Oak Farm\n\nOn Tuesday, our class went to Oak Farm on a coach. First, we fed the lambs with bottles of milk. Next, the farmer showed us his pigs. After that, we had our packed lunch in the barn. Finally, we went back to school. It was the best trip ever!\n\nPut the farm trip in order."
                options: ["We had lunch in the barn.", "We fed the lambs.", "We went back to school.", "The farmer showed us his pigs."]
                slot_count: 4
                answer: ["We fed the lambs.", "The farmer showed us his pigs.", "We had lunch in the barn.", "We went back to school."]
                option_audio: false
                hints:
                  - "First, next, after that, finally."
                  - "The lambs came first; going back to school came last."
                  - "Lambs, pigs, lunch, back to school."
              - id: l1-f3
                type: multiple_choice
                text: "Which sentence belongs in a recount of the trip?"
                options: ["We saw a tractor.", "We see a tractor.", "We will see a tractor."]
                answer: "We saw a tractor."
                option_audio: false
                feedback:
                  "We see a tractor.": "That is the present tense. A recount tells what already happened: we saw."
                hints:
                  - "A recount is about the past."
                  - "Which verb is in the past tense?"
                  - "We saw a tractor."
              - id: l1-f4
                type: sorting
                text: "Does it belong in the recount? Sort them."
                say: "Read each sentence about the farm trip. Is it something that could really have happened on the trip, or is it made up? Put it in the right group."
                option_audio: false
                bins:
                  - { id: yes, show: { text: "belongs in the recount" }, say: "Belongs in the recount." }
                  - { id: no, show: { text: "made up" }, say: "Made up." }
                options:
                  - { text: "We stroked a goat.", bin: yes }
                  - { text: "A pig flew over the barn.", bin: no }
                  - { text: "It rained after lunch.", bin: yes }
                  - { text: "A dragon cooked our lunch.", bin: no }
                hints:
                  - "Ask: could this really have happened?"
                  - "Pigs cannot fly, and there are no dragons on farms."
                  - "Recount: the goat, the rain. Made up: the flying pig, the dragon."
              - id: l1-f5
                type: multiple_choice
                text: "Which is the best ending for the farm recount?"
                options: ["I loved feeding the lambs, and I want to go again.", "Once upon a time there was a farm.", "Pigs are pink."]
                answer: "I loved feeding the lambs, and I want to go again."
                option_audio: false
                hints:
                  - "The ending says how it felt."
                  - "Which one tells you what the writer thought of the trip?"
                  - "I loved feeding the lambs."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Our trip to Oak Farm\n\nOn Tuesday, our class went to Oak Farm on a coach. First, we fed the lambs with bottles of milk. Next, the farmer showed us his pigs. After that, we had our packed lunch in the barn. Finally, we went back to school. It was the best trip ever!\n\nHow did the class get there?"
                options: ["on a coach", "on a train", "on bikes"]
                answer: "on a coach"
                option_audio: false
                hints: ["Look at the opening sentence."]
              - id: l1-s2
                type: multiple_choice
                text: "Which time word starts the last event?"
                options: ["Finally", "First", "Next"]
                answer: "Finally"
                option_audio: false
                hints: ["Which word means the last one?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which sentence belongs in a recount?"
                options: ["We visited the castle.", "We visit the castle.", "Visit the castle."]
                answer: "We visited the castle."
                option_audio: false
                hints: ["It already happened."]
              - id: l1-s4
                type: true_false
                text: "In a recount of a real trip, you can add a talking cow to make it exciting."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Everything in a recount is true."]
              - id: l1-s5
                type: multiple_choice
                text: "Who tells a recount of a class trip?"
                options: ["someone who was on the trip, using I or we", "a made-up character", "nobody"]
                answer: "someone who was on the trip, using I or we"
                option_audio: false
                hints: ["The writer was there."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Our trip to Oak Farm\n\nOn Tuesday, our class went to Oak Farm on a coach. First, we fed the lambs with bottles of milk. Next, the farmer showed us his pigs. After that, we had our packed lunch in the barn. Finally, we went back to school. It was the best trip ever!\n\nWhat did the class do first?"
                options: ["fed the lambs", "had lunch", "saw the pigs"]
                answer: "fed the lambs"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which is the best opening for a recount?"
                options: ["Last Friday, my family went to the library in town.", "The library has books.", "I like reading."]
                answer: "Last Friday, my family went to the library in town."
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Which sentence belongs in a recount?"
                options: ["We are swimming in the pool.", "We swam in the pool.", "We will swim in the pool."]
                answer: "We swam in the pool."
                option_audio: false
              - id: l1-n4
                type: sorting
                text: "Does it belong in the recount? Sort them."
                say: "Read each sentence about a trip to the library. Could it really have happened, or is it made up? Put it in the right group."
                option_audio: false
                bins:
                  - { id: yes, show: { text: "belongs in the recount" }, say: "Belongs in the recount." }
                  - { id: no, show: { text: "made up" }, say: "Made up." }
                options:
                  - { text: "I chose a book about space.", bin: yes }
                  - { text: "The books sang a song.", bin: no }
                  - { text: "We listened to a story.", bin: yes }
                  - { text: "A wizard turned me into a frog.", bin: no }
              - id: l1-n5
                type: true_false
                text: "A recount tells events in the order they happened."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which sentence belongs in a recount?"
            options: ["We went to the museum.", "We go to the museum.", "Go to the museum."]
            answer: "We went to the museum."
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "What does the opening of a recount tell you?"
            options: ["who, where and when", "how it ended", "what the writer's favourite colour is"]
            answer: "who, where and when"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "A recount is about something that really happened."
            say: "Read it. Is it true?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Why does a recount use time words like first and next?"
            options: ["to make it rhyme", "to show the order things happened", "to say who went"]
            answer: "to show the order things happened"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? A recount of a class trip is about a made-up child, so it uses he or she."
            say: "Read it. Is it true?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Our visit to the library\n\nOn Thursday, our class walked to the library. First, the librarian read us a story. Next, we chose a book each. Finally, we walked back to school. It was so much fun!\n\nWhat did the class do after the story?"
            say: "Read the recount and the question. What did the class do after the story?"
            options: ["walked back to school", "chose a book each", "had lunch"]
            answer: "chose a book each"
            option_audio: false

  - n: 2
    title: { de: Einen Bericht aufbauen, en: Building a recount }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which sentence belongs in a recount?"
            options: ["We played on the slide.", "We play on the slide."]
            answer: "We played on the slide."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which time word starts the first event?"
            options: ["First", "Finally", "After that"]
            answer: "First"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "Trip to the seaside: who? where? when?"
            say: "Let's build a recount together. Think first. Who went? My family and I. Where? The seaside. When? Last Sunday. That gives the opening: Last Sunday, my family and I went to the seaside."
            show: { object: shell }
          - text: "1 built a sandcastle\n2 paddled in the sea\n3 ate chips\n4 drove home"
            say: "Next, list the events in the order they happened. Say them out loud: built a sandcastle, paddled in the sea, ate chips, drove home."
          - text: "First, we built a sandcastle. Next, we paddled in the sea."
            say: "Now turn each event into a sentence, with a time word and a past tense verb. First, we built a sandcastle. Next, we paddled in the sea."
          - text: "It was a brilliant day, but I was very sleepy!"
            say: "Finish with how it felt. Then read your recount back to check it makes sense."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is the best opening for the seaside recount?"
                options: ["Last Sunday, my family and I went to the seaside.", "The seaside is nice.", "I like sand."]
                answer: "Last Sunday, my family and I went to the seaside."
                option_audio: false
                hints:
                  - "The opening says who, where and when."
                  - "Which one tells you all three?"
                  - "Last Sunday, my family and I went to the seaside."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Put the seaside trip in order."
                options: ["After that, we ate chips.", "First, we built a sandcastle.", "Finally, we drove home.", "Next, we paddled in the sea."]
                slot_count: 4
                answer: ["First, we built a sandcastle.", "Next, we paddled in the sea.", "After that, we ate chips.", "Finally, we drove home."]
                option_audio: false
                hints:
                  - "Look at the time words."
                  - "First, next, after that, finally."
                  - "Sandcastle, sea, chips, home."
              - id: l2-f3
                type: fill_in_blank
                text: "Add the time words."
                say: "Fill in the time words so the events are in order."
                frame: "_, we found a crab. _, we went home."
                options: ["First", "Finally", "Once upon a time"]
                answer: ["First", "Finally"]
                hints:
                  - "Which event came first?"
                  - "Going home was last."
                  - "First, then finally."
              - id: l2-f4
                type: multiple_choice
                text: "Which sentence does not belong in the seaside recount?"
                options: ["A mermaid gave me a golden shell.", "I found a shell on the beach.", "We ate chips by the sea."]
                answer: "A mermaid gave me a golden shell."
                option_audio: false
                feedback:
                  "I found a shell on the beach.": "That could really happen at the seaside. The mermaid is made up, so it does not belong."
                hints:
                  - "Which one could not really happen?"
                  - "A recount is true."
                  - "The mermaid."
              - id: l2-f5
                type: fill_in_blank
                text: "Put the verb in the past tense."
                say: "Choose the verb that keeps the recount in the past."
                frame: "Next, we _ in the sea."
                options: ["paddled", "paddle", "will paddle"]
                answer: ["paddled"]
                option_audio: false
                hints:
                  - "The trip has already happened."
                  - "Add -ed to paddle."
                  - "Paddled."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which is the best ending for the seaside recount?"
                options: ["It was a brilliant day, but I was very sleepy!", "Then we built a sandcastle.", "Chips are tasty."]
                answer: "It was a brilliant day, but I was very sleepy!"
                option_audio: false
                hints: ["The ending says how it felt."]
              - id: l2-s2
                type: ordering
                text: "Put the trip to the park in order."
                options: ["Then we fed the ducks.", "On Saturday, Gran took me to the park.", "Finally, we walked home for tea."]
                slot_count: 3
                answer: ["On Saturday, Gran took me to the park.", "Then we fed the ducks.", "Finally, we walked home for tea."]
                option_audio: false
                hints: ["The opening says when."]
              - id: l2-s3
                type: fill_in_blank
                text: "Put the verb in the past tense."
                say: "Choose the verb that keeps the recount in the past."
                frame: "Then we _ the ducks some bread."
                options: ["gave", "give", "gived"]
                answer: ["gave"]
                option_audio: false
                hints: ["Give has its own past tense."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence does not belong in a recount of a trip to the park?"
                options: ["The swings were busy.", "A giant ate the slide.", "We played on the climbing frame."]
                answer: "A giant ate the slide."
                option_audio: false
                hints: ["Which one is made up?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which sentence uses a time word?"
                options: ["After that, we had an ice cream.", "We had an ice cream.", "Ice cream is cold."]
                answer: "After that, we had an ice cream."
                option_audio: false
                hints: ["Look for first, next, then, after that or finally."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is the best opening for a recount?"
                options: ["Yesterday, Year 2 went to the fire station.", "Fire is hot.", "I want to be a firefighter."]
                answer: "Yesterday, Year 2 went to the fire station."
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Put the fire station trip in order."
                options: ["After that, we sprayed the hose.", "First, a firefighter showed us the fire engine.", "Finally, we waved goodbye.", "Next, we tried on helmets."]
                slot_count: 4
                answer: ["First, a firefighter showed us the fire engine.", "Next, we tried on helmets.", "After that, we sprayed the hose.", "Finally, we waved goodbye."]
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Put the verb in the past tense."
                say: "Choose the verb that keeps the recount in the past."
                frame: "Next, we _ on helmets."
                options: ["tried", "try", "tryed"]
                answer: ["tried"]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence does not belong in the fire station recount?"
                options: ["The fire engine had a long ladder.", "The fire engine flew to the moon.", "We heard the siren."]
                answer: "The fire engine flew to the moon."
                option_audio: false
              - id: l2-n5
                type: multiple_choice
                text: "Which is the best ending for the fire station recount?"
                options: ["I felt proud wearing a real helmet, and I want to go back.", "Fire engines are red.", "First, we got on the coach."]
                answer: "I felt proud wearing a real helmet, and I want to go back."
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: opening
            type: multiple_choice
            text: "Which is the best opening for a recount?"
            options: ["On Monday, our class visited the aquarium in the city.", "Fish can swim.", "The aquarium."]
            answer: "On Monday, our class visited the aquarium in the city."
            option_audio: false
          - id: l2-c2
            part: time-order
            type: ordering
            text: "Put the aquarium trip in order."
            options: ["Next, we saw a shark.", "Finally, we bought a pencil in the shop.", "First, we looked at tiny fish."]
            slot_count: 3
            answer: ["First, we looked at tiny fish.", "Next, we saw a shark.", "Finally, we bought a pencil in the shop."]
            option_audio: false
          - id: l2-c3
            part: past-tense
            type: fill_in_blank
            text: "Put the verb in the past tense."
            say: "Choose the verb that keeps the recount in the past."
            frame: "Then we _ an octopus."
            options: ["watched", "watch", "will watch"]
            answer: ["watched"]
            option_audio: false
          - id: l2-c4
            part: true-events
            type: multiple_choice
            text: "Which sentence does not belong in the aquarium recount?"
            options: ["A shark swam past the glass.", "The shark asked me my name.", "We saw jellyfish."]
            answer: "The shark asked me my name."
            option_audio: false
          - id: l2-c5
            part: ending
            type: multiple_choice
            text: "Which is the best ending for the aquarium recount?"
            options: ["The shark was my favourite, and I drew it when I got home.", "Next, we saw the crabs.", "Sharks have teeth."]
            answer: "The shark was my favourite, and I drew it when I got home."
            option_audio: false
          - id: l2-c6
            part: opening
            type: true_false
            text: "Is this a good opening for a recount? \"Last Wednesday, Year 2 went to the castle on a train.\""
            say: "Read it yourself. Is this a good opening for a recount?"
            answer: true
          - id: l2-c7
            part: opening
            type: highlight_in_text
            text: "Tap the words in the opening that tell you when."
            say: "Read the opening yourself. Tap the words that tell you when it happened."
            show: { drawn: letter-card, text: "Last Friday, my class went to the zoo." }
            spans: ["Last", "Friday"]
          - id: l2-c8
            part: opening
            type: multiple_choice
            text: "Which opening tells you who, where and when?"
            options: ["Grandpa and I went fishing.", "In the summer, Grandpa and I went fishing at the lake.", "Fishing at the lake is fun."]
            answer: "In the summer, Grandpa and I went fishing at the lake."
            option_audio: false
          - id: l2-c9
            part: time-order
            type: ordering
            text: "Put the trip to the bakery in order."
            options: ["After that, we tasted warm bread.", "Finally, we said thank you and went home.", "First, we put on aprons.", "Next, the baker showed us the big oven."]
            slot_count: 4
            answer: ["First, we put on aprons.", "Next, the baker showed us the big oven.", "After that, we tasted warm bread.", "Finally, we said thank you and went home."]
            option_audio: false
          - id: l2-c10
            part: time-order
            type: fill_in_blank
            text: "Add the time words."
            say: "Fill in the time words so the events are in order."
            frame: "We packed our bags. _, we walked to the bus stop. _, we got on the bus."
            options: ["Finally", "Next", "Once upon a time"]
            answer: ["Next", "Finally"]
          - id: l2-c11
            part: time-order
            type: true_false
            text: "Is this recount in time order?\n\"Finally, we went home. First, we had a picnic. Next, we played games.\""
            say: "Read it yourself. Is this recount in time order?"
            answer: false
          - id: l2-c12
            part: past-tense
            type: highlight_in_text
            text: "Tap the verb that is not in the past tense."
            say: "Read the recount sentence yourself. One verb is not in the past tense. Tap it."
            show: { drawn: letter-card, text: "We went to the pool and we swim for an hour." }
            spans: ["swim"]
          - id: l2-c13
            part: past-tense
            type: fill_in_blank
            text: "Put the verb in the past tense."
            say: "Choose the verb that keeps the recount in the past."
            frame: "After that, we _ our lunch on the grass."
            options: ["eat", "eated", "ate"]
            answer: ["ate"]
            option_audio: false
          - id: l2-c14
            part: past-tense
            type: true_false
            text: "Is this sentence right for a recount of a trip? \"Next, we see the lions.\""
            say: "Read it yourself. Is this sentence right for a recount?"
            answer: false
          - id: l2-c15
