# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.plan-key-words
skill: lit-en.composition.plan-key-words
curriculum: en-GB
language: en
title:
  de: Planen mit Stichwörtern
  en: Planning with key words
summary: >
  Before writing, children plan by jotting down ideas as key words, not
  whole sentences. Lesson 1 picks the key words that carry an idea (fox,
  den, hungry) and sorts ideas into a beginning, middle and end; lesson 2
  adds new vocabulary from a topic (burrow, nocturnal, hibernate) to a
  plan, matches notes to what they will become in the writing, and ends
  with the skill check. The skill check marks what a screen can mark:
  choosing key words, ordering a plan, new topic words and turning notes
  into sentences. Writing the plan itself is left to Practise and waits
  for a free-writing task type.
metadata:
  year: year-2
  topic: { de: Texte schreiben, en: Writing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.composition.say-then-write]
  also_practises: []
  vocabulary: { en: [plan, idea, key word, note, beginning, middle, end, new word, topic] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: key-words, what: { de: "Stichwörter wählen, die die Idee tragen", en: "choosing the key words that carry an idea" } }
    - { id: plan-order, what: { de: "einen Plan ordnen: Anfang, Mitte, Schluss", en: "putting a plan in order: beginning, middle and end" } }
    - { id: new-words, what: { de: "neue Wörter aus einem Thema in den Plan nehmen", en: "putting new words from a topic into a plan" } }
    - { id: plan-to-writing, what: { de: "Notizen, die zum Thema passen, und Sätze daraus", en: "notes that fit the topic, and the sentences they become" } }
  misconceptions:
    - id: plan-full-sentences
      what: Writes the whole story in the plan instead of short notes
      addressed: Lesson 1 Learn screen 2 sets a sentence against its key words; feedback in l1-f2; l1-s3, l1-n3, l2-c2
    - id: small-words-as-key
      what: Picks small words (the, and, was) as key words
      addressed: Lesson 1 Learn screen 3; l1-f1, l1-s1, l1-n1, l2-c1
    - id: new-word-not-used
      what: Learns a new topic word but leaves it out of the plan, or uses it with the wrong meaning
      addressed: Lesson 2 Learn screens 2 and 3; feedback in l2-f2; l2-s2, l2-n2, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Stichwörter finden, en: Finding key words }
    goal:
      de: "Plane eine Geschichte mit ein paar Stichwörtern wie dragon, cave, scared für den Anfang, die Mitte und den Schluss."
      en: "Plan a story with a few key words, like dragon, cave, scared, for the beginning, the middle and the end."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What should you do before you write a sentence?"
            say: "What should you do before you write a sentence?"
            options: ["Say it out loud first.", "Write it as fast as you can.", "Draw a line under it."]
            answer: "Say it out loud first."
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Build the sentence."
            say: "Put the words in order to make a sentence."
            options: ["ran", "The", "home.", "dog"]
            slot_count: 4
            answer: ["The", "dog", "ran", "home."]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The hungry fox crept out of his den."
            say: "Here is a sentence for a story about a fox. What do you think: should your plan have every word of it, or just a few? Have a guess."
            show: { object: fox }
          - text: "The hungry fox crept out of his den.\nPlan: hungry fox, den, crept out"
            say: "Just a few! A plan is not the whole story. It is a few key words that remind you of your idea. Later, you turn the key words back into sentences."
            show: { object: fox }
          - text: "Key words: fox, den, hungry\nNot key words: the, of, his"
            say: "Key words carry the idea: who, where, what happens, how it feels. Small words like the, of and and do not need to go in a plan."
          - text: "Beginning: fox hungry, den\nMiddle: finds bins, lid stuck\nEnd: gets food, happy"
            say: "A story plan has three boxes: the beginning, the middle and the end. Put a few key words in each one."
          - text: "Who? Where? What happens? How does it end?"
            say: "To find your ideas, ask: who is in it, where is it, what happens, how does it end?"
          - text: "Did you know? Roald Dahl's Ideas Book"
            say: "Did you know? Roald Dahl, who wrote Charlie and the Chocolate Factory, jotted his story ideas as short notes in a notebook. He called it his Ideas Book. Some of those little notes grew into whole books!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the key words for who, what it is like and where."
                say: "Here is a sentence for a story. Tap three key words for your plan: who it is, what it is like, and where it is."
                show: { drawn: letter-card, text: "The little duck swam across the pond" }
                spans: ["little", "duck", "pond"]
                hints:
                  - "Key words tell you who, where and what it is like."
                  - "Who is it? Where is it? What is it like?"
                  - "little, duck and pond."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which is a good plan note?"
                say: "Read them yourself. Which one is a good note for a plan?"
                options: ["dragon, cave, scared", "Once upon a time there was a dragon who lived in a cave and he was scared.", "the a and"]
                answer: "dragon, cave, scared"
                option_audio: false
                feedback:
                  "Once upon a time there was a dragon who lived in a cave and he was scared.": "That is the whole sentence. A plan only needs the key words."
                hints:
                  - "A plan note is short."
                  - "It has only the words that carry the idea."
                  - "dragon, cave, scared"
              - id: l1-f3
                type: sorting
                text: "Words from a story about a bear: key word or not?"
                say: "Read each word from a story about a bear. Is it a key word for the plan?"
                option_audio: false
                bins:
                  - { id: key, show: { text: "key word" }, say: "Key word." }
                  - { id: not, show: { text: "not needed" }, say: "Not needed." }
                options:
                  - { text: "bear", bin: key }
                  - { text: "honey", bin: key }
                  - { text: "the", bin: not }
                  - { text: "and", bin: not }
                hints:
                  - "Does the word carry part of the idea?"
                  - "Small joining words do not."
                  - "bear and honey are key words; the and and are not needed."
              - id: l1-f4
                type: ordering
                text: "Put the plan in order: beginning, middle, end."
                say: "Here are plan notes for a story. Put them in order: beginning, middle, end."
                options: ["lost in the woods", "home safe", "Ella walks dog"]
                slot_count: 3
                answer: ["Ella walks dog", "lost in the woods", "home safe"]
                option_audio: false
                hints:
                  - "What happens first?"
                  - "The story starts with a walk. The problem comes next."
                  - "Ella walks dog, lost in the woods, home safe."
              - id: l1-f5
                type: multiple_choice
                text: "Plan: \"Sam, beach, sandcastle\"\nWhat does the plan tell you?"
                say: "Read the plan notes. What will the story be about?"
                options: ["Sam builds a sandcastle at the beach.", "Sam goes to school.", "A sandcastle goes shopping."]
                answer: "Sam builds a sandcastle at the beach."
                option_audio: false
                feedback:
                  "A sandcastle goes shopping.": "A sandcastle with a shopping bag? It has no legs! Use every key word: Sam, beach, sandcastle."
                hints:
                  - "Use every key word."
                  - "Who? Sam. Where? The beach. What? A sandcastle."
                  - "Sam builds a sandcastle at the beach."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the key words for who, what it is like and where."
                say: "Here is a sentence for a story. Tap three key words for your plan: who it is, what it is like, and where it is."
                show: { drawn: letter-card, text: "A brave knight rode to the castle" }
                spans: ["brave", "knight", "castle"]
                hints: ["Who is it, what is he like, and where does he go?"]
              - id: l1-s2
                type: ordering
                text: "Put the plan in order: beginning, middle, end."
                say: "Put the plan notes in order: beginning, middle, end."
                options: ["eats it all", "Mum bakes cake", "cat jumps on table"]
                slot_count: 3
                answer: ["Mum bakes cake", "cat jumps on table", "eats it all"]
                option_audio: false
                hints: ["The cake must be baked before anything else."]
              - id: l1-s3
                type: true_false
                text: "Is it true? A plan should have every word of your story in it."
                answer: false
                hints: ["Is a plan long or short?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which note belongs in the \"Where?\" box?"
                say: "Read them yourself. Which note tells you where the story happens?"
                options: ["in the jungle", "a tiger", "very happy"]
                answer: "in the jungle"
                option_audio: false
                hints: ["Where tells you a place."]
              - id: l1-s5
                type: matching
                text: "Match each question with a plan note."
                say: "Match each planning question with the note that answers it."
                pairs:
                  - { left: { text: "Who?" }, right: { text: "a pirate" } }
                  - { left: { text: "Where?" }, right: { text: "on an island" } }
                  - { left: { text: "What happens?" }, right: { text: "finds a map" } }
                hints: ["Who is a person, where is a place, what happens is an action."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the key words for who, what it is like and where."
                say: "Here is a sentence for a story. Tap three key words for your plan: who it is, what it is like, and where it is."
                show: { drawn: letter-card, text: "The sleepy owl sat in the tree" }
                spans: ["sleepy", "owl", "tree"]
              - id: l1-n2
                type: ordering
                text: "Put the plan in order: beginning, middle, end."
                say: "Put the plan notes in order: beginning, middle, end."
                options: ["finds it under bed", "Jay loses teddy", "looks everywhere"]
                slot_count: 3
                answer: ["Jay loses teddy", "looks everywhere", "finds it under bed"]
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Which is a good plan note?"
                say: "Read them yourself. Which one is a good note for a plan?"
                options: ["robot, broken, fix", "There was a robot and it was broken so they had to fix it.", "and then the"]
                answer: "robot, broken, fix"
                option_audio: false
              - id: l1-n4
                type: matching
                text: "Match each question with a plan note."
                say: "Match each planning question with the note that answers it."
                pairs:
                  - { left: { text: "Who?" }, right: { text: "two mice" } }
                  - { left: { text: "Where?" }, right: { text: "in a barn" } }
                  - { left: { text: "How does it end?" }, right: { text: "best friends" } }
              - id: l1-n5
                type: true_false
                text: "Is it true? \"princess, tower, escape\" is a good plan note."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the key words for who, what it is like and where."
            say: "Here is a sentence for a story. Tap three key words for your plan: who it is, what it is like, and where it is."
            show: { drawn: letter-card, text: "The funny clown fell in the pool" }
            spans: ["funny", "clown", "pool"]
          - id: l1-c2
            type: ordering
            text: "Put the plan in order: beginning, middle, end."
            say: "Put the plan notes in order: beginning, middle, end."
            options: ["flies to the moon", "lands back home", "Zak builds rocket"]
            slot_count: 3
            answer: ["Zak builds rocket", "flies to the moon", "lands back home"]
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Which note belongs in the \"Who?\" box?"
            say: "Read them yourself. Which note tells you who is in the story?"
            options: ["a giant", "up a hill", "at night"]
            answer: "a giant"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Which is a good plan note?"
            say: "Read them yourself. Which one is a good note for a plan?"
            options: ["Jack climbed up the beanstalk and he found a giant with lots of gold.", "up the and", "Jack, beanstalk, giant's gold"]
            answer: "Jack, beanstalk, giant's gold"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? Who? Where? What happens? These questions help you find ideas for a plan."
            say: "Read it. Is it true?"
            answer: true
          - id: l1-c6
            type: sorting
            text: "Words from a story about space: which ones go in the plan?"
            say: "Read each word yourself. It is from a story about space. Is it a key word for the plan, or not needed?"
            option_audio: false
            bins:
              - { id: key, show: { text: "key word" }, say: "Key word." }
              - { id: not, show: { text: "not needed" }, say: "Not needed." }
            options:
              - { text: "rocket", bin: key }
              - { text: "to", bin: not }
              - { text: "moon", bin: key }
              - { text: "a", bin: not }

  - n: 2
    title: { de: Neue Wörter in den Plan, en: New words in the plan }
    goal:
      de: "Schreib neue Wörter vom Thema in deinen Plan, wie nocturnal für Tiere, die nachts wach sind, und mach aus Notizen Sätze."
      en: "Put new topic words in your plan, like nocturnal for animals awake at night, and turn your notes into sentences."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the key words for who, what it is like and where."
            say: "Here is a sentence for a story. Tap three key words for your plan: who it is, what it is like, and where it is."
            show: { drawn: letter-card, text: "A tiny ant climbed the hill" }
            spans: ["tiny", "ant", "hill"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which note belongs in the \"Where?\" box?"
            say: "Read them yourself. Which note tells you where the story happens?"
            options: ["under the sea", "a crab", "very cross"]
            answer: "under the sea"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "nocturnal"
            say: "Here is a new word from a topic about hedgehogs: nocturnal. What do you think it means: awake at night, or asleep all winter? Have a guess."
            show: { object: hedgehog }
          - text: "hedgehog: hibernate, nocturnal, prickles"
            say: "Nocturnal means awake at night. When we learn about a topic, we meet new words. Put them in your plan so you remember to use them. Hedgehogs hibernate: they sleep all winter. They are nocturnal: they come out at night."
            show: { object: hedgehog }
          - text: "nocturnal = awake at night"
            say: "Only use a new word when you know what it means. Write it in your plan with a little reminder if it helps: nocturnal, awake at night."
          - text: "fox: predator, prey, habitat"
            say: "A topic about foxes gives us more new words. A fox is a predator: it hunts other animals. The animals it hunts are its prey. Its habitat is where it lives, such as woods or towns."
            show: { object: fox }
          - text: "Plan: hedgehog, nocturnal, eats slugs, hibernates\nWriting: Hedgehogs are nocturnal. They come out at night to eat slugs."
            say: "Then each note becomes a sentence. The key words and the new words go into the writing."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Match each new word with what it means."
                say: "Read each new word. Match it with what it means."
                pairs:
                  - { left: { text: "nocturnal" }, right: { text: "awake at night" } }
                  - { left: { text: "hibernate" }, right: { text: "sleep all winter" } }
                  - { left: { text: "burrow" }, right: { text: "a hole where an animal lives" } }
                hints:
                  - "Think of a hedgehog in winter, an owl at night, a rabbit underground."
                  - "Hibernate is about winter. Nocturnal is about night."
                  - "nocturnal: awake at night; hibernate: sleep all winter; burrow: a hole where an animal lives."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "A fact page about owls. Owls are awake at night. Which new word fits?"
                say: "You are planning a fact page about owls. Owls are awake at night. Which new word should go in the plan?"
                options: ["nocturnal", "hibernate", "burrow"]
                answer: "nocturnal"
                option_audio: false
                feedback:
                  "hibernate": "Hibernate means sleep all winter. Owls are awake at night, so the word is nocturnal."
                hints:
                  - "What do owls do at night?"
                  - "The word for awake at night."
                  - "nocturnal"
              - id: l2-f3
                type: sorting
                text: "Which notes go in a plan about rabbits?"
                say: "You are planning a fact page about rabbits. Which notes belong in it?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "in the plan" }, say: "In the plan." }
                  - { id: no, show: { text: "not about rabbits" }, say: "Not about rabbits." }
                options:
                  - { text: "live in a burrow", bin: yes }
                  - { text: "eat grass", bin: yes }
                  - { text: "my bike is red", bin: no }
                  - { text: "fly south", bin: no }
                hints:
                  - "Does the note tell you something about rabbits?"
                  - "A bike and flying south are not about rabbits."
                  - "burrow and grass go in; bike and fly south do not."
              - id: l2-f4
                type: multiple_choice
                text: "Plan note: \"bees, pollen, flowers\"\nWhich sentence uses the plan?"
                say: "Read the plan note. Which sentence uses all its key words?"
                options: ["Bees carry pollen from flower to flower.", "Bees are yellow.", "I like flowers."]
                answer: "Bees carry pollen from flower to flower."
                option_audio: false
                hints:
                  - "Look for all three key words."
                  - "Bees, pollen and flowers must all be there."
                  - "Bees carry pollen from flower to flower."
              - id: l2-f5
                type: true_false
                text: "Is it true? It is fine to put a new word in your plan when you do not know what it means."
                answer: false
                hints:
                  - "Will the word help you if you do not know it?"
                  - "You might use it in the wrong way."
                  - "No. Learn what it means first."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Match each new word with what it means."
                say: "Read each new word. Match it with what it means."
                pairs:
                  - { left: { text: "habitat" }, right: { text: "where an animal lives" } }
                  - { left: { text: "predator" }, right: { text: "an animal that hunts others" } }
                  - { left: { text: "prey" }, right: { text: "an animal that is hunted" } }
                hints: ["A fox hunts. A mouse is hunted."]
              - id: l2-s2
                type: multiple_choice
                text: "A plan about bears. In winter, bears sleep for a long time. Which new word fits?"
                say: "You are planning a fact page about bears. In winter, bears sleep for a long time. Which new word should go in the plan?"
                options: ["hibernate", "nocturnal", "predator"]
                answer: "hibernate"
                option_audio: false
                hints: ["Which word means sleep all winter?"]
              - id: l2-s3
                type: multiple_choice
                text: "Plan note: \"frog, pond, spawn\"\nWhich sentence uses the plan?"
                say: "Read the plan note. Which sentence uses all its key words?"
                options: ["Frogs lay spawn in a pond.", "Frogs are green.", "The pond is cold."]
                answer: "Frogs lay spawn in a pond."
                option_audio: false
                hints: ["All three key words must be there."]
              - id: l2-s4
                type: sorting
                text: "Which notes go in a plan about the seaside?"
                say: "You are planning a recount of a day at the seaside. Which notes belong in it?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "in the plan" }, say: "In the plan." }
                  - { id: no, show: { text: "not about the day" }, say: "Not about the day." }
                options:
                  - { text: "built sandcastle", bin: yes }
                  - { text: "paddled, cold waves", bin: yes }
                  - { text: "school dinner", bin: no }
                  - { text: "snowman", bin: no }
                hints: ["Did it happen at the seaside?"]
              - id: l2-s5
                type: highlight_in_text
                text: "A plan note for a topic about spiders. Tap the new topic word."
                say: "Read the plan note. Tap the new word you learnt in the topic about spiders."
                show: { drawn: letter-card, text: "spider spins web traps prey" }
                spans: ["prey"]
                hints: ["Which word means an animal that is hunted?"]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Match each new word with what it means."
                say: "Read each new word. Match it with what it means."
                pairs:
                  - { left: { text: "prey" }, right: { text: "an animal that is hunted" } }
                  - { left: { text: "burrow" }, right: { text: "a hole where an animal lives" } }
                  - { left: { text: "hibernate" }, right: { text: "sleep all winter" } }
              - id: l2-n2
                type: multiple_choice
                text: "A plan about foxes. Foxes hunt other animals. Which new word fits?"
                say: "You are planning a fact page about foxes. Foxes hunt other animals. Which new word should go in the plan?"
                options: ["predator", "prey", "hibernate"]
                answer: "predator"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Plan note: \"caterpillar, leaf, butterfly\"\nWhich sentence uses the plan?"
                say: "Read the plan note. Which sentence uses all its key words?"
                options: ["The caterpillar ate a leaf and became a butterfly.", "The butterfly is pretty.", "A leaf fell off the tree."]
                answer: "The caterpillar ate a leaf and became a butterfly."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? A plan can have new words from your topic in it."
                answer: true
              - id: l2-n5
                type: sorting
                text: "Which notes go in a plan about snails?"
                say: "You are planning a fact page about snails. Which notes belong in it?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "in the plan" }, say: "In the plan." }
                  - { id: no, show: { text: "not about snails" }, say: "Not about snails." }
                options:
                  - { text: "shell on back", bin: yes }
                  - { text: "slow, slimy trail", bin: yes }
                  - { text: "big sharp teeth", bin: no }
                  - { text: "I like pizza", bin: no }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: key-words
            type: highlight_in_text
            text: "Tap the key words for who, what it is like and where."
            say: "Here is a sentence for a story. Tap three key words for your plan: who it is, what it is like, and where it is."
            show: { drawn: letter-card, text: "The grumpy troll lived under the bridge" }
            spans: ["grumpy", "troll", "bridge"]
          - id: l2-c2
            part: key-words
            type: multiple_choice
            text: "Which is a good plan note?"
            say: "Read them yourself. Which one is a good note for a plan?"
            options: ["witch, broom, lost hat", "The witch flew on her broom and then she lost her hat in the wind.", "on the and"]
            answer: "witch, broom, lost hat"
            option_audio: false
          - id: l2-c3
            part: plan-order
            type: ordering
            text: "Put the plan in order: beginning, middle, end."
            say: "Put the plan notes in order: beginning, middle, end."
            options: ["tooth falls out", "Mia's wobbly tooth", "tooth fairy comes"]
            slot_count: 3
            answer: ["Mia's wobbly tooth", "tooth falls out", "tooth fairy comes"]
            option_audio: false
          - id: l2-c4
            part: new-words
            type: multiple_choice
            text: "A plan about bats. Bats sleep in the day and fly at night. Which new word fits?"
            say: "You are planning a fact page about bats. Bats sleep in the day and fly at night. Which new word should go in the plan?"
            options: ["nocturnal", "hibernate", "prey"]
            answer: "nocturnal"
            option_audio: false
          - id: l2-c5
