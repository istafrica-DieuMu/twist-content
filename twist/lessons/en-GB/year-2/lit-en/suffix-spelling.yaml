# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.suffix-spelling
skill: lit-en.spelling.suffixes-y2
curriculum: en-GB
language: en
title:
  de: Wörter mit Nachsilben schreiben
  en: Spelling words with suffixes
summary: >
  Children spell longer words by writing the root word, then the suffix.
  Lesson 1 adds -ment, -ness, -ful, -less and -ly to root words that do
  not change (enjoyment, sadness, hopeful, hopeless, sadly), with the
  rule that -ful has only one l; lesson 2 takes root words that end in a
  consonant and y, where the y changes to i (happiness, happily,
  plentiful, merriment), and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.spelling.un-ing-ed-er-est]
  also_practises: [lit-en.word-reading.suffixes-y2]
  vocabulary: { en: [suffix, root word, consonant, vowel, -ment, -ness, -ful, -less, -ly] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: ment-ness, what: { de: "Wörter mit -ment und -ness schreiben", en: "spelling words with -ment and -ness" } }
    - { id: ful-less, what: { de: "Wörter mit -ful (ein l) und -less schreiben", en: "spelling words with -ful (one l) and -less" } }
    - { id: ly, what: { de: "Wörter mit -ly schreiben", en: "spelling words with -ly" } }
    - { id: y-to-i, what: { de: "wissen, wann y zu i wird (Konsonant vor dem y)", en: "knowing when y changes to i (a consonant before the y)" } }
  misconceptions:
    - id: ful-double-l
      what: Writes -ful with two l's because it means full (hopefull, carefull)
      addressed: Lesson 1 Learn screen 2; feedback in l1-f2; l1-s2, l1-n2, l2-c2
    - id: root-changed
      what: Drops or changes letters of a root word that should stay the same (hopless, carful, sadnes)
      addressed: Lesson 1 Learn screen 1 says write the whole root word first; l1-f4, l1-s4, l1-n4
    - id: y-kept
      what: Keeps the y of a root word ending in a consonant and y (happyness, happyly)
      addressed: Lesson 2 Learn screens 1 and 2; feedback in l2-f1; l2-s1, l2-n1, l2-c3
    - id: y-always-changes
      what: Changes every y to i, even after a vowel (enjoiment, plaiful)
      addressed: Lesson 2 Learn screen 3 sets enjoy and play against happy; l2-f4, l2-s4, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Stammwort plus Nachsilbe, en: Root word plus suffix }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Helping. I am helping Dad." }
            options: ["helping", "helpping", "helpin"]
            answer: "helping"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Fill the gap: un + kind = _"
            say: "Add un to kind. Which word do you make?"
            frame: "un + kind = _"
            options: ["unkind", "unnkind", "unkine"]
            answer: ["unkind"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "enjoy + ment = enjoyment\nsad + ness = sadness"
            say: "A suffix is an ending we add to a root word. Write the whole root word first, then add the suffix. Enjoy, then ment: enjoyment. Sad, then ness: sadness."
            show: { drawn: letter-card, text: "enjoy ment" }
          - text: "hope + ful = hopeful"
            say: "Ful means full of, but the suffix has only one l. Hope, then f, u, l: hopeful."
          - text: "hope + less = hopeless\nsad + ly = sadly"
            say: "Less means without. Hope, then less: hopeless. The e of hope stays. Ly tells you how: sad, then ly, sadly."
          - text: "root word + suffix"
            say: "When the root word does not end in y, just add the suffix. Do not change the root word."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Fill the gap: pay + ment = _"
                say: "Add ment to pay. Which spelling is right?"
                frame: "pay + ment = _"
                options: ["payment", "paymant", "paiment"]
                answer: ["payment"]
                option_audio: false
                hints:
                  - "Write the whole root word first."
                  - "Pay stays as it is. Then add m, e, n, t."
                  - "payment"
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Careful. Be careful on the ice." }
                options: ["careful", "carefull", "carful"]
                answer: "careful"
                feedback:
                  "carefull": "Ful means full of, but the suffix has only one l."
                hints:
                  - "The root word is care."
                  - "Care, then the suffix ful with one l."
                  - "careful"
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap: dark + _ = darkness"
                say: "Which suffix turns dark into darkness?"
                frame: "dark + _ = darkness"
                options: ["ness", "nes", "less"]
                answer: ["ness"]
                option_audio: false
                hints:
                  - "Look at the end of darkness."
                  - "The suffix has two s's at the end."
                  - "ness"
              - id: l1-f4
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which is the right spelling of useless?"
                options: ["useless", "usless", "useles"]
                answer: "useless"
                option_audio: false
                hints:
                  - "Write the root word use, all of it."
                  - "Use keeps its e. Then add less."
                  - "useless"
              - id: l1-f5
                type: true_false
                text: "Is it true? quick + ly = quickly"
                answer: true
                hints:
                  - "Does the root word change?"
                  - "Quick stays as it is. Add ly."
                  - "Yes, quickly."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Kindness. Thank you for your kindness." }
                options: ["kindness", "kindnes", "kindniss"]
                answer: "kindness"
                hints: ["Kind, then ness."]
              - id: l1-s2
                type: fill_in_blank
                text: "Fill the gap: help + ful = _"
                say: "Add ful to help. Which spelling is right?"
                frame: "help + ful = _"
                options: ["helpful", "helpfull", "helpfel"]
                answer: ["helpful"]
                option_audio: false
                hints: ["The suffix ful has one l."]
              - id: l1-s3
                type: true_false
                text: "Is it true? sad + ly = sadley"
                answer: false
                hints: ["Just add ly to sad."]
              - id: l1-s4
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which is the right spelling of hopeless?"
                options: ["hopeless", "hopless", "hopeles"]
                answer: "hopeless"
                option_audio: false
                hints: ["Hope keeps its e."]
              - id: l1-s5
                type: matching
                text: "Match each root word with its suffix."
                say: "Read the words. Which suffix makes a real word?"
                pairs:
                  - { left: { text: "enjoy" }, right: { text: "ment" } }
                  - { left: { text: "ill" }, right: { text: "ness" } }
                  - { left: { text: "slow" }, right: { text: "ly" } }
                hints: ["Say each word with the suffix: enjoyment, illness, slowly."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Treatment. The vet gave the dog some treatment." }
                options: ["treatment", "treetment", "treatmint"]
                answer: "treatment"
              - id: l1-n2
                type: fill_in_blank
                text: "Fill the gap: play + ful = _"
                say: "Add ful to play. Which spelling is right?"
                frame: "play + ful = _"
                options: ["playful", "playfull", "plaiful"]
                answer: ["playful"]
                option_audio: false
              - id: l1-n3
                type: fill_in_blank
                text: "Fill the gap: The dog barked _."
                say: "The dog barked loudly. Which spelling is right?"
                frame: "The dog barked _."
                options: ["loudly", "loudley", "loudlee"]
                answer: ["loudly"]
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which is the right spelling of careless?"
                options: ["careless", "carless", "carelis"]
                answer: "careless"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? ill + ness = illnes"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Thankful. I am thankful for my friends." }
            options: ["thankful", "thankfull", "thankfil"]
            answer: "thankful"
          - id: l1-c2
            type: fill_in_blank
            text: "Fill the gap: sad + ness = _"
            say: "Add ness to sad. Which spelling is right?"
            frame: "sad + ness = _"
            options: ["sadness", "saddness", "sadnes"]
            answer: ["sadness"]
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Which word is spelt correctly?"
            say: "Read the words yourself. Which is the right spelling of homeless?"
            options: ["homeless", "homless", "homeles"]
            answer: "homeless"
            option_audio: false
          - id: l1-c4
            type: text_input
            keyboard: letters
            text: "Write the word.\nA torch is ___ in the dark."
            say: "Write the word useful. A torch is useful in the dark."
            answer: "useful"
          - id: l1-c5
            type: fill_in_blank
            text: "Fill the gap: bad + ly = _"
            say: "Add ly to bad. Which spelling is right?"
            frame: "bad + ly = _"
            options: ["baddly", "badly", "badley"]
            answer: ["badly"]
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Is it true? fear + less = fearless"
            answer: true

  - n: 2
    title: { de: "Aus y wird i", en: "When y changes to i" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Fill the gap: hope + ful = _"
            say: "Add ful to hope. Which spelling is right?"
            frame: "hope + ful = _"
            options: ["hopeful", "hopefull", "hopful"]
            answer: ["hopeful"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Enjoyment. We clapped with enjoyment." }
            options: ["enjoyment", "enjoiment", "enjoymint"]
            answer: "enjoyment"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "happy + ness = happiness"
            say: "Happy ends in a y, and the letter before it, p, is a consonant. When we add a suffix, the y changes to i. Happy, happiness."
            show: { drawn: letter-card, text: "happi ness" }
          - text: "happy + ly = happily\nplenty + ful = plentiful\nmerry + ment = merriment"
            say: "The same rule works with every suffix: happily, plentiful, merriment. Consonant then y? Change the y to i."
          - text: "enjoy + ment = enjoyment\nplay + ful = playful"
            say: "Careful. In enjoy and play, the letter before the y is a vowel, o or a. Then the y stays."
          - text: "consonant + y → i"
            say: "So ask: is there a consonant just before the y? If yes, change y to i. If it is a vowel, keep the y."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Fill the gap: happy + ness = _"
                say: "Add ness to happy. Which spelling is right?"
                frame: "happy + ness = _"
                options: ["happiness", "happyness", "hapiness"]
                answer: ["happiness"]
                option_audio: false
                feedback:
                  "happyness": "Happy has a consonant before the y, so the y changes to i."
                hints:
                  - "What is the letter just before the y in happy?"
                  - "It is p, a consonant, so the y changes to i."
                  - "happiness"
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Happily. The children played happily." }
                options: ["happily", "happyly", "happilly"]
                answer: "happily"
                hints:
                  - "The root word is happy."
                  - "Change the y to i, then add ly."
                  - "happily"
              - id: l2-f3
                type: true_false
                text: "Is it true? plenty + ful = plentiful"
                answer: true
                hints:
                  - "What comes before the y in plenty?"
                  - "t is a consonant, so the y changes to i."
                  - "Yes, plentiful."
              - id: l2-f4
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which is the right spelling of joyful?"
                options: ["joyful", "joiful", "joyfull"]
                answer: "joyful"
                option_audio: false
                hints:
                  - "What comes before the y in joy?"
                  - "o is a vowel, so the y stays."
                  - "joyful"
              - id: l2-f5
                type: fill_in_blank
                text: "Fill the gap: angry + ly = _"
                say: "Add ly to angry. Which spelling is right?"
                frame: "angry + ly = _"
                options: ["angrily", "angryly", "angrilly"]
                answer: ["angrily"]
                option_audio: false
                hints:
                  - "Angry ends in r and y."
                  - "r is a consonant, so the y changes to i."
                  - "angrily"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Merriment. There was merriment at the party." }
                options: ["merriment", "merryment", "merrimant"]
                answer: "merriment"
                hints: ["Merry has r before the y."]
              - id: l2-s2
                type: fill_in_blank
                text: "Fill the gap: lazy + ness = _"
                say: "Add ness to lazy. Which spelling is right?"
                frame: "lazy + ness = _"
                options: ["laziness", "lazyness", "lazines"]
                answer: ["laziness"]
                option_audio: false
                hints: ["z is a consonant."]
              - id: l2-s3
                type: true_false
                text: "Is it true? penny + less = pennyless"
                answer: false
                hints: ["What comes before the y in penny?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which is the right spelling of employment?"
                options: ["employment", "emploiment", "employmint"]
                answer: "employment"
                option_audio: false
                hints: ["Is there a vowel or a consonant before the y?"]
              - id: l2-s5
                type: sorting
                text: "Sort the root words."
                say: "Read each root word. When you add a suffix, does the y change to i, or stay?"
                option_audio: false
                bins:
                  - { id: change, show: { text: "y changes to i" }, say: "Y changes to i." }
                  - { id: stay, show: { text: "y stays" }, say: "Y stays." }
                options:
                  - { text: "silly", bin: change }
                  - { text: "pay", bin: stay }
                  - { text: "busy", bin: change }
                  - { text: "enjoy", bin: stay }
                hints: ["Look at the letter just before the y."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Fill the gap: easy + ly = _"
                say: "Add ly to easy. Which spelling is right?"
                frame: "easy + ly = _"
                options: ["easily", "easyly", "easilly"]
                answer: ["easily"]
                option_audio: false
              - id: l2-n2
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Silliness. Stop this silliness!" }
                options: ["silliness", "sillyness", "silines"]
                answer: "silliness"
              - id: l2-n3
                type: true_false
                text: "Is it true? play + ful = playful"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which is the right spelling of beautiful?"
                options: ["beautiful", "beautyful", "beautifull"]
                answer: "beautiful"
                option_audio: false
              - id: l2-n5
                type: fill_in_blank
                text: "Fill the gap: The cat sat _ in the sun."
                say: "The cat sat lazily in the sun. Which spelling is right?"
                frame: "The cat sat _ in the sun."
                options: ["lazily", "lazyly", "lazely"]
                answer: ["lazily"]
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ment-ness
            type: fill_in_blank
            text: "Fill the gap: move + ment = _"
            say: "Add ment to move. Which spelling is right?"
            frame: "move + ment = _"
            options: ["movement", "movment", "movemint"]
            answer: ["movement"]
            option_audio: false
          - id: l2-c2
            part: ful-less
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Painful. My knee is painful." }
            options: ["painful", "painfull", "panful"]
            answer: "painful"
          - id: l2-c3
            part: y-to-i
            type: fill_in_blank
            text: "Fill the gap: tidy + ness = _"
            say: "Add ness to tidy. Which spelling is right?"
            frame: "tidy + ness = _"
            options: ["tidiness", "tidyness", "tidines"]
            answer: ["tidiness"]
            option_audio: false
          - id: l2-c4
            part: y-to-i
            type: multiple_choice
            text: "Which word is spelt correctly?"
            say: "Read the words yourself. Which is the right spelling of joyless?"
            options: ["joyless", "joiless", "joyles"]
            answer: "joyless"
            option_audio: false
          - id: l2-c5
            part: ly
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Brightly. The sun shone brightly." }
            options: ["brightly", "brightley", "britely"]
            answer: "brightly"
          - id: l2-c6
            part: ment-ness
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Excitement. We jumped up and down with excitement." }
            options: ["excitment", "excitement", "exsitement"]
            answer: "excitement"
          - id: l2-c7
            part: ment-ness
            type: text_input
            keyboard: letters
            text: "Write the word.\nI love the ___ of my kitten's fur."
            say: "Write the word softness. I love the softness of my kitten's fur."
            answer: "softness"
          - id: l2-c8
            part: ment-ness
            type: fill_in_blank
            text: "Fill the gap: pave + _ = pavement"
            say: "Which suffix turns pave into pavement?"
            frame: "pave + _ = pavement"
            options: ["mint", "ment", "ness"]
            answer: ["ment"]
            option_audio: false
          - id: l2-c9
            part: ment-ness
            type: multiple_choice
            text: "Which word is spelt correctly?"
            say: "Read the words yourself. Which is the right spelling of wetness?"
            options: ["wettness", "wetnes", "wetness"]
            answer: "wetness"
            option_audio: false
          - id: l2-c10
            part: ful-less
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Colourful. The rainbow is colourful." }
            options: ["colourful", "colourfull", "colerful"]
            answer: "colourful"
          - id: l2-c11
            part: ful-less
            type: fill_in_blank
            text: "Fill the gap: help + less = _"
            say: "Add less to help. Which spelling is right?"
            frame: "help + less = _"
            options: ["helples", "helpless", "helpliss"]
            answer: ["helpless"]
            option_audio: false
          - id: l2-c12
            part: ful-less
            type: text_input
            keyboard: letters
            text: "Write the word.\nAdd a ___ of sugar."
            say: "Write the word spoonful. Add a spoonful of sugar."
            answer: "spoonful"
          - id: l2-c13
            part: ful-less
            type: multiple_choice
            text: "Which word is spelt correctly?"
            say: "Read the words yourself. Which is the right spelling of cloudless?"
            options: ["cloudles", "clowdless", "cloudless"]
            answer: "cloudless"
            option_audio: false
          - id: l2-c14
            part: ly
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Softly. The snow fell softly." }
            options: ["softley", "softly", "sofly"]
            answer: "softly"
          - id: l2-c15
            part: ly
            type: text_input
            keyboard: letters
            text: "Write the word.\nThe mouse crept ___ across the floor."
            say: "Write the word quietly. The mouse crept quietly across the floor."
            answer: "quietly"
          - id: l2-c16
            part: ly
            type: true_false
            text: "Is it true? kind + ly = kindly"
            answer: true
          - id: l2-c17
            part: ly
            type: fill_in_blank
            text: "Fill the gap: nice + ly = _"
            say: "Add ly to nice. Which spelling is right?"
            frame: "nice + ly = _"
            options: ["nicly", "nicely", "nicelly"]
            answer: ["nicely"]
            option_audio: false
          - id: l2-c18
            part: y-to-i
            type: fill_in_blank
            text: "Fill the gap: The rain fell _ all day."
            say: "The rain fell heavily all day. Which spelling is right?"
            frame: "The rain fell _ all day."
            options: ["heavyly", "heavily", "heavely"]
            answer: ["heavily"]
            option_audio: false
          - id: l2-c19
            part: y-to-i
            type: text_input
            keyboard: letters
            text: "Write the word.\nIt rained, but ___ we had our coats."
            say: "Write the word luckily. It rained, but luckily we had our coats."
            answer: "luckily"
            difficulty: stretch
          - id: l2-c20
            part: y-to-i
            type: true_false
            text: "Is it true? cosy + ness = cosyness"
            answer: false
