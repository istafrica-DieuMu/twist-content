# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.alternative-spellings
skill: lit-en.spelling.alternative-spellings
curriculum: en-GB
language: en
title:
  de: Verschiedene Schreibweisen für einen Laut
  en: Different spellings of one sound
summary: >
  One sound can be spelt in different ways, and the place in the word
  often decides which. Lesson 1 takes the ay sound (ai in the middle as
  in rain, ay at the end as in play, a-e as in cake) and the ee sound (ee
  as in tree, ea as in leaf, y at the end as in happy). Lesson 2 takes
  the igh sound (igh, ie, i-e, y as in fly) and the oh sound (oa, ow,
  o-e), adds a few homophones (see and sea, be and bee), and ends with the
  skill check. Spelling options have no speaker, since they sound alike.
metadata:
  year: year-2
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.spelling.segment-spell, lit-en.phonics.split-digraphs]
  also_practises: [lit-en.phonics.alternative-pronunciations]
  vocabulary: { en: [sound, phoneme, grapheme, digraph, trigraph, split digraph, spelling, homophone, middle, end] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: ay-sound, what: { de: "den ay-Laut schreiben (ai, ay, a-e)", en: "spelling the ay sound (ai, ay, a-e)" } }
    - { id: ee-sound, what: { de: "den ee-Laut schreiben (ee, ea, y)", en: "spelling the ee sound (ee, ea, y)" } }
    - { id: igh-sound, what: { de: "den igh-Laut schreiben (igh, ie, i-e, y)", en: "spelling the igh sound (igh, ie, i-e, y)" } }
    - { id: oh-sound, what: { de: "den oh-Laut schreiben (oa, ow, o-e)", en: "spelling the oh sound (oa, ow, o-e)" } }
    - { id: homophones, what: { de: "gleich klingende Wörter nach der Bedeutung wählen (see, sea; be, bee)", en: "choosing between words that sound the same by their meaning (see, sea; be, bee)" } }
  misconceptions:
    - id: one-spelling-only
      what: Uses the first spelling learnt for every word (rane, snaik, tre)
      addressed: Learn sets the spellings of each sound side by side; l1-f1, l1-s1 and l2-f1 choose between real and sound-alike spellings, with feedback in l1-f1
    - id: position-ignored
      what: Puts ay in the middle or ai at the end (raytn, plai), or ow and oa the wrong way round
      addressed: Learn screen 2 of lesson 1 and screen 2 of lesson 2 give the position rule; l1-f3, l1-s3, l2-f3 and l2-s3 ask which spelling goes at the end, with feedback in l2-f3
    - id: homophone-mix
      what: Writes the wrong one of two words that sound the same (sea for see, be for bee)
      addressed: Learn screen 4 of lesson 2; l2-f5, l2-s5 and l2-n4 choose the homophone that fits a sentence
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der ay-Laut und der ee-Laut", en: "The ay sound and the ee sound" }
    goal:
      de: "Lerne verschiedene Schreibweisen für einen Laut, so wie bei rain, play und cake oder bei tree, leaf und happy."
      en: "Learn different ways to spell one sound, like rain, play and cake, or tree, leaf and happy."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Which letter turns hop into hope?"
            say: "Which letter turns hop into hope?"
            frame: "hop_"
            options: ["e", "a", "s"]
            answer: ["e"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Fill in the missing sound."
            say: "Listen: fish. Fill in the missing sound."
            show: { object: fish }
            frame: "f_sh"
            options: ["i", "e", "a"]
            answer: ["i"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "ai   ay   a-e"
            say: "The ay sound can be spelt in different ways. a i as in rain. a y as in play. a, then a letter, then e, as in cake."
            show: { object: rain }
          - text: "rain   tail   train\nplay   day   say"
            say: "Where is the sound in the word? a i usually comes in the middle: rain, tail. a y usually comes at the end: play, day. English words almost never end in a i."
          - text: "ee   ea   y"
            say: "The ee sound has different spellings too. e e as in tree. e a as in leaf. And at the end of a longer word, y can say ee, as in happy."
            show: { object: tree }
          - text: "Learn the word"
            say: "Sometimes you cannot tell which spelling is right from the sound. Then you learn the word and remember how it looks: tree with e e, leaf with e a."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which spelling is right?"
                say: "Look at the picture. Which spelling is right? Read them yourself."
                show: { object: snail }
                options: [{ drawn: letter-card, text: "snail", key: snail }, { drawn: letter-card, text: "snayl", key: snayl }, { drawn: letter-card, text: "snale", key: snale }]
                answer: snail
                feedback:
                  snayl: "a y usually comes at the end of a word. In the middle, use a i: snail."
                hints:
                  - "Where is the ay sound: in the middle or at the end?"
                  - "In the middle we usually use a i."
                  - "snail."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fill in the ay sound.\nClue: a dog wags it."
                say: "Listen: tail. A dog wags its tail. Fill in the ay sound."
                frame: "t_l"
                options: ["ai", "ay", "a"]
                answer: ["ai"]
                option_audio: false
                hints:
                  - "The sound is in the middle of the word."
                  - "a i goes in the middle, a y at the end."
                  - "ai: tail."
              - id: l1-f3
                type: multiple_choice
                text: "Which spelling of ay goes at the end of a word?"
                options: ["ay", "ai"]
                answer: "ay"
                option_audio: false
                hints:
                  - "Think of play and day."
                  - "Words almost never end in a i."
                  - "ay."
              - id: l1-f4
                type: sorting
                text: "Sort the words by how the ay sound is spelt."
                say: "Read each word. How is the ay sound spelt? Put it in the right group."
                option_audio: false
                bins:
                  - { id: ai, show: { text: "ai" }, say: "a i." }
                  - { id: ay, show: { text: "ay" }, say: "a y." }
                  - { id: a-e, show: { text: "a-e" }, say: "a, then a letter, then e." }
                options:
                  - { text: "rain", bin: ai }
                  - { text: "day", bin: ay }
                  - { text: "cake", bin: a-e }
                  - { text: "wait", bin: ai }
                  - { text: "say", bin: ay }
                  - { text: "game", bin: a-e }
                hints:
                  - "Look for the letters that make the ay sound."
                  - "Is there an e at the end? Is there a y at the end?"
                  - "ai: rain, wait. ay: day, say. a-e: cake, game."
              - id: l1-f5
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Leaf." }
                show: { object: leaf }
                options: ["leaf", "leef", "lefe"]
                answer: "leaf"
                hints:
                  - "This word uses e a."
                  - "Remember how it looks: l, e, a, f."
                  - "leaf."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which spelling is right?"
                say: "Look at the picture. Which spelling is right? Read them yourself."
                show: { object: tree }
                options: [{ drawn: letter-card, text: "trea", key: trea }, { drawn: letter-card, text: "tree", key: tree }, { drawn: letter-card, text: "tre", key: tre }]
                answer: tree
                hints: ["This word uses e e."]
              - id: l1-s2
                type: fill_in_blank
                text: "Fill in the ay sound.\nClue: you do it with your toys."
                say: "Listen: play. You play with your toys. Fill in the ay sound."
                frame: "pl_"
                options: ["ai", "ay", "a-e"]
                answer: ["ay"]
                option_audio: false
                hints: ["The sound is at the end of the word."]
              - id: l1-s3
                type: true_false
                text: "The word day is spelt dai."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Words almost never end in a i."]
              - id: l1-s4
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Happy." }
                options: ["happy", "happee", "happea"]
                answer: "happy"
                hints: ["At the end of a longer word, ee is often spelt y."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which spelling is right?"
                say: "Look at the picture. Which spelling is right? Read them yourself."
                show: { object: snake }
                options: [{ drawn: letter-card, text: "snaik", key: snaik }, { drawn: letter-card, text: "snayk", key: snayk }, { drawn: letter-card, text: "snake", key: snake }]
                answer: snake
                hints: ["This word has a split digraph."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Fill in the ay sound."
                say: "Listen: train. Fill in the ay sound."
                show: { object: train }
                frame: "tr_n"
                options: ["ai", "ay", "a"]
                answer: ["ai"]
                option_audio: false
              - id: l1-n2
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Away." }
                options: ["awai", "away", "awae"]
                answer: "away"
              - id: l1-n3
                type: image_multiple_choice
                text: "Which spelling is right?"
                say: "Look at the picture. Which spelling is right? Read them yourself."
                show: { object: bee }
                options: [{ drawn: letter-card, text: "bea", key: bea }, { drawn: letter-card, text: "bee", key: bee }, { drawn: letter-card, text: "be", key: be }]
                answer: bee
              - id: l1-n4
                type: sorting
                text: "Sort the words by how the ee sound is spelt."
                say: "Read each word. How is the ee sound spelt? Put it in the right group."
                option_audio: false
                bins:
                  - { id: ee, show: { text: "ee" }, say: "e e." }
                  - { id: ea, show: { text: "ea" }, say: "e a." }
                  - { id: y, show: { text: "y" }, say: "y." }
                options:
                  - { text: "sheep", bin: ee }
                  - { text: "seat", bin: ea }
                  - { text: "funny", bin: y }
                  - { text: "green", bin: ee }
                  - { text: "dream", bin: ea }
                  - { text: "baby", bin: y }
              - id: l1-n5
                type: true_false
                text: "The word whale has the ay sound spelt a-e."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Fill in the ay sound."
            say: "Listen: paint. Fill in the ay sound."
            show: { object: paint }
            frame: "p_nt"
            options: ["ai", "ay", "a"]
            answer: ["ai"]
            option_audio: false
          - id: l1-c2
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Stay." }
            options: ["stai", "stay", "stae"]
            answer: "stay"
          - id: l1-c3
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Sleep." }
            options: ["sleap", "sleep", "slepe"]
            answer: "sleep"
          - id: l1-c4
            type: image_multiple_choice
            text: "Which spelling is right?"
            say: "Look at the picture. Wheat. Which spelling is right? Read them yourself."
            show: { object: wheat }
            options: [{ drawn: letter-card, text: "wheet", key: wheet }, { drawn: letter-card, text: "whete", key: whete }, { drawn: letter-card, text: "wheat", key: wheat }]
            answer: wheat
          - id: l1-c5
            type: sorting
            text: "Sort the words by how the ay sound is spelt."
            say: "Read each word. How is the ay sound spelt? Put it in the right group."
            option_audio: false
            bins:
              - { id: ai, show: { text: "ai" }, say: "a i." }
              - { id: ay, show: { text: "ay" }, say: "a y." }
              - { id: a-e, show: { text: "a-e" }, say: "a, then a letter, then e." }
            options:
              - { text: "tray", bin: ay }
              - { text: "plane", bin: a-e }
              - { text: "nail", bin: ai }
              - { text: "spray", bin: ay }
              - { text: "brain", bin: ai }
              - { text: "gate", bin: a-e }
          - id: l1-c6
            type: true_false
            text: "The word sunny has the ee sound spelt y."
            say: "Read it. Is it true?"
            answer: true

  - n: 2
    title: { de: "Der igh-Laut, der oh-Laut und gleich klingende Wörter", en: "The igh sound, the oh sound and homophones" }
    goal:
      de: "Schreib die Laute in night und boat richtig und wähl gleich klingende Wörter nach ihrer Bedeutung aus."
      en: "Spell the sounds in night and boat the right way, and pick words that sound alike by what they mean."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Fill in the ay sound.\nClue: Monday is one."
            say: "Listen: day. Monday is a day. Fill in the ay sound."
            frame: "d_"
            options: ["ai", "ay", "a"]
            answer: ["ay"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Green." }
            options: ["green", "grean", "grene"]
            answer: "green"
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "igh   ie   i-e   y"
            say: "The igh sound has four spellings. i g h as in night. i e as in pie. i, then a letter, then e, as in kite. And y at the end of a short word, as in fly and my."
            show: { object: pie }
          - text: "oa   ow   o-e"
            say: "The oh sound has three spellings. o a usually comes in the middle: boat, goat. o w usually comes at the end: snow, slow. And o, then a letter, then e, as in nose."
            show: { object: boat }
          - text: "boat ... snow"
            say: "The rule is the same as for a i and a y. The spelling with a vowel pair goes in the middle. The spelling with y or w goes at the end."
          - text: "see / sea     be / bee"
            say: "Some words sound the same but are spelt differently and mean different things. They are called homophones. I see a ship on the sea. Be kind to the bee. You choose the spelling by the meaning."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which spelling is right?"
                say: "Look at the picture. Which spelling is right? Read them yourself."
                show: { object: goat }
                options: [{ drawn: letter-card, text: "gote", key: gote }, { drawn: letter-card, text: "gowt", key: gowt }, { drawn: letter-card, text: "goat", key: goat }]
                answer: goat
                hints:
                  - "Where is the oh sound: in the middle or at the end?"
                  - "In the middle we usually use o a."
                  - "goat."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Fill in the igh sound."
                say: "Listen: fly. Fill in the igh sound."
                show: { object: fly }
                frame: "fl_"
                options: ["y", "igh", "ie"]
                answer: ["y"]
                option_audio: false
                hints:
                  - "Fly is a short word, and the sound is at the end."
                  - "Think of my and sky."
                  - "y: fly."
              - id: l2-f3
                type: multiple_choice
                text: "Which spelling of oh goes at the end of a word?"
                options: ["ow", "oa"]
                answer: "ow"
                option_audio: false
                feedback:
                  oa: "o a usually goes in the middle, as in boat. At the end, use o w, as in snow."
                hints:
                  - "Think of snow and slow."
                  - "The spelling with w goes at the end."
                  - "ow."
              - id: l2-f4
                type: sorting
                text: "Sort the words by how the igh sound is spelt."
                say: "Read each word. How is the igh sound spelt? Put it in the right group."
                option_audio: false
                bins:
                  - { id: igh, show: { text: "igh" }, say: "i g h." }
                  - { id: i-e, show: { text: "i-e" }, say: "i, then a letter, then e." }
                  - { id: y, show: { text: "y" }, say: "y." }
                options:
                  - { text: "night", bin: igh }
                  - { text: "bike", bin: i-e }
                  - { text: "sky", bin: y }
                  - { text: "light", bin: igh }
                  - { text: "time", bin: i-e }
                  - { text: "my", bin: y }
                hints:
                  - "Look for the letters that make the igh sound."
                  - "Is there g h? An e at the end? A y at the end?"
                  - "igh: night, light. i-e: bike, time. y: sky, my."
              - id: l2-f5
                type: multiple_choice
                text: "I can _ the moon."
                say: "Which word fits the sentence? Read them yourself."
                options: ["see", "sea"]
                answer: "see"
                option_audio: false
                hints:
                  - "These words sound the same. Think about the meaning."
                  - "Sea is the water by the beach. See is what you do with your eyes."
                  - "see."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Snow." }
                options: ["snoa", "snow", "snoe"]
                answer: "snow"
                hints: ["The oh sound is at the end."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which spelling is right?"
                say: "Look at the picture. Which spelling is right? Read them yourself."
                show: { object: kite }
                options: [{ drawn: letter-card, text: "kight", key: kight }, { drawn: letter-card, text: "kite", key: kite }, { drawn: letter-card, text: "kyte", key: kyte }]
                answer: kite
                hints: ["This word has a split digraph."]
              - id: l2-s3
                type: true_false
                text: "The word boat is spelt bowt."
                say: "Read it. Is it true?"
                answer: false
                hints: ["The oh sound is in the middle."]
              - id: l2-s4
                type: fill_in_blank
                text: "Fill in the igh sound.\nClue: switch it on when it is dark."
                say: "Listen: light. Switch on the light when it is dark. Fill in the igh sound."
                frame: "l_t"
                options: ["igh", "y", "ie"]
                answer: ["igh"]
                option_audio: false
                hints: ["Think of night."]
              - id: l2-s5
                type: multiple_choice
                text: "A _ makes honey."
                say: "Which word fits the sentence? Read them yourself."
                options: ["be", "bee"]
                answer: "bee"
                option_audio: false
                hints: ["Which one is the insect?"]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which spelling is right?"
                say: "Look at the picture. Which spelling is right? Read them yourself."
                show: { object: nose }
                options: [{ drawn: letter-card, text: "noaz", key: noaz }, { drawn: letter-card, text: "nose", key: nose }, { drawn: letter-card, text: "nowz", key: nowz }]
                answer: nose
              - id: l2-n2
                type: fill_in_blank
                text: "Fill in the oh sound.\nClue: you wear it over your clothes when it is cold."
                say: "Listen: coat. You wear a coat when it is cold. Fill in the oh sound."
                frame: "c_t"
                options: ["oa", "ow", "o"]
                answer: ["oa"]
                option_audio: false
              - id: l2-n3
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Pie." }
                options: ["pigh", "pie", "py"]
                answer: "pie"
              - id: l2-n4
                type: multiple_choice
                text: "We swim in the _."
                say: "Which word fits the sentence? Read them yourself."
                options: ["see", "sea"]
                answer: "sea"
                option_audio: false
              - id: l2-n5
                type: sorting
                text: "Sort the words by how the oh sound is spelt."
                say: "Read each word. How is the oh sound spelt? Put it in the right group."
                option_audio: false
                bins:
                  - { id: oa, show: { text: "oa" }, say: "o a." }
                  - { id: ow, show: { text: "ow" }, say: "o w." }
                  - { id: o-e, show: { text: "o-e" }, say: "o, then a letter, then e." }
                options:
                  - { text: "road", bin: oa }
                  - { text: "grow", bin: ow }
                  - { text: "home", bin: o-e }
                  - { text: "soap", bin: oa }
                  - { text: "show", bin: ow }
                  - { text: "bone", bin: o-e }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ay-sound
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Rain." }
            options: ["rayn", "rain", "rane"]
            answer: "rain"
          - id: l2-c2
            part: ee-sound
            type: fill_in_blank
            text: "Fill in the ee sound.\nClue: you can have one while you sleep."
            say: "Listen: dream. You can have a dream while you sleep. Fill in the ee sound."
            frame: "dr_m"
            options: ["ea", "ee", "y"]
            answer: ["ea"]
            option_audio: false
          - id: l2-c3
            part: oh-sound
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Slow." }
            options: ["sloa", "slow", "slo"]
            answer: "slow"
          - id: l2-c4
            part: igh-sound
            type: fill_in_blank
            text: "Fill in the igh sound.\nClue: the clouds and the sun are up in it."
            say: "Listen: sky. The clouds are up in the sky. Fill in the igh sound."
            frame: "sk_"
            options: ["igh", "y", "ie"]
            answer: ["y"]
            option_audio: false
          - id: l2-c5
            part: homophones
            type: multiple_choice
            text: "Please _ quiet in the library."
            say: "Which word fits the sentence? Read them yourself."
            options: ["be", "bee"]
            answer: "be"
            option_audio: false
          - id: l2-c6
            part: ay-sound
            type: image_multiple_choice
            text: "Which spelling is right?"
            say: "Look at the picture. Wave. Which spelling is right? Read them yourself."
            show: { object: wave }
            options: [{ drawn: letter-card, text: "waiv", key: waiv }, { drawn: letter-card, text: "wave", key: wave }, { drawn: letter-card, text: "wayv", key: wayv }]
            answer: wave
          - id: l2-c7
            part: ay-sound
            type: fill_in_blank
            text: "Fill in the ay sound.\nClue: not yesterday and not tomorrow."
            say: "Listen: today. Not yesterday and not tomorrow, but today. Fill in the ay sound."
            frame: "tod_"
            options: ["ai", "ay", "a-e"]
            answer: ["ay"]
            option_audio: false
          - id: l2-c8
            part: ay-sound
            type: true_false
            text: "The word chain is spelt chayn."
            say: "Read it. Is it true?"
            answer: false
          - id: l2-c9
            part: ee-sound
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Teeth." }
