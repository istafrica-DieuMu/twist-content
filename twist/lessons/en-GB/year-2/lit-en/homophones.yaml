# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.homophones
skill: lit-en.spelling.homophones
curriculum: en-GB
language: en
title:
  de: Gleich klingende Wörter
  en: Homophones
summary: >
  Homophones sound the same but are spelt differently and mean different
  things. Lesson 1 takes there, their and they're, and here and hear,
  with a clue for each (here and there are places, hear has an ear);
  lesson 2 takes to, too and two and the pairs see and sea, be and bee,
  blue and blew, one and won, plus the near-homophones quite and quiet,
  and ends with the skill check. The sentence always decides.
metadata:
  year: year-2
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.spelling.exception-words-y2]
  also_practises: []
  vocabulary: { en: [homophone, near-homophone, meaning, sentence, apostrophe, there, their, "they're", to, too, two] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: one-there-for-all
      what: Uses there for all three (there coats for their coats)
      addressed: Lesson 1 Learn gives each spelling a test (a place, belongs to, they are); feedback in l1-f1 and l1-f3; l1-s1, l1-n1, l2-c1
    - id: too-for-to
      what: Writes to where too means also or more than enough (I want to come to)
      addressed: Lesson 2 Learn screen 1 says too has an extra o for extra; feedback in l2-f2; l2-s2, l2-n2, l2-c2
    - id: spell-by-sound
      what: Thinks a word that sounds right is spelt right, so picks either homophone
      addressed: Both Learn parts say the meaning in the sentence decides; options are never read aloud; l1-f5, l2-f5, l2-s5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "there, their, they're; here, hear", en: "there, their, they're; here, hear" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Would. Would you like to play?" }
            options: ["would", "wud", "wuold"]
            answer: "would"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Fill the gap: peo_le"
            say: "Spell the word people. Which letter goes in the gap?"
            frame: "peo_le"
            options: ["p", "b", "pp"]
            answer: ["p"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "there   their   they're"
            say: "These three words sound the same, but they are spelt differently and mean different things. Words like this are called homophones. The sentence tells you which one to use."
          - text: "The park is over there.\nThat is their dog.\nThey're going home."
            say: "There is a place. It has the word here inside it: t, here. Their means it belongs to them: their dog. They're is short for they are. The apostrophe shows where the a is missing."
          - text: "here   hear"
            say: "Here is a place: come here. Hear is what you do with your ear, and hear has the word ear inside it."
            show: { object: ear }
          - text: "Can you swap in \"they are\"? Then write they're."
            say: "A good test: say the sentence with they are. If it makes sense, write they're. If it is about a place, write there. If something belongs to them, write their."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Fill the gap: The children put on _ coats."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "The children put on _ coats."
                options: ["their", "there", "they're"]
                answer: ["their"]
                option_audio: false
                feedback:
                  "there": "There is a place. The coats belong to the children, so it is their."
                hints:
                  - "Whose coats are they?"
                  - "The coats belong to the children."
                  - "their"
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fill the gap: I can _ the birds singing."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "I can _ the birds singing."
                options: ["hear", "here"]
                answer: ["hear"]
                option_audio: false
                hints:
                  - "Do you use your ear for this?"
                  - "Hear has the word ear inside it."
                  - "hear"
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap: _ late for school!"
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "_ late for school!"
                options: ["They're", "There", "Their"]
                answer: ["They're"]
                option_audio: false
                feedback:
                  "There": "Try they are: they are late for school. That works, so it is they're."
                hints:
                  - "Try saying they are in the gap."
                  - "They are late for school makes sense."
                  - "They're"
              - id: l1-f4
                type: true_false
                text: "Is it true? \"Put the box over their.\""
                say: "Read the sentence. Is the right word used?"
                answer: false
                hints:
                  - "Is the word about a place or about something that belongs to someone?"
                  - "Over there is a place."
                  - "No, it should be there."
              - id: l1-f5
                type: multiple_choice
                text: "Which word means \"they are\"?"
                say: "Read the words yourself. Which one means they are?"
                options: ["they're", "there", "their"]
                answer: "they're"
                option_audio: false
                hints:
                  - "Look for the apostrophe."
                  - "The apostrophe shows a missing letter."
                  - "they're"

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Fill the gap: Is your bag over _?"
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "Is your bag over _?"
                options: ["there", "their", "they're"]
                answer: ["there"]
                option_audio: false
                hints: ["Is it a place?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Fill the gap: Come and sit _ next to me."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "Come and sit _ next to me."
                options: ["here", "hear"]
                answer: ["here"]
                option_audio: false
                hints: ["Here is a place, like there."]
              - id: l1-s3
                type: true_false
                text: "Is it true? \"They're playing football.\""
                say: "Read the sentence. Is the right word used?"
                answer: true
                hints: ["Try they are playing football."]
              - id: l1-s4
                type: multiple_choice
                text: "Which word means \"belongs to them\"?"
                say: "Read the words yourself. Which one means belongs to them?"
                options: ["their", "there", "they're"]
                answer: "their"
                option_audio: false
                hints: ["It is not a place and has no apostrophe."]
              - id: l1-s5
                type: sorting
                text: "Sort the sentences."
                say: "Read each sentence. Is the right word used? Put it in the right group."
                option_audio: false
                bins:
                  - { id: right, show: { text: "right word" }, say: "Right word." }
                  - { id: wrong, show: { text: "wrong word" }, say: "Wrong word." }
                options:
                  - { text: "Their cat is black.", bin: right }
                  - { text: "I can here you.", bin: wrong }
                  - { text: "Wait over there.", bin: right }
                  - { text: "There happy today.", bin: wrong }
                hints: ["Test each one: a place, belongs to them, or they are?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Fill the gap: The twins have lost _ hats."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "The twins have lost _ hats."
                options: ["their", "there", "they're"]
                answer: ["their"]
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Fill the gap: Did you _ the bell?"
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "Did you _ the bell?"
                options: ["hear", "here"]
                answer: ["hear"]
                option_audio: false
              - id: l1-n3
                type: fill_in_blank
                text: "Fill the gap: Mum says _ coming to tea."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "Mum says _ coming to tea."
                options: ["they're", "there", "their"]
                answer: ["they're"]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Is it true? \"We sat there for an hour.\""
                say: "Read the sentence. Is the right word used?"
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Fill the gap: Put the books down _."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "Put the books down _."
                options: ["here", "hear"]
                answer: ["here"]
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Fill the gap: _ is a cat on the wall."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "_ is a cat on the wall."
            options: ["There", "Their", "They're"]
            answer: ["There"]
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Fill the gap: Can you _ the rain?"
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "Can you _ the rain?"
            options: ["hear", "here"]
            answer: ["hear"]
            option_audio: false
          - id: l1-c3
            type: fill_in_blank
            text: "Fill the gap: The girls ride _ bikes."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "The girls ride _ bikes."
            options: ["their", "there", "they're"]
            answer: ["their"]
            option_audio: false

  - n: 2
    title: { de: "to, too, two und andere Paare", en: "to, too, two and other pairs" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Fill the gap: _ going swimming."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "_ going swimming."
            options: ["They're", "There", "Their"]
            answer: ["They're"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Fill the gap: Stand _ by the door."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "Stand _ by the door."
            options: ["here", "hear"]
            answer: ["here"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I go to school.\nI want to come too.\nI have two hands."
            say: "To, too and two sound the same. To goes with a place or a verb: to school, to play. Too means also, or more than enough: too hot. It has an extra o for extra. Two is the number 2."
          - text: "see / sea   be / bee   blue / blew   one / won"
            say: "More homophones. See with your eyes, swim in the sea. Be good, a bee buzzes. The sky is blue, the wind blew. One is a number, we won the game."
            show: { object: bee }
          - text: "quite   quiet"
            say: "Quite and quiet sound nearly the same. Quite means a bit or very: quite cold. Quiet means not loud. Quiet has two parts: qui, et. These are near-homophones."
          - text: "Read the whole sentence first."
            say: "The meaning of the sentence tells you which spelling to use. Read it all, then choose."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Fill the gap: I have _ sisters."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "I have _ sisters."
                options: ["two", "to", "too"]
                answer: ["two"]
                option_audio: false
                hints:
                  - "Is the word a number?"
                  - "How many sisters? It means 2."
                  - "two"
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Fill the gap: This soup is _ hot!"
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "This soup is _ hot!"
                options: ["too", "to", "two"]
                answer: ["too"]
                option_audio: false
                feedback:
                  "to": "This means more hot than you want. That is too, with an extra o for extra."
                hints:
                  - "Does it mean more than enough?"
                  - "Too has an extra o for extra."
                  - "too"
              - id: l2-f3
                type: multiple_choice
                text: "Which word names this?"
                say: "Look at the picture. Read the words yourself. Which spelling names it?"
                show: { object: bee }
                options: ["bee", "be"]
                answer: "bee"
                option_audio: false
                hints:
                  - "One spelling is the insect."
                  - "The insect has two e's."
                  - "bee"
              - id: l2-f4
                type: fill_in_blank
                text: "Fill the gap: We went _ the beach."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "We went _ the beach."
                options: ["to", "too", "two"]
                answer: ["to"]
                option_audio: false
                hints:
                  - "Is it a number, or does it mean also?"
                  - "It goes with a place: to the beach."
                  - "to"
              - id: l2-f5
                type: fill_in_blank
                text: "Fill the gap: Our team _ the cup!"
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "Our team _ the cup!"
                options: ["won", "one"]
                answer: ["won"]
                option_audio: false
                hints:
                  - "Is it the number 1?"
                  - "No. The team came first in the game."
                  - "won"

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Fill the gap: The fish swim in the _."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "The fish swim in the _."
                options: ["sea", "see"]
                answer: ["sea"]
                option_audio: false
                hints: ["You see with your eyes."]
              - id: l2-s2
                type: fill_in_blank
                text: "Fill the gap: Can I come _?"
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "Can I come _?"
                options: ["too", "to", "two"]
                answer: ["too"]
                option_audio: false
                hints: ["It means also."]
              - id: l2-s3
                type: true_false
                text: "Is it true? \"The wind blue my hat off.\""
                say: "Read the sentence. Is the right word used?"
                answer: false
                hints: ["Is it a colour?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Fill the gap: Please be _ in the library."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "Please be _ in the library."
                options: ["quiet", "quite"]
                answer: ["quiet"]
                option_audio: false
                hints: ["The word means not loud."]
              - id: l2-s5
                type: multiple_choice
                text: "Which sentence is spelt correctly?"
                say: "Read the sentences yourself. Which one is right?"
                options: ["I have one brother.", "I have won brother.", "I have wun brother."]
                answer: "I have one brother."
                option_audio: false
                hints: ["The word is a number."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Fill the gap: Dad made _ cakes."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "Dad made _ cakes."
                options: ["two", "to", "too"]
                answer: ["two"]
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Fill the gap: My shoes are _ small."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "My shoes are _ small."
                options: ["too", "to", "two"]
                answer: ["too"]
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Fill the gap: I can _ a rainbow."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "I can _ a rainbow."
                options: ["see", "sea"]
                answer: ["see"]
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? \"It is quite cold today.\""
                say: "Read the sentence. Is the right word used?"
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Fill the gap: My coat is _."
                say: "Read the sentence. Which spelling fits the gap?"
                frame: "My coat is _."
                options: ["blue", "blew"]
                answer: ["blue"]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Fill the gap: The boys packed _ bags."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "The boys packed _ bags."
            options: ["their", "there", "they're"]
            answer: ["their"]
            option_audio: false
          - id: l2-c2
            type: fill_in_blank
            text: "Fill the gap: Sam is coming _."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "Sam is coming _."
            options: ["too", "to", "two"]
            answer: ["too"]
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "Fill the gap: I can _ a dog barking."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "I can _ a dog barking."
            options: ["hear", "here"]
            answer: ["hear"]
            option_audio: false
          - id: l2-c4
            type: fill_in_blank
            text: "Fill the gap: Let's walk _ the shop."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "Let's walk _ the shop."
            options: ["to", "too", "two"]
            answer: ["to"]
            option_audio: false
          - id: l2-c5
            type: fill_in_blank
            text: "Fill the gap: Look! _ my friends."
            say: "Read the sentence. Which spelling fits the gap?"
            frame: "Look! _ my friends."
            options: ["They're", "There", "Their"]
            answer: ["They're"]
            option_audio: false
