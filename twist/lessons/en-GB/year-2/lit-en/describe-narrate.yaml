# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.describe-narrate
skill: lit-en.speaking.describe-narrate
curriculum: en-GB
language: en
title:
  de: Beschreiben, erklären und erzählen
  en: Describing, explaining and telling stories
summary: >
  Children learn to speak so a listener can follow them. Lesson 1
  describes things clearly: say what it is first, then add details about
  how it looks, sounds or feels; lesson 2 tells a story or explains how to
  do something in order with time words (first, next, then, finally) and
  gives reasons with because, and ends with the skill check. Speaking
  tasks are practised and checked by the child against a model. The skill
  check marks what a screen can mark: choosing clear details, putting a
  description, a story or an explanation in order, time words and reasons
  with because. Speaking itself is left to Practise, since speech is not
  marked.
metadata:
  year: year-2
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.speaking.full-sentences]
  also_practises: [lit-en.speaking.full-sentences]
  vocabulary: { en: [describe, explain, retell, detail, describing word, first, next, then, finally, because, listener] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: describe-details, what: { de: "Einzelheiten wählen, mit denen sich der Zuhörer etwas vorstellen kann", en: "choosing details that help a listener picture something" } }
    - { id: describe-order, what: { de: "beim Beschreiben erst sagen, was es ist, dann die Einzelheiten", en: "describing in order: what it is first, then the details" } }
    - { id: story-order, what: { de: "eine Geschichte der Reihe nach erzählen, mit Zeitwörtern (first, next, finally)", en: "telling a story in order with time words (first, next, finally)" } }
    - { id: explain-why, what: { de: "Schritte der Reihe nach erklären und mit because begründen", en: "explaining steps in order and giving reasons with because" } }
  misconceptions:
    - id: vague-description
      what: Describes with words that tell the listener nothing (it is nice, it is a thing)
      addressed: Lesson 1 Learn screen 3; feedback in l1-f1; l1-s1, l1-n1, l2-c1
    - id: details-first
      what: Starts with small details before saying what the thing is, so the listener is lost
      addressed: Lesson 1 Learn screens 1 and 2 say name it first; l1-f3, l1-s3, l1-n3
    - id: and-then-chain
      what: Tells a story as one long chain of and then without order words
      addressed: Lesson 2 Learn screens 1 and 2; feedback in l2-f2; l2-f1, l2-s1, l2-n1, l2-c3
    - id: explain-without-reason
      what: Explains what happens but not why
      addressed: Lesson 2 Learn screen 4; l2-f4, l2-s4, l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Klar beschreiben, en: Describing clearly }
    goal:
      de: "Beschreib etwas so, dass man es sich vorstellen kann. Sag zuerst, was es ist, dann Einzelheiten wie weich und flauschig."
      en: "Describe something so others can picture it. Say what it is first, then add details like soft and fluffy."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is a full sentence?"
            say: "Read them yourself. Which one is a full sentence?"
            options: ["I like apples because they are sweet.", "apples sweet", "because sweet"]
            answer: "I like apples because they are sweet."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: speak
            text: "Say a full sentence about what you did yesterday."
            say: "Tell me about something you did yesterday, in a full sentence. Then listen to an example."
            expected_text: "Yesterday I played in the park with my brother."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "It is a dog."
            say: "Your friend cannot see this picture. You want to tell them about it. What do you think: what should you say first? Have a guess."
            show: { object: dog }
          - text: "It is a dog. It is small and brown. It has floppy ears and a waggy tail."
            say: "Say what it is first! When you describe something, say what it is first. Then add details, one at a time, so the listener can picture it."
            show: { object: dog }
          - text: "It is nice. → It is soft and fluffy."
            say: "Nice does not tell the listener much. Choose words that say how it looks, sounds or feels: soft, fluffy, shiny, loud."
          - text: "looks   sounds   feels   smells"
            say: "Use your senses to find details. What does it look like? What does it sound like? How does it feel?"
          - text: "Did you know? A catfish tastes with its skin."
            say: "Did you know? A catfish has taste buds all over its body, not just in its mouth. So it can taste its food with its skin before it even takes a bite!"
            show: { object: fish }
          - text: "Speak clearly. Look at your listener."
            say: "Speak clearly, not too fast, and look at the person you are talking to."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which description helps the listener picture a cake?"
                say: "Read them yourself. Which description helps the listener picture a cake?"
                options: ["It is a big chocolate cake with pink icing.", "It is nice.", "It is a thing you eat."]
                answer: "It is a big chocolate cake with pink icing."
                option_audio: false
                feedback:
                  "It is nice.": "Nice does not tell the listener what the cake looks like. Add details."
                  "It is a thing you eat.": "A thing you eat? That could be a cake, or a sprout! Details help the listener picture the cake."
                hints:
                  - "Which one tells you what the cake looks like?"
                  - "Look for describing words: big, chocolate, pink."
                  - "It is a big chocolate cake with pink icing."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "It is an animal. It is tall and spotty. It has a very long neck. What is it?"
                say: "Listen to the description. Which animal is it? It is an animal. It is tall and spotty. It has a very long neck."
                options: [{ object: giraffe }, { object: zebra }, { object: elephant }]
                answer: giraffe
                hints:
                  - "Listen for the details."
                  - "Which animal has a very long neck?"
                  - "the giraffe"
              - id: l1-f3
                type: ordering
                text: "Put the description in order."
                say: "Put the sentences in order. Say what it is first, then add details."
                options: ["It has a red roof.", "It is a house.", "It has a green door too."]
                slot_count: 3
                answer: ["It is a house.", "It has a red roof.", "It has a green door too."]
                option_audio: false
                hints:
                  - "Which sentence tells the listener what it is?"
                  - "Say what it is first."
                  - "It is a house. It has a red roof. It has a green door too."
              - id: l1-f4
                type: speak
                text: "Describe the teddy. Say what it is, then two details."
                say: "Look at the teddy. Say what it is, then two details about how it looks or feels. Then listen to an example."
                show: { object: teddy }
                expected_text: "It is a teddy bear. It is brown and soft, and it has a red bow."
                hints:
                  - "Start with: It is a teddy."
                  - "How does it feel? What colour is it?"
                  - "It is a teddy bear. It is brown and soft."
              - id: l1-f5
                type: sorting
                text: "Details about a fire engine: looks or sounds?"
                say: "Read each detail about a fire engine. Is it how it looks or how it sounds?"
                option_audio: false
                bins:
                  - { id: looks, show: { object: eye }, say: "Looks." }
                  - { id: sounds, show: { object: ear }, say: "Sounds." }
                options:
                  - { text: "bright red", bin: looks }
                  - { text: "a loud siren", bin: sounds }
                  - { text: "a long ladder", bin: looks }
                  - { text: "a honking horn", bin: sounds }
                hints:
                  - "Can you see it or hear it?"
                  - "Red and a ladder you see. A siren and a horn you hear."
                  - "red, ladder: looks; siren, horn: sounds."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which description helps the listener picture the bird?"
                say: "Read them yourself. Which description helps the listener picture the bird?"
                show: { object: bird }
                options: ["It is a small, round, blue bird.", "It is good.", "It is a bird."]
                answer: "It is a small, round, blue bird."
                option_audio: false
                hints: ["Which one has the most details?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "It is a fruit. It is long and yellow. You peel it. What is it?"
                say: "Listen to the description. Which fruit is it? It is a fruit. It is long and yellow. You peel it."
                options: [{ object: banana }, { object: pear }, { object: orange }]
                answer: banana
                hints: ["Which fruit is long and yellow?"]
              - id: l1-s3
                type: ordering
                text: "Put the description in order."
                say: "Put the sentences in order. Say what it is first, then add details."
                options: ["It has four wheels.", "It is a car.", "Its wheels are black and shiny."]
                slot_count: 3
                answer: ["It is a car.", "It has four wheels.", "Its wheels are black and shiny."]
                option_audio: false
                hints: ["Say what it is first."]
              - id: l1-s4
                type: speak
                text: "Describe the snowman. Say what it is, then two details."
                say: "Look at the snowman. Say what it is, then two details. Then listen to an example."
                show: { object: snowman }
                expected_text: "It is a snowman. It has a carrot nose and a red scarf."
                hints: ["Start with: It is a snowman. Then say what it has."]
              - id: l1-s5
                type: true_false
                text: "Is it true? \"It is nice\" tells the listener a lot."
                answer: false
                hints: ["Can you picture something from nice?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which description helps the listener picture a shoe?"
                say: "Read them yourself. Which description helps the listener picture a shoe?"
                options: ["It is a shiny black shoe with a buckle.", "It is a shoe.", "It is OK."]
                answer: "It is a shiny black shoe with a buckle."
                option_audio: false
              - id: l1-n2
                type: image_multiple_choice
                text: "It lives in the sea. It is very big. It sprays water out of its head. What is it?"
                say: "Listen to the description. What is it? It lives in the sea. It is very big. It sprays water out of its head."
                options: [{ object: whale }, { object: fish }, { object: octopus }]
                answer: whale
              - id: l1-n3
                type: ordering
                text: "Put the description in order."
                say: "Put the sentences in order. Say what it is first, then add details."
                options: ["Its hands go round and round.", "It is a clock.", "It has two hands."]
                slot_count: 3
                answer: ["It is a clock.", "It has two hands.", "Its hands go round and round."]
                option_audio: false
              - id: l1-n4
                type: speak
                text: "Describe the kite. Say what it is, then two details."
                say: "Look at the kite. Describe it so a friend could picture it. Then listen to an example."
                show: { object: kite }
                expected_text: "It is a kite. It is red and yellow, and it has a long wavy tail."
              - id: l1-n5
                type: sorting
                text: "Details about a hedgehog: looks or feels?"
                say: "Read each detail about a hedgehog. Is it how it looks or how it feels?"
                option_audio: false
                bins:
                  - { id: looks, show: { object: eye }, say: "Looks." }
                  - { id: feels, show: { object: hand }, say: "Feels." }
                options:
                  - { text: "brown", bin: looks }
                  - { text: "prickly", bin: feels }
                  - { text: "small black eyes", bin: looks }
                  - { text: "a soft tummy", bin: feels }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which description helps the listener picture a ball?"
            say: "Read them yourself. Which description helps the listener picture a ball?"
            options: ["It is a big, bouncy, striped ball.", "It is a toy.", "It is fun."]
            answer: "It is a big, bouncy, striped ball."
            option_audio: false
          - id: l1-c2
            type: image_multiple_choice
            text: "It is an animal. It is green. It jumps and says ribbit. What is it?"
            say: "Listen to the description. Which animal is it? It is an animal. It is green. It jumps and says ribbit."
            options: [{ object: frog }, { object: snake }, { object: crocodile }]
            answer: frog
          - id: l1-c3
            type: ordering
            text: "Put the description in order."
            say: "Put the sentences in order. Say what it is first, then add details."
            options: ["It has a long tail.", "It is a monkey.", "It can hang by its tail too."]
            slot_count: 3
            answer: ["It is a monkey.", "It has a long tail.", "It can hang by its tail too."]
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Which detail tells the listener how the soup smells?"
            say: "Read them yourself. Which detail tells the listener how the soup smells?"
            options: ["It is in a bowl.", "It smells of tomatoes.", "It is nice."]
            answer: "It smells of tomatoes."
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? When you describe something, say what it is before you give the details."
            say: "Is it true? When you describe something, say what it is before you give the details."
            answer: true
          - id: l1-c6
            type: image_multiple_choice
            text: "It is a bird. It is awake at night. It has big round eyes and says twit-twoo. What is it?"
            say: "Listen to the description. Which bird is it? It is a bird. It is awake at night. It has big round eyes and says twit-twoo."
            options: [{ object: duck }, { object: hen }, { object: owl }]
            answer: owl

  - n: 2
    title: { de: Der Reihe nach erzählen und erklären, en: Telling and explaining in order }
    goal:
      de: "Erzähl eine Geschichte oder erklär, wie man etwas macht, der Reihe nach, mit first, next, then und finally."
      en: "Tell a story or explain how to do something in order, using first, next, then and finally."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which description helps the listener picture a jumper?"
            say: "Read them yourself. Which description helps the listener picture a jumper?"
            options: ["It is a warm, woolly jumper with stripes.", "It is nice.", "It is something to wear."]
            answer: "It is a warm, woolly jumper with stripes."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Put the description in order."
            say: "Put the sentences in order. Say what it is first, then add details."
            options: ["It has a soft seat.", "It is a sofa.", "The seat is big enough for three people."]
            slot_count: 3
            answer: ["It is a sofa.", "It has a soft seat.", "The seat is big enough for three people."]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The Little Red Hen"
            say: "You are going to tell the story of the Little Red Hen to a friend. What do you think: what helps your friend follow the story? Have a guess."
            show: { object: hen }
          - text: "First, the Little Red Hen found some wheat.\nNext, she planted it.\nThen, she made bread.\nFinally, she ate it all up."
            say: "Tell it in order! Time words help the listener: first, next, then, finally. They are better than and then, and then, and then."
          - text: "Beginning: who and where\nMiddle: what goes wrong\nEnd: how it is sorted out"
            say: "A good story has a beginning, a middle and an end. Say who it is about and where, then the problem, then how it ends."
          - text: "First, put on your wellies, because it is muddy."
            say: "When you explain how to do something, give the steps in order. Say why with because, so the listener understands."
          - text: "first   next   then   after that   finally"
            say: "These are time words. Use them to tie your sentences together."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Put the story of Goldilocks in order."
                say: "Tell the story of Goldilocks in order. Put the sentences in the slots."
                options: ["Then she fell asleep in a bed.", "First, Goldilocks went into the bears' house.", "Next, she ate some porridge."]
                slot_count: 3
                answer: ["First, Goldilocks went into the bears' house.", "Next, she ate some porridge.", "Then she fell asleep in a bed."]
                option_audio: false
                hints:
                  - "Look at the time words."
                  - "First goes first. Next and then come after it."
                  - "First she went in, next she ate porridge, then she fell asleep."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which retelling is easier to follow?"
                say: "Read them yourself. Which one is easier for a listener to follow?"
                options: ["First, we went to the zoo. Next, we saw the lions. Finally, we had ice cream.", "We went to the zoo and then we saw the lions and then we had ice cream and then.", "Ice cream, lions, zoo."]
                answer: "First, we went to the zoo. Next, we saw the lions. Finally, we had ice cream."
                option_audio: false
                feedback:
                  "We went to the zoo and then we saw the lions and then we had ice cream and then.": "Lots of and then is hard to follow. Time words like first, next and finally help."
                hints:
                  - "Which one uses time words?"
                  - "Look for first, next and finally."
                  - "First, we went to the zoo. Next, we saw the lions. Finally, we had ice cream."
              - id: l2-f3
                type: fill_in_blank
                text: "This is the last thing that happened. Which time word fits?\n_, we washed the car."
                say: "This is the last thing that happened. Which time word fits?"
                frame: "_, we washed the car."
                options: ["Finally", "First", "Next"]
                answer: ["Finally"]
                hints:
                  - "Is it the start or the end?"
                  - "It is the last thing. Which word means at the end?"
                  - "Finally"
              - id: l2-f4
                type: multiple_choice
                text: "Which explanation says why?"
                say: "Read them yourself. Which explanation gives a reason?"
                options: ["Wear a hat because the sun is hot.", "Wear a hat.", "A hat is on my head."]
                answer: "Wear a hat because the sun is hot."
                option_audio: false
                hints:
                  - "A reason tells you why."
                  - "Look for the word because."
                  - "Wear a hat because the sun is hot."
              - id: l2-f5
                type: speak
                text: "Tell how you get ready for school. Use first, next and finally."
                say: "Tell me how you get ready for school. Use first, next and finally. Then listen to an example."
                expected_text: "First, I get dressed. Next, I eat my breakfast. Finally, I put on my coat and go to school."
                hints:
                  - "What do you do when you wake up?"
                  - "Start with: First, I get dressed."
                  - "First, I get dressed. Next, I eat breakfast. Finally, I put on my coat."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Put the story of the Three Little Pigs in order."
                say: "Tell the story of the Three Little Pigs in order."
                options: ["Finally, the wolf ran away.", "First, the pigs built three houses.", "Then the wolf blew two houses down."]
                slot_count: 3
                answer: ["First, the pigs built three houses.", "Then the wolf blew two houses down.", "Finally, the wolf ran away."]
                option_audio: false
                hints: ["Use the time words."]
              - id: l2-s2
                type: matching
                text: "Match each part of the story with what it tells."
                say: "Read each part of a story plan. Match it with what it tells the listener."
                pairs:
                  - { left: { text: "beginning" }, right: { text: "who and where" } }
                  - { left: { text: "middle" }, right: { text: "what goes wrong" } }
                  - { left: { text: "end" }, right: { text: "how it is sorted out" } }
                hints: ["The problem comes in the middle."]
              - id: l2-s3
                type: fill_in_blank
                text: "This is the very first thing that happened. Which time word fits?\n_, I opened the box."
                say: "This is the very first thing that happened. Which time word fits?"
                frame: "_, I opened the box."
                options: ["First", "Finally", "Then"]
                answer: ["First"]
                hints: ["It is the start."]
              - id: l2-s4
                type: multiple_choice
                text: "Which explanation says why?"
                say: "Read them yourself. Which explanation gives a reason?"
                options: ["Water the plant because it needs a drink.", "Water the plant.", "The plant is green."]
                answer: "Water the plant because it needs a drink."
                option_audio: false
                hints: ["Look for because."]
              - id: l2-s5
                type: speak
                text: "Retell a story you know. Use first, then and finally."
                say: "Choose a story you know, like Jack and the Beanstalk. Tell it in three parts with first, then and finally. Then listen to an example."
                expected_text: "First, Jack swapped his cow for magic beans. Then a giant beanstalk grew and he climbed it. Finally, he ran home and chopped it down."
                hints: ["Who is in it? What goes wrong? How does it end?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Put the steps for making a cup of squash in order."
                say: "Explain how to make a cup of squash. Put the steps in order."
                options: ["Then add cold water.", "First, pour some squash in a cup.", "Finally, stir it and drink it."]
                slot_count: 3
                answer: ["First, pour some squash in a cup.", "Then add cold water.", "Finally, stir it and drink it."]
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Which time word joins the two parts of the story?\nWe had lunch. _, we went to the park."
                say: "Which time word joins the two parts of the story?"
                frame: "We had lunch. _, we went to the park."
                options: ["After that", "First", "Once upon a time"]
                answer: ["After that"]
              - id: l2-n3
                type: multiple_choice
                text: "Which retelling is easier to follow?"
                say: "Read them yourself. Which one is easier for a listener to follow?"
                options: ["First, I lost my tooth. Then I put it under my pillow. Finally, I found a coin.", "Coin, pillow, tooth.", "I lost my tooth and then and then I found a coin and then."]
                answer: "First, I lost my tooth. Then I put it under my pillow. Finally, I found a coin."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? \"Shut the door because it is cold.\" gives a reason."
                answer: true
              - id: l2-n5
                type: speak
                text: "Explain how to brush your teeth. Use time words and because."
                say: "Explain to a friend how to brush their teeth. Use time words, and say why with because. Then listen to an example."
                expected_text: "First, put toothpaste on your brush. Next, brush all your teeth for two minutes, because that keeps them clean. Finally, rinse your mouth."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: describe-details
            type: multiple_choice
            text: "Which description helps the listener picture an umbrella?"
            say: "Read them yourself. Which description helps the listener picture an umbrella?"
            options: ["It is a big yellow umbrella with white spots.", "It is good.", "It is a thing for rain."]
            answer: "It is a big yellow umbrella with white spots."
            option_audio: false
          - id: l2-c2
            part: describe-details
            type: image_multiple_choice
            text: "It is a vegetable. It is long and orange. Rabbits like to eat it. What is it?"
            say: "Listen to the description. What is it? It is a vegetable. It is long and orange. Rabbits like to eat it."
            options: [{ object: carrot }, { object: orange }, { object: tomato }]
            answer: carrot
          - id: l2-c3
            part: story-order
            type: ordering
            text: "Put the story of Little Red Riding Hood in order."
            say: "Tell the story of Little Red Riding Hood in order."
            options: ["Next, she met a wolf in the woods.", "Finally, the woodcutter saved her.", "First, she set off to visit Grandma."]
            slot_count: 3
            answer: ["First, she set off to visit Grandma.", "Next, she met a wolf in the woods.", "Finally, the woodcutter saved her."]
            option_audio: false
          - id: l2-c4
            part: story-order
            type: true_false
            text: "Is it true? The time word finally tells the listener that this is the last part."
            say: "Is it true? The time word finally tells the listener that this is the last part."
            answer: true
          - id: l2-c5
            part: explain-why
            type: multiple_choice
            text: "Which explanation says why?"
            say: "Read them yourself. Which explanation gives a reason?"
            options: ["Hold the rail because the stairs are steep.", "Hold the rail.", "The stairs are in the hall."]
            answer: "Hold the rail because the stairs are steep."
            option_audio: false
          - id: l2-c6
            part: describe-details
            type: sorting
            text: "Details about a cat: sounds or feels?"
            say: "Read each detail about a cat. Is it how it sounds or how it feels? Sort them."
            option_audio: false
            bins:
              - { id: sounds, show: { object: ear }, say: "Sounds." }
