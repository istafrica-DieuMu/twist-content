# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.noun-phrases
skill: lit-en.grammar.noun-phrases
curriculum: en-GB
language: en
title:
  de: Erweiterte Nominalgruppen
  en: Expanded noun phrases
summary: >
  An expanded noun phrase adds words to a noun to describe it or to say
  exactly which one: the butterfly becomes the blue butterfly. Lesson 1
  adds one adjective to a noun and finds the noun and the adjective in a
  phrase. Lesson 2 adds two adjectives (the tall, thin giraffe) or a few
  words after the noun (the man in the moon, the dog with a spotty
  collar), uses phrases to pick out one thing from several, and ends
  with the skill check.
metadata:
  year: year-2
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.grammar.sentences-and]
  also_practises: [lit-en.grammar.word-classes]
  vocabulary: { en: [noun, adjective, noun phrase, expanded noun phrase, describe, comma] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: adjective-after-noun
      what: Puts the adjective after the noun (the butterfly blue)
      addressed: Learn screen 2 of lesson 1; l1-f3 and l1-s4 put the words in order, with feedback in l1-f2
    - id: noun-adjective-swap
      what: Takes the adjective for the noun (says blue is the noun in the blue butterfly)
      addressed: l1-f1, l1-s2 and l1-n2 tap the noun or the adjective in a phrase
    - id: vague-adjective
      what: Uses vague adjectives (nice, good) that do not help a reader see or pick out the thing
      addressed: Learn screen 3 of lesson 1 and screen 3 of lesson 2; l1-f4, l2-f4 and l2-s4 choose the phrase that says more, with feedback in l2-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Ein Adjektiv vor dem Nomen, en: An adjective before the noun }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Join the two sentences."
            say: "I have a cat. I have a dog. Which word joins them into one sentence?"
            frame: "I have a cat _ a dog."
            options: ["and", "the", "is"]
            answer: ["and"]
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "I like milk and I like juice."
            say: "Read the sentence. Has it been joined with and?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "the butterfly\nthe blue butterfly"
            say: "Butterfly is a noun, a naming word. Blue is an adjective: it describes the noun. The blue butterfly is an expanded noun phrase. Adding the adjective tells you more."
            show: { object: butterfly }
          - text: "the blue butterfly"
            say: "In English the adjective comes before the noun: the blue butterfly, not the butterfly blue."
          - text: "a nice dog\na fluffy dog"
            say: "Choose adjectives that help the reader see the thing. Nice does not tell you much. Fluffy helps you picture the dog."
            show: { object: dog }
          - text: "a cold drink   a muddy shoe   a tiny ant"
            say: "Every one of these is an expanded noun phrase: a word like a or the, an adjective, and a noun."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the adjective."
                say: "Read the noun phrase. Tap the adjective, the describing word."
                show: { drawn: letter-card, text: "the hungry crocodile" }
                spans: ["hungry"]
                hints:
                  - "The noun is the thing: crocodile."
                  - "Which word tells you what the crocodile is like?"
                  - "Hungry."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which is the right way to say it?"
                options: ["the red apple", "the apple red", "red the apple"]
                answer: "the red apple"
                option_audio: false
                feedback:
                  "the apple red": "In English the adjective goes before the noun: the red apple."
                hints:
                  - "Where does the adjective go?"
                  - "Adjective first, then the noun."
                  - "the red apple."
              - id: l1-f3
                type: ordering
                text: "Put the words in order to make a noun phrase."
                options: ["snail", "the", "slow"]
                slot_count: 3
                answer: ["the", "slow", "snail"]
                option_audio: false
                hints:
                  - "Start with the."
                  - "The adjective comes before the noun."
                  - "the slow snail."
              - id: l1-f4
                type: multiple_choice
                text: "Which noun phrase helps you picture the giraffe best?"
                options: ["a tall giraffe", "a nice giraffe", "a giraffe"]
                answer: "a tall giraffe"
                option_audio: false
                hints:
                  - "Which adjective tells you what the giraffe looks like?"
                  - "Nice does not help you see it."
                  - "a tall giraffe."
              - id: l1-f5
                type: fill_in_blank
                text: "Add an adjective."
                say: "Choose an adjective to describe the ice cream."
                show: { object: ice-cream }
                frame: "a _ ice cream"
                options: ["cold", "run", "under"]
                answer: ["cold"]
                hints:
                  - "Which word describes a thing?"
                  - "Run is a verb. Under is not a describing word."
                  - "cold."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "the spiky hedgehog"
                say: "Read the noun phrase. Tap the picture it describes."
                options: [{ object: hedgehog }, { object: rabbit }, { object: snail }]
                answer: hedgehog
                hints: ["Find the noun at the end."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tap the noun."
                say: "Read the noun phrase. Tap the noun, the naming word."
                show: { drawn: letter-card, text: "a muddy boot" }
                spans: ["boot"]
                hints: ["Muddy describes it. What is muddy?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Add an adjective."
                say: "Choose an adjective to describe the snow."
                show: { object: snow }
                frame: "the _ snow"
                options: ["white", "jump", "and"]
                answer: ["white"]
                hints: ["Which word tells you what the snow is like?"]
              - id: l1-s4
                type: ordering
                text: "Put the words in order to make a noun phrase."
                options: ["box", "a", "heavy"]
                slot_count: 3
                answer: ["a", "heavy", "box"]
                option_audio: false
                hints: ["a, then the adjective, then the noun."]
              - id: l1-s5
                type: true_false
                text: "In the phrase \"the small mouse\", the adjective is small."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Which word describes the mouse?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the adjective."
                say: "Read the noun phrase. Tap the adjective."
                show: { drawn: letter-card, text: "the sleepy baby" }
                spans: ["sleepy"]
              - id: l1-n2
                type: true_false
                text: "In the phrase \"a shiny star\", the noun is shiny."
                say: "Read it. Is it true?"
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Which is the right way to say it?"
                options: ["the boat big", "the big boat", "big boat the"]
                answer: "the big boat"
                option_audio: false
              - id: l1-n4
                type: image_multiple_choice
                text: "the stripy zebra"
                say: "Read the noun phrase. Tap the picture it describes."
                options: [{ object: giraffe }, { object: zebra }, { object: lion }]
                answer: zebra
              - id: l1-n5
                type: fill_in_blank
                text: "Add an adjective."
                say: "Choose an adjective to describe the lemon."
                frame: "a _ lemon"
                options: ["sour", "eat", "slowly"]
                answer: ["sour"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the noun."
            say: "Read the noun phrase. Tap the noun."
            show: { drawn: letter-card, text: "the noisy duck" }
            spans: ["duck"]
          - id: l1-c2
            type: ordering
            text: "Put the words in order to make a noun phrase."
            options: ["cup", "the", "empty"]
            slot_count: 3
            answer: ["the", "empty", "cup"]
            option_audio: false
          - id: l1-c3
            type: fill_in_blank
            text: "Add an adjective."
            say: "Choose an adjective to describe the sun."
            frame: "the _ sun"
            options: ["hot", "swim", "on"]
            answer: ["hot"]

  - n: 2
    title: { de: "Mehr Wörter, mehr Genauigkeit", en: "More words to say which one" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the adjective."
            say: "Read the noun phrase. Tap the adjective."
            show: { drawn: letter-card, text: "the fluffy cat" }
            spans: ["fluffy"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is the right way to say it?"
            options: ["the green frog", "the frog green"]
            answer: "the green frog"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "the tall, thin giraffe"
            say: "You can use two adjectives. Put a comma between them: the tall, thin giraffe. Now the reader can picture it even better."
            show: { object: giraffe }
          - text: "the man in the moon\nthe dog with a spotty collar"
            say: "You can also add words after the noun. The man in the moon. The dog with a spotty collar. These words tell you more about the noun too."
          - text: "Which cake? the chocolate cake with a cherry on top"
            say: "Noun phrases can say exactly which one you mean. If there are three cakes, the chocolate cake with a cherry on top tells your friend which one to pick."
            show: { object: cake }
          - text: "a good bike\na shiny, red bike with a bell"
            say: "Which phrase helps you see the bike? Good tells you nothing about how it looks. Shiny, red and with a bell help you see it."
            show: { object: bike }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap both adjectives."
                say: "Read the noun phrase. Tap both adjectives."
                show: { drawn: letter-card, text: "the long, scaly crocodile" }
                spans: ["long,", "scaly"]
                hints:
                  - "The noun is crocodile."
                  - "Which two words tell you what it is like?"
                  - "long and scaly."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Add the comma."
                say: "Two adjectives need a comma between them. Where does it go?"
                frame: "the big_ grey elephant"
                options: [",", ".", "?"]
                answer: [","]
                option_audio: false
                hints:
                  - "Big and grey are both adjectives."
                  - "A comma goes between two adjectives."
                  - "the big, grey elephant."
              - id: l2-f3
                type: image_multiple_choice
                text: "It is a small animal with a hard shell on its back. Which is it?"
                say: "Read it. Tap the animal it describes."
                options: [{ object: snail }, { object: mouse }, { object: frog }]
                answer: snail
                hints:
                  - "Read the words after animal."
                  - "Which one carries a shell?"
                  - "The snail."
              - id: l2-f4
                type: multiple_choice
                text: "Which noun phrase helps you picture the dog best?"
                options: ["a small, brown dog with floppy ears", "a nice dog", "a good, nice dog"]
                answer: "a small, brown dog with floppy ears"
                option_audio: false
                feedback:
                  "a good, nice dog": "Good and nice are adjectives, but they do not show what the dog looks like."
                hints:
                  - "Which words help you see the dog?"
                  - "Good and nice do not tell you how it looks."
                  - "a small, brown dog with floppy ears."
              - id: l2-f5
                type: ordering
                text: "Put the words in order to make a noun phrase."
                options: ["with", "the", "a red hat", "girl"]
                slot_count: 4
                answer: ["the", "girl", "with", "a red hat"]
                option_audio: false
                hints:
                  - "Start with the and the noun."
                  - "With a red hat comes after the noun."
                  - "the girl with a red hat."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap both adjectives."
                say: "Read the noun phrase. Tap both adjectives."
                show: { drawn: letter-card, text: "a cold, wet day" }
                spans: ["cold,", "wet"]
                hints: ["The noun is day."]
              - id: l2-s2
                type: image_multiple_choice
                text: "It is a big, grey animal with a long trunk. Which is it?"
                say: "Read it. Tap the animal it describes."
                options: [{ object: elephant }, { object: giraffe }, { object: lion }]
                answer: elephant
                hints: ["Which animal has a trunk?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Finish the noun phrase."
                say: "Which word finishes the noun phrase?"
                frame: "the man in the _"
                options: ["moon", "run", "happy"]
                answer: ["moon"]
                hints: ["After in the comes a noun."]
              - id: l2-s4
                type: multiple_choice
                text: "Three hats are on the table. Which noun phrase tells your friend exactly which hat you want?"
                options: ["the woolly hat with a bobble", "a hat", "the nice hat"]
                answer: "the woolly hat with a bobble"
                option_audio: false
                hints: ["Which one could only mean one hat?"]
              - id: l2-s5
                type: true_false
                text: "\"The bird with a yellow beak\" is an expanded noun phrase."
                say: "Read it. Is it true?"
                answer: true
                hints: ["It has a noun and words that tell you more about it."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Add the comma."
                say: "Two adjectives need a comma between them. Where does it go?"
                frame: "a soft_ warm blanket"
                options: [",", ".", "!"]
                answer: [","]
                option_audio: false
              - id: l2-n2
                type: image_multiple_choice
                text: "It is a plant with pink petals and a yellow centre. Which is it?"
                say: "Read it. Tap the picture it describes."
                options: [{ object: flower }, { object: tree }, { object: leaf }]
                answer: flower
              - id: l2-n3
                type: ordering
                text: "Put the words in order to make a noun phrase."
                options: ["the", "with", "boy", "a kite"]
                slot_count: 4
                answer: ["the", "boy", "with", "a kite"]
                option_audio: false
              - id: l2-n4
                type: highlight_in_text
                text: "Tap the noun phrase."
                say: "Read the sentence. Tap every word of the expanded noun phrase."
                show: { drawn: letter-card, text: "I saw a fat, ginger cat." }
                spans: ["a", "fat,", "ginger", "cat."]
              - id: l2-n5
                type: multiple_choice
                text: "Which noun phrase says the most about the house?"
                options: ["a tiny, crooked house with a red door", "a house", "a lovely house"]
                answer: "a tiny, crooked house with a red door"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tap the adjective."
            say: "Read the noun phrase. Tap the adjective."
            show: { drawn: letter-card, text: "the wet umbrella" }
            spans: ["wet"]
          - id: l2-c2
            type: multiple_choice
            text: "Which is the right way to say it?"
            options: ["the purple balloon", "the balloon purple", "balloon the purple"]
            answer: "the purple balloon"
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "Add the comma."
            say: "Two adjectives need a comma between them. Where does it go?"
            frame: "the bright_ golden sun"
            options: [",", ".", "?"]
            answer: [","]
            option_audio: false
          - id: l2-c4
            type: image_multiple_choice
            text: "It is a small animal with long ears and a fluffy tail. Which is it?"
            say: "Read it. Tap the animal it describes."
            options: [{ object: rabbit }, { object: mouse }, { object: frog }]
            answer: rabbit
          - id: l2-c5
            type: multiple_choice
            text: "Which noun phrase helps you picture the coat best?"
            options: ["a long, red coat with big buttons", "a nice coat", "a coat"]
            answer: "a long, red coat with big buttons"
            option_audio: false
