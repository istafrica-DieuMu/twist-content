# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.write-poems
skill: lit-en.composition.poetry
curriculum: en-GB
language: en
title:
  de: Einfache Gedichte schreiben
  en: Writing simple poems
summary: >
  Children build simple poems from choices they make line by line.
  Lesson 1 writes rhyming couplets: finding words that rhyme, finishing a
  line with a rhyme that also makes sense, and putting lines in order;
  lesson 2 writes a senses poem and an acrostic, choosing describing words
  that paint a picture and a repeated line, and ends with the skill
  check. Writing a whole poem freely waits for a free-writing task type.
metadata:
  year: year-2
  topic: { de: Texte schreiben, en: Writing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.texts.poems-by-heart]
  also_practises: [lit-en.phonological.rhymes]
  vocabulary: { en: [poem, line, rhyme, rhyming pair, verse, acrostic, senses, describing word, repeat] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: rhyme-not-sense
      what: Picks any rhyming word even when the line no longer makes sense
      addressed: Lesson 1 Learn screen 2; feedback in l1-f3; l1-s3, l1-n3, l2-c1
    - id: same-letters-rhyme
      what: Thinks words rhyme because they start the same (cat, cake)
      addressed: Lesson 1 Learn screen 1 says rhymes sound the same at the end; feedback in l1-f1; l1-s1, l1-n1
    - id: poem-must-rhyme
      what: Thinks every poem has to rhyme
      addressed: Lesson 2 Learn screen 1; l2-f5, l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Reimpaare, en: Rhyming couplets }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Fill the gap: Twinkle, twinkle, little _"
            say: "Say the rhyme you know. Twinkle, twinkle, little ... Which word comes next?"
            frame: "Twinkle, twinkle, little _"
            options: ["star", "moon", "sun"]
            answer: ["star"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How should you say a poem out loud?"
            say: "How should you say a poem out loud?"
            options: ["clearly, with feeling", "as fast as you can", "in a whisper so no one hears"]
            answer: "clearly, with feeling"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "cat   hat   mat"
            say: "Words rhyme when they sound the same at the end. Cat, hat, mat all end in at. Cat and cake start the same, but they do not rhyme."
            show: { objects: [cat, hat] }
          - text: "I saw a frog\nsit on a log."
            say: "Two lines that rhyme make a couplet. The last words rhyme: frog, log. The rhyme must make sense too. A frog can sit on a log."
            show: { object: frog }
          - text: "1. Choose your idea.\n2. Write the first line.\n3. Find a rhyme for its last word.\n4. Make the second line end with it."
            say: "Here is how to write a couplet. Choose an idea. Write a first line. Think of words that rhyme with its last word. Pick one that makes sense, and end the second line with it."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which word rhymes with goat?"
                say: "Which picture rhymes with goat?"
                show: { object: goat }
                options: [{ object: boat }, { object: girl }, { object: duck }]
                answer: boat
                feedback:
                  girl: "Girl starts like goat, but it does not end the same. Rhymes sound the same at the end."
                hints:
                  - "Say goat. Listen to the end."
                  - "Goat ends in oat. Which one ends in oat too?"
                  - "boat"
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Do they rhyme? bee, tree"
                say: "Listen: bee, tree. Do they rhyme?"
                show: { objects: [bee, tree] }
                answer: true
                hints:
                  - "Say both words. Listen to the end."
                  - "Bee ends in ee. Tree ends in ee."
                  - "Yes, they rhyme."
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap:\nThe moon is bright,\nit shines all _."
                say: "Read the couplet. Which word rhymes and makes sense?"
                frame: "The moon is bright, it shines all _."
                options: ["night", "kite", "day"]
                answer: ["night"]
                feedback:
                  "kite": "Kite rhymes, but the moon does not shine all kite. The rhyme must make sense."
                hints:
                  - "It must rhyme with bright."
                  - "Night and kite both rhyme. Which one makes sense?"
                  - "night"
              - id: l1-f4
                type: ordering
                text: "Put the couplet in order."
                say: "Put the two lines in order to make a couplet."
                options: ["and stayed in bed.", "I bumped my head"]
                slot_count: 2
                answer: ["I bumped my head", "and stayed in bed."]
                option_audio: false
                hints:
                  - "Which line has the capital letter?"
                  - "The first line starts with a capital letter."
                  - "I bumped my head, and stayed in bed."
              - id: l1-f5
                type: matching
                text: "Match the rhyming pairs."
                say: "Tap a picture, then the picture that rhymes with it."
                pairs:
                  - { left: { object: star }, right: { object: car } }
                  - { left: { object: snake }, right: { object: cake } }
                  - { left: { object: bell }, right: { object: shell } }
                hints:
                  - "Say each word. Listen to the end."
                  - "Star ends in ar. Snake ends in ake."
                  - "star and car, snake and cake, bell and shell."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which word rhymes with moon?"
                say: "Which picture rhymes with moon?"
                show: { object: moon }
                options: [{ object: spoon }, { object: mouse }, { object: sun }]
                answer: spoon
                hints: ["Moon ends in oon."]
              - id: l1-s2
                type: true_false
                text: "Do they rhyme? cat, car"
                say: "Listen: cat, car. Do they rhyme?"
                show: { objects: [cat, car] }
                answer: false
                hints: ["Listen to the end of each word."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill the gap:\nMy dog likes to run,\nand play in the _."
                say: "Read the couplet. Which word rhymes and makes sense?"
                frame: "My dog likes to run, and play in the _."
                options: ["sun", "bun", "park"]
                answer: ["sun"]
                hints: ["Sun and bun rhyme. Which one can a dog play in?"]
              - id: l1-s4
                type: ordering
                text: "Put the couplet in order."
                say: "Put the two lines in order to make a couplet."
                options: ["jumped over a cat.", "A big brown rat"]
                slot_count: 2
                answer: ["A big brown rat", "jumped over a cat."]
                option_audio: false
                hints: ["The first line starts with a capital letter."]
              - id: l1-s5
                type: multiple_choice
                text: "Which line rhymes with \"I found a shell\"?"
                say: "Read the lines yourself. Which one rhymes with I found a shell?"
                options: ["and heard a bell.", "on the sand.", "by the sea."]
                answer: "and heard a bell."
                option_audio: false
                hints: ["Listen for ell at the end."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Which word rhymes with house?"
                say: "Which picture rhymes with house?"
                show: { object: house }
                options: [{ object: mouse }, { object: hat }, { object: hand }]
                answer: mouse
              - id: l1-n2
                type: true_false
                text: "Do they rhyme? fox, box"
                say: "Listen: fox, box. Do they rhyme?"
                show: { objects: [fox, box] }
                answer: true
              - id: l1-n3
                type: fill_in_blank
                text: "Fill the gap:\nI made a cake,\nfor my friend _."
                say: "Read the couplet. Which name rhymes and makes sense?"
                frame: "I made a cake, for my friend _."
                options: ["Jake", "snake", "Tom"]
                answer: ["Jake"]
              - id: l1-n4
                type: multiple_choice
                text: "Which line rhymes with \"Up in the tree\"?"
                say: "Read the lines yourself. Which one rhymes with up in the tree?"
                options: ["I saw a bee.", "I saw a bird.", "I saw a nest."]
                answer: "I saw a bee."
                option_audio: false
              - id: l1-n5
                type: matching
                text: "Match the rhyming pairs."
                say: "Tap a picture, then the picture that rhymes with it."
                pairs:
                  - { left: { object: frog }, right: { object: dog } }
                  - { left: { object: bed }, right: { object: bread } }
                  - { left: { object: clock }, right: { object: sock } }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which word rhymes with cake?"
            say: "Which picture rhymes with cake?"
            show: { object: cake }
            options: [{ object: snake }, { object: cat }, { object: kite }]
            answer: snake
          - id: l1-c2
            type: fill_in_blank
            text: "Fill the gap:\nThe wind did blow,\nit moved the _."
            say: "Read the couplet. Which word rhymes and makes sense?"
            frame: "The wind did blow, it moved the _."
            options: ["snow", "toe", "rain"]
            answer: ["snow"]
          - id: l1-c3
            type: true_false
            text: "Do they rhyme? pig, pen"
            say: "Listen: pig, pen. Do they rhyme?"
            answer: false

  - n: 2
    title: { de: Sinnesgedichte und Akrostichon, en: Senses poems and acrostics }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Which word rhymes with boat?"
            say: "Which picture rhymes with boat?"
            show: { object: boat }
            options: [{ object: goat }, { object: bus }, { object: ball }]
            answer: goat
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Fill the gap:\nI like to sing,\nand dance in a _."
            say: "Read the couplet. Which word rhymes and makes sense?"
            frame: "I like to sing, and dance in a _."
            options: ["ring", "king", "row"]
            answer: ["ring"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "At the seaside\nI can see blue waves crashing.\nI can hear seagulls calling.\nI can smell salty air.\nAt the seaside."
            say: "Not every poem rhymes. This is a senses poem. Each line says what I see, hear or smell. The line I can repeats, and the first line comes back at the end."
          - text: "the sea → the blue, crashing sea"
            say: "Poets choose describing words that paint a picture. The sea is fine. The blue, crashing sea helps you see and hear it."
          - text: "S  Shining in the sky\nU  Up so high\nN  Now it is warm"
            say: "In an acrostic poem, the first letters of the lines spell a word down the side. Here they spell sun. Each line says something about the sun."
            show: { object: sun }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which line paints the best picture?"
                say: "Read the lines yourself. Which one helps you see it best?"
                options: ["I can see a fluffy, white cloud.", "I can see a cloud.", "I can see a thing."]
                answer: "I can see a fluffy, white cloud."
                option_audio: false
                hints:
                  - "Which line has describing words?"
                  - "Fluffy and white tell you what the cloud looks like."
                  - "I can see a fluffy, white cloud."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Which sense is it?"
                say: "Read each line from a poem about a bonfire. Is it something you see or something you hear?"
                option_audio: false
                bins:
                  - { id: see, show: { object: eye }, say: "See." }
                  - { id: hear, show: { object: ear }, say: "Hear." }
                options:
                  - { text: "orange flames", bin: see }
                  - { text: "crackling sticks", bin: hear }
                  - { text: "grey smoke", bin: see }
                  - { text: "people cheering", bin: hear }
                hints:
                  - "Is it a colour or a sound?"
                  - "Orange and grey are colours. Crackling and cheering are sounds."
                  - "flames and smoke: see; sticks and cheering: hear."
              - id: l2-f3
                type: fill_in_blank
                text: "Fill the gap: an acrostic for CAT\nC  Curled up on my bed\nA  _\nT  Tail around her head"
                say: "The second line must start with the letter A. Which line fits?"
                frame: "A  _"
                options: ["Asleep and warm", "Sleeping and warm", "Happy and warm"]
                answer: ["Asleep and warm"]
                option_audio: false
                hints:
                  - "Look down the side: C, A, T."
                  - "The second line must start with A."
                  - "Asleep and warm"
              - id: l2-f4
                type: multiple_choice
                text: "Which describing words fit a poem about snow?"
                say: "Read them yourself. Which words describe snow best?"
                options: ["soft, white, cold", "hot, red, loud", "fast, furry, wet"]
                answer: "soft, white, cold"
                option_audio: false
                hints:
                  - "Think about what snow looks and feels like."
                  - "Snow is not hot or red."
                  - "soft, white, cold"
              - id: l2-f5
                type: true_false
                text: "Is it true? Every poem has to rhyme."
                answer: false
                hints:
                  - "Think of the seaside poem."
                  - "Did its lines rhyme?"
                  - "No. Some poems rhyme and some do not."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which line paints the best picture?"
                say: "Read the lines yourself. Which one helps you see it best?"
                options: ["I can see a tiny, spotty ladybird.", "I can see a bug.", "I can see it."]
                answer: "I can see a tiny, spotty ladybird."
                option_audio: false
                hints: ["Look for describing words."]
              - id: l2-s2
                type: sorting
                text: "Which sense is it?"
                say: "Read each line from a poem about the kitchen. Is it something you smell or something you hear?"
                option_audio: false
                bins:
                  - { id: smell, show: { object: nose }, say: "Smell." }
                  - { id: hear, show: { object: ear }, say: "Hear." }
                options:
                  - { text: "fresh bread", bin: smell }
                  - { text: "a ticking clock", bin: hear }
                  - { text: "sweet strawberry jam", bin: smell }
                  - { text: "a sizzling pan", bin: hear }
                hints: ["Can you smell it or hear it?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Fill the gap: an acrostic for DOG\nD  Digs in the mud\nO  Out in the rain\nG  _"
                say: "The last line must start with the letter G. Which line fits?"
                frame: "G  _"
                options: ["Gets a bath again", "Bath time again", "Then a bath again"]
                answer: ["Gets a bath again"]
                option_audio: false
                hints: ["Look at the letter down the side."]
              - id: l2-s4
                type: multiple_choice
                text: "Which line would repeat well in a poem about the rain?"
                say: "Read them yourself. Which line could come back again and again in a rain poem?"
                options: ["Pitter, patter, goes the rain.", "My name is Ruby.", "I had toast for breakfast."]
                answer: "Pitter, patter, goes the rain."
                option_audio: false
                hints: ["The line must be about the rain."]
              - id: l2-s5
                type: ordering
                text: "Put the senses poem in order."
                say: "Put the lines in order: the title line first, then see, then hear, then the title line again."
                options: ["I can hear owls hooting.", "In the woods", "I can see tall trees.", "In the woods."]
                slot_count: 4
                answer: ["In the woods", "I can see tall trees.", "I can hear owls hooting.", "In the woods."]
                option_audio: false
                hints: ["See comes before hear. The poem ends with a full stop."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which line paints the best picture?"
                say: "Read the lines yourself. Which one helps you see it best?"
                options: ["I can see a tall, spotty giraffe.", "I can see an animal.", "I can see a giraffe."]
                answer: "I can see a tall, spotty giraffe."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Fill the gap: an acrostic for BEE\nB  _\nE  Every flower\nE  Explored"
                say: "The first line must start with the letter B. Which line fits?"
                frame: "B  _"
                options: ["Buzzing by", "Flying by", "Zooming by"]
                answer: ["Buzzing by"]
                option_audio: false
              - id: l2-n3
                type: sorting
                text: "Which sense is it?"
                say: "Read each line from a poem about the park. Is it something you see or something you hear?"
                option_audio: false
                bins:
                  - { id: see, show: { object: eye }, say: "See." }
                  - { id: hear, show: { object: ear }, say: "Hear." }
                options:
                  - { text: "green grass", bin: see }
                  - { text: "dogs barking", bin: hear }
                  - { text: "a red kite", bin: see }
                  - { text: "children laughing", bin: hear }
              - id: l2-n4
                type: multiple_choice
                text: "Which describing words fit a poem about fire?"
                say: "Read them yourself. Which words describe fire best?"
                options: ["hot, bright, crackling", "cold, quiet, blue", "soft, wet, furry"]
                answer: "hot, bright, crackling"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? In an acrostic, the first letters of the lines spell a word."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Fill the gap:\nI saw a whale,\nit flapped its _."
            say: "Read the couplet. Which word rhymes and makes sense?"
            frame: "I saw a whale, it flapped its _."
            options: ["tail", "nail", "fin"]
            answer: ["tail"]
          - id: l2-c2
            type: image_multiple_choice
            text: "Which word rhymes with clock?"
            say: "Which picture rhymes with clock?"
            show: { object: clock }
            options: [{ object: sock }, { object: cloud }, { object: cup }]
            answer: sock
          - id: l2-c3
            type: fill_in_blank
            text: "Fill the gap: an acrostic for PIG\nP  Pink and round\nI  _\nG  Grunting loudly"
            say: "The second line must start with the letter I. Which line fits?"
            frame: "I  _"
            options: ["In the mud", "Mud all over", "Rolling in mud"]
            answer: ["In the mud"]
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which line paints the best picture?"
            say: "Read the lines yourself. Which one helps you see it best?"
            options: ["I can see a big, golden pumpkin.", "I can see a pumpkin.", "I can see something."]
            answer: "I can see a big, golden pumpkin."
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Which is true about poems?"
            say: "Read them yourself. Which one is true?"
            options: ["Some poems rhyme and some do not.", "Every poem must rhyme.", "A poem cannot repeat a line."]
            answer: "Some poems rhyme and some do not."
            option_audio: false
