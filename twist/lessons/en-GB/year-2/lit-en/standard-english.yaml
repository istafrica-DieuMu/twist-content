# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.standard-english
skill: lit-en.grammar.standard-english
curriculum: en-GB
language: en
title:
  de: Geschriebenes Standardenglisch
  en: Writing in Standard English
summary: >
  People speak in many different ways, and in writing we use Standard
  English. Lesson 1 takes was and were (I was, we were, they were) and is
  and are; lesson 2 takes forms children often say at home that change in
  writing (I did, not I done; I saw, not I seen; those books, not them
  books; she doesn't, not she don't) and ends with the skill check.
  Spoken ways are never called wrong, only not the written standard.
metadata:
  year: year-2
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.grammar.tense-progressive]
  also_practises: [lit-en.grammar.tense-progressive]
  vocabulary: { en: [Standard English, written, spoken, was, were, is, are, verb] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: was-were, what: { de: "was und were richtig verwenden (we were, nicht we was)", en: "using was and were (we were, not we was)" } }
    - { id: is-are, what: { de: "is für eins, are für mehrere", en: "is for one, are for more than one" } }
    - { id: did-saw, what: { de: "I did und I saw schreiben, nicht I done oder I seen", en: "writing I did and I saw, not I done or I seen" } }
    - { id: other-forms, what: { de: "those, doesn't und any schreiben (nicht them, don't, no)", en: "writing those, doesn't and any (not them, don't, no)" } }
  misconceptions:
    - id: we-was
      what: Writes was with we, you and they (we was, they was)
      addressed: Lesson 1 Learn screens 1 and 2; feedback in l1-f1; l1-s1, l1-n1, l2-c1
    - id: one-or-many
      what: Uses is with more than one (the dogs is barking)
      addressed: Lesson 1 Learn screen 3; l1-f4, l1-s4, l1-n4
    - id: done-seen
      what: Writes I done or I seen in place of I did or I saw
      addressed: Lesson 2 Learn screen 1; feedback in l2-f1; l2-s1, l2-n2, l2-c3
    - id: spoken-is-wrong
      what: Thinks the way their family speaks is wrong
      addressed: Learn screen 1 of lesson 1 says spoken English can be different and that writing uses Standard English
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "was und were, is und are", en: "was and were, is and are" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Fill the gap: Yesterday I _ to school."
            say: "Read the sentence. Which word fits the gap?"
            frame: "Yesterday I _ to school."
            options: ["walked", "walk", "walking"]
            answer: ["walked"]
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Fill the gap: Right now she is _."
            say: "Read the sentence. Which word fits the gap?"
            frame: "Right now she is _."
            options: ["singing", "sing", "sang"]
            answer: ["singing"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "We was late.\nWe were late."
            say: "People speak in lots of different ways, and that is fine. When we write, we use Standard English. Some people say we was late. In writing, we write we were late."
          - text: "I was   he was   she was   it was\nwe were   you were   they were"
            say: "Was goes with I, he, she and it: one person or thing. Were goes with we, you and they."
            show: { drawn: letter-card, text: "we were" }
          - text: "The dog is barking.\nThe dogs are barking."
            say: "It works the same way for now: one dog is barking, two dogs are barking. Is for one, are for more than one."
          - text: "Read it in your head. Does it sound like a book?"
            say: "When you check your writing, read it in your head. Does it sound like a sentence in a book?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Fill the gap: We _ at the beach all day."
                say: "Read the sentence. Which word is Standard English?"
                frame: "We _ at the beach all day."
                options: ["were", "was"]
                answer: ["were"]
                feedback:
                  "was": "Some people say we was. In writing we use we were."
                hints:
                  - "Who is it about? We."
                  - "Was goes with I, he, she and it. Were goes with we, you and they."
                  - "were"
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fill the gap: She _ very kind to me."
                say: "Read the sentence. Which word is Standard English?"
                frame: "She _ very kind to me."
                options: ["was", "were"]
                answer: ["was"]
                hints:
                  - "Who is it about? She, one person."
                  - "Was goes with he, she and it."
                  - "was"
              - id: l1-f3
                type: multiple_choice
                text: "Which sentence is in Standard English?"
                say: "Read the sentences yourself. Which one is Standard English?"
                options: ["They were playing outside.", "They was playing outside."]
                answer: "They were playing outside."
                option_audio: false
                hints:
                  - "Look at the word after they."
                  - "They goes with were."
                  - "They were playing outside."
              - id: l1-f4
                type: fill_in_blank
                text: "Fill the gap: The birds _ singing."
                say: "Read the sentence. Which word is Standard English?"
                frame: "The birds _ singing."
                options: ["are", "is"]
                answer: ["are"]
                hints:
                  - "Is it one bird or more than one?"
                  - "Birds is more than one. Is goes with one, are with more."
                  - "are"
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the word that is not Standard English."
                say: "One word in this sentence is not Standard English. Tap it."
                show: { drawn: letter-card, text: "You was the best runner." }
                spans: ["was"]
                hints:
                  - "Look at the word after You."
                  - "You goes with were."
                  - "was should be were."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Fill the gap: They _ hungry after the walk."
                say: "Read the sentence. Which word is Standard English?"
                frame: "They _ hungry after the walk."
                options: ["were", "was"]
                answer: ["were"]
                hints: ["They goes with were."]
              - id: l1-s2
                type: true_false
                text: "Is it true? \"I was tired.\" is Standard English."
                answer: true
                hints: ["Was goes with I."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the word that is not Standard English."
                say: "One word in this sentence is not Standard English. Tap it."
                show: { drawn: letter-card, text: "We was going to the shops." }
                spans: ["was"]
                hints: ["Which word goes with we?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Fill the gap: My sisters _ at home."
                say: "Read the sentence. Which word is Standard English?"
                frame: "My sisters _ at home."
                options: ["are", "is"]
                answer: ["are"]
                hints: ["More than one sister."]
              - id: l1-s5
                type: multiple_choice
                text: "Which sentence is in Standard English?"
                say: "Read the sentences yourself. Which one is Standard English?"
                options: ["It was a sunny day.", "It were a sunny day."]
                answer: "It was a sunny day."
                option_audio: false
                hints: ["It goes with was."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Fill the gap: You _ right about the rain."
                say: "Read the sentence. Which word is Standard English?"
                frame: "You _ right about the rain."
                options: ["were", "was"]
                answer: ["were"]
              - id: l1-n2
                type: fill_in_blank
                text: "Fill the gap: Dad _ in the garden."
                say: "Read the sentence. Which word is Standard English?"
                frame: "Dad _ in the garden."
                options: ["was", "were"]
                answer: ["was"]
              - id: l1-n3
                type: true_false
                text: "Is it true? \"They was laughing.\" is Standard English."
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Fill the gap: The cake _ in the oven."
                say: "Read the sentence. Which word is Standard English?"
                frame: "The cake _ in the oven."
                options: ["is", "are"]
                answer: ["is"]
              - id: l1-n5
                type: sorting
                text: "Sort the sentences."
                say: "Read each sentence. Is it Standard English or not?"
                option_audio: false
                bins:
                  - { id: standard, show: { text: "Standard English" }, say: "Standard English." }
                  - { id: not, show: { text: "not Standard English" }, say: "Not Standard English." }
                options:
                  - { text: "We were cold.", bin: standard }
                  - { text: "We was cold.", bin: not }
                  - { text: "He was cold.", bin: standard }
                  - { text: "The cats is cold.", bin: not }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Fill the gap: We _ the winners!"
            say: "Read the sentence. Which word is Standard English?"
            frame: "We _ the winners!"
            options: ["were", "was"]
            answer: ["were"]
          - id: l1-c2
            type: fill_in_blank
            text: "Fill the gap: The puppies _ asleep."
            say: "Read the sentence. Which word is Standard English?"
            frame: "The puppies _ asleep."
            options: ["are", "is"]
            answer: ["are"]
          - id: l1-c3
            type: true_false
            text: "Is it true? \"She were reading.\" is Standard English."
            answer: false
          - id: l1-c4
            type: highlight_in_text
            text: "Tap the word that is not Standard English."
            say: "One word in this sentence is not Standard English. Tap it."
            show: { drawn: letter-card, text: "The apples is ripe." }
            spans: ["is"]
          - id: l1-c5
            type: multiple_choice
            text: "Which sentence is in Standard English?"
            say: "Read the sentences yourself. Which one is Standard English?"
            options: ["He were happy.", "He was happy."]
            answer: "He was happy."
            option_audio: false
          - id: l1-c6
            type: fill_in_blank
            text: "Fill the gap: My book _ on the table."
            say: "Read the sentence. Which word is Standard English?"
            frame: "My book _ on the table."
            options: ["are", "is"]
            answer: ["is"]

  - n: 2
    title: { de: "did, saw, those, doesn't", en: "did, saw, those, doesn't" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Fill the gap: They _ at the park."
            say: "Read the sentence. Which word is Standard English?"
            frame: "They _ at the park."
            options: ["were", "was"]
            answer: ["were"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Fill the gap: The trees _ tall."
            say: "Read the sentence. Which word is Standard English?"
            frame: "The trees _ tall."
            options: ["are", "is"]
            answer: ["are"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I done my homework. → I did my homework.\nI seen a fox. → I saw a fox."
            say: "Some people say I done it or I seen it. In writing, use I did and I saw. Done and seen need a helper word: I have done it, I have seen it."
          - text: "them books → those books"
            say: "Some people say them books. In writing, use those books."
          - text: "she don't → she doesn't\nhe don't → he doesn't"
            say: "With he, she and it, write doesn't: she doesn't like peas. With I, you, we and they, write don't: we don't like peas."
          - text: "I haven't got any sweets."
            say: "Some people say I haven't got no sweets. In writing, use only one no word: I haven't got any sweets."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Fill the gap: I _ a hedgehog in the garden."
                say: "Read the sentence. Which word is Standard English?"
                frame: "I _ a hedgehog in the garden."
                options: ["saw", "seen"]
                answer: ["saw"]
                feedback:
                  "seen": "Seen needs a helper: I have seen. On its own, write I saw."
                hints:
                  - "Is there a helper word like have before the gap?"
                  - "No helper word, so use saw."
                  - "saw"
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Fill the gap: Can I have _ pencils?"
                say: "Read the sentence. Which word is Standard English?"
                frame: "Can I have _ pencils?"
                options: ["those", "them"]
                answer: ["those"]
                hints:
                  - "The word points at some pencils."
                  - "In writing, we say those pencils."
                  - "those"
              - id: l2-f3
                type: fill_in_blank
                text: "Fill the gap: My brother _ like cheese."
                say: "Read the sentence. Which word is Standard English?"
                frame: "My brother _ like cheese."
                options: ["doesn't", "don't"]
                answer: ["doesn't"]
                hints:
                  - "My brother is one person: he."
                  - "With he, she and it, write doesn't."
                  - "doesn't"
              - id: l2-f4
                type: multiple_choice
                text: "Which sentence is in Standard English?"
                say: "Read the sentences yourself. Which one is Standard English?"
                options: ["We did a puppet show.", "We done a puppet show."]
                answer: "We did a puppet show."
                option_audio: false
                hints:
                  - "Is there a helper word before the verb?"
                  - "No helper, so use did."
                  - "We did a puppet show."
              - id: l2-f5
                type: highlight_in_text
                text: "Tap the word that is not Standard English."
                say: "One word in this sentence is not Standard English. Tap it."
                show: { drawn: letter-card, text: "I haven't got no pens." }
                spans: ["no"]
                hints:
                  - "Look for two no words."
                  - "Haven't already says no."
                  - "no should be any."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Fill the gap: Jack _ his best in the race."
                say: "Read the sentence. Which word is Standard English?"
                frame: "Jack _ his best in the race."
                options: ["did", "done"]
                answer: ["did"]
                hints: ["No helper word before the gap."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap the word that is not Standard English."
                say: "One word in this sentence is not Standard English. Tap it."
                show: { drawn: letter-card, text: "Look at them shoes!" }
                spans: ["them"]
                hints: ["Which word points at the shoes?"]
              - id: l2-s3
                type: true_false
                text: "Is it true? \"It doesn't matter.\" is Standard English."
                answer: true
                hints: ["It goes with doesn't."]
              - id: l2-s4
                type: fill_in_blank
                text: "Fill the gap: We _ want to go home yet."
                say: "Read the sentence. Which word is Standard English?"
                frame: "We _ want to go home yet."
                options: ["don't", "doesn't"]
                answer: ["don't"]
                hints: ["We goes with don't."]
              - id: l2-s5
                type: multiple_choice
                text: "Which sentence is in Standard English?"
                say: "Read the sentences yourself. Which one is Standard English?"
                options: ["There isn't any milk.", "There isn't no milk."]
                answer: "There isn't any milk."
                option_audio: false
                hints: ["Use only one no word."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Fill the gap: Have you _ my hat?"
                say: "Read the sentence. Which word is Standard English?"
                frame: "Have you _ my hat?"
                options: ["seen", "saw"]
                answer: ["seen"]
              - id: l2-n2
                type: fill_in_blank
                text: "Fill the gap: Yesterday we _ a big lorry."
                say: "Read the sentence. Which word is Standard English?"
                frame: "Yesterday we _ a big lorry."
                options: ["saw", "seen"]
                answer: ["saw"]
              - id: l2-n3
                type: fill_in_blank
                text: "Fill the gap: Mum _ drink coffee."
                say: "Read the sentence. Which word is Standard English?"
                frame: "Mum _ drink coffee."
                options: ["doesn't", "don't"]
                answer: ["doesn't"]
              - id: l2-n4
                type: true_false
                text: "Is it true? \"Pass me them cups.\" is Standard English."
                answer: false
              - id: l2-n5
                type: sorting
                text: "Sort the sentences."
                say: "Read each sentence. Is it Standard English or not?"
                option_audio: false
                bins:
                  - { id: standard, show: { text: "Standard English" }, say: "Standard English." }
                  - { id: not, show: { text: "not Standard English" }, say: "Not Standard English." }
                options:
                  - { text: "I did it.", bin: standard }
                  - { text: "I seen it.", bin: not }
                  - { text: "She doesn't know.", bin: standard }
                  - { text: "He don't know.", bin: not }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: was-were
            type: fill_in_blank
            text: "Fill the gap: You _ the first to finish."
            say: "Read the sentence. Which word is Standard English?"
            frame: "You _ the first to finish."
            options: ["were", "was"]
            answer: ["were"]
          - id: l2-c2
            part: is-are
            type: fill_in_blank
            text: "Fill the gap: The children _ in the hall."
            say: "Read the sentence. Which word is Standard English?"
            frame: "The children _ in the hall."
            options: ["are", "is"]
            answer: ["are"]
          - id: l2-c3
            part: did-saw
            type: multiple_choice
            text: "Which sentence is in Standard English?"
            say: "Read the sentences yourself. Which one is Standard English?"
            options: ["I saw a rainbow.", "I seen a rainbow."]
            answer: "I saw a rainbow."
            option_audio: false
          - id: l2-c4
            part: other-forms
            type: highlight_in_text
            text: "Tap the word that is not Standard English."
            say: "One word in this sentence is not Standard English. Tap it."
            show: { drawn: letter-card, text: "My cat don't like baths." }
            spans: ["don't"]
          - id: l2-c5
            part: other-forms
            type: fill_in_blank
            text: "Fill the gap: Did you see _ ducks?"
            say: "Read the sentence. Which word is Standard English?"
            frame: "Did you see _ ducks?"
            options: ["those", "them"]
            answer: ["those"]
          - id: l2-c6
            part: was-were
            type: fill_in_blank
            text: "Fill the gaps: I _ cold, but my friends _ warm."
            say: "Read the sentence. Which words are Standard English?"
            frame: "I _ cold, but my friends _ warm."
            options: ["was", "were"]
            answer: ["was", "were"]
          - id: l2-c7
            part: was-were
            type: sorting
            text: "Was or were: is it Standard English? Sort the sentences."
            say: "Read each sentence yourself. Look at was or were. Is it Standard English or not?"
            option_audio: false
            bins:
              - { id: standard, show: { text: "Standard English" }, say: "Standard English." }
              - { id: not, show: { text: "not Standard English" }, say: "Not Standard English." }
            options:
              - { text: "The twins was asleep.", bin: not }
              - { text: "Ella was asleep.", bin: standard }
              - { text: "I were asleep.", bin: not }
              - { text: "You were asleep.", bin: standard }
          - id: l2-c8
            part: was-were
            type: highlight_in_text
            text: "Tap the word that is not Standard English."
            say: "One word in this sentence is not Standard English. Tap it."
            show: { drawn: letter-card, text: "My mum and dad was very proud of me." }
            spans: ["was"]
            difficulty: stretch
          - id: l2-c9
            part: was-were
            type: true_false
            text: "Is it true? \"Were you at the party?\" is Standard English."
            answer: true
          - id: l2-c10
            part: is-are
            type: fill_in_blank
            text: "Fill the gap: The flowers in the pot _ red."
            say: "Read the sentence. Which word is Standard English?"
            frame: "The flowers in the pot _ red."
            options: ["is", "are"]
            answer: ["are"]
            difficulty: stretch
          - id: l2-c11
            part: is-are
            type: highlight_in_text
            text: "Tap the word that is not Standard English."
            say: "One word in this sentence is not Standard English. Tap it."
            show: { drawn: letter-card, text: "Look, the ducks is swimming." }
            spans: ["is"]
          - id: l2-c12
            part: is-are
            type: true_false
            text: "Is it true? \"My shoes is muddy.\" is Standard English."
            answer: false
          - id: l2-c13
            part: is-are
            type: fill_in_blank
            text: "Fill the gaps: One cat _ black and two cats _ white."
            say: "Read the sentence. Which words are Standard English?"
            frame: "One cat _ black and two cats _ white."
            options: ["are", "is"]
            answer: ["is", "are"]
          - id: l2-c14
            part: did-saw
            type: fill_in_blank
            text: "Fill the gaps: I have _ that film. I _ it last week."
            say: "Read the sentences. Which words are Standard English?"
            frame: "I have _ that film. I _ it last week."
            options: ["saw", "seen"]
            answer: ["seen", "saw"]
            difficulty: stretch
          - id: l2-c15
            part: did-saw
            type: highlight_in_text
            text: "Tap the word that is not Standard English."
            say: "One word in this sentence is not Standard English. Tap it."
            show: { drawn: letter-card, text: "Gran seen us at the bus stop." }
            spans: ["seen"]
          - id: l2-c16
            part: did-saw
            type: true_false
            text: "Is it true? \"Who done this?\" is Standard English."
            answer: false
          - id: l2-c17
            part: did-saw
            type: multiple_choice
            text: "Liam said: \"I done a painting of my dog.\"\nHow do we write it in Standard English?"
            say: "Read what Liam said. How do we write it in Standard English? Read them yourself."
            options: ["I doed a painting of my dog.", "I did a painting of my dog.", "I done a painting of my dog."]
            answer: "I did a painting of my dog."
            option_audio: false
          - id: l2-c18
            part: other-forms
            type: sorting
            text: "Is it written in Standard English? Sort the sentences."
            say: "Read each sentence yourself. Is it written in Standard English or not?"
            option_audio: false
            bins:
              - { id: standard, show: { text: "Standard English" }, say: "Standard English." }
              - { id: not, show: { text: "not Standard English" }, say: "Not Standard English." }
            options:
              - { text: "Them socks are mine.", bin: not }
              - { text: "Sam doesn't eat fish.", bin: standard }
              - { text: "Those socks are mine.", bin: standard }
              - { text: "Sam don't eat fish.", bin: not }
          - id: l2-c19
            part: other-forms
            type: fill_in_blank
            text: "Fill the gap: We haven't got _ bread."
            say: "Read the sentence. Which word is Standard English?"
            frame: "We haven't got _ bread."
            options: ["no", "any"]
            answer: ["any"]
          - id: l2-c20
            part: other-forms
            type: fill_in_blank
            text: "Fill the gaps: I _ like spiders, but my sister _ mind them."
            say: "Read the sentence. Which words are Standard English?"
            frame: "I _ like spiders, but my sister _ mind them."
            options: ["doesn't", "don't"]
            answer: ["don't", "doesn't"]
            difficulty: stretch
