# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.start-joining
skill: lit-en.handwriting.start-joining
curriculum: en-GB
language: en
title:
  de: Anfangen, Buchstaben zu verbinden
  en: Starting to join
summary: >
  Children start joining letters with the two joins of the National
  Curriculum. Lesson 1 takes the diagonal join: a letter that ends on the
  line joins up and across to the next one (in, an, um, and to a tall
  letter in il, ch, at). Lesson 2 takes the horizontal join: o, r, v and
  w end at the top, so the join runs across (on, wi, ol, wh); it names
  the letters best left unjoined (capitals), and ends with the skill
  check. Every writing-lines task uses `script: joined`, so the model
  follows the school's handwriting scheme, which is a setting; tasks
  teach only what holds in every scheme. The app does not yet check the
  child's own joins: any ink counts.
metadata:
  year: year-2
  topic: { de: Handschrift, en: Handwriting }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.handwriting.letter-families]
  also_practises: [lit-en.handwriting.size-spacing]
  vocabulary: { en: [join, diagonal join, horizontal join, unjoined, capital letter, line, top, tall letter] }
  forms: [drawn, text, audio]
  drawn: [writing-lines, letter-card]
  facets: [script]
  misconceptions:
    - id: join-from-top-always
      what: Joins every letter from the top, so a diagonal join from a or i comes out as a loop or a bump
      addressed: Learn of lesson 1 shows that letters ending on the line join with a diagonal; l1-f1, l1-f3 and l1-s2 ask where a letter ends, with feedback in l1-f1
    - id: o-diagonal
      what: Takes the join from o, r, v or w down to the line first, so on looks like a-n
      addressed: Learn of lesson 2 says these letters end at the top; l2-f1, l2-f2 and l2-s1 name the horizontal join, with feedback in l2-f2
    - id: join-capitals
      what: Joins a capital letter to the next letter
      addressed: Learn screen 4 of lesson 2; l2-f5, l2-s4 and l2-n4 ask which letters are left unjoined
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die schräge Verbindung, en: The diagonal join }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which letter is a curly caterpillar letter?"
            say: "Curly caterpillar letters start at the top and curl back. Which one is a curly caterpillar letter?"
            options: ["a", "l", "n"]
            answer: "a"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: tracing
            text: "Trace the n."
            say: "Trace the small n. Down, back up and over: a one-armed robot letter."
            show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }
            char: "n"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "a  i  u  d  e  n"
            say: "Look where these letters finish. They all finish on the line, at the bottom, with a little flick."
            show: { drawn: writing-lines, text: "a", mode: trace, arrows: true, script: joined }
          - text: "in   an   um"
            say: "A letter that finishes on the line joins with a diagonal join. The join goes from the line, up and across, to where the next letter starts. Watch: in."
            show: { drawn: writing-lines, text: "in", mode: trace, arrows: true, script: joined }
          - text: "il   ch   at"
            say: "The diagonal join also goes to a tall letter. It goes up higher, to the top of the tall letter. Watch: il."
            show: { drawn: writing-lines, text: "il", mode: trace, arrows: true, script: joined }
          - text: "Follow the model."
            say: "Your school has its own handwriting. The letters on the lines show it. Follow the model and do not lift your pencil inside a join."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Where does the letter a finish?"
                options: ["on the line", "at the top"]
                answer: "on the line"
                keep_order: true
                feedback:
                  "at the top": "a goes round and down, and finishes on the line with a flick. So it joins with a diagonal join."
                hints:
                  - "Trace a with your finger in the air."
                  - "Round, up, then down to the line."
                  - "On the line."
                difficulty: easy
              - id: l1-f2
                type: tracing
                text: "Trace the join."
                say: "Trace in. Write the i, then go up and across in a diagonal join to the n."
                show: { drawn: writing-lines, text: "in", mode: trace, arrows: true, script: joined }
                char: "in"
              - id: l1-f3
                type: multiple_choice
                text: "Which join takes u to the next letter?"
                say: "The letter u finishes on the line. Which join takes it to the next letter?"
                options: ["a diagonal join", "a horizontal join"]
                answer: "a diagonal join"
                keep_order: true
                hints:
                  - "Where does u finish?"
                  - "Letters that finish on the line go up and across."
                  - "A diagonal join."
              - id: l1-f4
                type: tracing
                text: "Trace the join."
                say: "Trace an. Write the a, then join up and across to the n."
                show: { drawn: writing-lines, text: "an", mode: trace, arrows: true, script: joined }
                char: "an"
              - id: l1-f5
                type: true_false
                text: "A join to a tall letter like l goes up higher than a join to n."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Where does a tall letter start?"
                  - "l starts at the top, n starts lower down."
                  - "Yes, it goes up higher."

          - support: some
            tasks:
              - id: l1-s1
                type: tracing
                text: "Trace the join."
                say: "Trace il. Write the i, then a diagonal join right up to the top of the l."
                show: { drawn: writing-lines, text: "il", mode: trace, arrows: true, script: joined }
                char: "il"
              - id: l1-s2
                type: highlight_in_text
                text: "Tap every letter that finishes on the line."
                say: "Tap every letter that finishes on the line, at the bottom."
                show: { drawn: letter-card, text: "a o i w d" }
                spans: ["a", "i", "d"]
                hints: ["o and w finish at the top."]
              - id: l1-s3
                type: tracing
                text: "Trace the word."
                say: "Trace the word cat. A diagonal join from c to a, and from a to t."
                show: { drawn: writing-lines, text: "cat", mode: trace, arrows: true, script: joined }
                char: "cat"
              - id: l1-s4
                type: true_false
                text: "You lift your pencil in the middle of a join."
                say: "Read it. Is it true?"
                answer: false
                hints: ["A join links two letters in one line."]
              - id: l1-s5
                type: tracing
                text: "Trace the join."
                say: "Trace ch. Write the c, then a diagonal join up to the top of the h."
                show: { drawn: writing-lines, text: "ch", mode: trace, arrows: true, script: joined }
                char: "ch"

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Copy the join."
                say: "Copy um. Write it beside the model with a diagonal join."
                show: { drawn: writing-lines, text: "um", mode: copy, arrows: false, script: joined }
                char: "um"
              - id: l1-n2
                type: multiple_choice
                text: "Where does the letter e finish?"
                options: ["on the line", "at the top"]
                answer: "on the line"
                keep_order: true
              - id: l1-n3
                type: tracing
                text: "Copy the word."
                say: "Copy the word hat, with diagonal joins."
                show: { drawn: writing-lines, text: "hat", mode: copy, arrows: false, script: joined }
                char: "hat"
              - id: l1-n4
                type: multiple_choice
                text: "Which join takes d to the next letter?"
                say: "The letter d finishes on the line. Which join takes it to the next letter?"
                options: ["a diagonal join", "a horizontal join"]
                answer: "a diagonal join"
                keep_order: true
              - id: l1-n5
                type: tracing
                text: "Copy the word."
                say: "Copy the word sun, with diagonal joins."
                show: { drawn: writing-lines, text: "sun", mode: copy, arrows: false, script: joined }
                char: "sun"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Where does the letter i finish?"
            options: ["on the line", "at the top"]
            answer: "on the line"
            keep_order: true
          - id: l1-c2
            type: true_false
            text: "A diagonal join goes up and across to the next letter."
            say: "Read it. Is it true?"
            answer: true
          - id: l1-c3
            type: tracing
            text: "Copy the word."
            say: "Copy the word lid, with diagonal joins."
            show: { drawn: writing-lines, text: "lid", mode: copy, arrows: false, script: joined }
            char: "lid"

  - n: 2
    title: { de: Die waagrechte Verbindung, en: The horizontal join }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: tracing
            text: "Trace the join."
            say: "Trace at, with a diagonal join from a up to the t."
            show: { drawn: writing-lines, text: "at", mode: trace, arrows: true, script: joined }
            char: "at"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which join takes n to the next letter?"
            say: "The letter n finishes on the line. Which join takes it to the next letter?"
            options: ["a diagonal join", "a horizontal join"]
            answer: "a diagonal join"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "o  r  v  w"
            say: "These four letters are different. They finish at the top, not on the line."
            show: { drawn: writing-lines, text: "o", mode: trace, arrows: true, script: joined }
          - text: "on   wi   ve"
            say: "A letter that finishes at the top joins with a horizontal join. The join goes straight across, like a washing line, to the next letter. Watch: on."
            show: { drawn: writing-lines, text: "on", mode: trace, arrows: true, script: joined }
          - text: "ol   wh"
            say: "A horizontal join to a tall letter goes across, then up to the top of the tall letter. Watch: ol."
            show: { drawn: writing-lines, text: "ol", mode: trace, arrows: true, script: joined }
          - text: "Tom   Asha"
            say: "Some letters are best left unjoined. Capital letters are not joined to the next letter. Write the capital, lift your pencil, then write the rest of the word close beside it. Your school may leave a few other letters unjoined too: follow the model."
            show: { drawn: writing-lines, text: "Tom", mode: trace, arrows: true, script: joined }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Where does the letter o finish?"
                options: ["on the line", "at the top"]
                answer: "at the top"
                keep_order: true
                hints:
                  - "Trace o with your finger in the air."
                  - "o goes all the way round, back to where it started."
                  - "At the top."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which join takes o to the n in on?"
                options: ["a diagonal join", "a horizontal join"]
                answer: "a horizontal join"
                keep_order: true
                feedback:
                  "a diagonal join": "A diagonal join starts on the line. o finishes at the top, so the join goes straight across."
                hints:
                  - "Where does o finish?"
                  - "From the top, the join goes across."
                  - "A horizontal join."
              - id: l2-f3
                type: tracing
                text: "Trace the join."
                say: "Trace on. Write the o, then go straight across to the n."
                show: { drawn: writing-lines, text: "on", mode: trace, arrows: true, script: joined }
                char: "on"
              - id: l2-f4
                type: tracing
                text: "Trace the join."
                say: "Trace wh. Write the w, go across, then up to the top of the h."
                show: { drawn: writing-lines, text: "wh", mode: trace, arrows: true, script: joined }
                char: "wh"
              - id: l2-f5
                type: true_false
                text: "In the name Tom, you join the capital T to the o."
                say: "Read it. Is it true?"
                answer: false
                hints:
                  - "Is T a capital letter?"
                  - "Capital letters are left unjoined."
                  - "No. Write T, lift, then write om close beside it."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap every letter that finishes at the top."
                say: "Tap every letter that finishes at the top. These letters use a horizontal join."
                show: { drawn: letter-card, text: "o a r c w v" }
                spans: ["o", "r", "w", "v"]
                hints: ["There are four of them."]
              - id: l2-s2
                type: tracing
                text: "Trace the join."
                say: "Trace wi. Write the w, then go straight across to the i."
                show: { drawn: writing-lines, text: "wi", mode: trace, arrows: true, script: joined }
                char: "wi"
              - id: l2-s3
                type: multiple_choice
                text: "Which join takes r to the next letter?"
                say: "The letter r finishes at the top. Which join takes it to the next letter?"
                options: ["a diagonal join", "a horizontal join"]
                answer: "a horizontal join"
                keep_order: true
                hints: ["From the top, the join goes across."]
              - id: l2-s4
                type: multiple_choice
                text: "Sam: which letter is best left unjoined?"
                say: "Look at the word Sam. Which letter is best left unjoined to the next one?"
                options: ["S", "a", "m"]
                answer: "S"
                option_audio: false
                hints: ["Look for the capital letter."]
              - id: l2-s5
                type: tracing
                text: "Trace the word."
                say: "Trace the word van. A horizontal join from v to a, then a diagonal join from a to n."
                show: { drawn: writing-lines, text: "van", mode: trace, arrows: true, script: joined }
                char: "van"

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Copy the join."
                say: "Copy ol, with a horizontal join that goes up to the top of the l."
                show: { drawn: writing-lines, text: "ol", mode: copy, arrows: false, script: joined }
                char: "ol"
              - id: l2-n2
                type: multiple_choice
                text: "Which join takes w to the next letter?"
                say: "The letter w finishes at the top. Which join takes it to the next letter?"
                options: ["a diagonal join", "a horizontal join"]
                answer: "a horizontal join"
                keep_order: true
              - id: l2-n3
                type: tracing
                text: "Copy the word."
                say: "Copy the word owl. Horizontal joins from o to w, and from w to l."
                show: { drawn: writing-lines, text: "owl", mode: copy, arrows: false, script: joined }
                char: "owl"
              - id: l2-n4
                type: true_false
                text: "Capital letters are best left unjoined."
                say: "Read it. Is it true?"
                answer: true
              - id: l2-n5
                type: tracing
                text: "Copy the name."
                say: "Copy the name Ben. Leave the capital B unjoined, then join e and n."
                show: { drawn: writing-lines, text: "Ben", mode: copy, arrows: false, script: joined }
                char: "Ben"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Where does the letter v finish?"
            options: ["on the line", "at the top"]
            answer: "at the top"
            keep_order: true
          - id: l2-c2
            type: multiple_choice
            text: "Which join takes the a to the n in man?"
            options: ["a diagonal join", "a horizontal join"]
            answer: "a diagonal join"
            keep_order: true
          - id: l2-c3
            type: multiple_choice
            text: "Which join takes the o to the p in top?"
            options: ["a diagonal join", "a horizontal join"]
            answer: "a horizontal join"
            keep_order: true
          - id: l2-c4
            type: multiple_choice
            text: "Kim: which letter is best left unjoined?"
            say: "Look at the name Kim. Which letter is best left unjoined to the next one?"
            options: ["K", "i", "m"]
            answer: "K"
            option_audio: false
          - id: l2-c5
            type: highlight_in_text
            text: "Tap every letter that finishes on the line."
            say: "Tap every letter that finishes on the line. These letters use a diagonal join."
            show: { drawn: letter-card, text: "r e o t w h" }
            spans: ["e", "t", "h"]
