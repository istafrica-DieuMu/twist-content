# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.suffixes-y2
skill: lit-en.word-reading.suffixes-y2
curriculum: en-GB
language: en
title:
  de: Wörter mit Endungen lesen
  en: Reading words with suffixes
summary: >
  A suffix is a word ending that changes the meaning: care, careful,
  careless. Lesson 1 takes -ful and -less (full of, without) and -ly (how
  something is done); lesson 2 takes -ment and -ness (they make naming
  words) and ends with the skill check. Children read the whole word by
  finding the root word first.
metadata:
  year: year-2
  topic: { de: Wörter lesen, en: Reading words }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.word-reading.endings]
  also_practises: [lit-en.word-reading.automatic-decoding]
  vocabulary: { en: [suffix, root word, ending, -ful, -less, -ly, -ment, -ness] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: ful-less, what: { de: "Wörter mit -ful und -less lesen und verstehen (voll von, ohne)", en: "reading and understanding words with -ful and -less (full of, without)" } }
    - { id: ly, what: { de: "Wörter mit -ly lesen (wie etwas geschieht)", en: "reading words with -ly (how something is done)" } }
    - { id: ment-ness, what: { de: "Wörter mit -ment und -ness als Nomen lesen", en: "reading words with -ment and -ness as naming words" } }
    - { id: root, what: { de: "in einem langen Wort das Stammwort und die Endungen finden", en: finding the root word and the suffixes in a long word } }
  misconceptions:
    - id: long-word-panic
      what: Gives up on a long word such as carelessness
      addressed: Learn finds the root word first, then reads each suffix
    - id: ful-less-swap
      what: Mixes up -ful and -less (thinks careless means full of care)
      addressed: lesson 1 sets each pair side by side (careful, careless); full-stage feedback names the meaning
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "-ful, -less und -ly", en: "-ful, -less and -ly" }
    goal:
      de: "Lies Wörter mit Endungen wie careful und careless und finde heraus, was die Endung bedeutet."
      en: "Read words with endings, like careful and careless, and work out what each ending means."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Does it make sense? \"The fish can play the guitar.\""
            say: "Read the sentence. Does it make sense?"
            answer: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "The girl rides a bike.\n\nTap the picture it is about."
            say: "Read the sentence. Tap the picture it is about."
            options: [{ object: ride-bike }, { object: swim }, { object: sing }]
            answer: ride-bike
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "care + ful = careful"
            say: "Care is the root word. Add the suffix -ful and you get careful, which means full of care."
          - text: "care + less = careless"
            say: "Add -less instead and you get careless, which means without care. The same root word, opposite meanings."
          - text: "slow + ly = slowly"
            say: "The suffix -ly tells you how something is done. The snail moves slowly."
            show: { object: snail }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What does helpful mean?"
                options: ["full of help", "without help", "help again"]
                answer: "full of help"
                option_audio: false
                feedback:
                  "without help": "That is helpless. -ful means full of."
                hints:
                  - "Find the root word: help."
                  - "-ful means full of."
                  - "Helpful means full of help."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                option_audio: false
                text: "A dog with no home. Add the suffix."
                say: "A dog with no home. Which suffix finishes the word?"
                frame: "home_"
                options: ["less", "ful", "ly"]
                answer: ["less"]
                hints:
                  - "No home means without a home."
                  - "-less means without."
                  - "Homeless."
              - id: l1-f3
                type: matching
                text: "Match each word to its meaning."
                say: "Match each word to its meaning. Read them yourself."
                option_audio: false
                pairs:
                  - { left: { text: "careful" }, right: { text: "full of care" } }
                  - { left: { text: "careless" }, right: { text: "without care" } }
                  - { left: { text: "carefully" }, right: { text: "in a careful way" } }
                hints:
                  - "Find the suffix at the end of each word."
                  - "-ful is full of, -less is without, -ly is how."
                  - "careful: full of care; careless: without care; carefully: in a careful way."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the root word."
                say: "Tap the root word in the long word."
                show: { drawn: letter-card, text: "hope ful" }
                spans: ["hope"]
                hints:
                  - "The root word comes first."
                  - "The suffix is -ful."
                  - "Hope."
              - id: l1-f5
                type: true_false
                text: "Is it true? Painless means without pain."
                answer: true
                hints:
                  - "Root word: pain."
                  - "-less means without."
                  - "Yes."
              - id: l1-f6
                type: multiple_choice
                text: "The tortoise walked _."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["slowly", "slowful", "slowless"]
                answer: "slowly"
                option_audio: false
                hints:
                  - "How did the tortoise walk?"
                  - "-ly tells you how."
                  - "Slowly."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What does fearless mean?"
                options: ["without fear", "full of fear", "fear again"]
                answer: "without fear"
                option_audio: false
                hints: ["-less means without."]
              - id: l1-s2
                type: fill_in_blank
                option_audio: false
                text: "Something with lots of colour. Add the suffix."
                say: "Something with lots of colour. Which suffix finishes the word?"
                frame: "colour_"
                options: ["ful", "less", "ly"]
                answer: ["ful"]
                hints: ["Full of colour."]
              - id: l1-s3
                type: matching
                text: "Match each word to its meaning."
                say: "Match each word to its meaning. Read them yourself."
                option_audio: false
                pairs:
                  - { left: { text: "useful" }, right: { text: "full of use" } }
                  - { left: { text: "useless" }, right: { text: "without use" } }
                  - { left: { text: "quickly" }, right: { text: "in a quick way" } }
                hints: ["Look at each suffix."]
              - id: l1-s4
                type: true_false
                text: "Is it true? Thankful means without thanks."
                answer: false
                hints: ["-ful means full of."]
              - id: l1-s5
                type: multiple_choice
                text: "Sam shut the door _."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["quietly", "quietful", "quietless"]
                answer: "quietly"
                option_audio: false
                hints: ["How did Sam shut the door?"]
              - id: l1-s6
                type: highlight_in_text
                text: "Tap the root word."
                say: "Tap the root word in the long word."
                show: { drawn: letter-card, text: "kind ly" }
                spans: ["kind"]
                hints: ["The root word comes first."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What does playful mean?"
                options: ["full of play", "without play", "play again"]
                answer: "full of play"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                option_audio: false
                text: "A tree with no leaves. Add the suffix."
                say: "A tree with no leaves. Which suffix finishes the word?"
                frame: "leaf_"
                options: ["less", "ful", "ly"]
                answer: ["less"]
              - id: l1-n3
                type: true_false
                text: "Is it true? Loudly tells you how something is done."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "The baby slept _."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["peacefully", "peaceless", "peacely"]
                answer: "peacefully"
                option_audio: false
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the root word."
                say: "Tap the root word in the long word."
                show: { drawn: letter-card, text: "help less" }
                spans: ["help"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What does painful mean?"
            options: ["full of pain", "without pain", "pain again"]
            answer: "full of pain"
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            option_audio: false
            text: "Someone who does not care. Add the suffix."
            say: "Someone who does not care. Which suffix finishes the word?"
            frame: "care_"
            options: ["less", "ful", "ly"]
            answer: ["less"]
          - id: l1-c3
            type: multiple_choice
            text: "The bird sang _."
            say: "Which word finishes the sentence? Read them yourself."
            options: ["sweetly", "sweetful", "sweetless"]
            answer: "sweetly"
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Is it true? A cloudless sky has lots of clouds."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Which word means full of cheer?"
            options: ["cheerless", "cheerful", "cheerly"]
            answer: "cheerful"
            option_audio: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tap the word that tells you how."
            say: "Read the sentence yourself. Tap the word that tells you how Ella painted."
            show: { drawn: letter-card, text: "Ella painted the picture neatly." }
            spans: ["neatly"]

  - n: 2
    title: { de: "-ment und -ness", en: "-ment and -ness" }
    goal:
      de: "Lies Namenwörter wie kindness und enjoyment und such dabei zuerst das Stammwort."
      en: "Read naming words like kindness and enjoyment by finding the root word first."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What does hopeless mean?"
            options: ["without hope", "full of hope", "hope again"]
            answer: "without hope"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            option_audio: false
            text: "Something full of joy. Add the suffix."
            say: "Something full of joy. Which suffix finishes the word?"
            frame: "joy_"
            options: ["ful", "less", "ly"]
            answer: ["ful"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "kind + ness = kindness"
            say: "The suffix -ness turns a describing word into a naming word. Kind is how someone is. Kindness is the thing they show."
          - text: "enjoy + ment = enjoyment"
            say: "The suffix -ment turns a doing word into a naming word. You enjoy a film; enjoyment is the feeling."
          - text: "care + less + ness = carelessness"
            say: "A long word can have two suffixes. Find the root word first, care, then read -less, then -ness: carelessness."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which word means being sad?"
                options: ["sadness", "sadly", "sadful"]
                answer: "sadness"
                option_audio: false
                hints:
                  - "We want a naming word for the feeling."
                  - "-ness makes a naming word."
                  - "Sadness."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                option_audio: false
                text: "Make a naming word from move. Add the suffix."
                say: "Make a naming word from move. Add the suffix."
                frame: "move_"
                options: ["ment", "ness", "ful"]
                answer: ["ment"]
                hints:
                  - "Move is a doing word."
                  - "-ment goes with doing words."
                  - "Movement."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the root word."
                say: "Tap the root word in the long word."
                show: { drawn: letter-card, text: "dark ness" }
                spans: ["dark"]
                hints:
                  - "The root word comes first."
                  - "The suffix is -ness."
                  - "Dark."
              - id: l2-f4
                type: matching
                text: "Match each root word to its suffix."
                say: "Match each root word to the suffix that makes a real word. Read them yourself."
                option_audio: false
                pairs:
                  - { left: { text: "good" }, right: { text: "ness" } }
                  - { left: { text: "pay" }, right: { text: "ment" } }
                  - { left: { text: "hope" }, right: { text: "ful" } }
                hints:
                  - "Say each pair together. Which is a real word?"
                  - "Goodness, payment, hopeful."
                  - "good-ness, pay-ment, hope-ful."
              - id: l2-f5
                type: true_false
                text: "Is it true? Happiness is a naming word."
                answer: true
                hints:
                  - "Can you put the in front of it?"
                  - "Yes: the happiness of a day out."
                  - "Yes, -ness makes a naming word."
              - id: l2-f6
                type: multiple_choice
                text: "Thank you for your _."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["kindness", "kindly", "kindful"]
                answer: "kindness"
                option_audio: false
                hints:
                  - "After your we need a naming word."
                  - "-ness makes a naming word."
                  - "Kindness."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which word means being ill?"
                options: ["illness", "illful", "illment"]
                answer: "illness"
                option_audio: false
                hints: ["-ness."]
              - id: l2-s2
                type: fill_in_blank
                option_audio: false
                text: "Make a naming word from agree. Add the suffix."
                say: "Make a naming word from agree. Add the suffix."
                frame: "agree_"
                options: ["ment", "ness", "less"]
                answer: ["ment"]
                hints: ["Agree is a doing word."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the root word."
                say: "Tap the root word in the long word."
                show: { drawn: letter-card, text: "enjoy ment" }
                spans: ["enjoy"]
                hints: ["The root word comes first."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Quickly is a naming word."
                answer: false
                hints: ["-ly tells how."]
              - id: l2-s5
                type: multiple_choice
                text: "The _ of the room scared us."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["darkness", "darkly", "darkful"]
                answer: "darkness"
                option_audio: false
                hints: ["We need a naming word."]
              - id: l2-s6
                type: highlight_in_text
                text: "Tap every suffix."
                say: "The long word is split into parts. Tap every suffix."
                show: { drawn: letter-card, text: "care less ness" }
                spans: ["less", "ness"]
                hints: ["The root word is care."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which word means being fit?"
                options: ["fitness", "fitly", "fitful"]
                answer: "fitness"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                option_audio: false
                text: "Make a naming word from pay. Add the suffix."
                say: "Make a naming word from pay. Add the suffix."
                frame: "pay_"
                options: ["ment", "ness", "ly"]
                answer: ["ment"]
              - id: l2-n3
                type: highlight_in_text
                text: "Tap every suffix."
                say: "The long word is split into parts. Tap every suffix."
                show: { drawn: letter-card, text: "hope less ness" }
                spans: ["less", "ness"]
              - id: l2-n4
                type: true_false
                text: "Is it true? Excitement is a naming word."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "We cheered with _."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["excitement", "excitely", "exciteless"]
                answer: "excitement"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ful-less
            type: multiple_choice
            text: "What does careless mean?"
            options: ["without care", "full of care", "care again"]
            answer: "without care"
            option_audio: false
          - id: l2-c2
            part: ful-less
            type: fill_in_blank
            option_audio: false
            text: "The fox made no sound at all. Add the suffix."
            say: "The fox made no sound at all. Which suffix finishes the word?"
            frame: "The fox was sound_."
            options: ["less", "ful", "ment"]
            answer: ["less"]
          - id: l2-c3
            part: ly
            type: multiple_choice
            text: "The puppy ran _."
            say: "Which word finishes the sentence? Read them yourself."
            options: ["happily", "happiness", "happyful"]
            answer: "happily"
            option_audio: false
          - id: l2-c4
            part: root
            type: highlight_in_text
            text: "Tap the root word."
            say: "Tap the root word in the long word."
            show: { drawn: letter-card, text: "sad ness" }
            spans: ["sad"]
          - id: l2-c5
            part: ment-ness
            type: multiple_choice
            text: "Which word means being bright?"
            options: ["brightness", "brightly", "brightful"]
            answer: "brightness"
            option_audio: false
          - id: l2-c6
            part: ful-less
            type: true_false
            text: "Is it true? A hopeful girl is full of hope."
            answer: true
          - id: l2-c7
            part: ful-less
            type: multiple_choice
            text: "The old torch did not work. It was _."
            say: "The old torch did not work. Which word finishes the sentence? Read them yourself."
            options: ["useful", "useless", "usely"]
            answer: "useless"
            option_audio: false
          - id: l2-c8
            part: ful-less
            type: matching
            text: "What does each word mean? Match them."
            say: "Read each word yourself. Tap a word, then tap what it means."
            option_audio: false
            pairs:
              - { left: { text: "joyful" }, right: { text: "full of joy" } }
              - { left: { text: "spotless" }, right: { text: "without spots" } }
              - { left: { text: "harmless" }, right: { text: "without harm" } }
          - id: l2-c9
            part: ly
            type: multiple_choice
            text: "Mia whispered _ in the library."
            say: "Which word finishes the sentence? Read them yourself."
            options: ["softness", "softful", "softly"]
            answer: "softly"
            option_audio: false
          - id: l2-c10
            part: ly
            type: true_false
            text: "\"The cat ate slowly.\"\nIs it true? Slowly tells you how the cat ate."
            answer: true
          - id: l2-c11
            part: ly
            type: highlight_in_text
            text: "Tap the word that tells you how."
            say: "Read the sentence yourself. Tap the word that tells you how the boy shouted."
            show: { drawn: letter-card, text: "The boy shouted loudly at the match." }
            spans: ["loudly"]
          - id: l2-c12
            part: ly
            type: multiple_choice
            text: "Ben waved sadly.\nWhat does sadly tell you?"
            options: ["where Ben waved", "how Ben waved", "when Ben waved"]
            answer: "how Ben waved"
            option_audio: false
          - id: l2-c13
            part: ment-ness
            type: multiple_choice
            text: "We stared in _ at the fireworks."
            say: "Which word finishes the sentence? Read them yourself."
            options: ["amazely", "amazement", "amazeless"]
            answer: "amazement"
            option_audio: false
          - id: l2-c14
            part: ment-ness
            type: sorting
            text: "Naming word, or a word that tells you how? Sort them."
            say: "Read each word yourself. Is it a naming word, or does it tell you how something is done?"
            option_audio: false
            bins:
              - { id: naming, show: { text: "naming word" }, say: "Naming word." }
              - { id: how, show: { text: "tells you how" }, say: "Tells you how." }
            options:
              - { text: "illness", bin: naming }
              - { text: "kindly", bin: how }
              - { text: "payment", bin: naming }
              - { text: "gently", bin: how }
          - id: l2-c15
            part: ment-ness
            type: fill_in_blank
            option_audio: false
            text: "Make a naming word from fair. Add the suffix."
            frame: "fair_"
            options: ["ment", "ness", "ful"]
            answer: ["ness"]
          - id: l2-c16
            part: ment-ness
            type: highlight_in_text
            text: "Tap the naming word made with -ness."
            say: "Read the sentence yourself. Tap the naming word made with ness."
            show: { drawn: letter-card, text: "The stillness of the lake was lovely." }
            spans: ["stillness"]
          - id: l2-c17
            part: root
            type: multiple_choice
            text: "What is the root word of thankful?"
            options: ["ful", "thank", "thankf"]
            answer: "thank"
            option_audio: false
          - id: l2-c18
            part: root
            type: highlight_in_text
            text: "Tap every suffix."
            say: "The long word is split into parts. Tap every suffix."
            show: { drawn: letter-card, text: "pain less ly" }
            spans: ["less", "ly"]
          - id: l2-c19
            part: root
            type: true_false
            text: "Is it true? The word playfulness has only one suffix."
            answer: false
            difficulty: stretch
          - id: l2-c20
            part: root
            type: matching
            text: "Match each long word to its root word."
            say: "Match each long word to its root word. Read them yourself."
            option_audio: false
            pairs:
              - { left: { text: "sickness" }, right: { text: "sick" } }
              - { left: { text: "neatly" }, right: { text: "neat" } }
              - { left: { text: "painful" }, right: { text: "pain" } }
