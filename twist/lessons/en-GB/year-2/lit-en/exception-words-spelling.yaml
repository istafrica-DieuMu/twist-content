# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.exception-words-spelling
skill: lit-en.spelling.exception-words-y2
curriculum: en-GB
language: en
title:
  de: Ausnahmewörter schreiben
  en: Spelling common exception words
summary: >
  Common exception words do not follow the spelling patterns children
  know, so they learn the tricky part of each word. Lesson 1 takes word
  families that share a tricky part (door, floor, poor; find, kind,
  child; old, cold, most); lesson 2 takes words to learn one by one
  (could, should, would; great, break; people, busy, water, again) and
  ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.spelling.exception-words-y1]
  also_practises: []
  vocabulary: { en: [common exception word, tricky word, tricky part, spell, letter, sound] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: oor, what: { de: "Wörter mit oor schreiben (door, floor, poor)", en: "spelling the oor words (door, floor, poor)" } }
    - { id: name-no-e, what: { de: "Wörter, in denen i oder o ohne e seinen Namen sagt (find, child, cold)", en: "spelling words where i or o says its name with no e (find, child, cold)" } }
    - { id: ould, what: { de: "could, should und would schreiben", en: "spelling could, should and would" } }
    - { id: ea-ay, what: { de: "Wörter, in denen ea wie ay klingt (great, break, steak)", en: "spelling words where ea says ay (great, break, steak)" } }
    - { id: one-by-one, what: { de: "einzeln gelernte Wörter schreiben (people, busy, water, again)", en: "spelling words learnt one by one (people, busy, water, again)" } }
  misconceptions:
    - id: spell-as-it-sounds
      what: Spells a tricky word the way it sounds (dor for door, cud for could, peeple for people)
      addressed: Learn screens in both lessons point at the tricky part; feedback in l1-f1 and l2-f2 names the sound-alike spelling
    - id: long-i-needs-e
      what: Adds an e to give a long i or o sound (finde, kinde, colde)
      addressed: Learn screen 3 of lesson 1 says the i in find and the o in old say their names without an e; l1-f3 feedback, l1-s2, l2-c2
    - id: ould-mixed
      what: Mixes up could, should and would or writes cood, shud
      addressed: Lesson 2 Learn teaches the family o-u-l-d; l2-f1, l2-f4, l2-s1, l2-c1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Wortfamilien mit schwierigen Stellen, en: Tricky word families }
    goal:
      de: "Merk dir die schwierige Stelle in Wortfamilien wie door, floor und poor, damit du sie richtig schreibst."
      en: "Learn the tricky part of word families like door, floor and poor, so you can spell them."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Said. Mum said yes." }
            options: ["said", "sed", "sayd"]
            answer: "said"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Fill the gap: fr_nd\nClue: someone you like to play with."
            say: "Spell the word friend. Which letters go in the gap?"
            frame: "fr_nd"
            options: ["ie", "e", "ei"]
            answer: ["ie"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "d _ _ r"
            say: "Listen: door. What do you think: which two letters go in the middle of door? Have a guess."
            show: { drawn: letter-card, text: "d _ _ r" }
          - text: "door   floor   poor"
            say: "Two o's! Some words do not follow the rules we know. We call them common exception words. Door, floor and poor all end with o, o, r. Two o's, then r. Say the letters as you look: d, o, o, r."
            show: { drawn: letter-card, text: "door" }
          - text: "find   kind   mind   behind   child   wild"
            say: "In these words the i says its name, eye, without an e at the end. Find, kind, child. No magic e here."
          - text: "old   cold   gold   told   most   both"
            say: "Here the o says its name, oh, with no e at the end. Old, cold, most, both. Look for the tricky part and remember it."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Floor. The cat sat on the floor." }
                options: ["floor", "flor", "flaw"]
                answer: "floor"
                feedback:
                  "flor": "Flor is how it sounds. Floor has two o's, like door."
                hints:
                  - "It belongs with door and poor."
                  - "Those words end with o, o, r."
                  - "floor"
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fill the gap: d_r\nClue: you open it to go into a room."
                say: "Spell the word door. Which letters go in the gap?"
                frame: "d_r"
                options: ["oo", "o", "or"]
                answer: ["oo"]
                option_audio: false
                hints:
                  - "Door is a tricky word."
                  - "It has two letters that are the same in the middle."
                  - "oo, so door."
              - id: l1-f3
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which one is the right spelling of kind?"
                options: ["kind", "kinde", "kynd"]
                answer: "kind"
                option_audio: false
                feedback:
                  "kinde": "In kind the i says its name without an e at the end."
                  "kynd": "Kynd looks like a word from a wizard's spell book! Kind is spelt with an i, like find and mind."
                hints:
                  - "Think of find and mind."
                  - "They end with n, d and no e."
                  - "kind"
              - id: l1-f4
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Cold. The snow is cold." }
                options: ["cold", "coled", "coald"]
                answer: "cold"
                hints:
                  - "It rhymes with old and gold."
                  - "Old is o, l, d."
                  - "cold"
              - id: l1-f5
                type: true_false
                text: "Is it true? \"child\" is the right spelling."
                answer: true
                hints:
                  - "Child is like wild: the i says its name."
                  - "There is no e at the end of child."
                  - "Yes, child is right."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Behind. Hide behind the tree." }
                options: ["behind", "behynd", "beehind"]
                answer: "behind"
                hints: ["Behind ends like find."]
              - id: l1-s2
                type: true_false
                text: "Is it true? \"wilde\" is the right spelling of wild."
                answer: false
                hints: ["Does wild need an e to make the i say its name?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill the gap: m_st\nClue: Ali has more sweets than anyone. He has the ..."
                say: "Spell the word most. Which letter goes in the gap?"
                frame: "m_st"
                options: ["o", "oa", "ow"]
                answer: ["o"]
                option_audio: false
                hints: ["Most has only one letter making the oh sound."]
              - id: l1-s4
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which one is the right spelling of poor?"
                options: ["poor", "pooer", "por"]
                answer: "poor"
                option_audio: false
                hints: ["Poor is in the door family."]
              - id: l1-s5
                type: sorting
                text: "Sort the words."
                say: "Read each word. Is it spelt right or wrong? Put it in the right group."
                option_audio: false
                bins:
                  - { id: right, show: { text: "spelt right" }, say: "Spelt right." }
                  - { id: wrong, show: { text: "spelt wrong" }, say: "Spelt wrong." }
                options:
                  - { text: "gold", bin: right }
                  - { text: "mind", bin: right }
                  - { text: "bothe", bin: wrong }
                  - { text: "flor", bin: wrong }
                hints: ["The o in both says its name with no e; floor has two o's."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Told. I told my dad a joke." }
                options: ["told", "toled", "tolde"]
                answer: "told"
              - id: l1-n2
                type: fill_in_blank
                text: "Fill the gap: f_nd\nClue: you look for something until you do this."
                say: "Spell the word find. Which letter goes in the gap?"
                frame: "f_nd"
                options: ["i", "y", "igh"]
                answer: ["i"]
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which one is the right spelling of both?"
                options: ["both", "bothe", "boath"]
                answer: "both"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Is it true? \"dor\" is the right spelling of door."
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Fill the gap: The baby is a small _."
                say: "The baby is a small child. Choose the right spelling."
                frame: "The baby is a small _."
                options: ["child", "chiled", "childe"]
                answer: ["child"]
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Mind. Never mind." }
            options: ["mind", "minde", "mynd"]
            answer: "mind"
          - id: l1-c2
            type: fill_in_blank
            text: "Fill the gap: fl_r\nClue: you walk on it inside a house."
            say: "Spell the word floor. Which letters go in the gap?"
            frame: "fl_r"
            options: ["oo", "o", "aw"]
            answer: ["oo"]
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Which word is spelt correctly?"
            say: "Read the words yourself. Which one is the right spelling of old?"
            options: ["old", "olde", "oald"]
            answer: "old"
            option_audio: false
          - id: l1-c4
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nI can't _ my other sock."
            say: "I can't find my other sock. Write the missing word: find."
            answer: "find"
          - id: l1-c5
            type: true_false
            text: "Is it true? This sentence is spelt right.\nI told Gran about the wilde horses."
            say: "Read the sentence. Is it spelt right?"
            answer: false
          - id: l1-c6
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Both. We both like apples." }
            options: ["boeth", "both", "bowth"]
            answer: "both"

  - n: 2
    title: { de: Wörter zum Merken, en: Words to remember }
    goal:
      de: "Lerne schwierige Wörter wie could, great und people einzeln: anschauen, abdecken, schreiben und prüfen."
      en: "Learn tricky words like could, great and people one at a time. Look, say, cover, write and check."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Kind. She is kind to her friends." }
            options: ["kind", "kinde", "kynd"]
            answer: "kind"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Fill the gap: p_r\nClue: having very little money."
            say: "Spell the word poor. Which letters go in the gap?"
            frame: "p_r"
            options: ["oo", "o", "ou"]
            answer: ["oo"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "could"
            say: "Say could out loud. What do you think: can you hear every letter in it? Have a guess."
            show: { drawn: letter-card, text: "could" }
          - text: "could   should   would"
            say: "No, one letter is silent! Could, should and would are a family. They all end with o, u, l, d. The l is silent. Could, should, would."
            show: { drawn: letter-card, text: "could" }
          - text: "Did you know? could got its l from should and would."
            say: "Did you know? Long ago, could was spelt with no l at all. People added the l to make it look like should and would. The l in could has never been said out loud!"
            show: { drawn: letter-card, text: "could" }
          - text: "great   break   steak"
            say: "In great, break and steak, the letters e and a make the ay sound. Great, break, steak."
          - text: "people   busy   water   again   pretty"
            say: "Some words you learn one at a time. People has an o you cannot hear. Busy has a u that says i. Water has an a that says or. Again ends with a, i, n. Pretty has an e that says i."
          - text: "Look, say, cover, write, check."
            say: "To learn a tricky word, look at it, say it, cover it, write it, then check. Find the tricky part each time."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Could. Could you help me?" }
                options: ["could", "cood", "cud"]
                answer: "could"
                hints:
                  - "Could is in a family with should and would."
                  - "They all end with o, u, l, d."
                  - "could"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which one is the right spelling of people?"
                options: ["people", "peeple", "pepol"]
                answer: "people"
                option_audio: false
                feedback:
                  "peeple": "Peeple is how it sounds. People has e, o in the middle, and the o is silent."
                hints:
                  - "People has a letter you cannot hear."
                  - "It is p, e, o, p, l, e."
                  - "people"
              - id: l2-f3
                type: fill_in_blank
                text: "Fill the gap: gr_t\nClue: really good."
                say: "Spell the word great. Which letters go in the gap?"
                frame: "gr_t"
                options: ["ea", "ai", "ay"]
                answer: ["ea"]
                option_audio: false
                hints:
                  - "Great is like break and steak."
                  - "In those words two letters make the ay sound: e and a."
                  - "ea, so great."
              - id: l2-f4
                type: fill_in_blank
                text: "Fill the gap: You _ wear a coat."
                say: "You should wear a coat. Choose the right spelling."
                frame: "You _ wear a coat."
                options: ["should", "shood", "shud"]
                answer: ["should"]
                option_audio: false
                hints:
                  - "Should belongs with could and would."
                  - "It ends with o, u, l, d."
                  - "should"
              - id: l2-f5
                type: true_false
                text: "Is it true? \"busy\" is the right spelling."
                answer: true
                hints:
                  - "Busy is a tricky word: the u says i."
                  - "It is b, u, s, y."
                  - "Yes, busy is right."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Would. Would you like a drink?" }
                options: ["would", "wood", "wud"]
                answer: "would"
                hints: ["Would ends like could."]
              - id: l2-s2
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which one is the right spelling of water?"
                options: ["water", "worter", "wotter"]
                answer: "water"
                option_audio: false
                hints: ["In water, the a says or."]
              - id: l2-s3
                type: fill_in_blank
                text: "Fill the gap: br_k\nClue: if you drop a cup, it might do this."
                say: "Spell the word break. Which letters go in the gap?"
                frame: "br_k"
                options: ["ea", "ai", "a"]
                answer: ["ea"]
                option_audio: false
                hints: ["Break is in the great family."]
              - id: l2-s4
                type: true_false
                text: "Is it true? \"agen\" is the right spelling of again."
                answer: false
                hints: ["Again ends with a, i, n."]
              - id: l2-s5
                type: highlight_in_text
                text: "Tap the silent letter in people."
                say: "Here is people, letter by letter. Tap the letter you cannot hear."
                show: { drawn: letter-card, text: "p e o p l e" }
                spans: ["o"]
                hints: ["Say pee-pul. Which vowel do you not hear?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Listen. Tap the right spelling."
                audio: { en: "Pretty. What a pretty flower." }
                options: ["pretty", "pritty", "pretey"]
                answer: "pretty"
              - id: l2-n2
                type: fill_in_blank
                text: "Fill the gap: I _ swim."
                say: "I could swim. Choose the right spelling."
                frame: "I _ swim."
                options: ["could", "cood", "cuold"]
                answer: ["could"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Read the words yourself. Which one is the right spelling of busy?"
                options: ["busy", "bizzy", "bisy"]
                answer: "busy"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? \"grate\" is the right spelling of great, as in a great day."
                answer: false
              - id: l2-n5
                type: sorting
                text: "Sort the words."
                say: "Read each word. Is it spelt right or wrong? Put it in the right group."
                option_audio: false
                bins:
                  - { id: right, show: { text: "spelt right" }, say: "Spelt right." }
                  - { id: wrong, show: { text: "spelt wrong" }, say: "Spelt wrong." }
                options:
                  - { text: "again", bin: right }
                  - { text: "steak", bin: right }
                  - { text: "wud", bin: wrong }
                  - { text: "peeple", bin: wrong }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ould
            type: fill_in_blank
            text: "Fill the gap: We _ go to the park."
            say: "We should go to the park. Choose the right spelling."
            frame: "We _ go to the park."
            options: ["should", "shuld", "shood"]
            answer: ["should"]
            option_audio: false
          - id: l2-c2
            part: name-no-e
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Wild. A fox is a wild animal." }
            options: ["wild", "wilde", "wyld"]
            answer: "wild"
          - id: l2-c3
            part: one-by-one
            type: multiple_choice
            text: "Which word is spelt correctly?"
            say: "Read the words yourself. Which one is the right spelling of again?"
            options: ["again", "agen", "agin"]
            answer: "again"
            option_audio: false
          - id: l2-c4
            part: ea-ay
            type: fill_in_blank
            text: "Fill the gap: st_k\nClue: a thick piece of meat."
            say: "Spell the word steak. Which letters go in the gap?"
            frame: "st_k"
            options: ["ea", "ai", "a"]
            answer: ["ea"]
            option_audio: false
          - id: l2-c5
            part: oor
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Door. Shut the door, please." }
            options: ["door", "dor", "doar"]
            answer: "door"
          - id: l2-c6
            part: oor
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nWe sat on the _ to play a game."
            say: "We sat on the floor to play a game. Write the missing word: floor."
            answer: "floor"
          - id: l2-c7
            part: oor
            type: true_false
            text: "Is it true? This sentence is spelt right.\nThe poor dog was wet and muddy."
            say: "Read the sentence. Is it spelt right?"
            answer: true
          - id: l2-c8
            part: oor
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Read the sentence. One word is spelt wrong. Tap it."
            show: { drawn: letter-card, text: "Shut the dor and sit on the floor." }
            spans: ["dor"]
          - id: l2-c9
            part: name-no-e
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nThe ice cream was very _."
            say: "The ice cream was very cold. Write the missing word: cold."
            answer: "cold"
          - id: l2-c10
            part: name-no-e
            type: fill_in_blank
            text: "Fill the gaps: Be _ to the little _."
            say: "Be kind to the little child. Choose the right spellings."
            frame: "Be _ to the little _."
            options: ["kinde", "kind", "child", "childe"]
            answer: ["kind", "child"]
            option_audio: false
          - id: l2-c11
            part: name-no-e
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Gold. The king has a gold crown." }
            options: ["goled", "gold", "goald"]
            answer: "gold"
          - id: l2-c12
            part: ould
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nI _ like a drink, please."
            say: "I would like a drink, please. Write the missing word: would."
            answer: "would"
          - id: l2-c13
            part: ould
            type: true_false
            text: "Is it true? This sentence is spelt right.\nI cud not reach the top shelf."
            say: "Read the sentence. Is it spelt right?"
            answer: false
          - id: l2-c14
            part: ould
            type: multiple_choice
            text: "Which sentence is spelt right?"
            say: "Read the sentences yourself. Which one is spelt right?"
            options: ["You shud brush your teeth.", "You should brush your teeth.", "You shood brush your teeth."]
            answer: "You should brush your teeth."
            option_audio: false
          - id: l2-c15
            part: ea-ay
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Break. Do not break the cup." }
            options: ["braik", "brayk", "break"]
            answer: "break"
          - id: l2-c16
            part: ea-ay
            type: fill_in_blank
            text: "Fill the gap: We had a _ time at the party."
            say: "We had a great time at the party. Choose the right spelling."
            frame: "We had a _ time at the party."
            options: ["grayt", "great", "grait"]
            answer: ["great"]
            option_audio: false
          - id: l2-c17
            part: ea-ay
            type: true_false
            text: "Is it true? This sentence is spelt right.\nIt was a great day at the beach."
            say: "Read the sentence. Is it spelt right?"
            answer: true
          - id: l2-c18
            part: one-by-one
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nThere were lots of _ at the fair."
            say: "There were lots of people at the fair. Write the missing word: people."
            answer: "people"
          - id: l2-c19
            part: one-by-one
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Read the sentence. One word is spelt wrong. Tap it."
            show: { drawn: letter-card, text: "The shop was very bizzy today." }
            spans: ["bizzy"]
          - id: l2-c20
            part: one-by-one
            type: audio_choice
            text: "Listen. Tap the right spelling."
            audio: { en: "Water. Plants need water to grow." }
            options: ["worter", "water", "warter"]
            answer: "water"
