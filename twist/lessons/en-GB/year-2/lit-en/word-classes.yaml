# Lesson set: English, Year 2. Hand-authored draft.
id: en-GB.lit-en.word-classes
skill: lit-en.grammar.word-classes
curriculum: en-GB
language: en
title:
  de: Wortarten und Wortbildung
  en: Word classes and making words
summary: >
  Children recognise four word classes and make new words with suffixes
  and by compounding. Lesson 1 takes nouns (naming words) and verbs
  (doing words), and joins two nouns into a compound (white + board =
  whiteboard). Lesson 2 takes adjectives (describing words, some made
  with -ful and -less) and adverbs (how something is done, often with
  -ly). Lesson 3 makes nouns with -ness and -er (kindness, teacher),
  sorts all four classes, and ends with the skill check. Words are shown
  in sentences, so the class comes from the job the word does.
metadata:
  year: year-2
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.grammar.terms-y1]
  also_practises: [lit-en.word-reading.suffixes-y2, lit-en.grammar.noun-phrases]
  vocabulary: { en: [noun, verb, adjective, adverb, suffix, root word, compound word, -ness, -er, -ful, -less, -ly] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: nouns-verbs, what: { de: Nomen und Verben an ihrer Aufgabe im Satz erkennen, en: knowing nouns and verbs by the job they do in a sentence } }
    - { id: adjectives-adverbs, what: { de: Adjektive und Adverbien erkennen und wählen, en: knowing and choosing adjectives and adverbs } }
    - { id: suffixes, what: { de: "Wörter mit -ness, -er, -ful, -less und -ly bilden", en: "making words with -ness, -er, -ful, -less and -ly" } }
    - { id: compounds, what: { de: zusammengesetzte Wörter bilden und erkennen, en: making and spotting compound words } }
  misconceptions:
    - id: noun-is-object
      what: Thinks only things you can touch are nouns, or calls a verb a noun because it is about a thing (kick, ball)
      addressed: Learn of lesson 1 tests a noun with a or the; l1-f1, l1-f4 and l1-s1 sort nouns from verbs, with feedback in l1-f2
    - id: adjective-adverb-swap
      what: Uses an adjective where an adverb is needed (she ran quick) or calls every -ly word an adverb
      addressed: Learn of lesson 2; l2-f3, l2-s3 and l2-n3 choose between quick and quickly, with feedback in l2-f3
    - id: suffix-spelling
      what: Adds a suffix without changing y to i (happyness) or treats the suffix as a separate word
      addressed: Learn screen 2 of lesson 3; l3-f2 and l3-s2 choose the spelling, with feedback in l3-f2
    - id: compound-order
      what: Joins the two words of a compound the wrong way round (boardwhite)
      addressed: Learn screen 4 of lesson 1; l1-f5 and l1-n4 build compounds from two words
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Nomen, Verben und zusammengesetzte Wörter", en: "Nouns, verbs and compound words" }
    goal:
      de: "Finde Nomen und Verben in einem Satz und mach aus zwei Wörtern eins, so wie snow und man zu snowman."
      en: "Find the nouns and verbs in a sentence, and join two words into one, like snow and man make snowman."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which word means more than one?"
            options: ["dogs", "dog"]
            answer: "dogs"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is this mark called?\n?"
            say: "Look at the mark. What is it called?"
            options: ["a question mark", "a full stop", "a capital letter"]
            answer: "a question mark"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The dog chased the ball."
            say: "Dog and ball are nouns. A noun names a person, a place, an animal or a thing. You can put a or the in front of it: the dog, a ball."
            show: { object: dog }
          - text: "The dog chased the ball."
            say: "Chased is a verb. A verb tells you what someone or something does, or is. Run, eat, sleep and chased are verbs."
          - text: "I kick the ball.   The kick was strong."
            say: "The same word can do different jobs. In I kick the ball, kick is a verb: it is what I do. In The kick was strong, kick has the in front of it, so it is a noun. Look at the job the word does."
          - text: "white + board = whiteboard\nfoot + ball = football"
            say: "Two words can join to make a new word. White and board make whiteboard. Foot and ball make football. This is called a compound word. Keep the words in the same order."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Noun or verb? Sort them."
                say: "Read each word. Is it a naming word or a doing word? Put it in the right group."
                option_audio: false
                bins:
                  - { id: noun, show: { text: "noun" }, say: "Noun." }
                  - { id: verb, show: { text: "verb" }, say: "Verb." }
                options:
                  - { text: "cat", bin: noun }
                  - { text: "jump", bin: verb }
                  - { text: "school", bin: noun }
                  - { text: "sing", bin: verb }
                hints:
                  - "Can you put the in front of it? Then it is a noun."
                  - "Can you do it? Then it is a verb."
                  - "Nouns: cat, school. Verbs: jump, sing."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the verb."
                say: "Read the sentence. Tap the verb, the doing word."
                show: { drawn: letter-card, text: "The baby drinks milk." }
                spans: ["drinks"]
                feedback:
                  milk: "Milk is a noun: you can say the milk. The verb is what the baby does."
                hints:
                  - "What does the baby do?"
                  - "Baby and milk are nouns."
                  - "Drinks."
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the nouns."
                say: "Read the sentence. Tap both nouns."
                show: { drawn: letter-card, text: "The bird sat in the tree." }
                spans: ["bird", "tree."]
                hints:
                  - "Look for words with the in front."
                  - "Sat is what the bird did."
                  - "Bird and tree."
              - id: l1-f4
                type: multiple_choice
                text: "We play in the park.\nWhat is play in this sentence?"
                say: "Read the sentence: We play in the park. What is the word play here?"
                options: ["a verb", "a noun"]
                answer: "a verb"
                option_audio: false
                hints:
                  - "Is play what we do, or a thing?"
                  - "There is no the in front of play."
                  - "A verb."
              - id: l1-f5
                type: image_multiple_choice
                text: "snow + man = ?"
                say: "Join the two words to make a compound word. Which picture shows it?"
                options: [{ object: snowman }, { object: snow }, { object: child }]
                answer: snowman
                hints:
                  - "Put the two words together: snow, then man."
                  - "A man made of snow."
                  - "Snowman."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Noun or verb? Sort them."
                say: "Read each word. Is it a naming word or a doing word? Put it in the right group."
                option_audio: false
                bins:
                  - { id: noun, show: { text: "noun" }, say: "Noun." }
                  - { id: verb, show: { text: "verb" }, say: "Verb." }
                options:
                  - { text: "swim", bin: verb }
                  - { text: "teacher", bin: noun }
                  - { text: "write", bin: verb }
                  - { text: "garden", bin: noun }
                hints: ["Try the in front: the teacher, the garden."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tap the verb."
                say: "Read the sentence. Tap the verb."
                show: { drawn: letter-card, text: "Grandpa reads a book." }
                spans: ["reads"]
                hints: ["What does Grandpa do?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Make a compound word."
                say: "Which word joins with sun to make the name of a tall yellow flower?"
                frame: "sun + _ = sunflower"
                options: ["flower", "shine", "hat"]
                answer: ["flower"]
                hints: ["Look at the end of sunflower."]
              - id: l1-s4
                type: true_false
                text: "In the sentence \"The cat sleeps\", the word sleeps is a noun."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Is sleeps a thing or what the cat does?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which word is a compound word?"
                options: ["playground", "playing", "player"]
                answer: "playground"
                option_audio: false
                hints: ["Which one is made of two whole words?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the nouns."
                say: "Read the sentence. Tap both nouns."
                show: { drawn: letter-card, text: "The girl has a kite." }
                spans: ["girl", "kite."]
              - id: l1-n2
                type: highlight_in_text
                text: "Tap the verb."
                say: "Read the sentence. Tap the verb."
                show: { drawn: letter-card, text: "The frog jumps high." }
                spans: ["jumps"]
              - id: l1-n3
                type: multiple_choice
                text: "Mum gave me a hug.\nWhat is hug in this sentence?"
                say: "Read the sentence: Mum gave me a hug. What is the word hug here?"
                options: ["a noun", "a verb"]
                answer: "a noun"
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Make a compound word."
                say: "Join the two words to make a compound word."
                frame: "tooth + brush = _"
                options: ["toothbrush", "brushtooth", "teethbrush"]
                answer: ["toothbrush"]
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Rainbow is a compound word: rain + bow."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the verb."
            say: "Read the sentence. Tap the verb."
            show: { drawn: letter-card, text: "The dog barks at night." }
            spans: ["barks"]
          - id: l1-c2
            type: multiple_choice
            text: "Which word is a noun?"
            options: ["shop", "run", "eat"]
            answer: "shop"
            option_audio: false
          - id: l1-c3
            type: fill_in_blank
            text: "Make a compound word."
            say: "Join the two words to make a compound word."
            frame: "bed + room = _"
            options: ["bedroom", "roombed", "bedsroom"]
            answer: ["bedroom"]
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Is it true? In \"The sun shines\", the word sun is a noun."
            answer: true
          - id: l1-c5
            type: fill_in_blank
            text: "Which two words make the compound word teapot?"
            say: "Which two words join to make teapot?"
            frame: "teapot = _ + _"
            options: ["tea", "pot", "ten", "top"]
            answer: ["tea", "pot"]
            option_audio: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tap every noun."
            say: "Read the sentence yourself. Tap every noun."
            show: { drawn: letter-card, text: "Mum put the jam in the jar." }
            spans: ["Mum", "jam", "jar."]

  - n: 2
    title: { de: Adjektive und Adverbien, en: Adjectives and adverbs }
    goal:
      de: "Finde Adjektive, die etwas beschreiben, und Adverbien, die sagen wie, so wie in the tortoise walked slowly."
      en: "Find adjectives that describe things and adverbs that say how, like the tortoise walked slowly."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the verb."
            say: "Read the sentence. Tap the verb."
            show: { drawn: letter-card, text: "The fish swims fast." }
            spans: ["swims"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Make a compound word."
            say: "Join the two words to make a compound word."
            frame: "foot + ball = _"
            options: ["football", "ballfoot"]
            answer: ["football"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The fluffy cat slept."
            say: "Fluffy is an adjective. An adjective describes a noun: what the cat is like. Big, red, fluffy and happy are adjectives."
            show: { object: cat }
          - text: "help + ful = helpful\ncare + less = careless"
            say: "You can make adjectives with suffixes. -ful means full of: helpful. -less means without: careless."
          - text: "The cat slept quietly."
            say: "Quietly is an adverb. An adverb tells you how something is done. It goes with the verb: how did the cat sleep? Quietly."
          - text: "quick → quickly\nslow → slowly"
            say: "Many adverbs are made by adding -ly to an adjective. A quick runner runs quickly. Use the adjective for the noun and the adverb for the verb."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the adjective."
                say: "Read the sentence. Tap the adjective, the describing word."
                show: { drawn: letter-card, text: "A tiny mouse ran past." }
                spans: ["tiny"]
                hints:
                  - "Find the noun first: mouse."
                  - "Which word tells you what the mouse is like?"
                  - "Tiny."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tap the adverb."
                say: "Read the sentence. Tap the adverb, the word that tells you how."
                show: { drawn: letter-card, text: "The children sang loudly." }
                spans: ["loudly."]
                hints:
                  - "How did the children sing?"
                  - "Look for the -ly ending."
                  - "Loudly."
              - id: l2-f3
                type: multiple_choice
                text: "The tortoise walked _."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["slowly", "slow"]
                answer: "slowly"
                option_audio: false
                feedback:
                  slow: "Slow is an adjective: a slow tortoise. To say how it walked, use the adverb slowly."
                hints:
                  - "The word tells you how it walked."
                  - "How words often end in -ly."
                  - "Slowly."
              - id: l2-f4
                type: fill_in_blank
                text: "A spider with no fear. Add the suffix."
                say: "A spider with no fear. Which suffix makes the word?"
                frame: "fear_"
                options: ["less", "ful", "ly"]
                answer: ["less"]
                hints:
                  - "No fear means without fear."
                  - "-less means without."
                  - "Fearless."
              - id: l2-f5
                type: sorting
                text: "Adjective or adverb? Sort them."
                say: "Read each word. Does it describe a thing, or how something is done? Put it in the right group."
                option_audio: false
                bins:
                  - { id: adjective, show: { text: "adjective" }, say: "Adjective." }
                  - { id: adverb, show: { text: "adverb" }, say: "Adverb." }
                options:
                  - { text: "happy", bin: adjective }
                  - { text: "happily", bin: adverb }
                  - { text: "soft", bin: adjective }
                  - { text: "softly", bin: adverb }
                hints:
                  - "Which words have -ly at the end?"
                  - "Happy and soft describe a noun: a happy boy, a soft toy."
                  - "Adjectives: happy, soft. Adverbs: happily, softly."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap the adjective."
                say: "Read the sentence. Tap the adjective."
                show: { drawn: letter-card, text: "We ate a huge pizza." }
                spans: ["huge"]
                hints: ["What was the pizza like?"]
              - id: l2-s2
                type: fill_in_blank
                text: "A friend who helps a lot. Add the suffix."
                say: "A friend who helps a lot. Which suffix makes the word?"
                frame: "help_"
                options: ["ful", "less", "ly"]
                answer: ["ful"]
                hints: ["-ful means full of."]
              - id: l2-s3
                type: multiple_choice
                text: "Sam shut the door _."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["quiet", "quietly"]
                answer: "quietly"
                option_audio: false
                hints: ["How did Sam shut it?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tap the adverb."
                say: "Read the sentence. Tap the adverb."
                show: { drawn: letter-card, text: "The owl flew silently over the field." }
                spans: ["silently"]
                hints: ["How did the owl fly?"]
              - id: l2-s5
                type: true_false
                text: "In the sentence \"The sun is bright\", the word bright is an adjective."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Does it describe the sun?"]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tap the adverb."
                say: "Read the sentence. Tap the adverb."
                show: { drawn: letter-card, text: "Dad carefully carried the cake." }
                spans: ["carefully"]
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the adjective."
                say: "Read the sentence. Tap the adjective."
                show: { drawn: letter-card, text: "The muddy dog shook itself." }
                spans: ["muddy"]
              - id: l2-n3
                type: multiple_choice
                text: "The bus came _."
                say: "Which word finishes the sentence? Read them yourself."
                options: ["quick", "quickly"]
                answer: "quickly"
                option_audio: false
              - id: l2-n4
                type: fill_in_blank
                text: "A broken toy you cannot use any more. Add the suffix."
                say: "A broken toy you cannot use any more. Which suffix makes the word?"
                frame: "use_"
                options: ["less", "ful", "ly"]
                answer: ["less"]
              - id: l2-n5
                type: true_false
                text: "In the sentence \"She sang sweetly\", the word sweetly is an adjective."
                say: "Read it. Is it true?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tap the adjective."
            say: "Read the sentence. Tap the adjective."
            show: { drawn: letter-card, text: "I found a shiny shell." }
            spans: ["shiny"]
          - id: l2-c2
            type: multiple_choice
            text: "The snail moved _."
            say: "Which word finishes the sentence? Read them yourself."
            options: ["slow", "slowly"]
            answer: "slowly"
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "Full of colour. Add the suffix."
            say: "Full of colour. Which suffix makes the word?"
            frame: "colour_"
            options: ["ful", "less", "ly"]
            answer: ["ful"]
          - id: l2-c4
            type: highlight_in_text
            text: "Tap the adverb."
            say: "Read the sentence. Tap the adverb."
            show: { drawn: letter-card, text: "The girl smiled shyly." }
            spans: ["shyly."]
          - id: l2-c5
            type: true_false
            text: "Is it true? In \"a cold drink\", the word cold is an adverb."
            answer: false
          - id: l2-c6
            type: fill_in_blank
            text: "A bee that cannot sting does no harm. Add the suffix."
            say: "A bee that cannot sting does no harm. Which suffix makes the word?"
            frame: "harm_"
            options: ["less", "ly", "ful"]
            answer: ["less"]

  - n: 3
    title: { de: "Nomen mit -ness und -er", en: "Nouns with -ness and -er" }
    goal:
      de: "Bilde mit einer Endung neue Nomen wie kindness und teacher und sortier Wörter in alle vier Wortarten."
      en: "Make new nouns with an ending, like kindness and teacher, and sort words into all four groups."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: highlight_in_text
            text: "Tap the adverb."
            say: "Read the sentence. Tap the adverb."
            show: { drawn: letter-card, text: "The baby slept peacefully." }
            spans: ["peacefully."]
            difficulty: easy
          - id: l3-w2
            type: fill_in_blank
            text: "Without pain. Add the suffix."
            say: "Without pain. Which suffix makes the word?"
            frame: "pain_"
            options: ["less", "ful"]
            answer: ["less"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "kind + ness = kindness\ndark + ness = darkness"
            say: "Add -ness to an adjective and you make a noun. Kind is an adjective. Kindness is a noun: you can say the kindness. Dark becomes darkness."
          - text: "happy → happiness"
            say: "When the root word ends in y after a consonant, change the y to i before -ness. Happy becomes happiness, not happyness."
          - text: "teach + er = teacher\nbake + er = baker"
            say: "Add -er to a verb and you make a noun for the person who does it. A teacher teaches. A baker bakes. Bake already ends in e, so just add r."
            show: { object: teacher }
          - text: "noun  verb  adjective  adverb"
            say: "Now you know four word classes. A noun names. A verb does. An adjective describes a noun. An adverb tells you how."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: fill_in_blank
                text: "Make a noun from sad."
                say: "Which suffix turns the adjective sad into a noun?"
                frame: "sad_"
                options: ["ness", "ly", "ful"]
                answer: ["ness"]
                hints:
                  - "Which suffix makes a noun?"
                  - "Kind becomes kindness."
                  - "Sadness."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "Add -ness to silly. Which spelling is right?"
                say: "Add -ness to silly. Which spelling is right? Read them yourself."
                options: ["silliness", "sillyness", "sillness"]
                answer: "silliness"
                option_audio: false
                feedback:
                  sillyness: "Silly ends in y after a consonant, so change y to i: silliness."
                hints:
                  - "Silly ends in y."
                  - "Change the y to i, then add -ness."
                  - "silliness."
              - id: l3-f3
                type: image_multiple_choice
                text: "A person who farms is a _."
                say: "A person who farms. Add -er. Who is it?"
                options: [{ object: farmer }, { object: cook }, { object: doctor }]
                answer: farmer
                option_audio: false
                hints:
                  - "farm + er."
                  - "This person works on a farm."
                  - "A farmer."
              - id: l3-f4
                type: fill_in_blank
                text: "A person who paints. Make a noun."
                say: "A person who paints is a ... Which suffix?"
                frame: "paint_"
                options: ["er", "ness", "ly"]
                answer: ["er"]
                hints:
                  - "Which suffix names a person who does something?"
                  - "Teach becomes teacher."
                  - "Painter."
              - id: l3-f5
                type: sorting
                text: "The happy girl sang loudly.\nWhat kind of word? Sort them."
                say: "Read the sentence: The happy girl sang loudly. Sort its words into the right groups."
                option_audio: false
                bins:
                  - { id: noun, show: { text: "noun" }, say: "Noun." }
                  - { id: verb, show: { text: "verb" }, say: "Verb." }
                  - { id: adjective, show: { text: "adjective" }, say: "Adjective." }
                  - { id: adverb, show: { text: "adverb" }, say: "Adverb." }
                options:
                  - { text: "girl", bin: noun }
                  - { text: "sang", bin: verb }
                  - { text: "happy", bin: adjective }
                  - { text: "loudly", bin: adverb }
                hints:
                  - "Who is it about? What did she do?"
                  - "What was she like? How did she sing?"
                  - "girl: noun, sang: verb, happy: adjective, loudly: adverb."

          - support: some
            tasks:
              - id: l3-s1
                type: fill_in_blank
                text: "Make a noun from good."
                say: "Which suffix turns the adjective good into a noun?"
                frame: "good_"
                options: ["ness", "er", "ly"]
