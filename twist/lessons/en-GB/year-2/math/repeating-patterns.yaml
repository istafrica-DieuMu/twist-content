# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.repeating-patterns
skill: math.patterns.repeating
curriculum: en-GB
language: en
title:
  de: Muster fortsetzen
  en: Repeating patterns
summary: >
  Lesson 1 finds the repeating part of a shape or colour pattern (circle,
  triangle, circle, triangle), describes it and continues it, including
  patterns where shape and colour both change; lesson 2 finds a missing
  shape, spots the mistake, continues number patterns (2, 5, 2, 5) and
  works out what comes further along, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Muster, en: Patterns }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.shapes.basic-shapes, math.numbers-to-20.count-to-10]
  also_practises: [math.shapes.basic-shapes]
  vocabulary: { en: [pattern, repeat, repeating part, continue, next, missing, mistake, sequence] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: continue, what: { de: ein Muster aus Formen oder Farben fortsetzen, en: continuing a shape or colour pattern } }
    - { id: describe, what: { de: "den Teil finden, der sich wiederholt", en: finding the part that repeats } }
    - { id: gap-mistake, what: { de: eine Lücke oder einen Fehler im Muster finden, en: finding a gap or a mistake in a pattern } }
    - { id: numbers, what: { de: Zahlenmuster fortsetzen, en: continuing a number pattern } }
  misconceptions:
    - id: repeats-last
      what: Repeats the last item instead of starting the repeating part again (circle, triangle, circle, triangle, then triangle again)
      addressed: lesson 1 Learn says the pattern starts again after the last part; the last shape is an option in l1-f1 (with feedback), l1-s1 and l1-n1
    - id: unit-of-two-only
      what: Expects every pattern to repeat after two items and misreads an ABC or AAB pattern
      addressed: lesson 1 Learn shows circle, circle, square; l1-f3, l1-f5, l1-s3, l1-s5 and l1-n5 have three-part repeating parts
    - id: one-attribute-only
      what: Looks only at the shape and ignores the colour when both change
      addressed: lesson 1 Learn shows a pattern where the shape and the colour both repeat; l1-f4 (with feedback) and l1-n3 offer the right shape in the wrong colour
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was kommt als Nächstes?", en: "What comes next?" }
    goal:
      de: "Finde den Teil, der sich wiederholt, wie Kreis, Dreieck, Kreis, Dreieck, und setz das Muster fort."
      en: "Find the part that repeats, like circle, triangle, circle, triangle, and carry on the pattern."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is this shape called?"
            say: "What is this shape called?"
            show: { drawn: shape, kind: hexagon, colour: green }
            options: ["hexagon", "pentagon", "circle"]
            answer: "hexagon"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many shapes are there?"
            say: "Count the shapes. How many are there?"
            show: { drawn: shape, row: [circle, square, circle, square, circle, square, circle], colours: [red, blue, red, blue, red, blue, red] }
            options: ["7", "6", "8"]
            answer: "7"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "circle, triangle, circle, triangle"
            say: "This is a pattern. Circle, triangle, circle, triangle. Circle and triangle come again and again. That is the repeating part."
            show: { drawn: shape, row: [circle, triangle, circle, triangle], colours: [red, blue, red, blue] }
          - text: "circle, triangle, circle, triangle, ?"
            say: "What comes next? After the triangle, the repeating part starts again, with the circle. Say the pattern out loud and you can hear it."
            show: { drawn: shape, row: [circle, triangle, circle, triangle, "?"], colours: [red, blue, red, blue] }
          - text: "circle, circle, square"
            say: "Some patterns have three parts: circle, circle, square. Circle, circle, square. The repeating part is three shapes long."
            show: { drawn: shape, row: [circle, circle, square, circle, circle, square], colours: [yellow, yellow, green, yellow, yellow, green] }
          - text: "red square, blue triangle"
            say: "In this pattern the shape and the colour both change. Red square, blue triangle, red square, blue triangle. Look at the shape and the colour."
            show: { drawn: shape, row: [square, triangle, square, triangle], colours: [red, blue, red, blue] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "What comes next?"
                say: "Square, circle, square, circle. What comes next?"
                show: { drawn: shape, row: [square, circle, square, circle, "?"], colours: [blue, yellow, blue, yellow] }
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: circle, colour: yellow }
                  - { drawn: shape, kind: triangle, colour: red }
                answer: square
                option_audio: false
                feedback:
                  circle: "The circle was the last shape. After the circle, the pattern starts again with the square."
                hints:
                  - "Which part comes again and again?"
                  - "Square, circle. Then it starts again."
                  - "The square."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "red, blue, red, blue, _"
                say: "Red, blue, red, blue. Which colour comes next?"
                show: { drawn: shape, row: [circle, circle, circle, circle, "?"], colours: [red, blue, red, blue] }
                options: ["red", "blue", "green"]
                answer: "red"
                hints:
                  - "Say the pattern out loud."
                  - "After blue it starts again."
                  - "Red."
              - id: l1-f3
                type: image_multiple_choice
                text: "What comes next?"
                say: "Triangle, triangle, circle, triangle, triangle. What comes next?"
                show: { drawn: shape, row: [triangle, triangle, circle, triangle, triangle, "?"], colours: [green, green, orange, green, green] }
                options:
                  - { drawn: shape, kind: circle, colour: orange }
                  - { drawn: shape, kind: triangle, colour: green }
                  - { drawn: shape, kind: square, colour: blue }
                answer: circle
                option_audio: false
                hints:
                  - "The repeating part has three shapes."
                  - "Triangle, triangle, circle."
                  - "The circle."
              - id: l1-f4
                type: image_multiple_choice
                text: "What comes next?"
                say: "Look at the shape and the colour. What comes next?"
                show: { drawn: shape, row: [rectangle, circle, rectangle, circle, rectangle, "?"], colours: [purple, green, purple, green, purple] }
                options:
                  - { drawn: shape, kind: circle, colour: green, key: circle-green }
                  - { drawn: shape, kind: circle, colour: purple, key: circle-purple }
                  - { drawn: shape, kind: rectangle, colour: purple, key: rectangle-purple }
                answer: circle-green
                option_audio: false
                feedback:
                  circle-purple: "The shape is right, but look at the colour. Every circle in this pattern is green."
                hints:
                  - "Look at the shape first, then the colour."
                  - "Purple rectangle, green circle. A purple rectangle was last."
                  - "The green circle."
              - id: l1-f5
                type: multiple_choice
                text: "Which part repeats?"
                say: "Which part repeats in this pattern?"
                show: { drawn: shape, row: [square, triangle, circle, square, triangle, circle], colours: [purple, orange, blue, purple, orange, blue] }
                options: ["square, triangle, circle", "square, triangle", "triangle, circle"]
                answer: "square, triangle, circle"
                hints:
                  - "Look at the first shapes. Where does it start again?"
                  - "The second square starts it again."
                  - "Square, triangle, circle."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "What comes next?"
                say: "Triangle, pentagon, triangle, pentagon. What comes next?"
                show: { drawn: shape, row: [triangle, pentagon, triangle, pentagon, "?"], colours: [red, green, red, green] }
                options:
                  - { drawn: shape, kind: triangle, colour: red }
                  - { drawn: shape, kind: pentagon, colour: green }
                  - { drawn: shape, kind: square, colour: yellow }
                answer: triangle
                option_audio: false
                hints: ["After the pentagon, the pattern starts again."]
              - id: l1-s2
                type: multiple_choice
                text: "yellow, yellow, green, yellow, yellow, _"
                say: "Yellow, yellow, green, yellow, yellow. Which colour comes next?"
                show: { drawn: shape, row: [square, square, square, square, square, "?"], colours: [yellow, yellow, green, yellow, yellow] }
                options: ["green", "yellow", "red"]
                answer: "green"
                hints: ["The repeating part has three colours."]
              - id: l1-s3
                type: image_multiple_choice
                text: "What comes next?"
                say: "Circle, triangle, square, circle, triangle. What comes next?"
                show: { drawn: shape, row: [circle, triangle, square, circle, triangle, "?"], colours: [blue, blue, blue, blue, blue] }
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: triangle, colour: blue }
                  - { drawn: shape, kind: circle, colour: blue }
                answer: square
                option_audio: false
                hints: ["The repeating part has three shapes."]
              - id: l1-s4
                type: true_false
                text: "red, blue, red, blue. Blue comes next."
                say: "Red, blue, red, blue. Is it true that blue comes next?"
                show: { drawn: shape, row: [triangle, triangle, triangle, triangle, "?"], colours: [red, blue, red, blue] }
                answer: false
                hints: ["After blue, the pattern starts again."]
              - id: l1-s5
                type: multiple_choice
                text: "Which part repeats?"
                say: "Which part repeats in this pattern?"
                show: { drawn: shape, row: [hexagon, hexagon, circle, hexagon, hexagon, circle], colours: [red, red, green, red, red, green] }
                options: ["hexagon, hexagon, circle", "hexagon, circle", "circle, circle"]
                answer: "hexagon, hexagon, circle"
                hints: ["Say the pattern out loud. Where does it start again?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "What comes next?"
                say: "Rectangle, circle, rectangle, circle. What comes next?"
                show: { drawn: shape, row: [rectangle, circle, rectangle, circle, "?"], colours: [orange, purple, orange, purple] }
                options:
                  - { drawn: shape, kind: rectangle, colour: orange }
                  - { drawn: shape, kind: circle, colour: purple }
                  - { drawn: shape, kind: triangle, colour: green }
                answer: rectangle
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "blue, green, green, blue, green, green, _"
                say: "Blue, green, green, blue, green, green. Which colour comes next?"
                show: { drawn: shape, row: [circle, circle, circle, circle, circle, circle, "?"], colours: [blue, green, green, blue, green, green] }
                options: ["blue", "green", "yellow"]
                answer: "blue"
              - id: l1-n3
                type: image_multiple_choice
                text: "What comes next?"
                say: "Look at the shape and the colour. What comes next?"
                show: { drawn: shape, row: [triangle, square, triangle, square, "?"], colours: [yellow, red, yellow, red] }
                options:
                  - { drawn: shape, kind: triangle, colour: yellow, key: triangle-yellow }
                  - { drawn: shape, kind: triangle, colour: red, key: triangle-red }
                  - { drawn: shape, kind: square, colour: red, key: square-red }
                answer: triangle-yellow
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "triangle, square, triangle, square. A triangle comes next."
                say: "Triangle, square, triangle, square. Is it true that a triangle comes next?"
                show: { drawn: shape, row: [triangle, square, triangle, square, "?"], colours: [yellow, purple, yellow, purple] }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which part repeats?"
                say: "Which part repeats in this pattern?"
                show: { drawn: shape, row: [circle, square, square, circle, square, square], colours: [green, orange, orange, green, orange, orange] }
                options: ["circle, square, square", "circle, square", "square, square"]
                answer: "circle, square, square"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "What comes next?"
            say: "Circle, square, circle, square. What comes next?"
            show: { drawn: shape, row: [circle, square, circle, square, "?"], colours: [green, orange, green, orange] }
            options:
              - { drawn: shape, kind: circle, colour: green }
              - { drawn: shape, kind: square, colour: orange }
              - { drawn: shape, kind: triangle, colour: blue }
            answer: circle
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "red, red, yellow, red, red, _"
            say: "Red, red, yellow, red, red. Which colour comes next?"
            show: { drawn: shape, row: [triangle, triangle, triangle, triangle, triangle, "?"], colours: [red, red, yellow, red, red] }
            options: ["yellow", "red", "blue"]
            answer: "yellow"
          - id: l1-c3
            type: true_false
            text: "square, triangle, square, triangle. A triangle comes next."
            say: "Square, triangle, square, triangle. Is it true that a triangle comes next?"
            show: { drawn: shape, row: [square, triangle, square, triangle, "?"], colours: [blue, red, blue, red] }
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            text: "What comes next?"
            say: "Square, square, triangle, square, square. What comes next?"
            show: { drawn: shape, row: [square, square, triangle, square, square, "?"], colours: [blue, blue, yellow, blue, blue] }
            options:
              - { drawn: shape, kind: triangle, colour: yellow }
              - { drawn: shape, kind: square, colour: blue }
              - { drawn: shape, kind: circle, colour: red }
            answer: triangle
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Which part repeats?"
            say: "Which part repeats in this pattern?"
            show: { drawn: shape, row: [triangle, pentagon, pentagon, triangle, pentagon, pentagon], colours: [red, blue, blue, red, blue, blue] }
            options: ["triangle, pentagon, pentagon", "triangle, pentagon", "pentagon, pentagon"]
            answer: "triangle, pentagon, pentagon"
          - id: l1-c6
            type: image_multiple_choice
            text: "What comes next?"
            say: "Purple pentagon, yellow triangle, purple pentagon, yellow triangle. What comes next?"
            show: { drawn: shape, row: [pentagon, triangle, pentagon, triangle, "?"], colours: [purple, yellow, purple, yellow] }
            options:
              - { drawn: shape, kind: pentagon, colour: purple, key: pentagon-purple }
              - { drawn: shape, kind: pentagon, colour: yellow, key: pentagon-yellow }
              - { drawn: shape, kind: triangle, colour: yellow, key: triangle-yellow }
            answer: pentagon-purple
            option_audio: false

  - n: 2
    title: { de: "Lücken, Fehler und Zahlenmuster", en: "Gaps, mistakes and number patterns" }
    goal:
      de: "Finde Lücken und Fehler in Mustern und setz Zahlenmuster wie 2, 5, 2, 5 fort."
      en: "Find gaps and mistakes in patterns, and carry on number patterns like 2, 5, 2, 5."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "green, blue, green, blue, _"
            say: "Green, blue, green, blue. Which colour comes next?"
            options: ["green", "blue"]
            answer: "green"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which part repeats?"
            say: "Circle, triangle, circle, triangle. Which part repeats?"
            show: { drawn: shape, row: [circle, triangle, circle, triangle], colours: [green, red, green, red] }
            options: ["circle, triangle", "circle, circle"]
            answer: "circle, triangle"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "circle, square, ?, square"
            say: "Here a shape is missing in the middle. Circle, square, and then? After it comes a square again, so the circle is missing."
            show: { drawn: shape, row: [circle, square, "?", square], colours: [red, blue, null, blue] }
          - text: "A mistake in the pattern"
            say: "Triangle, circle, triangle, circle, circle. The last shape is wrong. After a circle, the triangle should come."
            show: { drawn: shape, row: [triangle, circle, triangle, circle, circle], colours: [green, yellow, green, yellow, yellow] }
          - text: "2, 5, 2, 5, 2, 5"
            say: "Numbers can make a repeating pattern too: two, five, two, five. The repeating part is two, five. Next comes two."
          - text: "1st, 2nd, 3rd, 4th ..."
            say: "To see further along, count in repeating parts. Circle, square, circle, square: every odd place is a circle, so the 1st, 3rd, 5th and 7th are circles. The 8th shape is a square."
            show: { drawn: shape, row: [circle, square, circle, square, circle, square, circle, square], colours: [red, blue, red, blue, red, blue, red, blue] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which shape is missing?"
                say: "Triangle, circle, gap, circle. Which shape is missing?"
                show: { drawn: shape, row: [triangle, circle, "?", circle], colours: [orange, purple, null, purple] }
                options:
                  - { drawn: shape, kind: triangle, colour: orange }
                  - { drawn: shape, kind: circle, colour: purple }
                  - { drawn: shape, kind: square, colour: green }
                answer: triangle
                option_audio: false
                feedback:
                  circle: "Two circles side by side would break the pattern. Triangle, circle comes again and again."
                hints:
                  - "Which part repeats?"
                  - "Triangle, circle, triangle, circle."
                  - "The triangle."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "One shape breaks the pattern. Which one is it?"
                say: "One shape breaks the pattern. Which one is it?"
                show: { drawn: shape, row: [square, circle, square, circle, circle, circle], colours: [blue, red, blue, red, red, red] }
                options: ["the 5th", "the 1st", "the 6th"]
                answer: "the 5th"
                hints:
                  - "Say the pattern: square, circle, square, circle ..."
                  - "The 4th shape is a circle, so a square should come next."
                  - "The 5th shape."
              - id: l2-f3
                type: multiple_choice
                text: "2, 5, 2, 5, 2, _"
                say: "Two, five, two, five, two. Which number comes next?"
                options: ["5", "2", "7"]
                answer: "5"
                option_audio: false
                feedback:
                  "7": "Seven would be adding on. This pattern only repeats two, five."
                hints:
                  - "Which part repeats?"
                  - "Two, five. After two comes five."
                  - "5."
              - id: l2-f4
                type: true_false
                text: "circle, circle, triangle, circle, circle, triangle. The pattern is right."
                say: "Circle, circle, triangle, circle, circle, triangle. Is the pattern right?"
                show: { drawn: shape, row: [circle, circle, triangle, circle, circle, triangle], colours: [yellow, yellow, blue, yellow, yellow, blue] }
                answer: true
                hints:
                  - "The repeating part has three shapes."
                  - "Circle, circle, triangle comes twice."
                  - "Yes, it is right."
              - id: l2-f5
                type: multiple_choice
                text: "red, blue, red, blue ... What colour is the 10th?"
                say: "Red, blue, red, blue, and it goes on. What colour is the tenth one?"
                show: { drawn: shape, row: [circle, circle, circle, circle, circle, circle], colours: [red, blue, red, blue, red, blue] }
                options: ["blue", "red"]
                answer: "blue"
                hints:
                  - "Which places are red, and which are blue?"
                  - "1st red, 2nd blue, 3rd red, 4th blue. Every even place is blue."
                  - "Ten is even, so blue."
                difficulty: stretch

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Which shape is missing?"
                say: "Square, gap, square, triangle. Which shape is missing?"
                show: { drawn: shape, row: [square, "?", square, triangle], colours: [green, null, green, red] }
                options:
                  - { drawn: shape, kind: triangle, colour: red }
                  - { drawn: shape, kind: square, colour: green }
                  - { drawn: shape, kind: circle, colour: blue }
                answer: triangle
                option_audio: false
                hints: ["Square, triangle comes again and again."]
              - id: l2-s2
                type: multiple_choice
                text: "One shape breaks the pattern. Which one is it?"
                say: "One shape breaks the pattern. Which one is it?"
                show: { drawn: shape, row: [triangle, square, triangle, triangle, triangle, square], colours: [purple, orange, purple, purple, purple, orange] }
                options: ["the 4th", "the 1st", "the 6th"]
                answer: "the 4th"
                hints: ["Triangle, square, triangle, and then?"]
              - id: l2-s3
                type: multiple_choice
                text: "4, 1, 4, 1, 4, _"
                say: "Four, one, four, one, four. Which number comes next?"
                options: ["1", "4", "5"]
                answer: "1"
                option_audio: false
                hints: ["The repeating part is four, one."]
              - id: l2-s4
                type: true_false
                text: "circle, square, circle, circle, square. The pattern is right."
                say: "Circle, square, circle, circle, square. Is the pattern right?"
                show: { drawn: shape, row: [circle, square, circle, circle, square], colours: [red, blue, red, red, blue] }
                answer: false
                hints: ["After circle, square, circle, a square should come."]
              - id: l2-s5
                type: multiple_choice
                text: "3, 3, 6, 3, 3, 6, _"
                say: "Three, three, six, three, three, six. Which number comes next?"
                options: ["3", "6", "9"]
                answer: "3"
                option_audio: false
                hints: ["The repeating part starts again from the beginning."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which shape is missing?"
                say: "Circle, triangle, square, circle, gap, square. Which shape is missing?"
                show: { drawn: shape, row: [circle, triangle, square, circle, "?", square], colours: [blue, yellow, red, blue, null, red] }
                options:
                  - { drawn: shape, kind: triangle, colour: yellow }
                  - { drawn: shape, kind: square, colour: red }
                  - { drawn: shape, kind: circle, colour: blue }
                answer: triangle
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "One shape breaks the pattern. Which one is it?"
                say: "One shape breaks the pattern. Which one is it?"
                show: { drawn: shape, row: [circle, triangle, circle, triangle, square, triangle], colours: [green, red, green, red, green, red] }
                options: ["the 5th", "the 2nd", "the 6th"]
                answer: "the 5th"
              - id: l2-n3
                type: multiple_choice
                text: "5, 6, 7, 5, 6, _"
                say: "Five, six, seven, five, six. Which number comes next?"
                options: ["7", "5", "8"]
                answer: "7"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "triangle, triangle, circle, triangle, triangle, circle. The pattern is right."
                say: "Triangle, triangle, circle, triangle, triangle, circle. Is the pattern right?"
                show: { drawn: shape, row: [triangle, triangle, circle, triangle, triangle, circle], colours: [orange, orange, blue, orange, orange, blue] }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "square, circle, square, circle ... What is the 9th shape?"
                say: "Square, circle, square, circle, and it goes on. What is the ninth shape?"
                show: { drawn: shape, row: [square, circle, square, circle, square, circle], colours: [purple, yellow, purple, yellow, purple, yellow] }
                options: ["square", "circle"]
                answer: "square"
                difficulty: stretch

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: continue
            type: image_multiple_choice
            text: "What comes next?"
            say: "Triangle, square, circle, triangle, square. What comes next?"
            show: { drawn: shape, row: [triangle, square, circle, triangle, square, "?"], colours: [purple, purple, purple, purple, purple] }
            options:
              - { drawn: shape, kind: circle, colour: purple }
              - { drawn: shape, kind: triangle, colour: purple }
              - { drawn: shape, kind: square, colour: purple }
            answer: circle
            option_audio: false
          - id: l2-c2
            part: gap-mistake
            type: image_multiple_choice
            text: "Which shape is missing?"
            say: "Square, circle, square, gap, square. Which shape is missing?"
            show: { drawn: shape, row: [square, circle, square, "?", square], colours: [red, yellow, red, null, red] }
            options:
              - { drawn: shape, kind: circle, colour: yellow }
              - { drawn: shape, kind: square, colour: red }
              - { drawn: shape, kind: triangle, colour: green }
