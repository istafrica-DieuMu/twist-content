# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.time-durations
skill: math.time.durations
curriculum: en-GB
language: en
title:
  de: Zeitpunkt und Zeitspanne
  en: Times and how long things take
summary: >
  Telling a time (the film starts at 4 o'clock) from a length of time (the
  film lasts 1 hour). Lesson 1 works out how long something takes by
  counting on in fives or to the next o'clock; lesson 2 works out when
  something ends or starts, compares and orders lengths of time, and ends
  with the skill check. Times stay on the 12-hour clock, to five minutes,
  with am and pm.
metadata:
  year: year-2
  topic: { de: Zeitpunkt und Zeitdauer, en: Time and duration }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.time.five-minutes, math.add-sub-to-100.complement]
  also_practises: [math.time.five-minutes, math.add-sub-to-100.complement]
  vocabulary: { en: [time, how long, lasts, starts, ends, finishes, minutes, hours, o'clock, longer, shorter, am, pm] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: []
  parts:
    - { id: point-span, what: { de: Zeitpunkt und Zeitspanne unterscheiden, en: telling a time from how long something takes } }
    - { id: how-long, what: { de: "ausrechnen, wie lange etwas dauert", en: working out how long something lasts } }
    - { id: end-start, what: { de: "ausrechnen, wann etwas endet oder begonnen hat", en: working out when something ends or starts } }
    - { id: compare, what: { de: Zeitspannen vergleichen und ordnen, en: comparing and ordering lengths of time } }
  misconceptions:
    - id: time-or-length
      what: Gives a time when asked how long, or a length of time when asked when
      addressed: lesson 1 Learn sorts both kinds; "a time or how long?" in l1-f1, l1-s1, l1-n1 and l1-c3; l1-f2 offers the end time as a distractor, with feedback
    - id: hundred-minute-hour
      what: Counts on past the hour as if an hour had 100 minutes (3:50 to 4:10 is 60 minutes)
      addressed: lesson 1 Learn hops to the o'clock first; l1-f4, l1-n4 and l2-c4 take the wrong claim, and l2-f2 offers 1:75 pm with feedback
    - id: longer-number-longer-time
      what: Thinks 30 minutes is longer than 1 hour because 30 is the bigger number
      addressed: lesson 2 Learn compares 1 hour with 30 minutes; l2-f5, l2-s5 and l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wie lange dauert es?", en: "How long does it take?" }
    goal:
      de: "Finde heraus, wie lange etwas dauert, so wie Schwimmen von halb vier bis zehn vor vier sind 20 Minuten."
      en: "Work out how long something takes, like swimming from half past three to ten to four is 20 minutes."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "40 + _ = 60"
            say: "Forty add how many make sixty?"
            answer: "20"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 8, minute: 40 }
            options: ["20 to 9", "20 to 8", "20 past 8"]
            answer: "20 to 9"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "School starts at 9 o'clock.\nThe lesson lasts 1 hour.\nWhich one tells you when?"
            say: "Listen to these two. School starts at nine o'clock. The lesson lasts one hour. Which one tells you when something happens? Have a guess."
          - text: "A time: school starts at 9 o'clock.\nHow long: the lesson lasts 1 hour."
            say: "School starts at nine o'clock tells you when. A time tells you when something happens: school starts at nine o'clock. How long tells you how much time something takes: the lesson lasts one hour."
          - text: "3:30 to 3:50 = 20 minutes"
            say: "Swimming starts at half past three and ends at ten to four. Count on in fives from the 6 to the 10: five, ten, fifteen, twenty. Swimming lasts twenty minutes."
            show: { drawn: clock, hour: 3, minute: 30 }
          - text: "3:50 to 4:10\n10 minutes + 10 minutes = 20 minutes"
            say: "When you go past the hour, hop to the o'clock first. From ten to four to four o'clock is ten minutes. Then ten more minutes to ten past four. That is twenty minutes, not sixty."
            show: { drawn: clock, hour: 3, minute: 50 }
          - text: "Did you know? The longest tennis match ever was played at Wimbledon in 2010. It lasted more than 11 hours, over 3 days!"
            say: "Did you know? The longest tennis match ever was played at Wimbledon in twenty ten. The two players played for more than eleven hours! It went on for three days before one of them won."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The bus leaves at 8:15 am. Is that a time or how long?"
                say: "The bus leaves at eight fifteen in the morning. Is that a time, or how long something takes?"
                show: { object: bus }
                options: ["a time", "how long"]
                keep_order: true
                answer: "a time"
                hints:
                  - "Does it say when the bus leaves, or how long the trip takes?"
                  - "At eight fifteen tells you when."
                  - "A time."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Story time starts at 2:00 pm and ends at 2:30 pm. How long does it last?"
                say: "Story time starts at two o'clock in the afternoon and ends at half past two. How long does it last?"
                options: ["30 minutes", "2:30", "1 hour"]
                answer: "30 minutes"
                feedback:
                  "2:30": "Half past two is when it ends. How long asks for minutes."
                hints:
                  - "Count the minutes from two o'clock to half past two."
                  - "Half an hour is thirty minutes."
                  - "30 minutes."
              - id: l1-f3
                type: text_input
                text: "Football starts at 10:20 am and ends at 11:00 am. How many minutes is that?"
                say: "Football starts at twenty past ten in the morning and ends at eleven o'clock. How many minutes is that?"
                show: { drawn: clock, hour: 10, minute: 20 }
                answer: "40"
                hints:
                  - "How many minutes until the next o'clock?"
                  - "Twenty add how many make sixty?"
                  - "40 minutes."
              - id: l1-f4
                type: true_false
                text: "From 3:50 to 4:10 is 60 minutes."
                say: "From ten to four until ten past four is sixty minutes. Is that true?"
                answer: false
                hints:
                  - "Hop to four o'clock first."
                  - "Ten minutes to four o'clock, then ten more."
                  - "No. It is 20 minutes."
              - id: l1-f5
                type: multiple_choice
                text: "The party starts at 1:00 pm and ends at 4:00 pm. How long is the party?"
                say: "The party starts at one o'clock in the afternoon and ends at four o'clock. How long is the party?"
                options: ["3 hours", "4 hours", "5 hours", "All night long"]
                answer: "3 hours"
                feedback:
                  "All night long": "That would be a very sleepy party! Count the hours from one o'clock to four o'clock."
                hints:
                  - "Count the hours from one o'clock."
                  - "Two o'clock, three o'clock, four o'clock."
                  - "3 hours."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Playtime lasts 15 minutes. Is that a time or how long?"
                say: "Playtime lasts fifteen minutes. Is that a time, or how long something takes?"
                options: ["a time", "how long"]
                keep_order: true
                answer: "how long"
                hints: ["Does it say when, or how much time it takes?"]
              - id: l1-s2
                type: text_input
                text: "Lunch starts at 12:10 pm and ends at 12:45 pm. How many minutes is that?"
                say: "Lunch starts at ten past twelve and ends at quarter to one. How many minutes is that?"
                show: { drawn: clock, hour: 12, minute: 10 }
                answer: "35"
                hints: ["Count on in fives from the 2 to the 9."]
              - id: l1-s3
                type: text_input
                text: "Zoe paints from 4:45 pm to 5:00 pm. How many minutes is that?"
                say: "Zoe paints from quarter to five until five o'clock. How many minutes is that?"
                answer: "15"
                hints: ["How many minutes until five o'clock?"]
              - id: l1-s4
                type: true_false
                text: "From 9:55 to 10:05 is 10 minutes."
                say: "From five to ten until five past ten is ten minutes. Is that true?"
                answer: true
                hints: ["Five minutes to ten o'clock, then five more."]
              - id: l1-s5
                type: multiple_choice
                text: "The trip starts at 9:00 am and ends at 11:00 am. How long is the trip?"
                say: "The school trip starts at nine o'clock in the morning and ends at eleven o'clock. How long is the trip?"
                options: ["2 hours", "11 hours", "20 minutes"]
                answer: "2 hours"
                hints: ["Count the hours from nine o'clock."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Gran arrives at 5:30 pm. Is that a time or how long?"
                say: "Gran arrives at half past five. Is that a time, or how long something takes?"
                options: ["a time", "how long"]
                keep_order: true
                answer: "a time"
              - id: l1-n2
                type: text_input
                text: "Amir reads from 7:05 pm to 7:30 pm. How many minutes is that?"
                say: "Amir reads from five past seven until half past seven. How many minutes is that?"
                answer: "25"
              - id: l1-n3
                type: text_input
                text: "The cake bakes from 2:40 pm to 3:10 pm. How many minutes is that?"
                say: "The cake bakes from twenty to three until ten past three. How many minutes is that?"
                answer: "30"
              - id: l1-n4
                type: true_false
                text: "From 6:45 to 7:15 is 70 minutes."
                say: "From quarter to seven until quarter past seven is seventy minutes. Is that true?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "The shop opens at 8:00 am and closes at 12:00 noon. How long is it open?"
                say: "The shop opens at eight o'clock in the morning and closes at twelve noon. How long is it open?"
                options: ["4 hours", "12 hours", "8 hours"]
                answer: "4 hours"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Music starts at 1:25 pm and ends at 2:00 pm. How many minutes is that?"
            say: "Music starts at twenty-five past one and ends at two o'clock. How many minutes is that?"
            answer: "35"
          - id: l1-c2
            type: text_input
            text: "From 11:50 am to 12:20 pm. How many minutes is that?"
            say: "From ten to twelve until twenty past twelve. How many minutes is that?"
            answer: "30"
          - id: l1-c3
            type: multiple_choice
            text: "The film lasts 1 hour. Is that a time or how long?"
            say: "The film lasts one hour. Is that a time, or how long something takes?"
            options: ["a time", "how long"]
            keep_order: true
            answer: "how long"
          - id: l1-c4
            type: text_input
            text: "Sports day starts at 1:00 pm and ends at 3:00 pm. How many hours does it last?"
            say: "Sports day starts at one o'clock in the afternoon and ends at three o'clock. How many hours does it last?"
            answer: "2"
          - id: l1-c5
            type: true_false
            text: "From 4:55 to 5:10 is 15 minutes."
            say: "From five to five until ten past five is fifteen minutes. Is that true?"
            answer: true
          - id: l1-c6
            type: text_input
            text: "Lily plays from 2:35 pm to 3:00 pm. How many minutes is that?"
            say: "Lily plays from twenty-five to three until three o'clock. How many minutes is that?"
            answer: "25"

  - n: 2
    title: { de: "Wann ist es zu Ende?", en: "When does it end?" }
    goal:
      de: "Finde heraus, wann etwas endet, so wie ein Spiel, das um zwanzig nach zehn beginnt und 25 Minuten dauert."
      en: "Work out when something ends, like a game that starts at twenty past ten and lasts 25 minutes."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "From 5:40 pm to 6:00 pm. How many minutes is that?"
            say: "From twenty to six until six o'clock. How many minutes is that?"
            answer: "20"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Dance class lasts 45 minutes. Is that a time or how long?"
            say: "Dance class lasts forty-five minutes. Is that a time, or how long something takes?"
            options: ["a time", "how long"]
            keep_order: true
            answer: "how long"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Starts 10:20 am, lasts 25 minutes\nWhen does it end?"
            say: "A game starts at twenty past ten and lasts twenty-five minutes. When do you think it ends? Have a guess."
            show: { drawn: clock, hour: 10, minute: 20 }
          - text: "Starts 10:20 am, lasts 25 minutes\nEnds 10:45 am"
            say: "Twenty add twenty-five is forty-five. The game ends at quarter to eleven."
            show: { drawn: clock, hour: 10, minute: 45 }
          - text: "Starts 3:45 pm, lasts 30 minutes\n3:45 + 15 minutes = 4:00\n4:00 + 15 minutes = 4:15"
            say: "Going past the hour, hop to the o'clock first. From quarter to four to four o'clock is fifteen minutes. Fifteen of the thirty minutes are left. It ends at quarter past four."
            show: { drawn: clock, hour: 4, minute: 15 }
          - text: "1 hour = 60 minutes\n1 hour is longer than 30 minutes."
            say: "To compare, use the same unit. One hour is sixty minutes, so one hour is longer than thirty minutes, even though thirty is the bigger number."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The cake goes in the oven at 3:10 pm and bakes for 40 minutes. When is it ready?"
                say: "The cake goes in the oven at ten past three and bakes for forty minutes. When is it ready?"
                show: { object: cake }
                options: ["3:50 pm", "3:40 pm", "4:10 pm"]
                answer: "3:50 pm"
                hints:
                  - "Add the forty minutes to the ten minutes past three."
                  - "Ten add forty is fifty."
                  - "3:50 pm."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "PE starts at 1:50 pm and lasts 25 minutes. When does it end?"
                say: "PE starts at ten to two and lasts twenty-five minutes. When does it end?"
                options: ["2:15 pm", "3:15 pm", "1:75 pm"]
                answer: "2:15 pm"
                feedback:
                  "1:75 pm": "An hour has only 60 minutes. Hop to two o'clock first, then add the rest."
                hints:
                  - "Hop to the o'clock first."
                  - "Ten minutes to two o'clock. Fifteen minutes are left."
                  - "2:15 pm."
              - id: l2-f3
                type: multiple_choice
                text: "The film ends at 6:00 pm. It lasted 2 hours. When did it start?"
                say: "The film ends at six o'clock in the evening. It lasted two hours. When did it start?"
                options: ["4:00 pm", "8:00 pm", "5:00 pm"]
                answer: "4:00 pm"
                hints:
                  - "Count back, because it started before it ended."
                  - "One hour before six is five. One more hour back."
                  - "4:00 pm."
              - id: l2-f4
                type: true_false
                text: "Jack leaves at 8:35 am and walks for 15 minutes. He gets to school at 8:50 am."
                say: "Jack leaves at twenty-five to nine and walks for fifteen minutes. He gets to school at ten to nine. Is that true?"
                answer: true
                hints:
                  - "Add fifteen to thirty-five."
                  - "Thirty-five add fifteen is fifty."
                  - "Yes, that is true."
              - id: l2-f5
                type: multiple_choice
                text: "Priya plays for 1 hour. Leo plays for 30 minutes. Which takes longer?"
                say: "Priya plays for one hour. Leo plays for thirty minutes. Which takes longer?"
                options: ["1 hour", "30 minutes", "the same"]
                keep_order: true
                answer: "1 hour"
                feedback:
                  "30 minutes": "30 is the bigger number, but these are minutes. One hour is 60 minutes."
                hints:
                  - "Change the hour into minutes."
                  - "One hour is sixty minutes. Compare sixty with thirty."
                  - "1 hour."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Playtime starts at 10:30 am and lasts 15 minutes. It ends at 10:_ am."
                say: "Playtime starts at half past ten and lasts fifteen minutes. When does it end? Type the minutes."
                answer: "45"
                hints: ["Thirty add fifteen."]
              - id: l2-s2
                type: multiple_choice
                text: "Swimming starts at 4:45 pm and lasts 30 minutes. When does it end?"
                say: "Swimming starts at quarter to five and lasts thirty minutes. When does it end?"
                options: ["5:15 pm", "4:75 pm", "5:45 pm"]
                answer: "5:15 pm"
                hints: ["Hop to five o'clock first."]
              - id: l2-s3
                type: multiple_choice
                text: "School ends at 3:00 pm. It lasted 6 hours. When did it start?"
                say: "School ends at three o'clock in the afternoon. It lasted six hours. When did it start?"
                options: ["9:00 am", "9:00 pm", "10:00 am"]
                answer: "9:00 am"
                hints: ["Count back six hours from three o'clock, past twelve noon."]
              - id: l2-s4
                type: true_false
                text: "Mia starts at 7:40 pm and reads for 30 minutes. She stops at 7:70 pm."
                say: "Mia starts reading at twenty to eight and reads for thirty minutes. She stops at seven seventy. Is that true?"
                answer: false
                hints: ["An hour has only sixty minutes. Hop to eight o'clock first."]
              - id: l2-s5
                type: ordering
                text: "Put them in order, shortest first."
                say: "Put these in order, from the shortest time to the longest."
                options: ["1 hour", "5 minutes", "30 minutes"]
                slot_count: 3
                answer: ["5 minutes", "30 minutes", "1 hour"]
                hints: ["One hour is sixty minutes."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The bread goes in the oven at 8:05 am and bakes for 35 minutes. When is it ready?"
                say: "The bread goes in the oven at five past eight and bakes for thirty-five minutes. When is it ready?"
                show: { object: bread }
                options: ["8:40 am", "8:30 am", "9:05 am"]
                answer: "8:40 am"
              - id: l2-n2
                type: multiple_choice
                text: "The train leaves at 2:50 pm and the trip takes 20 minutes. When does it arrive?"
                say: "The train leaves at ten to three and the trip takes twenty minutes. When does it arrive?"
                show: { object: train }
                options: ["3:10 pm", "2:70 pm", "3:20 pm"]
                answer: "3:10 pm"
              - id: l2-n3
                type: multiple_choice
                text: "The fair ends at 5:00 pm. It lasted 3 hours. When did it start?"
                say: "The fair ends at five o'clock. It lasted three hours. When did it start?"
                options: ["2:00 pm", "8:00 pm", "3:00 pm"]
                answer: "2:00 pm"
              - id: l2-n4
                type: true_false
                text: "Choir starts at 5:55 pm and lasts 15 minutes. It ends at 6:10 pm."
                say: "Choir starts at five to six and lasts fifteen minutes. It ends at ten past six. Is that true?"
                answer: true
              - id: l2-n5
                type: ordering
                text: "Put them in order, shortest first."
                say: "Put these in order, from the shortest time to the longest."
                options: ["2 hours", "20 minutes", "1 hour", "45 minutes"]
                slot_count: 4
                answer: ["20 minutes", "45 minutes", "1 hour", "2 hours"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: how-long
            type: text_input
            text: "Art starts at 9:35 am and ends at 10:00 am. How many minutes is that?"
            say: "Art starts at twenty-five to ten and ends at ten o'clock. How many minutes is that?"
            answer: "25"
          - id: l2-c2
            part: end-start
            type: multiple_choice
            text: "The show starts at 5:40 pm and lasts 35 minutes. When does it end?"
            say: "The show starts at twenty to six and lasts thirty-five minutes. When does it end?"
            options: ["6:15 pm", "5:75 pm", "6:35 pm"]
            answer: "6:15 pm"
          - id: l2-c3
            part: end-start
            type: multiple_choice
            text: "The match ends at 4:00 pm. It lasted 2 hours. When did it start?"
            say: "The match ends at four o'clock. It lasted two hours. When did it start?"
            options: ["2:00 pm", "6:00 pm", "3:00 pm"]
            answer: "2:00 pm"
          - id: l2-c4
            part: how-long
            type: true_false
            text: "From 1:50 to 2:20 is 70 minutes."
            say: "From ten to two until twenty past two is seventy minutes. Is that true?"
            answer: false
          - id: l2-c5
            part: compare
            type: multiple_choice
            text: "Which is longer?"
            say: "Which is longer: forty minutes or one hour?"
            options: ["40 minutes", "1 hour", "the same"]
            keep_order: true
            answer: "1 hour"
          - id: l2-c6
            part: point-span
            type: multiple_choice
            text: "Which one tells you how long?"
            say: "Which sentence tells you how long something takes?"
            options: ["The film lasts 2 hours.", "The film starts at 2:00 pm.", "The film ends at 4:00 pm."]
            answer: "The film lasts 2 hours."
          - id: l2-c7
            part: point-span
            type: multiple_choice
            text: "Which one is a time?"
            say: "Which one is a time?"
            options: ["half past 3", "20 minutes", "2 hours"]
            answer: "half past 3"
          - id: l2-c8
            part: point-span
            type: true_false
            text: "Is it true? 'Lunch lasts 40 minutes' tells you when lunch starts."
            say: "Lunch lasts forty minutes. Is it true that this tells you when lunch starts?"
            answer: false
          - id: l2-c9
            part: point-span
            type: multiple_choice
            text: "Ella says: 'The train leaves at 9:15 am.' What does she tell you?"
            say: "Ella says: The train leaves at nine fifteen in the morning. What does she tell you?"
            options: ["when the train leaves", "how long the trip takes"]
            keep_order: true
            answer: "when the train leaves"
          - id: l2-c10
            part: point-span
            type: true_false
            text: "Is it true? '3 hours' tells you how long something takes."
            say: "Three hours. Is it true that this tells you how long something takes?"
            answer: true
          - id: l2-c11
            part: how-long
            type: text_input
            text: "Art club starts at 4:05 pm and ends at 4:50 pm. How many minutes is that?"
            say: "Art club starts at five past four and ends at ten to five. How many minutes is that?"
            answer: "45"
          - id: l2-c12
            part: how-long
            type: multiple_choice
            text: "Bath time is from 6:50 pm to 7:05 pm. How long is that?"
            say: "Bath time is from ten to seven until five past seven. How long is that?"
            options: ["15 minutes", "55 minutes", "7:05"]
            answer: "15 minutes"
          - id: l2-c13
            part: how-long
            type: multiple_choice
            text: "The trip starts at 10:00 am and ends at 1:00 pm. How long is the trip?"
            say: "The trip starts at ten o'clock in the morning and ends at one o'clock in the afternoon. How long is the trip?"
            options: ["3 hours", "9 hours", "1 hour"]
            answer: "3 hours"
          - id: l2-c14
            part: end-start
            type: multiple_choice
            text: "A pizza goes in the oven at 5:25 pm and cooks for 20 minutes. When is it ready?"
            say: "A pizza goes in the oven at twenty-five past five and cooks for twenty minutes. When is it ready?"
            options: ["5:45 pm", "5:05 pm", "6:45 pm"]
            answer: "5:45 pm"
          - id: l2-c15
            part: end-start
            type: multiple_choice
            text: "Swimming starts at 11:40 am and lasts 30 minutes. When does it end?"
            say: "Swimming starts at twenty to twelve and lasts thirty minutes. When does it end?"
            options: ["12:10 pm", "11:70 am", "12:40 pm"]
            answer: "12:10 pm"
          - id: l2-c16
            part: end-start
            type: true_false
            text: "The concert ended at 8:00 pm. It lasted 2 hours. It started at 6:00 pm."
            say: "The concert ended at eight o'clock in the evening. It lasted two hours. It started at six o'clock. Is that true?"
            answer: true
          - id: l2-c17
            part: compare
            type: ordering
            text: "Put them in order, longest first."
            say: "Put these in order, from the longest time to the shortest."
            options: ["15 minutes", "2 hours", "50 minutes", "1 hour"]
            slot_count: 4
            answer: ["2 hours", "1 hour", "50 minutes", "15 minutes"]
          - id: l2-c18
            part: compare
