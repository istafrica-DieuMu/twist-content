# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.capacity-l-ml
skill: math.mass-capacity.l-ml
curriculum: en-GB
language: en
title:
  de: Liter und Milliliter
  en: Litres and millilitres
summary: >
  Lesson 1 learns litres and millilitres, 1 l = 1000 ml and half a litre
  = 500 ml, reads a measuring jug in steps of 100 ml (a number line from
  0 to 1000 ml stands in for the jug) and chooses the unit for a
  container; lesson 2 reads a medicine cup in tens of millilitres and a
  bucket in litres, finds what is missing to 1 l, compares 900 ml with
  1 l, and ends with the skill check. An upright measuring jug waits for
  a jug component.
metadata:
  year: year-2
  topic: { de: Rauminhalte, en: Capacity }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mass-capacity.compare-capacity, math.numbers-to-100.number-line]
  also_practises: [math.mass-capacity.compare-capacity]
  vocabulary: { en: [capacity, holds, litre, l, millilitre, ml, measuring jug, scale, half a litre, full, empty] }
  forms: [picture, drawn, text, audio]
  drawn: [number-line]
  facets: [units]
  parts:
    - { id: units, what: { de: "1 l = 1000 ml kennen und damit rechnen", en: knowing and using 1 l = 1000 ml } }
    - { id: read, what: { de: eine Skala am Messbecher ablesen, en: reading the scale on a measuring jug } }
    - { id: give, what: { de: Rauminhalte in Litern oder Millilitern angeben, en: giving a capacity in litres or millilitres } }
  misconceptions:
    - id: litre-as-hundred
      what: Thinks 1 l = 100 ml, as 1 m = 100 cm
      addressed: lesson 1 Learn sets 1 l = 1000 ml; l1-f1 has feedback on 100, l1-s2, l1-n2, l1-c2 and l2-c3 change between l and ml, l2-n4 asks whether 1 l = 100 ml
    - id: every-mark-is-one
      what: Counts each mark on a jug as 1 ml when the marks go up in tens or hundreds
      addressed: lesson 1 Learn says each mark is 100 ml and lesson 2 Learn counts a cup in tens; l1-f2 and l2-f1 have feedback on counting in ones, and every scale reading offers that mistake
    - id: number-not-unit
      what: Thinks 900 ml is more than 1 l because 900 is the bigger number
      addressed: lesson 2 Learn compares 900 ml with 1 l; l2-f4 has feedback on 900 ml, l2-s4 and l2-s5 compare millilitres with a litre
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Am Messbecher ablesen", en: "Reading a measuring jug" }
    goal:
      de: "Lies am Messbecher in Hunderterschritten ab und lerne, dass 1 Liter so viel ist wie 1000 Milliliter."
      en: "Read a measuring jug in steps of 100 millilitres, and learn that 1 litre is 1000 millilitres."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which holds the most water?"
            say: "Which holds the most water?"
            options: ["a bath", "a cup", "a teaspoon"]
            answer: "a bath"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Where is the arrow pointing?"
            say: "Which number is the arrow pointing to?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 40 }
            options: ["40", "4", "50"]
            answer: "40"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "We measure capacity in litres (l) and millilitres (ml)."
            say: "How much a container holds is its capacity. We measure it in litres and millilitres. A teaspoon holds about five millilitres. A big bottle of water often holds one litre."
          - text: "1 l = 1000 ml\nHalf a litre = 500 ml"
            say: "One litre is the same as one thousand millilitres. Half a litre is five hundred millilitres, so five hundred millilitres and five hundred millilitres make one litre."
          - text: "Each mark is 100 ml.\nThe jug has 300 ml in it."
            say: "This is the scale on a measuring jug, lying on its side. It goes from zero to one thousand millilitres. Each mark is one hundred millilitres. The arrow shows where the water comes up to: one hundred, two hundred, three hundred millilitres."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 300 }
          - text: "A cup: about 200 ml\nA big bottle: about 1 l\nA bucket: about 10 l"
            say: "Remember a few things to compare with. A cup holds about two hundred millilitres. A big bottle holds about one litre. A bucket holds about ten litres."
            show: { object: cup }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1 l = _ ml"
                say: "How many millilitres are in one litre?"
                options: ["1000", "100", "10"]
                answer: "1000"
                feedback:
                  "100": "1 m is 100 cm, but 1 l is 1000 ml."
                hints:
                  - "A millilitre is a tiny amount, about a few drops."
                  - "One litre is the same as one thousand millilitres."
                  - "1000."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How much water is in the jug?"
                say: "The jug goes up to one thousand millilitres. How much water is in it?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 600 }
                options: ["600 ml", "6 ml", "60 ml"]
                answer: "600 ml"
                feedback:
                  "6 ml": "Each mark is 100 ml, not 1 ml. Count in hundreds."
                hints:
                  - "Ten marks take you to 1000 ml. What is each mark worth?"
                  - "Each mark is 100 ml. Count in hundreds: 100, 200, 300 ..."
                  - "600 ml."
              - id: l1-f3
                type: multiple_choice
                text: "Which would you measure in litres?"
                say: "Which would you measure in litres?"
                options: ["a bucket of water", "a spoonful of medicine", "a drop of rain"]
                answer: "a bucket of water"
                hints:
                  - "Litres are for containers that hold a lot."
                  - "A spoonful and a drop are tiny."
                  - "A bucket of water."
              - id: l1-f4
                type: true_false
                text: "500 ml + 500 ml = 1 l"
                say: "Is it true? Five hundred millilitres and five hundred millilitres make one litre."
                answer: true
                hints:
                  - "How many millilitres make one litre?"
                  - "500 and 500 make 1000."
                  - "Yes, it is true."
              - id: l1-f5
                type: multiple_choice
                text: "About how much does a cup hold?"
                say: "About how much does a cup hold?"
                show: { object: cup }
                options: ["200 ml", "200 l", "2 ml"]
                answer: "200 ml"
                hints:
                  - "A cup holds much less than a big bottle."
                  - "A big bottle is about 1 l, which is 1000 ml."
                  - "200 ml."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How much water is in the jug?"
                say: "The jug goes up to one thousand millilitres. How much water is in it?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 200 }
                options: ["200 ml", "2 ml", "300 ml"]
                answer: "200 ml"
                hints: ["Each mark is 100 ml."]
              - id: l1-s2
                type: text_input
                text: "Half a litre = _ ml"
                say: "How many millilitres are in half a litre?"
                answer: "500"
                hints: ["1 l is 1000 ml. Half a litre is half of that."]
              - id: l1-s3
                type: multiple_choice
                text: "Which would you measure in millilitres?"
                say: "Which would you measure in millilitres?"
                options: ["a spoonful of medicine", "a bath of water", "a paddling pool"]
                answer: "a spoonful of medicine"
                hints: ["Millilitres are for very small amounts."]
              - id: l1-s4
                type: true_false
                text: "300 ml is more than 1 l."
                say: "Is it true? Three hundred millilitres is more than one litre."
                answer: false
                hints: ["1 l is 1000 ml. Which is more, 300 ml or 1000 ml?"]
              - id: l1-s5
                type: multiple_choice
                text: "About how much does a bucket hold?"
                say: "About how much does a bucket hold?"
                options: ["10 l", "10 ml", "100 l"]
                answer: "10 l"
                hints: ["A bucket holds about as much as ten big bottles."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "How many millilitres are in the jug?"
                say: "The jug goes up to one thousand millilitres. How many millilitres are in it?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 900 }
                answer: "900"
              - id: l1-n2
                type: text_input
                text: "1000 ml = _ l"
                say: "One thousand millilitres is how many litres?"
                answer: "1"
              - id: l1-n3
                type: multiple_choice
                text: "About how much does a big bottle of water hold?"
                say: "About how much does a big bottle of water hold?"
                show: { object: water }
                options: ["1 l", "1 ml", "100 l"]
                answer: "1 l"
              - id: l1-n4
                type: true_false
                text: "Half a litre is 500 ml."
                say: "Is it true? Half a litre is five hundred millilitres."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "A teaspoon holds about 5 _."
                say: "A teaspoon holds about five what? Millilitres or litres?"
                show: { object: spoon }
                options: ["ml", "l"]
                answer: "ml"
                keep_order: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How much water is in the jug?"
            say: "The jug goes up to one thousand millilitres. How much water is in it?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 400 }
            options: ["400 ml", "4 ml", "500 ml"]
            answer: "400 ml"
          - id: l1-c2
            type: multiple_choice
            text: "Which is the same as 1 l?"
            say: "Which is the same as one litre?"
            options: ["1000 ml", "100 ml", "10 ml"]
            answer: "1000 ml"
          - id: l1-c3
            type: multiple_choice
            text: "Which would you measure in litres?"
            say: "Which would you measure in litres?"
            options: ["water in a paddling pool", "a spoonful of syrup", "a drop of milk"]
            answer: "water in a paddling pool"
          - id: l1-c4
            type: text_input
            text: "How many millilitres are in the jug?"
            say: "The jug goes up to one thousand millilitres. How many millilitres are in it?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 500 }
            answer: "500"
          - id: l1-c5
            type: true_false
            text: "1000 ml is more than 1 l."
            say: "Is it true? One thousand millilitres is more than one litre."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Which holds about 10 l?"
            say: "Which holds about ten litres?"
            options: ["a bucket", "a cup", "a teaspoon"]
            answer: "a bucket"

  - n: 2
    title: { de: "Becher, Eimer und 1 Liter", en: "Cups, buckets and 1 litre" }
    goal:
      de: "Lies einen Medizinbecher und einen Eimer ab und finde, was bis 1 Liter fehlt, so wie bei 700 Millilitern noch 300."
      en: "Read a medicine cup and a bucket, and find what is missing to make 1 litre, like 700 millilitres and 300 more."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "1 l = _ ml"
            say: "How many millilitres are in one litre?"
            answer: "1000"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How much water is in the jug?"
            say: "The jug goes up to one thousand millilitres. How much water is in it?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 700 }
            options: ["700 ml", "7 ml", "600 ml"]
            answer: "700 ml"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Each mark is 10 ml.\nThe cup has 60 ml in it."
            say: "This medicine cup goes up to one hundred millilitres. Each mark is ten millilitres, so count in tens: ten, twenty, thirty, forty, fifty, sixty millilitres."
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 60 }
          - text: "Each mark is 1 l.\nThe bucket has 6 l in it."
            say: "This bucket has a scale in litres. It goes up to ten litres, and each mark is one litre. The water comes up to six litres."
            show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 6 }
          - text: "700 ml + _ = 1 l\n700 ml + 300 ml = 1000 ml = 1 l"
            say: "The jug has seven hundred millilitres in it. How much more makes one litre? Count on in hundreds: eight hundred, nine hundred, one thousand. That is three hundreds: three hundred millilitres."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 700 }
          - text: "900 ml or 1 l?\n1 l = 1000 ml, so 1 l is more."
            say: "Which is more, nine hundred millilitres or one litre? Nine hundred looks bigger than one. But one litre is one thousand millilitres, so one litre is more. Always look at the units."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How much is in the cup?"
                say: "The medicine cup goes up to one hundred millilitres. How much is in it?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 30 }
                options: ["30 ml", "3 ml", "40 ml"]
                answer: "30 ml"
                feedback:
                  "3 ml": "Each mark is 10 ml, so count in tens: 10, 20, 30."
                hints:
                  - "Ten marks take you to 100 ml. What is each mark worth?"
                  - "Each mark is 10 ml. Count in tens."
                  - "30 ml."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How much water is in the bucket?"
                say: "The bucket goes up to ten litres. How much water is in it?"
                show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 4 }
                options: ["4 l", "4 ml", "5 l"]
                answer: "4 l"
                hints:
                  - "This scale is in litres. Each mark is 1 l."
                  - "Count the marks from zero: one, two, three, four."
                  - "4 l."
              - id: l2-f3
                type: text_input
                text: "800 ml + _ ml = 1 l"
                say: "Eight hundred millilitres and how many more millilitres make one litre?"
                answer: "200"
                hints:
                  - "1 l is 1000 ml."
                  - "Count on in hundreds from 800: 900, 1000."
                  - "200."
              - id: l2-f4
                type: multiple_choice
                text: "Which is more: 1 l or 900 ml?"
                say: "Which is more: one litre or nine hundred millilitres?"
                options: ["1 l", "900 ml", "They are the same."]
                answer: "1 l"
                feedback:
                  "900 ml": "900 is the bigger number, but 1 l is 1000 ml."
                hints:
                  - "Write both in millilitres."
                  - "1 l is 1000 ml. Which is more, 1000 ml or 900 ml?"
                  - "1 l."
              - id: l2-f5
                type: true_false
                text: "The jug has half a litre in it."
                say: "The jug goes up to one thousand millilitres. Is it true? It has half a litre in it."
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 500 }
                answer: true
                hints:
                  - "Half a litre is 500 ml."
                  - "Count in hundreds to the arrow: 100, 200, 300, 400, 500."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How much is in the cup?"
                say: "The medicine cup goes up to one hundred millilitres. How much is in it?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 70 }
                options: ["70 ml", "7 ml", "80 ml"]
                answer: "70 ml"
                hints: ["Each mark is 10 ml."]
              - id: l2-s2
                type: multiple_choice
                text: "How much water is in the bucket?"
                say: "The bucket goes up to ten litres. How much water is in it?"
                show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 9 }
                options: ["9 l", "9 ml", "8 l"]
                answer: "9 l"
                hints: ["Each mark is 1 l."]
              - id: l2-s3
                type: text_input
                text: "600 ml + _ ml = 1 l"
                say: "Six hundred millilitres and how many more millilitres make one litre?"
                answer: "400"
                hints: ["Count on in hundreds to 1000 ml."]
              - id: l2-s4
                type: true_false
                text: "The jug has 1 l in it."
                say: "The jug goes up to one thousand millilitres. Is it true? It has one litre in it."
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 900 }
                answer: false
                hints: ["1 l is 1000 ml. Is the arrow at the very end?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which is less: 700 ml or 1 l?"
                say: "Which is less: seven hundred millilitres or one litre?"
                options: ["700 ml", "1 l", "They are the same."]
                answer: "700 ml"
                hints: ["1 l is 1000 ml."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "How many millilitres are in the cup?"
                say: "The medicine cup goes up to one hundred millilitres. How many millilitres are in it?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 20 }
                answer: "20"
              - id: l2-n2
                type: text_input
                text: "How many litres are in the bucket?"
                say: "The bucket goes up to ten litres. How many litres are in it?"
                show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 3 }
                answer: "3"
              - id: l2-n3
                type: text_input
                text: "500 ml + _ ml = 1 l"
                say: "Five hundred millilitres and how many more millilitres make one litre?"
                answer: "500"
              - id: l2-n4
                type: true_false
                text: "1 l = 100 ml"
                say: "Is it true? One litre is one hundred millilitres."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "A bottle holds 1 l of juice. Jo pours out 300 ml. How much juice is left?"
                say: "A bottle holds one litre of juice. Jo pours out three hundred millilitres. How much juice is left in the bottle?"
                options: ["700 ml", "300 ml", "1 l"]
                answer: "700 ml"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "How much water is in the jug?"
            say: "The jug goes up to one thousand millilitres. How much water is in it?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 800 }
            options: ["800 ml", "8 ml", "700 ml"]
            answer: "800 ml"
          - id: l2-c2
            part: read
            type: text_input
            text: "How many millilitres are in the cup?"
            say: "The medicine cup goes up to one hundred millilitres. How many millilitres are in it?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 90 }
            answer: "90"
          - id: l2-c3
            part: units
            type: multiple_choice
            text: "Which is the same as half a litre?"
            say: "Which is the same as half a litre?"
            options: ["500 ml", "50 ml", "5 ml"]
            answer: "500 ml"
          - id: l2-c4
            part: give
            type: multiple_choice
            text: "About how much does a watering can hold?"
            say: "About how much water does a watering can hold?"
            options: ["5 l", "5 ml", "50 l"]
            answer: "5 l"
          - id: l2-c5
            part: units
            type: true_false
            text: "200 ml + 800 ml = 1 l"
            say: "Is it true? Two hundred millilitres and eight hundred millilitres make one litre."
            answer: true
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "How much water is in the bucket?"
            say: "The bucket goes up to ten litres. How much water is in it?"
            show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 7 }
            options: ["7 l", "7 ml", "6 l"]
            answer: "7 l"
          - id: l2-c7
            part: read
            type: text_input
            text: "How many millilitres are in the jug?"
            say: "The jug goes up to one thousand millilitres. How many millilitres are in it?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 100 }
            answer: "100"
          - id: l2-c8
            part: read
            type: true_false
            text: "The cup has 50 ml in it."
            say: "The medicine cup goes up to one hundred millilitres. Is it true? It has fifty millilitres in it."
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 40 }
            answer: false
          - id: l2-c9
            part: read
            type: multiple_choice
            text: "How much is in the cup?"
            say: "The medicine cup goes up to one hundred millilitres. How much is in it?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 80 }
            options: ["80 ml", "8 ml", "90 ml"]
            answer: "80 ml"
          - id: l2-c10
            part: read
            type: text_input
            text: "How many litres are in the bucket?"
            say: "The bucket goes up to ten litres. How many litres are in it?"
            show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 8 }
            answer: "8"
          - id: l2-c11
            part: units
            type: multiple_choice
            text: "Which is the same as 1000 ml?"
            say: "Which is the same as one thousand millilitres?"
            options: ["1 l", "10 l", "100 l"]
            answer: "1 l"
          - id: l2-c12
            part: units
            type: text_input
            text: "900 ml + _ ml = 1 l"
            say: "Nine hundred millilitres and how many more millilitres make one litre?"
            answer: "100"
          - id: l2-c13
            part: units
            type: multiple_choice
            text: "Which is the most?"
            say: "Which is the most?"
            options: ["1 l", "800 ml", "500 ml"]
            answer: "1 l"
          - id: l2-c14
            part: units
            type: true_false
            text: "400 ml + 400 ml = 1 l"
            say: "Is it true? Four hundred millilitres and four hundred millilitres make one litre."
            answer: false
          - id: l2-c15
            part: units
            type: text_input
            text: "A jug has 1 l of water. Sam pours out 500 ml. How many millilitres are left?"
            say: "A jug has one litre of water. Sam pours out five hundred millilitres. How many millilitres are left?"
            answer: "500"
          - id: l2-c16
            part: give
            type: multiple_choice
            text: "Which holds about 1 l?"
            say: "Which holds about one litre?"
            options: ["a big bottle of water", "a teaspoon", "a bath"]
            answer: "a big bottle of water"
          - id: l2-c17
            part: give
            type: multiple_choice
            text: "About how much does a teaspoon hold?"
            say: "About how much does a teaspoon hold?"
            show: { object: spoon }
            options: ["5 ml", "5 l", "50 l"]
            answer: "5 ml"
          - id: l2-c18
            part: give
            type: true_false
            text: "A bucket holds about 10 ml."
            say: "Is it true? A bucket holds about ten millilitres."
            show: { object: bucket }
            answer: false
          - id: l2-c19
            part: give
            type: sorting
            text: "Litres or millilitres?"
            say: "Would you measure it in litres or in millilitres? Sort them."
            bins:
              - { id: l, show: { text: "litres" }, say: "litres" }
              - { id: ml, show: { text: "millilitres" }, say: "millilitres" }
            options:
              - { object: bath, bin: l }
              - { object: spoon, bin: ml }
              - { object: bucket, bin: l }
              - { object: cup, bin: ml }
          - id: l2-c20
            part: give
            type: multiple_choice
            text: "Which holds about 200 ml?"
            say: "Which holds about two hundred millilitres?"
            options: ["a cup of tea", "a bucket of water", "a teaspoon of milk"]
            answer: "a cup of tea"
