# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.money-to-20
skill: math.money.amounts-to-20
curriculum: en-GB
language: en
title:
  de: Geldbeträge bis 20 legen und zählen
  en: Making and counting money to 20
summary: >
  Lesson 1 counts amounts up to 20p in coins, starting with the coin worth
  the most and counting on (10p + 5p + 2p = 17p), and counts the value,
  not the number of coins; lesson 2 counts pounds in coins and notes up
  to £20, makes one amount in different ways, finds who has more money,
  and ends with the skill check. Pence and pounds are never mixed in one
  amount, as Year 2 asks for money of the same unit. Dragging coins onto
  a purse waits for a drag task.
metadata:
  year: year-2
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.money.coins-notes, math.add-sub-to-20.add-bridge-10]
  also_practises: [math.money.coins-notes, math.add-sub-to-20.add-bridge-10]
  vocabulary: { en: [pence, pound, coin, note, amount, total, worth, count on, make an amount, more money] }
  forms: [text, audio, drawn]
  drawn: [coins]
  facets: [currency]
  parts:
    - { id: count-pence, what: { de: Münzen bis 20p zählen, en: counting coins up to 20p } }
    - { id: count-pounds, what: { de: Scheine und Münzen bis 20 Pfund zählen, en: counting notes and coins up to £20 } }
    - { id: make, what: { de: einen Betrag mit Münzen oder Scheinen legen, en: making an amount with coins or notes } }
    - { id: more, what: { de: "herausfinden, wer mehr Geld hat", en: finding out who has more money } }
  misconceptions:
    - id: counts-coins
      what: Counts the coins instead of their value (four 2p coins are 4p)
      addressed: lesson 1 Learn counts three 2p coins as 6p; l1-f2 (with feedback), l1-s2, l1-s4, l1-n2 and l2-c5 offer the number of coins as an answer; l2-f4 (with feedback), l2-n4 and l2-c4 give more coins to the child with less money
    - id: one-way-only
      what: Thinks an amount can be made in only one way
      addressed: lesson 2 Learn makes 20p as one coin, as two 10p coins and as 10p + 5p + 5p; l2-f3 asks whether three 5p coins also make 15p, l2-f5, l2-s5 and l2-n5 choose one way of making an amount
    - id: biggest-coin-last
      what: Counts in any order and loses track, instead of starting with the coin worth the most
      addressed: lesson 1 Learn starts with the coin worth the most; hints in l1-f1, l1-f3 and l1-f5 say to start there
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wie viel Geld ist das?", en: "How much money is it?" }
    goal:
      de: "Zähl Münzen bis 20 Pence nach ihrem Wert, nicht nach ihrer Anzahl, so wie 10, 15, 17 Pence."
      en: "Count coins up to 20 pence by what they are worth, not how many, like 10, 15, 17 pence."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Which is the 10p coin?"
            say: "Tap the ten pence coin."
            options:
              - { drawn: coins, values: [10] }
              - { drawn: coins, values: [1] }
              - { drawn: coins, values: [20] }
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "9 + 5 = _"
            say: "Nine add five."
            answer: "14"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10p + 5p + 2p = 17p"
            say: "How much money is here? Start with the coin worth the most: ten pence. Count on five: fifteen. Count on two: seventeen. That is seventeen pence."
            show: { drawn: coins, values: [10, 5, 2] }
          - text: "3 coins, but 6p"
            say: "Here are three coins. That is not three pence. Each coin is worth two pence: two, four, six. That is six pence. Always count what the coins are worth."
            show: { drawn: coins, values: [2, 2, 2] }
          - text: "1 coin, but 20p"
            say: "This one coin is worth twenty pence. One coin can be worth more than lots of small coins."
            show: { drawn: coins, values: [20] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "How many pence is this?"
                say: "Count the money. How many pence is this?"
                show: { drawn: coins, values: [5, 2] }
                answer: "7"
                hints:
                  - "Start with the coin worth the most."
                  - "Five pence, then count on two."
                  - "7p."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How much money is this?"
                say: "How much money is this?"
                show: { drawn: coins, values: [2, 2, 2, 2] }
                options: ["8p", "4p", "6p"]
                answer: "8p"
                feedback:
                  "4p": "There are four coins, but each one is worth 2p. Count in twos: 2, 4, 6, 8."
                hints:
                  - "Each coin is worth 2p."
                  - "Count in twos: 2, 4, and on."
                  - "8p."
              - id: l1-f3
                type: text_input
                text: "How many pence is this?"
                say: "Count the money. How many pence is this?"
                show: { drawn: coins, values: [10, 5, 1] }
                answer: "16"
                hints:
                  - "Start with the 10p coin."
                  - "Ten, then five more makes fifteen, then one more."
                  - "16p."
              - id: l1-f4
                type: true_false
                text: "Is it true? This is 13p."
                say: "Is it true? This is thirteen pence."
                show: { drawn: coins, values: [10, 2, 1] }
                answer: true
                hints:
                  - "Start with the 10p and count on."
                  - "Ten, twelve, then one more."
                  - "Yes. 10p + 2p + 1p = 13p."
              - id: l1-f5
                type: text_input
                text: "How many pence is this?"
                say: "Count the money. How many pence is this?"
                show: { drawn: coins, values: [10, 5, 2, 2] }
                answer: "19"
                hints:
                  - "Start with the coin worth the most, then the next one."
                  - "Ten, fifteen, seventeen, and two more."
                  - "19p."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "How many pence is this?"
                say: "Count the money. How many pence is this?"
                show: { drawn: coins, values: [5, 2, 1] }
                answer: "8"
                hints: ["Five, then count on two, then one."]
              - id: l1-s2
                type: multiple_choice
                text: "How much money is this?"
                say: "How much money is this?"
                show: { drawn: coins, values: [5, 5, 5] }
                options: ["15p", "3p", "10p"]
                answer: "15p"
                hints: ["Each coin is worth 5p. Count in fives."]
              - id: l1-s3
                type: text_input
                text: "How many pence is this?"
                say: "Count the money. How many pence is this?"
                show: { drawn: coins, values: [10, 10] }
                answer: "20"
                hints: ["Ten, and ten more."]
              - id: l1-s4
                type: true_false
                text: "Is it true? This is 4p."
                say: "Is it true? This is four pence."
                show: { drawn: coins, values: [5, 5, 2, 2] }
                answer: false
                hints: ["Do not count the coins. Count what they are worth."]
              - id: l1-s5
                type: text_input
                text: "How many pence is this?"
                say: "Count the money. How many pence is this?"
                show: { drawn: coins, values: [10, 2, 2, 1] }
                answer: "15"
                hints: ["Ten, twelve, fourteen, and one more."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "How many pence is this?"
                say: "Count the money. How many pence is this?"
                show: { drawn: coins, values: [10, 1, 1] }
                answer: "12"
              - id: l1-n2
                type: multiple_choice
                text: "How much money is this?"
                say: "How much money is this?"
                show: { drawn: coins, values: [2, 2, 2, 2, 2, 2] }
                options: ["12p", "6p", "10p"]
                answer: "12p"
              - id: l1-n3
                type: text_input
                text: "How many pence is this?"
                say: "Count the money. How many pence is this?"
                show: { drawn: coins, values: [5, 2, 2, 1] }
                answer: "10"
              - id: l1-n4
                type: true_false
                text: "Is it true? This is 18p."
                say: "Is it true? This is eighteen pence."
                show: { drawn: coins, values: [10, 5, 2, 1] }
                answer: true
              - id: l1-n5
                type: text_input
                text: "How many pence is this?"
                say: "Count the money. How many pence is this?"
                show: { drawn: coins, values: [10, 5, 2, 1, 1] }
                answer: "19"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "How many pence is this?"
            say: "Count the money. How many pence is this?"
            show: { drawn: coins, values: [10, 5] }
            answer: "15"
          - id: l1-c2
            type: multiple_choice
            text: "How much money is this?"
            say: "How much money is this?"
            show: { drawn: coins, values: [5, 5] }
            options: ["10p", "2p", "5p"]
            answer: "10p"
          - id: l1-c3
            type: text_input
            text: "How many pence is this?"
            say: "Count the money. How many pence is this?"
            show: { drawn: coins, values: [10, 2, 2, 2] }
            answer: "16"
          - id: l1-c4
            type: text_input
            text: "How many pence is this?"
            say: "Count the money. How many pence is this?"
            show: { drawn: coins, values: [5, 5, 1] }
            answer: "11"
          - id: l1-c5
            type: multiple_choice
            text: "How much money is this?"
            say: "How much money is this?"
            show: { drawn: coins, values: [2, 2, 2, 2, 2, 2, 2] }
            options: ["14p", "7p", "12p"]
            answer: "14p"
          - id: l1-c6
            type: true_false
            text: "Is it true? This is 17p."
            say: "Is it true? This is seventeen pence."
            show: { drawn: coins, values: [10, 5, 1, 1] }
            answer: true

  - n: 2
    title: { de: "Beträge legen, auch in Pfund", en: "Making amounts, in pence and pounds" }
    goal:
      de: "Leg Beträge bis 20 auf verschiedene Arten, wie 20 Pence aus zwei 10-Pence-Münzen, und finde heraus, wer mehr hat."
      en: "Make amounts up to 20 in different ways, like 20 pence from two 10 pence coins, and find who has more."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "How many pence is this?"
            say: "Count the money. How many pence is this?"
            show: { drawn: coins, values: [5, 2, 2] }
            answer: "9"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How much money is this?"
            say: "How much money is this?"
            show: { drawn: coins, values: [2, 2, 2] }
            options: ["6p", "3p", "5p"]
            answer: "6p"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "£10 + £5 + £2 = £17"
            say: "Pounds work the same way. Start with the note worth the most: ten pounds. Count on five: fifteen. Count on two: seventeen pounds."
            show: { drawn: coins, values: [1000, 500, 200] }
          - text: "14p = 10p + 2p + 2p"
            say: "Ava wants to make fourteen pence. She takes ten pence first. Four pence more are needed, so she adds two 2p coins."
            show: { drawn: coins, values: [10, 2, 2] }
          - text: "20p = 10p + 10p = 10p + 5p + 5p"
            say: "You can make an amount in different ways. Twenty pence can be one 20p coin, two 10p coins, or 10p, 5p and 5p."
            show: { drawn: coins, values: [10, 5, 5] }
          - text: "Sam: £10 + £5 = £15\nZoe: £5 + £5 + £2 = £12"
            say: "Sam has a ten pound note and a five pound note: fifteen pounds. Zoe has more notes and coins, but only twelve pounds. Sam has more money."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "A pencil costs 12p. Which coins make 12p?"
                say: "A pencil costs twelve pence. Which coins make twelve pence?"
                options:
                  - { drawn: coins, values: [10, 2] }
                  - { drawn: coins, values: [10, 1] }
                  - { drawn: coins, values: [5, 2] }
                answer: "12"
                hints:
                  - "Count the money in each picture."
                  - "Ten and two make twelve."
                  - "The 10p coin and the 2p coin."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "What is missing?"
                say: "Fifteen pounds is ten pounds and how much more?"
                frame: "£15 = £10 + _"
                options: ["£5", "£2", "£1"]
                answer: ["£5"]
                hints:
                  - "Count on from ten to fifteen."
                  - "Ten add what makes fifteen?"
                  - "£5."
              - id: l2-f3
                type: true_false
                text: "Is it true? This is also 15p."
                say: "Mia makes fifteen pence with only 5p coins. Is it true? This is also fifteen pence."
                show: { drawn: coins, values: [5, 5, 5] }
                answer: true
                hints:
                  - "Count in fives."
                  - "Five, ten, and one more five."
                  - "Yes. 5p + 5p + 5p = 15p."
              - id: l2-f4
                type: multiple_choice
                text: "Tom has £10 + £2.\nIsla has £5 + £2 + £2 + £2.\nWho has more money?"
                say: "Tom has a ten pound note and a two pound coin. Isla has a five pound note and three two pound coins. Who has more money?"
                options: ["Tom", "Isla"]
                answer: "Tom"
                feedback:
                  "Isla": "Isla has more notes and coins. But count the value: Isla has £11 and Tom has £12."
                hints:
                  - "Work out how much each child has."
                  - "Tom: 10 and 2. Isla: 5, 7, 9, 11."
                  - "Tom has £12, Isla has £11. Tom has more."
              - id: l2-f5
                type: multiple_choice
                text: "How can you make 9p?"
                say: "Leo wants to pay nine pence. Which coins make nine pence?"
                options: ["5p + 2p + 2p", "5p + 2p + 1p", "5p + 5p"]
                answer: "5p + 2p + 2p"
                hints:
                  - "Add up each set of coins."
                  - "Five, seven, nine."
                  - "5p + 2p + 2p."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "A book costs £16. Which money makes £16?"
                say: "A book costs sixteen pounds. Which money makes sixteen pounds?"
                options:
                  - { drawn: coins, values: [1000, 500, 100] }
                  - { drawn: coins, values: [1000, 500] }
                  - { drawn: coins, values: [500, 500, 200] }
                answer: "1600"
                hints: ["Count each picture. Start with the note worth the most."]
              - id: l2-s2
                type: fill_in_blank
                text: "What is missing?"
                say: "Seventeen pence is ten pence and five pence and how much more?"
                frame: "17p = 10p + 5p + _"
                options: ["2p", "1p", "5p"]
                answer: ["2p"]
                hints: ["Ten and five make fifteen. How many more to seventeen?"]
              - id: l2-s3
                type: true_false
                text: "Is it true? This is £20."
                say: "Grace wants to make twenty pounds. Is it true? This is twenty pounds."
                show: { drawn: coins, values: [1000, 200, 200, 200, 200] }
                answer: false
                hints: ["Start at ten, then count on in twos."]
              - id: l2-s4
                type: multiple_choice
                text: "Lily has £5 + £5 + £5.\nJack has £20.\nWho has more money?"
                say: "Lily has three five pound notes. Jack has one twenty pound note. Who has more money?"
                options: ["Lily", "Jack"]
                answer: "Jack"
                hints: ["Lily has three notes. How many pounds is that?"]
              - id: l2-s5
                type: multiple_choice
                text: "How can you make 13p?"
                say: "Freya buys a sticker for thirteen pence. Which coins make thirteen pence?"
                options: ["10p + 2p + 1p", "10p + 2p + 2p", "5p + 5p + 2p"]
                answer: "10p + 2p + 1p"
                hints: ["Add up each set of coins."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which coins make 11p?"
                say: "Which coins make eleven pence?"
                options:
                  - { drawn: coins, values: [10, 1] }
                  - { drawn: coins, values: [5, 5] }
                  - { drawn: coins, values: [10, 2] }
                answer: "11"
              - id: l2-n2
                type: fill_in_blank
                text: "What is missing?"
                say: "Twenty pounds is ten pounds and how much more?"
                frame: "£20 = £10 + _"
                options: ["£10", "£5", "£2"]
                answer: ["£10"]
              - id: l2-n3
                type: true_false
                text: "Is it true? This is 10p."
                say: "Ben pays for a biscuit with these coins. Is it true? This is ten pence."
                show: { drawn: coins, values: [5, 2, 2, 1] }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Ella has £10 + £5 + £2.\nNoah has £5 + £5 + £2 + £2 + £2.\nWho has more money?"
                say: "Ella has ten pounds, five pounds and two pounds. Noah has two five pound notes and three two pound coins. Who has more money?"
                options: ["Ella", "Noah"]
                answer: "Ella"
              - id: l2-n5
                type: multiple_choice
                text: "How can you make £19?"
                say: "A football costs nineteen pounds. Which money makes nineteen pounds?"
                options: ["£10 + £5 + £2 + £2", "£10 + £5 + £2 + £1", "£10 + £5 + £5"]
                answer: "£10 + £5 + £2 + £2"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: count-pounds
            type: text_input
            text: "How many pounds is this?"
            say: "Count the money. How many pounds is this?"
            show: { drawn: coins, values: [1000, 200, 100] }
            answer: "13"
          - id: l2-c2
            part: make
            type: image_multiple_choice
            text: "Which coins make 18p?"
            say: "Tap the coins that make eighteen pence."
            options:
              - { drawn: coins, values: [10, 5, 2, 1] }
              - { drawn: coins, values: [10, 5, 1] }
              - { drawn: coins, values: [5, 5, 5, 2] }
            answer: "18"
          - id: l2-c3
            part: make
            type: fill_in_blank
            text: "What is missing?"
            say: "Sixteen pence is ten pence and five pence and how much more?"
            frame: "16p = 10p + 5p + _"
            options: ["1p", "2p", "5p"]
            answer: ["1p"]
          - id: l2-c4
            part: more
            type: multiple_choice
            text: "Jay has £10 + £10.\nRuby has £5 + £5 + £5 + £2.\nWho has more money?"
            say: "Jay has two ten pound notes. Ruby has three five pound notes and a two pound coin. Who has more money?"
            options: ["Jay", "Ruby"]
            answer: "Jay"
          - id: l2-c5
            part: count-pence
            type: true_false
            text: "Is it true? This is 5p."
            say: "Is it true? This is five pence."
            show: { drawn: coins, values: [2, 2, 2, 2, 2] }
            answer: false
          - id: l2-c6
            part: count-pence
            type: text_input
            text: "How many pence is this?"
            say: "Count the money. How many pence is this?"
            show: { drawn: coins, values: [10, 2, 2, 2, 1] }
            answer: "17"
          - id: l2-c7
            part: count-pence
            type: multiple_choice
            text: "How much money is this?"
            say: "How much money is this?"
            show: { drawn: coins, values: [5, 5, 2, 2, 2] }
            options: ["16p", "5p", "15p"]
            answer: "16p"
          - id: l2-c8
            part: count-pence
            type: true_false
            text: "Is it true? This is 14p."
            say: "Is it true? This is fourteen pence."
            show: { drawn: coins, values: [10, 2, 1, 1] }
            answer: true
          - id: l2-c9
            part: count-pence
            type: multiple_choice
            text: "How much money is this?"
            say: "How much money is this?"
            show: { drawn: coins, values: [10, 5, 1, 1, 1] }
            options: ["18p", "5p", "17p"]
            answer: "18p"
          - id: l2-c10
            part: count-pounds
            type: text_input
            text: "How many pounds is this?"
            say: "Count the money. How many pounds is this?"
            show: { drawn: coins, values: [1000, 500, 200, 200] }
            answer: "19"
          - id: l2-c11
            part: count-pounds
            type: multiple_choice
            text: "How much money is this?"
            say: "How much money is this?"
            show: { drawn: coins, values: [500, 500, 200, 100] }
            options: ["£13", "£4", "£12"]
            answer: "£13"
          - id: l2-c12
            part: count-pounds
            type: true_false
            text: "Is it true? This is £18."
            say: "Is it true? This is eighteen pounds."
            show: { drawn: coins, values: [1000, 500, 200, 100] }
            answer: true
          - id: l2-c13
            part: count-pounds
            type: multiple_choice
            text: "How much money is this?"
            say: "How much money is this?"
            show: { drawn: coins, values: [500, 200, 200, 200, 100] }
            options: ["£12", "£5", "£11"]
            answer: "£12"
          - id: l2-c14
            part: make
            type: image_multiple_choice
            text: "A lolly costs 7p. Which coins make 7p?"
            say: "A lolly costs seven pence. Which coins make seven pence?"
            options:
              - { drawn: coins, values: [5, 1] }
              - { drawn: coins, values: [2, 2, 2] }
              - { drawn: coins, values: [5, 2] }
            answer: "7"
          - id: l2-c15
            part: make
            type: fill_in_blank
            text: "What is missing?"
            say: "Twelve pounds is five pounds and five pounds and how much more?"
            frame: "£12 = £5 + £5 + _"
            options: ["£2", "£1", "£5"]
            answer: ["£2"]
          - id: l2-c16
            part: make
            type: multiple_choice
            text: "How can you make 16p?"
            say: "Ruby wants to pay sixteen pence. Which coins make sixteen pence?"
            options: ["10p + 5p + 1p", "10p + 2p + 2p", "5p + 5p + 5p"]
            answer: "10p + 5p + 1p"
          - id: l2-c17
            part: more
            type: multiple_choice
            text: "Mo has £10 + £5.\nAva has £5 + £2 + £2 + £2 + £2.\nWho has more money?"
            say: "Mo has a ten pound note and a five pound note. Ava has a five pound note and four two pound coins. Who has more money?"
            options: ["Mo", "Ava"]
            answer: "Mo"
          - id: l2-c18
            part: more
            type: multiple_choice
            text: "Kim has 10p + 5p.\nLeo has 2p + 2p + 2p + 2p + 2p.\nWho has more money?"
            say: "Kim has a ten pence coin and a five pence coin. Leo has five two pence coins. Who has more money?"
            options: ["Kim", "Leo"]
            answer: "Kim"
          - id: l2-c19
            part: more
