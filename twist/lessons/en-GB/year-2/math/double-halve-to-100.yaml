# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.double-halve-to-100
skill: math.numbers-to-100.double-halve
curriculum: en-GB
language: en
title:
  de: Verdoppeln und halbieren bis 100
  en: Doubling and halving to 100
summary: >
  Doubling numbers to 50 and halving even numbers to 100 by partitioning:
  double 34 is double 30 and double 4. Lesson 1 doubles; lesson 2 halves,
  including an odd number of tens (half of 50 is 25), with sharing between
  two friends, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.double-halve-to-20, math.numbers-to-100.place-value]
  also_practises: [math.numbers-to-100.bundle-tens]
  vocabulary: { en: [double, twice, half, halve, share equally, even] }
  forms: [drawn, text, audio]
  drawn: [base-ten, part-whole]
  facets: []
  misconceptions:
    - id: double-ones-only
      what: Doubles only the ones (double 14 as 18)
      addressed: Learn doubles tens and ones separately; feedback on 18 for double 14 says so
    - id: half-of-odd-tens
      what: Cannot halve 50 or 70 because 5 and 7 tens do not share equally
      addressed: lesson 2 Learn exchanges one ten for ten ones before halving
    - id: double-adds-two
      what: Thinks doubling means adding 2
      addressed: Learn says double means the same amount again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Verdoppeln, en: Doubling }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Double 6"
            say: "What is double six?"
            options: ["8", "12", "66"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Half of 10"
            say: "What is half of ten?"
            options: ["5", "2", "20"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "23"
            say: "Double means the same amount again. Here is twenty-three: two tens and three ones."
            show: { drawn: base-ten, tens: 2, ones: 3 }
          - text: "23 + 23"
            say: "We put another twenty-three next to it. Now there are four tens and six ones."
            show: { drawn: base-ten, tens: 4, ones: 6 }
          - text: "Double 23 is 46"
            say: "A quick way: partition, then double each part. Double twenty is forty, double three is six. Forty and six make forty-six."
            show: { drawn: part-whole, whole: 23, parts: [20, 3] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Double 30"
                say: "What is double thirty?"
                show: { drawn: base-ten, tens: 3, ones: 0 }
                options: ["32", "60", "33"]
                answer: "60"
                hints:
                  - "Three more tens."
                  - "Three tens and three tens make six tens."
                  - "Double 30 is 60."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Double 14"
                say: "What is double fourteen?"
                show: { drawn: base-ten, tens: 1, ones: 4 }
                options: ["18", "28", "24"]
                answer: "28"
                feedback:
                  "18": "You doubled the ones. Double the ten as well."
                hints:
                  - "Double the tens and the ones separately."
                  - "Double 10 is 20, double 4 is 8."
                  - "20 and 8 make 28."
              - id: l1-f3
                type: fill_in_blank
                text: "Double 32"
                frame: "60 + _ = _"
                options: ["2", "4", "62", "64"]
                answer: ["4", "64"]
                hints:
                  - "Double 30 is 60."
                  - "Double 2 is 4."
                  - "60 + 4 = 64."
              - id: l1-f4
                type: true_false
                text: "Is it true? Double 25 is 50."
                answer: true
                hints:
                  - "Double 20 is 40."
                  - "Double 5 is 10."
                  - "40 and 10 make 50. Yes."
              - id: l1-f5
                type: text_input
                text: "Amir has 41p. Isla has double that. How much does Isla have?"
                answer: "82"
                hints:
                  - "Double 41."
                  - "Double 40 is 80, double 1 is 2."
                  - "Isla has 82p."
              - id: l1-f6
                type: multiple_choice
                text: "Double 16"
                say: "What is double sixteen?"
                show: { drawn: base-ten, tens: 1, ones: 6 }
                options: ["22", "32", "26"]
                answer: "32"
                hints:
                  - "Double 6 is 12. That is more than ten."
                  - "20 and 12."
                  - "That makes 32."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Double 40"
                say: "What is double forty?"
                options: ["42", "80", "44"]
                answer: "80"
                hints: ["Four tens and four tens."]
              - id: l1-s2
                type: multiple_choice
                text: "Double 21"
                say: "What is double twenty-one?"
                options: ["42", "23", "41"]
                answer: "42"
                hints: ["Tens and ones separately."]
              - id: l1-s3
                type: text_input
                text: "Double 13"
                answer: "26"
                hints: ["20 and 6."]
              - id: l1-s4
                type: true_false
                text: "Is it true? Double 34 is 36."
                answer: false
                hints: ["Did you double the tens too?"]
              - id: l1-s5
                type: multiple_choice
                text: "Double 35"
                say: "What is double thirty-five?"
                options: ["60", "70", "65"]
                answer: "70"
                hints: ["60 and 10."]
              - id: l1-s6
                type: text_input
                text: "A box has 44 crayons. How many crayons are in two boxes?"
                answer: "88"
                hints: ["Double 44."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Double 50"
                say: "What is double fifty?"
                options: ["55", "100", "52"]
                answer: "100"
              - id: l1-n2
                type: text_input
                text: "Double 23"
                answer: "46"
              - id: l1-n3
                type: multiple_choice
                text: "Double 18"
                say: "What is double eighteen?"
                options: ["26", "36", "28"]
                answer: "36"
              - id: l1-n4
                type: true_false
                text: "Is it true? Double 42 is 84."
                answer: true
              - id: l1-n5
                type: text_input
                text: "Double 15"
                answer: "30"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Double 31"
            answer: "62"
          - id: l1-c2
            type: multiple_choice
            text: "Double 20"
            say: "What is double twenty?"
            options: ["22", "40", "200"]
            answer: "40"
          - id: l1-c3
            type: multiple_choice
            text: "Double 17"
            say: "What is double seventeen?"
            options: ["24", "34", "27"]
            answer: "34"

  - n: 2
    title: { de: Halbieren, en: Halving }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Double 24"
            say: "What is double twenty-four?"
            options: ["28", "48", "44"]
            answer: "48"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Double 10"
            say: "What is double ten?"
            options: ["12", "20", "100"]
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Half of 68"
            say: "To halve means to split into two equal parts. Let's halve sixty-eight. Half of sixty is thirty, half of eight is four. That makes thirty-four."
            show: { drawn: base-ten, tens: 6, ones: 8 }
          - text: "Half of 50"
            say: "Five tens will not share equally between two. So we exchange one ten for ten ones. Now there are four tens and ten ones."
            show: { drawn: base-ten, tens: 4, ones: 10 }
          - text: "25"
            say: "Each half gets two tens and five ones. Half of fifty is twenty-five. Check it: double twenty-five is fifty."
            show: { drawn: base-ten, tens: 2, ones: 5 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Half of 80"
                say: "What is half of eighty?"
                show: { drawn: base-ten, tens: 8, ones: 0 }
                options: ["40", "4", "160"]
                answer: "40"
                hints:
                  - "Share the tens into two equal groups."
                  - "Eight tens: each half gets four tens."
                  - "Half of 80 is 40."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Half of 46"
                say: "What is half of forty-six?"
                show: { drawn: base-ten, tens: 4, ones: 6 }
                options: ["23", "26", "43"]
                answer: "23"
                hints:
                  - "Halve the tens and the ones separately."
                  - "Half of 40 is 20, half of 6 is 3."
                  - "20 and 3 make 23."
              - id: l2-f3
                type: multiple_choice
                text: "Half of 30"
                say: "What is half of thirty?"
                show: { drawn: base-ten, tens: 3, ones: 0 }
                options: ["15", "10", "60"]
                answer: "15"
                hints:
                  - "Three tens will not share equally."
                  - "Exchange one ten for ten ones: two tens and ten ones."
                  - "Each half: one ten and five ones. That is 15."
              - id: l2-f4
                type: text_input
                text: "Poppy and Jack share 62 stickers equally. How many does each get?"
                answer: "31"
                hints:
                  - "Share equally between two: find half."
                  - "Half of 60 is 30, half of 2 is 1."
                  - "Each gets 31."
              - id: l2-f5
                type: true_false
                text: "Is it true? Half of 84 is 42."
                answer: true
                hints:
                  - "Half of 80 is 40."
                  - "Half of 4 is 2."
                  - "Yes, 42."
              - id: l2-f6
                type: multiple_choice
                text: "Half of 70"
                say: "What is half of seventy?"
                options: ["35", "30", "140"]
                answer: "35"
                hints:
                  - "Seven tens will not share equally."
                  - "Six tens and ten ones. Each half: three tens and five ones."
                  - "Half of 70 is 35."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Half of 60"
                say: "What is half of sixty?"
                options: ["30", "3", "120"]
                answer: "30"
                hints: ["Share six tens."]
              - id: l2-s2
                type: text_input
                text: "Half of 48"
                answer: "24"
                hints: ["20 and 4."]
              - id: l2-s3
                type: multiple_choice
                text: "Half of 90"
                say: "What is half of ninety?"
                options: ["45", "40", "180"]
                answer: "45"
                hints: ["Exchange one ten for ten ones."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Half of 26 is 16."
                answer: false
                hints: ["Check by doubling."]
              - id: l2-s5
                type: text_input
                text: "A bag of 100 marbles is shared equally between two children. How many does each get?"
                answer: "50"
                hints: ["Double 50 is 100."]
              - id: l2-s6
                type: text_input
                text: "Half of 66"
                answer: "33"
                hints: ["30 and 3."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Half of 40"
                say: "What is half of forty?"
                options: ["20", "4", "80"]
                answer: "20"
              - id: l2-n2
                type: text_input
                text: "Half of 86"
                answer: "43"
              - id: l2-n3
                type: multiple_choice
                text: "Half of 50"
                say: "What is half of fifty?"
                options: ["25", "20", "100"]
                answer: "25"
              - id: l2-n4
                type: true_false
                text: "Is it true? Half of 28 is 14."
                answer: true
              - id: l2-n5
                type: text_input
                text: "Half of 24"
                answer: "12"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Double 43"
            answer: "86"
          - id: l2-c2
            type: multiple_choice
            text: "Double 19"
            say: "What is double nineteen?"
            options: ["28", "38", "29"]
            answer: "38"
          - id: l2-c3
            type: text_input
            text: "Half of 64"
            answer: "32"
          - id: l2-c4
            type: multiple_choice
            text: "Half of 52"
            say: "What is half of fifty-two?"
            options: ["26", "21", "104"]
            answer: "26"
          - id: l2-c5
            type: text_input
            text: "Isla and Amir share 30p equally. How much does each get?"
            answer: "15"
