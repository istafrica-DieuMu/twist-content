# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.add-sub-tens
skill: math.add-sub-to-100.tens
curriculum: en-GB
language: en
title:
  de: Mit Zehnern rechnen
  en: Adding and subtracting tens
summary: >
  Adding and subtracting multiples of ten using facts to 10. Lesson 1
  adds tens (30 + 40 = 70, because 3 + 4 = 7) with tens rods; lesson 2
  subtracts tens (90 − 60 = 30) and finds the missing tens to make 100,
  and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen mit Zehnern, en: Adding and subtracting tens }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.tens, math.add-sub-to-20.sub-to-10]
  also_practises: [math.numbers-to-20.partition-to-10]
  vocabulary: { en: [tens, add, subtract, total, difference, related fact] }
  forms: [drawn, text, audio]
  drawn: [base-ten, coins]
  facets: [currency]
  parts:
    - { id: add, what: { de: Zehnerzahlen mit dem Einspluseins addieren, en: adding multiples of ten with a fact to 10 } }
    - { id: subtract, what: { de: Zehnerzahlen mit dem Einsminuseins subtrahieren, en: subtracting multiples of ten with a fact to 10 } }
    - { id: to-100, what: { de: die fehlende Zehnerzahl bis 100 finden, en: finding the missing multiple of ten to make 100 } }
  misconceptions:
    - id: ones-answer
      what: Writes the small fact's answer without the zero (30 + 40 = 7)
      addressed: lesson 1 Learn counts in tens (two tens and five tens make seven tens); a missing-zero option in every Practise stage of both lessons, with feedback in l1-f1 and l2-f1; l1-s4 and l2-c4 are false statements with the zero missing
    - id: extra-zero
      what: Adds a zero too many (30 + 40 = 700)
      addressed: options with an extra zero in every Practise stage of lesson 1, with feedback in l1-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner addieren, en: Adding tens }
    goal:
      de: "Addiere Zehner mit einer Aufgabe, die du schon kennst, so wie 30 + 40 ist 70, weil 3 + 4 gleich 7 ist."
      en: "Add tens with a fact you already know, like 30 + 40 is 70, because 3 + 4 is 7."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "5 + 3 = _"
            say: "Five add three."
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many?"
            say: "Count the tens. How many cubes are there?"
            show: { drawn: base-ten, tens: 6, ones: 0 }
            options: ["60", "6", "16"]
            answer: "60"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "20 + 50 = ?"
            say: "Twenty add fifty. That is two tens and five tens. What do you think the total is? Have a guess."
            show: { drawn: base-ten, tens: 2, ones: 0 }
          - text: "2 + 5 = 7 · 20 + 50 = 70"
            say: "Two tens and five tens make seven tens. Seven tens are seventy. Two add five is seven, so twenty add fifty is seventy. Two add five is a related fact."
            show: { drawn: base-ten, tens: 7, ones: 0 }
          - text: "60 + 40 = 100"
            say: "Six tens and four tens make ten tens. Ten tens are one hundred."
            show: { drawn: base-ten, tens: 10, ones: 0 }
          - text: "Did you know? In cricket, when a batter scores 100 runs, it is called a century."
            say: "Did you know? In cricket, when one batter scores one hundred runs, it is called a century. The crowd claps and cheers, and the batter lifts the bat high in the air!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "30 + 40 = ?"
                say: "Thirty add forty. What is the total?"
                options: ["70", "7", "700"]
                answer: "70"
                feedback:
                  "7": "Three add four is seven, but these are tens: seven tens are 70."
                  "700": "That is too many zeros. Seven tens are 70."
                hints:
                  - "Think of three tens and four tens."
                  - "Three add four is seven."
                  - "Seven tens: 70."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Use the related fact."
                say: "First work out one add six, then ten add sixty."
                frame: "1 + 6 = _ · 10 + 60 = _"
                options: ["7", "70", "16", "700"]
                answer: ["7", "70"]
                hints:
                  - "One add six is seven."
                  - "One ten and six tens."
                  - "7 and 70."
              - id: l1-f3
                type: text_input
                text: "Jas has 50p. Gran gives her 30p more. 50 + 30 = _"
                say: "Jas has fifty pence in ten pence coins. Gran gives her thirty pence more. How much has she got now? Fifty add thirty. Type the total."
                show: { drawn: coins, values: [10, 10, 10, 10, 10] }
                answer: "80"
                hints:
                  - "Five tens and three tens."
                  - "Five add three is eight."
                  - "Eight tens: 80."
              - id: l1-f4
                type: true_false
                text: "Is it true? 40 + 40 = 80"
                say: "Forty add forty is eighty. Is that true?"
                answer: true
                hints:
                  - "Four tens and four tens."
                  - "Four add four is eight."
                  - "Yes, that is true."
              - id: l1-f5
                type: multiple_choice
                text: "Which fact helps with 20 + 70?"
                say: "Which fact helps you work out twenty add seventy?"
                options: ["2 + 7", "20 + 7", "2 + 70"]
                answer: "2 + 7"
                option_audio: false
                hints:
                  - "Think in tens."
                  - "Twenty is two tens, seventy is seven tens."
                  - "2 + 7."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "60 + 20 = ?"
                say: "Sixty add twenty. What is the total?"
                options: ["8", "800", "80"]
                answer: "80"
                hints: ["How many tens altogether?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Use the related fact."
                say: "First work out four add five, then forty add fifty."
                frame: "4 + 5 = _ · 40 + 50 = _"
                options: ["9", "90", "45", "900"]
                answer: ["9", "90"]
                hints: ["How many tens are four tens and five tens?"]
              - id: l1-s3
                type: text_input
                text: "30 + 30 = _"
                say: "Thirty add thirty. Type the total."
                answer: "60"
                hints: ["Three tens and three tens."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 70 + 20 = 9"
                say: "Seventy add twenty is nine. Is that true?"
                answer: false
                hints: ["Are you adding ones or tens?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which fact helps with 10 + 80?"
                say: "Which fact helps you work out ten add eighty?"
                options: ["1 + 80", "1 + 8", "10 + 8"]
                answer: "1 + 8"
                option_audio: false
                hints: ["How many tens is each number?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "20 + 20 = ?"
                say: "Twenty add twenty. What is the total?"
                options: ["4", "40", "22"]
                answer: "40"
              - id: l1-n2
                type: fill_in_blank
                text: "Use the related fact."
                say: "First work out three add seven, then thirty add seventy."
                frame: "3 + 7 = _ · 30 + 70 = _"
                options: ["10", "100", "37", "1000"]
                answer: ["10", "100"]
              - id: l1-n3
                type: text_input
                text: "50 + 20 = _"
                say: "Fifty add twenty. Type the total."
                answer: "70"
              - id: l1-n4
                type: true_false
                text: "Is it true? 10 + 50 = 60"
                say: "Ten add fifty is sixty. Is that true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "70 + 10 = _"
                say: "Seventy add ten. Type the total."
                answer: "80"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "50 + 40 = ?"
            say: "Fifty add forty. What is the total?"
            options: ["90", "9", "54"]
            answer: "90"
          - id: l1-c2
            type: text_input
            text: "20 + 60 = _"
            say: "Twenty add sixty. Type the total."
            answer: "80"
          - id: l1-c3
            type: true_false
            text: "Is it true? 30 + 50 = 80"
            say: "Thirty add fifty is eighty. Is that true?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Use the related fact."
            say: "First work out one add seven, then ten add seventy."
            frame: "1 + 7 = _ · 10 + 70 = _"
            options: ["8", "80", "17", "800"]
            answer: ["8", "80"]
          - id: l1-c5
            type: multiple_choice
            text: "Which fact helps with 50 + 50?"
            say: "Which fact helps you work out fifty add fifty?"
            options: ["5 + 5", "50 + 5", "5 + 50"]
            answer: "5 + 5"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Is it true? 30 + 20 = 5"
            say: "Thirty add twenty is five. Is that true?"
            answer: false

  - n: 2
    title: { de: Zehner subtrahieren, en: Subtracting tens }
    goal:
      de: "Zieh Zehner mit einer Aufgabe ab, die du kennst, so wie 90 − 60, und finde die Zehner, die bis 100 fehlen."
      en: "Take away tens with a fact you know, like 90 − 60, and find the tens that make 100."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "40 + 30 = _"
            say: "Forty add thirty. Type the total."
            answer: "70"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "8 − 5 = _"
            say: "Eight subtract five."
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "70 − 40 = ?"
            say: "Seventy subtract forty. Seven tens take away four tens. What do you think is left? Have a guess."
            show: { drawn: base-ten, tens: 7, ones: 0 }
          - text: "70 − 40 = 30"
            say: "Three tens are left: thirty. Seven subtract four is three, so seventy subtract forty is thirty. Seven subtract four is the related fact."
            show: { drawn: base-ten, tens: 3, ones: 0 }
          - text: "100 − 30 = 70"
            say: "One hundred is ten tens. Ten tens take away three tens leaves seven tens: seventy."
          - text: "60 + _ = 100"
            say: "Sixty add what makes one hundred? Use a fact to ten. Six add four is ten, so sixty add forty is one hundred. The missing number is forty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "90 − 60 = ?"
                say: "Ninety subtract sixty. What is the difference?"
                options: ["30", "3", "150"]
                answer: "30"
                feedback:
                  "3": "Nine subtract six is three, but these are tens: three tens are 30."
                  "150": "That is ninety add sixty. Here you take sixty away."
                hints:
                  - "Nine tens take away six tens."
                  - "Nine subtract six is three."
                  - "Three tens: 30."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Use the related fact."
                say: "First work out eight subtract two, then eighty subtract twenty."
                frame: "8 − 2 = _ · 80 − 20 = _"
                options: ["6", "60", "10", "100"]
                answer: ["6", "60"]
                hints:
                  - "Eight subtract two is six."
                  - "Eight tens take away two tens."
                  - "6 and 60."
              - id: l2-f3
                type: text_input
                text: "Zoe's book has 100 pages. She has read 80. How many pages are left? 100 − 80 = _"
                say: "Zoe's book has one hundred pages. She has read eighty. How many pages are left? One hundred subtract eighty."
                show: { object: book }
                answer: "20"
                hints:
                  - "One hundred is ten tens."
                  - "Ten subtract eight is two."
                  - "Two tens: 20."
              - id: l2-f4
                type: fill_in_blank
                text: "Find the missing number."
                say: "Ninety add what makes one hundred?"
                frame: "90 + _ = 100"
                options: ["10", "1", "20"]
                answer: ["10"]
                feedback:
                  "1": "Nine add one is ten, but these are tens. You need one ten: 10."
                hints:
                  - "Nine and what make ten?"
                  - "Nine and one make ten."
                  - "Ninety and ten make one hundred."
              - id: l2-f5
                type: true_false
                text: "Is it true? 50 − 20 = 30"
                say: "Fifty subtract twenty is thirty. Is that true?"
                answer: true
                hints:
                  - "Five tens take away two tens."
                  - "Five subtract two is three."
                  - "Yes, that is true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "80 − 50 = ?"
                say: "Eighty subtract fifty. What is the difference?"
                options: ["3", "30", "130", "8050"]
                answer: "30"
                feedback:
                  "8050": "Whoa, that's just 80 and 50 stuck together! Take five tens away from eight tens."
                hints: ["How many tens are left?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Use the related fact."
                say: "First work out six subtract four, then sixty subtract forty."
                frame: "6 − 4 = _ · 60 − 40 = _"
                options: ["2", "20", "10", "100"]
                answer: ["2", "20"]
                hints: ["How many tens are left?"]
              - id: l2-s3
                type: text_input
                text: "100 − 10 = _"
                say: "One hundred subtract ten. Type the difference."
                answer: "90"
                hints: ["How many tens make one hundred?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Find the missing number."
                say: "Eighty add what makes one hundred?"
                frame: "80 + _ = 100"
                options: ["30", "2", "20"]
                answer: ["20"]
                hints: ["Eight and what make ten?"]
              - id: l2-s5
                type: true_false
                text: "Is it true? 90 − 30 = 50"
                say: "Ninety subtract thirty is fifty. Is that true?"
                answer: false
                hints: ["Nine tens take away three tens."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "70 − 20 = ?"
                say: "Seventy subtract twenty. What is the difference?"
                options: ["5", "90", "50"]
                answer: "50"
              - id: l2-n2
                type: fill_in_blank
                text: "Use the related fact."
                say: "First work out nine subtract five, then ninety subtract fifty."
                frame: "9 − 5 = _ · 90 − 50 = _"
                options: ["4", "40", "14", "140"]
                answer: ["4", "40"]
              - id: l2-n3
                type: text_input
                text: "100 − 90 = _"
                say: "One hundred subtract ninety. Type the difference."
                answer: "10"
              - id: l2-n4
                type: fill_in_blank
                text: "Find the missing number."
                say: "Twenty add what makes one hundred?"
                frame: "20 + _ = 100"
                options: ["70", "80", "8"]
                answer: ["80"]
              - id: l2-n5
                type: true_false
                text: "Is it true? 60 − 30 = 30"
                say: "Sixty subtract thirty is thirty. Is that true?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: multiple_choice
            text: "30 + 60 = ?"
            say: "Thirty add sixty. What is the total?"
            options: ["9", "90", "36"]
            answer: "90"
          - id: l2-c2
            part: subtract
            type: text_input
            text: "80 − 30 = _"
            say: "Eighty subtract thirty. Type the difference."
            answer: "50"
          - id: l2-c3
            part: to-100
            type: fill_in_blank
            text: "Find the missing number."
            say: "Fifty add what makes one hundred?"
            frame: "50 + _ = 100"
            options: ["50", "5", "60"]
            answer: ["50"]
          - id: l2-c4
            part: subtract
            type: true_false
            text: "Is it true? 50 − 30 = 2"
            say: "Fifty subtract thirty is two. Is that true?"
            answer: false
          - id: l2-c5
            part: subtract
            type: multiple_choice
            text: "Which fact helps with 90 − 40?"
            say: "Which fact helps you work out ninety subtract forty?"
            options: ["9 − 4", "9 + 4", "90 − 4"]
            answer: "9 − 4"
            option_audio: false
          - id: l2-c6
            part: add
            type: text_input
            text: "60 + 30 = _"
            say: "Sixty add thirty. Type the total."
            answer: "90"
          - id: l2-c7
            part: add
            type: multiple_choice
            text: "40 + 20 = ?"
            say: "Forty add twenty. What is the total?"
            options: ["60", "6", "600"]
            answer: "60"
          - id: l2-c8
            part: add
            type: true_false
            text: "Is it true? 20 + 30 = 50"
            say: "Twenty add thirty is fifty. Is that true?"
            answer: true
          - id: l2-c9
            part: add
            type: true_false
            text: "Is it true? 80 + 20 = 10"
            say: "Eighty add twenty is ten. Is that true?"
            answer: false
          - id: l2-c10
            part: add
            type: multiple_choice
            text: "Which fact helps with 10 + 30?"
            say: "Which fact helps you work out ten add thirty?"
            options: ["1 + 3", "10 + 3", "1 + 30"]
            answer: "1 + 3"
            option_audio: false
          - id: l2-c11
            part: add
            type: text_input
            text: "Mia has 30 stickers. She gets 20 more. How many stickers does she have now?"
            say: "Mia has thirty stickers. She gets twenty more. How many stickers does she have now?"
            answer: "50"
          - id: l2-c12
            part: subtract
            type: multiple_choice
            text: "60 − 20 = ?"
            say: "Sixty subtract twenty. What is the difference?"
            options: ["40", "4", "80"]
            answer: "40"
          - id: l2-c13
            part: subtract
            type: text_input
            text: "100 − 60 = _"
            say: "One hundred subtract sixty. Type the difference."
            answer: "40"
          - id: l2-c14
            part: subtract
            type: true_false
            text: "Is it true? 70 − 30 = 40"
            say: "Seventy subtract thirty is forty. Is that true?"
            answer: true
          - id: l2-c15
            part: subtract
            type: text_input
            text: "A shop has 80 balloons. It sells 40. How many balloons are left?"
            say: "A shop has eighty balloons. It sells forty. How many balloons are left?"
            answer: "40"
          - id: l2-c16
            part: to-100
            type: multiple_choice
            text: "30 + _ = 100"
            say: "Thirty add what makes one hundred?"
            options: ["70", "7", "60"]
            answer: "70"
          - id: l2-c17
            part: to-100
            type: text_input
            text: "10 + _ = 100"
            say: "Ten add what makes one hundred? Type the missing number."
            answer: "90"
          - id: l2-c18
            part: to-100
            type: true_false
            text: "Is it true? 40 + 50 = 100"
            say: "Forty add fifty is one hundred. Is that true?"
            answer: false
          - id: l2-c19
            part: to-100
            type: fill_in_blank
            text: "Find the missing number."
            say: "What add seventy makes one hundred?"
            frame: "_ + 70 = 100"
            options: ["30", "3", "40"]
            answer: ["30"]
          - id: l2-c20
            part: to-100
            type: text_input
            text: "Sam has 40 marbles. How many more does he need to have 100?"
            say: "Sam has forty marbles. How many more does he need to have one hundred?"
            answer: "60"
