# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.check
skill: math.add-sub-to-100.check
curriculum: en-GB
language: en
title:
  de: Rechnungen prüfen
  en: Checking calculations
summary: >
  Checking an answer with the inverse and with an estimate, then finding
  and explaining mistakes in worked calculations. Lesson 1 checks a
  subtraction with an addition (and the other way round) and estimates by
  rounding to the nearest ten; lesson 2 finds the missing new ten, the
  swapped ones, a ten not taken away and the wrong operation, puts them
  right, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.sub-two-digit, math.add-sub-to-100.add-two-digit]
  also_practises: [math.add-sub-to-20.inverse]
  vocabulary: { en: [check, inverse, estimate, about, round to the nearest ten, mistake, exact] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: inverse-wrong-start
      what: Builds the inverse from the first number (64 + 28 to check 64 − 28 = 36)
      addressed: lesson 1 Learn starts the inverse from the answer; l1-f1 has feedback on it, and l1-c1 and l2-c1 offer it again
    - id: inverse-is-turnaround
      what: Takes the turnaround (45 + 38 = 83 for 38 + 45 = 83) as the check, though it is still an addition
      addressed: the turnaround is an option in l1-s1 and l1-n1; lesson 1 Learn says the inverse of adding is subtracting
    - id: trusts-any-result
      what: Does not notice an answer that is far off
      addressed: estimate tasks in every stage of lesson 1 (l1-f4, l1-f5, l1-s4, l1-s5, l1-n3, l1-n4); "Which calculation is wrong?" in each stage of lesson 2 (l2-f5, l2-s5, l2-n5)
    - id: forgets-new-ten
      what: Adds tens and ones separately and drops the new ten made by the ones (36 + 47 = 73)
      addressed: lesson 2 Learn works it through in tens and ones; l2-f1 and l2-f3 in the full stage and l2-c3 in the skill check
    - id: swaps-ones
      what: Takes the smaller ones digit from the larger (72 − 35 = 43)
      addressed: lesson 2 Learn shows it and the right steps; l2-f2 and l2-n2
    - id: ten-not-taken-away
      what: Takes the ones away across a ten but leaves one ten too many (64 − 28 = 46)
      addressed: lesson 2 Learn works it in steps; l2-s2 and l2-s3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Umkehraufgabe und Überschlag, en: Inverse and estimate }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "36 + 25 = _"
            say: "Thirty-six add twenty-five."
            answer: "61"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "70 − 26 = _"
            say: "Seventy subtract twenty-six."
            answer: "44"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lily: 72 − 35 = 37"
            say: "Lily works out seventy-two subtract thirty-five and gets thirty-seven. Is she right? We can check with the inverse."
          - text: "37 + 35 = 72"
            say: "The inverse of subtracting is adding, and it starts with the answer. Thirty-seven add thirty-five is seventy-two. We are back at seventy-two, so Lily is right. You check an addition with a subtraction in the same way."
          - text: "48 + 29 is about 50 + 30 = 80"
            say: "An estimate is a quick answer that is nearly right. Round each number to the nearest ten. Forty-eight is about fifty, and twenty-nine is about thirty. So the answer should be close to eighty."
          - text: "48 + 29 = 77"
            say: "The exact answer is seventy-seven. That is close to eighty, so it makes sense. If someone wrote fifty-seven, you would know straight away that something is wrong."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which calculation checks 64 − 28 = 36?"
                say: "Which calculation checks sixty-four subtract twenty-eight equals thirty-six?"
                options: ["36 + 28 = 64", "64 + 28 = 92", "36 − 28 = 8"]
                answer: "36 + 28 = 64"
                feedback:
                  "64 + 28 = 92": "The inverse starts with the answer, 36: 36 + 28."
                  "36 − 28 = 8": "The inverse of subtracting is adding."
                hints:
                  - "The inverse of subtracting is adding."
                  - "Start with the answer, 36."
                  - "36 + 28 = 64."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Ben: 53 − 27 = 26. Check with the inverse."
                say: "Ben works out fifty-three subtract twenty-seven and gets twenty-six. Check with the inverse."
                frame: "26 + 27 = _"
                options: ["43", "53", "63"]
                answer: ["53"]
                hints:
                  - "Work out twenty-six add twenty-seven."
                  - "26 + 20 = 46, then add 7 more."
                  - "53. Ben is right."
              - id: l1-f3
                type: true_false
                text: "Mia: 81 − 46 = 45. Is Mia right?"
                say: "Mia works out eighty-one subtract forty-six and gets forty-five. Check with forty-five add forty-six. Is Mia right?"
                answer: false
                hints:
                  - "Work out 45 + 46."
                  - "45 + 46 = 91, not 81."
                  - "No, Mia is not right."
              - id: l1-f4
                type: multiple_choice
                text: "Estimate: 39 + 42 is about _"
                say: "Estimate. Thirty-nine add forty-two is about how much?"
                options: ["60", "80", "100"]
                answer: "80"
                hints:
                  - "Round each number to the nearest ten."
                  - "39 is about 40, and 42 is about 40 too."
                  - "40 + 40 = 80."
              - id: l1-f5
                type: multiple_choice
                text: "Which answer could be right? 61 + 28"
                say: "Estimate first. Which answer could be right for sixty-one add twenty-eight?"
                options: ["69", "89", "99"]
                answer: "89"
                feedback:
                  "69": "61 + 28 is about 60 + 30, so about 90. 69 is too small."
                  "99": "61 + 28 is about 60 + 30, so about 90. 99 is too big."
                hints:
                  - "61 is about 60, and 28 is about 30."
                  - "The answer is close to 90."
                  - "89."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which calculation checks 38 + 45 = 83?"
                say: "Which calculation checks thirty-eight add forty-five equals eighty-three?"
                options: ["83 − 45 = 38", "45 + 38 = 83", "45 − 38 = 7"]
                answer: "83 − 45 = 38"
                feedback:
                  "45 + 38 = 83": "That is the turnaround. It is still adding. The inverse of adding is subtracting."
                hints: ["The inverse of adding is subtracting, starting with the answer."]
              - id: l1-s2
                type: fill_in_blank
                text: "Ali: 75 − 38 = 37. Check with the inverse."
                say: "Ali works out seventy-five subtract thirty-eight and gets thirty-seven. Check with the inverse."
                frame: "37 + 38 = _"
                options: ["65", "75", "85"]
                answer: ["75"]
                hints: ["Add 30 to 37 first, then 8 more."]
              - id: l1-s3
                type: true_false
                text: "Is it right? 62 − 25 = 47"
                say: "Sixty-two subtract twenty-five equals forty-seven. Check with the inverse. Is it right?"
                answer: false
                hints: ["Work out 47 + 25 and compare it with 62."]
              - id: l1-s4
                type: multiple_choice
                text: "Estimate: 71 − 29 is about _"
                say: "Estimate. Seventy-one subtract twenty-nine is about how much?"
                options: ["30", "40", "50"]
                answer: "40"
                hints: ["Round each number to the nearest ten."]
              - id: l1-s5
                type: true_false
                text: "Could it be right? 88 − 41 = 47"
                say: "Eighty-eight subtract forty-one equals forty-seven. Estimate. Could it be right?"
                answer: true
                hints: ["88 is about 90, and 41 is about 40."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which calculation checks 45 + 37 = 82?"
                say: "Which calculation checks forty-five add thirty-seven equals eighty-two?"
                options: ["82 − 37 = 45", "37 + 45 = 82", "45 − 37 = 8"]
                answer: "82 − 37 = 45"
              - id: l1-n2
                type: fill_in_blank
                text: "Tom: 94 − 56 = 38. Check with the inverse."
                say: "Tom works out ninety-four subtract fifty-six and gets thirty-eight. Check with the inverse."
                frame: "38 + 56 = _"
                options: ["84", "92", "94"]
                answer: ["94"]
              - id: l1-n3
                type: multiple_choice
                text: "Estimate: 58 + 31 is about _"
                say: "Estimate. Fifty-eight add thirty-one is about how much?"
                options: ["70", "90", "100"]
                answer: "90"
              - id: l1-n4
                type: true_false
                text: "Could it be right? 69 + 22 = 61"
                say: "Sixty-nine add twenty-two equals sixty-one. Estimate. Could it be right?"
                answer: false
              - id: l1-n5
                type: true_false
                text: "Is it right? 83 − 47 = 36"
                say: "Eighty-three subtract forty-seven equals thirty-six. Check with the inverse. Is it right?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which calculation checks 70 − 26 = 44?"
            say: "Which calculation checks seventy subtract twenty-six equals forty-four?"
            options: ["44 + 26 = 70", "70 + 26 = 96", "44 − 26 = 18"]
            answer: "44 + 26 = 70"
          - id: l1-c2
            type: multiple_choice
            text: "Estimate: 49 + 18 is about _"
            say: "Estimate. Forty-nine add eighteen is about how much?"
            options: ["50", "70", "90"]
            answer: "70"
          - id: l1-c3
            type: true_false
            text: "Is it right? 91 − 55 = 46"
            say: "Ninety-one subtract fifty-five equals forty-six. Is it right?"
            answer: false

  - n: 2
    title: { de: Fehler finden, en: Spotting mistakes }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Estimate: 38 + 41 is about _"
            say: "Estimate. Thirty-eight add forty-one is about how much?"
            options: ["60", "80", "100"]
            answer: "80"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it right? 54 − 18 = 36"
            say: "Fifty-four subtract eighteen equals thirty-six. Is it right?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tim: 45 + 38 = 73\n40 + 30 = 70   5 + 8 = 13   70 + 13 = 83"
            say: "Tim worked out forty-five add thirty-eight and got seventy-three. Estimate: about fifty add forty, so about ninety. Seventy-three is too small. Tens: forty add thirty is seventy. Ones: five add eight is thirteen. Seventy and thirteen make eighty-three. The ones made a new ten, and Tim forgot it."
          - text: "Tim: 72 − 35 = 43\n72 − 30 = 42   42 − 5 = 37"
            say: "Here Tim looked at the ones and did five subtract two. But he has to take five away from forty-two. Seventy-two subtract thirty is forty-two, and forty-two subtract five is thirty-seven."
          - text: "Tim: 64 − 28 = 46\n64 − 20 = 44   44 − 8 = 36"
            say: "Here Tim took away one ten too few. In steps: sixty-four subtract twenty is forty-four, and forty-four subtract eight is thirty-six."
          - text: "Tim: 63 − 8 = 71"
            say: "Here Tim added instead of subtracting. When you subtract, the answer gets smaller. Sixty-three subtract eight is fifty-five."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is the mistake? 36 + 47 = 73"
                say: "Thirty-six add forty-seven equals seventy-three. What is the mistake?"
                options: ["The new ten from the ones is missing.", "It subtracts instead of adding.", "The ones are added wrongly."]
                answer: "The new ten from the ones is missing."
                feedback:
                  "It subtracts instead of adding.": "Subtracting would give a much smaller answer than 73. Look at the ones: 6 + 7 = 13."
                  "The ones are added wrongly.": "6 + 7 = 13, and the answer ends in 3. The ones are right, but the ten from 13 is missing."
                hints:
                  - "Add the tens and the ones: 30 + 40 and 6 + 7."
                  - "6 + 7 = 13. That makes a new ten."
                  - "The new ten from the ones is missing. It should be 83."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is the mistake? 84 − 27 = 63"
                say: "Eighty-four subtract twenty-seven equals sixty-three. What is the mistake?"
                options: ["The ones were done as 7 − 4.", "It adds instead of subtracting.", "One ten too few was taken away."]
                answer: "The ones were done as 7 − 4."
                hints:
                  - "Work it out in steps: 84 − 20 = 64, then take away 7."
                  - "64 − 7 is 57, not 63."
                  - "The ones were done as 7 − 4. You have to take 7 away from 64. It should be 57."
              - id: l2-f3
                type: fill_in_blank
                text: "Put it right: 36 + 47"
                say: "Work out thirty-six add forty-seven again. Add the tens, then the ones, then put them together."
                frame: "30 + 40 = _   6 + 7 = _   36 + 47 = _"
                options: ["70", "13", "73", "83"]
                answer: ["70", "13", "83"]
                hints:
                  - "Tens first, then ones."
                  - "70 and 13."
                  - "70 + 13 = 83."
              - id: l2-f4
                type: true_false
                text: "Is it right? 55 − 9 = 64"
                say: "Fifty-five subtract nine equals sixty-four. Is it right?"
                answer: false
                feedback:
                  "true": "When you subtract, the answer gets smaller. 64 is more than 55."
                hints:
                  - "When you subtract, does the answer get bigger or smaller?"
                  - "64 is bigger than 55."
                  - "No. This adds instead of subtracting. 55 − 9 = 46."
              - id: l2-f5
                type: multiple_choice
                text: "Which calculation is wrong?"
                say: "One of these calculations is wrong. Which one?"
                options: ["58 + 24 = 72", "46 + 13 = 59", "70 − 25 = 45"]
                answer: "58 + 24 = 72"
                hints:
                  - "Estimate each calculation."
                  - "58 + 24 is about 60 + 20."
                  - "58 + 24 = 82, not 72."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What is the mistake? 35 + 24 = 58"
                say: "Thirty-five add twenty-four equals fifty-eight. What is the mistake?"
                options: ["The new ten from the ones is missing.", "It subtracts instead of adding.", "The ones are added wrongly."]
                answer: "The ones are added wrongly."
                hints: ["Add the tens and the ones on their own."]
              - id: l2-s2
                type: multiple_choice
                text: "What is the mistake? 73 − 36 = 47"
                say: "Seventy-three subtract thirty-six equals forty-seven. What is the mistake?"
                options: ["The ones were done as 6 − 3.", "It adds instead of subtracting.", "One ten too few was taken away."]
                answer: "One ten too few was taken away."
                hints: ["Work it out in steps: take away 30, then 6."]
              - id: l2-s3
                type: text_input
                text: "Put it right: 73 − 36 = _"
                say: "Work out seventy-three subtract thirty-six."
                answer: "37"
                hints: ["73 − 30 first, then take away 6."]
              - id: l2-s4
                type: true_false
                text: "Is it right? 47 − 6 = 53"
                say: "Forty-seven subtract six equals fifty-three. Is it right?"
                answer: false
                hints: ["When you subtract, does the answer get bigger or smaller?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which calculation is wrong?"
                say: "One of these calculations is wrong. Which one?"
                options: ["39 + 26 = 65", "73 − 28 = 55", "50 + 34 = 84"]
                answer: "73 − 28 = 55"
                hints: ["Check each one with an estimate or with the inverse."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What is the mistake? 36 + 7 = 29"
                say: "Thirty-six add seven equals twenty-nine. What is the mistake?"
                options: ["The new ten from the ones is missing.", "It subtracts instead of adding.", "The ones are added wrongly."]
                answer: "It subtracts instead of adding."
              - id: l2-n2
                type: multiple_choice
                text: "What is the mistake? 91 − 45 = 54"
                say: "Ninety-one subtract forty-five equals fifty-four. What is the mistake?"
                options: ["The ones were done as 5 − 1.", "It adds instead of subtracting.", "One ten too few was taken away."]
                answer: "The ones were done as 5 − 1."
              - id: l2-n3
                type: text_input
                text: "Put it right: 91 − 45 = _"
                say: "Work out ninety-one subtract forty-five."
                answer: "46"
              - id: l2-n4
                type: true_false
                text: "Is it right? 72 + 8 = 80"
                say: "Seventy-two add eight equals eighty. Is it right?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Which calculation is wrong?"
                say: "One of these calculations is wrong. Which one?"
                options: ["66 + 17 = 73", "44 + 38 = 82", "90 − 36 = 54"]
                answer: "66 + 17 = 73"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which calculation checks 60 − 24 = 36?"
            say: "Which calculation checks sixty subtract twenty-four equals thirty-six?"
            options: ["36 + 24 = 60", "60 + 24 = 84", "36 − 24 = 12"]
            answer: "36 + 24 = 60"
          - id: l2-c2
            type: multiple_choice
            text: "Estimate: 62 + 27 is about _"
            say: "Estimate. Sixty-two add twenty-seven is about how much?"
            options: ["70", "90", "100"]
            answer: "90"
          - id: l2-c3
            type: multiple_choice
            text: "What is the mistake? 48 + 36 = 74"
            say: "Forty-eight add thirty-six equals seventy-four. What is the mistake?"
            options: ["The new ten from the ones is missing.", "It subtracts instead of adding.", "The ones are added wrongly."]
            answer: "The new ten from the ones is missing."
          - id: l2-c4
            type: multiple_choice
            text: "What is the mistake? 53 − 6 = 59"
            say: "Fifty-three subtract six equals fifty-nine. What is the mistake?"
            options: ["The ones were done as 6 − 3.", "It adds instead of subtracting.", "One ten too few was taken away."]
            answer: "It adds instead of subtracting."
          - id: l2-c5
            type: true_false
            text: "Is it right? 100 − 63 = 37"
            say: "One hundred subtract sixty-three equals thirty-seven. Is it right?"
            answer: true
