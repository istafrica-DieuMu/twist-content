# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.table-5-10
skill: math.mult-div.table-5-10
curriculum: en-GB
language: en
title:
  de: Die Fünfer- und die Zehnerreihe
  en: The 5 and 10 times tables
summary: >
  The 10 and 5 times tables and how they belong together. Lesson 1 takes
  the 10 times table (every answer ends in 0) and counts in tens on a
  number line; lesson 2 takes the 5 times table (answers end in 5 or 0),
  finds each fact as half of the matching 10 times fact, and ends with
  the skill check.
metadata:
  year: year-2
  topic: { de: Einmaleins, en: Times tables }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.core-facts]
  also_practises: [math.mult-div.core-facts]
  vocabulary: { en: [times table, multiple, count in fives, count in tens, half, ends in] }
  forms: [drawn, text, audio]
  drawn: [number-line, dots]
  facets: []
  parts:
    - { id: row-10, what: { de: die Zehnerreihe, en: the 10 times table } }
    - { id: row-5, what: { de: die Fünferreihe, en: the 5 times table } }
    - { id: half, what: { de: die Fünferreihe als Hälfte der Zehnerreihe, en: the 5 times table as half of the 10 times table } }
    - { id: in-row, what: { de: welche Zahlen zur Reihe gehören, en: which numbers are in the table } }
  misconceptions:
    - id: ten-table-adds-ten
      what: Thinks 10 × 7 is 17, writing the ten in front of the number
      addressed: lesson 1 Learn counts seven jumps of ten; l1-f2 (with feedback), l1-s2 and l1-c2 offer the 17-style answer
    - id: five-ends-any-digit
      what: Accepts a number such as 32 or 27 as being in the 5 times table
      addressed: lesson 2 Learn shows that the 5 times table ends in 5 or 0; l2-f3 (with feedback), l2-s4, l2-n4 and l2-c4 ask which number is in the 5 times table
    - id: five-not-half
      what: Gives the 10 times answer for a 5 times fact
      addressed: lesson 2 Learn halves 10 × 6 to get 5 × 6; l2-f1 (with feedback), l2-s1 and l2-c2 offer the 10 times answer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die Zehnerreihe, en: The 10 times table }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "10 × 2 = _"
            say: "Ten times two."
            answer: "20"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "5 × 2 = _"
            say: "Five times two."
            options: ["10", "7", "52"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10, 20, 30, 40, 50"
            say: "Count in tens: ten, twenty, thirty, forty, fifty. Each jump is ten."
            show: { drawn: number-line, from: 0, to: 100, labels: tens, step: 10, jumps: [[0, 10], [10, 10], [20, 10], [30, 10], [40, 10]] }
          - text: "5 × 10 = 50"
            say: "Five jumps of ten land on fifty. Five times ten is fifty."
            show: { drawn: number-line, from: 0, to: 100, labels: tens, step: 10, jumps: [[0, 10], [10, 10], [20, 10], [30, 10], [40, 10]] }
          - text: "3 × 10 = 30   7 × 10 = 70   10 × 10 = 100"
            say: "Every answer in the ten times table ends in zero. Three tens are thirty. Seven tens are seventy. Ten tens are one hundred."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_line
                text: "Where do 4 jumps of 10 land?"
                say: "Start at zero. Make four jumps of ten. Where do you land?"
                show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
                answer: 40
                hints:
                  - "Count in tens, one for each jump."
                  - "Ten, twenty, thirty, and one more jump."
                  - "40."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "7 × 10 = _"
                say: "Seven times ten."
                options: ["70", "17", "710"]
                answer: "70"
                feedback:
                  "17": "Seventeen is ten add seven. Seven times ten is seven tens: seventy."
                hints:
                  - "Seven times ten is seven tens."
                  - "Count seven tens: ten, twenty, thirty, forty, fifty, sixty ..."
                  - "70."
              - id: l1-f3
                type: fill_in_blank
                text: "Count in tens."
                say: "Count in tens. Fill the gaps."
                frame: "30, 40, _, 60, _"
                options: ["50", "70", "45", "80"]
                answer: ["50", "70"]
                hints:
                  - "Each number is ten more."
                  - "Forty and ten more, then sixty and ten more."
                  - "50 and 70."
              - id: l1-f4
                type: text_input
                text: "9 × 10 = _"
                say: "Nine times ten."
                answer: "90"
                hints:
                  - "Nine tens."
                  - "Ten tens are a hundred, so nine tens are one ten less."
                  - "90."
              - id: l1-f5
                type: true_false
                text: "Is it true? 6 × 10 = 60"
                say: "Six times ten is sixty. Is that true?"
                answer: true
                hints:
                  - "Six tens."
                  - "Ten, twenty, thirty, forty, fifty, sixty."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "4 × 10 = _"
                say: "Four times ten."
                answer: "40"
                hints: ["Four tens."]
              - id: l1-s2
                type: multiple_choice
                text: "10 × 8 = _"
                say: "Ten times eight."
                options: ["80", "18", "108"]
                answer: "80"
                hints: ["Ten eights are eight tens."]
              - id: l1-s3
                type: multiple_choice
                text: "Which number is in the 10 times table?"
                say: "Which number is in the ten times table?"
                options: ["50", "55", "15"]
                answer: "50"
                hints: ["Answers in the 10 times table end in zero."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 2 × 10 = 12"
                say: "Two times ten is twelve. Is that true?"
                answer: false
                hints: ["Two tens."]
              - id: l1-s5
                type: point_on_line
                text: "Where is 10 × 10?"
                say: "Where does ten times ten land?"
                show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
                answer: 100
                hints: ["Ten jumps of ten."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "3 × 10 = _"
                say: "Three times ten."
                answer: "30"
              - id: l1-n2
                type: fill_in_blank
                text: "Count back in tens."
                say: "Count back in tens. Fill the gaps."
                frame: "90, 80, _, 60, _"
                options: ["70", "50", "75", "40"]
                answer: ["70", "50"]
              - id: l1-n3
                type: multiple_choice
                text: "_ × 10 = 60"
                say: "How many tens make sixty?"
                options: ["6", "60", "16"]
                answer: "6"
              - id: l1-n4
                type: text_input
                text: "10 × 5 = _"
                say: "Ten times five."
                answer: "50"
              - id: l1-n5
                type: true_false
                text: "Is it true? 8 × 10 = 80"
                say: "Eight times ten is eighty. Is that true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "5 × 10 = _"
            say: "Five times ten."
            answer: "50"
          - id: l1-c2
            type: multiple_choice
            text: "10 × 4 = _"
            say: "Ten times four."
            options: ["40", "14", "104"]
            answer: "40"
          - id: l1-c3
            type: multiple_choice
            text: "_ × 10 = 90"
            say: "How many tens make ninety?"
            options: ["9", "90", "19"]
            answer: "9"
          - id: l1-c4
            type: text_input
            text: "6 × 10 = _"
            say: "Six times ten."
            answer: "60"
          - id: l1-c5
            type: true_false
            text: "Is it true? 10 × 3 = 13"
            say: "Ten times three is thirteen. Is that true?"
            answer: false
          - id: l1-c6
            type: fill_in_blank
            text: "Count in tens. Which number is missing?"
            say: "Count in tens. Which number is missing?"
            frame: "40, 50, _, 70"
            options: ["60", "55", "61"]
            answer: ["60"]

  - n: 2
    title: { de: Die Fünferreihe, en: The 5 times table }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "6 × 10 = _"
            say: "Six times ten."
            answer: "60"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Count in tens."
            say: "Count in tens. Fill the gaps."
            frame: "10, 20, _, 40, _"
            options: ["30", "50", "25", "60"]
            answer: ["30", "50"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5, 10, 15, 20, 25, 30"
            say: "Count in fives: five, ten, fifteen, twenty, twenty-five, thirty. Every answer ends in five or zero."
            show: { drawn: number-line, from: 0, to: 50, labels: tens, step: 5, jumps: [[0, 5], [5, 5], [10, 5], [15, 5], [20, 5], [25, 5]] }
          - text: "10 × 6 = 60, so 5 × 6 = 30"
            say: "Ten rows of six make sixty. Five rows are half of them. Half of sixty is thirty. So five times six is thirty."
            show: { drawn: dots, array: [10, 6], split_rows: 5 }
          - text: "4 × 5 = 20   4 × 10 = 40"
            say: "Four fives are twenty. Four tens are forty. Five times a number is always half of ten times it."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "8 × 5 = _"
                say: "Eight times five."
                options: ["40", "80", "13"]
                answer: "40"
                feedback:
                  "80": "Eighty is eight times ten. Eight fives are half of that."
                hints:
                  - "Find eight times ten first."
                  - "Eight times ten is eighty. Halve it."
                  - "40."
                difficulty: easy
              - id: l2-f2
                type: point_on_line
                text: "Where do 3 jumps of 5 land?"
                say: "Start at zero. Make three jumps of five. Where do you land?"
                show: { drawn: number-line, from: 0, to: 50, labels: tens, step: 5 }
                answer: 15
                hints:
                  - "Count in fives, one for each jump."
                  - "Five, ten, and one more jump."
                  - "15."
              - id: l2-f3
                type: multiple_choice
                text: "Which number is in the 5 times table?"
                say: "Which number is in the five times table?"
                options: ["35", "32", "53"]
                answer: "35"
                feedback:
                  "32": "Thirty-two ends in two. Numbers in the five times table end in five or zero."
                hints:
                  - "Look at the last digit."
                  - "The 5 times table ends in 5 or 0."
                  - "35."
              - id: l2-f4
                type: fill_in_blank
                text: "10 × 7 = _, so 5 × 7 = _"
                say: "Ten times seven is how many? So five times seven is how many?"
                frame: "10 × 7 = _ · 5 × 7 = _"
                options: ["70", "35", "12", "17"]
                answer: ["70", "35"]
                hints:
                  - "First find ten times seven."
                  - "Ten times seven is seventy. Half of seventy."
                  - "70 and 35."
              - id: l2-f5
                type: true_false
                text: "Is it true? 5 × 9 = 45"
                say: "Five times nine is forty-five. Is that true?"
                answer: true
                hints:
                  - "Halve ten times nine."
                  - "Ten times nine is ninety. Half of ninety is forty-five."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "6 × 5 = _"
                say: "Six times five."
                options: ["30", "60", "11"]
                answer: "30"
                hints: ["Half of six times ten."]
              - id: l2-s2
                type: fill_in_blank
                text: "Count in fives."
                say: "Count in fives. Fill the gaps."
                frame: "20, 25, _, 35, _"
                options: ["30", "40", "26", "45"]
                answer: ["30", "40"]
                hints: ["Each number is five more."]
              - id: l2-s3
                type: text_input
                text: "5 × 4 = _"
                say: "Five times four."
                answer: "20"
                hints: ["Four fives: five, ten, fifteen, twenty."]
              - id: l2-s4
                type: multiple_choice
                text: "Which number is not in the 5 times table?"
                say: "Which number is not in the five times table?"
                options: ["27", "25", "50"]
                answer: "27"
                hints: ["Look for a last digit that is not 5 or 0."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 7 × 5 = 30"
                say: "Seven times five is thirty. Is that true?"
                answer: false
                hints: ["Half of seven times ten."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A hand has 5 fingers. How many fingers are on 6 hands?"
                say: "A hand has five fingers. How many fingers are on six hands?"
                answer: "30"
              - id: l2-n2
                type: text_input
                text: "A box holds 10 crayons. How many crayons are in 7 boxes?"
                say: "A box holds ten crayons. How many crayons are in seven boxes?"
                answer: "70"
              - id: l2-n3
                type: multiple_choice
                text: "Ali has 5p coins. He has 9 of them. How much money is that?"
                say: "Ali has nine five pence coins. How much money is that?"
                options: ["45p", "90p", "14p"]
                answer: "45p"
              - id: l2-n4
                type: multiple_choice
                text: "Mia counts in fives from 0. Which number does she say?"
                say: "Mia counts in fives from zero. Which number does she say?"
                options: ["40", "42", "48"]
                answer: "40"
              - id: l2-n5
                type: text_input
                text: "Tickets cost 10p each. How much do 10 tickets cost? Write the pence."
                say: "Tickets cost ten pence each. How many pence do ten tickets cost?"
                answer: "100"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: row-10
            type: text_input
            text: "2 × 10 = _"
            say: "Two times ten."
            answer: "20"
          - id: l2-c2
            part: row-5
            type: multiple_choice
            text: "5 × 5 = _"
            say: "Five times five."
            options: ["25", "50", "10"]
            answer: "25"
          - id: l2-c3
            part: row-10
            type: text_input
            text: "10 × 10 = _"
            say: "Ten times ten."
            answer: "100"
          - id: l2-c4
            part: in-row
            type: multiple_choice
            text: "Which number is in the 5 times table?"
            say: "Which number is in the five times table?"
            options: ["15", "16", "51"]
            answer: "15"
          - id: l2-c5
            part: row-5
            type: true_false
            text: "Is it true? 3 × 5 = 20"
            say: "Three times five is twenty. Is that true?"
            answer: false
          - id: l2-c6
            part: row-10
            type: multiple_choice
            text: "_ × 10 = 40"
            say: "How many tens make forty?"
            options: ["4", "40", "14"]
            answer: "4"
          - id: l2-c7
            part: row-10
            type: text_input
            text: "A box holds 10 pencils. How many pencils are in 5 boxes?"
            say: "A box holds ten pencils. How many pencils are in five boxes?"
            answer: "50"
          - id: l2-c8
            part: row-10
            type: true_false
            text: "Is it true? 10 × 9 = 90"
            say: "Ten times nine is ninety. Is that true?"
            answer: true
          - id: l2-c9
            part: row-5
            type: text_input
            text: "9 × 5 = _"
            say: "Nine times five."
            answer: "45"
          - id: l2-c10
            part: row-5
            type: fill_in_blank
            text: "Count in fives. Which number is missing?"
            say: "Count in fives. Which number is missing?"
            frame: "30, 35, _, 45"
            options: ["40", "36", "50"]
            answer: ["40"]
          - id: l2-c11
            part: row-5
            type: multiple_choice
            text: "_ × 5 = 20"
            say: "How many fives make twenty?"
            options: ["4", "5", "15"]
            answer: "4"
          - id: l2-c12
            part: row-5
            type: text_input
            text: "A star has 5 points. How many points do 4 stars have?"
            say: "A star has five points. How many points do four stars have?"
            answer: "20"
          - id: l2-c13
            part: half
            type: fill_in_blank
            text: "Use the 10 times table."
            say: "Ten times six is how many? So five times six is how many?"
            frame: "10 × 6 = _, so 5 × 6 = _"
            options: ["60", "30", "55", "12"]
            answer: ["60", "30"]
          - id: l2-c14
            part: half
            type: multiple_choice
            text: "8 × 10 = 80. What is 8 × 5?"
            say: "Eight times ten is eighty. What is eight times five?"
            options: ["40", "75", "13"]
            answer: "40"
          - id: l2-c15
            part: half
            type: true_false
            text: "Is it true? 3 × 5 is half of 3 × 10."
            say: "Three times five is half of three times ten. Is that true?"
            answer: true
          - id: l2-c16
            part: half
            type: true_false
            text: "Is it true? 4 × 5 is double 4 × 10."
            say: "Four times five is double four times ten. Is that true?"
            answer: false
          - id: l2-c17
            part: in-row
            type: true_false
            text: "Is 45 in the 5 times table?"
            say: "Is forty-five in the five times table?"
            answer: true
          - id: l2-c18
            part: in-row
            type: true_false
            text: "Is 32 in the 5 times table?"
            say: "Is thirty-two in the five times table?"
            answer: false
          - id: l2-c19
            part: in-row
            type: multiple_choice
            text: "Which number is in the 10 times table?"
            say: "Which number is in the ten times table?"
            options: ["65", "70", "17"]
            answer: "70"
          - id: l2-c20
            part: in-row
            type: multiple_choice
            text: "Which number is in both the 5 and the 10 times tables?"
            say: "Which number is in both the five and the ten times tables?"
            options: ["15", "35", "60"]
            answer: "60"
