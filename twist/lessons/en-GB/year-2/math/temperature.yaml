# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.temperature
skill: math.mass-capacity.temperature
curriculum: en-GB
language: en
title:
  de: Temperatur ablesen und vergleichen
  en: Reading and comparing temperature
summary: >
  Temperature in degrees Celsius on a thermometer. Lesson 1 reads
  thermometers with marks every 10 or every 5 degrees; lesson 2 compares
  and orders temperatures, works out how many degrees warmer or colder,
  knows a few everyday temperatures (ice 0 °C, a classroom about 20 °C,
  boiling water 100 °C), and ends with the skill check. All temperatures
  stay at 0 °C or above, as Year 2 asks.
metadata:
  year: year-2
  topic: { de: Temperatur, en: Temperature }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.number-line]
  also_practises: [math.numbers-to-100.number-line, math.data.read-tables]
  vocabulary: { en: [temperature, thermometer, degrees Celsius, °C, warm, warmer, warmest, cold, colder, coldest, hot] }
  forms: [drawn, picture, text, audio]
  drawn: [number-line, thermometer, table]
  facets: []
  parts:
    - { id: read, what: { de: die Temperatur am Thermometer ablesen, en: reading the temperature on a thermometer } }
    - { id: compare, what: { de: "Temperaturen vergleichen und ordnen: wärmer, kälter", en: "comparing and ordering temperatures: warmer, colder" } }
    - { id: difference, what: { de: "ausrechnen, wie viel Grad wärmer oder kälter es ist", en: working out how many degrees warmer or colder } }
    - { id: everyday, what: { de: Temperaturen aus dem Alltag kennen, en: knowing everyday temperatures } }
  misconceptions:
    - id: step-is-one
      what: Counts each mark as 1 degree on a thermometer marked in fives (reads 25 as 21)
      addressed: lesson 1 Learn counts the marks in fives; l1-f2, l1-s2 and l1-c1 offer the one-step reading, with feedback in l1-f2
    - id: top-of-scale
      what: Reads the top of the thermometer, or the next label, instead of the top of the red line
      addressed: lesson 1 Learn points at the top of the red line; l1-f1 and l1-n1 offer the next label, with feedback in l1-f1
    - id: bigger-is-colder
      what: Mixes up warmer and colder when comparing (thinks the highest number is the coldest)
      addressed: lesson 2 Learn says the higher number is warmer; l2-f2 asks for the coldest day with feedback, l2-n1 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das Thermometer ablesen, en: Reading a thermometer }
    goal:
      de: "Lies am Thermometer ab, wie warm es ist, so wie die rote Linie, die bis 20 Grad reicht."
      en: "Read how warm it is on a thermometer, like a red line that reaches 20 degrees."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which number is the arrow pointing to?"
            show: { drawn: number-line, from: 0, to: 50, labels: tens, step: 10, mark: 30 }
            options: ["30", "3", "40"]
            answer: "30"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which number is the arrow pointing to?"
            show: { drawn: number-line, from: 20, to: 30, labels: ends, mark: 25 }
            options: ["25", "24", "52"]
            answer: "25"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "How warm is a classroom?\n2 degrees, 20 degrees or 80 degrees?"
            say: "How warm do you think it is in a classroom? Two degrees, twenty degrees or eighty degrees? Have a guess."
            show: { object: school }
          - text: "20 °C"
            say: "A thermometer tells us how hot or cold something is. That is its temperature. Look at the top of the red line. It reaches the 20. The temperature is twenty degrees Celsius. We write 20 °C. That's about how warm a classroom is."
            show: { drawn: thermometer, from: 0, to: 40, step: 10, value: 20 }
          - text: "10, 15"
            say: "This thermometer has a mark every five degrees. The red line goes one mark past the 10. Count on in fives: ten, fifteen. It is fifteen degrees Celsius."
            show: { drawn: thermometer, from: 0, to: 40, step: 5, value: 15 }
          - text: "30 °C is warmer than 15 °C."
            say: "The higher the red line, the warmer it is. Here it reaches the 30. Thirty degrees is warmer than fifteen degrees."
            show: { drawn: thermometer, from: 0, to: 40, step: 5, value: 30 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: 0, to: 40, step: 10, value: 30 }
                options: ["30 °C", "40 °C", "3 °C"]
                answer: "30 °C"
                feedback:
                  "40 °C": "40 is the top of the thermometer. Read the number at the top of the red line."
                hints:
                  - "Find the top of the red line."
                  - "Which number is next to the top of the red line?"
                  - "30 °C."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: 0, to: 40, step: 5, value: 25 }
                options: ["25 °C", "21 °C", "30 °C"]
                answer: "25 °C"
                feedback:
                  "21 °C": "Each mark is five degrees, not one. Count on in fives from 20."
                hints:
                  - "How many degrees is each mark?"
                  - "The marks go up in fives. The red line is one mark past 20."
                  - "25 °C."
              - id: l1-f3
                type: text_input
                text: "What temperature does the thermometer show? Write the number of degrees."
                show: { drawn: thermometer, from: 0, to: 30, step: 5, value: 15 }
                answer: "15"
                hints:
                  - "Find the number next to the top of the red line."
                  - "The red line is one mark past 10. Each mark is five."
                  - "15."
              - id: l1-f4
                type: true_false
                text: "The thermometer shows 35 °C."
                say: "The thermometer shows thirty-five degrees Celsius. Is that true?"
                show: { drawn: thermometer, from: 0, to: 50, step: 5, value: 30 }
                answer: false
                hints:
                  - "Look at the top of the red line."
                  - "It stops at a number. Which one?"
                  - "No. It shows 30 °C."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which thermometer shows 20 °C?"
                say: "Which thermometer shows twenty degrees Celsius?"
                options:
                  - { drawn: thermometer, from: 0, to: 40, step: 5, value: 20, key: "20" }
                  - { drawn: thermometer, from: 0, to: 40, step: 5, value: 25, key: "25" }
                  - { drawn: thermometer, from: 0, to: 40, step: 5, value: 10, key: "10" }
                answer: "20"
                hints:
                  - "Look at the top of each red line."
                  - "Find the red line that stops at the 20."
                  - "The thermometer with the red line up to the 20."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: 0, to: 30, step: 5, value: 10 }
                options: ["10 °C", "15 °C", "5 °C"]
                answer: "10 °C"
                hints: ["Find the number next to the top of the red line."]
              - id: l1-s2
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: 0, to: 50, step: 5, value: 45 }
                options: ["45 °C", "41 °C", "50 °C"]
                answer: "45 °C"
                hints: ["Each mark is five degrees. Count on from 40."]
              - id: l1-s3
                type: text_input
                text: "What temperature does the thermometer show? Write the number of degrees."
                show: { drawn: thermometer, from: 0, to: 30, step: 5, value: 5 }
                answer: "5"
                hints: ["The red line is one mark above 0."]
              - id: l1-s4
                type: true_false
                text: "The thermometer shows 20 °C."
                say: "The thermometer shows twenty degrees Celsius. Is that true?"
                show: { drawn: thermometer, from: 0, to: 40, step: 10, value: 20 }
                answer: true
                hints: ["Which number is at the top of the red line?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which thermometer shows 35 °C?"
                say: "Which thermometer shows thirty-five degrees Celsius?"
                options:
                  - { drawn: thermometer, from: 0, to: 40, step: 5, value: 35, key: "35" }
                  - { drawn: thermometer, from: 0, to: 40, step: 5, value: 30, key: "30" }
                  - { drawn: thermometer, from: 0, to: 40, step: 5, value: 15, key: "15" }
                answer: "35"
                hints: ["Thirty-five is one mark past 30."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: 0, to: 50, step: 10, value: 40 }
                options: ["40 °C", "50 °C", "4 °C"]
                answer: "40 °C"
              - id: l1-n2
                type: text_input
                text: "What temperature does the thermometer show? Write the number of degrees."
                show: { drawn: thermometer, from: 0, to: 40, step: 5, value: 35 }
                answer: "35"
              - id: l1-n3
                type: true_false
                text: "The thermometer shows 15 °C."
                say: "The thermometer shows fifteen degrees Celsius. Is that true?"
                show: { drawn: thermometer, from: 0, to: 30, step: 5, value: 20 }
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: 0, to: 100, step: 10, value: 50 }
                options: ["50 °C", "5 °C", "60 °C"]
                answer: "50 °C"
              - id: l1-n5
                type: image_multiple_choice
                text: "Which thermometer shows 15 °C?"
                say: "Which thermometer shows fifteen degrees Celsius?"
                options:
                  - { drawn: thermometer, from: 0, to: 50, step: 5, value: 15, key: "15" }
                  - { drawn: thermometer, from: 0, to: 50, step: 5, value: 50, key: "50" }
                  - { drawn: thermometer, from: 0, to: 50, step: 5, value: 10, key: "10" }
                answer: "15"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What temperature does the thermometer show?"
            show: { drawn: thermometer, from: 0, to: 40, step: 5, value: 20 }
            options: ["20 °C", "25 °C", "15 °C"]
            answer: "20 °C"
          - id: l1-c2
            type: text_input
            text: "What temperature does the thermometer show? Write the number of degrees."
            show: { drawn: thermometer, from: 0, to: 50, step: 5, value: 45 }
            answer: "45"
          - id: l1-c3
            type: true_false
            text: "The thermometer shows 10 °C."
            say: "The thermometer shows ten degrees Celsius. Is that true?"
            show: { drawn: thermometer, from: 0, to: 30, step: 5, value: 10 }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "What temperature does the thermometer show?"
            show: { drawn: thermometer, from: 0, to: 30, step: 5, value: 25 }
            options: ["25 °C", "22 °C", "30 °C"]
            answer: "25 °C"
          - id: l1-c5
            type: image_multiple_choice
            text: "Which thermometer shows 40 °C?"
            say: "Which thermometer shows forty degrees Celsius?"
            options:
              - { drawn: thermometer, from: 0, to: 50, step: 5, value: 45, key: "45" }
              - { drawn: thermometer, from: 0, to: 50, step: 5, value: 40, key: "40" }
              - { drawn: thermometer, from: 0, to: 50, step: 5, value: 35, key: "35" }
            answer: "40"
          - id: l1-c6
            type: text_input
            text: "What temperature does the thermometer show? Write the number of degrees."
            show: { drawn: thermometer, from: 0, to: 100, step: 10, value: 80 }
            answer: "80"

  - n: 2
    title: { de: "Wärmer oder kälter?", en: "Warmer or colder?" }
    goal:
      de: "Vergleiche Temperaturen und finde heraus, wie viel wärmer es ist, so wie 20 Grad sind 5 Grad wärmer als 15."
      en: "Compare temperatures and find how much warmer it is, like 20 degrees is 5 degrees warmer than 15."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What temperature does the thermometer show?"
            show: { drawn: thermometer, from: 0, to: 40, step: 5, value: 30 }
            options: ["30 °C", "35 °C", "26 °C"]
            answer: "30 °C"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "What temperature does the thermometer show? Write the number of degrees."
            show: { drawn: thermometer, from: 0, to: 30, step: 5, value: 25 }
            answer: "25"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Monday: 15 °C\nTuesday: 20 °C\nWhich day was warmer?"
            say: "On Monday it was fifteen degrees. On Tuesday it was twenty degrees. Which day do you think was warmer? Have a guess."
          - text: "Monday: 15 °C\nTuesday: 20 °C\nTuesday was warmer."
            say: "Tuesday! Twenty is more than fifteen, so Tuesday was warmer. The higher the number, the warmer it is. The lower the number, the colder it is."
          - text: "20 − 15 = 5\nTuesday was 5 degrees warmer."
            say: "How much warmer was Tuesday? Find the difference: twenty take away fifteen is five. Tuesday was five degrees warmer than Monday."
          - text: "ice: 0 °C\na fridge: about 5 °C\na classroom: about 20 °C\nyour body: about 37 °C\nboiling water: 100 °C"
            say: "Some temperatures to know. Ice and snow are about nought degrees. Inside a fridge it is about five degrees. A classroom is about twenty degrees. Your body is about thirty-seven degrees. Boiling water is one hundred degrees."
          - text: "Did you know? The hottest day ever measured in the UK was in July 2022. It was more than 40 °C!"
            say: "Did you know? The hottest day ever measured in the United Kingdom was in July twenty twenty-two. It was more than forty degrees Celsius! That's hotter than your body."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is warmer?"
                say: "Which temperature is warmer?"
                options: ["15 °C", "25 °C"]
                answer: "25 °C"
                hints:
                  - "The higher the number, the warmer it is."
                  - "Which is more, fifteen or twenty-five?"
                  - "25 °C."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which day was the coldest?"
                show: { drawn: table, rows: [[Day, Temperature], [Monday, "12 °C"], [Tuesday, "8 °C"], [Wednesday, "15 °C"]] }
                options: ["Monday", "Tuesday", "Wednesday"]
                keep_order: true
                answer: "Tuesday"
                feedback:
                  "Wednesday": "15 °C is the highest number, so Wednesday was the warmest day. The coldest day has the lowest number."
                hints:
                  - "The coldest day has the lowest temperature."
                  - "Which is the smallest number: 12, 8 or 15?"
                  - "Tuesday."
              - id: l2-f3
                type: text_input
                text: "In the morning it was 10 °C. In the afternoon it was 25 °C. How many degrees warmer was the afternoon?"
                say: "In the morning it was ten degrees. In the afternoon it was twenty-five degrees. How many degrees warmer was the afternoon?"
                answer: "15"
                hints:
                  - "Find the difference between the two temperatures."
                  - "Count on from ten to twenty-five."
                  - "15."
              - id: l2-f4
                type: image_multiple_choice
                text: "Which of these is about 0 °C?"
                say: "Which of these is about nought degrees Celsius?"
                options:
                  - { object: snowman }
                  - { object: oven }
                  - { object: swimming-pool }
                answer: "snowman"
                hints:
                  - "Nought degrees is very cold."
                  - "Ice and snow are about nought degrees."
                  - "The snowman."
              - id: l2-f5
                type: multiple_choice
                text: "Which is the best temperature for a warm summer day?"
                say: "Which is the best temperature for a warm summer day in England?"
                options: ["0 °C", "25 °C", "100 °C"]
                keep_order: true
                answer: "25 °C"
                hints:
                  - "A warm day is warmer than a classroom, but not boiling."
                  - "Nought degrees is icy and one hundred degrees is boiling water."
                  - "25 °C."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Put the temperatures in order, coldest first."
                say: "Put the temperatures in order, from the coldest to the warmest."
                options: ["30 °C", "5 °C", "18 °C"]
                slot_count: 3
                answer: ["5 °C", "18 °C", "30 °C"]
                hints: ["The coldest has the lowest number."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which thermometer shows the warmest temperature?"
                options:
                  - { drawn: thermometer, from: 0, to: 40, step: 5, value: 20, key: "20" }
                  - { drawn: thermometer, from: 0, to: 40, step: 5, value: 35, key: "35" }
                  - { drawn: thermometer, from: 0, to: 40, step: 5, value: 10, key: "10" }
                answer: "35"
                hints: ["The warmest has the highest red line."]
              - id: l2-s3
                type: text_input
                text: "The bath water was 40 °C. It cooled down to 30 °C. How many degrees colder is it now?"
                say: "The bath water was forty degrees. It cooled down to thirty degrees. How many degrees colder is it now?"
                show: { object: bath }
                answer: "10"
                hints: ["Forty take away thirty."]
              - id: l2-s4
                type: true_false
                text: "Boiling water is 100 °C."
                say: "Boiling water is one hundred degrees Celsius. Is that true?"
                answer: true
                hints: ["Think of the temperatures to know: ice, a classroom, boiling water."]
              - id: l2-s5
                type: multiple_choice
                text: "How much warmer was Tuesday than Wednesday?"
                show: { drawn: table, rows: [[Day, Temperature], [Monday, "20 °C"], [Tuesday, "25 °C"], [Wednesday, "18 °C"]] }
                options: ["7 degrees", "5 degrees", "43 degrees"]
                answer: "7 degrees"
                hints: ["Find the difference between 25 and 18."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is colder?"
                say: "Which temperature is colder?"
                options: ["21 °C", "12 °C"]
                answer: "12 °C"
              - id: l2-n2
                type: ordering
                text: "Put the temperatures in order, coldest first."
                say: "Put the temperatures in order, from the coldest to the warmest."
                options: ["25 °C", "0 °C", "37 °C", "9 °C"]
                slot_count: 4
                answer: ["0 °C", "9 °C", "25 °C", "37 °C"]
              - id: l2-n3
                type: multiple_choice
                text: "Which is the best temperature for a classroom?"
                options: ["2 °C", "20 °C", "80 °C"]
                keep_order: true
                answer: "20 °C"
                feedback:
                  "80 °C": "At 80 °C your crayons would melt! A classroom is comfy, not boiling hot."
              - id: l2-n4
                type: true_false
                text: "Snow is about 30 °C."
                say: "Snow is about thirty degrees Celsius. Is that true?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "At 9 am it was 14 °C. By 2 pm it was 6 degrees warmer. What was the temperature at 2 pm? Write the number of degrees."
                say: "At nine in the morning it was fourteen degrees. By two in the afternoon it was six degrees warmer. What was the temperature at two o'clock?"
                answer: "20"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "What temperature does the thermometer show?"
            show: { drawn: thermometer, from: 0, to: 50, step: 5, value: 40 }
            options: ["40 °C", "45 °C", "35 °C"]
            answer: "40 °C"
          - id: l2-c2
            part: read
            type: text_input
            text: "What temperature does the thermometer show? Write the number of degrees."
            show: { drawn: thermometer, from: 0, to: 40, step: 5, value: 30 }
            answer: "30"
          - id: l2-c3
            part: compare
            type: multiple_choice
            text: "Which day was the warmest?"
            show: { drawn: table, rows: [[Day, Temperature], [Thursday, "16 °C"], [Friday, "11 °C"], [Saturday, "19 °C"]] }
            options: ["Thursday", "Friday", "Saturday"]
            keep_order: true
            answer: "Saturday"
          - id: l2-c4
            part: difference
            type: text_input
            text: "Monday was 8 °C. Tuesday was 17 °C. How many degrees warmer was Tuesday?"
            say: "Monday was eight degrees. Tuesday was seventeen degrees. How many degrees warmer was Tuesday?"
            answer: "9"
          - id: l2-c5
            part: everyday
            type: true_false
            text: "A cold drink from the fridge is about 5 °C."
            say: "A cold drink from the fridge is about five degrees Celsius. Is that true?"
            answer: true
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "What temperature does the thermometer show?"
            show: { drawn: thermometer, from: 0, to: 100, step: 10, value: 70 }
            options: ["70 °C", "7 °C", "80 °C"]
            answer: "70 °C"
          - id: l2-c7
            part: read
            type: text_input
            text: "What temperature does the thermometer show? Write the number of degrees."
            show: { drawn: thermometer, from: 0, to: 100, step: 10, value: 60 }
            answer: "60"
          - id: l2-c8
            part: read
            type: true_false
            text: "The thermometer shows 35 °C."
            say: "The thermometer shows thirty-five degrees Celsius. Is that true?"
            show: { drawn: thermometer, from: 0, to: 50, step: 5, value: 35 }
            answer: true
          - id: l2-c9
            part: compare
            type: image_multiple_choice
            text: "Which thermometer shows the coldest temperature?"
            say: "Which thermometer shows the coldest temperature?"
            options:
              - { drawn: thermometer, from: 0, to: 40, step: 5, value: 25, key: "25" }
              - { drawn: thermometer, from: 0, to: 40, step: 5, value: 15, key: "15" }
              - { drawn: thermometer, from: 0, to: 40, step: 5, value: 30, key: "30" }
            answer: "15"
          - id: l2-c10
            part: compare
            type: ordering
            text: "Put the temperatures in order, warmest first."
            say: "Put the temperatures in order, from the warmest to the coldest."
            options: ["14 °C", "32 °C", "7 °C", "21 °C"]
            slot_count: 4
            answer: ["32 °C", "21 °C", "14 °C", "7 °C"]
          - id: l2-c11
            part: compare
            type: true_false
            text: "17 °C is warmer than 23 °C."
            say: "Seventeen degrees Celsius is warmer than twenty-three degrees Celsius. Is that true?"
            answer: false
          - id: l2-c12
            part: compare
            type: multiple_choice
            text: "On Monday, which town was warmer than Leeds?"
            say: "Look at the table. On Monday, which town was warmer than Leeds?"
            show: { drawn: table, rows: [[Town, Temperature], [Leeds, "9 °C"], [Bristol, "13 °C"], [York, "6 °C"]] }
            options: ["Bristol", "York"]
            keep_order: true
            answer: "Bristol"
          - id: l2-c13
            part: difference
            type: text_input
            text: "At 8 am it was 6 °C. At noon it was 18 °C. How many degrees warmer was it at noon?"
            say: "At eight in the morning it was six degrees. At noon it was eighteen degrees. How many degrees warmer was it at noon?"
            answer: "12"
          - id: l2-c14
            part: difference
            type: multiple_choice
            text: "How much colder was Saturday than Friday?"
            say: "Look at the table. How much colder was Saturday than Friday?"
            show: { drawn: table, rows: [[Day, Temperature], [Friday, "24 °C"], [Saturday, "15 °C"]] }
            options: ["9 degrees", "39 degrees", "11 degrees"]
            answer: "9 degrees"
          - id: l2-c15
            part: difference
            type: text_input
            text: "A cup of tea was 70 °C. It cooled down by 20 degrees. What is its temperature now? Write the number of degrees."
            say: "A cup of tea was seventy degrees. It cooled down by twenty degrees. What is its temperature now?"
            answer: "50"
          - id: l2-c16
            part: difference
