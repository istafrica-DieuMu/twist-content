# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.ones-bridge
skill: math.add-sub-to-100.ones-bridge
curriculum: en-GB
language: en
title:
  de: Einer mit Zehnerübergang
  en: Adding and subtracting ones across a ten
summary: >
  Adding and subtracting ones across a ten, in steps via the next ten
  (38 + 5 = 38 + 2 + 3, 43 − 6 = 43 − 3 − 3). Lesson 1 adds: split the
  ones, hop to the next ten on an empty number line, then hop on.
  Lesson 2 subtracts back to the ten and on, and ends with the skill
  check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.ones-no-bridge, math.add-sub-to-20.sub-bridge-10]
  also_practises: [math.numbers-to-20.partition-to-10]
  vocabulary: { en: [next ten, cross a ten, split, number bond, empty number line, in steps] }
  forms: [drawn, text, audio]
  drawn: [equation, rechenstrich]
  facets: [currency]
  misconceptions:
    - id: tens-stay
      what: Keeps the tens the same after crossing a ten (27 + 6 = 23)
      addressed: lesson 1 Learn crosses the ten on the empty number line and says the tens change; 23 is an option with feedback in l1-f1; l1-n5 is a false statement with the tens kept (63 + 9 = 62)
    - id: wrong-split
      what: Splits the ones so the first hop misses the ten (47 + 6 = 47 + 2 + 4)
      addressed: the which-hop-first tasks l1-f3, l1-s3, l2-f3, l2-s3 and l2-c4 ask how far it is to the ten; l1-s4 asks whether a wrong first hop reaches 50
    - id: ones-reversed
      what: Takes the smaller ones digit from the larger in a subtraction (52 − 7 = 55, from 7 − 2)
      addressed: lesson 2 Learn goes back to the ten first and warns against 6 − 3; the reversed answer 55 is an option with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Über den Zehner dazu, en: Adding across a ten }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "13 − 5 = _"
            say: "Thirteen subtract five."
            options: ["7", "8", "9"]
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "36 + 3 = _"
            say: "Thirty-six add three."
            answer: "39"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "38 + 5"
            say: "Thirty-eight add five. Thirty-eight needs two more to reach the next ten, forty. So we split the five into two and three."
            show: { drawn: equation, text: "38 + 5 = _", split: "5 = 2 + 3" }
          - text: "38 + 2 = 40 · 40 + 3 = 43"
            say: "On the empty number line: hop two to forty. Then hop three more to forty-three."
            show: { drawn: rechenstrich, start: 38, jumps: [2, 3] }
          - text: "38 + 5 = 43"
            say: "We crossed a ten, so the tens changed too. Three tens became four tens."
          - text: "8 + 5 = 13 · 38 + 5 = 43"
            say: "The related fact helps. Eight add five is thirteen, so thirty-eight add five is forty-three."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "27 + 6 = _"
                say: "Twenty-seven add six."
                show: { drawn: equation, text: "27 + 6 = _", split: "6 = 3 + 3" }
                options: ["33", "23", "34"]
                answer: "33"
                feedback:
                  "23": "You crossed thirty, so there are three tens now, not two."
                hints:
                  - "Twenty-seven needs three to reach thirty."
                  - "Thirty, then three more."
                  - "33."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Work it out in steps."
                say: "Forty-five add seven. Hop to fifty first, then add the rest."
                frame: "45 + 7 = 45 + 5 + _ = _"
                options: ["2", "3", "52", "57"]
                answer: ["2", "52"]
                hints:
                  - "Seven is five and how many more?"
                  - "Five and two make seven. Forty-five add five is fifty."
                  - "2, and then 52."
              - id: l1-f3
                type: multiple_choice
                text: "59 + 4: which hop takes you to 60 first?"
                say: "Fifty-nine add four. Which hop takes you exactly to sixty?"
                show: { drawn: rechenstrich, start: 59, jumps: [] }
                options: ["1", "4", "3"]
                answer: "1"
                hints:
                  - "How far is it from fifty-nine to sixty?"
                  - "Fifty-nine and one more is sixty."
                  - "1."
              - id: l1-f4
                type: text_input
                text: "66 + 8 = _"
                say: "Sixty-six add eight. Hop four to seventy, then four more."
                show: { drawn: rechenstrich, start: 66, jumps: [4, 4] }
                answer: "74"
                hints:
                  - "The first hop takes you to seventy."
                  - "Seventy, then four more."
                  - "74."
              - id: l1-f5
                type: true_false
                text: "Is it true? 84 + 9 = 93"
                say: "Eighty-four add nine is ninety-three. Is that true?"
                answer: true
                hints:
                  - "Eighty-four needs six to reach ninety."
                  - "Nine is six and three. Ninety, then three more."
                  - "Yes, 93."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "36 + 7 = _"
                say: "Thirty-six add seven."
                answer: "43"
                hints: ["Thirty-six needs four to reach forty."]
              - id: l1-s2
                type: fill_in_blank
                text: "Work it out in steps."
                say: "Seventy-eight add five. Hop to eighty first, then add the rest."
                frame: "78 + 5 = 78 + 2 + _ = _"
                options: ["3", "5", "83", "85"]
                answer: ["3", "83"]
                hints: ["Five is two and how many more?"]
              - id: l1-s3
                type: multiple_choice
                text: "23 + 9: which hop takes you to 30 first?"
                say: "Twenty-three add nine. Which hop takes you exactly to thirty?"
                show: { drawn: rechenstrich, start: 23, jumps: [] }
                options: ["7", "9", "3"]
                answer: "7"
                hints: ["How far is it from twenty-three to thirty?"]
              - id: l1-s4
                type: true_false
                text: "47 + 6 = 47 + 2 + 4. Does the first hop reach 50?"
                say: "Forty-seven add six, split as forty-seven add two add four. Does the first hop reach fifty?"
                answer: false
                hints: ["How far is it from forty-seven to fifty?"]
              - id: l1-s5
                type: text_input
                text: "58 + 4 = _"
                say: "Fifty-eight add four."
                answer: "62"
                hints: ["Fifty-eight needs two to reach sixty."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "19 + 5 = _"
                say: "Nineteen add five."
                options: ["24", "14", "25"]
                answer: "24"
              - id: l1-n2
                type: text_input
                text: "75 + 8 = _"
                say: "Seventy-five add eight."
                answer: "83"
              - id: l1-n3
                type: fill_in_blank
                text: "Work it out in steps."
                say: "Thirty-four add nine. Hop to forty first, then add the rest."
                frame: "34 + 9 = 34 + 6 + _ = _"
                options: ["3", "4", "43", "44"]
                answer: ["3", "43"]
              - id: l1-n4
                type: multiple_choice
                text: "Leo has 88p. His gran gives him 6p. How much money does he have now?"
                say: "Leo has eighty-eight pence. His gran gives him six pence. How much money does he have now?"
                options: ["94p", "84p", "95p"]
                answer: "94p"
              - id: l1-n5
                type: true_false
                text: "Is it true? 63 + 9 = 62"
                say: "Sixty-three add nine is sixty-two. Is that true?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "28 + 7 = _"
            say: "Twenty-eight add seven."
            answer: "35"
          - id: l1-c2
            type: fill_in_blank
            text: "Work it out in steps."
            say: "Fifty-six add six. Hop to sixty first, then add the rest."
            frame: "56 + 6 = 56 + 4 + _ = _"
            options: ["2", "3", "62", "60"]
            answer: ["2", "62"]
          - id: l1-c3
            type: multiple_choice
            text: "39 + 3 = _"
            say: "Thirty-nine add three."
            options: ["42", "32", "43"]
            answer: "42"

  - n: 2
    title: { de: Über den Zehner zurück, en: Subtracting across a ten }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "67 + 5 = _"
            say: "Sixty-seven add five."
            answer: "72"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "47 + 5: which hop takes you to 50 first?"
            say: "Forty-seven add five. Which hop takes you exactly to fifty?"
            show: { drawn: rechenstrich, start: 47, jumps: [] }
            options: ["3", "5", "2"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "43 − 6"
            say: "Forty-three subtract six. First go back to forty: that is three. So we split the six into three and three."
            show: { drawn: equation, text: "43 − 6 = _", split: "6 = 3 + 3" }
          - text: "43 − 3 = 40 · 40 − 3 = 37"
            say: "On the empty number line: hop back three to forty. Then hop back three more to thirty-seven."
            show: { drawn: rechenstrich, start: 43, jumps: [-3, -3] }
          - text: "43 − 6 = 37"
            say: "We crossed forty, so there are only three tens now. Take care: forty-three has three ones, and you take away six. Do not work out six subtract three instead."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "52 − 7 = _"
                say: "Fifty-two subtract seven."
                show: { drawn: equation, text: "52 − 7 = _", split: "7 = 2 + 5" }
                options: ["45", "55", "44"]
                answer: "45"
                feedback:
                  "55": "You took two away from seven. Go back to fifty first, then take away five more."
                hints:
                  - "Go back to fifty first: that is two."
                  - "Seven is two and five. Fifty subtract five."
                  - "45."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Work it out in steps."
                say: "Sixty-one subtract four. Go back to sixty first, then take away the rest."
                frame: "61 − 4 = 61 − 1 − _ = _"
                options: ["3", "4", "57", "63"]
                answer: ["3", "57"]
                hints:
                  - "Four is one and how many more?"
                  - "One and three make four. Sixty subtract three."
                  - "3, and then 57."
              - id: l2-f3
                type: multiple_choice
                text: "84 − 7: which hop back takes you to 80 first?"
                say: "Eighty-four subtract seven. Which hop back takes you exactly to eighty?"
                show: { drawn: rechenstrich, start: 84, jumps: [], back: true }
                options: ["4", "7", "3"]
                answer: "4"
                hints:
                  - "How far is it from eighty-four back to eighty?"
                  - "Eighty-four has four ones."
                  - "4."
              - id: l2-f4
                type: text_input
                text: "35 − 8 = _"
                say: "Thirty-five subtract eight. Hop back five to thirty, then three more."
                show: { drawn: rechenstrich, start: 35, jumps: [-5, -3] }
                answer: "27"
                hints:
                  - "The first hop takes you back to thirty."
                  - "Thirty, then back three more."
                  - "27."
              - id: l2-f5
                type: true_false
                text: "Is it true? 72 − 5 = 67"
                say: "Seventy-two subtract five is sixty-seven. Is that true?"
                answer: true
                hints:
                  - "Go back two to seventy."
                  - "Five is two and three. Seventy subtract three."
                  - "Yes, 67."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "44 − 7 = _"
                say: "Forty-four subtract seven."
                answer: "37"
                hints: ["Go back to forty first: that is four."]
              - id: l2-s2
                type: fill_in_blank
                text: "Work it out in steps."
                say: "Ninety-three subtract five. Go back to ninety first, then take away the rest."
                frame: "93 − 5 = 93 − 3 − _ = _"
                options: ["2", "5", "88", "98"]
                answer: ["2", "88"]
                hints: ["Five is three and how many more?"]
              - id: l2-s3
                type: multiple_choice
                text: "26 − 9: which hop back takes you to 20 first?"
                say: "Twenty-six subtract nine. Which hop back takes you exactly to twenty?"
                show: { drawn: rechenstrich, start: 26, jumps: [], back: true }
                options: ["6", "9", "3"]
                answer: "6"
                hints: ["How many ones does twenty-six have?"]
              - id: l2-s4
                type: true_false
                text: "Is it true? 31 − 4 = 33"
                say: "Thirty-one subtract four is thirty-three. Is that true?"
                answer: false
                hints: ["Taking away makes the number smaller. Go back to thirty first."]
              - id: l2-s5
                type: text_input
                text: "57 + 6 = _"
                say: "Fifty-seven add six."
                answer: "63"
                hints: ["Add or subtract? Look at the sign."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "65 − 9 = _"
                say: "Sixty-five subtract nine."
                answer: "56"
              - id: l2-n2
                type: fill_in_blank
                text: "Work it out in steps."
                say: "Forty-two subtract eight. Go back to forty first, then take away the rest."
                frame: "42 − 8 = 42 − 2 − _ = _"
                options: ["6", "8", "34", "36"]
                answer: ["6", "34"]
              - id: l2-n3
                type: multiple_choice
                text: "71 − 3 = _"
                say: "Seventy-one subtract three."
                options: ["68", "72", "74"]
                answer: "68"
              - id: l2-n4
                type: multiple_choice
                text: "There are 23 cakes on a plate. The children eat 5 of them. How many cakes are left?"
                say: "There are twenty-three cakes on a plate. The children eat five of them. How many cakes are left?"
                options: ["18", "28", "22"]
                answer: "18"
              - id: l2-n5
                type: true_false
                text: "Is it true? 96 − 8 = 88"
                say: "Ninety-six subtract eight is eighty-eight. Is that true?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "49 + 6 = _"
            say: "Forty-nine add six."
            answer: "55"
          - id: l2-c2
            type: text_input
            text: "62 − 5 = _"
            say: "Sixty-two subtract five."
            answer: "57"
          - id: l2-c3
            type: fill_in_blank
            text: "Work it out in steps."
            say: "Eighty-five subtract seven. Go back to eighty first, then take away the rest."
            frame: "85 − 7 = 85 − 5 − _ = _"
            options: ["2", "7", "78", "80"]
            answer: ["2", "78"]
          - id: l2-c4
            type: multiple_choice
            text: "74 + 8: which hop takes you to 80 first?"
            say: "Seventy-four add eight. Which hop takes you exactly to eighty?"
            show: { drawn: rechenstrich, start: 74, jumps: [] }
            options: ["6", "8", "4"]
            answer: "6"
          - id: l2-c5
            type: multiple_choice
            text: "33 − 6 = _"
            say: "Thirty-three subtract six."
            options: ["27", "37", "23"]
            answer: "27"
