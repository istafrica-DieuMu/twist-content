# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.div-inverse
skill: math.mult-div.div-inverse
curriculum: en-GB
language: en
title:
  de: Teilen mit der Umkehraufgabe
  en: Dividing with the times tables
summary: >
  Solving a division with the matching multiplication. Lesson 1 turns
  40 ÷ 5 into "what times 5 makes 40?" and uses the multiplication to
  check the answer; lesson 2 builds fact families of two
  multiplications and two divisions from three numbers (4 × 10, 10 × 4,
  40 ÷ 4, 40 ÷ 10), and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Geteiltaufgaben, en: Division }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-meaning, math.mult-div.core-facts]
  also_practises: [math.mult-div.commutative, math.mult-div.all-tables]
  vocabulary: { en: [divide, share, groups of, inverse, fact family, multiplication, division] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: divide, what: { de: Geteiltaufgaben mit der passenden Malaufgabe lösen, en: solving a division with the matching multiplication } }
    - { id: check, what: { de: eine Geteiltaufgabe mit der Malaufgabe prüfen, en: checking a division with a multiplication } }
    - { id: family, what: { de: Aufgabenfamilien bilden, en: writing fact families } }
  misconceptions:
    - id: divide-subtracts
      what: Subtracts instead of dividing (12 ÷ 3 = 9)
      addressed: lesson 1 Learn asks how many fives make 40; l1-f1 (with feedback), l1-s1 and l1-c1 offer the subtraction answer
    - id: family-swaps-division
      what: Puts the small number first in a division of the fact family (3 ÷ 12)
      addressed: lesson 2 Learn says a division starts with the biggest number; l2-f3 (with feedback), l2-s3 and l2-c4 offer a division that starts with a small number
    - id: family-wrong-member
      what: Puts a fact with a different number into the fact family (3 × 4 = 12 and 12 ÷ 2 = 6)
      addressed: l2-f2 and l2-n4 ask which fact does not belong
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Teilen mit Malaufgaben, en: Divide by thinking times }
    goal:
      de: "Löse eine Geteiltaufgabe mit einer Malaufgabe, so wie 40 geteilt durch 5 ist 8, weil 8 mal 5 gleich 40 ist."
      en: "Solve a division with a times fact, like 40 divided by 5 is 8, because 8 times 5 is 40."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "10 sweets shared between 2 children. How many each?"
            say: "Ten sweets are shared equally between two children. How many does each child get?"
            options: ["5", "8", "2"]
            answer: "5"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "5 × 4 = _"
            say: "Five times four."
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "40 ÷ 5 = ?"
            say: "Forty divided by five. How many groups of five make forty?"
            show: { drawn: dots, array: [8, 5] }
          - text: "? × 5 = 40"
            say: "Think of the five times table. What times five makes forty? Eight times five is forty. Eight rows of five."
            show: { drawn: dots, array: [8, 5] }
          - text: "40 ÷ 5 = 8"
            say: "So forty divided by five is eight. Check it: eight times five is forty. Multiplying and dividing are inverses: one undoes the other."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "15 ÷ 5 = _"
                say: "Fifteen divided by five."
                show: { drawn: dots, array: [3, 5] }
                options: ["3", "10", "5"]
                answer: "3"
                feedback:
                  "10": "Ten is fifteen take away five. Dividing asks how many fives make fifteen."
                hints:
                  - "What times five makes fifteen?"
                  - "Count the rows of five."
                  - "3 × 5 = 15, so 3."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Use the multiplication."
                say: "Twenty divided by ten. What times ten makes twenty?"
                frame: "_ × 10 = 20 · 20 ÷ 10 = _"
                options: ["2", "10", "20", "200"]
                answer: ["2", "2"]
                hints:
                  - "Count in tens up to twenty."
                  - "Ten, twenty: that is two tens."
                  - "2 and 2."
              - id: l1-f3
                type: multiple_choice
                text: "Which multiplication helps with 14 ÷ 2?"
                say: "Which multiplication helps you work out fourteen divided by two?"
                options: ["7 × 2 = 14", "14 × 2 = 28", "2 × 2 = 4"]
                answer: "7 × 2 = 14"
                hints:
                  - "Look for a multiplication that makes fourteen."
                  - "What times two makes fourteen?"
                  - "7 × 2 = 14."
              - id: l1-f4
                type: text_input
                text: "30 ÷ 5 = _"
                say: "Thirty divided by five."
                answer: "6"
                hints:
                  - "What times five makes thirty?"
                  - "Count in fives: five, ten, fifteen, twenty, twenty-five, thirty."
                  - "6."
              - id: l1-f5
                type: true_false
                text: "Is it true? 18 ÷ 2 = 9, because 9 × 2 = 18."
                say: "Eighteen divided by two is nine, because nine times two is eighteen. Is that true?"
                answer: true
                hints:
                  - "Check the multiplication."
                  - "Nine twos: double nine is eighteen."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "20 ÷ 5 = _"
                say: "Twenty divided by five."
                options: ["4", "15", "5"]
                answer: "4"
                hints: ["What times five makes twenty?"]
              - id: l1-s2
                type: text_input
                text: "16 ÷ 2 = _"
                say: "Sixteen divided by two."
                answer: "8"
                hints: ["What times two makes sixteen?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Use the multiplication."
                say: "Fifty divided by ten. What times ten makes fifty?"
                frame: "_ × 10 = 50 · 50 ÷ 10 = _"
                options: ["5", "10", "40"]
                answer: ["5", "5"]
                hints: ["How many tens make fifty?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? 12 ÷ 2 = 5"
                say: "Twelve divided by two is five. Is that true?"
                answer: false
                hints: ["Check: five times two is ten, not twelve."]
              - id: l1-s5
                type: multiple_choice
                text: "Which multiplication checks 35 ÷ 5 = 7?"
                say: "Which multiplication checks that thirty-five divided by five is seven?"
                options: ["7 × 5 = 35", "5 × 5 = 25", "35 × 5 = 175"]
                answer: "7 × 5 = 35"
                hints: ["Multiply the answer by five."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "40 ÷ 10 = _"
                say: "Forty divided by ten."
                answer: "4"
              - id: l1-n2
                type: text_input
                text: "10 ÷ 2 = _"
                say: "Ten divided by two."
                answer: "5"
              - id: l1-n3
                type: multiple_choice
                text: "45 ÷ 5 = _"
                say: "Forty-five divided by five."
                options: ["9", "40", "8"]
                answer: "9"
              - id: l1-n4
                type: true_false
                text: "Is it true? 25 ÷ 5 = 5"
                say: "Twenty-five divided by five is five. Is that true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "8 ÷ 2 = _"
                say: "Eight divided by two."
                answer: "4"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "10 ÷ 5 = _"
            say: "Ten divided by five."
            options: ["2", "5", "15"]
            answer: "2"
          - id: l1-c2
            type: text_input
            text: "70 ÷ 10 = _"
            say: "Seventy divided by ten."
            answer: "7"
          - id: l1-c3
            type: text_input
            text: "6 ÷ 2 = _"
            say: "Six divided by two."
            answer: "3"
          - id: l1-c4
            type: multiple_choice
            text: "Which multiplication helps with 4 ÷ 2?"
            say: "Which multiplication helps you work out four divided by two?"
            options: ["2 × 2 = 4", "4 × 2 = 8", "1 × 2 = 2"]
            answer: "2 × 2 = 4"
          - id: l1-c5
            type: text_input
            text: "30 ÷ 10 = _"
            say: "Thirty divided by ten."
            answer: "3"
          - id: l1-c6
            type: true_false
            text: "Is it true? 20 ÷ 10 = 3"
            say: "Twenty divided by ten is three. Is that true?"
            answer: false

  - n: 2
    title: { de: Aufgabenfamilien, en: Fact families }
    goal:
      de: "Bilde aus drei Zahlen wie 4, 10 und 40 eine Aufgabenfamilie mit zwei Malaufgaben und zwei Geteiltaufgaben."
      en: "Make a fact family from three numbers, like 4, 10 and 40, with two times facts and two divisions."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "15 ÷ 5 = _"
            say: "Fifteen divided by five."
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which multiplication helps with 18 ÷ 2?"
            say: "Which multiplication helps you work out eighteen divided by two?"
            options: ["9 × 2 = 18", "18 × 2 = 36", "8 × 2 = 16"]
            answer: "9 × 2 = 18"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4, 10, 40"
            say: "Three numbers: four, ten and forty. Four rows of ten make forty."
            show: { drawn: dots, array: [4, 10] }
          - text: "4 × 10 = 40   10 × 4 = 40"
            say: "Two multiplications: four times ten is forty, and ten times four is forty."
            show: { drawn: dots, array: [4, 10] }
          - text: "40 ÷ 4 = 10   40 ÷ 10 = 4"
            say: "Two divisions: forty divided by four is ten, and forty divided by ten is four. A division starts with the biggest number, forty."
          - text: "A fact family"
            say: "These four facts are a fact family. They all use the same three numbers. Know one, and you know all four."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Finish the fact family of 2, 5 and 10."
                say: "Finish the fact family of two, five and ten."
                show: { drawn: dots, array: [2, 5] }
                frame: "2 × 5 = 10 · 5 × 2 = _ · 10 ÷ 2 = _ · 10 ÷ 5 = _"
                options: ["10", "5", "2", "8"]
                answer: ["10", "5", "2"]
                hints:
                  - "The same three numbers in every fact."
                  - "Swap the multiplication, then divide ten each way."
                  - "10, 5, 2."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which fact is not in the family of 4, 5 and 20?"
                say: "Which fact is not in the fact family of four, five and twenty?"
                options: ["20 ÷ 2 = 10", "20 ÷ 4 = 5", "5 × 4 = 20"]
                answer: "20 ÷ 2 = 10"
                hints:
                  - "Every fact uses four, five and twenty."
                  - "Look for a number that is not four, five or twenty."
                  - "20 ÷ 2 = 10."
              - id: l2-f3
                type: multiple_choice
                text: "3 × 10 = 30. Which division is in the family?"
                say: "Three times ten is thirty. Which division is in the same fact family?"
                options: ["30 ÷ 10 = 3", "3 ÷ 10 = 30", "10 ÷ 3 = 30"]
                answer: "30 ÷ 10 = 3"
                feedback:
                  "3 ÷ 10 = 30": "A division starts with the biggest number. Thirty divided by ten is three."
                hints:
                  - "Which number is the biggest?"
                  - "The division starts with thirty."
                  - "30 ÷ 10 = 3."
              - id: l2-f4
                type: text_input
                text: "6 × 5 = 30, so 30 ÷ 6 = _"
                say: "Six times five is thirty. So thirty divided by six is how many?"
                answer: "5"
                hints:
                  - "Use the same three numbers."
                  - "Six, five and thirty. Thirty divided by six is the other one."
                  - "5."
              - id: l2-f5
                type: true_false
                text: "Is it true? 8 × 2 = 16 and 16 ÷ 8 = 2 are in the same family."
                say: "Eight times two is sixteen, and sixteen divided by eight is two. Are they in the same fact family?"
                answer: true
                hints:
                  - "Do both facts use the same three numbers?"
                  - "Both use eight, two and sixteen."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Finish the fact family of 3, 5 and 15."
                say: "Finish the fact family of three, five and fifteen."
                frame: "3 × 5 = 15 · 5 × 3 = _ · 15 ÷ 3 = _ · 15 ÷ 5 = _"
                options: ["15", "5", "3", "12"]
                answer: ["15", "5", "3"]
                hints: ["Same three numbers every time."]
              - id: l2-s2
                type: text_input
                text: "7 × 10 = 70, so 70 ÷ 7 = _"
                say: "Seven times ten is seventy. So seventy divided by seven is how many?"
                answer: "10"
                hints: ["The family uses seven, ten and seventy."]
              - id: l2-s3
                type: multiple_choice
                text: "4 × 2 = 8. Which division is in the family?"
                say: "Four times two is eight. Which division is in the same fact family?"
                options: ["8 ÷ 4 = 2", "4 ÷ 8 = 2", "2 ÷ 4 = 8"]
                answer: "8 ÷ 4 = 2"
                hints: ["The division starts with the biggest number."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 5 × 9 = 45 and 45 ÷ 5 = 8 are in the same family."
                say: "Five times nine is forty-five, and forty-five divided by five is eight. Are they in the same fact family?"
                answer: false
                hints: ["Check the numbers: five, nine and forty-five."]
              - id: l2-s5
                type: multiple_choice
                text: "Which three numbers make a fact family?"
                say: "Which three numbers make a fact family?"
                options: ["2, 6 and 12", "2, 6 and 8", "2, 6 and 4"]
                answer: "2, 6 and 12"
                hints: ["Two of the numbers multiply to make the third."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "20 cakes are put into boxes of 5. How many boxes?"
                say: "Twenty cakes are put into boxes of five. How many boxes are needed?"
                answer: "4"
              - id: l2-n2
                type: text_input
                text: "18 socks make pairs of 2. How many pairs?"
                say: "Eighteen socks make pairs. Each pair is two socks. How many pairs?"
                answer: "9"
              - id: l2-n3
                type: multiple_choice
                text: "60p is shared between 10 children. How much does each get?"
                say: "Sixty pence is shared equally between ten children. How much does each child get?"
                options: ["6p", "50p", "10p"]
                answer: "6p"
              - id: l2-n4
                type: multiple_choice
                text: "4 teams of 5 children. Which fact is not in this family?"
                say: "There are four teams of five children, twenty in all. Which fact is not in this fact family?"
                options: ["20 ÷ 10 = 2", "20 ÷ 5 = 4", "5 × 4 = 20"]
                answer: "20 ÷ 10 = 2"
              - id: l2-n5
                type: text_input
                text: "35 children sit in rows of 5. How many rows?"
                say: "Thirty-five children sit in rows of five. How many rows are there?"
                answer: "7"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: divide
            type: text_input
            text: "50 ÷ 5 = _"
            say: "Fifty divided by five."
            answer: "10"
          - id: l2-c2
            part: check
            type: multiple_choice
            text: "Which multiplication checks 12 ÷ 2 = 6?"
            say: "Which multiplication checks that twelve divided by two is six?"
            options: ["6 × 2 = 12", "12 × 2 = 24", "6 × 6 = 36"]
            answer: "6 × 2 = 12"
          - id: l2-c3
            part: family
            type: fill_in_blank
            text: "Finish the fact family of 2, 10 and 20."
            say: "Finish the fact family of two, ten and twenty."
            frame: "2 × 10 = 20 · 10 × 2 = _ · 20 ÷ 2 = _ · 20 ÷ 10 = _"
            options: ["20", "10", "2", "18"]
            answer: ["20", "10", "2"]
          - id: l2-c4
            part: family
            type: multiple_choice
            text: "5 × 7 = 35. Which division is in the family?"
            say: "Five times seven is thirty-five. Which division is in the same fact family?"
            options: ["35 ÷ 7 = 5", "7 ÷ 35 = 5", "5 ÷ 7 = 35"]
            answer: "35 ÷ 7 = 5"
          - id: l2-c5
            part: divide
            type: true_false
            text: "Is it true? 80 ÷ 10 = 8"
            say: "Eighty divided by ten is eight. Is that true?"
            answer: true
          - id: l2-c6
            part: divide
            type: text_input
            text: "60 ÷ 10 = _"
            say: "Sixty divided by ten."
            answer: "6"
          - id: l2-c7
            part: divide
            type: multiple_choice
            text: "20 ÷ 2 = _"
            say: "Twenty divided by two."
            options: ["10", "18", "2"]
            answer: "10"
          - id: l2-c8
            part: divide
            type: fill_in_blank
            text: "Use the multiplication."
            say: "Thirty-five divided by five. What times five makes thirty-five?"
            frame: "_ × 5 = 35 · 35 ÷ 5 = _"
            options: ["7", "5", "30"]
            answer: ["7", "7"]
          - id: l2-c9
            part: divide
            type: text_input
            text: "There are 14 wheels. Each bike has 2 wheels. How many bikes are there?"
            say: "There are fourteen wheels. Each bike has two wheels. How many bikes are there?"
            answer: "7"
          - id: l2-c10
            part: divide
            type: multiple_choice
            text: "30 children sit in groups of 5. How many groups are there?"
            say: "Thirty children sit in groups of five. How many groups are there?"
            options: ["6", "25", "5"]
            answer: "6"
          - id: l2-c11
            part: check
            type: multiple_choice
            text: "Which multiplication checks 45 ÷ 5 = 9?"
            say: "Which multiplication checks that forty-five divided by five is nine?"
            options: ["9 × 5 = 45", "5 × 5 = 25", "9 × 9 = 81"]
            answer: "9 × 5 = 45"
          - id: l2-c12
            part: check
            type: true_false
            text: "Is it true? 16 ÷ 2 = 7, because 7 × 2 = 16."
            say: "Sixteen divided by two is seven, because seven times two is sixteen. Is that true?"
            answer: false
          - id: l2-c13
            part: check
            type: text_input
            text: "Raj says 30 ÷ 5 = 5. Check it with a multiplication: 5 × 5 = _"
            say: "Raj says thirty divided by five is five. Check it with a multiplication. What is five times five?"
            answer: "25"
          - id: l2-c14
            part: check
            type: true_false
            text: "Is it true? 9 × 10 = 90 checks that 90 ÷ 10 = 9."
            say: "Nine times ten is ninety. Does that check that ninety divided by ten is nine? Is it true?"
            answer: true
          - id: l2-c15
            part: check
            type: multiple_choice
            text: "Which division does 8 × 5 = 40 check?"
            say: "Eight times five is forty. Which division does it check?"
            options: ["40 ÷ 5 = 8", "40 ÷ 5 = 9", "45 ÷ 5 = 8"]
            answer: "40 ÷ 5 = 8"
          - id: l2-c16
            part: family
            type: fill_in_blank
            text: "Finish the fact family of 5, 10 and 50."
            say: "Finish the fact family of five, ten and fifty."
            frame: "5 × 10 = 50 · 10 × 5 = _ · 50 ÷ 5 = _ · 50 ÷ 10 = _"
            options: ["50", "10", "5", "45"]
            answer: ["50", "10", "5"]
          - id: l2-c17
            part: family
            type: multiple_choice
            text: "Which fact is not in the family of 2, 7 and 14?"
            say: "Which fact is not in the fact family of two, seven and fourteen?"
            options: ["14 − 7 = 7", "14 ÷ 7 = 2", "7 × 2 = 14"]
            answer: "14 − 7 = 7"
          - id: l2-c18
            part: family
            type: true_false
            text: "Is it true? 2 × 9 = 18 and 18 ÷ 3 = 6 are in the same family."
            say: "Two times nine is eighteen, and eighteen divided by three is six. Are they in the same fact family?"
            answer: false
          - id: l2-c19
            part: family
            type: text_input
            text: "6 × 2 = 12, so 12 ÷ 6 = _"
            say: "Six times two is twelve. So twelve divided by six is how many?"
            answer: "2"
          - id: l2-c20
            part: family
            type: matching
            text: "Match each multiplication to a division in its family."
            say: "Match each multiplication to a division in its fact family."
            pairs:
              - { left: { text: "3 × 5 = 15" }, right: { text: "15 ÷ 3 = 5" } }
              - { left: { text: "2 × 8 = 16" }, right: { text: "16 ÷ 2 = 8" } }
              - { left: { text: "10 × 7 = 70" }, right: { text: "70 ÷ 10 = 7" } }
