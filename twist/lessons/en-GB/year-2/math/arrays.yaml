# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.arrays
skill: math.mult-div.arrays
curriculum: en-GB
language: en
title:
  de: Malaufgaben im Punktefeld
  en: Arrays
summary: >
  The array as a picture of a multiplication: equal rows, read as the
  number of rows times the number in each row. Lesson 1 reads and finds
  arrays and writes them as repeated addition and as a multiplication;
  lesson 2 finds the multiplication for a picture or a short story (egg
  boxes, rows of chairs, packs of juice), and ends with the skill check.
  Building an array by dragging counters waits for drag_and_drop.
metadata:
  year: year-2
  topic: { de: Malaufgaben, en: Multiplication }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.mult-meaning]
  also_practises: [math.mult-div.mult-meaning]
  vocabulary: { en: [array, row, column, equal groups, times, multiply, repeated addition] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: count-all-dots
      what: Counts every dot one by one and adds the rows and the number in a row (3 rows of 4 is 7)
      addressed: lesson 1 Learn reads 3 rows of 4 as 4 + 4 + 4; l1-f1 (with feedback), l1-s1 and l1-c1 offer the sum of rows and dots in a row
    - id: unequal-rows
      what: Accepts rows of different lengths as an array
      addressed: lesson 1 Learn says every row must have the same number; l1-f5 (with feedback) and l1-n4 ask whether rows of different sizes make an array
    - id: wrong-story-fact
      what: Writes an addition for a story about equal groups (4 boxes of 6 eggs is 4 + 6)
      addressed: l2-f2 (with feedback), l2-s3 and l2-c3 offer the addition for an equal-groups story
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Reihen im Punktefeld, en: Rows in an array }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "3 groups of 5. Which is right?"
            say: "There are three groups of five. Which calculation is right?"
            options: ["5 + 5 + 5", "3 + 5", "3 + 3"]
            answer: "5 + 5 + 5"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "2 + 2 + 2 + 2 = _"
            say: "Two add two add two add two."
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "An array"
            say: "This is an array. The dots are in rows. Every row has the same number of dots."
            show: { drawn: dots, array: [3, 4] }
          - text: "4 + 4 + 4 = 12"
            say: "There are three rows of four. Four add four add four is twelve."
            show: { drawn: dots, array: [3, 4] }
          - text: "3 × 4 = 12"
            say: "Three rows of four is three times four. Three times four is twelve."
            show: { drawn: dots, array: [3, 4] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many dots?"
                say: "Two rows of five. How many dots are there?"
                show: { drawn: dots, array: [2, 5] }
                options: ["10", "7", "12"]
                answer: "10"
                feedback:
                  "7": "Seven is two add five. There are two rows of five: five add five."
                hints:
                  - "How many rows? How many in each row?"
                  - "Two rows of five: five add five."
                  - "10."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which multiplication matches?"
                say: "Which multiplication matches the array?"
                show: { drawn: dots, array: [4, 3] }
                options: ["4 × 3", "4 + 3", "4 × 4"]
                answer: "4 × 3"
                hints:
                  - "Count the rows first."
                  - "Four rows of three."
                  - "4 × 3."
              - id: l1-f3
                type: fill_in_blank
                text: "Write the array two ways."
                say: "Three rows of two. Fill the gaps."
                show: { drawn: dots, array: [3, 2] }
                frame: "2 + 2 + 2 = _ · 3 × 2 = _"
                options: ["6", "5", "8"]
                answer: ["6", "6"]
                hints:
                  - "Both ways give the same number."
                  - "Two add two add two."
                  - "6 and 6."
              - id: l1-f4
                type: image_multiple_choice
                text: "Which array shows 2 × 4?"
                say: "Which array shows two rows of four?"
                options:
                  - { drawn: dots, array: [2, 4] }
                  - { drawn: dots, array: [2, 3] }
                  - { drawn: dots, array: [3, 4] }
                answer: "2x4"
                hints:
                  - "Look for two rows."
                  - "Two rows, and four dots in each row."
                  - "The array with two rows of four."
              - id: l1-f5
                type: true_false
                text: "Is it an array? A row of 3, a row of 5, a row of 4."
                say: "Here is a row of three, a row of five and a row of four. Is it an array?"
                answer: false
                feedback:
                  "true": "In an array every row has the same number. These rows are different."
                hints:
                  - "Do all the rows have the same number?"
                  - "Three, five and four are different."
                  - "No."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many dots?"
                say: "Three rows of five. How many dots are there?"
                show: { drawn: dots, array: [3, 5] }
                options: ["15", "8", "10"]
                answer: "15"
                hints: ["Five add five add five."]
              - id: l1-s2
                type: multiple_choice
                text: "Which multiplication matches?"
                say: "Which multiplication matches the array?"
                show: { drawn: dots, array: [5, 2] }
                options: ["5 × 2", "5 + 2", "2 × 2"]
                answer: "5 × 2"
                hints: ["Rows first, then how many in each row."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which array shows 3 × 3?"
                say: "Which array shows three rows of three?"
                options:
                  - { drawn: dots, array: [3, 3] }
                  - { drawn: dots, array: [3, 2] }
                  - { drawn: dots, array: [2, 3] }
                answer: "3x3"
                hints: ["Three rows, three in each row."]
              - id: l1-s4
                type: fill_in_blank
                text: "Write the array two ways."
                say: "Two rows of six. Fill the gaps."
                show: { drawn: dots, array: [2, 6] }
                frame: "6 + 6 = _ · 2 × 6 = _"
                options: ["12", "8", "10"]
                answer: ["12", "12"]
                hints: ["Six add six."]
              - id: l1-s5
                type: true_false
                text: "Is it true? This array shows 4 × 5."
                say: "This array shows four times five. Is that true?"
                show: { drawn: dots, array: [4, 5] }
                answer: true
                hints: ["Count the rows, then the dots in one row."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "How many dots?"
                say: "Four rows of four. How many dots are there?"
                show: { drawn: dots, array: [4, 4] }
                answer: "16"
              - id: l1-n2
                type: multiple_choice
                text: "Which multiplication matches?"
                say: "Which multiplication matches the array?"
                show: { drawn: dots, array: [2, 7] }
                options: ["2 × 7", "2 + 7", "7 × 7"]
                answer: "2 × 7"
              - id: l1-n3
                type: image_multiple_choice
                text: "Which array shows 5 × 3?"
                say: "Which array shows five rows of three?"
                options:
                  - { drawn: dots, array: [5, 3] }
                  - { drawn: dots, array: [4, 3] }
                  - { drawn: dots, array: [5, 2] }
                answer: "5x3"
              - id: l1-n4
                type: true_false
                text: "Is it an array? A row of 4, a row of 4, a row of 2."
                say: "Here is a row of four, a row of four and a row of two. Is it an array?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "3 × 6 = _"
                say: "Three rows of six. How many dots?"
                show: { drawn: dots, array: [3, 6] }
                answer: "18"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many dots?"
            say: "Two rows of four. How many dots are there?"
            show: { drawn: dots, array: [2, 4] }
            options: ["8", "6", "10"]
            answer: "8"
          - id: l1-c2
            type: multiple_choice
            text: "Which multiplication matches?"
            say: "Which multiplication matches the array?"
            show: { drawn: dots, array: [3, 5] }
            options: ["3 × 5", "3 + 5", "5 × 5"]
            answer: "3 × 5"
          - id: l1-c3
            type: text_input
            text: "How many dots?"
            say: "Five rows of two. How many dots are there?"
            show: { drawn: dots, array: [5, 2] }
            answer: "10"

  - n: 2
    title: { de: Malaufgaben im Alltag, en: Arrays all around us }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which multiplication matches?"
            say: "Which multiplication matches the array?"
            show: { drawn: dots, array: [4, 2] }
            options: ["4 × 2", "4 + 2", "2 × 2"]
            answer: "4 × 2"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "How many dots?"
            say: "Three rows of three. How many dots are there?"
            show: { drawn: dots, array: [3, 3] }
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "An egg box: 2 rows of 3"
            say: "An egg box holds eggs in an array. Two rows of three. Two times three is six eggs."
            show: { drawn: dots, array: [2, 3] }
          - text: "Chairs in a hall: 4 rows of 5"
            say: "In the school hall there are four rows of chairs, with five chairs in each row. Four times five is twenty chairs."
            show: { drawn: dots, array: [4, 5] }
          - text: "3 packs of 4 juice cartons: 3 × 4 = 12"
            say: "Three packs with four cartons of juice in each pack. Equal groups make a multiplication: three times four is twelve."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "A window has 2 rows of 4 panes. Which multiplication?"
                say: "A window has two rows of four panes of glass. Which multiplication matches?"
                show: { drawn: dots, array: [2, 4] }
                options: ["2 × 4", "2 + 4", "4 × 4"]
                answer: "2 × 4"
                hints:
                  - "How many rows? How many in each row?"
                  - "Two rows, four in each row."
                  - "2 × 4."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "4 boxes, 6 eggs in each box. Which calculation finds all the eggs?"
                say: "There are four boxes with six eggs in each box. Which calculation finds all the eggs?"
                options: ["4 × 6", "4 + 6", "6 − 4"]
                answer: "4 × 6"
                feedback:
                  "4 + 6": "Four add six counts the boxes and the eggs in one box. There are four equal groups of six: four times six."
                hints:
                  - "Are there equal groups?"
                  - "Four groups of six eggs."
                  - "4 × 6."
              - id: l2-f3
                type: text_input
                text: "The hall has 3 rows of chairs, 5 in each row. How many chairs?"
                say: "The hall has three rows of chairs, with five in each row. How many chairs are there?"
                show: { drawn: dots, array: [3, 5] }
                answer: "15"
                hints:
                  - "Three rows of five."
                  - "Five, ten, ..."
                  - "15."
              - id: l2-f4
                type: multiple_choice
                text: "Which story matches 5 × 2?"
                say: "Which story matches five times two?"
                options: ["5 bikes with 2 wheels each", "5 bikes and 2 cars", "2 bikes with 5 wheels each"]
                answer: "5 bikes with 2 wheels each"
                hints:
                  - "Five groups of two."
                  - "Five things, and two in each."
                  - "5 bikes with 2 wheels each."
              - id: l2-f5
                type: true_false
                text: "Is it true? 3 packs of 4 yoghurts is 3 × 4 = 12."
                say: "Three packs of four yoghurts is three times four, twelve yoghurts. Is that true?"
                answer: true
                hints:
                  - "Three equal groups of four."
                  - "Four, eight, twelve."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "A tray has 4 rows of 3 cakes. How many cakes?"
                say: "A tray has four rows of three cakes. How many cakes are there?"
                show: { drawn: dots, array: [4, 3] }
                answer: "12"
                hints: ["Four rows of three: three, six, ..."]
              - id: l2-s2
                type: multiple_choice
                text: "A chocolate bar has 2 rows of 5 squares. Which multiplication?"
                say: "A chocolate bar has two rows of five squares. Which multiplication matches?"
                options: ["2 × 5", "2 + 5", "5 × 5"]
                answer: "2 × 5"
                hints: ["Rows first, then how many in each row."]
              - id: l2-s3
                type: multiple_choice
                text: "5 packs of 3 juice cartons. Which calculation?"
                say: "There are five packs with three juice cartons in each. Which calculation finds all the cartons?"
                options: ["5 × 3", "5 + 3", "3 × 3"]
                answer: "5 × 3"
                hints: ["Five equal groups of three."]
              - id: l2-s4
                type: image_multiple_choice
                text: "A garden has 3 rows of 4 flowers. Which array?"
                say: "A garden has three rows of four flowers. Which array matches?"
                options:
                  - { drawn: dots, array: [3, 4] }
                  - { drawn: dots, array: [4, 4] }
                  - { drawn: dots, array: [3, 3] }
                answer: "3x4"
                hints: ["Three rows, four in each row."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 2 rows of 6 stamps is 2 + 6 = 8 stamps."
                say: "Two rows of six stamps is two add six, eight stamps. Is that true?"
                answer: false
                hints: ["Two rows of six is six add six."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "A bus has 5 rows of 4 seats. How many seats?"
                say: "A bus has five rows of four seats. How many seats are there?"
                answer: "20"
              - id: l2-n2
                type: multiple_choice
                text: "6 boxes, 2 shoes in each box. Which calculation?"
                say: "There are six boxes with two shoes in each. Which calculation finds all the shoes?"
                options: ["6 × 2", "6 + 2", "2 × 2"]
                answer: "6 × 2"
              - id: l2-n3
                type: text_input
                text: "A muffin tray has 3 rows of 4. How many muffins?"
                say: "A muffin tray has three rows of four muffins. How many muffins?"
                answer: "12"
              - id: l2-n4
                type: multiple_choice
                text: "Which story matches 3 × 10?"
                say: "Which story matches three times ten?"
                options: ["3 boxes of 10 pencils", "3 pencils and 10 pens", "10 boxes of 3 pencils"]
                answer: "3 boxes of 10 pencils"
              - id: l2-n5
                type: text_input
                text: "There are 4 rows of 5 children. How many children?"
                say: "There are four rows of children, with five children in each row. How many children?"
                answer: "20"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Which array shows 4 × 2?"
            say: "Which array shows four rows of two?"
            options:
              - { drawn: dots, array: [4, 2] }
              - { drawn: dots, array: [2, 2] }
              - { drawn: dots, array: [4, 3] }
            answer: "4x2"
          - id: l2-c2
            type: text_input
            text: "How many dots?"
            say: "Two rows of nine. How many dots are there?"
            show: { drawn: dots, array: [2, 9] }
            answer: "18"
          - id: l2-c3
            type: multiple_choice
            text: "3 plates, 5 grapes on each plate. Which calculation?"
            say: "There are three plates with five grapes on each. Which calculation finds all the grapes?"
            options: ["3 × 5", "3 + 5", "5 − 3"]
            answer: "3 × 5"
          - id: l2-c4
            type: multiple_choice
            text: "Which multiplication matches?"
            say: "Which multiplication matches the array?"
            show: { drawn: dots, array: [5, 4] }
            options: ["5 × 4", "5 + 4", "4 × 4"]
            answer: "5 × 4"
          - id: l2-c5
            type: true_false
            text: "Is it an array? Rows of 3, 3, 3 and 3."
            say: "Here are four rows, with three in every row. Is it an array?"
            answer: true
