# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.commutative
skill: math.add-sub-to-20.commutative
curriculum: en-GB
language: en
title:
  de: Tauschaufgaben
  en: Adding in any order
summary: >
  Addition can be done in any order: 4 + 9 and 9 + 4 are both 13, but
  subtraction cannot. Lesson 1 sees this with counters and writes the
  turnaround of an addition within 20; lesson 2 uses it to add more easily
  (start with the bigger number), also with tens, shows that 9 − 4 is not
  4 − 9, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-to-10]
  also_practises: []
  vocabulary: { en: [any order, turnaround, add, subtract, equals, the same] }
  forms: [drawn, text, audio]
  drawn: [ten-frame, zwanzigerfeld]
  facets: []
  parts:
    - { id: find, what: { de: die Tauschaufgabe finden, en: finding the turnaround of an addition } }
    - { id: same, what: { de: "wissen, dass die Tauschaufgabe dasselbe Ergebnis hat", en: knowing that a turnaround has the same total } }
    - { id: easier, what: { de: mit Tauschaufgaben leichter rechnen, en: using a turnaround to add more easily } }
  misconceptions:
    - id: swap-changes-result
      what: Works out both additions from scratch, not seeing they are equal
      addressed: Learn shows 2 + 6 and 6 + 2 as two frames of eight counters; tasks give one total and ask for the turnaround's
    - id: swap-minus
      what: Swaps the numbers in a subtraction too (9 − 4 = 4 − 9)
      addressed: lesson 2 Learn shows that subtraction cannot be done in any order; a true/false task in each stage, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Gleich viel, en: The same total }
    goal:
      de: "Tausch die Zahlen in einer Plusaufgabe und sieh, dass das Ergebnis gleich bleibt, so wie bei 2 + 6 und 6 + 2."
      en: "Swap the numbers in an addition and see that the total stays the same, like 2 + 6 and 6 + 2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "5 + 3 = _"
            say: "Five add three."
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "3 + 5 = _"
            say: "Three add five."
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "2 + 6"
            say: "Here are two red counters and six blue counters. Two add six."
            show: { drawn: ten-frame, filled: 8, colour_split: [2, 6] }
          - text: "6 + 2"
            say: "Now add them the other way round: six first, then two. Six add two. There are still eight counters."
            show: { drawn: ten-frame, filled: 8, colour_split: [6, 2] }
          - text: "2 + 6 = 6 + 2 = 8"
            say: "Both have the same total: eight. We can add two numbers in any order. Six add two is the turnaround of two add six."
          - text: "4 + 9 = 9 + 4 = 13"
            say: "It works with bigger numbers too. Four add nine is thirteen, and nine add four is thirteen."
            show: { drawn: zwanzigerfeld, filled: [9, 4] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is the turnaround of 3 + 4?"
                say: "Which addition is the turnaround of three add four?"
                options: ["4 + 3", "3 + 3", "4 − 3"]
                answer: "4 + 3"
                feedback:
                  "4 − 3": "The turnaround is still an addition. Only the order of the numbers changes."
                hints:
                  - "A turnaround swaps the two numbers."
                  - "Four goes first."
                  - "4 + 3."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Write the turnaround."
                say: "One add five. Write the turnaround."
                frame: "1 + 5 = _ + _"
                options: ["1", "5", "6"]
                answer: ["5", "1"]
                hints:
                  - "Swap the two numbers."
                  - "Five goes first."
                  - "5 + 1."
              - id: l1-f3
                type: true_false
                text: "Is it true? 2 + 7 = 7 + 2"
                answer: true
                hints:
                  - "They are the same numbers."
                  - "Both make nine."
                  - "Yes."
              - id: l1-f4
                type: matching
                text: "Match each addition to its turnaround."
                say: "Match each addition to its turnaround."
                pairs:
                  - { left: { text: "1 + 8" }, right: { text: "8 + 1" } }
                  - { left: { text: "3 + 12" }, right: { text: "12 + 3" } }
                  - { left: { text: "2 + 5" }, right: { text: "5 + 2" } }
                hints:
                  - "Which addition has the same two numbers?"
                  - "1 + 8 goes with 8 + 1."
                  - "1 + 8 with 8 + 1, 3 + 12 with 12 + 3, 2 + 5 with 5 + 2."
              - id: l1-f5
                type: multiple_choice
                text: "5 + 8 = 13. What is 8 + 5?"
                say: "Five add eight is thirteen. What is eight add five?"
                options: ["12", "13", "14"]
                answer: "13"
                hints:
                  - "It is the turnaround."
                  - "A turnaround has the same total."
                  - "13."
              - id: l1-f6
                type: fill_in_blank
                text: "Write the turnaround."
                say: "Red and blue counters: seven add four. Write the turnaround."
                show: { drawn: zwanzigerfeld, filled: [7, 4] }
                frame: "7 + 4 = _ + _"
                options: ["4", "7", "11"]
                answer: ["4", "7"]
                hints:
                  - "Swap seven and four."
                  - "Four goes first."
                  - "4 + 7."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is the turnaround of 6 + 1?"
                say: "Which addition is the turnaround of six add one?"
                options: ["1 + 6", "6 + 6", "6 − 1"]
                answer: "1 + 6"
                hints: ["The numbers swap places."]
              - id: l1-s2
                type: fill_in_blank
                text: "Write the turnaround."
                say: "Two add eleven. Write the turnaround."
                frame: "2 + 11 = _ + _"
                options: ["2", "11", "13"]
                answer: ["11", "2"]
                hints: ["Swap the two numbers."]
              - id: l1-s3
                type: true_false
                text: "Is it true? 4 + 5 = 5 + 3"
                answer: false
                hints: ["Are they the same two numbers?"]
              - id: l1-s4
                type: multiple_choice
                text: "6 + 9 = 15. What is 9 + 6?"
                say: "Six add nine is fifteen. What is nine add six?"
                options: ["14", "15", "3"]
                answer: "15"
                hints: ["What does a turnaround do to the total?"]
              - id: l1-s5
                type: matching
                text: "Match each addition to its turnaround."
                say: "Match each addition to its turnaround."
                pairs:
                  - { left: { text: "4 + 1" }, right: { text: "1 + 4" } }
                  - { left: { text: "2 + 17" }, right: { text: "17 + 2" } }
                  - { left: { text: "3 + 4" }, right: { text: "4 + 3" } }
                hints: ["Look for the same two numbers."]
              - id: l1-s6
                type: true_false
                text: "Is it true? 1 + 9 = 9 + 1"
                answer: true
                hints: ["Are they the same two numbers?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is the turnaround of 5 + 4?"
                say: "Which addition is the turnaround of five add four?"
                options: ["4 + 5", "5 + 5", "5 − 4"]
                answer: "4 + 5"
              - id: l1-n2
                type: fill_in_blank
                text: "Write the turnaround."
                say: "Three add fourteen. Write the turnaround."
                frame: "3 + 14 = _ + _"
                options: ["3", "14", "17"]
                answer: ["14", "3"]
              - id: l1-n3
                type: true_false
                text: "Is it true? 6 + 3 = 3 + 6"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "7 + 8 = 15. What is 8 + 7?"
                say: "Seven add eight is fifteen. What is eight add seven?"
                options: ["16", "15", "1"]
                answer: "15"
              - id: l1-n5
                type: matching
                text: "Match each addition to its turnaround."
                say: "Match each addition to its turnaround."
                pairs:
                  - { left: { text: "5 + 3" }, right: { text: "3 + 5" } }
                  - { left: { text: "8 + 12" }, right: { text: "12 + 8" } }
                  - { left: { text: "6 + 1" }, right: { text: "1 + 6" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is the turnaround of 3 + 9?"
            say: "Which addition is the turnaround of three add nine?"
            options: ["9 + 3", "3 + 3", "9 − 3"]
            answer: "9 + 3"
          - id: l1-c2
            type: true_false
            text: "Is it true? 5 + 11 = 11 + 5"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "4 + 7 = 11. What is 7 + 4?"
            say: "Four add seven is eleven. What is seven add four?"
            options: ["10", "11", "3"]
            answer: "11"
          - id: l1-c4
            type: fill_in_blank
            text: "Write the turnaround."
            say: "Seven add two. Write the turnaround."
            frame: "7 + 2 = _ + _"
            options: ["2", "7", "9"]
            answer: ["2", "7"]
          - id: l1-c5
            type: matching
            text: "Match each addition to its turnaround."
            say: "Match each addition to its turnaround."
            pairs:
              - { left: { text: "1 + 3" }, right: { text: "3 + 1" } }
              - { left: { text: "5 + 12" }, right: { text: "12 + 5" } }
              - { left: { text: "9 + 6" }, right: { text: "6 + 9" } }
          - id: l1-c6
            type: true_false
            text: "Is it true? 8 + 2 = 2 + 9"
            say: "Eight add two equals two add nine. Is it true?"
            answer: false

  - n: 2
    title: { de: Tauschen macht es leichter, en: Swapping makes it easier }
    goal:
      de: "Fang mit der größeren Zahl an, dann geht das Plusrechnen leichter, so wie 9 + 2 statt 2 + 9."
      en: "Start with the bigger number to make adding easier, like 9 + 2 instead of 2 + 9."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is the turnaround of 1 + 6?"
            say: "Which addition is the turnaround of one add six?"
            options: ["6 + 1", "1 + 1", "6 − 1"]
            answer: "6 + 1"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? 2 + 5 = 5 + 2"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2 + 9"
            say: "Two add nine. Counting on nine from two takes a long time. Swap the numbers: nine add two."
          - text: "9 … 10, 11"
            say: "Now start at nine and count on just two: ten, eleven. Start with the bigger number."
          - text: "20 + 50 = 50 + 20 = 70"
            say: "It works with tens too. Twenty add fifty is seventy, and so is fifty add twenty."
          - text: "9 − 4 ≠ 4 − 9"
            say: "But be careful: subtraction cannot be done in any order. Nine subtract four is five. Four subtract nine is not five."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which number do you start with? 1 + 8"
                say: "One add eight. Which number is best to start with?"
                options: ["8", "1"]
                answer: "8"
                option_audio: false
                hints:
                  - "Start with the bigger number."
                  - "Eight is bigger."
                  - "Start at 8 and count on one."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "3 + 15 = _"
                say: "Three add fifteen. Swap the numbers if it helps."
                answer: "18"
                hints:
                  - "Start at 15."
                  - "Count on three: sixteen, seventeen, eighteen."
                  - "18."
              - id: l2-f3
                type: true_false
                text: "Is it true? 6 − 2 = 2 − 6"
                answer: false
                feedback:
                  "true": "Subtraction cannot be done in any order. Six subtract two is four; two subtract six is not four."
                hints:
                  - "Can you swap the numbers in a subtraction?"
                  - "No, only in an addition."
                  - "No."
              - id: l2-f4
                type: text_input
                text: "30 + 60 = _"
                say: "Thirty add sixty. Swap the numbers if it helps."
                answer: "90"
                hints:
                  - "Start at 60."
                  - "Count on three tens: seventy, eighty, ninety."
                  - "90."
              - id: l2-f5
                type: multiple_choice
                text: "Which is easier to work out?"
                say: "Which of these is easier to work out?"
                options: ["7 + 1", "1 + 7"]
                answer: "7 + 1"
                option_audio: false
                hints:
                  - "In which one do you start with the bigger number?"
                  - "In 7 + 1 you count on just one."
                  - "7 + 1."
              - id: l2-f6
                type: true_false
                text: "Is it true? 40 + 30 = 30 + 40"
                answer: true
                hints:
                  - "It is an addition."
                  - "Addition can be done in any order."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which number do you start with? 2 + 17"
                say: "Two add seventeen. Which number is best to start with?"
                options: ["2", "17"]
                answer: "17"
                option_audio: false
                hints: ["Which number is bigger?"]
              - id: l2-s2
                type: text_input
                text: "4 + 13 = _"
                say: "Four add thirteen."
                answer: "17"
                hints: ["Start with the bigger number."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 8 − 3 = 3 − 8"
                answer: false
                hints: ["Can a subtraction be done in any order?"]
              - id: l2-s4
                type: text_input
                text: "10 + 70 = _"
                say: "Ten add seventy."
                answer: "80"
                hints: ["Start at 70."]
              - id: l2-s5
                type: multiple_choice
                text: "Which is easier to work out?"
                say: "Which of these is easier to work out?"
                options: ["3 + 16", "16 + 3"]
                answer: "16 + 3"
                option_audio: false
                hints: ["Which starts with the bigger number?"]
              - id: l2-s6
                type: true_false
                text: "Is it true? 5 + 14 = 14 + 5"
                answer: true
                hints: ["Is it an addition or a subtraction?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which number do you start with? 3 + 12"
                say: "Three add twelve. Which number is best to start with?"
                options: ["3", "12"]
                answer: "12"
                option_audio: false
              - id: l2-n2
                type: text_input
                text: "2 + 16 = _"
                say: "Two add sixteen."
                answer: "18"
              - id: l2-n3
                type: true_false
                text: "Is it true? 9 − 5 = 5 − 9"
                answer: false
              - id: l2-n4
                type: text_input
                text: "20 + 70 = _"
                say: "Twenty add seventy."
                answer: "90"
              - id: l2-n5
                type: multiple_choice
                text: "Which is easier to work out?"
                say: "Which of these is easier to work out?"
                options: ["18 + 2", "2 + 18"]
                answer: "18 + 2"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: find
            type: fill_in_blank
            text: "Write the turnaround."
            say: "Six add thirteen. Write the turnaround."
            frame: "6 + 13 = _ + _"
            options: ["6", "13", "19"]
            answer: ["13", "6"]
          - id: l2-c2
            part: same
            type: multiple_choice
            text: "8 + 9 = 17. What is 9 + 8?"
            say: "Eight add nine is seventeen. What is nine add eight?"
            options: ["16", "17", "1"]
            answer: "17"
          - id: l2-c3
            part: same
            type: true_false
            text: "Is it true? 7 − 1 = 1 − 7"
            answer: false
          - id: l2-c4
            part: easier
            type: text_input
            text: "4 + 14 = _"
            say: "Four add fourteen."
            answer: "18"
          - id: l2-c5
            part: easier
            type: multiple_choice
            text: "Which number do you start with? 1 + 15"
            say: "One add fifteen. Which number is best to start with?"
            options: ["15", "1"]
            answer: "15"
            option_audio: false
          - id: l2-c6
            part: find
            type: multiple_choice
            text: "Which is the turnaround of 2 + 14?"
            say: "Which addition is the turnaround of two add fourteen?"
            options: ["14 + 2", "2 + 2", "14 − 2"]
            answer: "14 + 2"
          - id: l2-c7
            part: find
            type: matching
            text: "Find the turnaround of each addition."
            say: "Find the turnaround of each addition and match them."
            pairs:
              - { left: { text: "6 + 12" }, right: { text: "12 + 6" } }
              - { left: { text: "9 + 1" }, right: { text: "1 + 9" } }
              - { left: { text: "4 + 7" }, right: { text: "7 + 4" } }
          - id: l2-c8
            part: find
            type: true_false
            text: "Is it true? 10 + 5 is the turnaround of 5 + 10."
            say: "Ten add five is the turnaround of five add ten. Is it true?"
            answer: true
          - id: l2-c9
            part: find
            type: fill_in_blank
            text: "Write the turnaround."
            say: "Fifteen add four. Write the turnaround."
            frame: "15 + 4 = _ + _"
            options: ["4", "15", "19"]
            answer: ["4", "15"]
          - id: l2-c10
            part: find
            type: multiple_choice
            text: "Which pair are turnarounds?"
            say: "Which pair are turnarounds of each other?"
            options: ["7 + 2 and 2 + 7", "7 + 2 and 7 − 2", "7 + 2 and 2 + 2"]
            answer: "7 + 2 and 2 + 7"
          - id: l2-c11
            part: find
            type: fill_in_blank
            text: "Write the turnaround."
            say: "Red and blue counters: eight add six. Write the turnaround."
            show: { drawn: zwanzigerfeld, filled: [8, 6] }
            frame: "8 + 6 = _ + _"
            options: ["6", "8", "14"]
            answer: ["6", "8"]
          - id: l2-c12
            part: same
            type: text_input
            text: "9 + 7 = 16. What is 7 + 9?"
            say: "Nine add seven is sixteen. What is seven add nine?"
            answer: "16"
          - id: l2-c13
            part: same
            type: true_false
            text: "Is it true? 6 + 7 = 7 + 5"
            say: "Six add seven equals seven add five. Is it true?"
            answer: false
          - id: l2-c14
            part: same
            type: multiple_choice
            text: "Which one can you do in any order?"
            say: "Which one can you do in any order?"
            options: ["8 + 2", "8 − 2"]
            answer: "8 + 2"
          - id: l2-c15
            part: same
            type: fill_in_blank
            text: "Work out both additions."
            say: "Six add seven, and seven add six. Work out both."
            show: { drawn: zwanzigerfeld, filled: [6, 7] }
            frame: "6 + 7 = _ · 7 + 6 = _"
            options: ["12", "13", "1"]
            answer: ["13", "13"]
          - id: l2-c16
            part: same
            type: multiple_choice
            text: "40 + 50 = 90. What is 50 + 40?"
            say: "Forty add fifty is ninety. What is fifty add forty?"
            options: ["90", "80", "10"]
            answer: "90"
          - id: l2-c17
            part: easier
            type: text_input
            text: "2 + 15 = _"
            say: "Two add fifteen."
            answer: "17"
          - id: l2-c18
            part: easier
            type: multiple_choice
            text: "Which is easier to work out?"
            say: "Which of these is easier to work out?"
            options: ["1 + 19", "19 + 1"]
            answer: "19 + 1"
            option_audio: false
          - id: l2-c19
            part: easier
            type: text_input
            text: "10 + 80 = _"
            say: "Ten add eighty."
            answer: "90"
          - id: l2-c20
            part: easier
            type: multiple_choice
            text: "Ben works out 3 + 14. Which is the quickest way?"
            say: "Ben works out three add fourteen. Which is the quickest way?"
            options: ["start at 14 and count on 3", "start at 3 and count on 14"]
            answer: "start at 14 and count on 3"
