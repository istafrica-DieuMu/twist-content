# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.fractions-of-quantities
skill: math.fractions.of-quantities
curriculum: en-GB
language: en
title:
  de: Bruchteile von Mengen und Größen
  en: Fractions of amounts
summary: >
  Finding 1/2, 1/3, 1/4, 2/4 and 3/4 of a set, a shape, a length and a
  quantity, with numbers Year 2 can share. Lesson 1 finds one half, one
  third and one quarter of a set by sharing into equal rows. Lesson 2
  finds two quarters, three quarters and two thirds (find one part, then
  take as many as the top number) and fractions of a shape counted in
  squares. Lesson 3 takes fractions of lengths in cm, money in p and
  other measures, in context, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Brüche, en: Fractions }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.fractions.halves-quarters, math.mult-div.div-meaning]
  also_practises: [math.fractions.name-fractions]
  vocabulary: { en: [fraction, share, equal groups, one half, one third, one quarter, two quarters, three quarters, two thirds, of] }
  forms: [drawn, text, audio]
  drawn: [dots, fraction, ruler, coins]
  facets: [currency]
  misconceptions:
    - id: groups-not-size
      what: Gives the number of groups instead of the size of one group (1/4 of 12 = 4)
      addressed: lesson 1 Learn counts the dots in one row; l1-f1, l1-f3 (with feedback), l1-s1, l1-s2, l1-n5, l1-c2, l3-f2 (with feedback), l3-s2 and l3-c4 offer the number of groups
    - id: unit-only
      what: Finds one part and stops, so gives 1/4 of a number for 3/4 of it
      addressed: lesson 2 Learn screens 1 and 2; l2-f1 (with feedback), l2-f2 (both steps as gaps), l2-f5 (with feedback), l2-s1, l2-n3, l3-n4 and l3-c2
    - id: multiplies
      what: Doubles instead of halving (1/2 of 8 cm = 16 cm)
      addressed: lesson 1 Learn screen 3 links a half to dividing by two; l3-f1 (with feedback), l3-s1, l3-n2 and l3-c3
    - id: counts-the-rest
      what: Counts the dots that are not in the red row (1/3 of 9 = 6)
      addressed: l1-f2 (with feedback) and l1-f5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ein Teil einer Menge", en: "One part of a set" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "12 counters are shared equally into 3 groups. How many are in each group?"
            say: "Twelve counters are shared equally into three groups. How many are in each group?"
            options: ["4", "3", "9"]
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which part is red?"
            say: "This circle is cut into four equal parts. How much of it is red?"
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
            options: ["one quarter", "one half", "one third"]
            answer: "one quarter"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1/3 of 12 = 4\nShare 12 into 3 equal rows."
            say: "To find one third of twelve, share twelve into three equal groups. Here each row is one group. Count the dots in one row: four. So one third of twelve is four."
            show: { drawn: dots, array: [3, 4], split_rows: 1 }
          - text: "1/4 of 8 = 2\nShare 8 into 4 equal rows."
            say: "To find one quarter of eight, share eight into four equal groups. Each row has two dots. So one quarter of eight is two."
            show: { drawn: dots, array: [4, 2], split_rows: 1 }
          - text: "1/2 of 10 = 5\n10 ÷ 2 = 5"
            say: "To find one half, share into two equal groups. Half of ten is five. Finding a half is the same as dividing by two, and the answer is always smaller than the number you started with."
            show: { drawn: dots, array: [2, 5], split_rows: 1 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1/2 of 12 = _"
                say: "What is one half of twelve?"
                show: { drawn: dots, array: [2, 6], split_rows: 1 }
                options: ["6", "2", "10"]
                answer: "6"
                feedback:
                  "2": "2 is how many groups there are. Count the dots in one group."
                hints:
                  - "One half: share 12 into 2 equal rows."
                  - "Count the dots in the red row."
                  - "6."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "1/3 of 9 = _"
                say: "What is one third of nine?"
                show: { drawn: dots, array: [3, 3], split_rows: 1 }
                options: ["3", "6", "1"]
                answer: "3"
                feedback:
                  "6": "6 dots are blue. One third is just the red row."
                hints:
                  - "One third: 9 is shared into 3 equal rows."
                  - "How many dots are in the red row?"
                  - "3."
              - id: l1-f3
                type: multiple_choice
                text: "1/4 of 12 = _"
                say: "What is one quarter of twelve?"
                show: { drawn: dots, array: [4, 3], split_rows: 1 }
                options: ["3", "4", "9"]
                answer: "3"
                feedback:
                  "4": "4 is the number of equal groups. Each group has 3 dots."
                hints:
                  - "One quarter: 12 is shared into 4 equal rows."
                  - "Count the dots in the red row."
                  - "3."
              - id: l1-f4
                type: text_input
                text: "1/2 of 8 = _"
                say: "What is one half of eight?"
                show: { drawn: dots, array: [2, 4], split_rows: 1 }
                answer: "4"
                hints:
                  - "Share 8 into 2 equal groups."
                  - "4 and 4 make 8."
                  - "4."
              - id: l1-f5
                type: true_false
                text: "Is it true? 1/3 of 6 = 3"
                say: "One third of six is three. Is that true?"
                show: { drawn: dots, array: [3, 2], split_rows: 1 }
                answer: false
                feedback:
                  "true": "3 is half of 6. A third shares 6 into 3 groups, so each group has 2."
                hints:
                  - "One third means 3 equal groups."
                  - "6 shared into 3 rows: 2 in each row."
                  - "No. 1/3 of 6 is 2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "1/4 of 16 = _"
                say: "What is one quarter of sixteen?"
                show: { drawn: dots, array: [4, 4], split_rows: 1 }
                options: ["4", "12", "2"]
                answer: "4"
                hints: ["Count the dots in one row, not the rows."]
              - id: l1-s2
                type: multiple_choice
                text: "1/3 of 12 = _"
                say: "What is one third of twelve?"
                options: ["4", "3", "6"]
                answer: "4"
                hints: ["Share 12 into 3 equal groups. How many in each?"]
              - id: l1-s3
                type: text_input
                text: "1/2 of 14 = _"
                say: "What is one half of fourteen?"
                answer: "7"
                hints: ["Which number doubled makes 14?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? 1/4 of 20 = 5"
                say: "One quarter of twenty is five. Is that true?"
                answer: true
                hints: ["Share 20 into 4 equal groups. Do 4 fives make 20?"]
              - id: l1-s5
                type: multiple_choice
                text: "1/2 of 18 = _"
                say: "What is one half of eighteen?"
                options: ["9", "2", "16"]
                answer: "9"
                hints: ["Half of 18: which number and the same number again make 18?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "1/2 of 20 = _"
                say: "What is one half of twenty?"
                answer: "10"
              - id: l1-n2
                type: text_input
                text: "1/3 of 6 = _"
                say: "What is one third of six?"
                answer: "2"
              - id: l1-n3
                type: multiple_choice
                text: "1/3 of 15 = _"
                say: "What is one third of fifteen?"
                show: { drawn: dots, array: [3, 5], split_rows: 1 }
                options: ["5", "3", "10"]
                answer: "5"
              - id: l1-n4
                type: true_false
                text: "Is it true? 1/2 of 16 = 8"
                say: "One half of sixteen is eight. Is that true?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "1/4 of 12 = _"
                say: "What is one quarter of twelve?"
                options: ["3", "4", "8"]
                answer: "3"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "1/2 of 6 = _"
            say: "What is one half of six?"
            answer: "3"
          - id: l1-c2
            type: multiple_choice
            text: "1/4 of 16 = _"
            say: "What is one quarter of sixteen?"
            options: ["4", "12", "8"]
            answer: "4"
          - id: l1-c3
            type: true_false
            text: "Is it true? 1/3 of 12 = 3"
            say: "One third of twelve is three. Is that true?"
            answer: false

  - n: 2
    title: { de: "Mehrere Teile", en: "More than one part" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "1/3 of 9 = _"
            say: "What is one third of nine?"
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "1/2 of 14 = _"
            say: "What is one half of fourteen?"
            options: ["7", "2", "12"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3/4 of 12 = 9\n1/4 of 12 = 3, so 3/4 of 12 = 3 + 3 + 3"
            say: "To find three quarters of twelve, first find one quarter. Twelve shared into four rows is three in each row. Three quarters is three of those rows: three, six, nine. So three quarters of twelve is nine."
            show: { drawn: dots, array: [4, 3], split_rows: 3 }
          - text: "2/3 of 9 = 6\n1/3 of 9 = 3, so 2/3 of 9 = 3 + 3"
            say: "Two thirds of nine: one third of nine is three. Two thirds is two of those groups, three and three, six."
            show: { drawn: dots, array: [3, 3], split_rows: 2 }
          - text: "A bar of 8 squares.\n1/4 of the bar = 2 squares"
            say: "A fraction of a shape works the same way. This bar has eight squares. One quarter of the bar is eight shared into four, so two squares."
            show: { drawn: fraction, kind: rect, parts: 8, rows: 2, shaded: 2 }
          - text: "2/4 of 8 = 4\n2/4 is the same as 1/2."
            say: "Two quarters of eight is two and two, four. That is the same as one half of eight."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "3/4 of 8 = _"
                say: "What is three quarters of eight?"
                show: { drawn: dots, array: [4, 2], split_rows: 3 }
                options: ["6", "2", "3"]
                answer: "6"
                feedback:
                  "2": "2 is one quarter. Three quarters is three rows: 2 + 2 + 2."
                hints:
                  - "First find one quarter: one row."
                  - "One row has 2 dots. Three rows are red."
                  - "6."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Find 3/4 of 12 in two steps."
                say: "Find three quarters of twelve. First one quarter, then three quarters."
                frame: "1/4 of 12 = _   3/4 of 12 = _"
                options: ["3", "4", "6", "9"]
                answer: ["3", "9"]
                hints:
                  - "One quarter: share 12 into 4 equal groups."
                  - "One quarter is 3. Three quarters is 3 + 3 + 3."
                  - "3 and 9."
              - id: l2-f3
                type: multiple_choice
                text: "This bar has 6 squares. How many squares are 1/3 of the bar?"
                say: "This bar has six squares. How many squares are one third of the bar?"
                show: { drawn: fraction, kind: rect, parts: 6, rows: 2, shaded: 0 }
                options: ["2", "3", "4"]
                answer: "2"
                feedback:
                  "3": "3 is the number of equal groups. Share 6 squares into 3 groups: 2 in each."
                hints:
                  - "Share the 6 squares into 3 equal groups."
                  - "2 and 2 and 2 make 6."
                  - "2 squares."
              - id: l2-f4
                type: text_input
                text: "2/3 of 6 = _"
                say: "What is two thirds of six?"
                show: { drawn: dots, array: [3, 2], split_rows: 2 }
                answer: "4"
                hints:
                  - "First find one third of 6: one row."
                  - "One third is 2. Two thirds is 2 + 2."
                  - "4."
              - id: l2-f5
                type: true_false
                text: "Is it true? 3/4 of 4 = 1"
                say: "Three quarters of four is one. Is that true?"
                answer: false
                feedback:
                  "true": "1 is one quarter of 4. Three quarters is 1 + 1 + 1."
                hints:
                  - "One quarter of 4 is 1."
                  - "Three quarters means three of those quarters."
                  - "No. 3/4 of 4 is 3."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "3/4 of 16 = _"
                say: "What is three quarters of sixteen?"
                show: { drawn: dots, array: [4, 4], split_rows: 3 }
                options: ["12", "4", "3"]
                answer: "12"
                hints: ["One row is one quarter. Count three rows."]
              - id: l2-s2
                type: multiple_choice
                text: "2/4 of 12 = _"
                say: "What is two quarters of twelve?"
                options: ["6", "3", "2"]
                answer: "6"
                hints: ["One quarter of 12 is 3. Take two of them."]
              - id: l2-s3
                type: text_input
                text: "2/3 of 12 = _"
                say: "What is two thirds of twelve?"
                answer: "8"
                hints: ["One third of 12 is 4. Two thirds is 4 + 4."]
              - id: l2-s4
                type: multiple_choice
                text: "This bar has 8 squares. How many squares are 3/4 of the bar?"
                say: "This bar has eight squares. How many squares are three quarters of the bar?"
                show: { drawn: fraction, kind: rect, parts: 8, rows: 2, shaded: 0 }
                options: ["6", "2", "3"]
                answer: "6"
                hints: ["One quarter of the bar is 2 squares. Take three quarters."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 3/4 of 8 = 6"
                say: "Three quarters of eight is six. Is that true?"
                answer: true
                hints: ["One quarter of 8 is 2. What are three of them?"]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "3/4 of 20 = _"
                say: "What is three quarters of twenty?"
                answer: "15"
              - id: l2-n2
                type: text_input
                text: "2/4 of 16 = _"
                say: "What is two quarters of sixteen?"
                answer: "8"
              - id: l2-n3
                type: multiple_choice
                text: "2/3 of 15 = _"
                say: "What is two thirds of fifteen?"
                options: ["10", "5", "12"]
                answer: "10"
              - id: l2-n4
                type: true_false
                text: "Is it true? 2/4 of 10 = 5"
                say: "Two quarters of ten is five. Is that true?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "A pizza is cut into 8 equal slices. How many slices are 1/2 of the pizza?"
                say: "A pizza is cut into eight equal slices. How many slices are one half of the pizza?"
                show: { drawn: fraction, kind: circle, parts: 8, shaded: 0 }
                options: ["4", "2", "8"]
                answer: "4"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: text_input
            text: "3/4 of 4 = _"
            say: "What is three quarters of four?"
            answer: "3"
          - id: l2-c2
            type: multiple_choice
            text: "2/3 of 3 = _"
            say: "What is two thirds of three?"
            options: ["2", "1", "3"]
            answer: "2"
          - id: l2-c3
            type: true_false
            text: "Is it true? 1/4 of 8 = 4"
            say: "One quarter of eight is four. Is that true?"
            answer: false

  - n: 3
    title: { de: "Längen, Geld und Größen", en: "Lengths, money and measures" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: text_input
            text: "3/4 of 8 = _"
            say: "What is three quarters of eight?"
            answer: "6"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "1/3 of 12 = _"
            say: "What is one third of twelve?"
            options: ["4", "3", "9"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "This ribbon is 12 cm long.\n1/4 of 12 cm = 3 cm"
            say: "Fractions work for lengths too. This ribbon is twelve centimetres long. Share twelve centimetres into four equal pieces: each piece is three centimetres. So one quarter of the ribbon is three centimetres."
            show: { drawn: ruler, to: 15, length: 12, colour: red }
          - text: "1/2 of 20p = 10p"
            say: "And for money. Here is twenty pence. Half of twenty pence is ten pence."
            show: { drawn: coins, values: [10, 10] }
          - text: "3/4 of 12 cm = 9 cm\n1/4 of 12 cm = 3 cm, then 3 + 3 + 3"
            say: "For three quarters of a length, do the same as with dots: find one quarter, then take three of them. Three quarters of twelve centimetres is nine centimetres. The answer keeps its unit: centimetres, pence, litres or kilograms."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "This strip is 8 cm long. What is 1/2 of it?"
                say: "This strip is eight centimetres long. What is one half of it?"
                show: { drawn: ruler, to: 15, length: 8, colour: blue }
                options: ["4 cm", "2 cm", "16 cm"]
                answer: "4 cm"
                feedback:
                  "16 cm": "16 cm is double. A half is smaller than the whole strip."
                hints:
                  - "Half means 2 equal pieces."
                  - "Which number and the same number again make 8?"
                  - "4 cm."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "This strip is 12 cm long. What is 1/3 of it?"
                say: "This strip is twelve centimetres long. What is one third of it?"
                show: { drawn: ruler, to: 15, length: 12, colour: green }
                options: ["4 cm", "3 cm", "9 cm"]
                answer: "4 cm"
                feedback:
                  "3 cm": "3 is the number of pieces. Each piece is 12 shared by 3."
                hints:
                  - "One third: cut the strip into 3 equal pieces."
                  - "12 shared into 3 groups is 4 in each."
                  - "4 cm."
              - id: l3-f3
                type: multiple_choice
                text: "What is 1/2 of 40p?"
                say: "Here is forty pence. What is one half of it?"
                show: { drawn: coins, values: [20, 20] }
                options: ["20p", "10p", "80p"]
                answer: "20p"
                hints:
                  - "Share the money into 2 equal amounts."
                  - "There are two 20p coins."
                  - "20p."
              - id: l3-f4
                type: text_input
                text: "1/4 of 20 cm = _ cm"
                say: "What is one quarter of twenty centimetres?"
                answer: "5"
                hints:
                  - "Share 20 into 4 equal pieces."
                  - "4 fives make 20."
                  - "5 cm."
              - id: l3-f5
                type: true_false
                text: "Is it true? 3/4 of this 12 cm strip is 9 cm."
                say: "Three quarters of this twelve centimetre strip is nine centimetres. Is that true?"
                show: { drawn: ruler, to: 15, length: 12, colour: red }
                answer: true
                hints:
                  - "First find one quarter of 12 cm."
                  - "One quarter is 3 cm. Three quarters is 3 + 3 + 3."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l3-s1
                type: multiple_choice
                text: "This strip is 10 cm long. What is 1/2 of it?"
                say: "This strip is ten centimetres long. What is one half of it?"
                show: { drawn: ruler, to: 15, length: 10, colour: green }
                options: ["5 cm", "2 cm", "20 cm"]
                answer: "5 cm"
                hints: ["A half is 2 equal pieces, each smaller than the whole."]
              - id: l3-s2
                type: multiple_choice
                text: "What is 1/4 of 12 litres?"
                say: "What is one quarter of twelve litres?"
                options: ["3 litres", "4 litres", "8 litres"]
                answer: "3 litres"
                hints: ["Share 12 litres into 4 equal amounts."]
              - id: l3-s3
                type: text_input
                text: "1/3 of 30p = _p"
                say: "Here is thirty pence. What is one third of it?"
                show: { drawn: coins, values: [10, 10, 10] }
                answer: "10"
                hints: ["Share the three coins between 3 people."]
              - id: l3-s4
                type: true_false
                text: "Is it true? 1/2 of 50p is 20p."
                say: "One half of fifty pence is twenty pence. Is that true?"
                answer: false
                hints: ["Do 20p and 20p make 50p?"]
              - id: l3-s5
                type: multiple_choice
                text: "What is 3/4 of 8 kg?"
                say: "What is three quarters of eight kilograms?"
                options: ["6 kg", "2 kg", "4 kg"]
                answer: "6 kg"
                hints: ["One quarter of 8 kg is 2 kg. Take three of them."]

          - support: none
            setting: in-context
            tasks:
              - id: l3-n1
                type: text_input
                text: "A rope is 16 m long. Dad cuts off 1/4 of it. How many metres does he cut off?"
                say: "A rope is sixteen metres long. Dad cuts off one quarter of it. How many metres does he cut off?"
                answer: "4"
              - id: l3-n2
                type: multiple_choice
                text: "Amy has 20p. She spends 1/2 of it. How much does she spend?"
                say: "Amy has twenty pence. She spends one half of it. How much does she spend?"
                options: ["10p", "2p", "40p"]
                answer: "10p"
              - id: l3-n3
                type: text_input
                text: "There are 12 pencils in a pot. 2/3 of them are blue. How many pencils are blue?"
                say: "There are twelve pencils in a pot. Two thirds of them are blue. How many pencils are blue?"
                answer: "8"
              - id: l3-n4
                type: multiple_choice
                text: "A tank holds 8 litres. It is 3/4 full. How many litres are in the tank?"
                say: "A tank holds eight litres. It is three quarters full. How many litres are in the tank?"
                options: ["6 litres", "2 litres", "4 litres"]
                answer: "6 litres"
              - id: l3-n5
                type: true_false
                text: "A ribbon is 20 cm long. Sam cuts it into quarters. Is each piece 4 cm?"
                say: "A ribbon is twenty centimetres long. Sam cuts it into quarters. Is each piece four centimetres long?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l3-c1
            type: text_input
            text: "1/3 of 18 = _"
            say: "What is one third of eighteen?"
            answer: "6"
          - id: l3-c2
            type: multiple_choice
            text: "2/4 of 20 = _"
            say: "What is two quarters of twenty?"
            options: ["10", "5", "2"]
            answer: "10"
          - id: l3-c3
            type: multiple_choice
            text: "This strip is 14 cm long. What is 1/2 of it?"
            say: "This strip is fourteen centimetres long. What is one half of it?"
            show: { drawn: ruler, to: 15, length: 14, colour: blue }
            options: ["7 cm", "2 cm", "28 cm"]
            answer: "7 cm"
          - id: l3-c4
            type: multiple_choice
            text: "This tray has 12 squares. How many squares are 1/4 of the tray?"
            say: "This tray has twelve squares. How many squares are one quarter of the tray?"
            show: { drawn: fraction, kind: rect, parts: 12, rows: 3, shaded: 0 }
            options: ["3", "4", "8"]
            answer: "3"
