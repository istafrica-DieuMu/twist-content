# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.sketches
skill: math.word-problems.sketches
curriculum: en-GB
language: en
title:
  de: Skizzen, Tabellen und Rechenstrich bei Sachaufgaben
  en: Drawing a word problem
summary: >
  Lesson 1 puts a word problem on an empty number line or a part-whole
  model: adding on, taking away and counting up ("How many more to
  make 60?"), and reads which story a number line shows; lesson 2 puts a
  story that grows step by step into a table (5p more every week), fills
  the gaps and reads facts from it, and ends with the skill check.
  Drawing a sketch by hand waits for a drawing task; here the child
  chooses or completes a sketch.
metadata:
  year: year-2
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.word-problems.question-calc-answer]
  also_practises: [math.add-sub-to-100.complement, math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { en: [word problem, sketch, number line, part-whole model, whole, part, table, row, how many more] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich, part-whole, table]
  facets: [currency, units]
  parts:
    - { id: line, what: { de: eine Geschichte mit dazu oder weg am Rechenstrich lösen, en: solving a story about more or fewer on an empty number line } }
    - { id: complement, what: { de: "ergänzen am Rechenstrich oder im Teile-Ganzes-Modell: Wie viele fehlen noch?", en: "counting up on a number line or a part-whole model: how many more?" } }
    - { id: match, what: { de: "erkennen, welche Geschichte zu einem Rechenstrich passt", en: telling which story a number line shows } }
    - { id: table, what: { de: eine Sachaufgabe Schritt für Schritt mit einer Tabelle lösen, en: solving a word problem step by step with a table } }
  misconceptions:
    - id: how-many-more-adds
      what: Adds the two numbers in a "how many more" story (Ali has 38, wants 60, answers 98)
      addressed: lesson 1 Learn counts up from 38 to 60 on the number line; l1-f3 (with feedback), l1-s3 and l1-c2 offer the sum
    - id: number-line-wrong-way
      what: Draws a taking-away story as jumps forwards
      addressed: lesson 1 Learn shows a take-away jump going back; l1-f2 (with feedback), l1-s2 and l2-c2 ask which number line fits a story
    - id: table-skips-row
      what: Skips a row of a table and reads the next step as the answer
      addressed: lesson 2 Learn goes through the table row by row; l2-f2 (with feedback), l2-s2 and l2-n2 ask for the next row
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die Geschichte am Rechenstrich, en: The story on a number line }
    goal:
      de: "Zeichne eine Sachaufgabe am Rechenstrich, so wie bei 46 Leuten im Bus, von denen 20 aussteigen."
      en: "Show a word problem on a number line, like a bus with 46 people where 20 get off."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Sara has 24 shells. She finds 10 more. Which calculation?"
            say: "Sara has twenty-four shells. She finds ten more. Which calculation tells you how many she has now?"
            options: ["24 + 10", "24 − 10", "34 − 10"]
            answer: "24 + 10"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Sara has 24 shells. She finds 10 more. 24 + 10 = 34. Which answer sentence fits?"
            say: "Sara has twenty-four shells and finds ten more. Twenty-four add ten is thirty-four. Which answer sentence fits?"
            options: ["Sara has 34 shells.", "Sara has 24 shells.", "Sara finds 34 more shells."]
            answer: "Sara has 34 shells."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A bus has 46 people. 20 get off. How many are left?"
            say: "A bus has forty-six people on it. Twenty get off. Draw it on a number line: start at forty-six and jump back twenty. Twenty-six people are left."
            show: { drawn: rechenstrich, start: 46, jumps: [-20] }
          - text: "Ali has 38 marbles. He wants 60. How many more does he need?"
            say: "Ali has thirty-eight marbles. He wants sixty. Count up from thirty-eight: two to forty, then twenty to sixty. He needs twenty-two more."
            show: { drawn: rechenstrich, start: 38, jumps: [2, 20] }
          - text: "Whole: 50. Part: 30. Other part: ?"
            say: "A part-whole model helps too. There are fifty children. Thirty are in the hall. How many are outside? The whole is fifty, one part is thirty, so the other part is twenty."
            show: { drawn: part-whole, whole: 50, parts: [30, null] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Jo has 35 stickers. She gets 20 more. How many now?"
                say: "Jo has thirty-five stickers. She gets twenty more. How many does she have now?"
                show: { drawn: rechenstrich, start: 35, jumps: [20] }
                options: ["55", "15", "45"]
                answer: "55"
                hints:
                  - "The jump goes forwards: she gets more."
                  - "Thirty-five and twenty more."
                  - "55."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "There are 72 apples. 30 are eaten. Which number line fits?"
                say: "There are seventy-two apples. Thirty are eaten. Which number line fits the story?"
                options: ["start 72, jump back 30", "start 72, jump on 30", "start 30, jump on 72"]
                answer: "start 72, jump back 30"
                feedback:
                  "start 72, jump on 30": "Eaten apples are gone, so there are fewer. The jump goes back."
                hints:
                  - "Are there more apples or fewer at the end?"
                  - "Fewer, so the jump goes back from seventy-two."
                  - "Start 72, jump back 30."
              - id: l1-f3
                type: multiple_choice
                text: "Ben has 45p. A comic costs 60p. How much more does he need?"
                say: "Ben has forty-five pence. A comic costs sixty pence. How much more money does he need?"
                show: { drawn: rechenstrich, start: 45, jumps: [5, 10] }
                options: ["15p", "105p", "25p"]
                answer: "15p"
                feedback:
                  "105p": "That adds the two amounts. Count up from forty-five to sixty instead."
                hints:
                  - "Count up from forty-five to sixty."
                  - "Five to fifty, then ten to sixty."
                  - "15p."
              - id: l1-f4
                type: fill_in_blank
                text: "40 children. 25 are girls. How many are boys?"
                say: "There are forty children in the club. Twenty-five are girls. How many are boys? Fill the gap in the part-whole model."
                show: { drawn: part-whole, whole: 40, parts: [25, null] }
                frame: "25 + _ = 40"
                options: ["15", "65", "25"]
                answer: ["15"]
                hints:
                  - "The whole is forty. One part is twenty-five."
                  - "Twenty-five and what make forty?"
                  - "15."
              - id: l1-f5
                type: multiple_choice
                text: "Which story fits this number line?"
                say: "Which story fits this number line?"
                show: { drawn: rechenstrich, start: 50, jumps: [-15] }
                options: ["50 sweets, 15 are eaten", "50 sweets, 15 more are bought", "15 sweets, 50 are eaten"]
                answer: "50 sweets, 15 are eaten"
                hints:
                  - "Where does it start? Which way does it jump?"
                  - "It starts at fifty and jumps back fifteen."
                  - "50 sweets, 15 are eaten."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "A shop has 63 balloons. It sells 40. How many are left?"
                say: "A shop has sixty-three balloons. It sells forty. How many are left?"
                show: { drawn: rechenstrich, start: 63, jumps: [-40] }
                answer: "23"
                hints: ["Jump back forty from sixty-three."]
              - id: l1-s2
                type: multiple_choice
                text: "Mia has 28 beads. She buys 30 more. Which number line fits?"
                say: "Mia has twenty-eight beads. She buys thirty more. Which number line fits the story?"
                options: ["start 28, jump on 30", "start 28, jump back 30", "start 30, jump back 28"]
                answer: "start 28, jump on 30"
                hints: ["Does she have more or fewer at the end?"]
              - id: l1-s3
                type: text_input
                text: "A book has 80 pages. Tom has read 54. How many pages are left?"
                say: "A book has eighty pages. Tom has read fifty-four. How many pages are left to read?"
                show: { drawn: rechenstrich, start: 54, jumps: [] }
                answer: "26"
                hints: ["Count up from fifty-four to eighty."]
              - id: l1-s4
                type: multiple_choice
                text: "30 cars. 12 are red. How many are not red?"
                say: "There are thirty cars. Twelve are red. How many are not red?"
                show: { drawn: part-whole, whole: 30, parts: [12, null] }
                options: ["18", "42", "22"]
                answer: "18"
                hints: ["The whole is thirty. One part is twelve."]
              - id: l1-s5
                type: multiple_choice
                text: "Which story fits this number line?"
                say: "Which story fits this number line?"
                show: { drawn: rechenstrich, start: 24, jumps: [30] }
                options: ["24 pens, 30 more are added", "24 pens, 30 are lost", "30 pens, 24 more are added"]
                answer: "24 pens, 30 more are added"
                hints: ["It starts at twenty-four and jumps forwards."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "There are 57 children in the hall. 30 more come in. How many now?"
                say: "There are fifty-seven children in the hall. Thirty more come in. How many children are in the hall now?"
                answer: "87"
              - id: l1-n2
                type: text_input
                text: "Zac has 70p. He spends 35p. How many pence are left?"
                say: "Zac has seventy pence. He spends thirty-five pence. How many pence does he have left?"
                answer: "35"
              - id: l1-n3
                type: multiple_choice
                text: "Ella has 33 cards. She wants 50. How many more does she need?"
                say: "Ella has thirty-three cards. She wants fifty. How many more does she need?"
                options: ["17", "83", "27"]
                answer: "17"
              - id: l1-n4
                type: fill_in_blank
                text: "60 ducks. 45 are on the pond. How many are on the grass?"
                say: "There are sixty ducks. Forty-five are on the pond. The rest are on the grass. How many are on the grass?"
                show: { drawn: part-whole, whole: 60, parts: [45, null] }
                frame: "45 + _ = 60"
                options: ["15", "105", "25"]
                answer: ["15"]
              - id: l1-n5
                type: multiple_choice
                text: "Which story fits this number line?"
                say: "Which story fits this number line?"
                show: { drawn: rechenstrich, start: 90, jumps: [-25] }
                options: ["90 seeds, 25 are planted", "90 seeds, 25 more are bought", "25 seeds, 90 are planted"]
                answer: "90 seeds, 25 are planted"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "A train has 48 people. 20 get off. How many are left?"
            say: "A train has forty-eight people on it. Twenty get off. How many are left?"
            answer: "28"
          - id: l1-c2
            type: multiple_choice
            text: "Leo has 26 stamps. He wants 40. How many more does he need?"
            say: "Leo has twenty-six stamps. He wants forty. How many more does he need?"
            options: ["14", "66", "24"]
            answer: "14"
          - id: l1-c3
            type: multiple_choice
            text: "Which story fits this number line?"
            say: "Which story fits this number line?"
            show: { drawn: rechenstrich, start: 40, jumps: [-12] }
            options: ["40 cakes, 12 are sold", "40 cakes, 12 more are baked", "12 cakes, 40 are sold"]
            answer: "40 cakes, 12 are sold"
          - id: l1-c4
            type: text_input
            text: "There are 39 cars in a car park. 40 more arrive. How many cars are there now?"
            say: "There are thirty-nine cars in a car park. Forty more arrive. How many cars are there now?"
            answer: "79"
          - id: l1-c5
            type: fill_in_blank
            text: "70 runners. 45 have finished. How many are still running?"
            say: "There are seventy runners in a race. Forty-five have finished. How many are still running?"
            show: { drawn: part-whole, whole: 70, parts: [45, null] }
            frame: "45 + _ = 70"
            options: ["25", "35", "15"]
            answer: ["25"]
          - id: l1-c6
            type: multiple_choice
            text: "There are 55 books. 25 are given away. Which number line fits?"
            say: "There are fifty-five books. Twenty-five are given away. Which number line fits the story?"
            options: ["start 55, jump back 25", "start 55, jump on 25", "start 25, jump on 55"]
            answer: "start 55, jump back 25"

  - n: 2
    title: { de: Die Geschichte in der Tabelle, en: The story in a table }
    goal:
      de: "Schreib eine Geschichte, die Schritt für Schritt wächst, in eine Tabelle, so wie Zara, die jede Woche 5 Pence spart."
      en: "Put a story that grows step by step into a table, like Zara saving 5 pence every week."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Amy has 64 beads. She gives away 30. How many are left?"
            say: "Amy has sixty-four beads. She gives away thirty. How many are left?"
            answer: "34"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Sam has 52p. A yo-yo costs 70p. How much more does he need?"
            say: "Sam has fifty-two pence. A yo-yo costs seventy pence. How much more does he need?"
            options: ["18p", "122p", "28p"]
            answer: "18p"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Zara saves 5p every week. How much does she have after 4 weeks?"
            say: "Zara saves five pence every week. How much has she saved after four weeks? A table helps."
          - text: "Week 1: 5p, week 2: 10p, week 3: 15p, week 4: 20p"
            say: "Each row is one more week and five pence more. Week one: five pence. Week two: ten pence. Week three: fifteen pence. Week four: twenty pence."
            show: { drawn: table, rows: [[Week, Money], ["1", "5p"], ["2", "10p"], ["3", "15p"], ["4", "20p"]] }
          - text: "Answer: after 4 weeks Zara has 20p."
            say: "The last row gives the answer: after four weeks Zara has twenty pence. Go row by row, so you do not miss a week."
            show: { drawn: table, rows: [[Week, Money], ["1", "5p"], ["2", "10p"], ["3", "15p"], ["4", "20p"]], mark: [[4, 0], [4, 1]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Kit puts 3 shells in a jar every day. How many on day 3?"
                say: "Kit puts three shells in a jar every day. Look at the table. How many shells are in the jar on day three?"
                show: { drawn: table, rows: [[Day, Shells], ["1", "3"], ["2", "6"], ["3", "9"]] }
                options: ["9", "3", "6"]
                answer: "9"
                hints:
                  - "Find the row for day 3."
                  - "Read the number of shells in that row."
                  - "9."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Kit adds 3 shells every day. How many on day 4?"
                say: "Kit adds three shells every day. How many shells are in the jar on day four?"
                show: { drawn: table, rows: [[Day, Shells], ["1", "3"], ["2", "6"], ["3", "9"], ["4", "?"]] }
                options: ["12", "15", "10"]
                answer: "12"
                feedback:
                  "15": "Fifteen is day five. Day four is just one row on: nine and three."
                hints:
                  - "Every day three more shells go in."
                  - "Nine and three."
                  - "12."
              - id: l2-f3
                type: fill_in_blank
                text: "A ticket costs 10p. Fill the table."
                say: "A ticket costs ten pence. How much do two tickets cost, and three tickets?"
                show: { drawn: table, rows: [[Tickets, Cost], ["1", "10p"], ["2", "?"], ["3", "?"]] }
                frame: "2 tickets: _p · 3 tickets: _p"
                options: ["20", "30", "12", "13"]
                answer: ["20", "30"]
                hints:
                  - "Each ticket adds ten pence."
                  - "Ten and ten, then ten more."
                  - "20 and 30."
              - id: l2-f4
                type: text_input
                text: "A plant grows 2 cm every week. It is 10 cm now. How tall after 3 weeks?"
                say: "A plant is ten centimetres tall now. It grows two centimetres every week. How tall is it after three weeks?"
                show: { drawn: table, rows: [[Week, Height], ["0", "10 cm"], ["1", "12 cm"], ["2", "?"], ["3", "?"]] }
                answer: "16"
                hints:
                  - "Fill the table row by row."
                  - "Week two: fourteen centimetres. Then two more."
                  - "16."
              - id: l2-f5
                type: true_false
                text: "Is it true? Zara saves 5p a week. After 6 weeks she has 30p."
                say: "Zara saves five pence a week. After six weeks she has thirty pence. Is that true?"
                show: { drawn: table, rows: [[Week, Money], ["1", "5p"], ["2", "10p"], ["3", "15p"], ["4", "20p"], ["5", "25p"], ["6", "?"]] }
                answer: true
                hints:
                  - "Go on from week five."
                  - "Twenty-five and five."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Noor reads 2 pages every day. On which day has she read 8 pages?"
                say: "Noor reads two pages every day. On which day has she read eight pages?"
                show: { drawn: table, rows: [[Day, Pages], ["1", "2"], ["2", "4"], ["3", "6"], ["4", "8"]] }
                options: ["day 4", "day 8", "day 2"]
                answer: "day 4"
                hints: ["Find eight in the pages column."]
              - id: l2-s2
                type: multiple_choice
                text: "Noor reads 2 pages every day. How many after day 5?"
                say: "Noor reads two pages every day. How many pages has she read after day five?"
                show: { drawn: table, rows: [[Day, Pages], ["1", "2"], ["2", "4"], ["3", "6"], ["4", "8"], ["5", "?"]] }
                options: ["10", "12", "9"]
                answer: "10"
                hints: ["One more row: eight and two."]
              - id: l2-s3
                type: fill_in_blank
                text: "A bag holds 5 apples. Fill the table."
                say: "A bag holds five apples. How many apples are in three bags, and in four bags?"
                show: { drawn: table, rows: [[Bags, Apples], ["1", "5"], ["2", "10"], ["3", "?"], ["4", "?"]] }
                frame: "3 bags: _ · 4 bags: _"
                options: ["15", "20", "11", "25"]
                answer: ["15", "20"]
                hints: ["Each bag adds five apples."]
              - id: l2-s4
                type: true_false
                text: "Is it true? The table shows 4 tickets cost 40p."
                say: "Look at the table. Four tickets cost forty pence. Is that true?"
                show: { drawn: table, rows: [[Tickets, Cost], ["1", "10p"], ["2", "20p"], ["3", "30p"], ["4", "50p"]] }
                answer: false
                hints: ["Read the row for 4 tickets."]
              - id: l2-s5
                type: text_input
                text: "A candle is 20 cm. It gets 2 cm shorter every hour. How long after 3 hours?"
                say: "A candle is twenty centimetres long. It gets two centimetres shorter every hour. How long is it after three hours?"
                show: { drawn: table, rows: [[Hour, Length], ["0", "20 cm"], ["1", "18 cm"], ["2", "?"], ["3", "?"]] }
                answer: "14"
                hints: ["Take away two for each row."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Leo saves 10p every week. How much after week 3?"
                say: "Leo saves ten pence every week. How much has he saved after week three?"
                show: { drawn: table, rows: [[Week, Money], ["1", "10p"], ["2", "20p"], ["3", "?"]] }
                options: ["30p", "13p", "40p"]
                answer: "30p"
              - id: l2-n2
                type: text_input
                text: "A tower gets 4 bricks taller each day. How tall on day 4?"
                say: "A tower gets four bricks taller each day. How many bricks tall is it on day four?"
                show: { drawn: table, rows: [[Day, Bricks], ["1", "4"], ["2", "8"], ["3", "12"], ["4", "?"]] }
                answer: "16"
              - id: l2-n3
                type: fill_in_blank
                text: "A box holds 2 cakes. Fill the table."
                say: "A box holds two cakes. How many cakes are in four boxes, and in five boxes?"
                show: { drawn: table, rows: [[Boxes, Cakes], ["1", "2"], ["2", "4"], ["3", "6"], ["4", "?"], ["5", "?"]] }
                frame: "4 boxes: _ · 5 boxes: _"
                options: ["8", "10", "7", "12"]
                answer: ["8", "10"]
              - id: l2-n4
                type: multiple_choice
                text: "Kit adds 3 shells every day. On which day are there 15 shells?"
                say: "Kit adds three shells every day. On which day are there fifteen shells?"
                show: { drawn: table, rows: [[Day, Shells], ["1", "3"], ["2", "6"], ["3", "9"], ["4", "12"], ["5", "15"]] }
                options: ["day 5", "day 15", "day 3"]
                answer: "day 5"
              - id: l2-n5
                type: text_input
                text: "Max has 50p. He spends 10p every day. How much is left after 3 days?"
                say: "Max has fifty pence. He spends ten pence every day. How many pence are left after three days?"
                show: { drawn: table, rows: [[Day, Money], ["0", "50p"], ["1", "40p"], ["2", "?"], ["3", "?"]] }
                answer: "20"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: line
            type: text_input
            text: "A jar has 85 sweets. 40 are eaten. How many are left?"
            say: "A jar has eighty-five sweets. Forty are eaten. How many are left?"
            answer: "45"
          - id: l2-c2
            part: match
            type: multiple_choice
            text: "There are 36 birds. 20 more land. Which number line fits?"
            say: "There are thirty-six birds in a tree. Twenty more land. Which number line fits the story?"
            options: ["start 36, jump on 20", "start 36, jump back 20", "start 20, jump back 36"]
            answer: "start 36, jump on 20"
          - id: l2-c3
            part: complement
            type: multiple_choice
            text: "Poppy has 44 stickers. She wants 70. How many more does she need?"
            say: "Poppy has forty-four stickers. She wants seventy. How many more does she need?"
            show: { drawn: rechenstrich, start: 44, jumps: [] }
            options: ["26", "114", "36"]
            answer: "26"
          - id: l2-c4
            part: table
            type: fill_in_blank
            text: "A pen costs 5p. Fill the table."
            say: "A pen costs five pence. How much do three pens cost, and four pens?"
            show: { drawn: table, rows: [[Pens, Cost], ["1", "5p"], ["2", "10p"], ["3", "?"], ["4", "?"]] }
            frame: "3 pens: _p · 4 pens: _p"
            options: ["15", "20", "8", "9"]
            answer: ["15", "20"]
          - id: l2-c5
            part: table
            type: multiple_choice
            text: "Ivy saves 10p every week. In which week has she saved 30p?"
            say: "Ivy saves ten pence every week. In which week has she saved thirty pence?"
            show: { drawn: table, rows: [[Week, Money], ["1", "10p"], ["2", "20p"], ["3", "30p"], ["4", "40p"]] }
            options: ["week 3", "week 30", "week 4"]
            answer: "week 3"
          - id: l2-c6
            part: line
            type: text_input
            text: "A farmer has 58 sheep. He buys 30 more. How many sheep does he have now?"
            say: "A farmer has fifty-eight sheep. He buys thirty more. How many sheep does he have now?"
            answer: "88"
          - id: l2-c7
            part: line
            type: multiple_choice
            text: "Kim has 67p. She spends 25p. How much does she have left?"
            say: "Kim has sixty-seven pence. She spends twenty-five pence. How much does she have left?"
            options: ["42p", "92p", "32p"]
            answer: "42p"
          - id: l2-c8
            part: line
            type: text_input
            text: "A tree has 81 apples. 50 fall off. How many are still on the tree?"
            say: "A tree has eighty-one apples. Fifty fall off. How many apples are still on the tree?"
            show: { drawn: rechenstrich, start: 81, jumps: [-50] }
            answer: "31"
          - id: l2-c9
