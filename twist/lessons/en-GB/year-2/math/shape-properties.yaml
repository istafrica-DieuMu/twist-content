# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.shape-properties
skill: math.shapes.properties
curriculum: en-GB
language: en
title:
  de: Ecken und Seiten
  en: Sides and vertices
summary: >
  Lesson 1 describes 2-D shapes by their sides and vertices (triangle 3,
  pentagon 5, hexagon 6, octagon 8; a circle has none) and sorts them by
  the number of sides, whatever their colour or size; lesson 2 sets the
  rectangle and the square side by side (four square corners; a square's
  four sides are all the same length), explains why every square is also
  a rectangle but not the other way round, and ends with the skill check.
  Line symmetry has its own skill.
metadata:
  year: year-2
  topic: { de: Formen, en: Shapes }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.shapes.basic-shapes]
  also_practises: [math.shapes.basic-shapes]
  vocabulary: { en: [side, vertex, vertices, corner, pentagon, hexagon, octagon, rectangle, square, square corner, right angle, same length] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: count, what: { de: Ecken und Seiten einer Figur zählen, en: counting the sides and vertices of a shape } }
    - { id: sort, what: { de: "Figuren nach Ecken und Seiten finden und sortieren, egal welche Farbe und Größe", en: "finding and sorting shapes by their sides and vertices, whatever their colour and size" } }
    - { id: square-rect, what: { de: Quadrat und Rechteck unterscheiden, en: telling a square from a rectangle } }
    - { id: square-is-rect, what: { de: "erklären, warum jedes Quadrat auch ein Rechteck ist", en: explaining why every square is also a rectangle } }
  misconceptions:
    - id: square-not-rectangle
      what: Thinks a square cannot be a rectangle because it looks different
      addressed: lesson 2 Learn lists what a rectangle needs and finds it all in the square; l2-f2, l2-f5 (with feedback), l2-s2, l2-n3, l2-c2 and l2-c4 ask whether a square is also a rectangle
    - id: colour-or-size-decides
      what: Names or sorts a shape by its colour or size instead of its sides and vertices
      addressed: l1-f5, l1-s2, l1-n2, l1-c2 and l2-n1 show the shapes in different colours and sizes, with feedback in l1-f5; the hints say to count the vertices
    - id: hexagon-octagon-mixed
      what: Guesses six or eight for any shape with many sides instead of counting round
      addressed: lesson 1 Learn counts round the pentagon, hexagon and octagon; l1-f1, l1-s2, l1-n1 and l2-c1 ask for the count, and the full-stage hints count round from one vertex
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ecken und Seiten zählen", en: "Counting sides and vertices" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is this shape called?"
            show: { drawn: shape, kind: triangle, colour: green }
            options: ["triangle", "rectangle", "circle"]
            answer: "triangle"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Which one is the circle?"
            options:
              - { drawn: shape, kind: square, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
              - { drawn: shape, kind: triangle, colour: blue }
            answer: circle
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Triangle: 3 sides, 3 vertices"
            say: "A triangle has three straight sides. A corner is where two sides meet. In maths we call a corner a vertex, and more than one are vertices. A triangle has three vertices."
            show: { drawn: shape, kind: triangle, colour: orange }
          - text: "Pentagon 5, hexagon 6, octagon 8"
            say: "Put your finger on one vertex and count round until you get back. A pentagon has five sides, a hexagon has six and an octagon has eight. A shape with straight sides has the same number of vertices as sides."
            show: { drawn: shape, row: [pentagon, hexagon, octagon], colours: [green, purple, blue] }
          - text: "Circle: no vertices"
            say: "A circle has one curved side and no vertices at all."
            show: { drawn: shape, kind: circle, colour: yellow }
          - text: "Big or small, red or blue: count the sides."
            say: "A shape can be big or small, red or blue. Its name comes from its sides and vertices, never from its colour or size."
            show: { drawn: shape, row: [square, square], colours: [red, blue] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many vertices does this shape have?"
                show: { drawn: shape, kind: hexagon, colour: blue }
                options: ["6", "5", "4"]
                answer: "6"
                hints:
                  - "Point to each vertex in turn."
                  - "Start at the top and count round until you get back to where you started."
                  - "6 vertices. It is a hexagon."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many sides does a rectangle have?"
                show: { drawn: shape, kind: rectangle, colour: green }
                options: ["4", "2", "8"]
                answer: "4"
                feedback:
                  "2": "Two sides are long and two are short. That makes 4 sides altogether."
                hints:
                  - "Run your finger all the way round the rectangle."
                  - "Top, right, bottom, left."
                  - "4 sides."
              - id: l1-f3
                type: true_false
                text: "A circle has one vertex."
                say: "Is it true? A circle has one vertex."
                answer: false
                hints:
                  - "A vertex is where two straight sides meet."
                  - "Does a circle have any straight sides?"
                  - "No. A circle has no vertices."
              - id: l1-f4
                type: matching
                text: "Match each shape to its number of sides."
                pairs:
                  - { left: { drawn: shape, kind: triangle, colour: red }, right: { text: "3 sides" } }
                  - { left: { drawn: shape, kind: pentagon, colour: red }, right: { text: "5 sides" } }
                  - { left: { drawn: shape, kind: octagon, colour: red }, right: { text: "8 sides" } }
                option_audio: false
                hints:
                  - "Count the sides of each shape."
                  - "The shape with the most sides is the octagon."
                  - "Triangle 3, pentagon 5, octagon 8."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which shape has 4 vertices?"
                options:
                  - { drawn: shape, kind: triangle, colour: red, size: 120 }
                  - { drawn: shape, kind: square, colour: yellow, size: 70 }
                  - { drawn: shape, kind: pentagon, colour: red, size: 120 }
                answer: square
                option_audio: false
                feedback:
                  triangle: "The triangle is big, but it only has 3 vertices. Size does not count."
                hints:
                  - "Size and colour do not matter. Count the vertices."
                  - "The triangle has 3 and the pentagon has 5."
                  - "The small yellow square."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many sides does this shape have?"
                show: { drawn: shape, kind: pentagon, colour: pink }
                options: ["5", "6", "4"]
                answer: "5"
                hints: ["Run your finger along each straight side and count."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which shape has 8 sides?"
                options:
                  - { drawn: shape, kind: hexagon, colour: purple, size: 120 }
                  - { drawn: shape, kind: octagon, colour: green, size: 70 }
                  - { drawn: shape, kind: rectangle, colour: purple, size: 120 }
                answer: octagon
                option_audio: false
                hints: ["Count the sides, not the colour or the size."]
              - id: l1-s3
                type: true_false
                text: "A rectangle has 4 sides and 4 vertices."
                say: "Is it true? A rectangle has four sides and four vertices."
                answer: true
                hints: ["Think of a sheet of paper. Count its sides and its corners."]
              - id: l1-s4
                type: multiple_choice
                text: "A shape has 6 vertices. How many sides does it have?"
                options: ["6", "3", "12"]
                answer: "6"
                hints: ["A shape with straight sides has as many sides as vertices."]
              - id: l1-s5
                type: sorting
                text: "Sort the shapes by their sides."
                bins:
                  - { id: three, show: { text: "3 sides" }, say: "three sides" }
                  - { id: four, show: { text: "4 sides" }, say: "four sides" }
                  - { id: more, show: { text: "more than 4 sides" }, say: "more than four sides" }
                options:
                  - { text: "triangle", bin: three }
                  - { text: "square", bin: four }
                  - { text: "hexagon", bin: more }
                  - { text: "rectangle", bin: four }
                  - { text: "pentagon", bin: more }
                hints: ["Picture each shape and count its sides."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many vertices does this shape have?"
                show: { drawn: shape, kind: octagon, colour: orange }
                options: ["8", "6", "7"]
                answer: "8"
              - id: l1-n2
                type: image_multiple_choice
                text: "Which shape has no vertices?"
                options:
                  - { drawn: shape, kind: hexagon, colour: blue, size: 70 }
                  - { drawn: shape, kind: circle, colour: brown, size: 120 }
                  - { drawn: shape, kind: triangle, colour: blue, size: 70 }
                answer: circle
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "A pentagon has 6 sides."
                say: "Is it true? A pentagon has six sides."
                answer: false
              - id: l1-n4
                type: text_input
                text: "Sam draws a triangle and a square. How many sides does he draw altogether?"
                answer: "7"
              - id: l1-n5
                type: matching
                text: "Match each shape to its vertices."
                pairs:
                  - { left: { drawn: shape, kind: rectangle, colour: green }, right: { text: "4 vertices" } }
                  - { left: { drawn: shape, kind: hexagon, colour: green }, right: { text: "6 vertices" } }
                  - { left: { drawn: shape, kind: circle, colour: green }, right: { text: "no vertices" } }
                  - { left: { drawn: shape, kind: triangle, colour: green }, right: { text: "3 vertices" } }
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many vertices does this shape have?"
            show: { drawn: shape, kind: pentagon, colour: yellow }
            options: ["5", "4", "6"]
            answer: "5"
          - id: l1-c2
            type: image_multiple_choice
            text: "Which shape has 3 vertices?"
            options:
              - { drawn: shape, kind: square, colour: red, size: 120 }
              - { drawn: shape, kind: triangle, colour: blue, size: 70 }
              - { drawn: shape, kind: octagon, colour: red, size: 120 }
            answer: triangle
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "A square has 3 sides."
            say: "Is it true? A square has three sides."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "How many sides does this shape have?"
            show: { drawn: shape, kind: octagon, colour: green }
            options: ["8", "6", "10"]
            answer: "8"
          - id: l1-c5
            type: true_false
            text: "A triangle has 3 vertices."
            say: "Is it true? A triangle has three vertices."
            answer: true
          - id: l1-c6
            type: image_multiple_choice
            text: "Which shape has 5 sides?"
            options:
              - { drawn: shape, kind: hexagon, colour: blue, size: 120 }
              - { drawn: shape, kind: pentagon, colour: green, size: 70 }
              - { drawn: shape, kind: square, colour: blue, size: 120 }
            answer: pentagon
            option_audio: false

  - n: 2
    title: { de: "Quadrat und Rechteck", en: "Squares and rectangles" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many vertices does this shape have?"
            show: { drawn: shape, kind: triangle, colour: blue }
            options: ["3", "4"]
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "A hexagon has 6 sides."
            say: "Is it true? A hexagon has six sides."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Rectangle: 4 square corners"
            say: "A rectangle has four sides and four vertices. Every corner is a square corner, like the corner of a page in your book. A square corner is also called a right angle. The sides opposite each other are the same length."
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "Square: 4 square corners and 4 sides the same length"
            say: "A square has four square corners too. But in a square, all four sides are the same length."
            show: { drawn: shape, kind: square, colour: red }
          - text: "Every square is also a rectangle."
            say: "A rectangle needs four sides and four square corners. A square has both. So every square is also a rectangle. But not every rectangle is a square, because its sides are not all the same length."
            show: { drawn: shape, row: [square, rectangle], colours: [red, blue] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which shape has all four sides the same length?"
                options:
                  - { drawn: shape, kind: rectangle, colour: green }
                  - { drawn: shape, kind: square, colour: green }
                answer: square
                option_audio: false
                hints:
                  - "Compare the top side with the side going down."
                  - "The rectangle has two long sides and two short sides."
                  - "The square."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "A square is also a rectangle."
                say: "Is it true? A square is also a rectangle."
                answer: true
                hints:
                  - "What does a rectangle need? Four sides and four square corners."
                  - "Does a square have four sides and four square corners?"
                  - "Yes. Every square is also a rectangle."
              - id: l2-f3
                type: multiple_choice
                text: "Is this shape a square?"
                show: { drawn: shape, kind: rectangle, colour: orange }
                options: ["No, its sides are not all the same length.", "Yes, it has 4 vertices.", "No, it has no square corners."]
                answer: "No, its sides are not all the same length."
                feedback:
                  "Yes, it has 4 vertices.": "Every rectangle has 4 vertices. A square also needs all its sides to be the same length."
                hints:
                  - "A square needs 4 sides the same length."
                  - "Are the top side and the side going down the same length?"
                  - "No, its sides are not all the same length."
              - id: l2-f4
                type: multiple_choice
                text: "What does a square have that not every rectangle has?"
                options: ["4 sides the same length", "4 vertices", "4 square corners"]
                answer: "4 sides the same length"
                hints:
                  - "Both shapes have 4 vertices, and all of them are square corners."
                  - "What is different about a long, thin rectangle?"
                  - "4 sides the same length."
              - id: l2-f5
                type: multiple_choice
                text: "Amir says: It is a rectangle.\nRuby says: It is a square.\nWho is right?"
                show: { drawn: shape, kind: square, colour: purple }
                options: ["both", "only Amir", "only Ruby"]
                answer: "both"
                feedback:
                  "only Ruby": "Ruby is right, it is a square. But every square is also a rectangle, so Amir is right too."
                hints:
                  - "Is the shape a square? Is it also a rectangle?"
                  - "It has 4 sides the same length and 4 square corners."
                  - "Both of them are right."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many sides of this square are the same length?"
                show: { drawn: shape, kind: square, colour: yellow }
                options: ["all 4", "only 2", "none"]
                answer: "all 4"
                hints: ["In a square, no side is longer than the others."]
              - id: l2-s2
                type: true_false
                text: "Every rectangle is a square."
                say: "Is it true? Every rectangle is a square."
                answer: false
                hints: ["Think of a rectangle with two long sides and two short sides."]
              - id: l2-s3
                type: multiple_choice
                text: "Isla says: It is a rectangle.\nNoah says: It is a square.\nWho is right?"
                show: { drawn: shape, kind: rectangle, colour: green }
                options: ["only Isla", "only Noah", "both"]
                answer: "only Isla"
                hints: ["Are all the sides the same length?"]
              - id: l2-s4
                type: multiple_choice
                text: "A shape has 4 square corners and 4 sides the same length. What is it?"
                options: ["a square", "a pentagon", "a triangle"]
                answer: "a square"
                hints: ["Which shape has 4 sides that are all the same length?"]
              - id: l2-s5
                type: image_multiple_choice
                text: "Which shape is a rectangle but not a square?"
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: rectangle, colour: blue }
                  - { drawn: shape, kind: triangle, colour: blue }
                answer: rectangle
                option_audio: false
                hints: ["It has 4 square corners, but two long sides and two short sides."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which one is the square?"
                options:
                  - { drawn: shape, kind: rectangle, colour: orange, size: 120 }
                  - { drawn: shape, kind: square, colour: pink, size: 70 }
                  - { drawn: shape, kind: hexagon, colour: orange, size: 120 }
                answer: square
                option_audio: false
              - id: l2-n2
                type: true_false
                text: "A rectangle has 4 square corners."
                say: "Is it true? A rectangle has four square corners."
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Priya says: It is a square.\nJack says: It is a rectangle.\nWho is right?"
                show: { drawn: shape, kind: square, colour: green }
                options: ["both", "only Priya", "only Jack"]
                answer: "both"
              - id: l2-n4
                type: multiple_choice
                text: "What do a square and a rectangle both have?"
                options: ["4 square corners", "4 sides the same length", "3 sides"]
                answer: "4 square corners"
              - id: l2-n5
                type: sorting
                text: "Does the shape have 4 sides?"
                bins:
                  - { id: four, show: { text: "4 sides" }, say: "four sides" }
                  - { id: other, show: { text: "not 4 sides" }, say: "not four sides" }
                options:
                  - { text: "square", bin: four }
                  - { text: "triangle", bin: other }
                  - { text: "rectangle", bin: four }
                  - { text: "hexagon", bin: other }
                  - { text: "circle", bin: other }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: count
            type: fill_in_blank
            text: "Count the sides and the vertices."
            show: { drawn: shape, kind: octagon, colour: orange }
            frame: "_ sides and _ vertices"
            options: ["6", "7", "8"]
            answer: ["8", "8"]
          - id: l2-c2
            part: square-is-rect
            type: true_false
            text: "Tom says: A square cannot be a rectangle. Is Tom right?"
            answer: false
          - id: l2-c3
            part: square-rect
            type: image_multiple_choice
            text: "Which shape has 4 square corners, but not 4 sides the same length?"
            options:
              - { drawn: shape, kind: square, colour: purple }
              - { drawn: shape, kind: pentagon, colour: purple }
              - { drawn: shape, kind: rectangle, colour: purple }
            answer: rectangle
            option_audio: false
          - id: l2-c4
            part: square-is-rect
            type: multiple_choice
            text: "Look at the shape. Which sentence is true?"
            show: { drawn: shape, kind: square, colour: blue }
            options: ["It is a square and also a rectangle.", "It is a square, but not a rectangle.", "It is a rectangle, but not a square."]
            answer: "It is a square and also a rectangle."
          - id: l2-c5
            part: sort
            type: sorting
            text: "Sort the shapes by their vertices."
            bins:
              - { id: three, show: { text: "3 vertices" }, say: "three vertices" }
              - { id: four, show: { text: "4 vertices" }, say: "four vertices" }
              - { id: five, show: { text: "5 vertices" }, say: "five vertices" }
            options:
              - { text: "rectangle", bin: four }
              - { text: "pentagon", bin: five }
              - { text: "triangle", bin: three }
              - { text: "square", bin: four }
          - id: l2-c6
            part: count
            type: multiple_choice
            text: "How many vertices does this shape have?"
            show: { drawn: shape, kind: rectangle, colour: pink }
            options: ["4", "2", "6"]
            answer: "4"
          - id: l2-c7
            part: count
            type: text_input
            text: "Mia draws 2 pentagons. How many sides does she draw altogether?"
            say: "Mia draws two pentagons. How many sides does she draw altogether?"
            answer: "10"
          - id: l2-c8
            part: count
            type: true_false
            text: "An octagon has 8 vertices."
            say: "Is it true? An octagon has eight vertices."
            answer: true
          - id: l2-c9
            part: count
            type: multiple_choice
            text: "A shape has 5 straight sides. What is it called?"
            options: ["pentagon", "hexagon", "octagon"]
            answer: "pentagon"
          - id: l2-c10
            part: sort
            type: image_multiple_choice
            text: "Which shape has 6 vertices?"
            options:
              - { drawn: shape, kind: pentagon, colour: green, size: 120 }
              - { drawn: shape, kind: hexagon, colour: yellow, size: 70 }
              - { drawn: shape, kind: octagon, colour: green, size: 120 }
            answer: hexagon
            option_audio: false
          - id: l2-c11
            part: sort
            type: sorting
            text: "Sort the shapes: 4 sides or more than 4 sides?"
            bins:
              - { id: four, show: { text: "4 sides" }, say: "four sides" }
              - { id: more, show: { text: "more than 4 sides" }, say: "more than four sides" }
            options:
              - { text: "octagon", bin: more }
              - { text: "rectangle", bin: four }
              - { text: "hexagon", bin: more }
              - { text: "square", bin: four }
              - { text: "pentagon", bin: more }
          - id: l2-c12
            part: sort
            type: matching
            text: "Match each shape to its vertices."
            say: "Match each shape to its number of vertices."
            pairs:
              - { left: { drawn: shape, kind: pentagon, colour: yellow, size: 70 }, right: { text: "5 vertices" } }
              - { left: { drawn: shape, kind: square, colour: red, size: 120 }, right: { text: "4 vertices" } }
              - { left: { drawn: shape, kind: octagon, colour: blue }, right: { text: "8 vertices" } }
            option_audio: false
          - id: l2-c13
            part: sort
            type: image_multiple_choice
            text: "Which shape has more than 4 sides?"
            options:
              - { drawn: shape, kind: square, colour: red, size: 120 }
              - { drawn: shape, kind: triangle, colour: red, size: 120 }
              - { drawn: shape, kind: pentagon, colour: yellow, size: 70 }
            answer: pentagon
            option_audio: false
          - id: l2-c14
            part: square-rect
            type: multiple_choice
            text: "A shape has 4 square corners. 2 of its sides are long and 2 are short. What is it?"
            options: ["a rectangle", "a square", "a triangle"]
            answer: "a rectangle"
          - id: l2-c15
            part: square-rect
            type: true_false
            text: "All four sides of a rectangle are always the same length."
            say: "Is it true? All four sides of a rectangle are always the same length."
            answer: false
          - id: l2-c16
            part: square-rect
            type: multiple_choice
            text: "Is this shape a square?"
            show: { drawn: shape, kind: square, colour: orange }
            options: ["Yes, it has 4 square corners and 4 sides the same length.", "No, its sides are not all the same length.", "No, it has no square corners."]
            answer: "Yes, it has 4 square corners and 4 sides the same length."
          - id: l2-c17
            part: square-rect
            type: multiple_choice
            text: "How many sides of this rectangle are long?"
            show: { drawn: shape, kind: rectangle, colour: purple }
            options: ["2", "4", "none"]
            answer: "2"
          - id: l2-c18
            part: square-is-rect
            type: multiple_choice
            text: "Why is every square also a rectangle?"
            options: ["It has 4 sides and 4 square corners.", "It looks like a rectangle.", "It is smaller than a rectangle."]
            answer: "It has 4 sides and 4 square corners."
          - id: l2-c19
            part: square-is-rect
            type: true_false
            text: "Ella says: This shape is a rectangle. Is Ella right?"
            say: "Ella says this shape is a rectangle. Is Ella right?"
            show: { drawn: shape, kind: square, colour: green }
            answer: true
          - id: l2-c20
            part: square-is-rect
            type: multiple_choice
