# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.sort-classify
skill: math.data.sort-classify
curriculum: en-GB
language: en
title:
  de: Sortieren und zählen
  en: Sorting and counting
summary: >
  Lesson 1 sorts pictures by one property (animal or food, can fly or
  cannot fly, has wheels or not) and finds the odd one out; lesson 2
  counts how many are in each group, records the counts in a simple
  table, puts the groups in order by quantity, totals and compares them,
  and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Daten, en: Data }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-100.order-compare]
  vocabulary: { en: [sort, group, property, belongs, odd one out, how many, most, fewest, more, fewer, total, table] }
  forms: [picture, text, audio, drawn]
  drawn: [colour-swatch, table]
  facets: []
  misconceptions:
    - id: switches-property
      what: Switches the property halfway through sorting (sorts some by colour and some by kind)
      addressed: lesson 1 Learn names one property for every sort; each sorting task names its property in the say, and l1-f3 hints say to look only at the colour
    - id: bigger-group-looks-bigger
      what: Says the group that takes more space has more, without counting
      addressed: lesson 2 Learn shows three balls spread wide and says to count before comparing; l2-f2 (with feedback), l2-s2 and l2-n2 set a spread-out group with fewer against a row with more
    - id: more-than-is-total
      what: Adds the two groups when asked how many more one has
      addressed: lesson 2 Learn works out how many more by counting on; the total is an option in l2-f5 (with feedback), l2-s5 and l2-n5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was gehört zusammen?", en: "What belongs together?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many apples are there?"
            say: "Count the apples. How many are there?"
            show: { object: apple, count: 6 }
            options: ["6", "5", "7"]
            answer: "6"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Which one is an animal?"
            say: "Which picture shows an animal?"
            options: [{ object: dog }, { object: apple }, { object: ball }]
            answer: dog
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "animal · food"
            say: "To sort, we put things that belong together into a group. We sort by one question at a time. Is it an animal, or is it food? The dog and the cat are animals. The apple and the bread are food."
          - text: "red · blue"
            say: "We can sort by colour instead. Then a red ball and a red car go together, even though they are very different things. Look only at the colour."
          - text: "can fly · cannot fly"
            say: "We can sort animals by what they can do. A bird and a bee can fly. A dog and a cow cannot fly."
          - text: "Which is the odd one out?"
            say: "Dog, cat, mouse and banana. Three are animals. The banana does not belong, so it is the odd one out."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Animal or food?"
                say: "Sort them. Is it an animal, or is it food?"
                bins:
                  - { id: animal, show: { text: "animal" }, say: "animal" }
                  - { id: food, show: { text: "food" }, say: "food" }
                options:
                  - { object: cat, bin: animal }
                  - { object: banana, bin: food }
                  - { object: cow, bin: animal }
                  - { object: bread, bin: food }
                hints:
                  - "Is it alive, or can you eat it?"
                  - "The cat and the cow are animals."
                  - "Animal: cat, cow. Food: banana, bread."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Which is the odd one out?"
                say: "Three belong together. Which is the odd one out?"
                options: [{ object: pig }, { object: duck }, { object: goat }, { object: car }]
                answer: car
                hints:
                  - "Which three belong together?"
                  - "The pig, the duck and the goat are animals."
                  - "The car."
              - id: l1-f3
                type: sorting
                text: "Red or blue?"
                say: "Sort them by colour. Red or blue?"
                bins:
                  - { id: red, show: { drawn: colour-swatch, colour: red }, say: "red" }
                  - { id: blue, show: { drawn: colour-swatch, colour: blue }, say: "blue" }
                options:
                  - { object: ball, colour: red, bin: red }
                  - { object: car, colour: blue, bin: blue }
                  - { object: balloon, colour: red, bin: red }
                  - { object: t-shirt, colour: blue, bin: blue }
                hints:
                  - "Look only at the colour, not at what it is."
                  - "The ball and the balloon are red."
                  - "Red: ball, balloon. Blue: car, T-shirt."
              - id: l1-f4
                type: sorting
                text: "Can fly or cannot fly?"
                say: "Sort the animals. Can it fly, or can it not fly?"
                bins:
                  - { id: fly, show: { text: "can fly" }, say: "can fly" }
                  - { id: nofly, show: { text: "cannot fly" }, say: "cannot fly" }
                options:
                  - { object: bird, bin: fly }
                  - { object: dog, bin: nofly }
                  - { object: butterfly, bin: fly }
                  - { object: snail, bin: nofly }
                hints:
                  - "Which animals have wings?"
                  - "The bird and the butterfly have wings."
                  - "Can fly: bird, butterfly. Cannot fly: dog, snail."
              - id: l1-f5
                type: true_false
                text: "Pencil, ruler, rubber. Do the scissors belong in this group?"
                say: "Pencil, ruler, rubber. These are things for school. Do the scissors belong in this group too?"
                show: { object: scissors }
                answer: true
                hints:
                  - "What do you use at school?"
                  - "You cut paper with scissors in class."
                  - "Yes, they belong."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Has wheels or no wheels?"
                say: "Sort them. Does it have wheels, or no wheels?"
                bins:
                  - { id: wheels, show: { text: "has wheels" }, say: "has wheels" }
                  - { id: nowheels, show: { text: "no wheels" }, say: "no wheels" }
                options:
                  - { object: bus, bin: wheels }
                  - { object: boat, bin: nowheels }
                  - { object: bike, bin: wheels }
                  - { object: kite, bin: nowheels }
                hints: ["Look for wheels on each one."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which is the odd one out?"
                say: "Three belong together. Which is the odd one out?"
                options: [{ object: apple }, { object: strawberry }, { object: banana }, { object: shoe }]
                answer: shoe
                hints: ["You can eat three of them."]
              - id: l1-s3
                type: sorting
                text: "Yellow or green?"
                say: "Sort them by colour. Yellow or green?"
                bins:
                  - { id: yellow, show: { drawn: colour-swatch, colour: yellow }, say: "yellow" }
                  - { id: green, show: { drawn: colour-swatch, colour: green }, say: "green" }
                options:
                  - { object: ball, colour: yellow, bin: yellow }
                  - { object: leaf, colour: green, bin: green }
                  - { object: balloon, colour: green, bin: green }
                  - { object: car, colour: yellow, bin: yellow }
                hints: ["Look only at the colour."]
              - id: l1-s4
                type: true_false
                text: "Dog, cat, bird. Does the fish belong with the animals?"
                say: "Dog, cat, bird. Does the fish belong with the animals too?"
                show: { object: fish }
                answer: true
                hints: ["A fish lives in water. Is it an animal?"]
              - id: l1-s5
                type: sorting
                text: "Lives in water or on land?"
                say: "Sort the animals. Does it live in water, or on land?"
                bins:
                  - { id: water, show: { text: "in water" }, say: "in water" }
                  - { id: land, show: { text: "on land" }, say: "on land" }
                options:
                  - { object: whale, bin: water }
                  - { object: rabbit, bin: land }
                  - { object: octopus, bin: water }
                  - { object: cow, bin: land }
                hints: ["Where does each animal live?"]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Animal or food?"
                say: "Sort them. Is it an animal, or is it food?"
                bins:
                  - { id: animal, show: { text: "animal" }, say: "animal" }
                  - { id: food, show: { text: "food" }, say: "food" }
                options:
                  - { object: frog, bin: animal }
                  - { object: cheese, bin: food }
                  - { object: carrot, bin: food }
                  - { object: snail, bin: animal }
                  - { object: cake, bin: food }
              - id: l1-n2
                type: image_multiple_choice
                text: "Which is the odd one out?"
                say: "Three belong together. Which is the odd one out?"
                options: [{ object: pencil }, { object: ruler }, { object: rubber }, { object: banana }]
                answer: banana
              - id: l1-n3
                type: sorting
                text: "Red or blue?"
                say: "Sort them by colour. Red or blue?"
                bins:
                  - { id: red, show: { drawn: colour-swatch, colour: red }, say: "red" }
                  - { id: blue, show: { drawn: colour-swatch, colour: blue }, say: "blue" }
                options:
                  - { object: t-shirt, colour: blue, bin: blue }
                  - { object: ball, colour: red, bin: red }
                  - { object: skirt, colour: red, bin: red }
                  - { object: balloon, colour: blue, bin: blue }
                  - { object: car, colour: red, bin: red }
              - id: l1-n4
                type: true_false
                text: "Mouse, lion, duck. Does the cake belong with the animals?"
                say: "Mouse, lion, duck. Does the cake belong with the animals too?"
                show: { object: cake }
                answer: false
              - id: l1-n5
                type: sorting
                text: "Can fly or cannot fly?"
                say: "Sort the animals. Can it fly, or can it not fly?"
                bins:
                  - { id: fly, show: { text: "can fly" }, say: "can fly" }
                  - { id: nofly, show: { text: "cannot fly" }, say: "cannot fly" }
                options:
                  - { object: bee, bin: fly }
                  - { object: pig, bin: nofly }
                  - { object: fly, bin: fly }
                  - { object: hedgehog, bin: nofly }
                  - { object: elephant, bin: nofly }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: sorting
            text: "Vehicle or clothes?"
            say: "Sort them. Is it a vehicle, or something to wear?"
            bins:
              - { id: vehicle, show: { text: "vehicle" }, say: "vehicle" }
              - { id: clothes, show: { text: "clothes" }, say: "clothes" }
            options:
              - { object: boat, bin: vehicle }
              - { object: dress, bin: clothes }
              - { object: van, bin: vehicle }
              - { object: jacket, bin: clothes }
          - id: l1-c2
            type: image_multiple_choice
            text: "Which is the odd one out?"
            say: "Three belong together. Which is the odd one out?"
            options: [{ object: elephant }, { object: giraffe }, { object: zebra }, { object: pizza }]
            answer: pizza
          - id: l1-c3
            type: true_false
            text: "Bread, cheese, apple. Does the carrot belong with the food?"
            say: "Bread, cheese, apple. Does the carrot belong with the food too?"
            show: { object: carrot }
            answer: true

  - n: 2
    title: { de: "Wie viele in jeder Gruppe?", en: "How many in each group?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Which is the odd one out?"
            say: "Dog, cat, banana. Which is the odd one out?"
            options: [{ object: dog }, { object: cat }, { object: banana }]
            answer: banana
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Bus, bike, car. Does the boat belong with the things that have wheels?"
            say: "Bus, bike, car. Does the boat belong with the things that have wheels?"
            show: { object: boat }
            answer: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Count each group."
            say: "After sorting, count each group. Here are seven apples. In the other group there are four bananas."
            show: { object: apple, count: 7 }
          - text: "Count first, then compare."
            say: "These three balls are spread out wide. The group looks big, but there are only three. A group can look big and still have fewer. Always count."
            show: { object: ball, count: 3, layout: scattered }
          - text: "Fruit we sorted"
            say: "We can write the counts in a table. Apples: seven. Bananas: four. Pears: nine. The most are pears, then apples. The fewest are bananas."
            show: { drawn: table, rows: [["Fruit", "How many"], ["apples", "7"], ["bananas", "4"], ["pears", "9"]] }
          - text: "7 + 4 = 11 · 4, 5, 6, 7: 3 more"
            say: "Apples and bananas in total: seven add four is eleven. How many more apples than bananas? Count on from four to seven: five, six, seven. That is three more."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many balls are in the group?"
                say: "Amira sorted her toys. How many balls are in this group?"
                show: { object: ball, count: 9, colour: red }
                options: ["9", "8", "10"]
                answer: "9"
                option_audio: false
                hints:
                  - "Point to each ball and count it once."
                  - "One, two, three, four, five, and keep going."
                  - "9."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which group has more apples?"
                say: "Tom put the apples into two groups. Which group has more? Count carefully."
                options:
                  - { object: apple, count: 4, layout: scattered }
                  - { object: apple, count: 6, layout: row }
                answer: "6"
                feedback:
                  "4": "These apples are spread out, but there are only four. Count both groups."
                hints:
                  - "Do not be tricked by the space. Count both groups."
                  - "One group has four, the other has six."
                  - "Six is more than four."
              - id: l2-f3
                type: multiple_choice
                text: "Which pet do most children have?"
                say: "Class 2 sorted their pets. Which pet do most children have?"
                show: { drawn: table, rows: [["Pet", "Children"], ["cat", "8"], ["dog", "11"], ["fish", "5"]] }
                options: ["dog", "cat", "fish"]
                answer: "dog"
                hints:
                  - "Find the biggest number in the table."
                  - "Eight, eleven, five. Which is the greatest?"
                  - "Dog: eleven children."
              - id: l2-f4
                type: ordering
                text: "Put the pets in order, most first."
                say: "Put the pets in order. The pet most children have goes first."
                show: { drawn: table, rows: [["Pet", "Children"], ["cat", "8"], ["dog", "11"], ["fish", "5"]] }
                options: ["cat", "dog", "fish"]
                slot_count: 3
                answer: ["dog", "cat", "fish"]
                hints:
                  - "Start with the greatest number."
                  - "Eleven, then eight, then five."
                  - "Dog, cat, fish."
              - id: l2-f5
                type: multiple_choice
                text: "Cat 8, fish 5. How many more children have a cat than a fish?"
                say: "Eight children have a cat and five have a fish. How many more children have a cat than a fish?"
                options: ["3", "13", "5"]
                answer: "3"
                option_audio: false
                feedback:
                  "13": "Thirteen is the total of both groups. How many more means the difference: count on from five to eight."
                hints:
                  - "Count on from the smaller number."
                  - "Six, seven, eight."
                  - "3."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many cars are in the group?"
                say: "Ben sorted his cars. How many are in this group?"
                show: { object: car, count: 8, colour: blue }
                options: ["8", "7", "9"]
                answer: "8"
                option_audio: false
                hints: ["Point to each car and count it once."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which group has fewer birds?"
                say: "Birds sit in two groups in the garden. Which group has fewer? Count carefully."
                options:
                  - { object: bird, count: 5, layout: scattered }
                  - { object: bird, count: 7, layout: row }
                answer: "5"
                hints: ["Count both groups, even if one looks bigger."]
              - id: l2-s3
                type: ordering
                text: "Put the fruit in order, fewest first."
                say: "Class 2 sorted the fruit bowl. Put the fruit in order. The fewest go first."
                show: { drawn: table, rows: [["Fruit", "How many"], ["apples", "12"], ["bananas", "6"], ["oranges", "9"]] }
                options: ["apples", "bananas", "oranges"]
                slot_count: 3
                answer: ["bananas", "oranges", "apples"]
                hints: ["Fewest first: start with the smallest number."]
              - id: l2-s4
                type: true_false
                text: "There are 9 oranges and 6 bananas. There are more bananas."
                say: "There are nine oranges and six bananas. Is it true that there are more bananas?"
                answer: false
                hints: ["Nine or six: which is more?"]
              - id: l2-s5
                type: multiple_choice
                text: "Apples 12, bananas 6. How many more apples than bananas?"
                say: "There are twelve apples and six bananas. How many more apples are there than bananas?"
                options: ["6", "18", "12"]
                answer: "6"
                option_audio: false
                hints: ["Count on from six to twelve."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many leaves are in the group?"
                say: "Leo sorted the leaves he found. How many are in this group?"
                show: { object: leaf, count: 10, colour: green }
                options: ["10", "9", "11"]
                answer: "10"
                option_audio: false
              - id: l2-n2
                type: image_multiple_choice
                text: "Which group has more stars?"
                say: "Maya sorted stars into two groups. Which group has more?"
                options:
                  - { object: star, count: 5, layout: scattered }
                  - { object: star, count: 8, layout: row }
                answer: "8"
              - id: l2-n3
                type: multiple_choice
                text: "How do the fewest children get to school?"
                say: "Class 2 sorted how they get to school. How do the fewest children get to school?"
                show: { drawn: table, rows: [["How we get to school", "Children"], ["walk", "14"], ["car", "7"], ["bus", "9"]] }
                options: ["car", "walk", "bus"]
                answer: "car"
              - id: l2-n4
                type: multiple_choice
                text: "How many children are there in total?"
                say: "Look at the table again. How many children are there in total?"
                show: { drawn: table, rows: [["How we get to school", "Children"], ["walk", "14"], ["car", "7"], ["bus", "9"]] }
                options: ["30", "23", "14"]
                answer: "30"
                option_audio: false
                difficulty: stretch
              - id: l2-n5
                type: multiple_choice
                text: "Walk 14, bus 9. How many more children walk than come by bus?"
                say: "Fourteen children walk and nine come by bus. How many more children walk than come by bus?"
                options: ["5", "23", "4"]
                answer: "5"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: sorting
            text: "For school or a toy?"
            say: "Sort them. Do you use it at school, or is it a toy?"
            bins:
              - { id: school, show: { text: "for school" }, say: "for school" }
              - { id: toy, show: { text: "toy" }, say: "toy" }
            options:
              - { object: pencil, bin: school }
              - { object: kite, bin: toy }
              - { object: scissors, bin: school }
              - { object: yo-yo, bin: toy }
              - { object: teddy, bin: toy }
          - id: l2-c2
            type: multiple_choice
            text: "How many ducks are in the group?"
            say: "How many ducks are in this group?"
            show: { object: duck, count: 7 }
            options: ["7", "6", "8"]
            answer: "7"
            option_audio: false
          - id: l2-c3
            type: ordering
            text: "Put the colours in order, most first."
            say: "Class 2 sorted their crayons by colour. Put the colours in order. The most go first."
            show: { drawn: table, rows: [["Colour", "Crayons"], ["red", "10"], ["blue", "15"], ["green", "8"]] }
            options: ["red", "blue", "green"]
            slot_count: 3
            answer: ["blue", "red", "green"]
          - id: l2-c4
            type: multiple_choice
            text: "Red 10, green 8. How many red and green crayons in total?"
            say: "There are ten red crayons and eight green crayons. How many is that in total?"
            options: ["18", "2", "17"]
            answer: "18"
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "There are 15 blue crayons and 10 red ones. There are 5 more blue crayons."
            say: "There are fifteen blue crayons and ten red ones. Is it true that there are five more blue crayons?"
            answer: true
