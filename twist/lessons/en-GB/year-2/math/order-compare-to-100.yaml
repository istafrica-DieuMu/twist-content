# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.order-compare-to-100
skill: math.numbers-to-100.order-compare
curriculum: en-GB
language: en
title:
  de: Ordnen und vergleichen bis 100
  en: Comparing and ordering to 100
summary: >
  Year 2 compares numbers to 100 with <, > and =, looking at the tens
  first. Lesson 1 compares and orders; lesson 2 finds one more, one less,
  ten more and ten less, and the multiples of ten either side of a number,
  and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.number-line]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { en: [greater than, less than, equal to, more, fewer, one more, ten less, between] }
  forms: [drawn, text, audio]
  drawn: [base-ten, number-line]
  facets: [operation-signs]
  parts:
    - { id: compare, what: { de: "Zahlen bis 100 mit <, > und = vergleichen", en: "comparing numbers to 100 with <, > and =" } }
    - { id: order, what: { de: Zahlen bis 100 ordnen, en: ordering numbers to 100 } }
    - { id: more-less, what: { de: eins mehr und weniger und zehn mehr und weniger finden, en: finding one more or less and ten more or less } }
    - { id: tens-either-side, what: { de: die Nachbarzehner finden, en: finding the multiples of ten either side of a number } }
  misconceptions:
    - id: ones-first
      what: Compares the ones digit first (thinks 29 > 41 because 9 > 1)
      addressed: Learn compares base ten blocks, tens first; feedback on 29 > 41 names the tens
    - id: sign-direction
      what: Writes the sign the wrong way round
      addressed: Learn says the open side faces the greater number; hints read each sign as greater than or less than
    - id: ten-more-ones
      what: Changes the ones digit for ten more (34 and ten more as 35 or 44 confused)
      addressed: lesson 2 Learn shows ten more as one more ten stick; the ones stay the same
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner zuerst vergleichen, en: Compare the tens first }
    goal:
      de: "Vergleiche und ordne Zahlen bis 100 und schau zuerst auf die Zehner, so wie 41 ist größer als 29."
      en: "Compare and order numbers to 100 by looking at the tens first, like 41 is greater than 29."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is greater, 7 or 4?"
            options: ["7", "4"]
            answer: "7"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many tens are in 63?"
            options: ["3", "6", "63"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "41 or 29?"
            say: "Which number do you think is greater, forty-one or twenty-nine? Twenty-nine has a nine in it, and nine is big. Have a guess. Here is forty-one: four tens and one one."
            show: { drawn: base-ten, tens: 4, ones: 1 }
          - text: "41 > 29"
            say: "Forty-one is greater! Look at the tens first. Here is twenty-nine: only two tens. Four tens are more than two tens, so forty-one is greater, even though nine ones is more than one."
            show: { drawn: base-ten, tens: 2, ones: 9 }
          - text: "56 < 58"
            say: "If the tens are the same, look at the ones. Fifty-six and fifty-eight both have five tens. Six is less than eight, so fifty-six is less than fifty-eight. The open side of the sign faces the greater number."
          - text: "Did you know? Centipede means 100 feet, but no centipede has exactly 100 legs."
            say: "Did you know? The name centipede means a hundred feet, but no centipede has exactly a hundred legs. Some have fewer than a hundred, and some have more!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Oak class collects 32 conkers. Ash class collects 23. Which number is greater, 32 or 23?"
                options: ["32", "23"]
                answer: "32"
                option_audio: false
                hints:
                  - "Look at the tens first."
                  - "32 has 3 tens, 23 has 2 tens."
                  - "32 is greater."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "29 _ 41"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "9 ones is a lot, but 41 has more tens. Look at the tens first."
                hints:
                  - "Which has more tens?"
                  - "41 has 4 tens, 29 has 2. So 29 is less."
                  - "29 is less than 41: 29 < 41."
              - id: l1-f3
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "67 _ 64"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "The tens are the same. Look at the ones."
                  - "7 is more than 4."
                  - "67 is greater than 64: 67 > 64."
              - id: l1-f4
                type: ordering
                text: "Put the numbers in order, smallest first."
                options: ["45", "18", "81", "54"]
                slot_count: 4
                answer: ["18", "45", "54", "81"]
                hints:
                  - "Which number has the fewest tens?"
                  - "18 has only one ten. Then 45."
                  - "18, 45, 54, 81."
              - id: l1-f5
                type: true_false
                text: "Is it true? 70 > 69"
                answer: true
                hints:
                  - "Compare the tens."
                  - "70 has 7 tens, 69 has 6 tens."
                  - "Yes, 70 is greater."
              - id: l1-f6
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "30 + 5 _ 35"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints:
                  - "Work out 30 + 5 first."
                  - "30 + 5 is 35."
                  - "35 is equal to 35: use =."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "38 _ 52"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Tens first."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "83 _ 38"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Which has more tens?"]
              - id: l1-s3
                type: ordering
                text: "Put the numbers in order, greatest first."
                options: ["26", "62", "60", "29"]
                slot_count: 4
                answer: ["62", "60", "29", "26"]
                hints: ["When the tens are the same, the ones decide."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 47 < 44"
                answer: false
                hints: ["Same tens. Which has more ones?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ > 85"
                options: ["58", "80", "91"]
                answer: ["91"]
                hints: ["More tens, or the same tens and more ones."]
              - id: l1-s6
                type: multiple_choice
                text: "Which is the smallest?"
                options: ["71", "17", "70"]
                answer: "17"
                hints: ["Which has the fewest tens?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "51 _ 59"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n2
                type: ordering
                text: "Put the numbers in order, smallest first."
                options: ["99", "9", "90", "19"]
                slot_count: 4
                answer: ["9", "19", "90", "99"]
              - id: l1-n3
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "40 + 7 _ 74"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Is it true? 100 > 99"
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ < 42"
                options: ["24", "46", "52"]
                answer: ["24"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "64 _ 46"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c2
            type: ordering
            text: "Put the numbers in order, smallest first."
            options: ["57", "75", "50", "70"]
            slot_count: 4
            answer: ["50", "57", "70", "75"]
          - id: l1-c3
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "33 _ 36"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Is it true? 61 > 16"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Which is the smallest?"
            options: ["42", "24", "40"]
            answer: "24"
          - id: l1-c6
            type: fill_in_blank
            text: "Which number makes it true?"
            frame: "_ > 67"
            options: ["76", "60", "59"]
            answer: ["76"]

  - n: 2
    title: { de: "Eins mehr, zehn mehr", en: "One more, ten more" }
    goal:
      de: "Finde eins mehr, eins weniger, zehn mehr und zehn weniger, so wie zehn mehr als 34 ist 44."
      en: "Find one more, one less, ten more and ten less than a number, like ten more than 34 is 44."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "48 _ 84"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is greater, 60 or 56?"
            options: ["60", "56"]
            answer: "60"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ten more than 34?"
            say: "Here is thirty-four. What do you think ten more than thirty-four is? Have a guess."
            show: { drawn: base-ten, tens: 3, ones: 4 }
          - text: "34 → 35, 34 → 44"
            say: "It's forty-four. One more than thirty-four is thirty-five: one more single cube. Ten more than thirty-four is forty-four: one more ten stick. The ones stay the same."
            show: { drawn: base-ten, tens: 4, ones: 4 }
          - text: "34 → 33, 34 → 24"
            say: "One less is thirty-three. Ten less is twenty-four: take away one ten stick."
            show: { drawn: base-ten, tens: 2, ones: 4 }
          - text: "30 | 34 | 40"
            say: "Thirty-four is between thirty and forty. Those are the multiples of ten on either side. Thirty is nearer."
            show: { drawn: number-line, from: 30, to: 40, labels: ends, mark: 34 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is ten more than 52?"
                options: ["53", "62", "42"]
                answer: "62"
                feedback:
                  "53": "That is one more. Ten more adds one ten stick."
                hints:
                  - "Ten more: one more ten."
                  - "5 tens become 6 tens. The ones stay 2."
                  - "Ten more than 52 is 62."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is one less than 70?"
                options: ["69", "60", "71"]
                answer: "69"
                hints:
                  - "One less: count back one."
                  - "Before 70 comes 69."
                  - "One less than 70 is 69."
              - id: l2-f3
                type: fill_in_blank
                text: "Which multiples of ten are either side?"
                say: "Which multiples of ten are either side of twenty-seven?"
                show: { drawn: number-line, from: 20, to: 30, labels: ends, mark: 27 }
                frame: "_, 27, _"
                options: ["20", "26", "28", "30"]
                answer: ["20", "30"]
                feedback:
                  "26": "26 is one less. We want multiples of ten."
                hints:
                  - "Multiples of ten end in 0."
                  - "Which ten comes before 27, and which after?"
                  - "20 and 30."
              - id: l2-f4
                type: multiple_choice
                text: "What is ten less than 85?"
                options: ["84", "75", "95"]
                answer: "75"
                hints:
                  - "Ten less: take away one ten."
                  - "8 tens become 7 tens. The ones stay 5."
                  - "Ten less than 85 is 75."
              - id: l2-f5
                type: true_false
                text: "Is it true? Ten more than 90 is 100."
                answer: true
                hints:
                  - "9 tens and one more ten."
                  - "Ten tens make a hundred."
                  - "Yes."
              - id: l2-f6
                type: multiple_choice
                text: "Which multiple of ten is nearer to 52?"
                show: { drawn: number-line, from: 50, to: 60, labels: ends, mark: 52 }
                options: ["50", "60"]
                answer: "50"
                hints:
                  - "Count the steps to each ten."
                  - "To 50 is 2 steps, to 60 is 8."
                  - "50 is nearer."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Mia has 38p in her piggy bank. Gran gives her 10p. How much does she have now?"
                options: ["39p", "48p", "28p", "a million pounds"]
                answer: "48p"
                feedback:
                  "a million pounds": "Lucky Mia, but no! 10p is one more ten."
                hints: ["10p is one more ten."]
              - id: l2-s2
                type: multiple_choice
                text: "What is one more than 49?"
                options: ["50", "59", "48"]
                answer: "50"
                hints: ["After 49 comes a multiple of ten."]
              - id: l2-s3
                type: fill_in_blank
                text: "Which multiples of ten are either side?"
                say: "Which multiples of ten are either side of fifty-six?"
                frame: "_, 56, _"
                options: ["50", "55", "57", "60"]
                answer: ["50", "60"]
                hints: ["They end in 0."]
              - id: l2-s4
                type: multiple_choice
                text: "What is ten less than 21?"
                options: ["20", "11", "31"]
                answer: "11"
                hints: ["Take away one ten."]
              - id: l2-s5
                type: true_false
                text: "Is it true? One less than 60 is 50."
                answer: false
                hints: ["One less, not ten less."]
              - id: l2-s6
                type: multiple_choice
                text: "Which multiple of ten is nearer to 78?"
                options: ["70", "80"]
                answer: "80"
                hints: ["Count the steps."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What is ten more than 66?"
                options: ["67", "76", "56"]
                answer: "76"
              - id: l2-n2
                type: multiple_choice
                text: "What is one less than 40?"
                options: ["39", "30", "41"]
                answer: "39"
              - id: l2-n3
                type: fill_in_blank
                text: "Which multiples of ten are either side?"
                say: "Which multiples of ten are either side of ninety-two?"
                frame: "_, 92, _"
                options: ["80", "90", "91", "100"]
                answer: ["90", "100"]
              - id: l2-n4
                type: multiple_choice
                text: "What is ten less than 14?"
                options: ["13", "4", "24"]
                answer: "4"
              - id: l2-n5
                type: multiple_choice
                text: "Which multiple of ten is nearer to 33?"
                options: ["30", "40"]
                answer: "30"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: compare
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "59 _ 61"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c2
            part: order
            type: ordering
            text: "Put the numbers in order, greatest first."
            options: ["34", "43", "40", "30"]
            slot_count: 4
            answer: ["43", "40", "34", "30"]
          - id: l2-c3
            part: more-less
            type: multiple_choice
            text: "What is ten more than 47?"
            options: ["48", "57", "37"]
            answer: "57"
          - id: l2-c4
            part: tens-either-side
            type: fill_in_blank
            text: "Which multiples of ten are either side?"
            say: "Which multiples of ten are either side of sixty-six?"
            frame: "_, 66, _"
            options: ["50", "60", "65", "70"]
            answer: ["60", "70"]
          - id: l2-c5
            part: more-less
            type: multiple_choice
            text: "What is one less than 80?"
            options: ["79", "70", "81"]
            answer: "79"
          - id: l2-c6
            part: compare
            type: multiple_choice
            text: "Which number is greater than 58?"
            options: ["49", "85", "55"]
            answer: "85"
          - id: l2-c7
            part: compare
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "26 _ 20 + 9"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c8
            part: compare
            type: true_false
            text: "Is it true? 39 > 93"
            answer: false
          - id: l2-c9
            part: compare
            type: multiple_choice
            text: "Which is true?"
            options: ["45 < 54", "45 > 54", "45 = 54"]
            answer: "45 < 54"
          - id: l2-c10
            part: order
            type: ordering
            text: "Put the numbers in order, smallest first."
            options: ["63", "36", "33", "66"]
            slot_count: 4
            answer: ["33", "36", "63", "66"]
          - id: l2-c11
            part: order
            type: ordering
            text: "Put the numbers in order, greatest first."
            options: ["81", "18", "88", "11"]
            slot_count: 4
            answer: ["88", "81", "18", "11"]
          - id: l2-c12
            part: order
            type: multiple_choice
            text: "Which number comes between 47 and 52?"
            options: ["45", "50", "54"]
            answer: "50"
          - id: l2-c13
            part: order
            type: multiple_choice
            text: "Which is the greatest?"
            options: ["69", "96", "90"]
            answer: "96"
          - id: l2-c14
            part: more-less
            type: multiple_choice
            text: "What is ten less than 63?"
            options: ["62", "53", "73"]
            answer: "53"
          - id: l2-c15
            part: more-less
            type: text_input
            text: "What is one more than 89?"
            answer: "90"
          - id: l2-c16
            part: more-less
            type: true_false
            text: "Is it true? Ten more than 45 is 46."
            answer: false
          - id: l2-c17
            part: tens-either-side
            type: fill_in_blank
            text: "Which multiples of ten are either side?"
            say: "Which multiples of ten are either side of forty-three?"
            frame: "_, 43, _"
            options: ["30", "40", "44", "50"]
            answer: ["40", "50"]
          - id: l2-c18
            part: tens-either-side
            type: multiple_choice
            text: "Which multiple of ten is nearer to 87?"
            show: { drawn: number-line, from: 80, to: 90, labels: ends, mark: 87 }
            options: ["80", "90"]
            answer: "90"
          - id: l2-c19
            part: tens-either-side
            type: fill_in_blank
            text: "Which multiples of ten are either side?"
            say: "Which multiples of ten are either side of eighteen?"
            frame: "_, 18, _"
            options: ["10", "17", "19", "20"]
            answer: ["10", "20"]
          - id: l2-c20
            part: tens-either-side
            type: true_false
            text: "Is it true? The multiples of ten either side of 75 are 70 and 80."
            answer: true
