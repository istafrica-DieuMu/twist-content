# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.core-facts
skill: math.mult-div.core-facts
curriculum: en-GB
language: en
title:
  de: Die Kernaufgaben
  en: The core facts
summary: >
  The core facts of the times tables, known by heart: 1 times, 2 times,
  10 times and 5 times a number. Lesson 1 takes 1 times (the number stays
  the same), 2 times (double it) and 10 times (that many tens); lesson 2
  takes 5 times as half of 10 times, mixes all four, and ends with the
  skill check.
metadata:
  year: year-2
  topic: { de: Einmaleins, en: Times tables }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.commutative]
  also_practises: [math.mult-div.commutative]
  vocabulary: { en: [times, multiply, lots of, groups of, double, half, times tables, core facts] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: times-1, what: { de: mal 1 rechnen, en: multiplying by 1 } }
    - { id: times-2, what: { de: mal 2 rechnen, en: multiplying by 2 } }
    - { id: times-5, what: { de: mal 5 rechnen, en: multiplying by 5 } }
    - { id: times-10, what: { de: mal 10 rechnen, en: multiplying by 10 } }
  misconceptions:
    - id: times-one-plus-one
      what: Thinks 1 × 7 is 8, as if times 1 were add 1
      addressed: lesson 1 Learn shows one row of seven; l1-f1 (with feedback), l1-s1, l1-n1 and l1-c1 ask a times 1 fact with the add-one answer as an option
    - id: times-ten-two-zeros
      what: Writes too many zeros for times 10 (6 × 10 = 600)
      addressed: lesson 1 Learn reads 10 × 7 as seven tens; l1-f3 (with feedback), l1-s3 and l2-c3 offer the extra-zero answer
    - id: five-as-ten
      what: Gives the times 10 answer for times 5 (5 × 6 = 60)
      addressed: lesson 2 Learn shows 5 × 6 as half of 10 × 6; l2-f1 (with feedback), l2-f2, l2-s2 and l2-c2 offer the times 10 answer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Einmal, zweimal, zehnmal", en: "1 times, 2 times, 10 times" }
    goal:
      de: "Lerne die Malaufgaben mit 1, 2 und 10 auswendig, so wie 2 mal 7 ist das Doppelte von 7, also 14."
      en: "Learn your 1, 2 and 10 times facts by heart, like 2 times 7 is double 7, which is 14."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "3 × 5 = 15, so 5 × 3 = _"
            say: "Three times five is fifteen. So what is five times three?"
            options: ["15", "8", "35"]
            answer: "15"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? 2 × 4 = 4 × 2"
            say: "Two times four is the same as four times two. Is that true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 × 7 = ?"
            say: "Here is one row of seven dots. One times seven. What do you think it makes? Have a guess."
            show: { drawn: dots, array: [1, 7] }
          - text: "1 × 7 = 7"
            say: "One row of seven dots is seven. One times seven is seven. Times one, the number stays the same."
            show: { drawn: dots, array: [1, 7] }
          - text: "2 × 7 = 14"
            say: "Two rows of seven. Two times seven is double seven: fourteen."
            show: { drawn: dots, array: [2, 7] }
          - text: "10 × 7 = 70"
            say: "Ten rows of seven. Ten times seven is seven tens: seventy. Times ten, the digits move one place to the left and a zero fills the ones."
            show: { drawn: dots, array: [10, 7] }
          - text: "Did you know? The × sign was first used by William Oughtred, an English maths teacher, nearly 400 years ago."
            say: "Did you know? The times sign was first used by William Oughtred, a maths teacher from England, nearly four hundred years ago. Before that, people had to write the words out!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1 × 8 = _"
                say: "One times eight."
                show: { drawn: dots, array: [1, 8] }
                options: ["8", "9", "1"]
                answer: "8"
                feedback:
                  "9": "Times one is not add one. One row of eight dots is eight."
                hints:
                  - "How many rows are there? How many in the row?"
                  - "One row of eight. Times one, the number stays the same."
                  - "8."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "2 × 6 = _"
                say: "Two times six."
                show: { drawn: dots, array: [2, 6] }
                options: ["12", "8", "13"]
                answer: "12"
                feedback:
                  "8": "Eight is two add six. Two times six is two sixes: double six."
                hints:
                  - "Two times a number is double the number."
                  - "Six and six."
                  - "12."
              - id: l1-f3
                type: multiple_choice
                text: "10 × 4 = _"
                say: "Ten times four."
                options: ["40", "400", "14"]
                answer: "40"
                feedback:
                  "400": "Four hundred is too big. Ten fours are four tens: forty."
                hints:
                  - "Ten times a number gives that many tens."
                  - "Ten fours are four tens."
                  - "40."
              - id: l1-f4
                type: text_input
                text: "2 × 9 = _"
                say: "Two times nine."
                show: { drawn: dots, array: [2, 9] }
                answer: "18"
                hints:
                  - "Double nine."
                  - "Nine and nine. Nine and one make ten, and eight more."
                  - "18."
              - id: l1-f5
                type: true_false
                text: "Is it true? 10 × 3 = 30"
                say: "Ten times three is thirty. Is that true?"
                answer: true
                hints:
                  - "Ten threes are three tens."
                  - "Three tens: ten, twenty, thirty."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "1 × 5 = _"
                say: "One times five."
                options: ["5", "6", "1"]
                answer: "5"
                hints: ["One row of five. Times one, the number stays the same."]
              - id: l1-s2
                type: text_input
                text: "2 × 8 = _"
                say: "Two times eight."
                answer: "16"
                hints: ["Double eight."]
              - id: l1-s3
                type: multiple_choice
                text: "10 × 6 = _"
                say: "Ten times six."
                options: ["60", "600", "16"]
                answer: "60"
                hints: ["Ten sixes are six tens."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 2 × 7 = 15"
                say: "Two times seven is fifteen. Is that true?"
                answer: false
                hints: ["Double seven: seven and seven."]
              - id: l1-s5
                type: text_input
                text: "9 × 1 = _"
                say: "Nine times one."
                answer: "9"
                hints: ["Nine ones. The number stays the same."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "1 × 9 = _"
                say: "One times nine."
                options: ["9", "10", "1"]
                answer: "9"
              - id: l1-n2
                type: text_input
                text: "A spider has 8 legs. How many legs do 10 spiders have? 10 × 8 = _"
                say: "A spider has eight legs. How many legs do ten spiders have? Ten times eight."
                show: { object: spider, count: 10 }
                answer: "80"
              - id: l1-n3
                type: text_input
                text: "Each hand has 5 fingers. How many fingers on 2 hands? 2 × 5 = _"
                say: "Each hand has five fingers. How many fingers are on two hands? Two times five."
                show: { object: hand, count: 2 }
                answer: "10"
              - id: l1-n4
                type: true_false
                text: "Is it true? 10 × 9 = 90"
                say: "Ten times nine is ninety. Is that true?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "6 × 2 = _"
                say: "Six times two."
                options: ["12", "8", "62"]
                answer: "12"
                feedback:
                  "62": "Ha, that's just 6 and 2 squashed together! Six twos is double six."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "1 × 4 = _"
            say: "One times four."
            options: ["4", "5", "1"]
            answer: "4"
          - id: l1-c2
            type: text_input
            text: "2 × 4 = _"
            say: "Two times four."
            answer: "8"
          - id: l1-c3
            type: text_input
            text: "10 × 5 = _"
            say: "Ten times five."
            answer: "50"
          - id: l1-c4
            type: multiple_choice
            text: "7 × 1 = _"
            say: "Seven times one."
            options: ["7", "8", "1"]
            answer: "7"
          - id: l1-c5
            type: true_false
            text: "Is it true? 2 × 3 = 5"
            say: "Two times three is five. Is that true?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "10 × 1 = _"
            say: "Ten times one."
            options: ["10", "11", "100"]
            answer: "10"

  - n: 2
    title: { de: "Fünfmal ist die Hälfte von zehnmal", en: "5 times is half of 10 times" }
    goal:
      de: "Rechne 5 mal eine Zahl als Hälfte von 10 mal, so wie 5 mal 8 ist die Hälfte von 80."
      en: "Work out 5 times a number as half of 10 times, like 5 times 8 is half of 80."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "10 × 6 = _"
            say: "Ten times six."
            answer: "60"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "2 × 3 = _"
            say: "Two times three."
            options: ["6", "5", "9"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5 × 6 = ?"
            say: "Five times six. Ten times six is sixty. Do you think five times six is more than sixty, or less? Have a guess."
            show: { drawn: dots, array: [10, 6] }
          - text: "10 × 6 = 60"
            say: "Ten rows of six dots. Ten times six is sixty."
            show: { drawn: dots, array: [10, 6] }
          - text: "5 × 6 = 30"
            say: "Five rows of six is half of the ten rows. Half of sixty is thirty. So five times six is thirty."
            show: { drawn: dots, array: [10, 6], split_rows: 5 }
          - text: "5 × 8: 10 × 8 = 80, half of 80 is 40"
            say: "Five times eight. Ten times eight is eighty. Half of eighty is forty. So five times eight is forty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "5 × 4 = _"
                say: "Five times four."
                show: { drawn: dots, array: [10, 4], split_rows: 5 }
                options: ["20", "40", "9"]
                answer: "20"
                feedback:
                  "40": "Forty is ten times four. Five times four is half of that."
                hints:
                  - "Five times is half of ten times."
                  - "Ten times four is forty. The red rows are half."
                  - "20."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "10 × 8 = _, so 5 × 8 = _"
                say: "Ten times eight is how many? So five times eight is how many?"
                frame: "10 × 8 = _ · 5 × 8 = _"
                options: ["80", "40", "16", "13"]
                answer: ["80", "40"]
                hints:
                  - "First find ten times eight: eight tens."
                  - "Ten times eight is eighty. Now halve it."
                  - "80 and 40."
              - id: l2-f3
                type: text_input
                text: "5 × 2 = _"
                say: "Five times two."
                answer: "10"
                hints:
                  - "Ten times two, then halve it."
                  - "Ten times two is twenty. Half of twenty."
                  - "10."
              - id: l2-f4
                type: true_false
                text: "Is it true? 5 × 6 = 35"
                say: "Five times six is thirty-five. Is that true?"
                answer: false
                hints:
                  - "Halve ten times six."
                  - "Ten times six is sixty. Half of sixty is thirty."
                  - "No, it is 30."
              - id: l2-f5
                type: multiple_choice
                text: "Which fact helps with 5 × 7?"
                say: "Which fact helps you work out five times seven?"
                options: ["10 × 7 = 70", "2 × 7 = 14", "1 × 7 = 7"]
                answer: "10 × 7 = 70"
                hints:
                  - "Five times is half of which times?"
                  - "Five is half of ten."
                  - "10 × 7 = 70. Half of it is 35."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "5 × 10 = _"
                say: "Five times ten."
                answer: "50"
                hints: ["Five tens."]
              - id: l2-s2
                type: multiple_choice
                text: "5 × 9 = _"
                say: "Five times nine."
                options: ["45", "90", "14"]
                answer: "45"
                hints: ["Ten times nine is ninety. Halve it."]
              - id: l2-s3
                type: text_input
                text: "2 × 10 = _"
                say: "Two times ten."
                answer: "20"
                hints: ["Double ten."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 1 × 6 = 6"
                say: "One times six is six. Is that true?"
                answer: true
                hints: ["Times one, the number stays the same."]
              - id: l2-s5
                type: multiple_choice
                text: "5 × 3 = _"
                say: "Five times three."
                options: ["15", "8", "30"]
                answer: "15"
                hints: ["Ten times three is thirty. Half of it."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A pack has 5 pencils. How many pencils are in 6 packs?"
                say: "A pack has five pencils. How many pencils are in six packs?"
                show: { object: pencil }
                answer: "30"
              - id: l2-n2
                type: multiple_choice
                text: "There are 6 plates. Each plate has 1 cake. How many cakes?"
                say: "There are six plates. Each plate has one cake. How many cakes?"
                options: ["6", "7", "1"]
                answer: "6"
              - id: l2-n3
                type: text_input
                text: "There are 10 cars. Each car has 4 wheels. How many wheels?"
                say: "There are ten cars. Each car has four wheels. How many wheels?"
                answer: "40"
              - id: l2-n4
                type: text_input
                text: "There are 7 children. Each has 2 hands. How many hands?"
                say: "There are seven children. Each child has two hands. How many hands?"
                answer: "14"
              - id: l2-n5
                type: multiple_choice
                text: "Each box holds 5 eggs. How many eggs are in 8 boxes?"
                say: "Each box holds five eggs. How many eggs are in eight boxes?"
                show: { object: egg }
                options: ["40", "80", "13", "5888"]
                answer: "40"
                feedback:
                  "5888": "That's a lot of omelettes! Eight boxes of five: half of eight tens."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: times-1
            type: text_input
            text: "1 × 3 = _"
            say: "One times three."
            answer: "3"
          - id: l2-c2
            part: times-5
            type: multiple_choice
            text: "5 × 5 = _"
            say: "Five times five."
            options: ["25", "50", "10"]
            answer: "25"
          - id: l2-c3
            part: times-10
            type: multiple_choice
            text: "10 × 7 = _"
            say: "Ten times seven."
            options: ["70", "700", "17"]
            answer: "70"
          - id: l2-c4
            part: times-2
            type: text_input
            text: "7 × 2 = _"
            say: "Seven times two."
            answer: "14"
          - id: l2-c5
            part: times-5
            type: true_false
            text: "Is it true? 5 × 7 = 30"
            say: "Five times seven is thirty. Is that true?"
            answer: false
          - id: l2-c6
            part: times-1
            type: text_input
            text: "1 × 10 = _"
            say: "One times ten."
            answer: "10"
          - id: l2-c7
            part: times-1
            type: multiple_choice
            text: "1 × 20 = _"
            say: "One times twenty."
            options: ["20", "21", "1"]
            answer: "20"
          - id: l2-c8
            part: times-1
            type: true_false
            text: "Is it true? 1 × 2 = 3"
            say: "One times two is three. Is that true?"
            answer: false
          - id: l2-c9
            part: times-1
            type: text_input
            text: "There are 8 vases. Each vase has 1 flower. How many flowers are there?"
            say: "There are eight vases. Each vase has one flower. How many flowers are there?"
            answer: "8"
          - id: l2-c10
            part: times-2
            type: text_input
            text: "2 × 2 = _"
            say: "Two times two."
            answer: "4"
          - id: l2-c11
            part: times-2
            type: multiple_choice
            text: "3 × 2 = _"
            say: "Three times two."
            options: ["6", "5", "32"]
            answer: "6"
          - id: l2-c12
            part: times-2
            type: true_false
            text: "Is it true? 9 × 2 = 18"
            say: "Nine times two is eighteen. Is that true?"
            answer: true
          - id: l2-c13
            part: times-2
            type: text_input
            text: "Socks come in pairs. How many socks are there in 5 pairs?"
            say: "Socks come in pairs. How many socks are there in five pairs?"
            answer: "10"
          - id: l2-c14
            part: times-5
            type: multiple_choice
            text: "7 × 5 = _"
            say: "Seven times five."
            options: ["35", "70", "12"]
            answer: "35"
          - id: l2-c15
            part: times-5
            type: text_input
            text: "4 × 5 = _"
            say: "Four times five."
            answer: "20"
          - id: l2-c16
            part: times-5
            type: text_input
            text: "A rubber costs 5p. How much do 9 rubbers cost? Type the pence."
            say: "A rubber costs five pence. How much do nine rubbers cost? Type the pence."
            answer: "45"
          - id: l2-c17
            part: times-10
            type: text_input
            text: "10 × 2 = _"
            say: "Ten times two."
            answer: "20"
          - id: l2-c18
            part: times-10
            type: multiple_choice
            text: "3 × 10 = _"
            say: "Three times ten."
            options: ["30", "300", "13"]
            answer: "30"
          - id: l2-c19
            part: times-10
            type: true_false
            text: "Is it true? 10 × 10 = 100"
            say: "Ten times ten is one hundred. Is that true?"
            answer: true
          - id: l2-c20
            part: times-10
            type: text_input
            text: "A pack has 10 stickers. How many stickers are there in 9 packs?"
            say: "A pack has ten stickers. How many stickers are there in nine packs?"
            answer: "90"
