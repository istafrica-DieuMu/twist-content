# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.time-quarter
skill: math.time.quarter-hours
curriculum: en-GB
language: en
title:
  de: Viertel nach und Viertel vor
  en: Quarter past and quarter to
summary: >
  Reading quarter hours on an analogue clock. Lesson 1 reads quarter past
  (minute hand on the 3, 3:15 is quarter past three) and quarter to
  (minute hand on the 9, 3:45 is quarter to four); lesson 2 mixes all
  four positions of the minute hand with o'clock and half past, matches
  them with the digital time, works with times in a day, and ends with
  the skill check. Every practise stage and both checks also ask the
  child to set the hands to a quarter hour (clock_hands_drag).
metadata:
  year: year-2
  topic: { de: Uhrzeit, en: Telling the time }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.time.full-half-hour]
  also_practises: [math.time.full-half-hour]
  vocabulary: { en: [quarter past, quarter to, half past, "o'clock", minute hand, hour hand, clock, digital] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: [time-format]
  parts:
    - { id: past, what: { de: Viertel nach ablesen, en: reading quarter past } }
    - { id: to, what: { de: Viertel vor ablesen, en: reading quarter to } }
    - { id: digital, what: { de: Viertelstunden der Digitalzeit zuordnen, en: matching quarter hours to digital times } }
    - { id: set, what: { de: die Zeiger auf eine Viertelstunde stellen, en: setting the hands to a quarter hour } }
  misconceptions:
    - id: quarter-to-wrong-hour
      what: Names the hour just gone for quarter to (2:45 read as quarter to two)
      addressed: lesson 1 Learn shows the hour hand nearly at the next hour for quarter to; l1-f3 (with feedback), l1-s3, l2-f2 (with feedback), l2-n2 and l2-c3 offer the hour just gone
    - id: past-to-swapped
      what: Mixes up quarter past and quarter to (minute hand on the 9 read as quarter past)
      addressed: lesson 1 Learn says the 3 is quarter past and the 9 is quarter to; l1-f2 (with feedback), l1-s2 and l1-n2 offer the swapped name
    - id: hands-swapped
      what: Reads the short hand as the minutes and the long hand as the hour
      addressed: lesson 1 Learn names the long minute hand and the short hour hand; l1-f5 sets quarter past 6, with feedback for the swapped hands (3:30)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Viertel nach und Viertel vor, en: Quarter past and quarter to }
    goal:
      de: "Lies Viertel nach und Viertel vor ab, so wie Viertel nach drei, wenn der Minutenzeiger auf der 3 steht."
      en: "Read quarter past and quarter to, like quarter past three when the minute hand points to the 3."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 4, minute: 0 }
            options: ["4 o'clock", "12 o'clock", "half past 4"]
            answer: "4 o'clock"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 7, minute: 30 }
            options: ["half past 7", "half past 6", "7 o'clock"]
            answer: "half past 7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The minute hand goes round once in an hour."
            say: "The long hand is the minute hand. The short hand is the hour hand. In one hour the minute hand goes all the way round."
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "Quarter past 3"
            say: "The minute hand has gone a quarter of the way round. It points at the three. The hour hand is just past the three. It is quarter past three."
            show: { drawn: clock, hour: 3, minute: 15, digital: true }
          - text: "Half past 3"
            say: "Half way round, the minute hand points at the six. Half past three."
            show: { drawn: clock, hour: 3, minute: 30, digital: true }
          - text: "Quarter to 4"
            say: "Three quarters of the way round, the minute hand points at the nine. Only a quarter of an hour is left until four o'clock. The hour hand is nearly at the four. It is quarter to four."
            show: { drawn: clock, hour: 3, minute: 45, digital: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What time is it?"
                say: "What time does the clock show?"
                show: { drawn: clock, hour: 5, minute: 15 }
                options: ["quarter past 5", "quarter past 3", "5 o'clock"]
                answer: "quarter past 5"
                hints:
                  - "Where is the minute hand pointing?"
                  - "The minute hand is on the 3, so it is quarter past. The hour hand is just past the 5."
                  - "Quarter past 5."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What time is it?"
                say: "What time does the clock show?"
                show: { drawn: clock, hour: 8, minute: 45 }
                options: ["quarter to 9", "quarter past 9", "quarter to 8"]
                answer: "quarter to 9"
                feedback:
                  "quarter past 9": "The minute hand is on the 9, not the 3. On the 9 it is quarter to."
                hints:
                  - "The minute hand is on the 9. Is that quarter past or quarter to?"
                  - "On the 9 it is quarter to. The hour hand is nearly at the 9."
                  - "Quarter to 9."
              - id: l1-f3
                type: multiple_choice
                text: "What time is it?"
                say: "What time does the clock show?"
                show: { drawn: clock, hour: 1, minute: 45 }
                options: ["quarter to 2", "quarter to 1", "quarter past 1"]
                answer: "quarter to 2"
                feedback:
                  "quarter to 1": "The hour hand has gone past the 1 and is nearly at the 2. A quarter of an hour more and it is 2 o'clock."
                hints:
                  - "Which hour is coming next?"
                  - "The hour hand is between the 1 and the 2, nearly at the 2."
                  - "Quarter to 2."
              - id: l1-f4
                type: true_false
                text: "Is it true? This clock shows quarter past 10."
                say: "This clock shows quarter past ten. Is that true?"
                show: { drawn: clock, hour: 10, minute: 15 }
                answer: true
                hints:
                  - "Look at the minute hand first."
                  - "The minute hand is on the 3: quarter past. The hour hand is just past the 10."
                  - "Yes."
              - id: l1-f5
                type: clock_hands_drag
                text: "Show quarter past 6 on the clock."
                say: "Show quarter past six on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "6:15"
                feedback:
                  "3:30": "You swapped the hands. The long minute hand goes on the 3 and the short hour hand on the 6."
                  "6:45": "That is quarter to 7. For quarter past, the minute hand points at the 3."
                hints:
                  - "For quarter past, the minute hand points at the 3."
                  - "The short hour hand is just past the 6."
                  - "Drag the long hand to the 3 and the short hand to the 6."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What time is it?"
                say: "What time does the clock show?"
                show: { drawn: clock, hour: 11, minute: 15 }
                options: ["quarter past 11", "quarter to 11", "11 o'clock"]
                answer: "quarter past 11"
                hints: ["The minute hand is on the 3."]
              - id: l1-s2
                type: multiple_choice
                text: "What time is it?"
                say: "What time does the clock show?"
                show: { drawn: clock, hour: 6, minute: 45 }
                options: ["quarter to 7", "quarter past 7", "half past 6"]
                answer: "quarter to 7"
                hints: ["On the 9 it is quarter to the next hour."]
              - id: l1-s3
                type: multiple_choice
                text: "What time is it?"
                say: "What time does the clock show?"
                show: { drawn: clock, hour: 9, minute: 45 }
                options: ["quarter to 10", "quarter to 9", "quarter past 10"]
                answer: "quarter to 10"
                hints: ["The hour hand is nearly at the 10."]
              - id: l1-s4
                type: true_false
                text: "Is it true? This clock shows quarter to 4."
                say: "This clock shows quarter to four. Is that true?"
                show: { drawn: clock, hour: 4, minute: 15 }
                answer: false
                hints: ["Is the minute hand on the 3 or on the 9?"]
              - id: l1-s5
                type: clock_hands_drag
                text: "Show quarter to 3 on the clock."
                say: "Show quarter to three on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "2:45"
                feedback:
                  "3:45": "That is quarter to 4. Quarter to 3 comes before 3 o'clock, so drag the hour hand to the 2. It sits nearly at the 3."
                  "3:15": "That is quarter past 3. For quarter to, the minute hand points at the 9."
                hints: ["The minute hand on the 9, the hour hand nearly at the 3."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What time is it?"
                say: "What time does the clock show?"
                show: { drawn: clock, hour: 2, minute: 15 }
                options: ["quarter past 2", "quarter to 2", "half past 2"]
                answer: "quarter past 2"
              - id: l1-n2
                type: multiple_choice
                text: "What time is it?"
                say: "What time does the clock show?"
                show: { drawn: clock, hour: 11, minute: 45 }
                options: ["quarter to 12", "quarter past 12", "quarter to 11"]
                answer: "quarter to 12"
              - id: l1-n3
                type: clock_hands_drag
                text: "Show quarter past 8 on the clock."
                say: "Show quarter past eight on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "8:15"
                feedback:
                  "8:45": "That is quarter to 9. For quarter past, the minute hand points at the 3."
              - id: l1-n4
                type: true_false
                text: "Is it true? This clock shows quarter to 6."
                say: "This clock shows quarter to six. Is that true?"
                show: { drawn: clock, hour: 5, minute: 45 }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Where does the minute hand point at quarter to?"
                say: "At quarter to, where does the minute hand point?"
                options: ["at the 9", "at the 3", "at the 6"]
                answer: "at the 9"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 7, minute: 15 }
            options: ["quarter past 7", "quarter to 7", "quarter past 3"]
            answer: "quarter past 7"
          - id: l1-c2
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 4, minute: 45 }
            options: ["quarter to 5", "quarter to 4", "quarter past 5"]
            answer: "quarter to 5"
          - id: l1-c3
            type: clock_hands_drag
            text: "Show quarter to 10 on the clock."
            say: "Show quarter to ten on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 15
            answer: "9:45"
            feedback:
              "10:45": "That is quarter to 11. Quarter to 10 comes before 10 o'clock: the hour hand is nearly at the 10."
          - id: l1-c4
            type: true_false
            text: "Is it true? This clock shows quarter past 8."
            say: "This clock shows quarter past eight. Is that true?"
            show: { drawn: clock, hour: 8, minute: 45 }
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 6, minute: 15 }
            options: ["quarter past 6", "quarter to 6", "half past 6"]
            answer: "quarter past 6"
          - id: l1-c6
            type: clock_hands_drag
            text: "Show quarter to 1 on the clock."
            say: "Show quarter to one on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 15
            answer: "12:45"

  - n: 2
    title: { de: Alle Viertelstunden, en: Every quarter hour }
    goal:
      de: "Lies jede Viertelstunde auf der Uhr ab und finde die passende Digitalzeit, so wie Viertel vor sechs ist 5 Uhr 45."
      en: "Read every quarter hour on a clock and match it to a digital time, like quarter to six is five forty-five."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 12, minute: 15 }
            options: ["quarter past 12", "quarter to 12", "quarter past 3"]
            answer: "quarter past 12"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 7, minute: 45 }
            options: ["quarter to 8", "quarter to 7", "quarter past 8"]
            answer: "quarter to 8"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5:00   5:15   5:30   5:45"
            say: "Every quarter of an hour the minute hand moves on to the next quarter: five o'clock, quarter past five, half past five, quarter to six."
            show: { drawn: clock, hour: 5, minute: 15, digital: true }
          - text: "5:15 is quarter past 5"
            say: "A digital clock shows the hour, then the minutes. Five fifteen is quarter past five. Fifteen minutes past five."
            show: { drawn: clock, hour: 5, minute: 15, digital: true }
          - text: "5:45 is quarter to 6"
            say: "Five forty-five is quarter to six. Forty-five minutes have gone; fifteen more and it is six o'clock."
            show: { drawn: clock, hour: 5, minute: 45, digital: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which digital time is quarter past 4?"
                say: "Which digital time is quarter past four?"
                options: ["4:15", "4:45", "3:45"]
                answer: "4:15"
                hints:
                  - "Quarter past is fifteen minutes past the hour."
                  - "The hour is four, the minutes are fifteen."
                  - "4:15."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which digital time is quarter to 9?"
                say: "Which digital time is quarter to nine?"
                options: ["8:45", "9:45", "9:15"]
                answer: "8:45"
                feedback:
                  "9:45": "Nine forty-five is quarter to ten. Quarter to nine comes before nine o'clock: eight forty-five."
                hints:
                  - "Quarter to nine is before nine o'clock."
                  - "So the hour is still eight, and forty-five minutes have gone."
                  - "8:45."
              - id: l2-f3
                type: matching
                text: "Match each clock to its time."
                say: "Match each clock to its time."
                pairs:
                  - { left: { drawn: clock, hour: 2, minute: 15 }, right: { text: "quarter past 2" } }
                  - { left: { drawn: clock, hour: 2, minute: 30 }, right: { text: "half past 2" } }
                  - { left: { drawn: clock, hour: 2, minute: 45 }, right: { text: "quarter to 3" } }
                hints:
                  - "Look at the minute hand on each clock."
                  - "On the 3 is quarter past, on the 6 is half past, on the 9 is quarter to."
                  - "2:15 quarter past 2, 2:30 half past 2, 2:45 quarter to 3."
              - id: l2-f4
                type: clock_hands_drag
                text: "Show 10:45 on the clock."
                say: "Show ten forty-five on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "10:45"
                feedback:
                  "10:15": "That is 10:15. Forty-five minutes: the minute hand points at the 9."
                  "11:45": "That is 11:45. At 10:45 it is not yet 11 o'clock, so drag the hour hand to the 10."
                hints:
                  - "Forty-five minutes: the minute hand on the 9."
                  - "The hour hand has passed the 10 and is nearly at the 11."
                  - "Drag the long hand to the 9 and the short hand to the 10."
              - id: l2-f5
                type: true_false
                text: "Is it true? 6:15 is quarter to 6."
                say: "Six fifteen is quarter to six. Is that true?"
                answer: false
                hints:
                  - "Fifteen minutes past the hour is quarter past."
                  - "Six fifteen is quarter past six."
                  - "No."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which digital time is quarter to 12?"
                say: "Which digital time is quarter to twelve?"
                options: ["11:45", "12:45", "12:15"]
                answer: "11:45"
                hints: ["Quarter to twelve is before twelve o'clock."]
              - id: l2-s2
                type: multiple_choice
                text: "What time is it?"
                say: "What time does the clock show?"
                show: { drawn: clock, hour: 3, minute: 45, digital: true }
                options: ["quarter to 4", "quarter past 3", "quarter to 3"]
                answer: "quarter to 4"
                hints: ["Forty-five minutes past three."]
              - id: l2-s3
                type: matching
                text: "Match each time to its digital time."
                say: "Match each time to its digital time."
                pairs:
                  - { left: { text: "quarter past 9" }, right: { text: "9:15" } }
                  - { left: { text: "quarter to 9" }, right: { text: "8:45" } }
                  - { left: { text: "9 o'clock" }, right: { text: "9:00" } }
                hints: ["Quarter to nine comes before nine o'clock."]
              - id: l2-s4
                type: clock_hands_drag
                text: "Show quarter past 1 on the clock."
                say: "Show quarter past one on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "1:15"
                feedback:
                  "12:45": "That is quarter to 1. For quarter past, the minute hand points at the 3."
                  "1:45": "That is quarter to 2. For quarter past, the minute hand points at the 3."
                hints: ["The minute hand on the 3, the hour hand just past the 1."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 7:45 is quarter to 8."
                say: "Seven forty-five is quarter to eight. Is that true?"
                answer: true
                hints: ["Fifteen more minutes and it is eight o'clock."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "School starts at quarter to 9. Which time is that?"
                say: "School starts at quarter to nine in the morning. Which time is that?"
                options: ["8:45 am", "9:45 am", "9:15 am"]
                answer: "8:45 am"
              - id: l2-n2
                type: multiple_choice
                text: "Lunch is at this time. What time is lunch?"
                say: "Lunch is at the time on the clock. What time is lunch?"
                show: { drawn: clock, hour: 12, minute: 45 }
                options: ["quarter to 1", "quarter to 12", "quarter past 1"]
                answer: "quarter to 1"
              - id: l2-n3
                type: clock_hands_drag
                text: "Swimming is at quarter past 4. Show the time on the clock."
                say: "Swimming is at quarter past four. Show the time on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "4:15"
                feedback:
                  "3:45": "That is quarter to 4. Quarter past 4 comes after 4 o'clock."
                  "4:45": "That is quarter to 5. For quarter past, the minute hand points at the 3."
              - id: l2-n4
                type: multiple_choice
                text: "Tom goes to bed at 7:45 pm. What does he say?"
                say: "Tom goes to bed at seven forty-five in the evening. How does he say the time?"
                options: ["quarter to 8", "quarter past 7", "quarter to 7"]
                answer: "quarter to 8"
              - id: l2-n5
                type: true_false
                text: "The bus comes at quarter past 3. The clock shows the time now. Is the bus due now?"
                say: "The bus comes at quarter past three. The clock shows the time now. Is the bus due now?"
                show: { drawn: clock, hour: 2, minute: 45 }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: past
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 10, minute: 15 }
            options: ["quarter past 10", "quarter to 10", "quarter past 3"]
            answer: "quarter past 10"
          - id: l2-c2
            part: set
            type: clock_hands_drag
            text: "Show quarter to 7 on the clock."
            say: "Show quarter to seven on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 15
            answer: "6:45"
            feedback:
              "7:45": "That is quarter to 8. Quarter to 7 comes before 7 o'clock: the hour hand is nearly at the 7."
              "7:15": "That is quarter past 7. For quarter to, the minute hand points at the 9."
          - id: l2-c3
            part: to
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 5, minute: 45 }
            options: ["quarter to 6", "quarter to 5", "half past 5"]
            answer: "quarter to 6"
          - id: l2-c4
            part: digital
            type: multiple_choice
            text: "Which digital time is quarter past 11?"
            say: "Which digital time is quarter past eleven?"
            options: ["11:15", "11:45", "10:45"]
            answer: "11:15"
          - id: l2-c5
            part: digital
            type: true_false
            text: "Is it true? 1:45 is quarter to 2."
            say: "One forty-five is quarter to two. Is that true?"
            answer: true
          - id: l2-c6
            part: past
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 9, minute: 15 }
            options: ["quarter past 9", "quarter to 9", "half past 9"]
            answer: "quarter past 9"
          - id: l2-c7
            part: past
            type: true_false
            text: "Is it true? This clock shows quarter past 1."
            say: "This clock shows quarter past one. Is that true?"
            show: { drawn: clock, hour: 1, minute: 15 }
            answer: true
          - id: l2-c8
            part: past
            type: true_false
            text: "Is it true? This clock shows quarter past 6."
            say: "This clock shows quarter past six. Is that true?"
            show: { drawn: clock, hour: 6, minute: 45 }
            answer: false
          - id: l2-c9
            part: past
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 8, minute: 15 }
            options: ["quarter past 8", "quarter past 3", "8 o'clock"]
            answer: "quarter past 8"
          - id: l2-c10
            part: to
            type: multiple_choice
            text: "What time is it?"
            say: "What time does the clock show?"
            show: { drawn: clock, hour: 10, minute: 45 }
            options: ["quarter to 11", "quarter to 10", "quarter past 11"]
            answer: "quarter to 11"
          - id: l2-c11
            part: to
            type: true_false
            text: "Is it true? This clock shows quarter to 2."
            say: "This clock shows quarter to two. Is that true?"
            show: { drawn: clock, hour: 2, minute: 45 }
            answer: false
          - id: l2-c12
            part: to
            type: true_false
            text: "Is it true? This clock shows quarter to 12."
            say: "This clock shows quarter to twelve. Is that true?"
            show: { drawn: clock, hour: 11, minute: 45 }
            answer: true
          - id: l2-c13
            part: to
            type: multiple_choice
            text: "At quarter to 5, where is the hour hand?"
            say: "At quarter to five, where is the hour hand?"
            options: ["nearly at the 5", "just past the 5", "at the 12"]
            answer: "nearly at the 5"
          - id: l2-c14
            part: digital
            type: multiple_choice
            text: "Which digital time is quarter to 3?"
            say: "Which digital time is quarter to three?"
            options: ["2:45", "3:45", "3:15"]
            answer: "2:45"
          - id: l2-c15
            part: digital
            type: matching
            text: "Match each clock to its digital time."
            say: "Match each clock to its digital time."
            pairs:
              - { left: { drawn: clock, hour: 10, minute: 15 }, right: { text: "10:15" } }
              - { left: { drawn: clock, hour: 9, minute: 45 }, right: { text: "9:45" } }
              - { left: { drawn: clock, hour: 10, minute: 30 }, right: { text: "10:30" } }
          - id: l2-c16
            part: digital
