# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.equations-to-100
skill: math.add-sub-to-100.equations
curriculum: en-GB
language: en
title:
  de: Platzhalter und Ungleichungen bis 100
  en: Missing numbers and comparing calculations
summary: >
  Finding a missing number in a calculation and comparing calculations
  with <, > and =. Lesson 1 finds a missing number by counting up on an
  empty number line or with the inverse (45 + _ = 72, _ − 20 = 35);
  lesson 2 puts the right sign between two calculations, finds which
  numbers make a statement true, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-100.sub-two-digit, math.add-sub-to-20.equations]
  also_practises: [math.add-sub-to-100.complement]
  vocabulary: { en: [missing number, inverse, count up, greater than, less than, equal to, "<", ">", "="] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich, equation]
  facets: []
  parts:
    - { id: gap-plus, what: { de: den Platzhalter in Plusaufgaben finden, en: finding the missing number in an addition } }
    - { id: gap-minus, what: { de: den Platzhalter in Minusaufgaben finden, en: finding the missing number in a subtraction } }
    - { id: compare, what: { de: "<, > oder = zwischen Rechnungen setzen", en: "comparing calculations with <, > and =" } }
    - { id: inequality, what: { de: "Zahlen finden, die eine Ungleichung wahr machen", en: finding numbers that make a statement true } }
  misconceptions:
    - id: add-the-two-numbers
      what: Adds the two numbers shown instead of finding the missing one (45 + _ = 72 gives 117)
      addressed: lesson 1 Learn counts up from 45 to 72; l1-f1 (with feedback), l1-s1 and l1-c1 offer the sum of the two numbers
    - id: missing-start-subtracts
      what: Subtracts again for a missing start number (_ − 20 = 35 gives 15)
      addressed: lesson 1 Learn uses the inverse, 35 + 20; l1-f3 (with feedback), l1-s3 and l2-c2 offer the subtracted answer
    - id: equals-means-answer
      what: Reads = as "write the answer" and not as "the same as" (3 + 4 = 7 + 2 marked true)
      addressed: lesson 2 Learn works out both sides before choosing a sign; l2-f1 (with feedback), l2-f4 and l2-s4 compare two calculations
    - id: sign-backwards
      what: Reads < and > the wrong way round
      addressed: lesson 2 Learn says the open side faces the greater number; l2-f2 (with feedback), l2-s1 and l2-n1 choose the sign
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die fehlende Zahl finden, en: Find the missing number }
    goal:
      de: "Finde die fehlende Zahl durch Ergänzen oder mit der Umkehraufgabe, so wie bei 45 + wie viel ist 72."
      en: "Find the missing number by counting up or with the inverse, like 45 + what makes 72."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "8 + _ = 13"
            say: "Eight add what makes thirteen?"
            options: ["5", "21", "4"]
            answer: "5"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "64 − 30 = _"
            say: "Sixty-four take away thirty."
            answer: "34"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "45 + _ = 72"
            say: "Forty-five add what makes seventy-two? The missing number is the gap between forty-five and seventy-two."
            show: { drawn: equation, text: "45 + _ = 72" }
          - text: "45 → 50 → 70 → 72"
            say: "Count up. Forty-five to fifty is five. Fifty to seventy is twenty. Seventy to seventy-two is two. Five, twenty and two make twenty-seven."
            show: { drawn: rechenstrich, start: 45, jumps: [5, 20, 2] }
          - text: "_ − 20 = 35"
            say: "Something take away twenty leaves thirty-five. Use the inverse: put the twenty back. Thirty-five add twenty is fifty-five. So fifty-five take away twenty is thirty-five."
            show: { drawn: equation, text: "_ − 20 = 35" }
          - text: "Check: 55 − 20 = 35"
            say: "Always check by putting your number in the gap. Fifty-five take away twenty is thirty-five. It works."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "36 + _ = 50"
                say: "Thirty-six add what makes fifty?"
                show: { drawn: rechenstrich, start: 36, jumps: [4, 10] }
                options: ["14", "86", "24"]
                answer: "14"
                feedback:
                  "86": "Eighty-six is thirty-six add fifty. The question asks what goes with thirty-six to make fifty."
                hints:
                  - "Count up from thirty-six to fifty."
                  - "Thirty-six to forty is four, forty to fifty is ten."
                  - "14."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Count up: 58 + _ = 75"
                say: "Fifty-eight add what makes seventy-five? Count up in hops."
                show: { drawn: rechenstrich, start: 58, jumps: [2, 15] }
                frame: "58 + 2 = 60 · 60 + _ = 75 · 58 + _ = 75"
                options: ["15", "17", "2", "25"]
                answer: ["15", "17"]
                hints:
                  - "First hop to sixty, then to seventy-five."
                  - "Sixty to seventy-five is fifteen. Add the first hop of two."
                  - "15 and 17."
              - id: l1-f3
                type: multiple_choice
                text: "_ − 20 = 45"
                say: "What number take away twenty leaves forty-five?"
                options: ["65", "25", "55"]
                answer: "65"
                feedback:
                  "25": "Twenty-five is forty-five take away twenty. Put the twenty back instead: forty-five add twenty."
                hints:
                  - "Use the inverse: add the twenty back."
                  - "Forty-five add twenty."
                  - "65."
              - id: l1-f4
                type: text_input
                text: "80 − _ = 50"
                say: "Eighty take away what leaves fifty?"
                answer: "30"
                hints:
                  - "How far is it from fifty up to eighty?"
                  - "Count up in tens: sixty, seventy, eighty."
                  - "30."
              - id: l1-f5
                type: true_false
                text: "Is it true? 27 + 13 = 40"
                say: "Twenty-seven add thirteen is forty. Is that true?"
                answer: true
                hints:
                  - "Add the tens, then the ones."
                  - "Twenty add ten is thirty, seven add three is ten."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "64 + _ = 90"
                say: "Sixty-four add what makes ninety?"
                options: ["26", "154", "36"]
                answer: "26"
                hints: ["Count up: sixty-four to seventy, then to ninety."]
              - id: l1-s2
                type: text_input
                text: "_ + 30 = 72"
                say: "What number add thirty makes seventy-two?"
                answer: "42"
                hints: ["Take the thirty away from seventy-two."]
              - id: l1-s3
                type: multiple_choice
                text: "_ − 15 = 40"
                say: "What number take away fifteen leaves forty?"
                options: ["55", "25", "45"]
                answer: "55"
                hints: ["Put the fifteen back: forty add fifteen."]
              - id: l1-s4
                type: text_input
                text: "93 − _ = 63"
                say: "Ninety-three take away what leaves sixty-three?"
                answer: "30"
                hints: ["Count up from sixty-three to ninety-three in tens."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 70 − 25 = 55"
                say: "Seventy take away twenty-five is fifty-five. Is that true?"
                answer: false
                hints: ["Check: fifty-five add twenty-five."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "47 + _ = 60"
                say: "Forty-seven add what makes sixty?"
                answer: "13"
              - id: l1-n2
                type: text_input
                text: "_ − 40 = 38"
                say: "What number take away forty leaves thirty-eight?"
                answer: "78"
              - id: l1-n3
                type: multiple_choice
                text: "_ + 24 = 100"
                say: "What number add twenty-four makes one hundred?"
                options: ["76", "86", "124"]
                answer: "76"
              - id: l1-n4
                type: text_input
                text: "85 − _ = 60"
                say: "Eighty-five take away what leaves sixty?"
                answer: "25"
              - id: l1-n5
                type: true_false
                text: "Is it true? 39 + 21 = 60"
                say: "Thirty-nine add twenty-one is sixty. Is that true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "53 + _ = 80"
            say: "Fifty-three add what makes eighty?"
            options: ["27", "133", "37"]
            answer: "27"
          - id: l1-c2
            type: text_input
            text: "_ − 30 = 26"
            say: "What number take away thirty leaves twenty-six?"
            answer: "56"
          - id: l1-c3
            type: text_input
            text: "70 − _ = 45"
            say: "Seventy take away what leaves forty-five?"
            answer: "25"
          - id: l1-c4
            type: text_input
            text: "_ + 25 = 61"
            say: "What number add twenty-five makes sixty-one?"
            answer: "36"
          - id: l1-c5
            type: multiple_choice
            text: "90 − _ = 54"
            say: "Ninety take away what leaves fifty-four?"
            options: ["36", "46", "26"]
            answer: "36"
          - id: l1-c6
            type: true_false
            text: "Is 33 the missing number? _ − 20 = 53"
            say: "Something take away twenty leaves fifty-three. Is the missing number thirty-three?"
            answer: false

  - n: 2
    title: { de: "Größer, kleiner oder gleich", en: "Greater than, less than or equal to" }
    goal:
      de: "Vergleiche zwei Rechnungen und wähl größer, kleiner oder gleich, so wie 34 + 20 ist größer als 50."
      en: "Compare two calculations and choose greater than, less than or equals, like 34 + 20 is greater than 50."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "38 + _ = 50"
            say: "Thirty-eight add what makes fifty?"
            answer: "12"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "_ − 10 = 54"
            say: "What number take away ten leaves fifty-four?"
            options: ["64", "44", "54"]
            answer: "64"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "34 + 20 _ 50"
            say: "Compare thirty-four add twenty with fifty. Work out the calculation first: fifty-four. Fifty-four is greater than fifty."
            show: { drawn: equation, text: "34 + 20 _ 50" }
          - text: "34 + 20 > 50"
            say: "We write the greater than sign. The open side faces the greater number, like a mouth that wants the bigger amount."
          - text: "40 + 15 = 60 − 5"
            say: "Equals means the same as. Forty add fifteen is fifty-five. Sixty take away five is fifty-five. Both sides are the same, so we write equals."
          - text: "_ + 10 < 30"
            say: "Which numbers make this true? Ten add ten is twenty, less than thirty: yes. Twenty add ten is thirty, not less than thirty: no."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Which sign? 25 + 25 _ 40 + 10"
                say: "Twenty-five add twenty-five, and forty add ten. Which sign goes between them?"
                frame: "25 + 25 _ 40 + 10"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                feedback:
                  ">": "Work out both sides. Both are fifty, so they are equal."
                hints:
                  - "Work out each side first."
                  - "Twenty-five add twenty-five is fifty. Forty add ten is fifty."
                  - "=."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which sign? 63 − 20 _ 45"
                say: "Sixty-three take away twenty, and forty-five. Which sign goes between them?"
                frame: "63 − 20 _ 45"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "Sixty-three take away twenty is forty-three, which is less than forty-five. The open side faces forty-five."
                hints:
                  - "Work out sixty-three take away twenty."
                  - "Forty-three is less than forty-five."
                  - "<."
              - id: l2-f3
                type: multiple_choice
                text: "Which number makes it true? _ + 20 > 70"
                say: "Which number makes this true: something add twenty is greater than seventy?"
                options: ["60", "50", "40"]
                answer: "60"
                hints:
                  - "Try each number in the gap."
                  - "Fifty add twenty is seventy, not greater. Sixty add twenty is eighty."
                  - "60."
              - id: l2-f4
                type: true_false
                text: "Is it true? 30 + 8 = 40 − 2"
                say: "Thirty add eight is the same as forty take away two. Is that true?"
                answer: true
                hints:
                  - "Work out both sides."
                  - "Thirty-eight and thirty-eight."
                  - "Yes."
              - id: l2-f5
                type: fill_in_blank
                text: "Make both sides equal."
                say: "Fill the gap so both sides are the same."
                frame: "50 + 20 = 80 − _"
                options: ["10", "20", "70", "30"]
                answer: ["10"]
                hints:
                  - "Work out the left side first."
                  - "Fifty add twenty is seventy. Eighty take away what is seventy?"
                  - "10."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which sign? 48 + 10 _ 55"
                say: "Forty-eight add ten, and fifty-five. Which sign goes between them?"
                frame: "48 + 10 _ 55"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Forty-eight add ten is fifty-eight."]
              - id: l2-s2
                type: multiple_choice
                text: "Which number makes it true? 90 − _ < 50"
                say: "Which number makes this true: ninety take away something is less than fifty?"
                options: ["50", "30", "40"]
                answer: "50"
                hints: ["Try each number. Ninety take away forty is fifty: not less."]
              - id: l2-s3
                type: fill_in_blank
                text: "Make both sides equal."
                say: "Fill the gap so both sides are the same."
                frame: "35 + 5 = 20 + _"
                options: ["20", "40", "15", "25"]
                answer: ["20"]
                hints: ["Thirty-five add five is forty."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 6 + 4 = 10 + 3"
                say: "Six add four is the same as ten add three. Is that true?"
                answer: false
                hints: ["Work out both sides."]
              - id: l2-s5
                type: fill_in_blank
                text: "Which sign? 70 − 35 _ 30 + 5"
                say: "Seventy take away thirty-five, and thirty add five. Which sign goes between them?"
                frame: "70 − 35 _ 30 + 5"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Seventy take away thirty-five: count up from thirty-five."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which sign? 29 + 30 _ 60"
                say: "Twenty-nine add thirty, and sixty. Which sign goes between them?"
                frame: "29 + 30 _ 60"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n2
                type: text_input
                text: "Make both sides equal: 45 + 15 = _ + 40"
                say: "Forty-five add fifteen is the same as what add forty?"
                answer: "20"
              - id: l2-n3
                type: multiple_choice
                text: "Which number makes it true? _ − 30 > 40"
                say: "Which number makes this true: something take away thirty is greater than forty?"
                options: ["80", "70", "60"]
                answer: "80"
              - id: l2-n4
                type: true_false
                text: "Is it true? 100 − 40 > 50 + 5"
                say: "One hundred take away forty is greater than fifty add five. Is that true?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "62 + _ = 90"
                say: "Sixty-two add what makes ninety?"
                answer: "28"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: gap-plus
            type: text_input
            text: "56 + _ = 80"
            say: "Fifty-six add what makes eighty?"
            answer: "24"
          - id: l2-c2
            part: gap-minus
            type: multiple_choice
            text: "_ − 25 = 50"
            say: "What number take away twenty-five leaves fifty?"
            options: ["75", "25", "65"]
            answer: "75"
          - id: l2-c3
            part: compare
            type: fill_in_blank
            text: "Which sign? 44 + 20 _ 70 − 5"
            say: "Forty-four add twenty, and seventy take away five. Which sign goes between them?"
            frame: "44 + 20 _ 70 − 5"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c4
            part: compare
            type: fill_in_blank
            text: "Make both sides equal."
            say: "Fill the gap so both sides are the same."
            frame: "60 − 10 = 30 + _"
            options: ["20", "50", "40", "30"]
            answer: ["20"]
          - id: l2-c5
            part: inequality
            type: multiple_choice
            text: "Which number makes it true? _ + 30 < 60"
            say: "Which number makes this true: something add thirty is less than sixty?"
            options: ["20", "30", "40"]
            answer: "20"
          - id: l2-c6
            part: gap-plus
            type: text_input
            text: "_ + 46 = 80"
            say: "What number add forty-six makes eighty?"
            answer: "34"
          - id: l2-c7
            part: gap-plus
            type: multiple_choice
            text: "29 + _ = 70"
            say: "Twenty-nine add what makes seventy?"
            options: ["41", "51", "31"]
            answer: "41"
          - id: l2-c8
            part: gap-plus
            type: true_false
            text: "Is 28 the missing number? 34 + _ = 62"
            say: "Thirty-four add something makes sixty-two. Is the missing number twenty-eight?"
            answer: true
          - id: l2-c9
            part: gap-plus
            type: text_input
            text: "Leo has 45 stickers. He wants 70. How many more stickers does he need?"
            say: "Leo has forty-five stickers. He wants seventy. How many more stickers does he need?"
            answer: "25"
          - id: l2-c10
            part: gap-minus
            type: text_input
            text: "80 − _ = 47"
            say: "Eighty take away what leaves forty-seven?"
            answer: "33"
          - id: l2-c11
            part: gap-minus
            type: text_input
            text: "_ − 18 = 30"
            say: "What number take away eighteen leaves thirty?"
            answer: "48"
          - id: l2-c12
            part: gap-minus
            type: true_false
            text: "Is 15 the missing number? 61 − _ = 44"
            say: "Sixty-one take away something leaves forty-four. Is the missing number fifteen?"
            answer: false
          - id: l2-c13
            part: gap-minus
            type: multiple_choice
            text: "_ − 40 = 26"
            say: "What number take away forty leaves twenty-six?"
            options: ["66", "14", "56"]
            answer: "66"
          - id: l2-c14
            part: compare
            type: fill_in_blank
            text: "Which sign? 57 + 30 _ 90"
            say: "Fifty-seven add thirty, and ninety. Which sign goes between them?"
            frame: "57 + 30 _ 90"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c15
            part: compare
            type: fill_in_blank
            text: "Which sign? 100 − 45 _ 50 + 5"
            say: "One hundred take away forty-five, and fifty add five. Which sign goes between them?"
            frame: "100 − 45 _ 50 + 5"
            options: ["<", ">", "="]
            answer: ["="]
            option_audio: false
          - id: l2-c16
            part: compare
            type: true_false
            text: "Is it true? 90 − 30 > 25 + 40"
            say: "Ninety take away thirty is greater than twenty-five add forty. Is that true?"
            answer: false
          - id: l2-c17
            part: inequality
            type: multiple_choice
            text: "Which number makes it true? 25 + _ > 29"
            say: "Which number makes this true: twenty-five add something is greater than twenty-nine?"
            options: ["3", "4", "5"]
            answer: "5"
          - id: l2-c18
            part: inequality
            type: multiple_choice
            text: "Which number makes it true? 80 − _ < 77"
            say: "Which number makes this true: eighty take away something is less than seventy-seven?"
            options: ["2", "3", "4"]
            answer: "4"
          - id: l2-c19
            part: inequality
            type: true_false
            text: "Does 6 make it true? 40 + _ < 46"
            say: "Forty add six is less than forty-six. Is that true?"
            answer: false
          - id: l2-c20
            part: inequality
            type: multiple_choice
            text: "Which number does not make it true? 50 + _ < 55"
            say: "Which number does not make this true: fifty add something is less than fifty-five?"
            options: ["2", "4", "5"]
            answer: "5"
