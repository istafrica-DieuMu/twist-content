# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.neighbour-facts
skill: math.add-sub-to-20.neighbour-facts
curriculum: en-GB
language: en
title:
  de: Nachbaraufgaben
  en: Near doubles and near facts
summary: >
  Working out a harder addition from an easier one you already know.
  Lesson 1 uses doubles: 6 + 7 is one more than 6 + 6. Lesson 2 uses any
  known fact next door, one more or one less (8 + 9 from 8 + 8 or 9 + 9,
  5 + 9 from 5 + 10), and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-to-10, math.numbers-to-20.double-halve-to-20]
  also_practises: [math.add-sub-to-20.commutative]
  vocabulary: { en: [double, near double, one more, one less, known fact] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld]
  facets: []
  parts:
    - { id: helper, what: { de: "die leichte Aufgabe finden, die hilft", en: "finding the easy fact that helps" } }
    - { id: near-double, what: { de: Nachbaraufgaben mit der Verdopplung lösen, en: working out near doubles from a double } }
    - { id: with-ten, what: { de: Aufgaben mit 9 über die Aufgabe mit 10 lösen, en: working out sums with 9 from the sum with 10 } }
  misconceptions:
    - id: adjust-wrong-way
      what: Uses the double but adjusts the wrong way (7 + 8 from 8 + 8, then adds one instead of taking one away)
      addressed: lesson 2 Learn shows one less (7 + 8 from 8 + 8) and one more (9 + 8 from 8 + 8) on the frame; feedback names the direction in the full stage
    - id: double-the-wrong-number
      what: Uses a double that is two away (5 + 5 for 6 + 7)
      addressed: hints say to double one of the two numbers; options include a double that is two away, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Fast verdoppeln, en: Near doubles }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 + 6 = _"
            say: "Double six."
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "8 + 8 = _"
            say: "Double eight."
            answer: "16"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6 + 6 = 12"
            say: "You know your doubles. Six add six is twelve."
            show: { drawn: zwanzigerfeld, filled: [6, 6] }
          - text: "6 + 7 = 13"
            say: "Six add seven has just one more counter. So it is one more than double six: thirteen."
            show: { drawn: zwanzigerfeld, filled: [6, 7] }
          - text: "6 + 7 = 6 + 6 + 1"
            say: "When two numbers are next to each other, double the smaller one and add one. That is a near double."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which double helps with 5 + 6?"
                say: "Five add six. Which double helps?"
                options: ["5 + 5", "4 + 4", "8 + 8"]
                answer: "5 + 5"
                feedback:
                  "4 + 4": "Four is not in the sum. Double the smaller number, five."
                hints:
                  - "Five and six are next to each other."
                  - "Double the smaller one."
                  - "5 + 5."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Use a double."
                say: "Seven add eight. Use double seven."
                frame: "7 + 8 = 7 + 7 + _ = _"
                options: ["1", "2", "14", "15"]
                answer: ["1", "15"]
                hints:
                  - "Eight is one more than seven."
                  - "Double seven is fourteen."
                  - "14 + 1 = 15."
              - id: l1-f3
                type: text_input
                text: "4 + 5 = _"
                say: "Four add five. Think of double four."
                answer: "9"
                hints:
                  - "Double four is eight."
                  - "Five is one more than four."
                  - "8 + 1 = 9."
              - id: l1-f4
                type: true_false
                text: "Is it true? 8 + 9 is one more than 8 + 8."
                answer: true
                hints:
                  - "Nine is one more than eight."
                  - "So the total is one more."
                  - "Yes."
              - id: l1-f5
                type: multiple_choice
                text: "3 + 3 = 6. What is 3 + 4?"
                say: "Three add three is six. What is three add four?"
                options: ["5", "7", "8"]
                answer: "7"
                feedback:
                  "5": "Four is one more than three, so the total goes up by one, not down."
                hints:
                  - "Four is one more than three."
                  - "One more than six."
                  - "7."
              - id: l1-f6
                type: text_input
                text: "9 + 10 = _"
                say: "Nine add ten. Use a double."
                answer: "19"
                hints:
                  - "Double nine is eighteen."
                  - "Ten is one more than nine."
                  - "19."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which double helps with 8 + 9?"
                say: "Eight add nine. Which double helps?"
                options: ["8 + 8", "7 + 7", "10 + 10"]
                answer: "8 + 8"
                hints: ["Double the smaller number."]
              - id: l1-s2
                type: fill_in_blank
                text: "Use a double."
                say: "Six add seven. Use double six."
                frame: "6 + 7 = 6 + 6 + _ = _"
                options: ["1", "2", "12", "13"]
                answer: ["1", "13"]
                hints: ["How much more is seven than six?"]
              - id: l1-s3
                type: text_input
                text: "5 + 6 = _"
                say: "Five add six."
                answer: "11"
                hints: ["Start from double five."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 7 + 8 = 16"
                answer: false
                hints: ["Work it out from double seven."]
              - id: l1-s5
                type: multiple_choice
                text: "4 + 4 = 8. What is 4 + 5?"
                say: "Four add four is eight. What is four add five?"
                options: ["7", "9", "10"]
                answer: "9"
                hints: ["Is five one more or one less than four?"]
              - id: l1-s6
                type: text_input
                text: "2 + 3 = _"
                say: "Two add three."
                answer: "5"
                hints: ["Use double two."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which double helps with 6 + 7?"
                say: "Six add seven. Which double helps?"
                options: ["6 + 6", "5 + 5", "8 + 8"]
                answer: "6 + 6"
              - id: l1-n2
                type: fill_in_blank
                text: "Use a double."
                say: "Eight add nine. Use double eight."
                frame: "8 + 9 = 8 + 8 + _ = _"
                options: ["1", "2", "16", "17"]
                answer: ["1", "17"]
              - id: l1-n3
                type: text_input
                text: "3 + 4 = _"
                say: "Three add four."
                answer: "7"
              - id: l1-n4
                type: true_false
                text: "Is it true? 9 + 10 = 19"
                answer: true
              - id: l1-n5
                type: text_input
                text: "7 + 8 = _"
                say: "Seven add eight."
                answer: "15"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which double helps with 9 + 10?"
            say: "Nine add ten. Which double helps?"
            options: ["9 + 9", "8 + 8", "5 + 5"]
            answer: "9 + 9"
          - id: l1-c2
            type: text_input
            text: "5 + 6 = _"
            say: "Five add six."
            answer: "11"
          - id: l1-c3
            type: true_false
            text: "Is it true? 6 + 7 = 12"
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Use a double."
            say: "Nine add ten. Use double nine."
            frame: "9 + 10 = 9 + 9 + _ = _"
            options: ["1", "2", "18", "19"]
            answer: ["1", "19"]
          - id: l1-c5
            type: text_input
            text: "4 + 3 = _"
            say: "Four add three."
            answer: "7"
          - id: l1-c6
            type: multiple_choice
            text: "Which double helps with 4 + 5?"
            say: "Four add five. Which double helps?"
            options: ["4 + 4", "3 + 3", "9 + 9"]
            answer: "4 + 4"

  - n: 2
    title: { de: Nachbaraufgaben, en: One more or one less }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "7 + 8 = _"
            say: "Seven add eight. Use double seven."
            answer: "15"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "5 + 10 = _"
            say: "Five add ten."
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 + 8 = 8 + 8 − 1 = 15"
            say: "Seven add eight can also come from double eight. Seven is one less than eight, so the total is one less than sixteen: fifteen."
            show: { drawn: zwanzigerfeld, filled: [7, 8] }
          - text: "5 + 9 = 5 + 10 − 1 = 14"
            say: "Adding ten is easy. Five add nine is one less than five add ten. Five add ten is fifteen, so five add nine is fourteen."
            show: { drawn: zwanzigerfeld, filled: [5, 9] }
          - text: "9 + 8 = 8 + 8 + 1 = 17"
            say: "And the other way: nine add eight. Nine is one more than eight, so the total is one more than double eight: seventeen."
            show: { drawn: zwanzigerfeld, filled: [9, 8] }
          - text: "one more number → one more total"
            say: "Check the direction. If a number in your known fact is one bigger, your total is one bigger too. If it is one smaller, take one away."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Use the fact with ten."
                say: "Six add nine. Use six add ten."
                frame: "6 + 9 = 6 + 10 − _ = _"
                options: ["1", "2", "15", "16"]
                answer: ["1", "15"]
                hints:
                  - "Nine is one less than ten."
                  - "Six add ten is sixteen."
                  - "16 − 1 = 15."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "9 + 9 = 18. What is 8 + 9?"
                say: "Nine add nine is eighteen. What is eight add nine?"
                options: ["17", "19", "16"]
                answer: "17"
                feedback:
                  "19": "Eight is one less than nine, so the total is one less: take one away."
                hints:
                  - "Is eight one more or one less than nine?"
                  - "One less, so take one away."
                  - "18 − 1 = 17."
              - id: l2-f3
                type: text_input
                text: "4 + 9 = _"
                say: "Four add nine. Think of four add ten."
                answer: "13"
                hints:
                  - "Four add ten is fourteen."
                  - "Nine is one less than ten."
                  - "13."
              - id: l2-f4
                type: true_false
                text: "Is it true? 6 + 7 = 7 + 7 − 1"
                answer: true
                hints:
                  - "Six is one less than seven."
                  - "Double seven take away one."
                  - "Yes."
              - id: l2-f5
                type: multiple_choice
                text: "Which fact helps most with 8 + 9?"
                say: "Eight add nine. Which fact that you already know helps most?"
                options: ["8 + 8 = 16", "4 + 4 = 8", "5 + 5 = 10"]
                answer: "8 + 8 = 16"
                hints:
                  - "Look for a double with one of the numbers."
                  - "Eight and nine are next to each other."
                  - "8 + 8 = 16, then one more."
              - id: l2-f6
                type: text_input
                text: "7 + 9 = _"
                say: "Seven add nine."
                answer: "16"
                hints:
                  - "Use seven add ten."
                  - "Seventeen, then one less."
                  - "16."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Use the fact with ten."
                say: "Three add nine. Use three add ten."
                frame: "3 + 9 = 3 + 10 − _ = _"
                options: ["1", "2", "12", "13"]
                answer: ["1", "12"]
                hints: ["How much less is nine than ten?"]
              - id: l2-s2
                type: multiple_choice
                text: "8 + 8 = 16. What is 7 + 8?"
                say: "Eight add eight is sixteen. What is seven add eight?"
                options: ["15", "17", "14"]
                answer: "15"
                hints: ["Is seven one more or one less than eight?"]
              - id: l2-s3
                type: text_input
                text: "8 + 9 = _"
                say: "Eight add nine."
                answer: "17"
                hints: ["Use a double next door."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 5 + 9 = 5 + 10 + 1"
                answer: false
                hints: ["Is nine one more or one less than ten?"]
              - id: l2-s5
                type: text_input
                text: "2 + 9 = _"
                say: "Two add nine."
                answer: "11"
                hints: ["Think of two add ten."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Use the fact with ten."
                say: "Eight add nine. Use eight add ten."
                frame: "8 + 9 = 8 + 10 − _ = _"
                options: ["1", "2", "17", "18"]
                answer: ["1", "17"]
              - id: l2-n2
                type: multiple_choice
                text: "6 + 6 = 12. What is 5 + 6?"
                say: "Six add six is twelve. What is five add six?"
                options: ["11", "13", "10"]
                answer: "11"
              - id: l2-n3
                type: text_input
                text: "9 + 7 = _"
                say: "Nine add seven."
                answer: "16"
              - id: l2-n4
                type: true_false
                text: "Is it true? 9 + 8 = 9 + 9 − 1"
                answer: true
              - id: l2-n5
                type: text_input
                text: "6 + 9 = _"
                say: "Six add nine."
                answer: "15"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: helper
            type: multiple_choice
            text: "Which double helps with 2 + 3?"
            say: "Two add three. Which double helps?"
            options: ["2 + 2", "4 + 4", "1 + 1"]
            answer: "2 + 2"
          - id: l2-c2
            part: with-ten
            type: fill_in_blank
            text: "Use the fact with ten."
            say: "Nine add six. Use ten add six."
            frame: "9 + 6 = 10 + 6 − _ = _"
            options: ["1", "2", "15", "16"]
            answer: ["1", "15"]
          - id: l2-c3
            part: near-double
            type: multiple_choice
            text: "6 + 6 = 12. What is 7 + 6?"
            say: "Six add six is twelve. What is seven add six?"
            options: ["13", "11", "14"]
            answer: "13"
          - id: l2-c4
            part: with-ten
            type: text_input
            text: "9 + 4 = _"
            say: "Nine add four."
            answer: "13"
          - id: l2-c5
            part: near-double
            type: true_false
            text: "Is it true? 6 + 5 = 5 + 5 + 1"
            answer: true
          - id: l2-c6
            part: helper
            type: multiple_choice
            text: "Which double helps with 1 + 2?"
            say: "One add two. Which double helps?"
            options: ["1 + 1", "3 + 3", "4 + 4"]
            answer: "1 + 1"
          - id: l2-c7
            part: helper
            type: multiple_choice
            text: "Which fact helps most with 6 + 9?"
            say: "Six add nine. Which fact that you already know helps most?"
            options: ["6 + 10 = 16", "3 + 3 = 6", "5 + 5 = 10"]
            answer: "6 + 10 = 16"
          - id: l2-c8
            part: helper
            type: multiple_choice
            text: "Which fact helps most with 9 + 5?"
            say: "Nine add five. Which fact that you already know helps most?"
            options: ["10 + 5 = 15", "7 + 7 = 14", "4 + 4 = 8"]
            answer: "10 + 5 = 15"
          - id: l2-c9
            part: helper
            type: true_false
            text: "Is it true? The double 5 + 5 helps you work out 6 + 7."
            say: "Double five helps you work out six add seven. Is it true?"
            answer: false
          - id: l2-c10
            part: helper
            type: matching
            text: "Match each sum to the double that helps."
            say: "Match each sum to the double that helps."
            pairs:
              - { left: { text: "10 + 9" }, right: { text: "9 + 9" } }
              - { left: { text: "8 + 7" }, right: { text: "7 + 7" } }
              - { left: { text: "5 + 4" }, right: { text: "4 + 4" } }
          - id: l2-c11
            part: near-double
            type: multiple_choice
            text: "2 + 2 = 4. What is 2 + 1?"
            say: "Two add two is four. What is two add one?"
            options: ["3", "5", "1"]
            answer: "3"
          - id: l2-c12
            part: near-double
            type: fill_in_blank
            text: "Use double five."
            say: "Four add five. Use double five."
            frame: "4 + 5 = 5 + 5 − _ = _"
            options: ["1", "2", "9", "11"]
            answer: ["1", "9"]
          - id: l2-c13
            part: near-double
            type: fill_in_blank
            text: "Use double three."
            say: "Four add three. Use double three."
            frame: "4 + 3 = 3 + 3 + _ = _"
            options: ["1", "2", "6", "7"]
            answer: ["1", "7"]
          - id: l2-c14
            part: near-double
            type: true_false
            text: "Is it true? 8 + 9 = 9 + 9 + 1"
            say: "Eight add nine is nine add nine add one. Is it true?"
            answer: false
          - id: l2-c15
            part: near-double
            type: text_input
            text: "Jo has 10 marbles. Her brother has 9 marbles. How many marbles do they have together?"
            say: "Jo has ten marbles. Her brother has nine marbles. How many marbles do they have together?"
            answer: "19"
          - id: l2-c16
            part: with-ten
            type: fill_in_blank
            text: "Use the fact with ten."
            say: "Nine add three. Use ten add three."
            frame: "9 + 3 = 10 + 3 − _ = _"
            options: ["1", "2", "12", "13"]
            answer: ["1", "12"]
          - id: l2-c17
            part: with-ten
            type: multiple_choice
            text: "10 + 7 = 17. What is 9 + 7?"
            say: "Ten add seven is seventeen. What is nine add seven?"
            options: ["16", "18", "15"]
            answer: "16"
          - id: l2-c18
            part: with-ten
            type: true_false
            text: "Is it true? 9 + 2 = 10 + 2 + 1"
            say: "Nine add two is ten add two add one. Is it true?"
            answer: false
          - id: l2-c19
            part: with-ten
            type: text_input
            text: "Ali reads 7 pages on Monday and 9 pages on Tuesday. How many pages does he read?"
            say: "Ali reads seven pages on Monday and nine pages on Tuesday. How many pages does he read?"
            answer: "16"
          - id: l2-c20
            part: with-ten
            type: multiple_choice
            text: "Which sum is one less than 10 + 4?"
            say: "Which sum is one less than ten add four?"
            options: ["9 + 4", "11 + 4", "10 + 5"]
            answer: "9 + 4"
