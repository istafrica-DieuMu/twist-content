                show: { drawn: number-wall, rows: [[7, 6], [13]] }
                options: ["12", "13", "11"]
                answer: "12"
              - id: l2-n4
                type: true_false
                text: "Is the wall right?"
                say: "Look at the wall. Is it right?"
                show: { drawn: number-wall, rows: [[4, 4, 5], [8, 9], [17]] }
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Fill the middle row, then the top."
                say: "Fill the two middle bricks, then the top brick."
                show: { drawn: number-wall, rows: [[5, 1, 8], [null, null], [null]] }
                frame: "_ · _ · _"
                options: ["6", "9", "14", "15"]
                answer: ["6", "9", "15"]

      - activity: check
