# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.number-walls
skill: math.add-sub-to-20.number-walls
curriculum: en-GB
language: en
title:
  de: Zahlenmauern und Rechenketten
  en: Number walls and number chains
summary: >
  Number walls (each brick is the two bricks under it added together) and
  number chains within 20. Lesson 1 fills the top of a wall and works down
  to a missing bottom brick by subtracting; lesson 2 follows number chains
  of adding and subtracting, spots what changes when a bottom brick
  changes, and ends with the skill check. Addition tables are not in this
  set yet.
metadata:
  year: year-2
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.inverse]
  also_practises: [math.add-sub-to-20.missing-addend]
  vocabulary: { en: [number wall, brick, number chain, add, subtract, pattern] }
  forms: [drawn, text, audio]
  drawn: [number-wall]
  facets: []
  parts:
    - { id: wall-up, what: { de: eine Zahlenmauer nach oben ausfüllen und prüfen, en: filling a number wall upwards and checking it } }
    - { id: wall-bottom, what: { de: einen fehlenden Stein unten finden, en: finding a missing bottom brick } }
    - { id: chain, what: { de: Rechenketten mit plus und minus rechnen, en: working through number chains that add and subtract } }
    - { id: pattern, what: { de: "sehen, was oben passiert, wenn sich unten ein Stein ändert", en: seeing what happens at the top when a bottom brick changes } }
  misconceptions:
    - id: add-for-bottom-gap
      what: Adds the two bricks it can see when the gap is at the bottom (top 12, bottom 5, so writes 17)
      addressed: Learn screen 3 works a bottom gap by subtracting from the brick above; feedback on the sum in the full stage
    - id: chain-from-start
      what: Applies every step of a chain to the first number instead of the last result
      addressed: Learn shows each result carried to the next arrow; hints say "start from the number you just made"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zahlenmauern, en: Number walls }
    goal:
      de: "Füll eine Zahlenmauer, in der jeder Stein die zwei Steine darunter zusammen ist, so wie 3 + 5 ergibt 8."
      en: "Fill a number wall where each brick is the two bricks below added together, like 3 + 5 makes 8."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 + 7 = _"
            say: "Six add seven."
            answer: "13"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Find the missing number."
            say: "Five add what equals twelve?"
            frame: "5 + _ = 12"
            options: ["7", "12", "17"]
            answer: ["7"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 + 5 = 8"
            say: "This is a number wall. Each brick is the two bricks under it added together. Three add five is eight."
            show: { drawn: number-wall, rows: [[3, 5], [8]] }
          - text: "4 + 2 = 6 · 2 + 5 = 7 · 6 + 7 = 13"
            say: "A wall with three bricks at the bottom. Four add two is six. Two add five is seven. Then six add seven is thirteen at the top."
            show: { drawn: number-wall, rows: [[4, 2, 5], [6, 7], [13]] }
          - text: "12 − 5 = 7"
            say: "Sometimes a bottom brick is missing. The top is twelve and one brick is five. Five add what equals twelve? Subtract: twelve subtract five is seven."
            show: { drawn: number-wall, rows: [[5, null], [12]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Fill the top brick."
                say: "Fill the top brick of the wall."
                show: { drawn: number-wall, rows: [[6, 4], [null]] }
                frame: "_"
                options: ["2", "10", "64"]
                answer: ["10"]
                hints:
                  - "The top brick is the two bricks under it added together."
                  - "Six add four."
                  - "10."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fill the middle row, then the top."
                say: "Fill the two middle bricks, then the top brick."
                show: { drawn: number-wall, rows: [[2, 3, 4], [null, null], [null]] }
                frame: "_ · _ · _"
                options: ["5", "6", "7", "11", "12"]
                answer: ["5", "7", "12"]
                hints:
                  - "Two add three, then three add four."
                  - "The middle row is 5 and 7."
                  - "5 + 7 = 12 at the top."
              - id: l1-f3
                type: fill_in_blank
                text: "Find the missing bottom brick."
                say: "The top is fifteen and one bottom brick is nine. Find the other one."
                show: { drawn: number-wall, rows: [[9, null], [15]] }
                frame: "_"
                options: ["6", "15", "24"]
                answer: ["6"]
                feedback:
                  "24": "Twenty-four is nine add fifteen. The top is the biggest brick, so subtract: fifteen subtract nine."
                hints:
                  - "Nine add what equals fifteen?"
                  - "Subtract: fifteen subtract nine."
                  - "6."
              - id: l1-f4
                type: true_false
                text: "Is the wall right?"
                say: "Look at the wall. Is it right?"
                show: { drawn: number-wall, rows: [[7, 5], [13]] }
                answer: false
                hints:
                  - "Add the two bottom bricks."
                  - "Seven add five is twelve."
                  - "No, the top should be 12."
              - id: l1-f5
                type: fill_in_blank
                text: "Find the missing bottom brick."
                say: "The top is eleven and one bottom brick is three. Find the other one."
                show: { drawn: number-wall, rows: [[null, 3], [11]] }
                frame: "_"
                options: ["8", "11", "14"]
                answer: ["8"]
                hints:
