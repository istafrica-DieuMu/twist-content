  - n: 2
    title: { de: Rechenketten, en: Number chains }
    goal:
      de: "Folge Rechenketten Schritt für Schritt, so wie 4 und 3 sind 7, dann 5 dazu sind 12."
      en: "Follow number chains step by step, like 4 add 3 makes 7, then add 5 makes 12."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Fill the top brick."
            say: "Fill the top brick of the wall."
            show: { drawn: number-wall, rows: [[5, 8], [null]] }
            frame: "_"
            options: ["3", "13", "14"]
            answer: ["13"]
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "15 − 7 = _"
            say: "Fifteen subtract seven."
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4 → +3 → 7 → +5 → 12"
            say: "This is a number chain. Start at four. Add three: seven. Then add five to seven: twelve. Each step starts from the number you just made."
          - text: "15 → −6 → 9 → +4 → 13"
            say: "Chains can subtract too. Fifteen subtract six is nine. Nine add four is thirteen."
          - text: "3 + 4 = 7"
            say: "Back to walls. Here the bottom bricks are three and four, and the top is seven."
            show: { drawn: number-wall, rows: [[3, 4], [7]] }
          - text: "3 + 5 = 8"
            say: "Now the four changes to five: one bigger. The top changes from seven to eight: one bigger too. If a bottom brick gets two bigger, the top gets two bigger. If it gets one smaller, the top gets one smaller."
            show: { drawn: number-wall, rows: [[3, 5], [8]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "5 → +4 → _ → +6 → _"
                say: "Start at five. Add four, then add six."
                frame: "5 → +4 → _ → +6 → _"
                options: ["9", "11", "15", "16"]
                answer: ["9", "15"]
                feedback:
                  "11": "Eleven is five add six. Add six to the number you just made, nine."
                hints:
                  - "Five add four first."
                  - "Then add six to nine."
                  - "9, then 15."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "14 → −5 → _ → +3 → _"
                say: "Start at fourteen. Subtract five, then add three."
                frame: "14 → −5 → _ → +3 → _"
                options: ["9", "12", "17", "19"]
                answer: ["9", "12"]
                hints:
                  - "Fourteen subtract five first."
                  - "Then add three to nine."
                  - "9, then 12."
              - id: l2-f3
                type: multiple_choice
                text: "The 4 changes to 5. What is the top now?"
                say: "In this wall the bottom bricks are four and nine, and the top is thirteen. The four changes to five. What is the top now?"
                show: { drawn: number-wall, rows: [[4, 9], [13]] }
                options: ["14", "13", "15"]
                answer: "14"
                hints:
                  - "Four add nine was thirteen."
                  - "One bottom brick is one bigger."
                  - "So the top is one bigger: 14."
              - id: l2-f4
                type: true_false
                text: "Is it true? 8 → +7 → 15 → −9 → 6"
                answer: true
                hints:
                  - "Eight add seven is fifteen."
                  - "Fifteen subtract nine is six."
                  - "Yes."
              - id: l2-f5
                type: fill_in_blank
                text: "Fill the middle row, then the top."
                say: "Fill the two middle bricks, then the top brick."
                show: { drawn: number-wall, rows: [[6, 2, 7], [null, null], [null]] }
                frame: "_ · _ · _"
                options: ["8", "9", "16", "17"]
                answer: ["8", "9", "17"]
                hints:
                  - "Six add two, then two add seven."
                  - "8 and 9."
                  - "8 + 9 = 17."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "7 → +6 → _ → −4 → _"
                say: "Start at seven. Add six, then subtract four."
                frame: "7 → +6 → _ → −4 → _"
                options: ["9", "13", "3", "17"]
                answer: ["13", "9"]
                hints: ["Start each step from the number you just made."]
              - id: l2-s2
                type: fill_in_blank
                text: "20 → −8 → _ → −5 → _"
                say: "Start at twenty. Subtract eight, then subtract five."
                frame: "20 → −8 → _ → −5 → _"
                options: ["7", "12", "15", "13"]
                answer: ["12", "7"]
                hints: ["One step at a time."]
              - id: l2-s3
                type: multiple_choice
                text: "The bottom bricks are 3 and 6. The 6 changes to 8. What happens to the top?"
                say: "In a wall with bottom bricks three and six, the six changes to eight. What happens to the top?"
                options: ["It goes up by 2.", "It goes up by 1.", "It stays the same."]
                answer: "It goes up by 2."
                hints: ["How much bigger is eight than six?"]
              - id: l2-s4
                type: true_false
                text: "Is it true? 6 → +9 → 15 → −7 → 9"
                answer: false
                hints: ["Check each step."]
              - id: l2-s5
                type: fill_in_blank
                text: "Find the missing bottom brick."
                say: "The top is eighteen and one bottom brick is ten. Find the other one."
                show: { drawn: number-wall, rows: [[10, null], [18]] }
                frame: "_"
                options: ["8", "18", "28"]
                answer: ["8"]
                hints: ["Subtract from the top brick."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "9 → +8 → _ → −6 → _"
                say: "Start at nine. Add eight, then subtract six."
