# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.money-shopping
skill: math.money.shopping
curriculum: en-GB
language: en
title:
  de: Einkaufen und Rückgeld
  en: Shopping and change
summary: >
  Lesson 1 adds up prices (a pencil for 25p and a rubber for 30p cost
  55p) and pays with the right coins; lesson 2 works out the change by
  counting up from the price to the money paid (price 65p, paid with
  £1: 35p change), and ends with the skill check. Every calculation uses
  one unit, pence to 100p or whole pounds, as Year 2 asks; mixed pounds
  and pence come in Year 3.
metadata:
  year: year-2
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.money.amounts-to-100, math.add-sub-to-100.complement]
  also_practises: [math.add-sub-to-100.complement, math.add-sub-to-100.add-two-digit]
  vocabulary: { en: [price, cost, total, altogether, pay, change, count up, how much more] }
  forms: [drawn, text, audio]
  drawn: [coins, rechenstrich]
  facets: [currency]
  misconceptions:
    - id: change-is-price
      what: Gives the price, or the money paid, as the change
      addressed: lesson 2 Learn counts up from the price to the money paid; l2-f1 (with feedback), l2-s1 and l2-c1 offer the price as an option
    - id: change-wrong-hundred
      what: Counts up to the wrong total when paying with £1 (65p from £1 gives 45p, counting the tens wrong)
      addressed: lesson 2 Learn counts up in two hops, to the next ten and then to 100; l2-f2 (with feedback), l2-f4 and l2-s2 use the two hops
    - id: add-only-tens
      what: Adds the tens of two prices and forgets the ones (25p + 30p = 50p)
      addressed: lesson 1 Learn adds tens and then ones; l1-f1 (with feedback), l1-s1 and l1-c1 offer the tens-only total
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Preise zusammenrechnen, en: Adding up prices }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How much money?"
            say: "How much money is this?"
            show: { drawn: coins, values: [50, 20, 5] }
            options: ["75p", "3p", "70p"]
            answer: "75p"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Make 100."
            say: "Sixty and how many make one hundred?"
            frame: "60 + _ = 100"
            options: ["40", "50", "4"]
            answer: ["40"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Pencil 25p, rubber 30p"
            say: "At the school shop a pencil costs twenty-five pence and a rubber costs thirty pence. How much do they cost altogether?"
          - text: "25p + 30p = 55p"
            say: "Add the tens: twenty and thirty make fifty. Then the ones: five more. Fifty-five pence altogether."
            show: { drawn: rechenstrich, start: 25, jumps: [30] }
          - text: "55p = 50p + 5p"
            say: "To pay exactly fifty-five pence, use a fifty pence coin and a five pence coin."
            show: { drawn: coins, values: [50, 5] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A ruler costs 35p and a pen costs 20p. How much altogether?"
                say: "A ruler costs thirty-five pence and a pen costs twenty pence. How much do they cost altogether?"
                options: ["55p", "50p", "15p"]
                answer: "55p"
                feedback:
                  "50p": "Thirty and twenty make fifty, but the five pence is still there: fifty-five."
                hints:
                  - "Add the tens, then the ones."
                  - "Thirty and twenty are fifty. Then add five."
                  - "55p."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "An apple costs 30p and a banana costs 25p. How many pence altogether?"
                say: "An apple costs thirty pence and a banana costs twenty-five pence. How many pence do they cost altogether?"
                show: { drawn: rechenstrich, start: 30, jumps: [20, 5] }
                answer: "55"
                hints:
                  - "Start at thirty and add twenty-five."
                  - "Thirty and twenty is fifty, and five more."
                  - "55."
              - id: l1-f3
                type: image_multiple_choice
                text: "A sticker costs 45p. Which coins pay exactly 45p?"
                say: "A sticker costs forty-five pence. Which coins pay exactly the right amount?"
                options:
                  - { drawn: coins, values: [20, 20, 5] }
                  - { drawn: coins, values: [20, 20, 2] }
                  - { drawn: coins, values: [50, 5] }
                answer: "45"
                hints:
                  - "Count each group."
                  - "Twenty, forty, forty-five."
                  - "20p, 20p and 5p."
              - id: l1-f4
                type: multiple_choice
                text: "A book costs £8 and a game costs £6. How much altogether?"
                say: "A book costs eight pounds and a game costs six pounds. How much do they cost altogether?"
                options: ["£14", "£2", "£13"]
                answer: "£14"
                hints:
                  - "Add eight and six."
                  - "Eight and two make ten, and four more."
                  - "£14."
              - id: l1-f5
                type: true_false
                text: "Is it true? A drink for 40p and a biscuit for 15p cost 55p."
                say: "A drink costs forty pence and a biscuit costs fifteen pence. Together they cost fifty-five pence. Is that true?"
                answer: true
                hints:
                  - "Add forty and fifteen."
                  - "Forty and ten are fifty, and five more."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A lolly costs 45p and a juice costs 30p. How much altogether?"
                say: "A lolly costs forty-five pence and a juice costs thirty pence. How much altogether?"
                options: ["75p", "70p", "15p"]
                answer: "75p"
                hints: ["Tens first, then the ones."]
              - id: l1-s2
                type: text_input
                text: "A comic costs £5 and a puzzle costs £9. How many pounds altogether?"
                say: "A comic costs five pounds and a puzzle costs nine pounds. How many pounds altogether?"
                answer: "14"
                hints: ["Nine and one make ten. Then the rest."]
              - id: l1-s3
                type: image_multiple_choice
                text: "A cake costs 60p. Which coins pay exactly 60p?"
                say: "A cake costs sixty pence. Which coins pay exactly the right amount?"
                options:
                  - { drawn: coins, values: [50, 10] }
                  - { drawn: coins, values: [50, 5] }
                  - { drawn: coins, values: [20, 20, 10] }
                answer: "60"
                hints: ["Count each group in pence."]
              - id: l1-s4
                type: true_false
                text: "Is it true? Two pens at 20p each cost 22p."
                say: "Two pens cost twenty pence each. Together they cost twenty-two pence. Is that true?"
                answer: false
                hints: ["Twenty pence and twenty pence."]
              - id: l1-s5
                type: text_input
                text: "A pencil costs 15p, a rubber 10p and a sharpener 20p. How many pence altogether?"
                say: "A pencil costs fifteen pence, a rubber ten pence and a sharpener twenty pence. How many pence altogether?"
                answer: "45"
                hints: ["Add them one at a time: fifteen, then ten, then twenty."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "A ball costs 50p and a whistle costs 35p. How many pence altogether?"
                say: "A ball costs fifty pence and a whistle costs thirty-five pence. How many pence altogether?"
                answer: "85"
              - id: l1-n2
                type: multiple_choice
                text: "A hat costs £12 and a scarf costs £7. How much altogether?"
                say: "A hat costs twelve pounds and a scarf costs seven pounds. How much altogether?"
                options: ["£19", "£5", "£18"]
                answer: "£19"
              - id: l1-n3
                type: image_multiple_choice
                text: "A badge costs 32p. Which coins pay exactly 32p?"
                say: "A badge costs thirty-two pence. Which coins pay exactly the right amount?"
                options:
                  - { drawn: coins, values: [20, 10, 2] }
                  - { drawn: coins, values: [20, 10, 1] }
                  - { drawn: coins, values: [20, 5, 2] }
                answer: "32"
              - id: l1-n4
                type: true_false
                text: "Is it true? Crisps for 35p and an apple for 25p cost 60p."
                say: "Crisps cost thirty-five pence and an apple costs twenty-five pence. Together they cost sixty pence. Is that true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "Three stickers cost 10p each. How many pence altogether?"
                say: "Three stickers cost ten pence each. How many pence altogether?"
                answer: "30"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A pen costs 25p and a notebook costs 40p. How much altogether?"
            say: "A pen costs twenty-five pence and a notebook costs forty pence. How much altogether?"
            options: ["65p", "60p", "15p"]
            answer: "65p"
          - id: l1-c2
            type: text_input
            text: "A kite costs £15 and a ball costs £4. How many pounds altogether?"
            say: "A kite costs fifteen pounds and a ball costs four pounds. How many pounds altogether?"
            answer: "19"
          - id: l1-c3
            type: image_multiple_choice
            text: "A rubber costs 70p. Which coins pay exactly 70p?"
            say: "A rubber costs seventy pence. Which coins pay exactly the right amount?"
            options:
              - { drawn: coins, values: [50, 20] }
              - { drawn: coins, values: [50, 10] }
              - { drawn: coins, values: [20, 20, 20, 5] }
            answer: "70"

  - n: 2
    title: { de: Rückgeld, en: Giving change }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "A pear costs 40p and a plum costs 15p. How many pence altogether?"
            say: "A pear costs forty pence and a plum costs fifteen pence. How many pence altogether?"
            answer: "55"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "A drink costs 55p. Which coins pay exactly 55p?"
            say: "A drink costs fifty-five pence. Which coins pay exactly the right amount?"
            options:
              - { drawn: coins, values: [50, 5] }
              - { drawn: coins, values: [50, 2] }
              - { drawn: coins, values: [20, 20, 10] }
            answer: "55"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Price 65p. Paid with £1."
            say: "A sandwich costs sixty-five pence. Maya pays with a one pound coin. One pound is one hundred pence. How much change does she get?"
            show: { drawn: coins, values: [100] }
          - text: "65p → 70p → 100p"
            say: "Count up from the price. Sixty-five to seventy is five. Seventy to one hundred is thirty. Five and thirty make thirty-five."
            show: { drawn: rechenstrich, start: 65, jumps: [5, 30] }
          - text: "Change: 35p"
            say: "Maya gets thirty-five pence change. Check: sixty-five and thirty-five make one hundred."
            show: { drawn: coins, values: [20, 10, 5] }
          - text: "Price £17. Paid with £20. Change: £3"
            say: "It works with pounds too. A game costs seventeen pounds. Pay with a twenty pound note. Seventeen to twenty is three: three pounds change."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "A toy car costs 80p. Leo pays with £1. How much change?"
                say: "A toy car costs eighty pence. Leo pays with one pound. How much change does he get?"
                show: { drawn: rechenstrich, start: 80, jumps: [] }
                options: ["20p", "80p", "30p"]
                answer: "20p"
                feedback:
                  "80p": "Eighty pence is the price. The change is what is left from one hundred pence."
                hints:
                  - "Count up from eighty to one hundred."
                  - "Eighty, ninety, one hundred: two tens."
                  - "20p."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "A pen costs 45p. Pay with £1. Count up in two hops."
                say: "A pen costs forty-five pence. You pay with one pound. Count up in two hops."
                show: { drawn: rechenstrich, start: 45, jumps: [5, 50] }
                frame: "45p + _p = 50p · 50p + _p = 100p · change: _p"
                options: ["5", "50", "55", "65"]
                answer: ["5", "50", "55"]
                feedback:
                  "65": "Count the hops again: five to fifty, then fifty to one hundred. Five and fifty make fifty-five."
                hints:
                  - "First hop to the next ten."
                  - "Forty-five to fifty is five. Fifty to one hundred is fifty."
                  - "5, 50 and 55."
              - id: l2-f3
                type: text_input
                text: "A book costs £6. Ali pays with a £10 note. How many pounds change?"
                say: "A book costs six pounds. Ali pays with a ten pound note. How many pounds change does he get?"
                answer: "4"
                hints:
                  - "Count up from six to ten."
                  - "Six and four make ten."
                  - "4."
              - id: l2-f4
                type: multiple_choice
                text: "A cake costs 35p. Zara pays with 50p. How much change?"
                say: "A cake costs thirty-five pence. Zara pays with a fifty pence coin. How much change does she get?"
                show: { drawn: rechenstrich, start: 35, jumps: [5, 10] }
                options: ["15p", "25p", "35p"]
                answer: "15p"
                hints:
                  - "Count up from thirty-five to fifty."
                  - "Five to forty, then ten to fifty."
                  - "15p."
              - id: l2-f5
                type: true_false
                text: "Is it true? Price 70p, paid with £1, change 30p."
                say: "A drink costs seventy pence. You pay with one pound and get thirty pence change. Is that true?"
                answer: true
                hints:
                  - "Seventy and the change must make one hundred."
                  - "Seventy and thirty make one hundred."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A sticker book costs 60p. Kai pays with £1. How much change?"
                say: "A sticker book costs sixty pence. Kai pays with one pound. How much change does he get?"
                options: ["40p", "60p", "50p"]
                answer: "40p"
                hints: ["Count up from sixty to one hundred."]
              - id: l2-s2
                type: text_input
                text: "A comic costs 75p. Pay with £1. How many pence change?"
                say: "A comic costs seventy-five pence. You pay with one pound. How many pence change?"
                show: { drawn: rechenstrich, start: 75, jumps: [] }
                answer: "25"
                hints: ["Seventy-five to eighty, then eighty to one hundred."]
              - id: l2-s3
                type: text_input
                text: "A T-shirt costs £14. Pay with a £20 note. How many pounds change?"
                say: "A T-shirt costs fourteen pounds. You pay with a twenty pound note. How many pounds change?"
                answer: "6"
                hints: ["Count up from fourteen to twenty."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Price 85p, paid with £1. Which coins are the change?"
                say: "A snack costs eighty-five pence. You pay with one pound. Which coins are the right change?"
                options:
                  - { drawn: coins, values: [10, 5] }
                  - { drawn: coins, values: [10, 2] }
                  - { drawn: coins, values: [20, 5] }
                answer: "15"
                hints: ["Eighty-five and how much make one hundred?"]
              - id: l2-s5
                type: true_false
                text: "Is it true? Price 40p, paid with 50p, change 20p."
                say: "A biscuit costs forty pence. You pay with fifty pence and get twenty pence change. Is that true?"
                answer: false
                hints: ["Count up from forty to fifty."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "A ball costs 55p. Pay with £1. How many pence change?"
                say: "A ball costs fifty-five pence. You pay with one pound. How many pence change?"
                answer: "45"
              - id: l2-n2
                type: multiple_choice
                text: "A puzzle costs £8. Pay with a £10 note. How much change?"
                say: "A puzzle costs eight pounds. You pay with a ten pound note. How much change?"
                options: ["£2", "£8", "£18"]
                answer: "£2"
              - id: l2-n3
                type: text_input
                text: "A pen costs 30p and a rubber costs 20p. Pay with £1. How many pence change?"
                say: "A pen costs thirty pence and a rubber costs twenty pence. You pay for both with one pound. How many pence change?"
                answer: "50"
              - id: l2-n4
                type: image_multiple_choice
                text: "Price 90p, paid with £1. Which coin is the change?"
                say: "A drink costs ninety pence. You pay with one pound. Which coin is the right change?"
                options:
                  - { drawn: coins, values: [10] }
                  - { drawn: coins, values: [20] }
                  - { drawn: coins, values: [1] }
                answer: "10"
              - id: l2-n5
                type: text_input
                text: "A game costs £35. Pay with a £50 note. How many pounds change?"
                say: "A game costs thirty-five pounds. You pay with a fifty pound note. How many pounds change?"
                answer: "15"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "A yo-yo costs 35p. Pay with £1. How much change?"
            say: "A yo-yo costs thirty-five pence. You pay with one pound. How much change?"
            options: ["65p", "35p", "75p"]
            answer: "65p"
          - id: l2-c2
            type: text_input
            text: "A pencil case costs 45p and a ruler costs 25p. How many pence altogether?"
            say: "A pencil case costs forty-five pence and a ruler costs twenty-five pence. How many pence altogether?"
            answer: "70"
          - id: l2-c3
            type: image_multiple_choice
            text: "A balloon costs 28p. Which coins pay exactly 28p?"
            say: "A balloon costs twenty-eight pence. Which coins pay exactly the right amount?"
            options:
              - { drawn: coins, values: [20, 5, 2, 1] }
              - { drawn: coins, values: [20, 5, 2] }
              - { drawn: coins, values: [20, 10] }
            answer: "28"
          - id: l2-c4
            type: text_input
            text: "A bike helmet costs £16. Pay with a £20 note. How many pounds change?"
            say: "A bike helmet costs sixteen pounds. You pay with a twenty pound note. How many pounds change?"
            answer: "4"
          - id: l2-c5
            type: true_false
            text: "Is it true? Price 25p, paid with 50p, change 25p."
            say: "A lolly costs twenty-five pence. You pay with fifty pence and get twenty-five pence change. Is that true?"
            answer: true
