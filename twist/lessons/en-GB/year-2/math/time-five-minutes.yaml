# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.time-five-minutes
skill: math.time.five-minutes
curriculum: en-GB
language: en
title:
  de: Uhrzeit auf fünf Minuten genau
  en: Time to five minutes
summary: >
  Telling the time to five minutes. Lesson 1 counts the minute hand in
  fives and reads the times past the hour (on the 4 it is twenty past);
  lesson 2 reads the times to the next hour (twenty-five to four), matches
  them to digital times, learns that an hour has 60 minutes and a day 24
  hours, and ends with the skill check. Every practise stage and both
  checks also ask the child to set the hands to five minutes
  (clock_hands_drag).
metadata:
  year: year-2
  topic: { de: Uhrzeit, en: Telling the time }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.time.quarter-hours, math.mult-div.table-5-10]
  also_practises: [math.mult-div.table-5-10, math.time.quarter-hours]
  vocabulary: { en: [minute hand, hour hand, minutes, hour, day, past, to, o'clock, digital] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: []
  parts:
    - { id: past, what: { de: Uhrzeiten nach der vollen Stunde auf fünf Minuten genau ablesen, en: reading times past the hour to five minutes } }
    - { id: to, what: { de: Uhrzeiten vor der vollen Stunde auf fünf Minuten genau ablesen, en: reading times to the hour to five minutes } }
    - { id: set, what: { de: die Zeiger auf fünf Minuten genau stellen, en: setting the hands to five minutes } }
    - { id: units, what: { de: "wissen, dass eine Stunde 60 Minuten und ein Tag 24 Stunden hat", en: knowing that an hour has 60 minutes and a day 24 hours } }
  misconceptions:
    - id: number-is-minutes
      what: Reads the number the minute hand points to as the minutes (on the 4 it is 4 minutes)
      addressed: lesson 1 Learn counts in fives; l1-f1, l1-s1, l1-n1 and l1-c3 offer the plain number, with feedback in l1-f1
    - id: past-to-hour
      what: Names the wrong hour for times to the hour (3:35 read as twenty-five to three)
      addressed: lesson 2 Learn reads 3:35 against four o'clock; l2-f1, l2-s1, l2-n1 and l2-c2 offer the hour just gone, with feedback in l2-f1
    - id: twelve-hours-a-day
      what: Thinks a day has 12 hours because the clock shows 12
      addressed: lesson 2 Learn says the hour hand goes round twice a day; l2-s4 and l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Minuten nach der vollen Stunde, en: Minutes past the hour }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Count in fives."
            say: "Count in fives. Which number is missing?"
            frame: "5, 10, 15, _, 25"
            options: ["20", "16", "30"]
            answer: ["20"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 6, minute: 15 }
            options: ["quarter past 6", "quarter to 6", "half past 6"]
            answer: "quarter past 6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5, 10, 15, 20"
            say: "From one number to the next, the minute hand moves five minutes. When it points to the 4, count in fives: five, ten, fifteen, twenty. It is twenty minutes past the hour."
            show: { drawn: clock, hour: 3, minute: 20 }
          - text: "10 past 3 = 3:10"
            say: "The minute hand points to the 2. That is ten minutes past three. We say ten past three. A digital clock shows three, ten."
            show: { drawn: clock, hour: 3, minute: 10, digital: true }
          - text: "25 past 3 = 3:25"
            say: "Now the minute hand points to the 5: twenty-five minutes past three. The hour hand has moved a little past the 3, but not yet halfway to the 4."
            show: { drawn: clock, hour: 3, minute: 25, digital: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many minutes past the hour?"
                say: "The minute hand points to the 5. How many minutes past the hour is it?"
                show: { drawn: clock, hour: 8, minute: 25 }
                options: ["25", "5", "50"]
                answer: "25"
                feedback:
                  "5": "Each number on the clock is five minutes. Count in fives up to the 5."
                hints:
                  - "Count in fives up to the 5."
                  - "On the 1 it is five minutes, on the 2 it is ten. Keep counting to the 5."
                  - "25."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 2, minute: 5 }
                options: ["5 past 2", "5 to 2", "10 past 2"]
                answer: "5 past 2"
                hints:
                  - "Where is the minute hand pointing?"
                  - "It points to the 1. How many minutes is that?"
                  - "5 past 2."
              - id: l1-f3
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 11, minute: 20 }
                options: ["20 past 11", "4 past 11", "20 past 12"]
                answer: "20 past 11"
                feedback:
                  "4 past 11": "The minute hand points to the 4, and each number is five minutes. Count four fives."
                hints:
                  - "Count in fives up to the minute hand."
                  - "It points to the 4: five, ten, fifteen, twenty."
                  - "20 past 11."
              - id: l1-f4
                type: true_false
                text: "Is it 10 past 9?"
                say: "Look at the clock. Is it ten past nine?"
                show: { drawn: clock, hour: 9, minute: 10 }
                answer: true
                hints:
                  - "Count in fives up to the minute hand."
                  - "It points to the 2. Two fives make ten."
                  - "Yes, it is 10 past 9."
              - id: l1-f5
                type: clock_hands_drag
                text: "Show 20 past 7 on the clock."
                say: "Show twenty past seven on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "7:20"
                feedback:
                  "4:35": "You swapped the hands. The long minute hand goes on the 4 and the short hour hand on the 7."
                  "7:40": "That is 20 to 8. Twenty past: count four fives from the 12, so the minute hand points to the 4."
                hints:
                  - "Twenty past: count in fives from the 12 to find where the minute hand goes."
                  - "Five, ten, fifteen, twenty: the minute hand points to the 4. The short hour hand goes on the 7."
                  - "Drag the long hand to the 4 and the short hand to the 7."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many minutes past the hour?"
                say: "The minute hand points to the 3. How many minutes past the hour is it?"
                show: { drawn: clock, hour: 4, minute: 15 }
                options: ["15", "3", "30"]
                answer: "15"
                hints: ["Count in fives up to the 3."]
              - id: l1-s2
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 10, minute: 10 }
                options: ["10 past 10", "2 past 10", "10 to 10"]
                answer: "10 past 10"
                hints: ["The minute hand points to the 2."]
              - id: l1-s3
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 5, minute: 25 }
                options: ["25 past 5", "5 past 5", "25 past 6"]
                answer: "25 past 5"
                hints: ["The hour hand is just past the 5. Count fives to the minute hand."]
              - id: l1-s4
                type: true_false
                text: "Is it 20 past 1?"
                say: "Look at the clock. Is it twenty past one?"
                show: { drawn: clock, hour: 1, minute: 5 }
                answer: false
                hints: ["The minute hand points to the 1. How many minutes is that?"]
              - id: l1-s5
                type: clock_hands_drag
                text: "Show 10 past 4 on the clock."
                say: "Show ten past four on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "4:10"
                feedback:
                  "2:20": "You swapped the hands. The long minute hand goes on the 2 and the short hour hand on the 4."
                  "4:50": "That is 10 to 5. Ten past: the minute hand points to the 2."
                hints: ["Ten past: the minute hand points to the 2."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many minutes past the hour?"
                say: "The minute hand points to the 4. How many minutes past the hour is it?"
                show: { drawn: clock, hour: 12, minute: 20 }
                options: ["20", "4", "40"]
                answer: "20"
              - id: l1-n2
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 6, minute: 25 }
                options: ["25 past 6", "5 past 6", "25 past 5"]
                answer: "25 past 6"
              - id: l1-n3
                type: true_false
                text: "Is it 5 past 8?"
                say: "Look at the clock. Is it five past eight?"
                show: { drawn: clock, hour: 8, minute: 5 }
                answer: true
              - id: l1-n4
                type: clock_hands_drag
                text: "Show 20 past 3 on the clock."
                say: "Show twenty past three on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "3:20"
                feedback:
                  "4:15": "You swapped the hands. The long minute hand goes on the 4 and the short hour hand on the 3."
              - id: l1-n5
                type: multiple_choice
                text: "25 past 11. What does the digital clock show?"
                say: "Twenty-five past eleven. What does the digital clock show?"
                options: ["11:25", "11:05", "5:11"]
                answer: "11:25"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 9, minute: 25 }
            options: ["25 past 9", "5 past 9", "25 past 10"]
            answer: "25 past 9"
          - id: l1-c2
            type: clock_hands_drag
            text: "Show 10 past 2 on the clock."
            say: "Show ten past two on the clock. Drag the hands."
            show: { drawn: clock, hour: 9, minute: 0 }
            step: 5
            answer: "2:10"
            feedback:
              "1:50": "That is 10 to 2. Ten past 2 comes after 2 o'clock: the minute hand points to the 2."
          - id: l1-c3
            type: multiple_choice
            text: "How many minutes past the hour?"
            say: "The minute hand points to the 1. How many minutes past the hour is it?"
            show: { drawn: clock, hour: 7, minute: 5 }
            options: ["5", "1", "10"]
            answer: "5"
          - id: l1-c4
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 12, minute: 10 }
            options: ["10 past 12", "2 past 12", "10 past 1"]
            answer: "10 past 12"
          - id: l1-c5
            type: true_false
            text: "Is it 25 past 3?"
            say: "Look at the clock. Is it twenty-five past three?"
            show: { drawn: clock, hour: 3, minute: 20 }
            answer: false
          - id: l1-c6
            type: clock_hands_drag
            text: "Show 5 past 6 on the clock."
            say: "Show five past six on the clock. Drag the hands."
            show: { drawn: clock, hour: 9, minute: 0 }
            step: 5
            answer: "6:05"

  - n: 2
    title: { de: Minuten bis zur vollen Stunde, en: Minutes to the hour }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 1, minute: 10 }
            options: ["10 past 1", "2 past 1", "10 to 1"]
            answer: "10 past 1"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 4, minute: 30 }
            options: ["half past 4", "half past 5", "4 o'clock"]
            answer: "half past 4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "25 to 4 = 3:35"
            say: "After half past, we count the minutes still to go until the next hour. Here the minute hand points to the 7. From the 7 to the 12 is twenty-five minutes, so it is twenty-five to four. The hour hand is past halfway to the 4. A digital clock shows three, thirty-five."
            show: { drawn: clock, hour: 3, minute: 35, digital: true }
          - text: "10 to 4 = 3:50"
            say: "Now the minute hand points to the 10. Two more fives, ten minutes, until four o'clock. We say ten to four. The digital clock still shows the hour that has not finished: three, fifty."
            show: { drawn: clock, hour: 3, minute: 50, digital: true }
          - text: "1 hour = 60 minutes\n1 day = 24 hours"
            say: "When the minute hand goes all the way round, one hour has passed. That is twelve fives: sixty minutes. In one whole day and night, the hour hand goes round twice, so a day has twenty-four hours."
            show: { drawn: clock, hour: 12, minute: 0 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 6, minute: 40 }
                options: ["20 to 7", "20 to 6", "20 past 7"]
                answer: "20 to 7"
                feedback:
                  "20 to 6": "Six o'clock has already gone. The next hour is seven, so it is twenty to seven."
                hints:
                  - "The minute hand is past half past. Count the minutes still to go to the 12."
                  - "From the 8 to the 12 is four fives: twenty. Which hour comes next?"
                  - "20 to 7."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 9, minute: 55 }
                options: ["5 to 10", "5 past 10", "11 past 9"]
                answer: "5 to 10"
                hints:
                  - "How far is the minute hand from the 12?"
                  - "It is on the 11, one five away. The next hour is ten."
                  - "5 to 10."
              - id: l2-f3
                type: multiple_choice
                text: "25 to 2. What does the digital clock show?"
                say: "Twenty-five to two. What does the digital clock show?"
                options: ["1:35", "2:25", "2:35"]
                answer: "1:35"
                hints:
                  - "Twenty-five to two is before two o'clock, so the hour is still one."
                  - "Sixty minutes take away twenty-five is thirty-five."
                  - "1:35."
              - id: l2-f4
                type: true_false
                text: "There are 60 minutes in an hour."
                say: "There are sixty minutes in an hour. Is that true?"
                answer: true
                hints:
                  - "How many fives does the minute hand pass in one whole turn?"
                  - "Twelve fives."
                  - "Yes, 60 minutes."
              - id: l2-f5
                type: clock_hands_drag
                text: "Show 10 to 8 on the clock."
                say: "Show ten to eight on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "7:50"
                feedback:
                  "8:10": "That is 10 past 8. Ten to eight is before eight o'clock: the minute hand points to the 10."
                  "8:50": "That is 10 to 9. Ten to 8 comes before 8 o'clock, so drag the hour hand to the 7. It sits nearly at the 8."
                hints:
                  - "Ten to eight is just before eight o'clock."
                  - "The minute hand points to the 10, and the hour hand is nearly at the 8."
                  - "Drag the long hand to the 10 and the short hand to the 7. It moves on to just before the 8."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 11, minute: 35 }
                options: ["25 to 12", "25 to 11", "35 to 12"]
                answer: "25 to 12"
                hints: ["Which hour comes next?"]
              - id: l2-s2
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 2, minute: 45 }
                options: ["quarter to 3", "quarter past 3", "quarter to 2"]
                answer: "quarter to 3"
                hints: ["The minute hand is on the 9. How many minutes until three o'clock?"]
              - id: l2-s3
                type: multiple_choice
                text: "5 to 6. What does the digital clock show?"
                say: "Five to six. What does the digital clock show?"
                options: ["5:55", "6:05", "6:55"]
                answer: "5:55"
                hints: ["Five to six is before six o'clock."]
              - id: l2-s4
                type: true_false
                text: "There are 12 hours in a day."
                say: "There are twelve hours in a whole day. Is that true?"
                answer: false
                hints: ["The hour hand goes round twice in a day and a night."]
              - id: l2-s5
                type: clock_hands_drag
                text: "Show 20 to 9 on the clock."
                say: "Show twenty to nine on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "8:40"
                feedback:
                  "9:20": "That is 20 past 9. Twenty to nine is before nine o'clock: the minute hand points to the 8."
                  "9:40": "That is 20 to 10. Drag the hour hand to the 8. It sits nearly at the 9."
                hints: ["Twenty to nine is before nine o'clock: the minute hand points to the 8."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 4, minute: 50 }
                options: ["10 to 5", "10 to 4", "10 past 5"]
                answer: "10 to 5"
              - id: l2-n2
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 12, minute: 35 }
                options: ["25 to 1", "25 past 12", "7 past 12"]
                answer: "25 to 1"
              - id: l2-n3
                type: multiple_choice
                text: "20 to 11. What does the digital clock show?"
                say: "Twenty to eleven. What does the digital clock show?"
                options: ["10:40", "11:20", "11:40"]
                answer: "10:40"
              - id: l2-n4
                type: text_input
                text: "How many minutes are there in an hour?"
                answer: "60"
              - id: l2-n5
                type: clock_hands_drag
                text: "Show 25 past 5 on the clock."
                say: "Show twenty-five past five on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "5:25"
                feedback:
                  "5:35": "That is 25 to 6. Twenty-five past: the minute hand points to the 5."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: past
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 1, minute: 20 }
            options: ["20 past 1", "4 past 1", "20 to 1"]
            answer: "20 past 1"
          - id: l2-c2
            part: to
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 7, minute: 35 }
            options: ["25 to 8", "25 to 7", "25 past 8"]
            answer: "25 to 8"
          - id: l2-c3
            part: to
            type: multiple_choice
            text: "10 to 12. What does the digital clock show?"
            say: "Ten to twelve. What does the digital clock show?"
            options: ["11:50", "12:10", "12:50"]
            answer: "11:50"
          - id: l2-c4
            part: set
            type: clock_hands_drag
            text: "Show 5 to 3 on the clock."
            say: "Show five to three on the clock. Drag the hands."
            show: { drawn: clock, hour: 9, minute: 0 }
            step: 5
            answer: "2:55"
            feedback:
              "3:05": "That is 5 past 3. Five to three is before three o'clock: the minute hand points to the 11."
              "3:55": "That is 5 to 4. Drag the hour hand to the 2. It sits nearly at the 3."
          - id: l2-c5
            part: units
            type: text_input
            text: "How many hours are there in a whole day?"
            answer: "24"
          - id: l2-c6
            part: past
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 4, minute: 5 }
            options: ["5 past 4", "1 past 4", "5 to 4"]
            answer: "5 past 4"
          - id: l2-c7
            part: past
            type: true_false
            text: "Is it 25 past 10?"
            say: "Look at the clock. Is it twenty-five past ten?"
            show: { drawn: clock, hour: 10, minute: 25 }
            answer: true
          - id: l2-c8
            part: past
            type: multiple_choice
            text: "20 past 6. What does the digital clock show?"
            say: "Twenty past six. What does the digital clock show?"
            options: ["6:20", "6:04", "4:06"]
            answer: "6:20"
          - id: l2-c9
            part: past
            type: multiple_choice
            text: "How many minutes past the hour?"
            say: "How many minutes past the hour is it?"
            show: { drawn: clock, hour: 2, minute: 10 }
            options: ["10", "2", "20"]
            answer: "10"
          - id: l2-c10
            part: to
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 3, minute: 40 }
            options: ["20 to 4", "20 to 3", "8 past 3"]
            answer: "20 to 4"
          - id: l2-c11
            part: to
            type: true_false
            text: "Is it 10 to 2?"
            say: "Look at the clock. Is it ten to two?"
            show: { drawn: clock, hour: 2, minute: 50 }
            answer: false
          - id: l2-c12
            part: to
            type: multiple_choice
            text: "25 to 10. What does the digital clock show?"
            say: "Twenty-five to ten. What does the digital clock show?"
            options: ["9:35", "10:25", "10:35"]
            answer: "9:35"
          - id: l2-c13
            part: set
            type: clock_hands_drag
            text: "Show 25 past 8 on the clock."
            say: "Show twenty-five past eight on the clock. Drag the hands."
            show: { drawn: clock, hour: 9, minute: 0 }
            step: 5
            answer: "8:25"
          - id: l2-c14
            part: set
            type: clock_hands_drag
            text: "Show 25 to 7 on the clock."
            say: "Show twenty-five to seven on the clock. Drag the hands."
            show: { drawn: clock, hour: 9, minute: 0 }
            step: 5
            answer: "6:35"
          - id: l2-c15
            part: set
            type: clock_hands_drag
            text: "Show 5 past 11 on the clock."
            say: "Show five past eleven on the clock. Drag the hands."
            show: { drawn: clock, hour: 9, minute: 0 }
            step: 5
            answer: "11:05"
          - id: l2-c16
            part: set
            type: clock_hands_drag
            text: "Show 10 to 6 on the clock."
            say: "Show ten to six on the clock. Drag the hands."
            show: { drawn: clock, hour: 9, minute: 0 }
            step: 5
            answer: "5:50"
          - id: l2-c17
            part: units
            type: true_false
            text: "There are 24 hours in a day."
            say: "There are twenty-four hours in a whole day. Is that true?"
            answer: true
          - id: l2-c18
            part: units
            type: multiple_choice
            text: "The minute hand goes all the way round once. How long is that?"
            say: "The minute hand goes all the way round the clock once. How long is that?"
            options: ["1 hour", "1 minute", "1 day"]
            answer: "1 hour"
          - id: l2-c19
            part: units
            type: multiple_choice
            text: "How many minutes is it from 4 o'clock to 5 o'clock?"
            say: "How many minutes is it from four o'clock to five o'clock?"
            options: ["60", "100", "12"]
            answer: "60"
          - id: l2-c20
            part: units
            type: true_false
            text: "An hour has 100 minutes."
            say: "An hour has one hundred minutes. Is that true?"
            answer: false
