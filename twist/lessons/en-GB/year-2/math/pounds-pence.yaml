# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.pounds-pence
skill: math.money.euro-cent
curriculum: en-GB
language: en
title:
  de: Pfund und Pence
  en: Pounds and pence
summary: >
  Lesson 1 learns that £1 is 100p: which coins make £1, how many pence
  are missing to make £1 (70p + 30p = £1), whole pounds in pence (£3 =
  300p), and whether an amount in pence is more or less than £1. Lesson
  2 reads and writes amounts in pounds and pence from coins (£2 and 50p),
  tells 5p from 50p and £5, compares amounts, and ends with the skill
  check. Pence stay below 100p in a mixed amount and pounds stay small,
  as Year 2 asks; the decimal point (£2.50) comes in Year 3.
metadata:
  year: year-2
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.money.amounts-to-100]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { en: [pound, pence, penny, £, p, worth, more than, less than, the same as] }
  forms: [drawn, text, audio]
  drawn: [coins]
  facets: [currency]
  misconceptions:
    - id: pound-is-ten-pence
      what: Thinks £1 is 10p, so £1 is less than 50p
      addressed: lesson 1 Learn counts ten 10p coins to £1; l1-f1 (with feedback), l1-s1 and l1-c1 ask how many pence make £1 with 10 as an option
    - id: pence-number-bigger
      what: Thinks 80p is more than £1 because 80 is bigger than 1
      addressed: lesson 1 Learn compares 80p with 100p; l1-f5 (with feedback), l1-s4 and l2-c4 compare an amount in pence with £1
    - id: five-p-fifty-p
      what: Mixes up 5p, 50p and £5 when reading or writing amounts
      addressed: lesson 2 Learn puts 5p, 50p and £5 side by side; l2-f3 (with feedback), l2-s3 and l2-n2 offer the wrong one of the three
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "1 Pfund sind 100 Pence", en: "£1 is 100p" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "How many pence?"
            say: "How many pence is this?"
            show: { drawn: coins, values: [50, 20, 10, 5] }
            answer: "85"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How much money?"
            say: "How much money is this?"
            show: { drawn: coins, values: [2000, 500, 200] }
            options: ["£27", "£3", "27p"]
            answer: "£27"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "10p, 20p, 30p ... 100p"
            say: "Ten ten pence coins. Count in tens: ten, twenty, thirty, all the way to one hundred pence."
            show: { drawn: coins, values: [10, 10, 10, 10, 10, 10, 10, 10, 10, 10] }
          - text: "100p = £1"
            say: "One hundred pence is the same as one pound. A pound coin is worth one hundred pence."
            show: { drawn: coins, values: [100] }
          - text: "50p + 50p = £1   70p + 30p = £1"
            say: "Two fifty pence coins make one pound. Seventy pence and thirty pence make one pound too. The pence add up to one hundred."
            show: { drawn: coins, values: [50, 50] }
          - text: "80p is less than £1. £3 = 300p"
            say: "Eighty pence is less than one hundred pence, so it is less than one pound. Three pounds is three hundreds: three hundred pence."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "£1 = _p"
                say: "How many pence make one pound?"
                options: ["100", "10", "1"]
                answer: "100"
                feedback:
                  "10": "Ten pence is one ten pence coin. You need ten of them to make a pound: one hundred pence."
                hints:
                  - "Count ten pence coins up to a pound."
                  - "Ten, twenty, thirty ... ninety, one hundred."
                  - "100."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Which coins make £1?"
                say: "Which coins make exactly one pound?"
                options:
                  - { drawn: coins, values: [50, 20, 20, 10] }
                  - { drawn: coins, values: [50, 20, 20] }
                  - { drawn: coins, values: [50, 20, 10, 5] }
                answer: "100"
                hints:
                  - "Count each group in pence. You need one hundred."
                  - "Fifty, seventy, ninety, and then?"
                  - "50p, 20p, 20p and 10p."
              - id: l1-f3
                type: fill_in_blank
                text: "Make £1."
                say: "Sixty pence and how many pence make one pound?"
                frame: "60p + _p = £1"
                options: ["40", "50", "4", "140"]
                answer: ["40"]
                hints:
                  - "One pound is one hundred pence."
                  - "Sixty and forty make one hundred."
                  - "40."
              - id: l1-f4
                type: text_input
                text: "£2 = _p"
                say: "How many pence make two pounds?"
                answer: "200"
                hints:
                  - "Each pound is one hundred pence."
                  - "One hundred and one hundred."
                  - "200."
              - id: l1-f5
                type: multiple_choice
                text: "Which is more: 80p or £1?"
                say: "Which is more: eighty pence or one pound?"
                options: ["£1", "80p"]
                answer: "£1"
                keep_order: true
                feedback:
                  "80p": "Eighty is a bigger number than one, but one pound is one hundred pence. Eighty pence is less."
                hints:
                  - "Write the pound in pence."
                  - "One pound is one hundred pence. Compare eighty and one hundred."
                  - "£1."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many 10p coins make £1?"
                say: "How many ten pence coins make one pound?"
                options: ["10", "100", "1"]
                answer: "10"
                hints: ["Count in tens up to one hundred."]
              - id: l1-s2
                type: fill_in_blank
                text: "Make £1."
                say: "Twenty-five pence and how many pence make one pound?"
                frame: "25p + _p = £1"
                options: ["75", "85", "25", "50"]
                answer: ["75"]
                hints: ["Twenty-five and what make one hundred?"]
              - id: l1-s3
                type: text_input
                text: "500p = £_"
                say: "Five hundred pence is how many pounds?"
                answer: "5"
                hints: ["Each hundred pence is one pound."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 95p is more than £1."
                say: "Ninety-five pence is more than one pound. Is that true?"
                answer: false
                hints: ["One pound is one hundred pence."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which coins make £1?"
                say: "Which coins make exactly one pound?"
                options:
                  - { drawn: coins, values: [20, 20, 20, 20, 20] }
                  - { drawn: coins, values: [20, 20, 20, 20] }
                  - { drawn: coins, values: [50, 20, 20, 5] }
                answer: "100"
                hints: ["Count each group in pence."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "£4 = _p"
                say: "How many pence make four pounds?"
                answer: "400"
              - id: l1-n2
                type: fill_in_blank
                text: "Make £1."
                say: "Fifty-five pence and how many pence make one pound?"
                frame: "55p + _p = £1"
                options: ["45", "55", "35", "50"]
                answer: ["45"]
              - id: l1-n3
                type: multiple_choice
                text: "Which is the same as £1?"
                say: "Which is the same as one pound?"
                options: ["100p", "10p", "1p"]
                answer: "100p"
              - id: l1-n4
                type: true_false
                text: "Is it true? 300p is the same as £3."
                say: "Three hundred pence is the same as three pounds. Is that true?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which is less than £1?"
                say: "Which amount is less than one pound?"
                options: ["90p", "100p", "200p"]
                answer: "90p"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many pence is £1?"
            say: "How many pence is one pound?"
            options: ["100p", "10p", "50p"]
            answer: "100p"
          - id: l1-c2
            type: fill_in_blank
            text: "Make £1."
            say: "Thirty pence and how many pence make one pound?"
            frame: "30p + _p = £1"
            options: ["70", "60", "30"]
            answer: ["70"]
          - id: l1-c3
            type: text_input
            text: "£6 = _p"
            say: "How many pence make six pounds?"
            answer: "600"

  - n: 2
    title: { de: Pfund und Pence zusammen, en: Pounds and pence together }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Make £1."
            say: "Eighty pence and how many pence make one pound?"
            frame: "80p + _p = £1"
            options: ["20", "30", "10"]
            answer: ["20"]
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "£3 = _p"
            say: "How many pence make three pounds?"
            answer: "300"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "£2 and 50p"
            say: "Count the pounds first: two pounds. Then count the pence: fifty pence. That is two pounds and fifty pence."
            show: { drawn: coins, values: [100, 100, 50] }
          - text: "£1 and 35p"
            say: "One pound coin, then twenty, thirty, thirty-five pence. One pound and thirty-five pence."
            show: { drawn: coins, values: [100, 20, 10, 5] }
          - text: "5p   50p   £5"
            say: "Look at the sign. Five pence is a small coin. Fifty pence is worth ten times as much. Five pounds is a note, worth one hundred times five pence."
            show: { drawn: coins, values: [5, 50, 500] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Write the amount."
                say: "How many pounds and how many pence? Fill the gaps."
                show: { drawn: coins, values: [200, 100, 20, 5] }
                frame: "£_ and _p"
                options: ["3", "25", "2", "35"]
                answer: ["3", "25"]
                hints:
                  - "Count the pound coins first."
                  - "Two pounds and one pound make three pounds. Then twenty and five."
                  - "£3 and 25p."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How much money?"
                say: "How much money is this?"
                show: { drawn: coins, values: [100, 50, 10] }
                options: ["£1 and 60p", "£1 and 6p", "60p"]
                answer: "£1 and 60p"
                hints:
                  - "Pounds first, then pence."
                  - "One pound coin, then fifty and ten pence."
                  - "£1 and 60p."
              - id: l2-f3
                type: multiple_choice
                text: "Which is fifty pence?"
                say: "Which of these is fifty pence?"
                options: ["50p", "5p", "£5"]
                answer: "50p"
                feedback:
                  "£5": "Five pounds has the pound sign in front. Fifty pence has the p after it."
                option_audio: false
                hints:
                  - "Look for the number fifty."
                  - "Fifty pence is written with p at the end."
                  - "50p."
              - id: l2-f4
                type: image_multiple_choice
                text: "Which shows £2 and 20p?"
                say: "Which coins show two pounds and twenty pence?"
                options:
                  - { drawn: coins, values: [200, 20] }
                  - { drawn: coins, values: [20, 20] }
                  - { drawn: coins, values: [200, 2] }
                answer: "220"
                hints:
                  - "You need a two pound coin and twenty pence."
                  - "Look for the £2 coin with a 20p coin."
                  - "£2 and 20p."
              - id: l2-f5
                type: true_false
                text: "Is it true? £1 and 50p is more than £2."
                say: "One pound and fifty pence is more than two pounds. Is that true?"
                answer: false
                hints:
                  - "How many pence is missing to make two pounds?"
                  - "One pound and fifty pence needs fifty more pence to make two pounds."
                  - "No."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Write the amount."
                say: "How many pounds and how many pence? Fill the gaps."
                show: { drawn: coins, values: [200, 200, 50, 20] }
                frame: "£_ and _p"
                options: ["4", "70", "2", "75"]
                answer: ["4", "70"]
                hints: ["Pounds first: two and two."]
              - id: l2-s2
                type: multiple_choice
                text: "How much money?"
                say: "How much money is this?"
                show: { drawn: coins, values: [500, 100, 10, 5] }
                options: ["£6 and 15p", "£5 and 15p", "£6 and 51p"]
                answer: "£6 and 15p"
                hints: ["The note is five pounds. Add the pound coin."]
              - id: l2-s3
                type: multiple_choice
                text: "Which is five pounds?"
                say: "Which of these is five pounds?"
                options: ["£5", "5p", "50p"]
                answer: "£5"
                option_audio: false
                hints: ["Pounds have the £ sign in front."]
              - id: l2-s4
                type: true_false
                text: "Is it true? £3 and 10p is more than £3."
                say: "Three pounds and ten pence is more than three pounds. Is that true?"
                answer: true
                hints: ["Three pounds, and some pence on top."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Which shows £1 and 5p?"
                say: "Which coins show one pound and five pence?"
                options:
                  - { drawn: coins, values: [100, 5] }
                  - { drawn: coins, values: [100, 50] }
                  - { drawn: coins, values: [500, 1] }
                answer: "105"
                hints: ["A pound coin and a five pence coin."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Jo has these coins in her purse. How much?"
                say: "Jo has these coins in her purse. How much money does she have?"
                show: { drawn: coins, values: [100, 100, 20, 20, 2] }
                frame: "£_ and _p"
                options: ["2", "42", "4", "24"]
                answer: ["2", "42"]
              - id: l2-n2
                type: multiple_choice
                text: "A pencil costs fifty pence. How is it written on the label?"
                say: "A pencil costs fifty pence. How is the price written on the label?"
                options: ["50p", "5p", "£50"]
                answer: "50p"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Sam has £1 and 80p. Ella has £2. Who has more?"
                say: "Sam has one pound and eighty pence. Ella has two pounds. Who has more money?"
                options: ["Ella", "Sam", "They have the same"]
                answer: "Ella"
              - id: l2-n4
                type: true_false
                text: "Ben pays with 100p for a £1 comic. Is that the right amount?"
                say: "A comic costs one pound. Ben pays with one hundred pence. Is that the right amount?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "A toy costs £4. How many pence is that?"
                say: "A toy costs four pounds. How many pence is that?"
                answer: "400"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Write the amount."
            say: "How many pounds and how many pence? Fill the gaps."
            show: { drawn: coins, values: [200, 50, 5] }
            frame: "£_ and _p"
            options: ["2", "55", "3", "50"]
            answer: ["2", "55"]
          - id: l2-c2
            type: image_multiple_choice
            text: "Which coins make 100p?"
            say: "Which coins make exactly one hundred pence?"
            options:
              - { drawn: coins, values: [50, 20, 10, 10, 10] }
              - { drawn: coins, values: [50, 20, 10, 10] }
              - { drawn: coins, values: [50, 50, 10] }
            answer: "100"
          - id: l2-c3
            type: fill_in_blank
            text: "Make £1."
            say: "Fifteen pence and how many pence make one pound?"
            frame: "15p + _p = £1"
            options: ["85", "95", "15", "75"]
            answer: ["85"]
          - id: l2-c4
            type: multiple_choice
            text: "Which is more: 99p or £1?"
            say: "Which is more: ninety-nine pence or one pound?"
            options: ["£1", "99p"]
            answer: "£1"
            keep_order: true
          - id: l2-c5
            type: text_input
            text: "700p = £_"
            say: "Seven hundred pence is how many pounds?"
            answer: "7"
