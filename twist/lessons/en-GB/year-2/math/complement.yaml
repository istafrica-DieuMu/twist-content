# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.complement
skill: math.add-sub-to-100.complement
curriculum: en-GB
language: en
title:
  de: Ergänzen bis zum Zehner und bis 100
  en: Making the next ten and 100
summary: >
  Finding what to add to reach the next ten and to reach 100
  (37 + _ = 40, 64 + _ = 100). Lesson 1 makes the next ten with the
  number bond to 10 of the ones digit; lesson 2 makes 100 in two hops on
  an empty number line, first to the next ten and then in tens, and ends
  with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.ones-bridge]
  also_practises: [math.add-sub-to-20.missing-addend, math.numbers-to-100.hundred-field]
  vocabulary: { en: [next ten, number bond, number bonds to 100, how many more, missing number, empty number line] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich, hundred-field]
  facets: []
  misconceptions:
    - id: gives-the-total
      what: Answers with the ten or with 100 instead of the missing number (37 + _ = 40 answered 40)
      addressed: Learn asks "How many more?"; the target is an option with feedback in l1-f1 and l2-f1
    - id: tens-to-100-off-by-ten
      what: Makes both the ones and the tens up to ten (58 + _ = 100 answered 52), which gives 110
      addressed: lesson 2 Learn hops to the next ten first and then counts the tens left; 52 is an option with feedback in l2-f2, and l2-s4 asks whether 57 + 53 makes 100
    - id: ones-not-bonded
      what: Gives the ones digit instead of its number bond to 10 (27 + _ = 30 answered 7)
      addressed: lesson 1 hints name the bond to 10 of the ones; 7 is an option with feedback in l1-f1, and 6 in l1-s2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Bis zum nächsten Zehner, en: Up to the next ten }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "6 + _ = 10"
            say: "Six and how many more make ten?"
            options: ["4", "6", "10"]
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "35 + 5 = _"
            say: "Thirty-five add five."
            answer: "40"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "37 + _ = 40"
            say: "Thirty-seven add how many makes forty? We need to find how many more it takes to reach the next ten."
          - text: "7 + 3 = 10"
            say: "Look at the ones digit. It is seven. Seven and three are a number bond to ten."
          - text: "37 + 3 = 40"
            say: "So we need three more. One hop of three takes thirty-seven to forty. The answer is the hop, three, not the forty."
            show: { drawn: rechenstrich, start: 37, jumps: [3] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "27 + _ = 30"
                say: "Twenty-seven add how many makes thirty?"
                options: ["3", "7", "30"]
                answer: "3"
                feedback:
                  "7": "Seven is the ones digit of 27. We need its number bond to ten."
                  "30": "Thirty is where we want to get to. How many more does it take?"
                hints:
                  - "Look at the ones digit: seven."
                  - "Seven and how many make ten?"
                  - "Three more. 27 + 3 = 30."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "54 + _ = 60"
                say: "Fifty-four add how many makes sixty?"
                answer: "6"
                hints:
                  - "The ones digit is four."
                  - "Four and six make ten."
                  - "6."
              - id: l1-f3
                type: multiple_choice
                text: "81. How many more to the next ten?"
                say: "Eighty-one. How many more to reach the next ten?"
                show: { drawn: rechenstrich, start: 81, jumps: [] }
                options: ["9", "1", "19"]
                answer: "9"
                hints:
                  - "The next ten after 81 is 90."
                  - "One and how many make ten?"
                  - "9."
              - id: l1-f4
                type: fill_in_blank
                text: "Make the next ten."
                say: "Twenty-three. Fill in the hop to the next ten, and the ten you reach."
                frame: "23 + _ = _"
                options: ["7", "30", "3", "20"]
                answer: ["7", "30"]
                hints:
                  - "The next ten after 23 is 30."
                  - "Three and seven make ten."
                  - "23 + 7 = 30."
              - id: l1-f5
                type: true_false
                text: "Is it true? 68 + 2 = 70"
                say: "Sixty-eight add two makes seventy. Is that true?"
                answer: true
                hints:
                  - "Look at the ones: eight and two."
                  - "Eight and two are a number bond to ten."
                  - "Yes, 68 + 2 = 70."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "42 + _ = 50"
                say: "Forty-two add how many makes fifty?"
                answer: "8"
                hints: ["What is the number bond to ten of the ones digit?"]
              - id: l1-s2
                type: multiple_choice
                text: "76 + _ = 80"
                say: "Seventy-six add how many makes eighty?"
                options: ["4", "6", "14"]
                answer: "4"
                feedback:
                  "6": "Six is the ones digit. Six needs four more to make ten."
                hints: ["Look only at the ones digit."]
              - id: l1-s3
                type: fill_in_blank
                text: "Make the next ten."
                say: "Fifty-nine. Fill in the hop to the next ten, and the ten you reach."
                frame: "59 + _ = _"
                options: ["1", "60", "9", "50"]
                answer: ["1", "60"]
                hints: ["Which ten comes after 59?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? 33 + 3 = 40"
                say: "Thirty-three add three makes forty. Is that true?"
                answer: false
                hints: ["Do three and three make ten?"]
              - id: l1-s5
                type: text_input
                text: "88 + _ = 90"
                say: "Eighty-eight add how many makes ninety?"
                answer: "2"
                hints: ["Eight and how many make ten?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "61 + _ = 70"
                say: "Sixty-one add how many makes seventy?"
                answer: "9"
              - id: l1-n2
                type: multiple_choice
                text: "45. How many more to the next ten?"
                say: "Forty-five. How many more to reach the next ten?"
                options: ["5", "15", "50"]
                answer: "5"
              - id: l1-n3
                type: fill_in_blank
                text: "Make the next ten."
                say: "Ninety-seven. Fill in the hop to the next ten, and the ten you reach."
                frame: "97 + _ = _"
                options: ["3", "100", "7", "90"]
                answer: ["3", "100"]
              - id: l1-n4
                type: text_input
                text: "26 + _ = 30"
                say: "Twenty-six add how many makes thirty?"
                answer: "4"
              - id: l1-n5
                type: true_false
                text: "Is it true? 52 + 8 = 60"
                say: "Fifty-two add eight makes sixty. Is that true?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "73 + _ = 80"
            say: "Seventy-three add how many makes eighty?"
            answer: "7"
          - id: l1-c2
            type: multiple_choice
            text: "39 + _ = 40"
            say: "Thirty-nine add how many makes forty?"
            options: ["1", "9", "40"]
            answer: "1"
          - id: l1-c3
            type: fill_in_blank
            text: "Make the next ten."
            say: "Eighty-four. Fill in the hop to the next ten, and the ten you reach."
            frame: "84 + _ = _"
            options: ["6", "90", "4", "80"]
            answer: ["6", "90"]

  - n: 2
    title: { de: Bis 100, en: Up to 100 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "47 + _ = 50"
            say: "Forty-seven add how many makes fifty?"
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "70 + _ = 100"
            say: "Seventy add how many makes one hundred?"
            options: ["30", "3", "40"]
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "64 + _ = 100"
            say: "Sixty-four add how many makes one hundred? Here are sixty-four dots. Each full row is ten. How many more fill the grid?"
            show: { drawn: hundred-field, filled: 64 }
          - text: "64 + 6 = 70 · 70 + 30 = 100"
            say: "First hop to the next ten: add six to make seventy. Then hop in tens to one hundred: add thirty."
            show: { drawn: rechenstrich, start: 64, jumps: [6, 30] }
          - text: "6 + 30 = 36"
            say: "Put the two hops together: six and thirty make thirty-six. So sixty-four add thirty-six makes one hundred."
          - text: "64 + 36 = 100"
            say: "A quick check: the ones, four and six, make one ten. The tens, six and three, make nine tens. Nine tens and one more ten make one hundred."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "80 + _ = 100"
                say: "Eighty add how many makes one hundred?"
                show: { drawn: hundred-field, filled: 80 }
                options: ["20", "2", "100"]
                answer: "20"
                feedback:
                  "100": "One hundred is where we want to get to. How many more does it take?"
                  "2": "Two rows are empty, and each row is ten."
                hints:
                  - "Count the empty rows."
                  - "Two rows are empty: two tens."
                  - "20."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "58 + _ = 100"
                say: "Fifty-eight add how many makes one hundred?"
                options: ["42", "52", "50"]
                answer: "42"
                feedback:
                  "52": "58 + 52 makes 110. Hop two to 60 first, then you need four tens, not five."
                  "50": "58 + 50 makes 108. Hop two to 60 first, then forty more."
                hints:
                  - "First hop to the next ten: 60."
                  - "58 + 2 = 60, and 60 + 40 = 100."
                  - "2 and 40 make 42."
              - id: l2-f3
                type: fill_in_blank
                text: "Make 100 in two hops."
                say: "Fifty-three. Hop to the next ten, then hop in tens to one hundred. Then put the hops together."
                frame: "53 + _ = 60 · 60 + _ = 100 · 53 + _ = 100"
                options: ["7", "40", "47", "57"]
                answer: ["7", "40", "47"]
                hints:
                  - "Three and seven make ten."
                  - "From 60 to 100 is four tens."
                  - "7 and 40 make 47."
              - id: l2-f4
                type: text_input
                text: "28 + _ = 100"
                say: "Twenty-eight add how many makes one hundred?"
                show: { drawn: rechenstrich, start: 28, jumps: [] }
                answer: "72"
                hints:
                  - "First hop two to 30."
                  - "From 30 to 100 is seventy."
                  - "2 and 70 make 72."
              - id: l2-f5
                type: true_false
                text: "Is it true? 45 + 55 = 100"
                say: "Forty-five add fifty-five makes one hundred. Is that true?"
                answer: true
                hints:
                  - "Five ones and five ones make one ten."
                  - "Four tens, five tens and that ten make ten tens."
                  - "Yes, 45 + 55 = 100."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "71 + _ = 100"
                say: "Seventy-one add how many makes one hundred?"
                answer: "29"
                hints: ["Hop to the next ten first, then in tens to one hundred."]
              - id: l2-s2
                type: fill_in_blank
                text: "Make 100 in two hops."
                say: "Thirty-six. Hop to the next ten, then hop in tens to one hundred. Then put the hops together."
                frame: "36 + _ = 40 · 40 + _ = 100 · 36 + _ = 100"
                options: ["4", "60", "64", "74"]
                answer: ["4", "60", "64"]
                hints: ["Six and how many make ten?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which makes 100?"
                say: "Which of these makes one hundred?"
                options: ["82 + 18", "82 + 28", "82 + 8"]
                answer: "82 + 18"
                hints: ["Do the ones make ten, and then are there ten tens?"]
              - id: l2-s4
                type: true_false
                text: "Is it true? 57 + 53 = 100"
                say: "Fifty-seven add fifty-three makes one hundred. Is that true?"
                answer: false
                hints: ["The ones make one ten. Count all the tens with it: is it exactly ten tens?"]
              - id: l2-s5
                type: text_input
                text: "40 + _ = 100"
                say: "Forty add how many makes one hundred?"
                show: { drawn: hundred-field, filled: 40 }
                answer: "60"
                hints: ["Count the empty rows."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "65 + _ = 100"
                say: "Sixty-five add how many makes one hundred?"
                answer: "35"
              - id: l2-n2
                type: fill_in_blank
                text: "Make 100 in two hops."
                say: "Nineteen. Hop to the next ten, then hop in tens to one hundred. Then put the hops together."
                frame: "19 + _ = 20 · 20 + _ = 100 · 19 + _ = 100"
                options: ["1", "80", "81", "91"]
                answer: ["1", "80", "81"]
              - id: l2-n3
                type: multiple_choice
                text: "Which makes 100?"
                say: "Which of these makes one hundred?"
                options: ["33 + 77", "33 + 67", "33 + 70"]
                answer: "33 + 67"
              - id: l2-n4
                type: text_input
                text: "94 + _ = 100"
                say: "Ninety-four add how many makes one hundred?"
                answer: "6"
              - id: l2-n5
                type: true_false
                text: "Is it true? 12 + 88 = 100"
                say: "Twelve add eighty-eight makes one hundred. Is that true?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "48 + _ = 50"
            say: "Forty-eight add how many makes fifty?"
            answer: "2"
          - id: l2-c2
            type: text_input
            text: "37 + _ = 100"
            say: "Thirty-seven add how many makes one hundred?"
            answer: "63"
          - id: l2-c3
            type: fill_in_blank
            text: "Make 100 in two hops."
            say: "Seventy-four. Hop to the next ten, then hop in tens to one hundred. Then put the hops together."
            frame: "74 + _ = 80 · 80 + _ = 100 · 74 + _ = 100"
            options: ["6", "20", "26", "36"]
            answer: ["6", "20", "26"]
          - id: l2-c4
            type: multiple_choice
            text: "Which makes 100?"
            say: "Which of these makes one hundred?"
            options: ["51 + 49", "51 + 59", "51 + 40"]
            answer: "51 + 49"
          - id: l2-c5
            type: multiple_choice
            text: "62. How many more to the next ten?"
            say: "Sixty-two. How many more to reach the next ten?"
            options: ["8", "2", "38"]
            answer: "8"
