# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.name-fractions
skill: math.fractions.name-fractions
curriculum: en-GB
language: en
title:
  de: Brüche benennen
  en: Naming fractions
summary: >
  Year 2 fractions: halves, thirds and quarters, and two quarters and
  three quarters. Lesson 1 names a fraction of a whole shape cut into
  equal parts: the bottom number counts all the equal parts, the top
  number the parts we mean. Lesson 2 names a fraction of a set (one of
  three equal rows of dots, three of four apples), matches picture, words
  and fraction, and ends with the skill check. Fractions are written 3/4
  on screen and spoken as words; fraction options are not read aloud.
metadata:
  year: year-2
  topic: { de: Brüche, en: Fractions }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.fractions.halves-quarters, math.mult-div.div-meaning]
  also_practises: [math.fractions.halves-quarters]
  vocabulary: { en: [fraction, whole, equal parts, one half, one third, one quarter, two quarters, three quarters] }
  forms: [drawn, text, audio]
  drawn: [fraction, dots]
  facets: []
  parts:
    - { id: whole, what: { de: den Bruchteil eines Ganzen benennen, en: naming a fraction of a whole shape } }
    - { id: set, what: { de: den Bruchteil einer Menge benennen, en: naming a fraction of a set of things } }
    - { id: represent, what: { de: "Bild, Wort und Bruch zuordnen", en: "matching picture, words and fraction" } }
    - { id: equal, what: { de: "wissen, dass ein Bruch gleich große Teile braucht", en: knowing that a fraction needs equal parts } }
  misconceptions:
    - id: shaded-over-unshaded
      what: Writes the red parts over the white parts (3/1 for three of four parts red) instead of over all the parts
      addressed: lesson 1 Learn says the bottom number counts all the equal parts; l1-f2 (with feedback), l1-s1, l1-n2, l1-n5, l2-f2 (with feedback), l2-s2, l2-n1, l2-n5 and l2-c1 offer the red-over-white fraction
    - id: top-bottom-swapped
      what: Puts the number of parts on top and the red parts below (3/1 for one of three)
      addressed: l1-f1 (with feedback), l1-s3, l1-n1 and l2-n2 (top and bottom as separate gaps), l2-s1 and l2-c4
    - id: unequal-parts
      what: Calls any part of four a quarter, even when the parts are not the same size
      addressed: lesson 1 Learn screen 4; l1-n4 and l2-c5
    - id: count-in-row
      what: Counts the dots in one row instead of the rows (1/4 for one of three rows of four)
      addressed: lesson 2 Learn screen 1; l2-f1 (with feedback), l2-f3, l2-n3 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Teile eines Ganzen", en: "Parts of a whole" }
    goal:
      de: "Benenne Teile einer Form mit gleich großen Teilen, wie ein Viertel oder drei Viertel eines Kreises."
      en: "Name the parts of a shape cut into equal parts, like one quarter or three quarters of a circle."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which part is red?"
            say: "This circle is cut into two equal parts. How much of it is red?"
            show: { drawn: fraction, kind: circle, parts: 2, shaded: 1 }
            options: ["one half", "one quarter", "the whole circle"]
            answer: "one half"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "6 sweets are shared equally between 2 children. How many does each child get?"
            say: "Six sweets are shared equally between two children. How many does each child get?"
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4 equal parts. 1 part is red.\nWhat do we call the red part?"
            say: "This circle is cut into four equal parts. One part is red. What do you think we call the red part? Have a guess."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
          - text: "1/4\n4 equal parts. 1 part is red."
            say: "One of four equal parts is one quarter. We write it as a one, a line, and a four under it. The bottom number tells us how many equal parts the whole has. The top number tells us how many of those parts we mean."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
          - text: "1/3\n3 equal parts. 1 part is red."
            say: "This bar has three equal parts. One of them is red. That is one third. Two red parts would be two thirds."
            show: { drawn: fraction, kind: bar, parts: 3, shaded: 1 }
          - text: "3/4\n4 equal parts. 3 parts are red."
            say: "Now three of the four equal parts are red. That is three quarters. Two of the four would be two quarters. Remember: the bottom number counts all the parts, the red ones and the white ones."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
          - text: "The parts must be equal.\n4 pieces of different sizes are not quarters."
            say: "A fraction only works when the parts are the same size. If a cake is cut into four pieces and one piece is much bigger, the pieces are not quarters."
          - text: "Did you know? The word fraction comes from an old Latin word that means to break."
            say: "Did you know? The word fraction comes from an old Latin word that means to break. A fraction is a part of a whole that has been broken into equal parts!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What fraction is red?"
                say: "What fraction of the circle is red?"
                show: { drawn: fraction, kind: circle, parts: 3, shaded: 1 }
                options: ["1/3", "1/2", "3/1"]
                answer: "1/3"
                option_audio: false
                feedback:
                  "3/1": "The number of red parts goes on top. The number of equal parts goes on the bottom."
                hints:
                  - "Count all the equal parts first. That number goes on the bottom."
                  - "There are 3 equal parts and 1 is red."
                  - "1/3, one third."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What fraction is red?"
                say: "What fraction of the bar is red?"
                show: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }
                options: ["3/4", "3/1", "1/4"]
                answer: "3/4"
                option_audio: false
                feedback:
                  "3/1": "You counted the red parts and the white part. The bottom number counts all the parts: 4."
                  "1/4": "1/4 is the white part. Which part is red?"
                hints:
                  - "Count all the parts. Then count the red parts."
                  - "There are 4 equal parts and 3 are red."
                  - "3/4, three quarters."
              - id: l1-f3
                type: image_multiple_choice
                text: "Where is 1/4 red?"
                say: "Which circle has one quarter red?"
                options:
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
                  - { drawn: fraction, kind: circle, parts: 3, shaded: 1 }
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
                answer: "1/4"
                feedback:
                  "1/3": "This circle has 3 equal parts. A quarter needs 4 equal parts."
                hints:
                  - "A quarter means the whole has 4 equal parts."
                  - "Find a circle with 4 parts. Then count the red parts."
                  - "The circle with 4 parts and just 1 part red."
              - id: l1-f4
                type: multiple_choice
                text: "What do we call this fraction?\n1/3"
                say: "What do we call this fraction?"
                options: ["one third", "one quarter", "one half", "one thirsty"]
                answer: "one third"
                feedback:
                  "one thirsty": "Thirsty is how you feel when you need a drink! 3 equal parts are called thirds."
                hints:
                  - "Look at the bottom number. It says how many equal parts."
                  - "3 equal parts are called thirds."
                  - "One third."
              - id: l1-f5
                type: true_false
                text: "Is it true? 2/4 of the rectangle is red."
                say: "Two quarters of the rectangle are red. Is that true?"
                show: { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 2 }
                answer: true
                hints:
                  - "Count all the equal parts, then the red parts."
                  - "There are 4 equal parts and 2 are red."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What fraction is red?"
                say: "What fraction of the bar is red?"
                show: { drawn: fraction, kind: bar, parts: 3, shaded: 2 }
                options: ["2/3", "2/1", "1/3"]
                answer: "2/3"
                option_audio: false
                hints: ["The bottom number counts all the parts, the white one too."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Where is 3/4 red?"
                say: "Which bar has three quarters red?"
                options:
                  - { drawn: fraction, kind: bar, parts: 4, shaded: 3 }
                  - { drawn: fraction, kind: bar, parts: 4, shaded: 1 }
                  - { drawn: fraction, kind: bar, parts: 3, shaded: 2 }
                answer: "3/4"
                hints: ["Three quarters: 4 equal parts with 3 of them red."]
              - id: l1-s3
                type: multiple_choice
                text: "What fraction is red?"
                say: "What fraction of the circle is red?"
                show: { drawn: fraction, kind: circle, parts: 2, shaded: 1 }
                options: ["1/2", "1/4", "2/1"]
                answer: "1/2"
                option_audio: false
                hints: ["How many equal parts are there? That number goes on the bottom."]
                difficulty: easy
              - id: l1-s4
                type: true_false
                text: "Is it true? 1/4 of the circle is red."
                say: "One quarter of the circle is red. Is that true?"
                show: { drawn: fraction, kind: circle, parts: 3, shaded: 1 }
                answer: false
                hints: ["Count the equal parts. Are there 4?"]
              - id: l1-s5
                type: matching
                text: "Match each picture to its fraction."
                say: "Match each picture to its fraction."
                pairs:
                  - { left: { drawn: fraction, kind: circle, parts: 2, shaded: 1 }, right: { text: "one half" } }
                  - { left: { drawn: fraction, kind: bar, parts: 3, shaded: 1 }, right: { text: "one third" } }
                  - { left: { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 1 }, right: { text: "one quarter" } }
                  - { left: { drawn: fraction, kind: circle, parts: 4, shaded: 3 }, right: { text: "three quarters" } }
                hints: ["In each picture, count all the equal parts first."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Write the fraction that is red."
                say: "Write the fraction that is red. Which number goes on top, and which on the bottom?"
                show: { drawn: fraction, kind: bar, parts: 4, shaded: 1 }
                frame: "_/_"
                options: ["1", "3", "4"]
                answer: ["1", "4"]
              - id: l1-n2
                type: multiple_choice
                text: "What fraction is red?"
                say: "What fraction of the circle is red?"
                show: { drawn: fraction, kind: circle, parts: 4, shaded: 2 }
                options: ["2/4", "2/2", "1/4"]
                answer: "2/4"
                option_audio: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Where is 1/3 red?"
                say: "Which circle has one third red?"
                options:
                  - { drawn: fraction, kind: circle, parts: 3, shaded: 1 }
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
                  - { drawn: fraction, kind: circle, parts: 3, shaded: 2 }
                answer: "1/3"
              - id: l1-n4
                type: true_false
                text: "A cake is cut into 4 pieces of different sizes. Is each piece 1/4 of the cake?"
                say: "A cake is cut into four pieces of different sizes. Is each piece one quarter of the cake?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "What fraction is red?"
                say: "What fraction of the rectangle is red?"
                show: { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 3 }
                options: ["3/4", "3/1", "4/3"]
                answer: "3/4"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What fraction is red?"
            say: "What fraction of the bar is red?"
            show: { drawn: fraction, kind: bar, parts: 2, shaded: 1 }
            options: ["1/2", "1/3", "2/1"]
            answer: "1/2"
            option_audio: false
          - id: l1-c2
            type: image_multiple_choice
            text: "Where is 2/4 red?"
            say: "Which circle has two quarters red?"
            options:
              - { drawn: fraction, kind: circle, parts: 4, shaded: 2 }
              - { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
              - { drawn: fraction, kind: circle, parts: 3, shaded: 2 }
            answer: "2/4"
          - id: l1-c3
            type: multiple_choice
            text: "What fraction is red?"
            say: "What fraction of the circle is red?"
            show: { drawn: fraction, kind: circle, parts: 3, shaded: 2 }
            options: ["2/3", "2/1", "1/3"]
            answer: "2/3"
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Is it true? 1/3 of the circle is red."
            say: "One third of the circle is red. Is that true?"
            show: { drawn: fraction, kind: circle, parts: 3, shaded: 2 }
            answer: false
          - id: l1-c5
            type: fill_in_blank
            text: "Write the fraction that is red."
            say: "Write the fraction that is red."
            show: { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 2 }
            frame: "_/_"
            options: ["2", "4", "6"]
            answer: ["2", "4"]
          - id: l1-c6
            type: true_false
            text: "A sandwich is cut into 2 equal pieces. Is each piece 1/2 of the sandwich?"
            say: "A sandwich is cut into two equal pieces. Is each piece one half of the sandwich?"
            answer: true

  - n: 2
    title: { de: "Teile einer Menge", en: "Parts of a set" }
    goal:
      de: "Benenne Teile einer Menge, so wie 3 grüne von 4 Äpfeln drei Viertel der Äpfel sind."
      en: "Name parts of a set, like 3 green apples out of 4 are three quarters of the apples."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What fraction is red?"
            say: "What fraction of the bar is red?"
            show: { drawn: fraction, kind: bar, parts: 3, shaded: 1 }
            options: ["1/3", "1/4", "3/1"]
            answer: "1/3"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What do we call this fraction?\n3/4"
            say: "What do we call this fraction?"
            options: ["three quarters", "three thirds", "one quarter"]
            answer: "three quarters"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "12 dots in 3 equal rows. 1 row is red.\nWhat fraction of the dots is red?"
            say: "A fraction can be part of a set of things, too. Here are twelve dots in three equal rows. One row is red. What fraction of the dots do you think is red? Have a guess."
            show: { drawn: dots, array: [3, 4], split_rows: 1 }
          - text: "12 dots in 3 equal rows.\n1 row is red: 1/3 of the dots."
            say: "Count the rows, not the dots in a row: one row out of three is one third of the dots."
            show: { drawn: dots, array: [3, 4], split_rows: 1 }
          - text: "4 apples. 3 are green.\n3/4 of the apples are green."
            say: "There are four apples, and three of them are green. Three out of four is three quarters. The bottom number counts all the apples. The top number counts the green ones."
          - text: "picture, words, fraction\nthree quarters = 3/4"
            say: "You can show a fraction as a picture, say it in words, or write it with numbers. This picture, the words three quarters, and the numbers three over four all mean the same."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What fraction of the dots is red?"
                say: "What fraction of the dots is red?"
                show: { drawn: dots, array: [3, 4], split_rows: 1 }
                options: ["1/3", "1/4", "3/1"]
                answer: "1/3"
                option_audio: false
                feedback:
                  "1/4": "Each row has 4 dots. But count the rows: there are 3."
                hints:
                  - "Count the equal rows. How many of them are red?"
                  - "There are 3 rows and 1 is red."
                  - "1/3, one third."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "There are 4 apples. 3 are green. What fraction of the apples is green?"
                say: "There are four apples. Three are green. What fraction of the apples is green?"
                options: ["3/4", "3/1", "1/4"]
                answer: "3/4"
                option_audio: false
                feedback:
                  "3/1": "You put the green apples over the other apple. The bottom number counts all the apples: 4."
                  "1/4": "1/4 is the apple that is not green."
                hints:
                  - "The bottom number counts all the apples. The top number counts the green ones."
                  - "There are 4 apples and 3 are green."
                  - "3/4, three quarters."
              - id: l2-f3
                type: image_multiple_choice
                text: "Where is 1/2 of the dots red?"
                say: "In which picture is one half of the dots red?"
                options:
                  - { drawn: dots, array: [2, 3], split_rows: 1 }
                  - { drawn: dots, array: [3, 2], split_rows: 1 }
                  - { drawn: dots, array: [4, 3], split_rows: 1 }
                answer: "2x3"
                hints:
                  - "One half: 1 of 2 equal rows is red."
                  - "Count the rows in each picture."
                  - "The picture with 2 rows, 1 of them red."
              - id: l2-f4
                type: true_false
                text: "Is it true? 2/4 of the dots are red."
                say: "Two quarters of the dots are red. Is that true?"
                show: { drawn: dots, array: [4, 3], split_rows: 2 }
                answer: true
                hints:
                  - "Count all the rows, then the red rows."
                  - "There are 4 rows and 2 are red."
                  - "Yes, it is true."
              - id: l2-f5
                type: matching
                text: "Match the words to the fraction."
                say: "Match the words to the fraction."
                option_audio: false
                pairs:
                  - { left: { text: "one half" }, right: { text: "1/2" } }
                  - { left: { text: "one third" }, right: { text: "1/3" } }
                  - { left: { text: "one quarter" }, right: { text: "1/4" } }
                  - { left: { text: "three quarters" }, right: { text: "3/4" } }
                hints:
                  - "The word tells you the bottom number: halves 2, thirds 3, quarters 4."
                  - "Three quarters has 3 on top and 4 on the bottom."
                  - "one half 1/2, one third 1/3, one quarter 1/4, three quarters 3/4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What fraction of the dots is red?"
                say: "What fraction of the dots is red?"
                show: { drawn: dots, array: [4, 2], split_rows: 1 }
                options: ["1/4", "1/2", "4/1"]
                answer: "1/4"
                option_audio: false
                hints: ["Count the equal rows, not the dots in one row."]
              - id: l2-s2
                type: multiple_choice
                text: "There are 3 cars. 2 are blue. What fraction of the cars is blue?"
                say: "There are three cars. Two are blue. What fraction of the cars is blue?"
                options: ["2/3", "2/1", "1/3"]
                answer: "2/3"
                option_audio: false
                hints: ["The top number counts the blue cars. The bottom number counts all the cars."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 2/4 of the dots are red."
                say: "Two quarters of the dots are red. Is that true?"
                show: { drawn: dots, array: [3, 4], split_rows: 2 }
                answer: false
                hints: ["Count the rows. Are there 4 rows?"]
              - id: l2-s4
                type: image_multiple_choice
                text: "Where are 3/4 of the dots red?"
                say: "In which picture are three quarters of the dots red?"
                options:
                  - { drawn: dots, array: [4, 2], split_rows: 3, key: "3/4" }
                  - { drawn: dots, array: [4, 2], split_rows: 1, key: "1/4" }
                  - { drawn: dots, array: [3, 2], split_rows: 2, key: "2/3" }
                answer: "3/4"
                hints: ["Three quarters: 4 equal rows with 3 of them red."]
              - id: l2-s5
                type: multiple_choice
                text: "Ben has 4 sweets. He eats 1. What fraction of the sweets is left?"
                say: "Ben has four sweets. He eats one. What fraction of the sweets is left?"
                options: ["3/4", "1/4", "1/3"]
                answer: "3/4"
                option_audio: false
                hints: ["How many sweets are left? How many were there at the start?"]
                difficulty: stretch

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "There are 2 dogs. 1 is asleep. What fraction of the dogs is asleep?"
                say: "There are two dogs. One is asleep. What fraction of the dogs is asleep?"
                show: { object: dog, count: 2 }
                options: ["1/2", "1/1", "2/1"]
                answer: "1/2"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "There are 4 children. 3 are wearing wellies. Write the fraction."
                say: "There are four children. Three are wearing wellies. Write the fraction of the children wearing wellies."
                frame: "_/_"
                options: ["1", "3", "4"]
                answer: ["3", "4"]
              - id: l2-n3
                type: image_multiple_choice
                text: "Where is 1/3 of the dots red?"
                say: "In which picture is one third of the dots red?"
                options:
                  - { drawn: dots, array: [3, 2], split_rows: 1 }
                  - { drawn: dots, array: [2, 3], split_rows: 1 }
                  - { drawn: dots, array: [4, 3], split_rows: 1 }
                answer: "3x2"
              - id: l2-n4
                type: true_false
                text: "There are 3 boats. 1 is red. Mia says: “1/2 of the boats are red.” Is Mia right?"
                say: "There are three boats. One is red. Mia says one half of the boats are red. Is Mia right?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Mum cuts a pizza into 4 equal slices. Sam eats 2 slices. What fraction of the pizza does Sam eat?"
                say: "Mum cuts a pizza into four equal slices. Sam eats two slices. What fraction of the pizza does Sam eat?"
                show: { object: pizza }
                options: ["2/4", "2/2", "1/4"]
                answer: "2/4"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: whole
            type: multiple_choice
            text: "What fraction is red?"
            say: "What fraction of the rectangle is red?"
            show: { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 1 }
            options: ["1/4", "1/3", "4/1"]
            answer: "1/4"
            option_audio: false
          - id: l2-c2
            part: represent
            type: image_multiple_choice
            text: "Where is 2/3 red?"
            say: "Which bar has two thirds red?"
            options:
              - { drawn: fraction, kind: bar, parts: 3, shaded: 2 }
              - { drawn: fraction, kind: bar, parts: 3, shaded: 1 }
              - { drawn: fraction, kind: bar, parts: 4, shaded: 2 }
            answer: "2/3"
          - id: l2-c3
            part: set
            type: multiple_choice
            text: "What fraction of the dots is red?"
            say: "What fraction of the dots is red?"
            show: { drawn: dots, array: [2, 4], split_rows: 1 }
            options: ["1/2", "1/4", "2/1"]
            answer: "1/2"
            option_audio: false
          - id: l2-c4
            part: set
            type: multiple_choice
            text: "There are 4 ducks. 1 is brown. What fraction of the ducks is brown?"
            say: "There are four ducks. One is brown. What fraction of the ducks is brown?"
            options: ["1/4", "1/3", "4/1"]
            answer: "1/4"
            option_audio: false
          - id: l2-c5
            part: equal
            type: true_false
            text: "A pie is cut into 3 equal pieces. Is each piece 1/3 of the pie?"
            say: "A pie is cut into three equal pieces. Is each piece one third of the pie?"
            answer: true
          - id: l2-c6
            part: whole
            type: multiple_choice
            text: "What fraction is white?"
