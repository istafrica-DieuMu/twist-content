# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.equivalent-simple
skill: math.fractions.equivalent-simple
curriculum: en-GB
language: en
title:
  de: Gleichwertige Brüche
  en: Equivalent fractions
summary: >
  Year 2 equivalence: two quarters are the same as one half, and two
  halves, three thirds and four quarters make one whole. Lesson 1 shows
  it on shapes cut into halves and then quarters. Lesson 2 shows it in a
  set of dots and with amounts (2/4 of 12 is the same as 1/2 of 12), adds
  four eighths as one more name for a half, and ends with the skill
  check. Fraction options are not read aloud.
metadata:
  year: year-2
  topic: { de: Brüche, en: Fractions }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.fractions.name-fractions]
  also_practises: [math.fractions.of-quantities, math.fractions.name-fractions]
  vocabulary: { en: [equivalent, the same as, one half, two quarters, four eighths, one whole, equal parts] }
  forms: [drawn, text, audio]
  drawn: [fraction, dots]
  facets: []
  parts:
    - { id: half-pictures, what: { de: ein Halbes in Bildern als zwei Viertel oder vier Achtel erkennen, en: spotting one half shown as quarters or eighths } }
    - { id: half-numbers, what: { de: "1/2, 2/4 und 4/8 als gleichwertig schreiben", en: "writing 1/2, 2/4 and 4/8 as equivalent" } }
    - { id: whole, what: { de: "Brüche, die ein Ganzes sind", en: fractions that make one whole } }
    - { id: in-sets, what: { de: gleichwertige Brüche von Mengen, en: equivalent fractions of a set } }
  misconceptions:
    - id: same-top-number
      what: Thinks fractions with the same top number are worth the same (1/4 = 1/2)
      addressed: lesson 1 Learn screens 1 and 2 set one half beside two quarters; l1-f2 and l1-f5 (with feedback), l1-s1, l1-n3, l2-f1 (with feedback), l2-s1 and l2-c4
    - id: more-parts-more
      what: Thinks 2/4 is more than 1/2 because the numbers are bigger
      addressed: lesson 1 Learn screen 2 shows the same amount red; l1-f1, l1-n5, l2-f2 (both gaps take the same chip), l2-n1 and l2-c5
    - id: whole-not-a-fraction
      what: Does not see that 2/2, 3/3 and 4/4 are one whole
      addressed: lesson 1 Learn screen 3; l1-f4, l1-s3, l1-s5, l1-n2, l1-n4, l1-c3 and l2-c3
    - id: half-of-bottom
      what: Takes any fraction with an even bottom number as a half (2/8 = 1/2)
      addressed: lesson 2 Learn screen 3; l2-f5 (with feedback), l2-n5 and l2-c1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zwei Viertel sind ein Halbes", en: "Two quarters make a half" }
    goal:
      de: "Sieh, dass zwei Viertel einer Form so viel sind wie ein Halbes und dass vier Viertel ein Ganzes ergeben."
      en: "See that two quarters of a shape are the same as one half, and that four quarters make one whole."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What fraction is red?"
            say: "What fraction of the circle is red?"
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 2 }
            options: ["2/4", "2/2", "1/4"]
            answer: "2/4"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Where is 1/2 red?"
            say: "Which bar has one half red?"
            options:
              - { drawn: fraction, kind: bar, parts: 2, shaded: 1 }
              - { drawn: fraction, kind: bar, parts: 3, shaded: 1 }
              - { drawn: fraction, kind: bar, parts: 4, shaded: 1 }
            answer: "1/2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1/2 of a cake or 2/4 of the same cake:\nwhich is more?"
            say: "Would you rather have one half of a cake, or two quarters of the same cake? Which do you think is more? Have a guess."
            show: { object: cake }
          - text: "1/2"
            say: "Let's look with a bar. This bar is cut into two equal parts. One part is red: one half of the bar."
            show: { drawn: fraction, kind: bar, parts: 2, shaded: 1 }
          - text: "2/4 = 1/2"
            say: "Now the same bar is cut into four equal parts. Two of the four are red: two quarters. Look, just as much of the bar is red as before. Two quarters is the same as one half. Fractions that are worth the same are called equivalent fractions."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 2 }
          - text: "4/4 = 1 whole\n2/2 = 1 whole\n3/3 = 1 whole"
            say: "When every part is red, it is the whole thing. Four quarters make one whole. Two halves make one whole, and so do three thirds."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 4 }
          - text: "1/2 and 2/4\nThe top number is half of the bottom number."
            say: "Here is a quick way to spot a half. In one half and in two quarters, the top number is half of the bottom number. One is half of two, and two is half of four."
          - text: "Did you know? A netball match is played in 4 quarters. After 2 quarters, it is half-time!"
            say: "Did you know? A netball match is played in four quarters. After two quarters, the players have a rest. It's called half-time, because two quarters are one half!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Is it true? 2/4 is the same as 1/2."
                say: "Two quarters of the rectangle are red. Is two quarters the same as one half?"
                show: { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 2 }
                answer: true
                hints:
                  - "Is half of the rectangle red?"
                  - "2 of the 4 parts are red, and 2 are white."
                  - "Yes, 2/4 is the same as 1/2."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Which shows the same amount as 1/2?"
                say: "Which circle shows the same amount as one half?"
                options:
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 2 }
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
                answer: "2/4"
                feedback:
                  "1/4": "Only one quarter is red. A half needs 2 of the 4 parts."
                hints:
                  - "Find the circle where half is red and half is white."
                  - "Half of 4 parts is 2 parts."
                  - "The circle with 2 of its 4 parts red."
              - id: l1-f3
                type: fill_in_blank
                text: "1/2 = _/4"
                say: "One half is how many quarters?"
                frame: "1/2 = _/4"
                options: ["1", "2", "3"]
                answer: ["2"]
                hints:
                  - "Cut each half into 2 equal parts. How many quarters are in one half?"
                  - "4 quarters make the whole, so half of them are in a half."
                  - "2. 1/2 = 2/4."
              - id: l1-f4
                type: multiple_choice
                text: "How many quarters make one whole?"
                say: "How many quarters make one whole?"
                show: { drawn: fraction, kind: circle, parts: 4, shaded: 4 }
                options: ["4", "2", "1"]
                answer: "4"
                hints:
                  - "Count all the parts of the circle."
                  - "Every part is red, so it is the whole circle."
                  - "4 quarters."
              - id: l1-f5
                type: multiple_choice
                text: "Which fraction is the same as 1/2?"
                say: "Which fraction is the same as one half?"
                options: ["2/4", "1/4", "3/4"]
                answer: "2/4"
                option_audio: false
                feedback:
                  "1/4": "1/4 has the same top number, but a quarter is smaller than a half."
                hints:
                  - "Think of a bar cut into 4 equal parts. How many parts are half of it?"
                  - "Half of 4 parts is 2 parts."
                  - "2/4."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Is it true? 1/4 is the same as 1/2."
                say: "One quarter of the bar is red. Is one quarter the same as one half?"
                show: { drawn: fraction, kind: bar, parts: 4, shaded: 1 }
                answer: false
                hints: ["Is half of the bar red?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which shows the same amount as 2/4?"
                say: "Which bar shows the same amount as two quarters?"
                options:
                  - { drawn: fraction, kind: bar, parts: 2, shaded: 1 }
                  - { drawn: fraction, kind: bar, parts: 3, shaded: 1 }
                  - { drawn: fraction, kind: bar, parts: 2, shaded: 2 }
                answer: "1/2"
                hints: ["Two quarters is half of the whole."]
              - id: l1-s3
                type: fill_in_blank
                text: "One whole: 2/2 = _/4"
                say: "Two halves make one whole. How many quarters make one whole?"
                frame: "2/2 = _/4"
                options: ["2", "3", "4"]
                answer: ["4"]
                hints: ["When all the parts are red, the top and bottom numbers are the same."]
              - id: l1-s4
                type: matching
                text: "Match each picture to its name."
                say: "Match each picture to its name."
                pairs:
                  - { left: { drawn: fraction, kind: bar, parts: 4, shaded: 2 }, right: { text: "one half" } }
                  - { left: { drawn: fraction, kind: bar, parts: 4, shaded: 4 }, right: { text: "one whole" } }
                  - { left: { drawn: fraction, kind: bar, parts: 4, shaded: 1 }, right: { text: "one quarter" } }
                  - { left: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }, right: { text: "three quarters" } }
                hints: ["Two of four parts is the same as one half."]
              - id: l1-s5
                type: multiple_choice
                text: "3/3 = _"
                say: "Three thirds are the same as what?"
                options: ["1 whole", "3", "1/3"]
                answer: "1 whole"
                option_audio: false
                hints: ["All 3 of the 3 equal parts are counted."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "1/2 = 2/_"
                say: "One half is two of what? Fill in the bottom number."
                frame: "1/2 = 2/_"
                options: ["2", "3", "4"]
                answer: ["4"]
              - id: l1-n2
                type: true_false
                text: "Is it true? 4/4 is one whole."
                say: "Four quarters is one whole. Is that true?"
                answer: true
              - id: l1-n3
                type: image_multiple_choice
                text: "Which shows the same amount as 1/2?"
                say: "Which picture shows the same amount as one half?"
                options:
                  - { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 2 }
                  - { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 1 }
                  - { drawn: fraction, kind: circle, parts: 3, shaded: 1 }
                answer: "2/4"
              - id: l1-n4
                type: multiple_choice
                text: "Which is not one whole?"
                say: "Which of these is not one whole?"
                options: ["1/4", "2/2", "4/4"]
                answer: "1/4"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Ali eats 1/4 of a pizza. Zoe eats 1/2 of a pizza the same size. Did they eat the same amount?"
                say: "Ali eats one quarter of a pizza. Zoe eats one half of a pizza the same size. Did they eat the same amount?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "1/2 = _/4"
            say: "One half is how many quarters?"
            frame: "1/2 = _/4"
            options: ["1", "2", "4"]
            answer: ["2"]
          - id: l1-c2
            type: true_false
            text: "Is it true? 3/4 is the same as 1/2."
            say: "Three quarters is the same as one half. Is that true?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "How many halves make one whole?"
            say: "How many halves make one whole?"
            options: ["2", "1", "4"]
            answer: "2"
          - id: l1-c4
            type: image_multiple_choice
            text: "Which bar shows the same amount as 1/2?"
            say: "Which bar shows the same amount as one half?"
            options:
              - { drawn: fraction, kind: bar, parts: 4, shaded: 3 }
              - { drawn: fraction, kind: bar, parts: 4, shaded: 2 }
              - { drawn: fraction, kind: bar, parts: 3, shaded: 1 }
            answer: "2/4"
          - id: l1-c5
            type: fill_in_blank
            text: "4/4 = _/2"
            say: "Four quarters are the same as how many halves?"
            frame: "4/4 = _/2"
            options: ["1", "2", "4"]
            answer: ["2"]
          - id: l1-c6
            type: true_false
            text: "Is it true? The red part is 1/2 of the circle."
            say: "The red part is one half of the circle. Is that true?"
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 2 }
            answer: true

  - n: 2
    title: { de: "Gleich viel in Mengen", en: "The same amount in sets" }
    goal:
      de: "Finde gleich große Brüche in einer Punktemenge, so wie zwei Viertel von 8 Punkten die Hälfte sind, also 4."
      en: "Find fractions worth the same in a set of dots, like two quarters of 8 dots is half, which is 4."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "1/2 = _/4"
            say: "One half is how many quarters?"
            frame: "1/2 = _/4"
            options: ["1", "2", "3"]
            answer: ["2"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? 2/2 is one whole."
            say: "Two halves make one whole. Is that true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 dots in 4 equal rows. 2 rows are red.\nIs that half of the dots?"
            say: "Here are eight dots in four equal rows. Two rows are red: two quarters of the dots. Do you think that is more than half, less than half, or exactly half? Have a guess."
            show: { drawn: dots, array: [4, 2], split_rows: 2 }
          - text: "2/4 of 8 = 4\n1/2 of 8 = 4"
            say: "Two quarters of eight dots is four dots. Half of eight is four as well. So two quarters of a set is the same as half of it."
            show: { drawn: dots, array: [4, 2], split_rows: 2 }
          - text: "4/8 = 2/4 = 1/2"
            say: "This bar is cut into eight equal parts. Four are red: four eighths. Half the bar is red, so four eighths, two quarters and one half are all equivalent."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 4 }
          - text: "1/2 = 2/4 = 4/8\nThe top number is half of the bottom number."
            say: "In each fraction worth one half, the top number is half of the bottom number: one and two, two and four, four and eight. Two eighths is not a half, because two is not half of eight."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "2/4 of the dots are red. Which fraction is the same?"
                say: "Two quarters of the dots are red. Which fraction is the same?"
                show: { drawn: dots, array: [4, 3], split_rows: 2 }
                options: ["1/2", "1/4", "2/3"]
                answer: "1/2"
                option_audio: false
                feedback:
                  "1/4": "1 row would be one quarter. 2 of the 4 rows are red: that is half."
                hints:
                  - "Are half of the rows red?"
                  - "2 rows are red and 2 rows are blue."
                  - "1/2."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Find both."
                say: "Find two quarters of twelve, then one half of twelve."
                frame: "2/4 of 12 = _   1/2 of 12 = _"
                options: ["3", "6", "8"]
                answer: ["6", "6"]
                hints:
                  - "One quarter of 12 is 3."
                  - "Two quarters is 3 + 3. Half of 12 is 6."
                  - "6 and 6: they are the same."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which bar shows the same amount as 1/2?"
                say: "Which bar shows the same amount as one half?"
                options:
                  - { drawn: fraction, kind: bar, parts: 8, shaded: 4 }
                  - { drawn: fraction, kind: bar, parts: 8, shaded: 2 }
                  - { drawn: fraction, kind: bar, parts: 8, shaded: 6 }
                answer: "4/8"
                hints:
                  - "Find the bar where the red part and the white part are the same size."
                  - "Half of 8 parts is 4 parts."
                  - "The bar with 4 of its 8 parts red."
              - id: l2-f4
                type: true_false
                text: "Is it true? 4/8 is the same as 1/2."
                say: "Four eighths is the same as one half. Is that true?"
                answer: true
                hints:
                  - "Is the top number half of the bottom number?"
                  - "4 is half of 8."
                  - "Yes, it is true."
              - id: l2-f5
                type: multiple_choice
                text: "Which fraction is the same as one half?"
                say: "Which fraction is the same as one half?"
                options: ["4/8", "2/8", "4/6"]
                answer: "4/8"
                option_audio: false
                feedback:
                  "2/8": "2 is not half of 8. Half of 8 is 4."
                hints:
                  - "Look for a top number that is half of the bottom number."
                  - "Half of 8 is 4. Half of 6 is 3."
                  - "4/8."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Is it true? Half of the dots are red."
                say: "Half of the dots are red. Is that true?"
                show: { drawn: dots, array: [4, 4], split_rows: 1 }
                answer: false
                hints: ["How many of the 4 rows are red?"]
              - id: l2-s2
                type: multiple_choice
                text: "1/2 = _/8"
                say: "One half is how many eighths?"
                options: ["4", "2", "8"]
                answer: "4"
                hints: ["What is half of 8?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "Where are half of the dots red?"
                say: "In which picture are half of the dots red?"
                options:
                  - { drawn: dots, array: [4, 2], split_rows: 2, key: "2/4" }
                  - { drawn: dots, array: [4, 2], split_rows: 1, key: "1/4" }
                  - { drawn: dots, array: [4, 2], split_rows: 3, key: "3/4" }
                answer: "2/4"
                hints: ["Half of 4 rows is 2 rows."]
              - id: l2-s4
                type: multiple_choice
                text: "Sam eats 2/4 of a cake. Which is the same?"
                say: "Sam eats two quarters of a cake. Which is the same amount?"
                options: ["1/2 of the cake", "1/4 of the cake", "2 cakes"]
                answer: "1/2 of the cake"
                feedback:
                  "2 cakes": "Two whole cakes would be a feast! Two quarters is only part of one cake."
                hints: ["Two quarters is the same as one half."]
              - id: l2-s5
                type: fill_in_blank
                text: "2/4 of 20 = _"
                say: "What is two quarters of twenty?"
                frame: "2/4 of 20 = _"
                options: ["2", "5", "10"]
                answer: ["10"]
                hints: ["Two quarters is the same as half. What is half of 20?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mia has 8 stickers and gives away 1/2 of them. Ben has 8 stickers and gives away 2/4 of them. Who gives away more?"
                say: "Mia has eight stickers and gives away one half of them. Ben has eight stickers and gives away two quarters of them. Who gives away more?"
                options: ["They give away the same.", "Mia", "Ben"]
                answer: "They give away the same."
              - id: l2-n2
                type: true_false
                text: "A pizza has 4 equal slices. Tom eats 2 slices. Tom says: “I ate half the pizza.” Is Tom right?"
                say: "A pizza has four equal slices. Tom eats two slices. Tom says he ate half the pizza. Is Tom right?"
                answer: true
              - id: l2-n3
                type: fill_in_blank
                text: "Fill in the fractions that are worth one half."
                say: "Fill in the fractions that are worth one half."
                frame: "1/2 = _/4 = _/8"
                options: ["2", "4", "6", "8"]
                answer: ["2", "4"]
              - id: l2-n4
                type: multiple_choice
                text: "A chocolate bar has 8 squares. Ella eats 1/2 of it. How many squares does she eat?"
                say: "A chocolate bar has eight squares. Ella eats one half of it. How many squares does she eat?"
                show: { drawn: fraction, kind: rect, parts: 8, rows: 2, shaded: 0 }
                options: ["4", "2", "6"]
                answer: "4"
              - id: l2-n5
                type: true_false
                text: "Is it true? 2/8 is the same as 1/2."
                say: "Two eighths is the same as one half. Is that true?"
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: half-pictures
            type: image_multiple_choice
            text: "Which shows the same amount as 1/2?"
            say: "Which circle shows the same amount as one half?"
            options:
              - { drawn: fraction, kind: circle, parts: 8, shaded: 4 }
              - { drawn: fraction, kind: circle, parts: 8, shaded: 2 }
              - { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
            answer: "4/8"
          - id: l2-c2
            part: half-numbers
            type: fill_in_blank
            text: "_/4 = 1/2"
            say: "How many quarters are the same as one half?"
            frame: "_/4 = 1/2"
            options: ["1", "2", "4"]
            answer: ["2"]
          - id: l2-c3
            part: whole
            type: true_false
            text: "Is it true? 3/3 is one whole."
            say: "Three thirds make one whole. Is that true?"
            answer: true
          - id: l2-c4
            part: half-numbers
            type: multiple_choice
            text: "Which fraction is not the same as one half?"
            say: "Which fraction is not the same as one half?"
            options: ["1/4", "2/4", "4/8"]
            answer: "1/4"
            option_audio: false
          - id: l2-c5
            part: in-sets
            type: multiple_choice
            text: "Lily has 16 marbles. 2/4 of them are red. How many red marbles does she have?"
            say: "Lily has sixteen marbles. Two quarters of them are red. How many red marbles does she have?"
            show: { drawn: dots, array: [4, 4], split_rows: 2 }
            options: ["8", "2", "4"]
            answer: "8"
          - id: l2-c6
            part: half-pictures
            type: image_multiple_choice
            text: "Which rectangle shows the same amount as 1/2?"
            say: "Which rectangle shows the same amount as one half?"
            options:
              - { drawn: fraction, kind: rect, parts: 8, rows: 2, shaded: 3 }
              - { drawn: fraction, kind: rect, parts: 8, rows: 2, shaded: 4 }
              - { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 1 }
            answer: "4/8"
          - id: l2-c7
            part: half-pictures
            type: true_false
            text: "Is it true? Half of the rectangle is red."
            say: "Half of the rectangle is red. Is that true?"
            show: { drawn: fraction, kind: rect, parts: 8, rows: 4, shaded: 4 }
            answer: true
          - id: l2-c8
            part: half-pictures
            type: true_false
            text: "Is it true? The red part is the same as 1/2 of the bar."
            say: "The red part is the same as one half of the bar. Is that true?"
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 2 }
            answer: false
          - id: l2-c9
            part: half-pictures
            type: multiple_choice
            text: "4/8 of the circle is red. Which fraction is the same?"
            say: "Four eighths of the circle is red. Which fraction is the same?"
            show: { drawn: fraction, kind: circle, parts: 8, shaded: 4 }
            options: ["1/2", "1/4", "4/4"]
            answer: "1/2"
            option_audio: false
          - id: l2-c10
            part: half-numbers
            type: fill_in_blank
            text: "4/8 = _/2"
            say: "Four eighths is the same as how many halves?"
            frame: "4/8 = _/2"
            options: ["1", "2", "4"]
            answer: ["1"]
