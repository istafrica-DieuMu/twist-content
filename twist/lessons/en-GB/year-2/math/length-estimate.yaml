# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.length-estimate
skill: math.length.estimate
curriculum: en-GB
language: en
title:
  de: Längen schätzen
  en: Estimating lengths
summary: >
  Lesson 1 learns two benchmarks (1 cm is about the width of a finger,
  1 m is about one big step) and picks the length that fits a thing,
  watching the unit; lesson 2 estimates with a benchmark (the rug is about
  3 big steps, so about 3 m), checks an estimate against a ruler, spots
  estimates in the wrong unit, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Längen, en: Length }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.length.cm-m]
  also_practises: [math.length.cm-m]
  vocabulary: { en: [estimate, about, centimetre, cm, metre, m, finger width, big step, measure] }
  forms: [picture, drawn, text, audio]
  drawn: [ruler]
  facets: [units]
  misconceptions:
    - id: right-number-wrong-unit
      what: Picks a sensible number with the wrong unit (a pencil is 15 m long)
      addressed: lesson 1 Learn sets 15 cm against 15 m; every stage offers the same number in the other unit, with feedback in l1-f2 and l1-f5; l2-f5, l2-s5, l2-n5 and l2-c4 ask which estimate does not make sense
    - id: estimate-must-be-exact
      what: Thinks an estimate is wrong if it is not exactly the measured length
      addressed: lesson 2 Learn says an estimate only has to be close; l2-f4, l2-s4 and l2-n4 ask whether an estimate was close, and l2-c5 asks it directly
    - id: benchmark-once
      what: Uses the benchmark once and forgets to count it (2 pencils long, so 15 cm)
      addressed: l2-f2 has feedback on 15 cm; l2-f1, l2-s1, l2-n1 and l2-c3 count big steps
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "So lang ist 1 cm, so lang ist 1 m", en: "How long 1 cm and 1 m are" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1 m = _ cm"
            say: "How many centimetres are in one metre?"
            options: ["100", "10"]
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which would you measure in metres?"
            say: "Which would you measure in metres: the playground or a rubber?"
            options: ["the playground", "a rubber"]
            answer: "the playground"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 cm is about the width of your finger."
            say: "One centimetre is about the width of your little finger. A pencil is about fifteen centimetres long: fifteen finger widths."
            show: { object: hand }
          - text: "1 m is about one big step."
            say: "One metre is about one big step. A door is about two metres tall: that is taller than a grown-up."
            show: { object: door }
          - text: "A pencil is 15 cm long, not 15 m!"
            say: "Always look at the unit. A pencil is fifteen centimetres long. Fifteen metres would be longer than a bus."
            show: { object: pencil }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "About how long is a pencil?"
                say: "About how long is a pencil?"
                show: { object: pencil }
                options: ["15 cm", "15 m", "1 cm"]
                answer: "15 cm"
                hints:
                  - "A pencil fits in your pencil case."
                  - "It is about fifteen finger widths long."
                  - "15 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "About how tall is a door?"
                say: "About how tall is a door?"
                show: { object: door }
                options: ["2 m", "2 cm", "20 m"]
                answer: "2 m"
                feedback:
                  "2 cm": "2 cm is only two finger widths. A door is taller than a grown-up."
                  "20 m": "20 m would be as tall as a big block of flats."
                hints:
                  - "A door is a bit taller than a grown-up."
                  - "That is about two big steps."
                  - "2 m."
              - id: l1-f3
                type: multiple_choice
                text: "About how wide is your finger?"
                say: "About how wide is your little finger?"
                show: { object: hand }
                options: ["1 cm", "1 m", "10 cm"]
                answer: "1 cm"
                hints:
                  - "Your finger is thin."
                  - "We used a finger width for one centimetre."
                  - "1 cm."
              - id: l1-f4
                type: true_false
                text: "A classroom is about 8 cm long."
                say: "Is it true? A classroom is about eight centimetres long."
                answer: false
                hints:
                  - "8 cm is shorter than a pencil."
                  - "A classroom is many big steps long, so use metres."
                  - "No. It is about 8 m long."
              - id: l1-f5
                type: multiple_choice
                text: "About how long is a bus?"
                say: "About how long is a bus?"
                show: { object: bus }
                options: ["10 m", "10 cm", "100 m"]
                answer: "10 m"
                feedback:
                  "10 cm": "10 cm is shorter than a pencil. A bus is many big steps long."
                hints:
                  - "A bus is much longer than a car."
                  - "It is about ten big steps long."
                  - "10 m."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "About how long is a spoon?"
                say: "About how long is a spoon?"
                show: { object: spoon }
                options: ["15 cm", "15 m", "150 cm"]
                answer: "15 cm"
                hints: ["A spoon is about as long as a pencil."]
              - id: l1-s2
                type: multiple_choice
                text: "About how long is a bed?"
                say: "About how long is a bed?"
                show: { object: bed }
                options: ["2 m", "2 cm", "20 m"]
                answer: "2 m"
                hints: ["A grown-up can lie down in it."]
              - id: l1-s3
                type: multiple_choice
                text: "About how long is an ant?"
                say: "About how long is an ant?"
                show: { object: ant }
                options: ["1 cm", "1 m", "10 cm"]
                answer: "1 cm"
                hints: ["An ant is tiny. It could sit on your finger."]
              - id: l1-s4
                type: true_false
                text: "A big picture book is about 30 cm long."
                say: "Is it true? A big picture book is about thirty centimetres long."
                show: { object: book }
                answer: true
                hints: ["A big book is about as long as two pencils."]
              - id: l1-s5
                type: multiple_choice
                text: "About how tall is a giraffe?"
                say: "About how tall is a giraffe?"
                show: { object: giraffe }
                options: ["5 m", "5 cm", "50 m"]
                answer: "5 m"
                hints: ["A giraffe is much taller than a door, but not as tall as a block of flats."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "About how long is a rubber?"
                say: "About how long is a rubber?"
                show: { object: rubber }
                options: ["4 cm", "4 m", "40 cm"]
                answer: "4 cm"
              - id: l1-n2
                type: multiple_choice
                text: "About how long is a car?"
                say: "About how long is a car?"
                show: { object: car }
                options: ["4 m", "4 cm", "40 m"]
                answer: "4 m"
              - id: l1-n3
                type: multiple_choice
                text: "About how tall is a table?"
                say: "About how tall is a table?"
                show: { object: table }
                options: ["70 cm", "70 m", "7 cm"]
                answer: "70 cm"
              - id: l1-n4
                type: true_false
                text: "A football pitch is about 100 m long."
                say: "Is it true? A football pitch is about one hundred metres long."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "About how long is your shoe?"
                say: "About how long is your shoe?"
                show: { object: shoe }
                options: ["20 cm", "20 m", "2 cm"]
                answer: "20 cm"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "About how long is a crayon?"
            say: "About how long is a crayon?"
            show: { object: crayon }
            options: ["9 cm", "9 m", "90 cm"]
            answer: "9 cm"
          - id: l1-c2
            type: multiple_choice
            text: "About how long is a sofa?"
            say: "About how long is a sofa?"
            show: { object: sofa }
            options: ["2 m", "2 cm", "20 m"]
            answer: "2 m"
          - id: l1-c3
            type: true_false
            text: "A fingernail is about 1 m wide."
            say: "Is it true? A fingernail is about one metre wide."
            answer: false

  - n: 2
    title: { de: "Mit Stützpunkten schätzen", en: "Estimating with benchmarks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "About how long is a pencil?"
            say: "About how long is a pencil?"
            options: ["15 cm", "15 m"]
            answer: "15 cm"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is about 1 m long?"
            say: "What is about one metre long?"
            options: ["one big step", "one finger width"]
            answer: "one big step"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The whiteboard is about 3 big steps long.\nSo it is about 3 m long."
            say: "To estimate, use something you know. The whiteboard is about three big steps long. One big step is about one metre. So the whiteboard is about three metres long."
          - text: "The book is about 2 pencils long.\n15 cm and 15 cm: about 30 cm."
            say: "The book is about as long as two pencils. One pencil is about fifteen centimetres. Fifteen and fifteen make thirty. So the book is about thirty centimetres long."
          - text: "Sam estimates 5 cm. The ruler shows 6 cm.\nA good estimate!"
            say: "Sam estimates the strip is five centimetres long. Then he measures it with a ruler: six centimetres. That is very close. An estimate does not have to be exactly right. It just has to be close."
            show: { drawn: ruler, to: 10, length: 6 }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The corridor is about 10 big steps long. About how long is it?"
                say: "The corridor is about ten big steps long. About how long is it?"
                options: ["10 m", "10 cm", "100 m"]
                answer: "10 m"
                hints:
                  - "One big step is about 1 m."
                  - "Ten big steps are about ten metres."
                  - "10 m."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The tray is about 2 pencils long. About how long is it?"
                say: "The tray is about as long as two pencils. One pencil is about fifteen centimetres. About how long is the tray?"
                options: ["30 cm", "15 cm", "30 m"]
                answer: "30 cm"
                feedback:
                  "15 cm": "15 cm is one pencil. The tray is two pencils long: 15 cm and 15 cm."
                hints:
                  - "One pencil is about 15 cm."
                  - "Two pencils: 15 cm and 15 cm."
                  - "30 cm."
              - id: l2-f3
                type: multiple_choice
                text: "The snail is about 3 finger widths long. About how long is it?"
                say: "The snail is about three finger widths long. About how long is it?"
                show: { object: snail }
                options: ["3 cm", "3 m", "30 cm"]
                answer: "3 cm"
                hints:
                  - "One finger width is about 1 cm."
                  - "Three finger widths are about three centimetres."
                  - "3 cm."
              - id: l2-f4
                type: true_false
                text: "Ava estimates the strip is 8 cm long. Is her estimate close?"
                say: "Ava estimates the strip is eight centimetres long. Look at the ruler. Is her estimate close?"
                show: { drawn: ruler, length: 9 }
                answer: true
                hints:
                  - "Read the number at the end of the strip."
                  - "The strip ends at 9 cm. 8 cm is only 1 cm away."
                  - "Yes, it is close."
              - id: l2-f5
                type: multiple_choice
                text: "Which estimate does not make sense?"
                say: "Ben makes three estimates. Which estimate does not make sense?"
                options: ["My book is 30 m long.", "My pencil is 15 cm long.", "The door is 2 m tall."]
                answer: "My book is 30 m long."
                hints:
                  - "Look at the units."
                  - "30 m would be longer than two buses."
                  - "My book is 30 m long."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The rug is about 3 big steps long. About how long is it?"
                say: "The rug is about three big steps long. About how long is it?"
                options: ["3 m", "3 cm", "30 m"]
                answer: "3 m"
                hints: ["One big step is about 1 m."]
              - id: l2-s2
                type: multiple_choice
                text: "The box is about 5 finger widths long. About how long is it?"
                say: "The box is about five finger widths long. About how long is it?"
                options: ["5 cm", "5 m", "50 cm"]
                answer: "5 cm"
                hints: ["One finger width is about 1 cm."]
              - id: l2-s3
                type: true_false
                text: "Leo estimates the strip is 3 cm long. Is his estimate close?"
                say: "Leo estimates the strip is three centimetres long. Look at the ruler. Is his estimate close?"
                show: { drawn: ruler, length: 11 }
                answer: false
                hints: ["Read the number at the end of the strip and compare it with 3 cm."]
              - id: l2-s4
                type: true_false
                text: "Tom estimates his pencil is 15 cm long. He measures 14 cm. Is his estimate close?"
                say: "Tom estimates his pencil is fifteen centimetres long. He measures it: fourteen centimetres. Is his estimate close?"
                answer: true
                hints: ["An estimate only has to be close, not exactly right."]
              - id: l2-s5
                type: multiple_choice
                text: "Which estimate does not make sense?"
                say: "Mia makes three estimates. Which estimate does not make sense?"
                options: ["The car is 4 cm long.", "The bed is 2 m long.", "The spoon is 15 cm long."]
                answer: "The car is 4 cm long."
                hints: ["Look at the units. Is a car shorter than a pencil?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The fence is about 20 big steps long. About how long is it?"
                say: "The garden fence is about twenty big steps long. About how long is it?"
                show: { object: fence }
                options: ["20 m", "20 cm", "200 m"]
                answer: "20 m"
              - id: l2-n2
                type: multiple_choice
                text: "The candle is about 1 pencil long. About how long is it?"
                say: "The candle is about as long as one pencil. About how long is it?"
                options: ["15 cm", "15 m", "1 cm"]
                answer: "15 cm"
              - id: l2-n3
                type: multiple_choice
                text: "The worm is about 8 finger widths long. About how long is it?"
                say: "The worm is about eight finger widths long. About how long is it?"
                options: ["8 cm", "8 m", "80 cm"]
                answer: "8 cm"
              - id: l2-n4
                type: true_false
                text: "Zara estimates the hall is 2 m long. She measures 9 m. Is her estimate close?"
                say: "Zara estimates the hall is two metres long. She measures it: nine metres. Is her estimate close?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Which estimate does not make sense?"
                say: "Ollie makes three estimates. Which estimate does not make sense?"
                options: ["The bus is 10 cm long.", "The whiteboard is 3 m long.", "The book is 30 cm long."]
                answer: "The bus is 10 cm long."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "About how long is a bike?"
            say: "About how long is a bike?"
            show: { object: bike }
            options: ["2 m", "2 cm", "20 m"]
            answer: "2 m"
          - id: l2-c2
            type: multiple_choice
            text: "About how long is a toothbrush?"
            say: "About how long is a toothbrush?"
            options: ["20 cm", "20 m", "2 cm"]
            answer: "20 cm"
          - id: l2-c3
            type: multiple_choice
            text: "The bench is about 2 big steps long. About how long is it?"
            say: "The park bench is about two big steps long. About how long is it?"
            show: { object: bench }
            options: ["2 m", "2 cm", "20 m"]
            answer: "2 m"
          - id: l2-c4
            type: multiple_choice
            text: "Which estimate does not make sense?"
            say: "Priya makes three estimates. Which estimate does not make sense?"
            options: ["The ant is 1 m long.", "The door is 2 m tall.", "The pencil is 15 cm long."]
            answer: "The ant is 1 m long."
          - id: l2-c5
            type: true_false
            text: "An estimate must be exactly right."
            say: "Is it true? An estimate must be exactly right."
            answer: false
