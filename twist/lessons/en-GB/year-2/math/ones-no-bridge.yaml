# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.ones-no-bridge
skill: math.add-sub-to-100.ones-no-bridge
curriculum: en-GB
language: en
title:
  de: Einer dazu und weg
  en: Adding and subtracting ones
summary: >
  Adding and subtracting ones without crossing a ten (34 + 5, 47 − 3).
  Only the ones change; the tens stay. Lesson 1 adds ones with tens rods
  and ones cubes and the related fact (4 + 5 helps with 34 + 5); lesson 2
  subtracts ones, mixes adding and subtracting, and ends with the skill
  check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.place-value, math.add-sub-to-20.analog-to-20]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { en: [tens, ones, add, subtract, take away, related fact] }
  forms: [drawn, text, audio]
  drawn: [base-ten]
  facets: [currency]
  parts:
    - { id: add, what: { de: Einer ohne Zehnerübergang addieren, en: adding ones without crossing a ten } }
    - { id: sub, what: { de: Einer ohne Zehnerübergang subtrahieren, en: subtracting ones without crossing a ten } }
    - { id: ones-change, what: { de: "wissen, dass sich nur die Einer ändern", en: knowing that only the ones change } }
    - { id: related, what: { de: die kleine Aufgabe nutzen, en: using the related fact } }
  misconceptions:
    - id: add-to-tens
      what: Adds the ones to the tens digit (34 + 5 = 84)
      addressed: lesson 1 Learn shows the new cubes joining the ones; "what changes" tasks l1-f1, l1-s2, l2-f3 and l2-c3; the wrong-place answer is an option with feedback in l1-f2 and l1-f5
    - id: digits-joined
      what: Writes the digits side by side (43 + 5 = 435)
      addressed: hints read answers back as tens and ones; l1-s4 asks whether 43 + 5 = 435, and its hint asks whether five more can make a number so much bigger
    - id: tens-lost
      what: Drops the tens and answers with the related fact (34 + 5 = 9)
      addressed: the related fact and the bigger sum sit side by side in l1-f3, l1-s3, l2-f2 and l2-s2; the bare fact is an option with feedback in l1-f2, l1-f5 and l2-f1
    - id: wrong-operation
      what: Adds when the sign says subtract
      addressed: l2-f1 has the added answer as an option with feedback; l2-s5 and l2-n2 mix adding into the subtraction lesson
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Einer dazu, en: Adding ones }
    goal:
      de: "Addiere Einer, ohne dass sich die Zehner ändern, so wie 34 + 5 ist 39, weil 4 + 5 gleich 9 ist."
      en: "Add ones while the tens stay the same, like 34 + 5 is 39, because 4 + 5 is 9."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "4 + 5 = _"
            say: "Four add five."
            answer: "9"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What number is this?"
            say: "Count the tens and the ones. What number is this?"
            show: { drawn: base-ten, tens: 3, ones: 4 }
            options: ["34", "43", "7"]
            answer: "34"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "34 + 5. What will change: the tens or the ones?"
            say: "Here is thirty-four: three tens and four ones. Five more ones are coming. What do you think will change, the tens or the ones? Have a guess."
            show: { drawn: base-ten, tens: 3, ones: 4 }
          - text: "34 + 5"
            say: "The ones! Five more ones come. They join the other ones. The tens rods stay just as they are."
            show: { drawn: base-ten, tens: 3, ones: 9 }
          - text: "34 + 5 = 39"
            say: "Three tens and nine ones make thirty-nine. Only the ones have changed."
          - text: "4 + 5 = 9 · 34 + 5 = 39"
            say: "The related fact helps. Four add five is nine, so thirty-four add five is thirty-nine."
          - text: "Did you know? A pack of playing cards has 52 cards. Many packs have 2 jokers too: 52 + 2 = 54."
            say: "Did you know? A pack of playing cards has fifty-two cards. Many packs come with two jokers as well. Fifty-two add two is fifty-four. Only the ones change!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "24 + 5: what changes?"
                say: "Twenty-four add five. What changes?"
                options: ["the ones", "the tens", "both"]
                answer: "the ones"
                feedback:
                  "the tens": "Five is five ones. They join the ones, so the tens stay."
                hints:
                  - "Is five made of ones or tens?"
                  - "Five ones join the four ones. The two tens stay."
                  - "Only the ones change."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "52 + 3 = _"
                say: "Fifty-two add three."
                show: { drawn: base-ten, tens: 5, ones: 2 }
                options: ["55", "82", "5"]
                answer: "55"
                feedback:
                  "82": "Three is three ones, not three tens. The tens stay at five."
                  "5": "The five tens are still there. Two ones and three ones make five ones, and the five tens stay."
                hints:
                  - "The tens stay: five tens."
                  - "Two ones and three ones make five ones."
                  - "Five tens and five ones: 55."
              - id: l1-f3
                type: fill_in_blank
                text: "Use the related fact."
                say: "Work out the related fact first, then the bigger sum."
                frame: "3 + 4 = _ · 63 + 4 = _"
                options: ["7", "67", "103", "17"]
                answer: ["7", "67"]
                hints:
                  - "Three add four."
                  - "The six tens stay."
                  - "7, and then 67."
              - id: l1-f4
                type: text_input
                text: "21 + 6 = _"
                say: "Twenty-one add six."
                show: { drawn: base-ten, tens: 2, ones: 1 }
                answer: "27"
                hints:
                  - "The two tens stay."
                  - "1 one and 6 ones make 7 ones."
                  - "27."
              - id: l1-f5
                type: multiple_choice
                text: "14 + 5 = _"
                say: "Fourteen add five. Which answer is right?"
                options: ["19", "64", "9"]
                answer: "19"
                feedback:
                  "64": "You added the five to the tens. It belongs with the ones."
                  "9": "The ten is missing. Fourteen has one ten."
                hints:
                  - "Four add five is nine."
                  - "The one ten stays."
                  - "19."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "45 + 3 = _"
                say: "Forty-five add three."
                answer: "48"
                hints: ["Add the ones first: five add three."]
              - id: l1-s2
                type: multiple_choice
                text: "81 + 7: what changes?"
                say: "Eighty-one add seven. What changes?"
                options: ["the ones", "the tens", "both"]
                answer: "the ones"
                hints: ["Is seven made of ones or tens?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Use the related fact."
                say: "Work out the related fact first, then the bigger sum."
                frame: "2 + 6 = _ · 42 + 6 = _"
                options: ["8", "48", "102", "46"]
                answer: ["8", "48"]
                hints: ["The four tens in the bigger sum stay."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 43 + 5 = 435"
                say: "Forty-three add five is four hundred and thirty-five. Is that true?"
                answer: false
                hints: ["Can five more make a number so much bigger?"]
              - id: l1-s5
                type: text_input
                text: "There are 66 people on the bus. 2 more get on. How many people are on the bus now?"
                say: "There are sixty-six people on the bus. Two more get on. How many people are on the bus now?"
                show: { object: bus }
                answer: "68"
                hints: ["The six tens stay."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "53 + 4 = _"
                say: "Fifty-three add four."
                answer: "57"
              - id: l1-n2
                type: multiple_choice
                text: "92 + 6 = _"
                say: "Ninety-two add six."
                options: ["98", "152", "8"]
                answer: "98"
              - id: l1-n3
                type: fill_in_blank
                text: "Use the related fact."
                say: "Work out the related fact first, then the bigger sum."
                frame: "1 + 8 = _ · 31 + 8 = _"
                options: ["9", "39", "111", "38"]
                answer: ["9", "39"]
              - id: l1-n4
                type: text_input
                text: "70 + 6 = _"
                say: "Seventy add six."
                answer: "76"
              - id: l1-n5
                type: true_false
                text: "Is it true? 24 + 3 = 54"
                say: "Twenty-four add three is fifty-four. Is that true?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "62 + 5 = _"
            say: "Sixty-two add five."
            answer: "67"
          - id: l1-c2
            type: multiple_choice
            text: "44 + 4 = _"
            say: "Forty-four add four."
            options: ["48", "84", "8"]
            answer: "48"
          - id: l1-c3
            type: true_false
            text: "Is it true? 81 + 8 = 89"
            say: "Eighty-one add eight is eighty-nine. Is that true?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Use the related fact."
            say: "Work out the related fact first, then the bigger sum."
            frame: "2 + 5 = _ · 72 + 5 = _"
            options: ["7", "77", "12", "75"]
            answer: ["7", "77"]
          - id: l1-c5
            type: multiple_choice
            text: "33 + 6 = _"
            say: "Thirty-three add six."
            options: ["39", "93", "9"]
            answer: "39"
          - id: l1-c6
            type: text_input
            text: "42 + 7 = _"
            say: "Forty-two add seven."
            show: { drawn: base-ten, tens: 4, ones: 2 }
            answer: "49"

  - n: 2
    title: { de: "Einer weg, Einer dazu", en: "Subtracting and adding ones" }
    goal:
      de: "Nimm Einer weg oder gib welche dazu, und die Zehner bleiben gleich, so wie 47 − 3 ist 44."
      en: "Take ones away or add them on while the tens stay put, like 47 − 3 is 44."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "41 + 5 = _"
            say: "Forty-one add five."
            answer: "46"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "7 − 3 = _"
            say: "Seven subtract three."
            options: ["3", "4", "10"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "47 − 3. Will the 4 tens change?"
            say: "Forty-seven subtract three. We take away three ones. Do you think the four tens will change? Have a guess."
            show: { drawn: base-ten, tens: 4, ones: 7 }
          - text: "47 − 3 = 44"
            say: "No, the four tens rods stay where they are. Four tens and four ones are left: forty-four."
            show: { drawn: base-ten, tens: 4, ones: 4 }
          - text: "7 − 3 = 4 · 47 − 3 = 44"
            say: "The related fact helps with subtracting too. Seven subtract three is four, so forty-seven subtract three is forty-four."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "58 − 6 = _"
                say: "Fifty-eight subtract six."
                show: { drawn: base-ten, tens: 5, ones: 8 }
                options: ["52", "2", "64"]
                answer: "52"
                feedback:
                  "2": "The five tens stay. You only take away ones."
                  "64": "That is fifty-eight add six. The sign says subtract, so take six away."
                hints:
                  - "Take away six ones."
                  - "Eight subtract six is two."
                  - "Five tens and two ones: 52."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Use the related fact."
                say: "Work out the related fact first, then the bigger sum."
                frame: "9 − 4 = _ · 69 − 4 = _"
                options: ["5", "65", "29", "13"]
                answer: ["5", "65"]
                hints:
                  - "Nine subtract four."
                  - "The six tens stay."
                  - "5, and then 65."
              - id: l2-f3
                type: multiple_choice
                text: "86 − 5: what changes?"
                say: "Eighty-six subtract five. What changes?"
                options: ["the ones", "the tens", "both"]
                answer: "the ones"
                feedback:
                  "the tens": "You take away five ones, not five tens."
                hints:
                  - "Is five made of ones or tens?"
                  - "There are six ones, and five of them go."
                  - "Only the ones change."
              - id: l2-f4
                type: text_input
                text: "39 − 7 = _"
                say: "Thirty-nine subtract seven."
                answer: "32"
                hints:
                  - "Nine ones, and seven go."
                  - "Two ones are left, and the three tens stay."
                  - "32."
              - id: l2-f5
                type: true_false
                text: "Is it true? 75 − 4 = 35"
                say: "Seventy-five subtract four is thirty-five. Is that true?"
                answer: false
                hints:
                  - "Four is four ones."
                  - "Five subtract four is one. The seven tens stay."
                  - "No, it is 71."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "48 − 5 = _"
                say: "Forty-eight subtract five."
                answer: "43"
                hints: ["Work out eight subtract five first."]
              - id: l2-s2
                type: fill_in_blank
                text: "Use the related fact."
                say: "Work out the related fact first, then the bigger sum."
                frame: "6 − 2 = _ · 96 − 2 = _"
                options: ["4", "94", "76", "8"]
                answer: ["4", "94"]
                hints: ["The nine tens stay."]
              - id: l2-s3
                type: text_input
                text: "17 − 6 = _"
                say: "Seventeen subtract six."
                show: { drawn: base-ten, tens: 1, ones: 7 }
                answer: "11"
                hints: ["Take six away from the ones."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 64 − 3 = 61"
                say: "Sixty-four subtract three is sixty-one. Is that true?"
                answer: true
                hints: ["Work out four subtract three."]
              - id: l2-s5
                type: multiple_choice
                text: "There are 26 books on the shelf. Ella puts 3 more books on it. How many books are on the shelf now?"
                say: "There are twenty-six books on the shelf. Ella puts three more books on it. How many books are on the shelf now?"
                options: ["29", "23", "56"]
                answer: "29"
                hints: ["Are there more books or fewer books now?"]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "77 − 4 = _"
                say: "Seventy-seven subtract four."
                answer: "73"
              - id: l2-n2
                type: text_input
                text: "82 + 7 = _"
                say: "Eighty-two add seven."
                answer: "89"
              - id: l2-n3
                type: fill_in_blank
                text: "Use the related fact."
                say: "Work out the related fact first, then the bigger sum."
                frame: "8 − 7 = _ · 28 − 7 = _"
                options: ["1", "21", "15", "11"]
                answer: ["1", "21"]
              - id: l2-n4
                type: multiple_choice
                text: "A tree has 49 apples. 9 fall off. How many apples are still on the tree?"
                say: "A tree has forty-nine apples. Nine fall off. How many apples are still on the tree?"
                show: { object: apple }
                options: ["40", "9", "30"]
                answer: "40"
              - id: l2-n5
                type: multiple_choice
                text: "Sam has 38p. He spends 5p on a sweet. How much money does he have left?"
                say: "Sam has thirty-eight pence. He spends five pence on a sweet. How much money does he have left?"
                options: ["33p", "43p", "3p", "£1 million"]
                answer: "33p"
                feedback:
                  "£1 million": "If only! Sam started with 38p, so he has less than that now."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: text_input
            text: "54 + 4 = _"
            say: "Fifty-four add four."
            answer: "58"
          - id: l2-c2
            part: sub
            type: text_input
            text: "68 − 3 = _"
            say: "Sixty-eight subtract three."
            answer: "65"
          - id: l2-c3
            part: ones-change
            type: multiple_choice
            text: "93 + 5: what changes?"
            say: "Ninety-three add five. What changes?"
            options: ["the ones", "the tens", "both"]
            answer: "the ones"
          - id: l2-c4
            part: related
            type: fill_in_blank
            text: "Use the related fact."
            say: "Work out the related fact first, then the bigger sum."
            frame: "7 − 5 = _ · 47 − 5 = _"
            options: ["2", "42", "12", "52"]
            answer: ["2", "42"]
          - id: l2-c5
            part: add
            type: true_false
            text: "Is it true? 23 + 6 = 83"
            say: "Twenty-three add six is eighty-three. Is that true?"
            answer: false
          - id: l2-c6
            part: add
            type: text_input
            text: "35 + 4 = _"
            say: "Thirty-five add four."
            answer: "39"
          - id: l2-c7
            part: add
            type: multiple_choice
            text: "12 + 7 = _"
            say: "Twelve add seven."
            options: ["19", "82", "9"]
            answer: "19"
          - id: l2-c8
            part: add
            type: multiple_choice
            text: "Ruby has 43 stickers. She gets 6 more. How many stickers does she have now?"
            say: "Ruby has forty-three stickers. She gets six more. How many stickers does she have now?"
            options: ["49", "37", "9"]
            answer: "49"
          - id: l2-c9
            part: sub
            type: text_input
            text: "57 − 4 = _"
            say: "Fifty-seven subtract four."
            answer: "53"
          - id: l2-c10
            part: sub
            type: multiple_choice
            text: "89 − 6 = _"
            say: "Eighty-nine subtract six."
            options: ["83", "3", "95"]
            answer: "83"
          - id: l2-c11
            part: sub
            type: true_false
            text: "Is it true? 76 − 5 = 26"
            say: "Seventy-six subtract five is twenty-six. Is that true?"
            answer: false
          - id: l2-c12
            part: sub
            type: text_input
            text: "A box has 29 crayons. 8 are broken and go in the bin. How many crayons are left in the box?"
            say: "A box has twenty-nine crayons. Eight are broken and go in the bin. How many crayons are left in the box?"
            answer: "21"
          - id: l2-c13
            part: ones-change
            type: multiple_choice
            text: "Which digit changes in 54 + 3?"
            say: "Fifty-four add three. Which digit changes?"
            options: ["the 4", "the 5", "both"]
            answer: "the 4"
          - id: l2-c14
            part: ones-change
            type: true_false
            text: "Is it true? When you work out 72 + 5, the tens digit stays 7."
            say: "When you work out seventy-two add five, the tens digit stays seven. Is that true?"
            answer: true
          - id: l2-c15
            part: ones-change
            type: image_multiple_choice
            text: "Which blocks show 61 + 7?"
            say: "Sixty-one add seven. Which blocks show the answer?"
            options:
              - { drawn: base-ten, tens: 6, ones: 8 }
              - { drawn: base-ten, tens: 0, ones: 8 }
              - { drawn: base-ten, tens: 7, ones: 8 }
            answer: "68"
          - id: l2-c16
            part: ones-change
            type: fill_in_blank
            text: "82 + 5: how many tens and ones?"
            say: "Eighty-two add five. How many tens and how many ones does the answer have?"
            frame: "82 + 5 = _ tens and _ ones"
            options: ["8", "7", "13", "5"]
            answer: ["8", "7"]
          - id: l2-c17
            part: related
            type: fill_in_blank
            text: "Use the related fact."
            say: "Work out the related fact first, then the bigger sum."
            frame: "5 + 3 = _ · 85 + 3 = _"
            options: ["8", "88", "18", "83"]
            answer: ["8", "88"]
          - id: l2-c18
            part: related
            type: fill_in_blank
            text: "Use the related fact."
            say: "Work out the related fact first, then the bigger sum."
            frame: "6 − 4 = _ · 36 − 4 = _"
            options: ["2", "32", "10", "40"]
            answer: ["2", "32"]
          - id: l2-c19
            part: related
            type: multiple_choice
            text: "Which fact helps with 73 + 4?"
            say: "Seventy-three add four. Which fact helps?"
            options: ["3 + 4 = 7", "7 + 4 = 11", "7 + 3 = 10"]
            answer: "3 + 4 = 7"
          - id: l2-c20
            part: related
            type: true_false
            text: "Is it true? 8 − 2 = 6, so 58 − 2 = 56."
            say: "Eight subtract two is six, so fifty-eight subtract two is fifty-six. Is that true?"
            answer: true
