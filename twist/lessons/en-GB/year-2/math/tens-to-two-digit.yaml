# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.tens-to-two-digit
skill: math.add-sub-to-100.tens-to-two-digit
curriculum: en-GB
language: en
title:
  de: Zehner dazu und weg
  en: Adding and subtracting tens
summary: >
  Adding and subtracting whole tens to and from a two-digit number
  (34 + 20, 76 − 40). Only the tens change; the ones stay. Lesson 1 adds
  tens with tens rods and on the hundred square, where each ten more is
  one row down; lesson 2 subtracts tens, mixes tens and ones, and ends
  with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.tens, math.add-sub-to-100.ones-no-bridge]
  also_practises: [math.add-sub-to-100.ones-no-bridge, math.numbers-to-100.place-value]
  vocabulary: { en: [tens, ones, add, subtract, related fact, hundred square, row] }
  forms: [drawn, text, audio]
  drawn: [base-ten, hundred-square]
  facets: [currency]
  parts:
    - { id: add, what: { de: ganze Zehner zu einer zweistelligen Zahl addieren, en: adding whole tens to a two-digit number } }
    - { id: sub, what: { de: ganze Zehner von einer zweistelligen Zahl subtrahieren, en: taking whole tens away from a two-digit number } }
    - { id: model, what: { de: mit Zehnerstangen und auf der Hundertertafel rechnen, en: working with tens rods and on the hundred square } }
    - { id: why, what: { de: "sehen, dass sich nur die Zehner ändern, und die verwandte Aufgabe nutzen", en: "seeing that only the tens change, and using the related fact" } }
  misconceptions:
    - id: tens-as-ones
      what: Adds the tens digit to the ones (34 + 20 = 36)
      addressed: lesson 1 Learn shows twenty as two rods joining the rods; the ones answer is an option with feedback in l1-f1 and l2-f1; "what changes" tasks l1-f2, l1-s2 and l1-c3; l2-f5 asks which sum makes 75, 45 + 3 or 45 + 30
    - id: both-change
      what: Changes the ones as well (43 + 20 = 65)
      addressed: hints say the ones stay; "both" is an option in every "what changes" task, and 65 is an option with feedback in l1-f1
    - id: ones-in-tens-sum
      what: Treats a ones sum as a tens sum when the two are mixed (52 + 4 = 92)
      addressed: lesson 2 Learn sets 76 − 4 beside 76 − 40; l2-f5 and l2-s5 mix ones into the tens lesson
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Zehner dazu, en: Adding tens }
    goal:
      de: "Addiere ganze Zehner zu einer Zahl, und nur die Zehner ändern sich, so wie 34 + 20 ist 54."
      en: "Add whole tens to a number so that only the tens change, like 34 + 20 is 54."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "30 + 20 = _"
            say: "Thirty add twenty."
            options: ["50", "5", "32"]
            answer: "50"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "41 + 3 = _"
            say: "Forty-one add three."
            answer: "44"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "34 + 20"
            say: "Thirty-four add twenty. Twenty is two tens. Two tens rods join the three tens rods."
            show: { drawn: base-ten, tens: 3, ones: 4 }
          - text: "34 + 20 = 54"
            say: "Now there are five tens. The four ones stay. Five tens and four ones make fifty-four."
            show: { drawn: base-ten, tens: 5, ones: 4 }
          - text: "34 → 44 → 54"
            say: "On the hundred square, each ten more is one row down. From thirty-four, go two rows down: forty-four, fifty-four."
            show: { drawn: hundred-square, highlight: [34, 44, 54] }
          - text: "30 + 20 = 50 · 34 + 20 = 54"
            say: "The related fact helps. Three tens and two tens make five tens, so thirty-four add twenty is fifty-four."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "43 + 20 = _"
                say: "Forty-three add twenty."
                show: { drawn: base-ten, tens: 4, ones: 3 }
                options: ["63", "45", "65"]
                answer: "63"
                feedback:
                  "45": "Twenty is two tens, not two ones. The ones stay at three."
                  "65": "The ones stay the same. Only the tens change."
                hints:
                  - "Twenty is two tens rods."
                  - "Four tens and two tens make six tens. The three ones stay."
                  - "Six tens and three ones: 63."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "52 + 30: what changes?"
                say: "Fifty-two add thirty. What changes?"
                options: ["the tens", "the ones", "both"]
                answer: "the tens"
                feedback:
                  "the ones": "Thirty is three tens. They join the tens."
                hints:
                  - "Is thirty made of ones or tens?"
                  - "Three tens join the five tens. The two ones stay."
                  - "Only the tens change."
              - id: l1-f3
                type: fill_in_blank
                text: "Use the related fact."
                say: "Add the tens first, then work out the bigger sum."
                frame: "20 + 40 = _ · 26 + 40 = _"
                options: ["60", "66", "30", "62"]
                answer: ["60", "66"]
                hints:
                  - "Two tens and four tens."
                  - "Six tens, and the six ones stay."
                  - "60, and then 66."
              - id: l1-f4
                type: text_input
                text: "17 + 30 = _"
                say: "Seventeen add thirty."
                show: { drawn: base-ten, tens: 1, ones: 7 }
                answer: "47"
                hints:
                  - "Thirty is three tens rods."
                  - "One ten and three tens make four tens. The seven ones stay."
                  - "47."
              - id: l1-f5
                type: multiple_choice
                text: "Where do you land? 23 + 30"
                say: "Start at twenty-three on the hundred square. Go three rows down. Where do you land?"
                show: { drawn: hundred-square, highlight: [23] }
                options: ["53", "26", "33"]
                answer: "53"
                feedback:
                  "26": "That is three ones more. Three rows down is three tens more."
                hints:
                  - "One row down is ten more."
                  - "Thirty-three, forty-three, ..."
                  - "53."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "61 + 20 = _"
                say: "Sixty-one add twenty."
                answer: "81"
                hints: ["Six tens and two tens. The one stays."]
              - id: l1-s2
                type: multiple_choice
                text: "38 + 50: what changes?"
                say: "Thirty-eight add fifty. What changes?"
                options: ["the tens", "the ones", "both"]
                answer: "the tens"
                hints: ["Is fifty made of ones or tens?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Use the related fact."
                say: "Add the tens first, then work out the bigger sum."
                frame: "50 + 20 = _ · 57 + 20 = _"
                options: ["70", "77", "59", "75"]
                answer: ["70", "77"]
                hints: ["The seven ones in the bigger sum stay."]
              - id: l1-s4
                type: multiple_choice
                text: "Where do you land? 42 + 40"
                say: "Start at forty-two on the hundred square. Go four rows down. Where do you land?"
                show: { drawn: hundred-square, highlight: [42] }
                options: ["82", "46", "72"]
                answer: "82"
                hints: ["Each row down is ten more."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 24 + 60 = 30"
                say: "Twenty-four add sixty is thirty. Is that true?"
                answer: false
                hints: ["Sixty is six tens. Do the ones change?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "9 + 70 = _"
                say: "Nine add seventy."
                answer: "79"
              - id: l1-n2
                type: text_input
                text: "33 + 40 = _"
                say: "Thirty-three add forty."
                answer: "73"
              - id: l1-n3
                type: multiple_choice
                text: "56 + 30 = _"
                say: "Fifty-six add thirty."
                options: ["86", "59", "89"]
                answer: "86"
              - id: l1-n4
                type: multiple_choice
                text: "Where do you land? 15 + 50"
                say: "Start at fifteen on the hundred square. Go five rows down. Where do you land?"
                show: { drawn: hundred-square, highlight: [15] }
                options: ["65", "20", "55"]
                answer: "65"
              - id: l1-n5
                type: true_false
                text: "Is it true? 72 + 20 = 92"
                say: "Seventy-two add twenty is ninety-two. Is that true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "44 + 30 = _"
            say: "Forty-four add thirty."
            answer: "74"
          - id: l1-c2
            type: multiple_choice
            text: "27 + 20 = _"
            say: "Twenty-seven add twenty."
            options: ["47", "29", "49"]
            answer: "47"
          - id: l1-c3
            type: multiple_choice
            text: "63 + 10: what changes?"
            say: "Sixty-three add ten. What changes?"
            options: ["the tens", "the ones", "both"]
            answer: "the tens"
          - id: l1-c4
            type: text_input
            text: "55 + 40 = _"
            say: "Fifty-five add forty."
            answer: "95"
          - id: l1-c5
            type: multiple_choice
            text: "Where do you land? 37 + 20"
            say: "Start at thirty-seven on the hundred square. Go two rows down. Where do you land?"
            show: { drawn: hundred-square, highlight: [37] }
            options: ["57", "39", "47"]
            answer: "57"
          - id: l1-c6
            type: true_false
            text: "Is it true? 16 + 80 = 96"
            say: "Sixteen add eighty is ninety-six. Is that true?"
            answer: true

  - n: 2
    title: { de: "Zehner weg, Zehner dazu", en: "Subtracting and adding tens" }
    goal:
      de: "Nimm ganze Zehner weg, und die Einer bleiben gleich, so wie 76 − 40 ist 36."
      en: "Take away whole tens while the ones stay the same, like 76 − 40 is 36."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "25 + 40 = _"
            say: "Twenty-five add forty."
            answer: "65"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Where do you land? 31 + 20"
            say: "Start at thirty-one on the hundred square. Go two rows down. Where do you land?"
            show: { drawn: hundred-square, highlight: [31] }
            options: ["51", "33", "41"]
            answer: "51"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "76 − 40"
            say: "Seventy-six subtract forty. We take away four tens rods. The six ones stay where they are."
            show: { drawn: base-ten, tens: 7, ones: 6 }
          - text: "76 − 40 = 36"
            say: "Three tens and six ones are left: thirty-six."
            show: { drawn: base-ten, tens: 3, ones: 6 }
          - text: "76 → 66 → 56 → 46 → 36"
            say: "On the hundred square, each ten you take away is one row up. From seventy-six, go four rows up to thirty-six."
            show: { drawn: hundred-square, highlight: [76, 66, 56, 46, 36] }
          - text: "76 − 4 = 72 · 76 − 40 = 36"
            say: "Look at the second number. Taking away four ones changes the ones. Taking away four tens changes the tens."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "67 − 40 = _"
                say: "Sixty-seven subtract forty."
                show: { drawn: base-ten, tens: 6, ones: 7 }
                options: ["27", "63", "23"]
                answer: "27"
                feedback:
                  "63": "Forty is four tens. Take away tens rods, not ones."
                  "23": "The seven ones stay. Only the tens change."
                hints:
                  - "Take away four tens rods."
                  - "Six tens subtract four tens is two tens. The seven ones stay."
                  - "Two tens and seven ones: 27."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Use the related fact."
                say: "Subtract the tens first, then work out the bigger sum."
                frame: "90 − 30 = _ · 95 − 30 = _"
                options: ["60", "65", "92", "55"]
                answer: ["60", "65"]
                hints:
                  - "Nine tens subtract three tens."
                  - "Six tens, and the five ones stay."
                  - "60, and then 65."
              - id: l2-f3
                type: multiple_choice
                text: "Where do you land? 84 − 30"
                say: "Start at eighty-four on the hundred square. Go three rows up. Where do you land?"
                show: { drawn: hundred-square, highlight: [84] }
                options: ["54", "81", "64"]
                answer: "54"
                hints:
                  - "One row up is ten less."
                  - "Seventy-four, sixty-four, ..."
                  - "54."
              - id: l2-f4
                type: text_input
                text: "58 − 20 = _"
                say: "Fifty-eight subtract twenty."
                show: { drawn: base-ten, tens: 5, ones: 8 }
                answer: "38"
                hints:
                  - "Take away two tens rods."
                  - "Three tens are left, and the eight ones stay."
                  - "38."
              - id: l2-f5
                type: multiple_choice
                text: "Which sum makes 75?"
                say: "Which sum makes seventy-five?"
                options: ["45 + 30", "45 + 3", "45 + 20"]
                answer: "45 + 30"
                feedback:
                  "45 + 3": "Forty-five add three is forty-eight. To reach seventy-five you need three tens, not three ones."
                hints:
                  - "Seventy-five and forty-five have the same ones."
                  - "So only the tens change: from four tens to seven tens."
                  - "45 + 30."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "89 − 50 = _"
                say: "Eighty-nine subtract fifty."
                answer: "39"
                hints: ["Eight tens subtract five tens. The nine ones stay."]
              - id: l2-s2
                type: multiple_choice
                text: "91 − 60: what changes?"
                say: "Ninety-one subtract sixty. What changes?"
                options: ["the tens", "the ones", "both"]
                answer: "the tens"
                hints: ["Is sixty made of ones or tens?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Use the related fact."
                say: "Subtract the tens first, then work out the bigger sum."
                frame: "80 − 20 = _ · 83 − 20 = _"
                options: ["60", "63", "81", "103"]
                answer: ["60", "63"]
                hints: ["The three ones in the bigger sum stay."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 74 − 30 = 71"
                say: "Seventy-four subtract thirty is seventy-one. Is that true?"
                answer: false
                hints: ["Thirty is three tens. Which digit changes?"]
              - id: l2-s5
                type: text_input
                text: "52 + 4 = _"
                say: "Fifty-two add four."
                answer: "56"
                hints: ["Is it four ones or four tens? Look carefully."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "99 − 40 = _"
                say: "Ninety-nine subtract forty."
                answer: "59"
              - id: l2-n2
                type: multiple_choice
                text: "Maya has 65p. She spends 30p on an apple. How much money does she have left?"
                say: "Maya has sixty-five pence. She spends thirty pence on an apple. How much money does she have left?"
                options: ["35p", "62p", "95p"]
                answer: "35p"
              - id: l2-n3
                type: text_input
                text: "28 + 50 = _"
                say: "Twenty-eight add fifty."
                answer: "78"
              - id: l2-n4
                type: multiple_choice
                text: "There are 43 children in the hall. 20 more children come in. How many children are in the hall now?"
                say: "There are forty-three children in the hall. Twenty more children come in. How many children are in the hall now?"
                options: ["63", "45", "23"]
                answer: "63"
              - id: l2-n5
                type: text_input
                text: "46 − 10 = _"
                say: "Forty-six subtract ten."
                answer: "36"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: text_input
            text: "62 + 30 = _"
            say: "Sixty-two add thirty."
            answer: "92"
          - id: l2-c2
            part: sub
            type: text_input
            text: "77 − 50 = _"
            say: "Seventy-seven subtract fifty."
            answer: "27"
          - id: l2-c3
            part: model
            type: multiple_choice
            text: "Where do you land? 96 − 40"
            say: "Start at ninety-six on the hundred square. Go four rows up. Where do you land?"
            show: { drawn: hundred-square, highlight: [96] }
            options: ["56", "92", "66"]
            answer: "56"
          - id: l2-c4
            part: why
            type: fill_in_blank
            text: "Use the related fact."
            say: "Add the tens first, then work out the bigger sum."
            frame: "40 + 50 = _ · 48 + 50 = _"
            options: ["90", "98", "53", "93"]
            answer: ["90", "98"]
          - id: l2-c5
            part: sub
            type: true_false
            text: "Is it true? 85 − 60 = 25"
            say: "Eighty-five subtract sixty is twenty-five. Is that true?"
            answer: true
          - id: l2-c6
            part: add
            type: text_input
            text: "36 + 50 = _"
            say: "Thirty-six add fifty."
            answer: "86"
          - id: l2-c7
            part: add
            type: multiple_choice
            text: "14 + 70 = _"
            say: "Fourteen add seventy."
            options: ["84", "21", "74"]
            answer: "84"
          - id: l2-c8
            part: add
            type: true_false
            text: "Is it true? 53 + 40 = 57"
            say: "Fifty-three add forty is fifty-seven. Is that true?"
            answer: false
          - id: l2-c9
            part: add
            type: multiple_choice
            text: "Leo has 47 stickers. He gets 30 more. How many stickers does he have now?"
            say: "Leo has forty-seven stickers. He gets thirty more. How many stickers does he have now?"
            options: ["77", "50", "17"]
            answer: "77"
          - id: l2-c10
            part: sub
            type: text_input
            text: "93 − 70 = _"
            say: "Ninety-three subtract seventy."
            answer: "23"
          - id: l2-c11
            part: sub
            type: multiple_choice
            text: "A book has 68 pages. Ava has read 40. How many pages are left?"
            say: "A book has sixty-eight pages. Ava has read forty. How many pages are left?"
            options: ["28", "64", "38"]
            answer: "28"
          - id: l2-c12
            part: sub
            type: true_false
            text: "Is it true? 51 − 30 = 21"
            say: "Fifty-one subtract thirty is twenty-one. Is that true?"
            answer: true
          - id: l2-c13
            part: model
            type: multiple_choice
            text: "59 − 30 = _"
            say: "Fifty-nine subtract thirty."
            show: { drawn: base-ten, tens: 5, ones: 9 }
            options: ["29", "56", "26"]
            answer: "29"
          - id: l2-c14
            part: model
            type: multiple_choice
            text: "Where do you land? 18 + 60"
            say: "Start at eighteen on the hundred square. Go six rows down. Where do you land?"
            show: { drawn: hundred-square, highlight: [18] }
            options: ["78", "24", "68"]
            answer: "78"
          - id: l2-c15
            part: model
            type: multiple_choice
            text: "Which move on the hundred square shows 72 − 30?"
            say: "Which move on the hundred square shows seventy-two subtract thirty?"
            show: { drawn: hundred-square, highlight: [72] }
            options: ["3 rows up", "3 rows down", "3 squares back"]
            answer: "3 rows up"
          - id: l2-c16
            part: model
            type: multiple_choice
            text: "38 + 60 = _"
            say: "Thirty-eight add sixty."
            show: { drawn: base-ten, tens: 3, ones: 8 }
            options: ["98", "44", "88"]
            answer: "98"
          - id: l2-c17
            part: why
            type: true_false
            text: "Is it true? In 35 + 40, only the tens change."
            say: "Thirty-five add forty. Is it true that only the tens change?"
            answer: true
          - id: l2-c18
            part: why
            type: fill_in_blank
            text: "Use the related fact."
            say: "Seventy subtract forty. Then seventy-four subtract forty."
            frame: "70 − 40 = _ · 74 − 40 = _"
            options: ["30", "34", "70", "44"]
            answer: ["30", "34"]
          - id: l2-c19
            part: why
            type: multiple_choice
            text: "Which subtraction makes 34?"
            say: "Which subtraction makes thirty-four?"
            options: ["64 − 30", "64 − 3", "37 − 30"]
            answer: "64 − 30"
          - id: l2-c20
            part: why
            type: multiple_choice
            text: "40 + 30 = 70. Which sum does this related fact help with?"
            say: "Forty add thirty is seventy. Which sum does this related fact help with?"
            options: ["42 + 30", "42 + 3", "4 + 3"]
            answer: "42 + 30"
