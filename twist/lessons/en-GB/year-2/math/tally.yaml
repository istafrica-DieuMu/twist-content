# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.tally
skill: math.data.tally
curriculum: en-GB
language: en
title:
  de: Strichlisten
  en: Tally charts
summary: >
  Lesson 1 reads tally marks: four marks and a fifth across them make a
  group of five, so 7 is a five and two more, up to 20; lesson 2 runs a
  class survey, counts the answers as they come in, chooses the tally
  chart that records them, then reads it for the most, the fewest, how
  many more and the total, and ends with the skill check. Making the
  marks with a finger waits for a drawing task.
metadata:
  year: year-2
  topic: { de: Daten, en: Data }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.data.sort-classify, math.numbers-to-20.subitize-to-10]
  also_practises: [math.data.sort-classify]
  vocabulary: { en: [tally, tally mark, tally chart, group of five, survey, most, fewest, how many more, total] }
  forms: [text, audio, drawn]
  drawn: [dots, table, bar-chart]
  facets: []
  parts:
    - { id: read, what: { de: eine Strichliste mit Fünferbündeln auszählen, en: counting tally marks in groups of five } }
    - { id: show, what: { de: die Strichliste zu einer Zahl finden, en: finding the tally for a number } }
    - { id: collect, what: { de: Antworten einer Umfrage mit Strichen festhalten, en: recording the answers of a survey with tally marks } }
    - { id: survey, what: { de: "eine Umfrage auswerten: die meisten, die wenigsten, wie viele mehr, wie viele insgesamt", en: "reading a survey: most, fewest, how many more and the total" } }
  misconceptions:
    - id: group-as-one
      what: Counts a group of five as one mark, or counts the mark across it twice
      addressed: lesson 1 Learn counts a group mark by mark; l1-f2 (with feedback), l1-s2, l1-s3, l1-n2 and l1-n3 offer the count with each group as 1 and with the crossing mark counted twice
    - id: longest-row-not-counted
      what: Picks the most popular answer by the length of the row without counting the marks
      addressed: lesson 2 Learn counts each row before naming the most; l2-f3 hints count each row; l2-f3, l2-s3 and l2-n3 ask for the most or the fewest
    - id: more-than-is-total
      what: Adds the two rows when asked how many more one has
      addressed: lesson 2 Learn works out how many more by counting on; the total is an option in l2-f4 (with feedback), l2-s4 and l2-n4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Striche zählen", en: "Counting tally marks" }
    goal:
      de: "Zähl Strichlisten in Fünferbündeln, so wie ein Fünferbündel und 2 Striche sind 7."
      en: "Count tally marks in gates of five, like one gate and 2 more marks make 7."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many dots?"
            say: "How many dots are there? Try to see it without counting."
            show: { drawn: dots, count: 5, layout: dice }
            options: ["5", "4", "6"]
            answer: "5"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which group has the most?"
            say: "Class 2 sorted the toy box. Which group has the most?"
            show: { drawn: table, rows: [["Toy", "How many"], ["balls", "6"], ["cars", "9"], ["kites", "3"]] }
            options: ["cars", "balls", "kites"]
            answer: "cars"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "What number do you think this shows?"
            say: "Here are some tally marks. Four marks stand up, and one goes across them like a little gate. What number do you think they show? Have a guess."
            show: { drawn: bar-chart, tally: true, rows: [["", 5]] }
          - text: "1, 2, 3, 4"
            say: "Let's find out. In a tally chart you make one mark for each thing you count. One, two, three, four."
            show: { drawn: bar-chart, tally: true, rows: [["", 4]] }
          - text: "5: the fifth mark goes across"
            say: "The fifth mark goes across the other four. That makes a group of five, like a little gate. Now you can see five straight away."
            show: { drawn: bar-chart, tally: true, rows: [["", 5]] }
          - text: "7 = 5 and 2"
            say: "Here is a group of five and two more marks. Five and two make seven."
            show: { drawn: bar-chart, tally: true, rows: [["", 7]] }
          - text: "5, 10, 15, 16, 17"
            say: "With lots of marks, count the groups in fives, then add the single marks. Five, ten, fifteen, then sixteen, seventeen."
            show: { drawn: bar-chart, tally: true, rows: [["", 17]] }
          - text: "Did you know? In 1834, a fire from burning old tally sticks burnt down most of the Houses of Parliament."
            say: "Did you know? For hundreds of years, the government in England kept count of money with notches cut into wooden tally sticks. In 1834 they burnt the old sticks in a stove. The fire got out of control, and most of the Houses of Parliament burnt down!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many tally marks?"
                say: "How many tally marks are there?"
                show: { drawn: bar-chart, tally: true, rows: [["", 3]] }
                options: ["3", "4", "2"]
                answer: "3"
                option_audio: false
                hints:
                  - "Point to each mark."
                  - "One, two, and one more."
                  - "3."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What number do the tally marks show?"
                say: "A group of five and one more mark. What number is it?"
                show: { drawn: bar-chart, tally: true, rows: [["", 6]] }
                options: ["6", "2", "7"]
                answer: "6"
                option_audio: false
                feedback:
                  "2": "The group is not one mark. A group of five is five marks."
                  "7": "The mark across is the fifth mark. Count it only once."
                hints:
                  - "A group is five."
                  - "Five and one more."
                  - "6."
              - id: l1-f3
                type: multiple_choice
                text: "What number do the tally marks show?"
                say: "What number do the tally marks show?"
                show: { drawn: bar-chart, tally: true, rows: [["", 12]] }
                options: ["12", "7", "13"]
                answer: "12"
                option_audio: false
                hints:
                  - "Count the groups in fives first."
                  - "Five, ten, then two more."
                  - "12."
              - id: l1-f4
                type: true_false
                text: "These tally marks show 10."
                say: "Two groups of five. Is it true that these tally marks show ten?"
                show: { drawn: bar-chart, tally: true, rows: [["", 10]] }
                answer: true
                hints:
                  - "Each group is five."
                  - "Five and five."
                  - "Yes, it shows 10."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which tally shows 8?"
                say: "Which tally shows eight?"
                options:
                  - { drawn: bar-chart, tally: true, rows: [["", 8]], key: "8" }
                  - { drawn: bar-chart, tally: true, rows: [["", 3]], key: "3" }
                  - { drawn: bar-chart, tally: true, rows: [["", 9]], key: "9" }
                answer: "8"
                option_audio: false
                hints:
                  - "Eight is more than five, so look for a group."
                  - "Eight is a group of five and three more."
                  - "A group of five and three marks."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many tally marks?"
                say: "How many tally marks are there?"
                show: { drawn: bar-chart, tally: true, rows: [["", 4]] }
                options: ["4", "5", "3"]
                answer: "4"
                option_audio: false
                hints: ["Point to each mark. Is there a mark across yet?"]
              - id: l1-s2
                type: multiple_choice
                text: "What number do the tally marks show?"
                say: "What number do the tally marks show?"
                show: { drawn: bar-chart, tally: true, rows: [["", 9]] }
                options: ["9", "5", "10"]
                answer: "9"
                option_audio: false
                hints: ["A group of five, then count on."]
              - id: l1-s3
                type: multiple_choice
                text: "What number do the tally marks show?"
                say: "What number do the tally marks show?"
                show: { drawn: bar-chart, tally: true, rows: [["", 15]] }
                options: ["15", "3", "18"]
                answer: "15"
                option_audio: false
                hints: ["Count the groups in fives."]
              - id: l1-s4
                type: true_false
                text: "These tally marks show 6."
                say: "Is it true that these tally marks show six?"
                show: { drawn: bar-chart, tally: true, rows: [["", 7]] }
                answer: false
                hints: ["A group of five, and how many more?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which tally shows 11?"
                say: "Which tally shows eleven?"
                options:
                  - { drawn: bar-chart, tally: true, rows: [["", 11]], key: "11" }
                  - { drawn: bar-chart, tally: true, rows: [["", 6]], key: "6" }
                  - { drawn: bar-chart, tally: true, rows: [["", 12]], key: "12" }
                answer: "11"
                option_audio: false
                hints: ["Eleven is two groups of five and one more."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What number do the tally marks show?"
                say: "What number do the tally marks show?"
                show: { drawn: bar-chart, tally: true, rows: [["", 5]] }
                options: ["5", "1", "4"]
                answer: "5"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "What number do the tally marks show?"
                say: "What number do the tally marks show?"
                show: { drawn: bar-chart, tally: true, rows: [["", 13]] }
                options: ["13", "5", "15"]
                answer: "13"
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "What number do the tally marks show?"
                say: "What number do the tally marks show?"
                show: { drawn: bar-chart, tally: true, rows: [["", 18]] }
                options: ["18", "6", "21"]
                answer: "18"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "These tally marks show 14."
                say: "Is it true that these tally marks show fourteen?"
                show: { drawn: bar-chart, tally: true, rows: [["", 14]] }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "Which tally shows 20?"
                say: "Which tally shows twenty?"
                options:
                  - { drawn: bar-chart, tally: true, rows: [["", 20]], key: "20" }
                  - { drawn: bar-chart, tally: true, rows: [["", 16]], key: "16" }
                  - { drawn: bar-chart, tally: true, rows: [["", 15]], key: "15" }
                answer: "20"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What number do the tally marks show?"
            say: "Count the tally marks. What number do they show?"
            show: { drawn: bar-chart, tally: true, rows: [["", 7]] }
            options: ["7", "3", "8"]
            answer: "7"
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "A group of tally marks shows 5."
            say: "Is it true? A group of tally marks, with the mark across, shows five."
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Which tally shows 16?"
            say: "Which tally shows sixteen?"
            options:
              - { drawn: bar-chart, tally: true, rows: [["", 16]], key: "16" }
              - { drawn: bar-chart, tally: true, rows: [["", 14]], key: "14" }
              - { drawn: bar-chart, tally: true, rows: [["", 11]], key: "11" }
            answer: "16"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "What number do the tally marks show?"
            say: "What number do the tally marks show?"
            show: { drawn: bar-chart, tally: true, rows: [["", 10]] }
            options: ["10", "2", "11"]
            answer: "10"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "These tally marks show 13."
            say: "Is it true that these tally marks show thirteen?"
            show: { drawn: bar-chart, tally: true, rows: [["", 12]] }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Which tally shows 6?"
            say: "Which tally shows six?"
            options:
              - { drawn: bar-chart, tally: true, rows: [["", 4]], key: "4" }
              - { drawn: bar-chart, tally: true, rows: [["", 6]], key: "6" }
              - { drawn: bar-chart, tally: true, rows: [["", 7]], key: "7" }
            answer: "6"
            option_audio: false

  - n: 2
    title: { de: "Eine Umfrage in der Klasse", en: "A class survey" }
    goal:
      de: "Mach bei einer Klassenumfrage für jede Antwort einen Strich und lies dann ab, was am beliebtesten ist."
      en: "Make a tally mark for each answer in a class survey, then find out which answer is the most popular."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What number do the tally marks show?"
            say: "What number do the tally marks show?"
            show: { drawn: bar-chart, tally: true, rows: [["", 8]] }
            options: ["8", "4"]
            answer: "8"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "These tally marks show 12."
            say: "Is it true that these tally marks show twelve?"
            show: { drawn: bar-chart, tally: true, rows: [["", 11]] }
            answer: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "What is your favourite fruit?"
            say: "Class 2 does a survey. Ruby asks each child: what is your favourite fruit? Apple, banana or strawberry? Which fruit do you think most children chose? Have a guess. For each answer, Ruby makes one mark in that fruit's row."
          - text: "apple 6 · banana 4 · strawberry 8"
            say: "Here is Ruby's tally chart. Count each row. Apple: six. Banana: four. Strawberry: eight. Strawberries are the most popular. Bananas are the least popular."
            show: { drawn: bar-chart, tally: true, rows: [["apple", 6], ["banana", 4], ["strawberry", 8]] }
          - text: "8 − 4 = 4 · 6 + 4 + 8 = 18"
            say: "How many more children like strawberries than bananas? Count on from four to eight: four more. How many children answered in total? Six add four add eight is eighteen."
          - text: "apple, banana, apple, apple"
            say: "When you collect the answers yourself, make one mark for each answer as you hear it. Apple, banana, apple, apple: three marks for apple and one for banana."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many children like red best?"
                say: "Class 2 asked: what is your favourite colour? How many children like red best?"
                show: { drawn: bar-chart, tally: true, rows: [["red", 7], ["blue", 9], ["green", 3]] }
                options: ["7", "9", "2"]
                answer: "7"
                option_audio: false
                hints:
                  - "Find the row for red."
                  - "A group of five and two more."
                  - "7."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "dog, cat, dog, dog, fish, cat, dog. Which tally chart is right?"
                say: "Sam asks his friends about their pets. He hears: dog, cat, dog, dog, fish, cat, dog. Which tally chart is right?"
                options:
                  - { drawn: bar-chart, tally: true, rows: [["dog", 4], ["cat", 2], ["fish", 1]], key: "4-2-1" }
                  - { drawn: bar-chart, tally: true, rows: [["dog", 3], ["cat", 2], ["fish", 1]], key: "3-2-1" }
                  - { drawn: bar-chart, tally: true, rows: [["dog", 4], ["cat", 1], ["fish", 2]], key: "4-1-2" }
                answer: "4-2-1"
                option_audio: false
                hints:
                  - "Count each pet in the list."
                  - "Dog comes four times, cat twice, fish once."
                  - "Dog 4, cat 2, fish 1."
              - id: l2-f3
                type: multiple_choice
                text: "Which colour do the most children like best?"
                say: "Look at the colour survey. Which colour do the most children like best?"
                show: { drawn: bar-chart, tally: true, rows: [["red", 7], ["blue", 9], ["green", 3]] }
                options: ["blue", "red", "green"]
                answer: "blue"
                hints:
                  - "Count each row."
                  - "Red 7, blue 9, green 3."
                  - "Blue."
              - id: l2-f4
                type: multiple_choice
                text: "How many more children like blue than green?"
                say: "How many more children like blue than green?"
                show: { drawn: bar-chart, tally: true, rows: [["red", 7], ["blue", 9], ["green", 3]] }
                options: ["6", "12", "3"]
                answer: "6"
                option_audio: false
                feedback:
                  "12": "Twelve is blue and green together. How many more is the difference: count on from three to nine."
                hints:
                  - "Blue is 9, green is 3."
                  - "Count on from three to nine."
                  - "6."
              - id: l2-f5
                type: text_input
                text: "How many children answered in total?"
                say: "How many children answered the colour survey in total? Type the number."
                show: { drawn: bar-chart, tally: true, rows: [["red", 7], ["blue", 9], ["green", 3]] }
                answer: "19"
                hints:
                  - "Add all the rows."
                  - "7 + 9 + 3. Seven and three make ten first."
                  - "19."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "walk, bus, walk, car, walk, walk, bus. How many said walk?"
                say: "Lily asks how her friends get to school. She hears: walk, bus, walk, car, walk, walk, bus. How many tally marks go in the walk row?"
                options: ["4", "2", "7"]
                answer: "4"
                option_audio: false
                hints: ["Make one mark each time you hear walk."]
              - id: l2-s2
                type: text_input
                text: "How many children come by bus?"
                say: "Class 2 asked: how do you get to school? How many children come by bus? Type the number."
                show: { drawn: bar-chart, tally: true, rows: [["walk", 11], ["car", 4], ["bus", 6]] }
                answer: "6"
                hints: ["A group of five and one more mark."]
              - id: l2-s3
                type: multiple_choice
                text: "How do the fewest children get to school?"
                say: "How do the fewest children get to school?"
                show: { drawn: bar-chart, tally: true, rows: [["walk", 11], ["car", 4], ["bus", 6]] }
                options: ["by car", "on foot", "by bus", "by helicopter"]
                answer: "by car"
                feedback:
                  "by helicopter": "That would be fun! But nobody said helicopter. Find the row with the fewest marks."
                hints: ["The fewest means the smallest number."]
              - id: l2-s4
                type: multiple_choice
                text: "How many more children walk than come by car?"
                say: "How many more children walk than come by car?"
                show: { drawn: bar-chart, tally: true, rows: [["walk", 11], ["car", 4], ["bus", 6]] }
                options: ["7", "15", "6"]
                answer: "7"
                option_audio: false
                hints: ["Count on from four to eleven."]
              - id: l2-s5
                type: true_false
                text: "21 children answered the survey."
                say: "Is it true that twenty-one children answered the survey?"
                show: { drawn: bar-chart, tally: true, rows: [["walk", 11], ["car", 4], ["bus", 6]] }
                answer: true
                hints: ["Add 11, 4 and 6."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "football, swimming, football, dance, football, swimming. Which tally chart is right?"
                say: "Zara asks about favourite sports. She hears: football, swimming, football, dance, football, swimming. Which tally chart is right?"
                options:
                  - { drawn: bar-chart, tally: true, rows: [["football", 3], ["swimming", 2], ["dance", 1]], key: "3-2-1" }
                  - { drawn: bar-chart, tally: true, rows: [["football", 3], ["swimming", 1], ["dance", 2]], key: "3-1-2" }
                  - { drawn: bar-chart, tally: true, rows: [["football", 2], ["swimming", 2], ["dance", 1]], key: "2-2-1" }
                answer: "3-2-1"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "How many children have a cat?"
                say: "Class 2 asked about pets. How many children have a cat?"
                show: { drawn: bar-chart, tally: true, rows: [["dog", 8], ["cat", 12], ["rabbit", 5]] }
                options: ["12", "8", "4"]
                answer: "12"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Which pet do the fewest children have?"
                say: "Which pet do the fewest children have?"
                show: { drawn: bar-chart, tally: true, rows: [["dog", 8], ["cat", 12], ["rabbit", 5]] }
                options: ["rabbit", "dog", "cat"]
                answer: "rabbit"
              - id: l2-n4
                type: multiple_choice
                text: "How many more children have a cat than a dog?"
                say: "How many more children have a cat than a dog?"
                show: { drawn: bar-chart, tally: true, rows: [["dog", 8], ["cat", 12], ["rabbit", 5]] }
                options: ["4", "20", "3"]
                answer: "4"
                option_audio: false
              - id: l2-n5
                type: text_input
                text: "How many children have a dog or a rabbit?"
                say: "Add the dog row and the rabbit row. How many children is that?"
                show: { drawn: bar-chart, tally: true, rows: [["dog", 8], ["cat", 12], ["rabbit", 5]] }
                answer: "13"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "What number do the tally marks show?"
            say: "Count the tally marks. What number do they show?"
            show: { drawn: bar-chart, tally: true, rows: [["", 19]] }
            options: ["19", "7", "22"]
            answer: "19"
            option_audio: false
          - id: l2-c2
            part: collect
            type: image_multiple_choice
            text: "milk, juice, water, milk, water, milk, water, milk. Which tally chart is right?"
            say: "Ali asks what his friends drink at lunch. He hears: milk, juice, water, milk, water, milk, water, milk. Which tally chart is right?"
            options:
              - { drawn: bar-chart, tally: true, rows: [["milk", 4], ["juice", 1], ["water", 3]], key: "4-1-3" }
              - { drawn: bar-chart, tally: true, rows: [["milk", 3], ["juice", 1], ["water", 3]], key: "3-1-3" }
              - { drawn: bar-chart, tally: true, rows: [["milk", 4], ["juice", 3], ["water", 1]], key: "4-3-1" }
            answer: "4-1-3"
            option_audio: false
          - id: l2-c3
            part: survey
            type: multiple_choice
            text: "Which book do the most children like best?"
            say: "Class 2 voted for their favourite book. Which book do the most children like best?"
            show: { drawn: bar-chart, tally: true, rows: [["dragons", 9], ["pirates", 13], ["space", 7]] }
            options: ["pirates", "dragons", "space"]
            answer: "pirates"
          - id: l2-c4
            part: survey
            type: multiple_choice
            text: "How many more children chose pirates than space?"
            say: "How many more children chose the pirate book than the space book?"
            show: { drawn: bar-chart, tally: true, rows: [["dragons", 9], ["pirates", 13], ["space", 7]] }
            options: ["6", "20", "5"]
            answer: "6"
            option_audio: false
          - id: l2-c5
            part: survey
            type: text_input
            text: "How many children chose dragons or space?"
            say: "How many children chose the dragon book or the space book?"
            show: { drawn: bar-chart, tally: true, rows: [["dragons", 9], ["pirates", 13], ["space", 7]] }
            answer: "16"
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "What number do the tally marks show?"
            say: "What number do the tally marks show?"
            show: { drawn: bar-chart, tally: true, rows: [["", 11]] }
            options: ["11", "3", "12"]
            answer: "11"
            option_audio: false
          - id: l2-c7
            part: read
