            answer: "87 − 21"
          - id: l2-c18
            part: choose
            type: true_false
            text: "Is it true? 84 − 79 is quick to work out by counting on."
            say: "Eighty-four subtract seventy-nine is quick to work out by counting on. Is that true?"
            answer: true
          - id: l2-c19
            part: choose
            type: true_false
            text: "Is it true? For 96 − 30, counting on is quicker than taking away."
            say: "For ninety-six subtract thirty, counting on is quicker than taking away. Is that true?"
            answer: false
          - id: l2-c20
            part: choose
            type: multiple_choice
            text: "Which is the quickest way to work out 40 − 38?"
            say: "Which is the quickest way to work out forty subtract thirty-eight?"
            options: ["count on 2 from 38", "take away 30, then 8", "count back 38 ones"]
            answer: "count on 2 from 38"
