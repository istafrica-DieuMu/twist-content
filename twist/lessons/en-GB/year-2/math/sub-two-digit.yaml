# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.sub-two-digit
skill: math.add-sub-to-100.sub-two-digit
curriculum: en-GB
language: en
title:
  de: Zweistellige Zahlen subtrahieren
  en: Subtracting two-digit numbers
summary: >
  Subtracting a two-digit number from another two ways. Lesson 1 takes
  away in steps on an empty number line: first the tens, then the ones,
  back across a ten when needed. Lesson 2 finds the difference by
  counting on from the smaller number, says when that is the quicker
  method, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.complement]
  also_practises: [math.add-sub-to-100.complement]
  vocabulary: { en: [subtract, take away, in steps, difference, count on, method, empty number line] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: []
  parts:
    - { id: result, what: { de: "zweistellige Zahlen subtrahieren, auch über den Zehner", en: "subtracting a two-digit number, also back across a ten" } }
    - { id: steps, what: { de: "schrittweise abziehen: erst die Zehner, dann die Einer", en: "taking away in steps: tens first, then ones" } }
    - { id: count-on, what: { de: den Unterschied durch Ergänzen finden, en: finding the difference by counting on } }
    - { id: choose, what: { de: den schnelleren Rechenweg wählen, en: choosing the quicker method } }
  misconceptions:
    - id: smaller-from-larger-digit
      what: Takes the smaller ones digit from the larger, whichever number it is in (82 − 47 = 45)
      addressed: lesson 1 Learn says the ones are taken from the whole number, not digit from digit; such answers are options with feedback in l1-f2 and l1-f4, and come back in l1-s2, l1-n3, l1-c2 and l2-c2
    - id: stops-at-ten
      what: Takes the ones only back to the ten and stops (64 − 28 as 44 − 4 = 40)
      addressed: full-stage hints in lesson 1 split the ones across the ten; 40 is an option with feedback in l1-f2
    - id: count-on-lands
      what: When counting on, gives the number it lands on instead of the difference (81 − 76 = 81)
      addressed: lesson 2 Learn adds the hops and says the answer is the difference; 81 is an option with feedback in l2-f2, and the fill-in tasks write the hops before the answer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Abziehen in Schritten, en: Taking away in steps }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "84 − 30 = _"
            say: "Eighty-four subtract thirty."
            answer: "54"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "52 − 7 = _"
            say: "Fifty-two subtract seven."
            answer: "45"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "73 − 36"
            say: "Seventy-three subtract thirty-six. We take away in steps on an empty number line: first the tens, then the ones."
            show: { drawn: rechenstrich, start: 73, jumps: [-30, -6] }
          - text: "73 − 30 = 43"
            say: "First one big hop back of three tens. Seventy-three subtract thirty is forty-three."
          - text: "43 − 6 = 37"
            say: "Then the ones: forty-three subtract six. Hop back three to forty, then three more to thirty-seven."
          - text: "73 − 36 = 37"
            say: "Be careful with the ones. Do not work out six take away three. We take six away from forty-three."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Take away in steps."
                say: "Eighty-seven subtract twenty-five. First take away the tens, then the ones."
                frame: "87 − 25 = 87 − 20 − _ = _"
                options: ["5", "7", "62", "67", "60"]
                answer: ["5", "62"]
                hints:
                  - "First the tens: 87 − 20 = 67."
                  - "Now take away the 5 ones."
                  - "67 − 5 = 62."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "64 − 28 = _"
                say: "Sixty-four subtract twenty-eight."
                show: { drawn: rechenstrich, start: 64, jumps: [-20, -8] }
                options: ["36", "44", "40"]
                answer: "36"
                feedback:
                  "44": "You worked out 8 − 4 in the ones. Take 8 away from 44: back 4 to 40, then 4 more."
                  "40": "You stopped at 40. Of the 8 ones, 4 are still to take away."
                hints:
                  - "First 64 − 20."
                  - "44 − 8: back 4 to 40, then 4 more."
                  - "36."
              - id: l1-f3
                type: fill_in_blank
                text: "Take away in steps."
                say: "Fifty-five subtract twenty-eight. First take away the tens, then the ones."
                frame: "55 − 28 = 55 − 20 − _ = _"
                options: ["8", "5", "27", "35", "33"]
                answer: ["8", "27"]
                hints:
                  - "55 − 20 = 35."
                  - "35 − 8: back 5 to 30, then 3 more."
                  - "27."
              - id: l1-f4
                type: multiple_choice
                text: "82 − 47 = _"
                say: "Eighty-two subtract forty-seven."
                options: ["35", "45", "25"]
                answer: "35"
                feedback:
                  "45": "You worked out 7 − 2 in the ones. Take 7 away from 42: back 2 to 40, then 5 more."
                hints:
                  - "82 − 40 = 42."
                  - "42 − 7: back 2 to 40, then 5 more."
                  - "35."
              - id: l1-f5
                type: true_false
                text: "Is it true? 70 − 26 = 44"
                say: "Seventy subtract twenty-six is forty-four. Is that true?"
                answer: true
                hints:
                  - "70 − 20 = 50."
                  - "Then 50 − 6."
                  - "Yes, 44."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Take away in steps."
                say: "Sixty-eight subtract thirty-five. First take away the tens, then the ones."
                frame: "68 − 35 = 68 − 30 − _ = _"
                options: ["5", "8", "33", "38", "43"]
                answer: ["5", "33"]
                hints: ["Take away the tens first, then the ones."]
              - id: l1-s2
                type: multiple_choice
                text: "53 − 18 = _"
                say: "Fifty-three subtract eighteen."
                options: ["35", "45", "25"]
                answer: "35"
                hints: ["53 − 10 = 43. Then 43 − 8 goes back past 40."]
              - id: l1-s3
                type: text_input
                text: "79 − 54 = _"
                say: "Seventy-nine subtract fifty-four."
                answer: "25"
                hints: ["Take away the tens first."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 65 − 29 = 46"
                say: "Sixty-five subtract twenty-nine is forty-six. Is that true?"
                answer: false
                hints: ["Work out 65 − 20, then take away the ones."]
              - id: l1-s5
                type: multiple_choice
                text: "92 − 45. Which hop comes first?"
                say: "You take away forty-five from ninety-two in steps, tens first. Which hop comes first?"
                show: { drawn: rechenstrich, start: 92, jumps: [] }
                options: ["−40", "−5", "−4"]
                answer: "−40"
                hints: ["In steps means the tens come first."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Take away in steps."
                say: "Ninety-four subtract fifty-seven. First take away the tens, then the ones."
                frame: "94 − 57 = 94 − 50 − _ = _"
                options: ["7", "4", "37", "44", "47"]
                answer: ["7", "37"]
              - id: l1-n2
                type: text_input
                text: "49 − 26 = _"
                say: "Forty-nine subtract twenty-six."
                answer: "23"
              - id: l1-n3
                type: multiple_choice
                text: "76 − 39 = _"
                say: "Seventy-six subtract thirty-nine."
                options: ["37", "43", "47"]
                answer: "37"
              - id: l1-n4
                type: true_false
                text: "Is it true? 60 − 35 = 25"
                say: "Sixty subtract thirty-five is twenty-five. Is that true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "83 − 66 = _"
                say: "Eighty-three subtract sixty-six."
                answer: "17"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "88 − 45 = _"
            say: "Eighty-eight subtract forty-five."
            answer: "43"
          - id: l1-c2
            type: multiple_choice
            text: "71 − 26 = _"
            say: "Seventy-one subtract twenty-six."
            options: ["45", "55", "47"]
            answer: "45"
          - id: l1-c3
            type: fill_in_blank
            text: "Take away in steps."
            say: "Fifty-seven subtract thirty-nine. First take away the tens, then the ones."
            frame: "57 − 39 = 57 − 30 − _ = _"
            options: ["9", "7", "18", "27", "22"]
            answer: ["9", "18"]
          - id: l1-c4
            type: text_input
            text: "95 − 42 = _"
            say: "Ninety-five subtract forty-two."
            answer: "53"
          - id: l1-c5
            type: multiple_choice
            text: "61 − 34 = _"
            say: "Sixty-one subtract thirty-four."
            options: ["27", "33", "37"]
            answer: "27"
          - id: l1-c6
            type: true_false
            text: "Is it true? 80 − 47 = 33"
            say: "Eighty subtract forty-seven is thirty-three. Is that true?"
            answer: true

  - n: 2
    title: { de: Ergänzen, en: Counting on }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "75 − 32 = _"
            say: "Seventy-five subtract thirty-two. Take away the tens, then the ones."
            answer: "43"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Take away in steps."
            say: "Sixty-three subtract twenty-eight. First take away twenty, then eight."
            frame: "63 − 28 = 63 − 20 − _ = _"
            options: ["8", "35", "43", "3"]
            answer: ["8", "35"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "72 − 65"
            say: "Seventy-two subtract sixty-five. These numbers are close together, so counting on is easier. We find the difference: how far is it from sixty-five to seventy-two?"
            show: { drawn: rechenstrich, start: 65, jumps: [5, 2] }
          - text: "65 + 5 = 70 · 70 + 2 = 72"
            say: "From sixty-five to seventy is five. From seventy to seventy-two is two more. Five and two make seven."
          - text: "72 − 65 = 7"
            say: "So seventy-two subtract sixty-five is seven. The answer is the difference, the hops added together. It is not the number you land on."
          - text: "35 + _ = 72"
            say: "It works for bigger gaps too. From thirty-five to forty is five. From forty to seventy-two is thirty-two. Together that is thirty-seven, so seventy-two subtract thirty-five is thirty-seven."
            show: { drawn: rechenstrich, start: 35, jumps: [5, 32] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Count on: 53 − 48"
                say: "Fifty-three subtract forty-eight. Count on from forty-eight to fifty-three."
                frame: "48 + _ = 50 · 50 + _ = 53 · 53 − 48 = _"
                options: ["2", "3", "5", "1"]
                answer: ["2", "3", "5"]
                hints:
                  - "From 48 to 50."
                  - "From 50 to 53."
                  - "2 and 3 make 5."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "81 − 76 = _"
                say: "Eighty-one subtract seventy-six. Count on from seventy-six to eighty-one."
                show: { drawn: rechenstrich, start: 76, jumps: [4, 1] }
                options: ["5", "15", "81"]
                answer: "5"
                feedback:
                  "81": "You land on 81. The answer is the difference: the hops, 4 and 1."
                  "15": "Count the hops again: 76 to 80 is 4, then 1 more to 81."
                hints:
                  - "From 76 to 80."
                  - "Then on to 81."
                  - "4 + 1 = 5."
              - id: l2-f3
                type: text_input
                text: "42 + _ = 61"
                say: "Forty-two add how many makes sixty-one?"
                answer: "19"
                hints:
                  - "From 42 to 50 is 8."
                  - "From 50 to 61 is 11."
                  - "8 + 11 = 19."
              - id: l2-f4
                type: multiple_choice
                text: "Which method suits 92 − 89?"
                say: "Which method suits ninety-two subtract eighty-nine best?"
                options: ["count on", "take away in steps"]
                answer: "count on"
                feedback:
                  "take away in steps": "That works too, but 89 is very close to 92. Counting on is quicker: 89 + 3 = 92."
                hints:
                  - "How far apart are 89 and 92?"
                  - "They are very close together."
                  - "Count on."
              - id: l2-f5
                type: true_false
                text: "Is it true? 63 − 58 = 5"
                say: "Sixty-three subtract fifty-eight is five. Is that true?"
                answer: true
                hints:
                  - "Count on from 58 to 60."
                  - "Then on to 63."
                  - "2 + 3 = 5, so yes."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Count on: 74 − 67"
                say: "Seventy-four subtract sixty-seven. Count on from sixty-seven to seventy-four."
                frame: "67 + _ = 70 · 70 + _ = 74 · 74 − 67 = _"
                options: ["3", "4", "7", "6"]
                answer: ["3", "4", "7"]
                hints: ["Count on to the next ten first."]
              - id: l2-s2
                type: text_input
                text: "46 + _ = 70"
                say: "Forty-six add how many makes seventy?"
                answer: "24"
                hints: ["Count on to 50 first, then to 70."]
              - id: l2-s3
                type: multiple_choice
                text: "50 − 47 = _"
                say: "Fifty subtract forty-seven."
                options: ["3", "13", "7"]
                answer: "3"
                hints: ["Count on from 47 to 50."]
              - id: l2-s4
                type: multiple_choice
                text: "Which method suits 85 − 21?"
                say: "Which method suits eighty-five subtract twenty-one best?"
                options: ["take away in steps", "count on"]
                answer: "take away in steps"
                feedback:
                  "count on": "Counting on works, but 21 and 85 are far apart. Taking away 20, then 1, is quicker."
                hints: ["Are the two numbers close together?"]
              - id: l2-s5
                type: true_false
                text: "Is it true? 100 − 94 = 16"
                say: "One hundred subtract ninety-four is sixteen. Is that true?"
                answer: false
                hints: ["Count on from 94 to 100."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Count on: 62 − 57"
                say: "Sixty-two subtract fifty-seven. Count on from fifty-seven to sixty-two."
                frame: "57 + _ = 60 · 60 + _ = 62 · 62 − 57 = _"
                options: ["3", "2", "5", "15"]
                answer: ["3", "2", "5"]
              - id: l2-n2
                type: text_input
                text: "39 + _ = 84"
                say: "Thirty-nine add how many makes eighty-four?"
                answer: "45"
              - id: l2-n3
                type: multiple_choice
                text: "91 − 88 = _"
                say: "Ninety-one subtract eighty-eight."
                options: ["3", "13", "7"]
                answer: "3"
              - id: l2-n4
                type: text_input
                text: "70 − 66 = _"
                say: "Seventy subtract sixty-six."
                answer: "4"
              - id: l2-n5
                type: true_false
                text: "Is it true? 44 + 29 = 73, so 73 − 44 = 29."
                say: "Forty-four add twenty-nine is seventy-three. So seventy-three subtract forty-four is twenty-nine. Is that true?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: result
            type: text_input
            text: "97 − 64 = _"
            say: "Ninety-seven subtract sixty-four."
            answer: "33"
          - id: l2-c2
            part: result
            type: multiple_choice
            text: "83 − 47 = _"
            say: "Eighty-three subtract forty-seven."
            options: ["36", "44", "46"]
            answer: "36"
          - id: l2-c3
            part: result
            type: text_input
            text: "71 − 68 = _"
            say: "Seventy-one subtract sixty-eight."
            answer: "3"
          - id: l2-c4
            part: count-on
            type: fill_in_blank
            text: "Count on: 62 − 47"
            say: "Sixty-two subtract forty-seven. Count on from forty-seven to sixty-two."
            frame: "47 + _ = 50 · 50 + _ = 62 · 62 − 47 = _"
            options: ["3", "12", "15", "13", "2"]
            answer: ["3", "12", "15"]
          - id: l2-c5
            part: steps
            type: fill_in_blank
            text: "Take away in steps."
            say: "Sixty-four subtract thirty-seven. First take away the tens, then the ones."
            frame: "64 − 37 = 64 − 30 − _ = _"
            options: ["7", "4", "27", "34", "33"]
            answer: ["7", "27"]
          - id: l2-c6
            part: result
            type: text_input
            text: "56 − 29 = _"
            say: "Fifty-six subtract twenty-nine."
            answer: "27"
          - id: l2-c7
            part: result
            type: true_false
            text: "Is it true? 90 − 43 = 57"
            say: "Ninety subtract forty-three is fifty-seven. Is that true?"
            answer: false
          - id: l2-c8
            part: steps
            type: fill_in_blank
            text: "Take away in steps."
            say: "Seventy-eight subtract forty-three. First take away the tens, then the ones."
            frame: "78 − 43 = 78 − 40 − _ = _"
            options: ["3", "8", "35", "38", "45"]
            answer: ["3", "35"]
          - id: l2-c9
            part: steps
            type: multiple_choice
            text: "86 − 38 in steps: 86 − 30 = 56. What comes next?"
            say: "Eighty-six subtract thirty-eight in steps. Eighty-six subtract thirty is fifty-six. What comes next?"
            options: ["56 − 8", "56 − 3", "56 + 8"]
            answer: "56 − 8"
          - id: l2-c10
            part: steps
            type: multiple_choice
            text: "Which subtraction does this number line show?"
            say: "Look at the hops. Which subtraction does this number line show?"
            show: { drawn: rechenstrich, start: 91, jumps: [-50, -6] }
            options: ["91 − 56", "91 − 50", "91 + 56"]
            answer: "91 − 56"
          - id: l2-c11
            part: steps
            type: fill_in_blank
            text: "Take away in steps."
            say: "Fifty-two subtract twenty-seven. First take away the tens, then the ones."
            frame: "52 − 27 = 52 − 20 − _ = _"
            options: ["7", "2", "25", "32", "35"]
            answer: ["7", "25"]
          - id: l2-c12
            part: count-on
            type: fill_in_blank
            text: "Count on: 81 − 75"
            say: "Eighty-one subtract seventy-five. Count on from seventy-five to eighty-one."
            frame: "75 + _ = 80 · 80 + _ = 81 · 81 − 75 = _"
            options: ["5", "1", "6", "16"]
            answer: ["5", "1", "6"]
          - id: l2-c13
            part: count-on
            type: text_input
            text: "28 + _ = 63"
            say: "Twenty-eight add how many makes sixty-three?"
            answer: "35"
          - id: l2-c14
            part: count-on
            type: multiple_choice
            text: "Count on from 58 to 74. What is 74 − 58?"
            say: "Count on from fifty-eight to seventy-four. What is seventy-four subtract fifty-eight?"
            options: ["16", "74", "26"]
            answer: "16"
          - id: l2-c15
            part: count-on
            type: true_false
            text: "Is it true? 45 − 38 = 7"
            say: "Forty-five subtract thirty-eight is seven. Is that true?"
            answer: true
          - id: l2-c16
            part: choose
            type: multiple_choice
            text: "Which subtraction is quicker by counting on?"
            say: "Which subtraction is quicker to work out by counting on?"
            options: ["61 − 58", "61 − 20", "95 − 13"]
            answer: "61 − 58"
          - id: l2-c17
            part: choose
            type: multiple_choice
