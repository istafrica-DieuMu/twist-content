# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.money-to-100
skill: math.money.amounts-to-100
curriculum: en-GB
language: en
title:
  de: Geldbeträge bis 100
  en: Amounts of money to 100
summary: >
  Lesson 1 counts coins to an amount in pence up to 100p (50p + 20p + 5p
  = 75p), starting with the coin worth most, and finds coins that make
  an amount; lesson 2 counts notes and coins in pounds up to £100
  (£50 + £20 + £5 = £75), makes one amount in different ways, finds the
  way with the fewest coins, compares amounts, and ends with the skill
  check. Laying coins by dragging waits for drag_and_drop.
metadata:
  year: year-2
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.money.amounts-to-20, math.numbers-to-100.place-value]
  also_practises: [math.add-sub-to-100.tens-to-two-digit, math.numbers-to-100.place-value]
  vocabulary: { en: [pence, pound, coin, note, amount, total, worth, fewest coins, more, less] }
  forms: [drawn, text, audio]
  drawn: [coins]
  facets: [currency]
  parts:
    - { id: count-pence, what: { de: Münzen in Pence zählen, en: counting coins in pence } }
    - { id: count-pounds, what: { de: Scheine und Münzen in Pfund zählen, en: counting notes and coins in pounds } }
    - { id: ways, what: { de: "einen Betrag auf verschiedene Arten legen, auch mit den wenigsten Münzen", en: "making an amount in different ways, also with the fewest coins" } }
    - { id: compare, what: { de: Geldbeträge vergleichen, en: comparing amounts } }
  misconceptions:
    - id: count-coins-not-value
      what: Counts the coins instead of their values (three coins are 3p)
      addressed: lesson 1 Learn adds the values, biggest first; l1-f1 (with feedback), l1-s1 and l1-c1 offer the number of coins as an answer
    - id: more-coins-more-money
      what: Thinks the group with more coins is worth more
      addressed: lesson 2 Learn compares one 50p coin with four 10p coins; l2-f4 (with feedback), l2-s4 and l2-c4 compare a few coins worth more with many worth less
    - id: pounds-pence-mixed
      what: Reads an amount in notes and pound coins as pence (£63 read as 63p)
      addressed: lesson 2 Learn counts notes and pound coins in pounds; l2-f2 (with feedback) and l2-c2 offer the pence answer for an amount in pounds
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Pence zählen, en: Counting pence }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How much money?"
            say: "How much money is this?"
            show: { drawn: coins, values: [10, 5, 2] }
            options: ["17p", "3p", "16p"]
            answer: "17p"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is 40 + 30?"
            say: "Forty add thirty."
            options: ["70", "43", "60"]
            answer: "70"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "50p + 20p + 5p"
            say: "Here are three coins. Start with the coin worth the most: fifty pence."
            show: { drawn: coins, values: [50, 20, 5] }
          - text: "50p, 70p, 75p"
            say: "Count on. Fifty pence, add twenty is seventy pence, add five is seventy-five pence."
            show: { drawn: coins, values: [50, 20, 5] }
          - text: "20p + 20p + 10p + 2p = 52p"
            say: "Twenty, forty, fifty, fifty-two. Four coins, but fifty-two pence. Count the values, not the coins."
            show: { drawn: coins, values: [20, 20, 10, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How much money?"
                say: "How much money is this?"
                show: { drawn: coins, values: [50, 10, 1] }
                options: ["61p", "3p", "51p"]
                answer: "61p"
                feedback:
                  "3p": "There are three coins, but each coin is worth more than one penny. Add the values: fifty, sixty, sixty-one."
                hints:
                  - "Start with the fifty pence."
                  - "Fifty, then add ten, then one."
                  - "61p."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "How many pence?"
                say: "How many pence is this?"
                show: { drawn: coins, values: [20, 20, 5, 2] }
                answer: "47"
                hints:
                  - "Count the twenties first."
                  - "Twenty, forty, then add five and two."
                  - "47."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which coins make 35p?"
                say: "Which coins make thirty-five pence?"
                options:
                  - { drawn: coins, values: [20, 10, 5] }
                  - { drawn: coins, values: [20, 10, 2] }
                  - { drawn: coins, values: [20, 5] }
                answer: "35"
                hints:
                  - "Count each group, biggest coin first."
                  - "Twenty, thirty, thirty-five."
                  - "20p, 10p and 5p."
              - id: l1-f4
                type: fill_in_blank
                text: "Count on."
                say: "Count on from the biggest coin. Fill the gaps."
                show: { drawn: coins, values: [50, 20, 10] }
                frame: "50p, _p, _p"
                options: ["70", "80", "60", "90"]
                answer: ["70", "80"]
                hints:
                  - "Add the twenty to fifty."
                  - "Fifty and twenty is seventy. Then add ten."
                  - "70 and 80."
              - id: l1-f5
                type: true_false
                text: "Is it true? These coins make 100p."
                say: "These coins make one hundred pence. Is that true?"
                show: { drawn: coins, values: [50, 20, 20, 10] }
                answer: true
                hints:
                  - "Start with fifty."
                  - "Fifty, seventy, ninety, one hundred."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How much money?"
                say: "How much money is this?"
                show: { drawn: coins, values: [20, 10, 10, 5] }
                options: ["45p", "4p", "40p"]
                answer: "45p"
                hints: ["Add the values, biggest first."]
              - id: l1-s2
                type: text_input
                text: "How many pence?"
                say: "How many pence is this?"
                show: { drawn: coins, values: [50, 20, 2, 1] }
                answer: "73"
                hints: ["Fifty, seventy, then the small coins."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which coins make 60p?"
                say: "Which coins make sixty pence?"
                options:
                  - { drawn: coins, values: [50, 5, 5] }
                  - { drawn: coins, values: [50, 5] }
                  - { drawn: coins, values: [20, 20, 10] }
                answer: "60"
                hints: ["Count each group."]
              - id: l1-s4
                type: true_false
                text: "Is it true? These coins make 90p."
                say: "These coins make ninety pence. Is that true?"
                show: { drawn: coins, values: [50, 20, 10, 5] }
                answer: false
                hints: ["Fifty, seventy, eighty, and then?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Count on."
                say: "Count on from the biggest coin. Fill the gaps."
                show: { drawn: coins, values: [20, 20, 20, 5] }
                frame: "20p, _p, _p, _p"
                options: ["40", "60", "65", "25"]
                answer: ["40", "60", "65"]
                hints: ["Count in twenties, then add five."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "How many pence?"
                say: "How many pence is this?"
                show: { drawn: coins, values: [50, 10, 10, 2] }
                answer: "72"
              - id: l1-n2
                type: multiple_choice
                text: "How much money?"
                say: "How much money is this?"
                show: { drawn: coins, values: [10, 10, 10, 5, 1] }
                options: ["36p", "5p", "35p"]
                answer: "36p"
              - id: l1-n3
                type: image_multiple_choice
                text: "Which coins make 85p?"
                say: "Which coins make eighty-five pence?"
                options:
                  - { drawn: coins, values: [50, 20, 10, 5] }
                  - { drawn: coins, values: [50, 20, 5] }
                  - { drawn: coins, values: [50, 20, 10, 2] }
                answer: "85"
              - id: l1-n4
                type: true_false
                text: "Is it true? These coins make 54p."
                say: "These coins make fifty-four pence. Is that true?"
                show: { drawn: coins, values: [20, 20, 10, 2, 2] }
                answer: true
              - id: l1-n5
                type: text_input
                text: "How many pence?"
                say: "How many pence is this?"
                show: { drawn: coins, values: [50, 20, 20, 5, 2, 1] }
                answer: "98"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How much money?"
            say: "How much money is this?"
            show: { drawn: coins, values: [20, 10, 2] }
            options: ["32p", "3p", "30p"]
            answer: "32p"
          - id: l1-c2
            type: text_input
            text: "How many pence?"
            say: "How many pence is this?"
            show: { drawn: coins, values: [50, 5, 2] }
            answer: "57"
          - id: l1-c3
            type: image_multiple_choice
            text: "Which coins make 25p?"
            say: "Which coins make twenty-five pence?"
            options:
              - { drawn: coins, values: [20, 5] }
              - { drawn: coins, values: [20, 2] }
              - { drawn: coins, values: [10, 10, 10] }
            answer: "25"
          - id: l1-c4
            type: true_false
            text: "Is it true? These coins make 81p."
            say: "These coins make eighty-one pence. Is that true?"
            show: { drawn: coins, values: [50, 20, 10, 1] }
            answer: true
          - id: l1-c5
            type: text_input
            text: "How many pence?"
            say: "How many pence is this?"
            show: { drawn: coins, values: [20, 20, 10, 5, 1] }
            answer: "56"
          - id: l1-c6
            type: image_multiple_choice
            text: "Which coins make 63p?"
            say: "Which coins make sixty-three pence?"
            options:
              - { drawn: coins, values: [50, 10, 1, 1] }
              - { drawn: coins, values: [20, 20, 20, 2] }
              - { drawn: coins, values: [50, 10, 2, 1] }
            answer: "63"

  - n: 2
    title: { de: Pfund und verschiedene Wege, en: Pounds and different ways }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "How many pence?"
            say: "How many pence is this?"
            show: { drawn: coins, values: [50, 20, 5, 1] }
            answer: "76"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Which coins make 42p?"
            say: "Which coins make forty-two pence?"
            options:
              - { drawn: coins, values: [20, 20, 2] }
              - { drawn: coins, values: [20, 20, 1] }
              - { drawn: coins, values: [20, 10, 2] }
            answer: "42"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "£50 + £20 + £5 = £75"
            say: "Notes and pound coins count the same way. Fifty pounds, add twenty is seventy pounds, add five is seventy-five pounds."
            show: { drawn: coins, values: [5000, 2000, 500] }
          - text: "£20 + £20 + £10 = £50"
            say: "Fifty pounds can be made in different ways: two twenty pound notes and a ten pound note, or one fifty pound note."
            show: { drawn: coins, values: [2000, 2000, 1000] }
          - text: "50p = 20p + 20p + 10p"
            say: "Fifty pence is one coin, or three coins: twenty, twenty and ten. The fifty pence coin is the fewest coins."
            show: { drawn: coins, values: [20, 20, 10] }
          - text: "50p is more than 10p + 10p + 10p + 10p"
            say: "One fifty pence coin is worth more than four ten pence coins. Four tens are only forty pence."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How much money?"
                say: "How much money is this?"
                show: { drawn: coins, values: [2000, 1000, 500, 200] }
                options: ["£37", "£4", "£35"]
                answer: "£37"
                hints:
                  - "Start with the twenty pound note."
                  - "Twenty, thirty, thirty-five, and then two more."
                  - "£37."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How much money?"
                say: "How much money is this?"
                show: { drawn: coins, values: [5000, 1000, 200, 100] }
                options: ["£63", "63p", "£61"]
                answer: "£63"
                feedback:
                  "63p": "These are notes and pound coins, so the amount is in pounds."
                hints:
                  - "Notes and these coins are pounds."
                  - "Fifty, sixty, sixty-two, sixty-three."
                  - "£63."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which is another way to make 20p?"
                say: "Which coins are another way to make twenty pence?"
                options:
                  - { drawn: coins, values: [10, 5, 5] }
                  - { drawn: coins, values: [10, 5, 2] }
                  - { drawn: coins, values: [10, 10, 5] }
                answer: "20"
                hints:
                  - "Count each group."
                  - "Ten and five and five."
                  - "10p, 5p and 5p."
              - id: l2-f4
                type: multiple_choice
                text: "Which is worth more: 50p, or 10p + 10p + 10p?"
                say: "Which is worth more: one fifty pence coin, or three ten pence coins?"
                options: ["50p", "10p + 10p + 10p"]
                answer: "50p"
                keep_order: true
                feedback:
                  "10p + 10p + 10p": "Three coins, but only thirty pence. Fifty pence is more."
                hints:
                  - "Add the ten pence coins."
                  - "Three tens are thirty pence."
                  - "50p."
              - id: l2-f5
                type: multiple_choice
                text: "Which is the fewest coins for 70p?"
                say: "Which is the fewest coins to make seventy pence?"
                options: ["50p + 20p", "20p + 20p + 20p + 10p", "50p + 10p + 10p"]
                answer: "50p + 20p"
                hints:
                  - "All three make seventy pence. Which uses the fewest coins?"
                  - "Start with the biggest coin you can: fifty."
                  - "50p + 20p."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "How many pounds?"
                say: "How many pounds is this?"
                show: { drawn: coins, values: [5000, 2000, 2000, 500] }
                answer: "95"
                hints: ["Fifty, seventy, ninety, then five."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which makes £40?"
                say: "Which notes make forty pounds?"
                options:
                  - { drawn: coins, values: [2000, 1000, 1000] }
                  - { drawn: coins, values: [2000, 1000, 500] }
                  - { drawn: coins, values: [1000, 1000, 500] }
                answer: "4000"
                hints: ["Count each group in pounds."]
              - id: l2-s3
                type: multiple_choice
                text: "Which is the fewest coins for 30p?"
                say: "Which is the fewest coins to make thirty pence?"
                options: ["20p + 10p", "10p + 10p + 10p", "20p + 5p + 5p"]
                answer: "20p + 10p"
                hints: ["Start with the biggest coin that fits."]
              - id: l2-s4
                type: multiple_choice
                text: "Which is worth more: £5, or £2 + £2?"
                say: "Which is worth more: one five pound note, or two two pound coins?"
                options: ["£5", "£2 + £2"]
                answer: "£5"
                keep_order: true
                hints: ["Two two pound coins are four pounds."]
              - id: l2-s5
                type: true_false
                text: "Is it true? £20 + £20 + £10 is the same as £50."
                say: "Twenty pounds, twenty pounds and ten pounds is the same as fifty pounds. Is that true?"
                answer: true
                hints: ["Twenty, forty, fifty."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "How many pounds?"
                say: "How many pounds is this?"
                show: { drawn: coins, values: [5000, 1000, 500, 200, 100] }
                answer: "68"
              - id: l2-n2
                type: multiple_choice
                text: "Which is less: 20p + 20p, or 50p?"
                say: "Which is less: two twenty pence coins, or one fifty pence coin?"
                options: ["20p + 20p", "50p"]
                answer: "20p + 20p"
                keep_order: true
              - id: l2-n3
                type: image_multiple_choice
                text: "Which is another way to make 50p?"
                say: "Which coins are another way to make fifty pence?"
                options:
                  - { drawn: coins, values: [20, 20, 5, 5] }
                  - { drawn: coins, values: [20, 20, 5] }
                  - { drawn: coins, values: [20, 10, 10, 2] }
                answer: "50"
              - id: l2-n4
                type: multiple_choice
                text: "Which is the fewest coins and notes for £25?"
                say: "Which is the fewest notes and coins to make twenty-five pounds?"
                options: ["£20 + £5", "£10 + £10 + £5", "£20 + £2 + £2 + £1"]
                answer: "£20 + £5"
              - id: l2-n5
                type: true_false
                text: "Is it true? 10p + 10p + 10p + 10p + 10p is more than 50p."
                say: "Five ten pence coins are more than fifty pence. Is that true?"
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: count-pence
            type: text_input
            text: "How many pence?"
            say: "How many pence is this?"
            show: { drawn: coins, values: [50, 20, 10, 5, 2] }
            answer: "87"
          - id: l2-c2
            part: count-pounds
            type: multiple_choice
            text: "How much money?"
            say: "How much money is this?"
            show: { drawn: coins, values: [2000, 2000, 1000, 500, 100] }
            options: ["£56", "56p", "£5"]
            answer: "£56"
          - id: l2-c3
            part: ways
            type: image_multiple_choice
            text: "Which makes 80p?"
            say: "Which coins make eighty pence?"
            options:
              - { drawn: coins, values: [50, 20, 10] }
              - { drawn: coins, values: [50, 20, 5] }
              - { drawn: coins, values: [20, 20, 20, 10] }
            answer: "80"
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Which is worth more: £10, or £2 + £2 + £2 + £2?"
            say: "Which is worth more: one ten pound note, or four two pound coins?"
            options: ["£10", "£2 + £2 + £2 + £2"]
            answer: "£10"
            keep_order: true
          - id: l2-c5
            part: ways
            type: multiple_choice
            text: "Which is the fewest coins for 15p?"
            say: "Which is the fewest coins to make fifteen pence?"
            options: ["10p + 5p", "5p + 5p + 5p", "10p + 2p + 2p + 1p"]
            answer: "10p + 5p"
          - id: l2-c6
            part: count-pence
            type: multiple_choice
            text: "How much money?"
            say: "How much money is this?"
            show: { drawn: coins, values: [50, 20, 20, 2] }
            options: ["92p", "4p", "90p"]
            answer: "92p"
          - id: l2-c7
            part: count-pence
            type: text_input
            text: "How many pence?"
            say: "How many pence is this?"
            show: { drawn: coins, values: [20, 10, 5, 5, 1] }
            answer: "41"
          - id: l2-c8
            part: count-pence
            type: true_false
            text: "Is it true? These coins make 66p."
            say: "These coins make sixty-six pence. Is that true?"
            show: { drawn: coins, values: [20, 20, 20, 2, 2] }
            answer: false
          - id: l2-c9
            part: count-pence
            type: fill_in_blank
            text: "Count on from the biggest coin."
            say: "Count on from the biggest coin. Fill the gaps."
            show: { drawn: coins, values: [50, 20, 5, 2] }
            frame: "50p, _p, _p, _p"
            options: ["70", "72", "75", "77"]
            answer: ["70", "75", "77"]
          - id: l2-c10
            part: count-pounds
            type: text_input
            text: "How many pounds?"
            say: "How many pounds is this?"
            show: { drawn: coins, values: [2000, 2000, 2000, 1000, 200] }
            answer: "72"
          - id: l2-c11
            part: count-pounds
            type: multiple_choice
            text: "How much money?"
            say: "How much money is this?"
            show: { drawn: coins, values: [5000, 2000, 1000, 500] }
            options: ["£85", "85p", "£4"]
            answer: "£85"
          - id: l2-c12
            part: count-pounds
            type: true_false
            text: "Is it true? This is £100."
            say: "This is one hundred pounds. Is that true?"
            show: { drawn: coins, values: [5000, 2000, 2000, 1000] }
            answer: true
          - id: l2-c13
            part: count-pounds
            type: multiple_choice
            text: "How much money?"
            say: "How much money is this?"
            show: { drawn: coins, values: [1000, 500, 200, 200, 100] }
            options: ["£20", "£5", "£18"]
            answer: "£20"
          - id: l2-c14
            part: ways
            type: image_multiple_choice
            text: "Which is another way to make £10?"
            say: "Which notes and coins are another way to make ten pounds?"
            options:
              - { drawn: coins, values: [500, 200, 200] }
              - { drawn: coins, values: [500, 200, 200, 100] }
              - { drawn: coins, values: [200, 200, 200, 200] }
            answer: "1000"
          - id: l2-c15
            part: ways
            type: multiple_choice
            text: "Which is the fewest coins for 60p?"
            say: "Which is the fewest coins to make sixty pence?"
            options: ["50p + 10p", "20p + 20p + 20p", "50p + 5p + 5p"]
            answer: "50p + 10p"
          - id: l2-c16
            part: ways
            type: true_false
            text: "Is it true? 20p + 10p + 10p + 5p is another way to make 45p."
            say: "Twenty pence, ten pence, ten pence and five pence is another way to make forty-five pence. Is that true?"
            answer: true
          - id: l2-c17
            part: compare
            type: multiple_choice
            text: "Which is worth more: 20p, or 5p + 5p + 5p?"
            say: "Which is worth more: one twenty pence coin, or three five pence coins?"
            options: ["20p", "5p + 5p + 5p"]
            answer: "20p"
            keep_order: true
          - id: l2-c18
            part: compare
            type: image_multiple_choice
            text: "Which is worth the most?"
            say: "Which coins are worth the most?"
            options:
              - { drawn: coins, values: [10, 10, 10, 10, 10] }
              - { drawn: coins, values: [50, 20] }
              - { drawn: coins, values: [20, 20, 2] }
            answer: "70"
          - id: l2-c19
            part: compare
            type: true_false
            text: "Is it true? £5 + £5 + £5 is more than £20."
            say: "Three five pound notes are more than twenty pounds. Is that true?"
            answer: false
          - id: l2-c20
            part: compare
            type: multiple_choice
            text: "Ella has 50p, 20p and 10p. Sam has 20p, 20p, 20p and 5p. Who has more money?"
            say: "Ella has fifty pence, twenty pence and ten pence. Sam has twenty pence, twenty pence, twenty pence and five pence. Who has more money?"
            options: ["Ella", "Sam", "They have the same."]
            answer: "Ella"
