# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.place-value-to-100
skill: math.numbers-to-100.place-value
curriculum: en-GB
language: en
title:
  de: Stellenwert bis 100
  en: Place value to 100
summary: >
  Two-digit numbers in a tens and ones chart (T, O), with base ten blocks
  and in the part-whole model England uses: 34 is 30 and 4. Lesson 1
  moves between blocks, chart and part-whole model; lesson 2 partitions
  in more than one way (34 is also 20 and 14), as Year 2 asks, and ends
  with the skill check.
metadata:
  year: year-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.bundle-tens]
  also_practises: []
  vocabulary: { en: [tens, ones, place value, digit, partition, part, whole, exchange] }
  forms: [drawn, text, audio]
  drawn: [base-ten, place-value-chart, part-whole]
  facets: []
  parts:
    - { id: chart-blocks, what: { de: Zahlen in der Stellentafel und mit Zehnerstangen und Einerwürfeln zeigen, en: showing numbers in a tens and ones chart and with blocks } }
    - { id: digit-value, what: { de: "sagen, wie viel eine Ziffer wert ist", en: saying what a digit is worth } }
    - { id: partition, what: { de: in Zehner und Einer zerlegen, en: partitioning into tens and ones } }
    - { id: other-ways, what: { de: auf andere Arten zerlegen, en: partitioning in more than one way } }
  misconceptions:
    - id: digit-value
      what: Says the 3 in 34 is worth 3
      addressed: Learn shows the 3 as three ten sticks and as the part 30 in the part-whole model
    - id: one-way-only
      what: Thinks 34 can only be split as 30 and 4
      addressed: lesson 2 Learn exchanges a ten for ten ones and shows 20 and 14 make the same whole
    - id: zero-dropped
      what: Writes 4 for 4 tens and 0 ones
      addressed: tasks with 0 ones in most stages; feedback says the 0 holds the ones place
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner und Einer zeigen, en: Showing tens and ones }
    goal:
      de: "Zeig eine Zahl in der Stellenwerttafel und mit Teilen, so wie 34 ist 30 und 4."
      en: "Show a number in a place value chart and as parts, like 34 is 30 and 4."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, tens: 3, ones: 5 }
            options: ["35", "53", "8"]
            answer: "35"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many tens make 70?"
            options: ["7", "70", "17"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "34 or 43?"
            say: "Here are three ten sticks and four single cubes. What number do you think they make: thirty-four or forty-three? Have a guess."
            show: { drawn: base-ten, tens: 3, ones: 4 }
          - text: "T | O"
            say: "It's thirty-four. A place value chart shows why. T is for tens and O is for ones. The tens go on the left."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [null, null] }
          - text: "3 tens and 4 ones"
            say: "Three tens and four ones. The three goes in the tens column and the four in the ones column. The number is thirty-four."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [3, 4] }
          - text: "34 = 30 + 4"
            say: "We can show it as a part-whole model too. The whole is thirty-four. The parts are thirty and four. The three is worth thirty."
            show: { drawn: part-whole, whole: 34, parts: [30, 4] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [2, 6] }
                options: ["26", "62", "8"]
                answer: "26"
                feedback:
                  "62": "The 2 is in the tens column, so it is 2 tens."
                hints:
                  - "T is tens, O is ones."
                  - "2 tens make twenty. Then 6 ones."
                  - "It is 26."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ben has 47 marbles: 4 bags of ten and some loose ones. How many loose marbles?"
                say: "Ben has forty-seven marbles. Forty are in four bags of ten. The rest are loose. How many loose marbles are there?"
                show: { drawn: part-whole, whole: 47, parts: [40, null] }
                options: ["4", "7", "40", "The dog ate them."]
                answer: "7"
                feedback:
                  "The dog ate them.": "Not this time, the dog is asleep! 40 and how many make 47?"
                hints:
                  - "47 is 4 tens and 7 ones."
                  - "40 is the tens. The other part is the ones."
                  - "40 and 7 make 47."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which chart shows 53?"
                options:
                  - { drawn: place-value-chart, columns: [tens, ones], values: [3, 5] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [5, 3] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [5, 0] }
                answer: "53"
                hints:
                  - "53 has 5 tens."
                  - "The 5 goes in the tens column."
                  - "T: 5, O: 3."
              - id: l1-f4
                type: fill_in_blank
                text: "Partition 68."
                frame: "68 = _ + 8"
                options: ["6", "8", "60", "80"]
                answer: ["60"]
                hints:
                  - "68 is 6 tens and 8 ones."
                  - "6 tens are worth 60."
                  - "68 = 60 + 8."
              - id: l1-f5
                type: multiple_choice
                text: "What is the 4 in 49 worth?"
                options: ["4", "40", "9"]
                answer: "40"
                feedback:
                  "4": "The 4 is in the tens place, so it is worth 4 tens."
                hints:
                  - "Which place is the 4 in?"
                  - "It is in the tens place."
                  - "4 tens are worth 40."
              - id: l1-f6
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [8, 0] }
                options: ["8", "80", "18"]
                answer: "80"
                feedback:
                  "8": "The 8 is in the tens column. The 0 holds the ones place, so it is 80."
                hints:
                  - "The 8 is in the tens column."
                  - "8 tens and no ones."
                  - "It is 80."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [7, 1] }
                options: ["17", "71", "8"]
                answer: "71"
                hints: ["The left column is tens."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is thirty-five. One part is five. What is the other part?"
                show: { drawn: part-whole, whole: 35, parts: [null, 5] }
                options: ["3", "30", "35"]
                answer: "30"
                hints: ["35 is 3 tens and 5 ones."]
              - id: l1-s3
                type: fill_in_blank
                text: "Partition 92."
                frame: "92 = _ + 2"
                options: ["2", "9", "20", "90"]
                answer: ["90"]
                hints: ["9 tens and 2 ones."]
              - id: l1-s4
                type: multiple_choice
                text: "What is the 6 in 86 worth?"
                options: ["6", "60", "8"]
                answer: "6"
                hints: ["Which place is the 6 in?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which shows 25?"
                options:
                  - { drawn: base-ten, tens: 5, ones: 2 }
                  - { drawn: base-ten, tens: 2, ones: 5 }
                  - { drawn: base-ten, tens: 2, ones: 2 }
                answer: "25"
                hints: ["25 has 2 tens."]
              - id: l1-s6
                type: true_false
                text: "Is it true? 50 + 9 = 59"
                answer: true
                hints: ["5 tens and 9 ones."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [4, 9] }
                options: ["49", "94", "13"]
                answer: "49"
              - id: l1-n2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is sixty-three. One part is sixty. What is the other part?"
                show: { drawn: part-whole, whole: 63, parts: [60, null] }
                options: ["3", "6", "30"]
                answer: "3"
              - id: l1-n3
                type: fill_in_blank
                text: "Partition 74."
                frame: "74 = _ + 4"
                options: ["4", "7", "40", "70"]
                answer: ["70"]
              - id: l1-n4
                type: multiple_choice
                text: "What is the 3 in 38 worth?"
                options: ["3", "30", "8"]
                answer: "30"
              - id: l1-n5
                type: image_multiple_choice
                text: "Which chart shows 40?"
                options:
                  - { drawn: place-value-chart, columns: [tens, ones], values: [0, 4] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [4, 0] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [4, 4] }
                answer: "40"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [tens, ones], values: [6, 8] }
            options: ["86", "68", "14"]
            answer: "68"
          - id: l1-c2
            type: fill_in_blank
            text: "Partition 57."
            frame: "57 = _ + 7"
            options: ["5", "7", "50", "70"]
            answer: ["50"]
          - id: l1-c3
            type: multiple_choice
            text: "What is the 2 in 25 worth?"
            options: ["2", "20", "5"]
            answer: "20"
          - id: l1-c4
            type: image_multiple_choice
            text: "Which chart shows 61?"
            options:
              - { drawn: place-value-chart, columns: [tens, ones], values: [1, 6] }
              - { drawn: place-value-chart, columns: [tens, ones], values: [6, 1] }
              - { drawn: place-value-chart, columns: [tens, ones], values: [6, 0] }
            answer: "61"
          - id: l1-c5
            type: multiple_choice
            text: "What is the missing part?"
            say: "The whole is eighty-two. One part is eighty. What is the other part?"
            show: { drawn: part-whole, whole: 82, parts: [80, null] }
            options: ["2", "8", "20"]
            answer: "2"
          - id: l1-c6
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, tens: 5, ones: 6 }
            options: ["56", "65", "11"]
            answer: "56"

  - n: 2
    title: { de: Auf verschiedene Arten zerlegen, en: Partitioning in different ways }
    goal:
      de: "Zerleg eine Zahl auf mehr als eine Art, so wie 34 ist 30 und 4 oder auch 20 und 14."
      en: "Split a number in more than one way, like 34 is 30 and 4, or 20 and 14."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Partition 45."
            frame: "45 = _ + 5"
            options: ["4", "5", "40", "50"]
            answer: ["40"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [tens, ones], values: [5, 2] }
            options: ["52", "25", "7"]
            answer: "52"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "34 = 30 + 4. Is there another way?"
            say: "Thirty-four is three tens and four ones: thirty and four. Do you think there is another way to split thirty-four into two parts? Have a guess."
            show: { drawn: base-ten, tens: 3, ones: 4 }
          - text: "1 ten → 10 ones"
            say: "Yes, there is! We exchange one ten for ten ones. There are two tens left, and fourteen ones."
            show: { drawn: base-ten, tens: 2, ones: 14 }
          - text: "34 = 20 + 14"
            say: "It is still thirty-four. Twenty and fourteen make the same whole. A number can be partitioned in more than one way."
            show: { drawn: part-whole, whole: 34, parts: [20, 14] }
          - text: "Did you know? With just 10 digits, 0 to 9, you can write every number there is."
            say: "Did you know? With just ten digits, nought to nine, you can write every number there is. That works because a digit's place tells you what it is worth: the 3 in 43 is worth three, and the 3 in 34 is worth thirty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Is it true? 46 = 30 + 16"
                show: { drawn: base-ten, tens: 3, ones: 16 }
                answer: true
                hints:
                  - "One ten has been exchanged for ten ones."
                  - "3 tens and 16 ones."
                  - "30 and 16 make 46. Yes."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is fifty-two. One part is forty. What is the other part?"
                show: { drawn: part-whole, whole: 52, parts: [40, null] }
                options: ["2", "12", "20"]
                answer: "12"
                feedback:
                  "2": "40 and 2 make 42, not 52. One ten has moved into the ones."
                hints:
                  - "52 is 5 tens and 2 ones. Here one part has only 4 tens."
                  - "The other part has the extra ten and the 2 ones."
                  - "40 and 12 make 52."
              - id: l2-f3
                type: fill_in_blank
                text: "Partition 63 another way."
                frame: "63 = 50 + _"
                options: ["3", "13", "30"]
                answer: ["13"]
                hints:
                  - "63 is 60 and 3."
                  - "50 is one ten less than 60. Put that ten with the ones."
                  - "63 = 50 + 13."
              - id: l2-f4
                type: multiple_choice
                text: "Which is another way to make 38?"
                options: ["20 + 18", "30 + 18", "20 + 8"]
                answer: "20 + 18"
                hints:
                  - "Add each pair and check."
                  - "20 + 18 is 38. 30 + 18 is 48."
                  - "20 + 18."
              - id: l2-f5
                type: true_false
                text: "Is it true? 71 = 60 + 1"
                answer: false
                hints:
                  - "Work out 60 + 1."
                  - "60 + 1 is 61."
                  - "No. 71 = 60 + 11."
              - id: l2-f6
                type: fill_in_blank
                text: "Partition 85 another way."
                frame: "85 = _ + 25"
                options: ["50", "60", "80"]
                answer: ["60"]
                hints:
                  - "25 is 2 tens and 5 ones."
                  - "85 has 8 tens. 2 of them are in the 25."
                  - "85 = 60 + 25."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Is it true? 54 = 40 + 14"
                answer: true
                hints: ["Add 40 and 14."]
              - id: l2-s2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is seventy-six. One part is fifty. What is the other part?"
                show: { drawn: part-whole, whole: 76, parts: [50, null] }
                options: ["6", "16", "26"]
                answer: "26"
                hints: ["Count on from 50 to 76."]
              - id: l2-s3
                type: fill_in_blank
                text: "Partition 42 another way."
                frame: "42 = 30 + _"
                options: ["2", "12", "22"]
                answer: ["12"]
                hints: ["One ten moves to the ones."]
              - id: l2-s4
                type: multiple_choice
                text: "Which is another way to make 67?"
                options: ["50 + 17", "50 + 7", "60 + 17"]
                answer: "50 + 17"
                hints: ["Add each pair."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 90 = 80 + 10"
                answer: true
                hints: ["8 tens and 1 ten."]
              - id: l2-s6
                type: fill_in_blank
                text: "Partition 33 another way."
                frame: "33 = _ + 13"
                options: ["10", "20", "30"]
                answer: ["20"]
                hints: ["13 has 1 ten."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Is it true? 58 = 40 + 8"
                answer: false
              - id: l2-n2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is ninety-one. One part is seventy. What is the other part?"
                show: { drawn: part-whole, whole: 91, parts: [70, null] }
                options: ["1", "21", "11"]
                answer: "21"
              - id: l2-n3
                type: fill_in_blank
                text: "Partition 24 another way."
                frame: "24 = 10 + _"
                options: ["4", "14", "24"]
                answer: ["14"]
              - id: l2-n4
                type: multiple_choice
                text: "Which is another way to make 45?"
                options: ["30 + 15", "30 + 5", "40 + 15"]
                answer: "30 + 15"
              - id: l2-n5
                type: fill_in_blank
                text: "Partition 80 another way."
                frame: "80 = 70 + _"
                options: ["0", "1", "10"]
                answer: ["10"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: chart-blocks
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [tens, ones], values: [9, 3] }
            options: ["39", "93", "12"]
            answer: "93"
          - id: l2-c2
            part: partition
            type: fill_in_blank
            text: "Partition 76."
            frame: "76 = _ + 6"
            options: ["6", "7", "60", "70"]
            answer: ["70"]
          - id: l2-c3
            part: other-ways
            type: multiple_choice
            text: "What is the missing part?"
            say: "The whole is sixty-four. One part is fifty. What is the other part?"
            show: { drawn: part-whole, whole: 64, parts: [50, null] }
            options: ["4", "14", "24"]
            answer: "14"
          - id: l2-c4
            part: digit-value
            type: multiple_choice
            text: "What is the 7 in 72 worth?"
            options: ["7", "70", "2"]
            answer: "70"
          - id: l2-c5
            part: other-ways
            type: true_false
            text: "Is it true? 83 = 70 + 13"
            answer: true
          - id: l2-c6
            part: chart-blocks
            type: image_multiple_choice
            text: "Which blocks show 47?"
            options:
              - { drawn: base-ten, tens: 7, ones: 4 }
              - { drawn: base-ten, tens: 4, ones: 4 }
              - { drawn: base-ten, tens: 4, ones: 7 }
            answer: "47"
          - id: l2-c7
            part: chart-blocks
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, tens: 6, ones: 0 }
            options: ["60", "6", "16"]
            answer: "60"
          - id: l2-c8
            part: chart-blocks
            type: fill_in_blank
            text: "Write 39 in the chart."
            say: "Write thirty-nine in the place value chart."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [null, null] }
            frame: "T: _  O: _"
            options: ["3", "9", "30"]
            answer: ["3", "9"]
          - id: l2-c9
            part: chart-blocks
            type: image_multiple_choice
            text: "Which chart shows 15?"
            options:
              - { drawn: place-value-chart, columns: [tens, ones], values: [5, 1] }
              - { drawn: place-value-chart, columns: [tens, ones], values: [1, 5] }
              - { drawn: place-value-chart, columns: [tens, ones], values: [1, 0] }
            answer: "15"
          - id: l2-c10
            part: digit-value
            type: multiple_choice
            text: "In which number is the 6 worth 60?"
            options: ["16", "63", "96"]
            answer: "63"
          - id: l2-c11
            part: digit-value
            type: true_false
            text: "Is it true? In 91, the 9 is worth 9."
            say: "In ninety-one, the nine is worth nine. Is that true?"
            answer: false
          - id: l2-c12
            part: digit-value
            type: multiple_choice
            text: "Which digit is in the tens place in 52?"
            options: ["5", "2", "50"]
            answer: "5"
          - id: l2-c13
            part: digit-value
            type: fill_in_blank
            text: "How many tens and ones are in 84?"
            frame: "84 = _ tens and _ ones"
            options: ["8", "4", "80", "40"]
            answer: ["8", "4"]
          - id: l2-c14
            part: partition
            type: fill_in_blank
            text: "Partition 29."
            frame: "29 = 20 + _"
            options: ["2", "9", "90"]
            answer: ["9"]
          - id: l2-c15
            part: partition
            type: multiple_choice
            text: "What is the whole?"
            say: "The parts are forty and six. What is the whole?"
            show: { drawn: part-whole, whole: null, parts: [40, 6] }
            options: ["46", "64", "10"]
            answer: "46"
          - id: l2-c16
            part: partition
            type: true_false
            text: "Is it true? 60 + 7 = 76"
            say: "Sixty add seven is seventy-six. Is that true?"
            answer: false
          - id: l2-c17
            part: partition
            type: multiple_choice
            text: "Which number is 30 + 8?"
            options: ["38", "83", "11"]
            answer: "38"
          - id: l2-c18
            part: other-ways
            type: fill_in_blank
            text: "Partition 56 another way."
            frame: "56 = 40 + _"
            options: ["6", "16", "26"]
            answer: ["16"]
          - id: l2-c19
            part: other-ways
            type: multiple_choice
            text: "Which is another way to make 72?"
            options: ["60 + 12", "60 + 2", "70 + 12"]
            answer: "60 + 12"
          - id: l2-c20
            part: other-ways
            type: true_false
            text: "Is it true? These blocks show 52."
            say: "Here are four tens and twelve ones. Do these blocks show fifty-two?"
            show: { drawn: base-ten, tens: 4, ones: 12 }
            answer: true
