# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.more-solids
skill: math.solids.more-solids
curriculum: en-GB
language: en
title:
  de: Pyramide, Zylinder, Kegel
  en: Pyramids, cylinders and cones
summary: >
  Lesson 1 names the cylinder, the cone and the square-based pyramid by
  the 2-D shapes on their faces (two circles; a circle and a point; a
  square and four triangles) and finds them in everyday objects; lesson 2
  counts the faces, edges and vertices of all six 3-D shapes, sorts the
  shapes that roll from those that do not, and ends with the skill check.
  Handling and building real shapes waits for a hands-on task.
metadata:
  year: year-2
  topic: { de: Körper, en: 3D shapes }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.solids.cube-cuboid-sphere, math.shapes.properties]
  also_practises: [math.solids.cube-cuboid-sphere]
  vocabulary: { en: [3-D shape, cylinder, cone, pyramid, cube, cuboid, sphere, face, flat face, curved surface, edge, vertex, vertices, point, roll] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: name, what: { de: "Pyramide, Zylinder und Kegel erkennen", en: "recognising pyramids, cylinders and cones" } }
    - { id: faces, what: { de: die ebenen Formen auf den Flächen eines Körpers, en: the 2-D shapes on the faces of a 3-D shape } }
    - { id: count, what: { de: "Ecken, Kanten und Flächen zählen", en: "counting faces, edges and vertices" } }
    - { id: sort, what: { de: Körper nach ihren Eigenschaften sortieren, en: sorting 3-D shapes by their properties } }
  misconceptions:
    - id: cone-pyramid-mixed
      what: Mixes up the cone and the pyramid because both have a point, or the cone and the cylinder because both are round
      addressed: lesson 1 Learn sets the bottom face of each apart (circle or square); l1-f5 has feedback on calling a cone a pyramid, l1-f3 has feedback on the cone, l1-s3 calls a cylinder a cone, l1-s5 and l1-n4 name a shape by its bottom face and its point
    - id: faces-edges-vertices-mixed
      what: Mixes up faces, edges and vertices when counting (6 vertices on a cube) or forgets the bottom face of the pyramid
      addressed: lesson 2 Learn shows each word on the cube; l2-f1 has feedback on 6 and 12, l2-f2 counts the bottom face in its hints, l2-s1, l2-n1, l2-c2 and l2-c5 ask for one word at a time
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Neue Körper", en: "New 3-D shapes" }
    goal:
      de: "Erkenne Zylinder, Kegel und Pyramiden an ihren Flächen, so wie eine Bohnendose ein Zylinder ist."
      en: "Name cylinders, cones and pyramids by their faces, like a tin of beans is a cylinder."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is this 3-D shape called?"
            show: { drawn: shape, kind: cube, colour: blue }
            options: ["cube", "square", "sphere"]
            answer: "cube"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many sides does a triangle have?"
            options: ["3", "4", "5"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "cylinder"
            say: "This is a cylinder. It has a flat circle face at the top and another at the bottom. In between, it has a curved surface. A tin of beans is a cylinder."
            show: { drawn: shape, kind: cylinder, colour: green }
          - text: "cone"
            say: "This is a cone. It has one flat circle face at the bottom. Its curved surface goes up to a point at the top. A traffic cone is shaped like a cone."
            show: { drawn: shape, kind: cone, colour: orange }
          - text: "pyramid"
            say: "This is a pyramid. It has a square face at the bottom. Its other faces are triangles, and they meet at a point at the top. All of its faces are flat."
            show: { drawn: shape, kind: pyramid, colour: yellow }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is this 3-D shape called?"
                show: { drawn: shape, kind: cylinder, colour: blue }
                options: ["cylinder", "cone", "sphere"]
                answer: "cylinder"
                hints:
                  - "Look at the top and the bottom."
                  - "There is a flat circle face at each end."
                  - "Cylinder."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Which one is the cone?"
                options:
                  - { drawn: shape, kind: cone, colour: red }
                  - { drawn: shape, kind: cylinder, colour: red }
                  - { drawn: shape, kind: pyramid, colour: red }
                answer: cone
                option_audio: false
                hints:
                  - "A cone has a circle at the bottom and a point at the top."
                  - "The pyramid has a square at the bottom. The cylinder has no point."
                  - "It is the shape with a circle at the bottom and a point at the top."
              - id: l1-f3
                type: multiple_choice
                text: "A candle is the same thickness all the way up. It is flat at the top and the bottom. What shape is it?"
                options: ["cylinder", "cone", "cuboid"]
                answer: "cylinder"
                feedback:
                  "cone": "A cone gets thinner and thinner up to a point. The candle is the same thickness all the way up."
                hints:
                  - "Its flat top and bottom are circles."
                  - "It looks like a tin of beans."
                  - "Cylinder."
              - id: l1-f4
                type: true_false
                text: "This pyramid has a square face at the bottom."
                say: "Is it true? This pyramid has a square face at the bottom."
                show: { drawn: shape, kind: pyramid, colour: blue }
                answer: true
                hints:
                  - "Look at the face the pyramid stands on."
                  - "It has four sides the same length and four square corners."
                  - "Yes, it is true."
              - id: l1-f5
                type: multiple_choice
                text: "What is this 3-D shape called?"
                show: { drawn: shape, kind: cone, colour: green }
                options: ["cone", "pyramid", "cylinder"]
                answer: "cone"
                feedback:
                  "pyramid": "A pyramid has a square at the bottom and triangle faces. This shape has a circle at the bottom."
                hints:
                  - "Look at the face at the bottom."
                  - "There is a circle at the bottom and a point at the top."
                  - "Cone."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Match each shape to its name."
                pairs:
                  - { left: { drawn: shape, kind: cylinder, colour: purple }, right: { text: "cylinder" } }
                  - { left: { drawn: shape, kind: cone, colour: purple }, right: { text: "cone" } }
                  - { left: { drawn: shape, kind: pyramid, colour: purple }, right: { text: "pyramid" } }
                hints: ["Look at the face at the bottom, and check for a point."]
              - id: l1-s2
                type: multiple_choice
                text: "What 2-D shape is the flat face at each end of a cylinder?"
                show: { drawn: shape, kind: cylinder, colour: orange }
                options: ["circle", "square", "triangle"]
                answer: "circle"
                hints: ["Picture the top of a tin of beans."]
              - id: l1-s3
                type: true_false
                text: "This is a cone."
                say: "Is it true? This is a cone."
                show: { drawn: shape, kind: cylinder, colour: orange }
                answer: false
                hints: ["Does the shape have a point at the top?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Which one is the pyramid?"
                options:
                  - { drawn: shape, kind: pyramid, colour: green }
                  - { drawn: shape, kind: cube, colour: green }
                  - { drawn: shape, kind: cone, colour: green }
                answer: pyramid
                option_audio: false
                hints: ["A pyramid has triangle faces that meet at a point."]
              - id: l1-s5
                type: multiple_choice
                text: "Which shape has a circle face at the bottom and a point at the top?"
                options: ["cone", "cylinder", "pyramid"]
                answer: "cone"
                hints: ["The pyramid has a square at the bottom."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What is this 3-D shape called?"
                show: { drawn: shape, kind: pyramid, colour: green }
                options: ["pyramid", "cone", "cube"]
                answer: "pyramid"
              - id: l1-n2
                type: multiple_choice
                text: "What shape is a tin of soup?"
                options: ["cylinder", "sphere", "pyramid"]
                answer: "cylinder"
              - id: l1-n3
                type: image_multiple_choice
                text: "Which one is the cylinder?"
                options:
                  - { drawn: shape, kind: cylinder, colour: yellow }
                  - { drawn: shape, kind: cuboid, colour: yellow }
                  - { drawn: shape, kind: sphere, colour: yellow }
                answer: cylinder
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "An ice cream cone is shaped like a cylinder."
                say: "Is it true? An ice cream cone is shaped like a cylinder."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "What 2-D shape are the sloping faces of this pyramid?"
                show: { drawn: shape, kind: pyramid, colour: purple }
                options: ["triangle", "square", "circle"]
                answer: "triangle"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which one is the cone?"
            options:
              - { drawn: shape, kind: cone, colour: blue }
              - { drawn: shape, kind: pyramid, colour: blue }
              - { drawn: shape, kind: cube, colour: blue }
            answer: cone
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "What is this 3-D shape called?"
            show: { drawn: shape, kind: cylinder, colour: red }
            options: ["cylinder", "cone", "cuboid"]
            answer: "cylinder"
          - id: l1-c3
            type: true_false
            text: "A cone has a point at the top."
            say: "Is it true? A cone has a point at the top."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "What shape is a glue stick?"
            options: ["cylinder", "cone", "cube"]
            answer: "cylinder"
          - id: l1-c5
            type: true_false
            text: "This pyramid has a circle face at the bottom."
            say: "Is it true? This pyramid has a circle face at the bottom."
            show: { drawn: shape, kind: pyramid, colour: orange }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Which shape has a square face and four triangle faces?"
            options:
              - { drawn: shape, kind: cube, colour: blue }
              - { drawn: shape, kind: pyramid, colour: blue }
              - { drawn: shape, kind: cone, colour: blue }
            answer: pyramid
            option_audio: false

  - n: 2
    title: { de: "Ecken, Kanten, Flächen", en: "Faces, edges and vertices" }
    goal:
      de: "Zähl die Flächen, Kanten und Ecken von Körpern, wie die 8 Ecken eines Würfels, und finde heraus, welche rollen."
      en: "Count the faces, edges and vertices of solid shapes, like the 8 vertices of a cube, and find which ones roll."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is this 3-D shape called?"
            show: { drawn: shape, kind: cone, colour: yellow }
            options: ["cone", "cylinder", "pyramid"]
            answer: "cone"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What shape is a traffic cone?"
            options: ["cone", "cube", "cylinder"]
            answer: "cone"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Cube: 6 faces, 12 edges, 8 vertices"
            say: "3-D shapes have faces, edges and vertices. The faces are the flat surfaces on the outside. An edge is where two faces meet. A vertex is where edges meet, like a corner. A cube has six faces, twelve edges and eight vertices."
            show: { drawn: shape, kind: cube, colour: red }
          - text: "Pyramid: 5 faces, 8 edges, 5 vertices"
            say: "The pyramid has a square at the bottom and four triangles round the sides. That is five faces. It has four edges round the bottom and four more going up to the point, eight edges. It has four vertices at the bottom and one at the top, five vertices."
            show: { drawn: shape, kind: pyramid, colour: yellow }
          - text: "Cylinder: 2 flat faces, 2 edges, no vertices"
            say: "The cylinder has two flat circle faces and a curved surface. It has two curved edges and no vertices. The curved surface lets it roll. A cone has one flat circle face and one curved edge. A sphere is curved all over, so it has no flat faces, no edges and no vertices."
            show: { drawn: shape, kind: cylinder, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many vertices does a cube have?"
                show: { drawn: shape, kind: cube, colour: green }
                options: ["8", "6", "12"]
                answer: "8"
                feedback:
                  "6": "A cube has 6 faces. Count the vertices: 4 at the top and 4 at the bottom."
                  "12": "A cube has 12 edges. It has fewer vertices than that."
                hints:
                  - "Count the vertices at the top, then at the bottom."
                  - "4 at the top and 4 at the bottom."
                  - "8."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How many faces does the pyramid have?"
                show: { drawn: shape, kind: pyramid, colour: orange }
                options: ["5", "4", "8"]
                answer: "5"
                hints:
                  - "Count the face at the bottom too."
                  - "A square at the bottom and 4 triangles."
                  - "5."
              - id: l2-f3
                type: true_false
                text: "A cylinder has no vertices."
                say: "Is it true? A cylinder has no vertices."
                answer: true
                hints:
                  - "A vertex is a pointy corner where edges meet."
                  - "The edges of a cylinder go round in a circle."
                  - "Yes, it is true."
              - id: l2-f4
                type: sorting
                text: "Can the shape roll?"
                bins:
                  - { id: rolls, show: { text: "can roll" }, say: "Can roll." }
                  - { id: stays, show: { text: "cannot roll" }, say: "Cannot roll." }
                options:
                  - { text: "sphere", bin: rolls }
                  - { text: "cylinder", bin: rolls }
                  - { text: "cone", bin: rolls }
                  - { text: "cube", bin: stays }
                  - { text: "cuboid", bin: stays }
                  - { text: "pyramid", bin: stays }
                hints:
                  - "A shape can roll if it has a curved surface."
                  - "The sphere, the cylinder and the cone have curved surfaces."
                  - "Sphere, cylinder and cone roll. Cube, cuboid and pyramid do not."
              - id: l2-f5
                type: multiple_choice
                text: "How many edges does a pyramid have?"
                options: ["8", "5", "4"]
                answer: "8"
                hints:
                  - "Count the edges round the bottom, then the ones going up to the point."
                  - "4 round the bottom and 4 going up."
                  - "8."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many faces does a cuboid have?"
                show: { drawn: shape, kind: cuboid, colour: purple }
                options: ["6", "8", "4"]
                answer: "6"
                hints: ["Top, bottom, front, back, left, right."]
              - id: l2-s2
                type: multiple_choice
                text: "Which shape has no flat faces?"
                options: ["sphere", "cone", "cylinder"]
                answer: "sphere"
                hints: ["Which shape is curved all over?"]
              - id: l2-s3
                type: true_false
                text: "A cone has one flat face."
                say: "Is it true? A cone has one flat face."
                show: { drawn: shape, kind: cone, colour: red }
                answer: true
                hints: ["Look at the bottom of the cone. The rest is curved."]
              - id: l2-s4
                type: multiple_choice
                text: "Which shape has 5 vertices?"
                options: ["pyramid", "cube", "cylinder"]
                answer: "pyramid"
                hints: ["4 vertices at the bottom and 1 at the top."]
              - id: l2-s5
                type: multiple_choice
                text: "Which two shapes have the same number of faces, edges and vertices?"
                options: ["cube and cuboid", "cube and pyramid", "cone and cylinder"]
                answer: "cube and cuboid"
                hints: ["A cuboid is like a stretched cube."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many edges does a cube have?"
                options: ["12", "8", "6"]
                answer: "12"
              - id: l2-n2
                type: multiple_choice
                text: "How many flat faces does the cylinder have?"
                show: { drawn: shape, kind: cylinder, colour: yellow }
                options: ["2", "0", "3"]
                answer: "2"
              - id: l2-n3
                type: true_false
                text: "A pyramid can roll."
                say: "Is it true? A pyramid can roll."
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "I have 6 faces, 12 edges and 8 vertices. All my faces are squares the same size. What am I?"
                options: ["cube", "cylinder", "pyramid"]
                answer: "cube"
              - id: l2-n5
                type: text_input
                text: "How many vertices do a cube and a pyramid have altogether?"
                answer: "13"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: faces
            type: image_multiple_choice
            text: "Which shape has triangle faces?"
            options:
              - { drawn: shape, kind: pyramid, colour: red }
              - { drawn: shape, kind: cylinder, colour: red }
              - { drawn: shape, kind: cube, colour: red }
            answer: pyramid
            option_audio: false
          - id: l2-c2
            part: count
            type: multiple_choice
            text: "How many vertices does a pyramid have?"
            options: ["5", "4", "8"]
            answer: "5"
          - id: l2-c3
            part: count
            type: true_false
            text: "A cone has 2 edges."
            say: "Is it true? A cone has two edges."
            answer: false
          - id: l2-c4
            part: faces
            type: image_multiple_choice
            text: "Which shape has two circle faces?"
            options:
              - { drawn: shape, kind: cylinder, colour: green }
              - { drawn: shape, kind: cone, colour: green }
              - { drawn: shape, kind: sphere, colour: green }
            answer: cylinder
            option_audio: false
          - id: l2-c5
            part: sort
            type: multiple_choice
            text: "Which shape has 6 faces, but not all of them are squares?"
            options: ["cuboid", "cube", "pyramid"]
            answer: "cuboid"
          - id: l2-c6
            part: name
            type: true_false
            text: "This is a cone."
            say: "Is it true? This is a cone."
            show: { drawn: shape, kind: pyramid, colour: purple }
            answer: false
          - id: l2-c7
            part: name
            type: matching
            text: "Match each shape to a thing with that shape."
            say: "Match each shape to a thing with that shape."
            pairs:
              - { left: { drawn: shape, kind: cylinder, colour: green }, right: { text: "a toilet roll" } }
              - { left: { drawn: shape, kind: cone, colour: green }, right: { text: "a party hat" } }
              - { left: { drawn: shape, kind: sphere, colour: green }, right: { text: "a football" } }
          - id: l2-c8
            part: name
            type: multiple_choice
            text: "What shape is a drinking straw?"
            options: ["cylinder", "cone", "cuboid"]
            answer: "cylinder"
          - id: l2-c9
            part: name
            type: multiple_choice
            text: "Ali's shape has a square face at the bottom and four triangle faces that meet at a point. What shape is it?"
            options: ["pyramid", "cone", "cube"]
            answer: "pyramid"
          - id: l2-c10
            part: faces
            type: multiple_choice
            text: "What 2-D shape is the flat face of a cone?"
            show: { drawn: shape, kind: cone, colour: blue }
            options: ["circle", "triangle", "square"]
            answer: "circle"
          - id: l2-c11
            part: faces
            type: true_false
            text: "All the faces of a pyramid are triangles."
            say: "Is it true? All the faces of a pyramid are triangles."
            show: { drawn: shape, kind: pyramid, colour: green }
            answer: false
          - id: l2-c12
            part: faces
            type: multiple_choice
            text: "What 2-D shape is the bottom face of this pyramid?"
            show: { drawn: shape, kind: pyramid, colour: red }
            options: ["square", "triangle", "circle"]
            answer: "square"
          - id: l2-c13
            part: count
            type: multiple_choice
            text: "How many edges does a cuboid have?"
            show: { drawn: shape, kind: cuboid, colour: orange }
            options: ["12", "6", "8"]
            answer: "12"
          - id: l2-c14
            part: count
            type: text_input
            text: "How many vertices does a cuboid have?"
            show: { drawn: shape, kind: cuboid, colour: blue }
            answer: "8"
          - id: l2-c15
            part: count
            type: multiple_choice
            text: "How many vertices does a sphere have?"
            show: { drawn: shape, kind: sphere, colour: red }
            options: ["0", "1", "2"]
            answer: "0"
          - id: l2-c16
            part: count
            type: true_false
            text: "A cylinder has 2 edges."
            say: "Is it true? A cylinder has two edges."
            show: { drawn: shape, kind: cylinder, colour: orange }
            answer: true
          - id: l2-c17
            part: sort
            type: sorting
            text: "Does the shape have vertices?"
            say: "Does the shape have vertices? Sort the shapes."
            bins:
              - { id: has, show: { text: "has vertices" }, say: "Has vertices." }
              - { id: none, show: { text: "no vertices" }, say: "No vertices." }
            options:
              - { text: "cube", bin: has }
              - { text: "sphere", bin: none }
              - { text: "pyramid", bin: has }
              - { text: "cylinder", bin: none }
              - { text: "cuboid", bin: has }
          - id: l2-c18
            part: sort
            type: multiple_choice
            text: "Which shape can roll and has no edges?"
            options: ["sphere", "cylinder", "cube"]
            answer: "sphere"
          - id: l2-c19
            part: sort
            type: multiple_choice
            text: "Which shape has a curved surface and only one flat face?"
            options: ["cone", "cylinder", "pyramid"]
            answer: "cone"
          - id: l2-c20
            part: sort
            type: true_false
            text: "A cube, a cuboid and a pyramid have only flat faces."
            say: "Is it true? A cube, a cuboid and a pyramid have only flat faces."
            answer: true
