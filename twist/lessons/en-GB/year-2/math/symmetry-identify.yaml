# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.symmetry-identify
skill: math.symmetry.identify
curriculum: en-GB
language: en
title:
  de: Symmetrie erkennen
  en: Finding lines of symmetry
summary: >
  Lesson 1 folds in the mind: a shape has a line of symmetry when both
  halves match exactly along the fold (a butterfly, the letters A and T,
  a pattern on squared paper with a dashed mirror line); lesson 2 says
  which way the line goes (vertical, straight up and down, as Year 2
  asks; and horizontal, straight across, for letters such as B and E),
  picks the dashed line that really is a mirror line, finds letters with
  no line of symmetry, and ends with the skill check. Drawing the line or
  the other half waits for a drawing task, and the grid can only draw a
  vertical mirror line.
metadata:
  year: year-2
  topic: { de: Symmetrie, en: Symmetry }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.shapes.basic-shapes]
  also_practises: [math.shapes.basic-shapes]
  vocabulary: { en: [line of symmetry, symmetrical, fold, half, match, mirror, mirror line, vertical, horizontal] }
  forms: [picture, text, audio, drawn]
  drawn: [letter-card, shape, grid]
  facets: []
  parts:
    - { id: is-symmetric, what: { de: "prüfen, ob eine Figur eine Symmetrieachse hat", en: telling whether a shape has a line of symmetry } }
    - { id: find, what: { de: "unter mehreren Figuren die symmetrische oder die nicht symmetrische finden", en: picking out the shape with or without a line of symmetry } }
    - { id: axis, what: { de: "sagen, wie die Symmetrieachse verläuft", en: saying which way the line of symmetry goes } }
    - { id: mirror-line, what: { de: "prüfen, ob eine gestrichelte Linie eine Symmetrieachse ist", en: checking whether a dashed line is a mirror line } }
  misconceptions:
    - id: looks-alike-is-symmetric
      what: Calls a shape symmetrical because both sides look alike, without checking that the halves match exactly when folded
      addressed: lesson 1 Learn folds the letter F and the halves do not match; l1-f3 (with feedback), l1-s3, l1-n3 and l2-s5 ask about letters whose halves look alike but do not match; l1-s4, l1-c3, l2-n5 and l2-c5 show grid patterns that nearly match
    - id: only-vertical-line
      what: Thinks a line of symmetry always goes straight up and down
      addressed: lesson 2 Learn shows B with a horizontal line; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c4 ask about the letters E, B, D and C
    - id: any-line-is-a-mirror-line
      what: Thinks any line through a shape is a line of symmetry
      addressed: l2-f5 (with feedback), l2-s3 and l2-n3 ask which of three dashed lines is a mirror line
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Passt es beim Falten?", en: "Do the halves match?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is this shape called?"
            say: "What is this shape called?"
            show: { drawn: shape, kind: triangle, colour: blue }
            options: ["triangle", "square", "rectangle"]
            answer: "triangle"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many corners does a square have?"
            say: "How many corners does a square have?"
            options: ["4", "3", "5"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "a line of symmetry"
            say: "A butterfly has two wings that are the same. Fold the picture down the middle and both halves match exactly. The fold is a line of symmetry. The butterfly is symmetrical."
            show: { object: butterfly }
          - text: "A"
            say: "The letter A is symmetrical too. Fold it down the middle, from top to bottom. The left half fits exactly on the right half."
            show: { drawn: letter-card, text: "A" }
          - text: "F"
            say: "The letter F has no line of symmetry. Fold it down the middle and its arms all point one way. The halves do not match."
            show: { drawn: letter-card, text: "F" }
          - text: "The dashed line is a mirror line."
            say: "On squared paper, the red dashed line is a mirror line. Every coloured square has a partner of the same colour, the same distance away on the other side. So the pattern is symmetrical."
            show: { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[2, 0, blue], [3, 0, blue], [1, 1, red], [4, 1, red], [2, 2, green], [3, 2, green]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Is it true? T has a line of symmetry."
                say: "Fold the T in your head, down the middle. Is it true? T has a line of symmetry."
                show: { drawn: letter-card, text: "T" }
                answer: true
                hints:
                  - "Fold it from top to bottom, through the middle."
                  - "The bar at the top is the same length on the left and on the right."
                  - "Yes. T has a line of symmetry."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which letter has a line of symmetry?"
                say: "Which letter has a line of symmetry?"
                options: ["M", "L", "J"]
                answer: "M"
                option_audio: false
                hints:
                  - "Fold each letter down the middle in your head."
                  - "L and J each have a part that points only one way."
                  - "M."
              - id: l1-f3
                type: true_false
                text: "Is it true? R has a line of symmetry."
                say: "Fold the R in your head, down the middle. Is it true? R has a line of symmetry."
                show: { drawn: letter-card, text: "R" }
                answer: false
                feedback:
                  "true": "The loop and the leg of the R point only to the right. There is nothing on the left to match them."
                hints:
                  - "Look at which way the loop points."
                  - "On the left there is only a straight line."
                  - "No. R has no line of symmetry."
              - id: l1-f4
                type: true_false
                text: "Is it true? The dashed line is a line of symmetry."
                say: "Look at the red dashed line. Is it true? It is a line of symmetry for this pattern."
                show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[1, 0, red], [4, 0, red], [2, 1, blue], [3, 1, blue]] }
                answer: true
                hints:
                  - "Check each coloured square. Does it have a partner on the other side?"
                  - "Each red square has one empty square between it and the line. The blue squares touch the line on both sides."
                  - "Yes. Every square has a partner."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which picture has a line of symmetry?"
                say: "Which picture has a line of symmetry?"
                options:
                  - { object: star }
                  - { object: snail }
                  - { object: shoe }
                answer: star
                hints:
                  - "Fold each picture down the middle in your head."
                  - "The snail and the shoe face one way."
                  - "The star."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Is it true? H has a line of symmetry."
                say: "Fold the H in your head, down the middle. Is it true? H has a line of symmetry."
                show: { drawn: letter-card, text: "H" }
                answer: true
                hints: ["There is one straight line on the left and one on the right."]
              - id: l1-s2
                type: multiple_choice
                text: "Which letter has a line of symmetry?"
                say: "Which letter has a line of symmetry?"
                options: ["U", "G", "F"]
                answer: "U"
                option_audio: false
                hints: ["Fold each letter from top to bottom, through the middle."]
              - id: l1-s3
                type: true_false
                text: "Is it true? S has a line of symmetry."
                say: "Fold the S in your head, from top to bottom. Is it true? S has a line of symmetry."
                show: { drawn: letter-card, text: "S" }
                answer: false
                hints: ["The top curve points one way and the bottom curve points the other way."]
              - id: l1-s4
                type: true_false
                text: "Is it true? The dashed line is a line of symmetry."
                say: "Look at the red dashed line. Is it true? It is a line of symmetry for this pattern."
                show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[1, 0, red], [3, 0, red], [2, 1, blue], [3, 1, blue]] }
                answer: false
                hints: ["Check the red squares. Is each one the same distance from the line as its partner?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which picture has a line of symmetry?"
                say: "Which picture has a line of symmetry?"
                options:
                  - { object: glasses }
                  - { object: foot }
                  - { object: snail }
                answer: glasses
                hints: ["Which picture has two halves that match?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Is it true? O has a line of symmetry."
                say: "Is it true? O has a line of symmetry."
                show: { drawn: letter-card, text: "O" }
                answer: true
              - id: l1-n2
                type: multiple_choice
                text: "Which letter has a line of symmetry?"
                say: "Which letter has a line of symmetry?"
                options: ["V", "P", "N"]
                answer: "V"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Is it true? N has a line of symmetry."
                say: "Fold the N in your head, from top to bottom. Is it true? N has a line of symmetry."
                show: { drawn: letter-card, text: "N" }
                answer: false
              - id: l1-n4
                type: true_false
                text: "Is it true? The dashed line is a line of symmetry."
                say: "Look at the red dashed line. Is it true? It is a line of symmetry for this pattern."
                show: { drawn: grid, cols: 8, rows: 3, axis: 4, cells: [[3, 0, green], [4, 0, green], [2, 1, green], [5, 1, green], [1, 2, yellow], [6, 2, yellow]] }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "Which picture has a line of symmetry?"
                say: "Which picture has a line of symmetry?"
                options:
                  - { object: ladder }
                  - { object: shoe }
                  - { object: snail }
                answer: ladder

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Is it true? W has a line of symmetry."
            say: "Is it true? W has a line of symmetry."
            show: { drawn: letter-card, text: "W" }
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "Which letter has no line of symmetry?"
            say: "Which letter has no line of symmetry?"
            options: ["L", "A", "T"]
            answer: "L"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? The dashed line is a line of symmetry."
            say: "Look at the red dashed line. Is it true? It is a line of symmetry for this pattern."
            show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[0, 0, blue], [5, 0, blue], [1, 1, blue], [3, 1, blue]] }
            answer: false
          - id: l1-c4
            type: true_false
            text: "Is it true? This square has a line of symmetry."
            say: "Is it true? This square has a line of symmetry."
            show: { drawn: shape, kind: square, colour: green }
            answer: true
          - id: l1-c5
            type: image_multiple_choice
            text: "Which picture has a line of symmetry?"
            say: "Which picture has a line of symmetry?"
            options:
              - { object: heart }
              - { object: horse }
              - { object: kettle }
            answer: heart
          - id: l1-c6
            type: true_false
            text: "Is it true? The dashed line is a line of symmetry."
            say: "Look at the red dashed line. Is it true? It is a line of symmetry for this pattern."
            show: { drawn: grid, cols: 4, rows: 3, axis: 2, cells: [[0, 0, red], [3, 0, red], [1, 1, blue], [2, 1, blue], [0, 2, yellow], [2, 2, yellow]] }
            answer: false

  - n: 2
    title: { de: "Wo ist die Symmetrieachse?", en: "Where is the line of symmetry?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Is it true? A has a line of symmetry."
            say: "Is it true? A has a line of symmetry."
            show: { drawn: letter-card, text: "A" }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which letter has a line of symmetry, T or F?"
            say: "Which letter has a line of symmetry, T or F?"
            options: ["T", "F"]
            answer: "T"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A: vertical, straight up and down"
            say: "The line you fold along is the line of symmetry. On the A it goes straight up and down, through the middle. We call that a vertical line. Stand a mirror on the line and you see the whole A."
            show: { drawn: letter-card, text: "A" }
          - text: "B: horizontal, straight across"
            say: "On the B the line goes straight across the middle, from left to right. We call that a horizontal line. The top loop folds onto the bottom loop."
            show: { drawn: letter-card, text: "B" }
          - text: "Not every line is a line of symmetry."
            say: "A line only counts when the halves match exactly. Here the red dashed line is in the middle of the pattern, so each square has a partner. A line nearer the edge would not work."
            show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[1, 0, purple], [2, 0, purple], [3, 0, purple], [4, 0, purple], [2, 1, orange], [3, 1, orange]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which way does the line of symmetry go on M?"
                say: "Which way does the line of symmetry go on the M?"
                show: { drawn: letter-card, text: "M" }
                options: ["vertical, straight up and down", "horizontal, straight across", "there is none"]
                answer: "vertical, straight up and down"
                keep_order: true
                hints:
                  - "Which halves match: left and right, or top and bottom?"
                  - "The left half matches the right half."
                  - "Vertical, straight up and down."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which way does the line of symmetry go on E?"
                say: "Which way does the line of symmetry go on the E?"
                show: { drawn: letter-card, text: "E" }
                options: ["vertical, straight up and down", "horizontal, straight across", "there is none"]
                answer: "horizontal, straight across"
                keep_order: true
                feedback:
                  "vertical, straight up and down": "The E has one straight line on the left and three arms on the right. Left and right do not match. Top and bottom do."
                  "there is none": "Fold it straight across the middle. The top arm folds onto the bottom arm."
                hints:
                  - "Do the top and the bottom match?"
                  - "The top arm folds onto the bottom arm."
                  - "Horizontal, straight across."
              - id: l2-f3
                type: true_false
                text: "Is it true? A mirror on the line of symmetry of H shows the whole H."
                say: "Is it true? If you stand a mirror on the line of symmetry of the H, you see the whole H."
                show: { drawn: letter-card, text: "H" }
                answer: true
                hints:
                  - "The mirror shows the other half."
                  - "Both halves of the H are the same."
                  - "Yes, that is true."
              - id: l2-f4
                type: multiple_choice
                text: "Which letter has no line of symmetry?"
                say: "Which letter has no line of symmetry?"
                options: ["G", "A", "E"]
                answer: "G"
                option_audio: false
                hints:
                  - "Try folding each one up and down, then across."
                  - "A folds up and down. E folds across."
                  - "G."
              - id: l2-f5
                type: image_multiple_choice
                text: "Which dashed line is a line of symmetry?"
                say: "The pattern is the same in all three pictures. In which picture is the red dashed line a line of symmetry?"
                options:
                  - { drawn: grid, cols: 4, rows: 2, axis: 1, cells: [[1, 0, red], [2, 0, red], [0, 1, blue], [3, 1, blue]], key: line-1 }
                  - { drawn: grid, cols: 4, rows: 2, axis: 2, cells: [[1, 0, red], [2, 0, red], [0, 1, blue], [3, 1, blue]], key: line-2 }
                  - { drawn: grid, cols: 4, rows: 2, axis: 3, cells: [[1, 0, red], [2, 0, red], [0, 1, blue], [3, 1, blue]], key: line-3 }
                answer: line-2
                feedback:
                  line-1: "This line is too far to the left. The blue square on the right has no partner on the left."
                  line-3: "This line is too far to the right. The blue square on the left has no partner on the right."
                hints:
                  - "A mirror line has the same squares on both sides."
                  - "Look for the line with two columns on each side."
                  - "The line in the middle."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which way does the line of symmetry go on V?"
                say: "Which way does the line of symmetry go on the V?"
                show: { drawn: letter-card, text: "V" }
                options: ["vertical, straight up and down", "horizontal, straight across", "there is none"]
                answer: "vertical, straight up and down"
                keep_order: true
                hints: ["Do the left and the right match?"]
              - id: l2-s2
                type: multiple_choice
                text: "Which way does the line of symmetry go on B?"
                say: "Which way does the line of symmetry go on the B?"
                show: { drawn: letter-card, text: "B" }
                options: ["vertical, straight up and down", "horizontal, straight across", "there is none"]
                answer: "horizontal, straight across"
                keep_order: true
                hints: ["The top loop folds onto the bottom loop."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which dashed line is a line of symmetry?"
                say: "In which picture is the red dashed line a line of symmetry?"
                options:
                  - { drawn: grid, cols: 6, rows: 2, axis: 2, cells: [[1, 0, orange], [2, 0, orange], [3, 0, orange], [4, 0, orange], [2, 1, green], [3, 1, green]], key: line-2 }
                  - { drawn: grid, cols: 6, rows: 2, axis: 4, cells: [[1, 0, orange], [2, 0, orange], [3, 0, orange], [4, 0, orange], [2, 1, green], [3, 1, green]], key: line-4 }
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[1, 0, orange], [2, 0, orange], [3, 0, orange], [4, 0, orange], [2, 1, green], [3, 1, green]], key: line-3 }
                answer: line-3
                hints: ["Count the coloured squares on each side of the line in every row."]
              - id: l2-s4
                type: multiple_choice
                text: "Which letter has no line of symmetry?"
                say: "Which letter has no line of symmetry?"
                options: ["P", "T", "B"]
                answer: "P"
                option_audio: false
                hints: ["Fold each one up and down, then across."]
              - id: l2-s5
                type: true_false
                text: "Is it true? J has a line of symmetry."
                say: "Is it true? J has a line of symmetry."
                show: { drawn: letter-card, text: "J" }
                answer: false
                hints: ["The hook at the bottom points only one way."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which way does the line of symmetry go on U?"
                say: "Which way does the line of symmetry go on the U?"
                show: { drawn: letter-card, text: "U" }
                options: ["vertical, straight up and down", "horizontal, straight across", "there is none"]
                answer: "vertical, straight up and down"
                keep_order: true
              - id: l2-n2
                type: multiple_choice
                text: "Which way does the line of symmetry go on D?"
                say: "Which way does the line of symmetry go on the D?"
                show: { drawn: letter-card, text: "D" }
                options: ["vertical, straight up and down", "horizontal, straight across", "there is none"]
                answer: "horizontal, straight across"
                keep_order: true
              - id: l2-n3
                type: image_multiple_choice
                text: "Which dashed line is a line of symmetry?"
                say: "In which picture is the red dashed line a line of symmetry?"
                options:
                  - { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[0, 0, blue], [1, 0, blue], [4, 0, blue], [5, 0, blue], [1, 1, red], [4, 1, red], [2, 2, yellow], [3, 2, yellow]], key: line-3 }
                  - { drawn: grid, cols: 6, rows: 3, axis: 2, cells: [[0, 0, blue], [1, 0, blue], [4, 0, blue], [5, 0, blue], [1, 1, red], [4, 1, red], [2, 2, yellow], [3, 2, yellow]], key: line-2 }
                  - { drawn: grid, cols: 6, rows: 3, axis: 1, cells: [[0, 0, blue], [1, 0, blue], [4, 0, blue], [5, 0, blue], [1, 1, red], [4, 1, red], [2, 2, yellow], [3, 2, yellow]], key: line-1 }
                answer: line-3
              - id: l2-n4
                type: multiple_choice
                text: "Which letter has no line of symmetry?"
                say: "Which letter has no line of symmetry?"
                options: ["F", "H", "D"]
                answer: "F"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? The dashed line is a line of symmetry."
                say: "Kemi colours a pattern. Look at the red dashed line. Is it true? It is a line of symmetry for her pattern."
                show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[2, 0, red], [3, 0, blue], [1, 1, green], [4, 1, green]] }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: is-symmetric
            type: true_false
            text: "Is it true? X has a line of symmetry."
            say: "Is it true? X has a line of symmetry."
            show: { drawn: letter-card, text: "X" }
