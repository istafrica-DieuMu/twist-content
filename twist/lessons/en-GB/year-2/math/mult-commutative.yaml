# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.mult-commutative
skill: math.mult-div.commutative
curriculum: en-GB
language: en
title:
  de: Tauschaufgaben beim Malnehmen
  en: Multiplying in either order
summary: >
  An array turned round shows that multiplication can be done in either
  order: 3 × 7 and 7 × 3 have the same answer. Lesson 1 reads one array
  both ways; lesson 2 uses the swap to turn a hard fact into an easy one
  (9 × 2 from 2 × 9), shows that subtraction and division cannot be
  swapped, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Malaufgaben, en: Multiplication }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.arrays]
  also_practises: [math.mult-div.arrays]
  vocabulary: { en: [array, row, column, turn round, either order, the same answer, times] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: array, what: { de: die Tauschaufgabe am Punktefeld zeigen, en: showing both orders with an array } }
    - { id: swap, what: { de: die Tauschaufgabe nennen, en: writing a multiplication the other way round } }
    - { id: same, what: { de: "wissen, dass Malnehmen, aber nicht Minus oder Geteilt, getauscht werden kann", en: "knowing that multiplying, but not subtracting or dividing, works in either order" } }
    - { id: use, what: { de: mit der Tauschaufgabe leichter rechnen, en: using the easier order to work out a fact } }
  misconceptions:
    - id: swap-changes-answer
      what: Thinks 3 × 7 and 7 × 3 have different answers because the array looks different
      addressed: lesson 1 Learn turns a 3 by 7 array round; l1-f2 (with feedback), l1-s4 and l1-c3 ask whether the swapped fact has the same answer
    - id: swap-everything
      what: Swaps the numbers in a subtraction or division too (8 − 3 = 3 − 8)
      addressed: lesson 2 Learn says only adding and multiplying can be swapped; l2-f5 (with feedback), l2-s5 and l2-c5 ask about a swapped subtraction or division
    - id: swap-adds
      what: Picks an addition as the swapped fact (3 × 7 turns into 3 + 7)
      addressed: l1-f3 (with feedback), l1-n2 and l2-c2 offer an addition as the swap
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das Punktefeld drehen, en: Turn the array round }
    goal:
      de: "Dreh ein Punktefeld um und sieh, dass 3 mal 7 dasselbe ist wie 7 mal 3."
      en: "Turn an array round and see that 3 times 7 is the same as 7 times 3."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which multiplication matches?"
            say: "Which multiplication matches the array?"
            show: { drawn: dots, array: [2, 5] }
            options: ["2 × 5", "2 + 5", "5 × 5"]
            answer: "2 × 5"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "How many dots?"
            say: "Three rows of four. How many dots are there?"
            show: { drawn: dots, array: [3, 4] }
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 × 7 or 7 × 3: which has more dots?"
            say: "Three rows of seven, or seven rows of three. Which do you think has more dots? Have a guess."
            show: { drawn: dots, array: [3, 7] }
          - text: "3 × 7 = 21"
            say: "Let's see. Three rows of seven. Three times seven is twenty-one."
            show: { drawn: dots, array: [3, 7] }
          - text: "7 × 3 = 21"
            say: "Now we turn the array round. Seven rows of three. It is the same dots, so it is still twenty-one."
            show: { drawn: dots, array: [7, 3] }
          - text: "3 × 7 = 7 × 3"
            say: "You can multiply in either order. Three times seven is the same as seven times three. Neither has more!"
          - text: "Did you know? A dragonfly has 4 wings. 2 dragonflies have 2 × 4 = 8 wings, and 4 × 2 = 8 too."
            say: "Did you know? A dragonfly has four wings, two on each side. Two dragonflies have two times four wings: eight. And four times two is eight too!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Read the array both ways."
                say: "Read the array both ways. Fill the gaps."
                show: { drawn: dots, array: [2, 4] }
                frame: "2 × 4 = _ · 4 × 2 = _"
                options: ["8", "6", "16"]
                answer: ["8", "8"]
                hints:
                  - "Rows first, then columns."
                  - "Two rows of four, or four columns of two. Same dots."
                  - "8 and 8."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Is it true? 5 × 3 = 3 × 5"
                say: "Five times three is the same as three times five. Is that true?"
                show: { drawn: dots, array: [5, 3] }
                answer: true
                feedback:
                  "false": "Turn the array round: five rows of three become three rows of five. Same dots, same answer."
                hints:
                  - "Turning the array round does not change the number of dots."
                  - "Five times three is fifteen. Three times five is fifteen."
                  - "Yes."
              - id: l1-f3
                type: multiple_choice
                text: "What is 4 × 6 the other way round?"
                say: "Which multiplication is four times six the other way round?"
                options: ["6 × 4", "4 + 6", "4 × 4"]
                answer: "6 × 4"
                feedback:
                  "4 + 6": "That is an addition. The other way round is still a multiplication, with the numbers swapped."
                hints:
                  - "Swap the two numbers and keep the times sign."
                  - "Four times six becomes six times ..."
                  - "6 × 4."
              - id: l1-f4
                type: image_multiple_choice
                text: "Which array shows 4 × 2 turned round?"
                say: "Which array shows four rows of two, turned round?"
                options:
                  - { drawn: dots, array: [2, 4] }
                  - { drawn: dots, array: [4, 4] }
                  - { drawn: dots, array: [2, 2] }
                answer: "2x4"
                hints:
                  - "Turned round, the rows become columns."
                  - "Four rows of two become two rows of four."
                  - "The array with two rows of four."
              - id: l1-f5
                type: text_input
                text: "2 × 9 = 18, so 9 × 2 = _"
                say: "Two times nine is eighteen. So what is nine times two?"
                answer: "18"
                hints:
                  - "The numbers are swapped."
                  - "Swapping does not change the answer."
                  - "18."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Read the array both ways."
                say: "Read the array both ways. Fill the gaps."
                show: { drawn: dots, array: [3, 5] }
                frame: "3 × 5 = _ · 5 × 3 = _"
                options: ["15", "8", "12"]
                answer: ["15", "15"]
                hints: ["Same dots, same answer."]
              - id: l1-s2
                type: multiple_choice
                text: "What is 7 × 2 the other way round?"
                say: "Which multiplication is seven times two the other way round?"
                options: ["2 × 7", "7 + 2", "7 × 7"]
                answer: "2 × 7"
                hints: ["Swap the numbers, keep the times sign."]
              - id: l1-s3
                type: text_input
                text: "10 × 4 = 40, so 4 × 10 = _"
                say: "Ten times four is forty. So what is four times ten?"
                answer: "40"
                hints: ["Swapping does not change the answer."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 6 × 2 is more than 2 × 6."
                say: "Six times two is more than two times six. Is that true?"
                answer: false
                hints: ["Turn the array round. Is it the same dots?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which array shows 3 × 5 turned round?"
                say: "Which array shows three rows of five, turned round?"
                options:
                  - { drawn: dots, array: [5, 3] }
                  - { drawn: dots, array: [3, 3] }
                  - { drawn: dots, array: [5, 5] }
                answer: "5x3"
                hints: ["Three rows of five become five rows of three."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "5 × 4 = 20, so 4 × 5 = _"
                say: "Five times four is twenty. So what is four times five?"
                answer: "20"
              - id: l1-n2
                type: multiple_choice
                text: "What is 3 × 8 the other way round?"
                say: "Which multiplication is three times eight the other way round?"
                options: ["8 × 3", "3 + 8", "8 × 8"]
                answer: "8 × 3"
              - id: l1-n3
                type: true_false
                text: "Is it true? 2 × 10 = 10 × 2"
                say: "Two times ten is the same as ten times two. Is that true?"
                answer: true
              - id: l1-n4
                type: fill_in_blank
                text: "Read the array both ways."
                say: "Read the array both ways. Fill the gaps."
                show: { drawn: dots, array: [2, 6] }
                frame: "2 × 6 = _ · 6 × 2 = _"
                options: ["12", "8", "14"]
                answer: ["12", "12"]
              - id: l1-n5
                type: fill_in_blank
                text: "Fill the gap."
                say: "Five times seven is the same as seven times what?"
                frame: "5 × 7 = 7 × _"
                options: ["5", "7", "35"]
                answer: ["5"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "2 × 7 = 14, so 7 × 2 = _"
            say: "Two times seven is fourteen. So what is seven times two?"
            answer: "14"
          - id: l1-c2
            type: multiple_choice
            text: "What is 5 × 6 the other way round?"
            say: "Which multiplication is five times six the other way round?"
            options: ["6 × 5", "5 + 6", "6 × 6"]
            answer: "6 × 5"
          - id: l1-c3
            type: true_false
            text: "Is it true? 4 × 3 = 3 × 4"
            say: "Four times three is the same as three times four. Is that true?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Read the array both ways."
            say: "Read the array both ways. Fill the gaps."
            show: { drawn: dots, array: [2, 3] }
            frame: "2 × 3 = _ · 3 × 2 = _"
            options: ["6", "5", "9"]
            answer: ["6", "6"]
          - id: l1-c5
            type: image_multiple_choice
            text: "Which array shows 2 × 6 turned round?"
            say: "Which array shows two rows of six, turned round?"
            options:
              - { drawn: dots, array: [2, 2] }
              - { drawn: dots, array: [6, 2] }
              - { drawn: dots, array: [6, 6] }
            answer: "6x2"
          - id: l1-c6
            type: true_false
            text: "Is it true? 10 × 3 and 3 × 10 have different answers."
            say: "Ten times three and three times ten have different answers. Is that true?"
            answer: false

  - n: 2
    title: { de: Die leichtere Aufgabe nehmen, en: Use the easier way round }
    goal:
      de: "Tausch eine schwere Malaufgabe gegen eine leichte, so wie 9 mal 2 ist dasselbe wie das Doppelte von 9."
      en: "Swap a hard times fact for an easy one, like 9 times 2 is the same as double 9."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "3 × 10 = 30, so 10 × 3 = _"
            say: "Three times ten is thirty. So what is ten times three?"
            answer: "30"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is 2 × 8 the other way round?"
            say: "Which multiplication is two times eight the other way round?"
            options: ["8 × 2", "2 + 8", "2 × 2"]
            answer: "8 × 2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "9 × 2. Is there an easier way than counting nine twos?"
            say: "Nine times two. Do you think there is an easier way than counting nine twos? Have a guess."
          - text: "9 × 2 = 2 × 9"
            say: "Yes, there is! Nine times two means nine twos. That is a lot to count. Swap it: two times nine is double nine. Eighteen."
          - text: "10 × 7 = 7 × 10 = 70"
            say: "Ten times seven means ten sevens. Swap it: seven times ten is seven tens. Seventy."
          - text: "8 − 3 = 5, but 3 − 8 is not 5"
            say: "You can swap the numbers when you add or multiply. You cannot swap them when you subtract or divide. Eight take away three is five, but three take away eight is not five."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is easier to work out for 8 × 2?"
                say: "Eight times two. Which way round is easier?"
                options: ["2 × 8: double 8", "8 + 2", "8 × 8"]
                answer: "2 × 8: double 8"
                hints:
                  - "Swap the numbers to get two times something."
                  - "Two times a number is double the number."
                  - "2 × 8: double 8."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "6 × 10 = _"
                say: "Six times ten. Swap it to ten times six if that helps."
                answer: "60"
                hints:
                  - "Ten times six is six tens."
                  - "Six tens: sixty."
                  - "60."
              - id: l2-f3
                type: text_input
                text: "9 × 5 = _"
                say: "Nine times five. You know the five times table."
                answer: "45"
                hints:
                  - "Swap it: five times nine."
                  - "Five nines are half of ten nines. Ten nines are ninety."
                  - "45."
              - id: l2-f4
                type: fill_in_blank
                text: "Swap it, then work it out."
                say: "Seven times two. Swap it, then work it out."
                frame: "7 × 2 = 2 × _ = _"
                options: ["7", "2", "14", "9"]
                answer: ["7", "14"]
                hints:
                  - "Swap the two numbers."
                  - "Two times seven is double seven."
                  - "7 and 14."
              - id: l2-f5
                type: true_false
                text: "Is it true? 10 − 4 = 4 − 10"
                say: "Ten take away four is the same as four take away ten. Is that true?"
                answer: false
                feedback:
                  "true": "Only adding and multiplying can be swapped. Ten take away four is six; four take away ten is not six."
                hints:
                  - "Can you swap the numbers in a subtraction?"
                  - "Ten take away four is six. Can you take ten from four and get six?"
                  - "No."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "8 × 10 = _"
                say: "Eight times ten."
                answer: "80"
                hints: ["Swap it: ten times eight is eight tens."]
              - id: l2-s2
                type: text_input
                text: "6 × 2 = _"
                say: "Six times two."
                answer: "12"
                hints: ["Swap it: two times six is double six."]
              - id: l2-s3
                type: fill_in_blank
                text: "Swap it, then work it out."
                say: "Four times five. Swap it, then work it out."
                frame: "4 × 5 = 5 × _ = _"
                options: ["4", "5", "20", "9"]
                answer: ["4", "20"]
                hints: ["Five times four: five, ten, fifteen, twenty."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 7 × 5 = 5 × 7"
                say: "Seven times five is the same as five times seven. Is that true?"
                answer: true
                hints: ["Multiplying can be done in either order."]
              - id: l2-s5
                type: multiple_choice
                text: "Which one can you swap?"
                say: "In which calculation can you swap the numbers and keep the same answer?"
                options: ["3 × 6", "6 − 3", "6 ÷ 3"]
                answer: "3 × 6"
                hints: ["Only adding and multiplying can be swapped."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "There are 9 cars with 2 people in each. How many people?"
                say: "There are nine cars with two people in each car. How many people are there?"
                show: { object: car }
                answer: "18"
              - id: l2-n2
                type: true_false
                text: "Ava has 3 bags of 5 apples. Ben has 5 bags of 3 apples. Do they have the same number?"
                say: "Ava has three bags of five apples. Ben has five bags of three apples. Do they have the same number of apples?"
                show: { object: apple }
                answer: true
              - id: l2-n3
                type: text_input
                text: "There are 7 boxes with 10 pens in each. How many pens?"
                say: "There are seven boxes with ten pens in each box. How many pens?"
                answer: "70"
              - id: l2-n4
                type: multiple_choice
                text: "6 children each have 5 stickers. How many stickers?"
                say: "Six children each have five stickers. How many stickers are there altogether?"
                show: { object: sticker }
                options: ["30", "11", "60", "Enough to cover the teacher"]
                answer: "30"
                feedback:
                  "Enough to cover the teacher": "That would be funny! But count them: six children with five each, six times five."
              - id: l2-n5
                type: text_input
                text: "There are 8 rows with 5 chairs in each. How many chairs?"
                say: "There are eight rows with five chairs in each row. How many chairs?"
                answer: "40"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: array
            type: fill_in_blank
            text: "Read the array both ways."
            say: "Read the array both ways. Fill the gaps."
            show: { drawn: dots, array: [4, 5] }
            frame: "4 × 5 = _ · 5 × 4 = _"
            options: ["20", "9", "25"]
            answer: ["20", "20"]
          - id: l2-c2
            part: swap
            type: multiple_choice
            text: "What is 9 × 4 the other way round?"
            say: "Which multiplication is nine times four the other way round?"
            options: ["4 × 9", "9 + 4", "9 × 9"]
            answer: "4 × 9"
          - id: l2-c3
            part: use
            type: text_input
            text: "9 × 10 = _"
            say: "Nine times ten."
            answer: "90"
          - id: l2-c4
            part: array
            type: image_multiple_choice
            text: "Which array shows 2 × 5 turned round?"
            say: "Which array shows two rows of five, turned round?"
            options:
              - { drawn: dots, array: [5, 2] }
              - { drawn: dots, array: [2, 2] }
              - { drawn: dots, array: [5, 5] }
            answer: "5x2"
          - id: l2-c5
            part: same
            type: true_false
            text: "Is it true? 12 ÷ 2 = 2 ÷ 12"
            say: "Twelve divided by two is the same as two divided by twelve. Is that true?"
            answer: false
          - id: l2-c6
            part: array
            type: multiple_choice
            text: "Which two multiplications match the array?"
            say: "Which two multiplications match the array?"
            show: { drawn: dots, array: [2, 7] }
            options: ["2 × 7 and 7 × 2", "2 × 7 and 2 + 7", "7 × 7 and 2 × 2"]
            answer: "2 × 7 and 7 × 2"
          - id: l2-c7
            part: array
            type: true_false
            text: "Is it true? This array shows 3 × 6 and 6 × 3."
            say: "This array shows three times six and six times three. Is that true?"
            show: { drawn: dots, array: [3, 6] }
            answer: true
          - id: l2-c8
            part: array
            type: fill_in_blank
            text: "Read the array both ways."
            say: "Read the array both ways. Fill the gaps."
            show: { drawn: dots, array: [5, 2] }
            frame: "5 × 2 = _ · 2 × 5 = _"
            options: ["10", "7", "25"]
            answer: ["10", "10"]
          - id: l2-c9
            part: swap
            type: multiple_choice
            text: "What is 6 × 3 the other way round?"
            say: "Which multiplication is six times three the other way round?"
            options: ["3 × 6", "6 + 3", "6 × 6"]
            answer: "3 × 6"
          - id: l2-c10
            part: swap
            type: fill_in_blank
            text: "Fill the gap."
            say: "What times nine is the same as nine times three?"
            frame: "_ × 9 = 9 × 3"
            options: ["3", "9", "27"]
            answer: ["3"]
          - id: l2-c11
            part: swap
            type: true_false
            text: "Is it true? 8 × 5 the other way round is 5 + 8."
            say: "Eight times five the other way round is five add eight. Is that true?"
            answer: false
          - id: l2-c12
            part: swap
            type: multiple_choice
            text: "Which pair is one multiplication turned round?"
            say: "Which pair is one multiplication turned round?"
            options: ["3 × 9 and 9 × 3", "3 × 9 and 3 × 3", "3 × 9 and 9 + 3"]
            answer: "3 × 9 and 9 × 3"
          - id: l2-c13
            part: same
            type: text_input
            text: "7 × 5 = 35, so 5 × 7 = _"
            say: "Seven times five is thirty-five. So what is five times seven?"
            answer: "35"
          - id: l2-c14
            part: same
            type: true_false
            text: "Is it true? In a subtraction you can swap the numbers and get the same answer."
            say: "In a subtraction you can swap the numbers and get the same answer. Is that true?"
            answer: false
          - id: l2-c15
            part: same
            type: multiple_choice
            text: "Which one can you not swap?"
            say: "In which calculation can you not swap the numbers and keep the same answer?"
            options: ["10 ÷ 5", "5 × 10", "5 + 10"]
            answer: "10 ÷ 5"
          - id: l2-c16
            part: same
            type: true_false
            text: "Is it true? 3 + 4 = 4 + 3"
            say: "Three add four is the same as four add three. Is that true?"
            answer: true
          - id: l2-c17
            part: use
            type: text_input
            text: "8 × 5 = _"
            say: "Eight times five."
            answer: "40"
          - id: l2-c18
            part: use
            type: fill_in_blank
            text: "Swap 6 × 5, then work it out."
            say: "Six times five. Swap it, then work it out."
            frame: "6 × 5 = 5 × _ = _"
            options: ["6", "5", "30", "11"]
            answer: ["6", "30"]
          - id: l2-c19
            part: use
            type: multiple_choice
            text: "Which is easier to work out for 4 × 10?"
            say: "Four times ten. Which way round is easier?"
            options: ["10 × 4: four tens", "4 + 10", "4 × 4"]
            answer: "10 × 4: four tens"
          - id: l2-c20
            part: use
            type: text_input
            text: "There are 5 tables with 10 cups on each. How many cups?"
            say: "There are five tables with ten cups on each table. How many cups?"
            answer: "50"
