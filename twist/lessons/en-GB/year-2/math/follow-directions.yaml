            show: { drawn: grid, cols: 4, rows: 4, cells: [[0, 2, yellow], [2, 0, green]], labels: [[0, 0, "A"], [1, 0, "B"], [2, 0, "C"], [3, 0, "D"], [0, 1, "E"], [1, 1, "F"], [2, 1, "G"], [3, 1, "H"], [0, 2, "I"], [1, 2, "J"], [2, 2, "K"], [3, 2, "L"], [0, 3, "M"], [1, 3, "N"], [2, 3, "O"], [3, 3, "P"]] }
            options: ["2 up, 2 right", "2 down, 2 right", "2 up, 2 left"]
            answer: "2 up, 2 right"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "The way there is ↓ →.\nWhat is the way back?"
            say: "The way there is down, then right. How do you go back the same way?"
            options: ["← ↑", "↓ →", "→ ↓"]
            answer: "← ↑"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Clockwise: the way the hands of a clock turn"
            say: "Clockwise means turning the same way as the hands of a clock. Turning the other way is called anticlockwise."
            show: { drawn: clock, hour: 12, minute: 0 }
          - text: "A quarter turn: from 12 to 3"
            say: "The minute hand turns from twelve to three. That is a quarter turn clockwise. A quarter turn makes a square corner, a right angle. An arrow pointing up makes a quarter turn clockwise and points right."
            show: { drawn: clock, hour: 12, minute: 15 }
          - text: "A half turn: from 12 to 6"
            say: "From twelve to six is a half turn. That is two quarter turns. After a half turn you face the opposite way: up turns into down. A half turn ends up facing the same way, clockwise or anticlockwise."
            show: { drawn: clock, hour: 12, minute: 30 }
          - text: "A three-quarter turn: from 12 to 9"
            say: "From twelve to nine is a three-quarter turn clockwise: three quarter turns. An arrow pointing up then points left. A quarter turn anticlockwise ends on left too."
            show: { drawn: clock, hour: 12, minute: 45 }

