# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.mass-g-kg
skill: math.mass-capacity.g-kg
curriculum: en-GB
language: en
title:
  de: Gramm und Kilogramm
  en: Grams and kilograms
summary: >
  Lesson 1 learns grams and kilograms, chooses the unit for a thing,
  learns 1 kg = 1000 g and reads a scale in kilograms; lesson 2 reads
  gram scales that go up in tens, fives and hundreds (drawn as a number
  line with an arrow), compares 1 kg with 900 g, and ends with the skill
  check. A round dial scale waits for a scale component.
metadata:
  year: year-2
  topic: { de: Gewichte, en: Mass }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mass-capacity.compare-mass, math.numbers-to-100.number-line]
  also_practises: [math.mass-capacity.compare-mass]
  vocabulary: { en: [mass, heavy, light, heavier, lighter, gram, g, kilogram, kg, scale, weigh] }
  forms: [picture, drawn, text, audio]
  drawn: [number-line]
  facets: [units]
  misconceptions:
    - id: kg-as-hundred
      what: Thinks 1 kg = 100 g, as 1 m = 100 cm
      addressed: lesson 1 Learn sets 1 kg = 1000 g; l1-f1 has feedback on 100, l1-s2, l1-n2 and l1-c2 change between kg and g, l2-n4 asks whether 1 kg = 100 g
    - id: every-mark-is-one
      what: Counts every mark on a scale as 1 g when the marks go up in tens, fives or hundreds
      addressed: lesson 2 Learn counts the marks in tens, fives and hundreds; l2-f1 and l2-f2 have feedback on counting in ones, l2-s2, l2-n2 and l2-c3 read a scale in fives
    - id: number-not-unit
      what: Calls 900 g heavier than 1 kg because 900 is the bigger number
      addressed: lesson 2 Learn compares 900 g with 1 kg; l2-f4 has feedback on 900 g, l2-s5 and l2-c5 compare grams with a kilogram
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gramm und Kilogramm", en: "Grams and kilograms" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Which is heavier?"
            say: "Which is heavier?"
            options: [{ object: elephant }, { object: mouse }]
            answer: elephant
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Where is the arrow pointing?"
            say: "Which number is the arrow pointing to?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 70 }
            options: ["70", "7", "60"]
            answer: "70"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "We measure mass in grams (g) and kilograms (kg)."
            say: "How heavy something is, is its mass. We measure mass in grams and kilograms. A gram is very light: a paper clip is about one gram. A bag of sugar is about one kilogram."
          - text: "1 kg = 1000 g\n500 g + 500 g = 1 kg"
            say: "One kilogram is the same as one thousand grams. Five hundred grams is half a kilogram, so five hundred grams and five hundred grams make one kilogram."
          - text: "The scale shows 4 kg."
            say: "This scale weighs in kilograms. Each mark is one kilogram. Count the marks from zero: one, two, three, four. The arrow points to four kilograms."
            show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 4 }
          - text: "Light things: grams. Heavy things: kilograms."
            say: "We weigh light things, like an apple, in grams. We weigh heavy things, like a dog, in kilograms."
            show: { objects: [apple, dog] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1 kg = _ g"
                say: "How many grams are in one kilogram?"
                options: ["1000", "100", "10"]
                answer: "1000"
                feedback:
                  "100": "1 m is 100 cm, but 1 kg is 1000 g."
                hints:
                  - "Kilo means one thousand."
                  - "One kilogram is the same as one thousand grams."
                  - "1000."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which would you weigh in kilograms?"
                say: "Which would you weigh in kilograms?"
                options: ["a dog", "a crayon", "a sticker"]
                answer: "a dog"
                hints:
                  - "Kilograms are for heavy things."
                  - "A crayon and a sticker are very light."
                  - "A dog."
              - id: l1-f3
                type: multiple_choice
                text: "What does the scale show?"
                say: "Each mark is one kilogram. What does the scale show?"
                show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 6 }
                options: ["6 kg", "6 g", "5 kg"]
                answer: "6 kg"
                hints:
                  - "Start at zero and count the marks."
                  - "One, two, three, four, five, six."
                  - "6 kg."
              - id: l1-f4
                type: true_false
                text: "500 g + 500 g = 1 kg"
                say: "Is it true? Five hundred grams and five hundred grams make one kilogram."
                answer: true
                hints:
                  - "How many grams make one kilogram?"
                  - "500 and 500 make 1000."
                  - "Yes, it is true."
              - id: l1-f5
                type: multiple_choice
                text: "Which would you weigh in grams?"
                say: "Which would you weigh in grams?"
                options: ["an apple", "a cow", "a car"]
                answer: "an apple"
                hints:
                  - "Grams are for light things."
                  - "Which one could you hold in one hand?"
                  - "An apple."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What does the scale show?"
                say: "Each mark is one kilogram. What does the scale show?"
                show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 3 }
                options: ["3 kg", "3 g", "4 kg"]
                answer: "3 kg"
                hints: ["Start at zero and count the marks."]
              - id: l1-s2
                type: text_input
                text: "Half a kilogram = _ g"
                say: "How many grams are in half a kilogram?"
                answer: "500"
                hints: ["1 kg is 1000 g. Half a kilogram is half of that."]
              - id: l1-s3
                type: multiple_choice
                text: "About how heavy is an apple?"
                say: "About how heavy is an apple?"
                show: { object: apple }
                options: ["100 g", "100 kg", "1 g"]
                answer: "100 g"
                hints: ["An apple is light, but much heavier than a paper clip."]
              - id: l1-s4
                type: true_false
                text: "500 g is heavier than 1 kg."
                say: "Is it true? Five hundred grams is heavier than one kilogram."
                answer: false
                hints: ["1 kg is 1000 g. Which is more, 500 g or 1000 g?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which is heavier: 1 kg or 100 g?"
                say: "Which is heavier: one kilogram or one hundred grams?"
                options: ["1 kg", "100 g"]
                answer: "1 kg"
                hints: ["1 kg is 1000 g."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What does the scale show?"
                say: "Each mark is one kilogram. What does the scale show?"
                show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 8 }
                options: ["8 kg", "8 g", "7 kg"]
                answer: "8 kg"
              - id: l1-n2
                type: text_input
                text: "1000 g = _ kg"
                say: "One thousand grams is how many kilograms?"
                answer: "1"
              - id: l1-n3
                type: multiple_choice
                text: "About how heavy is a bag of potatoes?"
                say: "About how heavy is a big bag of potatoes?"
                options: ["2 kg", "2 g", "200 kg"]
                answer: "2 kg"
              - id: l1-n4
                type: true_false
                text: "A cat weighs about 4 kg."
                say: "Is it true? A cat weighs about four kilograms."
                show: { object: cat }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "A pencil weighs about 5 _."
                say: "A pencil weighs about five what? Grams or kilograms?"
                show: { object: pencil }
                options: ["g", "kg"]
                answer: "g"
                keep_order: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What does the scale show?"
            say: "Each mark is one kilogram. What does the scale show?"
            show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 5 }
            options: ["5 kg", "5 g", "6 kg"]
            answer: "5 kg"
          - id: l1-c2
            type: multiple_choice
            text: "Which is the same as 1 kg?"
            say: "Which is the same as one kilogram?"
            options: ["1000 g", "100 g", "10 g"]
            answer: "1000 g"
          - id: l1-c3
            type: multiple_choice
            text: "Which would you weigh in grams?"
            say: "Which would you weigh in grams?"
            options: ["a strawberry", "a horse", "a sofa"]
            answer: "a strawberry"

  - n: 2
    title: { de: "Waagen ablesen", en: "Reading scales" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "1 kg = _ g"
            say: "How many grams are in one kilogram?"
            answer: "1000"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What does the scale show?"
            say: "Each mark is one kilogram. What does the scale show?"
            show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 7 }
            options: ["7 kg", "7 g", "6 kg"]
            answer: "7 kg"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Each mark is 10 g.\n10, 20, 30, 40: the scale shows 40 g."
            say: "This scale goes from zero to one hundred grams. Not every mark is one gram. Here each mark is ten grams, so count in tens: ten, twenty, thirty, forty. The arrow points to forty grams."
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 40 }
          - text: "Each mark is 5 g.\n30, 35: the scale shows 35 g."
            say: "On this scale the tens have numbers, and there is a mark halfway between them. Each mark is five grams. The arrow is one mark after thirty: thirty-five grams."
            show: { drawn: number-line, from: 0, to: 50, step: 5, labels: tens, mark: 35 }
          - text: "Each mark is 100 g.\nThe scale shows 600 g."
            say: "This kitchen scale goes up to one thousand grams, which is one kilogram. Each mark is one hundred grams. Count in hundreds: one hundred, two hundred, up to six hundred grams."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 600 }
          - text: "900 g or 1 kg?\n1 kg = 1000 g, so 1 kg is heavier."
            say: "Which is heavier, nine hundred grams or one kilogram? Nine hundred looks bigger than one. But one kilogram is one thousand grams, so one kilogram is heavier. Always look at the units."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What does the scale show?"
                say: "This scale goes from zero to one hundred grams. What does it show?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 30 }
                options: ["30 g", "3 g", "40 g"]
                answer: "30 g"
                feedback:
                  "3 g": "Each mark is 10 g, so count in tens: 10, 20, 30."
                hints:
                  - "Ten marks take you to 100 g. What is each mark worth?"
                  - "Each mark is 10 g. Count in tens."
                  - "30 g."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What does the scale show?"
                say: "The tens have numbers on this scale. What does it show?"
                show: { drawn: number-line, from: 0, to: 50, step: 5, labels: tens, mark: 25 }
                options: ["25 g", "21 g", "30 g"]
                answer: "25 g"
                feedback:
                  "21 g": "The marks go up in fives here, not in ones. One mark after 20 is 25."
                hints:
                  - "There is one mark between each ten. What is it worth?"
                  - "Each mark is 5 g. The arrow is one mark after 20."
                  - "25 g."
              - id: l2-f3
                type: multiple_choice
                text: "What does the scale show?"
                say: "This kitchen scale goes up to one thousand grams. What does it show?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 300 }
                options: ["300 g", "3 g", "30 g"]
                answer: "300 g"
                hints:
                  - "Ten marks take you to 1000 g."
                  - "Each mark is 100 g. Count in hundreds."
                  - "300 g."
              - id: l2-f4
                type: multiple_choice
                text: "Which is heavier: 1 kg or 900 g?"
                say: "Which is heavier: one kilogram or nine hundred grams?"
                options: ["1 kg", "900 g", "They are the same."]
                answer: "1 kg"
                feedback:
                  "900 g": "900 is the bigger number, but 1 kg is 1000 g."
                hints:
                  - "Write both in grams."
                  - "1 kg is 1000 g. Which is more, 1000 g or 900 g?"
                  - "1 kg."
              - id: l2-f5
                type: true_false
                text: "The scale shows 60 g."
                say: "This scale goes from zero to one hundred grams. Is it true? It shows sixty grams."
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 70 }
                answer: false
                hints:
                  - "Count in tens from zero."
                  - "10, 20, 30, 40, 50, 60, 70."
                  - "No. It shows 70 g."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What does the scale show?"
                say: "This scale goes from zero to one hundred grams. What does it show?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 80 }
                options: ["80 g", "8 g", "90 g"]
                answer: "80 g"
                hints: ["Each mark is 10 g."]
              - id: l2-s2
                type: multiple_choice
                text: "What does the scale show?"
                say: "The tens have numbers on this scale. What does it show?"
                show: { drawn: number-line, from: 0, to: 50, step: 5, labels: tens, mark: 15 }
                options: ["15 g", "11 g", "20 g"]
                answer: "15 g"
                hints: ["Each mark is 5 g."]
              - id: l2-s3
                type: multiple_choice
                text: "What does the scale show?"
                say: "This kitchen scale goes up to one thousand grams. What does it show?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 500 }
                options: ["500 g", "5 g", "50 g"]
                answer: "500 g"
                hints: ["Each mark is 100 g."]
              - id: l2-s4
                type: true_false
                text: "The scale shows 45 g."
                say: "The tens have numbers on this scale. Is it true? It shows forty-five grams."
                show: { drawn: number-line, from: 0, to: 50, step: 5, labels: tens, mark: 45 }
                answer: true
                hints: ["Find 40, then count on 5 g for each mark."]
              - id: l2-s5
                type: multiple_choice
                text: "Which is lighter: 800 g or 1 kg?"
                say: "Which is lighter: eight hundred grams or one kilogram?"
                options: ["800 g", "1 kg", "They are the same."]
                answer: "800 g"
                hints: ["1 kg is 1000 g."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "How many grams does the scale show?"
                say: "This scale goes from zero to one hundred grams. How many grams does it show?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 50 }
                answer: "50"
              - id: l2-n2
                type: multiple_choice
                text: "What does the scale show?"
                say: "The tens have numbers on this scale. What does it show?"
                show: { drawn: number-line, from: 0, to: 50, step: 5, labels: tens, mark: 5 }
                options: ["5 g", "1 g", "10 g"]
                answer: "5 g"
              - id: l2-n3
                type: text_input
                text: "How many grams does the scale show?"
                say: "This kitchen scale goes up to one thousand grams. How many grams does it show?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 800 }
                answer: "800"
              - id: l2-n4
                type: true_false
                text: "1 kg = 100 g"
                say: "Is it true? One kilogram is one hundred grams."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Mum has 500 g of flour. She needs 1 kg. How much more does she need?"
                say: "Mum has five hundred grams of flour. She needs one kilogram. How much more flour does she need?"
                options: ["500 g", "1 kg", "50 g"]
                answer: "500 g"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What does the scale show?"
            say: "Each mark is one kilogram. What does the scale show?"
            show: { drawn: number-line, from: 0, to: 10, step: 1, labels: ends, mark: 9 }
            options: ["9 kg", "9 g", "8 kg"]
            answer: "9 kg"
          - id: l2-c2
            type: text_input
            text: "How many grams does the scale show?"
            say: "This scale goes from zero to one hundred grams. How many grams does it show?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 60 }
            answer: "60"
          - id: l2-c3
            type: multiple_choice
            text: "What does the scale show?"
            say: "The tens have numbers on this scale. What does it show?"
            show: { drawn: number-line, from: 50, to: 100, step: 5, labels: tens, mark: 65 }
            options: ["65 g", "61 g", "70 g"]
            answer: "65 g"
          - id: l2-c4
            type: multiple_choice
            text: "Which would you weigh in kilograms?"
            say: "Which would you weigh in kilograms?"
            options: ["a suitcase", "a biscuit", "a key"]
            answer: "a suitcase"
          - id: l2-c5
            type: multiple_choice
            text: "Which is heavier: 1 kg or 700 g?"
            say: "Which is heavier: one kilogram or seven hundred grams?"
            options: ["1 kg", "700 g", "They are the same."]
            answer: "1 kg"
