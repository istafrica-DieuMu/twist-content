# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.inverse
skill: math.add-sub-to-20.inverse
curriculum: en-GB
language: en
title:
  de: Umkehraufgaben und Aufgabenfamilien
  en: Inverse and fact families
summary: >
  Addition and subtraction undo each other: 6 + 9 = 15, so 15 − 9 = 6.
  Lesson 1 writes the inverse of an addition within 20 and uses it to
  check a subtraction; lesson 2 builds the fact family of four from a
  part-whole model (6 + 9, 9 + 6, 15 − 9, 15 − 6), uses it for missing
  numbers, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.commutative, math.add-sub-to-20.sub-to-10]
  also_practises: [math.add-sub-to-20.missing-addend]
  vocabulary: { en: [inverse, fact family, whole, part, check, undo] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld, part-whole]
  facets: []
  parts:
    - { id: inverse, what: { de: zu einer Plusaufgabe die Umkehraufgabe finden, en: writing the inverse of an addition } }
    - { id: check, what: { de: eine Minusaufgabe mit einer Plusaufgabe prüfen, en: checking a subtraction with an addition } }
    - { id: family, what: { de: die vier Aufgaben einer Aufgabenfamilie, en: the four facts of a fact family } }
    - { id: missing, what: { de: fehlende Zahlen mit der Aufgabenfamilie finden, en: finding missing numbers with a fact family } }
  misconceptions:
    - id: inverse-is-swap
      what: Thinks the inverse of 6 + 9 = 15 is 9 + 6 = 15
      addressed: Learn sets the turnaround and the inverse side by side; feedback on the turnaround option says it is still an addition
    - id: start-with-part
      what: Starts a subtraction in the family with a part (9 − 15)
      addressed: Learn says each subtraction starts with the whole, the biggest number; a true/false task in each stage of lesson 2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Plus und minus gehören zusammen, en: Adding and subtracting undo each other }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is the turnaround of 2 + 9?"
            say: "Which addition is the turnaround of two add nine?"
            options: ["9 + 2", "2 + 2", "9 − 2"]
            answer: "9 + 2"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "12 − 3 = _"
            say: "Twelve subtract three."
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "8 + 5 = 13"
            say: "Eight red counters, and five more come. Eight add five equals thirteen."
            show: { drawn: zwanzigerfeld, filled: [8, 5] }
          - text: "13 − 5 = 8"
            say: "Now take the five away again. Thirteen subtract five equals eight. That is the inverse: subtracting undoes the adding."
          - text: "5 + 8 turnaround · 13 − 5 inverse"
            say: "Do not mix them up. Five add eight is the turnaround: still an addition. Thirteen subtract five is the inverse."
          - text: "13 − 5 = 8 · check: 8 + 5 = 13"
            say: "The inverse also checks a subtraction. Thirteen subtract five equals eight. Check it: add the answer and the number you took away. Eight add five is thirteen, so it is right."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is the inverse of 4 + 7 = 11?"
                say: "Four add seven equals eleven. What is the inverse?"
                options: ["11 − 7 = 4", "7 + 4 = 11", "11 + 7 = 18"]
                answer: "11 − 7 = 4"
                feedback:
                  "7 + 4 = 11": "That is the turnaround. The inverse is a subtraction."
                hints:
                  - "The inverse is a subtraction."
                  - "Take the seven away again: eleven subtract seven."
                  - "11 − 7 = 4."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "9 + 5 = 14. Take the 5 away again and write the inverse."
                say: "Nine add five equals fourteen. Take the five away again and write the inverse."
                show: { drawn: zwanzigerfeld, filled: [9, 5] }
                frame: "14 − _ = _"
                options: ["5", "9", "19"]
                answer: ["5", "9"]
                hints:
                  - "Take the five away again."
                  - "Fourteen subtract five."
                  - "14 − 5 = 9."
              - id: l1-f3
                type: true_false
                text: "Is it true? The inverse of 3 + 8 = 11 is 11 − 8 = 3."
                answer: true
                hints:
                  - "Subtracting undoes the adding."
                  - "Eleven subtract eight is three."
                  - "Yes."
              - id: l1-f4
                type: multiple_choice
                text: "16 − 9 = 7. Check with an addition."
                say: "Sixteen subtract nine equals seven. Which addition checks it?"
                options: ["7 + 9 = 16", "16 + 9 = 25", "7 + 7 = 14"]
                answer: "7 + 9 = 16"
                hints:
                  - "Add the answer and the number you took away."
                  - "Seven add nine."
                  - "7 + 9 = 16."
              - id: l1-f5
                type: fill_in_blank
                text: "6 + 12 = 18. Take the 12 away again and write the inverse."
                say: "Six add twelve equals eighteen. Take the twelve away again and write the inverse."
                frame: "18 − _ = _"
                options: ["6", "12", "18"]
                answer: ["12", "6"]
                hints:
                  - "Take the twelve away again."
                  - "Eighteen subtract twelve."
                  - "18 − 12 = 6."
              - id: l1-f6
                type: true_false
                text: "Is it true? 13 − 4 = 9, because 9 + 4 = 13."
                answer: true
                hints:
                  - "Check with the addition."
                  - "Nine add four is thirteen."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What is the inverse of 5 + 9 = 14?"
                say: "Five add nine equals fourteen. What is the inverse?"
                options: ["14 − 9 = 5", "9 + 5 = 14", "14 + 9 = 23"]
                answer: "14 − 9 = 5"
                hints: ["Is the inverse an addition or a subtraction?"]
              - id: l1-s2
                type: fill_in_blank
                text: "7 + 7 = 14. Take the 7 away again and write the inverse."
                say: "Seven add seven equals fourteen. Take the seven away again and write the inverse."
                frame: "14 − _ = _"
                options: ["7", "14", "21"]
                answer: ["7", "7"]
                hints: ["Take one of the sevens away again."]
              - id: l1-s3
                type: true_false
                text: "Is it true? The inverse of 6 + 8 = 14 is 8 + 6 = 14."
                answer: false
                hints: ["Does the inverse undo the adding?"]
              - id: l1-s4
                type: multiple_choice
                text: "15 − 6 = 9. Check with an addition."
                say: "Fifteen subtract six equals nine. Which addition checks it?"
                options: ["9 + 6 = 15", "15 + 6 = 21", "9 + 9 = 18"]
                answer: "9 + 6 = 15"
                hints: ["Add the answer and the number taken away."]
              - id: l1-s5
                type: fill_in_blank
                text: "11 + 8 = 19. Take the 8 away again and write the inverse."
                say: "Eleven add eight equals nineteen. Take the eight away again and write the inverse."
                frame: "19 − _ = _"
                options: ["8", "11", "27"]
                answer: ["8", "11"]
                hints: ["Take the eight away again."]
              - id: l1-s6
                type: true_false
                text: "Is it true? 17 − 8 = 8, because 8 + 8 = 17."
                answer: false
                hints: ["Work out eight add eight."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What is the inverse of 2 + 13 = 15?"
                say: "Two add thirteen equals fifteen. What is the inverse?"
                options: ["15 − 13 = 2", "13 + 2 = 15", "15 + 13 = 28"]
                answer: "15 − 13 = 2"
              - id: l1-n2
                type: fill_in_blank
                text: "8 + 9 = 17. Take the 9 away again and write the inverse."
                say: "Eight add nine equals seventeen. Take the nine away again and write the inverse."
                frame: "17 − _ = _"
                options: ["8", "9", "26"]
                answer: ["9", "8"]
              - id: l1-n3
                type: multiple_choice
                text: "20 − 7 = 13. Check with an addition."
                say: "Twenty subtract seven equals thirteen. Which addition checks it?"
                options: ["13 + 7 = 20", "20 + 7 = 27", "13 + 3 = 16"]
                answer: "13 + 7 = 20"
              - id: l1-n4
                type: true_false
                text: "Is it true? The inverse of 4 + 9 = 13 is 13 − 9 = 4."
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "3 + 15 = 18. Take the 15 away again and write the inverse."
                say: "Three add fifteen equals eighteen. Take the fifteen away again and write the inverse."
                frame: "18 − _ = _"
                options: ["3", "15", "21"]
                answer: ["15", "3"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is the inverse of 7 + 5 = 12?"
            say: "Seven add five equals twelve. What is the inverse?"
            options: ["12 − 5 = 7", "5 + 7 = 12", "12 + 5 = 17"]
            answer: "12 − 5 = 7"
          - id: l1-c2
            type: fill_in_blank
            text: "10 + 6 = 16. Write the inverse."
            say: "Ten add six equals sixteen. Write the inverse."
            frame: "16 − 6 = _"
            options: ["6", "10", "22"]
            answer: ["10"]
          - id: l1-c3
            type: true_false
            text: "Is it true? 11 − 2 = 9, because 9 + 2 = 11."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "What is the inverse of 9 + 7 = 16?"
            say: "Nine add seven equals sixteen. What is the inverse?"
            options: ["16 − 7 = 9", "7 + 9 = 16", "9 − 7 = 2"]
            answer: "16 − 7 = 9"
          - id: l1-c5
            type: multiple_choice
            text: "19 − 6 = 13. Check with an addition."
            say: "Nineteen subtract six equals thirteen. Which addition checks it?"
            options: ["13 + 6 = 19", "13 − 6 = 7", "6 + 6 = 12"]
            answer: "13 + 6 = 19"
          - id: l1-c6
            type: true_false
            text: "Is it true? The inverse of 2 + 10 = 12 is 12 + 2 = 14."
            say: "Two add ten equals twelve. Is the inverse twelve add two equals fourteen?"
            answer: false

  - n: 2
    title: { de: Aufgabenfamilien, en: Fact families }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is the inverse of 9 + 3 = 12?"
            say: "Nine add three equals twelve. What is the inverse?"
            options: ["12 − 3 = 9", "3 + 9 = 12", "12 + 3 = 15"]
            answer: "12 − 3 = 9"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "5 + 11 = 16. Take the 11 away again and write the inverse."
            say: "Five add eleven equals sixteen. Take the eleven away again and write the inverse."
            frame: "16 − _ = _"
            options: ["5", "11", "21"]
            answer: ["11", "5"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "6, 9, 15"
            say: "Here is a part-whole model. The whole is fifteen; the parts are six and nine. These three numbers make a fact family of four facts."
            show: { drawn: part-whole, whole: 15, parts: [6, 9] }
          - text: "6 + 9 = 15 · 9 + 6 = 15"
            say: "Two additions: the parts add up to the whole, in either order."
          - text: "15 − 9 = 6 · 15 − 6 = 9"
            say: "Two subtractions: take one part away from the whole, and the other part is left. A subtraction always starts with the whole."
          - text: "6 + _ = 15"
            say: "A fact family helps with missing numbers. Six add what equals fifteen? Fifteen subtract six is nine, so the missing number is nine."
            show: { drawn: part-whole, whole: 15, parts: [6, null] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which fact is in the family 4, 8, 12?"
                say: "Which fact belongs to the family four, eight, twelve?"
                show: { drawn: part-whole, whole: 12, parts: [4, 8] }
                options: ["12 − 4 = 8", "8 − 4 = 4", "12 + 4 = 16"]
                answer: "12 − 4 = 8"
                hints:
                  - "Only 4, 8 and 12 can be in it."
                  - "A subtraction starts with the whole, 12."
                  - "12 − 4 = 8."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Finish the fact family."
                say: "The family has the numbers three, fourteen and seventeen. Finish the four facts."
                show: { drawn: part-whole, whole: 17, parts: [3, 14] }
                frame: "3 + 14 = 17 · 14 + 3 = _ · 17 − 14 = _ · 17 − 3 = _"
                options: ["3", "14", "17"]
                answer: ["17", "3", "14"]
                hints:
                  - "The turnaround has the same total."
                  - "Take one part from the whole: seventeen subtract fourteen, seventeen subtract three."
                  - "17, 3, 14."
              - id: l2-f3
                type: true_false
                text: "Is it true? 9 − 16 = 7 is in the family 7, 9, 16."
                answer: false
                feedback:
                  "true": "A subtraction starts with the whole: 16 − 9 = 7."
                hints:
                  - "What does a subtraction in the family start with?"
                  - "With the whole, 16."
                  - "No. The fact is 16 − 9 = 7."
              - id: l2-f4
                type: fill_in_blank
                text: "Find the missing number."
                say: "Eight add what equals thirteen? Use the part-whole model."
                show: { drawn: part-whole, whole: 13, parts: [8, null] }
                frame: "8 + _ = 13"
                options: ["5", "13", "21"]
                answer: ["5"]
                hints:
                  - "The whole is 13 and one part is 8."
                  - "Work out thirteen subtract eight."
                  - "8 + 5 = 13."
              - id: l2-f5
                type: fill_in_blank
                text: "Write the two subtractions."
                say: "The fact family for 5, 6 and 11. Write the two subtractions."
                show: { drawn: part-whole, whole: 11, parts: [5, 6] }
                frame: "11 − 5 = _ · 11 − 6 = _"
                options: ["5", "6", "11"]
                answer: ["6", "5"]
                hints:
                  - "Eleven subtract five."
                  - "Eleven subtract six."
                  - "6 and 5."
              - id: l2-f6
                type: multiple_choice
                text: "Which fact is not in the family 2, 18, 20?"
                say: "Which fact does not belong to the family two, eighteen, twenty?"
                options: ["18 + 2 = 20", "20 − 18 = 2", "18 − 2 = 16"]
                answer: "18 − 2 = 16"
                hints:
                  - "Is there a number that is not 2, 18 or 20?"
                  - "16."
                  - "18 − 2 = 16 does not belong."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which fact is in the family 5, 7, 12?"
                say: "Which fact belongs to the family five, seven, twelve?"
                show: { drawn: part-whole, whole: 12, parts: [5, 7] }
                options: ["12 − 7 = 5", "7 − 5 = 2", "12 + 5 = 17"]
                answer: "12 − 7 = 5"
                hints: ["Only 5, 7 and 12 can be in it."]
              - id: l2-s2
                type: fill_in_blank
                text: "Finish the fact family."
                say: "The family has the numbers nine, ten and nineteen. Finish the four facts."
                show: { drawn: part-whole, whole: 19, parts: [9, 10] }
                frame: "9 + 10 = 19 · 10 + 9 = _ · 19 − 10 = _ · 19 − 9 = _"
                options: ["9", "10", "19"]
                answer: ["19", "9", "10"]
                hints: ["A turnaround, then take one part from the whole."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 14 − 6 = 8 is in the family 6, 8, 14."
                answer: true
                hints: ["Does it start with the whole?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Find the missing number."
                say: "What add seven equals sixteen?"
                show: { drawn: part-whole, whole: 16, parts: [null, 7] }
                frame: "_ + 7 = 16"
                options: ["9", "16", "23"]
                answer: ["9"]
                hints: ["Take the part you know from the whole."]
              - id: l2-s5
                type: multiple_choice
                text: "Which fact is not in the family 4, 11, 15?"
                say: "Which fact does not belong to the family four, eleven, fifteen?"
                options: ["11 + 4 = 15", "15 − 4 = 11", "11 − 4 = 7"]
                answer: "11 − 4 = 7"
                hints: ["Is there a number from outside the family?"]
              - id: l2-s6
                type: true_false
                text: "Is it true? 8 − 20 = 12 is in the family 8, 12, 20."
                answer: false
                hints: ["What does a subtraction in the family start with?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which fact is in the family 3, 9, 12?"
                say: "Which fact belongs to the family three, nine, twelve?"
                show: { drawn: part-whole, whole: 12, parts: [3, 9] }
                options: ["12 − 9 = 3", "9 − 3 = 6", "12 + 3 = 15"]
                answer: "12 − 9 = 3"
              - id: l2-n2
                type: fill_in_blank
                text: "Finish the fact family."
                say: "The family has the numbers six, seven and thirteen. Finish the four facts."
                show: { drawn: part-whole, whole: 13, parts: [6, 7] }
                frame: "6 + 7 = 13 · 7 + 6 = _ · 13 − 7 = _ · 13 − 6 = _"
                options: ["6", "7", "13"]
                answer: ["13", "6", "7"]
              - id: l2-n3
                type: fill_in_blank
                text: "Find the missing number."
                say: "Twelve add what equals eighteen?"
                frame: "12 + _ = 18"
                options: ["6", "18", "30"]
                answer: ["6"]
              - id: l2-n4
                type: true_false
                text: "Is it true? 11 − 15 = 4 is in the family 4, 11, 15."
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Write the two subtractions."
                say: "The fact family for 8, 9 and 17. Write the two subtractions."
                show: { drawn: part-whole, whole: 17, parts: [8, 9] }
                frame: "17 − 8 = _ · 17 − 9 = _"
                options: ["8", "9", "17"]
                answer: ["9", "8"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: inverse
            type: multiple_choice
            text: "What is the inverse of 8 + 6 = 14?"
            say: "Eight add six equals fourteen. What is the inverse?"
            options: ["14 − 6 = 8", "6 + 8 = 14", "14 + 6 = 20"]
            answer: "14 − 6 = 8"
          - id: l2-c2
            part: missing
            type: fill_in_blank
            text: "Find the missing number."
            say: "Nine add what equals twenty?"
            show: { drawn: part-whole, whole: 20, parts: [9, null] }
            frame: "9 + _ = 20"
            options: ["11", "20", "29"]
            answer: ["11"]
          - id: l2-c3
            part: family
            type: multiple_choice
            text: "Which fact is in the family 7, 10, 17?"
            say: "Which fact belongs to the family seven, ten, seventeen?"
            show: { drawn: part-whole, whole: 17, parts: [7, 10] }
            options: ["17 − 10 = 7", "10 − 7 = 3", "17 + 7 = 24"]
            answer: "17 − 10 = 7"
          - id: l2-c4
            part: check
            type: true_false
            text: "Is it true? 19 − 7 = 12, because 12 + 7 = 19."
            answer: true
          - id: l2-c5
            part: family
            type: fill_in_blank
            text: "Write the two subtractions for the family 5, 13, 18."
            say: "The fact family for 5, 13 and 18. Write the two subtractions."
            show: { drawn: part-whole, whole: 18, parts: [5, 13] }
            frame: "18 − 5 = _ · 18 − 13 = _"
            options: ["5", "13", "18"]
            answer: ["13", "5"]
          - id: l2-c6
            part: inverse
            type: multiple_choice
            text: "What is the inverse of 3 + 9 = 12?"
            say: "Three add nine equals twelve. What is the inverse?"
            options: ["12 − 9 = 3", "9 + 3 = 12", "9 − 3 = 6"]
            answer: "12 − 9 = 3"
          - id: l2-c7
            part: inverse
            type: fill_in_blank
            text: "6 + 7 = 13. Write the inverse."
            say: "Six add seven equals thirteen. Write the inverse."
            frame: "13 − 7 = _"
            options: ["6", "7", "20"]
            answer: ["6"]
          - id: l2-c8
            part: inverse
            type: true_false
            text: "Is it true? 15 − 8 = 7 undoes 7 + 8 = 15."
            say: "Fifteen subtract eight equals seven. Does it undo seven add eight equals fifteen?"
            answer: true
          - id: l2-c9
            part: inverse
            type: text_input
            text: "11 + 9 = 20, so 20 − 9 = _"
            say: "Eleven add nine equals twenty. So twenty subtract nine equals what?"
            answer: "11"
          - id: l2-c10
            part: check
            type: multiple_choice
            text: "18 − 11 = 7. Check with an addition."
            say: "Eighteen subtract eleven equals seven. Which addition checks it?"
            options: ["7 + 11 = 18", "7 + 7 = 14", "11 − 7 = 4"]
            answer: "7 + 11 = 18"
          - id: l2-c11
            part: check
            type: true_false
            text: "Is it true? 14 − 5 = 8, because 8 + 5 = 14."
