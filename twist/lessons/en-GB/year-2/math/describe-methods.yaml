# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.describe-methods
skill: math.add-sub-to-100.describe-methods
curriculum: en-GB
language: en
title:
  de: Rechenwege beschreiben und vergleichen
  en: Comparing methods
summary: >
  Naming and comparing methods for adding and subtracting to 100. Lesson
  1 names the method a calculation shows (jumps on a number line,
  partitioning into tens and ones, round and adjust, counting up) and
  works sums the named way; lesson 2 says which method suits a
  calculation and why, checks two children's methods side by side, and
  ends with the skill check. Explaining a method in the child's own words
  waits for a spoken or written answer that can be marked; here the child
  chooses the description that fits.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-100.clever]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { en: [method, jumps, number line, partition, tens and ones, round and adjust, count up, efficient] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: []
  parts:
    - { id: name, what: { de: den Rechenweg einer Rechnung benennen, en: naming the method a calculation shows } }
    - { id: suits, what: { de: "sagen, welcher Rechenweg zu einer Aufgabe passt", en: saying which method suits a calculation } }
    - { id: compare, what: { de: zwei Rechenwege vergleichen, en: comparing two children's methods } }
    - { id: use, what: { de: mit einem genannten Rechenweg rechnen, en: working out a calculation with a named method } }
  misconceptions:
    - id: one-method-for-all
      what: Uses the same method for every calculation, even when another is much quicker (counting on in ones for 56 + 19)
      addressed: lesson 2 Learn compares three methods for 56 + 19; l2-f1 (with feedback), l2-f2, l2-s1 and l2-c3 ask which method suits a calculation
    - id: method-names-mixed
      what: Mixes up partitioning and jumps on a number line, since both split a number into tens and ones
      addressed: lesson 1 Learn shows that partitioning splits both numbers and jumps split only the second; l1-f2 (with feedback), l1-s2 and l1-c2 ask which method it is
    - id: different-method-wrong
      what: Thinks a different method from their own must give a different answer
      addressed: lesson 2 Learn shows two children's methods with the same answer; l2-f4 (with feedback), l2-s4 and l2-c4 ask who is right
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Rechenwege benennen, en: Name the method }
    goal:
      de: "Benenne, wie eine Aufgabe gerechnet wurde, zum Beispiel mit Sprüngen am Zahlenstrahl oder mit Runden und Ausgleichen."
      en: "Name the way a sum was worked out, like jumps on a number line or round and adjust."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "45 + 19 = 45 + 20 − 1 = _"
            say: "Forty-five add nineteen. Add twenty, then take one away."
            options: ["64", "65", "66"]
            answer: "64"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "62 − 29 = _"
            say: "Sixty-two take away twenty-nine. Take away thirty, then add one back."
            answer: "33"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "45 + 38. How many ways can you work it out?"
            say: "Forty-five add thirty-eight. How many different ways do you think there are to work it out? Have a guess."
          - text: "Jumps: 45 + 38 = 45 + 30 + 8"
            say: "There are lots! Here are some. First, jumps on a number line. Start at forty-five. Jump thirty to seventy-five, then eight to eighty-three. Only the second number is split."
            show: { drawn: rechenstrich, start: 45, jumps: [30, 8] }
          - text: "Partitioning: 40 + 30 = 70, 5 + 8 = 13, 70 + 13 = 83"
            say: "Partitioning. Split both numbers into tens and ones. Add the tens: seventy. Add the ones: thirteen. Seventy and thirteen are eighty-three."
          - text: "Round and adjust: 45 + 39 = 45 + 40 − 1"
            say: "Round and adjust. Thirty-nine is nearly forty. Add forty, then take the extra one away. Eighty-four."
          - text: "Count up: 72 − 68 → 68 + 4 = 72"
            say: "Counting up. Seventy-two take away sixty-eight. The numbers are close, so count up from sixty-eight to seventy-two. That is four."
            show: { drawn: rechenstrich, start: 68, jumps: [2, 2] }
          - text: "Did you know? In Japan, lots of children learn to work out sums on a soroban. A soroban is a kind of abacus."
            say: "Did you know? In Japan, lots of children learn to work out sums on a soroban. A soroban is a kind of abacus, a frame with beads that slide up and down. Another method!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which method is this? 56 + 29 = 56 + 30 − 1"
                say: "Fifty-six add twenty-nine is fifty-six add thirty, take away one. Which method is this?"
                options: ["round and adjust", "partitioning", "counting up"]
                answer: "round and adjust"
                hints:
                  - "Which number was changed to a ten?"
                  - "Twenty-nine was rounded to thirty, then one was taken away."
                  - "Round and adjust."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which method is this? 34 + 25: 30 + 20 = 50, 4 + 5 = 9, 50 + 9 = 59"
                say: "Thirty-four add twenty-five. Thirty add twenty is fifty, four add five is nine, fifty add nine is fifty-nine. Which method is this?"
                options: ["partitioning", "jumps on a number line", "round and adjust"]
                answer: "partitioning"
                feedback:
                  "jumps on a number line": "Jumps keep the first number whole. Here both numbers are split into tens and ones: that is partitioning."
                hints:
                  - "Are both numbers split, or only one?"
                  - "Both are split into tens and ones, then the parts are added."
                  - "Partitioning."
              - id: l1-f3
                type: fill_in_blank
                text: "Use jumps: 47 + 26"
                say: "Forty-seven add twenty-six. Jump the tens first, then the ones."
                show: { drawn: rechenstrich, start: 47, jumps: [20, 6] }
                frame: "47 + 20 = _ · _ + 6 = _"
                options: ["67", "73", "63", "77"]
                answer: ["67", "67", "73"]
                hints:
                  - "Jump twenty from forty-seven."
                  - "Forty-seven add twenty is sixty-seven. Then add six."
                  - "67, then 73."
              - id: l1-f4
                type: multiple_choice
                text: "Which method is this? 81 − 78: 78 + 3 = 81"
                say: "Eighty-one take away seventy-eight. Seventy-eight add three is eighty-one. Which method is this?"
                options: ["counting up", "partitioning", "round and adjust", "magic"]
                answer: "counting up"
                feedback:
                  "magic": "No magic needed! Start at seventy-eight and count up to eighty-one."
                hints:
                  - "The child starts from the smaller number."
                  - "From seventy-eight they count up to eighty-one."
                  - "Counting up."
              - id: l1-f5
                type: true_false
                text: "Is it true? 63 + 30 + 5 is jumps on a number line for 63 + 35."
                say: "Sixty-three add thirty add five is jumps on a number line for sixty-three add thirty-five. Is that true?"
                answer: true
                hints:
                  - "Is the first number kept whole?"
                  - "Sixty-three stays whole; thirty-five is split into thirty and five."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which method is this? 74 − 19 = 74 − 20 + 1"
                say: "Seventy-four take away nineteen is seventy-four take away twenty, add one. Which method is this?"
                options: ["round and adjust", "counting up", "jumps on a number line"]
                answer: "round and adjust"
                hints: ["Nineteen was rounded to a ten."]
              - id: l1-s2
                type: multiple_choice
                text: "Which method is this? 52 + 36 = 52 + 30 + 6"
                say: "Fifty-two add thirty-six is fifty-two add thirty add six. Which method is this?"
                options: ["jumps on a number line", "partitioning", "counting up"]
                answer: "jumps on a number line"
                hints: ["Is the first number kept whole?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Use partitioning: 43 + 35"
                say: "Forty-three add thirty-five. Add the tens, then the ones, then put them together."
                frame: "40 + 30 = _ · 3 + 5 = _ · 43 + 35 = _"
                options: ["70", "8", "78", "60", "9"]
                answer: ["70", "8", "78"]
                hints: ["Tens first: forty and thirty."]
              - id: l1-s4
                type: text_input
                text: "Count up: 53 − 48 = _"
                say: "Fifty-three take away forty-eight. Count up from forty-eight."
                answer: "5"
                hints: ["Forty-eight to fifty, then fifty to fifty-three."]
              - id: l1-s5
                type: true_false
                text: "66 + 19 = 66 + 20 + 1. Is this round and adjust done right?"
                say: "Sixty-six add nineteen is sixty-six add twenty add one. Is that round and adjust done right?"
                answer: false
                hints: ["Twenty is one too many. Do you add one or take one away?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which method is this? 91 − 87: 87 + 3 = 90, 90 + 1 = 91"
                say: "Ninety-one take away eighty-seven. Eighty-seven add three is ninety, ninety add one is ninety-one. Which method is this?"
                options: ["counting up", "round and adjust", "partitioning"]
                answer: "counting up"
              - id: l1-n2
                type: text_input
                text: "Round and adjust: 38 + 29 = _"
                say: "Thirty-eight add twenty-nine. Round and adjust."
                answer: "67"
              - id: l1-n3
                type: multiple_choice
                text: "Which method is this? 26 + 42: 20 + 40 = 60, 6 + 2 = 8, 60 + 8 = 68"
                say: "Twenty-six add forty-two. Twenty add forty is sixty, six add two is eight, sixty add eight is sixty-eight. Which method is this?"
                options: ["partitioning", "jumps on a number line", "counting up"]
                answer: "partitioning"
              - id: l1-n4
                type: text_input
                text: "Jumps: 58 + 34 = _"
                say: "Fifty-eight add thirty-four. Jump the tens, then the ones."
                answer: "92"
              - id: l1-n5
                type: true_false
                text: "Is it true? 70 − 66 is quick to count up."
                say: "Seventy take away sixty-six is quick to work out by counting up. Is that true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which method is this? 47 + 39 = 47 + 40 − 1"
            say: "Forty-seven add thirty-nine is forty-seven add forty, take away one. Which method is this?"
            options: ["round and adjust", "counting up", "partitioning"]
            answer: "round and adjust"
          - id: l1-c2
            type: multiple_choice
            text: "Which method is this? 25 + 43: 20 + 40 = 60, 5 + 3 = 8"
            say: "Twenty-five add forty-three. Twenty add forty is sixty, five add three is eight. Which method is this?"
            options: ["partitioning", "jumps on a number line", "round and adjust"]
            answer: "partitioning"
          - id: l1-c3
            type: text_input
            text: "Count up: 62 − 57 = _"
            say: "Sixty-two take away fifty-seven. Count up from fifty-seven."
            answer: "5"
          - id: l1-c4
            type: multiple_choice
            text: "Which method is this? 68 + 24 = 68 + 20 + 4"
            say: "Sixty-eight add twenty-four is sixty-eight add twenty add four. Which method is this?"
            options: ["jumps on a number line", "partitioning", "counting up"]
            answer: "jumps on a number line"
          - id: l1-c5
            type: fill_in_blank
            text: "Use jumps: 25 + 48"
            say: "Twenty-five add forty-eight. Jump the tens first, then the ones."
            frame: "25 + 40 = _ · _ + 8 = _"
            options: ["65", "73", "63", "75"]
            answer: ["65", "65", "73"]
          - id: l1-c6
            type: true_false
            text: "Is it true? 55 + 29 = 55 + 30 − 1 is round and adjust."
            say: "Fifty-five add twenty-nine is fifty-five add thirty, take away one. Is that round and adjust?"
            answer: true

  - n: 2
    title: { de: "Welcher Weg passt?", en: "Which method suits?" }
    goal:
      de: "Wähl den schnellsten Rechenweg, wie Ergänzen bei 83 − 79, und sag, warum er gut passt."
      en: "Choose the quickest way for a sum, like counting up for 83 − 79, and say why it suits."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which method is this? 64 + 23 = 64 + 20 + 3"
            say: "Sixty-four add twenty-three is sixty-four add twenty add three. Which method is this?"
            options: ["jumps on a number line", "counting up", "round and adjust"]
            answer: "jumps on a number line"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Count up: 44 − 39 = _"
            say: "Forty-four take away thirty-nine. Count up from thirty-nine."
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "56 + 19. Which method would you pick?"
            say: "Fifty-six add nineteen. Which method do you think is quickest? Have a guess."
          - text: "56 + 19"
            say: "Round and adjust! Nineteen is nearly twenty. Round and adjust is quick: fifty-six add twenty is seventy-six, take one away: seventy-five."
          - text: "43 + 25"
            say: "Forty-three add twenty-five. No ones need to cross a ten: three and five make eight. Partitioning or jumps work well: sixty-eight."
          - text: "83 − 79"
            say: "Eighty-three take away seventy-nine. The numbers are close together. Counting up is quickest: seventy-nine to eighty is one, eighty to eighty-three is three. Four."
            show: { drawn: rechenstrich, start: 79, jumps: [1, 3] }
          - text: "Amir: 36 + 28 = 36 + 30 − 2 = 64. Ruby: 30 + 20 = 50, 6 + 8 = 14, 50 + 14 = 64"
            say: "Amir and Ruby use different methods for thirty-six add twenty-eight. Both get sixty-four. Different methods can both be right."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which method suits 67 + 29 best?"
                say: "Which method suits sixty-seven add twenty-nine best?"
                options: ["round and adjust", "counting up", "counting on in ones"]
                answer: "round and adjust"
                feedback:
                  "counting on in ones": "Twenty-nine jumps of one take a long time. Twenty-nine is nearly thirty, so add thirty and take one away."
                hints:
                  - "Is one of the numbers nearly a ten?"
                  - "Twenty-nine is nearly thirty."
                  - "Round and adjust."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which method suits 61 − 58 best?"
                say: "Which method suits sixty-one take away fifty-eight best?"
                options: ["counting up", "partitioning", "round and adjust"]
                answer: "counting up"
                feedback:
                  "partitioning": "Partitioning would need one take away eight. The numbers are close, so count up from fifty-eight: three."
                hints:
                  - "How far apart are the two numbers?"
                  - "Fifty-eight and sixty-one are very close."
                  - "Counting up."
              - id: l2-f3
                type: text_input
                text: "Pick a method: 54 + 39 = _"
                say: "Fifty-four add thirty-nine. Pick a good method."
                answer: "93"
                hints:
                  - "Thirty-nine is nearly forty."
                  - "Fifty-four add forty is ninety-four. Take one away."
                  - "93."
              - id: l2-f4
                type: multiple_choice
                text: "Who is right? 45 + 27. Ella: 45 + 30 − 3 = 72. Jay: 40 + 20 = 60, 5 + 7 = 12, 60 + 12 = 72"
                say: "Forty-five add twenty-seven. Ella adds thirty and takes three away: seventy-two. Jay partitions: sixty and twelve make seventy-two. Who is right?"
                options: ["both", "only Ella", "only Jay"]
                answer: "both"
                keep_order: true
                feedback:
                  "only Ella": "Jay used a different method, but he got seventy-two too. Both methods are right."
                hints:
                  - "Check each answer."
                  - "Both get seventy-two."
                  - "Both."
              - id: l2-f5
                type: true_false
                text: "Is it true? Counting up is a good method for 92 − 89."
                say: "Counting up is a good method for ninety-two take away eighty-nine. Is that true?"
                answer: true
                hints:
                  - "Are the numbers close together?"
                  - "Eighty-nine to ninety-two is only three."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which method suits 72 − 39 best?"
                say: "Which method suits seventy-two take away thirty-nine best?"
                options: ["round and adjust", "partitioning", "counting back in ones"]
                answer: "round and adjust"
                hints: ["Thirty-nine is nearly forty."]
              - id: l2-s2
                type: multiple_choice
                text: "Which method suits 32 + 46 best?"
                say: "Which method suits thirty-two add forty-six best?"
                options: ["partitioning", "round and adjust", "counting up"]
                answer: "partitioning"
                hints: ["Two and six make eight, so no ten is crossed. Add tens and ones."]
              - id: l2-s3
                type: text_input
                text: "A train has 80 seats. 76 are taken. How many seats are free? 80 − 76 = _"
                say: "A train has eighty seats. Seventy-six are taken. How many seats are free? Pick a good method."
                show: { object: train }
                answer: "4"
                hints: ["The numbers are close: count up."]
              - id: l2-s4
                type: multiple_choice
                text: "Who is right? 63 − 28. Sam: 63 − 30 + 2 = 35. Lily: 63 − 20 − 8 = 45"
                say: "Sixty-three take away twenty-eight. Sam takes away thirty and adds two back: thirty-five. Lily takes away twenty, then eight: forty-five. Who is right?"
                options: ["both", "only Sam", "only Lily"]
                answer: "only Sam"
                keep_order: true
                hints: ["Work out Lily's jumps again: sixty-three take away twenty is forty-three."]
              - id: l2-s5
                type: true_false
                text: "Is it true? Round and adjust is a good method for 44 + 33."
                say: "Round and adjust is a good method for forty-four add thirty-three. Is that true?"
                answer: false
                hints: ["Is thirty-three near a ten?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mo has 57 stickers and gets 19 more. Which method is quickest?"
                say: "Mo has fifty-seven stickers and gets nineteen more. Which method is quickest to find how many he has?"
                options: ["round and adjust", "counting up", "counting on in ones"]
                answer: "round and adjust"
              - id: l2-n2
                type: text_input
                text: "Mo has 57 stickers and gets 19 more. How many now?"
                say: "Mo has fifty-seven stickers and gets nineteen more. How many does he have now?"
                answer: "76"
              - id: l2-n3
                type: multiple_choice
                text: "A book has 64 pages. Isla has read 59. Which method is quickest to find how many are left?"
                say: "A book has sixty-four pages. Isla has read fifty-nine. Which method is quickest to find how many pages are left?"
                options: ["counting up", "partitioning", "round and adjust"]
                answer: "counting up"
              - id: l2-n4
                type: text_input
                text: "A book has 64 pages. Isla has read 59. How many pages are left?"
                say: "A book has sixty-four pages. Isla has read fifty-nine. How many pages are left?"
                answer: "5"
              - id: l2-n5
                type: multiple_choice
                text: "Who is right? 38 + 45. Noah: 38 + 40 + 5 = 83. Zoe: 30 + 40 = 70, 8 + 5 = 13, 70 + 13 = 83"
                say: "Thirty-eight add forty-five. Noah jumps forty, then five: eighty-three. Zoe partitions: seventy and thirteen, eighty-three. Who is right?"
                options: ["both", "only Noah", "only Zoe"]
                answer: "both"
                keep_order: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: name
            type: multiple_choice
            text: "Which method is this? 75 − 38 = 75 − 30 − 8"
            say: "Seventy-five take away thirty-eight is seventy-five take away thirty, take away eight. Which method is this?"
            options: ["jumps on a number line", "counting up", "round and adjust"]
            answer: "jumps on a number line"
          - id: l2-c2
            part: use
            type: text_input
            text: "Pick a method: 46 + 29 = _"
            say: "Forty-six add twenty-nine. Pick a good method."
            answer: "75"
          - id: l2-c3
            part: suits
            type: multiple_choice
            text: "Which method suits 51 − 47 best?"
            say: "Which method suits fifty-one take away forty-seven best?"
            options: ["counting up", "round and adjust", "partitioning"]
            answer: "counting up"
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Who is right? 54 + 18. Mia: 54 + 20 − 2 = 72. Ravi: 50 + 10 = 60, 4 + 8 = 12, 60 + 12 = 72"
            say: "Fifty-four add eighteen. Mia adds twenty and takes two away: seventy-two. Ravi partitions: sixty and twelve, seventy-two. Who is right?"
            options: ["both", "only Mia", "only Ravi"]
            answer: "both"
            keep_order: true
          - id: l2-c5
            part: name
            type: true_false
            text: "Is it true? 52 + 37 = 50 + 30 + 2 + 7 is partitioning."
            say: "Fifty-two add thirty-seven is fifty add thirty add two add seven. Is that partitioning?"
            answer: true
          - id: l2-c6
            part: name
            type: multiple_choice
            text: "Which method is this? 64 − 59: 59 + 1 = 60, 60 + 4 = 64"
            say: "Sixty-four take away fifty-nine. Fifty-nine add one is sixty, sixty add four is sixty-four. Which method is this?"
            options: ["counting up", "partitioning", "round and adjust"]
            answer: "counting up"
          - id: l2-c7
            part: name
            type: multiple_choice
            text: "Which method is this? 37 + 48 = 37 + 50 − 2"
            say: "Thirty-seven add forty-eight is thirty-seven add fifty, take away two. Which method is this?"
            options: ["round and adjust", "jumps on a number line", "partitioning"]
            answer: "round and adjust"
          - id: l2-c8
            part: name
            type: true_false
            text: "Is it true? 27 + 46 = 27 + 40 + 6 is partitioning."
            say: "Twenty-seven add forty-six is twenty-seven add forty add six. Is that partitioning?"
            answer: false
          - id: l2-c9
            part: suits
            type: multiple_choice
            text: "Which method suits 85 − 49 best?"
            say: "Which method suits eighty-five take away forty-nine best?"
            options: ["round and adjust", "counting up", "counting back in ones"]
            answer: "round and adjust"
          - id: l2-c10
            part: suits
            type: multiple_choice
            text: "Which calculation is quickest to count up?"
            say: "Which calculation is quickest to work out by counting up?"
            options: ["90 − 87", "90 − 27", "90 − 47"]
            answer: "90 − 87"
          - id: l2-c11
            part: suits
            type: multiple_choice
            text: "Which calculation suits round and adjust?"
            say: "Which calculation suits round and adjust best?"
            options: ["53 + 29", "53 + 24", "53 + 22"]
            answer: "53 + 29"
          - id: l2-c12
            part: suits
            type: true_false
            text: "Is it true? Partitioning is a good method for 41 + 37."
            say: "Partitioning is a good method for forty-one add thirty-seven. Is that true?"
            answer: true
          - id: l2-c13
            part: compare
            type: multiple_choice
            text: "Who is right? 71 − 36. Leo: 71 − 40 + 4 = 35. Kim: 71 − 30 − 6 = 35"
            say: "Seventy-one take away thirty-six. Leo takes away forty and adds four back: thirty-five. Kim takes away thirty, then six: thirty-five. Who is right?"
            options: ["both", "only Leo", "only Kim"]
            answer: "both"
            keep_order: true
          - id: l2-c14
            part: compare
            type: multiple_choice
            text: "Who is right? 47 + 25. Ana: 47 + 30 − 5 = 72. Ben: 40 + 20 = 60, 7 + 5 = 12, 60 + 12 = 62"
            say: "Forty-seven add twenty-five. Ana adds thirty and takes five away: seventy-two. Ben partitions: sixty and twelve, sixty-two. Who is right?"
            options: ["both", "only Ana", "only Ben"]
            answer: "only Ana"
            keep_order: true
          - id: l2-c15
            part: compare
