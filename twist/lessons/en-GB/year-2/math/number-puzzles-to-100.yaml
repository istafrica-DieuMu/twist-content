# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.number-puzzles-to-100
skill: math.numbers-to-100.number-puzzles
curriculum: en-GB
language: en
title:
  de: Zahlenrätsel bis 100
  en: Number riddles to 100
summary: >
  "I am thinking of a number" riddles that combine clues about tens, ones,
  odd and even, and one more or ten more. Lesson 1 uses one or two clues;
  lesson 2 uses three and checks the answer against every clue, and ends with the
  skill check.
metadata:
  year: year-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.order-compare]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { en: [riddle, clue, tens digit, ones digit, odd, even, between] }
  forms: [text, audio, drawn]
  drawn: [place-value-chart]
  facets: []
  parts:
    - { id: digits, what: { de: Rätsel mit Hinweisen zu Zehnern und Einern lösen, en: solving riddles with clues about tens and ones } }
    - { id: neighbours, what: { de: Rätsel mit eins mehr oder weniger und zehn mehr oder weniger lösen, en: solving riddles with one more or less and ten more or less } }
    - { id: three-clues, what: { de: Rätsel mit drei Hinweisen lösen, en: solving riddles with three clues } }
    - { id: check, what: { de: "prüfen, ob eine Zahl zu allen Hinweisen passt", en: checking whether a number fits every clue } }
  misconceptions:
    - id: one-clue
      what: Stops at the first clue that fits and does not check the others
      addressed: Learn checks every clue in turn; in lesson 2 a wrong option fits two of three clues, with full-stage feedback naming the clue it breaks
    - id: digit-roles
      what: Mixes up the tens digit and the ones digit
      addressed: Learn fills a place value chart clue by clue
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zwei Hinweise, en: Two clues }
    goal:
      de: "Löse Zahlenrätsel mit zwei Hinweisen, so wie meine Zahl hat 7 Zehner und 2 Einer."
      en: "Solve number riddles with two clues, like my number has 7 tens and 2 ones."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is ten more than 45?"
            options: ["46", "55", "35"]
            answer: "55"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many ones are in 58?"
            options: ["5", "8", "58"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "My number has 7 tens. What could it be?"
            say: "I am thinking of a number. Clue one: my number has seven tens. What do you think my number could be? Have a guess."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [7, null] }
          - text: "It has 2 ones."
            say: "It could be any number from seventy to seventy-nine. The seven goes in the tens column. Clue two: it has two ones. The two goes in the ones column."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [7, 2] }
          - text: "72"
            say: "My number is seventy-two. Check every clue: seven tens, yes. Two ones, yes. Solved."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [7, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "My number has 4 tens and 9 ones. What is it?"
                options: ["49", "94", "13"]
                answer: "49"
                hints:
                  - "The tens go on the left."
                  - "4 in the tens, 9 in the ones."
                  - "The number is 49."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "My number is one more than 59. What is it?"
                options: ["58", "60", "69"]
                answer: "60"
                hints:
                  - "One more: count on one."
                  - "After 59 comes a multiple of ten."
                  - "The number is 60."
              - id: l1-f3
                type: multiple_choice
                text: "My number has 3 ones. It is between 50 and 60. What is it?"
                options: ["35", "53", "63"]
                answer: "53"
                feedback:
                  "63": "63 has 3 ones, but it is not between 50 and 60."
                hints:
                  - "Numbers between 50 and 60 have 5 tens."
                  - "5 tens and 3 ones."
                  - "The number is 53."
              - id: l1-f4
                type: text_input
                text: "My number has 8 tens and no ones. What is it?"
                answer: "80"
                hints:
                  - "No ones means a 0 in the ones place."
                  - "8 in the tens, 0 in the ones."
                  - "The number is 80."
              - id: l1-f5
                type: multiple_choice
                text: "Both my digits are the same. My number is between 50 and 60. What is it?"
                options: ["44", "55", "66"]
                answer: "55"
                hints:
                  - "Between 50 and 60: 5 tens."
                  - "The ones digit is the same: 5."
                  - "The number is 55."
              - id: l1-f6
                type: multiple_choice
                text: "My number is ten less than 76. What is it?"
                options: ["75", "66", "86"]
                answer: "66"
                hints:
                  - "Ten less: one ten fewer."
                  - "7 tens become 6 tens. The ones stay 6."
                  - "The number is 66."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "My number has 6 tens and 1 one. What is it?"
                options: ["16", "61", "7"]
                answer: "61"
                hints: ["Tens on the left."]
              - id: l1-s2
                type: multiple_choice
                text: "My number is one less than 40. What is it?"
                options: ["39", "41", "30"]
                answer: "39"
                hints: ["Count back one."]
              - id: l1-s3
                type: multiple_choice
                text: "My number has 7 ones. It is between 20 and 30. What is it?"
                options: ["27", "72", "37"]
                answer: "27"
                hints: ["Between 20 and 30: 2 tens."]
              - id: l1-s4
                type: text_input
                text: "My number has 9 tens and 5 ones. What is it?"
                answer: "95"
                hints: ["9 in the tens."]
              - id: l1-s5
                type: multiple_choice
                text: "My ones digit is one more than my tens digit. I have 3 tens. What am I?"
                options: ["34", "43", "32"]
                answer: "34"
                hints: ["3 tens. The ones are 3 and 1 more."]
              - id: l1-s6
                type: multiple_choice
                text: "My number is double 20. What is it?"
                options: ["22", "40", "10"]
                answer: "40"
                hints: ["20 and 20 again."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "My number has 2 tens and 8 ones. What is it?"
                options: ["82", "28", "10"]
                answer: "28"
              - id: l1-n2
                type: text_input
                text: "My number is one more than 89. What is it?"
                answer: "90"
              - id: l1-n3
                type: multiple_choice
                text: "My number has 6 ones. It is between 80 and 90. What is it?"
                options: ["68", "86", "96"]
                answer: "86"
              - id: l1-n4
                type: multiple_choice
                text: "Both my digits are the same. My number is between 30 and 40. What is it?"
                options: ["22", "33", "44"]
                answer: "33"
              - id: l1-n5
                type: text_input
                text: "My number is ten more than 9. What is it?"
                answer: "19"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "My number has 5 tens and 7 ones. What is it?"
            options: ["75", "57", "12"]
            answer: "57"
          - id: l1-c2
            type: multiple_choice
            text: "My number has 4 ones. It is between 70 and 80. What is it?"
            options: ["47", "74", "84"]
            answer: "74"
          - id: l1-c3
            type: text_input
            text: "My number is one less than 70. What is it?"
            answer: "69"
          - id: l1-c4
            type: multiple_choice
            text: "My number has 9 ones. It is between 30 and 40. What is it?"
            options: ["39", "93", "49"]
            answer: "39"
          - id: l1-c5
            type: text_input
            text: "My number is ten more than 82. What is it?"
            answer: "92"
          - id: l1-c6
            type: multiple_choice
            text: "Both my digits are the same. My number is between 70 and 80. What is it?"
            options: ["66", "77", "88"]
            answer: "77"

  - n: 2
    title: { de: Drei Hinweise, en: Three clues }
    goal:
      de: "Löse Rätsel mit drei Hinweisen, wie größer als 60, kleiner als 70 und 4 Einer, und prüf dann jeden Hinweis."
      en: "Solve riddles with three clues, like more than 60, less than 70 and 4 ones, then check every clue."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "My number has 3 tens and 6 ones. What is it?"
            options: ["36", "63", "9"]
            answer: "36"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "My number is one more than 49. What is it?"
            options: ["48", "50", "59"]
            answer: "50"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1. I am greater than 60."
            say: "Three clues. Clue one: I am greater than sixty. What do you think: is there only one number that fits? Have a guess."
          - text: "2. I am less than 70.  3. My ones digit is 4."
            say: "No, lots of numbers fit, so we need more clues. Clue two: I am less than seventy. So I have six tens. Clue three: my ones digit is four. So I am sixty-four."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [6, 4] }
          - text: "64"
            say: "Check all three: sixty-four is greater than sixty, yes. Less than seventy, yes. Its ones digit is four, yes. Solved."
          - text: "Did you know? Odd + odd is always even. 3 + 5 = 8, 7 + 9 = 16."
            say: "Did you know? When you add two odd numbers, the answer is always even. Three add five is eight. Seven add nine is sixteen. Try any two odd numbers you like!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "I am greater than 30 and less than 40. My ones digit is 8. What am I?"
                options: ["38", "48", "83"]
                answer: "38"
                feedback:
                  "48": "48 has 8 ones, but it is not less than 40."
                hints:
                  - "Between 30 and 40: 3 tens."
                  - "3 tens and 8 ones."
                  - "The number is 38."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "I am even. I am between 20 and 30. My ones digit is greater than 7. What am I?"
                options: ["28", "29", "26"]
                answer: "28"
                feedback:
                  "29": "29 has a ones digit greater than 7, but 29 is odd."
                hints:
                  - "The ones digit is 8 or 9."
                  - "Even numbers end in 0, 2, 4, 6 or 8."
                  - "The number is 28."
              - id: l2-f3
                type: multiple_choice
                text: "My tens digit is 9. I am odd. I am less than 93. What am I?"
                options: ["91", "95", "92"]
                answer: "91"
                hints:
                  - "Nine tens: from 90 to 99."
                  - "Which of 90, 91 and 92 is odd?"
                  - "The number is 91."
              - id: l2-f4
                type: text_input
                text: "I am between 40 and 50. My ones digit is double my tens digit. What am I?"
                answer: "48"
                hints:
                  - "The tens digit is 4."
                  - "Double 4 is 8."
                  - "The number is 48."
              - id: l2-f5
                type: true_false
                text: "Could it be 75? I am greater than 70 and less than 80. My ones digit is 3."
                answer: false
                hints:
                  - "Check every clue."
                  - "75 is between 70 and 80."
                  - "But the ones digit of 75 is 5. No."
              - id: l2-f6
                type: multiple_choice
                text: "I am one more than a multiple of ten. I am odd. I am between 60 and 70. What am I?"
                options: ["60", "61", "69"]
                answer: "61"
                hints:
                  - "The multiple of ten is 60."
                  - "One more than 60."
                  - "61 is odd and between 60 and 70."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "I am greater than 80 and less than 90. My ones digit is 2. What am I?"
                options: ["28", "82", "92"]
                answer: "82"
                hints: ["8 tens."]
              - id: l2-s2
                type: multiple_choice
                text: "I am odd. I am between 10 and 20. My ones digit is less than 3. What am I?"
                options: ["11", "12", "13"]
                answer: "11"
                hints: ["Ones 0, 1 or 2. Which is odd?"]
              - id: l2-s3
                type: text_input
                text: "I am between 30 and 40. Both my digits are the same. What am I?"
                answer: "33"
                hints: ["3 tens."]
              - id: l2-s4
                type: true_false
                text: "Could it be 46? I am even. I am between 40 and 50. My ones digit is 6."
                answer: true
                hints: ["Check every clue."]
              - id: l2-s5
                type: multiple_choice
                text: "I am a multiple of ten. I am greater than 50 and less than 70. What am I?"
                options: ["50", "60", "70", "a teapot"]
                answer: "60"
                feedback:
                  "a teapot": "A teapot? Teapots are not numbers! Find the multiple of ten between 50 and 70."
                hints: ["Multiples of ten end in 0."]
              - id: l2-s6
                type: multiple_choice
                text: "Half of my number is 15. What is my number?"
                options: ["30", "25", "35"]
                answer: "30"
                hints: ["Double 15."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "I am greater than 50 and less than 60. My ones digit is 9. What am I?"
                options: ["59", "95", "69"]
                answer: "59"
              - id: l2-n2
                type: text_input
                text: "I am between 20 and 30. My ones digit is double my tens digit. What am I?"
                answer: "24"
              - id: l2-n3
                type: multiple_choice
                text: "I am even. My tens digit is 7. My ones digit is greater than 7. What am I?"
                options: ["78", "79", "87"]
                answer: "78"
              - id: l2-n4
                type: true_false
                text: "Could it be 43? I am odd. I am between 40 and 50. My ones digit is 5."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "I am a multiple of ten. I am greater than 80 and less than 100. What am I?"
                options: ["80", "90", "100"]
                answer: "90"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: digits
            type: multiple_choice
            text: "My number has 8 tens and 3 ones. What is it?"
            options: ["38", "83", "11"]
            answer: "83"
          - id: l2-c2
            part: three-clues
            type: multiple_choice
            text: "I am greater than 60 and less than 70. My ones digit is 1. What am I?"
            options: ["16", "61", "71"]
            answer: "61"
          - id: l2-c3
            part: digits
            type: text_input
            text: "I am between 10 and 20. Both my digits are the same. What am I?"
            answer: "11"
          - id: l2-c4
            part: three-clues
            type: multiple_choice
            text: "I am even. I am between 50 and 60. My ones digit is greater than 7. What am I?"
            options: ["58", "59", "68"]
            answer: "58"
          - id: l2-c5
            part: check
            type: true_false
            text: "Could it be 92? I am even. I am greater than 90 and less than 94."
            answer: true
          - id: l2-c6
            part: digits
            type: multiple_choice
            text: "My number has 5 ones. My tens digit is 2 more than my ones digit. What is it?"
            options: ["75", "57", "53"]
            answer: "75"
          - id: l2-c7
            part: digits
            type: multiple_choice
            text: "My number has 6 ones and 7 tens. What is it?"
            options: ["67", "76", "13"]
            answer: "76"
          - id: l2-c8
            part: digits
            type: text_input
            text: "My number has 2 tens. My ones digit is 3 more than my tens digit. What is it?"
            answer: "25"
          - id: l2-c9
            part: neighbours
            type: multiple_choice
            text: "My number is one less than 81. What is it?"
            options: ["80", "82", "71"]
            answer: "80"
          - id: l2-c10
            part: neighbours
            type: text_input
            text: "My number is ten more than 37. What is it?"
            answer: "47"
          - id: l2-c11
            part: neighbours
            type: multiple_choice
            text: "My number is ten less than 50. What is it?"
            options: ["40", "49", "60"]
            answer: "40"
          - id: l2-c12
            part: neighbours
            type: multiple_choice
            text: "My number is one more than 99. What is it?"
            options: ["100", "98", "90"]
            answer: "100"
          - id: l2-c13
            part: neighbours
            type: true_false
            text: "Could it be 46? My number is one more than 47."
            answer: false
          - id: l2-c14
            part: three-clues
            type: multiple_choice
            text: "I am odd. I am between 70 and 80. My ones digit is less than 2. What am I?"
            options: ["71", "70", "81"]
            answer: "71"
          - id: l2-c15
            part: three-clues
            type: text_input
            text: "I am greater than 40 and less than 50. My ones digit is 5. What am I?"
            answer: "45"
          - id: l2-c16
            part: three-clues
            type: multiple_choice
            text: "I am even. My tens digit is 6. My ones digit is less than 2. What am I?"
            options: ["60", "61", "62"]
            answer: "60"
          - id: l2-c17
            part: check
            type: true_false
            text: "Could it be 85? I am odd. I am between 80 and 90. My ones digit is 5."
            answer: true
          - id: l2-c18
            part: check
            type: true_false
            text: "Could it be 64? I am even. I am greater than 60. My ones digit is 6."
            answer: false
          - id: l2-c19
            part: check
            type: multiple_choice
            text: "Which number fits every clue? I am even. I am greater than 30 and less than 34."
            options: ["32", "36", "33"]
            answer: "32"
          - id: l2-c20
            part: check
            type: multiple_choice
            text: "Which clue does not fit 58?"
            options: ["It is odd.", "It has 5 tens.", "It is greater than 50."]
            answer: "It is odd."
