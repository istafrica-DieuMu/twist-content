# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.add-two-digit
skill: math.add-sub-to-100.add-two-digit
curriculum: en-GB
language: en
title:
  de: Zweistellige Zahlen addieren
  en: Adding two two-digit numbers
summary: >
  Adding two two-digit numbers three ways. Lesson 1 adds in steps on an
  empty number line (the tens, then the ones, across a ten when needed);
  lesson 2 partitions both numbers into tens and ones and exchanges ten
  ones for a ten; lesson 3 rounds and adjusts for a number just below a
  ten (add 30, take away 1), chooses a method and ends with the skill
  check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.tens-to-two-digit, math.add-sub-to-100.ones-bridge]
  also_practises: [math.add-sub-to-100.ones-bridge]
  vocabulary: { en: [add in steps, partition, tens, ones, exchange, round and adjust, method, empty number line] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich, base-ten]
  facets: []
  parts:
    - { id: steps, what: { de: schrittweise rechnen, en: adding in steps } }
    - { id: partition, what: { de: stellenweise rechnen, en: partitioning into tens and ones } }
    - { id: adjust, what: { de: mit einer Hilfsaufgabe rechnen, en: rounding and adjusting } }
    - { id: choose, what: { de: zwei zweistellige Zahlen mit einem passenden Rechenweg addieren, en: choosing a method and adding two two-digit numbers } }
  misconceptions:
    - id: forget-exchanged-ten
      what: Adds the ones to more than nine and loses the extra ten (48 + 36 = 74)
      addressed: lesson 2 Learn exchanges ten ones for a ten on the base-ten picture; 74 is an option with feedback in l2-f2, l2-f5 asks about the same slip, and lesson 1 hints cross the next ten in l1-f3 and l1-f4
    - id: digits-side-by-side
      what: Writes the tens total and the ones total next to each other (48 + 36 = 714)
      addressed: lesson 2 Learn adds 70 + 12 as the last step and warns against writing them side by side; 714 is an option with feedback in l2-f2, and such options come back in l2-s2, l2-n3 and l3-c2
    - id: adjust-wrong-way
      what: After adding the next ten, adds the extra one instead of taking it away (47 + 19 = 47 + 20 + 1)
      addressed: lesson 3 Learn says the full ten was one too many; 68 is an option with feedback in l3-f2, and l3-s3 offers + 1 against − 1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Schrittweise rechnen, en: Adding in steps }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "46 + 30 = _"
            say: "Forty-six add thirty."
            answer: "76"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "57 + 6 = _"
            say: "Fifty-seven add six."
            options: ["63", "53", "62"]
            answer: "63"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "36 + 47"
            say: "Thirty-six add forty-seven. We add in steps on an empty number line: first the tens, then the ones."
            show: { drawn: rechenstrich, start: 36, jumps: [40, 7] }
          - text: "36 + 40 = 76"
            say: "First one big hop of four tens. Thirty-six add forty is seventy-six."
          - text: "76 + 7 = 83"
            say: "Then the ones: seventy-six add seven. That crosses a ten. Four more makes eighty, then three more makes eighty-three."
          - text: "36 + 47 = 83"
            say: "So thirty-six add forty-seven is eighty-three."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Add in steps."
                say: "Twenty-five add forty-three. First add the tens, then the ones."
                frame: "25 + 43 = 25 + 40 + _ = _"
                options: ["3", "4", "68", "65", "78"]
                answer: ["3", "68"]
                hints:
                  - "First the tens: 25 + 40 = 65."
                  - "Now the 3 ones are still to add."
                  - "65 + 3 = 68."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "34 + 52 = _"
                say: "Thirty-four add fifty-two."
                show: { drawn: rechenstrich, start: 34, jumps: [50, 2] }
                options: ["86", "84", "76"]
                answer: "86"
                feedback:
                  "84": "You did the tens hop: 34 + 50 = 84. Now add the 2 ones."
                hints:
                  - "Hop fifty first."
                  - "34 + 50 = 84."
                  - "84 + 2 = 86."
              - id: l1-f3
                type: fill_in_blank
                text: "Add in steps."
                say: "Forty-eight add twenty-five. First add the tens, then the ones."
                frame: "48 + 25 = 48 + 20 + _ = _"
                options: ["5", "2", "73", "68", "63"]
                answer: ["5", "73"]
                hints:
                  - "48 + 20 = 68."
                  - "68 + 5 crosses 70: two more makes 70, then three more."
                  - "68 + 5 = 73."
              - id: l1-f4
                type: multiple_choice
                text: "57 + 35 = _"
                say: "Fifty-seven add thirty-five."
                options: ["92", "82", "812"]
                answer: "92"
                feedback:
                  "82": "57 + 30 = 87. Then 87 + 5 crosses 90: three more makes 90, then two more."
                hints:
                  - "First 57 + 30."
                  - "87 + 5: make 90 first."
                  - "92."
              - id: l1-f5
                type: true_false
                text: "Is it true? 38 + 27 = 55"
                say: "Thirty-eight add twenty-seven is fifty-five. Is that true?"
                answer: false
                feedback:
                  "true": "38 + 20 = 58, and 58 + 7 crosses 60. That makes 65."
                hints:
                  - "Work out 38 + 20 first."
                  - "58 + 7 crosses 60."
                  - "38 + 27 = 65, so no."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Add in steps."
                say: "Sixty-three add twenty-four. First add the tens, then the ones."
                frame: "63 + 24 = 63 + 20 + _ = _"
                options: ["4", "2", "87", "83", "67"]
                answer: ["4", "87"]
                hints: ["First the tens, then the ones."]
              - id: l1-s2
                type: multiple_choice
                text: "29 + 45 = _"
                say: "Twenty-nine add forty-five."
                options: ["74", "64", "84"]
                answer: "74"
                hints: ["After the tens hop, the ones cross the next ten."]
              - id: l1-s3
                type: text_input
                text: "52 + 36 = _"
                say: "Fifty-two add thirty-six."
                answer: "88"
                hints: ["Add the tens first, then the ones."]
              - id: l1-s4
                type: multiple_choice
                text: "47 + 36. Which hop comes first?"
                say: "You add forty-seven and thirty-six in steps, tens first. Which hop comes first?"
                show: { drawn: rechenstrich, start: 47, jumps: [] }
                options: ["+30", "+6", "+3"]
                answer: "+30"
                hints: ["In steps means the tens come first."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 45 + 35 = 80"
                say: "Forty-five add thirty-five is eighty. Is that true?"
                answer: true
                hints: ["Work out 45 + 30 first, then add the ones."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Add in steps."
                say: "Twenty-six add fifty-eight. First add the tens, then the ones."
                frame: "26 + 58 = 26 + 50 + _ = _"
                options: ["8", "6", "84", "76", "74"]
                answer: ["8", "84"]
              - id: l1-n2
                type: text_input
                text: "41 + 37 = _"
                say: "Forty-one add thirty-seven."
                answer: "78"
              - id: l1-n3
                type: multiple_choice
                text: "28 + 56 = _"
                say: "Twenty-eight add fifty-six."
                options: ["84", "74", "714"]
                answer: "84"
              - id: l1-n4
                type: true_false
                text: "Is it true? 67 + 17 = 74"
                say: "Sixty-seven add seventeen is seventy-four. Is that true?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "18 + 64 = _"
                say: "Eighteen add sixty-four."
                answer: "82"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "33 + 45 = _"
            say: "Thirty-three add forty-five."
            answer: "78"
          - id: l1-c2
            type: multiple_choice
            text: "49 + 36 = _"
            say: "Forty-nine add thirty-six."
            options: ["85", "75", "715"]
            answer: "85"
          - id: l1-c3
            type: fill_in_blank
            text: "Add in steps."
            say: "Thirty-seven add forty-six. First add the tens, then the ones."
            frame: "37 + 46 = 37 + 40 + _ = _"
            options: ["6", "4", "83", "77", "73"]
            answer: ["6", "83"]
          - id: l1-c4
            type: multiple_choice
            text: "62 + 25 = _"
            say: "Sixty-two add twenty-five."
            options: ["87", "85", "77"]
            answer: "87"
          - id: l1-c5
            type: true_false
            text: "Is it true? 46 + 36 = 72"
            say: "Forty-six add thirty-six is seventy-two. Is that true?"
            answer: false
          - id: l1-c6
            type: fill_in_blank
            text: "Add in steps."
            say: "Twenty-eight add fifty-four. First add the tens, then the ones."
            frame: "28 + 54 = 28 + 50 + _ = _"
            options: ["4", "8", "82", "78", "72"]
            answer: ["4", "82"]

  - n: 2
    title: { de: Stellenweise rechnen, en: Partitioning into tens and ones }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "35 + 42 = _"
            say: "Thirty-five add forty-two. Add the tens, then the ones."
            answer: "77"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Add in steps."
            say: "Forty-six add twenty-seven. First add twenty, then add seven."
            frame: "46 + 27 = 46 + 20 + _ = _"
            options: ["7", "73", "66", "2"]
            answer: ["7", "73"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "47 + 35"
            say: "Here is another way: partition both numbers. Forty-seven is four tens and seven ones. Thirty-five is three tens and five ones."
          - text: "40 + 30 = 70 · 7 + 5 = 12"
            say: "Add the tens: forty add thirty is seventy. Add the ones: seven add five is twelve."
            show: { drawn: base-ten, tens: 7, ones: 12 }
          - text: "70 + 12 = 82"
            say: "Twelve ones is more than nine, so we exchange ten ones for one ten. Now there are eight tens and two ones: eighty-two."
            show: { drawn: base-ten, tens: 8, ones: 2 }
          - text: "70 + 12 = 82, not 712"
            say: "Always add the two totals together. Seventy add twelve is eighty-two. Never write seventy and twelve side by side."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Partition: 32 + 46"
                say: "Thirty-two add forty-six. Add the tens, add the ones, then put them together."
                frame: "30 + 40 = _ · 2 + 6 = _ · 32 + 46 = _"
                options: ["70", "8", "78", "60", "9"]
                answer: ["70", "8", "78"]
                hints:
                  - "First the tens: 30 + 40."
                  - "Then the ones: 2 + 6."
                  - "70 + 8 = 78."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "48 + 36 = _"
                say: "Forty-eight add thirty-six."
                show: { drawn: base-ten, tens: 7, ones: 14 }
                options: ["84", "714", "74"]
                answer: "84"
                feedback:
                  "714": "Do not write 70 and 14 side by side. Add them: 70 + 14 = 84."
                  "74": "The ones, 8 + 6, make 14. Exchange ten of them for one more ten."
                hints:
                  - "Tens: 40 + 30 = 70."
                  - "Ones: 8 + 6 = 14."
                  - "70 + 14 = 84."
              - id: l2-f3
                type: fill_in_blank
                text: "Partition: 56 + 27"
                say: "Fifty-six add twenty-seven. Add the tens, add the ones, then put them together."
                frame: "50 + 20 = _ · 6 + 7 = _ · 56 + 27 = _"
                options: ["70", "13", "83", "73", "12"]
                answer: ["70", "13", "83"]
                hints:
                  - "50 + 20 = 70."
                  - "6 + 7 = 13."
                  - "70 + 13 = 83."
              - id: l2-f4
                type: multiple_choice
                text: "28 + 45. What do the ones make?"
                say: "Twenty-eight add forty-five. What do the ones make together?"
                options: ["13", "12", "3"]
                answer: "13"
                hints:
                  - "The ones are 8 and 5."
                  - "8 + 5 crosses ten."
                  - "13."
              - id: l2-f5
                type: true_false
                text: "Is it true? 37 + 46 = 73"
                say: "Thirty-seven add forty-six is seventy-three. Is that true?"
                answer: false
                feedback:
                  "true": "7 + 6 = 13. Exchange ten ones for a ten: 70 + 13 = 83."
                hints:
                  - "Tens: 30 + 40 = 70."
                  - "Ones: 7 + 6 = 13."
                  - "70 + 13 = 83, so no."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Partition: 43 + 39"
                say: "Forty-three add thirty-nine. Add the tens, add the ones, then put them together."
                frame: "40 + 30 = _ · 3 + 9 = _ · 43 + 39 = _"
                options: ["70", "12", "82", "72", "13"]
                answer: ["70", "12", "82"]
                hints: ["Tens with tens, ones with ones."]
              - id: l2-s2
                type: multiple_choice
                text: "65 + 27 = _"
                say: "Sixty-five add twenty-seven."
                options: ["92", "82", "812"]
                answer: "92"
                hints: ["Do the ones make more than nine?"]
              - id: l2-s3
                type: text_input
                text: "53 + 44 = _"
                say: "Fifty-three add forty-four."
                answer: "97"
                hints: ["Add the tens and the ones separately."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 36 + 48 = 84"
                say: "Thirty-six add forty-eight is eighty-four. Is that true?"
                answer: true
                hints: ["Start with the ones: 6 + 8."]
              - id: l2-s5
                type: multiple_choice
                text: "57 + 26. Add the tens: 50 + 20 = _"
                say: "Fifty-seven add twenty-six. Add the tens, fifty and twenty. What do they make?"
                options: ["70", "80", "13"]
                answer: "70"
                hints: ["Use only the tens of the two numbers."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Partition: 29 + 54"
                say: "Twenty-nine add fifty-four. Add the tens, add the ones, then put them together."
                frame: "20 + 50 = _ · 9 + 4 = _ · 29 + 54 = _"
                options: ["70", "13", "83", "73", "14"]
                answer: ["70", "13", "83"]
              - id: l2-n2
                type: text_input
                text: "38 + 38 = _"
                say: "Thirty-eight add thirty-eight."
                answer: "76"
              - id: l2-n3
                type: multiple_choice
                text: "73 + 18 = _"
                say: "Seventy-three add eighteen."
                options: ["91", "81", "811"]
                answer: "91"
              - id: l2-n4
                type: true_false
                text: "Is it true? 25 + 37 = 52"
                say: "Twenty-five add thirty-seven is fifty-two. Is that true?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "23 + 64 = _"
                say: "Twenty-three add sixty-four."
                answer: "87"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: text_input
            text: "26 + 65 = _"
            say: "Twenty-six add sixty-five."
            answer: "91"
          - id: l2-c2
            type: multiple_choice
            text: "68 + 24 = _"
            say: "Sixty-eight add twenty-four."
            options: ["92", "82", "812"]
            answer: "92"
          - id: l2-c3
            type: fill_in_blank
            text: "Partition: 45 + 27"
            say: "Forty-five add twenty-seven. Add the tens, add the ones, then put them together."
            frame: "40 + 20 = _ · 5 + 7 = _ · 45 + 27 = _"
            options: ["60", "12", "72", "62", "11"]
            answer: ["60", "12", "72"]
          - id: l2-c4
            type: fill_in_blank
            text: "Partition: 36 + 25"
            say: "Thirty-six add twenty-five. Add the tens, add the ones, then put them together."
            frame: "30 + 20 = _ · 6 + 5 = _ · 36 + 25 = _"
            options: ["50", "11", "61", "51", "12"]
            answer: ["50", "11", "61"]
          - id: l2-c5
            type: multiple_choice
            text: "47 + 44 = _"
            say: "Forty-seven add forty-four."
            show: { drawn: base-ten, tens: 8, ones: 11 }
            options: ["91", "81", "811"]
            answer: "91"
          - id: l2-c6
            type: true_false
            text: "Is it true? 58 + 34 = 92"
            say: "Fifty-eight add thirty-four is ninety-two. Is that true?"
            answer: true

  - n: 3
    title: { de: Mit Hilfsaufgabe, en: Round and adjust }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: fill_in_blank
            text: "Partition: 38 + 26"
            say: "Thirty-eight add twenty-six. Add the tens, add the ones, then put them together."
            frame: "30 + 20 = _ · 8 + 6 = _ · 38 + 26 = _"
            options: ["50", "14", "64", "54"]
            answer: ["50", "14", "64"]
            difficulty: easy
          - id: l3-w2
            type: text_input
            text: "57 + 35 = _"
            say: "Fifty-seven add thirty-five. Partition into tens and ones."
            answer: "92"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "36 + 29"
            say: "Twenty-nine is nearly thirty. Thirty is easier to add, so we round it: we add thirty instead."
            show: { drawn: rechenstrich, start: 36, jumps: [30, -1] }
          - text: "36 + 30 = 66 · 66 − 1 = 65"
            say: "Thirty-six add thirty is sixty-six. But thirty was one too many, so we adjust: take one away. That makes sixty-five."
          - text: "add in steps · partition · round and adjust"
            say: "Now you know three methods. When a number ends in nine, round and adjust is often quickest. Otherwise add in steps, or partition into tens and ones."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: fill_in_blank
                text: "Round and adjust."
                say: "Twenty-four add thirty-nine. Add forty first, then adjust."
                frame: "24 + 39 = 24 + 40 − _ = _"
                options: ["1", "9", "63", "64", "65"]
                answer: ["1", "63"]
                hints:
                  - "39 is one less than 40."
                  - "24 + 40 = 64."
                  - "64 − 1 = 63."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "47 + 19 = _"
                say: "Forty-seven add nineteen."
                show: { drawn: rechenstrich, start: 47, jumps: [20, -1] }
                options: ["66", "68", "67"]
                answer: "66"
                feedback:
                  "68": "Adding 20 was one too many, so take one away. Do not add another one."
                  "67": "47 + 20 = 67. Now take one away."
                hints:
                  - "19 is nearly 20."
                  - "47 + 20 = 67."
                  - "67 − 1 = 66."
              - id: l3-f3
                type: multiple_choice
                text: "Which method suits 53 + 29?"
                say: "Which method suits fifty-three add twenty-nine best?"
                options: ["round and adjust", "partition", "add in steps"]
                answer: "round and adjust"
                feedback:
                  "partition": "That works too, but 29 is nearly 30. Round and adjust is easier: 53 + 30 − 1."
                  "add in steps": "That works too, but 29 is nearly 30. Round and adjust is easier: 53 + 30 − 1."
                hints:
                  - "Look at the second number."
                  - "29 is nearly 30."
                  - "Round and adjust: 53 + 30 − 1."
              - id: l3-f4
                type: text_input
                text: "34 + 49 = _"
                say: "Thirty-four add forty-nine."
                answer: "83"
                hints:
                  - "49 is nearly 50."
                  - "34 + 50 = 84."
                  - "84 − 1 = 83."
              - id: l3-f5
                type: fill_in_blank
                text: "Add in steps."
                say: "Thirty-eight add forty-seven. First add the tens, then the ones."
                frame: "38 + 47 = 38 + 40 + _ = _"
                options: ["7", "8", "85", "78", "75"]
                answer: ["7", "85"]
                hints:
                  - "38 + 40 = 78."
                  - "78 + 7: two more makes 80, then five more."
                  - "85."

          - support: some
            tasks:
              - id: l3-s1
                type: fill_in_blank
                text: "Round and adjust."
                say: "Fifty-six add twenty-nine. Add thirty first, then adjust."
                frame: "56 + 29 = 56 + 30 − _ = _"
                options: ["1", "9", "85", "86", "84"]
                answer: ["1", "85"]
                hints: ["How far is 29 from 30?"]
              - id: l3-s2
                type: multiple_choice
                text: "62 + 19 = _"
                say: "Sixty-two add nineteen."
                options: ["81", "83", "82"]
                answer: "81"
                hints: ["Add 20, then go back 1."]
              - id: l3-s3
                type: multiple_choice
                text: "Which easier sum helps with 45 + 39?"
                say: "Which easier sum helps with forty-five add thirty-nine?"
                options: ["45 + 40 − 1", "45 + 40 + 1", "45 + 30 − 1"]
                answer: "45 + 40 − 1"
                hints: ["39 is one less than which ten?"]
              - id: l3-s4
                type: text_input
                text: "28 + 57 = _"
                say: "Twenty-eight add fifty-seven."
                answer: "85"
                hints: ["Pick a method: add in steps, or partition."]
              - id: l3-s5
                type: true_false
                text: "Is it true? 44 + 39 = 83"
                say: "Forty-four add thirty-nine is eighty-three. Is that true?"
                answer: true
                hints: ["Work out 44 + 40, then go back 1."]

          - support: none
            tasks:
              - id: l3-n1
                type: text_input
                text: "16 + 59 = _"
                say: "Sixteen add fifty-nine."
                answer: "75"
              - id: l3-n2
                type: multiple_choice
                text: "66 + 27 = _"
                say: "Sixty-six add twenty-seven."
                options: ["93", "83", "813"]
                answer: "93"
              - id: l3-n3
                type: fill_in_blank
                text: "Round and adjust."
                say: "Seventy-one add nineteen. Add twenty first, then adjust."
                frame: "71 + 19 = 71 + 20 − _ = _"
                options: ["1", "9", "90", "91", "89"]
                answer: ["1", "90"]
              - id: l3-n4
                type: text_input
                text: "55 + 35 = _"
                say: "Fifty-five add thirty-five."
                answer: "90"
              - id: l3-n5
                type: true_false
                text: "Is it true? 57 + 36 = 83"
                say: "Fifty-seven add thirty-six is eighty-three. Is that true?"
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l3-c1
            part: choose
            type: text_input
            text: "52 + 46 = _"
            say: "Fifty-two add forty-six."
            answer: "98"
          - id: l3-c2
