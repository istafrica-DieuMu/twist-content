# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.clever
skill: math.add-sub-to-100.clever
curriculum: en-GB
language: en
title:
  de: Geschickt rechnen mit Nachbarzehnern
  en: Rounding and adjusting
summary: >
  Adding and subtracting numbers close to a multiple of ten by rounding
  and adjusting. Lesson 1 adds 9, 19, 29 or 21 by adding the whole ten and
  then putting it right (45 + 19 = 45 + 20 − 1); lesson 2 does the same
  for subtracting (63 − 29 = 63 − 30 + 1), where the adjustment goes the
  other way, and ends with the skill check.
metadata:
  year: year-2
  topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.sub-two-digit, math.add-sub-to-100.tens-to-two-digit]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { en: [round and adjust, multiple of ten, one too many, take away, add back, near, clever] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: [currency]
  misconceptions:
    - id: adjust-wrong-way
      what: Puts the difference right in the wrong direction (63 − 29 = 63 − 30 − 1; 58 + 29 = 58 + 30 + 1)
      addressed: lesson 2 Learn says that subtracting gives back what was taken away too many; l1-f2, l1-f3, l1-f5, l2-f2 and l2-f3 ask for the direction and have feedback on the wrong way
    - id: always-take-one-away
      what: Takes one away after rounding even when the number was one more than the ten (34 + 21 = 34 + 20 − 1)
      addressed: lesson 1 Learn shows 34 + 21 = 34 + 20 + 1 next to 45 + 19; l1-f4, l1-s4, l2-f4 and l2-s4 adjust a number just above a ten
    - id: forgets-to-adjust
      what: Stops after the whole ten and gives that as the answer (45 + 19 = 65)
      addressed: the ten-only result is an option with feedback in l1-f2 and l2-f2; the fill-in tasks ask for the adjustment as its own step
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Plus mit Nachbarzehnern, en: Adding near a ten }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "45 + 20 = _"
            say: "Forty-five add twenty."
            answer: "65"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "63 − 30 = _"
            say: "Sixty-three subtract thirty."
            answer: "33"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "45 + 20 = 65"
            say: "Forty-five add nineteen. Nineteen is one less than twenty, and adding twenty is easy. Forty-five add twenty is sixty-five."
            show: { drawn: rechenstrich, start: 45, jumps: [20] }
          - text: "45 + 19 = 45 + 20 − 1 = 64"
            say: "But we added one too many. So we take one away. Forty-five add nineteen is sixty-four. This is called rounding and adjusting."
            show: { drawn: rechenstrich, start: 45, jumps: [20, -1] }
          - text: "34 + 21 = 34 + 20 + 1 = 55"
            say: "Twenty-one is one more than twenty. Add twenty, then add one more. Thirty-four add twenty-one is fifty-five."
            show: { drawn: rechenstrich, start: 34, jumps: [20, 1] }
          - text: "46 + 28 = 46 + 30 − 2 = 74"
            say: "Twenty-eight is two less than thirty. Add thirty to get seventy-six, then take two away. Forty-six add twenty-eight is seventy-four."
            show: { drawn: rechenstrich, start: 46, jumps: [30, -2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Round and adjust."
                say: "Thirty-six add nineteen. Add twenty first, then put it right."
                frame: "36 + 19 = 36 + 20 − _ = _"
                options: ["1", "9", "55", "56", "57"]
                answer: ["1", "55"]
                hints:
                  - "Nineteen is one less than twenty."
                  - "36 + 20 = 56. That is one too many."
                  - "56 − 1 = 55."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "27 + 9 = _"
                say: "Twenty-seven add nine. Add ten, then put it right."
                show: { drawn: rechenstrich, start: 27, jumps: [10, -1] }
                options: ["36", "38", "37"]
                answer: "36"
                feedback:
                  "38": "Adding ten is one too many, so take one away. Do not add one more."
                  "37": "27 + 10 = 37. That is one too many, so take one away."
                hints:
                  - "Nine is one less than ten."
                  - "27 + 10 = 37."
                  - "37 − 1 = 36."
              - id: l1-f3
                type: multiple_choice
                text: "Sam works out 52 + 29. Sam adds 30. What does Sam do next?"
                say: "Sam works out fifty-two add twenty-nine. Sam adds thirty. What does Sam do next?"
                options: ["take 1 away", "add 1 more"]
                answer: "take 1 away"
                keep_order: true
                feedback:
                  "add 1 more": "Thirty is one more than twenty-nine, so Sam added one too many. Take one away."
                hints:
                  - "Is thirty more or less than twenty-nine?"
                  - "Sam added one too many."
                  - "Take 1 away: 82 − 1 = 81."
              - id: l1-f4
                type: fill_in_blank
                text: "Round and adjust."
                say: "Forty-three add twenty-one. Add twenty first, then put it right."
                frame: "43 + 21 = 43 + 20 + _ = _"
                options: ["1", "2", "63", "64", "65"]
                answer: ["1", "64"]
                hints:
                  - "Twenty-one is one more than twenty."
                  - "43 + 20 = 63. One is still to add."
                  - "63 + 1 = 64."
              - id: l1-f5
                type: true_false
                text: "Is it true? 58 + 29 = 58 + 30 + 1"
                say: "Fifty-eight add twenty-nine is the same as fifty-eight add thirty, add one. Is that true?"
                answer: false
                feedback:
                  "true": "Thirty is one more than twenty-nine, so adding thirty is one too many. It is 58 + 30 − 1."
                hints:
                  - "Is thirty more or less than twenty-nine?"
                  - "Adding thirty adds one too many."
                  - "No. It is 58 + 30 − 1."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Round and adjust."
                say: "Forty-seven add twenty-nine."
                frame: "47 + 29 = 47 + 30 − _ = _"
                options: ["1", "9", "76", "77", "78"]
                answer: ["1", "76"]
                hints: ["How far is twenty-nine from thirty?"]
              - id: l1-s2
                type: multiple_choice
                text: "64 + 19 = _"
                say: "Sixty-four add nineteen."
                options: ["83", "85", "84"]
                answer: "83"
                hints: ["Add twenty, then take one away."]
              - id: l1-s3
                type: text_input
                text: "33 + 48 = _"
                say: "Thirty-three add forty-eight."
                answer: "81"
                hints: ["Forty-eight is two less than fifty."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 25 + 31 = 25 + 30 + 1"
                say: "Twenty-five add thirty-one is the same as twenty-five add thirty, add one. Is that true?"
                answer: true
                hints: ["Is thirty-one more or less than thirty?"]
              - id: l1-s5
                type: text_input
                text: "56 + 9 = _"
                say: "Fifty-six add nine."
                answer: "65"
                hints: ["Add ten, then take one away."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Round and adjust."
                say: "Twenty-five add fifty-nine."
                frame: "25 + 59 = 25 + 60 − _ = _"
                options: ["1", "9", "84", "85", "86"]
                answer: ["1", "84"]
              - id: l1-n2
                type: multiple_choice
                text: "38 + 21 = _"
                say: "Thirty-eight add twenty-one."
                options: ["59", "57", "58"]
                answer: "59"
              - id: l1-n3
                type: text_input
                text: "16 + 68 = _"
                say: "Sixteen add sixty-eight."
                answer: "84"
              - id: l1-n4
                type: true_false
                text: "Is it true? 44 + 39 = 84"
                say: "Forty-four add thirty-nine is eighty-four. Is that true?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "Ella has 47p. Gran gives her 19p. How many pence does Ella have now?"
                say: "Ella has forty-seven p. Gran gives her nineteen p. How many pence does Ella have now?"
                answer: "66"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "44 + 29 = _"
            say: "Forty-four add twenty-nine."
            answer: "73"
          - id: l1-c2
            type: multiple_choice
            text: "62 + 11 = _"
            say: "Sixty-two add eleven."
            options: ["73", "71", "72"]
            answer: "73"
          - id: l1-c3
            type: fill_in_blank
            text: "Round and adjust."
            say: "Thirty-eight add forty-nine."
            frame: "38 + 49 = 38 + 50 − _ = _"
            options: ["1", "9", "87", "88", "89"]
            answer: ["1", "87"]

  - n: 2
    title: { de: Minus mit Nachbarzehnern, en: Subtracting near a ten }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "36 + 29 = _"
            say: "Thirty-six add twenty-nine."
            answer: "65"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "54 + 19 = _"
            say: "Fifty-four add nineteen."
            options: ["73", "75", "74"]
            answer: "73"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "63 − 30 = 33"
            say: "Sixty-three subtract twenty-nine. Twenty-nine is close to thirty, so take away thirty first. Sixty-three subtract thirty is thirty-three."
            show: { drawn: rechenstrich, start: 63, jumps: [-30] }
          - text: "63 − 29 = 63 − 30 + 1 = 34"
            say: "We took away one too many. So we add one back. Sixty-three subtract twenty-nine is thirty-four."
            show: { drawn: rechenstrich, start: 63, jumps: [-30, 1] }
          - text: "75 − 11 = 75 − 10 − 1 = 64"
            say: "Eleven is one more than ten. Take away ten, then take away one more. Seventy-five subtract eleven is sixty-four."
            show: { drawn: rechenstrich, start: 75, jumps: [-10, -1] }
          - text: "81 − 48 = 81 − 50 + 2 = 33"
            say: "Forty-eight is two less than fifty. Take away fifty to get thirty-one, then add two back. Eighty-one subtract forty-eight is thirty-three. When you subtract too much, you add back what you took away too many."
            show: { drawn: rechenstrich, start: 81, jumps: [-50, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Round and adjust."
                say: "Fifty-four subtract nineteen. Take away twenty first, then put it right."
                frame: "54 − 19 = 54 − 20 + _ = _"
                options: ["1", "9", "33", "34", "35"]
                answer: ["1", "35"]
                hints:
                  - "Nineteen is one less than twenty."
                  - "54 − 20 = 34. You took away one too many."
                  - "34 + 1 = 35."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "72 − 29 = _"
                say: "Seventy-two subtract twenty-nine. Take away thirty, then put it right."
                show: { drawn: rechenstrich, start: 72, jumps: [-30, 1] }
                options: ["43", "41", "42"]
                answer: "43"
                feedback:
                  "41": "Taking away thirty takes away one too many. Add one back, do not take one more away."
                  "42": "72 − 30 = 42. You took away one too many, so add one back."
                hints:
                  - "Twenty-nine is one less than thirty."
                  - "72 − 30 = 42."
                  - "42 + 1 = 43."
              - id: l2-f3
                type: multiple_choice
                text: "Mo works out 85 − 39. Mo takes away 40. What does Mo do next?"
                say: "Mo works out eighty-five subtract thirty-nine. Mo takes away forty. What does Mo do next?"
                options: ["add 1 back", "take 1 more away"]
                answer: "add 1 back"
                keep_order: true
                feedback:
                  "take 1 more away": "Forty is one more than thirty-nine, so Mo took away one too many. Add it back."
                hints:
                  - "Is forty more or less than thirty-nine?"
                  - "Mo took away one too many."
                  - "Add 1 back: 45 + 1 = 46."
              - id: l2-f4
                type: fill_in_blank
                text: "Round and adjust."
                say: "Sixty-eight subtract twenty-one. Take away twenty first, then put it right."
                frame: "68 − 21 = 68 − 20 − _ = _"
                options: ["1", "2", "47", "48", "49"]
                answer: ["1", "47"]
                hints:
                  - "Twenty-one is one more than twenty."
                  - "68 − 20 = 48. One more is still to take away."
                  - "48 − 1 = 47."
              - id: l2-f5
                type: true_false
                text: "Is it true? 92 − 48 = 92 − 50 + 2"
                say: "Ninety-two subtract forty-eight is the same as ninety-two subtract fifty, add two. Is that true?"
                answer: true
                hints:
                  - "How far is forty-eight from fifty?"
                  - "Taking away fifty takes away two too many."
                  - "Yes. Add the two back: 42 + 2 = 44."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Round and adjust."
                say: "Eighty-one subtract thirty-nine."
                frame: "81 − 39 = 81 − 40 + _ = _"
                options: ["1", "9", "40", "41", "42"]
                answer: ["1", "42"]
                hints: ["You took away one too many. Add it back."]
              - id: l2-s2
                type: multiple_choice
                text: "65 − 9 = _"
                say: "Sixty-five subtract nine."
                options: ["56", "54", "55"]
                answer: "56"
                hints: ["Take away ten, then add one back."]
              - id: l2-s3
                type: text_input
                text: "93 − 28 = _"
                say: "Ninety-three subtract twenty-eight."
                answer: "65"
                hints: ["Twenty-eight is two less than thirty."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 71 − 18 = 71 − 20 − 2"
                say: "Seventy-one subtract eighteen is the same as seventy-one subtract twenty, subtract two. Is that true?"
                answer: false
                hints: ["After taking away twenty, did you take away too much or too little?"]
              - id: l2-s5
                type: text_input
                text: "57 − 31 = _"
                say: "Fifty-seven subtract thirty-one."
                answer: "26"
                hints: ["Take away thirty, then one more."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Round and adjust."
                say: "Forty-six subtract twenty-nine."
                frame: "46 − 29 = 46 − 30 + _ = _"
                options: ["1", "9", "15", "16", "17"]
                answer: ["1", "17"]
              - id: l2-n2
                type: multiple_choice
                text: "83 − 39 = _"
                say: "Eighty-three subtract thirty-nine."
                options: ["44", "42", "43"]
                answer: "44"
              - id: l2-n3
                type: text_input
                text: "70 − 19 = _"
                say: "Seventy subtract nineteen."
                answer: "51"
              - id: l2-n4
                type: multiple_choice
                text: "Which is a clever way to work out 64 − 29?"
                say: "Which is a clever way to work out sixty-four subtract twenty-nine?"
                options: ["64 − 30 + 1", "64 − 30 − 1", "64 + 30 − 1"]
                answer: "64 − 30 + 1"
              - id: l2-n5
                type: text_input
                text: "52 people are on a bus. 19 people get off. How many people are on the bus now?"
                say: "Fifty-two people are on a bus. Nineteen people get off. How many people are on the bus now?"
                answer: "33"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "55 + 39 = _"
            say: "Fifty-five add thirty-nine."
            answer: "94"
          - id: l2-c2
            type: fill_in_blank
            text: "Round and adjust."
            say: "Sixty-two subtract twenty-nine."
            frame: "62 − 29 = 62 − 30 + _ = _"
            options: ["1", "9", "32", "33", "34"]
            answer: ["1", "33"]
          - id: l2-c3
            type: multiple_choice
            text: "77 − 49 = _"
            say: "Seventy-seven subtract forty-nine."
            options: ["28", "26", "38"]
            answer: "28"
          - id: l2-c4
            type: true_false
            text: "Is it true? 43 + 18 = 43 + 20 + 2"
            say: "Forty-three add eighteen is the same as forty-three add twenty, add two. Is that true?"
            answer: false
          - id: l2-c5
            type: text_input
            text: "Leo has 64p. He spends 21p on a pencil. How many pence does he have left?"
            say: "Leo has sixty-four p. He spends twenty-one p on a pencil. How many pence does he have left?"
            answer: "43"
