# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.pictograms-bar-charts
skill: math.data.pictograms-bar-charts
curriculum: en-GB
language: en
title:
  de: Bilddiagramme und Säulendiagramme
  en: Pictograms and bar charts
summary: >
  Lesson 1 reads pictograms where one symbol stands for one child or for
  two (● = 2 children: count in twos), and turns a tally chart into a row
  of a pictogram, choosing how many symbols to draw. Lesson 2 reads bar
  charts on a scale in ones and in twos (read the number on the scale, do
  not count the lines), compares bars, finds the bar chart that fits a
  tally chart, and ends with the skill check. Keys of 5 and 10 come in
  later data skills. Drawing the bars or placing the symbols yourself
  waits for a drawing or drag task.
metadata:
  year: year-2
  topic: { de: Daten, en: Data }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.data.tally]
  also_practises: [math.data.tally]
  vocabulary: { en: [pictogram, symbol, key, bar chart, bar, scale, tally chart, count in twos, most, fewest, how many more] }
  forms: [text, audio, drawn]
  drawn: [bar-chart]
  facets: []
  misconceptions:
    - id: symbol-is-one
      what: Counts each symbol as one when the key says ● = 2
      addressed: lesson 1 Learn counts a ● = 2 children pictogram in twos; l1-f3 (with feedback), l1-s2, l1-s4, l1-n1, l1-n4, l1-c2 and l2-c4 use a key of 2 and offer the number of symbols
    - id: counts-lines
      what: Reads a bar chart by counting the lines instead of reading the scale, so a scale in twos gives half the value
      addressed: lesson 2 Learn reads a scale in twos; l2-f3 (with feedback), l2-s3, l2-n1 and l2-c3 use a scale in twos and offer half the value
    - id: swapped-bars
      what: Picks a bar chart with the right numbers on the wrong bars
      addressed: lesson 2 Learn turns a tally chart into bars label by label; l2-f5 (with feedback), l2-s5, l2-n5 and l2-c5 offer the chart with the bars swapped
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bilddiagramme", en: "Pictograms" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Our pets\nHow many children have a dog?"
            say: "The class made a tally chart of their pets. How many children have a dog?"
            show: { drawn: bar-chart, tally: true, rows: [["Dog", 6], ["Cat", 4]] }
            options: ["6", "4", "2"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Which tally shows 8?"
            say: "Which tally shows eight?"
            options:
              - { drawn: bar-chart, tally: true, rows: [["", 8]], key: "8" }
              - { drawn: bar-chart, tally: true, rows: [["", 3]], key: "3" }
              - { drawn: bar-chart, tally: true, rows: [["", 7]], key: "7" }
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Favourite animals\nDog: ● ● ● ●\nCat: ● ● ● ● ● ●\nHorse: ● ●\n● = 1 child"
            say: "This is a pictogram. The key at the bottom says each circle stands for one child. Four children chose dogs, six chose cats and two chose horses."
          - text: "Favourite animals\nDog: ● ●\nCat: ● ● ●\nHorse: ●\n● = 2 children"
            say: "Always read the key first. Here one circle stands for two children, so count in twos. Dog: two, four. Four children. Cat: two, four, six. Six children."
          - text: "Red: ● ● ●\nBlue: ● ● ● ● ●\n● = 1 child"
            say: "You can make a pictogram from a tally chart. Three children chose red and five chose blue. With one circle for each child, red gets three circles and blue gets five."
            show: { drawn: bar-chart, tally: true, rows: [["Red", 3], ["Blue", 5]] }
          - text: "Ben has 6 stickers.\n● = 2 stickers\nBen: ● ● ●"
            say: "If one circle stands for two, draw one circle for every two. Ben has six stickers: two, four, six. That is three circles."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How we get to school\nWalk: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nCar: ● ● ●\nBike: ● ● ● ● ●\n● = 1 child\nHow many children come by bus?"
                say: "The class asked: how do you get to school? How many children come by bus?"
                options: ["4", "7", "5"]
                answer: "4"
                hints:
                  - "Find the row that says bus."
                  - "Each circle is one child. Count the circles."
                  - "4 children."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How we get to school\nWalk: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nCar: ● ● ●\nBike: ● ● ● ● ●\n● = 1 child\nHow do the most children get to school?"
                say: "How do the most children get to school?"
                options: ["Walk", "Bike", "Bus"]
                answer: "Walk"
                hints:
                  - "The most means the row with the most circles."
                  - "Walk 7, bike 5, bus 4."
                  - "Walk."
              - id: l1-f3
                type: multiple_choice
                text: "Favourite fruit\nApple: ● ● ●\nBanana: ● ●\nKiwi: ●\n● = 2 children\nHow many children chose apple?"
                say: "Look carefully at the key. How many children chose apple?"
                options: ["6", "3", "5"]
                answer: "6"
                feedback:
                  "3": "Here one circle stands for 2 children. Count in twos: 2, 4, 6."
                hints:
                  - "The key says one circle stands for 2 children."
                  - "Count in twos: 2, 4, ..."
                  - "6 children."
              - id: l1-f4
                type: true_false
                text: "How we get to school\nWalk: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nCar: ● ● ●\nBike: ● ● ● ● ●\n● = 1 child\nIs it true? 5 children come by bike."
                say: "Is it true? Five children come by bike."
                answer: true
                hints:
                  - "Find the row that says bike."
                  - "Count the circles in that row."
                  - "Yes, 5 children."
              - id: l1-f5
                type: multiple_choice
                text: "Make a pictogram with ● = 1 child.\nWhich row shows cat?"
                say: "Here is a tally chart. You are making a pictogram where one circle stands for one child. Which row shows cat?"
                show: { drawn: bar-chart, tally: true, rows: [["Dog", 3], ["Cat", 5]] }
                options: ["● ● ● ● ●", "● ● ●", "● ● ● ● ● ● ● ●"]
                answer: "● ● ● ● ●"
                option_audio: false
                hints:
                  - "How many tally marks does cat have?"
                  - "Cat has one bundle of five."
                  - "5 circles."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How we get to school\nWalk: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nCar: ● ● ●\nBike: ● ● ● ● ●\n● = 1 child\nHow many children come by car?"
                say: "How many children come to school by car?"
                options: ["3", "4", "7"]
                answer: "3"
                hints: ["Count the circles in the car row."]
              - id: l1-s2
                type: multiple_choice
                text: "Favourite fruit\nApple: ● ● ●\nBanana: ● ●\nKiwi: ●\n● = 2 children\nHow many children chose banana?"
                say: "How many children chose banana?"
                options: ["4", "2", "3"]
                answer: "4"
                hints: ["One circle stands for 2 children. Count in twos."]
              - id: l1-s3
                type: multiple_choice
                text: "How we get to school\nWalk: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nCar: ● ● ●\nBike: ● ● ● ● ●\n● = 1 child\nHow many more children walk than come by car?"
                say: "How many more children walk than come by car?"
                options: ["4", "10", "3"]
                answer: "4"
                hints: ["Walk 7, car 3. Find the difference."]
              - id: l1-s4
                type: true_false
                text: "Favourite fruit\nApple: ● ● ●\nBanana: ● ●\nKiwi: ●\n● = 2 children\nIs it true? 1 child chose kiwi."
                say: "Is it true? One child chose kiwi."
                answer: false
                hints: ["Kiwi has one circle. How many children does one circle stand for?"]
              - id: l1-s5
                type: multiple_choice
                text: "Make a pictogram with ● = 1 child.\nWhich row shows red?"
                say: "Here is a tally chart. You are making a pictogram where one circle stands for one child. Which row shows red?"
                show: { drawn: bar-chart, tally: true, rows: [["Red", 4], ["Yellow", 2]] }
                options: ["● ● ● ●", "● ●", "● ● ● ● ●"]
                answer: "● ● ● ●"
                option_audio: false
                hints: ["Draw one circle for each tally mark."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Leaves collected\nIsla: ● ● ● ●\nJack: ● ●\nPriya: ● ● ●\n● = 2 leaves\nHow many leaves did Isla collect?"
                say: "The children collected autumn leaves. How many leaves did Isla collect?"
                options: ["8", "4", "6"]
                answer: "8"
              - id: l1-n2
                type: multiple_choice
                text: "Leaves collected\nIsla: ● ● ● ●\nJack: ● ●\nPriya: ● ● ●\n● = 2 leaves\nWho collected the fewest leaves?"
                say: "Who collected the fewest leaves?"
                options: ["Jack", "Priya", "Isla"]
                answer: "Jack"
              - id: l1-n3
                type: multiple_choice
                text: "Leaves collected\nIsla: ● ● ● ●\nJack: ● ●\nPriya: ● ● ●\n● = 2 leaves\nHow many leaves did they collect altogether?"
                say: "How many leaves did the three children collect altogether?"
                options: ["18", "9", "16"]
                answer: "18"
                difficulty: stretch
              - id: l1-n4
                type: true_false
                text: "Leaves collected\nIsla: ● ● ● ●\nJack: ● ●\nPriya: ● ● ●\n● = 2 leaves\nIs it true? Priya collected 3 leaves."
                say: "Is it true? Priya collected three leaves."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Noah collected 10 leaves.\n● = 2 leaves\nHow many circles does Noah get?"
                say: "Noah collected ten leaves. One circle stands for two leaves. How many circles does Noah get in the pictogram?"
                options: ["5", "10", "2"]
                answer: "5"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Goals scored\nRed team: ● ● ● ● ● ●\nBlue team: ● ● ● ●\n● = 1 goal\nHow many goals did the red team score?"
            say: "How many goals did the red team score?"
            options: ["6", "4", "3"]
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "Favourite juice\nApple: ● ● ● ●\nOrange: ● ●\n● = 2 children\nHow many children chose orange?"
            say: "Look carefully at the key. How many children chose orange juice?"
            options: ["4", "2", "8"]
            answer: "4"
          - id: l1-c3
            type: true_false
            text: "Goals scored\nRed team: ● ● ● ● ● ●\nBlue team: ● ● ● ●\n● = 1 goal\nIs it true? The blue team scored 2 fewer goals than the red team."
            say: "Is it true? The blue team scored two fewer goals than the red team."
            answer: true

  - n: 2
    title: { de: "Säulendiagramme", en: "Bar charts" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Favourite colours\nRed: ● ● ●\nBlue: ● ● ● ● ●\n● = 1 child\nHow many children chose blue?"
            say: "How many children chose blue?"
            options: ["5", "3"]
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Favourite colours\nRed: ● ●\nBlue: ● ● ●\n● = 2 children\nHow many children chose red?"
            say: "One circle stands for two children. How many children chose red?"
            options: ["4", "2", "6"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Favourite animals"
            say: "This is a bar chart. Each animal has a bar. The scale on the left has the numbers. The cat bar reaches six, so six children chose cats."
            show: { drawn: bar-chart, rows: [["Dog", 4], ["Cat", 6], ["Horse", 2]] }
          - text: "Cat 6, Dog 4\n6 − 4 = 2"
            say: "How many more children chose cats than dogs? Read both bars: six and four. Six subtract four is two. Two more children."
            show: { drawn: bar-chart, rows: [["Dog", 4], ["Cat", 6], ["Horse", 2]] }
          - text: "This scale goes up in twos."
            say: "Here the scale counts in twos: nought, two, four, six and so on. Do not count the lines. Read the number on the scale. The blue bar reaches twelve."
            show: { drawn: bar-chart, rows: [["Red", 8], ["Blue", 12], ["Green", 6]] }
          - text: "Ball 5, Teddy 3"
            say: "You can make a bar chart from a tally chart. Ball has five tally marks, so the ball bar goes up to five. Teddy has three, so the teddy bar goes up to three."
            show: { drawn: bar-chart, tally: true, rows: [["Ball", 5], ["Teddy", 3]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Favourite sports\nHow many children chose dance?"
                say: "The bar chart shows the children's favourite sports. How many children chose dance?"
                show: { drawn: bar-chart, rows: [["Football", 7], ["Dance", 4], ["Swimming", 5]] }
                options: ["4", "5", "7"]
                answer: "4"
                hints:
                  - "Find the bar for dance."
                  - "Go across from the top of the bar to the scale."
                  - "4 children."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Favourite sports\nWhich sport did the most children choose?"
                say: "Which sport did the most children choose?"
                show: { drawn: bar-chart, rows: [["Football", 7], ["Dance", 4], ["Swimming", 5]] }
                options: ["Football", "Swimming", "Dance"]
                answer: "Football"
                hints:
                  - "The most means the tallest bar."
                  - "Which bar goes highest?"
                  - "Football."
              - id: l2-f3
                type: multiple_choice
                text: "Favourite fruit\nHow many children chose plums?"
                say: "Look carefully at the scale. How many children chose plums?"
                show: { drawn: bar-chart, rows: [["Apple", 10], ["Pear", 6], ["Plum", 14]] }
                options: ["14", "7", "12"]
                answer: "14"
                feedback:
                  "7": "The scale goes up in twos. Read the number on the scale, do not count the lines."
                hints:
                  - "The scale goes up in twos."
                  - "The plum bar goes past 12 to the next number."
                  - "14 children."
              - id: l2-f4
                type: true_false
                text: "Favourite sports\nIs it true? 3 more children chose football than dance."
                say: "Is it true? Three more children chose football than dance."
                show: { drawn: bar-chart, rows: [["Football", 7], ["Dance", 4], ["Swimming", 5]] }
                answer: true
                hints:
                  - "Read both bars."
                  - "Football 7, dance 4. Work out 7 − 4."
                  - "Yes, 3 more."
              - id: l2-f5
                type: image_multiple_choice
                text: "Dog 3, cat 5. Which bar chart fits?"
                say: "In the tally chart, three children have a dog and five have a cat. Which bar chart fits?"
                options:
                  - { drawn: bar-chart, rows: [["Dog", 3], ["Cat", 5]], key: "3-5" }
                  - { drawn: bar-chart, rows: [["Dog", 5], ["Cat", 3]], key: "5-3" }
                  - { drawn: bar-chart, rows: [["Dog", 3], ["Cat", 3]], key: "3-3" }
                answer: "3-5"
                feedback:
                  "5-3": "This chart has the numbers on the wrong bars. The cat bar must reach 5."
                hints:
                  - "The cat bar must be taller than the dog bar."
                  - "Dog up to 3, cat up to 5."
                  - "The chart with dog 3 and cat 5."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Visits to the school library\nHow many children visited on Wednesday?"
                say: "The bar chart shows how many children visited the school library. How many visited on Wednesday?"
                show: { drawn: bar-chart, rows: [["Mon", 8], ["Tue", 4], ["Wed", 6]] }
                options: ["6", "4", "8"]
                answer: "6"
                hints: ["Wed means Wednesday. Read its bar on the scale."]
              - id: l2-s2
                type: multiple_choice
                text: "Visits to the school library\nOn which day did the fewest children visit?"
                say: "On which day did the fewest children visit the library?"
                show: { drawn: bar-chart, rows: [["Mon", 8], ["Tue", 4], ["Wed", 6]] }
                options: ["Monday", "Tuesday", "Wednesday"]
                answer: "Tuesday"
                keep_order: true
                hints: ["The fewest means the shortest bar."]
              - id: l2-s3
                type: multiple_choice
                text: "Favourite colours\nHow many children chose yellow?"
                say: "How many children chose yellow?"
                show: { drawn: bar-chart, rows: [["Red", 12], ["Yellow", 8], ["Green", 16]] }
                options: ["8", "4", "10"]
                answer: "8"
                hints: ["The scale goes up in twos. Read the number on the scale."]
              - id: l2-s4
                type: true_false
                text: "Visits to the school library\nIs it true? On Monday 2 more children visited than on Tuesday."
                say: "Is it true? On Monday, two more children visited the library than on Tuesday."
                show: { drawn: bar-chart, rows: [["Mon", 8], ["Tue", 4], ["Wed", 6]] }
                answer: false
                hints: ["Monday 8, Tuesday 4. Find the difference."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Ball 6, teddy 2. Which bar chart fits?"
                say: "In the tally chart, six children chose a ball and two chose a teddy. Which bar chart fits?"
                options:
                  - { drawn: bar-chart, rows: [["Ball", 2], ["Teddy", 6]], key: "2-6" }
                  - { drawn: bar-chart, rows: [["Ball", 6], ["Teddy", 2]], key: "6-2" }
                  - { drawn: bar-chart, rows: [["Ball", 6], ["Teddy", 6]], key: "6-6" }
                answer: "6-2"
                hints: ["The ball bar must reach 6 and the teddy bar 2."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Our pets\nHow many children have a dog?"
                say: "The bar chart shows the class's pets. How many children have a dog?"
                show: { drawn: bar-chart, rows: [["Cat", 10], ["Dog", 12], ["Rabbit", 4]] }
                options: ["12", "6", "10"]
                answer: "12"
              - id: l2-n2
                type: multiple_choice
                text: "Our pets\nWhich pet do the fewest children have?"
                say: "Which pet do the fewest children have?"
                show: { drawn: bar-chart, rows: [["Cat", 10], ["Dog", 12], ["Rabbit", 4]] }
                options: ["Rabbit", "Cat", "Dog"]
                answer: "Rabbit"
              - id: l2-n3
                type: multiple_choice
                text: "Our pets\nHow many children have a cat or a rabbit altogether?"
                say: "How many children have a cat or a rabbit altogether?"
                show: { drawn: bar-chart, rows: [["Cat", 10], ["Dog", 12], ["Rabbit", 4]] }
                options: ["14", "10", "6"]
                answer: "14"
              - id: l2-n4
                type: true_false
                text: "Our pets\nIs it true? 2 more children have a dog than a cat."
                say: "Is it true? Two more children have a dog than a cat."
                show: { drawn: bar-chart, rows: [["Cat", 10], ["Dog", 12], ["Rabbit", 4]] }
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Red 4, blue 7. Which bar chart fits?"
                say: "In the tally chart, four children chose red and seven chose blue. Which bar chart fits?"
                options:
                  - { drawn: bar-chart, rows: [["Red", 7], ["Blue", 4]], key: "7-4" }
                  - { drawn: bar-chart, rows: [["Red", 4], ["Blue", 4]], key: "4-4" }
                  - { drawn: bar-chart, rows: [["Red", 4], ["Blue", 7]], key: "4-7" }
                answer: "4-7"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Favourite drinks\nHow many children chose water?"
            say: "The bar chart shows the children's favourite drinks. How many children chose water?"
            show: { drawn: bar-chart, rows: [["Juice", 5], ["Milk", 3], ["Water", 8]] }
            options: ["8", "5", "3"]
            answer: "8"
          - id: l2-c2
            type: multiple_choice
            text: "Favourite drinks\nWhich drink did the fewest children choose?"
            say: "Which drink did the fewest children choose?"
            show: { drawn: bar-chart, rows: [["Juice", 5], ["Milk", 3], ["Water", 8]] }
            options: ["Milk", "Juice", "Water"]
            answer: "Milk"
          - id: l2-c3
            type: multiple_choice
            text: "Visits to the swimming pool\nHow many children went on Tuesday?"
            say: "Look carefully at the scale. How many children went swimming on Tuesday?"
            show: { drawn: bar-chart, rows: [["Mon", 6], ["Tue", 10], ["Wed", 14]] }
            options: ["10", "5", "12"]
            answer: "10"
          - id: l2-c4
            type: multiple_choice
            text: "Shells collected\nOla: ● ● ● ● ●\nSam: ● ● ●\n● = 2 shells\nHow many shells did Sam collect?"
            say: "Look carefully at the key. How many shells did Sam collect?"
            options: ["6", "3", "8"]
            answer: "6"
          - id: l2-c5
            type: image_multiple_choice
            text: "Apple 2, pear 5. Which bar chart fits?"
            say: "In the tally chart, two children chose apples and five chose pears. Which bar chart fits?"
            options:
              - { drawn: bar-chart, rows: [["Apple", 5], ["Pear", 2]], key: "5-2" }
              - { drawn: bar-chart, rows: [["Apple", 2], ["Pear", 5]], key: "2-5" }
              - { drawn: bar-chart, rows: [["Apple", 2], ["Pear", 2]], key: "2-2" }
            answer: "2-5"
