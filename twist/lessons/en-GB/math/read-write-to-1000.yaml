# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.read-write-to-1000
skill: math.numbers-to-1000.read-write
curriculum: en-GB
language: en
title:
  de: Zahlen bis 1000 lesen und schreiben
  en: Reading and writing numbers to 1000
summary: >
  English says three-digit numbers in digit order (three hundred and
  forty-eight is 348), so the trap is writing each part as heard (300408)
  or losing a zero (three hundred and four as 34). Lesson 1 hears numbers
  and writes them in digits; lesson 2 reads and writes number words,
  including the spelling of forty, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value]
  also_practises: [math.numbers-to-100.read-write]
  vocabulary: { en: [digits, words, hundred, thousand, and, forty] }
  forms: [text, audio, drawn]
  drawn: [place-value-chart]
  facets: []
  misconceptions:
    - id: write-as-heard
      what: Writes each spoken part (three hundred and forty-eight as 300408 or 30048)
      addressed: Learn puts each part into one column of the chart; the written-as-heard number is an option in full-stage tasks, with feedback
    - id: lost-zero
      what: Writes three hundred and four as 34
      addressed: tasks with no tens in every stage
    - id: fourty
      what: Spells forty as fourty
      addressed: lesson 2 sets forty against fourty in a choice
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Hören und schreiben, en: Hear and write }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is the 6 in 465 worth?"
            options: ["6", "60", "600"]
            answer: "60"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Listen and write the number."
            say: "Fifty-seven. Write the number."
            answer: "57"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "three hundred and forty-eight"
            say: "Listen: three hundred and forty-eight. Three hundred tells you the hundreds digit: three."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, null, null] }
          - text: "348"
            say: "Forty-eight is four tens and eight ones. Each digit takes one column. We write three, four, eight, not three hundred followed by forty-eight."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 4, 8] }
          - text: "304"
            say: "Three hundred and four has no tens. So the tens column holds a zero: three, zero, four."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 0, 4] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Two hundred and thirty-six. Which number is it?"
                options: ["236", "200306", "2036"]
                answer: "236"
                option_audio: false
                feedback:
                  "200306": "Each digit takes one column. Two hundreds, three tens, six ones: 236."
                  "2036": "Two hundred is just a 2 in the hundreds. Then thirty-six: 236."
                hints:
                  - "Two hundred: 2 in the hundreds."
                  - "Thirty-six: 3 tens and 6 ones."
                  - "It is 236."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Listen and write the number."
                say: "Five hundred and seventy-two. Write the number."
                answer: "572"
                hints:
                  - "Five hundred: 5 in the hundreds."
                  - "Seventy-two: 7 tens and 2 ones."
                  - "572."
              - id: l1-f3
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Seven hundred and nine. Which number is it?"
                options: ["79", "709", "790"]
                answer: "709"
                option_audio: false
                feedback:
                  "79": "There are 7 hundreds. The tens place needs a zero."
                hints:
                  - "Do you hear any tens?"
                  - "No tens: a 0 in the tens place."
                  - "It is 709."
              - id: l1-f4
                type: fill_in_blank
                text: "Listen and put the number in the chart."
                say: "Eight hundred and sixty-five. Put the number in the chart."
                frame: "H: _  T: _  O: _"
                options: ["5", "6", "8", "65"]
                answer: ["8", "6", "5"]
                option_audio: false
                hints:
                  - "Eight hundred: 8 in H."
                  - "Sixty-five: 6 tens, 5 ones."
                  - "H: 8, T: 6, O: 5."
              - id: l1-f5
                type: text_input
                text: "Listen and write the number."
                say: "Four hundred and twenty. Write the number."
                answer: "420"
                hints:
                  - "Four hundred: 4 in the hundreds."
                  - "Twenty is 2 tens and no ones."
                  - "420."
              - id: l1-f6
                type: true_false
                text: "Is it right? Jack hears nine hundred and thirteen and writes 900013."
                answer: false
                hints:
                  - "A three-digit number has three digits."
                  - "Thirteen is 1 ten and 3 ones."
                  - "No, it is 913."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "One hundred and eighty-four. Which number is it?"
                options: ["148", "184", "1084"]
                answer: "184"
                option_audio: false
                hints: ["One hundred: 1 in the hundreds."]
              - id: l1-s2
                type: text_input
                text: "Listen and write the number."
                say: "Six hundred and three. Write the number."
                answer: "603"
                hints: ["No tens."]
              - id: l1-s3
                type: text_input
                text: "Listen and write the number."
                say: "Three hundred and ninety-seven. Write the number."
                answer: "397"
                hints: ["Ninety-seven: 9 tens, 7 ones."]
              - id: l1-s4
                type: fill_in_blank
                text: "Listen and put the number in the chart."
                say: "Two hundred and fifty. Put the number in the chart."
                frame: "H: _  T: _  O: _"
                options: ["0", "2", "5", "25"]
                answer: ["2", "5", "0"]
                option_audio: false
                hints: ["Fifty: 5 tens, no ones."]
              - id: l1-s5
                type: true_false
                text: "Is it right? Isla hears seven hundred and forty and writes 740."
                answer: true
                hints: ["Forty: 4 tens, 0 ones."]
              - id: l1-s6
                type: text_input
                text: "Listen and write the number."
                say: "One thousand. Write the number."
                answer: "1000"
                hints: ["Ten hundreds: a 1 and three zeros."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Listen and write the number."
                say: "Four hundred and fifty-eight. Write the number."
                answer: "458"
              - id: l1-n2
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Nine hundred and sixteen. Which number is it?"
                options: ["916", "961", "960"]
                answer: "916"
                option_audio: false
              - id: l1-n3
                type: text_input
                text: "Listen and write the number."
                say: "Five hundred and eight. Write the number."
                answer: "508"
              - id: l1-n4
                type: text_input
                text: "Listen and write the number."
                say: "Eight hundred and twenty-three. Write the number."
                answer: "823"
              - id: l1-n5
                type: fill_in_blank
                text: "Listen and put the number in the chart."
                say: "One hundred and nine. Put the number in the chart."
                frame: "H: _  T: _  O: _"
                options: ["0", "1", "9", "19"]
                answer: ["1", "0", "9"]
                option_audio: false
              - id: l1-n6
                type: true_false
                text: "Is it right? Amir hears three hundred and twelve and writes 3012."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Listen and write the number."
            say: "Six hundred and forty-two. Write the number."
            answer: "642"
          - id: l1-c2
            type: multiple_choice
            text: "Listen. Which number is it?"
            say: "Two hundred and seven. Which number is it?"
            options: ["27", "207", "270"]
            answer: "207"
            option_audio: false
          - id: l1-c3
            type: text_input
            text: "Listen and write the number."
            say: "Seven hundred and eighty-nine. Write the number."
            answer: "789"

  - n: 2
    title: { de: Zahlwörter bis 1000, en: Number words to 1000 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Listen and write the number."
            say: "Three hundred and seventy-five. Write the number."
            answer: "375"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Listen. Which number is it?"
            say: "Four hundred and six. Which number is it?"
            options: ["46", "406", "460"]
            answer: "406"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "five hundred and sixty-three"
            say: "Read a number word in parts: five hundred, then sixty-three. Five hundred gives the five in the hundreds. Sixty-three gives six tens and three ones."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [5, 6, 3] }
          - text: "427 → four hundred and twenty-seven"
            say: "To write it in words, say the hundreds, then and, then the tens and ones with a hyphen: four hundred and twenty-seven."
          - text: "forty, not fourty"
            say: "Watch out for one spelling. Four has a u, but forty does not. Fourteen keeps the u."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "two hundred and eighty-four"
                say: "Read the number word. Which number is it?"
                options: ["248", "284", "2084"]
                answer: "284"
                option_audio: false
                hints:
                  - "Split the word: two hundred and eighty-four."
                  - "Eighty-four: 8 tens, 4 ones."
                  - "It is 284."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which word matches 615?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["six hundred and fifteen", "six hundred and fifty", "six hundred and fifty-one"]
                answer: "six hundred and fifteen"
                option_audio: false
                hints:
                  - "615: 6 hundreds, then 15."
                  - "15 is fifteen."
                  - "Six hundred and fifteen."
              - id: l2-f3
                type: text_input
                text: "nine hundred and thirty"
                say: "Read the number word and write the number."
                answer: "930"
                hints:
                  - "Nine hundred: 9 in the hundreds."
                  - "Thirty: 3 tens, 0 ones."
                  - "930."
              - id: l2-f4
                type: matching
                text: "Match each number to its word."
                say: "Match each number to its word."
                option_audio: false
                pairs:
                  - { left: { text: "702" }, right: { text: "seven hundred and two" } }
                  - { left: { text: "720" }, right: { text: "seven hundred and twenty" } }
                  - { left: { text: "272" }, right: { text: "two hundred and seventy-two" } }
                hints:
                  - "Read the hundreds first."
                  - "702 has no tens, 720 has no ones."
                  - "272 starts with two hundred."
              - id: l2-f5
                type: multiple_choice
                text: "Which is spelt correctly?"
                say: "Which number word is spelt correctly? Read them yourself."
                options: ["fourty-four", "forty-four", "fortie-four"]
                answer: "forty-four"
                option_audio: false
                hints:
                  - "Four has a u. Does forty?"
                  - "Forty has no u."
                  - "forty-four."
              - id: l2-f6
                type: multiple_choice
                text: "Which word matches 350?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["three hundred and five", "three hundred and fifty", "three hundred and fifteen"]
                answer: "three hundred and fifty"
                option_audio: false
                hints:
                  - "350: 5 tens, no ones."
                  - "Five tens are fifty."
                  - "Three hundred and fifty."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "four hundred and ninety-seven"
                say: "Read the number word. Which number is it?"
                options: ["479", "497", "4097"]
                answer: "497"
                option_audio: false
                hints: ["Ninety-seven: 9 tens, 7 ones."]
              - id: l2-s2
                type: text_input
                text: "one hundred and sixty"
                say: "Read the number word and write the number."
                answer: "160"
                hints: ["One hundred: 1 in the hundreds."]
              - id: l2-s3
                type: matching
                text: "Match each number to its word."
                say: "Match each number to its word."
                option_audio: false
                pairs:
                  - { left: { text: "530" }, right: { text: "five hundred and thirty" } }
                  - { left: { text: "503" }, right: { text: "five hundred and three" } }
                  - { left: { text: "513" }, right: { text: "five hundred and thirteen" } }
                hints: ["Thirty, three or thirteen?"]
              - id: l2-s4
                type: true_false
                text: "Is it right? six hundred and forty-four = 644"
                say: "Read the number word and the number. Do they match?"
                answer: true
                hints: ["Forty-four: 4 tens, 4 ones."]
              - id: l2-s5
                type: multiple_choice
                text: "Which word matches 808?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["eight hundred and eighty", "eight hundred and eight", "eighty-eight"]
                answer: "eight hundred and eight"
                option_audio: false
                hints: ["No tens."]
              - id: l2-s6
                type: text_input
                text: "two hundred and fifty-one"
                say: "Read the number word and write the number."
                answer: "251"
                hints: ["Fifty-one: 5 tens, 1 one."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "three hundred and sixty-two"
                say: "Read the number word. Which number is it?"
                options: ["326", "362", "3062"]
                answer: "362"
                option_audio: false
              - id: l2-n2
                type: text_input
                text: "seven hundred and fourteen"
                say: "Read the number word and write the number."
                answer: "714"
              - id: l2-n3
                type: matching
                text: "Match each number to its word."
                say: "Match each number to its word."
                option_audio: false
                pairs:
                  - { left: { text: "960" }, right: { text: "nine hundred and sixty" } }
                  - { left: { text: "906" }, right: { text: "nine hundred and six" } }
                  - { left: { text: "916" }, right: { text: "nine hundred and sixteen" } }
              - id: l2-n4
                type: true_false
                text: "Is it right? four hundred and thirty-eight = 483"
                say: "Read the number word and the number. Do they match?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "six hundred and nine"
                say: "Read the number word and write the number."
                answer: "609"
              - id: l2-n6
                type: multiple_choice
                text: "Which word matches 175?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["one hundred and seventy-five", "one hundred and fifty-seven", "one hundred and seventy"]
                answer: "one hundred and seventy-five"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Listen and write the number."
            say: "Five hundred and ninety-one. Write the number."
            answer: "591"
          - id: l2-c2
            type: multiple_choice
            text: "eight hundred and forty-seven"
            say: "Read the number word. Which number is it?"
            options: ["874", "847", "8047"]
            answer: "847"
            option_audio: false
          - id: l2-c3
            type: text_input
            text: "three hundred and two"
            say: "Read the number word and write the number."
            answer: "302"
          - id: l2-c4
            type: multiple_choice
            text: "Which word matches 460?"
            say: "Which number word matches the number? Read the words yourself."
            options: ["four hundred and six", "four hundred and sixty", "four hundred and sixteen"]
            answer: "four hundred and sixty"
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Which is spelt correctly?"
            say: "Which number word is spelt correctly? Read them yourself."
            options: ["ninety", "ninty", "ninedy"]
            answer: "ninety"
            option_audio: false
