# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.count-to-10
skill: math.numbers-to-20.count-to-10
curriculum: en-GB
language: en
title:
  de: Zählen bis 10
  en: Counting to 10
summary: >
  Children count up to ten things. Lesson 1 counts things in a line, where
  it is easy to keep track; lesson 2 counts things that are spread out,
  where the trick is to mark each one as you count it (tapping does that),
  and ends with the skill check. All spoken; number options say themselves.
metadata:
  year: reception
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.count-to-5]
  also_practises: []
  vocabulary: { en: [count, how many, six, seven, eight, nine, ten, spread out] }
  no_reading: true
  forms: [picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: lose-track
      what: Loses track when things are spread out and counts some twice or not at all
      addressed: lesson 2 Learn marks each counted thing; hints say "Tap only the ones with no number."
    - id: number-words
      what: Is unsure of the counting words after five (six, seven, eight)
      addressed: lesson 1 Learn counts six to ten aloud; full-stage hints say the count
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zählen bis 10, en: Counting to 10 }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Let's count past five. One, two, three, four, five, six. There are six strawberries."
            show: { object: strawberry, count: 6, layout: row }
          - say: "After six comes seven, then eight. One, two, three, four, five, six, seven, eight. Eight carrots."
            show: { object: carrot, count: 8, layout: row }
          - say: "After eight comes nine, then ten. Ten marbles. The last number tells us how many."
            show: { object: marble, count: 10, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tap_to_count
                text: "Tap each apple once. How many are there?"
                say: "Tap each apple once. How many apples are there?"
                show: { object: apple, count: 6, layout: row }
                options: ["5", "6", "7"]
                answer: "6"
                hints:
                  - "Start at the first apple and tap them one at a time."
                  - "Count as you tap: one, two, three, four, five, six."
                  - "There are 6 apples."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many fish?"
                say: "How many fish are there?"
                show: { object: fish, count: 7, layout: row }
                options: ["6", "7", "8"]
                answer: "7"
                feedback:
                  "6": "Nearly. Count right to the last fish."
                  "8": "Did you count one fish twice?"
                hints:
                  - "Touch each fish once."
                  - "After six comes seven."
                  - "There are 7 fish."
              - id: l1-f3
                type: image_multiple_choice
                text: "Where are 8 balls?"
                say: "Where are eight balls? Tap the picture."
                options:
                  - { object: ball, count: 6, layout: row }
                  - { object: ball, count: 8, layout: row }
                  - { object: ball, count: 10, layout: row }
                answer: "8"
                hints:
                  - "Count the balls in each picture."
                  - "One picture has six, one has ten."
                  - "Find the picture where you stop at eight."
              - id: l1-f4
                type: true_false
                text: "Are there 9 eggs?"
                say: "Count the eggs. Are there nine eggs?"
                show: { object: egg, count: 9, layout: row }
                answer: true
                hints:
                  - "Count the eggs one at a time."
                  - "One, two, three, four, five, six, seven, eight, nine."
                  - "Yes, there are 9 eggs."
              - id: l1-f5
                type: tap_to_count
                text: "Tap each balloon once. How many are there?"
                say: "Tap each balloon once. How many balloons are there?"
                show: { object: balloon, count: 10, layout: row }
                options: ["8", "9", "10"]
                answer: "10"
                hints:
                  - "Tap one balloon after another until they all have a number."
                  - "After nine comes ten."
                  - "There are 10 balloons."

          - support: some
            tasks:
              - id: l1-s1
                type: tap_to_count
                text: "Tap each banana once. How many are there?"
                say: "Tap each banana once. How many bananas are there?"
                show: { object: banana, count: 7, layout: row }
                options: ["6", "7", "8"]
                answer: "7"
                hints: ["Keep tapping until every banana has a number."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Where are 6 frogs?"
                say: "Where are six frogs? Tap the picture."
                options:
                  - { object: frog, count: 7, layout: row }
                  - { object: frog, count: 5, layout: row }
                  - { object: frog, count: 6, layout: row }
                answer: "6"
                hints: ["Count each picture to the last frog."]
              - id: l1-s3
                type: true_false
                text: "Are there 10 stickers?"
                say: "Count the stickers. Are there ten stickers?"
                show: { object: sticker, count: 9, layout: row }
                answer: false
                hints: ["Count carefully to the last sticker. Do you get to ten?"]
              - id: l1-s4
                type: multiple_choice
                text: "How many crayons?"
                say: "How many crayons are there?"
                show: { object: crayon, count: 9, layout: row }
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["What number do you say at the last crayon?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Where are 10 marbles?"
                say: "Where are ten marbles? Tap the picture."
                options:
                  - { object: marble, count: 10, layout: row }
                  - { object: marble, count: 9, layout: row }
                  - { object: marble, count: 8, layout: row }
                answer: "10"
                hints: ["Count each picture. In which one do you get to ten?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many strawberries?"
                say: "How many strawberries are there?"
                show: { object: strawberry, count: 8, layout: row }
                options: ["7", "8", "9"]
                answer: "8"
              - id: l1-n2
                type: tap_to_count
                text: "Tap each car once. How many are there?"
                say: "Tap each car once. How many cars are there?"
                show: { object: car, count: 7, layout: row }
                options: ["6", "7", "8"]
                answer: "7"
              - id: l1-n3
                type: true_false
                text: "Are there 6 mice?"
                say: "Count the mice. Are there six mice?"
                show: { object: mouse, count: 6, layout: row }
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Where are 9 apples?"
                say: "Where are nine apples? Tap the picture."
                options:
                  - { object: apple, count: 7, layout: row }
                  - { object: apple, count: 9, layout: row }
                  - { object: apple, count: 10, layout: row }
                answer: "9"
              - id: l1-n5
                type: multiple_choice
                text: "How many ants?"
                say: "How many ants are there?"
                show: { object: ant, count: 10, layout: row }
                options: ["8", "9", "10"]
                answer: "10"
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many balls?"
            say: "How many balls are there?"
            show: { object: ball, count: 7, layout: row }
            options: ["6", "7", "8"]
            answer: "7"
          - id: l1-c2
            type: image_multiple_choice
            text: "Where are 8 eggs?"
            say: "Where are eight eggs? Tap the picture."
            options:
              - { object: egg, count: 9, layout: row }
              - { object: egg, count: 8, layout: row }
              - { object: egg, count: 6, layout: row }
            answer: "8"
          - id: l1-c3
            type: tap_to_count
            text: "Tap each fish once. How many are there?"
            say: "Tap each fish once. How many fish are there?"
            show: { object: fish, count: 10, layout: row }
            options: ["8", "9", "10"]
            answer: "10"

  - n: 2
    title: { de: Durcheinander zählen, en: Counting things that are spread out }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "These fish are swimming all over the place. How many are there? When things are not in a line, it is easy to miss one."
            show: { object: fish, count: 8, layout: scattered }
          - say: "Here is the trick. Every fish you count gets a mark. Tap it, and it gets its number. Then you always know which ones are left."
            show: { object: fish, count: 8, layout: scattered }
          - say: "Keep counting until every fish has a number: one, two, three, four, five, six, seven, eight. Eight fish, the same as in a line."
            show: { object: fish, count: 8, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tap_to_count
                text: "Tap each balloon once. How many are there?"
                say: "Tap each balloon once. How many balloons are there?"
                show: { object: balloon, count: 6, layout: scattered }
                options: ["5", "6", "7"]
                answer: "6"
                hints:
                  - "Every balloon you tap gets a number."
                  - "Look for the balloons with no number yet."
                  - "There are 6 balloons."
                difficulty: easy
              - id: l2-f2
                type: tap_to_count
                text: "Tap each egg once. How many are there?"
                say: "Tap each egg once. How many eggs are there?"
                show: { object: egg, count: 8, layout: scattered }
                options: ["7", "8", "9"]
                answer: "8"
                hints:
                  - "Start with an egg at the edge."
                  - "Tap only the eggs with no number, until they all have one."
                  - "There are 8 eggs."
              - id: l2-f3
                type: multiple_choice
                text: "How many ants?"
                say: "How many ants are there?"
                show: { object: ant, count: 7, layout: scattered }
                options: ["6", "7", "8"]
                answer: "7"
                feedback:
                  "6": "You missed one ant. Count again and remember where you started."
                  "8": "You counted one ant twice."
                hints:
                  - "Point at each ant once."
                  - "Count from the top to the bottom, so you don't miss any."
                  - "There are 7 ants."
              - id: l2-f4
                type: true_false
                text: "Are there 9 stickers?"
                say: "Count the stickers. Are there nine stickers?"
                show: { object: sticker, count: 9, layout: scattered }
                answer: true
                hints:
                  - "Point at each sticker once."
                  - "Count from the top to the bottom."
                  - "Yes, there are 9 stickers."
              - id: l2-f5
                type: image_multiple_choice
                text: "Where are 7 leaves?"
                say: "Where are seven leaves? Tap the picture."
                options:
                  - { object: leaf, count: 9, layout: scattered }
                  - { object: leaf, count: 7, layout: scattered }
                  - { object: leaf, count: 5, layout: scattered }
                answer: "7"
                hints:
                  - "Count the leaves in each picture."
                  - "One picture has five, one has nine."
                  - "Find the picture where you stop at seven."

          - support: some
            tasks:
              - id: l2-s1
                type: tap_to_count
                text: "Tap each frog once. How many are there?"
                say: "Tap each frog once. How many frogs are there?"
                show: { object: frog, count: 9, layout: scattered }
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["Tap only the frogs with no number."]
              - id: l2-s2
                type: multiple_choice
                text: "How many apples?"
                say: "How many apples are there?"
                show: { object: apple, count: 6, layout: scattered }
                options: ["5", "6", "7"]
                answer: "6"
                hints: ["Count from the top to the bottom."]
              - id: l2-s3
                type: true_false
                text: "Are there 8 bananas?"
                say: "Count the bananas. Are there eight bananas?"
                show: { object: banana, count: 7, layout: scattered }
                answer: false
                hints: ["Point at each banana once. Do you get to eight?"]
              - id: l2-s4
                type: image_multiple_choice
                text: "Where are 10 strawberries?"
                say: "Where are ten strawberries? Tap the picture."
                options:
                  - { object: strawberry, count: 9, layout: scattered }
                  - { object: strawberry, count: 8, layout: scattered }
                  - { object: strawberry, count: 10, layout: scattered }
                answer: "10"
                hints: ["Count each picture carefully. Two of them have fewer."]
              - id: l2-s5
                type: tap_to_count
                text: "Tap each mouse once. How many are there?"
                say: "Tap each mouse once. How many mice are there?"
                show: { object: mouse, count: 7, layout: scattered }
                options: ["6", "7", "8"]
                answer: "7"
                hints: ["Each mouse you tap has a number. Which ones are left?"]

          - support: none
            tasks:
              - id: l2-n1
                type: tap_to_count
                text: "Tap each car once. How many are there?"
                say: "Tap each car once. How many cars are there?"
                show: { object: car, count: 8, layout: scattered }
                options: ["7", "8", "9"]
                answer: "8"
              - id: l2-n2
                type: multiple_choice
                text: "How many crayons?"
                say: "How many crayons are there?"
                show: { object: crayon, count: 10, layout: scattered }
                options: ["8", "9", "10"]
                answer: "10"
              - id: l2-n3
                type: image_multiple_choice
                text: "Where are 6 fish?"
                say: "Where are six fish? Tap the picture."
                options:
                  - { object: fish, count: 5, layout: scattered }
                  - { object: fish, count: 6, layout: scattered }
                  - { object: fish, count: 7, layout: scattered }
                answer: "6"
              - id: l2-n4
                type: true_false
                text: "Are there 10 carrots?"
                say: "Count the carrots. Are there ten carrots?"
                show: { object: carrot, count: 10, layout: scattered }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "How many eggs?"
                say: "How many eggs are there?"
                show: { object: egg, count: 4, layout: scattered }
                options: ["3", "4", "5"]
                answer: "4"
                difficulty: easy

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "How many balls?"
            say: "How many balls are there?"
            show: { object: ball, count: 9, layout: scattered }
            options: ["8", "9", "10"]
            answer: "9"
          - id: l2-c2
            type: tap_to_count
            text: "Tap each apple once. How many are there?"
            say: "Tap each apple once. How many apples are there?"
            show: { object: apple, count: 7, layout: scattered }
            options: ["6", "7", "8"]
            answer: "7"
          - id: l2-c3
            type: image_multiple_choice
            text: "Where are 8 fish?"
            say: "Where are eight fish? Tap the picture."
            options:
              - { object: fish, count: 6, layout: scattered }
              - { object: fish, count: 10, layout: scattered }
              - { object: fish, count: 8, layout: scattered }
            answer: "8"
          - id: l2-c4
            type: multiple_choice
            text: "How many balloons?"
            say: "How many balloons are there?"
            show: { object: balloon, count: 10, layout: row }
            options: ["8", "9", "10"]
            answer: "10"
