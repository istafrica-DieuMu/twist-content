# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.hundreds
skill: math.numbers-to-1000.hundreds
curriculum: en-GB
language: en
title:
  de: Hunderter bündeln
  en: Making hundreds
summary: >
  Year 3 opens with numbers to 1000: ten tens make a hundred, as ten ones
  made a ten. Lesson 1 exchanges tens for hundreds and counts in hundreds;
  lesson 2 makes three-digit numbers from hundreds, tens and ones,
  including with zero tens, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-100.place-value]
  also_practises: [math.numbers-to-100.bundle-tens]
  vocabulary: { en: [hundred, hundreds, tens, ones, exchange, thousand] }
  forms: [drawn, text, audio]
  drawn: [base-ten]
  facets: []
  misconceptions:
    - id: flat-is-ten
      what: Counts a hundred flat as ten, or as one
      addressed: Learn builds a hundred from ten tens; feedback says a hundred flat is ten tens, so one hundred
    - id: zero-tens
      what: Writes 305 as 35 when there are no tens
      addressed: lesson 2 Learn and every stage set numbers with no tens
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehn Zehner sind ein Hunderter, en: Ten tens make a hundred }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, tens: 4, ones: 6 }
            options: ["46", "64", "10"]
            answer: "46"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many ones make a ten?"
            options: ["1", "10", "100"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10 tens"
            say: "Ten ones make a ten. Now put ten tens side by side: ten, twenty, thirty, all the way to one hundred."
            show: { drawn: base-ten, tens: 10, ones: 0 }
          - text: "10 tens = 1 hundred"
            say: "We exchange ten tens for one hundred flat. A hundred flat is one hundred."
            show: { drawn: base-ten, hundreds: 1, tens: 0, ones: 0 }
          - text: "100, 200, 300 ... 1000"
            say: "Now count in hundreds: one hundred, two hundred, three hundred, up to nine hundred. Ten hundreds make one thousand."
            show: { drawn: base-ten, hundreds: 3, tens: 0, ones: 0 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, hundreds: 2, tens: 0, ones: 0 }
                options: ["2", "20", "200"]
                answer: "200"
                feedback:
                  "20": "Each flat is ten tens, so it is one hundred, not ten."
                  "2": "Each flat is a hundred. Count in hundreds."
                hints:
                  - "Each flat is one hundred."
                  - "Count: one hundred, two hundred."
                  - "There are 200."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many tens make one hundred?"
                options: ["10", "100", "1"]
                answer: "10"
                hints:
                  - "Count in tens to a hundred."
                  - "Ten, twenty, ... one hundred. How many tens?"
                  - "Ten tens make one hundred."
              - id: l1-f3
                type: multiple_choice
                text: "100, 200, 300, _"
                options: ["301", "310", "400"]
                answer: "400"
                hints:
                  - "Each step is one hundred."
                  - "After three hundreds come four hundreds."
                  - "It is 400."
              - id: l1-f4
                type: true_false
                text: "Is it true? 10 ten sticks are the same as 1 hundred flat."
                answer: true
                hints:
                  - "How much is one ten stick?"
                  - "Ten tens are a hundred."
                  - "Yes, both are 100."
              - id: l1-f5
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, hundreds: 5, tens: 0, ones: 0 }
                options: ["5", "50", "500"]
                answer: "500"
                hints:
                  - "Count the flats."
                  - "One hundred, two hundred, ... five hundred."
                  - "There are 500."
              - id: l1-f6
                type: multiple_choice
                text: "How many hundreds make 1000?"
                options: ["10", "100", "1"]
                answer: "10"
                hints:
                  - "Count in hundreds to a thousand."
                  - "One hundred, two hundred, ... nine hundred, one thousand."
                  - "Ten hundreds make 1000."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, hundreds: 4, tens: 0, ones: 0 }
                options: ["40", "400", "4"]
                answer: "400"
                hints: ["Each flat is one hundred."]
              - id: l1-s2
                type: multiple_choice
                text: "How many tens are in 300?"
                options: ["3", "30", "300"]
                answer: "30"
                hints: ["One hundred is ten tens."]
              - id: l1-s3
                type: multiple_choice
                text: "900, 800, 700, _"
                options: ["600", "690", "699"]
                answer: "600"
                hints: ["One hundred less each time."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Which shows 300?"
                options:
                  - { drawn: base-ten, hundreds: 0, tens: 3, ones: 0 }
                  - { drawn: base-ten, hundreds: 3, tens: 0, ones: 0 }
                  - { drawn: base-ten, hundreds: 0, tens: 0, ones: 3 }
                answer: "300"
                hints: ["300 is three hundreds."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 20 tens make 2000."
                answer: false
                hints: ["Ten tens make one hundred."]
              - id: l1-s6
                type: text_input
                text: "What are 7 hundreds worth?"
                answer: "700"
                hints: ["Count in hundreds."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, hundreds: 6, tens: 0, ones: 0 }
                options: ["6", "60", "600"]
                answer: "600"
              - id: l1-n2
                type: multiple_choice
                text: "How many tens are in 500?"
                options: ["5", "50", "500"]
                answer: "50"
              - id: l1-n3
                type: multiple_choice
                text: "500, 600, 700, _"
                options: ["701", "800", "710"]
                answer: "800"
              - id: l1-n4
                type: text_input
                text: "What are 9 hundreds worth?"
                answer: "900"
              - id: l1-n5
                type: true_false
                text: "Is it true? 10 hundreds make 1000."
                answer: true
              - id: l1-n6
                type: image_multiple_choice
                text: "Which shows 200?"
                options:
                  - { drawn: base-ten, hundreds: 2, tens: 0, ones: 0 }
                  - { drawn: base-ten, hundreds: 0, tens: 2, ones: 0 }
                  - { drawn: base-ten, hundreds: 1, tens: 2, ones: 0 }
                answer: "200"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, hundreds: 3, tens: 0, ones: 0 }
            options: ["3", "30", "300"]
            answer: "300"
          - id: l1-c2
            type: multiple_choice
            text: "How many tens are in 200?"
            options: ["2", "20", "200"]
            answer: "20"
          - id: l1-c3
            type: text_input
            text: "What are 8 hundreds worth?"
            answer: "800"

  - n: 2
    title: { de: "Hunderter, Zehner und Einer", en: "Hundreds, tens and ones" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, hundreds: 4, tens: 0, ones: 0 }
            options: ["4", "40", "400"]
            answer: "400"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many tens make one hundred?"
            options: ["1", "10", "100"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2 hundreds, 3 tens, 5 ones"
            say: "Two hundreds, three tens and five ones. Count the hundreds first, then the tens, then the ones."
            show: { drawn: base-ten, hundreds: 2, tens: 3, ones: 5 }
          - text: "200 + 30 + 5 = 235"
            say: "Two hundred, two hundred and ten, two hundred and twenty, two hundred and thirty, then five ones: two hundred and thirty-five."
            show: { drawn: base-ten, hundreds: 2, tens: 3, ones: 5 }
          - text: "305"
            say: "Here there are no tens: three hundreds and five ones. That is three hundred and five. We write a zero in the tens place."
            show: { drawn: base-ten, hundreds: 3, tens: 0, ones: 5 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, hundreds: 1, tens: 4, ones: 2 }
                options: ["142", "124", "7"]
                answer: "142"
                feedback:
                  "7": "Flats, sticks and cubes are worth different amounts. Count hundreds, tens and ones."
                hints:
                  - "Count the hundreds first."
                  - "One hundred, four tens, two ones."
                  - "100 + 40 + 2 = 142."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "How many hundreds, tens and ones?"
                show: { drawn: base-ten, hundreds: 3, tens: 2, ones: 6 }
                frame: "_ hundreds, _ tens, _ ones"
                options: ["2", "3", "6", "326"]
                answer: ["3", "2", "6"]
                hints:
                  - "Flats are hundreds, sticks are tens, cubes are ones."
                  - "Count each kind."
                  - "3 hundreds, 2 tens, 6 ones."
              - id: l2-f3
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, hundreds: 4, tens: 0, ones: 7 }
                options: ["47", "407", "470"]
                answer: "407"
                feedback:
                  "47": "There are four hundreds. The tens place holds a zero."
                  "470": "The cubes are ones, not tens."
                hints:
                  - "Are there any ten sticks?"
                  - "Four hundreds, no tens, seven ones."
                  - "It is 407."
              - id: l2-f4
                type: image_multiple_choice
                text: "Which shows 251?"
                options:
                  - { drawn: base-ten, hundreds: 2, tens: 1, ones: 5 }
                  - { drawn: base-ten, hundreds: 2, tens: 5, ones: 1 }
                  - { drawn: base-ten, hundreds: 1, tens: 5, ones: 2 }
                answer: "251"
                hints:
                  - "251 is 2 hundreds, 5 tens and 1 one."
                  - "Look for two flats and five sticks."
                  - "Two flats, five sticks, one cube."
              - id: l2-f5
                type: text_input
                text: "500 + 60 + 3 = _"
                answer: "563"
                hints:
                  - "Hundreds, tens and ones side by side."
                  - "5 hundreds, 6 tens, 3 ones."
                  - "It is 563."
              - id: l2-f6
                type: true_false
                text: "Is it true? 6 hundreds and 4 ones make 64."
                answer: false
                hints:
                  - "Six hundreds are six hundred."
                  - "There are no tens. The tens place holds a zero."
                  - "No, it is 604."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, hundreds: 2, tens: 6, ones: 0 }
                options: ["26", "206", "260"]
                answer: "260"
                hints: ["No ones: a zero in the ones place."]
              - id: l2-s2
                type: fill_in_blank
                text: "How many hundreds, tens and ones?"
                show: { drawn: base-ten, hundreds: 5, tens: 1, ones: 8 }
                frame: "_ hundreds, _ tens, _ ones"
                options: ["1", "5", "8", "518"]
                answer: ["5", "1", "8"]
                hints: ["Flats, sticks, cubes."]
              - id: l2-s3
                type: text_input
                text: "700 + 20 + 9 = _"
                answer: "729"
                hints: ["7 hundreds, 2 tens, 9 ones."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Which shows 308?"
                options:
                  - { drawn: base-ten, hundreds: 3, tens: 8, ones: 0 }
                  - { drawn: base-ten, hundreds: 3, tens: 0, ones: 8 }
                  - { drawn: base-ten, hundreds: 0, tens: 3, ones: 8 }
                answer: "308"
                hints: ["308 has no tens."]
              - id: l2-s5
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, hundreds: 6, tens: 3, ones: 3 }
                options: ["633", "336", "12"]
                answer: "633"
                hints: ["The flats first."]
              - id: l2-s6
                type: true_false
                text: "Is it true? 800 + 10 + 5 = 815"
                answer: true
                hints: ["8 hundreds, 1 ten, 5 ones."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, hundreds: 3, tens: 7, ones: 4 }
                options: ["374", "473", "14"]
                answer: "374"
              - id: l2-n2
                type: fill_in_blank
                text: "How many hundreds, tens and ones?"
                show: { drawn: base-ten, hundreds: 4, tens: 0, ones: 2 }
                frame: "_ hundreds, _ tens, _ ones"
                options: ["0", "2", "4", "42"]
                answer: ["4", "0", "2"]
              - id: l2-n3
                type: text_input
                text: "900 + 40 + 1 = _"
                answer: "941"
              - id: l2-n4
                type: image_multiple_choice
                text: "Which shows 160?"
                options:
                  - { drawn: base-ten, hundreds: 1, tens: 6, ones: 0 }
                  - { drawn: base-ten, hundreds: 1, tens: 0, ones: 6 }
                  - { drawn: base-ten, hundreds: 6, tens: 1, ones: 0 }
                answer: "160"
              - id: l2-n5
                type: text_input
                text: "300 + 5 = _"
                answer: "305"
              - id: l2-n6
                type: true_false
                text: "Is it true? 2 hundreds, 9 tens and 9 ones make 299."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, hundreds: 2, tens: 8, ones: 1 }
            options: ["281", "182", "11"]
            answer: "281"
          - id: l2-c2
            type: fill_in_blank
            text: "How many hundreds, tens and ones?"
            show: { drawn: base-ten, hundreds: 6, tens: 4, ones: 0 }
            frame: "_ hundreds, _ tens, _ ones"
            options: ["0", "4", "6", "64"]
            answer: ["6", "4", "0"]
          - id: l2-c3
            type: text_input
            text: "400 + 30 + 8 = _"
            answer: "438"
          - id: l2-c4
            type: image_multiple_choice
            text: "Which shows 503?"
            options:
              - { drawn: base-ten, hundreds: 5, tens: 3, ones: 0 }
              - { drawn: base-ten, hundreds: 5, tens: 0, ones: 3 }
              - { drawn: base-ten, hundreds: 3, tens: 0, ones: 5 }
            answer: "503"
          - id: l2-c5
            type: multiple_choice
            text: "How many tens are in 600?"
            options: ["6", "60", "600"]
            answer: "60"
