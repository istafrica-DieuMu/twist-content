# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.word-problems-y2
skill: math.word-problems.question-calc-answer
curriculum: en-GB
language: en
title:
  de: "Sachaufgaben: Frage, Rechnung, Antwort"
  en: "Word problems: question, calculation, answer"
summary: >
  Word problems with numbers to 100 in three steps: find the question,
  choose and do the calculation, and give the answer as a sentence.
  Lesson 1 decides between add and subtract and works out the answer;
  lesson 2 spots the number you do not need, picks the answer sentence
  that really answers the question, and ends with the skill check.
  Calculations add or subtract tens, or two-digit numbers with no
  crossing of ten, and the voice reads every story aloud.
metadata:
  year: year-2
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.word-problems.picture-stories, math.add-sub-to-20.fluency-to-20]
  also_practises: [math.add-sub-to-100.tens]
  vocabulary: { en: [question, calculation, answer, add, subtract, altogether, left, more, fewer] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: keyword-only
      what: Picks add or subtract from one word ("more") without picturing the story
      addressed: lesson 1 has a "more" story that needs subtraction in the full and some stages (How many more …?) and a "taller" one in the quick check, with feedback in l1-f3; stories where "more" means add (l1-c2, lesson 1 Learn) keep the word from always meaning subtract
    - id: use-every-number
      what: Uses every number in the story, also the one that is not needed
      addressed: lesson 2 Learn marks the extra fact; a "Which number do you not need?" task in every stage of lesson 2 and in the skill check, with feedback in l2-f1
    - id: answer-other-question
      what: Gives an answer sentence that answers a different question
      addressed: answer-sentence tasks in every stage of lesson 2 and in the skill check offer a true sentence that answers a different question, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Frage und Rechnung, en: Question and calculation }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "40 + 30 = _"
            say: "Forty add thirty. Type the total."
            answer: "70"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "15 − 6 = _"
            say: "Fifteen subtract six."
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Question · Calculation · Answer"
            say: "A word problem tells a little story with numbers. First find the question. Then write the calculation. Then answer in a full sentence."
          - text: "Ella has 24 stickers. Her friend gives her 10 more. How many stickers has Ella got now?"
            say: "Ella has twenty-four stickers. Her friend gives her ten more. How many stickers has Ella got now? She gets more, so we add."
          - text: "24 + 10 = 34 · Ella has got 34 stickers now."
            say: "Twenty-four add ten is thirty-four. The answer sentence: Ella has got thirty-four stickers now."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "There are 35 children in the hall. 12 children go out to play. How many children are in the hall now?"
                say: "There are thirty-five children in the hall. Twelve children go out to play. How many children are in the hall now? Which calculation fits?"
                options: ["35 − 12", "35 + 12", "12 − 35"]
                answer: "35 − 12"
                hints:
                  - "Do children come in or go out?"
                  - "When some go away, we subtract."
                  - "35 − 12."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "There are 35 children in the hall. 12 children go out to play. How many children are in the hall now?"
                say: "Thirty-five children are in the hall, and twelve go out to play. How many children are in the hall now? Work it out and type the number."
                answer: "23"
                hints:
                  - "Work out 35 − 12."
                  - "Take away 10, then 2 more."
                  - "23."
              - id: l1-f3
                type: multiple_choice
                text: "Sam has 32 marbles. Ava has 57 marbles. How many more marbles has Ava got than Sam?"
                say: "Sam has thirty-two marbles. Ava has fifty-seven marbles. How many more marbles has Ava got than Sam? Which calculation fits?"
                options: ["57 − 32", "57 + 32", "32 − 57"]
                answer: "57 − 32"
                feedback:
                  "57 + 32": "The question says more, but nobody gets more marbles. We find the difference between 57 and 32, so we subtract."
                  "32 − 57": "Start with the bigger number, 57, and take away 32."
                hints:
                  - "Nobody is given more marbles. We compare."
                  - "How many more is the difference between the two numbers."
                  - "57 − 32."
              - id: l1-f4
                type: multiple_choice
                text: "Mum buys 20 apples and 15 pears. How many pieces of fruit does she buy altogether?"
                say: "Mum buys twenty apples and fifteen pears. How many pieces of fruit does she buy altogether? What is the question asking?"
                options: ["How many pieces of fruit altogether?", "How many apples does Mum buy?", "How many pears are left?"]
                answer: "How many pieces of fruit altogether?"
                hints:
                  - "Find the sentence with a question mark."
                  - "It asks about apples and pears together."
                  - "How many pieces of fruit altogether?"
              - id: l1-f5
                type: text_input
                text: "Mum buys 20 apples and 15 pears. How many pieces of fruit does she buy altogether?"
                say: "Mum buys twenty apples and fifteen pears. How many pieces of fruit does she buy altogether? Type the number."
                answer: "35"
                hints:
                  - "Altogether means add."
                  - "20 + 15."
                  - "35."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A bus has 46 people on it. At the stop, 20 people get off. How many people are on the bus now?"
                say: "A bus has forty-six people on it. At the stop, twenty people get off. How many people are on the bus now? Which calculation fits?"
                options: ["46 + 20", "46 − 20", "20 − 46"]
                answer: "46 − 20"
                hints: ["Do people get on or off?"]
              - id: l1-s2
                type: text_input
                text: "A bus has 46 people on it. At the stop, 20 people get off. How many people are on the bus now?"
                say: "Forty-six people are on the bus, and twenty get off. How many people are on the bus now? Type the number."
                answer: "26"
                hints: ["Take away the tens."]
              - id: l1-s3
                type: multiple_choice
                text: "Leo scores 31 points. Mia scores 54 points. How many more points has Mia got than Leo?"
                say: "Leo scores thirty-one points. Mia scores fifty-four points. How many more points has Mia got than Leo? Which calculation fits?"
                options: ["54 + 31", "31 + 54", "54 − 31"]
                answer: "54 − 31"
                hints: ["Are we finding a total or a difference?"]
              - id: l1-s4
                type: multiple_choice
                text: "There are 18 red pens and 30 blue pens in the pot. How many pens are there altogether?"
                say: "There are eighteen red pens and thirty blue pens in the pot. How many pens are there altogether? What is the question asking?"
                options: ["How many red pens?", "How many pens altogether?", "How many blue pens are left?"]
                answer: "How many pens altogether?"
                hints: ["Look for the question mark."]
              - id: l1-s5
                type: text_input
                text: "There are 18 red pens and 30 blue pens in the pot. How many pens are there altogether?"
                say: "There are eighteen red pens and thirty blue pens. How many pens are there altogether? Type the number."
                answer: "48"
                hints: ["Add the two numbers."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Grace has 50p. She spends 30p on a drink. How much money has she got left?"
                say: "Grace has fifty pence. She spends thirty pence on a drink. How much money has she got left? Which calculation fits?"
                options: ["50 − 30", "50 + 30", "30 − 50"]
                answer: "50 − 30"
              - id: l1-n2
                type: text_input
                text: "Grace has 50p. She spends 30p on a drink. How much money has she got left? Type the number of pence."
                say: "Grace has fifty pence and spends thirty pence. How much money has she got left? Type the number of pence."
                answer: "20"
              - id: l1-n3
                type: multiple_choice
                text: "Oliver reads 25 pages on Monday and 20 pages on Tuesday. How many pages does he read altogether?"
                say: "Oliver reads twenty-five pages on Monday and twenty pages on Tuesday. How many pages does he read altogether? Which calculation fits?"
                options: ["25 − 20", "25 + 20", "20 − 25"]
                answer: "25 + 20"
              - id: l1-n4
                type: multiple_choice
                text: "A farmer has 42 sheep. 10 sheep are in the barn. How many sheep are not in the barn?"
                say: "A farmer has forty-two sheep. Ten sheep are in the barn. How many sheep are not in the barn? What is the question asking?"
                options: ["How many sheep are in the barn?", "How many sheep are not in the barn?", "How many sheep altogether?"]
                answer: "How many sheep are not in the barn?"
              - id: l1-n5
                type: text_input
                text: "A farmer has 42 sheep. 10 sheep are in the barn. How many sheep are not in the barn?"
                say: "A farmer has forty-two sheep, and ten are in the barn. How many sheep are not in the barn? Type the number."
                answer: "32"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "There are 27 cakes on a plate. The children eat 7. How many cakes are left?"
            say: "There are twenty-seven cakes on a plate. The children eat seven. How many cakes are left? Which calculation fits?"
            options: ["27 + 7", "27 − 7", "7 − 27"]
            answer: "27 − 7"
          - id: l1-c2
            type: text_input
            text: "Jack has 33 cards. He buys 20 more. How many cards has he got now?"
            say: "Jack has thirty-three cards. He buys twenty more. How many cards has he got now? Type the number."
            answer: "53"
          - id: l1-c3
            type: multiple_choice
            text: "Ruby's sunflower is 40 cm tall. Her brother's sunflower is 60 cm tall. How much taller is her brother's sunflower?"
            say: "Ruby's sunflower is forty centimetres tall. Her brother's sunflower is sixty centimetres tall. How much taller is her brother's sunflower? Which calculation fits?"
            options: ["60 − 40", "60 + 40", "40 + 60"]
            answer: "60 − 40"

  - n: 2
    title: { de: Wichtig und unwichtig, en: What you need and what you don't }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Tom has 45 stamps. He gives 15 to his sister. How many stamps has he got left?"
            say: "Tom has forty-five stamps. He gives fifteen to his sister. How many stamps has he got left? Which calculation fits?"
            options: ["45 − 15", "45 + 15", "15 − 45"]
            answer: "45 − 15"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Tom has 45 stamps. He gives 15 to his sister. How many stamps has he got left?"
            say: "Tom has forty-five stamps and gives fifteen to his sister. How many stamps has he got left? Type the number."
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Noah is 7. He has 36 toy cars. He gets 10 more for his birthday. How many toy cars has he got now?"
            say: "Noah is seven. He has thirty-six toy cars. He gets ten more for his birthday. How many toy cars has he got now? Some stories have a number you do not need. The question is about toy cars, so Noah's age, seven, does not help."
          - text: "36 + 10 = 46"
            say: "So the calculation is thirty-six add ten, which is forty-six."
          - text: "Noah has got 46 toy cars now."
            say: "The answer sentence uses the words of the question: Noah has got forty-six toy cars now."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "There are 29 children in Mr Khan's class. 14 of them have a packed lunch. 2 grown-ups help in the class. How many children do not have a packed lunch?"
                say: "There are twenty-nine children in Mr Khan's class. Fourteen of them have a packed lunch. Two grown-ups help in the class. How many children do not have a packed lunch? Which number do you not need?"
                options: ["2", "14", "29"]
                answer: "2"
                feedback:
                  "14": "You need 14: they are the children with a packed lunch. The number of grown-ups does not help."
                  "29": "You need 29: that is how many children there are. The number of grown-ups does not help."
                hints:
                  - "The question is about children and packed lunches."
                  - "Does the number of grown-ups help?"
                  - "You do not need 2."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "There are 29 children in Mr Khan's class. 14 of them have a packed lunch. 2 grown-ups help in the class. How many children do not have a packed lunch?"
                say: "Twenty-nine children, fourteen with a packed lunch, and two grown-ups who help. How many children do not have a packed lunch? Work it out and type the number."
                answer: "15"
                hints:
                  - "Use only the numbers you need: 29 and 14."
                  - "29 − 14."
                  - "15."
              - id: l2-f3
                type: multiple_choice
                text: "Lily picks 22 strawberries. Her dad picks 30. How many strawberries do they pick altogether? The calculation: 22 + 30 = 52."
                say: "Lily picks twenty-two strawberries. Her dad picks thirty. How many strawberries do they pick altogether? The calculation is done for you: twenty-two add thirty is fifty-two. Which answer sentence answers the question?"
                options: ["They pick 52 strawberries altogether.", "Dad picks 30 strawberries.", "Lily picks 52 strawberries."]
                answer: "They pick 52 strawberries altogether."
                feedback:
                  "Lily picks 52 strawberries.": "52 is the total for Lily and her dad together, not for Lily alone."
                  "Dad picks 30 strawberries.": "That is true, but the question asks how many they pick altogether."
                hints:
                  - "Read the question again."
                  - "It asks about both of them together."
                  - "They pick 52 strawberries altogether."
              - id: l2-f4
                type: multiple_choice
                text: "A shop has 68 balloons. It sells 25. The shop opens at 9 o'clock. How many balloons are left?"
                say: "A shop has sixty-eight balloons. It sells twenty-five. The shop opens at nine o'clock. How many balloons are left? Which number do you not need?"
                options: ["25", "9", "68"]
                answer: "9"
                hints:
                  - "The question is about balloons."
                  - "Does the time help?"
                  - "You do not need 9."
              - id: l2-f5
                type: text_input
                text: "A shop has 68 balloons. It sells 25. The shop opens at 9 o'clock. How many balloons are left?"
                say: "A shop has sixty-eight balloons and sells twenty-five. It opens at nine o'clock. How many balloons are left? Work it out and type the number."
                answer: "43"
                hints:
                  - "68 − 25."
                  - "Take away 20, then 5 more."
                  - "43."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ben has 17 football stickers. He is 8 years old. He gets 20 more stickers. How many stickers has he got now?"
                say: "Ben has seventeen football stickers. He is eight years old. He gets twenty more stickers. How many stickers has he got now? Which number do you not need?"
                options: ["17", "8", "20"]
                answer: "8"
                hints: ["What is the question about?"]
              - id: l2-s2
                type: text_input
                text: "Ben has 17 football stickers. He is 8 years old. He gets 20 more stickers. How many stickers has he got now?"
                say: "Ben has seventeen football stickers. He is eight, and he gets twenty more stickers. How many stickers has he got now? Type the number."
                answer: "37"
                hints: ["Use only the numbers you need."]
              - id: l2-s3
                type: multiple_choice
                text: "There are 48 seats on a train. 32 people sit down. How many seats are empty? The calculation: 48 − 32 = 16."
                say: "There are forty-eight seats on a train. Thirty-two people sit down. How many seats are empty? The calculation is done for you: forty-eight subtract thirty-two is sixteen. Which answer sentence answers the question?"
                options: ["32 people sit down.", "There are 16 empty seats.", "There are 16 people on the train."]
                answer: "There are 16 empty seats."
                hints: ["What does the question ask about?"]
              - id: l2-s4
                type: multiple_choice
                text: "Zara's dog is 3 years old. Zara gives her dog 40 biscuits a week and her cat 25 biscuits a week. How many biscuits does she give her pets a week?"
                say: "Zara's dog is three years old. Zara gives her dog forty biscuits a week and her cat twenty-five biscuits a week. How many biscuits does she give her pets a week? Which number do you not need?"
                options: ["40", "25", "3"]
                answer: "3"
                hints: ["Which numbers are about biscuits?"]
              - id: l2-s5
                type: text_input
                text: "Zara's dog is 3 years old. Zara gives her dog 40 biscuits a week and her cat 25 biscuits a week. How many biscuits does she give her pets a week?"
                say: "Zara's dog is three. Zara gives her dog forty biscuits a week and her cat twenty-five. How many biscuits does she give her pets a week? Type the number."
                answer: "65"
                hints: ["Add the biscuit numbers."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The library has 86 books about animals. 35 are on loan. The library has 4 computers. How many animal books are on the shelves?"
                say: "The library has eighty-six books about animals. Thirty-five are on loan. The library has four computers. How many animal books are on the shelves? Which number do you not need?"
                options: ["35", "4", "86"]
                answer: "4"
              - id: l2-n2
                type: text_input
                text: "The library has 86 books about animals. 35 are on loan. The library has 4 computers. How many animal books are on the shelves?"
                say: "The library has eighty-six animal books, and thirty-five are on loan. It has four computers. How many animal books are on the shelves? Type the number."
                answer: "51"
              - id: l2-n3
                type: multiple_choice
                text: "Harry has 26 crayons. Isla has 32 crayons. How many crayons have they got altogether? The calculation: 26 + 32 = 58."
                say: "Harry has twenty-six crayons. Isla has thirty-two crayons. How many crayons have they got altogether? The calculation is done for you: twenty-six add thirty-two is fifty-eight. Which answer sentence answers the question?"
                options: ["Isla has 58 crayons.", "They have got 58 crayons altogether.", "Harry has 26 crayons."]
                answer: "They have got 58 crayons altogether."
              - id: l2-n4
                type: multiple_choice
                text: "A baker makes 48 rolls in the morning and 30 in the afternoon. The shop has 2 ovens. How many rolls does the baker make altogether?"
                say: "A baker makes forty-eight rolls in the morning and thirty in the afternoon. The shop has two ovens. How many rolls does the baker make altogether? Which number do you not need?"
                options: ["2", "30", "48"]
                answer: "2"
              - id: l2-n5
                type: text_input
                text: "A baker makes 48 rolls in the morning and 30 in the afternoon. The shop has 2 ovens. How many rolls does the baker make altogether?"
                say: "A baker makes forty-eight rolls in the morning and thirty in the afternoon. The shop has two ovens. How many rolls does the baker make altogether? Type the number."
                answer: "78"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "There are 64 ducks on the pond. 30 fly away. How many ducks are on the pond now?"
            say: "There are sixty-four ducks on the pond. Thirty fly away. How many ducks are on the pond now? Which calculation fits?"
            options: ["64 + 30", "64 − 30", "30 − 64"]
            answer: "64 − 30"
          - id: l2-c2
            type: text_input
            text: "There are 64 ducks on the pond. 30 fly away. How many ducks are on the pond now?"
            say: "Sixty-four ducks are on the pond, and thirty fly away. How many ducks are on the pond now? Type the number."
            answer: "34"
          - id: l2-c3
            type: multiple_choice
            text: "Amir has 19 shells. His sister has 6 buckets. His mum gives him 40 more shells. How many shells has Amir got now?"
            say: "Amir has nineteen shells. His sister has six buckets. His mum gives him forty more shells. How many shells has Amir got now? Which number do you not need?"
            options: ["6", "19", "40"]
            answer: "6"
          - id: l2-c4
            type: multiple_choice
            text: "Freya runs 35 metres. Kai runs 58 metres. How much further does Kai run? The calculation: 58 − 35 = 23."
            say: "Freya runs thirty-five metres. Kai runs fifty-eight metres. How much further does Kai run? The calculation is done for you: fifty-eight subtract thirty-five is twenty-three. Which answer sentence answers the question?"
            options: ["Kai runs 58 metres.", "They run 93 metres.", "Kai runs 23 metres further."]
            answer: "Kai runs 23 metres further."
