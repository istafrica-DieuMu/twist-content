# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.place-value-to-1000
skill: math.numbers-to-1000.place-value
curriculum: en-GB
language: en
title:
  de: Stellenwert bis 1000
  en: Place value to 1000
summary: >
  Three-digit numbers in a place value chart (H, T, O) and the value of
  each digit: in 352 the 5 is worth 50. Lesson 1 puts numbers in the chart
  and partitions them; lesson 2 finds 10 or 100 more or less than a
  number, which Year 3 asks for, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.hundreds]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { en: [place value, digit, hundreds, tens, ones, partition, 10 more, 100 less] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart, base-ten]
  facets: []
  misconceptions:
    - id: digit-is-value
      what: Says the 5 in 352 is worth 5
      addressed: lesson 1 Learn shows the 5 in 352 as five tens, worth fifty; feedback names the place
    - id: wrong-column-change
      what: Changes the ones digit for 10 more, or the tens digit for 100 more
      addressed: lesson 2 Learn says which column changes; feedback names the column
    - id: crossing
      what: Cannot find 10 more than 395 (writes 3105)
      addressed: lesson 2 sets 10 more across a hundred in every stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "H, Z und E", en: "H, T and O" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, hundreds: 2, tens: 4, ones: 1 }
            options: ["241", "142", "7"]
            answer: "241"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "300 + 50 + 6 = _"
            answer: "356"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "H | T | O"
            say: "The place value chart gets a new column: H for hundreds. It goes to the left of the tens."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 5, 2] }
          - text: "352 = 300 + 50 + 2"
            say: "Three hundred and fifty-two. The three is in the hundreds column, so it is worth three hundred. The five is worth fifty. The two is worth two."
            show: { drawn: base-ten, hundreds: 3, tens: 5, ones: 2 }
          - text: "525"
            say: "In five hundred and twenty-five there are two fives. The one on the left is worth five hundred, the one on the right only five. The place gives the value."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [5, 2, 5] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 5, 2] }
                options: ["352", "253", "325"]
                answer: "352"
                hints:
                  - "Read the chart from left to right."
                  - "3 hundreds, 5 tens, 2 ones."
                  - "The number is 352."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is the 4 in 247 worth?"
                options: ["4", "40", "400"]
                answer: "40"
                feedback:
                  "4": "The 4 is in the tens place, so it is worth 4 tens."
                hints:
                  - "Which place is the 4 in?"
                  - "The 4 is in the tens place: four tens."
                  - "Four tens are worth 40."
              - id: l1-f3
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [5, 0, 8] }
                options: ["58", "508", "580"]
                answer: "508"
                feedback:
                  "58": "There are 5 hundreds. The 0 in the tens place must be written."
                hints:
                  - "There is a 0 in the tens column."
                  - "5 hundreds, no tens, 8 ones."
                  - "The number is 508."
              - id: l1-f4
                type: fill_in_blank
                text: "Partition 683."
                frame: "683 = _ + _ + _"
                options: ["3", "8", "80", "600"]
                answer: ["600", "80", "3"]
                hints:
                  - "Each digit has its own value."
                  - "6 hundreds, 8 tens, 3 ones."
                  - "600 + 80 + 3."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which chart shows 730?"
                options:
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [7, 0, 3] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [7, 3, 0] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [0, 7, 3] }
                answer: "730"
                hints:
                  - "730 has 7 hundreds."
                  - "And 3 tens, no ones."
                  - "H: 7, T: 3, O: 0."
              - id: l1-f6
                type: multiple_choice
                text: "In which number is the 3 worth three hundred?"
                options: ["123", "231", "312"]
                answer: "312"
                hints:
                  - "The 3 must be in the hundreds place."
                  - "The hundreds are on the left."
                  - "In 312 the 3 is on the left."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [1, 9, 6] }
                options: ["196", "691", "169"]
                answer: "196"
                hints: ["Left to right."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the 8 in 382 worth?"
                options: ["8", "80", "800"]
                answer: "80"
                hints: ["Which place is the 8 in?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Partition 471."
                frame: "471 = _ + _ + _"
                options: ["1", "7", "70", "400"]
                answer: ["400", "70", "1"]
                hints: ["4 hundreds, 7 tens, 1 one."]
              - id: l1-s4
                type: text_input
                text: "800 + 6 = _"
                answer: "806"
                hints: ["No tens: a 0 in the tens place."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which chart shows 209?"
                options:
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [2, 9, 0] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [2, 0, 9] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [9, 0, 2] }
                answer: "209"
                hints: ["209 has no tens."]
              - id: l1-s6
                type: multiple_choice
                text: "What is the 2 in 902 worth?"
                options: ["2", "20", "200"]
                answer: "2"
                hints: ["The 2 is on the right."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [8, 2, 5] }
                options: ["825", "528", "852"]
                answer: "825"
              - id: l1-n2
                type: multiple_choice
                text: "What is the 6 in 165 worth?"
                options: ["6", "60", "600"]
                answer: "60"
              - id: l1-n3
                type: fill_in_blank
                text: "Partition 928."
                frame: "928 = _ + _ + _"
                options: ["8", "2", "20", "900"]
                answer: ["900", "20", "8"]
              - id: l1-n4
                type: text_input
                text: "700 + 40 = _"
                answer: "740"
              - id: l1-n5
                type: multiple_choice
                text: "In which number is the 1 worth one hundred?"
                options: ["410", "104", "641"]
                answer: "104"
              - id: l1-n6
                type: true_false
                text: "Is it true? In 333 all three digits are worth the same."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [2, 6, 4] }
            options: ["264", "462", "246"]
            answer: "264"
          - id: l1-c2
            type: multiple_choice
            text: "What is the 9 in 493 worth?"
            options: ["9", "90", "900"]
            answer: "90"
          - id: l1-c3
            type: fill_in_blank
            text: "Partition 754."
            frame: "754 = _ + _ + _"
            options: ["4", "5", "50", "700"]
            answer: ["700", "50", "4"]

  - n: 2
    title: { de: 10 und 100 mehr oder weniger, en: 10 or 100 more or less }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is the 3 in 531 worth?"
            options: ["3", "30", "300"]
            answer: "30"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is ten more than 46?"
            options: ["47", "56", "36"]
            answer: "56"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "352 → 362, 352 → 452"
            say: "Ten more than three hundred and fifty-two: only the tens digit changes, so it is three hundred and sixty-two. One hundred more: only the hundreds digit changes, so it is four hundred and fifty-two."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 5, 2] }
          - text: "352 → 342, 352 → 252"
            say: "Ten less is three hundred and forty-two. One hundred less is two hundred and fifty-two. The ones stay the same every time."
          - text: "395 → 405"
            say: "Ten more than three hundred and ninety-five. Nine tens and one more ten make ten tens, which is a new hundred. So it is four hundred and five."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [4, 0, 5] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is 100 more than 247?"
                options: ["257", "347", "248"]
                answer: "347"
                feedback:
                  "257": "That is 10 more. 100 more changes the hundreds digit."
                hints:
                  - "Which digit changes for 100 more?"
                  - "The hundreds: 2 becomes 3."
                  - "100 more than 247 is 347."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is 10 less than 586?"
                options: ["576", "486", "585"]
                answer: "576"
                hints:
                  - "Which digit changes for 10 less?"
                  - "The tens: 8 becomes 7."
                  - "10 less than 586 is 576."
              - id: l2-f3
                type: multiple_choice
                text: "What is 10 more than 395?"
                options: ["3105", "405", "396"]
                answer: "405"
                feedback:
                  "3105": "Ten tens make a hundred. The hundreds go up by one and the tens become 0."
                hints:
                  - "9 tens and 1 more ten make 10 tens."
                  - "10 tens are a new hundred."
                  - "10 more than 395 is 405."
              - id: l2-f4
                type: fill_in_blank
                text: "Fill in 100 less and 100 more."
                frame: "_ ← 628 → _"
                options: ["528", "618", "638", "728"]
                answer: ["528", "728"]
                hints:
                  - "Only the hundreds digit changes."
                  - "6 hundreds become 5 or 7."
                  - "528 and 728."
              - id: l2-f5
                type: true_false
                text: "Is it true? 10 less than 700 is 690."
                answer: true
                hints:
                  - "700 has no tens. Exchange one hundred for ten tens."
                  - "6 hundreds and 10 tens, then take one ten."
                  - "Yes, 690."
              - id: l2-f6
                type: text_input
                text: "Poppy has £460. She saves £100 more. How much does she have now?"
                answer: "560"
                hints:
                  - "100 more."
                  - "The hundreds digit goes up by one."
                  - "£560."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What is 10 more than 731?"
                options: ["741", "831", "732"]
                answer: "741"
                hints: ["The tens digit changes."]
              - id: l2-s2
                type: multiple_choice
                text: "What is 100 less than 409?"
                options: ["309", "399", "408"]
                answer: "309"
                hints: ["The hundreds digit changes."]
              - id: l2-s3
                type: multiple_choice
                text: "What is 10 more than 296?"
                options: ["2106", "306", "297"]
                answer: "306"
                hints: ["10 tens make a new hundred."]
              - id: l2-s4
                type: fill_in_blank
                text: "Fill in 10 less and 10 more."
                frame: "_ ← 854 → _"
                options: ["754", "844", "864", "954"]
                answer: ["844", "864"]
                hints: ["Only the tens digit changes."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 100 more than 900 is 1000."
                answer: true
                hints: ["Ten hundreds."]
              - id: l2-s6
                type: text_input
                text: "A book has 312 pages. Another has 10 fewer. How many pages does the other book have?"
                answer: "302"
                hints: ["10 less."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What is 100 more than 563?"
                options: ["573", "663", "564"]
                answer: "663"
              - id: l2-n2
                type: multiple_choice
                text: "What is 10 less than 205?"
                options: ["195", "105", "204"]
                answer: "195"
              - id: l2-n3
                type: fill_in_blank
                text: "Fill in 100 less and 100 more."
                frame: "_ ← 450 → _"
                options: ["350", "440", "460", "550"]
                answer: ["350", "550"]
              - id: l2-n4
                type: true_false
                text: "Is it true? 10 more than 988 is 998."
                answer: true
              - id: l2-n5
                type: text_input
                text: "What is 100 less than 1000?"
                answer: "900"
              - id: l2-n6
                type: multiple_choice
                text: "Which number is 10 more than 190?"
                options: ["191", "200", "290"]
                answer: "200"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [6, 0, 9] }
            options: ["69", "609", "690"]
            answer: "609"
          - id: l2-c2
            type: multiple_choice
            text: "What is the 7 in 571 worth?"
            options: ["7", "70", "700"]
            answer: "70"
          - id: l2-c3
            type: multiple_choice
            text: "What is 100 more than 386?"
            options: ["396", "486", "387"]
            answer: "486"
          - id: l2-c4
            type: multiple_choice
            text: "What is 10 more than 693?"
            options: ["6103", "703", "694"]
            answer: "703"
          - id: l2-c5
            type: fill_in_blank
            text: "Partition 308."
            frame: "308 = _ + _"
            options: ["3", "8", "30", "300"]
            answer: ["300", "8"]
