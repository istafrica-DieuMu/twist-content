# Lesson set: Maths, Year 2. Hand-authored draft.
id: en-GB.math.bundle-tens
skill: math.numbers-to-100.bundle-tens
curriculum: en-GB
language: en
title:
  de: Zehner bündeln
  en: Making tens
summary: >
  Year 2 opens with place value: grouping things into tens and counting
  tens and ones (3 tens and 4 ones make 34), then using tens to estimate
  a big amount and check it. Lesson 1 groups and counts; lesson 2
  estimates and checks, and ends with the skill check. Base ten blocks
  are the Dienes children use in class.
metadata:
  year: year-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.tens]
  also_practises: [math.numbers-to-20.teens]
  vocabulary: { en: [group, tens, ones, ten stick, estimate, check, about] }
  forms: [drawn, text, audio]
  drawn: [base-ten, hundred-field]
  facets: []
  misconceptions:
    - id: count-in-ones
      what: Counts every single cube instead of counting the tens as tens
      addressed: Learn counts tens first ("ten, twenty, thirty") then the ones; hints say "Count the tens first."
    - id: ten-stick-is-one
      what: Counts a ten stick as one (3 sticks and 4 cubes as 7)
      addressed: Learn shows that a ten stick is ten cubes joined; feedback on 7 says so
    - id: wild-guess
      what: Estimates without looking (says 100 for 30 things)
      addressed: lesson 2 sees one row of ten first, then checks by counting the rows
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner und Einer, en: Tens and ones }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Count in tens: 10, 20, 30, _"
            say: "Count in tens: ten, twenty, thirty. What comes next?"
            options: ["31", "40", "50"]
            answer: "40"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many?"
            say: "One ten and three more. How many is that?"
            show: { drawn: base-ten, tens: 1, ones: 3 }
            options: ["4", "13", "31"]
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10"
            say: "Ten ones cubes can be joined into one stick. A ten stick is ten."
            show: { drawn: base-ten, tens: 1, ones: 0 }
          - text: "10, 20, 30"
            say: "Three ten sticks. We count them in tens: ten, twenty, thirty."
            show: { drawn: base-ten, tens: 3, ones: 0 }
          - text: "3 tens and 4 ones make 34"
            say: "Three tens and four ones. Tens first: ten, twenty, thirty. Then the ones: thirty-one, thirty-two, thirty-three, thirty-four. There are thirty-four."
            show: { drawn: base-ten, tens: 3, ones: 4 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, tens: 2, ones: 5 }
                options: ["7", "25", "52"]
                answer: "25"
                feedback:
                  "7": "A stick is ten, not one. Count the sticks in tens."
                  "52": "Tens first: two tens make twenty. Then five ones."
                hints:
                  - "Count the tens first: ten, twenty."
                  - "Then count on the ones."
                  - "2 tens and 5 ones make 25."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "How many tens and how many ones?"
                show: { drawn: base-ten, tens: 4, ones: 2 }
                frame: "_ tens and _ ones"
                options: ["2", "4", "6", "42"]
                answer: ["4", "2"]
                hints:
                  - "The sticks are the tens."
                  - "Count the sticks, then count the cubes."
                  - "4 tens and 2 ones."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which shows 36?"
                options:
                  - { drawn: base-ten, tens: 6, ones: 3 }
                  - { drawn: base-ten, tens: 3, ones: 6 }
                  - { drawn: base-ten, tens: 3, ones: 3 }
                answer: "36"
                hints:
                  - "In 36, the 3 tells you the tens."
                  - "Look for 3 sticks."
                  - "3 sticks and 6 cubes make 36."
              - id: l1-f4
                type: true_false
                text: "Is it true? 5 tens and 1 one make 51."
                show: { drawn: base-ten, tens: 5, ones: 1 }
                answer: true
                hints:
                  - "Count the tens: ten, twenty, ..."
                  - "Five tens make fifty. Add one more."
                  - "Yes, that is 51."
              - id: l1-f5
                type: multiple_choice
                text: "Group the cubes into tens. How many?"
                say: "Ten of these cubes have been joined into a stick. How many are there now?"
                show: { drawn: base-ten, tens: 1, ones: 7 }
                options: ["8", "17", "71"]
                answer: "17"
                hints:
                  - "A stick is ten."
                  - "Ten and seven more."
                  - "There are 17."
              - id: l1-f6
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, tens: 6, ones: 0 }
                options: ["6", "16", "60"]
                answer: "60"
                hints:
                  - "There are only sticks, no ones."
                  - "Count in tens: ten, twenty, thirty, ..."
                  - "Six tens make 60."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, tens: 3, ones: 8 }
                options: ["38", "83", "11"]
                answer: "38"
                hints: ["Tens first, then ones."]
              - id: l1-s2
                type: fill_in_blank
                text: "How many tens and how many ones?"
                show: { drawn: base-ten, tens: 7, ones: 3 }
                frame: "_ tens and _ ones"
                options: ["3", "7", "10", "73"]
                answer: ["7", "3"]
                hints: ["Sticks are tens, cubes are ones."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which shows 52?"
                options:
                  - { drawn: base-ten, tens: 2, ones: 5 }
                  - { drawn: base-ten, tens: 5, ones: 2 }
                  - { drawn: base-ten, tens: 5, ones: 5 }
                answer: "52"
                hints: ["In 52, the 5 is the tens."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 4 tens and 6 ones make 64."
                show: { drawn: base-ten, tens: 4, ones: 6 }
                answer: false
                hints: ["Four tens make forty."]
              - id: l1-s5
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, tens: 8, ones: 4 }
                options: ["84", "48", "12"]
                answer: "84"
                hints: ["Count the sticks in tens."]
              - id: l1-s6
                type: multiple_choice
                text: "How many tens make 90?"
                options: ["9", "90", "10"]
                answer: "9"
                hints: ["Ten, twenty, ... up to ninety. How many tens did you count?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, tens: 2, ones: 9 }
                options: ["29", "92", "11"]
                answer: "29"
              - id: l1-n2
                type: fill_in_blank
                text: "How many tens and how many ones?"
                show: { drawn: base-ten, tens: 6, ones: 5 }
                frame: "_ tens and _ ones"
                options: ["5", "6", "11", "65"]
                answer: ["6", "5"]
              - id: l1-n3
                type: image_multiple_choice
                text: "Which shows 47?"
                options:
                  - { drawn: base-ten, tens: 7, ones: 4 }
                  - { drawn: base-ten, tens: 4, ones: 7 }
                  - { drawn: base-ten, tens: 4, ones: 4 }
                answer: "47"
              - id: l1-n4
                type: true_false
                text: "Is it true? 9 tens and 9 ones make 99."
                show: { drawn: base-ten, tens: 9, ones: 9 }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, tens: 0, ones: 8 }
                options: ["8", "80", "18"]
                answer: "8"
                difficulty: easy

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, tens: 5, ones: 3 }
            options: ["35", "53", "8"]
            answer: "53"
          - id: l1-c2
            type: image_multiple_choice
            text: "Which shows 61?"
            options:
              - { drawn: base-ten, tens: 1, ones: 6 }
              - { drawn: base-ten, tens: 6, ones: 1 }
              - { drawn: base-ten, tens: 6, ones: 6 }
            answer: "61"
          - id: l1-c3
            type: fill_in_blank
            text: "How many tens and how many ones?"
            show: { drawn: base-ten, tens: 3, ones: 0 }
            frame: "_ tens and _ ones"
            options: ["0", "3", "30"]
            answer: ["3", "0"]

  - n: 2
    title: { de: Schätzen und prüfen, en: Estimate and check }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, tens: 4, ones: 5 }
            options: ["45", "54", "9"]
            answer: "45"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Which shows 28?"
            options:
              - { drawn: base-ten, tens: 2, ones: 8 }
              - { drawn: base-ten, tens: 8, ones: 2 }
            answer: "28"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Estimate"
            say: "How many dots are there? Counting every one takes a long time. To estimate means to say about how many. I estimate about forty."
            show: { drawn: hundred-field, filled: 40, flash: 2 }
          - text: "10"
            say: "A tip: look at what ten looks like first. One row on this grid is ten."
            show: { drawn: hundred-field, filled: 10 }
          - text: "40"
            say: "Now I can check. There are four full rows, so four tens. That is forty. My estimate was good. You can check any estimate by counting the tens."
            show: { drawn: hundred-field, filled: 40 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Estimate: about how many?"
                say: "Take a quick look and estimate. About how many dots are there?"
                show: { drawn: hundred-field, filled: 30, flash: 2 }
                options: ["about 10", "about 30", "about 90"]
                answer: "about 30"
                hints:
                  - "One full row is ten."
                  - "There were three full rows."
                  - "About 30."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Check: how many exactly?"
                show: { drawn: hundred-field, filled: 30 }
                options: ["3", "30", "300"]
                answer: "30"
                hints:
                  - "Count the full rows."
                  - "Three rows are three tens."
                  - "Three tens make 30."
              - id: l2-f3
                type: multiple_choice
                text: "How many?"
                show: { drawn: hundred-field, filled: 56 }
                options: ["56", "65", "50"]
                answer: "56"
                hints:
                  - "Count the full rows first."
                  - "Five full rows make fifty. The next row has six."
                  - "50 and 6 make 56."
              - id: l2-f4
                type: true_false
                text: "Is it a good estimate?"
                say: "Poppy estimates about seventy. Look how many there are. Is that a good estimate?"
                show: { drawn: hundred-field, filled: 68 }
                answer: true
                hints:
                  - "Count the full rows."
                  - "Six full rows and eight more: 68."
                  - "68 is close to 70. Yes, a good estimate."
              - id: l2-f5
                type: multiple_choice
                text: "Estimate: about how many?"
                say: "Take a quick look and estimate. About how many dots are there?"
                show: { drawn: hundred-field, filled: 90, flash: 2 }
                options: ["about 20", "about 50", "about 90"]
                answer: "about 90"
                hints:
                  - "Was the grid nearly full or nearly empty?"
                  - "Nearly full means nearly a hundred."
                  - "About 90."
              - id: l2-f6
                type: multiple_choice
                text: "How many?"
                show: { drawn: hundred-field, filled: 23 }
                options: ["23", "32", "20"]
                answer: "23"
                hints:
                  - "How many full rows?"
                  - "Two full rows and three more."
                  - "20 and 3 make 23."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Estimate: about how many?"
                say: "Take a quick look and estimate. About how many dots are there?"
                show: { drawn: hundred-field, filled: 50, flash: 2 }
                options: ["about 15", "about 50", "about 95"]
                answer: "about 50"
                hints: ["It was about half full."]
              - id: l2-s2
                type: multiple_choice
                text: "How many?"
                show: { drawn: hundred-field, filled: 74 }
                options: ["74", "47", "70"]
                answer: "74"
                hints: ["Full rows first, then the dots in the last row."]
              - id: l2-s3
                type: true_false
                text: "Is it a good estimate?"
                say: "Jack estimates about twenty. Look how many there are. Is that a good estimate?"
                show: { drawn: hundred-field, filled: 81 }
                answer: false
                hints: ["How many full rows are there?"]
              - id: l2-s4
                type: multiple_choice
                text: "How many?"
                show: { drawn: hundred-field, filled: 40 }
                options: ["4", "40", "14"]
                answer: "40"
                hints: ["Only full rows."]
              - id: l2-s5
                type: multiple_choice
                text: "Estimate: about how many?"
                say: "Take a quick look and estimate. About how many dots are there?"
                show: { drawn: hundred-field, filled: 12, flash: 2 }
                options: ["about 10", "about 40", "about 80"]
                answer: "about 10"
                hints: ["Was it about one row, or lots of rows?"]
              - id: l2-s6
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, tens: 7, ones: 7 }
                options: ["77", "14", "70"]
                answer: "77"
                hints: ["Count the sticks in tens."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Estimate: about how many?"
                say: "Take a quick look and estimate. About how many dots are there?"
                show: { drawn: hundred-field, filled: 70, flash: 1.5 }
                options: ["about 30", "about 70", "about 100"]
                answer: "about 70"
              - id: l2-n2
                type: multiple_choice
                text: "How many?"
                show: { drawn: hundred-field, filled: 35 }
                options: ["35", "53", "30"]
                answer: "35"
              - id: l2-n3
                type: true_false
                text: "Is it a good estimate?"
                say: "Amir estimates about sixty. Look how many there are. Is that a good estimate?"
                show: { drawn: hundred-field, filled: 58 }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "How many?"
                show: { drawn: hundred-field, filled: 99 }
                options: ["90", "99", "100"]
                answer: "99"
              - id: l2-n5
                type: multiple_choice
                text: "How many?"
                show: { drawn: base-ten, tens: 9, ones: 0 }
                options: ["9", "90", "19"]
                answer: "90"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "How many?"
            show: { drawn: base-ten, tens: 3, ones: 7 }
            options: ["37", "73", "10"]
            answer: "37"
          - id: l2-c2
            type: fill_in_blank
            text: "How many tens and how many ones?"
            show: { drawn: base-ten, tens: 8, ones: 1 }
            frame: "_ tens and _ ones"
            options: ["1", "8", "9", "81"]
            answer: ["8", "1"]
          - id: l2-c3
            type: multiple_choice
            text: "How many?"
            show: { drawn: hundred-field, filled: 62 }
            options: ["62", "26", "60"]
            answer: "62"
          - id: l2-c4
            type: image_multiple_choice
            text: "Which shows 44?"
            options:
              - { drawn: base-ten, tens: 4, ones: 0 }
              - { drawn: base-ten, tens: 0, ones: 4 }
              - { drawn: base-ten, tens: 4, ones: 4 }
            answer: "44"
          - id: l2-c5
            type: multiple_choice
            text: "Estimate: about how many?"
            say: "Take a quick look and estimate. About how many dots are there?"
            show: { drawn: hundred-field, filled: 40, flash: 2 }
            options: ["about 10", "about 40", "about 90"]
            answer: "about 40"
