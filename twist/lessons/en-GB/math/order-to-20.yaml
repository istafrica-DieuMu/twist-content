# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.order-to-20
skill: math.numbers-to-20.order-to-20
curriculum: en-GB
language: en
title:
  de: Zahlen bis 20 ordnen
  en: Counting and ordering to 20
summary: >
  Counting forwards and backwards to 20 and finding numbers on a number
  line. Lesson 1 says the number after and before, across ten; lesson 2
  puts numbers in order and finds missing numbers in a count, and ends
  with the skill check. Spoken questions; numbers say themselves.
metadata:
  year: reception
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.teens, math.numbers-to-20.order-to-10]
  also_practises: [math.numbers-to-20.teens]
  vocabulary: { en: [after, before, next, count on, count back, number line] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [number-line]
  facets: []
  misconceptions:
    - id: stuck-at-ten
      what: Counting on, goes from nine to "ten-one", or counting back skips ten
      addressed: Learn counts across ten both ways; tasks across ten in every stage, with feedback in the full stage
    - id: before-after-mixed
      what: Gives the number after when asked for the number before
      addressed: Learn says before is one less, after is one more, with hops on the number line
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Davor und danach, en: Before and after }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Let's count on the number line: eight, nine, ten, eleven, twelve. After ten comes eleven."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[8, 1], [9, 1], [10, 1], [11, 1]] }
          - say: "The number after is one more. After fourteen comes fifteen."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[14, 1]] }
          - say: "The number before is one less. Before fourteen comes thirteen."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[14, -1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What comes after 10?"
                say: "Count with me: eight, nine, ten. What number comes after ten?"
                options: ["11", "9", "20"]
                answer: "11"
                hints:
                  - "After means one more."
                  - "Ten, then ..."
                  - "Eleven."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What comes before 12?"
                say: "What number comes before twelve?"
                show: { drawn: number-line, from: 0, to: 20, labels: all }
                options: ["11", "13", "10"]
                answer: "11"
                feedback:
                  "13": "Thirteen comes after twelve. Before means one less: eleven."
                hints:
                  - "Before means one less."
                  - "Count back one from twelve."
                  - "Eleven."
              - id: l1-f3
                type: point_on_line
                text: "Where is 15?"
                say: "Find fifteen on the number line. Tap it."
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 15
                hints:
                  - "Find the ten in the middle."
                  - "Count on five from ten."
                  - "Tap the fifth line after ten."
              - id: l1-f4
                type: true_false
                text: "Is 17 after 16?"
                say: "Does seventeen come after sixteen?"
                answer: true
                hints:
                  - "Count: sixteen, seventeen."
                  - "Seventeen is one more."
                  - "Yes."
              - id: l1-f5
                type: multiple_choice
                text: "What comes before 10?"
                say: "Count back: twelve, eleven, ten. What number comes before ten?"
                options: ["9", "11", "1"]
                answer: "9"
                hints:
                  - "Count back one from ten."
                  - "Ten, then ..."
                  - "Nine."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What comes after 15?"
                say: "What number comes after fifteen?"
                options: ["16", "14", "51"]
                answer: "16"
                hints: ["After means one more."]
              - id: l1-s2
                type: multiple_choice
                text: "What comes before 19?"
                say: "What number comes before nineteen?"
                show: { drawn: number-line, from: 0, to: 20, labels: all }
                options: ["18", "20", "9"]
                answer: "18"
                hints: ["Before means one less."]
              - id: l1-s3
                type: point_on_line
                text: "Where is 12?"
                say: "Find twelve on the number line. Tap it."
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 12
                hints: ["Start at ten."]
              - id: l1-s4
                type: true_false
                text: "Is 13 before 12?"
                say: "Does thirteen come before twelve?"
                answer: false
                hints: ["Count: eleven, twelve, thirteen."]
              - id: l1-s5
                type: multiple_choice
                text: "What comes after 19?"
                say: "What number comes after nineteen?"
                options: ["20", "18", "10"]
                answer: "20"
                hints: ["One more than nineteen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What comes after 13?"
                say: "What number comes after thirteen?"
                options: ["14", "12", "31"]
                answer: "14"
              - id: l1-n2
                type: multiple_choice
                text: "What comes before 11?"
                say: "What number comes before eleven?"
                options: ["10", "12", "1"]
                answer: "10"
              - id: l1-n3
                type: point_on_line
                text: "Where is 18?"
                say: "Find eighteen on the number line. Tap it."
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 18
              - id: l1-n4
                type: true_false
                text: "Is 20 after 19?"
                say: "Does twenty come after nineteen?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "What comes before 16?"
                say: "What number comes before sixteen?"
                options: ["15", "17", "6"]
                answer: "15"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What comes after 11?"
            say: "What number comes after eleven?"
            options: ["12", "10", "21"]
            answer: "12"
          - id: l1-c2
            type: multiple_choice
            text: "What comes before 14?"
            say: "What number comes before fourteen?"
            options: ["13", "15", "4"]
            answer: "13"
          - id: l1-c3
            type: point_on_line
            text: "Where is 17?"
            say: "Find seventeen on the number line. Tap it."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 17

  - n: 2
    title: { de: In der richtigen Reihenfolge, en: In order }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Counting back crosses ten too: thirteen, twelve, eleven, ten, nine. Do not forget ten."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[13, -1], [12, -1], [11, -1], [10, -1]] }
          - say: "To put numbers in order, start with the smallest. Eleven, twelve, thirteen, fourteen: each one is one more."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Put them in order."
                say: "Put the numbers in order. Smallest first."
                options: ["13", "11", "14", "12"]
                slot_count: 4
                answer: ["11", "12", "13", "14"]
                hints:
                  - "Which number is smallest?"
                  - "Eleven, then twelve."
                  - "Eleven, twelve, thirteen, fourteen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is missing? 9, 10, _, 12"
                say: "Nine, ten, something, twelve. Which number is missing?"
                options: ["11", "13", "8"]
                answer: "11"
                hints:
                  - "What comes after ten?"
                  - "Ten, eleven, twelve."
                  - "Eleven."
              - id: l2-f3
                type: true_false
                text: "Is this right? 12, 11, 9, 8"
                say: "Someone counts back: twelve, eleven, nine, eight. Is that right?"
                answer: false
                feedback:
                  "true": "Ten is missing. Count back: twelve, eleven, ten, nine."
                hints:
                  - "Count back from twelve yourself."
                  - "Twelve, eleven, ..."
                  - "No, ten is missing."
              - id: l2-f4
                type: ordering
                text: "Count back."
                say: "Count back. Biggest number first."
                options: ["18", "20", "17", "19"]
                slot_count: 4
                answer: ["20", "19", "18", "17"]
                hints:
                  - "Which number is biggest?"
                  - "Twenty, then nineteen."
                  - "Twenty, nineteen, eighteen, seventeen."
              - id: l2-f5
                type: multiple_choice
                text: "What is missing? 15, 16, _, 18"
                say: "Fifteen, sixteen, something, eighteen. Which number is missing?"
                options: ["17", "19", "14"]
                answer: "17"
                hints:
                  - "What comes after sixteen?"
                  - "Sixteen, seventeen."
                  - "Seventeen."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Put them in order."
                say: "Put the numbers in order. Smallest first."
                options: ["16", "18", "15", "17"]
                slot_count: 4
                answer: ["15", "16", "17", "18"]
                hints: ["Start with the smallest."]
              - id: l2-s2
                type: multiple_choice
                text: "What is missing? 12, 11, _, 9"
                say: "Count back: twelve, eleven, something, nine. Which number is missing?"
                options: ["10", "13", "8"]
                answer: "10"
                hints: ["What comes before eleven?"]
              - id: l2-s3
                type: true_false
                text: "Is this right? 17, 18, 19, 20"
                say: "Someone counts on: seventeen, eighteen, nineteen, twenty. Is that right?"
                answer: true
                hints: ["Is each number one more?"]
              - id: l2-s4
                type: ordering
                text: "Count back."
                say: "Count back. Biggest number first."
                options: ["10", "12", "9", "11"]
                slot_count: 4
                answer: ["12", "11", "10", "9"]
                hints: ["Start with the biggest."]
              - id: l2-s5
                type: multiple_choice
                text: "What is missing? 18, _, 20"
                say: "Eighteen, something, twenty. Which number is missing?"
                options: ["19", "17", "21"]
                answer: "19"
                hints: ["One more than eighteen."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Put them in order."
                say: "Put the numbers in order. Smallest first."
                options: ["10", "8", "9", "11"]
                slot_count: 4
                answer: ["8", "9", "10", "11"]
              - id: l2-n2
                type: multiple_choice
                text: "What is missing? 13, 14, _, 16"
                say: "Thirteen, fourteen, something, sixteen. Which number is missing?"
                options: ["15", "17", "12"]
                answer: "15"
              - id: l2-n3
                type: true_false
                text: "Is this right? 14, 13, 12, 11"
                say: "Someone counts back: fourteen, thirteen, twelve, eleven. Is that right?"
                answer: true
              - id: l2-n4
                type: ordering
                text: "Count back."
                say: "Count back. Biggest number first."
                options: ["14", "16", "13", "15"]
                slot_count: 4
                answer: ["16", "15", "14", "13"]
              - id: l2-n5
                type: multiple_choice
                text: "What is missing? 11, _, 9"
                say: "Count back: eleven, something, nine. Which number is missing?"
                options: ["10", "12", "8"]
                answer: "10"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Put them in order."
            say: "Put the numbers in order. Smallest first."
            options: ["19", "17", "20", "18"]
            slot_count: 4
            answer: ["17", "18", "19", "20"]
          - id: l2-c2
            type: multiple_choice
            text: "What comes before 18?"
            say: "What number comes before eighteen?"
            options: ["17", "19", "8"]
            answer: "17"
          - id: l2-c3
            type: multiple_choice
            text: "What is missing? 10, 11, _, 13"
            say: "Ten, eleven, something, thirteen. Which number is missing?"
            options: ["12", "14", "9"]
            answer: "12"
          - id: l2-c4
            type: point_on_line
            text: "Where is 14?"
            say: "Find fourteen on the number line. Tap it."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 14
