# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-familiar-words
skill: fl.listening.familiar-words
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Wörter, die ich kenne (Französisch)
  en: French words I know
summary: >
  Children hear French words and tap the matching picture. The first words
  are ones that look and sound almost like English (le lion, la girafe, le
  téléphone), so children understand French from the very start and hear
  how the sounds change. Lesson 1 brings six such words, lesson 2 five more
  and the instruction Montrez ... ! and ends with the skill check. Heard,
  not read.
metadata:
  year: ly-1
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.classroom-phrases]
  also_practises: [fl.speaking.imitate]
  vocabulary: { fr: [le lion, l'éléphant, la girafe, le crocodile, l'orange, la banane, le bus, la table, le téléphone, la rose, la carotte] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: english-sound
      what: Expects the English sound and misses the French one (giraffe, girafe)
      addressed: Learn says the English word, then the French one, and what changes
    - id: articles
      what: Drops le and la, or hears them as part of the word
      addressed: every word is heard with its article; hints say "le and la mean the"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Das klingt wie Englisch, en: It sounds like English }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Some French words sound almost like English ones. In English we say lion. In French:", fr: "le lion. Le lion." }
            show: { object: lion }
          - say: { en: "Elephant in French:", fr: "l'éléphant. L'éléphant." }
            show: { object: elephant }
          - say: { en: "Giraffe:", fr: "la girafe. La girafe." }
            show: { object: giraffe }
          - say: { en: "Crocodile:", fr: "le crocodile." }
            show: { object: crocodile }
          - say: { en: "Orange:", fr: "l'orange." }
            show: { object: orange }
          - say: { en: "And banana. Le and la both mean the.", fr: "la banane." }
            show: { object: banana }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "la girafe" }
                options: [{ object: giraffe }, { object: elephant }, { object: lion }]
                answer: giraffe
                hints:
                  - "Listen again: la girafe."
                  - "It sounds like an English animal with a long neck."
                  - "La girafe is the giraffe."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "la banane" }
                options: [{ object: orange }, { object: banana }, { object: crocodile }]
                answer: banana
                hints:
                  - "Listen again: la banane."
                  - "It sounds nearly like banana."
                  - "Tap the banana."
              - id: l1-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "le crocodile" }
                show: { object: crocodile }
                answer: true
                hints:
                  - "Listen again: le crocodile."
                  - "It sounds like crocodile."
                  - "Yes, that's a crocodile."
              - id: l1-f4
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "l'éléphant" }
                options: [{ object: lion }, { object: giraffe }, { object: elephant }]
                answer: elephant
                hints:
                  - "Listen again: l'éléphant."
                  - "It sounds like elephant."
                  - "Tap the elephant."
              - id: l1-f5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "le lion" }
                show: { object: orange }
                answer: false
                hints:
                  - "Listen again: le lion."
                  - "Le lion is an animal."
                  - "No, that's an orange."
              - id: l1-f6
                type: speak
                say: { en: "Say it in French.", fr: "la banane" }
                show: { object: banana }
                expected_text: "la banane"
                hints:
                  - "Listen again: la banane."
                  - "La, then ba-nane."
                  - "Say it with me: la banane."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "l'orange" }
                options: [{ object: orange }, { object: banana }, { object: lion }]
                answer: orange
                hints: ["It sounds nearly like orange."]
              - id: l1-s2
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "le lion" }
                options: [{ object: elephant }, { object: crocodile }, { object: lion }]
                answer: lion
                hints: ["It sounds nearly like lion."]
              - id: l1-s3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "la girafe" }
                show: { object: elephant }
                answer: false
                hints: ["La girafe has a long neck."]
              - id: l1-s4
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "le crocodile" }
                options: [{ object: crocodile }, { object: giraffe }, { object: orange }]
                answer: crocodile
                hints: ["Listen again."]
              - id: l1-s5
                type: speak
                say: { en: "Say it in French.", fr: "le lion" }
                show: { object: lion }
                expected_text: "le lion"
                hints: ["Listen again: le lion."]
              - id: l1-s6
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "l'orange" }
                show: { object: orange }
                answer: true
                hints: ["It sounds nearly like orange."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "l'éléphant" }
                options: [{ object: elephant }, { object: banana }, { object: lion }]
                answer: elephant
              - id: l1-n2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "la banane" }
                show: { object: banana }
                answer: true
              - id: l1-n3
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "la girafe" }
                options: [{ object: crocodile }, { object: orange }, { object: giraffe }]
                answer: giraffe
              - id: l1-n4
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "le lion" }
                options: [{ object: lion }, { object: giraffe }, { object: banana }]
                answer: lion
              - id: l1-n5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "le crocodile" }
                show: { object: lion }
                answer: false
              - id: l1-n6
                type: speak
                say: { en: "Say it in French.", fr: "la girafe" }
                show: { object: giraffe }
                expected_text: "la girafe"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "la banane" }
            options: [{ object: banana }, { object: orange }, { object: elephant }]
            answer: banana
          - id: l1-c2
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "le crocodile" }
            options: [{ object: lion }, { object: crocodile }, { object: giraffe }]
            answer: crocodile
          - id: l1-c3
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "l'éléphant" }
            show: { object: elephant }
            answer: true

  - n: 2
    title: { de: Zeig auf das Bild, en: Point to the picture }
    new_content: true
