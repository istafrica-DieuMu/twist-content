                audio: { fr: "Montrez le crocodile !" }
                options: [{ object: crocodile }, { object: carrot }, { object: lion }]
                answer: crocodile
              - id: l2-n2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "le téléphone" }
                show: { object: table }
                answer: false
              - id: l2-n3
                type: audio_choice
                text: "Listen and point."
                say: { en: "Listen and point to the picture." }
                audio: { fr: "Montrez la carotte !" }
                options: [{ object: banana }, { object: carrot }, { object: rose }]
                answer: carrot
              - id: l2-n4
                type: audio_choice
                text: "Listen and point."
                say: { en: "Listen and point to the picture." }
                audio: { fr: "Montrez la girafe !" }
                options: [{ object: elephant }, { object: bus }, { object: giraffe }]
                answer: giraffe
              - id: l2-n5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "le bus" }
                show: { object: bus }
                answer: true
              - id: l2-n6
                type: speak
                say: { en: "Say it in French.", fr: "la table" }
                show: { object: table }
                expected_text: "la table"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
