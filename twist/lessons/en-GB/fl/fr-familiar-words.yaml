          - say: { en: "Table:", fr: "la table. La table." }
            show: { object: table }
          - say: { en: "Telephone:", fr: "le téléphone. Le téléphone." }
            show: { object: telephone }
          - say: { en: "Rose, and carrot:", fr: "la rose. La carotte." }
            show: { object: carrot }
          - say: { en: "When you hear Montrez and then a word, point to the picture. For example:", fr: "Montrez le bus !" }
            show: { object: point }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Listen and point."
                say: { en: "Listen and point to the picture." }
                audio: { fr: "Montrez le bus !" }
                options: [{ object: bus }, { object: table }, { object: telephone }]
                answer: bus
                hints:
                  - "Listen again: Montrez le bus !"
                  - "Bus sounds the same in French and English."
                  - "Tap the bus."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Listen and point."
                say: { en: "Listen and point to the picture." }
                audio: { fr: "Montrez la carotte !" }
                options: [{ object: rose }, { object: carrot }, { object: orange }]
