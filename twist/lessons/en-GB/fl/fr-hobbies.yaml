# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-hobbies
skill: fl.themes.hobbies
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Hobbys und Sport (Französisch)
  en: Hobbies and sport in French
summary: >
  French learning year 3 opens with hobbies: jouer au foot, nager, danser,
  peindre, lire, jouer au tennis, jouer de la guitare, faire du vélo,
  chanter, and two patterns to talk about them, j'aime ... and je sais ...
  Lesson 1 learns the words by ear and picture; lesson 2 reads and builds
  short sentences, including je n'aime pas, and ends with the skill check.
  Speaking tasks are practice only.
metadata:
  year: ly-3
  topic: { de: Hobbys und Sport, en: Hobbies and sport }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.grammar.chunks, fl.speaking.likes]
  vocabulary: { fr: [jouer au foot, nager, danser, peindre, lire, jouer au tennis, jouer de la guitare, faire du vélo, chanter, j'aime, je n'aime pas, je sais] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: au-de-la
      what: Uses jouer à for instruments (jouer à la guitare)
      addressed: lesson 1 Learn sets jouer à (au foot, au tennis) against jouer de (de la guitare)
    - id: ne-pas
      what: Leaves out the ne or the pas (je aime pas)
      addressed: lesson 2 Learn wraps n' and pas round aime; a word-card task builds je n'aime pas le tennis
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was machst du gern?", en: "What do you like doing?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "un chat" }
            options: [{ object: cat }, { object: dog }, { object: rabbit }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "une pomme" }
            options: [{ object: banana }, { object: apple }, { object: bread }]
            answer: apple
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Hobbies in French. Listen:", fr: "Nager." }
            show: { object: swim }
          - say: { en: "And:", fr: "Danser." }
            show: { object: dance }
          - say: { en: "And:", fr: "Lire." }
            show: { object: read }
          - say: { en: "And:", fr: "Faire du vélo." }
            show: { object: ride-bike }
          - say: { en: "For sports we say jouer à: jouer au foot, jouer au tennis. For instruments we say jouer de: jouer de la guitare, jouer du piano.", fr: "Jouer au foot. Jouer de la guitare." }
            show: { object: play-guitar }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "nager" }
                options: [{ object: swim }, { object: sing }, { object: dance }]
                answer: swim
                hints:
                  - "Listen again: nager."
                  - "Nager is something you do in water."
                  - "Tap the child swimming."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "jouer de la guitare" }
                options: [{ object: play-tennis }, { object: play-guitar }, { object: play-football }]
                answer: play-guitar
                feedback:
                  play-tennis: "Listen to the last word: guitare, not tennis."
                hints:
                  - "All three start with jouer. Listen to the end."
                  - "Guitare sounds like guitar."
                  - "Tap the guitar."
              - id: l1-f3
                type: true_false
                say: { en: "Listen. Does the picture match?", fr: "danser" }
                show: { object: dance }
                answer: true
                hints:
                  - "Listen again: danser."
                  - "Danser means to dance."
                  - "Yes."
              - id: l1-f4
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "faire du vélo" }
                options: [{ object: ride-bike }, { object: read }, { object: swim }]
                answer: ride-bike
                hints:
                  - "Listen for vélo."
                  - "Un vélo is a bike."
                  - "Tap the child on the bike."
              - id: l1-f5
                type: speak
                say: { en: "Say it in French.", fr: "chanter" }
                show: { object: sing }
                expected_text: "chanter"
                hints:
                  - "Listen again: chanter."
                  - "Shon-tay."
                  - "Say it with me: chanter."
              - id: l1-f6
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "lire" }
                options: [{ object: read }, { object: paint }, { object: sing }]
                answer: read
                hints:
                  - "Listen again: lire."
                  - "Lire means to read."
                  - "Tap the child with the book."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "chanter" }
                options: [{ object: swim }, { object: sing }, { object: dance }]
                answer: sing
                hints: ["Chanter means to sing."]
              - id: l1-s2
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "jouer au tennis" }
                options: [{ object: play-football }, { object: play-tennis }, { object: play-guitar }]
                answer: play-tennis
                hints: ["Listen to the end."]
              - id: l1-s3
                type: true_false
                say: { en: "Listen. Does the picture match?", fr: "nager" }
                show: { object: ride-bike }
                answer: false
                hints: ["Nager is to swim."]
              - id: l1-s4
                type: sorting
                text: "Jouer à or jouer de?"
                say: { en: "Do we say jouer à or jouer de? Sort the pictures." }
                bins:
                  - { id: au, show: { text: "jouer à ..." }, say: { fr: "jouer à" } }
                  - { id: de-la, show: { text: "jouer de ..." }, say: { fr: "jouer de" } }
                options:
                  - { object: play-football, bin: au }
                  - { object: play-guitar, bin: de-la }
                  - { object: play-tennis, bin: au }
                hints: ["Sports take jouer à; instruments take jouer de."]
              - id: l1-s5
                type: speak
                say: { en: "Say it in French.", fr: "jouer au foot" }
                show: { object: play-football }
                expected_text: "jouer au foot"
                hints: ["Say it with me: jouer au foot."]
              - id: l1-s6
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "peindre" }
                options: [{ object: read }, { object: paint }, { object: play-guitar }]
                answer: paint
                hints: ["Peindre means to paint."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "danser" }
                options: [{ object: dance }, { object: sing }, { object: swim }]
                answer: dance
              - id: l1-n2
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "jouer au foot" }
                options: [{ object: play-tennis }, { object: play-football }, { object: ride-bike }]
                answer: play-football
              - id: l1-n3
                type: true_false
                say: { en: "Listen. Does the picture match?", fr: "lire" }
                show: { object: read }
                answer: true
              - id: l1-n4
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "faire du vélo" }
                options: [{ object: swim }, { object: ride-bike }, { object: play-tennis }]
                answer: ride-bike
              - id: l1-n5
                type: speak
                say: { en: "Say it in French.", fr: "nager" }
                show: { object: swim }
                expected_text: "nager"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "chanter" }
            options: [{ object: sing }, { object: read }, { object: dance }]
            answer: sing
          - id: l1-c2
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "jouer de la guitare" }
            options: [{ object: play-guitar }, { object: play-football }, { object: paint }]
            answer: play-guitar
          - id: l1-c3
            type: true_false
            say: { en: "Listen. Does the picture match?", fr: "jouer au tennis" }
            show: { object: play-football }
            answer: false

  - n: 2
    title: { de: "J'aime ... und je sais ...", en: "J'aime ... and je sais ..." }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "nager" }
            options: [{ object: swim }, { object: dance }, { object: read }]
            answer: swim
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "jouer au foot" }
            options: [{ object: play-football }, { object: play-tennis }, { object: sing }]
            answer: play-football
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "J'aime nager."
            say: { en: "J'aime means I like. After it, the hobby stays as it is: j'aime nager, I like swimming.", fr: "J'aime nager." }
            show: { object: swim }
          - text: "Je sais faire du vélo."
            say: { en: "Je sais means I can, when it is something you have learnt: je sais faire du vélo, I can ride a bike.", fr: "Je sais faire du vélo." }
            show: { object: ride-bike }
          - text: "Je n'aime pas le tennis."
            say: { en: "To say you do not like something, wrap n' and pas around aime: je n'aime pas le tennis.", fr: "Je n'aime pas le tennis." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Je sais faire du vélo."
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: ride-bike }, { object: swim }, { object: read }]
                answer: ride-bike
                option_audio: false
                hints:
                  - "Read the end: faire du vélo."
                  - "Un vélo is a bike."
                  - "The child on the bike."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I don't like tennis." }
                options: ["pas", "Je", "le tennis", "n'aime"]
                slot_count: 4
                answer: ["Je", "n'aime", "pas", "le tennis"]
                option_audio: false
                hints:
                  - "Start with Je."
                  - "N' and pas go either side of aime."
                  - "Je n'aime pas le tennis."
              - id: l2-f3
                type: audio_choice
                say: { en: "Listen. What can Léa do?" }
                audio: { fr: "Salut, je m'appelle Léa. Je sais nager, mais je ne sais pas danser." }
                options: [{ object: swim }, { object: dance }, { object: sing }]
                answer: swim
                hints:
                  - "Listen for je sais."
                  - "Je sais nager. Je ne sais pas danser."
                  - "Léa can swim."
              - id: l2-f4
                type: fill_in_blank
                text: "Finish the sentence."
                say: { en: "The child likes reading. Finish the sentence." }
                show: { object: read }
                frame: "_ lire."
                options: ["J'aime", "Je sais", "Je suis"]
                answer: ["J'aime"]
                option_audio: false
                hints:
                  - "It is about liking."
                  - "Liking is aime."
                  - "J'aime lire."
              - id: l2-f5
                type: true_false
                text: "Je n'aime pas le foot."
                say: { en: "Read the sentence. Does the child like football?" }
                answer: false
                hints:
                  - "N' ... pas means not."
                  - "Je n'aime pas: I don't like."
                  - "No."
              - id: l2-f6
                type: audio_choice
                say: { en: "Listen. What does Hugo like?" }
                audio: { fr: "Je m'appelle Hugo. Je n'aime pas le foot. J'aime peindre." }
                options: [{ object: play-football }, { object: paint }, { object: read }]
                answer: paint
                feedback:
                  play-football: "You hear foot first, but Hugo says je n'aime pas le foot."
                hints:
                  - "Listen to the end."
                  - "J'aime peindre."
                  - "Hugo likes painting."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "J'aime danser."
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: sing }, { object: dance }, { object: swim }]
                answer: dance
                option_audio: false
                hints: ["Danser."]
              - id: l2-s2
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I like singing." }
                options: ["chanter", "J'aime"]
                slot_count: 2
                answer: ["J'aime", "chanter"]
                option_audio: false
                hints: ["J'aime first."]
              - id: l2-s3
                type: audio_choice
                say: { en: "Listen. What can't Lucas do?" }
                audio: { fr: "Je m'appelle Lucas. Je sais jouer au tennis. Je ne sais pas nager." }
                options: [{ object: play-tennis }, { object: swim }, { object: ride-bike }]
                answer: swim
                hints: ["Listen for ne sais pas."]
              - id: l2-s4
                type: fill_in_blank
                text: "Finish the sentence."
                say: { en: "The child can play the guitar. Finish the sentence." }
                show: { object: play-guitar }
                frame: "Je _ jouer de la guitare."
                options: ["sais", "aime", "suis"]
                answer: ["sais"]
                option_audio: false
                hints: ["Can is sais."]
              - id: l2-s5
                type: true_false
                text: "Je sais faire du vélo."
                say: { en: "Read the sentence. Can the child ride a bike?" }
                answer: true
                hints: ["Je sais: I can."]
              - id: l2-s6
                type: speak
                say: { en: "Say in French that you like swimming.", fr: "J'aime nager." }
                show: { object: swim }
                expected_text: "j'aime nager"
                hints: ["Say it with me: j'aime nager."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Je sais jouer de la guitare."
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: play-guitar }, { object: sing }, { object: play-tennis }]
                answer: play-guitar
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I don't like dancing." }
                options: ["danser", "n'aime", "Je", "pas"]
                slot_count: 4
                answer: ["Je", "n'aime", "pas", "danser"]
                option_audio: false
              - id: l2-n3
                type: audio_choice
                say: { en: "Listen. What does Chloé like?" }
                audio: { fr: "Bonjour, je m'appelle Chloé. J'aime lire et j'aime chanter." }
                options: ["reading and singing", "reading and dancing", "swimming and singing"]
                answer: "reading and singing"
              - id: l2-n4
                type: fill_in_blank
                text: "Finish the sentence."
                say: { en: "The child does not like swimming. Finish the sentence." }
                show: { object: swim }
                frame: "Je n'aime _ nager."
                options: ["pas", "sais", "ne"]
                answer: ["pas"]
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "J'aime jouer au foot."
                say: { en: "Read the sentence. Does the child like football?" }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "danser" }
            options: [{ object: sing }, { object: dance }, { object: paint }]
            answer: dance
          - id: l2-c2
            type: image_multiple_choice
            text: "J'aime nager."
            say: { en: "Read the sentence. Which picture matches?" }
            options: [{ object: swim }, { object: ride-bike }, { object: read }]
            answer: swim
            option_audio: false
          - id: l2-c3
            type: ordering
            text: "Put the words in order."
            say: { en: "Build the sentence: I don't like painting." }
            options: ["peindre", "Je", "pas", "n'aime"]
            slot_count: 4
            answer: ["Je", "n'aime", "pas", "peindre"]
            option_audio: false
          - id: l2-c4
            type: audio_choice
            say: { en: "Listen. What can Nathan do?" }
            audio: { fr: "Je m'appelle Nathan. Je ne sais pas chanter, mais je sais jouer au foot." }
            options: [{ object: sing }, { object: play-football }, { object: play-guitar }]
            answer: play-football
          - id: l2-c5
            type: fill_in_blank
            text: "Finish the sentence."
            say: { en: "The child likes singing. Finish the sentence." }
            show: { object: sing }
            frame: "_ chanter."
            options: ["J'aime", "Je sais", "Je suis"]
            answer: ["J'aime"]
            option_audio: false
