# Lesson set: French, learning year 4 (Year 6). Hand-authored draft.
id: en-GB.fl.fr-now-and-routine
skill: fl.grammar.now-and-routine
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Jetzt und jeden Tag (Französisch)
  en: Now and every day in French
summary: >
  French uses one present tense where English has two: il lit is both he
  reads and he is reading. To stress right now, French says en train de
  (il est en train de lire); for every day, a time word (tous les jours,
  le samedi). Lesson 1 uses je and il / elle with routine words; lesson 2
  sets en train de against tous les jours and ends with the skill check.
metadata:
  year: ly-4
  topic: { de: Satzmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 11
  builds_on: [fl.themes.hobbies]
  also_practises: [fl.grammar.chunks]
  vocabulary: { fr: [je lis, il lit, elle nage, je joue, je chante, il fait du vélo, tous les jours, le samedi, le matin, maintenant, en train de] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: two-present-tenses
      what: Tries to copy English is ...-ing word by word (il est lire)
      addressed: Learn shows that il lit already means he is reading; en train de is used only to stress right now
    - id: verb-endings
      what: Uses the je form for il or elle (il lis, elle chantes)
      addressed: lesson 1 sets je and il forms side by side; a full-stage task picks the right ending
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was macht er jeden Tag?", en: "What does he do every day?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "nager" }
            options: [{ object: swim }, { object: read }, { object: sing }]
            answer: swim
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "faire du vélo" }
            options: [{ object: ride-bike }, { object: dance }, { object: paint }]
            answer: ride-bike
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "je lis · il lit · elle lit"
            say: { en: "Talking about yourself, you say je lis, I read. Talking about a boy, il lit; about a girl, elle lit. The ending changes from s to t.", fr: "Je lis. Il lit. Elle lit." }
            show: { object: read }
          - text: "je chante · il chante"
            say: { en: "With verbs ending in er, like chanter, the je and il forms sound the same: je chante, il chante.", fr: "Je chante. Il chante." }
            show: { object: sing }
          - text: "Tous les jours, elle nage."
            say: { en: "Time words tell you it happens again and again: tous les jours, every day; le samedi, on Saturdays; le matin, in the morning.", fr: "Tous les jours, elle nage." }
            show: { object: swim }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { en: "Listen. What does Léa do every day?" }
                audio: { fr: "Tous les jours, Léa nage." }
                options: [{ object: swim }, { object: read }, { object: dance }]
                answer: swim
                hints:
                  - "Listen for the verb."
                  - "Nage comes from nager."
                  - "Léa swims."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Finish the sentence."
                say: { en: "Hugo reads every day. Finish the sentence." }
                show: { object: read }
                frame: "Tous les jours, il _ ."
                options: ["lit", "lis", "lire"]
                answer: ["lit"]
                option_audio: false
                feedback:
                  lis: "Lis goes with je. With il, the ending is t: il lit."
                hints:
                  - "The sentence is about il, a boy."
                  - "Je lis, il lit."
                  - "Lit."
              - id: l1-f3
                type: true_false
                text: "Le samedi, je joue au foot."
                say: { en: "Read the sentence. Does it say what happens on Saturdays?" }
                answer: true
                hints:
                  - "Le samedi means on Saturdays."
                  - "Je joue au foot: I play football."
                  - "Yes."
              - id: l1-f4
                type: image_multiple_choice
                text: "Le matin, elle fait du vélo."
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: ride-bike }, { object: swim }, { object: play-tennis }]
                answer: ride-bike
                option_audio: false
                hints:
                  - "Read the end: fait du vélo."
                  - "Vélo is bike."
                  - "The child on the bike."
              - id: l1-f5
                type: multiple_choice
                text: "Which time word means every day?"
                options: ["tous les jours", "le samedi", "le matin"]
                answer: "tous les jours"
                option_audio: false
                hints:
                  - "Jours means days."
                  - "Tous means all, every."
                  - "Tous les jours."
              - id: l1-f6
                type: audio_choice
                say: { en: "Listen. What does Tom do on Saturdays?" }
                audio: { fr: "Le samedi, Tom joue de la guitare." }
                options: [{ object: play-guitar }, { object: play-football }, { object: sing }]
                answer: play-guitar
                hints:
                  - "Listen for joue de la."
                  - "Guitare."
                  - "He plays the guitar."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { en: "Listen. What does Chloé do in the mornings?" }
                audio: { fr: "Le matin, Chloé chante." }
                options: [{ object: sing }, { object: swim }, { object: paint }]
                answer: sing
                hints: ["Chante comes from chanter."]
              - id: l1-s2
                type: fill_in_blank
                text: "Finish the sentence."
                say: { en: "I read every day. Finish the sentence." }
                show: { object: read }
                frame: "Tous les jours, je _ ."
                options: ["lis", "lit", "lire"]
                answer: ["lis"]
                option_audio: false
                hints: ["Je goes with s."]
              - id: l1-s3
                type: true_false
                text: "Tous les jours, il nage."
                say: { en: "Read the sentence. Does he swim only on Saturdays?" }
                answer: false
                hints: ["Tous les jours means every day."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Le samedi, elle danse."
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: sing }, { object: dance }, { object: read }]
                answer: dance
                option_audio: false
                hints: ["Danse comes from danser."]
              - id: l1-s5
                type: multiple_choice
                text: "Which time word means on Saturdays?"
                options: ["le samedi", "le matin", "tous les jours"]
                answer: "le samedi"
                option_audio: false
                hints: ["Samedi is Saturday."]
              - id: l1-s6
                type: speak
                say: { en: "Say in French that you sing every day.", fr: "Tous les jours, je chante." }
                show: { object: sing }
                expected_text: "tous les jours je chante"
                hints: ["Say it with me: tous les jours, je chante."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { en: "Listen. What does Nathan do every day?" }
                audio: { fr: "Tous les jours, Nathan peint." }
                options: [{ object: paint }, { object: read }, { object: swim }]
                answer: paint
              - id: l1-n2
                type: fill_in_blank
                text: "Finish the sentence."
                say: { en: "She reads in the morning. Finish the sentence." }
                show: { object: read }
                frame: "Le matin, elle _ ."
                options: ["lit", "lis", "lire"]
                answer: ["lit"]
                option_audio: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Le samedi, il joue au tennis."
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: play-football }, { object: play-tennis }, { object: play-guitar }]
                answer: play-tennis
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Le matin, je fais du vélo."
                say: { en: "Read the sentence. Does it happen in the morning?" }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which time word means in the morning?"
                options: ["le matin", "le samedi", "maintenant"]
                answer: "le matin"
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { en: "Listen. What does Inès do on Saturdays?" }
            audio: { fr: "Le samedi, Inès nage." }
            options: [{ object: swim }, { object: dance }, { object: ride-bike }]
            answer: swim
          - id: l1-c2
            type: fill_in_blank
            text: "Finish the sentence."
            say: { en: "He reads every day. Finish the sentence." }
            frame: "Tous les jours, il _ ."
            options: ["lit", "lis", "lire"]
            answer: ["lit"]
            option_audio: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Tous les jours, elle chante."
            say: { en: "Read the sentence. Which picture matches?" }
            options: [{ object: sing }, { object: read }, { object: paint }]
            answer: sing
            option_audio: false

  - n: 2
    title: { de: "Jetzt oder jeden Tag?", en: "Now or every day?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Finish the sentence."
            say: { en: "I read every day. Finish the sentence." }
            frame: "Tous les jours, je _ ."
            options: ["lis", "lit", "lire"]
            answer: ["lis"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which time word means every day?"
            options: ["tous les jours", "maintenant", "le samedi"]
            answer: "tous les jours"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Il lit. = He reads. / He is reading."
            say: { en: "In English there are two ways: he reads, and he is reading. French has just one: il lit. It can mean both.", fr: "Il lit." }
            show: { object: read }
          - text: "Il est en train de lire."
            say: { en: "To stress right now, French says en train de: il est en train de lire, he is busy reading right now. After de, the verb stays as it is, lire.", fr: "Il est en train de lire." }
          - text: "maintenant ↔ tous les jours"
            say: { en: "Maintenant means now. Tous les jours means every day. The time word tells you which one is meant.", fr: "Maintenant, elle nage. Tous les jours, elle lit." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Elle est en train de danser."
                say: { en: "Read the sentence. When is it happening?" }
                options: ["right now", "every day", "on Saturdays"]
                answer: "right now"
                hints:
                  - "Look for en train de."
                  - "En train de stresses right now."
                  - "Right now."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tous les jours, il fait du vélo."
                say: { en: "Read the sentence. When does it happen?" }
                options: ["every day", "right now", "only today"]
                answer: "every day"
                hints:
                  - "Look for the time word."
                  - "Tous les jours."
                  - "Every day."
              - id: l2-f3
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: She is reading right now." }
                options: ["lire", "Elle est", "en train de"]
                slot_count: 3
                answer: ["Elle est", "en train de", "lire"]
                option_audio: false
                hints:
                  - "Start with Elle est."
                  - "Then en train de, then the verb."
                  - "Elle est en train de lire."
              - id: l2-f4
                type: fill_in_blank
                text: "Finish the sentence."
                say: { en: "He is busy swimming right now. Finish the sentence." }
                show: { object: swim }
                frame: "Il est en train de _ ."
                options: ["nager", "nage", "nages"]
                answer: ["nager"]
                option_audio: false
                feedback:
                  nage: "After en train de, the verb stays as it is: nager."
                hints:
                  - "What comes after de?"
                  - "The verb in its full form."
                  - "Nager."
              - id: l2-f5
                type: true_false
                text: "Il lit. can mean he reads and he is reading."
                say: { en: "Read the sentence. Is it true?" }
                answer: true
                hints:
                  - "French has one present tense."
                  - "Il lit covers both."
                  - "Yes."
              - id: l2-f6
                type: audio_choice
                say: { en: "Listen. What is Hugo doing right now?" }
                audio: { fr: "Tous les jours, Hugo joue au foot. Mais maintenant, il est en train de lire." }
                options: [{ object: play-football }, { object: read }, { object: swim }]
                answer: read
                feedback:
                  play-football: "Football is what he does every day. Maintenant, right now, he is reading."
                hints:
                  - "Listen for maintenant."
                  - "Maintenant, il est en train de lire."
                  - "He is reading."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Je suis en train de chanter."
                say: { en: "Read the sentence. When is it happening?" }
                options: ["right now", "every day", "on Saturdays"]
                answer: "right now"
                hints: ["En train de."]
              - id: l2-s2
                type: multiple_choice
                text: "Le samedi, elle peint."
                say: { en: "Read the sentence. When does it happen?" }
                options: ["on Saturdays", "right now", "every morning"]
                answer: "on Saturdays"
                hints: ["Le samedi."]
              - id: l2-s3
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I am dancing right now." }
                options: ["danser", "en train de", "Je suis"]
                slot_count: 3
                answer: ["Je suis", "en train de", "danser"]
                option_audio: false
                hints: ["Je suis first."]
              - id: l2-s4
                type: fill_in_blank
                text: "Finish the sentence."
                say: { en: "She is busy painting right now. Finish the sentence." }
                show: { object: paint }
                frame: "Elle est en train de _ ."
                options: ["peindre", "peint", "peins"]
                answer: ["peindre"]
                option_audio: false
                hints: ["The full verb after de."]
              - id: l2-s5
                type: true_false
                text: "Maintenant means every day."
                say: { en: "Read the sentence. Is it true?" }
                answer: false
                hints: ["Maintenant means now."]
              - id: l2-s6
                type: audio_choice
                say: { en: "Listen. What does Léa do every day?" }
                audio: { fr: "Maintenant, Léa est en train de danser. Mais tous les jours, elle nage." }
                options: [{ object: dance }, { object: swim }, { object: sing }]
                answer: swim
                hints: ["Listen for tous les jours."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Nous sommes en train de jouer au tennis."
                say: { en: "Read the sentence. When is it happening?" }
                options: ["right now", "every day", "on Saturdays"]
                answer: "right now"
              - id: l2-n2
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: He is singing right now." }
                options: ["chanter", "Il est", "en train de"]
                slot_count: 3
                answer: ["Il est", "en train de", "chanter"]
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Finish the sentence."
                say: { en: "I am busy reading right now. Finish the sentence." }
                show: { object: read }
                frame: "Je suis en train de _ ."
                options: ["lire", "lis", "lit"]
                answer: ["lire"]
                option_audio: false
              - id: l2-n4
                type: audio_choice
                say: { en: "Listen. What is Tom doing right now?" }
                audio: { fr: "Le samedi, Tom fait du vélo. Mais maintenant, il est en train de chanter." }
                options: [{ object: ride-bike }, { object: sing }, { object: read }]
                answer: sing
              - id: l2-n5
                type: true_false
                text: "Tous les jours, je lis."
                say: { en: "Read the sentence. Does it say this happens again and again?" }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Finish the sentence."
            say: { en: "She reads every day. Finish the sentence." }
            frame: "Tous les jours, elle _ ."
            options: ["lit", "lis", "lire"]
            answer: ["lit"]
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Il est en train de nager."
            say: { en: "Read the sentence. When is it happening?" }
            options: ["right now", "every day", "on Saturdays"]
            answer: "right now"
          - id: l2-c3
            type: ordering
            text: "Put the words in order."
            say: { en: "Build the sentence: She is painting right now." }
            options: ["peindre", "Elle est", "en train de"]
            slot_count: 3
            answer: ["Elle est", "en train de", "peindre"]
            option_audio: false
          - id: l2-c4
            type: audio_choice
            say: { en: "Listen. What does Chloé do every day?" }
            audio: { fr: "Maintenant, Chloé est en train de lire. Mais tous les jours, elle fait du vélo." }
            options: [{ object: read }, { object: ride-bike }, { object: dance }]
            answer: ride-bike
          - id: l2-c5
            type: multiple_choice
            text: "Which time word means now?"
            options: ["maintenant", "tous les jours", "le matin"]
            answer: "maintenant"
            option_audio: false
