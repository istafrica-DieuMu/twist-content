# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.number-patterns
skill: math.patterns.number-patterns
curriculum: en-GB
language: en
title:
  de: Zahlenmuster und schöne Päckchen
  en: Number patterns and calculation patterns
summary: >
  Lesson 1 continues number sequences (counting in 4s, 8s, 50s and 100s,
  forwards and backwards), names the rule and finds the number that does
  not fit; lesson 2 continues patterns of calculations, explains why the
  answers change as they do, spots the wrong answer in a pattern, and
  ends with the skill check.
metadata:
  year: year-3
  topic: { de: Muster, en: Patterns }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.patterns.repeating, math.add-sub-to-20.fluency-to-20]
  also_practises: [math.numbers-to-1000.sequences, math.add-sub-to-100.add-two-digit]
  vocabulary: { en: [pattern, sequence, rule, term, continue, odd one out, the same each time] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: continue, what: { de: Zahlenfolgen und schöne Päckchen fortsetzen, en: continuing number sequences and calculation patterns } }
    - { id: rule, what: { de: die Regel eines Musters finden und prüfen, en: finding and checking the rule of a pattern } }
    - { id: explain, what: { de: "erklären, warum sich das Ergebnis im Päckchen so ändert", en: explaining why the answers in a calculation pattern change as they do } }
    - { id: mistake, what: { de: Fehler im Muster finden, en: finding the odd one out or the wrong answer in a pattern } }
  misconceptions:
    - id: rule-from-two
      what: Guesses the rule from the first two numbers only and misses that the step changes (2, 4, 8, 16 read as add 2 each time)
      addressed: lesson 1 Learn checks the rule on every step; l1-f4, l1-s4 and l1-n4 ask whether a stated rule fits a whole sequence, with hints that check each step in l1-f4
    - id: pattern-each-alone
      what: Works out every calculation in a pattern on its own and does not use the pattern to spot a wrong answer
      addressed: lesson 2 Learn says how the answers must change; l2-f3, l2-s3, l2-n3 and l2-c4 ask for the wrong answer in a pattern, with feedback in l2-f3
    - id: backwards-step
      what: Adds the step when a sequence counts backwards (in 700, 650, 600 writes 650 next)
      addressed: l1-f2, l1-s1 and l1-n2 count backwards, with feedback in l1-f2; lesson 1 Learn shows a sequence going down
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zahlenfolgen fortsetzen", en: "Continuing sequences" }
    goal:
      de: "Setz Zahlenfolgen fort, nenn die Regel und finde die Zahl, die nicht passt, so wie 75 in 40, 50, 60, 75, 80."
      en: "Carry on number patterns, say the rule, and find the number that does not fit, like 75 in 40, 50, 60, 75, 80."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What comes next? 2, 4, 6, 8, _"
            options: ["9", "10", "12"]
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "17 + 4 = _"
            answer: "21"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4, 8, 12, 16, 20, ?"
            say: "Look at these numbers: four, eight, twelve, sixteen, twenty. What do you think comes next? Have a guess."
          - text: "4, 8, 12, 16, 20, 24"
            say: "Twenty-four! In this sequence each number is four more than the one before. The rule is add four each time. Check it on every step, not just the first one."
          - text: "700, 650, 600, 550, _"
            say: "This sequence goes down. Each number is fifty less than the one before. The rule is subtract fifty, so the next number is five hundred."
          - text: "1, 2, 4, 8, 16"
            say: "Careful here. From one to two is add one, but from two to four is add two. The step changes. Each number is double the one before, so the rule is double it."
          - text: "Did you know? The Summer Olympics are planned every 4 years: 2024 in Paris, 2028 in Los Angeles, 2032 in Brisbane."
            say: "Did you know? The Summer Olympic Games are planned every four years. Twenty twenty-four in Paris, twenty twenty-eight in Los Angeles, twenty thirty-two in Brisbane. The rule is add four each time! When will the next ones be after that?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What comes next? 100, 200, 300, 400, _"
                options: ["410", "500", "600"]
                answer: "500"
                hints:
                  - "How much more is each number than the one before?"
                  - "Each number is 100 more."
                  - "400 + 100 = 500."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Continue the sequence."
                frame: "500, 450, 400, 350, _, _"
                options: ["300", "250", "400", "200"]
                answer: ["300", "250"]
                feedback:
                  "400": "The numbers are going down. Subtract 50 each time, so after 350 comes 300."
                hints:
                  - "Are the numbers getting bigger or smaller?"
                  - "Each number is 50 less than the one before."
                  - "350 − 50 = 300, then 300 − 50 = 250."
              - id: l1-f3
                type: multiple_choice
                text: "What is the rule? 8, 16, 24, 32"
                options: ["+8", "+6", "×2"]
                answer: "+8"
                option_audio: false
                hints:
                  - "Find the step from each number to the next."
                  - "8 to 16, 16 to 24, 24 to 32: what is added each time?"
                  - "Add 8 each time."
              - id: l1-f4
                type: true_false
                text: "The rule is add 3 each time. Does it fit? 3, 6, 12, 24"
                answer: false
                hints:
                  - "Check every step, not just the first one."
                  - "3 to 6 is add 3. But 6 to 12 is add 6."
                  - "No. Each number is double the one before."
              - id: l1-f5
                type: multiple_choice
                text: "Which number does not fit the pattern? 40, 50, 60, 75, 80"
                options: ["50", "75", "80"]
                answer: "75"
                hints:
                  - "Find the rule first."
                  - "The numbers go up in tens."
                  - "After 60 comes 70, so 75 does not fit."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What comes next? 96, 88, 80, 72, _"
                options: ["64", "80", "62", "Blast off!"]
                answer: "64"
                feedback:
                  "Blast off!": "Not yet, this isn't a countdown to zero! Take 8 away from 72."
                hints: ["The numbers go down by 8."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the rule? 150, 200, 250, 300"
                options: ["+50", "+5", "+100"]
                answer: "+50"
                option_audio: false
                hints: ["How much is added each time?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Continue the sequence."
                frame: "24, 28, 32, 36, _, _"
                options: ["40", "44", "38", "42"]
                answer: ["40", "44"]
                hints: ["Add 4 each time."]
              - id: l1-s4
                type: true_false
                text: "The rule is add 10 each time. Does it fit? 205, 215, 225, 235"
                answer: true
                hints: ["Check every step."]
              - id: l1-s5
                type: multiple_choice
                text: "Which number does not fit the pattern? 800, 700, 600, 550, 400"
                options: ["700", "550", "400"]
                answer: "550"
                hints: ["The numbers go down in hundreds."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What comes next? 3, 7, 11, 15, _"
                options: ["18", "19", "20"]
                answer: "19"
              - id: l1-n2
                type: fill_in_blank
                text: "Continue the sequence."
                frame: "960, 860, 760, 660, _, _"
                options: ["560", "460", "650", "760"]
                answer: ["560", "460"]
              - id: l1-n3
                type: multiple_choice
                text: "What is the rule? 75, 70, 65, 60"
                options: ["−5", "+5", "−10"]
                answer: "−5"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "The rule is add 4 each time. Does it fit? 2, 6, 10, 15"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Which number does not fit the pattern? 8, 16, 24, 30, 40"
                options: ["16", "30", "40"]
                answer: "30"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What comes next? 350, 400, 450, 500, _"
            options: ["505", "550", "600"]
            answer: "550"
          - id: l1-c2
            type: multiple_choice
            text: "What is the rule? 90, 81, 72, 63"
            options: ["−9", "−8", "+9"]
            answer: "−9"
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Which number does not fit the pattern? 12, 16, 20, 25, 28"
            options: ["16", "25", "28"]
            answer: "25"
          - id: l1-c4
            type: fill_in_blank
            text: "Continue the sequence."
            frame: "640, 590, 540, 490, _, _"
            options: ["440", "390", "540", "450"]
            answer: ["440", "390"]
          - id: l1-c5
            type: true_false
            text: "The rule is add 8 each time. Does it fit? 16, 24, 32, 40"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "What comes next? 300, 400, 500, 600, _"
            options: ["601", "610", "700"]
            answer: "700"

  - n: 2
    title: { de: "Muster in Rechnungen", en: "Patterns in calculations" }
    goal:
      de: "Entdecke Muster in Rechnungen, so wie 23 + 5, 24 + 5, 25 + 5, und sag, was als Nächstes kommt und warum."
      en: "Spot patterns in calculations, like 23 + 5, 24 + 5, 25 + 5, and say what comes next and why."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What comes next? 44, 48, 52, 56, _"
            options: ["58", "60", "62"]
            answer: "60"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "36 + 8 = _"
            answer: "44"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "23 + 5 = 28\n24 + 5 = 29\n25 + 5 = 30\n26 + 5 = ?"
            say: "Calculations can make a pattern too. Twenty-three add five, twenty-four add five, twenty-five add five. What do you think twenty-six add five is? Guess without working it out."
          - text: "26 + 5 = 31"
            say: "Thirty-one! The first number goes up by one each time and the second stays the same, so the answer goes up by one each time. So you can say the next calculation without working it out: twenty-six add five is thirty-one."
          - text: "30 + 10 = 40\n31 + 9 = 40\n32 + 8 = 40"
            say: "Here one number goes up by one and the other goes down by one. What one number gains, the other loses, so the answer stays the same: forty every time."
          - text: "50 − 4 = 46\n50 − 5 = 45\n50 − 6 = 43"
            say: "Here the number you take away goes up by one, so the answer must go down by one each time. Forty-six, forty-five, then forty-four. Forty-three breaks the pattern, so that answer is wrong."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What comes next in the pattern?\n40 + 3 = 43\n40 + 4 = 44\n40 + 5 = 45\n40 + 6 = _"
                options: ["46", "47", "56"]
                answer: "46"
                hints:
                  - "What changes from one line to the next?"
                  - "The second number goes up by 1, so the answer goes up by 1."
                  - "40 + 6 = 46."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Why does the answer go up by 10 each time?\n31 + 20 = 51\n41 + 20 = 61\n51 + 20 = 71"
                options: ["The first number goes up by 10.", "The second number goes up by 10.", "Both numbers stay the same."]
                answer: "The first number goes up by 10."
                hints:
                  - "Compare the numbers in each line."
                  - "The 20 stays the same. What happens to 31, 41, 51?"
                  - "The first number goes up by 10."
              - id: l2-f3
                type: multiple_choice
                text: "Which answer is wrong?\n80 − 2 = 78\n80 − 4 = 76\n80 − 6 = 75\n80 − 8 = 72"
                options: ["78", "76", "75", "72"]
                answer: "75"
                feedback:
                  "72": "The answer goes down by 2 each time: 78, 76, 74, 72. So 72 is right."
                hints:
                  - "Each time 2 more is taken away."
                  - "So the answer goes down by 2 each time."
                  - "After 76 comes 74, not 75."
              - id: l2-f4
                type: fill_in_blank
                text: "Continue the pattern."
                frame: "100 + 50 = 150, 200 + 50 = 250, 300 + 50 = 350, _ + 50 = _"
                options: ["400", "450", "350", "500"]
                answer: ["400", "450"]
                hints:
                  - "The first number goes up by 100 each time."
                  - "After 300 comes 400."
                  - "400 + 50 = 450."
              - id: l2-f5
                type: true_false
                text: "Is this a pattern?\n20 + 20 = 40\n21 + 19 = 40\n22 + 18 = 40\n23 + 17 = 40"
                answer: true
                hints:
                  - "Look at how both numbers change."
                  - "One number goes up by 1, the other goes down by 1."
                  - "Yes. The answer stays 40 every time."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What comes next in the pattern?\n90 − 10 = 80\n90 − 11 = 79\n90 − 12 = 78\n90 − 13 = _"
                options: ["77", "76", "79"]
                answer: "77"
                hints: ["You take away one more each time."]
              - id: l2-s2
                type: multiple_choice
                text: "Why does the answer stay the same?\n60 + 30 = 90\n61 + 29 = 90\n62 + 28 = 90"
                options: ["One number goes up by 1 and the other goes down by 1.", "Both numbers go up by 1.", "Both numbers stay the same."]
                answer: "One number goes up by 1 and the other goes down by 1."
                hints: ["Look at both numbers in each line."]
              - id: l2-s3
                type: multiple_choice
                text: "Which answer is wrong?\n47 + 10 = 57\n47 + 20 = 67\n47 + 30 = 77\n47 + 40 = 86"
                options: ["57", "67", "77", "86"]
                answer: "86"
                hints: ["The answer should go up by 10 each time."]
              - id: l2-s4
                type: fill_in_blank
                text: "Continue the pattern."
                frame: "900 − 100 = 800, 800 − 100 = 700, 700 − 100 = 600, _ − 100 = _"
                options: ["600", "500", "700", "400"]
                answer: ["600", "500"]
                hints: ["The first number goes down by 100 each time."]
              - id: l2-s5
                type: true_false
                text: "Is this a pattern?\n15 + 3 = 18\n9 + 7 = 16\n30 + 2 = 32"
                answer: false
                hints: ["Do the numbers change in the same way from line to line?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What comes next in the pattern?\n3 × 4 = 12\n4 × 4 = 16\n5 × 4 = 20\n6 × 4 = _"
                options: ["22", "24", "26"]
                answer: "24"
              - id: l2-n2
                type: multiple_choice
                text: "Why does the answer go down by 10 each time?\n95 − 30 = 65\n85 − 30 = 55\n75 − 30 = 45"
                options: ["The first number goes down by 10.", "The number taken away goes up by 10.", "The number taken away goes down by 10."]
                answer: "The first number goes down by 10."
              - id: l2-n3
                type: multiple_choice
                text: "Which answer is wrong?\n70 − 5 = 65\n70 − 10 = 60\n70 − 15 = 54\n70 − 20 = 50"
                options: ["65", "60", "54", "50"]
                answer: "54"
              - id: l2-n4
                type: fill_in_blank
                text: "Continue the pattern."
                frame: "25 + 25 = 50, 26 + 24 = 50, 27 + 23 = 50, 28 + _ = _"
                options: ["22", "50", "21", "51"]
                answer: ["22", "50"]
              - id: l2-n5
                type: true_false
                text: "Is this a pattern?\n120 + 5 = 125\n130 + 5 = 135\n140 + 5 = 145"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: continue
            type: fill_in_blank
            text: "Continue the sequence."
            frame: "400, 450, 500, 550, _, _"
            options: ["600", "650", "560", "700"]
            answer: ["600", "650"]
          - id: l2-c2
            part: rule
            type: true_false
            text: "The rule is add 8 each time. Does it fit? 5, 13, 21, 28"
            answer: false
          - id: l2-c3
            part: continue
            type: multiple_choice
            text: "What comes next in the pattern?\n18 + 4 = 22\n28 + 4 = 32\n38 + 4 = 42\n48 + 4 = _"
            options: ["52", "62", "50"]
            answer: "52"
          - id: l2-c4
            part: mistake
            type: multiple_choice
            text: "Which answer is wrong?\n35 + 5 = 40\n35 + 10 = 45\n35 + 15 = 50\n35 + 20 = 56"
            options: ["40", "45", "50", "56"]
            answer: "56"
          - id: l2-c7
            part: continue
            type: fill_in_blank
            text: "Continue the sequence."
            frame: "56, 64, 72, 80, _, _"
            options: ["88", "96", "90", "86"]
            answer: ["88", "96"]
          - id: l2-c5
            part: explain
            type: multiple_choice
            text: "Why does the answer go up by 2 each time?\n50 + 1 = 51\n50 + 3 = 53\n50 + 5 = 55"
            options: ["The second number goes up by 2.", "The first number goes up by 2.", "Both numbers go up by 1."]
            answer: "The second number goes up by 2."
          - id: l2-c6
            part: continue
            type: multiple_choice
            text: "What comes next? 1000, 900, 800, 700, _"
            options: ["600", "690", "800"]
            answer: "600"
          - id: l2-c8
            part: continue
            type: multiple_choice
            text: "What comes next in the pattern?\n12 − 2 = 10\n22 − 2 = 20\n32 − 2 = 30\n42 − 2 = _"
            options: ["40", "32", "50"]
            answer: "40"
          - id: l2-c10
            part: rule
            type: true_false
            text: "The rule is subtract 100 each time. Does it fit? 830, 730, 630, 530"
            answer: true
          - id: l2-c9
            part: rule
            type: multiple_choice
            text: "What is the rule? 48, 44, 40, 36"
            options: ["−4", "+4", "−6"]
            answer: "−4"
            option_audio: false
          - id: l2-c11
            part: rule
            type: multiple_choice
            text: "What is the rule? 5, 10, 20, 40"
            options: ["+5", "double it", "+10"]
            answer: "double it"
            option_audio: false
          - id: l2-c12
            part: rule
            type: true_false
            text: "The rule is add 50 each time. Does it fit? 600, 650, 700, 760"
            answer: false
          - id: l2-c13
            part: explain
            type: multiple_choice
            text: "Why does the answer go down by 1 each time?\n40 − 6 = 34\n40 − 7 = 33\n40 − 8 = 32"
            options: ["The number taken away goes up by 1.", "The first number goes down by 1.", "Both numbers go up by 1."]
            answer: "The number taken away goes up by 1."
          - id: l2-c14
            part: explain
            type: true_false
            text: "45 + 15 = 60\n46 + 14 = 60\n47 + 13 = 60\nIs it true? The answer stays the same because both numbers go up by 1."
            answer: false
          - id: l2-c15
            part: explain
            type: multiple_choice
            text: "Why does the answer go up by 5 each time?\n2 × 5 = 10\n3 × 5 = 15\n4 × 5 = 20"
            options: ["There is one more 5 each time.", "The 5 goes up by 1 each time.", "Both numbers go up by 1."]
            answer: "There is one more 5 each time."
          - id: l2-c17
            part: mistake
            type: multiple_choice
            text: "Which number does not fit the pattern? 100, 200, 300, 450, 500"
            options: ["200", "450", "500"]
            answer: "450"
          - id: l2-c16
            part: explain
            type: true_false
            text: "90 − 10 = 80\n90 − 20 = 70\n90 − 30 = 60\nIs it true? The answer goes down by 10 each time because the number taken away goes up by 10."
            answer: true
          - id: l2-c18
            part: mistake
            type: multiple_choice
            text: "Which answer is wrong?\n52 + 9 = 61\n53 + 9 = 62\n54 + 9 = 63\n55 + 9 = 65"
            options: ["61", "62", "63", "65"]
            answer: "65"
          - id: l2-c19
            part: mistake
            type: multiple_choice
            text: "Which number does not fit the pattern? 64, 56, 48, 42, 32"
            options: ["56", "42", "32"]
            answer: "42"
          - id: l2-c20
            part: mistake
            type: multiple_choice
            text: "Which answer is wrong?\n200 − 10 = 190\n200 − 20 = 180\n200 − 30 = 175\n200 − 40 = 160"
            options: ["190", "180", "175", "160"]
            answer: "175"
