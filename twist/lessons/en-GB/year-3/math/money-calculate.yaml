# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.money-calculate
skill: math.money.calculate
curriculum: en-GB
language: en
title:
  de: Mit Geldbeträgen rechnen
  en: Adding, subtracting and multiplying money
summary: >
  Calculating with pounds and pence. Lesson 1 adds pounds to pounds and
  pence to pence, changes 100p into £1 (£2.60 + £1.50 = £4.10), subtracts,
  and gives change from £1, £2 or £5 by counting on; lesson 2 multiplies a
  price (3 × £1.20 = £3.60), gives change from £10, and ends with the
  skill check.
metadata:
  year: year-3
  topic: { de: Mit Geld rechnen, en: Calculating with money }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.money.decimal-notation, math.add-sub-to-1000.semi-written]
  also_practises: [math.money.decimal-notation, math.mult-div-larger.semi-written-mult]
  vocabulary: { en: [pounds, pence, total, altogether, change, cost, each, count on] }
  forms: [drawn, text, audio]
  drawn: [coins]
  facets: [currency, number-format, operation-signs]
  parts:
    - { id: add, what: { de: Geldbeträge addieren, en: adding amounts of money } }
    - { id: subtract, what: { de: Geldbeträge subtrahieren, en: subtracting amounts of money } }
    - { id: change, what: { de: Wechselgeld durch Ergänzen finden, en: finding change by counting on } }
    - { id: multiply, what: { de: einen Preis vervielfachen, en: multiplying a price } }
  misconceptions:
    - id: pence-over-100
      what: Leaves 100p or more as pence after the point (£2.70 + £1.50 = £3.120)
      addressed: lesson 1 Learn changes 110p into £1.10; the £3.120 kind of answer is a chip in l1-f2 and l1-s2 and an option in l1-c3, l2-w1, l2-f4, l2-s4, l2-n4 and l2-c2
    - id: change-off-by-ten
      what: Gets the change wrong when counting on to the pound (£1 − 65p = 45p), or adds the price instead
      addressed: lesson 1 Learn counts on from the price; l1-f4 has feedback on it; l1-s4, l1-n4, l1-c2, l2-w2, l2-s3, l2-n3 and l2-c3 offer it again
    - id: pence-as-pounds
      what: Multiplies pence and writes the result as pounds (5 × 40p = £20)
      addressed: lesson 2 Learn changes 140p into £1.40; l2-f2 has feedback on it; l2-s2 and l2-c4 offer it again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Addieren, subtrahieren und Wechselgeld", en: "Adding, subtracting and change" }
    goal:
      de: "Addiere Preise und zähl beim Wechselgeld weiter. Von 3 Pfund 40 bis 5 Pfund ist 1 Pfund 60."
      en: "Add prices and count on to find change. From 3 pounds 40 up to 5 pounds is 1 pound 60."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "£2.45 = _p"
            say: "Two pounds forty-five. How many pence is that?"
            answer: "245"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "245 + 160 = _"
            answer: "405"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "£2.60 + £1.50\nMore than £4, or less?"
            say: "Two pounds sixty add one pound fifty. Do you think it comes to more than four pounds, or less than four pounds? Have a guess."
            show: { drawn: coins, values: [200, 50, 10, 100, 50] }
          - text: "£2.60 + £1.50"
            say: "Let's find out. Add the pounds: two pounds and one pound make three pounds. Add the pence: sixty pence and fifty pence make one hundred and ten pence."
            show: { drawn: coins, values: [200, 50, 10, 100, 50] }
          - text: "110p = £1.10\n£3 + £1.10 = £4.10"
            say: "One hundred and ten pence is more than a pound. It is one pound and ten pence. So the total is four pounds ten: more than four pounds."
          - text: "£5.00 − £3.40 = £1.60"
            say: "To find change, count on from the price. From three pounds forty, sixty pence makes four pounds, and one more pound makes five pounds. Sixty pence and one pound: the change is one pound sixty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "£1.30 + £2.40 = _"
                say: "One pound thirty add two pounds forty."
                options: ["£3.70", "£3.07", "£37.0"]
                answer: "£3.70"
                option_audio: false
                hints:
                  - "Add the pounds, then add the pence."
                  - "£1 + £2 = £3, and 30p + 40p = 70p."
                  - "£3.70."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Add £2.70 + £1.50."
                say: "Two pounds seventy add one pound fifty. Add the pounds, then the pence, then find the total."
                frame: "£2 + £1 = £_ → 70p + 50p = _p → total: £_"
                options: ["3", "120", "4.20", "3.120", "1.20"]
                answer: ["3", "120", "4.20"]
                hints:
                  - "The pence make more than 100p."
                  - "120p is £1 and 20p. Add that pound to the £3."
                  - "3, 120, and the total is £4.20."
              - id: l1-f3
                type: multiple_choice
                text: "£4.80 − £2.30 = _"
                say: "Four pounds eighty subtract two pounds thirty."
                options: ["£2.50", "£2.05", "£7.10"]
                answer: "£2.50"
                option_audio: false
                hints:
                  - "Subtract the pounds, then the pence."
                  - "£4 − £2 = £2, and 80p − 30p = 50p."
                  - "£2.50."
              - id: l1-f4
                type: multiple_choice
                text: "You pay £1 for a pen that costs 65p. How much change do you get?"
                options: ["35p", "45p", "£1.65"]
                answer: "35p"
                option_audio: false
                feedback:
                  "45p": "Count on from 65p: 5p makes 70p, then 30p makes £1. That is 35p."
                  "£1.65": "That is the price added to £1. Change is what is left: count on from 65p to £1."
                hints:
                  - "Count on from 65p to £1."
                  - "65p and 5p make 70p. 70p and 30p make £1."
                  - "5p + 30p = 35p change."
              - id: l1-f5
                type: text_input
                text: "A drink costs £1.20 and a cake costs 85p. How many pence do they cost altogether?"
                answer: "205"
                hints:
                  - "Change £1.20 into pence first."
                  - "£1.20 is 120p. Then 120p + 85p."
                  - "205p."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "£3.25 + £1.50 = _"
                say: "Three pounds twenty-five add one pound fifty."
                options: ["£4.75", "£4.57", "£47.5"]
                answer: "£4.75"
                option_audio: false
                hints: ["Pounds with pounds, pence with pence."]
              - id: l1-s2
                type: fill_in_blank
                text: "Add £1.80 + £2.60."
                say: "One pound eighty add two pounds sixty. Add the pounds, then the pence, then find the total."
                frame: "£1 + £2 = £_ → 80p + 60p = _p → total: £_"
                options: ["3", "140", "4.40", "3.140", "1.40"]
                answer: ["3", "140", "4.40"]
                hints: ["140p is £1 and 40p."]
              - id: l1-s3
                type: multiple_choice
                text: "£6.90 − £4.50 = _"
                say: "Six pounds ninety subtract four pounds fifty."
                options: ["£2.40", "£2.04", "£11.40"]
                answer: "£2.40"
                option_audio: false
                hints: ["£6 − £4, and 90p − 50p."]
              - id: l1-s4
                type: multiple_choice
                text: "You pay £2 for a comic that costs £1.45. How much change do you get?"
                options: ["55p", "65p", "£3.45"]
                answer: "55p"
                option_audio: false
                hints: ["Count on from £1.45: 5p makes £1.50."]
              - id: l1-s5
                type: text_input
                text: "Ella buys a ruler for 90p and a rubber for 45p. How many pence does she spend?"
                answer: "135"
                hints: ["90p + 10p = £1. Then add the other 35p."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "£2.35 + £4.40 = _"
                say: "Two pounds thirty-five add four pounds forty."
                options: ["£6.75", "£6.57", "£67.5"]
                answer: "£6.75"
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "Is it true? £3.60 + £2.70 = £6.30"
                say: "Is it true? Three pounds sixty add two pounds seventy is six pounds thirty."
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "£8.75 − £3.25 = _"
                say: "Eight pounds seventy-five subtract three pounds twenty-five."
                options: ["£5.50", "£5.05", "£12.00"]
                answer: "£5.50"
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "You pay £5 for a book that costs £3.80. How much change do you get?"
                options: ["£1.20", "£2.20", "£8.80"]
                answer: "£1.20"
                option_audio: false
              - id: l1-n5
                type: text_input
                text: "A packet of crisps costs 55p. A banana costs 30p. How many pence do they cost together?"
                answer: "85"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "£4.20 + £3.50 = _"
            say: "Four pounds twenty add three pounds fifty."
            options: ["£7.70", "£7.07", "£77.0"]
            answer: "£7.70"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "You pay £1 for an apple that costs 45p. How much change do you get?"
            options: ["55p", "65p", "£1.45"]
            answer: "55p"
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "£2.90 + £1.40 = _"
            say: "Two pounds ninety add one pound forty."
            options: ["£4.30", "£3.130", "£3.30"]
            answer: "£4.30"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "£5.40 − £1.20 = _"
            say: "Five pounds forty subtract one pound twenty."
            options: ["£4.20", "£4.02", "£6.60"]
            answer: "£4.20"
            option_audio: false
          - id: l1-c5
            type: text_input
            text: "A pencil costs 40p and a sharpener costs 75p. How many pence do they cost altogether?"
            answer: "115"
          - id: l1-c6
            type: multiple_choice
            text: "You pay £2 for a juice that costs £1.30. How much change do you get?"
            options: ["70p", "80p", "£3.30"]
            answer: "70p"
            option_audio: false

  - n: 2
    title: { de: "Vervielfachen und Wechselgeld von 10 Pfund", en: "Multiplying prices and change from £10" }
    goal:
      de: "Rechne aus, was 3 Getränke zu je 1 Pfund 20 kosten, und berechne das Wechselgeld von 10 Pfund."
      en: "Work out what 3 drinks at 1 pound 20 each cost, and find the change from 10 pounds."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "£1.60 + £2.70 = _"
            say: "One pound sixty add two pounds seventy."
            options: ["£4.30", "£3.130", "£3.30"]
            answer: "£4.30"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "You pay £2 for a sandwich that costs £1.65. How much change do you get?"
            options: ["35p", "45p", "£3.65"]
            answer: "35p"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 drinks at £1.20 each\nIs £3 enough?"
            say: "Three drinks cost one pound twenty each. You have three pounds. Do you think that is enough to buy all three? Have a guess."
          - text: "3 × £1.20 = £3.60"
            say: "Let's work it out. Three times one pound is three pounds. Three times twenty pence is sixty pence. Altogether that is three pounds sixty."
            show: { drawn: coins, values: [100, 20, 100, 20, 100, 20] }
          - text: "4 × 35p = 140p = £1.40"
            say: "Four lollies cost thirty-five pence each. Four times thirty-five is one hundred and forty, so they cost one hundred and forty pence. That is one pound forty."
          - text: "£10 − £6.45 = £3.55"
            say: "Change from ten pounds. Count on from six pounds forty-five. Five pence makes six pounds fifty. Fifty pence makes seven pounds. Three pounds makes ten pounds. Five pence, fifty pence and three pounds: the change is three pounds fifty-five."
          - text: "Did you know? The £50 note shows Alan Turing, a mathematician."
            say: "Did you know? The fifty pound note shows Alan Turing. He was a mathematician from England. In the Second World War he helped to crack secret codes, and he had some of the first ideas for computers."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Work out 3 × £2.30."
                say: "Three times two pounds thirty. Multiply the pounds, then the pence, then find the total."
                frame: "3 × £2 = £_ → 3 × 30p = _p → total: £_"
                options: ["6", "90", "6.90", "6.30", "2.90"]
                answer: ["6", "90", "6.90"]
                hints:
                  - "Multiply the pounds and the pence on their own."
                  - "3 × £2 = £6, and 3 × 30p = 90p."
                  - "6, 90, and the total is £6.90."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "5 × 40p = _"
                say: "Five times forty pence."
                options: ["£2.00", "£20.00", "£0.20"]
                answer: "£2.00"
                option_audio: false
                feedback:
                  "£20.00": "5 × 40p = 200p. 200p is £2, not £20."
                hints:
                  - "Work it out in pence first."
                  - "5 × 40 = 200, so it is 200p."
                  - "200p = £2.00."
              - id: l2-f3
                type: fill_in_blank
                text: "A kite costs £7.35. How much change do you get from £10?"
                say: "A kite costs seven pounds thirty-five. Count on to ten pounds to find the change."
                frame: "£7.35 + _p = £7.40 → £7.40 + _p = £8 → £8 + £_ = £10 → change: £_"
                options: ["5", "60", "2", "2.65", "3.65"]
                answer: ["5", "60", "2", "2.65"]
                hints:
                  - "Count on in small jumps: to the next 10p, then to the next pound, then to £10."
                  - "5p to £7.40, then 60p to £8, then £2 to £10."
                  - "5, 60, 2, and the change is £2.65."
              - id: l2-f4
                type: multiple_choice
                text: "4 × £1.25 = _"
                say: "Four times one pound twenty-five."
                options: ["£5.00", "£4.100", "£4.25"]
                answer: "£5.00"
                option_audio: false
                hints:
                  - "Multiply the pounds and the pence on their own."
                  - "4 × £1 = £4, and 4 × 25p = 100p."
                  - "100p is another pound: £5.00."
              - id: l2-f5
                type: text_input
                text: "Three cinema snacks cost £2.50 each. How many pence do they cost altogether?"
                answer: "750"
                hints:
                  - "£2.50 is 250p."
                  - "3 × 250p: 3 × 200 = 600 and 3 × 50 = 150."
                  - "750p."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Work out 4 × £1.20."
                say: "Four times one pound twenty. Multiply the pounds, then the pence, then find the total."
                frame: "4 × £1 = £_ → 4 × 20p = _p → total: £_"
                options: ["4", "80", "4.80", "4.20", "1.80"]
                answer: ["4", "80", "4.80"]
                hints: ["4 × 20p = 80p."]
              - id: l2-s2
                type: multiple_choice
                text: "3 × 45p = _"
                say: "Three times forty-five pence."
                options: ["£1.35", "£13.50", "£1.53"]
                answer: "£1.35"
                option_audio: false
                hints: ["3 × 45 = 135, so it is 135p."]
              - id: l2-s3
                type: multiple_choice
                text: "You pay £5 for a toy that costs £2.75. How much change do you get?"
                options: ["£2.25", "£3.25", "£7.75", "the toy and £5 back"]
                answer: "£2.25"
                option_audio: false
                feedback:
                  "the toy and £5 back": "That would be a very kind shop! Count on from £2.75 to £5 to find the change."
                hints: ["Count on from £2.75: 25p makes £3."]
              - id: l2-s4
                type: multiple_choice
                text: "2 × £3.60 = _"
                say: "Two times three pounds sixty."
                options: ["£7.20", "£6.120", "£6.60"]
                answer: "£7.20"
                option_audio: false
                hints: ["2 × 60p = 120p, which is £1.20."]
              - id: l2-s5
                type: text_input
                text: "Pencils cost 15p each. How many pence do 6 pencils cost?"
                answer: "90"
                hints: ["6 × 15: 6 × 10 = 60 and 6 × 5 = 30."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "5 × £1.10 = _"
                say: "Five times one pound ten."
                options: ["£5.50", "£5.10", "£55.0"]
                answer: "£5.50"
                option_audio: false
              - id: l2-n2
                type: true_false
                text: "Is it true? 4 × 60p = £2.40"
                say: "Is it true? Four times sixty pence is two pounds forty."
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "You pay £10 for a game that costs £8.45. How much change do you get?"
                options: ["£1.55", "£2.55", "£18.45"]
                answer: "£1.55"
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "3 × £2.40 = _"
                say: "Three times two pounds forty."
                options: ["£7.20", "£6.120", "£6.40"]
                answer: "£7.20"
                option_audio: false
              - id: l2-n5
                type: text_input
                text: "Mum buys 2 pizzas at £4.50 each. She pays with a £10 note. How many pence change does she get?"
                answer: "100"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: multiple_choice
            text: "£3.45 + £2.30 = _"
            say: "Three pounds forty-five add two pounds thirty."
            options: ["£5.75", "£5.57", "£57.5"]
            answer: "£5.75"
            option_audio: false
          - id: l2-c2
            part: add
            type: multiple_choice
            text: "£1.70 + £2.80 = _"
            say: "One pound seventy add two pounds eighty."
            options: ["£4.50", "£3.150", "£3.50"]
            answer: "£4.50"
            option_audio: false
          - id: l2-c3
            part: change
            type: multiple_choice
            text: "You pay £5 for a cap that costs £3.15. How much change do you get?"
            options: ["£1.85", "£2.85", "£8.15"]
            answer: "£1.85"
            option_audio: false
          - id: l2-c4
            part: multiply
            type: multiple_choice
            text: "3 × 35p = _"
            say: "Three times thirty-five pence."
            options: ["£1.05", "£10.50", "£1.50"]
            answer: "£1.05"
            option_audio: false
          - id: l2-c5
            part: multiply
            type: text_input
            text: "A box of crayons costs £1.30. How many pence do 4 boxes cost?"
            answer: "520"
          - id: l2-c6
            part: add
            type: multiple_choice
            text: "£5.15 + £2.60 = _"
            say: "Five pounds fifteen add two pounds sixty."
            options: ["£7.75", "£7.21", "£8.75"]
            answer: "£7.75"
            option_audio: false
          - id: l2-c7
            part: add
            type: text_input
            text: "A comic costs £2.75 and a pen costs 60p. How many pence do they cost altogether?"
            answer: "335"
          - id: l2-c8
            part: add
            type: true_false
            text: "Is it true? £1.90 + £1.30 = £2.20"
            say: "One pound ninety add one pound thirty is two pounds twenty. Is that true?"
            answer: false
          - id: l2-c9
            part: subtract
            type: multiple_choice
            text: "£7.60 − £3.20 = _"
            say: "Seven pounds sixty subtract three pounds twenty."
            options: ["£4.40", "£4.04", "£10.80"]
            answer: "£4.40"
            option_audio: false
          - id: l2-c10
            part: subtract
            type: multiple_choice
            text: "£9.50 − £6.20 = _"
            say: "Nine pounds fifty subtract six pounds twenty."
            options: ["£3.30", "£3.03", "£15.70"]
            answer: "£3.30"
            option_audio: false
          - id: l2-c11
            part: subtract
            type: true_false
            text: "Is it true? £4.75 − £1.50 = £3.25"
            say: "Four pounds seventy-five subtract one pound fifty is three pounds twenty-five. Is that true?"
            answer: true
          - id: l2-c12
            part: subtract
            type: text_input
            text: "Sam has £3.60. He spends £1.40. How many pence does he have left?"
            answer: "220"
          - id: l2-c13
            part: subtract
            type: multiple_choice
            text: "Leah has £6.80. She spends £2.50 on a book. How much money does she have left?"
            options: ["£4.30", "£9.30", "£4.03"]
            answer: "£4.30"
            option_audio: false
          - id: l2-c14
            part: change
            type: multiple_choice
            text: "You pay £1 for a lolly that costs 72p. How much change do you get?"
            options: ["28p", "38p", "£1.72"]
            answer: "28p"
            option_audio: false
          - id: l2-c15
            part: change
            type: multiple_choice
            text: "You pay £10 for a T-shirt that costs £6.80. How much change do you get?"
            options: ["£3.20", "£4.20", "£16.80"]
            answer: "£3.20"
            option_audio: false
          - id: l2-c16
            part: change
            type: text_input
            text: "You pay £2 for a drink that costs £1.15. How many pence change do you get?"
            answer: "85"
          - id: l2-c17
            part: change
            type: true_false
            text: "You pay £5 for a ball that costs £4.25. Is it true that your change is 75p?"
            answer: true
          - id: l2-c18
            part: multiply
            type: multiple_choice
            text: "2 × £2.45 = _"
            say: "Two times two pounds forty-five."
            options: ["£4.90", "£4.45", "£49.0"]
            answer: "£4.90"
            option_audio: false
          - id: l2-c19
            part: multiply
            type: text_input
            text: "Stickers cost 25p each. How many pence do 5 stickers cost?"
            answer: "125"
          - id: l2-c20
            part: multiply
            type: true_false
            text: "Is it true? 6 × 50p = £30.00"
            say: "Six times fifty pence is thirty pounds. Is that true?"
            answer: false
