# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.table-3-6-9
skill: math.mult-div.table-3-6-9
curriculum: en-GB
language: en
title:
  de: Die Dreier-, Sechser- und Neunerreihe
  en: The 3, 6 and 9 times tables
summary: >
  The 3, 6 and 9 times tables. Lesson 1 counts in threes and gets each
  6 times table fact by doubling the 3 times table fact (4 × 6 is double
  4 × 3); lesson 2 gets the 9 times table from the 10 times table
  (7 × 9 is 7 × 10 take away 7) and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Einmaleins, en: Times tables }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.derive-facts]
  also_practises: [math.mult-div.derive-facts, math.mult-div.table-5-10]
  vocabulary: { en: [times table, multiple, double, count in threes, 10 times table] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: [operation-signs]
  parts:
    - { id: row-3, what: { de: die Dreierreihe, en: the 3 times table } }
    - { id: row-6, what: { de: die Sechserreihe, en: the 6 times table } }
    - { id: row-9, what: { de: die Neunerreihe, en: the 9 times table } }
  misconceptions:
    - id: nine-minus-one
      what: Takes away 1 instead of the number of rows when using the 10 times table (7 × 9 = 70 − 1)
      addressed: lesson 2 Learn takes one dot from each of seven rows of ten; l2-f1 has feedback on 59; l2-s4 asks whether 9 × 9 is 89; l2-s1 offers 79 and l2-n1 offers 19
    - id: three-skip
      what: Loses the step when counting in threes past 10 (3, 6, 9, 13)
      addressed: l1-f1, l1-s1 and l1-n1 ask for the missing multiple in a count, with feedback on 13 in l1-f1; l2-c3 counts in threes again
    - id: double-wrong-table
      what: Doubles the answer to get the 9 times table, or thinks 6 × is 3 × plus 3
      addressed: lesson 1 Learn shows 4 × 6 as two 4 × 3 arrays side by side; l1-f2, l1-s2 and l1-n2 double a 3 times table fact, with feedback on adding 3 in l1-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Dreier und Sechser", en: "Threes and sixes" }
    goal:
      de: "Zähl in Dreierschritten und verdopple eine Dreieraufgabe für die Sechserreihe, so wie 4 mal 6 ist das Doppelte von 12."
      en: "Count in threes, and double a 3 times fact to get a 6 times fact, like 4 times 6 is double 12."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "4 × 2 = _"
            say: "Four times two."
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Double 15 = _"
            say: "What is double fifteen?"
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3, 6, 9, 12, 15, 18, 21, 24, 27, 30"
            say: "This is the 3 times table. Count on in threes: three, six, nine, twelve, and keep going up to thirty."
          - text: "6, 12, 18, 24, 30, 36, 42, 48, 54, 60"
            say: "This is the 6 times table. Six is double three, so every fact in the 6 times table is double the fact in the 3 times table."
          - text: "4 × 3 = 12, so 4 × 6 = 24"
            say: "Four rows of three make twelve. Put another four rows of three beside them and you have four rows of six. Double twelve is twenty-four."
            show: { drawn: dots, array: [4, 6] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Count in threes. Which number is missing?"
                frame: "6, 9, _, 15"
                options: ["11", "12", "13"]
                answer: ["12"]
                feedback:
                  "13": "Nine and three more is twelve. Count on three from nine: ten, eleven, twelve."
                hints:
                  - "Each number is three more than the one before."
                  - "Start at 9 and count on three."
                  - "9 + 3 = 12."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Use the 3 times table to find the 6 times table fact."
                say: "First work out five times three, then five times six."
                frame: "5 × 3 = _, so 5 × 6 = _"
                options: ["15", "18", "30", "35"]
                answer: ["15", "30"]
                feedback:
                  "18": "Times six is double times three, not three more. Double fifteen."
                hints:
                  - "Five times three is fifteen."
                  - "Times six is double times three."
                  - "15 and 30."
              - id: l1-f3
                type: text_input
                text: "8 × 3 = _"
                say: "Eight times three."
                answer: "24"
                hints:
                  - "You know 10 × 3 = 30."
                  - "Eight threes are two threes fewer than ten threes."
                  - "30 − 6 = 24."
              - id: l1-f4
                type: true_false
                text: "Is it true? 6 × 6 = 36"
                say: "Six times six is thirty-six. Is it true?"
                answer: true
                hints:
                  - "Find 6 × 3 first."
                  - "6 × 3 = 18. Now double it."
                  - "Double 18 is 36, so yes."
              - id: l1-f5
                type: multiple_choice
                text: "Which number is a multiple of 6?"
                options: ["40", "42", "44"]
                answer: "42"
                hints:
                  - "Count in sixes, or use the 3 times table and double."
                  - "7 × 3 = 21, so 7 × 6 is double 21."
                  - "7 × 6 = 42."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Count in threes. Which number is missing?"
                frame: "21, _, 27, 30"
                options: ["23", "24", "25"]
                answer: ["24"]
                hints: ["How much do you add each time?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Use the 3 times table to find the 6 times table fact."
                say: "First work out seven times three, then seven times six."
                frame: "7 × 3 = _, so 7 × 6 = _"
                options: ["21", "24", "42", "36"]
                answer: ["21", "42"]
                hints: ["Times six is double times three."]
              - id: l1-s3
                type: text_input
                text: "6 × 3 = _"
                say: "Six times three."
                answer: "18"
                hints: ["Five threes are 15. Add one more three."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 4 × 6 = 26"
                say: "Four times six is twenty-six. Is it true?"
                answer: false
                hints: ["4 × 3 = 12. Double it."]
              - id: l1-s5
                type: multiple_choice
                text: "Which number is a multiple of 3?"
                options: ["19", "22", "27"]
                answer: "27"
                hints: ["Count in threes: 3, 6, 9 ..."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Count in sixes. Which number is missing?"
                frame: "36, 42, _, 54"
                options: ["46", "48", "50"]
                answer: ["48"]
              - id: l1-n2
                type: fill_in_blank
                text: "Use the 3 times table to find the 6 times table fact."
                say: "First work out nine times three, then nine times six."
                frame: "9 × 3 = _, so 9 × 6 = _"
                options: ["27", "30", "54", "56"]
                answer: ["27", "54"]
              - id: l1-n3
                type: text_input
                text: "3 × 3 = _"
                say: "Three times three."
                answer: "9"
              - id: l1-n4
                type: true_false
                text: "Is it true? 8 × 6 = 48"
                say: "Eight times six is forty-eight. Is it true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "Chairs are set out in rows of 6. There are 5 rows. How many chairs are there?"
                answer: "30"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "7 × 3 = _"
            say: "Seven times three."
            answer: "21"
          - id: l1-c2
            type: text_input
            text: "6 × 6 = _"
            say: "Six times six."
            answer: "36"
          - id: l1-c3
            type: true_false
            text: "Is 20 a multiple of 3?"
            say: "Is twenty a multiple of three?"
            answer: false
          - id: l1-c4
            type: text_input
            text: "5 × 3 = _"
            say: "Five times three."
            answer: "15"
          - id: l1-c5
            type: fill_in_blank
            text: "Count in sixes. Which number is missing?"
            say: "Count in sixes. Which number is missing?"
            frame: "12, 18, _, 30"
            options: ["24", "22", "26"]
            answer: ["24"]
          - id: l1-c6
            type: true_false
            text: "Is 27 a multiple of 3?"
            say: "Is twenty-seven a multiple of three?"
            answer: true

  - n: 2
    title: { de: "Die Neunerreihe", en: "The 9 times table" }
    goal:
      de: "Nutze die Zehnerreihe für die Neunerreihe, so wie 7 mal 9 ist 70 minus 7."
      en: "Use the 10 times table for the 9 times table, like 7 times 9 is 70 take away 7."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Count in sixes. Which number is missing?"
            frame: "18, 24, _, 36"
            options: ["28", "30", "32"]
            answer: ["30"]
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "6 × 10 = _"
            say: "Six times ten."
            answer: "60"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "9, 18, 27, 36, 45, 54, 63, 72, 81, 90"
            say: "This is the 9 times table. Nine is one less than ten, so the 10 times table can help you."
          - text: "7 × 10 = 70, so 7 × 9 = 70 − 7 = 63"
            say: "Seven times nine. Start with seven times ten, which is seventy. Each of the seven rows has one dot too many, so take away seven, not one. Seventy take away seven is sixty-three."
            show: { drawn: dots, array: [7, 10] }
          - text: "18: 1 + 8 = 9. 27: 2 + 7 = 9. 36: 3 + 6 = 9."
            say: "Here is a pattern in the 9 times table up to ninety. Add the two digits together and you always get nine. Eighteen: one add eight. Twenty-seven: two add seven."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Use the 10 times table."
                say: "First work out six times ten, then six times nine."
                frame: "6 × 10 = _, so 6 × 9 = 6 × 10 − 6 = _"
                options: ["60", "54", "59", "66"]
                answer: ["60", "54"]
                feedback:
                  "59": "Six times nine is six times ten take away six, not take away one."
                hints:
                  - "Six times ten is sixty."
                  - "Take one away from each of the six tens: that is six."
                  - "60 and 54."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "3 × 9 = _"
                say: "Three times nine."
                answer: "27"
                hints:
                  - "Use three times ten."
                  - "30 take away 3."
                  - "27."
              - id: l2-f3
                type: fill_in_blank
                text: "Count in nines. Which number is missing?"
                frame: "36, 45, _, 63"
                options: ["53", "54", "55"]
                answer: ["54"]
                hints:
                  - "Add nine each time."
                  - "Adding nine is adding ten, then taking one away."
                  - "45 + 9 = 54."
              - id: l2-f4
                type: true_false
                text: "Is it true? 4 × 9 = 36"
                say: "Four times nine is thirty-six. Is it true?"
                answer: true
                hints:
                  - "Use four times ten."
                  - "40 take away 4."
                  - "Yes, 36."
              - id: l2-f5
                type: multiple_choice
                text: "Which number is a multiple of 9?"
                options: ["61", "63", "65"]
                answer: "63"
                hints:
                  - "Add the two digits of each number."
                  - "In the 9 times table the digits add up to 9."
                  - "6 + 3 = 9, so 63."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Use the 10 times table."
                say: "First work out eight times ten, then eight times nine."
                frame: "8 × 10 = _, so 8 × 9 = 8 × 10 − 8 = _"
                options: ["80", "72", "79", "88"]
                answer: ["80", "72"]
                hints: ["Take one away from each ten."]
              - id: l2-s2
                type: text_input
                text: "5 × 9 = _"
                say: "Five times nine."
                answer: "45"
                hints: ["Five times ten, then take away five."]
              - id: l2-s3
                type: fill_in_blank
                text: "Count in nines. Which number is missing?"
                frame: "9, 18, _, 36"
                options: ["26", "27", "28"]
                answer: ["27"]
                hints: ["How much do you add each time?"]
              - id: l2-s4
                type: true_false
                text: "Is it true? 9 × 9 = 89"
                say: "Nine times nine is eighty-nine. Is it true?"
                answer: false
                hints: ["Nine times ten, then take away nine."]
              - id: l2-s5
                type: multiple_choice
                text: "Which number is a multiple of 9?"
                options: ["44", "45", "46"]
                answer: "45"
                hints: ["Add the two digits of each number."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Use the 10 times table."
                say: "First work out two times ten, then two times nine."
                frame: "2 × 10 = _, so 2 × 9 = 2 × 10 − 2 = _"
                options: ["20", "18", "19", "22"]
                answer: ["20", "18"]
              - id: l2-n2
                type: text_input
                text: "7 × 9 = _"
                say: "Seven times nine."
                answer: "63"
              - id: l2-n3
                type: fill_in_blank
                text: "Count in nines. Which number is missing?"
                frame: "63, 72, _, 90"
                options: ["80", "81", "82"]
                answer: ["81"]
              - id: l2-n4
                type: true_false
                text: "Is it true? 6 × 9 = 56"
                say: "Six times nine is fifty-six. Is it true?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "A pack has 9 felt tips. Mrs Shah buys 4 packs. How many felt tips is that?"
                answer: "36"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: row-9
            type: text_input
            text: "9 × 9 = _"
            say: "Nine times nine."
            answer: "81"
          - id: l2-c2
            part: row-6
            type: text_input
            text: "Eggs come in boxes of 6. How many eggs are in 8 boxes?"
            answer: "48"
          - id: l2-c3
            part: row-3
            type: fill_in_blank
            text: "Count in threes. Which number is missing?"
            frame: "24, 27, _, 33"
            options: ["29", "30", "31"]
            answer: ["30"]
          - id: l2-c4
            part: row-3
            type: multiple_choice
            text: "Which number is a multiple of 3?"
            options: ["25", "28", "33"]
            answer: "33"
          - id: l2-c5
            part: row-6
            type: true_false
            text: "Is it true? 3 × 6 = 16"
            say: "Three times six is sixteen. Is it true?"
            answer: false
          - id: l2-c6
            part: row-3
            type: text_input
            text: "9 × 3 = _"
            say: "Nine times three."
            answer: "27"
          - id: l2-c7
            part: row-3
            type: multiple_choice
            text: "_ × 3 = 18"
            say: "What times three is eighteen?"
            options: ["6", "5", "15"]
            answer: "6"
          - id: l2-c8
            part: row-3
            type: true_false
            text: "Is it true? 8 × 3 = 26"
            say: "Eight times three is twenty-six. Is it true?"
            answer: false
          - id: l2-c9
            part: row-3
            type: text_input
            text: "A tricycle has 3 wheels. How many wheels do 7 tricycles have?"
            say: "A tricycle has three wheels. How many wheels do seven tricycles have?"
            answer: "21"
          - id: l2-c10
            part: row-6
            type: text_input
            text: "7 × 6 = _"
            say: "Seven times six."
            answer: "42"
          - id: l2-c11
            part: row-6
            type: fill_in_blank
            text: "Use the 3 times table to find the 6 times table fact."
            say: "Eight times three is how many? So eight times six is how many?"
            frame: "8 × 3 = _, so 8 × 6 = _"
            options: ["24", "48", "30", "50"]
            answer: ["24", "48"]
          - id: l2-c12
            part: row-6
            type: multiple_choice
            text: "Which number is a multiple of 6?"
            say: "Which number is a multiple of six?"
            options: ["34", "54", "44"]
            answer: "54"
          - id: l2-c13
            part: row-6
            type: true_false
            text: "Is it true? 5 × 6 = 30"
            say: "Five times six is thirty. Is it true?"
            answer: true
          - id: l2-c14
            part: row-6
            type: fill_in_blank
            text: "Count in sixes. Which number is missing?"
            say: "Count in sixes. Which number is missing?"
            frame: "24, 30, _, 42"
            options: ["36", "34", "38"]
            answer: ["36"]
          - id: l2-c15
            part: row-9
            type: text_input
            text: "8 × 9 = _"
            say: "Eight times nine."
            answer: "72"
          - id: l2-c16
            part: row-9
            type: fill_in_blank
            text: "Use the 10 times table."
            say: "Four times ten is how many? So four times nine is how many?"
            frame: "4 × 10 = _, so 4 × 9 = 4 × 10 − 4 = _"
            options: ["40", "36", "39", "44"]
            answer: ["40", "36"]
          - id: l2-c17
            part: row-9
            type: multiple_choice
            text: "_ × 9 = 54"
            say: "What times nine is fifty-four?"
            options: ["6", "7", "5"]
            answer: "6"
          - id: l2-c18
            part: row-9
            type: true_false
            text: "Is it true? 5 × 9 = 54"
            say: "Five times nine is fifty-four. Is it true?"
            answer: false
          - id: l2-c19
            part: row-9
            type: text_input
            text: "Cards come in packs of 9. How many cards are in 3 packs?"
            say: "Cards come in packs of nine. How many cards are in three packs?"
            answer: "27"
          - id: l2-c20
            part: row-9
            type: multiple_choice
            text: "Which number is a multiple of 9?"
            say: "Which number is a multiple of nine?"
            options: ["39", "49", "81"]
            answer: "81"
