# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.right-angles
skill: math.angles.right-angles
curriculum: en-GB
language: en
title:
  de: Rechte Winkel
  en: Right angles
summary: >
  Lesson 1 finds right angles (square corners) in shapes, on clocks and
  around us, also when they are tilted, and says whether an angle is less
  than or greater than a right angle; lesson 2 links right angles to
  turns (one is a quarter turn, two make a half turn, three make three
  quarters of a turn, four a whole turn), turns the minute hand of a clock
  and a child in the classroom, and ends with the skill check. Degrees
  are left to Year 5. Checking a right angle with a paper corner or a set
  square on a real drawing waits for a measuring task.
metadata:
  year: year-3
  topic: { de: Winkel, en: Angles }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.angles.turns, math.shapes.properties]
  also_practises: [math.angles.turns]
  vocabulary: { en: [right angle, square corner, less than a right angle, greater than a right angle, quarter turn, half turn, three quarters of a turn, whole turn, clockwise] }
  forms: [text, audio, drawn]
  drawn: [angle, shape, clock]
  facets: []
  parts:
    - { id: identify, what: { de: "rechte Winkel erkennen, auch gedrehte, in der Umwelt und an der Uhr", en: "spotting right angles, also tilted ones, around us and on a clock" } }
    - { id: shapes, what: { de: rechte Winkel in Figuren zählen, en: counting the right angles in shapes } }
    - { id: compare, what: { de: "sagen, ob ein Winkel kleiner oder größer als ein rechter Winkel ist", en: saying whether an angle is less than or greater than a right angle } }
    - { id: turns, what: { de: rechte Winkel und Drehungen verbinden, en: linking right angles and turns } }
  misconceptions:
    - id: tilted-not-right
      what: Thinks a right angle must have one arm flat along the bottom, so a tilted square corner does not count
      addressed: lesson 1 Learn shows right angles in different positions; l1-s1, l1-n3 and l1-c1 tilt the right angle
    - id: greater-less-mixed
      what: Cannot tell an angle less than a right angle from one greater than a right angle
      addressed: lesson 1 Learn screens 3 and 4; l1-f3, l1-f5 (with feedback), l1-s3, l1-s5, l1-n1, l1-c2 and l2-c1
    - id: turns-count
      what: Thinks a half turn is four right angles, or a quarter turn is four right angles because there are four quarters
      addressed: lesson 2 Learn counts the right angles in each turn; l2-f1 has feedback, l2-s1, l2-s5, l2-n4 and l2-c3
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Rechte Winkel finden, en: Finding right angles }
    goal:
      de: "Finde rechte Winkel, also gerade Ecken wie die Ecke eines Buches, in Figuren und um dich herum."
      en: "Find right angles, the square corners like the corner of a book, in shapes and all around you."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which turn makes you face the other way?"
            options: ["a half turn", "a quarter turn", "a whole turn"]
            answer: "a half turn"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many corners does a square have?"
            show: { drawn: shape, kind: square }
            options: ["4", "3", "5"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A right angle is a square corner."
            say: "When two lines meet at a square corner, they make a right angle. The little square in the corner shows it is a right angle."
            show: { drawn: angle, degrees: 90, label: false }
          - text: "Right angles around us: the corner of a book, a door, a window."
            say: "Right angles are all around us: the corner of a book, of a door and of a window. They can be tilted too. A square corner is still a right angle when you turn it."
            show: { drawn: angle, degrees: 90, rotate: 30, label: false }
          - text: "This angle is less than a right angle."
            say: "These arms are closer together than a square corner. The angle is less than a right angle."
            show: { drawn: angle, degrees: 40, label: false }
          - text: "This angle is greater than a right angle."
            say: "These arms are opened wider than a square corner. The angle is greater than a right angle."
            show: { drawn: angle, degrees: 130, label: false }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which is a right angle?"
                options:
                  - { drawn: angle, degrees: 90, label: false, key: right }
                  - { drawn: angle, degrees: 45, label: false, key: less }
                  - { drawn: angle, degrees: 135, label: false, key: greater }
                answer: right
                hints:
                  - "A right angle is a square corner."
                  - "Look for the little square in the corner."
                  - "The angle with the square corner."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many right angles does a rectangle have?"
                show: { drawn: shape, kind: rectangle }
                options: ["4", "2", "0"]
                answer: "4"
                hints:
                  - "Look at each corner of the rectangle."
                  - "Is every corner a square corner?"
                  - "Yes: 4 right angles."
              - id: l1-f3
                type: multiple_choice
                text: "Is this angle a right angle, less than a right angle or greater than a right angle?"
                show: { drawn: angle, degrees: 60, label: false }
                options: ["a right angle", "less than a right angle", "greater than a right angle"]
                answer: "less than a right angle"
                keep_order: true
                hints:
                  - "Imagine a square corner in the same place."
                  - "Are the arms closer together or wider apart than a square corner?"
                  - "Closer together: less than a right angle."
              - id: l1-f4
                type: multiple_choice
                text: "Which of these has a right angle?"
                options: ["the corner of a book", "the tip of a slice of pizza", "the hands of a clock at 1 o'clock"]
                answer: "the corner of a book"
                hints:
                  - "A right angle is a square corner."
                  - "A pizza tip is pointy. The clock hands at 1 o'clock are close together."
                  - "The corner of a book."
              - id: l1-f5
                type: multiple_choice
                text: "Is this angle a right angle, less than a right angle or greater than a right angle?"
                show: { drawn: angle, degrees: 120, label: false }
                options: ["a right angle", "less than a right angle", "greater than a right angle"]
                answer: "greater than a right angle"
                keep_order: true
                feedback:
                  "less than a right angle": "The arms are opened wider than a square corner, so it is greater."
                hints:
                  - "Imagine a square corner in the same place."
                  - "The arms are wider apart than a square corner."
                  - "Greater than a right angle."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Is this angle a right angle, less than a right angle or greater than a right angle?"
                show: { drawn: angle, degrees: 90, rotate: 30, label: false }
                options: ["a right angle", "less than a right angle", "greater than a right angle"]
                answer: "a right angle"
                keep_order: true
                hints: ["Tilt your head. Is it a square corner?"]
              - id: l1-s2
                type: multiple_choice
                text: "How many right angles does this triangle have?"
                show: { drawn: shape, kind: triangle }
                options: ["0", "1", "3"]
                answer: "0"
                hints: ["Check each corner. Is any of them square?"]
              - id: l1-s3
                type: multiple_choice
                text: "Is this angle a right angle, less than a right angle or greater than a right angle?"
                show: { drawn: angle, degrees: 150, label: false }
                options: ["a right angle", "less than a right angle", "greater than a right angle"]
                answer: "greater than a right angle"
                keep_order: true
                hints: ["Are the arms wider apart than a square corner?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? A square has 4 right angles."
                answer: true
                hints: ["Look at the corners of a square."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which angle is less than a right angle?"
                options:
                  - { drawn: angle, degrees: 30, label: false, key: less }
                  - { drawn: angle, degrees: 90, label: false, key: right }
                  - { drawn: angle, degrees: 110, label: false, key: greater }
                answer: less
                hints: ["Its arms are closer together than a square corner."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Is this angle a right angle, less than a right angle or greater than a right angle?"
                show: { drawn: angle, degrees: 45, rotate: 20, label: false }
                options: ["a right angle", "less than a right angle", "greater than a right angle"]
                answer: "less than a right angle"
                keep_order: true
              - id: l1-n2
                type: multiple_choice
                text: "How many right angles does this hexagon have?"
                show: { drawn: shape, kind: hexagon }
                options: ["0", "6", "2"]
                answer: "0"
              - id: l1-n3
                type: multiple_choice
                text: "Is this angle a right angle, less than a right angle or greater than a right angle?"
                show: { drawn: angle, degrees: 90, rotate: 60, label: false }
                options: ["a right angle", "less than a right angle", "greater than a right angle"]
                answer: "a right angle"
                keep_order: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Which clock shows a right angle between its hands?"
                options:
                  - { drawn: clock, hour: 3, minute: 0 }
                  - { drawn: clock, hour: 1, minute: 0 }
                  - { drawn: clock, hour: 6, minute: 0 }
                answer: "3:00"
              - id: l1-n5
                type: true_false
                text: "Is it true? Every triangle has a right angle."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which is a right angle?"
            options:
              - { drawn: angle, degrees: 90, rotate: 45, label: false, key: right }
              - { drawn: angle, degrees: 60, label: false, key: less }
              - { drawn: angle, degrees: 160, label: false, key: greater }
            answer: right
          - id: l1-c2
            type: multiple_choice
            text: "Is this angle a right angle, less than a right angle or greater than a right angle?"
            show: { drawn: angle, degrees: 110, label: false }
            options: ["a right angle", "less than a right angle", "greater than a right angle"]
            answer: "greater than a right angle"
            keep_order: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Which shape has 4 right angles?"
            options:
              - { drawn: shape, kind: square }
              - { drawn: shape, kind: parallelogram }
              - { drawn: shape, kind: trapezoid }
            answer: square
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Is it true? This angle is greater than a right angle."
            show: { drawn: angle, degrees: 70, label: false }
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Which of these has a right angle?"
            options: ["a wheel", "the corner of a sheet of paper", "the tip of a star"]
            answer: "the corner of a sheet of paper"
          - id: l1-c6
            type: multiple_choice
            text: "How many right angles does this shape have?"
            show: { drawn: shape, kind: octagon }
            options: ["0", "4", "8"]
            answer: "0"

  - n: 2
    title: { de: Rechte Winkel und Drehungen, en: Right angles and turns }
    goal:
      de: "Dreh dich in rechten Winkeln. Ein rechter Winkel ist eine Vierteldrehung, und zwei sind eine halbe Drehung."
      en: "Turn in right angles. One right angle is a quarter turn, and two make a half turn."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Is this angle a right angle, less than a right angle or greater than a right angle?"
            show: { drawn: angle, degrees: 90, label: false }
            options: ["a right angle", "less than a right angle", "greater than a right angle"]
            answer: "a right angle"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many right angles does a rectangle have?"
            options: ["4", "2", "0"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 right angle = a quarter turn"
            say: "A right angle is a quarter turn. Stand facing the board and make a quarter turn: now you face the wall at your side."
            show: { drawn: angle, degrees: 90, label: false }
          - text: "2 right angles = a half turn"
            say: "Two right angles make a half turn. After a half turn you face the other way. The two arms make a straight line."
            show: { drawn: angle, degrees: 180, label: false }
          - text: "3 right angles = three quarters of a turn"
            say: "Three right angles make three quarters of a turn."
            show: { drawn: angle, degrees: 270, label: false }
          - text: "4 right angles = a whole turn\nThe minute hand from 12 to 3: a quarter turn."
            say: "Four right angles make a whole turn, back to where you started. The minute hand of a clock turns a quarter turn, one right angle, from twelve to three."
            show: { drawn: clock, hour: 12, minute: 15 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many right angles make a half turn?"
                options: ["2", "1", "4"]
                answer: "2"
                feedback:
                  "4": "4 right angles take you all the way round. A half turn is half of that."
                hints:
                  - "A whole turn is 4 right angles."
                  - "A half turn is half of a whole turn."
                  - "Half of 4 is 2 right angles."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How many right angles is this turn?"
                show: { drawn: angle, degrees: 180, label: false }
                options: ["2", "1", "3"]
                answer: "2"
                hints:
                  - "The arms make a straight line."
                  - "A straight line is a half turn."
                  - "A half turn is 2 right angles."
              - id: l2-f3
                type: multiple_choice
                text: "How many right angles make a whole turn?"
                options: ["4", "2", "3"]
                answer: "4"
                hints:
                  - "Each right angle is a quarter turn."
                  - "How many quarters make a whole?"
                  - "4 quarter turns: 4 right angles."
              - id: l2-f4
                type: multiple_choice
                text: "The minute hand turns from 12 to 3. What turn is that?"
                show: { drawn: clock, hour: 12, minute: 15 }
                options: ["a quarter turn", "a half turn", "a whole turn"]
                answer: "a quarter turn"
                hints:
                  - "How much of the clock face does the minute hand pass?"
                  - "From 12 to 3 is one quarter of the way round."
                  - "A quarter turn, one right angle."
              - id: l2-f5
                type: multiple_choice
                text: "Mia faces the board. She makes a half turn. Where does she face now?"
                options: ["the back of the classroom", "the board", "the window on her right"]
                answer: "the back of the classroom"
                hints:
                  - "A half turn makes you face the other way."
                  - "The opposite of the board is the back of the room."
                  - "She faces the back of the classroom."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A quarter turn is ..."
                options: ["1 right angle", "2 right angles", "4 right angles"]
                answer: "1 right angle"
                hints: ["Four quarter turns make a whole turn."]
              - id: l2-s2
                type: multiple_choice
                text: "How many right angles is this turn?"
                show: { drawn: angle, degrees: 270, label: false }
                options: ["3", "2", "4"]
                answer: "3"
                hints: ["It is more than a half turn but not a whole turn."]
              - id: l2-s3
                type: multiple_choice
                text: "The minute hand turns from 12 to 6. What turn is that?"
                show: { drawn: clock, hour: 12, minute: 30 }
                options: ["a quarter turn", "a half turn", "a whole turn"]
                answer: "a half turn"
                hints: ["From 12 to 6 is halfway round."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Two right angles make a straight line."
                answer: true
                hints: ["Two right angles make a half turn."]
              - id: l2-s5
                type: multiple_choice
                text: "How many right angles make three quarters of a turn?"
                options: ["3", "4", "1"]
                answer: "3"
                hints: ["Each quarter turn is 1 right angle."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ben faces the door. He turns through 4 right angles. Where does he face now?"
                options: ["the door", "away from the door", "the wall on his left"]
                answer: "the door"
              - id: l2-n2
                type: multiple_choice
                text: "The minute hand turns clockwise from 3 to 9. How many right angles is that?"
                options: ["2", "3", "6"]
                answer: "2"
              - id: l2-n3
                type: multiple_choice
                text: "The minute hand turns clockwise from 12 to 9. What turn is that?"
                options: ["three quarters of a turn", "a quarter turn", "a half turn"]
                answer: "three quarters of a turn"
              - id: l2-n4
                type: true_false
                text: "Is it true? A half turn is 4 right angles."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "How many minutes does the minute hand take to turn through 1 right angle?"
                options: ["15", "30", "60"]
                answer: "15"
                difficulty: stretch

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: compare
            type: image_multiple_choice
            text: "Which angle is greater than a right angle?"
            options:
              - { drawn: angle, degrees: 140, label: false, key: greater }
              - { drawn: angle, degrees: 90, label: false, key: right }
              - { drawn: angle, degrees: 50, label: false, key: less }
            answer: greater
          - id: l2-c2
            part: shapes
            type: multiple_choice
            text: "How many right angles does this shape have?"
            show: { drawn: shape, kind: trapezoid }
            options: ["0", "2", "4"]
            answer: "0"
          - id: l2-c3
            part: turns
            type: multiple_choice
            text: "Sam turns through 2 right angles. What turn is that?"
            options: ["a half turn", "a quarter turn", "a whole turn"]
            answer: "a half turn"
          - id: l2-c4
            part: identify
            type: image_multiple_choice
            text: "Which clock shows a right angle between its hands?"
            options:
              - { drawn: clock, hour: 9, minute: 0 }
              - { drawn: clock, hour: 5, minute: 0 }
              - { drawn: clock, hour: 6, minute: 0 }
            answer: "9:00"
          - id: l2-c5
            part: identify
            type: multiple_choice
            text: "Where can you find a right angle?"
            options: ["the corner of a door", "the tip of a pencil", "a ball"]
            answer: "the corner of a door"
          - id: l2-c6
            part: identify
            type: true_false
            text: "Is it true? This is a right angle."
            show: { drawn: angle, degrees: 90, rotate: 50, label: false }
            answer: true
          - id: l2-c7
            part: identify
            type: multiple_choice
            text: "Which of these has a right angle?"
            options: ["the tip of a party hat", "a coin", "the corner of a window"]
            answer: "the corner of a window"
          - id: l2-c8
            part: identify
            type: image_multiple_choice
            text: "Which of these angles is a right angle?"
            options:
              - { drawn: angle, degrees: 120, label: false, key: greater }
              - { drawn: angle, degrees: 90, rotate: 70, label: false, key: right }
              - { drawn: angle, degrees: 50, rotate: 30, label: false, key: less }
            answer: right
          - id: l2-c9
            part: shapes
            type: multiple_choice
            text: "How many right angles does this shape have?"
            show: { drawn: shape, kind: square }
            options: ["1", "2", "4"]
            answer: "4"
          - id: l2-c10
            part: shapes
            type: image_multiple_choice
            text: "Which shape has no right angles?"
            options:
              - { drawn: shape, kind: rectangle }
              - { drawn: shape, kind: hexagon }
              - { drawn: shape, kind: square }
            answer: hexagon
            option_audio: false
          - id: l2-c11
            part: shapes
            type: true_false
            text: "Is it true? A rectangle has 2 right angles."
            show: { drawn: shape, kind: rectangle }
            answer: false
          - id: l2-c12
            part: shapes
            type: multiple_choice
            text: "Jo draws 2 squares. How many right angles are there altogether?"
            options: ["2", "4", "8"]
            answer: "8"
          - id: l2-c13
            part: compare
            type: multiple_choice
            text: "Which of these makes an angle less than a right angle?"
            options: ["the corner of a book", "the tip of a party hat", "a door opened wide"]
            answer: "the tip of a party hat"
          - id: l2-c14
            part: compare
            type: image_multiple_choice
            text: "On which clock do the hands make an angle greater than a right angle?"
            options:
              - { drawn: clock, hour: 2, minute: 0 }
              - { drawn: clock, hour: 3, minute: 0 }
              - { drawn: clock, hour: 4, minute: 0 }
            answer: "4:00"
          - id: l2-c15
            part: compare
            type: true_false
            text: "Is it true? This angle is less than a right angle."
            show: { drawn: angle, degrees: 120, label: false }
            answer: false
          - id: l2-c16
            part: compare
            type: image_multiple_choice
            text: "Which of these angles is less than a right angle?"
            options:
              - { drawn: angle, degrees: 90, rotate: 20, label: false, key: right }
              - { drawn: angle, degrees: 150, label: false, key: greater }
              - { drawn: angle, degrees: 60, rotate: 40, label: false, key: less }
            answer: less
          - id: l2-c17
            part: turns
            type: multiple_choice
            text: "Zoe faces the window. She turns through 2 right angles. Where does she face now?"
            options: ["the window", "away from the window", "the wall on her left"]
            answer: "away from the window"
          - id: l2-c18
            part: turns
            type: multiple_choice
            text: "The minute hand turns clockwise from 6 to 9. How many right angles is that?"
            options: ["1", "2", "3"]
            answer: "1"
          - id: l2-c19
            part: turns
            type: true_false
            text: "Is it true? Three quarters of a turn is 3 right angles."
            answer: true
          - id: l2-c20
            part: turns
            type: multiple_choice
            text: "The minute hand turns all the way round, from 12 back to 12. How many right angles is that?"
            options: ["2", "4", "12"]
            answer: "4"
