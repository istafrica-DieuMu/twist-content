                  - "From 200 to 300 in ten intervals: each is ten."
                  - "Seven intervals: 270."
              - id: l2-f3
                type: text_input
                text: "Where is the arrow pointing? Type the number."
                show: { drawn: number-line, from: 460, to: 470, labels: ends, mark: 468 }
                answer: "468"
                hints:
                  - "Here each interval is one."
                  - "Eight on from 460, or two back from 470."
                  - "It is 468."
              - id: l2-f4
                type: multiple_choice
