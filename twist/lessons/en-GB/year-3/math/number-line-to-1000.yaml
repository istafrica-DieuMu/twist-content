          - id: l2-w2
            type: point_on_line
            text: "Where is 320?"
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends }
            answer: 320
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "What is each interval worth? Guess!"
            say: "This line goes from five hundred to six hundred. What do you think each little jump is worth: one, ten or a hundred? Have a guess."
            show: { drawn: number-line, from: 500, to: 600, step: 10, labels: ends }
          - text: "Each interval is 10."
            say: "Before you read an arrow, always ask: what is each interval worth? This line goes from five hundred to six hundred in ten intervals, so each one is ten."
            show: { drawn: number-line, from: 500, to: 600, step: 10, labels: ends, mark: 540 }
          - text: "540"
            say: "Four intervals after five hundred: five hundred and ten, twenty, thirty, forty. The arrow points to five hundred and forty."
            show: { drawn: number-line, from: 500, to: 600, step: 10, labels: ends, mark: 540 }
          - text: "about 250"
            say: "This line has only its ends labelled, zero and one thousand, and marks every hundred. The arrow is halfway between two hundred and three hundred, so it is about two hundred and fifty. That is an estimate."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 250 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Where is the arrow pointing?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 300 }
