# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.number-line-to-1000
skill: math.numbers-to-1000.number-line
curriculum: en-GB
language: en
title:
  de: Der Zahlenstrahl bis 1000
  en: Number lines to 1000
summary: >
  Number lines to 1000 with different intervals: 0 to 1000 in hundreds, a
  hundred in tens, a ten in ones. Lesson 1 places multiples of a hundred
  and of ten; lesson 2 works out the interval first, then reads where an
  arrow points, and estimates on a line with only its ends labelled. Ends
  with the skill check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.read-write]
  also_practises: [math.numbers-to-100.number-line]
  vocabulary: { en: [number line, interval, halfway, estimate, between, arrow] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: []
  parts:
    - { id: find, what: { de: Zahlen am Zahlenstrahl finden, en: finding numbers on a number line } }
    - { id: read, what: { de: "ablesen, wohin der Pfeil zeigt", en: reading the number an arrow points to } }
    - { id: interval, what: { de: "sagen, wie viel ein Abschnitt wert ist", en: working out what each interval is worth } }
    - { id: estimate, what: { de: am Zahlenstrahl schätzen, en: estimating where an arrow points } }
  misconceptions:
    - id: interval-is-one
      what: Reads every interval as one, whatever the line counts in
      addressed: lesson 2 Learn finds the interval first; feedback on a count-in-ones answer names the interval
    - id: start-at-zero
      what: Counts from 0 on a line that starts at 300
      addressed: lesson 1 uses lines that start at a hundred and says "start at the first mark"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Hunderter und Zehner finden, en: Placing hundreds and tens }
    goal:
      de: "Finde Hunderter und Zehner auf dem Zahlenstrahl bis 1000, so wie 370, indem du von 300 aus 7 Zehner weiterzählst."
      en: "Find hundreds and tens on a number line to 1000, like 370, by counting on 7 tens from 300."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: point_on_line
            text: "Where is 70?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
            answer: 70
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "100, 200, 300, _"
            options: ["310", "400", "301"]
            answer: "400"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Where is 500? Guess!"
            say: "This number line goes from zero to one thousand. Where do you think five hundred goes? Have a guess, then look."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
          - text: "0 to 1000"
            say: "Five hundred is right in the middle. This number line goes from zero to one thousand in ten equal jumps. Each interval is one hundred."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
          - text: "300 to 400"
            say: "Zoom in between three hundred and four hundred. Now each interval is ten: three hundred and ten, three hundred and twenty, and so on."
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends }
          - text: "370"
            say: "Where is three hundred and seventy? Start at the first mark, three hundred, and count on seven tens."
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends, mark: 370 }
          - text: "Did you know? In 2021, scientists found a millipede with 1306 legs."
            say: "Did you know? Millipede means a thousand feet, but for a long time no millipede had that many. Then, in twenty twenty-one, scientists in Australia found one deep underground with one thousand, three hundred and six legs. On our number line, it would walk right off the end!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_line
                text: "The race track is 1000 m long. Mo has run 600 m. Where is Mo?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: 600
                hints:
                  - "Each interval is one hundred."
                  - "Count: one hundred, two hundred, ..."
                  - "600 is the sixth mark after zero."
                difficulty: easy
              - id: l1-f2
                type: point_on_line
                text: "Where is 240?"
                show: { drawn: number-line, from: 200, to: 300, step: 10, labels: ends }
                answer: 240
                hints:
                  - "Each interval is ten."
                  - "Start at 200: 210, 220, ..."
                  - "Four tens after 200."
              - id: l1-f3
                type: point_on_line
                text: "Where is 900?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: 900
                hints:
                  - "900 is close to 1000."
                  - "One interval back from 1000."
                  - "The mark before 1000."
              - id: l1-f4
                type: multiple_choice
                text: "The arrow is halfway between 500 and 600. Which number is it?"
                show: { drawn: number-line, from: 500, to: 600, step: 10, labels: ends, mark: 550 }
                options: ["505", "550", "560"]
                answer: "550"
                feedback:
                  "505": "Each interval here is ten, not one. Halfway is five tens after 500."
                hints:
                  - "What is each interval worth?"
                  - "Each interval is ten. Halfway is five tens after 500."
                  - "500 and five tens is 550."
              - id: l1-f5
                type: point_on_line
                text: "Where is 780?"
                show: { drawn: number-line, from: 700, to: 800, step: 10, labels: ends }
                answer: 780
                hints:
                  - "780 is close to 800."
                  - "Two tens back from 800."
                  - "790, then 780."
              - id: l1-f6
                type: point_on_line
                text: "Where is 130?"
                show: { drawn: number-line, from: 100, to: 200, step: 10, labels: ends }
                answer: 130
                hints:
                  - "Start at 100."
                  - "Count on three tens."
                  - "110, 120, 130."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Is it true? The arrow points to 300."
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 300 }
                answer: true
                hints: ["Each interval is one hundred."]
              - id: l1-s2
                type: point_on_line
                text: "Where is 460?"
                show: { drawn: number-line, from: 400, to: 500, step: 10, labels: ends }
                answer: 460
                hints: ["Halfway is 450."]
              - id: l1-s3
                type: point_on_line
                text: "Where is 820?"
                show: { drawn: number-line, from: 800, to: 900, step: 10, labels: ends }
                answer: 820
                hints: ["Start at 800."]
              - id: l1-s4
                type: point_on_line
                text: "Where is 690?"
                show: { drawn: number-line, from: 600, to: 700, step: 10, labels: ends }
                answer: 690
                hints: ["One ten before 700."]
              - id: l1-s5
                type: text_input
                text: "Which number is halfway between 0 and 1000?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: "500"
                hints: ["Half of 1000."]
              - id: l1-s6
                type: point_on_line
                text: "Where is 350?"
                show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends }
                answer: 350
                hints: ["Halfway."]

          - support: none
            tasks:
              - id: l1-n1
                type: point_on_line
                text: "Where is 200?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: 200
              - id: l1-n2
                type: point_on_line
                text: "Where is 970?"
                show: { drawn: number-line, from: 900, to: 1000, step: 10, labels: ends }
                answer: 970
              - id: l1-n3
                type: multiple_choice
                text: "The arrow shows how many steps Zara has walked. How many?"
                show: { drawn: number-line, from: 400, to: 500, step: 10, labels: ends, mark: 410 }
                options: ["401", "410", "500"]
                answer: "410"
              - id: l1-n4
                type: point_on_line
                text: "Where is 700?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: 700
              - id: l1-n5
                type: point_on_line
                text: "Where is 260?"
                show: { drawn: number-line, from: 200, to: 300, step: 10, labels: ends }
                answer: 260
              - id: l1-n6
                type: point_on_line
                text: "Where is 580?"
                show: { drawn: number-line, from: 500, to: 600, step: 10, labels: ends }
                answer: 580

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: point_on_line
            text: "Where is 400?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
            answer: 400
          - id: l1-c2
            type: point_on_line
            text: "Where is 630?"
            show: { drawn: number-line, from: 600, to: 700, step: 10, labels: ends }
            answer: 630
          - id: l1-c3
            type: point_on_line
            text: "Where is 170?"
            show: { drawn: number-line, from: 100, to: 200, step: 10, labels: ends }
            answer: 170
          - id: l1-c4
            type: multiple_choice
            text: "Where is the arrow pointing?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 100 }
            options: ["1", "10", "100"]
            answer: "100"
          - id: l1-c5
            type: point_on_line
            text: "Where is 750?"
            show: { drawn: number-line, from: 700, to: 800, step: 10, labels: ends }
            answer: 750
          - id: l1-c6
            type: point_on_line
            text: "Where is 840?"
            show: { drawn: number-line, from: 800, to: 900, step: 10, labels: ends }
            answer: 840

  - n: 2
    title: { de: Pfeile lesen und schätzen, en: Reading arrows and estimating }
    goal:
      de: "Finde heraus, was ein Abschnitt wert ist, und lies dann ab, wohin der Pfeil zeigt, so wie 540 zwischen 500 und 600."
      en: "Work out what each step on the line is worth, then read the arrow, like 540 between 500 and 600."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: point_on_line
            text: "Where is 800?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
