# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.add-sub-hundreds
skill: math.add-sub-to-1000.hundreds
curriculum: en-GB
language: en
title:
  de: Hunderter und Zehner addieren und subtrahieren
  en: Adding and subtracting hundreds and tens
summary: >
  Adding and subtracting whole hundreds and whole tens within 1000.
  Lesson 1 works with hundreds only (300 + 400, 1000 − 700), using the
  known fact (3 + 4 = 7, so 3 hundreds + 4 hundreds = 7 hundreds); lesson
  2 adds and subtracts hundreds or tens to a three-digit number without
  crossing a boundary (470 − 50, 345 + 200), where only one digit
  changes, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value, math.add-sub-to-100.tens]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { en: [hundreds, tens, ones, known fact, one thousand, digit, place value] }
  forms: [drawn, text, audio]
  drawn: [base-ten, place-value-chart]
  facets: []
  misconceptions:
    - id: wrong-place
      what: Adds tens as ones or as hundreds (360 + 30 = 363 or 660)
      addressed: lesson 2 Learn says which digit changes; l2-f1 has feedback on 363 and 660; l2-f3, l2-s3 and l2-n3 ask which digit changes; l2-s1, l2-n1 and l2-c3 offer the wrong place
    - id: zeros-pile-up
      what: Writes the known fact and adds too many zeros (200 + 500 = 7000)
      addressed: lesson 1 Learn counts in hundreds (2 hundreds and 5 hundreds are 7 hundreds); l1-f1 has feedback on 7000; l1-s3 and l1-c2 offer too many or too few zeros
    - id: thousand-as-hundred
      what: Treats 1000 as 100 when subtracting hundreds from it (1000 − 700 = 30)
      addressed: lesson 1 Learn says 1000 is 10 hundreds; l1-f5, l1-s5, l1-n5 and l2-c5 subtract from 1000, with feedback in l1-f5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit Hundertern rechnen", en: "Calculating with hundreds" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "50 + 30 = _"
            answer: "80"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many hundreds are there in 600?"
            options: ["6", "60", "600"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "300 + 400"
            say: "Three hundred add four hundred. Here are three hundreds. Now add four more hundreds."
            show: { drawn: base-ten, hundreds: 3, tens: 0, ones: 0 }
          - text: "3 + 4 = 7, so 300 + 400 = 700"
            say: "Three hundreds and four hundreds make seven hundreds. You know three add four is seven, so three hundred add four hundred is seven hundred. Count in hundreds and the zeros look after themselves."
            show: { drawn: base-ten, hundreds: 7, tens: 0, ones: 0 }
          - text: "800 − 500 = 300"
            say: "Taking away works the same way. Eight hundreds take away five hundreds leaves three hundreds."
          - text: "1000 − 400 = 600"
            say: "One thousand is ten hundreds. Ten hundreds take away four hundreds leaves six hundreds, so one thousand take away four hundred is six hundred."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "200 + 500 = _"
                options: ["700", "7000", "70"]
                answer: "700"
                feedback:
                  "7000": "2 hundreds and 5 hundreds are 7 hundreds, and 7 hundreds is 700."
                hints:
                  - "Count in hundreds."
                  - "2 hundreds and 5 hundreds make 7 hundreds."
                  - "700."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Use the known fact."
                frame: "6 − 2 = _, so 600 − 200 = _"
                options: ["4", "40", "400", "800"]
                answer: ["4", "400"]
                hints:
                  - "First work out 6 − 2."
                  - "6 hundreds take away 2 hundreds."
                  - "4 and 400."
              - id: l1-f3
                type: text_input
                text: "900 − 300 = _"
                answer: "600"
                hints:
                  - "9 hundreds take away 3 hundreds."
                  - "9 − 3 = 6."
                  - "600."
              - id: l1-f4
                type: true_false
                text: "Is it true? 400 + 600 = 1000"
                answer: true
                hints:
                  - "4 hundreds and 6 hundreds make how many hundreds?"
                  - "10 hundreds. How much is that?"
                  - "10 hundreds is 1000, so yes."
              - id: l1-f5
                type: multiple_choice
                text: "1000 − 700 = _"
                options: ["300", "30", "3000"]
                answer: "300"
                feedback:
                  "30": "1000 is 10 hundreds, not 10 tens. 10 hundreds take away 7 hundreds is 3 hundreds."
                hints:
                  - "How many hundreds make 1000?"
                  - "10 hundreds take away 7 hundreds."
                  - "3 hundreds: 300."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "500 + 300 = _"
                answer: "800"
                hints: ["5 hundreds and 3 hundreds."]
              - id: l1-s2
                type: fill_in_blank
                text: "Use the known fact."
                frame: "4 + 5 = _, so 400 + 500 = _"
                options: ["9", "90", "900", "450"]
                answer: ["9", "900"]
                hints: ["4 hundreds and 5 hundreds."]
              - id: l1-s3
                type: multiple_choice
                text: "700 − 400 = _"
                options: ["300", "30", "3000"]
                answer: "300"
                hints: ["7 hundreds take away 4 hundreds."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 800 − 200 = 500"
                answer: false
                hints: ["8 − 2 is not 5."]
              - id: l1-s5
                type: text_input
                text: "1000 − 200 = _"
                answer: "800"
                hints: ["1000 is 10 hundreds."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "100 + 600 = _"
                answer: "700"
              - id: l1-n2
                type: text_input
                text: "300 + 300 = _"
                answer: "600"
              - id: l1-n3
                type: multiple_choice
                text: "900 − 600 = _"
                options: ["300", "30", "1500"]
                answer: "300"
              - id: l1-n4
                type: true_false
                text: "Is it true? 200 + 700 = 900"
                answer: true
              - id: l1-n5
                type: text_input
                text: "A school has £1000 to spend on books. It spends £500. How much is left, in pounds?"
                answer: "500"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "600 + 300 = _"
            answer: "900"
          - id: l1-c2
            type: multiple_choice
            text: "800 − 300 = _"
            options: ["500", "50", "5000"]
            answer: "500"
          - id: l1-c3
            type: fill_in_blank
            text: "Use the known fact."
            frame: "7 + 2 = _, so 700 + 200 = _"
            options: ["9", "90", "900", "720"]
            answer: ["9", "900"]

  - n: 2
    title: { de: "Hunderter und Zehner zu dreistelligen Zahlen", en: "Hundreds and tens with three-digit numbers" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "400 + 500 = _"
            answer: "900"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "1000 − 600 = _"
            answer: "400"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "345 + 200 = 545"
            say: "Three hundred and forty-five add two hundred. You are adding hundreds, so only the hundreds digit changes: three hundreds and two more make five hundreds. The tens and ones stay the same. Five hundred and forty-five."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [5, 4, 5] }
          - text: "470 − 50 = 420"
            say: "Four hundred and seventy take away fifty. You are taking away tens, so only the tens digit changes: seven tens take away five tens leaves two tens. Four hundred and twenty."
            show: { drawn: base-ten, hundreds: 4, tens: 2, ones: 0 }
          - text: "360 + 30 = 390"
            say: "Three hundred and sixty add thirty. Thirty is three tens, so the tens digit goes from six to nine. It is not three hundred and sixty-three, and not six hundred and sixty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "360 + 30 = _"
                options: ["390", "363", "660"]
                answer: "390"
                feedback:
                  "363": "30 is 3 tens, not 3 ones. The tens digit changes."
                  "660": "30 is 3 tens, not 3 hundreds. The tens digit changes."
                hints:
                  - "How many tens is 30?"
                  - "3 tens. The tens digit goes up by 3."
                  - "6 tens + 3 tens = 9 tens: 390."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "526 + 300 = _"
                answer: "826"
                hints:
                  - "You are adding hundreds."
                  - "5 hundreds + 3 hundreds. The 26 stays."
                  - "826."
              - id: l2-f3
                type: multiple_choice
                text: "748 − 40: which digit changes?"
                options: ["the hundreds digit", "the tens digit", "the ones digit"]
                answer: "the tens digit"
                keep_order: true
                hints:
                  - "What are you taking away: hundreds, tens or ones?"
                  - "40 is 4 tens."
                  - "The tens digit: 4 tens become 0 tens. 708."
              - id: l2-f4
                type: fill_in_blank
                text: "Use the known fact."
                frame: "8 − 5 = _, so 485 − 50 = _"
                options: ["3", "435", "480", "35"]
                answer: ["3", "435"]
                hints:
                  - "First work out 8 − 5."
                  - "485 has 8 tens. Take away 5 tens."
                  - "3 tens are left: 435."
              - id: l2-f5
                type: true_false
                text: "Is it true? 672 − 400 = 272"
                answer: true
                hints:
                  - "Which digit changes?"
                  - "6 hundreds take away 4 hundreds."
                  - "2 hundreds, and the 72 stays. Yes, 272."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "240 + 50 = _"
                options: ["290", "245", "740"]
                answer: "290"
                hints: ["50 is 5 tens."]
              - id: l2-s2
                type: text_input
                text: "915 − 600 = _"
                answer: "315"
                hints: ["Only the hundreds digit changes."]
              - id: l2-s3
                type: multiple_choice
                text: "253 + 600: which digit changes?"
                options: ["the hundreds digit", "the tens digit", "the ones digit"]
                answer: "the hundreds digit"
                keep_order: true
                hints: ["600 is 6 hundreds."]
              - id: l2-s4
                type: fill_in_blank
                text: "Use the known fact."
                frame: "2 + 6 = _, so 324 + 60 = _"
                options: ["8", "384", "924", "330"]
                answer: ["8", "384"]
                hints: ["324 has 2 tens. Add 6 tens."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 590 − 30 = 587"
                answer: false
                hints: ["30 is 3 tens, not 3 ones."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "817 + 70 = _"
                options: ["887", "824", "1517"]
                answer: "887"
              - id: l2-n2
                type: text_input
                text: "638 − 200 = _"
                answer: "438"
              - id: l2-n3
                type: multiple_choice
                text: "966 − 40: which digit changes?"
                options: ["the hundreds digit", "the tens digit", "the ones digit"]
                answer: "the tens digit"
                keep_order: true
              - id: l2-n4
                type: text_input
                text: "150 + 800 = _"
                answer: "950"
              - id: l2-n5
                type: text_input
                text: "A farmer has 380 sheep. He sells 60. How many sheep has he got now?"
                answer: "320"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "200 + 800 = _"
            answer: "1000"
          - id: l2-c2
            type: text_input
            text: "463 + 300 = _"
            answer: "763"
          - id: l2-c3
            type: multiple_choice
            text: "570 − 40 = _"
            options: ["530", "566", "170"]
            answer: "530"
          - id: l2-c4
            type: text_input
            text: "209 + 80 = _"
            answer: "289"
          - id: l2-c5
            type: multiple_choice
            text: "1000 − 300 = _"
            options: ["700", "70", "7000"]
            answer: "700"
