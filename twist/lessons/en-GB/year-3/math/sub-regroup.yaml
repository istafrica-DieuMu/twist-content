          - text: "6 hundreds → 5 hundreds and 10 tens"
            say: "Exchange one hundred for ten tens. Cross out the six and write a small five. The ten tens join the two tens: twelve tens. Twelve subtract five is seven. Hundreds: five subtract three is two. The answer is two hundred and seventy-four."
            show: { drawn: written-calc, rows: ["628", "354"], op: "-", above: "51 ", cross: "x  ", result: "274" }
          - text: "523 − 268 = 255"
            say: "Sometimes you exchange twice: first a ten for the ones, then a hundred for the tens. Work from right to left, and before each column ask: are there enough on top?"
