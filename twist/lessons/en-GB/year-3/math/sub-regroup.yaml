# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.sub-regroup
skill: math.written-add-sub.sub-regroup
curriculum: en-GB
language: en
title:
  de: Schriftlich subtrahieren mit Entbündeln
  en: Column subtraction with exchanging
summary: >
  Column subtraction with exchange, the method taught in England: when a
  column has too few on top, exchange one from the next column for ten.
  Lesson 1 exchanges a ten for ten ones (352 − 127); lesson 2 exchanges a
  hundred for ten tens and exchanges twice in one calculation, finds the
  step where a worked calculation went wrong, and ends with the skill
  check.
metadata:
  year: year-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.sub-no-regroup]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { en: [column subtraction, exchange, ten ones, ten tens, cross out, not enough] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: [written-subtraction]
  parts:
    - { id: tens, what: { de: einen Zehner entbündeln, en: exchanging a ten } }
    - { id: hundreds, what: { de: einen Hunderter entbündeln, en: exchanging a hundred } }
    - { id: twice, what: { de: zweimal entbündeln, en: exchanging twice in one calculation } }
    - { id: explain, what: { de: "erklären, wann und wie du entbündelst, und Fehler finden", en: "explaining when and how to exchange, and finding mistakes" } }
  misconceptions:
    - id: smaller-from-larger
      what: Takes the smaller digit from the larger whatever row it is in (352 − 127 gives 235, from 7 − 2)
      addressed: lesson 1 Learn takes the bottom digit from the top one; l1-f1 has feedback on it; l1-s4, l1-c3 and l2-s2 show a swapped result
    - id: forget-to-reduce
      what: Exchanges but does not make the next column one smaller (483 − 157 = 336)
      addressed: lesson 1 Learn crosses out and writes the smaller digit; l2-f2 has feedback on it; l2-n2, l2-c4 and l2-s5 show the mistake again
    - id: exchange-when-not-needed
      what: Exchanges even when the top digit is big enough
      addressed: l1-s1 has enough ones on top
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Einen Zehner entbündeln, en: Exchanging a ten }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Subtract in columns."
            say: "Subtract three hundred and twenty-four from eight hundred and fifty-seven in columns."
            show: { drawn: written-calc, rows: ["857", "324"], op: "-" }
            answer: "533"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "1 ten is the same as _"
            options: ["10 ones", "1 one", "100 ones"]
            answer: "10 ones"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "352 − 127"
            say: "Three hundred and fifty-two subtract one hundred and twenty-seven. Start with the ones: two subtract seven. There are not enough ones on top."
            show: { drawn: written-calc, rows: ["352", "127"], op: "-" }
          - text: "5 tens → 4 tens and 10 ones"
            say: "So exchange one ten for ten ones. Cross out the five tens and write a small four above: four tens are left. The ten ones join the two ones. Write a small one in front of the two, so now there are twelve ones."
            show: { drawn: written-calc, rows: ["352", "127"], op: "-", above: " 41", cross: " x " }
          - text: "12 − 7 = 5\n4 − 2 = 2\n3 − 1 = 2"
            say: "Now subtract. Ones: twelve subtract seven is five. Tens: four subtract two is two. Hundreds: three subtract one is two. The answer is two hundred and twenty-five."
            show: { drawn: written-calc, rows: ["352", "127"], op: "-", above: " 41", cross: " x ", result: "225" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ones: 2 on top, 6 underneath. What do you do?"
                show: { drawn: written-calc, rows: ["472", "136"], op: "-" }
                options: ["exchange a ten for ten ones", "work out 6 − 2", "leave the ones out"]
                answer: "exchange a ten for ten ones"
                feedback:
                  "work out 6 − 2": "You always take the bottom digit from the top digit. 2 − 6 cannot be done, so exchange a ten first."
                hints:
                  - "Can you take 6 away from 2?"
                  - "No. There are not enough ones on top, so you need more ones."
                  - "Exchange a ten for ten ones."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "A ten has been exchanged. Now subtract."
                show: { drawn: written-calc, rows: ["472", "136"], op: "-", above: " 61", cross: " x ", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["6", "3", "4", "7"]
                answer: ["6", "3", "3"]
                hints:
                  - "Ones: 12 subtract 6."
                  - "Tens: 6 subtract 3, because one ten was exchanged. Hundreds: 4 subtract 1."
                  - "O: 6, T: 3, H: 3. The answer is 336."
              - id: l1-f3
                type: text_input
                text: "Subtract in columns."
                say: "Subtract two hundred and forty-seven from five hundred and eighty-one in columns."
                show: { drawn: written-calc, rows: ["581", "247"], op: "-" }
                answer: "334"
                hints:
                  - "1 − 7 cannot be done. Exchange a ten."
                  - "11 − 7 = 4. Tens: 7 − 4, because 8 tens became 7."
                  - "334."
              - id: l1-f4
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["735", "418"], op: "-", above: " 21", cross: " x ", result: "317" }
                answer: true
                hints:
                  - "Ones: 15 subtract 8."
                  - "Tens: 2 subtract 1. Hundreds: 7 subtract 4."
                  - "Yes, 317 is right."
              - id: l1-f5
                type: text_input
                text: "Subtract in columns."
                say: "Subtract five hundred and twenty-seven from nine hundred and sixty-four in columns."
                show: { drawn: written-calc, rows: ["964", "527"], op: "-" }
                answer: "437"
                hints:
                  - "4 − 7 cannot be done. Exchange a ten."
                  - "14 − 7 = 7. Tens: 5 − 2. Hundreds: 9 − 5."
                  - "437."

