# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.bridging-to-1000
skill: math.add-sub-to-1000.bridging
curriculum: en-GB
language: en
title:
  de: Über Zehner und Hunderter rechnen
  en: Adding and subtracting across tens and hundreds
summary: >
  Mental adding and subtracting that crosses a ten or a hundred, in two
  jumps on an empty number line via the next ten or hundred. Lesson 1
  adds and subtracts tens across a hundred (380 + 50 = 380 + 20 + 30);
  lesson 2 adds and subtracts ones across a ten, and sometimes a hundred
  (605 − 8, 396 + 7), and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.add-sub-to-1000.hundreds, math.add-sub-to-100.ones-bridge]
  also_practises: [math.add-sub-to-100.complement]
  vocabulary: { en: [next hundred, next ten, bridge, partition, empty number line, jump] }
  forms: [drawn, text, audio]
  drawn: [equation, rechenstrich]
  facets: [operation-signs]
  parts:
    - { id: tens, what: { de: Zehner über den Hunderter addieren und subtrahieren, en: adding and subtracting tens across a hundred } }
    - { id: ones-add, what: { de: Einer über den Zehner oder Hunderter addieren, en: adding ones across a ten or a hundred } }
    - { id: ones-sub, what: { de: Einer über den Zehner oder Hunderter subtrahieren, en: subtracting ones across a ten or a hundred } }
    - { id: steps, what: { de: in Schritten über den vollen Zehner oder Hunderter rechnen, en: jumping to the next ten or hundred first } }
  misconceptions:
    - id: carry-dropped
      what: Loses the new hundred when the tens add up to more than ten (290 + 40 = 230)
      addressed: lesson 1 Learn jumps to the next hundred first; l1-f2 has feedback on 230; l1-s3, l1-n3 and l2-c2 offer the answer without the new hundred
    - id: ones-reversed
      what: Takes the smaller ones digit from the larger one when subtracting (703 − 5 = 702)
      addressed: lesson 2 Learn takes away in two jumps via the hundred; l2-f2 has feedback on 702; l2-s2, l2-n2 and l2-c4 offer the reversed answer
    - id: first-jump-wrong
      what: Does not know how far it is to the next ten or hundred, so splits the number wrongly (370 + 60 = 370 + 20 + 40)
      addressed: lesson 1 and lesson 2 Learn say how far it is to the next hundred or ten; l1-f1, l1-f3, l1-s1, l1-n1, l2-f1, l2-s1 and l2-n1 ask for the first jump
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Über den Hunderter", en: "Across a hundred" }
    goal:
      de: "Rechne Zehner über den Hunderter in zwei Sprüngen. Bei 380 + 50 springst du erst bis 400, dann weiter bis 430."
      en: "Add and take away tens across a hundred in two jumps. For 380 + 50, jump to 400 first, then on to 430."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "520 + 40 = _"
            answer: "560"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How much is it from 370 to 400?"
            options: ["30", "3", "70"]
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "380 + 50 = _"
            say: "Three hundred and eighty add fifty. Eight tens and five tens make thirteen tens, so this crosses the next hundred. Split the fifty to make it easy."
            show: { drawn: equation, text: "380 + 50 = _", split: "50 = 20 + 30" }
          - text: "380 + 20 + 30 = 430"
            say: "From three hundred and eighty it is twenty to the next hundred. Jump twenty to four hundred. Thirty is left. Jump thirty more to four hundred and thirty."
            show: { drawn: rechenstrich, start: 380, jumps: [20, 30] }
          - text: "620 − 40 = 620 − 20 − 20 = 580"
            say: "Subtracting works the same way, jumping back. Six hundred and twenty take away forty. Jump back twenty to six hundred. Twenty is left. Jump back twenty more to five hundred and eighty."
            show: { drawn: rechenstrich, start: 620, jumps: [-20, -20] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Jump to the next hundred first."
                frame: "370 + 60 = 370 + 30 + _ = _"
                options: ["30", "40", "430", "330"]
                answer: ["30", "430"]
                hints:
                  - "From 370 it is 30 to the next hundred."
                  - "60 is 30 and 30. 370 + 30 = 400."
                  - "400 + 30 = 430."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "290 + 40 = _"
                options: ["330", "230", "3130"]
                answer: "330"
                feedback:
                  "230": "9 tens and 4 tens make 13 tens. That is one more hundred, so the hundreds digit goes up."
                hints:
                  - "From 290 to 300 is 10."
                  - "290 + 10 = 300. 30 is left."
                  - "300 + 30 = 330."
              - id: l1-f3
                type: multiple_choice
                text: "450 − 70: which jump comes first?"
                show: { drawn: rechenstrich, start: 450, jumps: [], back: true }
                options: ["50", "70", "20"]
                answer: "50"
                hints:
                  - "Jump back to the hundred first."
                  - "From 450 back to 400 is 50."
                  - "50 first, then 20 more."
              - id: l1-f4
                type: text_input
                text: "560 + 70 = _"
                answer: "630"
                hints:
                  - "From 560 to 600 is 40."
                  - "70 = 40 + 30. 560 + 40 = 600."
                  - "600 + 30 = 630."
              - id: l1-f5
                type: fill_in_blank
                text: "Jump back to the hundred first."
                frame: "730 − 50 = 730 − 30 − _ = _"
                options: ["20", "30", "680", "780"]
                answer: ["20", "680"]
                hints:
                  - "730 − 30 = 700."
                  - "50 is 30 and 20. 20 is left."
                  - "700 − 20 = 680."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Jump to the next hundred first."
                frame: "480 + 50 = 480 + 20 + _ = _"
                options: ["30", "20", "530", "520"]
                answer: ["30", "530"]
                hints: ["From 480 to 500 is 20."]
              - id: l1-s2
                type: text_input
                text: "310 − 40 = _"
                answer: "270"
                hints: ["310 − 10 = 300. 30 is left."]
              - id: l1-s3
                type: multiple_choice
                text: "650 + 80 = _"
                options: ["730", "630", "6130"]
                answer: "730"
                hints: ["5 tens and 8 tens are more than 10 tens."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 520 − 60 = 460"
                answer: true
                hints: ["520 − 20 = 500. Take away 40 more."]
              - id: l1-s5
                type: text_input
                text: "190 + 30 = _"
                answer: "220"
                hints: ["190 + 10 = 200."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Jump back to the hundred first."
                frame: "910 − 30 = 910 − 10 − _ = _"
                options: ["20", "10", "880", "890"]
                answer: ["20", "880"]
              - id: l1-n2
                type: text_input
                text: "840 + 90 = _"
                answer: "930"
              - id: l1-n3
                type: multiple_choice
                text: "760 + 60 = _"
                options: ["820", "720", "7120"]
                answer: "820"
              - id: l1-n4
                type: true_false
                text: "Is it true? 430 − 50 = 480"
                answer: false
              - id: l1-n5
                type: text_input
                text: "A train has 270 passengers. At the next station 40 more get on. How many passengers are there now?"
                answer: "310"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "570 + 50 = _"
            answer: "620"
          - id: l1-c2
            type: text_input
            text: "820 − 50 = _"
            answer: "770"
          - id: l1-c3
            type: multiple_choice
            text: "390 + 40: which jump comes first?"
            show: { drawn: rechenstrich, start: 390, jumps: [] }
            options: ["10", "40", "30"]
            answer: "10"
          - id: l1-c4
            type: text_input
            text: "180 + 40 = _"
            answer: "220"
          - id: l1-c5
            type: multiple_choice
            text: "640 − 70 = _"
            options: ["570", "670", "530"]
            answer: "570"
          - id: l1-c6
            type: true_false
            text: "Is it true? 350 + 90 = 440"
            answer: true

  - n: 2
    title: { de: "Einer über den Zehner und Hunderter", en: "Ones across a ten or a hundred" }
    goal:
      de: "Rechne Einer über den Zehner in zwei Sprüngen. Bei 605 − 8 springst du erst zurück bis 600, dann noch 3 weiter."
      en: "Add and take away ones across a ten in two jumps. For 605 − 8, jump back to 600 first, then 3 more."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "380 + 40 = _"
            answer: "420"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "610 − 30 = _"
            answer: "580"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "248 + 5 = 248 + 2 + 3 = 253"
            say: "Two hundred and forty-eight add five. From two hundred and forty-eight it is two to the next ten, two hundred and fifty. Three is left: two hundred and fifty-three."
            show: { drawn: rechenstrich, start: 248, jumps: [2, 3] }
          - text: "396 + 7 = 396 + 4 + 3 = 403"
            say: "Three hundred and ninety-six add seven. It is four to the next ten, which is also the next hundred: four hundred. Three is left: four hundred and three."
            show: { drawn: rechenstrich, start: 396, jumps: [4, 3] }
          - text: "605 − 8 = 605 − 5 − 3 = 597"
            say: "Six hundred and five take away eight. Jump back five to six hundred. Three is left. Jump back three to five hundred and ninety-seven. Careful: do not take the five from the eight. You are taking eight away from six hundred and five, so the answer is less than six hundred."
            show: { drawn: rechenstrich, start: 605, jumps: [-5, -3] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Jump to the next ten first."
                frame: "457 + 6 = 457 + 3 + _ = _"
                options: ["3", "4", "463", "460"]
                answer: ["3", "463"]
                hints:
                  - "From 457 to 460 is 3."
                  - "6 is 3 and 3. 457 + 3 = 460."
                  - "460 + 3 = 463."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "703 − 5 = _"
                options: ["698", "702", "708"]
                answer: "698"
                feedback:
                  "702": "That takes 3 away from 5. You must take 5 away from 703: back 3 to 700, then 2 more."
                hints:
                  - "Jump back to 700 first."
                  - "703 − 3 = 700. 2 is left."
                  - "700 − 2 = 698."
              - id: l2-f3
                type: text_input
                text: "398 + 6 = _"
                answer: "404"
                hints:
                  - "From 398 to 400 is 2."
                  - "6 = 2 + 4. 398 + 2 = 400."
                  - "400 + 4 = 404."
              - id: l2-f4
                type: fill_in_blank
                text: "Jump back to the ten first."
                frame: "532 − 7 = 532 − 2 − _ = _"
                options: ["5", "4", "525", "535"]
                answer: ["5", "525"]
                hints:
                  - "532 − 2 = 530."
                  - "7 is 2 and 5. 5 is left."
                  - "530 − 5 = 525."
              - id: l2-f5
                type: true_false
                text: "Is it true? 299 + 4 = 303"
                answer: true
                hints:
                  - "From 299 to 300 is 1."
                  - "300 and 3 more."
                  - "303, so yes."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Jump to the next ten first."
                frame: "684 + 9 = 684 + 6 + _ = _"
                options: ["3", "4", "693", "690"]
                answer: ["3", "693"]
                hints: ["From 684 to 690 is 6."]
              - id: l2-s2
                type: multiple_choice
                text: "802 − 6 = _"
                options: ["796", "804", "806"]
                answer: "796"
                hints: ["Back 2 to 800, then 4 more."]
              - id: l2-s3
                type: text_input
                text: "195 + 8 = _"
                answer: "203"
                hints: ["195 + 5 = 200."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 441 − 5 = 434"
                answer: false
                hints: ["441 − 1 = 440. Then 4 more."]
              - id: l2-s5
                type: text_input
                text: "500 − 3 = _"
                answer: "497"
                hints: ["Back 3 from a whole hundred."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Jump back to the hundred first."
                frame: "904 − 9 = 904 − 4 − _ = _"
                options: ["5", "6", "895", "905"]
                answer: ["5", "895"]
              - id: l2-n2
                type: multiple_choice
                text: "601 − 4 = _"
                options: ["597", "603", "605"]
                answer: "597"
              - id: l2-n3
                type: text_input
                text: "577 + 8 = _"
                answer: "585"
              - id: l2-n4
                type: true_false
                text: "Is it true? 697 + 5 = 702"
                answer: true
              - id: l2-n5
                type: text_input
                text: "A book has 304 pages. Kai still has 7 pages to read. How many pages has he read?"
                answer: "297"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ones-add
            type: text_input
            text: "468 + 5 = _"
            answer: "473"
          - id: l2-c2
            part: tens
            type: multiple_choice
            text: "370 + 80 = _"
            options: ["450", "350", "3150"]
            answer: "450"
          - id: l2-c3
            part: tens
            type: text_input
            text: "710 − 30 = _"
            answer: "680"
          - id: l2-c4
            part: ones-sub
            type: multiple_choice
            text: "402 − 7 = _"
            options: ["395", "405", "409"]
            answer: "395"
          - id: l2-c5
            part: ones-add
            type: text_input
            text: "296 + 9 = _"
            answer: "305"
          - id: l2-c6
            part: tens
            type: text_input
            text: "260 + 70 = _"
            answer: "330"
          - id: l2-c7
            part: tens
            type: true_false
            text: "Is it true? 540 − 60 = 480"
            answer: true
          - id: l2-c8
            part: tens
            type: text_input
            text: "A bakery has 830 bread rolls. It sells 50 in the morning. How many rolls are left?"
            answer: "780"
          - id: l2-c9
            part: ones-add
            type: text_input
            text: "735 + 8 = _"
            answer: "743"
          - id: l2-c10
            part: ones-add
            type: multiple_choice
            text: "597 + 6 = _"
            options: ["603", "593", "613"]
            answer: "603"
          - id: l2-c11
            part: ones-add
            type: true_false
            text: "Is it true? 386 + 9 = 394"
            answer: false
          - id: l2-c12
            part: ones-sub
            type: text_input
            text: "324 − 6 = _"
            answer: "318"
          - id: l2-c13
            part: ones-sub
            type: multiple_choice
            text: "800 − 7 = _"
            options: ["793", "807", "703"]
            answer: "793"
          - id: l2-c14
            part: ones-sub
            type: true_false
            text: "Is it true? 561 − 4 = 557"
            answer: true
          - id: l2-c15
            part: ones-sub
            type: text_input
            text: "A school has 503 children. 6 are off sick today. How many children are at school?"
            answer: "497"
          - id: l2-c16
            part: steps
            type: fill_in_blank
            text: "Jump to the next hundred first."
            frame: "460 + 70 = 460 + 40 + _ = _"
            options: ["30", "40", "530", "570"]
            answer: ["30", "530"]
          - id: l2-c17
            part: steps
            type: fill_in_blank
            text: "Jump back to the hundred first."
            frame: "820 − 60 = 820 − 20 − _ = _"
            options: ["40", "20", "760", "780"]
            answer: ["40", "760"]
          - id: l2-c18
            part: steps
            type: fill_in_blank
            text: "Jump to the next ten first."
            frame: "376 + 8 = 376 + 4 + _ = _"
            options: ["4", "5", "384", "386"]
            answer: ["4", "384"]
          - id: l2-c19
            part: steps
            type: multiple_choice
            text: "506 − 9: which jump comes first?"
            show: { drawn: rechenstrich, start: 506, jumps: [], back: true }
            options: ["6", "9", "3"]
            answer: "6"
          - id: l2-c20
            part: steps
            type: multiple_choice
            text: "280 + 50. Which steps jump to the next hundred first?"
            options: ["280 + 20 + 30", "280 + 30 + 20", "280 + 25 + 25"]
            answer: "280 + 20 + 30"
