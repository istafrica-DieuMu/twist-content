# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.estimate-to-1000
skill: math.add-sub-to-1000.estimate
curriculum: en-GB
language: en
title:
  de: Überschlagen bis 1000
  en: Estimating answers to 1000
summary: >
  Estimating the answer to an addition or subtraction by rounding each
  number to the nearest hundred. Lesson 1 makes the estimate before
  calculating and picks the answer that could be right; lesson 2 checks
  answers against the estimate, finds calculations with a big mistake,
  learns that an estimate cannot catch a small one, and ends with the
  skill check.
metadata:
  year: year-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.round, math.add-sub-to-1000.semi-written]
  also_practises: [math.numbers-to-1000.round]
  vocabulary: { en: [estimate, about, round, nearest hundred, exact, check, fits] }
  forms: [text, audio]
  drawn: []
  facets: [currency]
  parts:
    - { id: estimate, what: { de: eine Plus- oder Minusaufgabe mit Hundertern überschlagen, en: estimating an addition or subtraction by rounding to the nearest hundred } }
    - { id: fits, what: { de: "das Ergebnis finden, das zum Überschlag passt", en: finding the answer that fits the estimate } }
    - { id: check, what: { de: mit dem Überschlag ein falsches Ergebnis finden, en: using an estimate to spot a wrong answer } }
    - { id: in-context, what: { de: Sachaufgaben überschlagen, en: estimating in word problems } }
  misconceptions:
    - id: rounds-wrong
      what: Rounds a number to the wrong hundred (278 to 200), or rounds only one of the numbers
      addressed: lesson 1 Learn rounds both numbers; the estimate frames l1-f2, l1-s2, l1-n2 and l2-c2 ask for each rounded number
    - id: wrong-operation
      what: Adds the rounded numbers when estimating a subtraction (823 − 297 is about 1100)
      addressed: l1-f3 has feedback on it; l1-f5, l1-n4, l1-c2 and l2-w2 offer the added estimate
    - id: estimate-is-proof
      what: Thinks an answer close to the estimate must be exactly right
      addressed: lesson 2 Learn says an estimate cannot catch a small mistake; l2-f5 (with feedback) and l2-n4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Vorher überschlagen, en: Estimate first }
    goal:
      de: "Überschlag vor dem Rechnen. Runde auf den nächsten Hunderter, dann ist 487 + 312 ungefähr 800."
      en: "Before you calculate, estimate. Round to the nearest hundred, so 487 + 312 is about 800."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Round 471 to the nearest hundred."
            options: ["400", "500", "470"]
            answer: "500"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "324 + 253 = _"
            answer: "577"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "487 + 312 is about 500 + 300 = 800"
            say: "Before you calculate, estimate. Round each number to the nearest hundred. Four hundred and eighty-seven is about five hundred. Three hundred and twelve is about three hundred. So the answer will be about eight hundred."
          - text: "487 + 312 = 799"
            say: "Now calculate. The exact answer is seven hundred and ninety-nine. That is close to eight hundred, so it makes sense."
          - text: "692 − 381 is about 700 − 400 = 300"
            say: "It works for subtracting too. Six hundred and ninety-two is about seven hundred. Three hundred and eighty-one is about four hundred. Seven hundred subtract four hundred: the answer will be about three hundred. The exact answer is three hundred and eleven."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Estimate: 389 + 412 is about _"
                options: ["600", "800", "900"]
                answer: "800"
                hints:
                  - "Round each number to the nearest hundred."
                  - "389 is about 400, and 412 is about 400."
                  - "400 + 400 = 800."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Estimate 615 + 278."
                say: "Estimate six hundred and fifteen add two hundred and seventy-eight. Round both numbers, then add."
                frame: "_ + _ = _"
                options: ["600", "300", "900", "700", "200"]
                answer: ["600", "300", "900"]
                hints:
                  - "Round each number to the nearest hundred."
                  - "615 is about 600. 278 has 7 tens, so it rounds up to 300."
                  - "600 + 300 = 900."
              - id: l1-f3
                type: multiple_choice
                text: "Estimate: 823 − 297 is about _"
                options: ["500", "600", "1100"]
                answer: "500"
                feedback:
                  "1100": "That is 800 + 300. This is a subtraction, so subtract the rounded numbers: 800 − 300."
                hints:
                  - "Round both numbers, then subtract."
                  - "823 is about 800, and 297 is about 300."
                  - "800 − 300 = 500."
              - id: l1-f4
                type: multiple_choice
                text: "Estimate first. Which answer could be right for 508 + 291?"
                options: ["799", "599", "999"]
                answer: "799"
                hints:
                  - "Estimate: round both numbers to the nearest hundred."
                  - "About 500 + 300, so the answer is about 800."
                  - "799 is close to 800."
              - id: l1-f5
                type: multiple_choice
                text: "Estimate: 746 − 512 is about _"
                options: ["200", "300", "1200"]
                answer: "200"
                hints:
                  - "Round both numbers, then subtract."
                  - "746 is about 700, and 512 is about 500."
                  - "700 − 500 = 200."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Estimate: 198 + 503 is about _"
                options: ["700", "600", "800"]
                answer: "700"
                hints: ["198 is about 200, and 503 is about 500."]
              - id: l1-s2
                type: fill_in_blank
                text: "Estimate 784 − 321."
                say: "Estimate seven hundred and eighty-four subtract three hundred and twenty-one. Round both numbers, then subtract."
                frame: "_ − _ = _"
                options: ["800", "300", "500", "700", "400"]
                answer: ["800", "300", "500"]
                hints: ["784 has 8 tens, so it rounds up."]
              - id: l1-s3
                type: multiple_choice
                text: "Estimate first. Which answer could be right for 612 − 189?"
                options: ["423", "223", "623"]
                answer: "423"
                hints: ["About 600 − 200."]
              - id: l1-s4
                type: multiple_choice
                text: "Estimate: 451 + 349 is about _"
                options: ["800", "700", "900"]
                answer: "800"
                hints: ["451 rounds to 500 and 349 rounds to 300."]
              - id: l1-s5
                type: multiple_choice
                text: "A school has 386 children. 213 of them go on a trip. About how many stay at school?"
                options: ["about 200", "about 100", "about 600"]
                answer: "about 200"
                hints: ["Round both numbers, then subtract: about 400 − 200."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Estimate: 279 + 608 is about _"
                options: ["900", "800", "1000"]
                answer: "900"
              - id: l1-n2
                type: fill_in_blank
                text: "Estimate 917 − 486."
                say: "Estimate nine hundred and seventeen subtract four hundred and eighty-six. Round both numbers, then subtract."
                frame: "_ − _ = _"
                options: ["900", "500", "400", "1400", "800"]
                answer: ["900", "500", "400"]
              - id: l1-n3
                type: multiple_choice
                text: "Estimate first. Which answer could be right for 395 + 401?"
                options: ["796", "596", "996"]
                answer: "796"
              - id: l1-n4
                type: multiple_choice
                text: "Estimate: 703 − 298 is about _"
                options: ["400", "500", "1000"]
                answer: "400"
              - id: l1-n5
                type: multiple_choice
                text: "Ben has saved £512. He buys a bike for £289. About how much money does he have left?"
                options: ["about £200", "about £300", "about £800"]
                answer: "about £200"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Estimate: 517 + 382 is about _"
            options: ["900", "800", "1000"]
            answer: "900"
          - id: l1-c2
            type: multiple_choice
            text: "Estimate: 864 − 427 is about _"
            options: ["500", "400", "1300"]
            answer: "500"
          - id: l1-c3
            type: multiple_choice
            text: "Estimate first. Which answer could be right for 287 + 405?"
            options: ["692", "492", "892"]
            answer: "692"
          - id: l1-c4
            type: fill_in_blank
            text: "Estimate 591 + 213."
            say: "Estimate five hundred and ninety-one add two hundred and thirteen."
            frame: "_ + _ = _"
            options: ["600", "200", "800", "500", "700"]
            answer: ["600", "200", "800"]
          - id: l1-c5
            type: multiple_choice
            text: "Estimate: 678 − 205 is about _"
            options: ["500", "400", "900"]
            answer: "500"
          - id: l1-c6
            type: multiple_choice
            text: "Estimate first. Which answer could be right for 803 − 498?"
            options: ["305", "505", "105"]
            answer: "305"

  - n: 2
    title: { de: Mit dem Überschlag prüfen, en: Checking with an estimate }
    goal:
      de: "Finde große Fehler mit einem Überschlag. 364 + 418 kann nicht 582 sein, denn es sind ungefähr 800."
      en: "Use an estimate to catch a big mistake. 364 + 418 cannot be 582, because it is about 800."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Estimate: 296 + 489 is about _"
            options: ["800", "700", "900"]
            answer: "800"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Estimate: 708 − 395 is about _"
            options: ["300", "400", "1100"]
            answer: "300"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lena: 364 + 418 = 582\nEstimate: 400 + 400 = 800"
            say: "Lena works out three hundred and sixty-four add four hundred and eighteen and gets five hundred and eighty-two. Check with an estimate: about four hundred add four hundred, so about eight hundred."
          - text: "582 is a long way from 800."
            say: "Five hundred and eighty-two is a long way from eight hundred, so Lena has made a mistake. She calculates again and gets seven hundred and eighty-two. That fits the estimate."
          - text: "781 is close to 800 as well."
            say: "An estimate shows you a big mistake. It cannot show a small one: seven hundred and eighty-one is close to eight hundred too, but it is wrong. To be sure, check with the inverse or calculate again."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Tom: 512 + 289 = 601. Does this fit the estimate 500 + 300 = 800?"
                answer: false
                hints:
                  - "Compare 601 with the estimate, 800."
                  - "601 is about 200 away from 800. That is too far."
                  - "No. The exact answer is 801."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Estimate each one. Which calculation is wrong?"
                options: ["405 + 298 = 503", "611 + 187 = 798", "352 + 246 = 598"]
                answer: "405 + 298 = 503"
                feedback:
                  "611 + 187 = 798": "That one fits: about 600 + 200 = 800."
                  "352 + 246 = 598": "That one fits: about 400 + 200 = 600."
                hints:
                  - "Estimate each calculation and compare."
                  - "405 + 298 is about 400 + 300 = 700."
                  - "405 + 298 = 503 is wrong. It should be 703."
              - id: l2-f3
                type: true_false
                text: "Mia: 834 − 279 = 555. Does this fit the estimate 800 − 300 = 500?"
                answer: true
                hints:
                  - "Compare 555 with 500."
                  - "555 is only 55 away from 500."
                  - "Yes, it fits."
              - id: l2-f4
                type: multiple_choice
                text: "Which answer fits the estimate for 693 − 214?"
                options: ["479", "279", "679"]
                answer: "479"
                hints:
                  - "Estimate: round both numbers to the nearest hundred."
                  - "About 700 − 200 = 500."
                  - "479 is close to 500."
              - id: l2-f5
                type: multiple_choice
                text: "Kai's answer is close to his estimate. What does that tell him?"
                options: ["The answer is about the right size.", "The answer is exactly right.", "He did not need to calculate."]
                answer: "The answer is about the right size."
                feedback:
                  "The answer is exactly right.": "An estimate cannot catch a small mistake. A wrong answer can be close to the estimate too."
                hints:
                  - "An estimate is a rough answer."
                  - "It tells you the size of the answer, but not each digit."
                  - "The answer is about the right size."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Sara: 476 + 315 = 691. Does this fit the estimate 500 + 300 = 800?"
                answer: false
                hints: ["Is 691 close to 800?"]
              - id: l2-s2
                type: multiple_choice
                text: "Estimate each one. Which calculation is wrong?"
                options: ["523 + 264 = 787", "318 + 409 = 927", "702 − 391 = 311"]
                answer: "318 + 409 = 927"
                hints: ["318 + 409 is about 300 + 400."]
              - id: l2-s3
                type: multiple_choice
                text: "Which answer fits the estimate for 588 + 307?"
                options: ["895", "695", "495"]
                answer: "895"
                hints: ["About 600 + 300."]
              - id: l2-s4
                type: true_false
                text: "Ali: 905 − 498 = 407. Does this fit the estimate 900 − 500 = 400?"
                answer: true
                hints: ["How far is 407 from 400?"]
              - id: l2-s5
                type: multiple_choice
                text: "A café sold 289 cakes on Saturday and 312 on Sunday. Jo says that is 401 cakes. Is Jo right?"
                options: ["No, it should be about 600.", "Yes, it is about 400.", "No, it should be about 900."]
                answer: "No, it should be about 600."
                hints: ["Estimate: about 300 + 300."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Leo: 627 + 248 = 875. Does this fit the estimate 600 + 200 = 800?"
                answer: true
              - id: l2-n2
                type: multiple_choice
                text: "Estimate each one. Which calculation is wrong?"
                options: ["816 − 293 = 523", "467 + 221 = 688", "754 − 349 = 205"]
                answer: "754 − 349 = 205"
              - id: l2-n3
                type: multiple_choice
                text: "Which answer fits the estimate for 911 − 588?"
                options: ["323", "523", "123"]
                answer: "323"
              - id: l2-n4
                type: true_false
                text: "Is it true? An estimate shows that 799 is a wrong answer for 412 + 386."
                answer: false
              - id: l2-n5
                type: text_input
                text: "Amir walks 345 m to school, then 257 m to the park. How far does he walk altogether? Estimate first, then calculate."
                answer: "602"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: estimate
            type: multiple_choice
            text: "Estimate: 397 + 216 is about _"
            options: ["600", "500", "700"]
            answer: "600"
          - id: l2-c2
            part: estimate
            type: fill_in_blank
            text: "Estimate 782 − 409."
            say: "Estimate seven hundred and eighty-two subtract four hundred and nine. Round both numbers, then subtract."
            frame: "_ − _ = _"
            options: ["800", "400", "700", "1200", "300"]
            answer: ["800", "400", "400"]
          - id: l2-c3
            part: check
            type: multiple_choice
            text: "Estimate each one. Which calculation is wrong?"
            options: ["614 + 279 = 893", "538 − 216 = 522", "401 + 395 = 796"]
            answer: "538 − 216 = 522"
          - id: l2-c4
            part: check
            type: true_false
            text: "Nia: 723 − 381 = 542. Does this fit the estimate 700 − 400 = 300?"
            answer: false
          - id: l2-c5
            part: fits
            type: multiple_choice
            text: "Which answer fits the estimate for 486 + 409?"
            options: ["895", "595", "395"]
            answer: "895"
          - id: l2-c6
            part: estimate
            type: multiple_choice
            text: "Estimate: 631 + 184 is about _"
            options: ["800", "700", "900"]
            answer: "800"
          - id: l2-c7
            part: estimate
            type: multiple_choice
            text: "Estimate: 958 − 612 is about _"
            options: ["400", "300", "500"]
            answer: "400"
          - id: l2-c8
            part: estimate
            type: fill_in_blank
            text: "Estimate 349 + 528."
            say: "Estimate three hundred and forty-nine add five hundred and twenty-eight."
            frame: "_ + _ = _"
            options: ["300", "400", "500", "800", "900"]
            answer: ["300", "500", "800"]
          - id: l2-c9
            part: fits
            type: multiple_choice
            text: "Estimate first. Which answer could be right for 296 + 518?"
            options: ["814", "414", "614"]
            answer: "814"
          - id: l2-c10
            part: fits
            type: multiple_choice
            text: "Which answer fits the estimate for 805 − 392?"
            options: ["413", "213", "613"]
            answer: "413"
          - id: l2-c11
            part: fits
            type: true_false
            text: "Is it true? 617 could be the answer to 912 − 495."
            say: "Six hundred and seventeen could be the answer to nine hundred and twelve subtract four hundred and ninety-five. Is that true?"
            answer: false
          - id: l2-c12
            part: fits
            type: true_false
            text: "Is it true? 796 could be the answer to 177 + 619."
            say: "Seven hundred and ninety-six could be the answer to one hundred and seventy-seven add six hundred and nineteen. Is that true?"
            answer: true
          - id: l2-c13
            part: check
            type: multiple_choice
            text: "Estimate each one. Which calculation is wrong?"
            options: ["209 + 594 = 803", "731 − 418 = 513", "386 + 307 = 693"]
            answer: "731 − 418 = 513"
          - id: l2-c14
            part: check
            type: true_false
            text: "Ivy: 268 + 431 = 699. Does this fit the estimate 300 + 400 = 700?"
            answer: true
          - id: l2-c15
            part: check
            type: true_false
            text: "Is it true? If an answer is close to the estimate, it must be exactly right."
            answer: false
          - id: l2-c16
            part: in-context
            type: multiple_choice
            text: "A theatre has 412 seats downstairs and 289 seats upstairs. About how many seats are there altogether?"
            options: ["about 700", "about 600", "about 100"]
            answer: "about 700"
          - id: l2-c17
            part: in-context
            type: multiple_choice
            text: "A farmer has 816 eggs. She sells 391 of them. About how many eggs are left?"
            options: ["about 400", "about 500", "about 300"]
            answer: "about 400"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "A class raised £583 at the summer fair and £204 at a bake sale. About how much did they raise altogether?"
            options: ["about £800", "about £700", "about £400"]
            answer: "about £800"
          - id: l2-c19
            part: in-context
            type: true_false
            text: "A book has 624 pages. Raj has read 215 of them. Is it true? About 400 pages are left."
            answer: true
          - id: l2-c20
            part: in-context
            type: text_input
            text: "Max walks 296 m to the shop, then 403 m to the park. Estimate how far he walks altogether. Type the estimate in metres."
            answer: "700"
