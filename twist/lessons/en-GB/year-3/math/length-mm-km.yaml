# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.length-mm-km
skill: math.length.mm-km
curriculum: en-GB
language: en
title:
  de: Millimeter und Kilometer
  en: Millimetres and kilometres
summary: >
  Lesson 1 reads strips on a ruler in centimetres and millimetres (4 cm
  5 mm = 45 mm), converts between cm and mm and picks mm for very small
  things; lesson 2 learns 1 km = 1000 m, converts between km and m (1 km
  200 m = 1200 m) and between m and cm, picks the unit that fits and
  estimates a walk (1 km takes about 15 minutes), and ends with the skill
  check. Drawing a line of a given length waits for a drawing task.
metadata:
  year: year-3
  topic: { de: Längen, en: Length }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.estimate, math.numbers-to-1000.place-value]
  also_practises: [math.length.cm-m]
  vocabulary: { en: [millimetre, mm, centimetre, cm, metre, m, kilometre, km, convert, about] }
  forms: [text, audio, drawn]
  drawn: [ruler]
  facets: [units]
  misconceptions:
    - id: cm-mm-joined
      what: Swaps the cm and mm digits (3 cm 7 mm read as 7 cm 3 mm or 37 cm), or thinks 1 cm = 100 mm
      addressed: lesson 1 Learn builds 45 mm from 40 mm and 5 mm; l1-f1 and l1-f2 have feedback, l1-s1, l1-n1, l1-n5, l1-c1 and l2-c1 offer the swapped or hundreds answer
    - id: km-as-hundred
      what: Thinks 1 km = 100 m, or writes 1 km 200 m as 120 m or 1020 m
      addressed: lesson 2 Learn builds 2500 m from 2000 m and 500 m; l2-f1 and l2-f3 have feedback, l2-s2, l2-n5, l2-c3 and l2-c4 offer the same mistakes
    - id: unit-sense
      what: Picks a unit that cannot fit (a football pitch 100 km long, an ant 3 cm long)
      addressed: lesson 1 Learn and lesson 2 Learn give everyday anchors; l1-f5, l1-s5, l1-c3, l2-f4, l2-n2 and l2-c5
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Zentimeter und Millimeter, en: Centimetres and millimetres }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How long is the strip?"
            show: { drawn: ruler, to: 10, length: 6 }
            options: ["6 cm", "7 cm", "5 cm"]
            answer: "6 cm"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is the 4 in 450 worth?"
            options: ["4", "40", "400"]
            answer: "400"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 cm = 10 mm"
            say: "Look between 0 and 1 on the ruler. There are ten tiny spaces. Each one is a millimetre. Ten millimetres make one centimetre."
            show: { drawn: ruler, to: 10, length: 1 }
          - text: "4 cm 5 mm = 40 mm + 5 mm = 45 mm"
            say: "This strip ends after four whole centimetres and five more small marks. Four centimetres are forty millimetres. Add five: forty-five millimetres."
            show: { drawn: ruler, to: 10, length: 4.5 }
          - text: "A grain of rice: about 5 mm\nA pencil: about 15 cm"
            say: "We use millimetres for very small things, like a grain of rice. Centimetres are good for a pencil or a book."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How long is the strip?"
                show: { drawn: ruler, to: 10, length: 3.7 }
                options: ["3 cm 7 mm", "7 cm 3 mm", "4 cm"]
                answer: "3 cm 7 mm"
                feedback:
                  "7 cm 3 mm": "The strip ends after 3 whole centimetres, then 7 small marks. The centimetres come first."
                hints:
                  - "First find the last whole centimetre the strip passes."
                  - "It passes 3 cm. Then count the small marks after 3."
                  - "3 cm and 7 mm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many millimetres are in 1 cm?"
                options: ["10", "100", "1000"]
                answer: "10"
                feedback:
                  "100": "Count the tiny spaces between 0 and 1 on a ruler. There are only 10."
                hints:
                  - "Think of the ruler between 0 and 1."
                  - "Count the tiny spaces between them."
                  - "There are 10. 1 cm = 10 mm."
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap."
                frame: "5 cm 2 mm = _ mm"
                options: ["7", "25", "52", "502"]
                answer: ["52"]
                hints:
                  - "Change the centimetres into millimetres first."
                  - "5 cm = 50 mm. Then add the 2 mm."
                  - "50 + 2 = 52 mm."
              - id: l1-f4
                type: text_input
                text: "6 cm = _ mm"
                answer: "60"
                hints:
                  - "Each centimetre is 10 mm."
                  - "6 lots of 10 mm."
                  - "60 mm."
              - id: l1-f5
                type: multiple_choice
                text: "Which is best measured in millimetres?"
                options: ["the length of an ant", "the length of a bus", "the height of a door"]
                answer: "the length of an ant"
                hints:
                  - "Millimetres are for very small things."
                  - "Which of these would fit on your fingernail?"
                  - "The ant."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many millimetres long is the strip?"
                show: { drawn: ruler, to: 10, length: 6.4 }
                options: ["64", "46", "10"]
                answer: "64"
                hints: ["6 cm is 60 mm. Then count the small marks."]
              - id: l1-s2
                type: text_input
                text: "80 mm = _ cm"
                answer: "8"
                hints: ["Every 10 mm make 1 cm."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill the gaps."
                frame: "37 mm = _ cm _ mm"
                options: ["3", "7", "30", "70"]
                answer: ["3", "7"]
                hints: ["30 mm make 3 cm."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 9 cm is longer than 85 mm."
                answer: true
                hints: ["Change 9 cm into millimetres first."]
              - id: l1-s5
                type: multiple_choice
                text: "About how long is a ladybird?"
                options: ["about 7 mm", "about 7 cm", "about 7 m"]
                answer: "about 7 mm"
                hints: ["A ladybird fits on your fingertip."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How long is the strip?"
                show: { drawn: ruler, to: 10, length: 8.2 }
                options: ["82 mm", "28 mm", "8 mm"]
                answer: "82 mm"
              - id: l1-n2
                type: text_input
                text: "12 cm = _ mm"
                answer: "120"
              - id: l1-n3
                type: multiple_choice
                text: "Which is the longest?"
                options: ["45 mm", "5 cm", "4 cm"]
                answer: "5 cm"
              - id: l1-n4
                type: text_input
                text: "A pencil is 14 cm 5 mm long. How many millimetres is that?"
                answer: "145"
              - id: l1-n5
                type: true_false
                text: "Is it true? 1 cm = 100 mm."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How long is the strip?"
            show: { drawn: ruler, to: 10, length: 5.6 }
            options: ["5 cm 6 mm", "6 cm 5 mm", "56 cm"]
            answer: "5 cm 6 mm"
          - id: l1-c2
            type: text_input
            text: "4 cm 3 mm = _ mm"
            answer: "43"
          - id: l1-c3
            type: multiple_choice
            text: "Which unit fits? A 1p coin is about 20 _ across."
            options: ["mm", "cm", "m"]
            answer: "mm"

  - n: 2
    title: { de: Meter und Kilometer, en: Metres and kilometres }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "3 cm = _ mm"
            answer: "30"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many centimetres are in 1 metre?"
            options: ["100", "10", "1000"]
            answer: "100"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 km = 1000 m"
            say: "A kilometre is a long way: one thousand metres. Walking one kilometre takes about fifteen minutes."
          - text: "2 km 500 m = 2000 m + 500 m = 2500 m"
            say: "Two kilometres are two thousand metres. Add the five hundred metres: two thousand five hundred metres."
          - text: "10 mm = 1 cm\n100 cm = 1 m\n1000 m = 1 km"
            say: "Ten millimetres make a centimetre. One hundred centimetres make a metre. One thousand metres make a kilometre."
          - text: "A bee: about 15 mm\nA door: about 2 m high\nTo the next town: a few km"
            say: "Pick the unit that fits. A bee is about fifteen millimetres long. A door is about two metres high. The next town is a few kilometres away."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many metres are in 1 km?"
                options: ["1000", "100", "10"]
                answer: "1000"
                feedback:
                  "100": "100 m is only the length of a football pitch. A kilometre is 1000 m."
                hints:
                  - "Kilo means a thousand."
                  - "A kilogram is 1000 grams. A kilometre works the same way."
                  - "1 km = 1000 m."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "3 km = _ m"
                options: ["3000", "300", "30"]
                answer: "3000"
                hints:
                  - "Each kilometre is 1000 m."
                  - "3 lots of 1000 m."
                  - "3000 m."
              - id: l2-f3
                type: multiple_choice
                text: "1 km 200 m = _ m"
                options: ["1200", "120", "1020"]
                answer: "1200"
                feedback:
                  "120": "1 km is 1000 m on its own. Add 200 m to 1000 m."
                  "1020": "The 200 m are two hundreds, so they go in the hundreds place: 1000 + 200."
                hints:
                  - "Change the kilometre into metres first."
                  - "1 km = 1000 m. Then add 200 m."
                  - "1000 + 200 = 1200 m."
              - id: l2-f4
                type: multiple_choice
                text: "Which unit fits? From your house to the next town is about 5 _."
                options: ["mm", "m", "km"]
                answer: "km"
                hints:
                  - "Is it a short way or a long way?"
                  - "You would go by car or bus, not just a few steps."
                  - "About 5 km."
              - id: l2-f5
                type: text_input
                text: "2 m = _ cm"
                answer: "200"
                hints:
                  - "1 m is 100 cm."
                  - "2 lots of 100 cm."
                  - "200 cm."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Fill the gaps."
                frame: "4500 m = _ km _ m"
                options: ["4", "5", "45", "500"]
                answer: ["4", "500"]
                hints: ["4000 m make 4 km."]
              - id: l2-s2
                type: multiple_choice
                text: "2 km 50 m = _ m"
                options: ["2050", "2500", "250"]
                answer: "2050"
                hints: ["50 m has no hundreds: 2000 + 50."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 500 m is half a kilometre."
                answer: true
                hints: ["What is half of 1000?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which is the longest?"
                options: ["1 km", "900 m", "990 m"]
                answer: "1 km"
                hints: ["Change 1 km into metres."]
              - id: l2-s5
                type: multiple_choice
                text: "About how long does it take to walk 1 km?"
                options: ["about 15 minutes", "about 15 seconds", "about 15 hours"]
                answer: "about 15 minutes"
                hints: ["1 km is about the walk from one end of a village to the other."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "Ella runs 2 km 300 m. How many metres is that?"
                answer: "2300"
              - id: l2-n2
                type: multiple_choice
                text: "Which unit fits? A football pitch is about 100 _ long."
                options: ["mm", "m", "km"]
                answer: "m"
              - id: l2-n3
                type: multiple_choice
                text: "The path round the park is 500 m long. Zara walks round it twice. How far does she walk?"
                options: ["1 km", "100 m", "5 km"]
                answer: "1 km"
              - id: l2-n4
                type: text_input
                text: "A skipping rope is 3 m long. How many centimetres is that?"
                answer: "300"
              - id: l2-n5
                type: true_false
                text: "Is it true? 1 km 5 m = 1500 m."
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "How many millimetres long is the strip?"
            show: { drawn: ruler, to: 10, length: 7.3 }
            options: ["73", "37", "703"]
            answer: "73"
          - id: l2-c2
            type: text_input
            text: "9 cm = _ mm"
            answer: "90"
          - id: l2-c3
            type: multiple_choice
            text: "4 km = _ m"
            options: ["4000", "400", "40"]
            answer: "4000"
          - id: l2-c4
            type: multiple_choice
            text: "3 km 400 m = _ m"
            options: ["3400", "340", "3040"]
            answer: "3400"
          - id: l2-c5
            type: multiple_choice
            text: "Which unit fits? A paper clip is about 3 _ long."
            show: { object: paper-clip }
            options: ["mm", "cm", "m"]
            answer: "cm"
