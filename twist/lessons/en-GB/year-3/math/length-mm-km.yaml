# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.length-mm-km
skill: math.length.mm-km
curriculum: en-GB
language: en
title:
  de: Millimeter, Zentimeter und Meter
  en: Millimetres, centimetres and metres
summary: >
  Lesson 1 reads strips on a ruler in centimetres and millimetres (4 cm
  5 mm = 45 mm), converts between cm and mm and picks mm for very small
  things; lesson 2 converts between m and cm (1 m 40 cm = 140 cm),
  compares lengths in mm and cm, picks mm, cm or m for a thing, meets the
  word kilometre once for long distances, and ends with the skill check.
  Converting kilometres waits for Year 4. Drawing a line of a given
  length waits for a drawing task.
metadata:
  year: year-3
  topic: { de: Längen, en: Length }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.estimate, math.numbers-to-1000.place-value]
  also_practises: [math.length.cm-m]
  vocabulary: { en: [millimetre, mm, centimetre, cm, metre, m, kilometre, convert, about] }
  forms: [text, audio, drawn]
  drawn: [ruler]
  facets: [units]
  parts:
    - { id: read, what: { de: Längen in cm und mm am Lineal ablesen, en: reading lengths in centimetres and millimetres on a ruler } }
    - { id: cm-mm, what: { de: zwischen cm und mm umrechnen, en: converting between cm and mm } }
    - { id: m-cm, what: { de: zwischen m und cm umrechnen, en: converting between m and cm } }
    - { id: compare, what: { de: Längen in verschiedenen Einheiten vergleichen, en: comparing lengths in different units } }
    - { id: unit, what: { de: eine passende Einheit wählen, en: choosing a sensible unit } }
  misconceptions:
    - id: cm-mm-joined
      what: Swaps the cm and mm digits (3 cm 7 mm read as 7 cm 3 mm or 37 cm), or thinks 1 cm = 100 mm
      addressed: lesson 1 Learn builds 45 mm from 40 mm and 5 mm; l1-f1 and l1-f2 have feedback, l1-s1, l1-n1, l1-n5, l1-c1 and l2-c1 offer the swapped or hundreds answer
    - id: metre-as-ten
      what: Thinks 1 m = 10 cm or 1000 cm, or writes 1 m 60 cm as 106 cm or 1060 cm
      addressed: lesson 2 Learn builds 140 cm from 100 cm and 40 cm; l2-f1 and l2-f2 have feedback, l2-s1, l2-n5, l2-c3 and l2-c4 offer the same mistakes
    - id: bigger-number-longer
      what: Compares the numbers and not the lengths (58 mm longer than 6 cm)
      addressed: lesson 2 Learn says to change into the same unit first; l2-f3 has feedback, l2-s2, l2-s4 and l1-n3 compare mixed units
    - id: unit-sense
      what: Picks a unit that cannot fit (a football pitch 100 cm long, an ant 3 cm long)
      addressed: lesson 1 Learn and lesson 2 Learn give everyday anchors; l1-f5, l1-s5, l1-c3, l2-f4, l2-s5, l2-n2 and l2-c5
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Zentimeter und Millimeter, en: Centimetres and millimetres }
    goal:
      de: "Miss kleine Dinge in Millimetern. 10 Millimeter sind 1 Zentimeter, also sind 4 Zentimeter und 5 Millimeter genau 45 Millimeter."
      en: "Measure small things in millimetres. 10 millimetres make 1 centimetre, so 4 centimetres and 5 millimetres is 45 millimetres."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How long is the strip?"
            show: { drawn: ruler, to: 10, length: 6 }
            options: ["6 cm", "7 cm", "5 cm"]
            answer: "6 cm"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is the 4 in 450 worth?"
            options: ["4", "40", "400"]
            answer: "400"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "How many tiny spaces are between 0 and 1?"
            say: "Look at the ruler between nought and one. Do you think there are five tiny spaces, ten, or one hundred? Have a guess."
            show: { drawn: ruler, to: 10, length: 1 }
          - text: "1 cm = 10 mm"
            say: "Let's count. Between 0 and 1 on the ruler there are ten tiny spaces. Each one is a millimetre. Ten millimetres make one centimetre."
            show: { drawn: ruler, to: 10, length: 1 }
          - text: "4 cm 5 mm = 40 mm + 5 mm = 45 mm"
            say: "This strip ends after four whole centimetres and five more small marks. Four centimetres are forty millimetres. Add five: forty-five millimetres."
            show: { drawn: ruler, to: 10, length: 4.5 }
          - text: "A grain of rice: about 5 mm\nA pencil: about 15 cm"
            say: "We use millimetres for very small things, like a grain of rice. Centimetres are good for a pencil or a book."
          - text: "Did you know? Your fingernails grow about 3 mm a month."
            say: "Did you know? Your fingernails grow about three millimetres every month. That is too slow to see from one day to the next, but after a month you can measure it!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How long is the strip?"
                show: { drawn: ruler, to: 10, length: 3.7 }
                options: ["3 cm 7 mm", "7 cm 3 mm", "4 cm"]
                answer: "3 cm 7 mm"
                feedback:
                  "7 cm 3 mm": "The strip ends after 3 whole centimetres, then 7 small marks. The centimetres come first."
                hints:
                  - "First find the last whole centimetre the strip passes."
                  - "It passes 3 cm. Then count the small marks after 3."
                  - "3 cm and 7 mm."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "1 cm = _ mm"
                say: "How many millimetres are in one centimetre?"
                answer: "10"
                feedback:
                  "100": "Count the tiny spaces between 0 and 1 on a ruler. There are only 10."
                hints:
                  - "Think of the ruler between 0 and 1."
                  - "Count the tiny spaces between them."
                  - "There are 10. 1 cm = 10 mm."
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap."
                frame: "5 cm 2 mm = _ mm"
                options: ["7", "25", "52", "502"]
                answer: ["52"]
                hints:
                  - "Change the centimetres into millimetres first."
                  - "5 cm = 50 mm. Then add the 2 mm."
                  - "50 + 2 = 52 mm."
              - id: l1-f4
                type: text_input
                text: "6 cm = _ mm"
                answer: "60"
                hints:
                  - "Each centimetre is 10 mm."
                  - "6 lots of 10 mm."
                  - "60 mm."
              - id: l1-f5
                type: multiple_choice
                text: "Which is best measured in millimetres?"
                options: ["the length of an ant", "the length of a bus", "the height of a door"]
                answer: "the length of an ant"
                hints:
                  - "Millimetres are for very small things."
                  - "Which of these would fit on your fingernail?"
                  - "The ant."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many millimetres long is the strip?"
                show: { drawn: ruler, to: 10, length: 6.4 }
                options: ["64", "46", "10"]
                answer: "64"
                hints: ["6 cm is 60 mm. Then count the small marks."]
              - id: l1-s2
                type: text_input
                text: "80 mm = _ cm"
                answer: "8"
                hints: ["Every 10 mm make 1 cm."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill the gaps."
                frame: "37 mm = _ cm _ mm"
                options: ["3", "7", "30", "70"]
                answer: ["3", "7"]
                hints: ["30 mm make 3 cm."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 9 cm is longer than 85 mm."
                answer: true
                hints: ["Change 9 cm into millimetres first."]
              - id: l1-s5
                type: multiple_choice
                text: "About how long is a ladybird?"
                options: ["about 7 mm", "about 7 cm", "about 7 m"]
                answer: "about 7 mm"
                hints: ["A ladybird fits on your fingertip."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How long is the strip?"
                show: { drawn: ruler, to: 10, length: 8.2 }
                options: ["82 mm", "28 mm", "8 mm"]
                answer: "82 mm"
              - id: l1-n2
                type: text_input
                text: "12 cm = _ mm"
                answer: "120"
              - id: l1-n3
                type: multiple_choice
                text: "Which is the longest?"
                options: ["45 mm", "5 cm", "4 cm"]
                answer: "5 cm"
              - id: l1-n4
                type: text_input
                text: "A pencil is 14 cm 5 mm long. How many millimetres is that?"
                answer: "145"
              - id: l1-n5
                type: true_false
                text: "Is it true? 1 cm = 100 mm."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How long is the strip?"
            show: { drawn: ruler, to: 10, length: 5.6 }
            options: ["5 cm 6 mm", "6 cm 5 mm", "56 cm"]
            answer: "5 cm 6 mm"
          - id: l1-c2
            type: text_input
            text: "4 cm 3 mm = _ mm"
            answer: "43"
          - id: l1-c3
            type: multiple_choice
            text: "Which unit fits? A 1p coin is about 20 _ across."
            options: ["mm", "cm", "m"]
            answer: "mm"
          - id: l1-c4
            type: text_input
            text: "How many millimetres long is the strip?"
            show: { drawn: ruler, to: 10, length: 1.9 }
            answer: "19"
          - id: l1-c5
            type: true_false
            text: "Is it true? 7 cm 1 mm = 71 mm"
            say: "Seven centimetres and one millimetre is seventy-one millimetres. Is that true?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which of these is about 1 cm wide?"
            options: ["a child's fingernail", "a book", "a table"]
            answer: "a child's fingernail"

  - n: 2
    title: { de: Zentimeter und Meter, en: Centimetres and metres }
    goal:
      de: "Rechne Meter in Zentimeter um, so wie 1 Meter 40 sind 140 Zentimeter, und wähle die passende Einheit für eine Länge."
      en: "Change metres into centimetres, like 1 metre 40 is 140 centimetres, and pick the right unit for a length."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "3 cm = _ mm"
            answer: "30"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many centimetres are in 1 metre?"
            options: ["100", "10", "1000"]
            answer: "100"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 m 40 cm = _ cm\n104 or 140?"
            say: "One metre and forty centimetres. How many centimetres do you think that is: one hundred and four, or one hundred and forty? Have a guess."
          - text: "1 m = 100 cm"
            say: "Let's find out. A metre stick is one hundred centimetres long. A big step is about one metre."
          - text: "1 m 40 cm = 100 cm + 40 cm = 140 cm"
            say: "One metre and forty centimetres. One metre is one hundred centimetres. Add the forty: one hundred and forty centimetres."
          - text: "10 mm = 1 cm\n100 cm = 1 m"
            say: "Ten millimetres make a centimetre. One hundred centimetres make a metre. To compare two lengths, change them into the same unit first."
          - text: "A bee: about 15 mm\nA pencil: about 15 cm\nA door: about 2 m high"
            say: "Pick the unit that fits. A bee is about fifteen millimetres long. A pencil is about fifteen centimetres long. A door is about two metres high."
          - text: "To the next town: kilometres"
            say: "Long distances, like the way to the next town, are measured in kilometres. You will learn more about kilometres next year."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many centimetres are in 2 m?"
                options: ["200", "20", "2000"]
                answer: "200"
                feedback:
                  "20": "1 m is 100 cm, not 10 cm. 2 m is 100 cm + 100 cm = 200 cm."
                hints:
                  - "How many centimetres are in 1 m?"
                  - "Each metre is 100 cm: 100 cm + 100 cm."
                  - "200 cm."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "1 m 60 cm = _ cm"
                answer: "160"
                feedback:
                  "106": "60 cm are six tens, so they go in the tens place: 100 + 60."
                  "1060": "1 m is 100 cm, not 1000 cm. 100 + 60 = 160."
                hints:
                  - "Change the metre into centimetres first."
                  - "1 m = 100 cm. Then add 60 cm."
                  - "100 + 60 = 160 cm."
              - id: l2-f3
                type: multiple_choice
                text: "Which is longer: 6 cm or 58 mm?"
                options: ["6 cm", "58 mm"]
                answer: "6 cm"
                keep_order: true
                feedback:
                  "58 mm": "58 is a bigger number, but the units are different. 6 cm = 60 mm, and 60 mm is longer than 58 mm."
                hints:
                  - "Change both lengths into the same unit."
                  - "6 cm = 60 mm."
                  - "60 mm is longer than 58 mm, so 6 cm is longer."
              - id: l2-f4
                type: multiple_choice
                text: "Which unit fits? A classroom is about 8 _ long."
                options: ["mm", "cm", "m"]
                answer: "m"
                hints:
                  - "Is a classroom longer than a pencil?"
                  - "You could walk across it in a few big steps."
                  - "About 8 m."
              - id: l2-f5
                type: fill_in_blank
                text: "Fill the gaps."
                frame: "250 cm = _ m _ cm"
                options: ["2", "5", "25", "50"]
                answer: ["2", "50"]
                hints:
                  - "Every 100 cm make 1 m."
                  - "200 cm make 2 m. How many centimetres are left?"
                  - "2 m 50 cm."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "4 m 5 cm = _ cm"
                options: ["405", "450", "45"]
                answer: "405"
                hints: ["5 cm has no tens: 400 + 5."]
              - id: l2-s2
                type: multiple_choice
                text: "Which is the shortest?"
                options: ["1 m", "95 cm", "99 cm"]
                answer: "95 cm"
                hints: ["Change 1 m into centimetres."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 50 cm is half a metre."
                answer: true
                hints: ["What is half of 100?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which is the longest?"
                options: ["65 mm", "7 cm", "68 mm"]
                answer: "7 cm"
                hints: ["Change 7 cm into millimetres."]
              - id: l2-s5
                type: multiple_choice
                text: "About how long is a car?"
                show: { object: car }
                options: ["about 4 m", "about 4 cm", "about 4 mm"]
                answer: "about 4 m"
                hints: ["A car is longer than a bed."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "Ella jumps 1 m 25 cm. How many centimetres is that?"
                answer: "125"
              - id: l2-n2
                type: multiple_choice
                text: "Which unit fits? A football pitch is about 100 _ long."
                options: ["mm", "cm", "m"]
                answer: "m"
              - id: l2-n3
                type: multiple_choice
                text: "Zara has 2 ribbons. Each one is 50 cm long. How long are they together?"
                options: ["1 m", "100 mm", "10 m"]
                answer: "1 m"
              - id: l2-n4
                type: text_input
                text: "A skipping rope is 3 m long. How many centimetres is that?"
                answer: "300"
              - id: l2-n5
                type: true_false
                text: "Is it true? 1 m 5 cm = 150 cm."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "How many millimetres long is the strip?"
            show: { drawn: ruler, to: 10, length: 7.3 }
            options: ["73", "37", "703"]
            answer: "73"
          - id: l2-c2
            part: cm-mm
            type: text_input
            text: "9 cm = _ mm"
            answer: "90"
          - id: l2-c3
            part: m-cm
            type: multiple_choice
            text: "5 m = _ cm"
            options: ["500", "50", "5000"]
            answer: "500"
          - id: l2-c4
            part: m-cm
            type: multiple_choice
            text: "2 m 30 cm = _ cm"
            options: ["230", "203", "2030"]
            answer: "230"
          - id: l2-c5
            part: unit
            type: multiple_choice
            text: "Which unit fits? A paper clip is about 3 _ long."
            show: { object: paper-clip }
            options: ["mm", "cm", "m"]
            answer: "cm"
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "How long is the strip?"
            show: { drawn: ruler, to: 10, length: 2.8 }
            options: ["2 cm 8 mm", "8 cm 2 mm", "3 cm"]
            answer: "2 cm 8 mm"
          - id: l2-c7
            part: read
            type: text_input
            text: "How many millimetres long is the strip?"
            show: { drawn: ruler, to: 10, length: 9.1 }
            answer: "91"
          - id: l2-c8
            part: read
            type: true_false
            text: "Is it true? The strip is 6 cm 3 mm long."
            show: { drawn: ruler, to: 10, length: 3.6 }
            answer: false
          - id: l2-c9
            part: cm-mm
            type: fill_in_blank
            text: "Fill the gap."
            frame: "7 cm 8 mm = _ mm"
            options: ["15", "78", "87", "708"]
            answer: ["78"]
          - id: l2-c10
            part: cm-mm
            type: text_input
            text: "50 mm = _ cm"
            answer: "5"
          - id: l2-c11
            part: cm-mm
            type: true_false
            text: "Is it true? 26 mm = 2 cm 6 mm"
            say: "Twenty-six millimetres is two centimetres and six millimetres. Is that true?"
            answer: true
          - id: l2-c12
            part: m-cm
            type: true_false
            text: "Is it true? 3 m 70 cm = 370 cm"
            say: "Three metres seventy centimetres is three hundred and seventy centimetres. Is that true?"
            answer: true
          - id: l2-c13
            part: m-cm
            type: multiple_choice
            text: "108 cm = _"
            options: ["1 m 8 cm", "10 m 8 cm", "1 m 80 cm"]
            answer: "1 m 8 cm"
          - id: l2-c14
            part: compare
            type: ordering
            text: "Put the lengths in order, shortest first."
            options: ["5 cm", "55 mm", "6 cm", "42 mm"]
            slot_count: 4
            answer: ["42 mm", "5 cm", "55 mm", "6 cm"]
          - id: l2-c15
            part: compare
            type: multiple_choice
            text: "Which is the longest?"
            options: ["1 m 2 cm", "112 cm", "1 m 20 cm"]
            answer: "1 m 20 cm"
          - id: l2-c16
            part: compare
            type: true_false
            text: "Is it true? 30 mm is shorter than 4 cm."
            say: "Thirty millimetres is shorter than four centimetres. Is that true?"
            answer: true
          - id: l2-c17
            part: compare
            type: fill_in_blank
            text: "Which sign fits?"
            frame: "9 cm _ 89 mm"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c18
            part: unit
            type: multiple_choice
            text: "Which unit fits? A teaspoon is about 13 _ long."
            options: ["mm", "cm", "m"]
            answer: "cm"
          - id: l2-c19
            part: unit
            type: multiple_choice
            text: "About how tall is a giraffe?"
            options: ["about 5 m", "about 5 cm", "about 5 mm"]
            answer: "about 5 m"
          - id: l2-c20
            part: unit
            type: multiple_choice
            text: "Which is best measured in metres?"
            options: ["the length of a swimming pool", "the length of a crayon", "the width of a button"]
            answer: "the length of a swimming pool"
