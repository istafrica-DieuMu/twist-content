            show: { drawn: written-calc, rows: ["503", "167"], op: "-", result: "464" }
            options: ["The smaller digit was taken from the bigger one.", "The numbers were added.", "A carried 1 was forgotten."]
            answer: "The smaller digit was taken from the bigger one."
          - id: l2-c6
            part: estimate
            type: multiple_choice
            text: "Estimate to check. Which answer fits 412 + 395?"
            show: { drawn: written-calc, rows: ["412", "395"], op: "+" }
            options: ["807", "607", "1007"]
            answer: "807"
          - id: l2-c7
            part: estimate
            type: true_false
            text: "Does 181 fit the estimate 800 − 300 = 500?"
            show: { drawn: written-calc, rows: ["826", "345"], op: "-", result: "181" }
