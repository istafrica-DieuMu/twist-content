# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.written-check
skill: math.written-add-sub.check
curriculum: en-GB
language: en
title:
  de: Schriftliche Rechnungen prüfen
  en: Checking column calculations
summary: >
  Checking a column addition or subtraction. Lesson 1 estimates with
  numbers rounded to the nearest hundred and spots answers that are far
  off; lesson 2 checks exactly with the inverse, names the common mistakes
  (a carried digit forgotten, the smaller digit taken from the bigger one, a
  column not made smaller after an exchange, a short number lined up on
  the left), and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.sub-regroup, math.add-sub-to-1000.estimate]
  also_practises: [math.written-add-sub.add-carry, math.written-add-sub.sub-regroup]
  vocabulary: { en: [check, estimate, inverse, mistake, carried digit, exchange, line up] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: [written-subtraction]
  parts:
    - { id: estimate, what: { de: "mit einem Überschlag prüfen, ob ein Ergebnis passt", en: checking with an estimate whether an answer fits } }
    - { id: inverse, what: { de: mit der Umkehraufgabe die Probe machen, en: checking with the inverse calculation } }
    - { id: mistakes, what: { de: typische Fehler in schriftlichen Rechnungen finden, en: finding common mistakes in column calculations } }
  misconceptions:
    - id: trusts-any-answer
      what: Accepts a column answer without asking whether it is the right size
      addressed: lesson 1 Learn shows an answer far from its estimate; every stage of lesson 1 asks whether an answer fits (l1-f2, l1-s2, l1-n4) and which calculation is wrong (l1-f5, l1-s3, l1-n5, l1-c3, l2-c1)
    - id: inverse-wrong-start
      what: Checks a subtraction by adding to the first number (715 + 368) instead of to the answer
      addressed: lesson 2 Learn adds the answer and the number taken away; l2-f1 has feedback on it; l2-s1, l2-n1 and l2-c2 ask again
    - id: cannot-name-mistake
      what: Sees that an answer is wrong but cannot say which step went wrong
      addressed: lesson 2 Learn lists the four common mistakes; a forgotten carry in l2-f2 (with feedback) and l2-n2, a short number on the left in l2-f4 and l2-n4, the swapped digits in l2-s2 and l2-c5, a column not made smaller in l2-s4 and l2-c3
    - id: wrong-operation
      what: Adds when the calculation asks to subtract
      addressed: l1-f3 and l1-n3 show an added answer to a subtraction
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Mit dem Überschlag prüfen, en: Checking with an estimate }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Subtract in columns."
            say: "Subtract three hundred and fifty-eight from seven hundred and twenty-four in columns."
            show: { drawn: written-calc, rows: ["724", "358"], op: "-" }
            answer: "366"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Estimate: 489 + 307 is about _"
            options: ["800", "700", "900"]
            answer: "800"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "468 + 275 = 743\nEstimate: 500 + 300 = 800"
            say: "Here is a column addition. Before you trust the answer, check it. First estimate: four hundred and sixty-eight is about five hundred, and two hundred and seventy-five is about three hundred. So the answer should be about eight hundred. Seven hundred and forty-three is close, so it is about the right size."
            show: { drawn: written-calc, rows: ["468", "275"], op: "+", carry: "11 ", result: "743" }
          - text: "Kim: 652 − 287 = 939\nEstimate: 700 − 300 = 400"
            say: "Kim works out six hundred and fifty-two subtract two hundred and eighty-seven and gets nine hundred and thirty-nine. The estimate is about four hundred. Nine hundred and thirty-nine is a long way off, so something has gone wrong. Kim added instead of subtracting."
            show: { drawn: written-calc, rows: ["652", "287"], op: "-", result: "939" }
          - text: "An estimate catches big mistakes."
            say: "An estimate shows you when an answer is far too big or far too small. An answer close to the estimate can still be a little wrong. To be sure, you check exactly with the inverse."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Estimate to check. Which answer fits 386 + 412?"
                show: { drawn: written-calc, rows: ["386", "412"], op: "+" }
                options: ["798", "498", "1198"]
                answer: "798"
                hints:
                  - "Round both numbers to the nearest hundred."
                  - "About 400 + 400, so about 800."
                  - "798 is close to 800."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Does 563 fit the estimate 700 − 300 = 400?"
                show: { drawn: written-calc, rows: ["731", "268"], op: "-", result: "563" }
                answer: false
                hints:
                  - "Compare 563 with 400."
                  - "563 is more than 150 away from 400. That is too far."
                  - "No. The answer should be 463."
              - id: l1-f3
                type: multiple_choice
                text: "The estimate is 500 − 400 = 100. Which mistake could make the answer this far off?"
                show: { drawn: written-calc, rows: ["524", "361"], op: "-", result: "885" }
                options: ["The numbers were added.", "One column was not exchanged.", "A carried 1 was forgotten."]
                answer: "The numbers were added."
                feedback:
                  "One column was not exchanged.": "That would make a small mistake. 885 is far bigger than both numbers, so they were added: 524 + 361 = 885."
                hints:
                  - "Is 885 bigger or smaller than 524?"
                  - "A subtraction answer is smaller than the first number. 885 is bigger."
                  - "The numbers were added."
              - id: l1-f4
                type: true_false
                text: "Does 902 fit the estimate 600 + 300 = 900?"
                show: { drawn: written-calc, rows: ["594", "308"], op: "+", result: "902" }
                answer: true
                hints:
                  - "Compare 902 with 900."
                  - "902 is only 2 away from 900."
                  - "Yes, it fits."
              - id: l1-f5
                type: multiple_choice
                text: "Estimate each one. Which calculation is wrong?"
                options: ["623 − 289 = 534", "475 + 318 = 793", "806 − 412 = 394"]
                answer: "623 − 289 = 534"
                feedback:
                  "475 + 318 = 793": "That one fits: about 500 + 300 = 800."
                  "806 − 412 = 394": "That one fits: about 800 − 400 = 400."
                hints:
                  - "Estimate each calculation and compare."
                  - "623 − 289 is about 600 − 300 = 300."
                  - "623 − 289 = 534 is wrong. It should be 334."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Estimate to check. Which answer fits 715 − 293?"
                show: { drawn: written-calc, rows: ["715", "293"], op: "-" }
                options: ["422", "622", "1008"]
                answer: "422"
                hints: ["About 700 − 300."]
              - id: l1-s2
                type: true_false
                text: "Does 371 fit the estimate 400 + 400 = 800?"
                show: { drawn: written-calc, rows: ["353", "418"], op: "+", result: "371" }
                answer: false
                hints: ["Is 371 close to 800?"]
              - id: l1-s3
                type: multiple_choice
                text: "Estimate each one. Which calculation is wrong?"
                options: ["518 + 274 = 792", "941 − 385 = 656", "267 + 409 = 676"]
                answer: "941 − 385 = 656"
                hints: ["941 − 385 is about 900 − 400."]
              - id: l1-s4
                type: true_false
                text: "Does 437 fit the estimate 800 − 400 = 400?"
                show: { drawn: written-calc, rows: ["815", "378"], op: "-", result: "437" }
                answer: true
                hints: ["How far is 437 from 400?"]
              - id: l1-s5
                type: multiple_choice
                text: "Rosie works out 498 + 315 in columns and gets 513. What should she think?"
                options: ["It is far from 500 + 300 = 800, so I will check again.", "It is right, because it is more than 498.", "It is close enough."]
                answer: "It is far from 500 + 300 = 800, so I will check again."
                hints: ["Estimate: about 500 + 300."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Estimate to check. Which answer fits 287 + 596?"
                show: { drawn: written-calc, rows: ["287", "596"], op: "+" }
                options: ["883", "683", "1083"]
                answer: "883"
              - id: l1-n2
                type: true_false
                text: "Does 539 fit the estimate 900 − 400 = 500?"
                show: { drawn: written-calc, rows: ["923", "384"], op: "-", result: "539" }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "The estimate is 700 − 200 = 500. Which mistake could make the answer this far off?"
                show: { drawn: written-calc, rows: ["671", "245"], op: "-", result: "916" }
                options: ["The numbers were added.", "One column was not exchanged.", "A carried 1 was forgotten."]
                answer: "The numbers were added."
              - id: l1-n4
                type: true_false
                text: "Does 1053 fit the estimate 300 + 500 = 800?"
                show: { drawn: written-calc, rows: ["346", "507"], op: "+", result: "1053" }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Estimate each one. Which calculation is wrong?"
                options: ["704 − 296 = 408", "389 + 245 = 834", "562 + 137 = 699"]
                answer: "389 + 245 = 834"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Estimate to check. Which answer fits 602 − 389?"
            show: { drawn: written-calc, rows: ["602", "389"], op: "-" }
            options: ["213", "413", "991"]
            answer: "213"
          - id: l1-c2
            type: true_false
            text: "Does 761 fit the estimate 500 + 300 = 800?"
            show: { drawn: written-calc, rows: ["472", "289"], op: "+", result: "761" }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Estimate each one. Which calculation is wrong?"
            options: ["835 − 417 = 618", "256 + 381 = 637", "690 − 245 = 445"]
            answer: "835 − 417 = 618"
          - id: l1-c4
            type: true_false
            text: "Does 165 fit the estimate 800 − 400 = 400?"
            show: { drawn: written-calc, rows: ["812", "447"], op: "-", result: "165" }
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Estimate to check. Which answer fits 253 + 419?"
            show: { drawn: written-calc, rows: ["253", "419"], op: "+" }
            options: ["672", "472", "872"]
            answer: "672"
          - id: l1-c6
            type: multiple_choice
            text: "About how big should the answer to 708 − 291 be?"
            options: ["about 400", "about 1000", "about 200"]
            answer: "about 400"

  - n: 2
    title: { de: "Umkehraufgabe und typische Fehler", en: "The inverse and common mistakes" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Does 622 fit the estimate 500 + 400 = 900?"
            show: { drawn: written-calc, rows: ["453", "369"], op: "+", result: "622" }
            answer: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Estimate to check. Which answer fits 784 − 412?"
            options: ["372", "572", "1196"]
            answer: "372"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "536 − 278 = 258\nCheck: 258 + 278 = 536"
            say: "To check a subtraction exactly, use the inverse. Add the answer and the number you took away. Two hundred and fifty-eight add two hundred and seventy-eight is five hundred and thirty-six. That is the number you started with, so the subtraction is right."
            show: { drawn: written-calc, rows: ["258", "278"], op: "+", carry: "11 ", result: "536" }
          - text: "374 + 459 = 833\nCheck: 833 − 459 = 374"
            say: "To check an addition, take one of the numbers away from the answer. Eight hundred and thirty-three subtract four hundred and fifty-nine is three hundred and seventy-four. That is the other number, so the addition is right."
          - text: "Look for these mistakes:\na carried digit not added\nthe smaller digit taken from the bigger one\na column not made smaller after an exchange\na short number lined up on the left"
            say: "When a check fails, look for the common mistakes: a carried digit that was not added, the smaller digit taken from the bigger one, a column that was not made smaller after an exchange, and a short number lined up on the left instead of the right."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which calculation checks 715 − 368 = 347?"
                options: ["347 + 368 = 715", "715 + 368 = 1083", "368 − 347 = 21"]
                answer: "347 + 368 = 715"
                feedback:
                  "715 + 368 = 1083": "The check starts with the answer. Add the answer and the number you took away: 347 + 368."
                hints:
                  - "The inverse of subtracting is adding."
                  - "Add the answer, 347, and the number taken away, 368."
                  - "347 + 368 = 715."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What went wrong?"
                say: "Someone worked out four hundred and sixty-eight add two hundred and fifty-seven and got seven hundred and fifteen. What went wrong?"
                show: { drawn: written-calc, rows: ["468", "257"], op: "+", result: "715" }
                options: ["A carried 1 was not added to the tens.", "The ones are wrong.", "The numbers were subtracted."]
                answer: "A carried 1 was not added to the tens."
                feedback:
                  "The ones are wrong.": "8 + 7 = 15, so the 5 in the ones is right. But the ten from 15 was not added to the tens."
                hints:
                  - "Check each column, starting with the ones."
                  - "8 + 7 = 15: write 5 and carry 1. Tens: 1 + 6 + 5 = 12."
                  - "The carried 1 was forgotten. The answer is 725."
              - id: l2-f3
                type: true_false
                text: "642 − 375 = 267. Check with 267 + 375. Is the answer right?"
                answer: true
                hints:
                  - "Work out 267 + 375."
                  - "Do you get back to 642?"
                  - "Yes. 267 + 375 = 642."
              - id: l2-f4
                type: multiple_choice
                text: "What went wrong?"
                say: "Someone worked out eight hundred and twenty-three subtract forty-six and got three hundred and sixty-three. What went wrong?"
                show: { drawn: written-calc, rows: ["823", "46"], op: "-", result: "363" }
                options: ["46 was lined up on the left.", "The numbers were added.", "A carried 1 was forgotten."]
                answer: "46 was lined up on the left."
                hints:
                  - "823 − 46 takes away less than 50. Is 363 far too small?"
                  - "363 is 823 − 460. The 6 of 46 should be under the 3."
                  - "46 was lined up on the left. The answer is 777."
              - id: l2-f5
                type: fill_in_blank
                text: "Ali: 703 − 284 = 419. Check with the inverse."
                say: "Ali works out seven hundred and three subtract two hundred and eighty-four and gets four hundred and nineteen. Fill in the check."
                frame: "_ + 284 = _"
                options: ["419", "703", "284", "987"]
                answer: ["419", "703"]
                hints:
                  - "Start the check with Ali's answer."
                  - "Add the answer and the number taken away. You should get the first number back."
                  - "419 + 284 = 703."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which calculation checks 526 + 389 = 915?"
                options: ["915 − 389 = 526", "915 + 389 = 1304", "526 − 389 = 137"]
                answer: "915 − 389 = 526"
                hints: ["Take one number away from the answer."]
              - id: l2-s2
                type: multiple_choice
                text: "What went wrong?"
                say: "Someone worked out six hundred and four subtract two hundred and fifty-eight and got four hundred and fifty-four. What went wrong?"
                show: { drawn: written-calc, rows: ["604", "258"], op: "-", result: "454" }
                options: ["The smaller digit was taken from the bigger one.", "The numbers were added.", "A carried 1 was forgotten."]
                answer: "The smaller digit was taken from the bigger one."
                hints: ["Ones: 4 on top and 8 underneath. What should happen?"]
              - id: l2-s3
                type: true_false
                text: "381 + 446 = 727. Check with 727 − 446. Is the answer right?"
                answer: false
                hints: ["Work out 727 − 446. Do you get 381?"]
              - id: l2-s4
                type: multiple_choice
                text: "What went wrong?"
                say: "Someone worked out seven hundred and fifty-two subtract three hundred and eighteen and got four hundred and forty-four. What went wrong?"
                show: { drawn: written-calc, rows: ["752", "318"], op: "-", above: " 41", cross: " x ", result: "444" }
                options: ["In the tens, 5 was used instead of 4.", "The ones are wrong.", "The numbers were added."]
                answer: "In the tens, 5 was used instead of 4."
                hints: ["How many tens are left after the exchange?"]
              - id: l2-s5
                type: text_input
                text: "Jo works out 900 − 365 = 535. Check with the inverse: 535 + 365 = _"
                answer: "900"
                hints: ["If Jo is right, you get back to the first number."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which calculation checks 834 − 497 = 337?"
                options: ["337 + 497 = 834", "834 + 497 = 1331", "497 − 337 = 160"]
                answer: "337 + 497 = 834"
              - id: l2-n2
                type: multiple_choice
                text: "What went wrong?"
                say: "Someone worked out two hundred and seventy-six add five hundred and forty-eight and got seven hundred and fourteen. What went wrong?"
                show: { drawn: written-calc, rows: ["276", "548"], op: "+", result: "714" }
                options: ["The carried digits were not added.", "The ones are wrong.", "The numbers were subtracted."]
                answer: "The carried digits were not added."
              - id: l2-n3
                type: true_false
                text: "913 − 456 = 457. Check with 457 + 456. Is the answer right?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "What went wrong?"
                say: "Someone worked out five hundred and sixty-seven add thirty-two and got eight hundred and eighty-seven. What went wrong?"
                show: { drawn: written-calc, rows: ["567", "32"], op: "+", result: "887" }
                options: ["32 was lined up on the left.", "A carried 1 was forgotten.", "The numbers were subtracted."]
                answer: "32 was lined up on the left."
              - id: l2-n5
                type: text_input
                text: "Max works out 645 + 278 = 923. Check with the inverse: 923 − 278 = _"
                answer: "645"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: estimate
            type: multiple_choice
            text: "Estimate each one. Which calculation is wrong?"
            options: ["517 + 286 = 603", "904 − 438 = 466", "345 + 229 = 574"]
            answer: "517 + 286 = 603"
          - id: l2-c2
            part: inverse
            type: multiple_choice
            text: "Which calculation checks 621 − 354 = 267?"
            options: ["267 + 354 = 621", "621 + 354 = 975", "354 − 267 = 87"]
            answer: "267 + 354 = 621"
          - id: l2-c3
            part: mistakes
            type: multiple_choice
            text: "What went wrong?"
            say: "Someone worked out nine hundred and forty-one subtract five hundred and twenty-six and got four hundred and twenty-five. What went wrong?"
            show: { drawn: written-calc, rows: ["941", "526"], op: "-", above: " 31", cross: " x ", result: "425" }
            options: ["In the tens, 4 was used instead of 3.", "The ones are wrong.", "The numbers were added."]
            answer: "In the tens, 4 was used instead of 3."
          - id: l2-c4
