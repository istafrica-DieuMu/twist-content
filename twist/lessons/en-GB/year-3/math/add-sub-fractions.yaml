# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.add-sub-fractions
skill: math.fractions.add-sub-same-denominator
curriculum: en-GB
language: en
title:
  de: Brüche mit gleichem Nenner addieren und subtrahieren
  en: Adding and subtracting fractions
summary: >
  Lesson 1 adds fractions with the same denominator within one whole on a
  fraction bar (2/5 + 1/5 = 3/5): the parts stay the same size, so only the
  top numbers are added and 3/7 + 4/7 makes 7/7, one whole. Lesson 2
  subtracts them (5/7 − 2/7 = 3/7), takes a fraction away from one whole
  (1 − 3/8 = 5/8), checks a subtraction with an addition, solves problems
  about pizzas, ribbons and books, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.fractions.compare]
  also_practises: [math.fractions.compare]
  vocabulary: { en: [fraction, numerator, denominator, add, subtract, take away, one whole, left] }
  forms: [text, audio, drawn]
  drawn: [fraction]
  facets: []
  parts:
    - { id: add, what: { de: Brüche mit gleichem Nenner addieren, en: adding fractions with the same denominator } }
    - { id: subtract, what: { de: Brüche mit gleichem Nenner subtrahieren, en: subtracting fractions with the same denominator } }
    - { id: whole, what: { de: ein Ganzes ergänzen und von einem Ganzen subtrahieren, en: making one whole and taking a fraction away from one whole } }
    - { id: in-context, what: { de: Sachaufgaben mit Brüchen, en: word problems with fractions } }
  misconceptions:
    - id: adds-denominators
      what: Adds the bottom numbers too (2/5 + 1/5 = 3/10), or takes them away (4/5 − 1/5 = 3/0)
      addressed: lesson 1 Learn screen 3 and lesson 2 Learn screen 2; l1-f1, l1-f3 and l2-f1 have feedback, l1-s1, l1-s3, l1-s4, l1-n2, l1-n3, l1-c1, l2-s1, l2-c1 and l2-c3 offer the mistake
    - id: whole-as-one-part
      what: Does not see one whole as 8/8 or 5/5, so cannot take a fraction away from 1
      addressed: lesson 1 Learn screen 4 and lesson 2 Learn screen 3; l1-f4, l1-s5, l1-n4, l2-f3, l2-s3, l2-n4, l2-n5 and l2-c4
    - id: inverse-unseen
      what: Does not check a subtraction with the matching addition
      addressed: lesson 2 Learn screen 4; l2-f5 and l2-s5
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Brüche addieren, en: Adding fractions }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is greater, 2/5 or 4/5?"
            say: "Which is greater, two fifths or four fifths?"
            options: ["4/5", "2/5"]
            answer: "4/5"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What fraction is red?"
            show: { drawn: fraction, kind: bar, parts: 6, shaded: 4 }
            options: ["4/6", "4/2", "2/6"]
            answer: "4/6"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "2/5"
            say: "Two fifths of the bar is red."
            show: { drawn: fraction, kind: bar, parts: 5, shaded: 2 }
          - text: "2/5 + 1/5 = 3/5"
            say: "Colour one more fifth. Two fifths and one fifth make three fifths. The parts are still fifths, so the bottom number stays the same. Add the top numbers."
            show: { drawn: fraction, kind: bar, parts: 5, shaded: 3 }
          - text: "2/5 + 1/5 is not 3/10."
            say: "Do not add the bottom numbers. The bar is still cut into five parts, not ten."
          - text: "3/7 + 4/7 = 7/7 = 1 whole"
            say: "Three sevenths and four sevenths make seven sevenths. All the parts are coloured: that is one whole."
            show: { drawn: fraction, kind: bar, parts: 7, shaded: 7 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1/4 + 2/4 = ?"
                say: "What is one quarter add two quarters?"
                show: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }
                options: ["3/4", "3/8", "2/4"]
                answer: "3/4"
                option_audio: false
                feedback:
                  "3/8": "The parts are still quarters. Add only the top numbers."
                hints:
                  - "Both fractions are quarters."
                  - "1 quarter and 2 more quarters."
                  - "3 quarters: 3/4."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fill the gap."
                frame: "2/6 + 3/6 = _/6"
                options: ["5", "6", "1"]
                answer: ["5"]
                hints:
                  - "The bottom number stays 6."
                  - "Add the top numbers: 2 + 3."
                  - "5, so 5/6."
              - id: l1-f3
                type: multiple_choice
                text: "3/8 + 4/8 = ?"
                say: "What is three eighths add four eighths?"
                options: ["7/8", "7/16", "1/8"]
                answer: "7/8"
                option_audio: false
                feedback:
                  "7/16": "You added the bottom numbers too. The parts are still eighths."
                hints:
                  - "Are the parts the same size?"
                  - "Yes, all eighths. Add 3 and 4."
                  - "7 eighths: 7/8."
              - id: l1-f4
                type: multiple_choice
                text: "2/5 + 3/5 = ?"
                say: "What is two fifths add three fifths?"
                options: ["5/5", "5/10", "1/5"]
                answer: "5/5"
                option_audio: false
                hints:
                  - "Add the top numbers. The bottom number stays."
                  - "2 + 3 = 5 fifths."
                  - "5/5, which is one whole."
              - id: l1-f5
                type: text_input
                text: "1/10 + 6/10 = _/10"
                say: "One tenth add six tenths. How many tenths is that?"
                answer: "7"
                hints:
                  - "The bottom number stays 10."
                  - "Add the top numbers: 1 + 6."
                  - "7 tenths."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "1/3 + 1/3 = ?"
                say: "What is one third add one third?"
                options: ["2/3", "2/6", "1/3"]
                answer: "2/3"
                option_audio: false
                hints: ["The parts stay thirds."]
              - id: l1-s2
                type: fill_in_blank
                text: "Fill the gap."
                frame: "4/9 + 3/9 = _/9"
                options: ["7", "1", "18"]
                answer: ["7"]
                hints: ["Add the top numbers."]
              - id: l1-s3
                type: multiple_choice
                text: "5/7 + 1/7 = ?"
                say: "What is five sevenths add one seventh?"
                options: ["6/7", "6/14", "4/7"]
                answer: "6/7"
                option_audio: false
                hints: ["The bottom number stays 7."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 1/4 + 1/4 = 2/8"
                say: "Is it true? One quarter add one quarter is two eighths."
                answer: false
                hints: ["Two quarters are still quarters."]
              - id: l1-s5
                type: multiple_choice
                text: "Which sum makes one whole?"
                options: ["3/6 + 3/6", "3/6 + 2/6", "1/6 + 1/6"]
                answer: "3/6 + 3/6"
                option_audio: false
                hints: ["One whole is 6/6."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "2/8 + 5/8 = _/8"
                say: "Two eighths add five eighths. How many eighths is that?"
                answer: "7"
              - id: l1-n2
                type: multiple_choice
                text: "4/10 + 3/10 = ?"
                say: "What is four tenths add three tenths?"
                options: ["7/10", "7/20", "1/10"]
                answer: "7/10"
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Mum eats 2/8 of a pie. Dad eats 3/8 of the same pie. How much of the pie do they eat together?"
                say: "Mum eats two eighths of a pie. Dad eats three eighths of the same pie. How much of the pie do they eat together?"
                options: ["5/8", "5/16", "1/8"]
                answer: "5/8"
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Fill the gap to make one whole."
                frame: "_/5 + 2/5 = 5/5"
                options: ["3", "2", "7"]
                answer: ["3"]
              - id: l1-n5
                type: true_false
                text: "Is it true? 3/7 + 4/7 = 1"
                say: "Is it true? Three sevenths add four sevenths is one whole."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "1/5 + 2/5 = ?"
            say: "What is one fifth add two fifths?"
            options: ["3/5", "3/10", "2/5"]
            answer: "3/5"
            option_audio: false
          - id: l1-c2
            type: text_input
            text: "3/9 + 5/9 = _/9"
            say: "Three ninths add five ninths. How many ninths is that?"
            answer: "8"
          - id: l1-c3
            type: multiple_choice
            text: "2/4 + 2/4 = ?"
            say: "What is two quarters add two quarters?"
            options: ["4/4", "4/8", "2/4"]
            answer: "4/4"
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Is it true? 2/6 + 2/6 = 4/12"
            say: "Is it true? Two sixths add two sixths is four twelfths."
            answer: false
          - id: l1-c5
            type: fill_in_blank
            text: "Fill the gap."
            say: "How many tenths are missing? Fill the gap."
            frame: "_/10 + 5/10 = 9/10"
            options: ["4", "14", "5"]
            answer: ["4"]
          - id: l1-c6
            type: multiple_choice
            text: "Kim paints 5/8 of a wall on Monday and 2/8 of the wall on Tuesday. How much of the wall has she painted?"
            say: "Kim paints five eighths of a wall on Monday and two eighths of the wall on Tuesday. How much of the wall has she painted?"
            options: ["7/8", "7/16", "3/8"]
            answer: "7/8"
            option_audio: false

  - n: 2
    title: { de: Brüche subtrahieren, en: Subtracting fractions }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "2/6 + 1/6 = ?"
            say: "What is two sixths add one sixth?"
            options: ["3/6", "3/12", "1/6"]
            answer: "3/6"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "4/8 + 3/8 = _/8"
            say: "Four eighths add three eighths. How many eighths is that?"
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5/7"
            say: "Five sevenths of the bar is red."
            show: { drawn: fraction, kind: bar, parts: 7, shaded: 5 }
          - text: "5/7 − 2/7 = 3/7"
            say: "Take two sevenths away. Three sevenths are left. The parts are still sevenths, so the bottom number stays the same. Take away the top numbers."
            show: { drawn: fraction, kind: bar, parts: 7, shaded: 3 }
          - text: "1 = 8/8, so 1 − 3/8 = 5/8"
            say: "One whole is eight eighths. Take away three eighths and five eighths are left."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 8 }
          - text: "Check by adding: 3/7 + 2/7 = 5/7"
            say: "You can check a subtraction by adding. Three sevenths add the two sevenths you took away make five sevenths again."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "4/5 − 1/5 = ?"
                say: "What is four fifths take away one fifth?"
                show: { drawn: fraction, kind: bar, parts: 5, shaded: 4 }
                options: ["3/5", "3/0", "5/5"]
                answer: "3/5"
                option_audio: false
                feedback:
                  "3/0": "The parts are still fifths. Take away only the top numbers."
                  "5/5": "You added. Take one fifth away."
                hints:
                  - "Start with 4 red fifths."
                  - "Take 1 fifth away. How many fifths are left?"
                  - "3 fifths: 3/5."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Fill the gap."
                frame: "6/8 − 2/8 = _/8"
                options: ["4", "8", "0"]
                answer: ["4"]
                hints:
                  - "The bottom number stays 8."
                  - "Take away the top numbers: 6 − 2."
                  - "4, so 4/8."
              - id: l2-f3
                type: multiple_choice
                text: "1 − 1/4 = ?"
                say: "What is one whole take away one quarter?"
                options: ["3/4", "1/4", "0/4"]
                answer: "3/4"
                option_audio: false
                hints:
                  - "Write one whole as quarters."
                  - "1 = 4/4. Take away 1/4."
                  - "4/4 − 1/4 = 3/4."
              - id: l2-f4
                type: text_input
                text: "9/10 − 4/10 = _/10"
                say: "Nine tenths take away four tenths. How many tenths are left?"
                answer: "5"
                hints:
                  - "The bottom number stays 10."
                  - "Take away the top numbers: 9 − 4."
                  - "5 tenths."
              - id: l2-f5
                type: multiple_choice
                text: "Which calculation checks 5/7 − 2/7 = 3/7?"
                say: "Which calculation checks this subtraction?"
                options: ["3/7 + 2/7 = 5/7", "3/7 − 2/7 = 1/7", "5/7 + 2/7 = 7/7"]
                answer: "3/7 + 2/7 = 5/7"
                option_audio: false
                hints:
                  - "Check a take away with an add."
                  - "Add what you took away to what is left."
                  - "3/7 + 2/7 = 5/7."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "5/6 − 4/6 = ?"
                say: "What is five sixths take away four sixths?"
                options: ["1/6", "1/0", "9/6"]
                answer: "1/6"
                option_audio: false
                hints: ["The bottom number stays 6."]
              - id: l2-s2
                type: fill_in_blank
                text: "Fill the gap."
                frame: "7/9 − 3/9 = _/9"
                options: ["4", "10", "0"]
                answer: ["4"]
                hints: ["7 − 3."]
              - id: l2-s3
                type: multiple_choice
                text: "1 − 2/5 = ?"
                say: "What is one whole take away two fifths?"
                options: ["3/5", "2/5", "1/5"]
                answer: "3/5"
                option_audio: false
                hints: ["1 = 5/5."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 6/7 − 2/7 = 4/7"
                say: "Is it true? Six sevenths take away two sevenths is four sevenths."
                answer: true
                hints: ["Take away the top numbers."]
              - id: l2-s5
                type: fill_in_blank
                text: "Fill the gap."
                frame: "3/8 + _/8 = 7/8"
                options: ["4", "10", "5"]
                answer: ["4"]
                hints: ["How many eighths from 3 to 7?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A pizza is cut into 8 equal slices. Tom eats 3/8 of it. How much of the pizza is left?"
                say: "A pizza is cut into eight equal slices. Tom eats three eighths of it. How much of the pizza is left?"
                options: ["5/8", "3/8", "11/8"]
                answer: "5/8"
                option_audio: false
              - id: l2-n2
                type: text_input
                text: "Lily has 7/10 of a bottle of water. She drinks 4/10 of the bottle. How many tenths are left?"
                say: "Lily has seven tenths of a bottle of water. She drinks four tenths of the bottle. How many tenths are left?"
                answer: "3"
              - id: l2-n3
                type: multiple_choice
                text: "A ribbon is cut into 5 equal pieces. Sam uses 2/5 of it and Zoe uses 2/5. How much of the ribbon is used?"
                say: "A ribbon is cut into five equal pieces. Sam uses two fifths of it and Zoe uses two fifths. How much of the ribbon is used?"
                options: ["4/5", "4/10", "1/5"]
                answer: "4/5"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? 1 − 1/3 = 1/3"
                say: "Is it true? One whole take away one third is one third."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Jo has read 2/6 of her book. How much of the book is left to read?"
                say: "Jo has read two sixths of her book. How much of the book is left to read?"
                options: ["4/6", "2/6", "8/6"]
                answer: "4/6"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: multiple_choice
            text: "2/7 + 3/7 = ?"
            say: "What is two sevenths add three sevenths?"
            options: ["5/7", "5/14", "1/7"]
            answer: "5/7"
            option_audio: false
          - id: l2-c2
            part: add
            type: text_input
            text: "2/9 + 6/9 = _/9"
            say: "Two ninths add six ninths. How many ninths is that?"
            answer: "8"
          - id: l2-c3
            part: subtract
            type: multiple_choice
            text: "5/9 − 3/9 = ?"
            say: "What is five ninths take away three ninths?"
            options: ["2/9", "2/0", "8/9"]
            answer: "2/9"
            option_audio: false
          - id: l2-c4
            part: whole
            type: multiple_choice
            text: "1 − 3/5 = ?"
            say: "What is one whole take away three fifths?"
            options: ["2/5", "3/5", "4/5"]
            answer: "2/5"
            option_audio: false
          - id: l2-c5
            part: in-context
            type: multiple_choice
            text: "Max eats 1/6 of a cake. Ana eats 4/6 of the same cake. How much of the cake do they eat together?"
            say: "Max eats one sixth of a cake. Ana eats four sixths of the same cake. How much of the cake do they eat together?"
            options: ["5/6", "5/12", "3/6"]
            answer: "5/6"
            option_audio: false
          - id: l2-c6
            part: add
            type: text_input
            text: "3/10 + 4/10 = _"
            say: "Three tenths add four tenths. Type the answer as a fraction."
            keyboard: fraction
            answer: "7/10"
          - id: l2-c7
            part: add
            type: true_false
            text: "Is it true? 2/9 + 4/9 = 6/18"
            say: "Is it true? Two ninths add four ninths is six eighteenths."
            answer: false
          - id: l2-c8
            part: add
            type: fill_in_blank
            text: "Fill the gap."
            say: "How many eighths are missing? Fill the gap."
            frame: "1/8 + _/8 = 6/8"
            options: ["5", "7", "14"]
            answer: ["5"]
          - id: l2-c9
            part: subtract
            type: text_input
            text: "7/8 − 4/8 = _/8"
            say: "Seven eighths take away four eighths. How many eighths are left?"
            answer: "3"
          - id: l2-c10
            part: subtract
            type: multiple_choice
            text: "8/10 − 5/10 = ?"
            say: "What is eight tenths take away five tenths?"
            options: ["3/10", "3/0", "13/10"]
            answer: "3/10"
            option_audio: false
          - id: l2-c11
            part: subtract
            type: true_false
            text: "Is it true? 4/6 − 1/6 = 3/6"
            say: "Is it true? Four sixths take away one sixth is three sixths."
            answer: true
          - id: l2-c12
            part: subtract
            type: multiple_choice
            text: "Which calculation checks 6/9 − 4/9 = 2/9?"
            say: "Which calculation checks this subtraction? Six ninths take away four ninths is two ninths."
            options: ["2/9 + 4/9 = 6/9", "6/9 + 2/9 = 8/9", "4/9 − 2/9 = 2/9"]
            answer: "2/9 + 4/9 = 6/9"
            option_audio: false
          - id: l2-c13
            part: whole
            type: multiple_choice
            text: "1 − 5/8 = ?"
            say: "What is one whole take away five eighths?"
            options: ["3/8", "5/8", "4/8"]
            answer: "3/8"
            option_audio: false
          - id: l2-c14
            part: whole
            type: fill_in_blank
            text: "Fill the gap to make one whole."
            say: "How many sevenths are missing to make one whole? Fill the gap."
            frame: "4/7 + _/7 = 1"
            options: ["3", "4", "11"]
            answer: ["3"]
          - id: l2-c15
            part: whole
            type: true_false
            text: "Is it true? 1 − 4/9 = 5/9"
            say: "Is it true? One whole take away four ninths is five ninths."
            answer: true
          - id: l2-c16
            part: whole
            type: text_input
            text: "1 − 7/10 = _"
            say: "One whole take away seven tenths. Type the answer as a fraction."
            keyboard: fraction
            answer: "3/10"
          - id: l2-c17
            part: in-context
            type: multiple_choice
            text: "A chocolate bar has 10 equal pieces. Ella eats 3/10 of the bar and her brother eats 2/10. How much of the bar do they eat?"
            say: "A chocolate bar has ten equal pieces. Ella eats three tenths of the bar and her brother eats two tenths. How much of the bar do they eat?"
            options: ["5/10", "5/20", "1/10"]
            answer: "5/10"
            option_audio: false
          - id: l2-c18
            part: in-context
            type: text_input
            text: "5/6 of a cake is on the plate. Dad eats 2/6 of the cake. How many sixths of the cake are left?"
            say: "Five sixths of a cake is on the plate. Dad eats two sixths of the cake. How many sixths of the cake are left?"
            answer: "3"
          - id: l2-c19
            part: in-context
            type: multiple_choice
            text: "A jug is full of juice. Amy pours out 3/7 of the juice. How much juice is left in the jug?"
            say: "A jug is full of juice. Amy pours out three sevenths of the juice. How much juice is left in the jug?"
            options: ["4/7", "3/7", "10/7"]
            answer: "4/7"
            option_audio: false
          - id: l2-c20
            part: in-context
            type: true_false
            text: "Ben walks 2/5 of the way to school, then 2/5 more. Is it true? He still has 1/5 of the way to go."
            say: "Ben walks two fifths of the way to school, then two fifths more. He still has one fifth of the way to go. Is it true?"
            answer: true
