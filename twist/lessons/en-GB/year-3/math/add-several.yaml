            say: "Add three hundred and sixty-nine, one hundred and forty-seven and two hundred and fifty-eight in columns. Write the digit for the ones, the tens and the hundreds."
            show: { drawn: written-calc, rows: ["369", "147", "258"], op: "+", result: "___" }
