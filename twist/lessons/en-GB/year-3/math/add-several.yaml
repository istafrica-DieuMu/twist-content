# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.add-several
skill: math.written-add-sub.add-several
curriculum: en-GB
language: en
title:
  de: Mehrere Zahlen schriftlich addieren
  en: Adding three numbers in columns
summary: >
  Column addition with three numbers. Lesson 1 adds three three-digit
  numbers, carrying 1 where a column makes ten or more; lesson 2 adds
  numbers with different numbers of digits, lining up the ones, carries 2
  when a column makes twenty or more, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.add-carry]
  also_practises: [math.written-add-sub.add-carry, math.add-sub-to-20.add-bridge-10]
  vocabulary: { en: [column addition, three numbers, line up, exchange, carry, carry 2, total] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: [currency]
  misconceptions:
    - id: writes-column-total
      what: Writes the whole column total in the answer (16 in the ones column)
      addressed: lesson 1 Learn writes one digit and carries the ten; l1-f2 has feedback on it; l1-s4 and l1-c2 ask again
    - id: carries-one-always
      what: Carries 1 when a column makes twenty or more (22 ones, carries 1)
      addressed: lesson 2 Learn carries 2 from twenty ones; l2-f3 has feedback on it; l2-s3, l2-s4 and l2-c4 ask again
    - id: misalign-short-number
      what: Lines a shorter number up on the left
      addressed: lesson 2 Learn lines up all the ones; l2-f1 has feedback on it; l2-s1 and l2-n1 ask which digits share a column
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Drei dreistellige Zahlen, en: Three three-digit numbers }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Add in columns."
            say: "Add four hundred and fifty-six and two hundred and seventy-eight in columns."
            show: { drawn: written-calc, rows: ["456", "278"], op: "+" }
            answer: "734"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "7 + 8 + 6 = _"
            answer: "21"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "234 + 152 + 311"
            say: "You can add three numbers in columns too. Write them one under the other: ones under ones, tens under tens, hundreds under hundreds. Then add each column, starting with the ones."
            show: { drawn: written-calc, rows: ["234", "152", "311"], op: "+" }
          - text: "4 + 2 + 1 = 7\n3 + 5 + 1 = 9\n2 + 1 + 3 = 6"
            say: "Ones: four add two add one is seven. Tens: three add five add one is nine. Hundreds: two add one add three is six. The total is six hundred and ninety-seven."
            show: { drawn: written-calc, rows: ["234", "152", "311"], op: "+", result: "697" }
          - text: "136 + 245 + 172"
            say: "Here the ones make thirteen: six add five is eleven, and two more is thirteen. Write three and carry one ten. Tens: one add three add four add seven is fifteen. Write five and carry one hundred. Hundreds: one add one add two add one is five. The total is five hundred and fifty-three."
            show: { drawn: written-calc, rows: ["136", "245", "172"], op: "+", carry: "11 ", result: "553" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Add in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["213", "142", "324"], op: "+", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["9", "7", "6", "8"]
                answer: ["9", "7", "6"]
                hints:
                  - "Ones: 3 add 2 add 4."
                  - "Tens: 1 add 4 add 2. Hundreds: 2 add 1 add 3."
                  - "O: 9, T: 7, H: 6. The total is 679."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ones: 7 + 5 + 4 = 16. What do you write, and what do you carry?"
                show: { drawn: written-calc, rows: ["127", "235", "314"], op: "+" }
                options: ["write 6, carry 1", "write 1, carry 6", "write 16"]
                answer: "write 6, carry 1"
                feedback:
                  "write 16": "Only one digit fits in a column. 16 ones are 1 ten and 6 ones: write 6 and carry the ten."
                hints:
                  - "16 ones are more than ten."
                  - "16 ones are 1 ten and 6 ones."
                  - "Write 6 and carry 1."
              - id: l1-f3
                type: text_input
                text: "Add in columns."
                say: "Add one hundred and twenty-seven, two hundred and thirty-five and three hundred and fourteen in columns."
                show: { drawn: written-calc, rows: ["127", "235", "314"], op: "+" }
                answer: "676"
                hints:
                  - "Ones: 7 add 5 add 4 is 16. Write 6 and carry 1."
                  - "Tens: 1 add 2 add 3 add 1 is 7. Hundreds: 1 add 2 add 3."
                  - "676."
              - id: l1-f4
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["243", "118", "325"], op: "+", result: "686" }
                answer: true
                hints:
                  - "Ones: 3 add 8 add 5 is 16. Write 6 and carry 1."
                  - "Tens: 1 add 4 add 1 add 2 is 8. Hundreds: 2 add 1 add 3 is 6."
                  - "Yes, 686 is right."
              - id: l1-f5
                type: text_input
                text: "Three classes collect bottle tops. They collect 145, 232 and 118. How many bottle tops is that altogether?"
                answer: "495"
                hints:
                  - "Write the three numbers in columns, ones under ones."
                  - "Ones: 5 add 2 add 8 is 15. Write 5 and carry 1."
                  - "Tens: 1 add 4 add 3 add 1 is 9. The total is 495."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Add in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["321", "154", "213"], op: "+", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["8", "6", "7", "9"]
                answer: ["8", "8", "6"]
                hints: ["Ones: 1 add 4 add 3."]
              - id: l1-s2
                type: text_input
                text: "Add in columns."
                say: "Add one hundred and fifty-six, two hundred and twenty-three and four hundred and eight in columns."
                show: { drawn: written-calc, rows: ["156", "223", "408"], op: "+" }
                answer: "787"
                hints: ["Ones: 6 add 3 add 8 is 17."]
              - id: l1-s3
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["264", "135", "172"], op: "+", result: "561" }
                answer: false
                hints: ["Tens: did the carried 1 get added?"]
              - id: l1-s4
                type: multiple_choice
                text: "Ones: 9 + 6 + 3 = 18. What do you write, and what do you carry?"
                options: ["write 8, carry 1", "write 1, carry 8", "write 18"]
                answer: "write 8, carry 1"
                hints: ["18 ones are 1 ten and 8 ones."]
              - id: l1-s5
                type: text_input
                text: "A farm has 214 sheep, 136 cows and 125 goats. How many animals is that altogether?"
                answer: "475"
                hints: ["Ones: 4 add 6 add 5 is 15."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Add in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["402", "135", "251"], op: "+", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["8", "7", "6", "9"]
                answer: ["8", "8", "7"]
              - id: l1-n2
                type: text_input
                text: "Add in columns."
                say: "Add two hundred and thirty-eight, one hundred and forty-five and three hundred and sixteen in columns."
                show: { drawn: written-calc, rows: ["238", "145", "316"], op: "+" }
                answer: "699"
              - id: l1-n3
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["315", "247", "126"], op: "+", result: "688" }
                answer: true
              - id: l1-n4
                type: text_input
                text: "Add in columns."
                say: "Add one hundred and seventy-four, two hundred and sixty-three and one hundred and fifty-eight in columns."
                show: { drawn: written-calc, rows: ["174", "263", "158"], op: "+" }
                answer: "595"
              - id: l1-n5
                type: text_input
                text: "On a walk, Isla counts 128 steps, then 245 steps, then 316 steps. How many steps is that altogether?"
                answer: "689"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Add in columns."
            say: "Add one hundred and thirty-two, two hundred and forty-six and four hundred and fifteen in columns."
            show: { drawn: written-calc, rows: ["132", "246", "415"], op: "+" }
            answer: "793"
          - id: l1-c2
            type: multiple_choice
            text: "Ones: 8 + 7 + 4 = 19. What do you write, and what do you carry?"
            options: ["write 9, carry 1", "write 1, carry 9", "write 19"]
            answer: "write 9, carry 1"
          - id: l1-c3
            type: text_input
            text: "Add in columns."
            say: "Add two hundred and eleven, three hundred and forty-three and one hundred and twenty-five in columns."
            show: { drawn: written-calc, rows: ["211", "343", "125"], op: "+" }
            answer: "679"

  - n: 2
    title: { de: Kürzere Zahlen und Übertrag 2, en: Different lengths and carrying 2 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Add in columns."
            say: "Add two hundred and thirteen, one hundred and sixty-four and three hundred and twelve in columns."
            show: { drawn: written-calc, rows: ["213", "164", "312"], op: "+" }
            answer: "689"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ones: 4 + 8 + 5 = 17. What do you write, and what do you carry?"
            options: ["write 7, carry 1", "write 1, carry 7", "write 17"]
            answer: "write 7, carry 1"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "325 + 48 + 106"
            say: "Three hundred and twenty-five add forty-eight add one hundred and six. Forty-eight has only two digits. Line up all the ones on the right: the five, the eight and the six are in the same column."
            show: { drawn: written-calc, rows: ["325", "48", "106"], op: "+" }
          - text: "5 + 8 + 6 = 19"
            say: "Ones: five add eight add six is nineteen. Write nine and carry one. Tens: one add two add four add nothing is seven. Hundreds: three add one is four. The total is four hundred and seventy-nine."
            show: { drawn: written-calc, rows: ["325", "48", "106"], op: "+", carry: " 1 ", result: "479" }
          - text: "8 + 5 + 7 = 20"
            say: "Sometimes a column makes twenty or more. Eight add five add seven is twenty ones. That is two tens and no ones, so write zero and carry two. Tens: two add six add four add two is fourteen. Write four and carry one. Hundreds: one add two add one add three is seven. The total is seven hundred and forty."
            show: { drawn: written-calc, rows: ["268", "145", "327"], op: "+", carry: "12 ", result: "740" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "You add 413 + 52 + 7 in columns. Which digits are in the ones column?"
                options: ["3, 2 and 7", "3, 5 and 7", "4, 5 and 7"]
                answer: "3, 2 and 7"
                feedback:
                  "4, 5 and 7": "Line up the ones on the right. The ones digit of each number goes in the ones column: 3, 2 and 7."
                hints:
                  - "The ones digit is the last digit of each number."
                  - "413 ends in 3, 52 ends in 2, and 7 is all ones."
                  - "3, 2 and 7."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Add in columns. Remember the carried 1."
                show: { drawn: written-calc, rows: ["413", "52", "7"], op: "+", carry: " 1 ", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["2", "7", "4", "12"]
                answer: ["2", "7", "4"]
                hints:
                  - "Ones: 3 add 2 add 7 is 12. Write 2 and carry 1."
                  - "Tens: the carried 1, add 1, add 5. Hundreds: just the 4."
                  - "O: 2, T: 7, H: 4. The total is 472."
              - id: l2-f3
                type: multiple_choice
                text: "Ones: 9 + 7 + 6 = 22. What do you write, and what do you carry?"
                options: ["write 2, carry 2", "write 2, carry 1", "write 22"]
                answer: "write 2, carry 2"
                feedback:
                  "write 2, carry 1": "22 ones are 2 tens and 2 ones. Both tens move to the tens column, so you carry 2."
                hints:
                  - "How many tens are in 22?"
                  - "22 ones are 2 tens and 2 ones."
                  - "Write 2 and carry 2."
              - id: l2-f4
                type: text_input
                text: "Add in columns."
                say: "Add two hundred and fifty-nine, one hundred and thirty-seven and two hundred and forty-six in columns."
                show: { drawn: written-calc, rows: ["259", "137", "246"], op: "+" }
                answer: "642"
                hints:
                  - "Ones: 9 add 7 add 6 is 22. Write 2 and carry 2."
                  - "Tens: 2 add 5 add 3 add 4 is 14. Write 4 and carry 1."
                  - "Hundreds: 1 add 2 add 1 add 2 is 6. The total is 642."
              - id: l2-f5
                type: text_input
                text: "Add in columns."
                say: "Add five hundred and thirty-four, eighty-six and twenty-nine in columns."
                show: { drawn: written-calc, rows: ["534", "86", "29"], op: "+" }
                answer: "649"
                hints:
                  - "Ones: 4 add 6 add 9 is 19. Write 9 and carry 1."
                  - "Tens: 1 add 3 add 8 add 2 is 14. Write 4 and carry 1."
                  - "Hundreds: 1 add 5 is 6. The total is 649."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "You add 621 + 34 + 8 in columns. Which digits are in the tens column?"
                options: ["2 and 3", "2, 3 and 8", "6 and 3"]
                answer: "2 and 3"
                hints: ["8 is only ones. It has no tens digit."]
              - id: l2-s2
                type: text_input
                text: "Add in columns."
                say: "Add three hundred and forty-seven, sixty-five and eight in columns."
                show: { drawn: written-calc, rows: ["347", "65", "8"], op: "+" }
                answer: "420"
                hints: ["Ones: 7 add 5 add 8 is 20. Write 0 and carry 2."]
              - id: l2-s3
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["168", "157", "249"], op: "+", result: "564" }
                answer: false
                hints: ["Ones: 8 add 7 add 9 is 24. How many tens do you carry?"]
              - id: l2-s4
                type: multiple_choice
                text: "Ones: 8 + 6 + 9 = 23. What do you write, and what do you carry?"
                options: ["write 3, carry 2", "write 3, carry 1", "write 23"]
                answer: "write 3, carry 2"
                hints: ["23 ones are 2 tens and 3 ones."]
              - id: l2-s5
                type: text_input
                text: "Mum buys a coat for £125, shoes for £48 and a hat for £19. How many pounds does she spend?"
                answer: "192"
                hints: ["Ones: 5 add 8 add 9 is 22. Carry 2."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "You add 254 + 9 + 36 in columns. Which digits are in the ones column?"
                options: ["4, 9 and 6", "4, 9 and 3", "2, 9 and 3"]
                answer: "4, 9 and 6"
              - id: l2-n2
                type: text_input
                text: "Add in columns."
                say: "Add four hundred and seventy-six, one hundred and fifty-eight and two hundred and eighty-nine in columns."
                show: { drawn: written-calc, rows: ["476", "158", "289"], op: "+" }
                answer: "923"
              - id: l2-n3
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["408", "73", "15"], op: "+", result: "496" }
                answer: true
              - id: l2-n4
                type: text_input
                text: "Add in columns."
                say: "Add two hundred and thirty-six, ninety-seven and five in columns."
                show: { drawn: written-calc, rows: ["236", "97", "5"], op: "+" }
                answer: "338"
              - id: l2-n5
                type: text_input
                text: "A coach travels 186 km, then 57 km, then 129 km. How far does it travel altogether?"
                answer: "372"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Add in columns."
            say: "Add one hundred and forty-two, three hundred and twenty-five and two hundred and thirty-one in columns."
            show: { drawn: written-calc, rows: ["142", "325", "231"], op: "+" }
            answer: "698"
          - id: l2-c2
            type: text_input
            text: "Add in columns."
            say: "Add three hundred and fifty-six, two hundred and eighteen and one hundred and forty-seven in columns."
            show: { drawn: written-calc, rows: ["356", "218", "147"], op: "+" }
            answer: "721"
          - id: l2-c3
            type: text_input
            text: "Add in columns."
            say: "Add six hundred and fifteen, seventy-three and nine in columns."
            show: { drawn: written-calc, rows: ["615", "73", "9"], op: "+" }
            answer: "697"
          - id: l2-c4
            type: multiple_choice
            text: "Ones: 7 + 9 + 8 = 24. What do you write, and what do you carry?"
            options: ["write 4, carry 2", "write 4, carry 1", "write 24"]
            answer: "write 4, carry 2"
          - id: l2-c5
            type: true_false
            text: "Is this calculation right?"
            say: "Check each column. Is this calculation right?"
            show: { drawn: written-calc, rows: ["529", "46", "138"], op: "+", result: "713" }
            answer: true
