            say: "Add one hundred and twenty-six, two hundred and forty-three and three hundred and eighteen in columns. Write the digit for the ones, the tens and the hundreds."
            show: { drawn: written-calc, rows: ["126", "243", "318"], op: "+", result: "___" }
