# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.table-2-4-8
skill: math.mult-div.table-2-4-8
curriculum: en-GB
language: en
title:
  de: Die Zweier-, Vierer- und Achterreihe
  en: The 2, 4 and 8 times tables
summary: >
  The 2, 4 and 8 times tables, linked by doubling. Lesson 1 takes the 2
  times table and the 4 times table as its double (3 × 4 is double
  3 × 2); lesson 2 takes the 8 times table as the double of the 4 times
  table (4 × 8 is double 4 × 4), and ends with the skill check. The
  England curriculum asks for the 2 times table in Year 2 and the 4 and 8
  times tables in Year 3; this set starts them in Year 2 by doubling.
metadata:
  year: year-3
  topic: { de: Einmaleins, en: Times tables }
  ages: [8-10]
  lesson_minutes: 11
  builds_on: [math.mult-div.derive-facts]
  also_practises: [math.mult-div.core-facts]
  vocabulary: { en: [times table, double, count in twos, count in fours, count in eights, even] }
  forms: [drawn, text, audio]
  drawn: [dots, number-line]
  facets: []
  parts:
    - { id: facts, what: { de: "die Aufgaben der Zweier-, Vierer- und Achterreihe", en: "the 2, 4 and 8 times table facts" } }
    - { id: count, what: { de: in den Reihen zählen und ihre Zahlen erkennen, en: counting in the tables and spotting their numbers } }
    - { id: double, what: { de: durch Verdoppeln von einer Reihe zur nächsten kommen, en: getting from one table to the next by doubling } }
    - { id: in-context, what: { de: Sachaufgaben mit den drei Reihen, en: word problems with the three tables } }
  misconceptions:
    - id: double-adds-two
      what: Thinks the 4 times fact is the 2 times fact add 2 (3 × 4 = 6 + 2 = 8), not its double
      addressed: lesson 1 Learn shows two rows of 3 × 2 make 3 × 4; l1-f2 (with feedback), l1-s3 and l1-c3 offer the add-two answer
    - id: eight-one-double
      what: Doubles only once for the 8 times table and gives the 4 times answer (4 × 8 = 16)
      addressed: lesson 2 Learn doubles 2 to 4 to 8 step by step; l2-f1 (with feedback), l2-s2 and l2-n3 offer the 4 times answer
    - id: any-even-in-table
      what: Accepts an odd number in the 2 times table, or any even number in the 4 or 8 times table
      addressed: lesson 1 Learn says every answer in the 2 times table is even; l1-f4 has odd distractors, l1-n4 (30 is even but not in the 4 times table), l2-s4 and l2-c4 (26, 28 and 30 are even but not in the 8 times table)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Zweier und Vierer, en: Twos and fours }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "4 × 6 is double 2 × 6. 2 × 6 = 12, so 4 × 6 = _"
            say: "Four times six is double two times six. Two times six is twelve. So what is four times six?"
            options: ["24", "14", "18"]
            answer: "24"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Double 9 = _"
            say: "Double nine."
            answer: "18"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2, 4, 6, 8, 10, 12"
            say: "Count in twos: two, four, six, eight, ten, twelve. Every answer in the two times table is even."
            show: { drawn: number-line, from: 0, to: 20, labels: tens, step: 1, jumps: [[0, 2], [2, 2], [4, 2], [6, 2], [8, 2], [10, 2]] }
          - text: "3 × 2 = 6"
            say: "Three rows of two dots. Three times two is six."
            show: { drawn: dots, array: [3, 2] }
          - text: "3 × 4 = 12"
            say: "Put another three rows of two next to them. Now each row has four. Three times four is double three times two. Double six is twelve."
            show: { drawn: dots, array: [3, 4] }
          - text: "4 × 4: 4 × 2 = 8, double 8 = 16"
            say: "Four times four. Four times two is eight. Double eight is sixteen. To find a four times fact, double the two times fact."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "7 × 2 = _"
                say: "Seven times two."
                answer: "14"
                hints:
                  - "Seven twos is double seven."
                  - "Seven and seven."
                  - "14."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "5 × 2 = 10, so 5 × 4 = _"
                say: "Five times two is ten. So what is five times four?"
                show: { drawn: dots, array: [5, 4] }
                options: ["20", "12", "14"]
                answer: "20"
                feedback:
                  "12": "Twelve is ten add two. Four times is double two times: double ten."
                hints:
                  - "Four is double two."
                  - "So double five times two."
                  - "20."
              - id: l1-f3
                type: fill_in_blank
                text: "Count in fours."
                say: "Count in fours. Fill the gaps."
                frame: "4, 8, _, 16, _"
                options: ["12", "20", "10", "18"]
                answer: ["12", "20"]
                hints:
                  - "Each number is four more."
                  - "Eight and four more, then sixteen and four more."
                  - "12 and 20."
              - id: l1-f4
                type: multiple_choice
                text: "Which number is in the 2 times table?"
                say: "Which number is in the two times table?"
                options: ["16", "15", "13"]
                answer: "16"
                hints:
                  - "Answers in the 2 times table are even."
                  - "Even numbers end in 0, 2, 4, 6 or 8."
                  - "16."
              - id: l1-f5
                type: true_false
                text: "Is it true? 6 × 4 = 24"
                say: "Six times four is twenty-four. Is that true?"
                answer: true
                hints:
                  - "Double six times two."
                  - "Six times two is twelve. Double twelve."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "9 × 2 = _"
                say: "Nine times two."
                answer: "18"
                hints: ["Double nine."]
              - id: l1-s2
                type: multiple_choice
                text: "2 × 4 = _"
                say: "Two times four."
                options: ["8", "6", "24"]
                answer: "8"
                hints: ["Two fours: four and four."]
              - id: l1-s3
                type: multiple_choice
                text: "7 × 4 = _"
                say: "Seven times four."
                options: ["28", "16", "11"]
                answer: "28"
                hints: ["Seven times two is fourteen. Double it."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 8 × 2 = 18"
                say: "Eight times two is eighteen. Is that true?"
                answer: false
                hints: ["Double eight."]
              - id: l1-s5
                type: text_input
                text: "10 × 4 = _"
                say: "Ten times four."
                answer: "40"
                hints: ["Ten fours are four tens."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "6 × 2 = _"
                say: "Six times two."
                answer: "12"
              - id: l1-n2
                type: text_input
                text: "3 × 4 = _"
                say: "Three times four."
                answer: "12"
              - id: l1-n3
                type: fill_in_blank
                text: "Count in twos."
                say: "Count in twos. Fill the gaps."
                frame: "12, 14, _, 18, _"
                options: ["16", "20", "15", "19"]
                answer: ["16", "20"]
              - id: l1-n4
                type: multiple_choice
                text: "Which number is in the 4 times table?"
                say: "Which number is in the four times table?"
                options: ["32", "30", "27"]
                answer: "32"
              - id: l1-n5
                type: true_false
                text: "Is it true? 9 × 4 = 36"
                say: "Nine times four is thirty-six. Is that true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "_ × 2 = 14"
            say: "What times two is fourteen?"
            answer: "7"
          - id: l1-c2
            type: text_input
            text: "5 × 4 = _"
            say: "Five times four."
            answer: "20"
          - id: l1-c3
            type: multiple_choice
            text: "8 × 4 = _"
            say: "Eight times four."
            options: ["32", "18", "24"]
            answer: "32"
          - id: l1-c4
            type: true_false
            text: "Is it true? 2 × 6 = 14"
            say: "Two times six is fourteen. Is that true?"
            answer: false
          - id: l1-c5
            type: fill_in_blank
            text: "Count in fours."
            say: "Count in fours. Fill the gaps."
            frame: "20, 24, _, 32, _"
            options: ["28", "36", "26", "34"]
            answer: ["28", "36"]
          - id: l1-c6
            type: multiple_choice
            text: "9 × 2 = 18, so 9 × 4 = _"
            say: "Nine times two is eighteen. So what is nine times four?"
            options: ["36", "20", "27"]
            answer: "36"

  - n: 2
    title: { de: Die Achterreihe, en: The 8 times table }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "4 × 4 = _"
            say: "Four times four."
            answer: "16"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "6 × 4 = _"
            say: "Six times four."
            options: ["24", "14", "26"]
            answer: "24"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 × 2 = 6   3 × 4 = 12   3 × 8 = 24"
            say: "Three times two is six. Double it: three times four is twelve. Double it again: three times eight is twenty-four."
          - text: "3 × 8 = 24"
            say: "Three rows of eight. Each row is two fours, so it is double three times four."
            show: { drawn: dots, array: [3, 8] }
          - text: "5 × 8: 5 × 4 = 20, double 20 = 40"
            say: "Five times eight. Five times four is twenty. Double twenty is forty. To find an eight times fact, double the four times fact."
          - text: "8, 16, 24, 32, 40"
            say: "Count in eights: eight, sixteen, twenty-four, thirty-two, forty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "4 × 4 = 16, so 4 × 8 = _"
                say: "Four times four is sixteen. So what is four times eight?"
                show: { drawn: dots, array: [4, 8] }
                options: ["32", "16", "24"]
                answer: "32"
                feedback:
                  "16": "Sixteen is four times four. Eight is double four, so double sixteen."
                hints:
                  - "Eight is double four."
                  - "Double sixteen: ten and ten, six and six."
                  - "32."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Count in eights."
                say: "Count in eights. Fill the gaps."
                frame: "8, 16, _, 32, _"
                options: ["24", "40", "20", "36"]
                answer: ["24", "40"]
                hints:
                  - "Each number is eight more."
                  - "Sixteen and eight more is twenty-four."
                  - "24 and 40."
              - id: l2-f3
                type: text_input
                text: "2 × 8 = _"
                say: "Two times eight."
                answer: "16"
                hints:
                  - "Two eights: double eight."
                  - "Eight and eight."
                  - "16."
              - id: l2-f4
                type: fill_in_blank
                text: "6 × 4 = _, so 6 × 8 = _"
                say: "Six times four is how many? So six times eight is how many?"
                frame: "6 × 4 = _ · 6 × 8 = _"
                options: ["24", "48", "12", "32"]
                answer: ["24", "48"]
                hints:
                  - "Six times four is double six times two."
                  - "Six times four is twenty-four. Now double it."
                  - "24 and 48."
              - id: l2-f5
                type: true_false
                text: "Is it true? 10 × 8 = 80"
                say: "Ten times eight is eighty. Is that true?"
                answer: true
                hints:
                  - "Ten eights are eight tens."
                  - "Eight tens: eighty."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "5 × 8 = _"
                say: "Five times eight."
                answer: "40"
                hints: ["Five times four is twenty. Double it."]
              - id: l2-s2
                type: multiple_choice
                text: "7 × 8 = _"
                say: "Seven times eight."
                options: ["56", "14", "28"]
                answer: "56"
                hints: ["Seven times four is twenty-eight. Double it."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 3 × 8 = 21"
                say: "Three times eight is twenty-one. Is that true?"
                answer: false
                hints: ["Count in eights: eight, sixteen, ..."]
              - id: l2-s4
                type: multiple_choice
                text: "Which number is in the 8 times table?"
                say: "Which number is in the eight times table?"
                options: ["24", "26", "28"]
                answer: "24"
                hints: ["Count in eights: 8, 16, ..."]
              - id: l2-s5
                type: text_input
                text: "1 × 8 = _"
                say: "One times eight."
                answer: "8"
                hints: ["One eight."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A spider has 8 legs. How many legs do 3 spiders have?"
                say: "A spider has eight legs. How many legs do three spiders have?"
                answer: "24"
              - id: l2-n2
                type: text_input
                text: "A dog has 4 legs. How many legs do 5 dogs have?"
                say: "A dog has four legs. How many legs do five dogs have?"
                answer: "20"
              - id: l2-n3
                type: multiple_choice
                text: "Pens come in packs of 8. Zoe buys 4 packs. How many pens?"
                say: "Pens come in packs of eight. Zoe buys four packs. How many pens does she have?"
                options: ["32", "12", "16"]
                answer: "32"
              - id: l2-n4
                type: text_input
                text: "Each bike has 2 wheels. How many wheels do 8 bikes have?"
                say: "Each bike has two wheels. How many wheels do eight bikes have?"
                answer: "16"
              - id: l2-n5
                type: multiple_choice
                text: "A table seats 4 children. How many children sit at 9 tables?"
                say: "A table seats four children. How many children can sit at nine tables?"
                options: ["36", "13", "18"]
                answer: "36"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: facts
            type: text_input
            text: "8 × 2 = _"
            say: "Eight times two."
            answer: "16"
          - id: l2-c2
            part: facts
            type: multiple_choice
            text: "4 × 7 = _"
            say: "Four times seven."
            options: ["28", "11", "21"]
            answer: "28"
          - id: l2-c3
            part: facts
            type: text_input
            text: "9 × 8 = _"
            say: "Nine times eight."
            answer: "72"
          - id: l2-c4
            part: count
            type: multiple_choice
            text: "Which number is not in the 8 times table?"
            say: "Which number is not in the eight times table?"
            options: ["30", "32", "40"]
            answer: "30"
          - id: l2-c5
            part: facts
            type: true_false
            text: "Is it true? 8 × 4 = 4 × 8"
            say: "Eight times four is the same as four times eight. Is that true?"
            answer: true
          - id: l2-c6
            part: facts
            type: multiple_choice
            text: "_ × 4 = 32"
            say: "What times four is thirty-two?"
            options: ["8", "6", "7"]
            answer: "8"
          - id: l2-c7
            part: count
            type: fill_in_blank
            text: "Count in eights."
            say: "Count in eights. Fill the gaps."
            frame: "40, 48, _, 64, _"
            options: ["56", "72", "54", "70"]
            answer: ["56", "72"]
          - id: l2-c8
            part: count
            type: fill_in_blank
            text: "Count back in fours."
            say: "Count back in fours. Fill the gaps."
            frame: "36, 32, _, 24, _"
            options: ["28", "20", "30", "22"]
            answer: ["28", "20"]
          - id: l2-c9
            part: count
            type: true_false
            text: "Do you say 28 when you count in fours from 0?"
            say: "Do you say twenty-eight when you count in fours from zero?"
            answer: true
          - id: l2-c10
            part: count
            type: multiple_choice
            text: "Which number is in the 2, the 4 and the 8 times tables?"
            say: "Which number is in the two, the four and the eight times tables?"
            options: ["16", "12", "6"]
            answer: "16"
          - id: l2-c11
            part: double
            type: true_false
            text: "Is it true? 6 × 8 is double 6 × 2."
            say: "Six times eight is double six times two. Is that true?"
            answer: false
          - id: l2-c12
            part: double
            type: multiple_choice
            text: "Which fact do you double to find 7 × 8?"
            say: "Which fact do you double to find seven times eight?"
            options: ["7 × 4 = 28", "7 × 2 = 14", "7 + 8 = 15"]
            answer: "7 × 4 = 28"
          - id: l2-c13
            part: double
            type: fill_in_blank
            text: "Double, and double again."
            say: "Eight times two is sixteen. Double it, and double it again."
            frame: "8 × 2 = 16 · 8 × 4 = _ · 8 × 8 = _"
            options: ["32", "64", "18", "48"]
            answer: ["32", "64"]
          - id: l2-c14
            part: double
            type: true_false
            text: "Is it true? 9 × 4 = 9 × 2 + 2"
            say: "Nine times four is nine times two add two. Is that true?"
            answer: false
          - id: l2-c15
            part: double
            type: multiple_choice
            text: "10 × 4 = 40. Double it. Which fact do you get?"
            say: "Ten times four is forty. Double it. Which fact do you get?"
            options: ["10 × 8 = 80", "10 × 2 = 20", "10 × 4 = 42"]
            answer: "10 × 8 = 80"
          - id: l2-c16
            part: in-context
            type: text_input
            text: "An octopus has 8 arms. How many arms do 6 octopuses have?"
            say: "An octopus has eight arms. How many arms do six octopuses have?"
            answer: "48"
          - id: l2-c17
            part: in-context
            type: text_input
            text: "Socks come in pairs. How many socks are there in 7 pairs?"
            say: "Socks come in pairs. How many socks are there in seven pairs?"
            answer: "14"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "A horse has 4 legs. How many legs do 10 horses have?"
            say: "A horse has four legs. How many legs do ten horses have?"
            options: ["40", "14", "44"]
            answer: "40"
          - id: l2-c19
            part: in-context
            type: text_input
            text: "Cupcakes come in boxes of 4. Sam needs 24 cupcakes. How many boxes does he buy?"
            say: "Cupcakes come in boxes of four. Sam needs twenty-four cupcakes. How many boxes does he buy?"
            answer: "6"
          - id: l2-c20
            part: in-context
            type: text_input
            text: "Badges cost 4p each. How much do 3 badges cost? Type the pence."
            say: "Badges cost four pence each. How much do three badges cost? Type the pence."
            answer: "12"
