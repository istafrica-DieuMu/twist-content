# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.cube-buildings
skill: math.solids.cube-buildings
curriculum: en-GB
language: en
title:
  de: Würfelgebäude und Baupläne
  en: Cube buildings and plans
summary: >
  Lesson 1 reads a building plan in one row: each square says how many
  cubes are stacked there, the whole building needs the total of all the
  numbers (plan 3 1 2: 6 cubes), and the plan is read from left to right;
  lesson 2 reads and writes plans with two rows (back and front), matches
  plans to buildings and ends with the skill check. Building with real
  cubes waits for a hands-on task; here the child matches, counts and
  writes plans.
metadata:
  year: year-3
  topic: { de: Körper, en: 3D shapes }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.solids.cube-cuboid-sphere, math.numbers-to-20.count-to-10]
  also_practises: [math.add-sub-to-20.add-bridge-10]
  vocabulary: { en: [cube, tower, cube building, plan, square, front, back, left, right, stacked] }
  forms: [picture, text, audio, drawn]
  drawn: [shape, cubes]
  facets: []
  misconceptions:
    - id: counts-squares
      what: Counts the squares of the plan instead of adding the numbers in them
      addressed: lesson 1 Learn adds the numbers, not the squares; l1-f2, l1-s2, l1-n2, l2-f1, l2-s1, l2-n1 and l2-c1 offer the number of squares, with feedback in l1-f2 and l2-f1
    - id: plan-order-swapped
      what: Writes the towers into the plan in the wrong order (left and right, or front and back, swapped)
      addressed: lesson 1 Learn reads the plan from left to right; l1-f5 has feedback on the swapped plan; lesson 2 Learn says the top row of the plan is the back; l2-f3 has feedback on front and back swapped; l2-s3 and l2-c4 offer the swapped plan
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Türme und Baupläne", en: "Towers and plans" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Which one is a cube?"
            options:
              - { drawn: shape, kind: cube, colour: blue }
              - { drawn: shape, kind: cuboid, colour: blue }
              - { drawn: shape, kind: sphere, colour: blue }
            answer: cube
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: tap_to_count
            text: "How many cubes are there?"
            show: { object: cube, count: 8, layout: scattered }
            options: ["7", "8", "9"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A building made of 3 towers"
            say: "Here are three towers made of cubes, side by side. From left to right the towers are three cubes, one cube and two cubes high."
            show: { drawn: cubes, plan: [[3, 1, 2]], mode: building, colour: red }
          - text: "Plan: 3 1 2"
            say: "A plan shows the building from above. Each square stands for one tower, and the number says how many cubes are stacked there. Read the plan from left to right, like the building."
            show: { drawn: cubes, plan: [[3, 1, 2]], mode: plan }
          - text: "3 + 1 + 2 = 6 cubes"
            say: "How many cubes do you need for the whole building? Add the numbers, not the squares. Three add one add two is six cubes."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many cubes are in the tower?"
                show: { drawn: shape, column: [cube, cube, cube, cube], colours: blue }
                options: ["4", "3", "5"]
                answer: "4"
                hints:
                  - "Count the cubes from the bottom to the top."
                  - "One, two, three ..."
                  - "4 cubes."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many cubes do you need for this plan?"
                show: { drawn: cubes, plan: [[2, 3, 1]], mode: plan }
                options: ["6", "3", "5"]
                answer: "6"
                feedback:
                  "3": "3 is the number of squares. Each square has a number of cubes in it. Add the numbers."
                hints:
                  - "Each number tells you how many cubes are stacked in that square."
                  - "Add all the numbers: 2 + 3 + 1."
                  - "6 cubes."
              - id: l1-f3
                type: multiple_choice
                text: "Where is the tallest tower?"
                show: { drawn: cubes, plan: [[1, 4, 2]], mode: plan }
                options: ["on the left", "in the middle", "on the right"]
                answer: "in the middle"
                keep_order: true
                hints:
                  - "The tallest tower has the biggest number."
                  - "Which is biggest: 1, 4 or 2?"
                  - "The 4 is in the middle."
              - id: l1-f4
                type: image_multiple_choice
                text: "Which building matches the plan?"
                show: { drawn: cubes, plan: [[1, 2, 3]], mode: plan }
                options:
                  - { drawn: cubes, plan: [[1, 2, 3]], mode: building, colour: green, key: "123" }
                  - { drawn: cubes, plan: [[3, 2, 1]], mode: building, colour: green, key: "321" }
                  - { drawn: cubes, plan: [[2, 2, 2]], mode: building, colour: green, key: "222" }
                answer: "123"
                hints:
                  - "Read the plan from left to right."
                  - "The left tower has 1 cube, then 2, then 3."
                  - "The building that gets taller to the right."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which plan matches this building?"
                show: { drawn: cubes, plan: [[3, 1, 2]], mode: building, colour: orange }
                options:
                  - { drawn: cubes, plan: [[3, 1, 2]], mode: plan, key: "312" }
                  - { drawn: cubes, plan: [[2, 1, 3]], mode: plan, key: "213" }
                  - { drawn: cubes, plan: [[6]], mode: plan, key: "6" }
                answer: "312"
                feedback:
                  "213": "That plan is the wrong way round. Start with the left tower: it has 3 cubes."
                hints:
                  - "Count each tower, starting on the left."
                  - "Left 3, middle 1, right 2."
                  - "The plan 3 1 2."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which tower has 3 cubes?"
                options:
                  - { drawn: shape, column: [cube, cube], colours: blue, key: "2" }
                  - { drawn: shape, column: [cube, cube, cube], colours: blue, key: "3" }
                  - { drawn: shape, column: [cube, cube, cube, cube], colours: blue, key: "4" }
                answer: "3"
                hints: ["Count the cubes in each tower."]
              - id: l1-s2
                type: multiple_choice
                text: "How many cubes do you need for this plan?"
                show: { drawn: cubes, plan: [[4, 1, 1]], mode: plan }
                options: ["6", "3", "5"]
                answer: "6"
                hints: ["Add the numbers, not the squares."]
              - id: l1-s3
                type: multiple_choice
                text: "Where is the tallest tower?"
                show: { drawn: cubes, plan: [[2, 1, 3]], mode: plan }
                options: ["on the left", "in the middle", "on the right"]
                answer: "on the right"
                keep_order: true
                hints: ["Find the biggest number."]
              - id: l1-s4
                type: true_false
                text: "Is it true? For the plan 1 2 3 you need 3 cubes."
                answer: false
                hints: ["Add 1 + 2 + 3."]
              - id: l1-s5
                type: fill_in_blank
                text: "Left: 2 cubes. Middle: 1 cube. Right: 4 cubes. Write the plan."
                frame: "_ _ _"
                options: ["1", "2", "3", "4"]
                answer: ["2", "1", "4"]
                hints: ["Start with the left tower."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Which building matches the plan?"
                show: { drawn: cubes, plan: [[2, 4, 1]], mode: plan }
                options:
                  - { drawn: cubes, plan: [[1, 4, 2]], mode: building, colour: blue, key: "142" }
                  - { drawn: cubes, plan: [[2, 4, 1]], mode: building, colour: blue, key: "241" }
                  - { drawn: cubes, plan: [[2, 1, 4]], mode: building, colour: blue, key: "214" }
                answer: "241"
              - id: l1-n2
                type: multiple_choice
                text: "How many cubes do you need for this plan?"
                show: { drawn: cubes, plan: [[4, 2, 3]], mode: plan }
                options: ["9", "3", "8"]
                answer: "9"
              - id: l1-n3
                type: multiple_choice
                text: "Where is the tallest tower?"
                show: { drawn: cubes, plan: [[3, 2, 2]], mode: plan }
                options: ["on the left", "in the middle", "on the right"]
                answer: "on the left"
                keep_order: true
              - id: l1-n4
                type: true_false
                text: "Is it true? For the plan 4 1 you need 5 cubes."
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Left: 3 cubes. Middle: 3 cubes. Right: 1 cube. Write the plan."
                frame: "_ _ _"
                options: ["1", "2", "3"]
                answer: ["3", "3", "1"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many cubes do you need for this plan?"
            show: { drawn: cubes, plan: [[2, 4, 1]], mode: plan }
            options: ["7", "3", "6"]
            answer: "7"
          - id: l1-c2
            type: multiple_choice
            text: "Where is the tallest tower?"
            show: { drawn: cubes, plan: [[1, 1, 4]], mode: plan }
            options: ["on the left", "in the middle", "on the right"]
            answer: "on the right"
            keep_order: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Which plan matches this building?"
            show: { drawn: cubes, plan: [[1, 3, 2]], mode: building, colour: red }
            options:
              - { drawn: cubes, plan: [[2, 3, 1]], mode: plan, key: "231" }
              - { drawn: cubes, plan: [[1, 3, 2]], mode: plan, key: "132" }
              - { drawn: cubes, plan: [[1, 2, 3]], mode: plan, key: "123" }
            answer: "132"

  - n: 2
    title: { de: "Baupläne mit vorne und hinten", en: "Plans with a front and a back" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many cubes do you need for this plan?"
            show: { drawn: cubes, plan: [[3, 2, 1]], mode: plan }
            options: ["6", "3", "5"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Left: 1 cube. Middle: 2 cubes. Right: 2 cubes. Write the plan."
            frame: "_ _ _"
            options: ["1", "2", "3"]
            answer: ["1", "2", "2"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A building with a back row and a front row"
            say: "This building has towers at the back and towers at the front. Look at it from the front, as if it were on a table in front of you."
            show: { drawn: cubes, plan: [[2, 1], [3, 1]], mode: building, colour: blue }
          - text: "Plan:\nback: 2 1\nfront: 3 1"
            say: "In the plan, the top row is the back of the building and the bottom row is the front, nearest to you. Each row is read from left to right."
            show: { drawn: cubes, plan: [[2, 1], [3, 1]], mode: plan }
          - text: "2 + 1 + 3 + 1 = 7 cubes"
            say: "To find how many cubes you need, add every number in the plan: two add one add three add one is seven cubes."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many cubes do you need for this plan?"
                show: { drawn: cubes, plan: [[1, 2], [2, 3]], mode: plan }
                options: ["8", "4", "7"]
                answer: "8"
                feedback:
                  "4": "4 is the number of squares. Add the numbers in all four squares."
                hints:
                  - "Add every number in the plan."
                  - "Back row: 1 + 2 = 3. Front row: 2 + 3 = 5."
                  - "3 + 5 = 8 cubes."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Where is the tallest tower?"
                show: { drawn: cubes, plan: [[4, 1], [2, 2]], mode: plan }
                options: ["back left", "back right", "front left", "front right"]
                answer: "back left"
                keep_order: true
                hints:
                  - "Find the biggest number."
                  - "The 4 is in the top row of the plan. The top row is the back."
                  - "Back left."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which plan matches this building?"
                show: { drawn: cubes, plan: [[1, 1], [3, 2]], mode: building, colour: green }
                options:
                  - { drawn: cubes, plan: [[1, 1], [3, 2]], mode: plan, key: back-11 }
                  - { drawn: cubes, plan: [[3, 2], [1, 1]], mode: plan, key: back-32 }
                  - { drawn: cubes, plan: [[1, 3], [1, 2]], mode: plan, key: cols }
                answer: back-11
                feedback:
                  back-32: "Front and back are swapped. The tall towers are at the front, so they go in the bottom row."
                hints:
                  - "Which towers are at the front, nearest to you?"
                  - "The front towers have 3 and 2 cubes. The front is the bottom row of the plan."
                  - "Back 1 1, front 3 2."
              - id: l2-f4
                type: true_false
                text: "Is it true? You need 6 cubes for this plan."
                show: { drawn: cubes, plan: [[2, 0], [1, 3]], mode: plan }
                answer: true
                hints:
                  - "A 0 means there is no tower in that square."
                  - "2 + 0 + 1 + 3."
                  - "Yes, 6 cubes."
              - id: l2-f5
                type: fill_in_blank
                text: "Back: 2 cubes on the left, 1 on the right. Front: 1 on the left, 4 on the right. Write the plan."
                frame: "back: _ _, front: _ _"
                options: ["1", "2", "3", "4"]
                answer: ["2", "1", "1", "4"]
                hints:
                  - "The back row goes on top."
                  - "Back: left 2, right 1."
                  - "back: 2 1, front: 1 4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many cubes do you need for this plan?"
                show: { drawn: cubes, plan: [[3, 1], [2, 2]], mode: plan }
                options: ["8", "4", "6"]
                answer: "8"
                hints: ["Add every number in the plan."]
              - id: l2-s2
                type: multiple_choice
                text: "Where is the tallest tower?"
                show: { drawn: cubes, plan: [[1, 2], [1, 4]], mode: plan }
                options: ["back left", "back right", "front left", "front right"]
                answer: "front right"
                keep_order: true
                hints: ["The bottom row of the plan is the front."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which plan matches this building?"
                show: { drawn: cubes, plan: [[3, 3], [1, 1]], mode: building, colour: orange }
                options:
                  - { drawn: cubes, plan: [[1, 1], [3, 3]], mode: plan, key: back-11 }
                  - { drawn: cubes, plan: [[3, 3], [1, 1]], mode: plan, key: back-33 }
                  - { drawn: cubes, plan: [[3, 1], [3, 1]], mode: plan, key: cols }
                answer: back-33
                hints: ["The tall towers are at the back, so they go in the top row."]
              - id: l2-s4
                type: true_false
                text: "Is it true? You need 4 cubes for this plan."
                show: { drawn: cubes, plan: [[2, 2], [1, 1]], mode: plan }
                answer: false
                hints: ["Add the numbers, not the squares."]
              - id: l2-s5
                type: fill_in_blank
                text: "Back: 1 cube on the left, 3 on the right. Front: 2 on the left, 2 on the right. Write the plan."
                frame: "back: _ _, front: _ _"
                options: ["1", "2", "3", "4"]
                answer: ["1", "3", "2", "2"]
                hints: ["Write the back row first."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many cubes do you need for this plan?"
                show: { drawn: cubes, plan: [[2, 3], [4, 1]], mode: plan }
                options: ["10", "4", "9"]
                answer: "10"
              - id: l2-n2
                type: multiple_choice
                text: "Where is the tallest tower?"
                show: { drawn: cubes, plan: [[2, 1], [3, 1]], mode: plan }
                options: ["back left", "back right", "front left", "front right"]
                answer: "front left"
                keep_order: true
              - id: l2-n3
                type: image_multiple_choice
                text: "Which building matches the plan?"
                show: { drawn: cubes, plan: [[2, 1], [1, 1]], mode: plan }
                options:
                  - { drawn: cubes, plan: [[2, 1], [1, 1]], mode: building, colour: red, key: back-21 }
                  - { drawn: cubes, plan: [[1, 1], [2, 1]], mode: building, colour: red, key: front-21 }
                  - { drawn: cubes, plan: [[1, 2], [1, 1]], mode: building, colour: red, key: back-12 }
                answer: back-21
              - id: l2-n4
                type: true_false
                text: "Is it true? You need 7 cubes for this plan."
                show: { drawn: cubes, plan: [[3, 0], [2, 2]], mode: plan }
                answer: true
              - id: l2-n5
                type: text_input
                text: "Ruby builds a tower of 3 cubes at the back left and 2 cubes in each of the other three squares. How many cubes does she use?"
                answer: "9"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "How many cubes do you need for this plan?"
            show: { drawn: cubes, plan: [[1, 3], [2, 1]], mode: plan }
            options: ["7", "4", "6"]
            answer: "7"
          - id: l2-c2
            type: multiple_choice
            text: "Where is the tallest tower?"
            show: { drawn: cubes, plan: [[1, 3], [2, 1]], mode: plan }
            options: ["back left", "back right", "front left", "front right"]
            answer: "back right"
            keep_order: true
          - id: l2-c3
            type: image_multiple_choice
            text: "Which building matches the plan?"
            show: { drawn: cubes, plan: [[3, 1, 1]], mode: plan }
            options:
              - { drawn: cubes, plan: [[1, 1, 3]], mode: building, colour: blue, key: "113" }
              - { drawn: cubes, plan: [[3, 1, 1]], mode: building, colour: blue, key: "311" }
              - { drawn: cubes, plan: [[1, 3, 1]], mode: building, colour: blue, key: "131" }
            answer: "311"
          - id: l2-c4
            type: image_multiple_choice
            text: "Which plan matches this building?"
            show: { drawn: cubes, plan: [[1, 2], [3, 1]], mode: building, colour: green }
            options:
              - { drawn: cubes, plan: [[3, 1], [1, 2]], mode: plan, key: swapped }
              - { drawn: cubes, plan: [[1, 2], [3, 1]], mode: plan, key: right }
              - { drawn: cubes, plan: [[2, 1], [1, 3]], mode: plan, key: mirrored }
            answer: right
          - id: l2-c5
            type: fill_in_blank
            text: "Back: 3 cubes on the left, 2 on the right. Front: 1 on the left, 1 on the right. Write the plan."
            frame: "back: _ _, front: _ _"
            options: ["1", "2", "3", "4"]
            answer: ["3", "2", "1", "1"]
