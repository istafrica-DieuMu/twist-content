                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Which multiples of ten are either side of 304?"
                frame: "_, 304, _"
                options: ["300", "303", "305", "310"]
                answer: ["300", "310"]
              - id: l2-n6
                type: multiple_choice
                text: "Which multiple of ten is 657 nearer to?"
                options: ["650", "660"]
                answer: "660"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
