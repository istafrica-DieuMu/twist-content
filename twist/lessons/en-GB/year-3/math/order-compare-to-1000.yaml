# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.order-compare-to-1000
skill: math.numbers-to-1000.order-compare
curriculum: en-GB
language: en
title:
  de: Ordnen und vergleichen bis 1000
  en: Comparing and ordering to 1000
summary: >
  Comparing three-digit numbers from the greatest place value: hundreds,
  then tens, then ones, with <, > and =, including sides that are sums.
  Lesson 1 compares and orders; lesson 2 finds the multiples of 10 and 100
  either side of a number, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.number-line]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { en: [greater than, less than, equal to, ascending, descending, multiple of ten, multiple of a hundred] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart, number-line]
  facets: [operation-signs]
  parts:
    - { id: compare, what: { de: zwei Zahlen bis 1000 vergleichen, en: comparing two numbers to 1000 } }
    - { id: order, what: { de: Zahlen bis 1000 der Größe nach ordnen, en: putting numbers to 1000 in order } }
    - { id: neighbours, what: { de: Nachbarzehner und Nachbarhunderter bestimmen, en: finding the multiples of 10 and 100 either side of a number } }
  misconceptions:
    - id: biggest-digit
      what: Compares by the biggest digit anywhere (thinks 199 > 301)
      addressed: Learn compares from the hundreds; full-stage feedback names the hundreds
    - id: multiples-mixed
      what: Mixes up the multiples of 10 and of 100 either side of a number
      addressed: lesson 2 asks for both for the same number, one after the other
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Von links vergleichen, en: Compare the hundreds first }
    goal:
      de: "Vergleiche Zahlen, indem du zuerst die Hunderter anschaust und dann die Zehner, so wie 301 ist größer als 199."
      en: "Compare numbers by looking at the hundreds first, then the tens, like 301 is more than 199."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "47 _ 74"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is the 3 in 352 worth?"
            options: ["3", "30", "300"]
            answer: "300"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "301 or 199: which is greater? Guess!"
            say: "Three hundred and one, or one hundred and ninety-nine, with its two big nines. Which number do you think is greater? Have a guess."
          - text: "301 and 199"
            say: "Let's see. Start with the greatest place value, the hundreds. Three hundred and one has three hundreds."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 0, 1] }
          - text: "301 and 199: 301 > 199"
            say: "One hundred and ninety-nine has only one hundred. Three hundreds are more than one, so three hundred and one is greater, even though one hundred and ninety-nine has two nines."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [1, 9, 9] }
          - text: "456 < 465"
            say: "If the hundreds are the same, compare the tens. Four hundred and fifty-six has five tens, four hundred and sixty-five has six. If the tens are the same too, the ones decide."
          - text: "Did you know? The Shard in London is about 310 m tall. Blackpool Tower is 158 m tall."
            say: "Did you know? The Shard in London is about three hundred and ten metres tall. It is the tallest building in the UK. Blackpool Tower is one hundred and fifty-eight metres tall. Compare the hundreds: three hundreds beat one hundred. The Shard is about twice as tall!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "199 _ 301"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "Look at the hundreds first: 1 hundred is less than 3 hundreds."
                hints:
                  - "Compare the hundreds first."
                  - "199 has 1 hundred, 301 has 3."
                  - "199 is less than 301."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "582 _ 528"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "The hundreds are the same."
                  - "Compare the tens: 8 and 2."
                  - "582 is greater than 528."
              - id: l1-f3
                type: ordering
                text: "Put the numbers in ascending order, smallest first."
                options: ["640", "406", "604", "460"]
                slot_count: 4
                answer: ["406", "460", "604", "640"]
                hints:
                  - "Which numbers have 4 hundreds?"
                  - "406 and 460 come first. Which is smaller?"
                  - "406, 460, 604, 640."
              - id: l1-f4
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "300 + 40 _ 304"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Work out the left side first."
                  - "300 + 40 is 340."
                  - "340 is greater than 304."
              - id: l1-f5
                type: multiple_choice
                text: "Three friends play a game. Their scores are 899, 980 and 908. Which is the highest score?"
                options: ["899", "980", "908", "Grandma's, she always wins"]
                answer: "980"
                feedback:
                  "Grandma's, she always wins": "Grandma isn't playing today! Compare the hundreds first, then the tens."
                hints:
                  - "Which have the most hundreds?"
                  - "980 and 908 have 9 hundreds. Compare the tens."
                  - "980 is the greatest."
              - id: l1-f6
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ > 650"
                options: ["605", "560", "656"]
                answer: ["656"]
                hints:
                  - "The number must be greater than 650."
                  - "605 has fewer tens, 560 fewer hundreds."
                  - "656 is greater than 650."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "347 _ 351"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Same hundreds: compare the tens."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "500 + 20 _ 520"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Work out the left side."]
              - id: l1-s3
                type: ordering
                text: "Put the numbers in descending order, greatest first."
                options: ["299", "929", "992", "290"]
                slot_count: 4
                answer: ["992", "929", "299", "290"]
                hints: ["Compare from the hundreds."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 615 < 651"
                answer: true
                hints: ["Tens: 1 and 5."]
              - id: l1-s5
                type: multiple_choice
                text: "Which is the smallest?"
                options: ["710", "701", "170"]
                answer: "170"
                hints: ["Which has the fewest hundreds?"]
              - id: l1-s6
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ < 400"
                options: ["410", "399", "401"]
                answer: ["399"]
                hints: ["Fewer than 4 hundreds."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "509 _ 590"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "800 + 8 _ 880"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n3
                type: ordering
                text: "Put the numbers in ascending order, smallest first."
                options: ["135", "531", "153", "315"]
                slot_count: 4
                answer: ["135", "153", "315", "531"]
              - id: l1-n4
                type: true_false
                text: "Is it true? 1000 > 999"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which is the greatest?"
                options: ["478", "487", "448"]
                answer: "487"
              - id: l1-n6
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ > 799"
                options: ["797", "780", "800"]
                answer: ["800"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "263 _ 236"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c2
            type: ordering
            text: "Put the numbers in ascending order, smallest first."
            options: ["908", "890", "809", "980"]
            slot_count: 4
            answer: ["809", "890", "908", "980"]
          - id: l1-c3
            type: multiple_choice
            text: "Which is the smallest?"
            options: ["321", "312", "231"]
            answer: "231"
          - id: l1-c4
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "450 _ 405"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? 830 < 803"
            answer: false
          - id: l1-c6
            type: ordering
            text: "Put the numbers in descending order, greatest first."
            options: ["472", "742", "247", "724"]
            slot_count: 4
            answer: ["742", "724", "472", "247"]

  - n: 2
    title: { de: Nachbarzehner und Nachbarhunderter, en: Multiples of 10 and 100 either side }
    goal:
      de: "Finde die Nachbarzehner und Nachbarhunderter einer Zahl. Für 374 sind das 370 und 380, und 300 und 400."
      en: "Find the tens and hundreds on either side of a number. For 374, that is 370 and 380, and 300 and 400."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "715 _ 751"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Which multiples of ten are either side of 46?"
            frame: "_, 46, _"
            options: ["40", "45", "47", "50"]
            answer: ["40", "50"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "374 sits between which tens? Guess!"
            say: "Three hundred and seventy-four. Which two multiples of ten do you think it sits between? Have a guess."
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends, mark: 374 }
          - text: "370 | 374 | 380"
            say: "Here it is close up. The multiples of ten either side of three hundred and seventy-four are three hundred and seventy and three hundred and eighty."
            show: { drawn: number-line, from: 370, to: 380, labels: ends, mark: 374 }
          - text: "300 | 374 | 400"
            say: "The multiples of one hundred either side are three hundred and four hundred."
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends, mark: 374 }
          - text: "374: 370 and 300"
            say: "A tip: for the multiple of a hundred below, keep only the hundreds digit and make the rest zero. For the multiple of ten below, make only the ones digit zero."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Which multiples of ten are either side of 528?"
                frame: "_, 528, _"
                options: ["500", "520", "530", "600"]
                answer: ["520", "530"]
                feedback:
                  "500": "500 is a multiple of a hundred. We want multiples of ten."
                hints:
                  - "Multiples of ten end in 0."
                  - "Make the ones digit 0: 520. The next ten is 530."
                  - "520 and 530."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which multiples of 100 are either side of 528?"
                frame: "_, 528, _"
                options: ["500", "520", "530", "600"]
                answer: ["500", "600"]
                hints:
                  - "Multiples of 100 end in 00."
                  - "Keep the hundreds digit: 500. Then 600."
                  - "500 and 600."
              - id: l2-f3
                type: fill_in_blank
                text: "What comes just before and just after 690?"
                frame: "_, 690, _"
                options: ["680", "689", "691", "700"]
                answer: ["689", "691"]
                hints:
                  - "One less and one more."
                  - "690 − 1 and 690 + 1."
                  - "689 and 691."
              - id: l2-f4
                type: multiple_choice
                text: "Which multiple of 100 is 780 nearer to?"
                show: { drawn: number-line, from: 700, to: 800, step: 10, labels: ends, mark: 780 }
                options: ["700", "800"]
                answer: "800"
                hints:
                  - "Count the tens to each hundred."
                  - "To 800 is 2 tens, to 700 is 8."
                  - "800 is nearer."
              - id: l2-f5
                type: true_false
                text: "Is it true? The multiples of 100 either side of 450 are 400 and 500."
                answer: true
                hints:
                  - "450 has 4 hundreds."
                  - "The hundred below is 400, the hundred above is 500."
                  - "Yes."
              - id: l2-f6
                type: fill_in_blank
                text: "Which multiples of ten are either side of 199?"
                frame: "_, 199, _"
                options: ["190", "198", "200", "290"]
                answer: ["190", "200"]
                hints:
                  - "Which multiple of ten comes before 199?"
                  - "190. After it comes a multiple of a hundred."
                  - "190 and 200."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which multiples of ten are either side of 863?"
                frame: "_, 863, _"
                options: ["800", "860", "870", "900"]
                answer: ["860", "870"]
                hints: ["Make the ones digit 0."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which multiples of 100 are either side of 863?"
                frame: "_, 863, _"
                options: ["800", "860", "870", "900"]
                answer: ["800", "900"]
                hints: ["Keep only the hundreds digit."]
              - id: l2-s3
                type: multiple_choice
                text: "Which multiple of ten is 312 nearer to?"
                options: ["310", "320"]
                answer: "310"
                hints: ["To 310 is 2."]
              - id: l2-s4
                type: true_false
                text: "Is it true? The multiples of ten either side of 247 are 200 and 300."
                answer: false
                hints: ["Those are multiples of a hundred."]
              - id: l2-s5
                type: fill_in_blank
                text: "What comes just before and just after 400?"
                frame: "_, 400, _"
                options: ["300", "399", "401", "500"]
                answer: ["399", "401"]
                hints: ["One less, one more."]
              - id: l2-s6
                type: multiple_choice
                text: "Which multiple of 100 is 230 nearer to?"
                options: ["200", "300"]
                answer: "200"
                hints: ["230 is close to 200."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which multiples of ten are either side of 95?"
                frame: "_, 95, _"
                options: ["90", "94", "96", "100"]
                answer: ["90", "100"]
              - id: l2-n2
                type: fill_in_blank
                text: "Which multiples of 100 are either side of 712?"
                frame: "_, 712, _"
                options: ["700", "710", "720", "800"]
                answer: ["700", "800"]
              - id: l2-n3
                type: multiple_choice
                text: "Which multiple of 100 is 960 nearer to?"
                options: ["900", "1000"]
                answer: "1000"
              - id: l2-n4
                type: true_false
