# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.sequences-to-1000
skill: math.numbers-to-1000.sequences
curriculum: en-GB
language: en
title:
  de: Zahlenfolgen bis 1000
  en: Counting in steps to 1000
summary: >
  Year 3 counts from 0 in multiples of 4, 8, 50 and 100, and in tens from
  any number across a hundred. Lesson 1 counts in 4s, 8s, 50s and 100s;
  lesson 2 finds the rule of a sequence, the missing term and the term
  that breaks the rule, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.order-compare]
  also_practises: [math.numbers-to-100.sequences]
  vocabulary: { en: [sequence, multiple, count in fours, count in eights, rule, term] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: []
  parts:
    - { id: continue, what: { de: "in Vierer-, Achter-, Fünfziger- und Hunderterschritten weiterzählen", en: "counting on and back in 4s, 8s, 50s and 100s" } }
    - { id: hundred, what: { de: in Zehnerschritten über den Hunderter zählen, en: counting in tens across a hundred } }
    - { id: rule, what: { de: "die Regel einer Folge finden und erklären, auch für eine fehlende Zahl", en: "finding and explaining the rule of a sequence, also for a missing term" } }
    - { id: check-rule, what: { de: "prüfen, ob eine Regel bei jedem Schritt stimmt", en: checking that a rule works at every step } }
  misconceptions:
    - id: eights-from-fours
      what: Does not see that counting in 8s lands on every other multiple of 4
      addressed: lesson 1 Learn counts in 4s and 8s on the same line
    - id: hundred-crossing
      what: Continues 380, 390 with 3100 or 300
      addressed: lesson 1 sets tens across a hundred; feedback on 3100 says ten tens make a hundred
    - id: rule-from-two
      what: Reads the rule from the first two terms only
      addressed: lesson 2 checks the rule on every step, and one sequence breaks it late
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "In Vierer-, Achter- und Fünfzigerschritten", en: "Counting in 4s, 8s and 50s" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "2, 4, 6, 8, _"
            options: ["9", "10", "12"]
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "200, 300, 400, _"
            options: ["410", "500", "401"]
            answer: "500"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "0, 4, 8, 12, 16, 20, 24"
            say: "Counting in fours from zero: four, eight, twelve, sixteen, twenty, twenty-four. Each jump is four."
            show: { drawn: number-line, from: 0, to: 24, labels: ends, jumps: [[0, 4], [4, 4], [8, 4], [12, 4], [16, 4], [20, 4]] }
          - text: "0, 8, 16, 24"
            say: "Counting in eights lands on every other multiple of four: eight, sixteen, twenty-four. One jump of eight is two jumps of four."
            show: { drawn: number-line, from: 0, to: 24, labels: ends, jumps: [[0, 8], [8, 8], [16, 8]] }
          - text: "0, 50, 100, 150, 200"
            say: "Counting in fifties: fifty, one hundred, one hundred and fifty, two hundred. Two fifties make a hundred."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Count in 4s: 12, 16, 20, _"
                options: ["21", "24", "28"]
                answer: "24"
                feedback:
                  "21": "Each jump is four, not one."
                hints:
                  - "Each jump is 4."
                  - "20 and 4."
                  - "It is 24."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Count in 8s: 8, 16, 24, _"
                options: ["28", "32", "30"]
                answer: "32"
                hints:
                  - "Each jump is 8."
                  - "24 and 8. Two jumps of 4: 28, 32."
                  - "It is 32."
              - id: l1-f3
                type: fill_in_blank
                text: "Count in 50s. What comes next?"
                frame: "150, 200, 250, _ , _"
                options: ["260", "300", "350", "400"]
                answer: ["300", "350"]
                hints:
                  - "Each jump is 50."
                  - "Two fifties make a hundred."
                  - "300, 350."
              - id: l1-f4
                type: multiple_choice
                text: "Count in 10s: 370, 380, 390, _"
                options: ["3100", "400", "391"]
                answer: "400"
                feedback:
                  "3100": "Ten tens make a hundred. After 390 comes 400."
                hints:
                  - "Each jump is ten."
                  - "390 and 10: that makes ten tens, a new hundred."
                  - "After 390 comes 400."
              - id: l1-f5
                type: true_false
                text: "Do you say 36 when you count in 4s from 0?"
                answer: true
                hints:
                  - "Count in 4s: 4, 8, 12, ..."
                  - "28, 32, 36."
                  - "Yes."
              - id: l1-f6
                type: multiple_choice
                text: "Count back in 100s: 925, 825, 725, _"
                options: ["625", "715", "525"]
                answer: "625"
                hints:
                  - "Only the hundreds digit changes."
                  - "7 hundreds become 6."
                  - "It is 625."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Count in 4s: 28, 32, 36, _"
                options: ["38", "40", "44"]
                answer: "40"
                hints: ["Each jump is 4."]
              - id: l1-s2
                type: multiple_choice
                text: "Count in 8s: 32, 40, 48, _"
                options: ["50", "56", "58"]
                answer: "56"
                hints: ["48 and 8."]
              - id: l1-s3
                type: fill_in_blank
                text: "Count in 50s. What comes next?"
                frame: "700, 750, 800, _ , _"
                options: ["810", "850", "900", "950"]
                answer: ["850", "900"]
                hints: ["Each jump is 50."]
              - id: l1-s4
                type: multiple_choice
                text: "Count in 10s: 680, 690, 700, _"
                options: ["701", "710", "800"]
                answer: "710"
                hints: ["Ten more each time."]
              - id: l1-s5
                type: true_false
                text: "Do you say 30 when you count in 8s from 0?"
                answer: false
                hints: ["Count in 8s: 8, 16, 24, 32."]
              - id: l1-s6
                type: ordering
                text: "Put the multiples of 50 in order, smallest first."
                options: ["550", "450", "600", "500"]
                slot_count: 4
                answer: ["450", "500", "550", "600"]
                hints: ["Start with the smallest."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Count in 4s: 40, 44, 48, _"
                options: ["50", "52", "56"]
                answer: "52"
              - id: l1-n2
                type: multiple_choice
                text: "Count in 8s: 64, 72, 80, _"
                options: ["84", "88", "90"]
                answer: "88"
              - id: l1-n3
                type: fill_in_blank
                text: "Count back in 50s. What comes next?"
                frame: "1000, 950, 900, _ , _"
                options: ["850", "800", "890", "750"]
                answer: ["850", "800"]
              - id: l1-n4
                type: multiple_choice
                text: "Count back in 10s: 420, 410, 400, _"
                options: ["300", "390", "399"]
                answer: "390"
              - id: l1-n5
                type: true_false
                text: "Do you say 48 when you count in 8s from 0?"
                answer: true
              - id: l1-n6
                type: multiple_choice
                text: "Count in 100s: 47, 147, 247, _"
                options: ["257", "347", "248"]
                answer: "347"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Count in 4s: 20, 24, 28, _"
            options: ["30", "32", "36"]
            answer: "32"
          - id: l1-c2
            type: multiple_choice
            text: "Count in 8s: 16, 24, 32, _"
            options: ["36", "40", "48"]
            answer: "40"
          - id: l1-c3
            type: fill_in_blank
            text: "Count in 50s. What comes next?"
            frame: "350, 400, 450, _ , _"
            options: ["460", "500", "550", "600"]
            answer: ["500", "550"]
          - id: l1-c4
            type: multiple_choice
            text: "Count back in 10s: 530, 520, 510, _"
            options: ["500", "509", "410"]
            answer: "500"
          - id: l1-c5
            type: true_false
            text: "Do you say 250 when you count in 50s from 0?"
            answer: true
          - id: l1-c6
            type: fill_in_blank
            text: "Count in 100s. What comes next?"
            frame: "136, 236, 336, _ , _"
            options: ["346", "436", "536", "446"]
            answer: ["436", "536"]

  - n: 2
    title: { de: Regeln finden, en: Finding the rule }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Count in 8s: 40, 48, 56, _"
            options: ["60", "64", "66"]
            answer: "64"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Count in 50s: 200, 250, 300, _"
            options: ["310", "350", "400"]
            answer: "350"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "312, 337, 362, 387"
            say: "What is the rule? From three hundred and twelve to three hundred and thirty-seven is twenty-five more."
          - text: "+25"
            say: "Check every step, not just the first one: three hundred and thirty-seven add twenty-five is three hundred and sixty-two, and so on. Only when every step works is it the rule."
          - text: "900, 850, 800: subtract 50 each time"
            say: "To explain a rule, say whether the numbers go up or down, and by how much. For example: subtract fifty each time."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is the rule? 240, 340, 440, 540"
                options: ["+10", "+100", "−100"]
                answer: "+100"
                option_audio: false
                hints:
                  - "Which digit changes?"
                  - "The hundreds digit goes up by one."
                  - "The rule is add 100."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is the rule? 900, 850, 800, 750"
                options: ["−50", "+50", "−100"]
                answer: "−50"
                option_audio: false
                hints:
                  - "Are the numbers going up or down?"
                  - "Down, from 900 to 850."
                  - "The rule is subtract 50."
              - id: l2-f3
                type: fill_in_blank
                text: "What is the missing term?"
                frame: "16, 24, _ , 40"
                options: ["28", "32", "36"]
                answer: ["32"]
                hints:
                  - "How big is the step from 16 to 24?"
                  - "Add 8 each time."
                  - "24 and 8 make 32."
              - id: l2-f4
                type: multiple_choice
                text: "Which rule explains it? 975, 950, 925, 900"
                options: ["subtract 25 each time", "add 25 each time", "subtract 50 each time"]
                answer: "subtract 25 each time"
                hints:
                  - "Up or down?"
                  - "From 975 to 950 is 25 less."
                  - "Subtract 25 each time."
              - id: l2-f5
                type: true_false
                text: "Does the rule +10 work for every step? 395, 405, 415, 435"
                answer: false
                hints:
                  - "Check every step."
                  - "395, 405, 415 fit. And then?"
                  - "From 415 to 435 is 20. No."
              - id: l2-f6
                type: multiple_choice
                text: "Which term does not fit? 4, 8, 12, 15, 20"
                options: ["8", "15", "20"]
                answer: "15"
                hints:
                  - "What is the rule?"
                  - "Add 4: after 12 comes 16."
                  - "15 does not fit."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What is the rule? 703, 708, 713, 718"
                options: ["+5", "+10", "−5"]
                answer: "+5"
                option_audio: false
                hints: ["From 703 to 708."]
              - id: l2-s2
                type: fill_in_blank
                text: "What is the missing term?"
                frame: "850, _ , 650, 550"
                options: ["700", "750", "800"]
                answer: ["750"]
                hints: ["100 less each time."]
              - id: l2-s3
                type: multiple_choice
                text: "Which rule explains it? 0, 8, 16, 24"
                options: ["add 8 each time", "add 4 each time", "add 6 each time"]
                answer: "add 8 each time"
                hints: ["From 0 to 8."]
              - id: l2-s4
                type: true_false
                text: "Does the rule −50 work for every step? 600, 550, 500, 450"
                answer: true
                hints: ["Check every step."]
              - id: l2-s5
                type: multiple_choice
                text: "Which term does not fit? 8, 16, 24, 30, 40"
                options: ["16", "30", "40"]
                answer: "30"
                hints: ["Add 8: after 24 comes 32."]
              - id: l2-s6
                type: fill_in_blank
                text: "What is the missing term?"
                frame: "275, 300, _ , 350"
                options: ["310", "325", "330"]
                answer: ["325"]
                hints: ["Add 25 each time."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What is the rule? 455, 445, 435, 425"
                options: ["+10", "−10", "−1"]
                answer: "−10"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "What is the missing term?"
                frame: "28, 32, _ , 40"
                options: ["34", "36", "38"]
                answer: ["36"]
              - id: l2-n3
                type: multiple_choice
                text: "Which rule explains it? 1000, 800, 600, 400"
                options: ["subtract 200 each time", "subtract 100 each time", "add 200 each time"]
                answer: "subtract 200 each time"
              - id: l2-n4
                type: true_false
                text: "Does the rule +8 work for every step? 56, 64, 72, 80"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Which term does not fit? 505, 510, 515, 521, 525"
                options: ["510", "521", "525"]
                answer: "521"
              - id: l2-n6
                type: fill_in_blank
                text: "What is the missing term?"
                frame: "618, 518, _ , 318"
                options: ["508", "418", "417"]
                answer: ["418"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: continue
            type: multiple_choice
            text: "Count in 4s: 32, 36, 40, _"
            options: ["42", "44", "48"]
            answer: "44"
          - id: l2-c2
            part: continue
            type: fill_in_blank
            text: "Count in 50s. What comes next?"
            frame: "550, 600, 650, _ , _"
            options: ["660", "700", "750", "800"]
            answer: ["700", "750"]
          - id: l2-c3
            part: rule
            type: multiple_choice
            text: "What is the rule? 670, 620, 570, 520"
            options: ["−50", "+50", "−5"]
            answer: "−50"
            option_audio: false
          - id: l2-c4
            part: rule
            type: fill_in_blank
            text: "What is the missing term?"
            frame: "48, 56, _ , 72"
            options: ["60", "64", "68"]
            answer: ["64"]
          - id: l2-c5
            part: hundred
            type: multiple_choice
            text: "Count in 10s: 790, 800, 810, _"
            options: ["811", "820", "900"]
            answer: "820"
          - id: l2-c6
            part: continue
            type: multiple_choice
            text: "Count back in 8s: 96, 88, 80, _"
            options: ["72", "70", "76"]
            answer: "72"
          - id: l2-c7
            part: continue
            type: fill_in_blank
            text: "Count back in 100s. What comes next?"
            frame: "863, 763, 663, _ , _"
            options: ["563", "463", "653", "553"]
            answer: ["563", "463"]
          - id: l2-c8
            part: continue
            type: ordering
            text: "Put the numbers in order to count in 4s, smallest first."
            options: ["60", "52", "56", "48"]
            slot_count: 4
            answer: ["48", "52", "56", "60"]
          - id: l2-c9
            part: hundred
            type: multiple_choice
            text: "Count in 10s: 273, 283, 293, _"
            options: ["303", "2103", "294"]
            answer: "303"
          - id: l2-c10
            part: hundred
            type: fill_in_blank
            text: "Count back in 10s. What comes next?"
            frame: "726, 716, 706, _ , _"
            options: ["696", "686", "606", "705"]
            answer: ["696", "686"]
          - id: l2-c11
            part: hundred
            type: true_false
            text: "Is it true? Ten more than 495 is 505."
            say: "Ten more than four hundred and ninety-five is five hundred and five. Is it true?"
            answer: true
          - id: l2-c12
            part: hundred
            type: text_input
            text: "Count in 10s: 867, 877, 887, 897, _"
            answer: "907"
          - id: l2-c13
            part: rule
            type: multiple_choice
            text: "What is the rule? 128, 136, 144, 152"
            options: ["+8", "+4", "+6"]
            answer: "+8"
            option_audio: false
          - id: l2-c14
            part: rule
            type: multiple_choice
            text: "Which rule explains it? 450, 500, 550, 600"
            options: ["add 50 each time", "add 5 each time", "subtract 50 each time"]
            answer: "add 50 each time"
          - id: l2-c15
            part: rule
            type: fill_in_blank
            text: "What is the missing term?"
            frame: "_ , 36, 44, 52"
            options: ["28", "30", "32"]
            answer: ["28"]
          - id: l2-c16
            part: check-rule
            type: true_false
            text: "Does the rule +4 work for every step? 64, 68, 72, 78"
            answer: false
          - id: l2-c17
            part: check-rule
            type: true_false
            text: "Does the rule −100 work for every step? 934, 834, 734, 634"
            answer: true
          - id: l2-c18
            part: check-rule
            type: multiple_choice
            text: "Which term does not fit? 150, 200, 250, 280, 350"
            options: ["200", "280", "350"]
            answer: "280"
          - id: l2-c19
            part: check-rule
            type: multiple_choice
            text: "Which term does not fit? 708, 718, 728, 737, 748"
            options: ["718", "737", "748"]
            answer: "737"
          - id: l2-c20
            part: check-rule
            type: true_false
            text: "Amy looks at 100, 125, 150, 200 and says the rule is +25 for every step. Is she right?"
            say: "Amy looks at one hundred, one hundred and twenty-five, one hundred and fifty, two hundred, and says the rule is add twenty-five for every step. Is she right?"
            answer: false
