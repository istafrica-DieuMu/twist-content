# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.mult-div-tens
skill: math.mult-div-larger.tens
curriculum: en-GB
language: en
title:
  de: Malnehmen und Teilen mit Zehnerzahlen
  en: Multiplying and dividing multiples of ten
summary: >
  Times-table facts carried over to multiples of ten. Lesson 1 multiplies
  a multiple of ten by a one-digit number (3 × 40 = 120, because 3 × 4
  tens = 12 tens); lesson 2 divides a multiple of ten (240 ÷ 6 = 40,
  because 24 tens ÷ 6 = 4 tens), checks with the inverse, and ends with
  the skill check.
metadata:
  year: year-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-inverse, math.numbers-to-1000.place-value]
  also_practises: [math.mult-div.table-3-6-9, math.mult-div.div-inverse]
  vocabulary: { en: [times, multiply, divide, share equally, multiple of ten, tens, times tables, inverse] }
  forms: [drawn, text, audio]
  drawn: [base-ten]
  facets: [operation-signs, currency]
  parts:
    - { id: multiply, what: { de: eine Zehnerzahl mit einer einstelligen Zahl malnehmen, en: multiplying a multiple of ten by a one-digit number } }
    - { id: divide, what: { de: eine Zehnerzahl durch eine einstellige Zahl teilen, en: dividing a multiple of ten by a one-digit number } }
    - { id: inverse, what: { de: mit der Umkehraufgabe prüfen, en: checking with the inverse } }
    - { id: in-context, what: { de: Sachaufgaben mit Zehnerzahlen, en: word problems with multiples of ten } }
  misconceptions:
    - id: drops-the-ten
      what: Gives the times-table fact without the ten (8 × 20 = 16, 320 ÷ 8 = 4)
      addressed: lesson 1 Learn counts in tens; l1-f2 and l2-f2 have feedback on it; l1-s2, l1-c2, l2-s2 and l2-c4 offer it again
    - id: zero-too-many
      what: Writes one zero too many (6 × 50 = 3000)
      addressed: lesson 1 Learn says thirty tens are three hundred; l1-f4 asks about it, and the hundreds options in l1-f2, l1-s2, l1-c2, l2-f2 and l2-s2 offer it
    - id: not-seen-as-tens
      what: Does not see a multiple of ten as a number of tens
      addressed: l1-n3 and l2-w2 ask for the number of tens; the frames in l2-f1, l2-s1 and l2-n1 start with the tens
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Mal Zehnerzahlen, en: Multiplying tens }
    goal:
      de: "Nutze eine Malaufgabe, die du kennst, für Zehnerzahlen. 3 mal 4 ist 12, also ist 3 mal 40 genau 120."
      en: "Use a times fact you know to multiply tens. 3 times 4 is 12, so 3 times 40 is 120."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "3 × 4 = _"
            say: "Three times four."
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many tens are in 120?"
            options: ["12", "120", "2"]
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 × 40 = 3 × 4 tens"
            say: "Three times forty. Forty is four tens. So three times forty is three times four tens."
          - text: "3 × 4 tens = 12 tens = 120"
            say: "Three times four is twelve, so three times four tens is twelve tens. Ten tens make a hundred, so twelve tens are one hundred and twenty."
            show: { drawn: base-ten, hundreds: 1, tens: 2, ones: 0 }
          - text: "5 × 60 = 30 tens = 300"
            say: "Five times sixty. Five times six is thirty, so five times six tens is thirty tens. Thirty tens are three hundred. Use the fact you know, then make it ten times bigger."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Use a fact you know: 4 × 30"
                say: "Four times thirty. Use a fact you know."
                frame: "4 × 3 = _ → 4 × 30 = _"
                options: ["12", "120", "1200", "7"]
                answer: ["12", "120"]
                hints:
                  - "Thirty is three tens."
                  - "4 × 3 = 12, so 4 × 3 tens = 12 tens."
                  - "12, and 4 × 30 = 120."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "8 × 20 = _"
                say: "Eight times twenty."
                options: ["160", "16", "1600"]
                answer: "160"
                feedback:
                  "16": "8 × 2 = 16, but this is 8 × 2 tens. That is 16 tens, which is 160."
                hints:
                  - "Twenty is two tens."
                  - "8 × 2 = 16, so 8 × 2 tens = 16 tens."
                  - "16 tens are 160."
              - id: l1-f3
                type: text_input
                text: "5 × 70 = _"
                say: "Five times seventy."
                answer: "350"
                hints:
                  - "Seventy is seven tens."
                  - "5 × 7 = 35, so it is 35 tens."
                  - "35 tens are 350."
              - id: l1-f4
                type: true_false
                text: "Is it true? 6 × 50 = 3000"
                say: "Six times fifty equals three thousand. Is it true?"
                answer: false
                hints:
                  - "Fifty is five tens."
                  - "6 × 5 = 30, so it is 30 tens."
                  - "No. 30 tens are 300."
              - id: l1-f5
                type: text_input
                text: "A box holds 40 pencils. How many pencils are in 3 boxes?"
                answer: "120"
                hints:
                  - "Three boxes of 40: which multiplication is that?"
                  - "3 × 40. 3 × 4 = 12, so it is 12 tens."
                  - "120 pencils."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Use a fact you know: 3 × 60"
                say: "Three times sixty. Use a fact you know."
                frame: "3 × 6 = _ → 3 × 60 = _"
                options: ["18", "180", "1800", "9"]
                answer: ["18", "180"]
                hints: ["Sixty is six tens."]
              - id: l1-s2
                type: multiple_choice
                text: "4 × 50 = _"
                say: "Four times fifty."
                options: ["200", "20", "2000"]
                answer: "200"
                hints: ["4 × 5 tens = 20 tens."]
              - id: l1-s3
                type: text_input
                text: "8 × 30 = _"
                say: "Eight times thirty."
                answer: "240"
                hints: ["8 × 3 = 24, so it is 24 tens."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 2 × 90 = 180"
                say: "Two times ninety equals one hundred and eighty. Is it true?"
                answer: true
                hints: ["2 × 9 = 18, so 2 × 9 tens = 18 tens."]
              - id: l1-s5
                type: text_input
                text: "Tickets cost £20 each. How many pounds do 5 tickets cost?"
                answer: "100"
                hints: ["5 × 2 tens = 10 tens."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Use a fact you know: 8 × 40"
                say: "Eight times forty. Use a fact you know."
                frame: "8 × 4 = _ → 8 × 40 = _"
                options: ["32", "320", "3200", "12"]
                answer: ["32", "320"]
              - id: l1-n2
                type: text_input
                text: "3 × 90 = _"
                say: "Three times ninety."
                answer: "270"
              - id: l1-n3
                type: multiple_choice
                text: "Which is the same as 4 × 80?"
                say: "Which is the same as four times eighty?"
                options: ["32 tens", "32 ones", "32 hundreds"]
                answer: "32 tens"
              - id: l1-n4
                type: text_input
                text: "5 × 40 = _"
                say: "Five times forty."
                answer: "200"
              - id: l1-n5
                type: text_input
                text: "A bus has 50 seats. How many seats are there on 8 buses?"
                answer: "400"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "4 × 70 = _"
            say: "Four times seventy."
            answer: "280"
          - id: l1-c2
            type: multiple_choice
            text: "5 × 80 = _"
            say: "Five times eighty."
            options: ["400", "40", "4000"]
            answer: "400"
          - id: l1-c3
            type: true_false
            text: "Is it true? 3 × 50 = 150"
            say: "Three times fifty equals one hundred and fifty. Is it true?"
            answer: true
          - id: l1-c4
            type: text_input
            text: "5 × 50 = _"
            say: "Five times fifty."
            answer: "250"
          - id: l1-c5
            type: true_false
            text: "Is it true? 4 × 20 = 800"
            say: "Four times twenty equals eight hundred. Is it true?"
            answer: false
          - id: l1-c6
            type: text_input
            text: "A bag holds 30 marbles. How many marbles are in 2 bags?"
            answer: "60"

  - n: 2
    title: { de: "Teilen mit Zehnerzahlen", en: "Dividing tens" }
    goal:
      de: "Teile Zehnerzahlen mit einer Aufgabe, die du kennst, so wie 240 geteilt durch 6 ist 40, und prüf mit einer Malaufgabe."
      en: "Divide tens with a fact you know, like 240 divided by 6 is 40, and check with a times fact."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "4 × 60 = _"
            say: "Four times sixty."
            answer: "240"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is the same as 3 × 70?"
            say: "Which is the same as three times seventy?"
            options: ["21 tens", "21 ones", "21 hundreds"]
            answer: "21 tens"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "240 ÷ 6 = 24 tens ÷ 6"
            say: "Two hundred and forty divided by six. Two hundred and forty is twenty-four tens."
          - text: "24 tens ÷ 6 = 4 tens = 40"
            say: "Twenty-four divided by six is four. So twenty-four tens divided by six is four tens. Four tens are forty. Two hundred and forty divided by six is forty."
          - text: "Check: 6 × 40 = 240"
            say: "Check with the inverse. Six times forty is two hundred and forty, the number you started with. So the answer is right."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Use a fact you know: 150 ÷ 5"
                say: "One hundred and fifty divided by five. Use a fact you know."
                frame: "150 = _ tens → 15 ÷ 5 = _ → 150 ÷ 5 = _"
                options: ["15", "3", "30", "150", "300"]
                answer: ["15", "3", "30"]
                hints:
                  - "How many tens are in 150?"
                  - "150 is 15 tens, and 15 ÷ 5 = 3. So it is 3 tens."
                  - "15, 3, and 150 ÷ 5 = 30."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "320 ÷ 8 = _"
                say: "Three hundred and twenty divided by eight."
                options: ["40", "4", "400"]
                answer: "40"
                feedback:
                  "4": "32 ÷ 8 = 4, but 320 is 32 tens. 32 tens ÷ 8 = 4 tens, which is 40."
                hints:
                  - "320 is 32 tens."
                  - "32 ÷ 8 = 4, so 32 tens ÷ 8 = 4 tens."
                  - "4 tens are 40."
              - id: l2-f3
                type: text_input
                text: "120 ÷ 4 = _"
                say: "One hundred and twenty divided by four."
                answer: "30"
                hints:
                  - "120 is 12 tens."
                  - "12 ÷ 4 = 3, so it is 3 tens."
                  - "30."
              - id: l2-f4
                type: multiple_choice
                text: "Which multiplication checks 180 ÷ 3 = 60?"
                say: "Which multiplication checks one hundred and eighty divided by three equals sixty?"
                options: ["3 × 60 = 180", "3 × 180 = 540", "60 ÷ 3 = 20"]
                answer: "3 × 60 = 180"
                hints:
                  - "The inverse of dividing is multiplying."
                  - "Multiply the answer by the number you divided by."
                  - "3 × 60 = 180."
              - id: l2-f5
                type: text_input
                text: "Mr Patel shares 160 stickers equally between 4 tables. How many stickers does each table get?"
                answer: "40"
                hints:
                  - "Sharing equally is dividing: 160 ÷ 4."
                  - "160 is 16 tens, and 16 ÷ 4 = 4."
                  - "4 tens: 40 stickers."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Use a fact you know: 210 ÷ 3"
                say: "Two hundred and ten divided by three. Use a fact you know."
                frame: "210 = _ tens → 21 ÷ 3 = _ → 210 ÷ 3 = _"
                options: ["21", "7", "70", "700"]
                answer: ["21", "7", "70"]
                hints: ["210 is 21 tens."]
              - id: l2-s2
                type: multiple_choice
                text: "400 ÷ 5 = _"
                say: "Four hundred divided by five."
                options: ["80", "8", "800"]
                answer: "80"
                hints: ["400 is 40 tens."]
              - id: l2-s3
                type: text_input
                text: "240 ÷ 8 = _"
                say: "Two hundred and forty divided by eight."
                answer: "30"
                hints: ["24 tens ÷ 8."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 360 ÷ 4 = 9"
                say: "Three hundred and sixty divided by four equals nine. Is it true?"
                answer: false
                hints: ["360 is 36 tens. 36 ÷ 4 = 9, so is it 9 ones or 9 tens?"]
              - id: l2-s5
                type: text_input
                text: "A rope is 200 cm long. It is cut into 5 equal pieces. How long is each piece in cm?"
                answer: "40"
                hints: ["200 is 20 tens. 20 ÷ 5 = 4."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Use a fact you know: 180 ÷ 6"
                say: "One hundred and eighty divided by six. Use a fact you know."
                frame: "180 = _ tens → 18 ÷ 6 = _ → 180 ÷ 6 = _"
                options: ["18", "3", "30", "300"]
                answer: ["18", "3", "30"]
              - id: l2-n2
                type: text_input
                text: "350 ÷ 5 = _"
                say: "Three hundred and fifty divided by five."
                answer: "70"
              - id: l2-n3
                type: multiple_choice
                text: "Which multiplication checks 160 ÷ 8 = 20?"
                say: "Which multiplication checks one hundred and sixty divided by eight equals twenty?"
                options: ["8 × 20 = 160", "8 × 160 = 1280", "20 × 160 = 3200"]
                answer: "8 × 20 = 160"
              - id: l2-n4
                type: text_input
                text: "270 ÷ 3 = _"
                say: "Two hundred and seventy divided by three."
                answer: "90"
              - id: l2-n5
                type: text_input
                text: "Grandad shares £200 equally between 4 grandchildren. How many pounds does each child get?"
                answer: "50"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: multiply
            type: text_input
            text: "3 × 80 = _"
            say: "Three times eighty."
            answer: "240"
          - id: l2-c2
            part: multiply
            type: text_input
            text: "4 × 90 = _"
            say: "Four times ninety."
            answer: "360"
          - id: l2-c3
            part: divide
            type: text_input
            text: "250 ÷ 5 = _"
            say: "Two hundred and fifty divided by five."
            answer: "50"
          - id: l2-c4
            part: divide
            type: multiple_choice
            text: "640 ÷ 8 = _"
            say: "Six hundred and forty divided by eight."
            options: ["80", "8", "800"]
            answer: "80"
          - id: l2-c5
            part: in-context
            type: text_input
            text: "A pack has 60 stickers. How many stickers are there in 5 packs?"
            answer: "300"
          - id: l2-c6
            part: multiply
            type: text_input
            text: "8 × 60 = _"
            say: "Eight times sixty."
            answer: "480"
          - id: l2-c7
            part: multiply
            type: multiple_choice
            text: "3 × 30 = _"
            say: "Three times thirty."
            options: ["90", "9", "900"]
            answer: "90"
          - id: l2-c8
            part: multiply
            type: true_false
            text: "Is it true? 4 × 40 = 1600"
            say: "Four times forty equals one thousand six hundred. Is it true?"
            answer: false
          - id: l2-c9
            part: divide
            type: text_input
            text: "120 ÷ 3 = _"
            say: "One hundred and twenty divided by three."
            answer: "40"
          - id: l2-c10
            part: divide
            type: multiple_choice
            text: "280 ÷ 4 = _"
            say: "Two hundred and eighty divided by four."
            options: ["70", "7", "700"]
            answer: "70"
          - id: l2-c11
            part: divide
            type: true_false
            text: "Is it true? 560 ÷ 8 = 7"
            say: "Five hundred and sixty divided by eight equals seven. Is it true?"
            answer: false
          - id: l2-c12
            part: inverse
            type: true_false
            text: "Is it true? You can check 200 ÷ 5 = 40 with 5 × 40 = 200."
            say: "You can check two hundred divided by five equals forty with five times forty equals two hundred. Is it true?"
            answer: true
          - id: l2-c13
            part: inverse
            type: fill_in_blank
            text: "Fill the gaps."
            say: "One hundred and fifty divided by three. Fill the gaps."
            frame: "150 ÷ 3 = _, because 3 × _ = 150"
            options: ["5", "50", "500"]
            answer: ["50", "50"]
          - id: l2-c14
            part: inverse
            type: multiple_choice
            text: "Jay says 400 ÷ 8 = 5. Which check shows that he is wrong?"
            say: "Jay says four hundred divided by eight is five. Which check shows that he is wrong?"
            options: ["8 × 5 = 40, not 400", "8 + 5 = 13", "400 − 8 = 392"]
            answer: "8 × 5 = 40, not 400"
          - id: l2-c15
            part: inverse
            type: text_input
            text: "5 × _ = 450"
            say: "Five times what equals four hundred and fifty?"
            answer: "90"
          - id: l2-c16
            part: inverse
            type: multiple_choice
            text: "Which division goes with 2 × 80 = 160?"
            say: "Which division goes with two times eighty equals one hundred and sixty?"
            options: ["160 ÷ 2 = 80", "160 ÷ 2 = 8", "80 ÷ 2 = 160"]
            answer: "160 ÷ 2 = 80"
          - id: l2-c17
            part: in-context
            type: text_input
            text: "A minibus holds 20 children. How many children fit in 4 minibuses?"
            answer: "80"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "A farmer packs 240 apples equally into 4 boxes. How many apples go in each box?"
            options: ["60", "6", "600"]
            answer: "60"
          - id: l2-c19
            part: in-context
            type: text_input
            text: "Ice lollies cost 30p each. How many pence do 5 lollies cost?"
            answer: "150"
          - id: l2-c20
            part: in-context
            type: true_false
            text: "80 children are put into 2 equal teams. Is it true that each team has 40 children?"
            answer: true
