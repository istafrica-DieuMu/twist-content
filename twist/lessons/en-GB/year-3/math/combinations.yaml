# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.combinations
skill: math.chance.combinations
curriculum: en-GB
language: en
title:
  de: Wie viele Möglichkeiten?
  en: How many ways?
summary: >
  Lesson 1 matches every top with every pair of shorts in order (red top
  with blue, grey; yellow top with blue, grey: 4 outfits), so nothing is
  missed, records the outfits in a table, and sees that 2 tops and 3
  pairs of shorts make 2 × 3 = 6 outfits, not 2 + 3 = 5; lesson 2 makes
  numbers from digit cards in order (1 first, 2 first, 3 first), fills a
  menu table and counts the ways with a multiplication, and ends with the
  skill check. Drawing the tree or dressing a figure by dragging waits for
  a drawing or drag task.
metadata:
  year: year-3
  topic: { de: Kombinatorik, en: Combinations }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.data.sort-classify]
  also_practises: [math.data.sort-classify, math.mult-div.table-2-4-8, math.numbers-to-1000.place-value]
  vocabulary: { en: [combination, way, outfit, in order, table, tree diagram, digit card] }
  forms: [text, audio, drawn]
  drawn: [table]
  facets: []
  misconceptions:
    - id: adds-the-things
      what: Adds the choices instead of combining them (2 tops and 3 pairs of shorts make 5 outfits)
      addressed: lesson 1 Learn goes through every pair of shorts for each top; l1-f1 has feedback on 5; l1-s1, l1-n1, l1-s4, l1-c1, l2-f3, l2-n3 and l2-c1 offer the sum or ask about it
    - id: unsystematic
      what: Lists combinations at random and misses some or counts one twice
      addressed: both Learns go through the choices in a fixed order; l1-f2, l1-s2, l1-n2, l2-f2, l2-s2, l2-n2 and l2-c3 ask for the missing combination, with feedback in l2-f2; l1-f4, l1-s5 and l1-c3 fill the gap in a table
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Kleidung kombinieren", en: "Making outfits" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which one does not belong?\nshorts, skirt, apple, jumper"
            options: ["shorts", "skirt", "apple", "jumper"]
            answer: "apple"
            difficulty: easy
          - id: l1-w2
            type: sorting
            text: "Clothes or fruit?"
            bins:
              - { id: clothes, show: { text: "clothes" }, say: "clothes" }
              - { id: fruit, show: { text: "fruit" }, say: "fruit" }
            options:
              - { text: "coat", bin: clothes }
              - { text: "banana", bin: fruit }
              - { text: "hat", bin: clothes }
              - { text: "pear", bin: fruit }
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tops: red, yellow\nShorts: blue, grey"
            say: "Ruby has two tops, red and yellow, and two pairs of shorts, blue and grey. How many different outfits can she make?"
          - text: "red top → blue shorts, grey shorts\nyellow top → blue shorts, grey shorts"
            say: "Work in order so you miss nothing. Take the red top and go through every pair of shorts: blue, then grey. Then take the yellow top and do the same. This is a tree diagram written out: each top branches to every pair of shorts."
          - text: "Outfits table"
            say: "A table shows the same thing. Each row is a top, each column a pair of shorts, and each box is one outfit. There are four boxes, so four outfits."
            show: { drawn: table, rows: [["", "blue shorts", "grey shorts"], ["red top", "red + blue", "red + grey"], ["yellow top", "yellow + blue", "yellow + grey"]] }
          - text: "2 tops × 2 shorts = 4 outfits"
            say: "Each top goes with two pairs of shorts. Two tops times two pairs of shorts is four outfits. You multiply, you do not add."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ben has 2 tops: white and green.\nHe has 3 pairs of shorts: blue, black and brown.\nHow many different outfits can he make?"
                options: ["5", "6", "3"]
                answer: "6"
                feedback:
                  "5": "5 is 2 + 3. Each top goes with all 3 pairs of shorts: 3 outfits with white and 3 with green."
                hints:
                  - "Take one top and go through all the shorts."
                  - "White top: 3 outfits. Green top: 3 more."
                  - "3 + 3 = 6, or 2 × 3 = 6."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which outfit is missing?\nred top → blue shorts, grey shorts\nyellow top → blue shorts"
                options: ["yellow top with grey shorts", "red top with blue shorts", "red top with grey shorts"]
                answer: "yellow top with grey shorts"
                hints:
                  - "The red top has gone with every pair of shorts."
                  - "Which shorts has the yellow top not been with yet?"
                  - "Yellow top with grey shorts."
              - id: l1-f3
                type: fill_in_blank
                text: "Ella has 2 dresses and 3 pairs of shoes. Count the outfits."
                frame: "dress 1: _ outfits, dress 2: _ outfits, altogether: _"
                options: ["2", "3", "5", "6"]
                answer: ["3", "3", "6"]
                hints:
                  - "Each dress goes with every pair of shoes."
                  - "Each dress makes 3 outfits."
                  - "3, 3 and 6."
              - id: l1-f4
                type: multiple_choice
                text: "Which outfit goes in the empty box?"
                show: { drawn: table, rows: [["", "jeans", "shorts"], ["blue top", "blue + jeans", "blue + shorts"], ["pink top", "pink + jeans", "?"]] }
                options: ["pink + shorts", "blue + jeans", "pink + jeans"]
                answer: "pink + shorts"
                hints:
                  - "Each box is the top of its row with the bottoms of its column."
                  - "The empty box is in the pink top row and the shorts column."
                  - "Pink + shorts."
              - id: l1-f5
                type: true_false
                text: "Is it true? Lily has 3 skirts and 1 jumper. She can make 3 outfits."
                answer: true
                hints:
                  - "The one jumper goes with each skirt."
                  - "Count: skirt 1, skirt 2, skirt 3."
                  - "Yes, 3 outfits."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Tom has 2 jumpers and 4 pairs of trousers.\nHow many different outfits can he make?"
                options: ["6", "8", "4"]
                answer: "8"
                hints: ["Each jumper goes with all 4 pairs of trousers."]
              - id: l1-s2
                type: multiple_choice
                text: "Which outfit is missing?\nred hat → blue scarf, white scarf\ngreen hat → white scarf"
                options: ["green hat with blue scarf", "red hat with white scarf", "green hat with white scarf"]
                answer: "green hat with blue scarf"
                hints: ["Which scarf has the green hat not been with?"]
              - id: l1-s3
                type: multiple_choice
                text: "Mia has 3 hats and 3 scarves.\nHow many different ways can she wear one hat and one scarf?"
                options: ["6", "9", "3"]
                answer: "9"
                hints: ["Each hat makes 3 ways. There are 3 hats."]
              - id: l1-s4
                type: true_false
                text: "Is it true? Kai has 2 coats and 2 hats. He can make 2 outfits."
                answer: false
                hints: ["Each coat goes with both hats."]
              - id: l1-s5
                type: multiple_choice
                text: "Which outfit goes in the empty box?"
                show: { drawn: table, rows: [["", "trainers", "boots"], ["red coat", "?", "red + boots"], ["green coat", "green + trainers", "green + boots"]] }
                options: ["red + trainers", "green + boots", "red + boots"]
                answer: "red + trainers"
                hints: ["Read the row name and the column name of the empty box."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Leah has 3 T-shirts and 2 pairs of shorts.\nHow many different outfits can she make?"
                options: ["5", "6", "8"]
                answer: "6"
              - id: l1-n2
                type: multiple_choice
                text: "Which outfit is missing?\nblue top → red, yellow, green shorts\nwhite top → red, green shorts"
                options: ["white top with yellow shorts", "blue top with yellow shorts", "white top with red shorts"]
                answer: "white top with yellow shorts"
              - id: l1-n3
                type: multiple_choice
                text: "Paul has 4 T-shirts and 2 pairs of shorts.\nHow many different outfits can he make?"
                options: ["6", "8", "4"]
                answer: "8"
              - id: l1-n4
                type: true_false
                text: "Is it true? Emma has 2 hats and 3 scarves. She can make 5 outfits."
                answer: false
              - id: l1-n5
                type: text_input
                text: "A sandwich can be cheese or ham. The drink can be juice, milk or water. How many different lunches of one sandwich and one drink are there?"
                answer: "6"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Jonah has 2 caps and 4 scarves.\nHow many different ways can he wear one cap and one scarf?"
            options: ["6", "8", "2"]
            answer: "8"
          - id: l1-c2
            type: multiple_choice
            text: "Which outfit is missing?\nstriped top → jeans, shorts\nspotty top → shorts"
            options: ["spotty top with jeans", "striped top with jeans", "spotty top with shorts"]
            answer: "spotty top with jeans"
          - id: l1-c3
            type: multiple_choice
            text: "Which outfit goes in the empty box?"
            show: { drawn: table, rows: [["", "skirt", "trousers"], ["yellow top", "yellow + skirt", "yellow + trousers"], ["purple top", "?", "purple + trousers"]] }
            options: ["purple + skirt", "yellow + skirt", "purple + trousers"]
            answer: "purple + skirt"

  - n: 2
    title: { de: "Zahlen legen und Menüs", en: "Digit cards and menus" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Sam has 2 tops and 2 pairs of trousers.\nHow many different outfits can he make?"
            options: ["4", "2", "3"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which outfit is missing?\nhot chocolate → toast, muffin\ntea → muffin"
            options: ["tea with toast", "hot chocolate with toast", "tea with muffin"]
            answer: "tea with toast"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Cards: 1, 2, 3\n1 first: 12, 13"
            say: "You have three digit cards: one, two and three. How many two-digit numbers can you make with two of them? Work in order. Put the one first: twelve and thirteen."
          - text: "1 first: 12, 13\n2 first: 21, 23\n3 first: 31, 32"
            say: "Then put the two first: twenty-one and twenty-three. Then the three: thirty-one and thirty-two. Each card comes first twice, so there are three times two, which is six numbers."
          - text: "Starter: soup or salad. Main: pizza, pasta or fish."
            say: "A café menu has two starters and three main courses. In a table, each starter row has a box for every main course: two rows of three boxes. Two times three is six different meals."
            show: { drawn: table, rows: [["", "pizza", "pasta", "fish"], ["soup", "soup + pizza", "soup + pasta", "soup + fish"], ["salad", "salad + pizza", "salad + pasta", "salad + fish"]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Cards: 4, 5\nWhich two-digit numbers can you make?"
                options: ["45 and 54", "only 45", "45, 54 and 9"]
                answer: "45 and 54"
                hints:
                  - "Put each card first in turn."
                  - "4 first gives 45. 5 first gives ..."
                  - "45 and 54."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Cards: 3, 6, 8\n36, 38, 63, 68, 83\nWhich number is missing?"
                options: ["86", "33", "88"]
                answer: "86"
                feedback:
                  "33": "You have only one 3 card, so you cannot use 3 twice."
                hints:
                  - "Sort the numbers by their first digit."
                  - "3 first: 36, 38. 6 first: 63, 68. 8 first: only 83."
                  - "8 first is missing 86."
              - id: l2-f3
                type: multiple_choice
                text: "A café has 3 kinds of sandwich and 4 kinds of drink. How many ways can you choose one sandwich and one drink?"
                options: ["7", "12", "10"]
                answer: "12"
                hints:
                  - "Each sandwich goes with every drink."
                  - "That is 3 rows of 4 boxes in a table."
                  - "3 × 4 = 12."
              - id: l2-f4
                type: multiple_choice
                text: "Which meal goes in the empty box?"
                show: { drawn: table, rows: [["", "chips", "rice"], ["chicken", "chicken + chips", "chicken + rice"], ["fish", "fish + chips", "?"], ["beans", "beans + chips", "beans + rice"]] }
                options: ["fish + rice", "fish + chips", "beans + rice"]
                answer: "fish + rice"
                hints:
                  - "Find the row and the column of the empty box."
                  - "It is in the fish row and the rice column."
                  - "Fish + rice."
              - id: l2-f5
                type: multiple_choice
                text: "Cards: 1, 4, 9\nWhat is the biggest two-digit number you can make?"
                options: ["94", "91", "49"]
                answer: "94"
                hints:
                  - "Put the biggest digit in the tens place."
                  - "9 goes first. Which card is next biggest?"
                  - "94."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Cards: 6, 8\nWhich two-digit numbers can you make?"
                options: ["68 and 86", "only 68", "68, 86 and 14"]
                answer: "68 and 86"
                hints: ["Each card has a turn first."]
              - id: l2-s2
                type: multiple_choice
                text: "Cards: 2, 4, 9\n24, 29, 42, 49, 94\nWhich number is missing?"
                options: ["92", "22", "99"]
                answer: "92"
                hints: ["Sort them by the first digit."]
              - id: l2-s3
                type: multiple_choice
                text: "Ice creams come in 4 flavours with 2 kinds of topping. How many ways can you choose one flavour and one topping?"
                options: ["6", "8", "4"]
                answer: "8"
                hints: ["4 rows of 2 in a table."]
              - id: l2-s4
                type: true_false
                text: "Is it true? With the cards 1, 3 and 5 you can make 6 two-digit numbers."
                answer: true
                hints: ["Each card comes first twice."]
              - id: l2-s5
                type: multiple_choice
                text: "Cards: 2, 7, 5\nWhat is the smallest two-digit number you can make?"
                options: ["25", "27", "52"]
                answer: "25"
                hints: ["Put the smallest digit in the tens place."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Cards: 3, 7\nWhich two-digit numbers can you make?"
                options: ["37 and 73", "only 37", "37, 73 and 10"]
                answer: "37 and 73"
              - id: l2-n2
                type: multiple_choice
                text: "Cards: 1, 5, 6\n15, 16, 51, 56, 65\nWhich number is missing?"
                options: ["61", "11", "66"]
                answer: "61"
              - id: l2-n3
                type: text_input
                text: "A pizza can have a thin or a thick base, and one topping from cheese, ham, mushroom or pepper. How many different pizzas are there?"
                answer: "8"
              - id: l2-n4
                type: true_false
                text: "Is it true? With the cards 2, 4 and 8 you can make 3 two-digit numbers."
                answer: false
              - id: l2-n5
                type: text_input
                text: "Jess has 5 T-shirts and 2 pairs of shorts. How many different outfits can she make?"
                answer: "10"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Amir has 4 jumpers and 3 pairs of trousers.\nHow many different outfits can he make?"
            options: ["7", "12", "4"]
            answer: "12"
          - id: l2-c2
            type: multiple_choice
            text: "Cards: 2, 6\nWhich two-digit numbers can you make?"
            options: ["26 and 62", "only 26", "26, 62 and 8"]
            answer: "26 and 62"
          - id: l2-c3
            type: multiple_choice
            text: "Cards: 4, 7, 9\n47, 49, 74, 94, 97\nWhich number is missing?"
            options: ["79", "44", "77"]
            answer: "79"
          - id: l2-c4
            type: multiple_choice
            text: "Which meal goes in the empty box?"
            show: { drawn: table, rows: [["", "apple", "yoghurt"], ["pasta", "pasta + apple", "?"], ["soup", "soup + apple", "soup + yoghurt"]] }
            options: ["pasta + yoghurt", "soup + yoghurt", "pasta + apple"]
            answer: "pasta + yoghurt"
          - id: l2-c5
            type: text_input
            text: "A school lunch is one of 3 mains and one of 5 puddings. How many different lunches are there?"
            answer: "15"
