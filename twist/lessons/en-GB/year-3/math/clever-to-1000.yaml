# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.clever-to-1000
skill: math.add-sub-to-1000.clever
curriculum: en-GB
language: en
title:
  de: Geschickt rechnen bis 1000
  en: Clever ways to calculate to 1000
summary: >
  Efficient mental methods within 1000 and choosing one that suits the
  numbers. Lesson 1 rounds to a whole hundred and adjusts (458 + 199 =
  458 + 200 − 1, 734 − 298 = 734 − 300 + 2); lesson 2 keeps the same
  difference by changing both numbers of a subtraction (523 − 197 = 526 −
  200), uses tens facts (350 + 450), chooses a method for each
  calculation, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-1000.semi-written, math.add-sub-to-100.clever]
  also_practises: [math.add-sub-to-1000.semi-written, math.add-sub-to-1000.hundreds]
  vocabulary: { en: [round and adjust, near a hundred, same difference, count on, method, efficient] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: []
  parts:
    - { id: helper, what: { de: mit einer Hilfsaufgabe rechnen und das Ergebnis richtigstellen, en: rounding to a hundred and adjusting } }
    - { id: same-change, what: { de: bei Minusaufgaben beide Zahlen gleichsinnig verändern, en: keeping the same difference by changing both numbers } }
    - { id: choose, what: { de: einen passenden Rechenweg wählen, en: choosing a method that suits the numbers } }
  misconceptions:
    - id: adjust-wrong-way
      what: Puts the rounding right in the wrong direction (645 − 399 = 645 − 400 − 1)
      addressed: lesson 1 Learn adjusts both ways on the empty number line; l1-f2 and l1-f3 have feedback on the wrong way; l1-s4, l1-c3 and l2-w2 offer it again
    - id: always-take-away
      what: Takes away after rounding even when the number was just above the hundred (286 + 403 = 286 + 400 − 3)
      addressed: l1-f4, l1-s3, l1-n4 and l2-c5 round a number just above a hundred
    - id: same-difference-opposite
      what: Changes the two numbers of a subtraction in opposite directions (435 − 196 = 431 − 200)
      addressed: lesson 2 Learn adds the same to both; l2-f2 (with feedback), l2-s4 and l2-c3 offer the opposite change
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Mit Hunderterzahlen runden und ausgleichen, en: Round and adjust }
    goal:
      de: "Runde eine Zahl, die fast ein Hunderter ist, und gleiche dann aus. Für 458 + 199 rechnest du plus 200 und dann minus 1."
      en: "Round a number that is nearly a hundred, then adjust. For 458 + 199, add 200, then take away 1."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "45 + 19 = _"
            say: "Forty-five add nineteen."
            answer: "64"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Count on: 503 − 496 = _"
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "458 + 200 = 658\n458 + 199: more or less than 658? Guess!"
            say: "Four hundred and fifty-eight add two hundred is six hundred and fifty-eight. So what about four hundred and fifty-eight add one hundred and ninety-nine? Do you think it is more than six hundred and fifty-eight, or less? Have a guess."
          - text: "458 + 199"
            say: "Four hundred and fifty-eight add one hundred and ninety-nine. One hundred and ninety-nine is very close to two hundred. So add two hundred instead: six hundred and fifty-eight."
            show: { drawn: rechenstrich, start: 458, jumps: [200, -1] }
          - text: "458 + 200 − 1 = 657"
            say: "But two hundred is one more than one hundred and ninety-nine. You added one too many, so take one away again: six hundred and fifty-seven, one less than six hundred and fifty-eight. Round, then adjust."
          - text: "734 − 298 = 734 − 300 + 2 = 436"
            say: "Seven hundred and thirty-four subtract two hundred and ninety-eight. Subtract three hundred instead: four hundred and thirty-four. You took away two too many, so add two back: four hundred and thirty-six."
            show: { drawn: rechenstrich, start: 734, jumps: [-300, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Round and adjust: 367 + 199"
                say: "Round and adjust. Three hundred and sixty-seven add one hundred and ninety-nine."
                frame: "367 + 200 = _ → − 1 = _"
                options: ["567", "566", "568"]
                answer: ["567", "566"]
                hints:
                  - "Add the whole hundred first, then put it right."
                  - "367 + 200 = 567. You added 1 too many."
                  - "567, then 566."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "You work out 523 + 298 as 523 + 300. What do you do next?"
                options: ["take 2 away", "add 2 more", "take 3 away"]
                answer: "take 2 away"
                feedback:
                  "add 2 more": "300 is 2 more than 298, so you added 2 too many. Take them away again."
                hints:
                  - "Is 300 more or less than 298?"
                  - "300 is 2 more than 298, so you added 2 too many."
                  - "Take 2 away."
              - id: l1-f3
                type: multiple_choice
                text: "You work out 645 − 399 as 645 − 400. What do you do next?"
                options: ["add 1 back", "take 1 more away", "add 4 back"]
                answer: "add 1 back"
                feedback:
                  "take 1 more away": "You took away 400, which is 1 more than 399. You took away too much, so give 1 back."
                hints:
                  - "Did you take away too much or too little?"
                  - "400 is 1 more than 399, so you took away 1 too many."
                  - "Add 1 back."
              - id: l1-f4
                type: text_input
                text: "A pirate has 286 gold coins. She digs up a chest with 403 more. How many coins has she got now?"
                answer: "689"
                hints:
                  - "403 is close to 400. Is it more or less than 400?"
                  - "403 is 3 more than 400. Add 400, then add 3 more."
                  - "286 + 400 = 686, and 686 + 3 = 689."
              - id: l1-f5
                type: text_input
                text: "812 − 197 = _"
                say: "Eight hundred and twelve subtract one hundred and ninety-seven."
                answer: "615"
                hints:
                  - "197 is close to 200."
                  - "812 − 200 = 612. You took away 3 too many."
                  - "612 + 3 = 615."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Round and adjust: 274 + 299"
                say: "Round and adjust. Two hundred and seventy-four add two hundred and ninety-nine."
                frame: "274 + 300 = _ → − 1 = _"
                options: ["574", "573", "575"]
                answer: ["574", "573"]
                hints: ["300 is 1 more than 299."]
              - id: l1-s2
                type: fill_in_blank
                text: "Round and adjust: 563 − 298"
                say: "Round and adjust. Five hundred and sixty-three subtract two hundred and ninety-eight."
                frame: "563 − 300 = _ → + 2 = _"
                options: ["263", "265", "261"]
                answer: ["263", "265"]
                hints: ["You took away 2 too many, so add 2 back."]
              - id: l1-s3
                type: text_input
                text: "348 + 501 = _"
                say: "Three hundred and forty-eight add five hundred and one."
                answer: "849"
                hints: ["501 is 1 more than 500."]
              - id: l1-s4
                type: multiple_choice
                text: "Which way works out 726 − 499?"
                options: ["726 − 500 + 1", "726 − 500 − 1", "726 + 500 − 1"]
                answer: "726 − 500 + 1"
                hints: ["Taking away 500 takes away 1 too many."]
              - id: l1-s5
                type: text_input
                text: "A shop has 650 stickers. It sells 199 of them. How many stickers are left?"
                answer: "451"
                hints: ["Take away 200, then put 1 back."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Round and adjust: 435 + 398"
                say: "Round and adjust. Four hundred and thirty-five add three hundred and ninety-eight."
                frame: "435 + 400 = _ → − 2 = _"
                options: ["835", "833", "837"]
                answer: ["835", "833"]
              - id: l1-n2
                type: text_input
                text: "941 − 299 = _"
                answer: "642"
              - id: l1-n3
                type: text_input
                text: "517 + 299 = _"
                answer: "816"
              - id: l1-n4
                type: multiple_choice
                text: "Which way works out 384 + 302?"
                options: ["384 + 300 + 2", "384 + 300 − 2", "384 + 400 − 2"]
                answer: "384 + 300 + 2"
              - id: l1-n5
                type: text_input
                text: "Zara has 385 points. She scores 198 more. How many points has she got now?"
                answer: "583"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "256 + 399 = _"
            answer: "655"
          - id: l1-c2
            type: text_input
            text: "823 − 498 = _"
            answer: "325"
          - id: l1-c3
            type: multiple_choice
            text: "You work out 472 + 197 as 472 + 200. What do you do next?"
            options: ["take 3 away", "add 3 more", "take 2 away"]
            answer: "take 3 away"
          - id: l1-c4
            type: fill_in_blank
            text: "Round and adjust: 318 + 499"
            say: "Round and adjust. Three hundred and eighteen add four hundred and ninety-nine."
            frame: "318 + 500 = _ → − 1 = _"
            options: ["818", "817", "819"]
            answer: ["818", "817"]
          - id: l1-c5
            type: text_input
            text: "706 − 399 = _"
            answer: "307"
          - id: l1-c6
            type: true_false
            text: "Is it true? 645 − 298 = 645 − 300 − 2"
            answer: false

  - n: 2
    title: { de: Gleichsinnig verändern und den Weg wählen, en: Same difference and choosing a method }
    goal:
      de: "Schau dir zuerst die Zahlen an und wähle einen geschickten Weg. 523 − 197 ergibt zum Beispiel dasselbe wie 526 − 200."
      en: "Look at the numbers first and pick a clever way. 523 − 197 gives the same answer as 526 − 200."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "364 + 199 = _"
            answer: "563"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which way works out 615 − 298?"
            options: ["615 − 300 + 2", "615 − 300 − 2", "615 + 300 − 2"]
            answer: "615 − 300 + 2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "523 − 197\n526 − 200\nSame answer or not? Guess!"
            say: "Look at these two: five hundred and twenty-three subtract one hundred and ninety-seven, and five hundred and twenty-six subtract two hundred. Do you think they give the same answer? Have a guess."
          - text: "523 − 197 = 526 − 200 = 326"
            say: "They do! Here is another clever way. Add three to both numbers: five hundred and twenty-six subtract two hundred. Both numbers moved up by three, so the difference between them stays the same. Five hundred and twenty-six subtract two hundred is three hundred and twenty-six."
          - text: "350 + 450\n35 tens + 45 tens = 80 tens = 800"
            say: "Three hundred and fifty add four hundred and fifty. Think in tens: thirty-five tens add forty-five tens is eighty tens. Eighty tens are eight hundred. A fact you know can do the work."
          - text: "Did you know? 1 + 2 + 3 + ... + 100 = 5050\n1 + 100, 2 + 99, 3 + 98 ..."
            say: "Did you know? If you add up all the numbers from one to one hundred, you get five thousand and fifty. There is a clever way: pair them up. One and one hundred make one hundred and one. Two and ninety-nine make one hundred and one too. There are fifty pairs, and fifty lots of one hundred and one is five thousand and fifty!"
          - text: "458 + 199: round and adjust\n503 − 496: count on\n350 + 450: tens facts\n357 + 486: written steps"
            say: "Before you start, look at the numbers. A number close to a hundred: round and adjust. Two numbers close together: count on. Tens and hundreds: use a fact you know. When nothing is easy, write the steps down."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Same difference: 612 − 298"
                say: "Keep the same difference. Six hundred and twelve subtract two hundred and ninety-eight."
                frame: "612 − 298 = 614 − _ = _"
                options: ["300", "296", "314", "310"]
                answer: ["300", "314"]
                hints:
                  - "Add the same amount to both numbers, so that 298 becomes a whole hundred."
                  - "298 + 2 = 300, and 612 + 2 = 614."
                  - "614 − 300 = 314."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which calculation has the same difference as 435 − 196?"
                options: ["439 − 200", "431 − 200", "435 − 200"]
                answer: "439 − 200"
                feedback:
                  "431 − 200": "You added 4 to 196 but took 4 from 435, so the gap changed. Add 4 to both numbers."
                hints:
                  - "Both numbers must change by the same amount, in the same direction."
                  - "196 + 4 = 200, so 435 gets 4 more as well."
                  - "439 − 200."
              - id: l2-f3
                type: multiple_choice
                text: "Which way suits 503 − 497 best?"
                options: ["count on from 497", "round and adjust", "jump back 400, 90 and 7"]
                answer: "count on from 497"
                feedback:
                  "jump back 400, 90 and 7": "That works, but it is a lot of steps. The numbers are only a little way apart, so counting on is quicker."
                hints:
                  - "How far apart are 497 and 503?"
                  - "They are very close together, so there is only a small gap to find."
                  - "Count on from 497: 3 to 500, then 3 more."
              - id: l2-f4
                type: multiple_choice
                text: "Which way suits 346 + 299 best?"
                options: ["round and adjust", "count on", "same difference"]
                answer: "round and adjust"
                hints:
                  - "Is one of the numbers close to a whole hundred?"
                  - "299 is only 1 less than 300."
                  - "Round and adjust: 346 + 300 − 1."
              - id: l2-f5
                type: text_input
                text: "250 + 650 = _"
                say: "Two hundred and fifty add six hundred and fifty. Think in tens."
                answer: "900"
                hints:
                  - "Think in tens: 25 tens add 65 tens."
                  - "25 + 65 = 90, so it is 90 tens."
                  - "90 tens are 900."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Same difference: 724 − 397"
                say: "Keep the same difference. Seven hundred and twenty-four subtract three hundred and ninety-seven."
                frame: "724 − 397 = 727 − _ = _"
                options: ["400", "394", "327", "323"]
                answer: ["400", "327"]
                hints: ["Add 3 to both numbers."]
              - id: l2-s2
                type: multiple_choice
                text: "Which way suits 802 − 795 best?"
                options: ["count on from 795", "round and adjust", "jump back 700, 90 and 5"]
                answer: "count on from 795"
                hints: ["How far apart are the two numbers?"]
              - id: l2-s3
                type: text_input
                text: "567 − 199 = _"
                answer: "368"
                hints: ["Take away 200, then put 1 back."]
              - id: l2-s4
                type: multiple_choice
                text: "Which calculation has the same difference as 851 − 298?"
                options: ["853 − 300", "849 − 300", "851 − 300"]
                answer: "853 − 300"
                hints: ["298 gets 2 more. What must 851 get?"]
              - id: l2-s5
                type: text_input
                text: "260 + 540 = _"
                say: "Two hundred and sixty add five hundred and forty."
                answer: "800"
                hints: ["Think in tens: 26 tens add 54 tens."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Same difference: 543 − 299 = _"
                answer: "244"
              - id: l2-n2
                type: multiple_choice
                text: "Which way suits 677 + 198 best?"
                options: ["round and adjust", "count on from 198", "same difference"]
                answer: "round and adjust"
              - id: l2-n3
                type: text_input
                text: "604 − 597 = _"
                answer: "7"
              - id: l2-n4
                type: text_input
                text: "370 + 230 = _"
                answer: "600"
              - id: l2-n5
                type: text_input
                text: "A train has 412 seats. 298 people get on. How many seats are still free?"
                answer: "114"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: helper
            type: text_input
            text: "538 + 299 = _"
            answer: "837"
          - id: l2-c2
            part: helper
            type: text_input
            text: "915 − 398 = _"
            answer: "517"
          - id: l2-c3
            part: same-change
            type: multiple_choice
            text: "Which calculation has the same difference as 632 − 395?"
            options: ["637 − 400", "627 − 400", "632 − 400"]
            answer: "637 − 400"
          - id: l2-c4
            part: choose
            type: multiple_choice
            text: "Which way suits 401 − 394 best?"
            options: ["count on from 394", "round and adjust", "jump back 300, 90 and 4"]
            answer: "count on from 394"
          - id: l2-c5
            part: helper
            type: multiple_choice
            text: "Which way works out 457 − 302?"
            options: ["457 − 300 − 2", "457 + 300 − 2", "457 − 300 + 2"]
            answer: "457 − 300 − 2"
          - id: l2-c6
            part: helper
            type: fill_in_blank
            text: "Round and adjust: 426 + 298"
            say: "Round and adjust. Four hundred and twenty-six add two hundred and ninety-eight."
            frame: "426 + 300 = _ → − 2 = _"
            options: ["726", "724", "728"]
            answer: ["726", "724"]
          - id: l2-c7
            part: helper
            type: text_input
            text: "763 − 499 = _"
            answer: "264"
          - id: l2-c8
            part: helper
            type: multiple_choice
            text: "You work out 581 − 297 as 581 − 300. What do you do next?"
            options: ["add 3 back", "take 3 more away", "add 2 back"]
            answer: "add 3 back"
          - id: l2-c9
            part: helper
            type: text_input
            text: "A farmer has 475 sheep. He buys 199 more. How many sheep has he got now?"
            answer: "674"
          - id: l2-c10
            part: same-change
            type: fill_in_blank
            text: "Same difference: 831 − 296"
            say: "Keep the same difference. Eight hundred and thirty-one subtract two hundred and ninety-six."
            frame: "831 − 296 = 835 − _ = _"
            options: ["300", "292", "535", "531"]
            answer: ["300", "535"]
          - id: l2-c11
            part: same-change
            type: true_false
            text: "Is it true? 744 − 397 has the same difference as 741 − 400."
            answer: false
          - id: l2-c12
            part: same-change
            type: text_input
            text: "Same difference: 625 − 298 = _"
            answer: "327"
          - id: l2-c13
            part: same-change
            type: true_false
            text: "Is it true? 512 − 196 = 516 − 200"
            answer: true
          - id: l2-c14
            part: same-change
            type: fill_in_blank
            text: "Same difference: 903 − 498"
            say: "Keep the same difference. Nine hundred and three subtract four hundred and ninety-eight."
            frame: "903 − 498 = _ − 500 = _"
            options: ["905", "901", "405", "401"]
            answer: ["905", "405"]
          - id: l2-c15
            part: choose
            type: multiple_choice
            text: "Which calculation is easiest to do by rounding and adjusting?"
            options: ["462 + 399", "462 + 357", "503 − 496"]
            answer: "462 + 399"
          - id: l2-c16
            part: choose
            type: multiple_choice
            text: "Which calculation suits counting on?"
            options: ["702 − 695", "702 − 357", "350 + 450"]
            answer: "702 − 695"
          - id: l2-c17
            part: choose
            type: multiple_choice
            text: "Which way suits 450 + 350 best?"
            options: ["use a tens fact", "count on", "same difference"]
            answer: "use a tens fact"
          - id: l2-c18
            part: choose
            type: multiple_choice
            text: "Which way suits 386 + 457 best?"
            options: ["write the steps down", "round and adjust", "count on"]
            answer: "write the steps down"
          - id: l2-c19
            part: choose
            type: text_input
            text: "801 − 796 = _"
            answer: "5"
          - id: l2-c20
            part: choose
            type: true_false
            text: "Is it true? Round and adjust is a good way to work out 548 + 201."
            answer: true
