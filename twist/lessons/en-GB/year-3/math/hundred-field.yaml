    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many tens are in 60?"
            say: "How many tens are there in sixty?"
            options: ["6", "60", "16"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What number is this?"
            say: "What number do the tens and ones make?"
            show: { drawn: base-ten, tens: 2, ones: 7 }
            options: ["27", "72", "9"]
            answer: "27"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "100"
            say: "This is a 100-dot grid. It has ten rows of ten dots: one hundred dots."
            show: { drawn: hundred-field, filled: 100 }
          - text: "50"
            say: "There is a gap across the middle. Above it are five rows. Five rows are fifty, half of one hundred."
            show: { drawn: hundred-field, filled: 50 }
          - text: "37"
            say: "Three full rows are thirty. In the next row there are five up to the gap, and two more: seven. Thirty and seven make thirty-seven."
            show: { drawn: hundred-field, filled: 37 }

      - activity: practise
