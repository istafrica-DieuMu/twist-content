        screens:
          - text: "Look quickly"
            say: "This grid only stays for a moment. Look at the full rows and the gaps. Then you know the number without counting every dot."
            show: { drawn: hundred-field, filled: 60, flash: 2 }
          - text: "60 + 40 = 100"
            say: "It was six rows: five above the gap and one more. That is sixty. How many dots are white? Four rows, forty. Sixty and forty make one hundred."
            show: { drawn: hundred-field, filled: 60 }
          - text: "63 + 37 = 100"
            say: "Now sixty-three are red. The open row has seven white dots, and below it are three white rows, thirty. Thirty and seven make thirty-seven. Sixty-three and thirty-seven make one hundred. The ones make ten, and the tens make ninety."
