# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.hundred-field
skill: math.numbers-to-100.hundred-field
curriculum: en-GB
language: en
title:
  de: Das Hunderterfeld
  en: The 100-dot grid
summary: >
  The 100-dot grid is ten rows of ten dots with a gap after five each
  way, so amounts can be read without counting each dot. Lesson 1 reads
  full rows as tens and the rest of a row using the five-gap; lesson 2
  reads amounts at a glance, finds what is missing to make 100, also for
  numbers that are not whole tens (63 + 37), and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-100.place-value]
  also_practises: [math.add-sub-to-100.complement]
  vocabulary: { en: [100-dot grid, row, tens, ones, half, missing, make 100] }
  forms: [drawn, text, audio]
  drawn: [hundred-field, base-ten]
  facets: []
  parts:
    - { id: read, what: { de: Anzahlen am Hunderterfeld ablesen, en: reading an amount on the 100-dot grid } }
    - { id: show, what: { de: das Hunderterfeld zu einer Zahl finden, en: finding the grid that shows a number } }
    - { id: glance, what: { de: Anzahlen auf einen Blick erkennen, en: reading an amount at a glance } }
    - { id: make-100, what: { de: "ablesen, was bis 100 fehlt", en: finding what makes 100 } }
  misconceptions:
    - id: dot-by-dot
      what: Counts every dot one by one and loses count
      addressed: Learn reads whole rows as tens and uses the five-gap; flash tasks make counting one by one impossible
    - id: half-is-fifty
      what: Does not see that the five rows above the middle gap are 50
      addressed: lesson 1 Learn shows the middle gap as the half; tasks around 50 use it
    - id: complement-tens-and-ones
      what: Makes both the tens and the ones up to ten for 100 (63 + 47)
      addressed: lesson 2 Learn shows the white dots of 63 as 3 white rows and 7 in the open row; feedback names the extra ten in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
