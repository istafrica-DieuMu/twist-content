                options: ["29", "39", "30"]
                answer: ["29"]
                feedback:
                  "39": "That is one ten too many. The ones make ten, 1 and 9, so the tens only need to make ninety: 70 and 20."
                hints:
                  - "Count the white dots in the open row, then the white rows."
