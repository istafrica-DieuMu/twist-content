# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.add-carry
skill: math.written-add-sub.add-carry
curriculum: en-GB
language: en
title:
  de: Schriftlich addieren mit Übertrag
  en: Column addition with exchanging
summary: >
  Column addition where a column makes ten or more. Lesson 1 exchanges ten
  ones for a ten and carries it into the tens column (347 + 238); lesson 2
  exchanges ten tens for a hundred, exchanges twice in one calculation,
  explains what the carried digit is worth, and ends with the skill
  check.
metadata:
  year: year-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.add-no-carry]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { en: [column addition, exchange, carry, carried digit, ones, tens, hundreds] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: one-carry, what: { de: mit einem Übertrag schriftlich addieren, en: column addition with one exchange } }
    - { id: two-carries, what: { de: mit zwei Überträgen schriftlich addieren, en: column addition with two exchanges } }
    - { id: meaning, what: { de: "sagen, was man hinschreibt und was der Übertrag bedeutet", en: saying what to write and what the carried digit means } }
    - { id: check, what: { de: Rechnungen prüfen und Fehler finden, en: checking calculations and finding mistakes } }
  misconceptions:
    - id: writes-both-digits
      what: Writes the whole column total in the answer (13 in the ones column)
      addressed: lesson 1 Learn splits 15 ones into a ten and five ones; l1-f1 and l2-f2 have feedback on it; l1-s4 and l2-s4 ask again
    - id: forgets-carry
      what: Exchanges but does not add the carried digit (519 + 264 = 773)
      addressed: l1-f4, l1-n3, l2-f4, l2-n3 and l2-c5 show a calculation with the carried digit left out
    - id: carry-worth-one
      what: Thinks the carried 1 is worth one
      addressed: l1-f5 (with feedback), l1-c2, l2-f5 and l2-c4 ask what the carried digit stands for
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Einer in einen Zehner tauschen, en: Exchanging ones for a ten }
    goal:
      de: "Rechne schriftlich plus, und wenn die Einer 10 oder mehr ergeben, trag den Zehner weiter, so wie bei 347 + 238."
      en: "Add in columns, and when the ones make 10 or more, carry the ten into the tens, like 347 + 238."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Add in columns."
            say: "Add four hundred and thirteen and two hundred and sixty-five in columns."
            show: { drawn: written-calc, rows: ["413", "265"], op: "+" }
            answer: "678"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "10 ones are the same as _"
            options: ["1 ten", "10 tens", "1 hundred"]
            answer: "1 ten"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "347 + 238"
            say: "Three hundred and forty-seven add two hundred and thirty-eight. Start with the ones: seven add eight is fifteen. Fifteen has two digits, but only one digit fits in a column."
            show: { drawn: written-calc, rows: ["347", "238"], op: "+" }
          - text: "15 ones = 1 ten and 5 ones"
            say: "Fifteen ones are one ten and five ones. Write the five in the ones column. Exchange the ten: write a small one in the tens column, so you remember to add it."
            show: { drawn: written-calc, rows: ["347", "238"], op: "+", carry: " 1 ", result: "__5" }
          - text: "1 + 4 + 3 = 8\n3 + 2 = 5"
            say: "Tens: the one you carried, add four, add three, makes eight tens. Hundreds: three add two is five. The answer is five hundred and eighty-five."
            show: { drawn: written-calc, rows: ["347", "238"], op: "+", carry: " 1 ", result: "585" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ones: 6 + 7 = 13. What do you write in the ones column?"
                show: { drawn: written-calc, rows: ["256", "137"], op: "+" }
                options: ["3", "13", "1"]
                answer: "3"
                feedback:
                  "13": "Only one digit fits in a column. 13 ones are 1 ten and 3 ones: write the 3 and carry the ten."
                hints:
                  - "13 ones are more than ten."
                  - "13 ones are 1 ten and 3 ones. The ten moves to the tens column."
                  - "Write 3 in the ones column."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Add in columns. Remember the carried 1."
                show: { drawn: written-calc, rows: ["256", "137"], op: "+", carry: " 1 ", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["3", "9", "8", "4"]
                answer: ["3", "9", "3"]
                hints:
                  - "Ones: 6 add 7 is 13. Write the 3."
                  - "Tens: the carried 1, add 5, add 3. Hundreds: 2 add 1."
                  - "O: 3, T: 9, H: 3. The answer is 393."
              - id: l1-f3
                type: text_input
                text: "Add in columns."
                say: "Add four hundred and twenty-eight and three hundred and forty-five in columns."
                show: { drawn: written-calc, rows: ["428", "345"], op: "+" }
                answer: "773"
                hints:
                  - "Ones: 8 add 5 is 13."
                  - "Write 3 and carry 1. Tens: 1 add 2 add 4."
                  - "773."
              - id: l1-f4
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column, and look for a carried digit. Is this calculation right?"
                show: { drawn: written-calc, rows: ["519", "264"], op: "+", result: "773" }
                answer: false
                hints:
                  - "Ones: 9 add 4 is 13. That makes a ten to carry."
                  - "Tens: the carried 1, add 1, add 6, is 8, not 7."
                  - "No. 519 + 264 = 783."
              - id: l1-f5
                type: multiple_choice
                text: "What does the small 1 in the tens column stand for?"
                show: { drawn: written-calc, rows: ["347", "238"], op: "+", carry: " 1 " }
                options: ["1 ten, made from 10 ones", "1 one", "1 hundred"]
                answer: "1 ten, made from 10 ones"
                feedback:
                  "1 one": "It sits in the tens column, so it is worth ten. It is the ten from the 15 ones."
                hints:
                  - "Which column is the small 1 in?"
                  - "7 ones add 8 ones made 15 ones, and ten of them were exchanged."
                  - "It is 1 ten, made from 10 ones."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Add in columns. Remember the carried 1."
                show: { drawn: written-calc, rows: ["165", "218"], op: "+", carry: " 1 ", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["3", "8", "7", "4"]
                answer: ["3", "8", "3"]
                hints: ["Tens: the carried 1, add 6, add 1."]
              - id: l1-s2
                type: text_input
                text: "Add in columns."
                say: "Add five hundred and thirty-six and one hundred and forty-seven in columns."
                show: { drawn: written-calc, rows: ["536", "147"], op: "+" }
                answer: "683"
                hints: ["Ones: 6 add 7 is 13. Carry the ten."]
              - id: l1-s3
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column, and look for a carried digit. Is this calculation right?"
                show: { drawn: written-calc, rows: ["374", "219"], op: "+", result: "593" }
                answer: true
                hints: ["4 add 9 is 13. Was the ten added to the tens?"]
              - id: l1-s4
                type: multiple_choice
                text: "Ones: 9 + 4 = 13. What do you write in the ones column?"
                show: { drawn: written-calc, rows: ["429", "314"], op: "+" }
                options: ["3", "13", "4"]
                answer: "3"
                hints: ["13 ones are 1 ten and 3 ones."]
              - id: l1-s5
                type: text_input
                text: "A zoo has 268 visitors in the morning and 327 in the afternoon. How many visitors is that altogether?"
                answer: "595"
                hints: ["Ones: 8 add 7 is 15. Write 5 and carry 1."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Add in columns. Remember the carried 1."
                show: { drawn: written-calc, rows: ["647", "235"], op: "+", carry: " 1 ", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["2", "8", "7", "1"]
                answer: ["2", "8", "8"]
              - id: l1-n2
                type: text_input
                text: "Add in columns."
                say: "Add seven hundred and nine and one hundred and eighty-six in columns."
                show: { drawn: written-calc, rows: ["709", "186"], op: "+" }
                answer: "895"
              - id: l1-n3
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column, and look for a carried digit. Is this calculation right?"
                show: { drawn: written-calc, rows: ["458", "327"], op: "+", result: "775" }
                answer: false
              - id: l1-n4
                type: text_input
                text: "Add in columns."
                say: "Add one hundred and sixty-three and five hundred and twenty-nine in columns."
                show: { drawn: written-calc, rows: ["163", "529"], op: "+" }
                answer: "692"
              - id: l1-n5
                type: text_input
                text: "Hassan scores 347 points in one game and 236 points in the next. What is his total?"
                answer: "583"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Add in columns."
            say: "Add two hundred and thirty-seven and four hundred and forty-eight in columns."
            show: { drawn: written-calc, rows: ["237", "448"], op: "+" }
            answer: "685"
          - id: l1-c2
            type: multiple_choice
            text: "What does the small 1 in the tens column stand for?"
            show: { drawn: written-calc, rows: ["356", "229"], op: "+", carry: " 1 " }
            options: ["1 ten", "1 one", "1 hundred"]
            answer: "1 ten"
          - id: l1-c3
            type: true_false
            text: "Is this calculation right?"
            show: { drawn: written-calc, rows: ["615", "278"], op: "+", result: "893" }
            answer: true
          - id: l1-c4
            type: text_input
            text: "Add in columns."
            say: "Add two hundred and fifty-four and three hundred and nineteen in columns."
            show: { drawn: written-calc, rows: ["254", "319"], op: "+" }
            answer: "573"
          - id: l1-c5
            type: text_input
            text: "A farmer picks 326 apples on Monday and 248 apples on Tuesday. How many apples does she pick altogether?"
            answer: "574"
          - id: l1-c6
            type: true_false
            text: "Is this calculation right?"
            show: { drawn: written-calc, rows: ["437", "156"], op: "+", result: "583" }
            answer: false

  - n: 2
    title: { de: Zehner tauschen und zweimal tauschen, en: Exchanging tens and exchanging twice }
    goal:
      de: "Rechne schriftlich plus, wenn auch die Zehner 10 oder mehr ergeben, und trag zweimal weiter, so wie bei 478 + 356."
      en: "Add in columns when the tens make 10 or more too, and carry twice when you need to, like 478 + 356."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Add in columns."
            say: "Add three hundred and forty-six and one hundred and twenty-seven in columns."
            show: { drawn: written-calc, rows: ["346", "127"], op: "+" }
            answer: "473"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "10 tens are the same as _"
            options: ["1 hundred", "1 ten", "10 hundreds"]
            answer: "1 hundred"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "362 + 175"
            say: "Three hundred and sixty-two add one hundred and seventy-five. Ones: two add five is seven. Tens: six tens add seven tens is thirteen tens."
            show: { drawn: written-calc, rows: ["362", "175"], op: "+", result: "__7" }
          - text: "13 tens = 1 hundred and 3 tens"
            say: "Thirteen tens are one hundred and three tens. Write the three in the tens column. Exchange the hundred: a small one in the hundreds column. Hundreds: one, add three, add one is five. The answer is five hundred and thirty-seven."
            show: { drawn: written-calc, rows: ["362", "175"], op: "+", carry: "1  ", result: "537" }
          - text: "478 + 356"
            say: "Sometimes you exchange twice. Ones: eight add six is fourteen. Write four and carry one ten. Tens: one add seven add five is thirteen. Write three and carry one hundred. Hundreds: one add four add three is eight. The answer is eight hundred and thirty-four."
            show: { drawn: written-calc, rows: ["478", "356"], op: "+", carry: "11 ", result: "834" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Add in columns. Remember the carried 1."
