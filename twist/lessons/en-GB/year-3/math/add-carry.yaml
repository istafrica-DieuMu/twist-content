                frame: "O: _  T: _  H: _"
                options: ["7", "3", "4", "13"]
                answer: ["7", "3", "4"]
                hints:
                  - "Ones: 3 add 4. Tens: 5 add 8 is 13 tens."
                  - "13 tens: write 3 and carry 1 hundred. Hundreds: the carried 1, add 2, add 1."
                  - "O: 7, T: 3, H: 4. The answer is 437."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tens: 1 + 6 + 7 = 14. What do you write in the tens column?"
                show: { drawn: written-calc, rows: ["265", "178"], op: "+", carry: " 1 ", result: "__3" }
                options: ["4", "14", "1"]
                answer: "4"
                feedback:
                  "14": "14 tens are 1 hundred and 4 tens. Write the 4 and carry the hundred into the hundreds column."
                hints:
                  - "14 tens are more than ten tens."
                  - "14 tens are 1 hundred and 4 tens."
                  - "Write 4 in the tens column."
              - id: l2-f3
                type: text_input
                text: "Add in columns."
                say: "Add three hundred and sixty-seven and two hundred and fifty-eight in columns. You will exchange twice."
                show: { drawn: written-calc, rows: ["367", "258"], op: "+" }
                answer: "625"
                hints:
                  - "Ones: 7 add 8 is 15. Write 5 and carry 1."
                  - "Tens: 1 add 6 add 5 is 12. Write 2 and carry 1 hundred."
                  - "Hundreds: 1 add 3 add 2 is 6. The answer is 625."
              - id: l2-f4
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column, and look for a carried digit. Is this calculation right?"
                show: { drawn: written-calc, rows: ["584", "173"], op: "+", result: "657" }
                answer: false
                hints:
                  - "Tens: 8 add 7 is 15 tens. That makes a hundred to carry."
                  - "Hundreds: the carried 1, add 5, add 1, is 7, not 6."
                  - "No. 584 + 173 = 757."
              - id: l2-f5
                type: multiple_choice
                text: "Why is there a small 1 in the hundreds column?"
                show: { drawn: written-calc, rows: ["492", "135"], op: "+", carry: "1  ", result: "627" }
                options: ["10 tens make 1 hundred.", "10 ones make 1 hundred.", "There is a 1 in 135."]
                answer: "10 tens make 1 hundred."
                hints:
                  - "Look at the tens column: 9 tens add 3 tens."
                  - "That is 12 tens, and ten of them were exchanged."
                  - "10 tens make 1 hundred."

