                show: { drawn: written-calc, rows: ["389", "264"], op: "+", carry: " 1 ", result: "__3" }
                options: ["5", "15", "6"]
                answer: "5"
                hints: ["15 tens are 1 hundred and 5 tens."]
              - id: l2-s5
