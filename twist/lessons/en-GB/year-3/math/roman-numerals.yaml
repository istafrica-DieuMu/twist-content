# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.roman-numerals
skill: math.large-numbers.roman-numerals
curriculum: en-GB
language: en
title:
  de: Römische Zahlen
  en: Roman numerals
summary: >
  Lesson 1 reads and writes Roman numerals to 20 with I, V and X: a
  smaller letter after a bigger one adds on, one before it takes away (IV,
  IX), and no letter stands more than three times in a row. Lesson 2 adds
  L and C, reads numbers to 100 in parts (tens, then ones), reads the hours
  on a clock face with Roman numerals, compares the Roman way with our
  place value (an X is always ten, there is no zero) and ends with the
  skill check. The voice never reads a Roman numeral aloud and Roman
  options are not read, so the child must read them.
metadata:
  year: year-3
  topic: { de: Zahlen bis 1 000 000, en: Roman numerals }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { en: [Roman numerals, I, V, X, L, C, clock face, place value, zero] }
  forms: [text, audio, drawn]
  drawn: [clock]
  facets: []
  parts:
    - { id: read, what: { de: römische Zahlen bis 100 lesen, en: reading Roman numerals to 100 } }
    - { id: write, what: { de: Zahlen bis 100 mit römischen Zahlzeichen schreiben, en: writing numbers to 100 in Roman numerals } }
    - { id: clock, what: { de: römische Zahlen auf dem Zifferblatt lesen, en: reading Roman numerals on a clock face } }
    - { id: place-value, what: { de: römische Zahlen mit unserem Stellenwertsystem vergleichen, en: comparing Roman numerals with our place value } }
  misconceptions:
    - id: always-add
      what: Adds every letter, also one on the left (IV = 6, IX = 11, XL = 60)
      addressed: lesson 1 Learn screen 3 and lesson 2 Learn screen 2; l1-f2, l1-f4 and l2-f2 have feedback, l1-s3, l1-s5, l2-s3 and l2-c4
    - id: four-in-a-row
      what: Writes a letter four times in a row (IIII for 4, XXXX for 40, LXXXX for 90)
      addressed: lesson 1 Learn screen 4; l1-f5, l1-s2, l1-c2, l2-f4 (with feedback), l2-s2, l2-n2, l2-c2 and l2-c4 offer four in a row
    - id: smaller-first
      what: Writes the letters from small to big (IIIX for 13)
      addressed: l1-f3 (with feedback), l2-f3 and l2-c2 offer the reversed order
    - id: roman-place-value
      what: Thinks Roman numerals work like our digits, with places and a zero
      addressed: lesson 2 Learn screen 3; l2-s4, l2-n4 and l2-c5
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "I, V und X", en: "I, V and X" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is the 3 in 435 worth?"
            options: ["3", "30", "300"]
            answer: "30"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Partition 47."
            frame: "47 = _ + _"
            options: ["4", "7", "40", "70"]
            answer: ["40", "7"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I = 1   V = 5   X = 10"
            say: "The Romans wrote numbers with letters. I stands for one, V for five and X for ten."
          - text: "VI = 5 + 1 = 6\nXII = 10 + 1 + 1 = 12"
            say: "A smaller letter after a bigger one adds on. Five, then one more, is six. Ten, then one and one more, is twelve."
          - text: "IV = 5 − 1 = 4\nIX = 10 − 1 = 9"
            say: "A smaller letter before a bigger one takes away. One before five is one less than five: four. One before ten is one less than ten: nine."
          - text: "III = 3, but 4 is IV, not IIII."
            say: "The same letter never stands more than three times in a row. Three is three ones. For four, write one before five."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "VII = ?"
                say: "What number is this Roman numeral?"
                options: ["7", "6", "8"]
                answer: "7"
                hints:
                  - "The bigger letter comes first, so add."
                  - "V is 5. Then two ones."
                  - "5 + 1 + 1 = 7."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "IV = ?"
                say: "What number is this Roman numeral?"
                options: ["4", "6", "5"]
                answer: "4"
                feedback:
                  "6": "The I comes before the V, so take it away: 5 − 1 = 4."
                hints:
                  - "Is the smaller letter before or after the bigger one?"
                  - "The I is before the V, so take it away."
                  - "5 − 1 = 4."
              - id: l1-f3
                type: multiple_choice
                text: "Which Roman numeral is 13?"
                options: ["XIII", "IIIX", "XIV"]
                answer: "XIII"
                option_audio: false
                feedback:
                  "IIIX": "Write the bigger letter first: ten, then three ones."
                hints:
                  - "13 is 10 and 3."
                  - "Write the ten first, then the ones."
                  - "X then III: XIII."
              - id: l1-f4
                type: multiple_choice
                text: "IX = ?"
                say: "What number is this Roman numeral?"
                options: ["9", "11", "10"]
                answer: "9"
                feedback:
                  "11": "The I is before the X, so it takes away: 10 − 1 = 9."
                hints:
                  - "Look at where the I is."
                  - "The I is before the X: one less than ten."
                  - "10 − 1 = 9."
              - id: l1-f5
                type: multiple_choice
                text: "Which Roman numeral is 8?"
                options: ["VIII", "IIX", "IIIIIIII"]
                answer: "VIII"
                option_audio: false
                hints:
                  - "8 is 5 and 3."
                  - "Write the five first, then three ones."
                  - "V then III: VIII."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "XV = ?"
                say: "What number is this Roman numeral?"
                options: ["15", "6", "5"]
                answer: "15"
                hints: ["X is 10 and V is 5."]
              - id: l1-s2
                type: multiple_choice
                text: "Which Roman numeral is 4?"
                options: ["IV", "IIII", "VI"]
                answer: "IV"
                option_audio: false
                hints: ["No letter more than three times in a row."]
              - id: l1-s3
                type: multiple_choice
                text: "XIX = ?"
                say: "What number is this Roman numeral?"
                options: ["19", "21", "9"]
                answer: "19"
                hints: ["Read it as X, then IX."]
              - id: l1-s4
                type: text_input
                text: "XVII = ?"
                say: "Type the number for this Roman numeral."
                answer: "17"
                hints: ["10, 5, then two ones."]
              - id: l1-s5
                type: true_false
                text: "Is it true? XI = 9"
                say: "Is it true? Read the Roman numeral and check the number."
                answer: false
                hints: ["The I is after the X, so it adds on."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "XII = ?"
                say: "What number is this Roman numeral?"
                options: ["12", "3", "21"]
                answer: "12"
              - id: l1-n2
                type: text_input
                text: "XIV = ?"
                say: "Type the number for this Roman numeral."
                answer: "14"
              - id: l1-n3
                type: multiple_choice
                text: "Which Roman numeral is 20?"
                options: ["XX", "XXX", "VV"]
                answer: "XX"
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Which is the greatest number?"
                options: ["XVI", "XIV", "IX"]
                answer: "XVI"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? 18 = XVIII"
                say: "Is it true? Read the Roman numeral and check the number."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "VI = ?"
            say: "What number is this Roman numeral?"
            options: ["6", "4", "7"]
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "Which Roman numeral is 9?"
            options: ["IX", "VIIII", "XI"]
            answer: "IX"
            option_audio: false
          - id: l1-c3
            type: text_input
            text: "XIII = ?"
            say: "Type the number for this Roman numeral."
            answer: "13"
          - id: l1-c4
            type: multiple_choice
            text: "XVIII = ?"
            say: "What number is this Roman numeral?"
            options: ["18", "13", "22"]
            answer: "18"
          - id: l1-c5
            type: multiple_choice
            text: "Which Roman numeral is 11?"
            options: ["IX", "XI", "IIX"]
            answer: "XI"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Is it true? XIV = 16"
            say: "Is it true? Read the Roman numeral and check the number."
            answer: false

  - n: 2
    title: { de: "L, C und das Zifferblatt", en: "L, C and the clock face" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "XI = ?"
            say: "What number is this Roman numeral?"
            options: ["11", "9", "2"]
            answer: "11"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which Roman numeral is 14?"
            options: ["XIV", "XIIII", "XVI"]
            answer: "XIV"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "L = 50   C = 100"
            say: "Two more letters. L stands for fifty and C for one hundred."
          - text: "XL = 50 − 10 = 40\nXC = 100 − 10 = 90\nLX = 50 + 10 = 60"
            say: "The same rules work. Ten before fifty takes away: forty. Ten before one hundred takes away: ninety. Ten after fifty adds on: sixty."
          - text: "73 = 70 + 3 = LXX + III = LXXIII"
            say: "Write a big number in parts: the tens first, then the ones. Seventy-three is seventy and three. In our numbers the seven is worth seventy because of its place. A Roman letter always keeps its own value, and the Romans had no zero."
          - text: "On some clocks: XII at the top, III on the right, VI at the bottom, IX on the left."
            say: "Some clocks use Roman numerals. Twelve is at the top, three on the right, six at the bottom and nine on the left."
            show: { drawn: clock, hour: 3, minute: 0, roman: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "L = ?"
                say: "What number does this Roman letter stand for?"
                options: ["50", "5", "100"]
                answer: "50"
                hints:
                  - "There are two new letters, L and C."
                  - "C is one hundred. L is half of that."
                  - "L = 50."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "XL = ?"
                say: "What number is this Roman numeral?"
                options: ["40", "60", "10"]
                answer: "40"
                feedback:
                  "60": "X comes before L, so take it away: 50 − 10 = 40."
                hints:
                  - "Is the X before or after the L?"
                  - "Before, so take ten away from fifty."
                  - "50 − 10 = 40."
              - id: l2-f3
                type: multiple_choice
                text: "Which Roman numeral is 72?"
                options: ["LXXII", "LXII", "IIXXL"]
                answer: "LXXII"
                option_audio: false
                hints:
                  - "Split 72 into 70 and 2."
                  - "70 is 50 and 20: L, X, X."
                  - "LXX then II: LXXII."
              - id: l2-f4
                type: multiple_choice
                text: "Which Roman numeral is 90?"
                options: ["XC", "LXXXX", "CX"]
                answer: "XC"
                option_audio: false
                feedback:
                  "LXXXX": "No letter more than three times in a row. 90 is ten less than a hundred."
                  "CX": "Ten after a hundred adds on, so that is 110."
                hints:
                  - "90 is close to 100."
                  - "It is ten less than a hundred: put the ten before the hundred."
                  - "XC."
              - id: l2-f5
                type: multiple_choice
                text: "This clock has Roman numerals. What time is it?"
                say: "This clock has Roman numerals. Look where the hands point. What time is it?"
                show: { drawn: clock, hour: 9, minute: 0, roman: true }
                options: ["9 o'clock", "11 o'clock", "10 o'clock"]
                answer: "9 o'clock"
                hints:
                  - "The minute hand on twelve means o'clock. Read the hour hand."
                  - "The I is before the X."
                  - "IX is 9: it is 9 o'clock."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "LXV = ?"
                say: "What number is this Roman numeral?"
                options: ["65", "45", "115"]
                answer: "65"
                hints: ["50, 10, then 5."]
              - id: l2-s2
                type: multiple_choice
                text: "Which Roman numeral is 30?"
                options: ["XXX", "XXXX", "LXX"]
                answer: "XXX"
                option_audio: false
                hints: ["30 is three tens."]
              - id: l2-s3
                type: multiple_choice
                text: "XC = ?"
                say: "What number is this Roman numeral?"
                options: ["90", "110", "10"]
                answer: "90"
                hints: ["X before C takes away."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence is true?"
                options: ["There is no Roman numeral for zero.", "X can be worth 100 in the right place.", "The Romans wrote zero as O."]
                answer: "There is no Roman numeral for zero."
                hints: ["An X is always worth ten."]
              - id: l2-s5
                type: multiple_choice
                text: "On a clock with Roman numerals, which numeral is at the bottom?"
                options: ["VI", "IV", "IX"]
                answer: "VI"
                option_audio: false
                hints: ["Six is at the bottom of a clock."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "LIV = ?"
                say: "Type the number for this Roman numeral."
                answer: "54"
              - id: l2-n2
                type: multiple_choice
                text: "Which Roman numeral is 49?"
                options: ["XLIX", "XXXXVIIII", "LIX"]
                answer: "XLIX"
                option_audio: false
                difficulty: stretch
              - id: l2-n3
                type: text_input
                text: "LXXXVIII = ?"
                say: "Type the number for this Roman numeral."
                answer: "88"
              - id: l2-n4
                type: true_false
                text: "Is it true? In LXXX every X is worth 10."
                say: "Is it true? Read the Roman numeral and think about what each X is worth."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "This clock has Roman numerals. What time is it?"
                say: "Look where the hands point on the Roman clock. What time is it?"
                show: { drawn: clock, hour: 4, minute: 0, roman: true }
                options: ["4 o'clock", "6 o'clock", "5 o'clock"]
                answer: "4 o'clock"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "XVI = ?"
            say: "What number is this Roman numeral?"
            options: ["16", "14", "61"]
            answer: "16"
          - id: l2-c2
            part: write
            type: multiple_choice
            text: "Which Roman numeral is 19?"
            options: ["XIX", "XVIIII", "IXX"]
            answer: "XIX"
            option_audio: false
          - id: l2-c3
            part: read
            type: multiple_choice
            text: "LXXV = ?"
            say: "What number is this Roman numeral?"
            options: ["75", "65", "85"]
            answer: "75"
          - id: l2-c4
            part: write
            type: multiple_choice
            text: "Which Roman numeral is 40?"
            options: ["XL", "XXXX", "LX"]
            answer: "XL"
            option_audio: false
          - id: l2-c5
            part: place-value
            type: multiple_choice
            text: "How are Roman numerals different from our numbers?"
            options: ["They have no zero.", "They use a zero like ours.", "A letter on the left is worth ten times more, like our digits."]
            answer: "They have no zero."
          - id: l2-c6
            part: read
            type: text_input
            text: "XXVI = ?"
            say: "Type the number for this Roman numeral."
            answer: "26"
          - id: l2-c7
            part: read
            type: multiple_choice
            text: "XCV = ?"
            say: "What number is this Roman numeral?"
            options: ["95", "105", "85"]
            answer: "95"
          - id: l2-c8
            part: read
            type: true_false
            text: "Is it true? LX = 40"
            say: "Is it true? Read the Roman numeral and check the number."
            answer: false
          - id: l2-c9
            part: write
            type: multiple_choice
            text: "Which Roman numeral is 60?"
            options: ["XL", "LX", "XXXXXX"]
            answer: "LX"
            option_audio: false
          - id: l2-c10
            part: write
            type: multiple_choice
            text: "Which Roman numeral is 85?"
            options: ["LXXXV", "LXXXXV", "XVL"]
            answer: "LXXXV"
            option_audio: false
          - id: l2-c11
            part: write
            type: true_false
            text: "Is it true? 44 = XLIV"
            say: "Is it true? Read the Roman numeral and check the number."
            answer: true
          - id: l2-c12
            part: clock
            type: multiple_choice
            text: "This clock has Roman numerals. What time is it?"
            say: "This clock has Roman numerals. Look where the hands point. What time is it?"
            show: { drawn: clock, hour: 7, minute: 0, roman: true }
            options: ["6 o'clock", "7 o'clock", "8 o'clock"]
            answer: "7 o'clock"
          - id: l2-c13
            part: clock
            type: multiple_choice
            text: "This clock has Roman numerals. What time is it?"
            say: "This clock has Roman numerals. Look where the hands point. What time is it?"
            show: { drawn: clock, hour: 11, minute: 0, roman: true }
            options: ["9 o'clock", "11 o'clock", "12 o'clock"]
            answer: "11 o'clock"
          - id: l2-c14
            part: clock
            type: multiple_choice
            text: "On a clock with Roman numerals, which numeral is on the left?"
            options: ["XI", "III", "IX"]
            answer: "IX"
            option_audio: false
          - id: l2-c15
            part: clock
            type: true_false
            text: "This clock has Roman numerals. Is it true? It shows 2 o'clock."
            show: { drawn: clock, hour: 2, minute: 0, roman: true }
            answer: true
          - id: l2-c16
            part: clock
            type: true_false
            text: "This clock has Roman numerals. Is it true? It shows 7 o'clock."
            show: { drawn: clock, hour: 5, minute: 0, roman: true }
            answer: false
          - id: l2-c17
            part: place-value
            type: true_false
            text: "Is it true? In our number 22, both 2s are worth the same."
            answer: false
          - id: l2-c18
            part: place-value
            type: multiple_choice
            text: "In our number 55, the first 5 is worth 50. In LV, what is the V worth?"
            say: "In our number fifty-five, the first five is worth fifty. Now read the Roman numeral. What is its last letter worth?"
            options: ["5", "50", "500"]
            answer: "5"
          - id: l2-c19
            part: place-value
            type: true_false
            text: "Is it true? An X is worth 10 wherever it stands in a Roman numeral."
            say: "Is it true? The Roman letter for ten is worth ten wherever it stands in a Roman numeral."
            answer: true
          - id: l2-c20
            part: place-value
            type: multiple_choice
            text: "Our number 50 has a zero in the ones. How do the Romans write 50?"
            options: ["VO", "L", "XXXXX"]
            answer: "L"
            option_audio: false
