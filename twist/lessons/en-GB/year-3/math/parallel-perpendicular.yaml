# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.parallel-perpendicular
skill: math.shapes.parallel-perpendicular
curriculum: en-GB
language: en
title:
  de: Parallel und senkrecht
  en: Parallel and perpendicular lines
summary: >
  Lesson 1 recognises parallel lines (always the same distance apart,
  they never meet), perpendicular lines (they meet at a right angle) and
  horizontal and vertical lines, on squared paper, in letters and around
  us, also when the lines are tilted; lesson 2 finds parallel and
  perpendicular sides in rectangles, squares, triangles and other shapes,
  says how a set square checks a right angle, and ends with the skill
  check. Drawing parallel and perpendicular lines with a set square waits
  for a drawing task.
metadata:
  year: year-3
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.lines-segments]
  also_practises: [math.shapes.properties]
  vocabulary: { en: [parallel, perpendicular, horizontal, vertical, right angle, set square, pair, opposite] }
  forms: [text, audio, drawn]
  drawn: [grid, shape]
  facets: []
  misconceptions:
    - id: perpendicular-means-upright
      what: Thinks lines are only perpendicular when one stands upright on the page, so a tilted right-angled cross does not count
      addressed: lesson 1 Learn screen 4 shows a tilted cross; l1-f4 has feedback, l1-n1 and l2-c2 show tilted perpendicular lines
    - id: parallel-needs-same-length
      what: Thinks parallel lines must be equally long, or that tilted lines cannot be parallel
      addressed: lesson 1 Learn says parallel lines never meet; l1-f3 has feedback, l1-s3, l1-c1 and l2-c1
    - id: pairs-counted-as-sides
      what: Counts the sides instead of the pairs, or counts sloping sides as parallel
      addressed: lesson 2 Learn names pairs of opposite sides; l2-f1 and l2-f4 have feedback, l2-s1, l2-s4 and l2-n4
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Parallele und senkrechte Linien, en: Parallel and perpendicular }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which letter is made only of line segments?"
            options: ["F", "O", "S"]
            answer: "F"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many squares long is the line segment?"
            show: { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 5, 1]] }
            options: ["4", "5", "3"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Parallel lines are always the same distance apart. They never meet."
            say: "These lines are parallel. They stay the same distance apart all the way along, so they never meet, however far they go. Think of the two rails of a train track."
            show: { drawn: grid, cols: 7, rows: 4, lines: [[1, 1, 6, 1], [1, 3, 6, 3]] }
          - text: "Perpendicular lines meet at a right angle."
            say: "These lines are perpendicular. They meet at a right angle, a square corner like the corner of a page."
            show: { drawn: grid, cols: 7, rows: 4, lines: [[1, 3, 6, 3], [3, 0, 3, 3]] }
          - text: "Horizontal: straight across, like the horizon.\nVertical: straight up and down."
            say: "A horizontal line goes straight across, like the line where the sea meets the sky. A vertical line goes straight up and down, like a flagpole. A horizontal line and a vertical line that meet are perpendicular."
            show: { drawn: grid, cols: 7, rows: 4, lines: [[1, 3, 6, 3], [6, 0, 6, 3]] }
          - text: "Tilted lines can be perpendicular too."
            say: "These lines are tilted, but they still meet at a square corner. They are perpendicular. Tilted lines can be parallel too, if they never meet."
            show: { drawn: grid, cols: 4, rows: 4, lines: [[1, 1, 3, 3], [1, 3, 3, 1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which picture shows parallel lines?"
                options:
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 1, 6, 1], [1, 3, 6, 3]], key: parallel }
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 3, 6, 3], [3, 0, 3, 3]], key: perpendicular }
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 3, 6, 3], [2, 3, 4, 0]], key: neither }
                answer: parallel
                hints:
                  - "Parallel lines never meet."
                  - "Find the picture where the lines stay the same distance apart."
                  - "The two lines going across, one above the other."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Which picture shows perpendicular lines?"
                options:
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 3, 6, 3], [4, 0, 4, 3]], key: perpendicular }
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 0, 6, 0], [1, 2, 6, 2]], key: parallel }
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 3, 6, 3], [1, 3, 3, 0]], key: neither }
                answer: perpendicular
                feedback:
                  neither: "These lines meet, but not at a square corner."
                hints:
                  - "Perpendicular lines meet at a right angle."
                  - "Look for a square corner where the lines meet."
                  - "The line going straight up from the line across."
              - id: l1-f3
                type: multiple_choice
                text: "Are these lines parallel, perpendicular or neither?"
                show: { drawn: grid, cols: 6, rows: 4, lines: [[1, 3, 3, 1], [3, 3, 5, 1]] }
                options: ["parallel", "perpendicular", "neither"]
                answer: "parallel"
                keep_order: true
                feedback:
                  "neither": "Tilted lines can still be parallel. These stay the same distance apart and never meet."
                hints:
                  - "Do the lines meet, or would they meet if they went on?"
                  - "Both lines go up 2 squares for every 2 squares across, so the gap stays the same."
                  - "They never meet: they are parallel."
              - id: l1-f4
                type: multiple_choice
                text: "Are these lines parallel, perpendicular or neither?"
                show: { drawn: grid, cols: 4, rows: 4, lines: [[1, 1, 3, 3], [1, 3, 3, 1]] }
                options: ["parallel", "perpendicular", "neither"]
                answer: "perpendicular"
                keep_order: true
                feedback:
                  "neither": "Turn your head: the lines still meet at a square corner."
                hints:
                  - "The lines meet. What kind of corner do they make?"
                  - "Imagine turning the picture a little. The lines make a plus sign."
                  - "They meet at a right angle: perpendicular."
              - id: l1-f5
                type: multiple_choice
                text: "Which of these is a vertical line?"
                options: ["a flagpole", "the top of a table", "the horizon"]
                answer: "a flagpole"
                hints:
                  - "Vertical means straight up and down."
                  - "The top of a table and the horizon go across."
                  - "A flagpole stands straight up."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Are these lines parallel, perpendicular or neither?"
                show: { drawn: grid, cols: 7, rows: 5, lines: [[1, 1, 6, 1], [1, 4, 6, 4]] }
                options: ["parallel", "perpendicular", "neither"]
                answer: "parallel"
                keep_order: true
                hints: ["Would they ever meet?"]
              - id: l1-s2
                type: multiple_choice
                text: "Are these lines parallel, perpendicular or neither?"
                show: { drawn: grid, cols: 7, rows: 5, lines: [[1, 4, 6, 4], [1, 4, 1, 0]] }
                options: ["parallel", "perpendicular", "neither"]
                answer: "perpendicular"
                keep_order: true
                hints: ["Look at the corner where they meet."]
              - id: l1-s3
                type: true_false
                text: "Is it true? Parallel lines must be the same length."
                answer: false
                hints: ["Parallel only means they stay the same distance apart."]
              - id: l1-s4
                type: multiple_choice
                text: "Are these lines parallel, perpendicular or neither?"
                show: { drawn: grid, cols: 6, rows: 4, lines: [[1, 3, 5, 3], [2, 3, 4, 0]] }
                options: ["parallel", "perpendicular", "neither"]
                answer: "neither"
                keep_order: true
                hints: ["They meet. Is the corner square?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which letter has a pair of parallel lines?"
                options: ["H", "L", "V"]
                answer: "H"
                option_audio: false
                hints: ["Look for two lines that never meet."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Which picture shows perpendicular lines?"
                options:
                  - { drawn: grid, cols: 6, rows: 4, lines: [[1, 1, 3, 3], [1, 3, 3, 1]], key: perpendicular }
                  - { drawn: grid, cols: 6, rows: 4, lines: [[1, 3, 3, 1], [3, 3, 5, 1]], key: parallel }
                  - { drawn: grid, cols: 6, rows: 4, lines: [[1, 3, 5, 3], [1, 2, 5, 0]], key: neither }
                answer: perpendicular
              - id: l1-n2
                type: multiple_choice
                text: "Are these lines parallel, perpendicular or neither?"
                show: { drawn: grid, cols: 6, rows: 5, lines: [[1, 0, 1, 4], [4, 0, 4, 4]] }
                options: ["parallel", "perpendicular", "neither"]
                answer: "parallel"
                keep_order: true
              - id: l1-n3
                type: true_false
                text: "Is it true? A horizontal line and a vertical line that meet are perpendicular."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Which letter has perpendicular lines?"
                options: ["T", "V", "O"]
                answer: "T"
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Which pair of lines is parallel?"
                options: ["the two rails of a train track", "the two hands of a clock at 2 o'clock", "the two sides of the letter V"]
                answer: "the two rails of a train track"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Are these lines parallel, perpendicular or neither?"
            show: { drawn: grid, cols: 7, rows: 5, lines: [[1, 4, 4, 1], [3, 4, 6, 1]] }
            options: ["parallel", "perpendicular", "neither"]
            answer: "parallel"
            keep_order: true
          - id: l1-c2
            type: multiple_choice
            text: "Which is a horizontal line?"
            options: ["the top edge of a door", "the side edge of a door", "a ladder leaning on a wall"]
            answer: "the top edge of a door"
          - id: l1-c3
            type: true_false
            text: "Is it true? Parallel lines never meet."
            answer: true

  - n: 2
    title: { de: In Figuren und mit dem Geodreieck, en: In shapes and with a set square }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Are these lines parallel, perpendicular or neither?"
            show: { drawn: grid, cols: 7, rows: 4, lines: [[1, 1, 6, 1], [1, 3, 6, 3]] }
            options: ["parallel", "perpendicular", "neither"]
            answer: "parallel"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which letter has perpendicular lines?"
            options: ["L", "O", "S"]
            answer: "L"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A rectangle has 2 pairs of parallel sides and 4 right angles."
            say: "In a rectangle the opposite sides are parallel: the top and the bottom, and the left and the right. That is two pairs. Sides that meet at a corner are perpendicular, so it has four right angles."
            show: { drawn: shape, kind: rectangle }
          - text: "This triangle has 1 right angle and no parallel sides."
            say: "This triangle has one square corner, so two of its sides are perpendicular. No two of its sides are parallel: if they went on, they would all meet."
            show: { drawn: grid, cols: 6, rows: 5, lines: [[1, 4, 5, 4], [1, 4, 1, 1], [1, 1, 5, 4]] }
          - text: "This shape has 1 pair of parallel sides."
            say: "In this shape only the top and the bottom are parallel. The slanted sides lean towards each other. If they went on, they would meet."
            show: { drawn: shape, kind: trapezoid }
          - text: "A set square has a right angle."
            say: "A set square is a triangle with a right angle. Put its square corner where two lines meet. If both lines run along its edges, the lines are perpendicular."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many pairs of parallel sides does a rectangle have?"
                show: { drawn: shape, kind: rectangle }
                options: ["2", "1", "4"]
                answer: "2"
                feedback:
                  "4": "A pair is two sides. A rectangle has 4 sides, so 2 pairs."
                hints:
                  - "A pair is two sides that are parallel."
                  - "The top and bottom are one pair. Is there another?"
                  - "The left and right sides too: 2 pairs."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How many right angles does a square have?"
                show: { drawn: shape, kind: square }
                options: ["4", "2", "0"]
                answer: "4"
                hints:
                  - "A right angle is a square corner."
                  - "Look at each corner of the square."
                  - "All 4 corners are right angles."
              - id: l2-f3
                type: multiple_choice
                text: "How many pairs of perpendicular sides does this triangle have?"
                show: { drawn: grid, cols: 6, rows: 5, lines: [[1, 4, 5, 4], [1, 4, 1, 1], [1, 1, 5, 4]] }
                options: ["1", "2", "0"]
                answer: "1"
                hints:
                  - "Perpendicular sides meet at a square corner."
                  - "How many square corners does the triangle have?"
                  - "One, bottom left: 1 pair."
              - id: l2-f4
                type: multiple_choice
                text: "How many pairs of parallel sides does this shape have?"
                show: { drawn: shape, kind: trapezoid }
                options: ["1", "2", "0"]
                answer: "1"
                feedback:
                  "2": "The slanted sides lean towards each other. If they went on, they would meet."
                hints:
                  - "Check the top and the bottom first."
                  - "Then check the two slanted sides. Do they stay the same distance apart?"
                  - "Only the top and the bottom: 1 pair."
              - id: l2-f5
                type: multiple_choice
                text: "How can you check that two lines are perpendicular?"
                options: ["Put the corner of a set square where they meet.", "Measure how long the lines are.", "Count the lines."]
                answer: "Put the corner of a set square where they meet."
                hints:
                  - "Perpendicular is about the corner, not the length."
                  - "Which tool has a right angle?"
                  - "The set square."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many pairs of parallel sides does this hexagon have?"
                show: { drawn: shape, kind: hexagon }
                options: ["3", "6", "2"]
                answer: "3"
                hints: ["Look at sides opposite each other."]
                difficulty: stretch
              - id: l2-s2
                type: multiple_choice
                text: "Does this shape have any right angles?"
                show: { drawn: shape, kind: parallelogram }
                options: ["No.", "Yes, one.", "Yes, four."]
                answer: "No."
                hints: ["Are any corners square?"]
              - id: l2-s3
                type: true_false
                text: "Is it true? A square has 2 pairs of parallel sides."
                show: { drawn: shape, kind: square }
                answer: true
                hints: ["A square is a special rectangle."]
              - id: l2-s4
                type: multiple_choice
                text: "How many pairs of parallel sides does this triangle have?"
                show: { drawn: shape, kind: triangle }
                options: ["0", "1", "3"]
                answer: "0"
                hints: ["Do any two sides never meet?"]
              - id: l2-s5
                type: multiple_choice
                text: "Mo puts the corner of a set square where two lines meet. One line runs along an edge of the set square. The other does not. What does that tell him?"
                options: ["The lines are not perpendicular.", "The lines are parallel.", "The lines are perpendicular."]
                answer: "The lines are not perpendicular."
                hints: ["For a right angle, both lines must run along the edges."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which has parallel lines?"
                options: ["the lines on a page of your exercise book", "a slice of pizza", "the letter V"]
                answer: "the lines on a page of your exercise book"
              - id: l2-n2
                type: multiple_choice
                text: "Where can you see perpendicular lines?"
                options: ["the corner of a window", "a rainbow", "a wheel"]
                answer: "the corner of a window"
              - id: l2-n3
                type: multiple_choice
                text: "Which sides of a rectangle are parallel?"
                show: { drawn: shape, kind: rectangle }
                options: ["the opposite sides", "the sides that meet at a corner", "none of them"]
                answer: "the opposite sides"
              - id: l2-n4
                type: true_false
                text: "Is it true? A triangle can have two pairs of parallel sides."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Which pair of lines is perpendicular?"
                options: ["the edges at the corner of a book", "the two long edges of a ruler", "two strings on a guitar"]
                answer: "the edges at the corner of a book"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Which picture shows two lines that will never meet?"
            options:
              - { drawn: grid, cols: 7, rows: 5, lines: [[1, 4, 4, 1], [2, 4, 5, 1]], key: parallel }
              - { drawn: grid, cols: 7, rows: 5, lines: [[1, 4, 5, 4], [3, 4, 3, 0]], key: perpendicular }
              - { drawn: grid, cols: 7, rows: 5, lines: [[1, 4, 5, 4], [1, 2, 5, 0]], key: neither }
            answer: parallel
          - id: l2-c2
            type: multiple_choice
            text: "Are these lines parallel, perpendicular or neither?"
            show: { drawn: grid, cols: 6, rows: 5, lines: [[2, 0, 4, 2], [4, 2, 2, 4]] }
            options: ["parallel", "perpendicular", "neither"]
            answer: "perpendicular"
            keep_order: true
          - id: l2-c3
            type: multiple_choice
            text: "Which letter has parallel lines but no right angles?"
            options: ["N", "T", "E"]
            answer: "N"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which sentence is true for a square?"
            show: { drawn: shape, kind: square }
            options: ["Its opposite sides are parallel and its corners are right angles.", "It has no parallel sides.", "Only one pair of its sides is parallel."]
            answer: "Its opposite sides are parallel and its corners are right angles."
          - id: l2-c5
            type: true_false
            text: "Is it true? Two lines that meet at a right angle are perpendicular."
            answer: true
