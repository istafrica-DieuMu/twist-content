# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.add-no-carry
skill: math.written-add-sub.add-no-carry
curriculum: en-GB
language: en
title:
  de: Schriftlich addieren ohne Übertrag
  en: Column addition without exchanging
summary: >
  Column addition where no column makes ten or more. Lesson 1 writes two
  three-digit numbers one under the other (ones under ones, tens under
  tens) and adds from the ones; lesson 2 adds a shorter number, lining it
  up on the right, checks the answer with an estimate, and ends with the
  skill check.
metadata:
  year: year-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value, math.add-sub-to-1000.semi-written]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { en: [column addition, column, ones, tens, hundreds, line up, digit, estimate] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: place, what: { de: Zahlen stellengerecht untereinander schreiben, en: lining numbers up by place value } }
    - { id: add, what: { de: dreistellige Zahlen ohne Übertrag schriftlich addieren, en: adding three-digit numbers in columns without exchanging } }
    - { id: lengths, what: { de: Zahlen mit verschieden vielen Stellen schriftlich addieren, en: adding numbers with different numbers of digits in columns } }
    - { id: check, what: { de: mit dem Überschlag und durch Nachrechnen prüfen, en: checking with an estimate and by working it again } }
  misconceptions:
    - id: start-left
      what: Starts adding from the hundreds instead of the ones
      addressed: lesson 1 Learn starts on the right; l1-f2 has feedback on it, and l1-c2 asks which column comes second
    - id: misalign-short-number
      what: Lines a shorter number up on the left (352 + 41 worked as 352 + 410)
      addressed: lesson 2 Learn lines up the ones and shows how big the wrong answer gets; l2-f1 and l2-f5 have feedback on it; l2-f3, l2-n3, l2-c3 and l2-c4 show it again
    - id: mixed-columns
      what: Adds digits from different columns
      addressed: l1-s4 asks which digits share the tens column; the frames in every stage fill the answer column by column
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Stellengerecht untereinander, en: Lining up the columns }
    goal:
      de: "Schreib zwei Zahlen genau untereinander, Einer unter Einer, und rechne dann jede Spalte, zuerst die Einer, so wie bei 243 + 125."
      en: "Write two numbers under each other, ones under ones, then add each column, starting with the ones, like 243 + 125."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which digit is in the tens place in 452?"
            options: ["5", "4", "2"]
            answer: "5"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "324 + 152 = _"
            answer: "476"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "243 + 125"
            say: "In column addition you write the numbers one under the other: ones under ones, tens under tens, hundreds under hundreds. Then you draw a line for the answer."
            show: { drawn: written-calc, rows: ["243", "125"], op: "+" }
          - text: "3 + 5 = 8"
            say: "Always start with the ones, on the right. Three add five is eight. Write the eight in the ones column, under the line."
            show: { drawn: written-calc, rows: ["243", "125"], op: "+", result: "__8" }
          - text: "4 + 2 = 6\n2 + 1 = 3"
            say: "Then the tens: four tens add two tens is six tens. Then the hundreds: two add one is three. The answer is three hundred and sixty-eight."
            show: { drawn: written-calc, rows: ["243", "125"], op: "+", result: "368" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Add in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["312", "456"], op: "+", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["8", "6", "7", "5"]
                answer: ["8", "6", "7"]
                hints:
                  - "Ones first: 2 add 6."
                  - "Tens: 1 add 5. Hundreds: 3 add 4."
                  - "O: 8, T: 6, H: 7. The answer is 768."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "In column addition, which column do you start with?"
                options: ["the ones", "the hundreds", "the tens"]
                answer: "the ones"
                feedback:
                  "the hundreds": "Column addition starts on the right, with the ones, and moves left."
                hints:
                  - "You work from right to left."
                  - "The column on the right is the ones column."
                  - "Start with the ones."
              - id: l1-f3
                type: text_input
                text: "Add in columns."
                say: "Add two hundred and forty-one and five hundred and seven in columns."
                show: { drawn: written-calc, rows: ["241", "507"], op: "+" }
                answer: "748"
                hints:
                  - "Ones: 1 add 7."
                  - "Tens: 4 add 0. Hundreds: 2 add 5."
                  - "748."
              - id: l1-f4
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["432", "314"], op: "+", result: "746" }
                answer: true
                hints:
                  - "Check each column, starting with the ones."
                  - "2 add 4, then 3 add 1, then 4 add 3."
                  - "Yes, 746 is right."
              - id: l1-f5
                type: fill_in_blank
                text: "Add in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["625", "273"], op: "+", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["8", "9", "7", "6"]
                answer: ["8", "9", "8"]
                hints:
                  - "Ones: 5 add 3."
                  - "Tens: 2 add 7. Hundreds: 6 add 2."
                  - "O: 8, T: 9, H: 8. The answer is 898."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Add in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["423", "165"], op: "+", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["8", "5", "9", "6"]
                answer: ["8", "8", "5"]
                hints: ["Ones: 3 add 5."]
              - id: l1-s2
                type: text_input
                text: "Add in columns."
                say: "Add six hundred and two and one hundred and thirty-five in columns."
                show: { drawn: written-calc, rows: ["602", "135"], op: "+" }
                answer: "737"
                hints: ["Tens: 0 add 3."]
              - id: l1-s3
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["253", "324"], op: "+", result: "587" }
                answer: false
                hints: ["Check the tens: 5 add 2."]
              - id: l1-s4
                type: multiple_choice
                text: "You add 352 + 417 in columns. Which digits do you add in the tens column?"
                options: ["5 and 1", "3 and 4", "2 and 7"]
                answer: "5 and 1"
                hints: ["The tens digit is the middle digit of each number."]
              - id: l1-s5
                type: text_input
                text: "A library has 425 story books and 352 information books. How many books is that altogether?"
                answer: "777"
                hints: ["Write 352 under 425 and add the ones first."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Add in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["714", "263"], op: "+", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["7", "9", "8", "6"]
                answer: ["7", "7", "9"]
              - id: l1-n2
                type: text_input
                text: "Add in columns."
                say: "Add three hundred and eighty and four hundred and nineteen in columns."
                show: { drawn: written-calc, rows: ["380", "419"], op: "+" }
                answer: "799"
              - id: l1-n3
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["546", "231"], op: "+", result: "777" }
                answer: true
              - id: l1-n4
                type: text_input
                text: "Add in columns."
                say: "Add one hundred and fifty-two and six hundred and thirty-four in columns."
                show: { drawn: written-calc, rows: ["152", "634"], op: "+" }
                answer: "786"
              - id: l1-n5
                type: text_input
                text: "Ruby collects 241 shells and Sam collects 314. How many shells is that altogether?"
                answer: "555"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Add in columns."
            say: "Add four hundred and twenty-three and three hundred and fifty-six in columns."
            show: { drawn: written-calc, rows: ["423", "356"], op: "+" }
            answer: "779"
          - id: l1-c2
            type: multiple_choice
            text: "In column addition, which column do you add second?"
            options: ["the tens", "the hundreds", "the ones"]
            answer: "the tens"
          - id: l1-c3
            type: true_false
            text: "Is this calculation right?"
            show: { drawn: written-calc, rows: ["316", "572"], op: "+", result: "888" }
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Add in columns. Write the digit for each column."
            say: "Add one hundred and thirty-four and five hundred and twenty-two in columns. Write the digit for the ones, the tens and the hundreds."
            show: { drawn: written-calc, rows: ["134", "522"], op: "+", result: "___" }
            frame: "O: _  T: _  H: _"
            options: ["6", "5", "4", "7"]
            answer: ["6", "5", "6"]
          - id: l1-c5
            type: multiple_choice
            text: "You add 263 + 514 in columns. Which digits do you add in the ones column?"
            say: "You add two hundred and sixty-three and five hundred and fourteen in columns. Which digits do you add in the ones column?"
            options: ["3 and 4", "2 and 5", "6 and 1"]
            answer: "3 and 4"
          - id: l1-c6
            type: true_false
            text: "Is this calculation right?"
            show: { drawn: written-calc, rows: ["342", "425"], op: "+", result: "777" }
            answer: false

  - n: 2
    title: { de: Verschieden lange Zahlen, en: Numbers of different lengths }
    goal:
      de: "Addiere eine kürzere Zahl schriftlich, die Einer ganz rechts untereinander, so wie bei 352 + 41, und prüf mit einem Überschlag."
      en: "Add a shorter number in columns by lining up the ones on the right, like 352 + 41, then check with an estimate."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Add in columns."
            say: "Add two hundred and forty-one and three hundred and fifty-six in columns."
            show: { drawn: written-calc, rows: ["241", "356"], op: "+" }
            answer: "597"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is this calculation right?"
            say: "Check each column. Is this calculation right?"
            show: { drawn: written-calc, rows: ["521", "346"], op: "+", result: "867" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "352 + 41"
            say: "Three hundred and fifty-two add forty-one. Forty-one has only two digits: four tens and one one. Line up the ones on the right. The one goes under the two, and the four goes under the five."
            show: { drawn: written-calc, rows: ["352", "41"], op: "+" }
          - text: "2 + 1 = 3\n5 + 4 = 9\n3 + 0 = 3"
            say: "Ones: two add one is three. Tens: five add four is nine. Hundreds: there is nothing to add to the three, so it stays three. The answer is three hundred and ninety-three."
            show: { drawn: written-calc, rows: ["352", "41"], op: "+", result: "393" }
          - text: "352 + 41 is about 350 + 40 = 390"
            say: "Check with an estimate. Three hundred and ninety-three is close to three hundred and ninety, so it makes sense. If the four had gone under the three, the answer would be seven hundred and sixty-two. That is far too big."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "You add 526 + 32 in columns. Which digit of 526 is above the 3?"
                options: ["2", "5", "6"]
                answer: "2"
                feedback:
                  "5": "32 has 3 tens, so the 3 goes in the tens column. The tens digit of 526 is 2."
                hints:
                  - "Line up the ones on the right first."
                  - "The 2 of 32 goes under the 6. The 3 goes one column to the left."
                  - "The 3 is under the 2."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Add in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["526", "32"], op: "+", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["8", "5", "6", "9"]
                answer: ["8", "5", "5"]
                hints:
                  - "Ones: 6 add 2."
                  - "Tens: 2 add 3. Hundreds: 5, with nothing to add."
                  - "O: 8, T: 5, H: 5. The answer is 558."
              - id: l2-f3
                type: true_false
                text: "Jack adds 612 + 34. He writes the 3 under the 6 and the 4 under the 1. He gets 952. Is Jack right?"
                say: "Jack adds six hundred and twelve and thirty-four. He writes the three under the six and the four under the one, and gets nine hundred and fifty-two. Is Jack right?"
                answer: false
                hints:
                  - "Where should the ones of 34 go?"
                  - "The 4 goes under the 2, and the 3 under the 1."
                  - "No. 612 + 34 = 646."
              - id: l2-f4
                type: text_input
                text: "Add in columns."
                say: "Add four hundred and five and seventy-three in columns."
                show: { drawn: written-calc, rows: ["405", "73"], op: "+" }
                answer: "478"
                hints:
                  - "Ones: 5 add 3."
                  - "Tens: 0 add 7. Hundreds: 4."
                  - "478."
              - id: l2-f5
                type: multiple_choice
                text: "Estimate. Which answer fits 463 + 25?"
                options: ["488", "713", "685"]
                answer: "488"
                feedback:
                  "713": "That is 463 + 250. The 5 in 25 is ones, so it goes under the 3."
                hints:
                  - "25 is a small number. The answer is a little more than 463."
                  - "463 + 25 is about 460 + 30 = 490."
                  - "488."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "You add 734 + 5 in columns. Which digit of 734 is above the 5?"
                options: ["4", "3", "7"]
                answer: "4"
                hints: ["5 is ones. Which digit of 734 is in the ones column?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Add in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["241", "57"], op: "+", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["8", "9", "2", "7"]
                answer: ["8", "9", "2"]
                hints: ["Tens: 4 add 5."]
              - id: l2-s3
                type: text_input
                text: "Add in columns."
                say: "Add one hundred and sixty-three and twenty-four in columns."
                show: { drawn: written-calc, rows: ["163", "24"], op: "+" }
                answer: "187"
                hints: ["The hundreds stay as they are."]
              - id: l2-s4
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["520", "48"], op: "+", result: "568" }
                answer: true
                hints: ["Ones: 0 add 8. Tens: 2 add 4."]
              - id: l2-s5
                type: text_input
                text: "There are 315 people at a concert. 64 more arrive. How many people are there now?"
                answer: "379"
                hints: ["Write 64 under 315, ones under ones."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "You add 851 + 46 in columns. Which digit of 851 is above the 4?"
                options: ["5", "8", "1"]
                answer: "5"
              - id: l2-n2
                type: text_input
                text: "Add in columns."
                say: "Add six hundred and thirty-two and fifty-six in columns."
                show: { drawn: written-calc, rows: ["632", "56"], op: "+" }
                answer: "688"
              - id: l2-n3
                type: true_false
                text: "Lily adds 207 + 61 in columns and gets 817. Is Lily right?"
                say: "Lily adds two hundred and seven and sixty-one in columns and gets eight hundred and seventeen. Is Lily right?"
                answer: false
              - id: l2-n4
                type: text_input
                text: "Add in columns."
                say: "Add four hundred and thirty and eight in columns."
                show: { drawn: written-calc, rows: ["430", "8"], op: "+" }
                answer: "438"
              - id: l2-n5
                type: text_input
                text: "A school orders 240 pencils and 35 rubbers. How many things is that altogether?"
                answer: "275"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: text_input
            text: "Add in columns."
            say: "Add five hundred and fourteen and two hundred and sixty-five in columns."
            show: { drawn: written-calc, rows: ["514", "265"], op: "+" }
            answer: "779"
          - id: l2-c2
            part: lengths
            type: fill_in_blank
            text: "Add in columns. Write the digit for each column."
            say: "Add three hundred and forty-seven and fifty-two in columns. Write the digit for the ones, the tens and the hundreds."
            show: { drawn: written-calc, rows: ["347", "52"], op: "+", result: "___" }
            frame: "O: _  T: _  H: _"
            options: ["9", "3", "8", "7"]
            answer: ["9", "9", "3"]
          - id: l2-c3
            part: place
            type: multiple_choice
            text: "You add 618 + 71 in columns. Which digit of 618 is above the 7?"
            options: ["1", "6", "8"]
            answer: "1"
          - id: l2-c4
            part: check
            type: true_false
            text: "Is this calculation right?"
            show: { drawn: written-calc, rows: ["430", "26"], op: "+", result: "690" }
            answer: false
          - id: l2-c5
            part: lengths
            type: text_input
            text: "Ollie has 126 football cards. He gets a pack with 42 more. How many cards does he have now?"
            answer: "168"
          - id: l2-c6
            part: place
            type: multiple_choice
            text: "You add 803 + 64 in columns. Which digit of 803 is above the 6?"
            say: "You add eight hundred and three and sixty-four in columns. Which digit of eight hundred and three is above the six?"
            options: ["0", "8", "3"]
            answer: "0"
          - id: l2-c7
            part: place
            type: true_false
            text: "Mo adds 135 + 42 in columns. He writes the 2 under the 5 and the 4 under the 3. Is that lined up the right way?"
            say: "Mo adds one hundred and thirty-five and forty-two in columns. He writes the two under the five and the four under the three. Is that lined up the right way?"
            answer: true
          - id: l2-c8
            part: place
            type: multiple_choice
            text: "You add 572 + 6 in columns. Which column does the 6 go in?"
            say: "You add five hundred and seventy-two and six in columns. Which column does the six go in?"
            options: ["the ones", "the tens", "the hundreds"]
            answer: "the ones"
          - id: l2-c9
            part: place
            type: true_false
            text: "Priya adds 461 + 27 in columns. She writes the 2 under the 4 and the 7 under the 6. Is that lined up the right way?"
            say: "Priya adds four hundred and sixty-one and twenty-seven in columns. She writes the two under the four and the seven under the six. Is that lined up the right way?"
            answer: false
          - id: l2-c10
            part: add
            type: text_input
            text: "Add in columns."
            say: "Add three hundred and sixty-two and four hundred and twenty-five in columns."
            show: { drawn: written-calc, rows: ["362", "425"], op: "+" }
            answer: "787"
          - id: l2-c11
            part: add
            type: fill_in_blank
            text: "Add in columns. Write the digit for each column."
            say: "Add five hundred and thirty-one and two hundred and sixty-four in columns. Write the digit for the ones, the tens and the hundreds."
            show: { drawn: written-calc, rows: ["531", "264"], op: "+", result: "___" }
            frame: "O: _  T: _  H: _"
            options: ["5", "9", "7", "8"]
            answer: ["5", "9", "7"]
          - id: l2-c12
            part: add
            type: text_input
            text: "A cinema sells 213 tickets on Friday and 461 tickets on Saturday. How many tickets is that altogether?"
            say: "A cinema sells two hundred and thirteen tickets on Friday and four hundred and sixty-one tickets on Saturday. How many tickets is that altogether?"
            answer: "674"
