# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.semi-written-mult
skill: math.mult-div-larger.semi-written-mult
curriculum: en-GB
language: en
title:
  de: Halbschriftlich malnehmen
  en: Multiplying with the grid method
summary: >
  Multiplying a two- or three-digit number by a one-digit number with the
  steps written down. Lesson 1 partitions a two-digit number into tens and
  ones (4 × 36 = 120 + 24) and sets it out in the grid method; lesson 2
  does the same with three-digit numbers (3 × 124 = 300 + 60 + 12), and
  ends with the skill check.
metadata:
  year: year-3
  topic: { de: Halbschriftlich malnehmen und teilen, en: Informal multiplication and division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.tens]
  also_practises: [math.mult-div-larger.tens, math.mult-div-larger.distributive]
  vocabulary: { en: [grid method, partition, multiply, times, tens, ones, add the parts] }
  forms: [drawn, text, audio]
  drawn: [table]
  facets: [operation-signs, currency]
  misconceptions:
    - id: lose-a-part
      what: Adds a part of the number without multiplying it (3 × 47 = 120 + 7 = 127)
      addressed: lesson 1 Learn multiplies every part; l1-f4 and l2-f3 have feedback on it; every step frame offers the total with a part not multiplied (127, 207, 164, 203, 184, 187, 89, 243, 696, 612, 608, 883, 855, 547)
    - id: digits-not-values
      what: Multiplies the digits as if they were ones (3 × 56 = 3 × 5 + 3 × 6)
      addressed: l1-s4, l1-c3, l2-w2, l2-s4 and l2-c5 offer the digit split
    - id: adds-parts-wrongly
      what: Adds the parts wrongly at the end (5 × 121 = 505)
      addressed: l2-f4 is wrong in the last addition; l1-n4 and l2-n4 ask whether a total is right
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zweistellig mal einstellig", en: "Two digits times one digit" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 × 30 = _"
            say: "Six times thirty."
            answer: "180"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How do you partition 46 into tens and ones?"
            options: ["40 + 6", "4 + 6", "46 + 0"]
            answer: "40 + 6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4 × 36 = 4 × 30 + 4 × 6"
            say: "Four times thirty-six. Partition thirty-six into thirty and six. Then multiply each part by four."
          - text: "4 × 30 = 120\n4 × 6 = 24\n120 + 24 = 144"
            say: "Four times thirty is one hundred and twenty. Four times six is twenty-four. Add the two parts: one hundred and forty-four."
          - text: "120 + 24 = 144"
            say: "The grid method sets this out neatly. The parts of thirty-six go along the top and the four goes at the side. Each box holds one multiplication. Then add the boxes: one hundred and forty-four."
            show: { drawn: table, rows: [["×", "30", "6"], ["4", "120", "24"]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Work out 3 × 47 in steps."
                say: "Three times forty-seven. Multiply the tens, then the ones, then add."
                frame: "3 × 40 = _ → 3 × 7 = _ → 3 × 47 = _"
                options: ["120", "21", "141", "127"]
                answer: ["120", "21", "141"]
                hints:
                  - "Partition 47 into 40 and 7."
                  - "3 × 4 tens = 12 tens. Then 3 × 7, and add both parts."
                  - "120, 21, and 3 × 47 = 141."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fill in the grid for 4 × 57."
                say: "Four times fifty-seven. Fill in each box of the grid, then add."
                show: { drawn: table, rows: [["×", "50", "7"], ["4", "?", "?"]] }
                frame: "4 × 50 = _ → 4 × 7 = _ → 4 × 57 = _"
                options: ["200", "28", "228", "207"]
                answer: ["200", "28", "228"]
                hints:
                  - "Each box multiplies the 4 by one part of 57."
                  - "4 × 5 tens = 20 tens. 4 × 7 = 28."
                  - "200, 28, and 4 × 57 = 228."
              - id: l1-f3
                type: text_input
                text: "6 × 23 = _"
                say: "Six times twenty-three."
                answer: "138"
                hints:
                  - "Partition 23 into 20 and 3."
                  - "6 × 20 = 120 and 6 × 3 = 18."
                  - "120 + 18 = 138."
              - id: l1-f4
                type: multiple_choice
                text: "4 × 53 = _"
                say: "Four times fifty-three."
                options: ["212", "203", "2012"]
                answer: "212"
                feedback:
                  "203": "The 3 must be multiplied too: 4 × 3 = 12. Then 200 + 12 = 212."
                hints:
                  - "Partition 53 into 50 and 3. Multiply both parts by 4."
                  - "4 × 50 = 200 and 4 × 3 = 12."
                  - "200 + 12 = 212."
              - id: l1-f5
                type: text_input
                text: "Each packet has 36 stickers. How many stickers are in 5 packets?"
                answer: "180"
                hints:
                  - "Which multiplication is it?"
                  - "5 × 36: 5 × 30 = 150 and 5 × 6 = 30."
                  - "150 + 30 = 180 stickers."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Work out 8 × 24 in steps."
                say: "Eight times twenty-four. Multiply the tens, then the ones, then add."
                frame: "8 × 20 = _ → 8 × 4 = _ → 8 × 24 = _"
                options: ["160", "32", "192", "164"]
                answer: ["160", "32", "192"]
                hints: ["Tens first: 8 × 2 tens."]
              - id: l1-s2
                type: fill_in_blank
                text: "Fill in the grid for 5 × 43."
                say: "Five times forty-three. Fill in each box of the grid, then add."
                show: { drawn: table, rows: [["×", "40", "3"], ["5", "?", "?"]] }
                frame: "5 × 40 = _ → 5 × 3 = _ → 5 × 43 = _"
                options: ["200", "15", "215", "203"]
                answer: ["200", "15", "215"]
                hints: ["Multiply the 5 by each part."]
              - id: l1-s3
                type: text_input
                text: "4 × 39 = _"
                say: "Four times thirty-nine."
                answer: "156"
                hints: ["4 × 30 = 120 and 4 × 9 = 36."]
              - id: l1-s4
                type: multiple_choice
                text: "Which shows 3 × 56?"
                say: "Which shows three times fifty-six?"
                options: ["3 × 50 + 3 × 6", "3 × 50 + 6", "3 × 5 + 3 × 6"]
                answer: "3 × 50 + 3 × 6"
                hints: ["The 5 in 56 is worth 50, and both parts are multiplied."]
              - id: l1-s5
                type: text_input
                text: "A train ticket costs £45. How many pounds do 3 tickets cost?"
                answer: "135"
                hints: ["3 × 40 = 120 and 3 × 5 = 15."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Work out 6 × 34 in steps."
                say: "Six times thirty-four. Multiply the tens, then the ones, then add."
                frame: "6 × 30 = _ → 6 × 4 = _ → 6 × 34 = _"
                options: ["180", "24", "204", "184"]
                answer: ["180", "24", "204"]
              - id: l1-n2
                type: fill_in_blank
                text: "Fill in the grid for 3 × 67."
                say: "Three times sixty-seven. Fill in each box of the grid, then add."
                show: { drawn: table, rows: [["×", "60", "7"], ["3", "?", "?"]] }
                frame: "3 × 60 = _ → 3 × 7 = _ → 3 × 67 = _"
                options: ["180", "21", "201", "187"]
                answer: ["180", "21", "201"]
              - id: l1-n3
                type: text_input
                text: "8 × 45 = _"
                say: "Eight times forty-five."
                answer: "360"
              - id: l1-n4
                type: true_false
                text: "Is it true? 5 × 26 = 130"
                say: "Five times twenty-six equals one hundred and thirty. Is it true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "A tray holds 48 eggs. How many eggs are on 4 trays?"
                answer: "192"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "3 × 74 = _"
            say: "Three times seventy-four."
            answer: "222"
          - id: l1-c2
            type: fill_in_blank
            text: "Fill in the grid for 4 × 29."
            say: "Four times twenty-nine. Fill in each box of the grid, then add."
            show: { drawn: table, rows: [["×", "20", "9"], ["4", "?", "?"]] }
            frame: "4 × 20 = _ → 4 × 9 = _ → 4 × 29 = _"
            options: ["80", "36", "116", "89"]
            answer: ["80", "36", "116"]
          - id: l1-c3
            type: multiple_choice
            text: "Which shows 4 × 63?"
            say: "Which shows four times sixty-three?"
            options: ["4 × 60 + 4 × 3", "4 × 60 + 3", "4 × 6 + 4 × 3"]
            answer: "4 × 60 + 4 × 3"

  - n: 2
    title: { de: "Dreistellig mal einstellig", en: "Three digits times one digit" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "5 × 47 = _"
            say: "Five times forty-seven."
            answer: "235"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which shows 6 × 35?"
            say: "Which shows six times thirty-five?"
            options: ["6 × 30 + 6 × 5", "6 × 30 + 5", "6 × 3 + 6 × 5"]
            answer: "6 × 30 + 6 × 5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 × 124 = 3 × 100 + 3 × 20 + 3 × 4"
            say: "Three times one hundred and twenty-four. Partition one hundred and twenty-four into one hundred, twenty and four. Now there are three parts to multiply."
          - text: "300 + 60 + 12 = 372"
            say: "In the grid the three parts go along the top. Three times one hundred is three hundred. Three times twenty is sixty. Three times four is twelve. Add the boxes: three hundred and seventy-two."
            show: { drawn: table, rows: [["×", "100", "20", "4"], ["3", "300", "60", "12"]] }
          - text: "4 × 215 = 800 + 40 + 20 = 860"
            say: "Four times two hundred and fifteen. Four times two hundred is eight hundred. Four times ten is forty. Four times five is twenty. Add them: eight hundred and sixty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Work out 2 × 143 in steps."
                say: "Two times one hundred and forty-three. Multiply the hundreds, the tens and the ones, then add."
                frame: "2 × 100 = _ → 2 × 40 = _ → 2 × 3 = _ → 2 × 143 = _"
                options: ["200", "80", "6", "286", "243"]
                answer: ["200", "80", "6", "286"]
                hints:
                  - "Partition 143 into 100, 40 and 3."
                  - "2 × 100 = 200, 2 × 40 = 80, 2 × 3 = 6."
                  - "200 + 80 + 6 = 286."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Fill in the grid for 3 × 236."
                say: "Three times two hundred and thirty-six. Fill in each box of the grid, then add."
                show: { drawn: table, rows: [["×", "200", "30", "6"], ["3", "?", "?", "?"]] }
                frame: "3 × 200 = _ → 3 × 30 = _ → 3 × 6 = _ → 3 × 236 = _"
                options: ["600", "90", "18", "708", "696"]
                answer: ["600", "90", "18", "708"]
                hints:
                  - "Each box multiplies the 3 by one part of 236."
                  - "3 × 2 hundreds = 6 hundreds. 3 × 3 tens = 9 tens. 3 × 6 = 18."
                  - "600, 90, 18, and the total is 708."
              - id: l2-f3
                type: multiple_choice
                text: "4 × 132 = _"
                say: "Four times one hundred and thirty-two."
                options: ["528", "432", "4128"]
                answer: "528"
                feedback:
                  "432": "Every part must be multiplied by 4: 4 × 100 = 400, 4 × 30 = 120 and 4 × 2 = 8."
                hints:
                  - "Partition 132 into 100, 30 and 2."
                  - "4 × 100 = 400, 4 × 30 = 120, 4 × 2 = 8."
                  - "400 + 120 + 8 = 528."
              - id: l2-f4
                type: true_false
                text: "Is it true? 5 × 121 = 505"
                say: "Five times one hundred and twenty-one equals five hundred and five. Is it true?"
                answer: false
                hints:
                  - "Work out each part: 5 × 100, 5 × 20 and 5 × 1."
                  - "500, 100 and 5. Add all three."
                  - "No. 5 × 121 = 605."
              - id: l2-f5
                type: text_input
                text: "A school orders 3 boxes of exercise books. Each box holds 125 books. How many books is that?"
                answer: "375"
                hints:
                  - "Which multiplication is it?"
                  - "3 × 125: 3 × 100 = 300, 3 × 20 = 60, 3 × 5 = 15."
                  - "300 + 60 + 15 = 375 books."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Work out 3 × 212 in steps."
                say: "Three times two hundred and twelve. Multiply the hundreds, the tens and the ones, then add."
                frame: "3 × 200 = _ → 3 × 10 = _ → 3 × 2 = _ → 3 × 212 = _"
                options: ["600", "30", "6", "636", "612"]
                answer: ["600", "30", "6", "636"]
                hints: ["Partition 212 into 200, 10 and 2."]
              - id: l2-s2
                type: fill_in_blank
                text: "Fill in the grid for 4 × 158."
                say: "Four times one hundred and fifty-eight. Fill in each box of the grid, then add."
                show: { drawn: table, rows: [["×", "100", "50", "8"], ["4", "?", "?", "?"]] }
                frame: "4 × 100 = _ → 4 × 50 = _ → 4 × 8 = _ → 4 × 158 = _"
                options: ["400", "200", "32", "632", "608"]
                answer: ["400", "200", "32", "632"]
                hints: ["4 × 5 tens = 20 tens, which is 200."]
              - id: l2-s3
                type: text_input
                text: "2 × 347 = _"
                say: "Two times three hundred and forty-seven."
                answer: "694"
                hints: ["600, 80 and 14."]
              - id: l2-s4
                type: multiple_choice
                text: "Which shows 5 × 163?"
                say: "Which shows five times one hundred and sixty-three?"
                options: ["5 × 100 + 5 × 60 + 5 × 3", "5 × 100 + 60 + 3", "5 × 1 + 5 × 6 + 5 × 3"]
                answer: "5 × 100 + 5 × 60 + 5 × 3"
                hints: ["Multiply every part by its value, not its digit."]
              - id: l2-s5
                type: text_input
                text: "Lucy climbs the 245 steps of a tower and then walks back down. How many steps is that?"
                answer: "490"
                hints: ["Up and down is 2 × 245."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Work out 4 × 223 in steps."
                say: "Four times two hundred and twenty-three. Multiply the hundreds, the tens and the ones, then add."
                frame: "4 × 200 = _ → 4 × 20 = _ → 4 × 3 = _ → 4 × 223 = _"
                options: ["800", "80", "12", "892", "883"]
                answer: ["800", "80", "12", "892"]
              - id: l2-n2
                type: fill_in_blank
                text: "Fill in the grid for 5 × 175."
                say: "Five times one hundred and seventy-five. Fill in each box of the grid, then add."
                show: { drawn: table, rows: [["×", "100", "70", "5"], ["5", "?", "?", "?"]] }
                frame: "5 × 100 = _ → 5 × 70 = _ → 5 × 5 = _ → 5 × 175 = _"
                options: ["500", "350", "25", "875", "855"]
                answer: ["500", "350", "25", "875"]
              - id: l2-n3
                type: text_input
                text: "3 × 318 = _"
                say: "Three times three hundred and eighteen."
                answer: "954"
              - id: l2-n4
                type: true_false
                text: "Is it true? 2 × 465 = 930"
                say: "Two times four hundred and sixty-five equals nine hundred and thirty. Is it true?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "A cinema has 6 screens. Each screen has 128 seats. How many seats are there altogether?"
                answer: "768"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "6 × 42 = _"
            say: "Six times forty-two."
            answer: "252"
          - id: l2-c2
            type: text_input
            text: "8 × 37 = _"
            say: "Eight times thirty-seven."
            answer: "296"
          - id: l2-c3
            type: text_input
            text: "3 × 216 = _"
            say: "Three times two hundred and sixteen."
            answer: "648"
          - id: l2-c4
            type: fill_in_blank
            text: "Fill in the grid for 4 × 147."
            say: "Four times one hundred and forty-seven. Fill in each box of the grid, then add."
            show: { drawn: table, rows: [["×", "100", "40", "7"], ["4", "?", "?", "?"]] }
            frame: "4 × 100 = _ → 4 × 40 = _ → 4 × 7 = _ → 4 × 147 = _"
            options: ["400", "160", "28", "588", "547"]
            answer: ["400", "160", "28", "588"]
          - id: l2-c5
            type: multiple_choice
            text: "Which shows 3 × 54?"
            say: "Which shows three times fifty-four?"
            options: ["3 × 50 + 3 × 4", "3 × 50 + 4", "3 × 5 + 3 × 4"]
            answer: "3 × 50 + 3 × 4"
