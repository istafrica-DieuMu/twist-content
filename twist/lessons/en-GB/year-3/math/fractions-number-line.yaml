            text: "A line from 0 to 1 is cut into 5 equal parts. What is each part?"
            options: ["1/5", "5/1", "1/4"]
            answer: "1/5"
            option_audio: false
          - id: l2-c5
            part: place
            type: multiple_choice
            text: "Which fraction is closer to 1?"
            options: ["5/8", "2/8"]
