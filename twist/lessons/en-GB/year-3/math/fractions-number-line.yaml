# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.fractions-number-line
skill: math.fractions.on-number-line
curriculum: en-GB
language: en
title:
  de: Brüche am Zahlenstrahl
  en: Fractions on a number line
summary: >
  Lesson 1 reads fractions on a number line from 0 to 1 cut into halves,
  thirds, quarters, fifths, eighths and tenths: count the equal parts for
  the bottom number (not the ticks inside), then the steps from 0 for the
  top number. Lesson 2 marks fractions by tapping the line (1/4, 3/4,
  5/8, 2/5), sees that a fraction is a number between 0 and 1 that can
  be closer to 0 or to 1, finds 1/2 as 2/4 and 4/8 in the middle and 4/4
  at 1, and ends with the skill check. Thirds are read, not tapped.
metadata:
  year: year-3
  topic: { de: Brüche, en: Fractions }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.fractions.name-fractions, math.numbers-to-100.number-line]
  also_practises: [math.fractions.name-fractions]
  vocabulary: { en: [fraction, number line, equal parts, half, third, quarter, fifth, eighth, tenth, closer to] }
  forms: [text, audio, drawn]
  drawn: [fraction, number-line]
  facets: []
  parts:
    - { id: read, what: { de: einen Bruch am Zahlenstrahl ablesen, en: reading a fraction on a number line } }
    - { id: parts, what: { de: die gleichen Teile zwischen 0 und 1 zählen, en: counting the equal parts between 0 and 1 } }
    - { id: mark, what: { de: einen Bruch am Zahlenstrahl eintragen, en: marking a fraction on a number line } }
    - { id: place, what: { de: Brüche als Zahlen zwischen 0 und 1 einordnen, en: placing fractions as numbers between 0 and 1 } }
  misconceptions:
    - id: counts-ticks
      what: Counts the ticks between 0 and 1 instead of the equal parts, so a line in quarters gives 1/3
      addressed: lesson 1 Learn screen 5 counts the parts; l1-f2 and l1-f3 have feedback, l1-s1, l1-s3, l1-c1 and l2-c1
    - id: counts-from-first-tick
      what: Starts counting at the first tick instead of at 0, or taps the unit fraction for a non-unit fraction
      addressed: lesson 2 Learn counts steps from 0; l2-f2 has feedback, l2-s1, l2-n2 and l2-c3
    - id: not-a-number
      what: Sees a fraction only as part of a shape, not as a number with a place between 0 and 1
      addressed: lesson 2 Learn screen 4; l2-f4, l2-s3, l2-n3, l2-n5 and l2-c5
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Brüche ablesen, en: Reading fractions on the line }
    goal:
      de: "Lies Brüche auf dem Zahlenstrahl von 0 bis 1 ab. Zähl die gleichen Teile und dann die Schritte ab 0, so wie bei drei Vierteln."
      en: "Read fractions on a number line from 0 to 1. Count the equal parts, then the steps from 0, like 3 quarters."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What fraction is red?"
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }
            options: ["3/4", "1/4", "3/1"]
            answer: "3/4"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Which number does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 30 }
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Where do you think 1/2 goes: before 0, between 0 and 1, or after 1?"
            say: "One half is a number too. Where do you think it goes on the number line: before zero, between zero and one, or after one? Have a guess."
            show: { drawn: number-line, from: 0, to: 1, step: 1, labels: ends }
          - text: "0 to 1 in 2 equal parts: halves"
            say: "Between zero and one! Fractions are numbers too, so they have a place on the number line. This line from zero to one is cut into two equal parts. The middle is one half."
            show: { drawn: number-line, from: 0, to: 1, step: 0.5, labels: ends, mark: 0.5 }
          - text: "4 equal parts: quarters. The arrow is at 1/4."
            say: "Now the line from zero to one has four equal parts. Each part is one quarter. The arrow is one step from zero: one quarter."
            show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends, mark: 0.25 }
          - text: "3 steps from 0: 3/4"
            say: "Count the steps from zero to the arrow: one quarter, two quarters, three quarters. The arrow points to three quarters."
            show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends, mark: 0.75 }
          - text: "Count the parts, not the ticks: 5 parts, so fifths."
            say: "To find the bottom number, count the equal parts between zero and one, not the ticks inside. Here there are four ticks inside, but five parts. The line is in fifths."
            show: { drawn: number-line, from: 0, to: 1, step: 0.2, labels: ends }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.5, labels: ends, mark: 0.5 }
                options: ["1/2", "1/4", "2/1"]
                answer: "1/2"
                option_audio: false
                hints:
                  - "How many equal parts are there between 0 and 1?"
                  - "2 equal parts: halves. The arrow is 1 step from 0."
                  - "1/2."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends, mark: 0.25 }
                options: ["1/4", "1/3", "1/5"]
                answer: "1/4"
                option_audio: false
                feedback:
                  "1/3": "There are 3 ticks inside, but 4 equal parts. Count the parts."
                hints:
                  - "Count the equal parts between 0 and 1, not the ticks."
                  - "There are 4 parts, so the bottom number is 4."
                  - "1 step from 0: 1/4."
              - id: l1-f3
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.2, labels: ends, mark: 0.2 }
                options: ["1/5", "1/4", "1/6"]
                answer: "1/5"
                option_audio: false
                feedback:
                  "1/4": "There are 4 ticks inside, but 5 equal parts. Count the parts."
                hints:
                  - "Count the gaps between 0 and 1."
                  - "There are 5 gaps, so the line is in fifths."
                  - "1 step from 0: 1/5."
              - id: l1-f4
                type: text_input
                text: "Which fraction does the arrow point to?"
                say: "Which fraction does the arrow point to? Type it as a fraction."
                show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends, mark: 0.75 }
                keyboard: fraction
                answer: "3/4"
                hints:
                  - "The line is in quarters."
                  - "Count the steps from 0 to the arrow."
                  - "3 steps: 3/4."
              - id: l1-f5
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.3333333, labels: ends, mark: 0.333 }
                options: ["1/3", "1/2", "1/4"]
                answer: "1/3"
                option_audio: false
                hints:
                  - "How many equal parts are there?"
                  - "3 equal parts: thirds."
                  - "1 step from 0: 1/3."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends, mark: 0.125 }
                options: ["1/8", "1/7", "1/9"]
                answer: "1/8"
                option_audio: false
                hints: ["Count the parts, not the ticks."]
              - id: l1-s2
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.2, labels: ends, mark: 0.6 }
                options: ["3/5", "3/4", "2/5"]
                answer: "3/5"
                option_audio: false
                hints: ["The line is in fifths. Count the steps from 0."]
              - id: l1-s3
                type: text_input
                text: "How many equal parts is the line from 0 to 1 cut into?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.1666667, labels: ends }
                answer: "6"
                hints: ["Count the gaps, not the ticks."]
              - id: l1-s4
                type: true_false
                text: "Is it true? The arrow points to 2/4."
                say: "Is it true? The arrow points to two quarters."
                show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends, mark: 0.5 }
                answer: true
                hints: ["Count the quarter steps from 0."]
              - id: l1-s5
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends, mark: 0.625 }
                options: ["5/8", "5/7", "3/8"]
                answer: "5/8"
                option_audio: false
                hints: ["8 parts. Count the steps from 0."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.3333333, labels: ends, mark: 0.667 }
                options: ["2/3", "1/3", "2/4"]
                answer: "2/3"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.2, labels: ends, mark: 0.8 }
                options: ["4/5", "4/4", "1/5"]
                answer: "4/5"
                option_audio: false
              - id: l1-n3
                type: text_input
                text: "Which fraction does the arrow point to?"
                say: "Which fraction does the arrow point to? Type it as a fraction."
                show: { drawn: number-line, from: 0, to: 1, step: 0.1, labels: ends, mark: 0.7 }
                keyboard: fraction
                answer: "7/10"
              - id: l1-n4
                type: text_input
                text: "A line from 0 to 1 is cut into equal parts. One part is 1/6. How many equal parts are there?"
                say: "A line from zero to one is cut into equal parts. One part is one sixth. How many equal parts are there?"
                answer: "6"
              - id: l1-n5
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends, mark: 1 }
                options: ["4/4", "1/4", "4/1"]
                answer: "4/4"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which fraction does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1, step: 0.2, labels: ends, mark: 0.4 }
            options: ["2/5", "2/4", "3/5"]
            answer: "2/5"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which fraction does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends, mark: 0.375 }
            options: ["3/8", "3/7", "5/8"]
            answer: "3/8"
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "A line from 0 to 1 is cut into 3 equal parts. What is each part?"
            options: ["1/3", "3/1", "1/4"]
            answer: "1/3"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Which fraction does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1, step: 0.1, labels: ends, mark: 0.2 }
            options: ["2/10", "2/9", "8/10"]
            answer: "2/10"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? The arrow points to 1/3."
            say: "Is it true? The arrow points to one third."
            show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends, mark: 0.25 }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Which fraction does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1, step: 0.1666667, labels: ends, mark: 0.333 }
            options: ["2/6", "2/5", "4/6"]
            answer: "2/6"
            option_audio: false

  - n: 2
    title: { de: Brüche eintragen, en: Marking fractions on the line }
    goal:
      de: "Tippe auf dem Zahlenstrahl an, wo ein Bruch hingehört, so wie drei Achtel. Zähl dafür die Schritte ab 0."
      en: "Tap the place on the number line where a fraction goes, like 3 eighths, by counting the steps from 0."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which fraction does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends, mark: 0.25 }
            options: ["1/4", "1/3", "4/1"]
            answer: "1/4"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Into how many equal parts do you cut the line from 0 to 1 for eighths?"
            options: ["8", "7", "9"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "Where do you think 3/4 goes: closer to 0 or closer to 1?"
            say: "Here is a line from zero to one in quarters. Where do you think three quarters goes: closer to zero or closer to one? Have a guess."
            show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends }
          - text: "Mark 3/4: 4 equal parts, then 3 steps from 0."
            say: "To mark three quarters, check that the line has four equal parts. Then start at zero and count three steps: one quarter, two quarters, three quarters. Tap there."
            show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends, mark: 0.75 }
          - text: "Mark 3/8: 8 equal parts, then 3 steps from 0."
            say: "To mark three eighths, the line needs eight equal parts. Start at zero, not at the first tick, and count three steps."
            show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends, mark: 0.375 }
          - text: "1/4 is closer to 0. 3/4 is closer to 1."
            say: "Every fraction here is a number between zero and one. One quarter is close to zero. Three quarters is close to one."
            show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends }
          - text: "In the middle: 1/2 = 2/4 = 4/8\nAt the end: 4/4 = 1"
            say: "The middle of the line is one half. On a line in quarters it is two quarters, and on a line in eighths it is four eighths. Four quarters take you all the way to one."
          - text: "Did you know? At King's Cross station in London there is a sign for Platform 9 3/4, from the Harry Potter books."
            say: "Did you know? At King's Cross station in London there is a sign for Platform nine and three quarters, from the Harry Potter books, with a luggage trolley that looks as if it is vanishing into the wall. On a number line, nine and three quarters sits between nine and ten, closer to ten."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: point_on_line
                text: "Tap 1/4."
                say: "Tap one quarter."
                show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends }
                answer: 0.25
                hints:
                  - "The line has 4 equal parts: quarters."
                  - "Start at 0 and go 1 step."
                  - "The first tick after 0."
                difficulty: easy
              - id: l2-f2
                type: point_on_line
                text: "Tap 3/4."
                say: "Tap three quarters."
                show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends }
                answer: 0.75
                feedback:
                  "0.25": "That is 1/4. Count 3 steps from 0."
                hints:
                  - "The line is in quarters. The top number says how many steps."
                  - "Start at 0 and count 3 steps."
                  - "The tick just before 1."
              - id: l2-f3
                type: point_on_line
                text: "Tap 5/8."
                say: "Tap five eighths."
                show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends }
                answer: 0.625
                hints:
                  - "The line has 8 equal parts: eighths."
                  - "Start at 0 and count 5 steps."
                  - "One step past the middle."
              - id: l2-f4
                type: multiple_choice
                text: "Which fraction is closer to 1?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends }
                options: ["3/4", "1/4"]
                answer: "3/4"
                option_audio: false
                hints:
                  - "Find both fractions on the line."
                  - "1/4 is 1 step from 0. 3/4 is 1 step from 1."
                  - "3/4 is closer to 1."
              - id: l2-f5
                type: point_on_line
                text: "Tap 4/8."
                say: "Tap four eighths."
                show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends }
                answer: 0.5
                hints:
                  - "8 equal parts. Count 4 steps from 0."
                  - "4 is half of 8."
                  - "The middle of the line."

          - support: some
            tasks:
              - id: l2-s1
                type: point_on_line
                text: "Tap 3/8."
                say: "Tap three eighths."
                show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends }
                answer: 0.375
                hints: ["Start counting at 0, not at the first tick."]
              - id: l2-s2
                type: point_on_line
                text: "Tap 2/4."
                say: "Tap two quarters."
                show: { drawn: number-line, from: 0, to: 1, step: 0.25, labels: ends }
                answer: 0.5
                hints: ["2 quarter steps from 0."]
              - id: l2-s3
                type: multiple_choice
                text: "Which fraction is closer to 0?"
                options: ["1/8", "7/8"]
                answer: "1/8"
                option_audio: false
                hints: ["1/8 is only 1 step from 0."]
              - id: l2-s4
                type: point_on_line
                text: "Tap 7/8."
                say: "Tap seven eighths."
                show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends }
                answer: 0.875
                hints: ["7 steps from 0 is 1 step before 1."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 4/4 is at the same place as 1."
                say: "Is it true? Four quarters is at the same place as one."
                answer: true
                hints: ["Count 4 quarter steps from 0."]

          - support: none
            tasks:
              - id: l2-n1
                type: point_on_line
                text: "Tap 2/5."
                say: "Tap two fifths."
                show: { drawn: number-line, from: 0, to: 1, step: 0.2, labels: ends }
                answer: 0.4
              - id: l2-n2
                type: point_on_line
                text: "Tap 6/8."
                say: "Tap six eighths."
                show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends }
                answer: 0.75
              - id: l2-n3
                type: multiple_choice
                text: "Which number is between 0 and 1?"
                options: ["3/4", "2", "5"]
                answer: "3/4"
                option_audio: false
              - id: l2-n4
                type: point_on_line
                text: "Tap 1/8."
                say: "Tap one eighth."
                show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends }
                answer: 0.125
              - id: l2-n5
                type: true_false
                text: "Is it true? 1/4 is closer to 1 than 3/4 is."
                say: "Is it true? One quarter is closer to one than three quarters is."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "Which fraction does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1, step: 0.1666667, labels: ends, mark: 0.167 }
            options: ["1/6", "1/5", "1/7"]
            answer: "1/6"
            option_audio: false
          - id: l2-c2
            part: read
            type: multiple_choice
            text: "Which fraction does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1, step: 0.125, labels: ends, mark: 0.875 }
