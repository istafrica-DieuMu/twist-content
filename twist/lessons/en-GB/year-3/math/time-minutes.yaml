# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.time-minutes
skill: math.time.minutes
curriculum: en-GB
language: en
title:
  de: Minutengenau und 13 bis 24 Uhr
  en: Time to the minute and the 24-hour clock
summary: >
  Lesson 1 reads the clock to the minute by counting in fives to the last
  number and then the small marks (23 minutes past 6, 7 minutes to 9) and
  matches times to clocks; lesson 2 uses am and pm and writes afternoon and
  evening times on the 24-hour clock (3:15 pm is 15:15), and ends with the
  skill check. Every practise stage and both checks also ask the child to
  set the hands to the minute (clock_hands_drag); in lesson 2 the time is
  given on the 24-hour clock. Some clocks have Roman numerals I to XII.
metadata:
  year: year-3
  topic: { de: Uhrzeit, en: Telling the time }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.time.five-minutes, math.numbers-to-100.sequences]
  also_practises: [math.time.five-minutes]
  vocabulary: { en: [minute, minute hand, hour hand, past, to, am, pm, midday, midnight, 24-hour clock, digital] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: [time-format]
  parts:
    - { id: read, what: { de: die Uhrzeit auf die Minute genau ablesen, en: reading the time to the minute } }
    - { id: set, what: { de: die Uhrzeit auf die Minute genau einstellen, en: setting the time to the minute } }
    - { id: to-24, what: { de: Zeiten am Nachmittag und Abend mit 13 bis 24 Uhr angeben, en: writing afternoon and evening times on the 24-hour clock } }
    - { id: from-24, what: { de: 13 bis 24 Uhr als Zeit am Nachmittag oder Abend lesen, en: reading 24-hour times as afternoon or evening times } }
  misconceptions:
    - id: skip-small-marks
      what: Reads only to the last five minutes (6:23 as 20 past 6)
      addressed: lesson 1 Learn counts the small marks after the number; l1-f1 has feedback on it; the rounded time is an option in l1-s1, l1-n1, l1-c1 and l2-c1; setting the hands in l1-f4, l1-s4, l1-c3 and l2-c3 gives feedback for the rounded time
    - id: past-to-hour
      what: Names the hour just gone for times to the hour (5:56 as 4 minutes to 5)
      addressed: lesson 1 Learn reads 8:53 as 7 minutes to 9; l1-f5, l1-s5 and l2-c2 offer the hour just gone
    - id: add-10-not-12
      what: Adds 10 instead of 12 for a pm time (3:20 pm as 13:20)
      addressed: lesson 2 Learn adds 12; l2-f1 has feedback on it; l2-s1, l2-s4, l2-n1, l2-n5, l2-c4 and l2-c5 offer the wrong hour
    - id: number-is-minutes
      what: Reads the number the minute hand is near as the minutes (8:15 for 8:03)
      addressed: l1-n4 sets 8:03, with feedback for the minute hand on the 3 (8:15)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Auf die Minute genau", en: "To the minute" }
    goal:
      de: "Lies die Uhr auf die Minute genau. Zähl in Fünferschritten und dann die kleinen Striche, so wie 23 Minuten nach 6."
      en: "Read the clock to the minute. Count in fives, then count the small marks, like 23 minutes past 6."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 4, minute: 25 }
            options: ["25 past 4", "25 to 4", "25 past 5"]
            answer: "25 past 4"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Count in fives: 35, 40, 45, _"
            answer: "50"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "What time is it?"
            say: "Look at this clock. The minute hand is not on a number. What time do you think it shows? Have a guess."
            show: { drawn: clock, hour: 6, minute: 23 }
          - text: "6:23\n23 minutes past 6"
            say: "Let's find out. Between the numbers on the clock there are small marks. Each mark is one minute. The minute hand is three marks past the four. The four means twenty minutes, and three more makes twenty-three. It is twenty-three minutes past six. On a digital clock it is six twenty-three."
            show: { drawn: clock, hour: 6, minute: 23, digital: true }
          - text: "8:53\n7 minutes to 9"
            say: "Here the minute hand is seven marks before the twelve. It is seven minutes to nine, because nine o'clock is coming next. A digital clock shows eight fifty-three: fifty-three minutes past eight."
            show: { drawn: clock, hour: 8, minute: 53, digital: true }
          - text: "Count in fives, then count the small marks."
            say: "To read the minutes, count in fives to the last number the minute hand has passed, then count on the small marks one at a time. After half past, count back from the twelve to say how many minutes it is to the next hour. Some clocks show the hours in Roman numerals, from one to twelve. You read them in just the same way."
            show: { drawn: clock, hour: 10, minute: 34, roman: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 2, minute: 12 }
                options: ["12 minutes past 2", "10 minutes past 2", "12 minutes to 2"]
                answer: "12 minutes past 2"
                feedback:
                  "10 minutes past 2": "The minute hand is past the 2, which is 10 minutes. Count the 2 small marks after it too: 12 minutes."
                hints:
                  - "Count in fives first, then the small marks."
                  - "Up to the 2 is 10 minutes. Then 2 more marks."
                  - "12 minutes past 2."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "How many minutes past 8 is it?"
                show: { drawn: clock, hour: 8, minute: 37 }
                answer: "37"
                hints:
                  - "Count in fives up to the 7."
                  - "Up to the 7 is 35 minutes. Count the small marks after it."
                  - "37 minutes."
              - id: l1-f3
                type: true_false
                text: "Is it 10:48?"
                say: "Is it ten forty-eight?"
                show: { drawn: clock, hour: 10, minute: 48 }
                answer: true
                hints:
                  - "Up to the 9 is 45 minutes."
                  - "Count the small marks after the 9."
                  - "Yes, it is 10:48."
              - id: l1-f4
                type: clock_hands_drag
                text: "Show 4:17 on the clock."
                say: "Show four seventeen on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 1
                answer: "4:17"
                feedback:
                  "4:15": "That is 4:15. Move the minute hand on 2 more small marks."
                  "3:20": "You swapped the hands. The long minute hand shows the minutes and the short hour hand shows the hour."
                hints:
                  - "Count in fives first: 15 minutes is on the 3."
                  - "17 minutes is 2 marks past the 3. The hour hand goes on the 4."
                  - "Drag the long hand 2 marks past the 3 and the short hand to the 4."
              - id: l1-f5
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 5, minute: 56 }
                options: ["4 minutes to 6", "4 minutes to 5", "56 minutes to 6"]
                answer: "4 minutes to 6"
                hints:
                  - "The minute hand is just before the 12. Which hour is coming next?"
                  - "Count back from the 12: 4 small marks. The next hour is 6."
                  - "4 minutes to 6."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 7, minute: 8 }
                options: ["8 minutes past 7", "5 minutes past 7", "8 minutes past 8"]
                answer: "8 minutes past 7"
                hints: ["Up to the 1 is 5 minutes. Then count the marks."]
              - id: l1-s2
                type: text_input
                text: "How many minutes past 3 is it?"
                show: { drawn: clock, hour: 3, minute: 41, roman: true }
                answer: "41"
                hints: ["Up to the 8 is 40 minutes."]
              - id: l1-s3
                type: true_false
                text: "Is it 9:36?"
                say: "Is it nine thirty-six?"
                show: { drawn: clock, hour: 9, minute: 34 }
                answer: false
                hints: ["Up to the 6 is 30 minutes. How many marks after it?"]
              - id: l1-s4
                type: clock_hands_drag
                text: "Show 11:52 on the clock."
                say: "Show eleven fifty-two on the clock. Drag the hands."
                show: { drawn: clock, hour: 6, minute: 0, roman: true }
                step: 1
                answer: "11:52"
                feedback:
                  "11:50": "That is 11:50. Move the minute hand on 2 more small marks."
                  "12:52": "That is 12:52. It is not yet 12 o'clock, so drag the hour hand to XI."
                hints: ["52 minutes is 2 marks past the 10 (X), and it is not yet 12 o'clock."]
              - id: l1-s5
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 1, minute: 47 }
                options: ["13 minutes to 2", "13 minutes to 1", "47 minutes to 2"]
                answer: "13 minutes to 2"
                hints: ["Count back from the 12 to the minute hand. Which hour comes next?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What time is it?"
                show: { drawn: clock, hour: 6, minute: 19, roman: true }
                options: ["19 minutes past 6", "15 minutes past 6", "19 minutes to 6"]
                answer: "19 minutes past 6"
              - id: l1-n2
                type: text_input
                text: "How many minutes past 12 is it?"
                show: { drawn: clock, hour: 12, minute: 26 }
                answer: "26"
              - id: l1-n3
                type: true_false
                text: "Is it 2 minutes to 3?"
                show: { drawn: clock, hour: 2, minute: 58 }
                answer: true
              - id: l1-n4
                type: clock_hands_drag
                text: "Show 8:03 on the clock."
                say: "Show eight oh three on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 1
                answer: "8:03"
                feedback:
                  "8:15": "That is 8:15. 3 minutes is 3 small marks past the 12, not the number 3."
                  "12:40": "You swapped the hands. The long minute hand shows the minutes and the short hour hand shows the hour."
              - id: l1-n5
                type: multiple_choice
                text: "What does a digital clock show at this time?"
                show: { drawn: clock, hour: 4, minute: 39 }
                options: ["4:39", "4:35", "5:39"]
                answer: "4:39"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 9, minute: 14 }
            options: ["14 minutes past 9", "10 minutes past 9", "14 minutes to 9"]
            answer: "14 minutes past 9"
          - id: l1-c2
            type: text_input
            text: "How many minutes past 5 is it?"
            show: { drawn: clock, hour: 5, minute: 51 }
            answer: "51"
          - id: l1-c3
            type: clock_hands_drag
            text: "Show 7:44 on the clock."
            say: "Show seven forty-four on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 1
            answer: "7:44"
            feedback:
              "7:40": "That is 7:40. Move the minute hand on 4 more small marks."
              "8:44": "That is 8:44. It is not yet 8 o'clock, so drag the hour hand to the 7."
          - id: l1-c4
            type: true_false
            text: "Is it 11 minutes to 4?"
            show: { drawn: clock, hour: 3, minute: 49 }
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "What does a digital clock show at this time?"
            show: { drawn: clock, hour: 12, minute: 7 }
            options: ["12:07", "12:35", "1:07"]
            answer: "12:07"
          - id: l1-c6
            type: clock_hands_drag
            text: "Show 1:33 on the clock."
            say: "Show one thirty-three on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 1
            answer: "1:33"

  - n: 2
    title: { de: "Vormittags, nachmittags und 13 bis 24 Uhr", en: "am, pm and the 24-hour clock" }
    goal:
      de: "Unterscheide Vormittag und Nachmittag und gib Nachmittagszeiten im 24-Stunden-Format an, so wie Viertel nach 3 ist 15 Uhr 15."
      en: "Tell morning from afternoon times, and give afternoon times on the 24-hour clock, like quarter past 3 is fifteen fifteen."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 3, minute: 22 }
            options: ["22 minutes past 3", "20 minutes past 3", "22 minutes to 3"]
            answer: "22 minutes past 3"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "How many minutes past 10 is it?"
            show: { drawn: clock, hour: 10, minute: 9 }
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "How many times does the hour hand go round in one day?"
            say: "From one midnight to the next, how many times do you think the hour hand goes all the way round the clock? Have a guess."
          - text: "am: midnight to midday\npm: midday to midnight"
            say: "Twice! The hour hand goes round the clock twice every day. Times from midnight to midday are am: the night and the morning. Times from midday to midnight are pm: the afternoon and the evening. Breakfast might be at seven thirty am, and tea at five thirty pm."
          - text: "3:15 pm = 15:15"
            say: "A 24-hour clock does not start again after twelve. It carries on: one o'clock in the afternoon is thirteen hundred. So for a pm time, add twelve to the hour. Quarter past three in the afternoon is fifteen fifteen."
            show: { drawn: clock, hour: 3, minute: 15, digital: true }
          - text: "Did you know? am and pm are short for Latin words."
            say: "Did you know? am and pm are short for two Latin words. am means ante meridiem: before midday. pm means post meridiem: after midday."
          - text: "9:40 am = 09:40\nmidday = 12:00\nmidnight = 00:00"
            say: "Morning times keep their hour, with a zero in front: nine forty in the morning is oh nine forty. Midday is twelve hundred, and midnight is written zero zero, zero zero: the start of a new day. A clock face only goes up to twelve, so to show seventeen forty-five on it, take twelve away: the hands show five forty-five."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "3:20 pm on a 24-hour clock is _"
                say: "Three twenty pm. What is that on a 24-hour clock?"
                options: ["15:20", "13:20", "03:20"]
                answer: "15:20"
                feedback:
                  "13:20": "For a pm time, add 12 to the hour, not 10: 3 + 12 = 15."
                  "03:20": "03:20 is twenty past three in the morning. For pm, add 12 to the hour."
                hints:
                  - "pm means the afternoon. What do you add to the hour?"
                  - "Add 12 to the hour: 3 + 12."
                  - "15:20."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "8:00 pm = _:00 on a 24-hour clock"
                say: "Eight pm. What is that on a 24-hour clock?"
                answer: "20"
                hints:
                  - "pm: add 12 to the hour."
                  - "8 + 12."
                  - "20:00."
              - id: l2-f3
                type: clock_hands_drag
                text: "The bus leaves at 17:45. Show the time on the clock."
                say: "The bus leaves at seventeen forty-five. Show the time on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 1
                answer: "5:45"
                feedback:
                  "7:45": "Take 12 away from the hour, not 10: 17 take away 12 is 5."
                hints:
                  - "The clock face only goes up to 12. Take 12 away from the hour."
                  - "17 take away 12 is 5. 45 minutes: the minute hand points to the 9."
                  - "Drag the short hand to the 5 and the long hand to the 9."
              - id: l2-f4
                type: true_false
                text: "Is it true? 10:30 am is 10:30 on a 24-hour clock."
                answer: true
                hints:
                  - "Is 10:30 am in the morning or the afternoon?"
                  - "Morning times keep the same hour."
                  - "Yes, it is 10:30."
              - id: l2-f5
                type: multiple_choice
                text: "The film starts at 6:15 in the evening. How is that written on a 24-hour clock?"
                options: ["18:15", "16:15", "06:15"]
                answer: "18:15"
                feedback:
                  "06:15": "06:15 is a quarter past six in the morning. The cinema would be full of people in pyjamas! The evening is pm, so add 12."
                hints:
                  - "The evening is pm."
                  - "Add 12 to the hour: 6 + 12."
                  - "18:15."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "4:50 pm on a 24-hour clock is _"
                say: "Four fifty pm. What is that on a 24-hour clock?"
                options: ["16:50", "14:50", "04:50"]
                answer: "16:50"
                hints: ["Add 12 to the hour."]
              - id: l2-s2
                type: text_input
                text: "9:00 pm = _:00 on a 24-hour clock"
                say: "Nine pm. What is that on a 24-hour clock?"
                answer: "21"
                hints: ["9 + 12."]
              - id: l2-s3
                type: clock_hands_drag
                text: "Lunch ends at 13:08. Show the time on the clock."
                say: "Lunch ends at thirteen oh eight. Show the time on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 1
                answer: "1:08"
                feedback:
                  "3:08": "Take 12 away from the hour, not 10: 13 take away 12 is 1."
                hints: ["Take 12 away from the hour. 8 minutes is 3 small marks past the 1."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 7:20 pm is 17:20 on a 24-hour clock."
                answer: false
                hints: ["Add 12 to the hour: 7 + 12."]
              - id: l2-s5
                type: multiple_choice
                text: "Ben's swimming lesson starts at quarter past four in the afternoon. How is that written on a 24-hour clock?"
                options: ["16:15", "14:15", "04:15"]
                answer: "16:15"
                hints: ["The afternoon is pm, so add 12 to the hour."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "11:35 pm on a 24-hour clock is _"
                say: "Eleven thirty-five pm. What is that on a 24-hour clock?"
                options: ["23:35", "21:35", "11:35"]
                answer: "23:35"
              - id: l2-n2
                type: text_input
                text: "1:00 pm = _:00 on a 24-hour clock"
                say: "One pm. What is that on a 24-hour clock?"
                answer: "13"
              - id: l2-n3
                type: clock_hands_drag
                text: "The film ends at 20:37. Show the time on the clock."
                say: "The film ends at twenty thirty-seven. Show the time on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 1
                answer: "8:37"
                feedback:
                  "10:37": "Take 12 away from the hour, not 10: 20 take away 12 is 8."
              - id: l2-n4
                type: multiple_choice
                text: "Which of these times is in the morning?"
                options: ["08:25", "20:25", "14:25"]
                answer: "08:25"
              - id: l2-n5
                type: multiple_choice
                text: "It is the afternoon. What time is it on a 24-hour clock?"
                show: { drawn: clock, hour: 2, minute: 36 }
                options: ["14:36", "12:36", "02:36"]
                answer: "14:36"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 11, minute: 18, roman: true }
            options: ["18 minutes past 11", "15 minutes past 11", "18 minutes to 11"]
            answer: "18 minutes past 11"
          - id: l2-c2
            part: read
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 6, minute: 52 }
            options: ["8 minutes to 7", "8 minutes to 6", "52 minutes to 7"]
            answer: "8 minutes to 7"
          - id: l2-c3
            part: set
            type: clock_hands_drag
            text: "Show 2:29 on the clock."
            say: "Show two twenty-nine on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 1
            answer: "2:29"
            feedback:
              "2:25": "That is 2:25. Move the minute hand on 4 more small marks."
              "3:29": "That is 3:29. It is just before half past 2, so the hour hand goes on the 2."
          - id: l2-c4
            part: to-24
            type: multiple_choice
            text: "5:10 pm on a 24-hour clock is _"
            say: "Five ten pm. What is that on a 24-hour clock?"
            options: ["17:10", "15:10", "05:10"]
            answer: "17:10"
          - id: l2-c5
            part: to-24
            type: multiple_choice
            text: "It is the evening. What time is it on a 24-hour clock?"
            show: { drawn: clock, hour: 9, minute: 47 }
            options: ["21:47", "19:47", "09:47"]
            answer: "21:47"
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 4, minute: 33 }
            options: ["27 minutes to 5", "27 minutes to 4", "33 minutes to 5"]
            answer: "27 minutes to 5"
          - id: l2-c7
            part: read
            type: text_input
            text: "How many minutes past 7 is it?"
            show: { drawn: clock, hour: 7, minute: 16, roman: true }
            answer: "16"
          - id: l2-c8
            part: read
            type: true_false
            text: "Is it 1:29?"
            say: "Is it one twenty-nine?"
            show: { drawn: clock, hour: 1, minute: 31 }
            answer: false
          - id: l2-c9
            part: set
            type: clock_hands_drag
            text: "Show 9:06 on the clock."
            say: "Show nine oh six on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 1
            answer: "9:06"
          - id: l2-c10
            part: set
            type: clock_hands_drag
            text: "Show 3:58 on the clock."
            say: "Show three fifty-eight on the clock. Drag the hands."
            show: { drawn: clock, hour: 6, minute: 0, roman: true }
            step: 1
            answer: "3:58"
          - id: l2-c11
            part: set
            type: clock_hands_drag
            text: "Show 21 minutes past 10 on the clock."
            say: "Show twenty-one minutes past ten on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 1
            answer: "10:21"
          - id: l2-c12
            part: set
            type: clock_hands_drag
            text: "Show 6 minutes to 5 on the clock."
            say: "Show six minutes to five on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 1
            answer: "4:54"
          - id: l2-c13
            part: to-24
            type: multiple_choice
            text: "Mia's dance class starts at twenty to seven in the evening. How is that written on a 24-hour clock?"
            options: ["18:40", "19:40", "06:40"]
            answer: "18:40"
          - id: l2-c14
            part: to-24
            type: text_input
            text: "It is 2:44 pm. What is that on a 24-hour clock? _:44"
            say: "It is two forty-four pm. What is that on a 24-hour clock? Type the hour."
            answer: "14"
          - id: l2-c15
            part: to-24
            type: true_false
            text: "Is it true? 6:05 am is 18:05 on a 24-hour clock."
            say: "Is it true? Six oh five am is eighteen oh five on a 24-hour clock."
            answer: false
          - id: l2-c16
            part: from-24
            type: multiple_choice
            text: "What is 16:40 on a 12-hour clock?"
            say: "What is sixteen forty on a 12-hour clock?"
            options: ["4:40 pm", "6:40 pm", "4:40 am"]
            answer: "4:40 pm"
          - id: l2-c17
            part: from-24
            type: clock_hands_drag
            text: "The shop closes at 18:25. Show the time on the clock."
