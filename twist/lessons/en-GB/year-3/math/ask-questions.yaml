# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.ask-questions
skill: math.word-problems.ask-questions
curriculum: en-GB
language: en
title:
  de: Fragen zu Sachaufgaben stellen
  en: Asking questions about a situation
summary: >
  Lesson 1 finds questions that fit a situation and the calculation that
  answers each one (How many altogether? How many more?); lesson 2 tells
  questions the story can answer from ones it cannot, finds the missing
  fact, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.word-problems.question-calc-answer]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { en: [question, fact, information, answer, altogether, how many more, left] }
  forms: [text, audio]
  drawn: []
  facets: [currency]
  parts:
    - { id: fit, what: { de: eine passende Frage zu einer Sachsituation finden, en: finding a question that fits a situation } }
    - { id: calc, what: { de: eine Frage mit einer Rechnung beantworten, en: answering a question with a calculation } }
    - { id: answerable, what: { de: "erkennen, ob sich eine Frage beantworten lässt", en: telling whether a question can be answered } }
    - { id: missing, what: { de: die fehlende Angabe finden, en: finding the missing fact } }
  misconceptions:
    - id: any-question-works
      what: Thinks every question about the story can be answered, even when a fact is missing (How old is the bus driver?)
      addressed: lesson 2 Learn shows a question with no fact to answer it; l2-f1, l2-f2, l2-s2 and l2-n2 sort or pick questions that cannot be answered, with feedback in l2-f1; l1-s5 asks whether a colour question fits
    - id: question-not-calculation
      what: Asks a question whose answer is already in the story (How many red balloons has Amy got?)
      addressed: lesson 1 Learn says a good question asks for something new; l1-f2 and l1-s2 offer questions the story already answers, with feedback in l1-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Passende Fragen finden", en: "Finding questions that fit" }
    goal:
      de: "Überleg dir eine Frage, die zu einer Rechengeschichte passt, so wie viele Ballons Amy insgesamt hat, und finde die Rechnung dazu."
      en: "Think of a question that fits a number story, like how many balloons Amy has altogether, and find the calculation."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which sentence is the question?\nOllie has 34 marbles. He wins 12 more. How many marbles has he got now?"
            options: ["How many marbles has he got now?", "Ollie has 34 marbles.", "He wins 12 more."]
            answer: "How many marbles has he got now?"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "46 + 30 = _"
            answer: "76"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Amy has 28 red balloons and 15 blue balloons."
            say: "Amy has twenty-eight red balloons and fifteen blue balloons. There is no question yet. You can ask one yourself."
          - text: "How many balloons has Amy got altogether?\n28 + 15 = 43"
            say: "One question: how many balloons has Amy got altogether? You add twenty-eight and fifteen. That makes forty-three."
          - text: "How many more red balloons than blue?\n28 − 15 = 13"
            say: "Another question: how many more red balloons are there than blue ones? You take fifteen away from twenty-eight. A good question asks for something new. How many red balloons Amy has is already in the story."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "There are 52 children on the bus. At the museum 18 get off. Which question fits?"
                options: ["How many children are still on the bus?", "How old are the children?", "What is the bus driver called?"]
                answer: "How many children are still on the bus?"
                hints:
                  - "You should be able to answer the question with the numbers in the story."
                  - "You know how many are on the bus and how many get off."
                  - "How many children are still on the bus?"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ben has 64 stickers. Leah has 37 stickers. Which question asks for something new?"
                options: ["How many stickers have they got altogether?", "How many stickers has Ben got?", "How many stickers has Leah got?"]
                answer: "How many stickers have they got altogether?"
                feedback:
                  "How many stickers has Ben got?": "That is already in the story: 64. A good question asks for something new."
                  "How many stickers has Leah got?": "That is already in the story: 37. A good question asks for something new."
                hints:
                  - "Which answer is not in the story yet?"
                  - "For a new answer you have to calculate."
                  - "How many stickers have they got altogether?"
              - id: l1-f3
                type: multiple_choice
                text: "Ben has 64 stickers. Leah has 37. How many stickers have they got altogether? Which calculation fits?"
                options: ["64 + 37", "64 − 37", "37 − 64"]
                answer: "64 + 37"
                hints:
                  - "Altogether means you put both amounts together."
                  - "That is an addition."
                  - "64 + 37."
              - id: l1-f4
                type: matching
                text: "Ben has 64 stickers. Leah has 37. Match each question to its calculation."
                pairs:
                  - { left: { text: "How many altogether?" }, right: { text: "64 + 37" } }
                  - { left: { text: "How many more has Ben got?" }, right: { text: "64 − 37" } }
                option_audio: false
                hints:
                  - "Altogether is adding."
                  - "How many more: you compare, so you find the difference."
                  - "Altogether: 64 + 37. How many more: 64 − 37."
              - id: l1-f5
                type: true_false
                text: "There are 80 books on the shelf. 25 books are borrowed. Does this question fit: How many books are left on the shelf?"
                answer: true
                hints:
                  - "Can you answer the question with the numbers?"
                  - "80 take away 25."
                  - "Yes, the question fits."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "In the playground 36 girls and 29 boys are playing. Which question fits?"
                options: ["How many children are playing?", "How big is the playground?", "When do the children go home?"]
                answer: "How many children are playing?"
                hints: ["You must be able to work out the answer from the numbers."]
              - id: l1-s2
                type: multiple_choice
                text: "Grandad bakes 48 biscuits. The children eat 19. Which question asks for something new?"
                options: ["How many biscuits are left?", "How many biscuits does Grandad bake?", "How many biscuits do the children eat?"]
                answer: "How many biscuits are left?"
                hints: ["Two of the answers are already in the story."]
              - id: l1-s3
                type: multiple_choice
                text: "Grandad bakes 48 biscuits. The children eat 19. How many biscuits are left? Which calculation fits?"
                options: ["48 − 19", "48 + 19", "19 − 48"]
                answer: "48 − 19"
                hints: ["The number of biscuits gets smaller."]
              - id: l1-s4
                type: matching
                text: "A basket holds 45 apples and 18 pears. Match each question to its calculation."
                pairs:
                  - { left: { text: "How much fruit altogether?" }, right: { text: "45 + 18" } }
                  - { left: { text: "How many more apples than pears?" }, right: { text: "45 − 18" } }
                option_audio: false
                hints: ["More than: you compare the two amounts."]
              - id: l1-s5
                type: true_false
                text: "Isla has 90p. A lolly costs 35p. Does this question fit: What colour is the lolly?"
                answer: false
                hints: ["Can you work out a colour from the numbers?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "75 children visit the zoo. 40 go to see the penguins and the rest go to the lions. Which question fits?"
                options: ["How many children go to the lions?", "How many penguins are there?", "What is the zoo called?"]
                answer: "How many children go to the lions?"
              - id: l1-n2
                type: multiple_choice
                text: "75 children visit the zoo. 40 go to see the penguins. How many go to the lions? Which calculation fits?"
                options: ["75 − 40", "75 + 40", "40 − 75"]
                answer: "75 − 40"
              - id: l1-n3
                type: matching
                text: "Priya has 56 cards. Sam has 38. Match each question to its calculation."
                pairs:
                  - { left: { text: "How many cards altogether?" }, right: { text: "56 + 38" } }
                  - { left: { text: "How many more has Priya got?" }, right: { text: "56 − 38" } }
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "In the garden 27 tulips and 16 roses are in flower. Does this question fit: How many flowers are there altogether?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "In the garden 27 tulips and 16 roses are in flower. How many flowers is that altogether?"
                answer: "43"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A cinema has 120 seats. 85 are taken. Which question fits?"
            options: ["How many seats are empty?", "What film is on?", "How long is the film?"]
            answer: "How many seats are empty?"
          - id: l1-c2
            type: multiple_choice
            text: "A cinema has 120 seats. 85 are taken. How many seats are empty? Which calculation fits?"
            options: ["120 − 85", "120 + 85", "85 − 120"]
            answer: "120 − 85"
          - id: l1-c3
            type: true_false
            text: "Max has 30 crayons. Ruby has 22. Does this question ask for something new: How many crayons has Max got?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Jess has 45p. A comic costs 80p. Which question fits?"
            options: ["How much more money does Jess need?", "What is the comic called?", "Which shop sells the comic?"]
            answer: "How much more money does Jess need?"
          - id: l1-c5
            type: matching
            text: "There are 62 cars and 27 vans in the car park. Match each question to its calculation."
            pairs:
              - { left: { text: "How many vehicles altogether?" }, right: { text: "62 + 27" } }
              - { left: { text: "How many more cars than vans?" }, right: { text: "62 − 27" } }
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "A class has 30 children. 12 are away today. Does this question fit: How many children are at school today?"
            answer: true

  - n: 2
    title: { de: "Kann ich das beantworten?", en: "Can I answer it?" }
    goal:
      de: "Finde heraus, welche Fragen eine Geschichte beantworten kann, und finde die fehlende Angabe, so wie den Preis für ein Heft."
      en: "Work out which questions a story can answer, and spot the missing fact, like the price of one notebook."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A farmer has 63 sheep. 28 are in the top field. Which question fits?"
            options: ["How many sheep are not in the top field?", "How old is the farmer?", "What colour are the sheep?"]
            answer: "How many sheep are not in the top field?"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "A farmer has 63 sheep. 28 are in the top field. How many are not? Which calculation fits?"
            options: ["63 − 28", "63 + 28", "28 + 35"]
            answer: "63 − 28"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A class goes on a trip with 30 children and 4 adults."
            say: "A class goes on a trip. There are thirty children and four adults."
          - text: "How many people go on the trip? 30 + 4 = 34. ✓"
            say: "How many people go on the trip? You can answer that: thirty add four is thirty-four."
          - text: "How old is the teacher? ✗\nHow much does the trip cost? ✗"
            say: "How old is the teacher? You cannot answer that. Nothing in the story tells you. How much does the trip cost? You cannot answer that either: a fact is missing. Before you calculate, check that the story gives you every fact you need."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "There are 26 children in Class 3. 14 of them are girls. Which question can you answer?"
                options: ["How many boys are in Class 3?", "How many children wear glasses?", "How old is the oldest child?"]
                answer: "How many boys are in Class 3?"
                feedback:
                  "How many children wear glasses?": "The story says nothing about glasses, so you cannot answer that."
                  "How old is the oldest child?": "The story says nothing about ages, so you cannot answer that."
                hints:
                  - "Which question can you answer using only the numbers in the story?"
                  - "You know all the children and the girls."
                  - "How many boys are in Class 3? 26 − 14."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "At the pool there are 46 children. 19 jump off the diving board. Which questions can you answer?"
                bins:
                  - { id: yes, show: { text: "I can answer it" }, say: "I can answer it" }
                  - { id: no, show: { text: "I can't answer it" }, say: "I can't answer it" }
                options:
                  - { text: "How many children don't jump?", bin: yes }
                  - { text: "How deep is the pool?", bin: no }
                  - { text: "How many children are at the pool?", bin: yes }
                  - { text: "How warm is the water?", bin: no }
                option_audio: false
                hints:
                  - "Is the answer in the story, or can you work it out from the numbers?"
                  - "The story says nothing about how deep the pool is or how warm the water is."
                  - "Can answer: how many don't jump, how many are at the pool. Can't answer: deep, warm."
              - id: l2-f3
                type: multiple_choice
                text: "Tom buys 3 notebooks. How much does he pay? Which fact is missing?"
                options: ["how much one notebook costs", "how many notebooks he buys", "what Tom's surname is"]
                answer: "how much one notebook costs"
                hints:
                  - "What do you know already?"
                  - "You know how many notebooks. To find the total you need a price."
                  - "How much one notebook costs."
              - id: l2-f4
                type: true_false
                text: "A jar holds 85 sweets. Jack eats 12. Can you answer: How many sweets are left in the jar?"
                answer: true
                hints:
                  - "Do you have both numbers you need?"
                  - "85 sweets, 12 eaten."
                  - "Yes: 85 − 12 = 73."
              - id: l2-f5
                type: multiple_choice
                text: "A shop sells 140 ice creams on Saturday. Which extra fact lets you answer: How many did it sell over the weekend?"
                options: ["how many it sold on Sunday", "how much one ice cream costs", "what flavours there are"]
                answer: "how many it sold on Sunday"
                hints:
                  - "The weekend is Saturday and Sunday."
                  - "You know Saturday. What else do you need?"
                  - "How many it sold on Sunday."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A bus leaves with 42 people. At the first stop 9 people get off. Which question can you answer?"
                options: ["How many people are still on the bus?", "Where does the bus go next?", "How many people have a ticket for the train?"]
                answer: "How many people are still on the bus?"
                hints: ["The story only tells you about people on the bus and the first stop."]
              - id: l2-s2
                type: sorting
                text: "A baker makes 100 rolls. By lunchtime he sells 65. Which questions can you answer?"
                bins:
                  - { id: yes, show: { text: "I can answer it" }, say: "I can answer it" }
                  - { id: no, show: { text: "I can't answer it" }, say: "I can't answer it" }
                options:
                  - { text: "How many rolls are left?", bin: yes }
                  - { text: "How much does one roll cost?", bin: no }
                  - { text: "How many rolls has he sold?", bin: yes }
                  - { text: "When does the bakery open?", bin: no }
                option_audio: false
                hints: ["The story says nothing about prices or times."]
              - id: l2-s3
                type: multiple_choice
                text: "An ice lolly costs 70p. Mia buys one. How much change does she get? Which fact is missing?"
                options: ["how much money Mia pays with", "how much the lolly costs", "which flavour Mia picks"]
                answer: "how much money Mia pays with"
                hints: ["To find the change you need to know what she hands over."]
              - id: l2-s4
                type: true_false
                text: "Dad buys 4 tickets. Can you answer: How much do the tickets cost altogether?"
                answer: false
                hints: ["Does the story give the price of one ticket?"]
              - id: l2-s5
                type: multiple_choice
                text: "Leo reads 25 pages on Monday. Which extra fact lets you answer: How many pages are left in his book?"
                options: ["how many pages the book has", "what the book is called", "how fast Leo reads"]
                answer: "how many pages the book has"
                hints: ["What is left is all the pages take away the pages he has read."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The hens lay 36 eggs. 12 eggs fit in a box. Which question can you answer?"
                options: ["How many boxes can be filled?", "How many hens are there?", "What colour are the eggs?"]
                answer: "How many boxes can be filled?"
              - id: l2-n2
                type: sorting
                text: "Jonah has 90 marbles. He gives Ali 35. Which questions can you answer?"
                bins:
                  - { id: yes, show: { text: "I can answer it" }, say: "I can answer it" }
                  - { id: no, show: { text: "I can't answer it" }, say: "I can't answer it" }
                options:
                  - { text: "How many marbles has Jonah got left?", bin: yes }
                  - { text: "How many marbles had Ali got before?", bin: no }
                  - { text: "How many marbles does Jonah give away?", bin: yes }
                  - { text: "How old is Ali?", bin: no }
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "The train leaves at 9 am. When does it arrive? Which fact is missing?"
                options: ["how long the journey takes", "where the train leaves from", "how many carriages it has"]
                answer: "how long the journey takes"
              - id: l2-n4
                type: true_false
                text: "Zara has £5. She buys a book for £3. Can you answer: How much money has Zara got left?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "Zara has £5. She buys a book for £3. How much money has she got left, in pounds?"
                answer: "2"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: fit
            type: multiple_choice
            text: "The school hall has 150 chairs. 95 people come to the play. Which question can you answer?"
            options: ["How many chairs are empty?", "How long is the play?", "How many people liked the play?"]
            answer: "How many chairs are empty?"
          - id: l2-c2
            part: answerable
            type: sorting
            text: "A library has 300 books. 120 are on loan. Which questions can you answer?"
            bins:
              - { id: yes, show: { text: "I can answer it" }, say: "I can answer it" }
              - { id: no, show: { text: "I can't answer it" }, say: "I can't answer it" }
            options:
              - { text: "How many books are on the shelves?", bin: yes }
              - { text: "How many books are about animals?", bin: no }
              - { text: "How many books are on loan?", bin: yes }
              - { text: "Who borrowed the most books?", bin: no }
            option_audio: false
          - id: l2-c3
            part: missing
            type: multiple_choice
            text: "Erin buys 5 pencils. How much does she pay? Which fact is missing?"
            options: ["the price of one pencil", "how many pencils she buys", "the colour of the pencils"]
            answer: "the price of one pencil"
          - id: l2-c4
            part: calc
            type: matching
            text: "A tree has 70 red apples and 45 green apples. Match each question to its calculation."
            pairs:
              - { left: { text: "How many apples altogether?" }, right: { text: "70 + 45" } }
              - { left: { text: "How many more red than green?" }, right: { text: "70 − 45" } }
            option_audio: false
          - id: l2-c5
            part: answerable
            type: true_false
            text: "Noah has 40 stamps. He gets some more for his birthday. Can you answer: How many stamps has he got now?"
            answer: false
          - id: l2-c6
            part: fit
            type: multiple_choice
            text: "A garden centre has 240 plants. It sells 115 on Saturday. Which question fits?"
            options: ["How many plants are left?", "What colour are the flowers?", "How tall is the tallest plant?"]
            answer: "How many plants are left?"
          - id: l2-c7
            part: fit
            type: multiple_choice
            text: "Lucy has 58 beads. Kai has 34 beads. Which question asks for something new?"
            options: ["How many more beads has Lucy got than Kai?", "How many beads has Kai got?", "How many beads has Lucy got?"]
            answer: "How many more beads has Lucy got than Kai?"
          - id: l2-c8
            part: fit
            type: true_false
            text: "A farmer picks 360 apples and 145 pears. Does this question fit: How much fruit does the farmer pick altogether?"
            answer: true
          - id: l2-c9
            part: fit
            type: true_false
            text: "There are 32 children in the class. 17 have school dinners. Does this question ask for something new: How many children are in the class?"
            answer: false
          - id: l2-c10
            part: calc
            type: multiple_choice
            text: "A train has 215 seats. 180 people get on. How many seats are empty? Which calculation fits?"
            options: ["215 − 180", "215 + 180", "180 − 215"]
            answer: "215 − 180"
          - id: l2-c11
            part: calc
            type: matching
            text: "Sophie scores 64 points. Jack scores 48 points. Match each question to its calculation."
            pairs:
              - { left: { text: "How many points altogether?" }, right: { text: "64 + 48" } }
              - { left: { text: "How many more points has Sophie got?" }, right: { text: "64 − 48" } }
              - { left: { text: "How many more points does Jack need to reach 100?" }, right: { text: "100 − 48" } }
            option_audio: false
          - id: l2-c12
            part: calc
            type: text_input
            text: "A cake shop makes 85 cupcakes and sells 47 of them. How many cupcakes are left?"
            answer: "38"
          - id: l2-c13
            part: calc
            type: multiple_choice
            text: "A box holds 6 eggs. Mum buys 4 boxes. How many eggs does she buy? Which calculation fits?"
            options: ["4 × 6", "6 + 4", "6 − 4"]
            answer: "4 × 6"
          - id: l2-c14
            part: answerable
            type: multiple_choice
            text: "A school buys 250 new books. 130 of them are for the infants. Which question can you answer?"
            options: ["How many books are not for the infants?", "How much did the books cost?", "Which book is the longest?"]
            answer: "How many books are not for the infants?"
          - id: l2-c15
            part: answerable
            type: true_false
            text: "Mr Khan sells 120 newspapers on Monday and 95 on Tuesday. Can you answer: How many does he sell on Wednesday?"
            answer: false
          - id: l2-c16
            part: answerable
            type: sorting
            text: "A café sells 75 sandwiches and 40 bowls of soup on Friday. Which questions can you answer?"
            bins:
              - { id: yes, show: { text: "I can answer it" }, say: "I can answer it" }
              - { id: no, show: { text: "I can't answer it" }, say: "I can't answer it" }
            options:
              - { text: "How many more sandwiches than soups were sold?", bin: yes }
              - { text: "How much does a bowl of soup cost?", bin: no }
              - { text: "How many sandwiches and soups were sold altogether?", bin: yes }
              - { text: "How many sandwiches were sold on Saturday?", bin: no }
            option_audio: false
          - id: l2-c17
            part: missing
            type: multiple_choice
            text: "Grace saves £4 every week. How much has she saved? Which fact is missing?"
            options: ["how many weeks she has saved for", "how much she saves each week", "what she wants to buy"]
            answer: "how many weeks she has saved for"
          - id: l2-c18
            part: missing
            type: multiple_choice
            text: "A rope is 500 cm long. Dan cuts a piece off. How long is the rope now? Which fact is missing?"
            options: ["the length of the piece Dan cuts off", "how long the rope was", "what the rope is for"]
            answer: "the length of the piece Dan cuts off"
          - id: l2-c19
            part: missing
            type: multiple_choice
            text: "Year 3 has two classes. Class 3A has 29 children. Which extra fact lets you answer: How many children are in Year 3?"
            options: ["how many children are in Class 3B", "how many girls are in Class 3A", "how old the children are"]
            answer: "how many children are in Class 3B"
          - id: l2-c20
            part: missing
            type: true_false
            text: "A pack has 8 pens. Ravi buys 3 packs. How many pens does he buy? Is a fact missing?"
            answer: false
