# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.semi-written-to-1000
skill: math.add-sub-to-1000.semi-written
curriculum: en-GB
language: en
title:
  de: Halbschriftlich rechnen bis 1000
  en: Adding and subtracting in written steps
summary: >
  Adding and subtracting three-digit numbers with an informal written
  method, writing each step down. Lesson 1 adds in jumps on an empty
  number line (hundreds, then tens, then ones) and by partitioning both
  numbers; lesson 2 subtracts in jumps, counts on to find the difference
  when the numbers are close together, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-1000.bridging, math.add-sub-to-100.sub-two-digit]
  also_practises: [math.add-sub-to-1000.bridging, math.numbers-to-1000.place-value]
  vocabulary: { en: [partition, jump, empty number line, hundreds, tens, ones, count on, difference, steps] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: []
  misconceptions:
    - id: forgets-new-ten
      what: Adds the parts but loses the ten made by the ones (467 + 218 = 675)
      addressed: lesson 1 Learn adds eleven ones into the total; the lost-ten total is an option in l1-f2 (with feedback), l1-s2, l1-n2, l1-c2 and l2-c2; l1-f5 asks whether a lost ten is right
    - id: swap-ones
      what: Partitions both numbers in a subtraction and takes the smaller ones digit from the larger (352 − 127 = 235)
      addressed: lesson 2 Learn splits only the number taken away; l2-f5 and l2-c5 show the swapped ones
    - id: digits-not-values
      what: Splits a number into its digits instead of its place values (+ 2, + 3, + 8 for 238)
      addressed: l1-f3 (with feedback), l1-s4, l1-c3 and l2-f2 offer the digit split
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Halbschriftlich addieren, en: Adding in steps }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "380 + 50 = _"
            say: "Three hundred and eighty add fifty."
            answer: "430"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "72 − 35 = _"
            say: "Seventy-two subtract thirty-five."
            answer: "37"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "346 + 235"
            say: "Three hundred and forty-six add two hundred and thirty-five. That is a lot to hold in your head, so we write the steps down. One way: start at three hundred and forty-six and jump on the hundreds, then the tens, then the ones."
            show: { drawn: rechenstrich, start: 346, jumps: [200, 30, 5] }
          - text: "346 + 200 = 546\n546 + 30 = 576\n576 + 5 = 581"
            say: "Three hundred and forty-six add two hundred is five hundred and forty-six. Add thirty: five hundred and seventy-six. Add five: five hundred and eighty-one."
          - text: "300 + 200 = 500\n40 + 30 = 70\n6 + 5 = 11\n500 + 70 + 11 = 581"
            say: "Another way: partition both numbers. Hundreds: three hundred add two hundred is five hundred. Tens: forty add thirty is seventy. Ones: six add five is eleven. Then add the three parts. Eleven is a ten and one more, so the total is five hundred and eighty-one. Both ways give the same answer."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Add in steps: 253 + 324"
                say: "Work out two hundred and fifty-three add three hundred and twenty-four in steps."
                frame: "253 + 300 = _ → + 20 = _ → + 4 = _"
                options: ["553", "573", "577", "583"]
                answer: ["553", "573", "577"]
                hints:
                  - "Add the hundreds first, then the tens, then the ones."
                  - "253 add 300 is 553. Then add 20, and then 4."
                  - "553, then 573, then 577."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Partition to add: 467 + 218"
                say: "Partition both numbers to add four hundred and sixty-seven and two hundred and eighteen."
                frame: "400 + 200 = _ → 60 + 10 = _ → 7 + 8 = _ → 467 + 218 = _"
                options: ["600", "70", "15", "685", "675"]
                answer: ["600", "70", "15", "685"]
                feedback:
                  "675": "15 ones are one ten and five ones. Add the ten to the 70 as well: 600 + 70 + 15 = 685."
                hints:
                  - "Add the hundreds, the tens and the ones on their own, then add the three parts."
                  - "600, 70 and 15. Fifteen is a ten and five ones."
                  - "600, 70, 15, and the total is 685."
              - id: l1-f3
                type: multiple_choice
                text: "You add 238 to 415 in jumps. Which jumps do you make?"
                options: ["+ 200, + 30, + 8", "+ 2, + 3, + 8", "+ 200, + 38, + 8"]
                answer: "+ 200, + 30, + 8"
                feedback:
                  "+ 2, + 3, + 8": "The 2 in 238 is worth two hundred and the 3 is worth thirty. Jump the values, not the digits."
                hints:
                  - "What is each digit of 238 worth?"
                  - "238 is 2 hundreds, 3 tens and 8 ones."
                  - "Jump + 200, + 30, + 8."
              - id: l1-f4
                type: text_input
                text: "529 + 246 = _"
                say: "Five hundred and twenty-nine add two hundred and forty-six. Use the jumps."
                show: { drawn: rechenstrich, start: 529, jumps: [200, 40, 6] }
                answer: "775"
                hints:
                  - "Do one jump at a time."
                  - "529 + 200 = 729, and 729 + 40 = 769."
                  - "769 + 6 = 775."
              - id: l1-f5
                type: true_false
                text: "Sam adds 356 + 127. Hundreds: 400. Tens: 70. Ones: 13. Sam writes 473. Is Sam right?"
                say: "Sam adds three hundred and fifty-six and one hundred and twenty-seven. He gets four hundred, seventy and thirteen, and writes four hundred and seventy-three. Is Sam right?"
                answer: false
                hints:
                  - "Add the three parts: 400 + 70 + 13."
                  - "13 ones are one ten and three ones, so there are 8 tens, not 7."
                  - "No. 356 + 127 = 483."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Add in steps: 362 + 415"
                say: "Work out three hundred and sixty-two add four hundred and fifteen in steps."
                frame: "362 + 400 = _ → + 10 = _ → + 5 = _"
                options: ["762", "772", "777", "767"]
                answer: ["762", "772", "777"]
                hints: ["Hundreds first, then tens, then ones."]
              - id: l1-s2
                type: fill_in_blank
                text: "Partition to add: 548 + 336"
                say: "Partition both numbers to add five hundred and forty-eight and three hundred and thirty-six."
                frame: "500 + 300 = _ → 40 + 30 = _ → 8 + 6 = _ → 548 + 336 = _"
                options: ["800", "70", "14", "884", "874"]
                answer: ["800", "70", "14", "884"]
                hints: ["At the end, 14 ones are one ten and four ones."]
              - id: l1-s3
                type: text_input
                text: "637 + 251 = _"
                say: "Six hundred and thirty-seven add two hundred and fifty-one. Use the jumps."
                show: { drawn: rechenstrich, start: 637, jumps: [200, 50, 1] }
                answer: "888"
                hints: ["Jump 200, then 50, then 1."]
              - id: l1-s4
                type: multiple_choice
                text: "You add 409 to 275 in jumps. Which jumps do you make?"
                options: ["+ 400, + 9", "+ 400, + 90", "+ 4, + 9"]
                answer: "+ 400, + 9"
                hints: ["409 has a 0 in the tens place."]
              - id: l1-s5
                type: text_input
                text: "264 children go to breakfast club and 133 go to after-school club. How many is that altogether?"
                answer: "397"
                hints: ["Add 100, then 30, then 3 to 264."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Add in steps: 418 + 371"
                say: "Work out four hundred and eighteen add three hundred and seventy-one in steps."
                frame: "418 + 300 = _ → + 70 = _ → + 1 = _"
                options: ["718", "788", "789", "719"]
                answer: ["718", "788", "789"]
              - id: l1-n2
                type: fill_in_blank
                text: "Partition to add: 256 + 529"
                say: "Partition both numbers to add two hundred and fifty-six and five hundred and twenty-nine."
                frame: "200 + 500 = _ → 50 + 20 = _ → 6 + 9 = _ → 256 + 529 = _"
                options: ["700", "70", "15", "785", "775"]
                answer: ["700", "70", "15", "785"]
              - id: l1-n3
                type: text_input
                text: "583 + 316 = _"
                answer: "899"
              - id: l1-n4
                type: true_false
                text: "Is it true? 445 + 238 = 683"
                say: "Four hundred and forty-five add two hundred and thirty-eight equals six hundred and eighty-three. Is it true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "Ella's book has 347 pages. Her brother's book has 225 pages. How many pages is that altogether?"
                answer: "572"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "324 + 452 = _"
            answer: "776"
          - id: l1-c2
            type: fill_in_blank
            text: "Partition to add: 635 + 247"
            say: "Partition both numbers to add six hundred and thirty-five and two hundred and forty-seven."
            frame: "600 + 200 = _ → 30 + 40 = _ → 5 + 7 = _ → 635 + 247 = _"
            options: ["800", "70", "12", "882", "872"]
            answer: ["800", "70", "12", "882"]
          - id: l1-c3
            type: multiple_choice
            text: "You add 326 to 451 in jumps. Which jumps do you make?"
            options: ["+ 300, + 20, + 6", "+ 3, + 2, + 6", "+ 300, + 26, + 6"]
            answer: "+ 300, + 20, + 6"

  - n: 2
    title: { de: Halbschriftlich subtrahieren, en: Subtracting in steps }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "243 + 135 = _"
            answer: "378"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Add in steps: 472 + 316"
            say: "Work out four hundred and seventy-two add three hundred and sixteen in steps."
            frame: "472 + 300 = _ → + 10 = _ → + 6 = _"
            options: ["772", "782", "788", "778"]
            answer: ["772", "782", "788"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "584 − 236"
            say: "Five hundred and eighty-four subtract two hundred and thirty-six. Start at five hundred and eighty-four and jump back: first the hundreds, then the tens, then the ones."
            show: { drawn: rechenstrich, start: 584, jumps: [-200, -30, -6] }
          - text: "584 − 200 = 384\n384 − 30 = 354\n354 − 6 = 348"
            say: "Five hundred and eighty-four subtract two hundred is three hundred and eighty-four. Subtract thirty: three hundred and fifty-four. Subtract six: three hundred and forty-eight. You only split the number you take away. The first number stays whole."
          - text: "503 − 497\n497 + 3 = 500\n500 + 3 = 503\nThe difference is 6."
            say: "When the two numbers are close together, count on from the smaller one instead. From four hundred and ninety-seven to five hundred is three. From five hundred to five hundred and three is three more. Three and three make six, so the difference is six."
            show: { drawn: rechenstrich, start: 497, jumps: [3, 3] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Subtract in steps: 768 − 325"
                say: "Work out seven hundred and sixty-eight subtract three hundred and twenty-five in steps."
                frame: "768 − 300 = _ → − 20 = _ → − 5 = _"
                options: ["468", "448", "443", "453"]
                answer: ["468", "448", "443"]
                hints:
                  - "Take away the hundreds first, then the tens, then the ones."
                  - "768 subtract 300 is 468. Then take away 20, and then 5."
                  - "468, then 448, then 443."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "You subtract 243 in jumps. Which jumps do you make?"
                options: ["− 200, − 40, − 3", "− 2, − 4, − 3", "− 200, − 40, + 3"]
                answer: "− 200, − 40, − 3"
                feedback:
                  "− 200, − 40, + 3": "You take all of 243 away, so every jump goes back."
                hints:
                  - "What is each digit of 243 worth?"
                  - "243 is 2 hundreds, 4 tens and 3 ones, and you take all of them away."
                  - "Jump − 200, − 40, − 3."
              - id: l2-f3
                type: text_input
                text: "652 − 418 = _"
                say: "Six hundred and fifty-two subtract four hundred and eighteen. Use the jumps."
                show: { drawn: rechenstrich, start: 652, jumps: [-400, -10, -8] }
                answer: "234"
                hints:
                  - "Jump back 400, then 10, then 8."
                  - "652 − 400 = 252, and 252 − 10 = 242."
                  - "242 − 8 = 234."
              - id: l2-f4
                type: fill_in_blank
                text: "Count on to find 604 − 595."
                say: "The numbers are close together. Count on from five hundred and ninety-five to six hundred and four."
                frame: "595 + _ = 600 → 600 + _ = 604 → 604 − 595 = _"
                options: ["5", "4", "9", "10", "1"]
                answer: ["5", "4", "9"]
                hints:
                  - "First jump to the next hundred, then on to 604."
                  - "From 595 to 600 is 5. From 600 to 604 is 4."
                  - "5, 4, and the difference is 9."
              - id: l2-f5
                type: true_false
                text: "Max works out 352 − 127 like this: 300 − 100 = 200, 50 − 20 = 30, 7 − 2 = 5. He writes 235. Is Max right?"
                say: "Max works out three hundred and fifty-two subtract one hundred and twenty-seven. He takes the hundreds, then the tens, then seven subtract two for the ones, and writes two hundred and thirty-five. Is Max right?"
                answer: false
                hints:
                  - "Look at the ones. Which number has 2 ones, and which has 7?"
                  - "352 has only 2 ones, and 7 are taken away. Max did 7 − 2 the wrong way round."
                  - "No. 352 − 127 = 225."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Subtract in steps: 879 − 456"
                say: "Work out eight hundred and seventy-nine subtract four hundred and fifty-six in steps."
                frame: "879 − 400 = _ → − 50 = _ → − 6 = _"
                options: ["479", "429", "423", "433"]
                answer: ["479", "429", "423"]
                hints: ["Hundreds first, then tens, then ones."]
              - id: l2-s2
                type: multiple_choice
                text: "Which way is quicker for 701 − 698?"
                options: ["count on from 698", "jump back 600, 90 and 8"]
                answer: "count on from 698"
                hints: ["Are the two numbers far apart or close together?"]
              - id: l2-s3
                type: text_input
                text: "735 − 362 = _"
                say: "Seven hundred and thirty-five subtract three hundred and sixty-two. Use the jumps."
                show: { drawn: rechenstrich, start: 735, jumps: [-300, -60, -2] }
                answer: "373"
                hints: ["Jump back 300, then 60, then 2."]
              - id: l2-s4
                type: text_input
                text: "Count on: 402 − 396 = _"
                answer: "6"
                hints: ["Count on from 396 to 400, then on to 402."]
              - id: l2-s5
                type: text_input
                text: "A theatre has 645 seats. 213 seats are empty. How many people are sitting down?"
                answer: "432"
                hints: ["Work out 645 − 213: take away 200, then 10, then 3."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Subtract in steps: 947 − 523"
                say: "Work out nine hundred and forty-seven subtract five hundred and twenty-three in steps."
                frame: "947 − 500 = _ → − 20 = _ → − 3 = _"
                options: ["447", "427", "424", "444"]
                answer: ["447", "427", "424"]
              - id: l2-n2
                type: text_input
                text: "823 − 357 = _"
                answer: "466"
              - id: l2-n3
                type: text_input
                text: "Count on: 803 − 789 = _"
                answer: "14"
              - id: l2-n4
                type: true_false
                text: "Is it true? 516 − 204 = 312"
                say: "Five hundred and sixteen subtract two hundred and four equals three hundred and twelve. Is it true?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "A farmer has 480 eggs. She sells 255 of them. How many eggs are left?"
                answer: "225"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "462 + 325 = _"
            answer: "787"
          - id: l2-c2
            type: fill_in_blank
            text: "Partition to add: 374 + 418"
            say: "Partition both numbers to add three hundred and seventy-four and four hundred and eighteen."
            frame: "300 + 400 = _ → 70 + 10 = _ → 4 + 8 = _ → 374 + 418 = _"
            options: ["700", "80", "12", "792", "782"]
            answer: ["700", "80", "12", "792"]
          - id: l2-c3
            type: text_input
            text: "684 − 251 = _"
            answer: "433"
          - id: l2-c4
            type: text_input
            text: "Count on: 705 − 698 = _"
            answer: "7"
          - id: l2-c5
            type: true_false
            text: "Ava works out 463 − 128 like this: 400 − 100 = 300, 60 − 20 = 40, 8 − 3 = 5. She writes 345. Is Ava right?"
            say: "Ava works out four hundred and sixty-three subtract one hundred and twenty-eight. She takes the hundreds, then the tens, then eight subtract three for the ones, and writes three hundred and forty-five. Is Ava right?"
            answer: false
