# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.squares
skill: math.mult-div.squares
curriculum: en-GB
language: en
title:
  de: Quadratzahlen
  en: Square numbers
summary: >
  Square numbers to 10 × 10. Lesson 1 sees them as square arrays (as many
  rows as there are dots in each row) and tells them apart from arrays
  that are longer than they are wide; lesson 2 learns all ten, works out a
  square from the fact next door (7 × 7 is 6 × 7 and one more 7), and ends
  with the skill check.
metadata:
  year: year-3
  topic: { de: Einmaleins, en: Times tables }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.arrays]
  also_practises: [math.mult-div.arrays, math.mult-div.core-facts]
  vocabulary: { en: [square number, square, array, row, column] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: square-as-double
      what: Adds the number to itself instead of multiplying it by itself (6 × 6 = 12, 9 × 9 = 18)
      addressed: lesson 1 Learn says "times itself, not add itself"; l1-f5 and l1-s5 offer the double, with feedback in l1-f5; l2-f4 asks whether 9 × 9 is 18; l2-c2 offers 16 for 8 × 8
    - id: any-array-is-square
      what: Calls every array a square, or every multiplication answer a square number
      addressed: lesson 1 Learn shows a 3 by 5 array that is not a square; l1-f1, l1-s1, l1-n1, l1-c1 and l2-c1 ask which array is a square, and from the some stage the wrong arrays are one row or column off; l1-f3, l1-s3 and l1-n3 ask whether a number is square, with 12 and 20 as false cases
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Quadrate im Punktefeld", en: "Squares in an array" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many dots?"
            say: "Two rows of five dots. How many dots are there?"
            show: { drawn: dots, array: [2, 5] }
            options: ["10", "7", "25"]
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which multiplication fits the array?"
            say: "Three rows of four dots. Which multiplication fits?"
            show: { drawn: dots, array: [3, 4] }
            options: ["3 × 4", "3 + 4", "4 × 4"]
            answer: "3 × 4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4 × 4 = 16"
            say: "This array has four rows of four dots. It is as wide as it is tall, so it makes a square. Four times four is sixteen, so sixteen is a square number."
            show: { drawn: dots, array: [4, 4] }
          - text: "3 × 5 = 15"
            say: "This array has three rows of five dots. It is longer than it is tall, so it is not a square. Fifteen is not a square number."
            show: { drawn: dots, array: [3, 5] }
          - text: "1 × 1 = 1, 2 × 2 = 4, 3 × 3 = 9, 4 × 4 = 16, 5 × 5 = 25"
            say: "When you multiply a number by itself, you get a square number: one, four, nine, sixteen, twenty-five. Times itself, not add itself: three times three is nine, not six."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which array is a square?"
                options:
                  - { drawn: dots, array: [2, 6] }
                  - { drawn: dots, array: [3, 3] }
                  - { drawn: dots, array: [2, 4] }
                answer: "3x3"
                hints:
                  - "A square has as many rows as there are dots in each row."
                  - "Count the rows, then count the dots in one row."
                  - "The array with three rows of three."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "How many dots are in this square?"
                show: { drawn: dots, array: [5, 5] }
                answer: "25"
                hints:
                  - "Count the rows and the dots in one row."
                  - "Five rows of five: five times five."
                  - "25."
              - id: l1-f3
                type: true_false
                text: "Is 12 a square number?"
                say: "Is twelve a square number?"
                answer: false
                hints:
                  - "Is there a number that times itself makes 12?"
                  - "3 × 3 = 9 and 4 × 4 = 16. Twelve is in between."
                  - "No. 12 is not a square number."
              - id: l1-f4
                type: fill_in_blank
                text: "Which square number is missing?"
                frame: "1, 4, 9, _, 25"
                options: ["12", "15", "16"]
                answer: ["16"]
                hints:
                  - "1 × 1, 2 × 2, 3 × 3. What comes next?"
                  - "Four times four."
                  - "16."
              - id: l1-f5
                type: multiple_choice
                text: "6 × 6 = _"
                say: "What is six times six?"
                options: ["12", "36", "32"]
                answer: "36"
                feedback:
                  "12": "That is six add six. Six times six is six lots of six."
                hints:
                  - "Five sixes are 30."
                  - "Add one more six."
                  - "36."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which array is a square?"
                options:
                  - { drawn: dots, array: [4, 5] }
                  - { drawn: dots, array: [4, 4] }
                  - { drawn: dots, array: [3, 4] }
                answer: "4x4"
                hints: ["Count the rows and the dots in one row. They must be the same."]
              - id: l1-s2
                type: text_input
                text: "How many dots are in this square?"
                show: { drawn: dots, array: [3, 3] }
                answer: "9"
                hints: ["Three rows of three."]
              - id: l1-s3
                type: true_false
                text: "Is 4 a square number?"
                say: "Is four a square number?"
                answer: true
                hints: ["Think of 2 × 2."]
              - id: l1-s4
                type: fill_in_blank
                text: "Which square number is missing?"
                frame: "4, 9, 16, _"
                options: ["20", "25", "24"]
                answer: ["25"]
                hints: ["After 4 × 4 comes 5 × 5."]
              - id: l1-s5
                type: multiple_choice
                text: "5 × 5 = _"
                say: "What is five times five?"
                options: ["10", "25", "55"]
                answer: "25"
                hints: ["Five lots of five, not five add five."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Which array is a square?"
                options:
                  - { drawn: dots, array: [5, 5] }
                  - { drawn: dots, array: [5, 4] }
                  - { drawn: dots, array: [6, 5] }
                answer: "5x5"
              - id: l1-n2
                type: text_input
                text: "How many dots are in this square?"
                show: { drawn: dots, array: [4, 4] }
                answer: "16"
              - id: l1-n3
                type: true_false
                text: "Is 20 a square number?"
                say: "Is twenty a square number?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Which square number is missing?"
                frame: "1, _, 9, 16"
                options: ["2", "4", "6"]
                answer: ["4"]
              - id: l1-n5
                type: text_input
                text: "Tiles are laid in a square, 3 rows of 3. How many tiles are there?"
                answer: "9"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which array is a square?"
            options:
              - { drawn: dots, array: [2, 3] }
              - { drawn: dots, array: [2, 2] }
              - { drawn: dots, array: [1, 2] }
            answer: "2x2"
          - id: l1-c2
            type: text_input
            text: "4 × 4 = _"
            say: "Four times four."
            answer: "16"
          - id: l1-c3
            type: true_false
            text: "Is 25 a square number?"
            say: "Is twenty-five a square number?"
            answer: true

  - n: 2
    title: { de: "Alle Quadratzahlen bis 100", en: "All the square numbers to 100" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "3 × 3 = _"
            say: "Three times three."
            answer: "9"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is 16 a square number?"
            say: "Is sixteen a square number?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "6 × 6 = 36, 7 × 7 = 49, 8 × 8 = 64, 9 × 9 = 81, 10 × 10 = 100"
            say: "Here are the bigger square numbers: thirty-six, forty-nine, sixty-four, eighty-one and one hundred."
          - text: "7 × 7 = 6 × 7 + 7 = 42 + 7 = 49"
            say: "If you forget seven times seven, start from a fact you know. Six sevens are forty-two. One more seven makes forty-nine."
            show: { drawn: dots, array: [7, 7] }
          - text: "9 × 9 = 10 × 9 − 9 = 90 − 9 = 81"
            say: "For nine times nine, start from ten nines, which is ninety. Take one nine away: ninety take away nine is eighty-one."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Use the fact next door."
                say: "Work out seven times eight from seven times seven."
                frame: "7 × 7 = 49, so 7 × 8 = 49 + _ = _"
                options: ["7", "8", "56", "57"]
                answer: ["7", "56"]
                hints:
                  - "Seven times eight is one more seven than seven times seven."
                  - "Add 7 to 49."
                  - "49 + 7 = 56."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "8 × 8 = _"
                say: "Eight times eight."
                answer: "64"
                hints:
                  - "Start from 8 × 10 = 80."
                  - "Take away two eights."
                  - "80 − 16 = 64."
              - id: l2-f3
                type: fill_in_blank
                text: "Which square number is missing?"
                frame: "36, 49, _, 81, 100"
                options: ["56", "63", "64"]
                answer: ["64"]
                hints:
                  - "After 7 × 7 comes 8 × 8."
                  - "8 × 8 is 8 × 7 and one more 8."
                  - "56 + 8 = 64."
              - id: l2-f4
                type: true_false
                text: "Is it true? 9 × 9 = 18"
                say: "Nine times nine is eighteen. Is it true?"
                answer: false
                hints:
                  - "Is 18 nine add nine or nine lots of nine?"
                  - "Ten nines are 90. Take one nine away."
                  - "9 × 9 = 81, so no."
              - id: l2-f5
                type: multiple_choice
                text: "Which of these is a square number?"
                options: ["48", "49", "50"]
                answer: "49"
                hints:
                  - "Which number is a number times itself?"
                  - "Think of 7 × 7."
                  - "49."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Use the fact next door."
                say: "Work out six times six from five times six."
                frame: "5 × 6 = 30, so 6 × 6 = 30 + _ = _"
                options: ["5", "6", "35", "36"]
                answer: ["6", "36"]
                hints: ["Six sixes are one more six than five sixes."]
              - id: l2-s2
                type: text_input
                text: "10 × 10 = _"
                say: "Ten times ten."
                answer: "100"
                hints: ["Ten tens."]
              - id: l2-s3
                type: fill_in_blank
                text: "Which square number is missing?"
                frame: "25, _, 49, 64"
                options: ["30", "35", "36"]
                answer: ["36"]
                hints: ["After 5 × 5 comes 6 × 6."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 7 × 7 = 49"
                say: "Seven times seven is forty-nine. Is it true?"
                answer: true
                hints: ["Six sevens are 42. Add one more seven."]
              - id: l2-s5
                type: multiple_choice
                text: "Which of these is a square number?"
                options: ["80", "81", "82"]
                answer: "81"
                hints: ["Think of 9 × 9."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Use the fact next door."
                say: "Work out nine times nine from eight times nine."
                frame: "8 × 9 = 72, so 9 × 9 = 72 + _ = _"
                options: ["8", "9", "80", "81"]
                answer: ["9", "81"]
              - id: l2-n2
                type: text_input
                text: "6 × 6 = _"
                say: "Six times six."
                answer: "36"
              - id: l2-n3
                type: fill_in_blank
                text: "Which square number is missing?"
                frame: "49, 64, _, 100"
                options: ["72", "81", "90"]
                answer: ["81"]
              - id: l2-n4
                type: true_false
                text: "Is it true? 8 × 8 = 16"
                say: "Eight times eight is sixteen. Is it true?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "A garden bed is planted in a square: 7 rows of 7 tulips. How many tulips are there?"
                answer: "49"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Which array is a square?"
            options:
              - { drawn: dots, array: [6, 6] }
              - { drawn: dots, array: [5, 6] }
              - { drawn: dots, array: [6, 7] }
            answer: "6x6"
          - id: l2-c2
            type: multiple_choice
            text: "8 × 8 = _"
            say: "What is eight times eight?"
            options: ["16", "56", "64"]
            answer: "64"
          - id: l2-c3
            type: text_input
            text: "9 × 9 = _"
            say: "Nine times nine."
            answer: "81"
          - id: l2-c4
            type: true_false
            text: "Is 30 a square number?"
            say: "Is thirty a square number?"
            answer: false
          - id: l2-c5
            type: fill_in_blank
            text: "Which square number is missing?"
            frame: "16, 25, _, 49"
            options: ["30", "36", "40"]
            answer: ["36"]
