# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.draw-freehand-ruler
skill: math.shapes.draw-freehand-ruler
curriculum: en-GB
language: en
title:
  de: Mit dem Lineal und frei Hand zeichnen
  en: Drawing with a ruler and freehand
summary: >
  Lesson 1 chooses the tool (freehand for a wavy line or a tree, a ruler
  for straight lines, a stencil for a circle), says how to hold the ruler
  and start a line at 0, and counts how many squares long a line on
  squared paper is; lesson 2 picks the right drawing of a square or
  rectangle of a given size, finds what is wrong with a drawing (a corner
  left open, a slanted side, sides not equal), continues line patterns
  and ends with the skill check. The child cannot draw in the app yet, so
  every task asks which drawing, which tool or what is wrong; drawing on
  the grid with a finger waits for a drawing task.
metadata:
  year: year-3
  topic: { de: Formen, en: Shapes }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.properties]
  also_practises: [math.length.cm-m]
  vocabulary: { en: [ruler, freehand, stencil, squared paper, square, line, straight, wavy, pattern, rectangle, corner, side] }
  forms: [picture, text, audio, drawn]
  drawn: [shape, grid, ruler]
  facets: []
  parts:
    - { id: tools, what: { de: das passende Werkzeug wählen und das Lineal richtig anlegen, en: choosing the tool and using a ruler from 0 } }
    - { id: line-length, what: { de: die Länge einer Linie auf Kästchenpapier oder am Lineal ablesen, en: how long a line is on squared paper or along a ruler } }
    - { id: shapes, what: { de: Quadrate und Rechtecke in der richtigen Größe und Fehler in einer Zeichnung, en: squares and rectangles of a given size and what is wrong with a drawing } }
    - { id: patterns, what: { de: Muster auf Kästchenpapier fortsetzen, en: carrying on a pattern on squared paper } }
  misconceptions:
    - id: counts-points
      what: Counts the grid lines or points along a line instead of the squares between its ends, so a line 3 squares long is called 4
      addressed: lesson 1 Learn counts the squares from one end to the other; l1-f2 has feedback on the extra one; l1-s1, l1-n2 and l2-c1 offer one too many
    - id: ruler-not-from-zero
      what: Starts a line at the end of the ruler or at 1 instead of at 0, so the line comes out the wrong length
      addressed: lesson 1 Learn starts the line at 0; l1-f3 has feedback on reading from 1; l1-s3 and l1-c3 show a line that does not start at 0
    - id: figure-not-closed
      what: Takes a drawing as finished when a corner is open, a side is slanted or the sides of a square are not equal
      addressed: lesson 2 Learn says the corners must meet and every line runs along the grid lines; l2-f2 and l2-s2 have feedback; l2-s4, l2-n2 and l2-c4 ask what is wrong
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Lineal oder frei Hand?", en: "Ruler or freehand?" }
    goal:
      de: "Wähle für jede Zeichnung Lineal, Schablone oder freie Hand, und zähl, wie viele Kästchen lang eine Linie ist."
      en: "Choose a ruler, a stencil or freehand for each drawing, and count how many squares long a line is."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many corners has a rectangle got?"
            show: { drawn: shape, kind: rectangle, colour: green }
            options: ["4", "3", "2"]
            answer: "4"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Which shape has four sides that are all the same length?"
            options:
              - { drawn: shape, kind: rectangle, colour: blue }
              - { drawn: shape, kind: square, colour: blue }
              - { drawn: shape, kind: triangle, colour: blue }
            answer: square
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Freehand or with a ruler?"
            say: "Some things you draw freehand, with no tools: a wavy line, a tree or a flower. Straight lines you draw with a ruler."
            show: { object: ruler }
          - text: "Hold the ruler still. Start at 0."
            say: "Lay the ruler flat and hold it firmly, with your fingers in the middle, away from the edge. Put your pencil on zero, not on the end of the ruler, and draw along the edge. This line is six centimetres long."
            show: { drawn: ruler, to: 10, length: 6 }
          - text: "This line is 4 squares long."
            say: "On squared paper you draw along the grid lines. How long is this line? Count the squares from one end to the other: one, two, three, four. It is four squares long."
            show: { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 5, 1]] }
          - text: "Circles with a stencil"
            say: "To draw a circle, use a stencil. Run your pencil round the inside edge of the hole, and the circle comes out nice and round."
            show: { drawn: shape, kind: circle, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What do you draw with a ruler?"
                options: ["a straight line", "a wavy line", "a flower"]
                answer: "a straight line"
                hints:
                  - "A ruler has a straight edge."
                  - "If you draw along the edge, the line comes out straight."
                  - "A straight line."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many squares long is the line?"
                show: { drawn: grid, cols: 5, rows: 2, lines: [[1, 1, 4, 1]] }
                options: ["3", "4", "2"]
                answer: "3"
                feedback:
                  "4": "You counted the grid lines. Count the squares between the start and the end."
                hints:
                  - "Count the squares the line runs along."
                  - "Start at the left end: one, two ..."
                  - "3 squares."
              - id: l1-f3
                type: multiple_choice
                text: "Jay drew this line along his ruler. How long is it?"
                show: { drawn: ruler, to: 10, length: 5, start: 1 }
                options: ["5 cm", "6 cm", "4 cm"]
                answer: "5 cm"
                feedback:
                  "6 cm": "The line starts at 1, not at 0. Count the centimetres from 1 to 6."
                hints:
                  - "Where does the line start, and where does it end?"
                  - "It starts at 1 and ends at 6."
                  - "From 1 to 6 is 5 cm."
              - id: l1-f4
                type: true_false
                text: "Is it true? You draw a flower freehand."
                answer: true
                hints:
                  - "Has a flower got straight lines?"
                  - "The petals are round and curved."
                  - "Yes, freehand."
              - id: l1-f5
                type: multiple_choice
                text: "What do you use to draw a neat round circle?"
                options: ["a stencil", "a ruler", "scissors"]
                answer: "a stencil"
                hints:
                  - "A circle has no straight lines."
                  - "You run your pencil round the inside of a round hole."
                  - "A stencil."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many squares long is the line?"
                show: { drawn: grid, cols: 4, rows: 5, lines: [[2, 0, 2, 5]] }
                options: ["5", "6", "4"]
                answer: "5"
                hints: ["Count the squares from top to bottom, not the lines."]
              - id: l1-s2
                type: sorting
                text: "With a ruler or freehand?"
                bins:
                  - { id: ruler, show: { text: "with a ruler" }, say: "with a ruler" }
                  - { id: free, show: { text: "freehand" }, say: "freehand" }
                options:
                  - { text: "the sides of a square", bin: ruler }
                  - { text: "a wavy line", bin: free }
                  - { text: "a tree", bin: free }
                  - { text: "a long straight line", bin: ruler }
                option_audio: false
                hints: ["Straight lines with a ruler, curvy ones freehand."]
              - id: l1-s3
                type: multiple_choice
                text: "Ava wants a line 7 cm long. She drew this. Is her line right?"
                show: { drawn: ruler, to: 10, length: 7, start: 2 }
                options: ["Yes, it is 7 cm long.", "No, it ends at 9, so it is 9 cm.", "No, a line must start at the end of the ruler."]
                answer: "Yes, it is 7 cm long."
                hints: ["Count from where the line starts to where it ends."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Which line is 4 squares long?"
                options:
                  - { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 3, 1]], key: "2" }
                  - { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 5, 1]], key: "4" }
                  - { drawn: grid, cols: 6, rows: 2, lines: [[0, 1, 5, 1]], key: "5" }
                answer: "4"
                hints: ["Count the squares along each line from end to end."]
              - id: l1-s5
                type: multiple_choice
                text: "Tom draws with a ruler, but his line comes out wobbly. What happened?"
                options: ["The ruler slipped.", "The paper has squares on it.", "The pencil is yellow."]
                answer: "The ruler slipped."
                hints: ["A line along a ruler is straight if the ruler stays still."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What do you draw freehand?"
                options: ["a wavy line", "the sides of a rectangle", "a straight line 6 squares long"]
                answer: "a wavy line"
              - id: l1-n2
                type: multiple_choice
                text: "How many squares long is the line?"
                show: { drawn: grid, cols: 8, rows: 2, lines: [[0, 1, 7, 1]] }
                options: ["7", "8", "6"]
                answer: "7"
              - id: l1-n3
                type: true_false
                text: "Is it true? You can draw a circle with a stencil."
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Which line is 3 squares long?"
                options:
                  - { drawn: grid, cols: 3, rows: 5, lines: [[1, 1, 1, 5]], key: "4" }
                  - { drawn: grid, cols: 3, rows: 5, lines: [[1, 1, 1, 4]], key: "3" }
                  - { drawn: grid, cols: 3, rows: 5, lines: [[1, 2, 1, 4]], key: "2" }
                answer: "3"
              - id: l1-n5
                type: multiple_choice
                text: "How long is the line?"
                show: { drawn: ruler, to: 12, length: 9 }
                options: ["9 cm", "10 cm", "12 cm"]
                answer: "9 cm"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many squares long is the line?"
            show: { drawn: grid, cols: 8, rows: 2, lines: [[1, 1, 7, 1]] }
            options: ["6", "7", "5"]
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "What makes a long line come out straight?"
            options: ["a ruler", "drawing freehand", "a stencil"]
            answer: "a ruler"
          - id: l1-c3
            type: multiple_choice
            text: "How long is the line?"
            show: { drawn: ruler, to: 10, length: 4, start: 3 }
            options: ["4 cm", "7 cm", "3 cm"]
            answer: "4 cm"
          - id: l1-c4
            type: true_false
            text: "Is it true? You draw a wavy line with a ruler."
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Which line is 2 squares long?"
            options:
              - { drawn: grid, cols: 3, rows: 4, lines: [[1, 0, 1, 2]], key: "2" }
              - { drawn: grid, cols: 3, rows: 4, lines: [[1, 0, 1, 3]], key: "3" }
              - { drawn: grid, cols: 3, rows: 4, lines: [[1, 0, 1, 4]], key: "4" }
            answer: "2"
          - id: l1-c6
            type: multiple_choice
            text: "How long is the line?"
            show: { drawn: ruler, to: 10, length: 3 }
            options: ["3 cm", "4 cm", "10 cm"]
            answer: "3 cm"

  - n: 2
    title: { de: "Figuren und Muster auf Karopapier", en: "Shapes and patterns on squared paper" }
    goal:
      de: "Finde das richtige Quadrat oder Rechteck auf Karopapier, entdecke Fehler in einer Zeichnung und setz Muster fort."
      en: "Find the right square or rectangle on squared paper, spot what is wrong with a drawing, and carry on patterns."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many squares long is the line?"
            show: { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 3, 1]] }
            options: ["2", "3", "1"]
            answer: "2"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What do you draw freehand?"
            options: ["a snake", "a rectangle", "a straight line"]
            answer: "a snake"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A square: each side 3 squares long"
            say: "This square has four sides, each three squares long. Every line runs along the grid lines, and at every corner the lines meet."
            show: { drawn: grid, cols: 5, rows: 4, lines: [[1, 0, 4, 0], [4, 0, 4, 3], [4, 3, 1, 3], [1, 3, 1, 0]] }
          - text: "A rectangle: 4 squares long, 2 squares high"
            say: "This rectangle is four squares long and two squares high. Opposite sides are the same length. Check the corners: no gaps."
            show: { drawn: grid, cols: 6, rows: 3, lines: [[1, 0, 5, 0], [5, 0, 5, 2], [5, 2, 1, 2], [1, 2, 1, 0]] }
          - text: "A pattern: up, down, up, down"
            say: "You can draw patterns too. This line goes diagonally up one square, then diagonally down one square, again and again. Say the pattern before you carry it on."
            show: { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0], [3, 0, 4, 1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which square has sides 2 squares long?"
                options:
                  - { drawn: grid, cols: 5, rows: 4, lines: [[1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 1, 3], [1, 3, 1, 1]], key: "2x2" }
                  - { drawn: grid, cols: 5, rows: 4, lines: [[1, 0, 4, 0], [4, 0, 4, 3], [4, 3, 1, 3], [1, 3, 1, 0]], key: "3x3" }
                  - { drawn: grid, cols: 5, rows: 4, lines: [[1, 1, 4, 1], [4, 1, 4, 3], [4, 3, 1, 3], [1, 3, 1, 1]], key: "3x2" }
                answer: "2x2"
                feedback:
                  "3x2": "This one is 3 squares long and only 2 high. That is a rectangle."
                hints:
                  - "For each shape, count the squares along the top and down the side."
                  - "Both must be 2 squares."
                  - "It is the smallest shape."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is wrong with this drawing?"
                show: { drawn: grid, cols: 6, rows: 4, lines: [[1, 1, 5, 1], [5, 1, 5, 3], [5, 3, 1, 3], [1, 3, 1, 2]] }
                options: ["One line is too short, so a corner is open.", "The lines are not straight.", "Nothing is wrong."]
                answer: "One line is too short, so a corner is open."
                feedback:
                  "Nothing is wrong.": "Look at the top left corner. Do the lines meet there?"
                hints:
                  - "Trace round the shape with your finger."
                  - "There is a gap at the top left."
                  - "The left side is too short, so the corner is open."
              - id: l2-f3
                type: multiple_choice
                text: "How does the pattern carry on?"
                show: { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0]] }
                options: ["diagonally down", "diagonally up", "straight along"]
                answer: "diagonally down"
                hints:
                  - "Look at how the lines take turns."
                  - "Up, down, up. What comes next?"
                  - "Diagonally down."
              - id: l2-f4
                type: true_false
                text: "Is it true? This rectangle is 4 squares long and 2 squares high."
                show: { drawn: grid, cols: 6, rows: 3, lines: [[1, 0, 5, 0], [5, 0, 5, 2], [5, 2, 1, 2], [1, 2, 1, 0]] }
                answer: true
                hints:
                  - "Count along the top first, then down the side."
                  - "4 squares along the top, 2 down the side."
                  - "Yes, it is true."
              - id: l2-f5
                type: multiple_choice
                text: "How many squares long is one side of this square?"
                show: { drawn: grid, cols: 6, rows: 4, lines: [[1, 0, 5, 0], [5, 0, 5, 4], [5, 4, 1, 4], [1, 4, 1, 0]] }
                options: ["4", "16", "5"]
                answer: "4"
                feedback:
                  "16": "16 is all the squares inside. The question asks about one side."
                hints:
                  - "Take one side, for example the top."
                  - "Count the squares along the top."
                  - "4 squares."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Which rectangle is 3 squares long and 1 square high?"
                options:
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 1, 5, 1], [5, 1, 5, 2], [5, 2, 1, 2], [1, 2, 1, 1]], key: "4x1" }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 1, 4, 1], [4, 1, 4, 2], [4, 2, 1, 2], [1, 2, 1, 1]], key: "3x1" }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 0, 4, 0], [4, 0, 4, 2], [4, 2, 1, 2], [1, 2, 1, 0]], key: "3x2" }
                answer: "3x1"
                hints: ["Count along the top and down the side of each rectangle."]
              - id: l2-s2
                type: multiple_choice
                text: "Olly wanted to draw a square. What is wrong?"
                show: { drawn: grid, cols: 5, rows: 3, lines: [[1, 0, 4, 0], [4, 0, 4, 2], [4, 2, 1, 2], [1, 2, 1, 0]] }
                options: ["The sides are not all the same length.", "A corner is open.", "Nothing is wrong."]
                answer: "The sides are not all the same length."
                feedback:
                  "Nothing is wrong.": "It is 3 squares along the top but only 2 down the side. A square has four equal sides."
                hints: ["A square has four equal sides. Count along the top and down the side."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which drawing carries the pattern on correctly?"
                show: { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0]] }
                options:
                  - { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0], [3, 0, 4, 1], [4, 1, 6, 1]], key: flat }
                  - { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0], [3, 0, 4, 1], [4, 1, 5, 0], [5, 0, 6, 1]], key: correct }
                  - { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0], [3, 0, 5, 0], [5, 0, 6, 1]], key: top }
                answer: correct
                hints: ["Up, down, up, down: check each drawing right to the end."]
              - id: l2-s4
                type: true_false
                text: "Is it true? This is a square."
                show: { drawn: grid, cols: 6, rows: 4, lines: [[1, 0, 5, 0], [5, 0, 5, 3], [5, 3, 1, 3], [1, 3, 1, 0]] }
                answer: false
                hints: ["Count along the top and down the side. Are they the same?"]
              - id: l2-s5
                type: multiple_choice
                text: "The blue squares make a pattern. Where is the next square to colour?"
                show: { drawn: grid, cols: 5, rows: 4, cells: [[0, 3, blue], [1, 2, blue], [2, 1, blue]] }
                options: ["one right and one up", "one right", "one up"]
                answer: "one right and one up"
                hints: ["Look at how you get from the first blue square to the second."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Poppy draws a rectangle 5 squares long and 2 squares high. Which one is hers?"
                options:
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 1, 5, 1], [5, 1, 5, 3], [5, 3, 1, 3], [1, 3, 1, 1]], key: "4x2" }
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 0, 6, 0], [6, 0, 6, 3], [6, 3, 1, 3], [1, 3, 1, 0]], key: "5x3" }
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 1, 6, 1], [6, 1, 6, 3], [6, 3, 1, 3], [1, 3, 1, 1]], key: "5x2" }
                answer: "5x2"
              - id: l2-n2
                type: multiple_choice
                text: "Jack wanted to draw a square. What is wrong?"
                show: { drawn: grid, cols: 5, rows: 4, lines: [[1, 0, 4, 1], [4, 1, 4, 3], [4, 3, 1, 3], [1, 3, 1, 0]] }
                options: ["One line is slanted.", "A corner is open.", "Nothing is wrong."]
                answer: "One line is slanted."
              - id: l2-n3
                type: true_false
                text: "Is it true? Finn's rectangle is 6 squares long and 1 square high."
                show: { drawn: grid, cols: 8, rows: 3, lines: [[1, 1, 7, 1], [7, 1, 7, 2], [7, 2, 1, 2], [1, 2, 1, 1]] }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Isla is drawing a pattern. How does her line carry on?"
                show: { drawn: grid, cols: 7, rows: 1, lines: [[0, 0, 1, 1], [1, 1, 2, 0], [2, 0, 3, 1], [3, 1, 4, 0], [4, 0, 5, 1]] }
                options: ["diagonally up", "diagonally down", "straight along"]
                answer: "diagonally up"
              - id: l2-n5
                type: multiple_choice
                text: "Max is drawing a rectangle on squared paper. What does he use for the sides?"
                options: ["a ruler", "a stencil", "nothing, he draws freehand"]
                answer: "a ruler"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: line-length
            type: multiple_choice
            text: "How many squares long is the line?"
            show: { drawn: grid, cols: 3, rows: 4, lines: [[1, 0, 1, 4]] }
            options: ["4", "5", "3"]
            answer: "4"
          - id: l2-c2
            part: tools
            type: multiple_choice
            text: "Which is better drawn freehand?"
            options: ["a tree", "the sides of a square", "a straight line 8 squares long"]
            answer: "a tree"
          - id: l2-c3
            part: shapes
            type: image_multiple_choice
            text: "Which square has sides 3 squares long?"
            options:
              - { drawn: grid, cols: 6, rows: 5, lines: [[1, 1, 4, 1], [4, 1, 4, 3], [4, 3, 1, 3], [1, 3, 1, 1]], key: "3x2" }
              - { drawn: grid, cols: 6, rows: 5, lines: [[1, 0, 5, 0], [5, 0, 5, 4], [5, 4, 1, 4], [1, 4, 1, 0]], key: "4x4" }
              - { drawn: grid, cols: 6, rows: 5, lines: [[1, 1, 4, 1], [4, 1, 4, 4], [4, 4, 1, 4], [1, 4, 1, 1]], key: "3x3" }
            answer: "3x3"
          - id: l2-c4
            part: shapes
            type: multiple_choice
            text: "Emma wanted to draw a rectangle. What is wrong?"
            show: { drawn: grid, cols: 6, rows: 3, lines: [[1, 0, 5, 0], [5, 0, 5, 1], [5, 2, 1, 2], [1, 2, 1, 0]] }
            options: ["A corner is open.", "One line is slanted.", "Nothing is wrong."]
            answer: "A corner is open."
          - id: l2-c5
            part: patterns
            type: image_multiple_choice
            text: "Which drawing carries the staircase on correctly?"
