# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.multi-step
skill: math.word-problems.multi-step
curriculum: en-GB
language: en
title:
  de: Sachaufgaben mit mehreren Schritten
  en: Multi-step word problems
summary: >
  Lesson 1 solves problems with two adding or subtracting steps and says
  what each step means (first 24 people get on, then 16 get off); lesson 2
  mixes a multiplication or division step with an adding or subtracting
  step (3 boxes of 8 pens, 5 are broken), and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.word-problems.sketches, math.mult-div.div-inverse]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit, math.mult-div.table-2-4-8]
  vocabulary: { en: [step, first, then, answer, multi-step, each] }
  forms: [text, audio]
  drawn: []
  facets: [currency]
  misconceptions:
    - id: stops-after-step-one
      what: Gives the answer to the first step as the answer to the problem
      addressed: lesson 1 Learn names the first result and goes on to step 2; l1-f2, l1-s2, l2-f2 and l2-s2 offer the first-step result, with feedback in l1-f2 and l2-f2
    - id: step-not-linked
      what: Works out the steps but cannot say what each number means in the story
      addressed: l1-f3, l1-s3, l1-n3, l2-f3, l2-s3, l2-n3 and l2-c3 ask what a step's result means in the story; lesson 2 Learn says what each step finds
    - id: wrong-first-step
      what: Starts with the wrong calculation, such as subtracting before finding the total of equal groups
      addressed: l1-f1, l1-s1, l1-n1, l2-f1, l2-s1 and l2-n1 ask which step comes first, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zwei Schritte mit Plus und Minus", en: "Two steps with adding and subtracting" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Each bag has 4 apples. How many apples are in 5 bags?"
            answer: "20"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "18 pencils are shared equally between 3 pots. Which calculation finds how many go in each pot?"
            options: ["18 ÷ 3", "18 − 3", "18 × 3"]
            answer: "18 ÷ 3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "There are 35 people on the bus. At the stop 24 get on, then 16 get off. How many people are on the bus now?"
            say: "There are thirty-five people on the bus. At the stop twenty-four get on, then sixteen get off. How many people are on the bus now? Two things happen, so there are two steps."
          - text: "Step 1: 35 + 24 = 59 (people after some get on)"
            say: "Step one: twenty-four get on. Thirty-five add twenty-four is fifty-nine. Fifty-nine is how many people are on the bus after they get on. That is not the answer yet."
          - text: "Step 2: 59 − 16 = 43\nAnswer: There are 43 people on the bus now."
            say: "Step two: sixteen get off. Fifty-nine take away sixteen is forty-three. Now you can answer: there are forty-three people on the bus."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Leah has 46 stickers. She is given 20 and sticks 15 in her book. What do you work out first?"
                options: ["46 + 20", "46 − 15", "20 − 15"]
                answer: "46 + 20"
                hints:
                  - "Follow the story in order."
                  - "First she is given 20 stickers."
                  - "46 + 20."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Leah has 46 stickers. She is given 20 and sticks 15 in her book. How many stickers has she got left?"
                options: ["66", "51", "81"]
                answer: "51"
                feedback:
                  "66": "66 is how many she has after she is given 20. She still sticks 15 in her book."
                hints:
                  - "There are two steps."
                  - "46 + 20 = 66. Then take away the 15 she sticks in."
                  - "66 − 15 = 51."
              - id: l1-f3
                type: multiple_choice
                text: "There are 80 children at the pool. 35 go home, then 12 more arrive. Step 1: 80 − 35 = 45. What does the 45 mean?"
                options: ["the children left after 35 go home", "the children who arrive", "the children at the pool at the end"]
                answer: "the children left after 35 go home"
                hints:
                  - "What has happened in the story after step 1?"
                  - "Only the 35 have gone home. The 12 have not arrived yet."
                  - "The children left after 35 go home."
              - id: l1-f4
                type: text_input
                text: "There are 80 children at the pool. 35 go home, then 12 more arrive. How many children are at the pool now?"
                answer: "57"
                hints:
                  - "Step 1: 80 − 35."
                  - "80 − 35 = 45. Then 12 more arrive."
                  - "45 + 12 = 57."
              - id: l1-f5
                type: true_false
                text: "Ben has 90p. He buys a lolly for 40p and a chew for 25p. Ben says he has 25p left. Is he right?"
                answer: true
                hints:
                  - "Take away each thing he buys."
                  - "90p − 40p = 50p. Then take away 25p."
                  - "50p − 25p = 25p. Yes, he is right."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "There are 57 birds in a tree. 18 more land, then 30 fly away. What do you work out first?"
                options: ["57 + 18", "57 − 30", "30 − 18"]
                answer: "57 + 18"
                hints: ["What happens first in the story?"]
              - id: l1-s2
                type: multiple_choice
                text: "There are 57 birds in a tree. 18 more land, then 30 fly away. How many birds are in the tree now?"
                options: ["75", "45", "105"]
                answer: "45"
                hints: ["57 + 18 = 75. Then 30 fly away."]
              - id: l1-s3
                type: multiple_choice
                text: "Tim has £100. He buys trainers for £45 and socks for £8. Step 1: £100 − £45 = £55. What does the £55 mean?"
                options: ["the money he has after buying the trainers", "the cost of the socks", "the money he has at the end"]
                answer: "the money he has after buying the trainers"
                hints: ["He has not bought the socks yet."]
              - id: l1-s4
                type: text_input
                text: "Tim has £100. He buys trainers for £45 and socks for £8. How much money has he got left, in pounds?"
                answer: "47"
                hints: ["£55 − £8."]
              - id: l1-s5
                type: true_false
                text: "There are 64 books on the shelf. Mia puts back 16 and takes out 30. Mia says there are now 50 books on the shelf. Is she right?"
                answer: true
                hints: ["64 + 16 = 80. Then take away 30."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "There are 125 people on the train. 40 get off, then 26 get on. What do you work out first?"
                options: ["125 − 40", "125 + 26", "40 − 26"]
                answer: "125 − 40"
              - id: l1-n2
                type: text_input
                text: "There are 125 people on the train. 40 get off, then 26 get on. How many people are on the train now?"
                answer: "111"
              - id: l1-n3
                type: multiple_choice
                text: "Gran bakes 48 biscuits. The children eat 15, then she bakes 24 more. Step 1: 48 − 15 = 33. What does the 33 mean?"
                options: ["the biscuits left after the children eat", "the biscuits Gran bakes next", "the biscuits there are at the end"]
                answer: "the biscuits left after the children eat"
              - id: l1-n4
                type: text_input
                text: "Gran bakes 48 biscuits. The children eat 15, then she bakes 24 more. How many biscuits are there now?"
                answer: "57"
              - id: l1-n5
                type: true_false
                text: "Isla has 75p. She buys a bread roll for 45p and Gran gives her 50p. Isla says she now has 70p. Is she right?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "There are 66 children in the hall. 28 go out to play, then 14 come back in. How many children are in the hall now?"
            answer: "52"
          - id: l1-c2
            type: text_input
            text: "Paul has £70. He buys a game for £35 and a book for £12. How much money has he got left, in pounds?"
            answer: "23"
          - id: l1-c3
            type: true_false
            text: "A basket holds 40 apples. Mum adds 25, then the family eats 5. Is it true that there are 60 apples in the basket now?"
            answer: true

  - n: 2
    title: { de: "Mal oder geteilt in einem Schritt", en: "A times or divide step" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "There are 50 people on the bus. 18 get on, then 23 get off. How many are on the bus now?"
            answer: "45"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "4 × 8 = _"
            say: "Four times eight."
            answer: "32"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mia buys 3 boxes of 8 pens. 5 pens are broken. How many pens work?"
            say: "Mia buys three boxes with eight pens in each box. Five pens are broken. How many pens work?"
          - text: "Step 1: 3 × 8 = 24 (all the pens)"
            say: "Step one finds all the pens: three boxes of eight. Three times eight is twenty-four. Twenty-four is all the pens, broken or not."
          - text: "Step 2: 24 − 5 = 19\nAnswer: 19 pens work."
            say: "Step two takes away the broken ones. Twenty-four take away five is nineteen. Nineteen pens work. Each step answers a small question in the story."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Tom has 4 bags of 5 marbles. He gives Leah 6 marbles. What do you work out first?"
                options: ["4 × 5", "5 − 6", "4 + 5"]
                answer: "4 × 5"
                feedback:
                  "5 − 6": "First find all Tom's marbles. You cannot take 6 from one bag of 5."
                hints:
                  - "First find out how many marbles Tom has altogether."
                  - "4 bags with 5 in each bag."
                  - "4 × 5."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tom has 4 bags of 5 marbles. He gives Leah 6 marbles. How many marbles has he got left?"
                options: ["20", "14", "26"]
                answer: "14"
                feedback:
                  "20": "20 is all his marbles before he gives any away. He still gives Leah 6."
                hints:
                  - "Step 1: 4 × 5 = 20."
                  - "Then he gives 6 away."
                  - "20 − 6 = 14."
              - id: l2-f3
                type: multiple_choice
                text: "24 biscuits are shared equally between 4 children. Each child eats 2. Step 1: 24 ÷ 4 = 6. What does the 6 mean?"
                options: ["the biscuits each child gets", "the biscuits each child eats", "the biscuits left altogether"]
                answer: "the biscuits each child gets"
                hints:
                  - "What does dividing by 4 find in the story?"
                  - "Sharing between 4 children gives each child the same number."
                  - "The biscuits each child gets."
              - id: l2-f4
                type: text_input
                text: "24 biscuits are shared equally between 4 children. Each child eats 2. How many biscuits has each child got left?"
                answer: "4"
                hints:
                  - "Step 1: 24 ÷ 4 = 6 each."
                  - "Each child then eats 2."
                  - "6 − 2 = 4."
              - id: l2-f5
                type: true_false
                text: "A notebook costs £3. Ben buys 5 notebooks and pays with a £20 note. Ben says he gets £5 change. Is he right?"
                answer: true
                hints:
                  - "First find the cost of 5 notebooks."
                  - "5 × £3 = £15. Then take that from £20."
                  - "£20 − £15 = £5. Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A cinema has 8 rows of 10 seats. 13 seats are empty. How many seats are taken? What do you work out first?"
                options: ["8 × 10", "10 − 13", "80 − 8"]
                answer: "8 × 10"
                hints: ["First find all the seats."]
              - id: l2-s2
                type: multiple_choice
                text: "A cinema has 8 rows of 10 seats. 13 seats are empty. How many seats are taken?"
                options: ["80", "67", "93"]
                answer: "67"
                hints: ["8 × 10 = 80. Then take away the empty seats."]
              - id: l2-s3
                type: multiple_choice
                text: "Gran shares 24 sweets equally between 3 grandchildren. Then each gets 2 more. Step 1: 24 ÷ 3 = 8. What does the 8 mean?"
                options: ["the sweets each grandchild gets at first", "the sweets each one has at the end", "the sweets Gran keeps"]
                answer: "the sweets each grandchild gets at first"
                hints: ["The 2 more have not been given yet."]
              - id: l2-s4
                type: text_input
                text: "Gran shares 24 sweets equally between 3 grandchildren. Then each gets 2 more. How many sweets has each grandchild got?"
                answer: "10"
                hints: ["8 + 2."]
              - id: l2-s5
                type: true_false
                text: "An ice cream costs £2. Lily has £10 and buys 3 ice creams. Lily says she has £6 left. Is she right?"
                answer: false
                hints: ["3 ice creams cost 3 × £2."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "5 children each have 8 stickers. Together they buy 12 more. How many stickers have they got now? What do you work out first?"
                options: ["5 × 8", "8 + 12", "5 + 12"]
                answer: "5 × 8"
              - id: l2-n2
                type: text_input
                text: "5 children each have 8 stickers. Together they buy 12 more. How many stickers have they got now?"
                answer: "52"
              - id: l2-n3
                type: multiple_choice
                text: "32 apples are put equally into 4 baskets. 3 apples are eaten from each basket. Step 1: 32 ÷ 4 = 8. What does the 8 mean?"
                options: ["the apples in each basket at first", "the apples eaten", "the apples left in each basket"]
                answer: "the apples in each basket at first"
              - id: l2-n4
                type: text_input
                text: "32 apples are put equally into 4 baskets. 3 apples are eaten from each basket. How many apples are left in each basket?"
                answer: "5"
              - id: l2-n5
                type: true_false
                text: "A cinema ticket costs £4. 6 friends buy a ticket each and pay with £30 altogether. They say they get £6 change. Is that right?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "There are 72 people on the bus. 25 get off, then 18 get on. How many people are on the bus now?"
            answer: "65"
          - id: l2-c2
            type: text_input
            text: "Mo has 3 boxes of 8 crayons. 7 crayons are lost. How many crayons has he got now?"
            answer: "17"
          - id: l2-c3
            type: multiple_choice
            text: "40 marbles are shared equally between 5 children. Then each child loses 3. Step 1: 40 ÷ 5 = 8. What does the 8 mean?"
            options: ["the marbles each child gets", "the marbles each child loses", "the marbles each child has at the end"]
            answer: "the marbles each child gets"
          - id: l2-c4
            type: text_input
            text: "Amir has £50. He buys 2 T-shirts at £12 each. How much money has he got left, in pounds?"
            answer: "26"
          - id: l2-c5
            type: true_false
            text: "There are 4 plates with 6 cakes on each. The children eat 9. Is it true that 14 cakes are left?"
            answer: false
