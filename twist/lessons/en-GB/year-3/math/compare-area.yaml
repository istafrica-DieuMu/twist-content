# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.compare-area
skill: math.area-volume.compare-area
curriculum: en-GB
language: en
title:
  de: Flächen vergleichen
  en: Comparing areas
summary: >
  Lesson 1 measures a shape by the squares that cover it and compares two
  shapes by counting, so the longer one is not always the bigger one (a
  row of 7 squares is smaller than 2 rows of 4); lesson 2 sees that
  different shapes can have the same area, compares only with squares or
  tiles of the same size, puts shapes in order of area and ends with the
  skill check. Covering a shape by dragging tiles onto it waits for a
  drag task.
metadata:
  year: year-3
  topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.basic-shapes, math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { en: [area, square, cover, tile, bigger, smaller, the same area, squared paper] }
  forms: [text, audio, drawn]
  drawn: [shape, dots, grid]
  facets: []
  misconceptions:
    - id: longer-is-bigger
      what: Thinks the longer or taller shape is the bigger one without counting the squares
      addressed: lesson 1 Learn compares a row of 6 with 2 rows of 3; l1-f2 has feedback on the long row; l1-s2, l1-n2, l1-c2 and l2-c2 make the longer shape the smaller one, and l1-f3, l1-n3 the same
    - id: unequal-units
      what: Compares two areas by the number of tiles when the tiles are different sizes
      addressed: lesson 2 Learn covers the same tray with 4 big tiles and 16 small ones; l2-f2 has feedback; l2-s2, l2-n2 and l2-c4 compare with tiles of different sizes
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Kästchen zählen und vergleichen", en: "Counting and comparing squares" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Which shape is a rectangle?"
            options:
              - { drawn: shape, kind: rectangle, colour: green }
              - { drawn: shape, kind: triangle, colour: green }
              - { drawn: shape, kind: circle, colour: green }
            answer: rectangle
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many dots are there?"
            show: { drawn: dots, count: 9, layout: five-structure }
            options: ["8", "9", "10"]
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "This shape covers 6 squares."
            say: "The area of a shape is how much flat space it covers. On squared paper you count the squares. This blue shape covers six squares, so its area is six squares."
            show: { drawn: grid, cols: 5, rows: 3, cells: [[1, 0, blue], [2, 0, blue], [3, 0, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue]] }
          - text: "Blue: 6 squares. Red: 8 squares."
            say: "To compare two shapes, count the squares of each. The blue shape covers six squares and the red shape covers eight. The red shape has the bigger area."
            show: { drawn: grid, cols: 10, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [5, 0, red], [6, 0, red], [7, 0, red], [8, 0, red], [5, 1, red], [6, 1, red], [7, 1, red], [8, 1, red]] }
          - text: "Blue: 6 squares. Red: 6 squares."
            say: "The blue shape is a long row. It looks bigger, but count: six squares. The red shape is two rows of three: also six squares. Longer does not always mean bigger. Count to be sure."
            show: { drawn: grid, cols: 7, rows: 4, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [5, 0, blue], [0, 2, red], [1, 2, red], [2, 2, red], [0, 3, red], [1, 3, red], [2, 3, red]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many squares does the shape cover?"
                show: { drawn: grid, cols: 6, rows: 3, cells: [[1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue]] }
                options: ["8", "6", "4"]
                answer: "8"
                hints:
                  - "Count every blue square once."
                  - "There are 2 rows. How many squares are in each row?"
                  - "4 + 4 = 8 squares."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which shape has the bigger area?"
                show: { drawn: grid, cols: 8, rows: 4, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [5, 0, blue], [6, 0, blue], [0, 2, red], [1, 2, red], [2, 2, red], [3, 2, red], [0, 3, red], [1, 3, red], [2, 3, red], [3, 3, red]] }
                options: ["the blue shape", "the red shape", "They are the same."]
                answer: "the red shape"
                feedback:
                  "the blue shape": "The blue shape is longer, but count the squares: blue 7, red 8."
                hints:
                  - "Do not just look. Count the squares of each shape."
                  - "Blue is one row of 7. Red is two rows of 4."
                  - "Red covers 8 squares, more than 7."
              - id: l1-f3
                type: true_false
                text: "Is it true? The blue shape and the red shape have the same area."
                show: { drawn: grid, cols: 7, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [4, 0, red], [5, 0, red], [4, 1, red], [5, 1, red], [4, 2, red], [5, 2, red]] }
                answer: true
                hints:
                  - "Count the squares of each shape."
                  - "Blue: 2 rows of 3. Red: 3 rows of 2."
                  - "Both cover 6 squares, so yes."
              - id: l1-f4
                type: multiple_choice
                text: "How many squares does the shape cover?"
                show: { drawn: grid, cols: 4, rows: 4, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [0, 2, blue]] }
                options: ["5", "6", "3"]
                answer: "5"
                hints:
                  - "Count along the top row, then down the side."
                  - "3 along the top and 2 more below."
                  - "5 squares."
              - id: l1-f5
                type: multiple_choice
                text: "Which shape has the smaller area?"
                show: { drawn: grid, cols: 10, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [0, 2, blue], [1, 2, blue], [2, 2, blue], [4, 0, red], [5, 0, red], [6, 0, red], [7, 0, red], [8, 0, red], [4, 1, red], [5, 1, red], [6, 1, red], [7, 1, red], [8, 1, red]] }
                options: ["the blue shape", "the red shape", "They are the same."]
                answer: "the blue shape"
                hints:
                  - "Count the squares of each shape."
                  - "Blue: 3 rows of 3. Red: 2 rows of 5."
                  - "Blue 9, red 10, so blue is smaller."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many squares does the shape cover?"
                show: { drawn: grid, cols: 6, rows: 2, cells: [[0, 0, green], [1, 0, green], [2, 0, green], [3, 0, green], [4, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green]] }
                options: ["10", "5", "7"]
                answer: "10"
                hints: ["Two rows of 5."]
              - id: l1-s2
                type: multiple_choice
                text: "Which shape has the bigger area?"
                show: { drawn: grid, cols: 7, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [5, 0, blue], [0, 2, red], [1, 2, red], [2, 2, red], [0, 3, red], [1, 3, red], [2, 3, red], [0, 4, red], [1, 4, red]] }
                options: ["the blue shape", "the red shape", "They are the same."]
                answer: "the red shape"
                hints: ["Count each shape: do not judge by how long it is."]
              - id: l1-s3
                type: true_false
                text: "Is it true? The red shape has a bigger area than the blue shape."
                show: { drawn: grid, cols: 7, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [5, 0, red], [6, 0, red], [5, 1, red], [6, 1, red]] }
                answer: false
                hints: ["Count the squares of each shape."]
              - id: l1-s4
                type: multiple_choice
                text: "How many squares does the shape cover?"
                show: { drawn: grid, cols: 5, rows: 3, cells: [[0, 0, orange], [1, 0, orange], [0, 1, orange], [1, 1, orange], [2, 1, orange], [0, 2, orange], [1, 2, orange], [2, 2, orange], [3, 2, orange]] }
                options: ["9", "8", "4"]
                answer: "9"
                hints: ["Count row by row: 2, then 3, then 4."]
              - id: l1-s5
                type: multiple_choice
                text: "Which shape has the smaller area?"
                show: { drawn: grid, cols: 9, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [5, 0, red], [6, 0, red], [7, 0, red], [5, 1, red], [6, 1, red], [7, 1, red], [5, 2, red], [6, 2, red], [7, 2, red]] }
                options: ["the blue shape", "the red shape", "They are the same."]
                answer: "the blue shape"
                hints: ["Blue: 2 rows of 4. Red: 3 rows of 3."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many squares does the shape cover?"
                show: { drawn: grid, cols: 5, rows: 3, cells: [[1, 0, purple], [2, 0, purple], [3, 0, purple], [1, 1, purple], [2, 1, purple], [3, 1, purple], [1, 2, purple], [2, 2, purple], [3, 2, purple]] }
                options: ["9", "6", "12"]
                answer: "9"
              - id: l1-n2
                type: multiple_choice
                text: "Which shape has the bigger area?"
                show: { drawn: grid, cols: 8, rows: 4, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [0, 3, red], [1, 3, red], [2, 3, red], [3, 3, red], [4, 3, red], [5, 3, red], [6, 3, red], [7, 3, red]] }
                options: ["the blue shape", "the red shape", "They are the same."]
                answer: "the blue shape"
              - id: l1-n3
                type: true_false
                text: "Is it true? The blue shape and the red shape have the same area."
                show: { drawn: grid, cols: 9, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [6, 0, red], [7, 0, red], [8, 0, red], [6, 1, red], [7, 1, red]] }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "How many squares does the shape cover?"
                show: { drawn: grid, cols: 5, rows: 4, cells: [[0, 0, green], [1, 0, green], [2, 0, green], [3, 0, green], [0, 1, green], [0, 2, green], [0, 3, green]] }
                options: ["7", "8", "4"]
                answer: "7"
              - id: l1-n5
                type: multiple_choice
                text: "Which shape has the smaller area?"
                show: { drawn: grid, cols: 6, rows: 4, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [1, 1, blue], [0, 2, blue], [1, 2, blue], [0, 3, blue], [1, 3, blue], [3, 0, red], [4, 0, red], [5, 0, red], [3, 1, red], [4, 1, red], [5, 1, red], [3, 2, red], [4, 2, red], [5, 2, red]] }
                options: ["the blue shape", "the red shape", "They are the same."]
                answer: "the blue shape"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many squares does the shape cover?"
            show: { drawn: grid, cols: 6, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [5, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue]] }
            options: ["12", "6", "10"]
            answer: "12"
          - id: l1-c2
            type: multiple_choice
            text: "Which shape has the bigger area?"
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [5, 0, blue], [0, 2, red], [1, 2, red], [2, 2, red], [0, 3, red], [1, 3, red], [2, 3, red], [0, 4, red]] }
            options: ["the blue shape", "the red shape", "They are the same."]
            answer: "the red shape"
          - id: l1-c3
            type: true_false
            text: "Is it true? The blue shape and the red shape have the same area."
            show: { drawn: grid, cols: 6, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [1, 1, blue], [3, 0, red], [4, 0, red], [5, 0, red]] }
            answer: false

  - n: 2
    title: { de: "Gleich groß und gleiche Kästchen", en: "The same area and same-sized squares" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many squares does the shape cover?"
            show: { drawn: grid, cols: 4, rows: 4, cells: [[1, 0, red], [2, 0, red], [1, 1, red], [2, 1, red], [1, 2, red], [2, 2, red], [1, 3, red], [2, 3, red]] }
            options: ["8", "4", "6"]
            answer: "8"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which shape has the bigger area?"
            show: { drawn: grid, cols: 7, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [5, 0, blue], [6, 0, blue], [0, 2, red], [1, 2, red], [2, 2, red], [3, 2, red], [4, 2, red]] }
            options: ["the blue shape", "the red shape", "They are the same."]
            answer: "the blue shape"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Three different shapes, each 6 squares"
            say: "These three shapes look different, but each one covers six squares. Different shapes can have the same area."
            show: { drawn: grid, cols: 12, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [4, 0, red], [5, 0, red], [6, 0, red], [7, 0, red], [4, 1, red], [4, 2, red], [9, 0, green], [10, 0, green], [10, 1, green], [11, 1, green], [10, 2, green], [11, 2, green]] }
          - text: "4 big tiles or 16 small tiles: the same tray"
            say: "Mia covers a tray with four big tiles. Leo covers the same tray with sixteen small tiles. The tray has not changed: the tiles are a different size. So you can only compare by counting when the squares or tiles are the same size."
          - text: "Order: green 5, blue 6, red 8"
            say: "To put shapes in order of area, count each one and then order the numbers, smallest first."
            show: { drawn: grid, cols: 11, rows: 3, cells: [[0, 0, green], [1, 0, green], [2, 0, green], [3, 0, green], [0, 1, green], [5, 0, blue], [6, 0, blue], [5, 1, blue], [6, 1, blue], [5, 2, blue], [6, 2, blue], [8, 0, red], [9, 0, red], [10, 0, red], [8, 1, red], [9, 1, red], [10, 1, red], [8, 2, red], [9, 2, red]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which shape has the same area as the blue shape?"
                show: { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue]] }
                options:
                  - { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [4, 0, red], [5, 0, red]], key: "6" }
                  - { drawn: grid, cols: 6, rows: 2, cells: [[0, 0, red], [1, 0, red], [0, 1, red], [1, 1, red]], key: "4" }
                  - { drawn: grid, cols: 6, rows: 2, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red]], key: "8" }
                answer: "6"
                hints:
                  - "Count the blue squares first."
                  - "The blue shape covers 6 squares. Which red shape covers 6?"
                  - "The long row of 6."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Amir covers his table with 8 big tiles. Bella covers her table with 8 small tiles. Whose table is bigger?"
                options: ["Amir's table", "Bella's table", "They are the same."]
                answer: "Amir's table"
                feedback:
                  "They are the same.": "Both use 8 tiles, but Amir's tiles are bigger. 8 big tiles cover more than 8 small ones."
                hints:
                  - "Are the tiles the same size?"
                  - "Big tiles cover more space than small tiles."
                  - "Amir's table is bigger."
              - id: l2-f3
                type: multiple_choice
                text: "Which shape has the biggest area?"
                show: { drawn: grid, cols: 12, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [0, 2, blue], [4, 0, red], [5, 0, red], [6, 0, red], [7, 0, red], [8, 0, red], [10, 0, green], [11, 0, green], [10, 1, green], [11, 1, green], [10, 2, green], [11, 2, green]] }
                options: ["the blue shape", "the red shape", "the green shape"]
                answer: "the blue shape"
                hints:
                  - "Count the squares of all three shapes."
                  - "Red is a row of 5. Green is 3 rows of 2."
                  - "Blue 7, red 5, green 6: blue is biggest."
              - id: l2-f4
                type: true_false
                text: "Is it true? The two shapes look different but have the same area."
                show: { drawn: grid, cols: 7, rows: 3, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [1, 2, blue], [4, 0, red], [5, 0, red], [4, 1, red], [5, 1, red]] }
                answer: true
                hints:
                  - "Count each shape."
                  - "Blue: 3 down and 1 more. Red: 2 rows of 2."
                  - "Both cover 4 squares, so yes."
              - id: l2-f5
                type: ordering
                text: "Put the shapes in order of area, smallest first."
                show: { drawn: grid, cols: 11, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [4, 0, red], [5, 0, red], [6, 0, red], [7, 0, red], [4, 1, red], [5, 1, red], [6, 1, red], [7, 1, red], [9, 0, green], [10, 0, green], [9, 1, green], [10, 1, green], [9, 2, green], [10, 2, green]] }
                options: ["blue", "red", "green"]
                slot_count: 3
                answer: ["blue", "green", "red"]
                hints:
                  - "Count each shape and write the numbers down in your head."
                  - "Blue 5, red 8, green 6."
                  - "Blue, green, red."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Which shape has the same area as the red shape?"
                show: { drawn: grid, cols: 5, rows: 2, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red]] }
                options:
                  - { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [0, 2, blue], [1, 2, blue], [2, 2, blue]], key: "9" }
                  - { drawn: grid, cols: 8, rows: 1, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [5, 0, blue], [6, 0, blue], [7, 0, blue]], key: "8" }
                  - { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue]], key: "6" }
                answer: "8"
                hints: ["The red shape covers 8 squares."]
              - id: l2-s2
                type: multiple_choice
                text: "Zoe and Kai each cover a mat with 10 tiles. Zoe's tiles are bigger than Kai's. Whose mat is bigger?"
                options: ["Zoe's mat", "Kai's mat", "They are the same."]
                answer: "Zoe's mat"
                hints: ["The same number of bigger tiles covers more."]
              - id: l2-s3
                type: multiple_choice
                text: "Which shape has the biggest area?"
                show: { drawn: grid, cols: 11, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [1, 1, blue], [0, 2, blue], [1, 2, blue], [3, 0, red], [4, 0, red], [5, 0, red], [3, 1, red], [4, 1, red], [5, 1, red], [3, 2, red], [4, 2, red], [5, 2, red], [7, 0, green], [8, 0, green], [9, 0, green], [10, 0, green], [7, 1, green], [8, 1, green], [9, 1, green], [10, 1, green]] }
                options: ["the blue shape", "the red shape", "the green shape"]
                answer: "the red shape"
                hints: ["Count all three: blue, red, green."]
              - id: l2-s4
                type: true_false
                text: "Is it true? The two shapes have the same area."
                show: { drawn: grid, cols: 7, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [4, 0, red], [5, 0, red], [6, 0, red], [4, 1, red], [4, 2, red]] }
                answer: false
                hints: ["Count each shape."]
              - id: l2-s5
                type: ordering
                text: "Put the shapes in order of area, smallest first."
                show: { drawn: grid, cols: 11, rows: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [0, 2, blue], [1, 2, blue], [2, 2, blue], [4, 0, red], [5, 0, red], [4, 1, red], [5, 1, red], [7, 0, green], [8, 0, green], [9, 0, green], [10, 0, green], [7, 1, green], [8, 1, green], [9, 1, green]] }
                options: ["blue", "red", "green"]
                slot_count: 3
                answer: ["red", "green", "blue"]
                hints: ["Blue 9, red 4, green 7."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which shape has the same area as the green shape?"
