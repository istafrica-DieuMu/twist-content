# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.compare-fractions
skill: math.fractions.compare
curriculum: en-GB
language: en
title:
  de: Brüche vergleichen
  en: Comparing fractions
summary: >
  Lesson 1 compares and orders unit fractions: the more equal parts a
  whole is cut into, the smaller each part, so 1/2 > 1/4 > 1/8, with bars
  of the same whole, the signs < and > and stories about pizzas and cakes
  of the same size. Lesson 2 compares and orders fractions with the same
  denominator (2/5 < 4/5), sets the two rules side by side, uses = for
  equal fractions, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Brüche, en: Fractions }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.fractions.on-number-line]
  also_practises: [math.fractions.on-number-line]
  vocabulary: { en: [unit fraction, numerator, denominator, greater than, less than, equal to, smallest, greatest, order] }
  forms: [text, audio, drawn]
  drawn: [fraction, number-line]
  facets: []
  parts:
    - { id: unit, what: { de: Stammbrüche vergleichen, en: comparing unit fractions } }
    - { id: same, what: { de: Brüche mit gleichem Nenner vergleichen, en: comparing fractions with the same denominator } }
    - { id: order, what: { de: Brüche ordnen, en: putting fractions in order } }
    - { id: in-context, what: { de: Sachaufgaben zum Vergleichen von Brüchen, en: word problems comparing fractions } }
  misconceptions:
    - id: bigger-denominator-bigger
      what: Thinks 1/8 is greater than 1/4 because 8 is greater than 4
      addressed: lesson 1 Learn cuts the same bar into more parts; l1-f2 has feedback, l1-f3, l1-s4, l1-s5, l1-n1, l1-c1, l2-c1 and l2-c2
    - id: same-whole
      what: Compares fractions of wholes of different sizes, or forgets the wholes must be the same
      addressed: lesson 1 Learn uses one bar; l1-f5 and l1-n4 say the pizzas or cakes are the same size
    - id: rules-mixed
      what: Uses the unit-fraction rule for the same denominator and calls 1/4 greater than 3/4
      addressed: lesson 2 Learn screen 4 sets the two rules side by side; l2-f5 has feedback, l2-s1, l2-s4, l2-n4 and l2-c3
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Stammbrüche vergleichen, en: Comparing unit fractions }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which fraction does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1, step: 0.2, labels: ends, mark: 0.6 }
            options: ["3/5", "2/5", "3/4"]
            answer: "3/5"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which fraction is closer to 0?"
            say: "Which fraction is closer to zero?"
            options: ["1/4", "3/4"]
            answer: "1/4"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1/2 of the bar"
            say: "Here is one half of a bar."
            show: { drawn: fraction, kind: bar, parts: 2, shaded: 1 }
          - text: "1/4 of the same bar"
            say: "Now the same bar is cut into four equal parts. One quarter is smaller than one half. The more parts you cut a whole into, the smaller each part is."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 1 }
          - text: "1/2 > 1/3 > 1/4 > 1/8"
            say: "So with unit fractions, the bigger the bottom number, the smaller the fraction. One half is greater than one third. One third is greater than one quarter. One quarter is greater than one eighth."
          - text: "> greater than   < less than"
            say: "The open side of the sign faces the greater number. One half is greater than one quarter. One eighth is less than one quarter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which shows the greater fraction of the bar?"
                options:
                  - { drawn: fraction, kind: bar, parts: 3, shaded: 1 }
                  - { drawn: fraction, kind: bar, parts: 6, shaded: 1 }
                answer: "1/3"
                hints:
                  - "Both bars are the same size. Compare the red parts."
                  - "One bar is cut into 3 parts, the other into 6."
                  - "Fewer parts means bigger parts: 1/3."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which is greater, 1/5 or 1/3?"
                say: "Which is greater, one fifth or one third?"
                options: ["1/3", "1/5"]
                answer: "1/3"
                option_audio: false
                feedback:
                  "1/5": "5 is the bigger number, but cutting a whole into 5 parts makes each part smaller."
                hints:
                  - "Think of the same bar cut into 5 parts and into 3 parts."
                  - "Which parts are bigger, fifths or thirds?"
                  - "Thirds are bigger, so 1/3 is greater."
              - id: l1-f3
                type: fill_in_blank
                text: "Choose <, > or =."
                say: "Choose less than, greater than or equal to."
                frame: "1/4 _ 1/8"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Which is bigger, a quarter or an eighth of the same bar?"
                  - "A quarter is bigger, so 1/4 is greater than 1/8."
                  - "The open side faces 1/4: >."
              - id: l1-f4
                type: ordering
                text: "Put the fractions in order, smallest first."
                options: ["1/2", "1/8", "1/4"]
                slot_count: 3
                answer: ["1/8", "1/4", "1/2"]
                option_audio: false
                hints:
                  - "The bigger the bottom number, the smaller the part."
                  - "Eighths are the smallest parts, halves the biggest."
                  - "1/8, 1/4, 1/2."
              - id: l1-f5
                type: multiple_choice
                text: "Ella eats 1/4 of a pizza. Sam eats 1/6 of a pizza of the same size. Who eats more?"
                say: "Ella eats one quarter of a pizza. Sam eats one sixth of a pizza of the same size. Who eats more?"
                options: ["Ella", "Sam"]
                answer: "Ella"
                hints:
                  - "The pizzas are the same size, so compare the fractions."
                  - "Which piece is bigger, a quarter or a sixth?"
                  - "A quarter is bigger. Ella eats more."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is smaller, 1/10 or 1/2?"
                say: "Which is smaller, one tenth or one half?"
                options: ["1/10", "1/2"]
                answer: "1/10"
                option_audio: false
                hints: ["Cutting into 10 parts makes small parts."]
              - id: l1-s2
                type: fill_in_blank
                text: "Choose <, > or =."
                say: "Choose less than, greater than or equal to."
                frame: "1/3 _ 1/2"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["A third is smaller than a half."]
              - id: l1-s3
                type: ordering
                text: "Put the fractions in order, smallest first."
                options: ["1/3", "1/10", "1/5"]
                slot_count: 3
                answer: ["1/10", "1/5", "1/3"]
                option_audio: false
                hints: ["The biggest bottom number is the smallest fraction."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 1/8 is greater than 1/4."
                say: "Is it true? One eighth is greater than one quarter."
                answer: false
                hints: ["Eighths are smaller parts than quarters."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which shows the smallest fraction of the bar?"
                options:
                  - { drawn: fraction, kind: bar, parts: 5, shaded: 1 }
                  - { drawn: fraction, kind: bar, parts: 2, shaded: 1 }
                  - { drawn: fraction, kind: bar, parts: 8, shaded: 1 }
                answer: "1/8"
                hints: ["Look for the smallest red part."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is greater, 1/7 or 1/9?"
                say: "Which is greater, one seventh or one ninth?"
                options: ["1/7", "1/9"]
                answer: "1/7"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Choose <, > or =."
                say: "Choose less than, greater than or equal to."
                frame: "1/6 _ 1/3"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n3
                type: ordering
                text: "Put the fractions in order, greatest first."
                options: ["1/4", "1/2", "1/3", "1/10"]
                slot_count: 4
                answer: ["1/2", "1/3", "1/4", "1/10"]
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Tom shares a cake equally with 1 friend. Mia shares a cake of the same size equally with 4 friends. Who gets the bigger piece?"
                options: ["Tom", "Mia"]
                answer: "Tom"
                difficulty: stretch
              - id: l1-n5
                type: true_false
                text: "Is it true? 1/2 > 1/5"
                say: "Is it true? One half is greater than one fifth."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is greater, 1/4 or 1/3?"
            say: "Which is greater, one quarter or one third?"
            options: ["1/3", "1/4"]
            answer: "1/3"
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Choose <, > or =."
            say: "Choose less than, greater than or equal to."
            frame: "1/2 _ 1/6"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c3
            type: ordering
            text: "Put the fractions in order, smallest first."
            options: ["1/2", "1/5", "1/3"]
            slot_count: 3
            answer: ["1/5", "1/3", "1/2"]
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Is it true? 1/3 < 1/8"
            say: "Is it true? One third is less than one eighth."
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Which shows the smaller fraction of the bar?"
            options:
              - { drawn: fraction, kind: bar, parts: 2, shaded: 1 }
              - { drawn: fraction, kind: bar, parts: 5, shaded: 1 }
            answer: "1/5"
          - id: l1-c6
            type: multiple_choice
            text: "Ben eats 1/2 of a sandwich. Kai eats 1/3 of a sandwich of the same size. Who eats more?"
            say: "Ben eats one half of a sandwich. Kai eats one third of a sandwich of the same size. Who eats more?"
            options: ["Ben", "Kai"]
            answer: "Ben"

  - n: 2
    title: { de: Gleiche Nenner vergleichen, en: Same denominator }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is greater, 1/2 or 1/8?"
            say: "Which is greater, one half or one eighth?"
            options: ["1/2", "1/8"]
            answer: "1/2"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Choose <, > or =."
            say: "Choose less than, greater than or equal to."
            frame: "1/5 _ 1/4"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "2/5"
            say: "Two fifths of the bar is red."
            show: { drawn: fraction, kind: bar, parts: 5, shaded: 2 }
          - text: "4/5 > 2/5"
            say: "Now four fifths is red. The parts are all fifths, the same size, so more parts means more. Four fifths is greater than two fifths."
            show: { drawn: fraction, kind: bar, parts: 5, shaded: 4 }
          - text: "Same bottom number: compare the top numbers.\n2/7 < 5/7"
            say: "When the bottom numbers are the same, the parts are the same size. Compare the top numbers. Two sevenths is less than five sevenths."
          - text: "1/3 > 1/5, but 3/5 > 1/5"
            say: "Keep the two rules apart. For unit fractions, the bigger bottom number gives the smaller fraction. When the bottom numbers are the same, the bigger top number gives the bigger fraction."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which shows the greater fraction of the bar?"
                options:
                  - { drawn: fraction, kind: bar, parts: 5, shaded: 2 }
                  - { drawn: fraction, kind: bar, parts: 5, shaded: 4 }
                answer: "4/5"
                hints:
                  - "Both bars are cut into fifths."
                  - "Which bar has more red fifths?"
                  - "4 fifths is more than 2 fifths."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which is greater, 3/8 or 5/8?"
                say: "Which is greater, three eighths or five eighths?"
                options: ["5/8", "3/8"]
                answer: "5/8"
                option_audio: false
                hints:
                  - "The bottom numbers are the same."
                  - "So compare the top numbers: 3 and 5."
                  - "5 eighths is more: 5/8."
              - id: l2-f3
                type: fill_in_blank
                text: "Choose <, > or =."
                say: "Choose less than, greater than or equal to."
                frame: "2/7 _ 5/7"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Both are sevenths."
                  - "2 sevenths is less than 5 sevenths."
                  - "2/7 < 5/7."
              - id: l2-f4
                type: ordering
                text: "Put the fractions in order, smallest first."
                options: ["4/6", "1/6", "5/6"]
                slot_count: 3
                answer: ["1/6", "4/6", "5/6"]
                option_audio: false
                hints:
                  - "All are sixths."
                  - "Order the top numbers: 1, 4, 5."
                  - "1/6, 4/6, 5/6."
              - id: l2-f5
                type: multiple_choice
                text: "Which is greater, 1/4 or 3/4?"
                say: "Which is greater, one quarter or three quarters?"
                options: ["3/4", "1/4"]
                answer: "3/4"
                option_audio: false
                feedback:
                  "1/4": "Both are quarters. 3 quarters are more than 1 quarter."
                hints:
                  - "Are the bottom numbers the same?"
                  - "Yes, both are quarters. Compare the top numbers."
                  - "3 quarters: 3/4 is greater."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which is smaller, 7/10 or 3/10?"
                say: "Which is smaller, seven tenths or three tenths?"
                options: ["3/10", "7/10"]
                answer: "3/10"
                option_audio: false
                hints: ["Same bottom number: compare the top numbers."]
              - id: l2-s2
                type: fill_in_blank
                text: "Choose <, > or =."
                say: "Choose less than, greater than or equal to."
                frame: "5/9 _ 2/9"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["5 ninths and 2 ninths."]
              - id: l2-s3
                type: ordering
                text: "Put the fractions in order, greatest first."
                options: ["2/5", "4/5", "1/5", "3/5"]
                slot_count: 4
                answer: ["4/5", "3/5", "2/5", "1/5"]
                option_audio: false
                hints: ["The biggest top number first."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 6/8 < 3/8"
                say: "Is it true? Six eighths is less than three eighths."
                answer: false
                hints: ["Same bottom number: which top number is bigger?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Choose <, > or =."
                say: "Choose less than, greater than or equal to."
                frame: "3/4 _ 3/4"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Look closely at both fractions."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Jack has eaten 2/6 of his chocolate bar. Leah has eaten 5/6 of the same kind of bar. Who has eaten more?"
                say: "Jack has eaten two sixths of his chocolate bar. Leah has eaten five sixths of the same kind of bar. Who has eaten more?"
                options: ["Leah", "Jack"]
                answer: "Leah"
              - id: l2-n2
                type: fill_in_blank
                text: "Choose <, > or =."
                say: "Choose less than, greater than or equal to."
                frame: "4/10 _ 7/10"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n3
                type: ordering
                text: "Four jugs of the same size hold some juice. Put the amounts in order, smallest first."
                options: ["5/8", "2/8", "7/8", "1/8"]
                slot_count: 4
                answer: ["1/8", "2/8", "5/8", "7/8"]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Ava runs 1/3 of the track. Ben runs 2/3 of the same track. Kim runs 1/5 of it. Who runs the furthest?"
                say: "Ava runs one third of the track. Ben runs two thirds of the same track. Kim runs one fifth of it. Who runs the furthest?"
                options: ["Ben", "Ava", "Kim"]
                answer: "Ben"
              - id: l2-n5
                type: true_false
                text: "Is it true? 1/3 > 1/6"
                say: "Is it true? One third is greater than one sixth."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: unit
            type: multiple_choice
            text: "Which is greater, 1/6 or 1/4?"
            say: "Which is greater, one sixth or one quarter?"
            options: ["1/4", "1/6"]
            answer: "1/4"
            option_audio: false
          - id: l2-c2
            part: unit
            type: fill_in_blank
            text: "Choose <, > or =."
            say: "Choose less than, greater than or equal to."
            frame: "1/10 _ 1/3"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c3
            part: same
            type: multiple_choice
            text: "Which is greater, 4/9 or 7/9?"
            say: "Which is greater, four ninths or seven ninths?"
            options: ["7/9", "4/9"]
            answer: "7/9"
            option_audio: false
          - id: l2-c4
            part: order
            type: ordering
            text: "Put the fractions in order, smallest first."
            options: ["1/2", "1/10", "1/4"]
            slot_count: 3
            answer: ["1/10", "1/4", "1/2"]
            option_audio: false
          - id: l2-c5
            part: same
            type: fill_in_blank
            text: "Choose <, > or =."
            say: "Choose less than, greater than or equal to."
            frame: "3/5 _ 4/5"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c6
            part: unit
            type: true_false
            text: "Is it true? 1/9 < 1/4"
            say: "Is it true? One ninth is less than one quarter."
            answer: true
          - id: l2-c7
            part: unit
            type: fill_in_blank
            text: "Choose <, > or =."
            say: "Choose less than, greater than or equal to."
            frame: "1/8 _ 1/5"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c8
            part: unit
            type: multiple_choice
            text: "Which fraction is the smallest?"
            options: ["1/3", "1/7", "1/5"]
            answer: "1/7"
            option_audio: false
          - id: l2-c9
            part: same
            type: true_false
            text: "Is it true? 3/10 > 8/10"
            say: "Is it true? Three tenths is greater than eight tenths."
            answer: false
          - id: l2-c10
            part: same
            type: image_multiple_choice
            text: "Which shows the smaller fraction of the bar?"
            options:
              - { drawn: fraction, kind: bar, parts: 7, shaded: 6 }
              - { drawn: fraction, kind: bar, parts: 7, shaded: 3 }
            answer: "3/7"
          - id: l2-c11
            part: same
            type: fill_in_blank
            text: "Choose <, > or =."
            say: "Choose less than, greater than or equal to."
            frame: "8/9 _ 5/9"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c12
            part: order
            type: ordering
            text: "Put the fractions in order, greatest first."
            options: ["1/5", "1/2", "1/8"]
            slot_count: 3
            answer: ["1/2", "1/5", "1/8"]
            option_audio: false
          - id: l2-c13
            part: order
            type: ordering
            text: "Put the fractions in order, smallest first."
            options: ["5/7", "2/7", "6/7", "3/7"]
            slot_count: 4
            answer: ["2/7", "3/7", "5/7", "6/7"]
            option_audio: false
          - id: l2-c14
            part: order
            type: ordering
            text: "Put the fractions in order, greatest first."
            options: ["3/10", "9/10", "6/10"]
            slot_count: 3
            answer: ["9/10", "6/10", "3/10"]
            option_audio: false
          - id: l2-c15
            part: order
            type: multiple_choice
            text: "Which list is in order, smallest first?"
            options: ["1/6, 1/4, 1/2", "1/2, 1/4, 1/6", "1/4, 1/6, 1/2"]
            answer: "1/6, 1/4, 1/2"
            option_audio: false
          - id: l2-c16
            part: in-context
            type: multiple_choice
            text: "Grace eats 1/3 of a pie. Max eats 1/8 of a pie of the same size. Who eats more?"
            say: "Grace eats one third of a pie. Max eats one eighth of a pie of the same size. Who eats more?"
            options: ["Grace", "Max"]
            answer: "Grace"
