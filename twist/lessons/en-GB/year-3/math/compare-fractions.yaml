            part: in-context
            type: multiple_choice
            text: "Ali and Zara have ribbons of the same length. Ali uses 4/10 of his ribbon. Zara uses 7/10 of hers. Who uses more ribbon?"
            say: "Ali and Zara have ribbons of the same length. Ali uses four tenths of his ribbon. Zara uses seven tenths of hers. Who uses more ribbon?"
            options: ["Zara", "Ali"]
            answer: "Zara"
          - id: l2-c18
            part: in-context
            type: true_false
            text: "Leo and Mia have bottles of water of the same size. Leo drinks 1/2 of his bottle and Mia drinks 1/4 of hers. Is it true? Mia drinks more."
            say: "Leo and Mia have bottles of water of the same size. Leo drinks one half of his bottle and Mia drinks one quarter of hers. Mia drinks more. Is it true?"
            answer: false
          - id: l2-c19
            part: in-context
            type: multiple_choice
            text: "Three fences are the same size. Ruby paints 3/5 of her fence, Sam paints 4/5 of his and Noah paints 2/5 of his. Who paints the most?"
            say: "Three fences are the same size. Ruby paints three fifths of her fence, Sam paints four fifths of his and Noah paints two fifths of his. Who paints the most?"
            options: ["Sam", "Ruby", "Noah"]
            answer: "Sam"
          - id: l2-c20
            part: in-context
            type: multiple_choice
            text: "Two cakes are the same size. One is cut into 6 equal slices and the other into 8 equal slices. Which slice is bigger?"
            options: ["a slice of the cake cut into 6", "a slice of the cake cut into 8", "They are the same."]
            answer: "a slice of the cake cut into 6"
