# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.certain-possible-impossible
skill: math.chance.certain-possible-impossible
curriculum: en-GB
language: en
title:
  de: Sicher, wahrscheinlich, unwahrscheinlich, unmöglich
  en: Certain, likely, unlikely, impossible
summary: >
  Lesson 1 sorts what can happen into certain, possible and impossible
  with spinners, a normal dice and everyday events (a spinner that is all
  red always lands on red; rolling a 7 on a dice is impossible); lesson 2
  splits possible into likely and unlikely by counting the sections of a
  spinner or the counters in a bag (five red sections and one blue: blue
  can happen, but it is unlikely), puts the words in order from
  impossible to certain, and ends with the skill check. Spinning a real
  spinner or picking counters waits for an experiment task.
metadata:
  year: year-3
  topic: { de: Wahrscheinlichkeit, en: Chance }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: []
  also_practises: []
  vocabulary: { en: [certain, possible, impossible, likely, unlikely, chance, spinner, dice, counter] }
  forms: [text, audio, drawn, picture]
  drawn: [spinner, dots]
  facets: []
  misconceptions:
    - id: possible-is-certain
      what: Calls an event certain because it can happen (blue is on the spinner, so blue will come)
      addressed: lesson 1 Learn shows a red and blue spinner where both can come but neither must; l1-f3 has feedback; l1-s3, l1-n3 and l1-c3 ask about one colour of several; l2-f4, l2-n4 and l2-c4 tell certain from likely
    - id: rare-is-impossible
      what: Calls an unlikely event impossible because it hardly ever happens (one blue section of six)
      addressed: lesson 2 Learn says blue can happen, but it is unlikely; l2-f1 has feedback; l2-s1, l2-n1 and l2-c2 offer impossible for a colour that is there only once, and l2-n5 asks whether one counter in ten is impossible
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Sicher, möglich oder unmöglich", en: "Certain, possible or impossible" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "This spinner is all red."
            say: "Every section of this spinner is red. When you spin it, it lands on red. That is certain. It cannot land on blue. That is impossible."
            show: { drawn: spinner, sectors: [red, red, red, red] }
          - text: "Red and blue are both possible."
            say: "This spinner has red sections and blue sections. It could land on red. It could land on blue. Both are possible, but neither is certain. You do not know before you spin."
            show: { drawn: spinner, sectors: [red, blue, red, blue] }
          - text: "A dice has 1, 2, 3, 4, 5 and 6.\nRolling a 4 is possible.\nRolling a 7 is impossible."
            say: "A normal dice has the numbers one to six. Rolling a four is possible. Rolling a seven is impossible, because there is no seven on the dice."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The spinner lands on red."
                say: "You spin the spinner. It lands on red. Is that certain, possible or impossible?"
                show: { drawn: spinner, sectors: [red, red, red, red] }
                options: ["certain", "possible", "impossible"]
                answer: "certain"
                keep_order: true
                feedback:
                  "possible": "Every section is red, so it always lands on red. That is certain."
                hints:
                  - "Look at every section. Which colours are there?"
                  - "All the sections are red. Could another colour come up?"
                  - "It always lands on red. Certain."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "The spinner lands on yellow."
                say: "You spin the spinner. It lands on yellow. Is that certain, possible or impossible?"
                show: { drawn: spinner, sectors: [red, blue, red, blue] }
                options: ["certain", "possible", "impossible"]
                answer: "impossible"
                keep_order: true
                hints:
                  - "Is there a yellow section?"
                  - "There are only red and blue sections."
                  - "Yellow cannot come up. Impossible."
              - id: l1-f3
                type: multiple_choice
                text: "The spinner lands on blue."
                say: "You spin the spinner. It lands on blue. Is that certain, possible or impossible?"
                show: { drawn: spinner, sectors: [red, blue, yellow, green] }
                options: ["certain", "possible", "impossible"]
                answer: "possible"
                keep_order: true
                feedback:
                  "certain": "Blue is there, so it can come up. But red, yellow or green could come up instead, so it is not certain."
                hints:
                  - "Is there a blue section? Are there other colours too?"
                  - "Blue can come up, but so can the other colours."
                  - "Possible."
              - id: l1-f4
                type: multiple_choice
                text: "You roll a normal dice and get an 8."
                options: ["certain", "possible", "impossible"]
                answer: "impossible"
                keep_order: true
                hints:
                  - "Which numbers are on a normal dice?"
                  - "1 to 6. Is 8 one of them?"
                  - "There is no 8. Impossible."
              - id: l1-f5
                type: multiple_choice
                text: "The sun will rise tomorrow morning."
                show: { object: sun }
                options: ["certain", "possible", "impossible"]
                answer: "certain"
                keep_order: true
                hints:
                  - "Think about every morning. What always happens?"
                  - "Even on a rainy day it gets light in the morning."
                  - "The sun rises every morning. Certain."
              - id: l1-f6
                type: image_multiple_choice
                text: "On which spinner is blue impossible?"
                options:
                  - { drawn: spinner, sectors: [red, yellow, red, yellow], key: red-yellow }
                  - { drawn: spinner, sectors: [blue, yellow, blue, yellow], key: blue-yellow }
                  - { drawn: spinner, sectors: [blue, blue, blue, blue], key: blue }
                answer: red-yellow
                hints:
                  - "Impossible means blue can never come up."
                  - "Look for the spinner with no blue section."
                  - "The red and yellow spinner."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The spinner lands on yellow."
                show: { drawn: spinner, sectors: [yellow, yellow, yellow] }
                options: ["certain", "possible", "impossible"]
                answer: "certain"
                keep_order: true
                hints: ["Which colours are on this spinner?"]
              - id: l1-s2
                type: multiple_choice
                text: "The spinner lands on blue."
                show: { drawn: spinner, sectors: [green, green, red] }
                options: ["certain", "possible", "impossible"]
                answer: "impossible"
                keep_order: true
                hints: ["Is there any blue section?"]
              - id: l1-s3
                type: multiple_choice
                text: "You roll a normal dice and get a 3."
                options: ["certain", "possible", "impossible"]
                answer: "possible"
                keep_order: true
                hints: ["A 3 is on the dice, but so are other numbers."]
              - id: l1-s4
                type: multiple_choice
                text: "A dog flies to the moon on its own."
                show: { objects: [dog, moon] }
                options: ["certain", "possible", "impossible"]
                answer: "impossible"
                keep_order: true
                hints: ["Can a dog fly?"]
              - id: l1-s5
                type: multiple_choice
                text: "It rains this afternoon."
                options: ["certain", "possible", "impossible"]
                answer: "possible"
                keep_order: true
                hints: ["Could it rain? Could it stay dry?"]
              - id: l1-s6
                type: image_multiple_choice
                text: "On which spinner is red certain?"
                options:
                  - { drawn: spinner, sectors: [red, red, red, red], key: red }
                  - { drawn: spinner, sectors: [red, red, red, blue], key: red-blue }
                  - { drawn: spinner, sectors: [blue, blue, blue, blue], key: blue }
                answer: red
                hints: ["Certain means it always lands on red."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Certain, possible or impossible?"
                bins:
                  - { id: certain, show: { text: "certain" }, say: "certain" }
                  - { id: possible, show: { text: "possible" }, say: "possible" }
                  - { id: impossible, show: { text: "impossible" }, say: "impossible" }
                options:
                  - { text: "Tuesday comes after Monday.", bin: certain }
                  - { text: "You find a pound coin today.", bin: possible }
                  - { text: "A fish rides a bike.", bin: impossible }
                  - { text: "You roll a 6 on a dice.", bin: possible }
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "The spinner lands on green."
                show: { drawn: spinner, sectors: [red, blue] }
                options: ["certain", "possible", "impossible"]
                answer: "impossible"
                keep_order: true
              - id: l1-n3
                type: multiple_choice
                text: "The spinner lands on red."
                show: { drawn: spinner, sectors: [red, red, blue, yellow] }
                options: ["certain", "possible", "impossible"]
                answer: "possible"
                keep_order: true
              - id: l1-n4
                type: multiple_choice
                text: "You roll a normal dice and get a number less than 7."
                options: ["certain", "possible", "impossible"]
                answer: "certain"
                keep_order: true
              - id: l1-n5
                type: true_false
                text: "Is it true? On this spinner, landing on purple is impossible."
                show: { drawn: spinner, sectors: [orange, green, orange, green] }
                answer: true
              - id: l1-n6
                type: multiple_choice
                text: "Your teacher reads the class a story today."
                options: ["certain", "possible", "impossible"]
                answer: "possible"
                keep_order: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The spinner lands on blue."
            show: { drawn: spinner, sectors: [blue, blue, blue] }
            options: ["certain", "possible", "impossible"]
            answer: "certain"
            keep_order: true
          - id: l1-c2
            type: multiple_choice
            text: "You roll a normal dice and get a 0."
            options: ["certain", "possible", "impossible"]
            answer: "impossible"
            keep_order: true
          - id: l1-c3
            type: true_false
            text: "Is it true? On this spinner, landing on red is certain."
            show: { drawn: spinner, sectors: [red, yellow, red, yellow] }
            answer: false

  - n: 2
    title: { de: "Wahrscheinlich oder unwahrscheinlich", en: "Likely or unlikely" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The spinner lands on green."
            show: { drawn: spinner, sectors: [green, green, green, green] }
            options: ["certain", "possible", "impossible"]
            answer: "certain"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "You roll a normal dice and get a 5."
            options: ["certain", "possible", "impossible"]
            answer: "possible"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5 red sections, 1 blue section"
            say: "Five sections of this spinner are red and only one is blue. Red and blue can both come up. But most of the time it lands on red. Red is likely. Blue is unlikely, but it is not impossible."
            show: { drawn: spinner, sectors: [red, red, blue, red, red, red] }
          - text: "In the bag: 1 red counter, 5 blue counters"
            say: "A bag has these counters in it: one red and five blue. You pick one without looking. A blue counter is likely. A red counter is unlikely."
            show: { drawn: dots, count: 6, layout: row, colour_split: [1, 5] }
          - text: "impossible\nunlikely\nlikely\ncertain"
            say: "You can put the words in order. Impossible: it never happens. Unlikely: it does not often happen. Likely: it often happens. Certain: it always happens."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The spinner lands on blue."
                say: "You spin the spinner. It lands on blue. Is that likely, unlikely or impossible?"
                show: { drawn: spinner, sectors: [red, red, red, blue, red, red] }
                options: ["likely", "unlikely", "impossible"]
                answer: "unlikely"
                keep_order: true
                feedback:
                  "impossible": "There is one blue section, so blue can come up. It just does not happen often. That is unlikely."
                hints:
                  - "Count the sections of each colour."
                  - "5 red and 1 blue. Can blue come up? Often or not often?"
                  - "Blue can come up, but not often. Unlikely."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "You pick a blue counter without looking."
                show: { drawn: dots, count: 6, layout: row, colour_split: [1, 5] }
                options: ["likely", "unlikely", "impossible"]
                answer: "likely"
                keep_order: true
                hints:
                  - "The red dots are red counters, the blue dots blue counters."
                  - "There are 5 blue counters and only 1 red."
                  - "Blue is likely."
              - id: l2-f3
                type: image_multiple_choice
                text: "On which spinner is red likely?"
                options:
                  - { drawn: spinner, sectors: [red, red, red, red, red, blue], key: five-red }
                  - { drawn: spinner, sectors: [red, blue, blue, blue, blue, blue], key: one-red }
                  - { drawn: spinner, sectors: [blue, blue, blue, blue, blue, blue], key: no-red }
                answer: five-red
                hints:
                  - "Likely means it happens often."
                  - "Find the spinner with the most red sections."
                  - "The spinner with five red sections."
              - id: l2-f4
                type: true_false
                text: "Is it true? On this spinner, landing on yellow is certain."
                show: { drawn: spinner, sectors: [yellow, yellow, yellow, yellow, yellow, green] }
                answer: false
                hints:
                  - "Is every section yellow?"
                  - "There is one green section."
                  - "Yellow is likely, not certain. So no."
              - id: l2-f5
                type: ordering
                text: "Put the words in order, from never to always."
                options: ["likely", "certain", "impossible", "unlikely"]
                slot_count: 4
                answer: ["impossible", "unlikely", "likely", "certain"]
                hints:
                  - "Which word means it never happens?"
                  - "Impossible first, certain last."
                  - "impossible, unlikely, likely, certain."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The spinner lands on green."
                show: { drawn: spinner, sectors: [green, yellow, yellow, yellow, yellow, yellow] }
                options: ["likely", "unlikely", "impossible"]
                answer: "unlikely"
                keep_order: true
                hints: ["There is only one green section."]
              - id: l2-s2
                type: multiple_choice
                text: "You pick a red counter without looking."
                show: { drawn: dots, count: 6, layout: row, colour_split: [5, 1] }
                options: ["likely", "unlikely", "impossible"]
                answer: "likely"
                keep_order: true
                hints: ["Count the red counters and the blue ones."]
              - id: l2-s3
                type: image_multiple_choice
                text: "On which spinner is blue unlikely?"
                options:
                  - { drawn: spinner, sectors: [blue, blue, blue, red], key: three-blue }
                  - { drawn: spinner, sectors: [red, red, red, blue], key: one-blue }
                  - { drawn: spinner, sectors: [red, red, red, red], key: no-blue }
                answer: one-blue
                hints: ["Unlikely: blue is there, but only a little."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Picking a red counter is likely."
                show: { drawn: dots, count: 8, layout: row, colour_split: [2, 6] }
                answer: false
                hints: ["Are there more red counters or more blue ones?"]
              - id: l2-s5
                type: sorting
                text: "Likely or unlikely?"
                bins:
                  - { id: likely, show: { text: "likely" }, say: "likely" }
                  - { id: unlikely, show: { text: "unlikely" }, say: "unlikely" }
                options:
                  - { text: "It is cold in January.", bin: likely }
                  - { text: "A cat walks into your classroom.", bin: unlikely }
                  - { text: "It rains at some point in November.", bin: likely }
                  - { text: "You meet the King on the way home.", bin: unlikely }
                option_audio: false
                hints: ["Does it happen often or not often?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The spinner lands on purple."
                show: { drawn: spinner, sectors: [orange, orange, purple, orange, orange, orange] }
                options: ["likely", "unlikely", "impossible"]
                answer: "unlikely"
                keep_order: true
              - id: l2-n2
                type: multiple_choice
                text: "You pick a blue counter without looking."
                show: { drawn: dots, count: 7, layout: row, colour_split: [2, 5] }
                options: ["likely", "unlikely", "impossible"]
                answer: "likely"
                keep_order: true
              - id: l2-n3
                type: multiple_choice
                text: "You pick a green counter from this bag without looking."
                show: { drawn: dots, count: 6, layout: row, colour_split: [3, 3] }
                options: ["likely", "unlikely", "impossible"]
                answer: "impossible"
                keep_order: true
              - id: l2-n4
                type: multiple_choice
                text: "The spinner lands on red or blue."
                show: { drawn: spinner, sectors: [red, blue, red, blue, red, blue] }
                options: ["certain", "likely", "unlikely"]
                answer: "certain"
                keep_order: true
              - id: l2-n5
                type: true_false
                text: "A bag has 9 green counters and 1 yellow counter. Is it true that picking the yellow counter is impossible?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "The spinner lands on red."
            show: { drawn: spinner, sectors: [blue, green, blue, green] }
            options: ["certain", "possible", "impossible"]
            answer: "impossible"
            keep_order: true
          - id: l2-c2
            type: multiple_choice
            text: "The spinner lands on yellow."
            show: { drawn: spinner, sectors: [blue, blue, blue, blue, yellow, blue] }
            options: ["likely", "unlikely", "impossible"]
            answer: "unlikely"
            keep_order: true
          - id: l2-c3
            type: multiple_choice
            text: "You pick a red counter without looking."
            show: { drawn: dots, count: 7, layout: row, colour_split: [6, 1] }
            options: ["likely", "unlikely", "impossible"]
            answer: "likely"
            keep_order: true
          - id: l2-c4
            type: true_false
            text: "Is it true? On this spinner, landing on blue is certain."
            show: { drawn: spinner, sectors: [blue, blue, blue, blue] }
            answer: true
          - id: l2-c5
            type: multiple_choice
            text: "You roll a normal dice and get a 2."
            options: ["certain", "possible", "impossible"]
            answer: "possible"
            keep_order: true
