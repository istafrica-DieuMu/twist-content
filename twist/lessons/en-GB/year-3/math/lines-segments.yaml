# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.lines-segments
skill: math.shapes.lines-segments
curriculum: en-GB
language: en
title:
  de: Linien und Strecken
  en: Lines, line segments and curves
summary: >
  Lesson 1 tells a curve (a line that bends), a straight line (it never
  bends and in maths goes on for ever) and a line segment (straight, with
  two end points) apart, in words, letters, shapes on squared paper and
  things around us; lesson 2 measures line segments on a ruler in cm and
  mm, also when the segment does not start at 0, compares lengths given
  in cm and mm, and ends with the skill check. Drawing a line segment of
  a given length, and pictures of curves to choose from, wait for a
  drawing task and a curve component.
metadata:
  year: year-3
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.draw-freehand-ruler, math.length.cm-m]
  also_practises: [math.length.mm-km]
  vocabulary: { en: [line, straight line, line segment, curve, end point, measure, ruler] }
  forms: [text, audio, drawn, picture]
  drawn: [ruler, grid, shape]
  facets: []
  parts:
    - { id: kinds, what: { de: Linien und Geraden und Strecken unterscheiden, en: telling curves and straight lines and line segments apart } }
    - { id: measure, what: { de: eine Strecke in cm und mm messen, en: measuring a line segment in cm and mm } }
    - { id: not-zero, what: { de: "eine Strecke messen, die nicht bei 0 beginnt", en: measuring a line segment that does not start at 0 } }
    - { id: compare, what: { de: Längen in cm und mm vergleichen, en: comparing lengths in cm and mm } }
  misconceptions:
    - id: segment-line-mixed
      what: Thinks a straight line has two ends and can be measured, or that a line segment can bend
      addressed: lesson 1 Learn sets curve, straight line and line segment side by side; l1-f2 has feedback, l1-f3, l1-s3, l1-n4 and l2-c1
    - id: end-not-length
      what: Reads the number at the end when the line segment does not start at 0
      addressed: lesson 2 Learn measures a segment from 2 cm; l2-f2 and l2-f5 have feedback, l2-s2, l2-s5, l2-n2, l2-n4 and l2-c3 start away from 0
    - id: bigger-number-longer
      what: Calls 58 mm longer than 6 cm because 58 is the bigger number
      addressed: lesson 2 Learn changes 6 cm into 60 mm; l2-f4 has feedback, l2-s4, l2-n3, l2-n5 and l2-c5 compare cm with mm
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Linie, Gerade, Strecke", en: "Curves, lines and line segments" }
    goal:
      de: "Unterscheide krumme Linien, Geraden und Strecken. Eine Strecke ist gerade und hat zwei Endpunkte."
      en: "Tell curves, straight lines and line segments apart. A line segment is straight and has two end points."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How long is the strip?"
            show: { drawn: ruler, to: 10, length: 5 }
            options: ["5 cm", "6 cm", "4 cm"]
            answer: "5 cm"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Which helps you draw a straight line?"
            options: [{ object: ruler }, { object: scissors }, { object: rubber }]
            answer: ruler
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A curve is a line that bends."
            say: "A curve is a line that bends, like a rainbow or the letter S."
          - text: "A straight line never bends. In maths it goes on for ever in both directions."
            say: "A straight line never bends. In maths a straight line goes on for ever in both directions. It has no ends, so you cannot measure it."
          - text: "A line segment is straight and has two end points."
            say: "A line segment is a piece of a straight line. It has two end points, so you can measure it. This one is four squares long."
            show: { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 5, 1]] }
          - text: "A triangle is made of 3 line segments."
            say: "The sides of a triangle are three line segments. Each side starts and stops at a corner."
            show: { drawn: grid, cols: 6, rows: 5, lines: [[1, 4, 5, 4], [5, 4, 3, 1], [3, 1, 1, 4]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What do we call a line that bends?"
                options: ["a curve", "a line segment", "a straight line"]
                answer: "a curve"
                hints:
                  - "Line segments and straight lines never bend."
                  - "Think of a rainbow. What kind of line is it?"
                  - "A line that bends is a curve."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which one can you measure with a ruler?"
                options: ["a line segment", "a straight line that goes on for ever"]
                answer: "a line segment"
                feedback:
                  "a straight line that goes on for ever": "A line that goes on for ever has no end points, so there is nothing to measure to."
                hints:
                  - "To measure, you need a start and an end."
                  - "Which one has two end points?"
                  - "The line segment."
              - id: l1-f3
                type: true_false
                text: "Is it true? A line segment can bend."
                answer: false
                hints:
                  - "A line segment is a piece of something. Of what?"
                  - "It is a piece of a straight line."
                  - "No. A line segment is always straight."
              - id: l1-f4
                type: multiple_choice
                text: "How many squares long is the line segment?"
                show: { drawn: grid, cols: 7, rows: 2, lines: [[1, 1, 6, 1]] }
                options: ["5", "6", "7"]
                answer: "5"
                hints:
                  - "Count the sides of the squares along the line, not the corners."
                  - "Start at one end point and count each square you pass."
                  - "It is 5 squares long."
              - id: l1-f5
                type: multiple_choice
                text: "How many line segments make a square?"
                show: { drawn: shape, kind: square }
                options: ["4", "1", "8"]
                answer: "4"
                hints:
                  - "Each side of the square is a line segment."
                  - "Count the sides."
                  - "A square has 4 sides, so 4 line segments."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which letter is a curve?"
                options: ["C", "L", "T"]
                answer: "C"
                option_audio: false
                hints: ["Which letter bends?"]
              - id: l1-s2
                type: multiple_choice
                text: "How many line segments can you see?"
                show: { drawn: grid, cols: 7, rows: 5, lines: [[1, 4, 6, 4], [6, 4, 6, 1], [6, 1, 1, 4]] }
                options: ["3", "4", "2"]
                answer: "3"
                hints: ["Count each straight side from corner to corner."]
              - id: l1-s3
                type: true_false
                text: "Is it true? A straight line in maths has two end points."
                answer: false
                hints: ["A straight line goes on for ever."]
              - id: l1-s4
                type: multiple_choice
                text: "How many squares long is the line segment?"
                show: { drawn: grid, cols: 4, rows: 5, lines: [[2, 0, 2, 4]] }
                options: ["4", "5", "3"]
                answer: "4"
                hints: ["Count the squares from top to bottom."]
              - id: l1-s5
                type: sorting
                text: "Does it bend? Sort the things."
                bins:
                  - { id: curve, show: { text: "curve" }, say: "Curve." }
                  - { id: straight, show: { text: "straight" }, say: "Straight." }
                options:
                  - { text: "a rainbow", bin: curve }
                  - { text: "the edge of a ruler", bin: straight }
                  - { text: "a hula hoop", bin: curve }
                  - { text: "the edge of a book", bin: straight }
                hints: ["A curve bends. A straight edge does not."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which letter is made only of line segments?"
                options: ["E", "S", "O"]
                answer: "E"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "How many line segments make this shape?"
                show: { drawn: grid, cols: 6, rows: 6, lines: [[1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 5, 3], [5, 3, 5, 5], [5, 5, 1, 5], [1, 5, 1, 1]] }
                options: ["6", "4", "5"]
                answer: "6"
              - id: l1-n3
                type: true_false
                text: "Is it true? You can measure a line segment with a ruler."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "What does a line segment have?"
                options: ["two end points", "no end points", "one bend"]
                answer: "two end points"
              - id: l1-n5
                type: multiple_choice
                text: "How many squares long is the line segment?"
                show: { drawn: grid, cols: 8, rows: 2, lines: [[0, 1, 7, 1]] }
                options: ["7", "8", "6"]
                answer: "7"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is a line segment?"
            options: ["the edge of a table", "a rainbow", "the letter O"]
            answer: "the edge of a table"
          - id: l1-c2
            type: multiple_choice
            text: "How many squares long is the line segment?"
            show: { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 4, 1]] }
            options: ["3", "4", "2"]
            answer: "3"
          - id: l1-c3
            type: true_false
            text: "Is it true? A curve is a line that bends."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Which of these has no end points?"
            options: ["a straight line in maths", "a line segment", "a side of a triangle"]
            answer: "a straight line in maths"
          - id: l1-c5
            type: multiple_choice
            text: "How many line segments make this shape?"
            show: { drawn: grid, cols: 6, rows: 4, lines: [[1, 1, 5, 1], [5, 1, 5, 3], [5, 3, 1, 3], [1, 3, 1, 1]] }
            options: ["4", "2", "8"]
            answer: "4"
          - id: l1-c6
            type: true_false
            text: "Is it true? The edge of a ruler is a curve."
            answer: false

  - n: 2
    title: { de: Strecken messen, en: Measuring line segments }
    goal:
      de: "Miss Strecken mit dem Lineal in Zentimetern und Millimetern, auch wenn sie nicht bei 0 anfangen."
      en: "Measure line segments with a ruler in centimetres and millimetres, even when they do not start at 0."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which one bends?"
            options: ["a curve", "a line segment"]
            answer: "a curve"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many squares long is the line segment?"
            show: { drawn: grid, cols: 9, rows: 2, lines: [[2, 1, 8, 1]] }
            options: ["6", "7", "8"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6 cm 3 mm"
            say: "Put the zero on the ruler at one end point. Read where the other end point is: six centimetres and three small marks, so six centimetres and three millimetres."
            show: { drawn: ruler, to: 10, length: 6.3 }
          - text: "7 − 2 = 5 cm"
            say: "This line segment does not start at zero. It starts at two and ends at seven. Take the start away from the end: seven take away two is five centimetres."
            show: { drawn: ruler, to: 10, start: 2, length: 5 }
          - text: "58 mm or 6 cm?\n6 cm = 60 mm, so 6 cm is longer."
            say: "Which is longer, fifty-eight millimetres or six centimetres? Change them into the same unit. Six centimetres is sixty millimetres, so six centimetres is longer."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How long is the line segment?"
                show: { drawn: ruler, to: 10, length: 4.8 }
                options: ["4 cm 8 mm", "8 cm 4 mm", "5 cm"]
                answer: "4 cm 8 mm"
                hints:
                  - "The line segment starts at 0."
                  - "It passes 4 cm, then 8 small marks."
                  - "4 cm 8 mm."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How long is the line segment?"
                show: { drawn: ruler, to: 10, start: 1, length: 6 }
                options: ["6 cm", "7 cm", "1 cm"]
                answer: "6 cm"
                feedback:
                  "7 cm": "7 is where it ends. It starts at 1, so 7 − 1 = 6 cm."
                hints:
                  - "Where does the line segment start? It is not at 0."
                  - "It starts at 1 and ends at 7."
                  - "7 − 1 = 6 cm."
              - id: l2-f3
                type: text_input
                text: "How many millimetres long is the line segment?"
                show: { drawn: ruler, to: 10, length: 9.1 }
                answer: "91"
                hints:
                  - "Each whole centimetre is 10 mm."
                  - "9 cm is 90 mm. Then count the small marks after 9."
                  - "90 + 1 = 91 mm."
              - id: l2-f4
                type: multiple_choice
                text: "Which is longer?"
                options: ["58 mm", "6 cm"]
                answer: "6 cm"
                feedback:
                  "58 mm": "6 cm is 60 mm, and 60 mm is more than 58 mm."
                hints:
                  - "Change them into the same unit first."
                  - "6 cm = 60 mm."
                  - "60 mm is longer than 58 mm, so 6 cm is longer."
              - id: l2-f5
                type: multiple_choice
                text: "How long is the line segment?"
                show: { drawn: ruler, to: 10, start: 3, length: 4.5 }
                options: ["4 cm 5 mm", "7 cm 5 mm", "3 cm"]
                answer: "4 cm 5 mm"
                feedback:
                  "7 cm 5 mm": "That is where it ends. It starts at 3, so take 3 cm away."
                hints:
                  - "It starts at 3, not at 0."
                  - "It ends at 7 cm 5 mm. Take away the 3 cm at the start."
                  - "4 cm 5 mm."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How long is the line segment?"
                show: { drawn: ruler, to: 10, length: 2.6 }
                options: ["26 mm", "62 mm", "2 mm"]
                answer: "26 mm"
                hints: ["2 cm is 20 mm. Then count the small marks."]
              - id: l2-s2
                type: multiple_choice
                text: "How long is the line segment?"
                show: { drawn: ruler, to: 10, start: 2, length: 3 }
                options: ["3 cm", "5 cm", "2 cm"]
                answer: "3 cm"
                hints: ["Take the start away from the end."]
              - id: l2-s3
                type: text_input
                text: "How many millimetres long is the line segment?"
                show: { drawn: ruler, to: 10, length: 7.7 }
                answer: "77"
                hints: ["7 cm is 70 mm."]
              - id: l2-s4
                type: true_false
                text: "Is it true? A line segment of 45 mm is longer than one of 5 cm."
                answer: false
                hints: ["5 cm is 50 mm."]
              - id: l2-s5
                type: multiple_choice
                text: "How long is the line segment?"
                show: { drawn: ruler, to: 10, start: 4, length: 2.5 }
                options: ["2 cm 5 mm", "6 cm 5 mm", "4 cm"]
                answer: "2 cm 5 mm"
                hints: ["It starts at 4."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "How many millimetres long is the line segment?"
                show: { drawn: ruler, to: 10, length: 5.4 }
                answer: "54"
              - id: l2-n2
                type: multiple_choice
                text: "How long is the line segment?"
                show: { drawn: ruler, to: 10, start: 1, length: 8 }
                options: ["8 cm", "9 cm", "1 cm"]
                answer: "8 cm"
              - id: l2-n3
                type: multiple_choice
                text: "Which is the longest?"
                options: ["7 cm", "68 mm", "7 cm 2 mm"]
                answer: "7 cm 2 mm"
              - id: l2-n4
                type: text_input
                text: "How many millimetres long is the line segment?"
                show: { drawn: ruler, to: 10, start: 2, length: 3.5 }
                answer: "35"
              - id: l2-n5
                type: multiple_choice
                text: "Line segment A is 6 cm 5 mm long. Line segment B is 62 mm long. Which is longer?"
                options: ["A", "B", "They are the same."]
                answer: "A"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: kinds
            type: multiple_choice
            text: "Which one has two end points?"
            options: ["a line segment", "a straight line that goes on for ever", "a circle"]
            answer: "a line segment"
          - id: l2-c2
            part: kinds
            type: multiple_choice
            text: "Which letter is a curve?"
            options: ["S", "T", "H"]
            answer: "S"
            option_audio: false
          - id: l2-c3
            part: not-zero
            type: multiple_choice
            text: "How long is the line segment?"
            show: { drawn: ruler, to: 10, start: 3, length: 5 }
            options: ["5 cm", "8 cm", "3 cm"]
            answer: "5 cm"
          - id: l2-c4
            part: measure
            type: text_input
            text: "How many millimetres long is the line segment?"
            show: { drawn: ruler, to: 10, length: 6.9 }
            answer: "69"
          - id: l2-c5
            part: compare
            type: multiple_choice
            text: "Which is the longest?"
            options: ["8 cm", "79 mm", "75 mm"]
            answer: "8 cm"
          - id: l2-c6
            part: kinds
            type: true_false
            text: "Is it true? In maths, a straight line goes on for ever in both directions."
            answer: true
          - id: l2-c7
            part: kinds
            type: multiple_choice
            text: "How many line segments can you see?"
            show: { drawn: grid, cols: 7, rows: 5, lines: [[1, 4, 5, 4], [5, 4, 5, 2], [5, 2, 3, 0], [3, 0, 1, 2], [1, 2, 1, 4]] }
            options: ["5", "4", "6"]
            answer: "5"
          - id: l2-c8
            part: kinds
            type: sorting
            text: "Curve or line segment? Sort them."
            bins:
              - { id: curve, show: { text: "curve" }, say: "Curve." }
              - { id: segment, show: { text: "line segment" }, say: "Line segment." }
            options:
              - { text: "the edge of a coin", bin: curve }
              - { text: "one side of a square", bin: segment }
              - { text: "the letter C", bin: curve }
              - { text: "the letter I", bin: segment }
          - id: l2-c9
            part: measure
            type: multiple_choice
            text: "How long is the line segment?"
            show: { drawn: ruler, to: 10, length: 3.4 }
            options: ["3 cm 4 mm", "4 cm 3 mm", "4 cm"]
            answer: "3 cm 4 mm"
          - id: l2-c10
            part: measure
            type: text_input
            text: "How many millimetres long is the line segment?"
            show: { drawn: ruler, to: 10, length: 8.6 }
            answer: "86"
          - id: l2-c11
            part: measure
            type: true_false
            text: "Is it true? The line segment is 5 cm 7 mm long."
            show: { drawn: ruler, to: 10, length: 5.7 }
            answer: true
          - id: l2-c12
            part: measure
            type: multiple_choice
            text: "How long is the line segment?"
            show: { drawn: ruler, to: 10, length: 7.5 }
            options: ["7 cm 5 mm", "75 cm", "8 cm"]
            answer: "7 cm 5 mm"
          - id: l2-c13
            part: not-zero
            type: multiple_choice
            text: "How long is the line segment?"
            show: { drawn: ruler, to: 10, start: 2, length: 7 }
            options: ["7 cm", "9 cm", "2 cm"]
            answer: "7 cm"
          - id: l2-c14
            part: not-zero
            type: text_input
            text: "How many millimetres long is the line segment?"
            show: { drawn: ruler, to: 10, start: 1, length: 4.2 }
            answer: "42"
          - id: l2-c15
            part: not-zero
            type: true_false
            text: "Is it true? The line segment is 8 cm long."
            show: { drawn: ruler, to: 10, start: 2, length: 6 }
            answer: false
          - id: l2-c16
            part: not-zero
            type: multiple_choice
            text: "How long is the line segment?"
            show: { drawn: ruler, to: 10, start: 5, length: 3.5 }
            options: ["3 cm 5 mm", "8 cm 5 mm", "5 cm"]
            answer: "3 cm 5 mm"
          - id: l2-c17
            part: compare
            type: true_false
            text: "Is it true? 9 cm is longer than 92 mm."
            say: "Nine centimetres is longer than ninety-two millimetres. Is that true?"
            answer: false
          - id: l2-c18
            part: compare
            type: ordering
            text: "Put the line segments in order, shortest first."
            options: ["3 cm", "34 mm", "27 mm", "3 cm 2 mm"]
            slot_count: 4
            answer: ["27 mm", "3 cm", "3 cm 2 mm", "34 mm"]
          - id: l2-c19
            part: compare
            type: multiple_choice
            text: "Line segment A is 4 cm 6 mm long. Line segment B is 46 mm long. Which is longer?"
            options: ["A", "B", "They are the same."]
            answer: "They are the same."
          - id: l2-c20
            part: compare
            type: multiple_choice
            text: "Which is the shortest?"
            options: ["51 mm", "5 cm", "5 cm 5 mm"]
            answer: "5 cm"
