# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.time-units
skill: math.time.units
curriculum: en-GB
language: en
title:
  de: Zeiteinheiten
  en: Units of time
summary: >
  Lesson 1 converts between seconds, minutes, hours and days (60 seconds
  in a minute, 60 minutes in an hour, 24 hours in a day) and keeps away
  from counting in hundreds; lesson 2 adds weeks, months and years, the
  days in each month and the leap year, chooses a sensible unit for
  everyday things (a lesson lasts about an hour), and ends with the skill
  check.
metadata:
  year: year-3
  topic: { de: Zeitpunkt und Zeitdauer, en: Time and duration }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.time.durations]
  also_practises: [math.time.durations]
  vocabulary: { en: [second, minute, hour, day, week, month, year, leap year, how long, longer, shorter] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: small, what: { de: "Sekunden, Minuten, Stunden und Tage umrechnen", en: "converting seconds, minutes, hours and days" } }
    - { id: mixed, what: { de: Zeitspannen mit zwei Einheiten angeben, en: giving a duration in two units } }
    - { id: days, what: { de: "Tage, Wochen, Monate und Jahre umrechnen", en: "converting days, weeks, months and years" } }
    - { id: everyday, what: { de: Zeitspannen aus dem Alltag kennen und die passende Einheit wählen, en: knowing everyday durations and choosing the right unit } }
  misconceptions:
    - id: hundred-per-unit
      what: Converts with 100 instead of 60 (1 hour = 100 minutes, 90 minutes is less than an hour)
      addressed: lesson 1 Learn says time does not count in hundreds; l1-f1 and l1-f2 have feedback, l1-f5, l1-n1, l1-n3, l1-c3 and l2-c2 offer the hundreds answer
    - id: unit-sense
      what: Picks a unit that cannot be right for an everyday duration (brushing your teeth takes 2 hours)
      addressed: lesson 2 Learn gives everyday anchors; l2-f2 has feedback, l2-s1, l2-s5, l2-n1, l2-n5 and l2-c5 ask which unit or duration fits
    - id: month-lengths
      what: Thinks every month has 30 or 31 days, or that a year has 52 days
      addressed: lesson 2 Learn says the rhyme and the leap year; l2-f3, l2-s2, l2-s3, l2-n4 and l2-c4
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Sekunden, Minuten, Stunden", en: "Seconds, minutes and hours" }
    goal:
      de: "Rechne Sekunden, Minuten und Stunden um. Eine Stunde hat 60 Minuten, nicht 100, also sind 90 Minuten 1 Stunde und 30 Minuten."
      en: "Change between seconds, minutes and hours. An hour is 60 minutes, not 100, so 90 minutes is 1 hour 30."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "The film starts at 3:00 pm and ends at 4:30 pm. How long is it?"
            options: ["1 hour 30 minutes", "1 hour 3 minutes", "2 hours 30 minutes"]
            answer: "1 hour 30 minutes"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "How many minutes are there in one hour?"
            answer: "60"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Is 1 hour 100 minutes?"
            say: "Lots of things count in tens and hundreds: one hundred pence make a pound, and one hundred centimetres make a metre. Do you think one hour is one hundred minutes? Have a guess."
          - text: "1 minute = 60 seconds\n1 hour = 60 minutes"
            say: "No, it isn't! Time does not count in tens and hundreds like our numbers. One minute is sixty seconds. One hour is sixty minutes."
          - text: "1 day = 24 hours"
            say: "One day, from midnight to midnight, is twenty-four hours. The hour hand goes round the clock twice: twelve hours, then twelve more."
          - text: "2 minutes = 60 + 60 = 120 seconds"
            say: "Two minutes are sixty seconds and sixty seconds more. That is one hundred and twenty seconds."
          - text: "90 minutes = 60 minutes + 30 minutes = 1 hour 30 minutes"
            say: "To turn minutes into hours, take out sixty minutes for each hour. Ninety minutes is sixty minutes and thirty more: one hour and thirty minutes."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many seconds are in 2 minutes?"
                options: ["120", "200", "60"]
                answer: "120"
                feedback:
                  "200": "A minute has 60 seconds, not 100. 60 + 60 = 120."
                hints:
                  - "How many seconds are in one minute?"
                  - "Two minutes are 60 seconds and another 60 seconds."
                  - "60 + 60 = 120 seconds."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "90 minutes is the same as ..."
                options: ["1 hour 30 minutes", "less than 1 hour", "1 hour 10 minutes"]
                answer: "1 hour 30 minutes"
                feedback:
                  "less than 1 hour": "An hour is 60 minutes, so 90 minutes is more than an hour."
                hints:
                  - "How many minutes make 1 hour?"
                  - "Take 60 minutes out of 90. How many are left?"
                  - "60 + 30, so 1 hour 30 minutes."
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap."
                frame: "1 day = _ hours"
                options: ["12", "24", "60", "100"]
                answer: ["24"]
                hints:
                  - "Count the hours from midnight to midnight."
                  - "The hour hand goes round twice in a day: 12 hours, then 12 more."
                  - "12 + 12 = 24 hours."
              - id: l1-f4
                type: text_input
                text: "3 minutes = _ seconds"
                answer: "180"
                hints:
                  - "One minute is 60 seconds."
                  - "Add 60 three times: 60 + 60 + 60."
                  - "180 seconds."
              - id: l1-f5
                type: true_false
                text: "Is it true? 1 hour = 100 minutes."
                answer: false
                hints:
                  - "Think of the minute hand going once round the clock."
                  - "It passes 60 little minute marks in one hour."
                  - "No. 1 hour = 60 minutes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many minutes are in 2 hours?"
                options: ["120", "200", "24"]
                answer: "120"
                hints: ["1 hour is 60 minutes."]
              - id: l1-s2
                type: multiple_choice
                text: "How many hours are in 2 days?"
                options: ["48", "24", "200"]
                answer: "48"
                hints: ["1 day is 24 hours."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill the gaps."
                frame: "75 minutes = _ hour _ minutes"
                options: ["1", "15", "25", "75"]
                answer: ["1", "15"]
                hints: ["Take 60 minutes out for the hour."]
              - id: l1-s4
                type: text_input
                text: "120 seconds = _ minutes"
                answer: "2"
                hints: ["Every 60 seconds make 1 minute."]
              - id: l1-s5
                type: true_false
                text: "Is it true? Half an hour is 30 minutes."
                answer: true
                hints: ["What is half of 60?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is the longest?"
                options: ["100 seconds", "2 minutes", "1 minute"]
                answer: "2 minutes"
              - id: l1-n2
                type: text_input
                text: "4 minutes = _ seconds"
                answer: "240"
              - id: l1-n3
                type: multiple_choice
                text: "1 hour 15 minutes = _ minutes"
                options: ["75", "115", "65"]
                answer: "75"
              - id: l1-n4
                type: text_input
                text: "Tom's bus ride takes 1 hour 20 minutes. How many minutes is that?"
                answer: "80"
              - id: l1-n5
                type: true_false
                text: "Is it true? 3 days = 72 hours."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many seconds are in 1 minute?"
            options: ["60", "100", "10"]
            answer: "60"
          - id: l1-c2
            type: text_input
            text: "2 hours = _ minutes"
            answer: "120"
          - id: l1-c3
            type: multiple_choice
            text: "100 minutes is the same as ..."
            options: ["1 hour 40 minutes", "1 hour", "2 hours"]
            answer: "1 hour 40 minutes"
          - id: l1-c4
            type: true_false
            text: "Is it true? 4 days = 96 hours."
            say: "Is it true? Four days are ninety-six hours."
            answer: true
          - id: l1-c5
            type: fill_in_blank
            text: "Fill the gaps."
            frame: "70 minutes = _ hour _ minutes"
            options: ["1", "10", "7", "70"]
            answer: ["1", "10"]
          - id: l1-c6
            type: multiple_choice
            text: "Which is the shortest?"
            options: ["50 seconds", "1 minute", "2 minutes"]
            answer: "50 seconds"

  - n: 2
    title: { de: "Wochen, Monate, Jahre", en: "Weeks, months and years" }
    goal:
      de: "Lern Wochen, Monate und die Tage im Jahr kennen und wähle die passende Einheit, so wie Zähneputzen dauert etwa 2 Minuten."
      en: "Learn the weeks, months and days in a year, and pick the right unit, like brushing your teeth takes about 2 minutes."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many hours are in 1 day?"
            options: ["24", "12", "60"]
            answer: "24"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "5 minutes = _ seconds"
            answer: "300"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "How many days are in one year?"
            say: "From your birthday to your next birthday is one year. How many days do you think that is? Have a guess."
          - text: "1 week = 7 days\n1 year = 12 months"
            say: "Let's find out. One week is seven days, Monday to Sunday. One year is twelve months, January to December."
          - text: "1 year = 365 days\n1 leap year = 366 days"
            say: "A year has three hundred and sixty-five days. Every four years there is a leap year. February gets an extra day, the twenty-ninth, so a leap year has three hundred and sixty-six days."
          - text: "30 days: September, April, June, November\nFebruary: 28 days, 29 in a leap year\nAll the others: 31 days"
            say: "Thirty days has September, April, June and November. All the rest have thirty-one, except February alone, which has twenty-eight days clear, and twenty-nine in each leap year."
          - text: "Did you know? July is named after Julius Caesar, and August after Augustus."
            say: "Did you know? Two months are named after Roman rulers. July is named after Julius Caesar, and August is named after the emperor Augustus."
          - text: "Brushing your teeth: about 2 minutes\nA lesson: about 1 hour\nThe summer holiday: about 6 weeks"
            say: "Pick the unit that fits. Brushing your teeth takes about two minutes. A lesson lasts about an hour. The summer holiday lasts about six weeks."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many days are in 2 weeks?"
                options: ["14", "12", "20"]
                answer: "14"
                hints:
                  - "How many days are in one week?"
                  - "Two weeks are 7 days and 7 more days."
                  - "7 + 7 = 14 days."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which unit fits? Brushing your teeth takes about 2 _."
                options: ["seconds", "minutes", "hours"]
                answer: "minutes"
                feedback:
                  "hours": "2 hours is longer than a film. Your teeth would be very shiny, and very tired! Brushing is much quicker than that."
                  "seconds": "2 seconds is only one quick swish. Brushing takes longer."
                hints:
                  - "Think about how long you brush in the morning."
                  - "It is longer than a clap and much shorter than a lesson."
                  - "About 2 minutes."
              - id: l2-f3
                type: multiple_choice
                text: "How many days are there in April?"
                options: ["30", "31", "28"]
                answer: "30"
                hints:
                  - "Say the rhyme about the months."
                  - "Thirty days has September, April, June and November."
                  - "April has 30 days."
              - id: l2-f4
                type: fill_in_blank
                text: "Fill the gaps."
                frame: "1 year = _ months = _ days"
                options: ["12", "52", "100", "365"]
                answer: ["12", "365"]
                hints:
                  - "Count the months from January to December."
                  - "12 months. A year that is not a leap year has three hundred and sixty-five days."
                  - "12 months, 365 days."
              - id: l2-f5
                type: text_input
                text: "Mia's holiday lasts 3 weeks. How many days is that?"
                answer: "21"
                hints:
                  - "One week is 7 days."
                  - "Add 7 three times: 7 + 7 + 7."
                  - "21 days."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which unit fits? A school day lasts about 6 _."
                options: ["seconds", "hours", "days"]
                answer: "hours"
                hints: ["School starts in the morning and ends in the afternoon."]
              - id: l2-s2
                type: multiple_choice
                text: "Which month has 31 days?"
                options: ["June", "July", "September"]
                answer: "July"
                hints: ["Thirty days has September, April, June and November."]
              - id: l2-s3
                type: true_false
                text: "Is it true? February has 29 days in a leap year."
                answer: true
                hints: ["A leap year gets one extra day."]
              - id: l2-s4
                type: text_input
                text: "1 week and 3 days = _ days"
                answer: "10"
                hints: ["1 week is 7 days."]
              - id: l2-s5
                type: multiple_choice
                text: "Which takes about one second?"
                options: ["clapping your hands once", "eating your lunch", "walking to school"]
                answer: "clapping your hands once"
                hints: ["One second is very short."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which unit fits? The Christmas holidays last about 2 _."
                options: ["days", "weeks", "months"]
                answer: "weeks"
              - id: l2-n2
                type: text_input
                text: "Grandma stays with us for 4 weeks. How many days is that?"
                answer: "28"
              - id: l2-n3
                type: multiple_choice
                text: "Sam holds his breath for 70 seconds, Leo for 1 minute and Ava for 50 seconds. Who holds it the longest?"
                options: ["Sam", "Leo", "Ava"]
                answer: "Sam"
              - id: l2-n4
                type: true_false
                text: "Is it true? A year has 52 days."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Which takes about an hour?"
                options: ["a maths lesson", "a sneeze", "a night's sleep"]
                answer: "a maths lesson"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: small
            type: multiple_choice
            text: "How many minutes are in 3 hours?"
            options: ["180", "300", "36"]
            answer: "180"
          - id: l2-c2
            part: mixed
            type: multiple_choice
            text: "80 minutes is the same as ..."
            options: ["1 hour 20 minutes", "8 hours", "less than 1 hour"]
            answer: "1 hour 20 minutes"
          - id: l2-c3
            part: days
            type: text_input
            text: "How many days are in 5 weeks?"
            answer: "35"
          - id: l2-c4
            part: days
            type: multiple_choice
            text: "How many days are there in November?"
            options: ["30", "31", "28"]
            answer: "30"
          - id: l2-c5
            part: everyday
            type: multiple_choice
            text: "Which unit fits? A football match lasts about 90 _."
            options: ["seconds", "minutes", "hours"]
            answer: "minutes"
          - id: l2-c6
            part: small
            type: text_input
            text: "6 minutes = _ seconds"
            say: "Six minutes are how many seconds?"
            answer: "360"
          - id: l2-c7
            part: small
            type: multiple_choice
            text: "Half a day is _ hours."
            options: ["12", "50", "6"]
            answer: "12"
          - id: l2-c8
            part: small
            type: true_false
            text: "Is it true? 200 seconds = 2 minutes."
            say: "Is it true? Two hundred seconds are two minutes."
            answer: false
          - id: l2-c9
            part: small
            type: text_input
            text: "240 minutes = _ hours"
            say: "Two hundred and forty minutes are how many hours?"
            answer: "4"
          - id: l2-c10
            part: mixed
            type: fill_in_blank
            text: "Fill the gaps."
            frame: "95 minutes = _ hour _ minutes"
            options: ["1", "35", "45", "95"]
            answer: ["1", "35"]
          - id: l2-c11
            part: mixed
            type: text_input
            text: "2 hours 10 minutes = _ minutes"
            say: "Two hours and ten minutes are how many minutes?"
            answer: "130"
          - id: l2-c12
            part: mixed
            type: multiple_choice
            text: "Which is the same as 150 seconds?"
            options: ["2 minutes 30 seconds", "1 minute 50 seconds", "15 minutes"]
            answer: "2 minutes 30 seconds"
          - id: l2-c13
            part: mixed
            type: multiple_choice
            text: "Which is longer: 1 hour 25 minutes or 80 minutes?"
            options: ["1 hour 25 minutes", "80 minutes", "They are the same."]
            answer: "1 hour 25 minutes"
          - id: l2-c14
            part: days
            type: multiple_choice
            text: "How many days are there in a leap year?"
            options: ["366", "365", "400"]
            answer: "366"
          - id: l2-c15
            part: days
            type: text_input
            text: "2 years = _ months"
            say: "Two years are how many months?"
            answer: "24"
          - id: l2-c16
            part: days
            type: true_false
            text: "Is it true? December has 31 days."
            answer: true
          - id: l2-c17
            part: everyday
            type: multiple_choice
            text: "Which unit fits? Tying your shoelaces takes about 10 _."
            options: ["seconds", "minutes", "hours"]
            answer: "seconds"
          - id: l2-c18
            part: everyday
            type: multiple_choice
            text: "Which lasts about a week?"
            options: ["the half-term holiday", "a sneeze", "a school lesson"]
            answer: "the half-term holiday"
          - id: l2-c19
            part: everyday
            type: multiple_choice
            text: "A child sleeps through the night. About how long is that?"
            options: ["10 hours", "10 minutes", "10 days"]
            answer: "10 hours"
          - id: l2-c20
            part: everyday
            type: true_false
            text: "Is it true? A school lesson lasts about 1 minute."
            answer: false
