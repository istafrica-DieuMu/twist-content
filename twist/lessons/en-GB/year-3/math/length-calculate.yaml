# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.length-calculate
skill: math.length.calculate
curriculum: en-GB
language: en
title:
  de: Mit Längen rechnen
  en: Calculating with lengths
summary: >
  Lesson 1 adds and subtracts lengths in cm and in m and cm, and always
  says the unit (45 cm + 38 cm = 83 cm; 1 m 20 cm + 50 cm = 1 m 70 cm),
  using 1 m = 100 cm to cross a metre; lesson 2 solves length problems
  (how much longer, how much is left, how far to go) and ends with the
  skill check.
metadata:
  year: year-3
  topic: { de: Längen, en: Length }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.length.cm-m, math.add-sub-to-100.sub-two-digit]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.complement, math.word-problems.question-calc-answer]
  vocabulary: { en: [centimetre, metre, cm, m, altogether, longer than, shorter than, difference, left] }
  forms: [text, audio]
  drawn: []
  facets: [units]
  misconceptions:
    - id: units-dropped
      what: Adds the numbers and leaves out or mixes the units (1 m + 20 cm = 21 cm)
      addressed: lesson 1 Learn always says the unit and changes 1 m to 100 cm; l1-f4, l1-s4 and l1-n4 add m and cm and offer an option that mixes the units, with feedback in l1-f4
    - id: difference-is-sum
      what: Adds the two lengths when asked how much longer one is
      addressed: lesson 2 Learn compares two lengths by subtracting; l2-f2, l2-s2, l2-n2 and l2-c2 ask how much longer, taller or further and offer the sum, with feedback in l2-f2
    - id: metre-as-ten
      what: Does not change 1 m into 100 cm before taking centimetres away from it, so cannot work out 1 m − 45 cm
      addressed: lesson 1 Learn writes 1 m as 100 cm before subtracting; l1-f5, l1-s5 and l1-n5 take cm away from a whole metre
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Längen addieren und subtrahieren", en: "Adding and subtracting lengths" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1 m = _ cm"
            say: "How many centimetres make one metre?"
            options: ["10", "100", "1000"]
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "82 − 35 = _"
            answer: "47"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "45 cm + 38 cm = 83 cm"
            say: "You add lengths just like numbers. Forty-five centimetres add thirty-eight centimetres is eighty-three centimetres. Always write the unit in your answer."
          - text: "1 m 20 cm + 50 cm = 1 m 70 cm"
            say: "When there are metres and centimetres, add the centimetres to the centimetres. One metre twenty add fifty centimetres is one metre seventy."
          - text: "1 m − 30 cm = 100 cm − 30 cm = 70 cm"
            say: "To take centimetres away from a metre, change the metre into one hundred centimetres first. One hundred centimetres take away thirty is seventy centimetres."
          - text: "60 cm + 40 cm = 100 cm = 1 m"
            say: "When the centimetres reach one hundred, you have made a whole metre. Sixty centimetres add forty centimetres is one metre."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "36 cm + 42 cm = _"
                options: ["78 cm", "78 m", "68 cm"]
                answer: "78 cm"
                hints:
                  - "Add the numbers and keep the unit."
                  - "36 + 42: 30 + 40 = 70 and 6 + 2 = 8."
                  - "78 cm."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "95 cm − 48 cm = _ cm"
                answer: "47"
                hints:
                  - "Take away the tens, then the ones."
                  - "95 − 40 = 55. Then take away 8."
                  - "55 − 8 = 47 cm."
              - id: l1-f3
                type: multiple_choice
                text: "75 cm + 25 cm = _"
                options: ["1 m", "100 m", "10 cm"]
                answer: "1 m"
                hints:
                  - "Add the centimetres first."
                  - "75 + 25 = 100. How many cm are in 1 m?"
                  - "100 cm = 1 m."
              - id: l1-f4
                type: multiple_choice
                text: "2 m + 35 cm = _"
                options: ["2 m 35 cm", "37 cm", "37 m"]
                answer: "2 m 35 cm"
                feedback:
                  "37 cm": "2 m is 200 cm, not 2 cm. Metres and centimetres are different units."
                  "37 m": "2 m and 35 cm cannot simply be added: 35 cm is less than one metre."
                hints:
                  - "Metres and centimetres are different units."
                  - "Keep the 2 m and put the 35 cm beside it."
                  - "2 m 35 cm."
              - id: l1-f5
                type: text_input
                text: "1 m − 45 cm = _ cm"
                answer: "55"
                hints:
                  - "Change 1 m into centimetres first."
                  - "1 m = 100 cm. Now work out 100 − 45."
                  - "100 cm − 45 cm = 55 cm."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "54 cm + 29 cm = _"
                options: ["83 cm", "73 cm", "83 m"]
                answer: "83 cm"
                hints: ["54 + 20 = 74, then add 9."]
              - id: l1-s2
                type: text_input
                text: "80 cm − 36 cm = _ cm"
                answer: "44"
                hints: ["80 − 30 = 50, then take away 6."]
              - id: l1-s3
                type: multiple_choice
                text: "1 m 40 cm + 30 cm = _"
                options: ["1 m 70 cm", "1 m 43 cm", "4 m 30 cm"]
                answer: "1 m 70 cm"
                hints: ["Add the centimetres to the centimetres."]
              - id: l1-s4
                type: multiple_choice
                text: "3 m + 60 cm = _"
                options: ["3 m 60 cm", "63 cm", "9 m"]
                answer: "3 m 60 cm"
                hints: ["Metres and centimetres stay separate."]
              - id: l1-s5
                type: text_input
                text: "1 m − 15 cm = _ cm"
                answer: "85"
                hints: ["1 m is 100 cm."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "63 cm + 37 cm = _"
                options: ["1 m", "90 cm", "10 m"]
                answer: "1 m"
              - id: l1-n2
                type: text_input
                text: "72 cm − 27 cm = _ cm"
                answer: "45"
              - id: l1-n3
                type: multiple_choice
                text: "2 m 50 cm − 20 cm = _"
                options: ["2 m 30 cm", "30 cm", "2 m 48 cm"]
                answer: "2 m 30 cm"
              - id: l1-n4
                type: multiple_choice
                text: "1 m + 8 cm = _"
                options: ["1 m 8 cm", "9 cm", "18 cm"]
                answer: "1 m 8 cm"
              - id: l1-n5
                type: text_input
                text: "1 m − 62 cm = _ cm"
                answer: "38"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "47 cm + 35 cm = _"
            options: ["82 cm", "72 cm", "82 m"]
            answer: "82 cm"
          - id: l1-c2
            type: text_input
            text: "1 m − 25 cm = _ cm"
            answer: "75"
          - id: l1-c3
            type: multiple_choice
            text: "1 m 10 cm + 60 cm = _"
            options: ["1 m 70 cm", "1 m 16 cm", "7 m 10 cm"]
            answer: "1 m 70 cm"

  - n: 2
    title: { de: "Sachaufgaben mit Längen", en: "Length problems" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "1 m − 40 cm = _ cm"
            answer: "60"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "38 cm + 50 cm = _"
            options: ["88 cm", "83 cm", "88 m"]
            answer: "88 cm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tom jumps 85 cm. Leah jumps 1 m. How much further does Leah jump?"
            say: "Tom jumps eighty-five centimetres. Leah jumps one metre. How much further does Leah jump?"
          - text: "1 m = 100 cm\n100 cm − 85 cm = 15 cm"
            say: "To compare, find the difference. Change one metre into one hundred centimetres. One hundred take away eighty-five is fifteen. Leah jumps fifteen centimetres further."
          - text: "How much longer? How much further? How much taller? → subtract"
            say: "How much longer, how much further, how much taller: these questions ask for the difference, so you subtract. Altogether means you add."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "One plank is 65 cm long. Another is 48 cm long. How long are they altogether?"
                options: ["113 cm", "17 cm", "103 cm"]
                answer: "113 cm"
                hints:
                  - "Altogether means you add."
                  - "65 + 48: 65 + 40 = 105, then add 8."
                  - "113 cm, which is 1 m 13 cm."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Mia's scarf is 92 cm long. Ben's scarf is 75 cm long. How much longer is Mia's scarf?"
                options: ["17 cm", "167 cm", "23 cm"]
                answer: "17 cm"
                feedback:
                  "167 cm": "That is both scarves together. How much longer asks for the difference, so subtract."
                hints:
                  - "How much longer means find the difference."
                  - "92 − 75. Count on from 75 to 92."
                  - "75 + 5 = 80 and 80 + 12 = 92, so 17 cm."
              - id: l2-f3
                type: text_input
                text: "A rope is 1 m long. Lily cuts off 35 cm. How many centimetres are left?"
                answer: "65"
                hints:
                  - "Change 1 m into centimetres."
                  - "100 cm − 35 cm."
                  - "65 cm."
              - id: l2-f4
                type: multiple_choice
                text: "Ali is 1 m 25 cm tall. His dad is 60 cm taller. How tall is his dad?"
                options: ["1 m 85 cm", "65 cm", "1 m 31 cm"]
                answer: "1 m 85 cm"
                hints:
                  - "Taller means more, so add."
                  - "Add the 60 cm to the 25 cm."
                  - "1 m 85 cm."
              - id: l2-f5
                type: true_false
                text: "A tower of blocks is 70 cm tall. Is it true that it needs 30 cm more to be 1 m tall?"
                answer: true
                hints:
                  - "How far is 70 from 100?"
                  - "70 + 30 = 100."
                  - "Yes, 30 cm more makes 1 m."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "One ribbon is 58 cm long. Another is 34 cm long. How long are they altogether?"
                options: ["92 cm", "24 cm", "82 cm"]
                answer: "92 cm"
                hints: ["Altogether: add."]
              - id: l2-s2
                type: multiple_choice
                text: "Tom's train track is 96 cm long. Paul's is 59 cm long. How much longer is Tom's track?"
                options: ["37 cm", "155 cm", "43 cm"]
                answer: "37 cm"
                hints: ["How much longer: subtract."]
              - id: l2-s3
                type: text_input
                text: "A pole is 1 m long. Dad saws off 48 cm. How many centimetres are left?"
                answer: "52"
                hints: ["1 m is 100 cm."]
              - id: l2-s4
                type: multiple_choice
                text: "Ella jumps 1 m 10 cm. Sam jumps 25 cm further. How far does Sam jump?"
                options: ["1 m 35 cm", "1 m 85 cm", "35 cm"]
                answer: "1 m 35 cm"
                hints: ["Further means more: add 25 cm to the centimetres."]
              - id: l2-s5
                type: true_false
                text: "A plant is 85 cm tall. Is it true that it needs 25 cm more to be 1 m tall?"
                answer: false
                hints: ["85 + 25 is more than 100."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "A piece of fabric is 46 cm long. Another is 27 cm long. How many centimetres is that altogether?"
                answer: "73"
              - id: l2-n2
                type: multiple_choice
                text: "The table is 74 cm high. The stool is 45 cm high. How much higher is the table?"
                options: ["29 cm", "119 cm", "31 cm"]
                answer: "29 cm"
              - id: l2-n3
                type: text_input
                text: "A ribbon is 1 m long. Mum cuts off 72 cm. How many centimetres are left?"
                answer: "28"
              - id: l2-n4
                type: multiple_choice
                text: "Josh is 1 m 30 cm tall. His sister is 15 cm shorter. How tall is she?"
                options: ["1 m 15 cm", "1 m 45 cm", "15 cm"]
                answer: "1 m 15 cm"
              - id: l2-n5
                type: text_input
                text: "A snail has crawled 64 cm along a 1 m path. How many more centimetres must it crawl to reach the end?"
                answer: "36"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "48 cm + 37 cm = _"
            options: ["85 cm", "75 cm", "85 m"]
            answer: "85 cm"
          - id: l2-c2
            type: multiple_choice
            text: "Lucy's doll is 42 cm tall. Ava's doll is 28 cm tall. How much taller is Lucy's doll?"
            options: ["14 cm", "70 cm", "16 cm"]
            answer: "14 cm"
          - id: l2-c3
            type: text_input
            text: "A string is 1 m long. Tom cuts off 55 cm. How many centimetres are left?"
            answer: "45"
          - id: l2-c4
            type: multiple_choice
            text: "1 m + 40 cm = _"
            options: ["1 m 40 cm", "41 cm", "5 m"]
            answer: "1 m 40 cm"
          - id: l2-c5
            type: true_false
            text: "A child jumps 90 cm. Is it true that the jump is 10 cm short of 1 m?"
            answer: true
