# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.number-puzzles-to-1000
skill: math.numbers-to-1000.number-puzzles
curriculum: en-GB
language: en
title:
  de: Zahlenrätsel bis 1000
  en: Number riddles to 1000
summary: >
  "I am thinking of a number" riddles about place value to 1000, and digit
  card problems (the greatest number you can make with 4, 7 and 2).
  Lesson 1 solves riddles and digit card problems; lesson 2 checks whether
  a riddle has exactly one answer and builds the clues for a number, and
  ends with the skill check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value]
  also_practises: [math.numbers-to-1000.order-compare, math.numbers-to-1000.round]
  vocabulary: { en: [riddle, clue, hundreds digit, tens digit, ones digit, digit cards, only one answer] }
  forms: [text, audio, drawn]
  drawn: [place-value-chart, table]
  facets: []
  parts:
    - { id: digits, what: { de: Rätsel mit Hinweisen zu den Ziffern lösen, en: solving riddles with clues about the digits } }
    - { id: relations, what: { de: "Rätsel mit mehr, weniger, Runden und Ziffernkarten lösen", en: "solving riddles with more, less, rounding and digit cards" } }
    - { id: unique, what: { de: "prüfen, ob ein Rätsel nur eine Lösung hat", en: checking whether a riddle has only one answer } }
    - { id: make, what: { de: Hinweise für ein Rätsel zu einer Zahl finden, en: finding the clues for a riddle about a number } }
  misconceptions:
    - id: one-clue
      what: Picks the first number that fits one clue
      addressed: wrong options fit some clues but not all; full-stage feedback names the broken clue
    - id: greatest-from-cards
      what: Puts the digit cards in the order given instead of largest first
      addressed: lesson 1 Learn shows the largest digit going in the hundreds place
    - id: many-answers
      what: Writes a riddle that many numbers fit
      addressed: lesson 2 asks whether a riddle has only one answer and which clue would make it so
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Rätsel lösen, en: Solving riddles }
    goal:
      de: "Löse Zahlenrätsel Hinweis für Hinweis und lege die größte Zahl aus Karten, so wie 742 aus 4, 7 und 2."
      en: "Solve number riddles clue by clue, and make the biggest number from cards, like 742 from 4, 7 and 2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Round 347 to the nearest 100."
            options: ["300", "350", "400"]
            answer: "300"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is the 8 in 586 worth?"
            options: ["8", "80", "800"]
            answer: "80"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Guess my number! It has 3 digits."
            say: "I'm thinking of a number with three digits. Can you guess it? Have a go. Tricky, isn't it? There are nine hundred three-digit numbers! Clues will help."
          - text: "Clue 1: My hundreds digit is 6."
            say: "Here is a riddle with three clues. Clue one: my hundreds digit is six. Put it in the chart."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [6, null, null] }
          - text: "Clue 2: My tens digit is half my hundreds digit."
            say: "Clue two: my tens digit is half my hundreds digit. Half of six is three."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [6, 3, null] }
          - text: "Clue 3: My ones digit is 0. → 630\nDigit cards 4, 7, 2 → 742"
            say: "Clue three: my ones digit is zero, so I am six hundred and thirty. Now a digit card problem: the greatest number you can make with four, seven and two. Put the largest digit in the hundreds: seven hundred and forty-two."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [7, 4, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "My hundreds digit is 4, my tens digit is 0 and my ones digit is 7. What am I?"
                options: ["47", "407", "470"]
                answer: "407"
                hints:
                  - "Put each digit in its column."
                  - "H: 4, T: 0, O: 7."
                  - "The number is 407."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "I am between 500 and 600. My tens digit is 9. My ones digit is 1. What am I?"
                options: ["591", "519", "691"]
                answer: "591"
                feedback:
                  "691": "691 has the right tens and ones, but it is not between 500 and 600."
                hints:
                  - "Between 500 and 600: the hundreds digit is 5."
                  - "5 hundreds, 9 tens, 1 one."
                  - "The number is 591."
              - id: l1-f3
                type: multiple_choice
                text: "What is the greatest number you can make with the digit cards 3, 8 and 5?"
                options: ["358", "853", "835"]
                answer: "853"
                feedback:
                  "835": "Close. Put the next largest digit, 5, in the tens."
                hints:
                  - "Put the largest digit in the hundreds."
                  - "8 in the hundreds, then 5, then 3."
                  - "853."
              - id: l1-f4
                type: text_input
                text: "I am 10 more than 395. What am I?"
                answer: "405"
                hints:
                  - "10 more: one more ten."
                  - "395 and 10 crosses a hundred."
                  - "It is 405."
              - id: l1-f5
                type: multiple_choice
                text: "Rounded to the nearest 100 I am 300. My tens digit is 6. My ones digit is 2. What am I?"
                options: ["262", "362", "326"]
                answer: "262"
                feedback:
                  "362": "362 has the right tens and ones, but it rounds to 400."
                hints:
                  - "Which numbers round to 300? From 250 to 349."
                  - "A tens digit of 6 only fits with 2 hundreds: 26_."
                  - "The number is 262."
              - id: l1-f6
                type: multiple_choice
                text: "What is the smallest number you can make with the digit cards 6, 1 and 9?"
                options: ["169", "196", "619"]
                answer: "169"
                hints:
                  - "Put the smallest digit in the hundreds."
                  - "1 in the hundreds, then 6, then 9."
                  - "169."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "My hundreds digit is 8, my tens digit is 5 and my ones digit is 0. What am I?"
                options: ["805", "850", "85"]
                answer: "850"
                hints: ["H: 8, T: 5, O: 0."]
              - id: l1-s2
                type: text_input
                text: "I am between 200 and 300. My tens digit is 4. My ones digit is 4. What am I?"
                answer: "244"
                hints: ["Hundreds digit 2."]
              - id: l1-s3
                type: multiple_choice
                text: "What is the greatest number you can make with the digit cards 2, 0 and 7?"
                options: ["720", "702", "270"]
                answer: "720"
                hints: ["Largest digit first."]
              - id: l1-s4
                type: multiple_choice
                text: "My ones digit is 3 more than my tens digit. I am between 120 and 130. What am I?"
                options: ["125", "124", "128"]
                answer: "125"
                hints: ["Tens digit 2, ones digit 2 + 3."]
              - id: l1-s5
                type: text_input
                text: "I am 100 less than 1000. What am I?"
                answer: "900"
                hints: ["One hundred less."]
              - id: l1-s6
                type: multiple_choice
                text: "What is the smallest three-digit number?"
                options: ["100", "101", "111", "007, like the spy"]
                answer: "100"
                feedback:
                  "007, like the spy": "Nice try, Agent! 007 is really just 7. A three-digit number cannot start with 0."
                hints: ["Three digits, as small as possible."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "My hundreds digit is 3, my tens digit is 0 and my ones digit is 9. What am I?"
                options: ["390", "309", "39"]
                answer: "309"
              - id: l1-n2
                type: multiple_choice
                text: "I am between 900 and 1000. My tens digit is 1. My ones digit is 8. What am I?"
                options: ["918", "981", "818"]
                answer: "918"
              - id: l1-n3
                type: text_input
                text: "I am 1 less than 600. What am I?"
                answer: "599"
              - id: l1-n4
                type: multiple_choice
                text: "All my digits are the same. Rounded to the nearest 100 I am 200. What am I?"
                options: ["111", "222", "333"]
                answer: "222"
              - id: l1-n5
                type: multiple_choice
                text: "What is the smallest number you can make with the digit cards 5, 0 and 4, if the hundreds digit cannot be 0?"
                options: ["405", "045", "450"]
                answer: "405"
              - id: l1-n6
                type: multiple_choice
                text: "What is the smallest three-digit number with all different digits?"
                options: ["100", "102", "123"]
                answer: "102"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "My hundreds digit is 7, my tens digit is 2 and my ones digit is 0. What am I?"
            options: ["702", "720", "72"]
            answer: "720"
          - id: l1-c2
            type: multiple_choice
            text: "What is the greatest number you can make with the digit cards 1, 6 and 4?"
            options: ["641", "614", "461"]
            answer: "641"
          - id: l1-c3
            type: text_input
            text: "I am 10 less than 500. What am I?"
            answer: "490"
          - id: l1-c4
            type: multiple_choice
            text: "I am between 600 and 700. My tens digit is 2. My ones digit is 5. What am I?"
            options: ["625", "652", "725"]
            answer: "625"
          - id: l1-c5
            type: multiple_choice
            text: "What is the smallest number you can make with the digit cards 7, 3 and 9?"
            options: ["379", "397", "739"]
            answer: "379"
          - id: l1-c6
            type: text_input
            text: "I am 1 more than 299. What am I?"
            answer: "300"

  - n: 2
    title: { de: Rätsel prüfen und erfinden, en: Checking and making riddles }
    goal:
      de: "Prüf, ob ein Rätsel nur eine Lösung hat, und schreib Hinweise für deine eigene Zahl, so wie 736."
      en: "Check if a riddle has just one answer, and write clues for your own number, like 736."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "I am between 300 and 400. My tens digit is 8. My ones digit is 2. What am I?"
            options: ["382", "328", "482"]
            answer: "382"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "I am 100 more than 450. What am I?"
            answer: "550"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I am between 400 and 500. Who am I? Guess!"
            say: "Isla made up a riddle: I am between four hundred and five hundred. Who am I? Have a guess. Do you think there is only one answer?"
          - text: "I am between 400 and 500."
            say: "Lots of numbers fit: four hundred and twelve, four hundred and eighty, and more. The riddle does not have only one answer."
          - text: "+ My tens digit is 0. My ones digit is 5."
            say: "With two more clues only one number is left: four hundred and five. Now the riddle has exactly one answer."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [4, 0, 5] }
          - text: "A riddle for 736"
            say: "To make up a riddle, pick a number, like seven hundred and thirty-six. Give a clue for every place: I am between seven hundred and eight hundred. My tens digit is three. My ones digit is double my tens digit."
          - text: "Did you know? In a magic square from ancient China, every row, column and diagonal adds up to 15."
            say: "Did you know? There is a famous number puzzle from ancient China called the Lo Shu square. It holds the numbers one to nine. Add any row, any column or either diagonal, and you always get fifteen. Try it!"
            show: { drawn: table, header: false, rows: [[4, 9, 2], [3, 5, 7], [8, 1, 6]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Does this riddle have only one answer? I am even and I am between 200 and 300."
                answer: false
                hints:
                  - "Find two numbers that fit."
                  - "202 and 204 both fit."
                  - "No, many numbers fit."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Does this riddle have only one answer? My hundreds digit is 5, my tens digit is 5 and my ones digit is 1."
                answer: true
                hints:
                  - "Every place has a clue."
                  - "Only 551 fits."
                  - "Yes, only one answer."
              - id: l2-f3
                type: multiple_choice
                text: "Which clue gives this riddle only one answer? I am between 800 and 900. My ones digit is 0."
                options: ["I am even.", "My tens digit is 4.", "I am greater than 800."]
                answer: "My tens digit is 4."
                hints:
                  - "Which place has no clue yet?"
                  - "The tens digit is missing."
                  - "With a tens digit of 4, only 840 fits."
              - id: l2-f4
                type: fill_in_blank
                text: "Finish the riddle for 263."
                frame: "My hundreds digit is _. My tens digit is _. My ones digit is _."
                options: ["2", "3", "6", "26"]
                answer: ["2", "6", "3"]
                hints:
                  - "Put 263 in a place value chart."
                  - "H: 2, T: 6, O: 3."
                  - "2, 6, 3."
              - id: l2-f5
                type: multiple_choice
                text: "Which riddle fits 909?"
                options: ["All my digits are 9.", "My hundreds and ones digits are 9, my tens digit is 0.", "I am between 800 and 900."]
                answer: "My hundreds and ones digits are 9, my tens digit is 0."
                hints:
                  - "Check each riddle with 909."
                  - "909 has a 0 in the tens."
                  - "Hundreds and ones digits 9, tens digit 0."
              - id: l2-f6
                type: multiple_choice
                text: "I am a multiple of 100. Rounded to the nearest 100 I stay the same. I am greater than 600 and less than 800. What am I?"
                options: ["650", "700", "750"]
                answer: "700"
                hints:
                  - "A multiple of 100 ends in 00."
                  - "Between 600 and 800 there is only one."
                  - "700."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Does this riddle have only one answer? My tens digit is 7."
                answer: false
                hints: ["Find two numbers that fit."]
              - id: l2-s2
                type: multiple_choice
                text: "Which clue gives this riddle only one answer? My hundreds digit is 3. My tens digit is 3."
                options: ["My ones digit is 3.", "I am odd.", "I am less than 400."]
                answer: "My ones digit is 3."
                hints: ["Which place is missing?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Finish the riddle for 518."
                frame: "My hundreds digit is _. My tens digit is _. My ones digit is _."
                options: ["1", "5", "8", "51"]
                answer: ["5", "1", "8"]
                hints: ["H: 5, T: 1, O: 8."]
              - id: l2-s4
                type: multiple_choice
                text: "Which riddle fits 440?"
                options: ["My hundreds and tens digits are the same, and my ones digit is 0.", "All my digits are the same.", "I am odd."]
                answer: "My hundreds and tens digits are the same, and my ones digit is 0."
                hints: ["Check with 440."]
              - id: l2-s5
                type: multiple_choice
                text: "I am 1 more than the greatest two-digit number. What am I?"
                options: ["99", "100", "101"]
                answer: "100"
                hints: ["The greatest two-digit number is 99."]
              - id: l2-s6
                type: true_false
                text: "Does this riddle have only one answer? I am between 670 and 680 and my ones digit is 4."
                answer: true
                hints: ["Between 670 and 680 with 4 ones: which?"]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Does this riddle have only one answer? I am odd and I am between 100 and 200."
                answer: false
              - id: l2-n2
                type: multiple_choice
                text: "Which clue gives this riddle only one answer? I am between 900 and 1000. My tens digit is 5."
                options: ["My ones digit is 2.", "I am even.", "I am greater than 950."]
                answer: "My ones digit is 2."
              - id: l2-n3
                type: fill_in_blank
                text: "Finish the riddle for 607."
                frame: "My hundreds digit is _. My tens digit is _. My ones digit is _."
                options: ["0", "6", "7", "67"]
                answer: ["6", "0", "7"]
              - id: l2-n4
                type: multiple_choice
                text: "Which riddle fits 123?"
                options: ["Each digit is 1 more than the one before.", "All my digits are the same.", "I am even."]
                answer: "Each digit is 1 more than the one before."
              - id: l2-n5
                type: multiple_choice
                text: "I am 1 less than the smallest four-digit number. What am I?"
                options: ["999", "1000", "1001"]
                answer: "999"
              - id: l2-n6
                type: true_false
                text: "Does this riddle have only one answer? My hundreds digit is 2 and my ones digit is 9."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: digits
            type: multiple_choice
            text: "My hundreds digit is 5, my tens digit is 0 and my ones digit is 4. What am I?"
            options: ["540", "504", "54"]
            answer: "504"
          - id: l2-c2
            part: relations
            type: multiple_choice
            text: "What is the greatest number you can make with the digit cards 9, 3 and 6?"
            options: ["963", "936", "693"]
            answer: "963"
          - id: l2-c3
            part: relations
            type: text_input
            text: "I am 10 more than 690. What am I?"
            answer: "700"
          - id: l2-c4
            part: unique
            type: true_false
            text: "Does this riddle have only one answer? I am a multiple of ten between 300 and 400."
            answer: false
          - id: l2-c5
            part: unique
            type: multiple_choice
            text: "Which clue gives this riddle only one answer? My hundreds digit is 7. My ones digit is 1."
            options: ["My tens digit is 4.", "I am odd.", "I am less than 800."]
            answer: "My tens digit is 4."
          - id: l2-c6
            part: digits
            type: multiple_choice
            text: "I am between 700 and 800. My tens digit is 0. My ones digit is 6. What am I?"
            options: ["706", "760", "806"]
            answer: "706"
          - id: l2-c7
            part: digits
            type: text_input
            text: "My hundreds digit is 9, my tens digit is 4 and my ones digit is 0. What am I?"
            answer: "940"
          - id: l2-c8
            part: digits
            type: multiple_choice
            text: "My hundreds digit is 2. My tens digit is double my hundreds digit. My ones digit is 1. What am I?"
            options: ["241", "221", "421"]
            answer: "241"
          - id: l2-c9
            part: digits
            type: multiple_choice
            text: "I am between 380 and 390. My ones digit is 5 less than my tens digit. What am I?"
            options: ["383", "388", "338"]
            answer: "383"
          - id: l2-c10
            part: relations
            type: multiple_choice
            text: "What is the smallest number you can make with the digit cards 8, 2 and 5?"
            options: ["258", "285", "528"]
            answer: "258"
          - id: l2-c11
            part: relations
            type: text_input
            text: "I am 100 more than 875. What am I?"
            answer: "975"
          - id: l2-c12
            part: relations
            type: multiple_choice
            text: "Rounded to the nearest 10 I am 450. My ones digit is 3. What am I?"
            options: ["443", "453", "463"]
            answer: "453"
          - id: l2-c13
            part: unique
            type: true_false
            text: "Does this riddle have only one answer? I am 1 less than 400."
            answer: true
          - id: l2-c14
            part: unique
            type: true_false
            text: "Does this riddle have only one answer? My hundreds digit is 6 and I am odd."
            answer: false
          - id: l2-c15
            part: unique
            type: multiple_choice
            text: "Which riddle has only one answer?"
            options: ["I am between 500 and 600.", "I am 10 more than 250.", "My tens digit is 2."]
            answer: "I am 10 more than 250."
          - id: l2-c16
            part: make
            type: fill_in_blank
            text: "Finish the riddle for 482."
            frame: "I am between _ and 500. My tens digit is _. My ones digit is _."
            options: ["400", "8", "2", "4"]
            answer: ["400", "8", "2"]
          - id: l2-c17
            part: make
            type: multiple_choice
            text: "Which riddle fits 350?"
            options: ["I am between 300 and 400. My tens digit is 5 and my ones digit is 0.", "I am between 400 and 500.", "My ones digit is 5."]
            answer: "I am between 300 and 400. My tens digit is 5 and my ones digit is 0."
          - id: l2-c18
            part: make
            type: true_false
            text: "Ravi makes a riddle for 291: My hundreds digit is 2. My tens digit is 9. My ones digit is 2. Does his riddle fit 291?"
            answer: false
          - id: l2-c19
            part: make
            type: multiple_choice
            text: "Which clue is true for 604?"
            options: ["My tens digit is 0.", "My ones digit is 6.", "I am between 500 and 600."]
            answer: "My tens digit is 0."
          - id: l2-c20
            part: make
            type: fill_in_blank
            text: "Finish the riddle for 830."
            frame: "I am 10 more than _. My hundreds digit is _."
            options: ["820", "840", "8", "3"]
            answer: ["820", "8"]
