# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.round-to-1000
skill: math.numbers-to-1000.round
curriculum: en-GB
language: en
title:
  de: Runden auf Zehner und Hunderter
  en: Rounding to the nearest 10 and 100
summary: >
  Rounding finds the nearest multiple of 10 or 100, using the multiples
  either side from the last skill. Lesson 1 rounds to the nearest 10;
  lesson 2 rounds to the nearest 100, with the rule that halfway rounds
  up, and uses rounding to estimate a total in pounds. Ends with the skill
  check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.order-compare]
  also_practises: [math.numbers-to-1000.number-line]
  vocabulary: { en: [round, nearest, round up, round down, estimate, halfway] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: [currency]
  parts:
    - { id: tens, what: { de: Zahlen bis 1000 auf Zehner runden, en: rounding numbers to 1000 to the nearest 10 } }
    - { id: hundreds, what: { de: Zahlen bis 1000 auf Hunderter runden, en: rounding numbers to 1000 to the nearest 100 } }
    - { id: reverse, what: { de: "Zahlen finden, die gerundet eine bestimmte Zahl ergeben", en: finding numbers that round to a given number } }
    - { id: estimate, what: { de: durch Runden einen Gesamtpreis überschlagen, en: estimating a total by rounding } }
  misconceptions:
    - id: round-down-always
      what: Always cuts off the ones (rounds 47 to 40)
      addressed: Learn shows the distance to both multiples on the number line; full-stage feedback says which is nearer
    - id: halfway
      what: Does not know what to do with 5 or 50
      addressed: Learn states that halfway rounds up; every stage has a halfway number
    - id: wrong-digit
      what: Looks at the ones digit when rounding to the nearest 100 (rounds 246 to 300)
      addressed: lesson 2 Learn names the deciding digit; tasks round one number both ways
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Auf Zehner runden, en: Rounding to the nearest 10 }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Which multiples of ten are either side of 47?"
            frame: "_, 47, _"
            options: ["40", "46", "48", "50"]
            answer: ["40", "50"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which multiple of ten is 83 nearer to?"
            options: ["80", "90"]
            answer: "80"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "47 → 50"
            say: "To round to the nearest ten, find the multiple of ten that is closest. Forty-seven is between forty and fifty. Fifty is only three away, so forty-seven rounds to fifty."
            show: { drawn: number-line, from: 40, to: 50, labels: ends, mark: 47 }
          - text: "342 → 340"
            say: "Three hundred and forty-two is between three hundred and forty and three hundred and fifty. Three hundred and forty is closer, so we round down."
            show: { drawn: number-line, from: 340, to: 350, labels: ends, mark: 342 }
          - text: "65 → 70"
            say: "What about exactly halfway, with five ones? We round up. Sixty-five rounds to seventy. The ones digit decides: zero to four round down, five to nine round up."
            show: { drawn: number-line, from: 60, to: 70, labels: ends, mark: 65 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Round 38 to the nearest 10."
                show: { drawn: number-line, from: 30, to: 40, labels: ends, mark: 38 }
                options: ["30", "40", "38"]
                answer: "40"
                feedback:
                  "30": "38 is nearer to 40. It is only 2 away from 40."
                hints:
                  - "Which multiples of ten are either side of 38?"
                  - "30 and 40. Which is nearer?"
                  - "40 is nearer. 38 rounds to 40."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Round 71 to the nearest 10."
                show: { drawn: number-line, from: 70, to: 80, labels: ends, mark: 71 }
                options: ["70", "80", "100"]
                answer: "70"
                hints:
                  - "The ones digit is 1."
                  - "0 to 4 round down."
                  - "71 rounds to 70."
              - id: l1-f3
                type: multiple_choice
                text: "Round 255 to the nearest 10."
                show: { drawn: number-line, from: 250, to: 260, labels: ends, mark: 255 }
                options: ["250", "260", "300"]
                answer: "260"
                hints:
                  - "255 is exactly halfway."
                  - "Halfway rounds up."
                  - "255 rounds to 260."
              - id: l1-f4
                type: text_input
                text: "Round 486 to the nearest 10."
                answer: "490"
                hints:
                  - "The multiples of ten either side are 480 and 490."
                  - "The ones digit is 6: round up."
                  - "486 rounds to 490."
              - id: l1-f5
                type: true_false
                text: "Is it true? 723 rounded to the nearest 10 is 730."
                answer: false
                hints:
                  - "Which digit decides?"
                  - "The ones digit 3: round down."
                  - "No, 723 rounds to 720."
              - id: l1-f6
                type: multiple_choice
                text: "Which number rounds to 60 when rounded to the nearest 10?"
                options: ["54", "57", "65"]
                answer: "57"
                hints:
                  - "Which number has 60 as its nearest ten?"
                  - "54 rounds to 50, 65 rounds to 70."
                  - "57 rounds to 60."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Round 92 to the nearest 10."
                options: ["90", "100", "92"]
                answer: "90"
                hints: ["The ones digit is 2."]
              - id: l1-s2
                type: multiple_choice
                text: "Round 415 to the nearest 10."
                options: ["410", "420", "400"]
                answer: "420"
                hints: ["Halfway rounds up."]
              - id: l1-s3
                type: text_input
                text: "Round 639 to the nearest 10."
                answer: "640"
                hints: ["The ones digit is 9."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 804 rounded to the nearest 10 is 800."
                answer: true
                hints: ["The ones digit is 4."]
              - id: l1-s5
                type: multiple_choice
                text: "Which number rounds to 300 when rounded to the nearest 10?"
                options: ["296", "305", "289"]
                answer: "296"
                hints: ["The multiples of ten either side of 296 are 290 and 300."]
              - id: l1-s6
                type: text_input
                text: "Round 148 to the nearest 10."
                answer: "150"
                hints: ["Round up or down?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Round 26 to the nearest 10."
                options: ["20", "30", "26"]
                answer: "30"
              - id: l1-n2
                type: text_input
                text: "Round 563 to the nearest 10."
                answer: "560"
              - id: l1-n3
                type: multiple_choice
                text: "Round 745 to the nearest 10."
                options: ["740", "750", "700"]
                answer: "750"
              - id: l1-n4
                type: true_false
                text: "Is it true? 997 rounded to the nearest 10 is 1000."
                answer: true
              - id: l1-n5
                type: text_input
                text: "Round 311 to the nearest 10."
                answer: "310"
              - id: l1-n6
                type: multiple_choice
                text: "Which number rounds to 450 when rounded to the nearest 10?"
                options: ["444", "455", "453"]
                answer: "453"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Round 67 to the nearest 10."
            options: ["60", "70", "67"]
            answer: "70"
          - id: l1-c2
            type: text_input
            text: "Round 432 to the nearest 10."
            answer: "430"
          - id: l1-c3
            type: multiple_choice
            text: "Round 885 to the nearest 10."
            options: ["880", "890", "900"]
            answer: "890"
          - id: l1-c4
            type: multiple_choice
            text: "Round 44 to the nearest 10."
            options: ["40", "50", "44"]
            answer: "40"
          - id: l1-c5
            type: true_false
            text: "Is it true? 175 rounded to the nearest 10 is 180."
            answer: true
          - id: l1-c6
            type: text_input
            text: "Round 598 to the nearest 10."
            answer: "600"

  - n: 2
    title: { de: Auf Hunderter runden, en: Rounding to the nearest 100 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Round 54 to the nearest 10."
            options: ["50", "60", "54"]
            answer: "50"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Round 275 to the nearest 10."
            answer: "280"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "380 → 400"
            say: "Rounding to the nearest hundred: three hundred and eighty is between three hundred and four hundred, and nearer to four hundred."
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends, mark: 380 }
          - text: "The tens digit decides"
            say: "When you round to the nearest hundred, the tens digit decides: zero to four round down, five to nine round up. In three hundred and eighty it is eight, so round up."
          - text: "£38 + £11 ≈ £40 + £10"
            say: "Rounding helps you estimate. A coat costs thirty-eight pounds and a hat eleven pounds. Round each to the nearest ten pounds: forty and ten. That is about fifty pounds."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Round 620 to the nearest 100."
                show: { drawn: number-line, from: 600, to: 700, step: 10, labels: ends, mark: 620 }
                options: ["600", "700", "620"]
                answer: "600"
                hints:
                  - "Which hundreds are either side of 620?"
                  - "600 and 700. 620 is nearer to 600."
                  - "620 rounds to 600."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Round 471 to the nearest 100."
                show: { drawn: number-line, from: 400, to: 500, step: 10, labels: ends, mark: 471 }
                options: ["400", "500", "470"]
                answer: "500"
                feedback:
                  "470": "That is the nearest 10. For the nearest 100, the tens digit decides."
                hints:
                  - "The tens digit decides."
                  - "It is 7: round up."
                  - "471 rounds to 500."
              - id: l2-f3
                type: multiple_choice
                text: "Round 850 to the nearest 100."
                options: ["800", "900", "850"]
                answer: "900"
                hints:
                  - "850 is exactly halfway."
                  - "Tens digit 5: round up."
                  - "850 rounds to 900."
              - id: l2-f4
                type: fill_in_blank
                text: "Round 738."
                frame: "nearest 10: _   nearest 100: _"
                options: ["700", "730", "740", "800"]
                answer: ["740", "700"]
                hints:
                  - "For the nearest 10, the ones digit 8 decides."
                  - "For the nearest 100, the tens digit 3 decides."
                  - "740 and 700."
              - id: l2-f5
                type: multiple_choice
                text: "A scarf costs £18 and a pair of gloves £13. About how much is that altogether?"
                options: ["about £20", "about £30", "about £40"]
                answer: "about £30"
                hints:
                  - "Round each price to the nearest 10."
                  - "£18 is about £20, £13 is about £10."
                  - "About £30."
              - id: l2-f6
                type: text_input
                text: "Round 962 to the nearest 100."
                answer: "1000"
                hints:
                  - "The hundreds either side are 900 and 1000."
                  - "Tens digit 6: round up."
                  - "962 rounds to 1000."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Round 330 to the nearest 100."
                options: ["300", "400", "330"]
                answer: "300"
                hints: ["The tens digit is 3."]
              - id: l2-s2
                type: multiple_choice
                text: "Round 581 to the nearest 100."
                options: ["500", "600", "580"]
                answer: "600"
                hints: ["The tens digit is 8."]
              - id: l2-s3
                type: fill_in_blank
                text: "Round 254."
                frame: "nearest 10: _   nearest 100: _"
                options: ["200", "250", "260", "300"]
                answer: ["250", "300"]
                hints: ["First the ones digit, then the tens digit."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 750 rounded to the nearest 100 is 800."
                answer: true
                hints: ["Exactly halfway."]
              - id: l2-s5
                type: multiple_choice
                text: "A game costs £29 and a book £22. About how much is that altogether?"
                options: ["about £40", "about £50", "about £60"]
                answer: "about £50"
                hints: ["£29 is about £30, £22 is about £20."]
              - id: l2-s6
                type: multiple_choice
                text: "Which number rounds to 700 when rounded to the nearest 100?"
                options: ["640", "680", "750"]
                answer: "680"
                hints: ["The hundreds either side of 680 are 600 and 700."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Round 219 to the nearest 100."
                options: ["200", "300", "220"]
                answer: "200"
              - id: l2-n2
                type: text_input
                text: "Round 666 to the nearest 100."
                answer: "700"
              - id: l2-n3
                type: fill_in_blank
                text: "Round 395."
                frame: "nearest 10: _   nearest 100: _"
                options: ["300", "390", "400", "490"]
                answer: ["400", "400"]
              - id: l2-n4
                type: true_false
                text: "Is it true? 550 rounded to the nearest 100 is 500."
                answer: false
              - id: l2-n5
                type: text_input
                text: "Round 77 to the nearest 100."
                answer: "100"
              - id: l2-n6
                type: multiple_choice
                text: "Which number rounds to 900 when rounded to the nearest 100?"
                options: ["840", "870", "950"]
                answer: "870"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: tens
            type: multiple_choice
            text: "Round 83 to the nearest 10."
            options: ["80", "90", "100"]
            answer: "80"
          - id: l2-c2
            part: tens
            type: text_input
            text: "Round 645 to the nearest 10."
            answer: "650"
          - id: l2-c3
            part: hundreds
            type: multiple_choice
            text: "Round 360 to the nearest 100."
            options: ["300", "400", "360"]
            answer: "400"
          - id: l2-c4
            part: hundreds
            type: fill_in_blank
            text: "Round 512."
            frame: "nearest 10: _   nearest 100: _"
            options: ["500", "510", "520", "600"]
            answer: ["510", "500"]
          - id: l2-c5
            part: estimate
            type: multiple_choice
            text: "A bike light costs £17 and a bell £24. About how much is that altogether?"
            options: ["about £30", "about £40", "about £50"]
            answer: "about £40"
          - id: l2-c6
            part: tens
            type: multiple_choice
            text: "Round 19 to the nearest 10."
            options: ["10", "20", "19"]
            answer: "20"
          - id: l2-c7
            part: tens
            type: true_false
            text: "Is it true? 365 rounded to the nearest 10 is 360."
            answer: false
          - id: l2-c8
            part: tens
            type: text_input
            text: "Round 708 to the nearest 10."
            answer: "710"
          - id: l2-c9
            part: hundreds
            type: text_input
            text: "Round 149 to the nearest 100."
            answer: "100"
          - id: l2-c10
            part: hundreds
            type: multiple_choice
            text: "Round 450 to the nearest 100."
            options: ["400", "500", "450"]
            answer: "500"
          - id: l2-c11
            part: hundreds
            type: true_false
            text: "Is it true? 246 rounded to the nearest 100 is 300."
            answer: false
          - id: l2-c12
            part: reverse
            type: multiple_choice
            text: "Which number rounds to 80 when rounded to the nearest 10?"
            options: ["74", "76", "86"]
            answer: "76"
          - id: l2-c13
            part: reverse
            type: multiple_choice
            text: "Which number rounds to 500 when rounded to the nearest 100?"
            options: ["438", "549", "561"]
            answer: "549"
          - id: l2-c14
            part: reverse
            type: true_false
            text: "Is it true? Every number from 135 to 144 rounds to 140 when rounded to the nearest 10."
            answer: true
          - id: l2-c15
            part: reverse
            type: multiple_choice
            text: "Which number rounds to 200 when rounded to the nearest 100?"
            options: ["149", "182", "250"]
            answer: "182"
          - id: l2-c16
            part: reverse
            type: multiple_choice
            text: "Which number does not round to 300 when rounded to the nearest 100?"
            options: ["251", "349", "352"]
            answer: "352"
          - id: l2-c17
            part: estimate
            type: multiple_choice
            text: "A jumper costs £42 and a pair of jeans £27. About how much is that altogether?"
            options: ["about £60", "about £70", "about £80"]
            answer: "about £70"
          - id: l2-c18
            part: estimate
            type: text_input
            text: "A book costs £14 and a pen £6. Round each price to the nearest £10, then add. About how many pounds is that?"
            answer: "20"
          - id: l2-c19
            part: estimate
            type: true_false
            text: "A lunchbox costs £11 and a water bottle £9. Is it true that they cost about £20 altogether?"
            answer: true
          - id: l2-c20
            part: estimate
            type: multiple_choice
            text: "A family pays £48 for zoo tickets and £33 for lunch. About how much do they pay altogether?"
            options: ["about £70", "about £80", "about £90"]
            answer: "about £80"
