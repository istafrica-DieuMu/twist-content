# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.write-stories
skill: math.word-problems.write-stories
curriculum: en-GB
language: en
title:
  de: Rechengeschichten erfinden
  en: Making up number stories
summary: >
  Lesson 1 picks and builds stories that fit an addition or a subtraction
  (for 140 − 35: a shop has 140 pencils and sells 35); lesson 2 builds a
  story from its three parts (the start, what happens, the question) for a
  multiplication, a division or a picture, spots stories that do not fit,
  and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.word-problems.question-calc-answer]
  also_practises: [math.mult-div.mult-meaning, math.mult-div.div-meaning]
  vocabulary: { en: [number story, calculation, add, take away, share equally, groups of, each] }
  forms: [drawn, text, audio]
  drawn: [dots, coins]
  facets: [currency]
  misconceptions:
    - id: numbers-fit-action-not
      what: Accepts a story with the right numbers but the wrong action (for 140 − 35, a story where 35 more arrive)
      addressed: lesson 1 Learn checks the action as well as the numbers; l1-f1, l1-s1, l1-n1 and l1-c1 offer a story with the right numbers and the wrong action, with feedback in l1-f1; l1-f4, l1-s4 and l2-n4 ask whether such a story fits
    - id: story-without-question
      what: Writes a story that ends without a question, so there is nothing to work out
      addressed: lesson 2 Learn names the three parts; l2-f2, l2-s2 and l2-n2 ask what the story still needs, with feedback in l2-f2
    - id: groups-as-add
      what: Tells a multiplication story as an addition of the two numbers (3 × 5 as 3 sweets and 5 more)
      addressed: lesson 2 Learn says times means equal groups; l2-f1 has feedback on the adding story; l2-s1 and l2-n1 offer one
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Geschichten zu Plus und Minus", en: "Stories for adding and subtracting" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "There are 60 people on the train. 25 get off. Which calculation fits?"
            options: ["60 − 25", "60 + 25", "25 − 60"]
            answer: "60 − 25"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "60 − 25 = _"
            answer: "35"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "140 − 35"
            say: "You can make up your own story for a calculation. Here is one hundred and forty take away thirty-five."
          - text: "A shop has 140 pencils. It sells 35. How many pencils are left?"
            say: "A shop has one hundred and forty pencils. It sells thirty-five. How many pencils are left? The story starts with one hundred and forty, and thirty-five go away. That fits take away."
          - text: "A shop has 140 pencils. 35 more are delivered. ✗"
            say: "This story has the same numbers, but thirty-five more pencils arrive. That is adding, so it does not fit. Check the numbers, and check what happens to them."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which story fits 80 − 45?"
                options: ["Sam has 80p. He spends 45p on a drink.", "Sam has 80p. Gran gives him 45p.", "Sam has 45p. He spends 8p."]
                answer: "Sam has 80p. He spends 45p on a drink."
                feedback:
                  "Sam has 80p. Gran gives him 45p.": "The numbers are right, but Sam gets more money. That is adding, not taking away."
                hints:
                  - "Take away means there is less at the end."
                  - "Sam must start with 80p and lose or spend 45p."
                  - "Sam has 80p. He spends 45p on a drink."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which story fits 125 + 40?"
                options: ["A farm has 125 hens. The farmer buys 40 more.", "A farm has 125 hens. A fox takes 40.", "A farm has 40 hens and 12 ducks."]
                answer: "A farm has 125 hens. The farmer buys 40 more."
                hints:
                  - "Adding means there are more at the end."
                  - "Start with 125 and get 40 more."
                  - "The farmer buys 40 more."
              - id: l1-f3
                type: ordering
                text: "Build a story for 56 + 27. Put the sentences in order."
                options: ["How many children are in the hall now?", "There are 56 children in the hall.", "27 more children come in."]
                slot_count: 3
                answer: ["There are 56 children in the hall.", "27 more children come in.", "How many children are in the hall now?"]
                option_audio: false
                hints:
                  - "A story has a start, something that happens and a question."
                  - "The start says what is there before anything happens."
                  - "56 children, then 27 more come in, then the question."
              - id: l1-f4
                type: true_false
                text: "Does this story fit 200 − 50? A car park has 200 spaces. 50 more cars drive in."
                answer: false
                hints:
                  - "Does the number in the story go up or down?"
                  - "Cars driving in make more, so that is adding."
                  - "No, it does not fit 200 − 50."
              - id: l1-f5
                type: multiple_choice
                text: "Which calculation fits this story? Mum has 72 eggs. She uses 6 eggs to bake a cake."
                options: ["72 − 6", "72 + 6", "72 − 60"]
                answer: "72 − 6"
                hints:
                  - "Does Mum have more or fewer eggs afterwards?"
                  - "She uses 6, so there are 6 fewer."
                  - "72 − 6."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which story fits 150 + 30?"
                options: ["Tim has £150. He is given £30.", "Tim has £150. He spends £30.", "Tim has £30. He is given £15."]
                answer: "Tim has £150. He is given £30."
                hints: ["Adding means there is more at the end."]
              - id: l1-s2
                type: ordering
                text: "Build a story for 90 − 35. Put the sentences in order."
                options: ["The class uses 35 of them.", "How many crayons are left in the box?", "A box holds 90 crayons."]
                slot_count: 3
                answer: ["A box holds 90 crayons.", "The class uses 35 of them.", "How many crayons are left in the box?"]
                option_audio: false
                hints: ["The start, what happens, the question."]
              - id: l1-s3
                type: multiple_choice
                text: "Which calculation fits this story? A jar has 84 marbles. Paul puts in 9 more."
                options: ["84 + 9", "84 − 9", "84 + 90"]
                answer: "84 + 9"
                hints: ["Putting in more makes the number bigger."]
              - id: l1-s4
                type: true_false
                text: "Does this story fit 300 − 120? A plane has 300 seats. 120 seats are empty. How many people are on board?"
                answer: true
                hints: ["Take the empty seats away from all the seats."]
              - id: l1-s5
                type: multiple_choice
                text: "Which story fits 65 + 18?"
                options: ["Lily has read 65 pages. Today she reads 18 more.", "Lily has 65 pages to read. She reads 18.", "Lily reads 18 pages, then 6 more."]
                answer: "Lily has read 65 pages. Today she reads 18 more."
                hints: ["Which story puts 65 and 18 together?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which story fits 400 − 150?"
                options: ["A school has 400 balls. 150 go to the other site.", "A school has 400 balls. It buys 150 more.", "A school has 150 balls and 4 nets."]
                answer: "A school has 400 balls. 150 go to the other site."
              - id: l1-n2
                type: ordering
                text: "Build a story for 48 + 35. Put the sentences in order."
                options: ["How many stickers has Noor got now?", "Noor has 48 stickers.", "Her friend gives her 35 stickers."]
                slot_count: 3
                answer: ["Noor has 48 stickers.", "Her friend gives her 35 stickers.", "How many stickers has Noor got now?"]
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Which calculation fits this story? There are 63 apples on the tree. 17 fall off."
                options: ["63 − 17", "63 + 17", "17 − 63"]
                answer: "63 − 17"
              - id: l1-n4
                type: true_false
                text: "Does this story fit 75 + 25? Jo has 75p. She finds 25p in her coat."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which story fits 250 − 90?"
                options: ["A bottle holds 250 ml of juice. Max drinks 90 ml.", "A bottle holds 250 ml. Max pours in 90 ml more.", "A bottle holds 90 ml. Max drinks 25 ml."]
                answer: "A bottle holds 250 ml of juice. Max drinks 90 ml."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which story fits 70 − 28?"
            options: ["There are 70 children at the party. 28 go home.", "There are 70 children at the party. 28 more arrive.", "There are 28 children and 7 adults."]
            answer: "There are 70 children at the party. 28 go home."
          - id: l1-c2
            type: true_false
            text: "Does this story fit 36 + 14? Ali has 36 cards. He wins 14 more."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Which calculation fits this story? There are 95 plums in the bowl. The family eats 22."
            options: ["95 − 22", "95 + 22", "22 − 95"]
            answer: "95 − 22"

  - n: 2
    title: { de: "Geschichten zu Mal, Geteilt und Bildern", en: "Stories for times, divide and pictures" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which story fits 50 + 30?"
            options: ["A tin has 50 biscuits. Dad adds 30 more.", "A tin has 50 biscuits. Dad eats 30.", "A tin has 30 biscuits and 5 cakes."]
            answer: "A tin has 50 biscuits. Dad adds 30 more."
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "4 × 5 = _"
            say: "Four times five."
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The start, what happens, the question"
            say: "A number story has three parts. The start says what is there. Then something happens. At the end there is a question. Without a question, there is nothing to work out."
          - text: "3 × 5: Tom has 3 bags. There are 5 sweets in each bag. How many sweets are there altogether?"
            say: "For three times five: Tom has three bags with five sweets in each bag. How many sweets are there altogether? Times means equal groups: three groups of five."
            show: { drawn: dots, array: [3, 5] }
          - text: "12 ÷ 4: 12 biscuits are shared equally between 4 children. How many does each child get?"
            say: "For twelve divided by four: twelve biscuits are shared equally between four children. How many does each child get? Divide means sharing equally, or making equal groups."
          - text: "A picture can start a story too."
            say: "A picture can start a story too. Look at what is there, think of something that happens, then ask a question."
            show: { drawn: coins, values: [50, 20, 20] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which story fits 4 × 3?"
                options: ["There are 4 tables. 3 children sit at each table.", "There are 4 children and 3 more come.", "There are 4 tables. 3 tables are taken away."]
                answer: "There are 4 tables. 3 children sit at each table."
                feedback:
                  "There are 4 children and 3 more come.": "That is 4 + 3. Times needs equal groups: 4 groups of 3."
                hints:
                  - "Times means equal groups."
                  - "Look for 4 groups with 3 in each."
                  - "4 tables with 3 children at each."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tim has 5 boxes. There are 4 balls in each box. What does the story still need?"
                options: ["a question", "a start", "another number"]
                answer: "a question"
                feedback:
                  "another number": "Both numbers are there: 5 boxes and 4 balls in each. Without a question there is nothing to work out."
                hints:
                  - "Look for the three parts: the start, what happens, the question."
                  - "There is no question mark yet."
                  - "A question, for example: How many balls are there?"
              - id: l2-f3
                type: multiple_choice
                text: "Which story fits 24 ÷ 4?"
                options: ["24 stickers are shared equally between 4 friends.", "There are 24 stickers. 4 more are bought.", "There are 4 sheets with 24 stickers on each."]
                answer: "24 stickers are shared equally between 4 friends."
                hints:
                  - "Divide means sharing equally."
                  - "24 things shared into 4 equal groups."
                  - "24 stickers shared between 4 friends."
              - id: l2-f4
                type: ordering
                text: "Build a story for 3 × 8. Put the sentences in order."
                options: ["Each of them has 8 legs.", "3 spiders sit on the wall.", "How many legs are there altogether?"]
                slot_count: 3
                answer: ["3 spiders sit on the wall.", "Each of them has 8 legs.", "How many legs are there altogether?"]
                option_audio: false
                hints:
                  - "The start, what happens, the question."
                  - "First say how many spiders there are. \"Each of them\" needs something before it."
                  - "3 spiders, then 8 legs each, then the question."
              - id: l2-f5
                type: multiple_choice
                text: "Which story fits the picture?"
                show: { drawn: dots, array: [2, 6] }
                options: ["Eggs come in boxes of 6. Mum buys 2 boxes. How many eggs?", "Mum has 6 eggs and buys 2 more. How many eggs?", "Mum has 6 eggs and uses 2. How many are left?"]
                answer: "Eggs come in boxes of 6. Mum buys 2 boxes. How many eggs?"
                hints:
                  - "Count the rows and the dots in each row."
                  - "2 rows of 6: 2 equal groups."
                  - "2 boxes of 6 eggs."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which story fits 5 × 10?"
                options: ["There are 5 packs of 10 pens.", "There are 5 pens and 10 pencils.", "There are 10 pens. 5 are lost."]
                answer: "There are 5 packs of 10 pens."
                hints: ["Equal groups: 5 groups of 10."]
              - id: l2-s2
                type: multiple_choice
                text: "30 cherries are shared equally between 3 bowls. What does the story still need?"
                options: ["a question", "a start", "a number of bowls"]
                answer: "a question"
                hints: ["Is there anything to work out yet?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which story fits 18 ÷ 3?"
                options: ["18 children get into 3 equal teams.", "18 children play and 3 more join.", "There are 3 teams of 18 children."]
                answer: "18 children get into 3 equal teams."
                hints: ["Divide: 18 shared into 3 equal groups."]
              - id: l2-s4
                type: ordering
                text: "Build a story for 40 ÷ 5. Put the sentences in order."
                options: ["They are put into 5 equal rows.", "How many chairs are in each row?", "There are 40 chairs in the hall."]
                slot_count: 3
                answer: ["There are 40 chairs in the hall.", "They are put into 5 equal rows.", "How many chairs are in each row?"]
                option_audio: false
                hints: ["The start, what happens, the question."]
              - id: l2-s5
                type: multiple_choice
                text: "Which story fits the picture?"
                show: { drawn: coins, values: [50, 20, 20] }
                options: ["Ella has these coins. She spends 40p. How much is left?", "Ella has 3 coins of 50p. How much is that?", "Ella has 20p. She finds 50p. How much now?"]
                answer: "Ella has these coins. She spends 40p. How much is left?"
                hints: ["Look at the coins. Which story talks about what you can see?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which story fits 6 × 2?"
                options: ["6 children each have 2 gloves.", "6 children play and 2 go home.", "6 children and 2 teachers walk to the park."]
                answer: "6 children each have 2 gloves."
              - id: l2-n2
                type: multiple_choice
                text: "A table has 4 legs. There are 3 tables in the room. What does the story still need?"
                options: ["a question", "a start", "how many legs a table has"]
                answer: "a question"
              - id: l2-n3
                type: multiple_choice
                text: "Which story fits 32 ÷ 8?"
                options: ["32 pencils are packed into pots of 8.", "There are 8 pots with 32 pencils in each.", "There are 32 pencils. 8 break."]
                answer: "32 pencils are packed into pots of 8."
              - id: l2-n4
                type: true_false
                text: "Does this story fit 5 × 3? There are 5 horses in the stable. 3 run away."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Which story fits the picture?"
                show: { drawn: dots, array: [4, 5] }
                options: ["A garden has 4 rows with 5 plants in each row. How many plants?", "A garden has 4 plants and 5 more are planted. How many plants?", "A garden has 5 plants and 4 die. How many are left?"]
                answer: "A garden has 4 rows with 5 plants in each row. How many plants?"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which story fits 180 − 60?"
            options: ["A baker makes 180 rolls. He sells 60.", "A baker makes 180 rolls. He makes 60 more.", "A baker makes 60 rolls and 18 cakes."]
            answer: "A baker makes 180 rolls. He sells 60."
          - id: l2-c2
            type: multiple_choice
            text: "Which story fits 7 × 4?"
            options: ["There are 7 cars with 4 wheels each.", "There are 7 cars and 4 vans.", "There are 7 cars. 4 drive away."]
            answer: "There are 7 cars with 4 wheels each."
          - id: l2-c3
            type: multiple_choice
            text: "Which story fits 20 ÷ 5?"
            options: ["20 sweets are shared equally between 5 children.", "There are 5 bags with 20 sweets each.", "There are 20 sweets. 5 are eaten."]
            answer: "20 sweets are shared equally between 5 children."
          - id: l2-c4
            type: ordering
            text: "Build a story for 64 + 20. Put the sentences in order."
            options: ["How many people are on the bus now?", "A bus has 64 people on board.", "At the next stop 20 people get on."]
            slot_count: 3
            answer: ["A bus has 64 people on board.", "At the next stop 20 people get on.", "How many people are on the bus now?"]
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Does this story fit 3 × 6? There are 3 plates with 6 cakes on each. How many cakes are there?"
            answer: true
