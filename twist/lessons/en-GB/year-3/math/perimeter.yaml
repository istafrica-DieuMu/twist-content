# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.perimeter
skill: math.area-volume.perimeter
curriculum: en-GB
language: en
title:
  de: Umfang
  en: Perimeter
summary: >
  Lesson 1 learns that the perimeter is the distance all the way round
  the edge and finds it for shapes on 1 cm squared paper, rectangles,
  squares and triangles (6 cm and 2 cm: 6 + 2 + 6 + 2 = 16 cm), keeping it
  apart from the number of squares inside; lesson 2 uses it in problems
  (a fence, a frame, a lap of the field), works back from the perimeter
  of a square to a side, decides whether a job needs the perimeter or the
  area, and ends with the skill check. Measuring the sides of a drawn
  shape with a ruler waits for a measuring task on a drawn shape.
metadata:
  year: year-3
  topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.calculate, math.shapes.properties]
  also_practises: [math.length.calculate]
  vocabulary: { en: [perimeter, area, side, length, width, edge, all the way round, fence, border] }
  forms: [text, audio, drawn]
  drawn: [grid, shape]
  facets: [units]
  misconceptions:
    - id: adds-two-sides
      what: Adds one length and one width (6 + 2 = 8) instead of all four sides
      addressed: lesson 1 Learn adds all four sides; l1-f1 and l1-f2 have feedback, l1-c1, l2-f1 and l2-n5 offer one length plus one width; l2-f2 has feedback on half the perimeter for a square side
    - id: area-for-perimeter
      what: Counts the squares inside (the area) when asked for the perimeter, or multiplies the sides
      addressed: lesson 1 Learn counts 12 squares and a 14 cm edge on the same rectangle; l1-f1 has feedback, l1-s3, l1-s5, l1-n4, l2-f1 and l2-c1 offer the number of squares; l2-s4 compares two shapes with the same area
    - id: which-measure
      what: Chooses the perimeter for covering a surface, or the area for going round the edge
      addressed: lesson 2 Learn screen 4; l2-f3, l2-f5 (with feedback), l2-s3, l2-s5, l2-n2 and l2-c5
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Rundherum messen, en: All the way round }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "15 cm + 8 cm = _ cm"
            answer: "23"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many sides does a rectangle have?"
            show: { drawn: shape, kind: rectangle }
            options: ["4", "2", "6"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The perimeter is the distance all the way round the edge."
            say: "Run your finger all the way round the edge of the shape. That distance is the perimeter. On this squared paper, each square is one centimetre wide."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue], [4, 3, blue]] }
          - text: "4 + 3 + 4 + 3 = 14 cm"
            say: "Count the edges: four along the top, three down the side, four along the bottom and three back up. Four add three add four add three is fourteen. The perimeter is fourteen centimetres."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue], [4, 3, blue]] }
          - text: "12 squares inside: that is the area, not the perimeter."
            say: "There are twelve squares inside. They tell you how much space the shape covers. That is its area. The perimeter is only the edge."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue], [4, 3, blue]] }
          - text: "A square with 5 cm sides: 5 + 5 + 5 + 5 = 20 cm"
            say: "A square has four equal sides. If each side is five centimetres, the perimeter is five add five add five add five: twenty centimetres."
            show: { drawn: shape, kind: square }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Each square is 1 cm. What is the perimeter?"
                show: { drawn: grid, cols: 5, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue]] }
                options: ["10 cm", "6 cm", "5 cm"]
                answer: "10 cm"
                feedback:
                  "6 cm": "6 is the number of squares inside. Count the edges round the outside."
                  "5 cm": "That is only two sides. Add all four: 3 + 2 + 3 + 2."
                hints:
                  - "Count the edges round the outside, not the squares."
                  - "3 along the top, 2 down, 3 along the bottom, 2 up."
                  - "3 + 2 + 3 + 2 = 10 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A rectangle is 6 cm long and 2 cm wide. What is its perimeter?"
                show: { drawn: shape, kind: rectangle }
                options: ["16 cm", "8 cm", "12 cm"]
                answer: "16 cm"
                feedback:
                  "8 cm": "6 + 2 is only two of the sides. A rectangle has two lengths and two widths."
                hints:
                  - "A rectangle has 4 sides: 2 long ones and 2 short ones."
                  - "6 cm, 2 cm, 6 cm and 2 cm."
                  - "6 + 2 + 6 + 2 = 16 cm."
              - id: l1-f3
                type: text_input
                text: "Each square is 1 cm. What is the perimeter in cm?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue]] }
                answer: "12"
                hints:
                  - "Count the edges all the way round."
                  - "It is a square: 3 edges on each side."
                  - "3 + 3 + 3 + 3 = 12 cm."
              - id: l1-f4
                type: multiple_choice
                text: "A triangle has sides of 4 cm, 5 cm and 6 cm. What is its perimeter?"
                show: { drawn: shape, kind: triangle }
                options: ["15 cm", "12 cm", "20 cm"]
                answer: "15 cm"
                hints:
                  - "Add the lengths of all the sides."
                  - "A triangle has 3 sides: 4 cm, 5 cm and 6 cm."
                  - "4 + 5 + 6 = 15 cm."
              - id: l1-f5
                type: multiple_choice
                text: "Each square is 1 cm. What is the perimeter?"
                show: { drawn: grid, cols: 4, rows: 4, cells: [[1, 1, blue], [1, 2, blue], [2, 2, blue]] }
                options: ["8 cm", "3 cm", "6 cm"]
                answer: "8 cm"
                hints:
                  - "Go round the edge and count every edge you pass, including the ones in the corner."
                  - "2 edges down the left side and 2 along the bottom. Then count the steps up the other side."
                  - "The edges add up to 8 cm."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Each square is 1 cm. What is the perimeter in cm?"
                show: { drawn: grid, cols: 7, rows: 3, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue]] }
                answer: "12"
                hints: ["5 along the top and bottom, 1 at each end."]
              - id: l1-s2
                type: multiple_choice
                text: "A square has sides of 4 cm. What is its perimeter?"
                show: { drawn: shape, kind: square }
                options: ["16 cm", "8 cm", "4 cm"]
                answer: "16 cm"
                hints: ["A square has 4 equal sides."]
              - id: l1-s3
                type: multiple_choice
                text: "Each square is 1 cm. What is the perimeter?"
                show: { drawn: grid, cols: 6, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue]] }
                options: ["12 cm", "8 cm", "6 cm"]
                answer: "12 cm"
                hints: ["Count the edges, not the squares."]
              - id: l1-s4
                type: text_input
                text: "A rectangle is 7 cm long and 3 cm wide. What is its perimeter in cm?"
                answer: "20"
                hints: ["7 + 3 + 7 + 3."]
              - id: l1-s5
                type: true_false
                text: "Each square is 1 cm. Is it true? The perimeter is 4 cm."
                show: { drawn: grid, cols: 4, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [1, 2, blue], [2, 2, blue]] }
                answer: false
                hints: ["4 is the number of squares. Count the edges."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Each square is 1 cm. What is the perimeter in cm?"
                show: { drawn: grid, cols: 7, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [5, 2, blue]] }
                answer: "14"
              - id: l1-n2
                type: multiple_choice
                text: "A rectangle is 9 cm long and 4 cm wide. What is its perimeter?"
                options: ["26 cm", "13 cm", "36 cm"]
                answer: "26 cm"
              - id: l1-n3
                type: text_input
                text: "A triangle has three sides of 7 cm. What is its perimeter in cm?"
                answer: "21"
              - id: l1-n4
                type: multiple_choice
                text: "Each square is 1 cm. What is the perimeter?"
                show: { drawn: grid, cols: 5, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [2, 2, blue]] }
                options: ["10 cm", "4 cm", "8 cm"]
                answer: "10 cm"
              - id: l1-n5
                type: multiple_choice
                text: "A square has sides of 10 cm. What is its perimeter?"
                options: ["40 cm", "20 cm", "100 cm"]
                answer: "40 cm"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Each square is 1 cm. What is the perimeter?"
            show: { drawn: grid, cols: 5, rows: 3, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue]] }
            options: ["8 cm", "3 cm", "4 cm"]
            answer: "8 cm"
          - id: l1-c2
            type: text_input
            text: "A rectangle is 5 cm long and 3 cm wide. What is its perimeter in cm?"
            answer: "16"
          - id: l1-c3
            type: multiple_choice
            text: "A square has sides of 6 cm. What is its perimeter?"
            options: ["24 cm", "12 cm", "36 cm"]
            answer: "24 cm"

  - n: 2
    title: { de: Umfang im Alltag, en: Perimeter in real life }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Each square is 1 cm. What is the perimeter in cm?"
            show: { drawn: grid, cols: 4, rows: 6, cells: [[1, 1, blue], [2, 1, blue], [1, 2, blue], [2, 2, blue], [1, 3, blue], [2, 3, blue], [1, 4, blue], [2, 4, blue]] }
            answer: "12"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "A square has sides of 3 cm. What is its perimeter?"
            options: ["12 cm", "9 cm", "6 cm"]
            answer: "12 cm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A garden is 8 m long and 5 m wide.\nFence: 8 + 5 + 8 + 5 = 26 m"
            say: "A fence goes all the way round the garden, so we need the perimeter. Eight add five add eight add five is twenty-six metres of fence."
          - text: "A square has a perimeter of 20 cm.\nEach side: 20 ÷ 4 = 5 cm"
            say: "A square has four equal sides, so they share the perimeter equally. Twenty divided by four is five. Each side is five centimetres."
          - text: "Perimeter 18 cm, length 6 cm.\n6 + 6 = 12, 18 − 12 = 6, so each width is 3 cm."
            say: "A rectangle has a perimeter of eighteen centimetres and is six centimetres long. The two lengths make twelve. That leaves six centimetres for the two widths, so each width is three centimetres."
          - text: "Perimeter: the edge. Area: the space inside."
            say: "Going round the edge is perimeter: a fence, a frame, a ribbon round a card. Covering the inside is area: a carpet, a tablecloth, paint on a wall."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "A garden is 6 m long and 4 m wide. How much fence goes all the way round?"
                options: ["20 m", "10 m", "24 m"]
                answer: "20 m"
                feedback:
                  "10 m": "That is one length and one width. The fence goes round all four sides."
                  "24 m": "24 is 6 × 4. Multiplying the sides gives the squares inside, not the edge. The fence goes round the edge."
                hints:
                  - "The fence goes round the edge, so find the perimeter."
                  - "6 m, 4 m, 6 m and 4 m."
                  - "6 + 4 + 6 + 4 = 20 m."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "A square has a perimeter of 12 cm. How long is each side?"
                options: ["3 cm", "6 cm", "4 cm"]
                answer: "3 cm"
                feedback:
                  "6 cm": "6 cm is half the perimeter, so that is two sides. A square has four."
                hints:
                  - "A square has 4 equal sides."
                  - "Share 12 cm between 4 sides."
                  - "12 ÷ 4 = 3 cm."
              - id: l2-f3
                type: multiple_choice
                text: "Ruby sticks ribbon round the edge of a card. Does she need the perimeter or the area?"
                options: ["perimeter", "area"]
                answer: "perimeter"
                keep_order: true
                hints:
                  - "Does the ribbon go round the edge or cover the card?"
                  - "It goes round the edge."
                  - "The edge is the perimeter."
              - id: l2-f4
                type: text_input
                text: "A photo frame is 10 cm long and 8 cm wide. What is its perimeter in cm?"
                answer: "36"
                hints:
                  - "Add all four sides."
                  - "10 + 8 + 10 + 8."
                  - "36 cm."
              - id: l2-f5
                type: multiple_choice
                text: "Dad paints a whole wall. Does he need the perimeter or the area?"
                options: ["perimeter", "area"]
                answer: "area"
                keep_order: true
                feedback:
                  "perimeter": "Paint covers the whole wall, the space inside. That is area."
                hints:
                  - "Does the paint go round the edge or cover the wall?"
                  - "It covers the whole wall."
                  - "Covering the inside is area."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "A field is 20 m long and 10 m wide. Kim runs once round the edge. How many metres does she run?"
                answer: "60"
                hints: ["20 + 10 + 20 + 10."]
              - id: l2-s2
                type: multiple_choice
                text: "A square has a perimeter of 16 cm. How long is each side?"
                options: ["4 cm", "8 cm", "12 cm"]
                answer: "4 cm"
                hints: ["Share 16 between the 4 equal sides."]
              - id: l2-s3
                type: multiple_choice
                text: "Mrs Khan puts a border round a display board. Does she need the perimeter or the area?"
                options: ["perimeter", "area"]
                answer: "perimeter"
                keep_order: true
                hints: ["A border goes round the edge."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Each square is 1 cm. Which shape has the longer perimeter?"
                options:
                  - { drawn: grid, cols: 6, rows: 3, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue]], key: "10" }
                  - { drawn: grid, cols: 4, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [1, 2, blue], [2, 2, blue]], key: "8" }
                answer: "10"
                hints: ["Both have 4 squares. Count the edges round each one."]
              - id: l2-s5
                type: true_false
                text: "Is it true? To buy carpet for a floor, you need the area."
                answer: true
                hints: ["Carpet covers the whole floor."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "A swimming pool is 25 m long and 10 m wide. What is its perimeter in metres?"
                answer: "70"
              - id: l2-n2
                type: multiple_choice
                text: "Tom covers a table with a tablecloth. Does he need the perimeter or the area?"
                options: ["perimeter", "area"]
                answer: "area"
                keep_order: true
              - id: l2-n3
                type: text_input
                text: "A square sandpit has a perimeter of 8 m. How long is each side in metres?"
                answer: "2"
              - id: l2-n4
                type: multiple_choice
                text: "A rectangle has a perimeter of 14 cm. It is 5 cm long. How wide is it?"
                options: ["2 cm", "4 cm", "9 cm"]
                answer: "2 cm"
                difficulty: stretch
              - id: l2-n5
                type: multiple_choice
                text: "The playground is 30 m long and 20 m wide. Sam walks once round the edge. How far does he walk?"
                options: ["100 m", "50 m", "600 m"]
                answer: "100 m"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Each square is 1 cm. What is the perimeter?"
            show: { drawn: grid, cols: 7, rows: 5, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [5, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue], [4, 3, blue], [5, 3, blue]] }
            options: ["16 cm", "15 cm", "8 cm"]
            answer: "16 cm"
          - id: l2-c2
            type: text_input
            text: "A rectangle is 8 cm long and 2 cm wide. What is its perimeter in cm?"
            answer: "20"
          - id: l2-c3
            type: multiple_choice
            text: "A square has a perimeter of 40 cm. How long is each side?"
            options: ["10 cm", "20 cm", "4 cm"]
            answer: "10 cm"
          - id: l2-c4
            type: multiple_choice
            text: "A triangle has sides of 3 cm, 4 cm and 5 cm. What is its perimeter?"
            options: ["12 cm", "7 cm", "60 cm"]
            answer: "12 cm"
          - id: l2-c5
            type: multiple_choice
            text: "Leo puts a fence round his vegetable patch. Does he need the perimeter or the area?"
            options: ["perimeter", "area"]
            answer: "perimeter"
            keep_order: true
