# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.hundred-square
skill: math.numbers-to-100.hundred-square
curriculum: en-GB
language: en
title:
  de: Die Hundertertafel
  en: The hundred square
summary: >
  Finding the way on a hundred square: one step right is one more, one row
  down is ten more. Lesson 1 finds hidden numbers next to, above and below
  a number; lesson 2 follows moves, spots column patterns, and uses the
  square to add 9 and 11 (one row down, one step left or right), and ends
  with the skill check.
metadata:
  year: year-3
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-100.read-write]
  also_practises: [math.numbers-to-100.place-value, math.add-sub-to-100.clever]
  vocabulary: { en: [hundred square, row, column, ten more, ten less, one more, one less] }
  forms: [drawn, text, audio]
  drawn: [hundred-square]
  facets: []
  misconceptions:
    - id: down-is-one
      what: Thinks the number below 34 is 35
      addressed: Learn shows that each row starts ten further on; feedback in the full stage says one row down is ten more
    - id: row-end
      what: Thinks the number after 40 is on the same row
      addressed: tasks ask for the number after 30, 60 and 90, which start the next row
    - id: eleven-nine-mixed
      what: Mixes up which diagonal adds 9 and which adds 11
      addressed: lesson 2 Learn shows both moves; hints split each into ten more, then one more or one less
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Nachbarn auf der Tafel, en: Neighbours on the square }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Listen and write the number."
            say: "Forty-three. Write the number."
            answer: "43"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "_ , 27, _"
            say: "Which numbers come just before and just after twenty-seven?"
            frame: "_ , 27, _"
            options: ["26", "28", "17", "37"]
            answer: ["26", "28"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 to 100"
            say: "This is a hundred square. Each row has ten numbers. One is at the top left and one hundred is at the bottom right."
            show: { drawn: hundred-square }
          - text: "34 → 35"
            say: "One step to the right is one more. To the right of thirty-four is thirty-five."
            show: { drawn: hundred-square, highlight: [34, 35] }
          - text: "34 → 44"
            say: "One row down is ten more. Below thirty-four is forty-four. The ones stay the same and the tens go up by one."
            show: { drawn: hundred-square, highlight: [34, 44] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which number is hidden?"
                say: "Which number is hidden?"
                show: { drawn: hundred-square, hide: [23] }
                options: ["22", "23", "33"]
                answer: "23"
                hints:
                  - "Look to the left and right of it."
                  - "On the left is 22, on the right is 24."
                  - "In between is 23."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which number is hidden?"
                say: "The hidden number is below forty-six. Which is it?"
                show: { drawn: hundred-square, highlight: [46], hide: [56] }
                options: ["47", "56", "66"]
                answer: "56"
                feedback:
                  "47": "47 is to the right. One row down is ten more."
                hints:
                  - "One row down is ten more."
                  - "The ones stay 6. The tens become 5."
                  - "Below 46 is 56."
              - id: l1-f3
                type: multiple_choice
                text: "Which number is hidden?"
                say: "The hidden number is above seventy-two. Which is it?"
                show: { drawn: hundred-square, highlight: [72], hide: [62] }
                options: ["62", "71", "82"]
                answer: "62"
                hints:
                  - "One row up is ten less."
                  - "The ones stay 2. The tens become 6."
                  - "Above 72 is 62."
              - id: l1-f4
                type: true_false
                text: "Is it true? 31 is on the same row as 30."
                say: "Thirty-one comes after thirty. Is thirty-one on the same row as thirty?"
                show: { drawn: hundred-square, highlight: [30, 31] }
                answer: false
                hints:
                  - "Where is 30? At the right-hand end."
                  - "After the end of a row, the numbers carry on in the next row."
                  - "No, 31 starts the next row."
              - id: l1-f5
                type: fill_in_blank
                text: "What is to the left and right?"
                say: "Which numbers are to the left and right of fifty-eight?"
                show: { drawn: hundred-square, highlight: [58], hide: [57, 59] }
                frame: "_ , 58, _"
                options: ["48", "57", "59", "68"]
                answer: ["57", "59"]
                hints:
                  - "Left is one less, right is one more."
                  - "58 take away 1, 58 add 1."
                  - "57 and 59."
              - id: l1-f6
                type: fill_in_blank
                text: "What is above and below?"
                say: "Which numbers are above and below thirty-five?"
                show: { drawn: hundred-square, highlight: [35], hide: [25, 45] }
                frame: "above _ , below _"
                options: ["25", "34", "36", "45"]
                answer: ["25", "45"]
                hints:
                  - "Above is ten less, below is ten more."
                  - "The ones stay 5."
                  - "Above 25, below 45."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which number is hidden?"
                say: "Which number is hidden?"
                show: { drawn: hundred-square, hide: [67] }
                options: ["67", "76", "57"]
                answer: "67"
                hints: ["Look to the left and right of it."]
              - id: l1-s2
                type: multiple_choice
                text: "Which number is hidden?"
                say: "The hidden number is below nineteen. Which is it?"
                show: { drawn: hundred-square, highlight: [19], hide: [29] }
                options: ["20", "29", "91"]
                answer: "29"
                hints: ["One row down is ten more."]
              - id: l1-s3
                type: fill_in_blank
                text: "What is above and below?"
                say: "Which numbers are above and below sixty-three?"
                show: { drawn: hundred-square, highlight: [63], hide: [53, 73] }
                frame: "above _ , below _"
                options: ["53", "62", "64", "73"]
                answer: ["53", "73"]
                hints: ["The ones stay the same."]
              - id: l1-s4
                type: multiple_choice
                text: "What comes after 60?"
                say: "Which number comes after sixty?"
                show: { drawn: hundred-square, highlight: [60], hide: [61] }
                options: ["61", "70", "51"]
                answer: "61"
                hints: ["One more than 60."]
              - id: l1-s5
                type: multiple_choice
                text: "Which number is hidden?"
                say: "The hidden number is above eighty-eight. Which is it?"
                show: { drawn: hundred-square, highlight: [88], hide: [78] }
                options: ["78", "87", "98"]
                answer: "78"
                hints: ["One row up is ten less."]
              - id: l1-s6
                type: fill_in_blank
                text: "What is to the left and right?"
                say: "Which numbers come just before and just after forty-one?"
                show: { drawn: hundred-square, highlight: [41], hide: [40, 42] }
                frame: "_ , 41, _"
                options: ["31", "40", "42", "51"]
                answer: ["40", "42"]
                hints: ["One less is at the end of the row above."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which number is hidden?"
                say: "Which number is hidden?"
                show: { drawn: hundred-square, hide: [84] }
                options: ["48", "84", "74"]
                answer: "84"
              - id: l1-n2
                type: multiple_choice
                text: "Which number is hidden?"
                say: "The hidden number is below fifty-two. Which is it?"
                show: { drawn: hundred-square, highlight: [52], hide: [62] }
                options: ["53", "62", "42"]
                answer: "62"
              - id: l1-n3
                type: fill_in_blank
                text: "What is above and below?"
                say: "Which numbers are above and below seventy-seven?"
                show: { drawn: hundred-square, highlight: [77], hide: [67, 87] }
                frame: "above _ , below _"
                options: ["67", "76", "78", "87"]
                answer: ["67", "87"]
              - id: l1-n4
                type: true_false
                text: "Is it true? 16 is below 15."
                say: "Sixteen is below fifteen on the hundred square. Is that true?"
                show: { drawn: hundred-square, highlight: [15] }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "What comes after 90?"
                say: "Which number comes after ninety?"
                show: { drawn: hundred-square, highlight: [90], hide: [91] }
                options: ["91", "100", "80"]
                answer: "91"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which number is hidden?"
            say: "The hidden number is below thirty-eight. Which is it?"
            show: { drawn: hundred-square, highlight: [38], hide: [48] }
            options: ["39", "48", "28"]
            answer: "48"
          - id: l1-c2
            type: fill_in_blank
            text: "What is to the left and right?"
            say: "Which numbers are to the left and right of seventy-five?"
            show: { drawn: hundred-square, highlight: [75], hide: [74, 76] }
            frame: "_ , 75, _"
            options: ["65", "74", "76", "85"]
            answer: ["74", "76"]
          - id: l1-c3
            type: multiple_choice
            text: "Which number is hidden?"
            say: "Which number is hidden?"
            show: { drawn: hundred-square, hide: [49] }
            options: ["49", "94", "59"]
            answer: "49"

  - n: 2
    title: { de: Wege und Muster, en: Moves and patterns }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which number is hidden?"
            say: "The hidden number is below twenty-four. Which is it?"
            show: { drawn: hundred-square, highlight: [24], hide: [34] }
            options: ["25", "34", "14"]
            answer: "34"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which number is hidden?"
            say: "Which number is hidden?"
            show: { drawn: hundred-square, hide: [56] }
            options: ["56", "65", "46"]
            answer: "56"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3, 13, 23, 33"
            say: "Look at one column: three, thirteen, twenty-three, thirty-three. They all end in three. Down a column, the ones stay the same."
            show: { drawn: hundred-square, highlight: [3, 13, 23, 33, 43, 53, 63, 73, 83, 93] }
          - text: "22 → 2 rows down → 42"
            say: "A move: start at twenty-two and go two rows down. That is ten more and ten more again. We land on forty-two."
            show: { drawn: hundred-square, highlight: [22, 32, 42] }
          - text: "26 + 11 = 37 · 26 + 9 = 35"
            say: "The square helps with adding eleven and nine. Adding eleven is one row down and one step right: twenty-six, thirty-six, thirty-seven. Adding nine is one row down and one step left: thirty-six, thirty-five."
            show: { drawn: hundred-square, highlight: [26, 36, 37, 35] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Start at 14, go 2 rows down. Where are you?"
                say: "Start at fourteen. Go two rows down. Where are you?"
                show: { drawn: hundred-square, highlight: [14] }
                options: ["16", "34", "24"]
                answer: "34"
                feedback:
                  "16": "Two steps to the right would be 16. Each row down is ten more."
                hints:
                  - "One row down is ten more."
                  - "14, then 24, then one more row."
                  - "You are on 34."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which number is in this column?"
                say: "The highlighted numbers are a column. Which number also belongs in it?"
                show: { drawn: hundred-square, highlight: [7, 17, 27, 37] }
                options: ["47", "38", "70"]
                answer: "47"
                hints:
                  - "What do all the highlighted numbers end in?"
                  - "They all end in 7."
                  - "47 ends in 7 too."
              - id: l2-f3
                type: multiple_choice
                text: "43 + 11 = ?"
                say: "Forty-three add eleven. Use the hundred square."
                show: { drawn: hundred-square, highlight: [43] }
                options: ["54", "52", "44"]
                answer: "54"
                feedback:
                  "52": "That is adding nine: down and left. Adding eleven is one row down, then one step right."
                hints:
                  - "Eleven is ten and one more."
                  - "One row down is 53, then one step right."
                  - "43 + 11 = 54."
              - id: l2-f4
                type: multiple_choice
                text: "Start at 68, go 1 row up. Where are you?"
                say: "Start at sixty-eight. Go one row up. Where are you?"
                show: { drawn: hundred-square, highlight: [68] }
                options: ["58", "67", "78"]
                answer: "58"
                hints:
                  - "Up is ten less."
                  - "The ones stay 8."
                  - "You are on 58."
              - id: l2-f5
                type: text_input
                text: "54 + 9 = _"
                say: "Fifty-four add nine. Use the hundred square."
                show: { drawn: hundred-square, highlight: [54] }
                answer: "63"
                hints:
                  - "Nine is ten, then one less."
                  - "One row down is 64, then one step left."
                  - "54 + 9 = 63."
              - id: l2-f6
                type: text_input
                text: "Start at 33, 1 row down and 2 right."
                say: "Start at thirty-three. Go one row down, then two steps right. Where are you?"
                show: { drawn: hundred-square, highlight: [33] }
                answer: "45"
                hints:
                  - "First down: ten more."
                  - "33, down to 43. Then two steps right."
                  - "43, 44, 45."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Start at 26, go 3 rows down. Where are you?"
                say: "Start at twenty-six. Go three rows down. Where are you?"
                show: { drawn: hundred-square, highlight: [26] }
                options: ["29", "56", "46"]
                answer: "56"
                hints: ["Each row down is ten more."]
              - id: l2-s2
                type: multiple_choice
                text: "Which number is in this column?"
                say: "The highlighted numbers are a column. Which number also belongs in it?"
                show: { drawn: hundred-square, highlight: [12, 22, 32, 42] }
                options: ["43", "52", "21"]
                answer: "52"
                hints: ["What do they all end in?"]
              - id: l2-s3
                type: text_input
                text: "67 + 11 = _"
                say: "Sixty-seven add eleven."
                show: { drawn: hundred-square, highlight: [67] }
                answer: "78"
                hints: ["Eleven is one row down and one step right."]
              - id: l2-s4
                type: text_input
                text: "Start at 71, 2 rows up and 3 right."
                say: "Start at seventy-one. Go two rows up, then three steps right. Where are you?"
                show: { drawn: hundred-square, highlight: [71] }
                answer: "54"
                hints: ["Do the rows first, then the steps."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 40, 50 and 60 are on one row."
                say: "Forty, fifty and sixty. Are they next to each other on one row?"
                show: { drawn: hundred-square }
                answer: false
                hints: ["Where are the multiples of ten?"]
              - id: l2-s6
                type: multiple_choice
                text: "35 + 9 = ?"
                say: "Thirty-five add nine."
                show: { drawn: hundred-square, highlight: [35] }
                options: ["44", "46", "34"]
                answer: "44"
                hints: ["Nine is one row down and one step left."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Start at 42, go 4 rows down. Where are you?"
                say: "Start at forty-two. Go four rows down. Where are you?"
                show: { drawn: hundred-square, highlight: [42] }
                options: ["46", "82", "72"]
                answer: "82"
              - id: l2-n2
                type: multiple_choice
                text: "Which number is in this column?"
                say: "The highlighted numbers are a column. Which number also belongs in it?"
                show: { drawn: hundred-square, highlight: [5, 15, 25, 35] }
                options: ["36", "45", "50"]
                answer: "45"
              - id: l2-n3
                type: text_input
                text: "28 + 11 = _"
                say: "Twenty-eight add eleven."
                show: { drawn: hundred-square, highlight: [28] }
                answer: "39"
              - id: l2-n4
                type: text_input
                text: "Start at 18, 3 rows down and 1 left."
                say: "Start at eighteen. Go three rows down, then one step left. Where are you?"
                show: { drawn: hundred-square, highlight: [18] }
                answer: "47"
              - id: l2-n5
                type: text_input
                text: "76 + 9 = _"
                say: "Seventy-six add nine."
                show: { drawn: hundred-square, highlight: [76] }
                answer: "85"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which number is hidden?"
            say: "The hidden number is above fifty-six. Which is it?"
            show: { drawn: hundred-square, highlight: [56], hide: [46] }
            options: ["46", "55", "66"]
            answer: "46"
          - id: l2-c2
            type: fill_in_blank
            text: "What is above and below?"
            say: "Which numbers are above and below eighty-two?"
            show: { drawn: hundred-square, highlight: [82], hide: [72, 92] }
            frame: "above _ , below _"
            options: ["72", "81", "83", "92"]
            answer: ["72", "92"]
          - id: l2-c3
            type: multiple_choice
            text: "Start at 37, go 2 rows down. Where are you?"
            say: "Start at thirty-seven. Go two rows down. Where are you?"
            show: { drawn: hundred-square, highlight: [37] }
            options: ["39", "57", "47"]
            answer: "57"
          - id: l2-c4
            type: multiple_choice
            text: "52 + 11 = ?"
            say: "Fifty-two add eleven."
            show: { drawn: hundred-square, highlight: [52] }
            options: ["63", "61", "53"]
            answer: "63"
          - id: l2-c5
            type: text_input
            text: "47 + 9 = _"
            say: "Forty-seven add nine."
            show: { drawn: hundred-square, highlight: [47] }
            answer: "56"
