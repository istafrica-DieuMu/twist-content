                text: "You work out 659 − 24 in columns. Which digit of 659 is above the 2?"
                options: ["5", "6", "9"]
                answer: "5"
                feedback:
                  "6": "24 has 2 tens, so the 2 goes in the tens column, under the 5. Line up the ones first."
                hints:
                  - "Line up the ones on the right first."
                  - "The 4 goes under the 9. The 2 goes one column to the left."
                  - "The 2 is under the 5."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Subtract in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["659", "24"], op: "-", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["5", "3", "6", "4"]
                answer: ["5", "3", "6"]
                hints:
                  - "Ones: 9 subtract 4."
                  - "Tens: 5 subtract 2. Hundreds: nothing to take away from 6."
                  - "O: 5, T: 3, H: 6. The answer is 635."
              - id: l2-f3
                type: multiple_choice
                text: "Which addition checks 786 − 352 = 434?"
                options: ["434 + 352 = 786", "786 + 352 = 1138", "434 − 352 = 82"]
                answer: "434 + 352 = 786"
                feedback:
                  "786 + 352 = 1138": "The check starts with the answer. Add the answer and the number you took away: 434 + 352."
                hints:
                  - "The inverse of subtracting is adding."
                  - "Add the answer, 434, and the number you took away, 352."
                  - "434 + 352 = 786."
              - id: l2-f4
                type: text_input
                text: "Subtract in columns."
                say: "Subtract six from nine hundred and forty-seven in columns."
                show: { drawn: written-calc, rows: ["947", "6"], op: "-" }
                answer: "941"
                hints:
                  - "6 is only ones. It goes under the 7."
                  - "Ones: 7 subtract 6. The tens and hundreds stay the same."
                  - "941."
              - id: l2-f5
                type: true_false
                text: "Tia works out 568 − 43 in columns and gets 138. Is Tia right?"
                say: "Tia works out five hundred and sixty-eight subtract forty-three in columns and gets one hundred and thirty-eight. Is Tia right?"
                answer: false
                hints:
                  - "568 − 43 takes away less than 50. Is 138 far too small?"
                  - "Tia put the 4 under the 5. The 3 goes under the 8 and the 4 under the 6."
                  - "No. 568 − 43 = 525."

