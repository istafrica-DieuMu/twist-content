            show: { drawn: written-calc, rows: ["893", "461"], op: "-", result: "422" }
            answer: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "478 − 35"
            say: "Four hundred and seventy-eight subtract thirty-five. Thirty-five has only two digits. Line up the ones on the right: the five goes under the eight, and the three goes under the seven."
            show: { drawn: written-calc, rows: ["478", "35"], op: "-" }
          - text: "8 − 5 = 3\n7 − 3 = 4\n4 − 0 = 4"
            say: "Ones: eight subtract five is three. Tens: seven subtract three is four. Hundreds: nothing is taken away, so the four stays. The answer is four hundred and forty-three."
            show: { drawn: written-calc, rows: ["478", "35"], op: "-", result: "443" }
          - text: "443 + 35 = 478"
            say: "Check with the inverse. Add the answer and the number you took away. Four hundred and forty-three add thirty-five is four hundred and seventy-eight. That is the number you started with, so the answer is right."
            show: { drawn: written-calc, rows: ["443", "35"], op: "+", result: "478" }

