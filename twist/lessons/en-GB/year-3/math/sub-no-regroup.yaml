# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.sub-no-regroup
skill: math.written-add-sub.sub-no-regroup
curriculum: en-GB
language: en
title:
  de: Schriftlich subtrahieren ohne Entbündeln
  en: Column subtraction without exchanging
summary: >
  Column subtraction where every column has enough to take away. Lesson 1
  writes the number you take away under the first number and subtracts
  from the ones, bottom digit from top digit; lesson 2 takes away a
  shorter number, lining it up on the right, checks the answer with the
  inverse addition, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.add-no-carry]
  also_practises: [math.add-sub-to-20.inverse]
  vocabulary: { en: [column subtraction, subtract, take away, ones, tens, hundreds, line up, inverse, check] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: three-digit, what: { de: dreistellige Zahlen schriftlich subtrahieren, en: column subtraction of three-digit numbers } }
    - { id: shorter, what: { de: kürzere Zahlen stellengerecht untereinander schreiben und abziehen, en: lining up and taking away a shorter number } }
    - { id: columns, what: { de: Stelle für Stelle von den Einern an rechnen, en: working column by column from the ones } }
    - { id: inverse, what: { de: mit der Umkehraufgabe die Probe machen, en: checking with the inverse addition } }
  misconceptions:
    - id: start-left
      what: Starts subtracting from the hundreds instead of the ones
      addressed: lesson 1 Learn starts on the right; l1-f2 has feedback on it; l1-s4 and l1-c2 ask again
    - id: adds-a-column
      what: Adds the digits of a column instead of subtracting them
      addressed: l1-f5 offers the added tens digit, with feedback
    - id: misalign-short-number
      what: Lines a shorter number up on the left (568 − 43 worked as 568 − 430)
      addressed: lesson 2 Learn lines up the ones; l2-f1 has feedback on it; l2-f5, l2-s1, l2-n1, l2-c4 and l2-c5 ask again
    - id: inverse-wrong-start
      what: Checks a subtraction by adding to the first number (786 + 352) instead of to the answer
      addressed: lesson 2 Learn adds the answer and the number taken away; l2-f3 has feedback on it; l2-s3 and l2-c3 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Dreistellige Zahlen subtrahieren, en: Subtracting three-digit numbers }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Add in columns."
            say: "Add three hundred and forty-two and one hundred and thirty-five in columns."
            show: { drawn: written-calc, rows: ["342", "135"], op: "+" }
            answer: "477"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is this calculation right?"
            say: "Check each column. Is this calculation right?"
            show: { drawn: written-calc, rows: ["263", "514"], op: "+", result: "777" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "586 − 243"
            say: "In column subtraction, write the number you start with on top and the number you take away underneath: ones under ones, tens under tens, hundreds under hundreds."
            show: { drawn: written-calc, rows: ["586", "243"], op: "-" }
          - text: "6 − 3 = 3"
            say: "Start with the ones, on the right. Six subtract three is three. You always take the bottom digit away from the top digit."
            show: { drawn: written-calc, rows: ["586", "243"], op: "-", result: "__3" }
          - text: "8 − 4 = 4\n5 − 2 = 3"
            say: "Tens: eight tens subtract four tens is four tens. Hundreds: five subtract two is three. The answer is three hundred and forty-three."
            show: { drawn: written-calc, rows: ["586", "243"], op: "-", result: "343" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Subtract in columns. Start with the ones."
                show: { drawn: written-calc, rows: ["758", "324"], op: "-", result: "___" }
                frame: "O: _  T: _  H: _"
                options: ["4", "3", "2", "5"]
                answer: ["4", "3", "4"]
                hints:
                  - "Ones: 8 subtract 4."
                  - "Tens: 5 subtract 2. Hundreds: 7 subtract 3."
                  - "O: 4, T: 3, H: 4. The answer is 434."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "You work out 697 − 254 in columns. What do you do first?"
                show: { drawn: written-calc, rows: ["697", "254"], op: "-" }
                options: ["7 − 4", "6 − 2", "4 − 7"]
                answer: "7 − 4"
                feedback:
                  "6 − 2": "Column subtraction starts on the right, with the ones: 7 − 4."
                hints:
                  - "Which column do you start with?"
                  - "Start with the ones. Take the bottom digit from the top digit."
                  - "7 − 4."
              - id: l1-f3
                type: text_input
                text: "Subtract in columns."
                say: "Subtract four hundred and thirty-seven from eight hundred and sixty-nine in columns."
                show: { drawn: written-calc, rows: ["869", "437"], op: "-" }
                answer: "432"
                hints:
                  - "Ones: 9 subtract 7."
                  - "Tens: 6 subtract 3. Hundreds: 8 subtract 4."
                  - "432."
              - id: l1-f4
                type: true_false
                text: "Is this calculation right?"
                say: "Check each column. Is this calculation right?"
                show: { drawn: written-calc, rows: ["975", "342"], op: "-", result: "633" }
                answer: true
                hints:
                  - "Check each column, starting with the ones."
                  - "5 − 2, then 7 − 4, then 9 − 3."
                  - "Yes, 633 is right."
              - id: l1-f5
                type: multiple_choice
                text: "You work out 583 − 261. What is the tens digit of the answer?"
                show: { drawn: written-calc, rows: ["583", "261"], op: "-" }
                options: ["2", "14", "6"]
                answer: "2"
                feedback:
                  "14": "That is 8 + 6. This is a subtraction, so take away: 8 − 6."
                hints:
                  - "Look at the tens column: 8 on top, 6 underneath."
                  - "Take the bottom digit from the top digit."
                  - "8 − 6 = 2."

