# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.money-decimal
skill: math.money.decimal-notation
curriculum: en-GB
language: en
title:
  de: Geldbeträge mit Dezimalpunkt
  en: Pounds and pence with a decimal point
summary: >
  Reading and writing money with a decimal point. Lesson 1 writes the
  pounds before the point and always two digits of pence after it (£3.50
  = £3 and 50p = 350p) and changes between pounds and pence; lesson 2
  writes small pence amounts (£2.05, £0.45), compares and orders amounts,
  and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Mit Geld rechnen, en: Calculating with money }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.money.euro-cent]
  also_practises: [math.money.euro-cent]
  vocabulary: { en: [pound, pence, decimal point, "£", p, amount, more, less, cheapest, dearest] }
  forms: [drawn, text, audio]
  drawn: [coins]
  facets: [currency, number-format]
  parts:
    - { id: write, what: { de: Pfund und Pence mit Dezimalpunkt schreiben, en: writing pounds and pence with a decimal point } }
    - { id: pence, what: { de: zwischen Pfund und Pence umrechnen, en: changing between pounds and pence } }
    - { id: coins, what: { de: den Betrag von Münzen und Scheinen aufschreiben, en: writing the amount that coins and notes make } }
    - { id: compare, what: { de: Geldbeträge vergleichen und ordnen, en: comparing and ordering amounts of money } }
  misconceptions:
    - id: one-digit-pence
      what: Writes a few pence with one digit after the point (£3 and 8p as £3.8)
      addressed: lesson 2 Learn writes two digits of pence; l2-f1 has feedback on it; l2-f2, l2-s2, l2-n1, l2-n2 and l2-c4 offer the one-digit form
    - id: point-in-wrong-place
      what: Puts the point in the wrong place when changing pence into pounds (380p as £38.00)
      addressed: lesson 1 Learn counts the pounds as hundreds of pence; l1-f4 has feedback on it; l1-s4, l1-n4 and l2-c3 offer it again
    - id: reads-04-as-40
      what: Compares £6.40 and £6.04 as if they were the same, or reads the 04 as 40
      addressed: lesson 2 Learn compares pounds first, then pence; l2-f4, l2-s4, l2-n4 and l2-n5 compare them, and the ordering tasks l2-f5, l2-s5 and l2-c5 mix them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Pfund vor dem Punkt, Pence dahinter", en: "Pounds before the point, pence after it" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How much money is this?"
            show: { drawn: coins, values: [200, 100, 50, 20] }
            options: ["£3 and 70p", "£3 and 7p", "£37"]
            answer: "£3 and 70p"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "How many pence make £1?"
            answer: "100"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "£3.50"
            say: "This is three pounds and fifty pence. We can write it with a decimal point. The pounds go before the point, and the pence go after it. We say three pounds fifty."
            show: { drawn: coins, values: [200, 100, 50] }
          - text: "£3.50 = £3 and 50p = 350p"
            say: "Three pounds are three hundred pence, and fifty pence more makes three hundred and fifty pence. So three pounds fifty, three pounds and fifty pence, and three hundred and fifty pence are all the same amount."
          - text: "£4.75 = 475p"
            say: "Four pounds seventy-five. Four pounds are four hundred pence, so it is four hundred and seventy-five pence. To change pence into pounds, the hundreds of pence become the pounds."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How do you write £2 and 40p?"
                options: ["£2.40", "£24.0", "£240"]
                answer: "£2.40"
                option_audio: false
                hints:
                  - "The pounds go before the point."
                  - "2 pounds, then the point, then 40 pence."
                  - "£2.40."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How much money is this?"
                show: { drawn: coins, values: [100, 100, 50, 20, 5] }
                options: ["£2.75", "£2.57", "£27.5"]
                answer: "£2.75"
                option_audio: false
                hints:
                  - "Count the pounds first, then the pence."
                  - "Two £1 coins make £2. Then 50p, 20p and 5p make 75p."
                  - "£2.75."
              - id: l1-f3
                type: text_input
                text: "£4.60 = _p"
                say: "Four pounds sixty. How many pence is that?"
                answer: "460"
                hints:
                  - "£4 is how many pence?"
                  - "£4 = 400p. Then add the 60p."
                  - "460p."
              - id: l1-f4
                type: multiple_choice
                text: "Which amount is the same as 380p?"
                options: ["£3.80", "£38.00", "£0.38"]
                answer: "£3.80"
                option_audio: false
                feedback:
                  "£38.00": "£38 would be 3800p. 380p is 300p and 80p: £3 and 80p, so £3.80."
                hints:
                  - "Every 100p is £1."
                  - "380p is 300p and 80p, so 3 pounds and 80 pence."
                  - "£3.80."
              - id: l1-f5
                type: fill_in_blank
                text: "£5.30 = £_ and _p"
                say: "Five pounds thirty. How many pounds and how many pence?"
                frame: "£5.30 = £_ and _p"
                options: ["5", "30", "53", "3"]
                answer: ["5", "30"]
                hints:
                  - "Before the point are the pounds. After it are the pence."
                  - "5 is before the point, and 30 is after it."
                  - "£5 and 30p."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How do you write £6 and 25p?"
                options: ["£6.25", "£62.5", "£625"]
                answer: "£6.25"
                option_audio: false
                hints: ["Pounds, then the point, then the pence."]
              - id: l1-s2
                type: multiple_choice
                text: "How much money is this?"
                show: { drawn: coins, values: [200, 50, 20, 10] }
                options: ["£2.80", "£2.08", "£28.0"]
                answer: "£2.80"
                option_audio: false
                hints: ["£2, then 50p, 20p and 10p."]
              - id: l1-s3
                type: text_input
                text: "£7.15 = _p"
                say: "Seven pounds fifteen. How many pence is that?"
                answer: "715"
                hints: ["£7 = 700p."]
              - id: l1-s4
                type: multiple_choice
                text: "Which amount is the same as 540p?"
                options: ["£5.40", "£54.00", "£0.54"]
                answer: "£5.40"
                option_audio: false
                hints: ["500p is £5."]
              - id: l1-s5
                type: fill_in_blank
                text: "A comic costs £3.95. That is £_ and _p."
                say: "A comic costs three pounds ninety-five. How many pounds and how many pence is that?"
                frame: "£_ and _p"
                options: ["3", "95", "39", "5"]
                answer: ["3", "95"]
                hints: ["The pounds are before the point."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How do you write £8 and 60p?"
                options: ["£8.60", "£86.0", "£860"]
                answer: "£8.60"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "How much money is this?"
                show: { drawn: coins, values: [500, 100, 50, 20, 20] }
                options: ["£6.90", "£6.09", "£69.0"]
                answer: "£6.90"
                option_audio: false
              - id: l1-n3
                type: text_input
                text: "£9.45 = _p"
                say: "Nine pounds forty-five. How many pence is that?"
                answer: "945"
              - id: l1-n4
                type: multiple_choice
                text: "Which amount is the same as 125p?"
                options: ["£1.25", "£12.50", "£125"]
                answer: "£1.25"
                option_audio: false
              - id: l1-n5
                type: text_input
                text: "A sandwich costs £2.85. How many pence is that?"
                answer: "285"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How do you write £4 and 15p?"
            options: ["£4.15", "£41.5", "£415"]
            answer: "£4.15"
            option_audio: false
          - id: l1-c2
            type: text_input
            text: "£6.70 = _p"
            say: "Six pounds seventy. How many pence is that?"
            answer: "670"
          - id: l1-c3
            type: multiple_choice
            text: "How much money is this?"
            show: { drawn: coins, values: [200, 200, 50, 5] }
            options: ["£4.55", "£4.50", "£45.5"]
            answer: "£4.55"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Which amount is the same as £2 and 90p?"
            options: ["290p", "209p", "29p"]
            answer: "290p"
            option_audio: false
          - id: l1-c5
            type: text_input
            text: "How many pence are in £8.50?"
            say: "How many pence are in eight pounds fifty?"
            answer: "850"
          - id: l1-c6
            type: multiple_choice
            text: "How much money is this?"
            show: { drawn: coins, values: [100, 50, 50, 20] }
            options: ["£2.20", "£2.02", "£22.0"]
            answer: "£2.20"
            option_audio: false

  - n: 2
    title: { de: "Kleine Pence-Beträge und vergleichen", en: "Small amounts of pence and comparing" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "£3.25 = _p"
            say: "Three pounds twenty-five. How many pence is that?"
            answer: "325"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How do you write £5 and 80p?"
            options: ["£5.80", "£58.0", "£580"]
            answer: "£5.80"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "£2.05"
            say: "Two pounds and five pence. After the point there are always two digits for the pence. Five pence is written zero five, so it is two pounds, point, zero five. We say two pounds five."
            show: { drawn: coins, values: [200, 5] }
          - text: "£0.45 = 45p"
            say: "Forty-five pence and no pounds. With a decimal point, we write a zero for the pounds, then the point, then forty-five. We still say forty-five pence. Both ways of writing it are right."
            show: { drawn: coins, values: [20, 20, 5] }
          - text: "£2.50 is more than £2.05"
            say: "To compare amounts, look at the pounds first. If the pounds are the same, look at the pence. Two pounds fifty has fifty pence. Two pounds five has only five pence. So two pounds fifty is more."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How do you write £3 and 8p?"
                options: ["£3.08", "£3.8", "£3.80"]
                answer: "£3.08"
                option_audio: false
                feedback:
                  "£3.80": "£3.80 is 3 pounds and 80 pence. For 8p the pence still need two digits: 08."
                  "£3.8": "After the point there are always two digits for the pence. 8p is written 08."
                hints:
                  - "After the point there are always two digits."
                  - "8p is not 80p. Write it with a zero first: 08."
                  - "£3.08."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How much money is this?"
                show: { drawn: coins, values: [100, 2, 2] }
                options: ["£1.04", "£1.4", "£1.40"]
                answer: "£1.04"
                option_audio: false
                hints:
                  - "Count the pounds, then the pence."
                  - "£1, then 2p and 2p make 4p."
                  - "4p is written 04: £1.04."
              - id: l2-f3
                type: text_input
                text: "£4.09 = _p"
                say: "Four pounds nine. How many pence is that?"
                answer: "409"
                hints:
                  - "£4 = 400p."
                  - "The 09 after the point is 9p."
                  - "400p and 9p make 409p."
              - id: l2-f4
                type: multiple_choice
                text: "Which is more, £6.40 or £6.04?"
                options: ["£6.40", "£6.04", "They are the same."]
                answer: "£6.40"
                option_audio: false
                hints:
                  - "The pounds are the same. Look at the pence."
                  - "£6.40 has 40p. £6.04 has 4p."
                  - "£6.40 is more."
              - id: l2-f5
                type: ordering
                text: "Put the amounts in order, from least to most."
                options: ["£2.50", "£2.05", "£5.20", "£0.25"]
                slot_count: 4
                answer: ["£0.25", "£2.05", "£2.50", "£5.20"]
                option_audio: false
                hints:
                  - "Look at the pounds first."
                  - "£0.25 has no pounds. £2.05 and £2.50 both have £2: compare the pence."
                  - "£0.25, £2.05, £2.50, £5.20."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How do you write 7p in pounds?"
                options: ["£0.07", "£0.70", "£7.00"]
                answer: "£0.07"
                option_audio: false
                hints: ["No pounds, and two digits for the pence."]
              - id: l2-s2
                type: multiple_choice
                text: "How do you write £5 and 3p?"
                options: ["£5.03", "£5.3", "£5.30"]
                answer: "£5.03"
                option_audio: false
                hints: ["3p is written 03."]
              - id: l2-s3
                type: text_input
                text: "£8.06 = _p"
                say: "Eight pounds six. How many pence is that?"
                answer: "806"
                hints: ["£8 = 800p, and 06 is 6p."]
              - id: l2-s4
                type: multiple_choice
                text: "Which is less, £3.09 or £3.90?"
                options: ["£3.09", "£3.90", "They are the same."]
                answer: "£3.09"
                option_audio: false
                hints: ["Compare the pence: 9p and 90p."]
              - id: l2-s5
                type: ordering
                text: "Put the prices in order, from cheapest to dearest."
                options: ["£1.99", "£1.09", "£9.10", "£0.95"]
                slot_count: 4
                answer: ["£0.95", "£1.09", "£1.99", "£9.10"]
                option_audio: false
                hints: ["Pounds first, then pence."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How do you write £9 and 1p?"
                options: ["£9.01", "£9.1", "£9.10"]
                answer: "£9.01"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "How much money is this?"
                show: { drawn: coins, values: [200, 200, 100, 1] }
                options: ["£5.01", "£5.1", "£5.10"]
                answer: "£5.01"
                option_audio: false
              - id: l2-n3
                type: text_input
                text: "£0.60 = _p"
                say: "How many pence is this amount?"
                answer: "60"
              - id: l2-n4
                type: multiple_choice
                text: "Which is more, £4.08 or £4.80?"
                options: ["£4.08", "£4.80", "They are the same."]
                answer: "£4.80"
                option_audio: false
              - id: l2-n5
                type: multiple_choice
                text: "Mia has £2.07. Leo has 270p. Who has more money?"
                options: ["Leo", "Mia", "They have the same."]
                answer: "Leo"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: write
            type: multiple_choice
            text: "How do you write £7 and 45p?"
            options: ["£7.45", "£74.5", "£745"]
            answer: "£7.45"
            option_audio: false
          - id: l2-c2
            part: pence
            type: text_input
            text: "£5.08 = _p"
            say: "Five pounds eight. How many pence is that?"
            answer: "508"
          - id: l2-c3
            part: pence
            type: multiple_choice
            text: "Which amount is the same as 630p?"
            options: ["£6.30", "£63.00", "£0.63"]
            answer: "£6.30"
            option_audio: false
          - id: l2-c4
            part: coins
            type: multiple_choice
            text: "How much money is this?"
            show: { drawn: coins, values: [200, 200, 5, 2] }
            options: ["£4.07", "£4.7", "£4.70"]
            answer: "£4.07"
            option_audio: false
          - id: l2-c5
            part: compare
            type: ordering
            text: "Put the amounts in order, from least to most."
            options: ["£3.60", "£3.06", "£6.30", "£0.36"]
            slot_count: 4
            answer: ["£0.36", "£3.06", "£3.60", "£6.30"]
            option_audio: false
          - id: l2-c6
            part: write
            type: text_input
            text: "£1 and 6p = £_"
            say: "Write one pound and six pence with a decimal point."
            keyboard: decimal
            answer: "1.06"
          - id: l2-c7
            part: write
            type: true_false
            text: "Is it true? 30p can be written as £0.30."
            say: "Thirty pence can be written with a decimal point, like this. Is that true?"
            answer: true
          - id: l2-c8
            part: write
            type: fill_in_blank
            text: "Fill the gaps."
            frame: "£8.02 = £_ and _p"
            options: ["8", "2", "20", "82"]
            answer: ["8", "2"]
          - id: l2-c9
            part: write
            type: multiple_choice
            text: "Which shows nine pounds fifty?"
            options: ["£9.50", "£9.05", "£950"]
            answer: "£9.50"
            option_audio: false
          - id: l2-c10
            part: pence
            type: multiple_choice
            text: "Which amount is the same as 905p?"
            options: ["£9.05", "£90.50", "£9.50"]
            answer: "£9.05"
            option_audio: false
          - id: l2-c11
            part: pence
            type: text_input
            text: "84p = £_"
            say: "Write eighty-four pence in pounds, with a decimal point."
            keyboard: decimal
            answer: "0.84"
          - id: l2-c12
            part: pence
            type: true_false
            text: "Is it true? £6.03 = 630p"
            say: "Six pounds three is six hundred and thirty pence. Is that true?"
            answer: false
          - id: l2-c13
            part: coins
            type: multiple_choice
            text: "How much money is this?"
            show: { drawn: coins, values: [500, 200, 20, 10, 5] }
            options: ["£7.35", "£7.53", "£73.5"]
            answer: "£7.35"
            option_audio: false
          - id: l2-c14
            part: coins
            type: multiple_choice
            text: "How much money is this?"
            show: { drawn: coins, values: [200, 10, 2] }
            options: ["£2.12", "£2.21", "£21.20"]
            answer: "£2.12"
            option_audio: false
          - id: l2-c15
            part: coins
            type: text_input
            text: "How many pence is this? Type the pence."
            show: { drawn: coins, values: [50, 20, 20, 2] }
            answer: "92"
          - id: l2-c16
            part: coins
            type: image_multiple_choice
            text: "Which coins make £1.25?"
            options:
              - { drawn: coins, values: [100, 5] }
              - { drawn: coins, values: [100, 20, 5] }
              - { drawn: coins, values: [20, 5] }
            answer: "125"
          - id: l2-c17
            part: compare
            type: multiple_choice
            text: "Which price is the dearest?"
            options: ["£4.99", "£5.05", "£4.95"]
            answer: "£5.05"
            option_audio: false
          - id: l2-c18
            part: compare
            type: true_false
            text: "Is it true? £0.80 is more than 75p."
            say: "Eighty pence is more than seventy-five pence. Is that true?"
            answer: true
          - id: l2-c19
            part: compare
            type: ordering
            text: "Put the prices in order, from dearest to cheapest."
            options: ["£1.80", "£8.01", "£1.08", "£8.10"]
            slot_count: 4
            answer: ["£8.10", "£8.01", "£1.80", "£1.08"]
            option_audio: false
          - id: l2-c20
            part: compare
            type: multiple_choice
            text: "Which two amounts are the same?"
            options: ["£2.60 and 260p", "£2.06 and 260p", "£2.60 and 26p"]
            answer: "£2.60 and 260p"
            option_audio: false
