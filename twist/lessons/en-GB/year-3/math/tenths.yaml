# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.tenths
skill: math.decimals.tenths
curriculum: en-GB
language: en
title:
  de: Zehntel
  en: Tenths
summary: >
  Lesson 1 cuts a whole into 10 equal parts and names the tenths (1/10,
  3/10, 10/10 = 1 whole) on bars, circles and rectangles, and only when the
  parts are equal; lesson 2 counts up and down in tenths on a number line
  from 0 to 1 and past 1 (9/10, 1, 1 and 1/10), finds a tenth of an amount
  by dividing by 10 (1/10 of 30 = 3), and ends with the skill check. Year 3
  writes tenths as fractions; decimal notation (0.3) follows in Year 4.
metadata:
  year: year-3
  topic: { de: Dezimalzahlen, en: Decimals }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.fractions.name-fractions, math.numbers-to-100.tens]
  also_practises: [math.fractions.name-fractions]
  vocabulary: { en: [tenth, tenths, equal parts, whole, fraction, numerator, denominator, count on, count back] }
  forms: [text, audio, drawn]
  drawn: [fraction, number-line]
  facets: []
  misconceptions:
    - id: denominator-counts-red
      what: Writes the number of white parts as the denominator (1/9 for one of ten parts, 4/6 for four of ten)
      addressed: lesson 1 Learn says the bottom number is all the parts; l1-f1 and l1-f2 have feedback, l1-n1, l1-c1 and l2-c1
    - id: unequal-parts
      what: Calls any 10 pieces tenths, even when they are not the same size
      addressed: lesson 1 Learn screen 4; l1-s3 and l2-c5
    - id: past-nine-tenths
      what: Counts 9/10, 9/11 or jumps back to 1/10 after 9/10, so does not see that 10/10 is one whole
      addressed: lesson 2 Learn counts past 1; l2-f3 has feedback, l2-s4, l2-n2 and l2-n5
    - id: tenth-of-amount
      what: Multiplies by 10 or gives 10 when finding a tenth of an amount
      addressed: lesson 2 Learn divides 30 by 10; l2-f4, l2-s3, l2-s5, l2-n3 and l2-c4
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Ein Ganzes in zehn Teile, en: A whole in ten parts }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What fraction is red?"
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
            options: ["1/4", "1/2", "1/3"]
            answer: "1/4"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many tens make 100?"
            options: ["10", "100", "1"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1/10: one tenth"
            say: "This bar is cut into ten equal parts. Each part is one tenth of the bar. We write one tenth as one over ten."
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 1 }
          - text: "3/10: three tenths"
            say: "Three parts are red. That is three tenths. The bottom number tells you how many equal parts there are in all. The top number tells you how many are red."
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 3 }
          - text: "10/10 = 1 whole"
            say: "All ten parts are red. Ten tenths make one whole."
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 10 }
          - text: "Tenths are always 10 equal parts."
            say: "Tenths only work when all ten parts are the same size. Ten pieces of different sizes are not tenths."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What fraction is red?"
                show: { drawn: fraction, kind: bar, parts: 10, shaded: 1 }
                options: ["1/10", "1/9", "10/1"]
                answer: "1/10"
                option_audio: false
                feedback:
                  "1/9": "Count all the parts, the red one too. There are 10."
                hints:
                  - "How many equal parts are there in all?"
                  - "There are 10 parts and 1 is red."
                  - "1 out of 10 parts: 1/10."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What fraction is red?"
                show: { drawn: fraction, kind: bar, parts: 10, shaded: 4 }
                options: ["4/10", "4/6", "6/10"]
                answer: "4/10"
                option_audio: false
                feedback:
                  "4/6": "The bottom number is how many parts there are in all: 10, not just the white ones."
                hints:
                  - "Count the red parts, then all the parts."
                  - "4 parts are red. There are 10 parts in all."
                  - "4/10."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which bar shows 7/10?"
                say: "Which bar shows seven tenths?"
                options:
                  - { drawn: fraction, kind: bar, parts: 10, shaded: 7 }
                  - { drawn: fraction, kind: bar, parts: 10, shaded: 3 }
                  - { drawn: fraction, kind: bar, parts: 8, shaded: 7 }
                answer: "7/10"
                hints:
                  - "The bar must have 10 equal parts."
                  - "Then 7 of them must be red."
                  - "The bar with 10 parts and 7 red."
              - id: l1-f4
                type: multiple_choice
                text: "How many tenths make one whole?"
                options: ["10", "1", "100"]
                answer: "10"
                hints:
                  - "A whole cut into tenths has how many parts?"
                  - "Colour every part of a bar with 10 parts."
                  - "10 tenths make 1 whole."
              - id: l1-f5
                type: multiple_choice
                text: "What fraction is not red?"
                show: { drawn: fraction, kind: bar, parts: 10, shaded: 6 }
                options: ["4/10", "6/10", "10/4"]
                answer: "4/10"
                option_audio: false
                hints:
                  - "Count the white parts this time."
                  - "6 are red, so 10 − 6 are white."
                  - "4 white parts: 4/10."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What fraction is red?"
                show: { drawn: fraction, kind: rect, parts: 10, rows: 2, shaded: 5 }
                options: ["5/10", "5/5", "2/10"]
                answer: "5/10"
                option_audio: false
                hints: ["Count every part, red and white."]
              - id: l1-s2
                type: fill_in_blank
                text: "Fill the gaps."
                show: { drawn: fraction, kind: bar, parts: 10, shaded: 8 }
                frame: "_/10 is red. _/10 is white."
                options: ["2", "8", "10"]
                answer: ["8", "2"]
                hints: ["Red and white together make 10 tenths."]
              - id: l1-s3
                type: true_false
                text: "Is it true? A cake cut into 10 pieces of different sizes is cut into tenths."
                answer: false
                hints: ["Tenths must be equal parts."]
              - id: l1-s4
                type: multiple_choice
                text: "What fraction is red?"
                show: { drawn: fraction, kind: bar, parts: 10, shaded: 9 }
                options: ["9/10", "1/10", "9/1"]
                answer: "9/10"
                option_audio: false
                hints: ["The top number counts the red parts."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which picture shows 2/10?"
                say: "Which picture shows two tenths?"
                options:
                  - { drawn: fraction, kind: circle, parts: 10, shaded: 2 }
                  - { drawn: fraction, kind: circle, parts: 5, shaded: 2 }
                  - { drawn: fraction, kind: rect, parts: 10, rows: 2, shaded: 8 }
                answer: "2/10"
                hints: ["10 equal parts, 2 of them red."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What fraction is red?"
                show: { drawn: fraction, kind: circle, parts: 10, shaded: 3 }
                options: ["3/10", "3/7", "7/10"]
                answer: "3/10"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Ten children share a pizza equally. What fraction does each child get?"
                options: ["1/10", "10/1", "1/2"]
                answer: "1/10"
                option_audio: false
              - id: l1-n3
                type: text_input
                text: "How many tenths are red?"
                show: { drawn: fraction, kind: bar, parts: 10, shaded: 6 }
                answer: "6"
              - id: l1-n4
                type: multiple_choice
                text: "Which is one whole?"
                options: ["10/10", "1/10", "0/10"]
                answer: "10/10"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? 3/10 means 3 of 10 equal parts."
                say: "Is it true? Three tenths means three of ten equal parts."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What fraction is red?"
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 2 }
            options: ["2/10", "2/8", "8/10"]
            answer: "2/10"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "What do we call one of 10 equal parts?"
            options: ["a tenth", "a ten", "a half"]
            answer: "a tenth"
          - id: l1-c3
            type: text_input
            text: "How many tenths are red?"
            show: { drawn: fraction, kind: rect, parts: 10, rows: 2, shaded: 7 }
            answer: "7"

  - n: 2
    title: { de: In Zehnteln zählen, en: Counting in tenths }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What fraction is red?"
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 5 }
            options: ["5/10", "5/5", "1/5"]
            answer: "5/10"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many tenths make one whole?"
            options: ["10", "5", "100"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1/10, 2/10, 3/10 ... 10/10 = 1"
            say: "Between zero and one, the line is cut into ten equal steps. Each step is one tenth. Count: one tenth, two tenths, three tenths, all the way to ten tenths, which is one."
            show: { drawn: number-line, from: 0, to: 1, step: 0.1, labels: fractions, fractions_of: 10 }
          - text: "The arrow points to 7/10."
            say: "Count the steps from zero to the arrow: seven steps. The arrow points to seven tenths."
            show: { drawn: number-line, from: 0, to: 1, step: 0.1, labels: ends, mark: 0.7 }
          - text: "9/10, 1, 1 and 1/10, 1 and 2/10"
            say: "Carry on past one. Nine tenths, one, one and one tenth, one and two tenths. Counting back works the same way: one, nine tenths, eight tenths."
            show: { drawn: number-line, from: 0, to: 2, step: 0.1, labels: ends }
          - text: "1/10 of 30 = 30 ÷ 10 = 3"
            say: "To find one tenth of an amount, share it into ten equal groups. That is dividing by ten. One tenth of thirty is three."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.1, labels: ends, mark: 0.3 }
                options: ["3/10", "3/1", "7/10"]
                answer: "3/10"
                option_audio: false
                hints:
                  - "Each small step is one tenth."
                  - "Count the steps from 0 to the arrow."
                  - "3 steps: 3/10."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Count on in tenths."
                frame: "4/10, 5/10, _, _"
                options: ["6/10", "7/10", "6/11", "10/10"]
                answer: ["6/10", "7/10"]
                option_audio: false
                hints:
                  - "Add one tenth each time."
                  - "The bottom number stays 10. The top number goes up by 1."
                  - "6/10, then 7/10."
              - id: l2-f3
                type: multiple_choice
                text: "Count on in tenths. What comes after 9/10?"
                say: "Count on in tenths. What comes after nine tenths?"
                options: ["10/10", "9/11", "1/10"]
                answer: "10/10"
                option_audio: false
                feedback:
                  "9/11": "We count in tenths, so the bottom number stays 10. After 9 tenths comes 10 tenths."
                  "1/10": "Counting on means getting bigger. 1/10 is back near the start."
                hints:
                  - "Add one more tenth to 9/10."
                  - "9 tenths and 1 more tenth make 10 tenths."
                  - "10/10, which is one whole."
              - id: l2-f4
                type: multiple_choice
                text: "1/10 of 40 = ?"
                say: "What is one tenth of forty?"
                options: ["4", "10", "400"]
                answer: "4"
                feedback:
                  "400": "That is 40 × 10. A tenth is smaller, so divide: 40 ÷ 10."
                hints:
                  - "Share 40 into 10 equal groups."
                  - "To find a tenth, divide by 10."
                  - "40 ÷ 10 = 4."
              - id: l2-f5
                type: multiple_choice
                text: "Which number does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 2, step: 0.1, labels: ends, mark: 1.2 }
                options: ["1 and 2/10", "2/10", "1 and 8/10"]
                answer: "1 and 2/10"
                option_audio: false
                hints:
                  - "Is the arrow before or after 1?"
                  - "It is past 1, the middle of the line. Count the tenths after 1."
                  - "1 and 2 steps: 1 and 2/10."

          - support: some
            tasks:
              - id: l2-s1
                type: point_on_line
                text: "Tap 6/10 on the number line."
                say: "Tap six tenths on the number line."
                show: { drawn: number-line, from: 0, to: 1, step: 0.1, labels: ends }
                answer: 0.6
                feedback:
                  "0.4": "That is 4 steps from 0. Count 6 steps from 0."
                hints: ["Count 6 steps of one tenth from 0."]
              - id: l2-s2
                type: fill_in_blank
                text: "Count back in tenths."
                frame: "8/10, 7/10, _, _"
                options: ["6/10", "5/10", "9/10", "7/11"]
                answer: ["6/10", "5/10"]
                option_audio: false
                hints: ["Take away one tenth each time."]
              - id: l2-s3
                type: multiple_choice
                text: "1/10 of 70 = ?"
                say: "What is one tenth of seventy?"
                options: ["7", "10", "70"]
                answer: "7"
                hints: ["Divide by 10."]
              - id: l2-s4
                type: multiple_choice
                text: "Count on in tenths. What comes after 1?"
                options: ["1 and 1/10", "2", "1/10"]
                answer: "1 and 1/10"
                option_audio: false
                hints: ["Add one tenth to 1."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 1/10 of 50 is 10."
                say: "Is it true? One tenth of fifty is ten."
                answer: false
                hints: ["Share 50 into 10 equal groups."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which fraction does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 1, step: 0.1, labels: ends, mark: 0.9 }
                options: ["9/10", "1/10", "9/9"]
                answer: "9/10"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Count on in tenths."
                frame: "8/10, 9/10, _, 1 and 1/10"
                options: ["10/10", "9/11", "1/10"]
                answer: ["10/10"]
                option_audio: false
              - id: l2-n3
                type: text_input
                text: "There are 60 children in Year 3. One tenth of them walk to school. How many children walk?"
                answer: "6"
              - id: l2-n4
                type: multiple_choice
                text: "A ribbon 10 m long is cut into 10 equal pieces. How long is each piece?"
                options: ["1 m", "10 m", "100 m"]
                answer: "1 m"
              - id: l2-n5
                type: multiple_choice
                text: "Count back in tenths from 1. What comes next?"
                options: ["9/10", "1/10", "0"]
                answer: "9/10"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What fraction is red?"
            show: { drawn: fraction, kind: rect, parts: 10, rows: 2, shaded: 9 }
            options: ["9/10", "9/1", "1/10"]
            answer: "9/10"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Which fraction does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1, step: 0.1, labels: ends, mark: 0.4 }
            options: ["4/10", "6/10", "4/1"]
            answer: "4/10"
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "Count on in tenths."
            frame: "5/10, 6/10, _, _"
            options: ["7/10", "8/10", "6/11", "4/10"]
            answer: ["7/10", "8/10"]
            option_audio: false
          - id: l2-c4
            type: text_input
            text: "1/10 of 90 = _"
            say: "What is one tenth of ninety?"
            answer: "9"
          - id: l2-c5
            type: multiple_choice
            text: "Which sentence is true?"
            options: ["10 tenths make one whole.", "A tenth is one of 10 parts of any size.", "1/10 is bigger than 1."]
            answer: "10 tenths make one whole."
            option_audio: false
