# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.derive-facts
skill: math.mult-div.derive-facts
curriculum: en-GB
language: en
title:
  de: Schwere Aufgaben aus Kernaufgaben
  en: Harder facts from facts I know
summary: >
  Harder times table facts worked out from facts a Year 3 child knows
  (the 2, 3, 4, 5, 8 and 10 times tables). Lesson 1 uses a near fact
  (9 × 4 is 10 × 4 take away one 4; 6 × 4 is 5 × 4 add one more 4) and
  doubling (4 × 7 is double 2 × 7); lesson 2 splits a fact into two
  facts (7 × 8 = 5 × 8 + 2 × 8) on an array, and ends with the skill
  check.
metadata:
  year: year-3
  topic: { de: Einmaleins, en: Times tables }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.core-facts, math.numbers-to-100.double-halve]
  also_practises: [math.mult-div.core-facts]
  vocabulary: { en: [near fact, double, split, array, row, core facts, times] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: near-fact, what: { de: mit einer Nachbaraufgabe rechnen, en: using a near fact (one group more or one group fewer) } }
    - { id: double, what: { de: eine bekannte Aufgabe verdoppeln, en: doubling a fact I know } }
    - { id: split, what: { de: in zwei Kernaufgaben zerlegen, en: splitting into two facts I know } }
    - { id: in-context, what: { de: Sachaufgaben mit schwierigen Einmaleinsaufgaben, en: word problems with harder facts } }
  misconceptions:
    - id: near-fact-one
      what: Takes away or adds 1 instead of one more group (9 × 4 = 40 − 1 = 39)
      addressed: lesson 1 Learn takes away one whole row of four; l1-f1 (with feedback), l1-s1 and l1-c1 offer the minus-one answer, l2-c1 the add-one answer
    - id: split-wrong-part
      what: Splits the number of rows but adds the wrong second fact (7 × 8 = 5 × 8 + 2, not + 2 × 8)
      addressed: lesson 2 Learn colours five rows red and two rows blue and says both parts are rows of six; l2-f1 (with feedback), l2-f3 and l2-s2 offer the answer that adds only 2
    - id: double-wrong-fact
      what: Doubles the answer of a fact that does not help (4 × 7 from double 4 × 2)
      addressed: lesson 1 Learn doubles 2 × 7 to get 4 × 7; l1-f4 asks which fact to double, with feedback
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Nachbaraufgaben und Verdoppeln, en: Near facts and doubling }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "10 × 6 = _"
            say: "Ten times six."
            answer: "60"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Double 14 = _"
            say: "Double fourteen."
            answer: "28"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "9 × 4 = 10 × 4 − 4"
            say: "Nine times four is hard. Ten times four is easy: forty. Nine fours are one four fewer, so take away one row of four. Forty take away four is thirty-six."
            show: { drawn: dots, array: [10, 4], split_rows: 9 }
          - text: "6 × 4 = 5 × 4 + 4"
            say: "Six times four. Five times four is twenty. Six fours are one four more. Twenty add four is twenty-four."
            show: { drawn: dots, array: [6, 4], split_rows: 5 }
          - text: "4 × 7 = double 2 × 7"
            say: "Four times seven. Two times seven is fourteen. Four is double two, so double fourteen. Four times seven is twenty-eight."
            show: { drawn: dots, array: [4, 7], split_rows: 2 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "9 × 5 = 10 × 5 − 5 = _"
                say: "Nine times five. Ten times five is fifty. Take away one five."
                show: { drawn: dots, array: [10, 5], split_rows: 9 }
                options: ["45", "49", "40"]
                answer: "45"
                feedback:
                  "49": "Take away a whole row of five, not just one dot."
                hints:
                  - "Ten fives, then one row of five fewer."
                  - "Fifty take away five."
                  - "45."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "6 × 5 is 5 × 5 and one more 5."
                say: "Six times five. Five times five is twenty-five. Add one more five."
                frame: "6 × 5 = 25 + _ = _"
                options: ["5", "1", "30", "26"]
                answer: ["5", "30"]
                hints:
                  - "Six fives are one five more than five fives."
                  - "Twenty-five add five."
                  - "5 and 30."
              - id: l1-f3
                type: text_input
                text: "4 × 6 = double 2 × 6 = _"
                say: "Four times six. Two times six is twelve. Double it."
                answer: "24"
                hints:
                  - "Four is double two."
                  - "Two times six is twelve. Double twelve."
                  - "24."
              - id: l1-f4
                type: multiple_choice
                text: "Which fact can you double to find 4 × 8?"
                say: "Which fact can you double to find four times eight?"
                options: ["2 × 8", "4 × 2", "2 × 4"]
                answer: "2 × 8"
                feedback:
                  "4 × 2": "Double four times two is sixteen, but four times eight is more. Keep the eight and halve the four."
                hints:
                  - "Keep the eight. Four is double what?"
                  - "Four is double two, so two times eight."
                  - "2 × 8."
              - id: l1-f5
                type: true_false
                text: "Is it true? 9 × 3 = 10 × 3 − 3"
                say: "Nine times three is ten times three take away three. Is that true?"
                answer: true
                hints:
                  - "Nine threes are one three fewer than ten threes."
                  - "Thirty take away three is twenty-seven, and nine threes are twenty-seven."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "10 × 8 = 80, so 9 × 8 = _"
                say: "Ten times eight is eighty. So what is nine times eight?"
                options: ["72", "79", "70"]
                answer: "72"
                hints: ["Take away one eight."]
              - id: l1-s2
                type: text_input
                text: "5 × 8 = 40, so 6 × 8 = _"
                say: "Five times eight is forty. So what is six times eight?"
                answer: "48"
                hints: ["Six eights are one eight more than five eights."]
              - id: l1-s3
                type: text_input
                text: "4 × 9 = double 2 × 9 = _"
                say: "Four times nine. Two times nine is eighteen. Double it."
                answer: "36"
                hints: ["Double eighteen."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 6 × 2 = 5 × 2 + 1"
                say: "Six times two is five times two add one. Is that true?"
                answer: false
                hints: ["One more row of two, not one more dot."]
              - id: l1-s5
                type: multiple_choice
                text: "Which near fact helps with 11 × 5?"
                say: "Which near fact helps you work out eleven times five?"
                options: ["10 × 5", "11 × 1", "2 × 5"]
                answer: "10 × 5"
                hints: ["Eleven is one more than which easy number?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "11 × 8 = _"
                say: "Eleven times eight."
                answer: "88"
              - id: l1-n2
                type: text_input
                text: "3 × 10 = 30. 3 × 9 = 27. 3 × 8 = _"
                say: "Three times ten is thirty. Three times nine is twenty-seven. What is three times eight?"
                answer: "24"
              - id: l1-n3
                type: multiple_choice
                text: "4 × 5 = _"
                say: "Four times five."
                options: ["20", "9", "16"]
                answer: "20"
              - id: l1-n4
                type: text_input
                text: "6 × 3 = _"
                say: "Six times three."
                answer: "18"
              - id: l1-n5
                type: true_false
                text: "Is it true? 4 × 8 = 32"
                say: "Four times eight is thirty-two. Is that true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "9 × 2 = 10 × 2 − 2 = _"
            say: "Nine times two. Ten times two is twenty. Take away one two."
            options: ["18", "19", "16"]
            answer: "18"
          - id: l1-c2
            type: text_input
            text: "11 × 3 = _"
            say: "Eleven times three."
            answer: "33"
          - id: l1-c3
            type: text_input
            text: "4 × 4 = _"
            say: "Four times four."
            answer: "16"
          - id: l1-c4
            type: true_false
            text: "Is it true? 9 × 10 = 10 × 10 − 1"
            say: "Nine times ten is ten times ten take away one. Is that true?"
            answer: false
          - id: l1-c5
            type: fill_in_blank
            text: "Use 5 × 3 to find 4 × 3."
            say: "Four times three. Five times three is fifteen. How much do you take away?"
            frame: "4 × 3 = 15 − _ = _"
            options: ["3", "1", "12", "14"]
            answer: ["3", "12"]
          - id: l1-c6
            type: text_input
            text: "4 × 5 = 20, so 8 × 5 = _"
            say: "Four times five is twenty. So what is eight times five?"
            answer: "40"

  - n: 2
    title: { de: In zwei Kernaufgaben zerlegen, en: Split into two facts }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "9 × 8 = _"
            say: "Nine times eight."
            answer: "72"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4 × 7 = double 2 × 7 = _"
            say: "Four times seven is double two times seven."
            options: ["28", "14", "24"]
            answer: "28"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 × 8"
            say: "Seven rows of eight. Seven times eight is hard to remember. Split the seven rows into five and two."
            show: { drawn: dots, array: [7, 8] }
          - text: "7 × 8 = 5 × 8 + 2 × 8"
            say: "Five rows of eight are red: forty. Two rows of eight are blue: sixteen. Both parts are rows of eight."
            show: { drawn: dots, array: [7, 8], split_rows: 5 }
          - text: "40 + 16 = 56"
            say: "Forty add sixteen is fifty-six. So seven times eight is fifty-six."
            show: { drawn: dots, array: [7, 8], split_rows: 5 }
          - text: "8 × 4 = 5 × 4 + 3 × 4 = 20 + 12 = 32"
            say: "Eight times four. Five fours are twenty. Three fours are twelve. Twenty add twelve is thirty-two."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "7 × 4 = 5 × 4 + 2 × 4 = _"
                say: "Seven times four. Five fours and two fours."
                show: { drawn: dots, array: [7, 4], split_rows: 5 }
                options: ["28", "22", "20"]
                answer: "28"
                feedback:
                  "22": "The blue part is two rows of four, which is eight, not two. Twenty add eight."
                hints:
                  - "Find the red part, then the blue part."
                  - "Five fours are twenty. Two fours are eight."
                  - "28."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "6 × 3 = 5 × 3 + 1 × 3"
                say: "Six times three. Five threes and one three. Fill the gaps."
                frame: "6 × 3 = _ + _ = _"
                options: ["15", "3", "18", "16"]
                answer: ["15", "3", "18"]
                hints:
                  - "Five threes first."
                  - "Five threes are fifteen, and one three is three."
                  - "15 + 3 = 18."
              - id: l2-f3
                type: multiple_choice
                text: "Which split works for 8 × 3?"
                say: "Which split works for eight times three?"
                show: { drawn: dots, array: [8, 3], split_rows: 5 }
                options: ["5 × 3 + 3 × 3", "5 × 3 + 3", "8 × 2 + 3"]
                answer: "5 × 3 + 3 × 3"
                hints:
                  - "Count the red rows and the blue rows."
                  - "Five rows of three and three rows of three."
                  - "5 × 3 + 3 × 3."
              - id: l2-f4
                type: text_input
                text: "7 × 5 = 5 × 5 + 2 × 5 = _"
                say: "Seven times five. Five fives and two fives."
                answer: "35"
                hints:
                  - "Five fives are twenty-five."
                  - "Two fives are ten. Twenty-five add ten."
                  - "35."
              - id: l2-f5
                type: true_false
                text: "Is it true? 6 × 4 = 5 × 4 + 1 × 4"
                say: "Six times four is five times four add one times four. Is that true?"
                answer: true
                hints:
                  - "Six rows of four are five rows and one more row."
                  - "Twenty add four is twenty-four, and six fours are twenty-four."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "8 × 5 = 5 × 5 + 3 × 5 = _"
                say: "Eight times five. Five fives and three fives."
                answer: "40"
                hints: ["Twenty-five add fifteen."]
              - id: l2-s2
                type: multiple_choice
                text: "7 × 3 = 5 × 3 + 2 × 3 = _"
                say: "Seven times three. Five threes and two threes."
                show: { drawn: dots, array: [7, 3], split_rows: 5 }
                options: ["21", "17", "15"]
                answer: "21"
                hints: ["Fifteen add six."]
              - id: l2-s3
                type: fill_in_blank
                text: "8 × 6 = 5 × 6 + 3 × 6"
                say: "Eight times six. Five sixes and three sixes. Fill the gaps."
                frame: "8 × 6 = _ + _ = _"
                options: ["30", "18", "48", "33"]
                answer: ["30", "18", "48"]
                hints: ["Five sixes are thirty. Three sixes are eighteen."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 7 × 4 = 5 × 4 + 2"
                say: "Seven times four is five times four add two. Is that true?"
                answer: false
                hints: ["The second part is two rows of four."]
              - id: l2-s5
                type: multiple_choice
                text: "Which split works for 6 × 8?"
                say: "Which split works for six times eight?"
                options: ["5 × 8 + 1 × 8", "5 × 8 + 1", "6 × 5 + 3"]
                answer: "5 × 8 + 1 × 8"
                hints: ["Five rows of eight and one more row of eight."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "There are 7 rows of chairs with 5 chairs in each row. How many chairs?"
                say: "There are seven rows of chairs, with five chairs in each row. How many chairs are there?"
                answer: "35"
              - id: l2-n2
                type: text_input
                text: "A box has 4 cakes. How many cakes are in 9 boxes?"
                say: "A box has four cakes. How many cakes are in nine boxes?"
                answer: "36"
              - id: l2-n3
                type: multiple_choice
                text: "Tom has 4 bags with 7 marbles in each. How many marbles?"
                say: "Tom has four bags with seven marbles in each. How many marbles does he have?"
                options: ["28", "11", "21"]
                answer: "28"
              - id: l2-n4
                type: text_input
                text: "A garden has 8 rows of 3 plants. How many plants?"
                say: "A garden has eight rows of three plants. How many plants are there?"
                answer: "24"
              - id: l2-n5
                type: multiple_choice
                text: "Stickers come in sheets of 4. Lily has 8 sheets. How many stickers?"
                say: "Stickers come in sheets of four. Lily has eight sheets. How many stickers does she have?"
                options: ["32", "28", "12"]
                answer: "32"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: near-fact
            type: multiple_choice
            text: "11 × 4 = _"
            say: "Eleven times four."
            options: ["44", "41", "40"]
            answer: "44"
          - id: l2-c2
            part: near-fact
            type: text_input
            text: "6 × 4 = _"
            say: "Six times four."
            answer: "24"
          - id: l2-c3
            part: double
            type: multiple_choice
            text: "Which fact can you double to find 8 × 3?"
            say: "Which fact can you double to find eight times three?"
            options: ["4 × 3", "8 × 2", "2 × 3"]
            answer: "4 × 3"
          - id: l2-c4
            part: split
            type: text_input
            text: "6 × 7 = 5 × 7 + 1 × 7 = _"
            say: "Six times seven. Five sevens and one seven."
            answer: "42"
          - id: l2-c5
            part: split
            type: true_false
            text: "Is it true? 8 × 7 = 5 × 7 + 3"
            say: "Eight times seven is five times seven add three. Is that true?"
            answer: false
          - id: l2-c6
            part: near-fact
            type: true_false
            text: "Is it true? 11 × 2 = 10 × 2 + 2"
            say: "Eleven times two is ten times two add two. Is that true?"
            answer: true
          - id: l2-c7
            part: near-fact
            type: fill_in_blank
            text: "Use 5 × 5 to find 4 × 5."
            say: "Four times five. Five times five is twenty-five. How much do you take away?"
            frame: "4 × 5 = 25 − _ = _"
            options: ["5", "1", "20", "24"]
            answer: ["5", "20"]
          - id: l2-c8
            part: near-fact
            type: multiple_choice
            text: "10 × 9 = 90, so 9 × 9 = _"
            say: "Ten times nine is ninety. So what is nine times nine?"
            options: ["81", "89", "80"]
            answer: "81"
          - id: l2-c9
            part: double
            type: fill_in_blank
            text: "Double 4 × 6 to find 8 × 6."
            say: "Eight times six. Work out four times six, then double it."
            frame: "4 × 6 = _, so 8 × 6 = _"
            options: ["24", "48", "30", "44"]
            answer: ["24", "48"]
          - id: l2-c10
            part: double
            type: true_false
            text: "Is it true? 8 × 2 = 4 × 2 + 2"
            say: "Eight times two is four times two add two. Is that true?"
            answer: false
          - id: l2-c11
            part: double
            type: text_input
            text: "3 × 6 = 18, so 6 × 6 = _"
            say: "Three times six is eighteen. So what is six times six?"
            answer: "36"
          - id: l2-c12
            part: double
            type: multiple_choice
            text: "Which fact can you double to find 6 × 5?"
            say: "Which fact can you double to find six times five?"
            options: ["3 × 5", "6 × 2", "2 × 5"]
            answer: "3 × 5"
          - id: l2-c13
            part: split
            type: fill_in_blank
            text: "Split 9 × 3 into 5 × 3 and 4 × 3."
            say: "Nine times three. Work out five threes and four threes, then add them."
            show: { drawn: dots, array: [9, 3], split_rows: 5 }
            frame: "9 × 3 = _ + _ = _"
            options: ["15", "12", "27", "19"]
            answer: ["15", "12", "27"]
          - id: l2-c14
            part: split
            type: true_false
            text: "Is it true? 7 × 6 = 5 × 6 + 2 × 6"
            say: "Seven times six is five times six add two times six. Is that true?"
            answer: true
          - id: l2-c15
            part: split
            type: text_input
            text: "7 × 9 = 5 × 9 + 2 × 9 = _"
            say: "Seven times nine. Five nines and two nines."
            answer: "63"
          - id: l2-c16
            part: in-context
            type: text_input
            text: "A box holds 6 eggs. How many eggs are in 9 boxes?"
            say: "A box holds six eggs. How many eggs are in nine boxes?"
            answer: "54"
          - id: l2-c17
            part: in-context
            type: multiple_choice
            text: "Ben swims 3 lengths every day. How many lengths does he swim in 11 days?"
            say: "Ben swims three lengths every day. How many lengths does he swim in eleven days?"
            options: ["33", "14", "30"]
            answer: "33"
          - id: l2-c18
            part: in-context
            type: text_input
            text: "A spider has 8 legs. How many legs do 9 spiders have?"
            say: "A spider has eight legs. How many legs do nine spiders have?"
            answer: "72"
          - id: l2-c19
            part: in-context
            type: text_input
            text: "A cinema ticket costs £5. How much do 9 tickets cost? Type the pounds."
            say: "A cinema ticket costs five pounds. How much do nine tickets cost? Type the pounds."
            answer: "45"
          - id: l2-c20
            part: in-context
            type: true_false
            text: "A box has 3 pencils. Is it true? 6 boxes have 21 pencils."
            say: "A box has three pencils. Six boxes have twenty-one pencils. Is that true?"
            answer: false
