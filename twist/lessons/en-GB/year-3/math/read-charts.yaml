# Lesson set: Maths, Year 3. Hand-authored draft.
id: en-GB.math.read-charts
skill: math.data.read-charts
curriculum: en-GB
language: en
title:
  de: Diagramme lesen
  en: Reading bar charts and pictograms
summary: >
  Lesson 1 reads bar charts whose scale goes up in fives, tens, twenties,
  fifties and hundreds (read the steps first, then the number at the end
  of the bar, not the number of lines), bars that end halfway between two
  lines, and pictograms where one picture stands for 10. Lesson 2 compares
  the values (the most, how many more, together, twice as many), puts
  them in order, decides which sentences the chart supports and which it
  cannot tell (how many, not why), and ends with the skill check. Drawing
  a chart with a scale waits for a drawing task.
metadata:
  year: year-3
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.data.pictograms-bar-charts, math.numbers-to-1000.number-line]
  also_practises: [math.numbers-to-1000.number-line]
  vocabulary: { en: [bar chart, pictogram, scale, key, most, fewest, how many more, altogether, twice as many] }
  forms: [text, audio, drawn]
  drawn: [bar-chart, number-line]
  facets: []
  parts:
    - { id: read, what: { de: Werte an der Skala eines Säulendiagramms ablesen, en: reading values off the scale of a bar chart } }
    - { id: pictogram, what: { de: Bilddiagramme mit Legende lesen, en: reading pictograms with a key } }
    - { id: compare, what: { de: "Werte vergleichen, ordnen und zusammenrechnen", en: "comparing, ordering and adding values" } }
    - { id: conclude, what: { de: "sagen, was ein Diagramm zeigt und was nicht", en: saying what a chart shows and what it does not } }
  misconceptions:
    - id: counts-lines
      what: Counts the lines up to the end of the bar instead of reading the scale, so a scale in tens or hundreds gives 8 for 80 or 5 for 500
      addressed: lesson 1 Learn reads the steps first; l1-f1 and l1-f2 have feedback, l1-f4, l1-s1, l1-s3, l1-n1, l1-c1 and l2-c1 offer the number of lines
    - id: between-lines
      what: Reads a bar that ends between two lines as the line below or above
      addressed: lesson 1 Learn reads a bar halfway between 40 and 50 as 45; l1-f3 has feedback, l1-s2, l1-s5, l1-n3, l1-c2 and l2-c2
    - id: sum-for-difference
      what: Adds the two values when the question asks how many more
      addressed: lesson 2 Learn finds a difference by subtracting; l2-f2 has feedback, l2-s2 and l2-c3 offer the total
    - id: reads-in-the-why
      what: Takes a reason or an opinion from the chart that it does not show
      addressed: lesson 2 Learn says a chart shows how many, not why; l2-f4 has feedback, l2-s5, l2-n5 and l2-c5
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Skalen ablesen, en: Reading the scale }
    goal:
      de: "Lies zuerst die Skala eines Säulendiagramms und schau dann, wo jede Säule endet, so wie in der Mitte zwischen 40 und 50 ist 45."
      en: "Read the scale of a bar chart first, then see where each bar ends, like halfway between 40 and 50 is 45."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Pets in our class. How many children have a cat?"
            show: { drawn: bar-chart, rows: [["Dogs", 6], ["Cats", 4], ["Fish", 2]] }
            options: ["4", "6", "2"]
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which number does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 600 }
            options: ["600", "6", "500"]
            answer: "600"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Books borrowed from the library\nOn which day were the most books borrowed?"
            say: "This bar chart shows how many books were borrowed from the library. On which day do you think the most books were borrowed? Have a guess, then we'll read the chart."
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 30], ["Tue", 50], ["Wed", 70]] }
          - text: "Books borrowed from the library"
            say: "Wednesday has the longest bar. But how many books is that? Read the scale first. Here it goes up in tens: ten, twenty, thirty. Then look where the bar ends. Wednesday's bar ends at seventy, so seventy books were borrowed on Wednesday."
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 30], ["Tue", 50], ["Wed", 70]] }
          - text: "Halfway between 40 and 50 is 45."
            say: "Monday's bar stops halfway between the forty line and the fifty line. Halfway between forty and fifty is forty-five."
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 45], ["Tue", 20]] }
          - text: "This scale goes up in hundreds."
            say: "This scale goes up in hundreds. Saturday's bar ends at the third line. That is three hundred, not three."
            show: { drawn: bar-chart, step: 100, rows: [["Sat", 300], ["Sun", 500]] }
          - text: "Each star stands for 10. Half a star is 5."
            say: "In a pictogram, look at the key first. Each star stands for ten points. Half a star stands for five. Class 3A has three stars and a half: thirty-five points."
            show: { drawn: bar-chart, pictogram_object: star, key: 10, rows: [["3A", 35], ["3B", 20]] }
          - text: "Did you know? Florence Nightingale, the famous nurse, drew charts to change hospitals."
            say: "Did you know? Florence Nightingale was a famous nurse. She counted how many soldiers died in army hospitals, and drew charts to show that many more died from illness than from their wounds. Her charts helped to make hospitals much cleaner."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Favourite colours in Class 3. How many children chose blue?"
                show: { drawn: bar-chart, step: 5, rows: [["Red", 15], ["Blue", 25], ["Green", 10]] }
                options: ["25", "5", "20"]
                answer: "25"
                feedback:
                  "5": "That is the number of lines. Each line is worth 5, so read the number on the scale."
                hints:
                  - "Read the scale first. What does it go up in?"
                  - "It goes up in fives. Follow the top of the blue bar across to the scale."
                  - "The blue bar ends at 25."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Children who walk to school. How many in Year 5?"
                show: { drawn: bar-chart, step: 10, rows: [["Year 3", 60], ["Year 4", 40], ["Year 5", 80]] }
                answer: "80"
                feedback:
                  "8": "The bar reaches the eighth line, but each line is worth 10."
                hints:
                  - "What does the scale go up in?"
                  - "It goes up in tens. Count along: 10, 20, 30 ..."
                  - "The Year 5 bar ends at 80."
              - id: l1-f3
                type: multiple_choice
                text: "Fruit sold at the tuck shop. How many apples?"
                show: { drawn: bar-chart, step: 10, rows: [["Apples", 35], ["Bananas", 50], ["Pears", 20]] }
                options: ["35", "30", "40"]
                answer: "35"
                feedback:
                  "30": "The bar goes past 30. It ends halfway between 30 and 40."
                  "40": "The bar does not reach 40. It ends halfway between 30 and 40."
                hints:
                  - "Does the apples bar end on a line?"
                  - "It ends between the 30 line and the 40 line, right in the middle."
                  - "Halfway between 30 and 40 is 35."
              - id: l1-f4
                type: true_false
                text: "Visitors to the museum. Is it true? 5 people came on Tuesday."
                show: { drawn: bar-chart, step: 100, rows: [["Mon", 300], ["Tue", 500], ["Wed", 200]] }
                answer: false
                hints:
                  - "Look at the numbers on the scale."
                  - "The scale goes up in hundreds, not ones."
                  - "No. The Tuesday bar ends at 500, so 500 people came."
              - id: l1-f5
                type: multiple_choice
                text: "Each star stands for 10 house points. How many points has Class 3B?"
                show: { drawn: bar-chart, pictogram_object: star, key: 10, rows: [["3A", 30], ["3B", 25]] }
                options: ["25", "3", "20"]
                answer: "25"
                hints:
                  - "Look at the key. What is one star worth?"
                  - "Two whole stars are 20. Half a star is 5."
                  - "20 + 5 = 25 points."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Favourite sports. How many children chose swimming?"
                show: { drawn: bar-chart, step: 20, rows: [["Football", 80], ["Swimming", 60], ["Tennis", 40]] }
                options: ["60", "3", "50"]
                answer: "60"
                hints: ["The scale goes up in twenties."]
              - id: l1-s2
                type: text_input
                text: "Cars in the car park. How many on Monday?"
                show: { drawn: bar-chart, step: 10, rows: [["Mon", 25], ["Tue", 40], ["Wed", 15]] }
                answer: "25"
                hints: ["The bar ends halfway between two lines."]
              - id: l1-s3
                type: multiple_choice
                text: "Cakes sold at the café. How many in February?"
                show: { drawn: bar-chart, step: 50, rows: [["Jan", 150], ["Feb", 250], ["Mar", 100]] }
                options: ["250", "5", "200"]
                answer: "250"
                hints: ["The scale goes up in fifties."]
              - id: l1-s4
                type: true_false
                text: "Each picture stands for 10 children. Is it true? 55 children have a school dinner."
                show: { drawn: bar-chart, pictogram_object: child, key: 10, rows: [["Packed lunch", 40], ["School dinner", 55]] }
                answer: true
                hints: ["Half a picture stands for 5."]
              - id: l1-s5
                type: multiple_choice
                text: "Pages read this week. How many pages did Year 3 read?"
                show: { drawn: bar-chart, step: 100, rows: [["Year 3", 450], ["Year 4", 300]] }
                options: ["450", "400", "500"]
                answer: "450"
                hints: ["Halfway between 400 and 500."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Pets of children in Year 3. How many have a dog?"
                show: { drawn: bar-chart, step: 5, rows: [["Cats", 20], ["Dogs", 35], ["Rabbits", 10]] }
                options: ["35", "7", "30"]
                answer: "35"
              - id: l1-n2
                type: text_input
                text: "Ice creams sold. How many on Sunday?"
                show: { drawn: bar-chart, step: 10, rows: [["Sat", 70], ["Sun", 90]] }
                answer: "90"
              - id: l1-n3
                type: multiple_choice
                text: "Favourite colours in Year 4. How many chose red?"
                show: { drawn: bar-chart, step: 20, rows: [["Red", 50], ["Blue", 80], ["Yellow", 30]] }
                options: ["50", "40", "60"]
                answer: "50"
              - id: l1-n4
                type: text_input
                text: "Tickets sold for the school play. How many on Tuesday?"
                show: { drawn: bar-chart, step: 100, rows: [["Mon", 600], ["Tue", 250]] }
                answer: "250"
              - id: l1-n5
                type: multiple_choice
                text: "Each star stands for 10 points. How many points has Team A?"
                show: { drawn: bar-chart, pictogram_object: star, key: 10, rows: [["Team A", 45], ["Team B", 60]] }
                options: ["45", "5", "40"]
                answer: "45"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Bikes in the bike shed. How many on Wednesday?"
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 50], ["Tue", 30], ["Wed", 60]] }
            options: ["60", "6", "50"]
            answer: "60"
          - id: l1-c2
            type: multiple_choice
            text: "Lunch choices. How many children chose pizza?"
            show: { drawn: bar-chart, step: 10, rows: [["Pizza", 45], ["Pasta", 30]] }
            options: ["45", "40", "50"]
            answer: "45"
          - id: l1-c3
            type: text_input
            text: "Visitors to the park. How many came on Saturday?"
            show: { drawn: bar-chart, step: 100, rows: [["Sat", 400], ["Sun", 700]] }
            answer: "400"
          - id: l1-c4
            type: multiple_choice
            text: "Apples picked at the farm. How many on Tuesday?"
            show: { drawn: bar-chart, step: 20, rows: [["Mon", 40], ["Tue", 80]] }
            options: ["80", "4", "60"]
            answer: "80"
          - id: l1-c5
            type: multiple_choice
            text: "Each star stands for 10 points. How many points has Class 3C?"
            show: { drawn: bar-chart, pictogram_object: star, key: 10, rows: [["3C", 15], ["3D", 40]] }
            options: ["15", "2", "10"]
            answer: "15"
          - id: l1-c6
            type: text_input
            text: "Letters posted at the post office. How many on Thursday?"
            show: { drawn: bar-chart, step: 50, rows: [["Wed", 100], ["Thu", 150]] }
            answer: "150"

  - n: 2
    title: { de: Vergleichen und Schlüsse ziehen, en: Comparing and drawing conclusions }
    goal:
      de: "Vergleiche die Säulen in einem Diagramm, zum Beispiel, wie viele Kinder am Dienstag mehr kamen als am Montag."
      en: "Compare the bars in a chart, like how many more children came on Tuesday than on Monday."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Books returned to the library. How many on Tuesday?"
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 40], ["Tue", 70]] }
            options: ["70", "7", "60"]
            answer: "70"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Favourite colours. How many chose green?"
            show: { drawn: bar-chart, step: 5, rows: [["Red", 15], ["Green", 20]] }
            options: ["20", "4", "15"]
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Children at the library\nTwice as many on one day?"
            say: "This chart shows how many children came to the library each day. Do you think twice as many children came on one day as on another? Have a guess."
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 30], ["Tue", 60], ["Wed", 20], ["Thu", 50]] }
          - text: "Children at the library. Most: Tuesday. Fewest: Wednesday."
            say: "Let's read the chart. The tallest bar shows the most. Most children came on Tuesday. The shortest bar shows the fewest: Wednesday."
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 30], ["Tue", 60], ["Wed", 20], ["Thu", 50]] }
          - text: "How many more on Tuesday than on Monday?\n60 − 30 = 30"
            say: "How many more came on Tuesday than on Monday? Find the difference: sixty take away thirty is thirty. Thirty more children."
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 30], ["Tue", 60], ["Wed", 20], ["Thu", 50]] }
          - text: "Monday and Tuesday together: 30 + 60 = 90\nTuesday is twice Monday: 60 = 2 × 30"
            say: "Together means add: thirty and sixty make ninety. Sixty is two lots of thirty, so twice as many children came on Tuesday as on Monday."
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 30], ["Tue", 60], ["Wed", 20], ["Thu", 50]] }
          - text: "A chart shows how many. It does not show why."
            say: "A chart tells you how many. It does not tell you why. This chart shows that most children came on Tuesday, but not the reason."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Children at after-school clubs. Which club has the most children?"
                show: { drawn: bar-chart, step: 10, rows: [["Art", 40], ["Football", 70], ["Choir", 30], ["Chess", 20]] }
                options: ["Football", "Art", "Chess"]
                answer: "Football"
                hints:
                  - "The most means the biggest number."
                  - "Look for the tallest bar."
                  - "Football has the tallest bar: 70 children."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Children at after-school clubs. How many more children go to Football than to Art?"
                show: { drawn: bar-chart, step: 10, rows: [["Art", 40], ["Football", 70], ["Choir", 30], ["Chess", 20]] }
                answer: "30"
                feedback:
                  "110": "That is both clubs together. How many more means the difference: 70 − 40."
                hints:
                  - "Read both bars first."
                  - "Football 70, Art 40. Find the difference."
                  - "70 − 40 = 30 more."
              - id: l2-f3
                type: multiple_choice
                text: "Children at after-school clubs. How many go to Choir and Chess together?"
                show: { drawn: bar-chart, step: 10, rows: [["Art", 40], ["Football", 70], ["Choir", 30], ["Chess", 20]] }
                options: ["50", "10", "5"]
                answer: "50"
                hints:
                  - "Together means add."
                  - "Choir 30, Chess 20."
                  - "30 + 20 = 50."
              - id: l2-f4
                type: multiple_choice
                text: "Children at after-school clubs. Which sentence does the chart show?"
                show: { drawn: bar-chart, step: 10, rows: [["Art", 40], ["Football", 70], ["Choir", 30], ["Chess", 20]] }
                options: ["Twice as many children go to Art as to Chess.", "Chess is the most boring club.", "Football is best because it is outside."]
                answer: "Twice as many children go to Art as to Chess."
                feedback:
                  "Football is best because it is outside.": "The chart shows how many children go, not why they like a club."
                  "Chess is the most boring club.": "That is an opinion. The chart only shows how many children go."
                hints:
                  - "The chart shows numbers only."
                  - "Art has 40 and Chess has 20. Is 40 two lots of 20?"
                  - "Yes: twice as many go to Art as to Chess."
              - id: l2-f5
                type: ordering
                text: "Put the clubs in order, most children first."
                show: { drawn: bar-chart, step: 10, rows: [["Art", 40], ["Football", 70], ["Choir", 30], ["Chess", 20]] }
                options: ["Art", "Football", "Choir", "Chess"]
                slot_count: 4
                answer: ["Football", "Art", "Choir", "Chess"]
                hints:
                  - "Start with the tallest bar."
                  - "Football 70, then Art 40, then the next tallest."
                  - "Football, Art, Choir, Chess."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Cakes sold at the school fair. On which day were the fewest cakes sold?"
                show: { drawn: bar-chart, step: 50, rows: [["Fri", 150], ["Sat", 300], ["Sun", 250]] }
                options: ["Fri", "Sat", "Sun"]
                answer: "Fri"
                hints: ["Look for the shortest bar."]
              - id: l2-s2
                type: multiple_choice
                text: "Cakes sold at the school fair. How many more cakes were sold on Saturday than on Friday?"
                show: { drawn: bar-chart, step: 50, rows: [["Fri", 150], ["Sat", 300], ["Sun", 250]] }
                options: ["150", "450", "3"]
                answer: "150"
                hints: ["How many more means take away: 300 − 150."]
              - id: l2-s3
                type: text_input
                text: "Cakes sold at the school fair. How many were sold on Saturday and Sunday together?"
                show: { drawn: bar-chart, step: 50, rows: [["Fri", 150], ["Sat", 300], ["Sun", 250]] }
                answer: "550"
                hints: ["300 + 250."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Twice as many cakes were sold on Saturday as on Friday."
                show: { drawn: bar-chart, step: 50, rows: [["Fri", 150], ["Sat", 300], ["Sun", 250]] }
                answer: true
                hints: ["What is 150 + 150?"]
              - id: l2-s5
                type: multiple_choice
                text: "Cakes sold at the school fair. Which sentence does the chart show?"
                show: { drawn: bar-chart, step: 50, rows: [["Fri", 150], ["Sat", 300], ["Sun", 250]] }
                options: ["More cakes were sold on Sunday than on Friday.", "It rained on Friday.", "Chocolate cake sold best."]
                answer: "More cakes were sold on Sunday than on Friday."
                hints: ["The chart shows how many cakes, nothing about the weather or the flavours."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Bottles collected for recycling. On which day were the most bottles collected?"
                show: { drawn: bar-chart, step: 100, rows: [["Mon", 400], ["Tue", 700], ["Wed", 500], ["Thu", 300]] }
                options: ["Tue", "Wed", "Mon"]
                answer: "Tue"
              - id: l2-n2
                type: text_input
                text: "Bottles collected for recycling. How many more bottles were collected on Tuesday than on Thursday?"
                show: { drawn: bar-chart, step: 100, rows: [["Mon", 400], ["Tue", 700], ["Wed", 500], ["Thu", 300]] }
                answer: "400"
              - id: l2-n3
                type: text_input
                text: "Bottles collected for recycling. How many were collected on Monday and Wednesday together?"
                show: { drawn: bar-chart, step: 100, rows: [["Mon", 400], ["Tue", 700], ["Wed", 500], ["Thu", 300]] }
                answer: "900"
              - id: l2-n4
                type: true_false
                text: "Is it true? They collected 1000 bottles on Monday and Tuesday together."
                show: { drawn: bar-chart, step: 100, rows: [["Mon", 400], ["Tue", 700], ["Wed", 500], ["Thu", 300]] }
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Bottles collected for recycling. Which sentence does the chart show?"
                show: { drawn: bar-chart, step: 100, rows: [["Mon", 400], ["Tue", 700], ["Wed", 500], ["Thu", 300]] }
                options: ["Fewer bottles were collected on Thursday than on Monday.", "People drink more on Tuesdays.", "Next week they will collect more."]
                answer: "Fewer bottles were collected on Thursday than on Monday."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "Favourite sports in Year 4. How many chose running?"
            show: { drawn: bar-chart, step: 20, rows: [["Swim", 60], ["Run", 100], ["Cycle", 40]] }
            options: ["100", "5", "80"]
            answer: "100"
          - id: l2-c2
            part: read
            type: multiple_choice
            text: "School lunches eaten. How many on Monday?"
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 55], ["Tue", 30]] }
            options: ["55", "50", "60"]
            answer: "55"
          - id: l2-c3
            part: compare
            type: multiple_choice
            text: "Pages read in a month. How many more pages did Year 4 read than Year 3?"
            show: { drawn: bar-chart, step: 100, rows: [["Year 3", 600], ["Year 4", 800]] }
            options: ["200", "1400", "2"]
            answer: "200"
          - id: l2-c4
            part: pictogram
            type: multiple_choice
            text: "Each star stands for 10 points. How many points has the red team?"
            show: { drawn: bar-chart, pictogram_object: star, key: 10, rows: [["Red team", 35], ["Blue team", 50]] }
            options: ["35", "4", "30"]
            answer: "35"
          - id: l2-c5
            part: conclude
            type: multiple_choice
            text: "Children at the park. Which sentence does the chart show?"
            show: { drawn: bar-chart, step: 10, rows: [["Sun", 80], ["Mon", 20], ["Tue", 40]] }
            options: ["Twice as many children came on Tuesday as on Monday.", "It was sunny on Sunday.", "The park is closed on Mondays."]
            answer: "Twice as many children came on Tuesday as on Monday."
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "Bags of litter picked up by each class. How many bags did Class 3C fill?"
            show: { drawn: bar-chart, step: 5, rows: [["3A", 30], ["3B", 15], ["3C", 40]] }
            options: ["40", "8", "35"]
            answer: "40"
          - id: l2-c7
            part: read
            type: text_input
            text: "Points scored in a quiz. How many points did Ali score?"
            show: { drawn: bar-chart, step: 50, rows: [["Ali", 350], ["Bea", 200], ["Cal", 400]] }
            answer: "350"
          - id: l2-c8
            part: read
            type: multiple_choice
            text: "Tickets sold at the cinema. How many on Friday?"
            show: { drawn: bar-chart, step: 100, rows: [["Thu", 200], ["Fri", 650]] }
            options: ["650", "600", "7"]
            answer: "650"
          - id: l2-c9
            part: pictogram
            type: multiple_choice
            text: "How children get to school. Each picture stands for 10 children. How many children walk?"
            show: { drawn: bar-chart, pictogram_object: child, key: 10, rows: [["Walk", 60], ["Car", 25], ["Bus", 30]] }
            options: ["60", "6", "50"]
            answer: "60"
          - id: l2-c10
            part: pictogram
            type: text_input
