# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.joined-legible
skill: lit-en.handwriting.joined-legible
curriculum: en-GB
language: en
title:
  de: Gut lesbar verbunden schreiben
  en: Neat, joined handwriting
summary: >
  Children make their joined handwriting easy to read. Lesson 1 takes
  size and slope: small letters the same height, tall letters reaching
  higher, tails going below the line, and downstrokes that are parallel
  (all leaning the same way). Lesson 2 takes spacing: even gaps between
  letters, a clear gap between words, and joining whole words and short
  phrases neatly; it ends with the skill check. Every writing-lines task
  uses `script: joined`, so the model follows the school's handwriting
  scheme, a setting; tasks teach only what holds in every scheme. The
  app does not yet judge the size, slope or spacing of the child's own
  writing: any ink counts, so the skill check uses choice tasks.
metadata:
  year: year-3
  topic: { de: Handschrift, en: Handwriting }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.handwriting.start-joining]
  also_practises: [lit-en.handwriting.size-spacing]
  vocabulary: { en: [legible, consistent, downstroke, parallel, slope, tall letter, tail, spacing, join, unjoined] }
  forms: [drawn, text, audio]
  drawn: [writing-lines, letter-card]
  facets: [script]
  misconceptions:
    - id: neat-means-big
      what: Thinks neat writing means big, slow letters, and lets small letters grow as tall as tall letters
      addressed: Learn screens 1 and 2 of lesson 1; l1-f1, l1-f3, l1-s1 and l1-c1 ask about letter heights, with feedback in l1-f1
    - id: slopes-mixed
      what: Lets downstrokes lean different ways in one word, so it looks wobbly
      addressed: Learn screen 3 of lesson 1; l1-f5, l1-s3, l1-n3 and l2-c2, with feedback in l1-f5
    - id: joined-no-gaps
      what: Joins one word on to the next, or leaves gaps inside a word, because joined writing feels like one long line
      addressed: Learn of lesson 2; l2-f1, l2-f3, l2-s1, l2-n1 and l2-c3, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Größe und Neigung, en: Size and slope }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which join takes the a to the n in an?"
            options: ["a diagonal join", "a horizontal join"]
            answer: "a diagonal join"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: tracing
            text: "Trace the join."
            say: "Trace on. The o finishes at the top, so the join runs across to the n."
            show: { drawn: writing-lines, text: "on", mode: trace, arrows: true, script: joined }
            char: "on"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Legible means easy to read.\nConsistent means the same every time."
            say: "Your handwriting is joined now. This year we make it legible, which means easy to read, and consistent, which means your letters look the same every time you write them."
            show: { drawn: writing-lines, text: "nice", mode: trace, arrows: false, script: joined }
          - text: "small letters: a c e m n o\ntall letters: b d h k l\ntails below the line: g j p q y"
            say: "Small letters are all the same height. Tall letters reach up higher, all to the same height. Letters with tails go down below the line, all the same depth."
            show: { drawn: writing-lines, text: "bag", mode: trace, arrows: false, script: joined }
          - text: "Downstrokes are parallel."
            say: "A downstroke is a line you pull down, like the stick of l or the side of d. In neat writing all the downstrokes are parallel: they all lean the same way, or all stand straight, like the lines on a fence."
            show: { drawn: writing-lines, text: "hill", mode: trace, arrows: false, script: joined }
          - text: "Follow your school's model."
            say: "Your school has its own handwriting style. The letters on the lines show it. Follow the model, and keep your size and slope the same all the way along."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "In neat writing, how tall is the letter n?"
                options: ["the same height as a, c and e", "as tall as l and h", "below the line, like g"]
                answer: "the same height as a, c and e"
                feedback:
                  "as tall as l and h": "n is a small letter. If it grows as tall as l, the reader cannot tell n from h so easily."
                hints:
                  - "Is n a small letter or a tall letter?"
                  - "n has no stick going up and no tail going down."
                  - "The same height as a, c and e."
                difficulty: easy
              - id: l1-f2
                type: tracing
                text: "Trace the word."
                say: "Trace dog. The d is tall, the o is small, the g has a tail below the line."
                show: { drawn: writing-lines, text: "dog", mode: trace, arrows: true, script: joined }
                char: "dog"
              - id: l1-f3
                type: highlight_in_text
                text: "Tap every tall letter."
                say: "Tap every letter that reaches up higher than the small letters."
                show: { drawn: letter-card, text: "b e k o d m" }
                spans: ["b", "k", "d"]
                option_audio: false
                hints:
                  - "Tall letters have a stick that goes up."
                  - "Look for b, d, h, k and l."
                  - "b, k and d."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap every letter with a tail below the line."
                say: "Tap every letter that goes down below the line."
                show: { drawn: letter-card, text: "p a y n j c" }
                spans: ["p", "y", "j"]
                option_audio: false
                hints:
                  - "Which letters hang down, like a monkey's tail?"
                  - "Look for g, j, p, q and y."
                  - "p, y and j."
              - id: l1-f5
                type: multiple_choice
                text: "What should the downstrokes in a word look like?"
                options: ["parallel, all leaning the same way", "each one leaning a different way", "as curly as possible"]
                answer: "parallel, all leaning the same way"
                feedback:
                  "each one leaning a different way": "Mixed slopes make a word look wobbly and harder to read. Keep them parallel, like a fence."
                hints:
                  - "Think of the posts in a fence."
                  - "They all point the same way."
                  - "Parallel, all leaning the same way."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "The letter e should be as tall as the letter l."
                say: "Read it. Is it true?"
                answer: false
                hints: ["e is a small letter; l is a tall letter."]
              - id: l1-s2
                type: tracing
                text: "Trace the word."
                say: "Trace help. Keep the downstrokes of h and l parallel."
                show: { drawn: writing-lines, text: "help", mode: trace, arrows: true, script: joined }
                char: "help"
              - id: l1-s3
                type: multiple_choice
                text: "Sam's l, h and d each lean a different way. What should he change?"
                options: ["Make the downstrokes parallel.", "Write the letters bigger.", "Stop joining the letters."]
                answer: "Make the downstrokes parallel."
                hints: ["What makes a word look wobbly?"]
              - id: l1-s4
                type: sorting
                text: "Sort the letters by size."
                say: "Put each letter in the right group: small, tall, or with a tail."
                option_audio: false
                bins:
                  - { id: small, show: { text: "small" }, say: "Small." }
                  - { id: tall, show: { text: "tall" }, say: "Tall." }
                  - { id: tail, show: { text: "tail" }, say: "Tail below the line." }
                options:
                  - { text: "m", bin: small }
                  - { text: "h", bin: tall }
                  - { text: "g", bin: tail }
                  - { text: "c", bin: small }
                  - { text: "l", bin: tall }
                  - { text: "q", bin: tail }
                hints: ["Does it go up, go down, or stay between the lines?"]
              - id: l1-s5
                type: multiple_choice
                text: "What does legible mean?"
                options: ["easy to read", "very fast", "very big"]
                answer: "easy to read"
                hints: ["Legible writing is writing someone else can read."]

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Copy the word."
                say: "Copy kind. Keep small letters small and tall letters tall."
                show: { drawn: writing-lines, text: "kind", mode: copy, arrows: false, script: joined }
                char: "kind"
              - id: l1-n2
                type: multiple_choice
                text: "Which letters should all be the same height?"
                options: ["a, o and m", "a, l and g", "b, o and y"]
                answer: "a, o and m"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "In neat writing, all the downstrokes lean the same way."
                say: "Read it. Is it true?"
                answer: true
              - id: l1-n4
                type: highlight_in_text
                text: "Tap every tall letter."
                say: "Tap every letter that reaches up higher than the small letters."
                show: { drawn: letter-card, text: "h u l n b s" }
                spans: ["h", "l", "b"]
                option_audio: false
              - id: l1-n5
                type: tracing
                text: "Copy the word."
                say: "Copy jumpy. Three letters have tails below the line."
                show: { drawn: writing-lines, text: "jumpy", mode: copy, arrows: false, script: joined }
                char: "jumpy"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which letter goes below the line?"
            options: ["y", "k", "a"]
            answer: "y"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "What does consistent handwriting mean?"
            options: ["Letters look the same each time.", "Every letter is a different size.", "It is written in pen."]
            answer: "Letters look the same each time."
          - id: l1-c3
            type: tracing
            text: "Copy the word."
            say: "Copy ladder. Keep the tall letters the same height."
            show: { drawn: writing-lines, text: "ladder", mode: copy, arrows: false, script: joined }
            char: "ladder"

  - n: 2
    title: { de: Gleichmäßige Abstände, en: Even spacing }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which letter is a tall letter?"
            options: ["d", "e", "p"]
            answer: "d"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Downstrokes that lean different ways make writing easier to read."
            say: "Read it. Is it true?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Even spacing between letters"
            say: "Inside a word, the joins keep the letters the same distance apart. Do not squash letters together or stretch a join out long."
            show: { drawn: writing-lines, text: "garden", mode: trace, arrows: false, script: joined }
          - text: "A clear gap between words"
            say: "Lift your pencil at the end of each word. Leave a clear gap before the next word, the same size each time. Never join one word on to the next."
            show: { drawn: writing-lines, text: "the red bus", mode: trace, arrows: false, script: joined }
          - text: "Capital letters are not joined."
            say: "A capital letter at the start of a name or a sentence stays unjoined. Start the next letter close to it."
            show: { drawn: writing-lines, text: "Ben", mode: trace, arrows: false, script: joined }
          - text: "Check: size, slope, spacing"
            say: "When you finish, check three things: are the sizes right, are the downstrokes parallel, and are the gaps even?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Where do you lift your pencil when you write a sentence in joined writing?"
                options: ["at the end of each word", "after every letter", "only at the end of the sentence"]
                answer: "at the end of each word"
                feedback:
                  "only at the end of the sentence": "Then the words run into each other. Lift your pencil after each word and leave a gap."
                hints:
                  - "What keeps the words apart?"
                  - "The letters in a word are joined, the words are not."
                  - "At the end of each word."
                difficulty: easy
              - id: l2-f2
                type: tracing
                text: "Trace the words."
                say: "Trace a big dog. Lift your pencil after each word."
                show: { drawn: writing-lines, text: "a big dog", mode: trace, arrows: true, script: joined }
                char: "a big dog"
              - id: l2-f3
                type: multiple_choice
                text: "Mia's gaps between words are tiny in one place and huge in another. What should she do?"
                options: ["Make the gaps the same size each time.", "Leave no gaps at all.", "Write each word on a new line."]
                answer: "Make the gaps the same size each time."
                hints:
                  - "What does even mean?"
                  - "Even gaps are all the same size."
                  - "Make the gaps the same size each time."
              - id: l2-f4
                type: true_false
                text: "A capital letter at the start of a name is left unjoined."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Think of how you write Ben."
                  - "The capital B stands on its own."
                  - "Yes, it is true."
              - id: l2-f5
                type: multiple_choice
                text: "What are the three things to check in your handwriting?"
                options: ["size, slope and spacing", "colour, pen and paper", "speed, speed and speed"]
                answer: "size, slope and spacing"
                hints:
                  - "One is about how tall letters are."
                  - "One is about how downstrokes lean, one about gaps."
                  - "Size, slope and spacing."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "In joined writing, the last letter of a word joins on to the next word."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Words need a gap between them."]
              - id: l2-s2
                type: tracing
                text: "Trace the name."
                say: "Trace Leeds. The capital L stands on its own."
                show: { drawn: writing-lines, text: "Leeds", mode: trace, arrows: true, script: joined }
                char: "Leeds"
              - id: l2-s3
                type: multiple_choice
                text: "Inside a word, how far apart should the letters be?"
                options: ["the same distance, kept by the joins", "as far apart as words", "squashed together"]
                answer: "the same distance, kept by the joins"
                hints: ["Even spacing inside a word, too."]
              - id: l2-s4
                type: tracing
                text: "Copy the words."
                say: "Copy my best friend. Leave even gaps."
                show: { drawn: writing-lines, text: "my best friend", mode: copy, arrows: false, script: joined }
                char: "my best friend"
              - id: l2-s5
                type: multiple_choice
                text: "Leo's writing has the right sizes and even gaps, but the downstrokes lean every way. What does he check next time?"
                options: ["slope", "spacing", "size"]
                answer: "slope"
                hints: ["Which of the three is about how downstrokes lean?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is true of neat joined writing?"
                options: ["Letters in a word are joined; words have gaps between them.", "Every letter is written on its own.", "All the words are joined into one line."]
                answer: "Letters in a word are joined; words have gaps between them."
              - id: l2-n2
                type: tracing
                text: "Copy the sentence."
                say: "Copy the sentence: The sun is hot. Check size, slope and spacing."
                show: { drawn: writing-lines, text: "The sun is hot.", mode: copy, arrows: false, script: joined }
                char: "The sun is hot."
              - id: l2-n3
                type: true_false
                text: "Even spacing means every gap between words is about the same size."
                say: "Read it. Is it true?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Which letter in Anna is not joined to the letter after it?"
                options: ["A", "n"]
                answer: "A"
                option_audio: false
              - id: l2-n5
                type: tracing
                text: "Copy the words."
                say: "Copy happy days. Four letters have tails."
                show: { drawn: writing-lines, text: "happy days", mode: copy, arrows: false, script: joined }
                char: "happy days"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which group are all small letters?"
            options: ["c, e and u", "c, h and u", "e, g and u"]
            answer: "c, e and u"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "How should the downstrokes in your writing be?"
            options: ["parallel", "crossed", "wavy"]
            answer: "parallel"
          - id: l2-c3
            type: true_false
            text: "You should leave a clear gap between words, even in joined writing."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c4
            type: multiple_choice
            text: "Which letter has a tail below the line?"
            options: ["q", "b", "o"]
            answer: "q"
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "What does legible handwriting help with?"
            options: ["Other people can read it easily.", "It uses less ink.", "It is always quicker."]
            answer: "Other people can read it easily."
