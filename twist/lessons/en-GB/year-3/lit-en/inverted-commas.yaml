# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.inverted-commas
skill: lit-en.grammar.inverted-commas
curriculum: en-GB
language: en
title:
  de: Wörtliche Rede mit Anführungszeichen
  en: Inverted commas for direct speech
summary: >
  Inverted commas (speech marks) go around the exact words a character
  says. Lesson 1 finds the spoken words in a sentence, tells direct
  speech from a report of what someone said, and puts the inverted
  commas round the spoken words only. Lesson 2 punctuates inside the
  inverted commas: a capital letter to start the speech, and the comma,
  question mark or exclamation mark before the closing inverted comma
  (“Can I come?” asked Ali. Mum said, “Hurry up!”); it ends with the
  skill check. Inverted commas are written as 66 and 99, “like this”.
metadata:
  year: year-3
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.sentence-punctuation]
  also_practises: [lit-en.grammar.sentence-punctuation]
  vocabulary: { en: [inverted commas, speech marks, direct speech, spoken words, reporting clause, said, asked, capital letter, comma, question mark, exclamation mark] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: marks-round-said
      what: Puts the inverted commas round the whole sentence, including said Tom
      addressed: Learn screen 2 of lesson 1; l1-f2, l1-f4, l1-s2, l1-n2 and l2-c1, with feedback in l1-f2
    - id: reported-as-direct
      what: Uses inverted commas for reported speech (Tom said that he was hungry)
      addressed: Learn screen 3 of lesson 1; l1-f5, l1-s5, l1-n5 and l2-c5, with feedback in l1-f5
    - id: punctuation-outside
      what: Puts the comma, question mark or exclamation mark after the closing inverted comma
      addressed: Learn of lesson 2; l2-f1, l2-f3, l2-s1, l2-n1 and l2-c3, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Was genau gesagt wird, en: The exact words spoken }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which sentence is punctuated correctly?"
            options: ["Where is my coat?", "where is my coat?", "Where is my coat."]
            answer: "Where is my coat?"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which mark ends a sentence that shows a strong feeling?"
            options: ["!", "?", ","]
            answer: "!"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "“I am hungry,” said Tom."
            say: "When we write the exact words someone says, we put them inside inverted commas. Some people call them speech marks. The first looks like a little 66 and the last like a little 99."
          - text: "spoken words: I am hungry\nwho says it: said Tom"
            say: "Only the spoken words go inside. Said Tom is outside, because Tom does not say said Tom. Ask yourself: what would come out of Tom's mouth?"
          - text: "Direct speech: “I am hungry,” said Tom.\nReported speech: Tom said that he was hungry."
            say: "When we only report what someone said, without their exact words, we do not use inverted commas. Words like said that are a clue."
          - text: "Mum said, “Time for bed.”\n“Time for bed,” said Mum."
            say: "The spoken words can come after the person who says them, or before. The inverted commas still go round the spoken words only."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the words Ella says."
                say: "Tap only the words that Ella says out loud."
                show: { drawn: letter-card, text: "Ella shouted look at the rainbow" }
                spans: ["look", "at", "the", "rainbow"]
                hints:
                  - "What comes out of Ella's mouth?"
                  - "Ella does not say Ella shouted."
                  - "look at the rainbow."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Where do the inverted commas go?"
                options: ["“Let's go to the park,” said Ben.", "“Let's go to the park, said Ben.”", "Let's go to the park, “said Ben.”"]
                answer: "“Let's go to the park,” said Ben."
                option_audio: false
                feedback:
                  "“Let's go to the park, said Ben.”": "Ben does not say said Ben. The inverted commas close after the spoken words, before said Ben."
                hints:
                  - "Which words does Ben say out loud?"
                  - "Said Ben stays outside."
                  - "“Let's go to the park,” said Ben."
              - id: l1-f3
                type: multiple_choice
                text: "What are inverted commas for?"
                options: ["to show the exact words someone says", "to show a list", "to end a sentence"]
                answer: "to show the exact words someone says"
                hints:
                  - "Think of “I am hungry,” said Tom."
                  - "They go round spoken words."
                  - "To show the exact words someone says."
              - id: l1-f4
                type: multiple_choice
                text: "Where do the inverted commas go?"
                options: ["Gran said, “What a lovely picture.”", "“Gran said, What a lovely picture.”", "Gran “said, What a lovely picture.”"]
                answer: "Gran said, “What a lovely picture.”"
                option_audio: false
                hints:
                  - "Here the spoken words come at the end."
                  - "Gran said is outside."
                  - "Gran said, “What a lovely picture.”"
              - id: l1-f5
                type: multiple_choice
                text: "Which sentence needs inverted commas?"
                options: ["I love swimming said Asha.", "Asha said that she loved swimming.", "Asha told us about swimming."]
                answer: "I love swimming said Asha."
                option_audio: false
                feedback:
                  "Asha said that she loved swimming.": "That reports what Asha said, without her exact words: said that is the clue. Only direct speech needs inverted commas."
                hints:
                  - "Which one has Asha's exact words?"
                  - "Said that means it is reported."
                  - "I love swimming said Asha."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the words the teacher says."
                say: "Tap only the words that the teacher says out loud."
                show: { drawn: letter-card, text: "Please line up by the door said Mr Khan" }
                spans: ["Please", "line", "up", "by", "the", "door"]
                hints: ["Mr Khan does not say said Mr Khan."]
              - id: l1-s2
                type: multiple_choice
                text: "Where do the inverted commas go?"
                options: ["“My tooth is wobbly,” said Leo.", "“My tooth is wobbly, said Leo.”", "My tooth “is wobbly,” said Leo."]
                answer: "“My tooth is wobbly,” said Leo."
                option_audio: false
                hints: ["Round the spoken words only."]
              - id: l1-s3
                type: true_false
                text: "Another name for inverted commas is speech marks."
                say: "Read it. Is it true?"
                answer: true
                hints: ["They mark speech."]
              - id: l1-s4
                type: multiple_choice
                text: "Where do the inverted commas go?"
                options: ["Dad asked, “Who wants pancakes?”", "“Dad asked, Who wants pancakes?”", "Dad “asked, Who wants pancakes?”"]
                answer: "Dad asked, “Who wants pancakes?”"
                option_audio: false
                hints: ["What would Dad say out loud?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which sentence is reported speech, so it needs no inverted commas?"
                options: ["Zac said that he was tired.", "I'm tired said Zac.", "Zac said I'm tired."]
                answer: "Zac said that he was tired."
                option_audio: false
                hints: ["Look for said that."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the words Maya says."
                say: "Tap only the words that Maya says out loud."
                show: { drawn: letter-card, text: "Maya whispered the baby is asleep" }
                spans: ["the", "baby", "is", "asleep"]
              - id: l1-n2
                type: multiple_choice
                text: "Where do the inverted commas go?"
                options: ["“It's my turn,” said Ruby.", "“It's my turn, said Ruby.”", "It's my “turn,” said Ruby."]
                answer: "“It's my turn,” said Ruby."
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Where do the inverted commas go?"
                options: ["The farmer called, “Close the gate!”", "“The farmer called, Close the gate!”", "The farmer “called, Close the gate!”"]
                answer: "The farmer called, “Close the gate!”"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "In “I can help,” said Sam, the words said Sam go inside the inverted commas."
                say: "Read it. Is it true?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Which sentence needs inverted commas?"
                options: ["Can I have a go asked Kim.", "Kim asked if she could have a go.", "Kim wanted a go."]
                answer: "Can I have a go asked Kim."
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the words Ali says."
            say: "Tap only the words that Ali says out loud."
            show: { drawn: letter-card, text: "Ali said I found a shell" }
            spans: ["I", "found", "a", "shell"]
          - id: l1-c2
            type: multiple_choice
            text: "Where do the inverted commas go?"
            options: ["“I like your hat,” said Jo.", "“I like your hat, said Jo.”", "I like “your hat,” said Jo."]
            answer: "“I like your hat,” said Jo."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "\"Ben said that he was cold\" needs inverted commas."
            say: "Read it. Is it true?"
            answer: false

  - n: 2
    title: { de: Satzzeichen in der wörtlichen Rede, en: Punctuation inside the inverted commas }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Where do the inverted commas go?"
            options: ["“Look at me,” said Finn.", "“Look at me, said Finn.”"]
            answer: "“Look at me,” said Finn."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What goes inside inverted commas?"
            options: ["the exact spoken words", "the name of the speaker", "the whole page"]
            answer: "the exact spoken words"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "“I am ready,” said Mia."
            say: "Look closely at the end of the spoken words. A comma goes inside the inverted commas, before the 99, when the sentence carries on with said Mia."
          - text: "“Are you ready?” asked Mia.\n“Hurry up!” shouted Mia."
            say: "A question mark or an exclamation mark also goes inside, before the closing inverted comma. Then said, asked or shouted starts with a small letter, because the sentence is not finished."
          - text: "Mia said, “We are late.”"
            say: "When the spoken words come at the end, put a comma after said, before the opening inverted comma. The spoken words start with a capital letter, and the full stop goes inside at the end."
          - text: "Check:\n1 inverted commas round the spoken words\n2 a capital letter to start the speech\n3 punctuation inside the inverted commas"
            say: "Use this check every time you write speech."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["“Where are my shoes?” asked Jay.", "“Where are my shoes”? asked Jay.", "“Where are my shoes” asked Jay?"]
                answer: "“Where are my shoes?” asked Jay."
                option_audio: false
                feedback:
                  "“Where are my shoes”? asked Jay.": "The question mark belongs to the spoken words, so it goes inside, before the closing inverted comma."
                hints:
                  - "Is the question mark part of what Jay says?"
                  - "It goes before the 99."
                  - "“Where are my shoes?” asked Jay."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which mark fits? \"“That was brilliant_” cheered Dad.\""
                say: "Which punctuation mark fits inside the inverted commas? Dad is cheering."
                frame: "“That was brilliant_” cheered Dad."
                options: ["!", "?", "."]
                answer: ["!"]
                option_audio: false
                hints:
                  - "Dad is cheering: a strong feeling."
                  - "Which mark shows a strong feeling?"
                  - "An exclamation mark."
              - id: l2-f3
                type: fill_in_blank
                text: "Which mark fits? \"“I like this song_” said Priya.\""
                say: "Which punctuation mark fits inside the inverted commas, before said Priya?"
                frame: "“I like this song_” said Priya."
                options: [",", ".", "?"]
                answer: [","]
                option_audio: false
                feedback:
                  ".": "A full stop would end the sentence, but it carries on with said Priya. Use a comma inside the inverted commas."
                hints:
                  - "Does the sentence end here?"
                  - "It carries on with said Priya."
                  - "A comma."
              - id: l2-f4
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["Gran said, “Let's bake a cake.”", "Gran said, “let's bake a cake.”", "Gran said “Let's bake a cake”."]
                answer: "Gran said, “Let's bake a cake.”"
                option_audio: false
                hints:
                  - "The speech starts with a capital letter."
                  - "A comma after said, a full stop inside at the end."
                  - "Gran said, “Let's bake a cake.”"
              - id: l2-f5
                type: true_false
                text: "In “Can we go?” asked Tom, the word asked starts with a small letter."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Is the sentence finished after the question mark?"
                  - "It carries on with asked Tom."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["“Watch out!” yelled Sam.", "“Watch out”! yelled Sam.", "“Watch out” yelled Sam!"]
                answer: "“Watch out!” yelled Sam."
                option_audio: false
                hints: ["The exclamation mark belongs to the spoken words."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which mark fits? \"“Is it raining_” asked Lily.\""
                say: "Which punctuation mark fits inside the inverted commas? Lily is asking."
                frame: "“Is it raining_” asked Lily."
                options: ["?", "!", ","]
                answer: ["?"]
                option_audio: false
                hints: ["Lily is asking a question."]
              - id: l2-s3
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["Mr Brown said, “Open your books.”", "Mr Brown said “open your books.”", "Mr Brown said, “Open your books”."]
                answer: "Mr Brown said, “Open your books.”"
                option_audio: false
                hints: ["Comma after said, capital letter, full stop inside."]
              - id: l2-s4
                type: ordering
                text: "Build the sentence."
                say: "Put the cards in order to make the sentence with direct speech."
                options: ["said Ava.", "“I found a ladybird,”"]
                slot_count: 2
                answer: ["“I found a ladybird,”", "said Ava."]
                option_audio: false
                hints: ["The spoken words come first here."]
              - id: l2-s5
                type: true_false
                text: "Is this punctuated correctly? “I'm here.” said Ben."
                say: "Read the sentence. Is it punctuated correctly?"
                answer: false
                hints: ["The sentence carries on after the spoken words."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["“What time is it?” asked Noah.", "“What time is it”? asked Noah.", "“What time is it” asked Noah?"]
                answer: "“What time is it?” asked Noah."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Which mark fits? \"“We won the match_” said Ella.\""
                say: "Which punctuation mark fits inside the inverted commas, before said Ella?"
                frame: "“We won the match_” said Ella."
                options: [",", ".", "?"]
                answer: [","]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["The pirate roared, “Find the treasure!”", "The pirate roared, “find the treasure!”", "The pirate roared “Find the treasure”!"]
                answer: "The pirate roared, “Find the treasure!”"
                option_audio: false
              - id: l2-n4
                type: ordering
                text: "Build the sentence."
                say: "Put the cards in order to make the sentence with direct speech."
                options: ["“Pass the ball!”", "Coach shouted,"]
                slot_count: 2
                answer: ["Coach shouted,", "“Pass the ball!”"]
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "The spoken words inside inverted commas start with a capital letter."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Where do the inverted commas go?"
            options: ["“The bus is coming,” said Mum.", "“The bus is coming, said Mum.”", "The bus “is coming,” said Mum."]
            answer: "“The bus is coming,” said Mum."
            option_audio: false
          - id: l2-c2
            type: highlight_in_text
            text: "Tap the words Grandad says."
            say: "Tap only the words that Grandad says out loud."
            show: { drawn: letter-card, text: "Grandad laughed what a silly dog" }
            spans: ["what", "a", "silly", "dog"]
          - id: l2-c3
            type: multiple_choice
            text: "Which is punctuated correctly?"
            options: ["“Can I help?” asked Isla.", "“Can I help”? asked Isla.", "“Can I help” asked Isla?"]
            answer: "“Can I help?” asked Isla."
            option_audio: false
          - id: l2-c4
            type: fill_in_blank
            text: "Which mark fits? \"“My kite is stuck_” said Omar.\""
            say: "Which punctuation mark fits inside the inverted commas, before said Omar?"
            frame: "“My kite is stuck_” said Omar."
            options: [",", ".", "?"]
            answer: [","]
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Which sentence needs inverted commas?"
            options: ["I can whistle said Rosie.", "Rosie said that she could whistle.", "Rosie told us she could whistle."]
            answer: "I can whistle said Rosie."
            option_audio: false
