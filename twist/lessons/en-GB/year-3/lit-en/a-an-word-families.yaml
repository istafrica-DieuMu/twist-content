# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.a-an-word-families
skill: lit-en.grammar.a-an-word-families
curriculum: en-GB
language: en
title:
  de: a oder an, Wortfamilien und Vorsilben super-, anti-, auto-
  en: A or an, word families and super-, anti-, auto-
summary: >
  Lesson 1 takes the determiners a and an: a before a word that begins
  with a consonant (a rock), an before a word that begins with a vowel
  (an open box), with the next word deciding, even when it is an
  adjective (an old car, a big apple); a stretch screen notes that the
  sound decides (an hour, a unicorn). Lesson 2 takes word families,
  words that share a root in form and meaning (solve, solution,
  dissolve), and the prefixes super-, anti- and auto- that form nouns
  (supermarket, antiseptic, autograph); it ends with the skill check.
metadata:
  year: year-3
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.word-classes]
  also_practises: [lit-en.word-reading.morphology]
  vocabulary: { en: [determiner, a, an, vowel, consonant, word family, root word, prefix, super-, anti-, auto-] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: a-an, what: { de: "a oder an nach dem Wort wählen, das direkt folgt", en: choosing a or an by the word that comes straight after } }
    - { id: word-families, what: { de: Wörter einer Wortfamilie erkennen, en: recognising the words of a word family } }
    - { id: prefixes, what: { de: "die Vorsilben super-, anti- und auto- und was sie bedeuten", en: "the prefixes super-, anti- and auto- and what they mean" } }
  misconceptions:
    - id: a-an-noun-only
      what: Looks at the noun instead of the word straight after a or an (an big apple, a old car)
      addressed: Learn screen 3 of lesson 1; l1-f3, l1-s3, l1-n3 and l2-c1, with feedback in l1-f3
    - id: family-same-letters
      what: Thinks any words that share letters are a family (car, carrot, cart), without a shared meaning
      addressed: Learn screen 1 of lesson 2; l2-f2, l2-s2, l2-n2 and l2-c3, with feedback in l2-f2
    - id: anti-ante
      what: Mixes up what super-, anti- and auto- mean
      addressed: Learn screen 3 of lesson 2; l2-f3, l2-f4, l2-s3, l2-n3 and l2-c4, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "a oder an?", en: "A or an?" }
    goal:
      de: "Wähl a oder an, je nachdem wie das nächste Wort anfängt, so wie an old car, aber a big apple."
      en: "Choose a or an by looking at the next word, like an old car but a big apple."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "\"The little dog barked.\" Which word is a noun?"
            options: ["dog", "little", "barked"]
            answer: "dog"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "\"The little dog barked.\" Which word is an adjective?"
            options: ["little", "dog", "barked"]
            answer: "little"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Vowels: a e i o u\nConsonants: all the other letters"
            say: "The vowels are a, e, i, o and u. All the other letters are consonants."
          - text: "a rock    a dog    a banana\nan apple    an egg    an open box"
            say: "A and an are determiners: they come before a noun. Use a before a word that begins with a consonant. Use an before a word that begins with a vowel. An apple is easier to say than a apple."
          - text: "an old car    a big apple"
            say: "Look at the word straight after a or an. In an old car, the next word is old, which starts with a vowel, so it is an. In a big apple, the next word is big, so it is a."
          - text: "an hour    a unicorn"
            say: "A tricky extra: it is the sound that counts. Hour starts with a silent h and an o sound, so we say an hour. Unicorn starts with a you sound, so we say a unicorn."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "a or an? \"_ elephant\""
                say: "Do we say a or an before elephant?"
                frame: "_ elephant"
                options: ["a", "an"]
                answer: ["an"]
                hints:
                  - "What letter does elephant start with?"
                  - "e is a vowel."
                  - "an elephant."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "a or an? \"_ tiger\""
                say: "Do we say a or an before tiger?"
                frame: "_ tiger"
                options: ["a", "an"]
                answer: ["a"]
                hints:
                  - "What letter does tiger start with?"
                  - "t is a consonant."
                  - "a tiger."
              - id: l1-f3
                type: fill_in_blank
                text: "a or an? \"I ate _ huge orange.\""
                say: "Do we say a or an in this sentence? I ate blank huge orange."
                frame: "I ate _ huge orange."
                options: ["a", "an"]
                answer: ["a"]
                feedback:
                  "an": "Orange starts with a vowel, but the word straight after the gap is huge. Huge starts with h, a consonant, so it is a huge orange."
                hints:
                  - "Which word comes straight after the gap?"
                  - "It is huge, not orange."
                  - "a huge orange."
              - id: l1-f4
                type: sorting
                text: "a or an?"
                say: "Put each word in the right group: a or an."
                option_audio: false
                bins:
                  - { id: a, show: { text: "a" }, say: "a." }
                  - { id: an, show: { text: "an" }, say: "an." }
                options:
                  - { text: "igloo", bin: an }
                  - { text: "kite", bin: a }
                  - { text: "umbrella", bin: an }
                  - { text: "garden", bin: a }
                hints:
                  - "Look at the first letter of each word."
                  - "Is it a vowel: a, e, i, o, u?"
                  - "an igloo, an umbrella; a kite, a garden."
              - id: l1-f5
                type: true_false
                text: "\"an octopus\" is correct."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "What letter does octopus start with?"
                  - "o is a vowel."
                  - "Yes, an octopus is correct."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "a or an? \"_ insect\""
                say: "Do we say a or an before insect?"
                frame: "_ insect"
                options: ["a", "an"]
                answer: ["an"]
                hints: ["i is a vowel."]
              - id: l1-s2
                type: fill_in_blank
                text: "a or an? \"_ sandwich\""
                say: "Do we say a or an before sandwich?"
                frame: "_ sandwich"
                options: ["a", "an"]
                answer: ["a"]
                hints: ["s is a consonant."]
              - id: l1-s3
                type: fill_in_blank
                text: "a or an? \"She found _ empty box.\""
                say: "Do we say a or an in this sentence? She found blank empty box."
                frame: "She found _ empty box."
                options: ["a", "an"]
                answer: ["an"]
                hints: ["Look at the word straight after the gap: empty."]
              - id: l1-s4
                type: multiple_choice
                text: "Which is correct?"
                options: ["an ugly duckling", "a ugly duckling"]
                answer: "an ugly duckling"
                option_audio: false
                hints: ["What does ugly start with?"]
              - id: l1-s5
                type: true_false
                text: "\"a apple\" is correct."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Apple starts with a vowel."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "a or an? \"_ owl\""
                say: "Do we say a or an before owl?"
                frame: "_ owl"
                options: ["a", "an"]
                answer: ["an"]
              - id: l1-n2
                type: fill_in_blank
                text: "a or an? \"_ helicopter\""
                say: "Do we say a or an before helicopter?"
                frame: "_ helicopter"
                options: ["a", "an"]
                answer: ["a"]
              - id: l1-n3
                type: fill_in_blank
                text: "a or an? \"We saw _ amazing rainbow.\""
                say: "Do we say a or an in this sentence? We saw blank amazing rainbow."
                frame: "We saw _ amazing rainbow."
                options: ["a", "an"]
                answer: ["an"]
              - id: l1-n4
                type: fill_in_blank
                text: "Fill both gaps. \"I have _ cat and _ iguana.\""
                say: "Fill both gaps with a or an. I have blank cat and blank iguana."
                frame: "I have _ cat and _ iguana."
                options: ["a", "an"]
                answer: ["a", "an"]
              - id: l1-n5
                type: multiple_choice
                text: "Which is correct?"
                options: ["an hour", "a hour"]
                answer: "an hour"
                option_audio: false
                difficulty: stretch

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "a or an? \"_ envelope\""
            say: "Do we say a or an before envelope?"
            frame: "_ envelope"
            options: ["a", "an"]
            answer: ["an"]
          - id: l1-c2
            type: fill_in_blank
            text: "a or an? \"_ pencil\""
            say: "Do we say a or an before pencil?"
            frame: "_ pencil"
            options: ["a", "an"]
            answer: ["a"]
          - id: l1-c3
            type: true_false
            text: "\"a orange\" is correct."
            say: "Read it. Is it true?"
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "a or an? \"_ astronaut\""
            say: "Do we say a or an before astronaut?"
            frame: "_ astronaut"
            options: ["a", "an"]
            answer: ["an"]
          - id: l1-c5
            type: multiple_choice
            text: "Which is correct?"
            options: ["an old shoe", "a old shoe"]
            answer: "an old shoe"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "\"a red apple\" is correct."
            say: "Read it. Is it true?"
            answer: true

  - n: 2
    title: { de: "Wortfamilien und super-, anti-, auto-", en: "Word families and super-, anti-, auto-" }
    goal:
      de: "Finde Wortfamilien wie solve und solution und lerne, was super, anti und auto vorne an einem Wort bedeuten."
      en: "Find word families like solve and solution, and learn what super, anti and auto mean at the start of a word."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "a or an? \"_ island\""
            say: "Do we say a or an before island?"
            frame: "_ island"
            options: ["a", "an"]
            answer: ["an"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "a or an? \"_ old castle\""
            say: "Do we say a or an? Blank old castle."
            frame: "_ old castle"
            options: ["a", "an"]
            answer: ["an"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "solve  solution  solver  dissolve\nhelp  helpful  helper  unhelpful"
            say: "A word family is a group of words that share a root word. They look alike, and their meanings are linked. Solve, solution, solver and dissolve all come from solve. Knowing one helps you spell and understand the others."
          - text: "car  carrot  cart: not a family"
            say: "Careful: words are only a family if their meanings are linked. Car and carrot share letters, but a carrot has nothing to do with a car."
          - text: "super- means above or more than: supermarket, superstar\nanti- means against: antiseptic, anticlockwise\nauto- means self or own: autograph, autobiography"
            say: "Some prefixes help make nouns. Super means above or more than: a superstar is more than a star. Anti means against: antiseptic works against germs. Auto means self: an autograph is your own signature."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which word belongs to the same family as teach?"
                options: ["teacher", "tea", "torch"]
                answer: "teacher"
                hints:
                  - "Which word has teach inside it?"
                  - "A teacher is someone who teaches."
                  - "Teacher."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which word is NOT in the word family of play?"
                options: ["plate", "player", "playful"]
                answer: "plate"
                feedback:
                  "player": "A player is someone who plays, so it is in the family. Which word only shares letters?"
                hints:
                  - "Is the meaning linked to playing?"
                  - "A plate is for food."
                  - "Plate."
              - id: l2-f3
                type: multiple_choice
                text: "What does anti- mean in anticlockwise?"
                options: ["against", "self", "more than"]
                answer: "against"
                feedback:
                  "self": "Self is what auto means, as in autograph. Anti means against: anticlockwise goes against the way the clock turns."
                hints:
                  - "Which way do the hands move anticlockwise?"
                  - "The opposite way, against the clock."
                  - "Against."
              - id: l2-f4
                type: matching
                text: "Match each prefix with its meaning."
                say: "Match each prefix with what it means."
                pairs:
                  - { left: { text: "super-" }, right: { text: "above, more than" } }
                  - { left: { text: "anti-" }, right: { text: "against" } }
                  - { left: { text: "auto-" }, right: { text: "self, own" } }
                hints:
                  - "Think of superstar, antiseptic and autograph."
                  - "Antiseptic works against germs."
                  - "super: above; anti: against; auto: self."
              - id: l2-f5
                type: fill_in_blank
                text: "Which prefix fits? \"We bought milk at the _market.\""
                say: "Which prefix fits the sentence? We bought milk at the blank market."
                frame: "We bought milk at the _market."
                options: ["super", "anti", "auto"]
                answer: ["super"]
                hints:
                  - "Which prefix means above or more than?"
                  - "A shop that is more than an ordinary market."
                  - "super: supermarket."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Sort the words into families."
                say: "Put each word in its word family."
                option_audio: false
                bins:
                  - { id: kind, show: { text: "kind" }, say: "Kind." }
                  - { id: light, show: { text: "light" }, say: "Light." }
                options:
                  - { text: "kindness", bin: kind }
                  - { text: "unkind", bin: kind }
                  - { text: "lighthouse", bin: light }
                  - { text: "lightning", bin: light }
                hints: ["Find the root word inside each word."]
              - id: l2-s2
                type: multiple_choice
                text: "Which group is a real word family?"
                options: ["sign, signal, signature", "sign, sing, sink", "sign, sigh, sight"]
                answer: "sign, signal, signature"
                option_audio: false
                hints: ["The meanings must be linked."]
              - id: l2-s3
                type: multiple_choice
                text: "An autobiography is ..."
                options: ["a book someone writes about their own life", "a book about cars", "a book against reading"]
                answer: "a book someone writes about their own life"
                hints: ["Auto means self."]
              - id: l2-s4
                type: highlight_in_text
                text: "Tap the prefix."
                say: "The word is split into parts. Tap the prefix."
                show: { drawn: letter-card, text: "anti septic" }
                spans: ["anti"]
                hints: ["The prefix comes at the start."]
              - id: l2-s5
                type: fill_in_blank
                text: "Which prefix fits? \"The famous footballer signed my _graph.\""
                say: "Which prefix fits the sentence? The famous footballer signed my blank graph."
                frame: "The famous footballer signed my _graph."
                options: ["auto", "super", "anti"]
                answer: ["auto"]
                hints: ["Which prefix means own or self?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which word belongs to the same family as electric?"
                options: ["electricity", "elephant", "elbow"]
                answer: "electricity"
              - id: l2-n2
                type: multiple_choice
                text: "Which word is NOT in the family of hope?"
                options: ["hop", "hopeful", "hopeless"]
                answer: "hop"
              - id: l2-n3
                type: multiple_choice
                text: "A superhero is ..."
                options: ["a hero with powers above an ordinary person", "a hero who is against heroes", "a hero who writes about himself"]
                answer: "a hero with powers above an ordinary person"
              - id: l2-n4
                type: fill_in_blank
                text: "Which prefix fits? \"Put some _septic cream on the cut.\""
                say: "Which prefix fits the sentence? Put some blank septic cream on the cut."
                frame: "Put some _septic cream on the cut."
                options: ["anti", "auto", "super"]
                answer: ["anti"]
              - id: l2-n5
                type: fill_in_blank
                text: "Fill both gaps. \"Sam had _ apple and _ superb idea.\""
                say: "Fill both gaps with a or an. Sam had blank apple and blank superb idea."
                frame: "Sam had _ apple and _ superb idea."
                options: ["a", "an"]
                answer: ["an", "a"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: a-an
            type: fill_in_blank
            text: "a or an? \"Dad made _ enormous pie.\""
            say: "Do we say a or an in this sentence? Dad made blank enormous pie."
            frame: "Dad made _ enormous pie."
            options: ["a", "an"]
            answer: ["an"]
          - id: l2-c2
            part: a-an
            type: fill_in_blank
            text: "a or an? \"_ yellow umbrella\""
            say: "Do we say a or an? Blank yellow umbrella."
            frame: "_ yellow umbrella"
            options: ["a", "an"]
            answer: ["a"]
          - id: l2-c3
            part: word-families
            type: multiple_choice
            text: "Which word belongs to the same family as act?"
            options: ["action", "attic", "ant"]
            answer: "action"
          - id: l2-c4
            part: prefixes
            type: multiple_choice
            text: "What does auto- mean in autograph?"
            options: ["self", "against", "more than"]
            answer: "self"
          - id: l2-c5
            part: prefixes
            type: fill_in_blank
            text: "Which prefix fits? \"The singer became a _star.\""
            say: "Which prefix fits the sentence? The singer became a blank star."
            frame: "The singer became a _star."
            options: ["super", "anti", "auto"]
            answer: ["super"]
          - id: l2-c6
            part: a-an
            type: fill_in_blank
            text: "a or an? \"We found _ ant in the kitchen.\""
            say: "Do we say a or an in this sentence? We found blank ant in the kitchen."
            frame: "We found _ ant in the kitchen."
            options: ["a", "an"]
            answer: ["an"]
          - id: l2-c7
            part: a-an
            type: true_false
            text: "\"an tall giraffe\" is correct."
            say: "Read it. Is it true?"
            answer: false
          - id: l2-c8
            part: a-an
            type: sorting
            text: "a or an?"
            say: "Put each group of words in the right box: a or an."
            option_audio: false
            bins:
              - { id: a, show: { text: "a" }, say: "a." }
              - { id: an, show: { text: "an" }, say: "an." }
            options:
              - { text: "old tree", bin: an }
              - { text: "orange kite", bin: an }
              - { text: "little egg", bin: a }
              - { text: "blue owl", bin: a }
          - id: l2-c9
            part: a-an
            type: fill_in_blank
            text: "Fill all three gaps. \"Grandpa grew _ onion, _ carrot and _ enormous marrow.\""
            say: "Fill all three gaps with a or an. Grandpa grew blank onion, blank carrot and blank enormous marrow."
            frame: "Grandpa grew _ onion, _ carrot and _ enormous marrow."
            options: ["a", "an"]
            answer: ["an", "a", "an"]
          - id: l2-c10
            part: a-an
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["I saw an eagle and an owl.", "I saw a eagle and an owl.", "I saw an eagle and a owl."]
            answer: "I saw an eagle and an owl."
            option_audio: false
          - id: l2-c11
            part: word-families
            type: multiple_choice
            text: "Which word belongs to the same family as friend?"
            options: ["friendly", "fried", "fries"]
            answer: "friendly"
          - id: l2-c12
            part: word-families
            type: multiple_choice
            text: "Which word is NOT in the word family of farm?"
            options: ["far", "farmer", "farmyard"]
            answer: "far"
          - id: l2-c13
            part: word-families
            type: sorting
            text: "Sort the words into families."
            say: "Put each word in its word family: paint or print."
            option_audio: false
            bins:
              - { id: paint, show: { text: "paint" }, say: "Paint." }
              - { id: print, show: { text: "print" }, say: "Print." }
            options:
              - { text: "painter", bin: paint }
              - { text: "painting", bin: paint }
              - { text: "printer", bin: print }
              - { text: "fingerprint", bin: print }
          - id: l2-c14
            part: word-families
            type: true_false
            text: "\"bee\", \"been\" and \"beetle\" are a word family."
            say: "Read the three words. Are they a word family?"
            answer: false
          - id: l2-c15
            part: word-families
            type: true_false
            text: "\"build\", \"builder\" and \"rebuild\" are a word family."
            say: "Read the three words. Are they a word family?"
            answer: true
          - id: l2-c16
            part: word-families
            type: highlight_in_text
            text: "These words are one family. Tap the root word."
            say: "These four words are one word family. Tap the root word they all come from."
            show: { drawn: letter-card, text: "dancer dancing dance danced" }
            spans: ["dance"]
          - id: l2-c17
            part: prefixes
            type: fill_in_blank
            text: "Which prefix fits? \"Dad put _freeze in the car so the water would not turn to ice.\""
            say: "Which prefix fits the sentence? Dad put blank freeze in the car so the water would not turn to ice."
            frame: "Dad put _freeze in the car so the water would not turn to ice."
            options: ["auto", "anti", "super"]
            answer: ["anti"]
          - id: l2-c18
            part: prefixes
            type: matching
            text: "Match each word with what it means."
            say: "Match each word with what it means."
            option_audio: false
            pairs:
              - { left: { text: "superpower" }, right: { text: "a power far above normal" } }
              - { left: { text: "autopilot" }, right: { text: "flies a plane by itself" } }
              - { left: { text: "superglue" }, right: { text: "glue that is much stronger than normal" } }
          - id: l2-c19
            part: prefixes
            type: true_false
            text: "A superstore is a very big shop."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c20
            part: prefixes
            type: fill_in_blank
            text: "Which prefix fits? \"The explorer wrote her _biography, the story of her own life.\""
            say: "Which prefix fits the sentence? The explorer wrote her blank biography, the story of her own life."
            frame: "The explorer wrote her _biography, the story of her own life."
            options: ["super", "auto", "anti"]
            answer: ["auto"]
