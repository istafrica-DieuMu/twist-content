# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.time-cause
skill: lit-en.grammar.time-cause
curriculum: en-GB
language: en
title:
  de: Zeit, Ort und Grund ausdrücken
  en: Saying when, where and why
summary: >
  Words that tell the reader when, where and why, as in the Year 3
  grammar appendix. Lesson 1 takes time: conjunctions (when, before,
  after, while), adverbs (then, next, soon) and prepositions (during,
  after, before) that order events. Lesson 2 takes place (prepositions
  such as under, behind, through, in) and cause (because, so, because
  of, therefore), and the difference between because, which comes before
  a clause, and because of, which comes before a noun; it ends with the
  skill check.
metadata:
  year: year-3
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.conjunctions-y2]
  also_practises: [lit-en.grammar.conjunctions-y2]
  vocabulary: { en: [time, place, cause, conjunction, adverb, preposition, before, after, while, during, then, soon, because, because of, so, therefore] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: time, what: { de: "mit Konjunktionen, Adverbien und Präpositionen sagen, wann", en: "saying when with conjunctions, adverbs and prepositions" } }
    - { id: order, what: { de: mit before und after die Reihenfolge erkennen, en: working out the order from before and after } }
    - { id: place, what: { de: "mit Präpositionen sagen, wo", en: saying where with prepositions } }
    - { id: cause, what: { de: "mit because, so oder therefore sagen, warum", en: "saying why with because, so or therefore" } }
    - { id: because-of, what: { de: because oder because of wählen, en: choosing because or because of } }
  misconceptions:
    - id: before-after-swap
      what: Mixes up before and after, so the events come out in the wrong order
      addressed: Learn screen 2 of lesson 1; l1-f1, l1-f3, l1-s1, l1-n1 and l2-c1, with feedback in l1-f1
    - id: because-of-clause
      what: Uses because of before a whole clause (because of it was raining) or because before a noun (because the rain)
      addressed: Learn screen 3 of lesson 2; l2-f3, l2-s3, l2-n3 and l2-c3, with feedback in l2-f3
    - id: so-because-swap
      what: Uses so where the reason follows, or because where the result follows
      addressed: Learn screen 2 of lesson 2; l2-f2, l2-s2, l2-n2 and l2-c4, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wann? Wörter für die Zeit", en: "When? Words for time" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Which conjunction fits? \"I wore my coat _ it was cold.\""
            say: "Which conjunction fits? I wore my coat blank it was cold."
            frame: "I wore my coat _ it was cold."
            options: ["because", "or", "but"]
            answer: ["because"]
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Which conjunction fits? \"You can have juice _ milk.\""
            say: "Which conjunction fits? You can have juice blank milk."
            frame: "You can have juice _ milk."
            options: ["or", "because", "when"]
            answer: ["or"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "When the bell rang, we went inside.\nWhile Mum cooked, I laid the table."
            say: "Some conjunctions join two clauses and tell us when: when, before, after, while. While means at the same time."
          - text: "I brushed my teeth before I went to bed.\nAfter I ate my tea, I watched TV."
            say: "Before means earlier; after means later. In the first sentence, brushing teeth happens first. In the second, eating tea happens first."
          - text: "Then we packed. Next, we drove to the coast. Soon we could see the sea."
            say: "Adverbs such as then, next and soon also tell us when. They help the reader follow the order."
          - text: "during the film    after lunch    before school"
            say: "Prepositions such as during, after and before can come before a noun to say when: during the film, after lunch."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"Wash your hands before you eat.\" What do you do first?"
                options: ["wash your hands", "eat"]
                answer: "wash your hands"
                keep_order: true
                feedback:
                  "eat": "Before means earlier. The washing comes before the eating, so you wash your hands first."
                hints:
                  - "What does before mean?"
                  - "Before means earlier."
                  - "Wash your hands first."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which word fits? \"_ I was reading, my brother was drawing.\""
                say: "Which word fits? Blank I was reading, my brother was drawing."
                frame: "_ I was reading, my brother was drawing."
                options: ["While", "Before", "So"]
                answer: ["While"]
                hints:
                  - "Do the two things happen at the same time?"
                  - "Which word means at the same time?"
                  - "While."
              - id: l1-f3
                type: multiple_choice
                text: "\"After the rain stopped, we went outside.\" What happened first?"
                options: ["The rain stopped.", "We went outside."]
                answer: "The rain stopped."
                keep_order: true
                hints:
                  - "What does after mean?"
                  - "We went outside later."
                  - "The rain stopped first."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the words that tell us when."
                say: "Tap the two words that tell us when things happen."
                show: { drawn: letter-card, text: "First we mixed the flour. Then we added the eggs." }
                spans: ["First", "Then"]
                hints:
                  - "Which words put the events in order?"
                  - "Look at the start of each sentence."
                  - "First and Then."
              - id: l1-f5
                type: fill_in_blank
                text: "Which word fits? \"Please be quiet _ the assembly.\""
                say: "Which word fits? Please be quiet blank the assembly."
                frame: "Please be quiet _ the assembly."
                options: ["during", "because", "so"]
                answer: ["during"]
                hints:
                  - "Which word tells us when, before a noun?"
                  - "All the time the assembly is happening."
                  - "During."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"Before Dad left for work, he fed the cat.\" What did Dad do first?"
                options: ["fed the cat", "left for work"]
                answer: "fed the cat"
                keep_order: true
                hints: ["Before means earlier."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which word fits? \"We put up our umbrellas _ it started to rain.\""
                say: "Which word fits? We put up our umbrellas blank it started to rain."
                frame: "We put up our umbrellas _ it started to rain."
                options: ["when", "or", "but"]
                answer: ["when"]
                hints: ["Which word tells us at what time?"]
              - id: l1-s3
                type: ordering
                text: "Put the sentences in order."
                say: "Put the sentences in order. The time words will help you."
                options: ["Next, we put on our helmets.", "Soon we were racing down the hill.", "First, we pumped up the tyres."]
                slot_count: 3
                answer: ["First, we pumped up the tyres.", "Next, we put on our helmets.", "Soon we were racing down the hill."]
                option_audio: false
                hints: ["First, then next, then soon."]
              - id: l1-s4
                type: fill_in_blank
                text: "Which word fits? \"We can play outside _ lunch.\""
                say: "Which word fits? We can play outside blank lunch."
                frame: "We can play outside _ lunch."
                options: ["after", "because", "so"]
                answer: ["after"]
                hints: ["Which word tells us when?"]
              - id: l1-s5
                type: true_false
                text: "In \"Soon the bus arrived\", the word soon tells us when."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Does soon answer the question when?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"After we visited Gran, we went to the shops.\" Where did they go first?"
                options: ["to Gran's", "to the shops"]
                answer: "to Gran's"
                keep_order: true
              - id: l1-n2
                type: fill_in_blank
                text: "Which word fits? \"Dan hummed _ he painted the fence.\""
                say: "Which word fits? Dan hummed blank he painted the fence."
                frame: "Dan hummed _ he painted the fence."
                options: ["while", "or", "so"]
                answer: ["while"]
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the word that tells us when."
                say: "Tap the word that tells us when."
                show: { drawn: letter-card, text: "We will go swimming after school" }
                spans: ["after"]
              - id: l1-n4
                type: fill_in_blank
                text: "Fill both gaps. \"_ you cross the road, look both ways. _ walk across.\""
                say: "Fill both gaps. Blank you cross the road, look both ways. Blank walk across."
                frame: "_ you cross the road, look both ways. _ walk across."
                options: ["Before", "Then", "Because"]
                answer: ["Before", "Then"]
              - id: l1-n5
                type: true_false
                text: "\"Before\" tells us that something happens later."
                say: "Read it. Is it true?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Which word fits? \"The baby slept _ the long journey.\""
            say: "Which word fits? The baby slept blank the long journey."
            frame: "The baby slept _ the long journey."
            options: ["during", "so", "or"]
            answer: ["during"]
          - id: l1-c2
            type: multiple_choice
            text: "\"Before the film started, we bought popcorn.\" What happened first?"
            options: ["We bought popcorn.", "The film started."]
            answer: "We bought popcorn."
            keep_order: true
          - id: l1-c3
            type: multiple_choice
            text: "Which word means at the same time?"
            options: ["while", "after", "before"]
            answer: "while"
          - id: l1-c4
            type: fill_in_blank
            text: "Which word fits? \"Wait here _ I fetch my coat.\""
            say: "Which word fits? Wait here blank I fetch my coat."
            frame: "Wait here _ I fetch my coat."
            options: ["while", "because", "so"]
            answer: ["while"]
          - id: l1-c5
            type: true_false
            text: "\"I put on my socks before my shoes.\"\n\nIs it true? The shoes went on first."
            say: "Read the sentence. Is it true? The shoes went on first."
            answer: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tap the two words that tell us when."
            say: "Tap the two words that tell us when things happen."
            show: { drawn: letter-card, text: "Next we fed the ducks. Soon it was time to go home." }
            spans: ["Next", "Soon"]

  - n: 2
    title: { de: "Wo? und Warum?", en: "Where? and Why?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Which word fits? \"I read a book _ I was waiting.\""
            say: "Which word fits? I read a book blank I was waiting."
            frame: "I read a book _ I was waiting."
            options: ["while", "so", "or"]
            answer: ["while"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which word tells us when?"
            options: ["soon", "under", "because"]
            answer: "soon"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The cat hid under the bed.\nWe walked through the forest.\nThe keys are in the drawer."
            say: "Prepositions tell us where: under, behind, through, in, above, beside. They come before a noun or a noun phrase."
          - text: "We stayed in because it was raining.\nIt was raining, so we stayed in."
            say: "Because and so tell us why. Because comes before the reason. So comes before the result. Both sentences say the same thing."
          - text: "because it was raining\nbecause of the rain"
            say: "Because comes before a clause, with a verb: because it was raining. Because of comes before a noun: because of the rain."
          - text: "The road was icy. Therefore, the school bus was late."
            say: "The adverb therefore also shows cause. It means so, or for that reason. It often starts a new sentence."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the word that tells us where."
                say: "Tap the preposition that tells us where the ball went."
                show: { drawn: letter-card, text: "The ball rolled behind the shed" }
                spans: ["behind"]
                hints:
                  - "Which word answers the question where?"
                  - "It comes before the shed."
                  - "behind."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which word fits? \"Jake was hungry, _ he made some toast.\""
                say: "Which word fits? Jake was hungry, blank he made some toast."
                frame: "Jake was hungry, _ he made some toast."
                options: ["so", "because", "while"]
                answer: ["so"]
                feedback:
                  "because": "Because comes before the reason. Here the reason, hungry, comes first, and making toast is the result. Use so before a result."
                hints:
                  - "Is making toast the reason or the result?"
                  - "So comes before the result."
                  - "So."
              - id: l2-f3
                type: fill_in_blank
                text: "Which fits? \"The match was cancelled _ the snow.\""
                say: "Which fits? The match was cancelled blank the snow."
                frame: "The match was cancelled _ the snow."
                options: ["because of", "because", "so"]
                answer: ["because of"]
                feedback:
                  "because": "The snow is a noun, with no verb after it. Before a noun, use because of: because of the snow."
                hints:
                  - "Is there a verb after the gap, or just a noun?"
                  - "Before a noun, use because of."
                  - "Because of."
              - id: l2-f4
                type: sorting
                text: "When, where or why?"
                say: "Read each phrase. Does it tell us when, where or why?"
                option_audio: false
                bins:
                  - { id: when, show: { text: "when" }, say: "When." }
                  - { id: where, show: { text: "where" }, say: "Where." }
                  - { id: why, show: { text: "why" }, say: "Why." }
                options:
                  - { text: "after tea", bin: when }
                  - { text: "under the table", bin: where }
                  - { text: "because of the noise", bin: why }
                  - { text: "during the night", bin: when }
                  - { text: "through the tunnel", bin: where }
                hints:
                  - "Ask: does it answer when, where or why?"
                  - "After and during are about time."
                  - "after tea, during the night: when; under, through: where; because of: why."
              - id: l2-f5
                type: multiple_choice
                text: "\"The river flooded. Therefore, the bridge was closed.\" What does therefore mean here?"
                options: ["for that reason", "at the same time", "under"]
                answer: "for that reason"
                hints:
                  - "Why was the bridge closed?"
                  - "Because the river flooded."
                  - "For that reason."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which word fits? \"The bird flew _ the open window.\""
                say: "Which word fits? The bird flew blank the open window."
                frame: "The bird flew _ the open window."
                options: ["through", "because", "while"]
                answer: ["through"]
                hints: ["Which word tells us where?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Which word fits? \"I wore gloves _ my hands were cold.\""
                say: "Which word fits? I wore gloves blank my hands were cold."
                frame: "I wore gloves _ my hands were cold."
                options: ["because", "so", "during"]
                answer: ["because"]
                hints: ["The cold hands are the reason."]
              - id: l2-s3
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["We were late because of the traffic.", "We were late because of the traffic was bad.", "We were late because the traffic."]
                answer: "We were late because of the traffic."
                option_audio: false
                hints: ["Because of goes before a noun."]
              - id: l2-s4
                type: highlight_in_text
                text: "Tap the word that tells us where."
                say: "Tap the preposition that tells us where the lamp is."
                show: { drawn: letter-card, text: "The lamp is beside my bed" }
                spans: ["beside"]
                hints: ["Where is the lamp?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Which word fits? \"The shop had sold out of bread. _, we bought rolls.\""
                say: "Which word fits? The shop had sold out of bread. Blank, we bought rolls."
                frame: "The shop had sold out of bread. _, we bought rolls."
                options: ["Therefore", "While", "Under"]
                answer: ["Therefore"]
                hints: ["Which word means for that reason?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which word fits? \"The treasure was buried _ the old oak tree.\""
                say: "Which word fits? The treasure was buried blank the old oak tree."
                frame: "The treasure was buried _ the old oak tree."
                options: ["under", "because", "soon"]
                answer: ["under"]
              - id: l2-n2
                type: fill_in_blank
                text: "Which word fits? \"It was sunny, _ we went to the beach.\""
                say: "Which word fits? It was sunny, blank we went to the beach."
                frame: "It was sunny, _ we went to the beach."
                options: ["so", "because", "before"]
                answer: ["so"]
              - id: l2-n3
                type: fill_in_blank
                text: "Which fits? \"Lily stayed at home _ her cold.\""
                say: "Which fits? Lily stayed at home blank her cold."
                frame: "Lily stayed at home _ her cold."
                options: ["because of", "because", "so"]
                answer: ["because of"]
              - id: l2-n4
                type: sorting
                text: "When, where or why?"
                say: "Read each phrase. Does it tell us when, where or why?"
                option_audio: false
                bins:
                  - { id: when, show: { text: "when" }, say: "When." }
                  - { id: where, show: { text: "where" }, say: "Where." }
                  - { id: why, show: { text: "why" }, say: "Why." }
                options:
                  - { text: "before breakfast", bin: when }
                  - { text: "in the garden", bin: where }
                  - { text: "because it was late", bin: why }
                  - { text: "above the clouds", bin: where }
              - id: l2-n5
                type: true_false
                text: "\"because of\" comes before a noun, such as \"because of the wind\"."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: order
            type: multiple_choice
            text: "\"After Tom finished his homework, he played outside.\" What did Tom do first?"
            options: ["finished his homework", "played outside"]
            answer: "finished his homework"
            keep_order: true
          - id: l2-c2
            part: place
            type: fill_in_blank
            text: "Which word fits? \"The fox ran _ the hedge.\""
            say: "Which word fits? The fox ran blank the hedge."
            frame: "The fox ran _ the hedge."
            options: ["through", "so", "while"]
            answer: ["through"]
          - id: l2-c3
            part: because-of
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["The picnic was spoilt because of the wasps.", "The picnic was spoilt because of the wasps were buzzing.", "The picnic was spoilt because the wasps."]
            answer: "The picnic was spoilt because of the wasps."
            option_audio: false
          - id: l2-c4
            part: cause
            type: fill_in_blank
            text: "Which word fits? \"We clapped _ the show was brilliant.\""
            say: "Which word fits? We clapped blank the show was brilliant."
            frame: "We clapped _ the show was brilliant."
            options: ["because", "so", "under"]
            answer: ["because"]
          - id: l2-c5
            part: time
            type: fill_in_blank
            text: "Which word fits? \"Do not talk _ the test.\""
            say: "Which word fits? Do not talk blank the test."
            frame: "Do not talk _ the test."
            options: ["during", "because", "so"]
            answer: ["during"]
          - id: l2-c6
            part: time
            type: fill_in_blank
            text: "Which word fits? \"We waited at the bus stop. _ the bus came round the corner.\""
            say: "Which word fits? We waited at the bus stop. Blank the bus came round the corner."
            frame: "We waited at the bus stop. _ the bus came round the corner."
            options: ["Soon", "Because", "Under"]
            answer: ["Soon"]
          - id: l2-c7
            part: time
            type: true_false
            text: "In \"We sang songs during the journey\", the word during tells us when."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c8
            part: time
            type: ordering
            text: "Put the sentences in order."
            say: "Put the sentences in order. The time words will help you."
            options: ["Soon, green shoots appeared.", "First, we dug a little hole.", "Then we planted the seeds."]
            slot_count: 3
            answer: ["First, we dug a little hole.", "Then we planted the seeds.", "Soon, green shoots appeared."]
            option_audio: false
          - id: l2-c9
            part: order
            type: multiple_choice
            text: "\"Leo tidied his room after he finished his game.\" What did Leo do first?"
            options: ["finished his game", "tidied his room"]
            answer: "finished his game"
            keep_order: true
          - id: l2-c10
            part: order
            type: true_false
            text: "\"We had lunch before we went to the park.\"\n\nIs it true? They went to the park first."
            say: "Read the sentence. Is it true? They went to the park first."
            answer: false
          - id: l2-c11
            part: order
            type: fill_in_blank
            text: "Mia fed the fish. Then she went to school.\n\nWhich word makes the sentence below mean the same?"
            say: "Mia fed the fish. Then she went to school. Which word makes the sentence mean the same? Mia fed the fish blank she went to school."
            frame: "Mia fed the fish _ she went to school."
            options: ["before", "after", "while"]
            answer: ["before"]
          - id: l2-c12
            part: place
            type: multiple_choice
            text: "\"The kite got stuck above the roof.\" Which word tells us where?"
            options: ["above", "stuck", "kite"]
            answer: "above"
          - id: l2-c13
            part: place
            type: fill_in_blank
            text: "Which word fits? \"The children hid _ the curtains.\""
            say: "Which word fits? The children hid blank the curtains."
            frame: "The children hid _ the curtains."
            options: ["behind", "because", "soon"]
            answer: ["behind"]
          - id: l2-c14
            part: place
            type: sorting
            text: "Where or why?"
            say: "Read each phrase. Does it tell us where, or why?"
            option_audio: false
            bins:
              - { id: where, show: { text: "where" }, say: "Where." }
              - { id: why, show: { text: "why" }, say: "Why." }
            options:
              - { text: "in the attic", bin: where }
              - { text: "across the field", bin: where }
              - { text: "because of the storm", bin: why }
              - { text: "because she was sad", bin: why }
          - id: l2-c15
            part: cause
            type: fill_in_blank
            text: "Fill both gaps. \"The grass was wet, _ we sat on a blanket. We sat on a blanket _ the grass was wet.\""
            say: "Fill both gaps. The grass was wet, blank we sat on a blanket. We sat on a blanket blank the grass was wet."
            frame: "The grass was wet, _ we sat on a blanket. We sat on a blanket _ the grass was wet."
            options: ["so", "because"]
            answer: ["so", "because"]
          - id: l2-c16
            part: cause
            type: multiple_choice
            text: "Which sentence means the same as \"The cake burnt because the oven was too hot\"?"
            options: ["The oven was too hot, so the cake burnt.", "The cake burnt, so the oven was too hot.", "The oven was too hot because the cake burnt."]
            answer: "The oven was too hot, so the cake burnt."
            option_audio: false
          - id: l2-c17
            part: cause
            type: multiple_choice
            text: "Which uses therefore correctly?"
            options: ["Ben missed the bus. Therefore, he was late for school.", "Ben was late for school. Therefore, he missed the bus."]
            answer: "Ben missed the bus. Therefore, he was late for school."
            option_audio: false
          - id: l2-c18
            part: because-of
            type: sorting
            text: "Which goes after because, and which after because of?"
            say: "Read each ending. Does it go after because, or after because of?"
            option_audio: false
            bins:
              - { id: because, show: { text: "because ..." }, say: "Because." }
              - { id: because-of, show: { text: "because of ..." }, say: "Because of." }
            options:
