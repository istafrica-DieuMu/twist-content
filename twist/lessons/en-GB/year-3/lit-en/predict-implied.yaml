# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.predict-implied
skill: lit-en.comprehension.predict-implied
curriculum: en-GB
language: en
title:
  de: Vorhersagen aus Hinweisen im Text
  en: Predicting from clues
summary: >
  Good readers predict what might happen next and back the prediction
  up with clues. Lesson 1 predicts from details the text states (dark
  clouds, a sign that says Wet Paint) and tells a sensible prediction
  from a wild guess. Lesson 2 predicts from details that are only
  implied (a character who keeps checking a map, a dog that has gone
  quiet), names the clue a prediction rests on, and changes a prediction
  when new information comes; it ends with the skill check. Passages are
  written for Twist.
metadata:
  year: year-3
  topic: { de: Zwischen den Zeilen lesen, en: Reading between the lines }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.comprehension.anticipate, lit-en.comprehension.inference-evidence]
  also_practises: [lit-en.comprehension.inference-evidence]
  vocabulary: { en: [predict, prediction, clue, stated, implied, evidence, likely, unlikely] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: wild-guess
      what: Predicts something exciting that no clue in the text points to
      addressed: Learn screen 2 of lesson 1; l1-f1, l1-f3, l1-s1, l1-n1 and l2-c1, with feedback in l1-f1
    - id: prediction-fixed
      what: Keeps the first prediction even when new details point another way
      addressed: Learn screen 3 of lesson 2; l2-f4, l2-s4 and l2-n4, with feedback in l2-f4
    - id: only-stated-clues
      what: Uses only what the text says outright and misses what it hints at
      addressed: Learn of lesson 2; l2-f1, l2-f2, l2-s1, l2-n1 and l2-c3, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Hinweise, die im Text stehen", en: "Clues the text tells you" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "The wolf knocked on Grandma's door and put on a sweet voice.\n\nWhat might happen next?"
            say: "Read the sentence. What might happen next?"
            options: ["He tries to trick his way in.", "He goes home for tea.", "He plants a tree."]
            answer: "He tries to trick his way in."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ella hugged her knees and her lip trembled.\n\nHow does Ella feel?"
            say: "Read the sentence. How does Ella feel?"
            options: ["upset", "proud", "sleepy"]
            answer: "upset"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Dark clouds rolled across the sky. Jamal had left his bike outside, and the first drops began to fall."
            say: "Read the passage. To predict means to say what you think will happen next. What do you think will happen?"
          - text: "Prediction: It will pour with rain and Jamal's bike will get wet.\nClues: dark clouds, the first drops."
            say: "A good prediction uses clues from the text. Dark clouds and the first drops are clues that rain is coming. A prediction like a dragon flies past is a wild guess, because no clue points to it."
          - text: "I predict ... because the text says ..."
            say: "When you predict, say why: I predict it will rain because the text says dark clouds rolled across the sky."
          - text: "likely or unlikely?"
            say: "Ask yourself: is this likely, from the clues? A prediction does not have to be right. It has to make sense with what you have read."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A sign on the bench said WET PAINT. Max was so busy reading his comic that he did not see it. He sat down.\n\nWhat will probably happen next?"
                say: "Read the passage. What will probably happen next?"
                options: ["Max will get paint on his clothes.", "Max will win a prize.", "A lion will escape from the zoo."]
                answer: "Max will get paint on his clothes."
                feedback:
                  "A lion will escape from the zoo.": "That would be exciting, but no clue in the text points to it. What does the sign tell you?"
                hints:
                  - "What does the sign say?"
                  - "Max did not see the sign, and he sat down."
                  - "Max will get paint on his clothes."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A sign on the bench said WET PAINT. Max was so busy reading his comic that he did not see it. He sat down.\n\nWhich clue helped you predict?"
                say: "Read the passage again. Which clue helped you predict?"
                options: ["the sign that said WET PAINT", "Max reading his comic", "the word bench"]
                answer: "the sign that said WET PAINT"
                hints:
                  - "Which detail tells you about the paint?"
                  - "The sign warns people."
                  - "The sign that said WET PAINT."
              - id: l1-f3
                type: sorting
                text: "Mia put on her goggles and climbed the ladder of the diving board.\n\nSensible prediction or wild guess?"
                say: "The text says: Mia put on her goggles and climbed the ladder of the diving board. Is each prediction sensible or a wild guess?"
                option_audio: false
                bins:
                  - { id: sensible, show: { text: "sensible" }, say: "Sensible." }
                  - { id: wild, show: { text: "wild guess" }, say: "Wild guess." }
                options:
                  - { text: "Mia will dive into the pool.", bin: sensible }
                  - { text: "Mia will jump into the water.", bin: sensible }
                  - { text: "Mia will fly to the moon.", bin: wild }
                  - { text: "Mia will bake a cake on the board.", bin: wild }
                hints:
                  - "Which ones fit goggles and a diving board?"
                  - "A diving board is for jumping into the pool."
                  - "Diving and jumping are sensible; the moon and the cake are wild guesses."
              - id: l1-f4
                type: multiple_choice
                text: "The ice cream van played its tune at the end of the street. Lily grabbed her purse and ran to the door.\n\nWhat will Lily probably do?"
                say: "Read the passage. What will Lily probably do?"
                options: ["buy an ice cream", "go to bed", "clean her teeth"]
                answer: "buy an ice cream"
                hints:
                  - "Why would she take her purse?"
                  - "The van is outside."
                  - "Buy an ice cream."
              - id: l1-f5
                type: true_false
                text: "A prediction must always turn out to be right."
                say: "Read it. Is it true?"
                answer: false
                hints:
                  - "Can we know for sure what happens next?"
                  - "A prediction has to make sense with the clues."
                  - "No, it does not have to be right."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Oscar balanced the tall pile of plates. His foot caught on the edge of the rug.\n\nWhat will probably happen next?"
                say: "Read the passage. What will probably happen next?"
                options: ["He will trip and drop the plates.", "He will start to sing.", "The plates will turn to gold."]
                answer: "He will trip and drop the plates."
                hints: ["What happens when your foot catches on something?"]
              - id: l1-s2
                type: multiple_choice
                text: "The fire alarm rang. Mr Price stood up and said, \"Line up quietly at the door, please.\"\n\nWhat will the class do next?"
                say: "Read the passage. What will the class do next?"
                options: ["walk outside", "eat their lunch", "start a test"]
                answer: "walk outside"
                hints: ["What do you do in a fire drill?"]
              - id: l1-s3
                type: ordering
                text: "Oscar balanced the tall pile of plates. His foot caught on the edge of the rug.\n\nBuild the prediction."
                say: "Read the passage. Put the cards in order to give a prediction with a reason."
                options: ["because the text says", "I predict Oscar will drop the plates", "\"his foot caught on the edge of the rug.\""]
                slot_count: 3
                answer: ["I predict Oscar will drop the plates", "because the text says", "\"his foot caught on the edge of the rug.\""]
                option_audio: false
                hints: ["Prediction first, then because, then the clue."]
              - id: l1-s4
                type: multiple_choice
                text: "Sophie planted a seed in a pot, put it on a sunny window sill and watered it every day.\n\nWhat will probably happen?"
                say: "Read the passage. What will probably happen?"
                options: ["The seed will grow into a plant.", "The pot will fly away.", "Sophie will forget she has a pot."]
                answer: "The seed will grow into a plant."
                hints: ["What do seeds need to grow?"]
              - id: l1-s5
                type: true_false
                text: "A good prediction uses clues from the text."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Think of the WET PAINT sign."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The cat crouched low in the grass. Its tail twitched. A bird hopped closer and closer.\n\nWhat will probably happen next?"
                say: "Read the passage. What will probably happen next?"
                options: ["The cat will pounce at the bird.", "The cat will start to read.", "The bird will turn into a cat."]
                answer: "The cat will pounce at the bird."
              - id: l1-n2
                type: multiple_choice
                text: "The cat crouched low in the grass. Its tail twitched. A bird hopped closer and closer.\n\nWhich clue helped you most?"
                say: "Read the passage again. Which clue helped you most?"
                options: ["The cat crouched low.", "It was in the grass.", "It was a bird."]
                answer: "The cat crouched low."
              - id: l1-n3
                type: sorting
                text: "Grandad packed a flask, a fishing rod and a box of worms.\n\nSensible prediction or wild guess?"
                say: "The text says: Grandad packed a flask, a fishing rod and a box of worms. Is each prediction sensible or a wild guess?"
                option_audio: false
                bins:
                  - { id: sensible, show: { text: "sensible" }, say: "Sensible." }
                  - { id: wild, show: { text: "wild guess" }, say: "Wild guess." }
                options:
                  - { text: "Grandad will go fishing.", bin: sensible }
                  - { text: "Grandad will sit by a river or lake.", bin: sensible }
                  - { text: "Grandad will play in a rock band.", bin: wild }
                  - { text: "Grandad will become a pirate king.", bin: wild }
              - id: l1-n4
                type: multiple_choice
                text: "Chloe's tummy rumbled. She looked at the clock: it was nearly twelve. A smell of hot pizza came from the kitchen.\n\nWhat will probably happen next?"
                say: "Read the passage. What will probably happen next?"
                options: ["Chloe will have lunch.", "Chloe will go to sleep.", "Chloe will go swimming."]
                answer: "Chloe will have lunch."
              - id: l1-n5
                type: true_false
                text: "\"The ice cream van came, so Lily will go to the dentist\" is a sensible prediction."
                say: "Read it. Is it true?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Freddie blew up the balloon bigger and bigger and bigger.\n\nWhat will probably happen next?"
            say: "Read the sentence. What will probably happen next?"
            options: ["The balloon will pop.", "The balloon will turn blue.", "Freddie will fly."]
            answer: "The balloon will pop."
          - id: l1-c2
            type: multiple_choice
            text: "What does predict mean?"
            options: ["say what you think will happen next", "say what has already happened", "copy the title"]
            answer: "say what you think will happen next"
          - id: l1-c3
            type: true_false
            text: "A prediction should fit the clues in the text."
            say: "Read it. Is it true?"
            answer: true

  - n: 2
    title: { de: Versteckte Hinweise, en: Clues the text hints at }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ava stepped onto the ice. She heard a loud crack under her feet.\n\nWhat might happen next?"
            say: "Read the passage. What might happen next?"
            options: ["The ice might break.", "Ava might find a puppy.", "It might be her birthday."]
            answer: "The ice might break."
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is a wild guess?"
            options: ["After the ice cracked, a spaceship landed.", "After the ice cracked, Ava stepped back.", "After the ice cracked, Ava called for help."]
            answer: "After the ice cracked, a spaceship landed."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Nadia unfolded the map for the third time. She turned it round, then upside down. The path in front of her split into two."
            say: "Read the passage. The writer does not say Nadia is lost. But she keeps checking the map and turning it round. That clue is implied: hinted at, not said."
          - text: "Stated: the path split into two.\nImplied: Nadia is lost.\nPrediction: She will take the wrong path, or ask for help."
            say: "Use both kinds of clue. The text states that the path splits. It implies that Nadia is lost. So a good prediction is: she might take the wrong path, or ask someone for help."
          - text: "New information: A park ranger walked up the path towards her."
            say: "Readers change their prediction when they read something new. Now a ranger is coming. A better prediction is: the ranger will help Nadia find the way."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Mum came home and the house was silent. Usually Biscuit the puppy ran to the door, barking. Then Mum saw a trail of feathers leading to her bedroom.\n\nWhat will Mum probably find?"
                say: "Read the passage. What will Mum probably find?"
                options: ["Biscuit has torn up a pillow.", "Biscuit is waiting at the door.", "A bird has moved into the house."]
                answer: "Biscuit has torn up a pillow."
                feedback:
                  "Biscuit is waiting at the door.": "The text hints otherwise: the house is silent and Biscuit did not come to the door. Where do the feathers lead?"
                hints:
                  - "Why is the house silent?"
                  - "Pillows can be full of feathers."
                  - "Biscuit has torn up a pillow."
              - id: l2-f2
                type: multiple_choice
                text: "Mum came home and the house was silent. Usually Biscuit the puppy ran to the door, barking. Then Mum saw a trail of feathers leading to her bedroom.\n\nWhich detail is implied, not stated?"
                say: "Read the passage again. Which detail is implied, not stated?"
                options: ["Biscuit has been up to mischief.", "The house was silent.", "There was a trail of feathers."]
                answer: "Biscuit has been up to mischief."
                hints:
                  - "Which one does the text never say in words?"
                  - "Two of these are written in the text."
                  - "Biscuit has been up to mischief."
              - id: l2-f3
                type: multiple_choice
                text: "Ali kept looking at the door of the classroom. He had a present hidden under his desk. Today was Mrs Kaur's last day.\n\nWhat will Ali probably do?"
                say: "Read the passage. What will Ali probably do?"
                options: ["give Mrs Kaur the present", "keep the present for himself", "hide from Mrs Kaur all day"]
                answer: "give Mrs Kaur the present"
                hints:
                  - "Why might he have a present today?"
                  - "It is her last day."
                  - "Give Mrs Kaur the present."
              - id: l2-f4
                type: multiple_choice
                text: "Ben was sure the shop would be shut. Then he saw that the lights were on and the door was propped open.\n\nWhat is the best new prediction?"
                say: "Read the passage. What is the best new prediction?"
                options: ["Ben will be able to go in.", "The shop is still shut.", "Ben will go to the moon."]
                answer: "Ben will be able to go in."
                feedback:
                  "The shop is still shut.": "That was Ben's first idea, but the new clues point another way: lights on, door open. Change your prediction."
                hints:
                  - "What do the lights and the door tell you?"
                  - "An open door and lights mean the shop is open."
                  - "Ben will be able to go in."
              - id: l2-f5
                type: true_false
                text: "Implied means the text says it in exact words."
                say: "Read it. Is it true?"
                answer: false
                hints:
                  - "Think of Nadia and the map."
                  - "The text never says lost."
                  - "No, implied means hinted at."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Kai looked at the cake, then at the empty plate in front of his sister. There were crumbs on her chin.\n\nWhat might Kai say next?"
                say: "Read the passage. What might Kai say next?"
                options: ["\"Did you eat my slice?\"", "\"I love your new shoes!\"", "\"Let's go swimming.\""]
                answer: "\"Did you eat my slice?\""
                hints: ["What do the crumbs hint at?"]
              - id: l2-s2
                type: multiple_choice
                text: "The old man shivered. He pulled his thin coat tighter and looked at the snow falling outside the bus stop.\n\nWhat might he do next?"
                say: "Read the passage. What might he do next?"
                options: ["look for somewhere warm", "take off his coat", "go for a swim"]
                answer: "look for somewhere warm"
                hints: ["What does the shivering hint at?"]
              - id: l2-s3
                type: multiple_choice
                text: "Nadia unfolded the map for the third time. She turned it round, then upside down.\n\nWhich clue hints that she is lost?"
                say: "Read the passage. Which clue hints that she is lost?"
                options: ["She turned it round, then upside down.", "Nadia had a map.", "The map was paper."]
                answer: "She turned it round, then upside down."
                option_audio: false
                hints: ["What would you do with a map if you were lost?"]
              - id: l2-s4
                type: multiple_choice
                text: "Rosa thought her team would lose. Then their best player came back onto the pitch, and the crowd cheered.\n\nWhat is the best new prediction?"
                say: "Read the passage. What is the best new prediction?"
                options: ["Rosa's team now has a better chance.", "They will lose for sure.", "The match will stop."]
                answer: "Rosa's team now has a better chance."
                hints: ["Change your prediction when you read something new."]
              - id: l2-s5
                type: true_false
                text: "Readers can change a prediction when they read something new."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Think of the park ranger."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Jade's alarm clock lay on the floor with no batteries in it. Sunlight was pouring through the curtains, and the house was quiet.\n\nWhat has probably happened?"
                say: "Read the passage. What has probably happened?"
                options: ["Jade has overslept.", "Jade got up very early.", "It is the middle of the night."]
                answer: "Jade has overslept."
              - id: l2-n2
                type: multiple_choice
                text: "Jade's alarm clock lay on the floor with no batteries in it. Sunlight was pouring through the curtains, and the house was quiet.\n\nWhat will Jade probably do when she wakes?"
                say: "Read the passage again. What will Jade probably do when she wakes?"
                options: ["rush to get ready", "go back to sleep for a week", "plant a tree"]
                answer: "rush to get ready"
              - id: l2-n3
                type: multiple_choice
                text: "Leo's hand shot up every time Miss Lee asked a question. Today she said the class would choose a new team captain.\n\nWhat is the best prediction?"
                say: "Read the passage. What is the best prediction?"
                options: ["Leo will want to be captain.", "Leo will hide under his desk.", "Leo will forget his name."]
                answer: "Leo will want to be captain."
              - id: l2-n4
                type: multiple_choice
                text: "Everyone said the haunted house was empty. But as Zoe walked past, a light came on in the top window.\n\nWhat is the best new prediction?"
                say: "Read the passage. What is the best new prediction?"
                options: ["Someone is in the house.", "The house is definitely empty.", "Zoe will turn into a ghost."]
                answer: "Someone is in the house."
              - id: l2-n5
                type: true_false
                text: "Dark clouds rolled across the sky.\n\nIn this sentence, the dark clouds are stated, not implied."
                say: "Read the sentence, then the statement under it. Is it true?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Lucas pulled on his wellies, grabbed a bucket and ran towards the rock pools.\n\nWhat will Lucas probably do?"
            say: "Read the passage. What will Lucas probably do?"
            options: ["look for crabs in the rock pools", "bake a cake", "go to the cinema"]
            answer: "look for crabs in the rock pools"
          - id: l2-c2
            type: multiple_choice
            text: "Lucas pulled on his wellies, grabbed a bucket and ran towards the rock pools.\n\nWhich clue helped you most?"
            say: "Read the passage again. Which clue helped you most?"
            options: ["He ran towards the rock pools.", "He was called Lucas.", "He ran."]
            answer: "He ran towards the rock pools."
          - id: l2-c3
            type: multiple_choice
            text: "Holly kept yawning in class. Her eyes kept closing, and her head dropped onto her arms.\n\nWhat is implied?"
            say: "Read the passage. What is implied?"
            options: ["Holly did not sleep well last night.", "Holly kept yawning.", "Holly is in class."]
            answer: "Holly did not sleep well last night."
          - id: l2-c4
            type: multiple_choice
            text: "The team thought the match would be cancelled. Then the rain stopped, and the sun came out.\n\nWhat is the best new prediction?"
            say: "Read the passage. What is the best new prediction?"
            options: ["The match will go ahead.", "The match will still be cancelled.", "The pitch will turn to sand."]
            answer: "The match will go ahead."
          - id: l2-c5
            type: true_false
            text: "\"A dragon will land\" is a sensible prediction for a story about a child going to the dentist."
            say: "Read it. Is it true?"
            answer: false
