# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.inference-evidence
skill: lit-en.comprehension.inference-evidence
curriculum: en-GB
language: en
title:
  de: Gefühle und Gründe erschließen und belegen
  en: Inferring and finding evidence
summary: >
  Writers do not always tell us what a character feels, thinks or wants;
  readers infer it from what the character does and says, then point to
  the words that show it. Lesson 1 infers feelings and thoughts from
  actions (a wobbling lip, a glance at the door) and picks the quotation
  that backs the inference up. Lesson 2 infers motives, why a character
  does something, and gives a point with its evidence; it ends with the
  skill check. Short passages are written for Twist; the child reads
  them, with the voice reading the question.
metadata:
  year: year-3
  topic: { de: Zwischen den Zeilen lesen, en: Reading between the lines }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.comprehension.simple-inference, lit-en.comprehension.questions]
  also_practises: [lit-en.comprehension.questions]
  vocabulary: { en: [infer, inference, evidence, clue, quotation, feelings, thoughts, motive, character, action] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: evidence-any-quote
      what: Picks any sentence from the text as evidence, even one that does not show the inference
      addressed: Learn screen 3 of lesson 1; l1-f3, l1-s3, l1-n3, l2-f2 and l2-c3, with feedback in l1-f3
    - id: guess-from-own-life
      what: Answers from what they would feel, not from clues in the text
      addressed: Learn screen 1 of lesson 1; l1-f1 feedback; l2-f4 and l2-s4 ask which answer the text supports
    - id: motive-is-action
      what: Gives what the character did as the reason why they did it
      addressed: Learn of lesson 2; l2-f1, l2-s1, l2-n1 and l2-c4, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Gefühle aus Handlungen, en: Feelings from actions }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ben yawned and rubbed his eyes.\n\nHow does Ben feel?"
            say: "Read the sentence. How does Ben feel?"
            options: ["tired", "excited", "cross"]
            answer: "tired"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which question word asks for a reason?"
            options: ["Why?", "Where?", "Who?"]
            answer: "Why?"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Maya stared at the empty peg where her coat should be. She checked under the bench twice. Her lip began to wobble."
            say: "Read the passage. The writer never says how Maya feels. But we can work it out from what she does. That is called inferring."
          - text: "Inference: Maya is upset and worried.\nClues: she checks twice; her lip wobbles."
            say: "Checking twice shows she is worried. A wobbling lip shows she is close to tears. So we infer: Maya is upset and worried."
          - text: "Evidence: \"Her lip began to wobble.\""
            say: "Evidence is the words from the text that show your inference. Copy them exactly, inside inverted commas. Choose words that really show the feeling: she stared at the peg does not show it as clearly."
          - text: "I think Maya feels ... because the text says \"...\""
            say: "A good answer gives your inference and your evidence: I think Maya feels upset because the text says her lip began to wobble."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "When Mrs Shah read out the winner, Jake leapt out of his seat and punched the air.\n\nHow does Jake feel?"
                say: "Read the passage. How does Jake feel?"
                options: ["delighted", "nervous", "bored"]
                answer: "delighted"
                feedback:
                  "nervous": "You might feel nervous waiting for a result, but look at what Jake does. Leaping up and punching the air shows something else."
                hints:
                  - "What does Jake do with his body?"
                  - "People punch the air when they win."
                  - "Delighted."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Leah is nervous. Tap the two words that show it."
                say: "Leah is nervous. Tap the two words that show it."
                show: { drawn: letter-card, text: "Leah's hands were shaking as she walked onto the stage" }
                spans: ["hands", "shaking"]
                hints:
                  - "Which part of her body gives a clue?"
                  - "What are her hands doing?"
                  - "hands and shaking."
              - id: l1-f3
                type: multiple_choice
                text: "Leo looked out of the window at the rain. He sighed and pushed his football boots under the bed.\n\nLeo is disappointed. Which is the best evidence?"
                say: "Read the passage. Leo is disappointed. Which quotation is the best evidence?"
                options: ["\"He sighed and pushed his football boots under the bed.\"", "\"Leo looked out of the window.\"", "\"his football boots\""]
                answer: "\"He sighed and pushed his football boots under the bed.\""
                option_audio: false
                feedback:
                  "\"Leo looked out of the window.\"": "These words are in the text, but looking out of a window does not show disappointment. Which action does?"
                hints:
                  - "Which words show a feeling?"
                  - "Sighing and putting the boots away show he will not play."
                  - "He sighed and pushed his football boots under the bed."
              - id: l1-f4
                type: multiple_choice
                text: "Priya kept glancing at the clock. She tapped her pencil on the desk and shuffled in her chair.\n\nWhat is Priya thinking?"
                say: "Read the passage. What is Priya thinking?"
                options: ["She wants the lesson to end.", "She loves this lesson.", "She is asleep."]
                answer: "She wants the lesson to end."
                hints:
                  - "Why would someone keep looking at the clock?"
                  - "Tapping and shuffling show she is restless."
                  - "She wants the lesson to end."
              - id: l1-f5
                type: true_false
                text: "Grandpa smiled as he looked at the old photo, but his eyes were wet.\n\nThe evidence shows Grandpa feels both happy and sad."
                say: "Read the passage, then the sentence under it. Is it true?"
                answer: true
                hints:
                  - "Look at his mouth, then his eyes."
                  - "A smile and wet eyes show two feelings."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ollie slammed the door and threw his bag on the floor.\n\nHow does Ollie feel?"
                say: "Read the passage. How does Ollie feel?"
                options: ["angry", "sleepy", "proud"]
                answer: "angry"
                hints: ["What do slamming and throwing show?"]
              - id: l1-s2
                type: highlight_in_text
                text: "Zara is scared. Tap the two verbs that show it."
                say: "Zara is scared. Tap the two verbs that show it."
                show: { drawn: letter-card, text: "Zara froze and held her breath as the floorboard creaked" }
                spans: ["froze", "held"]
                hints: ["What does her body do when she hears the creak?"]
              - id: l1-s3
                type: multiple_choice
                text: "Amira opened the parcel. She gasped and hugged the book to her chest.\n\nAmira is thrilled. Which is the best evidence?"
                say: "Read the passage. Amira is thrilled. Which quotation is the best evidence?"
                options: ["\"She gasped and hugged the book to her chest.\"", "\"Amira opened the parcel.\"", "\"the book\""]
                answer: "\"She gasped and hugged the book to her chest.\""
                option_audio: false
                hints: ["Which words show a feeling?"]
              - id: l1-s4
                type: multiple_choice
                text: "Finn stood at the edge of the pool. He looked at the water, then at his friends, then stepped back.\n\nWhat is Finn thinking?"
                say: "Read the passage. What is Finn thinking?"
                options: ["He is not sure he dares to jump.", "He cannot wait to jump in.", "He has lost his towel."]
                answer: "He is not sure he dares to jump."
                hints: ["Why would he step back?"]
              - id: l1-s5
                type: ordering
                text: "Ollie slammed the door and threw his bag on the floor.\n\nPut the cards in order: inference, then evidence."
                say: "Read the passage. Put the cards in order to give an inference with evidence."
                options: ["because the text says", "I think Ollie is angry", "\"Ollie slammed the door.\""]
                slot_count: 3
                answer: ["I think Ollie is angry", "because the text says", "\"Ollie slammed the door.\""]
                option_audio: false
                hints: ["Inference first, then because the text says, then the quotation."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ruby stared at her shoes. When the teacher asked who had broken the vase, her cheeks turned red.\n\nHow does Ruby feel?"
                say: "Read the passage. How does Ruby feel?"
                options: ["guilty", "excited", "hungry"]
                answer: "guilty"
              - id: l1-n2
                type: highlight_in_text
                text: "Noah is proud. Tap the two words that show it."
                say: "Noah is proud. Tap the two words that show it."
                show: { drawn: letter-card, text: "Noah grinned and held his certificate up high for everyone to see" }
                spans: ["grinned", "high"]
              - id: l1-n3
                type: multiple_choice
                text: "Kit sat alone on the bench at playtime. He watched the others play tag and kicked at the gravel.\n\nKit feels lonely. Which is the best evidence?"
                say: "Read the passage. Kit feels lonely. Which quotation is the best evidence?"
                options: ["\"Kit sat alone on the bench\"", "\"kicked at the gravel\"", "\"at playtime\""]
                answer: "\"Kit sat alone on the bench\""
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Isla read the note again and again. Then she smiled and tucked it safely in her pocket.\n\nWhat does Isla think of the note?"
                say: "Read the passage. What does Isla think of the note?"
                options: ["It is special to her.", "It is rubbish.", "It is boring."]
                answer: "It is special to her."
              - id: l1-n5
                type: true_false
                text: "Dev slumped in his chair and let out a long yawn.\n\nThe evidence shows that Dev is full of energy."
                say: "Read the passage, then the sentence under it. Is it true?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Lily jumped up and down and clapped her hands.\n\nHow does Lily feel?"
            say: "Read the sentence. How does Lily feel?"
            options: ["excited", "worried", "sad"]
            answer: "excited"
          - id: l1-c2
            type: multiple_choice
            text: "What is evidence?"
            options: ["words from the text that show your idea", "a guess about the ending", "a picture you draw"]
            answer: "words from the text that show your idea"
          - id: l1-c3
            type: highlight_in_text
            text: "Sam is worried. Tap the two verbs that show it."
            say: "Sam is worried. Tap the two verbs that show it."
            show: { drawn: letter-card, text: "Sam bit his nails and paced up and down the hall" }
            spans: ["bit", "paced"]

  - n: 2
    title: { de: "Warum handelt die Figur so?", en: "Why does the character do it?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Hana's knees were knocking as she waited for her turn.\n\nHow does Hana feel?"
            say: "Read the sentence. How does Hana feel?"
            options: ["nervous", "bored", "angry"]
            answer: "nervous"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Evidence must be words that are really in the text."
            say: "Read it. Is it true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Sam saved half his pocket money every week. On the way home he always stopped at the bike shop and pressed his nose to the window."
            say: "Read the passage. A motive is the reason why a character does something. Why does Sam save his money?"
          - text: "Motive: Sam wants to buy a bike.\nEvidence: \"he always stopped at the bike shop\""
            say: "The writer does not tell us. But Sam always stops at the bike shop, so we infer he is saving to buy a bike. Saving money is what he does; buying the bike is why."
          - text: "Grace put her last biscuit on Tom's plate. Tom had dropped his lunch in a puddle."
            say: "Why does Grace give away her biscuit? Tom has no lunch, so she feels sorry for him and wants to help. Her motive is kindness."
          - text: "Point: Grace is kind.\nEvidence: \"Grace put her last biscuit on Tom's plate.\"\nExplain: Giving away her last biscuit shows she cares about Tom."
            say: "A strong answer has a point, the evidence, and a short explanation of how the evidence shows the point."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Every evening Mo practised his kicks in the garden until it got dark. The team trials were on Saturday.\n\nWhy does Mo practise so much?"
                say: "Read the passage. Why does Mo practise so much?"
                options: ["He wants to get into the team.", "He practises his kicks in the garden.", "He is afraid of the dark."]
                answer: "He wants to get into the team."
                feedback:
                  "He practises his kicks in the garden.": "That is what Mo does. The question asks why he does it. What is happening on Saturday?"
                hints:
                  - "What is happening on Saturday?"
                  - "Trials are when you try to get into a team."
                  - "He wants to get into the team."
              - id: l2-f2
                type: multiple_choice
                text: "Every evening Mo practised his kicks in the garden until it got dark. The team trials were on Saturday.\n\nWhich quotation is the best evidence for his motive?"
                say: "Read the passage. Which quotation is the best evidence for Mo's motive?"
                options: ["\"The team trials were on Saturday.\"", "\"until it got dark\"", "\"in the garden\""]
                answer: "\"The team trials were on Saturday.\""
                option_audio: false
                hints:
                  - "Which words tell you what he is aiming for?"
                  - "The trials are his goal."
                  - "The team trials were on Saturday."
              - id: l2-f3
                type: multiple_choice
                text: "Ava crept downstairs before anyone was awake. She laid the table, made toast and put a card by Mum's plate.\n\nWhy does Ava do this?"
                say: "Read the passage. Why does Ava do this?"
                options: ["She wants to surprise Mum.", "She is hungry for toast.", "She likes laying tables."]
                answer: "She wants to surprise Mum."
                hints:
                  - "Why creep down before anyone is awake?"
                  - "What does the card tell you?"
                  - "She wants to surprise Mum."
              - id: l2-f4
                type: multiple_choice
                text: "The fox sat under the tree and looked up at the crow with the cheese. \"What a beautiful bird!\" said the fox. \"I am sure you sing beautifully too.\"\n\nWhy does the fox praise the crow?"
                say: "Read the passage. Why does the fox praise the crow?"
                options: ["He wants the crow to open its beak and drop the cheese.", "He thinks the crow is his best friend.", "He loves music."]
                answer: "He wants the crow to open its beak and drop the cheese."
                hints:
                  - "What does the fox keep looking at?"
                  - "If the crow sings, what happens to the cheese?"
                  - "He wants the crow to drop the cheese."
              - id: l2-f5
                type: ordering
                text: "Ava crept downstairs before anyone was awake. She laid the table, made toast and put a card by Mum's plate.\n\nPut the answer in order: point, evidence, explain."
                say: "Read the passage. Put the three sentences in order: the point, the evidence, then the explanation."
                options: ["This shows she is planning to surprise someone.", "Ava is thoughtful.", "The text says she \"put a card by Mum's plate\"."]
                slot_count: 3
                answer: ["Ava is thoughtful.", "The text says she \"put a card by Mum's plate\".", "This shows she is planning to surprise someone."]
                option_audio: false
                hints:
                  - "The point is short and says what you think."
                  - "Evidence uses words from the text."
                  - "Ava is thoughtful; the text says ...; this shows ..."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Jas hid the broken plate under the sofa and quickly swept up the bits.\n\nWhy does Jas do this?"
                say: "Read the passage. Why does Jas do this?"
                options: ["She does not want anyone to know she broke it.", "She hides the plate under the sofa.", "She likes sweeping."]
                answer: "She does not want anyone to know she broke it."
                hints: ["Not what she does, but why."]
              - id: l2-s2
                type: multiple_choice
                text: "Jas hid the broken plate under the sofa and quickly swept up the bits.\n\nWhich word shows she is in a hurry?"
                say: "Read the passage. Which word shows she is in a hurry?"
                options: ["quickly", "hid", "plate"]
                answer: "quickly"
                hints: ["Look for a word about speed."]
              - id: l2-s3
                type: multiple_choice
                text: "Ellie gave her umbrella to the old man at the bus stop, even though it was pouring.\n\nWhat does this tell us about Ellie?"
                say: "Read the passage. What does this tell us about Ellie?"
                options: ["She is kind and puts others first.", "She likes getting wet.", "She does not need umbrellas."]
                answer: "She is kind and puts others first."
                hints: ["She gets wet so that someone else does not."]
              - id: l2-s4
                type: multiple_choice
                text: "Raj looked at the last slice of cake. Then he cut it in half and gave one piece to his sister.\n\nWhich inference does the text support?"
                say: "Read the passage. Which inference does the text support?"
                options: ["Raj wants to be fair.", "Raj does not like cake.", "Raj is angry with his sister."]
                answer: "Raj wants to be fair."
                hints: ["What does cutting it in half show?"]
              - id: l2-s5
                type: true_false
                text: "\"Mo practises in the garden\" explains why Mo practises."
                say: "Read it. Is it true?"
                answer: false
                hints: ["It says what he does, not why."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ezra wrote his name on every page of his new notebook and kept it in his bag all day.\n\nWhy does Ezra do this?"
                say: "Read the passage. Why does Ezra do this?"
                options: ["He does not want to lose it or have it taken.", "He writes his name on every page.", "He wants to give it away."]
                answer: "He does not want to lose it or have it taken."
              - id: l2-n2
                type: multiple_choice
                text: "The little goat waited until the troll was asleep. Then he tiptoed across the bridge.\n\nWhy does the goat wait?"
                say: "Read the passage. Why does the goat wait?"
                options: ["He wants to cross without the troll catching him.", "He is too tired to walk.", "He wants to wake the troll."]
                answer: "He wants to cross without the troll catching him."
              - id: l2-n3
                type: multiple_choice
                text: "The little goat waited until the troll was asleep. Then he tiptoed across the bridge.\n\nWhich word is the best evidence that the goat is being careful?"
                say: "Read the passage. Which word is the best evidence that the goat is being careful?"
                options: ["tiptoed", "bridge", "little"]
                answer: "tiptoed"
              - id: l2-n4
                type: ordering
                text: "Nana wrapped her scarf around Jack's neck before he went out into the snow.\n\nPut the answer in order: point, evidence, explain."
                say: "Read the passage. Put the three sentences in order: the point, the evidence, then the explanation."
                options: ["This shows she wants to keep him warm.", "Nana is caring.", "The text says she \"wrapped her scarf around Jack's neck\"."]
                slot_count: 3
                answer: ["Nana is caring.", "The text says she \"wrapped her scarf around Jack's neck\".", "This shows she wants to keep him warm."]
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Lena tore up her drawing and pushed it in the bin.\n\nThe text supports the idea that Lena is pleased with her drawing."
                say: "Read the passage, then the sentence under it. Is it true?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Kai's face lit up and he ran to hug his dad at the airport gate.\n\nHow does Kai feel?"
            say: "Read the sentence. How does Kai feel?"
            options: ["overjoyed", "frightened", "jealous"]
            answer: "overjoyed"
          - id: l2-c2
            type: multiple_choice
            text: "Poppy filled the bird feeder every morning before school, even when it was frosty.\n\nWhy does Poppy do this?"
            say: "Read the passage. Why does Poppy do this?"
            options: ["She wants the birds to have food in the cold.", "She fills the feeder every morning.", "She wants to be late for school."]
            answer: "She wants the birds to have food in the cold."
          - id: l2-c3
            type: multiple_choice
            text: "Tom stood at the back of the class photo and hid his face behind his hands.\n\nTom feels shy. Which is the best evidence?"
            say: "Read the passage. Tom feels shy. Which quotation is the best evidence?"
            options: ["\"hid his face behind his hands\"", "\"class photo\"", "\"Tom stood\""]
            answer: "\"hid his face behind his hands\""
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "After the bell, Nia stayed behind and stacked the chairs. Mr Price was tidying the classroom on his own, and he looked tired.\n\nWhat is Nia's motive?"
            say: "Read the passage. What is Nia's motive?"
            options: ["She wants to help her teacher.", "She stacked the chairs.", "She dislikes going home."]
            answer: "She wants to help her teacher."
          - id: l2-c5
            type: true_false
            text: "A good answer gives your inference and evidence from the text."
            say: "Read it. Is it true?"
            answer: true
