# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.myths-legends
skill: lit-en.texts.myths-legends
curriculum: en-GB
language: en
title:
  de: Mythen, Sagen und Geschichten aus aller Welt
  en: Myths, legends and stories from around the world
summary: >
  Children meet myths, legends and traditional stories from different
  cultures in short Twist retellings. Lesson 1 takes myths, which often
  explain how something in the world came to be: Persephone and the
  seasons (Ancient Greece), Icarus (Ancient Greece) and the Great Race of
  the zodiac animals (China). Lesson 2 takes legends about heroes who may
  have been real (Robin Hood, King Arthur) and trickster and hero tales
  (Anansi from West Africa, Rama and Sita from India), and practises
  retelling: the main events in order, in a few sentences. It ends with
  the skill check. Retelling aloud is practised with a model; the skill
  check uses choice and order tasks.
metadata:
  year: year-3
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.texts.traditional-tales]
  also_practises: [lit-en.texts.traditional-tales]
  vocabulary: { en: [myth, legend, traditional tale, culture, hero, trickster, god, goddess, retell, main events] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: myth-legend-same
      what: Thinks myths and legends are the same thing
      addressed: Learn of lesson 2 sets a legend (a hero who may have been real, a real place) against a myth (gods, explaining the world); l2-f1, l2-f2, l2-s1, l2-n1 and l2-c1, with feedback in l2-f1
    - id: retell-every-detail
      what: Retells by listing every small detail, or by jumping to the end, so the main events are lost
      addressed: Learn screen 4 of lesson 2; l2-f5, l2-s5 and l2-n5 pick the best retelling, with feedback in l2-f5; ordering tasks l1-f4, l2-f4 and l2-c4
    - id: myth-only-story
      what: Thinks a myth is just a made-up story, and misses that it explains something in nature
      addressed: Learn of lesson 1; l1-f1, l1-f3, l1-s1 and l1-c1 ask what the myth explains, with feedback in l1-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Mythen erklären die Welt, en: Myths explain the world }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How do many traditional tales begin?"
            options: ["Once upon a time", "Yesterday at school", "Dear Grandma"]
            answer: "Once upon a time"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "In The Three Billy Goats Gruff, who lives under the bridge?"
            options: ["a troll", "a wolf", "a giant"]
            answer: "a troll"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Myths are very old stories. People told them long ago, all over the world, and passed them on by word of mouth."
            say: "Myths are very old stories. People told them long ago, all over the world, before they were written down."
          - text: "Persephone (Ancient Greece)\nHades took Persephone down to his kingdom under the ground. Her mother Demeter, goddess of the harvest, was so sad that nothing would grow. Persephone had eaten six pomegranate seeds there, so every year she must go back for six months. While she is away, it is winter. When she returns, spring comes."
            say: "Read this myth from Ancient Greece."
          - text: "A myth often explains something in the world.\nPersephone explains why we have seasons."
            say: "Myths often have gods and goddesses and magic. And they often explain something in the world: here, why winter comes and goes every year."
          - text: "The Great Race (China)\nThe Jade Emperor held a race across a river. The clever rat rode on the ox's back and jumped off at the end to win. The ox came second. That is why the year of the rat comes first."
            say: "Here is a myth from China. It explains the order of the animals in the Chinese zodiac."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What does the myth of Persephone explain?"
                options: ["why we have seasons", "why pomegranates are red", "how to grow a garden"]
                answer: "why we have seasons"
                feedback:
                  "why pomegranates are red": "The seeds are part of the story, but the myth explains something bigger. What happens every year when Persephone goes away?"
                hints:
                  - "What happens to the world while she is away?"
                  - "Winter comes when she goes, spring when she returns."
                  - "Why we have seasons."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Hades took Persephone down to his kingdom under the ground. Her mother Demeter, goddess of the harvest, was so sad that nothing would grow.\n\nWhy could nothing grow?"
                say: "Read the part of the myth. Why could nothing grow?"
                options: ["Demeter was too sad.", "There was no rain.", "Hades ate the seeds."]
                answer: "Demeter was too sad."
                hints:
                  - "Who is the goddess of the harvest?"
                  - "Demeter missed her daughter."
                  - "Demeter was too sad."
              - id: l1-f3
                type: multiple_choice
                text: "Icarus (Ancient Greece)\nDaedalus made wings of feathers and wax for himself and his son Icarus. \"Do not fly too close to the sun,\" he said. But Icarus flew higher and higher. The wax melted, and he fell into the sea.\n\nWhat lesson does this myth teach?"
                say: "Read the myth of Icarus. What lesson does it teach?"
                options: ["Listen to good advice.", "Feathers are light.", "The sea is deep."]
                answer: "Listen to good advice."
                hints:
                  - "What did his father tell him?"
                  - "Icarus did not do what he was told."
                  - "Listen to good advice."
              - id: l1-f4
                type: ordering
                text: "Put the events of Icarus in order."
                say: "Put the main events of the Icarus myth in order."
                options: ["The wax melted.", "Daedalus made wings.", "Icarus flew too high.", "Icarus fell into the sea."]
                slot_count: 4
                answer: ["Daedalus made wings.", "Icarus flew too high.", "The wax melted.", "Icarus fell into the sea."]
                hints:
                  - "What had to happen before anyone could fly?"
                  - "The wings came first; the fall came last."
                  - "Made wings, flew too high, wax melted, fell into the sea."
              - id: l1-f5
                type: true_false
                text: "In the Great Race, the rat won because it was the fastest runner."
                say: "Read it. Is it true?"
                answer: false
                hints:
                  - "How did the rat cross the river?"
                  - "It rode on the ox's back."
                  - "No, it won by being clever, not fast."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What does the myth of the Great Race explain?"
                options: ["the order of the zodiac animals", "how rivers are made", "why oxen are strong"]
                answer: "the order of the zodiac animals"
                hints: ["Which animal's year comes first, and why?"]
              - id: l1-s2
                type: sorting
                text: "Which things are often in a myth?"
                say: "Read each card. Is it often in a myth, or not?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "often in a myth" }, say: "Often in a myth." }
                  - { id: no, show: { text: "not usually" }, say: "Not usually." }
                options:
                  - { text: "gods and goddesses", bin: yes }
                  - { text: "magic", bin: yes }
                  - { text: "a reason for something in nature", bin: yes }
                  - { text: "mobile phones", bin: no }
                  - { text: "a school timetable", bin: no }
                hints: ["Myths are very old stories with gods and magic."]
              - id: l1-s3
                type: multiple_choice
                text: "Pandora (Ancient Greece)\nPandora was given a jar and told never to open it. She was curious and lifted the lid. Out flew all the troubles of the world. Only hope was left inside.\n\nWhat does this myth explain?"
                say: "Read the myth of Pandora. What does it explain?"
                options: ["why there are troubles in the world", "how jars are made", "why lids are heavy"]
                answer: "why there are troubles in the world"
                hints: ["What flew out of the jar?"]
              - id: l1-s4
                type: true_false
                text: "Myths come from many different cultures, such as Ancient Greece and China."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Think of the myths you have read today."]
              - id: l1-s5
                type: ordering
                text: "Put the events of Persephone in order."
                say: "Put the main events of the Persephone myth in order."
                options: ["Each year she goes back, and winter comes again.", "Hades took Persephone away.", "Persephone returned, and spring came.", "Demeter was sad and nothing grew."]
                slot_count: 4
                answer: ["Hades took Persephone away.", "Demeter was sad and nothing grew.", "Persephone returned, and spring came.", "Each year she goes back, and winter comes again."]
                hints: ["Start with what Hades did; end with what happens every year."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "King Midas (Ancient Greece)\nKing Midas wished that everything he touched would turn to gold. Soon his bread and his water turned to gold, and he could not eat or drink.\n\nWhat lesson does this myth teach?"
                say: "Read the myth of King Midas. What lesson does it teach?"
                options: ["Being greedy can make you unhappy.", "Gold is shiny.", "Kings eat bread."]
                answer: "Being greedy can make you unhappy."
              - id: l1-n2
                type: multiple_choice
                text: "Where do the myths of Persephone, Icarus and Midas come from?"
                options: ["Ancient Greece", "China", "India"]
                answer: "Ancient Greece"
              - id: l1-n3
                type: true_false
                text: "In the Great Race, the ox came second."
                say: "Read it. Is it true?"
                answer: true
              - id: l1-n4
                type: matching
                text: "Match each myth with what it is about."
                say: "Match each myth with what it explains or teaches."
                pairs:
                  - { left: { text: "Persephone" }, right: { text: "the seasons" } }
                  - { left: { text: "The Great Race" }, right: { text: "the zodiac animals" } }
                  - { left: { text: "Pandora" }, right: { text: "troubles in the world" } }
              - id: l1-n5
                type: multiple_choice
                text: "Which sentence is the best short retelling of Pandora?"
                options: ["Pandora opened a jar she was told to keep shut, and all the troubles flew out, leaving only hope.", "Pandora had a jar.", "Hope was in a jar, and it was very small and quiet and stayed there."]
                answer: "Pandora opened a jar she was told to keep shut, and all the troubles flew out, leaving only hope."
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Many myths explain something in the world. Which question might a myth answer?"
            options: ["Why does the sun rise?", "What is for lunch?", "Where is my bag?"]
            answer: "Why does the sun rise?"
          - id: l1-c2
            type: multiple_choice
            text: "Why did Icarus fall into the sea?"
            options: ["The sun melted the wax on his wings.", "A storm blew him down.", "His father pushed him."]
            answer: "The sun melted the wax on his wings."
          - id: l1-c3
            type: true_false
            text: "The Great Race is a myth from China."
            say: "Read it. Is it true?"
            answer: true

  - n: 2
    title: { de: "Sagen, Helden und Nacherzählen", en: "Legends, heroes and retelling" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What does a myth often explain?"
            options: ["something in nature or the world", "how to bake bread", "the rules of football"]
            answer: "something in nature or the world"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Persephone is a myth from China."
            say: "Read it. Is it true?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Robin Hood (England)\nRobin Hood lived in Sherwood Forest with his band of outlaws. He took from the rich to give to the poor, and he tricked the Sheriff of Nottingham again and again."
            say: "Read this legend from England."
          - text: "A legend is about a hero who may have been a real person, in a real place. Over the years, people added made-up parts.\nA myth has gods and magic and often explains the world."
            say: "A legend is a story about a hero who may really have lived, in a place you can visit, like Sherwood Forest. Over hundreds of years people added exciting parts that are not true. A myth is different: it has gods and magic, and often explains the world."
          - text: "Anansi (West Africa)\nAnansi the spider wanted all the stories in the world. The sky god said, \"Bring me a python, a leopard and the hornets.\" Clever Anansi tricked each one, so the sky god gave him the stories."
            say: "Some traditional stories have a trickster: a small, clever character who wins by using his wits. Anansi the spider comes from West Africa."
          - text: "To retell a story:\n1. Name the main character.\n2. Tell the main events in order.\n3. Say how it ends.\nLeave out small details."
            say: "When you retell a story, you tell it again in your own words. Say who it is about, tell the main events in order and say how it ends. Leave out the small details."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Robin Hood is a legend. What makes it a legend?"
                options: ["He may have been a real person in a real place.", "It explains why we have seasons.", "It is about gods on a mountain."]
                answer: "He may have been a real person in a real place."
                feedback:
                  "It explains why we have seasons.": "That is what a myth often does. A legend is about a hero who may have been real."
                hints:
                  - "Where did Robin Hood live?"
                  - "Sherwood Forest is a real place you can visit."
                  - "He may have been a real person in a real place."
              - id: l2-f2
                type: sorting
                text: "Myth or legend?"
                say: "Read each story. Is it a myth or a legend?"
                option_audio: false
                bins:
                  - { id: myth, show: { text: "myth" }, say: "Myth." }
                  - { id: legend, show: { text: "legend" }, say: "Legend." }
                options:
                  - { text: "Persephone and the seasons", bin: myth }
                  - { text: "Robin Hood in Sherwood Forest", bin: legend }
                  - { text: "Pandora's jar of troubles", bin: myth }
                  - { text: "King Arthur pulls a sword from a stone", bin: legend }
                hints:
                  - "Does it have gods and explain the world, or a hero who may have lived?"
                  - "Robin Hood and King Arthur are British heroes."
                  - "Persephone and Pandora are myths; Robin Hood and King Arthur are legends."
              - id: l2-f3
                type: multiple_choice
                text: "How did Anansi get the stories?"
                options: ["He tricked the animals he had to catch.", "He was the strongest animal.", "He bought them with gold."]
                answer: "He tricked the animals he had to catch."
                hints:
                  - "Is Anansi big and strong?"
                  - "He is a small spider who uses his wits."
                  - "He tricked them."
              - id: l2-f4
                type: ordering
                text: "Put the events of Anansi in order."
                say: "Put the main events of the Anansi story in order."
                options: ["The sky god gave him the stories.", "Anansi wanted all the stories.", "Anansi tricked the python, the leopard and the hornets.", "The sky god set him a task."]
                slot_count: 4
                answer: ["Anansi wanted all the stories.", "The sky god set him a task.", "Anansi tricked the python, the leopard and the hornets.", "The sky god gave him the stories."]
                hints:
                  - "What did Anansi want at the start?"
                  - "The task comes before the tricks."
                  - "Wanted the stories, got a task, tricked the animals, got the stories."
              - id: l2-f5
                type: multiple_choice
                text: "Which is the best retelling of Robin Hood?"
                options: ["Robin Hood lived in Sherwood Forest. He took from the rich to give to the poor and kept tricking the Sheriff of Nottingham.", "Robin Hood had a bow. It was made of wood. He had arrows. They had feathers.", "In the end the Sheriff was tricked."]
                answer: "Robin Hood lived in Sherwood Forest. He took from the rich to give to the poor and kept tricking the Sheriff of Nottingham."
                option_audio: false
                feedback:
                  "Robin Hood had a bow. It was made of wood. He had arrows. They had feathers.": "These are small details. A retelling tells the main events: who, what they did, how it ends."
                hints:
                  - "Which one names the hero and the main events?"
                  - "One is only details, one jumps to the end."
                  - "The one about Sherwood Forest, the rich and the poor."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "King Arthur (Britain)\nNo one could pull the sword out of the stone. Then a young boy called Arthur pulled it out easily, and so he became king of Britain.\n\nWhat kind of story is this?"
                say: "Read the story of King Arthur. What kind of story is it?"
                options: ["a legend", "a myth", "a fact file"]
                answer: "a legend"
                hints: ["Is it about a hero who may have lived, or about gods?"]
              - id: l2-s2
                type: multiple_choice
                text: "Rama and Sita (India)\nThe demon king Ravana carried Sita away to his island. Prince Rama and Hanuman, the monkey king, built a bridge across the sea and rescued her. People lit lamps to guide them home.\n\nWhich festival is this story told at?"
                say: "Read the story of Rama and Sita. Which festival is it told at?"
                options: ["Diwali", "Easter", "Bonfire Night"]
                answer: "Diwali"
                hints: ["Diwali is the festival of lights."]
              - id: l2-s3
                type: multiple_choice
                text: "Who helped Rama to rescue Sita?"
                options: ["Hanuman, the monkey king", "Anansi the spider", "the Sheriff of Nottingham"]
                answer: "Hanuman, the monkey king"
                hints: ["Who helped to build the bridge?"]
              - id: l2-s4
                type: matching
                text: "Match each story with where it comes from."
                say: "Match each story with the place it comes from."
                pairs:
                  - { left: { text: "Anansi" }, right: { text: "West Africa" } }
                  - { left: { text: "Rama and Sita" }, right: { text: "India" } }
                  - { left: { text: "Robin Hood" }, right: { text: "England" } }
                  - { left: { text: "The Great Race" }, right: { text: "China" } }
                hints: ["Robin Hood lived in Sherwood Forest, near Nottingham."]
              - id: l2-s5
                type: multiple_choice
                text: "Which is the best retelling of King Arthur?"
                options: ["Nobody could pull a sword out of a stone until young Arthur pulled it out easily, so he became king.", "There was a stone. It was grey. It was heavy.", "Arthur became king."]
                answer: "Nobody could pull a sword out of a stone until young Arthur pulled it out easily, so he became king."
                option_audio: false
                hints: ["A good retelling has the problem, what happened and the end."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "A legend is often about a hero who may have been a real person."
                say: "Read it. Is it true?"
                answer: true
              - id: l2-n2
                type: multiple_choice
                text: "What is a trickster in a story?"
                options: ["a clever character who wins by tricks", "the strongest character", "the king"]
                answer: "a clever character who wins by tricks"
              - id: l2-n3
                type: ordering
                text: "Put the events of Rama and Sita in order."
                say: "Put the main events of Rama and Sita in order."
                options: ["Rama and Hanuman built a bridge.", "Ravana carried Sita away.", "People lit lamps to guide them home.", "They rescued Sita."]
                slot_count: 4
                answer: ["Ravana carried Sita away.", "Rama and Hanuman built a bridge.", "They rescued Sita.", "People lit lamps to guide them home."]
              - id: l2-n4
                type: speak
                text: "Retell Anansi in three or four sentences."
                say: "Retell the story of Anansi in your own words: who, the main events in order, and the end. Then listen to an example."
                expected_text: "Anansi the spider wanted all the stories in the world. The sky god told him to bring a python, a leopard and the hornets. Anansi tricked each one. So the sky god gave him all the stories."
              - id: l2-n5
                type: multiple_choice
                text: "Tom retells Persephone: \"In the end it was spring.\" What is wrong with his retelling?"
                options: ["He only told the end, not the main events.", "He told too many small details.", "He used his own words."]
                answer: "He only told the end, not the main events."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which story is a myth?"
            options: ["how the seasons began, with gods and goddesses", "an outlaw who lived in a real forest", "a king who may have ruled Britain"]
            answer: "how the seasons began, with gods and goddesses"
          - id: l2-c2
            type: multiple_choice
            text: "Which character is a trickster?"
            options: ["Anansi", "Demeter", "Hades"]
            answer: "Anansi"
          - id: l2-c3
            type: multiple_choice
            text: "Where does the story of Rama and Sita come from?"
            options: ["India", "Ancient Greece", "England"]
            answer: "India"
          - id: l2-c4
            type: ordering
            text: "Put the events of King Midas in order."
            say: "Put the main events of King Midas in order."
            options: ["His food turned to gold.", "Midas wished for a golden touch.", "He could not eat or drink."]
            slot_count: 3
            answer: ["Midas wished for a golden touch.", "His food turned to gold.", "He could not eat or drink."]
          - id: l2-c5
            type: true_false
            text: "A good retelling lists every small detail of the story."
            say: "Read it. Is it true?"
            answer: false
