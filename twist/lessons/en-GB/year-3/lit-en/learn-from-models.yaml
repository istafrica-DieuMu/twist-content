# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.learn-from-models
skill: lit-en.composition.learn-from-models
curriculum: en-GB
language: en
title:
  de: Von Mustertexten lernen
  en: Learning from model texts
summary: >
  Before writing, children read a text like the one they will write and
  learn from it. Lesson 1 studies the structure of a model: a set of
  instructions (title, what you need, numbered steps) and a recount
  (who, where and when first, events in time order, an ending), so the
  child can say which parts their own text needs. Lesson 2 studies the
  vocabulary and grammar of a model: bossy verbs and time words in
  instructions, past tense and first person in a recount, precise verbs
  and expanded noun phrases in a story opening; it ends with the skill
  check. Writing the child's own text waits for a free-writing task; the
  lessons practise noticing and choosing.
metadata:
  year: year-3
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.composition.plan-key-words]
  also_practises: [lit-en.composition.purposes]
  vocabulary: { en: [model text, structure, feature, instructions, recount, story opening, bossy verb, imperative, time word, past tense, first person, expanded noun phrase] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: copy-the-content
      what: Thinks learning from a model means copying its words and topic, not its structure and language
      addressed: Learn screen 1 of lesson 1 and screen 4 of lesson 2; l1-f5, l2-f5, l2-s5 and l2-c5, with feedback in l1-f5
    - id: one-structure-fits-all
      what: Uses the same structure for every kind of text (numbered steps in a recount)
      addressed: Learn screens 2 and 3 of lesson 1; l1-f3, l1-s3, l1-n3 and l2-c1, with feedback in l1-f3
    - id: grammar-not-noticed
      what: Notices what a model says but not how it is written (tense, person, verb forms)
      addressed: Learn of lesson 2; l2-f1, l2-f2, l2-s1, l2-n1 and l2-c2, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Den Aufbau untersuchen, en: Studying the structure }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "You plan a story about a fox. Which is a good key-word note?"
            options: ["hungry fox, dark wood", "Once upon a time there was a fox who was very hungry and lived in a dark wood.", "the"]
            answer: "hungry fox, dark wood"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "A plan can be written in key words instead of full sentences."
            say: "Read it. Is it true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "A model text is a good example of the kind of text you are going to write."
            say: "Before you write, read a model text: a good example of the same kind of text. You do not copy its words. You learn how it is built and how it is written, then use that in your own writing."
          - text: "How to Make a Cress Head\nYou will need: an eggshell, cotton wool, cress seeds, a pen.\n1. First, draw a face on the eggshell.\n2. Next, put damp cotton wool inside.\n3. Then, sprinkle the seeds on top.\n4. Finally, leave it on a sunny window sill."
            say: "Here is a model set of instructions. Look at its structure: a title that says what you will make, a list of what you need, then numbered steps in order."
          - text: "Our Trip to the Seaside\nOn Friday, our class went to Whitby.\nFirst, we explored the rock pools. After lunch, we built sandcastles.\nIt was the best day of the year."
            say: "Here is a model recount. Its structure is different: an opening that says who, where and when, then the events in time order, and an ending that says how the writer felt."
          - text: "Ask: What parts does it have? In what order?"
            say: "When you study a model, ask: what parts does it have, and in what order? Then your text can have the same parts."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How to Make a Cress Head\nYou will need: an eggshell, cotton wool, cress seeds, a pen.\n1. First, draw a face on the eggshell.\n2. Next, put damp cotton wool inside.\n\nWhat comes straight after the title?"
                say: "Read the model instructions. What comes straight after the title?"
                options: ["a list of what you need", "the last step", "how the writer felt"]
                answer: "a list of what you need"
                hints:
                  - "Look at the line under the title."
                  - "It starts with You will need."
                  - "A list of what you need."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Put the parts of the instructions in order."
                say: "Put the parts of a set of instructions in order, like the model."
                options: ["numbered steps", "title", "what you need"]
                slot_count: 3
                answer: ["title", "what you need", "numbered steps"]
                hints:
                  - "What is at the very top?"
                  - "You collect things before you start the steps."
                  - "Title, what you need, numbered steps."
              - id: l1-f3
                type: multiple_choice
                text: "Ruby is writing a recount of her trip to the zoo. Which structure should she borrow from the model recount?"
                options: ["who, where and when; events in time order; an ending", "title; what you need; numbered steps", "a list of animals only"]
                answer: "who, where and when; events in time order; an ending"
                feedback:
                  "title; what you need; numbered steps": "That is the structure of instructions. A recount tells what happened, so it follows the model recount."
                hints:
                  - "Is a recount like instructions, or like the seaside trip?"
                  - "A recount tells what happened, in order."
                  - "Who, where and when; events in time order; an ending."
              - id: l1-f4
                type: multiple_choice
                text: "Our Trip to the Seaside\nOn Friday, our class went to Whitby.\n\nWhat does the opening sentence of the model recount tell the reader?"
                say: "Read the opening of the model recount. What does it tell the reader?"
                options: ["who, where and when", "what you need", "the moral of the story"]
                answer: "who, where and when"
                hints:
                  - "Find a time, a place and some people."
                  - "Friday, Whitby, our class."
                  - "Who, where and when."
              - id: l1-f5
                type: multiple_choice
                text: "Sam has read the cress head model. Now he will write how to make a paper boat. What should he take from the model?"
                options: ["its structure: title, what you need, numbered steps", "its words: cress seeds and eggshells", "nothing, because the topic is different"]
                answer: "its structure: title, what you need, numbered steps"
                feedback:
                  "its words: cress seeds and eggshells": "A paper boat needs no cress seeds. Sam learns how the model is built, not what it is about."
                hints:
                  - "Is his boat made of eggshells?"
                  - "He borrows how the text is built."
                  - "Its structure."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Why are the steps in the model instructions numbered?"
                options: ["so the reader does them in the right order", "to make the page colourful", "because every text has numbers"]
                answer: "so the reader does them in the right order"
                hints: ["What would happen if you sprinkled seeds before adding cotton wool?"]
              - id: l1-s2
                type: ordering
                text: "Put the parts of the recount in order."
                say: "Put the parts of a recount in order, like the model."
                options: ["an ending that says how you felt", "who, where and when", "the events in time order"]
                slot_count: 3
                answer: ["who, where and when", "the events in time order", "an ending that says how you felt"]
                hints: ["Start by setting the scene."]
              - id: l1-s3
                type: sorting
                text: "Which part belongs to which text?"
                say: "Read each part. Does it belong in instructions or in a recount?"
                option_audio: false
                bins:
                  - { id: instructions, show: { text: "instructions" }, say: "Instructions." }
                  - { id: recount, show: { text: "recount" }, say: "Recount." }
                options:
                  - { text: "You will need: ...", bin: instructions }
                  - { text: "3. Fold the paper in half.", bin: instructions }
                  - { text: "On Saturday, we went to the farm.", bin: recount }
                  - { text: "It was a brilliant day.", bin: recount }
                hints: ["Instructions tell you what to do; a recount tells what happened."]
              - id: l1-s4
                type: true_false
                text: "The model recount ends with a numbered list of things you need."
                say: "Read it. Is it true?"
                answer: false
                hints: ["How did the seaside recount end?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which question helps most when you study a model text?"
                options: ["What parts does it have, and in what order?", "How many pages is it?", "Who printed it?"]
                answer: "What parts does it have, and in what order?"
                hints: ["You are learning its structure."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How to Plant a Bulb\nYou will need: a pot, soil, a bulb, water.\n1. Fill the pot with soil.\n2. Push the bulb in, pointy end up.\n3. Water it well.\n\nHow many steps does the model have?"
                say: "Read the model instructions. How many steps does it have?"
                options: ["3", "4", "1"]
                answer: "3"
              - id: l1-n2
                type: multiple_choice
                text: "How to Plant a Bulb\nYou will need: a pot, soil, a bulb, water.\n1. Fill the pot with soil.\n2. Push the bulb in, pointy end up.\n3. Water it well.\n\nKit's instructions start straight at \"1. Fill the pot with soil.\" Which parts of the model are missing?"
                say: "Read the model again. Kit's instructions start straight at step one. Which parts are missing?"
                options: ["the title and what you need", "the numbered steps", "the last step"]
                answer: "the title and what you need"
              - id: l1-n3
                type: multiple_choice
                text: "Jess is writing a recount of sports day. Which opening follows the model?"
                options: ["Last Tuesday, Year 3 had sports day on the school field.", "You will need: a hoop and a bean bag.", "1. Run to the line."]
                answer: "Last Tuesday, Year 3 had sports day on the school field."
              - id: l1-n4
                type: true_false
                text: "Instructions and recounts have different structures."
                say: "Read it. Is it true?"
                answer: true
              - id: l1-n5
                type: ordering
                text: "Put the parts of the instructions in order."
                say: "Put the lines in order to make instructions like the model."
                options: ["1. Fold the paper in half.", "How to Make a Paper Fan", "You will need: a sheet of paper."]
                slot_count: 3
                answer: ["How to Make a Paper Fan", "You will need: a sheet of paper.", "1. Fold the paper in half."]
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is a model text?"
            options: ["a good example of the kind of text you will write", "a text about models and toys", "the text you copy word for word"]
            answer: "a good example of the kind of text you will write"
          - id: l1-c2
            type: multiple_choice
            text: "Which part comes first in a recount?"
            options: ["who, where and when", "an ending", "a list of what you need"]
            answer: "who, where and when"
          - id: l1-c3
            type: true_false
            text: "Instructions usually have numbered steps."
            say: "Read it. Is it true?"
            answer: true

  - n: 2
    title: { de: Wörter und Grammatik untersuchen, en: Studying words and grammar }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which text has a list of what you need?"
            options: ["instructions", "a recount", "a poem"]
            answer: "instructions"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "In a recount, the events are told ..."
            options: ["in time order", "in alphabetical order", "in any order"]
            answer: "in time order"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "1. First, draw a face on the eggshell.\n2. Next, put damp cotton wool inside."
            say: "Now study the language. In the instructions, each step starts with a bossy verb: draw, put, sprinkle, leave. This is also called an imperative verb. Time words like first, next and finally keep the order clear."
          - text: "On Friday, our class went to Whitby. We explored the rock pools."
            say: "In the recount, the verbs are in the past tense, went and explored, because it already happened. It uses we and our: the first person, because the writer was there."
          - text: "The ancient oak creaked in the wind. A tiny grey mouse scurried under its roots."
            say: "Here is a model story opening. Look at its words: precise verbs like creaked and scurried, instead of made a noise and ran, and expanded noun phrases like the ancient oak and a tiny grey mouse."
          - text: "Borrow the pattern, use your own words."
            say: "Borrow the patterns: bossy verbs, past tense, precise verbs, noun phrases. Then fill them with your own ideas."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the bossy verbs."
                say: "These steps follow the model. Tap the bossy verb in each step."
                show: { drawn: letter-card, text: "Fold the paper. Cut along the line. Stick the ends together." }
                spans: ["Fold", "Cut", "Stick"]
                hints:
                  - "A bossy verb tells you what to do."
                  - "Look at the first word of each step."
                  - "Fold, Cut and Stick."
              - id: l2-f2
                type: multiple_choice
                text: "Which sentence follows the model recount's grammar?"
                options: ["We visited the castle and climbed the tower.", "Visit the castle and climb the tower.", "We will visit the castle tomorrow."]
                answer: "We visited the castle and climbed the tower."
                option_audio: false
                feedback:
                  "Visit the castle and climb the tower.": "That uses bossy verbs, like instructions. The model recount is in the past tense with we: we visited."
                hints:
                  - "A recount tells what already happened."
                  - "Look for past tense verbs and we."
                  - "We visited the castle and climbed the tower."
              - id: l2-f3
                type: multiple_choice
                text: "The model story uses \"scurried\" instead of \"ran\". Which word could replace \"walked\" in the same way?"
                say: "The model uses precise verbs. Which word could replace walked in the same way?"
                options: ["tiptoed", "went", "moved"]
                answer: "tiptoed"
                hints:
                  - "A precise verb shows how something is done."
                  - "Went and moved are as plain as walked."
                  - "Tiptoed."
              - id: l2-f4
                type: multiple_choice
                text: "Which noun phrase is built like \"a tiny grey mouse\"?"
                options: ["a huge golden lion", "a lion", "the lion roared"]
                answer: "a huge golden lion"
                hints:
                  - "The model has two describing words before the noun."
                  - "Tiny and grey describe the mouse."
                  - "A huge golden lion."
              - id: l2-f5
                type: multiple_choice
                text: "Model: \"The ancient oak creaked in the wind.\"\nWhich new sentence borrows the pattern without copying it?"
                say: "Read the model sentence. Which new sentence borrows the pattern without copying it?"
                options: ["The rusty gate groaned in the storm.", "The ancient oak creaked in the wind.", "There was a tree."]
                answer: "The rusty gate groaned in the storm."
                option_audio: false
                hints:
                  - "Same pattern: describing word, noun, precise verb, where."
                  - "One option is the model itself."
                  - "The rusty gate groaned in the storm."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Why does the model recount use the past tense?"
                options: ["The events have already happened.", "It is telling you what to do.", "It is about the future."]
                answer: "The events have already happened."
                hints: ["When did the seaside trip take place?"]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap the time words."
                say: "These steps follow the model. Tap the time words."
                show: { drawn: letter-card, text: "First, wash your hands. Next, crack the egg. Finally, stir it well." }
                spans: ["First", "Next", "Finally"]
                hints: ["Time words tell you the order."]
              - id: l2-s3
                type: sorting
                text: "Which feature belongs to which model?"
                say: "Read each feature. Does it belong to the instructions model or the recount model?"
                option_audio: false
                bins:
                  - { id: instructions, show: { text: "instructions" }, say: "Instructions." }
                  - { id: recount, show: { text: "recount" }, say: "Recount." }
                options:
                  - { text: "bossy verbs (draw, put)", bin: instructions }
                  - { text: "past tense (went, explored)", bin: recount }
                  - { text: "we and our", bin: recount }
                  - { text: "numbered steps", bin: instructions }
                hints: ["Instructions tell you what to do; a recount tells what happened."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence would fit in a set of instructions like the model?"
                options: ["Pour the water into the jug.", "I poured the water into the jug.", "The water was poured yesterday."]
                answer: "Pour the water into the jug."
                option_audio: false
                hints: ["Start with a bossy verb."]
              - id: l2-s5
                type: multiple_choice
                text: "Model: \"A tiny grey mouse scurried under its roots.\"\nWhich new sentence borrows the pattern without copying it?"
                say: "Read the model sentence. Which new sentence borrows the pattern without copying it?"
                options: ["A sleek black cat crept along the wall.", "A tiny grey mouse scurried under its roots.", "A cat."]
                answer: "A sleek black cat crept along the wall."
                option_audio: false
                hints: ["Same pattern, your own words."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ali's recount says: \"We go to the park and we play football.\" What should he change to match the model?"
                options: ["Put the verbs in the past tense: went, played.", "Add numbered steps.", "Start with You will need."]
                answer: "Put the verbs in the past tense: went, played."
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the precise verbs."
                say: "This story opening follows the model. Tap the two precise verbs."
                show: { drawn: letter-card, text: "The wind howled and the old door rattled" }
                spans: ["howled", "rattled"]
              - id: l2-n3
                type: multiple_choice
                text: "Which word is a bossy verb?"
                options: ["mix", "mixed", "mixing"]
                answer: "mix"
              - id: l2-n4
                type: multiple_choice
                text: "Which is an expanded noun phrase like the model's?"
                options: ["a bright silver star", "a star", "stars shine"]
                answer: "a bright silver star"
              - id: l2-n5
                type: true_false
                text: "Learning from a model means copying its sentences word for word."
                say: "Read it. Is it true?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Mo will write a recount of his birthday. Which structure should he borrow?"
            options: ["who, where and when; events in time order; an ending", "title; what you need; numbered steps", "five lines that rhyme"]
            answer: "who, where and when; events in time order; an ending"
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence is written like the model instructions?"
            options: ["Spread the butter on the bread.", "I spread butter on my bread.", "The bread was buttered."]
            answer: "Spread the butter on the bread."
            option_audio: false
          - id: l2-c3
            type: ordering
            text: "Put the parts of the instructions in order."
            say: "Put the lines in order to make instructions like the model."
            options: ["You will need: a jam jar, water, a paintbrush.", "1. Fill the jar with water.", "How to Clean a Paintbrush"]
            slot_count: 3
            answer: ["How to Clean a Paintbrush", "You will need: a jam jar, water, a paintbrush.", "1. Fill the jar with water."]
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which verb is the most precise way to say \"said loudly\"?"
            options: ["shouted", "said", "talked"]
            answer: "shouted"
          - id: l2-c5
            type: multiple_choice
            text: "Model: \"The old bridge swayed in the wind.\"\nWhich new sentence borrows the pattern without copying it?"
            say: "Read the model sentence. Which new sentence borrows the pattern without copying it?"
            options: ["The tall ship rocked on the waves.", "The old bridge swayed in the wind.", "Ship."]
            answer: "The tall ship rocked on the waves."
            option_audio: false
