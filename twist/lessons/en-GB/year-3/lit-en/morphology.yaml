# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.morphology
skill: lit-en.word-reading.morphology
curriculum: en-GB
language: en
title:
  de: Vorsilben, Nachsilben und Wortstämme
  en: Prefixes, suffixes and root words
summary: >
  Long new words can be read and understood in parts: a prefix at the
  front (un-, dis-, mis-, re-, pre-), the root word, and suffixes at the
  end. Lesson 1 takes prefixes and what they do to a root word; lesson 2
  takes words with a prefix and a suffix (unhappiness, misbehaving) and
  ends with the skill check.
metadata:
  year: year-3
  topic: { de: Wörter lesen, en: Reading words }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-en.word-reading.suffixes-y2]
  also_practises: []
  vocabulary: { en: [prefix, suffix, root word, un-, dis-, mis-, re-, pre-] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: prefix-meaning, what: { de: "was die Vorsilben un-, dis-, mis-, re- und pre- bedeuten", en: "what the prefixes un-, dis-, mis-, re- and pre- mean" } }
    - { id: real-prefix, what: { de: "eine echte Vorsilbe von Buchstaben unterscheiden, die nur so aussehen", en: telling a real prefix from letters that only look like one } }
    - { id: split-words, what: { de: "lange Wörter in Vorsilbe, Wortstamm und Nachsilbe zerlegen", en: "splitting a long word into prefix, root word and suffix" } }
    - { id: word-meaning, what: { de: die Bedeutung eines langen Worts aus seinen Teilen erschließen, en: working out what a long word means from its parts } }
  misconceptions:
    - id: un-means-not-always
      what: Thinks every un or re at the start of a word is a prefix (uncle, read)
      addressed: lesson 1 asks whether the rest is a real word; uncle without un is not
    - id: meaning-from-guess
      what: Guesses a long word's meaning from its look instead of its parts
      addressed: Learn splits each word and builds the meaning part by part
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Vorsilben, en: Prefixes }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What does careless mean?"
            options: ["without care", "full of care", "care again"]
            answer: "without care"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tap the root word."
            say: "Tap the root word in the long word."
            show: { drawn: letter-card, text: "kind ness" }
            spans: ["kind"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "un + happy = unhappy"
            say: "A prefix goes at the front of a root word and changes its meaning. Un- means not: unhappy means not happy."
          - text: "dis-   mis-   re-   pre-"
            say: "Dis- also means not or the opposite: disagree. Mis- means wrongly: misspell. Re- means again: rewrite. Pre- means before: preview."
          - text: "uncle"
            say: "Careful: not every word that starts with un has a prefix. Take un off uncle and you get cle, which is not a word. So uncle has no prefix."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What does unkind mean?"
                options: ["not kind", "kind again", "very kind"]
                answer: "not kind"
                option_audio: false
                hints:
                  - "Find the prefix: un-."
                  - "Un- means not."
                  - "Unkind means not kind."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Add the prefix to make a word that means to build again."
                say: "Which word means to build again? Add the prefix."
                frame: "_build"
                options: ["re", "un", "mis"]
                answer: ["re"]
                hints:
                  - "Again is the meaning we need."
                  - "Re- means again."
                  - "Rebuild."
              - id: l1-f3
                type: matching
                text: "Match each prefix to its meaning."
                say: "Match each prefix to what it means. Read them yourself."
                option_audio: false
                pairs:
                  - { left: { text: "re-" }, right: { text: "again" } }
                  - { left: { text: "mis-" }, right: { text: "wrongly" } }
                  - { left: { text: "pre-" }, right: { text: "before" } }
                  - { left: { text: "dis-" }, right: { text: "not, the opposite" } }
                hints:
                  - "Think of a word: rewrite, misspell, preview, disagree."
                  - "Rewrite is to write again."
                  - "re- again, mis- wrongly, pre- before, dis- the opposite."
              - id: l1-f4
                type: true_false
                text: "Is it true? Uncle has the prefix un-."
                answer: false
                feedback:
                  "true": "Take un off uncle and you get cle, which is not a word. So un is not a prefix here."
                hints:
                  - "Take un off. Is the rest a word?"
                  - "Cle is not a word."
                  - "No, uncle has no prefix."
              - id: l1-f5
                type: multiple_choice
                text: "Which word means to spell wrongly?"
                options: ["misspell", "respell", "unspell"]
                answer: "misspell"
                option_audio: false
                hints:
                  - "Which prefix means wrongly?"
                  - "Mis-."
                  - "Misspell."
              - id: l1-f6
                type: fill_in_blank
                text: "Add the prefix to make a word that means not to like."
                say: "Which word means not to like? Add the prefix."
                frame: "_like"
                options: ["dis", "re", "pre"]
                answer: ["dis"]
                hints:
                  - "The opposite of like."
                  - "Dis- means the opposite."
                  - "Dislike."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What does reread mean?"
                options: ["read again", "not read", "read wrongly"]
                answer: "read again"
                option_audio: false
                hints: ["Re- means again."]
              - id: l1-s2
                type: fill_in_blank
                text: "Add the prefix to make a word that means to heat before."
                say: "Which word means to heat before? Add the prefix."
                frame: "_heat"
                options: ["pre", "dis", "un"]
                answer: ["pre"]
                hints: ["Pre- means before."]
              - id: l1-s3
                type: true_false
                text: "Is it true? Unlock means to lock again."
                answer: false
                hints: ["Un- means not, or the opposite."]
              - id: l1-s4
                type: multiple_choice
                text: "Which word has a prefix?"
                options: ["unfair", "under", "uncle"]
                answer: "unfair"
                option_audio: false
                hints: ["Take un off. Which leaves a real word?"]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the prefix."
                say: "The word is split into parts. Tap the prefix."
                show: { drawn: letter-card, text: "dis appear" }
                spans: ["dis"]
                hints: ["The prefix is at the front."]
              - id: l1-s6
                type: multiple_choice
                text: "What does misbehave mean?"
                options: ["behave badly", "behave again", "behave well"]
                answer: "behave badly"
                option_audio: false
                hints: ["Mis- means wrongly."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What does untidy mean?"
                options: ["not tidy", "tidy again", "very tidy"]
                answer: "not tidy"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Add the prefix to make a word that means to fill again."
                say: "Which word means to fill again? Add the prefix."
                frame: "_fill"
                options: ["re", "dis", "pre"]
                answer: ["re"]
              - id: l1-n3
                type: true_false
                text: "Is it true? Disobey means not to obey."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Which word has a prefix?"
                options: ["return", "read", "real"]
                answer: "return"
                option_audio: false
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the prefix."
                say: "The word is split into parts. Tap the prefix."
                show: { drawn: letter-card, text: "pre view" }
                spans: ["pre"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What does unwell mean?"
            options: ["not well", "well again", "very well"]
            answer: "not well"
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Add the prefix to make a word that means to write again."
            say: "Which word means to write again? Add the prefix."
            frame: "_write"
            options: ["re", "un", "mis"]
            answer: ["re"]
          - id: l1-c3
            type: true_false
            text: "Is it true? Under has the prefix un-."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "What does reheat mean?"
            options: ["heat again", "not heat", "heat wrongly"]
            answer: "heat again"
            option_audio: false
          - id: l1-c5
            type: fill_in_blank
            text: "Add the prefix to make a word that means not lucky."
            say: "Which word means not lucky? Add the prefix."
            frame: "_lucky"
            options: ["un", "re", "pre"]
            answer: ["un"]
          - id: l1-c6
            type: true_false
            text: "Is it true? Prepay means to pay before."
            answer: true

  - n: 2
    title: { de: Lange Wörter zerlegen, en: Splitting long words }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What does unkind mean?"
            options: ["not kind", "kind again", "very kind"]
            answer: "not kind"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Add the prefix to make a word that means to read again."
            say: "Which word means to read again? Add the prefix."
            frame: "_read"
            options: ["re", "dis", "pre"]
            answer: ["re"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "un + happy + ness"
            say: "Unhappiness looks long. Split it: the prefix un-, the root word happy, and the suffix -ness. The y in happy changes to i before -ness."
            show: { drawn: letter-card, text: "un happi ness" }
          - text: "unhappiness = the feeling of not being happy"
            say: "Now build the meaning: happy, not happy, then -ness turns it into a noun. Unhappiness is the feeling of not being happy."
          - text: "mis + behave + ing"
            say: "Misbehaving: mis- wrongly, behave, then -ing, which shows the action is going on. Misbehaving means behaving badly."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the root word."
                say: "The word is split into parts. Tap the root word."
                show: { drawn: letter-card, text: "un kind ness" }
                spans: ["kind"]
                hints:
                  - "Take off the prefix and the suffix."
                  - "Un- at the front, -ness at the end."
                  - "Kind is the root word."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What does unhelpful mean?"
                options: ["not full of help", "full of help again", "without being helped"]
                answer: "not full of help"
                option_audio: false
                hints:
                  - "Split it: un + help + ful."
                  - "Helpful is full of help. Un- means not."
                  - "Not full of help: unhelpful."
              - id: l2-f3
                type: fill_in_blank
                text: "Split the word."
                option_audio: false
                say: "Split the word disagreement into its three parts."
                frame: "disagreement = _ + _ + _"
                options: ["dis", "agree", "ment", "agreem"]
                answer: ["dis", "agree", "ment"]
                hints:
                  - "Find the prefix at the front."
                  - "Then the root word, then the suffix."
                  - "dis + agree + ment."
              - id: l2-f4
                type: true_false
                text: "Is it true? Rebuilding means building again."
                answer: true
                hints:
                  - "Re- means again."
                  - "Re + build + ing."
                  - "Yes."
              - id: l2-f5
                type: multiple_choice
                text: "Which word fits? \"The class was noisy and _ .\""
                say: "Which word finishes the sentence? Read them yourself."
                options: ["misbehaving", "rebehaving", "prebehaving"]
                answer: "misbehaving"
                option_audio: false
                hints:
                  - "A noisy class is behaving badly."
                  - "Mis- means wrongly."
                  - "Misbehaving."
              - id: l2-f6
                type: highlight_in_text
                text: "Tap the prefix and the suffix."
                say: "The word is split into parts. Tap the prefix and the suffix."
                show: { drawn: letter-card, text: "un fair ly" }
                spans: ["un", "ly"]
                hints:
                  - "The prefix is at the front, the suffix at the end."
                  - "The root word is fair."
                  - "un and ly."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap the root word."
                say: "The word is split into parts. Tap the root word."
                show: { drawn: letter-card, text: "re play ing" }
                spans: ["play"]
                hints: ["Take off re- and -ing."]
              - id: l2-s2
                type: multiple_choice
                text: "What does disappointment mean?"
                options: ["the feeling when something is not as good as you hoped", "making an appointment again", "a happy surprise"]
                answer: "the feeling when something is not as good as you hoped"
                option_audio: false
                hints: ["Dis + appoint + ment is a noun for a feeling."]
              - id: l2-s3
                type: fill_in_blank
                text: "Split the word."
                option_audio: false
                say: "Split the word unhelpful into its three parts."
                frame: "unhelpful = _ + _ + _"
                options: ["un", "help", "ful", "helpf"]
                answer: ["un", "help", "ful"]
                hints: ["Prefix, root, suffix."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Preheating means heating afterwards."
                answer: false
                hints: ["Pre- means before."]
              - id: l2-s5
                type: multiple_choice
                text: "Which word fits? \"He was sorry for his _ .\""
                say: "Which word finishes the sentence? Read them yourself."
                options: ["unkindness", "unkindly", "rekind"]
                answer: "unkindness"
                option_audio: false
                hints: ["After his we need a noun."]
              - id: l2-s6
                type: highlight_in_text
                text: "Tap the prefix and the suffix."
                say: "The word is split into parts. Tap the prefix and the suffix."
                show: { drawn: letter-card, text: "dis agree ing" }
                spans: ["dis", "ing"]
                hints: ["The root word is agree."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tap the root word."
                say: "The word is split into parts. Tap the root word."
                show: { drawn: letter-card, text: "mis spell ing" }
                spans: ["spell"]
              - id: l2-n2
                type: multiple_choice
                text: "What does carelessness mean?"
                options: ["being without care", "being full of care", "caring again"]
                answer: "being without care"
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Split the word."
                option_audio: false
                say: "Split the word replayed into its three parts."
                frame: "replayed = _ + _ + _"
                options: ["re", "play", "ed", "rep"]
                answer: ["re", "play", "ed"]
              - id: l2-n4
                type: true_false
                text: "Is it true? Unhappily means in a way that is not happy."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Which word fits? \"Please _ the oven before you bake.\""
                say: "Which word finishes the sentence? Read them yourself."
                options: ["preheat", "misheat", "unheat"]
                answer: "preheat"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: prefix-meaning
            type: multiple_choice
            text: "What does dishonest mean?"
            options: ["not honest", "honest again", "very honest"]
            answer: "not honest"
            option_audio: false
          - id: l2-c2
            part: prefix-meaning
            type: fill_in_blank
            text: "Add the prefix to make a word that means to understand wrongly."
            say: "Which word means to understand wrongly? Add the prefix."
            frame: "_understand"
            options: ["mis", "re", "pre"]
            answer: ["mis"]
          - id: l2-c3
            part: split-words
            type: highlight_in_text
            text: "Tap the root word."
            say: "The word is split into parts. Tap the root word."
            show: { drawn: letter-card, text: "un friend ly" }
            spans: ["friend"]
          - id: l2-c4
            part: real-prefix
            type: true_false
            text: "Is it true? Unpack has the prefix un-."
            answer: true
          - id: l2-c5
            part: word-meaning
            type: multiple_choice
            text: "What does unhappiness mean?"
            options: ["the feeling of not being happy", "being happy again", "a happy person"]
            answer: "the feeling of not being happy"
            option_audio: false
          - id: l2-c6
            part: prefix-meaning
            type: matching
            text: "Match each word to its meaning."
            say: "Match each word to what it means. Read them yourself."
            option_audio: false
            pairs:
              - { left: { text: "mishear" }, right: { text: "hear wrongly" } }
              - { left: { text: "retell" }, right: { text: "tell again" } }
              - { left: { text: "unsafe" }, right: { text: "not safe" } }
              - { left: { text: "preschool" }, right: { text: "before school" } }
          - id: l2-c7
            part: prefix-meaning
            type: fill_in_blank
            text: "Add the prefix to make a word that means the opposite of connect."
            say: "Which word means the opposite of connect? Add the prefix."
            frame: "_connect"
            options: ["dis", "pre", "re"]
            answer: ["dis"]
          - id: l2-c8
            part: prefix-meaning
            type: true_false
            text: "Is it true? Unzip means to zip again."
            answer: false
          - id: l2-c9
            part: real-prefix
            type: multiple_choice
            text: "Only one of these words begins with the prefix re-. Which one?"
            options: ["reopen", "ready", "red"]
            answer: "reopen"
            option_audio: false
          - id: l2-c10
            part: real-prefix
            type: true_false
            text: "Is it true? Dish has the prefix dis-."
            answer: false
          - id: l2-c11
            part: real-prefix
            type: true_false
            text: "Is it true? Misplace has the prefix mis-."
            answer: true
          - id: l2-c12
            part: real-prefix
            type: sorting
            text: "Prefix or no prefix?"
            say: "Sort the words. Does the word have a prefix, or not? Read them yourself."
            option_audio: false
            bins:
              - { id: prefix, show: { text: "has a prefix" }, say: "Has a prefix." }
              - { id: none, show: { text: "no prefix" }, say: "No prefix." }
            options:
              - { text: "untie", bin: prefix }
              - { text: "repay", bin: prefix }
              - { text: "reach", bin: none }
              - { text: "mist", bin: none }
          - id: l2-c13
            part: split-words
            type: fill_in_blank
            text: "Split the word replacement into its three parts."
            option_audio: false
            say: "Split the word replacement into its three parts."
            frame: "replacement = _ + _ + _"
            options: ["re", "place", "ment", "repl"]
            answer: ["re", "place", "ment"]
          - id: l2-c14
            part: split-words
            type: highlight_in_text
            text: "Tap the root word."
            say: "The word is split into parts. Tap the root word."
            show: { drawn: letter-card, text: "un comfort able" }
            spans: ["comfort"]
          - id: l2-c15
            part: split-words
            type: multiple_choice
            text: "Which shows how to split misleading?"
            options: ["mis + lead + ing", "mi + slead + ing", "misle + ad + ing"]
            answer: "mis + lead + ing"
            option_audio: false
          - id: l2-c16
            part: split-words
            type: true_false
            text: "Is it true? Disappearing splits into dis + appear + ing."
            answer: true
          - id: l2-c17
            part: word-meaning
            type: multiple_choice
            text: "What does rewritten mean?"
            options: ["written again", "written wrongly", "not written"]
            answer: "written again"
            option_audio: false
          - id: l2-c18
            part: word-meaning
            type: multiple_choice
            text: "Which word fits? \"I _ the instructions, so my model fell apart.\""
            say: "Which word finishes the sentence? Read them yourself."
            options: ["misread", "reread", "preread"]
            answer: "misread"
            option_audio: false
          - id: l2-c19
            part: word-meaning
            type: true_false
            text: "Is it true? Unwrapping a present means wrapping it up again."
            answer: false
          - id: l2-c20
            part: word-meaning
            type: multiple_choice
            text: "Which word fits? \"Please _ your plastic bottles so they can be used again.\""
            say: "Which word finishes the sentence? Read them yourself."
            options: ["reuse", "misuse", "preuse"]
            answer: "reuse"
            option_audio: false
