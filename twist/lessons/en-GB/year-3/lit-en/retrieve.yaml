# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.retrieve
skill: lit-en.comprehension.retrieve
curriculum: en-GB
language: en
title:
  de: Informationen in Sachtexten finden und notieren
  en: Finding and noting information
summary: >
  Children find information in non-fiction texts and note it down.
  Lesson 1 finds facts quickly: using headings to choose the right
  section, scanning for a key word, and answering with the exact detail
  from a short text about the Romans in Britain. Lesson 2 notes
  information: picking the key words to write down, filling in a notes
  frame and a table from a text about the water cycle and one about
  sharks, and using an index; it ends with the skill check.
metadata:
  year: year-3
  topic: { de: Sachtexte, en: Information texts }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.texts.non-fiction-structures]
  also_practises: [lit-en.texts.non-fiction-structures]
  vocabulary: { en: [non-fiction, heading, sub-heading, key word, scan, skim, notes, index, table, fact] }
  forms: [text, audio, drawn]
  drawn: [table, letter-card]
  facets: []
  misconceptions:
    - id: read-every-word
      what: Reads the whole text from the start for every question instead of using headings and key words
      addressed: Learn screens 2 and 3 of lesson 1; l1-f1, l1-f2, l1-s1, l1-n1 and l2-c1, with feedback in l1-f2
    - id: notes-whole-sentences
      what: Copies whole sentences as notes instead of the key words
      addressed: Learn screen 2 of lesson 2; l2-f1, l2-s1, l2-n1 and l2-c3, with feedback in l2-f1
    - id: nearby-wrong-detail
      what: Answers with a detail that sits near the key word but answers a different question
      addressed: l1-f3, l1-s3, l1-n3 and l2-c2 offer a nearby detail as a distractor, with feedback in l1-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Schnell finden, en: Finding it fast }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which part of an information book lists the chapters at the front?"
            options: ["the contents page", "the glossary", "the cover"]
            answer: "the contents page"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "A glossary is ..."
            options: ["a list of hard words and what they mean", "a list of chapters", "a picture with labels"]
            answer: "a list of hard words and what they mean"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The Romans in Britain\n\nArriving: The Romans invaded Britain in AD 43.\nRoads: They built long, straight roads between their towns.\nBaths: Rich Romans went to public baths to wash and meet friends."
            say: "Read this short information text. It has a main heading and a heading for each part."
          - text: "Question: What did the Romans build between towns?\nHeading to look under: Roads"
            say: "To find information fast, read the question, pick its key word, then use the headings to choose the right part. Towns and build point to roads."
          - text: "Scan: run your eyes down the text looking for one word."
            say: "Then scan: run your eyes down the text, looking only for the key word. When you find it, read the sentence carefully."
          - text: "Answer: long, straight roads"
            say: "Give the exact detail the question asks for. Not the whole text, and not a nearby fact."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The Romans in Britain\n\nArriving: The Romans invaded Britain in AD 43.\nRoads: They built long, straight roads between their towns.\nBaths: Rich Romans went to public baths to wash and meet friends.\n\nWhen did the Romans invade Britain?"
                say: "Read the text. When did the Romans invade Britain?"
                options: ["AD 43", "AD 34", "they did not invade"]
                answer: "AD 43"
                hints:
                  - "Which heading is about the Romans coming to Britain?"
                  - "Look under Arriving."
                  - "AD 43."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "The Romans in Britain\n\nArriving: The Romans invaded Britain in AD 43.\nRoads: They built long, straight roads between their towns.\nBaths: Rich Romans went to public baths to wash and meet friends.\n\nWhich heading would you look under to find out where Romans washed?"
                say: "Read the text. Which heading would you look under to find out where Romans washed?"
                options: ["Baths", "Roads", "Arriving"]
                answer: "Baths"
                feedback:
                  "Arriving": "You could read from the start, but the headings save time. Which heading is about washing?"
                hints:
                  - "What is the key word in the question?"
                  - "Washing happens in a bath."
                  - "Baths."
              - id: l1-f3
                type: multiple_choice
                text: "The Romans in Britain\n\nArriving: The Romans invaded Britain in AD 43.\nRoads: They built long, straight roads between their towns.\nBaths: Rich Romans went to public baths to wash and meet friends.\n\nWhat shape were Roman roads?"
                say: "Read the text. What shape were Roman roads?"
                options: ["long and straight", "between their towns", "bendy and narrow"]
                answer: "long and straight"
                feedback:
                  "between their towns": "That is in the same sentence, but it tells you where the roads went, not their shape."
                hints:
                  - "Look under Roads."
                  - "Which words describe the shape?"
                  - "Long and straight."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the key word in the question."
                say: "To answer this question, which word would you scan for? Tap it."
                show: { drawn: letter-card, text: "Why did Romans visit the baths?" }
                spans: ["baths"]
                hints:
                  - "Which word names the thing the question is about?"
                  - "It is a noun near the end."
                  - "baths."
              - id: l1-f5
                type: true_false
                text: "The Romans in Britain\n\nBaths: Rich Romans went to public baths to wash and meet friends.\n\nThe text says Romans went to the baths to meet friends."
                say: "Read the text and the sentence under it. Is it true?"
                answer: true
                hints:
                  - "Read the Baths part again."
                  - "To wash and meet friends."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Hedgehogs\n\nFood: Hedgehogs eat beetles, worms and slugs.\nHomes: In the day they sleep in nests of leaves.\nWinter: From November to March they hibernate.\n\nWhich heading tells you when hedgehogs hibernate?"
                say: "Read the text. Which heading tells you when hedgehogs hibernate?"
                options: ["Winter", "Food", "Homes"]
                answer: "Winter"
                hints: ["Hibernating is a long winter sleep."]
              - id: l1-s2
                type: multiple_choice
                text: "Hedgehogs\n\nFood: Hedgehogs eat beetles, worms and slugs.\nHomes: In the day they sleep in nests of leaves.\nWinter: From November to March they hibernate.\n\nWhat are hedgehog nests made of?"
                say: "Read the text. What are hedgehog nests made of?"
                options: ["leaves", "beetles", "snow"]
                answer: "leaves"
                hints: ["Look under Homes."]
              - id: l1-s3
                type: multiple_choice
                text: "Hedgehogs\n\nFood: Hedgehogs eat beetles, worms and slugs.\nHomes: In the day they sleep in nests of leaves.\nWinter: From November to March they hibernate.\n\nIn which month do hedgehogs start to hibernate?"
                say: "Read the text. In which month do hedgehogs start to hibernate?"
                options: ["November", "March", "the day"]
                answer: "November"
                hints: ["From November to March: which month comes first?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the key word in the question."
                say: "To answer this question, which word would you scan for? Tap it."
                show: { drawn: letter-card, text: "What do hedgehogs eat?" }
                spans: ["eat"]
                hints: ["Every part is about hedgehogs. Which word tells you what to look for?"]
              - id: l1-s5
                type: true_false
                text: "To find one fact quickly, you must read every word from the start."
                say: "Read it. Is it true?"
                answer: false
                hints: ["What do headings and scanning help you do?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Castles\n\nWalls: Castle walls could be three metres thick.\nMoats: A moat was a ditch full of water around the castle.\nFood: Cooks made bread and stews in a huge kitchen.\n\nWhich heading tells you what was around a castle?"
                say: "Read the text. Which heading tells you what was around a castle?"
                options: ["Moats", "Walls", "Food"]
                answer: "Moats"
              - id: l1-n2
                type: multiple_choice
                text: "Castles\n\nWalls: Castle walls could be three metres thick.\nMoats: A moat was a ditch full of water around the castle.\nFood: Cooks made bread and stews in a huge kitchen.\n\nHow thick could castle walls be?"
                say: "Read the text. How thick could castle walls be?"
                options: ["three metres", "a ditch", "huge"]
                answer: "three metres"
              - id: l1-n3
                type: multiple_choice
                text: "Castles\n\nWalls: Castle walls could be three metres thick.\nMoats: A moat was a ditch full of water around the castle.\nFood: Cooks made bread and stews in a huge kitchen.\n\nWhat was a moat full of?"
                say: "Read the text. What was a moat full of?"
                options: ["water", "a ditch", "stews"]
                answer: "water"
              - id: l1-n4
                type: highlight_in_text
                text: "Tap the key word in the question."
                say: "To answer this question, which word would you scan for? Tap it."
                show: { drawn: letter-card, text: "Who made the bread in a castle?" }
                spans: ["bread"]
              - id: l1-n5
                type: true_false
                text: "Castles\n\nFood: Cooks made bread and stews in a huge kitchen.\n\nThe text says the kitchen was tiny."
                say: "Read the text and the sentence under it. Is it true?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Volcanoes\n\nWhat it is: A volcano is an opening in the Earth's crust.\nLava: Hot melted rock that comes out is called lava.\n\nWhat is lava?"
            say: "Read the text. What is lava?"
            options: ["hot melted rock", "an opening in the crust", "a kind of mountain bird"]
            answer: "hot melted rock"
          - id: l1-c2
            type: multiple_choice
            text: "What does scan mean?"
            options: ["look quickly through a text for one word", "read every word slowly", "copy the text out"]
            answer: "look quickly through a text for one word"
          - id: l1-c3
            type: multiple_choice
            text: "Volcanoes\n\nWhat it is: A volcano is an opening in the Earth's crust.\nLava: Hot melted rock that comes out is called lava.\n\nWhich heading would tell you what a volcano is?"
            say: "Read the text. Which heading would tell you what a volcano is?"
            options: ["What it is", "Lava"]
            answer: "What it is"

  - n: 2
    title: { de: Notizen machen, en: Making notes }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "You want to find out what pandas eat. What do you look for first?"
            options: ["a heading about food", "the last page", "the biggest picture"]
            answer: "a heading about food"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Pandas\n\nFood: Pandas eat bamboo for up to 12 hours a day.\n\nWhat do pandas eat?"
            say: "Read the text. What do pandas eat?"
            options: ["bamboo", "12 hours", "fish"]
            answer: "bamboo"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The Water Cycle\nThe sun heats water in seas and rivers. The water turns into vapour and rises into the sky. High up, it cools and makes clouds. Then it falls back down as rain."
            say: "Read this text about the water cycle. Now we will make notes about it."
          - text: "Notes:\n- sun heats water\n- vapour rises\n- cools: clouds\n- falls as rain"
            say: "Notes are short. Write only the key words, not whole sentences. Use a dash or a bullet for each new point. Your notes help you remember and use the information later."
          - text: "Sharks"
            say: "You can also note facts in a table. Each column holds one kind of information. This makes facts easy to compare."
            show: { drawn: table, rows: [[Kind, Length, Food], [great white, 6 m, seals], [whale shark, 12 m, plankton]] }
          - text: "Index\nbaths ... 12\nroads ... 8\nsoldiers ... 4, 15"
            say: "An index at the back of a book lists topics in alphabetical order, with the pages where you can find them. Use it to jump straight to the right page."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"Owls hunt at night and can turn their heads a very long way round.\"\n\nWhich is the best note?"
                say: "Read the sentence. Which is the best note?"
                options: ["hunt at night; turn heads far", "Owls hunt at night and can turn their heads a very long way round.", "owls"]
                answer: "hunt at night; turn heads far"
                option_audio: false
                feedback:
                  "Owls hunt at night and can turn their heads a very long way round.": "That copies the whole sentence. Notes keep only the key words."
                hints:
                  - "Notes are short."
                  - "Keep the words that carry the facts."
                  - "hunt at night; turn heads far."
              - id: l2-f2
                type: fill_in_blank
                text: "The Water Cycle\nThe sun heats water in seas and rivers. The water turns into vapour and rises into the sky. High up, it cools and makes clouds. Then it falls back down as rain.\n\nComplete the notes."
                say: "Read the text. Complete the notes."
                frame: "The water rises as: _\nIt falls back as: _"
                options: ["vapour", "rain", "clouds", "seas"]
                answer: ["vapour", "rain"]
                hints:
                  - "Find rises and falls in the text."
                  - "What rises? What falls?"
                  - "vapour; rain."
              - id: l2-f3
                type: multiple_choice
                text: "Sharks\n\nHow long is a whale shark?"
                say: "Look at the table. How long is a whale shark?"
                show: { drawn: table, rows: [[Kind, Length, Food], [great white, 6 m, seals], [whale shark, 12 m, plankton]] }
                options: ["12 m", "6 m", "plankton"]
                answer: "12 m"
                hints:
                  - "Find the whale shark row."
                  - "Then go across to the Length column."
                  - "12 m."
              - id: l2-f4
                type: multiple_choice
                text: "Index\nbaths ... 12\nroads ... 8\nsoldiers ... 4, 15\n\nWhich page tells you about Roman roads?"
                say: "Read the index. Which page tells you about Roman roads?"
                options: ["8", "12", "4"]
                answer: "8"
                hints:
                  - "Find the word roads."
                  - "Read the number next to it."
                  - "Page 8."
              - id: l2-f5
                type: sorting
                text: "Frogs lay eggs in ponds, and the eggs hatch into tadpoles.\n\nKeep in notes or leave out?"
                say: "Read the sentence about frogs. Which words would you keep in your notes?"
                option_audio: false
                bins:
                  - { id: keep, show: { text: "keep in notes" }, say: "Keep in notes." }
                  - { id: leave, show: { text: "leave out" }, say: "Leave out." }
                options:
                  - { text: "lay eggs in ponds", bin: keep }
                  - { text: "tadpoles", bin: keep }
                  - { text: "the", bin: leave }
                  - { text: "and", bin: leave }
                hints:
                  - "Which words carry facts?"
                  - "Little joining words can go."
                  - "Keep lay eggs in ponds and tadpoles; leave out the little joining words."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"Camels can go for a week without drinking water, and they store fat in their humps.\"\n\nWhich is the best note?"
                say: "Read the sentence. Which is the best note?"
                options: ["a week without water; fat in humps", "Camels can go for a week without drinking water, and they store fat in their humps.", "camels are animals"]
                answer: "a week without water; fat in humps"
                option_audio: false
                hints: ["Keep only the key facts."]
              - id: l2-s2
                type: fill_in_blank
                text: "Bees\nHoney bees live in hives. One queen lays all the eggs. Worker bees collect nectar from flowers to make honey.\n\nComplete the notes."
                say: "Read the text. Complete the notes."
                frame: "Home: _\nWho lays eggs: _"
                options: ["hives", "the queen", "flowers", "worker bees"]
                answer: ["hives", "the queen"]
                hints: ["Find live and lays in the text."]
              - id: l2-s3
                type: multiple_choice
                text: "Sharks\n\nWhat does a great white eat?"
                say: "Look at the table. What does a great white eat?"
                show: { drawn: table, rows: [[Kind, Length, Food], [great white, 6 m, seals], [whale shark, 12 m, plankton]] }
                options: ["seals", "plankton", "6 m"]
                answer: "seals"
                hints: ["Find the great white row, then the Food column."]
              - id: l2-s4
                type: multiple_choice
                text: "Index\nbaths ... 12\nroads ... 8\nsoldiers ... 4, 15\n\nOn which two pages can you read about soldiers?"
                say: "Read the index. On which two pages can you read about soldiers?"
                options: ["4 and 15", "8 and 12", "12 and 15"]
                answer: "4 and 15"
                hints: ["Find soldiers in the list."]
              - id: l2-s5
                type: true_false
                text: "Good notes are written in whole, long sentences."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Notes keep only the key words."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"Penguins cannot fly, but they are excellent swimmers and can dive deep for fish.\"\n\nWhich is the best note?"
                say: "Read the sentence. Which is the best note?"
                options: ["cannot fly; swim well; dive for fish", "Penguins cannot fly, but they are excellent swimmers and can dive deep for fish.", "penguins, but, and"]
                answer: "cannot fly; swim well; dive for fish"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Planets\nMars is called the red planet because its soil has rust in it. It has two small moons.\n\nComplete the notes."
                say: "Read the text. Complete the notes."
                frame: "Nickname: _\nNumber of moons: _"
                options: ["the red planet", "two", "rust", "one"]
                answer: ["the red planet", "two"]
              - id: l2-n3
                type: multiple_choice
                text: "Pets in Class 3\n\nWhich pet do most children have?"
                say: "Look at the table. Which pet do most children have?"
                show: { drawn: table, rows: [[Pet, Children], [dog, 9], [cat, 7], [fish, 4]] }
                options: ["dog", "cat", "fish"]
                answer: "dog"
              - id: l2-n4
                type: multiple_choice
                text: "Index\nbirds ... 3\nfish ... 10\ninsects ... 6, 14\n\nWhich page should you turn to for fish?"
                say: "Read the index. Which page should you turn to for fish?"
                options: ["10", "3", "6"]
                answer: "10"
              - id: l2-n5
                type: true_false
                text: "An index is in alphabetical order."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Trees\n\nLeaves: Oak trees lose their leaves in autumn.\nFruit: Oak trees grow acorns.\nAge: Some oaks live for 1000 years.\n\nWhich heading would tell you what grows on an oak?"
            say: "Read the text. Which heading would tell you what grows on an oak?"
            options: ["Fruit", "Leaves", "Age"]
            answer: "Fruit"
          - id: l2-c2
            type: multiple_choice
            text: "Trees\n\nLeaves: Oak trees lose their leaves in autumn.\nFruit: Oak trees grow acorns.\nAge: Some oaks live for 1000 years.\n\nWhen do oak trees lose their leaves?"
            say: "Read the text. When do oak trees lose their leaves?"
            options: ["in autumn", "for 1000 years", "acorns"]
            answer: "in autumn"
          - id: l2-c3
            type: multiple_choice
            text: "\"Snails have one large foot and leave a slimy trail as they move.\"\n\nWhich is the best note?"
            say: "Read the sentence. Which is the best note?"
            options: ["one foot; slimy trail", "Snails have one large foot and leave a slimy trail as they move.", "snails, as, they"]
            answer: "one foot; slimy trail"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Rivers of the UK\n\nWhich river is the longest?"
            say: "Look at the table. Which river is the longest?"
            show: { drawn: table, rows: [[River, Length], [Severn, 354 km], [Thames, 346 km], [Trent, 297 km]] }
            options: ["Severn", "Thames", "Trent"]
            answer: "Severn"
          - id: l2-c5
            type: multiple_choice
            text: "Index\nclouds ... 5\nrain ... 9, 11\nsnow ... 13\n\nWhich page tells you about snow?"
            say: "Read the index. Which page tells you about snow?"
            options: ["13", "9", "5"]
            answer: "13"
