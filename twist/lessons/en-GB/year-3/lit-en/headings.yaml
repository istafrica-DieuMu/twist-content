# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.headings
skill: lit-en.composition.headings
curriculum: en-GB
language: en
title:
  de: Überschriften und Zwischenüberschriften
  en: Headings and sub-headings
summary: >
  Headings and sub-headings organise non-fiction writing so a reader can
  find things. Lesson 1 tells a main heading (what the whole text is
  about) from a sub-heading (what one section is about), and chooses a
  short, clear sub-heading for a paragraph. Lesson 2 organises facts
  under sub-headings, puts the sections of a report in a sensible order,
  and uses question sub-headings (What do they eat?); it ends with the
  skill check. Laying out the child's own text waits for a free-writing
  task; the lessons practise choosing and sorting.
metadata:
  year: year-3
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.composition.purposes]
  also_practises: [lit-en.comprehension.retrieve, lit-en.composition.paragraphs]
  vocabulary: { en: [heading, main heading, sub-heading, section, title, non-fiction, report, organise, question heading] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: heading-too-vague
      what: Chooses a sub-heading that fits any section (Facts, Information, Part 2)
      addressed: Learn screen 3 of lesson 1; l1-f3, l1-s3, l1-n3 and l2-c2, with feedback in l1-f3
    - id: heading-is-a-sentence
      what: Writes a whole sentence of content as a sub-heading
      addressed: Learn screen 3 of lesson 1; l1-f4, l1-s4 and l1-n4, with feedback in l1-f4
    - id: facts-under-wrong-heading
      what: Puts a fact under a sub-heading it does not belong to
      addressed: Learn screen 1 of lesson 2; l2-f1, l2-s1, l2-n1 and l2-c3, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Haupt- und Zwischenüberschrift, en: Main headings and sub-headings }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which kind of writing uses numbered steps?"
            options: ["instructions", "a letter", "a list of names"]
            answer: "instructions"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is a label for?"
            options: ["to name part of a picture", "to tell a long story", "to say thank you"]
            answer: "to name part of a picture"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Penguins\n\nWhere they live\nMost penguins live in the cold south of the world.\n\nWhat they eat\nPenguins eat fish, squid and tiny shrimp called krill."
            say: "Look at this report. Penguins, at the top, is the main heading: it tells you what the whole text is about. Where they live and What they eat are sub-headings: each tells you what one section is about."
          - text: "Main heading: the whole text\nSub-heading: one section"
            say: "Headings help a reader find information quickly, without reading every word. They also help a writer keep each section on one topic."
          - text: "Good sub-heading: What they eat\nNot so good: Facts\nNot a heading: Penguins eat fish, squid and tiny shrimp called krill."
            say: "A good sub-heading is short and says exactly what the section is about. Facts could go over any section, so it does not help. A whole sentence of information is not a heading either."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Penguins\n\nWhere they live\nMost penguins live in the cold south of the world.\n\nWhich line is the main heading?"
                say: "Read the report. Which line is the main heading?"
                options: ["Penguins", "Where they live", "Most penguins live in the cold south of the world."]
                answer: "Penguins"
                option_audio: false
                hints:
                  - "The main heading is about the whole text."
                  - "It is at the very top."
                  - "Penguins."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Penguins cannot fly. They use their wings like flippers to swim fast underwater.\n\nWhich sub-heading fits this section?"
                say: "Read the section. Which sub-heading fits it?"
                options: ["How they move", "What they eat", "Their chicks"]
                answer: "How they move"
                hints:
                  - "What is the section about?"
                  - "Flying, flippers, swimming."
                  - "How they move."
              - id: l1-f3
                type: multiple_choice
                text: "Which is the best sub-heading for a section about where foxes sleep?"
                options: ["Foxes' homes", "Facts", "Part 2"]
                answer: "Foxes' homes"
                option_audio: false
                feedback:
                  "Facts": "Facts could go over any section, so it does not help the reader. Say exactly what the section is about."
                hints:
                  - "Which one tells the reader exactly what is in the section?"
                  - "Facts and Part 2 could be anything."
                  - "Foxes' homes."
              - id: l1-f4
                type: multiple_choice
                text: "Which would work as a sub-heading?"
                options: ["Food", "Foxes eat mice, rabbits and berries from bushes.", "The end"]
                answer: "Food"
                option_audio: false
                feedback:
                  "Foxes eat mice, rabbits and berries from bushes.": "That is a sentence of information, which belongs in the section. A sub-heading is short: Food."
                hints:
                  - "A sub-heading is short."
                  - "One is a whole sentence of facts."
                  - "Food."
              - id: l1-f5
                type: true_false
                text: "Headings help a reader find information without reading every word."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "How did you find facts in the penguin report?"
                  - "You looked at the sub-headings."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A report has the headings: Our School, The Hall, The Library, The Playground.\n\nWhich one is the main heading?"
                say: "Read the headings. Which one is the main heading?"
                options: ["Our School", "The Library", "The Playground"]
                answer: "Our School"
                hints: ["Which one is about the whole text?"]
              - id: l1-s2
                type: multiple_choice
                text: "Baby owls are called owlets. They hatch from eggs and are covered in soft, fluffy down.\n\nWhich sub-heading fits this section?"
                say: "Read the section. Which sub-heading fits it?"
                options: ["Owl chicks", "Hunting at night", "Owl homes"]
                answer: "Owl chicks"
                hints: ["What is the section about?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which is the best sub-heading for a section about what rabbits eat?"
                options: ["Food", "Things", "More information"]
                answer: "Food"
                hints: ["Say exactly what is in the section."]
              - id: l1-s4
                type: multiple_choice
                text: "Which would work as a sub-heading?"
                options: ["Size", "Elephants are the largest land animals in the world.", "Wow!"]
                answer: "Size"
                option_audio: false
                hints: ["A sub-heading is short."]
              - id: l1-s5
                type: true_false
                text: "Every section of a report can have the same sub-heading."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Each sub-heading says what its own section is about."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "A report has the headings: Food, Volcanoes, Lava, Famous volcanoes.\n\nOne of them does not belong. Which?"
                say: "Read the headings. One of them does not belong in a report about volcanoes. Which?"
                options: ["Food", "Lava", "Famous volcanoes"]
                answer: "Food"
              - id: l1-n2
                type: multiple_choice
                text: "Sharks have rows of sharp teeth. When a tooth falls out, a new one grows in its place.\n\nWhich sub-heading fits this section?"
                say: "Read the section. Which sub-heading fits it?"
                options: ["Teeth", "Where sharks live", "Baby sharks"]
                answer: "Teeth"
              - id: l1-n3
                type: multiple_choice
                text: "Which is the best sub-heading for a section about how bees make honey?"
                options: ["Making honey", "Bees", "Section 3"]
                answer: "Making honey"
              - id: l1-n4
                type: multiple_choice
                text: "Which would work as a sub-heading?"
                options: ["Life cycle", "A frog starts life as an egg in a pond.", "Hello"]
                answer: "Life cycle"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "The main heading tells you what the whole text is about."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What does a sub-heading tell you?"
            options: ["what one section is about", "what the whole book is about", "who wrote the text"]
            answer: "what one section is about"
          - id: l1-c2
            type: multiple_choice
            text: "Spiders spin webs from silk. The sticky threads catch flies.\n\nWhich sub-heading fits this section?"
            say: "Read the section. Which sub-heading fits it?"
            options: ["Webs", "Legs", "Eggs"]
            answer: "Webs"
          - id: l1-c3
            type: multiple_choice
            text: "Which is the best sub-heading for a section about where badgers live?"
            options: ["Badger homes", "Information", "Other stuff"]
            answer: "Badger homes"

  - n: 2
    title: { de: Mit Überschriften ordnen, en: Organising with headings }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is the best sub-heading for a section about what cats eat?"
            options: ["Food", "Facts", "Part 1"]
            answer: "Food"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which line is a main heading?"
            options: ["All About Dinosaurs", "Dinosaurs laid eggs.", "Their size"]
            answer: "All About Dinosaurs"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Notes about hedgehogs:\neat slugs and beetles\nsleep in leaf nests\nhibernate in winter\neat worms\n\nFood\neat slugs and beetles\neat worms\n\nHomes and sleep\nsleep in leaf nests\nhibernate in winter"
            say: "Before writing a report, sort your facts under sub-headings. Here the food facts go together under Food, and the sleeping facts go under Homes and sleep."
          - text: "Hedgehogs\nWhat do they look like?\nWhere do they live?\nWhat do they eat?"
            say: "Sub-headings can be questions. Then each section answers its question. Readers often like this, because they can jump to the question they want answered."
          - text: "Order: introduction, looks, home, food, interesting facts"
            say: "Put the sections in a sensible order. Start with what the thing is and what it looks like, then where it lives and what it eats. Save surprising facts for near the end."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Sort the facts under the sub-headings."
                say: "Read each fact about squirrels. Put it under the right sub-heading."
                option_audio: false
                bins:
                  - { id: food, show: { text: "Food" }, say: "Food." }
                  - { id: home, show: { text: "Homes" }, say: "Homes." }
                options:
                  - { text: "They eat nuts and seeds.", bin: food }
                  - { text: "They bury acorns for winter.", bin: food }
                  - { text: "They build nests called dreys.", bin: home }
                  - { text: "Dreys are high up in trees.", bin: home }
                hints:
                  - "Is the fact about eating or about where they live?"
                  - "Burying acorns is about food for later."
                  - "Nuts and acorns: Food; dreys: Homes."
              - id: l2-f2
                type: multiple_choice
                text: "Under the sub-heading Food, which fact does NOT belong?"
                options: ["Squirrels have bushy tails.", "Squirrels eat berries.", "Squirrels eat seeds."]
                answer: "Squirrels have bushy tails."
                option_audio: false
                feedback:
                  "Squirrels eat berries.": "Berries are food, so this fact belongs. Which fact is about how squirrels look?"
                hints:
                  - "Which fact is not about eating?"
                  - "A tail is about how a squirrel looks."
                  - "Squirrels have bushy tails."
              - id: l2-f3
                type: multiple_choice
                text: "Which question sub-heading fits a section about how long tortoises live?"
                options: ["How long do they live?", "What do they eat?", "Where do they sleep?"]
                answer: "How long do they live?"
                hints:
                  - "The section answers the question."
                  - "It is about the length of a life."
                  - "How long do they live?"
              - id: l2-f4
                type: ordering
                text: "Put the sections of the report in order."
                say: "Put the sub-headings of a report about owls in a sensible order."
                options: ["What do they eat?", "What are owls?", "Amazing owl facts"]
                slot_count: 3
                answer: ["What are owls?", "What do they eat?", "Amazing owl facts"]
                hints:
                  - "Start by saying what the thing is."
                  - "Surprising facts come near the end."
                  - "What are owls?, What do they eat?, Amazing owl facts."
              - id: l2-f5
                type: true_false
                text: "A sub-heading can be a question that the section answers."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Think of Where do they live?"
                  - "The section underneath gives the answer."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Sort the facts under the sub-headings."
                say: "Read each fact about the Moon. Put it under the right sub-heading."
                option_audio: false
                bins:
                  - { id: surface, show: { text: "The surface" }, say: "The surface." }
                  - { id: visits, show: { text: "Visits to the Moon" }, say: "Visits to the Moon." }
                options:
                  - { text: "It is covered in craters.", bin: surface }
                  - { text: "The ground is grey dust.", bin: surface }
                  - { text: "Astronauts landed there in 1969.", bin: visits }
                  - { text: "Twelve people have walked on it.", bin: visits }
                hints: ["Is it about the Moon itself, or about people going there?"]
              - id: l2-s2
                type: multiple_choice
                text: "Which question sub-heading fits a section about where camels live?"
                options: ["Where do they live?", "Why do they have humps?", "What do they eat?"]
                answer: "Where do they live?"
                hints: ["The section is about place."]
              - id: l2-s3
                type: ordering
                text: "Put the sections of the report in order."
                say: "Put the sub-headings of a report about frogs in a sensible order."
                options: ["Where do frogs live?", "Fun frog facts", "What does a frog look like?"]
                slot_count: 3
                answer: ["What does a frog look like?", "Where do frogs live?", "Fun frog facts"]
                hints: ["Looks first, fun facts last."]
              - id: l2-s4
                type: multiple_choice
                text: "Why do writers sort their facts under sub-headings before they write?"
                options: ["so each section stays on one topic", "so the report is longer", "so the facts are hidden"]
                answer: "so each section stays on one topic"
                hints: ["Think about what each section is for."]
              - id: l2-s5
                type: true_false
                text: "\"Squirrels build dreys\" belongs under the sub-heading Food."
                say: "Read it. Is it true?"
                answer: false
                hints: ["A drey is a nest."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Sort the facts under the sub-headings."
                say: "Read each fact about dogs. Put it under the right sub-heading."
                option_audio: false
                bins:
                  - { id: care, show: { text: "Looking after a dog" }, say: "Looking after a dog." }
                  - { id: kinds, show: { text: "Kinds of dog" }, say: "Kinds of dog." }
                options:
                  - { text: "Walk your dog every day.", bin: care }
                  - { text: "Give it fresh water.", bin: care }
                  - { text: "A poodle has curly fur.", bin: kinds }
                  - { text: "A dachshund has short legs.", bin: kinds }
              - id: l2-n2
                type: multiple_choice
                text: "Which question sub-heading fits a section about why leaves change colour?"
                options: ["Why do leaves change colour?", "Where do trees grow?", "How tall are trees?"]
                answer: "Why do leaves change colour?"
              - id: l2-n3
                type: ordering
                text: "Put the sections of the report in order."
                say: "Put the sub-headings of a report about castles in a sensible order."
                options: ["Life inside a castle", "What is a castle?", "Famous castles to visit"]
                slot_count: 3
                answer: ["What is a castle?", "Life inside a castle", "Famous castles to visit"]
              - id: l2-n4
                type: multiple_choice
                text: "Under the sub-heading Homes, which fact does NOT belong?"
                options: ["Rabbits eat grass.", "Rabbits live in burrows.", "A group of burrows is a warren."]
                answer: "Rabbits eat grass."
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "A report usually ends with the sub-heading that says what the thing is."
                say: "Read it. Is it true?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "A report has the headings: Bees, Bee homes, Making honey.\n\nWhich one is the main heading?"
            say: "Read the headings. Which one is the main heading?"
            options: ["Bees", "Bee homes", "Making honey"]
            answer: "Bees"
          - id: l2-c2
            type: multiple_choice
            text: "Which is the best sub-heading for a section about how snakes move?"
            options: ["Moving", "Facts", "Other things"]
            answer: "Moving"
          - id: l2-c3
            type: multiple_choice
            text: "Under the sub-heading Food, which fact belongs?"
            options: ["Pandas eat bamboo.", "Pandas live in China.", "Pandas are black and white."]
            answer: "Pandas eat bamboo."
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Ladybirds hatch from tiny yellow eggs. The larvae then turn into pupae.\n\nWhich question sub-heading fits this section?"
            say: "Read the section. Which question sub-heading fits it?"
            options: ["How do ladybirds grow up?", "What do ladybirds eat?", "Why are ladybirds red?"]
            answer: "How do ladybirds grow up?"
          - id: l2-c5
            type: ordering
            text: "Put the sections of the report in order."
            say: "Put the sub-headings of a report about whales in a sensible order."
            options: ["Whale record-breakers", "What is a whale?", "What do whales eat?"]
            slot_count: 3
            answer: ["What is a whale?", "What do whales eat?", "Whale record-breakers"]
