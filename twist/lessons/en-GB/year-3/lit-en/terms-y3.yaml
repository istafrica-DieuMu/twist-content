# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.terms-y3
skill: lit-en.grammar.terms-y3
curriculum: en-GB
language: en
title:
  de: Fachwörter der Grammatik in Klasse 3
  en: Year 3 grammar words
summary: >
  The ten grammar terms of the Year 3 appendix, learnt by using them.
  Lesson 1 takes words and letters: consonant and vowel, prefix and word
  family, preposition and conjunction. Lesson 2 takes sentences: a
  clause (a group of words with a verb), a subordinate clause (one that
  does not make sense on its own, often starting with because, when or
  if), direct speech and inverted commas; it ends with the skill check,
  which names a term from each lesson.
metadata:
  year: year-3
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.time-cause, lit-en.grammar.inverted-commas]
  also_practises: [lit-en.grammar.a-an-word-families]
  vocabulary: { en: [preposition, conjunction, word family, prefix, clause, subordinate clause, main clause, direct speech, consonant, vowel, inverted commas] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: letters, what: { de: Konsonanten und Vokale, en: consonants and vowels } }
    - { id: word-terms, what: { de: Vorsilbe und Wortfamilie, en: prefix and word family } }
    - { id: prep-conj, what: { de: Präposition oder Konjunktion, en: preposition or conjunction } }
    - { id: clauses, what: { de: Teilsatz und Nebensatz, en: clause and subordinate clause } }
    - { id: speech, what: { de: wörtliche Rede und Anführungszeichen, en: direct speech and inverted commas } }
  misconceptions:
    - id: preposition-conjunction-swap
      what: Calls before or after a conjunction when it comes before a noun, or calls any small word a preposition
      addressed: Learn screen 3 of lesson 1; l1-f4, l1-f5, l1-s4, l1-n4 and l2-c2, with feedback in l1-f4
    - id: clause-is-any-group
      what: Thinks any group of words is a clause, even with no verb (under the bridge)
      addressed: Learn screen 1 of lesson 2; l2-f1, l2-s1, l2-n1 and l2-c3, with feedback in l2-f1
    - id: subordinate-stands-alone
      what: Thinks a subordinate clause makes sense on its own (because it was cold.)
      addressed: Learn screen 2 of lesson 2; l2-f2, l2-f3, l2-s2, l2-n2 and l2-c4, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Fachwörter für Wörter und Buchstaben, en: Words for words and letters }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Which word fits? \"We stayed in _ the storm.\""
            say: "Which word fits? We stayed in blank the storm."
            frame: "We stayed in _ the storm."
            options: ["during", "so", "or"]
            answer: ["during"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Where do the inverted commas go?"
            options: ["“I'm cold,” said Ava.", "“I'm cold, said Ava.”"]
            answer: "“I'm cold,” said Ava."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "vowels: a e i o u\nconsonants: b c d f g h j k l m n p q r s t v w x y z"
            say: "Letters are vowels or consonants. The vowels are a, e, i, o and u. All the others are consonants. The letter y can work as either, as in yes and happy."
          - text: "prefix: un + happy = unhappy\nword family: help, helper, helpful, unhelpful"
            say: "A prefix is added to the start of a word to change its meaning. A word family is a group of words that share a root word and a meaning."
          - text: "preposition: under the bridge, after lunch\nconjunction: I ran because I was late. We left after the film ended."
            say: "A preposition comes before a noun to say where or when: under the bridge, after lunch. A conjunction joins clauses: because I was late. After can be either: before a noun, it is a preposition; joining a clause with a verb, it is a conjunction."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap every vowel."
                say: "The letters are on cards. Tap every vowel."
                show: { drawn: letter-card, text: "b e t o m u" }
                spans: ["e", "o", "u"]
                hints:
                  - "The vowels are a, e, i, o, u."
                  - "Check each card against that list."
                  - "e, o and u."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "In \"disappear\", what is dis-?"
                options: ["a prefix", "a vowel", "a conjunction"]
                answer: "a prefix"
                hints:
                  - "Where in the word is dis?"
                  - "Letters added at the start change the meaning."
                  - "A prefix."
              - id: l1-f3
                type: multiple_choice
                text: "What are play, player and playful?"
                options: ["a word family", "prepositions", "inverted commas"]
                answer: "a word family"
                hints:
                  - "What do they share?"
                  - "The root word play and its meaning."
                  - "A word family."
              - id: l1-f4
                type: multiple_choice
                text: "\"The cat hid under the table.\" What is the word under?"
                options: ["a preposition", "a conjunction", "a prefix"]
                answer: "a preposition"
                feedback:
                  "a conjunction": "A conjunction joins two clauses. Here under comes before a noun, the table, and says where: a preposition."
                hints:
                  - "What comes after under: a noun or a whole clause?"
                  - "Under the table says where."
                  - "A preposition."
              - id: l1-f5
                type: multiple_choice
                text: "\"I was late because the bus broke down.\" What is the word because?"
                options: ["a conjunction", "a preposition", "a vowel"]
                answer: "a conjunction"
                hints:
                  - "Does because join two parts with verbs?"
                  - "I was late / the bus broke down."
                  - "A conjunction."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap every consonant."
                say: "The letters are on cards. Tap every consonant."
                show: { drawn: letter-card, text: "a k i r o s" }
                spans: ["k", "r", "s"]
                hints: ["Consonants are all the letters that are not vowels."]
              - id: l1-s2
                type: multiple_choice
                text: "In \"rebuild\", what is re-?"
                options: ["a prefix", "a word family", "a preposition"]
                answer: "a prefix"
                hints: ["It is at the start and changes the meaning."]
              - id: l1-s3
                type: multiple_choice
                text: "Which group is a word family?"
                options: ["kind, kindness, unkind", "kind, king, kite", "under, over, behind"]
                answer: "kind, kindness, unkind"
                option_audio: false
                hints: ["Shared root, shared meaning."]
              - id: l1-s4
                type: multiple_choice
                text: "\"We had a picnic after the match.\" What is the word after?"
                options: ["a preposition", "a conjunction"]
                answer: "a preposition"
                hints: ["After the match: a noun follows, not a clause."]
              - id: l1-s5
                type: true_false
                text: "The letter u is a vowel."
                say: "Read it. Is it true?"
                answer: true
                hints: ["a, e, i, o, u."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap every vowel."
                say: "The letters are on cards. Tap every vowel."
                show: { drawn: letter-card, text: "i n a d e p" }
                spans: ["i", "a", "e"]
              - id: l1-n2
                type: multiple_choice
                text: "In \"misbehave\", what is mis-?"
                options: ["a prefix", "a consonant", "a clause"]
                answer: "a prefix"
              - id: l1-n3
                type: multiple_choice
                text: "Which word belongs to the word family of light?"
                options: ["lighthouse", "lion", "line"]
                answer: "lighthouse"
              - id: l1-n4
                type: multiple_choice
                text: "\"We went home when it got dark.\" What is the word when?"
                options: ["a conjunction", "a preposition"]
                answer: "a conjunction"
              - id: l1-n5
                type: matching
                text: "Match each term with an example."
                say: "Match each grammar word with an example."
                pairs:
                  - { left: { text: "preposition" }, right: { text: "behind the door" } }
                  - { left: { text: "conjunction" }, right: { text: "because" } }
                  - { left: { text: "prefix" }, right: { text: "un-" } }
                  - { left: { text: "vowel" }, right: { text: "o" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which letter is a consonant?"
            options: ["t", "a", "i"]
            answer: "t"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "\"The dog ran through the gate.\" What is the word through?"
            options: ["a preposition", "a conjunction", "a prefix"]
            answer: "a preposition"
          - id: l1-c3
            type: multiple_choice
            text: "What is a prefix?"
            options: ["letters added to the start of a word", "letters added to the end of a word", "a word that joins clauses"]
            answer: "letters added to the start of a word"
          - id: l1-c4
            type: multiple_choice
            text: "Which word is a conjunction?"
            options: ["because", "under", "behind"]
            answer: "because"
          - id: l1-c5
            type: true_false
            text: "Teach, teacher and teaching are a word family."
            say: "Read it. Is it true?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "How many consonants are in the word \"stamp\"?"
            options: ["4", "1", "5"]
            answer: "4"

  - n: 2
    title: { de: Fachwörter für Sätze, en: Words for sentences }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"The keys are under the mat.\" What is the word under?"
            options: ["a preposition", "a conjunction"]
            answer: "a preposition"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which letter is a vowel?"
            options: ["e", "b", "s"]
            answer: "e"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Clause: the dog barked (verb: barked)\nNot a clause: under the bridge (no verb)"
            say: "A clause is a group of words with a verb in it. The dog barked is a clause, because barked is a verb. Under the bridge has no verb, so it is not a clause."
          - text: "I wore my coat because it was cold.\nmain clause: I wore my coat\nsubordinate clause: because it was cold"
            say: "A main clause makes sense on its own. A subordinate clause does not: because it was cold leaves you waiting for more. Subordinate clauses often start with a conjunction such as because, when, if or after."
          - text: "“Let's go,” said Sam.\ndirect speech: Let's go\ninverted commas: “ and ”"
            say: "Direct speech is the exact words a person says. We write it inside inverted commas."
          - text: "Grammar words help us talk about our writing."
            say: "Knowing these words helps you and your teacher talk about how to make your writing better."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which group of words is a clause?"
                options: ["the baby giggled", "in the garden", "a big red bus"]
                answer: "the baby giggled"
                feedback:
                  "in the garden": "In the garden has no verb, so it is not a clause. Which group has a verb?"
                hints:
                  - "Look for a verb: a doing word."
                  - "Giggled is a verb."
                  - "The baby giggled."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tap the subordinate clause."
                say: "Tap every word of the subordinate clause: the part that does not make sense on its own."
                show: { drawn: letter-card, text: "We went inside when it started to rain" }
                spans: ["when", "it", "started", "to", "rain"]
                hints:
                  - "Which part leaves you waiting for more?"
                  - "It starts with a conjunction."
                  - "when it started to rain."
              - id: l2-f3
                type: multiple_choice
                text: "\"If you are hungry, have an apple.\" Which part is the main clause?"
                options: ["have an apple", "If you are hungry"]
                answer: "have an apple"
                feedback:
                  "If you are hungry": "If you are hungry leaves you waiting: if you are hungry, what? It is the subordinate clause. The main clause is the part that makes sense alone."
                hints:
                  - "Which part makes sense on its own?"
                  - "Say each part alone."
                  - "Have an apple."
              - id: l2-f4
                type: multiple_choice
                text: "“Close the window,” said Gran.\n\nWhat do we call the words “Close the window”?"
                say: "Read the sentence. What do we call the words close the window?"
                options: ["direct speech", "a prefix", "a word family"]
                answer: "direct speech"
                hints:
                  - "Who says those words?"
                  - "They are Gran's exact words."
                  - "Direct speech."
              - id: l2-f5
                type: true_false
                text: "The marks “ and ” are called inverted commas."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "What do we put round direct speech?"
                  - "Some people call them speech marks."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which group of words is a clause?"
                options: ["the rain stopped", "after lunch", "my old blue bike"]
                answer: "the rain stopped"
                hints: ["Which group has a verb?"]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap the subordinate clause."
                say: "Tap every word of the subordinate clause: the part that does not make sense on its own."
                show: { drawn: letter-card, text: "Max smiled because he had won" }
                spans: ["because", "he", "had", "won"]
                hints: ["Look for the conjunction."]
              - id: l2-s3
                type: multiple_choice
                text: "\"After we had tea, we watched a film.\" Which part is the main clause?"
                options: ["we watched a film", "After we had tea"]
                answer: "we watched a film"
                hints: ["Which part makes sense on its own?"]
              - id: l2-s4
                type: multiple_choice
                text: "What do inverted commas show?"
                options: ["direct speech", "a prefix", "a vowel"]
                answer: "direct speech"
                hints: ["They go round spoken words."]
              - id: l2-s5
                type: true_false
                text: "\"because it was late\" makes sense on its own as a sentence."
                say: "Read it. Is it true?"
                answer: false
                hints: ["Does it leave you waiting for more?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which group of words is a clause?"
                options: ["the bell rang", "on the shelf", "two fluffy kittens"]
                answer: "the bell rang"
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the subordinate clause."
                say: "Tap every word of the subordinate clause: the part that does not make sense on its own."
                show: { drawn: letter-card, text: "If it is sunny, we will go to the beach" }
                spans: ["If", "it", "is", "sunny"]
              - id: l2-n3
                type: multiple_choice
                text: "“I've finished!” shouted Leo.\n\nWhich words are the direct speech?"
                say: "Read the sentence. Which words are the direct speech?"
                options: ["I've finished!", "shouted Leo", "Leo"]
                answer: "I've finished!"
                option_audio: false
              - id: l2-n4
                type: matching
                text: "Match each term with an example."
                say: "Match each grammar word with an example."
                pairs:
                  - { left: { text: "clause" }, right: { text: "the sun shone" } }
                  - { left: { text: "subordinate clause" }, right: { text: "when the sun shone" } }
                  - { left: { text: "inverted commas" }, right: { text: "“ ”" } }
              - id: l2-n5
                type: true_false
                text: "A clause always has a verb in it."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: letters
            type: highlight_in_text
            text: "Tap every consonant."
            say: "The letters are on cards. Tap every consonant."
            show: { drawn: letter-card, text: "e m u f a l" }
            spans: ["m", "f", "l"]
          - id: l2-c2
            part: prep-conj
            type: multiple_choice
            text: "\"Wash your hands before you eat.\" What is the word before?"
            options: ["a conjunction", "a preposition"]
            answer: "a conjunction"
          - id: l2-c3
            part: clauses
            type: multiple_choice
            text: "Which group of words is a clause?"
            options: ["the frog jumped", "beside the pond", "a slimy green frog"]
            answer: "the frog jumped"
          - id: l2-c4
            part: clauses
            type: multiple_choice
            text: "\"I can't play because I've hurt my leg.\" Which part is the subordinate clause?"
            options: ["because I've hurt my leg", "I can't play"]
            answer: "because I've hurt my leg"
          - id: l2-c5
            part: word-terms
            type: multiple_choice
            text: "What are \"unhappy\", \"happiness\" and \"happily\"?"
            options: ["a word family", "direct speech", "prepositions"]
            answer: "a word family"
          - id: l2-c6
            part: letters
            type: true_false
            text: "The word \"crisp\" has only one vowel."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c7
            part: letters
            type: multiple_choice
            text: "How many vowels are in the word \"banana\"?"
            options: ["3", "6", "2"]
            answer: "3"
          - id: l2-c8
            part: letters
            type: multiple_choice
            text: "Which word starts with a vowel?"
            options: ["orange", "banana", "pear"]
            answer: "orange"
            option_audio: false
          - id: l2-c9
            part: word-terms
            type: sorting
            text: "Is the word in the word family of play?"
            say: "Read each word. Is it in the word family of play, or not?"
            option_audio: false
            bins:
              - { id: family, show: { text: "in the play family" }, say: "In the play family." }
              - { id: not, show: { text: "not in it" }, say: "Not in it." }
            options:
              - { text: "playground", bin: family }
              - { text: "replay", bin: family }
              - { text: "plate", bin: not }
              - { text: "plant", bin: not }
          - id: l2-c10
            part: word-terms
            type: multiple_choice
            text: "Which word has a prefix?"
            options: ["unlock", "under", "uncle"]
            answer: "unlock"
            option_audio: false
          - id: l2-c11
            part: word-terms
            type: multiple_choice
            text: "What do the words in a word family share?"
            options: ["a root word and its meaning", "the same first letter only", "the same number of letters"]
            answer: "a root word and its meaning"
          - id: l2-c12
            part: prep-conj
            type: highlight_in_text
            text: "Tap the preposition."
            say: "Read the sentence. Tap the preposition."
            show: { drawn: letter-card, text: "The ball rolled under the car" }
            spans: ["under"]
          - id: l2-c13
            part: prep-conj
            type: multiple_choice
            text: "\"We played outside until lunch.\" What is the word until?"
            options: ["a preposition", "a conjunction"]
            answer: "a preposition"
          - id: l2-c14
            part: prep-conj
            type: sorting
            text: "Is after or before a preposition or a conjunction here?"
            say: "Read each part of a sentence. Is after or before a preposition here, or a conjunction?"
            option_audio: false
            bins:
              - { id: prep, show: { text: "preposition" }, say: "Preposition." }
              - { id: conj, show: { text: "conjunction" }, say: "Conjunction." }
            options:
              - { text: "after school", bin: prep }
              - { text: "before bedtime", bin: prep }
              - { text: "after we ate our tea", bin: conj }
              - { text: "before the film started", bin: conj }
          - id: l2-c15
            part: clauses
            type: true_false
            text: "\"because the shop was closed\" is a subordinate clause."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c16
            part: clauses
            type: highlight_in_text
            text: "Tap the verb that makes this group of words a clause."
            say: "Read the words. Tap the verb that makes them a clause."
            show: { drawn: letter-card, text: "the wind howled" }
            spans: ["howled"]
          - id: l2-c17
            part: speech
            type: multiple_choice
            text: "Which sentence uses inverted commas correctly?"
            options: ["“Can I come too?” asked Mia.", "“Can I come too? asked Mia.”", "Can I come “too?” asked Mia."]
            answer: "“Can I come too?” asked Mia."
            option_audio: false
          - id: l2-c18
            part: speech
            type: multiple_choice
            text: "“We're nearly there,” said Dad.\n\nWhat do we call the marks “ and ”?"
            say: "Read the sentence. What do we call the marks round Dad's words?"
            options: ["inverted commas", "prefixes", "full stops"]
            answer: "inverted commas"
          - id: l2-c19
            part: speech
            type: highlight_in_text
            text: "Tap the words of the direct speech."
            say: "Read the sentence. Tap every word of the direct speech."
            show: { drawn: letter-card, text: "“Look at that rainbow!” cried Zoe." }
            spans: ["“Look", "at", "that", "rainbow!”"]
          - id: l2-c20
            part: speech
            type: true_false
            text: "“Time for bed,” said Mum.\n\nIs it true? The direct speech is \"said Mum\"."
            say: "Read the sentence. Is it true? The direct speech is, said Mum."
            answer: false
