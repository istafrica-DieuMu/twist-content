# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.poetry-forms
skill: lit-en.texts.poetry-forms
curriculum: en-GB
language: en
title:
  de: Gedichtformen erkennen
  en: Forms of poetry
summary: >
  Children learn to recognise four forms of poetry from short poems
  written for Twist. Lesson 1 takes the two forms with fixed rules: the
  haiku (three lines of 5, 7 and 5 syllables, often about nature, first
  written in Japan) and the limerick (five lines, a funny story, lines 1,
  2 and 5 rhyming and lines 3 and 4 shorter and rhyming). Lesson 2 takes
  free verse (no regular rhyme or rhythm, lines of any length) and the
  narrative poem (a poem that tells a story with characters and events),
  then sorts all four; it ends with the skill check.
metadata:
  year: year-3
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.texts.poems-by-heart]
  also_practises: []
  vocabulary: { en: [poem, form, haiku, syllable, limerick, rhyme, free verse, narrative poem, verse, line] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: all-poems-rhyme
      what: Thinks a poem must rhyme, so free verse and haiku are not real poems
      addressed: Learn screens 1 and 3 of lesson 1 and screen 1 of lesson 2; l2-f1, l2-f2, l2-s1 and l2-c2, with feedback in l2-f1
    - id: haiku-counts-words
      what: Counts words instead of syllables in a haiku
      addressed: Learn screen 2 of lesson 1; l1-f1, l1-f2, l1-s1, l1-n1 and l2-c3, with feedback in l1-f2
    - id: story-means-narrative
      what: Calls any poem with a person in it a narrative poem, even when nothing happens
      addressed: Learn screen 2 of lesson 2; l2-f3, l2-s3 and l2-n3 ask whether the poem tells a story with events, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Haiku und Limerick, en: Haiku and limericks }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "You are learning a poem by heart. What can help you remember the next line?"
            options: ["the rhyming words", "the page number", "the colour of the book"]
            answer: "the rhyming words"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How would you say a poem about a slow snail?"
            options: ["slowly", "very fast", "in a squeaky voice"]
            answer: "slowly"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Cold morning puddle\na robin taps the thin ice\nsky cracks into stars"
            say: "Listen. Cold morning puddle. A robin taps the thin ice. Sky cracks into stars. This is a haiku. Haiku were first written in Japan."
          - text: "Cold / mor / ning / pud / dle = 5\na / ro / bin / taps / the / thin / ice = 7\nsky / cracks / in / to / stars = 5"
            say: "A haiku has three lines. The first line has five syllables, the second has seven, the third has five. Count the beats, not the words. A haiku often paints a small picture of nature. It does not need to rhyme."
          - text: "There once was a cat from Dundee\nWho longed to be able to ski.\nShe slid down the hill,\nThen took a big spill,\nAnd landed head first in a tree."
            say: "Now listen to a limerick. It is funny, and it tells a tiny story."
          - text: "Limerick: 5 lines\nLines 1, 2 and 5 rhyme: Dundee, ski, tree.\nLines 3 and 4 are shorter and rhyme: hill, spill."
            say: "A limerick has five lines. Lines one, two and five rhyme with each other. Lines three and four are shorter, and they rhyme with each other. The poet Edward Lear wrote lots of limericks."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many lines does a haiku have?"
                options: ["3", "5", "14"]
                answer: "3"
                hints:
                  - "Think of the cold morning puddle."
                  - "5 syllables, 7 syllables, 5 syllables: how many lines is that?"
                  - "3 lines."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which line has 5 syllables?"
                options: ["snow falls on the hill", "snow falls", "snow falls softly on the hill"]
                answer: "snow falls on the hill"
                option_audio: false
                feedback:
                  "snow falls softly on the hill": "Clap it: snow, falls, soft, ly, on, the, hill. That is 7 syllables. Soft-ly has two beats."
                hints:
                  - "Clap each line. Count the claps, not the words."
                  - "Soft-ly is two claps."
                  - "Snow falls on the hill."
              - id: l1-f3
                type: multiple_choice
                text: "There once was a cat from Dundee\nWho longed to be able to ski.\nShe slid down the hill,\nThen took a big spill,\nAnd landed head first in a tree.\n\nWhich lines rhyme with Dundee?"
                say: "Read the limerick. Which lines rhyme with Dundee?"
                options: ["lines 2 and 5", "lines 3 and 4", "only line 4"]
                answer: "lines 2 and 5"
                hints:
                  - "Look at the last word of each line."
                  - "Ski and tree."
                  - "Lines 2 and 5."
              - id: l1-f4
                type: fill_in_blank
                text: "Finish the limerick."
                say: "Read the start of the limerick. Which word fits the rhyme?"
                frame: "A dog with a very long nose\nLiked sniffing the garden's red _."
                options: ["rose", "tulip", "flower"]
                answer: ["rose"]
                hints:
                  - "Line 2 must rhyme with line 1."
                  - "What rhymes with nose?"
                  - "Rose."
              - id: l1-f5
                type: true_false
                text: "A haiku must rhyme."
                say: "Read it. Is it true?"
                answer: false
                hints:
                  - "Read the cold morning puddle again."
                  - "Puddle, ice, stars: do they rhyme?"
                  - "No, a haiku does not need to rhyme."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which line has 7 syllables?"
                options: ["the river runs to the sea", "the river runs", "the river runs fast and wide to the sea"]
                answer: "the river runs to the sea"
                option_audio: false
                hints: ["Clap each line: ri-ver is two claps."]
              - id: l1-s2
                type: multiple_choice
                text: "How many lines does a limerick have?"
                options: ["5", "3", "4"]
                answer: "5"
                hints: ["Count the lines about the cat from Dundee."]
              - id: l1-s3
                type: multiple_choice
                text: "What is a limerick usually like?"
                options: ["short and funny", "long and sad", "a list of facts"]
                answer: "short and funny"
                hints: ["Think of the cat who took a big spill."]
              - id: l1-s4
                type: ordering
                text: "Put the haiku in order: 5, 7, 5."
                say: "Put the lines in order to make a haiku: five syllables, then seven, then five."
                options: ["red and gold across the path", "the wind sweeps them home", "Autumn leaves drifting"]
                slot_count: 3
                answer: ["Autumn leaves drifting", "red and gold across the path", "the wind sweeps them home"]
                option_audio: false
                hints: ["The seven-syllable line goes in the middle; Autumn has the capital letter."]
              - id: l1-s5
                type: true_false
                text: "In a limerick, lines 3 and 4 are shorter than the others."
                say: "Read it. Is it true?"
                answer: true
                hints: ["She slid down the hill. Then took a big spill."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many syllables are in the middle line of a haiku?"
                options: ["7", "5", "3"]
                answer: "7"
              - id: l1-n2
                type: fill_in_blank
                text: "Finish the limerick."
                say: "Read lines 3 and 4 of the limerick. Which word fits the rhyme?"
                frame: "He sniffed with such power\nHe swallowed the _."
                options: ["flower", "bush", "petal"]
                answer: ["flower"]
              - id: l1-n3
                type: multiple_choice
                text: "Where were haiku first written?"
                options: ["Japan", "France", "Scotland"]
                answer: "Japan"
              - id: l1-n4
                type: multiple_choice
                text: "Which poem is a haiku?"
                options: ["Green frog on a stone\nwaits for a fly to buzz by\nthen his tongue flicks out", "There was a young frog from the bog\nWho sat all day long on a log", "Frogs are green.\nFrogs are wet.\nFrogs are the best pets."]
                answer: "Green frog on a stone\nwaits for a fly to buzz by\nthen his tongue flicks out"
                option_audio: false
              - id: l1-n5
                type: matching
                text: "Match each form with its rule."
                say: "Match each form of poem with its rule."
                pairs:
                  - { left: { text: "haiku" }, right: { text: "3 lines: 5, 7, 5 syllables" } }
                  - { left: { text: "limerick" }, right: { text: "5 lines: lines 1, 2 and 5 rhyme" } }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many syllables are in the first line of a haiku?"
            options: ["5", "7", "3"]
            answer: "5"
          - id: l1-c2
            type: multiple_choice
            text: "Which lines of a limerick rhyme with line 1?"
            options: ["lines 2 and 5", "lines 3 and 4", "all of them"]
            answer: "lines 2 and 5"
          - id: l1-c3
            type: true_false
            text: "A limerick usually tells a funny little story."
            say: "Read it. Is it true?"
            answer: true

  - n: 2
    title: { de: Freie Verse und Erzählgedichte, en: Free verse and narrative poems }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which form has 3 lines of 5, 7 and 5 syllables?"
            options: ["haiku", "limerick"]
            answer: "haiku"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many lines does a limerick have?"
            options: ["5", "3", "7"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The city at night\nhums\nlike a fridge in the dark.\nWindows blink on,\none\nby\none."
            say: "Listen. The city at night hums like a fridge in the dark. Windows blink on, one, by, one. This is free verse. It has no regular rhyme and no regular rhythm. The lines can be any length. The poet chooses where each line breaks, for effect."
          - text: "Old Tom the fisherman rowed out at dawn,\nAnd cast his big net in the silvery sea.\nBut up came a mermaid, who gave a great yawn,\n'Please put me back, Tom! I'm late for my tea!'"
            say: "This is a narrative poem. Narrative means story. A narrative poem tells a story, with characters and events, like a story told in verse. It may rhyme, or not."
          - text: "haiku: 3 lines, 5, 7, 5 syllables\nlimerick: 5 lines, funny, AABBA rhyme\nfree verse: no regular rhyme or rhythm\nnarrative poem: tells a story"
            say: "Now you know four forms of poetry. To spot the form, ask: how many lines? Does it rhyme? Does it tell a story?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The city at night\nhums\nlike a fridge in the dark.\n\nWhy is this a poem, even though it does not rhyme?"
                say: "Read the lines. Why is this a poem, even though it does not rhyme?"
                options: ["It is free verse: the poet picks words and line breaks for effect.", "It is not a poem, because it does not rhyme.", "It is a limerick."]
                answer: "It is free verse: the poet picks words and line breaks for effect."
                option_audio: false
                feedback:
                  "It is not a poem, because it does not rhyme.": "Many poems do not rhyme. Free verse and haiku are poems too."
                hints:
                  - "Does every poem have to rhyme?"
                  - "Free verse has no regular rhyme or rhythm."
                  - "It is free verse."
              - id: l2-f2
                type: true_false
                text: "Free verse has no regular rhyme or rhythm."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Think of the city at night."
                  - "Hums, dark, on, one: no rhyme pattern."
                  - "Yes, it is true."
              - id: l2-f3
                type: multiple_choice
                text: "My grandad\nhas soft hands\nand a laugh like thunder.\n\nIs this a narrative poem?"
                say: "Read the poem. Is it a narrative poem?"
                options: ["No, it describes him but tells no story.", "Yes, because it has a person in it."]
                answer: "No, it describes him but tells no story."
                option_audio: false
                feedback:
                  "Yes, because it has a person in it.": "A narrative poem tells a story: something happens. This poem describes Grandad, but nothing happens."
                hints:
                  - "Does anything happen in the poem?"
                  - "It tells us what Grandad is like, not what he did."
                  - "No, it tells no story."
              - id: l2-f4
                type: multiple_choice
                text: "What does narrative mean?"
                options: ["story", "rhyme", "short"]
                answer: "story"
                hints:
                  - "A narrative poem tells a ..."
                  - "Old Tom and the mermaid is a little tale."
                  - "Story."
              - id: l2-f5
                type: sorting
                text: "Sort the features."
                say: "Read each feature. Does it belong to a haiku or to a limerick?"
                option_audio: false
                bins:
                  - { id: haiku, show: { text: "haiku" }, say: "Haiku." }
                  - { id: limerick, show: { text: "limerick" }, say: "Limerick." }
                options:
                  - { text: "three lines", bin: haiku }
                  - { text: "five lines", bin: limerick }
                  - { text: "often about nature", bin: haiku }
                  - { text: "funny, with a rhyme pattern", bin: limerick }
                hints:
                  - "Count lines first."
                  - "Which one is quiet and about nature?"
                  - "Three lines and nature: haiku; five lines and funny: limerick."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Rain on the window\ntaps\ntaps\nlike fingers\nwanting to come in.\n\nWhich form is this poem?"
                say: "Read the poem. Which form is it?"
                options: ["free verse", "limerick", "haiku"]
                answer: "free verse"
                hints: ["Count the lines. Is there a rhyme or a pattern?"]
              - id: l2-s2
                type: multiple_choice
                text: "Old Tom the fisherman rowed out at dawn,\nAnd cast his big net in the silvery sea.\nBut up came a mermaid, who gave a great yawn,\n'Please put me back, Tom! I'm late for my tea!'\n\nWho are the characters in this narrative poem?"
                say: "Read the poem. Who are the characters?"
                options: ["Tom and a mermaid", "a fish and a net", "the sea and the dawn"]
                answer: "Tom and a mermaid"
                hints: ["Who does something or says something?"]
              - id: l2-s3
                type: true_false
                text: "A narrative poem tells a story with events."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Narrative means story."]
              - id: l2-s4
                type: matching
                text: "Match each form with its rule."
                say: "Match each form of poem with its rule."
                pairs:
                  - { left: { text: "free verse" }, right: { text: "no regular rhyme or rhythm" } }
                  - { left: { text: "narrative poem" }, right: { text: "tells a story" } }
                  - { left: { text: "haiku" }, right: { text: "3 lines: 5, 7, 5 syllables" } }
                hints: ["Narrative means story."]
              - id: l2-s5
                type: multiple_choice
                text: "Which question helps you tell a haiku from free verse?"
                options: ["Does it have three lines of 5, 7 and 5 syllables?", "Does it have a title?", "Is it about a person?"]
                answer: "Does it have three lines of 5, 7 and 5 syllables?"
                hints: ["Neither has to rhyme, so count."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Sort the poems by form."
                say: "Read each poem. Put it in the right group."
                option_audio: false
                bins:
                  - { id: haiku, show: { text: "haiku" }, say: "Haiku." }
                  - { id: limerick, show: { text: "limerick" }, say: "Limerick." }
                  - { id: free, show: { text: "free verse" }, say: "Free verse." }
                options:
                  - { text: "Spring rain on the pond / a frog sits still on a leaf / then plop, he is gone", bin: haiku }
                  - { text: "A boy who was terribly tall / Would bump his poor head on the wall ...", bin: limerick }
                  - { text: "Morning / spills / like orange juice / across my bedroom floor", bin: free }
              - id: l2-n2
                type: multiple_choice
                text: "Which form is The Owl and the Pussy-cat by Edward Lear, where an owl and a cat sail away, buy a ring and get married?"
                options: ["narrative poem", "haiku", "free verse"]
                answer: "narrative poem"
              - id: l2-n3
                type: multiple_choice
                text: "The moon\nis a silver coin\nin the pocket of the night.\n\nIs this a narrative poem?"
                say: "Read the poem. Is it a narrative poem?"
                options: ["No, it describes the moon but tells no story.", "Yes, it tells a story."]
                answer: "No, it describes the moon but tells no story."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Every poem must rhyme."
                say: "Read it. Is it true?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Which form has five lines, where lines 3 and 4 are short and rhyme?"
                options: ["limerick", "haiku", "free verse"]
                answer: "limerick"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "There was an old man with a beard,\nWho said, 'It is just as I feared!\nTwo owls and a hen,\nFour larks and a wren,\nHave all built their nests in my beard!'\n\nThis poem is by Edward Lear. Which form is it?"
            say: "Read the poem by Edward Lear. Which form is it?"
            options: ["limerick", "haiku", "free verse"]
            answer: "limerick"
          - id: l2-c2
            type: multiple_choice
            text: "Which form has no regular rhyme or rhythm?"
            options: ["free verse", "limerick", "a poem in rhyming couplets"]
            answer: "free verse"
          - id: l2-c3
            type: multiple_choice
            text: "Which could be the first line of a haiku?"
            options: ["White clouds drifting by", "White clouds", "White clouds are drifting slowly by"]
            answer: "White clouds drifting by"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "A poem tells how a brave girl crossed a river, met a giant and tricked him. Which form is it?"
            options: ["narrative poem", "haiku", "limerick"]
            answer: "narrative poem"
          - id: l2-c5
            type: true_false
            text: "A haiku has five lines."
            say: "Read it. Is it true?"
            answer: false
