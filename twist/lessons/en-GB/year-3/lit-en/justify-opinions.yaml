# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.justify-opinions
skill: lit-en.speaking.justify-opinions
curriculum: en-GB
language: en
title:
  de: Meinungen und Antworten begründen
  en: Explaining and justifying opinions
summary: >
  Children learn to back up what they say. Lesson 1 gives an opinion
  with a reason (I think ... because ...) and tells a real reason from a
  repeat of the opinion; lesson 2 adds an example or evidence (for
  example, I know this because ...), explains how they got an answer,
  and agrees or disagrees politely with a reason; it ends with the skill
  check. Speaking tasks are practised and checked by the child against a
  model; the skill check uses choice and order tasks, since speech is
  not marked.
metadata:
  year: year-3
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.speaking.describe-narrate]
  also_practises: [lit-en.speaking.explain-why]
  vocabulary: { en: [opinion, reason, justify, because, for example, evidence, agree, disagree, I think, I know this because] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: repeat-not-reason
      what: Gives the opinion again as its reason (I like it because I like it; it is good because it is great)
      addressed: Learn screen 3 of lesson 1; l1-f2, l1-f4, l1-s2, l1-n2 and l2-c2, with feedback in l1-f2
    - id: louder-is-stronger
      what: Thinks saying an opinion more strongly or louder makes it more convincing than a reason
      addressed: l1-f5, l1-s5 and l2-n3 compare a strong voice with a reason
    - id: disagree-rudely
      what: Disagrees by saying the other person is wrong or silly, without a reason
      addressed: Learn screen 3 of lesson 2; l2-f4, l2-s4 and l2-c4, with feedback in l2-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Meinung mit Grund, en: An opinion with a reason }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "You describe your bike to a friend. What do you say first?"
            options: ["what it is", "a tiny detail", "how it ends"]
            answer: "what it is"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word helps you tell a story in order?"
            options: ["next", "nice", "never"]
            answer: "next"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Opinion: I think cats make the best pets."
            say: "An opinion is what you think. On its own it does not tell your listener much."
          - text: "I think cats make the best pets because they can look after themselves."
            say: "To justify your opinion, give a reason. Use because. Now the listener knows why you think it."
          - text: "Not a reason: I think cats are the best because they are great."
            say: "Careful. They are great says the same thing again. A reason tells the listener something new: why."
          - text: "I think ... because ...\nIn my opinion ... because ..."
            say: "Start with I think, or in my opinion. Then say because, and give your reason."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which word joins an opinion to its reason?"
                options: ["because", "and then", "once upon a time"]
                answer: "because"
                hints:
                  - "Which word answers the question why?"
                  - "I think ... _ ..."
                  - "Because."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"I think swimming is the best sport...\" Which ending gives a real reason?"
                options: ["because it keeps your whole body fit.", "because it is the best.", "because I think so."]
                answer: "because it keeps your whole body fit."
                feedback:
                  "because it is the best.": "That says the opinion again. A reason tells the listener something new about why."
                hints:
                  - "Which ending tells you something new?"
                  - "Two endings just repeat the opinion."
                  - "Because it keeps your whole body fit."
              - id: l1-f3
                type: sorting
                text: "Opinion or reason?"
                say: "Read each part. Is it an opinion or a reason?"
                option_audio: false
                bins:
                  - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
                  - { id: reason, show: { text: "reason" }, say: "Reason." }
                options:
                  - { text: "I think we should have a longer playtime", bin: opinion }
                  - { text: "because we would have more time to run about", bin: reason }
                  - { text: "In my opinion, autumn is the best season", bin: opinion }
                  - { text: "because the leaves turn red and gold", bin: reason }
                hints:
                  - "The reason usually starts with because."
                  - "The opinion says what someone thinks."
                  - "The two because parts are reasons."
              - id: l1-f4
                type: true_false
                text: "\"I like pizza because I like it\" gives a good reason."
                say: "Read it. Is it true?"
                answer: false
                hints:
                  - "Does the second part say anything new?"
                  - "It says the same thing twice."
                  - "No, it does not give a reason."
              - id: l1-f5
                type: multiple_choice
                text: "Which would make your friend most likely to agree with you?"
                options: ["giving a good reason", "saying it louder", "saying it again and again"]
                answer: "giving a good reason"
                hints:
                  - "What helps someone understand your view?"
                  - "Loud and often do not explain anything."
                  - "Giving a good reason."

          - support: some
            tasks:
              - id: l1-s1
                type: speak
                text: "Say which you prefer, summer or winter, and give a reason."
                say: "Which do you prefer, summer or winter? Say I think, then because, and give your reason. Then listen to an example."
                expected_text: "I think summer is better because we can play outside until late."
                hints: ["Start with: I think ... because ..."]
              - id: l1-s2
                type: multiple_choice
                text: "\"I think reading at bedtime is a good idea...\" Which ending gives a real reason?"
                options: ["because it helps you relax before sleep.", "because it is a good idea.", "because yes."]
                answer: "because it helps you relax before sleep."
                hints: ["Which ending tells you why?"]
              - id: l1-s3
                type: ordering
                text: "Build the sentence."
                say: "Put the cards in order to give an opinion with a reason."
                options: ["because they are strong and kind.", "I think", "elephants are amazing"]
                slot_count: 3
                answer: ["I think", "elephants are amazing", "because they are strong and kind."]
                hints: ["Opinion first, then because and the reason."]
              - id: l1-s4
                type: multiple_choice
                text: "What does justify your opinion mean?"
                options: ["give reasons for it", "change it", "say it quietly"]
                answer: "give reasons for it"
                hints: ["It is about saying why."]
              - id: l1-s5
                type: true_false
                text: "Shouting your opinion makes it a better opinion."
                say: "Read it. Is it true?"
                answer: false
                hints: ["What helps more: noise or a reason?"]

          - support: none
            tasks:
              - id: l1-n1
                type: speak
                text: "Say what your favourite food is and why."
                say: "Tell me your favourite food and give a reason. Then listen to an example."
                expected_text: "My favourite food is pasta because it is warm and filling."
              - id: l1-n2
                type: multiple_choice
                text: "\"I think dogs are great pets...\" Which ending gives a real reason?"
                options: ["because they love going on walks with you.", "because they are great.", "because I said so."]
                answer: "because they love going on walks with you."
              - id: l1-n3
                type: sorting
                text: "Opinion or reason?"
                say: "Read each part. Is it an opinion or a reason?"
                option_audio: false
                bins:
                  - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
                  - { id: reason, show: { text: "reason" }, say: "Reason." }
                options:
                  - { text: "I think the library is the best room in school", bin: opinion }
                  - { text: "because it is quiet and full of books", bin: reason }
                  - { text: "In my opinion, we need more bins", bin: opinion }
                  - { text: "because there is litter in the playground", bin: reason }
              - id: l1-n4
                type: multiple_choice
                text: "Which sentence justifies an opinion?"
                options: ["I think we should plant trees because they give homes to birds.", "We should plant trees.", "Trees, trees, trees!"]
                answer: "I think we should plant trees because they give homes to birds."
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "\"In my opinion\" means the same as \"I think\"."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"I think football is fun...\" Which ending gives a real reason?"
            options: ["because you play as a team.", "because it is fun.", "because football."]
            answer: "because you play as a team."
          - id: l1-c2
            type: multiple_choice
            text: "Which word do we use to give a reason?"
            options: ["because", "but", "then"]
            answer: "because"
          - id: l1-c3
            type: true_false
            text: "A reason tells the listener why you think something."
            say: "Read it. Is it true?"
            answer: true

  - n: 2
    title: { de: "Beispiele, Belege und Widerspruch", en: "Examples, evidence and disagreeing" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"I think hamsters are good pets...\" Which ending gives a real reason?"
            options: ["because they are small and easy to look after.", "because they are good pets.", "because hamsters."]
            answer: "because they are small and easy to look after."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "An opinion on its own tells the listener why you think it."
            say: "Read it. Is it true?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I think the park needs a new swing because the old one is broken. For example, the chain snapped last week."
            say: "You can make a reason stronger with an example. Say for example, and give one."
          - text: "Question: Is 15 an odd number?\nAnswer: Yes. I know this because it ends in 5, and numbers ending in 1, 3, 5, 7 or 9 are odd."
            say: "You can justify an answer, too, in any lesson. Say I know this because, and explain how you worked it out."
          - text: "I agree with Priya because ...\nI see what you mean, but I disagree because ..."
            say: "When you talk with others, you can agree or disagree. Do it politely, and always give your reason."
          - text: "Opinion, reason, example"
            say: "So a strong answer has three parts: your opinion, your reason, and an example or evidence."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Put the answer in order: opinion, reason, example."
                say: "Put the three sentences in order: the opinion, the reason, then the example."
                options: ["For example, yesterday we could not hear each other talk.", "I think we should eat lunch outside.", "The hall is too crowded and noisy."]
                slot_count: 3
                answer: ["I think we should eat lunch outside.", "The hall is too crowded and noisy.", "For example, yesterday we could not hear each other talk."]
                option_audio: false
                hints:
                  - "Which sentence says what someone thinks?"
                  - "The opinion comes first, the example last."
                  - "Eat lunch outside, the hall is too noisy, then for example."
              - id: l2-f2
                type: multiple_choice
                text: "\"I think Goldilocks was rude.\" Which sentence is evidence from the story?"
                options: ["She went into the bears' house without asking.", "Goldilocks has golden hair.", "Bears live in woods."]
                answer: "She went into the bears' house without asking."
                hints:
                  - "What did Goldilocks do that was rude?"
                  - "Which sentence shows bad manners?"
                  - "She went into the bears' house without asking."
              - id: l2-f3
                type: multiple_choice
                text: "Is 20 an even number? Which answer is justified?"
                options: ["Yes. I know this because it ends in 0, so it can be split into two equal groups.", "Yes.", "Yes, because I am good at maths."]
                answer: "Yes. I know this because it ends in 0, so it can be split into two equal groups."
                option_audio: false
                hints:
                  - "Which answer explains how you know?"
                  - "Look for I know this because."
                  - "The one about ending in 0."
              - id: l2-f4
                type: multiple_choice
                text: "Jay says, \"Cartoons are better than books.\" Which is the most polite way to disagree?"
                options: ["I see what you mean, but I disagree because books let you imagine the pictures.", "That's silly.", "No, you're wrong."]
                answer: "I see what you mean, but I disagree because books let you imagine the pictures."
                option_audio: false
                feedback:
                  "No, you're wrong.": "That disagrees, but it is not polite and gives no reason. Try: I see what you mean, but I disagree because ..."
                hints:
                  - "Which answer is kind and gives a reason?"
                  - "Look for because."
                  - "I see what you mean, but I disagree because books let you imagine the pictures."
              - id: l2-f5
                type: speak
                text: "Agree with this, and give a reason: \"We should have a class pet.\""
                say: "Your friend says: we should have a class pet. Agree, and give your reason. Then listen to an example."
                expected_text: "I agree with you because looking after a pet would teach us to be responsible."
                hints:
                  - "Start with: I agree with you because ..."
                  - "Why would a class pet be good?"
                  - "I agree with you because looking after a pet would teach us to be responsible."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"I think recycling is important because it saves materials.\" Which example makes it stronger?"
                options: ["For example, old bottles can be made into new ones.", "For example, I like the colour green.", "For example, bins."]
                answer: "For example, old bottles can be made into new ones."
                hints: ["Which example shows materials being saved?"]
              - id: l2-s2
                type: multiple_choice
                text: "Is a square a rectangle? Which answer is justified?"
                options: ["Yes. I know this because it has four right angles, like every rectangle.", "Yes, it just is.", "Yes, because my friend said so."]
                answer: "Yes. I know this because it has four right angles, like every rectangle."
                option_audio: false
                hints: ["Which answer explains how you know?"]
              - id: l2-s3
                type: multiple_choice
                text: "\"I think the wolf in Little Red Riding Hood is clever.\" Which is evidence from the story?"
                options: ["He dressed up as Grandma to trick Red Riding Hood.", "Wolves have grey fur.", "The story is old."]
                answer: "He dressed up as Grandma to trick Red Riding Hood."
                hints: ["What did the wolf do that was clever?"]
              - id: l2-s4
                type: multiple_choice
                text: "Ella says, \"We should not have homework.\" Which is the most polite way to disagree?"
                options: ["I disagree, because homework helps us practise what we learn.", "Don't be daft.", "Whatever."]
                answer: "I disagree, because homework helps us practise what we learn."
                option_audio: false
                hints: ["Polite, and with a reason."]
              - id: l2-s5
                type: speak
                text: "Say if you think children should help with cooking. Give a reason and an example."
                say: "Should children help with cooking? Give your opinion, a reason, and an example. Then listen to an example answer."
                expected_text: "I think children should help with cooking because it teaches them a useful skill. For example, they can learn to make a sandwich."
                hints: ["Opinion, because, then for example."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Put the answer in order: opinion, reason, example."
                say: "Put the three sentences in order: the opinion, the reason, then the example."
                options: ["For example, birds can get caught in plastic bags.", "Litter harms animals.", "I think we should keep the park tidy."]
                slot_count: 3
                answer: ["I think we should keep the park tidy.", "Litter harms animals.", "For example, birds can get caught in plastic bags."]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Which phrase starts an explanation of how you got an answer?"
                options: ["I know this because", "Once upon a time", "The end"]
                answer: "I know this because"
              - id: l2-n3
                type: multiple_choice
                text: "Two children want the class to visit the zoo. Who is more convincing?\nAmir: \"The zoo! The zoo! THE ZOO!\"\nLucy: \"The zoo, because we are learning about animals.\""
                say: "Read what Amir and Lucy say. Who is more convincing?"
                options: ["Lucy", "Amir"]
                answer: "Lucy"
              - id: l2-n4
                type: true_false
                text: "When you disagree, it is enough to say \"You're wrong.\""
                say: "Read it. Is it true?"
                answer: false
              - id: l2-n5
                type: speak
                text: "Disagree politely: \"Rainy days are boring.\""
                say: "Your friend says rainy days are boring. Disagree politely and give a reason. Then listen to an example."
                expected_text: "I see what you mean, but I disagree because you can splash in puddles and read indoors."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "\"I think we should walk to school...\" Which ending gives a real reason?"
            options: ["because it keeps us healthy.", "because we should walk.", "because walk."]
            answer: "because it keeps us healthy."
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence gives a reason that says something new?"
            options: ["I like spring because the days get longer.", "I like spring because I like spring.", "I like spring because it is my favourite."]
            answer: "I like spring because the days get longer."
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "Is 7 an odd number? Which answer is justified?"
            options: ["Yes. I know this because 7 cannot be split into two equal groups.", "Yes.", "Yes, because it looks odd."]
            answer: "Yes. I know this because 7 cannot be split into two equal groups."
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Ben says, \"Winter is the worst season.\" Which reply disagrees politely?"
            options: ["I see what you mean, but I disagree because snow is fun.", "You're wrong, Ben.", "Winter is the best. End of story."]
            answer: "I see what you mean, but I disagree because snow is fun."
            option_audio: false
          - id: l2-c5
            type: ordering
            text: "Put the answer in order: opinion, reason, example."
            say: "Put the three sentences in order: the opinion, the reason, then the example."
            options: ["For example, when the ground is frozen, they cannot dig for worms.", "I think we should build a bird table.", "Birds find it hard to find food in winter."]
            slot_count: 3
            answer: ["I think we should build a bird table.", "Birds find it hard to find food in winter.", "For example, when the ground is frozen, they cannot dig for worms."]
            option_audio: false
