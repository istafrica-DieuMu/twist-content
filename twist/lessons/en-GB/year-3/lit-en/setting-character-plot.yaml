# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.setting-character-plot
skill: lit-en.composition.setting-character-plot
curriculum: en-GB
language: en
title:
  de: Schauplatz, Figuren und Handlung erfinden
  en: Settings, characters and plot
summary: >
  Children learn the three building blocks of their own stories. Lesson
  1 takes settings, described with the senses so the reader can picture
  the place, and characters, shown through how they look, what they do
  and what they say. Lesson 2 takes plot on a story mountain: opening,
  build-up, problem, resolution and ending, and checks that each part
  follows from the one before; it ends with the skill check. Writing the
  child's own story waits for a free-writing task; the lessons practise
  choosing and ordering.
metadata:
  year: year-3
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.composition.narratives]
  also_practises: [lit-en.comprehension.inference-evidence]
  vocabulary: { en: [setting, character, plot, senses, describe, show not tell, story mountain, opening, build-up, problem, resolution, ending] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: setting-is-a-name
      what: Thinks naming a place (They went to the forest) is enough to set the scene
      addressed: Learn screen 1 of lesson 1; l1-f1, l1-s1, l1-n1 and l2-c1, with feedback in l1-f1
    - id: tell-not-show
      what: Tells the reader what a character is like (Tom was brave) instead of showing it through actions
      addressed: Learn screen 3 of lesson 1; l1-f4, l1-s4, l1-n4 and l2-c2, with feedback in l1-f4
    - id: no-problem-plot
      what: Writes a plot where nothing goes wrong, or where the problem is never solved
      addressed: Learn of lesson 2; l2-f1, l2-f3, l2-s3, l2-n3 and l2-c4, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Schauplatz und Figuren, en: Settings and characters }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is a story, not a set of instructions?"
            options: ["One stormy night, a cat knocked on Ellie's window.", "1. Fill the kettle.", "You will need: a spoon."]
            answer: "One stormy night, a cat knocked on Ellie's window."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "A story can be about something imagined, like a talking cat."
            say: "Read it. Is it true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The forest was dark. Twigs snapped under Zara's boots. The air smelt of damp leaves, and somewhere an owl hooted."
            say: "The setting is where and when a story happens. A good setting does more than name the place. It uses the senses: what you can see, hear, smell and feel."
          - text: "see: dark\nhear: twigs snapped, an owl hooted\nsmell: damp leaves"
            say: "Look how the writer uses three senses. Now the reader can picture the forest, and it feels a little spooky."
          - text: "Tell: Zara was brave.\nShow: Zara took a deep breath and stepped into the cave."
            say: "Characters are the people or animals in a story. Show the reader what they are like through what they do, say and look like. Show, do not just tell."
          - text: "Zara: curly black hair, muddy boots, always carries a torch"
            say: "Plan a few details for your main character: how they look, what they are like, and something special about them."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which sentence describes the setting best?"
                options: ["Waves crashed on the rocks, and the wind tasted of salt.", "They went to the beach.", "It was a place."]
                answer: "Waves crashed on the rocks, and the wind tasted of salt."
                option_audio: false
                feedback:
                  "They went to the beach.": "That names the place, but the reader cannot picture it. Add what you can see, hear, smell or taste."
                hints:
                  - "Which one lets you picture the place?"
                  - "Look for the senses."
                  - "Waves crashed on the rocks, and the wind tasted of salt."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"The market was noisy: traders shouted and pans clattered.\" Which sense does this use?"
                options: ["hearing", "smell", "touch"]
                answer: "hearing"
                hints:
                  - "Shouted and clattered: what do you use to notice them?"
                  - "Your ears."
                  - "Hearing."
              - id: l1-f3
                type: sorting
                text: "Which sense?"
                say: "Read each detail about a bakery. Which sense does it use?"
                option_audio: false
                bins:
                  - { id: see, show: { text: "see" }, say: "See." }
                  - { id: hear, show: { text: "hear" }, say: "Hear." }
                  - { id: smell, show: { text: "smell" }, say: "Smell." }
                options:
                  - { text: "golden loaves on the shelves", bin: see }
                  - { text: "the bell jingled on the door", bin: hear }
                  - { text: "warm, sweet cinnamon", bin: smell }
                hints:
                  - "Eyes, ears or nose?"
                  - "Golden is a colour; jingled is a sound."
                  - "Loaves: see; bell: hear; cinnamon: smell."
              - id: l1-f4
                type: multiple_choice
                text: "Which sentence shows that Kit is nervous, instead of telling us?"
                options: ["Kit chewed his lip and kept checking the door.", "Kit was nervous.", "Kit was a boy."]
                answer: "Kit chewed his lip and kept checking the door."
                option_audio: false
                feedback:
                  "Kit was nervous.": "That tells us. Show it through what Kit does, so the reader works it out."
                hints:
                  - "Which one has an action?"
                  - "What does a nervous person do?"
                  - "Kit chewed his lip and kept checking the door."
              - id: l1-f5
                type: multiple_choice
                text: "Which detail would make a character easy to remember?"
                options: ["She always wore one red sock and one blue sock.", "She had two feet.", "She was a girl."]
                answer: "She always wore one red sock and one blue sock."
                option_audio: false
                hints:
                  - "Which detail is special to her?"
                  - "Most people have two feet."
                  - "The odd socks."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which sentence describes the setting best?"
                options: ["Frost sparkled on the empty playground, and our breath made clouds.", "It was the playground.", "We were outside."]
                answer: "Frost sparkled on the empty playground, and our breath made clouds."
                option_audio: false
                hints: ["Which one uses the senses?"]
              - id: l1-s2
                type: multiple_choice
                text: "\"The old sofa was lumpy and scratchy.\" Which sense does this use?"
                options: ["touch", "taste", "hearing"]
                answer: "touch"
                hints: ["How would it feel to sit on?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which setting would suit a scary story?"
                options: ["a creaking attic lit by one flickering candle", "a sunny park full of ice cream vans", "a birthday party with balloons"]
                answer: "a creaking attic lit by one flickering candle"
                hints: ["Which place would make you feel uneasy?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which sentence shows that Gran is kind?"
                options: ["Gran wrapped her scarf round the shivering puppy.", "Gran was kind.", "Gran was old."]
                answer: "Gran wrapped her scarf round the shivering puppy."
                option_audio: false
                hints: ["Look for an action."]
              - id: l1-s5
                type: true_false
                text: "Characters can be shown through what they say, as well as what they do."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Think of how we learn about people in real life."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which sentence describes the setting best?"
                options: ["Neon signs buzzed, and the smell of hot chips drifted down the busy street.", "It was a town.", "The street was there."]
                answer: "Neon signs buzzed, and the smell of hot chips drifted down the busy street."
                option_audio: false
              - id: l1-n2
                type: sorting
                text: "Which sense?"
                say: "Read each detail about a farm. Which sense does it use?"
                option_audio: false
                bins:
                  - { id: see, show: { text: "see" }, say: "See." }
                  - { id: hear, show: { text: "hear" }, say: "Hear." }
                  - { id: smell, show: { text: "smell" }, say: "Smell." }
                options:
                  - { text: "a cockerel crowing", bin: hear }
                  - { text: "fresh-cut hay", bin: smell }
                  - { text: "a red tractor in the yard", bin: see }
              - id: l1-n3
                type: multiple_choice
                text: "Who are the characters in a story?"
                options: ["the people or animals in it", "the place where it happens", "the order of events"]
                answer: "the people or animals in it"
              - id: l1-n4
                type: multiple_choice
                text: "Which sentence shows that Raj is excited?"
                options: ["Raj bounced on his toes and couldn't stop grinning.", "Raj was excited.", "Raj had a coat."]
                answer: "Raj bounced on his toes and couldn't stop grinning."
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "\"They went to the castle\" is a rich description of a setting."
                say: "Read it. Is it true?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is the setting of a story?"
            options: ["where and when it happens", "who is in it", "how it ends"]
            answer: "where and when it happens"
          - id: l1-c2
            type: multiple_choice
            text: "\"The soup smelt of garlic and herbs.\" Which sense does this use?"
            options: ["smell", "sight", "hearing"]
            answer: "smell"
          - id: l1-c3
            type: multiple_choice
            text: "Which sentence shows that Amy is tired?"
            options: ["Amy yawned and rubbed her heavy eyes.", "Amy was tired.", "Amy was in Year 3."]
            answer: "Amy yawned and rubbed her heavy eyes."
            option_audio: false

  - n: 2
    title: { de: Die Handlung als Geschichtenberg, en: Plot on a story mountain }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which sentence describes the setting with the senses?"
            options: ["Rain drummed on the tent, and the grass smelt fresh.", "We were camping.", "It was a tent."]
            answer: "Rain drummed on the tent, and the grass smelt fresh."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which sentence shows a character, instead of telling?"
            options: ["Leo stamped his foot and folded his arms.", "Leo was cross.", "Leo was eight."]
            answer: "Leo stamped his foot and folded his arms."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "1 Opening: Ben and his dog Pip play by the river.\n2 Build-up: Pip chases a duck along the bank.\n3 Problem: Pip slips and falls into the fast water.\n4 Resolution: Ben holds out a long stick, and Pip grabs it.\n5 Ending: Back home, Pip dries off by the fire."
            say: "The plot is what happens in a story. Many stories follow a story mountain with five parts: the opening, the build-up, the problem at the top, the resolution, where the problem is solved, and the ending."
          - text: "The problem is the top of the mountain."
            say: "Every good plot needs a problem: something that goes wrong. Without it, nothing exciting happens. The resolution then solves it."
          - text: "Each part follows from the one before."
            say: "Check that each part leads to the next. Pip chases the duck, so he gets near the water, so he falls in. That makes the plot hang together."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Put the story mountain in order."
                say: "Put the five parts of the story in order: opening, build-up, problem, resolution, ending."
                options: ["Mia's kite gets stuck in a tall tree.", "Mia flies her new kite on a windy hill.", "Mia goes home, happy, with her kite.", "The wind grows stronger and pulls the kite higher.", "A park keeper fetches a ladder and gets it down."]
                slot_count: 5
                answer: ["Mia flies her new kite on a windy hill.", "The wind grows stronger and pulls the kite higher.", "Mia's kite gets stuck in a tall tree.", "A park keeper fetches a ladder and gets it down.", "Mia goes home, happy, with her kite."]
                option_audio: false
                hints:
                  - "Start with the opening: where Mia is and what she is doing."
                  - "The problem is the kite stuck in the tree; the ladder solves it."
                  - "Flies kite, wind grows, stuck, ladder, goes home."
              - id: l2-f2
                type: multiple_choice
                text: "In Ben and Pip's story, which part is the resolution?"
                options: ["Ben holds out a long stick, and Pip grabs it.", "Pip slips and falls into the fast water.", "Ben and his dog Pip play by the river."]
                answer: "Ben holds out a long stick, and Pip grabs it."
                option_audio: false
                hints:
                  - "The resolution solves the problem."
                  - "What gets Pip out of the water?"
                  - "Ben holds out a long stick."
              - id: l2-f3
                type: multiple_choice
                text: "Sam's plan: \"Sam goes to the zoo. He sees lions. He sees monkeys. He goes home.\" What is missing?"
                options: ["a problem", "a setting", "a character"]
                answer: "a problem"
                feedback:
                  "a setting": "The zoo is the setting, so that is there. What is missing is something that goes wrong."
                hints:
                  - "Does anything go wrong?"
                  - "The top of the story mountain is empty."
                  - "A problem."
              - id: l2-f4
                type: multiple_choice
                text: "Which problem would fit a story set at a school sports day?"
                options: ["Just before the race, Ava's trainer lace snaps.", "Ava eats breakfast.", "The sun is out."]
                answer: "Just before the race, Ava's trainer lace snaps."
                option_audio: false
                hints:
                  - "A problem is something that goes wrong."
                  - "Which one would worry Ava?"
                  - "Her trainer lace snaps."
              - id: l2-f5
                type: true_false
                text: "The resolution is where the problem is solved."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Think of Ben's long stick."
                  - "It solved the problem of Pip in the water."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Put the story mountain in order."
                say: "Put the five parts of the story in order: opening, build-up, problem, resolution, ending."
                options: ["The boat's engine stops in the middle of the lake.", "Grandad and Lucy set off in a little boat.", "They watch the sunset from the jetty.", "Lucy spots fish jumping and they head further out.", "They row all the way back to shore together."]
                slot_count: 5
                answer: ["Grandad and Lucy set off in a little boat.", "Lucy spots fish jumping and they head further out.", "The boat's engine stops in the middle of the lake.", "They row all the way back to shore together.", "They watch the sunset from the jetty."]
                option_audio: false
                hints: ["Find the problem first: what goes wrong?"]
              - id: l2-s2
                type: multiple_choice
                text: "Which part of a story mountain introduces the characters and setting?"
                options: ["the opening", "the problem", "the resolution"]
                answer: "the opening"
                hints: ["It comes first."]
              - id: l2-s3
                type: multiple_choice
                text: "Jo's plan: \"Jo loses her lucky coin. The end.\" What is missing?"
                options: ["a resolution", "a problem", "a character"]
                answer: "a resolution"
                hints: ["Is the problem ever solved?"]
              - id: l2-s4
                type: matching
                text: "Match each part with its job."
                say: "Match each part of the story mountain with its job."
                pairs:
                  - { left: { text: "opening" }, right: { text: "meets the characters and setting" } }
                  - { left: { text: "problem" }, right: { text: "something goes wrong" } }
                  - { left: { text: "resolution" }, right: { text: "the problem is solved" } }
                  - { left: { text: "ending" }, right: { text: "how things are at the end" } }
                hints: ["The problem is at the top of the mountain."]
              - id: l2-s5
                type: true_false
                text: "A plot where nothing goes wrong is usually the most exciting."
                say: "Read it. Is it true?"
                answer: false
                hints: ["What sits at the top of the mountain?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Put the story mountain in order."
                say: "Put the five parts of the story in order: opening, build-up, problem, resolution, ending."
                options: ["Snow blocks the cottage door.", "Tom and his sister stay at a cottage in the hills.", "They have hot chocolate and laugh about it.", "It snows all night long.", "They climb out of the window and dig a path."]
                slot_count: 5
                answer: ["Tom and his sister stay at a cottage in the hills.", "It snows all night long.", "Snow blocks the cottage door.", "They climb out of the window and dig a path.", "They have hot chocolate and laugh about it."]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Tom and his sister stay at a cottage in the hills. It snows all night long. Snow blocks the cottage door.\n\nWhich part is the build-up?"
                say: "Read the start of the story. Which part is the build-up?"
                options: ["It snows all night long.", "Snow blocks the cottage door.", "They have hot chocolate."]
                answer: "It snows all night long."
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Which resolution fits the problem \"The class hamster escapes\"?"
                options: ["The children find it asleep in a welly boot.", "The children go to lunch.", "It is a sunny day."]
                answer: "The children find it asleep in a welly boot."
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Which character fits a story set on a pirate ship?"
                options: ["a one-eyed captain with a squawking parrot", "a dinner lady", "a bus driver"]
                answer: "a one-eyed captain with a squawking parrot"
              - id: l2-n5
                type: true_false
                text: "Each part of a plot should follow from the part before."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which sentence describes the setting best?"
            options: ["Sand burned our feet, and gulls screeched over the bright blue sea.", "We were at the seaside.", "It was a beach day."]
            answer: "Sand burned our feet, and gulls screeched over the bright blue sea."
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence shows that Max is scared?"
            options: ["Max's knees shook as he backed away from the door.", "Max was scared.", "Max was tall."]
            answer: "Max's knees shook as he backed away from the door."
            option_audio: false
          - id: l2-c3
            type: ordering
            text: "Put the story mountain in order."
            say: "Put the five parts of the story in order: opening, build-up, problem, resolution, ending."
            options: ["A gust of wind blows the stall over.", "Priya and Dad set up a cake stall at the fair.", "They sell every cake and go home tired but happy.", "Lots of people queue for cakes.", "Everyone nearby helps to pick up the cakes and fix the stall."]
            slot_count: 5
            answer: ["Priya and Dad set up a cake stall at the fair.", "Lots of people queue for cakes.", "A gust of wind blows the stall over.", "Everyone nearby helps to pick up the cakes and fix the stall.", "They sell every cake and go home tired but happy."]
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which part of a story mountain is where something goes wrong?"
            options: ["the problem", "the opening", "the ending"]
            answer: "the problem"
          - id: l2-c5
            type: multiple_choice
            text: "\"The cave was cold and dripped with water.\" Which sense is the word cold about?"
            options: ["touch", "hearing", "taste"]
            answer: "touch"
