# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.rehearse-sentences
skill: lit-en.composition.rehearse-sentences
curriculum: en-GB
language: en
title:
  de: Sätze laut vorformulieren und abwechslungsreich schreiben
  en: Rehearsing sentences aloud
summary: >
  Writers say a sentence aloud, try it a few ways and pick the best
  before they write it. Lesson 1 rehearses sentences to choose richer
  vocabulary: precise verbs for went and said, exact adjectives for nice
  and good. Lesson 2 rehearses different sentence structures: changing
  the opener, joining short sentences with a conjunction, a short
  sentence for effect, and saying a line of dialogue in the voice of a
  character; it ends with the skill check. Saying sentences aloud and
  speaking dialogue in a character's voice are covered by Practise, where
  the child checks against a model; the skill check marks what a screen
  can mark: the choice of words, openers, conjunctions and short
  sentences.
metadata:
  year: year-3
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.composition.say-then-write]
  also_practises: [lit-en.grammar.time-cause]
  vocabulary: { en: [rehearse, sentence, vocabulary, precise verb, synonym, sentence opener, conjunction, dialogue, varied] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: precise-verb, what: { de: ein genaues Verb wählen (auch statt said), en: choosing a precise verb (also instead of said) } }
    - { id: rich-word, what: { de: "ein passendes, genaues Wort wählen", en: "choosing a rich word that fits the meaning" } }
    - { id: openers, what: { de: Satzanfänge abwechseln, en: varying sentence openers } }
    - { id: joining, what: { de: Sätze mit einer Konjunktion verbinden, en: joining sentences with a conjunction } }
    - { id: short-effect, what: { de: einen kurzen Satz für Spannung einsetzen, en: using a short sentence for effect } }
  misconceptions:
    - id: longer-is-better
      what: Thinks a better sentence is always a longer one, so piles on and ... and ...
      addressed: Learn screen 3 of lesson 2; l2-f3, l2-s3, l2-n3 and l2-c4, with feedback in l2-f3
    - id: same-opener
      what: Starts every sentence the same way (Then ..., I ...)
      addressed: Learn screen 1 of lesson 2; l2-f1, l2-s1, l2-n1 and l2-c3, with feedback in l2-f1
    - id: fancy-wrong-word
      what: Swaps in a long word that does not fit the meaning (the mouse thundered across the floor)
      addressed: Learn screen 3 of lesson 1; l1-f3, l1-s3, l1-n3 and l2-c2, with feedback in l1-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Bessere Wörter ausprobieren, en: Trying better words }
    goal:
      de: "Sag einen Satz laut und probier bessere Wörter aus, so wie trudged statt went für ein müdes Mädchen."
      en: "Say a sentence aloud and try better words, like trudged instead of went for a tired girl."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What do you do before you write a sentence?"
            options: ["Say it out loud.", "Write the last word first.", "Count the pages."]
            answer: "Say it out loud."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "After writing, you read your sentence back to check it."
            say: "Read it. Is it true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The dog went across the garden.\nIs the dog fast, slow or sneaky?"
            say: "Here is a first try at a sentence: the dog went across the garden. Can you tell how the dog moved? Fast, slow, or sneaky? Have a guess."
          - text: "The dog raced across the garden.\nThe dog crept across the garden.\nThe dog bounded across the garden."
            say: "You cannot tell! Went does not tell us much. Writers rehearse: they say a sentence aloud, try other words, and listen to which sounds best. Say it again with a precise verb. Raced, crept and bounded each paint a different picture. Choose the one that fits your story."
          - text: "The mouse thundered across the floor."
            say: "Careful: the word must fit. A tiny mouse does not thunder. Scampered or scurried would fit better. A rich word is one that is exactly right."
          - text: "said: whispered, shouted, muttered, replied\nnice: delicious, cosy, friendly\nbig: enormous, towering, vast"
            say: "Collect words like these. Saying them aloud helps you remember them when you write."
          - text: "Did you know? Thesaurus comes from a Greek word for treasure."
            say: "Did you know? A book of words that mean nearly the same is called a thesaurus. The word comes from an old Greek word for treasure, or a treasure house. A thesaurus is a treasure chest full of words to try!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"The girl went up the hill.\" Which verb shows she was tired?"
                options: ["trudged", "skipped", "zoomed"]
                answer: "trudged"
                hints:
                  - "Say each one in the sentence. How does it sound?"
                  - "Skipped and zoomed sound happy and fast."
                  - "Trudged."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"Shh, the baby is asleep,\" said Mum.\n\nWhich word fits better than said?"
                say: "Read the sentence. Which word fits better than said?"
                options: ["whispered", "shouted", "screamed"]
                answer: "whispered"
                hints:
                  - "Is Mum loud or quiet?"
                  - "The baby is asleep."
                  - "Whispered."
              - id: l1-f3
                type: multiple_choice
                text: "\"The kitten _ across the rug.\" Which verb fits?"
                options: ["pattered", "stomped", "thundered"]
                answer: "pattered"
                feedback:
                  "thundered": "Thundered is a strong word, but a tiny kitten does not thunder. Choose a word that fits a small, light animal."
                hints:
                  - "Is a kitten heavy or light?"
                  - "Stomp and thunder are for big, heavy things."
                  - "Pattered."
              - id: l1-f4
                type: speak
                text: "Say this sentence with a better word for nice: \"We had a nice meal.\""
                say: "Say the sentence again, with a better word for nice. Try it two ways and choose one. Then listen to an example."
                expected_text: "We had a delicious meal."
                hints:
                  - "What was nice about the meal?"
                  - "Think of a word about taste."
                  - "We had a delicious meal."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the dull word."
                say: "Tap the word that you could swap for a more precise one."
                show: { drawn: letter-card, text: "The giant was very big" }
                spans: ["big"]
                hints:
                  - "Which word tells us little?"
                  - "We already know giants are large."
                  - "big."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"The rocket went into the sky.\" Which verb fits best?"
                options: ["blasted", "tiptoed", "wandered"]
                answer: "blasted"
                hints: ["How does a rocket move?"]
              - id: l1-s2
                type: multiple_choice
                text: "\"Give that back!\" said Leo.\n\nWhich word fits better than said?"
                say: "Read the sentence. Which word fits better than said?"
                options: ["shouted", "whispered", "yawned"]
                answer: "shouted"
                hints: ["Leo is cross. How does he say it?"]
              - id: l1-s3
                type: multiple_choice
                text: "\"The snail _ along the path.\" Which verb fits?"
                options: ["crept", "sprinted", "dashed"]
                answer: "crept"
                feedback:
                  "sprinted": "A sprinting snail would win every race! But snails are very slow. Which verb is slow?"
                hints: ["How fast is a snail?"]
              - id: l1-s4
                type: matching
                text: "Match each plain word with a richer one."
                say: "Match each plain word with a richer word that means nearly the same."
                pairs:
                  - { left: { text: "big" }, right: { text: "enormous" } }
                  - { left: { text: "cold" }, right: { text: "freezing" } }
                  - { left: { text: "happy" }, right: { text: "delighted" } }
                hints: ["Say each pair aloud: does it mean nearly the same?"]
              - id: l1-s5
                type: speak
                text: "Say this sentence with a better verb: \"The horse went across the field.\""
                say: "Say the sentence again with a better verb for went. Then listen to an example."
                expected_text: "The horse galloped across the field."
                hints: ["How does a horse move fast?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"The thief went out of the window.\" Which verb shows he did not want to be heard?"
                options: ["slipped", "crashed", "bounced"]
                answer: "slipped"
              - id: l1-n2
                type: multiple_choice
                text: "\"I'm not sure,\" said Amy.\n\nWhich word fits better than said?"
                say: "Read the sentence. Which word fits better than said?"
                options: ["muttered", "roared", "cheered"]
                answer: "muttered"
              - id: l1-n3
                type: multiple_choice
                text: "\"The elephant _ through the jungle.\" Which verb fits?"
                options: ["stomped", "fluttered", "tiptoed"]
                answer: "stomped"
              - id: l1-n4
                type: highlight_in_text
                text: "Tap the dull word."
                say: "Tap the word that you could swap for a more precise one."
                show: { drawn: letter-card, text: "The cake tasted good" }
                spans: ["good"]
              - id: l1-n5
                type: true_false
                text: "A richer word is always the longest word you know."
                say: "Read it. Is it true?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"The leaf went to the ground.\" Which verb fits best?"
            options: ["drifted", "smashed", "marched"]
            answer: "drifted"
          - id: l1-c2
            type: multiple_choice
            text: "Why do writers say a sentence aloud before writing it?"
            options: ["to hear if it sounds right and try better words", "to make it longer", "so they can skip writing"]
            answer: "to hear if it sounds right and try better words"
          - id: l1-c3
            type: multiple_choice
            text: "Which word means very cold?"
            options: ["freezing", "warm", "damp"]
            answer: "freezing"
          - id: l1-c4
            type: multiple_choice
            text: "Which verb fits a lion that is angry?"
            options: ["roared", "purred", "squeaked"]
            answer: "roared"
          - id: l1-c5
            type: true_false
            text: "\"The feather crashed to the floor.\"\n\nIs it true? Crashed is a word that fits a feather."
            say: "Read the sentence. Is it true? Crashed is a word that fits a feather."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Which word is a richer way to say very tired?"
            options: ["exhausted", "excited", "curious"]
            answer: "exhausted"

  - n: 2
    title: { de: Satzbau abwechseln, en: Varying sentences }
    goal:
      de: "Wechsle deine Satzanfänge ab, verbinde kurze Sätze und setz einen ganz kurzen Satz ein, um Spannung zu machen."
      en: "Change how your sentences start, join short ones together, and use a very short sentence to build tension."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"The bee went from flower to flower.\" Which verb fits best?"
            options: ["buzzed", "stomped", "crashed"]
            answer: "buzzed"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which word could replace said for someone very quiet?"
            options: ["whispered", "bellowed", "yelled"]
            answer: "whispered"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Then we went to the beach. Then we had lunch. Then we swam.\nWhy does this sound dull?"
            say: "Read this aloud. Then we went to the beach. Then we had lunch. Then we swam. Why does it sound a bit dull? Have a guess."
          - text: "In the morning, we went to the beach. After lunch, we swam in the sea. Later, we built a sandcastle."
            say: "Every sentence started with then! Rehearse it aloud and change the openers. Different openers make writing more interesting: in the morning, after lunch, later. You can also join two short sentences with a conjunction: we were tired because we had swum all day."
          - text: "The door creaked open. Silence."
            say: "Longer is not always better. A very short sentence after a longer one can make the reader stop and feel the tension."
          - text: "\"Who's there?\" whispered Kit."
            say: "Rehearse dialogue, too. Say the words in the character's voice: scared, cross, excited. Then choose the verb that matches how they said it."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"Then we got on the bus. Then we went to the zoo.\" Which is the best way to start the second sentence?"
                options: ["After a short ride, we arrived at the zoo.", "Then we went to the zoo.", "Then then we went to the zoo."]
                answer: "After a short ride, we arrived at the zoo."
                option_audio: false
                feedback:
                  "Then we went to the zoo.": "That keeps the same opener as the sentence before. Try a different opener, such as after a short ride."
                hints:
                  - "Which one does not start with then?"
                  - "A new opener tells us when."
                  - "After a short ride, we arrived at the zoo."
              - id: l2-f2
                type: ordering
                text: "Build the sentence with a new opener."
                say: "Put the cards in order. Start with the time phrase."
                options: ["we heard a strange noise.", "In the middle of the night,"]
                slot_count: 2
                answer: ["In the middle of the night,", "we heard a strange noise."]
                option_audio: false
                hints:
                  - "Which card has a capital letter and a comma?"
                  - "The time phrase comes first."
                  - "In the middle of the night, we heard a strange noise."
              - id: l2-f3
                type: multiple_choice
                text: "Which sentences build tension best?"
                options: ["The stairs creaked. Something was coming.", "The stairs creaked and then something was coming and then it came up and it was there.", "Stairs."]
                answer: "The stairs creaked. Something was coming."
                option_audio: false
                feedback:
                  "The stairs creaked and then something was coming and then it came up and it was there.": "Longer is not always better. Lots of and then makes the reader lose the tension. Short sentences can feel scarier."
                hints:
                  - "Say each one aloud. Which makes you hold your breath?"
                  - "Short sentences can build suspense."
                  - "The stairs creaked. Something was coming."
              - id: l2-f4
                type: multiple_choice
                text: "Join the sentences: \"Ella was tired. She had run all the way home.\""
                options: ["Ella was tired because she had run all the way home.", "Ella was tired but she had run all the way home.", "Ella was tired or she had run all the way home."]
                answer: "Ella was tired because she had run all the way home."
                option_audio: false
                hints:
                  - "The second sentence gives a reason."
                  - "Which conjunction gives a reason?"
                  - "Because."
              - id: l2-f5
                type: speak
                text: "Say Kit's line in a scared voice: \"Who's there?\""
                say: "Kit is alone in a dark house. Say his line in a scared voice: Who's there? Then listen to an example."
                expected_text: "Who's there?"
                hints:
                  - "Think how Kit feels."
                  - "Scared voices are quiet and shaky."
                  - "Whisper it: Who's there?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"I went to the park. I played football. I went home.\" Which is the best rewrite of the second sentence?"
                options: ["At the park, I played football with my friends.", "I played football.", "I I played football."]
                answer: "At the park, I played football with my friends."
                option_audio: false
                hints: ["Change the opener so it is not I again."]
              - id: l2-s2
                type: ordering
                text: "Build the sentence with a new opener."
                say: "Put the cards in order. Start with the opener."
                options: ["the fox crept towards the hens.", "Silently,"]
                slot_count: 2
                answer: ["Silently,", "the fox crept towards the hens."]
                option_audio: false
                hints: ["The opener has the capital letter."]
              - id: l2-s3
                type: multiple_choice
                text: "After a long sentence about a storm, which short sentence makes the reader stop?"
                options: ["Then the lights went out.", "Then the lights went out and the wind was loud and the rain was heavy and it was dark.", "Lights."]
                answer: "Then the lights went out."
                option_audio: false
                hints: ["Short, but still a full sentence."]
              - id: l2-s4
                type: multiple_choice
                text: "Join the sentences: \"We wanted to play outside. It was raining.\""
                options: ["We wanted to play outside, but it was raining.", "We wanted to play outside because it was raining.", "We wanted to play outside so it was raining."]
                answer: "We wanted to play outside, but it was raining."
                option_audio: false
                hints: ["The second part goes against the first."]
              - id: l2-s5
                type: speak
                text: "Say the dragon's line in a booming voice: \"Who dares to wake me?\""
                say: "The dragon is angry. Say its line in a big, booming voice: Who dares to wake me? Then listen to an example."
                expected_text: "Who dares to wake me?"
                hints: ["Slow, loud and deep."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"Then the bell rang. Then we lined up.\" Which is the best way to start the second sentence?"
                options: ["As soon as it rang, we lined up.", "Then we lined up.", "Then, then we lined up."]
                answer: "As soon as it rang, we lined up."
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Join the sentences: \"Sam was hungry. He made a sandwich.\""
                options: ["Sam was hungry, so he made a sandwich.", "Sam was hungry, but he made a sandwich.", "Sam was hungry or he made a sandwich."]
                answer: "Sam was hungry, so he made a sandwich."
                option_audio: false
              - id: l2-n3
                type: true_false
                text: "A very short sentence can make a story more exciting."
                say: "Read it. Is it true?"
                answer: true
              - id: l2-n4
                type: ordering
                text: "Build the sentence with a new opener."
                say: "Put the cards in order. Start with the opener."
                options: ["the children ran into the hall.", "As the music started,"]
                slot_count: 2
                answer: ["As the music started,", "the children ran into the hall."]
                option_audio: false
              - id: l2-n5
                type: speak
                text: "Say the line in an excited voice: \"We won the cup!\""
                say: "Mia's team has just won. Say her line in an excited voice: We won the cup! Then listen to an example."
                expected_text: "We won the cup!"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: precise-verb
            type: multiple_choice
            text: "\"The car went down the road.\" Which verb shows it was very fast?"
            options: ["sped", "crawled", "strolled"]
            answer: "sped"
          - id: l2-c2
            part: precise-verb
            type: multiple_choice
            text: "\"The butterfly _ over the flowers.\" Which verb fits?"
            options: ["fluttered", "stamped", "thundered"]
            answer: "fluttered"
          - id: l2-c3
            part: openers
            type: multiple_choice
            text: "\"I opened the box. I saw a puppy.\" Which is the best rewrite of the second sentence?"
            options: ["Inside, curled up asleep, was a puppy.", "I saw a puppy.", "I I saw a puppy."]
            answer: "Inside, curled up asleep, was a puppy."
            option_audio: false
          - id: l2-c4
            part: short-effect
            type: multiple_choice
            text: "Which sentences build suspense best?"
            options: ["The handle turned. The door opened.", "The handle turned and then the door opened and then it was open and then someone came in.", "Handle."]
            answer: "The handle turned. The door opened."
            option_audio: false
          - id: l2-c5
            part: joining
            type: multiple_choice
            text: "Join the sentences: \"The plant died. Nobody watered it.\""
            options: ["The plant died because nobody watered it.", "The plant died but nobody watered it.", "The plant died or nobody watered it."]
            answer: "The plant died because nobody watered it."
            option_audio: false
          - id: l2-c6
            part: precise-verb
            type: multiple_choice
            text: "\"Watch out!\" _ Dad, as the ball flew towards the window.\n\nWhich verb fits best?"
            say: "Read the sentence. Which verb fits best in the gap?"
            options: ["yelled", "murmured", "sighed"]
            answer: "yelled"
          - id: l2-c7
            part: precise-verb
            type: matching
            text: "Match each verb with the animal it fits."
            say: "Match each verb with the animal that moves like that."
            pairs:
              - { left: { text: "slithered" }, right: { text: "a snake" } }
              - { left: { text: "waddled" }, right: { text: "a duck" } }
              - { left: { text: "galloped" }, right: { text: "a horse" } }
          - id: l2-c8
            part: rich-word
            type: multiple_choice
            text: "\"It was a nice day for a picnic.\" Which word could replace nice?"
            options: ["sunny", "delicious", "noisy"]
            answer: "sunny"
          - id: l2-c9
            part: rich-word
            type: multiple_choice
            text: "Which word best describes a castle that is hundreds of years old?"
            options: ["ancient", "modern", "fluffy"]
            answer: "ancient"
          - id: l2-c10
            part: rich-word
            type: true_false
            text: "\"An ordinary garden ant crawled up the wall.\"\n\nIs it true? Enormous is a good word to describe this ant."
            say: "Read the sentence. Is it true? Enormous is a good word to describe this ant."
            answer: false
          - id: l2-c11
            part: rich-word
            type: sorting
            text: "Sort the verbs: which fit a gentle breeze, and which fit a wild storm?"
            say: "Read each verb about the wind. Does it fit a gentle breeze, or a wild storm?"
            option_audio: false
            bins:
              - { id: breeze, show: { text: "a gentle breeze" }, say: "A gentle breeze." }
              - { id: storm, show: { text: "a wild storm" }, say: "A wild storm." }
            options:
              - { text: "whispered", bin: breeze }
              - { text: "sighed", bin: breeze }
              - { text: "howled", bin: storm }
              - { text: "roared", bin: storm }
          - id: l2-c12
            part: openers
            type: multiple_choice
            text: "\"I got up. I brushed my teeth. I ate my toast.\"\n\nWhich rewrite has the most varied openers?"
            say: "Read the sentences. Which rewrite has the most varied openers?"
            options: ["First, I got up. After brushing my teeth, I ate my toast.", "I got up. I brushed my teeth. I ate my toast.", "Then I got up. Then I brushed my teeth. Then I ate my toast."]
            answer: "First, I got up. After brushing my teeth, I ate my toast."
            option_audio: false
          - id: l2-c13
            part: openers
            type: true_false
            text: "\"Then we ran. Then we hid. Then we waited.\"\n\nIs it true? These sentences have varied openers."
            say: "Read the sentences. Is it true? These sentences have varied openers."
            answer: false
          - id: l2-c14
            part: openers
            type: fill_in_blank
            text: "\"Then the fireworks lit up the sky.\"\n\nWhich opener makes the sentence more interesting?"
            say: "Read the sentence. Which opener makes it more interesting?"
            frame: "_ the fireworks lit up the sky."
            options: ["As darkness fell,", "Then", "And then"]
            answer: ["As darkness fell,"]
            option_audio: false
          - id: l2-c15
            part: joining
            type: fill_in_blank
            text: "Which conjunction joins the sentence best?"
            say: "Which conjunction fits? It was freezing outside, blank Ali wore his woolly hat."
            frame: "It was freezing outside, _ Ali wore his woolly hat."
            options: ["so", "but", "or"]
            answer: ["so"]
          - id: l2-c16
            part: joining
            type: fill_in_blank
            text: "Which conjunction joins the sentence best?"
            say: "Which conjunction fits? I wanted to stay up late, blank Mum said it was bedtime."
            frame: "I wanted to stay up late, _ Mum said it was bedtime."
            options: ["but", "because", "so"]
            answer: ["but"]
          - id: l2-c17
            part: joining
            type: multiple_choice
            text: "Join the two sentences: \"We can play in the park. We finish our homework first.\""
            options: ["We can play in the park after we finish our homework.", "We can play in the park but we finish our homework.", "We can play in the park or we finish our homework."]
            answer: "We can play in the park after we finish our homework."
            option_audio: false
          - id: l2-c18
            part: short-effect
            type: true_false
            text: "Gran opened the old wooden chest, lifted out the dusty blankets one by one and peered inside. Empty.\n\nIs it true? The short sentence \"Empty.\" makes the reader stop and notice."
            say: "Read the sentences. Is it true? The short sentence, empty, makes the reader stop and notice."
