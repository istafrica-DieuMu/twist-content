# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.prefixes-suffixes-ks2
skill: lit-en.spelling.prefixes-suffixes-ks2
curriculum: en-GB
language: en
title:
  de: Weitere Vorsilben und Nachsilben schreiben
  en: Spelling with more prefixes and suffixes
summary: >
  Spelling longer words by adding prefixes and suffixes, as in the Years
  3 and 4 spelling appendix. Lesson 1 takes the prefixes dis-, mis-, re-,
  sub- and inter-, what each means, and the rule that a prefix never
  changes the root word (misspell, dissatisfied). Lesson 2 takes -ation
  (adore, adoration) and -ous (fame, famous; vary, various). Lesson 3
  takes the endings that sound like "shun": -tion after t or te, -ssion
  after ss or mit, -sion after d or se, and -cian for people from words
  ending in c (music, musician); it ends with the skill check. Spelling
  from memory uses the letter keyboard.
metadata:
  year: year-3
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.spelling.suffixes-y2]
  also_practises: [lit-en.word-reading.morphology]
  vocabulary: { en: [prefix, suffix, root word, dis-, mis-, re-, sub-, inter-, -ation, -ous, -tion, -sion, -ssion, -cian] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: prefix-meaning, what: { de: "wissen, was dis-, mis-, re-, sub- und inter- bedeuten", en: "knowing what dis-, mis-, re-, sub- and inter- mean" } }
    - { id: prefix-spelling, what: { de: Wörter mit Vorsilbe schreiben, en: spelling words with a prefix } }
    - { id: ation-ous, what: { de: "-ation und -ous anhängen", en: adding -ation and -ous } }
    - { id: shun, what: { de: "-tion, -sion, -ssion oder -cian wählen", en: "choosing -tion, -sion, -ssion or -cian" } }
  misconceptions:
    - id: prefix-drops-letter
      what: Drops a letter where prefix and root meet (mispell, disatisfied)
      addressed: Learn screen 3 of lesson 1; l1-f4, l1-s4, l1-n4 and l3-c2, with feedback in l1-f4
    - id: shun-one-spelling
      what: Spells every "shun" ending as -tion (musition, expantion, discustion)
      addressed: Learn of lesson 3; l3-f1, l3-f2, l3-f4, l3-s2, l3-n2, l3-c3 and l3-c4, with feedback in l3-f2 and l3-f4
    - id: keep-final-e
      what: Keeps the e or y of the root before -ous or -ation (fameous, adoreation, varyous)
      addressed: Learn of lesson 2; l2-f2, l2-f4, l2-s2, l2-n2 and l3-c5, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Vorsilben: dis-, mis-, re-, sub-, inter-", en: "Prefixes: dis-, mis-, re-, sub-, inter-" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Add -ful to hope."
            options: ["hopeful", "hopefull", "hopful"]
            answer: "hopeful"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Add -ness to happy."
            options: ["happiness", "happyness", "hapiness"]
            answer: "happiness"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "dis + agree = disagree\nmis + behave = misbehave\nre + build = rebuild"
            say: "A prefix is a group of letters added to the start of a root word. It changes the meaning. Dis means not, or the opposite. Mis means wrongly. Re means again, or back."
          - text: "sub + marine = submarine\ninter + national = international"
            say: "Sub means under or below: a submarine goes under the sea. Inter means between: an international match is between two nations."
          - text: "mis + spell = misspell\ndis + satisfied = dissatisfied"
            say: "The rule: a prefix never changes the spelling of the root word. Just add it on. So misspell has two s letters: one from mis, one from spell."
          - text: "re + appear = reappear"
            say: "Even when two vowels meet, keep every letter. Re plus appear is reappear."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What does the prefix re- mean in rebuild?"
                options: ["again", "not", "under"]
                answer: "again"
                hints:
                  - "If you rebuild a wall, what do you do?"
                  - "You build it a second time."
                  - "Again."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Match each prefix with its meaning."
                say: "Match each prefix with what it means."
                pairs:
                  - { left: { text: "dis-" }, right: { text: "not, the opposite" } }
                  - { left: { text: "mis-" }, right: { text: "wrongly" } }
                  - { left: { text: "sub-" }, right: { text: "under" } }
                  - { left: { text: "inter-" }, right: { text: "between" } }
                hints:
                  - "Think of a word with each prefix."
                  - "Disagree, misbehave, submarine, international."
                  - "dis: not; mis: wrongly; sub: under; inter: between."
              - id: l1-f3
                type: fill_in_blank
                text: "Which prefix makes the opposite of obey?"
                frame: "_obey"
                options: ["dis", "sub", "inter"]
                answer: ["dis"]
                hints:
                  - "Which prefix means not, or the opposite?"
                  - "If you do not obey, you ..."
                  - "dis: disobey."
              - id: l1-f4
                type: multiple_choice
                text: "Add mis- to spell."
                options: ["misspell", "mispell", "misspel"]
                answer: "misspell"
                option_audio: false
                feedback:
                  "mispell": "The prefix does not change the root word. Mis ends in s and spell starts with s, so you keep both: misspell."
                hints:
                  - "Write mis, then write spell. Change nothing."
                  - "Count the s letters: one in mis, one in spell."
                  - "misspell."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the prefix."
                say: "The word is split into parts. Tap the prefix."
                show: { drawn: letter-card, text: "inter city" }
                spans: ["inter"]
                hints:
                  - "A prefix comes at the start."
                  - "Which part means between?"
                  - "inter."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Subtitles are ..."
                options: ["words shown under the picture on a screen", "titles that are wrong", "titles written again"]
                answer: "words shown under the picture on a screen"
                hints: ["Sub means under."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which prefix fits? \"Oops, I _understood the question.\""
                say: "Which prefix fits the sentence? Oops, I blank understood the question."
                frame: "Oops, I _understood the question."
                options: ["mis", "re", "inter"]
                answer: ["mis"]
                hints: ["Which prefix means wrongly?"]
              - id: l1-s3
                type: text_input
                keyboard: letters
                text: "Write the word you hear.\nThe magician made the rabbit ________."
                say: "Write the word reappear. The magician made the rabbit reappear."
                answer: "reappear"
                hints: ["re plus appear: keep every letter."]
              - id: l1-s4
                type: multiple_choice
                text: "Add dis- to satisfied."
                options: ["dissatisfied", "disatisfied", "dissatisfyed"]
                answer: "dissatisfied"
                option_audio: false
                hints: ["dis plus satisfied: change nothing."]
              - id: l1-s5
                type: sorting
                text: "Sort the words by prefix meaning."
                say: "Read each word. Does its prefix mean again, or not?"
                option_audio: false
                bins:
                  - { id: again, show: { text: "again (re-)" }, say: "Again." }
                  - { id: not, show: { text: "not (dis-)" }, say: "Not." }
                options:
                  - { text: "redo", bin: again }
                  - { text: "refill", bin: again }
                  - { text: "dislike", bin: not }
                  - { text: "dishonest", bin: not }
                hints: ["Look at the first letters of each word."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What does sub- mean in submerge?"
                options: ["under", "again", "wrongly"]
                answer: "under"
              - id: l1-n2
                type: text_input
                keyboard: letters
                text: "Write the word you hear.\nThe sun began to ________ behind the clouds."
                say: "Write the word disappear. The sun began to disappear behind the clouds."
                answer: "disappear"
              - id: l1-n3
                type: fill_in_blank
                text: "Which prefix fits? \"The children _act with the robot by talking to it.\""
                say: "Which prefix fits the sentence? The children blank act with the robot by talking to it."
                frame: "The children _act with the robot by talking to it."
                options: ["inter", "sub", "mis"]
                answer: ["inter"]
              - id: l1-n4
                type: multiple_choice
                text: "Add dis- to similar."
                options: ["dissimilar", "disimilar", "dissimiler"]
                answer: "dissimilar"
                option_audio: false
              - id: l1-n5
                type: text_input
                keyboard: letters
                text: "Write the word you hear.\nPlease do not ________ on the school trip."
                say: "Write the word misbehave. Please do not misbehave on the school trip."
                answer: "misbehave"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What does mis- mean in mislead?"
            options: ["wrongly", "again", "between"]
            answer: "wrongly"
          - id: l1-c2
            type: text_input
            keyboard: letters
            text: "Write the word you hear.\nI ________ with you."
            say: "Write the word disagree. I disagree with you."
            answer: "disagree"
          - id: l1-c3
            type: fill_in_blank
            text: "Which prefix fits? \"We had to _write our story in neat.\""
            say: "Which prefix fits the sentence? We had to blank write our story in neat."
            frame: "We had to _write our story in neat."
            options: ["re", "dis", "sub"]
            answer: ["re"]
          - id: l1-c4
            type: multiple_choice
            text: "What does re- mean in replay?"
            options: ["again", "not", "under"]
            answer: "again"
          - id: l1-c5
            type: text_input
            keyboard: letters
            text: "Write the word you hear.\nPlease ________ your story before you hand it in."
            say: "Write the word reread. Please reread your story before you hand it in."
            answer: "reread"
          - id: l1-c6
            type: multiple_choice
            text: "Add mis- to take."
            options: ["mistake", "misstake", "mistak"]
            answer: "mistake"
            option_audio: false

  - n: 2
    title: { de: "Nachsilben: -ation und -ous", en: "Suffixes: -ation and -ous" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Add re- to fill."
            options: ["refill", "reefill", "rfill"]
            answer: "refill"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What does inter- mean?"
            options: ["between", "under", "again"]
            answer: "between"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "inform + ation = information\nsense + ation = sensation\nadore + ation = adoration"
            say: "The suffix ation turns a verb into a noun. If the root word ends in e, drop the e first: adore becomes adoration."
          - text: "danger + ous = dangerous\npoison + ous = poisonous"
            say: "The suffix ous turns a noun into an adjective. It means full of: dangerous means full of danger."
          - text: "fame + ous = famous\nvary + ous = various\ncourage + ous = courageous"
            say: "Watch the end of the root word. Drop a final e: famous. Change y to i: various. But keep the e after g, so it still sounds soft: courageous."
          - text: "humour + ous = humorous"
            say: "One tricky one: humour drops its u before ous, so humorous is h, u, m, o, r, o, u, s."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Add -ation to inform."
                options: ["information", "informtion", "informasion"]
                answer: "information"
                option_audio: false
                hints:
                  - "Write inform, then add ation."
                  - "inform ends in m, so nothing changes."
                  - "information."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Add -ous to fame."
                options: ["famous", "fameous", "famus"]
                answer: "famous"
                option_audio: false
                feedback:
                  "fameous": "Fame ends in e. Drop the e before you add ous: famous."
                hints:
                  - "Does fame end in e?"
                  - "Drop the e, then add ous."
                  - "famous."
              - id: l2-f3
                type: multiple_choice
                text: "What does dangerous mean?"
                options: ["full of danger", "without danger", "danger again"]
                answer: "full of danger"
                hints:
                  - "What does the suffix ous mean?"
                  - "Poisonous means full of poison."
                  - "Full of danger."
              - id: l2-f4
                type: multiple_choice
                text: "Add -ation to prepare."
                options: ["preparation", "prepareation", "preparetion"]
                answer: "preparation"
                option_audio: false
                hints:
                  - "Does prepare end in e?"
                  - "Drop the e, then add ation."
                  - "preparation."
              - id: l2-f5
                type: fill_in_blank
                text: "Finish the word: vary + ous"
                frame: "var_ous"
                options: ["i", "y", "e"]
                answer: ["i"]
                hints:
                  - "vary ends in y."
                  - "Change the y to i before ous."
                  - "i: various."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                keyboard: letters
                text: "Write the word you hear.\nSome mushrooms are ________."
                say: "Write the word poisonous. Some mushrooms are poisonous."
                answer: "poisonous"
                hints: ["poison plus ous: nothing changes."]
              - id: l2-s2
                type: multiple_choice
                text: "Add -ation to admire."
                options: ["admiration", "admireation", "admirasion"]
                answer: "admiration"
                option_audio: false
                hints: ["Drop the e first."]
              - id: l2-s3
                type: multiple_choice
                text: "Add -ous to courage."
                options: ["courageous", "couragous", "couragious"]
                answer: "courageous"
                option_audio: false
                hints: ["Keep the e after g, so the g stays soft."]
              - id: l2-s4
                type: sorting
                text: "Sort the words by suffix."
                say: "Read each word. Does it end in ation or in ous?"
                option_audio: false
                bins:
                  - { id: ation, show: { text: "-ation" }, say: "ation." }
                  - { id: ous, show: { text: "-ous" }, say: "ous." }
                options:
                  - { text: "sensation", bin: ation }
                  - { text: "mountainous", bin: ous }
                  - { text: "adoration", bin: ation }
                  - { text: "famous", bin: ous }
                hints: ["Look at the last letters of each word."]
              - id: l2-s5
                type: multiple_choice
                text: "Which word is spelt correctly?"
                options: ["humorous", "humourous", "humerous"]
                answer: "humorous"
                option_audio: false
                hints: ["humour drops its u before ous."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                keyboard: letters
                text: "Write the word you hear.\nThe cliff edge is ________."
                say: "Write the word dangerous. The cliff edge is dangerous."
                answer: "dangerous"
              - id: l2-n2
                type: multiple_choice
                text: "Add -ation to sense."
                options: ["sensation", "senseation", "sensetion"]
                answer: "sensation"
                option_audio: false
              - id: l2-n3
                type: text_input
                keyboard: letters
                text: "Write the word you hear.\nThe shop sells ________ kinds of bread."
                say: "Write the word various. The shop sells various kinds of bread."
                answer: "various"
              - id: l2-n4
                type: fill_in_blank
                text: "Which suffix fits? \"The rocky land was very mountain_.\""
                say: "Which suffix fits the sentence? The rocky land was very mountain blank."
                frame: "The rocky land was very mountain_."
                options: ["ous", "ation", "ful"]
                answer: ["ous"]
              - id: l2-n5
                type: highlight_in_text
                text: "Tap the suffix."
                say: "The word is split into parts. Tap the suffix."
                show: { drawn: letter-card, text: "inform ation" }
                spans: ["ation"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Add -ous to joy."
            options: ["joyous", "joyious", "joious"]
            answer: "joyous"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Add -ation to adore."
            options: ["adoration", "adoreation", "adorasion"]
            answer: "adoration"
            option_audio: false
          - id: l2-c3
            type: text_input
            keyboard: letters
            text: "Write the word you hear.\nShe is a ________ singer."
            say: "Write the word famous. She is a famous singer."
            answer: "famous"
          - id: l2-c4
            type: multiple_choice
            text: "Add -ation to imagine."
            options: ["imagination", "imagineation", "imaginasion"]
            answer: "imagination"
            option_audio: false
          - id: l2-c5
            type: text_input
            keyboard: letters
            text: "Write the word you hear.\nMy little brother is ________ of my new bike."
            say: "Write the word envious. My little brother is envious of my new bike."
            answer: "envious"
          - id: l2-c6
            type: multiple_choice
            text: "What does the suffix -ous mean?"
            options: ["full of", "again", "not"]
            answer: "full of"

  - n: 3
    title: { de: "Die Endungen -tion, -sion, -ssion und -cian", en: "The endings -tion, -sion, -ssion and -cian" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Add -ous to poison."
            options: ["poisonous", "poisonus", "poisonnous"]
            answer: "poisonous"
            option_audio: false
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "Before -ous or -ation, what happens to a final e?"
            options: ["It is dropped.", "It is doubled.", "It changes to y."]
            answer: "It is dropped."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "invent + ion = invention\ninject + ion = injection\ncomplete + ion = completion"
            say: "Lots of endings sound like shun. Look at the root word to choose the spelling. If it ends in t or te, the word ends in tion: keep the t, drop a final e, and add ion."
          - text: "express + ion = expression\ndiscuss + ion = discussion\npermit + ssion = permission"
            say: "If the root ends in ss, or in mit, use ssion. Permit drops its t: permission."
          - text: "expand + sion = expansion\nextend + sion = extension\ntense + sion = tension"
            say: "If the root ends in d or se, use sion. The d or the se is dropped: extend, extension."
          - text: "music + ian = musician\nmagic + ian = magician\nelectric + ian = electrician"
            say: "If the root ends in c, add ian, so it ends cian. These words are usually people: a musician plays music."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Add the shun ending to invent."
                options: ["invention", "invension", "inventian"]
                answer: "invention"
                option_audio: false
                hints:
                  - "What letter does invent end in?"
                  - "Root words ending in t take tion."
                  - "invention."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "A person who plays music is a ..."
                options: ["musician", "musition", "musicsion"]
                answer: "musician"
                option_audio: false
                feedback:
                  "musition": "Music ends in c, and people from c words end in cian: musician. The c stays."
                hints:
                  - "What letter does music end in?"
                  - "Root words ending in c take ian."
                  - "musician."
              - id: l3-f3
                type: multiple_choice
                text: "Add the shun ending to discuss."
                options: ["discussion", "discustion", "discusion"]
                answer: "discussion"
                option_audio: false
                hints:
                  - "discuss ends in ss."
                  - "Keep the ss and add ion."
                  - "discussion."
              - id: l3-f4
                type: multiple_choice
                text: "Add the shun ending to extend."
                options: ["extension", "extention", "extendtion"]
                answer: "extension"
                option_audio: false
                feedback:
                  "extention": "Extend ends in d. Root words ending in d take sion, and the d is dropped: extension."
                hints:
                  - "What letter does extend end in?"
                  - "Root words ending in d take sion."
                  - "extension."
              - id: l3-f5
                type: sorting
                text: "Sort the words by their shun ending."
                say: "Read each root word. Which shun ending will it take?"
                option_audio: false
                bins:
                  - { id: tion, show: { text: "-tion" }, say: "t, i, o, n." }
                  - { id: sion, show: { text: "-sion" }, say: "s, i, o, n." }
                  - { id: cian, show: { text: "-cian" }, say: "c, i, a, n." }
                options:
                  - { text: "act", bin: tion }
                  - { text: "expand", bin: sion }
                  - { text: "magic", bin: cian }
                  - { text: "inject", bin: tion }
                  - { text: "tense", bin: sion }
                hints:
                  - "Look at the last letters of each root word."
                  - "t: tion; d or se: sion; c: cian."
                  - "act and inject: tion; expand and tense: sion; magic: cian."

          - support: some
            tasks:
              - id: l3-s1
                type: text_input
                keyboard: letters
                text: "Write the word you hear.\nThe film was full of ________."
                say: "Write the word action. The film was full of action."
                answer: "action"
                hints: ["act ends in t, so add ion."]
              - id: l3-s2
                type: multiple_choice
                text: "Someone who fixes electric wires is an ..."
                options: ["electrician", "electrition", "electricion"]
                answer: "electrician"
                option_audio: false
                hints: ["electric ends in c."]
              - id: l3-s3
                type: multiple_choice
                text: "Add the shun ending to permit."
                options: ["permission", "permition", "permitsion"]
                answer: "permission"
                option_audio: false
                hints: ["Words ending in mit take ssion."]
              - id: l3-s4
                type: fill_in_blank
                text: "Finish the word: express + ion"
                frame: "expre_ion"
                options: ["ss", "s", "t"]
                answer: ["ss"]
                hints: ["Keep both s letters from express."]
              - id: l3-s5
                type: multiple_choice
                text: "Add the shun ending to complete."
                options: ["completion", "completesion", "complecian"]
                answer: "completion"
                option_audio: false
                hints: ["complete ends in te: drop the e, add ion."]

          - support: none
            tasks:
              - id: l3-n1
                type: text_input
                keyboard: letters
                text: "Write the word you hear.\nThe ________ pulled a rabbit out of a hat."
                say: "Write the word magician. The magician pulled a rabbit out of a hat."
                answer: "magician"
              - id: l3-n2
                type: multiple_choice
                text: "Add the shun ending to expand."
                options: ["expansion", "expantion", "expandtion"]
                answer: "expansion"
                option_audio: false
              - id: l3-n3
                type: text_input
                keyboard: letters
                text: "Write the word you hear.\nThe nurse gave me an ________."
                say: "Write the word injection. The nurse gave me an injection."
                answer: "injection"
              - id: l3-n4
