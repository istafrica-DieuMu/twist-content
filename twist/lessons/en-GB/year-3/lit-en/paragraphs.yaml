# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.paragraphs
skill: lit-en.composition.paragraphs
curriculum: en-GB
language: en
title:
  de: In Absätzen schreiben
  en: Writing in paragraphs
summary: >
  A paragraph is a group of sentences about one theme. Lesson 1 finds
  the theme of a paragraph, the sentence that introduces it, and the
  sentence that does not belong, in a short report about hedgehogs.
  Lesson 2 decides when to start a new paragraph: a new time, a new
  place, a new topic or a new person (TiPToP), groups sentences into
  paragraphs and puts paragraphs in order in a story and a report; it
  ends with the skill check. Laying out the child's own paragraphs waits
  for a free-writing task.
metadata:
  year: year-3
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.composition.narratives]
  also_practises: [lit-en.composition.headings]
  vocabulary: { en: [paragraph, theme, topic sentence, indent, new line, time, place, topic, person, TiPToP] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: paragraph-by-length
      what: Starts a new paragraph after a set number of lines, not when the theme changes
      addressed: Learn screen 2 of lesson 2; l2-f1, l2-f5, l2-s1, l2-n4 and l2-c4, with feedback in l2-f1
    - id: off-theme-sentence
      what: Leaves a sentence about a different topic inside a paragraph
      addressed: Learn screen 3 of lesson 1; l1-f3, l1-s3, l1-n3 and l2-c2, with feedback in l1-f3
    - id: no-paragraph-in-stories
      what: Thinks paragraphs are only for information writing, and writes a story as one block
      addressed: Learn screen 3 of lesson 2; l2-f2, l2-s2 and l2-n1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ein Absatz, ein Thema", en: "One paragraph, one theme" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is the best way to start a story?"
            options: ["One snowy morning, Zac found a strange egg in the garden.", "The end.", "And then he went home."]
            answer: "One snowy morning, Zac found a strange egg in the garden."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Put the story in order."
            say: "Put the three parts of the story in order: beginning, middle, end."
            options: ["The egg cracked open and a baby dragon came out.", "Zac found a strange egg.", "Zac kept the dragon as a secret pet."]
            slot_count: 3
            answer: ["Zac found a strange egg.", "The egg cracked open and a baby dragon came out.", "Zac kept the dragon as a secret pet."]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Hedgehogs\n\nHedgehogs are small wild animals. They are covered in thousands of sharp spines. Their bodies are round and brown.\n\nHedgehogs eat beetles, worms and slugs. They hunt at night, using their good sense of smell."
            say: "Read the report about hedgehogs. It has two paragraphs. Each paragraph starts on a new line."
          - text: "Paragraph 1: what hedgehogs look like\nParagraph 2: what hedgehogs eat"
            say: "Each paragraph has its own theme. The first is all about what hedgehogs look like. The second is all about what they eat. The first sentence often tells you the theme. It is called the topic sentence."
          - text: "Hedgehogs eat beetles, worms and slugs. My cousin has a rabbit. They hunt at night."
            say: "Spot the problem. My cousin has a rabbit is not about what hedgehogs eat. It does not belong in this paragraph."
          - text: "Paragraphs help the reader find their way."
            say: "Paragraphs break writing into chunks, so the reader can follow it and find things."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Hedgehogs eat beetles, worms and slugs. They hunt at night, using their good sense of smell.\n\nWhat is the theme of this paragraph?"
                say: "Read the paragraph. What is its theme?"
                options: ["what hedgehogs eat", "what hedgehogs look like", "where hedgehogs sleep in winter"]
                answer: "what hedgehogs eat"
                hints:
                  - "What is every sentence about?"
                  - "Beetles, worms, slugs, hunting."
                  - "What hedgehogs eat."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "In winter, hedgehogs hibernate. They build a nest of leaves under a hedge. They sleep there until spring.\n\nWhich is the topic sentence?"
                say: "Read the paragraph. Which sentence is the topic sentence?"
                options: ["In winter, hedgehogs hibernate.", "They build a nest of leaves under a hedge.", "They sleep there until spring."]
                answer: "In winter, hedgehogs hibernate."
                option_audio: false
                hints:
                  - "Which sentence tells you what the whole paragraph is about?"
                  - "It usually comes first."
                  - "In winter, hedgehogs hibernate."
              - id: l1-f3
                type: multiple_choice
                text: "Hedgehogs have many enemies. Badgers and foxes hunt them. I like pizza. Cars on roads are a danger too.\n\nWhich sentence does not belong?"
                say: "Read the paragraph. Which sentence does not belong?"
                options: ["I like pizza.", "Badgers and foxes hunt them.", "Cars on roads are a danger too."]
                answer: "I like pizza."
                option_audio: false
                feedback:
                  "Cars on roads are a danger too.": "Cars are a danger to hedgehogs, so this sentence fits the theme of enemies. Which sentence is about something else?"
                hints:
                  - "The theme is the hedgehog's enemies."
                  - "Which sentence is not about hedgehogs at all?"
                  - "I like pizza."
              - id: l1-f4
                type: sorting
                text: "Sort the sentences into two paragraphs."
                say: "Read each sentence about owls. Is it about what owls look like, or what owls eat?"
                option_audio: false
                bins:
                  - { id: look, show: { text: "what owls look like" }, say: "What owls look like." }
                  - { id: eat, show: { text: "what owls eat" }, say: "What owls eat." }
                options:
                  - { text: "Owls have big round eyes.", bin: look }
                  - { text: "Their feathers are soft and brown.", bin: look }
                  - { text: "Owls catch mice and voles.", bin: eat }
                  - { text: "They swallow small animals whole.", bin: eat }
                hints:
                  - "Each sentence is about one theme."
                  - "Eyes and feathers are how owls look."
                  - "Eyes and feathers: look like; mice and swallowing: eat."
              - id: l1-f5
                type: true_false
                text: "Each paragraph in a report should be about one theme."
                say: "Read it. Is it true?"
                answer: true
                hints:
                  - "Think of the hedgehog report."
                  - "One paragraph was about looks, one about food."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Foxes live in many places. Some live in woods and fields. Others live in towns and cities, even in gardens.\n\nWhat is the theme of this paragraph?"
                say: "Read the paragraph. What is its theme?"
                options: ["where foxes live", "what foxes eat", "how foxes have cubs"]
                answer: "where foxes live"
                hints: ["Woods, fields, towns: what are these?"]
              - id: l1-s2
                type: multiple_choice
                text: "Foxes are clever hunters. They listen for mice under the snow. Then they pounce.\n\nWhich is the topic sentence?"
                say: "Read the paragraph. Which sentence is the topic sentence?"
                options: ["Foxes are clever hunters.", "They listen for mice under the snow.", "Then they pounce."]
                answer: "Foxes are clever hunters."
                option_audio: false
                hints: ["Which sentence sums up the paragraph?"]
              - id: l1-s3
                type: multiple_choice
                text: "Badgers live in tunnels called setts. A sett can have many rooms. My birthday is in May. Badgers line their rooms with grass.\n\nWhich sentence does not belong?"
                say: "Read the paragraph. Which sentence does not belong?"
                options: ["My birthday is in May.", "A sett can have many rooms.", "Badgers line their rooms with grass."]
                answer: "My birthday is in May."
                option_audio: false
                hints: ["The theme is badgers' homes."]
              - id: l1-s4
                type: multiple_choice
                text: "Which topic sentence would start a paragraph about what squirrels eat?"
                options: ["Squirrels eat nuts, seeds and berries.", "Squirrels have bushy tails.", "Squirrels live in trees."]
                answer: "Squirrels eat nuts, seeds and berries."
                option_audio: false
                hints: ["It must be about food."]
              - id: l1-s5
                type: true_false
                text: "A new paragraph starts on a new line."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Look at how the hedgehog report was laid out."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Bees are very important. They carry pollen from flower to flower, which helps plants make seeds and fruit.\n\nWhat is the theme of this paragraph?"
                say: "Read the paragraph. What is its theme?"
                options: ["why bees are important", "what bees look like", "how to make honey toast"]
                answer: "why bees are important"
              - id: l1-n2
                type: multiple_choice
                text: "Which topic sentence would start a paragraph about where penguins live?"
                options: ["Most penguins live in the cold south of the world.", "Penguins eat fish.", "Penguins cannot fly."]
                answer: "Most penguins live in the cold south of the world."
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Frogs lay their eggs in ponds. The eggs are called frogspawn. Football is a team game. The eggs hatch into tadpoles.\n\nWhich sentence does not belong?"
                say: "Read the paragraph. Which sentence does not belong?"
                options: ["Football is a team game.", "The eggs are called frogspawn.", "The eggs hatch into tadpoles."]
                answer: "Football is a team game."
                option_audio: false
              - id: l1-n4
                type: sorting
                text: "Sort the sentences into two paragraphs."
                say: "Read each sentence about our school. Is it about the playground, or about the library?"
                option_audio: false
                bins:
                  - { id: play, show: { text: "the playground" }, say: "The playground." }
                  - { id: library, show: { text: "the library" }, say: "The library." }
                options:
                  - { text: "Our playground has a climbing frame.", bin: play }
                  - { text: "There is a hopscotch grid by the wall.", bin: play }
                  - { text: "The library has comfy beanbags.", bin: library }
                  - { text: "You can borrow two books a week.", bin: library }
              - id: l1-n5
                type: multiple_choice
                text: "Why do writers use paragraphs?"
                options: ["to group ideas so the reader can follow them", "to make the writing longer", "to use up the page"]
                answer: "to group ideas so the reader can follow them"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Rabbits live in burrows under the ground. A group of burrows is called a warren.\n\nWhat is the theme of this paragraph?"
            say: "Read the paragraph. What is its theme?"
            options: ["where rabbits live", "what rabbits eat", "how fast rabbits run"]
            answer: "where rabbits live"
          - id: l1-c2
            type: multiple_choice
            text: "What is a topic sentence?"
            options: ["the sentence that tells you what a paragraph is about", "the last sentence of a story", "a sentence with a question mark"]
            answer: "the sentence that tells you what a paragraph is about"
          - id: l1-c3
            type: true_false
            text: "A paragraph can be about lots of different themes at once."
            say: "Read it. Is it true?"
            answer: false

  - n: 2
    title: { de: Wann ein neuer Absatz beginnt, en: When to start a new paragraph }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Snails move slowly on one big foot. They leave a silvery trail behind them.\n\nWhat is the theme of this paragraph?"
            say: "Read the paragraph. What is its theme?"
            options: ["how snails move", "what snails eat", "where snails sleep"]
            answer: "how snails move"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "The topic sentence often comes first in a paragraph."
            say: "Read it. Is it true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "TiPToP\nTi: a new time\nP: a new place\nTo: a new topic\nP: a new person"
            say: "When do you start a new paragraph? Remember TiPToP. Start a new one when the time changes, the place changes, the topic changes, or a new person comes in or starts speaking."
          - text: "Not: every five lines.\nYes: when the theme changes."
            say: "A paragraph does not end after a certain number of lines. It ends when the theme changes. Some paragraphs are long and some are short."
          - text: "That night, the wind howled around the cottage.\n\nThe next morning, the garden was covered in snow."
            say: "Stories need paragraphs too. Here the time changes, from that night to the next morning, so the writer starts a new paragraph."
          - text: "Meanwhile, at the castle, the king was waiting."
            say: "Here the place changes, to the castle. New place, new paragraph."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Why should a writer start a new paragraph?"
                options: ["because the time, place, topic or person changes", "because five lines are full", "because the pencil is blunt"]
                answer: "because the time, place, topic or person changes"
                feedback:
                  "because five lines are full": "The number of lines does not decide. A new paragraph starts when the theme changes: TiPToP."
                hints:
                  - "Remember TiPToP."
                  - "Time, place, topic, person."
                  - "Because the time, place, topic or person changes."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Jo ate her breakfast and packed her bag. Later that afternoon, she ...\n\nWhy does \"Later that afternoon\" start a new paragraph?"
                say: "Read the story. Why does later that afternoon start a new paragraph?"
                options: ["The time changes.", "The place changes.", "A new person speaks."]
                answer: "The time changes."
                hints:
                  - "What does later that afternoon tell you?"
                  - "It tells you when."
                  - "The time changes."
              - id: l2-f3
                type: multiple_choice
                text: "Ben searched the house for his lost cat. Down at the river, ...\n\nWhy does \"Down at the river\" start a new paragraph?"
                say: "Read the story. Why does down at the river start a new paragraph?"
                options: ["The place changes.", "The time changes.", "The topic is maths."]
                answer: "The place changes."
                hints:
                  - "Where was Ben at first?"
                  - "Now we are at the river."
                  - "The place changes."
              - id: l2-f4
                type: ordering
                text: "Put the paragraphs of the recount in order."
                say: "Put the three paragraph openings of the recount in order."
                options: ["After lunch, we visited the dinosaur hall.", "On Monday, Class 3 went to the museum.", "At the end of the day, we were tired but happy."]
                slot_count: 3
                answer: ["On Monday, Class 3 went to the museum.", "After lunch, we visited the dinosaur hall.", "At the end of the day, we were tired but happy."]
                option_audio: false
                hints:
                  - "Which paragraph sets the scene?"
                  - "Look at the time words."
                  - "On Monday, after lunch, at the end of the day."
              - id: l2-f5
                type: true_false
                text: "Every paragraph must be exactly the same length."
                say: "Read it. Is it true?"
                answer: false
                hints:
                  - "What decides where a paragraph ends?"
                  - "The theme, not the length."
                  - "No, it is not true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which sentence should start a new paragraph in a story?"
                options: ["The next day, Mia set off for the mountains.", "She smiled.", "It was very cold too."]
                answer: "The next day, Mia set off for the mountains."
                option_audio: false
                hints: ["Look for a change of time or place."]
              - id: l2-s2
                type: multiple_choice
                text: "\"Who's there?\" called Sam. ... \"It's only me,\" said Gran.\n\nWhy does Gran's line start a new paragraph?"
                say: "Read the story. Why does Gran's line start a new paragraph?"
                options: ["A new person speaks.", "The place changes.", "The time changes."]
                answer: "A new person speaks."
                hints: ["Who is talking now?"]
              - id: l2-s3
                type: ordering
                text: "Put the paragraphs of the report in order."
                say: "Put the three topic sentences of the report about cats in order: introduction, looks, food."
                options: ["Cats eat meat, such as fish and chicken.", "Cats are popular pets in Britain.", "Cats have soft fur and sharp claws."]
                slot_count: 3
                answer: ["Cats are popular pets in Britain.", "Cats have soft fur and sharp claws.", "Cats eat meat, such as fish and chicken."]
                option_audio: false
                hints: ["Introduction first, then looks, then food."]
              - id: l2-s4
                type: multiple_choice
                text: "In a report about dogs, which change means a new paragraph?"
                options: ["moving from what dogs eat to how to train them", "moving from one sentence to the next", "moving from one food fact to another food fact"]
                answer: "moving from what dogs eat to how to train them"
                hints: ["A new topic."]
              - id: l2-s5
                type: true_false
                text: "Stories need paragraphs as well as reports."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Think of the snowy cottage."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Meanwhile, back at the farm, the pigs had escaped.\n\nWhy does this sentence start a new paragraph?"
                say: "Read the sentence. Why does it start a new paragraph?"
                options: ["The place changes.", "A new person speaks.", "The writer ran out of space."]
                answer: "The place changes."
              - id: l2-n2
                type: multiple_choice
                text: "What does the \"To\" in TiPToP stand for?"
                options: ["topic", "today", "tomorrow"]
                answer: "topic"
              - id: l2-n3
                type: ordering
                text: "Put the paragraphs of the story in order."
                say: "Put the three paragraph openings of the story in order."
                options: ["By the time the sun set, the boat was home safe.", "Early one morning, Finn rowed out to sea.", "Suddenly, a storm blew in."]
                slot_count: 3
                answer: ["Early one morning, Finn rowed out to sea.", "Suddenly, a storm blew in.", "By the time the sun set, the boat was home safe."]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Leo writes ten lines about his holiday, all about the beach. Then he writes about the hotel. Where should his new paragraph start?"
                options: ["where he starts writing about the hotel", "after line 5", "nowhere: it is one theme"]
                answer: "where he starts writing about the hotel"
              - id: l2-n5
                type: sorting
                text: "Which reason makes a new paragraph?"
                say: "Read each opening. Does it start a new paragraph because of a new time, or a new place?"
                option_audio: false
                bins:
                  - { id: time, show: { text: "new time" }, say: "New time." }
                  - { id: place, show: { text: "new place" }, say: "New place." }
                options:
                  - { text: "Two days later, ...", bin: time }
                  - { text: "Inside the cave, ...", bin: place }
                  - { text: "That evening, ...", bin: time }
                  - { text: "At the top of the hill, ...", bin: place }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Ducks live on ponds and rivers. They have waterproof feathers and webbed feet.\n\nWhich topic sentence would start the next paragraph, about what ducks eat?"
            say: "Read the paragraph. Which topic sentence would start the next paragraph, about what ducks eat?"
            options: ["Ducks eat weeds, insects and small fish.", "Ducks have webbed feet.", "Ducks live on ponds."]
            answer: "Ducks eat weeds, insects and small fish."
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Ladybirds are small beetles. Most are red with black spots. My mum drives a van. Some are yellow or orange.\n\nWhich sentence does not belong?"
            say: "Read the paragraph. Which sentence does not belong?"
            options: ["My mum drives a van.", "Most are red with black spots.", "Some are yellow or orange."]
            answer: "My mum drives a van."
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "\"The next morning, everything had changed.\" Why does this start a new paragraph?"
            options: ["The time changes.", "The place changes.", "A new person speaks."]
            answer: "The time changes."
          - id: l2-c4
            type: true_false
            text: "You start a new paragraph when the theme changes."
            say: "Read it. Is it true?"
            answer: true
          - id: l2-c5
            type: ordering
            text: "Put the paragraphs of the report in order."
            say: "Put the three topic sentences of the report about the Moon in order: introduction, what it is like, visits."
            options: ["In 1969, astronauts walked on the Moon.", "The Moon travels around the Earth.", "The Moon is covered in dust and craters."]
            slot_count: 3
            answer: ["The Moon travels around the Earth.", "The Moon is covered in dust and craters.", "In 1969, astronauts walked on the Moon."]
            option_audio: false
