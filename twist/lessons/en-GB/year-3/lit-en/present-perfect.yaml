# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.present-perfect
skill: lit-en.grammar.present-perfect
curriculum: en-GB
language: en
title:
  de: Das Present Perfect verwenden
  en: The present perfect
summary: >
  The present perfect is made with has or have and a past form of the
  verb (he has gone, we have finished). Lesson 1 builds it: has with he,
  she and it, have with I, you, we and they, and the past forms that
  change (gone, eaten, seen, written, broken). Lesson 2 chooses between
  the present perfect and the simple past: the present perfect for
  something that matters now or has no finished time (I have lost my
  key), the simple past with a finished time (I lost my key yesterday),
  with the clue words already, just, ever, yet and yesterday, last week,
  ago; it ends with the skill check.
metadata:
  year: year-3
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.tense-progressive]
  also_practises: [lit-en.grammar.tense-progressive]
  vocabulary: { en: [verb, tense, present perfect, simple past, has, have, past participle, already, just, yet, ever, yesterday, ago] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: has-went
      what: Uses the simple past form after has or have (she has went, I have ate)
      addressed: Learn screen 3 of lesson 1; l1-f3, l1-s3, l1-n3 and l2-c2, with feedback in l1-f3
    - id: has-have-swap
      what: Uses have with he, she or it, or has with I, we or they
      addressed: Learn screen 2 of lesson 1; l1-f1, l1-s1, l1-n1 and l2-c1, with feedback in l1-f1
    - id: perfect-with-yesterday
      what: Uses the present perfect with a finished time (I have seen him yesterday)
      addressed: Learn screen 2 of lesson 2; l2-f2, l2-s2, l2-n2 and l2-c4, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit has und have bilden", en: "Building it with has and have" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "\"Yesterday, Sam _ football.\" Which verb fits?"
            options: ["played", "plays", "is playing"]
            answer: "played"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "\"Look! The baby _ .\" Which verb fits?"
            options: ["is smiling", "smiled", "smile"]
            answer: "is smiling"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "He went out to play.\nHe has gone out to play."
            say: "Both sentences are about the past. The second one uses the present perfect: has gone. It tells us he went, and he is still out now."
          - text: "I have    you have    we have    they have\nhe has    she has    it has"
            say: "The present perfect starts with has or have. Use has with he, she and it, or one person or thing. Use have with I, you, we and they."
          - text: "walk: has walked\ngo: has gone\neat: has eaten\nsee: has seen\nwrite: has written"
            say: "After has or have comes a past form of the verb. Many end in ed, like walked. Some change: gone, eaten, seen, written. Never say has went or have ate."
          - text: "Mum has made a cake.\nThe children have finished their work."
            say: "Read the examples aloud. Has made. Have finished."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "has or have? \"Priya _ finished her book.\""
                say: "Has or have? Priya blank finished her book."
                frame: "Priya _ finished her book."
                options: ["has", "have"]
                answer: ["has"]
                feedback:
                  "have": "Priya is one person, like she. With he, she or it, use has: Priya has finished."
                hints:
                  - "Could you say she instead of Priya?"
                  - "She goes with has."
                  - "has."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "has or have? \"We _ painted a picture.\""
                say: "Has or have? We blank painted a picture."
                frame: "We _ painted a picture."
                options: ["has", "have"]
                answer: ["have"]
                hints:
                  - "Which word goes with we?"
                  - "I, you, we and they go with have."
                  - "have."
              - id: l1-f3
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["Tom has gone to the shop.", "Tom has went to the shop.", "Tom has go to the shop."]
                answer: "Tom has gone to the shop."
                option_audio: false
                feedback:
                  "Tom has went to the shop.": "Went is the simple past. After has, use the other past form: gone. Tom has gone."
                hints:
                  - "After has, which form of go do we use?"
                  - "Went is used on its own: Tom went."
                  - "Tom has gone to the shop."
              - id: l1-f4
                type: matching
                text: "Match each verb with its past form after has."
                say: "Match each verb with the form that goes after has."
                pairs:
                  - { left: { text: "eat" }, right: { text: "has eaten" } }
                  - { left: { text: "see" }, right: { text: "has seen" } }
                  - { left: { text: "write" }, right: { text: "has written" } }
                hints:
                  - "Say each one: she has ..."
                  - "These verbs change; they do not add ed."
                  - "eaten, seen, written."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the two words of the present perfect."
                say: "Tap the two words that make the present perfect."
                show: { drawn: letter-card, text: "The cat has caught a mouse" }
                spans: ["has", "caught"]
                hints:
                  - "Look for has or have."
                  - "Then the verb straight after it."
                  - "has and caught."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "has or have? \"They _ planted some seeds.\""
                say: "Has or have? They blank planted some seeds."
                frame: "They _ planted some seeds."
                options: ["has", "have"]
                answer: ["have"]
                hints: ["They goes with have."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which form fits? \"Dad has _ the dishes.\""
                say: "Which form fits? Dad has blank the dishes."
                frame: "Dad has _ the dishes."
                options: ["washed", "wash", "washing"]
                answer: ["washed"]
                hints: ["After has, use a past form."]
              - id: l1-s3
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["I have eaten my lunch.", "I have ate my lunch.", "I have eat my lunch."]
                answer: "I have eaten my lunch."
                option_audio: false
                hints: ["eat: has eaten."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the two words of the present perfect."
                say: "Tap the two words that make the present perfect."
                show: { drawn: letter-card, text: "My friends have built a den" }
                spans: ["have", "built"]
                hints: ["have, then the verb."]
              - id: l1-s5
                type: true_false
                text: "\"She have seen the film\" is correct."
                say: "Read it. Is it true?"
                answer: false
                hints: ["She goes with has."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "has or have? \"The dog _ hidden its bone.\""
                say: "Has or have? The dog blank hidden its bone."
                frame: "The dog _ hidden its bone."
                options: ["has", "have"]
                answer: ["has"]
              - id: l1-n2
                type: fill_in_blank
                text: "Which form fits? \"Ella has _ a letter to Gran.\""
                say: "Which form fits? Ella has blank a letter to Gran."
                frame: "Ella has _ a letter to Gran."
                options: ["written", "wrote", "write"]
                answer: ["written"]
              - id: l1-n3
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["The window has broken.", "The window has broke.", "The window has break."]
                answer: "The window has broken."
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Fill both gaps. \"I _ seen a fox, and my brother _ seen one too.\""
                say: "Fill both gaps with has or have. I blank seen a fox, and my brother blank seen one too."
                frame: "I _ seen a fox, and my brother _ seen one too."
                options: ["has", "have"]
                answer: ["have", "has"]
              - id: l1-n5
                type: true_false
                text: "\"We have finished\" is in the present perfect."
                say: "Read it. Is it true?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "has or have? \"You _ grown so tall!\""
            say: "Has or have? You blank grown so tall!"
            frame: "You _ grown so tall!"
            options: ["has", "have"]
            answer: ["have"]
          - id: l1-c2
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["Max has taken my pen.", "Max has took my pen.", "Max has take my pen."]
            answer: "Max has taken my pen."
            option_audio: false
          - id: l1-c3
            type: fill_in_blank
            text: "Which form fits? \"The bus has _ .\""
            say: "Which form fits? The bus has blank."
            frame: "The bus has _ ."
            options: ["arrived", "arrive", "arriving"]
            answer: ["arrived"]

  - n: 2
    title: { de: "Present Perfect oder Simple Past?", en: "Present perfect or simple past?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "has or have? \"Grandpa _ fixed my bike.\""
            say: "Has or have? Grandpa blank fixed my bike."
            frame: "Grandpa _ fixed my bike."
            options: ["has", "have"]
            answer: ["has"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["We have swum in the sea.", "We have swam in the sea."]
            answer: "We have swum in the sea."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I have lost my key. (I still cannot find it.)\nI lost my key yesterday. (It happened at a finished time.)"
            say: "Use the present perfect when something in the past matters now, or when you do not say when it happened. Use the simple past when you say a finished time, like yesterday."
          - text: "simple past: yesterday, last week, two days ago, in 2020\npresent perfect: already, just, ever, never, yet"
            say: "Time words are clues. With yesterday, last week or ago, use the simple past: I saw him yesterday, not I have seen him yesterday. With already, just, ever and yet, use the present perfect: I have just seen him."
          - text: "Have you ever been to London?\nI haven't finished yet."
            say: "Ever is often in questions. Yet often comes at the end, with not: I haven't finished yet. Haven't is short for have not."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"Mia has broken her arm.\" What does this tell us?"
                options: ["Her arm is still broken now.", "Her arm got better long ago.", "She will break it tomorrow."]
                answer: "Her arm is still broken now."
                hints:
                  - "The present perfect links the past to now."
                  - "Has broken: it happened, and it matters now."
                  - "Her arm is still broken now."
              - id: l2-f2
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["I saw a rainbow yesterday.", "I have seen a rainbow yesterday."]
                answer: "I saw a rainbow yesterday."
                option_audio: false
                feedback:
                  "I have seen a rainbow yesterday.": "Yesterday is a finished time. With a finished time, use the simple past: I saw a rainbow yesterday."
                hints:
                  - "Look for a time word."
                  - "Yesterday is finished: use the simple past."
                  - "I saw a rainbow yesterday."
              - id: l2-f3
                type: fill_in_blank
                text: "Which fits? \"Hurry up! The film _ already started.\""
                say: "Which fits? Hurry up! The film blank already started."
                frame: "Hurry up! The film _ already started."
                options: ["has", "did"]
                answer: ["has"]
                hints:
                  - "Already is a clue word."
                  - "Already goes with the present perfect."
                  - "has: has already started."
              - id: l2-f4
                type: sorting
                text: "Which tense goes with each time word?"
                say: "Read each time word. Does it go with the present perfect or the simple past?"
                option_audio: false
                bins:
                  - { id: perfect, show: { text: "present perfect (has gone)" }, say: "Present perfect." }
                  - { id: past, show: { text: "simple past (went)" }, say: "Simple past." }
                options:
                  - { text: "already", bin: perfect }
                  - { text: "yet", bin: perfect }
                  - { text: "yesterday", bin: past }
                  - { text: "last week", bin: past }
                hints:
                  - "Which ones name a finished time?"
                  - "Yesterday and last week are finished."
                  - "already, yet: present perfect; yesterday, last week: simple past."
              - id: l2-f5
                type: fill_in_blank
                text: "Which fits? \"We _ to the beach last summer.\""
                say: "Which fits? We blank to the beach last summer."
                frame: "We _ to the beach last summer."
                options: ["went", "have gone"]
                answer: ["went"]
                hints:
                  - "Is last summer finished?"
                  - "A finished time takes the simple past."
                  - "went."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"Dad has gone to work.\" Where is Dad now?"
                options: ["at work", "at home", "on holiday last year"]
                answer: "at work"
                hints: ["Has gone: he went, and he is still there."]
              - id: l2-s2
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["Sam visited Wales two years ago.", "Sam has visited Wales two years ago."]
                answer: "Sam visited Wales two years ago."
                option_audio: false
                hints: ["Ago names a finished time."]
              - id: l2-s3
                type: fill_in_blank
                text: "Which fits? \"I _ just finished my picture.\""
                say: "Which fits? I blank just finished my picture."
                frame: "I _ just finished my picture."
                options: ["have", "did"]
                answer: ["have"]
                hints: ["Just goes with the present perfect."]
              - id: l2-s4
                type: fill_in_blank
                text: "Which fits? \"_ you ever seen a whale?\""
                say: "Which fits? Blank you ever seen a whale?"
                frame: "_ you ever seen a whale?"
                options: ["Have", "Did"]
                answer: ["Have"]
                hints: ["Ever goes with the present perfect."]
              - id: l2-s5
                type: true_false
                text: "\"I haven't eaten my apple yet\" is correct."
                say: "Read it. Is it true?"
                answer: true
                hints: ["Yet goes with the present perfect."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"The ice has melted.\" What can we say about the ice now?"
                options: ["It is water now.", "It is still frozen.", "It will freeze tomorrow."]
                answer: "It is water now."
              - id: l2-n2
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["We finished the puzzle on Monday.", "We have finished the puzzle on Monday."]
                answer: "We finished the puzzle on Monday."
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Which fits? \"Oh no, I _ forgotten my PE kit!\""
                say: "Which fits? Oh no, I blank forgotten my PE kit!"
                frame: "Oh no, I _ forgotten my PE kit!"
                options: ["have", "has"]
                answer: ["have"]
              - id: l2-n4
                type: fill_in_blank
                text: "Fill both gaps. \"Leo _ lost his hat. He _ it at the park yesterday.\""
                say: "Fill both gaps. Leo blank lost his hat. He blank it at the park yesterday."
                frame: "Leo _ lost his hat. He _ it at the park yesterday."
                options: ["has", "dropped", "have", "has dropped"]
                answer: ["has", "dropped"]
              - id: l2-n5
                type: true_false
                text: "\"She has met the mayor last year\" is correct."
                say: "Read it. Is it true?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "has or have? \"The twins _ learnt to swim.\""
            say: "Has or have? The twins blank learnt to swim."
            frame: "The twins _ learnt to swim."
            options: ["has", "have"]
            answer: ["have"]
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["Gran has done the crossword.", "Gran has did the crossword.", "Gran has do the crossword."]
            answer: "Gran has done the crossword."
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "Which fits? \"The birds _ already flown south.\""
            say: "Which fits? The birds blank already flown south."
            frame: "The birds _ already flown south."
            options: ["have", "did"]
            answer: ["have"]
          - id: l2-c4
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["I read that book last week.", "I have read that book last week."]
            answer: "I read that book last week."
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "\"Ben has fallen asleep.\" What is Ben doing now?"
            options: ["sleeping", "running", "eating breakfast"]
            answer: "sleeping"
