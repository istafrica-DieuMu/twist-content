            text: "15 − 8: which split goes back to ten first?"
            say: "Fifteen subtract eight. Which split goes back to ten first?"
            options: ["15 − 5 − 3", "15 − 4 − 4", "15 − 6 − 2"]
            answer: "15 − 5 − 3"
          - id: l2-c7
            part: split
            type: multiple_choice
            text: "13 − 9: how many back to ten?"
            say: "Thirteen subtract nine. How many do you take away first to land exactly on ten?"
            options: ["3", "9", "6"]
            answer: "3"
          - id: l2-c8
            part: split
            type: true_false
            text: "Is it true? 14 − 6 = 14 − 4 − 2"
            say: "Fourteen subtract six is the same as fourteen subtract four, subtract two. Is that true?"
            answer: true
          - id: l2-c9
            part: split
            type: fill_in_blank
            text: "Split the number you take away."
            say: "Twelve subtract seven. Split the seven so the first part takes you back to ten."
            frame: "12 − 7 = 12 − _ − _"
            options: ["2", "5", "3", "4"]
            answer: ["2", "5"]
          - id: l2-c10
            part: steps
            type: fill_in_blank
            text: "11 − 3: subtract in two steps."
            say: "Eleven subtract three. Back to ten first, then the rest."
            frame: "11 − 1 = _ · 10 − 2 = _"
            options: ["10", "8", "9", "2"]
            answer: ["10", "8"]
          - id: l2-c11
            part: steps
            type: fill_in_blank
            text: "14 − 8: subtract in two steps."
            say: "Fourteen subtract eight. Back to ten first, then the rest."
            frame: "14 − 4 = _ · 10 − 4 = _"
            options: ["10", "6", "4", "8"]
            answer: ["10", "6"]
          - id: l2-c12
            part: steps
            type: fill_in_blank
            text: "15 − 9: subtract in two steps."
            say: "Fifteen subtract nine. Back to ten first, then the rest."
            frame: "15 − 5 = _ · 10 − _ = _"
            options: ["10", "4", "6", "5"]
            answer: ["10", "4", "6"]
          - id: l2-c13
            part: steps
            type: multiple_choice
            text: "12 − 5 = ?\nLook at the two hops."
            say: "Twelve subtract five. Look at the two hops. What is the answer?"
            show: { drawn: rechenstrich, start: 12, jumps: [-2, -3] }
            options: ["7", "8", "10"]
            answer: "7"
          - id: l2-c14
            part: solve
            type: text_input
            text: "16 − 7 = _"
            say: "Sixteen subtract seven."
            answer: "9"
          - id: l2-c15
            part: solve
            type: text_input
            text: "Mia has 12 stickers. She gives 3 to her brother. How many stickers does she have now?"
            say: "Mia has twelve stickers. She gives three to her brother. How many stickers does she have now?"
            show: { object: sticker, count: 12, gone: 3 }
            answer: "9"
          - id: l2-c16
            part: check
            type: true_false
            text: "Is it true? 16 − 8 = 7, because 7 + 8 = 16."
            say: "Sixteen subtract eight is seven, because seven add eight is sixteen. Is that true?"
            answer: false
          - id: l2-c17
            part: check
            type: multiple_choice
            text: "Which addition checks 13 − 4 = 9?"
            say: "Which addition checks thirteen subtract four is nine?"
            options: ["9 + 4 = 13", "9 − 4 = 5", "13 + 4 = 17"]
            answer: "9 + 4 = 13"
          - id: l2-c18
            part: check
            type: fill_in_blank
            text: "Check by adding."
            say: "Seventeen subtract nine is eight. Check by adding: eight add nine is what?"
            frame: "17 − 9 = 8 · 8 + 9 = _"
            options: ["17", "16", "18", "1"]
            answer: ["17"]
          - id: l2-c19
            part: check
            type: multiple_choice
            text: "Ali says 12 − 6 = 7. Check by adding. Is he right?"
            say: "Ali says twelve subtract six is seven. Check by adding. Is he right?"
            options: ["No, because 7 + 6 = 13", "Yes, because 7 + 6 = 12"]
            answer: "No, because 7 + 6 = 13"
          - id: l2-c20
            part: check
            type: true_false
            text: "Is it true? 9 + 6 = 15 checks that 15 − 6 = 9."
