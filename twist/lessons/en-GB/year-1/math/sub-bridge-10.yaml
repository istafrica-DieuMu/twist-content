            options: ["8", "9", "1"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "16 − 9 = 16 − 6 − 3 = 7"
            say: "Sixteen subtract nine: six back to ten, then three more. Seven."
            show: { drawn: rechenstrich, start: 16, jumps: [-6, -3] }
          - text: "11 − 5 = 11 − 1 − 4 = 6"
            say: "Eleven subtract five: one back to ten, then four more. Six."
            show: { drawn: rechenstrich, start: 11, jumps: [-1, -4] }
          - text: "check: 6 + 5 = 11"
            say: "Check by adding. Six add five is eleven, so the answer is right."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "15 − 8: subtract in two steps."
                say: "Fifteen subtract eight. Back to ten first, then the rest."
                frame: "15 − 5 = _ · 10 − 3 = _"
                options: ["10", "7", "8", "3"]
                answer: ["10", "7"]
                hints:
                  - "The first step lands exactly on ten."
                  - "Fifteen subtract five is ten. Eight is five and three, so take away three more."
                  - "10, then 7."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "17 − 9 = ?"
                say: "Seventeen subtract nine."
                options: ["8", "12", "7"]
                answer: "8"
                feedback:
                  "12": "You took seven from nine. Take nine from seventeen: seven back to ten, then two more. That makes 8."
                hints:
                  - "Seven back to ten."
                  - "Nine is seven and two. Two more."
                  - "8."
              - id: l2-f3
                type: true_false
                text: "Is it true? 13 − 7 = 6, because 6 + 7 = 13."
                say: "Thirteen subtract seven is six, because six add seven is thirteen. Is that true?"
                answer: true
                hints:
                  - "Check by adding."
                  - "Six add seven is thirteen."
                  - "Yes."
              - id: l2-f4
                type: text_input
                text: "18 − 9 = _"
                say: "Eighteen subtract nine."
                answer: "9"
                hints:
                  - "Eight back to ten."
                  - "Then one more."
                  - "9."
              - id: l2-f5
                type: fill_in_blank
                text: "Split the number you take away."
                say: "Fourteen subtract eight. Split the eight so the first part takes you back to ten."
                frame: "14 − 8 = 14 − _ − _"
                options: ["4", "3", "5", "2"]
                answer: ["4", "4"]
                hints:
                  - "How many back to ten from fourteen?"
                  - "Fourteen subtract four is ten. Eight is four and four."
                  - "14 − 8 = 14 − 4 − 4."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "13 − 9: subtract in two steps."
                say: "Thirteen subtract nine. Back to ten first, then the rest."
                frame: "13 − 3 = _ · 10 − 6 = _"
                options: ["10", "4", "6", "3"]
                answer: ["10", "4"]
                hints: ["Nine is three and six."]
              - id: l2-s2
                type: multiple_choice
                text: "12 − 7 = ?"
                say: "Twelve subtract seven."
                options: ["5", "15", "6"]
                answer: "5"
                hints: ["Back to ten first."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 16 − 7 = 8"
                say: "Sixteen subtract seven is eight. Is that true?"
                answer: false
                hints: ["Check by adding. Does 8 + 7 make 16?"]
              - id: l2-s4
                type: text_input
                text: "11 − 6 = _"
                say: "Eleven subtract six."
                answer: "5"
                hints: ["One back to ten first."]
              - id: l2-s5
                type: fill_in_blank
                text: "Split the number you take away."
                say: "Seventeen subtract nine. Split the nine so the first part takes you back to ten."
                frame: "17 − 9 = 17 − _ − _"
                options: ["7", "2", "6", "3"]
                answer: ["7", "2"]
                hints: ["How many back to ten from seventeen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "16 − 8: subtract in two steps."
                say: "Sixteen subtract eight. Back to ten first, then the rest."
                frame: "16 − 6 = _ · 10 − 2 = _"
                options: ["10", "8", "4", "2"]
                answer: ["10", "8"]
              - id: l2-n2
                type: multiple_choice
                text: "14 − 9 = ?"
                say: "Fourteen subtract nine."
                options: ["5", "15", "6"]
                answer: "5"
              - id: l2-n3
                type: true_false
                text: "Is it true? 12 − 6 = 6"
                say: "Twelve subtract six is six. Is that true?"
                answer: true
              - id: l2-n4
                type: text_input
                text: "15 − 9 = _"
                say: "Fifteen subtract nine."
                answer: "6"
              - id: l2-n5
                type: text_input
                text: "13 − 8 = _"
                say: "Thirteen subtract eight."
                answer: "5"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: solve
            type: text_input
            text: "12 − 9 = _"
            say: "Twelve subtract nine."
            answer: "3"
          - id: l2-c2
            part: steps
            type: fill_in_blank
            text: "17 − 8: subtract in two steps."
            say: "Seventeen subtract eight."
            frame: "17 − 7 = _ · 10 − 1 = _"
            options: ["10", "9", "1", "7"]
            answer: ["10", "9"]
          - id: l2-c3
            part: solve
            type: multiple_choice
            text: "11 − 9 = ?"
            say: "Eleven subtract nine."
            options: ["2", "18", "3"]
            answer: "2"
          - id: l2-c4
            part: solve
            type: true_false
            text: "Is it true? 11 − 7 = 5"
            say: "Eleven subtract seven is five. Is that true?"
            answer: false
          - id: l2-c5
            part: split
            type: fill_in_blank
            text: "Split the number you take away."
            say: "Twelve subtract eight. Split the eight so the first part takes you back to ten."
            frame: "12 − 8 = 12 − _ − _"
            options: ["2", "6", "4", "5"]
            answer: ["2", "6"]
          - id: l2-c6
            part: split
