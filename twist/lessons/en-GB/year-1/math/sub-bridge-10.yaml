# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.sub-bridge-10
skill: math.add-sub-to-20.sub-bridge-10
curriculum: en-GB
language: en
title:
  de: Minus mit Zehnerübergang
  en: Subtracting back through ten
summary: >
  Subtracting across ten in two steps: back to 10 first, then the rest
  (13 − 5 = 13 − 3 − 2 = 8). Lesson 1 splits the number to take away and
  hops back to ten on a number line; lesson 2 checks answers with the
  inverse, practises all facts from 11 to 18, and ends with the skill
  check.
metadata:
  year: year-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-bridge-10]
  also_practises: [math.numbers-to-20.partition-to-10, math.add-sub-to-20.inverse]
  vocabulary: { en: [subtract, back to ten, split, number line, inverse, check] }
  forms: [drawn, picture, text, audio]
  drawn: [equation, rechenstrich]
  facets: []
  parts:
    - { id: split, what: { de: "die Zahl so zerlegen, dass du zuerst bis zur 10 zurückgehst", en: splitting the number so the first step goes back to 10 } }
    - { id: steps, what: { de: in zwei Schritten rechnen, en: subtracting in two steps } }
    - { id: solve, what: { de: Minusaufgaben mit Zehnerübergang lösen, en: answering subtractions across ten } }
    - { id: check, what: { de: ein Ergebnis mit einer Plusaufgabe prüfen, en: checking an answer by adding } }
  misconceptions:
    - id: wrong-split
      what: Splits the number to take away so the first hop does not land on ten
      addressed: lesson 1 Learn says the first hop goes back exactly to ten, as many as the ones; tasks ask how many back to ten before the rest, and the split frames start with that step
    - id: subtract-ones-backwards
      what: Takes the smaller ones from the larger (13 − 5 = 12, because 5 − 3 = 2)
      addressed: multiple-choice sums include that answer as an option (17 for 11 − 8, 12 for 17 − 9), with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Erst bis zur 10, en: Back to ten first }
    goal:
      de: "Spring zuerst zurück zur 10 und nimm dann den Rest weg, so wie 13 minus 5 ist 8."
      en: "Hop back to ten first, then take away the rest, like 13 take away 5 makes 8."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "14 − 4 = _"
            say: "Fourteen subtract four."
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Split the 6."
            say: "Split the six. Six is two and how many more?"
            frame: "6 = 2 + _"
            options: ["3", "4", "8"]
            answer: ["4"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "13 − 5 = ?"
            say: "Thirteen subtract five. From thirteen, three hops back take you exactly to ten."
            show: { drawn: equation, text: "13 − 5 = _", split: "5 = 3 + 2" }
          - text: "13 − 3 = 10"
            say: "So split the five into three and two. First take away three. That makes ten."
            show: { drawn: rechenstrich, start: 13, jumps: [-3] }
          - text: "10 − 2 = 8"
            say: "Then the rest: ten subtract two is eight. Thirteen subtract five is eight."
            show: { drawn: rechenstrich, start: 13, jumps: [-3, -2] }
          - text: "back to ten first, then the rest"
            say: "It always works like this. First hop back to ten, as many hops as there are ones. Then take away the rest."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "12 − 4: how many back to ten?"
                say: "Twelve subtract four. How many do you take away first to land exactly on ten?"
                show: { drawn: rechenstrich, start: 12, jumps: [], back: true }
                options: ["2", "4", "1"]
                answer: "2"
                hints:
                  - "How many ones does twelve have?"
                  - "Twelve subtract two is ten."
                  - "2."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "14 − 6: subtract in two steps."
                say: "Fourteen subtract six. Back to ten first, then the rest."
                show: { drawn: equation, text: "14 − 6 = _", split: "6 = 4 + 2" }
                frame: "14 − 4 = _ · 10 − 2 = _"
                options: ["10", "8", "12", "6"]
                answer: ["10", "8"]
                hints:
                  - "The first step lands exactly on ten."
                  - "Fourteen subtract four is ten. Then take away two more."
                  - "10, then 8."
              - id: l1-f3
                type: multiple_choice
                text: "11 − 8 = ?"
                say: "Eleven subtract eight."
                show: { drawn: rechenstrich, start: 11, jumps: [-1, -7] }
                options: ["3", "17", "4"]
                answer: "3"
                feedback:
                  "17": "You did eight subtract one. You are taking eight away from eleven: one back to ten, then seven more."
                  "4": "Look at the hops: one and seven make eight. From ten, take away seven more."
                hints:
                  - "Look at the two hops."
                  - "One back to ten. Then seven more."
                  - "10 − 7 = ?"
              - id: l1-f4
                type: fill_in_blank
                text: "Split the number you take away."
                say: "Fifteen subtract seven. Split the seven so the first part takes you back to ten."
                frame: "15 − 7 = 15 − _ − _"
                options: ["5", "2", "3", "4"]
                answer: ["5", "2"]
                hints:
                  - "How many back to ten from fifteen?"
                  - "Fifteen subtract five is ten. Seven is five and two."
                  - "15 − 7 = 15 − 5 − 2."
              - id: l1-f5
                type: text_input
                text: "16 − 8 = _"
                say: "Sixteen subtract eight."
                answer: "8"
                hints:
                  - "Six back to ten."
                  - "Then two more."
                  - "8."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "17 − 9: how many back to ten?"
                say: "Seventeen subtract nine. How many do you take away first to land exactly on ten?"
                show: { drawn: rechenstrich, start: 17, jumps: [], back: true }
                options: ["7", "9", "2"]
                answer: "7"
                hints: ["How many ones does the first number have?"]
              - id: l1-s2
                type: fill_in_blank
                text: "12 − 5: subtract in two steps."
                say: "Twelve subtract five. Back to ten first, then the rest."
                frame: "12 − 2 = _ · 10 − 3 = _"
                options: ["10", "7", "8", "3"]
                answer: ["10", "7"]
                hints: ["Back to ten first."]
              - id: l1-s3
                type: multiple_choice
                text: "14 − 5 = ?"
                say: "Fourteen subtract five."
                options: ["9", "11", "10"]
                answer: "9"
                hints: ["Four back to ten first."]
              - id: l1-s4
                type: fill_in_blank
                text: "Split the number you take away."
                say: "Thirteen subtract six. Split the six so the first part takes you back to ten."
                frame: "13 − 6 = 13 − _ − _"
                options: ["3", "2", "4", "1"]
                answer: ["3", "3"]
                hints: ["How many back to ten from thirteen?"]
              - id: l1-s5
                type: true_false
                text: "Is it true? 15 − 6 = 11"
                say: "Fifteen subtract six is eleven. Is that true?"
                answer: false
                hints: ["Five back to ten, then the rest."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "16 − 7: how many back to ten?"
                say: "Sixteen subtract seven. How many do you take away first to land exactly on ten?"
                show: { drawn: rechenstrich, start: 16, jumps: [], back: true }
                options: ["6", "7", "1"]
                answer: "6"
              - id: l1-n2
                type: fill_in_blank
                text: "11 − 4: subtract in two steps."
                say: "Eleven subtract four. Back to ten first, then the rest."
                frame: "11 − 1 = _ · 10 − 3 = _"
                options: ["10", "7", "9", "3"]
                answer: ["10", "7"]
              - id: l1-n3
                type: text_input
                text: "13 − 4 = _"
                say: "Thirteen subtract four."
                answer: "9"
              - id: l1-n4
                type: true_false
                text: "Is it true? 12 − 3 = 9"
                say: "Twelve subtract three is nine. Is that true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "13 − 7 = _"
                say: "Thirteen subtract seven."
                answer: "6"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "14 − 7 = _"
            say: "Fourteen subtract seven."
            answer: "7"
          - id: l1-c2
            type: multiple_choice
            text: "15 − 8: how many back to ten?"
            say: "Fifteen subtract eight. How many do you take away first to land exactly on ten?"
            options: ["5", "8", "3"]
            answer: "5"
          - id: l1-c3
            type: true_false
            text: "Is it true? 11 − 2 = 9"
            say: "Eleven subtract two is nine. Is that true?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Split the number you take away."
            say: "Thirteen subtract eight. Split the eight so the first part takes you back to ten."
            frame: "13 − 8 = 13 − _ − _"
            options: ["3", "5", "4", "2"]
            answer: ["3", "5"]
          - id: l1-c5
            type: text_input
            text: "17 − 8 = _"
            say: "Seventeen subtract eight."
            answer: "9"
          - id: l1-c6
            type: true_false
            text: "Is it true? 15 − 7 = 9"
            say: "Fifteen subtract seven is nine. Is that true?"
            answer: false

  - n: 2
    title: { de: Minus bis 20, en: Subtracting within 20 }
    goal:
      de: "Nimm über die 10 hinweg weg und prüf dann mit Plus, so wie 11 minus 5 ist 6."
      en: "Take away past ten, then check by adding, like 11 take away 5 is 6."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "12 − 4 = _"
            say: "Twelve subtract four."
            answer: "8"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "18 − 9: how many back to ten?"
