# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.compare-to-20
skill: math.numbers-to-20.compare-to-20
curriculum: en-GB
language: en
title:
  de: Zahlen bis 20 vergleichen
  en: Comparing numbers to 20
summary: >
  Comparing numbers to 20 and saying how many more or fewer. Lesson 1
  compares with more than, less than and equal to, looking at the ten and
  then the ones, and writes <, > and =; lesson 2 finds how many more on a
  number line (15 is 3 more than 12), and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.teens, math.numbers-to-20.compare-to-10]
  also_practises: [math.numbers-to-20.order-to-20]
  vocabulary: { en: [more than, less than, equal to, greater, fewer, how many more] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld, number-line]
  facets: []
  parts:
    - { id: signs, what: { de: "Zahlen bis 20 mit <, > und = vergleichen", en: "comparing numbers to 20 with <, > and =" } }
    - { id: greatest, what: { de: die größere oder kleinere und die größte oder kleinste Zahl finden, en: finding the greater or smaller number and the greatest or smallest } }
    - { id: difference, what: { de: "sagen, um wie viel eine Zahl größer oder kleiner ist", en: saying how many more or fewer } }
  misconceptions:
    - id: bigger-ones-digit
      what: Thinks 9 is greater than 12 because 9 is greater than 2
      addressed: lesson 1 Learn says to look at the ten first; a one-digit number against a teen in every stage, with feedback in the full stage
    - id: difference-as-total
      what: Answers how many more with one of the numbers or the two added together
      addressed: lesson 2 Learn counts only the hops from the smaller number to the larger; options include one of the numbers or the two added together, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Größer oder kleiner, en: More than or less than }
    goal:
      de: "Schau erst auf die Zehner, dann auf die Einer, und sag, welche Zahl größer ist, so wie bei 16 und 13."
      en: "Look at the tens, then the ones, to say which number is greater, like 16 and 13."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between seven and four?"
            frame: "7 _ 4"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many counters?"
            say: "How many counters are there altogether?"
            show: { drawn: zwanzigerfeld, filled: [10, 4] }
            options: ["14", "4", "41"]
            answer: "14"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "16 or 13?"
            say: "Which number do you think is greater, sixteen or thirteen? Have a guess."
            show: { drawn: zwanzigerfeld, filled: [10, 6] }
          - text: "16 > 13"
            say: "Sixteen is greater! Sixteen and thirteen both have one ten. So look at the ones: six is more than three. Sixteen is greater than thirteen."
            show: { drawn: zwanzigerfeld, filled: [10, 6] }
          - text: "12 > 9"
            say: "Twelve and nine: twelve has a ten, nine does not. The number with a ten is greater. Twelve is greater than nine, even though nine has more ones."
          - text: "< · >"
            say: "The sign opens towards the greater number and points at the smaller one. Twelve is greater than nine: twelve, greater than sign, nine."
          - text: "Did you know? Most cats have 18 toes: 5 on each front paw and 4 on each back paw."
            say: "Did you know? Most cats have eighteen toes. They have five toes on each front paw, but only four on each back paw. So a cat has more toes at the front than at the back!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between fourteen and seventeen?"
                frame: "14 _ 17"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Both have one ten. Look at the ones."
                  - "Four is less than seven."
                  - "14 < 17."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ben's tower has 11 bricks. Ava's tower has 8. Which number is greater?"
                say: "Ben's tower has eleven bricks. Ava's tower has eight. Which number is greater, eleven or eight?"
                options: ["11", "8"]
                answer: "11"
                option_audio: false
                feedback:
                  "8": "Eight has no ten. Eleven has one ten, so eleven is greater."
                hints:
                  - "Which number has a ten?"
                  - "Eleven has a ten."
                  - "11 is greater."
              - id: l1-f3
                type: true_false
                text: "Is it true? 19 > 15"
                say: "Nineteen is greater than fifteen. Is that true?"
                answer: true
                hints:
                  - "Both have one ten."
                  - "Nine ones are more than five."
                  - "Yes."
              - id: l1-f4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between seven and eleven?"
                frame: "7 _ 11"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Does seven have a ten?"
                  - "Eleven has a ten, so eleven is greater."
                  - "7 < 11."
              - id: l1-f5
                type: multiple_choice
                text: "Which number is the smallest?"
                say: "Which number is the smallest?"
                options: ["18", "13", "20"]
                answer: "13"
                option_audio: false
                hints:
                  - "Look at the tens first."
                  - "Twenty has two tens. For eighteen and thirteen, look at the ones."
                  - "13."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between sixteen and eleven?"
                frame: "16 _ 11"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Compare the ones."]
              - id: l1-s2
                type: multiple_choice
                text: "Which number is greater?"
                say: "Which number is greater, seven or fifteen?"
                options: ["7", "15"]
                answer: "15"
                option_audio: false
                hints: ["Which number has a ten?"]
              - id: l1-s3
                type: true_false
                text: "Is it true? 13 < 10"
                say: "Thirteen is less than ten. Is that true?"
                answer: false
                hints: ["How many tens does each number have?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between eighteen and eighteen?"
                frame: "18 _ 18"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Are the numbers different?"]
              - id: l1-s5
                type: multiple_choice
                text: "In a beanbag game, Kai scores 19, Nia scores 9 and Raj scores 17. Which score is the greatest?"
                say: "In a beanbag game, Kai scores nineteen, Nia scores nine and Raj scores seventeen. Which score is the greatest?"
                options: ["19", "9", "17"]
                answer: "19"
                option_audio: false
                hints: ["Tens first, then ones."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between twenty and nineteen?"
                frame: "20 _ 19"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which number is less?"
                say: "Which number is less, twelve or ten?"
                options: ["12", "10"]
                answer: "10"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Is it true? 8 > 14"
                say: "Eight is greater than fourteen. Is that true?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between eleven and thirteen?"
                frame: "11 _ 13"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Three snails race. They take 16, 12 and 14 minutes. Which number is the smallest?"
                say: "Three snails have a race. They take sixteen, twelve and fourteen minutes. Which number is the smallest?"
                options: ["16", "12", "14"]
                answer: "12"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between fifteen and twelve?"
            frame: "15 _ 12"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which number is greater?"
            say: "Which number is greater, nine or thirteen?"
            options: ["9", "13"]
            answer: "13"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? 17 < 20"
            say: "Seventeen is less than twenty. Is that true?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between nine and twelve?"
            frame: "9 _ 12"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Which number is less?"
            say: "Which number is less, twenty or eighteen?"
            options: ["20", "18"]
            answer: "18"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Is it true? 14 < 11"
            say: "Fourteen is less than eleven. Is that true?"
            answer: false

  - n: 2
    title: { de: "Um wie viel mehr?", en: "How many more?" }
    goal:
      de: "Spring auf dem Zahlenstrahl und finde heraus, um wie viel mehr, so wie 15 ist 3 mehr als 12."
      en: "Hop along a number line to find how many more, like 15 is 3 more than 12."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between ten and fourteen?"
            frame: "10 _ 14"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which number is greater?"
            say: "Which number is greater, sixteen or nineteen?"
            options: ["16", "19"]
            answer: "19"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mia has 14. Ben has 11. Who has more?"
            say: "Mia has fourteen marbles and Ben has eleven. Who do you think has more, and how many more? Have a guess."
            show: { drawn: zwanzigerfeld, filled: [10, 4] }
          - text: "11 → 14: 3 hops"
            say: "Start at eleven and hop to fourteen: twelve, thirteen, fourteen. That is three hops. Mia has three more."
            show: { drawn: number-line, from: 0, to: 20, labels: tens, jumps: [[11, 1], [12, 1], [13, 1]] }
          - text: "how many more → count the hops"
            say: "For how many more, count only the hops from the smaller number to the larger one. The answer is three, not fourteen and not eleven."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many more is 15 than 12?"
                say: "How many more is fifteen than twelve?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                options: ["3", "15", "27"]
                answer: "3"
                feedback:
                  "27": "You added the two numbers together. The question is how many hops it is from twelve to fifteen."
                  "15": "Fifteen is the greater number. The question is how many hops it is from twelve to fifteen."
                hints:
                  - "Start at twelve."
                  - "Count the hops to fifteen: thirteen, fourteen, fifteen."
                  - "Three hops: 3."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Tom has 17 stickers. Lily has 13. How many more does Tom have?"
                say: "Tom has seventeen stickers and Lily has thirteen. How many more does Tom have?"
                frame: "Tom has _ more."
                options: ["4", "13", "17", "30"]
                answer: ["4"]
                feedback:
                  "17": "That is how many Tom has. The question is how many more he has than Lily."
                  "30": "You added them together. The question is how many more Tom has."
                hints:
                  - "Start at thirteen."
                  - "Fourteen, fifteen, sixteen, seventeen."
                  - "4 more."
              - id: l2-f3
                type: true_false
                text: "Is it true? 18 is 2 more than 16."
                say: "Eighteen is two more than sixteen. Is that true?"
                answer: true
                hints:
                  - "Start at sixteen."
                  - "Seventeen, eighteen."
                  - "Yes, two hops."
              - id: l2-f4
                type: multiple_choice
                text: "How many fewer is 9 than 13?"
                say: "How many fewer is nine than thirteen?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                options: ["4", "9", "3"]
                answer: "4"
                hints:
                  - "Count from nine to thirteen."
                  - "Ten, eleven, twelve, thirteen."
                  - "4."
              - id: l2-f5
                type: multiple_choice
                text: "Ali has 12 marbles. Sara has 10. Who has more, and how many more?"
                say: "Ali has twelve marbles and Sara has ten. Who has more, and how many more?"
                options: ["Ali, 2 more", "Sara, 2 more", "Ali, 12 more"]
                answer: "Ali, 2 more"
                option_audio: false
                hints:
                  - "Twelve is greater than ten."
                  - "From ten to twelve is two hops."
                  - "Ali has 2 more."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many more is 19 than 14?"
                say: "How many more is nineteen than fourteen?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                options: ["5", "19", "4"]
                answer: "5"
                hints: ["Count the hops from fourteen to nineteen."]
              - id: l2-s2
                type: fill_in_blank
                text: "Grandad picked 16 apples. Gran picked 11. How many more did Grandad pick?"
                say: "Grandad picked sixteen apples and Gran picked eleven. How many more did Grandad pick?"
                frame: "Grandad picked _ more."
                options: ["5", "11", "16", "27"]
                answer: ["5"]
                hints: ["Start at the smaller number."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 20 is 10 more than 10."
                say: "Twenty is ten more than ten. Is that true?"
                answer: true
                hints: ["How many tens does each number have?"]
              - id: l2-s4
                type: multiple_choice
                text: "How many fewer is 8 than 11?"
                say: "How many fewer is eight than eleven?"
                options: ["3", "8", "2"]
                answer: "3"
                hints: ["Count from eight to eleven."]
              - id: l2-s5
                type: multiple_choice
                text: "Emma has 13 beads. Paul has 18. Who has more, and how many more?"
                say: "Emma has thirteen beads and Paul has eighteen. Who has more, and how many more?"
                options: ["Paul, 5 more", "Emma, 5 more", "Paul, 18 more", "Paul, a million more"]
                answer: "Paul, 5 more"
                option_audio: false
                feedback:
                  "Paul, a million more": "A million beads would fill the whole house! Count the hops from 13 to 18."
                hints: ["Who has the greater number?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many more is 17 than 15?"
                say: "How many more is seventeen than fifteen?"
                options: ["2", "17", "3"]
                answer: "2"
              - id: l2-n2
                type: fill_in_blank
                text: "There are 14 children on the bus and 4 in the car. How many more are on the bus?"
                say: "There are fourteen children on the bus and four in the car. How many more are on the bus?"
                frame: "_ more on the bus."
                options: ["10", "4", "14", "18"]
                answer: ["10"]
              - id: l2-n3
                type: true_false
                text: "Is it true? 12 is 3 more than 10."
                say: "Twelve is three more than ten. Is that true?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "How many fewer is 16 than 20?"
                say: "How many fewer is sixteen than twenty?"
                options: ["4", "16", "6"]
                answer: "4"
              - id: l2-n5
                type: multiple_choice
                text: "Lina has 19 cards. Max has 15. Who has more, and how many more?"
                say: "Lina has nineteen cards and Max has fifteen. Who has more, and how many more?"
                options: ["Lina, 4 more", "Max, 4 more", "Lina, 19 more"]
                answer: "Lina, 4 more"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: signs
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between thirteen and eight?"
            frame: "13 _ 8"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c2
            part: greatest
            type: multiple_choice
            text: "Which number is the greatest?"
            say: "Which number is the greatest?"
            options: ["14", "18", "11"]
            answer: "18"
            option_audio: false
          - id: l2-c3
            part: difference
            type: multiple_choice
            text: "How many more is 20 than 17?"
            say: "How many more is twenty than seventeen?"
            options: ["3", "20", "37"]
            answer: "3"
          - id: l2-c4
            part: difference
            type: fill_in_blank
            text: "Jack has 15 sweets. Ella has 9. How many more does Jack have?"
            say: "Jack has fifteen sweets and Ella has nine. How many more does Jack have?"
            frame: "Jack has _ more."
            options: ["6", "9", "15", "24"]
            answer: ["6"]
          - id: l2-c5
            part: signs
            type: true_false
            text: "Is it true? 11 > 19"
            say: "Eleven is greater than nineteen. Is that true?"
            answer: false
          - id: l2-c6
            part: signs
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between twelve and nineteen?"
            frame: "12 _ 19"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c7
            part: signs
            type: multiple_choice
            text: "Which one is true?"
            say: "Which one is true?"
            options: ["17 > 17", "17 = 17", "17 < 17"]
            answer: "17 = 17"
          - id: l2-c8
            part: signs
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between ten and six?"
            frame: "10 _ 6"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c9
            part: signs
            type: true_false
            text: "Is it true? 14 > 9"
            say: "Fourteen is greater than nine. Is that true?"
            answer: true
          - id: l2-c10
            part: signs
            type: fill_in_blank
            text: "Which number makes it true?"
            say: "Which number makes it true? Which number is greater than fifteen?"
            frame: "_ > 15"
            options: ["12", "15", "18"]
            answer: ["18"]
          - id: l2-c11
            part: greatest
            type: multiple_choice
            text: "Which number is less?"
            say: "Which number is less, nine or fourteen?"
            options: ["9", "14"]
            answer: "9"
            option_audio: false
          - id: l2-c12
            part: greatest
            type: multiple_choice
            text: "Which number is the smallest?"
            say: "Which number is the smallest?"
            options: ["19", "15", "17"]
            answer: "15"
            option_audio: false
          - id: l2-c13
            part: greatest
            type: multiple_choice
            text: "Which number is the greatest?"
            say: "Which number is the greatest?"
            options: ["12", "9", "16"]
            answer: "16"
            option_audio: false
          - id: l2-c14
            part: greatest
            type: image_multiple_choice
            text: "Which shows the greatest number?"
            say: "Which picture shows the greatest number?"
            options:
              - { drawn: zwanzigerfeld, filled: [10, 2] }
              - { drawn: zwanzigerfeld, filled: [9, 0] }
              - { drawn: zwanzigerfeld, filled: [10, 5] }
            answer: "15"
          - id: l2-c15
            part: greatest
            type: ordering
            text: "Put the numbers in order. Start with the smallest."
            say: "Put the numbers in order. Start with the smallest."
            options: ["18", "11", "9", "15"]
            slot_count: 4
            answer: ["9", "11", "15", "18"]
          - id: l2-c16
            part: difference
            type: multiple_choice
            text: "How many more is 16 than 13?"
            say: "How many more is sixteen than thirteen?"
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            options: ["3", "16", "29"]
            answer: "3"
          - id: l2-c17
            part: difference
            type: true_false
            text: "Is it true? 19 is 2 more than 17."
            say: "Nineteen is two more than seventeen. Is that true?"
            answer: true
          - id: l2-c18
            part: difference
            type: multiple_choice
            text: "How many fewer is 10 than 14?"
            say: "How many fewer is ten than fourteen?"
            options: ["4", "10", "24"]
            answer: "4"
          - id: l2-c19
            part: difference
            type: fill_in_blank
            text: "Zoe has 18 shells. Sam has 12. How many more does Zoe have?"
            say: "Zoe has eighteen shells and Sam has twelve. How many more does Zoe have?"
            frame: "Zoe has _ more."
            options: ["6", "12", "18", "30"]
            answer: ["6"]
          - id: l2-c20
            part: difference
            type: text_input
            text: "How many more is 20 than 12?"
            say: "How many more is twenty than twelve?"
            answer: "8"
