# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.compare-to-20
skill: math.numbers-to-20.compare-to-20
curriculum: en-GB
language: en
title:
  de: Zahlen bis 20 vergleichen
  en: Comparing numbers to 20
summary: >
  Comparing numbers to 20 and saying how many more or fewer. Lesson 1
  compares with more than, less than and equal to, looking at the ten and
  then the ones, and writes <, > and =; lesson 2 finds how many more on a
  number line (15 is 3 more than 12), and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.teens, math.numbers-to-20.compare-to-10]
  also_practises: [math.numbers-to-20.order-to-20]
  vocabulary: { en: [more than, less than, equal to, greater, fewer, how many more] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld, number-line]
  facets: []
  misconceptions:
    - id: bigger-ones-digit
      what: Thinks 9 is greater than 12 because 9 is greater than 2
      addressed: lesson 1 Learn says to look at the ten first; a one-digit number against a teen in every stage, with feedback in the full stage
    - id: difference-as-total
      what: Answers how many more with one of the numbers or the two added together
      addressed: lesson 2 Learn counts only the hops from the smaller number to the larger; options include one of the numbers or the two added together, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Größer oder kleiner, en: More than or less than }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between seven and four?"
            frame: "7 _ 4"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many counters?"
            say: "How many counters are there altogether?"
            show: { drawn: zwanzigerfeld, filled: [10, 4] }
            options: ["14", "4", "41"]
            answer: "14"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "16 > 13"
            say: "Sixteen and thirteen both have one ten. So look at the ones: six is more than three. Sixteen is greater than thirteen."
            show: { drawn: zwanzigerfeld, filled: [10, 6] }
          - text: "12 > 9"
            say: "Twelve and nine: twelve has a ten, nine does not. The number with a ten is greater. Twelve is greater than nine, even though nine has more ones."
          - text: "< · >"
            say: "The sign opens towards the greater number and points at the smaller one. Twelve is greater than nine: twelve, greater than sign, nine."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between fourteen and seventeen?"
                frame: "14 _ 17"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Both have one ten. Look at the ones."
                  - "Four is less than seven."
                  - "14 < 17."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which number is greater?"
                say: "Which number is greater, eleven or eight?"
                options: ["11", "8"]
                answer: "11"
                option_audio: false
                feedback:
                  "8": "Eight has no ten. Eleven has one ten, so eleven is greater."
                hints:
                  - "Which number has a ten?"
                  - "Eleven has a ten."
                  - "11 is greater."
              - id: l1-f3
                type: true_false
                text: "Is it true? 19 > 15"
                say: "Nineteen is greater than fifteen. Is that true?"
                answer: true
                hints:
                  - "Both have one ten."
                  - "Nine ones are more than five."
                  - "Yes."
              - id: l1-f4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between seven and eleven?"
                frame: "7 _ 11"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Does seven have a ten?"
                  - "Eleven has a ten, so eleven is greater."
                  - "7 < 11."
              - id: l1-f5
                type: multiple_choice
                text: "Which number is the smallest?"
                say: "Which number is the smallest?"
                options: ["18", "13", "20"]
                answer: "13"
                option_audio: false
                hints:
                  - "Look at the tens first."
                  - "Twenty has two tens. For eighteen and thirteen, look at the ones."
                  - "13."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between sixteen and eleven?"
                frame: "16 _ 11"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Compare the ones."]
              - id: l1-s2
                type: multiple_choice
                text: "Which number is greater?"
                say: "Which number is greater, seven or fifteen?"
                options: ["7", "15"]
                answer: "15"
                option_audio: false
                hints: ["Which number has a ten?"]
              - id: l1-s3
                type: true_false
                text: "Is it true? 13 < 10"
                say: "Thirteen is less than ten. Is that true?"
                answer: false
                hints: ["How many tens does each number have?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between eighteen and eighteen?"
                frame: "18 _ 18"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Are the numbers different?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which number is the greatest?"
                say: "Which number is the greatest?"
                options: ["19", "9", "17"]
                answer: "19"
                option_audio: false
                hints: ["Tens first, then ones."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between twenty and nineteen?"
                frame: "20 _ 19"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which number is less?"
                say: "Which number is less, twelve or ten?"
                options: ["12", "10"]
                answer: "10"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Is it true? 8 > 14"
                say: "Eight is greater than fourteen. Is that true?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between eleven and thirteen?"
                frame: "11 _ 13"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Which number is the smallest?"
                say: "Which number is the smallest?"
                options: ["16", "12", "14"]
                answer: "12"
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between fifteen and twelve?"
            frame: "15 _ 12"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which number is greater?"
            say: "Which number is greater, nine or thirteen?"
            options: ["9", "13"]
            answer: "13"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? 17 < 20"
            say: "Seventeen is less than twenty. Is that true?"
            answer: true

  - n: 2
    title: { de: "Um wie viel mehr?", en: "How many more?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between ten and fourteen?"
            frame: "10 _ 14"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which number is greater?"
            say: "Which number is greater, sixteen or nineteen?"
            options: ["16", "19"]
            answer: "19"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mia has 14. Ben has 11."
            say: "Mia has fourteen marbles and Ben has eleven. Who has more, and how many more?"
            show: { drawn: zwanzigerfeld, filled: [10, 4] }
          - text: "11 → 14: 3 hops"
            say: "Start at eleven and hop to fourteen: twelve, thirteen, fourteen. That is three hops. Mia has three more."
            show: { drawn: number-line, from: 0, to: 20, labels: tens, jumps: [[11, 1], [12, 1], [13, 1]] }
          - text: "how many more → count the hops"
            say: "For how many more, count only the hops from the smaller number to the larger one. The answer is three, not fourteen and not eleven."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many more is 15 than 12?"
                say: "How many more is fifteen than twelve?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                options: ["3", "15", "27"]
                answer: "3"
                feedback:
                  "27": "You added the two numbers together. The question is how many hops it is from twelve to fifteen."
                  "15": "Fifteen is the greater number. The question is how many hops it is from twelve to fifteen."
                hints:
                  - "Start at twelve."
                  - "Count the hops to fifteen: thirteen, fourteen, fifteen."
                  - "Three hops: 3."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Tom has 17 stickers. Lily has 13. How many more does Tom have?"
                say: "Tom has seventeen stickers and Lily has thirteen. How many more does Tom have?"
                frame: "Tom has _ more."
                options: ["4", "13", "17", "30"]
                answer: ["4"]
                feedback:
                  "17": "That is how many Tom has. The question is how many more he has than Lily."
                  "30": "You added them together. The question is how many more Tom has."
                hints:
                  - "Start at thirteen."
                  - "Fourteen, fifteen, sixteen, seventeen."
                  - "4 more."
              - id: l2-f3
                type: true_false
                text: "Is it true? 18 is 2 more than 16."
                say: "Eighteen is two more than sixteen. Is that true?"
                answer: true
                hints:
                  - "Start at sixteen."
                  - "Seventeen, eighteen."
                  - "Yes, two hops."
              - id: l2-f4
                type: multiple_choice
                text: "How many fewer is 9 than 13?"
                say: "How many fewer is nine than thirteen?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                options: ["4", "9", "3"]
                answer: "4"
                hints:
                  - "Count from nine to thirteen."
                  - "Ten, eleven, twelve, thirteen."
                  - "4."
              - id: l2-f5
                type: multiple_choice
                text: "Ali has 12 marbles. Sara has 10. Who has more, and how many more?"
                say: "Ali has twelve marbles and Sara has ten. Who has more, and how many more?"
                options: ["Ali, 2 more", "Sara, 2 more", "Ali, 12 more"]
                answer: "Ali, 2 more"
                option_audio: false
                hints:
                  - "Twelve is greater than ten."
                  - "From ten to twelve is two hops."
                  - "Ali has 2 more."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many more is 19 than 14?"
                say: "How many more is nineteen than fourteen?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                options: ["5", "19", "4"]
                answer: "5"
                hints: ["Count the hops from fourteen to nineteen."]
              - id: l2-s2
                type: fill_in_blank
                text: "Grandad picked 16 apples. Gran picked 11. How many more did Grandad pick?"
                say: "Grandad picked sixteen apples and Gran picked eleven. How many more did Grandad pick?"
                frame: "Grandad picked _ more."
                options: ["5", "11", "16", "27"]
                answer: ["5"]
                hints: ["Start at the smaller number."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 20 is 10 more than 10."
                say: "Twenty is ten more than ten. Is that true?"
                answer: true
                hints: ["How many tens does each number have?"]
              - id: l2-s4
                type: multiple_choice
                text: "How many fewer is 8 than 11?"
                say: "How many fewer is eight than eleven?"
                options: ["3", "8", "2"]
                answer: "3"
                hints: ["Count from eight to eleven."]
              - id: l2-s5
                type: multiple_choice
                text: "Emma has 13 beads. Paul has 18. Who has more, and how many more?"
                say: "Emma has thirteen beads and Paul has eighteen. Who has more, and how many more?"
                options: ["Paul, 5 more", "Emma, 5 more", "Paul, 18 more"]
                answer: "Paul, 5 more"
                option_audio: false
                hints: ["Who has the greater number?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many more is 17 than 15?"
                say: "How many more is seventeen than fifteen?"
                options: ["2", "17", "3"]
                answer: "2"
              - id: l2-n2
                type: fill_in_blank
                text: "There are 14 children on the bus and 4 in the car. How many more are on the bus?"
                say: "There are fourteen children on the bus and four in the car. How many more are on the bus?"
                frame: "_ more on the bus."
                options: ["10", "4", "14", "18"]
                answer: ["10"]
              - id: l2-n3
                type: true_false
                text: "Is it true? 12 is 3 more than 10."
                say: "Twelve is three more than ten. Is that true?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "How many fewer is 16 than 20?"
                say: "How many fewer is sixteen than twenty?"
                options: ["4", "16", "6"]
                answer: "4"
              - id: l2-n5
                type: multiple_choice
                text: "Lina has 19 cards. Max has 15. Who has more, and how many more?"
                say: "Lina has nineteen cards and Max has fifteen. Who has more, and how many more?"
                options: ["Lina, 4 more", "Max, 4 more", "Lina, 19 more"]
                answer: "Lina, 4 more"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between thirteen and eight?"
            frame: "13 _ 8"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Which number is the greatest?"
            say: "Which number is the greatest?"
            options: ["14", "18", "11"]
            answer: "18"
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "How many more is 20 than 17?"
            say: "How many more is twenty than seventeen?"
            options: ["3", "20", "37"]
            answer: "3"
          - id: l2-c4
            type: fill_in_blank
            text: "Jack has 15 sweets. Ella has 9. How many more does Jack have?"
            say: "Jack has fifteen sweets and Ella has nine. How many more does Jack have?"
            frame: "Jack has _ more."
            options: ["6", "9", "15", "24"]
            answer: ["6"]
          - id: l2-c5
            type: true_false
            text: "Is it true? 11 > 19"
            say: "Eleven is greater than nineteen. Is that true?"
            answer: false
