# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.sub-to-10
skill: math.add-sub-to-20.sub-to-10
curriculum: en-GB
language: en
title:
  de: Minusaufgaben bis 10
  en: Subtracting to 10
summary: >
  Subtracting within 10 by taking away in the ten frame and by counting
  back on the number line. Lesson 1 takes away and counts back within 5,
  with zero; lesson 2 works within 10, takes away a whole row of five at
  once, and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.sub-meaning]
  also_practises: [math.add-sub-to-20.add-to-10]
  vocabulary: { en: [subtract, take away, count back, equals, left, zero] }
  forms: [drawn, text, audio]
  drawn: [ten-frame, number-line]
  facets: []
  misconceptions:
    - id: count-back-includes-start
      what: Counts the start number when counting back (5 − 2 as "five, four", so 4)
      addressed: Learn says the first hop lands on the number before; jumps on the number line show it, with feedback on l1-f2
    - id: subtract-smaller-from-larger
      what: Takes the smaller from the larger whatever the order (2 − 5 = 3)
      addressed: kept for later; every subtraction here starts with the bigger number, and Learn says the first number is where you start (screen 2)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Wegnehmen und rückwärts zählen, en: Taking away and counting back }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many are left?"
            say: "How many counters are left?"
            show: { drawn: ten-frame, filled: 5, cross: 1 }
            options: ["3", "4", "5"]
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What comes before 4?"
            say: "Which number comes just before four?"
            options: ["3", "5", "2"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5 − 2 = ?"
            say: "Five subtract two. In the ten frame we cross out two counters. Three are left."
            show: { drawn: ten-frame, filled: 5, cross: 2 }
          - text: "5 … 4, 3"
            say: "Or use the number line. The first number is where you start: start at five and count back two hops. Four, three."
            show: { drawn: number-line, from: 0, to: 10, labels: all, jumps: [[5, -1], [4, -1]] }
          - text: "5 − 2 = 3"
            say: "Five subtract two equals three. When you count back, the first hop lands on the number before."
          - text: "4 − 0 = 4"
            say: "And subtract zero? Then nothing is taken away. Four subtract zero is four."
            show: { drawn: ten-frame, filled: 4 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "4 − 1 = ?"
                say: "Four subtract one. How many are left?"
                show: { drawn: ten-frame, filled: 4, cross: 1 }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Count the counters with no cross."
                  - "Four, and one is gone."
                  - "4 − 1 = 3."
                difficulty: easy
              - id: l1-f2
                type: point_on_line
                text: "Where do you land? 5 − 3"
                say: "Start at five. Count back three hops. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 2
                feedback:
                  "3": "The first hop back lands on four. Four, three, two."
                hints:
                  - "The first hop lands on four."
                  - "Four, three, two."
                  - "You land on 2."
              - id: l1-f3
                type: text_input
                text: "3 − 1 = _"
                say: "Three subtract one."
                answer: "2"
                hints:
                  - "Start at 3."
                  - "Count back one."
                  - "2."
              - id: l1-f4
                type: true_false
                text: "Is it true? 5 − 1 = 4"
                answer: true
                hints:
                  - "Count back one from 5."
                  - "Four."
                  - "Yes."
              - id: l1-f5
                type: multiple_choice
                text: "5 − 4 = ?"
                say: "Five subtract four. How many are left?"
                show: { drawn: ten-frame, filled: 5, cross: 4 }
                options: ["1", "2", "4"]
                answer: "1"
                hints:
                  - "Four are crossed out."
                  - "Count what is left."
                  - "1."
              - id: l1-f6
                type: text_input
                text: "4 − 2 = _"
                say: "Four subtract two."
                answer: "2"
                hints:
                  - "Count back two from 4."
                  - "Three, two."
                  - "2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "3 − 2 = ?"
                say: "Three subtract two. How many are left?"
                show: { drawn: ten-frame, filled: 3, cross: 2 }
                options: ["1", "2", "3"]
                answer: "1"
                hints: ["Count the ones with no cross."]
              - id: l1-s2
                type: point_on_line
                text: "Where do you land? 4 − 3"
                say: "Start at four. Count back three hops. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 1
                hints: ["Count back three hops from four."]
              - id: l1-s3
                type: text_input
                text: "5 − 2 = _"
                say: "Five subtract two."
                answer: "3"
                hints: ["Count back two from five."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 4 − 1 = 5"
                answer: false
                hints: ["Taking away leaves fewer."]
              - id: l1-s5
                type: multiple_choice
                text: "5 − 5 = ?"
                say: "Five subtract five."
                options: ["0", "1", "5"]
                answer: "0"
                hints: ["What is left if you take them all away?"]
              - id: l1-s6
                type: text_input
                text: "2 − 1 = _"
                say: "Two subtract one."
                answer: "1"
                hints: ["Count back one from two."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "4 − 3 = ?"
                say: "Four subtract three."
                show: { drawn: ten-frame, filled: 4, cross: 3 }
                options: ["1", "2", "3"]
                answer: "1"
              - id: l1-n2
                type: point_on_line
                text: "Where do you land? 5 − 2"
                say: "Start at five. Count back two hops. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 3
              - id: l1-n3
                type: text_input
                text: "3 − 3 = _"
                say: "Three subtract three."
                answer: "0"
              - id: l1-n4
                type: true_false
                text: "Is it true? 5 − 3 = 2"
                answer: true
              - id: l1-n5
                type: text_input
                text: "4 − 0 = _"
                say: "Four subtract zero."
                answer: "4"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "5 − 1 = _"
            say: "Five subtract one."
            answer: "4"
          - id: l1-c2
            type: multiple_choice
            text: "4 − 2 = ?"
            say: "Four subtract two."
            show: { drawn: ten-frame, filled: 4, cross: 2 }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c3
            type: point_on_line
            text: "Where do you land? 3 − 2"
            say: "Start at three. Count back two hops. Where do you land?"
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 1

  - n: 2
    title: { de: Minus bis 10, en: Subtracting within 10 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "5 − 2 = _"
            say: "Five subtract two. Write the answer."
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4 − 1 = ?"
            say: "Four subtract one."
            options: ["3", "4", "5"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 − 5 = ?"
            say: "Eight subtract five. The top row of the ten frame is five. We can take the whole row away at once."
            show: { drawn: ten-frame, filled: 8, cross: 5, cross_from: start }
          - text: "8 − 5 = 3"
            say: "Three are left on the bottom row. Eight subtract five equals three. Knowing your fives helps with taking away too."
          - text: "9 − 2: 8, 7"
            say: "When you take away only a few, count back: nine subtract two. Eight, seven."
            show: { drawn: number-line, from: 0, to: 10, labels: all, jumps: [[9, -1], [8, -1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "7 − 5 = ?"
                say: "Seven subtract five. How many are left?"
                show: { drawn: ten-frame, filled: 7, cross: 5, cross_from: start }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "The whole top row is crossed out."
                  - "Count the counters on the bottom row."
                  - "7 − 5 = 2."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "9 − 2 = _"
                say: "Nine subtract two."
                answer: "7"
                hints:
                  - "Count back two from 9."
                  - "Eight, seven."
                  - "7."
              - id: l2-f3
                type: point_on_line
                text: "Where do you land? 10 − 3"
                say: "Start at ten. Count back three hops. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 7
                hints:
                  - "The first hop lands on nine."
                  - "Nine, eight, seven."
                  - "You land on 7."
              - id: l2-f4
                type: multiple_choice
                text: "10 − 5 = ?"
                say: "Ten subtract five. How many are left?"
                show: { drawn: ten-frame, filled: 10, cross: 5, cross_from: start }
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "One full row is crossed out."
                  - "One full row is left."
                  - "5."
              - id: l2-f5
                type: true_false
                text: "Is it true? 8 − 1 = 7"
                answer: true
                hints:
                  - "Count back one from 8."
                  - "Seven."
                  - "Yes."
              - id: l2-f6
                type: text_input
                text: "6 − 3 = _"
                say: "Six subtract three."
                answer: "3"
                hints:
                  - "Count back three from 6."
                  - "Five, four, three."
                  - "3."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "9 − 5 = ?"
                say: "Nine subtract five. How many are left?"
                show: { drawn: ten-frame, filled: 9, cross: 5, cross_from: start }
                options: ["3", "4", "5"]
                answer: "4"
                hints: ["The top row is crossed out."]
              - id: l2-s2
                type: text_input
                text: "8 − 2 = _"
                say: "Eight subtract two."
                answer: "6"
                hints: ["Count back two from eight."]
              - id: l2-s3
                type: point_on_line
                text: "Where do you land? 7 − 4"
                say: "Start at seven. Count back four hops. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 3
                hints: ["Count back four hops from seven."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 10 − 2 = 7"
                answer: false
                hints: ["Count back two from ten."]
              - id: l2-s5
                type: multiple_choice
                text: "6 − 5 = ?"
                say: "Six subtract five. How many are left?"
                show: { drawn: ten-frame, filled: 6, cross: 5, cross_from: start }
                options: ["0", "1", "2"]
                answer: "1"
                hints: ["The top row is crossed out."]
              - id: l2-s6
                type: text_input
                text: "9 − 3 = _"
                say: "Nine subtract three."
                answer: "6"
                hints: ["Count back three from nine."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "8 − 5 = ?"
                say: "Eight subtract five."
                show: { drawn: ten-frame, filled: 8, cross: 5, cross_from: start }
                options: ["2", "3", "4"]
                answer: "3"
              - id: l2-n2
                type: text_input
                text: "10 − 4 = _"
                say: "Ten subtract four."
                answer: "6"
              - id: l2-n3
                type: point_on_line
                text: "Where do you land? 9 − 6"
                say: "Start at nine. Count back six hops. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 3
              - id: l2-n4
                type: true_false
                text: "Is it true? 7 − 2 = 5"
                answer: true
              - id: l2-n5
                type: text_input
                text: "6 − 6 = _"
                say: "Six subtract six."
                answer: "0"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "8 − 0 = _"
            say: "Eight subtract zero. Write the answer."
            answer: "8"
          - id: l2-c2
            type: multiple_choice
            text: "9 − 4 = ?"
            say: "Nine subtract four."
            options: ["6", "4", "5"]
            answer: "5"
          - id: l2-c3
            type: text_input
            text: "8 − 3 = _"
            say: "Eight subtract three. Write the answer."
            answer: "5"
          - id: l2-c4
            type: point_on_line
            text: "Where do you land? 10 − 6"
            say: "Start at ten. Count back six hops. Where do you land?"
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 4
          - id: l2-c5
            type: multiple_choice
            text: "7 − 1 = ?"
            say: "Seven subtract one."
            options: ["5", "6", "8"]
            answer: "6"
