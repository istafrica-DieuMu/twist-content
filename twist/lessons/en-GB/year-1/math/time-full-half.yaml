# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.time-full-half
skill: math.time.full-half-hour
curriculum: en-GB
language: en
title:
  de: Volle und halbe Stunden
  en: O'clock and half past
summary: >
  Telling the time to the hour and half past the hour. Lesson 1 reads
  o'clock on an analogue clock (the long minute hand on 12, the short
  hour hand on the hour) and on a digital clock (3:00); lesson 2 reads
  half past (the minute hand on 6, the hour hand halfway to the next
  number, 3:30 on a digital clock), sets a time by choosing the clock
  face that shows it, and ends with the skill check. Every practise stage
  and both checks also ask the child to set the hands (clock_hands_drag).
metadata:
  year: year-1
  topic: { de: Uhrzeit, en: Telling the time }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.order-to-20]
  also_practises: []
  vocabulary: { en: [clock, o'clock, half past, hour, minute, hour hand, minute hand, digital] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: [time-format]
  parts:
    - { id: oclock, what: { de: volle Stunden ablesen, en: "reading o'clock times" } }
    - { id: half-past, what: { de: halbe Stunden ablesen, en: reading half past times } }
    - { id: set, what: { de: die Zeiger auf eine Uhrzeit stellen, en: setting the hands to a time } }
    - { id: digital, what: { de: die Uhrzeit auf der Digitaluhr lesen, en: reading the time on a digital clock } }
  misconceptions:
    - id: hands-swapped
      what: Reads the long minute hand as the hour (sees 12 o'clock when the minute hand is on 12)
      addressed: lesson 1 Learn names the short hour hand and the long minute hand; l1-f2 (with feedback), l1-s2 and l1-f3, whose distractor clock has the hands swapped; l1-c2 and l2-n3 set the hands, with feedback for the swapped hands
    - id: half-past-next-hour
      what: At half past, reads the hour the short hand is moving towards (half past 3 read as half past 4)
      addressed: lesson 2 Learn shows the hour hand halfway between 3 and 4 and says to read the number it has passed; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c2 offer the next hour
    - id: digital-30-is-hour
      what: Reads 4:30 on a digital clock as 4 o'clock, or 4:00 as half past 4
      addressed: lesson 2 Learn puts 3:00 and 3:30 side by side; l2-f4 (with feedback), l2-s4 and l2-c4 offer o'clock for a :30 time
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Volle Stunden", en: "O'clock" }
    goal:
      de: "Lies volle Stunden ab, wenn der lange Zeiger auf die 12 zeigt, so wie drei Uhr."
      en: "Tell the time when the long hand points to 12, like three o'clock."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What comes after 11?"
            say: "Which number comes after eleven?"
            options: ["12", "10", "13"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Fill in the missing numbers."
            say: "Fill in the numbers that come before and after seven."
            frame: "_ , 7, _"
            options: ["5", "6", "8", "9"]
            answer: ["6", "8"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Long hand or short hand?"
            say: "This clock has two hands, a long one and a short one. Which one do you think shows the hour? Have a guess."
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "3 o'clock"
            say: "The short one! The long hand is the minute hand. The short hand is the hour hand. The minute hand points to twelve, and the hour hand points to three. It is three o'clock."
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "8 o'clock"
            say: "When the minute hand points straight up to twelve, it is something o'clock. Look at the short hour hand to see which hour. Here it points to eight. It is eight o'clock."
            show: { drawn: clock, hour: 8, minute: 0 }
          - text: "3:00"
            say: "A digital clock shows the time in numbers. The number before the two dots is the hour. Three, then zero zero, means three o'clock."
            show: { drawn: clock, hour: 3, minute: 0, digital: true }
          - text: "Did you know? Big Ben is a bell, not a clock."
            say: "Did you know? Big Ben, in London, is not the name of the clock on the tall tower. It is the name of the giant bell inside it. Every hour, on the hour, Big Ben rings out: bong!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: clock_hands_drag
                text: "Show 5 o'clock on the clock."
                say: "Show five o'clock on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "5:00"
                feedback:
                  "5:30": "At 5 o'clock the long minute hand points to 12, not to 6."
                hints:
                  - "At o'clock the long minute hand points to 12."
                  - "The short hour hand shows the hour. Which number does it need to point to?"
                  - "Leave the long hand on 12 and drag the short hand to 5."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What time is it?"
                say: "Look at the clock. What time is it?"
                show: { drawn: clock, hour: 9, minute: 0 }
                options: ["9 o'clock", "12 o'clock", "10 o'clock"]
                answer: "9 o'clock"
                feedback:
                  "12 o'clock": "The long hand is on 12, but it is the minute hand. Look at the short hour hand."
                hints:
                  - "Which hand shows the hour?"
                  - "The long hand points to 12. The short hand points to another number."
                  - "9 o'clock."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which clock shows 2 o'clock?"
                say: "Which clock shows two o'clock?"
                options:
                  - { drawn: clock, hour: 2, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 10 }
                  - { drawn: clock, hour: 4, minute: 0 }
                answer: "2:00"
                hints:
                  - "At two o'clock the long minute hand points to 12."
                  - "The short hour hand points to 2."
                  - "The clock with the short hand on 2 and the long hand on 12."
              - id: l1-f4
                type: true_false
                text: "Is it 7 o'clock?"
                say: "Look at the clock. Is it seven o'clock?"
                show: { drawn: clock, hour: 7, minute: 0 }
                answer: true
                hints:
                  - "Look at the short hour hand."
                  - "Which number does it point to? Is the long hand on 12?"
                  - "Yes, it is 7 o'clock."
              - id: l1-f5
                type: multiple_choice
                text: "What time does the digital clock show?"
                say: "The digital clock shows four, then zero zero. What time is it?"
                show: { drawn: clock, hour: 4, minute: 0, digital: true }
                options: ["4 o'clock", "5 o'clock", "half past 4", "snack o'clock"]
                answer: "4 o'clock"
                feedback:
                  "snack o'clock": "Snack o'clock sounds good, but there is no such time! Read the number before the dots."
                hints:
                  - "The number before the two dots is the hour."
                  - "Zero zero after the dots means o'clock."
                  - "4 o'clock."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What time is it?"
                say: "Look at the clock. What time is it?"
                show: { drawn: clock, hour: 10, minute: 0 }
                options: ["10 o'clock", "11 o'clock", "9 o'clock"]
                answer: "10 o'clock"
                hints: ["Look at the short hour hand."]
              - id: l1-s2
                type: multiple_choice
                text: "What time is it?"
                say: "Look at the clock. What time is it?"
                show: { drawn: clock, hour: 6, minute: 0 }
                options: ["6 o'clock", "12 o'clock", "half past 12"]
                answer: "6 o'clock"
                hints: ["The long hand is the minute hand. The short hand shows the hour."]
              - id: l1-s3
                type: clock_hands_drag
                text: "Show 11 o'clock on the clock."
                say: "Show eleven o'clock on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "11:00"
                feedback:
                  "1:00": "That is 1 o'clock. Drag the short hand to 11."
                hints: ["The short hand points to 11, the long hand to 12."]
              - id: l1-s4
                type: true_false
                text: "Is it 1 o'clock?"
                say: "Look at the digital clock. Is it one o'clock?"
                show: { drawn: clock, hour: 7, minute: 0, digital: true }
                answer: false
                hints: ["Read the number before the two dots."]
              - id: l1-s5
                type: multiple_choice
                text: "School starts at 9:00. What time is that?"
                say: "School starts at nine, zero zero. What time is that?"
                options: ["9 o'clock", "half past 9", "12 o'clock"]
                answer: "9 o'clock"
                hints: ["Zero zero after the dots means o'clock."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Lunch is ready! What time is it?"
                say: "Lunch is ready! Look at the clock. What time is it?"
                show: { drawn: clock, hour: 12, minute: 0 }
                options: ["12 o'clock", "11 o'clock", "1 o'clock"]
                answer: "12 o'clock"
              - id: l1-n2
                type: image_multiple_choice
                text: "Which clock shows 8 o'clock?"
                say: "Which clock shows eight o'clock?"
                options:
                  - { drawn: clock, hour: 12, minute: 40 }
                  - { drawn: clock, hour: 9, minute: 0 }
                  - { drawn: clock, hour: 8, minute: 0 }
                answer: "8:00"
              - id: l1-n3
                type: clock_hands_drag
                text: "Show 4 o'clock on the clock."
                say: "Show four o'clock on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "4:00"
                feedback:
                  "4:30": "At 4 o'clock the long minute hand points to 12."
              - id: l1-n4
                type: true_false
                text: "Is it 11 o'clock?"
                say: "Look at the digital clock. Is it eleven o'clock?"
                show: { drawn: clock, hour: 11, minute: 0, digital: true }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Tea is at 5:00. What time is that?"
                say: "Tea is at five, zero zero. What time is that?"
                options: ["5 o'clock", "half past 5", "10 o'clock"]
                answer: "5 o'clock"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What time is it?"
            say: "Look at the clock. What time is it?"
            show: { drawn: clock, hour: 2, minute: 0 }
            options: ["2 o'clock", "12 o'clock", "3 o'clock"]
            answer: "2 o'clock"
          - id: l1-c2
            type: clock_hands_drag
            text: "Show 6 o'clock on the clock."
            say: "Show six o'clock on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 30
            answer: "6:00"
            feedback:
              "12:30": "You swapped the hands. The short hour hand goes on 6 and the long minute hand stays on 12."
          - id: l1-c3
            type: true_false
            text: "Is it 3 o'clock?"
            say: "Look at the clock. Is it three o'clock?"
            show: { drawn: clock, hour: 3, minute: 0 }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "What time is it?"
            say: "Look at the clock. What time is it?"
            show: { drawn: clock, hour: 7, minute: 0 }
            options: ["7 o'clock", "12 o'clock", "8 o'clock"]
            answer: "7 o'clock"
          - id: l1-c5
            type: clock_hands_drag
            text: "Show 9 o'clock on the clock."
            say: "Show nine o'clock on the clock. Drag the hands."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 30
            answer: "9:00"
          - id: l1-c6
            type: true_false
            text: "Is it 6 o'clock?"
            say: "Look at the digital clock. Is it six o'clock?"
            show: { drawn: clock, hour: 8, minute: 0, digital: true }
            answer: false

  - n: 2
    title: { de: "Halbe Stunden", en: "Half past" }
    goal:
      de: "Lies halbe Stunden ab, wenn der lange Zeiger auf die 6 zeigt, so wie halb vier."
      en: "Tell the time when the long hand points to 6, like half past three."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What time is it?"
            say: "Look at the clock. What time is it?"
            show: { drawn: clock, hour: 1, minute: 0 }
            options: ["1 o'clock", "12 o'clock", "2 o'clock"]
            answer: "1 o'clock"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it 10 o'clock?"
            say: "Look at the digital clock. Is it ten o'clock?"
            show: { drawn: clock, hour: 10, minute: 0, digital: true }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Where will the long hand go?"
            say: "At three o'clock the long hand points up to twelve. Half an hour later, where do you think it will point? Have a guess."
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "half past 3"
            say: "Down to six! Now the long minute hand points down to six. It has gone halfway round the clock, so it is half past. The short hour hand has gone past three, halfway to four. It is half past three."
            show: { drawn: clock, hour: 3, minute: 30 }
          - text: "Read the number the hour hand has passed."
            say: "At half past, the hour hand sits between two numbers. Read the number it has just passed, not the one it is going to. Here it has passed seven, so it is half past seven."
            show: { drawn: clock, hour: 7, minute: 30 }
          - text: "3:00 and 3:30"
            say: "On a digital clock, three, zero zero is three o'clock. Three, thirty is half past three. Thirty minutes is half an hour."
            show: { drawn: clock, hour: 3, minute: 30, digital: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What time is it?"
                say: "Look at the clock. What time is it?"
                show: { drawn: clock, hour: 2, minute: 30 }
                options: ["half past 2", "2 o'clock", "6 o'clock"]
                answer: "half past 2"
                hints:
                  - "Where does the long minute hand point?"
                  - "It points to 6, so it is half past. The short hand has passed 2."
                  - "Half past 2."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What time is it?"
                say: "Look at the clock. What time is it?"
                show: { drawn: clock, hour: 5, minute: 30 }
                options: ["half past 5", "half past 6", "5 o'clock"]
                answer: "half past 5"
                feedback:
                  "half past 6": "The hour hand is on its way to 6, but it has not got there. It has passed 5."
                hints:
                  - "The minute hand is on 6, so it is half past."
                  - "The hour hand is between 5 and 6. Which number has it passed?"
                  - "Half past 5."
              - id: l2-f3
                type: clock_hands_drag
                text: "Show half past 9 on the clock."
                say: "Show half past nine on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "9:30"
                feedback:
                  "9:00": "That is 9 o'clock. At half past, the long minute hand points to 6."
                  "10:30": "That is half past 10. At half past 9 the short hand has just passed 9."
                hints:
                  - "At half past, the long minute hand points to 6."
                  - "The short hour hand has just passed 9, on its way to 10."
                  - "Drag the long hand to 6 and the short hand to 9. It moves on to halfway between 9 and 10."
              - id: l2-f4
                type: multiple_choice
                text: "What time does the digital clock show?"
                say: "The digital clock shows four, thirty. What time is it?"
                show: { drawn: clock, hour: 4, minute: 30, digital: true }
                options: ["half past 4", "4 o'clock", "half past 3"]
                answer: "half past 4"
                feedback:
                  "4 o'clock": "4 o'clock is 4:00. Thirty after the dots means half past."
                hints:
                  - "The number before the dots is the hour."
                  - "Thirty minutes after the hour is half past."
                  - "Half past 4."
              - id: l2-f5
                type: true_false
                text: "Is it half past 11?"
                say: "Look at the clock. Is it half past eleven?"
                show: { drawn: clock, hour: 11, minute: 30 }
                answer: true
                hints:
                  - "Is the long minute hand on 6?"
                  - "The short hand has passed 11."
                  - "Yes, it is half past 11."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What time is it?"
                say: "Look at the clock. What time is it?"
                show: { drawn: clock, hour: 8, minute: 30 }
                options: ["half past 8", "8 o'clock", "half past 6"]
                answer: "half past 8"
                hints: ["The long hand on 6 means half past."]
              - id: l2-s2
                type: multiple_choice
                text: "What time is it?"
                say: "Look at the clock. What time is it?"
                show: { drawn: clock, hour: 1, minute: 30 }
                options: ["half past 1", "half past 2", "1 o'clock"]
                answer: "half past 1"
                hints: ["Read the number the hour hand has passed."]
              - id: l2-s3
                type: clock_hands_drag
                text: "Show half past 4 on the clock."
                say: "Show half past four on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "4:30"
                feedback:
                  "4:00": "That is 4 o'clock. At half past, the long hand points to 6."
                  "5:30": "That is half past 5. At half past 4 the short hand has just passed 4."
                hints: ["The long hand on 6 means half past. The short hand has passed 4."]
              - id: l2-s4
                type: multiple_choice
                text: "What time does the digital clock show?"
                say: "The digital clock shows seven, thirty. What time is it?"
                show: { drawn: clock, hour: 7, minute: 30, digital: true }
                options: ["half past 7", "7 o'clock", "half past 8"]
                answer: "half past 7"
                hints: ["Thirty after the dots means half past."]
              - id: l2-s5
                type: true_false
                text: "Is it half past 12?"
                say: "Look at the clock. Is it half past twelve?"
                show: { drawn: clock, hour: 6, minute: 0 }
                answer: false
                hints: ["Which hand is long and which is short?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The bus comes at this time. What time is it?"
                say: "The bus comes at this time. Look at the clock. What time is it?"
                show: { drawn: clock, hour: 10, minute: 30 }
                options: ["half past 10", "10 o'clock", "half past 6"]
                answer: "half past 10"
              - id: l2-n2
                type: multiple_choice
                text: "What time is it?"
                say: "Look at the clock. What time is it?"
                show: { drawn: clock, hour: 6, minute: 30 }
                options: ["half past 6", "half past 7", "6 o'clock"]
                answer: "half past 6"
              - id: l2-n3
                type: clock_hands_drag
                text: "Show half past 3 on the clock."
                say: "Show half past three on the clock. Drag the hands."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "3:30"
                feedback:
                  "4:30": "That is half past 4. At half past 3 the short hand has just passed 3."
                  "3:00": "That is 3 o'clock. At half past, the long hand points to 6."
              - id: l2-n4
                type: true_false
                text: "Is it 2 o'clock?"
                say: "Look at the digital clock. Is it two o'clock?"
                show: { drawn: clock, hour: 2, minute: 30, digital: true }
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Swimming starts at half past 4. Which digital time is that?"
                say: "Swimming starts at half past four. Which time is that on a digital clock?"
                options: ["4:30", "4:00", "5:30"]
                answer: "4:30"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: oclock
            type: multiple_choice
            text: "What time is it?"
            say: "Look at the clock. What time is it?"
            show: { drawn: clock, hour: 11, minute: 0 }
            options: ["11 o'clock", "12 o'clock", "half past 11"]
            answer: "11 o'clock"
          - id: l2-c2
            part: half-past
            type: multiple_choice
            text: "What time is it?"
            say: "Look at the clock. What time is it?"
            show: { drawn: clock, hour: 9, minute: 30 }
            options: ["half past 9", "half past 10", "9 o'clock"]
            answer: "half past 9"
          - id: l2-c3
            part: set
            type: clock_hands_drag
            text: "Show half past 12 on the clock."
            say: "Show half past twelve on the clock. Drag the hands."
            show: { drawn: clock, hour: 3, minute: 0 }
            step: 30
            answer: "12:30"
            feedback:
              "6:00": "You swapped the hands. The long minute hand goes on 6 and the short hour hand just past 12."
              "1:30": "That is half past 1. At half past 12 the short hand has just passed 12."
          - id: l2-c4
            part: digital
            type: multiple_choice
            text: "What time does the digital clock show?"
            say: "The digital clock shows one, thirty. What time is it?"
            show: { drawn: clock, hour: 1, minute: 30, digital: true }
            options: ["half past 1", "1 o'clock", "half past 2"]
            answer: "half past 1"
          - id: l2-c5
            part: oclock
            type: image_multiple_choice
            text: "Which clock shows 5 o'clock?"
            say: "Which clock shows five o'clock?"
            options:
              - { drawn: clock, hour: 12, minute: 25 }
              - { drawn: clock, hour: 5, minute: 0 }
              - { drawn: clock, hour: 5, minute: 30 }
            answer: "5:00"
          - id: l2-c6
            part: oclock
            type: multiple_choice
            text: "What time is it?"
            say: "Look at the clock. What time is it?"
            show: { drawn: clock, hour: 4, minute: 0 }
            options: ["4 o'clock", "12 o'clock", "half past 4"]
            answer: "4 o'clock"
          - id: l2-c7
            part: oclock
            type: true_false
            text: "Is it 8 o'clock?"
            say: "Look at the clock. Is it eight o'clock?"
            show: { drawn: clock, hour: 9, minute: 0 }
            answer: false
          - id: l2-c8
            part: oclock
            type: image_multiple_choice
            text: "Which clock shows 10 o'clock?"
            say: "Which clock shows ten o'clock?"
            options:
              - { drawn: clock, hour: 11, minute: 0 }
              - { drawn: clock, hour: 10, minute: 0 }
              - { drawn: clock, hour: 12, minute: 50 }
            answer: "10:00"
          - id: l2-c9
            part: half-past
            type: multiple_choice
            text: "What time is it?"
            say: "Look at the clock. What time is it?"
            show: { drawn: clock, hour: 4, minute: 30 }
            options: ["half past 4", "half past 5", "4 o'clock"]
            answer: "half past 4"
          - id: l2-c10
            part: half-past
            type: true_false
            text: "Is it half past 6?"
            say: "Look at the clock. Is it half past six?"
            show: { drawn: clock, hour: 5, minute: 30 }
            answer: false
          - id: l2-c11
            part: half-past
            type: image_multiple_choice
            text: "Which clock shows half past 2?"
            say: "Which clock shows half past two?"
            options:
              - { drawn: clock, hour: 3, minute: 30 }
              - { drawn: clock, hour: 2, minute: 0 }
              - { drawn: clock, hour: 2, minute: 30 }
            answer: "2:30"
          - id: l2-c12
            part: half-past
            type: multiple_choice
            text: "What time is it?"
            say: "Look at the clock. What time is it?"
            show: { drawn: clock, hour: 12, minute: 30 }
            options: ["half past 12", "half past 1", "12 o'clock"]
            answer: "half past 12"
          - id: l2-c13
