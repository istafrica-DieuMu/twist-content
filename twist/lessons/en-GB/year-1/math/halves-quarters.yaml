# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.halves-quarters
skill: math.fractions.halves-quarters
curriculum: en-GB
language: en
title:
  de: Hälften und Viertel
  en: Halves and quarters
summary: >
  Lesson 1 splits a shape into two equal parts, a half each, checks
  whether two parts really are halves (a bar split 2 and 2 against one
  split 3 and 1 on squared paper), and finds half of a small amount;
  lesson 2 splits a shape into four equal parts, a quarter each, finds a
  quarter of a small amount, learns that two quarters make a half and a
  quarter is smaller than a half, and ends with the skill check. Folding
  or cutting a shape waits for a drawing task.
metadata:
  year: year-1
  topic: { de: Brüche, en: Fractions }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.double-halve-to-20]
  also_practises: [math.numbers-to-20.double-halve-to-20]
  vocabulary: { en: [whole, half, halves, quarter, quarters, equal parts, the same size, share, fair] }
  forms: [drawn, text, audio]
  drawn: [fraction, grid, dots]
  facets: []
  parts:
    - { id: equal, what: { de: "erkennen, ob Teile gleich groß sind", en: telling whether parts are the same size } }
    - { id: half, what: { de: eine Hälfte erkennen und finden, en: recognising and finding a half } }
    - { id: quarter, what: { de: ein Viertel erkennen und finden, en: recognising and finding a quarter } }
    - { id: compare, what: { de: Hälften und Viertel vergleichen, en: comparing halves and quarters } }
  misconceptions:
    - id: unequal-parts
      what: Calls any two parts halves or any four parts quarters, even when the parts are not the same size
      addressed: lesson 1 Learn shows a bar split 3 and 1 that is not in halves; l1-f3 (with feedback), l1-s3, l1-n3, l2-s5 and l2-c5 show unequal parts
    - id: quarter-bigger
      what: Thinks a quarter is bigger than a half because 4 is bigger than 2
      addressed: lesson 2 Learn halves a half to make a quarter; l2-f4 (with feedback), l2-s4 and l2-n4 compare a quarter and a half
    - id: half-is-two
      what: Thinks half of an amount is always 2, or takes away 2 instead of sharing into two equal groups
      addressed: lesson 1 Learn shares 8 into two rows of 4; l1-f4 (with feedback), l1-s4 and l1-n4 find half of an amount bigger than 4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Hälften", en: "Halves" }
    goal:
      de: "Teile etwas in zwei gleich große Teile, die Hälften, und finde die Hälfte von 8."
      en: "Split something into two equal parts called halves, and find half of 8."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Double 4 = _"
            say: "What is double four?"
            options: ["8", "6", "4"]
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Half of 10 = _"
            say: "What is half of ten?"
            options: ["5", "2", "8"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "How can two friends share a pizza fairly?"
            say: "Two friends want to share one pizza fairly. How do you think they should cut it? Have a guess."
            show: { object: pizza }
          - text: "one half"
            say: "Cut it into two parts that are exactly the same size. This circle is split into two equal parts. Each part is one half. One half is coloured red."
            show: { drawn: fraction, kind: circle, parts: 2, shaded: 1, colour: red }
          - text: "Two parts, but not halves"
            say: "This bar is split into two parts too, but one part is much bigger than the other. They are not the same size, so they are not halves. Halves must be equal."
            show: { drawn: grid, cols: 4, rows: 1, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, yellow]], lines: [[3, 0, 3, 1]] }
          - text: "Half of 8 is 4."
            say: "To find half of eight, share the eight counters into two equal groups. Each row has four. Half of eight is four."
            show: { drawn: dots, array: [2, 4], split_rows: 1 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Is it true? This rectangle is split into halves."
                say: "Look at the rectangle. Is it split into two halves?"
                show: { drawn: fraction, kind: rect, parts: 2, rows: 1, shaded: 1, colour: blue }
                answer: true
                hints:
                  - "How many parts are there?"
                  - "Are the two parts the same size?"
                  - "Yes. Two equal parts are halves."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Where is one half coloured?"
                say: "Tap the shape that has one half coloured."
                options:
                  - { drawn: fraction, kind: circle, parts: 2, shaded: 1, colour: green }
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 1, colour: green }
                  - { drawn: fraction, kind: circle, parts: 1, shaded: 1, colour: green }
                answer: "1/2"
                hints:
                  - "A half is one of two equal parts."
                  - "Find the circle split into two parts."
                  - "The circle in two parts with one part coloured."
              - id: l1-f3
                type: true_false
                text: "Is it true? This bar is split into halves."
                say: "The bar is split into two parts. Is it split into halves?"
                show: { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, yellow], [5, 0, yellow]], lines: [[4, 0, 4, 1]] }
                answer: false
                feedback:
                  "true": "There are two parts, but the blue part has 4 squares and the yellow part has 2. Halves must be the same size."
                hints:
                  - "Count the squares in each part."
                  - "Blue has 4 squares, yellow has 2."
                  - "No. The parts are not equal."
              - id: l1-f4
                type: multiple_choice
                text: "Half of 6 = _"
                say: "Share six counters into two equal rows. What is half of six?"
                show: { drawn: dots, array: [2, 3], split_rows: 1 }
                options: ["3", "2", "4"]
                answer: "3"
                feedback:
                  "2": "Half is not always 2. Share 6 into two equal groups: 3 in each."
                  "4": "Six take away two is four, but half means two equal groups: 3 and 3."
                hints:
                  - "Share into two equal groups."
                  - "Count the counters in one row."
                  - "3."
              - id: l1-f5
                type: multiple_choice
                text: "Two children share 10 grapes fairly. How many does each get?"
                say: "Two children share ten grapes fairly. How many grapes does each child get?"
                options: ["5", "10", "2"]
                answer: "5"
                hints:
                  - "Fairly means the same for each."
                  - "Half of 10."
                  - "5."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which bar shows halves?"
                say: "Tap the bar that is split into halves."
                options:
                  - { drawn: fraction, kind: bar, parts: 2, shaded: 1, colour: red }
                  - { drawn: fraction, kind: bar, parts: 3, shaded: 1, colour: red }
                  - { drawn: fraction, kind: bar, parts: 4, shaded: 1, colour: red }
                answer: "1/2"
                hints: ["Halves are two equal parts."]
              - id: l1-s2
                type: true_false
                text: "Is it true? This circle is split into halves."
                say: "Look at the circle. Is it split into halves?"
                show: { drawn: fraction, kind: circle, parts: 4, shaded: 1, colour: orange }
                answer: false
                hints: ["Count the parts."]
              - id: l1-s3
                type: true_false
                text: "Is it true? This shape is split into halves."
                say: "The shape is split into two parts. Is it split into halves?"
                show: { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [2, 0, yellow], [3, 0, yellow], [2, 1, yellow], [3, 1, yellow]], lines: [[2, 0, 2, 2]] }
                answer: true
                hints: ["Count the squares in each part."]
              - id: l1-s4
                type: multiple_choice
                text: "Half of 12 = _"
                say: "What is half of twelve?"
                show: { drawn: dots, array: [2, 6], split_rows: 1 }
                options: ["6", "2", "10"]
                answer: "6"
                hints: ["Count one of the two equal rows."]
              - id: l1-s5
                type: text_input
                text: "Half of 4 = _"
                say: "What is half of four?"
                answer: "2"
                hints: ["Share four into two equal groups."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Where is one half coloured?"
                say: "Tap the shape that has one half coloured."
                options:
                  - { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 1, colour: purple }
                  - { drawn: fraction, kind: rect, parts: 2, rows: 1, shaded: 1, colour: purple }
                  - { drawn: fraction, kind: rect, parts: 3, rows: 1, shaded: 1, colour: purple }
                answer: "1/2"
              - id: l1-n2
                type: text_input
                text: "Half of 8 = _"
                say: "What is half of eight?"
                answer: "4"
              - id: l1-n3
                type: true_false
                text: "Is it true? This bar is split into halves."
                say: "The bar is split into two parts. Is it split into halves?"
                show: { drawn: grid, cols: 5, rows: 1, cells: [[0, 0, red], [1, 0, red], [2, 0, blue], [3, 0, blue], [4, 0, blue]], lines: [[2, 0, 2, 1]] }
                answer: false
              - id: l1-n4
                type: text_input
                text: "Half of 14 = _"
                say: "What is half of fourteen?"
                answer: "7"
              - id: l1-n5
                type: multiple_choice
                text: "Ben and Asha share a pizza fairly. What does each get?"
                say: "Ben and Asha share one pizza fairly. How much does each of them get?"
                show: { object: pizza }
                options: ["one half", "one quarter", "the whole pizza"]
                answer: "one half"
                feedback:
                  "the whole pizza": "A whole pizza each? Then they would need two pizzas! Sharing one pizza fairly between two means one half each."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Is it true? This circle is split into halves."
            say: "Look at the circle. Is it split into halves?"
            show: { drawn: fraction, kind: circle, parts: 2, shaded: 1, colour: blue }
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "Half of 16 = _"
            say: "What is half of sixteen?"
            options: ["8", "6", "14"]
            answer: "8"
          - id: l1-c3
            type: true_false
            text: "Is it true? Two parts that are not the same size are halves."
            say: "Two parts that are not the same size are halves. Is that true?"
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            text: "Which shape is split into halves?"
            say: "Which shape is split into halves?"
            options:
              - { drawn: fraction, kind: bar, parts: 3, shaded: 1, colour: orange }
              - { drawn: fraction, kind: circle, parts: 2, shaded: 1, colour: orange }
              - { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 1, colour: orange }
            answer: "1/2"
          - id: l1-c5
            type: text_input
            text: "Half of 2 = _"
            say: "What is half of two?"
            answer: "1"
          - id: l1-c6
            type: true_false
            text: "Is it true? This bar is split into halves."
            say: "The bar is split into two parts. Is it split into halves?"
            show: { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, blue], [4, 0, blue], [5, 0, blue]], lines: [[3, 0, 3, 1]] }
            answer: true

  - n: 2
    title: { de: "Viertel", en: "Quarters" }
    goal:
      de: "Teile ein Ganzes in vier gleich große Viertel und sieh, dass ein Viertel kleiner ist als eine Hälfte."
      en: "Split a whole into four equal quarters, and see that a quarter is smaller than a half."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Half of 18 = _"
            say: "What is half of eighteen?"
            options: ["9", "8", "16"]
            answer: "9"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? This bar is split into halves."
            say: "Look at the bar. Is it split into halves?"
            show: { drawn: fraction, kind: bar, parts: 2, shaded: 1, colour: green }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Four friends, one pizza"
            say: "Now four friends want to share one pizza fairly. How many equal pieces do you think they need? Have a guess."
            show: { object: pizza }
          - text: "one quarter"
            say: "Four equal pieces, one for each friend. This circle is split into four equal parts. Each part is one quarter. One quarter is coloured red."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 1, colour: red }
          - text: "2 quarters = 1 half"
            say: "Two quarters make one half. If you cut a half into two equal parts, each part is a quarter. So a quarter is smaller than a half."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 2, colour: red }
          - text: "A quarter of 8 is 2."
            say: "To find a quarter of eight, share the eight counters into four equal groups. Each row has two. A quarter of eight is two."
            show: { drawn: dots, array: [4, 2], split_rows: 1 }
          - text: "Did you know? Long ago in Britain, a coin called a farthing was worth a quarter of a penny."
            say: "Did you know? Long ago in Britain, there was a tiny coin called a farthing. It was worth one quarter of a penny, so four farthings made one penny. Its name means a fourth part!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Where is one quarter coloured?"
                say: "Tap the shape that has one quarter coloured."
                options:
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 1, colour: blue }
                  - { drawn: fraction, kind: circle, parts: 2, shaded: 1, colour: blue }
                  - { drawn: fraction, kind: circle, parts: 3, shaded: 1, colour: blue }
                answer: "1/4"
                hints:
                  - "A quarter is one of four equal parts."
                  - "Find the circle split into four parts."
                  - "The circle in four parts with one coloured."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How many quarters make a whole?"
                say: "How many quarters make one whole?"
                show: { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 4, colour: yellow }
                options: ["4", "2", "1"]
                answer: "4"
                hints:
                  - "Count the parts of the whole."
                  - "A quarter is one of four equal parts."
                  - "4."
              - id: l2-f3
                type: multiple_choice
                text: "A quarter of 12 = _"
                say: "Share twelve counters into four equal rows. What is a quarter of twelve?"
                show: { drawn: dots, array: [4, 3], split_rows: 1 }
                options: ["3", "4", "6"]
                answer: "3"
                hints:
                  - "Four equal groups."
                  - "Count the counters in one row."
                  - "3."
              - id: l2-f4
                type: multiple_choice
                text: "Which is bigger: half of a cake or a quarter of the same cake?"
                say: "Which piece is bigger, half of a cake or a quarter of the same cake?"
                options: ["a half", "a quarter", "the same"]
                answer: "a half"
                feedback:
                  "a quarter": "4 is more than 2, but a quarter means the cake is cut into four pieces, so each piece is smaller. A half is bigger."
                hints:
                  - "More pieces means smaller pieces."
                  - "A half cut in two makes two quarters."
                  - "A half is bigger."
              - id: l2-f5
                type: true_false
                text: "Is it true? 2 quarters make 1 half."
                say: "Two quarters make one half. Is that true?"
                show: { drawn: fraction, kind: circle, parts: 4, shaded: 2, colour: green }
                answer: true
                hints:
                  - "Look at the two coloured parts."
                  - "Together they cover half of the circle."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Which bar shows quarters?"
                say: "Tap the bar that is split into quarters."
                options:
                  - { drawn: fraction, kind: bar, parts: 2, shaded: 1, colour: orange }
                  - { drawn: fraction, kind: bar, parts: 4, shaded: 1, colour: orange }
                  - { drawn: fraction, kind: bar, parts: 5, shaded: 1, colour: orange }
                answer: "1/4"
                hints: ["Quarters are four equal parts."]
              - id: l2-s2
                type: multiple_choice
                text: "A quarter of 8 = _"
                say: "What is a quarter of eight?"
                options: ["2", "4", "6"]
                answer: "2"
                hints: ["Share eight into four equal groups."]
              - id: l2-s3
                type: multiple_choice
                text: "How many quarters make a half?"
                say: "How many quarters make one half?"
                options: ["2", "4", "1"]
                answer: "2"
                hints: ["Cut a half into two equal parts."]
              - id: l2-s4
                type: true_false
                text: "Is it true? A quarter of a pizza is bigger than half of the same pizza."
                say: "A quarter of a pizza is bigger than half of the same pizza. Is that true?"
                answer: false
                hints: ["More pieces means smaller pieces."]
              - id: l2-s5
                type: true_false
                text: "Is it true? This bar is split into quarters."
                say: "The bar is split into four parts. Is it split into quarters?"
                show: { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, red], [1, 0, red], [2, 0, blue], [3, 0, green], [4, 0, yellow], [5, 0, yellow]], lines: [[2, 0, 2, 1], [3, 0, 3, 1], [4, 0, 4, 1]] }
                answer: false
                hints: ["Are all four parts the same size?"]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Where is one quarter coloured?"
                say: "Tap the shape that has one quarter coloured."
                options:
                  - { drawn: fraction, kind: rect, parts: 2, rows: 1, shaded: 1, colour: red }
                  - { drawn: fraction, kind: rect, parts: 3, rows: 1, shaded: 1, colour: red }
                  - { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 1, colour: red }
                answer: "1/4"
              - id: l2-n2
                type: text_input
                text: "A quarter of 4 = _"
                say: "What is a quarter of four?"
                answer: "1"
              - id: l2-n3
                type: multiple_choice
                text: "Four friends share 20 sweets fairly. How many does each get?"
                say: "Four friends share twenty sweets fairly. How many sweets does each friend get?"
                options: ["5", "4", "10"]
                answer: "5"
              - id: l2-n4
                type: multiple_choice
                text: "Which is smaller: a half or a quarter of the same bar?"
                say: "Which is smaller, a half or a quarter of the same bar?"
                options: ["a quarter", "a half", "the same"]
                answer: "a quarter"
              - id: l2-n5
                type: multiple_choice
                text: "Mum cuts a cake into 4 equal pieces. What is each piece?"
                say: "Mum cuts a cake into four equal pieces. What is each piece called?"
                show: { object: cake }
                options: ["a quarter", "a half", "a whole"]
                answer: "a quarter"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: quarter
            type: multiple_choice
            text: "How much of the bar is coloured?"
            say: "The bar is split into equal parts. How much of it is coloured?"
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 1, colour: blue }
            options: ["one quarter", "one half", "the whole bar"]
            answer: "one quarter"
          - id: l2-c2
            part: half
            type: text_input
            text: "Half of 20 = _"
            say: "What is half of twenty?"
            answer: "10"
          - id: l2-c3
            part: quarter
            type: multiple_choice
            text: "A quarter of 16 = _"
            say: "What is a quarter of sixteen?"
            show: { drawn: dots, array: [4, 4], split_rows: 1 }
            options: ["4", "8", "2"]
            answer: "4"
          - id: l2-c4
            part: compare
            type: true_false
            text: "Is it true? A half is bigger than a quarter of the same shape."
            say: "A half is bigger than a quarter of the same shape. Is that true?"
            answer: true
          - id: l2-c5
            part: equal
            type: true_false
            text: "Is it true? This rectangle is split into quarters."
            say: "The rectangle is split into four parts. Is it split into quarters?"
            show: { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, red], [1, 0, red], [0, 1, red], [1, 1, blue], [2, 0, green], [2, 1, green], [3, 0, yellow], [3, 1, yellow]], lines: [[2, 0, 2, 2], [3, 0, 3, 2], [1, 1, 1, 2], [1, 1, 2, 1]] }
            answer: false
          - id: l2-c6
            part: equal
            type: true_false
            text: "Is it true? This bar is split into halves."
            say: "The bar is split into two parts. Is it split into halves?"
            show: { drawn: grid, cols: 8, rows: 1, cells: [[0, 0, green], [1, 0, green], [2, 0, green], [3, 0, green], [4, 0, orange], [5, 0, orange], [6, 0, orange], [7, 0, orange]], lines: [[4, 0, 4, 1]] }
            answer: true
          - id: l2-c7
            part: equal
            type: true_false
            text: "Is it true? This square is split into quarters."
            say: "The square is split into four parts. Is it split into quarters?"
            show: { drawn: grid, cols: 2, rows: 2, cells: [[0, 0, red], [1, 0, blue], [0, 1, green], [1, 1, yellow]], lines: [[1, 0, 1, 2], [0, 1, 2, 1]] }
            answer: true
          - id: l2-c8
            part: equal
            type: image_multiple_choice
            text: "Which bar is split into halves?"
            say: "Each bar is split into two parts. Tap the bar that is split into halves."
            options:
              - { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [4, 0, blue], [5, 0, blue]], lines: [[4, 0, 4, 1]], key: four-two }
              - { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, blue], [4, 0, blue], [5, 0, blue]], lines: [[3, 0, 3, 1]], key: halves }
              - { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, red], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [5, 0, blue]], lines: [[1, 0, 1, 1]], key: one-five }
            answer: "halves"
          - id: l2-c9
            part: equal
            type: multiple_choice
            text: "The bar is split into 2 parts. Why are they not halves?"
            say: "The bar is split into two parts. Why are they not halves?"
            show: { drawn: grid, cols: 8, rows: 1, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [4, 0, red], [5, 0, green], [6, 0, green], [7, 0, green]], lines: [[5, 0, 5, 1]] }
            options: ["The parts are not the same size.", "There are 2 parts.", "One part is green."]
            answer: "The parts are not the same size."
          - id: l2-c10
            part: half
            type: multiple_choice
            text: "Two friends share 14 stickers fairly. How many does each friend get?"
            say: "Two friends share fourteen stickers fairly. How many stickers does each friend get?"
            show: { object: sticker, count: 14, layout: row }
            options: ["7", "12", "2"]
            answer: "7"
          - id: l2-c11
            part: half
            type: image_multiple_choice
            text: "Which shape has one half coloured?"
            say: "Which shape has one half coloured?"
            options:
              - { drawn: fraction, kind: bar, parts: 4, shaded: 1, colour: yellow }
              - { drawn: fraction, kind: rect, parts: 2, rows: 1, shaded: 1, colour: yellow }
              - { drawn: fraction, kind: circle, parts: 2, shaded: 2, colour: yellow }
            answer: "1/2"
          - id: l2-c12
            part: half
            type: true_false
