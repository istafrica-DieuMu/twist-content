# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.sequence-of-day
skill: math.time.sequence-of-day
curriculum: en-GB
language: en
title:
  de: Tagesablauf, Wochentage und Monate
  en: My day, the days and the months
summary: >
  Lesson 1 puts the events of a school day in order with first, next,
  then, before and after, and names morning, afternoon, evening and
  night; lesson 2 says the days of the week in order and uses yesterday,
  today and tomorrow; lesson 3 says the twelve months in order, finds
  the month before and after, and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Zeit, en: Time }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { en: [first, next, then, before, after, morning, afternoon, evening, night, day, week, weekend, month, year, yesterday, today, tomorrow, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, January, February, March, April, May, June, July, August, September, October, November, December] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: before-after-swap
      what: Mixes up before and after, and names the event that comes after when asked what comes before
      addressed: lesson 1 Learn shows before and after on one pair of events; l1-f3 (with feedback), l1-s3, l1-n3, l2-f2 and l3-f2 ask for the one before
    - id: week-starts-anywhere
      what: Thinks the order of the days stops at Sunday, so does not know that Monday comes after Sunday
      addressed: lesson 2 Learn says the week starts again after Sunday; l2-f4 (with feedback), l2-s4, l2-n4 and l3-c3 ask for the day after Sunday
    - id: yesterday-tomorrow-swap
      what: Swaps yesterday and tomorrow
      addressed: lesson 2 Learn puts yesterday, today and tomorrow in a row; l2-f5 (with feedback), l2-s5 and l2-n5 ask for yesterday or tomorrow from a named today
    - id: months-loop
      what: Does not know that January comes after December
      addressed: lesson 3 Learn says the year starts again after December; l3-f4 (with feedback), l3-n4 and l3-c4 ask for the month after December
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mein Tag", en: "My day" }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "morning, afternoon, evening, night"
            say: "A day has parts. In the morning we wake up and go to school. In the afternoon we come home. In the evening we have tea. At night we sleep."
            show: { objects: [sun, moon] }
          - text: "First, next, then"
            say: "Things in a day happen in order. First I wake up. Next I get dressed. Then I eat my breakfast."
          - text: "I eat breakfast before school. I go to bed after tea."
            say: "Before means earlier. I eat breakfast before I go to school. After means later. I go to bed after I have my tea."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Put Ava's morning in order."
                say: "Put Ava's morning in order. What does she do first?"
                options: ["get dressed", "wake up", "eat breakfast"]
                slot_count: 3
                answer: ["wake up", "get dressed", "eat breakfast"]
                hints:
                  - "What do you do as soon as you open your eyes?"
                  - "First Ava wakes up. Then she gets dressed."
                  - "wake up, get dressed, eat breakfast."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "When do we usually go to bed?"
                say: "When do we usually go to bed?"
                options: ["at night", "in the morning", "in the afternoon"]
                answer: "at night"
                hints:
                  - "Think about when it is dark outside."
                  - "The moon is out and we go to sleep."
                  - "At night."
              - id: l1-f3
                type: multiple_choice
                text: "What do you do before you go to school?"
                say: "What do you do before you go to school?"
                options: ["eat breakfast", "eat my tea", "go to bed"]
                answer: "eat breakfast"
                feedback:
                  "eat my tea": "Tea is in the evening, after school. Before means earlier."
                hints:
                  - "Before means earlier."
                  - "Think about your morning at home."
                  - "Eat breakfast."
              - id: l1-f4
                type: true_false
                text: "Is it true? We eat lunch in the morning, before we wake up."
                say: "We eat lunch in the morning, before we wake up. Is that true?"
                answer: false
                hints:
                  - "Can you eat while you are asleep?"
                  - "Waking up is the first thing in the day."
                  - "No. We wake up first, and lunch is in the middle of the day."
              - id: l1-f5
                type: ordering
                text: "Put Leo's day in order."
                say: "Put Leo's day in order, from morning to night."
                options: ["go to bed", "go to school", "eat tea", "come home"]
                slot_count: 4
                answer: ["go to school", "come home", "eat tea", "go to bed"]
                hints:
                  - "Start with the morning."
                  - "School comes first, then home. Bed comes last."
                  - "go to school, come home, eat tea, go to bed."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "When do we usually eat breakfast?"
                say: "When do we usually eat breakfast?"
                options: ["in the morning", "in the evening", "at night"]
                answer: "in the morning"
                hints: ["Breakfast is the first meal of the day."]
              - id: l1-s2
                type: ordering
                text: "Put the bath time in order."
                say: "Put Zara's bath time in order."
                options: ["dry off", "get in the bath", "run the bath"]
                slot_count: 3
                answer: ["run the bath", "get in the bath", "dry off"]
                hints: ["You need water in the bath first."]
              - id: l1-s3
                type: multiple_choice
                text: "What do you do before you eat?"
                say: "What do you do before you eat?"
                options: ["wash my hands", "clear the table", "brush my teeth for bed"]
                answer: "wash my hands"
                hints: ["Before means earlier, so this happens first."]
              - id: l1-s4
                type: true_false
                text: "Is it true? We come home from school in the afternoon."
                say: "We come home from school in the afternoon. Is that true?"
                answer: true
                hints: ["School ends after lunch."]
              - id: l1-s5
                type: multiple_choice
                text: "What do you do after you put on your shoes?"
                say: "What do you do after you put on your shoes?"
                options: ["go out of the door", "put on my socks", "wake up"]
                answer: "go out of the door"
                hints: ["After means later. Socks go on before shoes."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Put the picnic in order."
                say: "Put the picnic in order."
                options: ["eat the sandwiches", "pack the basket", "walk to the park"]
                slot_count: 3
                answer: ["pack the basket", "walk to the park", "eat the sandwiches"]
              - id: l1-n2
                type: multiple_choice
                text: "When do we usually eat tea?"
                say: "When do we usually eat our tea?"
                options: ["in the evening", "in the morning", "at night, when we are asleep"]
                answer: "in the evening"
              - id: l1-n3
                type: multiple_choice
                text: "What do you do before you go to bed?"
                say: "What do you do before you go to bed?"
                options: ["brush my teeth", "wake up", "eat breakfast"]
                answer: "brush my teeth"
              - id: l1-n4
                type: true_false
                text: "Is it true? It is usually dark at night."
                say: "It is usually dark at night. Is that true?"
                answer: true
              - id: l1-n5
                type: ordering
                text: "Put the school day in order."
                say: "Put the school day in order."
                options: ["eat lunch", "hang up my coat", "go home", "answer the register"]
                slot_count: 4
                answer: ["hang up my coat", "answer the register", "eat lunch", "go home"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Put the cake making in order."
            say: "Put the cake making in order."
            options: ["eat the cake", "bake the cake", "mix the cake"]
            slot_count: 3
            answer: ["mix the cake", "bake the cake", "eat the cake"]
          - id: l1-c2
            type: multiple_choice
            text: "When do we usually sleep?"
            say: "When do we usually sleep?"
            options: ["at night", "in the afternoon", "in the morning"]
            answer: "at night"
          - id: l1-c3
            type: multiple_choice
            text: "What do you do after you wake up?"
            say: "What do you do after you wake up?"
            options: ["get out of bed", "go to sleep", "eat my tea"]
            answer: "get out of bed"

  - n: 2
    title: { de: "Die Wochentage", en: "The days of the week" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "When do we usually wake up?"
            say: "When do we usually wake up?"
            options: ["in the morning", "in the evening", "at night"]
            answer: "in the morning"
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Put the morning in order."
            say: "Put the morning in order."
            options: ["walk to school", "eat breakfast", "wake up"]
            slot_count: 3
            answer: ["wake up", "eat breakfast", "walk to school"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday"
            say: "There are seven days in a week. Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. We go to school from Monday to Friday. Saturday and Sunday are the weekend."
          - text: "Sunday → Monday"
            say: "After Sunday the week starts again. The day after Sunday is Monday."
          - text: "yesterday, today, tomorrow"
            say: "If today is Tuesday, then yesterday was Monday, the day before. Tomorrow will be Wednesday, the day after."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which day comes after Monday?"
                say: "Which day comes after Monday?"
                options: ["Tuesday", "Sunday", "Thursday"]
                answer: "Tuesday"
                hints:
                  - "Say the days from Monday."
                  - "Monday, then ..."
                  - "Tuesday."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which day comes before Friday?"
                say: "Which day comes before Friday?"
                options: ["Thursday", "Saturday", "Wednesday"]
                answer: "Thursday"
                feedback:
                  "Saturday": "Saturday comes after Friday. Before means the day just in front."
                hints:
                  - "Before means the day just in front."
                  - "Say the days: Wednesday, Thursday, Friday."
                  - "Thursday."
              - id: l2-f3
                type: ordering
                text: "Put the days in order."
                say: "Put the days in order. Start with the first day of the school week."
                options: ["Wednesday", "Monday", "Thursday", "Tuesday"]
                slot_count: 4
                answer: ["Monday", "Tuesday", "Wednesday", "Thursday"]
                hints:
                  - "The school week starts on Monday."
                  - "Monday, Tuesday, then two more."
                  - "Monday, Tuesday, Wednesday, Thursday."
              - id: l2-f4
                type: multiple_choice
                text: "Which day comes after Sunday?"
                say: "Which day comes after Sunday?"
                options: ["Monday", "Saturday", "There is no day after Sunday."]
                answer: "Monday"
                feedback:
                  "There is no day after Sunday.": "The week starts again. After Sunday comes Monday."
                  "Saturday": "Saturday comes before Sunday."
                hints:
                  - "After Sunday, a new week starts."
                  - "What is the first day of the week?"
                  - "Monday."
              - id: l2-f5
                type: multiple_choice
                text: "Today is Wednesday. What day will it be tomorrow?"
                say: "Today is Wednesday. What day will it be tomorrow?"
                options: ["Thursday", "Tuesday", "Friday"]
                answer: "Thursday"
                feedback:
                  "Tuesday": "Tuesday was yesterday. Tomorrow is the day after today."
                hints:
                  - "Tomorrow is the day after today."
                  - "What comes after Wednesday?"
                  - "Thursday."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which day comes after Thursday?"
                say: "Which day comes after Thursday?"
                options: ["Friday", "Wednesday", "Saturday"]
                answer: "Friday"
                hints: ["Say the days from Thursday."]
              - id: l2-s2
                type: multiple_choice
                text: "Which days are the weekend?"
                say: "Which days are the weekend?"
                options: ["Saturday and Sunday", "Monday and Tuesday", "Friday and Monday"]
                answer: "Saturday and Sunday"
                hints: ["They are the days with no school."]
              - id: l2-s3
                type: true_false
                text: "Is it true? There are seven days in a week."
                say: "There are seven days in a week. Is that true?"
                answer: true
                hints: ["Count them: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday."]
              - id: l2-s4
                type: ordering
                text: "Put the days in order."
                say: "Put the days in order, starting with Friday."
                options: ["Sunday", "Monday", "Friday", "Saturday"]
                slot_count: 4
                answer: ["Friday", "Saturday", "Sunday", "Monday"]
                hints: ["After Sunday the week starts again."]
              - id: l2-s5
                type: multiple_choice
                text: "Today is Friday. What day was it yesterday?"
                say: "Today is Friday. What day was it yesterday?"
                options: ["Thursday", "Saturday", "Wednesday"]
                answer: "Thursday"
                hints: ["Yesterday is the day before today."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which day comes before Tuesday?"
                say: "Which day comes before Tuesday?"
                options: ["Monday", "Wednesday", "Sunday"]
                answer: "Monday"
              - id: l2-n2
                type: ordering
                text: "Put the days in order."
                say: "Put the days in order, starting with Tuesday."
                options: ["Thursday", "Friday", "Tuesday", "Wednesday"]
                slot_count: 4
                answer: ["Tuesday", "Wednesday", "Thursday", "Friday"]
              - id: l2-n3
                type: true_false
                text: "Is it true? We go to school on Saturday and Sunday."
                say: "We go to school on Saturday and Sunday. Is that true?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Today is Sunday. What day will it be tomorrow?"
                say: "Today is Sunday. What day will it be tomorrow?"
                options: ["Monday", "Saturday", "Tuesday"]
                answer: "Monday"
              - id: l2-n5
                type: multiple_choice
                text: "Today is Monday. What day was it yesterday?"
                say: "Today is Monday. What day was it yesterday?"
                options: ["Sunday", "Tuesday", "Saturday"]
                answer: "Sunday"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which day comes after Wednesday?"
            say: "Which day comes after Wednesday?"
            options: ["Thursday", "Tuesday", "Friday"]
            answer: "Thursday"
          - id: l2-c2
            type: multiple_choice
            text: "Today is Tuesday. What day will it be tomorrow?"
            say: "Today is Tuesday. What day will it be tomorrow?"
            options: ["Wednesday", "Monday", "Thursday"]
            answer: "Wednesday"
          - id: l2-c3
            type: true_false
            text: "Is it true? Saturday comes after Friday."
            say: "Saturday comes after Friday. Is that true?"
            answer: true

  - n: 3
    title: { de: "Die Monate", en: "The months" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Which day comes after Saturday?"
            say: "Which day comes after Saturday?"
            options: ["Sunday", "Friday", "Monday"]
            answer: "Sunday"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "Today is Thursday. What day was it yesterday?"
            say: "Today is Thursday. What day was it yesterday?"
            options: ["Wednesday", "Friday", "Tuesday"]
            answer: "Wednesday"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "January, February, March, April, May, June"
            say: "A year has twelve months. The first six are January, February, March, April, May and June."
          - text: "July, August, September, October, November, December"
            say: "Then come July, August, September, October, November and December. December is the last month of the year."
            show: { object: snowman }
          - text: "December → January"
            say: "After December a new year starts. The month after December is January."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Which month comes first in the year?"
                say: "Which month comes first in the year?"
                options: ["January", "December", "June"]
                answer: "January"
                hints:
                  - "The year starts with this month."
                  - "It comes straight after December."
                  - "January."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "Which month comes before April?"
                say: "Which month comes before April?"
                options: ["March", "May", "February"]
                answer: "March"
                feedback:
                  "May": "May comes after April. Before means the month just in front."
                hints:
                  - "Before means the month just in front."
                  - "Say the months: January, February, March, April."
                  - "March."
              - id: l3-f3
                type: ordering
                text: "Put the months in order."
                say: "Put the months in order, starting with May."
                options: ["July", "May", "August", "June"]
                slot_count: 4
                answer: ["May", "June", "July", "August"]
                hints:
                  - "May is the fifth month."
                  - "May, June, then two more."
                  - "May, June, July, August."
              - id: l3-f4
                type: multiple_choice
                text: "Which month comes after December?"
                say: "Which month comes after December?"
                options: ["January", "November", "There is no month after December."]
                answer: "January"
                feedback:
                  "There is no month after December.": "A new year starts. After December comes January."
                  "November": "November comes before December."
                hints:
                  - "After December, a new year starts."
                  - "What is the first month of the year?"
                  - "January."
              - id: l3-f5
                type: true_false
                text: "Is it true? There are twelve months in a year."
                say: "There are twelve months in a year. Is that true?"
                answer: true
                hints:
                  - "Count the months on your fingers."
                  - "Six from January to June, and six from July to December."
                  - "Yes, twelve."

          - support: some
            tasks:
              - id: l3-s1
                type: multiple_choice
                text: "Which month comes after September?"
                say: "Which month comes after September?"
                options: ["October", "August", "November"]
                answer: "October"
                hints: ["Say the months from September."]
              - id: l3-s2
                type: ordering
                text: "Put the months in order."
                say: "Put the months in order, starting with January."
                options: ["March", "January", "April", "February"]
                slot_count: 4
                answer: ["January", "February", "March", "April"]
                hints: ["January is the first month."]
              - id: l3-s3
                type: multiple_choice
                text: "Which month comes before July?"
                say: "Which month comes before July?"
                options: ["June", "August", "May"]
                answer: "June"
                hints: ["Before means the month just in front."]
              - id: l3-s4
                type: true_false
                text: "Is it true? The last month of the year is November."
                say: "The last month of the year is November. Is that true?"
                answer: false
                hints: ["Which month comes after November?"]
              - id: l3-s5
                type: multiple_choice
                text: "Mo's birthday is in the month after February. Which month is it?"
                say: "Mo's birthday is in the month after February. Which month is it?"
                options: ["March", "January", "April"]
                answer: "March"
                hints: ["After means the next month."]

          - support: none
            tasks:
              - id: l3-n1
                type: multiple_choice
                text: "Which month comes after June?"
                say: "Which month comes after June?"
                options: ["July", "May", "August"]
                answer: "July"
              - id: l3-n2
                type: ordering
                text: "Put the months in order."
                say: "Put the months in order, starting with September."
                options: ["November", "September", "December", "October"]
                slot_count: 4
                answer: ["September", "October", "November", "December"]
              - id: l3-n3
                type: multiple_choice
                text: "Which month comes before October?"
                say: "Which month comes before October?"
                options: ["September", "November", "August"]
                answer: "September"
              - id: l3-n4
                type: ordering
                text: "Put the months in order."
                say: "Put the months in order, starting with November."
                options: ["January", "December", "February", "November"]
                slot_count: 4
                answer: ["November", "December", "January", "February"]
              - id: l3-n5
                type: multiple_choice
                text: "Isla's party is in the month before May. Which month is it?"
                say: "Isla's party is in the month before May. Which month is it?"
                options: ["April", "June", "March"]
                answer: "April"

      - activity: check
        size: skill
        tasks:
          - id: l3-c1
            type: ordering
            text: "Put Noah's evening in order."
            say: "Put Noah's evening in order."
            options: ["put on pyjamas", "eat tea", "go to sleep"]
            slot_count: 3
            answer: ["eat tea", "put on pyjamas", "go to sleep"]
          - id: l3-c2
            type: multiple_choice
            text: "Today is Saturday. What day was it yesterday?"
            say: "Today is Saturday. What day was it yesterday?"
            options: ["Friday", "Sunday", "Thursday"]
            answer: "Friday"
          - id: l3-c3
            type: ordering
            text: "Put the days in order."
            say: "Put the days in order, starting with Saturday."
            options: ["Monday", "Saturday", "Tuesday", "Sunday"]
            slot_count: 4
            answer: ["Saturday", "Sunday", "Monday", "Tuesday"]
          - id: l3-c4
            type: multiple_choice
            text: "Today is 31 December. Which month will it be tomorrow?"
            say: "Today is the thirty-first of December, the last day of the year. Which month will it be tomorrow?"
            options: ["January", "November", "February"]
            answer: "January"
          - id: l3-c5
            type: multiple_choice
            text: "Which month comes after March?"
            say: "Which month comes after March?"
            options: ["April", "February", "May"]
            answer: "April"
