# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.picture-stories
skill: math.word-problems.picture-stories
curriculum: en-GB
language: en
title:
  de: Rechengeschichten
  en: Number stories
summary: >
  A picture or a short story asks a question, and the child finds the
  number sentence, works it out and says the answer. Lesson 1 finds what
  the story asks and the number sentence for it; lesson 2 adds the answer
  sentence and mixes adding and taking-away stories, and ends with the
  skill check. Stories are spoken; number sentences and short questions
  are on screen.
metadata:
  year: year-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.sub-to-10]
  also_practises: [math.add-sub-to-20.add-to-10, math.add-sub-to-20.sub-meaning]
  vocabulary: { en: [number story, question, number sentence, answer, more, fewer, left, altogether] }
  forms: [drawn, picture, text, audio]
  drawn: [ten-frame]
  facets: []
  misconceptions:
    - id: wrong-start
      what: Starts the subtraction with the number taken away (2 − 6 for "6 birds, 2 fly away")
      addressed: Learn says the first number is how many there were at the start; options include the swapped number sentence
    - id: answer-without-thing
      what: Gives a bare number as the answer and loses what it counts
      addressed: lesson 2 chooses the answer sentence; the wrong options put the right number on the wrong thing
    - id: keyword-only
      what: Picks add or take away from one word without picturing the story
      addressed: stories use many different words for adding and taking away (float away, lends, gets off, plants), and some adding stories have no signal word (Gran puts four in); hints ask whether there are more or fewer at the end
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was will die Geschichte wissen?", en: "What does the story ask?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "7 − 3 = _"
            say: "Seven subtract three."
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "2 + 5 = _"
            say: "Two add five."
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: "Five birds are sitting in the tree. Two fly away. How many birds are still in the tree?"
            show: { object: bird, count: 5 }
          - say: "The story wants to know how many are still there. At the start there are five. Two fly away, so there are fewer at the end. That is taking away: five subtract two."
            show: { drawn: ten-frame, filled: 5, cross: 2 }
          - say: "Five subtract two equals three. Three birds are still in the tree."
            text: "5 − 2 = 3"
          - say: "Here is what to do. Listen to the story. What does it want to know? Are there more or fewer at the end? Then work it out."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which calculation?"
                say: "Four apples are in the basket. Mum puts in two more. How many apples are in the basket now? Which calculation fits?"
                show: { object: apple, count: 4 }
                options: ["4 + 2", "4 − 2", "2 − 4"]
                answer: "4 + 2"
                hints:
                  - "Are there more apples at the end, or fewer?"
                  - "Two more go in, so there are more: add."
                  - "Four, and two more: 4 + 2."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What do you need to find out?"
                say: "Six children are playing football. Two go home. What do you need to find out?"
                show: { object: child, count: 6 }
                options: ["How many are still playing?", "What is the game called?", "Where is the ball?"]
                answer: "How many are still playing?"
                hints:
                  - "A number story asks about a number."
                  - "Which question has a number for its answer?"
                  - "How many are still playing?"
                difficulty: easy
              - id: l1-f3
                type: multiple_choice
                text: "Which calculation?"
                say: "Seven balloons are at the stall. Three float away. How many balloons are left? Which calculation fits?"
                show: { drawn: ten-frame, filled: 7, cross: 3 }
                options: ["3 − 7", "7 + 3", "7 − 3"]
                answer: "7 − 3"
                feedback:
                  "3 − 7": "Start with how many there were: seven."
                hints:
                  - "At the start there are seven."
                  - "Three float away, so there are fewer: take away."
                  - "7 − 3."
              - id: l1-f4
                type: text_input
                text: "7 − 3 = _"
                say: "So how many balloons are left? Work out seven subtract three."
                answer: "4"
                hints:
                  - "Take three away from seven."
                  - "Count back: six, five, four."
                  - "4 balloons."
              - id: l1-f5
                type: multiple_choice
                text: "Which calculation?"
                say: "Three strawberries are on the plate. Ben puts five more on. How many strawberries are there now?"
                show: { object: strawberry, count: 3 }
                options: ["5 − 3", "3 + 5", "3 − 5"]
                answer: "3 + 5"
                hints:
                  - "Five more go on: are there more or fewer?"
                  - "More, so add."
                  - "3 + 5."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which calculation?"
                say: "Nine ants are walking along the path. Four crawl under a stone. How many are still on the path?"
                show: { object: ant, count: 9 }
                options: ["9 − 4", "9 + 4", "4 − 9"]
                answer: "9 − 4"
                hints: ["Are there more ants on the path at the end, or fewer?"]
              - id: l1-s2
                type: text_input
                text: "9 − 4 = _"
                say: "How many ants are still on the path?"
                answer: "5"
                hints: ["Count back four from nine."]
              - id: l1-s3
                type: multiple_choice
                text: "What do you need to find out?"
                say: "Zara has two stickers. She gets three more. What do you need to find out?"
                show: { object: sticker, count: 2 }
                options: ["How many stickers does she have now?", "Who gave her the stickers?", "What colour are they?"]
                answer: "How many stickers does she have now?"
                hints: ["The answer is a number."]
              - id: l1-s4
                type: true_false
                text: "Does 6 + 2 fit?"
                say: "Six frogs are sitting by the pond. Two jump into the water. How many are still by the pond? Does six add two fit?"
                show: { object: frog, count: 6 }
                answer: false
                hints: ["Are there more frogs by the pond, or fewer?"]
              - id: l1-s5
                type: text_input
                text: "1 + 4 = _"
                say: "One llama is in the barn. Four more come in from the field. How many llamas are in the barn now?"
                show: { object: llama, count: 1 }
                answer: "5"
                hints: ["Start at one and count on four."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which calculation?"
                say: "Eight fish are in the tank. Mia moves two into another tank. How many are still in the first tank?"
                show: { object: fish, count: 8 }
                options: ["2 − 8", "8 − 2", "8 + 2"]
                answer: "8 − 2"
              - id: l1-n2
                type: text_input
                text: "8 − 2 = _"
                say: "How many fish are still in the first tank?"
                answer: "6"
              - id: l1-n3
                type: multiple_choice
                text: "Which calculation?"
                say: "Four cars are in the car park. Three more drive in. How many cars are there now?"
                show: { object: car, count: 4 }
                options: ["4 + 3", "4 − 3", "3 − 4"]
                answer: "4 + 3"
              - id: l1-n4
                type: text_input
                text: "4 + 3 = _"
                say: "How many cars are in the car park now?"
                answer: "7"
              - id: l1-n5
                type: multiple_choice
                text: "What do you need to find out?"
                say: "Ten leaves are on the tree. The wind blows three away. What do you need to find out?"
                show: { object: leaf, count: 10 }
                options: ["Where does the wind come from?", "How many are still on the tree?", "What kind of tree is it?"]
                answer: "How many are still on the tree?"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which calculation?"
            say: "Five mice are in the hole. Two more come in. How many mice are in the hole now?"
            show: { object: mouse, count: 5 }
            options: ["5 − 2", "2 − 5", "5 + 2"]
            answer: "5 + 2"
          - id: l1-c2
            type: fill_in_blank
            text: "Write the calculation."
            say: "Six bananas are on the table. The children eat four. How many bananas are left?"
            show: { object: banana, count: 6 }
            frame: "_ _ _ = _"
            options: ["2", "4", "6", "10", "+", "−"]
            answer: ["6", "−", "4", "2"]
          - id: l1-c3
            type: true_false
            text: "Does 3 − 9 fit?"
            say: "Nine children are on the bus. Three get off. Does three subtract nine fit?"
            answer: false

  - n: 2
    title: { de: "Frage, Rechnung, Antwort", en: "Question, number sentence, answer" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which calculation?"
            say: "Two dogs are playing in the garden. Three more come. Which calculation fits?"
            options: ["2 + 3", "3 − 2", "2 − 3"]
            answer: "2 + 3"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "8 − 5 = _"
            say: "Eight subtract five."
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: "There are seven spoons in the drawer. Dad takes three for the table. How many spoons are still in the drawer?"
            show: { object: spoon, count: 7 }
          - say: "The question: how many spoons are still in the drawer? The number sentence: seven subtract three equals four."
            text: "7 − 3 = 4"
          - say: "Say the answer in a whole sentence, with the number and what you counted: there are four spoons left in the drawer."
            text: "There are 4 spoons left in the drawer."
          - say: "Always ask yourself: are there more or fewer at the end? Then you know whether to add or take away."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which answer sentence?"
                say: "Three children are on the bench. Two more sit down. Three add two is five. Which answer sentence fits?"
                options: ["There are 5 children on the bench.", "There are 2 children on the bench.", "There are 5 benches."]
                answer: "There are 5 children on the bench."
                hints:
                  - "The number sentence says five."
                  - "You counted children, not benches."
                  - "There are 5 children on the bench."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which calculation?"
                say: "Eight birds are on the roof. Five fly off to the tree. How many birds are on the roof now?"
                options: ["8 + 5", "8 − 5", "5 − 8"]
                answer: "8 − 5"
                feedback:
                  "8 + 5": "The birds fly off the roof, so there are fewer on it: take away."
                hints:
                  - "Are there more birds on the roof at the end, or fewer?"
                  - "They fly away, so fewer."
                  - "8 − 5."
              - id: l2-f3
                type: text_input
                text: "8 − 5 = _"
                say: "How many birds are on the roof now?"
                answer: "3"
                hints:
                  - "Take five away from eight."
                  - "Seven, six, five, four, three."
                  - "3 birds."
              - id: l2-f4
                type: multiple_choice
                text: "Which answer sentence?"
                say: "How many birds are on the roof now? Which answer sentence fits?"
                options: ["There are 3 roofs.", "There are 3 birds on the roof.", "There are 5 birds on the roof."]
                answer: "There are 3 birds on the roof."
                hints:
                  - "You worked out three."
                  - "What did you count?"
                  - "There are 3 birds on the roof."
              - id: l2-f5
                type: multiple_choice
                text: "Which calculation?"
                say: "There are two marbles in the box. Gran puts four in. How many marbles are in the box now?"
                show: { object: marble, count: 2 }
                options: ["4 − 2", "2 − 4", "2 + 4"]
                answer: "2 + 4"
                hints:
                  - "More marbles or fewer?"
                  - "Gran puts some in: more."
                  - "2 + 4."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "10 − 4 = _"
                say: "Ten crayons are in the pot. Ali lends four to a friend. How many crayons are still in the pot?"
                show: { object: crayon, count: 10 }
                answer: "6"
                hints: ["Count back four from ten."]
              - id: l2-s2
                type: multiple_choice
                text: "Which answer sentence?"
                say: "How many crayons are still in the pot?"
                options: ["There are 4 crayons in the pot.", "There are 6 crayons in the pot.", "Ali has 6 pots."]
                answer: "There are 6 crayons in the pot."
                hints: ["What is ten subtract four?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which calculation?"
                say: "In the morning there are five eggs in the nest. By lunchtime there are two more. How many eggs are in the nest now?"
                show: { object: egg, count: 5 }
                options: ["5 + 2", "5 − 2", "2 − 5"]
                answer: "5 + 2"
                hints: ["More eggs at lunchtime, or fewer?"]
              - id: l2-s4
                type: true_false
                text: "Does 4 + 5 fit?"
                say: "Four children are at the playground. Five more come. How many children are there now? Does four add five fit?"
                answer: true
                hints: ["Are there more children at the end, or fewer?"]
              - id: l2-s5
                type: text_input
                text: "4 + 5 = _"
                say: "How many children are at the playground now?"
                answer: "9"
                hints: ["Start at five and count on four."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which calculation?"
                say: "Nine T-shirts are on the washing line. Dad takes six down. How many are still on the line?"
                show: { object: t-shirt, count: 9 }
                options: ["6 − 9", "9 + 6", "9 − 6"]
                answer: "9 − 6"
              - id: l2-n2
                type: text_input
                text: "9 − 6 = _"
                say: "How many T-shirts are still on the line?"
                answer: "3"
              - id: l2-n3
                type: multiple_choice
                text: "Which answer sentence?"
                say: "How many T-shirts are still on the line?"
                options: ["There are 3 T-shirts on the line.", "Dad has 3 lines.", "There are 6 T-shirts on the line."]
                answer: "There are 3 T-shirts on the line."
              - id: l2-n4
                type: text_input
                text: "3 + 3 = _"
                say: "Three children are painting a picture. Three more join in. How many children are painting now?"
                answer: "6"
              - id: l2-n5
                type: multiple_choice
                text: "What do you need to find out?"
                say: "Seven people are on the bus. Two get off at the stop. What do you need to find out?"
                options: ["How many are still on the bus?", "What is the stop called?", "Where is the bus going?"]
                answer: "How many are still on the bus?"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which calculation?"
            say: "Six monkeys are in the tree. One climbs down. How many monkeys are still in the tree?"
            show: { object: monkey, count: 6 }
            options: ["6 + 1", "6 − 1", "1 − 6"]
            answer: "6 − 1"
          - id: l2-c2
            type: fill_in_blank
            text: "Write the calculation."
            say: "There are two trees in the garden. Grandad plants six. How many trees are in the garden now?"
            show: { object: tree, count: 2 }
            frame: "2 _ _ = _"
            options: ["2", "6", "8", "4", "+", "−"]
            answer: ["+", "6", "8"]
          - id: l2-c3
            type: multiple_choice
            text: "Which answer sentence?"
            say: "Eight children are waiting for the bus. Four get on the first bus. Eight subtract four is four. Which answer sentence fits?"
            options: ["There are 4 buses waiting.", "There are 4 children still waiting.", "There are 8 children still waiting."]
            answer: "There are 4 children still waiting."
          - id: l2-c4
            type: fill_in_blank
            text: "Write the calculation."
            say: "Ten candles are on the cake. Leah blows out seven. How many are still lit?"
            frame: "_ _ _ = _"
            options: ["3", "7", "10", "5", "+", "−"]
            answer: ["10", "−", "7", "3"]
          - id: l2-c5
            type: multiple_choice
            text: "What do you need to find out?"
            say: "Ella has five books. She borrows three more from the library. What do you need to find out?"
            show: { object: book, count: 5 }
            options: ["How many books does she have now?", "What is the library called?", "Which book is the best?"]
            answer: "How many books does she have now?"
