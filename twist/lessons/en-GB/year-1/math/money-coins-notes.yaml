# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.money-coins-notes
skill: math.money.coins-notes
curriculum: en-GB
language: en
title:
  de: Münzen und Scheine
  en: Coins and notes
summary: >
  Lesson 1 names the coins: the pence coins (1p, 2p, 5p, 10p, 20p and
  50p) and the pound coins (£1 and £2), reading the number and p or £ on
  each one; lesson 2 meets the notes (£5, £10, £20 and £50), says which
  is worth more and puts coins and notes in order by value, and ends with
  the skill check.
metadata:
  year: year-1
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.compare-to-20]
  also_practises: [math.numbers-to-20.compare-to-20]
  vocabulary: { en: [money, coin, note, penny, pence, pound, worth, worth more, value] }
  forms: [text, audio, drawn]
  drawn: [coins]
  facets: [currency]
  parts:
    - { id: coins, what: { de: Münzen erkennen und ihren Wert lesen, en: recognising coins and reading their value } }
    - { id: notes, what: { de: Scheine erkennen und ihren Wert lesen, en: recognising notes and reading their value } }
    - { id: compare, what: { de: "sagen, was mehr oder weniger wert ist", en: saying which is worth more or less } }
    - { id: order, what: { de: Münzen und Scheine nach dem Wert ordnen, en: putting coins and notes in order of value } }
  misconceptions:
    - id: big-coin-worth-more
      what: Thinks a bigger coin is worth more (the 2p coin is bigger than the 5p coin, the 10p coin bigger than the 20p coin, the 50p coin bigger than the £1 coin)
      addressed: lesson 1 Learn says to read the coin, not to look at its size; l1-f4 (2p against 5p, with feedback), l1-s4 (10p against 20p) and l2-f3 (50p against £1, with feedback) put a big coin of low value next to a smaller one worth more
    - id: pence-is-pound
      what: Reads only the number and treats 2p and £2 as the same
      addressed: lesson 1 Learn points at the p or the £ sign; l1-f2 (with feedback), l1-s2, l1-n5 and l2-c2 offer the same number with the other unit
    - id: more-coins-more-money
      what: Thinks more coins are always worth more than one coin or note
      addressed: lesson 2 Learn shows one £5 note against three £1 coins; l2-f5 (with feedback), l2-s5 and l2-n5 ask whether more coins mean more money
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die Münzen", en: "The coins" }
    goal:
      de: "Lerne alle Münzen kennen und merk dir, dass die Größe einer Münze nicht zeigt, wie viel sie wert ist."
      en: "Get to know every coin, and remember that its size does not show what it is worth."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is more: 12 or 15?"
            say: "Which is more, twelve or fifteen?"
            options: ["15", "12"]
            answer: "15"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which number is greater: 9 or 19?"
            say: "Which number is greater, nine or nineteen?"
            options: ["19", "9"]
            answer: "19"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1p  2p  5p  10p  20p  50p"
            say: "These are pence coins. p stands for pence. Here are one penny, two pence, five pence, ten pence, twenty pence and fifty pence."
            show: { drawn: coins, values: [1, 2, 5, 10, 20, 50] }
          - text: "£1  £2"
            say: "These are pound coins. The sign in front is the pound sign. Here are one pound and two pounds. One pound is worth the same as one hundred pence."
            show: { drawn: coins, values: [100, 200] }
          - text: "Read the coin."
            say: "The size of a coin does not tell you what it is worth. A real two pence coin is bigger than a five pence coin, but five pence is worth more. Read the number, and look for p or the pound sign."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which coin is 10p?"
                say: "Which coin is ten pence?"
                options:
                  - { drawn: coins, values: [10] }
                  - { drawn: coins, values: [1] }
                  - { drawn: coins, values: [100] }
                answer: "10"
                hints:
                  - "Look for the number 10 on the coin."
                  - "It needs a p after the 10, for pence."
                  - "The coin that says 10p."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is this coin?"
                say: "Look at the coin. What is it?"
                show: { drawn: coins, values: [200] }
                options: ["£2", "2p", "20p"]
                answer: "£2"
                option_audio: false
                feedback:
                  "2p": "Look again: it has the pound sign. It is two pounds."
                hints:
                  - "Read the number on the coin."
                  - "Look for p or the pound sign."
                  - "It has the pound sign: £2."
              - id: l1-f3
                type: multiple_choice
                text: "What is this coin?"
                say: "Look at the coin. What is it?"
                show: { drawn: coins, values: [50] }
                options: ["50p", "5p", "£5"]
                answer: "50p"
                option_audio: false
                hints:
                  - "Read the number. Is it 5 or 50?"
                  - "It says fifty, with p for pence."
                  - "50p."
              - id: l1-f4
                type: multiple_choice
                text: "A real 2p coin is bigger than a 5p coin. Which is worth more: 2p or 5p?"
                say: "A real two pence coin is bigger than a five pence coin. Which coin is worth more, two pence or five pence?"
                options: ["5p", "2p", "They are worth the same."]
                answer: "5p"
                feedback:
                  "2p": "A 2p coin is bigger, but 5 is more than 2. Read the number, not the size."
                hints:
                  - "Read the numbers, not the size."
                  - "Which is more, 2 or 5?"
                  - "5p is worth more."
              - id: l1-f5
                type: true_false
                text: "Is it true? This coin is 1p."
                say: "Look at the coin. Is it one penny?"
                show: { drawn: coins, values: [100] }
                answer: false
                hints:
                  - "Look for p or the pound sign."
                  - "It has the pound sign."
                  - "No. It is £1, one pound."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which coin is 20p?"
                say: "Which coin is twenty pence?"
                options:
                  - { drawn: coins, values: [2] }
                  - { drawn: coins, values: [20] }
                  - { drawn: coins, values: [200] }
                answer: "20"
                hints: ["Look for 20 and p."]
              - id: l1-s2
                type: multiple_choice
                text: "What is this coin?"
                say: "Look at the coin. What is it?"
                show: { drawn: coins, values: [1] }
                options: ["1p", "£1", "10p"]
                answer: "1p"
                option_audio: false
                hints: ["Is there a p or a pound sign?"]
              - id: l1-s3
                type: true_false
                text: "Is it true? This coin is 5p."
                say: "Look at the coin. Is it five pence?"
                show: { drawn: coins, values: [5] }
                answer: true
                hints: ["Read the number and the letter on the coin."]
              - id: l1-s4
                type: multiple_choice
                text: "A real 10p coin is bigger than a 20p coin. Which is worth more: 10p or 20p?"
                say: "A real ten pence coin is bigger than a twenty pence coin. Which coin is worth more, ten pence or twenty pence?"
                options: ["20p", "10p", "They are worth the same."]
                answer: "20p"
                hints: ["Read the numbers, not the size."]
              - id: l1-s5
                type: multiple_choice
                text: "Which one is a pound coin?"
                say: "Which one is a pound coin?"
                options: ["£1", "50p", "20p"]
                answer: "£1"
                option_audio: false
                hints: ["Look for the pound sign."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Which coin is £1?"
                say: "Which coin is one pound?"
                options:
                  - { drawn: coins, values: [1] }
                  - { drawn: coins, values: [100] }
                  - { drawn: coins, values: [10] }
                answer: "100"
              - id: l1-n2
                type: multiple_choice
                text: "What is this coin?"
                say: "Look at the coin. What is it?"
                show: { drawn: coins, values: [20] }
                options: ["20p", "2p", "£20"]
                answer: "20p"
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Which is worth more: 50p or 20p?"
                say: "Which coin is worth more, fifty pence or twenty pence?"
                show: { drawn: coins, values: [50, 20] }
                options: ["50p", "20p", "They are worth the same."]
                answer: "50p"
              - id: l1-n4
                type: true_false
                text: "Is it true? This coin is 2p."
                say: "Look at the coin. Is it two pence?"
                show: { drawn: coins, values: [2] }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which is worth more: 2p or £2?"
                say: "Which is worth more, two pence or two pounds?"
                show: { drawn: coins, values: [2, 200] }
                options: ["£2", "2p", "They are worth the same."]
                answer: "£2"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which coin is 5p?"
            say: "Which coin is five pence?"
            options:
              - { drawn: coins, values: [5] }
              - { drawn: coins, values: [50] }
              - { drawn: coins, values: [2] }
            answer: "5"
          - id: l1-c2
            type: multiple_choice
            text: "What is this coin?"
            say: "Look at the coin. What is it?"
            show: { drawn: coins, values: [10] }
            options: ["10p", "1p", "£10"]
            answer: "10p"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? 1p is worth more than 2p."
            say: "One penny is worth more than two pence. Is that true?"
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            text: "Which coin is 2p?"
            say: "Which coin is two pence?"
            options:
              - { drawn: coins, values: [20] }
              - { drawn: coins, values: [2] }
              - { drawn: coins, values: [200] }
            answer: "2"
          - id: l1-c5
            type: true_false
            text: "Is it true? This coin is 20p."
            say: "Look at the coin. Is it twenty pence?"
            show: { drawn: coins, values: [20] }
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which is worth more: 1p or 10p?"
            say: "Which coin is worth more, one penny or ten pence?"
            show: { drawn: coins, values: [1, 10] }
            options: ["10p", "1p", "They are worth the same."]
            answer: "10p"

  - n: 2
    title: { de: "Scheine und der Wert", en: "Notes and value" }
    goal:
      de: "Lerne die Geldscheine kennen, so wie fünf Pfund, und ordne Münzen und Scheine nach ihrem Wert."
      en: "Get to know the notes, like five pounds, and put money in order of what it is worth."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is this coin?"
            say: "Look at the coin. What is it?"
            show: { drawn: coins, values: [5] }
            options: ["5p", "50p", "£5"]
            answer: "5p"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Which coin is £2?"
            say: "Which coin is two pounds?"
            options:
              - { drawn: coins, values: [200] }
              - { drawn: coins, values: [2] }
              - { drawn: coins, values: [20] }
            answer: "200"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "£5  £10  £20  £50"
            say: "These are notes. Notes are made of plastic, not metal. Here are five pounds, ten pounds, twenty pounds and fifty pounds."
            show: { drawn: coins, values: [500, 1000, 2000, 5000] }
          - text: "1p, 2p, 5p, 10p, 20p, 50p, £1, £2"
            say: "We can put coins in order by value. The pence coins come first, from one penny to fifty pence. Then the pound coins: one pound, then two pounds. Every pound coin is worth more than every pence coin."
            show: { drawn: coins, values: [1, 2, 5, 10, 20, 50, 100, 200] }
          - text: "£5 is worth more than £1 + £1 + £1."
            say: "Three coins are not always worth more than one note. Three one pound coins make three pounds. The five pound note is worth more."
            show: { drawn: coins, values: [500, 100, 100, 100] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which note is £10?"
                say: "Which note is ten pounds?"
                options:
                  - { drawn: coins, values: [1000] }
                  - { drawn: coins, values: [500] }
                  - { drawn: coins, values: [2000] }
                answer: "1000"
                hints:
                  - "Look for the number on each note."
                  - "You want the note with 10 on it."
                  - "The note that says £10."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Put the coins in order. Start with the one worth the least."
                say: "Put the coins in order. Start with the coin that is worth the least."
                options: ["20p", "2p", "10p", "5p"]
                slot_count: 4
                answer: ["2p", "5p", "10p", "20p"]
                hints:
                  - "Look at the numbers: 20, 2, 10 and 5."
                  - "The smallest number is 2, then 5."
                  - "2p, 5p, 10p, 20p."
              - id: l2-f3
                type: multiple_choice
                text: "The 50p coin is bigger. Which is worth more: 50p or £1?"
                say: "The fifty pence coin is bigger. Which is worth more, fifty pence or one pound?"
                show: { drawn: coins, values: [50, 100] }
                options: ["£1", "50p", "They are worth the same."]
                answer: "£1"
                feedback:
                  "50p": "The 50p coin is bigger, but £1 is worth one hundred pence. That is more than 50p."
                hints:
                  - "Read the coins, not the size."
                  - "One pound is worth one hundred pence."
                  - "£1 is worth more."
              - id: l2-f4
                type: multiple_choice
                text: "Which is worth the most?"
                say: "Which of these is worth the most?"
                options: ["£20", "£5", "£2"]
                answer: "£20"
                hints:
                  - "They are all pounds, so look at the numbers."
                  - "Which is biggest: 20, 5 or 2?"
                  - "£20."
              - id: l2-f5
                type: multiple_choice
                text: "Sam has three £1 coins. Mia has one £5 note. Who has more money?"
                say: "Sam has three one pound coins. Mia has one five pound note. Who has more money?"
                show: { drawn: coins, values: [100, 100, 100] }
                options: ["Mia", "Sam", "They have the same."]
                answer: "Mia"
                feedback:
                  "Sam": "Sam has more coins, but three £1 coins make £3. Mia's note is £5."
                hints:
                  - "Work out how much Sam has: £1, £1, £1."
                  - "Sam has £3. Mia has £5."
                  - "Mia has more."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What is this note?"
                say: "Look at the note. What is it?"
                show: { drawn: coins, values: [2000] }
                options: ["£20", "£2", "20p"]
                answer: "£20"
                option_audio: false
                hints: ["Read the number and the sign on the note."]
              - id: l2-s2
                type: ordering
                text: "Put them in order. Start with the one worth the least."
                say: "Put them in order. Start with the one that is worth the least."
                options: ["£10", "£1", "50p", "£5"]
                slot_count: 4
                answer: ["50p", "£1", "£5", "£10"]
                hints: ["Pence come before pounds."]
              - id: l2-s3
                type: true_false
                text: "Is it true? £50 is worth more than £20."
                say: "Fifty pounds is worth more than twenty pounds. Is that true?"
                answer: true
                hints: ["Which is more, 50 or 20?"]
              - id: l2-s4
                type: image_multiple_choice
                text: "Which is worth the least?"
                say: "Which one is worth the least?"
                options:
                  - { drawn: coins, values: [500] }
                  - { drawn: coins, values: [200] }
                  - { drawn: coins, values: [50] }
                answer: "50"
                hints: ["Look for the p. Pence are worth less than pounds."]
              - id: l2-s5
                type: true_false
                text: "Is it true? Four 1p coins are worth more than one 10p coin."
                say: "Four one penny coins are worth more than one ten pence coin. Is that true?"
                show: { drawn: coins, values: [1, 1, 1, 1, 10] }
                answer: false
                hints: ["Four pennies make 4p."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which note is £50?"
                say: "Which note is fifty pounds?"
                options:
                  - { drawn: coins, values: [500] }
                  - { drawn: coins, values: [5000] }
                  - { drawn: coins, values: [2000] }
                answer: "5000"
              - id: l2-n2
                type: ordering
                text: "Put them in order. Start with the one worth the most."
                say: "Put them in order. Start with the one that is worth the most."
                options: ["£2", "£20", "20p", "£5"]
                slot_count: 4
                answer: ["£20", "£5", "£2", "20p"]
              - id: l2-n3
                type: multiple_choice
                text: "Which is worth more: £10 or £2?"
                say: "Which is worth more, ten pounds or two pounds?"
                options: ["£10", "£2", "They are worth the same."]
                answer: "£10"
              - id: l2-n4
                type: multiple_choice
                text: "Which one is a note?"
                say: "Which one is a note?"
                options: ["£5", "£2", "50p"]
                answer: "£5"
              - id: l2-n5
                type: multiple_choice
                text: "Ben has two 20p coins. Ella has one 50p coin. Who has more money?"
                say: "Ben has two twenty pence coins. Ella has one fifty pence coin. Who has more money?"
                show: { drawn: coins, values: [20, 20, 50] }
                options: ["Ella", "Ben", "They have the same."]
                answer: "Ella"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: coins
            type: image_multiple_choice
            text: "Which coin is 50p?"
            say: "Which coin is fifty pence?"
            options:
              - { drawn: coins, values: [5] }
              - { drawn: coins, values: [500] }
              - { drawn: coins, values: [50] }
            answer: "50"
          - id: l2-c2
            part: coins
            type: multiple_choice
            text: "What is this coin?"
            say: "Look at the coin. What is it?"
            show: { drawn: coins, values: [100] }
            options: ["£1", "1p", "10p"]
            answer: "£1"
            option_audio: false
          - id: l2-c3
            part: order
            type: ordering
            text: "Put the coins in order. Start with the one worth the least."
            say: "Put the coins in order. Start with the coin that is worth the least."
            options: ["50p", "£2", "1p", "£1"]
            slot_count: 4
            answer: ["1p", "50p", "£1", "£2"]
          - id: l2-c4
            part: notes
            type: multiple_choice
            text: "What is this note?"
            say: "Look at the note. What is it?"
            show: { drawn: coins, values: [1000] }
            options: ["£10", "£1", "10p"]
            answer: "£10"
            option_audio: false
          - id: l2-c5
            part: compare
            type: true_false
            text: "Is it true? Two £1 coins are worth more than one £5 note."
            say: "Two one pound coins are worth more than one five pound note. Is that true?"
            answer: false
          - id: l2-c6
            part: coins
            type: multiple_choice
            text: "What is this coin?"
            say: "Look at the coin. What is it?"
            show: { drawn: coins, values: [2] }
            options: ["2p", "£2", "20p"]
            answer: "2p"
            option_audio: false
          - id: l2-c7
            part: coins
            type: true_false
            text: "Is it true? This coin is 50p."
            say: "Look at the coin. Is it fifty pence?"
            show: { drawn: coins, values: [20] }
            answer: false
          - id: l2-c8
            part: coins
            type: image_multiple_choice
            text: "Which coin is 1p?"
            say: "Which coin is one penny?"
            options:
              - { drawn: coins, values: [10] }
              - { drawn: coins, values: [100] }
              - { drawn: coins, values: [1] }
            answer: "1"
          - id: l2-c9
            part: notes
            type: image_multiple_choice
            text: "Which note is £5?"
            say: "Which note is five pounds?"
            options:
              - { drawn: coins, values: [5000] }
              - { drawn: coins, values: [500] }
              - { drawn: coins, values: [1000] }
            answer: "500"
          - id: l2-c10
            part: notes
            type: multiple_choice
            text: "What is this note?"
            say: "Look at the note. What is it?"
            show: { drawn: coins, values: [5000] }
            options: ["£50", "£5", "50p"]
            answer: "£50"
            option_audio: false
          - id: l2-c11
            part: notes
            type: true_false
            text: "Is it true? This is a £20 note."
            say: "Look at the note. Is it twenty pounds?"
            show: { drawn: coins, values: [2000] }
            answer: true
          - id: l2-c12
            part: notes
            type: multiple_choice
            text: "Which one is a coin?"
            say: "Which one is a coin?"
            options: ["£2", "£10", "£20"]
            answer: "£2"
          - id: l2-c13
            part: compare
            type: multiple_choice
            text: "Which is worth more: 5p or 50p?"
            say: "Which coin is worth more, five pence or fifty pence?"
            show: { drawn: coins, values: [5, 50] }
            options: ["50p", "5p", "They are worth the same."]
            answer: "50p"
          - id: l2-c14
            part: compare
            type: true_false
            text: "Is it true? A £2 coin is worth more than a 20p coin."
            say: "A two pound coin is worth more than a twenty pence coin. Is that true?"
            answer: true
          - id: l2-c15
            part: compare
            type: multiple_choice
            text: "Lily has one 10p coin. Tom has three 2p coins. Who has more money?"
            say: "Lily has one ten pence coin. Tom has three two pence coins. Who has more money?"
            show: { drawn: coins, values: [10, 2, 2, 2] }
            options: ["Lily", "Tom", "They have the same."]
            answer: "Lily"
          - id: l2-c16
            part: compare
            type: multiple_choice
            text: "Which is worth less: £5 or £2?"
            say: "Which is worth less, five pounds or two pounds?"
            show: { drawn: coins, values: [500, 200] }
            options: ["£2", "£5", "They are worth the same."]
            answer: "£2"
          - id: l2-c17
            part: order
            type: ordering
            text: "Put the notes in order. Start with the one worth the least."
            say: "Put the notes in order. Start with the note that is worth the least."
            options: ["£20", "£5", "£50", "£10"]
            slot_count: 4
            answer: ["£5", "£10", "£20", "£50"]
          - id: l2-c18
            part: order
            type: ordering
