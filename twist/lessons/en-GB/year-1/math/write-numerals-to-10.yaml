# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.write-numerals-to-10
skill: math.numbers-to-20.write-numerals-to-10
curriculum: en-GB
language: en
title:
  de: Die Ziffern 0 bis 10
  en: Numerals 0 to 10
summary: >
  Year 1 opens by reading and writing the numerals and matching each to
  its amount, as children move from Reception's spoken numbers to written
  ones. Lesson 1 takes 1 to 5, lesson 2 takes 6 to 10, each with how the
  numeral is formed; lesson 3 adds 0 and the number words one to ten (the
  National Curriculum asks for numerals and words in Year 1) and ends with
  the skill check. Writing the numerals is practised by tracing and
  copying in every lesson; the checks read, hear and match them. When a
  task asks which numeral fits, the numeral options have no speaker,
  because hearing "three" would give the answer.
metadata:
  year: year-1
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { en: [numeral, number, zero, write, line, curve, circle, one, two, three, four, five, six, seven, eight, nine, ten] }
  forms: [drawn, picture, text, audio]
  drawn: [letter-card, writing-lines, dots, ten-frame]
  facets: [script]
  parts:
    - { id: amount-to-numeral, what: { de: die passende Ziffer zu einer Anzahl finden, en: finding the numeral for an amount } }
    - { id: hear, what: { de: eine gehörte Zahl als Ziffer erkennen, en: recognising a numeral you hear } }
    - { id: read, what: { de: Ziffern lesen und auseinanderhalten, en: reading numerals and telling them apart } }
    - { id: numeral-to-amount, what: { de: die passende Anzahl zu einer Ziffer finden, en: finding the amount for a numeral } }
    - { id: words, what: { de: Zahlwörter von eins bis zehn lesen, en: reading the number words one to ten } }
  misconceptions:
    - id: reversal
      what: Writes some numerals back to front (2, 3, 5, 7, 9)
      addressed: tracing starts at the green dot and each tracing task says where the numeral starts; a numeral is copied only after it has been traced
    - id: six-nine
      what: Mixes up 6 and 9
      addressed: lesson 2 Learn sets them side by side (6 curls round at the bottom, 9 has its circle at the top); options set 6 against 9
    - id: ten-is-one-numeral
      what: Thinks 10 is a new single numeral
      addressed: lesson 2 Learn shows that 10 is written with a 1 and a 0, a full ten-frame and none left over
    - id: zero-is-not-a-number
      what: Does not see 0 as a number, only as nothing
      addressed: lesson 3 Learn shows 0 as an empty ten-frame and puts 0 before 1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Die Ziffern 1 bis 5, en: Numerals 1 to 5 }
    goal:
      de: "Lies und schreib die Ziffern 1 bis 5 und finde zu jeder, wie viele Dinge es sind."
      en: "Read and write the numerals 1 to 5, and match each one to how many things."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tap_to_count
            text: "Tap each duck once. How many are there?"
            say: "Tap each duck once. How many ducks are there?"
            show: { object: duck, count: 3, layout: row }
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many stars?"
            say: "How many stars are there?"
            show: { object: star, count: 5, layout: scattered }
            options: ["4", "5", "6"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 2 3 4 5"
            say: "Look at these shapes. They are called numerals. What do you think they tell us? Have a guess."
            show: { drawn: letter-card, text: "1 2 3 4 5" }
          - text: "1"
            say: "They tell us how many! This is the numeral one. It stands for one thing: one duck."
            show: { object: duck, count: 1, layout: row }
          - text: "2"
            say: "This is the numeral two. It stands for two things: two balls."
            show: { object: ball, count: 2, layout: row }
          - text: "3, 4, 5"
            say: "Then three, four, five. Each numeral tells you how many there are."
            show: { drawn: dots, count: 5, layout: dice }
          - text: "1"
            say: "We can write numerals too. One starts at the top. Go straight down, from the top line to the bottom line."
            show: { drawn: writing-lines, text: "1", mode: trace, arrows: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which numeral matches?"
                say: "How many apples are there? Tap the numeral that matches."
                show: { object: apple, count: 3, layout: row }
                options: ["2", "3", "5"]
                answer: "3"
                option_audio: false
                hints:
                  - "Count the apples first."
                  - "There are three apples. What does three look like?"
                  - "3 has two curves, one on top of the other."
                difficulty: easy
              - id: l1-f2
                type: tracing
                text: "Trace the 2."
                say: "Trace the two. Start at the green dot, curve round and go along the bottom."
                show: { drawn: writing-lines, text: "2", mode: trace, arrows: true }
                char: "2"
              - id: l1-f3
                type: audio_choice
                text: "Which numeral do you hear?"
                audio: { en: "Four." }
                options: ["1", "4", "5"]
                answer: "4"
                hints:
                  - "Listen again."
                  - "Four comes after three."
                  - "4 has a line down, a line across and a long line down."
              - id: l1-f4
                type: matching
                option_audio: false
                text: "Match them up."
                say: "Tap a numeral, then tap the dice that matches it."
                pairs:
                  - left: { text: "1" }
                    right: { drawn: dots, count: 1, layout: dice }
                  - left: { text: "3" }
                    right: { drawn: dots, count: 3, layout: dice }
                  - left: { text: "5" }
                    right: { drawn: dots, count: 5, layout: dice }
                hints:
                  - "Start with 1. Which dice has only one dot?"
                  - "3 has three dots in a line."
                  - "5 has a dot in each corner and one in the middle."
              - id: l1-f5
                type: true_false
                text: "Is it 4?"
                say: "Look at the numeral. Is it four?"
                show: { drawn: letter-card, text: "4" }
                answer: true
                hints:
                  - "4 has a line down, a line across and a long line down."
                  - "Does this numeral look like that?"
                  - "Yes, it is 4."
              - id: l1-f6
                type: tracing
                text: "Trace the 3."
                say: "Trace the three. Start at the green dot: curve round to the middle, then curve round again."
                show: { drawn: writing-lines, text: "3", mode: trace, arrows: true }
                char: "3"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which numeral matches?"
                say: "How many cars are there? Tap the numeral that matches."
                show: { object: car, count: 4, layout: row }
                options: ["3", "4", "5"]
                answer: "4"
                option_audio: false
                hints: ["Count the cars, then find that numeral."]
              - id: l1-s2
                type: audio_choice
                text: "Which numeral do you hear?"
                audio: { en: "Two." }
                options: ["2", "3", "5"]
                answer: "2"
                hints: ["Two comes after one."]
              - id: l1-s3
                type: tracing
                text: "Trace the 4."
                say: "Trace the four. Start at the green dot, go down, then across. Then the long line down."
                show: { drawn: writing-lines, text: "4", mode: trace, arrows: true }
                char: "4"
              - id: l1-s4
                type: true_false
                text: "Is it 2?"
                say: "Look at the numeral. Is it two?"
                show: { drawn: letter-card, text: "5" }
                answer: false
                hints: ["2 has a curve and a flat line at the bottom."]
              - id: l1-s5
                type: multiple_choice
                text: "Which numeral matches?"
                say: "How many dots are there? Tap the numeral that matches."
                show: { drawn: dots, count: 5, layout: dice }
                options: ["4", "5", "1"]
                answer: "5"
                option_audio: false
                hints: ["Four dots in the corners, one in the middle."]
              - id: l1-s6
                type: tracing
                text: "Trace the 5."
                say: "Trace the five. Start at the green dot, go down, curve round. Then the hat on top."
                show: { drawn: writing-lines, text: "5", mode: trace, arrows: true }
                char: "5"

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which numeral matches?"
                say: "Ella packs bananas in her lunchbox. How many bananas are there? Tap the numeral that matches."
                show: { object: banana, count: 2, layout: row }
                options: ["1", "2", "3"]
                answer: "2"
                option_audio: false
              - id: l1-n2
                type: audio_choice
                text: "Which numeral do you hear?"
                audio: { en: "Five." }
                options: ["3", "4", "5"]
                answer: "5"
              - id: l1-n3
                type: tracing
                text: "Write a 3."
                say: "Now write a three on your own."
                show: { drawn: writing-lines, text: "3", mode: copy, arrows: false }
                char: "3"
              - id: l1-n4
                type: matching
                option_audio: false
                text: "Match them up."
                say: "Tap a numeral, then tap the group that matches it."
                pairs:
                  - left: { text: "2" }
                    right: { object: fish, count: 2, layout: row }
                  - left: { text: "4" }
                    right: { object: fish, count: 4, layout: row }
                  - left: { text: "1" }
                    right: { object: fish, count: 1, layout: row }
              - id: l1-n5
                type: true_false
                text: "Is it 1?"
                say: "Look at the numeral. Is it one?"
                show: { drawn: letter-card, text: "1" }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which numeral matches?"
            say: "How many eggs are there? Tap the numeral that matches."
            show: { object: egg, count: 4, layout: row }
            options: ["2", "4", "5"]
            answer: "4"
            option_audio: false
          - id: l1-c2
            type: audio_choice
            text: "Which numeral do you hear?"
            audio: { en: "Three." }
            options: ["1", "3", "5"]
            answer: "3"
          - id: l1-c3
            type: multiple_choice
            text: "Which numeral matches?"
            say: "How many dots are there? Tap the numeral that matches."
            show: { drawn: dots, count: 2, layout: dice }
            options: ["1", "2", "4"]
            answer: "2"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Which numeral matches?"
            say: "How many socks are there? Tap the numeral that matches."
            show: { object: sock, count: 1, layout: row }
            options: ["1", "2", "4"]
            answer: "1"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it 3?"
            say: "Look at the numeral. Is it three?"
            show: { drawn: letter-card, text: "3" }
            answer: true
          - id: l1-c6
            type: true_false
            text: "Is it true?"
            say: "Listen. Is this the numeral five?"
            show: { drawn: letter-card, text: "4" }
            answer: false

  - n: 2
    title: { de: Die Ziffern 6 bis 10, en: Numerals 6 to 10 }
    goal:
      de: "Lies und schreib die Ziffern 6 bis 10 und verwechsle 6 und 9 nicht."
      en: "Read and write the numerals 6 to 10, and do not mix up 6 and 9."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which numeral matches?"
            say: "How many balloons are there? Tap the numeral that matches."
            show: { object: balloon, count: 4, layout: row }
            options: ["3", "4", "5"]
            answer: "4"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Which numeral do you hear?"
            audio: { en: "One." }
            options: ["1", "4", "5"]
            answer: "1"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "How many?"
            say: "Here is a full row of five, and one more. How many counters do you think there are? Have a guess."
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
          - text: "6"
            say: "Six! A full row of five, and one more. This is the numeral six."
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
          - text: "7, 8, 9"
            say: "Seven, eight, nine: five, and two more, three more, four more."
            show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
          - text: "10"
            say: "Ten: the frame is full. Ten is written with a one and a zero. One full ten, and nothing left over."
            show: { drawn: ten-frame, filled: 10 }
          - text: "6    9"
            say: "Six and nine look alike. Six curls round at the bottom. Nine has its circle at the top, then a straight line down."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which numeral matches?"
                say: "How many counters are there? Tap the numeral that matches."
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                options: ["6", "7", "8"]
                answer: "7"
                option_audio: false
                hints:
                  - "A full row is five."
                  - "Five, and two more."
                  - "Five and two make 7."
                difficulty: easy
              - id: l2-f2
                type: tracing
                text: "Trace the 6."
                say: "Trace the six. Start at the green dot at the top, curve down and curl round at the bottom."
                show: { drawn: writing-lines, text: "6", mode: trace, arrows: true }
                char: "6"
              - id: l2-f3
                type: audio_choice
                text: "Which numeral do you hear?"
                audio: { en: "Nine." }
                options: ["6", "9", "10"]
                answer: "9"
                hints:
                  - "Listen again."
                  - "Nine comes just before ten."
                  - "9 has its circle at the top."
              - id: l2-f4
                type: matching
                option_audio: false
                text: "Match them up."
                say: "Tap a numeral, then tap the ten-frame that matches it."
                pairs:
                  - left: { text: "6" }
                    right: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
                  - left: { text: "8" }
                    right: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                  - left: { text: "10" }
                    right: { drawn: ten-frame, filled: 10 }
                hints:
                  - "Start with 10. Which frame is full?"
                  - "6 is five and one more."
                  - "8 is five and three more."
              - id: l2-f5
                type: true_false
                text: "Is it 6?"
                say: "Look at the numeral. Is it six?"
                show: { drawn: letter-card, text: "9" }
                answer: false
                hints:
                  - "Where is the circle, at the top or the bottom?"
                  - "Six curls round at the bottom."
                  - "The circle is at the top, so it is 9, not 6."
              - id: l2-f6
                type: multiple_choice
                text: "Which numeral matches?"
                say: "Leo empties his marble bag on the floor. How many marbles are there? Tap the numeral that matches."
                show: { object: marble, count: 10, layout: row }
                options: ["8", "9", "10"]
                answer: "10"
                option_audio: false
                hints:
                  - "Count them one by one."
                  - "Point at each marble as you count."
                  - "There are ten. Ten is a 1 and a 0."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which numeral matches?"
                say: "How many counters are there? Tap the numeral that matches."
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                options: ["8", "9", "10"]
                answer: "9"
                option_audio: false
                hints: ["One space is empty."]
              - id: l2-s2
                type: tracing
                text: "Trace the 7."
                say: "Trace the seven. Start at the green dot, go along the top, then a long line down."
                show: { drawn: writing-lines, text: "7", mode: trace, arrows: true }
                char: "7"
              - id: l2-s3
                type: audio_choice
                text: "Which numeral do you hear?"
                audio: { en: "Eight." }
                options: ["6", "8", "9"]
                answer: "8"
                hints: ["Eight comes after seven."]
              - id: l2-s4
                type: true_false
                text: "Is it 10?"
                say: "Look at the numeral. Is it ten?"
                show: { drawn: letter-card, text: "10" }
                answer: true
                hints: ["Ten is a 1 and a 0."]
              - id: l2-s5
                type: tracing
                text: "Trace the 8."
                say: "Trace the eight. Start at the green dot, curve one way, then cross over and curve back up."
                show: { drawn: writing-lines, text: "8", mode: trace, arrows: true }
                char: "8"
              - id: l2-s6
                type: multiple_choice
                text: "Which numeral matches?"
                say: "How many shells are there? Tap the numeral that matches."
                show: { object: shell, count: 6, layout: scattered }
                options: ["6", "7", "9"]
                answer: "6"
                option_audio: false
                hints: ["Tap each shell as you count."]

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Trace the 9."
                say: "Trace the nine. Start at the green dot, make the circle at the top, then go straight down."
                show: { drawn: writing-lines, text: "9", mode: trace, arrows: true }
                char: "9"
              - id: l2-n2
                type: multiple_choice
                text: "Which numeral matches?"
                say: "How many counters are there? Tap the numeral that matches."
                show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                options: ["7", "8", "9"]
                answer: "8"
                option_audio: false
              - id: l2-n3
                type: audio_choice
                text: "Which numeral do you hear?"
                audio: { en: "Six." }
                options: ["6", "9", "7"]
                answer: "6"
              - id: l2-n4
                type: tracing
                text: "Trace the 10."
                say: "Trace ten: a one, then a zero next to it."
                show: { drawn: writing-lines, text: "10", mode: trace, arrows: true }
                char: "10"
              - id: l2-n5
                type: true_false
                text: "Is it 7?"
                say: "Look at the numeral. Is it seven?"
                show: { drawn: letter-card, text: "7" }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which numeral matches?"
            say: "How many counters are there? Tap the numeral that matches."
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
            options: ["5", "6", "9"]
            answer: "6"
            option_audio: false
          - id: l2-c2
            type: audio_choice
            text: "Which numeral do you hear?"
            audio: { en: "Ten." }
            options: ["1", "9", "10"]
            answer: "10"
          - id: l2-c3
            type: multiple_choice
            text: "Which numeral matches?"
            say: "How many cups are there? Tap the numeral that matches."
            show: { object: cup, count: 7, layout: row }
            options: ["6", "7", "8"]
            answer: "7"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which numeral matches?"
            say: "How many leaves are there? Tap the numeral that matches."
            show: { object: leaf, count: 9, layout: scattered }
            options: ["9", "6", "10"]
            answer: "9"
            option_audio: false
          - id: l2-c5
            type: audio_choice
            text: "Which numeral do you hear?"
            audio: { en: "Seven." }
            options: ["7", "6", "8"]
            answer: "7"
          - id: l2-c6
            type: true_false
            text: "Is it 8?"
            say: "Look at the numeral. Is it eight?"
            show: { drawn: letter-card, text: "6" }
            answer: false

  - n: 3
    title: { de: Null und Zahlwörter, en: Zero and number words }
    goal:
      de: "Lerne, dass null gar nichts heißt, und finde zu jeder Zahl das passende Wort."
      en: "Learn that zero means none at all, and match each number to its word."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Which numeral matches?"
            say: "How many counters are there? Tap the numeral that matches."
            show: { drawn: ten-frame, filled: 10 }
            options: ["9", "10", "1"]
            answer: "10"
            option_audio: false
            difficulty: easy
          - id: l3-w2
            type: audio_choice
            text: "Which numeral do you hear?"
            audio: { en: "Seven." }
            options: ["1", "7", "9"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "How many?"
            say: "How many counters are in this ten-frame? Have a guess."
            show: { drawn: ten-frame, filled: 0 }
          - text: "0"
            say: "None at all! The ten-frame is empty. There are no counters. The numeral for none is zero."
            show: { drawn: ten-frame, filled: 0 }
          - text: "0, 1, 2, 3"
            say: "Zero is a number too. It comes before one: zero, one, two, three."
          - text: "Did you know? In football, 0 is called nil. In tennis, 0 is called love!"
            say: "Did you know? Zero has other names. In a football score, zero is called nil: two nil. And in tennis, zero is called love!"
          - text: "3    three"
            say: "Numbers can be written as words too. The numeral three and the word three mean the same: three things."
            show: { drawn: dots, count: 3, layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Which numeral matches?"
                say: "How many counters are there? Tap the numeral that matches."
                show: { drawn: ten-frame, filled: 0 }
                options: ["0", "1", "10"]
                answer: "0"
                option_audio: false
                hints:
                  - "Look closely. Are there any counters?"
                  - "There are none."
                  - "None is 0."
                difficulty: easy
              - id: l3-f2
                type: tracing
                text: "Trace the 0."
                say: "Trace the zero. Start at the green dot at the top and go all the way round."
                show: { drawn: writing-lines, text: "0", mode: trace, arrows: true }
                char: "0"
              - id: l3-f3
                type: matching
                option_audio: false
                text: "Match them up."
                say: "Tap a numeral, then tap the word that says the same number."
                pairs:
                  - left: { text: "2" }
                    right: { text: "two" }
                  - left: { text: "5" }
                    right: { text: "five" }
                  - left: { text: "8" }
                    right: { text: "eight" }
                hints:
                  - "Read each word slowly."
                  - "Two starts with t, five with f, eight with e."
                  - "2 is two, 5 is five, 8 is eight."
              - id: l3-f4
                type: multiple_choice
                text: "Which word matches?"
                say: "How many ducks are there? Tap the word that matches."
                show: { object: duck, count: 4, layout: row }
                options: ["three", "four", "five", "quack"]
                answer: "four"
                option_audio: false
                feedback:
                  "quack": "Quack is what the ducks say! Count the ducks, then find the number word."
                hints:
                  - "Count the ducks."
                  - "There are four. Which word starts with f and ends with r?"
