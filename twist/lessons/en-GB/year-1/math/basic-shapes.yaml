# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.basic-shapes
skill: math.shapes.basic-shapes
curriculum: en-GB
language: en
title:
  de: Kreis, Dreieck, Rechteck, Quadrat
  en: Circles, triangles, rectangles and squares
summary: >
  Lesson 1 names circles, triangles, rectangles and squares by their
  sides and corners, and learns that a square is a special rectangle
  with four sides the same length; lesson 2 finds the shapes in
  different colours and sizes and in things around us (a clock face, a
  door, a sign), and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Formen, en: Shapes }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.count-to-5]
  also_practises: [math.numbers-to-20.count-to-5]
  vocabulary: { en: [shape, 2-D shape, circle, triangle, rectangle, square, side, corner, straight, curved] }
  forms: [drawn, picture, text, audio]
  drawn: [shape]
  facets: []
  parts:
    - { id: name, what: { de: "Kreis, Dreieck, Rechteck und Quadrat erkennen und benennen", en: "recognising and naming circles, triangles, rectangles and squares" } }
    - { id: corners-sides, what: { de: Formen an ihren Ecken und Seiten unterscheiden, en: telling shapes apart by their sides and corners } }
    - { id: around-us, what: { de: Formen in der Umwelt finden, en: finding shapes around us } }
  misconceptions:
    - id: square-not-rectangle
      what: Thinks a square cannot be a rectangle, or calls any rectangle a square
      addressed: lesson 1 Learn says a square is a rectangle with all four sides the same length; l1-f4 (with feedback) asks whether a square is a rectangle, and l1-s4, l1-n3 and l2-c3 name the square by its four equal sides
    - id: colour-size-change-shape
      what: Thinks a shape in a different colour has a different name (only a red one is a triangle)
      addressed: lesson 2 Learn shows two triangles in two colours; l2-f2 (with feedback), l2-s2 and l2-n2 ask about a shape in a new colour
    - id: circle-has-corners
      what: Counts corners or sides on a circle
      addressed: lesson 1 Learn says a circle has one curved side and no corners; l1-f5 (with feedback), l1-s5 and l1-n5 ask about the circle's corners
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Formen und ihre Ecken", en: "Sides and corners" }
    goal:
      de: "Zähl die Seiten und Ecken, um eine Form zu benennen, so wie ein Dreieck hat 3 Seiten und 3 Ecken."
      en: "Count the sides and corners to name a shape, like a triangle has 3 of each."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tap_to_count
            text: "How many apples?"
            say: "Tap each apple. How many are there?"
            show: { object: apple, count: 3, layout: row }
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: tap_to_count
            text: "How many balls?"
            say: "Tap each ball. How many are there?"
            show: { object: ball, count: 4, layout: row }
            options: ["3", "4", "5"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Which one has no corners?"
            say: "Look at these three shapes. One of them has no corners at all. Which one do you think it is? Have a guess."
            show: { drawn: shape, row: [triangle, circle, square], colours: [blue, red, green] }
          - text: "circle"
            say: "The circle! This is a circle. It is round. It has one curved side and no corners."
            show: { drawn: shape, kind: circle, colour: red }
          - text: "triangle: 3 sides, 3 corners"
            say: "This is a triangle. It has three straight sides and three corners."
            show: { drawn: shape, kind: triangle, colour: blue }
          - text: "rectangle: 4 sides, 4 corners"
            say: "This is a rectangle. It has four straight sides and four corners. The sides opposite each other are the same length."
            show: { drawn: shape, kind: rectangle, colour: yellow }
          - text: "square: 4 sides the same length"
            say: "This is a square. It has four sides and four corners too, and all four sides are the same length. A square is a special rectangle."
            show: { drawn: shape, kind: square, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which one is the triangle?"
                say: "Tap the triangle."
                options:
                  - { drawn: shape, kind: triangle, colour: blue }
                  - { drawn: shape, kind: circle, colour: blue }
                  - { drawn: shape, kind: square, colour: blue }
                answer: "triangle"
                hints:
                  - "Count the corners on each shape."
                  - "A triangle has three corners."
                  - "The shape with three sides and three corners."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is this shape called?"
                say: "What is this shape called?"
                show: { drawn: shape, kind: rectangle, colour: red }
                options: ["rectangle", "triangle", "circle"]
                answer: "rectangle"
                hints:
                  - "Count its sides."
                  - "It has four sides. Two are long and two are short."
                  - "A rectangle."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which one is the square?"
                say: "Tap the square."
                options:
                  - { drawn: shape, kind: square, colour: purple }
                  - { drawn: shape, kind: triangle, colour: purple }
                  - { drawn: shape, kind: circle, colour: purple }
                answer: "square"
                hints:
                  - "A square has four corners."
                  - "All four of its sides are the same length."
                  - "The shape with four equal sides."
              - id: l1-f4
                type: true_false
                text: "Is it true? A square is a special rectangle."
                say: "A square is a special rectangle. Is that true?"
                show: { drawn: shape, kind: square, colour: green }
                answer: true
                feedback:
                  "false": "A square has four straight sides and four corners, like every rectangle. Its sides are all the same length, so it is a special rectangle."
                hints:
                  - "Does a square have four straight sides and four corners?"
                  - "Every rectangle has four sides and four corners."
                  - "Yes. A square is a rectangle with all its sides the same length."
              - id: l1-f5
                type: multiple_choice
                text: "How many corners does a circle have?"
                say: "How many corners does a circle have?"
                show: { drawn: shape, kind: circle, colour: orange }
                options: ["0", "1", "4"]
                answer: "0"
                feedback:
                  "1": "A circle has one curved side, but no corners at all."
                hints:
                  - "Run your finger round the circle."
                  - "Is there anywhere it turns a sharp corner?"
                  - "0. A circle has no corners."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which one is the circle?"
                say: "Tap the circle."
                options:
                  - { drawn: shape, kind: triangle, colour: red }
                  - { drawn: shape, kind: rectangle, colour: red }
                  - { drawn: shape, kind: circle, colour: red }
                answer: "circle"
                hints: ["A circle is round."]
              - id: l1-s2
                type: matching
                text: "Match each shape to its name."
                say: "Match each shape to its name."
                pairs:
                  - { left: { drawn: shape, kind: circle, colour: blue }, right: { text: "circle" } }
                  - { left: { drawn: shape, kind: triangle, colour: blue }, right: { text: "triangle" } }
                  - { left: { drawn: shape, kind: rectangle, colour: blue }, right: { text: "rectangle" } }
                hints: ["Count the corners: none, three or four."]
              - id: l1-s3
                type: multiple_choice
                text: "How many sides does a triangle have?"
                say: "How many sides does a triangle have?"
                show: { drawn: shape, kind: triangle, colour: yellow }
                options: ["3", "4", "2"]
                answer: "3"
                hints: ["Count the straight sides."]
              - id: l1-s4
                type: multiple_choice
                text: "Which shape has 4 sides that are all the same length?"
                say: "Which shape has four sides that are all the same length?"
                options: ["square", "triangle", "circle"]
                answer: "square"
                hints: ["It is a special rectangle."]
              - id: l1-s5
                type: true_false
                text: "Is it true? A circle has 4 corners."
                say: "A circle has four corners. Is that true?"
                answer: false
                hints: ["A circle is round all the way."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What is this shape called?"
                say: "What is this shape called?"
                show: { drawn: shape, kind: triangle, colour: green }
                options: ["triangle", "square", "circle"]
                answer: "triangle"
              - id: l1-n2
                type: image_multiple_choice
                text: "Which one is the rectangle?"
                say: "Tap the rectangle."
                options:
                  - { drawn: shape, kind: circle, colour: yellow }
                  - { drawn: shape, kind: rectangle, colour: yellow }
                  - { drawn: shape, kind: triangle, colour: yellow }
                answer: "rectangle"
              - id: l1-n3
                type: multiple_choice
                text: "What is this shape called?"
                say: "All its sides are the same length. What is this shape called?"
                show: { drawn: shape, kind: square, colour: red }
                options: ["square", "triangle", "circle"]
                answer: "square"
              - id: l1-n4
                type: multiple_choice
                text: "How many corners does a rectangle have?"
                say: "How many corners does a rectangle have?"
                show: { drawn: shape, kind: rectangle, colour: purple }
                options: ["4", "3", "0"]
                answer: "4"
              - id: l1-n5
                type: multiple_choice
                text: "Which shape has no corners?"
                say: "Which shape has no corners?"
                options: ["circle", "triangle", "rectangle"]
                answer: "circle"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which one is the triangle?"
            say: "Tap the triangle."
            options:
              - { drawn: shape, kind: rectangle, colour: green }
              - { drawn: shape, kind: triangle, colour: green }
              - { drawn: shape, kind: circle, colour: green }
            answer: "triangle"
          - id: l1-c2
            type: multiple_choice
            text: "What is this shape called?"
            say: "What is this shape called?"
            show: { drawn: shape, kind: circle, colour: blue }
            options: ["circle", "square", "triangle"]
            answer: "circle"
          - id: l1-c3
            type: multiple_choice
            text: "How many corners does a square have?"
            say: "How many corners does a square have?"
            options: ["4", "3", "0"]
            answer: "4"
          - id: l1-c4
            type: image_multiple_choice
            text: "Which shape has 4 sides the same length?"
            say: "Tap the shape with four sides that are all the same length."
            options:
              - { drawn: shape, kind: rectangle, colour: blue }
              - { drawn: shape, kind: square, colour: blue }
              - { drawn: shape, kind: triangle, colour: blue }
            answer: "square"
          - id: l1-c5
            type: true_false
            text: "Is it true? A rectangle has 3 corners."
            say: "A rectangle has three corners. Is that true?"
            answer: false
          - id: l1-c6
            type: true_false
            text: "Is it true? All 4 sides of this square are the same length."
            say: "All four sides of this square are the same length. Is that true?"
            show: { drawn: shape, kind: square, colour: orange }
            answer: true

  - n: 2
    title: { de: "Formen um mich herum", en: "Shapes around me" }
    goal:
      de: "Finde Kreise, Dreiecke und Rechtecke um dich herum, so wie ein Uhrzifferblatt oder eine Tür."
      en: "Find circles, triangles and rectangles all around you, like a clock face or a door."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is this shape called?"
            say: "What is this shape called?"
            show: { drawn: shape, kind: rectangle, colour: green }
            options: ["rectangle", "triangle", "circle"]
            answer: "rectangle"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many corners does a triangle have?"
            say: "How many corners does a triangle have?"
            options: ["3", "4", "0"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Is the blue one a triangle too?"
            say: "The red shape is a triangle. The blue one has a different colour. Do you think it is still a triangle? Have a guess."
            show: { drawn: shape, row: [triangle, triangle], colours: [red, blue] }
          - text: "Red or blue: still a triangle."
            say: "Yes! These are both triangles. One is red and one is blue. The colour does not change the name. Count the sides and corners."
            show: { drawn: shape, row: [triangle, triangle], colours: [red, blue] }
          - text: "A clock face is a circle."
            say: "We can find shapes all around us. The face of a clock is a circle. So is a pizza."
            show: { objects: [clock, pizza] }
          - text: "A door is a rectangle."
            say: "A door is a rectangle. A phone screen is a rectangle too."
            show: { objects: [door, mobile-phone] }
          - text: "Did you know? Road signs that warn you are triangles."
            say: "Did you know? Road signs use shapes to talk to us. A sign that warns you of danger ahead is a triangle. A sign that tells drivers what they must do is usually a circle. Look out for them on your way home!"
            show: { drawn: shape, row: [triangle, circle], colours: [red, blue] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What shape is the clock face?"
                say: "Look at the clock. What shape is its face?"
                show: { object: clock }
                options: ["circle", "triangle", "rectangle"]
                answer: "circle"
                hints:
                  - "Does it have any corners?"
                  - "It is round, with no corners."
                  - "A circle."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Is it true? These are both triangles."
                say: "One shape is red and one is blue. Are they both triangles?"
                show: { drawn: shape, row: [triangle, triangle], colours: [red, blue] }
                answer: true
                feedback:
                  "false": "Count the corners: each has three. Colour does not change the name, so both are triangles."
                hints:
                  - "Do not look at the colour. Count the corners."
                  - "Each shape has three sides and three corners."
                  - "Yes, both are triangles."
              - id: l2-f3
                type: multiple_choice
                text: "What shape is the door?"
                say: "Look at the door. What shape is it?"
                show: { object: door }
                options: ["rectangle", "circle", "triangle"]
                answer: "rectangle"
                hints:
                  - "Count the corners of the door."
                  - "It has four corners and four straight sides. Two sides are long."
                  - "A rectangle."
              - id: l2-f4
                type: multiple_choice
                text: "Which shape is the tree most like?"
                say: "Look at the fir tree. Which shape is it most like?"
                show: { object: fir-tree }
                options: ["triangle", "circle", "square"]
                answer: "triangle"
                hints:
                  - "Look at the outline of the green part."
                  - "It is wide at the bottom and comes to a point at the top."
                  - "A triangle."
              - id: l2-f5
                type: sorting
                text: "Sort the things by shape."
                say: "Is it a circle or a rectangle? Sort the things."
                bins:
                  - { id: circle, show: { text: "circle" }, say: "Circle." }
                  - { id: rectangle, show: { text: "rectangle" }, say: "Rectangle." }
                options:
                  - { object: pizza, bin: circle }
                  - { object: clock, bin: circle }
                  - { object: door, bin: rectangle }
                  - { object: mobile-phone, bin: rectangle }
                hints:
                  - "Does it have corners or not?"
                  - "Round things go with the circle. Things with four corners go with the rectangle."
                  - "Pizza and clock: circle. Door and phone: rectangle."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What shape is the pizza?"
                say: "Look at the pizza from above. What shape is it?"
                show: { object: pizza }
                options: ["circle", "square", "triangle"]
                answer: "circle"
                hints: ["It is round."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which one is a circle?"
                say: "Tap the circle. Look at the shape, not the colour."
                options:
                  - { drawn: shape, kind: square, colour: red }
                  - { drawn: shape, kind: circle, colour: green }
                  - { drawn: shape, kind: triangle, colour: red }
                answer: "circle"
                hints: ["A circle has no corners, whatever its colour."]
              - id: l2-s3
                type: multiple_choice
                text: "What shape is the sign?"
                say: "Look at the toilet sign. All its sides are the same length. What shape is it?"
                show: { object: sign-toilet }
                options: ["square", "circle", "triangle"]
                answer: "square"
                hints: ["It has four sides that are all the same length."]
              - id: l2-s4
                type: true_false
                text: "Is it true? A phone screen is a triangle."
                say: "A phone screen is a triangle. Is that true?"
                show: { object: mobile-phone }
                answer: false
                hints: ["Count the corners of the screen."]
              - id: l2-s5
                type: multiple_choice
                text: "Which has 3 sides and 3 corners?"
                say: "Which shape has three sides and three corners?"
                options: ["triangle", "rectangle", "circle"]
                answer: "triangle"
                hints: ["Tri means three."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What shape is the exit sign?"
                say: "Look at the green exit sign. What shape is it?"
                show: { object: sign-exit }
                options: ["rectangle", "circle", "triangle"]
                answer: "rectangle"
              - id: l2-n2
                type: true_false
                text: "Is it true? These are both squares."
                say: "One shape is red and one is yellow. Are they both squares?"
                show: { drawn: shape, row: [square, square], colours: [red, yellow] }
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Which thing is a circle?"
                say: "Which of these things is a circle?"
                options: ["a clock face", "a door", "a book", "a banana"]
                answer: "a clock face"
                feedback:
                  "a banana": "A banana is bendy, but it is not round like a circle. Look for the round thing."
              - id: l2-n4
                type: sorting
                text: "Sort the things: corners or no corners?"
                say: "Does the thing have corners or no corners? Sort the things."
                bins:
                  - { id: corners, show: { text: "corners" }, say: "Corners." }
                  - { id: none, show: { text: "no corners" }, say: "No corners." }
                options:
                  - { object: book, bin: corners }
                  - { object: sign-toilet, bin: corners }
                  - { object: clock, bin: none }
                  - { object: pizza, bin: none }
              - id: l2-n5
                type: multiple_choice
                text: "Which shape has 4 sides, with 2 long sides and 2 short sides?"
                say: "Which shape has four sides, with two long sides and two short sides?"
                options: ["rectangle", "triangle", "circle"]
                answer: "rectangle"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: corners-sides
            type: image_multiple_choice
            text: "Which shape has 3 corners?"
            say: "Tap the shape with three corners."
            options:
              - { drawn: shape, kind: rectangle, colour: orange }
              - { drawn: shape, kind: circle, colour: blue }
              - { drawn: shape, kind: triangle, colour: green }
            answer: "triangle"
          - id: l2-c2
            part: corners-sides
            type: multiple_choice
            text: "How many sides does a rectangle have?"
            say: "How many sides does a rectangle have?"
            options: ["4", "3", "1"]
            answer: "4"
          - id: l2-c3
            part: name
            type: multiple_choice
            text: "What is this shape called?"
            say: "What is this shape called?"
            show: { drawn: shape, kind: square, colour: blue }
            options: ["square", "circle", "triangle"]
            answer: "square"
          - id: l2-c4
            part: around-us
            type: multiple_choice
            text: "What shape is the glass of the mirror?"
            say: "Look at the mirror. What shape is its glass?"
            show: { object: mirror }
            options: ["circle", "triangle", "rectangle"]
            answer: "circle"
          - id: l2-c5
            part: corners-sides
            type: true_false
            text: "Is it true? A triangle has 4 corners."
            say: "A triangle has four corners. Is that true?"
            answer: false
          - id: l2-c6
            part: name
            type: multiple_choice
            text: "What is this shape called?"
            say: "What is this shape called?"
            show: { drawn: shape, kind: rectangle, colour: green, size: 70 }
            options: ["rectangle", "square", "circle"]
            answer: "rectangle"
          - id: l2-c7
            part: name
            type: matching
            text: "Which name goes with each shape? Match them."
            say: "Which name goes with each shape? Match them."
            pairs:
              - { left: { drawn: shape, kind: square, colour: orange }, right: { text: "square" } }
              - { left: { drawn: shape, kind: circle, colour: purple }, right: { text: "circle" } }
              - { left: { drawn: shape, kind: triangle, colour: red }, right: { text: "triangle" } }
          - id: l2-c8
            part: name
            type: image_multiple_choice
            text: "Which shape is a circle?"
            say: "Which shape is a circle?"
            options:
              - { drawn: shape, kind: square, colour: yellow, size: 120 }
              - { drawn: shape, kind: circle, colour: yellow, size: 70 }
              - { drawn: shape, kind: triangle, colour: yellow, size: 120 }
            answer: "circle"
          - id: l2-c9
            part: name
            type: true_false
            text: "Is it true? This shape is a triangle."
            say: "Is this shape a triangle?"
            show: { drawn: shape, kind: triangle, colour: purple }
            answer: true
          - id: l2-c10
            part: name
            type: true_false
            text: "Is it true? This shape is a square."
            say: "Is this shape a square?"
            show: { drawn: shape, kind: rectangle, colour: orange }
            answer: false
          - id: l2-c11
            part: name
            type: image_multiple_choice
            text: "Which shape is a square?"
            say: "Which shape is a square?"
            options:
              - { drawn: shape, kind: rectangle, colour: red }
              - { drawn: shape, kind: square, colour: red, size: 70 }
              - { drawn: shape, kind: triangle, colour: red }
            answer: "square"
          - id: l2-c12
            part: corners-sides
            type: multiple_choice
            text: "How many sides does a square have?"
            say: "How many sides does a square have?"
            options: ["4", "3", "0"]
            answer: "4"
          - id: l2-c13
            part: corners-sides
            type: image_multiple_choice
            text: "Which shape has 4 corners?"
            say: "Tap the shape with four corners."
            options:
              - { drawn: shape, kind: triangle, colour: blue }
              - { drawn: shape, kind: rectangle, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
            answer: "rectangle"
          - id: l2-c14
            part: corners-sides
            type: true_false
            text: "Is it true? A circle has 1 curved side."
            say: "A circle has one curved side. Is that true?"
            answer: true
          - id: l2-c15
            part: around-us
            type: multiple_choice
            text: "What shape is the front of the dice?"
            say: "Look at the front of the dice. What shape is it?"
            show: { object: dice }
            options: ["square", "circle", "triangle"]
            answer: "square"
          - id: l2-c16
            part: around-us
            type: multiple_choice
            text: "What shape is the cover of the book?"
            say: "Look at the book. What shape is its cover?"
            show: { object: book }
            options: ["rectangle", "circle", "triangle"]
            answer: "rectangle"
          - id: l2-c17
            part: around-us
            type: true_false
            text: "Is it true? The pizza is a triangle."
            say: "The pizza is a triangle. Is that true?"
            show: { object: pizza }
            answer: false
          - id: l2-c18
            part: around-us
            type: image_multiple_choice
            text: "Which thing is a rectangle?"
            say: "Which thing is a rectangle?"
            options:
              - { object: door }
              - { object: clock }
              - { object: pizza }
            answer: "door"
          - id: l2-c19
            part: around-us
            type: sorting
            text: "Sort the things: circle or rectangle?"
            say: "Is it a circle or a rectangle? Sort the things."
            bins:
