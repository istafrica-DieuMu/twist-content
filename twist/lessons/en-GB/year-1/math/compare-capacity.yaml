# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.compare-capacity
skill: math.mass-capacity.compare-capacity
curriculum: en-GB
language: en
title:
  de: Rauminhalte vergleichen
  en: Comparing capacity
summary: >
  Lesson 1 says which container holds more or less (a jug and a cup, a
  bath and a bucket) and whether it is full, half full or empty; lesson 2
  compares by counting how many cups fill each container, learns that a
  taller container does not always hold more, orders three containers,
  and ends with the skill check. Containers come as pictures and short
  stories; a drawn container with a water level waits for a component.
metadata:
  year: year-1
  topic: { de: Rauminhalte, en: Capacity }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.compare-to-10]
  also_practises: [math.numbers-to-20.compare-to-10]
  vocabulary: { en: [capacity, holds more, holds less, the same, full, half full, empty, nearly full, nearly empty, container] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: compare, what: { de: "sagen, in welches Gefäß mehr oder weniger passt", en: saying which container holds more or less } }
    - { id: fill, what: { de: "sagen, ob ein Gefäß voll, halb voll oder leer ist", en: "saying whether a container is full, half full or empty" } }
    - { id: cups, what: { de: mit Bechern vergleichen und ordnen, en: comparing and ordering by counting cups } }
  misconceptions:
    - id: taller-holds-more
      what: Thinks the taller container always holds more
      addressed: lesson 2 Learn shows a tall thin vase and a wide bowl, and finds out by counting cups; l2-f3 (with feedback), l2-s3 and l2-n3 ask about a tall container that holds less
    - id: any-amount-half-full
      what: Calls any glass with some water in it half full, not only one filled to the middle
      addressed: lesson 1 Learn fills to the middle for half full; l1-f3, l1-s3, l1-n3 and l2-c2 ask about a glass filled to the middle or to the top
    - id: more-cups-means-less
      what: Thinks that if it takes more cups to fill a container, the container holds less
      addressed: lesson 2 Learn says more cups to fill it means it holds more; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c3 compare by cups
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Voll, halb voll, leer", en: "Full, half full, empty" }
    goal:
      de: "Sag, in welches Gefäß mehr passt und ob es voll, halb voll oder leer ist."
      en: "Say which container holds more, and if it is full, half full or empty."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is more: 4 or 6?"
            say: "Which is more, four or six?"
            options: ["6", "4"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which is less: 9 or 3?"
            say: "Which is less, nine or three?"
            options: ["3", "9"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The jug holds more than the cup."
            say: "Here are a jug and a cup. If we fill them both with water, the jug holds more. The cup holds less. How much a container holds is its capacity."
            show: { objects: [jug, cup] }
          - text: "full, half full, empty"
            say: "When a glass is filled right to the top, it is full. When it is filled to the middle, it is half full. When there is nothing in it, it is empty."
          - text: "Two glasses the same, both half full: the same amount"
            say: "Two glasses the same size, both half full. There is the same amount of juice in each."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which holds more water: a bath or a bucket?"
                say: "Which holds more water, a bath or a bucket?"
                options: ["a bath", "a bucket", "the same"]
                answer: "a bath"
                hints:
                  - "Imagine filling both with water."
                  - "You can sit in a bath."
                  - "A bath holds more."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which holds less: the spoon or the cup?"
                say: "Which holds less, the spoon or the cup?"
                show: { objects: [spoon, cup] }
                options: ["the spoon", "the cup", "the same"]
                answer: "the spoon"
                hints:
                  - "Less means not as much."
                  - "You need lots of spoonfuls to fill a cup."
                  - "The spoon holds less."
              - id: l1-f3
                type: multiple_choice
                text: "The juice comes up to the middle of the glass. Is the glass full, half full or empty?"
                say: "The juice comes up to the middle of the glass. Is the glass full, half full or empty?"
                options: ["half full", "full", "empty"]
                answer: "half full"
                keep_order: true
                hints:
                  - "Right to the top would be full."
                  - "The middle is halfway."
                  - "Half full."
              - id: l1-f4
                type: true_false
                text: "Is it true? Ben drinks all of his milk. Now his cup is empty."
                say: "Ben drinks all of his milk. Now his cup is empty. Is that true?"
                answer: true
                hints:
                  - "Is anything left in the cup?"
                  - "All of it is gone."
                  - "Yes, the cup is empty."
              - id: l1-f5
                type: multiple_choice
                text: "Two bottles are the same size. One is full and one is half full. Which has more water?"
                say: "Two bottles are the same size. One is full and one is half full. Which bottle has more water in it?"
                options: ["the full bottle", "the half full bottle", "the same"]
                answer: "the full bottle"
                feedback:
                  "the same": "The bottles are the same size, but the full one is filled right to the top. It has more."
                hints:
                  - "Which bottle is filled higher?"
                  - "Full is to the top. Half full is only to the middle."
                  - "The full bottle."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which holds more: a swimming pool or a bath?"
                say: "Which holds more water, a swimming pool or a bath?"
                options: ["a swimming pool", "a bath", "the same"]
                answer: "a swimming pool"
                hints: ["Lots of people can swim in a pool."]
              - id: l1-s2
                type: multiple_choice
                text: "Which holds less: the cup or the jug?"
                say: "Which holds less, the cup or the jug?"
                show: { objects: [cup, jug] }
                options: ["the cup", "the jug", "the same"]
                answer: "the cup"
                hints: ["You can pour a few cups out of one jug."]
              - id: l1-s3
                type: multiple_choice
                text: "The water comes right up to the top of the jug. Is the jug full, half full or empty?"
                say: "The water comes right up to the top of the jug. Is the jug full, half full or empty?"
                options: ["full", "half full", "empty"]
                answer: "full"
                keep_order: true
                hints: ["Right to the top."]
              - id: l1-s4
                type: true_false
                text: "Is it true? An empty bottle has lots of water in it."
                say: "An empty bottle has lots of water in it. Is that true?"
                answer: false
                hints: ["Empty means nothing is in it."]
              - id: l1-s5
                type: multiple_choice
                text: "Two cups are the same size. One is empty and one is half full. Which has more?"
                say: "Two cups are the same size. One is empty and one is half full. Which cup has more in it?"
                options: ["the half full cup", "the empty cup", "the same"]
                answer: "the half full cup"
                hints: ["The empty cup has nothing in it."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which holds more: a teaspoon or a bucket?"
                say: "Which holds more water, a teaspoon or a bucket?"
                options: ["a bucket", "a teaspoon", "the same"]
                answer: "a bucket"
              - id: l1-n2
                type: multiple_choice
                text: "Which holds less: an egg cup or a mug?"
                say: "Which holds less, an egg cup or a mug?"
                options: ["an egg cup", "a mug", "the same"]
                answer: "an egg cup"
              - id: l1-n3
                type: multiple_choice
                text: "Mia's glass is full. She pours away half of the water. Is the glass full, half full or empty now?"
                say: "Mia's glass is full. She pours away half of the water. Is the glass full, half full or empty now?"
                options: ["half full", "full", "empty"]
                answer: "half full"
                keep_order: true
              - id: l1-n4
                type: true_false
                text: "Is it true? Two jugs are the same size and both are full. They hold the same amount."
                say: "Two jugs are the same size and both are full. They hold the same amount. Is that true?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "The rain fills the bucket right to the top. Is the bucket full, half full or empty now?"
                say: "The rain fills the bucket right to the top. Is the bucket full, half full or empty now?"
                options: ["full", "half full", "empty"]
                answer: "full"
                keep_order: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which holds more: a mug or a bath?"
            say: "Which holds more water, a mug or a bath?"
            options: ["a bath", "a mug", "the same"]
            answer: "a bath"
          - id: l1-c2
            type: multiple_choice
            text: "There is no milk in the jug. Is the jug full, half full or empty?"
            say: "There is no milk in the jug. Is the jug full, half full or empty?"
            options: ["empty", "half full", "full"]
            answer: "empty"
          - id: l1-c3
            type: true_false
            text: "Is it true? A spoon holds more than a jug."
            say: "A spoon holds more than a jug. Is that true?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Which holds more: the jug or the spoon?"
            say: "Which holds more water, the jug or the spoon?"
            show: { objects: [jug, spoon] }
            options: ["the jug", "the spoon", "the same"]
            answer: "the jug"
          - id: l1-c5
            type: multiple_choice
            text: "The bath water comes up to the middle. Is the bath full, half full or empty?"
            say: "The bath water comes up to the middle. Is the bath full, half full or empty?"
            options: ["full", "half full", "empty"]
            answer: "half full"
            keep_order: true
          - id: l1-c6
            type: true_false
            text: "Is it true? A cup holds less than a bucket."
            say: "A cup holds less than a bucket. Is that true?"
            answer: true

  - n: 2
    title: { de: "Mit Bechern vergleichen", en: "Comparing with cups" }
    goal:
      de: "Zähl Becher voll Wasser, um zu sehen, wo mehr hineinpasst, auch wenn ein hohes Gefäß größer aussieht."
      en: "Count cups of water to see which holds more, even when a tall one looks bigger."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which holds more: a bucket or a cup?"
            say: "Which holds more, a bucket or a cup?"
            options: ["a bucket", "a cup", "the same"]
            answer: "a bucket"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "The water comes up to the middle of the bottle. Is the bottle full, half full or empty?"
            say: "The water comes up to the middle of the bottle. Is the bottle full, half full or empty?"
            options: ["half full", "full", "empty"]
            answer: "half full"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Jug: 6 cups. Bottle: 4 cups."
            say: "To find out which holds more, we can fill each one with cups of water. The jug takes six cups to fill. The bottle takes four cups. Six is more than four, so the jug holds more."
            show: { object: cup, count: 6, layout: row }
          - text: "Tall is not always more."
            say: "A tall thin vase and a wide bowl. The vase looks bigger because it is tall. But the bowl takes five cups and the vase takes only three. The bowl holds more."
          - text: "bowl, jug, cup"
            say: "We can put containers in order. The bowl holds the most. The cup holds the least. The jug is in between."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The pot takes 7 cups to fill. The pan takes 4 cups. Which holds more?"
                say: "The pot takes seven cups of water to fill. The pan takes four cups. Which holds more?"
                options: ["the pot", "the pan", "the same"]
                answer: "the pot"
                hints:
                  - "Which needs more cups?"
                  - "Seven is more than four."
                  - "The pot."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The red bottle takes 3 cups to fill. The blue bottle takes 8 cups. Which holds less?"
                say: "The red bottle takes three cups to fill. The blue bottle takes eight cups. Which bottle holds less?"
                options: ["the red bottle", "the blue bottle", "the same"]
                answer: "the red bottle"
                feedback:
                  "the blue bottle": "The blue bottle needs more cups to fill it, so it holds more. The red one holds less."
                hints:
                  - "Fewer cups to fill it means it holds less."
                  - "Three is fewer than eight."
                  - "The red bottle."
              - id: l2-f3
                type: multiple_choice
                text: "A tall vase takes 2 cups. A wide bowl takes 6 cups. Which holds more?"
                say: "A tall, thin vase takes two cups of water to fill. A wide bowl takes six cups. Which holds more?"
                options: ["the wide bowl", "the tall vase", "the same"]
                answer: "the wide bowl"
                feedback:
                  "the tall vase": "The vase is taller, but it only takes two cups. The bowl takes six, so the bowl holds more."
                hints:
                  - "Do not look at how tall it is. Look at the cups."
                  - "Two cups or six cups?"
                  - "The wide bowl."
              - id: l2-f4
                type: true_false
                text: "Is it true? The teapot takes 5 cups and the jug takes 5 cups. They hold the same."
                say: "The teapot takes five cups to fill and the jug takes five cups too. They hold the same amount. Is that true?"
                answer: true
                hints:
                  - "Compare the number of cups."
                  - "Five and five."
                  - "Yes, they hold the same."
              - id: l2-f5
                type: ordering
                text: "Bucket: 10 cups. Jug: 6 cups. Mug: 1 cup. Put them in order. Start with the one that holds the most."
                say: "The bucket takes ten cups. The jug takes six cups. The mug takes one cup. Put them in order, starting with the one that holds the most."
                options: ["mug", "bucket", "jug"]
                slot_count: 3
                answer: ["bucket", "jug", "mug"]
                hints:
                  - "The most cups means it holds the most."
                  - "Ten is the most, one is the least."
                  - "bucket, jug, mug."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The watering can takes 9 cups. The bowl takes 5 cups. Which holds more?"
                say: "The watering can takes nine cups to fill. The bowl takes five cups. Which holds more?"
                options: ["the watering can", "the bowl", "the same"]
                answer: "the watering can"
                hints: ["More cups means it holds more."]
              - id: l2-s2
                type: multiple_choice
                text: "The green box takes 6 cups of sand. The yellow box takes 2 cups. Which holds less?"
                say: "The green box takes six cups of sand to fill. The yellow box takes two cups. Which box holds less?"
                options: ["the yellow box", "the green box", "the same"]
                answer: "the yellow box"
                hints: ["Fewer cups means it holds less."]
              - id: l2-s3
                type: true_false
                text: "Is it true? The tall glass takes 2 cups and the short bowl takes 4 cups. The tall glass holds more."
                say: "The tall glass takes two cups and the short bowl takes four cups. The tall glass holds more. Is that true?"
                answer: false
                hints: ["Look at the cups, not at how tall it is."]
              - id: l2-s4
                type: ordering
                text: "Pan: 4 cups. Sink: 9 cups. Mug: 1 cup. Put them in order. Start with the one that holds the least."
                say: "The pan takes four cups. The sink takes nine cups. The mug takes one cup. Put them in order, starting with the one that holds the least."
                options: ["sink", "mug", "pan"]
                slot_count: 3
                answer: ["mug", "pan", "sink"]
                hints: ["The fewest cups means the least."]
              - id: l2-s5
                type: multiple_choice
                text: "Ali's bottle and Zoe's bottle each take 3 cups. Which holds more?"
                say: "Ali's bottle takes three cups to fill. Zoe's bottle takes three cups too. Which holds more?"
                options: ["the same", "Ali's bottle", "Zoe's bottle"]
                answer: "the same"
                hints: ["Compare the cups."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The paddling pool takes 20 buckets. The bath takes 8 buckets. Which holds more?"
                say: "The paddling pool takes twenty buckets of water to fill. The bath takes eight buckets. Which holds more?"
                options: ["the paddling pool", "the bath", "the same"]
                answer: "the paddling pool"
              - id: l2-n2
                type: multiple_choice
                text: "The little pot takes 2 scoops of sand. The bucket takes 9 scoops. Which holds less?"
                say: "The little pot takes two scoops of sand to fill. The bucket takes nine scoops. Which holds less?"
                options: ["the little pot", "the bucket", "the same"]
                answer: "the little pot"
              - id: l2-n3
                type: multiple_choice
                text: "The tall bottle takes 4 cups. The wide pot takes 7 cups. Which holds more?"
                say: "The tall bottle takes four cups to fill. The wide pot takes seven cups. Which holds more?"
                options: ["the wide pot", "the tall bottle", "the same"]
                answer: "the wide pot"
              - id: l2-n4
                type: ordering
                text: "Kettle: 5 cups. Teapot: 3 cups. Bucket: 12 cups. Put them in order. Start with the one that holds the most."
                say: "The kettle takes five cups. The teapot takes three cups. The bucket takes twelve cups. Put them in order, starting with the one that holds the most."
                options: ["teapot", "kettle", "bucket"]
                slot_count: 3
                answer: ["bucket", "kettle", "teapot"]
              - id: l2-n5
                type: true_false
                text: "Is it true? The bowl takes 6 cups and the jug takes 4 cups. The bowl holds less."
                say: "The bowl takes six cups and the jug takes four cups. The bowl holds less. Is that true?"
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: compare
            type: multiple_choice
            text: "Which holds more: an egg cup or a bucket?"
            say: "Which holds more water, an egg cup or a bucket?"
            options: ["a bucket", "an egg cup", "the same"]
            answer: "a bucket"
          - id: l2-c2
            part: fill
            type: multiple_choice
            text: "The squash comes right up to the top of the glass. Is the glass full, half full or empty?"
            say: "The squash comes right up to the top of the glass. Is the glass full, half full or empty?"
            options: ["full", "half full", "empty"]
            answer: "full"
            keep_order: true
          - id: l2-c3
            part: cups
            type: multiple_choice
            text: "The flask takes 5 cups. The pot takes 9 cups. Which holds less?"
            say: "The flask takes five cups to fill. The pot takes nine cups. Which holds less?"
            options: ["the flask", "the pot", "the same"]
            answer: "the flask"
          - id: l2-c4
            part: cups
            type: ordering
            text: "Bath: 30 jugs. Bucket: 4 jugs. Sink: 8 jugs. Put them in order. Start with the one that holds the least."
            say: "The bath takes thirty jugs. The bucket takes four jugs. The sink takes eight jugs. Put them in order, starting with the one that holds the least."
            options: ["bath", "sink", "bucket"]
            slot_count: 3
            answer: ["bucket", "sink", "bath"]
          - id: l2-c5
            part: fill
            type: true_false
            text: "Is it true? Two cups are the same size. One is half full and one is empty. They have the same amount in them."
            say: "Two cups are the same size. One is half full and one is empty. They have the same amount in them. Is that true?"
            answer: false
          - id: l2-c6
            part: compare
            type: multiple_choice
            text: "Which holds more: the kettle or the cup?"
            say: "Which holds more water, the kettle or the cup?"
            show: { objects: [kettle, cup] }
            options: ["the kettle", "the cup", "the same"]
            answer: "the kettle"
          - id: l2-c7
            part: compare
            type: multiple_choice
            text: "Which holds less: the glass or the bucket?"
            say: "Which holds less, the glass or the bucket?"
            show: { objects: [glass, bucket] }
            options: ["the glass", "the bucket", "the same"]
            answer: "the glass"
          - id: l2-c8
            part: compare
            type: true_false
            text: "Is it true? A bath holds less than a cup."
            say: "A bath holds less than a cup. Is that true?"
            answer: false
          - id: l2-c9
            part: compare
            type: true_false
            text: "Is it true? A watering can holds more than a spoon."
            say: "A watering can holds more than a spoon. Is that true?"
            show: { objects: [watering-can, spoon] }
            answer: true
          - id: l2-c10
            part: compare
            type: image_multiple_choice
            text: "Which holds the most water?"
            say: "Tap the one that holds the most water."
            options:
              - { object: cup }
              - { object: bucket }
              - { object: spoon }
            answer: "bucket"
          - id: l2-c11
            part: compare
            type: multiple_choice
            text: "Which holds less: a swimming pool or a bucket?"
            say: "Which holds less water, a swimming pool or a bucket?"
            options: ["a bucket", "a swimming pool", "the same"]
            answer: "a bucket"
          - id: l2-c12
            part: fill
            type: true_false
            text: "Is it true? Sam fills the watering can up to the middle. Now it is full."
            say: "Sam fills the watering can up to the middle. Now it is full. Is that true?"
            show: { object: watering-can }
            answer: false
          - id: l2-c13
            part: fill
            type: true_false
            text: "Is it true? There is no juice left in Leo's glass. His glass is empty."
            say: "There is no juice left in Leo's glass. His glass is empty. Is that true?"
            answer: true
          - id: l2-c14
            part: fill
            type: multiple_choice
            text: "The cat drinks all the water in its bowl. Is the bowl full, half full or empty now?"
            say: "The cat drinks all the water in its bowl. Is the bowl full, half full or empty now?"
            options: ["full", "half full", "empty"]
            answer: "empty"
            keep_order: true
          - id: l2-c15
            part: fill
            type: true_false
            text: "Is it true? Ella's mug is full. She drinks half of it. Now her mug is half full."
            say: "Ella's mug is full. She drinks half of it. Now her mug is half full. Is that true?"
            answer: true
          - id: l2-c16
            part: cups
            type: multiple_choice
            text: "The jug takes 8 cups to fill. The vase takes 3 cups. Which holds more?"
            say: "The jug takes eight cups of water to fill. The vase takes three cups. Which holds more?"
            options: ["the jug", "the vase", "the same"]
            answer: "the jug"
          - id: l2-c17
            part: cups
            type: multiple_choice
            text: "The tall bottle takes 3 cups. The short pan takes 6 cups. Which holds less?"
            say: "The tall bottle takes three cups to fill. The short pan takes six cups. Which holds less?"
            options: ["the tall bottle", "the short pan", "the same"]
            answer: "the tall bottle"
          - id: l2-c18
            part: cups
            type: true_false
            text: "Is it true? The bucket takes 10 cups and the bowl takes 7 cups. The bucket holds more."
            say: "The bucket takes ten cups and the bowl takes seven cups. The bucket holds more. Is that true?"
            answer: true
          - id: l2-c19
            part: cups
            type: ordering
            text: "Watering can: 8 cups. Mug: 1 cup. Teapot: 4 cups. Put them in order. Start with the one that holds the most."
            say: "The watering can takes eight cups. The mug takes one cup. The teapot takes four cups. Put them in order, starting with the one that holds the most."
            options: ["teapot", "mug", "watering can"]
            slot_count: 3
            answer: ["watering can", "teapot", "mug"]
          - id: l2-c20
            part: cups
            type: true_false
            text: "Is it true? A tall vase always holds more than a short bowl."
            say: "A tall vase always holds more than a short bowl. Is that true?"
            answer: false
