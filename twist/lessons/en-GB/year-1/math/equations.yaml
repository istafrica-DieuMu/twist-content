# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.equations
skill: math.add-sub-to-20.equations
curriculum: en-GB
language: en
title:
  de: Gleich, größer, kleiner
  en: Equal to, greater than, less than
summary: >
  Comparing calculations and numbers with <, > and =, and seeing that
  different calculations can have the same total (7 + 5 = 6 + 6), with
  missing numbers such as 7 = _ − 9. Lesson 1 compares a calculation with
  a number; lesson 2 compares two calculations and finds missing numbers,
  and ends with the skill check. The = sign means "is the same as".
metadata:
  year: year-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-bridge-10, math.numbers-to-20.compare-to-20]
  also_practises: [math.add-sub-to-20.fluency-to-20]
  vocabulary: { en: [equals, is the same as, greater than, less than, missing number] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: with-number, what: { de: "eine Aufgabe mit einer Zahl vergleichen (<, >, =)", en: "comparing a calculation with a number (<, >, =)" } }
    - { id: two-sides, what: { de: zwei Aufgaben miteinander vergleichen, en: comparing two calculations } }
    - { id: missing, what: { de: fehlende Zahlen und Aufgaben mit demselben Ergebnis finden, en: finding missing numbers and calculations with the same total } }
  misconceptions:
    - id: equals-means-answer
      what: Reads = as "the answer comes next", so fills 9 + 5 = _ + 6 with 14
      addressed: Learn says = means both sides are the same and works one missing number on the right; lesson 2 has a calculation on both sides in every stage, the left side's total is an option in each missing-number task, with feedback in the full stage
    - id: compare-first-number
      what: Compares only the first numbers (calls 8 + 1 greater than 7 + 5 because 8 > 7)
      addressed: lesson 2 Learn says to work out both sides; tasks where the first numbers mislead appear in every stage of lesson 2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Aufgabe und Zahl vergleichen, en: Comparing with a number }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between fifteen and twelve?"
            frame: "15 _ 12"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "8 + 4 = _"
            say: "Eight add four."
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "7 + 5 _ 10"
            say: "Is seven add five greater than, less than or equal to ten? Work out seven add five first. Seven add five is twelve."
          - text: "7 + 5 > 10"
            say: "Twelve is greater than ten, so we use the greater than sign: seven add five is greater than ten."
          - text: "6 + 4 = 10"
            say: "Six add four is ten. Both sides are the same. The equals sign means both sides are the same amount."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between nine add three and eleven?"
                frame: "9 + 3 _ 11"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Work out nine add three first."
                  - "Nine add three is twelve. Compare twelve and eleven."
                  - "12 > 11."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between fifteen take away six and nine?"
                frame: "15 − 6 _ 9"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints:
                  - "Work out fifteen take away six."
                  - "It is nine."
                  - "Nine and nine: =."
              - id: l1-f3
                type: true_false
                text: "Is it true? 8 + 6 < 13"
                say: "Eight add six is less than thirteen. Is that true?"
                answer: false
                hints:
                  - "Work out eight add six."
                  - "It is fourteen. Is fourteen less than thirteen?"
                  - "No."
              - id: l1-f4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between twelve take away five and eight?"
                frame: "12 − 5 _ 8"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Work out twelve take away five."
                  - "Seven. Compare seven and eight."
                  - "7 < 8."
              - id: l1-f5
                type: fill_in_blank
                text: "Find the missing number."
                say: "Seven equals what take away nine?"
                frame: "7 = _ − 9"
                options: ["16", "2", "9"]
                answer: ["16"]
                hints:
                  - "Which number take away nine leaves seven?"
                  - "Seven add nine."
                  - "16."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between seven add seven and fourteen?"
                frame: "7 + 7 _ 14"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Work out seven add seven first."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between sixteen take away nine and nine?"
                frame: "16 − 9 _ 9"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["What is sixteen take away nine?"]
              - id: l1-s3
                type: true_false
                text: "Is it true? 5 + 8 > 12"
                say: "Five add eight is greater than twelve. Is that true?"
                answer: true
                hints: ["Work out five add eight."]
              - id: l1-s4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between eleven take away two and eight?"
                frame: "11 − 2 _ 8"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["What is eleven take away two?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Find the missing number."
                say: "Six equals what take away eight?"
                frame: "6 = _ − 8"
                options: ["14", "2", "8"]
                answer: ["14"]
                hints: ["Which number take away eight leaves six?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between eight add eight and fifteen?"
                frame: "8 + 8 _ 15"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between thirteen take away seven and six?"
                frame: "13 − 7 _ 6"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Is it true? 9 + 9 < 17"
                say: "Nine add nine is less than seventeen. Is that true?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between fourteen take away eight and seven?"
                frame: "14 − 8 _ 7"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n5
                type: fill_in_blank
                text: "Find the missing number."
                say: "Nine equals what take away four?"
                frame: "9 = _ − 4"
                options: ["13", "5", "4"]
                answer: ["13"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between six add five and twelve?"
            frame: "6 + 5 _ 12"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Is it true? 17 − 8 = 9"
            say: "Seventeen take away eight equals nine. Is that true?"
            answer: true
          - id: l1-c3
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between ten add six and sixteen?"
            frame: "10 + 6 _ 16"
            options: ["<", ">", "="]
            answer: ["="]
            option_audio: false
          - id: l1-c4
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between nine add six and fourteen?"
            frame: "9 + 6 _ 14"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? 13 − 4 > 10"
            say: "Thirteen take away four is greater than ten. Is that true?"
            answer: false
          - id: l1-c6
            type: fill_in_blank
            text: "Find the missing number."
            say: "Four equals what take away seven?"
            frame: "4 = _ − 7"
            options: ["11", "3", "7"]
            answer: ["11"]

  - n: 2
    title: { de: Zwei Aufgaben vergleichen, en: Comparing both sides }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between nine add four and twelve?"
            frame: "9 + 4 _ 12"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "6 + 6 = _"
            say: "Six add six."
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 + 5 = 6 + 6"
            say: "Seven add five is twelve. Six add six is twelve too. So seven add five equals six add six: both sides are the same."
          - text: "8 + 1 < 7 + 5"
            say: "To compare the two sides, work out both sides. Eight add one is nine, seven add five is twelve. Nine is less than twelve. The first numbers alone do not tell you."
          - text: "9 + 4 = _ + 3"
            say: "Nine add four is thirteen. The other side must make thirteen too: ten add three. The missing number is ten, not thirteen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between eight add three and six add four?"
                frame: "8 + 3 _ 6 + 4"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Work out both sides."
                  - "Eleven and ten."
                  - "11 > 10."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Find the missing number."
                say: "Nine add five equals what add six?"
                frame: "9 + 5 = _ + 6"
                options: ["8", "14", "9"]
                answer: ["8"]
                feedback:
                  "14": "Fourteen is the total of nine add five. The other side must make fourteen too: what add six is fourteen?"
                  "9": "Nine add six is fifteen, not fourteen."
                hints:
                  - "Work out the left side first."
                  - "The left side is fourteen. What add six makes fourteen?"
                  - "8."
              - id: l2-f3
                type: true_false
                text: "Is it true? 9 + 2 < 5 + 5"
                say: "Nine add two is less than five add five. Is that true?"
                answer: false
                hints:
                  - "Work out both sides."
                  - "Nine add two is eleven. Five add five is ten."
                  - "No, eleven is greater than ten."
              - id: l2-f4
                type: multiple_choice
                text: "Which has the same total as 8 + 6?"
                say: "Which one has the same total as eight add six?"
                options: ["7 + 7", "8 + 7", "6 + 6"]
                answer: "7 + 7"
                hints:
                  - "Work out eight add six first."
                  - "Eight add six is fourteen. Which one makes fourteen too?"
                  - "7 + 7."
              - id: l2-f5
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between nine add one and four add seven?"
                frame: "9 + 1 _ 4 + 7"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Nine is more than four, but work out both sides."
                  - "Ten and eleven."
                  - "10 < 11."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between nine add three and eight add four?"
                frame: "9 + 3 _ 8 + 4"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Work out both sides."]
              - id: l2-s2
                type: fill_in_blank
                text: "Find the missing number."
                say: "Six add eight equals what add four?"
                frame: "6 + 8 = _ + 4"
                options: ["10", "14", "4"]
                answer: ["10"]
                hints: ["The other side must make the same total."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 7 + 6 = 9 + 4"
                say: "Seven add six equals nine add four. Is that true?"
                answer: true
                hints: ["Work out both sides."]
              - id: l2-s4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between eight add two and three add nine?"
                frame: "8 + 2 _ 3 + 9"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Do not just compare the first numbers."]
              - id: l2-s5
                type: multiple_choice
                text: "Which has the same total as 9 + 7?"
                say: "Which one has the same total as nine add seven?"
                options: ["8 + 8", "9 + 6", "7 + 7"]
                answer: "8 + 8"
                hints: ["What is nine add seven?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between five add nine and seven add six?"
                frame: "5 + 9 _ 7 + 6"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Find the missing number."
                say: "Nine add six equals ten add what?"
                frame: "9 + 6 = 10 + _"
                options: ["5", "15", "6"]
                answer: ["5"]
              - id: l2-n3
                type: true_false
                text: "Is it true? 8 + 5 = 6 + 6"
                say: "Eight add five equals six add six. Is that true?"
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "Which sign?"
                say: "Which sign goes between nine add two and four add eight?"
                frame: "9 + 2 _ 4 + 8"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n5
                type: multiple_choice
                text: "Which has the same total as 6 + 5?"
                say: "Which one has the same total as six add five?"
                options: ["7 + 4", "6 + 6", "5 + 5"]
                answer: "7 + 4"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: with-number
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between eight add seven and sixteen?"
            frame: "8 + 7 _ 16"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c2
            part: missing
            type: fill_in_blank
            text: "Find the missing number."
            say: "Eight add four equals what add five?"
            frame: "8 + 4 = _ + 5"
            options: ["7", "12", "5"]
            answer: ["7"]
          - id: l2-c3
            part: missing
            type: fill_in_blank
            text: "Find the missing number."
            say: "Eight equals what take away five?"
            frame: "8 = _ − 5"
            options: ["13", "3", "5"]
            answer: ["13"]
          - id: l2-c4
            part: two-sides
            type: true_false
            text: "Is it true? 5 + 7 = 4 + 8"
            say: "Five add seven equals four add eight. Is that true?"
            answer: true
          - id: l2-c5
            part: missing
            type: multiple_choice
            text: "Which has the same total as 9 + 8?"
            say: "Which one has the same total as nine add eight?"
            options: ["10 + 7", "9 + 9", "8 + 8"]
            answer: "10 + 7"
          - id: l2-c6
            part: with-number
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between six add seven and twelve?"
            frame: "6 + 7 _ 12"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c7
            part: with-number
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between eighteen take away nine and nine?"
            frame: "18 − 9 _ 9"
            options: ["<", ">", "="]
            answer: ["="]
            option_audio: false
          - id: l2-c8
            part: with-number
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between fourteen take away six and nine?"
            frame: "14 − 6 _ 9"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c9
            part: with-number
            type: true_false
            text: "Is it true? 11 > 5 + 7"
            say: "Eleven is greater than five add seven. Is that true?"
            answer: false
          - id: l2-c10
            part: with-number
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between fifteen and eight add eight?"
            frame: "15 _ 8 + 8"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c11
            part: with-number
            type: true_false
            text: "Is it true? 16 − 7 < 10"
            say: "Sixteen take away seven is less than ten. Is that true?"
            answer: true
          - id: l2-c12
            part: two-sides
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between seven add four and five add five?"
            frame: "7 + 4 _ 5 + 5"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c13
            part: two-sides
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between six add two and three add seven?"
            frame: "6 + 2 _ 3 + 7"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c14
            part: two-sides
            type: fill_in_blank
            text: "Which sign?"
            say: "Which sign goes between nine add five and eight add six?"
            frame: "9 + 5 _ 8 + 6"
            options: ["<", ">", "="]
            answer: ["="]
            option_audio: false
          - id: l2-c15
            part: two-sides
            type: true_false
            text: "Is it true? 9 + 1 > 3 + 8"
            say: "Nine add one is greater than three add eight. Is that true?"
            answer: false
          - id: l2-c16
            part: two-sides
            type: true_false
            text: "Is it true? 12 − 4 = 5 + 3"
            say: "Twelve take away four equals five add three. Is that true?"
            answer: true
          - id: l2-c17
            part: missing
            type: fill_in_blank
            text: "Find the missing number."
            say: "Seven add six equals what add four?"
            frame: "7 + 6 = _ + 4"
            options: ["9", "13", "4"]
            answer: ["9"]
          - id: l2-c18
            part: missing
            type: fill_in_blank
            text: "Find the missing number."
            say: "Five equals what take away seven?"
            frame: "5 = _ − 7"
            options: ["12", "2", "7"]
            answer: ["12"]
          - id: l2-c19
            part: missing
            type: multiple_choice
            text: "Which has the same total as 7 + 8?"
            say: "Which one has the same total as seven add eight?"
            options: ["9 + 6", "7 + 9", "8 + 8"]
            answer: "9 + 6"
          - id: l2-c20
            part: missing
            type: text_input
            text: "8 + 5 = 10 + _"
            say: "Eight add five equals ten add what?"
            answer: "3"
