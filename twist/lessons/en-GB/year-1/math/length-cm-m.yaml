# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.length-cm-m
skill: math.length.cm-m
curriculum: en-GB
language: en
title:
  de: Zentimeter und Meter
  en: Centimetres and metres
summary: >
  Lesson 1 measures strips with a ruler in centimetres, first from 0 and
  then from a strip that starts further along (from 2 to 9 is 7 cm);
  lesson 2 learns that 1 m = 100 cm, picks centimetres or metres for a
  thing, compares lengths in cm, and ends with the skill check. Drawing a
  line of a given length waits for a drawing task, so the drawing part of
  the skill is covered only by choosing where a line should end.
metadata:
  year: year-1
  topic: { de: Längen, en: Length }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.length.non-standard, math.numbers-to-100.number-line]
  also_practises: [math.length.non-standard]
  vocabulary: { en: [ruler, centimetre, cm, metre, m, measure, length, start at zero] }
  forms: [drawn, text, audio]
  drawn: [ruler, number-line]
  facets: [units]
  parts:
    - { id: measure, what: { de: Längen am Lineal ab 0 in cm ablesen, en: measuring in cm with a ruler from 0 } }
    - { id: off-zero, what: { de: "messen, wenn der Streifen nicht bei 0 anfängt", en: measuring a strip that does not start at 0 } }
    - { id: metres, what: { de: Meter und Zentimeter vergleichen und umrechnen, en: comparing and changing metres and centimetres } }
    - { id: unit, what: { de: cm oder m passend wählen, en: choosing cm or m for a length } }
  misconceptions:
    - id: reads-end-not-length
      what: Reads the number at the end of the strip when it does not start at 0 (a strip from 2 to 9 read as 9 cm)
      addressed: lesson 1 Learn measures a strip from 2 to 9; l1-f4 (with feedback), l1-s4, l1-n4 and l2-c2 have a strip off zero and offer the end number
    - id: starts-at-one
      what: Lines the strip up with the 1, not the 0, or counts the ticks instead of the spaces
      addressed: lesson 1 Learn says to start at the 0; l1-f3 (with feedback), l1-s3 and l1-n3 ask where to start or offer one too many
    - id: metre-is-ten
      what: Thinks 1 m is 10 cm, or picks cm for something as long as a room
      addressed: lesson 2 Learn says 1 m = 100 cm, about one big stride; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c4 ask how many cm make a metre, and l2-f3, l2-s3 and l2-n3 pick cm or m
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit dem Lineal messen", en: "Measuring with a ruler" }
    goal:
      de: "Miss mit dem Lineal und fang bei null an, so wie ein Streifen von 0 bis 6 ist 6 Zentimeter lang."
      en: "Measure with a ruler, starting at zero, like a strip from 0 to 6 is 6 centimetres long."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Is it true? Ava's step and Dad's step are the same size."
            say: "Ava's step and Dad's step are the same size. Is that true?"
            answer: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which number does the arrow point to?"
            say: "Which number does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 20, labels: tens, mark: 14 }
            options: ["14", "16", "4"]
            answer: "14"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "How wide is 1 centimetre?"
            say: "A ruler measures in centimetres. How wide do you think one centimetre is? As wide as your finger, or as wide as your whole hand? Have a guess."
            show: { drawn: ruler, to: 10, length: 1, colour: blue }
          - text: "1 cm"
            say: "Here it is. We write cm. Each space from one number to the next is one centimetre. A centimetre is about as wide as your little finger."
            show: { drawn: ruler, to: 10, length: 1, colour: blue }
          - text: "Start at 0. This strip is 6 cm."
            say: "Put the start of the strip on the zero, not on the one. Then read the number at the other end. This strip goes from zero to six, so it is six centimetres long."
            show: { drawn: ruler, to: 10, length: 6, colour: red }
          - text: "From 2 to 9 is 7 cm."
            say: "This strip does not start at zero. It starts at two and ends at nine. Count the centimetres in between: three, four, five, six, seven, eight, nine. That is seven centimetres, not nine."
            show: { drawn: ruler, to: 10, length: 7, start: 2, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How long is the strip?"
                say: "The strip starts at zero. How long is it?"
                show: { drawn: ruler, to: 10, length: 4, colour: blue }
                options: ["4 cm", "5 cm", "3 cm"]
                answer: "4 cm"
                hints:
                  - "The strip starts at 0."
                  - "Read the number at the other end of the strip."
                  - "4 cm."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "How long is the strip in cm?"
                say: "The strip starts at zero. How many centimetres long is it?"
                show: { drawn: ruler, to: 15, length: 11, colour: red }
                answer: "11"
                hints:
                  - "Start at 0."
                  - "Where does the strip end?"
                  - "11 cm."
              - id: l1-f3
                type: multiple_choice
                text: "Rob is measuring his pencil. Which number on the ruler should the end of the pencil line up with?"
                say: "Rob is measuring his pencil with a ruler. Which number should the end of the pencil line up with?"
                options: ["0", "1", "any number"]
                answer: "0"
                keep_order: true
                feedback:
                  "1": "If you start at 1, you miss the first centimetre. Start at 0."
                hints:
                  - "The first centimetre is between 0 and 1."
                  - "Start before the first centimetre."
                  - "0."
              - id: l1-f4
                type: multiple_choice
                text: "How long is the strip?"
                say: "This strip does not start at zero. How long is it?"
                show: { drawn: ruler, to: 10, length: 5, start: 3, colour: green }
                options: ["5 cm", "8 cm", "3 cm"]
                answer: "5 cm"
                feedback:
                  "8 cm": "8 is where the strip ends. It starts at 3, so count from 3 to 8: five centimetres."
                hints:
                  - "Where does the strip start, and where does it end?"
                  - "It goes from 3 to 8. Count the spaces in between."
                  - "5 cm."
              - id: l1-f5
                type: true_false
                text: "Is it true? Ava's worm is 9 cm long. Ben's worm is 7 cm long. Ava's worm is longer."
                say: "Ava's worm is nine centimetres long. Ben's worm is seven centimetres long. Ava's worm is longer. Is that true?"
                show: { object: worm, count: 2, layout: row }
                answer: true
                hints:
                  - "They are both in centimetres."
                  - "Nine is more than seven."
                  - "Yes, Ava's worm is longer."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How long is the strip?"
                say: "How long is the strip?"
                show: { drawn: ruler, to: 10, length: 8, colour: blue }
                options: ["8 cm", "9 cm", "10 cm"]
                answer: "8 cm"
                hints: ["Read the number at the end of the strip."]
              - id: l1-s2
                type: text_input
                text: "How long is the strip in cm?"
                say: "How many centimetres long is the strip?"
                show: { drawn: ruler, to: 15, length: 13, colour: red }
                answer: "13"
                hints: ["It starts at 0."]
              - id: l1-s3
                type: true_false
                text: "Jade puts the end of her ribbon on the 1 to measure it. Is that right?"
                say: "Jade puts the end of her ribbon on the one to measure it. Is that right?"
                answer: false
                hints: ["Where does the first centimetre start?"]
              - id: l1-s4
                type: multiple_choice
                text: "How long is the strip?"
                say: "This strip does not start at zero. How long is it?"
                show: { drawn: ruler, to: 10, length: 6, start: 4, colour: green }
                options: ["6 cm", "10 cm", "4 cm"]
                answer: "6 cm"
                hints: ["Count from where it starts to where it ends."]
              - id: l1-s5
                type: multiple_choice
                text: "Which is shorter: 12 cm or 8 cm?"
                say: "Which is shorter, twelve centimetres or eight centimetres?"
                options: ["8 cm", "12 cm", "the same"]
                answer: "8 cm"
                hints: ["Which number is smaller?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "How long is the strip in cm?"
                say: "How many centimetres long is the strip?"
                show: { drawn: ruler, to: 10, length: 3, colour: blue }
                answer: "3"
              - id: l1-n2
                type: multiple_choice
                text: "How long is the strip?"
                say: "How long is the strip?"
                show: { drawn: ruler, to: 15, length: 14, colour: red }
                options: ["14 cm", "15 cm", "13 cm"]
                answer: "14 cm"
              - id: l1-n3
                type: multiple_choice
                text: "A line starts at 0 and should be 5 cm long. Where should it end?"
                say: "Leah draws a line. It starts at zero on the ruler and should be five centimetres long. Which number should it end on?"
                options: ["5", "6", "4"]
                answer: "5"
              - id: l1-n4
                type: text_input
                text: "How long is the strip in cm?"
                say: "This strip does not start at zero. How many centimetres long is it?"
                show: { drawn: ruler, to: 10, length: 4, start: 5, colour: green }
                answer: "4"
              - id: l1-n5
                type: ordering
                text: "Put the lengths in order. Start with the shortest."
                say: "Put the lengths in order. Start with the shortest."
                options: ["10 cm", "3 cm", "7 cm"]
                slot_count: 3
                answer: ["3 cm", "7 cm", "10 cm"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How long is the strip?"
            say: "How long is the strip?"
            show: { drawn: ruler, to: 10, length: 9, colour: blue }
            options: ["9 cm", "10 cm", "8 cm"]
            answer: "9 cm"
          - id: l1-c2
            type: multiple_choice
            text: "How long is the strip?"
            say: "This strip does not start at zero. How long is it?"
            show: { drawn: ruler, to: 10, length: 3, start: 6, colour: red }
            options: ["3 cm", "9 cm", "6 cm"]
            answer: "3 cm"
          - id: l1-c3
            type: true_false
            text: "Is it true? To measure, start at 0 on the ruler."
            say: "To measure, you start at zero on the ruler. Is that true?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "How long is the strip?"
            say: "How long is the strip?"
            show: { drawn: ruler, to: 15, length: 10, colour: green }
            options: ["10 cm", "11 cm", "9 cm"]
            answer: "10 cm"
          - id: l1-c5
            type: multiple_choice
            text: "How long is the strip?"
            say: "This strip does not start at zero. How long is it?"
            show: { drawn: ruler, to: 10, length: 2, start: 7, colour: blue }
            options: ["2 cm", "9 cm", "7 cm"]
            answer: "2 cm"
          - id: l1-c6
            type: true_false
            text: "Is it true? On a ruler, each space from one number to the next is 1 cm."
            say: "On a ruler, each space from one number to the next is one centimetre. Is that true?"
            answer: true

  - n: 2
    title: { de: "Meter und Zentimeter", en: "Metres and centimetres" }
    goal:
      de: "Lerne, dass 1 Meter 100 Zentimeter sind, und miss lange Dinge wie einen Spielplatz in Metern."
      en: "Learn that 1 metre is 100 centimetres, and measure long things like a playground in metres."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How long is the strip?"
            say: "How long is the strip?"
            show: { drawn: ruler, to: 10, length: 7, colour: blue }
            options: ["7 cm", "8 cm", "6 cm"]
            answer: "7 cm"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "You measure a ribbon. Which number on the ruler should the end of the ribbon line up with?"
            say: "You are measuring a ribbon. Which number on the ruler should the end of the ribbon line up with?"
            options: ["0", "1", "10"]
            answer: "0"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "How many centimetres make 1 metre?"
            say: "Long things are measured in metres. How many centimetres do you think make one metre? Have a guess."
          - text: "1 m = 100 cm"
            say: "One hundred! Long things are measured in metres. We write m. One metre is the same as one hundred centimetres. A metre stick is about as long as one big stride."
          - text: "pencil: cm. classroom: m."
            say: "We measure short things, like a pencil or a book, in centimetres. We measure long things, like a classroom or a playground, in metres."
          - text: "A door is about 2 m tall."
            say: "A door is about two metres tall. That is two hundred centimetres. A child your age is a bit more than one metre tall."
            show: { object: door }
          - text: "Did you know? When you were born, you were about 50 cm long."
            say: "Did you know? Most babies are about fifty centimetres long when they are born. That was you once! Now you are more than twice as long."
            show: { object: baby }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which do we measure in metres: the park, a crayon or a rubber?"
                say: "Which of these do we measure in metres? Tap it."
                options:
                  - { object: park }
                  - { object: crayon }
                  - { object: rubber }
                answer: "park"
                hints:
                  - "Metres are for long things."
                  - "Which one is too long for a ruler?"
                  - "The park."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "1 m = _ cm"
                say: "One metre is how many centimetres?"
                options: ["100", "10", "1"]
                answer: "100"
                feedback:
                  "10": "Ten centimetres is only as long as a finger. One metre is one hundred centimetres."
                hints:
                  - "A metre is a big stride. A centimetre is tiny."
                  - "It takes a lot of centimetres to make a metre."
                  - "100."
              - id: l2-f3
                type: multiple_choice
                text: "Is a book about 20 cm or about 20 m long?"
                say: "Is a book about twenty centimetres long or about twenty metres long?"
                show: { object: book }
                options: ["about 20 cm", "about 20 m"]
                answer: "about 20 cm"
                hints:
                  - "Twenty metres is longer than a classroom."
                  - "A book fits on your desk."
                  - "About 20 cm."
              - id: l2-f4
                type: multiple_choice
                text: "Which is longer: 1 m or 60 cm?"
                say: "Which is longer, one metre or sixty centimetres?"
                options: ["1 m", "60 cm", "the same"]
                answer: "1 m"
                hints:
                  - "Change 1 m into centimetres."
                  - "1 m is 100 cm. Compare 100 with 60."
                  - "1 m."
              - id: l2-f5
                type: true_false
                text: "Is it true? 2 m = 200 cm"
                say: "Two metres is two hundred centimetres. Is that true?"
                answer: true
                hints:
                  - "1 m is 100 cm."
                  - "Two metres is 100 cm and 100 cm."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which do we measure in centimetres?"
                say: "Which of these do we measure in centimetres?"
                options: ["a pencil", "a football pitch", "a road"]
                answer: "a pencil"
                hints: ["Centimetres are for short things."]
              - id: l2-s2
                type: true_false
                text: "Is it true? 1 m = 10 cm"
                say: "One metre is ten centimetres. Is that true?"
                answer: false
                hints: ["How many centimetres make one metre?"]
              - id: l2-s3
                type: multiple_choice
                text: "Is a bus about 10 cm or about 10 m long?"
                say: "Is a bus about ten centimetres long or about ten metres long?"
                show: { object: bus }
                options: ["about 10 m", "about 10 cm"]
                answer: "about 10 m"
                feedback:
                  "about 10 cm": "A bus 10 cm long? That is a toy bus! A real bus is about 10 m long."
                hints: ["Ten centimetres is shorter than your hand span."]
              - id: l2-s4
                type: multiple_choice
                text: "Which is shorter: 1 m or 90 cm?"
                say: "Which is shorter, one metre or ninety centimetres?"
                options: ["90 cm", "1 m", "the same"]
                answer: "90 cm"
                hints: ["1 m is 100 cm."]
              - id: l2-s5
                type: text_input
                text: "Kim's ribbon is 100 cm long. How many metres is that?"
                say: "Kim's ribbon is one hundred centimetres long. How many metres is that? Type the number."
                answer: "1"
                hints: ["100 cm make one metre."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which do we measure in metres?"
                say: "Which of these do we measure in metres?"
                options: ["the school hall", "a spoon", "a sock"]
                answer: "the school hall"
              - id: l2-n2
                type: text_input
                text: "1 m = _ cm"
                say: "One metre is how many centimetres? Write the number."
                answer: "100"
              - id: l2-n3
                type: multiple_choice
                text: "Is a ruler about 30 cm or about 30 m long?"
                say: "Is a ruler about thirty centimetres long or about thirty metres long?"
                options: ["about 30 cm", "about 30 m"]
                answer: "about 30 cm"
              - id: l2-n4
                type: multiple_choice
                text: "Which is longer: 1 m or 99 cm?"
                say: "Which is longer, one metre or ninety-nine centimetres?"
                options: ["1 m", "99 cm", "the same"]
                answer: "1 m"
              - id: l2-n5
                type: ordering
                text: "Put the lengths in order. Start with the shortest."
                say: "Put the lengths in order. Start with the shortest."
                options: ["1 m", "40 cm", "8 cm"]
                slot_count: 3
                answer: ["8 cm", "40 cm", "1 m"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: measure
            type: text_input
            text: "How long is the strip in cm?"
            say: "How many centimetres long is the strip?"
            show: { drawn: ruler, to: 15, length: 12, colour: green }
            answer: "12"
          - id: l2-c2
            part: off-zero
            type: multiple_choice
            text: "How long is the strip?"
            say: "This strip does not start at zero. How long is it?"
            show: { drawn: ruler, to: 10, length: 6, start: 2, colour: blue }
            options: ["6 cm", "8 cm", "2 cm"]
            answer: "6 cm"
          - id: l2-c3
            part: unit
            type: multiple_choice
            text: "Which do we measure in centimetres?"
            say: "Which of these do we measure in centimetres?"
            options: ["a shoe", "a swimming pool", "a train"]
            answer: "a shoe"
          - id: l2-c4
            part: metres
            type: multiple_choice
            text: "How many cm are in 1 m?"
            say: "How many centimetres are there in one metre?"
            options: ["100", "10", "50"]
            answer: "100"
          - id: l2-c5
            part: metres
            type: multiple_choice
            text: "Which is shorter: 1 m or 50 cm?"
            say: "Which is shorter, one metre or fifty centimetres?"
            options: ["50 cm", "1 m", "the same"]
            answer: "50 cm"
          - id: l2-c6
            part: measure
            type: multiple_choice
            text: "How long is the strip?"
            say: "The strip starts at zero. How long is it?"
            show: { drawn: ruler, to: 10, length: 5, colour: red }
            options: ["5 cm", "6 cm", "4 cm"]
            answer: "5 cm"
          - id: l2-c7
            part: measure
            type: text_input
            text: "How long is the strip in cm?"
            say: "How many centimetres long is the strip?"
            show: { drawn: ruler, to: 15, length: 15, colour: blue }
            answer: "15"
          - id: l2-c8
            part: measure
            type: true_false
            text: "Is it true? This strip is 2 cm long."
            say: "The strip starts at zero. Is it two centimetres long?"
            show: { drawn: ruler, to: 10, length: 2, colour: green }
            answer: true
          - id: l2-c9
            part: measure
            type: multiple_choice
            text: "A line starts at 0 and should be 8 cm long. Where should it end?"
            say: "Omar draws a line. It starts at zero on the ruler and should be eight centimetres long. Which number should it end on?"
            options: ["8", "9", "7"]
            answer: "8"
          - id: l2-c10
            part: off-zero
            type: multiple_choice
            text: "How long is the strip?"
            say: "This strip does not start at zero. How long is it?"
            show: { drawn: ruler, to: 10, length: 4, start: 1, colour: red }
            options: ["4 cm", "5 cm", "1 cm"]
            answer: "4 cm"
          - id: l2-c11
            part: off-zero
            type: text_input
            text: "How long is the strip in cm?"
            say: "This strip does not start at zero. How many centimetres long is it?"
            show: { drawn: ruler, to: 15, length: 8, start: 3, colour: blue }
            answer: "8"
          - id: l2-c12
            part: off-zero
            type: true_false
            text: "Is it true? This strip is 9 cm long."
            say: "This strip does not start at zero. Is it nine centimetres long?"
            show: { drawn: ruler, to: 10, length: 5, start: 4, colour: green }
            answer: false
          - id: l2-c13
            part: off-zero
            type: multiple_choice
            text: "How long is the strip?"
            say: "This strip does not start at zero. How long is it?"
            show: { drawn: ruler, to: 15, length: 7, start: 5, colour: red }
            options: ["7 cm", "12 cm", "5 cm"]
            answer: "7 cm"
          - id: l2-c14
            part: metres
            type: true_false
            text: "Is it true? 1 m is longer than 80 cm."
            say: "One metre is longer than eighty centimetres. Is that true?"
            answer: true
          - id: l2-c15
            part: metres
            type: multiple_choice
            text: "Ali's rope is 1 m long. Ben's rope is 100 cm long. Whose rope is longer?"
            say: "Ali's rope is one metre long. Ben's rope is one hundred centimetres long. Whose rope is longer?"
            options: ["Ali's rope", "Ben's rope", "They are the same."]
            answer: "They are the same."
          - id: l2-c16
            part: unit
            type: multiple_choice
            text: "Which do we measure in metres?"
            say: "Which of these do we measure in metres?"
            options: ["the park", "a leaf", "a toothbrush"]
            answer: "the park"
          - id: l2-c17
            part: unit
            type: multiple_choice
            text: "Is a spoon about 15 cm or about 15 m long?"
            say: "Is a spoon about fifteen centimetres long or about fifteen metres long?"
            options: ["about 15 cm", "about 15 m"]
            answer: "about 15 cm"
          - id: l2-c18
            part: unit
            type: multiple_choice
            text: "Is a swimming pool about 25 cm or about 25 m long?"
            say: "Is a swimming pool about twenty-five centimetres long or about twenty-five metres long?"
            options: ["about 25 m", "about 25 cm"]
            answer: "about 25 m"
          - id: l2-c19
            part: unit
            type: true_false
            text: "Is it true? A pencil is about 15 m long."
            say: "A pencil is about fifteen metres long. Is that true?"
            answer: false
          - id: l2-c20
            part: metres
            type: ordering
            text: "Put the lengths in order. Start with the longest."
            say: "Put the lengths in order. Start with the longest."
            options: ["70 cm", "1 m", "20 cm"]
            slot_count: 3
            answer: ["1 m", "70 cm", "20 cm"]
