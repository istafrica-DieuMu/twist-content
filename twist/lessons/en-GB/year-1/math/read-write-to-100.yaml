# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.read-write-to-100
skill: math.numbers-to-100.read-write
curriculum: en-GB
language: en
title:
  de: Zahlen bis 100 lesen und schreiben
  en: Reading and writing numbers to 100
summary: >
  Lesson 1 reads and writes two-digit numbers in numerals: the tens digit
  first, then the ones, from tens rods and ones cubes and from hearing
  the number, and tells thirteen from thirty; lesson 2 reads and writes
  the number words (forty-three, with a hyphen), matches words and
  numerals, and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.tens]
  also_practises: [math.numbers-to-100.tens]
  vocabulary: { en: [tens, ones, digit, numeral, number word, twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety, one hundred] }
  forms: [drawn, text, audio]
  drawn: [base-ten, place-value-chart]
  facets: []
  parts:
    - { id: tens-ones, what: { de: eine Zahl aus Zehnern und Einern ablesen, en: reading a number from its tens and ones } }
    - { id: hear, what: { de: eine gehörte Zahl mit Ziffern schreiben oder finden, en: writing or finding a number you hear } }
    - { id: read-word, what: { de: ein Zahlwort lesen, en: reading a number word } }
    - { id: write-word, what: { de: zu einer Zahl das Zahlwort finden, en: finding the number word for a number } }
  misconceptions:
    - id: teen-ty
      what: Hears or reads thirteen as thirty, fourteen as forty (and the other way round)
      addressed: lesson 1 Learn sets thirteen against thirty; l1-f4 (with feedback), l1-s4, l1-n4 and l2-c2 ask for a -teen or -ty number with the other as an option
    - id: write-as-said
      what: Writes the number the way it is said, tens then ones in full (forty-three as 403)
      addressed: lesson 1 Learn says forty-three is 4 tens and 3 ones, so two digits; l1-f5 (with feedback), l1-s5, l2-f1 and l2-f2 offer the three-digit number (308, 901, 206, 701)
    - id: digits-swapped
      what: Swaps the tens and the ones digit (writes 34 for forty-three)
      addressed: lesson 1 Learn puts the tens digit first in the place-value chart; l1-f2 (with feedback), l1-s2, l2-f2 and l2-c1 offer the swapped number
    - id: forty-spelling
      what: Spells forty as fourty
      addressed: lesson 2 Learn points out that forty has no u; l2-f4 (with feedback) and l2-n3 set forty against fourty
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zehner und Einer", en: "Tens and ones" }
    goal:
      de: "Lies und schreib Zahlen mit den Zehnern zuerst, dann den Einern, so wie 43 sind 4 Zehner und 3 Einer."
      en: "Read and write numbers with tens first, then ones, like 43 is 4 tens and 3 ones."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many?"
            say: "Count the tens rods in tens. How many cubes are there?"
            show: { drawn: base-ten, tens: 4, ones: 0 }
            options: ["40", "4", "14"]
            answer: "40"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What comes after 60 when you count in tens?"
            say: "Count in tens. What comes after sixty?"
            options: ["70", "61", "50"]
            answer: "70"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "How many digits?"
            say: "Here are four tens and three ones. That's forty-three. How many digits do you think we need to write forty-three? Have a guess."
            show: { drawn: base-ten, tens: 4, ones: 3 }
          - text: "43 = 4 tens and 3 ones"
            say: "Just two! Here are four tens and three ones. Four tens is forty, and three more is forty-three. We write it with two digits: 4 for the tens, then 3 for the ones."
            show: { drawn: base-ten, tens: 4, ones: 3 }
          - text: "T O: 4 3"
            say: "In the place-value chart the tens come first, on the left. The ones come next, on the right. Forty-three is 4 tens and 3 ones, not 34 and not 403."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [4, 3] }
          - text: "13 thirteen    30 thirty"
            say: "Listen to the end of the word. Thirteen ends in teen: it is one ten and three ones, 13. Thirty ends in ty: it is three tens, 30."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What number is this?"
                say: "Count the tens, then the ones. What number is this?"
                show: { drawn: base-ten, tens: 2, ones: 5 }
                options: ["25", "52", "7", "a million"]
                answer: "25"
                option_audio: false
                feedback:
                  "a million": "A million would never fit on the screen! Count the rods in tens, then the cubes."
                hints:
                  - "Count the rods in tens first."
                  - "Two tens is twenty. Then five ones."
                  - "25."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What number does the chart show?"
                say: "Read the place-value chart. What number does it show?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [6, 1] }
                options: ["61", "16", "7"]
                answer: "61"
                option_audio: false
                feedback:
                  "16": "The tens digit comes first. 6 tens and 1 one is 61."
                hints:
                  - "The tens are on the left."
                  - "6 tens is sixty, and 1 one."
                  - "61."
              - id: l1-f3
                type: text_input
                text: "Write the number you hear."
                say: "Fifty-seven. Write the number."
                answer: "57"
                hints:
                  - "Fifty is how many tens?"
                  - "Five tens, then seven ones."
                  - "57."
              - id: l1-f4
                type: multiple_choice
                text: "Tap the number you hear."
                say: "Fourteen. Tap the number."
                options: ["14", "40", "41"]
                answer: "14"
                option_audio: false
                feedback:
                  "40": "40 is forty. Fourteen ends in teen: one ten and four ones."
                hints:
                  - "Listen to the end of the word: teen or ty?"
                  - "Teen means one ten and some ones."
                  - "14."
              - id: l1-f5
                type: multiple_choice
                text: "Tap the number you hear."
                say: "Thirty-eight. Tap the number."
                options: ["38", "308", "83"]
                answer: "38"
                option_audio: false
                feedback:
                  "308": "Thirty-eight has 3 tens and 8 ones, so it has two digits: 38."
                hints:
                  - "How many tens are in thirty?"
                  - "3 tens, then 8 ones. That is two digits."
                  - "38."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "What number is this? Write it."
                say: "What number is this? Write it."
                show: { drawn: base-ten, tens: 7, ones: 2 }
                answer: "72"
                hints: ["Count the rods in tens first."]
              - id: l1-s2
                type: multiple_choice
                text: "What number does the chart show?"
                say: "What number does the chart show?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [3, 9] }
                options: ["39", "93", "12"]
                answer: "39"
                option_audio: false
                hints: ["The tens digit comes first."]
              - id: l1-s3
                type: text_input
                text: "How old is Grandpa? Write the number you hear."
                say: "Grandpa is eighty-four years old. Write the number."
                answer: "84"
                hints: ["Eighty is eight tens."]
              - id: l1-s4
                type: multiple_choice
                text: "Tap the number you hear."
                say: "Sixty. Tap the number."
                options: ["60", "16", "6"]
                answer: "60"
                option_audio: false
                hints: ["Does the word end in teen or ty?"]
              - id: l1-s5
                type: multiple_choice
                text: "Tap the number you hear."
                say: "Ninety-one. Tap the number."
                options: ["91", "901", "19"]
                answer: "91"
                option_audio: false
                hints: ["A number below 100 has two digits."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What number is this?"
                say: "What number is this?"
                show: { drawn: base-ten, tens: 5, ones: 6 }
                options: ["56", "65", "11"]
                answer: "56"
                option_audio: false
              - id: l1-n2
                type: text_input
                text: "Which bus? Write the number you hear."
                say: "Here comes bus number forty-nine. Write the number."
                answer: "49"
              - id: l1-n3
                type: fill_in_blank
                text: "How many tens and ones?"
                say: "Sixty-three. How many tens and how many ones?"
                frame: "63 = _ tens and _ ones"
                options: ["3", "6", "60", "30"]
                answer: ["6", "3"]
              - id: l1-n4
                type: multiple_choice
                text: "Tap the number you hear."
                say: "Seventeen. Tap the number."
                options: ["17", "70", "71"]
                answer: "17"
                option_audio: false
              - id: l1-n5
                type: text_input
                text: "Write the number you hear."
                say: "Twenty-six. Write the number."
                answer: "26"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What number is this?"
            say: "What number is this?"
            show: { drawn: base-ten, tens: 3, ones: 4 }
            options: ["34", "43", "7"]
            answer: "34"
            option_audio: false
          - id: l1-c2
            type: text_input
            text: "Write the number you hear."
            say: "Seventy-five. Write the number."
            answer: "75"
          - id: l1-c3
            type: multiple_choice
            text: "Tap the number you hear."
            say: "Fifty. Tap the number."
            options: ["50", "15", "5"]
            answer: "50"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "What number does the chart show?"
            say: "What number does the chart show?"
            show: { drawn: place-value-chart, columns: [tens, ones], values: [2, 8] }
            options: ["28", "82", "10"]
            answer: "28"
            option_audio: false
          - id: l1-c5
            type: text_input
            text: "Write the number you hear."
            say: "Ninety-three. Write the number."
            answer: "93"
          - id: l1-c6
            type: multiple_choice
            text: "Tap the number you hear."
            say: "Eighteen. Tap the number."
            options: ["18", "80", "81"]
            answer: "18"
            option_audio: false

  - n: 2
    title: { de: "Zahlwörter", en: "Number words" }
    goal:
      de: "Lies und schreib Zahlen als Wörter, so wie forty-three, und schreib forty richtig."
      en: "Read and write numbers as words, like forty-three, and spell forty the right way."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Write the number you hear."
            say: "Thirty-two. Write the number."
            answer: "32"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What number does the chart show?"
            say: "What number does the chart show?"
            show: { drawn: place-value-chart, columns: [tens, ones], values: [8, 0] }
            options: ["80", "8", "18"]
            answer: "80"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "four → forty or fourty?"
            say: "Four has a u in it. Do you think forty, the number 40, has a u too? Have a guess."
          - text: "twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety"
            say: "No, it doesn't! These are the tens words. Look at forty: it has no u, even though four does. Forty."
          - text: "43 forty-three"
            say: "We can write numbers in words. Forty-three is the tens word forty, a short line called a hyphen, and the ones word three."
          - text: "100 one hundred"
            say: "After ninety-nine comes one hundred. We write it as 100, with three digits."
          - text: "Did you know? In French, 80 is said as four twenties."
            say: "Did you know? In French, there is no word like eighty. To say 80, French people say quatre-vingts. That means four twenties!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "twenty-six"
                say: "Read the number word. Which number is it?"
                options: ["26", "62", "206"]
                answer: "26"
                option_audio: false
                hints:
                  - "The first word tells you the tens."
                  - "Twenty is 2 tens. Then six ones."
                  - "26."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "seventy-one"
                say: "Read the number word. Which number is it?"
                options: ["71", "17", "701"]
                answer: "71"
                option_audio: false
                feedback:
                  "17": "17 is seventeen. Seventy is 7 tens, so the 7 comes first: 71."
                hints:
                  - "Seventy ends in ty, so it is tens."
                  - "7 tens, then 1 one."
                  - "71."
              - id: l2-f3
                type: matching
                text: "Match each number to its word."
                say: "Match each number to its word."
                pairs:
                  - { left: { text: "35" }, right: { text: "thirty-five" } }
                  - { left: { text: "53" }, right: { text: "fifty-three" } }
                  - { left: { text: "15" }, right: { text: "fifteen" } }
                option_audio: false
                hints:
                  - "Look at the tens digit first."
                  - "35 has 3 tens: thirty. 53 has 5 tens: fifty."
                  - "35 thirty-five, 53 fifty-three, 15 fifteen."
              - id: l2-f4
                type: multiple_choice
                text: "Which word is spelt correctly?"
                say: "Which word for four tens is spelt correctly?"
                options: ["forty", "fourty", "fourtee"]
                answer: "forty"
                option_audio: false
                feedback:
                  "fourty": "Four has a u, but forty does not. Forty."
                hints:
                  - "Four tens is a tens word that ends in ty."
                  - "It drops the u from four."
                  - "forty."
              - id: l2-f5
                type: fill_in_blank
                text: "Write 48 in words."
                say: "Write forty-eight in words."
                frame: "48 = _-_"
                options: ["forty", "four", "eight", "eighty"]
                answer: ["forty", "eight"]
                option_audio: false
                hints:
                  - "First the tens word, then the ones word."
                  - "4 tens is forty."
                  - "forty-eight."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "ninety-four"
                say: "Read the number word. Which number is it?"
                options: ["94", "49", "904"]
                answer: "94"
                option_audio: false
                hints: ["The first word tells you the tens."]
              - id: l2-s2
                type: multiple_choice
                text: "Which word matches 62?"
                say: "Which word matches the number on the screen?"
                options: ["sixty-two", "twenty-six", "sixteen"]
                answer: "sixty-two"
                option_audio: false
                hints: ["62 has 6 tens."]
              - id: l2-s3
                type: matching
                text: "Match each number to its word."
                say: "Match each number to its word."
                pairs:
                  - { left: { text: "40" }, right: { text: "forty" } }
                  - { left: { text: "14" }, right: { text: "fourteen" } }
                  - { left: { text: "44" }, right: { text: "forty-four" } }
                option_audio: false
                hints: ["Teen is one ten. Ty is tens."]
              - id: l2-s4
                type: text_input
                text: "eighty-three"
                say: "Read the number word and write the number."
                answer: "83"
                hints: ["Eighty is 8 tens."]
              - id: l2-s5
                type: fill_in_blank
                text: "Write 57 in words."
                say: "Write fifty-seven in words."
                frame: "57 = _-_"
                options: ["fifty", "five", "seven", "seventy"]
                answer: ["fifty", "seven"]
                option_audio: false
                hints: ["First the tens word."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "thirty-nine"
                say: "Read the number word and write the number."
                answer: "39"
              - id: l2-n2
                type: multiple_choice
                text: "Which word matches 18?"
                say: "Which word matches the number on the screen?"
                options: ["eighteen", "eighty", "eighty-one"]
                answer: "eighteen"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Which word matches 45?"
                say: "Which word matches the number on the screen?"
                options: ["forty-five", "fourty-five", "fifty-four"]
                answer: "forty-five"
                option_audio: false
              - id: l2-n4
                type: matching
                text: "Match each number to its word."
                say: "Match each number to its word."
                pairs:
                  - { left: { text: "76" }, right: { text: "seventy-six" } }
                  - { left: { text: "67" }, right: { text: "sixty-seven" } }
                  - { left: { text: "100" }, right: { text: "one hundred" } }
                option_audio: false
              - id: l2-n5
                type: text_input
                text: "twenty-nine"
                say: "Read the number word and write the number."
                answer: "29"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: tens-ones
            type: multiple_choice
            text: "What number does the chart show?"
            say: "What number does the chart show?"
            show: { drawn: place-value-chart, columns: [tens, ones], values: [5, 2] }
            options: ["52", "25", "7"]
            answer: "52"
            option_audio: false
          - id: l2-c2
            part: hear
            type: multiple_choice
            text: "Tap the number you hear."
            say: "Nineteen. Tap the number."
            options: ["19", "90", "91"]
            answer: "19"
            option_audio: false
          - id: l2-c3
            part: hear
            type: text_input
            text: "Write the number you hear."
            say: "Sixty-eight. Write the number."
            answer: "68"
          - id: l2-c4
            part: read-word
            type: text_input
            text: "seventy-three"
            say: "Read the number word and write the number."
            answer: "73"
          - id: l2-c5
            part: write-word
            type: multiple_choice
            text: "Which word matches 81?"
            say: "Which word matches the number on the screen?"
            options: ["eighty-one", "eighteen", "eleven"]
            answer: "eighty-one"
            option_audio: false
          - id: l2-c6
            part: tens-ones
            type: multiple_choice
            text: "What number is this?"
            say: "What number is this?"
            show: { drawn: base-ten, tens: 8, ones: 3 }
            options: ["83", "38", "11"]
            answer: "83"
            option_audio: false
          - id: l2-c7
            part: tens-ones
            type: fill_in_blank
            text: "How many tens and ones?"
            say: "Count the tens rods and the ones cubes. How many tens and how many ones?"
            show: { drawn: base-ten, tens: 4, ones: 7 }
            frame: "_ tens and _ ones"
            options: ["4", "7", "40", "70"]
            answer: ["4", "7"]
          - id: l2-c8
            part: tens-ones
            type: image_multiple_choice
            text: "Which picture shows 29?"
            say: "Which picture shows twenty-nine?"
            options:
              - { drawn: base-ten, tens: 2, ones: 9 }
              - { drawn: base-ten, tens: 9, ones: 2 }
              - { drawn: base-ten, tens: 2, ones: 0 }
            answer: "29"
          - id: l2-c9
            part: tens-ones
            type: text_input
            text: "What number does the chart show? Write it."
            say: "What number does the chart show? Write it."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [1, 6] }
            answer: "16"
          - id: l2-c10
            part: hear
            type: multiple_choice
            text: "Tap the number you hear."
            say: "Twenty-seven. Tap the number."
            options: ["27", "72", "207"]
            answer: "27"
            option_audio: false
          - id: l2-c11
            part: hear
            type: true_false
            text: "30\nIs this the number you hear?"
            say: "Thirteen. Is this the number you hear?"
            answer: false
          - id: l2-c12
            part: hear
            type: text_input
            text: "Write the number you hear."
            say: "One hundred. Write the number."
            answer: "100"
          - id: l2-c13
            part: read-word
            type: multiple_choice
            text: "fifty-nine"
            say: "Read the number word. Which number is it?"
            options: ["59", "95", "509"]
            answer: "59"
            option_audio: false
          - id: l2-c14
            part: read-word
            type: text_input
            text: "twelve"
            say: "Read the number word and write the number."
            answer: "12"
          - id: l2-c15
            part: read-word
            type: true_false
            text: "sixty-four\n46\nIs it the same number?"
            say: "Read the number word and the number. Is it the same number?"
            answer: false
          - id: l2-c16
            part: read-word
            type: matching
            text: "Match each word to its number."
            say: "Match each word to its number."
            pairs:
              - { left: { text: "seventeen" }, right: { text: "17" } }
              - { left: { text: "seventy" }, right: { text: "70" } }
              - { left: { text: "seventy-one" }, right: { text: "71" } }
            option_audio: false
          - id: l2-c17
            part: write-word
            type: multiple_choice
            text: "Which word matches 30?"
            say: "Which word matches the number on the screen?"
            options: ["thirty", "thirteen", "three"]
            answer: "thirty"
            option_audio: false
          - id: l2-c18
            part: write-word
            type: fill_in_blank
            text: "Write 92 in words."
            say: "Write the number on the screen in words."
            frame: "92 = _-_"
            options: ["ninety", "nine", "two", "twenty"]
            answer: ["ninety", "two"]
            option_audio: false
          - id: l2-c19
            part: write-word
            type: multiple_choice
            text: "Which word matches 14?"
            say: "Which word matches the number on the screen?"
            options: ["fourteen", "forteen", "forty"]
            answer: "fourteen"
            option_audio: false
          - id: l2-c20
            part: write-word
            type: true_false
            text: "Is it true? 58 is fifty-eight."
            say: "Read the number and the word. Do they match?"
            answer: true
