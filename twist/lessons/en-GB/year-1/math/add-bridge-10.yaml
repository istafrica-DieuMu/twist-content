# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.add-bridge-10
skill: math.add-sub-to-20.add-bridge-10
curriculum: en-GB
language: en
title:
  de: Plus mit Zehnerübergang
  en: Adding by making ten
summary: >
  Adding across ten by making ten first: 8 + 5 = 8 + 2 + 3 = 13. Lesson 1
  makes ten in the double ten frame and adds the rest; lesson 2 splits
  the second number on paper and on a number line, and ends with the
  skill check.
metadata:
  year: year-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.missing-addend, math.numbers-to-20.partition-to-10, math.add-sub-to-20.analog-to-20]
  also_practises: [math.numbers-to-20.teens]
  vocabulary: { en: [make ten, bridge, split, number bond, ten frame, number line] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld, equation, rechenstrich, number-line]
  facets: []
  misconceptions:
    - id: count-all
      what: Counts every counter from one
      addressed: lesson 1 Learn shows the full ten at a glance; lesson 1 full-stage tasks show the double ten frame, and their hints work from the full ten
    - id: forget-rest
      what: Stops at ten and gives 10 as the answer
      addressed: 10 is an option in lesson 1, with feedback in the full stage
    - id: wrong-split
      what: Splits the second number so it does not make ten (8 + 5 = 8 + 1 + 4)
      addressed: lesson 2 practises the split on its own before the sum, and asks once whether a split that misses ten is a good way
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Erst die 10 voll machen, en: Make ten first }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "8 + _ = 10"
            say: "Eight and how many make ten?"
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "10 + 3 = _"
            say: "Ten add three."
            options: ["12", "13", "14"]
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "8 + 5"
            say: "Eight add five. There are eight counters in the top frame and five in the bottom one."
            show: { drawn: zwanzigerfeld, filled: [8, 5] }
          - text: "8 + 2 = 10"
            say: "Make ten first. Eight needs two more to make ten, so we move two counters up."
            show: { drawn: zwanzigerfeld, filled: [8, 5], move: 2 }
          - text: "10 + 3 = 13"
            say: "Now the top frame is a full ten, and three are left. Ten and three make thirteen. So eight add five is thirteen."
            show: { drawn: zwanzigerfeld, filled: [10, 3] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "9 + 4 = _"
                say: "Nine add four. Make ten first."
                show: { drawn: zwanzigerfeld, filled: [9, 4] }
                options: ["13", "10", "14"]
                answer: "13"
                feedback:
                  "10": "Ten is only the first step. Three more are left: thirteen."
                hints:
                  - "Make ten first: nine needs one more."
                  - "Ten, and three are left."
                  - "13."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "7 + 5 = _"
                say: "Seven add five."
                show: { drawn: zwanzigerfeld, filled: [7, 5] }
                options: ["12", "10", "11"]
                answer: "12"
                feedback:
                  "10": "Seven and three make ten, but two more are left: twelve."
                hints:
                  - "Seven needs three more to make ten."
                  - "Five is three and two. Two are left."
                  - "12."
              - id: l1-f3
                type: multiple_choice
                text: "How many move up?"
                say: "Six add seven. How many counters do you move up to make ten?"
                show: { drawn: zwanzigerfeld, filled: [6, 7] }
                options: ["4", "3", "7"]
                answer: "4"
                hints:
                  - "How many empty spaces are in the top frame?"
                  - "Six and four make ten."
                  - "4."
              - id: l1-f4
                type: text_input
                text: "8 + 6 = _"
                say: "Eight add six."
                show: { drawn: zwanzigerfeld, filled: [8, 6] }
                answer: "14"
                hints:
                  - "Move two up to make ten."
                  - "Four are left."
                  - "14."
              - id: l1-f5
                type: true_false
                text: "Is it true? 9 + 6 = 15"
                say: "Nine add six is fifteen. Is that true?"
                answer: true
                hints:
                  - "Nine and one make ten."
                  - "Five are left."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "8 + 4 = _"
                say: "Eight add four."
                show: { drawn: zwanzigerfeld, filled: [8, 4] }
                options: ["12", "10", "13"]
                answer: "12"
                hints: ["Make ten first."]
              - id: l1-s2
                type: multiple_choice
                text: "How many move up?"
                say: "Seven add six. How many counters do you move up to make ten?"
                show: { drawn: zwanzigerfeld, filled: [7, 6] }
                options: ["3", "6", "4"]
                answer: "3"
                hints: ["Count the empty spaces in the top frame."]
              - id: l1-s3
                type: text_input
                text: "9 + 5 = _"
                say: "Nine add five."
                answer: "14"
                hints: ["Nine needs one more to make ten."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 6 + 6 = 13"
                say: "Six add six is thirteen. Is that true?"
                answer: false
                hints: ["Make ten, then add what is left."]
              - id: l1-s5
                type: multiple_choice
                text: "7 + 7 = _"
                say: "Seven add seven."
                options: ["14", "13", "10"]
                answer: "14"
                hints: ["Seven needs three more to make ten."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "9 + 3 = _"
                say: "Nine add three."
                options: ["12", "11", "13"]
                answer: "12"
              - id: l1-n2
                type: text_input
                text: "8 + 7 = _"
                say: "Eight add seven."
                answer: "15"
              - id: l1-n3
                type: multiple_choice
                text: "How many move up?"
                say: "Five add seven. How many do you move up to make ten?"
                show: { drawn: zwanzigerfeld, filled: [5, 7] }
                options: ["5", "7", "2"]
                answer: "5"
              - id: l1-n4
                type: true_false
                text: "Is it true? 7 + 4 = 11"
                say: "Seven add four is eleven. Is that true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "6 + 5 = _"
                say: "Six add five."
                answer: "11"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "8 + 3 = _"
            say: "Eight add three."
            options: ["11", "10", "12"]
            answer: "11"
          - id: l1-c2
            type: text_input
            text: "9 + 7 = _"
            say: "Nine add seven."
            answer: "16"
          - id: l1-c3
            type: true_false
            text: "Is it true? 6 + 8 = 14"
            say: "Six add eight is fourteen. Is that true?"
            answer: true

  - n: 2
    title: { de: Zerlegen und springen, en: Split and hop }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "8 + 5 = _"
            say: "Eight add five."
            answer: "13"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "7 + _ = 10"
            say: "Seven and how many make ten?"
            options: ["3", "2", "4"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "9 + 4 = 9 + 1 + 3"
            say: "Nine add four. Split the four into one and three. The one makes ten, then add the three."
            show: { drawn: equation, text: "9 + 4 = _", split: "4 = 1 + 3" }
          - text: "9 → 10 → 13"
            say: "On a number line: hop one from nine to ten, then hop three to thirteen."
            show: { drawn: rechenstrich, start: 9, jumps: [1, 3] }
          - text: "7 + 6 = 7 + 3 + 3"
            say: "Seven add six: seven needs three to make ten. Six is three and three. Ten and three make thirteen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Split the 3 to make ten."
                say: "Eight add three. Split the three so the first part makes ten."
                frame: "8 + 3 = 8 + _ + _"
                options: ["1", "2", "3", "4"]
                answer: ["2", "1"]
                hints:
                  - "Eight needs two to make ten."
                  - "Three is two and one."
                  - "8 + 2 + 1."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which hop comes first?"
                say: "Seven add five. Which hop takes you exactly to ten?"
                show: { drawn: rechenstrich, start: 7, jumps: [] }
                options: ["3", "5", "2"]
                answer: "3"
                hints:
                  - "Seven and how many make ten?"
                  - "Seven and three make ten."
                  - "3."
              - id: l2-f3
                type: fill_in_blank
                text: "Split the 7 to make ten."
                say: "Six add seven. Split the seven so the first part makes ten."
                frame: "6 + 7 = 6 + _ + _"
                options: ["2", "3", "4", "5"]
                answer: ["4", "3"]
                hints:
                  - "Six needs four to make ten."
                  - "Seven is four and three."
                  - "6 + 4 + 3."
              - id: l2-f4
                type: true_false
                text: "Is it a good way? 9 + 5 = 9 + 2 + 3"
                say: "Nine add five, split as nine add two add three. Is that a good way to make ten?"
                answer: false
                feedback:
                  "true": "Nine and two make eleven, not ten. To make ten, split five into one and four."
                hints:
                  - "Do nine and two make ten?"
                  - "No, nine needs one."
                  - "No. 9 + 1 makes ten, so 9 + 1 + 4."
              - id: l2-f5
                type: point_on_line
                text: "Where do you land? 9 + 6"
                say: "Start at nine. Hop one to ten, then five more. Where do you land?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 15
                hints:
                  - "One hop to ten."
                  - "Then five more: eleven, twelve, thirteen, fourteen, fifteen."
                  - "15."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Split the 6 to make ten."
                say: "Eight add six. Split the six so the first part makes ten."
                frame: "8 + 6 = 8 + _ + _"
                options: ["2", "3", "4", "5"]
                answer: ["2", "4"]
                hints: ["How many does eight need to make ten?"]
              - id: l2-s2
                type: multiple_choice
                text: "Which hop comes first?"
                say: "Six add eight. Which hop takes you exactly to ten?"
                show: { drawn: rechenstrich, start: 6, jumps: [] }
                options: ["4", "8", "2"]
                answer: "4"
                hints: ["Six and how many make ten?"]
              - id: l2-s3
                type: text_input
                text: "7 + 8 = _"
                say: "Seven add eight."
                answer: "15"
                hints: ["Make ten first."]
              - id: l2-s4
                type: fill_in_blank
                text: "Split the 7 to make ten."
                say: "Nine add seven. Split the seven so the first part makes ten."
                frame: "9 + 7 = 9 + _ + _"
                options: ["1", "2", "5", "6"]
                answer: ["1", "6"]
                hints: ["Nine needs one to make ten."]
              - id: l2-s5
                type: point_on_line
                text: "Where do you land? 8 + 4"
                say: "Start at eight. Hop to ten, then the rest. Where do you land?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 12
                hints: ["Two to get to ten, then two more."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Split the 7 to make ten."
                say: "Eight add seven. Split the seven so the first part makes ten."
                frame: "8 + 7 = 8 + _ + _"
                options: ["2", "3", "4", "5"]
                answer: ["2", "5"]
              - id: l2-n2
                type: text_input
                text: "9 + 8 = _"
                say: "Nine add eight."
                answer: "17"
              - id: l2-n3
                type: multiple_choice
                text: "Which hop comes first?"
                say: "Five add eight. Which hop takes you exactly to ten?"
                show: { drawn: rechenstrich, start: 5, jumps: [] }
                options: ["5", "8", "3"]
                answer: "5"
              - id: l2-n4
                type: text_input
                text: "6 + 9 = _"
                say: "Six add nine."
                answer: "15"
              - id: l2-n5
                type: point_on_line
                text: "Where do you land? 7 + 9"
                say: "Start at seven. Hop to ten, then the rest. Where do you land?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 16

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "8 + 8 = _"
            say: "Eight add eight."
            answer: "16"
          - id: l2-c2
            type: fill_in_blank
            text: "Split the 9 to make ten."
            say: "Eight add nine. Split the nine so the first part makes ten."
            frame: "8 + 9 = 8 + _ + _"
            options: ["1", "2", "6", "7"]
            answer: ["2", "7"]
          - id: l2-c3
            type: multiple_choice
            text: "5 + 9 = _"
            say: "Five add nine."
            options: ["14", "10", "15"]
            answer: "14"
          - id: l2-c4
            type: true_false
            text: "Is it true? 9 + 9 = 17"
            say: "Nine add nine is seventeen. Is that true?"
            answer: false
          - id: l2-c5
            type: point_on_line
            text: "Where do you land? 4 + 7"
            say: "Four add seven. Start at four. Where do you land?"
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 11
