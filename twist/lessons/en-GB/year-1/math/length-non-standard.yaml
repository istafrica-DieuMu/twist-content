# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.length-non-standard
skill: math.length.non-standard
curriculum: en-GB
language: en
title:
  de: Messen mit Körpermaßen und Gegenständen
  en: Measuring with hand spans and objects
summary: >
  Lesson 1 measures by counting units laid end to end (the table is 6
  pencils long), with no gaps and no overlaps, and compares lengths by
  their counts; lesson 2 measures with hand spans and steps, sees that a
  bigger unit gives a smaller number and that two people's hand spans
  give different answers, so we need units that are the same for
  everyone, and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Längen, en: Length }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.length.compare, math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { en: [measure, length, long, hand span, step, cube, paper clip, gap, overlap, unit, the same for everyone] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: measure, what: { de: mit gleichen Gegenständen messen und die Zahlen vergleichen, en: measuring by counting units and comparing the counts } }
    - { id: fair, what: { de: ohne Lücken und Überlappungen messen, en: measuring fairly with no gaps or overlaps } }
    - { id: unit-size, what: { de: "erklären, warum größere Maße kleinere Zahlen geben", en: explaining why a bigger unit gives a smaller number } }
    - { id: choose, what: { de: "ein passendes Maß wählen und wissen, warum wir für alle gleiche Maße brauchen", en: choosing a good unit and knowing why we need units that are the same for everyone } }
  misconceptions:
    - id: gaps-overlaps
      what: Leaves gaps between the units or lets them overlap and still counts them
      addressed: lesson 1 Learn lays pencils end to end with no gaps; l1-f3 (with feedback), l1-s3 and l1-n3 ask whether a measurement with gaps or overlaps is fair
    - id: bigger-unit-bigger-number
      what: Thinks a bigger unit gives a bigger number (a path is more steps than hand spans)
      addressed: lesson 2 Learn measures one table in hand spans and in pencils; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c3 ask which unit gives more
    - id: units-not-compared
      what: Compares two counts made with different units (8 spans is longer than 5 steps)
      addressed: lesson 2 Learn shows Dad's and Ava's hand spans giving different numbers; l2-f4 (with feedback), l2-s4 and l2-n4 ask why the answers differ or whether they can be compared
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit Gegenständen messen", en: "Measuring with objects" }
    goal:
      de: "Miss mit Dingen, die ohne Lücken aneinanderliegen, so wie ein Tisch, der 6 Stifte lang ist."
      en: "Measure with things laid end to end with no gaps, like a table 6 pencils long."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is longer: a scarf or a sock?"
            say: "Which is longer, a scarf or a sock?"
            options: ["a scarf", "a sock", "the same length"]
            answer: "a scarf"
            difficulty: easy
          - id: l1-w2
            type: tap_to_count
            text: "How many pencils?"
            say: "Tap each pencil. How many are there?"
            show: { object: pencil, count: 7, layout: row }
            options: ["6", "7", "8"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The table is 6 pencils long."
            say: "We can measure the table with pencils. Lay them end to end along the table, from one end to the other. Count them: the table is six pencils long."
            show: { object: pencil, count: 6, layout: row }
          - text: "No gaps. No overlaps."
            say: "The pencils must touch, with no gaps between them. They must not go on top of each other either. And start right at the end of the table."
          - text: "The book is 4 crayons long. The ruler is 7 crayons long."
            say: "When we use the same thing to measure, we can compare. The ruler is seven crayons long. The book is four crayons long. Seven is more than four, so the ruler is longer."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tap_to_count
                text: "How many crayons long is the book?"
                say: "Crayons are laid end to end along a book. Tap each crayon. How many crayons long is the book?"
                show: { object: crayon, count: 4, layout: row }
                options: ["3", "4", "5"]
                answer: "4"
                hints:
                  - "Tap each crayon once."
                  - "One, two, three ..."
                  - "4 crayons."
                difficulty: easy
              - id: l1-f2
                type: tap_to_count
                text: "How many cubes long is the pencil case?"
                say: "Cubes are laid end to end along a pencil case. Tap each cube. How many cubes long is the pencil case?"
                show: { object: cube, count: 9, layout: row }
                options: ["8", "9", "10"]
                answer: "9"
                hints:
                  - "Tap each cube so you do not count one twice."
                  - "Count them all the way to the end."
                  - "9 cubes."
              - id: l1-f3
                type: true_false
                text: "Noah measures his shoe with cubes. He leaves gaps between them. Is his measurement fair?"
                say: "Noah measures his shoe with cubes, but he leaves gaps between them. Is his measurement fair?"
                answer: false
                feedback:
                  "true": "With gaps, part of the shoe is not counted, so the number comes out too small. The cubes must touch."
                hints:
                  - "Is all of the shoe covered?"
                  - "The gaps are not counted."
                  - "No. The cubes need to touch, with no gaps."
              - id: l1-f4
                type: multiple_choice
                text: "The bench is 9 pencils long. The table is 6 pencils long. Which is longer?"
                say: "The bench is nine pencils long. The table is six pencils long. Which is longer?"
                options: ["the bench", "the table", "the same length"]
                answer: "the bench"
                hints:
                  - "They are measured with the same pencils."
                  - "Nine is more than six."
                  - "The bench."
              - id: l1-f5
                type: multiple_choice
                text: "Ella measures a ribbon with paper clips. Where should the first paper clip go?"
                say: "Ella wants to measure a ribbon with paper clips. Where should the first paper clip go?"
                options: ["right at the end of the ribbon", "in the middle of the ribbon", "anywhere on the ribbon"]
                answer: "right at the end of the ribbon"
                hints:
                  - "You measure from one end to the other."
                  - "Start at the very beginning."
                  - "Right at the end of the ribbon."

          - support: some
            tasks:
              - id: l1-s1
                type: tap_to_count
                text: "How many spoons long is the tray?"
                say: "Spoons are laid end to end along a tray. Tap each spoon. How many spoons long is the tray?"
                show: { object: spoon, count: 5, layout: row }
                options: ["4", "5", "6"]
                answer: "5"
                hints: ["Tap each spoon once."]
              - id: l1-s2
                type: multiple_choice
                text: "The rug is 8 shoes long. The mat is 3 shoes long. Which is shorter?"
                say: "The rug is eight shoes long. The mat is three shoes long. Which is shorter?"
                options: ["the mat", "the rug", "the same length"]
                answer: "the mat"
                hints: ["Fewer shoes means shorter."]
              - id: l1-s3
                type: true_false
                text: "Isla measures a pencil with cubes. Two of her cubes overlap. Is her measurement fair?"
                say: "Isla measures a pencil with cubes, but two cubes overlap, one on top of the other. Is her measurement fair?"
                answer: false
                hints: ["Overlaps count part of the length twice."]
              - id: l1-s4
                type: tap_to_count
                text: "How many rulers long is the table?"
                say: "Rulers are laid end to end along a table. Tap each ruler. How many rulers long is the table?"
                show: { object: ruler, count: 6, layout: row }
                options: ["5", "6", "7"]
                answer: "6"
                hints: ["Count to the very end."]
              - id: l1-s5
                type: multiple_choice
                text: "Two ribbons are both 5 cubes long. What is true?"
                say: "Two ribbons are both five cubes long. What is true?"
                options: ["They are the same length.", "The first one is longer.", "We cannot tell."]
                answer: "They are the same length."
                hints: ["The same unit and the same number."]

          - support: none
            tasks:
              - id: l1-n1
                type: tap_to_count
                text: "How many pencils long is the shelf?"
                say: "Pencils are laid end to end along a shelf. Tap each pencil. How many pencils long is the shelf?"
                show: { object: pencil, count: 8, layout: row }
                options: ["7", "8", "9"]
                answer: "8"
              - id: l1-n2
                type: multiple_choice
                text: "The snake is 10 cubes long. The worm is 4 cubes long. Which is longer?"
                say: "The toy snake is ten cubes long. The toy worm is four cubes long. Which is longer?"
                options: ["the snake", "the worm", "the same length"]
                answer: "the snake"
              - id: l1-n3
                type: multiple_choice
                text: "Which way of measuring is fair?"
                say: "Which way of measuring with cubes is fair?"
                options: ["cubes touching end to end", "cubes with gaps", "cubes on top of each other"]
                answer: "cubes touching end to end"
              - id: l1-n4
                type: tap_to_count
                text: "How many cubes long is the book?"
                say: "Cubes are laid end to end along a book. Tap each cube. How many cubes long is the book?"
                show: { object: cube, count: 7, layout: row }
                options: ["6", "7", "8"]
                answer: "7"
              - id: l1-n5
                type: ordering
                text: "Shelf: 8 pencils. Desk: 10 pencils. Box: 3 pencils. Put them in order. Start with the shortest."
                say: "The shelf is eight pencils long. The desk is ten pencils long. The box is three pencils long. Put them in order, starting with the shortest."
                options: ["desk", "box", "shelf"]
                slot_count: 3
                answer: ["box", "shelf", "desk"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: tap_to_count
            text: "How many crayons long is the ruler?"
            say: "Crayons are laid end to end along a ruler. Tap each crayon. How many crayons long is the ruler?"
            show: { object: crayon, count: 5, layout: row }
            options: ["4", "5", "6"]
            answer: "5"
          - id: l1-c2
            type: multiple_choice
            text: "The door is 7 rulers tall. The window is 4 rulers tall. Which is taller?"
            say: "The door is seven rulers tall. The window is four rulers tall. Which is taller?"
            options: ["the door", "the window", "the same height"]
            answer: "the door"
          - id: l1-c3
            type: true_false
            text: "Is it true? When you measure, the objects should touch with no gaps."
            say: "When you measure with objects, they should touch with no gaps. Is that true?"
            answer: true
          - id: l1-c4
            type: tap_to_count
            text: "How many pencils long is the bench?"
            say: "Pencils are laid end to end along a bench. Tap each pencil. How many pencils long is the bench?"
            show: { object: pencil, count: 9, layout: row }
            options: ["8", "9", "10"]
            answer: "9"
          - id: l1-c5
            type: multiple_choice
            text: "The lid is 3 cubes long. The tray is 6 cubes long. Which is shorter?"
            say: "The lid is three cubes long. The tray is six cubes long. Which is shorter?"
            options: ["the lid", "the tray", "the same length"]
            answer: "the lid"
          - id: l1-c6
            type: true_false
            text: "Is it true? When you measure with cubes, the cubes may overlap."
            say: "When you measure with cubes, the cubes may overlap. Is that true?"
            answer: false

  - n: 2
    title: { de: "Spannen, Schritte und gleiche Maße", en: "Spans, steps and units for everyone" }
    goal:
      de: "Miss mit Handspannen und Schritten und finde heraus, warum alle die gleichen Maße brauchen."
      en: "Measure with hand spans and steps, and see why everyone needs the same units."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: tap_to_count
            text: "How many cubes long is the pencil?"
            say: "Cubes are laid end to end along a pencil. Tap each cube. How many cubes long is the pencil?"
            show: { object: cube, count: 6, layout: row }
            options: ["5", "6", "7"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "The mat is 4 shoes long. The rug is 9 shoes long. Which is longer?"
            say: "The mat is four shoes long. The rug is nine shoes long. Which is longer?"
            options: ["the rug", "the mat", "the same length"]
            answer: "the rug"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A hand span"
            say: "We can measure with our bodies too. A hand span is from the tip of your thumb to the tip of your little finger, with your hand stretched out. A step is one walking step, heel to toe."
            show: { object: hand }
          - text: "The table: 5 hand spans, or 8 pencils"
            say: "Sam measures the table. It is five hand spans long, or eight pencils long. A hand span is bigger than a pencil, so it takes fewer of them. A bigger unit gives a smaller number."
          - text: "Dad: 4 spans. Ava: 7 spans."
            say: "Dad and Ava measure the same table with their hand spans. Dad gets four. Ava gets seven, because her hand is smaller. They measured the same table, but got different numbers. That is why we need units that are the same for everyone, like the centimetres on a ruler."
            show: { objects: [dad, child] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is best for measuring the length of the classroom?"
                say: "Which is best for measuring the length of the classroom?"
                options: ["steps", "paper clips", "cubes"]
                answer: "steps"
                hints:
                  - "The classroom is long."
                  - "Small things would take a very long time to lay out."
                  - "Steps."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Mo measures the same rug in steps and in shoes. A step is longer than a shoe. Which number is bigger?"
                say: "Mo measures the same rug in steps and in shoes. A step is longer than a shoe. Which number will be bigger?"
                options: ["the number of shoes", "the number of steps", "the same number"]
                answer: "the number of shoes"
                feedback:
                  "the number of steps": "A step is longer than a shoe, so it takes fewer steps. It takes more shoes."
                hints:
                  - "Which is longer, a step or a shoe?"
                  - "A bigger unit gives a smaller number."
                  - "The number of shoes is bigger."
              - id: l2-f3
                type: multiple_choice
                text: "The desk is 4 hand spans long. A pencil is shorter than a hand span. About how many pencils long might the desk be?"
                say: "The desk is four hand spans long. A pencil is shorter than a hand span. About how many pencils long might the desk be?"
                options: ["6", "4", "2"]
                answer: "6"
                hints:
                  - "A pencil is shorter than a hand span."
                  - "So it takes more pencils than hand spans."
                  - "More than 4: 6."
              - id: l2-f4
                type: multiple_choice
                text: "Grandpa measures his path: 10 of his steps. Kai measures the same path: 14 of his steps. Why are the numbers different?"
                say: "Grandpa measures his path: ten of his steps. Kai measures the same path: fourteen of his steps. Why are the numbers different?"
                options: ["Kai's steps are smaller.", "Kai's path is longer.", "Grandpa counted wrong."]
                answer: "Kai's steps are smaller."
                feedback:
                  "Kai's path is longer.": "It is the same path. Kai's steps are smaller, so he needs more of them."
                hints:
                  - "It is the same path."
                  - "Whose steps are smaller?"
                  - "Kai's steps are smaller."
              - id: l2-f5
                type: true_false
                text: "Is it true? We need units that are the same for everyone, so that everyone gets the same answer."
                say: "We need units that are the same for everyone, so that everyone gets the same answer. Is that true?"
                answer: true
                hints:
                  - "Think of Dad and Ava with their hand spans."
                  - "Different hands gave different numbers."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which is best for measuring a pencil?"
                say: "Which is best for measuring a pencil?"
                options: ["cubes", "steps", "hand spans"]
                answer: "cubes"
                hints: ["A pencil is short, so pick a small unit."]
              - id: l2-s2
                type: multiple_choice
                text: "Zoe measures her bed in hand spans and in cubes. A cube is smaller than a hand span. Which number is bigger?"
                say: "Zoe measures her bed in hand spans and in cubes. A cube is smaller than a hand span. Which number will be bigger?"
                options: ["the number of cubes", "the number of hand spans", "the same number"]
                answer: "the number of cubes"
                hints: ["A smaller unit gives a bigger number."]
              - id: l2-s3
                type: true_false
                text: "Is it true? A hand span is longer than a paper clip."
                say: "A hand span is longer than a paper clip. Is that true?"
                answer: true
                hints: ["Think of your hand next to a paper clip."]
              - id: l2-s4
                type: multiple_choice
                text: "Mum measures the table: 5 hand spans. Leo measures it: 8 hand spans. Why?"
                say: "Mum measures the table: five hand spans. Leo measures the same table: eight hand spans. Why are the numbers different?"
                options: ["Leo's hand is smaller.", "Leo's table is longer.", "Mum's hand is smaller."]
                answer: "Leo's hand is smaller."
                hints: ["Who needs more spans?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which unit is the same for everyone?"
                say: "Which unit is the same for everyone?"
                options: ["a centimetre on a ruler", "a hand span", "a step"]
                answer: "a centimetre on a ruler"
                hints: ["Hands and steps are different sizes for different people."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is best for measuring the playground?"
                say: "Which is best for measuring the length of the playground?"
                options: ["steps", "cubes", "paper clips"]
                answer: "steps"
              - id: l2-n2
                type: multiple_choice
                text: "Ali measures a book in paper clips and in pencils. A pencil is longer than a paper clip. Which number is smaller?"
                say: "Ali measures a book in paper clips and in pencils. A pencil is longer than a paper clip. Which number will be smaller?"
                options: ["the number of pencils", "the number of paper clips", "the same number"]
                answer: "the number of pencils"
              - id: l2-n3
                type: true_false
                text: "Is it true? A step is shorter than a cube."
                say: "A step is shorter than a cube. Is that true?"
                answer: false
              - id: l2-n4
                type: true_false
                text: "Is it true? Rosie's rope is 6 hand spans. Finn's rope is 6 steps. They are the same length."
                say: "Rosie's rope is six hand spans long. Finn's rope is six steps long. Are the ropes the same length?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "The board is 9 hand spans for Ella and 6 hand spans for Miss Khan. Who has the bigger hand?"
                say: "Ella measures the board: nine hand spans. Miss Khan measures it: six hand spans. Who has the bigger hand?"
                options: ["Miss Khan", "Ella", "They are the same."]
                answer: "Miss Khan"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: measure
            type: tap_to_count
            text: "How many spoons long is the table mat?"
            say: "Spoons are laid end to end along a table mat. Tap each spoon. How many spoons long is the mat?"
            show: { object: spoon, count: 3, layout: row }
            options: ["2", "3", "4"]
            answer: "3"
          - id: l2-c2
            part: fair
            type: multiple_choice
            text: "Jack measures a scarf with crayons. Which way is fair?"
            say: "Jack measures a scarf with crayons. Which way is fair?"
            options: ["crayons end to end, touching", "crayons with gaps between", "crayons on top of each other"]
            answer: "crayons end to end, touching"
          - id: l2-c3
            part: unit-size
            type: multiple_choice
            text: "Ivy measures the hall: it is 10 of her steps long. Her hand span is smaller than her step. Will the hall be more or fewer than 10 of her hand spans long?"
            say: "Ivy measures the hall. It is ten of her steps long. Her hand span is smaller than her step. Will the hall be more or fewer than ten of her hand spans long?"
            options: ["more than 10", "fewer than 10", "10"]
            answer: "more than 10"
          - id: l2-c4
            part: choose
            type: multiple_choice
            text: "Why do we need units that are the same for everyone?"
            say: "Why do we need units that are the same for everyone?"
            options: ["So everyone gets the same answer.", "Because hands are too slow.", "So the numbers are bigger."]
            answer: "So everyone gets the same answer."
          - id: l2-c5
            part: measure
            type: multiple_choice
            text: "The tray is 8 cubes long. The box is 5 cubes long. Which is longer?"
            say: "The tray is eight cubes long. The box is five cubes long. Which is longer?"
            options: ["the tray", "the box", "the same length"]
            answer: "the tray"
          - id: l2-c6
            part: measure
            type: tap_to_count
            text: "How many paper clips long is the crayon?"
            say: "Paper clips are laid end to end along a crayon. Tap each paper clip. How many paper clips long is the crayon?"
            show: { object: paper-clip, count: 6, layout: row }
            options: ["5", "6", "7"]
            answer: "6"
          - id: l2-c7
            part: measure
            type: multiple_choice
            text: "The scarf is 9 pencils long. The towel is 10 pencils long. Which is shorter?"
            say: "The scarf is nine pencils long. The towel is ten pencils long. Which is shorter?"
            options: ["the scarf", "the towel", "the same length"]
            answer: "the scarf"
          - id: l2-c8
            part: measure
            type: ordering
            text: "Rope: 7 cubes. Ribbon: 2 cubes. String: 5 cubes. Put them in order. Start with the longest."
            say: "The rope is seven cubes long. The ribbon is two cubes long. The string is five cubes long. Put them in order, starting with the longest."
            options: ["string", "rope", "ribbon"]
            slot_count: 3
            answer: ["rope", "string", "ribbon"]
          - id: l2-c9
            part: fair
            type: true_false
            text: "Is it true? Max lays pencils along the table. They touch, with no gaps and no overlaps. His measurement is fair."
            say: "Max lays pencils along the table. They touch, with no gaps and no overlaps. His measurement is fair. Is that true?"
            answer: true
          - id: l2-c10
            part: fair
            type: true_false
            text: "Is it true? Lucy puts her first paper clip in the middle of the ribbon. Her measurement is fair."
            say: "Lucy puts her first paper clip in the middle of the ribbon. Her measurement is fair. Is that true?"
            answer: false
          - id: l2-c11
            part: fair
            type: multiple_choice
            text: "Ruby measures her book with cubes. Some cubes overlap. What happens to her number?"
            say: "Ruby measures her book with cubes, but some cubes overlap. What happens to her number?"
            options: ["It is too big.", "It is too small.", "It is just right."]
            answer: "It is too big."
          - id: l2-c12
            part: fair
            type: multiple_choice
            text: "Aisha measures her shoe with cubes. What should she do?"
            say: "Aisha measures her shoe with cubes. What should she do?"
            options: ["Start at the end of the shoe and make the cubes touch.", "Start in the middle of the shoe.", "Leave a gap after each cube."]
            answer: "Start at the end of the shoe and make the cubes touch."
          - id: l2-c13
            part: unit-size
            type: multiple_choice
            text: "The path is 12 of Kai's steps. Dad's steps are bigger. Will the path be more or fewer of Dad's steps?"
            say: "The path is twelve of Kai's steps. Dad's steps are bigger. Will the path be more or fewer of Dad's steps?"
            options: ["fewer", "more", "the same"]
            answer: "fewer"
          - id: l2-c14
            part: unit-size
            type: true_false
            text: "Is it true? A smaller unit gives a bigger number."
            say: "A smaller unit gives a bigger number. Is that true?"
            answer: true
          - id: l2-c15
            part: unit-size
            type: multiple_choice
            text: "The bed is 6 hand spans for Mum and 9 hand spans for Zac. Whose hand is smaller?"
            say: "Mum measures the bed: six hand spans. Zac measures it: nine hand spans. Whose hand is smaller?"
            options: ["Zac's", "Mum's", "They are the same."]
            answer: "Zac's"
          - id: l2-c16
            part: unit-size
            type: true_false
            text: "Is it true? The rug is 7 shoes long. A step is longer than a shoe, so the rug is more than 7 steps long."
            say: "The rug is seven shoes long. A step is longer than a shoe, so the rug is more than seven steps long. Is that true?"
            answer: false
          - id: l2-c17
