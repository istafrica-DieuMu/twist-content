# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.solids
skill: math.solids.cube-cuboid-sphere
curriculum: en-GB
language: en
title:
  de: Würfel, Quader und Kugel
  en: Cubes, cuboids and spheres
summary: >
  Lesson 1 names cubes, cuboids and spheres by their faces (a cube has six
  square faces, a cuboid six flat faces, a sphere one curved surface and
  no corners) and says which ones roll and which stack, and that a cube is
  a special cuboid; lesson 2 finds the 3-D shapes in things around us (a
  ball, a box, a toy cube, a book), tells a 3-D shape from its flat 2-D
  face, and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Körper, en: 3D shapes }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.shapes.basic-shapes]
  also_practises: [math.shapes.basic-shapes]
  vocabulary: { en: [3-D shape, 2-D shape, cube, cuboid, sphere, face, flat, curved, corner, edge, roll, stack, slide] }
  forms: [drawn, picture, text, audio]
  drawn: [shape]
  facets: []
  parts:
    - { id: name, what: { de: "Würfel, Quader und Kugel erkennen und benennen", en: "recognising and naming cubes, cuboids and spheres" } }
    - { id: props, what: { de: "Flächen und Ecken beschreiben, rollen und stapeln", en: "describing faces and corners, rolling and stacking" } }
    - { id: around, what: { de: die Körper in der Umwelt finden, en: finding the 3-D shapes around us } }
    - { id: flat-solid, what: { de: einen Körper von einer flachen Form unterscheiden, en: telling a 3-D shape from a flat 2-D shape } }
  misconceptions:
    - id: flat-for-solid
      what: Names a 3-D shape by its flat face (calls a cube a square, a sphere a circle)
      addressed: lesson 1 Learn sets the square face against the whole cube; l1-f2 (with feedback), l1-s2, l2-f4 and l2-c4 offer the 2-D name for a 3-D shape
    - id: cube-not-cuboid
      what: Thinks a cube cannot be a cuboid, or calls every cuboid a cube
      addressed: lesson 1 Learn says a cube is a cuboid whose faces are all squares; l1-f4 (with feedback) asks whether a cube is a cuboid, and l1-s4 and l1-n4 name the cuboid by its long rectangle faces, and l2-c3 names the cube by its square faces
    - id: sphere-has-faces
      what: Thinks a sphere has flat faces or corners
      addressed: lesson 1 Learn says a sphere has one curved surface and no corners; l1-f5, l1-s5 (with feedback) and l1-n5 ask which shape rolls or has no corners
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Würfel, Quader, Kugel", en: "Cube, cuboid, sphere" }
    goal:
      de: "Benenne Würfel, Quader und Kugel, so wie ein Spielwürfel ist ein Würfel."
      en: "Name a cube, a cuboid and a sphere, like a dice is a cube."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is this shape called?"
            say: "What is this flat shape called?"
            show: { drawn: shape, kind: square, colour: blue }
            options: ["square", "circle", "triangle"]
            answer: "square"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many corners does a circle have?"
            say: "How many corners does a circle have?"
            options: ["0", "1", "4"]
            answer: "0"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "How many flat faces?"
            say: "Look at this solid shape. How many flat faces do you think it has? Have a guess."
            show: { drawn: shape, kind: cube, colour: orange }
          - text: "cube"
            say: "Six! This is a cube. It is a solid shape, a 3-D shape. It has six flat faces, and every face is a square. A dice is a cube."
            show: { drawn: shape, kind: cube, colour: orange }
          - text: "cuboid"
            say: "This is a cuboid. It also has six flat faces. Some of its faces are long rectangles. A cereal box is a cuboid. A cube is a special cuboid, because all its faces are squares."
            show: { drawn: shape, kind: cuboid, colour: blue }
          - text: "sphere"
            say: "This is a sphere. It is round all over, like a ball. It has one curved surface and no flat faces, no edges and no corners. A sphere rolls."
            show: { drawn: shape, kind: sphere, colour: red }
          - text: "square and cube"
            say: "A square is flat. You can draw it on paper. A cube is solid. You can hold it. The face of a cube is a square, but the whole shape is a cube."
            show: { drawn: shape, row: [square, cube], colours: [orange, orange] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which one is the sphere?"
                say: "Tap the sphere."
                options:
                  - { drawn: shape, kind: sphere, colour: green }
                  - { drawn: shape, kind: cube, colour: green }
                  - { drawn: shape, kind: cuboid, colour: green }
                answer: "sphere"
                hints:
                  - "A sphere is round all over."
                  - "It has no flat faces and no corners."
                  - "The shape that looks like a ball."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is this 3-D shape called?"
                say: "This is a solid shape. What is it called?"
                show: { drawn: shape, kind: cube, colour: purple }
                options: ["cube", "square", "sphere"]
                answer: "cube"
                feedback:
                  "square": "A square is flat. This shape is solid, and each of its faces is a square. It is a cube."
                hints:
                  - "Is it flat or solid?"
                  - "It is solid, and all its faces are squares."
                  - "A cube."
              - id: l1-f3
                type: multiple_choice
                text: "How many faces does a cube have?"
                say: "How many flat faces does a cube have?"
                show: { drawn: shape, kind: cube, colour: yellow }
                options: ["6", "4", "3"]
                answer: "6"
                hints:
                  - "Think of a dice: it has a face for each number from 1 to 6."
                  - "Top, bottom, front, back and two sides."
                  - "6."
              - id: l1-f4
                type: true_false
                text: "Is it true? A cube is a special cuboid."
                say: "A cube is a special cuboid. Is that true?"
                show: { drawn: shape, kind: cube, colour: blue }
                answer: true
                feedback:
                  "false": "A cube has six flat faces like every cuboid. Its faces are all squares, so it is a special cuboid."
                hints:
                  - "Does a cube have six flat faces, like a cuboid?"
                  - "A cuboid whose faces are all squares is called a cube."
                  - "Yes."
              - id: l1-f5
                type: multiple_choice
                text: "Which shape rolls?"
                say: "Which of these shapes rolls?"
                options: ["sphere", "cube", "cuboid"]
                answer: "sphere"
                hints:
                  - "Rolling needs a curved surface."
                  - "Which one has no flat faces?"
                  - "A sphere."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which one is the cube?"
                say: "Tap the cube."
                options:
                  - { drawn: shape, kind: sphere, colour: red }
                  - { drawn: shape, kind: cube, colour: red }
                  - { drawn: shape, kind: cylinder, colour: red }
                answer: "cube"
                hints: ["All its faces are squares."]
              - id: l1-s2
                type: multiple_choice
                text: "What is this 3-D shape called?"
                say: "This is a solid shape. What is it called?"
                show: { drawn: shape, kind: sphere, colour: blue }
                options: ["sphere", "circle", "cube"]
                answer: "sphere"
                hints: ["A circle is flat. This shape is solid."]
              - id: l1-s3
                type: multiple_choice
                text: "Which shape has 6 flat faces?"
                say: "Which shape has six flat faces?"
                options: ["cuboid", "sphere", "circle"]
                answer: "cuboid"
                hints: ["Think of a box."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Which one is the cuboid?"
                say: "Tap the cuboid. Some of its faces are long rectangles."
                options:
                  - { drawn: shape, kind: cuboid, colour: yellow }
                  - { drawn: shape, kind: sphere, colour: yellow }
                  - { drawn: shape, kind: cone, colour: yellow }
                answer: "cuboid"
                hints: ["Look for long rectangle faces."]
              - id: l1-s5
                type: true_false
                text: "Is it true? A sphere has 6 corners."
                say: "A sphere has six corners. Is that true?"
                answer: false
                feedback:
                  "true": "A sphere is round all over. It has no corners at all."
                hints: ["Is a ball pointed anywhere?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What is this 3-D shape called?"
                say: "This is a solid shape. What is it called?"
                show: { drawn: shape, kind: cuboid, colour: green }
                options: ["cuboid", "sphere", "triangle"]
                answer: "cuboid"
              - id: l1-n2
                type: image_multiple_choice
                text: "Which one is the sphere?"
                say: "Tap the sphere."
                options:
                  - { drawn: shape, kind: cube, colour: blue }
                  - { drawn: shape, kind: cylinder, colour: blue }
                  - { drawn: shape, kind: sphere, colour: blue }
                answer: "sphere"
              - id: l1-n3
                type: multiple_choice
                text: "What shape is each face of a cube?"
                say: "What shape is each face of a cube?"
                options: ["square", "circle", "triangle"]
                answer: "square"
              - id: l1-n4
                type: multiple_choice
                text: "Which shape has some faces that are long rectangles?"
                say: "Which shape has some faces that are long rectangles?"
                options: ["a cuboid like a cereal box", "a sphere", "a dice"]
                answer: "a cuboid like a cereal box"
              - id: l1-n5
                type: multiple_choice
                text: "Which shape has no corners?"
                say: "Which of these shapes has no corners?"
                options: ["sphere", "cube", "cuboid"]
                answer: "sphere"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which one is the cube?"
            say: "Tap the cube."
            options:
              - { drawn: shape, kind: cube, colour: green }
              - { drawn: shape, kind: sphere, colour: green }
              - { drawn: shape, kind: pyramid, colour: green }
            answer: "cube"
          - id: l1-c2
            type: multiple_choice
            text: "What is this 3-D shape called?"
            say: "This is a solid shape. What is it called?"
            show: { drawn: shape, kind: sphere, colour: orange }
            options: ["sphere", "cuboid", "square"]
            answer: "sphere"
          - id: l1-c3
            type: true_false
            text: "Is it true? A cuboid can roll like a ball."
            say: "A cuboid can roll like a ball. Is that true?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "How many flat faces does a sphere have?"
            say: "How many flat faces does a sphere have?"
            options: ["0", "1", "6"]
            answer: "0"
          - id: l1-c5
            type: true_false
            text: "Is it true? This shape is a sphere."
            say: "This shape is a sphere. Is that true?"
            show: { drawn: shape, kind: sphere, colour: purple }
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which shape can you stack to build a tower?"
            say: "Which shape can you stack to build a tower?"
            options: ["cuboid", "sphere"]
            answer: "cuboid"

  - n: 2
    title: { de: "Körper um mich herum", en: "3-D shapes around me" }
    goal:
      de: "Finde Körper um dich herum, so wie ein Ball ist eine Kugel und ein Karton ist ein Quader."
      en: "Find solid shapes around you, like a ball is a sphere and a box is a cuboid."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is this 3-D shape called?"
            say: "This is a solid shape. What is it called?"
            show: { drawn: shape, kind: cube, colour: red }
            options: ["cube", "sphere", "circle"]
            answer: "cube"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which shape rolls?"
            say: "Which shape rolls?"
            options: ["sphere", "cuboid", "cube"]
            answer: "sphere"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A ball and an orange: which 3-D shape are they like?"
            say: "Look at the ball and the orange. Which 3-D shape do you think they are like? Have a guess."
            show: { objects: [ball, orange] }
          - text: "A ball is a sphere."
            say: "We can find 3-D shapes all around us. A ball is a sphere. An orange is nearly a sphere too."
            show: { objects: [ball, orange] }
          - text: "A box is a cuboid."
            say: "A cardboard box is a cuboid. So is a book. They have six flat faces."
            show: { objects: [box, book] }
          - text: "A toy cube is a cube."
            say: "A toy building cube is a cube. All its faces are squares the same size."
            show: { object: cube }
          - text: "Did you know? Wombats do poo shaped like little cubes!"
            say: "Did you know? A wombat is a furry animal from Australia. Its poo comes out shaped like little cubes! Wombats leave them on rocks and logs, and because cubes have flat faces, they do not roll away."
            show: { drawn: shape, kind: cube, colour: brown }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What 3-D shape is the ball?"
                say: "Look at the ball. What 3-D shape is it?"
                show: { object: ball }
                options: ["sphere", "cube", "cuboid"]
                answer: "sphere"
                hints:
                  - "Is it round all over?"
                  - "It has no flat faces and it rolls."
                  - "A sphere."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What 3-D shape is the box?"
                say: "Look at the cardboard box. What 3-D shape is it?"
                show: { object: box }
                options: ["cuboid", "sphere", "circle"]
                answer: "cuboid"
                hints:
                  - "Does it have flat faces?"
                  - "It has six flat faces, and some are long rectangles."
                  - "A cuboid."
              - id: l2-f3
                type: sorting
                text: "Sort the things."
                say: "Is it a sphere or a cuboid? Sort the things."
                bins:
                  - { id: sphere, show: { text: "sphere" }, say: "Sphere." }
                  - { id: cuboid, show: { text: "cuboid" }, say: "Cuboid." }
                options:
                  - { object: ball, bin: sphere }
                  - { object: orange, bin: sphere }
                  - { object: box, bin: cuboid }
                  - { object: book, bin: cuboid }
                hints:
                  - "Does it roll, or does it have flat faces?"
                  - "Round things are spheres. Things with six flat faces are cuboids."
                  - "Ball and orange: sphere. Box and book: cuboid."
              - id: l2-f4
                type: multiple_choice
                text: "Ella says the marble is a circle. What is it really?"
                say: "Ella says the marble is a circle. What 3-D shape is it really?"
                show: { object: marble }
                options: ["a sphere", "a circle", "a cube"]
                answer: "a sphere"
                feedback:
                  "a circle": "A circle is flat. A marble is solid and round all over, so it is a sphere."
                hints:
                  - "Is a marble flat, or can you hold it?"
                  - "It is solid and round all over."
                  - "A sphere."
              - id: l2-f5
                type: true_false
                text: "Is it true? A dice is a cube."
                say: "A dice is a cube. Is that true?"
                show: { drawn: shape, kind: cube, colour: yellow }
                answer: true
                hints:
                  - "What shape is each face of a dice?"
                  - "A dice has six square faces."
                  - "Yes, a dice is a cube."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What 3-D shape is the orange?"
                say: "Look at the orange. Which 3-D shape is it most like?"
                show: { object: orange }
                options: ["sphere", "cube", "cuboid"]
                answer: "sphere"
                hints: ["It is round all over."]
              - id: l2-s2
                type: true_false
                text: "Is it true? The book is a cuboid."
                say: "Look at the book. The book is a cuboid. Is that true?"
                show: { object: book }
                answer: true
                hints: ["A rectangle is flat. A book is solid."]
              - id: l2-s3
                type: multiple_choice
                text: "Which thing is a sphere?"
                say: "Which of these things is a sphere?"
                options: ["a football", "a cereal box", "a brick"]
                answer: "a football"
                hints: ["Which one rolls?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which 3-D shape is a toy cube?"
                say: "Look at the toy. All its faces are squares the same size. Which 3-D shape is it?"
                show: { object: cube }
                options: ["cube", "sphere", "square"]
                answer: "cube"
                hints: ["It is solid, and all its faces are squares."]
              - id: l2-s5
                type: sorting
                text: "Sort the things."
                say: "Does it roll or not roll? Sort the things."
                bins:
                  - { id: rolls, show: { text: "rolls" }, say: "Rolls." }
                  - { id: no, show: { text: "does not roll" }, say: "Does not roll." }
                options:
                  - { object: marble, bin: rolls }
                  - { object: ball, bin: rolls }
                  - { object: box, bin: no }
                  - { object: cube, bin: no }
                hints: ["Spheres roll. Shapes with flat faces stay put."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What 3-D shape is the marble?"
                say: "Look at the marble. What 3-D shape is it?"
                show: { object: marble }
                options: ["sphere", "cuboid", "cube"]
                answer: "sphere"
              - id: l2-n2
                type: multiple_choice
                text: "Which thing is a cuboid?"
                say: "Which of these things is a cuboid?"
                options: ["a cereal box", "a tennis ball", "an orange"]
                answer: "a cereal box"
              - id: l2-n3
                type: true_false
                text: "Is it true? A football is a cube."
                say: "A football is a cube. Is that true?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Which shape stacks best?"
                say: "You want to build a tall tower. Which shape stacks best?"
                options: ["cube", "sphere"]
                answer: "cube"
                feedback:
                  "sphere": "A tower of balls? It would roll away before you got to the top! Cubes have flat faces, so they stack."
              - id: l2-n5
                type: multiple_choice
                text: "Which thing is a cube?"
                say: "Which of these things is a cube?"
                options: ["a dice", "a ball", "a book"]
                answer: "a dice"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: name
            type: image_multiple_choice
            text: "Which one is the cuboid?"
            say: "Tap the cuboid."
            options:
              - { drawn: shape, kind: sphere, colour: purple }
              - { drawn: shape, kind: cuboid, colour: purple }
              - { drawn: shape, kind: cylinder, colour: purple }
            answer: "cuboid"
          - id: l2-c2
            part: around
            type: multiple_choice
            text: "What 3-D shape is a tennis ball?"
            say: "What 3-D shape is a tennis ball?"
            options: ["sphere", "cube", "circle"]
            answer: "sphere"
          - id: l2-c3
            part: props
            type: multiple_choice
            text: "All the faces of this shape are squares. What is it?"
            say: "All the faces of this solid shape are squares the same size. What is it?"
            options: ["a cube", "a sphere", "a square"]
            answer: "a cube"
          - id: l2-c4
            part: flat-solid
            type: multiple_choice
            text: "Kai says the box is a rectangle. What 3-D shape is it really?"
            say: "Kai says the cardboard box is a rectangle. What 3-D shape is it really?"
            show: { object: box }
            options: ["a cuboid", "a rectangle", "a sphere"]
            answer: "a cuboid"
          - id: l2-c5
            part: props
            type: true_false
            text: "Is it true? A sphere has a curved surface and no corners."
            say: "A sphere has a curved surface and no corners. Is that true?"
            answer: true
          - id: l2-c6
            part: name
            type: multiple_choice
            text: "What is this 3-D shape called?"
            say: "This is a solid shape. What is it called?"
            show: { drawn: shape, kind: cuboid, colour: red }
            options: ["cuboid", "rectangle", "sphere"]
            answer: "cuboid"
          - id: l2-c7
            part: name
            type: image_multiple_choice
            text: "A cube and a cuboid look alike. Which one is the cube?"
            say: "A cube and a cuboid look alike. Which one is the cube?"
            options:
              - { drawn: shape, kind: cuboid, colour: yellow }
              - { drawn: shape, kind: cube, colour: yellow }
              - { drawn: shape, kind: sphere, colour: yellow }
            answer: "cube"
          - id: l2-c8
            part: name
            type: true_false
            text: "Is it true? This shape is a cube."
            say: "This shape is a cube. Is that true?"
            show: { drawn: shape, kind: cuboid, colour: blue }
            answer: false
          - id: l2-c9
            part: name
            type: multiple_choice
            text: "A cube is a special kind of which 3-D shape?"
            say: "A cube is a special kind of which 3-D shape?"
            options: ["cuboid", "sphere", "square"]
            answer: "cuboid"
          - id: l2-c10
            part: props
            type: multiple_choice
            text: "How many flat faces does a cuboid have?"
            say: "How many flat faces does a cuboid have?"
            options: ["6", "4", "0"]
            answer: "6"
          - id: l2-c11
            part: props
            type: true_false
            text: "Is it true? A cuboid has a curved surface."
            say: "A cuboid has a curved surface. Is that true?"
            answer: false
          - id: l2-c12
            part: props
            type: multiple_choice
            text: "Which shape has 6 square faces?"
            say: "Which shape has six square faces?"
            options: ["cube", "sphere", "triangle"]
            answer: "cube"
          - id: l2-c13
            part: around
            type: multiple_choice
            text: "What 3-D shape is the beach ball?"
            say: "Look at the beach ball. What 3-D shape is it?"
            show: { object: beach-ball }
            options: ["sphere", "circle", "cuboid"]
            answer: "sphere"
          - id: l2-c14
            part: around
            type: multiple_choice
            text: "What 3-D shape is the cereal box?"
            say: "Look at the cereal box. What 3-D shape is it?"
            show: { object: cereal-box }
            options: ["cuboid", "sphere", "rectangle"]
            answer: "cuboid"
          - id: l2-c15
            part: around
            type: sorting
            text: "Sort the things: cube or sphere?"
            say: "Is it a cube or a sphere? Sort the things."
            bins:
              - { id: cube, show: { text: "cube" }, say: "Cube." }
              - { id: sphere, show: { text: "sphere" }, say: "Sphere." }
            options:
              - { object: dice, bin: cube }
              - { object: beach-ball, bin: sphere }
              - { object: orange, bin: sphere }
              - { object: marble, bin: sphere }
          - id: l2-c16
            part: around
            type: image_multiple_choice
            text: "Which thing is a sphere?"
            say: "Which of these things is a sphere?"
            options:
              - { object: dice }
              - { object: cereal-box }
              - { object: ball }
            answer: "ball"
          - id: l2-c17
            part: flat-solid
            type: multiple_choice
            text: "Mo says the dice is a square. What 3-D shape is it really?"
            say: "Mo says the dice is a square. What 3-D shape is it really?"
            show: { object: dice }
            options: ["a cube", "a square", "a sphere"]
            answer: "a cube"
          - id: l2-c18
            part: flat-solid
            type: true_false
            text: "Is it true? A circle is a 3-D shape."
            say: "A circle is a 3-D shape. Is that true?"
            answer: false
          - id: l2-c19
            part: flat-solid
            type: image_multiple_choice
            text: "Which one is a flat 2-D shape?"
            say: "Which one is a flat 2-D shape?"
