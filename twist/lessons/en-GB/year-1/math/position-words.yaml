# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.position-words
skill: math.space.position-words
curriculum: en-GB
language: en
title:
  de: Rechts, links, oben, unten
  en: Left, right, above and below
summary: >
  Lesson 1 uses left, right, next to and between on a row of shapes, read
  from where the child sits; lesson 2 uses above and below on a stack of
  shapes and in front of and behind in a queue, and ends with the skill
  check. In front of and behind are taught through short stories and
  pictures side by side, because no drawn component shows depth yet.
metadata:
  year: year-1
  topic: { de: Orientierung, en: Position and direction }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { en: [left, right, next to, between, above, below, on top, at the bottom, in front of, behind, first, last] }
  forms: [drawn, picture, text, audio]
  drawn: [shape]
  facets: []
  parts:
    - { id: left-right, what: { de: links und rechts in einer Reihe, en: left and right in a row } }
    - { id: between, what: { de: neben und zwischen, en: next to and between } }
    - { id: above-below, what: { de: "oben, unten, über und unter", en: "top, bottom, above and below" } }
    - { id: front-behind, what: { de: vor und hinter in einer Schlange, en: in front of and behind in a queue } }
  misconceptions:
    - id: left-right-swap
      what: Swaps left and right
      addressed: lesson 1 Learn ties left to where a row starts as we read; l1-f2 (with feedback), l1-s2, l1-n2 and l2-c1 ask for the shape on the left or right
    - id: next-to-only-one-side
      what: Thinks next to means only the right-hand side, or misses that between needs one thing on each side
      addressed: lesson 1 Learn shows a shape with a neighbour on each side; l1-f4 (with feedback), l1-s4 and l1-n4 ask what is between two shapes
    - id: above-means-top
      what: Reads above as at the very top, so names the top shape when asked what is just above another
      addressed: lesson 2 Learn shows a stack of three; l2-f2 (with feedback), l2-s2 and l2-n2 ask what is just above or below the middle shape
    - id: front-behind-swap
      what: Swaps in front of and behind in a queue
      addressed: lesson 2 Learn says the one in front is nearer the start of the queue; l2-f4 (with feedback), l2-s4 and l2-n4 ask who is in front or behind
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Links, rechts, zwischen", en: "Left, right and between" }
    goal:
      de: "Sag, wo etwas ist, mit links, rechts, neben und zwischen, so wie das Dreieck zwischen Kreis und Quadrat."
      en: "Say where things are with left, right, next to and between, like a triangle in the middle."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "left    right"
            say: "We read a row from the left to the right. The red circle is on the left. The blue square is on the right."
            show: { drawn: shape, row: [circle, square], colours: [red, blue] }
          - text: "The triangle is between the circle and the square."
            say: "Now there are three shapes. The yellow triangle is in the middle. It is between the circle and the square. It is next to the circle, and it is next to the square too."
            show: { drawn: shape, row: [circle, triangle, square], colours: [red, yellow, blue] }
          - text: "Next to means just beside."
            say: "Next to means just beside, on either side, with nothing in between. The circle is next to the triangle. The circle is not next to the square, because the triangle is in the way."
            show: { drawn: shape, row: [circle, triangle, square], colours: [red, yellow, blue] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which shape is on the left?"
                say: "Look at the two shapes. Which shape is on the left?"
                show: { drawn: shape, row: [triangle, circle], colours: [green, red] }
                options: ["triangle", "circle"]
                answer: "triangle"
                hints:
                  - "A row starts on the left, where we start reading."
                  - "Look at the first shape in the row."
                  - "The triangle is on the left."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which shape is on the right?"
                say: "Look at the three shapes. Which shape is on the right, at the end of the row?"
                show: { drawn: shape, row: [square, circle, triangle], colours: [blue, yellow, red] }
                options: ["triangle", "square", "circle"]
                answer: "triangle"
                feedback:
                  "square": "The square is on the left, where the row starts. The right is the other end."
                hints:
                  - "We read from left to right, so the right is at the end."
                  - "Look at the last shape in the row."
                  - "The triangle is on the right."
              - id: l1-f3
                type: multiple_choice
                text: "Which shape is next to the triangle?"
                say: "Which shape is next to the triangle?"
                show: { drawn: shape, row: [circle, square, triangle], colours: [blue, blue, blue] }
                options: ["square", "circle", "triangle"]
                answer: "square"
                hints:
                  - "Find the triangle first."
                  - "Next to means just beside it. The triangle is at the end, so look beside it."
                  - "The square."
              - id: l1-f4
                type: multiple_choice
                text: "What is between the circle and the triangle?"
                say: "What is between the circle and the triangle?"
                show: { drawn: shape, row: [circle, square, triangle], colours: [red, blue, red] }
                options: ["square", "circle", "triangle"]
                answer: "square"
                feedback:
                  "triangle": "The triangle is at one end. Between means in the middle of the two."
                hints:
                  - "Between means in the middle of two things."
                  - "Put one finger on the circle and one on the triangle. What is in the middle?"
                  - "The square."
              - id: l1-f5
                type: true_false
                text: "Is it true? The circle is on the right of the square."
                say: "The circle is on the right of the square. Is that true?"
                show: { drawn: shape, row: [square, circle], colours: [yellow, purple] }
                answer: true
                hints:
                  - "Which shape is first in the row?"
                  - "The square comes first, on the left."
                  - "Yes, the circle is on the right."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which shape is on the left?"
                say: "Which shape is on the left?"
                show: { drawn: shape, row: [square, triangle], colours: [red, blue] }
                options: ["square", "triangle"]
                answer: "square"
                hints: ["The left is where the row starts."]
              - id: l1-s2
                type: multiple_choice
                text: "Which shape is on the right?"
                say: "Which shape is on the right?"
                show: { drawn: shape, row: [circle, triangle, square], colours: [green, green, green] }
                options: ["square", "circle", "triangle"]
                answer: "square"
                hints: ["The right is at the end of the row."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Look at the row. Fill the gap with the right word."
                show: { drawn: shape, row: [triangle, circle], colours: [blue, red] }
                frame: "The circle is on the _ of the triangle."
                options: ["left", "right"]
                answer: ["right"]
                hints: ["Which shape comes first in the row?"]
              - id: l1-s4
                type: multiple_choice
                text: "What is between the two squares?"
                say: "What is between the two squares?"
                show: { drawn: shape, row: [square, triangle, square], colours: [blue, yellow, blue] }
                options: ["triangle", "circle", "nothing"]
                answer: "triangle"
                hints: ["Look in the middle of the two squares."]
              - id: l1-s5
                type: true_false
                text: "Is it true? The circle is next to the square."
                say: "The circle is next to the square. Is that true?"
                show: { drawn: shape, row: [circle, triangle, square], colours: [red, yellow, blue] }
                answer: false
                hints: ["Is anything in the way?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which colour is the shape on the left?"
                say: "Which colour is the shape on the left?"
                show: { drawn: shape, row: [circle, circle, circle], colours: [green, red, blue] }
                options: ["green", "red", "blue"]
                answer: "green"
              - id: l1-n2
                type: multiple_choice
                text: "Which colour is the shape on the right?"
                say: "Which colour is the shape on the right?"
                show: { drawn: shape, row: [square, square, square], colours: [yellow, blue, red] }
                options: ["red", "yellow", "blue"]
                answer: "red"
              - id: l1-n3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Look at the row. Fill the gap with the right word."
                show: { drawn: shape, row: [square, circle], colours: [red, blue] }
                frame: "The square is on the _ of the circle."
                options: ["left", "right"]
                answer: ["left"]
              - id: l1-n4
                type: multiple_choice
                text: "What is between the triangle and the square?"
                say: "What is between the triangle and the square?"
                show: { drawn: shape, row: [triangle, circle, square], colours: [blue, green, red] }
                options: ["circle", "triangle", "square"]
                answer: "circle"
              - id: l1-n5
                type: multiple_choice
                text: "Which shape is next to the red circle?"
                say: "Which shape is next to the red circle?"
                show: { drawn: shape, row: [circle, triangle], colours: [red, yellow] }
                options: ["triangle", "square", "circle"]
                answer: "triangle"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which shape is on the left?"
            say: "Which shape is on the left?"
            show: { drawn: shape, row: [circle, square], colours: [blue, blue] }
            options: ["circle", "square"]
            answer: "circle"
          - id: l1-c2
            type: multiple_choice
            text: "What is between the circle and the square?"
            say: "What is between the circle and the square?"
            show: { drawn: shape, row: [circle, triangle, square], colours: [green, red, blue] }
            options: ["triangle", "circle", "square"]
            answer: "triangle"
          - id: l1-c3
            type: true_false
            text: "Is it true? The triangle is on the left of the square."
            say: "The triangle is on the left of the square. Is that true?"
            show: { drawn: shape, row: [square, triangle], colours: [red, green] }
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Which shape is on the right?"
            say: "Which shape is on the right?"
            show: { drawn: shape, row: [square, triangle, circle], colours: [purple, purple, purple] }
            options: ["circle", "square", "triangle"]
            answer: "circle"
          - id: l1-c5
            type: true_false
            text: "Is it true? The square is next to the circle."
            say: "The square is next to the circle. Is that true?"
            show: { drawn: shape, row: [square, circle, triangle], colours: [red, blue, green] }
            answer: true
          - id: l1-c6
            type: fill_in_blank
            text: "Fill the gap."
            say: "Look at the row. Fill the gap with the right words."
            show: { drawn: shape, row: [circle, triangle, square], colours: [yellow, red, blue] }
            frame: "The triangle is _ the circle and the square."
            options: ["between", "on the left of"]
            answer: ["between"]

  - n: 2
    title: { de: "Oben, unten, vor, hinter", en: "Above, below, in front of, behind" }
    goal:
      de: "Sag, wo etwas ist, mit über, unter, vor und hinter, so wie in einer Schlange vor der Rutsche."
      en: "Say where things are with above, below, in front of and behind, like in a queue for the slide."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which shape is on the right?"
            say: "Which shape is on the right?"
            show: { drawn: shape, row: [triangle, square], colours: [yellow, purple] }
            options: ["square", "triangle"]
            answer: "square"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is between the two circles?"
            say: "What is between the two circles?"
            show: { drawn: shape, row: [circle, square, circle], colours: [red, green, red] }
            options: ["square", "circle", "triangle"]
            answer: "square"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "top, middle, bottom"
            say: "Here the shapes are in a stack, one on top of another. The circle is at the top. The square is at the bottom. The triangle is in the middle."
            show: { drawn: shape, column: [circle, triangle, square], colours: [red, yellow, blue] }
          - text: "The circle is above the triangle. The square is below the triangle."
            say: "Above means higher up. The circle is above the triangle. Below means lower down. The square is below the triangle."
            show: { drawn: shape, column: [circle, triangle, square], colours: [red, yellow, blue] }
          - text: "Ali is in front of Ben. Cara is behind Ben."
            say: "Three children wait in a queue for the slide. Ali is first. Ben is next. Cara is last. Ali is in front of Ben, nearer the slide. Cara is behind Ben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which shape is at the top?"
                say: "Look at the stack. Which shape is at the top?"
                show: { drawn: shape, column: [triangle, circle, square], colours: [green, red, blue] }
                options: ["triangle", "circle", "square"]
                answer: "triangle"
                hints:
                  - "The top is the highest place."
                  - "Look at the first shape in the stack."
                  - "The triangle."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which shape is just below the circle?"
                say: "Which shape is just below the circle?"
                show: { drawn: shape, column: [square, circle, triangle], colours: [blue, red, yellow] }
                options: ["triangle", "square", "circle"]
                answer: "triangle"
                feedback:
                  "square": "The square is above the circle, higher up. Below means lower down."
                hints:
                  - "Find the circle first."
                  - "Below means lower down. Look under the circle."
                  - "The triangle."
              - id: l2-f3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Look at the stack. Fill the gap with the right word."
                show: { drawn: shape, column: [square, triangle], colours: [purple, green] }
                frame: "The square is _ the triangle."
                options: ["above", "below"]
                answer: ["above"]
                hints:
                  - "Which shape is higher up?"
                  - "The square is at the top."
                  - "The square is above the triangle."
              - id: l2-f4
                type: multiple_choice
                text: "Jo, Sam and Kit wait for the bus. Jo is first, Sam is next, Kit is last. Who is just behind Jo?"
                say: "Jo, Sam and Kit wait in a queue for the bus. Jo is first, Sam is next, and Kit is last. Who is just behind Jo?"
                options: ["Sam", "Kit", "nobody"]
                answer: "Sam"
                feedback:
                  "nobody": "Jo is at the front, so nobody is in front of Jo. Behind Jo is the next one in the queue."
                hints:
                  - "Behind means after, further from the front of the queue."
                  - "Who comes straight after Jo?"
                  - "Sam."
              - id: l2-f5
                type: true_false
                text: "Is it true? The circle is below the square."
                say: "The circle is below the square. Is that true?"
                show: { drawn: shape, column: [circle, square], colours: [red, blue] }
                answer: false
                hints:
                  - "Which shape is at the top?"
                  - "The circle is at the top, so it is higher up."
                  - "No. The circle is above the square."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which shape is at the bottom?"
                say: "Which shape is at the bottom of the stack?"
                show: { drawn: shape, column: [circle, square, triangle], colours: [green, green, green] }
                options: ["triangle", "circle", "square"]
                answer: "triangle"
                hints: ["The bottom is the lowest place."]
              - id: l2-s2
                type: multiple_choice
                text: "Which shape is just above the square?"
                say: "Which shape is just above the square?"
                show: { drawn: shape, column: [triangle, circle, square], colours: [red, yellow, blue] }
                options: ["circle", "triangle", "square"]
                answer: "circle"
                hints: ["Just above means on top of it, with nothing in between."]
              - id: l2-s3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Look at the stack. Fill the gap with the right word."
                show: { drawn: shape, column: [circle, triangle], colours: [blue, orange] }
                frame: "The triangle is _ the circle."
                options: ["above", "below"]
                answer: ["below"]
                hints: ["Which shape is lower down?"]
              - id: l2-s4
                type: multiple_choice
                text: "Ella, Finn and Gus wait for lunch. Ella is first, Finn is next, Gus is last. Who is just in front of Gus?"
                say: "Ella, Finn and Gus wait in a queue for lunch. Ella is first, Finn is next, and Gus is last. Who is just in front of Gus?"
                options: ["Finn", "Ella", "nobody"]
                answer: "Finn"
                hints: ["In front means nearer the start of the queue."]
              - id: l2-s5
                type: true_false
                text: "Is it true? The square is between the circle and the triangle."
                say: "The square is between the circle and the triangle. Is that true?"
                show: { drawn: shape, column: [circle, square, triangle], colours: [red, blue, yellow] }
                answer: true
                hints: ["Look in the middle of the stack."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which colour is the shape at the top?"
                say: "Which colour is the shape at the top?"
                show: { drawn: shape, column: [square, square, square], colours: [purple, red, yellow] }
                options: ["purple", "red", "yellow"]
                answer: "purple"
              - id: l2-n2
                type: multiple_choice
                text: "Which shape is just below the triangle?"
                say: "Which shape is just below the triangle?"
                show: { drawn: shape, column: [circle, triangle, square], colours: [blue, green, red] }
                options: ["square", "circle", "triangle"]
                answer: "square"
              - id: l2-n3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Look at the stack. Fill the gap with the right word."
                show: { drawn: shape, column: [triangle, square], colours: [yellow, blue] }
                frame: "The square is _ the triangle."
                options: ["above", "below"]
                answer: ["below"]
              - id: l2-n4
                type: multiple_choice
                text: "Max, Lily and Ravi wait for the slide. Max is first, Lily is next, Ravi is last. Who is just behind Lily?"
                say: "Max, Lily and Ravi wait in a queue for the slide. Max is first, Lily is next, and Ravi is last. Who is just behind Lily?"
                options: ["Ravi", "Max", "nobody"]
                answer: "Ravi"
              - id: l2-n5
                type: multiple_choice
                text: "The book is on the shelf. The ball is on the floor, under the shelf. Where is the ball?"
                say: "The book is on the shelf. The ball is on the floor, under the shelf. Where is the ball?"
                options: ["below the book", "above the book", "next to the book"]
                answer: "below the book"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: left-right
            type: multiple_choice
            text: "Which colour is the shape on the right?"
            say: "Which colour is the shape on the right?"
            show: { drawn: shape, row: [triangle, triangle, triangle], colours: [blue, yellow, green] }
            options: ["green", "blue", "yellow"]
            answer: "green"
          - id: l2-c2
            part: between
            type: multiple_choice
            text: "What is between the square and the triangle?"
            say: "What is between the square and the triangle?"
            show: { drawn: shape, row: [square, circle, triangle], colours: [red, purple, blue] }
            options: ["circle", "square", "triangle"]
            answer: "circle"
          - id: l2-c3
            part: above-below
            type: multiple_choice
            text: "Which shape is just above the triangle?"
            say: "Which shape is just above the triangle?"
            show: { drawn: shape, column: [square, circle, triangle], colours: [blue, yellow, red] }
            options: ["circle", "square", "triangle"]
            answer: "circle"
          - id: l2-c4
            part: front-behind
            type: multiple_choice
            text: "Zoe, Amir and Nell wait for ice cream. Zoe is first, Amir is next, Nell is last. Who is just in front of Amir?"
            say: "Zoe, Amir and Nell wait in a queue for ice cream. Zoe is first, Amir is next, and Nell is last. Who is just in front of Amir?"
            options: ["Zoe", "Nell", "nobody"]
            answer: "Zoe"
          - id: l2-c5
            part: left-right
            type: true_false
            text: "Is it true? The square is on the left of the circle."
            say: "The square is on the left of the circle. Is that true?"
            show: { drawn: shape, row: [square, circle], colours: [green, orange] }
            answer: true
          - id: l2-c6
            part: left-right
            type: multiple_choice
            text: "Which shape is on the left?"
            say: "Which shape is on the left?"
            show: { drawn: shape, row: [triangle, square, circle], colours: [red, red, red] }
            options: ["circle", "triangle", "square"]
            answer: "triangle"
          - id: l2-c7
            part: left-right
            type: true_false
            text: "Is it true? The triangle is on the left of the circle."
            say: "The triangle is on the left of the circle. Is that true?"
            show: { drawn: shape, row: [circle, square, triangle], colours: [red, green, blue] }
            answer: false
          - id: l2-c8
            part: left-right
            type: multiple_choice
            text: "What is on the right of the square?"
            say: "What is on the right of the square?"
            show: { drawn: shape, row: [circle, square, triangle], colours: [red, blue, yellow] }
            options: ["triangle", "circle", "nothing"]
            answer: "triangle"
          - id: l2-c9
            part: between
            type: true_false
            text: "Is it true? The square is next to the triangle."
            say: "The square is next to the triangle. Is that true?"
            show: { drawn: shape, row: [square, triangle, circle], colours: [green, blue, red] }
            answer: true
          - id: l2-c10
            part: between
            type: multiple_choice
            text: "Which colour is the shape between the two circles?"
            say: "Which colour is the shape between the two circles?"
            show: { drawn: shape, row: [circle, triangle, circle], colours: [blue, orange, blue] }
            options: ["orange", "blue", "red"]
            answer: "orange"
          - id: l2-c11
            part: between
            type: multiple_choice
            text: "Which shape is not next to the square?"
            say: "Which shape is not next to the square?"
            show: { drawn: shape, row: [triangle, circle, square], colours: [yellow, green, purple] }
            options: ["triangle", "circle"]
            answer: "triangle"
          - id: l2-c12
            part: between
            type: true_false
            text: "Is it true? The circle is between the square and the triangle."
            say: "The circle is between the square and the triangle. Is that true?"
            show: { drawn: shape, row: [circle, square, triangle], colours: [red, yellow, blue] }
            answer: false
          - id: l2-c13
            part: above-below
            type: fill_in_blank
            text: "Fill the gap."
            say: "Look at the stack. Fill the gap with the right word."
            show: { drawn: shape, column: [circle, triangle, square], colours: [green, blue, red] }
            frame: "The square is at the _."
            options: ["top", "middle", "bottom"]
            answer: ["bottom"]
          - id: l2-c14
            part: above-below
            type: multiple_choice
            text: "Which colour is the shape just above the circle?"
            say: "Which colour is the shape just above the circle?"
            show: { drawn: shape, column: [square, triangle, circle], colours: [red, green, blue] }
            options: ["green", "red", "blue"]
            answer: "green"
          - id: l2-c15
            part: above-below
            type: true_false
            text: "Is it true? The triangle is above the circle."
            say: "The triangle is above the circle. Is that true?"
            show: { drawn: shape, column: [square, circle, triangle], colours: [yellow, red, blue] }
            answer: false
          - id: l2-c16
            part: above-below
            type: multiple_choice
            text: "Which shape is in the middle of the stack?"
            say: "Which shape is in the middle of the stack?"
            show: { drawn: shape, column: [triangle, square, circle], colours: [purple, orange, green] }
            options: ["square", "triangle", "circle"]
            answer: "square"
          - id: l2-c17
            part: front-behind
