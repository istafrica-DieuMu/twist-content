# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.number-line-to-100
skill: math.numbers-to-100.number-line
curriculum: en-GB
language: en
title:
  de: Zahlenstrahl bis 100
  en: Number lines to 100
summary: >
  Lesson 1 finds and reads the tens on a 0 to 100 number line and then
  numbers on a section of the line where only the tens are labelled
  (count on from the ten before); lesson 2 reads the arrow on longer
  lines with the halfway tick at five, marks numbers on sections, finds
  the neighbouring tens, and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.read-write]
  also_practises: [math.numbers-to-100.tens]
  vocabulary: { en: [number line, tick, arrow, tens, between, halfway, before, after] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: []
  parts:
    - { id: tens, what: { de: Zehnerzahlen am Zahlenstrahl von 0 bis 100 finden und ablesen, en: finding and reading tens on a number line from 0 to 100 } }
    - { id: mark, what: { de: Zahlen auf einem Stück des Zahlenstrahls eintragen, en: marking numbers on a section of the number line } }
    - { id: read, what: { de: "ablesen, wohin der Pfeil zeigt", en: reading the number an arrow points to } }
    - { id: between, what: { de: "sagen, zwischen welchen Zehnerzahlen eine Zahl liegt", en: saying which tens a number lies between } }
  misconceptions:
    - id: count-from-zero
      what: Counts every small tick from 0 instead of starting at the nearest labelled ten
      addressed: lesson 1 Learn starts at the ten before the number; the hints in l1-f3, l1-f4 and l2-f1 say to start at the ten before
    - id: tick-is-ten
      what: Thinks each small tick is ten because the labels go in tens
      addressed: lesson 1 Learn counts the ticks between 40 and 50 one by one; l1-f4 (with feedback), l1-s4 and l2-n2 offer a number one ten too far
    - id: wrong-side-of-ten
      what: Reads a number just before a ten as just after it (39 read as 41)
      addressed: lesson 2 Learn shows 38 and 42 either side of 40; l2-f2 (with feedback), l2-s2 and l2-c3 put the arrow just before a ten
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zehner und Striche", en: "Tens and ticks" }
    goal:
      de: "Finde Zahlen bis 100 auf dem Zahlenstrahl, so wie 46 ist 6 Striche nach der 40."
      en: "Find numbers to 100 on a number line, like 46 is 6 ticks after 40."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Write the number you hear."
            say: "Forty-seven. Write the number."
            answer: "47"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "sixty-two"
            say: "Read the number word. Which number is it?"
            options: ["62", "26", "602"]
            answer: "62"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "0, 10, 20 ... 100"
            say: "This number line goes from zero to one hundred. Each tick is a ten: ten, twenty, thirty, all the way to one hundred."
            show: { drawn: number-line, from: 0, to: 100, labels: all, step: 10 }
          - text: "40, 41, 42 ... 50"
            say: "Now we zoom in between forty and fifty. Only the tens have labels. Each small tick is one more: forty-one, forty-two, forty-three, up to fifty."
            show: { drawn: number-line, from: 40, to: 50, labels: ends }
          - text: "Start at the ten before."
            say: "To find forty-six, do not count from zero. Start at forty, the ten before, and count on six ticks: forty-one, forty-two, forty-three, forty-four, forty-five, forty-six."
            show: { drawn: number-line, from: 40, to: 50, labels: ends, mark: 46 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_line
                text: "Where is 60?"
                say: "Tap where sixty goes on the number line."
                show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
                answer: 60
                hints:
                  - "Each tick is a ten. Count in tens from zero."
                  - "Ten, twenty, thirty, forty, fifty ..."
                  - "Sixty is the sixth tick after zero."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which number does the arrow point to?"
                say: "Count in tens. Which number does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10, mark: 30 }
                options: ["30", "3", "40"]
                answer: "30"
                hints:
                  - "Each tick is ten."
                  - "Count the ticks from zero in tens."
                  - "30."
              - id: l1-f3
                type: point_on_line
                text: "Where is 23?"
                say: "Tap where twenty-three goes."
                show: { drawn: number-line, from: 20, to: 30, labels: ends }
                answer: 23
                hints:
                  - "Start at the ten before: twenty."
                  - "Count on three ticks: twenty-one, twenty-two ..."
                  - "Twenty-three is the third tick after twenty."
              - id: l1-f4
                type: multiple_choice
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to?"
                show: { drawn: number-line, from: 70, to: 80, labels: ends, mark: 74 }
                options: ["74", "110", "84"]
                answer: "74"
                feedback:
                  "110": "Each small tick is one, not ten. Count on from seventy: seventy-one, seventy-two, seventy-three, seventy-four."
                  "84": "The arrow is between seventy and eighty, so the number is in the seventies."
                hints:
                  - "Start at the ten before: seventy."
                  - "Each small tick is one more."
                  - "74."
              - id: l1-f5
                type: true_false
                text: "Is it true? The arrow points to 57."
                say: "The arrow points to fifty-seven. Is that true?"
                show: { drawn: number-line, from: 50, to: 60, labels: ends, mark: 57 }
                answer: true
                hints:
                  - "Start at fifty."
                  - "Count the ticks to the arrow."
                  - "Yes, it is 57."

          - support: some
            tasks:
              - id: l1-s1
                type: point_on_line
                text: "Where is 90?"
                say: "Tap where ninety goes."
                show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
                answer: 90
                hints: ["Ninety is one ten before one hundred."]
              - id: l1-s2
                type: multiple_choice
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to?"
                show: { drawn: number-line, from: 30, to: 40, labels: ends, mark: 32 }
                options: ["32", "23", "38"]
                answer: "32"
                hints: ["Start at thirty and count on."]
              - id: l1-s3
                type: point_on_line
                text: "Where is 68?"
                say: "Tap where sixty-eight goes."
                show: { drawn: number-line, from: 60, to: 70, labels: ends }
                answer: 68
                hints: ["Sixty-eight is two before seventy."]
              - id: l1-s4
                type: multiple_choice
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to?"
                show: { drawn: number-line, from: 10, to: 20, labels: ends, mark: 15 }
                options: ["15", "60", "25"]
                answer: "15"
                hints: ["Each small tick is one, not ten."]
              - id: l1-s5
                type: true_false
                text: "Is it true? The arrow points to 50."
                say: "The arrow points to fifty. Is that true?"
                show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10, mark: 40 }
                answer: false
                hints: ["Count in tens from zero."]

          - support: none
            tasks:
              - id: l1-n1
                type: point_on_line
                text: "Where is 20?"
                say: "Tap where twenty goes."
                show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
                answer: 20
              - id: l1-n2
                type: point_on_line
                text: "Where is 84?"
                say: "Tap where eighty-four goes."
                show: { drawn: number-line, from: 80, to: 90, labels: ends }
                answer: 84
              - id: l1-n3
                type: multiple_choice
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to?"
                show: { drawn: number-line, from: 40, to: 50, labels: ends, mark: 49 }
                options: ["49", "41", "94"]
                answer: "49"
              - id: l1-n4
                type: multiple_choice
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10, mark: 70 }
                options: ["70", "7", "60"]
                answer: "70"
              - id: l1-n5
                type: text_input
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to? Write it."
                show: { drawn: number-line, from: 90, to: 100, labels: ends, mark: 96 }
                answer: "96"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: point_on_line
            text: "Where is 80?"
            say: "Tap where eighty goes."
            show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
            answer: 80
          - id: l1-c2
            type: point_on_line
            text: "Where is 35?"
            say: "Tap where thirty-five goes."
            show: { drawn: number-line, from: 30, to: 40, labels: ends }
            answer: 35
          - id: l1-c3
            type: multiple_choice
            text: "Which number does the arrow point to?"
            say: "Which number does the arrow point to?"
            show: { drawn: number-line, from: 60, to: 70, labels: ends, mark: 61 }
            options: ["61", "16", "71"]
            answer: "61"
          - id: l1-c4
            type: point_on_line
            text: "Where is 70?"
            say: "Tap where seventy goes."
            show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
            answer: 70
          - id: l1-c5
            type: multiple_choice
            text: "Which number does the arrow point to?"
            say: "Which number does the arrow point to?"
            show: { drawn: number-line, from: 50, to: 60, labels: ends, mark: 53 }
            options: ["53", "35", "63"]
            answer: "53"
          - id: l1-c6
            type: true_false
            text: "Is it true? The arrow points to 88."
            say: "The arrow points to eighty-eight. Is that true?"
            show: { drawn: number-line, from: 80, to: 90, labels: ends, mark: 88 }
            answer: true

  - n: 2
    title: { de: "Längere Abschnitte", en: "Longer stretches" }
    goal:
      de: "Nutze die Zehner links und rechts, um eine Zahl zu finden, so wie 45 liegt genau zwischen 40 und 50."
      en: "Use the tens on each side to place a number, like 45 is halfway between 40 and 50."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: point_on_line
            text: "Where is 50?"
            say: "Tap where fifty goes."
            show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
            answer: 50
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which number does the arrow point to?"
            say: "Which number does the arrow point to?"
            show: { drawn: number-line, from: 20, to: 30, labels: ends, mark: 27 }
            options: ["27", "72", "37"]
            answer: "27"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "30 ... 40 ... 50"
            say: "This line goes from thirty to fifty, and the tens are labelled. The longer tick halfway between two tens is five more: halfway between thirty and forty is thirty-five."
            show: { drawn: number-line, from: 30, to: 50, labels: tens, mark: 35 }
          - text: "38 is before 40. 42 is after 40."
            say: "Look carefully at which side of the ten the arrow is. Thirty-eight is two before forty. Forty-two is two after forty."
            show: { drawn: number-line, from: 30, to: 50, labels: tens, mark: 38 }
          - text: "The neighbouring tens of 47: 40 and 50"
            say: "Forty-seven is between forty and fifty. Forty is the ten before. Fifty is the ten after. They are its neighbouring tens."
            show: { drawn: number-line, from: 40, to: 50, labels: ends, mark: 47 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: point_on_line
                text: "Where is 45?"
                say: "Tap where forty-five goes. It is halfway between two tens."
                show: { drawn: number-line, from: 30, to: 50, labels: tens }
                answer: 45
                hints:
                  - "Start at the ten before: forty."
                  - "Forty-five is halfway between forty and fifty."
                  - "Tap the longer tick in the middle between 40 and 50."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to?"
                show: { drawn: number-line, from: 50, to: 70, labels: tens, mark: 59 }
                options: ["59", "61", "69"]
                answer: "59"
                feedback:
                  "61": "The arrow is just before sixty, not just after it. One before sixty is fifty-nine."
                hints:
                  - "Is the arrow before or after sixty?"
                  - "It is one tick before sixty."
                  - "59."
              - id: l2-f3
                type: fill_in_blank
                text: "Which two tens is 63 between?"
                say: "Which two tens is sixty-three between?"
                frame: "_ , 63, _"
                options: ["50", "60", "70", "80"]
                answer: ["60", "70"]
                hints:
                  - "Sixty-three has six tens."
                  - "The ten before is sixty."
                  - "60 and 70."
              - id: l2-f4
                type: point_on_line
                text: "Where is 72?"
                say: "Tap where seventy-two goes."
                show: { drawn: number-line, from: 60, to: 80, labels: tens }
                answer: 72
                hints:
                  - "Find seventy first."
                  - "Then count on two ticks."
                  - "Two ticks after 70."
              - id: l2-f5
                type: true_false
                text: "Is it true? The arrow points to 85."
                say: "The arrow points to eighty-five. Is that true?"
                show: { drawn: number-line, from: 80, to: 100, labels: tens, mark: 85 }
                answer: true
                hints:
                  - "Where is the halfway tick between 80 and 90?"
                  - "Halfway is five more than eighty."
                  - "Yes, it is 85."

          - support: some
            tasks:
              - id: l2-s1
                type: point_on_line
                text: "Where is 25?"
                say: "Tap where twenty-five goes."
                show: { drawn: number-line, from: 10, to: 30, labels: tens }
                answer: 25
                hints: ["Halfway between twenty and thirty."]
              - id: l2-s2
                type: multiple_choice
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to?"
                show: { drawn: number-line, from: 70, to: 90, labels: tens, mark: 79 }
                options: ["79", "81", "89"]
                answer: "79"
                hints: ["Is the arrow before or after eighty?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Which two tens is 28 between?"
                say: "Which two tens is twenty-eight between?"
                frame: "_ , 28, _"
                options: ["10", "20", "30", "40"]
                answer: ["20", "30"]
                hints: ["Twenty-eight has two tens."]
              - id: l2-s4
                type: point_on_line
                text: "Where is 91?"
                say: "Tap where ninety-one goes."
                show: { drawn: number-line, from: 80, to: 100, labels: tens }
                answer: 91
                hints: ["One tick after ninety."]
              - id: l2-s5
                type: true_false
                text: "Is it true? The arrow points to 42."
                say: "The arrow points to forty-two. Is that true?"
                show: { drawn: number-line, from: 30, to: 50, labels: tens, mark: 38 }
                answer: false
                hints: ["Is the arrow before or after forty?"]

          - support: none
            tasks:
              - id: l2-n1
                type: point_on_line
                text: "Where is 55?"
                say: "Tap where fifty-five goes."
                show: { drawn: number-line, from: 40, to: 60, labels: tens }
                answer: 55
              - id: l2-n2
                type: multiple_choice
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to?"
                show: { drawn: number-line, from: 10, to: 30, labels: tens, mark: 13 }
                options: ["13", "40", "23"]
                answer: "13"
              - id: l2-n3
                type: fill_in_blank
                text: "Which two tens is 86 between?"
                say: "Which two tens is eighty-six between?"
                frame: "_ , 86, _"
                options: ["70", "80", "90", "100"]
                answer: ["80", "90"]
              - id: l2-n4
                type: point_on_line
                text: "Where is 39?"
                say: "Tap where thirty-nine goes."
                show: { drawn: number-line, from: 20, to: 40, labels: tens }
                answer: 39
              - id: l2-n5
                type: text_input
                text: "Which number does the arrow point to?"
                say: "Which number does the arrow point to? Write it."
                show: { drawn: number-line, from: 50, to: 70, labels: tens, mark: 66 }
                answer: "66"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: tens
            type: point_on_line
            text: "Where is 40?"
            say: "Tap where forty goes."
            show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
            answer: 40
          - id: l2-c2
            part: mark
            type: point_on_line
            text: "Where is 17?"
            say: "Tap where seventeen goes."
            show: { drawn: number-line, from: 10, to: 20, labels: ends }
            answer: 17
          - id: l2-c3
            part: read
            type: multiple_choice
            text: "Which number does the arrow point to?"
            say: "Which number does the arrow point to?"
            show: { drawn: number-line, from: 80, to: 100, labels: tens, mark: 89 }
            options: ["89", "91", "99"]
            answer: "89"
          - id: l2-c4
            part: between
            type: fill_in_blank
            text: "Which two tens is 54 between?"
            say: "Which two tens is fifty-four between?"
            frame: "_ , 54, _"
            options: ["40", "50", "60", "70"]
            answer: ["50", "60"]
          - id: l2-c5
            part: mark
            type: point_on_line
            text: "Where is 65?"
            say: "Tap where sixty-five goes."
            show: { drawn: number-line, from: 50, to: 70, labels: tens }
            answer: 65
          - id: l2-c6
            part: tens
            type: point_on_line
            text: "Where is 10?"
            say: "Tap where ten goes."
            show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
            answer: 10
          - id: l2-c7
            part: tens
            type: text_input
            text: "Which number does the arrow point to?"
            say: "Which number does the arrow point to? Write it."
            show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10, mark: 60 }
            answer: "60"
          - id: l2-c8
            part: tens
            type: true_false
            text: "Is it true? The arrow points to 80."
            say: "The arrow points to eighty. Is that true?"
            show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10, mark: 80 }
            answer: true
          - id: l2-c9
            part: tens
            type: point_on_line
            text: "Where is 30?"
            say: "Tap where thirty goes."
            show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
            answer: 30
          - id: l2-c10
            part: mark
            type: point_on_line
            text: "Where is 42?"
            say: "Tap where forty-two goes."
            show: { drawn: number-line, from: 40, to: 50, labels: ends }
