# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.mult-meaning
skill: math.mult-div.mult-meaning
curriculum: en-GB
language: en
title:
  de: Malaufgaben verstehen
  en: Equal groups and multiplying
summary: >
  Lesson 1 spots equal groups (rows of counters, groups of things) and
  tells them from unequal ones, and counts them in twos, fives and tens;
  lesson 2 writes the repeated addition as a multiplication, 4 + 4 + 4 =
  3 × 4, read as three groups of four, matches arrays to their
  multiplication, works out small stories, and ends with the skill check.
metadata:
  year: year-1
  topic: { de: Malaufgaben, en: Multiplication }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.sequences, math.add-sub-to-20.fluency-to-20]
  also_practises: [math.numbers-to-100.sequences]
  vocabulary: { en: [equal groups, group of, lots of, row, array, add, repeated addition, multiply, times, multiplication] }
  forms: [drawn, picture, text, audio]
  drawn: [dots]
  facets: [operation-signs]
  parts:
    - { id: equal-groups, what: { de: gleich große Gruppen erkennen, en: spotting equal groups } }
    - { id: add-to-times, what: { de: Plusaufgaben mit gleichen Zahlen und Malaufgaben einander zuordnen, en: matching repeated additions and multiplications } }
    - { id: write-times, what: { de: zu Punktefeldern und Gruppen die Malaufgabe schreiben, en: writing the multiplication for an array or for groups } }
    - { id: result, what: { de: "ausrechnen, wie viele es zusammen sind", en: working out how many altogether } }
  misconceptions:
    - id: unequal-groups
      what: Calls any set of groups equal, or writes 3 + 4 + 4 as a multiplication
      addressed: lesson 1 Learn shows groups of 3, 4 and 4 as not equal; l1-f2 (with feedback), l1-s2, l1-n2 and l2-c4 ask whether groups are equal
    - id: add-the-numbers
      what: Adds the number of groups and the size of a group (3 groups of 4 is 7)
      addressed: lesson 1 Learn counts 3 groups of 4 as 4, 8, 12; l1-f4 (with feedback), l1-s4 and l2-f3 offer the sum of the two numbers
    - id: groups-and-size-mixed
      what: Writes the group size first and the number of groups second, so 5 + 5 becomes 5 × 2 and loses which is the group
      addressed: lesson 2 Learn reads 3 × 4 as three groups of four; l2-f2 (with feedback), l2-s2 and l2-n2 ask how many groups and how many in each before writing the multiplication
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gleich große Gruppen", en: "Equal groups" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "5 + 5 + 5 = _"
            say: "Five add five add five."
            answer: "15"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Count in twos."
            say: "Count in twos. Fill the gaps."
            frame: "2, 4, 6, _, _"
            options: ["7", "8", "10", "9"]
            answer: ["8", "10"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 rows of 4"
            say: "Here are three rows of counters. There are four counters in each row. All the rows are the same size. They are equal groups."
            show: { drawn: dots, array: [3, 4] }
          - text: "4, 8, 12"
            say: "We can count equal groups in fours: four, eight, twelve. Three groups of four make twelve."
            show: { drawn: dots, array: [3, 4] }
          - text: "3, 4, 4: not equal"
            say: "Careful. Here one group has three and two groups have four. These groups are not equal. Equal groups all have the same number."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many rows? How many in each row?"
                say: "Look at the counters. How many rows are there, and how many counters are in each row?"
                show: { drawn: dots, array: [2, 5] }
                options: ["2 rows of 5", "5 rows of 2", "2 rows of 2"]
                answer: "2 rows of 5"
                hints:
                  - "Count the rows first, from top to bottom."
                  - "Two rows. Now count the counters in one row."
                  - "2 rows of 5."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Are these groups equal? 2 apples, 2 apples, 3 apples"
                say: "Tom puts apples in three bowls: two, two and three. Are the groups equal?"
                answer: false
                feedback:
                  "true": "One bowl has three apples, the others have two. Equal groups all have the same number."
                hints:
                  - "Look at how many are in each group."
                  - "Two, two and three. Are they all the same?"
                  - "No. One group has 3, so they are not equal."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which picture shows equal groups?"
                say: "Which picture shows equal groups?"
                options:
                  - { drawn: dots, array: [3, 2] }
                  - { drawn: dots, groups: [4, 2] }
                  - { drawn: dots, groups: [5, 3] }
                answer: "3x2"
                hints:
                  - "Check each row of counters."
                  - "In equal groups every row has the same number."
                  - "The picture with three rows of 2."
              - id: l1-f4
                type: multiple_choice
                text: "3 groups of 5. How many altogether?"
                say: "There are three groups with five in each group. How many are there altogether?"
                show: { drawn: dots, array: [3, 5] }
                options: ["15", "8", "5"]
                answer: "15"
                feedback:
                  "8": "Three add five is eight, but there are three groups of five. Count in fives: five, ten, fifteen."
                hints:
                  - "Count in fives, once for each group."
                  - "Five, ten ..."
                  - "15."
              - id: l1-f5
                type: multiple_choice
                text: "How many altogether? Count in tens."
                say: "Here are four rows of ten. Count in tens. How many counters are there?"
                show: { drawn: dots, array: [4, 10] }
                options: ["40", "14", "10"]
                answer: "40"
                hints:
                  - "Each row has ten."
                  - "Ten, twenty, thirty ..."
                  - "40."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many rows? How many in each row?"
                say: "How many rows are there, and how many counters are in each row?"
                show: { drawn: dots, array: [4, 2] }
                options: ["4 rows of 2", "2 rows of 4", "4 rows of 4"]
                answer: "4 rows of 2"
                hints: ["Count the rows first, from top to bottom."]
              - id: l1-s2
                type: true_false
                text: "Are these groups equal? 5 pencils, 5 pencils, 5 pencils"
                say: "There are three pots. Each pot has five pencils. Are the groups equal?"
                answer: true
                hints: ["Are all the numbers the same?"]
              - id: l1-s3
                type: multiple_choice
                text: "2 groups of 10. How many altogether?"
                say: "There are two groups with ten in each group. How many altogether?"
                show: { drawn: dots, array: [2, 10] }
                options: ["20", "12", "10"]
                answer: "20"
                hints: ["Count in tens."]
              - id: l1-s4
                type: multiple_choice
                text: "4 groups of 2. How many altogether?"
                say: "There are four groups with two in each group. How many altogether?"
                show: { drawn: dots, array: [4, 2] }
                options: ["8", "6", "4"]
                answer: "8"
                hints: ["Count in twos: two, four ..."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which picture shows equal groups?"
                say: "Which picture shows equal groups?"
                options:
                  - { drawn: dots, groups: [3, 2] }
                  - { drawn: dots, array: [2, 4] }
                  - { drawn: dots, groups: [1, 4] }
                answer: "2x4"
                hints: ["Every row needs the same number."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many rows? How many in each row?"
                say: "How many rows are there, and how many counters are in each row?"
                show: { drawn: dots, array: [3, 3] }
                options: ["3 rows of 3", "3 rows of 6", "1 row of 3"]
                answer: "3 rows of 3"
              - id: l1-n2
                type: true_false
                text: "Are these groups equal? 4 sweets, 4 sweets, 5 sweets"
                say: "Three children have sweets: four, four and five. Are the groups equal?"
                answer: false
              - id: l1-n3
                type: text_input
                text: "5 groups of 2. How many altogether?"
                say: "There are five groups with two in each group. How many altogether?"
                show: { drawn: dots, array: [5, 2] }
                answer: "10"
              - id: l1-n4
                type: text_input
                text: "4 groups of 5. How many altogether?"
                say: "There are four groups with five in each group. How many altogether?"
                answer: "20"
              - id: l1-n5
                type: multiple_choice
                text: "Socks come in pairs. How many socks are in 3 pairs?"
                say: "Socks come in pairs, two in each pair. How many socks are in three pairs?"
                show: { object: sock, groups: [2, 2, 2] }
                options: ["6", "5", "3"]
                answer: "6"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many rows? How many in each row?"
            say: "How many rows are there, and how many counters are in each row?"
            show: { drawn: dots, array: [2, 3] }
            options: ["2 rows of 3", "3 rows of 2", "2 rows of 2"]
            answer: "2 rows of 3"
          - id: l1-c2
            type: multiple_choice
            text: "2 groups of 5. How many altogether?"
            say: "There are two groups with five in each group. How many altogether?"
            options: ["10", "7", "5"]
            answer: "10"
          - id: l1-c3
            type: true_false
            text: "Are these groups equal? 10 cubes, 10 cubes"
            say: "Two towers each have ten cubes. Are the groups equal?"
            answer: true
          - id: l1-c4
            type: true_false
            text: "Are these groups equal?"
            say: "Look at the cars in each group. Are the groups equal?"
            show: { object: car, groups: [3, 3, 3] }
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "How many altogether? Count in tens."
            say: "Here are five rows of ten. Count in tens. How many counters are there?"
            show: { drawn: dots, array: [5, 10] }
            options: ["50", "15", "10"]
            answer: "50"
          - id: l1-c6
            type: true_false
            text: "4 plates, 2 cakes on each plate. Is it true? There are 6 cakes."
            say: "There are four plates with two cakes on each plate. Is it true? There are six cakes."
            show: { object: cake, groups: [2, 2, 2, 2] }
            answer: false

  - n: 2
    title: { de: "Plus wird Mal", en: "Adding becomes multiplying" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "3 groups of 2. How many altogether?"
            say: "There are three groups with two in each group. How many altogether?"
            show: { drawn: dots, array: [3, 2] }
            options: ["6", "5", "3"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Are these groups equal? 3 cars, 2 cars"
            say: "One box has three cars and one box has two cars. Are the groups equal?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4 + 4 + 4 = 12"
            say: "Three groups of four. We can add them: four add four add four makes twelve."
            show: { drawn: dots, array: [3, 4] }
          - text: "3 × 4 = 12"
            say: "When we add equal groups, we can multiply instead. Three groups of four is three times four. We write it with the times sign: three times four equals twelve."
            show: { drawn: dots, array: [3, 4] }
          - text: "5 + 5 = 2 × 5"
            say: "Count the groups first. Five add five is two groups of five. So we write two times five. Both make ten."
            show: { drawn: dots, array: [2, 5] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Write it as an addition."
                say: "Three rows of two. Write it as an addition."
                show: { drawn: dots, array: [3, 2] }
                frame: "_ + _ + _ = 6"
                options: ["2", "3", "6"]
                answer: ["2", "2", "2"]
                hints:
                  - "How many are in each row?"
                  - "Each row has 2, and there are three rows."
                  - "2 + 2 + 2 = 6."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "5 + 5 + 5 = _ × 5"
                say: "Five add five add five. How many groups of five are there?"
                frame: "5 + 5 + 5 = _ × 5"
                options: ["3", "5", "15"]
                answer: ["3"]
                feedback:
                  "5": "There are 5 in each group. Now count the fives. There are 3 fives, so there are 3 groups."
                hints:
                  - "Count how many fives are added."
                  - "One five, two fives ..."
                  - "3 × 5."
              - id: l2-f3
                type: multiple_choice
                text: "2 × 10 = _"
                say: "Two times ten. That is two groups of ten."
                show: { drawn: dots, array: [2, 10] }
                options: ["20", "12", "10"]
                answer: "20"
                feedback:
                  "12": "Two add ten is twelve, but two times ten is two groups of ten: ten, twenty."
                hints:
                  - "Two times ten means two groups of ten."
                  - "Count in tens."
                  - "20."
              - id: l2-f4
                type: multiple_choice
                text: "Which multiplication matches 2 + 2 + 2 + 2?"
                say: "Two add two add two add two. Which multiplication matches it?"
                options: ["4 × 2", "2 + 4", "2 × 2"]
                answer: "4 × 2"
                hints:
                  - "Count the twos. That is the number of groups."
                  - "There are four twos."
                  - "4 × 2."
              - id: l2-f5
                type: true_false
                text: "Is it true? 10 + 10 + 10 = 3 × 10"
                say: "Ten add ten add ten is the same as three times ten. Is that true?"
                answer: true
                hints:
                  - "Count the tens that are added."
                  - "There are three tens: three groups of ten."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Write it as an addition."
                say: "Two rows of four. Write it as an addition."
                show: { drawn: dots, array: [2, 4] }
                frame: "_ + _ = 8"
                options: ["2", "4", "8"]
                answer: ["4", "4"]
                hints: ["How many counters are in each row?"]
              - id: l2-s2
                type: fill_in_blank
                text: "2 + 2 + 2 + 2 + 2 = _ × 2"
                say: "Two add two add two add two add two. How many groups of two are there?"
                frame: "2 + 2 + 2 + 2 + 2 = _ × 2"
                options: ["5", "2", "10"]
                answer: ["5"]
                hints: ["Count the twos."]
              - id: l2-s3
                type: multiple_choice
                text: "3 × 5 = _"
                say: "Three times five. That is three groups of five."
                options: ["15", "8", "35"]
                answer: "15"
                hints: ["Count in fives, three times."]
              - id: l2-s4
                type: matching
                text: "Match each picture to its multiplication."
                say: "Match each picture of counters to its multiplication."
                pairs:
                  - { left: { drawn: dots, array: [2, 3] }, right: { text: "2 × 3" } }
                  - { left: { drawn: dots, array: [4, 5] }, right: { text: "4 × 5" } }
                  - { left: { drawn: dots, array: [1, 10] }, right: { text: "1 × 10" } }
                hints: ["Count the rows first. That is the first number."]
              - id: l2-s5
                type: multiple_choice
                text: "There are 4 bikes. Each bike has 2 wheels. Which multiplication finds the wheels?"
                say: "There are four bikes. Each bike has two wheels. Which multiplication finds how many wheels?"
                options: ["4 × 2", "4 + 2", "2 × 2"]
                answer: "4 × 2"
                hints: ["Four groups, with two in each group."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Write it as an addition."
                say: "Four rows of five. Write it as an addition."
                show: { drawn: dots, array: [4, 5] }
                frame: "_ + _ + _ + _ = 20"
                options: ["4", "5", "20"]
                answer: ["5", "5", "5", "5"]
              - id: l2-n2
                type: fill_in_blank
                text: "10 + 10 + 10 + 10 = _ × 10"
                say: "Ten add ten add ten add ten. How many groups of ten are there?"
                frame: "10 + 10 + 10 + 10 = _ × 10"
                options: ["4", "10", "40"]
                answer: ["4"]
              - id: l2-n3
                type: text_input
                text: "5 × 2 = _"
                say: "Five times two."
                answer: "10"
              - id: l2-n4
                type: multiple_choice
                text: "Which multiplication matches 5 + 5 + 5 + 5?"
                say: "Five add five add five add five. Which multiplication matches it?"
                options: ["4 × 5", "5 + 4", "5 × 5"]
                answer: "4 × 5"
              - id: l2-n5
                type: text_input
                text: "There are 3 boxes. Each box has 10 pencils. How many pencils are there?"
                say: "There are three boxes. Each box has ten pencils. How many pencils are there altogether?"
                answer: "30"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: result
            type: multiple_choice
            text: "How many altogether?"
            say: "Here are five rows of five counters. How many are there altogether?"
            show: { drawn: dots, array: [5, 5] }
            options: ["25", "10", "20"]
            answer: "25"
          - id: l2-c2
            part: add-to-times
            type: fill_in_blank
            text: "5 + 5 = _ × 5"
            say: "Five add five. How many groups of five are there?"
            frame: "5 + 5 = _ × 5"
            options: ["2", "5", "10"]
            answer: ["2"]
          - id: l2-c3
            part: add-to-times
            type: multiple_choice
            text: "Which multiplication matches 10 + 10?"
            say: "Ten add ten. Which multiplication matches it?"
            options: ["2 × 10", "10 + 2", "10 × 10"]
            answer: "2 × 10"
          - id: l2-c4
            part: equal-groups
            type: true_false
            text: "Is it true? 3 + 3 + 4 = 3 × 3"
            say: "Three add three add four is the same as three times three. Is that true?"
            answer: false
          - id: l2-c5
            part: result
            type: text_input
            text: "3 × 2 = _"
            say: "Three times two."
            answer: "6"
          - id: l2-c6
            part: equal-groups
            type: true_false
            text: "Are these groups equal?"
            say: "Look at the flowers in each group. Are the groups equal?"
            show: { object: flower, groups: [5, 5, 4] }
            answer: false
          - id: l2-c7
            part: equal-groups
            type: multiple_choice
            text: "Which groups are all equal?"
            say: "Which groups are all equal?"
            options: ["2, 2, 2, 2", "2, 2, 3, 2", "1, 2, 3, 4"]
            answer: "2, 2, 2, 2"
          - id: l2-c8
            part: equal-groups
            type: multiple_choice
            text: "Which can you write as a multiplication?"
            say: "Which one can you write as a multiplication?"
            options: ["3 bags of 5 sweets", "bags of 5, 4 and 3 sweets", "bags of 5 and 2 sweets"]
            answer: "3 bags of 5 sweets"
          - id: l2-c9
            part: equal-groups
            type: true_false
            text: "2 hands, 5 fingers on each hand. Are the groups equal?"
            say: "You have two hands with five fingers on each hand. Are the groups equal?"
            show: { object: hand, count: 2, layout: row }
            answer: true
          - id: l2-c10
            part: add-to-times
            type: multiple_choice
            text: "Which addition matches 3 × 5?"
            say: "Which addition matches three times five?"
            options: ["5 + 5 + 5", "3 + 5", "3 + 3 + 3"]
            answer: "5 + 5 + 5"
          - id: l2-c11
            part: add-to-times
            type: true_false
            text: "Is it true? 2 + 2 + 2 = 2 × 2"
            say: "Two add two add two is the same as two times two. Is that true?"
            answer: false
          - id: l2-c12
            part: add-to-times
            type: fill_in_blank
            text: "Write the addition as a multiplication."
            say: "Two add two add two add two add two add two. Write it as a multiplication."
            frame: "2 + 2 + 2 + 2 + 2 + 2 = _ × _"
            options: ["6", "2", "12", "8"]
            answer: ["6", "2"]
          - id: l2-c13
            part: write-times
            type: fill_in_blank
            text: "Write the multiplication."
            say: "Look at the counters. Write the multiplication."
            show: { drawn: dots, array: [4, 3] }
            frame: "_ × _ = _"
            options: ["4", "3", "12", "7"]
            answer: ["4", "3", "12"]
          - id: l2-c14
            part: write-times
            type: multiple_choice
            text: "Which multiplication matches the counters?"
            say: "Look at the counters. Which multiplication matches them?"
            show: { drawn: dots, array: [3, 10] }
            options: ["3 × 10", "3 + 10", "10 × 10"]
            answer: "3 × 10"
          - id: l2-c15
            part: write-times
            type: fill_in_blank
            text: "Ella has 2 bags. There are 5 apples in each bag. Write the multiplication."
            say: "Ella has two bags. There are five apples in each bag. Write the multiplication."
            show: { object: apple, groups: [5, 5] }
            frame: "_ × _ = _"
            options: ["2", "5", "10", "7"]
            answer: ["2", "5", "10"]
          - id: l2-c16
            part: write-times
            type: multiple_choice
            text: "Which multiplication matches the pencils?"
            say: "Look at the pencils. Which multiplication matches them?"
            show: { object: pencil, groups: [5, 5, 5] }
            options: ["3 × 5", "5 × 5", "3 + 5"]
            answer: "3 × 5"
          - id: l2-c17
            part: write-times
            type: true_false
            text: "Is it true? The counters show 5 × 2."
            say: "Look at the counters. Is it true? They show five times two."
            show: { drawn: dots, array: [5, 2] }
            answer: true
          - id: l2-c18
            part: result
            type: text_input
            text: "5 × 10 = _"
            say: "Five times ten."
            answer: "50"
          - id: l2-c19
            part: result
            type: text_input
            text: "There are 4 children. Each child has 2 shoes. How many shoes are there?"
            say: "There are four children. Each child has two shoes. How many shoes are there altogether?"
            show: { object: shoe, groups: [2, 2, 2, 2] }
            answer: "8"
          - id: l2-c20
            part: result
            type: true_false
            text: "Is it true? 3 × 10 = 13"
            say: "Three times ten is thirteen. Is that true?"
            answer: false
