# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.fluency-to-20
skill: math.add-sub-to-20.fluency-to-20
curriculum: en-GB
language: en
title:
  de: Das kleine Einspluseins
  en: Number facts to 20
summary: >
  Number bonds and facts to 20, quickly and surely, using the strategies
  the child knows (doubles, near doubles, number bonds to 10, related
  facts, making ten) and getting subtraction facts from addition facts.
  Lesson 1 mixes addition facts and picks a quick strategy; lesson 2
  uses the inverse for subtraction facts, mixes both, and ends with the
  skill check.
metadata:
  year: year-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.sub-bridge-10]
  also_practises: [math.add-sub-to-20.add-bridge-10, math.add-sub-to-20.inverse]
  vocabulary: { en: [number bond, double, near double, make ten, inverse, fact] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: add-no-bridge, what: { de: Plusaufgaben ohne Zehnerübergang, en: addition facts that do not cross ten } }
    - { id: add-bridge, what: { de: Plusaufgaben mit Zehnerübergang, en: addition facts that cross ten } }
    - { id: subtract, what: { de: Minusaufgaben bis 20, en: subtraction facts to 20 } }
    - { id: inverse, what: { de: Minusaufgaben aus der Plusaufgabe ableiten, en: working out a subtraction fact from its addition fact } }
  misconceptions:
    - id: count-in-ones
      what: Counts on in ones for every fact instead of using one it knows
      addressed: Learn lists the strategies; lesson 1 asks which strategy fits a fact, with feedback in the full stage naming the quicker way
    - id: subtract-from-scratch
      what: Works out 15 − 8 from scratch though it knows 8 + 7 = 15
      addressed: lesson 2 Learn gets subtraction facts from addition facts; tasks pair each addition with its inverse
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Schnell plus rechnen, en: Quick addition facts }
    goal:
      de: "Such dir beim Plusrechnen den schnellsten Weg aus, so wie eine Verdopplung bei 6 plus 6 ist 12."
      en: "Pick the quickest way to add, like a double for 6 add 6 makes 12."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "8 + 5 = _"
            say: "Eight add five."
            answer: "13"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "7 + 7 = _"
            say: "Seven add seven."
            answer: "14"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6 + 7 = ?"
            say: "Six add seven. What is the quickest way to work it out? Have a guess."
          - text: "6 + 6 · 6 + 7"
            say: "You know lots of quick ways. Doubles: six add six is twelve. Near doubles: six add seven is one more, thirteen."
          - text: "7 + 3 · 13 + 4"
            say: "Number bonds to ten: seven add three is ten. Related facts: thirteen add four is like three add four, with a ten."
          - text: "8 + 5 = 8 + 2 + 3"
            say: "And making ten: get to ten first, then add the rest. Look at each fact and use the quickest way."
          - text: "Did you know? A fortnight is 14 days: 7 + 7."
            say: "Did you know? Two weeks are called a fortnight. The word comes from fourteen nights. Seven days add seven days is fourteen days!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which way is quickest for 9 + 9?"
                say: "Nine add nine. Which way is quickest?"
                options: ["double", "number bond to 10", "count on in ones", "ask the cat"]
                answer: "double"
                feedback:
                  "count on in ones": "Counting on works, but it takes a long time. Nine add nine is a double."
                  "ask the cat": "The cat is fast asleep! Look: both numbers are the same."
                hints:
                  - "Both numbers are the same."
                  - "That is a double."
                  - "Double: 18."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "4 + 6 = _"
                say: "Four add six."
                answer: "10"
                hints:
                  - "Four and six are a number bond to ten."
                  - "Together they make a full ten."
                  - "10."
              - id: l1-f3
                type: multiple_choice
                text: "Which way is quickest for 12 + 5?"
                say: "Twelve add five. Which way is quickest?"
                options: ["related fact", "double", "number bond to 10"]
                answer: "related fact"
                feedback:
                  "double": "Twelve and five are not the same, so it is not a double. The related fact two add five helps."
                  "number bond to 10": "Twelve and five do not make ten. Leave out the ten: two add five."
                hints:
                  - "Does it cross ten?"
                  - "No. The ten stays."
                  - "A related fact: 2 + 5."
              - id: l1-f4
                type: text_input
                text: "9 + 6 = _"
                say: "Nine add six."
                answer: "15"
                hints:
                  - "Make ten first: nine add one."
                  - "Then five more."
                  - "15."
              - id: l1-f5
                type: true_false
                text: "Is it true? 7 + 8 = 15"
                say: "Seven add eight is fifteen. Is that true?"
                answer: true
                hints:
                  - "Double seven is fourteen."
                  - "Eight is one more."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which way is quickest for 3 + 7?"
                say: "Three add seven. Which way is quickest?"
                options: ["number bond to 10", "double", "related fact"]
                answer: "number bond to 10"
                hints: ["What do the two numbers make together?"]
              - id: l1-s2
                type: text_input
                text: "An octopus has 8 arms. How many arms do 2 octopuses have?\n8 + 8 = _"
                say: "An octopus has eight arms. How many arms do two octopuses have? Eight add eight."
                answer: "16"
                hints: ["It is a double."]
              - id: l1-s3
                type: text_input
                text: "6 + 9 = _"
                say: "Six add nine."
                answer: "15"
                hints: ["Think of six add ten, then one less."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 14 + 3 = 18"
                say: "Fourteen add three is eighteen. Is that true?"
                answer: false
                hints: ["Think of four add three."]
              - id: l1-s5
                type: text_input
                text: "7 + 5 = _"
                say: "Seven add five."
                answer: "12"
                hints: ["Make ten first."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "5 + 6 = _"
                say: "Five add six."
                answer: "11"
              - id: l1-n2
                type: text_input
                text: "2 + 8 = _"
                say: "Two add eight."
                answer: "10"
              - id: l1-n4
                type: true_false
                text: "Is it true? 9 + 4 = 13"
                say: "Nine add four is thirteen. Is that true?"
                answer: true
              - id: l1-n3
                type: text_input
                text: "11 + 7 = _"
                say: "Eleven add seven."
                answer: "18"
              - id: l1-n5
                type: text_input
                text: "8 + 6 = _"
                say: "Eight add six."
                answer: "14"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "5 + 5 = _"
            say: "Five add five."
            answer: "10"
          - id: l1-c2
            type: text_input
            text: "9 + 8 = _"
            say: "Nine add eight."
            answer: "17"
          - id: l1-c3
            type: text_input
            text: "15 + 4 = _"
            say: "Fifteen add four."
            answer: "19"
          - id: l1-c4
            type: multiple_choice
            text: "Which way is quickest for 6 + 4?"
            say: "Six add four. Which way is quickest?"
            options: ["number bond to 10", "double", "count on in ones"]
            answer: "number bond to 10"
          - id: l1-c5
            type: text_input
            text: "5 + 7 = _"
            say: "Five add seven."
            answer: "12"
          - id: l1-c6
            type: true_false
            text: "Is it true? 13 + 6 = 18"
            say: "Thirteen add six is eighteen. Is that true?"
            answer: false

  - n: 2
    title: { de: Minus aus Plus ableiten, en: Adding helps you take away }
    goal:
      de: "Nutze eine Plusaufgabe zum Wegnehmen, so wie 8 plus 7 ist 15, also ist 15 minus 7 gleich 8."
      en: "Use adding to take away, like 8 add 7 is 15, so 15 take away 7 is 8."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "7 + 6 = _"
            say: "Seven add six."
            answer: "13"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "4 + 9 = _"
            say: "Four add nine."
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 + 7 = 15 · 15 − 7 = ?"
            say: "Eight add seven is fifteen. So what do you think fifteen take away seven is? Have a guess."
          - text: "8 + 7 = 15 → 15 − 7 = 8"
            say: "Eight! If you know that eight add seven is fifteen, you also know fifteen take away seven is eight. These facts belong together."
          - text: "15 − 8 = 7"
            say: "And fifteen take away eight is seven. One adding fact gives you two take away facts."
          - text: "14 − 7 ← 7 + 7 = 14"
            say: "For fourteen take away seven, a double helps: seven add seven is fourteen, so fourteen take away seven is seven."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Use the addition fact."
                say: "Nine add four is thirteen. So what is thirteen take away four?"
                frame: "9 + 4 = 13 · 13 − 4 = _"
                options: ["9", "4", "17"]
                answer: ["9"]
                hints:
                  - "Taking away four undoes adding four."
                  - "Then nine is left."
                  - "9."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which addition helps with 12 − 5?"
                say: "Twelve take away five. Which addition fact helps?"
                options: ["7 + 5 = 12", "12 + 5 = 17", "6 + 6 = 12"]
                answer: "7 + 5 = 12"
                hints:
                  - "What add five makes twelve?"
                  - "Seven add five is twelve."
                  - "7 + 5 = 12."
              - id: l2-f3
                type: text_input
                text: "16 − 8 = _"
                say: "Sixteen take away eight."
                answer: "8"
                hints:
                  - "Think of a double."
                  - "Eight add eight is sixteen."
                  - "8."
              - id: l2-f4
                type: true_false
                text: "Is it true? 11 − 3 = 8, because 8 + 3 = 11."
                say: "Eleven take away three is eight, because eight add three is eleven. Is that true?"
                answer: true
                hints:
                  - "Work out eight add three."
                  - "Eight add three is eleven."
                  - "Yes."
              - id: l2-f5
                type: fill_in_blank
                text: "Use the addition fact."
                say: "Six add eight is fourteen. So what are fourteen take away eight and fourteen take away six?"
                frame: "6 + 8 = 14 · 14 − 8 = _ · 14 − 6 = _"
                options: ["6", "8", "14", "2"]
                answer: ["6", "8"]
                hints:
                  - "Taking away eight undoes adding eight."
                  - "Six is left, and for take away six, eight is left."
                  - "6 and 8."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Use the addition fact."
                say: "Seven add four is eleven. So what is eleven take away four?"
                frame: "7 + 4 = 11 · 11 − 4 = _"
                options: ["7", "4", "15"]
                answer: ["7"]
                hints: ["Taking away undoes adding."]
              - id: l2-s2
                type: multiple_choice
                text: "Which addition helps with 17 − 9?"
                say: "Seventeen take away nine. Which addition fact helps?"
                options: ["8 + 9 = 17", "17 + 9 = 26", "9 + 9 = 18"]
                answer: "8 + 9 = 17"
                hints: ["What add nine makes seventeen?"]
              - id: l2-s3
                type: text_input
                text: "18 − 9 = _"
                say: "Eighteen take away nine."
                answer: "9"
                hints: ["Think of a double."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 13 − 6 = 8, because 8 + 6 = 13."
                say: "Thirteen take away six is eight, because eight add six is thirteen. Is that true?"
                answer: false
                hints: ["Check eight add six."]
              - id: l2-s5
                type: text_input
                text: "15 − 6 = _"
                say: "Fifteen take away six."
                answer: "9"
                hints: ["What add six makes fifteen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Use the addition fact."
                say: "Five add nine is fourteen. So what is fourteen take away nine?"
                frame: "5 + 9 = 14 · 14 − 9 = _"
                options: ["5", "9", "23"]
                answer: ["5"]
              - id: l2-n2
                type: text_input
                text: "12 − 6 = _"
                say: "Twelve take away six."
                answer: "6"
              - id: l2-n3
                type: text_input
                text: "There are 17 cupcakes at the cake sale. 8 are sold.\n17 − 8 = _"
                say: "There are seventeen cupcakes at the cake sale. Eight are sold. Seventeen take away eight. How many cupcakes are left?"
                answer: "9"
              - id: l2-n4
                type: true_false
                text: "Is it true? 11 − 7 = 4"
                say: "Eleven take away seven is four. Is that true?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "13 − 5 = _"
                say: "Thirteen take away five."
                answer: "8"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add-bridge
            type: text_input
            text: "5 + 8 = _"
            say: "Five add eight."
            answer: "13"
          - id: l2-c2
            part: subtract
            type: text_input
            text: "14 − 5 = _"
            say: "Fourteen take away five."
            answer: "9"
          - id: l2-c5
            part: inverse
            type: multiple_choice
            text: "Which addition helps with 11 − 8?"
            say: "Eleven take away eight. Which addition fact helps?"
            options: ["3 + 8 = 11", "11 + 8 = 19", "4 + 8 = 12"]
            answer: "3 + 8 = 11"
          - id: l2-c3
            part: add-bridge
            type: text_input
            text: "9 + 7 = _"
            say: "Nine add seven."
            answer: "16"
          - id: l2-c4
            part: subtract
            type: text_input
            text: "16 − 9 = _"
            say: "Sixteen take away nine."
            answer: "7"
          - id: l2-c6
            part: add-no-bridge
            type: text_input
            text: "14 + 5 = _"
            say: "Fourteen add five."
            answer: "19"
          - id: l2-c8
            part: add-no-bridge
            type: true_false
            text: "Is it true? 12 + 4 = 15"
            say: "Twelve add four is fifteen. Is that true?"
            answer: false
          - id: l2-c7
            part: add-no-bridge
            type: text_input
            text: "2 + 7 = _"
            say: "Two add seven."
            answer: "9"
          - id: l2-c9
            part: add-no-bridge
            type: text_input
            text: "11 + 6 = _"
            say: "Eleven add six."
            answer: "17"
          - id: l2-c10
            part: add-no-bridge
            type: text_input
            text: "10 + 8 = _"
            say: "Ten add eight."
            answer: "18"
          - id: l2-c12
            part: add-bridge
            type: true_false
            text: "Is it true? 8 + 4 = 12"
            say: "Eight add four is twelve. Is that true?"
            answer: true
          - id: l2-c11
            part: add-bridge
            type: text_input
            text: "3 + 9 = _"
            say: "Three add nine."
            answer: "12"
          - id: l2-c13
            part: add-bridge
            type: text_input
            text: "4 + 7 = _"
            say: "Four add seven."
            answer: "11"
          - id: l2-c14
            part: subtract
            type: text_input
            text: "13 − 7 = _"
            say: "Thirteen take away seven."
            answer: "6"
          - id: l2-c15
            part: subtract
            type: true_false
            text: "Is it true? 15 − 9 = 7"
            say: "Fifteen take away nine is seven. Is that true?"
            answer: false
          - id: l2-c16
            part: subtract
            type: text_input
            text: "12 − 8 = _"
            say: "Twelve take away eight."
            answer: "4"
          - id: l2-c17
            part: inverse
            type: fill_in_blank
            text: "Use the addition fact."
            say: "Six add nine is fifteen. So what is fifteen take away nine?"
            frame: "6 + 9 = 15 · 15 − 9 = _"
            options: ["6", "9", "24"]
            answer: ["6"]
          - id: l2-c18
            part: inverse
            type: multiple_choice
            text: "Which take away fact goes with 7 + 9 = 16?"
            say: "Seven add nine is sixteen. Which take away fact goes with it?"
            options: ["16 − 9 = 7", "16 − 7 = 8", "16 + 7 = 23"]
            answer: "16 − 9 = 7"
          - id: l2-c19
            part: inverse
            type: multiple_choice
            text: "Which addition helps with 14 − 6?"
            say: "Fourteen take away six. Which addition fact helps?"
            options: ["8 + 6 = 14", "14 + 6 = 20", "7 + 7 = 14"]
            answer: "8 + 6 = 14"
          - id: l2-c20
            part: inverse
            type: true_false
            text: "Is it true? 12 − 3 = 9, because 9 + 3 = 12."
            say: "Twelve take away three is nine, because nine add three is twelve. Is that true?"
            answer: true
