# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.sequences-to-100
skill: math.numbers-to-100.sequences
curriculum: en-GB
language: en
title:
  de: Zahlenfolgen bis 100
  en: Counting in steps to 100
summary: >
  Lesson 1 counts forwards and backwards in ones and in tens from any
  number, on the hundred square and on a number line (34, 44, 54); lesson
  2 counts in twos and fives, finds the rule of a sequence (add 2, add 5,
  add 10, take away 10) and the number that does not fit, and ends with
  the skill check.
metadata:
  year: year-1
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.tens]
  also_practises: [math.numbers-to-100.read-write]
  vocabulary: { en: [count on, count back, sequence, rule, step, ones, twos, fives, tens, more, less] }
  forms: [drawn, text, audio]
  drawn: [hundred-square, number-line]
  facets: []
  parts:
    - { id: ones, what: { de: in Einerschritten vorwärts und rückwärts zählen, en: counting forwards and backwards in ones } }
    - { id: tens, what: { de: von jeder Zahl aus in Zehnerschritten zählen, en: counting in tens from any number } }
    - { id: twos-fives, what: { de: in Zweier- und Fünferschritten zählen, en: counting in twos and fives } }
    - { id: rule, what: { de: die Regel einer Zahlenfolge finden, en: finding the rule of a sequence } }
  misconceptions:
    - id: tens-change-ones
      what: When counting in tens from a number that is not a ten, changes the ones digit (34, 40, 50) or jumps to the next ten
      addressed: lesson 1 Learn shows 34, 44, 54 going down a column of the hundred square, with the ones digit staying the same; l1-f3 (with feedback) offers the next ten, and l1-s3, l1-n3 and l2-c2 count in tens from a number that is not a ten
    - id: back-across-ten
      what: Counting back in ones across a ten, says the wrong ten (41, 40, 49 or 31, 30, 20)
      addressed: lesson 1 Learn counts back from 42 to 38; l1-f4 (with feedback), l1-s4 and l1-n4 ask for the number before a ten
    - id: rule-from-one-pair
      what: Reads the rule from the first two numbers only, or confuses the step with the start number
      addressed: lesson 2 Learn checks the rule on every pair; l2-f3 (with feedback), l2-s3 and l2-n3 ask for the rule, and l2-f5, l2-s5 and l2-n5 ask which number does not fit
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "In Einer- und Zehnerschritten", en: "In ones and tens" }
    goal:
      de: "Zähl in Einern und Zehnern vorwärts und rückwärts, so wie 34, 44, 54 auf der Hundertertafel nach unten."
      en: "Count on and back in ones and tens, like 34, 44, 54 down the hundred square."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Count in tens."
            say: "Count in tens. Fill the gaps."
            frame: "10, 20, _, 40, _"
            options: ["30", "50", "41", "60"]
            answer: ["30", "50"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What comes before 70 when you count in tens?"
            say: "Count back in tens. What comes before seventy?"
            options: ["60", "69", "80"]
            answer: "60"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "34, 44, 54, 64"
            say: "On the hundred square, one row down is ten more. Start at thirty-four and go down: forty-four, fifty-four, sixty-four. The tens digit goes up by one. The ones digit is always four."
            show: { drawn: hundred-square, highlight: [34, 44, 54, 64] }
          - text: "86, 76, 66"
            say: "Going up a row is ten less. Eighty-six, seventy-six, sixty-six. That is counting back in tens."
            show: { drawn: hundred-square, highlight: [86, 76, 66] }
          - text: "42, 41, 40, 39, 38"
            say: "Counting back in ones across a ten: forty-two, forty-one, forty, then thirty-nine. The number before forty is thirty-nine."
            show: { drawn: number-line, from: 30, to: 50, labels: tens, jumps: [[42, -1], [41, -1], [40, -1], [39, -1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Count on in ones."
                say: "Count on in ones. Fill the gaps."
                frame: "57, 58, _, _, 61"
                options: ["59", "60", "50", "69"]
                answer: ["59", "60"]
                hints:
                  - "Each number is one more."
                  - "After fifty-nine comes a new ten."
                  - "59, 60."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which number is hidden?"
                say: "Look at the hundred square. The number under twenty-five is hidden. Which number is it?"
                show: { drawn: hundred-square, highlight: [25], hide: [35] }
                options: ["35", "26", "45"]
                answer: "35"
                hints:
                  - "One row down is ten more."
                  - "Twenty-five and ten more."
                  - "35."
              - id: l1-f3
                type: fill_in_blank
                text: "Count on in tens."
                say: "Count on in tens from twenty-three. Fill the gaps."
                frame: "23, 33, _, _, 63"
                options: ["43", "53", "40", "50"]
                answer: ["43", "53"]
                feedback:
                  "40": "When you count in tens from 23, the ones digit is always 3. Ten more than 33 is 43."
                hints:
                  - "Which digit changes when you add ten?"
                  - "The tens digit goes up by one. The ones digit is still 3."
                  - "43, 53."
              - id: l1-f4
                type: multiple_choice
                text: "Count back in ones: 62, 61, 60, _"
                say: "Count back in ones: sixty-two, sixty-one, sixty. What comes next?"
                options: ["59", "50", "69"]
                answer: "59"
                feedback:
                  "50": "Fifty is ten less than sixty. One less than sixty is fifty-nine."
                  "69": "Sixty-nine is bigger than sixty. Going back, the next number is smaller."
                hints:
                  - "Counting back means one less each time."
                  - "One less than sixty goes into the fifties."
                  - "59."
              - id: l1-f5
                type: point_on_line
                text: "Count back 10 from 74. Where do you land?"
                say: "Start at seventy-four and count back ten. Where do you land?"
                show: { drawn: number-line, from: 60, to: 80, labels: tens }
                answer: 64
                hints:
                  - "Ten less than seventy-four."
                  - "The tens digit goes down by one. The ones digit is still 4."
                  - "64."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Count back in ones."
                say: "Count back in ones. Fill the gaps."
                frame: "83, 82, _, _, 79"
                options: ["81", "80", "70", "78"]
                answer: ["81", "80"]
                hints: ["Each number is one less."]
              - id: l1-s2
                type: multiple_choice
                text: "Which number is hidden?"
                say: "Look at the hundred square. The number above fifty-eight is hidden. Which number is it?"
                show: { drawn: hundred-square, highlight: [58], hide: [48] }
                options: ["48", "57", "68"]
                answer: "48"
                hints: ["One row up is ten less."]
              - id: l1-s3
                type: fill_in_blank
                text: "Count on in tens."
                say: "Count on in tens from sixteen. Fill the gaps."
                frame: "16, 26, _, _"
                options: ["36", "46", "30", "40"]
                answer: ["36", "46"]
                hints: ["The ones digit is always 6."]
              - id: l1-s4
                type: multiple_choice
                text: "Count back in ones: 31, 30, _"
                say: "Count back in ones: thirty-one, thirty. What comes next?"
                options: ["29", "20", "39"]
                answer: "29"
                hints: ["One less than thirty goes into the twenties."]
              - id: l1-s5
                type: multiple_choice
                text: "Count back in tens: 95, 85, 75, _"
                say: "Count back in tens: ninety-five, eighty-five, seventy-five. What comes next?"
                options: ["65", "74", "70"]
                answer: "65"
                hints: ["Ten less: the tens digit goes down by one."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Count on in ones."
                say: "Count on in ones. Fill the gaps."
                frame: "96, 97, _, _, 100"
                options: ["98", "99", "90", "101"]
                answer: ["98", "99"]
              - id: l1-n2
                type: multiple_choice
                text: "Which number is hidden?"
                say: "Look at the hundred square. The number under sixty-one is hidden. Which number is it?"
                show: { drawn: hundred-square, highlight: [61], hide: [71] }
                options: ["71", "62", "81"]
                answer: "71"
              - id: l1-n3
                type: fill_in_blank
                text: "Count on in tens."
                say: "Count on in tens from forty-seven. Fill the gaps."
                frame: "47, 57, _, _"
                options: ["67", "77", "60", "70"]
                answer: ["67", "77"]
              - id: l1-n4
                type: text_input
                text: "Count back in ones: 52, 51, 50, _"
                say: "Count back in ones: fifty-two, fifty-one, fifty. What comes next?"
                answer: "49"
              - id: l1-n5
                type: text_input
                text: "Count back in tens: 88, 78, 68, _"
                say: "Count back in tens: eighty-eight, seventy-eight, sixty-eight. What comes next?"
                answer: "58"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Count on in tens."
            say: "Count on in tens from twelve. Fill the gaps."
            frame: "12, 22, _, _"
            options: ["32", "42", "30", "40"]
            answer: ["32", "42"]
          - id: l1-c2
            type: multiple_choice
            text: "Count back in ones: 71, 70, _"
            say: "Count back in ones: seventy-one, seventy. What comes next?"
            options: ["69", "60", "79"]
            answer: "69"
          - id: l1-c3
            type: multiple_choice
            text: "Which number is hidden?"
            say: "Look at the hundred square. The number under forty-four is hidden. Which number is it?"
            show: { drawn: hundred-square, highlight: [44], hide: [54] }
            options: ["54", "45", "64"]
            answer: "54"
          - id: l1-c4
            type: fill_in_blank
            text: "Count back in tens."
            say: "Count back in tens. Fill the gaps."
            frame: "64, 54, _, _"
            options: ["44", "34", "40", "30"]
            answer: ["44", "34"]
          - id: l1-c5
            type: text_input
            text: "Count on in ones: 88, 89, _"
            say: "Count on in ones: eighty-eight, eighty-nine. What comes next?"
            answer: "90"
          - id: l1-c6
            type: multiple_choice
            text: "Which number is hidden, just above 72?"
            say: "Look at the hundred square. The number just above seventy-two is hidden. Which number is it?"
            show: { drawn: hundred-square, highlight: [72], hide: [62] }
            options: ["62", "71", "82"]
            answer: "62"

  - n: 2
    title: { de: "Zweier, Fünfer und die Regel", en: "Twos, fives and the rule" }
    goal:
      de: "Zähl in Zweiern und Fünfern und finde die Regel einer Zahlenfolge, so wie immer zehn mehr."
      en: "Count in twos and fives, and find the rule of a number pattern, like add ten each time."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Count on in tens."
            say: "Count on in tens from five. Fill the gaps."
            frame: "5, 15, _, _"
            options: ["25", "35", "20", "30"]
            answer: ["25", "35"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Count back in ones: 81, 80, _"
            say: "Count back in ones: eighty-one, eighty. What comes next?"
            options: ["79", "70", "89"]
            answer: "79"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2, 4, 6, 8, 10"
            say: "Counting in twos: two, four, six, eight, ten. Each number is two more."
            show: { drawn: number-line, from: 0, to: 20, labels: tens, jumps: [[0, 2], [2, 2], [4, 2], [6, 2], [8, 2]] }
          - text: "5, 10, 15, 20, 25"
            say: "Counting in fives: five, ten, fifteen, twenty, twenty-five. The numbers end in five or zero."
            show: { drawn: number-line, from: 0, to: 30, labels: tens, jumps: [[0, 5], [5, 5], [10, 5], [15, 5], [20, 5]] }
          - text: "30, 40, 50, 60: the rule is +10"
            say: "To find the rule of a sequence, look at how much it goes up or down each time. Check every step, not just the first. Thirty, forty, fifty, sixty: each step is ten more. The rule is add ten."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Count in twos."
                say: "Count in twos. Fill the gaps."
                frame: "10, 12, 14, _, _"
                options: ["16", "18", "15", "20"]
                answer: ["16", "18"]
                hints:
                  - "Each number is two more."
                  - "Fourteen and two more is sixteen."
                  - "16, 18."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Count in fives."
                say: "Count in fives. Fill the gaps."
                frame: "15, 20, 25, _, _"
                options: ["30", "35", "26", "40"]
                answer: ["30", "35"]
                hints:
                  - "In fives, the numbers end in 5 or 0."
                  - "Twenty-five and five more is thirty."
                  - "30, 35."
              - id: l2-f3
                type: multiple_choice
                text: "What is the rule? 44, 54, 64, 74"
                say: "Forty-four, fifty-four, sixty-four, seventy-four. What is the rule?"
                options: ["+10", "+1", "−10"]
                answer: "+10"
                option_audio: false
                feedback:
                  "+1": "Only the tens digit changes, and it goes up by one each time. That is ten more each step."
                  "−10": "The numbers get bigger, so the rule adds."
                hints:
                  - "Do the numbers go up or down?"
                  - "Which digit changes? By how much?"
                  - "+10."
              - id: l2-f4
                type: multiple_choice
                text: "Count back in twos: 20, 18, 16, _"
                say: "Count back in twos: twenty, eighteen, sixteen. What comes next?"
                options: ["14", "15", "12"]
                answer: "14"
                hints:
                  - "Counting back in twos is two less each time."
                  - "Two less than sixteen."
                  - "14."
              - id: l2-f5
                type: multiple_choice
                text: "Which number does not fit? 5, 10, 15, 21, 25"
                say: "The sequence counts in fives. Which number does not fit?"
                options: ["21", "15", "25"]
                answer: "21"
                hints:
                  - "Count in fives from five."
                  - "Five, ten, fifteen, then twenty."
                  - "21 does not fit. It should be 20."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Count in twos."
                say: "Count in twos. Fill the gaps."
                frame: "22, 24, _, _, 30"
                options: ["26", "28", "25", "27"]
                answer: ["26", "28"]
                hints: ["Each number is two more."]
              - id: l2-s2
                type: fill_in_blank
                text: "Count back in fives."
                say: "Count back in fives. Fill the gaps."
                frame: "50, 45, _, _, 30"
                options: ["40", "35", "44", "25"]
                answer: ["40", "35"]
                hints: ["Each number is five less."]
              - id: l2-s3
                type: multiple_choice
                text: "What is the rule? 90, 80, 70, 60"
                say: "Ninety, eighty, seventy, sixty. What is the rule?"
                options: ["−10", "+10", "−1"]
                answer: "−10"
                option_audio: false
                hints: ["The numbers get smaller. By how much each time?"]
              - id: l2-s4
                type: multiple_choice
                text: "What is the rule? 3, 5, 7, 9"
                say: "Three, five, seven, nine. What is the rule?"
                options: ["+2", "+3", "+1"]
                answer: "+2"
                option_audio: false
                hints: ["How much more is five than three? Check the next step too."]
              - id: l2-s5
                type: multiple_choice
                text: "Which number does not fit? 30, 40, 50, 55, 70"
                say: "The sequence counts in tens. Which number does not fit?"
                options: ["55", "50", "70"]
                answer: "55"
                hints: ["Count in tens from thirty."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Count in fives."
                say: "Count in fives. Fill the gaps."
                frame: "60, 65, _, _, 80"
                options: ["70", "75", "66", "85"]
                answer: ["70", "75"]
              - id: l2-n2
                type: text_input
                text: "Count back in twos: 40, 38, 36, _"
                say: "Count back in twos: forty, thirty-eight, thirty-six. What comes next?"
                answer: "34"
              - id: l2-n3
                type: multiple_choice
                text: "What is the rule? 25, 30, 35, 40"
                say: "Twenty-five, thirty, thirty-five, forty. What is the rule?"
                options: ["+5", "+10", "+25"]
                answer: "+5"
                option_audio: false
              - id: l2-n4
                type: text_input
                text: "Count on in tens: 9, 19, 29, _"
                say: "Count on in tens: nine, nineteen, twenty-nine. What comes next?"
                answer: "39"
              - id: l2-n5
                type: multiple_choice
                text: "Which number does not fit? 2, 4, 6, 7, 10"
                say: "The sequence counts in twos. Which number does not fit?"
                options: ["7", "6", "10"]
                answer: "7"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ones
            type: fill_in_blank
            text: "Count back in ones."
            say: "Count back in ones. Fill the gaps."
            frame: "93, 92, _, _, 89"
            options: ["91", "90", "80", "88"]
            answer: ["91", "90"]
          - id: l2-c2
            part: tens
            type: text_input
            text: "Count on in tens: 38, 48, 58, _"
            say: "Count on in tens: thirty-eight, forty-eight, fifty-eight. What comes next?"
            answer: "68"
          - id: l2-c3
            part: twos-fives
            type: fill_in_blank
            text: "Count in fives."
            say: "Count in fives. Fill the gaps."
            frame: "35, 40, _, _, 55"
            options: ["45", "50", "41", "60"]
            answer: ["45", "50"]
          - id: l2-c4
            part: rule
            type: multiple_choice
            text: "What is the rule? 50, 45, 40, 35"
            say: "Fifty, forty-five, forty, thirty-five. What is the rule?"
            options: ["−5", "+5", "−10"]
            answer: "−5"
