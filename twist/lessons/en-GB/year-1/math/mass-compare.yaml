# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.mass-compare
skill: math.mass-capacity.compare-mass
curriculum: en-GB
language: en
title:
  de: Gewichte vergleichen
  en: Comparing mass
summary: >
  Lesson 1 compares two things by how heavy they are (heavier, lighter,
  as heavy as) by holding them, and learns that big is not always heavy;
  lesson 2 reads a balance (the heavier side goes down, a level balance
  means the same mass), measures with cubes on a balance, orders three
  things from the lightest to the heaviest, and ends with the skill
  check. The balance is described in words and pictures side by side; a
  drawn balance waits for a component.
metadata:
  year: year-1
  topic: { de: Gewichte, en: Mass }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.compare-to-20]
  also_practises: [math.numbers-to-20.compare-to-20]
  vocabulary: { en: [heavy, heavier, heaviest, light, lighter, lightest, as heavy as, the same mass, balance, goes down, goes up, level] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: compare, what: { de: zwei Dinge nach dem Gewicht vergleichen, en: comparing two things by how heavy they are } }
    - { id: balance, what: { de: "an der Balkenwaage ablesen, was schwerer ist", en: reading a balance to see which is heavier } }
    - { id: cubes, what: { de: mit Würfeln auf der Waage vergleichen, en: comparing masses in cubes on a balance } }
    - { id: order, what: { de: drei Dinge nach dem Gewicht ordnen, en: putting three things in order of mass } }
  misconceptions:
    - id: big-is-heavy
      what: Thinks the bigger thing is always heavier (a big balloon is heavier than a small marble)
      addressed: lesson 1 Learn holds a balloon and a marble; l1-f3 (with feedback), l1-s3, l1-n3 and l2-c4 put a big light thing next to a small heavy one
    - id: balance-up-is-heavy
      what: Reads the side of the balance that goes up as the heavier one
      addressed: lesson 2 Learn says the heavier side goes down; l2-f1 (with feedback), l2-s1, l2-n1 and l2-c2 ask which side is heavier
    - id: more-cubes-lighter
      what: Thinks that the thing that needs more cubes to balance is lighter
      addressed: lesson 2 Learn balances an apple with 8 cubes and a banana with 6; l2-f3 (with feedback), l2-s3 and l2-n3 compare by cubes
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Schwerer und leichter", en: "Heavier and lighter" }
    goal:
      de: "Finde heraus, was schwerer oder leichter ist, auch wenn etwas Großes leicht ist, so wie ein Luftballon."
      en: "Find which is heavier or lighter, even when a big thing is light, like a balloon."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is more: 14 or 11?"
            say: "Which is more, fourteen or eleven?"
            options: ["14", "11"]
            answer: "14"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which is less: 18 or 20?"
            say: "Which is less, eighteen or twenty?"
            options: ["18", "20"]
            answer: "18"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The book is heavier than the pencil."
            say: "Hold a book in one hand and a pencil in the other. The book pulls your hand down more. The book is heavier. The pencil is lighter."
            show: { objects: [book, pencil] }
          - text: "Big is not always heavy."
            say: "A balloon is big, but it is very light. A marble is small, but it is heavier than the balloon. We cannot tell how heavy something is just by looking at its size."
            show: { objects: [balloon, marble] }
          - text: "as heavy as"
            say: "If two things feel the same in your hands, they are as heavy as each other. They have the same mass."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is heavier: an apple or a car?"
                say: "Which is heavier, an apple or a car?"
                show: { objects: [apple, car] }
                options: ["a car", "an apple", "the same"]
                answer: "a car"
                hints:
                  - "Could you lift each one?"
                  - "You can hold an apple in one hand. Nobody can lift a car."
                  - "A car is heavier."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which is lighter: a leaf or a book?"
                say: "Which is lighter, a leaf or a book?"
                show: { objects: [leaf, book] }
                options: ["a leaf", "a book", "the same"]
                answer: "a leaf"
                hints:
                  - "Lighter means not as heavy."
                  - "A leaf can blow away in the wind."
                  - "A leaf is lighter."
              - id: l1-f3
                type: multiple_choice
                text: "Which is heavier: a big balloon or a small stone?"
                say: "Which is heavier, a big balloon or a small stone?"
                options: ["a small stone", "a big balloon", "the same"]
                answer: "a small stone"
                feedback:
                  "a big balloon": "The balloon is bigger, but it is full of air and very light. The stone is small but heavier."
                hints:
                  - "Big does not always mean heavy."
                  - "A balloon floats up when you let go. A stone drops."
                  - "The small stone is heavier."
              - id: l1-f4
                type: true_false
                text: "Is it true? A feather is heavier than an elephant."
                say: "A feather is heavier than an elephant. Is that true?"
                answer: false
                hints:
                  - "Imagine holding each one."
                  - "An elephant is one of the heaviest animals."
                  - "No. The elephant is heavier."
              - id: l1-f5
                type: multiple_choice
                text: "Two bags of sugar are the same. What is true?"
                say: "Two bags of sugar are exactly the same. What is true?"
                options: ["They are as heavy as each other.", "The first bag is heavier.", "The second bag is heavier."]
                answer: "They are as heavy as each other."
                hints:
                  - "Same bags, same sugar."
                  - "They would feel the same in your hands."
                  - "They are as heavy as each other."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is heavier: a mouse or a dog?"
                say: "Which is heavier, a mouse or a dog?"
                show: { objects: [mouse, dog] }
                options: ["a dog", "a mouse", "the same"]
                answer: "a dog"
                hints: ["Which could you hold in one hand?"]
              - id: l1-s2
                type: multiple_choice
                text: "Which is lighter: a sock or a shoe?"
                say: "Which is lighter, a sock or a shoe?"
                show: { objects: [sock, shoe] }
                options: ["a sock", "a shoe", "the same"]
                answer: "a sock"
                hints: ["Lighter means not as heavy."]
              - id: l1-s3
                type: true_false
                text: "Is it true? The big pillow is heavier than the small tin of beans."
                say: "The big pillow is heavier than the small tin of beans. Is that true?"
                answer: false
                hints: ["Big does not always mean heavy."]
              - id: l1-s4
                type: multiple_choice
                text: "Max's bag is heavier than Ivy's. What else is true?"
                say: "Max's bag is heavier than Ivy's bag. What else is true?"
                options: ["Ivy's bag is lighter than Max's.", "Ivy's bag is heavier than Max's.", "The bags are as heavy as each other."]
                answer: "Ivy's bag is lighter than Max's."
                hints: ["Turn the sentence round: heavier becomes lighter."]
              - id: l1-s5
                type: multiple_choice
                text: "Which is heavier: a bike or a ball?"
                say: "Which is heavier, a bike or a ball?"
                show: { objects: [bike, ball] }
                options: ["a bike", "a ball", "the same"]
                answer: "a bike"
                hints: ["Which is harder to lift?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is heavier: a cat or a horse?"
                say: "Which is heavier, a cat or a horse?"
                options: ["a horse", "a cat", "the same"]
                answer: "a horse"
              - id: l1-n2
                type: multiple_choice
                text: "Which is lighter: a crayon or a chair?"
                say: "Which is lighter, a crayon or a chair?"
                show: { objects: [crayon, chair] }
                options: ["a crayon", "a chair", "the same"]
                answer: "a crayon"
              - id: l1-n3
                type: multiple_choice
                text: "Which is heavier: a big empty box or a small full tin of beans?"
                say: "Which is heavier, a big empty cardboard box or a small full tin of beans?"
                options: ["the tin of beans", "the empty box", "the same"]
                answer: "the tin of beans"
              - id: l1-n4
                type: true_false
                text: "Is it true? A bus is heavier than a bike."
                say: "A bus is heavier than a bike. Is that true?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "The jug is lighter than the bucket. What else is true?"
                say: "The jug is lighter than the bucket. What else is true?"
                options: ["The bucket is heavier than the jug.", "The bucket is lighter than the jug.", "They are as heavy as each other."]
                answer: "The bucket is heavier than the jug."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is heavier: a strawberry or a pumpkin?"
            say: "Which is heavier, a strawberry or a pumpkin?"
            options: ["a pumpkin", "a strawberry", "the same"]
            answer: "a pumpkin"
          - id: l1-c2
            type: true_false
            text: "Is it true? A big thing is always heavier than a small thing."
            say: "A big thing is always heavier than a small thing. Is that true?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Which is lighter: a spoon or a table?"
            say: "Which is lighter, a spoon or a table?"
            show: { objects: [spoon, table] }
            options: ["a spoon", "a table", "the same"]
            answer: "a spoon"
          - id: l1-c4
            type: multiple_choice
            text: "Which is heavier: a fish or a whale?"
            say: "Which is heavier, a fish or a whale?"
            show: { objects: [fish, whale] }
            options: ["a whale", "a fish", "the same"]
            answer: "a whale"
          - id: l1-c5
            type: true_false
            text: "Is it true? A bag of sugar is lighter than a feather."
            say: "A bag of sugar is lighter than a feather. Is that true?"
            show: { objects: [bag-of-sugar, feather] }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Which is lighter: a bed or a pillow?"
            say: "Which is lighter, a bed or a pillow?"
            options: ["a pillow", "a bed", "the same"]
            answer: "a pillow"

  - n: 2
    title: { de: "Mit der Balkenwaage", en: "Using a balance" }
    goal:
      de: "Vergleich mit einer Balkenwaage, wie schwer Dinge sind, denn die schwerere Seite geht nach unten."
      en: "Use a balance to compare how heavy things are, where the heavier side goes down."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is heavier: a lamp or a leaf?"
            say: "Which is heavier, a lamp or a leaf?"
            show: { objects: [lamp, leaf] }
            options: ["a lamp", "a leaf", "the same"]
            answer: "a lamp"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? A balloon is big, so it is heavy."
            say: "A balloon is big, so it is heavy. Is that true?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The heavier side goes down."
            say: "A balance has two pans. Put one thing in each pan. The heavier side goes down. The lighter side goes up."
          - text: "Level: the same mass"
            say: "If the balance is level, with both sides at the same height, the two things are as heavy as each other."
          - text: "Apple: 8 cubes. Banana: 6 cubes."
            say: "We can balance a thing with cubes. The apple balances eight cubes. The banana balances six cubes. Eight is more than six, so the apple is heavier."
            show: { objects: [apple, banana] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The apple is on the left. The egg is on the right. The left side goes down. Which is heavier?"
                say: "An apple is on the left of the balance and an egg on the right. The left side goes down. Which is heavier?"
                show: { objects: [apple, egg] }
                options: ["the apple", "the egg", "the same"]
                answer: "the apple"
                feedback:
                  "the egg": "The egg side goes up, so the egg is lighter. The apple side goes down, so the apple is heavier."
                hints:
                  - "The heavier side goes down."
                  - "Which side went down?"
                  - "The apple."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "A toy car and a cup are on the balance. It is level. What is true?"
                say: "A toy car and a cup are on the balance. It is level. What is true?"
                options: ["They are as heavy as each other.", "The car is heavier.", "The cup is heavier."]
                answer: "They are as heavy as each other."
                hints:
                  - "Level means neither side went down."
                  - "Both sides are at the same height."
                  - "They are as heavy as each other."
              - id: l2-f3
                type: multiple_choice
                text: "The book balances 9 cubes. The pencil case balances 5 cubes. Which is heavier?"
                say: "The book balances nine cubes. The pencil case balances five cubes. Which is heavier?"
                options: ["the book", "the pencil case", "the same"]
                answer: "the book"
                feedback:
                  "the pencil case": "It takes more cubes to balance the book, so the book is heavier."
                hints:
                  - "More cubes means heavier."
                  - "Nine is more than five."
                  - "The book."
              - id: l2-f4
                type: ordering
                text: "Teddy: 7 cubes. Ball: 3 cubes. Shoe: 10 cubes. Put them in order. Start with the lightest."
                say: "The teddy balances seven cubes. The ball balances three cubes. The shoe balances ten cubes. Put them in order, starting with the lightest."
                options: ["shoe", "teddy", "ball"]
                slot_count: 3
                answer: ["ball", "teddy", "shoe"]
                hints:
                  - "The fewest cubes is the lightest."
                  - "Three is the fewest, ten is the most."
                  - "ball, teddy, shoe."
              - id: l2-f5
                type: true_false
                text: "Is it true? The side of the balance that goes up has the heavier thing."
                say: "The side of the balance that goes up has the heavier thing on it. Is that true?"
                answer: false
                hints:
                  - "Think of a seesaw with a grown-up and a child."
                  - "The heavy side sinks down."
                  - "No. The heavier side goes down."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The sock is on the left. The shoe is on the right. The right side goes down. Which is heavier?"
                say: "A sock is on the left of the balance and a shoe on the right. The right side goes down. Which is heavier?"
                show: { objects: [sock, shoe] }
                options: ["the shoe", "the sock", "the same"]
                answer: "the shoe"
                hints: ["The heavier side goes down."]
              - id: l2-s2
                type: multiple_choice
                text: "A pear and an orange are on the balance. It is level. What is true?"
                say: "A pear is on one side of the balance and an orange on the other. The balance is level. What is true?"
                show: { objects: [pear, orange] }
                options: ["They have the same mass.", "The pear is heavier.", "The orange is heavier."]
                answer: "They have the same mass."
                hints: ["Level means the same."]
              - id: l2-s3
                type: multiple_choice
                text: "The carrot balances 4 cubes. The tomato balances 6 cubes. Which is lighter?"
                say: "The carrot balances four cubes. The tomato balances six cubes. Which is lighter?"
                show: { objects: [carrot, tomato] }
                options: ["the carrot", "the tomato", "the same"]
                answer: "the carrot"
                hints: ["Fewer cubes means lighter."]
              - id: l2-s4
                type: ordering
                text: "Cup: 5 cubes. Jug: 12 cubes. Spoon: 2 cubes. Put them in order. Start with the heaviest."
                say: "The cup balances five cubes. The jug balances twelve cubes. The spoon balances two cubes. Put them in order, starting with the heaviest."
                options: ["spoon", "cup", "jug"]
                slot_count: 3
                answer: ["jug", "cup", "spoon"]
                hints: ["The most cubes is the heaviest."]
              - id: l2-s5
                type: true_false
                text: "Is it true? The book side goes down, so the book is heavier than the leaf."
                say: "A book and a leaf are on the balance. The book side goes down, so the book is heavier. Is that true?"
                answer: true
                hints: ["The heavier side goes down."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The marble is on the left. The feather is on the right. The left side goes down. Which is lighter?"
                say: "A marble is on the left of the balance and a feather on the right. The left side goes down. Which is lighter?"
                options: ["the feather", "the marble", "the same"]
                answer: "the feather"
              - id: l2-n2
                type: multiple_choice
                text: "The ball and the box are on the balance. It is level. What is true?"
                say: "A ball and a box are on the balance. It is level. What is true?"
                show: { objects: [ball, box] }
                options: ["They are as heavy as each other.", "The ball is heavier.", "The box is heavier."]
                answer: "They are as heavy as each other."
              - id: l2-n3
                type: multiple_choice
                text: "The mug balances 11 cubes. The bowl balances 15 cubes. Which is heavier?"
                say: "The mug balances eleven cubes. The bowl balances fifteen cubes. Which is heavier?"
                options: ["the bowl", "the mug", "the same"]
                answer: "the bowl"
              - id: l2-n4
                type: ordering
                text: "Pear: 9 cubes. Grape: 1 cube. Banana: 6 cubes. Put them in order. Start with the lightest."
                say: "The pear balances nine cubes. The grape balances one cube. The banana balances six cubes. Put them in order, starting with the lightest."
                options: ["banana", "pear", "grape"]
                slot_count: 3
                answer: ["grape", "banana", "pear"]
              - id: l2-n5
                type: true_false
                text: "Is it true? The rubber balances 3 cubes and the pencil balances 3 cubes. They have the same mass."
                say: "The rubber balances three cubes and the pencil balances three cubes. They have the same mass. Is that true?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: compare
            type: multiple_choice
            text: "Which is heavier: a pony or a rabbit?"
            say: "Which is heavier, a pony or a rabbit?"
            show: { objects: [pony, rabbit] }
            options: ["a pony", "a rabbit", "the same"]
            answer: "a pony"
          - id: l2-c2
            part: balance
            type: multiple_choice
            text: "The cheese is on the left. The bread is on the right. The right side goes down. Which is heavier?"
            say: "Cheese is on the left of the balance and bread on the right. The right side goes down. Which is heavier?"
            show: { objects: [cheese, bread] }
            options: ["the bread", "the cheese", "the same"]
            answer: "the bread"
          - id: l2-c3
            part: order
            type: ordering
            text: "Boot: 14 cubes. Hat: 4 cubes. Book: 8 cubes. Put them in order. Start with the heaviest."
            say: "The boot balances fourteen cubes. The hat balances four cubes. The book balances eight cubes. Put them in order, starting with the heaviest."
            options: ["hat", "book", "boot"]
            slot_count: 3
            answer: ["boot", "book", "hat"]
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Which is heavier: a big beach ball or a small brick?"
            say: "Which is heavier, a big beach ball or a small brick?"
            options: ["a small brick", "a big beach ball", "the same"]
            answer: "a small brick"
          - id: l2-c5
            part: balance
            type: multiple_choice
            text: "Two toys are on the balance. It is level. What does that tell you?"
            say: "Two toys are on the balance. It is level. What does that tell you?"
            options: ["The toys have the same mass.", "The left toy is heavier.", "The right toy is heavier."]
            answer: "The toys have the same mass."
          - id: l2-c6
            part: compare
            type: multiple_choice
            text: "Which is lighter: a feather or a shoe?"
            say: "Which is lighter, a feather or a shoe?"
            show: { objects: [feather, shoe] }
            options: ["a feather", "a shoe", "the same"]
            answer: "a feather"
          - id: l2-c7
            part: compare
            type: true_false
            text: "Is it true? A car is heavier than a teddy."
            say: "A car is heavier than a teddy. Is that true?"
            show: { objects: [car, teddy] }
            answer: true
          - id: l2-c8
            part: compare
            type: true_false
            text: "Is it true? The big empty paper bag is heavier than the small brick."
            say: "The big empty paper bag is heavier than the small brick. Is that true?"
            answer: false
          - id: l2-c9
            part: balance
            type: multiple_choice
            text: "The pencil is on the left. The book is on the right. The right side goes down. Which is lighter?"
            say: "A pencil is on the left of the balance and a book on the right. The right side goes down. Which is lighter?"
            show: { objects: [pencil, book] }
            options: ["the pencil", "the book", "the same"]
            answer: "the pencil"
          - id: l2-c10
            part: balance
            type: true_false
            text: "Is it true? When a balance is level, both things have the same mass."
            say: "When a balance is level, both things have the same mass. Is that true?"
            answer: true
          - id: l2-c11
            part: balance
            type: multiple_choice
            text: "An empty cup is on the left. A full jug of water is on the right. Which side goes down?"
            say: "An empty cup is on the left of the balance. A full jug of water is on the right. Which side goes down?"
            show: { objects: [cup, jug] }
            options: ["the jug side", "the cup side", "neither side"]
            answer: "the jug side"
          - id: l2-c12
            part: cubes
            type: multiple_choice
            text: "The orange balances 7 cubes. The pear balances 5 cubes. Which is heavier?"
            say: "The orange balances seven cubes. The pear balances five cubes. Which is heavier?"
            show: { objects: [orange, pear] }
            options: ["the orange", "the pear", "the same"]
            answer: "the orange"
          - id: l2-c13
            part: cubes
            type: multiple_choice
            text: "The shoe balances 12 cubes. The sock balances 2 cubes. Which is lighter?"
            say: "The shoe balances twelve cubes. The sock balances two cubes. Which is lighter?"
            options: ["the sock", "the shoe", "the same"]
            answer: "the sock"
          - id: l2-c14
            part: cubes
            type: true_false
            text: "Is it true? The toy car balances 6 cubes and the teddy balances 9 cubes. The car is heavier."
            say: "The toy car balances six cubes and the teddy balances nine cubes. The car is heavier. Is that true?"
            answer: false
          - id: l2-c15
            part: cubes
            type: multiple_choice
            text: "The tomato balances 6 cubes. The egg is lighter than the tomato. How many cubes could the egg balance?"
            say: "The tomato balances six cubes. The egg is lighter than the tomato. How many cubes could the egg balance?"
            options: ["4", "6", "9"]
            answer: "4"
          - id: l2-c16
            part: cubes
            type: multiple_choice
            text: "The bag balances 10 cubes. The box balances 13 cubes. Which is heavier?"
            say: "The bag balances ten cubes. The box balances thirteen cubes. Which is heavier?"
            options: ["the box", "the bag", "the same"]
            answer: "the box"
          - id: l2-c17
            part: order
            type: ordering
            text: "Pen: 2 cubes. Book: 9 cubes. Cup: 5 cubes. Put them in order. Start with the lightest."
            say: "The pen balances two cubes. The book balances nine cubes. The cup balances five cubes. Put them in order, starting with the lightest."
            options: ["book", "cup", "pen"]
            slot_count: 3
            answer: ["pen", "cup", "book"]
          - id: l2-c18
            part: order
            type: ordering
            text: "Put them in order. Start with the heaviest."
            say: "Put them in order: a car, a cat and a feather. Start with the heaviest."
            options: ["cat", "feather", "car"]
            slot_count: 3
            answer: ["car", "cat", "feather"]
          - id: l2-c19
            part: order
            type: multiple_choice
            text: "The dog is heavier than the cat. The cat is heavier than the mouse. Which is the lightest?"
            say: "The dog is heavier than the cat. The cat is heavier than the mouse. Which is the lightest?"
            options: ["the mouse", "the cat", "the dog"]
            answer: "the mouse"
          - id: l2-c20
            part: order
            type: multiple_choice
            text: "Which is the heaviest: a bike, a bus or a ball?"
            say: "Which is the heaviest, a bike, a bus or a ball?"
            options: ["a bus", "a bike", "a ball"]
            answer: "a bus"
