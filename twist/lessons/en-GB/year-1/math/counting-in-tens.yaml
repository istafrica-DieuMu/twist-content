# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.counting-in-tens
skill: math.numbers-to-100.tens
curriculum: en-GB
language: en
title:
  de: In Zehnerschritten zählen
  en: Counting in tens
summary: >
  The multiples of ten to 100: counting tens, reading and writing them,
  and putting them in order. Lesson 1 counts tens rods (three tens make
  thirty) and matches number words to numerals (each word card says
  itself when tapped); lesson 2 counts on and
  back in tens, orders the tens and tells fifty from fifteen, and ends
  with the skill check.
metadata:
  year: year-1
  topic: { de: Zehnerzahlen, en: Counting in tens }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.teens]
  also_practises: [math.numbers-to-20.order-to-20]
  vocabulary: { en: [ten, tens, twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety, one hundred, count in tens] }
  forms: [drawn, picture, text, audio]
  drawn: [base-ten, number-line]
  facets: []
  parts:
    - { id: rods, what: { de: "Zehnerstangen zählen und sagen, wie viele Zehner eine Zahl hat", en: counting tens rods and saying how many tens make a number } }
    - { id: read, what: { de: "Zehnerzahlen lesen, hören und schreiben", en: "reading, hearing and writing the multiples of ten" } }
    - { id: count, what: { de: in Zehnerschritten vorwärts und rückwärts zählen, en: counting on and back in tens } }
    - { id: order, what: { de: Zehnerzahlen ordnen, en: ordering the multiples of ten } }
  misconceptions:
    - id: teen-ty
      what: Mixes up fifteen and fifty, sixteen and sixty
      addressed: lesson 2 Learn sets fifteen against fifty; a -teen against -ty listening task in every stage of lesson 2 and in the skill check (l2-c2), with feedback in l2-f2; l1-s4 says five tens make fifteen (false)
    - id: count-rods-as-ones
      what: Counts tens rods as ones (three rods are 3)
      addressed: lesson 1 Learn counts the rods as ten, twenty, thirty, forty; every stage of lesson 1 and the quick check has a rods task with the number of rods as an option, with feedback in l1-f1; the skill check (l2-c1) sets six rods against six cubes
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner zählen, en: Counting tens }
    goal:
      de: "Zähl Stangen in Zehnern, zehn, zwanzig, dreißig, und finde heraus, dass zehn Zehner 100 sind."
      en: "Count rods in tens, ten, twenty, thirty, and find out that ten tens make 100."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many?"
            say: "How many cubes are there?"
            show: { drawn: base-ten, tens: 1, ones: 3 }
            options: ["13", "4", "31"]
            answer: "13"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which number is ten?"
            say: "Which number is ten?"
            options: ["10", "1", "100"]
            answer: "10"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "How many cubes in this rod?"
            say: "Here is a rod made of cubes stuck together. How many cubes do you think are in it? Have a guess."
            show: { drawn: base-ten, tens: 1, ones: 0 }
          - text: "10, 20, 30, 40"
            say: "Ten! This rod is one ten. Let's count the rods in tens: ten, twenty, thirty, forty. Four tens make forty."
            show: { drawn: base-ten, tens: 4, ones: 0 }
          - text: "10 tens = 100"
            say: "Keep going: fifty, sixty, seventy, eighty, ninety, one hundred. Ten tens make one hundred."
            show: { drawn: base-ten, tens: 10, ones: 0 }
          - text: "Did you know? 10 years make a decade. 100 years make a century."
            say: "Did you know? Ten years have a special name: a decade. And one hundred years, ten decades, is called a century. When someone turns one hundred, they have lived for a whole century!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many?"
                say: "Count the rods in tens. How many cubes are there?"
                show: { drawn: base-ten, tens: 3, ones: 0 }
                options: ["30", "3", "13"]
                answer: "30"
                feedback:
                  "3": "There are three rods, but each rod is ten. Count ten, twenty, thirty."
                hints:
                  - "Each rod is ten."
                  - "Count: ten, twenty, …"
                  - "Ten, twenty, thirty. 30."
                difficulty: easy
              - id: l1-f2
                type: matching
                option_audio: false
                text: "Match the number to its word."
                say: "Tap a word to hear it. Then find its number."
                pairs:
                  - { left: { text: "20" }, right: { text: "twenty", say: "Twenty." } }
                  - { left: { text: "50" }, right: { text: "fifty", say: "Fifty." } }
                  - { left: { text: "80" }, right: { text: "eighty", say: "Eighty." } }
                hints:
                  - "Tap a word and listen."
                  - "Twenty starts like two. Find the number that starts with a 2."
                  - "20 is twenty, 50 is fifty, 80 is eighty."
              - id: l1-f3
                type: text_input
                text: "How many?"
                say: "Count the rods in tens. How many cubes are there? Type the number."
                show: { drawn: base-ten, tens: 6, ones: 0 }
                answer: "60"
                hints:
                  - "Count the rods in tens."
                  - "Ten, twenty, thirty, forty, fifty, …"
                  - "Sixty. Type 60."
              - id: l1-f4
                type: true_false
                text: "Is it true? 7 tens = 70"
                say: "Seven tens make seventy. Is that true?"
                answer: true
                hints:
                  - "Count seven tens."
                  - "Ten, twenty, thirty, forty, fifty, sixty, seventy."
                  - "Yes, seven tens make seventy."
              - id: l1-f5
                type: multiple_choice
                text: "How many tens make 20?"
                say: "How many tens make twenty?"
                options: ["2", "20", "12"]
                answer: "2"
                hints:
                  - "Count in tens until you reach twenty. Count the tens on your fingers."
                  - "Ten is one ten. Twenty is the next one."
                  - "Ten, twenty. Two tens make twenty."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many?"
                say: "Count the rods in tens. How many cubes are there?"
                show: { drawn: base-ten, tens: 5, ones: 0 }
                options: ["5", "15", "50"]
                answer: "50"
                hints: ["How much is each rod worth?"]
              - id: l1-s2
                type: matching
                option_audio: false
                text: "Match the number to its word."
                say: "Tap a word to hear it. Then find its number."
                pairs:
                  - { left: { text: "30" }, right: { text: "thirty", say: "Thirty." } }
                  - { left: { text: "70" }, right: { text: "seventy", say: "Seventy." } }
                  - { left: { text: "90" }, right: { text: "ninety", say: "Ninety." } }
                hints: ["Listen to the start of each word. It sounds like a number you know."]
              - id: l1-s3
                type: text_input
                text: "How many?"
                say: "Count the rods in tens. How many cubes are there? Type the number."
                show: { drawn: base-ten, tens: 8, ones: 0 }
                answer: "80"
                hints: ["Count the rods in tens."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 5 tens = 15"
                say: "Five tens make fifteen. Is that true?"
                answer: false
                hints: ["Count five tens: ten, twenty, …"]
              - id: l1-s5
                type: multiple_choice
                text: "Crayons come in boxes of 10. How many boxes make 90 crayons?"
                say: "Crayons come in boxes of ten. How many boxes make ninety crayons?"
                show: { object: crayon, count: 10 }
                options: ["90", "9", "19"]
                answer: "9"
                hints: ["Count in tens until you reach ninety."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many?"
                say: "Count the rods in tens. How many cubes are there?"
                show: { drawn: base-ten, tens: 2, ones: 0 }
                options: ["12", "20", "2"]
                answer: "20"
              - id: l1-n2
                type: matching
                option_audio: false
                text: "Match the number to its word."
                say: "Tap a word to hear it. Then find its number."
                pairs:
                  - { left: { text: "40" }, right: { text: "forty", say: "Forty." } }
                  - { left: { text: "60" }, right: { text: "sixty", say: "Sixty." } }
                  - { left: { text: "100" }, right: { text: "one hundred", say: "One hundred." } }
              - id: l1-n3
                type: text_input
                text: "How many?"
                say: "Count the rods in tens. How many cubes are there? Type the number."
                show: { drawn: base-ten, tens: 9, ones: 0 }
                answer: "90"
              - id: l1-n4
                type: true_false
                text: "Is it true? 8 tens = 80"
                say: "Eight tens make eighty. Is that true?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Stickers come in sheets of 10. How many sheets make 70 stickers?"
                say: "Stickers come in sheets of ten. How many sheets make seventy stickers?"
                options: ["17", "7", "70"]
                answer: "7"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many?"
            say: "How many cubes are there?"
            show: { drawn: base-ten, tens: 9, ones: 0 }
            options: ["90", "9", "19"]
            answer: "90"
          - id: l1-c2
            type: text_input
            text: "How many?"
            say: "How many cubes are there? Type the number."
            show: { drawn: base-ten, tens: 7, ones: 0 }
            answer: "70"
          - id: l1-c3
            type: multiple_choice
            text: "How many tens make 60?"
            say: "How many tens make sixty?"
            options: ["6", "60", "16"]
            answer: "6"
          - id: l1-c4
            type: multiple_choice
            text: "How many?"
            say: "How many cubes are there?"
            show: { drawn: base-ten, tens: 8, ones: 0 }
            options: ["80", "8", "18"]
            answer: "80"
          - id: l1-c5
            type: true_false
            text: "Is it true? 3 tens = 30"
            say: "Three tens make thirty. Is that true?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "How many tens make 40?"
            say: "How many tens make forty?"
            options: ["4", "40", "14"]
            answer: "4"

  - n: 2
    title: { de: Vorwärts und rückwärts, en: Counting on and back }
    goal:
      de: "Zähl in Zehnern vorwärts und rückwärts und hör den Unterschied zwischen fünfzehn und fünfzig."
      en: "Count on and back in tens, and hear the difference between fifteen and fifty."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many?"
            say: "How many cubes are there?"
            show: { drawn: base-ten, tens: 3, ones: 0 }
            options: ["3", "30", "13"]
            answer: "30"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many tens make 50?"
            say: "How many tens make fifty?"
            options: ["5", "50", "15"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "20, 30, 40, _ ?"
            say: "Twenty, thirty, forty. What do you think comes next? Have a guess."
            show: { drawn: number-line, from: 0, to: 100, labels: tens, step: 10 }
          - text: "20, 30, 40, 50"
            say: "Fifty! Counting on in tens, each number is ten more: twenty, thirty, forty, fifty."
            show: { drawn: number-line, from: 0, to: 100, labels: tens, step: 10 }
          - text: "90, 80, 70, 60"
            say: "Counting back in tens, each number is ten less: ninety, eighty, seventy, sixty."
            show: { drawn: number-line, from: 0, to: 100, labels: tens, step: 10 }
          - text: "15 fifteen · 50 fifty"
            say: "Listen carefully. Fifteen ends in teen. It is one ten and five ones. Fifty has no teen at the end. It is five tens."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "30, 40, 50, _"
                say: "Count on in tens. Thirty, forty, fifty. What comes next?"
                options: ["60", "51", "55", "a banana"]
                answer: "60"
                feedback:
                  "a banana": "A banana is not a number, silly! Fifty and ten more is sixty."
                hints:
                  - "Each number is ten more."
                  - "Fifty and ten more."
                  - "Sixty."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which number do you hear?"
                say: "Listen. Which number do you hear?"
                audio: { en: "Sixty." }
                options: ["60", "16", "6"]
                answer: "60"
                option_audio: false
                feedback:
                  "16": "Sixteen ends in teen. You heard sixty. It has no teen at the end, so it is six tens."
                  "6": "Six is just six ones. You heard sixty, which is six tens."
                hints:
                  - "Listen to the end of the word."
                  - "Does it end in teen?"
                  - "No teen at the end. Sixty, six tens, 60."
              - id: l2-f3
                type: ordering
                text: "Put the numbers in order, smallest first."
                say: "Put the numbers in order. Start with the smallest."
                options: ["70", "40", "90", "20"]
                slot_count: 4
                answer: ["20", "40", "70", "90"]
                option_audio: false
                hints:
                  - "Count the tens in each number."
                  - "Twenty has the fewest tens."
                  - "20, 40, 70, 90."
              - id: l2-f4
                type: multiple_choice
                text: "70, 60, 50, _"
                say: "Count back in tens. Seventy, sixty, fifty. What comes next?"
                options: ["49", "40", "30"]
                answer: "40"
                hints:
                  - "Each number is ten less."
                  - "What is ten less than fifty?"
                  - "Forty."
              - id: l2-f5
                type: fill_in_blank
                text: "Fill the gap."
                say: "Count on in tens. Which number is missing?"
                frame: "10, 20, _, 40"
                options: ["30", "25", "21"]
                answer: ["30"]
                hints:
                  - "What comes after twenty when you count in tens?"
                  - "Twenty and ten more."
                  - "Thirty."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "50, 60, 70, _"
                say: "Count on in tens. Fifty, sixty, seventy. What comes next?"
                options: ["71", "80", "75"]
                answer: "80"
                hints: ["How much more is each number?"]
              - id: l2-s2
                type: audio_choice
                text: "Which number do you hear?"
                say: "Listen. Which number do you hear?"
                audio: { en: "Fourteen." }
                options: ["40", "14", "4"]
                answer: "14"
                option_audio: false
                hints: ["Listen to the end. Does it end in teen?"]
              - id: l2-s3
                type: ordering
                text: "Put the numbers in order, smallest first."
                say: "Put the numbers in order. Start with the smallest."
                options: ["60", "100", "30", "50"]
                slot_count: 4
                answer: ["30", "50", "60", "100"]
                option_audio: false
                hints: ["Which number has the fewest tens?"]
              - id: l2-s4
                type: multiple_choice
                text: "100, 90, 80, _"
                say: "Count back in tens. One hundred, ninety, eighty. What comes next?"
                options: ["70", "79", "60"]
                answer: "70"
                hints: ["Are you counting on or back?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Fill the gap."
                say: "Count on in tens. Which number is missing?"
                frame: "40, 50, _, 70"
                options: ["55", "60", "51"]
                answer: ["60"]
                hints: ["What is ten more than fifty?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "60, 70, 80, _"
                say: "Count on in tens. Sixty, seventy, eighty. What comes next?"
                options: ["81", "100", "90"]
                answer: "90"
              - id: l2-n2
                type: audio_choice
                text: "Which number do you hear?"
                say: "Listen. Which number do you hear?"
                audio: { en: "Seventy." }
                options: ["17", "7", "70"]
                answer: "70"
                option_audio: false
              - id: l2-n3
                type: ordering
                text: "Put the numbers in order, largest first."
                say: "Put the numbers in order. Start with the largest."
                options: ["30", "80", "10", "50"]
                slot_count: 4
                answer: ["80", "50", "30", "10"]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "50, 40, 30, _"
                say: "Count back in tens. Fifty, forty, thirty. What comes next?"
                options: ["20", "29", "10"]
                answer: "20"
              - id: l2-n5
                type: fill_in_blank
                text: "Fill the gap."
                say: "Count back in tens. Which number is missing?"
                frame: "60, 50, _, 30"
                options: ["40", "45", "49"]
                answer: ["40"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: rods
            type: image_multiple_choice
            text: "Which shows 60?"
            say: "Which picture shows sixty?"
            options:
              - { drawn: base-ten, tens: 1, ones: 6 }
              - { drawn: base-ten, tens: 0, ones: 6 }
              - { drawn: base-ten, tens: 6, ones: 0 }
            answer: "60"
          - id: l2-c2
            part: read
            type: audio_choice
            text: "Which number do you hear?"
            say: "Listen carefully. Which number is it?"
            audio: { en: "Thirty." }
            options: ["13", "30", "3"]
            answer: "30"
            option_audio: false
          - id: l2-c3
            part: count
            type: multiple_choice
            text: "70, 80, 90, _"
            say: "Count on in tens. Seventy, eighty, ninety. What comes next?"
            options: ["100", "91", "95"]
            answer: "100"
          - id: l2-c4
            part: order
            type: ordering
            text: "Put the numbers in order, smallest first."
            say: "Put these numbers in order, starting with the smallest."
            options: ["90", "20", "60", "40"]
            slot_count: 4
            answer: ["20", "40", "60", "90"]
            option_audio: false
          - id: l2-c5
            part: count
            type: fill_in_blank
            text: "Fill the gap."
            say: "Count back in tens. Which number is missing?"
            frame: "80, _, 60, 50"
            options: ["70", "75", "79"]
            answer: ["70"]
          - id: l2-c6
            part: rods
            type: text_input
            text: "How many?"
            say: "Count the rods in tens. How many cubes are there? Type the number."
            show: { drawn: base-ten, tens: 4, ones: 0 }
            answer: "40"
          - id: l2-c7
            part: rods
            type: multiple_choice
            text: "How many tens make 80?"
            say: "How many tens make eighty?"
            options: ["8", "80", "18"]
            answer: "8"
          - id: l2-c8
            part: rods
            type: true_false
            text: "Is it true? 6 tens = 16"
            say: "Six tens make sixteen. Is that true?"
            answer: false
          - id: l2-c9
            part: rods
            type: multiple_choice
            text: "How many tens make 100?"
            say: "How many tens make one hundred?"
            options: ["10", "100", "1"]
            answer: "10"
          - id: l2-c10
            part: read
            type: audio_choice
            text: "Which number do you hear?"
            say: "Listen carefully. Which number is it?"
            audio: { en: "Fifty." }
            options: ["15", "50", "5"]
            answer: "50"
            option_audio: false
          - id: l2-c11
            part: read
            type: audio_choice
            text: "Which number do you hear?"
            say: "Listen carefully. Which number is it?"
            audio: { en: "Nineteen." }
            options: ["90", "19", "9"]
            answer: "19"
            option_audio: false
          - id: l2-c12
            part: read
            type: matching
            option_audio: false
            text: "Which word goes with each number? Match them."
            say: "Tap a word to hear it. Then match it to its number."
            pairs:
              - { left: { text: "10" }, right: { text: "ten", say: "Ten." } }
              - { left: { text: "60" }, right: { text: "sixty", say: "Sixty." } }
              - { left: { text: "90" }, right: { text: "ninety", say: "Ninety." } }
          - id: l2-c13
            part: read
            type: text_input
            text: "Write the number you hear."
            say: "Eighty. Write the number."
            answer: "80"
          - id: l2-c14
            part: count
            type: multiple_choice
            text: "40, 50, 60, _"
            say: "Count on in tens. Forty, fifty, sixty. What comes next?"
            options: ["70", "61", "65"]
            answer: "70"
          - id: l2-c15
            part: count
            type: fill_in_blank
            text: "Fill the gap."
            say: "Count back in tens. Which number is missing?"
            frame: "100, 90, _, 70"
            options: ["80", "85", "89"]
            answer: ["80"]
          - id: l2-c16
            part: count
            type: true_false
            text: "Is it true? 10 more than 70 is 80."
            say: "Ten more than seventy is eighty. Is that true?"
            answer: true
          - id: l2-c17
            part: order
            type: ordering
            text: "Put the numbers in order, largest first."
            say: "Put the numbers in order. Start with the largest."
            options: ["40", "100", "70", "20"]
            slot_count: 4
            answer: ["100", "70", "40", "20"]
            option_audio: false
          - id: l2-c18
            part: order
            type: multiple_choice
            text: "Which number is the largest?"
            say: "Which number is the largest?"
            options: ["30", "80", "60"]
            answer: "80"
            option_audio: false
          - id: l2-c19
            part: order
            type: point_on_line
            text: "Where is 60?"
            say: "Where is sixty on the number line?"
            show: { drawn: number-line, from: 0, to: 100, labels: ends, step: 10 }
            answer: 60
          - id: l2-c20
            part: order
            type: true_false
            text: "Is it true? 90 is smaller than 30."
            say: "Ninety is smaller than thirty. Is that true?"
            answer: false
