          - id: l2-c18
            part: two-facts
            type: multiple_choice
            text: "Ann is taller than Bob. Cal is taller than Ann. Who is the tallest?"
            say: "Ann is taller than Bob. Cal is taller than Ann. Who is the tallest?"
            options: ["Cal", "Ann", "Bob"]
            answer: "Cal"
          - id: l2-c19
            part: two-facts
            type: true_false
            text: "Is it true? The red rope is longer than the blue rope. The blue rope is longer than the green rope. So the green rope is the longest."
            say: "The red rope is longer than the blue rope. The blue rope is longer than the green rope. So the green rope is the longest. Is that true?"
            answer: false
          - id: l2-c20
            part: two-facts
            type: multiple_choice
            text: "The brown train is longer than the green train. The yellow train is longer than the brown train. Which train is the longest?"
            say: "The brown train is longer than the green train. The yellow train is longer than the brown train. Which train is the longest?"
            options: ["the yellow train", "the brown train", "the green train"]
            answer: "the yellow train"
