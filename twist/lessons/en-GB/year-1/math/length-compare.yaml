# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.length-compare
skill: math.length.compare
curriculum: en-GB
language: en
title:
  de: Längen vergleichen
  en: Comparing lengths
summary: >
  Lesson 1 compares two things directly (longer, shorter, the same
  length) and learns to line them up at one end; lesson 2 uses taller and
  shorter for heights, orders three lengths from the shortest to the
  longest, and ends with the skill check. The lengths are everyday things
  and short stories; measuring comes in later skills.
metadata:
  year: year-1
  topic: { de: Längen, en: Length }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { en: [long, longer, longest, short, shorter, shortest, tall, taller, tallest, the same length, line up, end] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: two, what: { de: zwei Längen oder Höhen vergleichen, en: comparing two lengths or heights } }
    - { id: line-up, what: { de: beim Vergleichen an einem Ende anlegen, en: lining things up at one end to compare } }
    - { id: order, what: { de: drei Dinge der Länge oder Höhe nach ordnen, en: putting three things in order of length or height } }
    - { id: two-facts, what: { de: "aus zwei Sätzen schließen, was am längsten oder kürzesten ist", en: working out the longest or shortest from two sentences } }
  misconceptions:
    - id: ends-not-lined-up
      what: Compares two lengths without lining them up at one end and picks the one that sticks out further
      addressed: lesson 1 Learn lines up two pencils at one end; l1-f3 (with feedback), l1-s3 and l1-n3 ask how to compare fairly
    - id: longer-than-all
      what: Thinks that when A is longer than B, it is also the longest of three
      addressed: lesson 2 Learn orders three ribbons from two sentences; l2-f4 (with feedback), l2-s4 and l2-n4 give a wrong answer from the first sentence alone
    - id: long-tall-mixed
      what: Uses long and tall for the same thing, or calls a tall thing long when it stands up
      addressed: lesson 2 Learn says we use tall for things that stand up; l2-f1, l2-f2 (with feedback), l2-s1 and l2-n1 use taller and shorter for heights
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Länger, kürzer, gleich lang", en: "Longer, shorter, the same" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "The car is longer than the bike."
            say: "A car and a bike. The car is longer than the bike. The bike is shorter than the car."
            show: { objects: [car, bike] }
          - text: "Line them up at one end."
            say: "To compare two pencils, put them side by side with one end exactly level, like a start line. Then look at the other end. The one that goes further is longer."
          - text: "The two ribbons are the same length."
            say: "If both ends are level, the ribbons are the same length."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is longer: a train or a bike?"
                say: "Which is longer, a train or a bike?"
                options: ["a train", "a bike", "the same length"]
                answer: "a train"
                hints:
                  - "Think of a train at the station."
                  - "A train has lots of carriages, one behind the other."
                  - "A train is longer."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which is shorter: a crayon or a ladder?"
                say: "Which is shorter, a crayon or a ladder?"
                show: { objects: [crayon, ladder] }
                options: ["a crayon", "a ladder", "the same length"]
                answer: "a crayon"
                hints:
                  - "Shorter means not as long."
                  - "You can hold a crayon in one hand."
                  - "A crayon is shorter."
              - id: l1-f3
                type: multiple_choice
                text: "Lily wants to know which pencil is longer. What should she do?"
                say: "Lily wants to know which of two pencils is longer. What should she do?"
                options: ["Put them side by side with one end level.", "Put them down any way.", "Pick the thicker pencil."]
                answer: "Put them side by side with one end level."
                feedback:
                  "Pick the thicker pencil.": "Thick does not mean long. A thick pencil can be short."
                  "Put them down any way.": "If the ends do not start level, one pencil can look longer when it is not."
                hints:
                  - "To compare, both need the same start."
                  - "Then you can see which one goes further at the other end."
                  - "Put them side by side with one end level."
              - id: l1-f4
                type: true_false
                text: "Is it true? A spoon is longer than a table."
                say: "A spoon is longer than a table. Is that true?"
                show: { objects: [spoon, table] }
                answer: false
                hints:
                  - "Imagine them side by side."
                  - "Lots of spoons would fit along a table."
                  - "No, the table is longer."
              - id: l1-f5
                type: multiple_choice
                text: "Tom and Mia line up their ropes at one end. Tom's rope stops at the same place as Mia's. What is true?"
                say: "Tom and Mia line up their ropes at one end. Tom's rope stops at exactly the same place as Mia's rope. What is true?"
                options: ["The ropes are the same length.", "Tom's rope is longer.", "Mia's rope is longer."]
                answer: "The ropes are the same length."
                hints:
                  - "Both start at the same place."
                  - "And both stop at the same place."
                  - "The ropes are the same length."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is longer: a crocodile or a frog?"
                say: "Which is longer, a crocodile or a frog?"
                show: { objects: [crocodile, frog] }
                options: ["a crocodile", "a frog", "the same length"]
                answer: "a crocodile"
                hints: ["Imagine them side by side."]
              - id: l1-s2
                type: multiple_choice
                text: "Which is shorter: your finger or your arm?"
                say: "Which is shorter, your finger or your arm?"
                options: ["my finger", "my arm", "the same length"]
                answer: "my finger"
                hints: ["Hold your finger against your arm."]
              - id: l1-s3
                type: true_false
                text: "Sam puts down two ribbons. They do not start at the same place. Can he see which ribbon is longer?"
                say: "Sam puts down two ribbons. One starts further to the left than the other. Can he see which ribbon is longer?"
                answer: false
                hints: ["Do the ribbons start at the same place?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? A ruler is shorter than a door."
                say: "A ruler is shorter than a door. Is that true?"
                show: { objects: [ruler, door] }
                answer: true
                hints: ["A door is taller than you."]
              - id: l1-s5
                type: multiple_choice
                text: "The green string is longer than the red string. What else is true?"
                say: "The green string is longer than the red string. What else is true?"
                options: ["The red string is shorter than the green string.", "The red string is longer than the green string.", "They are the same length."]
                answer: "The red string is shorter than the green string."
                hints: ["Turn the sentence round: longer becomes shorter."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is longer: a bus or a car?"
                say: "Which is longer, a bus or a car?"
                options: ["a bus", "a car", "the same length"]
                answer: "a bus"
              - id: l1-n2
                type: multiple_choice
                text: "Which is shorter: a sock or a scarf?"
                say: "Which is shorter, a sock or a scarf?"
                options: ["a sock", "a scarf", "the same length"]
                answer: "a sock"
              - id: l1-n3
                type: multiple_choice
                text: "How do you compare two ribbons fairly?"
                say: "How do you compare two ribbons fairly?"
                options: ["Line them up with one end level.", "Pick the brighter one.", "Screw them both up."]
                answer: "Line them up with one end level."
              - id: l1-n4
                type: true_false
                text: "Is it true? A bed is longer than a pillow."
                say: "A bed is longer than a pillow. Is that true?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "The rope is shorter than the scarf. What else is true?"
                say: "The rope is shorter than the scarf. What else is true?"
                options: ["The scarf is longer than the rope.", "The scarf is shorter than the rope.", "They are the same length."]
                answer: "The scarf is longer than the rope."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is longer: a snake or a snail?"
            say: "Which is longer, a snake or a snail?"
            show: { objects: [snake, snail] }
            options: ["a snake", "a snail", "the same length"]
            answer: "a snake"
          - id: l1-c2
            type: true_false
            text: "Is it true? A rubber is longer than a ruler."
            say: "A rubber is longer than a ruler. Is that true?"
            show: { objects: [rubber, ruler] }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "The stick is longer than the twig. What else is true?"
            say: "The stick is longer than the twig. What else is true?"
            options: ["The twig is shorter than the stick.", "The twig is longer than the stick.", "They are the same length."]
            answer: "The twig is shorter than the stick."
          - id: l1-c4
            type: multiple_choice
            text: "Which is shorter: a spoon or a bike?"
            say: "Which is shorter, a spoon or a bike?"
            show: { objects: [spoon, bike] }
            options: ["a spoon", "a bike", "the same length"]
            answer: "a spoon"
          - id: l1-c5
            type: true_false
            text: "Is it true? A bus is shorter than a bike."
            say: "A bus is shorter than a bike. Is that true?"
            show: { objects: [bus, bike] }
            answer: false
          - id: l1-c6
            type: true_false
            text: "Is it true? To see which crayon is longer, line them up with one end level."
            say: "To see which crayon is longer, line them up with one end level. Is that true?"
            answer: true

  - n: 2
    title: { de: "Höhen und Reihenfolgen", en: "Heights and putting in order" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is longer: a bench or a book?"
            say: "Which is longer, a bench or a book?"
            show: { objects: [bench, book] }
            options: ["a bench", "a book", "the same length"]
            answer: "a bench"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "The scarf is longer than the sock. What else is true?"
            say: "The scarf is longer than the sock. What else is true?"
            options: ["The sock is shorter than the scarf.", "The sock is longer than the scarf.", "They are the same length."]
            answer: "The sock is shorter than the scarf."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The giraffe is taller than the dog."
            say: "For things that stand up, we say tall and short. The giraffe is taller than the dog. The dog is shorter than the giraffe."
            show: { objects: [giraffe, dog] }
          - text: "Red is longer than blue. Blue is longer than green."
            say: "Three ribbons. The red ribbon is longer than the blue one. The blue ribbon is longer than the green one."
          - text: "shortest: green, then blue, longest: red"
            say: "So the green ribbon is the shortest, and the red ribbon is the longest. Put them in order: green, blue, red. Use both sentences to find the order."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is taller: a house or a dog?"
                say: "Which is taller, a house or a dog?"
                show: { objects: [house, dog] }
                options: ["a house", "a dog", "the same height"]
                answer: "a house"
                hints:
                  - "Think of a dog next to a house."
                  - "A house has rooms upstairs."
                  - "A house is taller."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ben stands next to his baby sister. Which word fits? Ben is ... than his sister."
                say: "Ben stands next to his baby sister. Is Ben taller, longer or shorter than his sister? Which word fits?"
                options: ["taller", "longer", "shorter"]
                answer: "taller"
                feedback:
                  "longer": "Ben is standing up, so we talk about his height: taller."
                hints:
                  - "Ben is standing up."
                  - "For people standing up we say tall and short."
                  - "Ben is taller."
              - id: l2-f3
                type: ordering
                text: "Put them in order. Start with the shortest."
                say: "Put them in order: a crayon, a ruler and a bench. Start with the shortest."
                options: ["bench", "crayon", "ruler"]
                slot_count: 3
                answer: ["crayon", "ruler", "bench"]
                hints:
                  - "Which is the smallest thing?"
                  - "A crayon fits in your hand. A ruler is longer."
                  - "crayon, ruler, bench."
              - id: l2-f4
                type: multiple_choice
                text: "Ali's scarf is longer than Jo's. Jo's scarf is longer than Kim's. Whose scarf is the longest?"
                say: "Ali's scarf is longer than Jo's scarf. Jo's scarf is longer than Kim's scarf. Whose scarf is the longest?"
                options: ["Ali's", "Jo's", "Kim's"]
                answer: "Ali's"
                feedback:
                  "Jo's": "Jo's scarf is longer than Kim's, but Ali's is longer than Jo's. So Ali's is the longest."
                hints:
                  - "Use both sentences."
                  - "Ali's is longer than Jo's, and Jo's is longer than Kim's."
                  - "Ali's scarf."
              - id: l2-f5
                type: true_false
                text: "Is it true? The tree is taller than the flower."
                say: "The tree is taller than the flower. Is that true?"
                show: { objects: [tree, flower] }
                answer: true
                hints:
                  - "Imagine them side by side, from the ground up."
                  - "A tree grows much higher than a flower."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which is shorter: a mouse or an elephant?"
                say: "Which is shorter, a mouse or an elephant?"
                show: { objects: [mouse, elephant] }
                options: ["a mouse", "an elephant", "the same height"]
                answer: "a mouse"
                hints: ["Shorter means not as tall."]
              - id: l2-s2
                type: ordering
                text: "Put them in order. Start with the tallest."
                say: "Put them in order: a giraffe, a cat and a pony. Start with the tallest."
                options: ["cat", "pony", "giraffe"]
                slot_count: 3
                answer: ["giraffe", "pony", "cat"]
                hints: ["Which animal can reach the treetops?"]
              - id: l2-s3
                type: true_false
                text: "Is it true? Zara is taller than Leo. So Leo is shorter than Zara."
                say: "Zara is taller than Leo. So Leo is shorter than Zara. Is that true?"
                answer: true
                hints: ["Turn the sentence round."]
              - id: l2-s4
                type: multiple_choice
                text: "The blue worm is shorter than the red worm. The red worm is shorter than the green worm. Which worm is the shortest?"
                say: "The blue worm is shorter than the red worm. The red worm is shorter than the green worm. Which worm is the shortest?"
                options: ["the blue worm", "the red worm", "the green worm"]
                answer: "the blue worm"
                hints: ["Use both sentences."]
              - id: l2-s5
                type: multiple_choice
                text: "Which is the longest: a pencil, a bus or a car?"
                say: "Which is the longest, a pencil, a bus or a car?"
                options: ["a bus", "a car", "a pencil"]
                answer: "a bus"
                hints: ["Imagine all three in a row."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is taller: a ladder or a chair?"
                say: "Which is taller, a ladder or a chair?"
                show: { objects: [ladder, chair] }
                options: ["a ladder", "a chair", "the same height"]
                answer: "a ladder"
              - id: l2-n2
                type: ordering
                text: "Put them in order. Start with the shortest."
                say: "Put them in order: a crocodile, an ant and a dog. Start with the shortest."
                options: ["dog", "crocodile", "ant"]
                slot_count: 3
                answer: ["ant", "dog", "crocodile"]
              - id: l2-n3
                type: true_false
                text: "Is it true? The red pencil is longer than the blue one. So the red pencil is shorter."
                say: "The red pencil is longer than the blue pencil. So the red pencil is shorter. Is that true?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Mum is taller than Dad. Dad is taller than Grandma. Who is the tallest?"
                say: "Mum is taller than Dad. Dad is taller than Grandma. Who is the tallest?"
                options: ["Mum", "Dad", "Grandma"]
                answer: "Mum"
              - id: l2-n5
                type: multiple_choice
                text: "Which is the shortest: a book, a table or a bed?"
                say: "Which is the shortest, a book, a table or a bed?"
                options: ["a book", "a table", "a bed"]
                answer: "a book"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: two
            type: multiple_choice
            text: "Which is longer: a boat or a fish?"
            say: "Which is longer, a boat or a fish?"
            show: { objects: [boat, fish] }
            options: ["a boat", "a fish", "the same length"]
            answer: "a boat"
          - id: l2-c2
            part: line-up
            type: multiple_choice
            text: "How do you find out which of two straws is longer?"
            say: "How do you find out which of two straws is longer?"
            options: ["Put them side by side with one end level.", "Pick the stripy one.", "Hold one up high."]
            answer: "Put them side by side with one end level."
          - id: l2-c3
            part: two
            type: multiple_choice
            text: "Which is taller: a fir tree or a rabbit?"
            say: "Which is taller, a fir tree or a rabbit?"
            show: { objects: [fir-tree, rabbit] }
            options: ["a fir tree", "a rabbit", "the same height"]
            answer: "a fir tree"
          - id: l2-c4
            part: order
            type: ordering
            text: "Put them in order. Start with the longest."
            say: "Put them in order: a crayon, a car and a ruler. Start with the longest."
            options: ["ruler", "crayon", "car"]
            slot_count: 3
            answer: ["car", "ruler", "crayon"]
          - id: l2-c5
            part: two-facts
            type: multiple_choice
            text: "The green ribbon is shorter than the red one. The red ribbon is shorter than the blue one. Which ribbon is the longest?"
            say: "The green ribbon is shorter than the red ribbon. The red ribbon is shorter than the blue ribbon. Which ribbon is the longest?"
            options: ["the blue ribbon", "the red ribbon", "the green ribbon"]
            answer: "the blue ribbon"
          - id: l2-c6
            part: line-up
            type: multiple_choice
            text: "Jack and Amy make paper chains. They line them up at one end. Jack's chain goes further at the other end. Whose chain is longer?"
            say: "Jack and Amy make paper chains. They line them up at one end. Jack's chain goes further at the other end. Whose chain is longer?"
            options: ["Jack's", "Amy's", "the same length"]
            answer: "Jack's"
          - id: l2-c7
            part: line-up
            type: true_false
            text: "Is it true? To compare two ribbons, you line them up at one end."
            say: "To compare two ribbons, you line them up at one end. Is that true?"
            answer: true
          - id: l2-c8
            part: line-up
            type: true_false
            text: "Is it true? Mia's pencil starts further along than Sam's, and it sticks out further at the other end. So Mia's pencil must be longer."
            say: "Mia's pencil starts further along than Sam's pencil, and it sticks out further at the other end. So Mia's pencil must be longer. Is that true?"
            answer: false
          - id: l2-c9
            part: line-up
            type: multiple_choice
            text: "Why does Leo line up two pencils at one end?"
            say: "Why does Leo line up two pencils at one end?"
            options: ["So he can see which is longer.", "So they look nice.", "So they get longer."]
            answer: "So he can see which is longer."
          - id: l2-c10
            part: two
            type: multiple_choice
            text: "Which is shorter: a pencil or a bench?"
            say: "Which is shorter, a pencil or a bench?"
            show: { objects: [pencil, bench] }
            options: ["a pencil", "a bench", "the same length"]
            answer: "a pencil"
          - id: l2-c11
            part: two
            type: true_false
            text: "Is it true? A lorry is longer than a car."
            say: "A lorry is longer than a car. Is that true?"
            show: { objects: [lorry, car] }
            answer: true
          - id: l2-c12
            part: two
            type: multiple_choice
            text: "Which is taller: a horse or a mouse?"
            say: "Which is taller, a horse or a mouse?"
            show: { objects: [horse, mouse] }
            options: ["a horse", "a mouse", "the same height"]
            answer: "a horse"
          - id: l2-c13
            part: order
            type: ordering
            text: "Put them in order. Start with the shortest."
            say: "Put them in order: a bus, a pencil and a table. Start with the shortest."
            options: ["table", "bus", "pencil"]
            slot_count: 3
            answer: ["pencil", "table", "bus"]
          - id: l2-c14
            part: order
            type: ordering
            text: "Put them in order. Start with the tallest."
            say: "Put them in order: a house, a girl and a mouse. Start with the tallest."
            options: ["girl", "mouse", "house"]
            slot_count: 3
            answer: ["house", "girl", "mouse"]
          - id: l2-c15
            part: order
            type: multiple_choice
            text: "Which is the shortest: a snake, a worm or a crocodile?"
            say: "Which is the shortest, a snake, a worm or a crocodile?"
            options: ["a worm", "a snake", "a crocodile"]
            answer: "a worm"
          - id: l2-c16
            part: order
            type: multiple_choice
            text: "Which is the tallest: a flower, a tree or a child?"
            say: "Which is the tallest, a flower, a tree or a child?"
            options: ["a tree", "a child", "a flower"]
            answer: "a tree"
          - id: l2-c17
            part: two-facts
            type: multiple_choice
            text: "Dan's kite string is longer than Eve's. Eve's is longer than Fay's. Whose kite string is the shortest?"
            say: "Dan's kite string is longer than Eve's. Eve's is longer than Fay's. Whose kite string is the shortest?"
