            say: "You face the board. You make a whole turn. What do you face now?"
            options: ["the board", "the window", "the door"]
            answer: "the board"
          - id: l1-c3
            type: true_false
            text: "Is it true? A quarter turn clockwise from 12 ends at 3."
            say: "A quarter turn clockwise from twelve ends at three. Is that true?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "The long hand points to 9. It makes a half turn. Which number does it point to?"
            say: "The long hand points to nine. It makes a half turn. Which number does it point to now?"
            options: ["3", "6", "12"]
            answer: "3"
          - id: l1-c5
            type: multiple_choice
            text: "You face the window. The shelf is on your right, the board behind you, and the door on your left.\nYou make a half turn. What do you face now?"
            say: "You face the window. The shelf is on your right, the board behind you, and the door on your left. You make a half turn. What do you face now?"
            options: ["the board", "the shelf", "the door"]
            answer: "the board"
          - id: l1-c6
            type: true_false
            text: "Is it true? A whole turn from 12 ends at 6."
            say: "A whole turn of the long hand from twelve ends at six. Is that true?"
            answer: false

