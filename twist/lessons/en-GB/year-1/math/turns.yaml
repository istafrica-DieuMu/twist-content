# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.turns
skill: math.angles.turns
curriculum: en-GB
language: en
title:
  de: Ganze, halbe und Vierteldrehungen
  en: Whole, half and quarter turns
summary: >
  Lesson 1 makes whole, half and quarter turns clockwise, with the long
  hand of a clock as the thing that turns (from 12, a quarter turn
  clockwise points to 3) and a child turning in a classroom with
  something on each wall; lesson 2 adds three-quarter turns and
  anticlockwise turns, sees that a quarter turn anticlockwise ends where
  a three-quarter turn clockwise does, and ends with the skill check.
  Turning a shape or an arrow by dragging it waits for a turn interaction.
metadata:
  year: year-1
  topic: { de: Drehungen, en: Turns }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.space.position-words]
  also_practises: [math.space.position-words]
  vocabulary: { en: [turn, whole turn, half turn, quarter turn, three-quarter turn, clockwise, anticlockwise, left, right, in front of, behind, face] }
  forms: [drawn, text, audio]
  drawn: [clock, shape]
  facets: []
  parts:
    - { id: hand, what: { de: Drehungen des Uhrzeigers im Uhrzeigersinn, en: turning the hand of a clock clockwise } }
    - { id: room, what: { de: sich im Raum drehen, en: turning yourself in a room } }
    - { id: anticlockwise, what: { de: Drehungen gegen den Uhrzeigersinn, en: turning anticlockwise } }
    - { id: describe, what: { de: Drehungen benennen und vergleichen, en: naming and comparing turns } }
  misconceptions:
    - id: whole-turn-moves
      what: Thinks a whole turn ends somewhere new, not back where it started
      addressed: lesson 1 Learn turns the hand all the way round to 12; l1-f4 (with feedback), l1-s4 and l2-c4 ask where a whole turn ends
    - id: clockwise-swap
      what: Swaps clockwise and anticlockwise
      addressed: lesson 2 Learn says clockwise is the way clock hands go, to the right from the top; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c3 turn anticlockwise
    - id: quarter-half-mixed
      what: Mixes up a quarter turn and a half turn (a quarter turn from facing the board ends facing the back)
      addressed: lesson 1 Learn shows a quarter turn as one wall and a half turn as two; l1-f3 (with feedback), l1-s3 and l1-n3 ask about the classroom walls
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ganze, halbe und Vierteldrehungen", en: "Whole, half and quarter turns" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which shape is on the right?"
            say: "Which shape is on the right?"
            show: { drawn: shape, row: [circle, square], colours: [red, blue] }
            options: ["square", "circle"]
            answer: "square"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Fill the gap."
            say: "Look at the stack. Fill the gap with the right word."
            show: { drawn: shape, column: [triangle, square], colours: [yellow, green] }
            frame: "The triangle is _ the square."
            options: ["above", "below"]
            answer: ["above"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A quarter turn clockwise: from 12 to 3"
            say: "Watch the long hand of the clock. It points to twelve. It turns the way clock hands always go. We call that clockwise. A quarter turn takes it to three."
            show: { drawn: clock, hour: 12, minute: 15 }
          - text: "A half turn: from 12 to 6"
            say: "A half turn takes the long hand halfway round the clock, from twelve down to six."
            show: { drawn: clock, hour: 12, minute: 30 }
          - text: "A whole turn: all the way round"
            say: "A whole turn takes the hand all the way round, back to twelve, where it started."
            show: { drawn: clock, hour: 1, minute: 0 }
          - text: "Board in front. Door on the right. Window behind. Shelf on the left."
            say: "Now you turn. You face the board. The door is on your right, the window is behind you, and the shelf is on your left. A quarter turn clockwise turns you to your right. Now you face the door. A half turn turns you round to face the back. Now you face the window."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "The long hand points to 12. It makes a half turn. Where does it point?"
                say: "The long hand points to twelve. It makes a half turn. Tap the clock that shows where it points now."
                options:
                  - { drawn: clock, hour: 12, minute: 30 }
                  - { drawn: clock, hour: 12, minute: 15 }
                  - { drawn: clock, hour: 1, minute: 0 }
                answer: "12:30"
                hints:
                  - "A half turn goes halfway round."
                  - "Halfway round from 12 is at the bottom."
                  - "The long hand points to 6."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "The long hand points to 12. It makes a quarter turn clockwise. Which number does it point to?"
                say: "The long hand points to twelve. It makes a quarter turn clockwise. Which number does it point to now?"
                options: ["3", "6", "9"]
                answer: "3"
                hints:
                  - "A quarter turn is one quarter of the way round."
                  - "Clockwise from 12 goes towards 1, 2, 3."
                  - "3."
              - id: l1-f3
                type: multiple_choice
                text: "You face the board. The door is on your right, the window behind you, and the shelf on your left.\nYou make a quarter turn clockwise. What do you face now?"
                say: "You face the board. The door is on your right, the window behind you, and the shelf on your left. You make a quarter turn clockwise. What do you face now?"
                options: ["the door", "the window", "the shelf"]
                answer: "the door"
                feedback:
                  "the window": "The window is behind you. That takes a half turn. A quarter turn takes you only to your right."
                hints:
                  - "A quarter turn clockwise turns you to your right."
                  - "What is on your right?"
                  - "The door."
              - id: l1-f4
                type: multiple_choice
                text: "The long hand points to 12. It makes a whole turn. Which number does it point to?"
                say: "The long hand points to twelve. It makes a whole turn. Which number does it point to now?"
                options: ["12", "6", "3"]
                answer: "12"
                feedback:
                  "6": "6 is a half turn. A whole turn goes all the way round, back to 12."
                hints:
                  - "A whole turn goes all the way round."
                  - "Where did it start?"
                  - "12."
              - id: l1-f5
                type: true_false
                text: "Is it true? You face the window and make a half turn. Now the window is behind you."
                say: "You face the window. You make a half turn. Now the window is behind you. Is that true?"
                answer: true
                hints:
                  - "A half turn turns you round to face the other way."
                  - "What was in front of you is now at your back."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "The long hand points to 12. It makes a quarter turn clockwise. Where does it point?"
                say: "The long hand points to twelve. It makes a quarter turn clockwise. Tap the clock that shows where it points now."
                options:
                  - { drawn: clock, hour: 12, minute: 15 }
                  - { drawn: clock, hour: 12, minute: 30 }
                  - { drawn: clock, hour: 12, minute: 45 }
                answer: "12:15"
                hints: ["A quarter of the way round, clockwise."]
              - id: l1-s2
                type: multiple_choice
                text: "The long hand points to 3. It makes a quarter turn clockwise. Which number does it point to?"
                say: "The long hand points to three. It makes a quarter turn clockwise. Which number does it point to now?"
                options: ["6", "9", "12"]
                answer: "6"
                hints: ["Clockwise from 3 goes towards 4, 5, 6."]
              - id: l1-s3
                type: multiple_choice
                text: "You face the board. The door is on your right, the window behind you, and the shelf on your left.\nYou make a half turn. What do you face now?"
                say: "You face the board. The door is on your right, the window behind you, and the shelf on your left. You make a half turn. What do you face now?"
                options: ["the window", "the door", "the board"]
                answer: "the window"
                hints: ["A half turn turns you round to face the back."]
              - id: l1-s4
                type: true_false
                text: "Is it true? After a whole turn you face the same way as at the start."
                say: "After a whole turn, you face the same way as at the start. Is that true?"
                answer: true
                hints: ["A whole turn goes all the way round."]
              - id: l1-s5
                type: multiple_choice
                text: "How many quarter turns make a half turn?"
                say: "How many quarter turns make a half turn?"
                options: ["2", "4", "1"]
                answer: "2"
                hints: ["From 12, one quarter turn reaches 3. Where does the next one reach?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "The long hand points to 12. It makes a whole turn. Where does it point?"
                say: "The long hand points to twelve. It makes a whole turn. Tap the clock that shows where it points now."
                options:
                  - { drawn: clock, hour: 12, minute: 30 }
                  - { drawn: clock, hour: 1, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 15 }
                answer: "1:00"
              - id: l1-n2
                type: multiple_choice
                text: "The long hand points to 6. It makes a half turn. Which number does it point to?"
                say: "The long hand points to six. It makes a half turn. Which number does it point to now?"
                options: ["12", "3", "9"]
                answer: "12"
              - id: l1-n3
                type: multiple_choice
                text: "You face the door. The window is on your right, the shelf behind you, and the board on your left.\nYou make a quarter turn clockwise. What do you face now?"
                say: "You face the door. The window is on your right, the shelf behind you, and the board on your left. You make a quarter turn clockwise. What do you face now?"
                options: ["the window", "the shelf", "the board"]
                answer: "the window"
              - id: l1-n4
                type: true_false
                text: "Is it true? A half turn from 12 ends at 3."
                say: "A half turn of the long hand from twelve ends at three. Is that true?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "How many quarter turns make a whole turn?"
                say: "How many quarter turns make a whole turn?"
                options: ["4", "2", "3"]
                answer: "4"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The long hand points to 12. It makes a half turn. Which number does it point to?"
            say: "The long hand points to twelve. It makes a half turn. Which number does it point to now?"
            options: ["6", "3", "12"]
            answer: "6"
          - id: l1-c2
            type: multiple_choice
