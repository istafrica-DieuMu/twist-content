            options: ["3", "9", "6"]
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many quarter turns make a half turn?"
            say: "How many quarter turns make a half turn?"
            options: ["2", "3", "4"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A three-quarter turn clockwise: from 12 to 9"
            say: "A three-quarter turn is three quarter turns. From twelve, the long hand goes to three, then six, then nine."
            show: { drawn: clock, hour: 12, minute: 45 }
          - text: "clockwise and anticlockwise"
            say: "Clockwise is the way clock hands go: from the top, round to the right. Anticlockwise is the other way: from the top, round to the left."
          - text: "A quarter turn anticlockwise: from 12 to 9"
            say: "A quarter turn anticlockwise takes the hand from twelve back to nine. That is the same place as a three-quarter turn clockwise. For you, a quarter turn anticlockwise turns you to your left."
            show: { drawn: clock, hour: 11, minute: 45 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The long hand points to 12. It makes a three-quarter turn clockwise. Which number does it point to?"
                say: "The long hand points to twelve. It makes a three-quarter turn clockwise. Which number does it point to now?"
                options: ["9", "3", "6"]
                answer: "9"
                hints:
                  - "Three-quarter turn means three quarter turns."
                  - "From 12: to 3, to 6, to ..."
                  - "9."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The long hand points to 12. It makes a quarter turn anticlockwise. Which number does it point to?"
                say: "The long hand points to twelve. It makes a quarter turn anticlockwise. Which number does it point to now?"
                options: ["9", "3", "6"]
                answer: "9"
                feedback:
                  "3": "3 is a quarter turn clockwise. Anticlockwise goes the other way, from 12 round to the left: 11, 10, 9."
                hints:
                  - "Anticlockwise is the opposite way to the clock hands."
                  - "From 12, go back: 11, 10, ..."
                  - "9."
              - id: l2-f3
                type: image_multiple_choice
                text: "The long hand points to 12. It makes a three-quarter turn clockwise. Where does it point?"
                say: "The long hand points to twelve. It makes a three-quarter turn clockwise. Tap the clock that shows where it points now."
                options:
                  - { drawn: clock, hour: 12, minute: 45 }
                  - { drawn: clock, hour: 12, minute: 15 }
                  - { drawn: clock, hour: 12, minute: 30 }
                answer: "12:45"
                hints:
                  - "Count three quarter turns."
                  - "To 3, to 6, to 9."
                  - "The clock with the long hand on 9."
              - id: l2-f4
                type: multiple_choice
                text: "You face the board. The door is on your right, the window behind you, and the shelf on your left.\nYou make a quarter turn anticlockwise. What do you face now?"
                say: "You face the board. The door is on your right, the window behind you, and the shelf on your left. You make a quarter turn anticlockwise. What do you face now?"
                options: ["the shelf", "the door", "the window"]
                answer: "the shelf"
                hints:
                  - "A quarter turn anticlockwise turns you to your left."
                  - "What is on your left?"
                  - "The shelf."
              - id: l2-f5
                type: true_false
                text: "Is it true? A quarter turn anticlockwise ends in the same place as a three-quarter turn clockwise."
                say: "A quarter turn anticlockwise ends in the same place as a three-quarter turn clockwise. Is that true?"
                answer: true
                hints:
                  - "Start both at 12."
                  - "A quarter turn anticlockwise reaches 9. Three quarter turns clockwise reach 3, 6, then 9."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The long hand points to 3. It makes a three-quarter turn clockwise. Which number does it point to?"
                say: "The long hand points to three. It makes a three-quarter turn clockwise. Which number does it point to now?"
                options: ["12", "6", "9"]
                answer: "12"
                hints: ["From 3: to 6, to 9, to ..."]
