                options: ["3", "9", "12"]
                answer: "3"
                hints: ["Anticlockwise goes back: 5, 4, ..."]
              - id: l2-s3
                type: multiple_choice
                text: "Which way do the hands of a clock turn?"
                say: "Which way do the hands of a clock turn?"
                options: ["clockwise", "anticlockwise"]
                answer: "clockwise"
                hints: ["The word has clock in it."]
              - id: l2-s4
                type: multiple_choice
                text: "You face the board. The door is on your right, the window behind you, and the shelf on your left.\nYou make a three-quarter turn clockwise. What do you face now?"
                say: "You face the board. The door is on your right, the window behind you, and the shelf on your left. You make a three-quarter turn clockwise. What do you face now?"
                options: ["the shelf", "the door", "the window"]
                answer: "the shelf"
                hints: ["Three quarter turns to the right: door, window, then ..."]
              - id: l2-s5
                type: true_false
                text: "Is it true? A half turn clockwise and a half turn anticlockwise end in the same place."
                say: "A half turn clockwise and a half turn anticlockwise end in the same place. Is that true?"
                answer: true
                hints: ["From 12, where does a half turn go each way?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The long hand points to 6. It makes a three-quarter turn clockwise. Which number does it point to?"
                say: "The long hand points to six. It makes a three-quarter turn clockwise. Which number does it point to now?"
                options: ["3", "9", "12"]
                answer: "3"
              - id: l2-n2
                type: multiple_choice
                text: "The long hand points to 3. It makes a quarter turn anticlockwise. Which number does it point to?"
                say: "The long hand points to three. It makes a quarter turn anticlockwise. Which number does it point to now?"
                options: ["12", "6", "9"]
                answer: "12"
              - id: l2-n3
                type: image_multiple_choice
                text: "The long hand points to 12. It makes a half turn anticlockwise. Where does it point?"
                say: "The long hand points to twelve. It makes a half turn anticlockwise. Tap the clock that shows where it points now."
                options:
                  - { drawn: clock, hour: 11, minute: 45 }
                  - { drawn: clock, hour: 11, minute: 30 }
                  - { drawn: clock, hour: 11, minute: 15 }
                answer: "11:30"
              - id: l2-n4
                type: multiple_choice
                text: "You face the window. The shelf is on your right, the board behind you, and the door on your left.\nYou make a quarter turn anticlockwise. What do you face now?"
                say: "You face the window. The shelf is on your right, the board behind you, and the door on your left. You make a quarter turn anticlockwise. What do you face now?"
                options: ["the door", "the shelf", "the board"]
                answer: "the door"
              - id: l2-n5
                type: multiple_choice
                text: "How many quarter turns make a three-quarter turn?"
                say: "How many quarter turns make a three-quarter turn?"
                options: ["3", "4", "2"]
                answer: "3"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: hand
            type: multiple_choice
            text: "The long hand points to 9. It makes a quarter turn clockwise. Which number does it point to?"
            say: "The long hand points to nine. It makes a quarter turn clockwise. Which number does it point to now?"
            options: ["12", "6", "3"]
            answer: "12"
          - id: l2-c2
            part: room
            type: multiple_choice
            text: "You face the shelf. The board is on your right, the door behind you, and the window on your left.\nYou make a half turn. What do you face now?"
            say: "You face the shelf. The board is on your right, the door behind you, and the window on your left. You make a half turn. What do you face now?"
