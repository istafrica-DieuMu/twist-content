# Lesson set: Maths, Year 1. Hand-authored draft.
id: en-GB.math.analog-to-20
skill: math.add-sub-to-20.analog-to-20
curriculum: en-GB
language: en
title:
  de: Analogieaufgaben im zweiten Zehner
  en: Using facts to 10 for facts to 20
summary: >
  A fact in the teens is a fact to 10 with a ten on top: 3 + 4 = 7 helps
  with 13 + 4 = 17, and 8 − 5 = 3 with 18 − 5 = 13. Lesson 1 adds, lesson
  2 subtracts and mixes both, and ends with the skill check. Nothing here
  crosses ten.
metadata:
  year: year-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.sub-to-10, math.numbers-to-20.teens]
  also_practises: [math.add-sub-to-20.add-to-10]
  vocabulary: { en: [related fact, tens, ones, the ten stays] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld, number-line]
  facets: []
  parts:
    - { id: small-fact, what: { de: die passende kleine Aufgabe finden und nutzen, en: finding and using the matching small fact } }
    - { id: add, what: { de: Plusaufgaben im zweiten Zehner, en: adding in the teens } }
    - { id: subtract, what: { de: Minusaufgaben im zweiten Zehner, en: taking away in the teens } }
  misconceptions:
    - id: change-the-ten
      what: Adds the ones to the tens digit (13 + 4 = 53)
      addressed: Learn says the ten stays and only the ones change; a changed-ten option in the full stage, with feedback
    - id: drop-the-ten
      what: Gives the small fact's answer (13 + 4 = 7)
      addressed: Learn shows the small and the big fact side by side; the small answer is an option in each stage, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Die kleine Aufgabe hilft, en: The small fact helps }
    goal:
      de: "Nutze eine kleine Aufgabe für eine größere, so wie 3 plus 4 bei 13 plus 4 hilft."
      en: "Use a small fact to help with a bigger one, like 3 add 4 helps with 13 add 4."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "3 + 4 = _"
            say: "Three add four."
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many counters?"
            say: "How many counters are there altogether?"
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
            options: ["13", "3", "31"]
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 + 4 = 7 · 13 + 4 = ?"
            say: "Three add four is seven. What do you think thirteen add four is? Have a guess."
            show: { drawn: zwanzigerfeld, filled: [0, 7] }
          - text: "13 + 4 = 17"
            say: "Seventeen! Now there is a full ten as well. Thirteen add four: the ten stays the same. In the ones, three add four is seven. So the answer is seventeen."
            show: { drawn: zwanzigerfeld, filled: [10, 7] }
          - text: "3 + 4 = 7 · 13 + 4 = 17"
            say: "The small fact helps with the bigger one. Only the ones change; the ten stays the same."
          - text: "Did you know? The teen in thirteen comes from an old word for ten."
            say: "Did you know? The teen at the end of thirteen, fourteen and fifteen comes from an old English word for ten. So thirteen really means three and ten!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Do the small fact, then the big one."
                say: "Two add five, then twelve add five."
                frame: "2 + 5 = _ · 12 + 5 = _"
                options: ["7", "17", "62", "70"]
                answer: ["7", "17"]
                hints:
                  - "Start with two add five."
                  - "For twelve add five, the ten stays."
                  - "7 and 17."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "14 + 3 = ?"
                say: "Fourteen add three. Think of the small fact."
                options: ["17", "7", "44"]
                answer: "17"
                feedback:
                  "7": "Four add three is seven, but the ten is still there: seventeen."
                  "44": "The three goes with the ones, not the tens. Four add three is seven: seventeen."
                hints:
                  - "The small fact is four add three."
                  - "Keep the ten."
                  - "17."
              - id: l1-f3
                type: multiple_choice
                text: "Which small fact helps with 15 + 2?"
                say: "Fifteen add two. Which small fact helps?"
                options: ["5 + 2", "1 + 2", "15 + 1", "a big breakfast"]
                answer: "5 + 2"
                feedback:
                  "a big breakfast": "A big breakfast helps with lots of things, but not with this sum! Leave out the ten."
                hints:
                  - "Leave out the ten."
                  - "Fifteen without the ten is five."
                  - "5 + 2."
              - id: l1-f4
                type: true_false
                text: "Is it true? 11 + 6 = 17"
                say: "Eleven add six is seventeen. Is that true?"
                answer: true
                hints:
                  - "The small fact is one add six."
                  - "One add six is seven. Keep the ten."
                  - "Yes."
              - id: l1-f5
                type: text_input
                text: "16 children are on the bus. 3 more get on.\n16 + 3 = _"
                say: "Sixteen children are on the bus. Three more get on. Sixteen add three. How many children are on the bus now?"
                answer: "19"
                hints:
                  - "Think of six add three."
                  - "Six add three is nine. Keep the ten."
                  - "19."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Do the small fact, then the big one."
                say: "Four add four, then fourteen add four."
                frame: "4 + 4 = _ · 14 + 4 = _"
                options: ["8", "18", "54", "80"]
                answer: ["8", "18"]
                hints: ["The ten stays."]
              - id: l1-s2
                type: multiple_choice
                text: "12 + 6 = ?"
                say: "Twelve add six."
                options: ["18", "8", "72"]
                answer: "18"
                hints: ["Which small fact helps?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which small fact helps with 17 + 2?"
                say: "Seventeen add two. Which small fact helps?"
                options: ["7 + 2", "1 + 2", "17 + 1"]
                answer: "7 + 2"
                hints: ["Leave out the ten."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 15 + 4 = 9"
                say: "Fifteen add four is nine. Is that true?"
                answer: false
                hints: ["Did you keep the ten?"]
              - id: l1-s5
                type: text_input
                text: "11 + 8 = _"
                say: "Eleven add eight."
                answer: "19"
                hints: ["Think of one add eight."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Do the small fact, then the big one."
                say: "Five add three, then fifteen add three."
                frame: "5 + 3 = _ · 15 + 3 = _"
                options: ["8", "18", "45", "80"]
                answer: ["8", "18"]
              - id: l1-n2
                type: multiple_choice
                text: "13 + 6 = ?"
                say: "Thirteen add six."
                options: ["19", "9", "73"]
                answer: "19"
              - id: l1-n3
                type: text_input
                text: "12 + 7 = _"
                say: "Twelve add seven."
                answer: "19"
              - id: l1-n4
                type: true_false
                text: "Is it true? 14 + 5 = 19"
                say: "Fourteen add five is nineteen. Is that true?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "10 + 6 = _"
                say: "Ten add six."
                answer: "16"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "11 + 4 = _"
            say: "Eleven add four."
            answer: "15"
          - id: l1-c2
            type: multiple_choice
            text: "Which small fact helps with 12 + 4?"
            say: "Twelve add four. Which small fact helps?"
            options: ["2 + 4", "1 + 4", "12 + 1"]
            answer: "2 + 4"
          - id: l1-c3
            type: true_false
            text: "Is it true? 16 + 2 = 18"
            say: "Sixteen add two is eighteen. Is that true?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Do the small fact, then the big one."
            say: "Two add two, then twelve add two."
            frame: "2 + 2 = _ · 12 + 2 = _"
            options: ["4", "14", "5", "15"]
            answer: ["4", "14"]
          - id: l1-c5
            type: multiple_choice
            text: "15 + 1 = ?"
            say: "Fifteen add one."
            options: ["16", "6", "25"]
            answer: "16"
          - id: l1-c6
            type: text_input
            text: "13 + 2 = _"
            say: "Thirteen add two."
            answer: "15"

  - n: 2
    title: { de: Auch bei Minus, en: Taking away too }
    goal:
      de: "Nutze kleine Aufgaben auch beim Wegnehmen, so wie 8 minus 5 bei 18 minus 5 hilft."
      en: "Use small facts when you take away too, like 8 take away 5 helps with 18 take away 5."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "14 + 4 = _"
            say: "Fourteen add four."
            answer: "18"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "8 − 5 = _"
            say: "Eight take away five."
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 − 5 = 3 · 18 − 5 = ?"
            say: "Eight take away five is three. What do you think eighteen take away five is? Have a guess."
          - text: "8 − 5 = 3 · 18 − 5 = 13"
            say: "Thirteen! The small fact works when you take away too. Eight take away five is three. Eighteen take away five: the ten stays the same. In the ones, eight take away five is three. So the answer is thirteen."
          - text: "7 − 4 = 3 · 17 − 4 = 13"
            say: "Seventeen take away four. The small fact is seven take away four, which is three. Keep the ten: thirteen."
            show: { drawn: number-line, from: 0, to: 20, labels: tens, jumps: [[17, -4]] }
          - text: "19 − 9 = 10"
            say: "If all the ones go, only the ten is left: nineteen take away nine is ten."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Do the small fact, then the big one."
                say: "Seven take away two, then seventeen take away two."
                frame: "7 − 2 = _ · 17 − 2 = _"
                options: ["5", "15", "3", "13"]
                answer: ["5", "15"]
                hints:
                  - "Start with seven take away two."
                  - "For seventeen take away two, the ten stays."
                  - "5 and 15."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "16 − 4 = ?"
                say: "Sixteen take away four."
                options: ["12", "2", "6"]
                answer: "12"
                feedback:
                  "2": "Six take away four is two, but the ten stays: twelve."
                hints:
                  - "The small fact is six take away four."
                  - "Keep the ten."
                  - "12."
              - id: l2-f3
                type: multiple_choice
                text: "Which small fact helps with 19 − 6?"
                say: "Nineteen take away six. Which small fact helps?"
                options: ["9 − 6", "9 + 6", "19 − 1"]
                answer: "9 − 6"
                hints:
                  - "Leave out the ten."
                  - "Nineteen without the ten is nine."
                  - "9 − 6."
              - id: l2-f4
                type: true_false
                text: "Is it true? 15 − 5 = 10"
                say: "Fifteen take away five is ten. Is that true?"
                answer: true
                hints:
                  - "Five take away five is zero."
                  - "Only the ten is left."
                  - "Yes."
              - id: l2-f5
                type: text_input
                text: "There are 18 crayons in the box. Max takes 3 out.\n18 − 3 = _"
                say: "There are eighteen crayons in the box. Max takes three out. Eighteen take away three. How many crayons are still in the box?"
                answer: "15"
                hints:
                  - "Think of eight take away three."
                  - "Eight take away three is five. Keep the ten."
                  - "15."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Do the small fact, then the big one."
                say: "Nine take away four, then nineteen take away four."
                frame: "9 − 4 = _ · 19 − 4 = _"
                options: ["5", "15", "4", "14"]
                answer: ["5", "15"]
                hints: ["The ten stays."]
              - id: l2-s2
                type: multiple_choice
                text: "17 − 5 = ?"
                say: "Seventeen take away five."
                options: ["12", "2", "22"]
                answer: "12"
                hints: ["Which small fact helps?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which small fact helps with 16 − 3?"
                say: "Sixteen take away three. Which small fact helps?"
                options: ["6 − 3", "6 + 3", "16 − 1"]
                answer: "6 − 3"
                hints: ["Leave out the ten."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 18 − 6 = 2"
                say: "Eighteen take away six is two. Is that true?"
                answer: false
                hints: ["Did you keep the ten?"]
              - id: l2-s5
                type: text_input
                text: "11 + 5 = _"
                say: "Eleven add five."
                answer: "16"
                hints: ["Think of one add five."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Do the small fact, then the big one."
                say: "Six take away two, then sixteen take away two."
                frame: "6 − 2 = _ · 16 − 2 = _"
                options: ["4", "14", "8", "18"]
                answer: ["4", "14"]
              - id: l2-n2
                type: multiple_choice
                text: "19 − 7 = ?"
                say: "Nineteen take away seven."
                options: ["12", "2", "16"]
                answer: "12"
              - id: l2-n3
                type: text_input
                text: "14 − 3 = _"
                say: "Fourteen take away three."
                answer: "11"
              - id: l2-n4
                type: true_false
                text: "Is it true? 17 − 7 = 10"
                say: "Seventeen take away seven is ten. Is that true?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "13 + 3 = _"
                say: "Thirteen add three."
                answer: "16"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: text_input
            text: "12 + 3 = _"
            say: "Twelve add three."
            answer: "15"
          - id: l2-c2
            part: subtract
            type: multiple_choice
            text: "18 − 4 = ?"
            say: "Eighteen take away four."
            options: ["14", "4", "12"]
            answer: "14"
          - id: l2-c3
            part: small-fact
            type: fill_in_blank
            text: "Do the small fact, then the big one."
            say: "Eight take away six, then eighteen take away six."
            frame: "8 − 6 = _ · 18 − 6 = _"
            options: ["2", "12", "14", "4"]
            answer: ["2", "12"]
          - id: l2-c4
            part: add
            type: true_false
            text: "Is it true? 11 + 7 = 8"
            say: "Eleven add seven is eight. Is that true?"
            answer: false
          - id: l2-c5
            part: small-fact
            type: multiple_choice
            text: "Which small fact helps with 15 − 2?"
            say: "Fifteen take away two. Which small fact helps?"
            options: ["5 − 2", "5 + 2", "15 − 1"]
            answer: "5 − 2"
          - id: l2-c6
            part: small-fact
            type: fill_in_blank
            text: "Do the small fact, then the big one."
            say: "One add two, then eleven add two."
            frame: "1 + 2 = _ · 11 + 2 = _"
            options: ["3", "13", "4", "12"]
            answer: ["3", "13"]
          - id: l2-c7
            part: small-fact
            type: multiple_choice
            text: "Which small fact helps with 17 − 3?"
            say: "Seventeen take away three. Which small fact helps?"
            options: ["7 − 3", "7 + 3", "17 − 7"]
            answer: "7 − 3"
          - id: l2-c8
            part: small-fact
            type: true_false
            text: "Does 4 + 2 = 6 help with 14 + 2?"
            say: "Four add two is six. Does that help with fourteen add two?"
            answer: true
          - id: l2-c9
            part: small-fact
            type: true_false
            text: "Does 5 − 3 = 2 help with 19 − 3?"
            say: "Five take away three is two. Does that help with nineteen take away three?"
            answer: false
          - id: l2-c10
            part: small-fact
            type: matching
            text: "Match each fact to the small fact that helps."
            pairs:
              - { left: { text: "13 + 5" }, right: { text: "3 + 5" } }
              - { left: { text: "19 − 5" }, right: { text: "9 − 5" } }
              - { left: { text: "18 − 2" }, right: { text: "8 − 2" } }
          - id: l2-c11
            part: add
            type: text_input
            text: "13 + 5 = _"
            say: "Thirteen add five."
            answer: "18"
          - id: l2-c12
            part: add
            type: multiple_choice
            text: "14 + 2 = ?"
            say: "Fourteen add two."
            options: ["16", "6", "34"]
            answer: "16"
          - id: l2-c13
            part: add
            type: true_false
            text: "Is it true? 16 + 1 = 26"
            say: "Sixteen add one is twenty-six. Is that true?"
            answer: false
          - id: l2-c14
            part: add
            type: point_on_line
            text: "Where do you land? 11 + 3"
            say: "Eleven add three. Where do you land?"
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 14
          - id: l2-c15
            part: subtract
            type: text_input
            text: "19 − 5 = _"
            say: "Nineteen take away five."
            answer: "14"
          - id: l2-c16
            part: subtract
            type: multiple_choice
            text: "16 − 5 = ?"
            say: "Sixteen take away five."
            options: ["11", "1", "10"]
            answer: "11"
          - id: l2-c17
            part: subtract
            type: true_false
            text: "Is it true? 18 − 7 = 11"
            say: "Eighteen take away seven is eleven. Is that true?"
            answer: true
          - id: l2-c18
            part: subtract
            type: text_input
            text: "13 − 2 = _"
            say: "Thirteen take away two."
            answer: "11"
          - id: l2-c19
            part: subtract
            type: point_on_line
            text: "Where do you land? 17 − 6"
            say: "Seventeen take away six. Where do you land?"
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 11
          - id: l2-c20
            part: subtract
            type: true_false
            text: "Is it true? 15 − 3 = 2"
            say: "Fifteen take away three is two. Is that true?"
            answer: false
