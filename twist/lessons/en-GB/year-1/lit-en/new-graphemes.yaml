# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.new-graphemes
skill: lit-en.phonics.new-graphemes
curriculum: en-GB
language: en
title:
  de: Neue Buchstabengruppen
  en: New graphemes
summary: >
  Year 1 opens with more ways of writing sounds: two letters that make one
  sound (ay in play, ou in cloud). Lesson 1 takes ay, ou, ie, ea, oy and
  ir; lesson 2 takes ue, aw, wh, ph, ew and ey, and ends with the skill
  check. Children read each word and find its picture, spot the grapheme
  in words, and choose it to finish a word. The voice says sounds, never
  letter names.
metadata:
  year: year-1
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.phonics.adjacent-consonants]
  also_practises: []
  vocabulary: { en: [sound, letters, grapheme, digraph, blend, read] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: ay-ea-ie, what: { de: "Wörter mit ay, ea und ie lesen (play, leaf, pie)", en: "reading words with ay, ea and ie (play, leaf, pie)" } }
    - { id: ou-oy-ir, what: { de: "Wörter mit ou, oy und ir lesen (cloud, boy, bird)", en: "reading words with ou, oy and ir (cloud, boy, bird)" } }
    - { id: ue-ew-aw, what: { de: "Wörter mit ue, ew und aw lesen (blue, flew, saw)", en: "reading words with ue, ew and aw (blue, flew, saw)" } }
    - { id: wh-ph-ey, what: { de: "Wörter mit wh, ph und ey lesen (whale, elephant, monkey)", en: "reading words with wh, ph and ey (whale, elephant, monkey)" } }
    - { id: mixed, what: { de: die neuen Buchstabengruppen zwischen anderen Wörtern erkennen, en: telling the new graphemes apart among other words } }
  misconceptions:
    - id: letter-by-letter
      what: Sounds each letter of a digraph on its own (p-l-a-y as pl-a-y)
      addressed: Learn says the two letters make one sound; hints name the pair and its sound
    - id: first-sound-guess
      what: Reads the first letter and guesses (cloud as clown)
      addressed: picture options share the first sounds, so only reading the whole word works
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "ay, ou, ie, ea, oy, ir", en: "ay, ou, ie, ea, oy, ir" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "shell" }
            options: [{ object: shell }, { object: sock }, { object: fish }]
            answer: shell
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "moon" }
            options: [{ object: moon }, { object: mouse }, { object: monkey }]
            answer: moon
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "ay"
            say: "Two letters can make one sound. We call them a digraph. A and y together say ay, as in play and day."
            show: { drawn: letter-card, text: "ay" }
          - text: "ou   ie   ea"
            say: "O and u say ow, as in cloud. I and e say igh, as in pie. E and a say ee, as in leaf."
            show: { object: cloud }
          - text: "oy   ir"
            say: "O and y say oy, as in boy. I and r say er, as in bird. When you read, look for these pairs and say one sound."
            show: { object: boy }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "cloud" }
                options: [{ object: clock }, { object: cloud }, { object: clown }]
                answer: cloud
                feedback:
                  clown: "Clown starts the same way. Look at the end: cloud ends with d."
                hints:
                  - "Find the two letters that make one sound."
                  - "o and u say ow: cl ... ow ... d."
                  - "Cloud."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "boy" }
                options: [{ object: boy }, { object: boat }, { object: ball }]
                answer: boy
                hints:
                  - "o and y make one sound."
                  - "b ... oy."
                  - "Boy."
              - id: l1-f3
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Which two letters finish the word for this picture?"
                show: { object: bird }
                frame: "b_rd"
                options: ["ir", "ou", "ay"]
                answer: ["ir"]
                hints:
                  - "Say the word slowly: b ... er ... d."
                  - "The middle sound is er."
                  - "i and r: bird."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap every word with ay."
                say: "Tap every word that has a and y together."
                show: { drawn: letter-card, text: "play dog day may sun" }
                spans: ["play", "day", "may"]
                hints:
                  - "Look at the end of each word."
                  - "Three words end with ay."
                  - "play, day and may."
              - id: l1-f5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "leaf" }
                options: [{ object: leaf }, { object: leg }, { object: lamp }]
                answer: leaf
                hints:
                  - "e and a make one sound: ee."
                  - "l ... ee ... f."
                  - "Leaf."
              - id: l1-f6
                type: true_false
                text: "Is it true? In pie, the letters ie say igh."
                say: "Read the word on the card. Do the letters i and e say igh?"
                show: { drawn: letter-card, text: "pie" }
                answer: true
                hints:
                  - "Say pie slowly."
                  - "p ... igh."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "mouse" }
                options: [{ object: moon }, { object: mouse }, { object: monkey }]
                answer: mouse
                hints: ["o and u make one sound."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "girl" }
                options: [{ object: goat }, { object: girl }, { object: grandma }]
                answer: girl
                hints: ["i and r say er."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap every word with ou."
                say: "Tap every word that has o and u together."
                show: { drawn: letter-card, text: "out cat loud house hat" }
                spans: ["out", "loud", "house"]
                hints: ["Three words."]
              - id: l1-s4
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Which two letters finish the word for this picture?"
                show: { object: crayon }
                frame: "cr_on"
                options: ["ay", "oy", "ie"]
                answer: ["ay"]
                hints: ["cr ... ay ... on."]
              - id: l1-s5
                type: true_false
                text: "Is it true? In leaf, the letters ea say ee."
                say: "Read the word on the card. Do the letters e and a say ee?"
                show: { drawn: letter-card, text: "leaf" }
                answer: true
                hints: ["l ... ee ... f."]
              - id: l1-s6
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "mouth" }
                options: [{ object: mouth }, { object: moon }, { object: mouse }]
                answer: mouth
                hints: ["Look at the end of the word."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "pie" }
                options: [{ object: pig }, { object: pie }, { object: pineapple }]
                answer: pie
              - id: l1-n2
                type: highlight_in_text
                text: "Tap every word with oy."
                say: "Tap every word that has o and y together."
                show: { drawn: letter-card, text: "toy box boy joy top" }
                spans: ["toy", "boy", "joy"]
              - id: l1-n3
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Which two letters finish the word for this picture?"
                show: { object: house }
                frame: "h_se"
                options: ["ou", "ay", "ea"]
                answer: ["ou"]
              - id: l1-n4
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "bird" }
                options: [{ object: bird }, { object: bed }, { object: bread }]
                answer: bird
              - id: l1-n5
                type: true_false
                text: "Is it true? In boy, the letters oy say ow."
                say: "Read the word on the card. Do the letters o and y say ow?"
                show: { drawn: letter-card, text: "boy" }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "house" }
            options: [{ object: house }, { object: hat }, { object: hand }]
            answer: house
          - id: l1-c2
            type: highlight_in_text
            text: "Tap every word with ea."
            say: "Tap every word that has e and a together."
            show: { drawn: letter-card, text: "eat red sea tea ten" }
            spans: ["eat", "sea", "tea"]
          - id: l1-c3
            type: fill_in_blank
            text: "Which letters finish the word?"
            say: "Which two letters finish the word for this picture?"
            show: { object: girl }
            frame: "g_l"
            options: ["ir", "ou", "oy"]
            answer: ["ir"]
          - id: l1-c4
            type: multiple_choice
            text: "Which word has the er sound?"
            say: "Which word has the er sound? Read them yourself."
            options: ["fist", "first"]
            answer: "first"
            option_audio: false
          - id: l1-c5
            type: highlight_in_text
            text: "Tap every word with ie."
            say: "Tap every word that has i and e together."
            show: { drawn: letter-card, text: "tie tip lie pin pie" }
            spans: ["tie", "lie", "pie"]
          - id: l1-c6
            type: multiple_choice
            text: "Which word is it?"
            say: "Look at the picture. Which word is it? Read them yourself."
            show: { object: mouth }
            options: ["mouth", "moth", "mash"]
            answer: "mouth"
            option_audio: false

  - n: 2
    title: { de: "ue, aw, wh, ph, ew, ey", en: "ue, aw, wh, ph, ew, ey" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "cloud" }
            options: [{ object: cloud }, { object: clown }, { object: clock }]
            answer: cloud
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tap every word with ay."
            say: "Tap every word that has a and y together."
            show: { drawn: letter-card, text: "say sit way pay pen" }
            spans: ["say", "way", "pay"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "ue   ew"
            say: "U and e say oo, as in blue. E and w can say oo too, as in flew and chew. In new and few, they say yoo."
          - text: "aw   wh   ph"
            say: "A and w say or, as in saw. W and h say w, as in whale. P and h say f, as in elephant."
            show: { object: whale }
          - text: "ey"
            say: "E and y at the end of a word often say ee, as in monkey and key."
            show: { object: monkey }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "whale" }
                options: [{ object: whale }, { object: wave }, { object: fish }]
                answer: whale
                hints:
                  - "w and h make one sound: w."
                  - "w ... ay ... l."
                  - "Whale."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "saw" }
                options: [{ object: sock }, { object: saw }, { object: sun }]
                answer: saw
                hints:
                  - "a and w make one sound: or."
                  - "s ... or."
                  - "Saw."
              - id: l2-f3
                type: multiple_choice
                text: "Which letters make the f sound in elephant?"
                say: "Which two letters make the f sound in elephant?"
                show: { object: elephant }
                options: ["ph", "wh", "ew"]
                answer: "ph"
                hints:
                  - "Look at the word: e l e p h a n t."
                  - "p and h say f."
                  - "ph."
              - id: l2-f4
                type: highlight_in_text
                text: "Tap every word with ew."
                say: "Tap every word that has e and w together."
                show: { drawn: letter-card, text: "grew now flew chew fox" }
                spans: ["grew", "flew", "chew"]
                hints:
                  - "Look at the end of each word."
                  - "Now has o and w, not e and w."
                  - "grew, flew and chew."
              - id: l2-f5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "monkey" }
                options: [{ object: monkey }, { object: moon }, { object: mouse }]
                answer: monkey
                hints:
                  - "e and y at the end say ee."
                  - "mon ... k ... ee."
                  - "Monkey."
              - id: l2-f6
                type: true_false
                text: "Is it true? In blue, the letters ue say oo."
                say: "Read the word on the card. Do the letters u and e say oo?"
                show: { drawn: letter-card, text: "blue" }
                answer: true
                hints:
                  - "Say blue."
                  - "bl ... oo."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "telephone" }
                options: [{ object: telephone }, { object: table }, { object: tree }]
                answer: telephone
                hints: ["p and h say f."]
              - id: l2-s2
                type: multiple_choice
                text: "Which letters make the w sound in whale?"
                say: "Which two letters make the w sound in whale?"
                show: { object: whale }
                options: ["wh", "ph", "aw"]
                answer: "wh"
                hints: ["The first two letters."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap every word with aw."
                say: "Tap every word that has a and w together."
                show: { drawn: letter-card, text: "paw cat draw saw cap" }
                spans: ["paw", "draw", "saw"]
                hints: ["Three words."]
              - id: l2-s4
                type: true_false
                text: "Is it true? In flew, the letters ew say ee."
                say: "Read the word on the card. Do the letters e and w say ee?"
                show: { drawn: letter-card, text: "flew" }
                answer: false
                hints: ["fl ... oo."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "elephant" }
                options: [{ object: egg }, { object: elephant }, { object: ear }]
                answer: elephant
                hints: ["A long word. Start at the beginning."]
              - id: l2-s6
                type: highlight_in_text
                text: "Tap every word with ue."
                say: "Tap every word that has u and e together."
                show: { drawn: letter-card, text: "blue glue bus clue cup" }
                spans: ["blue", "glue", "clue"]
                hints: ["Look at the end."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "saw" }
                options: [{ object: saw }, { object: star }, { object: sun }]
                answer: saw
              - id: l2-n2
                type: multiple_choice
                text: "Which letters make the ee sound at the end of monkey?"
                say: "Which two letters make the ee sound at the end of monkey?"
                show: { object: monkey }
                options: ["ey", "ew", "ue"]
                answer: "ey"
              - id: l2-n3
                type: highlight_in_text
                text: "Tap every word with wh."
                say: "Tap every word that has w and h together."
                show: { drawn: letter-card, text: "when wet what why web" }
                spans: ["when", "what", "why"]
              - id: l2-n4
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "whale" }
                options: [{ object: whale }, { object: snail }, { object: wave }]
                answer: whale
              - id: l2-n5
                type: true_false
                text: "Is it true? In saw, the letters aw say or."
                say: "Read the word on the card. Do the letters a and w say or?"
                show: { drawn: letter-card, text: "saw" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ay-ea-ie
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "crayon" }
            options: [{ object: cake }, { object: crayon }, { object: crocodile }]
            answer: crayon
            option_audio: false
          - id: l2-c2
            part: ou-oy-ir
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "skirt" }
            options: [{ object: sock }, { object: skirt }, { object: snail }]
            answer: skirt
            option_audio: false
          - id: l2-c3
            part: ou-oy-ir
            type: highlight_in_text
            text: "Tap every word with ir."
            say: "Tap every word that has i and r together."
            show: { drawn: letter-card, text: "bird sit first girl tin" }
            spans: ["bird", "first", "girl"]
          - id: l2-c4
            part: wh-ph-ey
            type: multiple_choice
            text: "Which letters make the f sound in this word?"
            say: "Read the word on the card. Which two letters make the f sound?"
            show: { drawn: letter-card, text: "telephone" }
            options: ["ph", "wh", "aw"]
            answer: "ph"
          - id: l2-c5
            part: ay-ea-ie
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "teacher" }
            options: [{ object: teacher }, { object: telephone }, { object: tree }]
            answer: teacher
            option_audio: false
          - id: l2-c6
            part: ay-ea-ie
            type: multiple_choice
            text: "Which word has the ee sound?"
            say: "Which word has the ee sound? Read them yourself."
            options: ["met", "meat"]
            answer: "meat"
            option_audio: false
          - id: l2-c7
            part: ay-ea-ie
            type: highlight_in_text
            text: "Tap every word with ay, ea or ie."
            say: "Tap every word that has a and y, e and a, or i and e together."
            show: { drawn: letter-card, text: "Ray has tea and a pie." }
            spans: ["Ray", "tea", "pie"]
          - id: l2-c8
            part: ou-oy-ir
            type: multiple_choice
            text: "Which word is it?"
            say: "Look at the picture. Which word is it? Read them yourself."
            show: { object: cloud }
            options: ["cloud", "clod", "cold"]
            answer: "cloud"
            option_audio: false
          - id: l2-c9
            part: ou-oy-ir
            type: true_false
            text: "Is it true? This word has the er sound."
            say: "Read the word yourself. Is it true? This word has the er sound."
            show: { drawn: letter-card, text: "shirt" }
            answer: true
          - id: l2-c10
            part: ue-ew-aw
            type: multiple_choice
            text: "Which word has the oo sound?"
            say: "Which word has the oo sound? Read them yourself."
            options: ["club", "clue"]
            answer: "clue"
            option_audio: false
          - id: l2-c11
            part: ue-ew-aw
            type: highlight_in_text
            text: "Tap every word with aw."
            say: "Tap every word that has a and w together."
            show: { drawn: letter-card, text: "jaw jam yawn dawn den" }
            spans: ["jaw", "yawn", "dawn"]
          - id: l2-c12
            part: ue-ew-aw
            type: true_false
            text: "Is it true? In this word, the letters ew say oo."
            say: "Read the word yourself. Is it true? In this word, the letters e and w say oo."
            show: { drawn: letter-card, text: "blew" }
            answer: true
          - id: l2-c13
            part: ue-ew-aw
            type: true_false
            text: "Is it true? These two words sound the same."
            say: "Read the two words yourself. Is it true? These two words sound the same."
            show: { drawn: letter-card, text: "draw drew" }
            answer: false
          - id: l2-c14
            part: wh-ph-ey
            type: highlight_in_text
            text: "Tap every word with ph."
            say: "Tap every word that has p and h together."
            show: { drawn: letter-card, text: "dolphin pan graph hop Phil" }
            spans: ["dolphin", "graph", "Phil"]
          - id: l2-c15
            part: wh-ph-ey
            type: true_false
            text: "Is it true? In this word, the letters ey say ee."
            say: "Read the word yourself. Is it true? In this word, the letters e and y say ee."
            show: { drawn: letter-card, text: "donkey" }
            answer: true
          - id: l2-c16
            part: wh-ph-ey
            type: multiple_choice
            text: "Phil saw a whale in the sea.\n\nWhat did Phil see?"
            say: "Read the sentence and the question. What did Phil see?"
            options: ["a whale", "a wheel", "a well"]
            answer: "a whale"
            option_audio: false
          - id: l2-c17
            part: mixed
            type: sorting
            text: "Sort the words by their sound."
            say: "Read each word. Does it have the oo sound, as in moon, or the ow sound, as in cloud? Put it in the right group."
            option_audio: false
            bins:
              - { id: oo, show: { object: moon }, say: "moon" }
              - { id: ow, show: { object: cloud }, say: "cloud" }
            options:
              - { text: "glue", bin: oo }
              - { text: "shout", bin: ow }
              - { text: "grew", bin: oo }
              - { text: "round", bin: ow }
          - id: l2-c18
            part: mixed
            type: true_false
            text: "Is it true? Both words have the oy sound."
            say: "Read the two words yourself. Is it true? Both words have the oy sound."
            show: { drawn: letter-card, text: "boy bird" }
            answer: false
          - id: l2-c19
            part: mixed
            type: multiple_choice
            text: "Which word does not have the ee sound?"
            say: "Which word does not have the ee sound? Read them yourself."
            options: ["seat", "key", "stew", "heap"]
            answer: "stew"
