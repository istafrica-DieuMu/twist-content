# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.capitals-names
skill: lit-en.grammar.capitals-names
curriculum: en-GB
language: en
title:
  de: Großbuchstaben für Namen und I
  en: Capital letters for names and I
summary: >
  A capital letter starts every sentence, and it also starts a name.
  Lesson 1 takes the names of people and pets and the word I, which is
  always a capital letter. Lesson 2 adds places (London, Leeds, Wales) and
  the days of the week, and ends with the skill check.
metadata:
  year: year-1
  topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.grammar.sentence-punctuation]
  also_practises: []
  vocabulary: { en: [capital letter, name, place, day of the week, sentence, I] }
  forms: [text, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: small-i
      what: Writes the word I as a small i
      addressed: Learn screen 3 in lesson 1; l1-f3 feedback on i; l1-s3, l1-n4 and l2-c2
    - id: capital-only-at-start
      what: Thinks a capital letter only goes at the start of a sentence, so writes names in the middle of a sentence small (I play with sam)
      addressed: Learn screen 2 in lesson 1; l1-f1 feedback; l1-f4, l2-f4 and l2-c4
    - id: every-noun-capital
      what: Gives a capital letter to ordinary things too (the Dog, my School)
      addressed: l1-f5, l1-s4, l2-s5 and l2-c4 set a name against an ordinary word
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Namen und I", en: "Names and I" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which sentence is written correctly?"
            options: ["The cat is black.", "the cat is black.", "The cat is black"]
            answer: "The cat is black."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Which mark goes at the end?"
            say: "Can you see the bus? Which mark goes at the end?"
            frame: "Can you see the bus_"
            options: ["?", ".", "!"]
            answer: ["?"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Sam   Mia   Biscuit"
            say: "These are names. Sam and Mia are children. Biscuit is a dog. A name always starts with a capital letter."
          - text: "I play with Sam."
            say: "A name keeps its capital letter in the middle of a sentence too. I play with Sam. Sam has a capital S."
          - text: "Mia and I went home."
            say: "When you write about yourself, the word I is always a capital letter, wherever it is in the sentence."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which sentence is written correctly?"
                options: ["I play with Ben.", "I play with ben.", "i play with ben."]
                answer: "I play with Ben."
                option_audio: false
                feedback:
                  "I play with ben.": "Ben is a name, so it needs a capital letter, even in the middle of a sentence."
                hints:
                  - "Find the name."
                  - "Ben is a name. Does it start with a capital?"
                  - "I play with Ben."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the name that needs a capital letter."
                show: { drawn: letter-card, text: "My best friend is zara." }
                spans: ["zara"]
                hints:
                  - "Look for a person's name."
                  - "Which word is someone's name?"
                  - "zara. It should be Zara."
              - id: l1-f3
                type: fill_in_blank
                text: "Which one is right?"
                say: "Mum and I made a cake. Which one is right?"
                frame: "Mum and _ made a cake."
                options: ["I", "i"]
                answer: ["I"]
                option_audio: false
                feedback:
                  "i": "When I means you, it is always a capital letter."
                hints:
                  - "This word means you, the writer."
                  - "That word is always a capital letter."
                  - "Capital I."
              - id: l1-f4
                type: true_false
                text: "Is it true? This sentence is right: \"Our cat is called tom.\""
                answer: false
                hints:
                  - "What is the cat's name?"
                  - "Tom is a name."
                  - "No. Tom needs a capital T."
              - id: l1-f5
                type: sorting
                text: "Capital letter or not?"
                say: "Sort the words. Does it need a capital letter, or not?"
                option_audio: false
                bins:
                  - { id: cap, show: { text: "capital" }, say: "Capital letter." }
                  - { id: small, show: { text: "small" }, say: "Small letter." }
                options:
                  - { text: "ali", bin: cap }
                  - { text: "dog", bin: small }
                  - { text: "priya", bin: cap }
                  - { text: "boy", bin: small }
                hints:
                  - "Ask: is it the name of one special person or pet?"
                  - "Dog and boy are not names."
                  - "Ali and Priya need capitals."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which sentence is written correctly?"
                options: ["Grandpa Joe has a van.", "Grandpa joe has a van.", "grandpa Joe has a van."]
                answer: "Grandpa Joe has a van."
                option_audio: false
                hints: ["The sentence starts with a capital, and so does the name."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tap the name that needs a capital letter."
                show: { drawn: letter-card, text: "This is my rabbit, flopsy." }
                spans: ["flopsy"]
                hints: ["Pets have names too."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the word that needs a capital letter."
                show: { drawn: letter-card, text: "Can i have a drink?" }
                spans: ["i"]
                hints: ["Which word means you?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? \"cat\" needs a capital letter."
                answer: false
                hints: ["Is it the name of one special cat?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Which one is right?"
                say: "Today I am six. Which one is right?"
                frame: "Today _ am six."
                options: ["i", "I"]
                answer: ["I"]
                option_audio: false
                hints: ["It means you."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which sentence is written correctly?"
                options: ["Leo and Amy are twins.", "leo and Amy are twins.", "Leo and amy are twins."]
                answer: "Leo and Amy are twins."
                option_audio: false
              - id: l1-n2
                type: highlight_in_text
                text: "Tap the name that needs a capital letter."
                show: { drawn: letter-card, text: "We had tea with Auntie meg." }
                spans: ["meg"]
              - id: l1-n3
                type: sorting
                text: "Capital letter or not?"
                say: "Sort the words. Does it need a capital letter, or not?"
                option_audio: false
                bins:
                  - { id: cap, show: { text: "capital" }, say: "Capital letter." }
                  - { id: small, show: { text: "small" }, say: "Small letter." }
                options:
                  - { text: "noah", bin: cap }
                  - { text: "girl", bin: small }
                  - { text: "rex", bin: cap }
                  - { text: "teacher", bin: small }
              - id: l1-n4
                type: true_false
                text: "Is it true? This sentence is right: \"Dad and I like football.\""
                answer: true
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the word that needs a capital letter."
                show: { drawn: letter-card, text: "Then i ran home." }
                spans: ["i"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the name that needs a capital letter."
            show: { drawn: letter-card, text: "I sit next to oscar." }
            spans: ["oscar"]
          - id: l1-c2
            type: fill_in_blank
            text: "Which one is right?"
            say: "Sam and I can swim. Which one is right?"
            frame: "Sam and _ can swim."
            options: ["I", "i"]
            answer: ["I"]
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Which sentence is written correctly?"
            options: ["My dog Max is big.", "My Dog max is big.", "My dog max is big."]
            answer: "My dog Max is big."
            option_audio: false

  - n: 2
    title: { de: "Orte und Wochentage", en: "Places and days" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the name that needs a capital letter."
            show: { drawn: letter-card, text: "This is my sister, lily." }
            spans: ["lily"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Which one is right?"
            say: "Can I come too? Which one is right?"
            frame: "Can _ come too?"
            options: ["i", "I"]
            answer: ["I"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "London   Leeds   Wales"
            say: "Places have names too. A town, a city or a country starts with a capital letter: London, Leeds, Wales."
          - text: "Monday   Tuesday   Wednesday   Thursday   Friday   Saturday   Sunday"
            say: "The days of the week are names as well. Every day starts with a capital letter."
          - text: "On Saturday we went to Bristol."
            say: "Capital O to start the sentence. Capital S for Saturday. Capital B for Bristol, a place."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which sentence is written correctly?"
                options: ["We live in York.", "We live in york.", "we live in York."]
                answer: "We live in York."
                option_audio: false
                hints:
                  - "Find the name of a place."
                  - "York is a city."
                  - "We live in York."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tap the day that needs a capital letter."
                show: { drawn: letter-card, text: "On monday I go swimming." }
                spans: ["monday"]
                hints:
                  - "Look for a day of the week."
                  - "Days of the week always start with a capital."
                  - "monday. It should be Monday."
              - id: l2-f3
                type: sorting
                text: "Person, place or day?"
                say: "Sort the names. Is it a person, a place or a day?"
                option_audio: false
                bins:
                  - { id: person, show: { text: "person" }, say: "Person." }
                  - { id: place, show: { text: "place" }, say: "Place." }
                  - { id: day, show: { text: "day" }, say: "Day." }
                options:
                  - { text: "Tom", bin: person }
                  - { text: "Paris", bin: place }
                  - { text: "Friday", bin: day }
                  - { text: "Scotland", bin: place }
                hints:
                  - "Each one has a capital letter. Think what it names."
                  - "Paris and Scotland are places on a map."
                  - "Tom is a person, Friday is a day, Paris and Scotland are places."
              - id: l2-f4
                type: multiple_choice
                text: "Which sentence is written correctly?"
                options: ["On Sunday Nan came to see us.", "On sunday Nan came to see us.", "On Sunday nan came to see us."]
                answer: "On Sunday Nan came to see us."
                option_audio: false
                feedback:
                  "On sunday Nan came to see us.": "Sunday is a day of the week, so it needs a capital S."
                hints:
                  - "There is a day and a name in this sentence."
                  - "Sunday and Nan both need capitals."
                  - "On Sunday Nan came to see us."
              - id: l2-f5
                type: true_false
                text: "Is it true? \"tuesday\" is written correctly."
                answer: false
                hints:
                  - "Is it a day of the week?"
                  - "Days start with a capital."
                  - "No. Tuesday."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap the place that needs a capital letter."
                show: { drawn: letter-card, text: "My gran lives in cardiff." }
                spans: ["cardiff"]
                hints: ["Which word names a city?"]
              - id: l2-s2
                type: multiple_choice
                text: "Which day is written correctly?"
                options: ["Thursday", "thursday", "thursDay"]
                answer: "Thursday"
                option_audio: false
                hints: ["Only the first letter is a capital."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap every word that needs a capital letter."
                show: { drawn: letter-card, text: "On friday we saw ella." }
                spans: ["friday", "ella"]
                hints: ["There is a day and a person."]
              - id: l2-s4
                type: true_false
                text: "Is it true? This sentence is right: \"I went to Wales on Saturday.\""
                answer: true
                hints: ["Check I, the place and the day."]
              - id: l2-s5
                type: sorting
                text: "Capital letter or not?"
                say: "Sort the words. Does it need a capital letter, or not?"
                option_audio: false
                bins:
                  - { id: cap, show: { text: "capital" }, say: "Capital letter." }
                  - { id: small, show: { text: "small" }, say: "Small letter." }
                options:
                  - { text: "wednesday", bin: cap }
                  - { text: "town", bin: small }
                  - { text: "england", bin: cap }
                  - { text: "day", bin: small }
                hints: ["Town and day are not names."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which sentence is written correctly?"
                options: ["Ravi is from India.", "Ravi is from india.", "ravi is from India."]
                answer: "Ravi is from India."
                option_audio: false
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the day that needs a capital letter."
                show: { drawn: letter-card, text: "The party is on saturday." }
                spans: ["saturday"]
              - id: l2-n3
                type: highlight_in_text
                text: "Tap every word that needs a capital letter."
                show: { drawn: letter-card, text: "my dog and i ran home." }
                spans: ["my", "i"]
              - id: l2-n4
                type: true_false
                text: "Is it true? This sentence is right: \"On Monday i went to Leeds.\""
                answer: false
              - id: l2-n5
                type: sorting
                text: "Person, place or day?"
                say: "Sort the names. Is it a person, a place or a day?"
                option_audio: false
                bins:
                  - { id: person, show: { text: "person" }, say: "Person." }
                  - { id: place, show: { text: "place" }, say: "Place." }
                  - { id: day, show: { text: "day" }, say: "Day." }
                options:
                  - { text: "Jack", bin: person }
                  - { text: "Wednesday", bin: day }
                  - { text: "Manchester", bin: place }
                  - { text: "Sunday", bin: day }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tap the place that needs a capital letter."
            show: { drawn: letter-card, text: "We went on a train to london." }
            spans: ["london"]
          - id: l2-c2
            type: fill_in_blank
            text: "Which one is right?"
            say: "Dad and I fed the ducks. Which one is right?"
            frame: "Dad and _ fed the ducks."
            options: ["i", "I"]
            answer: ["I"]
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "Which day is written correctly?"
            options: ["wednesday", "Wednesday", "WEDnesday"]
            answer: "Wednesday"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which sentence is written correctly?"
            options: ["I gave a card to Mr Khan.", "I gave a card to mr khan.", "I gave a Card to Mr Khan."]
            answer: "I gave a card to Mr Khan."
            option_audio: false
          - id: l2-c5
            type: highlight_in_text
            text: "Tap every word that needs a capital letter."
            show: { drawn: letter-card, text: "On tuesday amir and I played." }
            spans: ["tuesday", "amir"]
