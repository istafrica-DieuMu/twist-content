# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.grammar-words
skill: lit-en.grammar.terms-y1
curriculum: en-GB
language: en
title:
  de: Fachwörter für Buchstaben, Wörter und Sätze
  en: Letters, words and sentences
summary: >
  The words we use to talk about writing. Lesson 1 tells a letter from a
  word and a word from a sentence, and names the capital letter. Lesson 2
  takes singular and plural, and the punctuation marks that end a
  sentence (full stop, question mark, exclamation mark), and ends with
  the skill check.
metadata:
  year: year-1
  topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.grammar.capitals-names]
  also_practises: [lit-en.grammar.sentence-punctuation]
  vocabulary: { en: [letter, capital letter, word, sentence, singular, plural, punctuation, full stop, question mark, exclamation mark] }
  forms: [text, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: letter-word-sentence, what: { de: "Buchstabe, Wort und Satz unterscheiden", en: "telling a letter, a word and a sentence apart" } }
    - { id: capital, what: { de: Großbuchstaben erkennen und benennen, en: knowing and finding capital letters } }
    - { id: singular-plural, what: { de: Einzahl und Mehrzahl (singular und plural) kennen, en: knowing singular and plural } }
    - { id: punctuation, what: { de: "Punkt, Fragezeichen und Ausrufezeichen benennen und setzen", en: "naming and using the full stop, question mark and exclamation mark" } }
  misconceptions:
    - id: letter-word-mixed
      what: Mixes up letter and word (counts letters when asked for words)
      addressed: Learn screens 1 and 2 in lesson 1; l1-f1 feedback on the letter count; l1-s1, l1-n1 and l2-c1
    - id: any-words-a-sentence
      what: Thinks any group of words is a sentence (the big red)
      addressed: Learn screen 3 in lesson 1; l1-f4, l1-s4 and l1-n4
    - id: singular-plural-swapped
      what: Swaps singular and plural, or thinks plural means two exactly
      addressed: Learn screen 1 in lesson 2; l2-f1 feedback; l2-s1 and l2-c3
    - id: marks-mixed
      what: Mixes up the names of the full stop, question mark and exclamation mark
      addressed: Learn screen 2 in lesson 2 and matching in l2-f3; l2-s3, l2-n3 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Buchstabe, Wort, Satz", en: "Letter, word, sentence" }
    goal:
      de: "Unterscheide Buchstaben, Wörter und Sätze, so wie cat ist ein Wort aus drei Buchstaben."
      en: "Tell letters, words and sentences apart, like cat is a word with three letters."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tap the name that needs a capital letter."
            show: { drawn: letter-card, text: "I play with jess." }
            spans: ["jess"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which sentence is written correctly?"
            options: ["On Monday I go to Nan's.", "On monday I go to Nan's.", "On Monday i go to Nan's."]
            answer: "On Monday I go to Nan's."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "c   a   t"
            say: "These are letters. We put letters together to make words. C, a, t: three letters."
            show: { object: cat }
          - text: "cat"
            say: "Together they make a word: cat. In a sentence there is a space between each word."
          - text: "The cat is asleep."
            say: "This is a sentence. It makes sense on its own. It starts with a capital letter, capital T, and ends with a full stop."
          - text: "A a   B b   C c"
            say: "Every letter has a capital letter and a small letter. Capital A, small a."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many words?\n\nThe dog ran."
                say: "Read the sentence. How many words are there?"
                options: ["3", "9", "1"]
                answer: "3"
                feedback:
                  "9": "That is how many letters there are. Count the words: the spaces split them."
                hints:
                  - "Words have spaces between them."
                  - "The, dog, ran."
                  - "Three words."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many letters?\n\nsun"
                say: "How many letters are in this word?"
                show: { object: sun }
                options: ["3", "1", "2"]
                answer: "3"
                hints:
                  - "Point to each letter."
                  - "s, u, n."
                  - "Three letters."
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the capital letter."
                show: { drawn: letter-card, text: "d B e a" }
                spans: ["B"]
                hints:
                  - "A capital letter is the big one."
                  - "Capital letters are the ones we use to start a name."
                  - "B."
              - id: l1-f4
                type: multiple_choice
                text: "Which one is a sentence?"
                options: ["The bus is late.", "the big red", "bus late is"]
                answer: "The bus is late."
                option_audio: false
                hints:
                  - "A sentence makes sense on its own."
                  - "It starts with a capital letter and ends with a full stop."
                  - "The bus is late."
              - id: l1-f5
                type: true_false
                text: "Is it true? \"fish\" is a word with four letters."
                show: { object: fish }
                answer: true
                hints:
                  - "Count the letters."
                  - "f, i, s, h."
                  - "Yes, four letters."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many words?\n\nI like red apples."
                say: "Read the sentence. How many words are there?"
                options: ["4", "3", "14"]
                answer: "4"
                hints: ["Count the gaps, then add one."]
              - id: l1-s2
                type: multiple_choice
                text: "What is \"m\"?"
                say: "Is m a letter, a word or a sentence?"
                options: ["a letter", "a word", "a sentence"]
                answer: "a letter"
                keep_order: true
                hints: ["How many letters can you see?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap every capital letter."
                show: { drawn: letter-card, text: "r T g S h" }
                spans: ["T", "S"]
                hints: ["There are two capital letters."]
              - id: l1-s4
                type: true_false
                text: "Is it true? \"a happy little\" is a sentence."
                answer: false
                hints: ["Does it make sense on its own?"]
              - id: l1-s5
                type: multiple_choice
                text: "What is \"jump\"?"
                say: "Is jump a letter, a word or a sentence?"
                options: ["a letter", "a word", "a sentence"]
                answer: "a word"
                keep_order: true
                hints: ["It is made of letters, with no spaces."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many words?\n\nMy mum has a car."
                say: "Read the sentence. How many words are there?"
                options: ["5", "12", "4"]
                answer: "5"
              - id: l1-n2
                type: multiple_choice
                text: "What is \"We are going home.\"?"
                say: "Is this a letter, a word or a sentence?"
                options: ["a letter", "a word", "a sentence"]
                answer: "a sentence"
                keep_order: true
              - id: l1-n3
                type: multiple_choice
                text: "How many letters?\n\nfrog"
                say: "How many letters are in this word?"
                show: { object: frog }
                options: ["4", "3", "1"]
                answer: "4"
              - id: l1-n4
                type: multiple_choice
                text: "Which one is a sentence?"
                options: ["in the park", "We play in the park.", "play park the"]
                answer: "We play in the park."
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? In \"Ben ran.\" the capital letter is B."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many words?\n\nThe sun is hot."
            say: "Read the sentence. How many words are there?"
            options: ["4", "11", "3"]
            answer: "4"
          - id: l1-c2
            type: multiple_choice
            text: "What is \"k\"?"
            say: "Is k a letter, a word or a sentence?"
            options: ["a letter", "a word", "a sentence"]
            answer: "a letter"
            keep_order: true
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the capital letter."
            show: { drawn: letter-card, text: "p q M n" }
            spans: ["M"]
          - id: l1-c4
            type: true_false
            text: "Is it true? \"I can run.\" is a sentence."
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "How many words?\n\nWe can see the sea."
            say: "Read the sentence. How many words are there?"
            options: ["5", "14", "4"]
            answer: "5"
          - id: l1-c6
            type: highlight_in_text
            text: "Tap every small letter."
            say: "Tap every letter that is not a capital letter."
            show: { drawn: letter-card, text: "B d F g H" }
            spans: ["d", "g"]

  - n: 2
    title: { de: "Einzahl, Mehrzahl, Satzzeichen", en: "Singular, plural, punctuation" }
    goal:
      de: "Lerne Einzahl und Mehrzahl, so wie ein Hund und zwei Hunde, und die Zeichen am Ende eines Satzes."
      en: "Learn singular and plural, like one dog and two dogs, and the marks that end a sentence."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many words?\n\nI can hop."
            say: "Read the sentence. How many words are there?"
            options: ["3", "7", "2"]
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is \"bed\"?"
            say: "Is bed a letter, a word or a sentence?"
            options: ["a letter", "a word", "a sentence"]
            answer: "a word"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "dog = singular\ndogs = plural"
            say: "Singular means just one: one dog. Plural means more than one: two dogs, ten dogs, lots of dogs."
            show: { object: dog, count: 3, layout: row }
          - text: ".   ?   !"
            say: "These are punctuation marks. A full stop ends a telling sentence. A question mark ends a question. An exclamation mark shows a strong feeling, or something said loudly."
          - text: "It is raining.\nIs it raining?\nIt is pouring!"
            say: "Full stop: it is raining. Question mark: is it raining? Exclamation mark: it is pouring!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"cats\" is ..."
                say: "Is cats singular or plural?"
                show: { object: cat, count: 4, layout: row }
                options: ["singular", "plural"]
                answer: "plural"
                feedback:
                  "singular": "Singular means just one. There is more than one cat, so it is plural."
                hints:
                  - "How many cats are there?"
                  - "More than one cat."
                  - "Plural."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which punctuation mark goes at the end?"
                say: "Where is my hat? Which punctuation mark goes at the end?"
                frame: "Where is my hat_"
                options: ["?", ".", "!"]
                answer: ["?"]
                option_audio: false
                hints:
                  - "Is it telling or asking?"
                  - "It asks something."
                  - "A question mark."
              - id: l2-f3
                type: matching
                text: "Match each mark to its name."
                option_audio: false
                pairs:
                  - { left: { text: "." }, right: { text: "full stop" } }
                  - { left: { text: "?" }, right: { text: "question mark" } }
                  - { left: { text: "!" }, right: { text: "exclamation mark" } }
                hints:
                  - "One mark has a curly hook on top."
                  - "The hook is the question mark. The tall line is the exclamation mark."
                  - "Dot: full stop. Hook: question mark. Line and dot: exclamation mark."
              - id: l2-f4
                type: true_false
                text: "Is it true? \"apple\" is singular."
                show: { object: apple }
                answer: true
                hints:
                  - "How many apples does it name?"
                  - "Just one."
                  - "Yes, singular."
              - id: l2-f5
                type: multiple_choice
                text: "What is the name of this mark?\n\nI love it!"
                say: "Look at the mark at the end. What is its name?"
                options: ["full stop", "question mark", "exclamation mark"]
                answer: "exclamation mark"
                hints:
                  - "It shows a strong feeling."
                  - "It is a line with a dot under it."
                  - "Exclamation mark."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Singular or plural?"
                say: "Sort the words. Singular or plural?"
                option_audio: false
                bins:
                  - { id: one, show: { text: "singular" }, say: "Singular." }
                  - { id: many, show: { text: "plural" }, say: "Plural." }
                options:
                  - { text: "bus", bin: one }
                  - { text: "cups", bin: many }
                  - { text: "boxes", bin: many }
                  - { text: "hen", bin: one }
                hints: ["Bus ends in s, but it is one bus."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which punctuation mark goes at the end?"
                say: "We had fish for tea. Which punctuation mark goes at the end?"
                frame: "We had fish for tea_"
                options: ["?", ".", "!"]
                answer: ["."]
                option_audio: false
                hints: ["It tells you something, calmly."]
              - id: l2-s3
                type: multiple_choice
                text: "What is the name of this mark?\n\nCan I go out?"
                say: "Look at the mark at the end. What is its name?"
                options: ["full stop", "question mark", "exclamation mark"]
                answer: "question mark"
                hints: ["The sentence asks something."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Punctuation means the letters in a word."
                answer: false
                hints: ["Think of full stops and question marks."]
              - id: l2-s5
                type: fill_in_blank
                text: "Which punctuation mark goes at the end?"
                say: "Look out! Which punctuation mark goes at the end?"
                frame: "Look out_"
                options: ["?", ".", "!"]
                answer: ["!"]
                option_audio: false
                hints: ["It is a shout."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"ducks\" is ..."
                say: "Is ducks singular or plural?"
                options: ["singular", "plural"]
                answer: "plural"
              - id: l2-n2
                type: fill_in_blank
                text: "Which punctuation mark goes at the end?"
                say: "Do you like cake? Which punctuation mark goes at the end?"
                frame: "Do you like cake_"
                options: ["?", ".", "!"]
                answer: ["?"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "What is the name of this mark?\n\nThe bell rang."
                say: "Look at the mark at the end. What is its name?"
                options: ["full stop", "question mark", "exclamation mark"]
                answer: "full stop"
              - id: l2-n4
                type: true_false
                text: "Is it true? \"stars\" is singular."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "What do we call . ? and ! together?"
                say: "What do we call these marks together?"
                options: ["punctuation", "letters", "words"]
                answer: "punctuation"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: letter-word-sentence
            type: multiple_choice
            text: "How many words?\n\nThe frog is green."
            say: "Read the sentence. How many words are there?"
            options: ["4", "14", "3"]
            answer: "4"
          - id: l2-c2
            part: letter-word-sentence
            type: multiple_choice
            text: "Which one is a sentence?"
            options: ["the tall tree", "I can see a tree.", "tree a see"]
            answer: "I can see a tree."
            option_audio: false
          - id: l2-c3
            part: singular-plural
            type: multiple_choice
            text: "\"bells\" is ..."
            say: "Is bells singular or plural?"
            options: ["singular", "plural"]
            answer: "plural"
          - id: l2-c4
            part: punctuation
            type: multiple_choice
            text: "What is the name of this mark?\n\nWhat a big dog!"
            say: "Look at the mark at the end. What is its name?"
            options: ["full stop", "question mark", "exclamation mark"]
            answer: "exclamation mark"
          - id: l2-c5
            part: capital
            type: highlight_in_text
            text: "Tap every word that starts with a capital letter."
            show: { drawn: letter-card, text: "Sam and Ivy went out." }
            spans: ["Sam", "Ivy"]
          - id: l2-c6
            part: letter-word-sentence
            type: multiple_choice
            text: "How many letters?\n\nplant"
            say: "How many letters are in this word?"
            options: ["5", "1", "4"]
            answer: "5"
          - id: l2-c7
            part: letter-word-sentence
            type: sorting
            text: "Letter, word or sentence?"
            say: "Read each card. Is it a letter, a word or a sentence? Put it in the right group."
            option_audio: false
            bins:
              - { id: letter, show: { text: "letter" }, say: "Letter." }
              - { id: word, show: { text: "word" }, say: "Word." }
              - { id: sentence, show: { text: "sentence" }, say: "Sentence." }
            options:
              - { text: "b", bin: letter }
              - { text: "hat", bin: word }
              - { text: "I am six.", bin: sentence }
              - { text: "t", bin: letter }
              - { text: "run", bin: word }
              - { text: "The sun is up.", bin: sentence }
          - id: l2-c8
            part: letter-word-sentence
            type: true_false
            text: "Is it true? \"dog\" is three words."
            answer: false
          - id: l2-c9
            part: capital
            type: multiple_choice
            text: "Which is the capital letter for g?"
            say: "Which one is the capital letter for g?"
            options: ["G", "g", "q"]
            answer: "G"
            option_audio: false
          - id: l2-c10
            part: capital
            type: true_false
            text: "Is it true? A sentence starts with a capital letter."
            answer: true
          - id: l2-c11
            part: capital
            type: matching
            text: "Match each small letter to its capital letter."
            option_audio: false
            pairs:
              - { left: { text: "a" }, right: { text: "A" } }
              - { left: { text: "d" }, right: { text: "D" } }
              - { left: { text: "r" }, right: { text: "R" } }
          - id: l2-c12
            part: capital
            type: highlight_in_text
            text: "Tap every word that needs a capital letter."
            show: { drawn: letter-card, text: "my dog is called rex." }
            spans: ["my", "rex"]
          - id: l2-c13
            part: singular-plural
            type: sorting
            text: "Put each word in the right group."
            say: "Read each word. Is it singular or plural? Put it in the right group."
            option_audio: false
            bins:
              - { id: one, show: { text: "singular" }, say: "Singular." }
              - { id: many, show: { text: "plural" }, say: "Plural." }
            options:
              - { text: "pens", bin: many }
              - { text: "fox", bin: one }
              - { text: "glass", bin: one }
              - { text: "hats", bin: many }
          - id: l2-c14
            part: singular-plural
            type: multiple_choice
            text: "Which word is plural?"
            say: "Read the words yourself. Which word is plural?"
            options: ["dress", "bus", "pigs"]
            answer: "pigs"
            option_audio: false
          - id: l2-c15
            part: singular-plural
            type: true_false
            text: "Is it true? Plural means more than one."
            answer: true
          - id: l2-c16
            part: singular-plural
            type: multiple_choice
            text: "What does singular mean?"
            options: ["just one", "more than one", "a capital letter"]
            answer: "just one"
          - id: l2-c17
            part: punctuation
            type: fill_in_blank
            text: "Which punctuation mark goes at the end?"
            say: "Read the sentence. Which punctuation mark goes at the end?"
            frame: "Help, the bath is too full_"
            options: ["?", ".", "!"]
            answer: ["!"]
            option_audio: false
          - id: l2-c18
            part: punctuation
            type: true_false
            text: "Is it true? \"Where is Mum?\" ends with a full stop."
            answer: false
          - id: l2-c19
            part: punctuation
            type: multiple_choice
            text: "Which mark ends a question?"
            options: ["full stop", "question mark", "exclamation mark"]
            answer: "question mark"
            keep_order: true
          - id: l2-c20
            part: punctuation
            type: multiple_choice
            text: "Which sentence is a question?"
            options: ["The cat is in the box.", "Is the cat in the box?", "The cat is in the box!"]
            answer: "Is the cat in the box?"
            option_audio: false
