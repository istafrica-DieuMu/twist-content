# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.dictation-simple
skill: lit-en.spelling.dictation-y1
curriculum: en-GB
language: en
title:
  de: Einfache Diktatsätze
  en: Writing a sentence I hear
summary: >
  The child hears a short sentence and writes it with the sounds and
  tricky words they know. Lesson 1 hears a sentence and fills the missing
  word, a tricky word or a word to sound out, from chips and then typed
  on the letter keyboard. Lesson 2 builds the whole
  sentence from word cards, checks the capital letter and full stop, and
  chooses the sentence written exactly as heard; it ends with the skill
  check. Writing the whole sentence by hand waits on a writing task that
  can be marked.
metadata:
  year: year-1
  topic: { de: "Rechtschreibung", en: "Spelling" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.spelling.exception-words-y1]
  also_practises: [lit-en.grammar.sentence-punctuation]
  vocabulary: { en: [tricky word, sound out, sentence, capital letter, full stop, listen, check] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: tricky-sounded-out
      what: Sounds out a tricky word letter by letter (sed for said, woz for was)
      addressed: Learn screen 2 in lesson 1; l1-f1 feedback on sed; l1-f4 feedback on woz; l2-c2
    - id: word-left-out
      what: Leaves out a small word when writing a heard sentence (I went the park)
      addressed: Learn screen 1 in lesson 2 says to count the words; l2-f2, l2-s2 and l2-c4 offer a sentence with a word missing
    - id: punctuation-forgotten
      what: Writes the words but forgets the capital letter or the full stop
      addressed: Learn screen 3 in lesson 2; l2-f4, l2-s4 and l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Das fehlende Wort", en: "The missing word" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which tricky word did you hear?"
            audio: { en: "The." }
            options: ["the", "thu", "fe"]
            answer: "the"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which day did you hear?"
            audio: { en: "Monday." }
            options: ["Monday", "Munday", "Mondy"]
            answer: "Monday"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Listen. Say it. Write it."
            say: "In a dictation you hear a sentence. Listen to all of it. Say it back to yourself. Then write it, one word at a time."
          - text: "said   was   they   my"
            say: "Some words are tricky words. You cannot sound them all out. Said is not spelt s, e, d. You have to know them, so learn them by heart."
          - text: "I can see a big ship."
            say: "Other words you can sound out, like big and ship. Say each sound, then write a letter or letters for each one."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: Mum said hello. Which word is missing?"
                frame: "Mum _ hello."
                options: ["said", "sed", "sayd"]
                answer: ["said"]
                option_audio: false
                feedback:
                  "sed": "Said is a tricky word. It is spelt s, a, i, d."
                hints:
                  - "The missing word is a tricky word."
                  - "It has an a and an i in the middle."
                  - "Said."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: I can see a big ship. Which word is missing?"
                frame: "I can see a big _."
                options: ["ship", "sip", "chip"]
                answer: ["ship"]
                option_audio: false
                hints:
                  - "Say the sounds in the missing word."
                  - "It starts with the sh sound."
                  - "Ship."
              - id: l1-f3
                type: audio_choice
                text: "Which sentence did you hear?"
                audio: { en: "We go to school." }
                options: ["We go to school.", "We go to the school.", "We go school."]
                answer: "We go to school."
                hints:
                  - "Listen again and count the words."
                  - "There are four words: we, go, to, school."
                  - "We go to school."
              - id: l1-f4
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: It was a hot day. Which word is missing?"
                frame: "It _ a hot day."
                options: ["was", "woz", "wos"]
                answer: ["was"]
                option_audio: false
                feedback:
                  "woz": "Was is a tricky word. It sounds like woz, but it is spelt w, a, s."
                hints:
                  - "The missing word is a tricky word."
                  - "It has an a in the middle, not an o."
                  - "Was."
              - id: l1-f5
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: The fox ran up the hill. Which word is missing?"
                frame: "The _ ran up the hill."
                options: ["fox", "fix", "box"]
                answer: ["fox"]
                option_audio: false
                hints:
                  - "Say the sounds in the missing word."
                  - "Say each sound slowly, then find the letters."
                  - "Fox."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: They are in the garden. Which word is missing?"
                frame: "_ are in the garden."
                options: ["They", "Thay", "Thei"]
                answer: ["They"]
                option_audio: false
                hints: ["They is a tricky word with e and y at the end."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: I had a cup of milk. Which word is missing?"
                frame: "I had a _ of milk."
                options: ["cup", "cap", "cop"]
                answer: ["cup"]
                option_audio: false
                hints: ["Say each sound in the word. Which letter makes the middle sound?"]
              - id: l1-s3
                type: audio_choice
                text: "Which sentence did you hear?"
                audio: { en: "My dog is sad." }
                options: ["My dog is sad.", "My dog was sad.", "My dad is sad."]
                answer: "My dog is sad."
                hints: ["Listen for each word in turn."]
              - id: l1-s4
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: Can you help me? Which word is missing?"
                frame: "Can _ help me?"
                options: ["you", "yoo", "u"]
                answer: ["you"]
                option_audio: false
                hints: ["You is a tricky word: y, o, u."]
              - id: l1-s5
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: We sat on the bench. Which word is missing?"
                frame: "We sat on the _."
                options: ["bench", "bensh", "bend"]
                answer: ["bench"]
                option_audio: false
                hints: ["The last sound is ch."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nI ____ my friend."
                say: "Listen: I love my friend. Write the missing word."
                answer: "love"
              - id: l1-n2
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nThe duck is in the ____."
                say: "Listen: The duck is in the pond. Write the missing word."
                answer: "pond"
              - id: l1-n3
                type: audio_choice
                text: "Which sentence did you hear?"
                audio: { en: "Come and play with me." }
                options: ["Come and play with me.", "Come to play with me.", "Come and play me."]
                answer: "Come and play with me."
              - id: l1-n4
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: Here is my house. Which word is missing?"
                frame: "_ is my house."
                options: ["Here", "Hear", "Heer"]
                answer: ["Here"]
                option_audio: false
              - id: l1-n5
                type: fill_in_blank
                text: "Which word is missing?"
                say: "Listen: On Friday we go swimming. Which word is missing?"
                frame: "On _ we go swimming."
                options: ["Friday", "Fryday", "friday"]
                answer: ["Friday"]
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Which word is missing?"
            say: "Listen: He went to the shop. Which word is missing?"
            frame: "He _ to the shop."
            options: ["went", "wnet", "wet"]
            answer: ["went"]
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Which word is missing?"
            say: "Listen: Mum says yes. Which word is missing?"
            frame: "Mum _ yes."
            options: ["says", "sez", "sayz"]
            answer: ["says"]
            option_audio: false
          - id: l1-c3
            type: audio_choice
            text: "Which sentence did you hear?"
            audio: { en: "The cat is on the mat." }
            options: ["The cat is on the mat.", "The cat sat on the mat.", "A cat is on the mat."]
            answer: "The cat is on the mat."

  - n: 2
    title: { de: "Der ganze Satz", en: "The whole sentence" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Which word is missing?"
            say: "Listen: It was my birthday. Which word is missing?"
            frame: "It _ my birthday."
            options: ["was", "woz", "wos"]
            answer: ["was"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Which word is missing?"
            say: "Listen: Dad said hello. Which word is missing?"
            frame: "Dad _ hello."
            options: ["said", "sed", "sayd"]
            answer: ["said"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "I went to the park."
            say: "Listen: I went to the park. Count the words on your fingers: I, went, to, the, park. Five words. When you have written it, count again. Did you miss one?"
          - text: "Sound out: went, park\nTricky words: I, to, the"
            say: "Sound out the words you can. Write the tricky words from memory."
          - text: "I went to the park."
            say: "Then check. A capital letter at the start. A full stop at the end. Read it back: does it say what you heard?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Build the sentence you hear."
                say: "Listen: The dog is wet. Put the words in order."
                options: ["is", "The", "wet.", "dog"]
                slot_count: 4
                answer: ["The", "dog", "is", "wet."]
                option_audio: false
                hints:
                  - "Which word has a capital letter? That one goes first."
                  - "The dog ... then what is the dog?"
                  - "The dog is wet."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which sentence did you hear?"
                audio: { en: "I went to the park." }
                options: ["I went to the park.", "I went the park.", "I went to park."]
                answer: "I went to the park."
                feedback:
                  "I went the park.": "Count the words: I, went, to, the, park. A word is missing."
                hints:
                  - "Count the words you hear."
                  - "There are five words."
                  - "I went to the park."
              - id: l2-f3
                type: ordering
                text: "Build the sentence you hear."
                say: "Listen: She has a red hat. Put the words in order."
                options: ["red", "a", "She", "hat.", "has"]
                slot_count: 5
                answer: ["She", "has", "a", "red", "hat."]
                option_audio: false
                hints:
                  - "Start with the word that has a capital letter."
                  - "She has ... a red what?"
                  - "She has a red hat."
              - id: l2-f4
                type: multiple_choice
                text: "Which one is written correctly?"
                say: "Listen: We like fish. Which one is written correctly?"
                options: ["We like fish.", "we like fish.", "We like fish"]
                answer: "We like fish."
                option_audio: false
                feedback:
                  "we like fish.": "A sentence starts with a capital letter: We."
                hints:
                  - "Look at the start and the end."
                  - "You need a capital letter and a full stop."
                  - "We like fish."
              - id: l2-f5
                type: true_false
                text: "Is it true? You heard \"They go to school.\" Sam wrote: They go to school."
                answer: true
                hints:
                  - "Check each word, then the capital and full stop."
                  - "They, go, to, school: all there."
                  - "Yes, it is right."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Build the sentence you hear."
                say: "Listen: My mum is at home. Put the words in order."
                options: ["at", "My", "home.", "mum", "is"]
                slot_count: 5
                answer: ["My", "mum", "is", "at", "home."]
                option_audio: false
                hints: ["The word with a capital letter goes first."]
              - id: l2-s2
                type: audio_choice
                text: "Which sentence did you hear?"
                audio: { en: "Put the cup on the table." }
                options: ["Put the cup on the table.", "Put cup on the table.", "Put the cup the table."]
                answer: "Put the cup on the table."
                hints: ["Count the words: there are six."]
              - id: l2-s3
                type: multiple_choice
                text: "Which one is written correctly?"
                say: "Listen: I was sad. Which one is written correctly?"
                options: ["I was sad.", "I woz sad.", "I was sad"]
                answer: "I was sad."
                option_audio: false
                hints: ["Check the tricky word and the full stop."]
              - id: l2-s4
                type: true_false
                text: "Is it true? You heard \"We can run.\" Ali wrote: we can run."
                answer: false
                hints: ["Look at the first letter."]
              - id: l2-s5
                type: ordering
                text: "Build the sentence you hear."
                say: "Listen: Where is my bag? Put the words in order."
                options: ["my", "Where", "bag?", "is"]
                slot_count: 4
                answer: ["Where", "is", "my", "bag?"]
                option_audio: false
                hints: ["It is a question, so it ends with the question mark."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Build the sentence you hear."
                say: "Listen: The sun is hot today. Put the words in order."
                options: ["hot", "The", "today.", "sun", "is"]
                slot_count: 5
                answer: ["The", "sun", "is", "hot", "today."]
                option_audio: false
              - id: l2-n2
                type: audio_choice
                text: "Which sentence did you hear?"
                audio: { en: "He said I can come." }
                options: ["He said I can come.", "He said can come.", "He sed I can come."]
                answer: "He said I can come."
              - id: l2-n3
                type: multiple_choice
                text: "Which one is written correctly?"
                say: "Listen: Some ducks swim. Which one is written correctly?"
                options: ["Sum ducks swim.", "Some ducks swim.", "some ducks swim."]
                answer: "Some ducks swim."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? You heard \"My friend is kind.\" Zara wrote: My frend is kind."
                answer: false
              - id: l2-n5
                type: ordering
                text: "Build the sentence you hear."
                say: "Listen: On Monday we have a test. Put the words in order."
                options: ["we", "Monday", "On", "a", "have", "test."]
                slot_count: 6
                answer: ["On", "Monday", "we", "have", "a", "test."]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nThe bird is in the ____."
            say: "Listen: The bird is in the nest. Write the missing word."
            answer: "nest"
          - id: l2-c2
            type: fill_in_blank
            text: "Which word is missing?"
            say: "Listen: Where are you? Which word is missing?"
            frame: "_ are you?"
            options: ["Where", "Wear", "Wair"]
            answer: ["Where"]
            option_audio: false
          - id: l2-c3
            type: ordering
            text: "Build the sentence you hear."
            say: "Listen: I like my school. Put the words in order."
            options: ["school.", "like", "I", "my"]
            slot_count: 4
            answer: ["I", "like", "my", "school."]
            option_audio: false
          - id: l2-c4
            type: audio_choice
            text: "Which sentence did you hear?"
            audio: { en: "We went to see the sea." }
            options: ["We went to see the sea.", "We went see the sea.", "We went to the sea."]
            answer: "We went to see the sea."
          - id: l2-c5
            type: multiple_choice
            text: "Which one is written correctly?"
            say: "Listen: The boy has a kite. Which one is written correctly?"
            options: ["the boy has a kite.", "The boy has a kite", "The boy has a kite."]
            answer: "The boy has a kite."
            option_audio: false
