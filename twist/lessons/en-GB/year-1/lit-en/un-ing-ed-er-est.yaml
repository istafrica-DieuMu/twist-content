# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.un-ing-ed-er-est
skill: lit-en.spelling.un-ing-ed-er-est
curriculum: en-GB
language: en
title:
  de: un-, -ing, -ed, -er und -est anhängen
  en: Adding un-, -ing, -ed, -er and -est
summary: >
  The root word stays the same and we add a part to it. Lesson 1 adds
  -ing and -ed to doing words (helping, jumped), and shows that -ed is
  spelt ed even when it sounds like t (jumped). Lesson 2 adds -er and
  -est to describing words (quicker, quickest) and un- at the start
  (unkind, unlock), and ends with the skill check.
metadata:
  year: year-1
  topic: { de: "Rechtschreibung", en: "Spelling" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.spelling.plural-s-es]
  also_practises: []
  vocabulary: { en: [root word, ending, prefix, un, ing, ed, er, est] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: ing-ed, what: { de: "-ing und -ed an ein Verb hängen", en: "adding -ing and -ed to a doing word" } }
    - { id: er-est, what: { de: "-er und -est an ein Adjektiv hängen", en: "adding -er and -est to a describing word" } }
    - { id: un, what: { de: "un- vorne anfügen, um das Gegenteil zu bilden", en: "adding un- at the start to make the opposite" } }
    - { id: root, what: { de: das Stammwort und den angefügten Teil erkennen, en: seeing the root word and the part added to it } }
  misconceptions:
    - id: ed-as-heard
      what: Spells the -ed ending as it sounds (jumpt, helpt, playd)
      addressed: Learn screen 3 in lesson 1; l1-f2 feedback on jumpt; l1-s2, l1-n2 and l2-c2
    - id: root-changed
      what: Changes a root word that should stay the same (helpping, quickist, unkine)
      addressed: Learn screen 1 in each lesson shows the root word whole; l1-f1 feedback on helpping; l2-f2 feedback on quickist
    - id: er-est-mixed
      what: Uses -er where three things are compared, or -est for two
      addressed: Learn screen 2 in lesson 2; l2-f3, l2-s3 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "-ing und -ed", en: "-ing and -ed" }
    goal:
      de: "Häng eine Endung an ein Tuwort, ohne das Wort zu verändern, so wie help zu helping und helped."
      en: "Add an ending to a doing word without changing it, like help to helping and helped."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "One fox, two ..."
            say: "One fox, two of them. Which spelling is right?"
            show: { object: fox, count: 2, layout: row }
            options: ["foxes", "foxs", "foxis"]
            answer: "foxes"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "He jump_ over the log."
            say: "He jumps over the log. Which ending?"
            frame: "He jump_ over the log."
            options: ["s", "es"]
            answer: ["s"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "help → helping"
            say: "Help is the root word. To say it is happening now, add i n g: helping. The root word does not change. You can still see help inside helping."
          - text: "help → helped"
            say: "To say it happened before, add e d: helped. Yesterday I helped my mum."
          - text: "jumped   played   painted"
            say: "Listen. Jumped ends with a t sound. Played ends with a d sound. Painted has an extra beat. But they are all spelt the same way: e d."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "help + ing"
                say: "Add i n g to help. Which spelling is right?"
                options: ["helping", "helpping", "helpin"]
                answer: "helping"
                option_audio: false
                feedback:
                  "helpping": "Help stays the same. Just add ing: helping."
                hints:
                  - "Write the root word help first."
                  - "Then add the three letters i, n, g."
                  - "Helping."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "jump + ed"
                say: "Add e d to jump. Which spelling is right?"
                options: ["jumped", "jumpt", "jumpd"]
                answer: "jumped"
                option_audio: false
                feedback:
                  "jumpt": "It sounds like t, but the ending is always spelt e d: jumped."
                hints:
                  - "The ending for something that already happened."
                  - "It can sound like t, but it is always spelt the same."
                  - "Jumped."
              - id: l1-f3
                type: fill_in_blank
                text: "Yesterday we play_ in the park."
                say: "Yesterday we played in the park. Which ending?"
                frame: "Yesterday we play_ in the park."
                options: ["ed", "ing", "s"]
                answer: ["ed"]
                option_audio: false
                hints:
                  - "Yesterday tells you it already happened."
                  - "Things that already happened often end in e d."
                  - "ed."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the root word."
                say: "Tap the root word in kicking."
                show: { drawn: letter-card, text: "kick ing" }
                spans: ["kick"]
                hints:
                  - "The root word is the word we start with."
                  - "Take away the ending ing."
                  - "Kick."
              - id: l1-f5
                type: true_false
                text: "Is it true? \"fishing\" is fish + ing."
                answer: true
                hints:
                  - "Cover the ending."
                  - "Fish is left, and it has not changed."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Look! The dog is jump_."
                say: "Look! The dog is jumping. Which ending?"
                show: { object: dog }
                frame: "Look! The dog is jump_."
                options: ["ing", "ed", "s"]
                answer: ["ing"]
                option_audio: false
                hints: ["It is happening now."]
              - id: l1-s2
                type: audio_choice
                text: "Which spelling is right?"
                audio: { en: "Kicked." }
                options: ["kicked", "kickt", "kikd"]
                answer: "kicked"
                hints: ["The ending is spelt the same, whatever it sounds like."]
              - id: l1-s3
                type: sorting
                text: "Now or before?"
                say: "Is it happening now, or did it happen before? Sort the words."
                option_audio: false
                bins:
                  - { id: now, show: { text: "now: ing" }, say: "Now." }
                  - { id: before, show: { text: "before: ed" }, say: "Before." }
                options:
                  - { text: "helping", bin: now }
                  - { text: "looked", bin: before }
                  - { text: "painting", bin: now }
                  - { text: "rested", bin: before }
                hints: ["Words ending in ing are happening now."]
              - id: l1-s4
                type: true_false
                text: "Is it true? \"looked\" is spelt look + t."
                answer: false
                hints: ["It sounds like t, but how is the ending spelt?"]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the root word."
                say: "Tap the root word in painted."
                show: { drawn: letter-card, text: "paint ed" }
                spans: ["paint"]
                hints: ["Take away the ending."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "sing + ing"
                say: "Add i n g to sing. Which spelling is right?"
                options: ["singing", "singging", "singin"]
                answer: "singing"
                option_audio: false
              - id: l1-n2
                type: audio_choice
                text: "Which spelling is right?"
                audio: { en: "Helped." }
                options: ["helped", "helpt", "helpd"]
                answer: "helped"
              - id: l1-n3
                type: fill_in_blank
                text: "Last night it rain_ a lot."
                say: "Last night it rained a lot. Which ending?"
                show: { object: rain }
                frame: "Last night it rain_ a lot."
                options: ["ing", "ed", "s"]
                answer: ["ed"]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Is it true? \"pushing\" is push + ing."
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "We are paint_ a picture."
                say: "We are painting a picture. Which ending?"
                frame: "We are paint_ a picture."
                options: ["ed", "ing", "s"]
                answer: ["ing"]
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "look + ing"
            say: "Add i n g to look. Which spelling is right?"
            options: ["looking", "lookking", "lookin"]
            answer: "looking"
            option_audio: false
          - id: l1-c2
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Jumped." }
            options: ["jumped", "jumpt", "jumpd"]
            answer: "jumped"
          - id: l1-c3
            type: fill_in_blank
            text: "Yesterday I kick_ the ball."
            say: "Yesterday I kicked the ball. Which ending?"
            frame: "Yesterday I kick_ the ball."
            options: ["ing", "ed", "s"]
            answer: ["ed"]
            option_audio: false
          - id: l1-c4
            type: text_input
            keyboard: letters
            text: "jump + ing = ?\nWrite the word."
            say: "Add i n g to jump. Write the word."
            answer: "jumping"
          - id: l1-c5
            type: highlight_in_text
            text: "Tap every word that ends in -ing."
            say: "Read the words yourself. Tap every word that ends in i n g."
            show: { drawn: letter-card, text: "singing kicked looking helped" }
            spans: ["singing", "looking"]
          - id: l1-c6
            type: fill_in_blank
            text: "Now I am help_ Mum. Yesterday I help_ Dad."
            say: "Now I am helping Mum. Yesterday I helped Dad. Which endings go in the gaps?"
            frame: "Now I am help_ Mum. Yesterday I help_ Dad."
            options: ["ing", "ed", "s"]
            answer: ["ing", "ed"]
            option_audio: false

  - n: 2
    title: { de: "-er, -est und un-", en: "-er, -est and un-" }
    goal:
      de: "Schreib Wörter wie quicker und quickest und einen Anfang, der die Bedeutung umdreht, so wie unkind."
      en: "Spell words like quicker and quickest, and add a start that flips the meaning, like unkind."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "fish + ing"
            say: "Add i n g to fish. Which spelling is right?"
            options: ["fishing", "fishhing", "fishin"]
            answer: "fishing"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Played." }
            options: ["played", "playd", "plaid"]
            answer: "played"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "quick → quicker → quickest"
            say: "Quick is the root word. Add e r: quicker. Add e s t: quickest. Quick does not change."
          - text: "tall   taller   tallest"
            say: "Use e r to compare two things: Sam is taller than Ali. Use e s t when it is the most of all: Mia is the tallest in the class."
          - text: "kind → unkind"
            say: "U n at the start makes the word mean the opposite. Kind, unkind. Lock, unlock. Happy, unhappy."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "_kind"
                say: "Kind means nice to others. Which part makes it mean not kind?"
                frame: "_kind"
                options: ["un", "ing", "er"]
                answer: ["un"]
                option_audio: false
                hints:
                  - "We want the opposite of kind."
                  - "This part goes at the start of the word."
                  - "un: unkind."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "quick + est"
                say: "Add e s t to quick. Which spelling is right?"
                options: ["quickest", "quickist", "quikest"]
                answer: "quickest"
                option_audio: false
                feedback:
                  "quickist": "The ending is always e s t, and quick stays the same: quickest."
                hints:
                  - "Write quick first, then the ending."
                  - "The ending is e, s, t."
                  - "Quickest."
              - id: l2-f3
                type: fill_in_blank
                text: "A dog is fast. A car is fast_ than a dog."
                say: "A car is faster than a dog. Which ending?"
                frame: "A car is fast_ than a dog."
                options: ["er", "est"]
                answer: ["er"]
                option_audio: false
                hints:
                  - "How many things are we comparing?"
                  - "Two things: a car and a dog. Than goes with e r."
                  - "er."
              - id: l2-f4
                type: highlight_in_text
                text: "Tap the root word."
                say: "Tap the root word in unlocked."
                show: { drawn: letter-card, text: "un lock ed" }
                spans: ["lock"]
                hints:
                  - "There is a part at the start and a part at the end."
                  - "Take away un and ed."
                  - "Lock."
              - id: l2-f5
                type: true_false
                text: "Is it true? \"unhappy\" means very happy."
                answer: false
                hints:
                  - "What does un do to a word?"
                  - "Un makes the opposite."
                  - "No. Unhappy means not happy."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "small + er"
                say: "Add e r to small. Which spelling is right?"
                options: ["smaller", "smallr", "smallor"]
                answer: "smaller"
                option_audio: false
                hints: ["Small stays the same. The ending is e r."]
              - id: l2-s2
                type: fill_in_blank
                text: "Can you _pack your bag?"
                say: "Can you take everything out of your bag? Which part goes at the start?"
                show: { object: schoolbag }
                frame: "Can you _pack your bag?"
                options: ["un", "ed", "est"]
                answer: ["un"]
                option_audio: false
                hints: ["The opposite of pack."]
              - id: l2-s3
                type: fill_in_blank
                text: "The giraffe is the tall_ animal in the zoo."
                say: "The giraffe is the tallest animal in the zoo. Which ending?"
                show: { object: giraffe }
                frame: "The giraffe is the tall_ animal in the zoo."
                options: ["er", "est"]
                answer: ["est"]
                option_audio: false
                hints: ["It is taller than all the other animals."]
              - id: l2-s4
                type: audio_choice
                text: "Which spelling is right?"
                audio: { en: "Unlock." }
                options: ["unlock", "onlock", "unlok"]
                answer: "unlock"
                hints: ["Un at the start, then the root word lock."]
              - id: l2-s5
                type: true_false
                text: "Is it true? \"coldest\" is cold + est."
                answer: true
                hints: ["Cover the ending. What is left?"]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                keyboard: letters
                text: "long + est = ?\nWrite the word."
                say: "Add e s t to long. Write the word."
                answer: "longest"
              - id: l2-n2
                type: fill_in_blank
                text: "It is not fair! It is _fair!"
                say: "Which part goes at the start?"
                frame: "It is _fair!"
                options: ["un", "er", "ing"]
                answer: ["un"]
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "My jumper is warm. Your coat is warm_ than my jumper."
                say: "Your coat is warmer than my jumper. Which ending?"
                frame: "Your coat is warm_ than my jumper."
                options: ["er", "est"]
                answer: ["er"]
                option_audio: false
              - id: l2-n4
                type: highlight_in_text
                text: "Tap the root word."
                say: "Tap the root word in quickest."
                show: { drawn: letter-card, text: "quick est" }
                spans: ["quick"]
              - id: l2-n5
                type: true_false
                text: "Is it true? \"undo\" means do it again."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ing-ed
            type: text_input
            keyboard: letters
            text: "rest + ing = ?\nWrite the word."
            say: "Add i n g to rest. Write the word."
            answer: "resting"
          - id: l2-c2
            part: ing-ed
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Picked." }
            options: ["picked", "pickt", "pikd"]
            answer: "picked"
          - id: l2-c3
            part: un
            type: fill_in_blank
            text: "Please do not be _kind to the cat."
            say: "Which part goes at the start?"
            show: { object: cat }
            frame: "Please do not be _kind to the cat."
            options: ["un", "er", "ed"]
            answer: ["un"]
            option_audio: false
          - id: l2-c4
            part: er-est
            type: fill_in_blank
            text: "Of all my friends, Raj is the old_."
            say: "Of all my friends, Raj is the oldest. Which ending?"
            frame: "Of all my friends, Raj is the old_."
            options: ["er", "est"]
            answer: ["est"]
            option_audio: false
          - id: l2-c5
            part: er-est
            type: multiple_choice
            text: "high + er"
            say: "Add e r to high. Which spelling is right?"
            options: ["higher", "hier", "highr"]
            answer: "higher"
            option_audio: false
          - id: l2-c6
            part: ing-ed
            type: text_input
            keyboard: letters
            text: "fix + ed = ?\nYesterday I ____ my bike."
            say: "Add e d to fix. Yesterday I fixed my bike. Write the word."
            show: { object: bike }
            answer: "fixed"
          - id: l2-c7
            part: er-est
            type: multiple_choice
            text: "Ben is 6. Kim is 7.\nKim is ___ than Ben."
            say: "Ben is six. Kim is seven. Which word fits the gap?"
            options: ["older", "oldest", "olding"]
            answer: "older"
            option_audio: false
          - id: l2-c8
            part: un
            type: multiple_choice
            text: "What does unwell mean?"
            options: ["not well", "very well", "well again"]
            answer: "not well"
          - id: l2-c9
            part: root
            type: multiple_choice
            text: "What is the root word of unpacked?"
            options: ["pack", "unpack", "packed"]
            answer: "pack"
            option_audio: false
          - id: l2-c10
            part: ing-ed
            type: multiple_choice
            text: "Which word tells you it already happened?"
            options: ["walked", "walking", "walks"]
            answer: "walked"
            option_audio: false
          - id: l2-c11
            part: er-est
            type: highlight_in_text
            text: "Tap the word you use to compare two things."
            say: "Read the words yourself. Tap the word you use to compare two things."
            show: { drawn: letter-card, text: "soft softer softest" }
            spans: ["softer"]
          - id: l2-c12
            part: un
            type: matching
            text: "Match each meaning to its word."
            say: "Tap a meaning, then tap the word that means the same."
            pairs:
              - left: { text: "not safe" }
                right: { text: "unsafe" }
              - left: { text: "not tidy" }
                right: { text: "untidy" }
              - left: { text: "not lucky" }
                right: { text: "unlucky" }
          - id: l2-c13
            part: root
            type: multiple_choice
            text: "Which word has the root word help in it?"
            options: ["helped", "hello", "held"]
            answer: "helped"
            option_audio: false
          - id: l2-c14
            part: ing-ed
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Rested." }
            options: ["rested", "restid", "restd"]
            answer: "rested"
          - id: l2-c15
            part: er-est
            type: fill_in_blank
            text: "My bag is light.\n\nWhich endings go in the gaps?"
            say: "My bag is light. Your bag is lighter than mine. Tom's bag is the lightest of all. Which endings go in the gaps?"
            frame: "Your bag is light_ than mine. Tom's bag is the light_ of all."
            options: ["er", "est"]
            answer: ["er", "est"]
            option_audio: false
          - id: l2-c16
            part: un
            type: true_false
            text: "Is it true? \"unzip\" means open the zip."
            answer: true
          - id: l2-c17
            part: root
            type: true_false
            text: "Is it true? The root word of kindest is kin."
            say: "Is it true? The root word of kindest is k i n."
            answer: false
          - id: l2-c18
            part: root
            type: sorting
            text: "Which part was added? Put each word in its box."
            say: "Read each word yourself. Which part was added to the root word? Put it in the right box."
            option_audio: false
            bins:
              - { id: ing, show: { text: "-ing" }, say: "i n g" }
              - { id: ed, show: { text: "-ed" }, say: "e d" }
              - { id: er, show: { text: "-er" }, say: "e r" }
            options:
              - { text: "looking", bin: ing }
              - { text: "looked", bin: ed }
              - { text: "louder", bin: er }
              - { text: "playing", bin: ing }
          - id: l2-c19
            part: root
            type: fill_in_blank
            text: "Build the word unlocked."
            say: "Build the word unlocked. Which parts go in the gaps?"
            frame: "_ + lock + _"
            options: ["un", "ed", "ing", "er"]
            answer: ["un", "ed"]
            option_audio: false
          - id: l2-c20
            part: un
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Unwrap." }
            options: ["unwrap", "onwrap", "unrap"]
            answer: "unwrap"
