# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.plural-s-es
skill: lit-en.spelling.plural-s-es
curriculum: en-GB
language: en
title:
  de: Mehrzahl mit -s und -es
  en: Adding -s and -es
summary: >
  Most words take -s for more than one (dogs, cats). Words ending in s,
  x, sh, ch or z take -es, because you hear an extra beat (foxes, wishes).
  Lesson 1 makes plurals of nouns; lesson 2 adds the same endings to
  doing words (he runs, she wishes) and ends with the skill check.
metadata:
  year: year-1
  topic: { de: "Rechtschreibung", en: "Spelling" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.spelling.segment-spell]
  also_practises: []
  vocabulary: { en: [singular, plural, ending, root word, beat, more than one] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: plural-s, what: { de: "-s für mehr als eins anhängen (dogs, cups)", en: "adding -s for more than one (dogs, cups)" } }
    - { id: plural-es, what: { de: "-es nach s, x, sh, ch und z anhängen (foxes, wishes)", en: "adding -es after s, x, sh, ch and z (foxes, wishes)" } }
    - { id: verb-s-es, what: { de: "-s oder -es an ein Verb nach he, she oder it anhängen (he runs, she wishes)", en: "adding -s or -es to a doing word after he, she or it (he runs, she wishes)" } }
  misconceptions:
    - id: es-everywhere
      what: Adds -es to any word (dogs as doges, cats as cates)
      addressed: l1-f2 feedback on doges; l1-s3, l1-n3 and l2-c2 ask for -s after an ordinary ending
    - id: s-after-hiss
      what: Adds only -s after s, x, sh or ch (foxs, wishs)
      addressed: Learn screen 2 claps fox, fox-es; l1-f1 feedback on foxs; l2-f2 feedback on wishs
    - id: verb-ending-missed
      what: Leaves the ending off a doing word after he, she or it (he run)
      addressed: Learn in lesson 2; l2-f1, l2-s1 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ein Hund, zwei Hunde", en: "One dog, two dogs" }
    goal:
      de: "Schreib Wörter für mehr als eins, so wie dogs und foxes, und hör auf die zusätzliche Silbe."
      en: "Spell words for more than one, like dogs and foxes, and listen for the extra beat."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Say the sounds in dog. Which letter is missing?"
            show: { object: dog }
            frame: "d_g"
            options: ["o", "a", "u"]
            answer: ["o"]
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Cup." }
            options: ["cup", "cap", "kup"]
            answer: "cup"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "dog → dogs\ncat → cats"
            say: "One dog is singular. Two dogs is plural. Plural means more than one. Most words just add s: dogs, cats, cups."
            show: { object: dog, count: 2, layout: row }
          - text: "fox → foxes\nbus → buses"
            say: "Listen: fox, fox-es. Clap it. Foxes has an extra beat. When a word ends in s, x, sh, ch or z, we add e s: foxes, buses, wishes, witches."
            show: { object: fox, count: 2, layout: row }
          - text: "s, x, sh, ch, z → add es"
            say: "Say the plural and listen. Hear an extra beat? Write e s. No extra beat? Just write s."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "One fox, two ...\nWhich spelling is right?"
                say: "One fox, two of them. Which spelling is right?"
                show: { object: fox, count: 2, layout: row }
                options: ["foxes", "foxs", "foxses"]
                answer: "foxes"
                option_audio: false
                feedback:
                  "foxs": "Say it: fox-es. There is an extra beat, so fox takes e s."
                hints:
                  - "Fox ends in x."
                  - "Clap it: fox-es. Two beats."
                  - "Foxes."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "One dog, two ...\nWhich spelling is right?"
                say: "One dog, two of them. Which spelling is right?"
                show: { object: dog, count: 2, layout: row }
                options: ["dogs", "doges", "dog"]
                answer: "dogs"
                option_audio: false
                feedback:
                  "doges": "Say it: dogs. Only one beat, so just add s."
                hints:
                  - "Does dog end in s, x, sh, ch or z?"
                  - "Dogs has one beat, no extra beat."
                  - "Dogs."
              - id: l1-f3
                type: fill_in_blank
                text: "One bus, two of them. Which ending?"
                say: "One bus, two buses. Which ending?"
                show: { object: bus, count: 2, layout: row }
                frame: "bus_"
                options: ["es", "s"]
                answer: ["es"]
                option_audio: false
                hints:
                  - "Bus ends in s."
                  - "Bus-es: you hear an extra beat."
                  - "es."
              - id: l1-f4
                type: sorting
                text: "Add s or es?"
                say: "Sort the words. Do they take s, or e s?"
                option_audio: false
                bins:
                  - { id: s, show: { text: "+ s" }, say: "Add s." }
                  - { id: es, show: { text: "+ es" }, say: "Add e s." }
                options:
                  - { text: "cat", bin: s }
                  - { text: "box", bin: es }
                  - { text: "bell", bin: s }
                  - { text: "dish", bin: es }
                hints:
                  - "Look at the last letters of each word."
                  - "Box ends in x and dish ends in sh."
                  - "Cat and bell take s. Box and dish take es."
              - id: l1-f5
                type: true_false
                text: "Is it true? The plural of witch is witches."
                show: { object: witch, count: 2, layout: row }
                answer: true
                hints:
                  - "Witch ends in ch."
                  - "Witch-es: two beats."
                  - "Yes, witches."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "One box, two ...\nWhich spelling is right?"
                say: "One box, two of them. Which spelling is right?"
                options: ["boxs", "boxes", "boxis"]
                answer: "boxes"
                option_audio: false
                hints: ["Clap box-es."]
              - id: l1-s2
                type: fill_in_blank
                text: "One sock, two of them. Which ending?"
                say: "One sock, two socks. Which ending?"
                show: { object: sock, count: 2, layout: row }
                frame: "sock_"
                options: ["es", "s"]
                answer: ["s"]
                option_audio: false
                hints: ["Socks has one beat."]
              - id: l1-s3
                type: true_false
                text: "Is it true? The plural of hat is hates."
                answer: false
                hints: ["Hat does not end in s, x, sh, ch or z."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap every word that means more than one."
                show: { drawn: letter-card, text: "cups bus kites dish brushes" }
                spans: ["cups", "kites", "brushes"]
                hints: ["Bus and dish end in s and sh, but they mean just one."]
              - id: l1-s5
                type: audio_choice
                text: "Which spelling is right?"
                audio: { en: "Dishes." }
                options: ["dishes", "dishs", "dish"]
                answer: "dishes"
                hints: ["Count the beats: dish-es."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "One duck, two ...\nWhich spelling is right?"
                say: "One duck, two of them. Which spelling is right?"
                show: { object: duck, count: 2, layout: row }
                options: ["duckes", "ducks", "duck"]
                answer: "ducks"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "One glass, two of them. Which ending?"
                say: "One glass, two glasses. Which ending?"
                frame: "glass_"
                options: ["es", "s"]
                answer: ["es"]
                option_audio: false
              - id: l1-n3
                type: sorting
                text: "Add s or es?"
                say: "Sort the words. Do they take s, or e s?"
                option_audio: false
                bins:
                  - { id: s, show: { text: "+ s" }, say: "Add s." }
                  - { id: es, show: { text: "+ es" }, say: "Add e s." }
                options:
                  - { text: "bike", bin: s }
                  - { text: "fox", bin: es }
                  - { text: "star", bin: s }
                  - { text: "bench", bin: es }
              - id: l1-n4
                type: audio_choice
                text: "Which spelling is right?"
                audio: { en: "Bells." }
                options: ["bells", "bellz", "bell"]
                answer: "bells"
              - id: l1-n5
                type: true_false
                text: "Is it true? The plural of brush is brushes."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "One cat, two ...\nWhich spelling is right?"
            say: "One cat, two of them. Which spelling is right?"
            show: { object: cat, count: 2, layout: row }
            options: ["cats", "cates", "catz"]
            answer: "cats"
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "One fox, two of them. Which ending?"
            say: "One fox, two foxes. Which ending?"
            frame: "fox_"
            options: ["es", "s"]
            answer: ["es"]
            option_audio: false
          - id: l1-c3
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Buses." }
            options: ["buses", "buss", "bus"]
            answer: "buses"
          - id: l1-c4
            type: sorting
            text: "Add s or es?"
            say: "Sort the words. Do they take s, or e s?"
            option_audio: false
            bins:
              - { id: s, show: { text: "+ s" }, say: "Add s." }
              - { id: es, show: { text: "+ es" }, say: "Add e s." }
            options:
              - { text: "nut", bin: s }
              - { text: "class", bin: es }
              - { text: "sun", bin: s }
              - { text: "flash", bin: es }
          - id: l1-c5
            type: multiple_choice
            text: "One shell, two ...\nWhich spelling is right?"
            say: "One shell, two of them. Which spelling is right?"
            show: { object: shell, count: 2, layout: row }
            options: ["shells", "shelles", "shellz"]
            answer: "shells"
            option_audio: false
          - id: l1-c6
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Bushes." }
            options: ["bushes", "bushs", "bush"]
            answer: "bushes"

  - n: 2
    title: { de: "Er rennt, sie wünscht", en: "He runs, she wishes" }
    goal:
      de: "Häng dieselben Endungen an Tuwörter, so wie he runs und she wishes."
      en: "Add the same endings to doing words, like he runs and she wishes."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "One bee, two ...\nWhich spelling is right?"
            say: "One bee, two of them. Which spelling is right?"
            show: { object: bee, count: 2, layout: row }
            options: ["bees", "beees", "beeses"]
            answer: "bees"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "One dish, two of them. Which ending?"
            say: "One dish, two dishes. Which ending?"
            frame: "dish_"
            options: ["es", "s"]
            answer: ["es"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I run. → He runs."
            say: "Doing words take the same endings. I run, but he runs. After he, she or it, add s."
          - text: "I wish. → She wishes."
            say: "Listen: wish, wish-es. An extra beat, so we add e s, just like dishes. I fix it, he fixes it."
          - text: "he, she, it: + s or + es"
            say: "One beat more? Write e s. No extra beat? Write s. Read it back: does it sound right?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Which ending?"
                say: "The dog runs in the park. Which ending?"
                frame: "The dog run_ in the park."
                options: ["s", "es", "ing"]
                answer: ["s"]
                option_audio: false
                hints:
                  - "One dog is doing it, like he or she."
                  - "Runs has one beat."
                  - "s."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Mia ... on a star.\nWhich spelling is right?"
                say: "Mia wishes on a star. Which spelling is right?"
                show: { object: star }
                options: ["wishes", "wishs", "wishis"]
                answer: "wishes"
                option_audio: false
                feedback:
                  "wishs": "Say it: wish-es. There is an extra beat, so add e s."
                hints:
                  - "Wish ends in sh."
                  - "Wish-es: two beats."
                  - "Wishes."
              - id: l2-f3
                type: fill_in_blank
                text: "Which ending?"
                say: "Dad fixes the bike. Which ending?"
                show: { object: bike }
                frame: "Dad fix_ the bike."
                options: ["s", "es"]
                answer: ["es"]
                option_audio: false
                hints:
                  - "Fix ends in x."
                  - "Fix-es: you hear an extra beat."
                  - "es."
              - id: l2-f4
                type: true_false
                text: "Is it true? \"She sings.\" is spelt right."
                answer: true
                hints:
                  - "Sing does not end in s, x, sh, ch or z."
                  - "Sings has no extra beat, so it just takes s."
                  - "Yes, it is right."
              - id: l2-f5
                type: highlight_in_text
                text: "Tap the word with the wrong ending."
                show: { drawn: letter-card, text: "Sam catchs the ball." }
                spans: ["catchs"]
                hints:
                  - "Read each word aloud."
                  - "Catch ends in ch, so it needs e s."
                  - "Catchs. It should be catches."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The cat ... milk.\nWhich spelling is right?"
                say: "The cat drinks milk. Which spelling is right?"
                show: { object: cat }
                options: ["drinks", "drink", "drinkes"]
                answer: "drinks"
                option_audio: false
                hints: ["After the cat, add an ending. No extra beat."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which ending?"
                say: "The bee buzzes in the garden. Which ending?"
                show: { object: bee }
                frame: "The bee buzz_ in the garden."
                options: ["s", "es"]
                answer: ["es"]
                option_audio: false
                hints: ["Buzz ends in z: buzz-es."]
              - id: l2-s3
                type: sorting
                text: "Add s or es?"
                say: "He, she or it does it. Sort the doing words. Do they take s, or e s?"
                option_audio: false
                bins:
                  - { id: s, show: { text: "+ s" }, say: "Add s." }
                  - { id: es, show: { text: "+ es" }, say: "Add e s." }
                options:
                  - { text: "jump", bin: s }
                  - { text: "mix", bin: es }
                  - { text: "look", bin: s }
                  - { text: "push", bin: es }
                hints: ["Mix ends in x and push ends in sh."]
              - id: l2-s4
                type: true_false
                text: "Is it true? \"He kick the ball.\" is spelt right."
                answer: false
                hints: ["After he, the doing word needs an ending."]
              - id: l2-s5
                type: audio_choice
                text: "Which spelling is right?"
                audio: { en: "Mum washes the cups." }
                options: ["Mum washes the cups.", "Mum washs the cups.", "Mum wash the cups."]
                answer: "Mum washes the cups."
                hints: ["Wash ends in sh."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which ending?"
                say: "The frog jumps into the pond. Which ending?"
                show: { object: frog }
                frame: "The frog jump_ into the pond."
                options: ["s", "es", "ed"]
                answer: ["s"]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Ben ... the door.\nWhich spelling is right?"
                say: "Ben pushes the door. Which spelling is right?"
                show: { object: door }
                options: ["pushs", "pushes", "push"]
                answer: "pushes"
                option_audio: false
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the word with the wrong ending."
                show: { drawn: letter-card, text: "Gran mixs the cake." }
                spans: ["mixs"]
              - id: l2-n4
                type: fill_in_blank
                text: "Which ending?"
                say: "Two foxes run into the woods. Which ending?"
                frame: "Two fox_ run into the woods."
                options: ["s", "es"]
                answer: ["es"]
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? \"The baby sleeps.\" is spelt right."
                show: { object: baby }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: plural-s
            type: multiple_choice
            text: "One kite, two ...\nWhich spelling is right?"
            say: "One kite, two of them. Which spelling is right?"
            show: { object: kite, count: 2, layout: row }
            options: ["kites", "kitees", "kitess"]
            answer: "kites"
            option_audio: false
          - id: l2-c2
            part: plural-s
            type: fill_in_blank
            text: "One pen, two of them. Which ending?"
            say: "One pen, two pens. Which ending?"
            frame: "pen_"
            options: ["es", "s"]
            answer: ["s"]
            option_audio: false
          - id: l2-c3
            part: plural-es
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Lunches." }
            options: ["lunches", "lunchs", "lunch"]
            answer: "lunches"
          - id: l2-c4
            part: verb-s-es
            type: fill_in_blank
            text: "Which ending?"
            say: "The boy kicks the ball. Which ending?"
            show: { object: ball }
            frame: "The boy kick_ the ball."
            options: ["s", "es", "ing"]
            answer: ["s"]
            option_audio: false
          - id: l2-c5
            part: verb-s-es
            type: multiple_choice
            text: "Kim ... the cat.\nWhich spelling is right?"
            say: "Kim brushes the cat. Which spelling is right?"
            options: ["brushs", "brushes", "brushis"]
            answer: "brushes"
            option_audio: false
          - id: l2-c6
            part: plural-s
            type: text_input
            text: "One frog, two ...\nWrite the word."
            say: "One frog, two frogs. Write the word frogs."
            show: { object: frog, count: 2, layout: row }
            keyboard: letters
            answer: "frogs"
          - id: l2-c7
            part: plural-s
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Rings." }
            options: ["rings", "ringes", "ring"]
            answer: "rings"
          - id: l2-c8
            part: plural-s
            type: true_false
            text: "Is it true? \"I have two pigs.\" is spelt right."
            answer: true
          - id: l2-c9
            part: plural-s
            type: highlight_in_text
            text: "Tap the word with the wrong ending."
            say: "Read the sentence. Tap the word with the wrong ending."
            show: { drawn: letter-card, text: "Ella has three hens and two drumes." }
            spans: ["drumes"]
          - id: l2-c10
            part: plural-s
            type: fill_in_blank
            text: "Which ending?"
            say: "Two ships sail on the sea. Which ending?"
            frame: "Two ship_ sail on the sea."
            options: ["s", "es"]
            answer: ["s"]
            option_audio: false
          - id: l2-c11
            part: plural-es
            type: multiple_choice
            text: "One dress, two ...\nWhich spelling is right?"
            say: "One dress, two of them. Which spelling is right?"
            show: { object: dress, count: 2, layout: row }
            options: ["dresses", "dresss", "dressis"]
            answer: "dresses"
            option_audio: false
          - id: l2-c12
            part: plural-es
            type: highlight_in_text
            text: "Tap every word that takes es for more than one."
            say: "Read the words. Tap every word that takes e s when there is more than one."
            show: { drawn: letter-card, text: "torch ring kiss drum" }
            spans: ["torch", "kiss"]
          - id: l2-c13
            part: plural-es
            type: text_input
            text: "One church, two ...\nWrite the word."
            say: "One church, two churches. Write the word churches."
            show: { object: church, count: 2, layout: row }
            keyboard: letters
            answer: "churches"
          - id: l2-c14
            part: plural-es
            type: audio_choice
            text: "Which spelling is right?"
            audio: { en: "Kisses." }
            options: ["kisses", "kisss", "kises"]
            answer: "kisses"
          - id: l2-c15
            part: plural-es
            type: true_false
            text: "Is it true? \"We sat on two benches.\" is spelt right."
            answer: true
          - id: l2-c16
            part: plural-es
            type: highlight_in_text
            text: "Tap the word with the wrong ending."
            say: "Read the sentence. Tap the word with the wrong ending."
            show: { drawn: letter-card, text: "Gran put the eggs in two boxs." }
            spans: ["boxs"]
          - id: l2-c17
            part: verb-s-es
            type: fill_in_blank
            text: "Which ending?"
            say: "The cat hisses at the dog. Which ending?"
            frame: "The cat hiss_ at the dog."
            options: ["s", "es"]
            answer: ["es"]
            option_audio: false
          - id: l2-c18
            part: verb-s-es
            type: true_false
            text: "Is it true? \"Pip runes to the shop.\" is spelt right."
            answer: false
          - id: l2-c19
            part: verb-s-es
            type: multiple_choice
            text: "Sam ... to the bus.\nWhich spelling is right?"
            say: "Sam rushes to the bus. Which spelling is right?"
            options: ["rushs", "rush", "rushes"]
            answer: "rushes"
            option_audio: false
          - id: l2-c20
            part: verb-s-es
            type: text_input
            text: "The dog _ in the garden.\nWrite the missing word."
            say: "The dog digs in the garden. Write the missing word."
            show: { object: dog }
            keyboard: letters
            answer: "digs"
