# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.title-events
skill: lit-en.comprehension.title-events
curriculum: en-GB
language: en
title:
  de: Titel und wichtigste Ereignisse
  en: Titles and main events
summary: >
  A title tells us what a story will be about, and the main events are
  the parts the story cannot do without. Lesson 1 looks at titles: what a
  title tells you before you read, and which title fits a story best.
  Lesson 2 finds the main events, tells them from small details, puts them
  in order, and ends with the skill check. Stories are short and read
  aloud.
metadata:
  year: year-1
  topic: { de: "Geschichten verstehen", en: "Understanding stories" }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.comprehension.retell]
  also_practises: []
  vocabulary: { en: [title, story, main event, detail, beginning, middle, end, important] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: title-predict, what: { de: "aus dem Titel sagen, wovon eine Geschichte handelt", en: saying what a story will be about from its title } }
    - { id: title-fit, what: { de: "den Titel wählen, der am besten zu einer Geschichte passt", en: choosing the title that fits a story best } }
    - { id: main-events, what: { de: wichtigste Ereignisse von Einzelheiten unterscheiden, en: telling the main events from small details } }
    - { id: event-order, what: { de: "die wichtigsten Ereignisse ordnen (Anfang, Mitte, Schluss)", en: "putting the main events in order (beginning, middle, end)" } }
  misconceptions:
    - id: title-from-detail
      what: Picks a title from a small detail in the story, not from what it is mostly about
      addressed: Learn screen 2 in lesson 1; l1-f2 feedback on the detail title; l1-s2, l1-n2 and l2-c1
    - id: detail-as-event
      what: Thinks every detail is a main event (the cat was ginger)
      addressed: Learn screens 1 and 2 in lesson 2; l2-f1 feedback; l2-f3, l2-s3 and l2-c3 sort events from details
    - id: events-unordered
      what: Remembers the main events but not the order they came in
      addressed: Learn screen 3 in lesson 2; l2-f4, l2-n4 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was der Titel verrät", en: "What a title tells us" }
    goal:
      de: "Rate mit dem Titel, worum es in einer Geschichte geht, und such den Titel aus, der am besten passt."
      en: "Use a title to guess what a story is about, and pick the title that fits best."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Mo planted a seed. He watered it every day. A tall sunflower grew.\n\nRetell the story in order."
            say: "Listen. Mo planted a seed. He watered it every day. A tall sunflower grew. Put the story in order."
            options: ["A tall sunflower grew.", "Mo planted a seed.", "He watered it every day."]
            slot_count: 3
            answer: ["Mo planted a seed.", "He watered it every day.", "A tall sunflower grew."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? To retell a story, you tell what happens in your own words."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The Lost Teddy"
            say: "Before we read, look at the title: The Lost Teddy. What do you think the story will be about? Have a guess."
            show: { object: teddy }
          - text: "Ella took her teddy to the park. When she got home, Teddy was gone! She and Dad went back to look. Teddy was under the bench."
            say: "Here is the story. It is about a teddy that is lost, just as the title told us. The title fits, because the whole story is about the lost teddy. A title like The Park would not fit so well, because the park is only one small part."
          - text: "A good title tells you what the story is mostly about."
            say: "A title is chosen with care. It helps you guess what will happen, and it helps you choose a book you will enjoy."
          - text: "Did you know? The Tale of Peter Rabbit began as a letter."
            say: "Did you know? The Tale of Peter Rabbit began as a letter. Beatrix Potter wrote the story in a letter to a little boy who was ill in bed, to cheer him up. Later it became a book, and children still read it more than a hundred years later."
            show: { object: rabbit }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The title is \"The Big Snow\". What will the story be about?"
                say: "The title is The Big Snow. What do you think the story will be about?"
                options: ["a day with lots of snow", "a trip to the beach", "a new puppy"]
                answer: "a day with lots of snow"
                feedback:
                  "a trip to the beach": "Sandcastles in the snow? Brrr! Look at the words in the title again."
                hints:
                  - "Look at the words in the title."
                  - "Big snow means a lot of snow."
                  - "A day with lots of snow."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Sam's kite got stuck in a tree. His sister climbed up and got it down. Sam said thank you and gave her a biscuit.\n\nWhich title fits best?"
                say: "Listen. Sam's kite got stuck in a tree. His sister climbed up and got it down. Sam said thank you and gave her a biscuit. Which title fits best?"
                show: { object: kite }
                options: ["The Kite in the Tree", "The Biscuit", "Sam's Shoes"]
                answer: "The Kite in the Tree"
                option_audio: false
                feedback:
                  "The Biscuit": "The biscuit is only a small part at the end. What is the story mostly about?"
                hints:
                  - "What is the story mostly about?"
                  - "Most of it is about the kite stuck in the tree."
                  - "The Kite in the Tree."
              - id: l1-f3
                type: true_false
                text: "Is it true? The title \"Max Goes to the Moon\" tells you who the story is about."
                answer: true
                hints:
                  - "Is there a name in the title?"
                  - "Max."
                  - "Yes, it is about Max."
              - id: l1-f4
                type: image_multiple_choice
                text: "The title is \"Caterpillar's Big Change\". Which picture might be on the cover?"
                say: "The title is Caterpillar's Big Change. What might the caterpillar grow up to be? Which picture might be on the cover?"
                options: [{ object: butterfly }, { object: fish }, { object: car }]
                answer: butterfly
                hints:
                  - "What does a caterpillar turn into?"
                  - "It grows wings."
                  - "A butterfly."
              - id: l1-f5
                type: multiple_choice
                text: "Why does a story have a title?"
                options: ["to tell you what it is about", "to fill up the page", "to show the last page"]
                answer: "to tell you what it is about"
                hints:
                  - "What does the title help you know before you read?"
                  - "It gives you a clue."
                  - "To tell you what it is about."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The title is \"Granny's Birthday\". What will the story be about?"
                say: "The title is Granny's Birthday. What do you think the story will be about?"
                options: ["a party for Granny", "a lost dog", "a rainy day at school"]
                answer: "a party for Granny"
                hints: ["Whose birthday is it?"]
              - id: l1-s2
                type: multiple_choice
                text: "A little fox was cold. He looked for a warm place. At last he found a cosy den and fell asleep.\n\nWhich title fits best?"
                say: "Listen. A little fox was cold. He looked for a warm place. At last he found a cosy den and fell asleep. Which title fits best?"
                show: { object: fox }
                options: ["Fox Finds a Home", "The Cold Nose", "Fox Goes Shopping"]
                answer: "Fox Finds a Home"
                option_audio: false
                hints: ["What does the fox look for the whole time?"]
              - id: l1-s3
                type: true_false
                text: "Is it true? The title \"Ben and the Dragon\" tells you the story is about a cat."
                answer: false
                hints: ["Read the title again."]
              - id: l1-s4
                type: image_multiple_choice
                text: "The title is \"The Ghost Who Was Scared\". Which picture might be on the cover?"
                say: "The title is The Ghost Who Was Scared. Which picture might be on the cover?"
                options: [{ object: ghost }, { object: cake }, { object: bus }]
                answer: ghost
                hints: ["Who is the story about?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which title fits a story about a boy who learns to swim?"
                options: ["Leo Learns to Swim", "Leo's Lunch", "The Big Tree"]
                answer: "Leo Learns to Swim"
                option_audio: false
                hints: ["The title should tell you what it is about."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The title is \"The Pirate Ship\". What will the story be about?"
                say: "The title is The Pirate Ship. What do you think the story will be about?"
                options: ["pirates at sea", "a trip to the farm", "a day at school"]
                answer: "pirates at sea"
              - id: l1-n2
                type: multiple_choice
                text: "Zara wanted a pet. Mum said no. Then one day a kitten came to the door. Mum smiled and said yes.\n\nWhich title fits best?"
                say: "Listen. Zara wanted a pet. Mum said no. Then one day a kitten came to the door. Mum smiled and said yes. Which title fits best?"
                options: ["Zara Gets a Pet", "The Door", "Mum's Smile"]
                answer: "Zara Gets a Pet"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Is it true? A title can help you choose a book you will like."
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "The title is \"Snow Day\". Which picture might be on the cover?"
                say: "The title is Snow Day. Which picture might be on the cover?"
                options: [{ object: snowman }, { object: sun }, { object: swimming-pool }]
                answer: snowman
              - id: l1-n5
                type: multiple_choice
                text: "Which title fits a story about a lost shoe?"
                options: ["Where Is My Shoe?", "My New Hat", "The Hungry Lion"]
                answer: "Where Is My Shoe?"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The title is \"The Day the Bus Broke Down\". What will the story be about?"
            say: "The title is The Day the Bus Broke Down. What will the story be about?"
            options: ["a bus that stopped working", "a new bike", "a party at home"]
            answer: "a bus that stopped working"
          - id: l1-c2
            type: multiple_choice
            text: "Which title fits a story about a girl who finds treasure?"
            options: ["Mia Finds Treasure", "Mia's Coat", "The Rainy Day"]
            answer: "Mia Finds Treasure"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? A title is the last word of a story."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Kemi's tooth was wobbly. She bit into an apple and the tooth came out. She put it in a little box to keep.\n\nWhich title fits best?"
            say: "Listen. Kemi's tooth was wobbly. She bit into an apple and the tooth came out. She put it in a little box to keep. Which title fits best?"
            options: ["Kemi's Wobbly Tooth", "The Apple Tree", "The Little Box"]
            answer: "Kemi's Wobbly Tooth"
            option_audio: false
          - id: l1-c5
            type: image_multiple_choice
            text: "The title is \"The Shark Who Lost His Teeth\". Which picture might be on the cover?"
            say: "The title is The Shark Who Lost His Teeth. Which picture might be on the cover?"
            options: [{ object: shark }, { object: cow }, { object: kite }]
            answer: shark
          - id: l1-c6
            type: true_false
            text: "Is it true? The title \"Rosie's Rainy Day\" tells you about the weather in the story."
            answer: true

  - n: 2
    title: { de: "Die wichtigsten Ereignisse", en: "The main events" }
    goal:
      de: "Finde die wichtigsten Ereignisse, ohne die eine Geschichte nicht geht, so wie Tias Ballon fliegt weg und platzt."
      en: "Find the main events a story cannot do without, like Tia's balloon floats away and pops."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The title is \"Lost in the Woods\". What will the story be about?"
            say: "The title is Lost in the Woods. What will the story be about?"
            options: ["someone who cannot find the way", "a trip to the shop", "a birthday cake"]
            answer: "someone who cannot find the way"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? A good title tells you what the story is mostly about."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Tia's red balloon floated away. It flew over the town. A bird popped it on a tree. Tia got a new balloon, and she held it tight."
            say: "Listen. Tia's red balloon floated away. It flew over the town. A bird popped it on a tree. Tia got a new balloon, and she held it tight. What do you think: which parts does the story really need? Have a guess."
            show: { object: balloon }
          - text: "Main events: the balloon floats away, it pops, Tia gets a new one.\nDetail: it was red."
            say: "The main events are the parts the story needs: the balloon floats away, it pops, Tia gets a new one. That it was red is a detail. The story still works with a blue balloon!"
            show: { object: balloon }
          - text: "Beginning: the balloon floats away.\nMiddle: a bird pops it.\nEnd: Tia gets a new one."
            say: "Main events come in order: a beginning, a middle and an end. If you mix them up, the story does not make sense."
          - text: "Could the story work without it?"
            say: "To find a main event, ask: could the story work without this part? If not, it is a main event."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Jo the dog ran off at the park. Jo had a blue collar. Dad called and called. At last Jo came back.\n\nWhich is a main event?"
                say: "Listen. Jo the dog ran off at the park. Jo had a blue collar. Dad called and called. At last Jo came back. Which is a main event?"
                show: { object: dog }
                options: ["Jo ran off.", "Jo had a blue collar.", "It was at the park."]
                answer: "Jo ran off."
                option_audio: false
                feedback:
                  "Jo had a blue collar.": "The story still works without the collar. It is a detail."
                hints:
                  - "Could the story work without it?"
                  - "Without Jo running off, there is no story."
                  - "Jo ran off."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ali's tower fell down. He felt cross. He built it again, even taller.\n\nWhat happens at the end?"
                say: "Listen. Ali's tower fell down. He felt cross. He built it again, even taller. What happens at the end?"
                options: ["He built it again, taller.", "The tower fell down.", "He felt cross."]
                answer: "He built it again, taller."
                option_audio: false
                hints:
                  - "Think about the last thing that happens."
                  - "First the tower fell, then he was cross."
                  - "He built it again, taller."
              - id: l2-f3
                type: sorting
                text: "A hen lost her chick. The hen was brown. She looked in the barn. She found the chick asleep in the hay.\n\nMain event or detail?"
                say: "Listen. A hen lost her chick. The hen was brown. She looked in the barn. She found the chick asleep in the hay. Sort the sentences."
                option_audio: false
                bins:
                  - { id: main, show: { text: "main event" }, say: "Main event." }
                  - { id: detail, show: { text: "detail" }, say: "Detail." }
                options:
                  - { text: "A hen lost her chick.", bin: main }
                  - { text: "The hen was brown.", bin: detail }
                  - { text: "She found the chick.", bin: main }
                hints:
                  - "Ask: could the story work without it?"
                  - "The colour of the hen does not change the story."
                  - "Losing and finding the chick are main events. The brown hen is a detail."
              - id: l2-f4
                type: ordering
                text: "Ruby lost her tooth. She put it under her pillow. In the morning there was a coin.\n\nPut the main events in order."
                say: "Listen. Ruby lost her tooth. She put it under her pillow. In the morning there was a coin. Put the main events in order."
                options: ["She found a coin.", "Ruby lost her tooth.", "She put it under her pillow."]
                slot_count: 3
                answer: ["Ruby lost her tooth.", "She put it under her pillow.", "She found a coin."]
                option_audio: false
                hints:
                  - "What happened first?"
                  - "First the tooth came out."
                  - "Lost tooth, pillow, coin."
              - id: l2-f5
                type: true_false
                text: "Jo the dog ran off at the park. Jo had a blue collar. Dad called and called. At last Jo came back.\n\nIs it true? \"Jo came back\" is a main event."
                answer: true
                hints:
                  - "Could the story end without it?"
                  - "It is how the story ends."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A boy found a shell on the beach. It had a crab inside! He put it back in the sea.\n\nWhich is a main event?"
                say: "Listen. A boy found a shell on the beach. It had a crab inside! He put it back in the sea. Which is a main event?"
                show: { object: shell }
                options: ["He found a crab in a shell.", "It was a sunny day.", "The sand was yellow."]
                answer: "He found a crab in a shell."
                option_audio: false
                hints: ["Which part does the story need?"]
              - id: l2-s2
                type: multiple_choice
                text: "Nell wanted to win the race. She fell over. She got up and kept running. She came second.\n\nWhat happens in the middle?"
                say: "Listen. Nell wanted to win the race. She fell over. She got up and kept running. She came second. What happens in the middle?"
                options: ["She fell over and got up.", "She came second.", "She wanted to win."]
                answer: "She fell over and got up."
                option_audio: false
                hints: ["Not the start, not the end."]
              - id: l2-s3
                type: sorting
                text: "A cat got stuck up a tree. It had a fluffy tail. A firefighter climbed a ladder. She carried the cat down.\n\nMain event or detail?"
                say: "Listen. A cat got stuck up a tree. It had a fluffy tail. A firefighter climbed a ladder. She carried the cat down. Sort the sentences."
                option_audio: false
                bins:
                  - { id: main, show: { text: "main event" }, say: "Main event." }
                  - { id: detail, show: { text: "detail" }, say: "Detail." }
                options:
                  - { text: "A cat got stuck up a tree.", bin: main }
                  - { text: "It had a fluffy tail.", bin: detail }
                  - { text: "The firefighter carried it down.", bin: main }
                hints: ["The fluffy tail does not change what happens."]
              - id: l2-s4
                type: true_false
                text: "Is it true? It does not matter what order the main events come in."
                answer: false
                hints: ["Would the story make sense mixed up?"]
              - id: l2-s5
                type: ordering
                text: "Kit made a sandcastle. A big wave knocked it down. Kit built a new one further up the beach.\n\nPut the main events in order."
                say: "Listen. Kit made a sandcastle. A big wave knocked it down. Kit built a new one further up the beach. Put the main events in order."
                options: ["A wave knocked it down.", "Kit built a new one.", "Kit made a sandcastle."]
                slot_count: 3
                answer: ["Kit made a sandcastle.", "A wave knocked it down.", "Kit built a new one."]
                option_audio: false
                hints: ["What did Kit do first?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Owen's lunch box was missing. He looked in his bag. His friend had picked it up by mistake and gave it back.\n\nWhich is a main event?"
                say: "Listen. Owen's lunch box was missing. He looked in his bag. His friend had picked it up by mistake and gave it back. Which is a main event?"
                options: ["His lunch box was missing.", "It was a Tuesday.", "His bag was blue."]
                answer: "His lunch box was missing."
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "A seed fell on the ground. Rain came. The seed grew into a tall tree.\n\nWhat happens at the end?"
                say: "Listen. A seed fell on the ground. Rain came. The seed grew into a tall tree. What happens at the end?"
                show: { object: tree }
                options: ["The seed grew into a tree.", "Rain came.", "A seed fell."]
                answer: "The seed grew into a tree."
                option_audio: false
              - id: l2-n3
                type: sorting
                text: "Pip the mouse was hungry. Pip had small pink ears. Pip found some cheese. Pip ate it all up.\n\nMain event or detail?"
                say: "Listen. Pip the mouse was hungry. Pip had small pink ears. Pip found some cheese. Pip ate it all up. Sort the sentences."
                option_audio: false
                bins:
                  - { id: main, show: { text: "main event" }, say: "Main event." }
                  - { id: detail, show: { text: "detail" }, say: "Detail." }
                options:
                  - { text: "Pip found some cheese.", bin: main }
                  - { text: "Pip had small pink ears.", bin: detail }
                  - { text: "Pip ate it all up.", bin: main }
              - id: l2-n4
                type: ordering
                text: "Gran and Lola baked a cake. They left it to cool. The dog ate it! So they baked another.\n\nPut the main events in order."
                say: "Listen. Gran and Lola baked a cake. They left it to cool. The dog ate it! So they baked another. Put the main events in order."
                options: ["The dog ate the cake.", "They baked another.", "Gran and Lola baked a cake."]
                slot_count: 3
                answer: ["Gran and Lola baked a cake.", "The dog ate the cake.", "They baked another."]
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Pip the mouse was hungry. Pip had small pink ears. Pip found some cheese. Pip ate it all up.\n\nIs it true? \"Pip had small pink ears\" is a main event."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: title-fit
            type: multiple_choice
            text: "Leo wanted to ride his bike without help. He fell off lots of times. At last he rode all the way round the park.\n\nWhich title fits best?"
            say: "Listen. Leo wanted to ride his bike without help. He fell off lots of times. At last he rode all the way round the park. Which title fits best?"
            show: { object: bike }
            options: ["Leo Learns to Ride", "The Park Gate", "Leo's Helmet"]
            answer: "Leo Learns to Ride"
            option_audio: false
          - id: l2-c2
            part: title-predict
            type: multiple_choice
            text: "The title is \"The Brave Little Duck\". What will the story be about?"
            say: "The title is The Brave Little Duck. What will the story be about?"
            options: ["a duck who does something brave", "a big scary dog", "a duck who stays in bed"]
            answer: "a duck who does something brave"
          - id: l2-c3
            part: main-events
            type: sorting
            text: "A bird built a nest. The nest was made of twigs. Three eggs hatched. The chicks learnt to fly.\n\nMain event or detail?"
            say: "Listen. A bird built a nest. The nest was made of twigs. Three eggs hatched. The chicks learnt to fly. Sort the sentences."
            option_audio: false
            bins:
              - { id: main, show: { text: "main event" }, say: "Main event." }
              - { id: detail, show: { text: "detail" }, say: "Detail." }
            options:
              - { text: "A bird built a nest.", bin: main }
              - { text: "The nest was made of twigs.", bin: detail }
              - { text: "The chicks learnt to fly.", bin: main }
          - id: l2-c4
            part: event-order
            type: ordering
            text: "Sid lost his hat in the wind. It landed in a pond. A duck brought it back to him.\n\nPut the main events in order."
            say: "Listen. Sid lost his hat in the wind. It landed in a pond. A duck brought it back to him. Put the main events in order."
            options: ["A duck brought it back.", "Sid lost his hat in the wind.", "It landed in a pond."]
            slot_count: 3
            answer: ["Sid lost his hat in the wind.", "It landed in a pond.", "A duck brought it back."]
            option_audio: false
          - id: l2-c5
            part: event-order
            type: multiple_choice
            text: "Nina's cat got stuck on the shed roof. Nina ran to get her dad. Dad climbed a ladder and lifted the cat down.\n\nWhich part is the end?"
            say: "Listen. Nina's cat got stuck on the shed roof. Nina ran to get her dad. Dad climbed a ladder and lifted the cat down. Which part is the end?"
            options: ["Dad lifted the cat down.", "The cat got stuck on the roof.", "Nina ran to get her dad."]
            answer: "Dad lifted the cat down."
            option_audio: false
          - id: l2-c6
            part: title-predict
            type: multiple_choice
            text: "The title is \"Ned Can't Sleep\". What will the story be about?"
            say: "The title is Ned Can't Sleep. What will the story be about?"
            options: ["a boy who is wide awake at night", "a boy at the seaside", "a race at school"]
            answer: "a boy who is wide awake at night"
          - id: l2-c7
