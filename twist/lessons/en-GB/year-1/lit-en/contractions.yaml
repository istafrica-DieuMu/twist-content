            audio: { en: "it's" }
            options: ["it's", "is", "sit"]
            answer: "it's"
          - id: l2-c8
            part: read
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "you'll" }
            options: ["you", "you'll", "yell"]
            answer: "you'll"
          - id: l2-c9
            part: read
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "he's" }
            options: ["he'll", "his", "he's"]
