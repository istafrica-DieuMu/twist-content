# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.contractions
skill: lit-en.word-reading.contractions
curriculum: en-GB
language: en
title:
  de: Kurzformen lesen
  en: Reading contractions
summary: >
  A contraction pushes two words together into one short word, and the
  apostrophe sits where letters are missed out. Lesson 1 reads I'm, I'll,
  we'll and you'll, and sets I'll against ill; lesson 2 reads it's, he's,
  she's, can't and don't, and ends with the skill check. The child reads
  the short word, says what two words it stands for, finds which letters
  are missing, and checks the meaning in a sentence.
metadata:
  year: year-1
  topic: { de: "Wörter lesen", en: "Reading words" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.word-reading.exception-words-y1]
  also_practises: []
  vocabulary: { en: [contraction, short word, apostrophe, missing letters, "I'm", "I'll", "we'll", "you'll", "it's", "he's", "she's", "can't", "don't"] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: read, what: { de: Kurzformen lesen und erkennen, en: reading and recognising contractions } }
    - { id: meaning, what: { de: "sagen, für welche Wörter eine Kurzform steht", en: saying which words a contraction stands for } }
    - { id: missing-letters, what: { de: "wissen, welche Buchstaben der Apostroph ersetzt", en: knowing which letters the apostrophe stands for } }
    - { id: in-sentence, what: { de: "die Kurzform wählen, die in den Satz passt", en: choosing the contraction that fits a sentence } }
  misconceptions:
    - id: apostrophe-meaning
      what: Thinks the apostrophe is just a mark, or that it stands for the letter next to it (the m in I'm)
      addressed: Learn says the apostrophe sits where letters are missed out; l1-f3 with feedback, l1-s4, l1-n4, l2-f3 with feedback, l2-n4, l2-c3
    - id: mixes-endings
      what: Mixes up contractions that look alike (I'll and ill, he's and he'll, I'm and I'll)
      addressed: lesson 1 Learn sets ill beside I'll and lesson 2 Learn sets he's beside he'll; l1-f4 with feedback, l1-s1, l1-n3, l2-f2, l2-s3, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "I'm, I'll, we'll", en: "I'm, I'll, we'll" }
    goal:
      de: "Lies kurze Wörter wie I'm und we'll und sag die zwei Wörter, für die sie stehen."
      en: "Read short words like I'm and we'll, and say the two words they stand for."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "they" }
            options: ["the", "they", "then"]
            answer: "they"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? In was, the a sounds like the o in dog."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "I am happy.\nI'm happy."
            say: "Listen. I am happy. I'm happy. They mean the same. What do you think happened to the two words I am?"
            show: { drawn: letter-card, text: "I am" }
          - text: "I am → I'm"
            say: "They got squashed into one! Sometimes we push two words together to make one short word. I am becomes I'm. The a is missed out. This little mark is an apostrophe. It shows where letters are missing."
            show: { drawn: letter-card, text: "I'm" }
          - text: "I will → I'll"
            say: "I will becomes I'll. The w and the i are missed out, and the apostrophe goes where they were."
            show: { drawn: letter-card, text: "I'll" }
          - text: "we will → we'll   you will → you'll"
            say: "We will becomes we'll. You will becomes you'll. When you read a short word like this, say the two words in your head to check what it means."
            show: { drawn: letter-card, text: "we'll you'll" }
          - text: "ill   I'll"
            say: "Look carefully. Ill, with no apostrophe, means poorly. I'll, with a capital I and an apostrophe, means I will."
            show: { drawn: letter-card, text: "ill I'll" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What does this short word mean?"
                say: "Read the short word on the card. Which two words does it stand for?"
                show: { drawn: letter-card, text: "I'm" }
                options: ["I am", "I will", "I can"]
                answer: "I am"
                hints:
                  - "Look at the letter after the apostrophe."
                  - "It ends in m. Which word ends in m: am, will or can?"
                  - "I'm means I am."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Match each short word to its two words."
                say: "Match each short word to the two words it stands for."
                option_audio: false
                pairs:
                  - { left: { text: "I'm" }, right: { text: "I am" } }
                  - { left: { text: "I'll" }, right: { text: "I will" } }
                  - { left: { text: "we'll" }, right: { text: "we will" } }
                hints:
                  - "Look at the end of each short word."
                  - "A short word ending in m goes with am. A short word ending in l, l goes with will."
                  - "I'm is I am. I'll is I will. We'll is we will."
              - id: l1-f3
                type: multiple_choice
                text: "Which letter does the apostrophe stand for?"
                say: "Look at the short word on the card. Which letter does the apostrophe stand for?"
                show: { drawn: letter-card, text: "I'm" }
                options: ["a", "m", "w"]
                answer: "a"
                option_audio: false
                feedback:
                  "m": "The m is still there. The apostrophe sits where a letter was missed out."
                hints:
                  - "Say the two words in full: I am."
                  - "Which letter of I am is not in I'm?"
                  - "The a is missing."
              - id: l1-f4
                type: fill_in_blank
                text: "Which short word fits?"
                say: "Read the sentence. Which short word fits the gap?"
                frame: "_ six today."
                options: ["I'm", "I'll"]
                answer: ["I'm"]
                feedback:
                  "I'll": "I'll means I will. I will six today does not make sense."
                hints:
                  - "Say each short word as two words in the sentence."
                  - "Try I am six today, then I will six today."
                  - "I am six today. Tap I'm."
              - id: l1-f5
                type: true_false
                text: "Is it true? We'll is short for we will."
                answer: true
                hints:
                  - "Look at the end of we'll."
                  - "It ends in l, l, like will. The w and the i are missing."
                  - "Yes. We'll means we will."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "I'll" }
                options: ["I'm", "ill", "I'll"]
                answer: "I'll"
                hints: ["The word you heard means I will."]
              - id: l1-s2
                type: multiple_choice
                text: "What does this short word mean?"
                say: "Read the short word on the card. Which two words does it stand for?"
                show: { drawn: letter-card, text: "you'll" }
                options: ["you will", "you are", "we will"]
                answer: "you will"
                hints: ["Look at the start and the end of the short word."]
              - id: l1-s3
                type: fill_in_blank
                text: "Which short word fits?"
                say: "Read the sentence. Which short word fits the gap?"
                frame: "_ see you at school."
                options: ["I'm", "I'll"]
                answer: ["I'll"]
                hints: ["Try I am see you, then I will see you."]
              - id: l1-s4
                type: true_false
                text: "Is it true? In I'm, the apostrophe stands for the letter m."
                answer: false
                hints: ["Can you still see the m in I'm?"]
              - id: l1-s5
                type: matching
                text: "Match each short word to its two words."
                say: "Match each short word to the two words it stands for."
                option_audio: false
                pairs:
                  - { left: { text: "you'll" }, right: { text: "you will" } }
                  - { left: { text: "I'm" }, right: { text: "I am" } }
                  - { left: { text: "we'll" }, right: { text: "we will" } }
                hints: ["Look at the start of each short word: I, you or we."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What does this short word mean?"
                say: "Read the short word on the card. Which two words does it stand for?"
                show: { drawn: letter-card, text: "we'll" }
                options: ["we are", "we will", "you will"]
                answer: "we will"
              - id: l1-n2
                type: fill_in_blank
                text: "Which short word fits?"
                say: "Read the sentence. Which short word fits the gap?"
                frame: "_ have cake at the party."
                options: ["We'll", "I'm"]
                answer: ["We'll"]
              - id: l1-n3
                type: true_false
                text: "Is it true? Ill and I'll mean the same."
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Which letters are missing from I'll?"
                say: "Look at the short word on the card. Which letters are missing from it?"
                show: { drawn: letter-card, text: "I'll" }
                options: ["w and i", "a", "l and l"]
                answer: "w and i"
                option_audio: false
              - id: l1-n5
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "we'll" }
                options: ["well", "we'll", "will"]
                answer: "we'll"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: matching
            text: "Match each short word to its two words."
            say: "Match each short word to the two words it stands for."
            option_audio: false
            pairs:
              - { left: { text: "I'll" }, right: { text: "I will" } }
              - { left: { text: "you'll" }, right: { text: "you will" } }
              - { left: { text: "I'm" }, right: { text: "I am" } }
          - id: l1-c2
            type: fill_in_blank
            text: "Which short word fits?"
            say: "Read the sentence. Which short word fits the gap?"
            frame: "_ hungry."
            options: ["I'll", "I'm"]
            answer: ["I'm"]
          - id: l1-c3
            type: true_false
            text: "Is it true? I'm is short for I am."
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Which short word fits?"
            say: "Read the sentence. Which short word fits the gap?"
            frame: "_ help you tidy up."
            options: ["I'm", "I'll"]
            answer: ["I'll"]
          - id: l1-c5
            type: true_false
            text: "Is it true? You'll is short for you are."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "I am, as one short word. Which one is written correctly?"
            say: "I am, as one short word. Which one is written correctly? Read them yourself."
            options: ["Im", "I'm", "Im'"]
            answer: "I'm"
            option_audio: false

  - n: 2
    title: { de: "it's, he's, can't, don't", en: "it's, he's, can't, don't" }
    goal:
      de: "Lies kurze Wörter wie it's und don't und sag, für welche Buchstaben der Apostroph steht."
      en: "Read short words like it's and don't, and say which letters the apostrophe stands for."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What does this short word mean?"
            say: "Read the short word on the card. Which two words does it stand for?"
            show: { drawn: letter-card, text: "I'll" }
            options: ["I am", "I will", "ill"]
            answer: "I will"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? The apostrophe shows where letters are missing."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "it is → ?"
            say: "We can squash it is into one short word too. What do you think it looks like? Which letter will the apostrophe stand for?"
            show: { drawn: letter-card, text: "it is" }
          - text: "it is → it's   he is → he's   she is → she's"
            say: "It's! It is becomes it's. He is becomes he's. She is becomes she's. The apostrophe stands for the i of is."
            show: { drawn: letter-card, text: "it's he's she's" }
          - text: "do not → don't   cannot → can't"
            say: "Do not becomes don't. The apostrophe stands for the o of not. Cannot becomes can't. The n and the o are missed out."
            show: { drawn: letter-card, text: "don't can't" }
          - text: "he's   he'll"
            say: "Look at the end to find the meaning. He's ends in s, so it means he is. He'll ends in l, l, so it means he will."
            show: { drawn: letter-card, text: "he's he'll" }
          - text: "Did you know? O'clock is a short word too. It is short for of the clock."
            say: "Did you know? O'clock is a short word too, with an apostrophe in it. Long ago, people said it is three of the clock. Now we say three o'clock!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What does this short word mean?"
                say: "Read the short word on the card. Which two words does it stand for?"
                show: { drawn: letter-card, text: "it's" }
                options: ["it is", "it will", "is it"]
                answer: "it is"
                hints:
                  - "Look at the letter after the apostrophe."
                  - "It ends in s. Which word ends in s: is or will?"
                  - "It's means it is."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Does it stand for is or will?"
                say: "Read each short word. Does it stand for is, or for will? Put it in the right group."
                option_audio: false
                bins:
                  - { id: is, show: { text: "is" }, say: "is" }
                  - { id: will, show: { text: "will" }, say: "will" }
                options:
                  - { text: "it's", bin: is }
                  - { text: "I'll", bin: will }
                  - { text: "she's", bin: is }
                  - { text: "we'll", bin: will }
                hints:
                  - "Look at the end of each short word."
                  - "A short word ending in s stands for is. One ending in l, l stands for will."
                  - "It's and she's go with is. I'll and we'll go with will."
              - id: l2-f3
                type: multiple_choice
                text: "Which letter does the apostrophe stand for?"
                say: "Look at the short word on the card. Which letter does the apostrophe stand for?"
                show: { drawn: letter-card, text: "don't" }
                options: ["o", "n", "t"]
                answer: "o"
                option_audio: false
                feedback:
                  "n": "The n is still there. The apostrophe sits where a letter was missed out."
                hints:
                  - "Say the two words in full: do not."
                  - "Which letter of not is missing from don't?"
                  - "The o of not is missing."
              - id: l2-f4
                type: fill_in_blank
                text: "Which short word fits?"
                say: "Read the sentence. Which short word fits the gap?"
                frame: "I _ like rain."
                options: ["it's", "don't"]
                answer: ["don't"]
                hints:
                  - "Say each short word as two words in the sentence."
                  - "Try I it is like rain, then I do not like rain."
                  - "I do not like rain. Tap don't."
              - id: l2-f5
                type: matching
                text: "Match each short word to the words it stands for."
                say: "Match each short word to the words it stands for."
                option_audio: false
                pairs:
                  - { left: { text: "he's" }, right: { text: "he is" } }
                  - { left: { text: "can't" }, right: { text: "cannot" } }
                  - { left: { text: "don't" }, right: { text: "do not" } }
                hints:
                  - "Look at the start of each short word."
                  - "Can't starts like cannot. Don't starts like do."
                  - "He's is he is. Can't is cannot. Don't is do not."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What does this short word mean?"
                say: "Read the short word on the card. Which two words does it stand for?"
                show: { drawn: letter-card, text: "she's" }
                options: ["she is", "she will", "he is"]
                answer: "she is"
                hints: ["Look at the start and the end of the short word."]
              - id: l2-s2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "can't" }
                options: ["can", "can't", "cat"]
                answer: "can't"
                hints: ["The word you heard means cannot."]
              - id: l2-s3
                type: true_false
                text: "Is it true? He's means he will."
                answer: false
                hints: ["Look at the end. He's ends in s."]
              - id: l2-s4
                type: fill_in_blank
                text: "Which short word fits?"
                say: "Read the sentences. Which short word fits the gap?"
                frame: "Sam _ reach the shelf. It is too high."
                options: ["can't", "he's"]
                answer: ["can't"]
                hints: ["Try each one in full: cannot reach, he is reach."]
              - id: l2-s5
                type: matching
                text: "Match each short word to its two words."
                say: "Match each short word to the two words it stands for."
                option_audio: false
                pairs:
                  - { left: { text: "it's" }, right: { text: "it is" } }
                  - { left: { text: "she's" }, right: { text: "she is" } }
                  - { left: { text: "don't" }, right: { text: "do not" } }
                hints: ["Look at the start of each short word."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What does this short word mean?"
                say: "Read the short word on the card. Which two words does it stand for?"
                show: { drawn: letter-card, text: "he'll" }
                options: ["he is", "he will", "she will"]
                answer: "he will"
              - id: l2-n2
                type: sorting
                text: "Does it stand for is or not?"
                say: "Read each short word. Does it stand for is, or for not? Put it in the right group."
                option_audio: false
                bins:
                  - { id: is, show: { text: "is" }, say: "is" }
                  - { id: not, show: { text: "not" }, say: "not" }
                options:
                  - { text: "he's", bin: is }
                  - { text: "can't", bin: not }
                  - { text: "it's", bin: is }
                  - { text: "don't", bin: not }
              - id: l2-n3
                type: fill_in_blank
                text: "Which short word fits?"
                say: "Read the sentence. Which short word fits the gap?"
                frame: "_ raining, so take a coat."
                options: ["I'll", "It's"]
                answer: ["It's"]
              - id: l2-n4
                type: true_false
                text: "Is it true? In don't, the apostrophe stands for the letter o."
                answer: true
              - id: l2-n5
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "she's" }
                options: ["she'll", "she's", "shell"]
                answer: "she's"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: meaning
            type: multiple_choice
            text: "What does this short word mean?"
            say: "Read the short word on the card. Which words does it stand for?"
            show: { drawn: letter-card, text: "we'll" }
            options: ["we do", "we will", "will we"]
            answer: "we will"
          - id: l2-c2
            part: in-sentence
            type: fill_in_blank
            text: "Which short word fits?"
            say: "Read the sentence. Which short word fits the gap?"
            frame: "_ my best friend."
            options: ["I'll", "He's"]
            answer: ["He's"]
          - id: l2-c3
            part: missing-letters
            type: multiple_choice
            text: "Which letters are missing from can't?"
            say: "Look at the short word on the card. Which letters are missing from it?"
            show: { drawn: letter-card, text: "can't" }
            options: ["n and o", "a", "t"]
            answer: "n and o"
            option_audio: false
          - id: l2-c4
            part: meaning
            type: true_false
            text: "Is it true? I'll means I am."
            answer: false
          - id: l2-c5
            part: read
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "don't" }
            options: ["done", "dot", "don't"]
