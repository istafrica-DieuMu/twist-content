            text: "What does this short word mean?"
            say: "Read the short word on the card. Which word does it stand for?"
            show: { drawn: letter-card, text: "can't" }
            options: ["can", "cannot", "can it"]
            answer: "cannot"
          - id: l2-c11
            part: meaning
