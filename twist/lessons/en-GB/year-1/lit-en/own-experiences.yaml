# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.own-experiences
skill: lit-en.comprehension.own-experiences
curriculum: en-GB
language: en
title:
  de: Geschichten mit dem eigenen Leben verbinden
  en: Stories and my own life
summary: >
  Short stories read aloud, each a few sentences long. Lesson 1 links a
  character's feelings to a time the child felt the same, and tells a good
  link (the same feeling or the same kind of event) from a small one (the
  same name or the same colour of coat). Lesson 2 uses what the child
  knows from life to understand what a story does not say (ice melts in
  the sun, wellies mean puddles), and shows that when a story says
  something different from the child's life, the story counts. Lesson 2
  ends with the skill check.
metadata:
  year: year-1
  topic: { de: "Geschichten verstehen", en: "Understanding stories" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.comprehension.retell]
  also_practises: []
  vocabulary: { en: [link, feeling, nervous, cross, proud, lonely, This reminds me of] }
  forms: [text, picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: surface-link
      what: Links on a small detail (the same name, the same colour) instead of the feeling or the event
      addressed: "Learn screen 3 of lesson 1; l1-f3, l1-s3, l1-s4, l1-n5, l1-c3 and l2-c5 set a feeling link against a detail link; feedback on l1-f3 says why"
    - id: own-life-over-text
      what: Answers from their own life when the story says the character feels differently (Zara is excited at the beach because I love the beach)
      addressed: "Learn screen 3 of lesson 2; l2-f3, l2-s2, l2-n3 and l2-c4 give characters who dislike what most children like; feedback names what the story says"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gefühle wie meine", en: "Feelings like mine" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Jo made a sandwich. She cut it in half. Then she ate it all up.\n\nPut the story in order."
            say: "Listen. Jo made a sandwich. She cut it in half. Then she ate it all up. Put the story in order."
            options: ["She cut it in half.", "Then she ate it all up.", "Jo made a sandwich."]
            slot_count: 3
            answer: ["Jo made a sandwich.", "She cut it in half.", "Then she ate it all up."]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Raj went to the park with Grandpa. They fed the ducks and then had an ice cream.\n\nWhat did they do first?"
            say: "Listen. Raj went to the park with Grandpa. They fed the ducks and then had an ice cream. What did they do first?"
            show: { object: duck }
            options: ["fed the ducks", "had an ice cream", "went home"]
            answer: "fed the ducks"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "It was Ben's first day at his new school. His tummy felt funny. He held Mum's hand tight."
            say: "Listen. It was Ben's first day at his new school. His tummy felt funny. He held Mum's hand tight. How does Ben feel? He feels nervous."
            show: { object: school }
          - text: "This reminds me of ..."
            say: "Good readers ask: has something like that happened to me? I felt nervous on my first day at school. That helps me understand how Ben feels."
          - text: "a good link: the same feeling, the same kind of thing"
            say: "A good link is about the same feeling, or the same kind of thing happening. Saying my mum has a coat too is only a small link. It does not help me understand Ben."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ava's balloon floated away into the sky. She cried and cried.\n\nWhen might you feel like Ava?"
                say: "Listen. Ava's balloon floated away into the sky. She cried and cried. When might you feel like Ava?"
                show: { object: balloon }
                options: ["when I lose something I love", "when I get a present", "when I go to a party"]
                answer: "when I lose something I love"
                hints:
                  - "First think: how does Ava feel?"
                  - "She is sad because she lost her balloon."
                  - "When I lose something I love."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Tom scored a goal for his team. He jumped up and cheered.\n\nHow does Tom feel?"
                say: "Listen. Tom scored a goal for his team. He jumped up and cheered. How does Tom feel?"
                options: [{ object: happy }, { object: sad }, { object: scared }]
                answer: happy
                hints:
                  - "What do you do when you score a goal?"
                  - "Jumping and cheering show a good feeling."
                  - "Happy."
              - id: l1-f3
                type: multiple_choice
                text: "Ben held Mum's hand tight on his first day.\n\nWhich is the best link to your own life?"
                say: "Ben held Mum's hand tight on his first day at a new school. Which is the best link to your own life?"
                options: ["I felt nervous on my first day in a new class.", "I have a mum too.", "I like holding sweets."]
                answer: "I felt nervous on my first day in a new class."
                feedback:
                  I have a mum too.: "That is only a small link. Think about how Ben feels."
                hints:
                  - "A good link is about the same feeling."
                  - "Ben feels nervous. Which one is about feeling nervous?"
                  - "I felt nervous on my first day in a new class."
              - id: l1-f4
                type: true_false
                text: "Lily's dog ran off in the park. She looked everywhere.\n\nIs it true? 'I felt worried when I lost my teddy' is a good link."
                say: "Listen. Lily's dog ran off in the park. She looked everywhere. Is it true? I felt worried when I lost my teddy is a good link."
                show: { object: dog }
                answer: true
                hints:
                  - "How does Lily feel?"
                  - "She is worried. Losing a teddy is the same kind of thing."
                  - "Yes, it is a good link."
              - id: l1-f5
                type: speak
                text: "Ben felt nervous. When have you felt nervous? Say it out loud."
                expected_text: "I felt nervous when I started swimming lessons."
                hints:
                  - "Think of a new place or something new you tried."
                  - "A first day, a new club, a show?"
                  - "You could say: I felt nervous when I started swimming lessons."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Ruby's tower of blocks fell down just before she finished. She stamped her feet.\n\nHow does Ruby feel?"
                say: "Listen. Ruby's tower of blocks fell down just before she finished. She stamped her feet. How does Ruby feel?"
                options: [{ object: angry }, { object: happy }, { object: tired }]
                answer: angry
                hints: ["What does stamping your feet show?"]
              - id: l1-s2
                type: multiple_choice
                text: "Ruby's tower fell down.\n\nWhen might you feel like Ruby?"
                say: "Ruby's tower fell down. When might you feel like Ruby?"
                options: ["when something I made gets broken", "when I eat my lunch", "when I see a rainbow"]
                answer: "when something I made gets broken"
                hints: ["Ruby is cross because her tower broke."]
              - id: l1-s3
                type: multiple_choice
                text: "Kai's baby sister was born. He held her tiny hand and smiled.\n\nWhich link helps you understand Kai best?"
                say: "Listen. Kai's baby sister was born. He held her tiny hand and smiled. Which link helps you understand Kai best?"
                show: { object: baby }
                options: ["I felt happy when a new baby came to our family.", "I have small hands.", "I like the name Kai."]
                answer: "I felt happy when a new baby came to our family."
                hints: ["Which one has the same feeling and the same kind of thing?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? 'My name is Kai too' helps you understand how Kai feels."
                answer: false
                hints: ["Does a name tell you about a feeling?"]
              - id: l1-s5
                type: speak
                text: "Ruby felt cross when her tower fell. When have you felt cross? Say it out loud."
                expected_text: "I felt cross when my brother knocked over my model."
                hints: ["You could start: I felt cross when ..."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Sam was alone in the dark. He heard a creak on the stairs.\n\nHow does Sam feel?"
                say: "Listen. Sam was alone in the dark. He heard a creak on the stairs. How does Sam feel?"
                options: [{ object: scared }, { object: happy }, { object: tired }]
                answer: scared
              - id: l1-n2
                type: multiple_choice
                text: "Sam heard a creak in the dark.\n\nWhen might you feel like Sam?"
                say: "Sam heard a creak in the dark. When might you feel like Sam?"
                options: ["when I hear a strange noise at night", "when I play in the sun", "when I eat ice cream"]
                answer: "when I hear a strange noise at night"
              - id: l1-n3
                type: multiple_choice
                text: "Mia baked a cake with Gran. They licked the spoon.\n\nWhich is most like Mia's day?"
                say: "Listen. Mia baked a cake with Gran. They licked the spoon. Which is most like Mia's day?"
                show: { object: cake }
                options: ["I made pancakes with my dad.", "I went to the dentist.", "I lost my shoe."]
                answer: "I made pancakes with my dad."
              - id: l1-n4
                type: true_false
                text: "Is it true? A good link is about the same feeling or the same kind of thing happening."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Leo's best friend moved away. Leo felt lonely at playtime.\n\nWhich is the best link?"
                say: "Listen. Leo's best friend moved away. Leo felt lonely at playtime. Which is the best link?"
                options: ["I felt lonely when my best friend was off school.", "My friend has a bike.", "I like playtime."]
                answer: "I felt lonely when my best friend was off school."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Zoe got a puppy at last. She danced round the kitchen.\n\nHow does Zoe feel?"
            say: "Listen. Zoe got a puppy at last. She danced round the kitchen. How does Zoe feel?"
            options: [{ object: happy }, { object: sad }, { object: angry }]
            answer: happy
          - id: l1-c2
            type: multiple_choice
            text: "Zoe got the puppy she wanted.\n\nWhen might you feel like Zoe?"
            say: "Zoe got the puppy she wanted. When might you feel like Zoe?"
            options: ["when something I wanted for ages happens", "when I fall over", "when it rains all day"]
            answer: "when something I wanted for ages happens"
          - id: l1-c3
            type: true_false
            text: "Is it true? 'Zoe's kitchen is like my kitchen' helps you understand how Zoe feels."
            answer: false

  - n: 2
    title: { de: "Was ich weiß, hilft mir", en: "What I know helps me" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Finn's kite got stuck in a tree. His face went red and he shouted.\n\nHow does Finn feel?"
            say: "Listen. Finn's kite got stuck in a tree. His face went red and he shouted. How does Finn feel?"
            options: [{ object: angry }, { object: happy }, { object: tired }]
            answer: angry
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Finn's kite got stuck in a tree.\n\nWhich link helps you understand Finn best?"
            say: "Finn's kite got stuck in a tree. Which link helps you understand Finn best?"
            options: ["I felt cross when my ball went over the fence.", "I have a kite too.", "I like trees."]
            answer: "I felt cross when my ball went over the fence."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Sam left his ice lolly on the wall in the hot sun."
            say: "Listen. Sam left his ice lolly on the wall in the hot sun. I know that ice melts in the sun. The story does not say what happens next, but I can tell. The lolly will melt."
            show: { object: sun }
          - text: "Asha put on her wellies and went out to splash in the puddles."
            say: "Listen. Asha put on her wellies and went out to splash in the puddles. I know that puddles come after rain. The story does not say so, but I know it has been raining."
            show: { object: wellies }
          - text: "Zara does not like the beach. The sand is too hot for her feet."
            say: "Listen. Zara does not like the beach. The sand is too hot for her feet. Careful. You might love the beach, but Zara does not. When the story tells you something, the story counts. Your own life helps you understand a story. It does not change what the story says."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Sam left his ice lolly on the wall in the hot sun.\n\nWhat will happen to it?"
                say: "Sam left his ice lolly on the wall in the hot sun. What will happen to it?"
                options: ["It will melt.", "It will grow.", "It will get colder."]
                answer: "It will melt."
                hints:
                  - "What do you know about ice and the sun?"
                  - "Have you ever had an ice lolly on a hot day?"
                  - "It will melt."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Asha put on her wellies and went out to splash in the puddles.\n\nWhat had the weather been like?"
                say: "Asha put on her wellies and went out to splash in the puddles. What had the weather been like?"
                options: ["rainy", "hot and dry", "snowy"]
                answer: "rainy"
                hints:
                  - "What makes puddles?"
                  - "Puddles are water on the ground."
                  - "Rainy."
              - id: l2-f3
                type: multiple_choice
                text: "Zara does not like the beach. The sand is too hot for her feet.\n\nHow does Zara feel at the beach?"
                say: "Zara does not like the beach. The sand is too hot for her feet. How does Zara feel at the beach?"
                options: ["unhappy", "excited", "sleepy"]
                answer: "unhappy"
                feedback:
                  excited: "You might love the beach, but the story says Zara does not."
                hints:
                  - "What does the story say about Zara and the beach?"
                  - "She does not like it, and her feet are hot."
                  - "Unhappy."
              - id: l2-f4
                type: image_multiple_choice
                text: "Noah yawned and rubbed his eyes. It was very late.\n\nHow does Noah feel?"
                say: "Noah yawned and rubbed his eyes. It was very late. How does Noah feel?"
                options: [{ object: tired }, { object: happy }, { object: angry }]
                answer: tired
                hints:
                  - "When do you yawn?"
                  - "You yawn when it is late and you need to sleep."
                  - "Tired."
              - id: l2-f5
                type: true_false
                text: "Mum lit the candles on the cake and everyone sang.\n\nIs it true? It is somebody's birthday."
                say: "Mum lit the candles on the cake and everyone sang. Is it true? It is somebody's birthday."
                show: { object: cake }
                answer: true
                hints:
                  - "When do people put candles on a cake and sing?"
                  - "Think of the song people sing."
                  - "Yes, it is a birthday."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ella put on her coat, her woolly hat and her gloves. Then she built a snowman.\n\nWhat was the weather like?"
                say: "Ella put on her coat, her woolly hat and her gloves. Then she built a snowman. What was the weather like?"
                show: { object: snowman }
                options: ["cold and snowy", "hot and sunny", "warm and wet"]
                answer: "cold and snowy"
                hints: ["What do you need to build a snowman?"]
              - id: l2-s2
                type: multiple_choice
                text: "Jay does not like dogs. A big dog ran up to him in the park.\n\nHow did Jay feel?"
                say: "Jay does not like dogs. A big dog ran up to him in the park. How did Jay feel?"
                options: ["scared", "excited", "proud"]
                answer: "scared"
                feedback:
                  excited: "You might love dogs, but the story says Jay does not."
                hints: ["The story says Jay does not like dogs."]
              - id: l2-s3
                type: true_false
                text: "Max dropped his glass of milk on the hard floor.\n\nIs it true? Max still has a full glass of milk."
                say: "Max dropped his glass of milk on the hard floor. Is it true? Max still has a full glass of milk."
                answer: false
                hints: ["What happens to milk when you drop the glass?"]
              - id: l2-s4
                type: speak
                text: "Sam's lolly melted in the sun. Has something like that happened to you? Say it out loud."
                expected_text: "My ice cream melted on a hot day."
                hints: ["You could start: My ice cream ..."]
              - id: l2-s5
                type: multiple_choice
                text: "Pia's tooth was wobbly. That night she put it under her pillow.\n\nWhat has happened?"
                say: "Pia's tooth was wobbly. That night she put it under her pillow. What has happened?"
                options: ["Her tooth has come out.", "She has lost her pillow.", "She is going to school."]
                answer: "Her tooth has come out."
                hints: ["What happens to a wobbly tooth?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Oli's tummy rumbled. He looked at the clock. It was nearly lunchtime.\n\nHow does Oli feel?"
                say: "Oli's tummy rumbled. He looked at the clock. It was nearly lunchtime. How does Oli feel?"
                options: ["hungry", "cold", "sleepy"]
                answer: "hungry"
              - id: l2-n2
                type: multiple_choice
                text: "Gran put the cake in the oven. Soon the kitchen smelt lovely.\n\nWhat was Gran doing?"
                say: "Gran put the cake in the oven. Soon the kitchen smelt lovely. What was Gran doing?"
                options: ["baking", "washing up", "sleeping"]
                answer: "baking"
              - id: l2-n3
                type: multiple_choice
                text: "Rosa loves the rain. She looked out of the window and saw big grey clouds.\n\nHow does Rosa feel?"
                say: "Rosa loves the rain. She looked out of the window and saw big grey clouds. How does Rosa feel?"
                options: ["pleased", "sad", "scared"]
                answer: "pleased"
                feedback:
                  sad: "Lots of people are sad about rain, but the story says Rosa loves it."
              - id: l2-n4
                type: true_false
                text: "Is it true? When a story is different from your life, what the story says still counts."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Dev packed his swimming costume and his goggles.\n\nWhere is Dev going?"
                say: "Dev packed his swimming costume and his goggles. Where is Dev going?"
                options: ["to the swimming pool", "to bed", "to the library"]
                answer: "to the swimming pool"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Ivy fell over. Her best friend helped her up and gave her a hug.\n\nWhich is the best link?"
            say: "Ivy fell over. Her best friend helped her up and gave her a hug. Which is the best link?"
            options: ["My friend helped me when I hurt my knee.", "I have a friend called Ivy.", "I have a red jumper."]
            answer: "My friend helped me when I hurt my knee."
          - id: l2-c2
            type: image_multiple_choice
            text: "Ali's team lost the match. He walked home slowly and did not talk.\n\nHow does Ali feel?"
            say: "Ali's team lost the match. He walked home slowly and did not talk. How does Ali feel?"
            options: [{ object: sad }, { object: happy }, { object: scared }]
            answer: sad
          - id: l2-c3
            type: multiple_choice
            text: "Ben made a snowman in the garden. The next day the sun came out and it was warm.\n\nWhat happened to the snowman?"
            say: "Ben made a snowman in the garden. The next day the sun came out and it was warm. What happened to the snowman?"
            options: ["It melted.", "It grew bigger.", "It turned to ice."]
            answer: "It melted."
          - id: l2-c4
            type: multiple_choice
            text: "Nell does not like loud noises. The fireworks went BANG!\n\nHow did Nell feel?"
            say: "Nell does not like loud noises. The fireworks went bang! How did Nell feel?"
            options: ["scared", "excited", "sleepy"]
            answer: "scared"
          - id: l2-c5
            type: true_false
            text: "Is it true? 'My coat is blue like Ben's coat' tells you how Ben feels."
            answer: false
