# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.ask-questions
skill: lit-en.speaking.ask-questions
curriculum: en-GB
language: en
title:
  de: Passende Fragen stellen
  en: Asking good questions
summary: >
  A good question is about what you just heard and helps you find out
  more. Lesson 1 takes the question words (who, what, where, when, why)
  and picks the question that finds out a given thing. Lesson 2 listens to
  a friend, a teacher or a short story and chooses questions that fit,
  setting them against questions that wander off the topic; it ends with
  the skill check. Asking aloud is practised with speaking tasks and is
  not marked.
metadata:
  year: year-1
  topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.speaking.listen-respond]
  also_practises: []
  vocabulary: { en: [question, who, what, where, when, why, how, find out, on the topic] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: question-words, what: { de: "das Fragewort für das wählen, was man wissen will", en: choosing the question word for what you want to find out } }
    - { id: on-topic, what: { de: "eine Frage zu dem wählen, was gerade gesagt wurde", en: choosing a question about what was just said } }
    - { id: something-new, what: { de: "eine Frage wählen, die etwas Neues herausfindet", en: choosing a question that finds out something new } }
    - { id: story, what: { de: "eine Frage wählen, die hilft, eine Geschichte besser zu verstehen", en: choosing a question that helps you understand a story } }
  misconceptions:
    - id: off-topic
      what: Asks about something else that is on their mind, not about what was just said
      addressed: Learn screens 1 and 2 in lesson 2; l2-f1 feedback on the off-topic question; l2-f3, l2-s3, l2-n3 and l2-c3
    - id: question-word-mixed
      what: Uses the wrong question word (where for a time, who for a place)
      addressed: Learn in lesson 1; l1-f1 feedback on where; l1-f4, l1-s4 and l2-c1
    - id: already-answered
      what: Asks something the speaker has already said
      addressed: Learn screen 3 in lesson 2; l2-f2, l2-s2 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Fragewörter", en: "Question words" }
    goal:
      de: "Frag mit wer, was, wo, wann und warum, um mehr herauszufinden."
      en: "Ask with who, what, where, when and why to find out more."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Miss Shah says: \"Please put your book in your bag.\"\n\nWhat does Miss Shah want you to do?"
            audio: { en: "Please put your book in your bag.", speaker: female }
            options: ["put the book in the bag", "read the book", "take the bag home"]
            answer: "put the book in the bag"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? When a friend talks to you, you look at them and listen."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Who?  What?  Where?  When?  Why?"
            say: "Look at these little words. What do you think: what do they all help us do? Have a guess."
          - text: "Who?  What?  Where?  When?  Why?"
            say: "They help us ask questions! These are question words. We use them to find out more. Who asks about a person. What asks about a thing. Where asks about a place."
          - text: "When is the party?\nWhy are you sad?"
            say: "When asks about a time. Why asks for a reason. Choose the question word for the thing you want to find out."
          - text: "I got a new pet!\nWhat is it called?"
            say: "Zac says: I got a new pet! You want to know more, so you ask: What is it called? Or: What kind of pet is it?"
          - text: "Did you know? Scientists asked: why do zebras have stripes?"
            say: "Did you know? For a very long time, scientists asked: why do zebras have stripes? Now many of them think the stripes help keep biting flies away. Flies find it hard to land on stripes!"
            show: { object: zebra }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "You want to know the time of the party. Which question do you ask?"
                options: ["When is the party?", "Where is the party?", "Who is at the party?"]
                answer: "When is the party?"
                feedback:
                  "Where is the party?": "Where asks about a place. For a time, use when."
                hints:
                  - "You want to find out a time."
                  - "Which question word is about time?"
                  - "When is the party?"
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "You want to know the name of a person. Which word fits?"
                say: "You want to know the name of a person. Which question word fits?"
                frame: "_ is your teacher?"
                options: ["Who", "Where", "When"]
                answer: ["Who"]
                hints:
                  - "You are asking about a person."
                  - "This question word is for people."
                  - "Who."
              - id: l1-f3
                type: matching
                text: "Match each question word to what it asks about."
                pairs:
                  - { left: { text: "Who?" }, right: { text: "a person" } }
                  - { left: { text: "Where?" }, right: { text: "a place" } }
                  - { left: { text: "When?" }, right: { text: "a time" } }
                hints:
                  - "Think of a question with each word."
                  - "Who is that? Where is it? When is it?"
                  - "Who: a person. Where: a place. When: a time."
              - id: l1-f4
                type: multiple_choice
                text: "You want to know the reason Ben is crying. Which question do you ask?"
                options: ["Why are you crying?", "Where are you crying?", "Who is crying?"]
                answer: "Why are you crying?"
                hints:
                  - "You want a reason."
                  - "Which question word asks for a reason?"
                  - "Why are you crying?"
              - id: l1-f5
                type: speak
                text: "Your friend says: \"I went on holiday.\"\n\nAsk a question to find out more."
                say: "Your friend says: I went on holiday. Ask a question to find out more. Then listen to one idea."
                expected_text: "Where did you go?"
                hints:
                  - "Start with a question word."
                  - "You could ask where, or what they did."
                  - "You could say: Where did you go?"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "You cannot find your coat. Which question do you ask?"
                options: ["Where is my coat?", "When is my coat?", "Why is my coat?"]
                answer: "Where is my coat?"
                hints: ["You want a place."]
              - id: l1-s2
                type: fill_in_blank
                text: "You want to know which food your friend had. Which word fits?"
                say: "You want to know which food your friend had. Which question word fits?"
                frame: "_ did you have for lunch?"
                options: ["What", "Who", "Where"]
                answer: ["What"]
                hints: ["You are asking about a thing."]
              - id: l1-s3
                type: true_false
                text: "Is it true? \"Who is your best friend?\" asks about a person."
                answer: true
                hints: ["What does who ask about?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which question asks about a time?"
                options: ["When does school start?", "Where is the school?", "Who is at school?"]
                answer: "When does school start?"
                hints: ["Look for the time question word."]
              - id: l1-s5
                type: speak
                text: "Your friend says: \"I made something at the weekend.\"\n\nAsk a question to find out more."
                say: "Your friend says: I made something at the weekend. Ask a question to find out more. Then listen to one idea."
                expected_text: "What did you make?"
                hints: ["You could start with what."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The cat is hiding. You want to find it. Which question do you ask?"
                show: { object: cat }
                options: ["Where is the cat?", "When is the cat?", "Who is the cat?"]
                answer: "Where is the cat?"
              - id: l1-n2
                type: fill_in_blank
                text: "You want to know which person the cake is for. Which word fits?"
                say: "You want to know which person the cake is for. Which question word fits?"
                frame: "_ is the cake for?"
                options: ["Who", "When", "Where"]
                answer: ["Who"]
              - id: l1-n3
                type: true_false
                text: "Is it true? \"Where is the swimming pool?\" asks about a time."
                answer: false
              - id: l1-n4
                type: matching
                text: "Match each question word to what it asks about."
                pairs:
                  - { left: { text: "What?" }, right: { text: "a thing" } }
                  - { left: { text: "Why?" }, right: { text: "a reason" } }
                  - { left: { text: "Who?" }, right: { text: "a person" } }
              - id: l1-n5
                type: multiple_choice
                text: "You want to know the reason the bus is late. Which question do you ask?"
                options: ["Why is the bus late?", "Who is the bus?", "Where is the bus late?"]
                answer: "Why is the bus late?"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "You want to know the day of your friend's birthday. Which word fits?"
            say: "You want to know the day of your friend's birthday. Which question word fits?"
            frame: "_ is your birthday?"
            options: ["When", "Who", "Where"]
            answer: ["When"]
          - id: l1-c2
            type: multiple_choice
            text: "Which question asks about a place?"
            options: ["Where do you live?", "When do you live?", "Why do you live?"]
            answer: "Where do you live?"
          - id: l1-c3
            type: true_false
            text: "Is it true? \"Why are you laughing?\" asks for a reason."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "You want to know the person who drew this picture. Which question do you ask?"
            options: ["Who drew this picture?", "When did you draw it?", "Where is the picture?"]
            answer: "Who drew this picture?"
          - id: l1-c5
            type: fill_in_blank
            text: "You want to know which toy your friend likes best. Which word fits?"
            say: "You want to know which toy your friend likes best. Which question word fits?"
            frame: "_ is your best toy?"
            options: ["When", "What", "Who"]
            answer: ["What"]
          - id: l1-c6
            type: true_false
            text: "Is it true? \"Who is your teacher?\" asks about a place."
            answer: false

  - n: 2
    title: { de: "Fragen, die passen", en: "Questions that fit" }
    goal:
      de: "Hör bis zum Ende zu und stell dann eine Frage, die passt und etwas Neues herausfindet."
      en: "Listen right to the end, then ask a question that fits and finds out something new."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "You want to know the place. Which word fits?"
            say: "You want to know the place. Which question word fits?"
            frame: "_ is the playground?"
            options: ["Where", "Who", "When"]
            answer: ["Where"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which question asks about a person?"
            options: ["Who made this?", "When is lunch?", "Where is the hall?"]
            answer: "Who made this?"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "\"I saw a fox in my garden.\"\n\nWhat colour was it?\nCan I have a sweet?"
            say: "Priya says: I saw a fox in my garden. What do you think: which is a good question to ask her? What colour was it? Or: Can I have a sweet? Have a guess."
            show: { object: fox }
          - text: "\"I saw a fox in my garden.\"\n\nWhat colour was it?   ✓\nCan I have a sweet?   ✗"
            say: "Priya says: I saw a fox in my garden. A good question is about the fox. What colour was it? Can I have a sweet? That is not about the fox. It is off the topic."
            show: { object: fox }
          - text: "\"My brother is called Joe. He is four.\"\n\nHow old is he?   ✗"
            say: "Listen carefully first. Priya already said Joe is four. So asking how old he is does not find out anything new. Ask about something she did not say: What does Joe like to play?"
          - text: "Listen. Think. Ask."
            say: "Listen to the end. Think about what you want to know. Then ask a question about it."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tom says: \"I went to the zoo on Saturday.\"\n\nWhich question fits?"
                audio: { en: "I went to the zoo on Saturday.", speaker: male }
                options: ["Which animals did you see?", "Do you like my shoes?", "What is for lunch?"]
                answer: "Which animals did you see?"
                feedback:
                  "Do you like my shoes?": "That is not about the zoo. Ask about what Tom told you."
                hints:
                  - "Tom told you about the zoo."
                  - "The question should be about his trip."
                  - "Which animals did you see?"
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Amara says: \"I have a new puppy. She is brown.\"\n\nWhich question finds out something new?"
                audio: { en: "I have a new puppy. She is brown.", speaker: female }
                options: ["What is her name?", "What colour is she?", "Do you have a puppy?"]
                answer: "What is her name?"
                hints:
                  - "What did Amara already tell you?"
                  - "She said the puppy is brown."
                  - "What is her name?"
              - id: l2-f3
                type: sorting
                text: "Mr Lee says: \"Today we are going to plant seeds.\"\n\nOn the topic or not?"
                say: "Mr Lee says: Today we are going to plant seeds. Sort the questions. Are they about planting seeds, or not?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "on the topic" }, say: "On the topic." }
                  - { id: no, show: { text: "off the topic" }, say: "Off the topic." }
                options:
                  - { text: "What seeds are we planting?", bin: yes }
                  - { text: "Can we go to the park?", bin: no }
                  - { text: "How much water do they need?", bin: yes }
                  - { text: "Is it my birthday soon?", bin: no }
                hints:
                  - "For each question, ask: is it about seeds?"
                  - "The park and a birthday are not about seeds."
                  - "Seeds and water are on the topic."
              - id: l2-f4
                type: multiple_choice
                text: "Story: Bella the hen lost her egg. She looked in the barn.\n\nWhich question helps you understand more?"
                say: "Listen. Bella the hen lost her egg. She looked in the barn. Which question helps you understand more?"
                options: ["Did she find her egg?", "Do hens like pizza?", "What is a barn made of?"]
                answer: "Did she find her egg?"
                feedback:
                  "Do hens like pizza?": "A hen with a pizza would be funny! But the story is about the lost egg. What do you want to know about that?"
                hints:
                  - "What do you want to know about the story?"
                  - "The story is about a lost egg."
                  - "Did she find her egg?"
              - id: l2-f5
                type: speak
                text: "Your teacher says: \"Tomorrow we are going on a trip.\"\n\nAsk a good question."
                say: "Your teacher says: Tomorrow we are going on a trip. Ask a good question. Then listen to one idea."
                expected_text: "Where are we going?"
                hints:
                  - "Ask about the trip."
                  - "You could ask where, or what to bring."
                  - "You could say: Where are we going?"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Leo says: \"I was in a football match yesterday.\"\n\nWhich question fits?"
                audio: { en: "I was in a football match yesterday.", speaker: male }
                options: ["Did your team win?", "Is it raining?", "Can I have your pencil?"]
                answer: "Did your team win?"
                hints: ["Leo told you about football."]
              - id: l2-s2
                type: audio_choice
                text: "Grace says: \"I went to see my gran. She lives by the sea.\"\n\nWhich question finds out something new?"
                audio: { en: "I went to see my gran. She lives by the sea.", speaker: female }
                options: ["What did you do there?", "Where does your gran live?", "Did you see your gran?"]
                answer: "What did you do there?"
                hints: ["Grace already said where her gran lives."]
              - id: l2-s3
                type: sorting
                text: "Ava says: \"I can ride my bike now.\"\n\nOn the topic or not?"
                say: "Ava says: I can ride my bike now. Sort the questions. Are they about her bike, or not?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "on the topic" }, say: "On the topic." }
                  - { id: no, show: { text: "off the topic" }, say: "Off the topic." }
                options:
                  - { text: "Who taught you?", bin: yes }
                  - { text: "What colour is your bike?", bin: yes }
                  - { text: "Do you like apples?", bin: no }
                  - { text: "Where is my rubber?", bin: no }
                hints: ["Is the question about the bike?"]
              - id: l2-s4
                type: multiple_choice
                text: "Story: Max the dog dug a big hole. Then he looked very happy.\n\nWhich question helps you understand more?"
                say: "Listen. Max the dog dug a big hole. Then he looked very happy. Which question helps you understand more?"
                options: ["What did he find in the hole?", "What is a dog?", "Do you have a cat?"]
                answer: "What did he find in the hole?"
                hints: ["Why might Max be so happy?"]
              - id: l2-s5
                type: speak
                text: "Your friend says: \"I lost my tooth last night!\"\n\nAsk a good question."
                say: "Your friend says: I lost my tooth last night! Ask a good question. Then listen to one idea."
                expected_text: "Did the tooth fairy come?"
                hints: ["Ask about the tooth."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Kemi says: \"I am learning to swim.\"\n\nWhich question fits?"
                audio: { en: "I am learning to swim.", speaker: female }
                options: ["Where do you go swimming?", "What is your cat called?", "Is it lunchtime?"]
                answer: "Where do you go swimming?"
              - id: l2-n2
                type: audio_choice
                text: "Jack says: \"I made a cake with my dad. It was chocolate.\"\n\nWhich question finds out something new?"
                audio: { en: "I made a cake with my dad. It was chocolate.", speaker: male }
                options: ["Did you eat it all?", "What kind of cake was it?", "Who made the cake?"]
                answer: "Did you eat it all?"
              - id: l2-n3
                type: sorting
                text: "Miss Bell says: \"We are going to read a book about space.\"\n\nOn the topic or not?"
                say: "Miss Bell says: We are going to read a book about space. Sort the questions. Are they about space, or not?"
                option_audio: false
                bins:
                  - { id: yes, show: { text: "on the topic" }, say: "On the topic." }
                  - { id: no, show: { text: "off the topic" }, say: "Off the topic." }
                options:
                  - { text: "Is the moon in the book?", bin: yes }
                  - { text: "Can we have a snack?", bin: no }
                  - { text: "How far away are the stars?", bin: yes }
                  - { text: "Where is my water bottle?", bin: no }
              - id: l2-n4
                type: multiple_choice
                text: "Story: A little boat sailed out to sea. A storm began.\n\nWhich question helps you understand more?"
                say: "Listen. A little boat sailed out to sea. A storm began. Which question helps you understand more?"
                options: ["Was the boat safe?", "What is your favourite colour?", "Do you like cake?"]
                answer: "Was the boat safe?"
              - id: l2-n5
                type: speak
                text: "Your friend says: \"We got a new car.\"\n\nAsk a good question."
                say: "Your friend says: We got a new car. Ask a good question. Then listen to one idea."
                expected_text: "What colour is it?"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: question-words
            type: multiple_choice
            text: "You want to know the time the film starts. Which question do you ask?"
            options: ["When does the film start?", "Where is the film?", "Who is in the film?"]
            answer: "When does the film start?"
          - id: l2-c2
            part: on-topic
            type: audio_choice
            text: "Ruby says: \"I am going to a birthday party today.\"\n\nWhich question fits?"
            audio: { en: "I am going to a birthday party today.", speaker: female }
            options: ["Whose party is it?", "Can I borrow a pencil?", "Do you like rain?"]
            answer: "Whose party is it?"
          - id: l2-c3
            part: on-topic
            type: sorting
            text: "Dev says: \"I went fishing with my uncle.\"\n\nOn the topic or not?"
            say: "Dev says: I went fishing with my uncle. Sort the questions. Are they about fishing, or not?"
            option_audio: false
            bins:
              - { id: yes, show: { text: "on the topic" }, say: "On the topic." }
              - { id: no, show: { text: "off the topic" }, say: "Off the topic." }
            options:
              - { text: "Did you catch a fish?", bin: yes }
              - { text: "Where did you go fishing?", bin: yes }
              - { text: "Is it PE today?", bin: no }
              - { text: "Do you like my hat?", bin: no }
          - id: l2-c4
            part: something-new
            type: audio_choice
            text: "Sam says: \"I have a pet snake. He is green.\"\n\nWhich question finds out something new?"
            audio: { en: "I have a pet snake. He is green.", speaker: male }
            options: ["What does he eat?", "What colour is he?", "Do you have a snake?"]
            answer: "What does he eat?"
          - id: l2-c5
            part: story
            type: multiple_choice
            text: "Story: Rosie found a key in the sand.\n\nWhich question helps you understand more?"
            say: "Listen. Rosie found a key in the sand. Which question helps you understand more?"
            options: ["What does the key open?", "What is your name?", "Is it lunchtime?"]
            answer: "What does the key open?"
          - id: l2-c6
            part: question-words
            type: fill_in_blank
            text: "You want to know the reason your friend is late. Which word fits?"
            say: "You want to know the reason your friend is late. Which question word fits?"
            frame: "_ are you late?"
            options: ["Who", "Why", "Where"]
            answer: ["Why"]
          - id: l2-c7
            part: question-words
            type: matching
            text: "Match each question to what it finds out."
            pairs:
              - { left: { text: "Where is my hat?" }, right: { text: "a place" } }
              - { left: { text: "Who is at the door?" }, right: { text: "a person" } }
              - { left: { text: "When is lunch?" }, right: { text: "a time" } }
          - id: l2-c8
            part: question-words
            type: true_false
            text: "Is it true? \"When is your swimming lesson?\" asks about a place."
            answer: false
          - id: l2-c9
            part: question-words
            type: multiple_choice
            text: "You want to know the thing that is in the box. Which question do you ask?"
            options: ["Who is in the box?", "What is in the box?", "When is the box?"]
            answer: "What is in the box?"
          - id: l2-c10
            part: on-topic
            type: audio_choice
            text: "Ella says: \"We had a picnic in the park.\"\n\nWhich question fits?"
            audio: { en: "We had a picnic in the park.", speaker: female }
            options: ["Is it my turn?", "What did you eat?", "Where is my bag?"]
            answer: "What did you eat?"
          - id: l2-c11
            part: on-topic
            type: true_false
            text: "Finn says: \"I built a sandcastle at the beach.\"\n\nIs it true? \"Do you like carrots?\" is a good question to ask Finn."
            say: "Finn says: I built a sandcastle at the beach. Is it true? Do you like carrots? is a good question to ask Finn."
            answer: false
          - id: l2-c12
            part: on-topic
            type: multiple_choice
            text: "Mrs Khan says: \"After lunch we will paint pictures.\"\n\nWhich question is on the topic?"
            say: "Mrs Khan says: After lunch we will paint pictures. Which question is on the topic?"
            options: ["Can I sit by the window?", "Is it raining?", "What will we paint?"]
            answer: "What will we paint?"
          - id: l2-c13
            part: something-new
            type: audio_choice
            text: "Noah says: \"I went to the farm. I fed the lambs.\"\n\nWhich question finds out something new?"
            audio: { en: "I went to the farm. I fed the lambs.", speaker: male }
            options: ["Did you go to the farm?", "Did you see any pigs?", "What did you feed?"]
            answer: "Did you see any pigs?"
          - id: l2-c14
            part: something-new
            type: true_false
            text: "Lily says: \"My cat is called Pip. She is black.\"\n\nIs it true? \"What is your cat called?\" finds out something new."
            say: "Lily says: My cat is called Pip. She is black. Is it true? What is your cat called? finds out something new."
            answer: false
          - id: l2-c15
