            say: "Read the sentence. Which word makes sense in the gap?"
            frame: "The rabbit hops on the _."
            options: ["grass", "glass", "gas"]
            answer: ["grass"]
            option_audio: false
          - id: l2-c3
            part: spot
            type: true_false
            text: "Does it make sense? \"The sun swims in the sky.\""
            say: "Read the sentence. Does it make sense?"
            answer: false
          - id: l2-c4
            part: go-back
            type: multiple_choice
            text: "The book says: The bat hung in the tree.\nPip read: The bat hung in the three.\n\nWhich word should Pip go back to?"
            say: "Look at what the book says, and what Pip read. Which word should Pip go back to?"
