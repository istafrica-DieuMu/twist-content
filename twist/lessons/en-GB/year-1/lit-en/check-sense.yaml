# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.check-sense
skill: lit-en.comprehension.check-sense
curriculum: en-GB
language: en
title:
  de: Prüfen, ob es Sinn ergibt
  en: Does it make sense?
summary: >
  Good readers check that what they read makes sense. Lesson 1 spots the
  word that does not make sense in a sentence and picks the word that
  does, from words that look alike (lunch, lamp, bunch). Lesson 2 follows
  Pip, a reader who makes slips: stop, go back to the start of the
  sentence, look at the word again; and check two things, that it makes
  sense and that it matches the letters (road for hill makes sense but is
  still wrong). Lesson 2 ends with the skill check.
metadata:
  year: year-1
  topic: { de: "Geschichten verstehen", en: "Understanding stories" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.word-reading.decodable-books]
  also_practises: []
  vocabulary: { en: [make sense, go back, read again, sentence, word, letters] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: spot, what: { de: "merken, wenn ein Satz keinen Sinn ergibt", en: noticing when a sentence does not make sense } }
    - { id: fix, what: { de: "das Wort wählen, das Sinn ergibt", en: choosing the word that makes sense } }
    - { id: go-back, what: { de: zurückgehen und das falsche Wort finden, en: going back to find the word read wrong } }
    - { id: letters, what: { de: "prüfen, ob das Wort auch zu den Buchstaben passt", en: checking that the word also matches the letters } }
  misconceptions:
    - id: reads-on
      what: Keeps reading when a sentence makes no sense instead of stopping to fix it
      addressed: "Lesson 1 Learn; the odd-word tasks l1-f1, l1-f4, l1-s1, l1-n1, l1-n5, l1-c1 and l2-n5; l2-f2 and l2-n4 ask what to do"
    - id: sense-not-letters
      what: Swaps in a word that makes sense but does not match the letters (road for hill) and thinks it is right
      addressed: "Learn screen 3 of lesson 2; l2-f3, l2-s5 and l2-c5 give a slip that makes sense; hints on l2-f3 compare the first letters"
    - id: look-alike-word
      what: Reads a word that looks like the right one (map for mat) and does not check the meaning
      addressed: "gap tasks with look-alike chips l1-f2, l1-s2, l1-s5, l1-n3, l1-c2, l2-f4, l2-s3, l2-n2 and l2-c2"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ergibt das Sinn?", en: "Does it make sense?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the sentence. Tap the picture."
            say: "Read the sentence yourself. Then tap the picture."
            show: { drawn: letter-card, text: "The cat is on the bed." }
            options: [{ object: cat }, { object: dog }, { object: fish }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Read the sentence. Tap the picture."
            say: "Read the sentence yourself. Then tap the picture."
            show: { drawn: letter-card, text: "I can see a big fox." }
            options: [{ object: fox }, { object: frog }, { object: box }]
            answer: fox
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The fish swims in the pond."
            say: "I read: The fish swims in the pond. That makes sense. I can picture it in my head."
            show: { object: fish }
          - text: "The fish sings in the pond."
            say: "Now I read: The fish sings in the pond. I stop. Fish do not sing! That does not make sense, so I must have read a word wrong."
          - text: "Stop. Go back. Look again."
            say: "When it does not make sense, stop. Go back to the start of the sentence. Look at the tricky word again, sound it out, and read the sentence once more."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. Tap the word that does not make sense."
                show: { drawn: letter-card, text: "The cat drinks a bus." }
                spans: ["bus"]
                hints:
                  - "Read the sentence. Can you picture it?"
                  - "What do cats drink? Can a cat drink a bus?"
                  - "Bus."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which word makes sense?"
                say: "Read the sentence. Which word makes sense in the gap?"
                frame: "We had fish and chips for _."
                options: ["lunch", "lamp", "bunch"]
                answer: ["lunch"]
                option_audio: false
                hints:
                  - "Read the whole sentence with each word."
                  - "Fish and chips are food. When do you eat?"
                  - "Lunch."
              - id: l1-f3
                type: true_false
                text: "Does it make sense? \"The moon shines at night.\""
                say: "Read the sentence. Does it make sense?"
                answer: true
                hints:
                  - "Try to picture it."
                  - "Can you see the moon at night?"
                  - "Yes, it makes sense."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. Tap the word that does not make sense."
                show: { drawn: letter-card, text: "Mum cut the bread with a sock." }
                spans: ["sock"]
                hints:
                  - "What do you cut bread with?"
                  - "A sock goes on your foot."
                  - "Sock."
              - id: l1-f5
                type: multiple_choice
                text: "Which sentence makes sense?"
                options: ["The bird sat in the nest.", "The nest sat in the bird.", "The bird sat in the jam."]
                answer: "The bird sat in the nest."
                hints:
                  - "Picture each one."
                  - "Where does a bird sit?"
                  - "The bird sat in the nest."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. Tap the word that does not make sense."
                show: { drawn: letter-card, text: "I brush my teeth with a fork." }
                spans: ["fork"]
                hints: ["What do you brush your teeth with?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Which word makes sense?"
                say: "Read the sentence. Which word makes sense in the gap?"
                frame: "I ride my _ to the park."
                options: ["bike", "bake", "kite"]
                answer: ["bike"]
                option_audio: false
                hints: ["Which one can you ride?"]
              - id: l1-s3
                type: true_false
                text: "Does it make sense? \"The cow jumps into the cup.\""
                say: "Read the sentence. Does it make sense?"
                answer: false
                hints: ["Is a cow small enough to fit in a cup?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which sentence makes sense?"
                options: ["We sleep in a bed.", "We sleep in a jug.", "We sleep in a bun."]
                answer: "We sleep in a bed."
                hints: ["Where do you sleep at night?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Which word makes sense?"
                say: "Read the sentence. Which word makes sense in the gap?"
                frame: "The fish swims in the _."
                options: ["pond", "pop", "pod"]
                answer: ["pond"]
                option_audio: false
                hints: ["Fish swim in water."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. Tap the word that does not make sense."
                show: { drawn: letter-card, text: "The baby drinks milk from a shoe." }
                spans: ["shoe"]
              - id: l1-n2
                type: true_false
                text: "Does it make sense? \"Dad puts jam on his toast.\""
                say: "Read the sentence. Does it make sense?"
                answer: true
              - id: l1-n3
                type: fill_in_blank
                text: "Which word makes sense?"
                say: "Read the sentence. Which word makes sense in the gap?"
                frame: "It is cold, so I put on my _."
                options: ["coat", "cot", "goat"]
                answer: ["coat"]
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Which sentence makes sense?"
                options: ["The snail is slow.", "The snail is a bus.", "The slow is a snail."]
                answer: "The snail is slow."
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. Tap the word that does not make sense."
                show: { drawn: letter-card, text: "At night I get into my sink and go to sleep." }
                spans: ["sink"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. Tap the word that does not make sense."
            show: { drawn: letter-card, text: "The duck swims on the moon." }
            spans: ["moon"]
          - id: l1-c2
            type: fill_in_blank
            text: "Which word makes sense?"
            say: "Read the sentence. Which word makes sense in the gap?"
            frame: "I drink my juice from a _."
            options: ["cup", "cap", "cub"]
            answer: ["cup"]
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Does it make sense? \"The rabbit ate a carrot.\""
            say: "Read the sentence. Does it make sense?"
            answer: true
          - id: l1-c4
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. Tap the word that does not make sense."
            show: { drawn: letter-card, text: "I put my socks on my ears." }
            spans: ["ears"]
          - id: l1-c5
            type: fill_in_blank
            text: "Which word makes sense?"
            say: "Read the sentence. Which word makes sense in the gap?"
            frame: "We sat on the sand at the _."
            options: ["peach", "beach", "bean"]
            answer: ["beach"]
            option_audio: false
          - id: l1-c6
            type: multiple_choice
            text: "Which sentence makes sense?"
            options: ["The car has big legs.", "The big has a car.", "The car has big wheels."]
            answer: "The car has big wheels."

  - n: 2
    title: { de: "Zurückgehen und verbessern", en: "Go back and fix it" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. Tap the word that does not make sense."
            show: { drawn: letter-card, text: "The dog sleeps in a cake." }
            spans: ["cake"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Does it make sense? \"The sun is cold and wet.\""
            say: "Read the sentence. Does it make sense?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Pip read: The dog ran up the hat."
            say: "This is Pip. Pip read: The dog ran up the hat. Hat? A dog cannot run up a hat. That does not make sense, so Pip stops."
          - text: "The dog ran up the hill."
            say: "Pip goes back to the start of the sentence and sounds out the last word again. Hill! The dog ran up the hill. Now it makes sense."
          - text: "Does it make sense?\nDo the letters match?"
            say: "Check two things. Does it make sense? And do the letters match the word you said? If Pip says road for hill, it makes sense, but road starts with r and hill starts with h. So it is still wrong."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The book says: The pig is in the mud.\nPip read: The pig is in the mug.\n\nWhich word should Pip go back to?"
                say: "Look at what the book says, and what Pip read. Which word should Pip go back to?"
                options: ["mug", "pig", "in"]
                answer: "mug"
                option_audio: false
                hints:
                  - "Which part of Pip's sentence does not make sense?"
                  - "A pig cannot fit in a mug. Look at the last word."
                  - "Mug. The word is mud."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Pip read: The pig is in the mug. What should Pip do?"
                options: ["Stop, go back and look at the word again.", "Keep reading and do not worry.", "Turn the page."]
                answer: "Stop, go back and look at the word again."
                feedback:
                  Keep reading and do not worry.: "If it does not make sense, the rest of the story will not make sense either."
                hints:
                  - "Does Pip's sentence make sense?"
                  - "When it does not make sense, good readers stop."
                  - "Stop, go back and look at the word again."
              - id: l2-f3
                type: true_false
                text: "The book says: The dog ran up the hill.\nPip read: The dog ran up the road.\n\nIs it true? Pip read every word right."
                say: "Look at what the book says, and what Pip read. Is it true? Pip read every word right."
                answer: false
                hints:
                  - "It makes sense. Now check the letters."
                  - "Hill starts with h. Road starts with r."
                  - "No. The word is hill."
              - id: l2-f4
                type: fill_in_blank
                text: "The book says: The cat is on the mat.\nPip read: The cat is on the map.\n\nFix it: The cat is on the _."
                say: "Look at what the book says, and what Pip read. Help Pip fix the sentence."
                frame: "The cat is on the _."
                options: ["mat", "map", "man"]
                answer: ["mat"]
                option_audio: false
                hints:
                  - "Look at the last letter of the word in the book."
                  - "Map ends with p. The book's word ends with t."
                  - "Mat."
              - id: l2-f5
                type: multiple_choice
                text: "Which reader should go back and fix a word?"
                options: ["Bea read: The sun is hat.", "Ali read: The sun is hot.", "Cal read: The sun is up."]
                answer: "Bea read: The sun is hat."
                hints:
                  - "Which sentence does not make sense?"
                  - "Can the sun be a hat?"
                  - "Bea. The word is hot."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The book says: The hen sat on the eggs.\nPip read: The hen sat on the legs.\n\nWhich word should Pip go back to?"
                say: "Look at what the book says, and what Pip read. Which word should Pip go back to?"
                options: ["legs", "hen", "sat"]
                answer: "legs"
                option_audio: false
                hints: ["What does a hen sit on?"]
              - id: l2-s2
                type: true_false
                text: "The book says: The bird is in the nest.\nPip read: The bird is in the nest.\n\nIs it true? Pip must go back and fix a word."
                say: "Look at what the book says, and what Pip read. Is it true? Pip must go back and fix a word."
                answer: false
                hints: ["Compare the two sentences word by word."]
              - id: l2-s3
                type: fill_in_blank
                text: "The book says: I like jam on my toast.\nPip read: I like jam on my toes.\n\nFix it: I like jam on my _."
                say: "Look at what the book says, and what Pip read. Help Pip fix the sentence."
                frame: "I like jam on my _."
                options: ["toast", "toes", "tops"]
                answer: ["toast"]
                option_audio: false
                hints: ["Do you put jam on your toes?"]
              - id: l2-s4
                type: true_false
                text: "The book says: The duck can swim.\nPip read: The duck can sing.\n\nIs it true? Pip should stop and go back."
                say: "Look at what the book says, and what Pip read. Is it true? Pip should stop and go back."
                answer: true
                hints: ["Can a duck sing? Do the letters match?"]
              - id: l2-s5
                type: multiple_choice
                text: "The book says: Dad got wet in the rain.\nPip read: Dad got wet in the bath.\n\nWhat is wrong?"
                say: "Look at what the book says, and what Pip read. What is wrong?"
                options: ["It makes sense, but the letters do not match.", "It does not make sense.", "Nothing. Pip read it right."]
                answer: "It makes sense, but the letters do not match."
                hints: ["You can get wet in a bath. Now look at the letters."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The book says: The frog sat on a log.\nPip read: The frog sat on a leg.\n\nWhich word should Pip go back to?"
                say: "Look at what the book says, and what Pip read. Which word should Pip go back to?"
                options: ["leg", "frog", "sat"]
                answer: "leg"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "The book says: The king has a gold ring.\nPip read: The king has a gold rug.\n\nFix it: The king has a gold _."
                say: "Look at what the book says, and what Pip read. Help Pip fix the sentence."
                frame: "The king has a gold _."
                options: ["ring", "rung", "rug"]
                answer: ["ring"]
                option_audio: false
              - id: l2-n3
                type: true_false
                text: "The book says: The cat had a nap.\nPip read: The cat had a nap.\n\nIs it true? Pip read it right."
                say: "Look at what the book says, and what Pip read. Is it true? Pip read it right."
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "A sentence does not make sense. Where should you go back to?"
                options: ["the start of the sentence", "the start of the book", "nowhere, just keep going"]
                answer: "the start of the sentence"
              - id: l2-n5
                type: highlight_in_text
                text: "Pip read this. Tap the word Pip should go back to."
                say: "Read what Pip read. Tap the word Pip should go back to."
                show: { drawn: letter-card, text: "I dig in the sand with a spade and a bucket of jam." }
                spans: ["jam"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: spot
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. Tap the word that does not make sense."
            show: { drawn: letter-card, text: "The pig sleeps in a cup." }
            spans: ["cup"]
          - id: l2-c2
