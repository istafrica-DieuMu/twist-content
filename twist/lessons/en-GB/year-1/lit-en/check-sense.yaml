          - id: l2-c5
            part: letters
            type: multiple_choice
            text: "The book says: Mum has a red hat.\nPip read: Mum has a red cap.\n\nWhat is wrong?"
            say: "Look at what the book says, and what Pip read. What is wrong?"
            options: ["It makes sense, but the letters do not match.", "It does not make sense.", "Nothing. Pip read it right."]
            answer: "It makes sense, but the letters do not match."
          - id: l2-c6
            part: spot
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. Tap the word that does not make sense."
            show: { drawn: letter-card, text: "My cat likes to drink milk from a bell." }
            spans: ["bell"]
          - id: l2-c7
            part: spot
            type: true_false
            text: "Does it make sense? \"The baby sleeps in a pram.\""
            say: "Read the sentence. Does it make sense?"
            answer: true
          - id: l2-c8
            part: spot
            type: multiple_choice
            text: "Which sentence makes sense?"
            options: ["The woods ran into the fox.", "The fox ran into the woods.", "The fox ran into a cup."]
            answer: "The fox ran into the woods."
          - id: l2-c9
            part: fix
            type: fill_in_blank
            text: "Which word makes sense?"
            say: "Read the sentence. Which word makes sense in the gap?"
            frame: "The dog wags its _."
            options: ["tall", "tail", "tap"]
            answer: ["tail"]
            option_audio: false
          - id: l2-c10
            part: fix
            type: fill_in_blank
            text: "The book says: The fish has a long fin.\nPip read: The fish has a long fan.\n\nFix it: The fish has a long _."
