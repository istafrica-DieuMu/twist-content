# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.longer-words
skill: lit-en.word-reading.longer-words
curriculum: en-GB
language: en
title:
  de: Längere Wörter lesen
  en: Reading longer words
summary: >
  Children read words of two and three syllables made from sounds they
  know, chunk by chunk: find the chunks (each has a vowel sound), read
  each chunk, then blend the chunks into the word. Lesson 1 takes
  two-chunk words with short vowels (rabbit, picnic, kitten) and two small
  words joined (snowman, bedroom); lesson 2 takes chunks with digraphs
  and er (sticker, garden, window) and three-chunk words (jellyfish,
  elephant), and ends with the skill check. Syllable arcs show the chunks
  in Learn. Word options have no speaker, so the child reads them.
metadata:
  year: year-1
  topic: { de: "Wörter lesen", en: "Reading words" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.phonological.syllables, lit-en.phonics.adjacent-consonants]
  also_practises: []
  vocabulary: { en: [chunk, syllable, beat, vowel, blend, word, compound word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card, syllable-arcs, dots]
  facets: []
  parts:
    - { id: two-chunks, what: { de: "Wörter aus zwei Silben mit kurzen Vokalen lesen (rabbit, picnic)", en: "reading two-chunk words with short vowels (rabbit, picnic)" } }
    - { id: compound, what: { de: "zwei zusammengesetzte kleine Wörter lesen (snowman, bedroom)", en: "reading two small words joined (snowman, bedroom)" } }
    - { id: digraph-chunks, what: { de: "Silben mit Buchstabengruppen und er lesen (sticker, garden)", en: "reading chunks with digraphs and er (sticker, garden)" } }
    - { id: three-chunks, what: { de: "Wörter aus drei Silben lesen (jellyfish, elephant)", en: "reading three-chunk words (jellyfish, elephant)" } }
  misconceptions:
    - id: first-chunk-guess
      what: Reads the first chunk and guesses the rest (rab... rabbit or ribbon; rub... rabbit)
      addressed: picture options share a first sound or look alike (rabbit, carrot, ladder; rubber, ruler, rabbit), so only reading every chunk finds the answer; l1-f1 gives feedback on carrot
    - id: chunks-out-of-order
      what: Reads the chunks but blends them in the wrong order (setsun)
      addressed: fill-in tasks offer the swapped word (l1-f3, l1-s3, l1-c3, l2-f3, l2-s5, l2-c4) and ordering tasks build the word from its chunks (l1-f5, l1-n2, l2-n2)
    - id: one-beat-per-word
      what: Thinks a long word is one beat, or counts letters instead of beats
      addressed: Learn draws syllable arcs; l1-f2, l1-s2, l1-n3, l2-f2 and l2-s4 ask how many chunks a word has
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zwei Silben", en: "Two chunks" }
    goal:
      de: "Lies lange Wörter Stück für Stück und setz die Stücke zusammen, so wie rab und bit ergeben rabbit."
      en: "Read long words chunk by chunk, then put the chunks together, like rab and bit make rabbit."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "How many claps?"
            say: "Say banana and clap the beats. How many claps?"
            show: { object: banana }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "frog" }
            options: [{ object: frog }, { object: fox }, { object: fish }]
            answer: frog
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "sunset"
            say: "Here is a long word: sunset. Say it and clap it. How many claps do you think it has?"
            show: { drawn: letter-card, text: "sunset" }
          - text: "sunset"
            say: "Two claps! Long words are made of chunks. Each chunk is one beat and has a vowel sound in it. Sunset has two chunks: sun ... set. Read each chunk, then put them together: sunset."
            show: { drawn: syllable-arcs, word: sunset, syllables: [sun, set] }
          - text: "rabbit"
            say: "Rabbit: rab ... bit. When two letters in the middle are the same, split between them. Rab ... bit. Rabbit."
            show: { drawn: syllable-arcs, word: rabbit, syllables: [rab, bit] }
          - text: "snowman"
            say: "Some long words are two small words joined together: snow and man. Snowman."
            show: { drawn: syllable-arcs, word: snowman, syllables: [snow, man] }
          - text: "Find the chunks. Read each chunk. Blend."
            say: "So, for a long word: find the chunks, read each chunk, then blend them into the word."
          - text: "Did you know? A village in Wales has a name with 58 letters!"
            say: "Did you know? A village in Wales has a name with fifty-eight letters! It is one of the longest place names in the world. People read it the way you do: chunk by chunk."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card, chunk by chunk. Tap its picture."
                show: { drawn: letter-card, text: "rabbit" }
                options: [{ object: rabbit }, { object: carrot }, { object: ladder }]
                answer: rabbit
                option_audio: false
                feedback:
                  carrot: "Carrot starts with c. This word starts with r. Read the first chunk again."
                hints:
                  - "Split the word into two chunks."
                  - "rab ... bit."
                  - "Rabbit."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "picnic\nHow many chunks?"
                say: "Read the word on the screen. How many chunks does it have?"
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Each chunk has a vowel sound. Find the vowels."
                  - "There is an i in pic and an i in nic."
                  - "Pic ... nic. That is 2 chunks."
              - id: l1-f3
                type: fill_in_blank
                text: "Put the chunks together."
                say: "Here are two chunks. Which word do they make?"
                frame: "sun + set = _"
                options: ["sunset", "setsun", "sunsat"]
                answer: ["sunset"]
                option_audio: false
                feedback:
                  setsun: "The chunks are the right ones, but sun comes first."
                hints:
                  - "Keep the chunks in the same order."
                  - "First sun, then set."
                  - "Sunset."
              - id: l1-f4
                type: matching
                text: "Match the chunks to make words."
                say: "Tap a first chunk, then tap the chunk that finishes the word."
                option_audio: false
                pairs:
                  - left: { text: "rab" }
                    right: { text: "bit" }
                  - left: { text: "pic" }
                    right: { text: "nic" }
                  - left: { text: "kit" }
                    right: { text: "ten" }
                hints:
                  - "Read each pair out loud. Does it make a word?"
                  - "Rab and bit make rabbit."
                  - "Rab goes with bit, pic with nic, kit with ten."
              - id: l1-f5
                type: ordering
                text: "Build the word for the picture."
                say: "Put the chunks in order to make the word for the picture."
                show: { object: snowman }
                options: ["man", "snow"]
                slot_count: 2
                answer: ["snow", "man"]
                option_audio: false
                hints:
                  - "Which chunk do you hear first?"
                  - "It is made of two small words."
                  - "Snow, then man."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card, chunk by chunk. Tap its picture."
                show: { drawn: letter-card, text: "snowman" }
                options: [{ object: snowman }, { object: snow }, { object: clown }]
                answer: snowman
                option_audio: false
                hints: ["Two small words joined: snow and man."]
              - id: l1-s2
                type: multiple_choice
                text: "napkin\nHow many chunks?"
                say: "Read the word on the screen. How many chunks does it have?"
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["Find the vowels: nap ... kin."]
              - id: l1-s3
                type: fill_in_blank
                text: "Put the chunks together."
                say: "Here are two chunks. Which word do they make?"
                frame: "car + pet = _"
                options: ["carpet", "petcar", "carpit"]
                answer: ["carpet"]
                option_audio: false
                hints: ["Car comes first, then pet."]
              - id: l1-s4
                type: true_false
                text: "Is it true? Kitten has two chunks: kit and ten."
                answer: true
                hints: ["Read it slowly: kit ... ten."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card, chunk by chunk. Tap its picture."
                show: { drawn: letter-card, text: "jacket" }
                options: [{ object: jacket }, { object: jumper }, { object: dress }]
                answer: jacket
                option_audio: false
                hints: ["jack ... et."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card, chunk by chunk. Tap its picture."
                show: { drawn: letter-card, text: "ladder" }
                options: [{ object: lamp }, { object: ladder }, { object: leg }]
                answer: ladder
                option_audio: false
              - id: l1-n2
                type: ordering
                text: "Build the word for the picture."
                say: "Put the chunks in order to make the word for the picture."
                show: { object: bedroom }
                options: ["room", "bed"]
                slot_count: 2
                answer: ["bed", "room"]
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Is it true? Picnic has three chunks."
                answer: false
              - id: l1-n4
                type: matching
                text: "Match the chunks to make words."
                say: "Tap a first chunk, then tap the chunk that finishes the word."
                option_audio: false
                pairs:
                  - left: { text: "mag" }
                    right: { text: "net" }
                  - left: { text: "lap" }
                    right: { text: "top" }
                  - left: { text: "pup" }
                    right: { text: "pet" }
              - id: l1-n5
                type: multiple_choice
                text: "Tom has a pet rabbit. It hops on the carpet.\nWhere does the rabbit hop?"
                say: "Read the sentences. Where does the rabbit hop?"
                options: ["on the carpet", "on the cart", "on the cap"]
                answer: "on the carpet"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "rubber" }
            options: [{ object: rubber }, { object: ruler }, { object: rabbit }]
            answer: rubber
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "laptop\nHow many chunks?"
            say: "Read the word on the screen. How many chunks does it have?"
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c3
            type: fill_in_blank
            text: "Put the chunks together."
            say: "Here are two chunks. Which word do they make?"
            frame: "kit + ten = _"
            options: ["kitten", "tenkit", "kitton"]
            answer: ["kitten"]
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Is it true? Desktop is made of two small words: desk and top."
            answer: true
          - id: l1-c5
            type: ordering
            text: "Build the word for the picture."
            say: "Put the chunks in order to make the word for the picture."
            show: { object: jacket }
            options: ["et", "jack"]
            slot_count: 2
            answer: ["jack", "et"]
            option_audio: false
          - id: l1-c6
            type: multiple_choice
            text: "Kit put the napkin in the basket.\nWhere did Kit put the napkin?"
            say: "Read the sentence. Where did Kit put the napkin?"
            options: ["in the basket", "in the bucket", "in the bath"]
            answer: "in the basket"
            option_audio: false

  - n: 2
    title: { de: "Längere Silben, drei Silben", en: "Bigger chunks, three chunks" }
    goal:
      de: "Lies längere Wörter mit größeren Stücken und sogar mit drei Stücken, so wie jellyfish."
      en: "Read longer words with bigger chunks, and even three chunks, like jellyfish."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card, chunk by chunk. Tap its picture."
            show: { drawn: letter-card, text: "carrot" }
            options: [{ object: carrot }, { object: rabbit }, { object: crayon }]
            answer: carrot
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "goblin\nHow many chunks?"
            say: "Read the word on the screen. How many chunks does it have?"
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "sticker"
            say: "Here is a long word. Where do you think we split it into two chunks? Have a guess."
            show: { drawn: letter-card, text: "sticker" }
          - text: "sticker"
            say: "Stick ... er! Chunks can have sounds like ck and er in them. Keep those letters together: stick ... er. Sticker."
            show: { drawn: syllable-arcs, word: sticker, syllables: [stick, er] }
          - text: "garden"
            say: "Gar ... den. The a and r stay together in one chunk and say ar. Garden."
            show: { drawn: syllable-arcs, word: garden, syllables: [gar, den] }
          - text: "jellyfish"
            say: "Some words have three chunks: jel ... ly ... fish. Read each one, then blend: jellyfish. Here the y says ee."
            show: { drawn: syllable-arcs, word: jellyfish, syllables: [jel, ly, fish] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card, chunk by chunk. Tap its picture."
                show: { drawn: letter-card, text: "sticker" }
                options: [{ object: sticker }, { object: scissors }, { object: star }]
                answer: sticker
                option_audio: false
                hints:
                  - "Find the two chunks."
                  - "stick ... er."
                  - "Sticker."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "elephant\nHow many chunks?"
                say: "Read the word on the screen. How many chunks does it have?"
                options: ["1", "2", "3"]
                answer: "3"
                feedback:
                  "2": "Clap it again slowly. There is a small chunk in the middle."
                hints:
                  - "Say the word slowly and clap each beat."
                  - "el ... e ... phant."
                  - "3 chunks."
              - id: l2-f3
                type: fill_in_blank
                text: "Put the chunks together."
                say: "Here are two chunks. Which word do they make?"
                frame: "win + dow = _"
                options: ["window", "dowwin", "windew"]
                answer: ["window"]
                option_audio: false
                hints:
                  - "Keep the chunks in order and keep every letter."
                  - "First win, then dow."
                  - "Window."
              - id: l2-f4
                type: true_false
                text: "Is it true? Garden is made of the chunks gar and den."
                answer: true
                hints:
                  - "Read the word slowly."
                  - "gar ... den."
                  - "Yes, gar and den."
              - id: l2-f5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card, chunk by chunk. Tap its picture."
                show: { drawn: letter-card, text: "jellyfish" }
                options: [{ object: jellyfish }, { object: fish }, { object: octopus }]
                answer: jellyfish
                option_audio: false
                feedback:
                  fish: "Fish is only the last chunk. Read all three: jel ... ly ... fish."
                hints:
                  - "This word has three chunks."
                  - "jel ... ly ... fish."
                  - "Jellyfish."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card, chunk by chunk. Tap its picture."
                show: { drawn: letter-card, text: "window" }
                options: [{ object: window }, { object: door }, { object: wind }]
                answer: window
                option_audio: false
                hints: ["win ... dow."]
              - id: l2-s2
                type: matching
                text: "Match the chunks to make words."
                say: "Tap a first chunk, then tap the chunk that finishes the word."
                option_audio: false
                pairs:
                  - left: { text: "kit" }
                    right: { text: "chen" }
                  - left: { text: "gar" }
                    right: { text: "den" }
                  - left: { text: "jack" }
                    right: { text: "et" }
                hints: ["Read each pair aloud. Does it make a word?"]
              - id: l2-s3
                type: multiple_choice
                text: "crocodile\nHow many chunks?"
                say: "Read the word on the screen. How many chunks does it have?"
                options: ["1", "2", "3"]
                answer: "3"
                hints: ["croc ... o ... dile."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Sticker has three chunks."
                answer: false
                hints: ["stick ... er. Count them."]
              - id: l2-s5
                type: fill_in_blank
                text: "Put the chunks together."
                say: "Here are three chunks. Which word do they make?"
                frame: "jel + ly + fish = _"
                options: ["jellyfish", "fishjelly", "jellfish"]
                answer: ["jellyfish"]
                option_audio: false
                hints: ["Keep all three chunks, in order."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card, chunk by chunk. Tap its picture."
                show: { drawn: letter-card, text: "elephant" }
                options: [{ object: giraffe }, { object: elephant }, { object: zebra }]
                answer: elephant
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Build the word for the picture."
                say: "Put the chunks in order to make the word for the picture."
                show: { object: butterfly }
                options: ["fly", "but", "ter"]
                slot_count: 3
                answer: ["but", "ter", "fly"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "kitchen\nHow many chunks?"
                say: "Read the word on the screen. How many chunks does it have?"
                options: ["1", "2", "3"]
                answer: "2"
              - id: l2-n4
                type: true_false
                text: "Is it true? Window has two chunks: win and dow."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "The monkey sat in the garden and ate a carrot.\nWhat did the monkey eat?"
                say: "Read the sentence. What did the monkey eat?"
                options: ["a carrot", "a garden", "a rabbit"]
                answer: "a carrot"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: digraph-chunks
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "crayon" }
            options: [{ object: crocodile }, { object: crayon }, { object: cake }]
            answer: crayon
            option_audio: false
          - id: l2-c2
            part: digraph-chunks
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "jumper" }
            options: [{ object: jacket }, { object: jug }, { object: jumper }]
            answer: jumper
            option_audio: false
          - id: l2-c3
            part: three-chunks
            type: multiple_choice
            text: "hospital\nHow many chunks?"
            say: "Read the word on the screen. How many chunks does it have?"
            options: ["1", "2", "3"]
            answer: "3"
          - id: l2-c4
            part: two-chunks
            type: fill_in_blank
            text: "Put the chunks together."
            say: "Here are two chunks. Which word do they make?"
            frame: "pic + nic = _"
            options: ["picnic", "nicpic", "picnac"]
            answer: ["picnic"]
            option_audio: false
          - id: l2-c5
            part: two-chunks
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "teddy" }
            options: [{ object: telephone }, { object: pony }, { object: teddy }]
            answer: teddy
            option_audio: false
          - id: l2-c6
            part: two-chunks
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "puppy" }
            options: [{ object: pony }, { object: puppy }, { object: pencil }]
            answer: puppy
            option_audio: false
          - id: l2-c7
            part: two-chunks
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "bucket" }
            options: [{ object: bus }, { object: book }, { object: bucket }]
            answer: bucket
            option_audio: false
          - id: l2-c8
            part: two-chunks
            type: multiple_choice
            text: "Max had a muffin and a cup of milk.\nWhat did Max have with his milk?"
            say: "Read the sentence. What did Max have with his milk?"
            options: ["a muffin", "a mitten", "a puffin"]
            answer: "a muffin"
            option_audio: false
          - id: l2-c9
            part: compound
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "toothbrush" }
            options: [{ object: tooth }, { object: toothbrush }, { object: spoon }]
            answer: toothbrush
            option_audio: false
          - id: l2-c10
            part: compound
            type: fill_in_blank
            text: "Put the chunks together."
            say: "Here are two small words. Which word do they make?"
            frame: "hand + bag = _"
            options: ["handbag", "baghand", "handbig"]
            answer: ["handbag"]
            option_audio: false
          - id: l2-c11
            part: compound
            type: multiple_choice
            text: "sandpit\nWhich two small words make it?"
            say: "Read the word on the screen. Which two small words make it?"
            options: ["sand and pit", "san and dpit", "sad and pit"]
            answer: "sand and pit"
            option_audio: false
          - id: l2-c12
            part: compound
            type: true_false
            text: "Is it true? Eggcup is made of the words egg and cup."
            answer: true
          - id: l2-c13
            part: compound
            type: multiple_choice
            text: "Sam put on his sunhat and went up to the hilltop.\nWhere did Sam go?"
            say: "Read the sentence. Where did Sam go?"
            options: ["up to the hilltop", "up to the hen hut", "up to the hot tub"]
            answer: "up to the hilltop"
            option_audio: false
          - id: l2-c14
            part: digraph-chunks
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "sister" }
            options: [{ object: baby }, { object: sister }, { object: brother }]
            answer: sister
            option_audio: false
          - id: l2-c15
            part: digraph-chunks
            type: highlight_in_text
            text: "Tap every word with two chunks."
            say: "Read the words. Tap every word that has two chunks."
            show: { drawn: letter-card, text: "farmer hat garden sock sister" }
            spans: ["farmer", "garden", "sister"]
          - id: l2-c16
            part: digraph-chunks
