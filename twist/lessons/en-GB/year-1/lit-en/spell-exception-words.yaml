# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.spell-exception-words
skill: lit-en.spelling.exception-words-y1
curriculum: en-GB
language: en
title:
  de: Ausnahmewörter und Wochentage schreiben
  en: Spelling tricky words and the days of the week
summary: >
  Spelling the Year 1 common exception words and the days of the week.
  The child hears the word, says its sounds, and learns which part is
  spelt in a surprising way (ai in said, o in come, ie in friend).
  Lesson 1 takes said, was, are, you, they, come, some, one, my, friend,
  house and school; lesson 2 takes the seven days of the week with their
  capital letters, then push, pull, full and there, and ends with the
  skill check. Words are chosen from options or built from cards, and in
  the none stage and the skill check some are typed on the letter
  keyboard.
metadata:
  year: year-1
  topic: { de: "Rechtschreibung", en: "Spelling" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.spelling.segment-spell, lit-en.word-reading.exception-words-y1]
  also_practises: [lit-en.word-reading.exception-words-y1]
  vocabulary: { en: [spell, tricky word, common exception word, capital letter, silent letter, look say cover write check, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: first-words, what: { de: "said, was, are, you, they, come, some, one, my, friend, house und school schreiben", en: "spelling said, was, are, you, they, come, some, one, my, friend, house and school" } }
    - { id: days, what: { de: die Wochentage mit Großbuchstaben schreiben, en: spelling the days of the week with a capital letter } }
    - { id: more-words, what: { de: "push, pull, full, put, there, where und here schreiben", en: "spelling push, pull, full, put, there, where and here" } }
    - { id: from-memory, what: { de: ein Ausnahmewort ganz aus dem Gedächtnis in einen Satz schreiben, en: writing a whole tricky word from memory in a sentence } }
  misconceptions:
    - id: spell-as-heard
      what: Spells an exception word the way it sounds (sed, woz, wun, frend)
      addressed: every Learn screen names the tricky part; the sound-alike spelling is always an option (l1-f1 with feedback, l1-f2, l1-s3, l1-n1, l1-c2, l2-n3)
    - id: lowercase-days
      what: Writes the days of the week with a small letter (monday)
      addressed: lesson 2 Learn says days always start with a capital letter; l2-f3 with feedback, l2-s3, l2-c4
    - id: silent-letters-dropped
      what: Leaves out letters that are not heard (ar for are, Wensday for Wednesday)
      addressed: l1-s1, l2-f4 with feedback, l2-n4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "said, come, friend", en: "said, come, friend" }
    goal:
      de: "Schreib schwierige Wörter wie said, come und friend und merk dir den Teil, der anders geschrieben wird."
      en: "Spell tricky words like said, come and friend, and remember the surprising part."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Spell the word."
            say: "This is a cat. Say the sounds in cat. Which letter goes in the gap?"
            show: { object: cat }
            frame: "c_t"
            options: ["a", "o", "u"]
            answer: ["a"]
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "said" }
            options: ["said", "sad", "sand"]
            answer: "said"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "s ? d"
            say: "Listen: said. The middle sound is e, as in bed. What do you think: is said spelt s, e, d? Have a guess."
            show: { drawn: letter-card, text: "s ? d" }
          - text: "said"
            say: "It is not! Said is a tricky word. Tricky words have a part you have to remember. Say the sounds in said. The middle sound is e, as in bed, but it is spelt a, i. Look at the word, say it, cover it, write it, then check it."
            show: { drawn: letter-card, text: "said" }
          - text: "was   are   you   they"
            say: "Was: the o sound is spelt a. Are: a, r, and a silent e on the end. You: y, o, u. They: the ay sound is spelt e, y."
            show: { drawn: letter-card, text: "was are you they" }
          - text: "come   some   one   my"
            say: "Come and some: the u sound is spelt o, and there is a silent e on the end. One is spelt o, n, e. My: the igh sound is spelt y."
            show: { drawn: letter-card, text: "come some one my" }
          - text: "friend   house   school"
            say: "Friend: the e sound is spelt i, e. House: the ow sound is spelt o, u, with a silent e on the end. School: the k sound is spelt c, h."
            show: { drawn: letter-card, text: "friend house school" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Spell said."
                say: "Listen: said. Which letters go in the gap?"
                frame: "s_d"
                options: ["ai", "e", "ay"]
                answer: ["ai"]
                feedback:
                  "e": "Sed sounds right, but said has a tricky spelling for the e sound."
                hints:
                  - "Said is a tricky word. The e sound is not spelt e."
                  - "It is the same two letters as in rain."
                  - "Tap ai: said."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tap the right spelling."
                say: "Listen. Tap the right spelling."
                audio: { en: "was" }
                options: ["woz", "was", "wos"]
                answer: "was"
                hints:
                  - "This word has a tricky letter for the o sound."
                  - "The o sound is spelt a, and the z sound is spelt s."
                  - "Tap w, a, s."
              - id: l1-f3
                type: ordering
                text: "Spell come."
                say: "Listen: come. Put the letters in order."
                options: ["m", "c", "e", "o"]
                slot_count: 4
                answer: ["c", "o", "m", "e"]
                option_audio: false
                hints:
                  - "Say the sounds in come. Then remember the silent letter."
                  - "The u sound is spelt o. The silent e goes on the end."
                  - "c, o, m, e."
              - id: l1-f4
                type: fill_in_blank
                text: "Spell friend."
                say: "Listen: friend. Which letters go in the gap?"
                frame: "fr_nd"
                options: ["ie", "e", "ee"]
                answer: ["ie"]
                feedback:
                  "e": "Frend sounds right, but friend has a tricky spelling for the e sound."
                hints:
                  - "Friend is a tricky word. The e sound is not spelt e."
                  - "Two letters make the e sound here. The first one is i."
                  - "Tap ie: friend."
              - id: l1-f5
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Listen: school. Tap the right spelling."
                options: ["skool", "school", "scool"]
                answer: "school"
                option_audio: false
                hints:
                  - "The k sound in school is spelt in a tricky way."
                  - "It is spelt c, h, and the oo sound is spelt o, o."
                  - "Tap s, c, h, o, o, l."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Spell are."
                say: "Listen: are. Which letter goes on the end? You do not hear it."
                frame: "ar_"
                options: ["e", "a", "r"]
                answer: ["e"]
                hints: ["Are ends with a silent letter, like come and some."]
              - id: l1-s2
                type: audio_choice
                text: "Tap the right spelling."
                say: "Listen. Tap the right spelling."
                audio: { en: "they" }
                options: ["thay", "they", "thei"]
                answer: "they"
                hints: ["The ay sound in this word is spelt e, y."]
              - id: l1-s3
                type: ordering
                text: "Spell one."
                say: "Listen: one. Put the letters in order. One card does not belong."
                options: ["n", "w", "e", "o"]
                slot_count: 3
                answer: ["o", "n", "e"]
                option_audio: false
                hints: ["You hear a w sound at the start, but one starts with o."]
              - id: l1-s4
                type: true_false
                text: "Is it true? The word you is spelt y, o, u."
                answer: true
                hints: ["Picture the word you. It has three letters and starts with y."]
              - id: l1-s5
                type: fill_in_blank
                text: "Spell some."
                say: "Listen: some. Which letter goes in the gap?"
                frame: "s_me"
                options: ["o", "u", "a"]
                answer: ["o"]
                hints: ["Some is spelt like come: the u sound is spelt o."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the right spelling."
                say: "Listen. Tap the right spelling."
                audio: { en: "said" }
                options: ["sed", "siad", "said"]
                answer: "said"
              - id: l1-n2
                type: text_input
                keyboard: letters
                text: "Write the word.\nCan ___ help me?"
                say: "Write the word you. Can you help me?"
                answer: "you"
              - id: l1-n3
                type: fill_in_blank
                text: "Spell house."
                say: "Listen: house. Which letters go in the gap?"
                frame: "h_se"
                options: ["ou", "ow", "o"]
                answer: ["ou"]
              - id: l1-n4
                type: true_false
                text: "Is it true? Friend is spelt f, r, e, n, d."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Listen: my. Tap the right spelling."
                options: ["mi", "my", "migh"]
                answer: "my"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Spell was."
            say: "Listen: was. Which letter goes in the gap?"
            frame: "w_s"
            options: ["a", "o", "u"]
            answer: ["a"]
          - id: l1-c2
            type: audio_choice
            text: "Tap the right spelling."
            say: "Listen. Tap the right spelling."
            audio: { en: "friend" }
            options: ["frend", "freind", "friend"]
            answer: "friend"
          - id: l1-c3
            type: true_false
            text: "Is it true? Said is spelt s, e, d."
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Spell come."
            say: "Listen: come. Which letters go in the gaps?"
            frame: "c_m_"
            options: ["o", "u", "e"]
            answer: ["o", "e"]
            option_audio: false
          - id: l1-c5
            type: text_input
            keyboard: letters
            text: "Write the word.\nI have ___ dog."
            say: "Write the word one. I have one dog."
            show: { object: dog }
            answer: "one"
          - id: l1-c6
            type: audio_choice
            text: "Tap the right spelling."
            say: "Listen. Tap the right spelling."
            audio: { en: "house" }
            options: ["hows", "house", "hous"]
            answer: "house"

  - n: 2
    title: { de: "Die Wochentage", en: "The days of the week" }
    goal:
      de: "Schreib die Wochentage und fang jeden mit einem Großbuchstaben an, so wie Monday."
      en: "Spell the days of the week, and start each one with a capital letter, like Monday."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Spell friend."
            say: "Listen: friend. Which letters go in the gap?"
            frame: "fr_nd"
            options: ["ea", "ie", "ee"]
            answer: ["ie"]
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Tap the right spelling."
            say: "Listen. Tap the right spelling."
            audio: { en: "come" }
            options: ["cum", "come", "kum"]
            answer: "come"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The days of the week"
            say: "Say the days of the week with me: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. What do you think: which sound do they all end with? Have a guess."
          - text: "Monday   Tuesday   Wednesday"
            say: "They all end with day! The days of the week always start with a capital letter, and they all end in d, a, y. Monday. Tuesday has u, e for the oo sound. Wednesday has a d you do not hear. Say it in parts to remember it: Wed, nes, day."
            show: { drawn: letter-card, text: "Monday Tuesday Wednesday" }
          - text: "Thursday   Friday   Saturday   Sunday"
            say: "Thursday starts with t, h, and the er sound is spelt u, r. Friday. Saturday: Sat, ur, day. Sunday: Sun, day."
            show: { drawn: letter-card, text: "Thursday Friday Saturday Sunday" }
          - text: "Did you know? Monday is moon day."
            say: "Did you know? Sunday is named after the sun, and Monday is named after the moon. Long ago, people called it moon day!"
            show: { object: moon }
          - text: "push   pull   full   put"
            say: "In push, pull, full and put, the short oo sound, as in book, is spelt with just a u."
            show: { drawn: letter-card, text: "push pull full put" }
          - text: "there   where   here"
            say: "There, where and here all end in e, r, e. Where starts with w, h."
            show: { drawn: letter-card, text: "there where here" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Put the days in order. Start with Monday."
                say: "Put the days in order. Start with Monday."
                options: ["Wednesday", "Monday", "Tuesday"]
                slot_count: 3
                answer: ["Monday", "Tuesday", "Wednesday"]
                hints:
                  - "Say the days of the week from the start."
                  - "Monday is first. Which day comes after it?"
                  - "Monday, Tuesday, Wednesday."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Spell Tuesday."
                say: "Listen: Tuesday. Which letters go in the gap?"
                frame: "T_sday"
                options: ["ue", "oo", "u"]
                answer: ["ue"]
                hints:
                  - "Tuesday has a tricky spelling for the oo sound."
                  - "It is two letters, and the second one is e."
                  - "Tap ue: Tuesday."
              - id: l2-f3
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Listen: Monday. Tap the right spelling."
                options: ["monday", "Monday", "Munday"]
                answer: "Monday"
                option_audio: false
                feedback:
                  "monday": "The letters are right, but days of the week start with a capital letter."
                hints:
                  - "How do the days of the week start?"
                  - "Look for a capital M, and the u sound spelt o."
                  - "Tap Monday with a capital M."
              - id: l2-f4
                type: fill_in_blank
                text: "Spell Wednesday."
                say: "Listen: Wednesday. Which letter goes in the gap? You do not hear it."
                frame: "We_nesday"
                options: ["d", "n", "t"]
                answer: ["d"]
                feedback:
                  "n": "There is already an n after the gap. The missing letter is one you do not hear."
                hints:
                  - "Say it in parts: Wed, nes, day."
                  - "The first part is Wed. Which letter ends it?"
                  - "Tap d: Wednesday."
              - id: l2-f5
                type: fill_in_blank
                text: "Spell push."
                say: "Listen: push. Which letters go in the gap?"
                frame: "p_sh"
                options: ["oo", "u", "o"]
                answer: ["u"]
                feedback:
                  "oo": "You hear oo, but in push it is spelt with one letter."
                hints:
                  - "Push is spelt like pull and full."
                  - "The oo sound in these words is spelt with one letter."
                  - "Tap u: push."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Tap the right spelling."
                say: "Listen. Tap the right spelling."
                audio: { en: "Friday" }
                options: ["Fryday", "Friday", "Fridey"]
                answer: "Friday"
                hints: ["All the days end in d, a, y, and the igh sound here is spelt i."]
              - id: l2-s2
                type: fill_in_blank
                text: "Spell Thursday."
                say: "Listen: Thursday. Which letters go in the gap?"
                frame: "Th_sday"
                options: ["ur", "er", "ir"]
                answer: ["ur"]
                hints: ["The er sound in Thursday is spelt with a u."]
              - id: l2-s3
                type: true_false
                text: "Is it true? The days of the week start with a capital letter."
                answer: true
                hints: ["Think of how Monday looks."]
              - id: l2-s4
                type: fill_in_blank
                text: "Spell there."
                say: "Listen: there, as in over there. Which letter goes in the gap?"
                frame: "th_re"
                options: ["e", "a", "i"]
                answer: ["e"]
                hints: ["There ends in e, r, e, like where and here."]
              - id: l2-s5
                type: ordering
                text: "Put the days in order. Start with Thursday."
                say: "Put the days in order. Start with Thursday."
                options: ["Saturday", "Thursday", "Sunday", "Friday"]
                slot_count: 4
                answer: ["Thursday", "Friday", "Saturday", "Sunday"]
                hints: ["The weekend days come last: Saturday, then Sunday."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Spell Saturday."
                say: "Listen: Saturday. Which letters go in the gap?"
                frame: "Sat_day"
                options: ["ur", "er", "ir"]
                answer: ["ur"]
              - id: l2-n2
                type: multiple_choice
                text: "Which day comes after Sunday?"
                say: "Which day comes after Sunday?"
                options: ["Monday", "Saturday", "Tuesday"]
                answer: "Monday"
                feedback:
                  "Saturday": "That would be going back in time! Saturday comes before Sunday. Which day starts the new week?"
              - id: l2-n3
                type: audio_choice
                text: "Tap the right spelling."
                say: "Listen. Tap the right spelling."
                audio: { en: "where" }
                options: ["wair", "where", "wheer"]
                answer: "where"
              - id: l2-n4
                type: true_false
                text: "Is it true? Wednesday is spelt Wensday."
                answer: false
              - id: l2-n5
                type: text_input
                keyboard: letters
                text: "Write the word.\nMy bag is ____."
                say: "Write the word full. My bag is full."
                answer: "full"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: first-words
            type: fill_in_blank
            text: "Spell said."
            say: "Listen: said. Which letter goes in the gap?"
            frame: "sa_d"
            options: ["i", "e", "y"]
            answer: ["i"]
          - id: l2-c2
            part: days
            type: audio_choice
            text: "Tap the right spelling."
            say: "Listen. Tap the right spelling."
            audio: { en: "Sunday" }
            options: ["Sonday", "Sundai", "Sunday"]
            answer: "Sunday"
          - id: l2-c3
            part: first-words
            type: ordering
            text: "Spell they."
            say: "Listen: they. Put the cards in order. One card does not belong."
            options: ["ey", "th", "ay"]
            slot_count: 2
            answer: ["th", "ey"]
            option_audio: false
          - id: l2-c4
            part: days
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Listen: Thursday. Tap the right spelling."
            options: ["thursday", "Thersday", "Thursday"]
            answer: "Thursday"
            option_audio: false
          - id: l2-c5
            part: from-memory
            type: text_input
            keyboard: letters
            text: "Write the word.\nWe walk to ______."
            say: "Write the word school. We walk to school."
            answer: "school"
          - id: l2-c6
            part: first-words
            type: audio_choice
            text: "Tap the right spelling."
            say: "Listen. Tap the right spelling."
            audio: { en: "are" }
            options: ["ar", "are", "aer"]
            answer: "are"
          - id: l2-c7
            part: days
            type: fill_in_blank
            text: "Spell Wednesday."
            say: "Listen: Wednesday. Which letter goes in the gap?"
            frame: "Wedn_sday"
            options: ["e", "i", "a"]
            answer: ["e"]
            option_audio: false
          - id: l2-c8
            part: more-words
            type: fill_in_blank
            text: "Spell pull."
            say: "Listen: pull. Which letters go in the gap?"
            frame: "pu_"
            options: ["ll", "l", "le"]
            answer: ["ll"]
            option_audio: false
          - id: l2-c9
            part: from-memory
            type: text_input
            keyboard: letters
            text: "Write the word.\nMy ______ is called Ali."
            say: "Write the word friend. My friend is called Ali."
            answer: "friend"
          - id: l2-c10
            part: first-words
            type: fill_in_blank
            text: "Spell school."
            say: "Listen: school. Which letters go in the gap?"
            frame: "s_ool"
            options: ["ch", "k", "c"]
            answer: ["ch"]
            option_audio: false
          - id: l2-c11
            part: days
            type: highlight_in_text
            text: "Tap every day that is written correctly."
            say: "Read the days yourself. Tap every day that is written correctly."
            show: { drawn: letter-card, text: "Monday friday Tuesday sunday Saturday" }
            spans: ["Monday", "Tuesday", "Saturday"]
          - id: l2-c12
            part: more-words
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Listen: here. Come over here. Tap the right spelling."
            options: ["heer", "here", "hir"]
            answer: "here"
            option_audio: false
          - id: l2-c13
            part: days
            type: text_input
            keyboard: letters
            text: "Write the day.\nThe day after Monday is ________."
            say: "Write the day that comes after Monday."
            answer: "Tuesday"
          - id: l2-c14
            part: first-words
            type: true_false
            text: "Is it true? Come is spelt c, u, m."
            answer: false
          - id: l2-c15
            part: days
            type: audio_choice
            text: "Tap the right spelling."
            say: "Listen. Tap the right spelling."
            audio: { en: "Saturday" }
            options: ["Saterday", "Saturday", "Satterday"]
            answer: "Saturday"
          - id: l2-c16
            part: more-words
            type: audio_choice
            text: "Tap the right spelling."
            say: "Listen. Tap the right spelling."
            audio: { en: "put" }
            options: ["poot", "put", "pute"]
            answer: "put"
          - id: l2-c17
            part: from-memory
            type: text_input
            keyboard: letters
            text: "Write the word.\nThey ___ my friends."
            say: "Write the word are. They are my friends."
            answer: "are"
          - id: l2-c18
            part: first-words
            type: ordering
            text: "Spell was."
            say: "Listen: was. Put the letters in order. One card does not belong."
            options: ["s", "a", "w", "o"]
            slot_count: 3
            answer: ["w", "a", "s"]
            option_audio: false
          - id: l2-c19
            part: more-words
            type: true_false
            text: "Is it true? Where starts with w, h."
            answer: true
          - id: l2-c20
            part: from-memory
            type: text_input
            keyboard: letters
            text: "Write the word.\nI live in a red _____."
            say: "Write the word house. I live in a red house."
            show: { object: house }
            answer: "house"
