# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.endings
skill: lit-en.word-reading.endings
curriculum: en-GB
language: en
title:
  de: Wörter mit Endungen lesen
  en: Reading words with endings
summary: >
  Children read words made from a root word they can blend and an ending
  added to it, with no change to the root word, as the Year 1 programme
  asks. The strategy: cover the ending, read the root word, then add the
  ending. Lesson 1 takes -s and -es (more than one) and -ing; lesson 2
  takes -ed (it has already happened, and its three sounds), -er and -est
  (comparing, and -er for a person who does something) and ends with the
  skill check. Word and spelling options have no speaker, so the child
  reads them.
metadata:
  year: year-1
  topic: { de: "Wörter lesen", en: "Reading words" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.word-reading.blend-cvc, lit-en.phonics.adjacent-consonants]
  also_practises: []
  vocabulary: { en: [root word, ending, more than one, plural, already happened, compare, -s, -es, -ing, -ed, -er, -est] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: s-es, what: { de: "Wörter mit -s und -es lesen (cats, foxes)", en: "reading words with -s and -es (cats, foxes)" } }
    - { id: ing, what: { de: "Wörter mit -ing lesen (jumping)", en: "reading words with -ing (jumping)" } }
    - { id: ed, what: { de: "Wörter mit -ed lesen (jumped, wanted)", en: "reading words with -ed (jumped, wanted)" } }
    - { id: er-est, what: { de: "Wörter mit -er und -est lesen (taller, tallest, farmer)", en: "reading words with -er and -est (taller, tallest, farmer)" } }
  misconceptions:
    - id: whole-word-guess
      what: Guesses a long word from its first letters instead of finding the root word and the ending
      addressed: Learn shows the cover-the-ending strategy; l1-f3, l1-s3, l1-n3, l2-f1 and l2-n1 ask for the root word inside a longer word
    - id: ending-ignored
      what: Reads cats as cat or jumped as jump, so misses more than one or already happened
      addressed: l1-f1 gives feedback on the single picture; l1-s4, l2-s4 and l2-n2 ask what the ending tells you
    - id: letters-not-ending
      what: Takes the letters ed in a short word (bed, red) for the ending
      addressed: l2-f4 sets bed and red among words with -ed, and its hints show nothing is left when ed is taken away
    - id: er-is-most
      what: Thinks the -er word is the most of all (taller is the tallest)
      addressed: Learn sets tall, taller, tallest in a row; l2-f2 gives feedback on the -er name; l2-s1, l2-n5 and l2-c5 compare three
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "-s, -es und -ing", en: "-s, -es and -ing" }
    goal:
      de: "Deck die Endung ab, lies das Grundwort und häng dann die Endung an, so wie help und helping."
      en: "Cover the ending, read the root word, then add the ending, like help and helping."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "frog" }
            options: [{ object: frog }, { object: fox }, { object: fish }]
            answer: frog
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "cup" }
            options: [{ object: cup }, { object: cat }, { object: cow }]
            answer: cup
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "cat"
            say: "The word says cat, but look: there are three cats! What do you think: what can we put on the end of cat to show there is more than one?"
            show: { object: cat, count: 3, layout: row }
          - text: "cat → cats"
            say: "We add an s! Read the word: cat. Now there is an s on the end: cats. The s tells us there is more than one."
            show: { object: cat, count: 3, layout: row }
          - text: "fox → foxes"
            say: "After x, s, sh, ch or z we add es. It makes a new beat: fox ... es. Foxes."
            show: { object: fox, count: 3, layout: row }
          - text: "jump → jumping"
            say: "Jump is the root word. Add ing and it says what someone is doing now: jump ... ing. Jumping."
            show: { object: jump }
          - text: "help + ing"
            say: "When you see a long word, cover the ending with your finger. Read the root word, help. Then take your finger away and add the ending: helping."
            show: { drawn: letter-card, text: "helping" }
          - text: "Did you know? Long ago, lots of words added en, not s, for more than one. A few still do: children, oxen."
            say: "Did you know? Long ago, lots of English words added e n, not s, to mean more than one. A few of them are still here today. One child, two children. One ox, two oxen!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Tap the picture that matches."
                show: { drawn: letter-card, text: "dogs" }
                options:
                  - { object: dog, key: dog }
                  - { object: dog, count: 3, layout: row, key: dogs }
                answer: dogs
                option_audio: false
                feedback:
                  dog: "Look at the end of the word. There is an s, so there is more than one dog."
                hints:
                  - "Look at the last letter of the word."
                  - "Read dog, then look for the s on the end."
                  - "Dogs: more than one dog."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap every word with the ending -ing."
                say: "Read the words. Tap every word that ends with i n g."
                show: { drawn: letter-card, text: "jumping cat helping sunset fishing" }
                spans: ["jumping", "helping", "fishing"]
                hints:
                  - "Look at the end of each word."
                  - "Cat and sunset do not end with ing."
                  - "jumping, helping and fishing."
              - id: l1-f3
                type: multiple_choice
                text: "foxes\nWhich root word is in it?"
                say: "Read the word. Cover the ending. Which root word is left?"
                options: ["fox", "foxe", "box"]
                answer: "fox"
                option_audio: false
                feedback:
                  foxe: "The ending is es, so cover the e and the s. Fox is left."
                hints:
                  - "Foxes ends with es."
                  - "Cover the e and the s. What is left?"
                  - "fox."
              - id: l1-f4
                type: true_false
                text: "Is it true? In helping, the root word is help."
                answer: true
                hints:
                  - "Cover the ending ing."
                  - "Read the word that is left."
                  - "Yes, the root word is help."
              - id: l1-f5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Tap the picture that matches."
                show: { drawn: letter-card, text: "singing" }
                options: [{ object: sing }, { object: swim }, { object: dance }]
                answer: sing
                option_audio: false
                feedback:
                  swim: "Singing under the water? Glug, glug! Cover the ing and read the root word: sing."
                hints:
                  - "Cover the ending first."
                  - "Read the root word that is left. Then add ing."
                  - "Singing."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Tap the picture that matches."
                show: { drawn: letter-card, text: "buses" }
                options:
                  - { object: bus, count: 3, layout: row, key: buses }
                  - { object: bus, key: bus }
                answer: buses
                option_audio: false
                hints: ["The ending es means more than one."]
              - id: l1-s2
                type: sorting
                text: "Sort the words by their ending."
                say: "Read each word. Does it end with s, or with ing? Put it in the right group."
                option_audio: false
                bins:
                  - { id: s, show: { text: "-s" }, say: "s" }
                  - { id: ing, show: { text: "-ing" }, say: "ing" }
                options:
                  - { text: "hats", bin: s }
                  - { text: "kicking", bin: ing }
                  - { text: "pigs", bin: s }
                  - { text: "resting", bin: ing }
                hints: ["Look only at the end of each word."]
              - id: l1-s3
                type: multiple_choice
                text: "kicking\nWhich root word is in it?"
                say: "Read the word. Cover the ending. Which root word is left?"
                options: ["kick", "kicki", "king"]
                answer: "kick"
                option_audio: false
                hints: ["Cover the i, the n and the g. What is left?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? The word hens means just one hen."
                answer: false
                hints: ["Look at the s on the end of hens."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap every word with the ending -es."
                say: "Read the words. Tap every word that ends with e s."
                show: { drawn: letter-card, text: "dishes cats foxes hats wishes" }
                spans: ["dishes", "foxes", "wishes"]
                hints: ["Cats and hats end with just an s."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Tap the picture that matches."
                show: { drawn: letter-card, text: "ducks" }
                options:
                  - { object: duck, key: duck }
                  - { object: duck, count: 4, layout: row, key: ducks }
                answer: ducks
                option_audio: false
              - id: l1-n2
                type: image_multiple_choice
                text: "The frogs are jumping.\nTap the picture."
                say: "Read the sentence. Tap the picture that matches."
                options:
                  - { object: frog, count: 3, layout: row, key: frogs }
                  - { object: frog, key: frog }
                answer: frogs
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "rushes\nWhich root word is in it?"
                say: "Read the word. Cover the ending. Which root word is left?"
                options: ["rush", "rus", "rushe"]
                answer: "rush"
                option_audio: false
              - id: l1-n4
                type: sorting
                text: "Sort the words by their ending."
                say: "Read each word. Does it end with s, or with es? Put it in the right group."
                option_audio: false
                bins:
                  - { id: s, show: { text: "-s" }, say: "s" }
                  - { id: es, show: { text: "-es" }, say: "e s" }
                options:
                  - { text: "pens", bin: s }
                  - { text: "boxes", bin: es }
                  - { text: "bells", bin: s }
                  - { text: "wishes", bin: es }
              - id: l1-n5
                type: true_false
                text: "Is it true? In standing, the root word is stand."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap the picture that matches."
            show: { drawn: letter-card, text: "hats" }
            options:
              - { object: hat, key: hat }
              - { object: hat, count: 3, layout: row, key: hats }
            answer: hats
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "melting\nWhich root word is in it?"
            say: "Read the word. Which root word is in it?"
            options: ["melt", "mel", "melti"]
            answer: "melt"
            option_audio: false
          - id: l1-c3
            type: highlight_in_text
            text: "Tap every word with the ending -ing."
            say: "Read the words. Tap every word that ends with i n g."
            show: { drawn: letter-card, text: "resting bus singing lamp" }
            spans: ["resting", "singing"]
          - id: l1-c4
            type: true_false
            text: "Is it true? The word boxes means more than one box."
            say: "Read it yourself. Is it true?"
            answer: true
          - id: l1-c5
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap the picture that matches."
            show: { drawn: letter-card, text: "painting" }
            options: [{ object: paint }, { object: sing }, { object: dance }]
            answer: paint
            option_audio: false
          - id: l1-c6
            type: multiple_choice
            text: "kisses\nWhich ending does it have?"
            say: "Read the word. Which ending does it have?"
            options: ["-s", "-es", "-ing"]
            answer: "-es"
            option_audio: false

  - n: 2
    title: { de: "-ed, -er und -est", en: "-ed, -er and -est" }
    goal:
      de: "Lies Wörter mit neuen Endungen, so wie jumped, taller und tallest."
      en: "Read words with new endings, like jumped, taller and tallest."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap the picture that matches."
            show: { drawn: letter-card, text: "socks" }
            options:
              - { object: sock, count: 3, layout: row, key: socks }
              - { object: sock, key: sock }
            answer: socks
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "fishing\nWhich root word is in it?"
            say: "Read the word. Cover the ending. Which root word is left?"
            options: ["fish", "fis", "fishi"]
            answer: "fish"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Today I jump.\nYesterday I ..."
            say: "Today I jump. Yesterday I ... what? What do you think we put on the end of jump to show it has already happened?"
            show: { object: jump }
          - text: "jump → jumped"
            say: "We add e d! Ed on the end tells us it has already happened. Yesterday I jumped. In jumped, the ed sounds like the t in top."
          - text: "fill → filled   want → wanted"
            say: "In filled, the ed sounds like the d in dog. In wanted, it makes its own beat: want ... ed. Read the root word first, then try the ending."
          - text: "tall → taller → tallest"
            say: "Er and est help us compare. Ben is tall. Max is taller. Kit is the tallest. Est means the most of all."
          - text: "farm → farmer"
            say: "Er can also mean a person who does something. A farmer works on a farm. A helper helps."
            show: { object: farmer }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "jumped\nWhich root word is in it?"
                say: "Read the word. Cover the ending. Which root word is left?"
                options: ["jump", "jum", "jumpe"]
                answer: "jump"
                option_audio: false
                hints:
                  - "The ending is ed."
                  - "Cover the e and the d. What is left?"
                  - "jump."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ben is tall. Max is taller. Kit is the tallest.\nWho is the tallest?"
                say: "Read the sentences. Who is the tallest?"
                options: ["Kit", "Max", "Ben"]
                answer: "Kit"
                feedback:
                  Max: "Max is taller than Ben. But est means the most of all. Who is the tallest?"
                hints:
                  - "Find the word that ends with est."
                  - "Est means the most of all."
                  - "Kit is the tallest."
              - id: l2-f3
                type: true_false
                text: "Is it true? In wanted, the ending ed makes its own beat: want ... ed."
                answer: true
                hints:
                  - "Say the word slowly and clap it."
                  - "want ... ed: two claps."
                  - "Yes, it makes its own beat."
              - id: l2-f4
                type: highlight_in_text
                text: "Tap every word with the ending -ed."
                say: "Read the words. Tap every word that has the ending e d added to a root word."
                show: { drawn: letter-card, text: "jumped bed helped red rested" }
                spans: ["jumped", "helped", "rested"]
                hints:
                  - "Cover the ed. Is there a root word left?"
                  - "Cover the ed in bed: only b is left. That is not a root word."
                  - "jumped, helped and rested."
              - id: l2-f5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Tap the picture that matches."
                show: { drawn: letter-card, text: "farmer" }
                options: [{ object: farmer }, { object: teacher }, { object: doctor }]
                answer: farmer
                option_audio: false
                hints:
                  - "Cover the er first."
                  - "Read the root word that is left."
                  - "Farmer: a person who works on a farm."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "My bag is long. Your bag is longer. Gran's bag is the longest.\nWhose bag is the longest?"
                say: "Read the sentences. Whose bag is the longest?"
                options: ["Gran's bag", "your bag", "my bag"]
                answer: "Gran's bag"
                hints: ["Est means the most of all."]
              - id: l2-s2
                type: multiple_choice
                text: "rested\nWhich root word is in it?"
                say: "Read the word. Cover the ending. Which root word is left?"
                options: ["rest", "res", "reste"]
                answer: "rest"
                option_audio: false
                hints: ["Cover the e and the d."]
              - id: l2-s3
                type: sorting
                text: "Sort the words by their ending."
                say: "Read each word. Does it end with ed, or with est? Put it in the right group."
                option_audio: false
                bins:
                  - { id: ed, show: { text: "-ed" }, say: "e d" }
                  - { id: est, show: { text: "-est" }, say: "e s t" }
                options:
                  - { text: "kicked", bin: ed }
                  - { text: "fastest", bin: est }
                  - { text: "picked", bin: ed }
                  - { text: "softest", bin: est }
                hints: ["Look only at the last letters of each word."]
              - id: l2-s4
                type: true_false
                text: "Is it true? The word jumped tells you it is happening now."
                answer: false
                hints: ["Ed on the end tells you it has already happened."]
              - id: l2-s5
                type: highlight_in_text
                text: "Tap every word with the ending -er."
                say: "Read the words. Tap every word that ends with e r."
                show: { drawn: letter-card, text: "quicker cat helper dog colder" }
                spans: ["quicker", "helper", "colder"]
                hints: ["Cat and dog have no ending."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "thickest\nWhich root word is in it?"
                say: "Read the word. Cover the ending. Which root word is left?"
                options: ["thick", "thin", "thicke"]
                answer: "thick"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "I kicked the ball.\nWhen did it happen?"
                say: "Read the sentence. When did it happen?"
                options: ["It has already happened.", "It is happening now."]
                answer: "It has already happened."
                keep_order: true
              - id: l2-n3
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Tap the picture that matches."
                show: { drawn: letter-card, text: "teacher" }
                options: [{ object: teacher }, { object: doctor }, { object: cook }]
                answer: teacher
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? If Sam is the fastest, nobody is faster than Sam."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "The fox is quick. The cat is quicker. The dog is the quickest.\nWho is the slowest?"
                say: "Read the sentences. Who is the slowest?"
                options: ["the fox", "the cat", "the dog"]
                answer: "the fox"
                difficulty: stretch

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: s-es
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap the picture that matches."
            show: { drawn: letter-card, text: "cups" }
            options:
              - { object: cup, key: cup }
              - { object: cup, count: 3, layout: row, key: cups }
            answer: cups
            option_audio: false
          - id: l2-c2
            part: s-es
            type: multiple_choice
            text: "wishes\nWhich root word is in it?"
            say: "Read the word. Which root word is in it?"
            options: ["wish", "wis", "wishe"]
            answer: "wish"
            option_audio: false
          - id: l2-c3
            part: ing
            type: multiple_choice
            text: "pulling\nWhich root word is in it?"
            say: "Read the word. Which root word is in it?"
            options: ["pull", "pul", "pulli"]
            answer: "pull"
            option_audio: false
          - id: l2-c4
            part: ed
            type: true_false
            text: "\"The dog barked.\" Is it true? This has already happened."
            say: "Read the sentence. Is it true that this has already happened?"
            answer: true
          - id: l2-c5
            part: er-est
            type: multiple_choice
            text: "Pip is small. Tess is smaller. Zak is the smallest.\nWho is the smallest?"
            say: "Read the sentences. Who is the smallest?"
            options: ["Zak", "Tess", "Pip"]
            answer: "Zak"
          - id: l2-c6
            part: s-es
            type: multiple_choice
            text: "Which word means more than one?"
            say: "Read the words yourself. Which word means more than one?"
            options: ["box", "boxes", "boxing"]
            answer: "boxes"
            option_audio: false
          - id: l2-c7
            part: s-es
            type: highlight_in_text
            text: "Tap every word with the ending -s."
            say: "Read the sentence. Tap every word that has the ending s."
            show: { drawn: letter-card, text: "Ben got two hats and six eggs." }
            spans: ["hats", "eggs"]
          - id: l2-c8
            part: s-es
            type: multiple_choice
            text: "buzzes\nWhich root word is in it?"
            say: "Read the word. Which root word is in it?"
            options: ["buzz", "buz", "buzze"]
            answer: "buzz"
            option_audio: false
          - id: l2-c9
            part: ing
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap the picture that matches."
            show: { drawn: letter-card, text: "looking" }
            options: [{ object: look }, { object: listen }, { object: clap }]
            answer: look
            option_audio: false
          - id: l2-c10
            part: ing
            type: highlight_in_text
            text: "Tap every word with the ending -ing."
            say: "Read the sentence. Tap every word that has the ending i n g."
            show: { drawn: letter-card, text: "Mum is cooking and Pip is drinking milk." }
            spans: ["cooking", "drinking"]
          - id: l2-c11
            part: ing
            type: true_false
            text: "\"Ali is lifting the box.\" Is it true? Ali is doing it now."
            say: "Read the sentence. Is it true that Ali is doing it now?"
            answer: true
          - id: l2-c12
            part: ed
            type: sorting
            text: "Sort the words by their ending."
            say: "Read each word. Does it end with ing, or with ed? Put it in the right group."
            option_audio: false
            bins:
              - { id: ing, show: { text: "-ing" }, say: "ing" }
              - { id: ed, show: { text: "-ed" }, say: "e d" }
            options:
              - { text: "packed", bin: ed }
              - { text: "yelling", bin: ing }
              - { text: "rushed", bin: ed }
              - { text: "landing", bin: ing }
          - id: l2-c13
            part: ing
            type: multiple_choice
            text: "The bird is _ in the tree.\nWhich word fits?"
            say: "Read the sentence. Which word fits in the gap?"
            options: ["singing", "sings", "sang"]
            answer: "singing"
