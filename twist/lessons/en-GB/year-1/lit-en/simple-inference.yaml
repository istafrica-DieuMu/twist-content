# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.simple-inference
skill: lit-en.comprehension.simple-inference
curriculum: en-GB
language: en
title:
  de: Erschließen, was eine Figur fühlt oder will
  en: How does the character feel?
summary: >
  A story does not always say how a character feels; we work it out from
  what they say and do. Lesson 1 reads feelings (happy, sad, cross,
  scared, tired) from clues such as crying, stamping or yawning. Lesson 2
  works out what a character wants from what they say and do, picks the
  clue that shows it, and ends with the skill check. Stories are short
  and read aloud.
metadata:
  year: year-1
  topic: { de: "Geschichten verstehen", en: "Understanding stories" }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-en.comprehension.title-events]
  also_practises: []
  vocabulary: { en: [feel, feeling, happy, sad, cross, scared, tired, want, clue, character] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: only-if-said
      what: Thinks you can only know a feeling if the story names it
      addressed: Learn screen 1 in lesson 1; l1-f1, l1-s1 and l1-n1 name no feeling, only actions
    - id: one-clue-ignored
      what: Picks a feeling from the setting or one happy word and misses the clue that matters (a party, but the child is crying)
      addressed: l1-f3 feedback on happy; l1-s3 and l2-c2
    - id: wants-vs-has
      what: Mixes up what a character wants with what they already have
      addressed: Learn screen 2 in lesson 2; l2-f1 feedback; l2-s1 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gefühle erkennen", en: "Spotting feelings" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ben's cat went missing. He made posters. A lady phoned to say she had found the cat.\n\nWhich title fits best?"
            say: "Listen. Ben's cat went missing. He made posters. A lady phoned to say she had found the cat. Which title fits best?"
            options: ["Ben Finds His Cat", "The Phone", "Ben's Pens"]
            answer: "Ben Finds His Cat"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? A main event is a part the story cannot do without."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Amy hugged her new puppy and jumped up and down."
            say: "The story does not say how Amy feels. But she hugs the puppy and jumps up and down. Those are clues. Amy is happy."
            show: { object: happy }
          - text: "Tom pulled the covers over his head when the thunder boomed."
            say: "Tom hides under the covers when the thunder booms. That clue tells us Tom is scared."
            show: { object: scared }
          - text: "What do they do? What do they say? How would I feel?"
            say: "To work out a feeling, look at what a character does and says. Then ask: how would I feel if that happened to me?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Lily's ice cream fell on the ground. Tears ran down her face.\n\nHow does Lily feel?"
                say: "Listen. Lily's ice cream fell on the ground. Tears ran down her face. How does Lily feel?"
                options: [{ object: sad }, { object: happy }, { object: tired }]
                answer: sad
                hints:
                  - "Look at what Lily does."
                  - "Tears ran down her face."
                  - "Sad."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Jay stamped his feet and shouted, \"That's not fair!\"\n\nHow does Jay feel?"
                say: "Listen. Jay stamped his feet and shouted: That's not fair! How does Jay feel?"
                options: [{ object: angry }, { object: scared }, { object: happy }]
                answer: angry
                hints:
                  - "What does Jay do with his feet?"
                  - "Stamping and shouting are clues."
                  - "Angry, or cross."
              - id: l1-f3
                type: image_multiple_choice
                text: "It was Ava's party. Everyone was playing, but Ava sat alone in the corner and cried.\n\nHow does Ava feel?"
                say: "Listen. It was Ava's party. Everyone was playing, but Ava sat alone in the corner and cried. How does Ava feel?"
                options: [{ object: happy }, { object: sad }, { object: angry }]
                answer: sad
                feedback:
                  happy: "Parties are often fun, but look at what Ava does. She sits alone and cries."
                hints:
                  - "Do not look at the party. Look at Ava."
                  - "She sits alone and cries."
                  - "Sad."
              - id: l1-f4
                type: multiple_choice
                text: "Sam yawned and rubbed his eyes. \"Can I go to bed?\" he asked.\n\nWhich clue shows that Sam is tired?"
                say: "Listen. Sam yawned and rubbed his eyes. Can I go to bed? he asked. Which clue shows that Sam is tired?"
                options: ["He yawned.", "His name is Sam.", "He asked a question."]
                answer: "He yawned."
                option_audio: false
                hints:
                  - "What do you do when you are tired?"
                  - "Think of your mouth opening wide."
                  - "He yawned."
              - id: l1-f5
                type: true_false
                text: "Is it true? \"Mia grinned and clapped her hands.\" Mia feels happy."
                answer: true
                hints:
                  - "What is a grin?"
                  - "Grinning and clapping are clues."
                  - "Yes, she is happy."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Raj held Dad's hand tight. He did not want to go near the big dog.\n\nHow does Raj feel?"
                say: "Listen. Raj held Dad's hand tight. He did not want to go near the big dog. How does Raj feel?"
                options: [{ object: scared }, { object: happy }, { object: tired }]
                answer: scared
                hints: ["Why does he hold on tight?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Zoe could not stop smiling. \"I can swim!\" she said.\n\nHow does Zoe feel?"
                say: "Listen. Zoe could not stop smiling. I can swim! she said. How does Zoe feel?"
                options: [{ object: happy }, { object: sad }, { object: scared }]
                answer: happy
                hints: ["She could not stop smiling."]
              - id: l1-s3
                type: image_multiple_choice
                text: "It was a sunny day at the beach. Leo's brother kicked over his sandcastle. Leo went red and shouted.\n\nHow does Leo feel?"
                say: "Listen. It was a sunny day at the beach. Leo's brother kicked over his sandcastle. Leo went red and shouted. How does Leo feel?"
                options: [{ object: angry }, { object: happy }, { object: tired }]
                answer: angry
                hints: ["Look at what Leo does, not the weather."]
              - id: l1-s4
                type: multiple_choice
                text: "Nana's hands shook as she opened the letter.\n\nWhich word could tell how Nana feels?"
                say: "Listen. Nana's hands shook as she opened the letter. Which word could tell how Nana feels?"
                options: ["nervous", "sleepy", "hungry"]
                answer: "nervous"
                hints: ["Shaking hands can show a worry."]
              - id: l1-s5
                type: true_false
                text: "Is it true? \"Kit slammed the door and folded his arms.\" Kit feels happy."
                answer: false
                hints: ["What does slamming a door show?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Ollie's eyes kept closing. He put his head on the table.\n\nHow does Ollie feel?"
                say: "Listen. Ollie's eyes kept closing. He put his head on the table. How does Ollie feel?"
                options: [{ object: tired }, { object: angry }, { object: happy }]
                answer: tired
              - id: l1-n2
                type: image_multiple_choice
                text: "Ivy hid behind the sofa when the ghost came on TV.\n\nHow does Ivy feel?"
                say: "Listen. Ivy hid behind the sofa when the ghost came on TV. How does Ivy feel?"
                options: [{ object: scared }, { object: sad }, { object: tired }]
                answer: scared
              - id: l1-n3
                type: multiple_choice
                text: "Ruby laughed and spun round. \"We won the match!\"\n\nWhich clue shows that Ruby is happy?"
                say: "Listen. Ruby laughed and spun round. We won the match! Which clue shows that Ruby is happy?"
                options: ["She laughed.", "It was a match.", "Her name is Ruby."]
                answer: "She laughed."
                option_audio: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Max looked at the empty fish tank. His fish had died. He hugged his mum.\n\nHow does Max feel?"
                say: "Listen. Max looked at the empty fish tank. His fish had died. He hugged his mum. How does Max feel?"
                options: [{ object: sad }, { object: happy }, { object: angry }]
                answer: sad
              - id: l1-n5
                type: true_false
                text: "Is it true? \"Ella's knees shook on the high slide.\" Ella feels scared."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Noah gave a big yawn and his eyes closed.\n\nHow does Noah feel?"
            say: "Listen. Noah gave a big yawn and his eyes closed. How does Noah feel?"
            options: [{ object: tired }, { object: scared }, { object: angry }]
            answer: tired
          - id: l1-c2
            type: image_multiple_choice
            text: "Sara cheered when she opened her present.\n\nHow does Sara feel?"
            say: "Listen. Sara cheered when she opened her present. How does Sara feel?"
            options: [{ object: happy }, { object: sad }, { object: tired }]
            answer: happy
          - id: l1-c3
            type: true_false
            text: "Is it true? You can work out a feeling from what a character does."
            answer: true

  - n: 2
    title: { de: "Was will die Figur?", en: "What does the character want?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Finn screwed up his drawing and threw it on the floor.\n\nHow does Finn feel?"
            say: "Listen. Finn screwed up his drawing and threw it on the floor. How does Finn feel?"
            options: [{ object: angry }, { object: happy }, { object: tired }]
            answer: angry
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? \"Gus smiled from ear to ear.\" Gus feels sad."
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Kemi stood on tiptoe and reached for the biscuit tin on the shelf."
            say: "The story does not say what Kemi wants. But she reaches for the biscuit tin. That clue tells us Kemi wants a biscuit."
          - text: "Josh looked at his friend's new bike. \"I wish I had one,\" he said."
            say: "Josh says: I wish I had one. He does not have a bike yet. Josh wants a bike of his own."
            show: { object: bike }
          - text: "What are they trying to do? What do they ask for?"
            say: "To work out what a character wants, look at what they try to do and what they ask for."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ali has a red ball. He looked at the kite in the shop window and said, \"Please, Mum?\"\n\nWhat does Ali want?"
                say: "Listen. Ali has a red ball. He looked at the kite in the shop window and said: Please, Mum? What does Ali want?"
                options: ["a kite", "a red ball", "a new window"]
                answer: "a kite"
                option_audio: false
                feedback:
                  "a red ball": "Ali already has a ball. What is he looking at and asking for?"
                hints:
                  - "What is Ali looking at?"
                  - "He asks for it: Please, Mum?"
                  - "A kite."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "The puppy sat by the door with its lead in its mouth.\n\nWhat does the puppy want?"
                say: "Listen. The puppy sat by the door with its lead in its mouth. What does the puppy want?"
                options: [{ object: park }, { object: bed }, { object: bathroom }]
                answer: park
                hints:
                  - "What do you use a lead for?"
                  - "Dogs go for walks on a lead."
                  - "To go out for a walk, to the park."
              - id: l2-f3
                type: multiple_choice
                text: "Rosa kept looking at the clock. \"Is it home time yet?\" she asked.\n\nWhat does Rosa want?"
                say: "Listen. Rosa kept looking at the clock. Is it home time yet? she asked. What does Rosa want?"
                options: ["to go home", "to stay longer", "a new clock"]
                answer: "to go home"
                option_audio: false
                hints:
                  - "What does she ask?"
                  - "She asks about home time."
                  - "To go home."
              - id: l2-f4
                type: multiple_choice
                text: "Dev ran to the window every time a van went by. His parcel had not come yet.\n\nWhich clue shows what Dev wants?"
                say: "Listen. Dev ran to the window every time a van went by. His parcel had not come yet. Which clue shows what Dev wants?"
                options: ["He ran to the window when a van went by.", "His name is Dev.", "There is a window."]
                answer: "He ran to the window when a van went by."
                option_audio: false
                hints:
                  - "What does Dev keep doing?"
                  - "He runs to look at every van."
                  - "He ran to the window when a van went by."
              - id: l2-f5
                type: true_false
                text: "Is it true? \"Lola licked her lips and looked at the cake.\" Lola wants some cake."
                answer: true
                hints:
                  - "Why might you lick your lips?"
                  - "She is looking at the cake."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Tia has lots of crayons. She looked all over the table. \"Where is my paper?\" she asked.\n\nWhat does Tia want?"
                say: "Listen. Tia has lots of crayons. She looked all over the table. Where is my paper? she asked. What does Tia want?"
                options: ["some paper", "more crayons", "a new table"]
                answer: "some paper"
                option_audio: false
                hints: ["She already has crayons."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Grandpa put on his trunks and grabbed a towel.\n\nWhere does Grandpa want to go?"
                say: "Listen. Grandpa put on his trunks and grabbed a towel. Where does Grandpa want to go?"
                options: [{ object: swimming-pool }, { object: library }, { object: shop }]
                answer: swimming-pool
                hints: ["What do you need trunks and a towel for?"]
              - id: l2-s3
                type: multiple_choice
                text: "The cat sat by its empty bowl and meowed and meowed.\n\nWhat does the cat want?"
                say: "Listen. The cat sat by its empty bowl and meowed and meowed. What does the cat want?"
                show: { object: cat }
                options: ["some food", "to go to sleep", "a bath"]
                answer: "some food"
                option_audio: false
                hints: ["The bowl is empty."]
              - id: l2-s4
                type: true_false
                text: "Is it true? \"Ben kept putting his hand up and saying, 'Me! Me!'\" Ben wants a turn."
                answer: true
                hints: ["What does putting your hand up mean in class?"]
              - id: l2-s5
                type: multiple_choice
                text: "Priya pulled on her wellies and grabbed her coat. She looked out at the rain.\n\nWhat does Priya want to do?"
                say: "Listen. Priya pulled on her wellies and grabbed her coat. She looked out at the rain. What does Priya want to do?"
                options: ["go out in the rain", "go to bed", "stay in and read"]
                answer: "go out in the rain"
                option_audio: false
                hints: ["Why put on wellies and a coat?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Sid has a bucket. He kept asking, \"Can I have a spade too?\"\n\nWhat does Sid want?"
                say: "Listen. Sid has a bucket. He kept asking: Can I have a spade too? What does Sid want?"
                options: ["a spade", "a bucket", "an ice cream"]
                answer: "a spade"
                option_audio: false
              - id: l2-n2
                type: image_multiple_choice
                text: "Mum took out her purse and a big shopping bag.\n\nWhere does Mum want to go?"
                say: "Listen. Mum took out her purse and a big shopping bag. Where does Mum want to go?"
                options: [{ object: supermarket }, { object: swimming-pool }, { object: school }]
                answer: supermarket
              - id: l2-n3
                type: multiple_choice
                text: "Ella read the last page and turned it over. \"Is there more?\" she asked.\n\nWhat does Ella want?"
                say: "Listen. Ella read the last page and turned it over. Is there more? she asked. What does Ella want?"
                options: ["more of the story", "to stop reading", "a drink"]
                answer: "more of the story"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? \"Omar pushed his plate away and said, 'I'm full.'\" Omar wants more food."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "The bird pulled at the twigs and carried them up into the tree.\n\nWhat does the bird want to do?"
                say: "Listen. The bird pulled at the twigs and carried them up into the tree. What does the bird want to do?"
                show: { object: bird }
                options: ["build a nest", "eat the twigs", "fly south"]
                answer: "build a nest"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Lucy's lip wobbled. Her best friend was moving away.\n\nHow does Lucy feel?"
            say: "Listen. Lucy's lip wobbled. Her best friend was moving away. How does Lucy feel?"
            options: [{ object: sad }, { object: angry }, { object: happy }]
            answer: sad
          - id: l2-c2
            type: image_multiple_choice
            text: "It was the school trip. All the children sang on the bus, but Jack gripped his seat and shut his eyes as the bus went over the high bridge.\n\nHow does Jack feel?"
            say: "Listen. It was the school trip. All the children sang on the bus, but Jack gripped his seat and shut his eyes as the bus went over the high bridge. How does Jack feel?"
            options: [{ object: scared }, { object: happy }, { object: tired }]
            answer: scared
          - id: l2-c3
            type: multiple_choice
            text: "Zara hopped from foot to foot. \"Is it my turn yet?\"\n\nWhich clue shows that Zara wants a turn?"
            say: "Listen. Zara hopped from foot to foot. Is it my turn yet? Which clue shows that Zara wants a turn?"
            options: ["She asked if it was her turn.", "Her name is Zara.", "She has feet."]
            answer: "She asked if it was her turn."
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Jake has a toy car. He pointed at the toy train and said, \"Can I play with that?\"\n\nWhat does Jake want?"
            say: "Listen. Jake has a toy car. He pointed at the toy train and said: Can I play with that? What does Jake want?"
            options: ["the toy train", "the toy car", "to go home"]
            answer: "the toy train"
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Is it true? \"Amir stamped his foot and frowned.\" Amir feels cross."
            answer: true
