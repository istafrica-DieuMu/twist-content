# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.split-digraphs
skill: lit-en.phonics.split-digraphs
curriculum: en-GB
language: en
title:
  de: Getrennte Buchstabengruppen
  en: Split digraphs
summary: >
  In a split digraph two letters make one sound, but a consonant sits
  between them: a-e in cake, i-e in kite, o-e in nose, u-e in cube, e-e in
  these. Lesson 1 takes a-e and i-e and shows how the e changes a word
  (kit, kite); lesson 2 takes o-e, u-e and e-e and ends with the skill
  check.
metadata:
  year: year-1
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.phonics.new-graphemes]
  also_practises: []
  vocabulary: { en: [split digraph, magic e, sound, read] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: a-e, what: { de: "Wörter mit a-e lesen (cake, name)", en: "reading words with a-e (cake, name)" } }
    - { id: i-e, what: { de: "Wörter mit i-e lesen (kite, time)", en: "reading words with i-e (kite, time)" } }
    - { id: o-e, what: { de: "Wörter mit o-e lesen (home, nose)", en: "reading words with o-e (home, nose)" } }
    - { id: u-e-and-e-e, what: { de: "Wörter mit u-e und e-e lesen (cube, these)", en: "reading words with u-e and e-e (cube, these)" } }
    - { id: mixed, what: { de: alle getrennten Digraphen zwischen anderen Wörtern erkennen, en: spotting split digraphs of every kind among other words } }
  misconceptions:
    - id: silent-e-ignored
      what: Reads cake as cak, kite as kit
      addressed: Learn sets word pairs (kit, kite; hop, hope) side by side; feedback on a short-vowel picture names the pair; l2-c18 asks whether rod and rode sound the same
    - id: e-sounded
      what: Sounds the final e (cake as cak-e)
      addressed: Learn says the e makes no sound of its own; it works with the vowel; l1-s4 and l2-c16 ask whether the final e makes its own sound
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "a-e und i-e", en: "a-e and i-e" }
    goal:
      de: "Lies Wörter wie cake und kite und sieh, wie ein Buchstabe am Ende kit zu kite macht."
      en: "Read words like cake and kite, and see how one letter on the end turns kit into kite."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "boy" }
            options: [{ object: boy }, { object: boat }, { object: bus }]
            answer: boy
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tap every word with ay."
            say: "Tap every word that has a and y together."
            show: { drawn: letter-card, text: "day dog say pay pin" }
            spans: ["day", "say", "pay"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "kit"
            say: "This word is kit. What do you think will happen if we put an e on the end? Will the e make a sound? Have a guess."
            show: { drawn: letter-card, text: "kit" }
          - text: "kit → kite"
            say: "Kit has the short sound i. Add an e at the end and the i changes to igh: kite! The e makes no sound of its own."
            show: { object: kite }
          - text: "cake"
            say: "Look at cake. The a and the e work together to make the sound ay, even though the k is between them. That is a split digraph: c ... ay ... k."
            show: { object: cake }
          - text: "a-e   i-e"
            say: "When you see a, then one letter, then e, try the sound ay. When you see i, then one letter, then e, try the sound igh."
          - text: "Did you know? A snake can't blink."
            say: "Did you know? Snake has a split digraph: a, k, e. And a snake has no eyelids, so it can never blink. It even sleeps with its eyes open!"
            show: { object: snake }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "snake" }
                options: [{ object: snake }, { object: snail }, { object: sock }]
                answer: snake
                hints:
                  - "Find the a and the e."
                  - "a-e says ay: sn ... ay ... k."
                  - "Snake."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "kite" }
                options: [{ object: kite }, { object: knife }, { object: cat }]
                answer: kite
                feedback:
                  cat: "Cat has no e. Kite has i-e, which says igh."
                hints:
                  - "i-e says igh."
                  - "k ... igh ... t."
                  - "Kite."
              - id: l1-f3
                type: fill_in_blank
                text: "Add the letter that changes the word."
                say: "Which letter turns kit into kite?"
                show: { object: kite }
                frame: "kit_"
                options: ["e", "a", "y"]
                answer: ["e"]
                hints:
                  - "Kite ends with a letter you do not hear."
                  - "It changes i to igh."
                  - "e."
              - id: l1-f4
                type: true_false
                text: "Is it true? The word cap with an e on the end says cape."
                answer: true
                hints:
                  - "a-e says ay."
                  - "c ... ay ... p."
                  - "Yes, cape."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap every word with a-e."
                say: "Tap every word that has a, then one letter, then e."
                show: { drawn: letter-card, text: "make man came gate got" }
                spans: ["make", "came", "gate"]
                hints:
                  - "Look for a word that ends in e with an a before it."
                  - "Man and got have no e."
                  - "make, came and gate."
              - id: l1-f6
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "bike" }
                options: [{ object: bike }, { object: bee }, { object: book }]
                answer: bike
                hints:
                  - "i-e says igh."
                  - "b ... igh ... k."
                  - "Bike."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "cake" }
                options: [{ object: cat }, { object: cake }, { object: car }]
                answer: cake
                hints: ["a-e says ay."]
              - id: l1-s2
                type: multiple_choice
                text: "Which word has the ay sound?"
                say: "Which word has the ay sound? Read them yourself."
                options: ["tap", "tape"]
                answer: "tape"
                option_audio: false
                hints: ["Look for the e at the end."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap every word with i-e."
                say: "Tap every word that has i, then one letter, then e."
                show: { drawn: letter-card, text: "like pin time ride rid" }
                spans: ["like", "time", "ride"]
                hints: ["Three words end in e."]
              - id: l1-s4
                type: true_false
                text: "Is it true? In cake, the e at the end makes its own sound."
                answer: false
                hints: ["c ... ay ... k."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "whale" }
                options: [{ object: whale }, { object: wave }, { object: duck }]
                answer: whale
                feedback:
                  duck: "Quack! A duck is much too small. Read the word: wh ... ay ... l."
                hints: ["a-e says ay."]
              - id: l1-s6
                type: fill_in_blank
                text: "Add the letter that changes the word."
                say: "Which letter turns pin into pine?"
                frame: "pin_"
                options: ["e", "a", "o"]
                answer: ["e"]
                hints: ["The letter you do not hear."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "kite" }
                options: [{ object: kite }, { object: cake }, { object: knife }]
                answer: kite
              - id: l1-n2
                type: multiple_choice
                text: "Which word has the igh sound?"
                say: "Which word has the igh sound? Read them yourself."
                options: ["bite", "bit"]
                answer: "bite"
                option_audio: false
              - id: l1-n3
                type: highlight_in_text
                text: "Tap every word with a-e."
                say: "Tap every word that has a, then one letter, then e."
                show: { drawn: letter-card, text: "game hat lake had name" }
                spans: ["game", "lake", "name"]
              - id: l1-n4
                type: true_false
                text: "Is it true? Add e to hid and you get hide."
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "snake" }
                options: [{ object: snail }, { object: snake }, { object: star }]
                answer: snake

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "bike" }
            options: [{ object: bike }, { object: bus }, { object: bell }]
            answer: bike
          - id: l1-c2
            type: multiple_choice
            text: "Which word has the ay sound?"
            say: "Which word has the ay sound? Read them yourself."
            options: ["mad", "made"]
            answer: "made"
            option_audio: false
          - id: l1-c3
            type: highlight_in_text
            text: "Tap every word with i-e."
            say: "Tap every word that has i, then one letter, then e."
            show: { drawn: letter-card, text: "five fin wide win line" }
            spans: ["five", "wide", "line"]
          - id: l1-c4
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "wave" }
            options: [{ object: wave }, { object: whale }, { object: witch }]
            answer: wave
          - id: l1-c5
            type: true_false
            text: "Is it true? Both words have the igh sound."
            say: "Read the two words yourself. Is it true? Both words have the igh sound."
            show: { drawn: letter-card, text: "bike bit" }
            answer: false
          - id: l1-c6
            type: fill_in_blank
            text: "Fill the gaps to make the word for the picture."
            show: { object: snake }
            frame: "sn_k_"
            options: ["a", "i", "o", "e"]
            answer: ["a", "e"]

  - n: 2
    title: { de: "o-e, u-e und e-e", en: "o-e, u-e and e-e" }
    goal:
      de: "Lies noch mehr Wörter wie nose, cube und these und hör, wie aus hop das Wort hope wird."
      en: "Read more words like nose, cube and these, and hear how hop becomes hope."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "cake" }
            options: [{ object: cake }, { object: car }, { object: cat }]
            answer: cake
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which word has the igh sound?"
            say: "Which word has the igh sound? Read them yourself."
            options: ["kit", "kite"]
            answer: "kite"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "hop"
            say: "You know that kit with an e on the end becomes kite. What do you think hop becomes with an e on the end? Have a guess."
            show: { drawn: letter-card, text: "hop" }
          - text: "nose"
            say: "Hop with an e becomes hope! O and e split by a letter say oh. Here is another one: n ... oh ... z. Nose."
            show: { object: nose }
          - text: "cube"
            say: "U and e split by a letter say yoo: c ... yoo ... b. Cube. Tub with an e becomes tube. U-e can also say oo, as in rule."
            show: { object: cube }
          - text: "these"
            say: "E and e split by a letter say ee: th ... ee ... z. These. This one is rare, but now you know it."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "nose" }
                options: [{ object: nose }, { object: knife }, { object: leg }]
                answer: nose
                hints:
                  - "o-e says oh."
                  - "n ... oh ... z."
                  - "Nose."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "cube" }
                options: [{ object: cup }, { object: cube }, { object: cake }]
                answer: cube
                feedback:
                  cup: "Cup has no e at the end. Cube has u-e, which says yoo."
                hints:
                  - "u-e says yoo."
                  - "c ... yoo ... b."
                  - "Cube."
              - id: l2-f3
                type: true_false
                text: "Is it true? Hop with an e on the end says hope."
                answer: true
                hints:
                  - "o-e says oh."
                  - "h ... oh ... p."
                  - "Yes, hope."
              - id: l2-f4
                type: highlight_in_text
                text: "Tap every word with o-e."
                say: "Tap every word that has o, then one letter, then e."
                show: { drawn: letter-card, text: "home hot bone rose rod" }
                spans: ["home", "bone", "rose"]
                hints:
                  - "Look for an e at the end with an o before it."
                  - "Hot and rod have no e."
                  - "home, bone and rose."
              - id: l2-f5
                type: multiple_choice
                text: "Which word has the yoo sound?"
                say: "Which word has the yoo sound? Read them yourself."
                options: ["cub", "cube"]
                answer: "cube"
                option_audio: false
                hints:
                  - "Look for the e at the end."
                  - "u-e says yoo."
                  - "Cube."
              - id: l2-f6
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "rose" }
                options: [{ object: rose }, { object: nose }, { object: rabbit }]
                answer: rose
                feedback:
                  nose: "You can smell a rose with your nose! But this word starts with r: r ... oh ... z."
                hints:
                  - "o-e says oh."
                  - "r ... oh ... z."
                  - "Rose."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "telephone" }
                options: [{ object: telephone }, { object: tree }, { object: table }]
                answer: telephone
                hints: ["The end is o-e: phone."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap every word with u-e."
                say: "Tap every word that has u, then one letter, then e."
                show: { drawn: letter-card, text: "tune tub cute rule run" }
                spans: ["tune", "cute", "rule"]
                hints: ["Three words."]
              - id: l2-s3
                type: multiple_choice
                text: "Which word has the oh sound?"
                say: "Which word has the oh sound? Read them yourself."
                options: ["not", "note"]
                answer: "note"
                option_audio: false
                hints: ["Look for the e."]
              - id: l2-s4
                type: true_false
                text: "Is it true? In these, the letters e-e say ee."
                answer: true
                hints: ["th ... ee ... z."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "nose" }
                options: [{ object: mouse }, { object: nose }, { object: house }]
                answer: nose
                hints: ["o-e says oh."]
              - id: l2-s6
                type: fill_in_blank
                text: "Add the letter that changes the word."
                say: "Which letter turns tub into tube?"
                frame: "tub_"
                options: ["e", "a", "y"]
                answer: ["e"]
                hints: ["The letter you do not hear."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "cube" }
                options: [{ object: cube }, { object: cup }, { object: crayon }]
                answer: cube
              - id: l2-n2
                type: highlight_in_text
                text: "Tap every word with a split digraph."
                say: "Tap every word with a split digraph, like a-e, i-e, o-e or u-e."
                show: { drawn: letter-card, text: "home cat time dog cute" }
                spans: ["home", "time", "cute"]
              - id: l2-n3
                type: multiple_choice
                text: "Which word has the oh sound?"
                say: "Which word has the oh sound? Read them yourself."
                options: ["rob", "robe"]
                answer: "robe"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? Cub with an e on the end says cube."
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "rose" }
                options: [{ object: rose }, { object: rabbit }, { object: nose }]
                answer: rose

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: a-e
            type: multiple_choice
            text: "Which word has the ay sound?"
            say: "Which word has the ay sound? Read them yourself."
            options: ["cane", "can"]
            answer: "cane"
            option_audio: false
          - id: l2-c2
            part: i-e
            type: multiple_choice
            text: "Which word has the igh sound?"
            say: "Which word has the igh sound? Read them yourself."
            options: ["pip", "pipe"]
            answer: "pipe"
            option_audio: false
          - id: l2-c3
            part: o-e
            type: multiple_choice
            text: "Which word has the oh sound?"
            say: "Which word has the oh sound? Read them yourself."
            options: ["cod", "code"]
            answer: "code"
            option_audio: false
          - id: l2-c4
            part: mixed
            type: highlight_in_text
            text: "Tap every word with a split digraph."
            show: { drawn: letter-card, text: "came cut bike bone bit" }
            spans: ["came", "bike", "bone"]
          - id: l2-c5
            part: u-e-and-e-e
            type: multiple_choice
            text: "Which word has the yoo sound?"
            say: "Which word has the yoo sound? Read them yourself."
            options: ["cute", "cut"]
            answer: "cute"
            option_audio: false
          - id: l2-c6
            part: a-e
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "pancake" }
            options: [{ object: cake }, { object: crepe }, { object: pasta }]
            answer: crepe
            difficulty: stretch
          - id: l2-c7
            part: i-e
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "crocodile" }
            options: [{ object: crab }, { object: crocodile }, { object: crown }]
            answer: crocodile
            difficulty: stretch
          - id: l2-c8
            part: o-e
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "stone" }
            options: [{ object: star }, { object: sock }, { object: stone }]
            answer: stone
          - id: l2-c9
            part: u-e-and-e-e
            type: highlight_in_text
            text: "Tap every word with e-e."
            say: "Tap every word that has e, then one letter, then e."
            show: { drawn: letter-card, text: "these then complete theme them" }
            spans: ["these", "complete", "theme"]
          - id: l2-c10
            part: mixed
            type: true_false
            text: "Is it true? All three words have a split digraph."
            say: "Read the three words yourself. Is it true? All three words have a split digraph."
