            show: { drawn: letter-card, text: "Pete pet" }
            answer: true
          - id: l2-c20
            part: mixed
            type: highlight_in_text
            text: "Tap every word with a split digraph."
            show: { drawn: letter-card, text: "Kate rode her bike to the lake." }
            spans: ["Kate", "rode", "bike", "lake"]
