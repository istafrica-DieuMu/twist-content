# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.alphabet-names
skill: lit-en.spelling.alphabet-names
curriculum: en-GB
language: en
title:
  de: Das Alphabet und die Buchstabennamen
  en: The alphabet and letter names
summary: >
  Every letter has a sound and a name. Lesson 1 learns the letter names
  and the alphabet in order (what comes before, after and between);
  lesson 2 uses letter names to talk about different spellings of the
  same sound (A, I in rain and A, Y in play; E, E and E, A; O, A and
  O, W; I, R, U, R and E, R) and ends with the skill check. The check
  marks letter names, their order and spellings on screen; saying the
  whole alphabet aloud waits for marked speech.
metadata:
  year: year-1
  topic: { de: "Rechtschreibung", en: "Spelling" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.phonics.ear-air-ure-er]
  also_practises: []
  vocabulary: { en: [alphabet, letter, letter name, sound, spell, before, after, between, first, last] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: letter-names, what: { de: Buchstaben an ihrem Namen erkennen, en: knowing letters by their names } }
    - { id: order, what: { de: "das Alphabet der Reihe nach (vor, nach, zwischen)", en: "the alphabet in order (before, after, between)" } }
    - { id: spellings, what: { de: "mit Buchstabennamen sagen, wie ein Laut geschrieben ist (ai, ay; ee, ea)", en: "using letter names to say how a sound is spelt (ai, ay; ee, ea)" } }
  misconceptions:
    - id: name-or-sound
      what: Gives a letter's sound when its name is asked for, and mixes up names that sound alike (G and J, Y and W)
      addressed: lesson 1 Learn sets the sound of c beside its name; l1-f3 with feedback, l1-s3, l1-n3, l2-c2
    - id: alphabet-neighbours
      what: Swaps or skips neighbouring letters in the alphabet (puts n before m)
      addressed: l1-f4 with feedback, l1-s5, l1-n4 and the ordering tasks in every stage
    - id: one-spelling-per-sound
      what: Thinks a sound has only one spelling (ee is always E, E)
      addressed: lesson 2 Learn shows two or three spellings for each sound; l2-f3 with feedback, l2-f5 with feedback, l2-s3, l2-n5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Das Alphabet der Reihe nach", en: "The alphabet in order" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "chair" }
            options: [{ object: cheese }, { object: chair }, { object: ear }]
            answer: chair
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tap every word with air."
            say: "Tap every word that has the air sound."
            show: { drawn: letter-card, text: "fair hat pair chip hair" }
            spans: ["fair", "pair", "hair"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "a b c d e f g h i j k l m"
            say: "Every letter has a sound and a name. The sound helps you read. The name helps you talk about spelling. Here are the first thirteen letters of the alphabet, said by their names: A, B, C, D, E, F, G, H, I, J, K, L, M."
            show: { drawn: letter-card, text: "a b c d e f g h i j k l m" }
          - text: "n o p q r s t u v w x y z"
            say: "Here are the last thirteen: N, O, P, Q, R, S, T, U, V, W, X, Y, Z. That is the whole alphabet, in order. It has twenty-six letters."
            show: { drawn: letter-card, text: "n o p q r s t u v w x y z" }
          - text: "Cc   cat"
            say: "This letter makes the first sound in cat. Its name is C. When you spell cat out loud, you say the names: C, A, T."
            show: { drawn: letter-card, text: "Cc" }
          - text: "k l m"
            say: "Look at these three letters: K, L, M. K comes before L. M comes after L. L is between K and M."
            show: { drawn: letter-card, text: "k l m" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Put the letters in alphabetical order."
                say: "Put the letters in alphabetical order."
                options: ["c", "a", "d", "b"]
                slot_count: 4
                answer: ["a", "b", "c", "d"]
                option_audio: false
                hints:
                  - "Say the alphabet from the start."
                  - "A is first. Which letter comes next?"
                  - "a, b, c, d."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which letter comes next?"
                say: "Say the letters. Which letter comes next?"
                frame: "f g h _"
                options: ["i", "j", "k"]
                answer: ["i"]
                hints:
                  - "Say the alphabet from f."
                  - "F, G, H, then the next one."
                  - "I comes after H."
              - id: l1-f3
                type: audio_choice
                text: "Tap the letter you hear."
                say: "Listen to the letter name. Tap the letter."
                audio: { en: "G." }
                options: ["j", "g", "d"]
                answer: "g"
                feedback:
                  "j": "The name you heard rhymes with bee. The name of J rhymes with day."
                hints:
                  - "Listen again. Does the name rhyme with bee or with day?"
                  - "It rhymes with bee. It comes after F in the alphabet."
                  - "Tap g."
              - id: l1-f4
                type: multiple_choice
                text: "Which letter comes before m?"
                say: "Which letter comes just before the letter M?"
                options: ["n", "l", "k"]
                answer: "l"
                option_audio: false
                feedback:
                  "n": "N comes after M. Say the alphabet up to M and listen to the letter just before it."
                hints:
                  - "Before means just in front of it."
                  - "Say the alphabet: ... J, K, L, M."
                  - "L comes just before M."
              - id: l1-f5
                type: true_false
                text: "Is it true? The name of b sounds like the word bee."
                say: "Is it true? The name of the letter b sounds like the word bee."
                show: { drawn: letter-card, text: "b" }
                answer: true
                hints:
                  - "Say the alphabet: A, B, C."
                  - "B is the second name you say."
                  - "Yes. B sounds like bee."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Put the letters in alphabetical order."
                say: "Put the letters in alphabetical order."
                options: ["p", "n", "o", "q"]
                slot_count: 4
                answer: ["n", "o", "p", "q"]
                option_audio: false
                hints: ["N is the first of these. Say the alphabet from N."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Say the letters. Which letter goes in the gap?"
                frame: "s t _ v"
                options: ["u", "w", "r"]
                answer: ["u"]
                hints: ["Say the alphabet from S."]
              - id: l1-s3
                type: audio_choice
                text: "Tap the letter you hear."
                say: "Listen to the letter name. Tap the letter."
                audio: { en: "Y." }
                options: ["w", "i", "y"]
                answer: "y"
                hints: ["The name you heard sounds like the word why."]
              - id: l1-s4
                type: true_false
                text: "Is it true? Z is the first letter of the alphabet."
                answer: false
                hints: ["How does the alphabet start?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which letter comes after r?"
                say: "Which letter comes just after the letter R?"
                options: ["q", "s", "t"]
                answer: "s"
                option_audio: false
                hints: ["After means the next one. Say the alphabet from Q."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Put the letters in alphabetical order."
                say: "Put the letters in alphabetical order."
                options: ["k", "h", "j", "i"]
                slot_count: 4
                answer: ["h", "i", "j", "k"]
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Say the letters. Which letter goes in the gap?"
                frame: "w x _ z"
                options: ["y", "v", "u"]
                answer: ["y"]
              - id: l1-n3
                type: audio_choice
                text: "Tap the letter you hear."
                say: "Listen to the letter name. Tap the letter."
                audio: { en: "E." }
                options: ["a", "e", "i"]
                answer: "e"
              - id: l1-n4
                type: multiple_choice
                text: "Which letter comes between d and f?"
                say: "Which letter comes between the letters D and F?"
                options: ["c", "g", "e"]
                answer: "e"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? The alphabet has 26 letters."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: ordering
            text: "Put the letters in alphabetical order."
            say: "Put the letters in alphabetical order."
            options: ["t", "r", "s", "u"]
            slot_count: 4
            answer: ["r", "s", "t", "u"]
            option_audio: false
          - id: l1-c2
            type: audio_choice
            text: "Tap the letter you hear."
            say: "Listen to the letter name. Tap the letter."
            audio: { en: "H." }
            options: ["k", "h", "a"]
            answer: "h"
          - id: l1-c3
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Say the letters. Which letter goes in the gap?"
            frame: "l m _ o"
            options: ["n", "p", "k"]
            answer: ["n"]
          - id: l1-c4
            type: multiple_choice
            text: "Which letter comes before t?"
            say: "Which letter comes just before the letter T?"
            options: ["u", "s", "r"]
            answer: "s"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? y comes after z in the alphabet."
            say: "Is it true? Y comes after Z in the alphabet."
            answer: false
          - id: l1-c6
            type: audio_choice
            text: "Tap the letter you hear."
            say: "Listen to the letter name. Tap the letter."
            audio: { en: "B." }
            options: ["d", "p", "b"]
            answer: "b"

  - n: 2
    title: { de: "Ein Laut, verschiedene Schreibweisen", en: "One sound, different spellings" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Put the letters in alphabetical order."
            say: "Put the letters in alphabetical order."
            options: ["e", "c", "b", "d"]
            slot_count: 4
            answer: ["b", "c", "d", "e"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Tap the letter you hear."
            say: "Listen to the letter name. Tap the letter."
            audio: { en: "M." }
            options: ["n", "w", "m"]
            answer: "m"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "rain   play"
            say: "Rain and play both have the ay sound. In rain, it is spelt A, I. In play, it is spelt A, Y. Letter names help us say which letters we mean."
            show: { drawn: letter-card, text: "rain play" }
          - text: "tree   leaf"
            say: "Tree and leaf both have the ee sound. In tree, it is spelt E, E. In leaf, it is spelt E, A."
            show: { drawn: letter-card, text: "tree leaf" }
          - text: "boat   snow"
            say: "Boat and snow both have the oh sound. In boat, it is spelt O, A. In snow, it is spelt O, W."
            show: { drawn: letter-card, text: "boat snow" }
          - text: "bird   fur   her"
            say: "Bird, fur and her all have the er sound. It is spelt I, R in bird, U, R in fur, and E, R in her."
            show: { drawn: letter-card, text: "bird fur her" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which letters spell the ay sound?"
                say: "Read the word on the card. Which letters spell the ay sound?"
                show: { drawn: letter-card, text: "play" }
                options: ["a, y", "a, i", "a, e"]
                answer: "a, y"
                option_audio: false
                hints:
                  - "Look at the end of the word."
                  - "The ay sound comes after p, l. Which two letters are there?"
                  - "A, Y."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Sort the words by how the ay sound is spelt."
                say: "Read each word. Is the ay sound spelt A, I, or A, Y? Put it in the right group."
                option_audio: false
                bins:
                  - { id: ai, show: { text: "ai" }, say: "A, I" }
                  - { id: ay, show: { text: "ay" }, say: "A, Y" }
                options:
                  - { text: "rain", bin: ai }
                  - { text: "day", bin: ay }
                  - { text: "wait", bin: ai }
                  - { text: "say", bin: ay }
                hints:
                  - "Look for the a in each word. Which letter comes after it?"
                  - "A, Y often comes at the end of a word. A, I comes in the middle."
                  - "Rain and wait go with A, I. Day and say go with A, Y."
              - id: l2-f3
                type: audio_choice
                text: "Tap the spelling you hear."
                say: "Listen to the letter names. Tap the spelling."
                audio: { en: "E, A." }
                options: ["ee", "ea", "ai"]
                answer: "ea"
                feedback:
                  "ee": "E, E would be the same letter twice. You heard E, then A."
                hints:
                  - "Listen to the first letter name, then the second."
                  - "The first is E. The second is the first letter of the alphabet."
                  - "Tap ea."
              - id: l2-f4
                type: true_false
                text: "Is it true? In boat, the oh sound is spelt o, a."
                say: "Is it true? In boat, the oh sound is spelt O, A."
                show: { drawn: letter-card, text: "boat" }
                answer: true
                hints:
                  - "Find the letters between b and t."
                  - "Say their names one at a time."
                  - "Yes. O, A."
              - id: l2-f5
                type: multiple_choice
                text: "Which letters spell the er sound?"
                say: "Read the word on the card. Which letters spell the er sound?"
                show: { drawn: letter-card, text: "bird" }
                options: ["e, r", "i, r", "u, r"]
                answer: "i, r"
                option_audio: false
                feedback:
                  "e, r": "E, R spells the er sound in her. Look at the word on the card again."
                hints:
                  - "Look at the middle of the word."
                  - "The er sound comes after b. Which two letters are there?"
                  - "I, R."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which letters spell the oh sound?"
                say: "Read the word on the card. Which letters spell the oh sound?"
                show: { drawn: letter-card, text: "snow" }
                options: ["o, a", "o, w", "o, e"]
                answer: "o, w"
                option_audio: false
                hints: ["Look at the end of the word."]
              - id: l2-s2
                type: audio_choice
                text: "Tap the spelling you hear."
                say: "Listen to the letter names. Tap the spelling."
                audio: { en: "A, I." }
                options: ["ay", "ia", "ai"]
                answer: "ai"
                hints: ["You heard A first, then I."]
              - id: l2-s3
                type: true_false
                text: "Is it true? In leaf, the ee sound is spelt e, e."
                say: "Is it true? In leaf, the ee sound is spelt E, E."
                show: { drawn: letter-card, text: "leaf" }
                answer: false
                hints: ["Look at the two letters after l."]
              - id: l2-s4
                type: sorting
                text: "Sort the words by how the oh sound is spelt."
                say: "Read each word. Is the oh sound spelt O, A, or O, W? Put it in the right group."
                option_audio: false
                bins:
                  - { id: oa, show: { text: "oa" }, say: "O, A" }
                  - { id: ow, show: { text: "ow" }, say: "O, W" }
                options:
                  - { text: "coat", bin: oa }
                  - { text: "grow", bin: ow }
                  - { text: "road", bin: oa }
                  - { text: "slow", bin: ow }
                hints: ["Look for the o in each word. Which letter comes after it?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which letters spell the er sound?"
                say: "Read the word on the card. Which letters spell the er sound?"
                show: { drawn: letter-card, text: "fur" }
                options: ["i, r", "e, r", "u, r"]
                answer: "u, r"
                option_audio: false
                hints: ["Look at the letters after f."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which letters spell the ee sound?"
                say: "Read the word on the card. Which letters spell the ee sound?"
                show: { drawn: letter-card, text: "tree" }
                options: ["e, a", "e, e", "i, e"]
                answer: "e, e"
                option_audio: false
              - id: l2-n2
                type: audio_choice
                text: "Tap the spelling you hear."
                say: "Listen to the letter names. Tap the spelling."
                audio: { en: "O, W." }
                options: ["oa", "wo", "ow"]
                answer: "ow"
              - id: l2-n3
                type: true_false
                text: "Is it true? In her, the er sound is spelt e, r."
                say: "Is it true? In her, the er sound is spelt E, R."
                show: { drawn: letter-card, text: "her" }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Which letters spell the ay sound?"
                say: "Read the word on the card. Which letters spell the ay sound?"
                show: { drawn: letter-card, text: "tail" }
                options: ["a, y", "a, i", "e, y"]
                answer: "a, i"
                option_audio: false
              - id: l2-n5
                type: sorting
                text: "Sort the words by how the ee sound is spelt."
                say: "Read each word. Is the ee sound spelt E, E, or E, A? Put it in the right group."
                option_audio: false
                bins:
                  - { id: ee, show: { text: "ee" }, say: "E, E" }
                  - { id: ea, show: { text: "ea" }, say: "E, A" }
                options:
                  - { text: "feet", bin: ee }
                  - { text: "meat", bin: ea }
                  - { text: "see", bin: ee }
                  - { text: "sea", bin: ea }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: order
            type: ordering
            text: "Put the letters in alphabetical order."
            say: "Put the letters in alphabetical order."
            options: ["x", "v", "y", "w"]
            slot_count: 4
            answer: ["v", "w", "x", "y"]
            option_audio: false
          - id: l2-c2
            part: letter-names
            type: audio_choice
            text: "Tap the letter you hear."
            say: "Listen to the letter name. Tap the letter."
            audio: { en: "J." }
            options: ["g", "y", "j"]
            answer: "j"
          - id: l2-c3
            part: order
            type: multiple_choice
            text: "Which letter comes after k?"
            say: "Which letter comes just after the letter K?"
            options: ["j", "l", "m"]
            answer: "l"
            option_audio: false
          - id: l2-c4
            part: spellings
            type: multiple_choice
            text: "Which letters spell the oh sound?"
            say: "Read the word on the card. Which letters spell the oh sound?"
            show: { drawn: letter-card, text: "goat" }
            options: ["o, w", "o, e", "o, a"]
            answer: "o, a"
            option_audio: false
          - id: l2-c5
            part: spellings
            type: audio_choice
            text: "Tap the spelling you hear."
            say: "Listen to the letter names. Tap the spelling."
            audio: { en: "U, R." }
            options: ["er", "ir", "ur"]
            answer: "ur"
          - id: l2-c6
            part: order
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Which letter goes in the gap?"
            frame: "p q _ s"
            options: ["t", "r", "o"]
            answer: ["r"]
          - id: l2-c7
            part: order
            type: multiple_choice
            text: "Which letter comes before h?"
            say: "Which letter comes just before the letter H?"
            options: ["i", "f", "g"]
            answer: "g"
            option_audio: false
          - id: l2-c8
            part: order
            type: ordering
            text: "Put the letters in alphabetical order."
            say: "Put the letters in alphabetical order."
            options: ["j", "f", "m", "b"]
            slot_count: 4
            answer: ["b", "f", "j", "m"]
            option_audio: false
            difficulty: stretch
          - id: l2-c9
            part: order
            type: true_false
            text: "Is it true? m comes before n in the alphabet."
            say: "Is it true? M comes before N in the alphabet."
            answer: true
          - id: l2-c10
            part: order
            type: multiple_choice
            text: "Which letter comes between o and q?"
            say: "Which letter comes between the letters O and Q?"
            options: ["r", "p", "n"]
            answer: "p"
            option_audio: false
          - id: l2-c11
            part: letter-names
            type: audio_choice
            text: "Tap the letter you hear."
            say: "Listen to the letter name. Tap the letter."
            audio: { en: "W." }
            options: ["v", "y", "w"]
            answer: "w"
          - id: l2-c12
            part: letter-names
            type: audio_choice
            text: "Tap the letter you hear."
            say: "Listen to the letter name. Tap the letter."
            audio: { en: "I." }
            options: ["i", "y", "e"]
            answer: "i"
          - id: l2-c13
            part: letter-names
            type: true_false
            text: "Is it true? The name of this letter sounds like the word oh."
            show: { drawn: letter-card, text: "o" }
            answer: true
          - id: l2-c14
            part: letter-names
            type: multiple_choice
            text: "Which letter has a name that sounds like the word you?"
            options: ["o", "u", "y"]
            answer: "u"
          - id: l2-c15
            part: letter-names
            type: multiple_choice
            text: "Which letter has a name that sounds like the word tea?"
            options: ["d", "p", "t"]
            answer: "t"
          - id: l2-c16
            part: spellings
            type: multiple_choice
            text: "Which letters spell the ee sound?"
            say: "Read the word on the card. Which letters spell the ee sound?"
            show: { drawn: letter-card, text: "seat" }
            options: ["e, e", "a, i", "e, a"]
            answer: "e, a"
            option_audio: false
          - id: l2-c17
            part: spellings
            type: sorting
            text: "Sort the words by how the er sound is spelt."
            say: "Read each word. Is the er sound spelt I, R, or U, R? Put it in the right group."
            option_audio: false
            bins:
              - { id: ir, show: { text: "ir" }, say: "I, R" }
              - { id: ur, show: { text: "ur" }, say: "U, R" }
            options:
              - { text: "turn", bin: ur }
              - { text: "girl", bin: ir }
              - { text: "hurt", bin: ur }
              - { text: "first", bin: ir }
          - id: l2-c18
            part: spellings
            type: audio_choice
            text: "Tap the spelling you hear."
            say: "Listen to the letter names. Tap the spelling."
            audio: { en: "I, R." }
            options: ["ri", "er", "ir"]
            answer: "ir"
          - id: l2-c19
            part: spellings
