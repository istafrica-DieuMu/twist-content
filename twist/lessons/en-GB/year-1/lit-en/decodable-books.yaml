# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.decodable-books
skill: lit-en.word-reading.decodable-books
curriculum: en-GB
language: en
title:
  de: Bücher mit bekannten Lauten lesen
  en: Reading my phonics books
summary: >
  Two short Twist books written only with sounds a Year 1 child knows:
  Sam and the Red Bus (lesson 1) and Meg and Kit the cat (lesson 2). The
  child reads each page, answers about it, builds its sentences, reads it
  aloud and hears the model, and learns that re-reading makes reading
  smoother: pause at a full stop, join the words up, read it until it
  sounds like talking. Lesson 2 ends with the skill check; reading aloud
  is practised but not marked.
metadata:
  year: year-1
  topic: { de: "Wörter lesen", en: "Reading words" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.word-reading.first-sentences]
  also_practises: []
  vocabulary: { en: [book, page, sentence, full stop, read again, smooth] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: word-by-word
      what: Reads word by word like a robot and runs on past full stops, so the meaning is lost
      addressed: "Learn screen 2 of lesson 2; full-stop tasks l1-f4, l1-s4, l1-c3, l2-w2, l2-f5, l2-n2 and l2-c3; l2-f4 sets smooth against robot reading"
    - id: rereading-is-for-mistakes
      what: Thinks reading a book again is only for children who got it wrong
      addressed: "Learn screen 3 of each lesson; l1-f5, l1-s5, l2-s5, l2-n3 and l2-c4 ask about it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Sam und der rote Bus", en: "Sam and the Red Bus" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the sentence. Tap the picture."
            say: "Read the sentence yourself. Then tap the picture."
            show: { drawn: letter-card, text: "The pig is in the mud." }
            options: [{ object: pig }, { object: dog }, { object: fish }]
            answer: pig
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Read the sentence. Tap the picture."
            say: "Read the sentence yourself. Then tap the picture."
            show: { drawn: letter-card, text: "I can see a red hen and a duck." }
            options: [{ object: duck }, { object: frog }, { object: cat }]
            answer: duck
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Sam is at the bus stop. The bus is red."
            say: "Here is a page from a book that uses sounds you know. Point to each word as you read it. If a word is tricky, sound it out and blend it: b, u, s, bus."
            show: { object: bus }
          - text: "Sam gets on the bus. The bus stops at the shop."
            say: "After you sound out a word, read the whole sentence again, so it makes sense."
          - text: "Read it again!"
            say: "Good readers read a book more than once. The second time the words come quicker, and the third time it sounds like talking."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Sam is at the bus stop. The bus is red.\n\nWhat colour is the bus?"
                say: "Read the page yourself. Then answer: what colour is the bus?"
                show: { object: bus }
                options: ["red", "green", "blue"]
                answer: "red"
                hints:
                  - "Find the word bus in the second sentence."
                  - "Read the word after is: r, e, d."
                  - "Red."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Read the sentence. What does Sam get on?"
                say: "Read the sentence yourself. What does Sam get on?"
                show: { drawn: letter-card, text: "Sam gets on the bus." }
                options: [{ object: bus }, { object: boat }, { object: bike }]
                answer: bus
                hints:
                  - "Look at the last word."
                  - "Sound it out: b, u, s."
                  - "The bus."
              - id: l1-f3
                type: ordering
                text: "Build a sentence from the book."
                say: "Build the sentence from the book. Read the cards yourself."
                options: ["the bus.", "Sam", "gets on"]
                slot_count: 3
                answer: ["Sam", "gets on", "the bus."]
                option_audio: false
                hints:
                  - "A sentence starts with a capital letter."
                  - "Sam comes first. The full stop comes at the end."
                  - "Sam, gets on, the bus."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the word at the end of the first sentence. Take a little breath there."
                say: "Read the page. Tap the last word of the first sentence. That is where you take a little breath."
                show: { drawn: letter-card, text: "The bus stops. Sam gets off." }
                spans: ["stops"]
                hints:
                  - "Look for the first full stop."
                  - "The full stop comes straight after a word."
                  - "Stops."
              - id: l1-f5
                type: true_false
                text: "Is it true? When you read a book again, the words come quicker."
                answer: true
                hints:
                  - "Think of a book you have read lots of times."
                  - "You know the words, so you do not need to sound them all out."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Sam gets off at the shop. He gets a hat.\n\nWhat does Sam get?"
                say: "Read the page yourself. What does Sam get?"
                options: ["a hat", "a bus", "a cup"]
                answer: "a hat"
                hints: ["Read the second sentence."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Read the sentence. Tap the picture."
                say: "Read the sentence yourself. Then tap the picture."
                show: { drawn: letter-card, text: "The hat is big and red." }
                options: [{ object: hat }, { object: cat }, { object: hand }]
                answer: hat
                hints: ["Sound out the second word: h, a, t."]
              - id: l1-s3
                type: speak
                text: "Sam is at the bus stop. The bus is red.\n\nRead the page out loud."
                say: "Read the page out loud. Then listen and check."
                expected_text: "Sam is at the bus stop. The bus is red."
                hints: ["Point to each word as you read it."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the word at the end of the first sentence."
                say: "Read the page. Tap the last word of the first sentence."
                show: { drawn: letter-card, text: "Sam has a hat. It is red." }
                spans: ["hat"]
                hints: ["Find the first full stop."]
              - id: l1-s5
                type: true_false
                text: "Is it true? You only read a book again if you got it wrong."
                answer: false
                hints: ["Do good readers read a book more than once?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Sam runs to the park. He sits on a bench.\n\nWhere does Sam sit?"
                say: "Read the page yourself. Where does Sam sit?"
                options: ["on a bench", "on a bus", "on a bed"]
                answer: "on a bench"
              - id: l1-n2
                type: ordering
                text: "Build a sentence from the book."
                say: "Build the sentence from the book. Read the cards yourself."
                options: ["a big hat.", "has", "Sam"]
                slot_count: 3
                answer: ["Sam", "has", "a big hat."]
                option_audio: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Read the sentence. Tap the picture."
                say: "Read the sentence yourself. Then tap the picture."
                show: { drawn: letter-card, text: "A duck swims in the pond." }
                options: [{ object: duck }, { object: dog }, { object: fish }]
                answer: duck
              - id: l1-n4
                type: true_false
                text: "Is it true? A full stop tells you to take a little pause."
                answer: true
              - id: l1-n5
                type: speak
                text: "Sam runs to the park. He sits on a bench.\n\nRead the page out loud."
                say: "Read the page out loud. Then listen and check."
                expected_text: "Sam runs to the park. He sits on a bench."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The bus is big. It has six wheels.\n\nHow many wheels has the bus got?"
            say: "Read the page yourself. How many wheels has the bus got?"
            options: ["six", "ten", "two"]
            answer: "six"
          - id: l1-c2
            type: image_multiple_choice
            text: "Read the sentence. Tap the picture."
            say: "Read the sentence yourself. Then tap the picture."
            show: { drawn: letter-card, text: "Sam can see a fox." }
            options: [{ object: fox }, { object: box }, { object: frog }]
            answer: fox
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the word at the end of the first sentence."
            say: "Read the page. Tap the last word of the first sentence."
            show: { drawn: letter-card, text: "The fox ran. Sam got on the bus." }
            spans: ["ran"]

  - n: 2
    title: { de: "Meg und Kit, die Katze", en: "Meg and Kit the cat" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Sam gets on the bus. The bus is red.\n\nWho gets on the bus?"
            say: "Read the page yourself. Who gets on the bus?"
            options: ["Sam", "Mum", "Dad"]
            answer: "Sam"
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tap the word at the end of the first sentence."
            say: "Read the page. Tap the last word of the first sentence."
            show: { drawn: letter-card, text: "The bus is red. Sam gets on." }
            spans: ["red"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Meg has a pet cat. The cat is lost!"
            say: "Here is a new book. The first time you read it, sound out any word you need. The mark at the end is an exclamation mark. It tells you to sound surprised."
            show: { object: cat }
          - text: "Meg ... has ... a ... pet ... cat."
            say: "Reading one word at a time sounds like a robot: Meg, has, a, pet, cat. Read it again and join the words up: Meg has a pet cat."
          - text: "1st read: sound out\n2nd read: smoother\n3rd read: like talking"
            say: "Each time you read the book again, it gets smoother. Keep reading it until it sounds like you are telling the story."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Meg has a pet cat. The cat is lost!\n\nWhat is lost?"
                say: "Read the page yourself. What is lost?"
                show: { object: cat }
                options: ["the cat", "Meg", "a pet shop"]
                answer: "the cat"
                hints:
                  - "Read the second sentence."
                  - "The ... is lost."
                  - "The cat."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Meg looks in the shed. Then she looks in the garden.\n\nWhere does Meg look first?"
                say: "Read the page yourself. Where does Meg look first?"
                options: ["in the shed", "in the garden", "up a tree"]
                answer: "in the shed"
                feedback:
                  in the garden: "Meg looks there next. Read the first sentence again."
                hints:
                  - "First means the first sentence."
                  - "Meg looks in the ..."
                  - "In the shed."
              - id: l2-f3
                type: image_multiple_choice
                text: "Read the sentence. Where is the cat?"
                say: "Read the sentence yourself. Where is the cat?"
                show: { drawn: letter-card, text: "The cat is up a tree." }
                options: [{ object: tree }, { object: bed }, { object: box }]
                answer: tree
                hints:
                  - "Look at the last word."
                  - "Sound it out: t, r, ee."
                  - "A tree."
              - id: l2-f4
                type: multiple_choice
                text: "Which reading sounds like talking?"
                say: "Which reading sounds like talking? Read them yourself."
                options: ["Meg has a pet cat.", "Meg ... has ... a ... pet ... cat."]
                answer: "Meg has a pet cat."
                option_audio: false
                hints:
                  - "Which one has gaps between all the words?"
                  - "Gaps between every word sound like a robot."
                  - "Meg has a pet cat."
              - id: l2-f5
                type: highlight_in_text
                text: "Tap the word at the end of the first sentence."
                say: "Read the page. Tap the last word of the first sentence."
                show: { drawn: letter-card, text: "Meg looks in the shed. The cat is not there." }
                spans: ["shed"]
                hints:
                  - "Find the first full stop."
                  - "It comes after the word where Meg looks."
                  - "Shed."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Meg calls, 'Here, Kit!' The cat jumps down.\n\nWhat is the cat called?"
                say: "Read the page yourself. What is the cat called?"
                options: ["Kit", "Meg", "Tree"]
                answer: "Kit"
                hints: ["Read what Meg calls."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Read the sentence. Tap the picture."
                say: "Read the sentence yourself. Then tap the picture."
                show: { drawn: letter-card, text: "Kit naps on the bed.", flash: 2 }
                options: [{ object: bed }, { object: bench }, { object: bike }]
                answer: bed
                hints: ["Read the last word: b, e, d."]
              - id: l2-s3
                type: ordering
                text: "Put the sentences in the order they come in the book."
                options: ["Meg looks in the shed.", "The cat is up a tree.", "The cat is lost!"]
                slot_count: 3
                answer: ["The cat is lost!", "Meg looks in the shed.", "The cat is up a tree."]
                option_audio: false
                hints: ["The cat must be lost before Meg looks for it."]
              - id: l2-s4
                type: speak
                text: "Meg has a pet cat. The cat is lost!\n\nRead the page out loud."
                say: "Read the page out loud. Make it sound like talking, and surprised at the end. Then listen and check."
                expected_text: "Meg has a pet cat. The cat is lost!"
                hints: ["Join the words up, and pause at the full stop."]
              - id: l2-s5
                type: true_false
                text: "Is it true? Reading a page a second time makes it sound smoother."
                answer: true
                hints: ["The second time, you know the words."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Kit is up a tree. Meg gets a box to stand on.\n\nWhat does Meg stand on?"
                say: "Read the page yourself. What does Meg stand on?"
                options: ["a box", "a bed", "a bus"]
                answer: "a box"
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the word at the end of the first sentence."
                say: "Read the page. Tap the last word of the first sentence."
                show: { drawn: letter-card, text: "Meg hugs Kit. They go in for tea." }
                spans: ["Kit"]
              - id: l2-n3
                type: true_false
                text: "Is it true? Reading one word at a time, like a robot, is the best way to read a book you know."
                answer: false
              - id: l2-n4
                type: image_multiple_choice
                text: "Read the sentence. Tap the picture."
                say: "Read the sentence yourself. Then tap the picture."
                show: { drawn: letter-card, text: "Meg and Kit sit on the sofa.", flash: 2 }
                options: [{ object: sofa }, { object: bench }, { object: bed }]
                answer: sofa
              - id: l2-n5
                type: ordering
                text: "Build a sentence from the book."
                say: "Build the sentence from the book. Read the cards yourself."
                options: ["a tree.", "Kit", "is up"]
                slot_count: 3
                answer: ["Kit", "is up", "a tree."]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Meg has a red bag. In the bag is a big book.\n\nWhat is in the bag?"
            say: "Read the page yourself. What is in the bag?"
            options: ["a big book", "a red bag", "a cat"]
            answer: "a big book"
          - id: l2-c2
            type: image_multiple_choice
            text: "Read the sentence. Tap the picture."
            say: "Read the sentence yourself. Then tap the picture."
            show: { drawn: letter-card, text: "The dog digs in the sand." }
            options: [{ object: dog }, { object: duck }, { object: fox }]
            answer: dog
          - id: l2-c3
            type: highlight_in_text
            text: "Tap the word at the end of the first sentence."
            say: "Read the page. Tap the last word of the first sentence."
            show: { drawn: letter-card, text: "Sam got wet. The rain did not stop." }
            spans: ["wet"]
          - id: l2-c4
            type: true_false
            text: "Is it true? A book that matches your sounds gets easier each time you read it."
            answer: true
          - id: l2-c5
            type: ordering
            text: "Build a sentence."
            say: "Build the sentence. Read the cards yourself."
            options: ["the bus.", "Meg", "gets off"]
            slot_count: 3
            answer: ["Meg", "gets off", "the bus."]
            option_audio: false
