# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.build-vocabulary
skill: lit-en.speaking.build-vocabulary
curriculum: en-GB
language: en
title:
  de: Neue Wörter lernen und verwenden
  en: Learning new words
summary: >
  Ways to learn a new word and make it yours. Lesson 1 takes two
  strategies: ask what it means ("What does gigantic mean?"), and guess
  from the words around it. Lesson 2 builds a word map (what it means, a
  word like it, a picture, a sentence) and uses new words in sentences,
  and ends with the skill check. Saying new words in sentences is
  practised with speaking tasks and is not marked.
metadata:
  year: year-1
  topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.speaking.ask-questions]
  also_practises: [lit-en.comprehension.word-meanings]
  vocabulary: { en: [new word, meaning, ask, guess, clue, word map, sentence] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: ask, what: { de: "fragen, was ein neues Wort bedeutet", en: asking what a new word means } }
    - { id: guess, what: { de: die Bedeutung aus Hinweisen im Satz erraten, en: guessing a meaning from clues around the word } }
    - { id: word-map, what: { de: "eine Wortkarte anlegen (Bedeutung, ähnliches Wort, Bild, Satz)", en: "making a word map (meaning, a word like it, a picture, a sentence)" } }
    - { id: use, what: { de: ein neues Wort in einem sinnvollen Satz verwenden, en: using a new word in a sentence that makes sense } }
  misconceptions:
    - id: skip-the-word
      what: Skips a word they do not know and carries on, so never learns it
      addressed: Learn screen 1 in lesson 1; l1-f1 feedback on skip it; l1-s1 and l2-c1
    - id: wrong-use
      what: Uses a new word in a sentence where it does not fit (The soup was gigantic hot)
      addressed: Learn screen 3 in lesson 2; l2-f4, l2-s4 and l2-c4 choose the sentence that uses the word well
    - id: map-parts-mixed
      what: Puts a word that means the opposite in the "a word like it" part of a word map
      addressed: Learn screen 2 in lesson 2; l2-f2 feedback on tiny; l2-s2 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Fragen und raten", en: "Ask and guess" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "You want to know a person's name. Which word fits?"
            say: "You want to know a person's name. Which question word fits?"
            frame: "_ is your name?"
            options: ["What", "When", "Where"]
            answer: ["What"]
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Lucy says: \"I saw a rainbow on the way to school.\"\n\nWhich question fits?"
            audio: { en: "I saw a rainbow on the way to school.", speaker: female }
            options: ["What colours did you see?", "Can I have a sweet?", "Is it PE today?"]
            answer: "What colours did you see?"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "\"The castle was gigantic.\"\n\nWhat does gigantic mean?"
            say: "Miss Ali reads: The castle was gigantic. Kai does not know the word gigantic. He does not skip it. He puts up his hand and asks: What does gigantic mean?"
          - text: "The castle was gigantic. It was taller than all the trees."
            say: "Sometimes you can guess. Taller than all the trees is a clue. Gigantic must mean very, very big."
          - text: "Ask.  Guess from clues.  Use it."
            say: "When you hear a new word: ask what it means, or guess from the words around it. Then use it yourself, so it sticks."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Your teacher says a word you do not know. What is a good thing to do?"
                options: ["ask what it means", "skip it and forget it", "pretend you know it"]
                answer: "ask what it means"
                feedback:
                  "skip it and forget it": "If you skip it, you will never learn it. Ask, or look for clues."
                hints:
                  - "How can you find out?"
                  - "You could ask a question."
                  - "Ask what it means."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "You hear \"The puppy was drowsy.\" Which question finds out what the word means?"
                options: ["What does drowsy mean?", "Where is the puppy?", "Can I have a puppy?"]
                answer: "What does drowsy mean?"
                hints:
                  - "Your question should be about the new word."
                  - "The new word is drowsy."
                  - "What does drowsy mean?"
              - id: l1-f3
                type: multiple_choice
                text: "\"The puppy was drowsy. It yawned and curled up to sleep.\"\n\nWhat does drowsy mean?"
                say: "Listen. The puppy was drowsy. It yawned and curled up to sleep. Guess from the clues. What does drowsy mean?"
                options: ["sleepy", "hungry", "naughty"]
                answer: "sleepy"
                hints:
                  - "What did the puppy do next?"
                  - "It yawned and curled up to sleep."
                  - "Sleepy."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the two clue words that help you guess what soaked means."
                show: { drawn: letter-card, text: "Tom was soaked. Water dripped from his hair." }
                spans: ["Water", "dripped"]
                hints:
                  - "Look in the second sentence."
                  - "What came from his hair, and what did it do?"
                  - "Water and dripped."
              - id: l1-f5
                type: speak
                text: "Ask what the word \"peculiar\" means."
                say: "You hear a new word, peculiar. Ask your teacher what it means. Then listen to one way to ask."
                expected_text: "What does peculiar mean?"
                hints:
                  - "Start with What does ..."
                  - "Then say the word."
                  - "What does peculiar mean?"

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Is it true? If you do not know a word, it is fine to ask what it means."
                answer: true
                hints: ["How do people learn new words?"]
              - id: l1-s2
                type: multiple_choice
                text: "\"The lion gave a mighty roar. Everyone in the zoo heard it.\"\n\nWhat does mighty mean?"
                say: "Listen. The lion gave a mighty roar. Everyone in the zoo heard it. What does mighty mean?"
                show: { object: lion }
                options: ["very strong and loud", "very quiet", "very sad"]
                answer: "very strong and loud"
                hints: ["Everyone heard it."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the clue that helps you guess what freezing means."
                show: { drawn: letter-card, text: "It was freezing. The pond had turned to ice." }
                spans: ["ice"]
                hints: ["What happened to the pond?"]
              - id: l1-s4
                type: multiple_choice
                text: "You read \"a cosy blanket\". Which question finds out what the word means?"
                options: ["What does cosy mean?", "Where is my bed?", "Do you like blankets?"]
                answer: "What does cosy mean?"
                hints: ["Ask about the new word."]
              - id: l1-s5
                type: speak
                text: "Ask what the word \"vast\" means."
                say: "You hear a new word, vast. Ask what it means. Then listen to one way to ask."
                expected_text: "What does vast mean?"
                hints: ["What does ... mean?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"Nan was thrilled with her present. She jumped up and hugged me.\"\n\nWhat does thrilled mean?"
                say: "Listen. Nan was thrilled with her present. She jumped up and hugged me. What does thrilled mean?"
                options: ["very pleased", "very cross", "very cold"]
                answer: "very pleased"
              - id: l1-n2
                type: highlight_in_text
                text: "Tap the clue that helps you guess what ancient means."
                show: { drawn: letter-card, text: "The castle was ancient. It was very, very old." }
                spans: ["old"]
              - id: l1-n3
                type: true_false
                text: "Is it true? The best thing to do with a new word is to skip it."
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "You hear \"a dazzling light\". Which question finds out what the word means?"
                options: ["What does dazzling mean?", "Is it home time?", "Who turned on the light?"]
                answer: "What does dazzling mean?"
              - id: l1-n5
                type: speak
                text: "Ask what the word \"nibble\" means."
                say: "You hear a new word, nibble. Ask what it means. Then listen to one way to ask."
                expected_text: "What does nibble mean?"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"The rabbit was startled. It ran into its hole.\"\n\nWhat does startled mean?"
            say: "Listen. The rabbit was startled. It ran into its hole. What does startled mean?"
            options: ["suddenly scared", "very hungry", "very slow"]
            answer: "suddenly scared"
          - id: l1-c2
            type: multiple_choice
            text: "You hear a word you do not know. What can you do?"
            options: ["ask, or look for clues", "stop listening", "say nothing"]
            answer: "ask, or look for clues"
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the clue that helps you guess what feast means."
            show: { drawn: letter-card, text: "We had a feast. There was so much food on the table." }
            spans: ["food"]
          - id: l1-c4
            type: highlight_in_text
            text: "Tap the clue that helps you guess what soggy means."
            show: { drawn: letter-card, text: "My sandwich was soggy. It fell in a puddle." }
            spans: ["puddle"]
          - id: l1-c5
            type: multiple_choice
            text: "\"The kitten was tiny. It could sit in my hand.\"\n\nWhat does tiny mean?"
            say: "Listen. The kitten was tiny. It could sit in my hand. What does tiny mean?"
            options: ["very fast", "very small", "very loud"]
            answer: "very small"
          - id: l1-c6
            type: true_false
            text: "Is it true? Clues in a sentence can help you guess what a new word means."
            answer: true

  - n: 2
    title: { de: "Wortkarte und eigene Sätze", en: "Word maps and using words" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "You hear \"a gloomy cave\". Which question finds out what the word means?"
            options: ["What does gloomy mean?", "Where is the cave?", "Can we go home?"]
            answer: "What does gloomy mean?"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "\"Sam was famished. He ate two bowls of pasta.\"\n\nWhat does famished mean?"
            say: "Listen. Sam was famished. He ate two bowls of pasta. What does famished mean?"
            options: ["very hungry", "very tired", "very funny"]
            answer: "very hungry"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Word map: gigantic\n\nMeans: very, very big\nA word like it: huge\nPicture: an elephant\nSentence: The elephant was gigantic."
            say: "A word map helps you learn a new word. Write the word in the middle. Then add what it means, a word like it, a picture, and a sentence with the word in it."
            show: { object: elephant }
          - text: "A word like it: huge ✓\nA word like it: tiny ✗"
            say: "A word like it means nearly the same. Huge is like gigantic. Tiny is the opposite, so it does not go there."
          - text: "The elephant was gigantic. ✓\nI ate a gigantic. ✗"
            say: "Use the new word in your own sentence. Check it makes sense. The elephant was gigantic makes sense. I ate a gigantic does not."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Make a word map for \"chilly\". Match each part."
                pairs:
                  - { left: { text: "Means" }, right: { text: "a bit cold" } }
                  - { left: { text: "A word like it" }, right: { text: "cool" } }
                  - { left: { text: "Sentence" }, right: { text: "It was a chilly morning." } }
                hints:
                  - "Read each part of the map."
                  - "Means tells you what it is. A sentence uses the word."
                  - "Means: a bit cold. A word like it: cool. Sentence: It was a chilly morning."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Word map: enormous\n\nWhich word goes in \"a word like it\"?"
                say: "You are making a word map for enormous. Which word goes in the part called a word like it?"
                options: ["huge", "tiny", "elephant"]
                answer: "huge"
                feedback:
                  "tiny": "Tiny is the opposite of enormous. A word like it means nearly the same."
                hints:
                  - "Enormous means very big."
                  - "Which word means nearly the same?"
                  - "Huge."
              - id: l2-f3
                type: image_multiple_choice
                text: "Word map: soaring\n\nMeans: flying high in the sky\n\nWhich picture fits?"
                say: "You are making a word map for soaring. It means flying high in the sky. Which picture fits?"
                options: [{ object: bird }, { object: fish }, { object: snail }]
                answer: bird
                hints:
                  - "What can fly high?"
                  - "Fish swim and snails crawl."
                  - "A bird."
              - id: l2-f4
                type: multiple_choice
                text: "Which sentence uses \"delicious\" well?"
                options: ["The pizza was delicious.", "The rain was delicious.", "I delicious to school."]
                answer: "The pizza was delicious."
                option_audio: false
                hints:
                  - "Delicious means very tasty."
                  - "Which thing can you eat?"
                  - "The pizza was delicious."
              - id: l2-f5
                type: speak
                text: "Say a sentence with the word \"gigantic\"."
                say: "Say your own sentence with the word gigantic. Then listen to one idea."
                expected_text: "The giant had gigantic feet."
                hints:
                  - "Gigantic means very, very big."
                  - "Think of something very big."
                  - "You could say: The giant had gigantic feet."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Make a word map for \"sprint\". Match each part."
                pairs:
                  - { left: { text: "Means" }, right: { text: "run very fast" } }
                  - { left: { text: "A word like it" }, right: { text: "dash" } }
                  - { left: { text: "Sentence" }, right: { text: "I sprint to the gate." } }
                hints: ["The sentence part uses the word sprint."]
              - id: l2-s2
                type: multiple_choice
                text: "Word map: furious\n\nWhich word goes in \"a word like it\"?"
                say: "You are making a word map for furious. Which word goes in the part called a word like it?"
                options: ["cross", "calm", "furry"]
                answer: "cross"
                hints: ["Furious means very cross."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Word map: frosty\n\nMeans: covered in ice, very cold\n\nWhich picture fits?"
                say: "You are making a word map for frosty. It means covered in ice, very cold. Which picture fits?"
                options: [{ object: snowman }, { object: sun }, { object: beach-ball }]
                answer: snowman
                hints: ["Which picture shows a cold, icy day?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence uses \"tiny\" well?"
                options: ["The ant was tiny.", "The whale was tiny.", "I tiny my dinner."]
                answer: "The ant was tiny."
                option_audio: false
                hints: ["Tiny means very small."]
              - id: l2-s5
                type: speak
                text: "Say a sentence with the word \"drowsy\"."
                say: "Say your own sentence with the word drowsy. Then listen to one idea."
                expected_text: "I felt drowsy at bedtime."
                hints: ["Drowsy means sleepy."]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Make a word map for \"giggle\". Match each part."
                pairs:
                  - { left: { text: "Means" }, right: { text: "laugh in a silly way" } }
                  - { left: { text: "A word like it" }, right: { text: "chuckle" } }
                  - { left: { text: "Sentence" }, right: { text: "The joke made me giggle." } }
              - id: l2-n2
                type: multiple_choice
                text: "Word map: whisper\n\nWhich word goes in \"a word like it\"?"
                say: "You are making a word map for whisper. Which word goes in the part called a word like it?"
                options: ["murmur", "shout", "listen"]
                answer: "murmur"
              - id: l2-n3
                type: image_multiple_choice
                text: "Word map: slither\n\nMeans: slide along the ground, twisting\n\nWhich picture fits?"
                say: "You are making a word map for slither. It means slide along the ground, twisting. Which picture fits?"
                options: [{ object: snake }, { object: bird }, { object: cow }]
                answer: snake
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence uses \"scorching\" well?"
                options: ["The sand was scorching in the sun.", "The snow was scorching.", "I scorching my bike."]
                answer: "The sand was scorching in the sun."
                option_audio: false
              - id: l2-n5
                type: speak
                text: "Say a sentence with the word \"thrilled\"."
                say: "Say your own sentence with the word thrilled. Then listen to one idea."
                expected_text: "I was thrilled with my new bike."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ask
            type: multiple_choice
            text: "In a story you hear the word \"timid\". You do not know it. What is a good thing to do?"
            options: ["ask what it means", "stop listening", "skip it"]
            answer: "ask what it means"
          - id: l2-c2
            part: guess
            type: multiple_choice
            text: "\"The path was muddy. Our boots were brown and sticky.\"\n\nWhat does muddy mean?"
            say: "Listen. The path was muddy. Our boots were brown and sticky. What does muddy mean?"
            options: ["wet and dirty", "very clean", "very steep"]
            answer: "wet and dirty"
          - id: l2-c3
            part: word-map
            type: multiple_choice
            text: "Word map: glad\n\nWhich word goes in \"a word like it\"?"
            say: "You are making a word map for glad. Which word goes in the part called a word like it?"
            options: ["happy", "sad", "glue"]
            answer: "happy"
          - id: l2-c4
            part: use
            type: multiple_choice
            text: "Which sentence uses \"chilly\" well?"
            options: ["I wore a coat because it was chilly.", "The oven was chilly and hot.", "I chilly to the park."]
            answer: "I wore a coat because it was chilly."
            option_audio: false
          - id: l2-c5
            part: guess
            type: highlight_in_text
            text: "Tap the clue that helps you guess what exhausted means."
            show: { drawn: letter-card, text: "Dad was exhausted. He fell asleep on the sofa." }
            spans: ["asleep"]
          - id: l2-c6
            part: ask
            type: true_false
            text: "Is it true? Asking \"What does grumpy mean?\" helps you learn the word grumpy."
            answer: true
          - id: l2-c7
            part: ask
            type: multiple_choice
            text: "Which question helps you learn a new word?"
            options: ["Can I go out to play?", "What does enormous mean?", "Where is my coat?"]
            answer: "What does enormous mean?"
          - id: l2-c8
            part: ask
            type: sorting
            text: "Which questions help you learn a new word?"
            say: "Sort the questions. Do they help you learn a new word, or not?"
            option_audio: false
            bins:
              - { id: yes, show: { text: "helps" }, say: "Helps." }
              - { id: no, show: { text: "does not help" }, say: "Does not help." }
            options:
              - { text: "Is it lunchtime?", bin: no }
              - { text: "What does swift mean?", bin: yes }
              - { text: "Can I have a pen?", bin: no }
              - { text: "What is a meadow?", bin: yes }
          - id: l2-c9
            part: ask
            type: multiple_choice
            text: "Rosa hears the word \"burrow\". She does not know it. What can she say?"
            options: ["What does burrow mean?", "I know all the words.", "Is it home time?"]
            answer: "What does burrow mean?"
          - id: l2-c10
            part: guess
            type: multiple_choice
            text: "\"The baby was wailing. Big tears ran down her face.\"\n\nWhat does wailing mean?"
            say: "Listen. The baby was wailing. Big tears ran down her face. What does wailing mean?"
            options: ["sleeping", "crying loudly", "singing"]
            answer: "crying loudly"
          - id: l2-c11
            part: guess
            type: highlight_in_text
            text: "Tap the two clue words that help you guess what silent means."
            show: { drawn: letter-card, text: "The hall was silent. Nobody made a sound." }
            spans: ["Nobody", "sound"]
          - id: l2-c12
            part: guess
            type: true_false
            text: "\"Mia was weary after the long walk. She sat down to rest.\"\n\nIs it true? Weary means tired."
            say: "Listen. Mia was weary after the long walk. She sat down to rest. Is it true? Weary means tired."
            answer: true
          - id: l2-c13
            part: word-map
            type: matching
            text: "Make a word map for \"speedy\". Match each part."
            pairs:
              - { left: { text: "Means" }, right: { text: "very fast" } }
              - { left: { text: "A word like it" }, right: { text: "quick" } }
              - { left: { text: "Sentence" }, right: { text: "The speedy car won the race." } }
          - id: l2-c14
            part: word-map
            type: image_multiple_choice
            text: "Word map: prickly\n\nMeans: covered in sharp points\n\nWhich picture fits?"
            say: "You are making a word map for prickly. It means covered in sharp points. Which picture fits?"
            options: [{ object: teddy }, { object: hedgehog }, { object: balloon }]
            answer: hedgehog
          - id: l2-c15
            part: word-map
            type: true_false
            text: "Word map: tiny\n\nIs it true? \"enormous\" goes in \"a word like it\"."
            say: "You are making a word map for tiny. Is it true? Enormous goes in the part called a word like it."
            answer: false
          - id: l2-c16
            part: word-map
            type: multiple_choice
            text: "Word map: munch\n\nWhich sentence goes in \"Sentence\"?"
            say: "You are making a word map for munch. Which sentence goes in the part called sentence?"
            options: ["The apple is munch.", "I munch my apple.", "Munch is red."]
            answer: "I munch my apple."
            option_audio: false
          - id: l2-c17
            part: use
            type: multiple_choice
            text: "Which sentence uses \"gentle\" well?"
            options: ["I gentle my teeth.", "The drum was gentle loud.", "Be gentle with the kitten."]
            answer: "Be gentle with the kitten."
            option_audio: false
          - id: l2-c18
            part: use
            type: true_false
            text: "Is it true? \"I ate a sleepy for lunch.\" uses the word sleepy well."
            say: "Is it true? I ate a sleepy for lunch. Does that use the word sleepy well?"
            answer: false
          - id: l2-c19
            part: use
            type: fill_in_blank
            text: "Which word fits the sentence?"
            say: "Which word fits the sentence? Read it yourself."
            frame: "It was so _ that we wore hats and gloves."
            options: ["sunny", "freezing", "delicious"]
            answer: ["freezing"]
          - id: l2-c20
            part: use
            type: sorting
            text: "Does the sentence use the new word well?"
            say: "Read each sentence. Does it use the new word well, or not? Sort the sentences."
            option_audio: false
            bins:
              - { id: yes, show: { text: "makes sense" }, say: "Makes sense." }
              - { id: no, show: { text: "does not make sense" }, say: "Does not make sense." }
            options:
              - { text: "The rock was drowsy and ran away.", bin: no }
              - { text: "Dad was furious when the dog ate his shoe.", bin: yes }
              - { text: "The flower was furious and smelled nice.", bin: no }
              - { text: "The puppy was drowsy and fell asleep.", bin: yes }
