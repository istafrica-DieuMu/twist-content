# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.short-narrative
skill: lit-en.composition.short-narrative
curriculum: en-GB
language: en
title:
  de: Sätze zu einer Geschichte ordnen
  en: Putting sentences in order to tell a story
summary: >
  A short story has a beginning, a middle and an end, and its sentences
  only make sense in the right order. Lesson 1 orders three or four
  sentences and asks what starts the story, what happens next and what
  ends it; lesson 2 adds the time words first, next, then and in the end,
  and ends with the skill check. Writing a whole story of their own is not
  marked yet.
metadata:
  year: year-1
  topic: { de: "Texte schreiben", en: "Writing" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.composition.say-then-write]
  also_practises: [lit-en.composition.say-then-write]
  vocabulary: { en: [story, beginning, middle, end, order, first, next, then, in the end] }
  forms: [text, picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: order-does-not-matter
      what: Thinks story sentences can go in any order
      addressed: l1-f1, l1-f4 and l1-n3 show a mixed-up story beside a sensible one; Learn shows the sunflower story mixed up
    - id: ending-as-beginning
      what: Picks the most exciting or final event as the start
      addressed: l1-f2 feedback names the ending; l1-s2, l1-n2 and l2-c2 ask what starts or ends a story
    - id: next-not-caused
      what: Chooses a next event that does not follow from the one before
      addressed: l1-f3, l1-s4, l1-n4 and l2-c3 ask what happens next
    - id: time-words-misplaced
      what: Uses time words in the wrong order (next before first, in the end in the middle)
      addressed: l2-f2, l2-f4, l2-s1, l2-n1 and l2-n3; feedback in l2-f1 says first opens a story
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Anfang, Mitte, Schluss", en: "Beginning, middle and end" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "What do you do first? Put the steps in order."
            say: "You are going to write a sentence. Put the steps in order, from first to last."
            options: ["Write it.", "Think of a sentence.", "Read it back.", "Say it out loud."]
            slot_count: 4
            answer: ["Think of a sentence.", "Say it out loud.", "Write it.", "Read it back."]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Pip said: The dog is in the bin.\n\nWhich one did Pip write?"
            say: "Pip said: The dog is in the bin. Which one did Pip write? Read them yourself."
            show: { object: bin }
            options: ["The dog is in the bin.", "The dog in the bin.", "The dog is the bin."]
            answer: "The dog is in the bin."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Sam planted a seed.\nIt grew and grew.\nSam had a big sunflower."
            say: "A story has a beginning, a middle and an end. At the beginning, Sam planted a seed. In the middle, it grew and grew. In the end, Sam had a big sunflower."
            show: { object: flower }
          - text: "Sam had a big sunflower.\nIt grew and grew.\nSam planted a seed."
            say: "Mixed up, the story makes no sense. Sam cannot have a sunflower before he plants the seed. The order matters."
          - text: "What happens first? What happens next? How does it end?"
            say: "To put a story in order, ask yourself: what happens first? What happens next, because of that? And how does it end?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
                show: { object: cake }
                options: ["Mia ate it all up.", "Mum made a cake.", "The plate was empty."]
                slot_count: 3
                answer: ["Mum made a cake.", "Mia ate it all up.", "The plate was empty."]
                hints:
                  - "What has to happen before Mia can eat the cake?"
                  - "First Mum makes it. Then someone eats it."
                  - "Mum made a cake. Mia ate it all up. The plate was empty."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which sentence starts the story?"
                say: "These sentences are from one story. Which sentence starts it?"
                options: ["Tom put on his pyjamas.", "Tom fell asleep.", "Tom got into bed."]
                answer: "Tom put on his pyjamas."
                feedback:
                  "Tom fell asleep.": "That is how the story ends. What does Tom do before he goes to sleep?"
                hints:
                  - "Think about getting ready for bed."
                  - "You get into bed after you get ready, and you fall asleep last."
                  - "Tom put on his pyjamas."
              - id: l1-f3
                type: multiple_choice
                text: "Ben kicked the ball very high.\n\nWhat happens next?"
                say: "Ben kicked the ball very high. What happens next?"
                show: { object: ball }
                options: ["The ball went over the fence.", "Ben got up in the morning.", "Ben found a ball."]
                answer: "The ball went over the fence."
                hints:
                  - "What does a ball do when you kick it high?"
                  - "Ben already has the ball, and he is already up."
                  - "The ball went over the fence."
              - id: l1-f4
                type: true_false
                text: "Is this story in the right order?\n\nThe ice cream melted.\nAli bought an ice cream.\nThe sun was hot."
                say: "Read the story. Is it in the right order?"
                answer: false
                hints:
                  - "Can the ice cream melt before Ali buys it?"
                  - "Ali buys it first. Then the sun melts it."
                  - "No. Ali bought an ice cream comes first."
              - id: l1-f5
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
                show: { object: egg }
                options: ["The egg cracked.", "A hen sat on an egg.", "Out came a chick."]
                slot_count: 3
                answer: ["A hen sat on an egg.", "The egg cracked.", "Out came a chick."]
                hints:
                  - "Where does the story start?"
                  - "The hen sits first. The egg must crack before the chick comes out."
                  - "A hen sat on an egg. The egg cracked. Out came a chick."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
                show: { object: rain }
                options: ["It began to rain.", "We went to the park.", "We ran home."]
                slot_count: 3
                answer: ["We went to the park.", "It began to rain.", "We ran home."]
                hints: ["Why did we run home?"]
              - id: l1-s2
                type: multiple_choice
                text: "Which sentence ends the story?"
                say: "These sentences are from one story. Which sentence ends it?"
                options: ["Gran planted some seeds.", "She watered them every day.", "Flowers grew in the garden."]
                answer: "Flowers grew in the garden."
                hints: ["What happens after all the watering?"]
              - id: l1-s3
                type: true_false
                text: "Is this story in the right order?\n\nJack got his coat.\nJack went outside.\nJack played in the snow."
                say: "Read the story. Is it in the right order?"
                answer: true
                hints: ["Does each sentence follow from the one before?"]
              - id: l1-s4
                type: multiple_choice
                text: "The cat saw a mouse.\n\nWhat happens next?"
                say: "The cat saw a mouse. What happens next?"
                show: { object: cat }
                options: ["The cat ran after it.", "The cat was born.", "The cat had not seen the mouse."]
                answer: "The cat ran after it."
                hints: ["What does a cat do when it sees a mouse?"]
              - id: l1-s5
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
                show: { object: bus }
                options: ["The bus came.", "Mia waited at the stop.", "Mia got on.", "The bus drove to school."]
                slot_count: 4
                answer: ["Mia waited at the stop.", "The bus came.", "Mia got on.", "The bus drove to school."]
                hints: ["Mia waits first. What has to come before she can get on?"]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
                options: ["The tower fell down.", "Leo built a tall tower.", "Leo built it again."]
                slot_count: 3
                answer: ["Leo built a tall tower.", "The tower fell down.", "Leo built it again."]
              - id: l1-n2
                type: multiple_choice
                text: "Which sentence starts the story?"
                say: "These sentences are from one story. Which sentence starts it?"
                show: { object: boat }
                options: ["The boat sailed away.", "Dad and I made a paper boat.", "We put the boat on the pond."]
                answer: "Dad and I made a paper boat."
              - id: l1-n3
                type: true_false
                text: "Is this story in the right order?\n\nElla ate her lunch.\nElla made a sandwich.\nElla washed her plate."
                say: "Read the story. Is it in the right order?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Kit dropped her cup of milk.\n\nWhat happens next?"
                say: "Kit dropped her cup of milk. What happens next?"
                show: { object: milk }
                options: ["The milk went all over the floor.", "Kit poured some milk.", "Kit felt thirsty."]
                answer: "The milk went all over the floor."
              - id: l1-n5
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
                show: { object: snowman }
                options: ["The snowman melted.", "It snowed in the night.", "We made a snowman.", "The sun came out."]
                slot_count: 4
                answer: ["It snowed in the night.", "We made a snowman.", "The sun came out.", "The snowman melted."]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Put the story in order."
            say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
            show: { object: bird }
            options: ["The bird flew away.", "A bird landed on the fence.", "It sang a song."]
            slot_count: 3
            answer: ["A bird landed on the fence.", "It sang a song.", "The bird flew away."]
          - id: l1-c2
            type: multiple_choice
            text: "Which sentence ends the story?"
            say: "These sentences are from one story. Which sentence ends it?"
            show: { object: bread }
            options: ["Nan baked some bread.", "We ate the bread with jam.", "The bread came out of the oven."]
            answer: "We ate the bread with jam."
          - id: l1-c3
            type: true_false
            text: "Is this story in the right order?\n\nRaj fell over.\nRaj cut his knee.\nMum put on a plaster."
            say: "Read the story. Is it in the right order?"
            answer: true

  - n: 2
    title: { de: "Zuerst, dann, am Ende", en: "First, next, then, in the end" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Put the story in order."
            say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
            options: ["The water boiled.", "Dad put water in a pot.", "Dad made some soup."]
            slot_count: 3
            answer: ["Dad put water in a pot.", "The water boiled.", "Dad made some soup."]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which sentence starts the story?"
            say: "These sentences are from one story. Which sentence starts it?"
            options: ["The dog wagged its tail.", "Amir threw a stick.", "The dog brought the stick back."]
            answer: "Amir threw a stick."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "First, Sam planted a seed.\nNext, he watered it.\nThen it grew and grew.\nIn the end, he had a big sunflower."
            say: "Time words tell the reader the order. First starts the story. Next and then come in the middle. In the end finishes it."
            show: { object: flower }
          - text: "First   Next   Then   In the end"
            say: "First, next, then, in the end. Use them when you say your story out loud, before you write it."
          - text: "First, I got up.\nNext, I had breakfast.\nThen I went to school.\nAt the end of the day, I came home."
            say: "Listen to my story about my day. First, I got up. Next, I had breakfast. Then I went to school. At the end of the day, I came home."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Which time word starts the story?"
                say: "Ana put on her wellies. This is the start of the story. Which time word goes in the gap?"
                show: { object: wellies }
                frame: "_, Ana put on her wellies."
                options: ["First", "Then", "In the end"]
                answer: ["First"]
                feedback:
                  "In the end": "In the end finishes a story. This sentence starts it, so we use first."
                hints:
                  - "This is the beginning of the story."
                  - "Which time word starts a story?"
                  - "First."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Put the time words in order."
                say: "Put the time words in the order they come in a story."
                options: ["Then", "In the end", "First", "Next"]
                slot_count: 4
                answer: ["First", "Next", "Then", "In the end"]
                hints:
                  - "Which word starts a story?"
                  - "First starts it and in the end finishes it. Next and then go in the middle."
                  - "First, next, then, in the end."
              - id: l2-f3
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Use the time words to put the story in order."
                options: ["Next, we found our seats.", "In the end, we clapped.", "First, we went to the cinema.", "Then the film began."]
                slot_count: 4
                answer: ["First, we went to the cinema.", "Next, we found our seats.", "Then the film began.", "In the end, we clapped."]
                hints:
                  - "Look at the first word of each sentence."
                  - "First goes first and in the end goes last."
                  - "First, cinema. Next, seats. Then the film. In the end, we clapped."
              - id: l2-f4
                type: fill_in_blank
                text: "First, Tim opened the box.\n_, he found a puppy.\nIn the end, they played together.\n\nWhich time word fits the gap?"
                say: "Which time word goes in the middle of Tim's story?"
                frame: "_, he found a puppy."
                options: ["Next", "First", "In the end"]
                answer: ["Next"]
                hints:
                  - "First and in the end are already used."
                  - "This sentence is in the middle."
                  - "Next."
              - id: l2-f5
                type: multiple_choice
                text: "Which sentence ends the story?"
                say: "These sentences are from one story. Which sentence ends it?"
                options: ["In the end, we went home.", "First, we went to the beach.", "Next, we built a sandcastle."]
                answer: "In the end, we went home."
                hints:
                  - "Look at the time word at the start of each sentence."
                  - "Which time word finishes a story?"
                  - "In the end, we went home."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "First, Jo got a bucket.\nThen she filled it with water.\n_, she washed the car.\n\nWhich time word fits the gap?"
                say: "Which time word goes at the end of Jo's story?"
                frame: "_, she washed the car."
                options: ["In the end", "First"]
                answer: ["In the end"]
                hints: ["This sentence finishes the story."]
              - id: l2-s2
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Use the time words to put the story in order."
                options: ["Then he had a bath.", "First, Ravi played in the mud.", "In the end, he was clean.", "Next, he was very muddy."]
                slot_count: 4
                answer: ["First, Ravi played in the mud.", "Next, he was very muddy.", "Then he had a bath.", "In the end, he was clean."]
                hints: ["First, next, then, in the end."]
              - id: l2-s3
                type: true_false
                text: "Is it true? \"First\" is a good word to start a story."
                say: "Is it true? First is a good word to start a story."
                answer: true
                hints: ["Which time word comes before all the others?"]
              - id: l2-s4
                type: multiple_choice
                text: "First, Mum filled the bath.\n\nWhich sentence comes next?"
                say: "First, Mum filled the bath. Which sentence comes straight after it?"
                options: ["Next, I got in the bath.", "In the end, I got out and dried off.", "First, I got in the bath."]
                answer: "Next, I got in the bath."
                hints: ["Which time word comes after first?"]
              - id: l2-s5
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
                show: { object: kite }
                options: ["The kite flew high.", "Zoe took her kite up the hill.", "The wind began to blow."]
                slot_count: 3
                answer: ["Zoe took her kite up the hill.", "The wind began to blow.", "The kite flew high."]
                hints: ["A kite needs wind before it can fly."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "First, I brushed my teeth.\n_, I read a book.\nIn the end, I fell asleep.\n\nWhich time word fits the gap?"
                say: "Which time word goes in the middle of the story?"
                frame: "_, I read a book."
                options: ["Next", "First", "In the end"]
                answer: ["Next"]
              - id: l2-n2
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Use the time words to put the story in order."
                show: { object: duck }
                options: ["Then we fed the ducks.", "First, we got some bread.", "In the end, the ducks swam away.", "Next, we walked to the pond."]
                slot_count: 4
                answer: ["First, we got some bread.", "Next, we walked to the pond.", "Then we fed the ducks.", "In the end, the ducks swam away."]
              - id: l2-n3
                type: true_false
                text: "Is this story in the right order?\n\nFirst, Max ate his dinner.\nNext, he cooked his dinner.\nIn the end, he washed up."
                say: "Read the story. Is it in the right order?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence ends the story?"
                say: "These sentences are from one story. Which sentence ends it?"
                show: { object: baby }
                options: ["In the end, the baby fell asleep.", "First, Dad sang a song.", "Next, the baby yawned."]
                answer: "In the end, the baby fell asleep."
              - id: l2-n5
                type: ordering
                text: "Put the story in order."
                say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
                options: ["The puppy jumped in a puddle.", "The puppy ran outside.", "The puppy was all wet.", "Mum dried the puppy."]
                slot_count: 4
                answer: ["The puppy ran outside.", "The puppy jumped in a puddle.", "The puppy was all wet.", "Mum dried the puppy."]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Put the story in order."
            say: "Tap each sentence to hear it. Put the story in order, from the beginning to the end."
            options: ["The car was clean.", "Dad got a bucket of water.", "He washed the car."]
            slot_count: 3
            answer: ["Dad got a bucket of water.", "He washed the car.", "The car was clean."]
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence starts the story?"
            say: "These sentences are from one story. Which sentence starts it?"
            show: { object: present }
            options: ["Gran opened her present.", "Gran said thank you.", "I gave Gran a present."]
            answer: "I gave Gran a present."
          - id: l2-c3
            type: multiple_choice
            text: "Sara's ice cream fell on the floor.\n\nWhat happens next?"
            say: "Sara's ice cream fell on the floor. What happens next?"
            show: { object: ice-cream }
            options: ["Sara was sad.", "Sara bought an ice cream.", "Sara wanted an ice cream."]
            answer: "Sara was sad."
          - id: l2-c4
            type: ordering
            text: "Put the story in order."
            say: "Tap each sentence to hear it. Use the time words to put the story in order."
            show: { object: frog }
            options: ["Next, a tadpole hatched.", "First, the frog laid eggs.", "In the end, it was a frog.", "Then it grew legs."]
            slot_count: 4
            answer: ["First, the frog laid eggs.", "Next, a tadpole hatched.", "Then it grew legs.", "In the end, it was a frog."]
          - id: l2-c5
            type: true_false
            text: "Is this story in the right order?\n\nFirst, Lin got a book.\nNext, she read it in bed.\nIn the end, she fell asleep."
            say: "Read the story. Is it in the right order?"
            answer: true
