# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.traditional-tales
skill: lit-en.texts.traditional-tales
curriculum: en-GB
language: en
title:
  de: Traditionelle Märchen
  en: Traditional tales
summary: >
  Five traditional tales, told in short Twist retellings and read aloud:
  The Three Little Pigs and The Three Billy Goats Gruff (lesson 1), The
  Little Red Hen and The Gingerbread Man (lesson 2), Goldilocks and the
  Three Bears (lesson 3). The child answers questions about each tale,
  puts its events in order to retell it, and learns what makes these
  tales special: Once upon a time, things in threes, a line that comes
  again and again, a bad or tricky character, a happy ending. Lesson 3
  ends with the skill check. The checks mark retelling by putting a
  tale's events in order; retelling a tale aloud is practised with the
  tales and not marked.
metadata:
  year: year-1
  topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.comprehension.retell]
  also_practises: []
  vocabulary: { en: [traditional tale, fairy tale, character, retell, Once upon a time, happily ever after, troll, wolf, fox] }
  forms: [text, picture, audio]
  drawn: []
  facets: []
  parts:
    - { id: know, what: { de: die Figuren und Ereignisse der Märchen kennen, en: knowing the characters and events of the tales } }
    - { id: lines, what: { de: "sagen, aus welchem Märchen eine Figur oder ein Satz stammt", en: saying which tale a character or a line comes from } }
    - { id: retell, what: { de: ein Märchen nacherzählen und seine Ereignisse ordnen, en: retelling a tale by putting its events in order } }
    - { id: special, what: { de: "sagen, was diese Märchen besonders macht (Once upon a time, Dreiergruppen, ein Satz, der wiederkommt, eine böse oder listige Figur)", en: "saying what makes these tales special (Once upon a time, things in threes, a line that comes again, a bad or tricky character)" } }
  misconceptions:
    - id: mixes-tales
      what: Muddles characters or lines from different tales (the troll blows the houses down)
      addressed: "l1-f2, l1-s4 and l2-f5 set the wolf, the troll and the other tales' lines side by side; feedback names the tale each one belongs to"
    - id: events-out-of-order
      what: Retells from the most exciting part or the end instead of from the beginning
      addressed: "ordering tasks l1-f4, l1-s3, l1-n4, l2-f4, l2-s3, l3-f5 and l3-n4; hints ask what happens first"
    - id: special-means-magic
      what: Thinks only magic makes a tale special and misses the patterns (threes, a repeated line, Once upon a time)
      addressed: "lesson 3 Learn names the patterns; l3-f3, l3-f4, l3-s3, l3-s4 and l3-n5 ask for them"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die drei kleinen Schweinchen und die Ziegenböcke", en: "Pigs and billy goats" }
    goal:
      de: "Hör die Geschichten von den drei kleinen Schweinchen und den drei Ziegenböcken und erzähl sie der Reihe nach."
      en: "Listen to The Three Little Pigs and The Three Billy Goats Gruff, and retell them in order."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Sam planted a seed. He watered it every day. A big sunflower grew.\n\nPut the story in order."
            say: "Listen. Sam planted a seed. He watered it every day. A big sunflower grew. Put the story in order."
            options: ["He watered it every day.", "A big sunflower grew.", "Sam planted a seed."]
            slot_count: 3
            answer: ["Sam planted a seed.", "He watered it every day.", "A big sunflower grew."]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Mia lost her teddy. She looked under the bed. At last she found it in the garden.\n\nWhere did Mia find her teddy?"
            say: "Listen. Mia lost her teddy. She looked under the bed. At last she found it in the garden. Where did Mia find her teddy?"
            show: { object: teddy }
            options: ["in the garden", "under the bed", "in the bath"]
            answer: "in the garden"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Straw, sticks or bricks?"
            say: "Three little pigs want to build houses, and a big bad wolf is coming. What do you think: what is the best thing to build a house with? Straw, sticks or bricks? Have a guess, then listen to the tale."
            show: { object: wolf }
          - text: "Three little pigs each built a house. The first pig used straw. The second pig used sticks. The third pig used bricks. A wolf came. 'Little pig, little pig, let me come in!' He huffed and he puffed and he blew the straw house down. Then he blew the stick house down. But he could not blow down the brick house, and the pigs were safe."
            say: "This is a traditional tale. Traditional tales are old stories that people have told for hundreds of years. Listen to The Three Little Pigs. Three little pigs each built a house. The first pig used straw. The second pig used sticks. The third pig used bricks. A wolf came. Little pig, little pig, let me come in! He huffed and he puffed and he blew the straw house down. Then he blew the stick house down. But he could not blow down the brick house, and the pigs were safe."
            show: { object: pig }
          - text: "Three billy goats wanted the green grass on the other side of the bridge. A troll lived under the bridge. 'Who is that trip-trapping over my bridge?' The little goat went first. 'Wait for my bigger brother,' he said. The middle goat said the same. Then the big goat came, and he knocked the troll into the river. The goats ate the green grass."
            say: "Here is another tale: The Three Billy Goats Gruff. Three billy goats wanted the green grass on the other side of the bridge. A troll lived under the bridge. Who is that trip-trapping over my bridge? The little goat went first. Wait for my bigger brother, he said. The middle goat said the same. Then the big goat came, and he knocked the troll into the river. The goats ate the green grass."
            show: { object: bridge }
          - text: "first → next → in the end"
            say: "When you retell a tale, start at the beginning. Say what happened first, what happened next, and how it ended."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The Three Little Pigs: what did the third pig build his house with?"
                say: "In The Three Little Pigs, what did the third pig build his house with?"
                show: { object: pig }
                options: ["bricks", "straw", "sticks"]
                answer: "bricks"
                feedback:
                  straw: "The first pig used straw, and the wolf blew it down."
                hints:
                  - "Think of the house the wolf could not blow down."
                  - "The straw house fell. The stick house fell. The third house stayed up."
                  - "Bricks."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "The Three Little Pigs: who blew the houses down?"
                say: "In The Three Little Pigs, who blew the houses down?"
                options: ["the wolf", "the troll", "the third pig"]
                answer: "the wolf"
                feedback:
                  the troll: "The troll is in a different tale, The Three Billy Goats Gruff."
                hints:
                  - "Who came to the pigs' doors?"
                  - "He huffed and he puffed."
                  - "The wolf."
              - id: l1-f3
                type: multiple_choice
                text: "The Three Billy Goats Gruff: where did the troll live?"
                say: "In The Three Billy Goats Gruff, where did the troll live?"
                show: { object: bridge }
                options: ["under the bridge", "in a brick house", "in the green grass"]
                answer: "under the bridge"
                hints:
                  - "The goats had to cross something to reach the grass."
                  - "He shouted at the goats trip-trapping over it."
                  - "Under the bridge."
              - id: l1-f4
                type: ordering
                text: "Retell The Three Little Pigs. Put it in order."
                say: "Retell The Three Little Pigs. What happened first, what happened next, and how did it end? Put it in order."
                options: ["The wolf blew down the straw house.", "The wolf could not blow down the brick house.", "Three pigs built houses."]
                slot_count: 3
                answer: ["Three pigs built houses.", "The wolf blew down the straw house.", "The wolf could not blow down the brick house."]
                hints:
                  - "What has to happen before the wolf can blow anything down?"
                  - "First the pigs built their houses. The brick house comes at the end."
                  - "Pigs built houses, straw house blown down, brick house stayed up."
              - id: l1-f5
                type: true_false
                text: "Is it true? In The Three Billy Goats Gruff, the little goat crossed the bridge first."
                answer: true
                hints:
                  - "Think of the order: little, middle, big."
                  - "The little goat said: Wait for my bigger brother."
                  - "Yes, the little goat went first."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Why did the billy goats want to cross the bridge?"
                options: ["to eat the green grass", "to visit the troll", "to build a house"]
                answer: "to eat the green grass"
                hints: ["What did the goats do at the very end?"]
              - id: l1-s2
                type: true_false
                text: "Is it true? The wolf blew down the brick house."
                answer: false
                hints: ["Which house kept the pigs safe?"]
              - id: l1-s3
                type: ordering
                text: "Retell The Three Billy Goats Gruff. Put it in order."
                options: ["The big goat knocked the troll into the river.", "The goats ate the green grass.", "The little goat trip-trapped over the bridge."]
                slot_count: 3
                answer: ["The little goat trip-trapped over the bridge.", "The big goat knocked the troll into the river.", "The goats ate the green grass."]
                hints: ["The little goat goes first; the grass comes last."]
              - id: l1-s4
                type: multiple_choice
                text: "What did the wolf say at the pigs' doors?"
                options: ["Little pig, little pig, let me come in!", "Who is that trip-trapping over my bridge?", "Wait for my bigger brother!"]
                answer: "Little pig, little pig, let me come in!"
                feedback:
                  "Who is that trip-trapping over my bridge?": "That is the troll in The Three Billy Goats Gruff."
                hints: ["The wolf wanted to get into the house."]
              - id: l1-s5
                type: multiple_choice
                text: "Which tale has a troll in it?"
                options: ["The Three Billy Goats Gruff", "The Three Little Pigs"]
                answer: "The Three Billy Goats Gruff"
                hints: ["The troll lived under a bridge."]

          - support: none
            tasks:
              - id: l1-n3
                type: true_false
                text: "Is it true? At the end of The Three Little Pigs, the pigs are safe."
                answer: true
              - id: l1-n1
                type: multiple_choice
                text: "What did the second pig build his house with?"
                options: ["sticks", "straw", "bricks"]
                answer: "sticks"
              - id: l1-n2
                type: multiple_choice
                text: "Who said, 'Who is that trip-trapping over my bridge?'"
                options: ["the troll", "the wolf", "the big goat"]
                answer: "the troll"
              - id: l1-n4
                type: ordering
                text: "Retell The Three Little Pigs. Put all four parts in order."
                options: ["The wolf blew down the stick house.", "Three pigs built houses.", "The pigs were safe in the brick house.", "The wolf blew down the straw house."]
                slot_count: 4
                answer: ["Three pigs built houses.", "The wolf blew down the straw house.", "The wolf blew down the stick house.", "The pigs were safe in the brick house."]
              - id: l1-n5
                type: multiple_choice
                text: "Which goat knocked the troll into the river?"
                options: ["the big goat", "the little goat", "the middle goat"]
                answer: "the big goat"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What did the first pig build his house with?"
            options: ["straw", "bricks", "sticks"]
            answer: "straw"
          - id: l1-c2
            type: multiple_choice
            text: "What did the little goat say to the troll?"
            options: ["Wait for my bigger brother.", "Let me come in!", "I will blow your house down."]
            answer: "Wait for my bigger brother."
          - id: l1-c3
            type: true_false
            text: "Is it true? The troll lived in a brick house."
            answer: false
          - id: l1-c4
            type: true_false
            text: "Is it true? The wolf blew down the straw house."
            answer: true
          - id: l1-c5
            type: ordering
            text: "Put the billy goats in the order they crossed the bridge."
            options: ["the big goat", "the little goat", "the middle goat"]
            slot_count: 3
            answer: ["the little goat", "the middle goat", "the big goat"]
          - id: l1-c6
            type: multiple_choice
            text: "What did the big goat do to the troll?"
            options: ["He knocked him into the river.", "He gave him some grass.", "He built him a house."]
            answer: "He knocked him into the river."

  - n: 2
    title: { de: "Die kleine rote Henne und der Lebkuchenmann", en: "The hen and the Gingerbread Man" }
    goal:
      de: "Erzähl die kleine rote Henne und den Lebkuchenmann nach und sprich die Zeilen mit, die immer wiederkommen."
      en: "Retell The Little Red Hen and The Gingerbread Man, and join in with the lines that come back."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Who lived under the bridge?"
            options: ["the troll", "the wolf", "the little goat"]
            answer: "the troll"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? The wolf could not blow down the stick house."
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Will they help?"
            say: "The Little Red Hen has lots of work to do, and she asks her friends for help. What do you think: will they help her? Have a guess, then listen."
            show: { object: hen }
          - text: "The Little Red Hen found some wheat. 'Who will help me plant it?' 'Not I,' said the cat. 'Not I,' said the dog. 'Not I,' said the duck. So she planted it herself. No one helped her cut the wheat or bake the bread. Then she asked, 'Who will help me eat the bread?' 'I will!' they all said. 'No,' said the hen. 'I will eat it myself.'"
            say: "Listen to The Little Red Hen. The Little Red Hen found some wheat. Who will help me plant it? Not I, said the cat. Not I, said the dog. Not I, said the duck. So she planted it herself. No one helped her cut the wheat or bake the bread. Then she asked, Who will help me eat the bread? I will! they all said. No, said the hen. I will eat it myself."
            show: { object: bread }
          - text: "An old woman baked a gingerbread man. He jumped up and ran away. 'Run, run, as fast as you can! You can't catch me, I'm the Gingerbread Man!' The old woman ran after him, then a cow. At the river a fox said, 'Jump on my back and I will take you across.' Halfway over, the fox tossed him up and snap! The Gingerbread Man was gone."
            say: "Now listen to The Gingerbread Man. An old woman baked a gingerbread man. He jumped up and ran away. Run, run, as fast as you can! You can't catch me, I'm the Gingerbread Man! The old woman ran after him, then a cow. At the river a fox said, Jump on my back and I will take you across. Halfway over, the fox tossed him up and snap! The Gingerbread Man was gone."
            show: { object: fox }
          - text: "'Not I.'   'Run, run, as fast as you can!'"
            say: "Lots of traditional tales have a line that comes again and again. Join in when you hear it. It helps you remember the tale and retell it."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Who helped the Little Red Hen plant the wheat?"
                options: ["no one", "the cat", "the duck"]
                answer: "no one"
                feedback:
                  the cat: "The cat said, 'Not I.' Nobody helped."
                hints:
                  - "What did each animal say when she asked?"
                  - "The cat, the dog and the duck all said: Not I."
                  - "No one helped."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What did the Little Red Hen make with the wheat?"
                show: { object: bread }
                options: ["bread", "cake", "pie"]
                answer: "bread"
                hints:
                  - "At the end, everyone wanted to eat it."
                  - "Who will help me eat the ...?"
                  - "Bread."
              - id: l2-f3
                type: multiple_choice
                text: "Who ate the Gingerbread Man?"
                options: ["the fox", "the cow", "the old woman"]
                answer: "the fox"
                feedback:
                  the cow: "The cow ran after him, but she did not catch him."
                hints:
                  - "Think of the end of the tale, at the river."
                  - "Someone offered him a ride across the water."
                  - "The fox."
              - id: l2-f4
                type: ordering
                text: "Retell The Little Red Hen. Put it in order."
                options: ["The hen made bread.", "The hen ate the bread herself.", "The hen found some wheat.", "No one would help her plant it."]
                slot_count: 4
                answer: ["The hen found some wheat.", "No one would help her plant it.", "The hen made bread.", "The hen ate the bread herself."]
                hints:
                  - "What did the hen need before she could plant anything?"
                  - "She found the wheat first. Eating the bread comes last."
                  - "Found wheat, no one helped, made bread, ate it herself."
              - id: l2-f5
                type: multiple_choice
                text: "What did the Gingerbread Man shout as he ran?"
                options: ["Run, run, as fast as you can!", "Not I!", "Little pig, little pig, let me come in!"]
                answer: "Run, run, as fast as you can!"
                feedback:
                  "Not I!": "That is what the animals say in The Little Red Hen."
                hints:
                  - "He wanted everyone to chase him."
                  - "He said: You can't catch me!"
                  - "Run, run, as fast as you can!"

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Is it true? The animals helped the hen eat the bread."
                answer: false
                hints: ["What did the hen say when they all said, 'I will!'?"]
              - id: l2-s2
                type: multiple_choice
                text: "Why did the hen eat the bread herself?"
                options: ["No one helped her make it.", "The bread was too small.", "The cat was asleep."]
                answer: "No one helped her make it."
                hints: ["Think of all the times the animals said, 'Not I.'"]
              - id: l2-s3
                type: ordering
                text: "Retell The Gingerbread Man. Put it in order."
                options: ["A fox tricked him at the river.", "An old woman baked a gingerbread man.", "He jumped up and ran away."]
                slot_count: 3
                answer: ["An old woman baked a gingerbread man.", "He jumped up and ran away.", "A fox tricked him at the river."]
                hints: ["He has to be baked before he can run."]
              - id: l2-s4
                type: multiple_choice
                text: "Which tale has the line 'Not I'?"
                options: ["The Little Red Hen", "The Gingerbread Man", "The Three Little Pigs"]
                answer: "The Little Red Hen"
                hints: ["Who kept asking for help?"]
              - id: l2-s5
                type: multiple_choice
                text: "How did the fox trick the Gingerbread Man?"
                options: ["He said he would carry him across the river.", "He baked him a cake.", "He blew his house down."]
                answer: "He said he would carry him across the river."
                hints: ["The fox said: Jump on my back."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What did the Little Red Hen find at the start?"
                options: ["some wheat", "a gingerbread man", "an egg"]
                answer: "some wheat"
              - id: l2-n2
                type: true_false
                text: "Is it true? The fox said, 'Jump on my back.'"
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Who ran after the Gingerbread Man first?"
                options: ["the old woman", "the fox", "the hen"]
                answer: "the old woman"
              - id: l2-n4
                type: ordering
                text: "Put this part of The Little Red Hen in order."
                options: ["The animals said, 'Not I.'", "The hen did the work herself.", "The hen asked, 'Who will help me?'"]
                slot_count: 3
                answer: ["The hen asked, 'Who will help me?'", "The animals said, 'Not I.'", "The hen did the work herself."]
              - id: l2-n5
                type: multiple_choice
                text: "Which character tricks someone?"
                options: ["the fox", "the hen", "the old woman"]
                answer: "the fox"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "The hen asked who would help her plant the wheat. What did the animals say?"
            options: ["Not I.", "I will!", "Run, run!"]
            answer: "Not I."
          - id: l2-c2
            type: true_false
            text: "Is it true? The Gingerbread Man got away from the fox."
            answer: false
          - id: l2-c3
            type: multiple_choice
            text: "Who baked the Gingerbread Man?"
            options: ["an old woman", "the Little Red Hen", "the fox"]
            answer: "an old woman"
          - id: l2-c4
            type: multiple_choice
            text: "Which animals said 'Not I' to the Little Red Hen?"
            options: ["the cat, the dog and the duck", "the fox and the cow", "the three bears"]
            answer: "the cat, the dog and the duck"
          - id: l2-c5
            type: ordering
            text: "Retell The Gingerbread Man. Put it in order."
            options: ["He met a fox at the river.", "The cow ran after him.", "The old woman ran after him."]
            slot_count: 3
            answer: ["The old woman ran after him.", "The cow ran after him.", "He met a fox at the river."]
          - id: l2-c6
            type: true_false
            text: "Is it true? The Little Red Hen asked, 'Who will help me eat the bread?'"
            answer: true

  - n: 3
    title: { de: "Goldlöckchen und was Märchen besonders macht", en: "Goldilocks and what makes a tale" }
    goal:
      de: "Finde heraus, was ein Märchen besonders macht, so wie es war einmal und Dinge, die es dreimal gibt."
      en: "Find out what makes a fairy tale special, like once upon a time and things in threes."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Who tricked the Gingerbread Man at the river?"
            options: ["the fox", "the cow", "the hen"]
            answer: "the fox"
            difficulty: easy
          - id: l3-w2
            type: true_false
            text: "Is it true? The cat helped the hen plant the wheat."
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Whose house is it?"
            say: "A girl called Goldilocks finds a little house in the woods. The door is open, and no one is at home. What do you think: who lives there? Have a guess, then listen."
            show: { object: house }
          - text: "Once upon a time, Goldilocks went into the house of the three bears. She tasted three bowls of porridge: too hot, too cold, just right. She sat on three chairs and broke the little one. She tried three beds and fell asleep in the little one. The bears came home. 'Someone's been eating my porridge!' said each bear. 'Someone's been sleeping in my bed, and here she is!' said Baby Bear. Goldilocks woke up and ran away."
            say: "Listen to Goldilocks and the Three Bears. Once upon a time, Goldilocks went into the house of the three bears. She tasted three bowls of porridge: too hot, too cold, just right. She sat on three chairs and broke the little one. She tried three beds and fell asleep in the little one. The bears came home. Someone's been eating my porridge! said each bear. Someone's been sleeping in my bed, and here she is! said Baby Bear. Goldilocks woke up and ran away."
            show: { object: bed }
          - text: "Did you know?"
            say: "Did you know? When this tale was first written down, nearly two hundred years ago, there was no Goldilocks. The visitor in the bears' house was a rude old woman!"
            show: { object: bear }
          - text: "Once upon a time ...\n... and they all lived happily ever after."
            say: "What makes these tales special? Many start with Once upon a time, and many end with happily ever after."
          - text: "three pigs, three goats, three bears"
            say: "Things come in threes: three pigs, three goats, three bowls of porridge. The third one is often the one that works: the brick house, the big goat, the porridge that is just right."
          - text: "'Not I.'   'Someone's been eating my porridge!'"
            say: "A line comes again and again, so you can join in. And there is often a bad or tricky character: the wolf, the troll or the fox."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Which porridge did Goldilocks eat up?"
                options: ["the one that was just right", "the one that was too hot", "the one that was too cold"]
                answer: "the one that was just right"
                feedback:
                  the one that was too hot: "Too hot to eat! She ate the one that was just right."
                hints:
                  - "She tasted all three bowls."
                  - "Too hot, too cold, then ..."
                  - "The one that was just right."
                difficulty: easy
              - id: l3-f2
                type: true_false
                text: "Is it true? Goldilocks broke Daddy Bear's chair."
                show: { object: chair }
                answer: false
                hints:
                  - "She broke the little chair."
                  - "Is Daddy Bear the littlest bear?"
                  - "No. She broke Baby Bear's chair."
              - id: l3-f3
                type: multiple_choice
                text: "Which is a fairy-tale opening?"
