# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.read-own-writing
skill: lit-en.composition.read-own-writing
curriculum: en-GB
language: en
title:
  de: Den eigenen Text vorlesen
  en: Reading my writing aloud
summary: >
  When we read our writing to someone, we read it clearly and let our
  voice show what it means. Lesson 1 reads clearly: loud enough, not too
  fast, with a pause at each full stop. Lesson 2 lets the punctuation lead
  the voice (a question goes up at the end, an exclamation mark sounds
  excited or loud) and ends with the skill check. Reading aloud is
  practised with the speak tasks in Practise and is not marked; the skill
  check marks what a screen can mark: what makes reading clear, where to
  pause, and which voice the punctuation asks for.
metadata:
  year: year-1
  topic: { de: "Texte schreiben", en: "Writing" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.composition.reread-check]
  also_practises: [lit-en.grammar.sentence-punctuation]
  vocabulary: { en: [read aloud, clear, loud, pause, full stop, question mark, exclamation mark, voice, expression] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: clearly, what: { de: "deutlich vorlesen: laut genug, langsam genug, mit Blick zu den Zuhörern", en: "reading clearly: loud enough, slow enough, looking up" } }
    - { id: pause, what: { de: beim Punkt eine Pause machen, en: pausing at a full stop } }
    - { id: voice, what: { de: "die Stimme nach dem Satzzeichen richten (Frage, Ausruf, Punkt)", en: "letting the punctuation lead the voice (question, exclamation, full stop)" } }
  misconceptions:
    - id: no-pause
      what: Reads straight through full stops, so the sentences run together
      addressed: Learn screen 3 in lesson 1; l1-f2, l1-s2, l1-n2 and l2-c2 ask where to pause
    - id: flat-voice
      what: Reads every sentence in the same flat voice, whatever the punctuation
      addressed: Learn in lesson 2; l2-f1 feedback on calm and flat; l2-s1 and l2-c3
    - id: fast-is-good
      what: Thinks reading fast is reading well
      addressed: Learn screens 1 and 2 in lesson 1; l1-f1 feedback on as fast as you can; l1-n1 and l2-c1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Deutlich vorlesen", en: "Reading clearly" }
    goal:
      de: "Lies deinen Text laut und deutlich vor und mach bei jedem Punkt eine kleine Pause."
      en: "Read your writing out loud in a clear voice, and pause at every full stop."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            show: { drawn: letter-card, text: "I ride my bike to the moon every day." }
            spans: ["moon"]
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? When you finish writing, you read it back to check it."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "How do you read your writing to the class?"
            say: "Imagine you are going to read your writing to the whole class. What do you think helps everyone hear it and enjoy it? Have a guess."
          - text: "Look up.\nSpeak up.\nSlow down."
            say: "When you read your writing to the class, hold it so they can see your face. Use a voice everyone can hear. Go slowly, so every word is clear."
          - text: "I have a cat. She is called Pip."
            say: "Listen. I have a cat. Stop. She is called Pip. A full stop tells you to stop for a moment before the next sentence."
          - text: "Point. Read. Pause."
            say: "Point to the words as you read. Pause at every full stop. Then look up at your listeners."
          - text: "Did you know? You can feel your voice."
            say: "Did you know? Your voice comes from two tiny flaps inside your throat. When you talk, they wobble very, very fast. Put your hand on the front of your throat and say aaah. Can you feel the buzz?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ruby is going to read her writing to the class. What should she do?"
                say: "Ruby is going to read her writing to the class. What should she do?"
                options: ["read slowly in a clear voice", "read as fast as she can", "whisper so no one hears a mistake"]
                answer: "read slowly in a clear voice"
                feedback:
                  "read as fast as she can": "Fast reading is hard to follow. Slow and clear helps your listeners."
                  "whisper so no one hears a mistake": "A secret reading? Then nobody hears her lovely writing! Slow and clear helps your listeners."
                hints:
                  - "Think about the people listening."
                  - "They need to hear every word."
                  - "Read slowly in a clear voice."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Where do you pause? Tap the word before the pause."
                show: { drawn: letter-card, text: "We went to the beach. It was sunny." }
                spans: ["beach."]
                hints:
                  - "Look for a full stop in the middle."
                  - "The first sentence ends with a full stop."
                  - "beach. Pause after it."
              - id: l1-f3
                type: speak
                text: "I like to paint. My favourite colour is blue.\n\nRead it out loud."
                say: "Read Ollie's writing out loud. Pause at the full stop. Then listen and check."
                expected_text: "I like to paint. My favourite colour is blue."
                hints:
                  - "Point to each word as you go."
                  - "Stop for a moment after paint."
                  - "I like to paint. Pause. My favourite colour is blue."
              - id: l1-f4
                type: true_false
                text: "Is it true? You should look up at your listeners when you read to them."
                answer: true
                hints:
                  - "How do people know you are talking to them?"
                  - "They can see your face."
                  - "Yes."
              - id: l1-f5
                type: highlight_in_text
                text: "Where do you pause? Tap the word before each pause."
                show: { drawn: letter-card, text: "My nan has a garden. It has a pond. We feed the fish." }
                spans: ["garden.", "pond."]
                hints:
                  - "Find every full stop but the last."
                  - "There are three sentences, so two pauses inside."
                  - "Garden and pond. Pause after each one."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Arlo reads his writing, but no one can hear him. What should he do?"
                say: "Arlo reads his writing, but no one can hear him. What should he do?"
                options: ["speak up", "read faster", "turn away"]
                answer: "speak up"
                hints: ["The problem is that they cannot hear."]
              - id: l1-s2
                type: highlight_in_text
                text: "Where do you pause? Tap the word before the pause."
                show: { drawn: letter-card, text: "I lost my tooth. The tooth fairy came." }
                spans: ["tooth."]
                hints: ["Look for the full stop in the middle."]
              - id: l1-s3
                type: speak
                text: "We made a den. It was in the woods.\n\nRead it out loud."
                say: "Read Isla's writing out loud, clearly. Then listen and check."
                expected_text: "We made a den. It was in the woods."
                hints: ["Pause after den."]
              - id: l1-s4
                type: true_false
                text: "Is it true? You do not need to stop at a full stop when you read aloud."
                answer: false
                hints: ["What does a full stop tell your voice?"]
              - id: l1-s5
                type: multiple_choice
                text: "Why do we pause at a full stop?"
                options: ["so the listener knows a sentence has ended", "so we can turn the page", "because full stops are loud"]
                answer: "so the listener knows a sentence has ended"
                hints: ["A full stop comes at the end of something."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is the best way to read your writing to a friend?"
                options: ["clearly, at a steady speed", "very fast, all in one breath", "with the paper over your face"]
                answer: "clearly, at a steady speed"
              - id: l1-n2
                type: highlight_in_text
                text: "Where do you pause? Tap the word before each pause."
                show: { drawn: letter-card, text: "It snowed. We built a snowman. He had a carrot nose." }
                spans: ["snowed.", "snowman."]
              - id: l1-n3
                type: speak
                text: "My dad can juggle. He uses three balls.\n\nRead it out loud."
                say: "Read Sami's writing out loud. Then listen and check."
                expected_text: "My dad can juggle. He uses three balls."
              - id: l1-n4
                type: true_false
                text: "Is it true? Pointing to the words helps you read them in the right order."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Grace reads so fast the words run together. What should she do?"
                options: ["slow down", "read louder", "skip some words"]
                answer: "slow down"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Where do you pause? Tap the word before the pause."
            show: { drawn: letter-card, text: "The bus was late. We had to wait." }
            spans: ["late."]
          - id: l1-c2
            type: multiple_choice
            text: "Your class cannot hear you read. What should you do?"
            options: ["speak up", "read faster", "stop reading"]
            answer: "speak up"
          - id: l1-c3
            type: true_false
            text: "Is it true? A full stop tells you to pause."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Leo reads his writing to Dad. He looks at the floor the whole time. What should he do?"
            options: ["look up at Dad", "read faster", "whisper"]
            answer: "look up at Dad"
          - id: l1-c5
            type: multiple_choice
            text: "The sun came out. We went to the park.\n\nWhere do you pause?"
            say: "Read the writing. Where do you pause?"
            options: ["after out", "after sun", "after went"]
            answer: "after out"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Is it true? When you read to the class, use a voice only you can hear."
            answer: false

  - n: 2
    title: { de: "Mit Ausdruck vorlesen", en: "Reading with expression" }
    goal:
      de: "Lies mit Ausdruck, sodass deine Stimme bei einer Frage nach oben geht und beim Ausrufezeichen begeistert klingt."
      en: "Read with expression, so your voice goes up for a question and sounds excited for an exclamation mark."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Where do you pause? Tap the word before the pause."
            show: { drawn: letter-card, text: "I have a hamster. He is called Nibbles." }
            spans: ["hamster."]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What should you do when you read to the class?"
            options: ["speak clearly", "mumble", "read very fast"]
            answer: "speak clearly"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Can I play?"
            say: "Listen: Can I play? What do you think: does my voice go up or down at the end? Have a guess."
          - text: "Can I play?"
            say: "A question mark tells your voice to ask. Listen: Can I play? My voice goes up at the end, because I am waiting for an answer."
          - text: "We won!"
            say: "An exclamation mark tells your voice to sound excited, surprised or loud. Listen: We won!"
          - text: "The dog barked."
            say: "A full stop is calm. Listen: The dog barked. My voice drops down at the end."
          - text: "Look at the mark at the end, then choose your voice."
            say: "Before you read a sentence, peek at the end. Full stop, question mark or exclamation mark? Then read it in the right voice."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How should your voice sound?\n\nDo you like my picture?"
                say: "How should your voice sound when you read this?"
                options: ["asking, going up at the end", "calm and flat", "shouting"]
                answer: "asking, going up at the end"
                feedback:
                  "calm and flat": "Look at the end: a question mark. Your voice asks, and goes up."
                hints:
                  - "Look at the mark at the end."
                  - "It is a question mark."
                  - "Asking, going up at the end."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How should your voice sound?\n\nHelp, a spider!"
                say: "How should your voice sound when you read this?"
                options: ["excited or scared", "calm and quiet", "asking"]
                answer: "excited or scared"
                hints:
                  - "Look at the mark at the end."
                  - "An exclamation mark shows strong feeling."
                  - "Excited or scared."
              - id: l2-f3
                type: speak
                text: "Is it my turn? Yes, it is!\n\nRead it out loud."
                say: "Read Kofi's writing out loud. Ask the question, then sound excited. Then listen and check."
                expected_text: "Is it my turn? Yes, it is!"
                hints:
                  - "Peek at both marks first."
                  - "The first is a question, the second is excited."
                  - "Voice up for: Is it my turn? Excited for: Yes, it is!"
              - id: l2-f4
                type: matching
                text: "Match each sentence to how it sounds."
                option_audio: false
                pairs:
                  - { left: { text: "Where is Mum?" }, right: { text: "asking" } }
                  - { left: { text: "It is my birthday!" }, right: { text: "excited" } }
                  - { left: { text: "I had toast." }, right: { text: "calm" } }
                hints:
                  - "Look at the mark at the end of each one."
                  - "Question mark: asking. Exclamation mark: excited."
                  - "Where is Mum: asking. Birthday: excited. Toast: calm."
              - id: l2-f5
                type: true_false
                text: "Is it true? \"What a big cake!\" should sound excited."
                answer: true
                hints:
                  - "Look at the end."
                  - "An exclamation mark."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How should your voice sound?\n\nThe cat is asleep."
                say: "How should your voice sound when you read this?"
                options: ["calm, going down at the end", "asking", "shouting"]
                answer: "calm, going down at the end"
                hints: ["It ends with a full stop."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap the word to read in an excited voice."
                show: { drawn: letter-card, text: "I opened the box. Wow!" }
                spans: ["Wow!"]
                hints: ["Find the exclamation mark."]
              - id: l2-s3
                type: speak
                text: "Can you hear that? It is the ice cream van!\n\nRead it out loud."
                say: "Read Lena's writing out loud with expression. Then listen and check."
                expected_text: "Can you hear that? It is the ice cream van!"
                hints: ["Ask the first part, sound excited in the second."]
              - id: l2-s4
                type: true_false
                text: "Is it true? \"Where are my shoes?\" should sound calm and flat."
                answer: false
                hints: ["What mark is at the end?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which mark tells your voice to go up and ask?"
                options: ["question mark", "full stop", "exclamation mark"]
                answer: "question mark"
                hints: ["You use it when you want an answer."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How should your voice sound?\n\nWatch out!"
                say: "How should your voice sound when you read this?"
                options: ["loud and quick", "calm and slow", "asking"]
                answer: "loud and quick"
              - id: l2-n2
                type: matching
                text: "Match each sentence to how it sounds."
                option_audio: false
                pairs:
                  - { left: { text: "Is it raining?" }, right: { text: "asking" } }
                  - { left: { text: "I found it!" }, right: { text: "excited" } }
                  - { left: { text: "We went home." }, right: { text: "calm" } }
              - id: l2-n3
                type: speak
                text: "Where is my teddy? Oh, here he is!\n\nRead it out loud."
                say: "Read Ivy's writing out loud with expression. Then listen and check."
                expected_text: "Where is my teddy? Oh, here he is!"
              - id: l2-n4
                type: true_false
                text: "Is it true? You should look at the mark at the end before you read a sentence."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "How should your voice sound?\n\nWhat time is it?"
                say: "How should your voice sound when you read this?"
                options: ["asking, going up at the end", "excited", "calm, going down at the end"]
                answer: "asking, going up at the end"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: clearly
            type: multiple_choice
            text: "Theo reads his story to the class. Which is best?"
            options: ["slowly and clearly, looking up", "fast, looking at the floor", "in a whisper"]
            answer: "slowly and clearly, looking up"
          - id: l2-c2
            part: pause
            type: highlight_in_text
            text: "Where do you pause? Tap the word before each pause."
            show: { drawn: letter-card, text: "We went to the farm. I fed a lamb. It was soft." }
            spans: ["farm.", "lamb."]
          - id: l2-c3
            part: voice
            type: multiple_choice
            text: "How should your voice sound?\n\nCan we go to the park?"
            say: "How should your voice sound when you read this?"
            options: ["asking, going up at the end", "calm and flat", "shouting"]
            answer: "asking, going up at the end"
          - id: l2-c4
            part: voice
            type: multiple_choice
            text: "How should your voice sound?\n\nI won a prize!"
            say: "How should your voice sound when you read this?"
            options: ["excited", "asking", "sad and slow"]
            answer: "excited"
          - id: l2-c5
            part: voice
            type: true_false
            text: "Is it true? An exclamation mark tells your voice to ask a question."
            answer: false
          - id: l2-c6
            part: clearly
            type: multiple_choice
            text: "Zac holds his page right in front of his face when he reads. What should he do?"
            options: ["hold it lower, so they can see his face", "read faster", "read in a whisper"]
            answer: "hold it lower, so they can see his face"
          - id: l2-c7
            part: clearly
            type: true_false
            text: "Is it true? Reading as fast as you can is the best way to read to the class."
            answer: false
          - id: l2-c8
            part: clearly
            type: multiple_choice
            text: "Why should you read slowly to your listeners?"
            options: ["so they can hear every word", "so the story sounds sad", "so you finish last"]
            answer: "so they can hear every word"
          - id: l2-c9
            part: clearly
            type: multiple_choice
            text: "Mia reads to her group, but she keeps losing her place. Which tip helps her most?"
            options: ["point to the words as she reads", "read louder", "look out of the window"]
            answer: "point to the words as she reads"
          - id: l2-c10
            part: clearly
            type: true_false
            text: "Is it true? Your listeners should be able to see your face."
            answer: true
          - id: l2-c11
            part: clearly
            type: sorting
            text: "Does it help your listeners?"
            say: "Read each card. Does it help your listeners, or not? Put it in the right group."
            option_audio: false
            bins:
              - { id: helps, show: { text: "helps" }, say: "Helps." }
              - { id: not, show: { text: "does not help" }, say: "Does not help." }
            options:
              - { text: "look up", bin: helps }
              - { text: "mumble", bin: not }
              - { text: "speak up", bin: helps }
              - { text: "rush", bin: not }
          - id: l2-c12
            part: pause
            type: multiple_choice
            text: "I made a card for Gran. She loved it.\n\nWhere do you pause?"
            say: "Read the writing. Where do you pause?"
            options: ["after Gran", "after made", "after She"]
            answer: "after Gran"
            option_audio: false
          - id: l2-c13
            part: pause
            type: true_false
            text: "Is it true? You read \"We had chips. They were hot.\" without stopping."
            answer: false
          - id: l2-c14
            part: pause
            type: highlight_in_text
            text: "Where do you pause? Tap the word before each pause."
            show: { drawn: letter-card, text: "My brother is two. He likes trains. He has a red one." }
            spans: ["two.", "trains."]
          - id: l2-c15
            part: pause
            type: multiple_choice
            text: "I got up. I had my breakfast. I went to school.\n\nHow many times do you pause before the end?"
            say: "Read the writing. How many times do you pause before the end?"
            options: ["1", "2", "3"]
            answer: "2"
            keep_order: true
          - id: l2-c16
            part: pause
            type: multiple_choice
            text: "What does a full stop tell you to do when you read aloud?"
            options: ["stop for a moment", "shout the next word", "read faster"]
            answer: "stop for a moment"
          - id: l2-c17
            part: voice
            type: multiple_choice
            text: "Ella reads \"Is the shop open?\" in a calm, flat voice. What should she change?"
            options: ["make her voice go up at the end", "read it faster", "shout it"]
            answer: "make her voice go up at the end"
          - id: l2-c18
            part: voice
            type: true_false
            text: "Is it true? Your voice goes up at the end of \"Are you coming?\""
            answer: true
          - id: l2-c19
            part: voice
            type: highlight_in_text
            text: "Your voice goes up at the end of one sentence. Tap its last word."
            say: "Read the writing. Your voice goes up at the end of one sentence. Tap the last word of that sentence."
            show: { drawn: letter-card, text: "Mum made a cake. Can I have some? It is yummy." }
            spans: ["some"]
          - id: l2-c20
            part: voice
            type: multiple_choice
            text: "Which sentence should you read in a calm voice?"
            options: ["We had soup for lunch.", "We won the cup!", "Can I have some soup?"]
            answer: "We had soup for lunch."
            option_audio: false
