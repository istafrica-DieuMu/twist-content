# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.word-meanings
skill: lit-en.comprehension.word-meanings
curriculum: en-GB
language: en
title:
  de: Wortbedeutungen besprechen
  en: What does that word mean?
summary: >
  When we meet a new word in a story, we work out what it means and link
  it to words we already know. Lesson 1 finds a word's meaning from the
  rest of the sentence and links it to a word that means nearly the same
  (enormous, very big). Lesson 2 links words in other ways: opposites,
  words that belong to one group, and a known word inside a new one
  (snow, snowflake); it ends with the skill check. Sentences are read
  aloud.
metadata:
  year: year-1
  topic: { de: "Wörter im Text", en: "Words in texts" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.comprehension.retell]
  also_practises: []
  vocabulary: { en: [word, meaning, means, nearly the same, opposite, group, clue] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: context, what: { de: die Bedeutung eines neuen Wortes aus dem Satz erschließen, en: working out what a new word means from the sentence } }
    - { id: same, what: { de: "ein Wort mit einem verbinden, das fast dasselbe bedeutet", en: linking a word to one that means nearly the same } }
    - { id: opposite, what: { de: ein Wort mit seinem Gegenteil verbinden, en: linking a word to its opposite } }
    - { id: group, what: { de: ein Wort in eine Gruppe einordnen, en: putting a word in a group with words you know } }
    - { id: inside, what: { de: "ein bekanntes Wort in einem neuen Wort finden (snow, snowflake)", en: "using a word you know inside a new word (snow, snowflake)" } }
  misconceptions:
    - id: sound-alike-meaning
      what: Guesses a meaning from a word that sounds alike, not from the sentence (enormous as a kind of animal)
      addressed: Learn screen 1 in lesson 1; l1-f1 feedback on the sound-alike guess; l1-s1 and l1-n1
    - id: same-means-similar
      what: Picks a word that goes with the topic, not one that means nearly the same (huge for elephant)
      addressed: l1-f3 feedback on the topic word; l1-s3 and l2-c2
    - id: opposite-vs-similar
      what: Mixes up a word that means the same with one that means the opposite
      addressed: Learn screen 1 in lesson 2; l2-f1 feedback; l2-s1 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Neue Wörter verstehen", en: "Working out new words" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "A frog sat on a log. It saw a fly. It ate the fly.\n\nRetell the story in order."
            say: "Listen. A frog sat on a log. It saw a fly. It ate the fly. Put the story in order."
            options: ["It ate the fly.", "A frog sat on a log.", "It saw a fly."]
            slot_count: 3
            answer: ["A frog sat on a log.", "It saw a fly.", "It ate the fly."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? When you retell a story, you can use new words from it."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The giant was enormous. His head touched the clouds."
            say: "Enormous is a new word. Look for clues in the sentences. His head touched the clouds, so he must be very, very big. Enormous means very big."
          - text: "enormous ... huge ... very big"
            say: "Now link it to words you know. Enormous means nearly the same as huge, or very big. Linking words helps you remember them."
          - text: "The mouse was tiny. It could hide in a shoe."
            say: "Tiny. Clue: it could hide in a shoe. Tiny means very small. It is like little."
            show: { object: mouse }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ben was famished. He ate three sandwiches and an apple.\n\nWhat does famished mean?"
                say: "Listen. Ben was famished. He ate three sandwiches and an apple. What does famished mean?"
                options: ["very hungry", "very famous", "very sleepy"]
                answer: "very hungry"
                feedback:
                  "very famous": "Famished sounds a bit like famous, but look at the clue. Ben ate a lot."
                hints:
                  - "Look at the clue in the next sentence."
                  - "He ate lots of food."
                  - "Very hungry."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "The path was slippery. Gran held the rail so she did not fall.\n\nWhat does slippery mean?"
                say: "Listen. The path was slippery. Gran held the rail so she did not fall. What does slippery mean?"
                options: ["easy to slide on", "very long", "full of flowers"]
                answer: "easy to slide on"
                hints:
                  - "Why did Gran hold the rail?"
                  - "She did not want to fall."
                  - "Easy to slide on."
              - id: l1-f3
                type: multiple_choice
                text: "Which word means nearly the same as big?"
                options: ["huge", "elephant", "tiny"]
                answer: "huge"
                feedback:
                  "elephant": "An elephant is big, but elephant does not mean big. Which word means the same?"
                hints:
                  - "Think of a word you could use in place of big."
                  - "A big house is a ... house."
                  - "Huge."
              - id: l1-f4
                type: matching
                text: "Match the words that mean nearly the same."
                pairs:
                  - { left: { text: "little" }, right: { text: "small" } }
                  - { left: { text: "happy" }, right: { text: "glad" } }
                  - { left: { text: "quick" }, right: { text: "fast" } }
                hints:
                  - "Try each pair in a sentence."
                  - "A little dog is a small dog."
                  - "little and small, happy and glad, quick and fast."
              - id: l1-f5
                type: true_false
                text: "Is it true? \"The soup was scorching. Steam came off it.\" Scorching means very hot."
                answer: true
                hints:
                  - "What does steam tell you?"
                  - "Steam comes off hot things."
                  - "Yes, very hot."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Mia was exhausted after the long walk. She fell asleep in the car.\n\nWhat does exhausted mean?"
                say: "Listen. Mia was exhausted after the long walk. She fell asleep in the car. What does exhausted mean?"
                options: ["very tired", "very excited", "very cold"]
                answer: "very tired"
                hints: ["What did Mia do in the car?"]
              - id: l1-s2
                type: multiple_choice
                text: "Raj whispered so he would not wake the baby.\n\nWhat does whispered mean?"
                say: "Listen. Raj whispered so he would not wake the baby. What does whispered mean?"
                options: ["spoke very quietly", "shouted", "sang a song"]
                answer: "spoke very quietly"
                hints: ["He did not want to wake the baby."]
              - id: l1-s3
                type: multiple_choice
                text: "Which word means nearly the same as cold?"
                options: ["chilly", "snow", "hot"]
                answer: "chilly"
                hints: ["Which word could you use in place of cold?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? \"The puppy was timid. It hid under the bed.\" Timid means brave."
                answer: false
                hints: ["What did the puppy do?"]
              - id: l1-s5
                type: matching
                text: "Match the words that mean nearly the same."
                pairs:
                  - { left: { text: "shout" }, right: { text: "yell" } }
                  - { left: { text: "noisy" }, right: { text: "loud" } }
                  - { left: { text: "begin" }, right: { text: "start" } }
                hints: ["Try one word in place of the other."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The baby bird was fragile. Dad held it very gently.\n\nWhat does fragile mean?"
                say: "Listen. The baby bird was fragile. Dad held it very gently. What does fragile mean?"
                options: ["easy to hurt or break", "very loud", "very heavy"]
                answer: "easy to hurt or break"
              - id: l1-n2
                type: multiple_choice
                text: "Leo was furious. He stamped his feet and went red.\n\nWhat does furious mean?"
                say: "Listen. Leo was furious. He stamped his feet and went red. What does furious mean?"
                options: ["very cross", "very happy", "very furry"]
                answer: "very cross"
              - id: l1-n3
                type: multiple_choice
                text: "Which word means nearly the same as jump?"
                options: ["leap", "frog", "sit"]
                answer: "leap"
              - id: l1-n4
                type: true_false
                text: "Is it true? \"The room was gloomy. We could not see the toys.\" Gloomy means dark."
                answer: true
              - id: l1-n5
                type: matching
                text: "Match the words that mean nearly the same."
                pairs:
                  - { left: { text: "big" }, right: { text: "large" } }
                  - { left: { text: "sad" }, right: { text: "unhappy" } }
                  - { left: { text: "shut" }, right: { text: "close" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The pond was shallow. The water only came up to Sam's ankles.\n\nWhat does shallow mean?"
            say: "Listen. The pond was shallow. The water only came up to Sam's ankles. What does shallow mean?"
            options: ["not deep", "very deep", "very dirty"]
            answer: "not deep"
          - id: l1-c2
            type: multiple_choice
            text: "Which word means nearly the same as small?"
            options: ["tiny", "mouse", "tall"]
            answer: "tiny"
          - id: l1-c3
            type: true_false
            text: "Is it true? \"The cake was delicious. Everyone wanted more.\" Delicious means very tasty."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "The kitten was drenched. It had been out in the rain all night.\n\nWhat does drenched mean?"
            say: "Listen. The kitten was drenched. It had been out in the rain all night. What does drenched mean?"
            options: ["very wet", "very dirty", "very dry"]
            answer: "very wet"
          - id: l1-c5
            type: matching
            text: "Match the words that mean nearly the same."
            pairs:
              - { left: { text: "rush" }, right: { text: "hurry" } }
              - { left: { text: "grin" }, right: { text: "smile" } }
              - { left: { text: "kind" }, right: { text: "nice" } }
          - id: l1-c6
            type: true_false
            text: "Is it true? \"The lion gave a mighty roar. Everyone in the zoo heard it.\" Mighty means very quiet."
            answer: false

  - n: 2
    title: { de: "Wörter verbinden", en: "Linking words" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which word means nearly the same as quick?"
            options: ["fast", "slow", "car"]
            answer: "fast"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "The giant was enormous.\n\nWhat does enormous mean?"
            say: "The giant was enormous. What does enormous mean?"
            options: ["very big", "very kind", "very small"]
            answer: "very big"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "hot ↔ cold\nhappy ↔ sad"
            say: "Some words mean the opposite. Hot and cold. Happy and sad. If you know one, it helps you understand the other."
          - text: "lion, tiger, giraffe: animals"
            say: "Some words belong to the same group. Cheetah is a new word, but a cheetah is an animal, like a lion. Putting new words in a group helps you remember them."
            show: { object: lion }
          - text: "snow → snowman, snowflake"
            say: "Sometimes a new word has a word you know inside it. Snowflake has snow in it, so it is something to do with snow. A snowflake is a tiny bit of snow."
            show: { object: snowman }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which word means the opposite of fast?"
                options: ["slow", "quick", "run"]
                answer: "slow"
                feedback:
                  "quick": "Quick means nearly the same as fast. We want the opposite."
                hints:
                  - "Opposite means as different as can be."
                  - "A snail is not fast. It is ..."
                  - "Slow."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Which group?"
                say: "Sort the words. Is it something to eat, or something to wear?"
                option_audio: false
                bins:
                  - { id: eat, show: { object: pizza }, say: "To eat." }
                  - { id: wear, show: { object: jumper }, say: "To wear." }
                options:
                  - { text: "carrot", bin: eat }
                  - { text: "scarf", bin: wear }
                  - { text: "grapes", bin: eat }
                  - { text: "gloves", bin: wear }
                hints:
                  - "Ask: would I eat it or put it on?"
                  - "A scarf goes round your neck."
                  - "Carrot and grapes to eat. Scarf and gloves to wear."
              - id: l2-f3
                type: multiple_choice
                text: "A raindrop is ..."
                say: "Raindrop has a word you know inside it. What is a raindrop?"
                show: { object: rain }
                options: ["a little drop of rain", "a kind of bird", "a big puddle"]
                answer: "a little drop of rain"
                hints:
                  - "Find the word you know inside raindrop."
                  - "Rain ... drop."
                  - "A little drop of rain."
              - id: l2-f4
                type: matching
                text: "Match each word to its opposite."
                pairs:
                  - { left: { text: "up" }, right: { text: "down" } }
                  - { left: { text: "open" }, right: { text: "shut" } }
                  - { left: { text: "full" }, right: { text: "empty" } }
                hints:
                  - "Opposites are as different as can be."
                  - "A box can be full or ..."
                  - "up and down, open and shut, full and empty."
              - id: l2-f5
                type: true_false
                text: "Is it true? A cheetah is an animal."
                answer: true
                hints:
                  - "Which group did the cheetah go in?"
                  - "It is like a lion."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which word means the opposite of happy?"
                options: ["sad", "glad", "smile"]
                answer: "sad"
                hints: ["Glad means nearly the same."]
              - id: l2-s2
                type: sorting
                text: "Which group?"
                say: "Sort the words. Is it an animal, or a place?"
                option_audio: false
                bins:
                  - { id: animal, show: { object: dog }, say: "An animal." }
                  - { id: place, show: { object: park }, say: "A place." }
                options:
                  - { text: "hamster", bin: animal }
                  - { text: "library", bin: place }
                  - { text: "parrot", bin: animal }
                  - { text: "beach", bin: place }
                hints: ["Can it move about on its own?"]
              - id: l2-s3
                type: multiple_choice
                text: "A bookshelf is ..."
                say: "Bookshelf has a word you know inside it. What is a bookshelf?"
                options: ["a shelf for books", "a kind of book", "a book about shelves"]
                answer: "a shelf for books"
                hints: ["Book ... shelf."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Wet is the opposite of dry."
                answer: true
                hints: ["Think of a towel after a bath."]
              - id: l2-s5
                type: matching
                text: "Match each word to its opposite."
                pairs:
                  - { left: { text: "big" }, right: { text: "small" } }
                  - { left: { text: "day" }, right: { text: "night" } }
                  - { left: { text: "in" }, right: { text: "out" } }
                hints: ["Opposites are as different as can be."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which word means the opposite of loud?"
                options: ["quiet", "noisy", "music"]
                answer: "quiet"
              - id: l2-n2
                type: sorting
                text: "Which group?"
                say: "Sort the words. Is it something to eat, or something to wear?"
                option_audio: false
                bins:
                  - { id: eat, show: { object: pizza }, say: "To eat." }
                  - { id: wear, show: { object: jumper }, say: "To wear." }
                options:
                  - { text: "boots", bin: wear }
                  - { text: "pasta", bin: eat }
                  - { text: "cap", bin: wear }
                  - { text: "plum", bin: eat }
              - id: l2-n3
                type: multiple_choice
                text: "A teapot is ..."
                say: "Teapot has a word you know inside it. What is a teapot?"
                options: ["a pot for making tea", "a kind of cake", "a cup with no handle"]
                answer: "a pot for making tea"
              - id: l2-n4
                type: true_false
                text: "Is it true? Old is the opposite of young."
                answer: true
              - id: l2-n5
                type: matching
                text: "Match the words that mean nearly the same."
                pairs:
                  - { left: { text: "tired" }, right: { text: "sleepy" } }
                  - { left: { text: "cross" }, right: { text: "angry" } }
                  - { left: { text: "jump" }, right: { text: "hop" } }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: context
            type: multiple_choice
            text: "The tortoise was sluggish in the cold. It hardly moved at all.\n\nWhat does sluggish mean?"
            say: "Listen. The tortoise was sluggish in the cold. It hardly moved at all. What does sluggish mean?"
            options: ["slow", "hungry", "a slug"]
            answer: "slow"
          - id: l2-c2
            part: same
            type: multiple_choice
            text: "Which word means nearly the same as wet?"
            options: ["soggy", "rain", "dry"]
            answer: "soggy"
          - id: l2-c3
            part: opposite
            type: multiple_choice
            text: "Which word means the opposite of hard?"
            options: ["soft", "rock", "tough"]
            answer: "soft"
          - id: l2-c4
            part: inside
            type: multiple_choice
            text: "What is a sunflower?"
            say: "Sunflower has a word you know inside it. What is a sunflower?"
            options: ["a flower that turns to the sun", "a kind of sun", "a hot day"]
            answer: "a flower that turns to the sun"
          - id: l2-c5
            part: group
            type: true_false
            text: "Is it true? A parrot and a hamster are both birds."
            answer: false
          - id: l2-c6
            part: context
            type: multiple_choice
            text: "Ella was thrilled with her present. She jumped up and down and hugged Gran.\n\nWhat does thrilled mean?"
            say: "Listen. Ella was thrilled with her present. She jumped up and down and hugged Gran. What does thrilled mean?"
            options: ["very pleased", "very cross", "very thirsty"]
            answer: "very pleased"
          - id: l2-c7
            part: same
            type: multiple_choice
            text: "Which word means nearly the same as giggle?"
            options: ["laugh", "joke", "cry"]
            answer: "laugh"
          - id: l2-c8
            part: opposite
            type: multiple_choice
            text: "Which word means the opposite of early?"
            options: ["late", "soon", "morning"]
            answer: "late"
          - id: l2-c9
            part: group
            type: sorting
            text: "Fruit or vegetable? Put each word in its group."
            say: "Read each word. Is it a fruit, or a vegetable? Put it in the right group."
            option_audio: false
            bins:
              - { id: fruit, show: { object: apple }, say: "A fruit." }
              - { id: vegetable, show: { object: carrot }, say: "A vegetable." }
            options:
              - { text: "pear", bin: fruit }
              - { text: "peas", bin: vegetable }
              - { text: "cherry", bin: fruit }
              - { text: "onion", bin: vegetable }
          - id: l2-c10
            part: inside
            type: multiple_choice
            text: "What is a toothbrush?"
            say: "What is a toothbrush?"
            options: ["a brush for your teeth", "a kind of tooth", "a brush for your hair"]
            answer: "a brush for your teeth"
          - id: l2-c11
            part: context
            type: true_false
            text: "Is it true? \"The road was narrow. Only one car could fit on it.\" Narrow means not wide."
            answer: true
          - id: l2-c12
            part: same
            type: matching
            text: "Tap a word, then tap the word that means nearly the same."
            pairs:
              - { left: { text: "rock" }, right: { text: "stone" } }
              - { left: { text: "pick" }, right: { text: "choose" } }
              - { left: { text: "dash" }, right: { text: "run" } }
          - id: l2-c13
            part: opposite
            type: matching
            text: "Tap a word, then tap the word that means the opposite."
            pairs:
              - { left: { text: "top" }, right: { text: "bottom" } }
              - { left: { text: "push" }, right: { text: "pull" } }
              - { left: { text: "first" }, right: { text: "last" } }
          - id: l2-c14
            part: group
            type: multiple_choice
            text: "cat   dog   rabbit   ?\n\nWhich word belongs in this group?"
            say: "Cat, dog, rabbit. Which word belongs in this group?"
            options: ["goldfish", "lead", "bone"]
            answer: "goldfish"
          - id: l2-c15
            part: inside
            type: multiple_choice
            text: "What is a footprint?"
            options: ["a mark made by a foot", "a kind of shoe", "a foot that hurts"]
            answer: "a mark made by a foot"
          - id: l2-c16
            part: context
            type: multiple_choice
            text: "The dog was filthy after rolling in the mud. Dad gave it a bath.\n\nWhat does filthy mean?"
            say: "Listen. The dog was filthy after rolling in the mud. Dad gave it a bath. What does filthy mean?"
            options: ["very dirty", "very fluffy", "very full"]
            answer: "very dirty"
          - id: l2-c17
            part: same
            type: true_false
            text: "Is it true? Tiny means nearly the same as huge."
            answer: false
          - id: l2-c18
            part: opposite
            type: true_false
            text: "Is it true? Clean is the opposite of tidy."
            answer: false
          - id: l2-c19
            part: group
            type: multiple_choice
            text: "A robin is in the same group as an owl and a duck.\n\nWhat is a robin?"
            say: "A robin is in the same group as an owl and a duck. What is a robin?"
            options: ["a bird", "a fish", "a tree"]
            answer: "a bird"
          - id: l2-c20
            part: inside
            type: true_false
            text: "Is it true? A seashell is a shell from the sea."
            answer: true
