# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.letter-families
skill: lit-en.handwriting.letter-families
curriculum: en-GB
language: en
title:
  de: Buchstabenfamilien in der Handschrift
  en: Letter families
summary: >
  Letters that start and move the same way belong to one handwriting
  family. Lesson 1 takes the long ladder letters (l, i, t, u, j, y: down
  first) and the one-armed robot letters (r, n, m, h, b, k, p: down, back
  up and over). Lesson 2 takes the curly caterpillar letters (c, a, d, o,
  s, g, q, e, f: start at the top and curl back) and the zigzag letters
  (z, v, w, x), and ends with the skill check. Tracing shows the stroke.
  The skill check marks what a screen can mark: which family a letter is
  in, where it starts and which way it goes; writing the letters is
  practised by tracing and copying in Practise and is not marked.
metadata:
  year: year-1
  topic: { de: "Handschrift", en: "Handwriting" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.handwriting.lowercase]
  also_practises: []
  vocabulary: { en: [letter family, long ladder, one-armed robot, curly caterpillar, zigzag, start, stroke, down, over, curl] }
  forms: [text, drawn]
  drawn: [writing-lines, letter-card]
  facets: [script]
  parts:
    - { id: ladder, what: { de: "die Leiter-Buchstaben (l, i, t, u, j, y)", en: "the long ladder letters (l, i, t, u, j, y)" } }
    - { id: robot, what: { de: "die Roboter-Buchstaben (r, n, m, h, b, k, p)", en: "the one-armed robot letters (r, n, m, h, b, k, p)" } }
    - { id: caterpillar, what: { de: "die Raupen-Buchstaben (c, a, d, o, s, g, q, e, f)", en: "the curly caterpillar letters (c, a, d, o, s, g, q, e, f)" } }
    - { id: zigzag, what: { de: "die Zickzack-Buchstaben (z, v, w, x)", en: "the zigzag letters (z, v, w, x)" } }
  misconceptions:
    - id: start-at-bottom
      what: Starts a letter at the bottom and goes up (l, t from the line upwards)
      addressed: Learn screen 1 in lesson 1; l1-f2 feedback on at the bottom; l1-s2, l1-n2 and l2-c2
    - id: curl-wrong-way
      what: Curls c, a, d, o the wrong way, round to the right, so a and d come out back to front
      addressed: Learn screen 1 in lesson 2; l2-f2 feedback on to the right; l2-s2 and l2-c3
    - id: family-by-look
      what: Groups letters by how they look at the end (b with d, n with u) instead of how they start
      addressed: l1-f4, l2-f4 and l2-n3 sort letters by their first stroke; l2-c4 asks about d
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Leiter und Roboter", en: "Ladders and robots" }
    goal:
      de: "Schreib die Leiter-Buchstaben gerade nach unten und die Roboter-Buchstaben runter, hoch und drüber."
      en: "Write the ladder letters straight down, and the robot letters down, back up and over."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tracing
            text: "Trace the a."
            say: "Trace the a. Start at the green dot, curl round, then up and down."
            show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }
            char: "a"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? We write the letter o round in one go, starting at the top."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "l   i   t"
            say: "Look at these three letters: l, i and t. Trace them in the air with your finger. What do you think: how are they all the same?"
            show: { drawn: letter-card, text: "l i t" }
          - text: "l   i   t   u   j   y"
            say: "They all start at the top and go straight down! These are the long ladder letters. Each one starts at the top and goes straight down, like climbing down a ladder. L: down. T: down, then across."
            show: { drawn: letter-card, text: "l i t u j y" }
          - text: "r   n   m   h   b   k   p"
            say: "These are the one-armed robot letters. Go down, then back up the same line and over, like a robot's arm. N: down, up and over."
            show: { drawn: letter-card, text: "r n m h b k p" }
          - text: "n   h   m"
            say: "Watch: n goes down, up and over. H is the same with a tall stick first. M goes over twice."
            show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }
          - text: "Did you know? About 1 in 10 people write with their left hand."
            say: "Did you know? About one person in every ten writes with their left hand. Left hand or right hand, each letter starts in the same place and goes the same way."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tracing
                text: "Trace the l."
                say: "Trace the l. Start at the top and go straight down the ladder."
                show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
                char: "l"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Where do you start the letter t?"
                say: "Where do you start the letter t?"
                show: { drawn: letter-card, text: "t" }
                options: ["at the top", "at the bottom", "in the middle of the cross"]
                answer: "at the top"
                feedback:
                  "at the bottom": "Ladder letters start at the top and go down. Then add the cross."
                hints:
                  - "T is a long ladder letter."
                  - "Ladder letters go down first."
                  - "At the top."
              - id: l1-f3
                type: tracing
                text: "Trace the n."
                say: "Trace the n. Go down, back up the same line, and over."
                show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }
                char: "n"
              - id: l1-f4
                type: sorting
                text: "Ladder or robot?"
                say: "Sort the letters. Long ladder letters, or one-armed robot letters?"
                option_audio: false
                bins:
                  - { id: ladder, show: { text: "long ladder" }, say: "Long ladder letters." }
                  - { id: robot, show: { text: "one-armed robot" }, say: "One-armed robot letters." }
                options:
                  - { text: "i", bin: ladder }
                  - { text: "m", bin: robot }
                  - { text: "t", bin: ladder }
                  - { text: "h", bin: robot }
                hints:
                  - "Does the letter just go down, or down, up and over?"
                  - "H and m go back up and over."
                  - "The letters i and t are ladder letters. M and h are robot letters."
              - id: l1-f5
                type: multiple_choice
                text: "Which letter is in the one-armed robot family?"
                say: "Which letter goes down, back up and over?"
                options: ["r", "l", "i"]
                answer: "r"
                option_audio: false
                hints:
                  - "Robot letters have an arm that goes over."
                  - "L and i only go down."
                  - "The letter r."

          - support: some
            tasks:
              - id: l1-s1
                type: tracing
                text: "Trace the u."
                say: "Trace the u. Down, round, up, and down again."
                show: { drawn: writing-lines, text: "u", mode: trace, arrows: true }
                char: "u"
              - id: l1-s2
                type: true_false
                text: "Is it true? We start the letter l at the bottom of the line."
                answer: false
                hints: ["L is a long ladder letter."]
              - id: l1-s3
                type: multiple_choice
                text: "Which family is p in?"
                say: "Which family is p in?"
                show: { drawn: letter-card, text: "p" }
                options: ["long ladder", "one-armed robot"]
                answer: "one-armed robot"
                hints: ["P goes down, back up and round."]
              - id: l1-s4
                type: tracing
                text: "Trace the h."
                say: "Trace the h. A tall stick down, then back up and over."
                show: { drawn: writing-lines, text: "h", mode: trace, arrows: true }
                char: "h"
              - id: l1-s5
                type: multiple_choice
                text: "Which letter is a long ladder letter?"
                say: "Which letter starts at the top and goes straight down?"
                options: ["j", "n", "m"]
                answer: "j"
                option_audio: false
                hints: ["N and m go up and over."]

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Copy the t."
                say: "Write a t on your own. Down first, then the cross."
                show: { drawn: writing-lines, text: "t", mode: copy }
                char: "t"
              - id: l1-n2
                type: multiple_choice
                text: "Where do you start the letter i?"
                say: "Where do you start the letter i?"
                show: { drawn: letter-card, text: "i" }
                options: ["at the top", "at the bottom", "with the dot"]
                answer: "at the top"
              - id: l1-n3
                type: sorting
                text: "Ladder or robot?"
                say: "Sort the letters. Long ladder letters, or one-armed robot letters?"
                option_audio: false
                bins:
                  - { id: ladder, show: { text: "long ladder" }, say: "Long ladder letters." }
                  - { id: robot, show: { text: "one-armed robot" }, say: "One-armed robot letters." }
                options:
                  - { text: "l", bin: ladder }
                  - { text: "n", bin: robot }
                  - { text: "y", bin: ladder }
                  - { text: "b", bin: robot }
              - id: l1-n4
                type: tracing
                text: "Copy the m."
                say: "Write an m on your own. Down, up and over, up and over."
                show: { drawn: writing-lines, text: "m", mode: copy }
                char: "m"
              - id: l1-n5
                type: true_false
                text: "Is it true? The letter k is a one-armed robot letter."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which family is r in?"
            say: "Which family is r in?"
            show: { drawn: letter-card, text: "r" }
            options: ["long ladder", "one-armed robot"]
            answer: "one-armed robot"
          - id: l1-c2
            type: multiple_choice
            text: "Which letter is a long ladder letter?"
            say: "Which letter is a long ladder letter?"
            options: ["l", "h", "r"]
            answer: "l"
            option_audio: false
          - id: l1-c3
            type: tracing
            text: "Copy the n."
            say: "Write an n on your own."
            show: { drawn: writing-lines, text: "n", mode: copy }
            char: "n"
          - id: l1-c4
            type: true_false
            text: "Is it true? The letter m is a long ladder letter."
            answer: false
          - id: l1-c5
            type: highlight_in_text
            text: "Tap every long ladder letter."
            show: { drawn: letter-card, text: "t n i h u" }
            spans: ["t", "i", "u"]
          - id: l1-c6
            type: multiple_choice
            text: "Where do you start the letter n?"
            show: { drawn: letter-card, text: "n" }
            options: ["at the top", "at the bottom", "in the middle"]
            answer: "at the top"

  - n: 2
    title: { de: "Raupe und Zickzack", en: "Caterpillars and zigzags" }
    goal:
      de: "Schreib die Raupen-Buchstaben, die sich zurück und rund biegen, und die Zickzack-Buchstaben aus geraden Linien."
      en: "Write the caterpillar letters that curl back round, and the zigzag letters made of straight lines."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which family is h in?"
            say: "Which family is h in?"
            show: { drawn: letter-card, text: "h" }
            options: ["long ladder", "one-armed robot"]
            answer: "one-armed robot"
            difficulty: easy
          - id: l2-w2
            type: tracing
            text: "Trace the i."
            say: "Trace the i. Down the ladder, then the dot."
            show: { drawn: writing-lines, text: "i", mode: trace, arrows: true }
            char: "i"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "c   a   d"
            say: "Look at c, a and d. One letter is hiding inside the other two. What do you think: which one is it?"
            show: { drawn: letter-card, text: "c a d" }
          - text: "c   a   d   o   s   g   q   e   f"
            say: "It is c! These are the curly caterpillar letters. Most of them start just like c and curl back round to the left. A is c, then up and down. D is c, then a tall line."
            show: { drawn: letter-card, text: "c a d o s g q e f" }
          - text: "c → a → d"
            say: "Watch how they grow from c. C. Add up and down: a. Make the line tall: d."
            show: { drawn: writing-lines, text: "c", mode: trace, arrows: true }
          - text: "z   v   w   x"
            say: "These are the zigzag letters. They are made of straight lines that go down and up, or across. V: down, up. W: down, up, down, up."
            show: { drawn: letter-card, text: "z v w x" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tracing
                text: "Trace the c."
                say: "Trace the c. Start at the top and curl back round."
                show: { drawn: writing-lines, text: "c", mode: trace, arrows: true }
                char: "c"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which way does the curl of a go?"
                say: "You start the letter a at the top. Which way does it curl?"
                show: { drawn: letter-card, text: "a" }
                options: ["back to the left, like c", "to the right", "straight down"]
                answer: "back to the left, like c"
                feedback:
                  "to the right": "Curly caterpillar letters all curl back, like c. If you curl to the right, a looks back to front."
                hints:
                  - "A is a curly caterpillar letter."
                  - "Every caterpillar letter starts like c."
                  - "Back to the left, like c."
              - id: l2-f3
                type: tracing
                text: "Trace the d."
                say: "Trace the d. Curl like c, then up to the top and all the way down."
                show: { drawn: writing-lines, text: "d", mode: trace, arrows: true }
                char: "d"
              - id: l2-f4
                type: sorting
                text: "Caterpillar or zigzag?"
                say: "Sort the letters. Curly caterpillar letters, or zigzag letters?"
                option_audio: false
                bins:
                  - { id: curl, show: { text: "curly caterpillar" }, say: "Curly caterpillar letters." }
                  - { id: zig, show: { text: "zigzag" }, say: "Zigzag letters." }
                options:
                  - { text: "o", bin: curl }
                  - { text: "v", bin: zig }
                  - { text: "g", bin: curl }
                  - { text: "x", bin: zig }
                hints:
                  - "Does the letter curl, or is it all straight lines?"
                  - "V and x have only straight lines."
                  - "The letters o and g curl. V and x zigzag."
              - id: l2-f5
                type: multiple_choice
                text: "Which letter is a zigzag letter?"
                say: "Which letter is made of straight lines that go down and up?"
                options: ["w", "c", "o"]
                answer: "w"
                option_audio: false
                hints:
                  - "Zigzag letters have no curls."
                  - "C and o are round."
                  - "The letter w."

          - support: some
            tasks:
              - id: l2-s1
                type: tracing
                text: "Trace the o."
                say: "Trace the o. Start at the top, curl back round and join up."
                show: { drawn: writing-lines, text: "o", mode: trace, arrows: true }
                char: "o"
              - id: l2-s2
                type: true_false
                text: "Is it true? The letter d starts with a tall line, then the curl."
                answer: false
                hints: ["D is a caterpillar letter. What does every caterpillar letter start with?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which family is s in?"
                say: "Which family is s in?"
                show: { drawn: letter-card, text: "s" }
                options: ["curly caterpillar", "zigzag", "long ladder"]
                answer: "curly caterpillar"
                hints: ["S starts at the top and curls back."]
              - id: l2-s4
                type: tracing
                text: "Trace the v."
                say: "Trace the v. Down to the line, then back up."
                show: { drawn: writing-lines, text: "v", mode: trace, arrows: true }
                char: "v"
              - id: l2-s5
                type: multiple_choice
                text: "Which letter starts like c?"
                say: "Which letter starts like c?"
                options: ["g", "n", "z"]
                answer: "g"
                option_audio: false
                hints: ["Look for a curly caterpillar letter."]

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Copy the a."
                say: "Write an a on your own. Curl like c, then up and down."
                show: { drawn: writing-lines, text: "a", mode: copy }
                char: "a"
              - id: l2-n2
                type: multiple_choice
                text: "Which family is z in?"
                say: "Which family is z in?"
                show: { drawn: letter-card, text: "z" }
                options: ["curly caterpillar", "zigzag", "one-armed robot"]
                answer: "zigzag"
              - id: l2-n3
                type: sorting
                text: "Which family?"
                say: "Sort the letters into their families."
                option_audio: false
                bins:
                  - { id: ladder, show: { text: "long ladder" }, say: "Long ladder letters." }
                  - { id: robot, show: { text: "one-armed robot" }, say: "One-armed robot letters." }
                  - { id: curl, show: { text: "curly caterpillar" }, say: "Curly caterpillar letters." }
                options:
                  - { text: "b", bin: robot }
                  - { text: "d", bin: curl }
                  - { text: "t", bin: ladder }
                  - { text: "e", bin: curl }
              - id: l2-n4
                type: tracing
                text: "Copy the g."
                say: "Write a g on your own. Curl like c, up, then down and hook."
                show: { drawn: writing-lines, text: "g", mode: copy }
                char: "g"
              - id: l2-n5
                type: true_false
                text: "Is it true? The letter x is a zigzag letter."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ladder
            type: multiple_choice
            text: "Which family is u in?"
            say: "Which family is u in?"
            show: { drawn: letter-card, text: "u" }
            options: ["long ladder", "one-armed robot", "zigzag"]
            answer: "long ladder"
          - id: l2-c2
            part: robot
            type: multiple_choice
            text: "Where do you start the letter b?"
            say: "Where do you start the letter b?"
            show: { drawn: letter-card, text: "b" }
            options: ["at the top", "at the bottom", "in the middle"]
            answer: "at the top"
          - id: l2-c3
            part: caterpillar
            type: true_false
            text: "Is it true? You start the letter o at the top and curl round to the right."
            show: { drawn: letter-card, text: "o" }
            answer: false
          - id: l2-c4
            part: caterpillar
            type: multiple_choice
            text: "Which family is d in?"
            say: "Which family is d in?"
            show: { drawn: letter-card, text: "d" }
            options: ["curly caterpillar", "one-armed robot", "zigzag"]
            answer: "curly caterpillar"
          - id: l2-c5
            part: robot
            type: multiple_choice
            text: "Which letter is a one-armed robot letter?"
            say: "Which letter is a one-armed robot letter?"
            options: ["m", "c", "v"]
            answer: "m"
            option_audio: false
          - id: l2-c6
            part: ladder
            type: true_false
            text: "Is it true? The letters j and y are in the same family."
            answer: true
          - id: l2-c7
            part: ladder
            type: true_false
            text: "Is it true? The letter t is a zigzag letter."
            answer: false
          - id: l2-c8
            part: ladder
            type: highlight_in_text
            text: "Tap every long ladder letter."
            show: { drawn: letter-card, text: "l c t n y o" }
            spans: ["l", "t", "y"]
          - id: l2-c9
            part: ladder
            type: multiple_choice
            text: "How do all the long ladder letters start?"
            options: ["at the top, going straight down", "at the top, curling back", "at the bottom, going up"]
            answer: "at the top, going straight down"
          - id: l2-c10
            part: robot
            type: multiple_choice
            text: "You write the first line of n. What comes next?"
            options: ["back up the same line and over", "lift the pencil and start again", "curl round to the left"]
            answer: "back up the same line and over"
          - id: l2-c11
            part: robot
            type: true_false
            text: "Is it true? The letters h and n start the same way."
            answer: true
          - id: l2-c12
            part: robot
            type: sorting
            text: "Robot letter or zigzag letter?"
            say: "Sort the letters. One-armed robot letters, or zigzag letters?"
            option_audio: false
            bins:
              - { id: robot, show: { text: "one-armed robot" }, say: "One-armed robot letters." }
              - { id: zig, show: { text: "zigzag" }, say: "Zigzag letters." }
            options:
              - { text: "k", bin: robot }
              - { text: "w", bin: zig }
              - { text: "p", bin: robot }
              - { text: "x", bin: zig }
          - id: l2-c13
            part: caterpillar
            type: multiple_choice
            text: "Most curly caterpillar letters start like which letter?"
            options: ["c", "l", "z"]
            answer: "c"
            option_audio: false
          - id: l2-c14
            part: caterpillar
            type: true_false
            text: "Is it true? The letter e is a curly caterpillar letter."
            answer: true
          - id: l2-c15
            part: caterpillar
            type: multiple_choice
            text: "Which letter is not a curly caterpillar letter?"
            options: ["a", "q", "n", "s"]
            answer: "n"
            option_audio: false
          - id: l2-c16
            part: zigzag
            type: multiple_choice
            text: "Which family is v in?"
            show: { drawn: letter-card, text: "v" }
            options: ["zigzag", "one-armed robot", "curly caterpillar"]
            answer: "zigzag"
          - id: l2-c17
            part: zigzag
            type: true_false
            text: "Is it true? Zigzag letters are made of straight lines."
            answer: true
          - id: l2-c18
            part: zigzag
            type: highlight_in_text
            text: "Tap every zigzag letter."
            show: { drawn: letter-card, text: "w o x s z" }
            spans: ["w", "x", "z"]
          - id: l2-c19
            part: zigzag
            type: multiple_choice
            text: "Which two letters are both zigzag letters?"
            options: ["v and x", "v and u", "w and m"]
            answer: "v and x"
            option_audio: false
          - id: l2-c20
            part: zigzag
            type: true_false
            text: "Is it true? The letter w has a curl in it."
            answer: false
