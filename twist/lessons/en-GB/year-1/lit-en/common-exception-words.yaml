# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.common-exception-words
skill: lit-en.word-reading.exception-words-y1
curriculum: en-GB
language: en
title:
  de: Ausnahmewörter lesen (Year 1)
  en: Reading common exception words
summary: >
  The Year 1 common exception words, read and looked at closely: each one
  has a tricky part that does not make the sound the child expects (ai in
  said, a in was, f in of, o in come). Lesson 1 takes said, was, of, to,
  do, today, come, some, love, one and once; lesson 2 takes they, you,
  your, are, were, there, where, here, says, our, house and school;
  lesson 3 takes friend, put, push, pull, full, is, his, has and by, and
  ends with the skill check. The voice never says the word the child has
  to read in a reading task.
metadata:
  year: year-1
  topic: { de: "Wörter lesen", en: "Reading words" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.word-reading.first-sentences]
  also_practises: [lit-en.word-reading.first-tricky-words]
  vocabulary: { en: [common exception word, tricky word, tricky part, sound, rhyme, said, was, of, to, do, today, come, some, love, one, once, they, you, your, are, were, there, where, here, says, our, house, school, friend, put, push, pull, full, is, his, has, by] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: read-words, what: { de: die Ausnahmewörter lesen und erkennen, en: reading and recognising the exception words } }
    - { id: tricky-part, what: { de: den kniffligen Teil eines Wortes finden, en: finding the tricky part of a word } }
    - { id: sounds, what: { de: "wissen, wie der knifflige Teil klingt (Reime)", en: "knowing how the tricky part sounds (rhymes)" } }
    - { id: in-sentences, what: { de: die Wörter in Sätzen lesen und verstehen, en: reading the words in sentences } }
  misconceptions:
    - id: sound-out-tricky
      what: Sounds out an exception word as if it were regular (said as sad, come to rhyme with home, pull to rhyme with dull)
      addressed: every Learn screen names the tricky part and its sound; rhyme tasks set the regular reading against the real one with feedback (l1-f4, l1-s5, l2-f5, l3-f2, l3-n5); tricky-part tasks make the child find it (l1-f1, l2-f1, l3-f1)
    - id: lookalike-words
      what: Mixes up exception words with lookalikes that share letters (was and saw, were and where, your and our, friend and fried)
      addressed: listening tasks put the lookalikes side by side (l1-f2 with feedback, l2-f4 with feedback, l2-s2, l3-s2, l3-w2)
    - id: s-says-s
      what: Reads the s in is, his and has as the s in sun
      addressed: lesson 3 Learn says the s makes a z sound; l3-f3, l3-f5 and l3-n1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "said, was, of, come", en: "said, was, of, come" }
    goal:
      de: "Lies schwierige Wörter wie said, was und come und finde den Teil, der anders klingt als gedacht."
      en: "Read tricky words like said, was and come, and find the part that is a surprise."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "The dog is in the box.\n\nWho is in the box? Tap the picture."
            say: "Read the sentence. Who is in the box? Tap the picture."
            options: [{ object: dog }, { object: cat }, { object: frog }]
            answer: dog
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? A fish can sing."
            say: "Read the sentence. Is it true?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "said"
            say: "You can sound out most words. Some words have a tricky part. This word is said. The a and the i sound like the e in bed. That is the tricky part."
            show: { drawn: letter-card, text: "said" }
          - text: "was   of"
            say: "This word is was. The a sounds like the o in dog. This word is of. The f sounds like the v in van."
            show: { drawn: letter-card, text: "was of" }
          - text: "come   some   love   one   once"
            say: "In come, some and love, the o sounds like the u in cup. One and once are tricky all the way through. They start with the same sound as wet."
            show: { drawn: letter-card, text: "come some love one once" }
          - text: "to   do   today"
            say: "In to, do and today, the o says oo, as in zoo. When you meet a tricky word, look for the tricky part, then read the word."
            show: { drawn: letter-card, text: "to do today" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the tricky part of said."
                say: "This word is said. Tap the letters that make a surprise sound."
                show: { drawn: letter-card, text: "s ai d" }
                spans: ["ai"]
                hints:
                  - "Say the word slowly. Which part does not match what you hear?"
                  - "The middle sound is like the e in bed. Which letters make it?"
                  - "Tap ai."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "was" }
                options: ["was", "saw", "wax"]
                answer: "was"
                feedback:
                  "saw": "Saw has the same letters in a different order. The word you heard starts with w."
                hints:
                  - "Listen to the first sound."
                  - "It starts with w. The a in it sounds like the o in dog."
                  - "Tap was."
              - id: l1-f3
                type: image_multiple_choice
                text: "Put one apple in the bag.\n\nTap the picture that matches."
                say: "Read the sentence. Tap the picture that matches."
                options:
                  - { object: apple, count: 1, layout: row }
                  - { object: apple, count: 2, layout: row }
                  - { object: apple, count: 3, layout: row }
                answer: "1"
                hints:
                  - "Find the number word in the sentence."
                  - "It is a tricky word that starts with the same sound as wet."
                  - "The word is one. Tap the picture with 1 apple."
              - id: l1-f4
                type: multiple_choice
                text: "Which word rhymes with this one?"
                say: "Read the word on the card. Which word rhymes with it?"
                show: { drawn: letter-card, text: "come" }
                options: ["drum", "home"]
                answer: "drum"
                feedback:
                  "home": "Home has o-e, but this word is tricky. The o sounds like the u in cup."
                hints:
                  - "This word has a tricky o."
                  - "The o sounds like the u in cup, not like the o in home."
                  - "The word is come. It rhymes with drum."
              - id: l1-f5
                type: sorting
                text: "Sort the words by the sound the o makes."
                say: "Read each word. Does the o sound like the u in cup, or like the oo in moon? Put it in the right group."
                option_audio: false
                bins:
                  - { id: cup, show: { object: cup }, say: "Like the u in cup." }
                  - { id: moon, show: { object: moon }, say: "Like the oo in moon." }
                options:
                  - { text: "come", bin: cup }
                  - { text: "to", bin: moon }
                  - { text: "love", bin: cup }
                  - { text: "do", bin: moon }
                hints:
                  - "Read each word aloud, quietly."
                  - "Two words rhyme with zoo. Two rhyme with glove."
                  - "Come and love go with cup. To and do go with moon."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the tricky letter in of."
                say: "This word is of. Tap the letter that makes a surprise sound."
                show: { drawn: letter-card, text: "o f" }
                spans: ["f"]
                hints: ["Of ends with the sound at the start of van. Which letter makes it?"]
              - id: l1-s2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "said" }
                options: ["said", "sad", "sand"]
                answer: "said"
                hints: ["The word has the tricky ai in the middle."]
              - id: l1-s3
                type: true_false
                text: "Is it true? In love, the o sounds like the o in hot."
                answer: false
                hints: ["Love rhymes with glove. The o sounds like the u in cup."]
              - id: l1-s4
                type: image_multiple_choice
                text: "The cat was sad.\n\nTap the face that matches."
                say: "Read the sentence. Tap the face that matches."
                options: [{ object: happy }, { object: sad }, { object: angry }]
                answer: sad
                hints: ["Read the last word. Sound it out."]
              - id: l1-s5
                type: multiple_choice
                text: "Which word rhymes with this one?"
                say: "Read the word on the card. Which word rhymes with it?"
                show: { drawn: letter-card, text: "do" }
                options: ["go", "zoo"]
                answer: "zoo"
                feedback:
                  "go": "This word is tricky: the o says oo, so it rhymes with zoo."
                hints: ["In this word, the o says oo."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "once" }
                options: ["once", "one", "on"]
                answer: "once"
              - id: l1-n2
                type: highlight_in_text
                text: "Tap the tricky letter in to."
                say: "This word is to. Tap the letter that makes a surprise sound."
                show: { drawn: letter-card, text: "t o" }
                spans: ["o"]
              - id: l1-n3
                type: image_multiple_choice
                text: "I can see one bird.\n\nTap the picture that matches."
                say: "Read the sentence. Tap the picture that matches."
                options:
                  - { object: bird, count: 3, layout: row }
                  - { object: bird, count: 1, layout: row }
                  - { object: bird, count: 2, layout: row }
                answer: "1"
              - id: l1-n4
                type: multiple_choice
                text: "Which word rhymes with this one?"
                say: "Read the word on the card. Which word rhymes with it?"
                show: { drawn: letter-card, text: "love" }
                options: ["glove", "stove"]
                answer: "glove"
              - id: l1-n5
                type: true_false
                text: "Is it true? In today, the o says oo, as in to."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "come" }
            options: ["come", "came", "cone"]
            answer: "come"
          - id: l1-c2
            type: highlight_in_text
            text: "Tap the tricky letter in do."
            say: "This word is do. Tap the letter that makes a surprise sound."
            show: { drawn: letter-card, text: "d o" }
            spans: ["o"]
          - id: l1-c3
            type: true_false
            text: "Is it true? In of, the f sounds like the v in van."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Which word rhymes with this one?"
            say: "Read the word on the card. Which word rhymes with it?"
            show: { drawn: letter-card, text: "one" }
            options: ["bone", "fun"]
            answer: "fun"
          - id: l1-c5
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "love" }
            options: ["live", "low", "love"]
            answer: "love"
          - id: l1-c6
            type: true_false
            text: "Is it true? In to, the o sounds like the o in dog."
            answer: false

  - n: 2
    title: { de: "they, were, there, house", en: "they, were, there, house" }
    goal:
      de: "Lies noch mehr schwierige Wörter wie they, there und house und finde in jedem die Überraschung."
      en: "Read more tricky words like they, there and house, and spot the surprise in each one."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "of" }
            options: ["of", "off", "on"]
            answer: "of"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? In come, the o sounds like the u in cup."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "they   you   your"
            say: "This word is they. The e and the y make an ay sound, as in play. This word is you. The o and the u say oo. Your is you with an r on the end. It rhymes with door."
            show: { drawn: letter-card, text: "they you your" }
          - text: "there   where   here"
            say: "There and where rhyme with chair. Here rhymes with ear. Look closely: all three end in e, r, e."
            show: { drawn: letter-card, text: "there where here" }
          - text: "are   were   says"
            say: "Are rhymes with car. The e on the end is silent. Were rhymes with her. In says, the a and the y sound like the e in bed, just as in said."
            show: { drawn: letter-card, text: "are were says" }
          - text: "our   house   school"
            say: "In our and house, the o and the u say ow, as in cow. In school, the c and the h sound like the k in kit."
            show: { drawn: letter-card, text: "our house school" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the tricky part of they."
                say: "This word is they. Tap the letters that make a surprise sound."
                show: { drawn: letter-card, text: "th ey" }
                spans: ["ey"]
                hints:
                  - "Say the word slowly. Which part does not match what you hear?"
                  - "They ends with the ay sound. Which letters make it?"
                  - "Tap ey."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Tap its picture."
                show: { drawn: letter-card, text: "house" }
                options: [{ object: house }, { object: school }, { object: shop }]
                answer: house
                hints:
                  - "Look at the first letter."
                  - "The o and the u say ow. The e on the end is silent."
                  - "The word is house."
              - id: l2-f3
                type: sorting
                text: "Sort the words by their rhyme."
                say: "Read each word. Does it rhyme with chair, or with ear? Put it in the right group."
                option_audio: false
                bins:
                  - { id: chair, show: { object: chair }, say: "rhymes with chair" }
                  - { id: ear, show: { object: ear }, say: "rhymes with ear" }
                options:
                  - { text: "there", bin: chair }
                  - { text: "here", bin: ear }
                  - { text: "where", bin: chair }
                hints:
                  - "All three words end in e, r, e. Read the start of each one."
                  - "Say each word. Which two rhyme with chair?"
                  - "There and where go with chair. Here goes with ear."
              - id: l2-f4
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "were" }
                options: ["were", "where", "we"]
                answer: "were"
                feedback:
                  "where": "Where rhymes with chair. The word you heard rhymes with her."
                hints:
                  - "Listen to the end of the word."
                  - "It rhymes with her, not with chair."
                  - "Tap were."
              - id: l2-f5
                type: multiple_choice
                text: "Which word rhymes with this one?"
                say: "Read the word on the card. Which word rhymes with it?"
                show: { drawn: letter-card, text: "are" }
                options: ["car", "care"]
                answer: "car"
                feedback:
                  "care": "The e on the end of this word is silent, so it rhymes with car."
                hints:
                  - "This word has a silent letter."
                  - "The e on the end makes no sound."
                  - "The word is are. It rhymes with car."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap the tricky part of says."
                say: "This word is says. Tap the letters that make a surprise sound."
                show: { drawn: letter-card, text: "s ay s" }
                spans: ["ay"]
                hints: ["The middle sound is like the e in bed. Which letters make it?"]
              - id: l2-s2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "your" }
                options: ["your", "our", "you"]
                answer: "your"
                hints: ["The word rhymes with door."]
              - id: l2-s3
                type: true_false
                text: "Is it true? They rhymes with day."
                answer: true
                hints: ["In they, the e and the y make an ay sound."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Tap its picture."
                show: { drawn: letter-card, text: "school" }
                options: [{ object: shop }, { object: school }, { object: station }]
                answer: school
                hints: ["In this word, the c and the h sound like the k in kit."]
              - id: l2-s5
                type: multiple_choice
                text: "Which word rhymes with this one?"
                say: "Read the word on the card. Which word rhymes with it?"
                show: { drawn: letter-card, text: "where" }
                options: ["chair", "here"]
                answer: "chair"
                feedback:
                  "here": "They end with the same letters, but they do not sound the same. This word rhymes with chair."
                hints: ["Where, there and chair all rhyme."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "they" }
                options: ["they", "then", "the"]
                answer: "they"
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the tricky part of school."
                say: "This word is school. Tap the letters that make a surprise sound."
                show: { drawn: letter-card, text: "s ch oo l" }
                spans: ["ch"]
              - id: l2-n3
                type: true_false
                text: "Is it true? Were rhymes with chair."
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Our cat is in the house.\n\nWhere is the cat?"
                say: "Read the sentence. Then answer the question."
                options: ["in the house", "at school", "on the bus"]
                answer: "in the house"
              - id: l2-n5
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "there" }
                options: ["there", "three", "they"]
                answer: "there"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "you" }
            options: ["you", "your", "yes"]
            answer: "you"
          - id: l2-c2
            type: true_false
            text: "Is it true? In says, the a and the y sound like the e in bed."
            answer: true
          - id: l2-c3
            type: highlight_in_text
            text: "Tap the letter you do not hear in are."
            say: "This word is are. Tap the silent letter."
            show: { drawn: letter-card, text: "a r e" }
            spans: ["e"]
          - id: l2-c4
            type: multiple_choice
            text: "Which word rhymes with this one?"
            say: "Read the word on the card. Which word rhymes with it?"
            show: { drawn: letter-card, text: "here" }
            options: ["where", "near"]
            answer: "near"
          - id: l2-c5
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "are" }
            options: ["air", "are", "ear"]
            answer: "are"
          - id: l2-c6
            type: true_false
            text: "Is it true? In school, the c and the h sound like the k in kit."
            answer: true

  - n: 3
    title: { de: "friend, put, pull, his", en: "friend, put, pull, his" }
    goal:
      de: "Lies schwierige Wörter wie friend, put und his und hör auf den Laut, der überrascht, so wie das Summen in his."
      en: "Read tricky words like friend, put and his, and listen for the surprise, like the buzz in his."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word on the card. Tap its picture."
            show: { drawn: letter-card, text: "house" }
            options: [{ object: mouse }, { object: house }, { object: school }]
            answer: house
            difficulty: easy
          - id: l3-w2
            type: audio_choice
            text: "Tap the word you hear."
            say: "Listen. Tap the word you hear."
            audio: { en: "where" }
            options: ["where", "were", "here"]
            answer: "where"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "friend"
            say: "This word is friend. The i and the e sound like the e in bed."
            show: { drawn: letter-card, text: "friend" }
          - text: "put   push   pull   full"
            say: "In put, push, pull and full, the u sounds like the oo in book. It does not sound like the u in cup."
            show: { drawn: letter-card, text: "put push pull full" }
          - text: "is   his   has"
            say: "In is, his and has, the s sounds like the z in zip. It buzzes, like a bee."
            show: { drawn: letter-card, text: "is his has" }
          - text: "by   ask"
            say: "In by, the y says igh, as in my. In ask, many people say the a like the ar in car."
            show: { drawn: letter-card, text: "by ask" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: highlight_in_text
                text: "Tap the tricky part of friend."
                say: "This word is friend. Tap the letters that make a surprise sound."
                show: { drawn: letter-card, text: "f r ie n d" }
                spans: ["ie"]
                hints:
                  - "Say the word slowly. Which part does not match what you hear?"
                  - "The middle sound is like the e in bed. Which letters make it?"
                  - "Tap ie."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "Which word rhymes with this one?"
                say: "Read the word on the card. Which word rhymes with it?"
                show: { drawn: letter-card, text: "pull" }
                options: ["full", "dull"]
                answer: "full"
                feedback:
                  "dull": "Dull has the u from cup. In this word, the u sounds like the oo in book."
                hints:
                  - "Both words end in u, l, l. Do they sound the same?"
                  - "In this word, the u sounds like the oo in book."
                  - "The word is pull. It rhymes with full."
              - id: l3-f3
                type: true_false
                text: "Is it true? In his, the s sounds like the z in zip."
                answer: true
                hints:
                  - "Say the word slowly and listen to the end."
                  - "Does it end like bus, or like buzz?"
                  - "Yes. His ends like buzz."
              - id: l3-f4
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "push" }
                options: ["push", "rush", "posh"]
                answer: "push"
                feedback:
                  "rush": "Rush starts with r, and its u sounds like the u in cup. The word you heard starts with p."
                hints:
                  - "Listen to the first sound."
                  - "It starts with p. The u sounds like the oo in book."
                  - "Tap push."
              - id: l3-f5
                type: sorting
                text: "Sort the words by the sound the s makes."
                say: "Read each word. Does the s sound like the s in bus, or like the z in zebra? Put it in the right group."
