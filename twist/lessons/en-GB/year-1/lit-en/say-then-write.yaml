# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.say-then-write
skill: lit-en.composition.say-then-write
curriculum: en-GB
language: en
title:
  de: Erst sagen, dann schreiben
  en: Say it, then write it
summary: >
  Before writing, a child thinks of a sentence, says it out loud until they
  know it, counts its words, writes it and reads it back. Lesson 1 practises
  thinking of a sentence for a picture and saying it aloud; lesson 2 checks
  that what was written matches what was said, catching small missing
  words, and ends with the skill check. The child's own written sentence is
  not marked yet.
metadata:
  year: year-1
  topic: { de: "Texte schreiben", en: "Writing" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.composition.phrases-sentences]
  also_practises: [lit-en.grammar.sentences-and]
  vocabulary: { en: [think, say, write, read back, sentence, word, match] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: write-before-saying
      what: Starts writing before the sentence is ready, and loses it halfway
      addressed: l1-f1, l1-s3, l1-n3 and l2-c1 put think, say, write, read back in order
    - id: small-words-dropped
      what: Leaves out small words (a, the, is, in) when writing or counting
      addressed: l1-f3 feedback counts every word; l2-f1, l2-f2, l2-s2, l2-n2 and l2-c4 find the missing small word
    - id: no-read-back
      what: Does not read the sentence back, so a missing word goes unnoticed
      addressed: l2-f4, l2-s3, l2-n3 and l2-c5 compare what was said with what was written
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Den Satz zuerst sagen", en: "Say the sentence first" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the sentence. Tap the picture."
            say: "Read the sentence on the card. Tap the picture it is about."
            show: { drawn: letter-card, text: "I can see a fox." }
            options: [{ object: fox }, { object: box }, { object: frog }]
            answer: fox
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which one can someone else read?"
            say: "Which one could a friend read easily? Look carefully."
            options: ["The van is red.", "Thevanisred.", "The vn is rd."]
            answer: "The van is red."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Think it. Say it. Write it. Read it back."
            say: "Before you write, think of your sentence. Say it out loud. Say it again until you know it by heart. Then write it, and read it back."
          - text: "The dog has a ball."
            say: "Look at the picture. I think of a sentence. I say it out loud: The dog has a ball. I say it once more. Now I know exactly what to write."
            show: { objects: [dog, ball] }
          - text: "The dog has a ball.   5 words"
            say: "I say it again and count the words on my fingers: The, dog, has, a, ball. Five words. Small words like a and the count too. Now I know how many words to write."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "What do you do first? Put the steps in order."
                say: "Put the steps in order, from first to last."
                options: ["Write it.", "Say it out loud.", "Read it back.", "Think of a sentence."]
                slot_count: 4
                answer: ["Think of a sentence.", "Say it out loud.", "Write it.", "Read it back."]
                hints:
                  - "You need a sentence in your head before you can say it."
                  - "Think, then say, then write."
                  - "Think of a sentence. Say it out loud. Write it. Read it back."
                difficulty: easy
              - id: l1-f2
                type: speak
                text: "Say a sentence about the cat."
                say: "Look at the picture. Think of a sentence about the cat. Say it out loud, then say it once more."
                show: { object: cat }
                expected_text: "The cat is sitting down."
                hints:
                  - "What is the cat doing? What does it look like?"
                  - "You could start with: The cat is ..."
                  - "Try this: The cat is sitting down."
              - id: l1-f3
                type: multiple_choice
                text: "The sun is hot.\n\nHow many words?"
                say: "Say it with me and count the words on your fingers: The sun is hot. How many words?"
                show: { object: sun }
                options: ["3", "4", "5"]
                answer: "4"
                feedback:
                  "3": "Did you count the? Every word counts, even small ones."
                hints:
                  - "Put up one finger for each word."
                  - "The, sun, is, hot."
                  - "Four words."
              - id: l1-f4
                type: multiple_choice
                text: "Which sentence fits the picture?"
                say: "Which sentence would you say about this picture? Read them yourself."
                show: { object: frog }
                options: ["The frog is green.", "The frog is a cake.", "The cat is green."]
                answer: "The frog is green."
                hints:
                  - "Look at the picture. What is it?"
                  - "It is a frog. Which sentence is about a frog and makes sense?"
                  - "The frog is green."
              - id: l1-f5
                type: speak
                text: "Say a sentence about the bus. Count the words on your fingers."
                say: "Think of a sentence about the bus. Say it out loud and count the words on your fingers."
                show: { object: bus }
                expected_text: "The bus is big and red."
                hints:
                  - "What colour is the bus? Is it big or small?"
                  - "You could join two ideas with and."
                  - "Try this: The bus is big and red."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A bee is on the flower.\n\nHow many words?"
                say: "Say it and count the words on your fingers: A bee is on the flower. How many words?"
                show: { object: bee }
                options: ["5", "6", "7"]
                answer: "6"
                hints: ["One finger for each word, even a and the."]
              - id: l1-s2
                type: speak
                text: "Say a sentence about the snowman."
                say: "Think of a sentence about the snowman. Say it out loud, then say it once more."
                show: { object: snowman }
                expected_text: "I can see a snowman."
                hints: ["You could start with: I can see ..."]
              - id: l1-s3
                type: true_false
                text: "Is it true? You say your sentence out loud before you write it."
                say: "Is it true? You say your sentence out loud before you write it."
                answer: true
                hints: ["Think, say, write, read back."]
              - id: l1-s4
                type: multiple_choice
                text: "Which sentence fits the picture?"
                say: "Which sentence would you say about this picture? Read them yourself."
                show: { object: kite }
                options: ["The kite is in the sky.", "The kite is in the bath.", "The kite eats a bun."]
                answer: "The kite is in the sky."
                hints: ["Where do kites fly?"]
              - id: l1-s5
                type: ordering
                text: "Put Sam's words in order."
                say: "Sam said his sentence out loud: I can see the moon. Put his words in order to write it."
                show: { object: moon }
                options: ["the moon.", "I", "can see"]
                slot_count: 3
                answer: ["I", "can see", "the moon."]
                hints: ["Say Sam's sentence again. What came first?"]

          - support: none
            tasks:
              - id: l1-n1
                type: speak
                text: "Say a sentence about the rabbit."
                say: "Think of a sentence about the rabbit. Say it out loud, then say it once more."
                show: { object: rabbit }
                expected_text: "The rabbit has long ears."
              - id: l1-n2
                type: multiple_choice
                text: "We went to the shop.\n\nHow many words?"
                say: "Say it and count the words on your fingers: We went to the shop. How many words?"
                options: ["4", "5", "6"]
                answer: "5"
              - id: l1-n3
                type: true_false
                text: "Is it true? You write first and think of what to say after."
                say: "Is it true? You write first and think of what to say after."
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Which sentence fits the picture?"
                say: "Which sentence would you say about this picture? Read them yourself."
                show: { object: snail }
                options: ["The snail is slow.", "The snail can fly.", "The snail is a bus."]
                answer: "The snail is slow."
              - id: l1-n5
                type: ordering
                text: "Put Ben's words in order."
                say: "Ben said his sentence out loud: The duck is in the pond. Put his words in order to write it."
                show: { object: duck }
                options: ["is in", "the pond.", "The duck"]
                slot_count: 3
                answer: ["The duck", "is in", "the pond."]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "What do you do first? Put the steps in order."
            say: "Put the steps in order, from first to last."
            options: ["Write it.", "Think of a sentence.", "Say it out loud."]
            slot_count: 3
            answer: ["Think of a sentence.", "Say it out loud.", "Write it."]
          - id: l1-c2
            type: multiple_choice
            text: "My cat is black.\n\nHow many words?"
            say: "Say it and count the words on your fingers: My cat is black. How many words?"
            options: ["3", "4", "5"]
            answer: "4"
          - id: l1-c3
            type: multiple_choice
            text: "Which sentence fits the picture?"
            say: "Which sentence would you say about this picture? Read them yourself."
            show: { object: fish }
            options: ["The fish can swim.", "The fish can sing.", "The dog can swim."]
            answer: "The fish can swim."

  - n: 2
    title: { de: "Passt es zu dem, was ich gesagt habe?", en: "Does it match what I said?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The dog can run.\n\nHow many words?"
            say: "Say it and count the words on your fingers: The dog can run. How many words?"
            show: { object: dog }
            options: ["3", "4", "5"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? Saying a sentence twice helps you remember it."
            say: "Is it true? Saying a sentence twice helps you remember it."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "I said: The pig is in the mud.\nI wrote: The pig is the mud."
            say: "I said my sentence, then I wrote it. Now I read it back. Oh! I missed a word. I said in, but I did not write it."
            show: { object: pig }
          - text: "The pig is in the mud."
            say: "I put in the missing word. Now what I wrote matches what I said."
          - text: "Say it. Write it. Read it back. Does it match?"
            say: "Always read your sentence back and check it matches what you said. Small words like a, the, is and in are the easiest to miss."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Jo said: I can see a bird.\n\nWhich one did Jo write?"
                say: "Jo said: I can see a bird. Which one did Jo write? Read them yourself."
                show: { object: bird }
                options: ["I can see a bird.", "I can see bird.", "I see a bird."]
                answer: "I can see a bird."
                option_audio: false
                feedback:
                  "I can see bird.": "Read it back. Jo said a bird. The word a is missing."
                hints:
                  - "Read each one and say Jo's sentence beside it."
                  - "Check every word: I, can, see, a, bird."
                  - "I can see a bird."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Max said: The cat is on the mat.\nMax wrote: The cat _ on the mat.\n\nWhich word is missing?"
                say: "Max said: The cat is on the mat. Which word did he miss?"
                show: { object: cat }
                frame: "The cat _ on the mat."
                options: ["is", "a", "the"]
                answer: ["is"]
                hints:
                  - "Say Max's sentence and point to each word."
                  - "The cat ... on the mat. What comes after cat?"
                  - "Is."
              - id: l2-f3
                type: ordering
                text: "Put Amy's words in order to write her sentence."
                say: "Amy said her sentence out loud: The cow eats grass. Put the words in order to write it."
                show: { object: cow }
                options: ["grass.", "The", "cow", "eats"]
                slot_count: 4
                answer: ["The", "cow", "eats", "grass."]
                hints:
                  - "Say Amy's sentence again."
                  - "The comes first. Then who it is."
                  - "The cow eats grass."
              - id: l2-f4
                type: true_false
                text: "Ali said: My hat is blue.\nAli wrote: My hat is blue.\n\nDoes it match?"
                say: "Read what Ali wrote. Does it match what he said?"
                answer: true
                hints:
                  - "Check one word at a time."
                  - "My, hat, is, blue. Are all four words there?"
                  - "Yes, it matches."
              - id: l2-f5
                type: speak
                text: "Say your sentence, then say it again."
                say: "Think of a sentence about ice cream. Say it out loud, then say it again, so you are ready to write it."
                show: { object: ice-cream }
                expected_text: "I like ice cream."
                hints:
                  - "Do you like ice cream? Say what you think."
                  - "You could start with: I like ..."
                  - "Try this: I like ice cream."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Zara said: The dog ran to the park.\n\nWhich one did Zara write?"
                say: "Zara said: The dog ran to the park. Which one did Zara write? Read them yourself."
                options: ["The dog ran to the park.", "The dog ran the park.", "The dog to the park."]
                answer: "The dog ran to the park."
                option_audio: false
                hints: ["Check every word against Zara's sentence."]
              - id: l2-s2
                type: fill_in_blank
                text: "Leo said: I have a big kite.\nLeo wrote: I have _ big kite.\n\nWhich word is missing?"
                say: "Leo said: I have a big kite. Which word did he miss?"
                show: { object: kite }
                frame: "I have _ big kite."
                options: ["a", "the", "is"]
                answer: ["a"]
                hints: ["Say Leo's sentence. What comes after have?"]
              - id: l2-s3
                type: true_false
                text: "Eva said: We went to the beach.\nEva wrote: We went the beach.\n\nDoes it match?"
                say: "Read what Eva wrote. Does it match what she said?"
                answer: false
                hints: ["Check the small words."]
              - id: l2-s4
                type: speak
                text: "Say your sentence, then say it again."
                say: "Think of a sentence about the giraffe. Say it out loud, then say it again, so you are ready to write it."
                show: { object: giraffe }
                expected_text: "The giraffe has a long neck."
                hints: ["What is special about a giraffe?"]
              - id: l2-s5
                type: ordering
                text: "Put Tom's words in order to write his sentence."
                say: "Tom said his sentence out loud: A frog is on a log. Put the words in order to write it."
                show: { object: frog }
                options: ["on a log.", "A", "frog", "is"]
                slot_count: 4
                answer: ["A", "frog", "is", "on a log."]
                hints: ["Say Tom's sentence again, slowly."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Raj said: The baby is asleep.\n\nWhich one did Raj write?"
                say: "Raj said: The baby is asleep. Which one did Raj write? Read them yourself."
                show: { object: baby }
                options: ["The baby is asleep.", "The baby asleep.", "Baby is asleep."]
                answer: "The baby is asleep."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Kim said: The fish is in the pond.\nKim wrote: The fish is _ the pond.\n\nWhich word is missing?"
                say: "Kim said: The fish is in the pond. Which word did she miss?"
                show: { object: fish }
                frame: "The fish is _ the pond."
                options: ["in", "on", "a"]
                answer: ["in"]
              - id: l2-n3
                type: true_false
                text: "Ravi said: I like my red bike.\nRavi wrote: I like my red bike.\n\nDoes it match?"
                say: "Read what Ravi wrote. Does it match what he said?"
                show: { object: bike }
                answer: true
              - id: l2-n4
                type: speak
                text: "Say your sentence, then say it again."
                say: "Think of a sentence about your teddy, or this one. Say it out loud, then say it again, so you are ready to write it."
                show: { object: teddy }
                expected_text: "My teddy is soft."
              - id: l2-n5
                type: ordering
                text: "Put Lily's words in order to write her sentence."
                say: "Lily said her sentence out loud: The bee is on the flower. Put the words in order to write it."
                show: { object: bee }
                options: ["the flower.", "The bee", "is", "on"]
                slot_count: 4
                answer: ["The bee", "is", "on", "the flower."]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Put the steps in order."
            say: "Put the steps in order, from first to last."
            options: ["Say it again.", "Write it.", "Think of a sentence.", "Say it out loud."]
            slot_count: 4
            answer: ["Think of a sentence.", "Say it out loud.", "Say it again.", "Write it."]
          - id: l2-c2
            type: multiple_choice
            text: "I can hop on one leg.\n\nHow many words?"
            say: "Say it and count the words on your fingers: I can hop on one leg. How many words?"
            options: ["5", "6", "7"]
            answer: "6"
          - id: l2-c3
            type: multiple_choice
            text: "Nia said: The sun is out today.\n\nWhich one did Nia write?"
            say: "Nia said: The sun is out today. Which one did Nia write? Read them yourself."
            options: ["The sun is out today.", "The sun out today.", "The sun is today."]
            answer: "The sun is out today."
            option_audio: false
          - id: l2-c4
            type: fill_in_blank
            text: "Ola said: I can see a big tree.\nOla wrote: I can _ a big tree.\n\nWhich word is missing?"
            say: "Ola said: I can see a big tree. Which word did she miss?"
            show: { object: tree }
            frame: "I can _ a big tree."
            options: ["see", "the", "is"]
            answer: ["see"]
          - id: l2-c5
            type: true_false
            text: "Dan said: The cat sat on the mat.\nDan wrote: The cat sat the mat.\n\nDoes it match?"
            say: "Read what Dan wrote. Does it match what he said?"
            answer: false
