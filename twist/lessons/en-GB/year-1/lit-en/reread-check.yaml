# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.reread-check
skill: lit-en.composition.reread-check
curriculum: en-GB
language: en
title:
  de: Den eigenen Text noch einmal lesen
  en: Read it again and check
summary: >
  After writing, read it back to check it makes sense. Lesson 1 checks
  one sentence at a time: a missing word, a word written twice, a word
  that does not make sense. Lesson 2 checks a short piece of writing of
  two or three sentences, puts sentences in an order that makes sense,
  and ends with the skill check. The child checks sentences written by
  others; checking their own free writing waits on a writing task.
metadata:
  year: year-1
  topic: { de: "Texte schreiben", en: "Writing" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.composition.say-then-write]
  also_practises: [lit-en.grammar.sentence-punctuation]
  vocabulary: { en: [read again, check, make sense, missing word, sentence, change] }
  forms: [text, picture, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: reads-what-meant
      what: Reads what they meant to write, not what is on the page, so does not see a missing word
      addressed: Learn screen 2 in lesson 1 (point to each word); l1-f1 feedback; l1-s1, l1-n1 and l2-c1
    - id: checks-spelling-only
      what: Thinks checking means only looking at spelling, not whether it makes sense
      addressed: Learn screen 1 in lesson 1; l1-f3, l1-s3 and l2-f2 ask about meaning
    - id: order-ignored
      what: Does not notice when sentences are in an order that does not make sense
      addressed: Learn screen 2 in lesson 2; l2-f3, l2-s3 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Einen Satz prüfen", en: "Check a sentence" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Say it, then build it."
            say: "Mia wants to write: I like my cat. Say it out loud. Then put the words in order."
            options: ["cat.", "like", "I", "my"]
            slot_count: 4
            answer: ["I", "like", "my", "cat."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? It helps to say a sentence out loud before you write it."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "I went to the the shop."
            say: "Leo wrote a sentence. Now he reads it back. Does it make sense? He spots that the word the is there twice. He crosses one out."
          - text: "My dog likes to in the garden."
            say: "Read it back slowly and point to each word. My dog likes to ... in the garden. A word is missing! My dog likes to play in the garden."
          - text: "The fish can fly in the pond."
            say: "Read it back and ask: does this make sense? Fish do not fly. Leo meant swim. The fish can swim in the pond."
            show: { object: fish }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Sam wrote:\n\nI ate an for lunch.\n\nWhich word is missing?"
                say: "Read what Sam wrote. Point to each word. Which word is missing?"
                options: ["apple", "the", "ran"]
                answer: "apple"
                feedback:
                  "the": "Try it: I ate an the for lunch. That does not make sense. What did Sam eat?"
                hints:
                  - "Read it slowly and point to each word."
                  - "I ate an ... what? Something to eat."
                  - "Apple."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Find the word written twice. Tap it both times."
                show: { drawn: letter-card, text: "Then we we went to the park." }
                spans: ["we"]
                hints:
                  - "Read it back aloud."
                  - "The same word comes twice, one after the other."
                  - "We, twice. One of them can go."
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                show: { drawn: letter-card, text: "I brush my teeth with a spoon." }
                spans: ["spoon"]
                hints:
                  - "Read it and ask: does this make sense?"
                  - "What do you brush your teeth with?"
                  - "Spoon. It should be toothbrush."
              - id: l1-f4
                type: true_false
                text: "Is it true? This makes sense: \"The cat sat on the mat.\""
                show: { object: cat }
                answer: true
                hints:
                  - "Read it back."
                  - "Could a cat sit on a mat?"
                  - "Yes, it makes sense."
              - id: l1-f5
                type: multiple_choice
                text: "Ava wrote:\n\nThe sun is cold today.\n\nWhich word should she change?"
                say: "Read what Ava wrote. Which word should she change so it makes sense?"
                options: ["cold", "sun", "today"]
                answer: "cold"
                hints:
                  - "Is the sun cold?"
                  - "The sun is hot."
                  - "Cold."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ben wrote:\n\nMy mum a red car.\n\nWhich word is missing?"
                say: "Read what Ben wrote. Which word is missing?"
                options: ["has", "is", "red"]
                answer: "has"
                hints: ["My mum ... a red car."]
              - id: l1-s2
                type: highlight_in_text
                text: "Find the word written twice. Tap it both times."
                show: { drawn: letter-card, text: "I can can ride my bike." }
                spans: ["can"]
                hints: ["Look at the middle of the sentence."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                show: { drawn: letter-card, text: "I put my hat on my feet." }
                spans: ["feet"]
                hints: ["Where does a hat go?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? This makes sense: \"The dog went to bed in the sky.\""
                answer: false
                hints: ["Can a dog sleep in the sky?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which sentence makes sense?"
                options: ["We had cake at the party.", "We had cake at the cake.", "We cake had at party."]
                answer: "We had cake at the party."
                option_audio: false
                hints: ["Read each one back."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Kai wrote:\n\nThe bird in the tree.\n\nWhich word is missing?"
                say: "Read what Kai wrote. Which word is missing?"
                options: ["is", "the", "bird"]
                answer: "is"
              - id: l1-n2
                type: highlight_in_text
                text: "Find the word written twice. Tap it both times."
                show: { drawn: letter-card, text: "The duck swam in the pond pond." }
                spans: ["pond"]
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                show: { drawn: letter-card, text: "I drink milk from a shoe." }
                spans: ["shoe"]
              - id: l1-n4
                type: true_false
                text: "Is it true? This makes sense: \"We read a book at bedtime.\""
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which sentence makes sense?"
                options: ["The frog jumps in the pond.", "The frog jumps in the moon.", "The pond jumps in the frog."]
                answer: "The frog jumps in the pond."
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Zoe wrote:\n\nI to school.\n\nWhich word is missing?"
            say: "Read what Zoe wrote. Which word is missing?"
            options: ["walk", "the", "school"]
            answer: "walk"
          - id: l1-c2
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            show: { drawn: letter-card, text: "My cat says woof." }
            spans: ["woof"]
          - id: l1-c3
            type: highlight_in_text
            text: "Find the word written twice. Tap it both times."
            show: { drawn: letter-card, text: "She has a big big bag." }
            spans: ["big"]

  - n: 2
    title: { de: "Einen kurzen Text prüfen", en: "Check a short piece" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            show: { drawn: letter-card, text: "I eat soup with a sock." }
            spans: ["sock"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Raj wrote:\n\nI like play football.\n\nWhich word is missing?"
            say: "Read what Raj wrote. Which word is missing?"
            options: ["to", "the", "football"]
            answer: "to"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "On Saturday I went to the beach. I made a sandcastle. Then I had an ice cream."
            say: "Lily wrote about her day. She reads it all back, one sentence at a time. Every sentence makes sense, and they come in the order things happened."
            show: { object: ice-cream }
          - text: "I went home. I went to the beach. I made a sandcastle."
            say: "This is muddled. Going home came last, so it should be at the end. Read it back and ask: is this the right order?"
          - text: "Read it. Point. Ask. Fix."
            say: "When you check, read every word, point as you go, ask does it make sense, and fix what is wrong."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                show: { drawn: letter-card, text: "I got up. I ate my breakfast. Then I put on my shoes and went to bed." }
                spans: ["bed"]
                hints:
                  - "Read each sentence back."
                  - "The writer is getting ready to go out, so what comes after the shoes?"
                  - "Bed. It should be school, or out."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Max wrote:\n\nIt was raining. I put on my sunglasses.\n\nWhich word should he change?"
                say: "Read what Max wrote. Which word should he change so it makes sense?"
                options: ["sunglasses", "raining", "put"]
                answer: "sunglasses"
                feedback:
                  "raining": "Max wants to tell us about the rain. What do you put on when it rains?"
                hints:
                  - "What do you wear when it rains?"
                  - "Sunglasses are for sunny days."
                  - "Sunglasses. He could write coat or wellies."
              - id: l2-f3
                type: ordering
                text: "Put the sentences in an order that makes sense."
                say: "Kim wrote three sentences about planting a seed. Put them in the right order."
                options: ["A flower grew.", "I planted a seed.", "I watered it every day."]
                slot_count: 3
                answer: ["I planted a seed.", "I watered it every day.", "A flower grew."]
                option_audio: false
                hints:
                  - "What did Kim do first?"
                  - "First plant, then water, then wait."
                  - "I planted a seed. I watered it every day. A flower grew."
              - id: l2-f4
                type: multiple_choice
                text: "Ali wrote:\n\nWe went to the zoo. We saw a lion. It a big mane.\n\nWhich word is missing?"
                say: "Read what Ali wrote. Which word is missing?"
                show: { object: lion }
                options: ["had", "lion", "zoo"]
                answer: "had"
                hints:
                  - "Check the last sentence."
                  - "It ... a big mane."
                  - "Had."
              - id: l2-f5
                type: true_false
                text: "Is it true? This makes sense: \"I put on my coat. I went out to play in the snow.\""
                answer: true
                hints:
                  - "Read both sentences."
                  - "Is the order right?"
                  - "Yes, it makes sense."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Find the word written twice. Tap it both times."
                show: { drawn: letter-card, text: "Dad made tea. We ate ate pasta." }
                spans: ["ate"]
                hints: ["Look at the second sentence."]
              - id: l2-s2
                type: multiple_choice
                text: "Tia wrote:\n\nMy rabbit is soft. She likes to eat chairs.\n\nWhich word should she change?"
                say: "Read what Tia wrote. Which word should she change so it makes sense?"
                show: { object: rabbit }
                options: ["chairs", "soft", "rabbit"]
                answer: "chairs"
                hints: ["What do rabbits eat?"]
              - id: l2-s3
                type: ordering
                text: "Put the sentences in an order that makes sense."
                say: "Put Omar's sentences about his birthday in the right order."
                options: ["I blew out the candles.", "Mum lit the candles on my cake."]
                slot_count: 2
                answer: ["Mum lit the candles on my cake.", "I blew out the candles."]
                option_audio: false
                hints: ["You light candles before you blow them out."]
              - id: l2-s4
                type: true_false
                text: "Is it true? This makes sense: \"I fell asleep. Then I went to bed.\""
                answer: false
                hints: ["Which comes first?"]
              - id: l2-s5
                type: multiple_choice
                text: "Ella wrote:\n\nWe went swimming. The water was cold. I in the pool.\n\nWhich word is missing?"
                say: "Read what Ella wrote. Which word is missing?"
                options: ["swam", "water", "cold"]
                answer: "swam"
                hints: ["Check the last sentence."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                show: { drawn: letter-card, text: "I went to the shop. I bought some bread. I paid with a leaf." }
                spans: ["leaf"]
              - id: l2-n2
                type: multiple_choice
                text: "Jay wrote:\n\nMy gran has a dog. He very fast.\n\nWhich word is missing?"
                say: "Read what Jay wrote. Which word is missing?"
                options: ["is", "has", "dog"]
                answer: "is"
              - id: l2-n3
                type: ordering
                text: "Put the sentences in an order that makes sense."
                say: "Put Noor's sentences about making a sandwich in the right order."
                options: ["I ate it.", "I got two slices of bread.", "I put cheese on the bread."]
                slot_count: 3
                answer: ["I got two slices of bread.", "I put cheese on the bread.", "I ate it."]
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? This makes sense: \"I ate my cake. Then I baked it.\""
                answer: false
              - id: l2-n5
                type: highlight_in_text
                text: "Find the word written twice. Tap it both times."
                show: { drawn: letter-card, text: "It was my turn. I threw the the ball." }
                spans: ["the"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Finn wrote:\n\nI my teeth every night.\n\nWhich word is missing?"
            say: "Read what Finn wrote. Which word is missing?"
            options: ["brush", "night", "my"]
            answer: "brush"
          - id: l2-c2
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            show: { drawn: letter-card, text: "We went to the park. We played on the swings. Then we went home on a cloud." }
            spans: ["cloud"]
          - id: l2-c3
            type: true_false
            text: "Is it true? This makes sense: \"I washed my hands. Then I had my lunch.\""
            answer: true
          - id: l2-c4
            type: ordering
            text: "Put the sentences in an order that makes sense."
            say: "Put Eva's sentences about a wobbly tooth in the right order."
            options: ["Now I have a gap.", "My tooth was wobbly.", "It fell out."]
            slot_count: 3
            answer: ["My tooth was wobbly.", "It fell out.", "Now I have a gap."]
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Leo wrote:\n\nThe baby was hungry. She drank her shoe.\n\nWhich word should he change?"
            say: "Read what Leo wrote. Which word should he change so it makes sense?"
            options: ["shoe", "baby", "hungry"]
            answer: "shoe"
