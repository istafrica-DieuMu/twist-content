# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.sentence-punctuation
skill: lit-en.grammar.sentence-punctuation
curriculum: en-GB
language: en
title:
  de: Großbuchstabe und Satzzeichen
  en: Capital letters and full stops
summary: >
  A sentence starts with a capital letter and ends with a full stop, a
  question mark or an exclamation mark. Lesson 1 fixes the capital letter
  and the full stop in telling sentences; lesson 2 adds question marks for
  asking sentences and exclamation marks for strong feelings, and ends with
  the skill check.
metadata:
  year: year-1
  topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.grammar.sentences-and]
  also_practises: [lit-en.grammar.sentences-and]
  vocabulary: { en: [sentence, capital letter, full stop, question, question mark, exclamation mark, telling, asking] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: capital, what: { de: einen Satz mit einem Großbuchstaben beginnen, en: starting a sentence with a capital letter } }
    - { id: full-stop, what: { de: einen Erzählsatz mit einem Punkt beenden, en: ending a telling sentence with a full stop } }
    - { id: question-mark, what: { de: einen Fragesatz mit einem Fragezeichen beenden, en: ending an asking sentence with a question mark } }
    - { id: exclamation-mark, what: { de: einen Satz mit starkem Gefühl mit einem Ausrufezeichen beenden, en: ending a sentence that shows a strong feeling with an exclamation mark } }
  misconceptions:
    - id: no-capital-start
      what: Starts a sentence with a small letter (the cat is black.)
      addressed: l1-f1, l1-f2, l1-f4, l1-s4 and l1-n4 ask for the capital at the start; feedback in l1-f1 names it
    - id: full-stop-misplaced
      what: Puts the full stop in the middle or leaves it out (The sun. is hot)
      addressed: l1-f5, l1-s5 and l1-n5 ask where the full stop goes
    - id: question-gets-full-stop
      what: Ends an asking sentence with a full stop (Can I have a drink.)
      addressed: l2-f1, l2-f4, l2-s1 and l2-n1; feedback in l2-f1 says an asking sentence takes a question mark
    - id: marks-mixed-up
      what: Mixes up the question mark and the exclamation mark
      addressed: l2-f2, l2-s2, l2-n2 and l2-n3 set a strong-feeling sentence against a question
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Großbuchstabe und Punkt", en: "Capital letter and full stop" }
    goal:
      de: "Fang jeden Satz mit einem Großbuchstaben an und setz den Punkt direkt nach dem letzten Wort."
      en: "Start each sentence with a capital letter, and put the full stop right after the last word."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Put the words in order to make a sentence."
            show: { object: duck }
            options: ["quacks.", "The", "duck"]
            slot_count: 3
            answer: ["The", "duck", "quacks."]
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Fill the gap with the joining word."
            say: "I have a pen ... a book. Which word joins them?"
            frame: "I have a pen _ a book."
            options: ["and", "the", "is"]
            answer: ["and"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "the dog is big"
            say: "Look at this sentence: the dog is big. What do you think: what is missing at the start, and what is missing at the end?"
            show: { object: dog }
          - text: "The dog is big."
            say: "Here it is with nothing missing. A sentence starts with a capital letter. It ends with a full stop. The capital letter says start here. The full stop says stop here."
            show: { object: dog }
          - text: "the dog is big   →   The dog is big."
            say: "This one has no capital letter and no full stop. Let's fix it. A capital T at the start, and a full stop after the last word."
          - text: "The sun. is hot   →   The sun is hot."
            say: "The full stop goes at the very end, after the last word. Not in the middle."
            show: { object: sun }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which one is written correctly?"
                say: "Which sentence has a capital letter and a full stop? Read them yourself."
                options: ["The cat is black.", "the cat is black.", "The cat is black"]
                answer: "The cat is black."
                option_audio: false
                feedback:
                  "the cat is black.": "Look at the first letter. A sentence starts with a capital letter."
                hints:
                  - "Check the start and the end of each one."
                  - "You need a capital letter first and a full stop last."
                  - "The cat is black."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which letter starts the sentence?"
                say: "We like to play. Which letter starts the sentence?"
                frame: "_e like to play."
                options: ["W", "w"]
                answer: ["W"]
                option_audio: false
                hints:
                  - "This letter is the start of a sentence."
                  - "A sentence starts with a capital letter."
                  - "The capital W."
              - id: l1-f3
                type: true_false
                text: "Is it written correctly? \"we went to the park.\""
                say: "Look at the start and the end. Is it written correctly?"
                answer: false
                hints:
                  - "Look at the very first letter."
                  - "Is the w a capital letter?"
                  - "No. It should start with a capital W."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the word that needs a capital letter."
                say: "My dog likes bones. Tap the word that needs a capital letter."
                show: { drawn: letter-card, text: "my dog likes bones." }
                spans: ["my"]
                hints:
                  - "Which word starts the sentence?"
                  - "The first word needs a capital letter."
                  - "My."
              - id: l1-f5
                type: multiple_choice
                text: "I can kick a ball\n\nWhere does the full stop go?"
                say: "I can kick a ball. Where does the full stop go?"
                options: ["after ball", "after kick", "after I"]
                answer: "after ball"
                hints:
                  - "The full stop shows where the sentence stops."
                  - "It goes after the last word."
                  - "After ball."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which one is written correctly?"
                say: "Which sentence has a capital letter and a full stop? Read them yourself."
                show: { object: hat }
                options: ["My hat is red.", "My hat is red", "my hat is red."]
                answer: "My hat is red."
                option_audio: false
                hints: ["Check the start and the end."]
              - id: l1-s2
                type: true_false
                text: "Is it written correctly? \"The bus is big.\""
                say: "Look at the start and the end. Is it written correctly?"
                answer: true
                hints: ["Is there a capital letter first and a full stop last?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Which letter starts the sentence?"
                say: "The fox ran away. Which letter starts the sentence?"
                show: { object: fox }
                frame: "_he fox ran away."
                options: ["T", "t"]
                answer: ["T"]
                option_audio: false
                hints: ["A sentence starts with a capital letter."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the word that needs a capital letter."
                say: "The frog sat on a log. Tap the word that needs a capital letter."
                show: { drawn: letter-card, text: "the frog sat on a log." }
                spans: ["the"]
                hints: ["The first word needs a capital letter."]
              - id: l1-s5
                type: multiple_choice
                text: "Which one is written correctly?"
                say: "Which sentence is written correctly? Read them yourself."
                options: ["The sun. is hot", "The sun is hot.", "the sun is hot"]
                answer: "The sun is hot."
                option_audio: false
                hints: ["One full stop, after the last word."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which one is written correctly?"
                say: "Which sentence has a capital letter and a full stop? Read them yourself."
                options: ["I like jam.", "i like jam", "I like jam"]
                answer: "I like jam."
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "Is it written correctly? \"the cake is big\""
                say: "Look at the start and the end. Is it written correctly?"
                answer: false
              - id: l1-n3
                type: fill_in_blank
                text: "Which letter starts the sentence?"
                say: "My mum has a car. Which letter starts the sentence?"
                frame: "_y mum has a car."
                options: ["M", "m"]
                answer: ["M"]
                option_audio: false
              - id: l1-n4
                type: highlight_in_text
                text: "Tap the word that needs a capital letter."
                say: "We had chips for tea. Tap the word that needs a capital letter."
                show: { drawn: letter-card, text: "we had chips for tea." }
                spans: ["we"]
              - id: l1-n5
                type: multiple_choice
                text: "The bird sang in the tree\n\nWhere does the full stop go?"
                say: "The bird sang in the tree. Where does the full stop go?"
                options: ["after tree", "after sang", "after bird"]
                answer: "after tree"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which one is written correctly?"
            say: "Which sentence has a capital letter and a full stop? Read them yourself."
            options: ["The pig is pink.", "the pig is pink.", "The pig is pink"]
            answer: "The pig is pink."
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Which letter starts the sentence?"
            say: "It is cold. Which letter starts the sentence?"
            frame: "_t is cold."
            options: ["I", "i"]
            answer: ["I"]
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it written correctly? \"Dad has a van.\""
            say: "Look at the start and the end. Is it written correctly?"
            answer: true
          - id: l1-c4
            type: true_false
            text: "Is it written correctly? \"My bike. is new\""
            say: "Read it yourself. Is it written correctly?"
            answer: false
          - id: l1-c5
            type: sorting
            text: "Written correctly or not? Put each sentence in its box."
            say: "Read each sentence yourself. Is it written correctly, or does it need fixing? Put it in the right box."
            bins:
              - { id: right, show: { text: "written correctly" }, say: "Written correctly." }
              - { id: fix, show: { text: "needs fixing" }, say: "Needs fixing." }
            options:
              - { text: "The hen is brown.", bin: right }
              - { text: "the hen is brown.", bin: fix }
              - { text: "We can run fast.", bin: right }
              - { text: "We can run fast", bin: fix }
            option_audio: false
          - id: l1-c6
            type: highlight_in_text
            text: "Here are two sentences. Tap the words that need a capital letter."
            say: "Here are two sentences. Tap every word that needs a capital letter."
            show: { drawn: letter-card, text: "the sun is out. we can play." }
            spans: ["the", "we"]
            difficulty: stretch

  - n: 2
    title: { de: "Fragezeichen und Ausrufezeichen", en: "Question marks and exclamation marks" }
    goal:
      de: "Nimm ein Fragezeichen, wenn du fragst, und ein Ausrufezeichen für ein starkes Gefühl, so wie bei what a big cake."
      en: "Use a question mark for asking, and an exclamation mark for a strong feeling, like what a big cake."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which one is written correctly?"
            say: "Which sentence has a capital letter and a full stop? Read them yourself."
            options: ["The cow is big.", "the cow is big.", "The cow is big"]
            answer: "The cow is big."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tap the word that needs a capital letter."
            say: "My cat is soft. Tap the word that needs a capital letter."
            show: { drawn: letter-card, text: "my cat is soft." }
            spans: ["my"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Where is my hat"
            say: "Listen: where is my hat. Is this sentence telling you something, or asking you something? What do you think?"
            show: { object: hat }
          - text: "Where is my hat?"
            say: "It is asking! A question asks something. It ends with a question mark. Questions often start with who, what, where, when, can, do or is."
            show: { object: hat }
          - text: "What a big cake!"
            say: "This sentence shows a strong feeling, like surprise. It ends with an exclamation mark. Sentences like this often start with what or how: What a big cake! How fast you run!"
            show: { object: cake }
          - text: "I have a cake.\nDo you have a cake?\nWhat a big cake!"
            say: "Is the sentence telling, asking, or showing a strong feeling? Then choose the end: a full stop, a question mark or an exclamation mark. Every sentence still starts with a capital letter."
          - text: "Did you know? In Spanish, a question has two question marks: an upside-down one at the start and one at the end."
            say: "Did you know? In Spanish, a question has two question marks. There is an upside-down one at the start, and a normal one at the end. In English we only need one, at the end."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Which mark ends the sentence?"
                say: "Where is my hat. Which mark goes at the end?"
                show: { object: hat }
                frame: "Where is my hat_"
                options: [".", "?", "!"]
                answer: ["?"]
                option_audio: false
                feedback:
                  ".": "This sentence asks something. An asking sentence ends with a question mark."
                  "!": "Where is my hat! Only if it blew away in the wind! This sentence asks something, so it ends with a question mark."
                hints:
                  - "Is it telling or asking?"
                  - "It starts with where. It asks something."
                  - "The question mark."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which mark ends the sentence?"
                say: "What a big cake. Which mark goes at the end?"
                show: { object: cake }
                frame: "What a big cake_"
                options: [".", "?", "!"]
                answer: ["!"]
                option_audio: false
                feedback:
                  ".": "What a big cake, said in a bored voice? Nobody is bored by a big cake! Surprise needs an exclamation mark."
                hints:
                  - "Is it asking something, or showing surprise?"
                  - "What a big cake shows a strong feeling."
                  - "The exclamation mark."
              - id: l2-f3
                type: sorting
                text: "Asking or telling? Put each sentence in its box."
                say: "Read each sentence. Is it asking something, or telling something? Put it in the right box."
                bins:
                  - { id: asking, show: { text: "asking ?" }, say: "Asking." }
                  - { id: telling, show: { text: "telling ." }, say: "Telling." }
                options:
                  - { text: "Can you swim", bin: asking }
                  - { text: "I can swim", bin: telling }
                  - { text: "Is it hot", bin: asking }
                  - { text: "It is hot", bin: telling }
                option_audio: false
                hints:
                  - "Asking sentences often start with can, is, where or who."
                  - "Can you swim asks something. I can swim tells something."
                  - "Can you swim and Is it hot are asking."
              - id: l2-f4
                type: true_false
                text: "Is it written correctly? \"Can I have a drink.\""
                say: "Look at the end mark. Is it written correctly?"
                answer: false
                hints:
                  - "Is this sentence asking or telling?"
                  - "It asks for a drink."
                  - "No. It needs a question mark."
              - id: l2-f5
                type: multiple_choice
                text: "Which one is a question?"
                say: "Which sentence asks something? Read them yourself."
                options: ["Is the dog asleep?", "The dog is asleep.", "What a sleepy dog!"]
                answer: "Is the dog asleep?"
                option_audio: false
                hints:
                  - "A question asks something."
                  - "Look for the question mark at the end."
                  - "Is the dog asleep?"

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which mark ends the sentence?"
                say: "Do you like apples. Which mark goes at the end?"
                show: { object: apple }
                frame: "Do you like apples_"
                options: [".", "?", "!"]
                answer: ["?"]
                option_audio: false
                hints: ["Is it telling or asking?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Which mark ends the sentence?"
                say: "How fast you run. Which mark goes at the end?"
                frame: "How fast you run_"
                options: [".", "?", "!"]
                answer: ["!"]
                option_audio: false
                hints: ["It shows surprise. It starts with how."]
              - id: l2-s3
                type: true_false
                text: "Is it written correctly? \"What a lovely day!\""
                say: "Look at the start and the end. Is it written correctly?"
                answer: true
                hints: ["It starts with what and shows a strong feeling."]
              - id: l2-s4
                type: multiple_choice
                text: "Which one is written correctly?"
                say: "Which question is written correctly? Read them yourself."
                options: ["Who is at the door?", "who is at the door?", "Who is at the door."]
                answer: "Who is at the door?"
                option_audio: false
                hints: ["Check the capital letter and the end mark."]
              - id: l2-s5
                type: sorting
                text: "Asking or telling? Put each sentence in its box."
                say: "Read each sentence. Is it asking something, or telling something? Put it in the right box."
                bins:
                  - { id: asking, show: { text: "asking ?" }, say: "Asking." }
                  - { id: telling, show: { text: "telling ." }, say: "Telling." }
                options:
                  - { text: "Where is Dad", bin: asking }
                  - { text: "Dad is at home", bin: telling }
                  - { text: "Can we go out", bin: asking }
                  - { text: "We can go out", bin: telling }
                option_audio: false
                hints: ["Asking sentences often start with where or can."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which mark ends the sentence?"
                say: "Is it raining. Which mark goes at the end?"
                show: { object: rain }
                frame: "Is it raining_"
                options: [".", "?", "!"]
                answer: ["?"]
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Which mark ends the sentence?"
                say: "What a tall giraffe. Which mark goes at the end?"
                show: { object: giraffe }
                frame: "What a tall giraffe_"
                options: [".", "?", "!"]
                answer: ["!"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Which one shows a strong feeling?"
                say: "Which sentence shows a strong feeling, like surprise? Read them yourself."
                options: ["What a huge fish!", "Is that a fish?", "The fish is in the pond."]
                answer: "What a huge fish!"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it written correctly? \"when is lunch?\""
                say: "Look at the start and the end. Is it written correctly?"
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Which mark ends the sentence?"
                say: "The cat is on the bed. Which mark goes at the end?"
                show: { object: cat }
                frame: "The cat is on the bed_"
                options: [".", "?", "!"]
                answer: ["."]
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: full-stop
            type: multiple_choice
            text: "Which one is written correctly?"
            say: "Which sentence has a capital letter and a full stop? Read them yourself."
            options: ["The tree is tall.", "the tree is tall.", "The tree is tall"]
            answer: "The tree is tall."
            option_audio: false
          - id: l2-c2
            part: capital
            type: fill_in_blank
            text: "Which letter starts the sentence?"
            say: "Our car is red. Which letter starts the sentence?"
            frame: "_ur car is red."
            options: ["O", "o"]
            answer: ["O"]
            option_audio: false
          - id: l2-c3
            part: question-mark
            type: fill_in_blank
            text: "Which mark ends the sentence?"
            say: "Can you see the moon. Which mark goes at the end?"
            show: { object: moon }
            frame: "Can you see the moon_"
            options: [".", "?", "!"]
            answer: ["?"]
            option_audio: false
          - id: l2-c4
            part: exclamation-mark
            type: fill_in_blank
            text: "Which mark ends the sentence?"
            say: "What a funny clown. Which mark goes at the end?"
            show: { object: clown }
            frame: "What a funny clown_"
            options: [".", "?", "!"]
            answer: ["!"]
            option_audio: false
          - id: l2-c5
            part: capital
            type: highlight_in_text
            text: "Tap the word that needs a capital letter."
            say: "The shop is shut. Tap the word that needs a capital letter."
            show: { drawn: letter-card, text: "the shop is shut." }
            spans: ["the"]
          - id: l2-c6
            part: capital
            type: true_false
            text: "Is it written correctly? \"Look at the big ship.\""
            say: "Read it yourself. Is it written correctly?"
            answer: true
          - id: l2-c7
            part: full-stop
            type: true_false
            text: "Is it written correctly? \"The fish swims fast\""
            say: "Read it yourself. Is it written correctly?"
            answer: false
          - id: l2-c8
            part: question-mark
            type: true_false
            text: "Is it written correctly? \"Where are my shoes?\""
            say: "Read it yourself. Is it written correctly?"
            answer: true
          - id: l2-c9
            part: exclamation-mark
            type: true_false
            text: "Is it written correctly? \"What a big dog?\""
            say: "Read it yourself. Is it written correctly?"
            answer: false
          - id: l2-c10
            part: capital
            type: true_false
            text: "Is it written correctly? \"The frog jumped. it went splash.\""
            say: "Read the two sentences yourself. Are they written correctly?"
            answer: false
            difficulty: stretch
          - id: l2-c11
            part: full-stop
            type: highlight_in_text
            text: "Here are two sentences with no full stops. Tap the last word of the first sentence."
            say: "Here are two sentences, but the full stops are missing. Tap the last word of the first sentence."
            show: { drawn: letter-card, text: "I fed the cat It was hungry" }
            spans: ["cat"]
            difficulty: stretch
          - id: l2-c12
            part: question-mark
            type: sorting
            text: "Asking or telling? Put each sentence in its box."
            say: "Read each sentence yourself. Is it asking something, or telling something? Put it in the right box."
            bins:
              - { id: asking, show: { text: "asking ?" }, say: "Asking." }
              - { id: telling, show: { text: "telling ." }, say: "Telling." }
            options:
              - { text: "Who made this mess", bin: asking }
              - { text: "Tom made this mess", bin: telling }
              - { text: "Do you want to play", bin: asking }
              - { text: "I want to play with you", bin: telling }
            option_audio: false
          - id: l2-c13
            part: exclamation-mark
            type: fill_in_blank
            text: "Which mark ends the sentence?"
            say: "How cold the sea is. Which mark goes at the end?"
            frame: "How cold the sea is_"
            options: [".", "?", "!"]
            answer: ["!"]
            option_audio: false
          - id: l2-c14
            part: capital
            type: multiple_choice
            text: "The rain stopped. we went out.\n\nWhich word needs a capital letter?"
            say: "The rain stopped. We went out. Which word needs a capital letter? Read them yourself."
            options: ["we", "rain", "out"]
            answer: "we"
            option_audio: false
          - id: l2-c15
            part: full-stop
            type: true_false
            text: "Is it written correctly? \"We went to the shop.\""
            say: "Read it yourself. Is it written correctly?"
            answer: true
          - id: l2-c16
            part: question-mark
            type: multiple_choice
            text: "Which one needs a question mark at the end?"
            say: "Which sentence needs a question mark at the end? Read them yourself."
            options: ["What is your name", "My name is Sam", "What a lovely name"]
            answer: "What is your name"
            option_audio: false
          - id: l2-c17
            part: exclamation-mark
            type: matching
            text: "Match each sentence to the mark that ends it."
            say: "Read each sentence yourself. Tap a sentence, then tap the mark that ends it."
            option_audio: false
            pairs:
              - left: { text: "I can see a rainbow" }
                right: { text: "." }
