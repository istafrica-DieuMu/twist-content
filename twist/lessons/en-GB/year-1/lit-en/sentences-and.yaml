# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.sentences-and
skill: lit-en.grammar.sentences-and
curriculum: en-GB
language: en
title:
  de: Sätze bauen und mit and verbinden
  en: Making sentences and joining with and
summary: >
  Words make a sentence when they are in an order that makes sense and say
  something whole. Lesson 1 puts word cards in order and tells sentences
  from jumbled words and short phrases; lesson 2 joins two words or two
  sentences with and, and ends with the skill check.
metadata:
  year: year-1
  topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.grammar.finger-spaces]
  also_practises: []
  vocabulary: { en: [word, sentence, make sense, and, join, capital letter, full stop] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: any-order-is-sentence
      what: Thinks any words in any order make a sentence (dog the runs)
      addressed: l1-f1, l1-f2, l1-s2, l1-n2 put jumbled words beside a sentence; feedback in l1-f2 asks whether it makes sense
    - id: phrase-is-sentence
      what: Takes a short phrase for a sentence (A big dog.)
      addressed: l1-s3, l1-n4 and l1-c2 set a phrase that tells nothing happening against a whole sentence
    - id: and-keeps-full-stop
      what: Joins with and but keeps the first full stop or the second capital letter (I ran. and I jumped.)
      addressed: l2-f3, l2-s3 and l2-n2 offer the joined sentence beside one with a stray full stop or capital; feedback in l2-f3 names it
    - id: and-left-hanging
      what: Puts and at the end with nothing after it (I like red and.)
      addressed: l2-s4 asks whether and needs words on both sides
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wörter werden ein Satz", en: "Words make a sentence" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which one has finger spaces?"
            say: "Which one has a space between every word? Look carefully."
            options: ["I see a cat.", "Iseea cat.", "Iseeacat."]
            answer: "I see a cat."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? Every word has a space: \"The sun ishot.\""
            say: "Look at the words. Is there a space between every word?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "dog   The   runs.   →   The dog runs."
            say: "Words make a sentence when they go in an order that makes sense. Dog the runs sounds funny. The dog runs makes sense. It tells us who, and what they do."
            show: { object: dog }
          - text: "dog the ball      A big dog."
            say: "Dog the ball is just words. A big dog is not a sentence either: it does not tell us what happens. A sentence says something whole, like: The big dog has a ball."
          - text: "The cat sat on the mat."
            say: "Say your sentence out loud first. Does it make sense? Then it is a sentence. It starts with a capital letter and ends with a full stop."
            show: { object: cat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Put the words in order to make a sentence."
                show: { object: dog }
                options: ["runs.", "The", "dog"]
                slot_count: 3
                answer: ["The", "dog", "runs."]
                hints:
                  - "Which word has a capital letter? That one goes first."
                  - "The ... then who it is ... then what it does."
                  - "The dog runs."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which one is a sentence?"
                say: "Which one is a sentence? Which one makes sense?"
                options: ["I like cake.", "like I cake", "cake the"]
                answer: "I like cake."
                feedback:
                  "like I cake": "Say it out loud. Does like I cake make sense? Try the words in a different order."
                hints:
                  - "Say each one out loud. Does it make sense?"
                  - "A sentence tells us something whole."
                  - "I like cake."
              - id: l1-f3
                type: true_false
                text: "Is it a sentence? \"The sun is hot.\""
                say: "Read it with me: The sun is hot. Is it a sentence?"
                answer: true
                hints:
                  - "Does it make sense?"
                  - "It tells us what the sun is like."
                  - "Yes, it is a sentence."
              - id: l1-f4
                type: ordering
                text: "Put the words in order to make a sentence."
                show: { object: frog }
                options: ["frog", "jumps.", "A"]
                slot_count: 3
                answer: ["A", "frog", "jumps."]
                hints:
                  - "Start with the word that has a capital letter."
                  - "The word with the full stop goes last."
                  - "A frog jumps."
              - id: l1-f5
                type: fill_in_blank
                text: "Which word makes it make sense?"
                say: "The cat ... on the mat. Which word fits the gap?"
                show: { object: cat }
                frame: "The cat _ on the mat."
                options: ["sat", "cat", "the"]
                answer: ["sat"]
                hints:
                  - "Say the sentence with each word in the gap."
                  - "We need a word for what the cat did."
                  - "Sat. The cat sat on the mat."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Put the words in order to make a sentence."
                show: { object: bus }
                options: ["red.", "The", "is", "bus"]
                slot_count: 4
                answer: ["The", "bus", "is", "red."]
                hints: ["The capital letter goes first and the full stop goes last."]
              - id: l1-s2
                type: true_false
                text: "Is it a sentence? \"bed the in\""
                say: "Read the words: bed the in. Is it a sentence?"
                answer: false
                hints: ["Say it out loud. Does it make sense?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which one is a sentence?"
                say: "Which one is a whole sentence?"
                options: ["A bird can fly.", "bird a fly can", "A bird."]
                answer: "A bird can fly."
                hints: ["A sentence tells us what happens."]
              - id: l1-s4
                type: fill_in_blank
                text: "Which word makes it make sense?"
                say: "I can ... a ball. Which word fits the gap?"
                show: { object: ball }
                frame: "I can _ a ball."
                options: ["kick", "cup", "red"]
                answer: ["kick"]
                hints: ["What can you do with a ball?"]
              - id: l1-s5
                type: ordering
                text: "Put the words in order to make a sentence."
                show: { object: duck }
                options: ["swims.", "duck", "The"]
                slot_count: 3
                answer: ["The", "duck", "swims."]
                hints: ["Who is it, and what does it do?"]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Put the words in order to make a sentence."
                show: { object: bee }
                options: ["bee", "A", "buzzes."]
                slot_count: 3
                answer: ["A", "bee", "buzzes."]
              - id: l1-n2
                type: multiple_choice
                text: "Which one is a sentence?"
                say: "Which one is a sentence? Which one makes sense?"
                options: ["Mum has a hat.", "Mum a hat has", "a hat Mum"]
                answer: "Mum has a hat."
              - id: l1-n3
                type: fill_in_blank
                text: "Which word makes it make sense?"
                say: "The fish ... in the pond. Which word fits the gap?"
                show: { object: fish }
                frame: "The fish _ in the pond."
                options: ["swims", "fish", "pond"]
                answer: ["swims"]
              - id: l1-n4
                type: true_false
                text: "Is it a sentence? \"My big red\""
                say: "Read the words: My big red. Is it a sentence?"
                answer: false
              - id: l1-n5
                type: ordering
                text: "Put the words in order to make a sentence."
                show: { object: girl }
                options: ["has", "The", "girl", "a kite."]
                slot_count: 4
                answer: ["The", "girl", "has", "a kite."]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Put the words in order to make a sentence."
            show: { object: cow }
            options: ["grass.", "The", "eats", "cow"]
            slot_count: 4
            answer: ["The", "cow", "eats", "grass."]
          - id: l1-c2
            type: multiple_choice
            text: "Which one is a sentence?"
            say: "Which one is a whole sentence?"
            options: ["I sit on a chair.", "chair a on sit I", "On a chair."]
            answer: "I sit on a chair."
          - id: l1-c3
            type: true_false
            text: "Is it a sentence? \"The pig is pink.\""
            say: "Read it: The pig is pink. Is it a sentence?"
            answer: true

  - n: 2
    title: { de: "Mit and verbinden", en: "Joining with and" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Put the words in order to make a sentence."
            show: { object: cat }
            options: ["cat", "The", "naps."]
            slot_count: 3
            answer: ["The", "cat", "naps."]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which one is a sentence?"
            say: "Which one is a whole sentence?"
            options: ["Dad can swim.", "can Dad swim the", "A tall dad."]
            answer: "Dad can swim."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I like cats and dogs."
            say: "And is a joining word. It joins cats and dogs. And always needs words on both sides: one before it and one after it."
            show: { objects: [cat, dog] }
          - text: "I ran. I jumped.   →   I ran and I jumped."
            say: "And can join two sentences to make one. Take away the first full stop, write and, and carry on with a small letter."
          - text: "I ran and I jumped."
            say: "Now it is one sentence. One capital letter at the start, and one full stop at the very end."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the joining word."
                say: "Tap the word that joins the cat and the dog."
                show: { drawn: letter-card, text: "I have a cat and a dog." }
                spans: ["and"]
                hints:
                  - "A joining word sits between two things."
                  - "It comes after cat and before a dog."
                  - "And."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Fill the gap with the joining word."
                say: "I like apples ... bananas. Which word joins them?"
                show: { objects: [apple, banana] }
                frame: "I like apples _ bananas."
                options: ["and", "the", "is"]
                answer: ["and"]
                hints:
                  - "We need a word that joins two things."
                  - "Apples ... bananas. You like both of them."
                  - "And."
              - id: l2-f3
                type: multiple_choice
                text: "I sat down. I read a book.\n\nWhich one joins them with and?"
                say: "Join the two sentences with and. Which one is right?"
                options: ["I sat down and I read a book.", "I sat down. and I read a book.", "I sat down and. I read a book."]
                answer: "I sat down and I read a book."
                option_audio: false
                feedback:
                  "I sat down. and I read a book.": "Take the first full stop away. One sentence has only one full stop, at the end."
                hints:
                  - "When we join, the first full stop goes."
                  - "Look for one full stop, at the very end."
                  - "I sat down and I read a book."
              - id: l2-f4
                type: true_false
                text: "Is it true? \"The sun is hot and the sky is blue.\" is one sentence."
                say: "Read it with me: The sun is hot and the sky is blue. Is it one sentence?"
                answer: true
                hints:
                  - "Count the full stops."
                  - "And joins the two parts. There is one full stop at the end."
                  - "Yes, it is one sentence."
              - id: l2-f5
                type: fill_in_blank
                text: "Fill the gap with the joining word."
                say: "Tom has a ball ... Sam has a kite. Which word joins them?"
                frame: "Tom has a ball _ Sam has a kite."
                options: ["and", "a", "the"]
                answer: ["and"]
                hints:
                  - "Two sentences are being joined."
                  - "Which word is a joining word?"
                  - "And."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap the joining word."
                say: "Tap the word that joins two things."
                show: { drawn: letter-card, text: "We had cheese and bread for tea." }
                spans: ["and"]
                hints: ["It sits between cheese and bread."]
              - id: l2-s2
                type: fill_in_blank
                text: "Fill the gap with the joining word."
                say: "The frog can jump ... swim. Which word joins them?"
                show: { object: frog }
                frame: "The frog can jump _ swim."
                options: ["and", "is", "on"]
                answer: ["and"]
                hints: ["The frog can do both."]
              - id: l2-s3
                type: multiple_choice
                text: "The dog barked. The cat ran.\n\nWhich one joins them with and?"
                say: "Join the two sentences with and. Which one is right?"
                options: ["The dog barked and the cat ran.", "The dog barked and The cat ran.", "The dog barked the cat ran."]
                answer: "The dog barked and the cat ran."
                option_audio: false
                hints: ["After and, carry on with a small letter."]
              - id: l2-s4
                type: true_false
                text: "Is it right? \"I like red and.\""
                say: "Read it: I like red and. Is it right?"
                answer: false
                hints: ["And needs words on both sides."]
              - id: l2-s5
                type: ordering
                text: "Put the words in order to make a sentence."
                show: { objects: [sock, shoe] }
                options: ["shoes.", "and", "I have", "socks"]
                slot_count: 4
                answer: ["I have", "socks", "and", "shoes."]
                hints: ["And goes between socks and shoes."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Fill the gap with the joining word."
                say: "Ben has a hat ... a coat. Which word joins them?"
                frame: "Ben has a hat _ a coat."
                options: ["and", "on", "it"]
                answer: ["and"]
              - id: l2-n2
                type: multiple_choice
                text: "I went home. I had tea.\n\nWhich one joins them with and?"
                say: "Join the two sentences with and. Which one is right?"
                options: ["I went home and I had tea.", "I went home I had tea.", "I went home and. I had tea."]
                answer: "I went home and I had tea."
                option_audio: false
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the joining word."
                say: "Tap the word that joins two things."
                show: { drawn: letter-card, text: "The bus is big and red." }
                spans: ["and"]
              - id: l2-n4
                type: true_false
                text: "Is it true? \"The bird sang and the bee buzzed.\" joins two sentences with and."
                say: "Read it: The bird sang and the bee buzzed. Does it join two sentences with and?"
                answer: true
              - id: l2-n5
                type: ordering
                text: "Put the words in order to make a sentence."
                show: { objects: [cat, dog] }
                options: ["sleep.", "and", "The cat", "the dog"]
                slot_count: 4
                answer: ["The cat", "and", "the dog", "sleep."]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Put the words in order to make a sentence."
            show: { object: pig }
            options: ["mud.", "The", "pig", "rolls in"]
            slot_count: 4
            answer: ["The", "pig", "rolls in", "mud."]
          - id: l2-c2
            type: multiple_choice
            text: "Which one is a sentence?"
            say: "Which one is a whole sentence?"
            options: ["The baby is asleep.", "asleep the baby is is", "The sleepy baby."]
            answer: "The baby is asleep."
          - id: l2-c3
            type: fill_in_blank
            text: "Fill the gap with the joining word."
            say: "I like milk ... juice. Which word joins them?"
            show: { objects: [milk, juice] }
            frame: "I like milk _ juice."
            options: ["and", "is", "the"]
            answer: ["and"]
          - id: l2-c4
            type: multiple_choice
            text: "It rained. We got wet.\n\nWhich one joins them with and?"
            say: "Join the two sentences with and. Which one is right?"
            options: ["It rained and we got wet.", "It rained and We got wet.", "It rained we got wet."]
            answer: "It rained and we got wet."
            option_audio: false
          - id: l2-c5
            type: highlight_in_text
            text: "Tap the joining word."
            say: "Tap the word that joins two things."
            show: { drawn: letter-card, text: "I can hop and skip." }
            spans: ["and"]
