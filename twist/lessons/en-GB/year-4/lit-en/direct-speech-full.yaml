# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.direct-speech-full
skill: lit-en.grammar.direct-speech-full
curriculum: en-GB
language: en
title:
  de: Wörtliche Rede vollständig zeichensetzen
  en: Punctuating direct speech fully
summary: >
  Direct speech needs more than inverted commas. When the reporting
  clause comes first, it ends with a comma, and the spoken words start
  with a capital letter: Mum said, “Time for bed.” The end punctuation
  goes inside the inverted commas. When the speech comes first, a comma
  replaces the full stop inside the inverted commas: “Time for bed,” said
  Mum. Lesson 1 punctuates speech after the reporting clause; lesson 2
  puts the speech first, keeps question and exclamation marks, and ends
  with the skill check.
metadata:
  year: year-4
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.grammar.inverted-commas, lit-en.grammar.commas-lists]
  also_practises: [lit-en.composition.evaluate-improve]
  vocabulary: { en: [direct speech, inverted commas, speech marks, reporting clause, comma, capital letter, full stop, question mark, exclamation mark] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: no-comma-after-reporting
      what: Leaves out the comma after the reporting clause (Mum said “Time for bed.”)
      addressed: lesson 1 Learn screen 2; tasks l1-f1 (feedback), l1-f3, l1-s1, l1-n1, l2-c1
    - id: punctuation-outside
      what: Puts the end punctuation outside the inverted commas (“Time for bed”.)
      addressed: lesson 1 Learn screen 3; tasks l1-f2, l1-s2, l1-n2, l2-c3
    - id: full-stop-before-reporting
      what: Keeps a full stop inside the speech when the reporting clause follows (“I am cold.” said Ella.)
      addressed: lesson 2 Learn screen 1; tasks l2-f1 (feedback), l2-f2, l2-s1, l2-n1, l2-c2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Begleitsatz vorne, en: Reporting clause first }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tap the spoken words."
            say: "Tap every word that someone says out loud."
            show: { drawn: letter-card, text: "Ali shouted, “Wait for me!”" }
            spans: ["“Wait", "for", "me!”"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which list has the commas in the right place?"
            options: ["I packed a towel, a hat and some suncream.", "I packed, a towel a hat, and some suncream.", "I packed a towel a hat, and, some suncream."]
            answer: "I packed a towel, a hat and some suncream."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mum said, “Time for bed.”"
            say: "Here is direct speech: the exact words someone says, inside inverted commas. Mum said is the reporting clause. It tells us who is speaking."
          - text: "Mum said, “Time for bed.”\n        ↑ comma"
            say: "When the reporting clause comes first, put a comma at the end of it, before the inverted commas open."
          - text: "“Time for bed.”\ncapital T   full stop inside"
            say: "The spoken words start with a capital letter, even in the middle of a sentence. The full stop, question mark or exclamation mark goes inside the closing inverted commas."
          - text: "Jack asked, “Can I come too?”\nGran cried, “What a surprise!”"
            say: "It works the same with questions and exclamations. The question mark and the exclamation mark go inside the inverted commas."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["Dad said, “Put your shoes on.”", "Dad said “Put your shoes on.”", "Dad said, “put your shoes on.”"]
                answer: "Dad said, “Put your shoes on.”"
                option_audio: false
                feedback:
                  "Dad said “Put your shoes on.”": "The reporting clause Dad said needs a comma at the end, before the inverted commas."
                hints:
                  - "Check the end of the reporting clause."
                  - "Then check the first spoken word."
                  - "Dad said, “Put your shoes on.”"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["Mia whispered, “I can see a deer.”", "Mia whispered, “I can see a deer”.", "Mia whispered, “I can see a deer”"]
                answer: "Mia whispered, “I can see a deer.”"
                option_audio: false
                hints:
                  - "Where does the full stop go?"
                  - "It belongs to the spoken words."
                  - "Inside the inverted commas: deer.”"
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Which punctuation mark goes in the gap?"
                frame: "The teacher said_ “Line up quietly.”"
                options: [",", ".", "?"]
                answer: [","]
                option_audio: false
                hints:
                  - "The gap is at the end of the reporting clause."
                  - "What comes before the inverted commas open?"
                  - "A comma."
              - id: l1-f4
                type: fill_in_blank
                text: "Fill the gap."
                say: "Which punctuation mark goes in the gap?"
                frame: "Sam asked, “Where is my scarf_”"
                options: ["?", ".", ","]
                answer: ["?"]
                option_audio: false
                hints:
                  - "What kind of sentence does Sam say?"
                  - "He asks something."
                  - "A question mark."
              - id: l1-f5
                type: true_false
                text: "Lily said, “we are going to the zoo.”\n\nIs it punctuated correctly?"
                answer: false
                hints:
                  - "Check the first spoken word."
                  - "Spoken words start with a capital letter."
                  - "No. It should be “We”."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["Grandpa said, “Let's go fishing.”", "Grandpa said “Let's go fishing.”", "Grandpa said, Let's go fishing."]
                answer: "Grandpa said, “Let's go fishing.”"
                option_audio: false
                hints: ["Look for the comma and the inverted commas."]
              - id: l1-s2
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["Zoe shouted, “Look out!”", "Zoe shouted, “Look out”!", "Zoe shouted, “look out!”"]
                answer: "Zoe shouted, “Look out!”"
                option_audio: false
                hints: ["The exclamation mark belongs to the spoken words."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Which punctuation mark goes in the gap?"
                frame: "Mr Hill announced_ “The bus is here.”"
                options: [",", ".", "!"]
                answer: [","]
                option_audio: false
                hints: ["The gap ends the reporting clause."]
              - id: l1-s4
                type: fill_in_blank
                text: "Fill the gap."
                say: "Which punctuation mark goes in the gap?"
                frame: "Nina cried, “I won the race_”"
                options: ["!", ",", "?"]
                answer: ["!"]
                option_audio: false
                hints: ["Nina is very excited."]
              - id: l1-s5
                type: true_false
                text: "Ben asked, “Can I have a turn?”\n\nIs it punctuated correctly?"
                answer: true
                hints: ["Check the comma, the capital and the question mark."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["The pilot said, “Fasten your seat belts.”", "The pilot said “Fasten your seat belts.”", "The pilot said, “fasten your seat belts.”"]
                answer: "The pilot said, “Fasten your seat belts.”"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["Raj asked, “Is it raining?”", "Raj asked, “Is it raining”?", "Raj asked “is it raining?”"]
                answer: "Raj asked, “Is it raining?”"
                option_audio: false
              - id: l1-n3
                type: fill_in_blank
                text: "Fill the gaps."
                say: "Which punctuation marks go in the gaps?"
                frame: "Aunt Rose said_ “The cake is ready_”"
                options: [",", ".", "?"]
                answer: [",", "."]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Kit yelled “Help me!”\n\nIs it punctuated correctly?"
                answer: false
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the reporting clause."
                say: "Tap every word of the reporting clause."
                show: { drawn: letter-card, text: "The old farmer muttered, “Those foxes again.”" }
                spans: ["The", "old", "farmer", "muttered,"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is punctuated correctly?"
            options: ["Mum said, “Wash your hands.”", "Mum said “Wash your hands.”", "Mum said, “Wash your hands”."]
            answer: "Mum said, “Wash your hands.”"
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Fill the gap."
            say: "Which punctuation mark goes in the gap?"
            frame: "Leo asked, “Who took my pen_”"
            options: ["?", ".", ","]
            answer: ["?"]
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Eva said, “It is my turn.”\n\nIs it punctuated correctly?"
            answer: true

  - n: 2
    title: { de: Rede vorne, en: Speech first }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is punctuated correctly?"
            options: ["Tom said, “I like this song.”", "Tom said “I like this song.”", "Tom said, “i like this song.”"]
            answer: "Tom said, “I like this song.”"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Fill the gap."
            say: "Which punctuation mark goes in the gap?"
            frame: "Amy asked, “Can we stay up late_”"
            options: ["?", ".", ","]
            answer: ["?"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "“I am cold,” said Ella.\nnot: “I am cold.” said Ella."
            say: "The speech can come first. Then the sentence is not finished when the speech ends, so we put a comma instead of a full stop, inside the inverted commas. The full stop comes at the very end, after said Ella."
          - text: "“Are you cold?” asked Ella.\n“I am freezing!” shouted Ella."
            say: "Questions and exclamations keep their question mark or exclamation mark, inside the inverted commas. Then the reporting clause starts with a small letter: asked, shouted."
          - text: "“I am cold,” said Ella.\nsaid starts with a small letter"
            say: "After the closing inverted commas, the reporting clause carries on the same sentence, so it starts with a small letter, unless it begins with a name."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["“It is raining,” said Dad.", "“It is raining.” said Dad.", "“It is raining” said Dad."]
                answer: "“It is raining,” said Dad."
                option_audio: false
                feedback:
                  "“It is raining.” said Dad.": "The sentence goes on after the speech, so use a comma, not a full stop, inside the inverted commas."
                hints:
                  - "Does the sentence end when the speech ends?"
                  - "No, said Dad comes next."
                  - "Use a comma: “It is raining,” said Dad."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Fill the gap."
                say: "Which punctuation mark goes in the gap?"
                frame: "“I have finished my book_” said Priya."
                options: [",", ".", "?"]
                answer: [","]
                option_audio: false
                hints:
                  - "The reporting clause comes after the speech."
                  - "So the sentence has not finished yet."
                  - "A comma."
              - id: l2-f3
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["“Where are you going?” asked Gran.", "“Where are you going,” asked Gran.", "“Where are you going?” Asked Gran."]
                answer: "“Where are you going?” asked Gran."
                option_audio: false
                hints:
                  - "Is it a question?"
                  - "A question keeps its question mark, and asked has a small letter."
                  - "“Where are you going?” asked Gran."
              - id: l2-f4
                type: ordering
                text: "Build the sentence."
                say: "Put the cards in order to make a correctly punctuated sentence, with the speech first."
                options: ["said Omar.", "“We won the match,”", "“We won the match.”"]
                slot_count: 2
                answer: ["“We won the match,”", "said Omar."]
                option_audio: false
                hints:
                  - "The speech comes first."
                  - "Which version of the speech ends with a comma?"
                  - "“We won the match,” said Omar."
              - id: l2-f5
                type: true_false
                text: "“Watch out!” shouted the lifeguard.\n\nIs it punctuated correctly?"
                answer: true
                hints:
                  - "Check the mark inside the inverted commas."
                  - "An exclamation keeps its exclamation mark."
                  - "Yes, it is correct."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["“My tooth is wobbly,” said Finn.", "“My tooth is wobbly.” said Finn.", "“My tooth is wobbly”, said Finn."]
                answer: "“My tooth is wobbly,” said Finn."
                option_audio: false
                hints: ["The comma goes inside the inverted commas."]
              - id: l2-s2
                type: fill_in_blank
                text: "Fill the gap."
                say: "Which punctuation mark goes in the gap?"
                frame: "“Is it time for lunch_” asked Lucy."
                options: ["?", ",", "."]
                answer: ["?"]
                option_audio: false
                hints: ["Lucy asks something."]
              - id: l2-s3
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["“That is amazing!” gasped Rosa.", "“That is amazing!” Gasped Rosa.", "“That is amazing”! gasped Rosa."]
                answer: "“That is amazing!” gasped Rosa."
                option_audio: false
                hints: ["Gasped carries on the sentence."]
              - id: l2-s4
                type: ordering
                text: "Build the sentence."
                say: "Put the cards in order to make a correctly punctuated sentence, with the speech first."
                options: ["“The film starts at six.”", "explained Dad.", "“The film starts at six,”"]
                slot_count: 2
                answer: ["“The film starts at six,”", "explained Dad."]
                option_audio: false
                hints: ["Speech first ends with a comma."]
              - id: l2-s5
                type: true_false
                text: "“I need a pencil.” said Jay.\n\nIs it punctuated correctly?"
                answer: false
                hints: ["Should there be a full stop before said?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["“The library is closed,” said Mrs Shah.", "“The library is closed.” said Mrs Shah.", "“The library is closed” said Mrs Shah."]
                answer: "“The library is closed,” said Mrs Shah."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Fill the gaps."
                say: "Which punctuation marks go in the gaps?"
                frame: "“Can I help_” asked the girl_"
                options: ["?", ".", ","]
                answer: ["?", "."]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["Mo said, “Come and see.”", "Mo said “Come and see.”", "Mo said, “Come and see”."]
                answer: "Mo said, “Come and see.”"
                option_audio: false
              - id: l2-n4
                type: ordering
                text: "Build the sentence."
                say: "Put the cards in order to make a correctly punctuated sentence, with the speech first."
                options: ["“Stop that noise!”", "roared the giant.", "“Stop that noise”"]
                slot_count: 2
                answer: ["“Stop that noise!”", "roared the giant."]
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "“We are lost,” sighed Hana.\n\nIs it punctuated correctly?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which is punctuated correctly?"
            options: ["The coach said, “Well played, everyone.”", "The coach said “Well played, everyone.”", "The coach said, “well played, everyone.”"]
            answer: "The coach said, “Well played, everyone.”"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Which is punctuated correctly?"
            options: ["“I am hungry,” moaned Alfie.", "“I am hungry.” moaned Alfie.", "“I am hungry” moaned Alfie."]
            answer: "“I am hungry,” moaned Alfie."
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "Fill the gap."
            say: "Which punctuation mark goes in the gap?"
            frame: "Kezia asked, “Have you seen my hat_”"
            options: ["?", ".", ","]
            answer: ["?"]
            option_audio: false
          - id: l2-c4
            type: fill_in_blank
            text: "Fill the gap."
            say: "Which punctuation mark goes in the gap?"
            frame: "“The pond has frozen_” said Grandad."
            options: [",", ".", ";"]
            answer: [","]
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "“What time is it,” asked Isla.\n\nIs it punctuated correctly?"
            answer: false
