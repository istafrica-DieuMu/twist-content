# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.pronoun-cohesion
skill: lit-en.grammar.pronoun-cohesion
curriculum: en-GB
language: en
title:
  de: Pronomen, Begleiter und Possessivpronomen
  en: Pronouns, determiners and possessive pronouns
summary: >
  A pronoun (he, she, it, they) stands in for a noun so writing does not
  repeat itself, but the noun must come back when a pronoun could mean
  two people. Lesson 1 chooses between a pronoun and a noun to keep
  writing clear; lesson 2 names determiners (a, the, this, those, my,
  some) and possessive pronouns (mine, yours, hers, ours, theirs), tells
  my from mine, and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.word-classes]
  also_practises: [lit-en.composition.evaluate-improve]
  vocabulary: { en: [noun, pronoun, determiner, possessive pronoun, repetition, clear, refer] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: pronoun-for-noun, what: { de: ein Pronomen statt eines wiederholten Nomens verwenden, en: using a pronoun so a noun is not repeated } }
    - { id: clear, what: { de: "das Nomen wiederholen, wenn ein Pronomen zwei Personen meinen könnte", en: the noun again when a pronoun could mean two people } }
    - { id: determiners, what: { de: Begleiter erkennen und wählen, en: finding and choosing determiners } }
    - { id: possessive, what: { de: "my oder mine wählen und Possessivpronomen ohne Apostroph schreiben", en: "choosing my or mine, and writing possessive pronouns with no apostrophe" } }
  misconceptions:
    - id: pronoun-always-better
      what: Replaces every noun with a pronoun, so the reader cannot tell who is meant (Sam and Leo ran. He fell.)
      addressed: lesson 1 Learn screen 2; tasks l1-f3 (feedback), l1-s3, l1-n3, l2-c2
    - id: my-mine-swap
      what: Uses a possessive pronoun before a noun or a determiner on its own (mine bike, that bike is my)
      addressed: lesson 2 Learn screen 2; tasks l2-f2 (feedback), l2-f3, l2-s2, l2-n2, l2-c4
    - id: possessive-pronoun-apostrophe
      what: Puts an apostrophe in a possessive pronoun (your's, her's, their's)
      addressed: lesson 2 Learn screen 3; tasks l2-f5, l2-s5, l2-n5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Pronomen oder Nomen?", en: "Pronoun or noun?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "\"The happy dog wagged its tail.\"\nWhich word is a noun?"
            options: ["dog", "happy", "wagged"]
            answer: "dog"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "\"The happy dog wagged its tail.\"\nWhich word is a verb?"
            options: ["wagged", "happy", "tail"]
            answer: "wagged"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mia found a shell. Mia washed the shell. Mia gave the shell to Gran.\nMia found a shell. She washed it and gave it to Gran."
            say: "Saying Mia and the shell again and again sounds clumsy. A pronoun stands in for a noun. She stands for Mia, and it stands for the shell."
          - text: "Sam and Leo raced to the gate. He fell over.\nSam and Leo raced to the gate. Leo fell over."
            say: "But be careful. Who fell over, Sam or Leo? He could mean either. When a pronoun could mean two people, use the noun again to keep it clear."
          - text: "I   you   he   she   it   we   they\nme   him   her   us   them"
            say: "These are the personal pronouns. Use them once the reader knows who or what you mean."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"Dad made pancakes. ___ put lemon on them.\"\nWhich word fits best?"
                options: ["He", "Dad's", "They"]
                answer: "He"
                hints:
                  - "Who put lemon on them?"
                  - "Dad. Which pronoun stands for one man?"
                  - "He."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"The kite flew high. Then the kite got stuck in a tree.\"\nWhich word could replace the second the kite?"
                options: ["it", "they", "she"]
                answer: "it"
                hints:
                  - "Is a kite a person or a thing?"
                  - "One thing takes it."
                  - "it."
              - id: l1-f3
                type: multiple_choice
                text: "Which is clearest?"
                options: ["Amy and Kate baked a cake. Kate burnt her finger.", "Amy and Kate baked a cake. She burnt her finger.", "Amy and Kate baked a cake. Her burnt her finger."]
                answer: "Amy and Kate baked a cake. Kate burnt her finger."
                option_audio: false
                feedback:
                  "Amy and Kate baked a cake. She burnt her finger.": "She could be Amy or Kate. When two people could be meant, use the name."
                hints:
                  - "In the second sentence, can you tell who burnt her finger?"
                  - "She could mean Amy or Kate."
                  - "Use the name: Kate burnt her finger."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the pronouns."
                say: "Tap every pronoun in these sentences."
                show: { drawn: letter-card, text: "The twins found a puppy. They took it home." }
                spans: ["They", "it"]
                hints:
                  - "Which words stand in for a noun?"
                  - "One stands for the twins, one for the puppy."
                  - "They and it."
              - id: l1-f5
                type: multiple_choice
                text: "\"My brother has a bike. My brother rides the bike to school.\"\nWhich is the best way to improve it?"
                options: ["My brother has a bike. He rides it to school.", "My brother has a bike. He rides he to school.", "He has it. He rides it to school."]
                answer: "My brother has a bike. He rides it to school."
                option_audio: false
                hints:
                  - "Keep the noun the first time, then use pronouns."
                  - "He for my brother, it for the bike."
                  - "My brother has a bike. He rides it to school."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"Nana and I went to the market. ___ bought some plums.\"\nWhich word fits best?"
                options: ["We", "Us", "They"]
                answer: "We"
                hints: ["Nana and I together: which pronoun?"]
              - id: l1-s2
                type: multiple_choice
                text: "\"The children sang. Then the children clapped.\"\nWhich word could replace the second the children?"
                options: ["they", "them", "it"]
                answer: "they"
                hints: ["The pronoun does the clapping."]
              - id: l1-s3
                type: multiple_choice
                text: "Which is clearest?"
                options: ["Raj passed the ball to Ben. Ben scored a goal.", "Raj passed the ball to Ben. He scored a goal.", "He passed it to him. He scored a goal."]
                answer: "Raj passed the ball to Ben. Ben scored a goal."
                option_audio: false
                hints: ["Can you tell who scored?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the pronouns."
                say: "Tap every pronoun in these sentences."
                show: { drawn: letter-card, text: "Grandad lost the remote. We helped him look." }
                spans: ["We", "him"]
                hints: ["Which words stand for people?"]
              - id: l1-s5
                type: multiple_choice
                text: "\"The cat chased the mouse. The cat was fast.\"\nWhich is the best way to improve it?"
                options: ["The cat chased the mouse. It was fast.", "It chased it. It was fast.", "The cat chased the mouse. The cat the cat was fast."]
                answer: "The cat chased the mouse. It was fast."
                option_audio: false
                hints: ["Keep the noun once, then use a pronoun."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"Mrs Patel opened the box. ___ smiled.\"\nWhich word fits best?"
                options: ["She", "Her", "It"]
                answer: "She"
              - id: l1-n2
                type: multiple_choice
                text: "\"I lost my gloves. I found my gloves under the bed.\"\nWhich word could replace the second my gloves?"
                options: ["them", "it", "they"]
                answer: "them"
              - id: l1-n3
                type: multiple_choice
                text: "Which is clearest?"
                options: ["Mum and Aunt Jo went shopping. Aunt Jo bought a hat.", "Mum and Aunt Jo went shopping. She bought a hat.", "They went shopping. She bought it."]
                answer: "Mum and Aunt Jo went shopping. Aunt Jo bought a hat."
                option_audio: false
              - id: l1-n4
                type: highlight_in_text
                text: "Tap the pronouns."
                say: "Tap every pronoun in these sentences."
                show: { drawn: letter-card, text: "The bus was late. It broke down and we waited." }
                spans: ["It", "we"]
              - id: l1-n5
                type: multiple_choice
                text: "\"Zak wrote a story. Zak read the story to the class.\"\nWhich is the best way to improve it?"
                options: ["Zak wrote a story. He read it to the class.", "He wrote it. He read it to them.", "Zak wrote a story. Him read it to the class."]
                answer: "Zak wrote a story. He read it to the class."
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"Baby Rosie was tired. ___ fell asleep.\"\nWhich word fits best?"
            options: ["She", "Her", "They"]
            answer: "She"
          - id: l1-c2
            type: multiple_choice
            text: "Which is clearest?"
            options: ["Tom and Ali painted a picture. Ali spilt the paint.", "Tom and Ali painted a picture. He spilt the paint.", "They painted it. He spilt it."]
            answer: "Tom and Ali painted a picture. Ali spilt the paint."
            option_audio: false
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the pronouns."
            say: "Tap every pronoun in these sentences."
            show: { drawn: letter-card, text: "Ella made a card. She gave it to Mum." }
            spans: ["She", "it"]
          - id: l1-c4
            type: multiple_choice
            text: "\"The robots beeped. Then ___ marched away.\"\nWhich word fits best?"
            options: ["they", "them", "it"]
            answer: "they"
          - id: l1-c5
            type: true_false
            text: "\"Ava and Isla ate lunch. She had a sandwich.\"\n\nIs it clear who had the sandwich?"
            answer: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tap the pronouns."
            say: "Tap every pronoun in this sentence."
            show: { drawn: letter-card, text: "I called the cat, but it ran away from me." }
            spans: ["I", "it", "me."]

  - n: 2
    title: { de: Begleiter und Possessivpronomen, en: Determiners and possessive pronouns }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"The dog barked. Then the dog ran off.\"\nWhich word could replace the second the dog?"
            options: ["it", "they", "him"]
            answer: "it"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is clearest?"
            options: ["Jess and Fay played chess. Fay won.", "Jess and Fay played chess. She won.", "They played. She won."]
            answer: "Jess and Fay played chess. Fay won."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "a   an   the   this   that   these   those   some   every\nmy   your   his   her   its   our   their"
            say: "A determiner comes before a noun and tells us which one, whose or how many: a cat, the cat, this cat, those cats, some cats, every cat. My, your, his, her, its, our and their are determiners too: my cat, her cat, their cat."
          - text: "This is my bike. → The bike is mine.\nIs this your coat? → Is this coat yours?"
            say: "My and your are determiners: they come before a noun. Mine and yours are possessive pronouns: they stand on their own, without a noun. My bike, but the bike is mine."
          - text: "mine   yours   his   hers   ours   theirs"
            say: "These are the possessive pronouns. They never have an apostrophe: yours, hers, ours, theirs."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the determiners."
                say: "Tap every determiner in this sentence."
                show: { drawn: letter-card, text: "Those boys took some apples from the tree." }
                spans: ["Those", "some", "the"]
                hints:
                  - "Determiners come just before a noun."
                  - "Look before boys, apples and tree."
                  - "Those, some and the."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "\"That pencil case is ___.\"\nWhich word fits?"
                options: ["mine", "my", "me"]
                answer: "mine"
                feedback:
                  "my": "My needs a noun after it: my pencil case. On its own at the end, use mine."
                hints:
                  - "Is there a noun after the gap?"
                  - "No, so you need a possessive pronoun."
                  - "mine."
              - id: l2-f3
                type: multiple_choice
                text: "\"Is this ___ lunchbox?\"\nWhich word fits?"
                options: ["your", "yours", "you"]
                answer: "your"
                hints:
                  - "Is there a noun after the gap?"
                  - "Yes, lunchbox. So you need a determiner."
                  - "your."
              - id: l2-f4
                type: sorting
                text: "Determiner or possessive pronoun?"
                say: "Sort the words. Is each one a determiner that goes before a noun, or a possessive pronoun that stands alone?"
                option_audio: false
                bins:
                  - { id: det, show: { text: "determiner" }, say: "Determiner." }
                  - { id: poss, show: { text: "possessive pronoun" }, say: "Possessive pronoun." }
                options:
                  - { text: "my", bin: det }
                  - { text: "mine", bin: poss }
                  - { text: "our", bin: det }
                  - { text: "ours", bin: poss }
                hints:
                  - "Can you put a noun straight after it?"
                  - "My bike, our house: yes. Mine bike: no."
                  - "My and our are determiners; mine and ours are possessive pronouns."
              - id: l2-f5
                type: multiple_choice
                text: "\"The red coat is ___.\"\nWhich spelling is right?"
                options: ["hers", "her's", "hers'"]
                answer: "hers"
                option_audio: false
                hints:
                  - "Do possessive pronouns have apostrophes?"
                  - "No, never."
                  - "hers."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap the determiners."
                say: "Tap every determiner in this sentence."
                show: { drawn: letter-card, text: "Every child needs a coat for this trip." }
                spans: ["Every", "a", "this"]
                hints: ["Look just before each noun."]
              - id: l2-s2
                type: multiple_choice
                text: "\"Those seats are ___.\"\nWhich word fits?"
                options: ["ours", "our", "us"]
                answer: "ours"
                hints: ["No noun comes after the gap."]
              - id: l2-s3
                type: multiple_choice
                text: "\"Have you seen ___ football?\"\nWhich word fits?"
                options: ["their", "theirs", "them"]
                answer: "their"
                hints: ["A noun comes after the gap."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["This bag is mine, and that one is yours.", "This bag is my, and that one is your.", "This bag is mine, and that one is your's."]
                answer: "This bag is mine, and that one is yours."
                option_audio: false
                hints: ["Both gaps have no noun after them."]
              - id: l2-s5
                type: multiple_choice
                text: "\"The tent by the river is ___.\"\nWhich spelling is right?"
                options: ["theirs", "their's", "theirs'"]
                answer: "theirs"
                option_audio: false
                hints: ["Possessive pronouns never have an apostrophe."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tap the determiners."
                say: "Tap every determiner in this sentence."
                show: { drawn: letter-card, text: "My sister put these flowers in an old jug." }
                spans: ["My", "these", "an"]
              - id: l2-n2
                type: multiple_choice
                text: "\"The last biscuit is ___.\"\nWhich word fits?"
                options: ["his", "him", "he"]
                answer: "his"
              - id: l2-n3
                type: multiple_choice
                text: "\"We painted ___ fence green.\"\nWhich word fits?"
                options: ["our", "ours", "us"]
                answer: "our"
              - id: l2-n4
                type: sorting
                text: "Determiner or possessive pronoun?"
                say: "Sort the words. Is each one a determiner that goes before a noun, or a possessive pronoun that stands alone?"
                option_audio: false
                bins:
                  - { id: det, show: { text: "determiner" }, say: "Determiner." }
                  - { id: poss, show: { text: "possessive pronoun" }, say: "Possessive pronoun." }
                options:
                  - { text: "your", bin: det }
                  - { text: "yours", bin: poss }
                  - { text: "their", bin: det }
                  - { text: "theirs", bin: poss }
              - id: l2-n5
                type: multiple_choice
                text: "\"Is this umbrella ___?\"\nWhich spelling is right?"
                options: ["yours", "your's", "yours'"]
                answer: "yours"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: pronoun-for-noun
            type: multiple_choice
            text: "\"Ben dropped his phone. Ben picked his phone up.\"\nWhich is the best way to improve it?"
            options: ["Ben dropped his phone. He picked it up.", "He dropped it. He picked it up.", "Ben dropped his phone. Him picked it up."]
            answer: "Ben dropped his phone. He picked it up."
            option_audio: false
          - id: l2-c2
            part: clear
            type: multiple_choice
            text: "Which is clearest?"
            options: ["Maya and Lucy found a key. Lucy opened the door.", "Maya and Lucy found a key. She opened the door.", "They found it. She opened it."]
            answer: "Maya and Lucy found a key. Lucy opened the door."
            option_audio: false
          - id: l2-c3
            part: determiners
            type: highlight_in_text
            text: "Tap the determiners."
            say: "Tap every determiner in this sentence."
            show: { drawn: letter-card, text: "That girl has some sweets in her pocket." }
            spans: ["That", "some", "her"]
          - id: l2-c4
            part: possessive
            type: multiple_choice
            text: "\"Those bikes belong to Sam and Ali. The bikes are ___.\"\nWhich word fits?"
            options: ["theirs", "their", "them"]
            answer: "theirs"
          - id: l2-c5
            part: possessive
            type: multiple_choice
            text: "\"The house with the red door is ___.\"\nWhich spelling is right?"
            options: ["ours", "our's", "ours'"]
            answer: "ours"
            option_audio: false
          - id: l2-c6
            part: pronoun-for-noun
            type: highlight_in_text
            text: "Tap the pronouns."
            say: "Tap every pronoun in these sentences."
            show: { drawn: letter-card, text: "The giant woke up. He looked for us everywhere." }
            spans: ["He", "us"]
          - id: l2-c7
            part: pronoun-for-noun
            type: multiple_choice
            text: "\"Grandma knitted a scarf for me. She gave ___ to me on my birthday.\"\nWhich word fits best?"
            options: ["it", "them", "her"]
            answer: "it"
          - id: l2-c8
            part: pronoun-for-noun
            type: multiple_choice
            text: "\"The puppies were hungry, so we fed ___.\"\nWhich word fits best?"
            options: ["them", "they", "it"]
            answer: "them"
          - id: l2-c9
            part: pronoun-for-noun
            type: true_false
            text: "\"Ollie has a new skateboard. Ollie rides Ollie's skateboard every day.\"\n\nIs it true? Using he and his would make this better."
            answer: true
          - id: l2-c10
            part: clear
            type: true_false
            text: "\"Mum and Gran went to the shop. She bought some milk.\"\n\nIs it clear who bought the milk?"
            answer: false
          - id: l2-c11
            part: clear
            type: multiple_choice
            text: "\"Kit and Josh had a race. ___ won by a metre.\"\nWhich word fits best?"
            options: ["Josh", "He", "Him"]
            answer: "Josh"
          - id: l2-c12
            part: clear
            type: highlight_in_text
            text: "Tap the pronoun that is not clear."
            say: "One pronoun could mean two people. Tap it."
            show: { drawn: letter-card, text: "Lena and Priya went swimming. She swam ten lengths." }
            spans: ["She"]
          - id: l2-c13
            part: clear
            type: true_false
            text: "\"Leo gave Max a present. Max said thank you.\"\n\nIs it clear who said thank you?"
            answer: true
          - id: l2-c14
            part: determiners
            type: highlight_in_text
            text: "Tap the determiners."
            say: "Tap every determiner in this sentence."
            show: { drawn: letter-card, text: "Their cat sleeps on a cushion every afternoon." }
            spans: ["Their", "a", "every"]
          - id: l2-c15
            part: determiners
            type: multiple_choice
            text: "\"Can I have ___ apple, please?\"\nWhich determiner fits?"
            options: ["an", "a", "those"]
            answer: "an"
          - id: l2-c16
            part: determiners
            type: multiple_choice
            text: "\"Those clouds look stormy.\"\nWhich word is a determiner?"
            options: ["Those", "clouds", "stormy"]
            answer: "Those"
          - id: l2-c17
            part: determiners
            type: multiple_choice
            text: "\"I can see ___ birds on the fence.\"\nWhich determiner fits?"
            options: ["some", "a", "an"]
            answer: "some"
          - id: l2-c18
            part: possessive
            type: sorting
            text: "Sort the words: determiner or possessive pronoun?"
            say: "Is each word a determiner that goes before a noun, or a possessive pronoun that stands on its own? Sort them."
            option_audio: false
            bins:
              - { id: det, show: { text: "determiner" }, say: "Determiner." }
              - { id: poss, show: { text: "possessive pronoun" }, say: "Possessive pronoun." }
            options:
              - { text: "her", bin: det }
              - { text: "hers", bin: poss }
              - { text: "its", bin: det }
              - { text: "mine", bin: poss }
          - id: l2-c19
            part: possessive
            type: multiple_choice
            text: "Which sentence is right?"
            options: ["That book is hers.", "That book is her.", "That book is her's."]
            answer: "That book is hers."
            option_audio: false
          - id: l2-c20
            part: possessive
            type: true_false
            text: "\"The blue scarf is your's.\"\n\nIs it written correctly?"
            answer: false
