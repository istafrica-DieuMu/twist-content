# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.dictionary-ks2
skill: lit-en.spelling.dictionary-ks2
curriculum: en-GB
language: en
title:
  de: Im Wörterbuch nachschlagen
  en: Checking spellings in a dictionary
summary: >
  A dictionary lists words in alphabetical order by the first letter, then
  the second, then the third. Lesson 1 orders words by their first two or
  three letters; lesson 2 uses the guide words at the top of a page, opens
  the dictionary in about the right place, and tries another spelling of
  the first sound when a word is not there (ph for f, kn for n), then ends
  with the skill check.
metadata:
  year: year-4
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.spelling.alphabet-names]
  also_practises: [lit-en.spelling.word-list-3-4]
  vocabulary: { en: [dictionary, alphabetical order, first letter, second letter, third letter, guide words, entry, headword] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: order, what: { de: Wörter nach den ersten zwei oder drei Buchstaben ordnen, en: putting words in order by their first two or three letters } }
    - { id: guide-words, what: { de: mit den Leitwörtern die richtige Seite finden, en: using the guide words to find the right page } }
    - { id: open-place, what: { de: das Wörterbuch ungefähr an der richtigen Stelle aufschlagen, en: opening the dictionary in about the right place } }
    - { id: other-spelling, what: { de: eine andere Schreibung für den ersten Laut versuchen, en: trying another spelling of the first sound } }
  misconceptions:
    - id: first-letter-only
      what: Stops at the first letter, so words that share it seem to be in any order (sheep before shark)
      addressed: lesson 1 Learn screens 2 and 3; tasks l1-f1 (feedback), l1-f3, l1-s3, l1-n3, l2-c1
    - id: guide-words-are-only-words
      what: Thinks only the two guide words are on the page, not every word between them
      addressed: lesson 2 Learn screen 1; tasks l2-f1 (feedback), l2-f2, l2-s1, l2-n1, l2-c2
    - id: not-there-means-no-word
      what: Gives up when a word is not where its sound suggests, instead of trying another spelling (fone for phone)
      addressed: lesson 2 Learn screen 3; tasks l2-f4, l2-s4, l2-n4, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zweiter und dritter Buchstabe", en: "Second and third letters" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which letter comes after m in the alphabet?"
            options: ["n", "l", "o"]
            answer: "n"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Put the letters in alphabetical order."
            say: "Put these letters in alphabetical order."
            options: ["t", "d", "p", "h"]
            slot_count: 4
            answer: ["d", "h", "p", "t"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "apple   ball   cat"
            say: "Words in a dictionary are in alphabetical order. Apple, ball and cat start with different letters, so the first letter decides: a, then b, then c."
          - text: "bat   bed   bus\nba   be   bu"
            say: "When words start with the same letter, look at the second letter. Bat, bed, bus all start with b. The second letters are a, e, u, so bat comes first, then bed, then bus."
          - text: "shark   sheep   shop\nsha   she   sho"
            say: "When the first two letters match too, look at the third letter. Shark, sheep and shop all start with sh. The third letters are a, e, o."
          - text: "Compare letter by letter until two letters are different."
            say: "So the rule is: compare letter by letter, from the left, until you find two letters that are different. That letter decides the order."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which word comes first in a dictionary?\nsun   sea   sock"
                options: ["sea", "sock", "sun"]
                answer: "sea"
                feedback:
                  "sun": "They all start with s, so look at the second letter: e, o, u. E comes first, so sea is first."
                hints:
                  - "They all start with s. Which letter do you look at next?"
                  - "The second letters are u, e and o."
                  - "e comes first: sea."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Put the words in dictionary order."
                say: "Put the words in the order you would find them in a dictionary."
                options: ["milk", "mat", "mop"]
                slot_count: 3
                answer: ["mat", "milk", "mop"]
                hints:
                  - "All start with m. Look at the second letter."
                  - "The second letters are i, a and o."
                  - "mat, milk, mop."
              - id: l1-f3
                type: multiple_choice
                text: "Which word comes first in a dictionary?\nchop   chair   cheese"
                options: ["chair", "cheese", "chop"]
                answer: "chair"
                hints:
                  - "The first two letters are the same: ch."
                  - "Look at the third letter: o, a, e."
                  - "a comes first: chair."
              - id: l1-f4
                type: multiple_choice
                text: "Which letter decides the order of plant and play?"
                options: ["the fourth letter", "the second letter", "the first letter"]
                answer: "the fourth letter"
                hints:
                  - "Compare them letter by letter: p, l, a ..."
                  - "pla is the same in both. Then n and y."
                  - "The fourth letter: n comes before y, so plant is first."
              - id: l1-f5
                type: ordering
                text: "Put the words in dictionary order."
                say: "Put the words in the order you would find them in a dictionary."
                options: ["train", "tree", "trick", "trap"]
                slot_count: 4
                answer: ["train", "trap", "tree", "trick"]
                hints:
                  - "They all start with tr. Look at the third letter."
                  - "Train and trap both have a as the third letter, so look at their fourth letters."
                  - "train, trap, tree, trick."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which word comes first in a dictionary?\nfrog   fish   fan"
                options: ["fan", "fish", "frog"]
                answer: "fan"
                hints: ["Look at the second letters: r, i, a."]
              - id: l1-s2
                type: ordering
                text: "Put the words in dictionary order."
                say: "Put the words in the order you would find them in a dictionary."
                options: ["duck", "dog", "desk"]
                slot_count: 3
                answer: ["desk", "dog", "duck"]
                hints: ["Look at the second letter of each word."]
              - id: l1-s3
                type: multiple_choice
                text: "Which word comes last in a dictionary?\nstep   stamp   stick"
                options: ["step", "stamp", "stick"]
                answer: "stick"
                hints: ["They all start with st. Compare the third letters."]
              - id: l1-s4
                type: true_false
                text: "Is it true? In a dictionary, brick comes before bread."
                answer: false
                hints: ["Compare the third letters: i and e."]
              - id: l1-s5
                type: ordering
                text: "Put the words in dictionary order."
                say: "Put the words in the order you would find them in a dictionary."
                options: ["grape", "green", "grass", "grow"]
                slot_count: 4
                answer: ["grape", "grass", "green", "grow"]
                hints: ["Grape and grass share gra, so look at the fourth letter."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which word comes first in a dictionary?\nrope   rain   rest"
                options: ["rain", "rest", "rope"]
                answer: "rain"
              - id: l1-n2
                type: ordering
                text: "Put the words in dictionary order."
                say: "Put the words in the order you would find them in a dictionary."
                options: ["lunch", "lemon", "lake", "light"]
                slot_count: 4
                answer: ["lake", "lemon", "light", "lunch"]
              - id: l1-n3
                type: multiple_choice
                text: "Which word comes first in a dictionary?\nthumb   thin   thank"
                options: ["thank", "thin", "thumb"]
                answer: "thank"
              - id: l1-n4
                type: true_false
                text: "Is it true? In a dictionary, clock comes before cloud."
                answer: true
              - id: l1-n5
                type: ordering
                text: "Put the words in dictionary order."
                say: "Put the words in the order you would find them in a dictionary."
                options: ["spoon", "spider", "spell", "space"]
                slot_count: 4
                answer: ["space", "spell", "spider", "spoon"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which word comes first in a dictionary?\nhill   horse   hat"
            options: ["hat", "hill", "horse"]
            answer: "hat"
          - id: l1-c2
            type: ordering
            text: "Put the words in dictionary order."
            say: "Put the words in the order you would find them in a dictionary."
            options: ["swim", "sand", "slow"]
            slot_count: 3
            answer: ["sand", "slow", "swim"]
          - id: l1-c3
            type: multiple_choice
            text: "Which word comes first in a dictionary?\nblue   black   blink"
            options: ["black", "blue", "blink"]
            answer: "black"
          - id: l1-c4
            type: ordering
            text: "Put the words in dictionary order."
            say: "Put the words in the order you would find them in a dictionary."
            options: ["drum", "dress", "dragon", "drink"]
            slot_count: 4
            answer: ["dragon", "dress", "drink", "drum"]
          - id: l1-c5
            type: multiple_choice
            text: "Which word comes last in a dictionary?\npig   pen   pot"
            options: ["pen", "pig", "pot"]
            answer: "pot"
          - id: l1-c6
            type: true_false
            text: "Is it true? In a dictionary, sleep comes before slide."
            answer: true

  - n: 2
    title: { de: Leitwörter und andere Schreibungen, en: Guide words and other spellings }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which word comes first in a dictionary?\nbook   bag   bike"
            options: ["bag", "bike", "book"]
            answer: "bag"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which word comes first in a dictionary?\nstorm   stair   stick"
            options: ["stair", "stick", "storm"]
            answer: "stair"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Guide words: hammer ... hedge"
            say: "At the top of each dictionary page are two guide words. The first is the first word on the page; the second is the last. Every word in between is on that page too: hand, happy, heart."
          - text: "a b c d e f g | h i j k l m n o | p q r s t u v w x y z\nfront            middle               back"
            say: "Open the dictionary in about the right place. Words starting with a to g are near the front, h to o in the middle, p to z near the back."
          - text: "fone? → not under fo\nphone → under ph"
            say: "To check a spelling, look up the first two or three letters. If the word is not there, think of another way to spell the first sound. The f sound can be ph, so try ph: phone."
          - text: "n → kn: knee, knife\nr → wr: write, wrong\ns → c: city, circle"
            say: "Other first sounds with more than one spelling: n can be kn, r can be wr, and s can be c."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "The guide words on a page are: dance ... dinner\nIs the word desk on this page?"
                answer: true
                feedback:
                  "false": "Every word between the guide words is on the page. Desk comes after dance and before dinner."
                hints:
                  - "Does desk come after dance?"
                  - "Compare second letters: a, e, i."
                  - "Yes. Desk is between dance and dinner."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The guide words on a page are: sail ... seed\nWhich word is on this page?"
                options: ["school", "sock", "sheep"]
                answer: "school"
                hints:
                  - "Look at the second letters of the guide words: a and e."
                  - "School has c as its second letter. C is between a and e."
                  - "school."
              - id: l2-f3
                type: multiple_choice
                text: "Where would you open the dictionary to find window?"
                options: ["near the front", "in the middle", "near the back"]
                answer: "near the back"
                keep_order: true
                hints:
                  - "Window starts with w."
                  - "W is near the end of the alphabet."
                  - "Near the back."
              - id: l2-f4
                type: multiple_choice
                text: "Ali wants to spell the word for the joint in the middle of your leg. He looks for nee and cannot find it. Which letters should he try at the start?"
                options: ["kn", "nn", "ng"]
                answer: "kn"
                hints:
                  - "Which other letters can spell the n sound at the start?"
                  - "Think of knife and knock."
                  - "kn."
              - id: l2-f5
                type: multiple_choice
                text: "You want to check how to spell rhinoceros. What do you look up first?"
                options: ["the first two or three letters", "the last letter", "the longest part"]
                answer: "the first two or three letters"
                hints:
                  - "Dictionaries are in order from the start of the word."
                  - "Look for r, then h, then i."
                  - "The first two or three letters."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "The guide words on a page are: gate ... giraffe\nIs the word goat on this page?"
                answer: false
                hints: ["Goat has o as its second letter. Is o between a and i?"]
              - id: l2-s2
                type: multiple_choice
                text: "The guide words on a page are: carrot ... cloud\nWhich word is on this page?"
                options: ["chicken", "cow", "cake"]
                answer: "chicken"
                hints: ["Compare the second letters: a, h, l."]
              - id: l2-s3
                type: multiple_choice
                text: "Where would you open the dictionary to find banana?"
                options: ["near the front", "in the middle", "near the back"]
                answer: "near the front"
                keep_order: true
                hints: ["B is the second letter of the alphabet."]
              - id: l2-s4
                type: multiple_choice
                text: "Mia wants to spell the word that means \"not right\". She looks for rong and cannot find it. Which letters should she try at the start?"
                options: ["wr", "rr", "ur"]
                answer: "wr"
                hints: ["Think of write and wrist."]
              - id: l2-s5
                type: multiple_choice
                text: "The guide words on a page are: lemon ... lizard\nOn which page is light?"
                options: ["an earlier page", "this page", "a later page"]
                answer: "this page"
                keep_order: true
                hints: ["Light starts with li. Lizard starts with li too, so look at the third letters."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "The guide words on a page are: picnic ... pond\nIs the word plum on this page?"
                answer: true
              - id: l2-n2
                type: multiple_choice
                text: "The guide words on a page are: tail ... tent\nWhich word is on this page?"
                options: ["teeth", "tiger", "toast"]
                answer: "teeth"
              - id: l2-n3
                type: multiple_choice
                text: "Where would you open the dictionary to find magnet?"
                options: ["near the front", "in the middle", "near the back"]
                answer: "in the middle"
                keep_order: true
              - id: l2-n4
                type: multiple_choice
                text: "Jo wants to spell the word for a picture taken with a camera. She looks for fotograf and cannot find it. Which letters should she try at the start?"
                options: ["ph", "ff", "gh"]
                answer: "ph"
              - id: l2-n5
                type: multiple_choice
                text: "The guide words on a page are: mask ... meal\nOn which page is mouse?"
                options: ["an earlier page", "this page", "a later page"]
                answer: "a later page"
                keep_order: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: order
            type: ordering
            text: "Put the words in dictionary order."
            say: "Put the words in the order you would find them in a dictionary."
            options: ["crown", "crab", "crisp", "cream"]
            slot_count: 4
            answer: ["crab", "cream", "crisp", "crown"]
          - id: l2-c2
            part: guide-words
            type: true_false
            text: "The guide words on a page are: rabbit ... river\nIs the word rocket on this page?"
            answer: false
          - id: l2-c3
            part: order
            type: multiple_choice
            text: "Which word comes first in a dictionary?\nwheel   whale   whisper"
            options: ["whale", "wheel", "whisper"]
            answer: "whale"
          - id: l2-c4
            part: other-spelling
            type: multiple_choice
            text: "Sam wants to spell the word for a round, flat shape. He looks for sircle and cannot find it. Which letter should he try at the start?"
            options: ["c", "z", "x"]
            answer: "c"
            option_audio: false
          - id: l2-c5
            part: open-place
            type: multiple_choice
            text: "Which word would you find near the front of the dictionary?"
            options: ["carrot", "rocket", "tiger"]
            answer: "carrot"
          - id: l2-c6
            part: order
            type: ordering
            text: "Put the words in dictionary order."
            say: "Put the words in the order you would find them in a dictionary."
            options: ["glue", "glitter", "glass", "glove"]
            slot_count: 4
            answer: ["glass", "glitter", "glove", "glue"]
          - id: l2-c7
            part: order
            type: multiple_choice
            text: "Which letter decides the order of trumpet and tractor?"
            options: ["the third letter", "the second letter", "the first letter"]
            answer: "the third letter"
          - id: l2-c8
            part: order
            type: true_false
            text: "Is it true? In a dictionary, shell comes before shadow."
            answer: false
          - id: l2-c9
            part: guide-words
            type: multiple_choice
            text: "The guide words on a page are: frog ... fudge\nWhich word is on this page?"
            options: ["fruit", "flame", "fairy"]
            answer: "fruit"
          - id: l2-c10
            part: guide-words
            type: multiple_choice
            text: "The guide words on a page are: night ... nurse\nOn which page is nest?"
            options: ["an earlier page", "this page", "a later page"]
            answer: "an earlier page"
            keep_order: true
          - id: l2-c11
            part: guide-words
            type: true_false
            text: "The guide words on a page are: bake ... bell\nIs the word beach on this page?"
            answer: true
          - id: l2-c12
            part: guide-words
            type: multiple_choice
            text: "The guide words on a page are: pencil ... pirate\nWhich word is not on this page?"
            options: ["parrot", "piano", "pepper"]
            answer: "parrot"
          - id: l2-c13
            part: open-place
            type: true_false
            text: "Is it true? To find kangaroo, open the dictionary near the back."
            answer: false
          - id: l2-c14
            part: open-place
            type: multiple_choice
            text: "You open the dictionary in the middle and land on words that start with m. You want to find tortoise. Which way do you turn the pages?"
            options: ["towards the back", "towards the front"]
            answer: "towards the back"
            keep_order: true
          - id: l2-c15
            part: open-place
            type: multiple_choice
            text: "Which word would you find in the middle of the dictionary?"
            options: ["lemon", "apple", "zebra"]
            answer: "lemon"
          - id: l2-c16
            part: open-place
            type: true_false
            text: "Is it true? Juice and lemon are both in the middle part of the dictionary."
            answer: true
          - id: l2-c17
            part: other-spelling
            type: multiple_choice
            text: "Ella wants to spell the word for the part of your arm where you wear a watch. She cannot find rist in the dictionary. Which spelling should she look up next?"
            options: ["wrist", "rrist", "ryst"]
            answer: "wrist"
            option_audio: false
          - id: l2-c18
            part: other-spelling
            type: multiple_choice
            text: "Ben wants to spell the word for what you tie in a piece of string. Under not he finds a different word. Which spelling should he look up next?"
            options: ["knot", "nott", "nnot"]
            answer: "knot"
            option_audio: false
          - id: l2-c19
            part: other-spelling
            type: true_false
            text: "Priya wants to spell the name of a big bird with a long tail. She looks for fesant and cannot find it. Is it a good idea to look under ph next?"
            answer: true
          - id: l2-c20
            part: other-spelling
            type: multiple_choice
            text: "Max wants to spell the word for the middle of something. He looks under se and cannot find it. Where should he look next?"
            options: ["under ce", "under ze", "under sse"]
            answer: "under ce"
            option_audio: false
