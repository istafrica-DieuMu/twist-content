# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.expanded-noun-phrases
skill: lit-en.grammar.expanded-noun-phrases
curriculum: en-GB
language: en
title:
  de: Erweiterte Nominalgruppen
  en: Expanded noun phrases
summary: >
  A noun phrase is built around one main noun (teacher). It can be
  expanded before the noun with adjectives and other nouns (the strict
  maths teacher) and after it with a prepositional phrase (with curly
  hair). Lesson 1 finds the main noun and adds adjectives and nouns in
  front of it; lesson 2 adds prepositional phrases, builds whole expanded
  noun phrases and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.noun-phrases]
  also_practises: [lit-en.composition.evaluate-improve]
  vocabulary: { en: [noun, noun phrase, expanded noun phrase, main noun, adjective, determiner, preposition, prepositional phrase] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: main-noun, what: { de: das Hauptnomen einer Nominalgruppe finden, en: finding the main noun of a noun phrase } }
    - { id: before-noun, what: { de: mit Adjektiven und Nomen vor dem Hauptnomen erweitern, en: expanding before the noun with adjectives and nouns } }
    - { id: after-noun, what: { de: mit einer Präpositionalgruppe nach dem Hauptnomen erweitern, en: expanding after the noun with a prepositional phrase } }
    - { id: build-use, what: { de: "erweiterte Nominalgruppen bauen, die etwas Neues sagen, und im Satz verwenden", en: "building expanded noun phrases that add detail, and using them in a sentence" } }
  misconceptions:
    - id: first-noun-is-main
      what: Takes the first noun as the main noun (maths in the strict maths teacher, hair in the teacher with curly hair)
      addressed: lesson 1 Learn screen 2; tasks l1-f2 (feedback), l1-s2, l1-n2, l2-f3, l2-c2
    - id: phrase-is-sentence
      what: Thinks an expanded noun phrase is a full sentence and adds a full stop and capital (The old dog with a red collar.)
      addressed: lesson 2 Learn screen 3; tasks l2-f4, l2-s4, l2-n4
    - id: more-adjectives-better
      what: Piles up adjectives that say the same thing (the big huge large dog)
      addressed: tasks l1-f4 (feedback), l1-s4, l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Vor dem Nomen, en: Before the noun }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is a noun phrase that describes?"
            options: ["the blue butterfly", "flew away", "very quickly"]
            answer: "the blue butterfly"
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tap the adjective."
            say: "Tap the adjective in this noun phrase."
            show: { drawn: letter-card, text: "a muddy puppy" }
            spans: ["muddy"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "teacher\nthe teacher\nthe strict teacher\nthe strict maths teacher"
            say: "A noun phrase is a group of words built around one main noun. Here the main noun is teacher. We can add a determiner, the; an adjective, strict; and even another noun, maths, that tells us what kind of teacher."
          - text: "the strict maths teacher\nmain noun: teacher"
            say: "Maths is a noun too, but it is not the main noun. It just tells us what kind of teacher. To find the main noun, ask: what is the whole phrase about? A teacher."
          - text: "the shiny red racing car"
            say: "Here: the is a determiner, shiny and red are adjectives, racing tells us what kind of car, and car is the main noun."
          - text: "not: the big huge enormous dog\nbetter: the shaggy black sheepdog"
            say: "Choose words that each add something new. Big, huge and enormous all say the same thing. Shaggy and black give two different details."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which word could go in the gap to expand the noun phrase?\nthe ___ kitten"
                options: ["fluffy", "quickly", "jumped"]
                answer: "fluffy"
                hints:
                  - "Which word describes a kitten?"
                  - "You need an adjective."
                  - "fluffy."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the main noun."
                say: "Tap the main noun in this noun phrase."
                show: { drawn: letter-card, text: "the old garden shed" }
                spans: ["shed"]
                hints:
                  - "What is the phrase about?"
                  - "Garden tells you what kind."
                  - "shed."
              - id: l1-f3
                type: sorting
                text: "Sort the words from the noun phrase.\nthe tiny silver birthday cake"
                say: "Sort the words from the noun phrase: the tiny silver birthday cake."
                option_audio: false
                bins:
                  - { id: adjective, show: { text: "adjective" }, say: "Adjective." }
                  - { id: noun, show: { text: "noun" }, say: "Noun." }
                options:
                  - { text: "tiny", bin: adjective }
                  - { text: "silver", bin: adjective }
                  - { text: "birthday", bin: noun }
                  - { text: "cake", bin: noun }
                hints:
                  - "Adjectives describe; nouns name."
                  - "Birthday is a noun: it names a special day."
                  - "Tiny and silver are adjectives; birthday and cake are nouns."
              - id: l1-f4
                type: multiple_choice
                text: "Which expanded noun phrase gives the most detail?"
                options: ["the rusty old bike", "the big large bike", "the bike bike"]
                answer: "the rusty old bike"
                option_audio: false
                feedback:
                  "the big large bike": "Big and large mean the same, so the second word adds nothing. Choose words that each add a detail."
                hints:
                  - "Do the two describing words say different things?"
                  - "Big and large mean the same."
                  - "the rusty old bike."
              - id: l1-f5
                type: ordering
                text: "Build the expanded noun phrase."
                say: "Put the words in order to build an expanded noun phrase."
                options: ["football", "the", "muddy", "boots"]
                slot_count: 4
                answer: ["the", "muddy", "football", "boots"]
                option_audio: false
                hints:
                  - "Start with the determiner."
                  - "The main noun comes last."
                  - "the muddy football boots."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which word could go in the gap?\na ___ storm"
                options: ["fierce", "softly", "ran"]
                answer: "fierce"
                hints: ["You need a word that describes a storm."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tap the main noun."
                say: "Tap the main noun in this noun phrase."
                show: { drawn: letter-card, text: "a heavy school bag" }
                spans: ["bag"]
                hints: ["School tells you what kind."]
              - id: l1-s3
                type: sorting
                text: "Sort the words from the noun phrase.\nthe friendly bus driver"
                say: "Sort the words from the noun phrase: the friendly bus driver."
                option_audio: false
                bins:
                  - { id: adjective, show: { text: "adjective" }, say: "Adjective." }
                  - { id: noun, show: { text: "noun" }, say: "Noun." }
                options:
                  - { text: "friendly", bin: adjective }
                  - { text: "bus", bin: noun }
                  - { text: "driver", bin: noun }
                hints: ["Bus names a thing."]
              - id: l1-s4
                type: multiple_choice
                text: "Which expanded noun phrase gives the most detail?"
                options: ["a cold, frosty morning", "a cold chilly morning", "a morning morning"]
                answer: "a cold, frosty morning"
                option_audio: false
                hints: ["Cold and chilly mean the same."]
              - id: l1-s5
                type: ordering
                text: "Build the expanded noun phrase."
                say: "Put the words in order to build an expanded noun phrase."
                options: ["cake", "an", "chocolate", "enormous"]
                slot_count: 4
                answer: ["an", "enormous", "chocolate", "cake"]
                option_audio: false
                hints: ["Determiner first, main noun last."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which word could go in the gap?\nthe ___ giant"
                options: ["grumpy", "slowly", "shouted"]
                answer: "grumpy"
              - id: l1-n2
                type: highlight_in_text
                text: "Tap the main noun."
                say: "Tap the main noun in this noun phrase."
                show: { drawn: letter-card, text: "the noisy village fair" }
                spans: ["fair"]
              - id: l1-n3
                type: sorting
                text: "Sort the words from the noun phrase.\na bright orange beach ball"
                say: "Sort the words from the noun phrase: a bright orange beach ball."
                option_audio: false
                bins:
                  - { id: adjective, show: { text: "adjective" }, say: "Adjective." }
                  - { id: noun, show: { text: "noun" }, say: "Noun." }
                options:
                  - { text: "bright", bin: adjective }
                  - { text: "orange", bin: adjective }
                  - { text: "beach", bin: noun }
                  - { text: "ball", bin: noun }
              - id: l1-n4
                type: multiple_choice
                text: "Which expanded noun phrase gives the most detail?"
                options: ["the creaky wooden door", "the door door", "the big large door"]
                answer: "the creaky wooden door"
                option_audio: false
              - id: l1-n5
                type: ordering
                text: "Build the expanded noun phrase."
                say: "Put the words in order to build an expanded noun phrase."
                options: ["teacher", "the", "music", "cheerful"]
                slot_count: 4
                answer: ["the", "cheerful", "music", "teacher"]
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the main noun."
            say: "Tap the main noun in this noun phrase."
            show: { drawn: letter-card, text: "the long train journey" }
            spans: ["journey"]
          - id: l1-c2
            type: multiple_choice
            text: "Which word could go in the gap?\nthe ___ forest"
            options: ["dark", "darkly", "walked"]
            answer: "dark"
          - id: l1-c3
            type: ordering
            text: "Build the expanded noun phrase."
            say: "Put the words in order to build an expanded noun phrase."
            options: ["jacket", "a", "rain", "yellow"]
            slot_count: 4
            answer: ["a", "yellow", "rain", "jacket"]
            option_audio: false
          - id: l1-c4
            type: sorting
            text: "Sort the words from the noun phrase.\nthe soft woolly winter hat"
            say: "Sort the words from the noun phrase: the soft woolly winter hat."
            option_audio: false
            bins:
              - { id: adjective, show: { text: "adjective" }, say: "Adjective." }
              - { id: noun, show: { text: "noun" }, say: "Noun." }
            options:
              - { text: "soft", bin: adjective }
              - { text: "woolly", bin: adjective }
              - { text: "winter", bin: noun }
              - { text: "hat", bin: noun }
          - id: l1-c5
            type: multiple_choice
            text: "Which word could go in the gap?\na ___ dinosaur"
            options: ["scaly", "roared", "loudly"]
            answer: "scaly"
          - id: l1-c6
            type: highlight_in_text
            text: "Tap the main noun."
            say: "Tap the main noun in this noun phrase."
            show: { drawn: letter-card, text: "a small plastic toy boat" }
            spans: ["boat"]

  - n: 2
    title: { de: Nach dem Nomen, en: After the noun }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the main noun."
            say: "Tap the main noun in this noun phrase."
            show: { drawn: letter-card, text: "the shiny fire engine" }
            spans: ["engine"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which word could go in the gap?\na ___ owl"
            options: ["wise", "wisely", "hooted"]
            answer: "wise"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "the strict maths teacher with curly hair"
            say: "We can also add words after the main noun. With curly hair tells us more about the teacher. It starts with a preposition, with, so it is called a prepositional phrase."
          - text: "with   in   on   under   behind   near   from   by   of"
            say: "Prepositions often tell us where something is, what it has or what it holds: the cat on the wall, the house by the sea, a girl with a red umbrella, a cup of tea."
          - text: "the old dog with a red collar\nThe old dog with a red collar barked at the postman."
            say: "An expanded noun phrase is not a sentence on its own: nothing happens in it. Put it in a sentence with a verb, like barked, to make a full sentence."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap the prepositional phrase."
                say: "Tap every word of the prepositional phrase that comes after the main noun."
                show: { drawn: letter-card, text: "the tall boy with spiky hair" }
                spans: ["with", "spiky", "hair"]
                hints:
                  - "Find the preposition after the main noun."
                  - "It is with."
                  - "with spiky hair."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which prepositional phrase could expand the noun phrase?\nthe little cottage ___"
                options: ["by the river", "ran quickly", "very small"]
                answer: "by the river"
                hints:
                  - "A prepositional phrase starts with a word like by, in or with."
                  - "Which one tells you where the cottage is?"
                  - "by the river."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the main noun."
                say: "Tap the main noun in this noun phrase."
                show: { drawn: letter-card, text: "the girl with the purple scarf" }
                spans: ["girl"]
                hints:
                  - "What is the whole phrase about?"
                  - "Scarf comes after with: it tells you about her."
                  - "girl."
              - id: l2-f4
                type: multiple_choice
                text: "Which is a full sentence?"
                options: ["The hungry fox by the bins sniffed the air.", "The hungry fox by the bins.", "the hungry fox by the bins"]
                answer: "The hungry fox by the bins sniffed the air."
                option_audio: false
                hints:
                  - "A sentence needs something to happen."
                  - "Look for a verb."
                  - "The hungry fox by the bins sniffed the air."
              - id: l2-f5
                type: ordering
                text: "Build the expanded noun phrase."
                say: "Put the parts in order to build an expanded noun phrase."
                options: ["with a long tail", "the", "kite", "red"]
                slot_count: 4
                answer: ["the", "red", "kite", "with a long tail"]
                option_audio: false
                hints:
                  - "Determiner and adjective come before the main noun."
                  - "The prepositional phrase comes after it."
                  - "the red kite with a long tail."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap the prepositional phrase."
                say: "Tap every word of the prepositional phrase that comes after the main noun."
                show: { drawn: letter-card, text: "a wooden box under the bed" }
                spans: ["under", "the", "bed"]
                hints: ["Find the preposition after box."]
              - id: l2-s2
                type: multiple_choice
                text: "Which prepositional phrase could expand the noun phrase?\nthe old man ___"
                options: ["with a walking stick", "walked slowly", "very old"]
                answer: "with a walking stick"
                hints: ["Which one starts with a preposition?"]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the main noun."
                say: "Tap the main noun in this noun phrase."
                show: { drawn: letter-card, text: "a bowl of hot soup" }
                spans: ["bowl"]
                hints: ["Is it a bowl, or soup?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which is a full sentence?"
                options: ["The bright lamp on the desk flickered.", "The bright lamp on the desk.", "the bright lamp on the desk"]
                answer: "The bright lamp on the desk flickered."
                option_audio: false
                hints: ["Which one has a verb?"]
              - id: l2-s5
                type: ordering
                text: "Build the expanded noun phrase."
                say: "Put the parts in order to build an expanded noun phrase."
                options: ["in the garden", "pond", "a", "small"]
                slot_count: 4
                answer: ["a", "small", "pond", "in the garden"]
                option_audio: false
                hints: ["The prepositional phrase goes after the main noun."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tap the prepositional phrase."
                say: "Tap every word of the prepositional phrase that comes after the main noun."
                show: { drawn: letter-card, text: "the busy café near the station" }
                spans: ["near", "the", "station"]
              - id: l2-n2
                type: multiple_choice
                text: "Which prepositional phrase could expand the noun phrase?\na tiny spider ___"
                options: ["in the corner", "crawled up", "quite small"]
                answer: "in the corner"
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the main noun."
                say: "Tap the main noun in this noun phrase."
                show: { drawn: letter-card, text: "the photo of my grandad" }
                spans: ["photo"]
              - id: l2-n4
                type: multiple_choice
                text: "Which is a full sentence?"
                options: ["The fluffy cat on the windowsill yawned.", "The fluffy cat on the windowsill.", "the fluffy cat on the windowsill"]
                answer: "The fluffy cat on the windowsill yawned."
                option_audio: false
              - id: l2-n5
                type: ordering
                text: "Build the expanded noun phrase."
                say: "Put the parts in order to build an expanded noun phrase."
                options: ["with gold buttons", "coat", "the", "smart", "army"]
                slot_count: 5
                answer: ["the", "smart", "army", "coat", "with gold buttons"]
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: build-use
            type: multiple_choice
            text: "Which is an expanded noun phrase?"
            options: ["the fierce dragon with green scales", "the dragon roared", "roared loudly"]
            answer: "the fierce dragon with green scales"
          - id: l2-c2
            part: main-noun
            type: highlight_in_text
            text: "Tap the main noun."
            say: "Tap the main noun in this noun phrase."
            show: { drawn: letter-card, text: "the clever science teacher with round glasses" }
            spans: ["teacher"]
          - id: l2-c3
            part: after-noun
            type: highlight_in_text
            text: "Tap the prepositional phrase."
            say: "Tap every word of the prepositional phrase that comes after the main noun."
            show: { drawn: letter-card, text: "a basket of ripe apples" }
            spans: ["of", "ripe", "apples"]
          - id: l2-c4
            part: build-use
            type: ordering
            text: "Build the expanded noun phrase."
            say: "Put the parts in order to build an expanded noun phrase."
            options: ["behind the shed", "bike", "an", "old", "mountain"]
            slot_count: 5
            answer: ["an", "old", "mountain", "bike", "behind the shed"]
            option_audio: false
          - id: l2-c5
            part: build-use
            type: multiple_choice
            text: "Which expanded noun phrase gives the most detail?"
            options: ["the narrow, winding path", "the long lengthy path", "the path path"]
            answer: "the narrow, winding path"
            option_audio: false
          - id: l2-c6
            part: main-noun
            type: highlight_in_text
            text: "Tap the main noun."
            say: "Tap the main noun in this noun phrase."
            show: { drawn: letter-card, text: "the bright kitchen window" }
            spans: ["window"]
          - id: l2-c7
            part: main-noun
            type: highlight_in_text
            text: "Tap the main noun."
            say: "Tap the main noun in this noun phrase."
            show: { drawn: letter-card, text: "a jar of strawberry jam" }
            spans: ["jar"]
          - id: l2-c8
            part: main-noun
            type: multiple_choice
            text: "What is the main noun in this noun phrase?\nthe noisy football fans on the train"
            options: ["fans", "football", "train"]
            answer: "fans"
          - id: l2-c9
            part: main-noun
            type: multiple_choice
            text: "What is the whole noun phrase about?\nthe girl in the school play"
            options: ["a girl", "a school", "a play"]
            answer: "a girl"
          - id: l2-c10
            part: before-noun
            type: multiple_choice
            text: "Which word could go in the gap to expand the noun phrase?\nthe ___ castle"
            options: ["ancient", "quickly", "climbed"]
            answer: "ancient"
          - id: l2-c11
            part: before-noun
            type: sorting
            text: "Sort the words from the noun phrase.\na shiny new tennis racket"
            say: "Sort the words from the noun phrase: a shiny new tennis racket."
            option_audio: false
            bins:
              - { id: adjective, show: { text: "adjective" }, say: "Adjective." }
              - { id: noun, show: { text: "noun" }, say: "Noun." }
            options:
              - { text: "shiny", bin: adjective }
              - { text: "new", bin: adjective }
              - { text: "tennis", bin: noun }
              - { text: "racket", bin: noun }
          - id: l2-c12
            part: before-noun
            type: multiple_choice
            text: "the long winter night\n\nWhich word is a noun that tells us what kind of night?"
            options: ["winter", "long", "the"]
            answer: "winter"
          - id: l2-c13
            part: before-noun
            type: ordering
            text: "Build the expanded noun phrase."
            say: "Put the words in order to build an expanded noun phrase."
            options: ["shoes", "the", "dancing", "sparkly"]
            slot_count: 4
            answer: ["the", "sparkly", "dancing", "shoes"]
            option_audio: false
          - id: l2-c14
            part: before-noun
            type: highlight_in_text
            text: "Tap the adjectives."
            say: "Tap every adjective in this noun phrase."
            show: { drawn: letter-card, text: "the tall, thin lighthouse keeper" }
            spans: ["tall", "thin"]
          - id: l2-c15
            part: after-noun
            type: highlight_in_text
            text: "Tap the prepositional phrase."
            say: "Tap every word of the prepositional phrase that comes after the main noun."
            show: { drawn: letter-card, text: "the old lady with a tiny dog" }
            spans: ["with", "a", "tiny", "dog"]
          - id: l2-c16
            part: after-noun
            type: multiple_choice
            text: "Which prepositional phrase could expand the noun phrase?\nthe red balloon ___"
            options: ["above the trees", "floated away", "very red"]
            answer: "above the trees"
          - id: l2-c17
            part: after-noun
            type: multiple_choice
            text: "Which word is the preposition in this noun phrase?\nthe sandcastle near the waves"
            options: ["near", "sandcastle", "waves"]
            answer: "near"
          - id: l2-c18
            part: after-noun
            type: ordering
            text: "Build the expanded noun phrase."
            say: "Put the parts in order to build an expanded noun phrase."
            options: ["the", "in the window", "cat", "ginger"]
            slot_count: 4
            answer: ["the", "ginger", "cat", "in the window"]
            option_audio: false
          - id: l2-c19
            part: build-use
            type: multiple_choice
            text: "Which sentence uses an expanded noun phrase?"
            options: ["The boy with muddy knees grinned.", "The boy grinned.", "He grinned at me."]
            answer: "The boy with muddy knees grinned."
            option_audio: false
          - id: l2-c20
            part: build-use
            type: highlight_in_text
            text: "Tap every word of the expanded noun phrase."
            say: "Read the sentence. Tap every word of the expanded noun phrase."
            show: { drawn: letter-card, text: "Yesterday the tall man with a beard waved." }
            spans: ["the", "tall", "man", "with", "a", "beard"]
