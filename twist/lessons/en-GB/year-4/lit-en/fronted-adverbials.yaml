# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.fronted-adverbials
skill: lit-en.grammar.fronted-adverbials
curriculum: en-GB
language: en
title:
  de: Vorangestellte Adverbiale mit Komma
  en: Fronted adverbials and the comma
summary: >
  An adverbial tells us when, where or how something happens. When it
  comes at the front of the sentence, before the main verb, it is a
  fronted adverbial and is followed by a comma (Later that day, I heard
  the news.). Lesson 1 spots fronted adverbials and says whether they
  tell when, where or how; lesson 2 places the comma, moves adverbials to
  the front and chooses one that fits, then ends with the skill check.
metadata:
  year: year-4
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.time-cause]
  also_practises: [lit-en.composition.evaluate-improve]
  vocabulary: { en: [adverb, adverbial, fronted adverbial, comma, main clause, when, where, how] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: comma-in-wrong-place
      what: Puts the comma inside the adverbial or after the subject (Later, that day I heard; Later that day I, heard)
      addressed: lesson 2 Learn screen 1; tasks l2-f1 (feedback), l2-f2, l2-s1, l2-n1, l2-c2
    - id: adverbial-is-one-word
      what: Thinks an adverbial is always one adverb, so misses phrases like After lunch or Under the bridge
      addressed: lesson 1 Learn screen 2; tasks l1-f2 (feedback), l1-f4, l1-s4, l1-n4, l2-c1
    - id: no-comma
      what: Leaves the comma out after a fronted adverbial
      addressed: tasks l1-f5, l1-s5, l2-f2, l2-n2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wann, wo und wie", en: "When, where and how" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which word tells you when?\nWe played outside after lunch."
            options: ["after", "outside", "played"]
            answer: "after"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word fits the gap?\nIt was raining, ___ we stayed in."
            options: ["so", "because", "before"]
            answer: "so"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I heard the news later that day.\nLater that day, I heard the news."
            say: "Later that day tells us when. It is an adverbial. If we move it to the front of the sentence, it becomes a fronted adverbial, and we put a comma after it."
          - text: "Suddenly,   After lunch,   Under the old bridge,   As quick as a flash,"
            say: "A fronted adverbial can be one word, like suddenly, or a group of words, like after lunch or under the old bridge."
          - text: "When: Last night,   Where: In the garden,   How: Slowly,"
            say: "Fronted adverbials tell us when, where or how something happened. Last night is when. In the garden is where. Slowly is how."
          - text: "Fronted adverbial + comma + the rest of the sentence"
            say: "The pattern is always the same: the fronted adverbial, then a comma, then the rest of the sentence, which still makes sense on its own."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the fronted adverbial."
                say: "Tap every word of the fronted adverbial."
                show: { drawn: letter-card, text: "Before breakfast, Tom fed the rabbits." }
                spans: ["Before", "breakfast,"]
                hints:
                  - "Look at the start of the sentence."
                  - "It ends where the comma is."
                  - "Before breakfast."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"Under the old bridge, a troll was waiting.\"\nWhat is the fronted adverbial?"
                options: ["Under the old bridge", "Under", "a troll"]
                answer: "Under the old bridge"
                feedback:
                  "Under": "A fronted adverbial can be several words. Read up to the comma: Under the old bridge."
                hints:
                  - "Read from the start up to the comma."
                  - "It can be more than one word."
                  - "Under the old bridge."
              - id: l1-f3
                type: multiple_choice
                text: "\"Last night, we watched the fireworks.\"\nWhat does the fronted adverbial tell you?"
                options: ["when", "where", "how"]
                answer: "when"
                keep_order: true
                hints:
                  - "Ask: when, where or how?"
                  - "Last night is a time."
                  - "when."
              - id: l1-f4
                type: sorting
                text: "When, where or how?"
                say: "Sort the fronted adverbials. Do they tell you when, where or how?"
                option_audio: false
                bins:
                  - { id: when, show: { text: "when" }, say: "When." }
                  - { id: where, show: { text: "where" }, say: "Where." }
                  - { id: how, show: { text: "how" }, say: "How." }
                options:
                  - { text: "On Saturday,", bin: when }
                  - { text: "In the playground,", bin: where }
                  - { text: "Very carefully,", bin: how }
                hints:
                  - "A day is a time."
                  - "A place tells you where."
                  - "On Saturday: when; In the playground: where; Very carefully: how."
              - id: l1-f5
                type: true_false
                text: "\"Slowly, the snail climbed the wall.\"\n\nIs it true? There should be a comma after Slowly."
                answer: true
                hints:
                  - "Is Slowly at the front of the sentence?"
                  - "A fronted adverbial is followed by a comma."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the fronted adverbial."
                say: "Tap every word of the fronted adverbial."
                show: { drawn: letter-card, text: "In the deep dark wood, an owl hooted." }
                spans: ["In", "the", "deep", "dark", "wood,"]
                hints: ["Read up to the comma."]
              - id: l1-s2
                type: multiple_choice
                text: "\"Silently, the cat crept along the fence.\"\nWhat does the fronted adverbial tell you?"
                options: ["when", "where", "how"]
                answer: "how"
                keep_order: true
                hints: ["Silently tells you the way it crept."]
              - id: l1-s3
                type: multiple_choice
                text: "Which sentence starts with a fronted adverbial?"
                options: ["After school, we went swimming.", "We went swimming after school.", "We went swimming."]
                answer: "After school, we went swimming."
                option_audio: false
                hints: ["Which one starts by telling you when, before the main part of the sentence?"]
              - id: l1-s4
                type: sorting
                text: "When, where or how?"
                say: "Sort the fronted adverbials. Do they tell you when, where or how?"
                option_audio: false
                bins:
                  - { id: when, show: { text: "when" }, say: "When." }
                  - { id: where, show: { text: "where" }, say: "Where." }
                  - { id: how, show: { text: "how" }, say: "How." }
                options:
                  - { text: "At midnight,", bin: when }
                  - { text: "Behind the sofa,", bin: where }
                  - { text: "As fast as she could,", bin: how }
                hints: ["Ask the question of each one."]
              - id: l1-s5
                type: true_false
                text: "\"The next morning the ground was white.\"\n\nIs it true? This sentence has all the commas it needs."
                answer: false
                hints: ["Is there a fronted adverbial? What does it need?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the fronted adverbial."
                say: "Tap every word of the fronted adverbial."
                show: { drawn: letter-card, text: "Without a sound, the thief slipped away." }
                spans: ["Without", "a", "sound,"]
              - id: l1-n2
                type: multiple_choice
                text: "\"Across the field, the horses galloped.\"\nWhat does the fronted adverbial tell you?"
                options: ["when", "where", "how"]
                answer: "where"
                keep_order: true
              - id: l1-n3
                type: multiple_choice
                text: "Which sentence starts with a fronted adverbial?"
                options: ["Once upon a time, a dragon lived in a cave.", "A dragon lived in a cave.", "A dragon lived in a cave once upon a time."]
                answer: "Once upon a time, a dragon lived in a cave."
                option_audio: false
              - id: l1-n4
                type: sorting
                text: "When, where or how?"
                say: "Sort the fronted adverbials. Do they tell you when, where or how?"
                option_audio: false
                bins:
                  - { id: when, show: { text: "when" }, say: "When." }
                  - { id: where, show: { text: "where" }, say: "Where." }
                  - { id: how, show: { text: "how" }, say: "How." }
                options:
                  - { text: "Later that day,", bin: when }
                  - { text: "Near the river,", bin: where }
                  - { text: "With a loud cheer,", bin: how }
                  - { text: "Gently,", bin: how }
              - id: l1-n5
                type: true_false
                text: "\"Every Friday, we have a spelling test.\"\n\nIs it true? The comma is in the right place."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the fronted adverbial."
            say: "Tap every word of the fronted adverbial."
            show: { drawn: letter-card, text: "At the end of the day, we tidied up." }
            spans: ["At", "the", "end", "of", "day,"]
          - id: l1-c2
            type: multiple_choice
            text: "\"Nervously, Sam stepped onto the stage.\"\nWhat does the fronted adverbial tell you?"
            options: ["when", "where", "how"]
            answer: "how"
            keep_order: true
          - id: l1-c3
            type: multiple_choice
            text: "Which sentence starts with a fronted adverbial?"
            options: ["In the morning, the birds sang.", "The birds sang in the morning.", "The birds sang."]
            answer: "In the morning, the birds sang."
            option_audio: false

  - n: 2
    title: { de: Das Komma setzen, en: Placing the comma }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"On the beach, we built a sandcastle.\"\nWhat does the fronted adverbial tell you?"
            options: ["when", "where", "how"]
            answer: "where"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tap the fronted adverbial."
            say: "Tap every word of the fronted adverbial."
            show: { drawn: letter-card, text: "After the match, we had pizza." }
            spans: ["After", "the", "match,"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Later, that day I heard the news. (wrong)\nLater that day, I heard the news. (right)"
            say: "The comma goes at the end of the whole adverbial, not in the middle of it. Later that day is one adverbial, so the comma comes after day."
          - text: "We went to the park after tea.\nAfter tea, we went to the park."
            say: "To front an adverbial, move it to the start, add a comma, and keep the rest of the sentence the same."
          - text: "Then, Then, Then,\nFirst, After a while, Finally,"
            say: "Fronted adverbials help your writing flow. Instead of starting every sentence with then, choose different ones: first, after a while, finally."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Where should the comma go?"
                options: ["During the night, the snow fell.", "During, the night the snow fell.", "During the night the, snow fell."]
                answer: "During the night, the snow fell."
                option_audio: false
                feedback:
                  "During, the night the snow fell.": "During the night is one adverbial. Put the comma after the whole thing: During the night,"
                hints:
                  - "Find where the adverbial ends."
                  - "During the night tells you when."
                  - "During the night, the snow fell."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Fill the gap with the right punctuation mark."
                say: "Which punctuation mark goes in the gap?"
                frame: "As the sun set_ the bats flew out."
                options: [",", ".", "!"]
                answer: [","]
                option_audio: false
                hints:
                  - "Where does the fronted adverbial end?"
                  - "As the sun set tells you when."
                  - "A comma after set."
              - id: l2-f3
                type: ordering
                text: "We ate our lunch under a big tree.\nMove the adverbial to the front."
                say: "We ate our lunch under a big tree. Build the sentence with the adverbial at the front."
                options: ["we ate our lunch.", "Under a big tree,", "Under a big tree"]
                slot_count: 2
                answer: ["Under a big tree,", "we ate our lunch."]
                option_audio: false
                hints:
                  - "Which part is the adverbial?"
                  - "Under a big tree tells you where."
                  - "Under a big tree, we ate our lunch."
              - id: l2-f4
                type: multiple_choice
                text: "Choose a fronted adverbial that tells you how.\n___ the explorer opened the ancient tomb."
                options: ["Very slowly,", "Last week,", "In Egypt,"]
                answer: "Very slowly,"
                hints:
                  - "Which one tells you the way it was done?"
                  - "Last week is when; In Egypt is where."
                  - "Very slowly,"
              - id: l2-f5
                type: multiple_choice
                text: "\"Then we packed. Then we drove. Then we arrived.\"\n\nWhich version flows best?"
                options: ["First, we packed. After a while, we drove. Finally, we arrived.", "Then we packed then we drove then we arrived.", "We packed. We drove. We arrived."]
                answer: "First, we packed. After a while, we drove. Finally, we arrived."
                option_audio: false
                hints:
                  - "Which one uses different fronted adverbials?"
                  - "Look for First, After a while and Finally."
                  - "First, we packed. After a while, we drove. Finally, we arrived."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Where should the comma go?"
                options: ["In the middle of the lake, there was an island.", "In the middle, of the lake there was an island.", "In the middle of the lake there, was an island."]
                answer: "In the middle of the lake, there was an island."
                option_audio: false
                hints: ["Put the comma after the whole adverbial."]
              - id: l2-s2
                type: fill_in_blank
                text: "Fill the gap with the right punctuation mark."
                say: "Which punctuation mark goes in the gap?"
                frame: "Every morning_ my dad goes jogging."
                options: [",", ".", "!"]
                answer: [","]
                option_audio: false
                hints: ["Every morning tells you when."]
              - id: l2-s3
                type: ordering
                text: "The children cheered with great excitement.\nMove the adverbial to the front."
                say: "The children cheered with great excitement. Build the sentence with the adverbial at the front."
                options: ["the children cheered.", "With great excitement", "With great excitement,"]
                slot_count: 2
                answer: ["With great excitement,", "the children cheered."]
                option_audio: false
                hints: ["The adverbial goes first, with its comma."]
              - id: l2-s4
                type: multiple_choice
                text: "Choose a fronted adverbial that tells you where.\n___ the children found a secret door."
                options: ["Behind the bookcase,", "Yesterday,", "Excitedly,"]
                answer: "Behind the bookcase,"
                hints: ["Which one is a place?"]
              - id: l2-s5
                type: true_false
                text: "\"After a long walk we, sat down for a rest.\"\n\nIs it true? The comma is in the right place."
                answer: false
                hints: ["Where does the adverbial end?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Where should the comma go?"
                options: ["At the top of the hill, we stopped for a picnic.", "At the top, of the hill we stopped for a picnic.", "At the top of the hill we, stopped for a picnic."]
                answer: "At the top of the hill, we stopped for a picnic."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Fill the gap with the right punctuation mark."
                say: "Which punctuation mark goes in the gap?"
                frame: "Without warning_ the lights went out."
                options: [",", ".", "!"]
                answer: [","]
                option_audio: false
              - id: l2-n3
                type: ordering
                text: "A fox was hiding beneath the garden shed.\nMove the adverbial to the front."
                say: "A fox was hiding beneath the garden shed. Build the sentence with the adverbial at the front."
                options: ["Beneath the garden shed", "a fox was hiding.", "Beneath the garden shed,"]
                slot_count: 2
                answer: ["Beneath the garden shed,", "a fox was hiding."]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Choose a fronted adverbial that tells you when.\n___ the shop was full of people."
                options: ["On Christmas Eve,", "Inside the shop,", "Noisily,"]
                answer: "On Christmas Eve,"
              - id: l2-n5
                type: true_false
                text: "\"As quick as a flash, the dog grabbed the sausage.\"\n\nIs it true? The comma is in the right place."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tap the fronted adverbial."
            say: "Tap every word of the fronted adverbial."
            show: { drawn: letter-card, text: "Just before midnight, the clock stopped." }
            spans: ["Just", "before", "midnight,"]
          - id: l2-c2
            type: multiple_choice
            text: "Where should the comma go?"
            options: ["After the storm, the garden was a mess.", "After, the storm the garden was a mess.", "After the storm the, garden was a mess."]
            answer: "After the storm, the garden was a mess."
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "\"With a big smile, Grandma opened the door.\"\nWhat does the fronted adverbial tell you?"
            options: ["when", "where", "how"]
            answer: "how"
            keep_order: true
          - id: l2-c4
            type: ordering
            text: "We saw a rainbow on the way home.\nMove the adverbial to the front."
            say: "We saw a rainbow on the way home. Build the sentence with the adverbial at the front."
            options: ["we saw a rainbow.", "On the way home,", "On the way home"]
            slot_count: 2
            answer: ["On the way home,", "we saw a rainbow."]
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Choose a fronted adverbial that tells you where.\n___ the pirates buried their treasure."
            options: ["On a desert island,", "Long ago,", "Quietly,"]
            answer: "On a desert island,"
