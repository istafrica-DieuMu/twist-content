# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.main-ideas
skill: lit-en.comprehension.main-ideas
curriculum: en-GB
language: en
title:
  de: Hauptgedanken finden und zusammenfassen
  en: Main ideas and summaries
summary: >
  The main idea of a paragraph is what the whole paragraph is about; the
  other sentences are details that support it. Lesson 1 finds the main
  idea of one paragraph and tells it apart from a detail; lesson 2 finds
  the main idea of each paragraph in a longer text and chooses or builds
  a short summary of the whole text, then ends with the skill check.
  Every text is written for Twist.
metadata:
  year: year-4
  topic: { de: Zwischen den Zeilen lesen, en: Reading between the lines }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.comprehension.sequence]
  also_practises: [lit-en.comprehension.retrieve]
  vocabulary: { en: [main idea, detail, paragraph, topic sentence, summary, summarise, key words] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: main-idea, what: { de: die Hauptaussage eines Absatzes finden, en: finding the main idea of a paragraph } }
    - { id: topic-detail, what: { de: "Einzelheiten von der Hauptaussage unterscheiden und den Kernsatz finden", en: "telling a detail from the main idea, and finding the topic sentence" } }
    - { id: paragraphs, what: { de: in einem längeren Text die Hauptaussage jedes Absatzes finden, en: finding the main idea of each paragraph in a longer text } }
    - { id: summary, what: { de: eine kurze Zusammenfassung des ganzen Textes wählen oder bauen, en: choosing or building a short summary of the whole text } }
  misconceptions:
    - id: detail-as-main-idea
      what: Picks an interesting detail as the main idea (hedgehogs eat slugs, for a paragraph about what they do in winter)
      addressed: lesson 1 Learn screen 2; tasks l1-f1 (feedback), l1-f3, l1-s1, l1-n1, l2-c1
    - id: summary-is-retelling
      what: Thinks a summary retells every detail, or covers only the first paragraph
      addressed: lesson 2 Learn screen 3; tasks l2-f3 (feedback), l2-f4, l2-s3, l2-n3, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Worum geht es im Absatz?", en: "What is the paragraph about?" }
    goal:
      de: "Finde die Hauptidee eines Absatzes, indem du fragst, worum es in jedem Satz geht, so wie Igel, die den Winter verschlafen."
      en: "Find the main idea of a paragraph by asking what every sentence is about, like hedgehogs sleeping through winter."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Put the events in order."
            say: "Put the events of this story in the order they happened."
            options: ["Lily planted a seed.", "A tall sunflower grew.", "She watered it every day."]
            slot_count: 3
            answer: ["Lily planted a seed.", "She watered it every day.", "A tall sunflower grew."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "It rained all night, so the river burst its banks.\n\nWhy did the river burst its banks?"
            options: ["because it rained all night", "because it was night", "because the banks were old"]
            answer: "because it rained all night"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "In winter, hedgehogs hibernate. They build a nest of leaves under a hedge or a shed. Their hearts slow down and they sleep until spring."
            say: "Read the paragraph. What is it mostly about? Every sentence is about hedgehogs in winter. So the main idea is: hedgehogs hibernate in winter."
          - text: "Main idea: hedgehogs hibernate in winter.\nDetails: a nest of leaves, slow hearts, sleep until spring."
            say: "The other sentences are details. They tell you more about the main idea. A detail can be interesting, but it is not what the whole paragraph is about."
          - text: "Often the first sentence tells you the main idea: the topic sentence."
            say: "In many information texts, the first sentence of a paragraph gives the main idea. It is called the topic sentence. But always check that the rest of the paragraph fits."
          - text: "Ask: what is every sentence about?"
            say: "To find the main idea, ask: what is every sentence about? Then say it in a few words."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Bees are very important to farmers. They carry pollen from flower to flower, which helps crops like apples and beans to grow. Without bees, many fruits would not grow at all.\n\nWhat is the main idea?"
                options: ["Bees help farmers' crops to grow.", "Bees carry pollen.", "Apples and beans are crops."]
                answer: "Bees help farmers' crops to grow."
                option_audio: false
                feedback:
                  "Bees carry pollen.": "That is a detail. It explains how bees help, but the whole paragraph is about bees helping crops grow."
                hints:
                  - "What is every sentence about?"
                  - "Pollen, apples and fruits all show one thing."
                  - "Bees help farmers' crops to grow."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Our school field is busy at lunchtime. Some children play football. Others skip, play tag or sit and chat on the benches.\n\nWhich sentence is the topic sentence?"
                options: ["Our school field is busy at lunchtime.", "Some children play football.", "Others skip, play tag or sit and chat on the benches."]
                answer: "Our school field is busy at lunchtime."
                option_audio: false
                hints:
                  - "Which sentence sums up the paragraph?"
                  - "The other two give examples."
                  - "Our school field is busy at lunchtime."
              - id: l1-f3
                type: multiple_choice
                text: "Penguins are built for the cold. Thick feathers keep them dry, and a layer of fat keeps them warm. They huddle together in big groups during storms.\n\nWhich is a detail, not the main idea?"
                options: ["Penguins huddle in big groups.", "Penguins are built for the cold."]
                answer: "Penguins huddle in big groups."
                option_audio: false
                hints:
                  - "Which one sums up the paragraph?"
                  - "Feathers, fat and huddling all show penguins coping with cold."
                  - "Huddling in groups is a detail."
              - id: l1-f4
                type: true_false
                text: "The Romans built long, straight roads across Britain. The roads helped soldiers march quickly. Traders used them too.\n\nIs it true? The main idea is that traders liked the roads."
                answer: false
                hints:
                  - "Is the whole paragraph about traders?"
                  - "Traders are in one sentence only."
                  - "No. The main idea is that the Romans built roads across Britain."
              - id: l1-f5
                type: multiple_choice
                text: "Ravi loves Saturdays. He sleeps late, eats pancakes and spends the afternoon at the swimming pool with his cousins.\n\nWhat is the paragraph mostly about?"
                options: ["why Ravi loves Saturdays", "pancakes", "Ravi's cousins"]
                answer: "why Ravi loves Saturdays"
                hints:
                  - "What do all the details have in common?"
                  - "They are all things he does on Saturdays."
                  - "Why Ravi loves Saturdays."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Foxes have learned to live in towns. They find food in bins and gardens. They make dens under sheds and in railway banks.\n\nWhat is the main idea?"
                options: ["Foxes have learned to live in towns.", "Foxes eat from bins.", "Foxes like railways."]
                answer: "Foxes have learned to live in towns."
                option_audio: false
                hints: ["Food and dens are details about one thing."]
              - id: l1-s2
                type: multiple_choice
                text: "Exercise is good for your body. It makes your heart and muscles stronger. It also helps you sleep better at night.\n\nWhich sentence is the topic sentence?"
                options: ["Exercise is good for your body.", "It makes your heart and muscles stronger.", "It also helps you sleep better at night."]
                answer: "Exercise is good for your body."
                option_audio: false
                hints: ["Which sentence do the others explain?"]
              - id: l1-s3
                type: sorting
                text: "Main idea or detail?"
                say: "Read the paragraph. Is each sentence the main idea or a detail?"
                option_audio: false
                bins:
                  - { id: main, show: { text: "main idea" }, say: "Main idea." }
                  - { id: detail, show: { text: "detail" }, say: "Detail." }
                options:
                  - { text: "Owls are skilled night hunters.", bin: main }
                  - { text: "Their large eyes see in the dark.", bin: detail }
                  - { text: "Soft feathers let them fly silently.", bin: detail }
                hints: ["Which sentence do the other two support?"]
              - id: l1-s4
                type: true_false
                text: "Volcanoes can be very dangerous. Hot lava destroys everything in its path. Clouds of ash can make it hard to breathe.\n\nIs it true? The main idea is that volcanoes are dangerous."
                answer: true
                hints: ["What do lava and ash both show?"]
              - id: l1-s5
                type: multiple_choice
                text: "At the seaside, Nana built sandcastles, paddled in the waves and ate fish and chips on the pier.\n\nWhat is the paragraph mostly about?"
                options: ["Nana's day at the seaside", "fish and chips", "how to build a sandcastle"]
                answer: "Nana's day at the seaside"
                hints: ["What do all the details have in common?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Camels are well suited to the desert. They can go for days without water. Wide feet stop them sinking into the sand, and long eyelashes keep sand out of their eyes.\n\nWhat is the main idea?"
                options: ["Camels are well suited to the desert.", "Camels have long eyelashes.", "Sand gets into eyes."]
                answer: "Camels are well suited to the desert."
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Recycling helps our planet. It means less rubbish goes into the ground. It also saves trees, because old paper is made into new paper.\n\nWhich sentence is the topic sentence?"
                options: ["Recycling helps our planet.", "It means less rubbish goes into the ground.", "It also saves trees, because old paper is made into new paper."]
                answer: "Recycling helps our planet."
                option_audio: false
              - id: l1-n3
                type: sorting
                text: "Main idea or detail?"
                say: "Read the paragraph. Is each sentence the main idea or a detail?"
                option_audio: false
                bins:
                  - { id: main, show: { text: "main idea" }, say: "Main idea." }
                  - { id: detail, show: { text: "detail" }, say: "Detail." }
                options:
                  - { text: "The library is a great place after school.", bin: main }
                  - { text: "You can borrow up to six books.", bin: detail }
                  - { text: "There is a reading club on Thursdays.", bin: detail }
              - id: l1-n4
                type: true_false
                text: "Spiders are useful in the home. They catch flies and other insects. Some even eat moths that damage clothes.\n\nIs it true? The main idea is that moths damage clothes."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Last winter the pond froze solid. The ducks slid about on the ice, and children threw bread for them from the bank.\n\nWhat is the paragraph mostly about?"
                options: ["the pond freezing last winter", "throwing bread", "where ducks sleep"]
                answer: "the pond freezing last winter"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Trees give us many things. They give us wood for houses and furniture. Their fruit feeds people and animals. Their leaves make the air cleaner.\n\nWhat is the main idea?"
            options: ["Trees give us many things.", "Trees give us wood.", "Leaves make the air cleaner."]
            answer: "Trees give us many things."
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "What is a detail?"
            options: ["a fact that tells you more about the main idea", "the title of a text", "the most important idea"]
            answer: "a fact that tells you more about the main idea"
          - id: l1-c3
            type: true_false
            text: "Snails move very slowly. They glide on a layer of slime. It can take them an hour to cross a garden.\n\nIs it true? The main idea is that snails move slowly."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Cats sleep for a very long time. Most cats sleep for twelve to sixteen hours a day. They often nap in sunny spots and are most awake at dawn and dusk.\n\nWhat is the main idea?"
            options: ["Cats spend a lot of time asleep.", "Cats like sunny spots.", "Cats are awake at dawn."]
            answer: "Cats spend a lot of time asleep."
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Grandad's shed is full of old things. Rusty tools hang on the walls. A broken radio sits on the shelf. Boxes of old photos are piled under the bench.\n\nWhich sentence is the topic sentence?"
            options: ["Grandad's shed is full of old things.", "Rusty tools hang on the walls.", "A broken radio sits on the shelf."]
            answer: "Grandad's shed is full of old things."
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Pandas spend most of the day eating. They munch bamboo for up to fourteen hours. They stop only to rest and sleep.\n\nIs it true? The main idea is that pandas munch bamboo for fourteen hours."
            answer: false

  - n: 2
    title: { de: Mehrere Absätze zusammenfassen, en: Summing up several paragraphs }
    goal:
      de: "Finde die Hauptidee jedes Absatzes und füg sie zu einer kurzen Zusammenfassung des ganzen Textes zusammen."
      en: "Find the main idea of each paragraph, then join them into a short summary of the whole text."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Seals are good swimmers. Their bodies are smooth and their flippers push them through the water.\n\nWhat is the main idea?"
            options: ["Seals are good swimmers.", "Seals have flippers.", "Water is cold."]
            answer: "Seals are good swimmers."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which sentence is often the topic sentence?"
            options: ["the first sentence of a paragraph", "the last word of the text", "the title"]
            answer: "the first sentence of a paragraph"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Castles\n\n1. Castles were built to keep people safe. Thick walls and a moat kept enemies out.\n\n2. Many people lived in a castle. There were cooks, guards and blacksmiths as well as the lord and lady.\n\n3. Today most castles are ruins, but people visit them to learn about the past."
            say: "This text has three paragraphs. Find the main idea of each one: castles kept people safe; many people lived there; today people visit them."
          - text: "Paragraph 1: kept people safe\nParagraph 2: many people lived there\nParagraph 3: visited today"
            say: "Write each main idea in a few key words. These are the bones of your summary."
          - text: "Summary: Castles were built to keep people safe, and many people lived in them. Today people visit them to learn about the past."
            say: "A summary joins the main ideas into one or two sentences. It covers the whole text, and it leaves out the small details like the moat and the blacksmiths."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Ponds\n\n1. A pond is home to many animals. Frogs, newts and dragonflies all live there.\n\n2. Pond plants are important too. They give animals food and places to hide.\n\n3. You can make a small pond in a garden with an old washing-up bowl.\n\nMatch each paragraph to its main idea."
                say: "Read the text about ponds. Match each paragraph to its main idea."
                option_audio: false
                pairs:
                  - { left: { text: "Paragraph 1" }, right: { text: "animals that live in ponds" } }
                  - { left: { text: "Paragraph 2" }, right: { text: "why pond plants matter" } }
                  - { left: { text: "Paragraph 3" }, right: { text: "making your own pond" } }
                hints:
                  - "Ask what every sentence in each paragraph is about."
                  - "Paragraph 1 lists frogs and newts. Paragraph 3 tells you how to make one."
                  - "1: animals, 2: plants, 3: making a pond."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ponds\n\n1. A pond is home to many animals. Frogs, newts and dragonflies all live there.\n\n2. Pond plants are important too. They give animals food and places to hide.\n\n3. You can make a small pond in a garden with an old washing-up bowl.\n\nWhich paragraph tells you how to make a pond?"
                options: ["Paragraph 3", "Paragraph 1", "Paragraph 2"]
                answer: "Paragraph 3"
                keep_order: true
                hints:
                  - "Look for the paragraph about doing something yourself."
                  - "Which one mentions a washing-up bowl?"
                  - "Paragraph 3."
              - id: l2-f3
                type: multiple_choice
                text: "Ponds\n\n1. A pond is home to many animals. Frogs, newts and dragonflies all live there.\n\n2. Pond plants are important too. They give animals food and places to hide.\n\n3. You can make a small pond in a garden with an old washing-up bowl.\n\nWhich is the best summary?"
                options: ["Ponds are home to many animals and plants, and you can make one in your garden.", "Frogs, newts and dragonflies live in ponds.", "A pond has frogs, newts, dragonflies, plants for food, places to hide, and you need an old washing-up bowl to make one."]
                answer: "Ponds are home to many animals and plants, and you can make one in your garden."
                option_audio: false
                feedback:
                  "Frogs, newts and dragonflies live in ponds.": "That only covers paragraph 1. A summary covers the whole text."
                  "A pond has frogs, newts, dragonflies, plants for food, places to hide, and you need an old washing-up bowl to make one.": "That lists every detail. A summary keeps only the main ideas."
                hints:
                  - "A good summary covers every paragraph."
                  - "It keeps the main ideas and leaves out the small details."
                  - "Ponds are home to many animals and plants, and you can make one in your garden."
              - id: l2-f4
                type: true_false
                text: "Is it true? A summary should include every detail from the text."
                answer: false
                hints:
                  - "Is a summary long or short?"
                  - "It keeps only the main ideas."
                  - "No. It leaves out the small details."
              - id: l2-f5
                type: ordering
                text: "Castles\n\n1. Castles were built to keep people safe. Thick walls and a moat kept enemies out.\n\n2. Many people lived in a castle. There were cooks, guards and blacksmiths as well as the lord and lady.\n\n3. Today most castles are ruins, but people visit them to learn about the past.\n\nBuild a summary of the text."
                say: "Put the parts in order to build a summary of the text about castles."
                options: ["and many people lived in them.", "Today people visit them.", "Castles kept people safe,"]
                slot_count: 3
                answer: ["Castles kept people safe,", "and many people lived in them.", "Today people visit them."]
                option_audio: false
                hints:
                  - "Follow the order of the paragraphs."
                  - "Paragraph 1 was about safety."
                  - "Castles kept people safe, and many people lived in them. Today people visit them."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "The Moon\n\n1. The Moon travels around the Earth. One trip takes about a month.\n\n2. The Moon seems to change shape. This is because we see different amounts of its sunlit side.\n\n3. In 1969, astronauts walked on the Moon for the first time.\n\nMatch each paragraph to its main idea."
                say: "Read the text about the Moon. Match each paragraph to its main idea."
                option_audio: false
                pairs:
                  - { left: { text: "Paragraph 1" }, right: { text: "how the Moon moves" } }
                  - { left: { text: "Paragraph 2" }, right: { text: "why its shape seems to change" } }
                  - { left: { text: "Paragraph 3" }, right: { text: "people on the Moon" } }
                hints: ["Ask what each whole paragraph is about."]
              - id: l2-s2
                type: multiple_choice
                text: "The Moon\n\n1. The Moon travels around the Earth. One trip takes about a month.\n\n2. The Moon seems to change shape. This is because we see different amounts of its sunlit side.\n\n3. In 1969, astronauts walked on the Moon for the first time.\n\nWhich paragraph explains why the Moon seems to change shape?"
                options: ["Paragraph 2", "Paragraph 1", "Paragraph 3"]
                answer: "Paragraph 2"
                keep_order: true
                hints: ["Look for the word because."]
              - id: l2-s3
                type: multiple_choice
                text: "The Moon\n\n1. The Moon travels around the Earth. One trip takes about a month.\n\n2. The Moon seems to change shape. This is because we see different amounts of its sunlit side.\n\n3. In 1969, astronauts walked on the Moon for the first time.\n\nWhich is the best summary?"
                options: ["The Moon travels around the Earth and seems to change shape, and astronauts have walked on it.", "Astronauts walked on the Moon in 1969.", "The Moon is very bright at night."]
                answer: "The Moon travels around the Earth and seems to change shape, and astronauts have walked on it."
                option_audio: false
                hints: ["Does it cover all three paragraphs?"]
              - id: l2-s4
                type: multiple_choice
                text: "How long should a summary of three short paragraphs be?"
                options: ["one or two sentences", "longer than the text", "one word"]
                answer: "one or two sentences"
                hints: ["A summary is shorter than the text."]
              - id: l2-s5
                type: ordering
                text: "The Moon\n\n1. The Moon travels around the Earth. One trip takes about a month.\n\n2. The Moon seems to change shape. This is because we see different amounts of its sunlit side.\n\n3. In 1969, astronauts walked on the Moon for the first time.\n\nBuild a summary of the text."
                say: "Put the parts in order to build a summary of the text about the Moon."
                options: ["Astronauts have walked on it.", "The Moon travels around the Earth", "and seems to change shape."]
                slot_count: 3
                answer: ["The Moon travels around the Earth", "and seems to change shape.", "Astronauts have walked on it."]
                option_audio: false
                hints: ["Follow the order of the paragraphs."]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Chocolate\n\n1. Chocolate is made from cocoa beans. They grow in pods on cocoa trees in hot countries.\n\n2. At the factory, the beans are roasted and ground into a paste. Sugar and milk are added.\n\n3. People around the world eat millions of bars every day.\n\nMatch each paragraph to its main idea."
                say: "Read the text about chocolate. Match each paragraph to its main idea."
                option_audio: false
                pairs:
                  - { left: { text: "Paragraph 1" }, right: { text: "where cocoa beans come from" } }
                  - { left: { text: "Paragraph 2" }, right: { text: "how chocolate is made" } }
                  - { left: { text: "Paragraph 3" }, right: { text: "how popular chocolate is" } }
              - id: l2-n2
                type: multiple_choice
                text: "Chocolate\n\n1. Chocolate is made from cocoa beans. They grow in pods on cocoa trees in hot countries.\n\n2. At the factory, the beans are roasted and ground into a paste. Sugar and milk are added.\n\n3. People around the world eat millions of bars every day.\n\nWhich paragraph tells you about the factory?"
                options: ["Paragraph 2", "Paragraph 1", "Paragraph 3"]
                answer: "Paragraph 2"
                keep_order: true
              - id: l2-n3
                type: multiple_choice
                text: "Chocolate\n\n1. Chocolate is made from cocoa beans. They grow in pods on cocoa trees in hot countries.\n\n2. At the factory, the beans are roasted and ground into a paste. Sugar and milk are added.\n\n3. People around the world eat millions of bars every day.\n\nWhich is the best summary?"
                options: ["Chocolate is made from cocoa beans in a factory, and people all over the world love it.", "Cocoa beans grow in pods.", "Chocolate has sugar and milk in it and is roasted and ground into a paste and grows in hot countries in pods."]
                answer: "Chocolate is made from cocoa beans in a factory, and people all over the world love it."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? A summary uses the main idea of each paragraph."
                answer: true
              - id: l2-n5
                type: ordering
                text: "Chocolate\n\n1. Chocolate is made from cocoa beans. They grow in pods on cocoa trees in hot countries.\n\n2. At the factory, the beans are roasted and ground into a paste. Sugar and milk are added.\n\n3. People around the world eat millions of bars every day.\n\nBuild a summary of the text."
                say: "Put the parts in order to build a summary of the text about chocolate."
                options: ["and people everywhere eat it.", "Chocolate is made from cocoa beans", "in a factory,"]
                slot_count: 3
                answer: ["Chocolate is made from cocoa beans", "in a factory,", "and people everywhere eat it."]
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: main-idea
            type: multiple_choice
            text: "Rainforests are home to more kinds of animals than anywhere else. Monkeys swing through the trees, parrots nest high up, and jaguars hunt on the forest floor.\n\nWhat is the main idea?"
            options: ["Rainforests are home to many kinds of animals.", "Parrots nest high up.", "Jaguars hunt on the forest floor."]
            answer: "Rainforests are home to many kinds of animals."
            option_audio: false
          - id: l2-c2
            part: topic-detail
            type: multiple_choice
            text: "Dogs make good pets. They are loyal and love to play. Walking a dog also keeps its owner fit.\n\nWhich sentence is the topic sentence?"
            options: ["Dogs make good pets.", "They are loyal and love to play.", "Walking a dog also keeps its owner fit."]
            answer: "Dogs make good pets."
            option_audio: false
          - id: l2-c3
            part: paragraphs
            type: matching
            text: "Bicycles\n\n1. The first bicycles had no pedals. Riders pushed along with their feet.\n\n2. Riding a bike is good exercise and does not pollute the air.\n\n3. Always wear a helmet and use lights when it is dark.\n\nMatch each paragraph to its main idea."
            say: "Read the text about bicycles. Match each paragraph to its main idea."
            option_audio: false
