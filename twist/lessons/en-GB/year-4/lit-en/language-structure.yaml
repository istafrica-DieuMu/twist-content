# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.language-structure
skill: lit-en.comprehension.language-structure
curriculum: en-GB
language: en
title:
  de: Wie Sprache, Aufbau und Gestaltung wirken
  en: How language, structure and presentation work
summary: >
  Writers choose words, order and layout on purpose. Lesson 1 looks at
  language: what a well-chosen verb, adjective or simile makes the reader
  picture or feel (crept, not walked); lesson 2 looks at structure and
  presentation: headings, subheadings, bullet points, captions, bold
  words, a glossary and a question to the reader, what each one is for,
  and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Wie Texte wirken, en: How texts work }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.comprehension.words-in-context]
  also_practises: [lit-en.comprehension.main-ideas]
  vocabulary: { en: [language, structure, presentation, effect, reader, verb, adjective, simile, heading, subheading, bullet points, caption, glossary, bold] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: word-choice, what: { de: "sagen, was ein gut gewähltes Wort den Leser sehen oder fühlen lässt", en: what a well-chosen word makes the reader picture or feel } }
    - { id: devices, what: { de: "Vergleiche, Wiederholungen und kurze Sätze und ihre Wirkung", en: "similes, repetition and short sentences, and their effect" } }
    - { id: features, what: { de: "wozu Überschriften, Aufzählungspunkte, Bildunterschriften, Fettdruck und Glossar da sind", en: "what headings, bullet points, captions, bold words and a glossary are for" } }
    - { id: structure, what: { de: "wie der Aufbau eines Textes dem Leser hilft", en: how the order and parts of a text help the reader } }
  misconceptions:
    - id: words-just-mean
      what: Says what a word means but not what it makes the reader picture or feel (crept means walked)
      addressed: lesson 1 Learn screens 2 and 3; tasks l1-f1 (feedback), l1-f3, l1-s1, l1-n1, l2-c1
    - id: layout-is-decoration
      what: Thinks headings, bullet points and bold words are only there to look nice
      addressed: lesson 2 Learn screens 2 and 3; tasks l2-f1 (feedback), l2-f4, l2-s4, l2-n4, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Wörter mit Wirkung, en: Words that make an effect }
    goal:
      de: "Erklär, was ein gut gewähltes Wort dich sehen oder fühlen lässt, so wie crept statt walked."
      en: "Explain what a writer's word makes you picture or feel, like crept instead of walked."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "The puppy was so drowsy that its eyes kept closing.\n\nWhat does drowsy mean?"
            options: ["sleepy", "hungry", "naughty"]
            answer: "sleepy"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "The fox crept silently past the sleeping hens.\n\nWhich word passes the swap test for silently?"
            options: ["quietly", "loudly", "quickly"]
            answer: "quietly"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The boy walked into the dark room.\nThe boy crept into the dark room.\nWhich boy is scared?"
            say: "Read the two sentences. Only one word is different. Which boy do you think is scared? Have a guess."
          - text: "The boy walked into the dark room.\nThe boy crept into the dark room."
            say: "Did you pick the boy who crept? Both sentences tell us he went into the room. But crept makes us picture him moving slowly and quietly, perhaps because he is scared. A well-chosen verb shows how something happens."
          - text: "the wind blew\nthe wind howled"
            say: "When you explain a writer's word, say what it makes you picture or feel. Howled makes the wind sound wild and loud, like an animal. That is the effect on the reader."
          - text: "Did you know? Roald Dahl made up words for The BFG. The giant eats a snozzcumber and drinks frobscottle."
            say: "Did you know? Roald Dahl made up lots of new words for his stories. In The BFG, the giant has to eat a snozzcumber, a horrible stripy vegetable, and he drinks a fizzy drink called frobscottle. Snozzcumber even sounds disgusting. Dahl chose every sound on purpose, to make readers picture and feel it!"
          - text: "Her hands were as cold as ice.\nThe waves crashed and roared."
            say: "A simile compares two things using like or as: as cold as ice. It helps us imagine how cold. Strong verbs like crashed and roared help us hear the sea."
          - text: "The writer uses ___ to make the reader picture or feel ___."
            say: "Use this sentence to explain a word choice: the writer uses this word to make the reader picture or feel this."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The thief snatched the bag and dashed down the alley.\n\nWhat do snatched and dashed make you picture?"
                options: ["the thief moving very fast", "the thief being polite", "a quiet, slow walk"]
                answer: "the thief moving very fast"
                feedback:
                  "a quiet, slow walk": "Snatched and dashed are quick, sudden verbs. They make us picture speed, not a slow walk."
                hints:
                  - "Think about how fast you snatch something."
                  - "Dashed means more than ran."
                  - "They make you picture the thief moving very fast."
                difficulty: easy
              - id: l1-f3
                type: multiple_choice
                text: "Why does the writer say the old house groaned in the wind, not made a noise?"
                options: ["to make the house sound creepy and alive", "because groaned is shorter", "to tell us the house is new"]
                answer: "to make the house sound creepy and alive"
                hints:
                  - "Who usually groans?"
                  - "People groan. It makes the house seem alive."
                  - "To make the house sound creepy and alive."
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the simile."
                say: "Tap the words that make the simile in this sentence."
                show: { drawn: letter-card, text: "The snow was as soft as a feather pillow." }
                spans: ["as", "soft", "a", "feather", "pillow."]
                hints:
                  - "A simile uses like or as to compare."
                  - "What is the snow compared to?"
                  - "as soft as a feather pillow."
              - id: l1-f4
                type: multiple_choice
                text: "Which sentence helps the reader picture the scene best?"
                options: ["The tiny kitten tumbled off the cushion.", "The cat fell off.", "It went down."]
                answer: "The tiny kitten tumbled off the cushion."
                option_audio: false
                hints:
                  - "Which one tells you most?"
                  - "Look for a precise noun, adjective and verb."
                  - "The tiny kitten tumbled off the cushion."
              - id: l1-f5
                type: multiple_choice
                text: "The cave was silent. Drip. Drip. Drip.\n\nWhy does the writer repeat drip?"
                options: ["to make the silence feel long and tense", "because they forgot", "to tell us it is raining outside"]
                answer: "to make the silence feel long and tense"
                hints:
                  - "Read it aloud slowly. How does it feel?"
                  - "The only sound is the drip, again and again."
                  - "It makes the silence feel long and tense."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The giant stomped across the valley.\n\nWhat does stomped tell you about the giant?"
                options: ["he is heavy and loud", "he is small and shy", "he is asleep"]
                answer: "he is heavy and loud"
                hints: ["How do feet sound when they stomp?"]
              - id: l1-s2
                type: highlight_in_text
                text: "Tap the simile."
                say: "Tap the words that make the simile in this sentence."
                show: { drawn: letter-card, text: "Tom ran like a cheetah across the field." }
                spans: ["like", "a", "cheetah"]
                hints: ["Find like and what Tom is compared to."]
              - id: l1-s3
                type: multiple_choice
                text: "\"Her smile was as bright as the sun.\" What does this simile make you think?"
                options: ["she looked very happy", "the sun was in her eyes", "it was summer"]
                answer: "she looked very happy"
                hints: ["What is bright and warm like the sun?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Which verb makes the rain sound strongest? Fill the gap."
                say: "Which verb makes the rain sound strongest? Fill the gap."
                frame: "The rain _ the windows."
                options: ["lashed", "touched", "tickled"]
                answer: ["lashed"]
                hints: ["Which verb sounds hard and violent?"]
              - id: l1-s5
                type: multiple_choice
                text: "Suddenly, a scream! Then nothing.\n\nWhy are these sentences so short?"
                options: ["to make the moment sudden and scary", "because the writer was in a hurry", "to explain what happened"]
                answer: "to make the moment sudden and scary"
                hints: ["How does a short sentence feel to read?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The hungry dog gobbled its dinner.\n\nWhat does gobbled make you picture?"
                options: ["the dog eating fast and greedily", "the dog eating slowly", "the dog not eating"]
                answer: "the dog eating fast and greedily"
              - id: l1-n2
                type: highlight_in_text
                text: "Tap the simile."
                say: "Tap the words that make the simile in this sentence."
                show: { drawn: letter-card, text: "The lake was as still as glass." }
                spans: ["as", "still", "glass."]
              - id: l1-n3
                type: multiple_choice
                text: "Why does the writer say the leaves danced, not moved?"
                options: ["to make the leaves seem lively and happy", "because leaves can really dance", "to show it was night"]
                answer: "to make the leaves seem lively and happy"
              - id: l1-n4
                type: multiple_choice
                text: "Which sentence makes the reader feel most nervous?"
                options: ["Slowly, the door creaked open.", "The door opened.", "Mum opened the door for the postman."]
                answer: "Slowly, the door creaked open."
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Which explanation of the word whispered is best?"
                options: ["The writer uses whispered to make the reader feel the secret is important.", "Whispered means said.", "Whispered is a verb."]
                answer: "The writer uses whispered to make the reader feel the secret is important."
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The mouse scurried under the fridge.\n\nWhat does scurried make you picture?"
            options: ["quick, small steps", "a slow crawl", "a big jump"]
            answer: "quick, small steps"
          - id: l1-c2
            type: highlight_in_text
            text: "Tap the simile."
            say: "Tap the words that make the simile in this sentence."
            show: { drawn: letter-card, text: "His voice boomed like thunder." }
            spans: ["like", "thunder."]
          - id: l1-c3
            type: multiple_choice
            text: "Which verb makes the sun sound hottest?"
            options: ["The sun blazed down.", "The sun was up.", "The sun came out."]
            answer: "The sun blazed down."
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "The tiger crouched in the long grass.\n\nWhat does crouched make you picture?"
            options: ["the tiger low down, ready to pounce", "the tiger running away", "the tiger asleep in a tree"]
            answer: "the tiger low down, ready to pounce"
          - id: l1-c5
            type: highlight_in_text
            text: "Tap the simile."
            say: "Tap the words that make the simile in this sentence."
            show: { drawn: letter-card, text: "The ice was as slippery as soap." }
            spans: ["as", "slippery", "soap."]
          - id: l1-c6
            type: multiple_choice
            text: "Why does the writer say the girl stormed out of the room, not left the room?"
            options: ["to show that she was very angry", "to show that it was raining", "to show that she was happy"]
            answer: "to show that she was very angry"

  - n: 2
    title: { de: Aufbau und Gestaltung, en: Structure and presentation }
    goal:
      de: "Sag, wofür Überschriften, Aufzählungen und Bildunterschriften da sind, so wie Zwischenüberschriften, mit denen du jeden Teil schnell findest."
      en: "Say what headings, bullet points and captions are for, like subheadings that help you find each part quickly."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The horse thundered down the track.\n\nWhat does thundered make you picture?"
            options: ["a fast, heavy, loud horse", "a sleepy horse", "a horse in the rain"]
            answer: "a fast, heavy, loud horse"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is a simile?"
            options: ["a comparison using like or as", "a word that means the opposite", "a short sentence"]
            answer: "a comparison using like or as"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "A book about owls has 40 pages.\nYou only want to know what owls eat.\nRead every page, or is there a quicker way?"
            say: "A book about owls has forty pages. You only want to find out what owls eat. Do you have to read every page, or is there a quicker way? Have a guess."
          - text: "Amazing Owls (title)\nWhere owls live (subheading)\nOwls live on every continent except Antarctica."
            say: "There is a quicker way: look for the right subheading! Information texts are set out to help the reader. The title tells you the topic. Subheadings split the text into parts, so you can find what you need quickly."
          - text: "What owls eat:\n• mice\n• insects\n• small birds\nbold word: a key word, explained in the glossary\ncaption: tells you what a picture shows"
            say: "Bullet points list facts so they are quick to read. Words in bold are often key words, explained in a glossary at the end. A caption under a picture tells you what the picture shows."
          - text: "Have you ever heard an owl hoot at night?"
            say: "A question to the reader at the start makes the reader think and want to read on."
          - text: "Order matters too: an introduction first, then the parts, then an ending.\nInstructions use numbered steps: 1, 2, 3."
            say: "Structure is the order of a text. An introduction says what the text is about, paragraphs or sections give the details, and the ending sums up. Instructions number their steps, so you do them in the right order."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Why does an information text about owls have subheadings?"
                options: ["to help the reader find each part quickly", "to make the page look pretty", "to tell a story"]
                answer: "to help the reader find each part quickly"
                feedback:
                  "to make the page look pretty": "Subheadings do more than look nice. They split the text into parts, so the reader can find what they need."
                hints:
                  - "Think about how you would use a subheading."
                  - "You look for the part you want."
                  - "To help the reader find each part quickly."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Match each feature to its job."
                say: "Match each feature of an information text to its job."
                option_audio: false
                pairs:
                  - { left: { text: "caption" }, right: { text: "tells you what a picture shows" } }
                  - { left: { text: "glossary" }, right: { text: "explains key words" } }
                  - { left: { text: "bullet points" }, right: { text: "list facts to read quickly" } }
                hints:
                  - "Where do you find each one on a page?"
                  - "A caption sits under a picture; a glossary is at the end."
                  - "caption: picture, glossary: key words, bullet points: quick facts."
              - id: l2-f3
                type: multiple_choice
                text: "Did you know that the blue whale is the biggest animal that has ever lived?\n\nWhy does the text start with a question?"
                options: ["to make the reader curious", "because the writer does not know the answer", "to end the text"]
                answer: "to make the reader curious"
                hints:
                  - "How do you feel when someone asks you that?"
                  - "You want to find out more."
                  - "To make the reader curious."
              - id: l2-f4
                type: multiple_choice
                text: "In a text about volcanoes, the word magma is in bold. Why?"
                options: ["it is a key word explained in the glossary", "it is the writer's favourite word", "it is a spelling mistake"]
                answer: "it is a key word explained in the glossary"
                hints:
                  - "Where could you find out what magma means?"
                  - "Bold words are often key words."
                  - "It is a key word explained in the glossary."
              - id: l2-f5
                type: ordering
                text: "Put the parts of the information text in order."
                say: "Put the parts of an information text about owls in the best order."
                options: ["What owls eat", "Owls really are amazing. Look out for one!", "• mice  • insects  • small birds", "Owls are amazing birds that hunt at night."]
                slot_count: 4
                answer: ["Owls are amazing birds that hunt at night.", "What owls eat", "• mice  • insects  • small birds", "Owls really are amazing. Look out for one!"]
                option_audio: false
                hints:
                  - "Which part introduces the topic?"
                  - "A subheading comes just before the part it names."
                  - "The introduction, What owls eat, the list, then the ending."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A recipe lists its ingredients as bullet points. Why?"
                options: ["so you can check them quickly", "so the recipe is longer", "so it rhymes"]
                answer: "so you can check them quickly"
                hints: ["Think about using a recipe in the kitchen."]
              - id: l2-s2
                type: multiple_choice
                text: "Instructions for planting a seed are numbered 1 to 5. Why?"
                options: ["to show the order to do things in", "to show how many seeds", "to make it a poem"]
                answer: "to show the order to do things in"
                hints: ["Does the order matter when you plant a seed?"]
              - id: l2-s3
                type: multiple_choice
                text: "Under a photo of a hedgehog it says: A hedgehog looking for slugs at night. What is this?"
                options: ["a caption", "a subheading", "a glossary"]
                answer: "a caption"
                hints: ["It sits under a picture."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Subheadings are only there to make the page look nice."
                answer: false
                hints: ["What do you use subheadings for?"]
              - id: l2-s5
                type: multiple_choice
                text: "Where in an information text would you usually find the glossary?"
                options: ["at the end", "in the title", "under every picture"]
                answer: "at the end"
                hints: ["You look up words in it after reading."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What is the job of the introduction in an information text?"
                options: ["to say what the text is about", "to list every fact", "to explain the key words"]
                answer: "to say what the text is about"
              - id: l2-n2
                type: matching
                text: "Match each feature to its job."
                say: "Match each feature of a text to its job."
                option_audio: false
                pairs:
                  - { left: { text: "title" }, right: { text: "tells you the topic" } }
                  - { left: { text: "numbered steps" }, right: { text: "show the order to do things" } }
                  - { left: { text: "a question to the reader" }, right: { text: "makes the reader want to read on" } }
              - id: l2-n3
                type: multiple_choice
                text: "Why might a writer use a short, separate paragraph for one surprising fact?"
                options: ["to make the fact stand out", "to fill up space", "because it is not important"]
                answer: "to make the fact stand out"
              - id: l2-n4
                type: true_false
                text: "Is it true? Words in bold can help a reader spot the key words."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "You want to find out what sharks eat in a long information book. What helps you most?"
                options: ["a subheading called What sharks eat", "the picture on the cover", "the first word of the book"]
                answer: "a subheading called What sharks eat"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: word-choice
            type: multiple_choice
            text: "The wolf prowled around the cottage.\n\nWhat does prowled make you picture?"
            options: ["moving quietly, ready to attack", "skipping happily", "sleeping"]
            answer: "moving quietly, ready to attack"
          - id: l2-c2
            part: devices
            type: highlight_in_text
            text: "Tap the simile."
            say: "Tap the words that make the simile in this sentence."
            show: { drawn: letter-card, text: "The baby's cheeks were as red as cherries." }
            spans: ["as", "red", "cherries."]
          - id: l2-c3
            part: features
            type: multiple_choice
            text: "Under a map it says: The River Thames flows through London. What is this?"
            options: ["a caption", "a glossary", "a title"]
            answer: "a caption"
          - id: l2-c4
            part: features
            type: multiple_choice
            text: "A zoo leaflet has three subheadings: Opening times, Our animals, Ticket prices. You want to know how much a ticket costs. Where do you look?"
            options: ["under Ticket prices", "under Our animals", "under Opening times"]
            answer: "under Ticket prices"
          - id: l2-c5
            part: features
            type: multiple_choice
            text: "In a text about rainforests, the word canopy is in bold. At the end, a list gives the meaning of each bold word. What is that list called?"
            options: ["a glossary", "a caption", "a subheading"]
            answer: "a glossary"
          - id: l2-c6
            part: word-choice
            type: multiple_choice
            text: "The children giggled at the back of the classroom.\n\nWhat does giggled make you picture?"
            options: ["children laughing in a silly, quiet way", "children crying", "children shouting angrily"]
            answer: "children laughing in a silly, quiet way"
          - id: l2-c7
            part: word-choice
            type: multiple_choice
            text: "Why does the writer say the lion roared, not made a sound?"
            options: ["to make the lion seem loud and powerful", "because roared is easier to spell", "to show that the lion was asleep"]
            answer: "to make the lion seem loud and powerful"
          - id: l2-c8
            part: word-choice
            type: multiple_choice
            text: "Which sentence makes the reader feel the most excited?"
            options: ["The crowd leapt to their feet and cheered.", "The crowd was there.", "Some people sat down."]
            answer: "The crowd leapt to their feet and cheered."
            option_audio: false
          - id: l2-c9
            part: word-choice
            type: multiple_choice
            text: "The old man trudged home through the snow.\n\nWhich explanation of the word trudged is best?"
            options: ["The writer uses trudged to make the reader picture the man walking slowly and wearily.", "Trudged is in the past tense.", "Trudged has seven letters."]
            answer: "The writer uses trudged to make the reader picture the man walking slowly and wearily."
            option_audio: false
          - id: l2-c10
            part: devices
            type: highlight_in_text
            text: "Tap the simile."
            say: "Tap the words that make the simile in this sentence."
            show: { drawn: letter-card, text: "The children were as busy as bees." }
            spans: ["as", "busy", "bees."]
          - id: l2-c11
            part: devices
            type: multiple_choice
            text: "\"The water was like a mirror.\"\n\nWhat does this simile make you picture?"
            options: ["very smooth, still water", "rough, stormy water", "dirty, muddy water"]
            answer: "very smooth, still water"
          - id: l2-c12
            part: devices
            type: multiple_choice
            text: "Which sentence uses a simile?"
            options: ["The clouds were like fluffy sheep.", "The clouds were grey.", "The clouds moved slowly."]
            answer: "The clouds were like fluffy sheep."
            option_audio: false
          - id: l2-c13
            part: devices
            type: true_false
            text: "\"Tick. Tock. Tick. Tock. The clock was the only sound.\"\n\nIs it true? Repeating tick and tock makes the room feel quiet and tense."
            answer: true
          - id: l2-c14
            part: features
            type: matching
            text: "Match each feature to its job."
            say: "Match each feature of a non-fiction text to its job."
            option_audio: false
            pairs:
              - { left: { text: "subheading" }, right: { text: "splits the text into parts" } }
              - { left: { text: "bold word" }, right: { text: "marks a key word" } }
              - { left: { text: "caption" }, right: { text: "says what a picture shows" } }
          - id: l2-c15
            part: features
            type: true_false
            text: "Is it true? A caption explains all the key words in a book."
            answer: false
          - id: l2-c16
            part: structure
            type: multiple_choice
            text: "A text about bees starts: Bees are busy insects that make honey.\n\nWhat is this part of the text called?"
            options: ["the introduction", "the glossary", "a caption"]
            answer: "the introduction"
          - id: l2-c17
            part: structure
            type: ordering
            text: "Put the parts of the information text in order."
            say: "Put the parts of an information text about hedgehogs in the best order."
