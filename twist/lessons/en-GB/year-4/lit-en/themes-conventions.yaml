# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.themes-conventions
skill: lit-en.texts.themes-conventions
curriculum: en-GB
language: en
title:
  de: Themen und typische Merkmale von Geschichten
  en: Themes and conventions in stories
summary: >
  A theme is the big idea a story is about (friendship, courage, good and
  evil); a convention is something many stories of one kind share (once
  upon a time, things in threes, the hero's journey, a happy ending, a
  moral). Lesson 1 finds themes in short original stories; lesson 2 spots
  the conventions of fairy tales and fables and ends with the skill check.
  Every story here is written for Twist.
metadata:
  year: year-4
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.texts.traditional-tales]
  also_practises: [lit-en.comprehension.retrieve-present]
  vocabulary: { en: [theme, convention, moral, fable, fairy tale, hero, journey, happy ending, rule of three] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: theme, what: { de: das Thema einer Geschichte finden, en: finding the theme of a story } }
    - { id: theme-plot, what: { de: Thema und Handlung unterscheiden, en: telling a theme from the plot } }
    - { id: fairy-tale, what: { de: "Merkmale von Märchen (Es war einmal, Dinge in Dreierreihe, ein glückliches Ende)", en: "fairy-tale conventions (once upon a time, things in threes, a happy ending)" } }
    - { id: fable-journey, what: { de: die Lehre einer Fabel und die Heldenreise, en: the moral of a fable and the hero's journey } }
  misconceptions:
    - id: theme-is-plot
      what: Gives what happens instead of the big idea (the theme is "a fox and a crow")
      addressed: Learn sets plot and theme side by side; options include a plot summary, with feedback
    - id: one-right-theme
      what: Thinks a story has only one possible theme
      addressed: lesson 1 Learn says a story can have several and that we look for the best fit
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Worum geht es wirklich?", en: "What is it really about?" }
    goal:
      de: "Finde die große Idee hinter einer Geschichte, ihr Thema, so wie Mut, als die Maus Fern im Dunkeln hinausgeht."
      en: "Find the big idea a story is about, its theme, like courage when Fern the mouse goes out in the dark."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which of these is a traditional tale?"
            options: ["a fairy tale about a princess and a dragon", "a recipe for pancakes", "a letter to a friend"]
            answer: "a fairy tale about a princess and a dragon"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? Fables often have animals that talk."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Fern the mouse was scared of the dark, but when her brother was lost in the night, she went out with a tiny lamp and found him. What is this story really about?"
            say: "Read the story. Is it just about a mouse with a lamp, or is there a bigger idea? Have a guess."
          - text: "Plot: Fern goes out in the dark and finds her brother. Theme: courage"
            say: "What happens is the plot: Fern goes out in the dark and finds her brother. The theme is the big idea underneath: being brave even when you are scared. The theme of this story is courage."
          - text: "friendship · courage · good and evil · honesty · kindness"
            say: "Themes are often one or two words. A story can have more than one theme; we look for the one that fits best."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Leo shared his last sandwich with the new boy, Raj. By the end of term they did everything together. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["friendship", "a sandwich", "school dinners"]
                answer: "friendship"
                feedback:
                  "a sandwich": "The sandwich is part of what happens. The big idea is the two boys becoming friends."
                hints:
                  - "What is the big idea, not just what happens?"
                  - "Leo and Raj end up doing everything together."
                  - "Friendship."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A wicked queen stole the town's water. A girl outsmarted her, and the water flowed again. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["good and evil", "the weather", "a girl and a queen"]
                answer: "good and evil"
                hints:
                  - "Who is wicked and who is good?"
                  - "The good girl beats the wicked queen."
                  - "Good and evil."
              - id: l1-f3
                type: true_false
                text: "Sam found a purse in the park and took it to the police station, even though nobody saw him. Is the theme honesty?"
                say: "Read the story. Is the theme honesty?"
                answer: true
                hints:
                  - "What does Sam choose to do?"
                  - "He hands it in when nobody is watching."
                  - "Yes, honesty."
              - id: l1-f4
                type: multiple_choice
                text: "Which is a theme, not a plot?"
                options: ["kindness", "a fox climbs a tree", "the boat sinks"]
                answer: "kindness"
                feedback:
                  "a fox climbs a tree": "That is something that happens: a plot. A theme is a big idea, like kindness."
                hints:
                  - "A plot tells what happens."
                  - "A theme is a big idea in a word or two."
                  - "Kindness."
              - id: l1-f5
                type: multiple_choice
                text: "Maya practised the piano every day for a year. At the concert she played without one mistake. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["hard work pays off", "pianos are loud", "a concert hall"]
                answer: "hard work pays off"
                hints:
                  - "Why did Maya play so well?"
                  - "She practised every day."
                  - "Hard work pays off."
              - id: l1-f6
                type: true_false
                text: "Is it true? A story can have more than one theme."
                answer: true
                hints:
                  - "Think of a story about friends who are brave together."
                  - "That is friendship and courage."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The old dog could not run any more, so the puppy brought him the ball every morning. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["kindness", "running", "dogs and balls"]
                answer: "kindness"
                hints: ["What does the puppy do for the old dog?"]
              - id: l1-s2
                type: multiple_choice
                text: "Ella was afraid of the high board, but she climbed up, counted to three and jumped. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["courage", "swimming pools", "counting"]
                answer: "courage"
                hints: ["She was afraid, but she jumped."]
              - id: l1-s3
                type: true_false
                text: "Ben told his teacher he broke the window, although his friend wanted him to keep quiet. Is the theme greed?"
                say: "Read the story. Is the theme greed?"
                answer: false
                hints: ["What does Ben choose?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which is a plot, not a theme?"
                options: ["a giant falls asleep", "courage", "friendship"]
                answer: "a giant falls asleep"
                hints: ["A plot tells what happens."]
              - id: l1-s5
                type: multiple_choice
                text: "Two kings fought for years over a field. In the end, the field was ruined and nobody could grow anything there. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["fighting harms everyone", "farming", "kings are rich"]
                answer: "fighting harms everyone"
                hints: ["What happened to the field?"]
              - id: l1-s6
                type: multiple_choice
                text: "Nora wanted the biggest slice of every cake and soon nobody would share with her. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["greed", "baking", "cake is yummy"]
                answer: "greed"
                hints: ["What does Nora always want?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Grandpa lost his memory, but his granddaughter visited every Sunday and told him stories of his own life. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["love in a family", "Sundays are long", "memory games"]
                answer: "love in a family"
              - id: l1-n2
                type: true_false
                text: "A shy girl joined the choir and, by the end of the year, sang a solo. Is the theme growing in confidence?"
                say: "Read the story. Is the theme growing in confidence?"
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Which is a theme, not a plot?"
                options: ["honesty", "the bus is late", "a cat climbs a wall"]
                answer: "honesty"
              - id: l1-n4
                type: multiple_choice
                text: "The town laughed at Omar's strange invention, but he kept working on it. When the river flooded, it saved everyone's homes. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["believing in yourself", "rivers", "inventions are noisy"]
                answer: "believing in yourself"
              - id: l1-n5
                type: multiple_choice
                text: "A dragon guarded gold that it never spent, and it died alone in its cave. What is the theme?"
                say: "Read the story. What is the theme?"
                options: ["greed", "caves", "dragons fly"]
                answer: "greed"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Zara and Kit argued all week, but when Kit fell ill, Zara brought him his homework every day. What is the theme?"
            say: "Read the story. What is the theme?"
            options: ["friendship", "homework", "being ill"]
            answer: "friendship"
          - id: l1-c2
            type: multiple_choice
            text: "Which is a theme, not a plot?"
            options: ["courage", "a ship leaves port", "the snow melts"]
            answer: "courage"
          - id: l1-c3
            type: true_false
            text: "Ava told everyone that she had won the race, but really she had come last. Soon nobody believed anything she said. Is the theme kindness?"
            say: "Read the story. Is the theme kindness?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Grace saved her pocket money for months to buy her brother the bike he had always wanted. What is the theme?"
            say: "Read the story. What is the theme?"
            options: ["kindness", "bikes", "shopping"]
            answer: "kindness"
          - id: l1-c5
            type: true_false
            text: "A knight ran away from every battle, but one day he stood alone to protect a village. Is the theme courage?"
            say: "Read the story. Is the theme courage?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which is a plot, not a theme?"
            options: ["the princess loses her shoe", "kindness", "good and evil"]
            answer: "the princess loses her shoe"

  - n: 2
    title: { de: Typische Merkmale, en: Spotting conventions }
    goal:
      de: "Entdecke, was Märchen und Fabeln oft gemeinsam haben, so wie es war einmal, Dinge in Dreiergruppen und ein glückliches Ende."
      en: "Spot what fairy tales and fables often share, like once upon a time, things in threes and a happy ending."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The baker gave her bread to the hungry children every day, though she had little herself. What is the theme?"
            say: "Read the story. What is the theme?"
            options: ["kindness", "bread", "bakeries"]
            answer: "kindness"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is a theme, not a plot?"
            options: ["good and evil", "the wolf knocks", "a door opens"]
            answer: "good and evil"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Once upon a time, in a land far away …\nWhat kind of story starts like this?"
            say: "Once upon a time, in a land far away. What kind of story do you think starts like this? Have a guess."
          - text: "Once upon a time, in a land far away …"
            say: "A fairy tale! Stories of one kind often share the same features. We call them conventions. Fairy tales often start with Once upon a time and end with a happy ending."
          - text: "three wishes · three brothers · three doors"
            say: "Fairy tales love the number three: three tries, three brothers, three doors. The third time is usually the important one."
          - text: "Did you know?"
            say: "Did you know? Two brothers in Germany, Jacob and Wilhelm Grimm, collected fairy tales, many of them by listening to people tell them. Their first book of tales came out in 1812, more than two hundred years ago. Hansel and Gretel, Snow White and Rapunzel are all in it!"
          - text: "home → journey → challenge → home again"
            say: "Many adventure stories follow the hero's journey: the hero leaves home, goes on a journey, faces a big challenge, and comes home changed. Fables end with a moral, a lesson in one sentence."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which opening is a fairy-tale convention?"
                options: ["Once upon a time, there lived a poor miller.", "Yesterday at 4 pm, I went to the shops.", "Dear Gran, thank you for my present."]
                answer: "Once upon a time, there lived a poor miller."
                hints:
                  - "How do fairy tales often begin?"
                  - "With four words: once upon a time."
                  - "Once upon a time."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The first brother failed. The second brother failed. What usually happens with the third?"
                say: "Read the start of the fairy tale. What usually happens with the third brother?"
                options: ["he succeeds", "he fails too", "he goes home"]
                answer: "he succeeds"
                hints:
                  - "Think of the rule of three."
                  - "The third time is the important one."
                  - "He succeeds."
              - id: l2-f3
                type: ordering
                text: "Put the steps of the hero's journey in order."
                options: ["faces a big challenge", "leaves home", "comes home changed", "goes on a journey"]
                slot_count: 4
                answer: ["leaves home", "goes on a journey", "faces a big challenge", "comes home changed"]
                option_audio: false
                hints:
                  - "Where does the hero start?"
                  - "Home first, home last."
                  - "Leaves home, journey, challenge, comes home changed."
              - id: l2-f4
                type: multiple_choice
                text: "A hare laughed at a slow tortoise and lost the race to it. Which sentence is the moral?"
                say: "Read the fable. Which sentence is the moral?"
                options: ["Slow and steady wins the race.", "Hares are fast animals.", "The race was on a sunny day."]
                answer: "Slow and steady wins the race."
                feedback:
                  "Hares are fast animals.": "That is a fact. A moral is a lesson for the reader."
                hints:
                  - "A moral is a lesson for the reader."
                  - "What does the story teach?"
                  - "Slow and steady wins the race."
              - id: l2-f5
                type: true_false
                text: "Is it true? A happy ending is a convention of most fairy tales."
                answer: true
                hints:
                  - "How do fairy tales usually end?"
                  - "And they all lived happily ever after."
                  - "Yes."
              - id: l2-f6
                type: multiple_choice
                text: "Which story is most likely a fable?"
                options: ["A proud lion learns a lesson from a tiny mouse.", "Mia writes a diary about her holiday.", "A guide explains how volcanoes work."]
                answer: "A proud lion learns a lesson from a tiny mouse."
                hints:
                  - "Fables have talking animals and a lesson."
                  - "Which one has an animal that learns something?"
                  - "The lion and the mouse."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which ending is a fairy-tale convention?"
                options: ["And they lived happily ever after.", "See you next week.", "The end of the instructions."]
                answer: "And they lived happily ever after."
                hints: ["How do fairy tales end?"]
              - id: l2-s2
                type: multiple_choice
                text: "A prince must choose one of three doors. The first two lead nowhere. What usually happens at the third?"
                say: "Read the start of the fairy tale. What usually happens at the third door?"
                options: ["he finds what he is looking for", "it leads nowhere too", "he goes home"]
                answer: "he finds what he is looking for"
                hints: ["The rule of three."]
              - id: l2-s3
                type: true_false
                text: "Is it true? In the hero's journey, the hero usually comes home unchanged."
                answer: false
                hints: ["The journey changes the hero."]
              - id: l2-s4
                type: multiple_choice
                text: "A greedy dog saw its reflection holding a bone and dropped its own bone to grab it. Which sentence is the moral?"
                say: "Read the fable. Which sentence is the moral?"
                options: ["Being greedy can leave you with nothing.", "Dogs like bones.", "The river was deep."]
                answer: "Being greedy can leave you with nothing."
                hints: ["A moral is a lesson."]
              - id: l2-s5
                type: multiple_choice
                text: "Which is a convention of fairy tales?"
                options: ["a wise helper, such as a fairy godmother", "a list of ingredients", "a date at the top"]
                answer: "a wise helper, such as a fairy godmother"
                hints: ["Who helps the hero in fairy tales?"]
              - id: l2-s6
                type: ordering
                text: "Put the steps of the hero's journey in order."
                options: ["comes home changed", "goes on a journey", "leaves home", "faces a big challenge"]
                slot_count: 4
                answer: ["leaves home", "goes on a journey", "faces a big challenge", "comes home changed"]
                option_audio: false
                hints: ["Home first, home last."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which opening is a fairy-tale convention?"
                options: ["Long, long ago, in a castle by the sea, lived a king.", "Step 1: wash your hands.", "Hi! My name is Tom."]
                answer: "Long, long ago, in a castle by the sea, lived a king."
              - id: l2-n2
                type: multiple_choice
                text: "Three goats must cross a troll's bridge. The first two trick the troll. What usually happens with the third?"
                say: "Read the start of the story. What usually happens with the third goat?"
                options: ["it beats the troll", "it turns back", "it is eaten"]
                answer: "it beats the troll"
              - id: l2-n3
                type: true_false
                text: "Is it true? Fables usually end with a moral."
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "An ant worked all summer while a grasshopper sang. In winter, only the ant had food. Which sentence is the moral?"
                say: "Read the fable. Which sentence is the moral?"
                options: ["Plan ahead for hard times.", "Grasshoppers sing well.", "Winter is cold."]
                answer: "Plan ahead for hard times."
              - id: l2-n5
                type: multiple_choice
                text: "Which story follows the hero's journey?"
                options: ["A boy leaves his village, crosses the mountains, defeats a giant and returns a leader.", "A girl eats her breakfast and goes to school.", "A recipe for soup."]
                answer: "A boy leaves his village, crosses the mountains, defeats a giant and returns a leader."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: theme
            type: multiple_choice
            text: "The fisherman threw back the small fish, and the next day it led him to a huge catch. What is the theme?"
            say: "Read the story. What is the theme?"
            options: ["kindness is rewarded", "fishing boats", "the sea"]
            answer: "kindness is rewarded"
          - id: l2-c2
            part: theme-plot
            type: multiple_choice
            text: "Which is a theme, not a plot?"
            options: ["friendship", "the owl hoots", "a train leaves"]
            answer: "friendship"
          - id: l2-c3
            part: fable-journey
            type: multiple_choice
            text: "A crow dropped pebbles into a jug until the water rose high enough to drink. Which sentence is the moral?"
            say: "Read the fable. Which sentence is the moral?"
            options: ["Clever thinking solves problems.", "Crows are black.", "The jug was made of clay."]
            answer: "Clever thinking solves problems."
          - id: l2-c4
            part: fairy-tale
            type: true_false
            text: "Is it true? Things happening in threes is a convention of fairy tales."
            answer: true
          - id: l2-c5
            part: fairy-tale
            type: multiple_choice
            text: "Which is not a fairy-tale convention?"
            options: ["a list of facts with headings", "a happy ending", "a wicked character"]
            answer: "a list of facts with headings"
          - id: l2-c6
            part: theme
            type: multiple_choice
            text: "Priya lost the spelling bee, but she shook the winner's hand and cheered for her. What is the theme?"
            say: "Read the story. What is the theme?"
            options: ["being a good sport", "spelling", "prizes"]
            answer: "being a good sport"
          - id: l2-c7
            part: theme
            type: multiple_choice
            text: "Hugo moved to a new country and spoke no English. Bit by bit, a girl in his class taught him words, and by the summer they were laughing at each other's jokes. What is the theme?"
            say: "Read the story. What is the theme?"
            options: ["friendship", "summer holidays", "a new country"]
            answer: "friendship"
          - id: l2-c8
            part: theme
            type: true_false
            text: "Rob played games late every night, so he fell asleep in his test. Is the theme courage?"
            say: "Read the story. Is the theme courage?"
            answer: false
          - id: l2-c9
            part: theme
            type: multiple_choice
            text: "A rich man would not help an old woman at his door. She was really a fairy, and she turned his palace into a hut. What is the theme?"
            say: "Read the story. What is the theme?"
            options: ["selfishness is punished", "palaces are big", "fairies are small"]
            answer: "selfishness is punished"
          - id: l2-c10
            part: theme-plot
            type: multiple_choice
            text: "Which is a plot, not a theme?"
            options: ["a girl finds a map", "honesty", "courage"]
            answer: "a girl finds a map"
          - id: l2-c11
            part: theme-plot
            type: true_false
            text: "Is it true? \"A wolf blows a house down\" is a theme."
            answer: false
          - id: l2-c12
            part: theme-plot
            type: multiple_choice
            text: "A boy and his grandad build a boat together and sail it across the lake. Which of these is the plot?"
            say: "Read the story. Which of these is the plot?"
            options: ["a boy and his grandad build a boat", "love in a family", "courage"]
            answer: "a boy and his grandad build a boat"
          - id: l2-c13
            part: theme-plot
            type: multiple_choice
            text: "A fox and a stork invited each other to dinner, and each served food the other could not eat. Which gives the theme, not the plot?"
            say: "Read the fable. Which gives the theme, not the plot?"
            options: ["treating others as you want to be treated", "the fox served soup in a flat dish", "the stork had a long beak"]
            answer: "treating others as you want to be treated"
          - id: l2-c14
            part: fairy-tale
            type: multiple_choice
            text: "Which line sounds like the end of a fairy tale?"
            options: ["And the king and queen lived happily ever after.", "Turn left at the traffic lights.", "Thank you for reading my report."]
            answer: "And the king and queen lived happily ever after."
          - id: l2-c15
            part: fairy-tale
            type: multiple_choice
            text: "A girl must guess the giant's name. Her first guess is wrong. Her second guess is wrong. What usually happens next?"
            say: "Read the start of the fairy tale. What usually happens next?"
            options: ["her third guess is right", "she gives up", "the giant tells her"]
            answer: "her third guess is right"
          - id: l2-c16
            part: fairy-tale
            type: true_false
            text: "Is it true? Fairy tales often have a wicked character, such as a witch or a wolf."
            answer: true
          - id: l2-c17
            part: fable-journey
            type: multiple_choice
            text: "A shepherd boy kept shouting \"Wolf!\" as a joke. When a real wolf came, nobody believed him. Which sentence is the moral?"
            say: "Read the fable. Which sentence is the moral?"
            options: ["Nobody believes a liar, even when he tells the truth.", "Wolves eat sheep.", "The boy lived on a hill."]
            answer: "Nobody believes a liar, even when he tells the truth."
          - id: l2-c18
            part: fable-journey
            type: ordering
            text: "Put the story in the order of the hero's journey."
            say: "Put the parts of Asha's story in the order of the hero's journey."
            options: ["Asha climbs the frozen mountain.", "Asha returns home wiser and braver.", "Asha leaves her village to find a cure.", "Asha outwits the snow dragon."]
            slot_count: 4
            answer: ["Asha leaves her village to find a cure.", "Asha climbs the frozen mountain.", "Asha outwits the snow dragon.", "Asha returns home wiser and braver."]
            option_audio: false
          - id: l2-c19
            part: fable-journey
            type: multiple_choice
            text: "In the hero's journey, what happens after the big challenge?"
            options: ["the hero comes home changed", "the hero leaves home", "the hero sets off on the journey"]
            answer: "the hero comes home changed"
          - id: l2-c20
            part: fable-journey
            type: multiple_choice
            text: "Which sentence could be the moral of a fable?"
            options: ["Look before you leap.", "The frog jumped into the well.", "It was a hot day."]
            answer: "Look before you leap."
