# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.word-list-3-4
skill: lit-en.spelling.word-list-3-4
curriculum: en-GB
language: en
title:
  de: Wörter der Liste für Year 3 und 4 schreiben
  en: Spelling the Year 3 and 4 words
summary: >
  The statutory word list for Years 3 and 4 holds words that are often
  misspelt (separate, February, believe, library, surprise). Lesson 1
  finds the tricky part of each word and chooses the right spelling;
  lesson 2 uses spelling strategies (say it as it is spelt, a word inside
  a word, a memory sentence) and writes the words from dictation, then
  ends with the skill check.
metadata:
  year: year-4
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.spelling.exception-words-y2]
  also_practises: [lit-en.word-reading.exception-words-ks2]
  vocabulary: { en: [tricky part, statutory word list, spelling strategy, syllable, memory sentence, word inside a word, proof-read] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: vowel, what: { de: "der unklare Vokal in einer unbetonten Silbe (separate, grammar, popular)", en: "the unclear vowel in an unstressed syllable (separate, grammar, popular)" } }
    - { id: lost-sound, what: { de: "Laute, die man beim Sprechen verschluckt (February, library, probably)", en: "sounds we skip when we speak (February, library, probably)" } }
    - { id: tricky-letters, what: { de: "ie, ei, gh und andere schwierige Buchstaben (believe, weight, height)", en: "ie, ei, gh and other tricky letters (believe, weight, height)" } }
    - { id: in-sentence, what: { de: Wörter der Liste im Satz schreiben und Fehler finden, en: writing list words in a sentence and spotting misspellings } }
  misconceptions:
    - id: spell-as-said
      what: Writes the word the way it is often said (Febuary, libary, suprise, intresting)
      addressed: lesson 2 Learn screen 1 (say it as it is spelt); tasks l1-f2 (feedback), l1-s2, l2-f1, l2-n2
    - id: swap-vowel
      what: Picks the wrong vowel in an unstressed syllable (seperate, definate, grammer)
      addressed: lesson 1 Learn screen 2; tasks l1-f1 (feedback), l1-f3, l1-n3, l2-f3, l2-c2
    - id: ie-ei-mix
      what: Mixes up ie and ei (beleive, recieve, wieght)
      addressed: tasks l1-f4, l1-s4, l2-s3, l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Der schwierige Teil, en: Find the tricky part }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of because is right?"
            options: ["because", "becos", "becuase"]
            answer: "because"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of friend is right?"
            options: ["friend", "freind", "frend"]
            answer: "friend"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "separate  February  library  surprise  believe"
            say: "These words are on the Year 3 and 4 word list. Many grown-ups misspell them too. The trick is to find the part that is hard, and learn that part."
          - text: "sep a rate"
            say: "Separate. When we say it, the middle sounds unclear, so people write e. The tricky part is the a in the middle. Remember: there is a rat in separate."
          - text: "Feb ru ary   lib rar y   sur prise"
            say: "Some words lose a sound when we say them fast. We say Febuary, but it is spelt February, with an r after the b. Library has two r's. Surprise has an r after the u."
          - text: "believe   piece   receive"
            say: "Words with ie and ei need care. Believe and piece have i before e. Receive has e before i, because it comes after c. Learn each word as you meet it."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Which spelling of separate is right?"
                options: ["separate", "seperate", "seprate"]
                answer: "separate"
                option_audio: false
                feedback:
                  "seperate": "The middle letter is a, not e. There is a rat in separate."
                hints:
                  - "The tricky part is the middle vowel."
                  - "Think of the rat hiding in the word."
                  - "separate, with a in the middle."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Which spelling of February is right?"
                options: ["February", "Febuary", "Febrary"]
                answer: "February"
                option_audio: false
                feedback:
                  "Febuary": "We often say Febuary, but there is an r after the b: Feb, ru, ary."
                hints:
                  - "Say it slowly, the way it is spelt."
                  - "Feb, ru, ary. Can you hear the r after the b?"
                  - "February."
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Fill the gap to spell the word grammar."
                frame: "gramm_r"
                options: ["a", "e", "o"]
                answer: ["a"]
                hints:
                  - "Grammar ends with a sound that could be spelt many ways."
                  - "It is not er like in hammer."
                  - "a: grammar."
              - id: l1-f4
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Which spelling of believe is right?"
                options: ["believe", "beleive", "belive"]
                answer: "believe"
                option_audio: false
                hints:
                  - "Is it ie or ei?"
                  - "Never believe a lie: there is a lie inside believe."
                  - "believe."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the tricky part."
                say: "February is split into parts. Tap the part people often leave out when they say it."
                show: { drawn: letter-card, text: "Feb ru ary" }
                spans: ["ru"]
                hints:
                  - "Say each part slowly."
                  - "People say Febuary. Which part goes missing?"
                  - "ru, the part after Feb."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Which spelling of different is right?"
                options: ["different", "diffrent", "diferent"]
                answer: "different"
                option_audio: false
                hints: ["Say it in three parts: dif, fer, ent."]
              - id: l1-s2
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Which spelling of surprise is right?"
                options: ["surprise", "suprise", "surprize"]
                answer: "surprise"
                option_audio: false
                hints: ["There is an r after the u: sur, prise."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Fill the gap to spell the word calendar."
                frame: "calend_r"
                options: ["a", "e", "u"]
                answer: ["a"]
                hints: ["Calendar ends like grammar."]
              - id: l1-s4
                type: multiple_choice
                text: "Which spelling is right? It means how heavy something is."
                say: "Which spelling of weight is right? It means how heavy something is."
                options: ["weight", "wieght", "wait"]
                answer: "weight"
                option_audio: false
                hints: ["Weight is like eight, with a w in front."]
              - id: l1-s5
                type: multiple_choice
                text: "Which spelling is right? It means not bent or curved."
                say: "Which spelling of straight is right? It means not bent or curved."
                options: ["straight", "strait", "straigt"]
                answer: "straight"
                option_audio: false
                hints: ["The tricky part is aigh in the middle: str, aigh, t."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Which spelling of favourite is right?"
                options: ["favourite", "favorite", "favrite"]
                answer: "favourite"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Which spelling of probably is right?"
                options: ["probably", "probly", "probabley"]
                answer: "probably"
                option_audio: false
              - id: l1-n3
                type: fill_in_blank
                text: "Fill the gap."
                say: "Fill the gap to spell the word particular."
                frame: "particul_r"
                options: ["a", "e", "o"]
                answer: ["a"]
              - id: l1-n4
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Which spelling of height is right?"
                options: ["height", "hight", "hieght"]
                answer: "height"
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Which spelling of knowledge is right?"
                options: ["knowledge", "nowledge", "knowlege"]
                answer: "knowledge"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of library is right?"
            options: ["library", "libary", "librery"]
            answer: "library"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which spelling is right? It means a part of something."
            say: "Which spelling of piece is right? It means a part of something, like a piece of cake."
            options: ["piece", "peice", "peace"]
            answer: "piece"
            option_audio: false
          - id: l1-c3
            type: fill_in_blank
            text: "Fill the gap."
            say: "Fill the gap to spell the word popular."
            frame: "popul_r"
            options: ["a", "e", "o"]
            answer: ["a"]
          - id: l1-c4
            type: multiple_choice
            text: "Which spelling is right?\nTake a deep ___."
            say: "Which spelling of breath is right? Take a deep breath."
            options: ["breath", "breth", "breathe"]
            answer: "breath"
            option_audio: false
          - id: l1-c5
            type: fill_in_blank
            text: "Fill the gap."
            say: "Fill the gap to spell the word quarter."
            frame: "qu_rter"
            options: ["a", "o", "or"]
            answer: ["a"]
          - id: l1-c6
            type: multiple_choice
            text: "Which spelling is right? It means maybe."
            say: "Which spelling of perhaps is right? It means maybe."
            options: ["perhaps", "perhap", "prehaps"]
            answer: "perhaps"
            option_audio: false

  - n: 2
    title: { de: Strategien und Diktat, en: Strategies and dictation }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of February is right?"
            options: ["February", "Febuary", "Feburary"]
            answer: "February"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of separate is right?"
            options: ["separate", "seperate", "separete"]
            answer: "separate"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Say it as it is spelt:\nWed nes day   in ter est ing   Feb ru ary"
            say: "Strategy one: say it as it is spelt. Say each part clearly in your head, even the parts we skip when we speak: in, ter, est, ing. Then write what you said."
          - text: "A word inside a word:\nheart has ear   island has is land   a piece of pie"
            say: "Strategy two: find a word inside the word. Heart has ear in it. Island is is and land. A piece of pie helps you spell piece."
          - text: "A memory sentence:\nNever believe a lie.\nThere is a rat in separate."
            say: "Strategy three: a memory sentence. Never believe a lie reminds you of the ie in believe. Make up your own for the words you find hard."
          - text: "Look, say, cover, write, check."
            say: "When you learn a word, look at it, say it, cover it, write it, then check it. Then write it again from memory another day."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which strategy helps most with interesting?"
                options: ["say it as it is spelt: in, ter, est, ing", "find a word inside: in", "it rhymes with resting"]
                answer: "say it as it is spelt: in, ter, est, ing"
                hints:
                  - "Which part do we skip when we say it fast?"
                  - "We often say intresting and lose a sound."
                  - "Say it as it is spelt: in, ter, est, ing."
                difficulty: easy
              - id: l2-f2
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nWe borrowed three books from the ______."
                say: "Write the word library. We borrowed three books from the library."
                answer: "library"
                hints:
                  - "Say it as it is spelt: lib, rar, y."
                  - "It has two r's."
                  - "l, i, b, r, a, r, y."
              - id: l2-f3
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nPlease ______ the red pens from the blue pens."
                say: "Write the word separate. Please separate the red pens from the blue pens."
                answer: "separate"
                hints:
                  - "Remember the rat."
                  - "sep, a, rate."
                  - "s, e, p, a, r, a, t, e."
              - id: l2-f4
                type: highlight_in_text
                text: "Tap the words that are spelt wrong."
                say: "Proof-read the sentence. Tap every word that is spelt wrong."
                show: { drawn: letter-card, text: "My birthday is in Febuary and I want a suprise." }
                spans: ["Febuary", "suprise"]
                hints:
                  - "Two words are spelt the way people say them."
                  - "Check the month and the last word."
                  - "Febuary and suprise."
              - id: l2-f5
                type: multiple_choice
                text: "Which word inside heart helps you remember the ea in the middle?"
                options: ["ear", "art", "he"]
                answer: "ear"
                hints:
                  - "Find a short word that has e and a in it."
                  - "You hear with it."
                  - "ear: h, ear, t."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nI ______ the rain will stop soon."
                say: "Write the word suppose. I suppose the rain will stop soon."
                answer: "suppose"
                hints: ["It has a double p."]
              - id: l2-s2
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nMy birthday is in ______."
                say: "Write the month February. My birthday is in February."
                answer: "February"
                hints: ["Feb, ru, ary. A month starts with a capital letter."]
              - id: l2-s3
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nI ______ in fairies."
                say: "Write the word believe. I believe in fairies."
                answer: "believe"
                hints: ["Never believe a lie."]
              - id: l2-s4
                type: highlight_in_text
                text: "Tap the word that is spelt wrong."
                say: "Proof-read the sentence. Tap the word that is spelt wrong."
                show: { drawn: letter-card, text: "It was a diffrent kind of question." }
                spans: ["diffrent"]
                hints: ["Say each word in parts."]
              - id: l2-s5
                type: multiple_choice
                text: "Which memory sentence helps you spell piece?"
                options: ["a piece of pie", "peace and quiet", "please sit down"]
                answer: "a piece of pie"
                hints: ["Piece starts with the same letters as another food word."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nWe met in the ______ of the town."
                say: "Write the word centre. We met in the centre of the town."
                answer: "centre"
              - id: l2-n2
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nThe film was really ______."
                say: "Write the word interesting. The film was really interesting."
                answer: "interesting"
              - id: l2-n3
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nWe went to a ______ party."
                say: "Write the word surprise. We went to a surprise party."
                answer: "surprise"
              - id: l2-n4
                type: highlight_in_text
                text: "Tap the words that are spelt wrong."
                say: "Proof-read the sentence. Tap every word that is spelt wrong."
                show: { drawn: letter-card, text: "I probly left my favorite coat at the library." }
                spans: ["probly", "favorite"]
              - id: l2-n5
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nThe road to the farm is long and ______."
                say: "Write the word straight. The road to the farm is long and straight."
                answer: "straight"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: in-sentence
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nI woke up ______ on Saturday."
            say: "Write the word early. I woke up early on Saturday."
            answer: "early"
          - id: l2-c2
            part: vowel
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of grammar is right?"
            options: ["grammar", "grammer", "gramar"]
            answer: "grammar"
            option_audio: false
          - id: l2-c3
            part: tricky-letters
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nThe ______ of the parcel is two kilograms."
            say: "Write the word weight. The weight of the parcel is two kilograms."
            answer: "weight"
          - id: l2-c4
            part: vowel
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Proof-read the sentence. Tap the word that is spelt wrong."
            show: { drawn: letter-card, text: "We need a new calender for next year." }
            spans: ["calender"]
          - id: l2-c5
            part: in-sentence
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nI will be ready in a ______."
            say: "Write the word minute. I will be ready in a minute."
            answer: "minute"
          - id: l2-c6
            part: vowel
            type: fill_in_blank
            text: "Fill the gap."
            say: "Fill the gap to spell the word regular."
            frame: "regul_"
            options: ["ar", "er", "or"]
            answer: ["ar"]
          - id: l2-c7
            part: vowel
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of peculiar is right?"
            options: ["peculiar", "peculier", "peculer"]
            answer: "peculiar"
            option_audio: false
          - id: l2-c8
            part: vowel
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nThe shop is ______ the park."
            say: "Write the word opposite. The shop is opposite the park."
            answer: "opposite"
          - id: l2-c9
            part: lost-sound
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of medicine is right?"
            options: ["medicine", "medcine", "medisine"]
            answer: "medicine"
            option_audio: false
          - id: l2-c10
            part: lost-sound
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nIt was just an ______ day."
            say: "Write the word ordinary. It was just an ordinary day."
            answer: "ordinary"
          - id: l2-c11
            part: lost-sound
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Proof-read the sentence. Tap the word that is spelt wrong."
            show: { drawn: letter-card, text: "I like histry more than any other subject." }
            spans: ["histry"]
          - id: l2-c12
            part: lost-sound
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of actually is right?"
            options: ["actually", "actully", "actualy"]
            answer: "actually"
            option_audio: false
          - id: l2-c13
            part: lost-sound
            type: fill_in_blank
            text: "Fill the gap."
            say: "Fill the gap to spell the word different."
            frame: "diff_rent"
            options: ["e", "a", "u"]
            answer: ["e"]
          - id: l2-c14
            part: tricky-letters
            type: multiple_choice
            text: "Which spelling is right? It comes after seventh."
            say: "Which spelling of eighth is right? It comes after seventh."
            options: ["eighth", "eigth", "eight"]
            answer: "eighth"
            option_audio: false
          - id: l2-c15
            part: tricky-letters
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nTwo soldiers stood ______ outside the castle."
            say: "Write the word guard. Two soldiers stood guard outside the castle."
            answer: "guard"
          - id: l2-c16
            part: tricky-letters
            type: highlight_in_text
            text: "Tap the word that is spelt wrong."
            say: "Proof-read the sentence. Tap the word that is spelt wrong."
            show: { drawn: letter-card, text: "Have you had enuff to eat?" }
            spans: ["enuff"]
          - id: l2-c17
            part: tricky-letters
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Which spelling of caught is right? The goalkeeper caught the ball."
            options: ["caught", "cawt", "cought"]
            answer: "caught"
            option_audio: false
          - id: l2-c18
            part: in-sentence
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nIt is ______ to wear a helmet on a bike."
            say: "Write the word important. It is important to wear a helmet on a bike."
            answer: "important"
          - id: l2-c19
            part: in-sentence
            type: highlight_in_text
            text: "Tap the words that are spelt wrong."
            say: "Proof-read the sentence. Tap every word that is spelt wrong."
            show: { drawn: letter-card, text: "I thort I herd a noise in the garden." }
            spans: ["thort", "herd"]
          - id: l2-c20
            part: in-sentence
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nWe walked ______ the dark forest."
            say: "Write the word through. We walked through the dark forest."
            answer: "through"
