# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.words-in-context
skill: lit-en.comprehension.words-in-context
curriculum: en-GB
language: en
title:
  de: Wortbedeutung aus dem Zusammenhang
  en: Word meanings in context
summary: >
  The words around an unknown word are clues to its meaning (famished
  after a long walk, so he ate three sandwiches). Lesson 1 uses clues in
  the sentence and the next sentence to work out meanings and checks them
  by putting a simpler word in its place; lesson 2 picks the right meaning
  of a word with several meanings from a dictionary entry and ends with
  the skill check.
metadata:
  year: year-4
  topic: { de: Wörter im Text, en: Words in texts }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.comprehension.word-meanings, lit-en.spelling.dictionary-ks2]
  also_practises: [lit-en.comprehension.retrieve]
  vocabulary: { en: [context, clue, meaning, definition, dictionary entry, synonym, swap test] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: meaning, what: { de: die Bedeutung eines Wortes aus dem Zusammenhang erschließen, en: working out what a word means from its context } }
    - { id: clue-words, what: { de: die Hinweiswörter im Satz finden, en: finding the clue words in the sentence } }
    - { id: swap, what: { de: eine Bedeutung mit der Austauschprobe prüfen, en: checking a meaning with the swap test } }
    - { id: dictionary, what: { de: im Wörterbuch die passende Bedeutung wählen, en: choosing the meaning that fits from a dictionary entry } }
  misconceptions:
    - id: guess-from-look
      what: Guesses a meaning from a word that looks similar, ignoring the sentence (deserted means dessert)
      addressed: lesson 1 Learn screens 1 to 3; tasks l1-f1 (feedback), l1-f3, l1-s1, l1-n2, l2-c1
    - id: first-definition
      what: Takes the first meaning in the dictionary even when it does not fit the sentence
      addressed: lesson 2 Learn screen 3; tasks l2-f1 (feedback), l2-f3, l2-s1, l2-n1, l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Hinweise im Satz, en: Clues in the sentence }
    goal:
      de: "Nutze Hinweise rund um ein neues Wort, um seine Bedeutung herauszufinden. Nach einem langen Spaziergang heißt famished sehr hungrig."
      en: "Use clues around a new word to work out what it means, like famished after a long walk means very hungry."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which word means nearly the same as huge?"
            options: ["enormous", "tiny", "heavy"]
            answer: "enormous"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word comes first in a dictionary?\nnarrow   nest   nature"
            options: ["narrow", "nature", "nest"]
            answer: "narrow"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Grandpa was famished after the long walk, so he ate three sandwiches."
            say: "What do you think famished means? Look for clues in the sentence, and have a guess."
          - text: "famished = very hungry"
            say: "He had a long walk, and then he ate three sandwiches. So famished must mean very hungry. The clues told you!"
          - text: "The shop was deserted. There was nobody inside."
            say: "Deserted looks a bit like dessert, but that does not help. The next sentence is the clue: there was nobody inside. Deserted means empty."
          - text: "The shop was empty. There was nobody inside."
            say: "Check your meaning with the swap test. Put your simpler word in place of the hard one. If the sentence still makes sense, your meaning fits."
          - text: "Clues can come before the word, after it, or in the next sentence."
            say: "So when you meet a new word, read the whole sentence and the one after it. Then try the swap test."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The ancient castle was built more than 800 years ago.\n\nWhat does ancient mean?"
                options: ["very old", "very big", "made of stone"]
                answer: "very old"
                feedback:
                  "made of stone": "Many castles are stone, but which clue is in the sentence? More than 800 years ago tells you it is very old."
                hints:
                  - "Which words in the sentence are a clue?"
                  - "Built more than 800 years ago."
                  - "Ancient means very old."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the word that is the best clue to the meaning of timid."
                say: "Tap the word that tells you most about what timid means."
                show: { drawn: letter-card, text: "The timid kitten hid under the bed when visitors came." }
                spans: ["hid"]
                hints:
                  - "What does the kitten do?"
                  - "It goes away from people when they come."
                  - "hid."
              - id: l1-f3
                type: multiple_choice
                text: "Ruby was drenched. Water dripped from her hair and her socks squelched.\n\nWhat does drenched mean?"
                options: ["very wet", "very cold", "very tired"]
                answer: "very wet"
                hints:
                  - "Read the next sentence."
                  - "Dripping hair and squelching socks."
                  - "Very wet."
              - id: l1-f4
                type: multiple_choice
                text: "Oscar was reluctant to jump into the cold pool, so he waited on the side.\n\nWhich word passes the swap test for reluctant?"
                options: ["unwilling", "excited", "able"]
                answer: "unwilling"
                hints:
                  - "Try each word in the sentence."
                  - "He waited on the side: did he want to jump?"
                  - "Unwilling: Oscar was unwilling to jump."
              - id: l1-f5
                type: true_false
                text: "The grass glistened with dew in the morning sun.\n\nIs it true? Glistened means shone or sparkled."
                answer: true
                hints:
                  - "What does the sun do to wet grass?"
                  - "Try the swap: the grass sparkled with dew."
                  - "Yes, it means shone or sparkled."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The path was so narrow that we had to walk in single file.\n\nWhat does narrow mean?"
                options: ["not wide", "very long", "muddy"]
                answer: "not wide"
                hints: ["In single file means one behind the other."]
              - id: l1-s2
                type: multiple_choice
                text: "The crowd roared with delight when the team scored. Everyone cheered and hugged.\n\nWhat does delight mean?"
                options: ["great happiness", "anger", "surprise and fear"]
                answer: "great happiness"
                hints: ["Cheering and hugging are clues."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the two clue words for the meaning of exhausted."
                say: "Tap the two words that help you work out what exhausted means."
                show: { drawn: letter-card, text: "After the race Kai was exhausted and fell asleep on the sofa." }
                spans: ["fell", "asleep"]
                hints: ["What did Kai do after the race?"]
              - id: l1-s4
                type: multiple_choice
                text: "The fox crept stealthily towards the hens, making no sound at all.\n\nWhich word passes the swap test for stealthily?"
                options: ["quietly", "quickly", "angrily"]
                answer: "quietly"
                hints: ["Making no sound at all is the clue."]
              - id: l1-s5
                type: true_false
                text: "The soup was scalding, so Dad blew on it before he tasted it.\n\nIs it true? Scalding means very cold."
                answer: false
                hints: ["Why do you blow on soup?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The baby was content after her bottle. She smiled and closed her eyes.\n\nWhat does content mean here?"
                options: ["happy and calm", "hungry", "upset"]
                answer: "happy and calm"
              - id: l1-n2
                type: multiple_choice
                text: "The field was barren. Nothing grew there, not even weeds.\n\nWhat does barren mean?"
                options: ["with no plants", "full of animals", "a kind of barn"]
                answer: "with no plants"
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the two clue words for the meaning of fragile."
                say: "Tap the two words that help you work out what fragile means."
                show: { drawn: letter-card, text: "This vase is fragile, so it breaks easily." }
                spans: ["breaks", "easily"]
              - id: l1-n4
                type: multiple_choice
                text: "Nobody could open the ancient chest, because the lid was jammed with rust.\n\nWhich word passes the swap test for jammed?"
                options: ["stuck", "cleaned", "painted"]
                answer: "stuck"
              - id: l1-n5
                type: true_false
                text: "The pupils were puzzled by the question and frowned at the board.\n\nIs it true? Puzzled means confused."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The giant took enormous steps, and the ground shook each time.\n\nWhat does enormous mean?"
            options: ["very big", "very quiet", "very fast"]
            answer: "very big"
          - id: l1-c2
            type: multiple_choice
            text: "The ice on the pond was thin and treacherous, so nobody walked on it.\n\nWhat does treacherous mean here?"
            options: ["dangerous", "beautiful", "slippery and fun"]
            answer: "dangerous"
          - id: l1-c3
            type: true_false
            text: "Mum was furious when the dog chewed her new shoes. She shouted for ten minutes.\n\nIs it true? Furious means very pleased."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "The mouse was minute, so it could squeeze through the tiny gap.\n\nWhat does minute mean here?"
            options: ["very small", "sixty seconds", "very fast"]
            answer: "very small"
          - id: l1-c5
            type: highlight_in_text
            text: "Tap the word that is the best clue to the meaning of soggy."
            say: "Tap the word that tells you most about what soggy means."
            show: { drawn: letter-card, text: "The bread was soggy after it fell in the puddle." }
            spans: ["puddle"]
          - id: l1-c6
            type: multiple_choice
            text: "The room was cluttered, with toys, books and clothes everywhere.\n\nWhich word passes the swap test for cluttered?"
            options: ["messy", "empty", "quiet"]
            answer: "messy"

  - n: 2
    title: { de: Die passende Bedeutung im Wörterbuch, en: The right meaning in the dictionary }
    goal:
      de: "Wähl im Wörterbuch die Bedeutung, die zu deinem Satz passt, so wie bark als Baumrinde, nicht als Hundebellen."
      en: "Pick the dictionary meaning that fits your sentence, like bark on a tree, not a dog's bark."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The lane was so narrow that two cars could not pass.\n\nWhat does narrow mean?"
            options: ["not wide", "very busy", "very old"]
            answer: "not wide"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? The swap test means putting a simpler word in place of the hard one."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The dog's bark was loud.\nThe tree's bark was rough.\nIs bark the same thing in both?"
            say: "Read both sentences. Do you think bark means the same thing in both? Have a guess."
          - text: "bark\n1. the sharp sound a dog makes\n2. the rough outside layer of a tree"
            say: "No, it doesn't! Some words have more than one meaning. A dictionary entry numbers them. Bark can be the sound a dog makes, or the outside of a tree."
          - text: "A beetle hid under the bark of the old oak.\nMeaning 2"
            say: "To choose, read the sentence again. The beetle hid under the bark of an oak tree, so meaning 2 fits. The first meaning is not always the right one."
          - text: "1. Find the word.\n2. Read every meaning.\n3. Pick the one that fits your sentence.\n4. Do the swap test."
            say: "So: find the word, read every meaning, pick the one that fits the sentence, then do the swap test to check."
          - text: "Did you know?"
            say: "Did you know? The little word set has hundreds of meanings in the Oxford English Dictionary, one of the biggest dictionaries of English. You can set the table, set an alarm, and watch the sun set!"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "light\n1. not heavy\n2. brightness that lets you see\n\n\"My bag is light because it is empty.\"\nWhich meaning fits?"
                options: ["1", "2"]
                answer: "1"
                keep_order: true
                feedback:
                  "2": "Read the sentence again. An empty bag is not bright; it is not heavy. Meaning 1 fits."
                hints:
                  - "Read the sentence again: why is the bag light?"
                  - "It is empty, so it weighs very little."
                  - "Meaning 1: not heavy."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "fair\n1. treating everyone in the same way\n2. an event with rides and games\n\n\"We went on the big wheel at the fair.\"\nWhich meaning fits?"
                options: ["1", "2"]
                answer: "2"
                keep_order: true
                hints:
                  - "Where can you ride a big wheel?"
                  - "Rides and games."
                  - "Meaning 2."
              - id: l2-f5
                type: matching
                text: "Match each sentence to the meaning of bat."
                say: "Bat has two meanings. Match each sentence to the meaning that fits."
                pairs:
                  - { left: { text: "The bat flew out of the cave at dusk." }, right: { text: "a small flying animal" } }
                  - { left: { text: "She hit the ball with her bat." }, right: { text: "a stick for hitting a ball" } }
                hints:
                  - "Which bat can fly?"
                  - "Which bat hits a ball?"
                  - "The cave bat is an animal; the other is a stick."
              - id: l2-f3
                type: multiple_choice
                text: "match\n1. a small stick that makes a flame\n2. a game between two teams\n3. to go well together\n\n\"Her scarf and gloves match.\"\nWhich meaning fits?"
                options: ["1", "2", "3"]
                answer: "3"
                keep_order: true
                hints:
                  - "Read all three meanings."
                  - "A scarf and gloves are not a flame or a game."
                  - "Meaning 3: to go well together."
              - id: l2-f4
                type: multiple_choice
                text: "The king wore a heavy crown at his coronation.\n\nYou are not sure what coronation means. What should you do?"
                options: ["work out a meaning from the clues, then check it in a dictionary", "skip the sentence", "guess from a word that looks the same"]
                answer: "work out a meaning from the clues, then check it in a dictionary"
                hints:
                  - "What do good readers do with a new word?"
                  - "Use the clues: a king and a crown."
                  - "Work it out from the clues, then check it in a dictionary."
          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "ring\n1. a band of metal worn on a finger\n2. the sound a bell or phone makes\n\n\"I heard the ring of the school bell.\"\nWhich meaning fits?"
                options: ["1", "2"]
                answer: "2"
                keep_order: true
                hints: ["You can hear this ring."]
              - id: l2-s2
                type: multiple_choice
                text: "wave\n1. to move your hand to say hello\n2. a line of water moving across the sea\n\n\"A huge wave crashed onto the beach.\"\nWhich meaning fits?"
                options: ["1", "2"]
                answer: "2"
                keep_order: true
                hints: ["What crashes onto a beach?"]
              - id: l2-s5
                type: matching
                text: "Match each sentence to the meaning of bank."
                say: "Bank has two meanings. Match each sentence to the meaning that fits."
                pairs:
                  - { left: { text: "Dad paid the money into the bank." }, right: { text: "a place that keeps money" } }
                  - { left: { text: "We sat on the bank and watched the ducks." }, right: { text: "the ground at the side of a river" } }
                hints: ["Where would you watch ducks?"]
              - id: l2-s3
                type: multiple_choice
                text: "We set off at dawn, when the sky was just turning pink.\n\nWhat does dawn mean?"
                options: ["the start of the day", "the middle of the night", "lunchtime"]
                answer: "the start of the day"
                hints: ["When does the sky first turn pink?"]
              - id: l2-s4
                type: multiple_choice
                text: "spring\n1. the season after winter\n2. a coil of metal that bounces back\n3. to jump up suddenly\n\n\"The cat will spring onto the wall.\"\nWhich meaning fits?"
                options: ["1", "2", "3"]
                answer: "3"
                keep_order: true
                hints: ["What does the cat do?"]
          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "train\n1. a line of carriages on a railway\n2. to practise a sport or skill\n\n\"We train for the race every Tuesday.\"\nWhich meaning fits?"
                options: ["1", "2"]
                answer: "2"
                keep_order: true
              - id: l2-n2
                type: multiple_choice
                text: "rock\n1. a large stone\n2. to move gently from side to side\n\n\"Gran will rock the baby to sleep.\"\nWhich meaning fits?"
                options: ["1", "2"]
                answer: "2"
                keep_order: true
              - id: l2-n3
                type: multiple_choice
                text: "The magician made the coin vanish. One second it was there, the next it was gone.\n\nWhat does vanish mean?"
                options: ["disappear", "spin", "grow"]
                answer: "disappear"
              - id: l2-n4
                type: matching
                text: "Match each sentence to the meaning of watch."
                say: "Watch has two meanings. Match each sentence to the meaning that fits."
                pairs:
                  - { left: { text: "My watch says it is half past three." }, right: { text: "a small clock worn on the wrist" } }
                  - { left: { text: "Watch the birds on the feeder." }, right: { text: "to look at something carefully" } }
              - id: l2-n5
                type: true_false
                text: "star\n1. a ball of burning gas in space\n2. a famous actor or singer\n\n\"The film star waved to the crowd.\"\nIs it true? Meaning 1 fits."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: meaning
            type: multiple_choice
            text: "The hall was silent. Not one person spoke or moved.\n\nWhat does silent mean?"
            options: ["with no sound", "very crowded", "very cold"]
            answer: "with no sound"
          - id: l2-c2
            part: swap
            type: multiple_choice
            text: "The old bridge was unstable, so it wobbled when we stepped on it.\n\nWhich word passes the swap test for unstable?"
            options: ["shaky", "strong", "long"]
            answer: "shaky"
          - id: l2-c3
            part: dictionary
            type: multiple_choice
            text: "duck\n1. a water bird with a flat beak\n2. to bend down quickly to avoid something\n\n\"Duck, or the ball will hit you!\"\nWhich meaning fits?"
            options: ["1", "2"]
            answer: "2"
            keep_order: true
          - id: l2-c4
            part: clue-words
            type: highlight_in_text
            text: "Tap the two clue words for the meaning of soaring."
            say: "Tap the two words that help you work out what soaring means."
            show: { drawn: letter-card, text: "The eagle was soaring high above the mountains." }
            spans: ["high", "above"]
          - id: l2-c5
            part: dictionary
            type: multiple_choice
            text: "kind\n1. friendly and caring\n2. a type or sort\n\n\"What kind of cake would you like?\"\nWhich meaning fits?"
            options: ["1", "2"]
            answer: "2"
            keep_order: true
          - id: l2-c6
            part: meaning
            type: multiple_choice
            text: "The kitchen was immaculate. Every surface shone, and there was not a crumb anywhere.\n\nWhat does immaculate mean?"
            options: ["perfectly clean", "very small", "very messy"]
            answer: "perfectly clean"
          - id: l2-c7
            part: meaning
            type: true_false
            text: "The cave was gloomy, and we could hardly see our hands in front of us.\n\nIs it true? Gloomy means dark."
            answer: true
          - id: l2-c8
            part: meaning
            type: multiple_choice
            text: "Jess was elated when she won the art prize. She jumped up and down and hugged everyone.\n\nWhat does elated mean?"
            options: ["very happy", "very nervous", "very tired"]
            answer: "very happy"
          - id: l2-c9
            part: meaning
            type: true_false
            text: "The old man was frail and needed a stick to walk.\n\nIs it true? Frail means strong and fit."
            answer: false
          - id: l2-c10
            part: clue-words
            type: highlight_in_text
            text: "Tap the word that is the best clue to the meaning of drowsy."
            say: "Tap the word that tells you most about what drowsy means."
            show: { drawn: letter-card, text: "The drowsy baby yawned in her cot." }
            spans: ["yawned"]
          - id: l2-c11
            part: clue-words
            type: highlight_in_text
            text: "Tap the word that is the best clue to the meaning of scorching."
            say: "Tap the word that tells you most about what scorching means."
            show: { drawn: letter-card, text: "It was so scorching that our ice lollies melted." }
            spans: ["melted"]
          - id: l2-c12
            part: clue-words
            type: multiple_choice
            text: "The cottage was isolated. The nearest house was ten miles away.\n\nWhich part is the clue to what isolated means?"
            options: ["The nearest house was ten miles away.", "The cottage", "was"]
            answer: "The nearest house was ten miles away."
            option_audio: false
          - id: l2-c13
            part: clue-words
            type: highlight_in_text
            text: "Tap the two clue words for the meaning of transparent."
            say: "Tap the two words that help you work out what transparent means."
            show: { drawn: letter-card, text: "The glass is transparent, so you can see through it." }
            spans: ["see", "through"]
          - id: l2-c14
            part: swap
            type: multiple_choice
            text: "Amir was anxious before his test and could not stop biting his nails.\n\nWhich word passes the swap test for anxious?"
            options: ["worried", "pleased", "sleepy"]
            answer: "worried"
          - id: l2-c15
            part: swap
            type: multiple_choice
            text: "The hungry children devoured the pizza in two minutes.\n\nWhich word passes the swap test for devoured?"
            options: ["gobbled", "cooked", "shared"]
            answer: "gobbled"
          - id: l2-c16
            part: swap
            type: true_false
            text: "The path was steep, so we puffed and panted all the way up.\n\nIs it true? You could swap steep for flat."
            answer: false
          - id: l2-c17
            part: swap
            type: multiple_choice
            text: "The dog was filthy after rolling in the mud.\n\nWhich sentence passes the swap test for filthy?"
            options: ["The dog was very dirty after rolling in the mud.", "The dog was very clean after rolling in the mud.", "The dog was very fast after rolling in the mud."]
            answer: "The dog was very dirty after rolling in the mud."
            option_audio: false
          - id: l2-c18
            part: dictionary
            type: multiple_choice
            text: "letter\n1. a written message you send to someone\n2. one of the signs we use to write words, such as a or b\n\n\"I posted a letter to my pen pal in Spain.\"\nWhich meaning fits?"
            options: ["1", "2"]
            answer: "1"
            keep_order: true
          - id: l2-c19
            part: dictionary
            type: matching
            text: "Match each sentence to the meaning of play."
            say: "Play has two meanings. Match each sentence to the meaning that fits."
            pairs:
              - { left: { text: "Our class put on a play for the parents." }, right: { text: "a story acted on a stage" } }
              - { left: { text: "The children play in the park after school." }, right: { text: "to have fun with a game or toy" } }
          - id: l2-c20
            part: dictionary
            type: true_false
            text: "fly\n1. a small insect with wings\n2. to move through the air\n\n\"A fly landed on my sandwich.\"\nIs it true? Meaning 1 fits."
            answer: true
