# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.evaluate-improve
skill: lit-en.composition.evaluate-improve
curriculum: en-GB
language: en
title:
  de: Texte beurteilen und verbessern
  en: Evaluating and improving writing
summary: >
  Good writers reread their own work and a partner's, say what works, and
  suggest changes. Lesson 1 improves vocabulary: swaps dull or repeated
  words (nice, said, went) for precise ones and gives useful feedback
  (two stars and a wish); lesson 2 improves grammar: keeps the tense the
  same, joins short sentences with conjunctions, uses pronouns to avoid
  repetition, and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.composition.proof-read]
  also_practises: [lit-en.grammar.pronoun-cohesion, lit-en.grammar.standard-verb-forms]
  vocabulary: { en: [evaluate, improve, edit, feedback, two stars and a wish, precise, repetition, tense, conjunction, pronoun] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: vague-feedback
      what: Gives feedback that does not help (It's good. Make it better.) instead of naming what works and one change
      addressed: lesson 1 Learn screen 3; tasks l1-f4 (feedback), l1-s4, l1-n4, l2-c5
    - id: longer-is-better
      what: Thinks adding more words always improves a sentence (very very nice and lovely)
      addressed: lesson 1 Learn screen 2; tasks l1-f2 (feedback), l1-s2, l1-n2
    - id: tense-drift
      what: Does not notice when the tense changes in the middle of a piece (We walked to the park and we play.)
      addressed: lesson 2 Learn screen 1; tasks l2-f1 (feedback), l2-f2, l2-s1, l2-n1, l2-c2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Bessere Wörter, en: Better words }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tap the word that needs a capital letter."
            say: "Proof-read the sentence. Tap the word that needs a capital letter."
            show: { drawn: letter-card, text: "On saturday we went to the zoo." }
            spans: ["saturday"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which sentence is punctuated correctly?"
            options: ["Where is my coat?", "Where is my coat.", "where is my coat?"]
            answer: "Where is my coat?"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "We went to the beach. It was nice. We had a nice time and nice ice creams."
            say: "Read this short piece. It is correct, but is it good? Nice is used three times and tells us very little. Went is a plain verb too."
          - text: "We raced down to the beach. The sand was warm and golden. We had a brilliant time and huge strawberry ice creams."
            say: "Here it is improved. Raced shows how they went. Warm and golden lets us picture the sand. More words are not always better; precise words are."
          - text: "Star: I like the verb raced. It shows you were excited.\nStar: Warm and golden helps me picture the sand.\nWish: add a sound you could hear at the beach."
            say: "When you give feedback, use two stars and a wish. The stars say exactly what works and why. The wish is one clear change. It's good is not helpful, because it does not say what to keep or change."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"The dog went across the garden after the ball.\"\n\nWhich verb would improve went?"
                options: ["bounded", "was", "had"]
                answer: "bounded"
                hints:
                  - "How might a happy dog move?"
                  - "Choose the verb that shows how it moved."
                  - "bounded."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"The cake was nice.\"\n\nWhich change improves the sentence most?"
                options: ["The cake was light and fluffy.", "The cake was very very nice.", "The cake was nice and nice."]
                answer: "The cake was light and fluffy."
                option_audio: false
                feedback:
                  "The cake was very very nice.": "Very very adds words but no new picture. Precise words like light and fluffy tell the reader more."
                hints:
                  - "Which one lets you picture the cake?"
                  - "Very very adds words but no detail."
                  - "The cake was light and fluffy."
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the word that is repeated too often."
                say: "Read the sentences. Tap the word that is used too many times."
                show: { drawn: letter-card, text: "I said hello. Mum said hi. Then Gran said goodbye." }
                spans: ["said"]
                hints:
                  - "Which word comes three times?"
                  - "It is the verb for speaking."
                  - "said."
              - id: l1-f4
                type: multiple_choice
                text: "Leo wrote: \"The castle stood on a jagged cliff above the stormy sea.\"\n\nWhich is the most helpful feedback?"
                options: ["I like jagged cliff: it makes the castle seem dangerous.", "It's good.", "Make it better."]
                answer: "I like jagged cliff: it makes the castle seem dangerous."
                option_audio: false
                feedback:
                  "It's good.": "That is kind, but Leo does not know what to keep. Name the words that work and say why."
                hints:
                  - "Which comment tells Leo exactly what works?"
                  - "Helpful feedback names words and says why."
                  - "I like jagged cliff: it makes the castle seem dangerous."
              - id: l1-f5
                type: multiple_choice
                text: "“Help!” said Ella as she fell into the river.\n\nWhich verb would improve said?"
                options: ["screamed", "whispered", "mumbled"]
                answer: "screamed"
                hints:
                  - "How would you say Help! if you were falling into a river?"
                  - "Loudly and in fear."
                  - "screamed."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"The man walked slowly up the steep hill.\"\n\nWhich verb could replace walked slowly?"
                options: ["trudged", "sprinted", "skipped"]
                answer: "trudged"
                hints: ["Which verb means walking slowly and with effort?"]
              - id: l1-s2
                type: multiple_choice
                text: "\"It was a big house.\"\n\nWhich change improves the sentence most?"
                options: ["It was a towering house with twenty windows.", "It was a big big house.", "It was a really big and big house."]
                answer: "It was a towering house with twenty windows."
                option_audio: false
                hints: ["Which one adds a picture, not just words?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the word that is repeated too often."
                say: "Read the sentences. Tap the word that is used too many times."
                show: { drawn: letter-card, text: "We had a good lunch. The film was good. It was a good day." }
                spans: ["good"]
                hints: ["Which word comes three times?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which is the most useful wish to give a partner?"
                options: ["Could you change got to a more exciting verb, like grabbed?", "Write more.", "I don't like it."]
                answer: "Could you change got to a more exciting verb, like grabbed?"
                option_audio: false
                hints: ["A good wish says exactly what to change."]
              - id: l1-s5
                type: multiple_choice
                text: "\"The kitten ate its food.\"\n\nWhich verb would improve ate?"
                options: ["nibbled", "was", "went"]
                answer: "nibbled"
                hints: ["How does a small kitten eat?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"The wind moved the trees.\"\n\nWhich verb would improve moved?"
                options: ["shook", "had", "liked"]
                answer: "shook"
              - id: l1-n2
                type: multiple_choice
                text: "\"The weather was bad.\"\n\nWhich change improves the sentence most?"
                options: ["Icy rain lashed against the windows.", "The weather was very bad and bad.", "The weather was really really bad."]
                answer: "Icy rain lashed against the windows."
                option_audio: false
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the word that is repeated too often."
                say: "Read the sentences. Tap the word that is used too many times."
                show: { drawn: letter-card, text: "Then we ate. Then we played. Then we went home." }
                spans: ["Then"]
              - id: l1-n4
                type: multiple_choice
                text: "Priya wrote: \"The fireworks exploded like giant flowers in the sky.\"\n\nWhich is the most helpful star?"
                options: ["Your simile like giant flowers helps me picture the colours.", "Nice work.", "Good."]
                answer: "Your simile like giant flowers helps me picture the colours."
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "\"She was happy when she won.\"\n\nWhich word would improve happy?"
                options: ["thrilled", "fine", "okay"]
                answer: "thrilled"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"The car went down the road.\"\n\nWhich verb would improve went?"
            options: ["zoomed", "was", "did"]
            answer: "zoomed"
          - id: l1-c2
            type: highlight_in_text
            text: "Tap the word that is repeated too often."
            say: "Read the sentences. Tap the word that is used too many times."
            show: { drawn: letter-card, text: "The sea was lovely. The sand was lovely. Our hotel was lovely." }
            spans: ["lovely."]
          - id: l1-c3
            type: multiple_choice
            text: "Which is the most helpful feedback?"
            options: ["I like the word crept: it makes the scene tense.", "It's fine.", "Do it again."]
            answer: "I like the word crept: it makes the scene tense."
            option_audio: false

  - n: 2
    title: { de: Bessere Grammatik, en: Better grammar }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"The boy went out of the room.\"\n\nWhich verb would improve went?"
            options: ["stormed", "had", "was"]
            answer: "stormed"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What does two stars and a wish mean?"
            options: ["two things that work and one change", "two mistakes and one star", "two drawings and a story"]
            answer: "two things that work and one change"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "We walked to the park and we play on the swings.\nWe walked to the park and we played on the swings."
            say: "Check the tense. This story is in the past: walked. So play must change to played. Keep the same tense all the way through."
          - text: "I have a dog. It is black.\nI have a black dog.\nIt was raining. We stayed inside.\nIt was raining, so we stayed inside."
            say: "Lots of short sentences can sound jumpy. You can combine them, or join them with a conjunction such as so, because, but or when. The conjunction shows how the two ideas are linked."
          - text: "We was late. → We were late.\nI done it. → I did it."
            say: "Check for Standard English too. We, you and they go with were, not was. Without has or have, write did, not done."
          - text: "Sam got his bag. Sam put on his coat. Sam left.\nSam got his bag, put on his coat and left."
            say: "Repeating a name again and again sounds clumsy. Use a pronoun like he, or join the actions into one sentence."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"Yesterday we visited the farm and we feed the goats.\"\n\nWhich word should change to keep the tense the same?"
                options: ["feed → fed", "visited → visit", "Yesterday → Today"]
                answer: "feed → fed"
                feedback:
                  "visited → visit": "Yesterday tells you it is the past, so visited is right. It is feed that must change to fed."
                hints:
                  - "Yesterday tells you the tense."
                  - "Which verb is not in the past?"
                  - "feed → fed."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tap the verb in the wrong tense."
                say: "This piece is in the past tense. Tap the verb that is in the wrong tense."
                show: { drawn: letter-card, text: "The knight climbed the tower and opens the door." }
                spans: ["opens"]
                hints:
                  - "The first verb is climbed. Is that past or present?"
                  - "Find the verb that is in the present."
                  - "opens."
              - id: l2-f3
                type: multiple_choice
                text: "\"I was hungry. I made a sandwich.\"\n\nWhich is the best way to join them?"
                options: ["I was hungry, so I made a sandwich.", "I was hungry but I made a sandwich.", "I was hungry or I made a sandwich."]
                answer: "I was hungry, so I made a sandwich."
                option_audio: false
                hints:
                  - "How are the ideas linked?"
                  - "Being hungry is the reason for the sandwich."
                  - "Use so: I was hungry, so I made a sandwich."
              - id: l2-f4
                type: multiple_choice
                text: "\"Lily opened the box. Lily gasped. Lily smiled.\"\n\nWhich version is improved?"
                options: ["Lily opened the box, gasped and smiled.", "Lily opened the box. Lily gasped and Lily smiled.", "She opened the box. She gasped. She smiled."]
                answer: "Lily opened the box, gasped and smiled."
                option_audio: false
                hints:
                  - "Which one stops repeating the name and flows best?"
                  - "One sentence can hold all three actions."
                  - "Lily opened the box, gasped and smiled."
              - id: l2-f5
                type: multiple_choice
                text: "\"We was late for school.\"\n\nHow should it be improved?"
                options: ["We were late for school.", "We is late for school.", "We was very late for school."]
                answer: "We were late for school."
                option_audio: false
                hints:
                  - "Is we was Standard English?"
                  - "We goes with were."
                  - "We were late for school."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap the verb in the wrong tense."
                say: "This piece is in the past tense. Tap the verb that is in the wrong tense."
                show: { drawn: letter-card, text: "Last night the owl hooted and flies away." }
                spans: ["flies"]
                hints: ["Last night means the past."]
              - id: l2-s2
                type: multiple_choice
                text: "\"The film was long. It was exciting.\"\n\nWhich is the best way to join them?"
                options: ["The film was long, but it was exciting.", "The film was long, so it was exciting.", "The film was long or it was exciting."]
                answer: "The film was long, but it was exciting."
                option_audio: false
                hints: ["The second idea is a surprise after the first."]
              - id: l2-s3
                type: multiple_choice
                text: "\"My cat is fluffy. My cat is ginger.\"\n\nWhich version is improved?"
                options: ["My cat is fluffy and ginger.", "My cat is fluffy. My cat is ginger too.", "My cat my cat is fluffy and ginger."]
                answer: "My cat is fluffy and ginger."
                option_audio: false
                hints: ["Join the two describing words."]
              - id: l2-s4
                type: multiple_choice
                text: "\"I done my homework.\"\n\nHow should it be improved?"
                options: ["I did my homework.", "I doing my homework.", "I done all my homework."]
                answer: "I did my homework."
                option_audio: false
                hints: ["Without has, use did."]
              - id: l2-s5
                type: multiple_choice
                text: "Which wish helps with grammar?"
                options: ["Your story is in the past, so change runs to ran.", "Use more colours.", "Make it longer."]
                answer: "Your story is in the past, so change runs to ran."
                option_audio: false
                hints: ["A grammar wish names the words to change."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tap the verb in the wrong tense."
                say: "This piece is in the past tense. Tap the verb that is in the wrong tense."
                show: { drawn: letter-card, text: "On Monday Ben baked a cake and eats it all." }
                spans: ["eats"]
              - id: l2-n2
                type: multiple_choice
                text: "\"We stayed indoors. It was snowing.\"\n\nWhich is the best way to join them?"
                options: ["We stayed indoors because it was snowing.", "We stayed indoors but it was snowing.", "We stayed indoors or it was snowing."]
                answer: "We stayed indoors because it was snowing."
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "\"Dad cooked tea. Dad washed up. Dad sat down.\"\n\nWhich version is improved?"
                options: ["Dad cooked tea, washed up and sat down.", "Dad cooked tea. Dad washed up and Dad sat down.", "Dad Dad Dad cooked, washed and sat."]
                answer: "Dad cooked tea, washed up and sat down."
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "\"They was playing football.\"\n\nHow should it be improved?"
                options: ["They were playing football.", "They is playing football.", "They was playing lots of football."]
                answer: "They were playing football."
                option_audio: false
              - id: l2-n5
                type: multiple_choice
                text: "Ali's story: \"The dragon flew over the town. It breathes fire on the roofs.\"\n\nWhich wish is most helpful?"
                options: ["Change breathes to breathed, to keep the past tense.", "Add another dragon.", "It's great."]
                answer: "Change breathes to breathed, to keep the past tense."
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "\"The rabbit went into its burrow.\"\n\nWhich verb would improve went?"
            options: ["darted", "was", "had"]
            answer: "darted"
          - id: l2-c2
            type: highlight_in_text
            text: "Tap the verb in the wrong tense."
            say: "This piece is in the past tense. Tap the verb that is in the wrong tense."
            show: { drawn: letter-card, text: "Last summer we camped by a lake and swim every day." }
            spans: ["swim"]
          - id: l2-c3
            type: multiple_choice
            text: "\"The bus was late. We missed the start of the show.\"\n\nWhich is the best way to join them?"
            options: ["The bus was late, so we missed the start of the show.", "The bus was late, but we missed the start of the show.", "The bus was late or we missed the start of the show."]
            answer: "The bus was late, so we missed the start of the show."
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "\"The house was nice.\"\n\nWhich change improves the sentence most?"
            options: ["The house was cosy, with a crackling fire.", "The house was very very nice.", "The house was nice and nice."]
            answer: "The house was cosy, with a crackling fire."
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Zara's story about her dog Max starts with a question, but the name Max comes in every sentence. Which is the most helpful feedback?"
            options: ["I like your opening question: it makes me want to read on. Wish: use a pronoun so Max is not repeated.", "Good job.", "Make it better."]
            answer: "I like your opening question: it makes me want to read on. Wish: use a pronoun so Max is not repeated."
            option_audio: false
