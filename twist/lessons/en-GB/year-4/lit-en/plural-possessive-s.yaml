# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.plural-possessive-s
skill: lit-en.grammar.plural-possessive-s
curriculum: en-GB
language: en
title:
  de: Plural-s oder Besitz-s?
  en: Plural s or possessive s?
summary: >
  An s on the end of a noun can mean more than one (two cats) or show
  that something belongs to someone (the cat's bowl). Only the possessive
  takes an apostrophe. Lesson 1 tells the two apart with the question
  "more than one, or belonging?"; lesson 2 writes both correctly in
  sentences, including phrases with both kinds (my brother's trainers),
  and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.spelling.contractions-possessive]
  also_practises: [lit-en.spelling.plural-possessive]
  vocabulary: { en: [plural, possessive, apostrophe, noun, belong, owner] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: apostrophe-before-every-s
      what: Puts an apostrophe before any final s (I like banana's, the dog's are barking)
      addressed: lesson 1 Learn screen 3; tasks l1-f1 (feedback), l1-f4, l1-s4, l1-n4, l2-f2, l2-c2
    - id: no-apostrophe-for-owner
      what: Leaves the apostrophe out of a possessive (Toms coat)
      addressed: lesson 1 Learn screen 2; tasks l1-f2, l1-s2, l2-f1, l2-n1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mehr als eins oder Besitz?", en: "More than one, or belonging?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "The scarf belongs to Mum. Which is right?"
            options: ["Mum's scarf", "Mums scarf", "Mums' scarf"]
            answer: "Mum's scarf"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word is a contraction of it is?"
            options: ["it's", "its", "it'is"]
            answer: "it's"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "two cats\nthree buses"
            say: "An s at the end of a noun often means more than one. Two cats, three buses. This is the plural s. It never has an apostrophe."
          - text: "the cat's bowl\nTom's coat"
            say: "An s with an apostrophe shows that something belongs to someone. The bowl belongs to the cat: the cat's bowl. This is the possessive s."
          - text: "Ask: is it more than one, or does something belong to it?"
            say: "When you see or write an s, ask: is it more than one, or does something belong to it? Only belonging gets an apostrophe. I like bananas: more than one, so no apostrophe."
          - text: "my sister's books\none sister, more than one book"
            say: "One phrase can have both. My sister's books: the books belong to my sister, so sister's has an apostrophe. Books is plural, so it has none."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"The dogs are barking.\"\nWhat does the s in dogs show?"
                options: ["more than one dog", "something belongs to the dog"]
                answer: "more than one dog"
                keep_order: true
                feedback:
                  "something belongs to the dog": "Nothing belongs to the dogs here; they are just barking. The s means more than one, so there is no apostrophe."
                hints:
                  - "Does anything belong to the dogs?"
                  - "No. There are just lots of them."
                  - "More than one dog."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"Ava's bike is red.\"\nWhat does the 's in Ava's show?"
                options: ["more than one Ava", "the bike belongs to Ava"]
                answer: "the bike belongs to Ava"
                keep_order: true
                hints:
                  - "Is there an apostrophe?"
                  - "Whose bike is it?"
                  - "The bike belongs to Ava."
              - id: l1-f3
                type: sorting
                text: "Plural or possessive?"
                say: "Sort the words. Does the s mean more than one, or that something belongs?"
                option_audio: false
                bins:
                  - { id: plural, show: { text: "plural: more than one" }, say: "Plural." }
                  - { id: possessive, show: { text: "possessive: belongs" }, say: "Possessive." }
                options:
                  - { text: "three apples", bin: plural }
                  - { text: "the teacher's desk", bin: possessive }
                  - { text: "lots of flowers", bin: plural }
                  - { text: "Dad's car", bin: possessive }
                hints:
                  - "Look for the apostrophe."
                  - "An apostrophe shows belonging."
                  - "Apples and flowers are plural; teacher's and Dad's are possessive."
              - id: l1-f4
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["We bought some bananas.", "We bought some banana's.", "We bought some bananas'."]
                answer: "We bought some bananas."
                option_audio: false
                hints:
                  - "Do the bananas own anything?"
                  - "No, there are just more than one."
                  - "We bought some bananas."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the possessive."
                say: "Tap the word that shows something belongs to someone."
                show: { drawn: letter-card, text: "The boys played with Sam's ball." }
                spans: ["Sam's"]
                hints:
                  - "Which word has an apostrophe?"
                  - "Whose ball is it?"
                  - "Sam's."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"The birds sang.\"\nWhat does the s in birds show?"
                options: ["more than one bird", "something belongs to the bird"]
                answer: "more than one bird"
                keep_order: true
                hints: ["Does anything belong to the birds?"]
              - id: l1-s2
                type: multiple_choice
                text: "The lead belongs to the puppy. Which is right?"
                options: ["the puppy's lead", "the puppys lead", "the puppies lead"]
                answer: "the puppy's lead"
                option_audio: false
                hints: ["Belonging needs an apostrophe."]
              - id: l1-s3
                type: sorting
                text: "Plural or possessive?"
                say: "Sort the words. Does the s mean more than one, or that something belongs?"
                option_audio: false
                bins:
                  - { id: plural, show: { text: "plural: more than one" }, say: "Plural." }
                  - { id: possessive, show: { text: "possessive: belongs" }, say: "Possessive." }
                options:
                  - { text: "the girl's hat", bin: possessive }
                  - { text: "two hats", bin: plural }
                  - { text: "Grandpa's garden", bin: possessive }
                  - { text: "five gardens", bin: plural }
                hints: ["Look for the apostrophe."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the word with a wrong apostrophe."
                say: "One word has an apostrophe it should not have. Tap it."
                show: { drawn: letter-card, text: "The shop sells fresh egg's and milk." }
                spans: ["egg's"]
                hints: ["Do the eggs own anything?"]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the possessive."
                say: "Tap the word that shows something belongs to someone."
                show: { drawn: letter-card, text: "My uncle's cats sleep all day." }
                spans: ["uncle's"]
                hints: ["Whose cats are they?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"Zara's mum is a nurse.\"\nWhat does the 's in Zara's show?"
                options: ["more than one Zara", "the mum belongs to Zara"]
                answer: "the mum belongs to Zara"
                keep_order: true
              - id: l1-n2
                type: multiple_choice
                text: "\"The trains were late.\"\nWhat does the s in trains show?"
                options: ["more than one train", "something belongs to the train"]
                answer: "more than one train"
                keep_order: true
              - id: l1-n3
                type: sorting
                text: "Plural or possessive?"
                say: "Sort the words. Does the s mean more than one, or that something belongs?"
                option_audio: false
                bins:
                  - { id: plural, show: { text: "plural: more than one" }, say: "Plural." }
                  - { id: possessive, show: { text: "possessive: belongs" }, say: "Possessive." }
                options:
                  - { text: "six pencils", bin: plural }
                  - { text: "the king's crown", bin: possessive }
                  - { text: "the horse's tail", bin: possessive }
                  - { text: "many horses", bin: plural }
              - id: l1-n4
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["The cars stopped at the lights.", "The car's stopped at the lights.", "The cars' stopped at the lights."]
                answer: "The cars stopped at the lights."
                option_audio: false
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the possessive."
                say: "Tap the word that shows something belongs to someone."
                show: { drawn: letter-card, text: "The children ran to Miss Khan's classroom." }
                spans: ["Khan's"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"The frogs jumped.\"\nWhat does the s in frogs show?"
            options: ["more than one frog", "something belongs to the frog"]
            answer: "more than one frog"
            keep_order: true
          - id: l1-c2
            type: multiple_choice
            text: "The tail belongs to the fox. Which is right?"
            options: ["the fox's tail", "the foxs tail", "the foxes tail"]
            answer: "the fox's tail"
            option_audio: false
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the word with a wrong apostrophe."
            say: "One word has an apostrophe it should not have. Tap it."
            show: { drawn: letter-card, text: "I picked some flower's for Nan." }
            spans: ["flower's"]

  - n: 2
    title: { de: Beides im Satz, en: Both in one sentence }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"The ducks swam.\"\nWhat does the s in ducks show?"
            options: ["more than one duck", "something belongs to the duck"]
            answer: "more than one duck"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "The book belongs to Kim. Which is right?"
            options: ["Kim's book", "Kims book", "Kims' book"]
            answer: "Kim's book"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "my brother's trainers"
            say: "Look at each s on its own. Brother's: the trainers belong to my brother, so it has an apostrophe. Trainers: more than one, so no apostrophe."
          - text: "the shop's windows\nthe shops close at six"
            say: "The same word can be either. The shop's windows: the windows belong to the shop. The shops close at six: more than one shop."
          - text: "Write it, then check every s: more than one, or belonging?"
            say: "When you write, check every word that ends in s. Ask the question each time, and add an apostrophe only for belonging."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["Jack's socks are under the bed.", "Jacks sock's are under the bed.", "Jack's sock's are under the bed."]
                answer: "Jack's socks are under the bed."
                option_audio: false
                hints:
                  - "Check each s. Whose socks?"
                  - "Jack owns them: Jack's. Socks is just more than one."
                  - "Jack's socks are under the bed."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "The tickets belong to my cousin. Fill the gaps."
                say: "Fill the gaps. The tickets belong to my cousin."
                frame: "my cousin_ ticket_"
                options: ["'s", "s"]
                answer: ["'s", "s"]
                option_audio: false
                feedback:
                  "s": "Cousin owns the tickets, so cousin needs 's. Tickets is plural, so it takes just s."
                hints:
                  - "Who owns the tickets?"
                  - "Cousin owns them; there are more than one ticket."
                  - "cousin's tickets."
              - id: l2-f3
                type: multiple_choice
                text: "\"The farmer's fields are muddy.\"\nWhich word is plural?"
                options: ["fields", "farmer's", "muddy"]
                answer: "fields"
                hints:
                  - "Which word means more than one?"
                  - "Farmer's shows belonging."
                  - "fields."
              - id: l2-f4
                type: highlight_in_text
                text: "Tap the words with a wrong apostrophe."
                say: "Two words have an apostrophe they should not have. Tap them."
                show: { drawn: letter-card, text: "Mum's friend's brought cake's to the party." }
                spans: ["friend's", "cake's"]
                hints:
                  - "Check each word with an apostrophe."
                  - "Do the friends or the cakes own anything here?"
                  - "friend's and cake's."
              - id: l2-f5
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["The school's gates open at 8 am.", "The schools gate's open at 8 am.", "The school's gate's open at 8 am."]
                answer: "The school's gates open at 8 am."
                option_audio: false
                hints:
                  - "Whose gates are they?"
                  - "The gates belong to the school; gates is plural."
                  - "The school's gates open at 8 am."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["Gran's roses smell lovely.", "Grans rose's smell lovely.", "Gran's rose's smell lovely."]
                answer: "Gran's roses smell lovely."
                option_audio: false
                hints: ["Check each s on its own."]
              - id: l2-s2
                type: fill_in_blank
                text: "The toys belong to the baby. Fill the gaps."
                say: "Fill the gaps. The toys belong to the baby."
                frame: "the baby_ toy_"
                options: ["'s", "s"]
                answer: ["'s", "s"]
                option_audio: false
                hints: ["The baby owns more than one toy."]
              - id: l2-s3
                type: multiple_choice
                text: "\"The shops close at six.\"\nWhat does the s in shops show?"
                options: ["more than one shop", "something belongs to the shop"]
                answer: "more than one shop"
                keep_order: true
                hints: ["Does anything belong to the shops?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tap the word with a wrong apostrophe."
                say: "One word has an apostrophe it should not have. Tap it."
                show: { drawn: letter-card, text: "Ben's sister has two kitten's." }
                spans: ["kitten's."]
                hints: ["Do the kittens own anything?"]
              - id: l2-s5
                type: text_input
                keyboard: letters
                text: "Write the phrase with an apostrophe where it is needed.\nthe coats of the teacher → the _______ coats"
                say: "Write the owner word. The coats belong to one teacher."
                answer: "teacher's"
                hints: ["One teacher owns them: add apostrophe s."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["Leo's pens are blue.", "Leos pen's are blue.", "Leo's pen's are blue."]
                answer: "Leo's pens are blue."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "The paws belong to the dog. Fill the gaps."
                say: "Fill the gaps. The paws belong to the dog."
                frame: "the dog_ paw_"
                options: ["'s", "s"]
                answer: ["'s", "s"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "\"The shop's windows sparkle.\"\nWhat does the 's in shop's show?"
                options: ["the windows belong to the shop", "more than one shop"]
                answer: "the windows belong to the shop"
                keep_order: true
              - id: l2-n4
                type: highlight_in_text
                text: "Tap the words with a wrong apostrophe."
                say: "Two words have an apostrophe they should not have. Tap them."
                show: { drawn: letter-card, text: "The twin's played with Ruby's puzzle's." }
                spans: ["twin's", "puzzle's."]
              - id: l2-n5
                type: text_input
                keyboard: letters
                text: "Write the owner word with its apostrophe.\nthe garden of my aunt → my ____ garden"
                say: "Write the owner word. The garden belongs to my aunt."
                answer: "aunt's"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "\"Ellie's boots are wet.\"\nWhat does the 's in Ellie's show?"
            options: ["more than one Ellie", "the boots belong to Ellie"]
            answer: "the boots belong to Ellie"
            keep_order: true
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence is right?"
            options: ["The farm sells carrots.", "The farm sells carrot's.", "The farm sells carrots'."]
            answer: "The farm sells carrots."
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "The keys belong to the caretaker. Fill the gaps."
            say: "Fill the gaps. The keys belong to the caretaker."
            frame: "the caretaker_ key_"
            options: ["'s", "s"]
            answer: ["'s", "s"]
            option_audio: false
          - id: l2-c4
            type: sorting
            text: "Plural or possessive?"
            say: "Sort the phrases from a bakery. Does the s mean more than one, or that something belongs?"
            option_audio: false
            bins:
              - { id: plural, show: { text: "plural: more than one" }, say: "Plural." }
              - { id: possessive, show: { text: "possessive: belongs" }, say: "Possessive." }
            options:
              - { text: "the baker's bread", bin: possessive }
              - { text: "two loaves", bin: plural }
              - { text: "the shop's oven", bin: possessive }
              - { text: "ten buns", bin: plural }
          - id: l2-c5
            type: highlight_in_text
            text: "Tap the word with a wrong apostrophe."
            say: "One word has an apostrophe it should not have. Tap it."
            show: { drawn: letter-card, text: "Dad's van has four new tyre's." }
            spans: ["tyre's."]
