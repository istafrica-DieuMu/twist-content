# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.perform
skill: lit-en.texts.perform
curriculum: en-GB
language: en
title:
  de: Gedichte und Szenen vortragen
  en: Performing poems and play scripts
summary: >
  A performer shows what a text means with tone (how the voice sounds),
  volume (how loud), pace, pauses and action. Lesson 1 prepares a poem:
  reads the clues in the words and punctuation and chooses how to say
  each line; lesson 2 prepares a play script: knows the layout, uses the
  stage directions for tone and action without reading them aloud, and
  ends with the skill check. Every poem and scene is written for Twist.
  The skill check marks the choices a performer makes; performing aloud
  is practised in the speak tasks of Practise, not marked.
metadata:
  year: year-4
  topic: { de: Texte vortragen, en: Performing texts }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.texts.poems-by-heart]
  also_practises: [lit-en.speaking.standard-english-speech]
  vocabulary: { en: [perform, tone, volume, pace, pause, emphasis, action, play script, character, stage direction, audience] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: poem-voice, what: { de: "Ton, Lautstärke und Tempo aus den Wörtern eines Gedichts wählen", en: "choosing tone, volume and pace from the words of a poem" } }
    - { id: pauses, what: { de: "an Satzzeichen Pausen machen, nicht an jedem Zeilenende", en: "pausing at punctuation, not at every line end" } }
    - { id: script, what: { de: "ein Theaterstück lesen: Aufbau und Regieanweisungen, die man nicht vorliest", en: "reading a play script: its layout, and stage directions that are not read aloud" } }
    - { id: action-audience, what: { de: Bewegung passend zum Text wählen und vor Publikum vortragen, en: choosing actions that fit and performing to an audience } }
  misconceptions:
    - id: same-voice-throughout
      what: Reads every line in the same voice and volume, whatever it means
      addressed: lesson 1 Learn screens 1 and 2; tasks l1-f1 (feedback), l1-f3, l1-s1, l1-n1, l2-c1
    - id: read-stage-directions
      what: Reads the stage directions and character names aloud as part of the lines
      addressed: lesson 2 Learn screen 2; tasks l2-f2 (feedback), l2-s2, l2-n2, l2-c3
    - id: pause-at-line-end
      what: Stops at the end of every line of a poem, even when the sentence runs on
      addressed: lesson 1 Learn screen 3; tasks l1-f4, l1-s4, l1-n4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Ein Gedicht vortragen, en: Performing a poem }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which helps you learn a poem by heart?"
            options: ["say it a few lines at a time, again and again", "read it once very fast", "only look at the title"]
            answer: "say it a few lines at a time, again and again"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word rhymes with night?"
            options: ["bright", "nice", "nest"]
            answer: "bright"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Tone: how your voice sounds (happy, scared, cross)\nVolume: how loud or soft\nPace: how fast or slow\nAction: what your face and body do"
            say: "When you perform, you have four tools. Tone is how your voice sounds. Volume is how loud or soft. Pace is how fast or slow. Action is what your face and body do."
          - text: "Creep, creep, along the hall,\nquiet as a shadow on the wall.\nThen BANG! The door flew wide,\nand out the giant stepped outside."
            say: "The words tell you how to say them. Creep and quiet as a shadow: say them slowly and softly. BANG in capital letters and an exclamation mark: say it loud and sudden."
          - text: "We walked along the sandy shore\nand found a shell, then found one more."
            say: "Punctuation tells you where to pause. Pause a little at a comma and longer at a full stop. The first line has no punctuation at the end, because the sentence runs on to the next line. So keep going without stopping."
          - text: "Plan, practise, perform."
            say: "Before you perform, mark the words to say loudly or softly, practise out loud, then perform to your audience, looking up as much as you can."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"Hush, little mouse, the cat's asleep,\nso tiptoe past and do not peep.\"\n\nHow should you say these lines?"
                options: ["softly and slowly", "loudly and fast", "in a cross voice"]
                answer: "softly and slowly"
                feedback:
                  "loudly and fast": "Hush and tiptoe tell you to be quiet. Loud and fast would wake the cat."
                hints:
                  - "Which words tell you how to say it?"
                  - "Hush and tiptoe."
                  - "Softly and slowly."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the word to say loudest."
                say: "Tap the word in this line that you would say the loudest."
                show: { drawn: letter-card, text: "The thunder rumbled, then CRASH! went the sky." }
                spans: ["CRASH!"]
                hints:
                  - "Look for capital letters and an exclamation mark."
                  - "The sound the sky makes."
                  - "CRASH!"
              - id: l1-f3
                type: multiple_choice
                text: "\"Hooray! The snow has come at last!\nWe'll sledge and slide and zoom so fast!\"\n\nWhich tone fits?"
                options: ["excited", "sad", "sleepy"]
                answer: "excited"
                hints:
                  - "How does the speaker feel about the snow?"
                  - "Hooray and exclamation marks."
                  - "Excited."
              - id: l1-f4
                type: true_false
                text: "\"The old oak tree has stood for years\nthrough summer suns and winter tears.\"\n\nIs it true? You should stop after years."
                answer: false
                hints:
                  - "Is there any punctuation after years?"
                  - "No. The sentence runs on to the next line."
                  - "No. Keep going to the full stop after tears."
              - id: l1-f5
                type: speak
                text: "Perform these lines: \"Hush, little mouse, the cat's asleep, so tiptoe past and do not peep.\""
                say: "Perform these two lines. Use a soft, slow voice. Then listen to an example."
                expected_text: "Hush, little mouse, the cat's asleep, so tiptoe past and do not peep."
                hints:
                  - "Take a breath before you start."
                  - "Pause a little at each comma."
                  - "Say it softly, as if the cat might wake."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"My goldfish Fred has swum away,\nI miss him more and more each day.\"\n\nWhich tone fits?"
                options: ["sad", "angry", "excited"]
                answer: "sad"
                hints: ["How does the speaker feel without Fred?"]
              - id: l1-s2
                type: multiple_choice
                text: "Which action fits the line \"I yawned and stretched and rubbed my eyes\"?"
                options: ["stretch your arms and yawn", "jump up and down", "point at the audience"]
                answer: "stretch your arms and yawn"
                hints: ["Do what the words say."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the word to whisper."
                say: "Tap the word in this line that you would whisper."
                show: { drawn: letter-card, text: "Shh! said the owl from the top of the tree." }
                spans: ["Shh!"]
                hints: ["Which word asks for quiet?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the words you pause after, at a comma."
                say: "Tap each word that has a comma after it, where you pause a little."
                show: { drawn: letter-card, text: "Run, run, as fast as you can." }
                spans: ["Run,", "run,"]
                hints: ["Look for the commas."]
              - id: l1-s5
                type: speak
                text: "Perform these lines: \"Hooray! The snow has come at last! We'll sledge and slide and zoom so fast!\""
                say: "Perform these two lines with an excited voice. Then listen to an example."
                expected_text: "Hooray! The snow has come at last! We'll sledge and slide and zoom so fast!"
                hints: ["Make Hooray loud and bright."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"Who left their muddy boots right here?\nI've slipped and hurt my knee, oh dear!\"\n\nWhich tone fits?"
                options: ["cross", "sleepy", "proud"]
                answer: "cross"
              - id: l1-n2
                type: multiple_choice
                text: "\"The tortoise plodded down the lane,\nso slow, so slow, again, again.\"\n\nWhich pace fits?"
                options: ["slow", "fast", "fast, then slow"]
                answer: "slow"
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the word to say loudest."
                say: "Tap the word in this line that you would say the loudest."
                show: { drawn: letter-card, text: "The balloon grew big and then POP! it was gone." }
                spans: ["POP!"]
              - id: l1-n4
                type: true_false
                text: "\"The moon came out. The stars came too.\nThe night was black and deep and blue.\"\n\nIs it true? You pause after out."
                answer: true
              - id: l1-n5
                type: speak
                text: "Perform these lines: \"The tortoise plodded down the lane, so slow, so slow, again, again.\""
                say: "Perform these two lines. Choose the pace and tone yourself. Then listen to an example."
                expected_text: "The tortoise plodded down the lane, so slow, so slow, again, again."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"Ssh, the baby's sleeping tight,\nso not a sound from you tonight.\"\n\nWhich volume fits?"
            options: ["very quiet", "very loud", "loud, then quiet"]
            answer: "very quiet"
          - id: l1-c2
            type: multiple_choice
            text: "What does volume mean when you perform?"
            options: ["how loud or soft you are", "how fast you speak", "what your body does"]
            answer: "how loud or soft you are"
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the word to say loudest."
            say: "Tap the word in this line that you would say the loudest."
            show: { drawn: letter-card, text: "We waited and waited, then BOOM! the fireworks began." }
            spans: ["BOOM!"]
          - id: l1-c4
            type: multiple_choice
            text: "\"Zoom! goes the rocket into space,\nfaster than any car can race!\"\n\nWhich pace fits?"
            options: ["fast", "slow", "very slow, then stop"]
            answer: "fast"
          - id: l1-c5
            type: multiple_choice
            text: "What does pace mean when you perform?"
            options: ["how fast or slow you speak", "how loud or soft you are", "how your voice sounds"]
            answer: "how fast or slow you speak"
          - id: l1-c6
            type: true_false
            text: "\"The sun went down behind the hill\nand all the birds were quiet and still.\"\n\nIs it true? You should stop after hill."
            answer: false

  - n: 2
    title: { de: Eine Szene spielen, en: Performing a play script }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"Hush now, hush, the wind is low,\nthe garden sleeps beneath the snow.\"\n\nHow should you say these lines?"
            options: ["softly and slowly", "loudly and fast", "in an angry voice"]
            answer: "softly and slowly"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What does tone mean when you perform?"
            options: ["how your voice sounds", "how loud you are", "where you stand"]
            answer: "how your voice sounds"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "FOX: (sweetly) What a lovely voice you have, Crow!\nCROW: (proudly) Thank you. Shall I sing?\nFOX: Oh yes, please sing!"
            say: "This is a play script. The name of the character comes first, then a colon, then what they say. There are no inverted commas."
          - text: "(sweetly)   (proudly)   (The cheese drops from Crow's beak.)"
            say: "Words in brackets are stage directions. They tell you how to say a line, or what to do. You do not read them aloud. You show them with your voice and your actions."
          - text: "FOX: (sweetly) What a lovely voice you have, Crow!"
            say: "So the fox would say: What a lovely voice you have, Crow! in a sweet, friendly voice, perhaps with a smile and a little bow."
          - text: "Stay in character. Face the audience. Wait for your cue."
            say: "When you perform a scene, stay in character, face the audience so they can hear you, and listen for the line before yours: that is your cue."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "GIANT: (stamping his feet) Who has stolen my golden hen?\n\nWhat should the giant do?"
                options: ["stamp his feet and speak in a loud, angry voice", "sit still and whisper", "read out the words stamping his feet"]
                answer: "stamp his feet and speak in a loud, angry voice"
                hints:
                  - "What do the words in brackets tell you?"
                  - "Stamping is an action. How does an angry giant sound?"
                  - "Stamp his feet and speak loudly and angrily."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "MIA: (nervously) Is anyone there?\n\nWhat does the actor playing Mia say aloud?"
                options: ["Is anyone there?", "Mia nervously, is anyone there?", "Nervously, is anyone there?"]
                answer: "Is anyone there?"
                option_audio: false
                feedback:
                  "Mia nervously, is anyone there?": "The name and the stage direction are not read aloud. Mia only says: Is anyone there? in a nervous voice."
                hints:
                  - "Which parts of a script are not read aloud?"
                  - "The name and the words in brackets."
                  - "Only: Is anyone there?"
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the stage direction."
                say: "Tap every word of the stage direction in this line."
                show: { drawn: letter-card, text: "TOM: (yawning) Is it morning already?" }
                spans: ["(yawning)"]
                hints:
                  - "Stage directions are in brackets."
                  - "It tells Tom how to say the line."
                  - "(yawning)."
              - id: l2-f4
                type: multiple_choice
                text: "Which line from a script has the right layout?"
                options: ["CROW: I can sing better than any bird.", "\"I can sing better than any bird,\" said Crow.", "CROW \"I can sing better than any bird.\""]
                answer: "CROW: I can sing better than any bird."
                option_audio: false
                hints:
                  - "What comes first in a script line?"
                  - "The name, then a colon, then the words. No inverted commas."
                  - "CROW: I can sing better than any bird."
              - id: l2-f5
                type: speak
                text: "Perform the line: GIANT: (stamping his feet) Who has stolen my golden hen?"
                say: "Perform the giant's line. Do not say the name or the stage direction. Then listen to an example."
                expected_text: "Who has stolen my golden hen?"
                hints:
                  - "Only say the words after the stage direction."
                  - "Make your voice deep, loud and angry."
                  - "Who has stolen my golden hen?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "GRAN: (hugging Ella) I've missed you so much!\n\nWhich tone fits Gran's line?"
                options: ["warm and happy", "cross", "bored"]
                answer: "warm and happy"
                hints: ["She is hugging Ella."]
              - id: l2-s2
                type: multiple_choice
                text: "ROBOT: (in a flat voice) Hello. I am Zed.\n\nWhat does the actor playing the robot say aloud?"
                options: ["Hello. I am Zed.", "In a flat voice, hello. I am Zed.", "Robot, hello. I am Zed."]
                answer: "Hello. I am Zed."
                option_audio: false
                hints: ["Leave out the name and the brackets."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the stage direction."
                say: "Tap every word of the stage direction in this line."
                show: { drawn: letter-card, text: "PRINCESS: (peeping through the curtains) Here comes a dragon!" }
                spans: ["(peeping", "through", "the", "curtains)"]
                hints: ["Find the brackets."]
              - id: l2-s4
                type: multiple_choice
                text: "Two children are acting a scene. When should Ben say his line?"
                options: ["when he hears his cue, the line before his", "as soon as the scene starts", "whenever he remembers it"]
                answer: "when he hears his cue, the line before his"
                hints: ["A cue tells you it is your turn."]
              - id: l2-s5
                type: speak
                text: "Perform the line: ROBOT: (in a flat voice) Hello. I am Zed."
                say: "Perform the robot's line, showing the stage direction with your voice. Then listen to an example."
                expected_text: "Hello. I am Zed."
                hints: ["Keep every word on the same flat note."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "WOLF: (licking his lips) What big, juicy pigs!\n\nWhich action fits?"
                options: ["lick your lips and rub your tummy", "cry and hide your face", "wave goodbye"]
                answer: "lick your lips and rub your tummy"
              - id: l2-n2
                type: multiple_choice
                text: "SAM: (shouting across the field) Kick it to me!\n\nWhat does the actor playing Sam say aloud?"
                options: ["Kick it to me!", "Shouting across the field, kick it to me!", "Sam: kick it to me!"]
                answer: "Kick it to me!"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "SAM: (shouting across the field) Kick it to me!\n\nWhich volume fits?"
                options: ["loud", "soft", "a whisper"]
                answer: "loud"
              - id: l2-n4
                type: multiple_choice
                text: "Why should actors face the audience?"
                options: ["so the audience can see and hear them", "so they can read the script", "so they do not need to learn lines"]
                answer: "so the audience can see and hear them"
              - id: l2-n5
                type: speak
                text: "Perform the line: GRAN: (hugging Ella) I've missed you so much!"
                say: "Perform Gran's line. Then listen to an example."
                expected_text: "I've missed you so much!"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: poem-voice
            type: multiple_choice
            text: "\"The dragon roared, the castle shook,\nthe knight turned pale and dropped his book.\"\n\nHow should you say roared?"
            options: ["loudly, with a big voice", "softly, like a secret", "slowly and sleepily"]
            answer: "loudly, with a big voice"
          - id: l2-c2
            part: script
            type: multiple_choice
            text: "PIRATE: (grinning) Treasure at last!\n\nWhich tone fits?"
            options: ["pleased and excited", "frightened", "sad"]
            answer: "pleased and excited"
          - id: l2-c3
            part: script
            type: multiple_choice
            text: "KING: (sadly) My crown is gone.\n\nWhat does the actor playing the king say aloud?"
            options: ["My crown is gone.", "Sadly, my crown is gone.", "King sadly, my crown is gone."]
            answer: "My crown is gone."
            option_audio: false
          - id: l2-c4
            part: pauses
            type: true_false
            text: "\"Down the hill the children ran\nto meet the ice cream van.\"\n\nIs it true? You should stop after ran."
            answer: false
          - id: l2-c5
            part: script
            type: multiple_choice
            text: "In a play script, what do the words in brackets tell you?"
            options: ["how to say a line or what to do", "words to read aloud to the audience", "the name of the play"]
            answer: "how to say a line or what to do"
          - id: l2-c6
            part: poem-voice
            type: multiple_choice
            text: "\"The kitten chased a ball of string,\nround and round, a whirling thing!\"\n\nWhich pace fits?"
            options: ["quick and lively", "very slow", "slow, then stop"]
            answer: "quick and lively"
          - id: l2-c7
            part: poem-voice
            type: highlight_in_text
            text: "Tap the word to say loudest."
            say: "Tap the word in this line that you would say the loudest."
            show: { drawn: letter-card, text: "The giant sneezed, ATCHOO! and all the trees shook." }
            spans: ["ATCHOO!"]
          - id: l2-c8
            part: poem-voice
            type: multiple_choice
            text: "\"What's that noise beneath my bed?\nA scratching sound... I hide my head.\"\n\nWhich tone fits?"
            options: ["scared", "proud", "bored"]
            answer: "scared"
          - id: l2-c9
            part: poem-voice
            type: true_false
            text: "\"Whisper, whisper, go the leaves,\nsoft as breath among the trees.\"\n\nIs it true? You should shout these lines."
            answer: false
          - id: l2-c10
            part: pauses
            type: highlight_in_text
            text: "Tap the words you pause after, at a comma."
            say: "Tap each word that has a comma after it, where you pause a little."
            show: { drawn: letter-card, text: "Up the stairs, along the hall, past the clock upon the wall." }
            spans: ["stairs,", "hall,"]
          - id: l2-c11
            part: pauses
            type: multiple_choice
            text: "\"Tom ran to the park. He played on the swings,\nthen flew down the slide with his arms out like wings.\"\n\nWhere is the longer pause?"
            options: ["after park", "after swings", "after slide"]
            answer: "after park"
          - id: l2-c12
            part: pauses
            type: true_false
            text: "\"Over the wall and into the lane\nthe puppy ran out in the pouring rain.\"\n\nIs it true? You keep going after lane without stopping."
            answer: true
          - id: l2-c13
            part: pauses
            type: multiple_choice
            text: "What does a comma in a poem tell a performer?"
            options: ["pause a little", "stop for a long time", "say the next word loudly"]
            answer: "pause a little"
          - id: l2-c14
            part: script
            type: highlight_in_text
            text: "Tap the stage direction."
            say: "Tap every word of the stage direction in this line."
            show: { drawn: letter-card, text: "QUEEN: (clapping her hands) Bring in the cake!" }
            spans: ["(clapping", "her", "hands)"]
          - id: l2-c15
            part: script
            type: multiple_choice
            text: "ELF: (whispering) The giant is coming.\n\nWhich volume fits?"
            options: ["quiet", "loud", "shouting"]
            answer: "quiet"
          - id: l2-c16
            part: action-audience
            type: multiple_choice
            text: "BEAR: (rubbing his eyes) Who woke me up?\n\nWhich action fits?"
            options: ["rub your eyes and look sleepy", "jump for joy", "wave at the audience"]
            answer: "rub your eyes and look sleepy"
          - id: l2-c17
            part: action-audience
            type: multiple_choice
            text: "Which action fits the line \"I shivered in the icy wind\"?"
            options: ["hug yourself and shiver", "fan your face", "dance about"]
            answer: "hug yourself and shiver"
          - id: l2-c18
            part: action-audience
            type: multiple_choice
            text: "Why should you look up from the page as much as you can when you perform?"
            options: ["so the audience can see your face", "so you can read faster", "so you can skip some lines"]
            answer: "so the audience can see your face"
          - id: l2-c19
            part: action-audience
            type: true_false
            text: "Is it true? In a scene, your cue is the line that comes just before yours."
            answer: true
          - id: l2-c20
            part: action-audience
            type: multiple_choice
            text: "Kit has to perform a poem tomorrow. What should she do first?"
            options: ["read it and mark the words to say loudly or softly", "learn only the title", "perform it with no practice"]
            answer: "read it and mark the words to say loudly or softly"
