# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.plural-possessive
skill: lit-en.spelling.plural-possessive
curriculum: en-GB
language: en
title:
  de: Besitz-Apostroph im Plural
  en: Possessive apostrophes with plurals
summary: >
  One owner takes 's (the girl's coat). A plural that ends in s takes
  just an apostrophe after the s (the girls' coats). A plural that does
  not end in s takes 's (the children's coats, the men's team). Lesson 1
  works out how many owners there are and places the apostrophe for
  regular plurals; lesson 2 adds the irregular plurals, mixes all three
  kinds and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.spelling.contractions-possessive]
  also_practises: [lit-en.grammar.plural-possessive-s]
  vocabulary: { en: [apostrophe, possession, owner, singular, plural, regular plural, irregular plural] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: always-apostrophe-s
      what: Writes 's for every owner, so plural owners lose their meaning (the girl's coats for many girls)
      addressed: lesson 1 Learn screens 1 and 2; tasks l1-f1 (feedback), l1-f3, l1-s2, l1-n3, l2-c1
    - id: irregular-s-apostrophe
      what: Puts the apostrophe after an added s on an irregular plural (childrens', mens')
      addressed: lesson 2 Learn screen 1; tasks l2-f1 (feedback), l2-f3, l2-s1, l2-n1, l2-c2
    - id: apostrophe-for-plural
      what: Adds an apostrophe to a plain plural that owns nothing (two apple's)
      addressed: tasks l1-f5, l1-s5, l2-n4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ein Besitzer oder viele?", en: "One owner or many?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "The bike belongs to Sam. Which is right?"
            options: ["Sam's bike", "Sams bike", "Sams' bike"]
            answer: "Sam's bike"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word is a contraction of did not?"
            options: ["didn't", "did'nt", "dont"]
            answer: "didn't"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "the girl's coat\none girl owns the coat"
            say: "You know this one. One girl owns a coat, so we write girl, apostrophe, s: the girl's coat."
          - text: "the girls' coats\nmany girls own the coats"
            say: "Now there are many girls. The plural girls already ends in s, so we just add an apostrophe after the s: the girls' coats. We do not add another s."
          - text: "Ask: who owns it? Write the owner word first.\nOne dog: dog → dog's\nMany dogs: dogs → dogs'"
            say: "Ask who owns it. Write the owner word first, singular or plural. Then add the apostrophe: one dog's bowl, or many dogs' bowls."
          - text: "two apples (no apostrophe)\nthe apples' skins"
            say: "Only an owner gets an apostrophe. Two apples is just a plural, so no apostrophe. The apples' skins: the skins belong to the apples."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The lockers belong to the boys. Which is right?"
                options: ["the boys' lockers", "the boy's lockers", "the boys's lockers"]
                answer: "the boys' lockers"
                option_audio: false
                feedback:
                  "the boy's lockers": "The boy's means one boy. Here there are many boys, so the apostrophe goes after the s: boys'."
                hints:
                  - "How many boys own the lockers?"
                  - "Many boys: boys. It already ends in s."
                  - "the boys' lockers."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"the cat's toys\"\n\nHow many cats?"
                options: ["one cat", "more than one cat"]
                answer: "one cat"
                keep_order: true
                hints:
                  - "Where is the apostrophe?"
                  - "It comes before the s, straight after cat."
                  - "One cat."
              - id: l1-f3
                type: fill_in_blank
                text: "Many teachers share one room. Fill the gap."
                say: "Many teachers share one room. Fill the gap."
                frame: "the teacher_ room"
                options: ["'s", "s'", "s"]
                answer: ["s'"]
                option_audio: false
                hints:
                  - "First write the plural: teachers."
                  - "Teachers ends in s. What do you add?"
                  - "s': the teachers' room."
              - id: l1-f4
                type: multiple_choice
                text: "\"the horses' field\"\n\nHow many horses?"
                options: ["one horse", "more than one horse"]
                answer: "more than one horse"
                keep_order: true
                hints:
                  - "Where is the apostrophe?"
                  - "It comes after the s of horses."
                  - "More than one horse."
              - id: l1-f5
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["I bought three apples.", "I bought three apple's.", "I bought three apples'."]
                answer: "I bought three apples."
                option_audio: false
                hints:
                  - "Do the apples own anything?"
                  - "No, so it is just a plural."
                  - "I bought three apples."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The nests belong to the birds. Which is right?"
                options: ["the birds' nests", "the bird's nests", "the birds nest's"]
                answer: "the birds' nests"
                option_audio: false
                hints: ["Many birds: write birds, then the apostrophe."]
              - id: l1-s2
                type: fill_in_blank
                text: "One baby has a rattle. Fill the gap."
                say: "One baby has a rattle. Fill the gap."
                frame: "the baby_ rattle"
                options: ["'s", "s'", "s"]
                answer: ["'s"]
                option_audio: false
                hints: ["One owner: add apostrophe and s."]
              - id: l1-s3
                type: fill_in_blank
                text: "Lots of players have boots. Fill the gap."
                say: "Lots of players have boots. Fill the gap."
                frame: "the player_ boots"
                options: ["'s", "s'", "s"]
                answer: ["s'"]
                option_audio: false
                hints: ["Write players, then add the apostrophe."]
              - id: l1-s4
                type: multiple_choice
                text: "\"the puppies' basket\"\n\nHow many puppies?"
                options: ["one puppy", "more than one puppy"]
                answer: "more than one puppy"
                keep_order: true
                hints: ["Puppies is the plural of puppy."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the word with an apostrophe it should not have."
                say: "One word has an apostrophe but owns nothing. Tap it."
                show: { drawn: letter-card, text: "The farmer's cow's are in the field." }
                spans: ["cow's"]
                hints: ["Do the cows own anything in this sentence?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The work belongs to many pupils. Which is right?"
                options: ["the pupils' work", "the pupil's work", "the pupils's work"]
                answer: "the pupils' work"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Many ladies have hats. Fill the gap."
                say: "Many ladies have hats. Fill the gap."
                frame: "the ladie_ hats"
                options: ["'s", "s'", "s"]
                answer: ["s'"]
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Both of my sisters have bedrooms upstairs. Which is right?"
                options: ["my sisters' bedrooms", "my sister's bedrooms", "my sisters bedroom's"]
                answer: "my sisters' bedrooms"
                option_audio: false
              - id: l1-n4
                type: text_input
                keyboard: letters
                text: "Write the owner word with its apostrophe.\nthe tails of the dogs → the ____ tails"
                say: "Write the owner word with its apostrophe. The tails belong to the dogs."
                answer: "dogs'"
              - id: l1-n5
                type: true_false
                text: "Is it true? \"The girl's shoes\" means the shoes of many girls."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The kennels belong to the dogs. Which is right?"
            options: ["the dogs' kennels", "the dog's kennels", "the dogs kennel's"]
            answer: "the dogs' kennels"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "\"the nurse's watch\"\n\nHow many nurses?"
            options: ["one nurse", "more than one nurse"]
            answer: "one nurse"
            keep_order: true
          - id: l1-c3
            type: fill_in_blank
            text: "Many friends share a secret. Fill the gap."
            say: "Many friends share a secret. Fill the gap."
            frame: "my friend_ secret"
            options: ["'s", "s'", "s"]
            answer: ["s'"]
            option_audio: false

  - n: 2
    title: { de: Unregelmäßige Pluralformen, en: Irregular plurals }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The tents belong to the scouts. Which is right?"
            options: ["the scouts' tents", "the scout's tents", "the scouts tent's"]
            answer: "the scouts' tents"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "\"my brother's bike\"\n\nHow many brothers?"
            options: ["one brother", "more than one brother"]
            answer: "one brother"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "children → the children's toys\nmen → the men's team\nwomen → the women's race"
            say: "Some plurals do not end in s: children, men, women. They are irregular plurals. Because they do not end in s, we add apostrophe and s, just like one owner: the children's toys."
          - text: "mice → the mice's cheese\npeople → the people's choice\ngeese → the geese's pond"
            say: "Here are more: mice, people, geese. Each one takes apostrophe s."
          - text: "1. Write the owner word.\n2. Does it end in s?\nyes → add '\nno → add 's"
            say: "Use the same steps every time. Write the owner word, singular or plural. Does it end in s? If it does, add just an apostrophe. If it does not, add apostrophe s."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The playground belongs to the children. Which is right?"
                options: ["the children's playground", "the childrens' playground", "the childrens playground"]
                answer: "the children's playground"
                option_audio: false
                feedback:
                  "the childrens' playground": "Childrens is not a word. The plural is children, which does not end in s, so add apostrophe s: children's."
                hints:
                  - "What is the plural of child?"
                  - "Children does not end in s."
                  - "the children's playground."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Match each owner to its possessive."
                say: "Match each owner word to the way it shows possession."
                option_audio: false
                pairs:
                  - { left: { text: "one girl" }, right: { text: "girl's" } }
                  - { left: { text: "many girls" }, right: { text: "girls'" } }
                  - { left: { text: "many women" }, right: { text: "women's" } }
                hints:
                  - "Write the owner word first, then check if it ends in s."
                  - "Girls ends in s; women does not."
                  - "girl's, girls', women's."
              - id: l2-f3
                type: fill_in_blank
                text: "The changing room belongs to the men. Fill the gap."
                say: "The changing room belongs to the men. Fill the gap."
                frame: "the men_ changing room"
                options: ["'s", "s'", "s"]
                answer: ["'s"]
                option_audio: false
                hints:
                  - "Does men end in s?"
                  - "No, so add apostrophe s."
                  - "'s: the men's changing room."
              - id: l2-f4
                type: multiple_choice
                text: "The hole belongs to the mice. Which is right?"
                options: ["the mice's hole", "the mices' hole", "the mouse's hole"]
                answer: "the mice's hole"
                option_audio: false
                hints:
                  - "How many mice? More than one."
                  - "Mice does not end in s."
                  - "the mice's hole."
              - id: l2-f5
                type: text_input
                keyboard: letters
                text: "Write the owner word with its apostrophe.\nthe coats of the people → the ______ coats"
                say: "Write the owner word with its apostrophe. The coats of the people."
                answer: "people's"
                hints:
                  - "Does people end in s?"
                  - "No. So add apostrophe s."
                  - "people's."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The toilets are for the women. Which is right?"
                options: ["the women's toilets", "the womens' toilets", "the woman's toilets"]
                answer: "the women's toilets"
                option_audio: false
                hints: ["Women does not end in s."]
              - id: l2-s2
                type: fill_in_blank
                text: "Many babies have blankets. Fill the gap."
                say: "Many babies have blankets. Fill the gap."
                frame: "the babie_ blankets"
                options: ["'s", "s'", "s"]
                answer: ["s'"]
                option_audio: false
                hints: ["Babies ends in s."]
              - id: l2-s3
                type: fill_in_blank
                text: "The pond belongs to the geese. Fill the gap."
                say: "The pond belongs to the geese. Fill the gap."
                frame: "the geese_ pond"
                options: ["'s", "s'", "s"]
                answer: ["'s"]
                option_audio: false
                hints: ["Geese does not end in s."]
              - id: l2-s4
                type: sorting
                text: "Sort the owners."
                say: "Which owner words take just an apostrophe, and which take apostrophe s?"
                option_audio: false
                bins:
                  - { id: apos, show: { text: "add '" }, say: "Add an apostrophe." }
                  - { id: apos-s, show: { text: "add 's" }, say: "Add apostrophe s." }
                options:
                  - { text: "many teachers", bin: apos }
                  - { text: "many children", bin: apos-s }
                  - { text: "one teacher", bin: apos-s }
                  - { text: "many foxes", bin: apos }
                hints: ["Write each owner word. Does it end in s?"]
              - id: l2-s5
                type: text_input
                keyboard: letters
                text: "Write the owner word with its apostrophe.\nthe bags of the children → the ________ bags"
                say: "Write the owner word with its apostrophe. The bags of the children."
                answer: "children's"
                hints: ["Children does not end in s."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The football team is for men. Which is right?"
                options: ["the men's team", "the mens' team", "the mens team"]
                answer: "the men's team"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Many wolves share a den. Fill the gap."
                say: "Many wolves share a den. Fill the gap."
                frame: "the wolve_ den"
                options: ["'s", "s'", "s"]
                answer: ["s'"]
                option_audio: false
              - id: l2-n3
                type: text_input
                keyboard: letters
                text: "Write the owner word with its apostrophe.\nthe race for the women → the ______ race"
                say: "Write the owner word with its apostrophe. The race for the women."
                answer: "women's"
              - id: l2-n4
                type: highlight_in_text
                text: "Tap the word with a wrong apostrophe."
                say: "One word has an apostrophe but owns nothing. Tap it."
                show: { drawn: letter-card, text: "The children's teacher gave out two book's each." }
                spans: ["book's"]
              - id: l2-n5
                type: multiple_choice
                text: "Which is right for the hats of many clowns?"
                options: ["the clowns' hats", "the clown's hats", "the clowns's hats"]
                answer: "the clowns' hats"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "The pens belong to the pupils. Which is right?"
            options: ["the pupils' pens", "the pupil's pens", "the pupils pen's"]
            answer: "the pupils' pens"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "The library belongs to the children. Which is right?"
            options: ["the children's library", "the childrens' library", "the child's library"]
            answer: "the children's library"
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "The garden belongs to the people on our street. Fill the gap."
            say: "The garden belongs to the people on our street. Fill the gap."
            frame: "the people_ garden"
            options: ["'s", "s'", "s"]
            answer: ["'s"]
            option_audio: false
          - id: l2-c4
            type: text_input
            keyboard: letters
            text: "Write the owner word with its apostrophe.\nthe paws of the cats → the ____ paws"
            say: "Write the owner word with its apostrophe. The paws of the cats."
            answer: "cats'"
          - id: l2-c5
            type: true_false
            text: "Is it true? \"The ladies' room\" is a room for more than one lady."
            answer: true
