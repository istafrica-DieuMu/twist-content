# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.standard-english-speech
skill: lit-en.speaking.standard-english-speech
curriculum: en-GB
language: en
title:
  de: Deutlich in Standardenglisch sprechen
  en: Speaking clearly in Standard English
summary: >
  Standard English is the form of English used in formal talk and in most
  writing: we were, I saw, those books. It is about the words and grammar,
  not the accent; anyone can speak it in their own accent. Lesson 1 picks
  the Standard English way to say things and knows when to use it; lesson
  2 practises speaking clearly and fluently (pace, volume, no fillers) in
  real situations such as an assembly or a class talk, and ends with the
  skill check. The skill check marks choosing the Standard English form
  and how to speak; speaking aloud is practised in the speak tasks of
  Practise, not marked.
metadata:
  year: year-4
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.speaking.describe-narrate]
  also_practises: [lit-en.grammar.standard-verb-forms]
  vocabulary: { en: [Standard English, formal, informal, audience, clearly, fluently, pace, volume, filler, accent] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: forms, what: { de: "die Standardform wählen (we were, I saw, those books)", en: "choosing the Standard English form (we were, I saw, those books)" } }
    - { id: when, what: { de: "wissen, wann man Standardenglisch spricht, und dass es kein Akzent ist", en: "knowing when to use Standard English, and that it is not an accent" } }
    - { id: clear-fluent, what: { de: "klar und flüssig sprechen: Lautstärke, Tempo, keine Füllwörter", en: "speaking clearly and fluently: volume, pace, no fillers" } }
  misconceptions:
    - id: standard-is-accent
      what: Thinks Standard English means a posh accent, so a regional accent is wrong
      addressed: lesson 1 Learn screen 2; tasks l1-f5 (feedback), l1-s5, l2-c5
    - id: local-forms-everywhere
      what: Uses local spoken forms (we was, I seen, them books) when talking to a formal audience
      addressed: tasks l1-f1 (feedback), l1-f3, l1-s3, l1-n3, l2-f4
    - id: fast-is-fluent
      what: Thinks fluent means talking as fast as possible, with fillers (um, like) to keep going
      addressed: lesson 2 Learn screen 2; tasks l2-f2 (feedback), l2-s2, l2-n2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die Standardform wählen, en: Choosing the Standard English form }
    goal:
      de: "Wähl die Standardform des Englischen, wenn du vor Publikum sprichst, so wie we were statt we was."
      en: "Choose the Standard English way to say things when you talk to an audience, like we were, not we was."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which description helps a listener picture the dog?"
            say: "Which description helps a listener picture the dog best?"
            options: ["It is a small brown dog with floppy ears and a waggy tail.", "It is a dog.", "It is nice."]
            answer: "It is a small brown dog with floppy ears and a waggy tail."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Put the story in order."
            say: "Put the parts of this short story in order: first, next, finally."
            options: ["Finally, we ate our picnic by the river.", "First, we packed a picnic.", "Next, we walked to the river."]
            slot_count: 3
            answer: ["First, we packed a picnic.", "Next, we walked to the river.", "Finally, we ate our picnic by the river."]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "At home: \"We was well tired.\"\nIn assembly: \"We were very tired.\""
            say: "We talk differently with friends and with an audience. At home or in the playground, people often use local forms, like we was. In assembly, a class talk or with a visitor, we use Standard English: we were very tired."
          - text: "Standard English is about words and grammar.\nIt is not about accent."
            say: "Standard English is about which words and which grammar you use. It is not an accent. Someone from Newcastle, Bristol or London can speak Standard English in their own accent."
          - text: "I seen it. → I saw it.\nThem books → those books\nI ain't got one. → I haven't got one."
            say: "Here are some local forms and their Standard English partners. I seen it becomes I saw it. Them books becomes those books. I ain't got one becomes I haven't got one."
          - text: "Formal: assembly, a class talk, a visitor, an interview\nInformal: friends, family, the playground"
            say: "Use Standard English when you speak to an audience or someone you do not know well. With friends and family, informal talk is fine."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "You are telling the class about your trip. Which is Standard English?"
                options: ["We were at the museum all day.", "We was at the museum all day."]
                answer: "We were at the museum all day."
                option_audio: false
                feedback:
                  "We was at the museum all day.": "We was is a local form. In Standard English it is we were."
                hints:
                  - "Which verb goes with we?"
                  - "We is more than one person, so we use were."
                  - "We were at the museum all day."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which is Standard English?"
                options: ["I saw a fox in the garden.", "I seen a fox in the garden."]
                answer: "I saw a fox in the garden."
                option_audio: false
                hints:
                  - "Seen needs a helper word, like have: I have seen."
                  - "Without a helper, the past form is saw."
                  - "I saw a fox in the garden."
              - id: l1-f3
                type: sorting
                text: "Sort the sentences."
                say: "Read each sentence. Is it Standard English or a local spoken form?"
                option_audio: false
                bins:
                  - { id: standard, show: { text: "Standard English" }, say: "Standard English." }
                  - { id: local, show: { text: "local spoken form" }, say: "Local spoken form." }
                options:
                  - { text: "Pass me those pencils.", bin: standard }
                  - { text: "Pass me them pencils.", bin: local }
                  - { text: "I haven't got a ruler.", bin: standard }
                  - { text: "I ain't got a ruler.", bin: local }
                hints:
                  - "Look for them, ain't, we was and I seen."
                  - "Them pencils and ain't are local forms."
                  - "Those pencils and haven't are Standard English."
              - id: l1-f4
                type: multiple_choice
                text: "When should you use Standard English?"
                options: ["giving a talk in assembly", "chatting with your best friend", "playing at home with your brother"]
                answer: "giving a talk in assembly"
                hints:
                  - "Which one has an audience?"
                  - "An assembly is a formal place to speak."
                  - "Giving a talk in assembly."
              - id: l1-f5
                type: true_false
                text: "Is it true? You must change your accent to speak Standard English."
                answer: false
                feedback:
                  "true": "Standard English is about words and grammar. You can speak it in your own accent."
                hints:
                  - "Is Standard English about sounds or about words?"
                  - "It is about which words and grammar you use."
                  - "No. You keep your own accent."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is Standard English?"
                options: ["They were late for the bus.", "They was late for the bus."]
                answer: "They were late for the bus."
                option_audio: false
                hints: ["They, like we, takes were."]
              - id: l1-s2
                type: multiple_choice
                text: "Which is Standard English?"
                options: ["She did her homework.", "She done her homework."]
                answer: "She did her homework."
                option_audio: false
                hints: ["Done needs a helper: she has done. Without it, use did."]
              - id: l1-s3
                type: sorting
                text: "Sort the sentences."
                say: "Read each sentence. Is it Standard English or a local spoken form?"
                option_audio: false
                bins:
                  - { id: standard, show: { text: "Standard English" }, say: "Standard English." }
                  - { id: local, show: { text: "local spoken form" }, say: "Local spoken form." }
                options:
                  - { text: "We were winning at half-time.", bin: standard }
                  - { text: "I seen the match.", bin: local }
                  - { text: "Those boots are muddy.", bin: standard }
                  - { text: "Them boots are muddy.", bin: local }
                hints: ["Look for we was, I seen and them."]
              - id: l1-s4
                type: multiple_choice
                text: "A visitor asks you about your school. Which answer is Standard English?"
                options: ["We haven't got a swimming pool, but we have a big field.", "We ain't got a swimming pool, but we got a big field."]
                answer: "We haven't got a swimming pool, but we have a big field."
                option_audio: false
                hints: ["Ain't is a local form."]
              - id: l1-s5
                type: true_false
                text: "Is it true? Someone with a Scottish accent can speak Standard English."
                answer: true
                hints: ["Standard English is about words and grammar, not sounds."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is Standard English?"
                options: ["You were right about the answer.", "You was right about the answer."]
                answer: "You were right about the answer."
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which is Standard English?"
                options: ["I have never seen snow.", "I ain't never seen snow."]
                answer: "I have never seen snow."
                option_audio: false
              - id: l1-n3
                type: sorting
                text: "Sort the sentences."
                say: "Read each sentence. Is it Standard English or a local spoken form?"
                option_audio: false
                bins:
                  - { id: standard, show: { text: "Standard English" }, say: "Standard English." }
                  - { id: local, show: { text: "local spoken form" }, say: "Local spoken form." }
                options:
                  - { text: "I did my best.", bin: standard }
                  - { text: "We was singing.", bin: local }
                  - { text: "I saw a rainbow.", bin: standard }
                  - { text: "I done my best.", bin: local }
              - id: l1-n4
                type: multiple_choice
                text: "Where would informal talk be fine?"
                options: ["telling your cousin a joke", "reading the news on the school radio", "answering the head teacher in assembly"]
                answer: "telling your cousin a joke"
              - id: l1-n5
                type: speak
                text: "Say it in Standard English: \"We was well happy when we seen the elephants.\""
                say: "Say this sentence again in Standard English. Then listen to an example."
                expected_text: "We were very happy when we saw the elephants."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is Standard English?"
            options: ["The children were noisy.", "The children was noisy."]
            answer: "The children were noisy."
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which is Standard English?"
            options: ["Can I borrow those scissors?", "Can I borrow them scissors?"]
            answer: "Can I borrow those scissors?"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? You should use Standard English when you give a class talk."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Which is Standard English?"
            options: ["I haven't seen it.", "I ain't seen it."]
            answer: "I haven't seen it."
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Which is a formal situation?"
            options: ["showing a visitor round the school", "playing football with friends", "having tea with your family"]
            answer: "showing a visitor round the school"
          - id: l1-c6
            type: true_false
            text: "\"She done a brilliant drawing.\"\n\nIs this Standard English?"
            answer: false

  - n: 2
    title: { de: Klar und flüssig sprechen, en: Speaking clearly and fluently }
    goal:
      de: "Sprich in einem Vortrag klar und flüssig, laut genug für die letzte Reihe und ohne um oder like."
      en: "Speak clearly and smoothly in a class talk, loud enough for the back row and without um or like."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is Standard English?"
            options: ["I saw my teacher at the shop.", "I seen my teacher at the shop."]
            answer: "I saw my teacher at the shop."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which needs Standard English?"
            options: ["a talk to the school council", "a game of tag", "a chat with your gran on the phone"]
            answer: "a talk to the school council"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Clearly: loud enough for the back row, not too fast, every word finished."
            say: "Speaking clearly means the whole room can hear and follow you. Speak loud enough for the back row, keep a steady pace, and finish every word."
          - text: "\"Um, so, like, the Romans, um, built roads.\"\n\"The Romans built long, straight roads.\""
            say: "Speaking fluently means speaking smoothly, without lots of um, like and so. Fluent does not mean fast. A short pause is better than a filler word."
          - text: "Before you speak: plan, practise, look up."
            say: "Before a talk, plan what you will say, practise it out loud, and look up at your audience while you speak."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Amir is reading a notice in assembly. The children at the back cannot hear him. What should he do?"
                options: ["speak louder and look up", "speak faster", "read it more quietly"]
                answer: "speak louder and look up"
                hints:
                  - "What does the back row need?"
                  - "They need more volume."
                  - "Speak louder and look up."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which sounds more fluent?"
                options: ["Our class grew sunflowers. The tallest one reached two metres.", "Um, our class, like, grew, um, sunflowers and, like, the tallest one, um, reached two metres."]
                answer: "Our class grew sunflowers. The tallest one reached two metres."
                option_audio: false
                feedback:
                  "Um, our class, like, grew, um, sunflowers and, like, the tallest one, um, reached two metres.": "The fillers um and like break up the talk. Fluent talk is smooth, with short pauses instead."
                hints:
                  - "Look for filler words."
                  - "Um and like are fillers."
                  - "The one with no fillers: Our class grew sunflowers."
              - id: l2-f3
                type: true_false
                text: "Is it true? Speaking fluently means speaking as fast as you can."
                answer: false
                hints:
                  - "Can a listener follow very fast talk?"
                  - "Fluent means smooth, at a steady pace."
                  - "No. Fluent is smooth, not fast."
              - id: l2-f4
                type: multiple_choice
                text: "Grace tells the head teacher about the charity cake sale. Which sentence should she use?"
                options: ["We raised £85 and we were really pleased.", "We raised £85 and we was well pleased."]
                answer: "We raised £85 and we were really pleased."
                option_audio: false
                hints:
                  - "She is talking to the head teacher, so it is formal."
                  - "We goes with were."
                  - "We raised £85 and we were really pleased."
              - id: l2-f5
                type: speak
                text: "Tell the class one thing you did at the weekend, in Standard English. Speak clearly, without fillers."
                say: "Tell the class one thing you did at the weekend. Use Standard English and speak clearly. Then listen to an example."
                expected_text: "At the weekend, I went to the park with my sister and we played football."
                hints:
                  - "Plan your sentence before you start."
                  - "Start with: At the weekend, I went ..."
                  - "At the weekend, I went to the park with my sister."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Maya practises her class talk. What is the best way to get ready?"
                options: ["say it out loud a few times", "read it once in her head", "learn to say it faster"]
                answer: "say it out loud a few times"
                hints: ["Practise the way you will do it on the day."]
              - id: l2-s2
                type: multiple_choice
                text: "Leo forgets his next point during his talk. What should he do?"
                options: ["pause, check his notes, then go on", "say um until he remembers", "stop and sit down"]
                answer: "pause, check his notes, then go on"
                hints: ["A short pause is better than a filler."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the filler words."
                say: "Tap every filler word in this sentence from a talk."
                show: { drawn: letter-card, text: "Hedgehogs um sleep all winter and like wake up in spring." }
                spans: ["um", "like"]
                hints: ["Which words could you take out without changing the meaning?"]
              - id: l2-s4
                type: multiple_choice
                text: "Ben is interviewing a visiting author. Which question is Standard English?"
                options: ["What did you write first?", "What did you wrote first?", "What you done first?"]
                answer: "What did you write first?"
                option_audio: false
                hints: ["After did, use the base form: did you write."]
              - id: l2-s5
                type: speak
                text: "Introduce yourself to a visitor. Say your name, your class and one thing you like about school."
                say: "A visitor has come to your class. Introduce yourself clearly in Standard English. Then listen to an example."
                expected_text: "Good morning. My name is Sam and I am in Year 4. I really like our school library."
                hints: ["Start with: Good morning. My name is ..."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "You are reading a poem to the whole school. Which is most important?"
                options: ["speak clearly so everyone can hear", "finish as quickly as possible", "keep your eyes on the floor"]
                answer: "speak clearly so everyone can hear"
              - id: l2-n2
                type: true_false
                text: "Is it true? A short pause is better than saying um."
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Ella reports back to the class. Which sentence is Standard English?"
                options: ["Our group found three kinds of beetle.", "Our group found three kind of beetles what were black.", "Us group found three kinds of beetle."]
                answer: "Our group found three kinds of beetle."
                option_audio: false
              - id: l2-n4
                type: highlight_in_text
                text: "Tap the words that are not Standard English."
                say: "Tap the two words that are not Standard English."
                show: { drawn: letter-card, text: "Yesterday we was at the beach and I seen a seal." }
                spans: ["was", "seen"]
              - id: l2-n5
                type: speak
                text: "Explain to a new pupil how to get from the classroom to the hall."
                say: "A new pupil asks the way to the hall. Explain clearly in Standard English. Then listen to an example."
                expected_text: "Go out of the classroom and turn left. Walk past the library, and the hall is at the end of the corridor."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: forms
            type: multiple_choice
            text: "Which is Standard English?"
            options: ["We were cold at the bus stop.", "We was cold at the bus stop."]
            answer: "We were cold at the bus stop."
            option_audio: false
          - id: l2-c2
            part: forms
            type: multiple_choice
            text: "Which is Standard English?"
            options: ["I did the washing-up.", "I done the washing-up."]
            answer: "I did the washing-up."
            option_audio: false
          - id: l2-c3
            part: clear-fluent
            type: multiple_choice
            text: "Which sounds most fluent in a talk?"
            options: ["Volcanoes can erupt without warning.", "So, um, volcanoes, like, can erupt, um, without warning.", "Volcanoes volcanoes can erupt without warning."]
            answer: "Volcanoes can erupt without warning."
            option_audio: false
          - id: l2-c4
            part: clear-fluent
            type: multiple_choice
            text: "The children at the back cannot hear Zara's talk. What should she change?"
            options: ["her volume", "her accent", "her topic"]
            answer: "her volume"
          - id: l2-c5
            part: when
            type: true_false
            text: "Is it true? Standard English is a way of speaking with a posh accent."
            answer: false
          - id: l2-c6
            part: forms
            type: highlight_in_text
            text: "Tap the words that are not Standard English."
            say: "Tap the two words you would change to make this Standard English."
            show: { drawn: letter-card, text: "Them flowers was planted by our class." }
            spans: ["Them", "was"]
          - id: l2-c7
            part: forms
            type: sorting
            text: "Sort the sentences: Standard English or local spoken form?"
            say: "Is each sentence Standard English or a local spoken form? Sort them."
            option_audio: false
            bins:
              - { id: standard, show: { text: "Standard English" }, say: "Standard English." }
              - { id: local, show: { text: "local spoken form" }, say: "Local spoken form." }
            options:
              - { text: "They were in the hall.", bin: standard }
              - { text: "I ain't finished yet.", bin: local }
              - { text: "We saw the film.", bin: standard }
              - { text: "She done it already.", bin: local }
          - id: l2-c8
            part: forms
            type: multiple_choice
            text: "Which is Standard English?"
            options: ["Mum hasn't got the keys.", "Mum ain't got the keys."]
            answer: "Mum hasn't got the keys."
            option_audio: false
          - id: l2-c9
            part: forms
            type: multiple_choice
            text: "How do you say \"Them shoes are mine\" in Standard English?"
            options: ["Those shoes are mine.", "Them shoes is mine.", "Them ones are mine."]
            answer: "Those shoes are mine."
            option_audio: false
          - id: l2-c10
            part: forms
            type: true_false
            text: "\"We was really pleased with our score.\"\n\nIs this Standard English?"
            answer: false
          - id: l2-c11
            part: when
            type: multiple_choice
            text: "Which of these needs Standard English?"
            options: ["answering questions from a visiting scientist", "joking with your friends at lunch", "playing a game with your sister"]
            answer: "answering questions from a visiting scientist"
          - id: l2-c12
            part: when
            type: true_false
            text: "Is it true? Informal talk is fine with your friends in the playground."
            answer: true
          - id: l2-c13
            part: when
            type: multiple_choice
            text: "Why do we use Standard English in a class talk?"
            options: ["so everyone in the audience can follow us", "because our own accent is wrong", "so the talk lasts longer"]
            answer: "so everyone in the audience can follow us"
          - id: l2-c14
            part: when
            type: multiple_choice
            text: "You phone the dentist to make an appointment for your mum. How should you speak?"
            options: ["politely, in Standard English", "with lots of slang", "as you would to your best friend"]
            answer: "politely, in Standard English"
          - id: l2-c15
            part: when
            type: multiple_choice
            text: "Which situation is informal?"
            options: ["telling your brother about a film", "giving a speech at the school fair", "reading a report to the class"]
            answer: "telling your brother about a film"
          - id: l2-c16
            part: when
            type: sorting
            text: "Sort the situations: formal or informal?"
            say: "Is each situation formal or informal? Sort them."
            option_audio: false
            bins:
              - { id: formal, show: { text: "formal" }, say: "Formal." }
              - { id: informal, show: { text: "informal" }, say: "Informal." }
            options:
              - { text: "an interview for the school council", bin: formal }
              - { text: "a sleepover with friends", bin: informal }
              - { text: "a speech to the parents at sports day", bin: formal }
              - { text: "a chat with your cousin", bin: informal }
          - id: l2-c17
            part: clear-fluent
            type: highlight_in_text
            text: "Tap the filler words."
            say: "Tap every filler word in this sentence."
            show: { drawn: letter-card, text: "The Vikings, um, sailed from, like, Norway in longships." }
            spans: ["um", "like"]
          - id: l2-c18
            part: clear-fluent
            type: multiple_choice
            text: "Josh speaks so fast in his talk that nobody can follow. What should he change?"
            options: ["his pace", "his topic", "his accent"]
            answer: "his pace"
          - id: l2-c19
            part: clear-fluent
            type: true_false
            text: "Is it true? Looking up at your audience helps them to follow your talk."
            answer: true
          - id: l2-c20
            part: clear-fluent
            type: multiple_choice
            text: "Priya's talk is clear and loud, but she says um after every sentence. What would make it more fluent?"
            options: ["a short pause instead of um", "speaking much faster", "reading it in a whisper"]
            answer: "a short pause instead of um"
