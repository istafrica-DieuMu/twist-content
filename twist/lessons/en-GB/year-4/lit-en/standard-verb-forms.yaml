# Lesson set: English, Year 4. Hand-authored draft.
id: en-GB.lit-en.standard-verb-forms
skill: lit-en.grammar.standard-verb-forms
curriculum: en-GB
language: en
title:
  de: Verbformen im Standardenglisch
  en: Standard English verb forms
summary: >
  Many verbs have two past forms: one on its own (I did, I saw, I wrote)
  and one after have or has (I have done, I have seen, I have written).
  Local spoken English often swaps them (I done it, I seen it). Lesson 1
  chooses the Standard English simple past and was or were; lesson 2 uses
  the forms after have and has, corrects them in short texts and writes
  them, then ends with the skill check.
metadata:
  year: year-4
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.standard-english]
  also_practises: [lit-en.speaking.standard-english-speech]
  vocabulary: { en: [Standard English, verb, past tense, simple past, have, has, local spoken form] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: helper-form-alone
      what: Uses the have-form without have (I done it, I seen it, she been there)
      addressed: lesson 1 Learn screen 2; tasks l1-f1 (feedback), l1-f2, l1-s2, l1-n2, l2-c1
    - id: past-after-have
      what: Uses the simple past after have or has (I have wrote, she has went)
      addressed: lesson 2 Learn screen 1; tasks l2-f1 (feedback), l2-f3, l2-s1, l2-n1, l2-c2
    - id: was-with-plural
      what: Uses was with we, you or they (we was, they was)
      addressed: tasks l1-f3, l1-s3, l1-n3, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "I did, nicht I done", en: "I did, not I done" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is Standard English?"
            options: ["We were tired.", "We was tired."]
            answer: "We were tired."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which is Standard English?"
            options: ["Pass me those books.", "Pass me them books."]
            answer: "Pass me those books."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "do → I did → I have done\nsee → I saw → I have seen\nwrite → I wrote → I have written"
            say: "Some verbs have two past forms. One stands on its own: I did, I saw, I wrote. The other needs have or has in front: I have done, I have seen, I have written."
          - text: "I done my homework. (local spoken form)\nI did my homework. (Standard English)"
            say: "In some places people say I done or I seen. That is a local spoken form. In Standard English, done and seen always need have or has. On their own, use did and saw."
          - text: "go: went, have gone\ncome: came, have come\nring: rang, has rung\nthrow: threw, has thrown\ndig: dug, has dug"
            say: "Here are more verbs to learn. Go: we went, we have gone. Come: I came, I have come. Ring: it rang, it has rung. Throw: he threw, he has thrown. Dig is easy: dug both times."
          - text: "I was   he was   she was   it was\nwe were   you were   they were"
            say: "Was and were follow a pattern too. I, he, she and it take was. We, you and they take were."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Choose the Standard English verb.\nI ___ a shooting star last night."
                options: ["saw", "seen", "seed"]
                answer: "saw"
                feedback:
                  "seen": "Seen needs have in front: I have seen. On its own, use saw."
                hints:
                  - "Is there a have or has in front?"
                  - "No, so use the form that stands alone."
                  - "saw."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Choose the Standard English verb.\nShe ___ the washing-up after tea."
                options: ["did", "done", "doed"]
                answer: "did"
                hints:
                  - "Is there a has in front?"
                  - "No. Done needs has."
                  - "did."
              - id: l1-f3
                type: fill_in_blank
                text: "Fill the gap with was or were."
                say: "Fill the gap with was or were. They blank at the swimming pool."
                frame: "They _ at the swimming pool."
                options: ["was", "were"]
                answer: ["were"]
                hints:
                  - "Who is it about? They."
                  - "We, you and they take were."
                  - "were."
              - id: l1-f4
                type: multiple_choice
                text: "Choose the Standard English verb.\nOur class ___ a letter to the Mayor."
                options: ["wrote", "written", "writed"]
                answer: "wrote"
                hints:
                  - "Is there a has in front?"
                  - "Written needs has: has written."
                  - "wrote."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the verb that is not Standard English."
                say: "Tap the verb that is a local spoken form, not Standard English."
                show: { drawn: letter-card, text: "Jo and I come home late yesterday." }
                spans: ["come"]
                hints:
                  - "Yesterday tells you it is the past."
                  - "The past of come, standing alone, is came."
                  - "come."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Choose the Standard English verb.\nWe ___ to the cinema on Friday."
                options: ["went", "gone", "goed"]
                answer: "went"
                hints: ["Gone needs have: we have gone."]
              - id: l1-s2
                type: multiple_choice
                text: "Choose the Standard English verb.\nI ___ that film last week."
                options: ["saw", "seen", "see"]
                answer: "saw"
                hints: ["No have in front, so use the form that stands alone."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill the gap with was or were."
                say: "Fill the gap with was or were. The cake blank delicious."
                frame: "The cake _ delicious."
                options: ["was", "were"]
                answer: ["was"]
                hints: ["The cake is one thing, like it."]
              - id: l1-s4
                type: multiple_choice
                text: "Choose the Standard English verb.\nThe bell ___ at three o'clock."
                options: ["rang", "rung", "ringed"]
                answer: "rang"
                hints: ["Rung needs has: has rung."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the verb that is not Standard English."
                say: "Tap the verb that is a local spoken form, not Standard English."
                show: { drawn: letter-card, text: "I done all my spellings before tea." }
                spans: ["done"]
                hints: ["Which verb needs have in front?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Choose the Standard English verb.\nKai ___ the ball over the fence."
                options: ["threw", "thrown", "throwed"]
                answer: "threw"
              - id: l1-n2
                type: multiple_choice
                text: "Choose the Standard English verb.\nMum ___ me at the school gate."
                options: ["saw", "seen", "seed"]
                answer: "saw"
              - id: l1-n3
                type: fill_in_blank
                text: "Fill the gap with was or were."
                say: "Fill the gap with was or were. We blank singing in the choir."
                frame: "We _ singing in the choir."
                options: ["was", "were"]
                answer: ["were"]
              - id: l1-n4
                type: multiple_choice
                text: "Choose the Standard English verb.\nThe dog ___ a hole in the lawn."
                options: ["dug", "digged", "dugged"]
                answer: "dug"
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the verb that is not Standard English."
                say: "Tap the verb that is a local spoken form, not Standard English."
                show: { drawn: letter-card, text: "Last week our team done really well." }
                spans: ["done"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Choose the Standard English verb.\nHe ___ his best in the race."
            options: ["did", "done", "doed"]
            answer: "did"
          - id: l1-c2
            type: fill_in_blank
            text: "Fill the gap with was or were."
            say: "Fill the gap with was or were. Grandad blank asleep in his chair."
            frame: "Grandad _ asleep in his chair."
            options: ["was", "were"]
            answer: ["was"]
          - id: l1-c3
            type: multiple_choice
            text: "Choose the Standard English verb.\nWe ___ a fox in the park."
            options: ["saw", "seen", "seed"]
            answer: "saw"

  - n: 2
    title: { de: Nach have und has, en: After have and has }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Choose the Standard English verb.\nI ___ a robin this morning."
            options: ["saw", "seen", "seed"]
            answer: "saw"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Fill the gap with was or were."
            say: "Fill the gap with was or were. They blank late for school."
            frame: "They _ late for school."
            options: ["was", "were"]
            answer: ["were"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I have wrote (local)   I have written (Standard English)\nShe has went (local)   She has gone (Standard English)"
            say: "After have or has, use the second past form. Not I have wrote, but I have written. Not she has went, but she has gone."
          - text: "go: went, gone   eat: ate, eaten   take: took, taken\nbreak: broke, broken   draw: drew, drawn"
            say: "Learn the pairs together. Went, gone. Ate, eaten. Took, taken. Broke, broken. Drew, drawn. The first stands alone; the second goes after have or has."
          - text: "Look for have or has. Then choose."
            say: "So when you check your writing: look for have or has in front of the verb. If it is there, use the second form. If it is not, use the first."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Choose the Standard English verb.\nI have ___ three stories this term."
                options: ["written", "wrote", "writ"]
                answer: "written"
                feedback:
                  "wrote": "Wrote stands alone. After have, use written: I have written."
                hints:
                  - "Is there a have in front?"
                  - "Yes, so use the form that goes with have."
                  - "written."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Choose the Standard English verb.\nGrandpa has ___ to the shop."
                options: ["gone", "went", "goed"]
                answer: "gone"
                hints:
                  - "Has is in front of the verb."
                  - "The pair is went, gone."
                  - "gone."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the verb that is not Standard English."
                say: "Tap the verb that is a local spoken form, not Standard English."
                show: { drawn: letter-card, text: "Oh no! Someone has took my pencil case." }
                spans: ["took"]
                hints:
                  - "Has is in front of the verb."
                  - "The pair is took, taken."
                  - "took. It should be taken."
              - id: l2-f4
                type: text_input
                keyboard: letters
                text: "Write the Standard English verb.\nWe have ______ all the biscuits. (eat)"
                say: "Write the right form of eat. We have blank all the biscuits."
                answer: "eaten"
                hints:
                  - "Have is in front of the verb."
                  - "The pair is ate, eaten."
                  - "eaten."
              - id: l2-f5
                type: multiple_choice
                text: "Which sentence is Standard English?"
                options: ["The vase has broken.", "The vase has broke.", "The vase broken."]
                answer: "The vase has broken."
                option_audio: false
                hints:
                  - "Look for has."
                  - "The pair is broke, broken."
                  - "The vase has broken."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Choose the Standard English verb.\nHave you ___ my new trainers?"
                options: ["seen", "saw", "seed"]
                answer: "seen"
                hints: ["Have is in front: use seen."]
              - id: l2-s2
                type: text_input
                keyboard: letters
                text: "Write the Standard English verb.\nThe bus has ______ without us. (go)"
                say: "Write the right form of go. The bus has blank without us."
                answer: "gone"
                hints: ["The pair is went, gone."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the verb that is not Standard English."
                say: "Tap the verb that is a local spoken form, not Standard English."
                show: { drawn: letter-card, text: "Max has ate the last slice of pizza." }
                spans: ["ate"]
                hints: ["After has, use eaten."]
              - id: l2-s4
                type: multiple_choice
                text: "Choose the Standard English verb.\nYesterday I ___ my lunch in the hall."
                options: ["ate", "eaten", "eated"]
                answer: "ate"
                hints: ["Is there a have in front?"]
              - id: l2-s5
                type: text_input
                keyboard: letters
                text: "Write the Standard English verb.\nI ______ a picture of the castle. (draw)"
                say: "Write the past form of draw. There is no have in front. I blank a picture of the castle."
                answer: "drew"
                hints: ["The pair is drew, drawn. There is no have."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Choose the Standard English verb.\nMy sister has ___ the window by accident."
                options: ["broken", "broke", "breaked"]
                answer: "broken"
              - id: l2-n2
                type: text_input
                keyboard: letters
                text: "Write the Standard English verb.\nHave you ______ your medicine? (take)"
                say: "Write the right form of take. Have you blank your medicine?"
                answer: "taken"
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the verbs that are not Standard English."
                say: "Tap the two verbs that are local spoken forms, not Standard English."
                show: { drawn: letter-card, text: "We seen the play and I done a review." }
                spans: ["seen", "done"]
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence is Standard English?"
                options: ["They have been to France twice.", "They been to France twice.", "They was in France twice."]
                answer: "They have been to France twice."
                option_audio: false
              - id: l2-n5
                type: text_input
                keyboard: letters
                text: "Write the Standard English verb.\nThe postman ______ at nine o'clock. (come)"
                say: "Write the past form of come. There is no has in front. The postman blank at nine o'clock."
                answer: "came"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Choose the Standard English verb.\nI ___ my spellings in ten minutes."
            options: ["did", "done", "doed"]
            answer: "did"
          - id: l2-c2
            type: multiple_choice
            text: "Choose the Standard English verb.\nShe has ___ a poem for the assembly."
            options: ["written", "wrote", "writed"]
            answer: "written"
          - id: l2-c3
            type: text_input
            keyboard: letters
            text: "Write the Standard English verb.\nHave you ______ your homework? (do)"
            say: "Write the right form of do. Have you blank your homework?"
            answer: "done"
          - id: l2-c4
            type: fill_in_blank
            text: "Fill the gap with was or were."
            say: "Fill the gap with was or were. My friends blank waiting outside."
            frame: "My friends _ waiting outside."
            options: ["was", "were"]
            answer: ["were"]
          - id: l2-c5
            type: highlight_in_text
            text: "Tap the verb that is not Standard English."
            say: "Tap the verb that is a local spoken form, not Standard English."
            show: { drawn: letter-card, text: "Our cat has went next door again." }
            spans: ["went"]
