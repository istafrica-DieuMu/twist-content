# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.translate
skill: math.coordinates.translate
curriculum: en-GB
language: en
title:
  de: Verschiebungen im Koordinatensystem
  en: Translations on a grid
summary: >
  Translating points and shapes on a coordinate grid in the first
  quadrant. Lesson 1 describes a translation by following one corner
  (3 right, 2 up) and finds where a point lands; lesson 2 carries out a
  translation of a whole shape, slides it back the opposite way, tells a
  translation from a flip, and ends with the skill check. In every stage
  and both checks the child also taps where a moved point or corner lands
  (point_on_grid).
metadata:
  year: year-4
  topic: { de: Koordinaten, en: Coordinates }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.coordinates.first-quadrant]
  also_practises: [math.coordinates.first-quadrant]
  vocabulary: { en: [translate, translation, coordinates, left, right, up, down, corner, vertex, slide] }
  forms: [drawn, text, audio]
  drawn: [coordinates]
  facets: []
  misconceptions:
    - id: counts-the-gap
      what: Counts the empty squares between the two shapes instead of how far one corner moves
      addressed: lesson 1 Learn follows one corner; l1-f2 and l1-s3 offer the gap as an option, with feedback in l1-f2
    - id: swaps-across-and-up
      what: Mixes up the across and up parts (says 2 right, 3 up for 3 right, 2 up) or adds to the wrong coordinate
      addressed: lesson 1 Learn says across first, then up; l1-f5 has feedback on the swapped pair, and l1-n1, l2-n4 and l2-c1 offer it again
    - id: opposite-direction
      what: Describes the move back to front (4 right, 3 up for a shape that went 4 left, 3 down)
      addressed: lesson 2 Learn slides a shape back the opposite way; l2-f3 has feedback on it, and l2-f4 and l2-c4 offer it
    - id: flip-is-translation
      what: Thinks a shape that has been flipped or turned has been translated
      addressed: lesson 1 Learn says a translation does not turn or flip; l2-s1 offers a flipped copy and l2-n5 asks about one
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Eine Verschiebung beschreiben, en: Describe a translation }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What are the coordinates of A?"
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[3, 5, A]] }
            options: ["(3, 5)", "(5, 3)", "(3, 3)"]
            answer: "(3, 5)"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Write the coordinates of B."
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[6, 2, B]] }
            frame: "B = ( _ , _ )"
            options: ["2", "4", "6"]
            answer: ["6", "2"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A translation is a slide."
            say: "To translate a shape means to slide it. It does not turn, it does not flip and it does not change size. This triangle slides 3 squares right and 2 squares up."
            show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [4, 1], [1, 3]], moved: [[4, 3], [7, 3], [4, 5]] }
          - text: "(1, 1) → (4, 3)\n3 right, 2 up"
            say: "Follow one corner. Count across first: from 1 to 4 is 3 squares right. Then count up: from 1 to 3 is 2 squares up. Do not count the gap between the shapes."
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[1, 1, A], [4, 3, B]] }
          - text: "(6, 7) → 2 left, 4 down → (4, 3)"
            say: "Right adds to the first number and left takes away from it. Up adds to the second number and down takes away from it. Six take away two is four. Seven take away four is three."
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[6, 7, C], [4, 3, D]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Point A moves to point B. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 8, points: [[2, 3, A], [5, 3, B]] }
                options: ["3 right", "3 left", "3 up"]
                answer: "3 right"
                hints:
                  - "Does A go across or up to reach B?"
                  - "A and B are on the same row. Count across from 2 to 5."
                  - "3 squares right."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "The purple square slides to the green square. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [3, 1], [3, 3], [1, 3]], moved: [[1, 5], [3, 5], [3, 7], [1, 7]] }
                options: ["4 up", "2 up", "4 right"]
                answer: "4 up"
                feedback:
                  "2 up": "That is the gap between the squares. Follow one corner: (1, 1) moves to (1, 5)."
                hints:
                  - "Pick one corner of the purple square and find the same corner on the green one."
                  - "The bottom left corner goes from (1, 1) to (1, 5)."
                  - "From 1 to 5 is 4 up."
              - id: l1-f3
                type: fill_in_blank
                text: "Translate (2, 4) 3 right."
                frame: "( _ , _ )"
                options: ["2", "4", "5", "7"]
                answer: ["5", "4"]
                hints:
                  - "Right changes the first number."
                  - "2 and 3 more is 5. The second number stays the same."
                  - "(5, 4)."
              - id: l1-f4
                type: point_on_grid
                text: "Point C (6, 5) moves 2 left and 1 down. Tap where it lands."
                show: { drawn: coordinates, quadrants: 1, max: 8, points: [[6, 5, C]] }
                answer: [4, 4]
                feedback:
                  "8,6": "That is 2 right and 1 up. Left and down both take away."
                  "4,6": "Down takes away from the second number: 5 take away 1 is 4."
                hints:
                  - "Left and down both take away."
                  - "6 take away 2, then 5 take away 1."
                  - "Tap (4, 4)."
              - id: l1-f5
                type: multiple_choice
                text: "The purple triangle slides to the green triangle. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[2, 1], [4, 1], [2, 4]], moved: [[5, 3], [7, 3], [5, 6]] }
                options: ["3 right, 2 up", "2 right, 3 up", "3 right, 3 up"]
                answer: "3 right, 2 up"
                feedback:
                  "2 right, 3 up": "Count across first. The corner (2, 1) goes across from 2 to 5, which is 3 right."
                hints:
                  - "Follow the corner (2, 1). Where is it on the green triangle?"
                  - "It goes to (5, 3). Across from 2 to 5, then up from 1 to 3."
                  - "3 right, 2 up."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Point P moves to point Q. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 8, points: [[1, 6, P], [1, 2, Q]] }
                options: ["4 down", "4 up", "6 down"]
                answer: "4 down"
                hints: ["Count from 6 down to 2."]
              - id: l1-s2
                type: fill_in_blank
                text: "Translate (7, 3) 4 left."
                frame: "( _ , _ )"
                options: ["3", "7", "11"]
                answer: ["3", "3"]
                hints: ["Left takes away from the first number."]
              - id: l1-s3
                type: multiple_choice
                text: "The purple rectangle slides to the green rectangle. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 2], [4, 2], [4, 4], [1, 4]], moved: [[5, 2], [8, 2], [8, 4], [5, 4]] }
                options: ["4 right", "1 right", "7 right"]
                answer: "4 right"
                hints: ["Follow one corner: (1, 2) goes to (5, 2)."]
              - id: l1-s4
                type: true_false
                text: "Is it true? (3, 2) translated 2 right and 5 up lands on (5, 7)."
                answer: true
                hints: ["Add 2 to the first number and 5 to the second."]
              - id: l1-s5
                type: point_on_grid
                text: "Point D (5, 8) moves 3 right and 4 down. Tap where it lands."
                show: { drawn: coordinates, quadrants: 1, max: 8, points: [[5, 8, D]] }
                answer: [8, 4]
                feedback:
                  "2,4": "That is 3 left. Right adds to the first number: 5 and 3 more is 8."
                  "4,8": "You swapped the numbers. Along first: 8 along, then 4 up."
                hints: ["Right adds to the first number, down takes away from the second."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The purple triangle slides to the green triangle. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 5], [3, 5], [1, 8]], moved: [[4, 1], [6, 1], [4, 4]] }
                options: ["3 right, 4 down", "3 right, 4 up", "4 right, 3 down"]
                answer: "3 right, 4 down"
              - id: l1-n2
                type: fill_in_blank
                text: "Translate (6, 6) 5 left and 2 up."
                frame: "( _ , _ )"
                options: ["1", "4", "8", "11"]
                answer: ["1", "8"]
              - id: l1-n3
                type: text_input
                text: "Point A moves to point B. How many squares left does it move?"
                show: { drawn: coordinates, quadrants: 1, max: 8, points: [[8, 2, A], [3, 2, B]] }
                answer: "5"
              - id: l1-n4
                type: true_false
                text: "Is it true? After a translation the shape is bigger."
                answer: false
              - id: l1-n5
                type: point_on_grid
                text: "Point P (2, 3) is translated 4 right and 3 up. Tap where it lands."
                show: { drawn: coordinates, quadrants: 1, max: 8, points: [[2, 3, P]] }
                answer: [6, 6]
                feedback:
                  "5,7": "That is 3 right and 4 up. Count across first: 4 right."
                  "6,3": "That is only 4 right. Now go 3 up as well."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The purple square slides to the green square. Describe the translation."
            show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[2, 2], [4, 2], [4, 4], [2, 4]], moved: [[6, 3], [8, 3], [8, 5], [6, 5]] }
            options: ["4 right, 1 up", "2 right, 1 up", "1 right, 4 up"]
            answer: "4 right, 1 up"
          - id: l1-c2
            type: point_on_grid
            text: "Point A (4, 7) is translated 3 right and 2 down. Tap where it lands."
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[4, 7, A]] }
            answer: [7, 5]
            feedback:
              "5,7": "You swapped the numbers. Along first: 7 along, then 5 up."
              "1,5": "That is 3 left. Right adds to the first number: 4 and 3 more is 7."
          - id: l1-c3
            type: multiple_choice
            text: "E (5, 3) moves to F (5, 8). Describe the translation."
            options: ["5 up", "5 right", "8 up"]
            answer: "5 up"

  - n: 2
    title: { de: Eine Figur verschieben, en: Translate a shape }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Translate (3, 3) 2 right and 4 up."
            frame: "( _ , _ )"
            options: ["1", "5", "7"]
            answer: ["5", "7"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Point A moves to point B. Describe the translation."
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[5, 6, A], [2, 6, B]] }
            options: ["3 left", "3 right", "2 left"]
            answer: "3 left"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4 right, 1 up\n(1, 2) → (5, 3)\n(3, 2) → (7, 3)\n(1, 5) → (5, 6)"
            say: "To translate a whole shape, move every corner the same way: 4 right and 1 up. Then join the new corners. The shape keeps its size and stays the same way round."
            show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 2], [3, 2], [1, 5]], moved: [[5, 3], [7, 3], [5, 6]] }
          - text: "There: 4 right, 1 up\nBack: 4 left, 1 down"
            say: "To slide the green triangle back, go the opposite way. Right becomes left and up becomes down: 4 left and 1 down."
            show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 2], [3, 2], [1, 5]], moved: [[5, 3], [7, 3], [5, 6]] }
          - text: "Same shape, same size, same way round."
            say: "Check a translation: the new shape must be the same shape and size, and it must not be turned or flipped. This green triangle is flipped, so it is not a translation."
            show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [3, 1], [1, 4]], moved: [[7, 1], [5, 1], [7, 4]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Translate the purple square 3 right and 2 up. Which picture is right?"
                options:
                  - { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [3, 1], [3, 3], [1, 3]], moved: [[4, 3], [6, 3], [6, 5], [4, 5]], key: r3u2 }
                  - { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [3, 1], [3, 3], [1, 3]], moved: [[3, 4], [5, 4], [5, 6], [3, 6]], key: r2u3 }
                  - { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [3, 1], [3, 3], [1, 3]], moved: [[4, 1], [6, 1], [6, 3], [4, 3]], key: r3u0 }
                answer: r3u2
                hints:
                  - "Follow the bottom left corner, (1, 1)."
                  - "3 right takes it to (4, 1), then 2 up takes it to (4, 3)."
                  - "The green square has its bottom left corner at (4, 3)."
                difficulty: easy
              - id: l2-f2
                type: point_on_grid
                text: "Translate the triangle 2 right and 3 up. Tap where the corner (4, 1) goes."
                show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [4, 1], [1, 3]] }
                answer: [6, 4]
                feedback:
                  "7,3": "That is 3 right and 2 up. Count across first: 2 right, then 3 up."
                hints:
                  - "Right adds to the first number, up adds to the second."
                  - "4 and 2 more, then 1 and 3 more."
                  - "Tap (6, 4)."
              - id: l2-f3
                type: multiple_choice
                text: "The purple triangle slides to the green triangle. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[5, 5], [7, 5], [5, 8]], moved: [[1, 2], [3, 2], [1, 5]] }
                options: ["4 left, 3 down", "4 right, 3 up", "3 left, 4 down"]
                answer: "4 left, 3 down"
                feedback:
                  "4 right, 3 up": "That is the way back. The purple triangle moves from (5, 5) to (1, 2): that is left and down."
                hints:
                  - "The green triangle is lower and further left."
                  - "The corner (5, 5) goes to (1, 2). Across from 5 to 1, and down from 5 to 2."
                  - "4 left, 3 down."
              - id: l2-f4
                type: multiple_choice
                text: "A shape was translated 5 right and 2 up. Which translation slides it back?"
                options: ["5 left, 2 down", "5 right, 2 down", "2 left, 5 down"]
                answer: "5 left, 2 down"
                hints:
                  - "To go back, go the opposite way."
                  - "Right becomes left, up becomes down. The numbers stay."
                  - "5 left, 2 down."
              - id: l2-f5
                type: true_false
                text: "Is it true? The purple rectangle was translated 3 right and 3 up."
                show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [3, 1], [3, 2], [1, 2]], moved: [[4, 4], [6, 4], [6, 5], [4, 5]] }
                answer: true
                hints:
                  - "Follow the corner (1, 1)."
                  - "It goes to (4, 4). Across from 1 to 4, up from 1 to 4."
                  - "Yes, 3 right and 3 up."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Translate the purple triangle 1 right and 4 up. Which picture is right?"
                options:
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 1], [5, 1], [2, 3]], moved: [[3, 5], [6, 5], [3, 7]], key: r1u4 }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 1], [5, 1], [2, 3]], moved: [[6, 2], [9, 2], [6, 4]], key: r4u1 }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 1], [5, 1], [2, 3]], moved: [[6, 5], [3, 5], [6, 7]], key: flipped }
                answer: r1u4
                hints: ["The corner (2, 1) goes to (3, 5), and the triangle must not flip."]
              - id: l2-s2
                type: fill_in_blank
                text: "Translate (6, 7) 4 left and 5 down."
                frame: "( _ , _ )"
                options: ["2", "10", "12"]
                answer: ["2", "2"]
                hints: ["Left and down both take away: 6 − 4 and 7 − 5."]
              - id: l2-s3
                type: multiple_choice
                text: "On a treasure map, Zara stands at (2, 3). The treasure is at (7, 8). Describe the translation."
                options: ["5 right, 5 up", "7 right, 8 up", "5 right, 8 up"]
                answer: "5 right, 5 up"
                hints: ["How far is it from 2 to 7 across, and from 3 to 8 up?"]
              - id: l2-s4
                type: point_on_grid
                text: "In a translation, corner A (5, 2) moves to B (8, 6). Tap where corner C (1, 2) goes."
                show: { drawn: coordinates, quadrants: 1, max: 8, points: [[5, 2, A], [8, 6, B], [1, 2, C]] }
                answer: [4, 6]
                feedback:
                  "8,6": "That is where A goes. C moves the same way as A: 3 right and 4 up from (1, 2)."
                  "1,6": "That is only 4 up. Go 3 right as well."
                hints: ["Every corner moves the same way: 3 right and 4 up."]
              - id: l2-s5
                type: true_false
                text: "Is it true? A translation 2 left and then 2 right brings a shape back where it started."
                answer: true
                hints: ["2 right is the opposite of 2 left."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Translate the purple rectangle 4 right and 3 down. Which picture is right?"
                options:
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 4], [4, 4], [4, 6], [1, 6]], moved: [[5, 1], [8, 1], [8, 3], [5, 3]], key: r4d3 }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 4], [4, 4], [4, 6], [1, 6]], moved: [[5, 7], [8, 7], [8, 9], [5, 9]], key: r4u3 }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 4], [4, 4], [4, 6], [1, 6]], moved: [[4, 0], [7, 0], [7, 2], [4, 2]], key: r3d4 }
                answer: r4d3
              - id: l2-n2
                type: point_on_grid
                text: "Point P (9, 2) is translated 6 left and 7 up. Tap where it lands."
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[9, 2, P]] }
                answer: [3, 9]
                feedback:
                  "9,3": "You swapped the numbers. Along first: 3 along, then 9 up."
              - id: l2-n3
                type: multiple_choice
                text: "A robot at (1, 1) moves 4 right and 6 up. Then it moves 2 more right. Where is it now?"
                options: ["(7, 7)", "(5, 7)", "(7, 6)"]
                answer: "(7, 7)"
              - id: l2-n4
                type: multiple_choice
                text: "Which translation moves (4, 9) to (1, 3)?"
                options: ["3 left, 6 down", "3 right, 6 up", "6 left, 3 down"]
                answer: "3 left, 6 down"
              - id: l2-n5
                type: true_false
                text: "Is it true? The green triangle is a translation of the purple triangle."
                show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [3, 1], [1, 3]], moved: [[5, 2], [7, 2], [7, 4]] }
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "The purple triangle slides to the green triangle. Describe the translation."
            show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 3], [3, 3], [2, 6]], moved: [[6, 1], [8, 1], [7, 4]] }
            options: ["5 right, 2 down", "5 right, 2 up", "2 right, 5 down"]
            answer: "5 right, 2 down"
          - id: l2-c2
            type: fill_in_blank
            text: "Translate (5, 4) 3 left and 4 up."
            frame: "( _ , _ )"
            options: ["1", "2", "8", "9"]
            answer: ["2", "8"]
          - id: l2-c3
            type: image_multiple_choice
            text: "Translate the purple square 2 right and 5 up. Which picture is right?"
            options:
              - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 2], [4, 2], [4, 4], [2, 4]], moved: [[4, 7], [6, 7], [6, 9], [4, 9]], key: r2u5 }
              - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 2], [4, 2], [4, 4], [2, 4]], moved: [[7, 4], [9, 4], [9, 6], [7, 6]], key: r5u2 }
              - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 2], [4, 2], [4, 4], [2, 4]], moved: [[4, 5], [6, 5], [6, 7], [4, 7]], key: r2u3 }
            answer: r2u5
          - id: l2-c4
            type: multiple_choice
            text: "Point G (8, 8) moves to point H (3, 6). Describe the translation."
            options: ["5 left, 2 down", "5 right, 2 up", "3 left, 6 down"]
            answer: "5 left, 2 down"
          - id: l2-c5
            type: point_on_grid
            text: "In a translation, corner A (2, 1) moves to B (6, 4). Tap where corner C (2, 5) goes."
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[2, 1, A], [6, 4, B], [2, 5, C]] }
            answer: [6, 8]
            feedback:
              "6,4": "That is where A goes. C moves the same way: 4 right and 3 up from (2, 5)."
