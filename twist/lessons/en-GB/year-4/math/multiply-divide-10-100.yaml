# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.multiply-divide-10-100
skill: math.decimals.divide-by-10-100
curriculum: en-GB
language: en
title:
  de: Mal und geteilt durch 10, 100 und 1000
  en: Multiply and divide by 10, 100 and 1000
summary: >
  Multiplying and dividing by 10, 100 and 1000 as the digits moving
  places in the place value chart, never as "adding a zero". Lesson 1
  multiplies whole numbers by 10, 100 and 1000 and divides multiples of
  10 and 100; lesson 2 divides one- and two-digit numbers by 10 and 100,
  so the answers have tenths and hundredths, multiplies tenths and
  hundredths back to whole numbers, and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Dezimalzahlen, en: Decimals }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.decimals.hundredths, math.large-numbers.to-10000]
  also_practises: [math.decimals.hundredths]
  vocabulary: { en: [multiply, divide, place value, digit, tenths, hundredths, placeholder, decimal point] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart]
  facets: [number-format, operation-signs, currency]
  parts:
    - { id: mult-whole, what: { de: "ganze Zahlen mit 10, 100 und 1000 multiplizieren", en: "multiplying whole numbers by 10, 100 and 1000" } }
    - { id: divide, what: { de: Vielfache von 10 und 100 durch 10 und 100 teilen, en: dividing multiples of 10 and 100 by 10 and 100 } }
    - { id: decimals, what: { de: Zehntel und Hundertstel durch Teilen und Malnehmen, en: dividing into tenths and hundredths and multiplying them back } }
    - { id: digits-move, what: { de: "sagen, wie sich die Ziffern verschieben", en: saying how the digits move } }
  misconceptions:
    - id: add-a-zero
      what: Multiplies by 10 by writing a zero on the end, also for decimals (0.6 × 10 = 0.60)
      addressed: lesson 1 and lesson 2 Learn say the digits move; l2-f4 has feedback on 0.60, and l2-s3, l2-n5 and l2-c5 offer it again
    - id: wrong-direction
      what: Moves the digits the wrong way, so dividing makes the number bigger
      addressed: lesson 1 Learn shows division moving digits right; l1-f4 and l2-f1 have feedback, and l2-s5 and l2-c3 offer the bigger number
    - id: wrong-number-of-places
      what: Moves the digits one place for 100 or two places for 10
      addressed: l1-f2 has feedback on 580, and l1-s3, l2-f2, l2-n1, l2-n2 and l2-c2 offer the wrong number of places
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die Ziffern wandern, en: The digits move }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is the 4 in 3485 worth?"
            options: ["4", "40", "400"]
            answer: "400"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 0, 6] }
            options: ["0.06", "0.6", "6"]
            answer: "0.06"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "36 × 10 = 360"
            say: "When you multiply by ten, every digit moves one place to the left. The three tens become three hundreds, and the six ones become six tens. A zero holds the empty ones place."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 6, 0] }
          - text: "36 × 100 = 3600\n36 × 1000 = 36,000"
            say: "Multiply by a hundred and every digit moves two places to the left: three thousand six hundred. Multiply by a thousand and every digit moves three places: thirty-six thousand."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [3, 6, 0, 0] }
          - text: "4700 ÷ 100 = 47"
            say: "Dividing moves the digits the other way, to the right. Divide by ten: one place. Divide by a hundred: two places. Four thousand seven hundred divided by a hundred is forty-seven."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [4, 7] }
          - text: "The digits move. A zero only fills an empty place."
            say: "Some people say that multiplying by ten adds a zero. That trick breaks with decimals, so always think of the digits moving."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "24 × 10 = _"
                say: "Twenty-four times ten."
                answer: "240"
                hints:
                  - "Multiplying by 10 moves every digit one place left."
                  - "2 tens become 2 hundreds, 4 ones become 4 tens."
                  - "240."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "58 × 100 = _"
                say: "Fifty-eight times one hundred."
                options: ["5800", "580", "58,000"]
                answer: "5800"
                feedback:
                  "580": "That is 58 × 10. Multiplying by 100 moves the digits two places left."
                hints:
                  - "How many places do the digits move for 100?"
                  - "Two places left: 5 tens become 5 thousands, 8 ones become 8 hundreds."
                  - "5800."
              - id: l1-f3
                type: text_input
                text: "6 × 1000 = _"
                say: "Six times one thousand."
                answer: "6000"
                hints:
                  - "Multiplying by 1000 moves the digits three places left."
                  - "6 ones become 6 thousands."
                  - "6000."
              - id: l1-f4
                type: multiple_choice
                text: "3900 ÷ 10 = _"
                say: "Three thousand nine hundred divided by ten."
                options: ["390", "39", "39,000"]
                answer: "390"
                feedback:
                  "39,000": "Dividing makes a number smaller. The digits move right, not left."
                  "39": "That is 3900 ÷ 100. Dividing by 10 moves the digits one place."
                hints:
                  - "Dividing by 10 moves every digit one place right."
                  - "3 thousands become 3 hundreds, 9 hundreds become 9 tens."
                  - "390."
              - id: l1-f5
                type: fill_in_blank
                text: "Find the missing number."
                say: "What times one hundred is seven thousand two hundred?"
                frame: "_ × 100 = 7200"
                options: ["7", "72", "720"]
                answer: ["72"]
                hints:
                  - "Undo it: divide 7200 by 100."
                  - "The digits move two places right."
                  - "72 × 100 = 7200."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "407 × 10 = _"
                say: "Four hundred and seven times ten."
                answer: "4070"
                hints: ["Every digit moves one place left, the zero too."]
              - id: l1-s2
                type: multiple_choice
                text: "5000 ÷ 100 = _"
                say: "Five thousand divided by one hundred."
                options: ["50", "500", "5"]
                answer: "50"
                hints: ["Dividing by 100 moves the digits two places right."]
              - id: l1-s3
                type: fill_in_blank
                text: "Find the missing number."
                say: "Sixty-four times what is six thousand four hundred?"
                frame: "64 × _ = 6400"
                options: ["10", "100", "1000"]
                answer: ["100"]
                hints: ["How many places have the digits moved?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? 85 × 1000 = 85,000"
                say: "Is it true? Eighty-five times one thousand is eighty-five thousand."
                answer: true
                hints: ["Three places left."]
              - id: l1-s5
                type: text_input
                text: "A box holds 100 pencils. How many pencils are in 37 boxes?"
                answer: "3700"
                hints: ["37 × 100."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "93 × 100 = _"
                say: "Ninety-three times one hundred."
                answer: "9300"
              - id: l1-n2
                type: text_input
                text: "2600 ÷ 10 = _"
                say: "Two thousand six hundred divided by ten."
                answer: "260"
              - id: l1-n3
                type: fill_in_blank
                text: "Find the missing number."
                say: "What divided by one hundred is eight?"
                frame: "_ ÷ 100 = 8"
                options: ["80", "800", "8000"]
                answer: ["800"]
              - id: l1-n4
                type: multiple_choice
                text: "Which is the same as 4 × 1000?"
                say: "Which is the same as four times one thousand?"
                options: ["40 × 100", "4 × 100", "400 × 100"]
                answer: "40 × 100"
              - id: l1-n5
                type: text_input
                text: "A school buys 10 packs of paper. Each pack has 120 sheets. How many sheets is that?"
                answer: "1200"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "71 × 10 = _"
            say: "Seventy-one times ten."
            answer: "710"
          - id: l1-c2
            type: multiple_choice
            text: "8000 ÷ 100 = _"
            say: "Eight thousand divided by one hundred."
            options: ["80", "800", "8"]
            answer: "80"
          - id: l1-c3
            type: fill_in_blank
            text: "Find the missing number."
            say: "What times one thousand is three thousand?"
            frame: "_ × 1000 = 3000"
            options: ["3", "30", "300"]
            answer: ["3"]
          - id: l1-c4
            type: text_input
            text: "9 × 100 = _"
            say: "Nine times one hundred."
            answer: "900"
          - id: l1-c5
            type: multiple_choice
            text: "4500 ÷ 10 = _"
            say: "Four thousand five hundred divided by ten."
            options: ["450", "45", "45,000"]
            answer: "450"
          - id: l1-c6
            type: true_false
            text: "Is it true? 320 ÷ 10 = 3200"
            say: "Is it true? Three hundred and twenty divided by ten is three thousand two hundred."
            answer: false

  - n: 2
    title: { de: Zehntel und Hundertstel entstehen, en: Into tenths and hundredths }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "45 × 100 = _"
            say: "Forty-five times one hundred."
            answer: "4500"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "600 ÷ 10 = _"
            say: "Six hundred divided by ten."
            answer: "60"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "35 ÷ 10 = 3.5"
            say: "Divide thirty-five by ten. Every digit moves one place to the right. The three tens become three ones, and the five ones become five tenths. Thirty-five divided by ten is three point five."
            show: { drawn: place-value-chart, columns: [ones, tenths], values: [3, 5] }
          - text: "35 ÷ 100 = 0.35"
            say: "Divide by a hundred: two places to the right. Three tenths and five hundredths make zero point three five. A zero holds the ones place."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 3, 5] }
          - text: "7 ÷ 10 = 0.7\n7 ÷ 100 = 0.07"
            say: "Seven divided by ten is seven tenths. Seven divided by a hundred is seven hundredths."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 0, 7] }
          - text: "0.4 × 10 = 4"
            say: "Multiplying a decimal works the same way: the digits move left. Four tenths times ten is four ones. Writing a zero on the end gives zero point four zero, which is still four tenths. So the zero trick does not work here."
            show: { drawn: place-value-chart, columns: [ones, tenths], values: [4, 0] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "46 ÷ 10 = _"
                say: "Forty-six divided by ten."
                options: ["4.6", "0.46", "460"]
                answer: "4.6"
                feedback:
                  "460": "That is 46 × 10. Dividing makes the number smaller: the digits move right."
                hints:
                  - "Dividing by 10 moves every digit one place right."
                  - "4 tens become 4 ones, 6 ones become 6 tenths."
                  - "4.6."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "9 ÷ 100 = _"
                say: "Nine divided by one hundred."
                options: ["0.09", "0.9", "900"]
                answer: "0.09"
                hints:
                  - "Dividing by 100 moves the digit two places right."
                  - "9 ones become 9 tenths, then 9 hundredths."
                  - "0.09."
              - id: l2-f3
                type: fill_in_blank
                text: "Divide 28 by 100."
                say: "Twenty-eight divided by one hundred."
                frame: "28 ÷ 100 = _._ _"
                options: ["0", "2", "8"]
                answer: ["0", "2", "8"]
                hints:
                  - "Two places to the right."
                  - "2 tens become 2 tenths, 8 ones become 8 hundredths. No ones are left."
                  - "0.28."
              - id: l2-f4
                type: multiple_choice
                text: "0.6 × 10 = _"
                say: "Zero point six times ten."
                options: ["6", "0.60", "60"]
                answer: "6"
                feedback:
                  "0.60": "0.60 is still 6 tenths. Multiplying by 10 moves the 6 one place left, so 6 tenths become 6 ones."
                hints:
                  - "Multiplying by 10 moves the digit one place left."
                  - "6 tenths move into the ones place."
                  - "6."
              - id: l2-f5
                type: multiple_choice
                text: "Which calculation gives the number in the chart?"
                show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 7, 3] }
                options: ["73 ÷ 100", "73 ÷ 10", "73 × 10"]
                answer: "73 ÷ 100"
                hints:
                  - "The chart shows 0.73."
                  - "The 7 has moved from the tens to the tenths: two places right."
                  - "73 ÷ 100 = 0.73."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "53 ÷ 10 = _"
                say: "Fifty-three divided by ten."
                options: ["5.3", "0.53", "50.3"]
                answer: "5.3"
                hints: ["One place to the right."]
              - id: l2-s2
                type: fill_in_blank
                text: "Divide 4 by 10."
                say: "Four divided by ten."
                frame: "4 ÷ 10 = _._"
                options: ["0", "4", "40"]
                answer: ["0", "4"]
                hints: ["4 ones become 4 tenths."]
              - id: l2-s3
                type: multiple_choice
                text: "0.25 × 100 = _"
                say: "Zero point two five times one hundred."
                options: ["25", "2.5", "0.2500"]
                answer: "25"
                hints: ["Two places to the left: 2 tenths become 2 tens."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 60 ÷ 100 = 0.6"
                say: "Is it true? Sixty divided by one hundred is zero point six."
                answer: true
                hints: ["6 tens move two places right."]
              - id: l2-s5
                type: multiple_choice
                text: "10 stickers cost £3 in total. How much does one sticker cost?"
                options: ["£0.30", "£0.03", "£30"]
                answer: "£0.30"
                hints: ["£3 ÷ 10: the 3 moves one place right."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "81 ÷ 100 = _"
                say: "Eighty-one divided by one hundred."
                options: ["0.81", "8.1", "0.081"]
                answer: "0.81"
              - id: l2-n2
                type: multiple_choice
                text: "5 ÷ 100 = _"
                say: "Five divided by one hundred."
                options: ["0.05", "0.5", "0.005"]
                answer: "0.05"
              - id: l2-n3
                type: fill_in_blank
                text: "Find the missing number."
                say: "What divided by ten is one point seven?"
                frame: "_ ÷ 10 = 1.7"
                options: ["0.17", "17", "170"]
                answer: ["17"]
              - id: l2-n4
                type: multiple_choice
                text: "0.08 × 100 = _"
                say: "Zero point zero eight times one hundred."
                options: ["8", "0.8", "80"]
                answer: "8"
              - id: l2-n5
                type: true_false
                text: "Is it true? 3.9 × 10 = 3.90"
                say: "Is it true? Three point nine times ten is three point nine zero."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: mult-whole
            type: text_input
            text: "52 × 100 = _"
            say: "Fifty-two times one hundred."
            answer: "5200"
          - id: l2-c2
            part: divide
            type: multiple_choice
            text: "6700 ÷ 10 = _"
            say: "Six thousand seven hundred divided by ten."
            options: ["670", "67", "6.7"]
            answer: "670"
          - id: l2-c3
            part: decimals
            type: multiple_choice
            text: "62 ÷ 10 = _"
            say: "Sixty-two divided by ten."
            options: ["6.2", "0.62", "620"]
            answer: "6.2"
          - id: l2-c4
            part: decimals
            type: fill_in_blank
            text: "Divide 3 by 100."
            say: "Three divided by one hundred."
            frame: "3 ÷ 100 = _._ _"
            options: ["0", "3", "30"]
            answer: ["0", "0", "3"]
          - id: l2-c5
            part: decimals
            type: multiple_choice
            text: "0.7 × 10 = _"
            say: "Zero point seven times ten."
            options: ["7", "0.70", "70"]
            answer: "7"
          - id: l2-c6
            part: mult-whole
            type: text_input
            text: "309 × 10 = _"
            say: "Three hundred and nine times ten."
            answer: "3090"
          - id: l2-c7
            part: mult-whole
            type: multiple_choice
            text: "15 × 1000 = _"
            say: "Fifteen times one thousand."
            options: ["15,000", "1500", "150,000"]
            answer: "15,000"
          - id: l2-c8
            part: mult-whole
            type: fill_in_blank
            text: "Find the missing number."
            say: "What times ten is nine hundred and thirty?"
            frame: "_ × 10 = 930"
            options: ["9.3", "93", "9300"]
            answer: ["93"]
          - id: l2-c9
            part: mult-whole
            type: text_input
            text: "A pack has 10 crayons. How many crayons are in 85 packs?"
            answer: "850"
          - id: l2-c10
            part: divide
            type: text_input
            text: "4300 ÷ 100 = _"
            say: "Four thousand three hundred divided by one hundred."
            answer: "43"
          - id: l2-c11
            part: divide
            type: multiple_choice
            text: "750 ÷ 10 = _"
            say: "Seven hundred and fifty divided by ten."
            options: ["75", "7.5", "7500"]
            answer: "75"
          - id: l2-c12
            part: divide
            type: fill_in_blank
            text: "Find the missing number."
            say: "What divided by ten is fifty-two?"
            frame: "_ ÷ 10 = 52"
            options: ["5.2", "520", "5200"]
            answer: ["520"]
          - id: l2-c13
            part: divide
            type: multiple_choice
            text: "A baker puts 1200 rolls into 100 bags, the same number in each. How many rolls go in each bag?"
            options: ["12", "120", "1.2"]
            answer: "12"
          - id: l2-c14
            part: decimals
            type: text_input
            text: "8 ÷ 10 = _"
            say: "Eight divided by ten."
            keyboard: decimal
            answer: "0.8"
          - id: l2-c15
            part: decimals
            type: multiple_choice
            text: "Which calculation makes 14?"
            options: ["0.14 × 100", "0.14 × 10", "1.4 × 100"]
            answer: "0.14 × 100"
          - id: l2-c16
            part: digits-move
            type: multiple_choice
            text: "When you multiply by 100, how do the digits move?"
            options: ["two places to the left", "two places to the right", "one place to the left"]
            answer: "two places to the left"
          - id: l2-c17
            part: digits-move
            type: multiple_choice
            text: "When you divide by 10, how do the digits move?"
            options: ["one place to the right", "one place to the left", "two places to the right"]
            answer: "one place to the right"
          - id: l2-c18
            part: digits-move
            type: true_false
            text: "Is it true? 27 × 10 = 270, because the digits move one place to the left."
            say: "Is it true? Twenty-seven times ten is two hundred and seventy, because the digits move one place to the left."
            answer: true
          - id: l2-c19
            part: digits-move
            type: multiple_choice
            text: "Which calculation turns 54 into the number in the chart?"
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [5, 4, 0, 0] }
            options: ["54 × 100", "54 × 10", "54 ÷ 100"]
            answer: "54 × 100"
          - id: l2-c20
            part: digits-move
            type: multiple_choice
            text: "Ella says 0.3 × 10 = 0.30, because you add a zero. Which is right?"
            say: "Ella says zero point three times ten is zero point three zero, because you add a zero. Which is right?"
            options: ["0.3 × 10 = 3. The digit moves one place left.", "0.3 × 10 = 0.30. You add a zero.", "0.3 × 10 = 30. The digit moves two places left."]
            answer: "0.3 × 10 = 3. The digit moves one place left."
