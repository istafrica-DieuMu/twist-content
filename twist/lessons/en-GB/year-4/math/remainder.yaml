# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.remainder
skill: math.mult-div.remainder
curriculum: en-GB
language: en
title:
  de: Teilen mit Rest
  en: Division with remainders
summary: >
  Divisions that do not come out exactly. Lesson 1 finds how many groups
  fit and what is left over (17 ÷ 5 = 3 r 2), checks with 3 × 5 + 2 = 17
  and learns that the remainder is always smaller than the number you
  divide by; lesson 2 decides what the remainder means in a story (one
  more boat for the children left over, or money that is not enough for
  one more), and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Geteiltaufgaben, en: Division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-facts]
  also_practises: [math.mult-div.div-facts, math.mult-div.all-tables]
  vocabulary: { en: [remainder, r, left over, divide, divided by, group, check] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: [operation-signs, currency]
  parts:
    - { id: calc, what: { de: Geteiltaufgaben mit Rest rechnen und prüfen, en: working out and checking divisions with a remainder } }
    - { id: remainder, what: { de: "den Rest finden, kleiner als die Zahl, durch die man teilt", en: "finding the remainder, smaller than the number you divide by" } }
    - { id: story, what: { de: den Rest in einer Sachaufgabe deuten, en: saying what the remainder means in a story } }
  misconceptions:
    - id: remainder-too-big
      what: Leaves a remainder as big as or bigger than the number divided by (23 ÷ 5 = 3 r 8)
      addressed: lesson 1 Learn says the remainder is always smaller than the number you divide by; l1-f3 has 7 r 5 with feedback, l1-s2 offers 3 r 11, l1-s3 asks whether 23 ÷ 5 is 3 r 8, l1-n3 offers 3 r 15, l2-c3 asks whether 26 ÷ 4 is 5 r 6
    - id: ignore-the-remainder
      what: Drops the remainder when the story needs one more (14 children, 4 to a boat, gives 3 boats)
      addressed: lesson 2 Learn shows a boat story and a money story; l2-f1, l2-s1 and l2-n1 ask how many are needed with the rounded-down answer as an option, with feedback in l2-f1; l2-f4 and l2-n4 ask whether the rounded-down number is enough
    - id: round-up-always
      what: Adds one more when the story does not need it (£17, £5 a ball, gives 4 balls)
      addressed: l2-f2, l2-s2 and l2-n2 are money stories with the rounded-up answer as an option, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was übrig bleibt", en: "What is left over" }
    goal:
      de: "Teile und sag, was übrig bleibt, so wie 17 geteilt durch 5 ist 3 Rest 2."
      en: "Divide and say what is left over, like 17 divided by 5 is 3 remainder 2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "15 ÷ 5 = _"
            say: "Fifteen divided by five."
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "4 × 6 = _"
            say: "Four times six."
            answer: "24"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "17 sweets, 5 friends. Can everyone get the same number? What happens to the rest?"
            say: "Seventeen sweets are shared fairly between five friends. Can everyone get the same number? What do you think happens to the sweets that are left? Have a guess."
          - text: "17 ÷ 5 = 3 r 2"
            say: "Seventeen dots, in rows of five. Three whole rows fit, and two dots are left over. We write seventeen divided by five is three remainder two, with a small r for remainder."
            show: { drawn: dots, count: 17, layout: five-structure }
          - text: "3 × 5 + 2 = 17"
            say: "Check it. Three fives are fifteen, and the two left over make seventeen again."
          - text: "17 ÷ 5: not 2 r 7"
            say: "The remainder is always smaller than the number you divide by. If seven are left over, another group of five still fits. So the answer is three remainder two, not two remainder seven."
          - text: "Did you know? Some cicadas in North America live underground for 17 years. Share 17 into groups of 2, 3, 4 or 5: there is always a remainder!"
            say: "Did you know? Some cicadas, buzzing insects in North America, live underground for seventeen years before they climb out. Try sharing seventeen into equal groups of two, three, four or five. There is always a remainder!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "13 dots in fives. How many fives, how many left over?"
                say: "Thirteen dots in rows of five. How many fives, and how many are left over?"
                show: { drawn: dots, count: 13, layout: five-structure }
                frame: "13 ÷ 5 = _ r _"
                options: ["2", "3", "4"]
                answer: ["2", "3"]
                hints:
                  - "Count the full rows of five."
                  - "Two rows of five make 10. How many more to 13?"
                  - "2 r 3."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "20 ÷ 7 = _"
                say: "Twenty divided by seven."
                options: ["2 r 6", "3 r 1", "2 r 4"]
                answer: "2 r 6"
                hints:
                  - "Which seven-fact is just under 20?"
                  - "2 × 7 = 14, and 3 × 7 = 21 is too much."
                  - "20 − 14 = 6, so 2 r 6."
              - id: l1-f3
                type: multiple_choice
                text: "26 ÷ 3 = _"
                say: "Twenty-six divided by three."
                options: ["8 r 2", "7 r 5", "9 r 1"]
                answer: "8 r 2"
                feedback:
                  "7 r 5": "The remainder must be smaller than 3. Five left over is room for one more three."
                  "9 r 1": "9 × 3 = 27, and that is more than 26."
                hints:
                  - "Which three-fact is just under 26?"
                  - "8 × 3 = 24."
                  - "26 − 24 = 2, so 8 r 2."
              - id: l1-f4
                type: fill_in_blank
                text: "Check 22 ÷ 4 = 5 r 2."
                say: "Twenty-two divided by four is five remainder two. Check it."
                frame: "5 × 4 + _ = _"
                options: ["2", "4", "20", "22"]
                answer: ["2", "22"]
                hints:
                  - "Multiply, then add what is left over."
                  - "5 × 4 = 20. Add the remainder."
                  - "20 + 2 = 22."
              - id: l1-f5
                type: true_false
                text: "Is it true? 30 ÷ 6 has no remainder."
                say: "Thirty divided by six has no remainder. Is it true?"
                answer: true
                hints:
                  - "Is 30 in the 6 times table?"
                  - "5 × 6 = 30."
                  - "Yes. 30 ÷ 6 = 5, nothing is left over."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "19 ÷ 4 = _ r _"
                say: "Nineteen divided by four."
                frame: "19 ÷ 4 = _ r _"
                options: ["3", "4", "5"]
                answer: ["4", "3"]
                hints: ["4 × 4 = 16. How many more to 19?"]
              - id: l1-s2
                type: multiple_choice
                text: "35 ÷ 8 = _"
                say: "Thirty-five divided by eight."
                options: ["4 r 3", "3 r 11", "5 r 5"]
                answer: "4 r 3"
                hints: ["4 × 8 = 32."]
              - id: l1-s3
                type: true_false
                text: "Is it true? 23 ÷ 5 = 3 r 8"
                say: "Twenty-three divided by five is three remainder eight. Is it true?"
                answer: false
                hints: ["Can the remainder be bigger than 5?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Check 31 ÷ 7 = 4 r 3."
                say: "Thirty-one divided by seven is four remainder three. Check it."
                frame: "4 × 7 + _ = _"
                options: ["3", "7", "28", "31"]
                answer: ["3", "31"]
                hints: ["4 × 7 = 28. Add the remainder."]
              - id: l1-s5
                type: text_input
                text: "What is the remainder? 29 ÷ 9"
                say: "Twenty-nine divided by nine. What is the remainder?"
                answer: "2"
                hints: ["3 × 9 = 27."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "38 ÷ 6 = _ r _"
                say: "Thirty-eight divided by six."
                frame: "38 ÷ 6 = _ r _"
                options: ["2", "5", "6", "8"]
                answer: ["6", "2"]
              - id: l1-n2
                type: multiple_choice
                text: "50 ÷ 9 = _"
                say: "Fifty divided by nine."
                options: ["5 r 5", "4 r 14", "6 r 4"]
                answer: "5 r 5"
              - id: l1-n3
                type: multiple_choice
                text: "39 ÷ 8 = _"
                say: "Thirty-nine divided by eight."
                options: ["4 r 7", "3 r 15", "5 r 1"]
                answer: "4 r 7"
              - id: l1-n4
                type: text_input
                text: "What is the remainder? 45 ÷ 7"
                say: "Forty-five divided by seven. What is the remainder?"
                answer: "3"
              - id: l1-n5
                type: true_false
                text: "Is it true? 27 ÷ 4 = 6 r 3"
                say: "Twenty-seven divided by four is six remainder three. Is it true?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "17 ÷ 3 = _ r _"
            say: "Seventeen divided by three."
            frame: "17 ÷ 3 = _ r _"
            options: ["2", "4", "5"]
            answer: ["5", "2"]
          - id: l1-c2
            type: text_input
            text: "What is the remainder? 43 ÷ 6"
            say: "Forty-three divided by six. What is the remainder?"
            answer: "1"
          - id: l1-c3
            type: multiple_choice
            text: "25 ÷ 4 = _"
            say: "Twenty-five divided by four."
            options: ["6 r 1", "5 r 5", "7 r 3"]
            answer: "6 r 1"
          - id: l1-c4
            type: true_false
            text: "Is it true? 7 × 5 + 4 = 39, so 39 ÷ 5 = 7 r 4"
            say: "Seven times five, add four, is thirty-nine. So thirty-nine divided by five is seven remainder four. Is it true?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "48 ÷ 7 = _"
            say: "Forty-eight divided by seven."
            options: ["6 r 6", "5 r 13", "7 r 1"]
            answer: "6 r 6"
          - id: l1-c6
            type: text_input
            text: "What is the remainder? 22 ÷ 3"
            say: "Twenty-two divided by three. What is the remainder?"
            answer: "1"

  - n: 2
    title: { de: "Was bedeutet der Rest?", en: "What does the remainder mean?" }
    goal:
      de: "Entscheide, was der Rest in einer Geschichte bedeutet. 14 Kinder mit 4 in jedem Boot brauchen 4 Boote."
      en: "Decide what the remainder means in a story. 14 children with 4 in each boat need 4 boats."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "14 ÷ 4 = _ r _"
            say: "Fourteen divided by four."
            frame: "14 ÷ 4 = _ r _"
            options: ["2", "3", "4"]
            answer: ["3", "2"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? 21 ÷ 5 = 4 r 1"
            say: "Twenty-one divided by five is four remainder one. Is it true?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "14 children go rowing. 4 fit in each boat. How many boats do you think they need?"
            say: "Fourteen children go rowing, and four fit in each boat. How many boats do you think they need? Have a guess."
          - text: "14 children, 4 in each boat. 14 ÷ 4 = 3 r 2"
            say: "Fourteen children go rowing. Four fit in each boat. Fourteen divided by four is three remainder two. Three boats are full, but two children are still on the shore. They need a boat too, so the class needs four boats."
          - text: "£17, a ball costs £5. 17 ÷ 5 = 3 r 2"
            say: "Jack has seventeen pounds. A ball costs five pounds. Seventeen divided by five is three remainder two. He can buy three balls. The two pounds left over are not enough for another ball."
          - text: "23 cakes, boxes of 6. 23 ÷ 6 = 3 r 5"
            say: "Sometimes the question asks about the remainder itself. Twenty-three cakes go into boxes of six. Three boxes are full, and five cakes are left over for the baker to eat."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "22 children go on a trip. 5 fit in each car. How many cars are needed?"
                options: ["4", "5", "2"]
                answer: "5"
                feedback:
                  "4": "Four cars carry 20 children. The 2 left over need a car too."
                  "2": "2 is the remainder: the children left over after four full cars."
                hints:
                  - "Work out 22 ÷ 5."
                  - "22 ÷ 5 = 4 r 2. Four cars are full."
                  - "The 2 children left over need one more car: 5 cars."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Isla has £20. A book costs £6. How many books can she buy?"
                options: ["3", "4", "2"]
                answer: "3"
                feedback:
                  "4": "Four books cost £24. Isla only has £20."
                hints:
                  - "Work out 20 ÷ 6."
                  - "20 ÷ 6 = 3 r 2."
                  - "£2 is not enough for another book: 3 books."
              - id: l2-f3
                type: text_input
                text: "30 sweets are shared equally between 4 children. How many sweets are left over?"
                answer: "2"
                hints:
                  - "Work out 30 ÷ 4."
                  - "7 × 4 = 28."
                  - "30 − 28 = 2 sweets left over."
              - id: l2-f4
                type: true_false
                text: "Is it true? 26 eggs go in boxes of 6, so 4 boxes are enough."
                answer: false
                hints:
                  - "How many eggs fit in 4 boxes?"
                  - "4 × 6 = 24, so 2 eggs are left over."
                  - "No. 5 boxes are needed."
              - id: l2-f5
                type: text_input
                text: "A ribbon is 40 cm long. Mia cuts pieces of 7 cm. How many whole pieces does she get?"
                answer: "5"
                hints:
                  - "Work out 40 ÷ 7."
                  - "5 × 7 = 35, and 6 × 7 = 42 is too long."
                  - "5 whole pieces, with 5 cm left over."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "31 people wait for a lift. It takes 8 at a time. How many trips does the lift make?"
                options: ["3", "4", "7"]
                answer: "4"
                hints: ["31 ÷ 8 = 3 r 7. The 7 left over need a trip too."]
              - id: l2-s2
                type: multiple_choice
                text: "Sam has £25. A model car costs £4. How many can he buy?"
                options: ["6", "7", "1"]
                answer: "6"
                hints: ["25 ÷ 4 = 6 r 1. Is £1 enough for another?"]
              - id: l2-s3
                type: text_input
                text: "There are 45 pencils and 7 tables. Each table gets the same number. How many pencils are left over?"
                answer: "3"
                hints: ["6 × 7 = 42."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 33 books fit on shelves of 5, so 7 shelves are needed."
                answer: true
                hints: ["33 ÷ 5 = 6 r 3."]
              - id: l2-s5
                type: text_input
                text: "A gardener plants 50 bulbs in rows of 9. How many full rows does he plant?"
                answer: "5"
                hints: ["5 × 9 = 45, and 6 × 9 is too many."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "29 players go to a match. Each minibus holds 9. How many minibuses are needed?"
                options: ["3", "4", "2"]
                answer: "4"
              - id: l2-n2
                type: multiple_choice
                text: "Grace has £38. A cinema ticket costs £9. How many tickets can she buy?"
                options: ["4", "5", "2"]
                answer: "4"
              - id: l2-n3
                type: text_input
                text: "52 stickers are shared equally between 8 friends. How many are left over?"
                answer: "4"
              - id: l2-n4
                type: true_false
                text: "Is it true? 44 cupcakes go in boxes of 6, so 7 boxes are enough."
                answer: false
              - id: l2-n5
                type: text_input
                text: "A plank is 60 cm long. Noah saws pieces of 8 cm. How many whole pieces does he get?"
                answer: "7"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: calc
            type: fill_in_blank
            text: "34 ÷ 5 = _ r _"
            say: "Thirty-four divided by five."
            frame: "34 ÷ 5 = _ r _"
            options: ["4", "5", "6"]
            answer: ["6", "4"]
          - id: l2-c2
            part: remainder
            type: text_input
            text: "What is the remainder? 58 ÷ 9"
            say: "Fifty-eight divided by nine. What is the remainder?"
            answer: "4"
          - id: l2-c3
            part: remainder
            type: true_false
            text: "Is it true? 26 ÷ 4 = 5 r 6"
            say: "Twenty-six divided by four is five remainder six. Is it true?"
            answer: false
          - id: l2-c4
            part: story
            type: multiple_choice
            text: "38 children go camping. Each tent sleeps 6. How many tents are needed?"
            options: ["6", "7", "2"]
            answer: "7"
          - id: l2-c5
            part: story
            type: multiple_choice
            text: "Ella has £30. A game costs £7. How many games can she buy?"
            options: ["4", "5", "2"]
            answer: "4"
          - id: l2-c6
            part: calc
            type: fill_in_blank
            text: "47 ÷ 6 = _ r _"
            say: "Forty-seven divided by six."
            frame: "47 ÷ 6 = _ r _"
            options: ["5", "7", "8"]
            answer: ["7", "5"]
          - id: l2-c7
            part: calc
            type: multiple_choice
            text: "33 ÷ 4 = _"
            say: "Thirty-three divided by four."
            options: ["8 r 1", "7 r 5", "9 r 3"]
            answer: "8 r 1"
          - id: l2-c8
            part: calc
            type: multiple_choice
            text: "Which calculation checks 44 ÷ 7 = 6 r 2?"
            say: "Forty-four divided by seven is six remainder two. Which calculation checks it?"
            options: ["6 × 7 + 2", "6 × 2 + 7", "7 × 2 + 6"]
            answer: "6 × 7 + 2"
          - id: l2-c11
            part: calc
            type: fill_in_blank
            text: "62 ÷ 9 = _ r _"
            say: "Sixty-two divided by nine."
            frame: "62 ÷ 9 = _ r _"
            options: ["6", "7", "8"]
            answer: ["6", "8"]
          - id: l2-c9
            part: calc
            type: multiple_choice
            text: "Which division has the answer 4 r 3?"
            say: "Which division has the answer four remainder three?"
            options: ["27 ÷ 6", "24 ÷ 6", "30 ÷ 6"]
            answer: "27 ÷ 6"
          - id: l2-c10
            part: remainder
            type: multiple_choice
            text: "Max divides a number by 6. Which remainder can he not get?"
            say: "Max divides a number by six. Which remainder can he not get?"
            options: ["5", "2", "6"]
            answer: "6"
          - id: l2-c12
            part: calc
            type: multiple_choice
            text: "71 ÷ 8 = _"
            say: "Seventy-one divided by eight."
            options: ["8 r 7", "8 r 1", "7 r 7"]
            answer: "8 r 7"
          - id: l2-c13
            part: remainder
            type: text_input
            text: "What is the remainder? 37 ÷ 10"
            say: "Thirty-seven divided by ten. What is the remainder?"
            answer: "7"
          - id: l2-c14
            part: remainder
            type: text_input
            text: "What is the remainder? 65 ÷ 8"
            say: "Sixty-five divided by eight. What is the remainder?"
            answer: "1"
          - id: l2-c15
            part: remainder
            type: true_false
            text: "Is it true? 41 ÷ 6 = 6 r 5"
            say: "Forty-one divided by six is six remainder five. Is it true?"
            answer: true
          - id: l2-c16
            part: remainder
            type: multiple_choice
            text: "Which division has no remainder?"
            options: ["36 ÷ 9", "38 ÷ 9", "40 ÷ 9"]
            answer: "36 ÷ 9"
          - id: l2-c17
            part: story
            type: multiple_choice
            text: "A baker has 50 rolls. A bag holds 6 rolls. How many bags can he fill?"
            options: ["8", "9", "2"]
            answer: "8"
          - id: l2-c18
            part: story
            type: text_input
            text: "27 children sit at tables of 4. Every child needs a seat. How many tables are needed?"
            answer: "7"
          - id: l2-c19
            part: story
            type: true_false
            text: "Is it true? Leo has 40p. A sweet costs 6p. He can buy 7 sweets."
            say: "Is it true? Leo has forty pence. A sweet costs six pence. He can buy seven sweets."
            answer: false
          - id: l2-c20
            part: story
            type: text_input
            text: "Ruby puts 34 photos in an album, 4 on each page, until the photos run out. How many photos are on the last page?"
            answer: "2"
