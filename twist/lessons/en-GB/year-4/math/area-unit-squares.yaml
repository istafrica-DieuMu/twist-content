# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.area-unit-squares
skill: math.area-volume.area-unit-squares
curriculum: en-GB
language: en
title:
  de: Flächeninhalt in Kästchen
  en: Area in squares
summary: >
  Lesson 1 finds the area of rectilinear shapes on squared paper by
  counting the squares they cover, splits L, T and U shapes into parts and
  adds them, and counts two half squares as one whole. Lesson 2 finds the
  area of a rectangle with a multiplication (rows times squares in a row,
  from a filled rectangle or an outline), sees that different rectangles
  can have the same area, splits shapes into two rectangles, and ends with
  the skill check. Drawing a shape on the grid waits for a drawing task.
metadata:
  year: year-4
  topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.area-volume.compare-area, math.mult-div.arrays]
  also_practises: [math.mult-div.arrays]
  vocabulary: { en: [area, square, squared paper, half square, rectangle, rows, length, width, split, multiply] }
  forms: [text, audio, drawn]
  drawn: [grid, dots]
  facets: []
  misconceptions:
    - id: area-perimeter
      what: Counts the length round the edge (the perimeter) instead of the squares inside
      addressed: lesson 1 Learn says area counts the squares a shape covers; l1-f1 and l2-f1 have feedback, l1-c1, l2-s2 and l2-c4 offer the perimeter
    - id: halves-as-wholes
      what: Counts each half square as a whole square
      addressed: lesson 1 Learn puts two halves together into one whole; l1-f3 has feedback, l1-s3, l1-n3, l1-c3 and l2-c2 count halves
    - id: add-sides
      what: Adds the length and the width of a rectangle instead of multiplying
      addressed: lesson 2 Learn shows rows of squares as a multiplication; l2-f1 has feedback on 3 + 5, l2-f3 offers 3 + 4, l2-s2 and l2-c4 offer the sum
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Kästchen zählen und zerlegen, en: Counting and splitting squares }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which shape covers more squares?"
            show: { drawn: grid, cols: 8, rows: 3, cells: [[0, 0, red], [1, 0, red], [0, 1, red], [1, 1, red], [4, 0, blue], [5, 0, blue], [6, 0, blue], [4, 1, blue], [5, 1, blue]], labels: [[0, 2, "A"], [4, 2, "B"]] }
            options: ["A", "B", "They are the same."]
            answer: "B"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which multiplication matches the dots?"
            show: { drawn: dots, array: [3, 4] }
            options: ["3 × 4", "3 + 4", "4 + 4"]
            answer: "3 × 4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Area: the number of squares a shape covers. This shape: 6 squares."
            say: "The area of a shape is how much space it covers. On squared paper we count the squares inside it. This shape covers six squares, so its area is six squares."
            show: { drawn: grid, cols: 6, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue]] }
          - text: "Split it: 3 + 2 = 5 squares"
            say: "This L shape is easier to count in two parts. The blue part has three squares. The red part has two. Three plus two is five, so the area is five squares."
            show: { drawn: grid, cols: 6, rows: 4, cells: [[1, 0, blue], [1, 1, blue], [1, 2, blue], [2, 2, red], [3, 2, red]] }
          - text: "Two half squares make one whole: 2 + 1 = 3 squares"
            say: "Some shapes cover half squares. Two half squares together make one whole square. This shape has two whole squares and two halves. Two plus one is three squares."
            show: { drawn: grid, cols: 5, rows: 3, cells: [[1, 1, green], [2, 1, green]], halves: [[0, 1, br, green], [3, 1, bl, green]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 6, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue]] }
                options: ["8", "6", "12"]
                answer: "8"
                feedback:
                  "12": "12 is the length all the way round the edge. The area counts the squares inside."
                hints:
                  - "Count the squares inside the shape."
                  - "There are 2 rows of 4 squares."
                  - "4 + 4 = 8 squares."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 6, rows: 4, cells: [[1, 0, green], [1, 1, green], [1, 2, green], [2, 2, green], [3, 2, green], [4, 2, green]] }
                options: ["6", "5", "7"]
                answer: "6"
                hints:
                  - "Split the L into the tall part and the bottom part."
                  - "The tall part has 3 squares. The bottom row has 3 more to its right."
                  - "3 + 3 = 6 squares."
              - id: l1-f3
                type: multiple_choice
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 6, rows: 3, cells: [[1, 1, orange], [2, 1, orange], [3, 1, orange]], halves: [[0, 1, br, orange], [4, 1, bl, orange]] }
                options: ["4", "5", "3"]
                answer: "4"
                feedback:
                  "5": "Each triangle is only half a square. Two halves make one whole."
                hints:
                  - "Count the whole squares first, then the halves."
                  - "3 whole squares and 2 half squares."
                  - "2 halves make 1 whole, so 3 + 1 = 4 squares."
              - id: l1-f4
                type: true_false
                text: "Both shapes have an area of 6 squares."
                say: "Is it true? Both shapes have an area of six squares."
                show: { drawn: grid, cols: 9, rows: 3, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [5, 0, blue], [5, 1, blue], [5, 2, blue], [6, 2, blue], [7, 2, blue], [8, 2, blue]] }
                answer: true
                hints:
                  - "Count the red squares, then the blue squares."
                  - "Red: 2 rows of 3. Blue: 3 up and 3 along the bottom."
                  - "Yes. Both are 6 squares, even though they look different."
              - id: l1-f5
                type: fill_in_blank
                text: "Split the T shape: the red top and the blue stem."
                show: { drawn: grid, cols: 5, rows: 3, cells: [[1, 0, red], [2, 0, red], [3, 0, red], [2, 1, blue], [2, 2, blue]] }
                frame: "3 + _ = _"
                options: ["1", "2", "5", "6"]
                answer: ["2", "5"]
                hints:
                  - "The red top has 3 squares. Count the blue squares."
                  - "The blue stem has 2 squares."
                  - "3 + 2 = 5."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 7, rows: 3, cells: [[1, 0, purple], [2, 0, purple], [3, 0, purple], [4, 0, purple], [5, 0, purple], [1, 1, purple], [2, 1, purple], [3, 1, purple], [4, 1, purple], [5, 1, purple]] }
                options: ["10", "7", "14"]
                answer: "10"
                hints: ["2 rows of 5 squares."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [2, 0, blue]] }
                options: ["5", "6", "4"]
                answer: "5"
                hints: ["The gap at the top is not part of the shape."]
              - id: l1-s3
                type: multiple_choice
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 5, rows: 4, cells: [[1, 1, green], [2, 1, green], [1, 2, green], [2, 2, green]], halves: [[3, 1, bl, green], [3, 2, tl, green]] }
                options: ["5", "6", "4"]
                answer: "5"
                hints: ["4 whole squares. The two halves make one more."]
              - id: l1-s4
                type: multiple_choice
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 3, rows: 3, cells: [[1, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [1, 2, red]] }
                options: ["5", "9", "4"]
                answer: "5"
                hints: ["Count only the coloured squares, not the whole grid."]
              - id: l1-s5
                type: true_false
                text: "This shape has an area of 7 squares."
                say: "Is it true? This shape has an area of seven squares."
                show: { drawn: grid, cols: 5, rows: 3, cells: [[0, 0, orange], [0, 1, orange], [0, 2, orange], [1, 2, orange], [2, 2, orange], [3, 2, orange]] }
                answer: false
                hints: ["Split it into the tall part and the bottom row, then add."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 5, rows: 3, cells: [[1, 0, blue], [2, 0, blue], [3, 0, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue]] }
                answer: "9"
              - id: l1-n2
                type: text_input
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 5, rows: 3, cells: [[0, 0, purple], [1, 0, purple], [0, 1, purple], [1, 1, purple], [0, 2, purple], [1, 2, purple], [2, 2, purple], [3, 2, purple]] }
                answer: "8"
              - id: l1-n3
                type: multiple_choice
                text: "What is the area of this triangle in squares?"
                show: { drawn: grid, cols: 3, rows: 2, cells: [[0, 1, red]], halves: [[0, 0, bl, red], [1, 1, bl, red]] }
                options: ["2", "3", "4"]
                answer: "2"
              - id: l1-n4
                type: multiple_choice
                text: "Which shape has the bigger area?"
                show: { drawn: grid, cols: 10, rows: 3, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red], [5, 0, blue], [5, 1, blue], [5, 2, blue], [6, 2, blue], [7, 2, blue], [8, 2, blue], [9, 2, blue]], labels: [[0, 2, "A"], [7, 0, "B"]] }
                options: ["A", "B", "They are the same."]
                answer: "A"
              - id: l1-n5
                type: text_input
                text: "Mia covers a shape with sticky notes, one on each square. The top part takes 5 notes and the bottom part takes 4. What is the area of the shape in squares?"
                answer: "9"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is the area of this shape in squares?"
            show: { drawn: grid, cols: 8, rows: 2, cells: [[1, 0, green], [2, 0, green], [3, 0, green], [4, 0, green], [5, 0, green], [6, 0, green], [1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [5, 1, green], [6, 1, green]] }
            options: ["12", "8", "16"]
            answer: "12"
          - id: l1-c2
            type: multiple_choice
            text: "What is the area of this shape in squares?"
            show: { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [1, 1, blue], [2, 1, blue]] }
            options: ["4", "6", "3"]
            answer: "4"
          - id: l1-c3
            type: multiple_choice
            text: "What is the area of this shape in squares?"
            show: { drawn: grid, cols: 2, rows: 2, cells: [[1, 0, orange], [1, 1, orange]], halves: [[0, 0, br, orange], [0, 1, tr, orange]] }
            options: ["3", "4", "2"]
            answer: "3"

  - n: 2
    title: { de: Rechtecke mit Malaufgaben, en: Rectangles by multiplying }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is the area of this shape in squares?"
            show: { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [0, 1, red], [1, 1, red], [2, 1, red]] }
            options: ["6", "5", "10"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many half squares make one whole square?"
            options: ["2", "1", "4"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 rows of 4 squares: 3 × 4 = 12 squares"
            say: "A rectangle is made of rows. Here there are three rows with four squares in each. You do not need to count them one by one. Three times four is twelve, so the area is twelve squares."
            show: { drawn: grid, cols: 6, rows: 3, cells: [[1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue]] }
          - text: "5 squares long, 2 squares wide: 2 × 5 = 10 squares"
            say: "This rectangle is only an outline. Count along one side: five squares long. Count up the other: two squares wide. That makes two rows of five. Two times five is ten squares."
            show: { drawn: grid, cols: 7, rows: 4, lines: [[1, 1, 6, 1], [6, 1, 6, 3], [6, 3, 1, 3], [1, 3, 1, 1]] }
          - text: "2 × 6 = 12 and 3 × 4 = 12: the same area"
            say: "These two rectangles look different. The red one is two rows of six. The blue one is three rows of four. Both cover twelve squares, so they have the same area."
            show: { drawn: grid, cols: 6, rows: 6, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [4, 0, red], [5, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red], [4, 1, red], [5, 1, red], [0, 3, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue], [0, 4, blue], [1, 4, blue], [2, 4, blue], [3, 4, blue], [0, 5, blue], [1, 5, blue], [2, 5, blue], [3, 5, blue]] }
          - text: "2 × 3 = 6, 3 × 1 = 3, 6 + 3 = 9 squares"
            say: "Split this shape into two rectangles. The red one is two squares wide and three tall: six squares. The blue one is one row of three: three squares. Six plus three is nine squares."
            show: { drawn: grid, cols: 5, rows: 3, cells: [[0, 0, red], [1, 0, red], [0, 1, red], [1, 1, red], [0, 2, red], [1, 2, red], [2, 2, blue], [3, 2, blue], [4, 2, blue]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "3 rows of 5 squares. What is the area?"
                show: { drawn: grid, cols: 5, rows: 3, cells: [[0, 0, green], [1, 0, green], [2, 0, green], [3, 0, green], [4, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [0, 2, green], [1, 2, green], [2, 2, green], [3, 2, green], [4, 2, green]] }
                options: ["15", "8", "16"]
                answer: "15"
                feedback:
                  "8": "3 + 5 adds the sides. The area is 3 rows of 5 squares: 3 × 5."
                  "16": "16 is the length round the edge. The area counts the squares inside."
                hints:
                  - "Each row has 5 squares. How many rows are there?"
                  - "3 rows of 5 is 3 × 5."
                  - "3 × 5 = 15 squares."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "This rectangle is 6 squares long. Find its area."
                show: { drawn: grid, cols: 8, rows: 4, lines: [[1, 1, 7, 1], [7, 1, 7, 3], [7, 3, 1, 3], [1, 3, 1, 1]] }
                frame: "_ rows of 6 squares: _ × 6 = _"
                options: ["2", "6", "8", "12"]
                answer: ["2", "2", "12"]
                hints:
                  - "Count the squares up the short side."
                  - "It is 2 squares wide, so 2 rows of 6."
                  - "2 × 6 = 12 squares."
              - id: l2-f3
                type: multiple_choice
                text: "Which calculation gives the area of this rectangle?"
                show: { drawn: grid, cols: 6, rows: 5, lines: [[1, 1, 5, 1], [5, 1, 5, 4], [5, 4, 1, 4], [1, 4, 1, 1]] }
                options: ["3 × 4", "3 + 4", "3 × 3"]
                answer: "3 × 4"
                feedback:
                  "3 + 4": "Adding the sides does not count the squares inside. 3 rows of 4 is 3 × 4."
                hints:
                  - "Count how long and how wide it is."
                  - "It is 4 squares long and 3 squares wide."
                  - "3 rows of 4: 3 × 4."
              - id: l2-f4
                type: true_false
                text: "These two rectangles have the same area."
                say: "Is it true? These two rectangles have the same area."
                show: { drawn: grid, cols: 6, rows: 6, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [4, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red], [4, 1, red], [0, 3, blue], [1, 3, blue], [2, 3, blue], [0, 4, blue], [1, 4, blue], [2, 4, blue], [0, 5, blue], [1, 5, blue], [2, 5, blue]] }
                answer: false
                hints:
                  - "Find each area with a multiplication."
                  - "Red: 2 × 5. Blue: 3 × 3."
                  - "10 and 9 are not the same, so no."
              - id: l2-f5
                type: fill_in_blank
                text: "Split the shape into the red rectangle and the blue one."
                show: { drawn: grid, cols: 4, rows: 4, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [0, 2, blue], [0, 3, blue]] }
                frame: "red: 3 × 2 = _   blue: 1 × 2 = _   area: _"
                options: ["2", "5", "6", "8"]
                answer: ["6", "2", "8"]
                hints:
                  - "Find the area of each rectangle, then add."
                  - "Red is 2 rows of 3. Blue is 2 squares."
                  - "6 + 2 = 8 squares."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "What is the area of this square in squares? Use a multiplication."
                show: { drawn: grid, cols: 5, rows: 4, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [0, 2, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [0, 3, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue]] }
                answer: "16"
                hints: ["4 rows of 4."]
              - id: l2-s2
                type: multiple_choice
                text: "What is the area of this rectangle in squares?"
                show: { drawn: grid, cols: 9, rows: 4, lines: [[1, 1, 8, 1], [8, 1, 8, 3], [8, 3, 1, 3], [1, 3, 1, 1]] }
                options: ["14", "9", "18"]
                answer: "14"
                hints: ["It is 7 long and 2 wide: 2 rows of 7."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which rectangle has an area of 12 squares?"
                options:
                  - { drawn: grid, cols: 5, rows: 4, lines: [[0, 0, 4, 0], [4, 0, 4, 3], [4, 3, 0, 3], [0, 3, 0, 0]], key: "3x4" }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[0, 0, 5, 0], [5, 0, 5, 2], [5, 2, 0, 2], [0, 2, 0, 0]], key: "2x5" }
                  - { drawn: grid, cols: 4, rows: 4, lines: [[0, 0, 3, 0], [3, 0, 3, 3], [3, 3, 0, 3], [0, 3, 0, 0]], key: "3x3" }
                answer: "3x4"
                hints: ["Multiply the length by the width for each one."]
              - id: l2-s4
                type: fill_in_blank
                text: "Split the shape into the red rectangle and the blue one."
                show: { drawn: grid, cols: 5, rows: 3, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red], [0, 2, blue], [1, 2, blue]] }
                frame: "_ + _ = _"
                options: ["2", "8", "10", "12"]
                answer: ["8", "2", "10"]
                hints: ["Red is 2 rows of 4. Blue is 1 row of 2."]
              - id: l2-s5
                type: text_input
                text: "On a garden plan the lawn is a rectangle 6 squares long and 3 squares wide. What is its area in squares?"
                answer: "18"
                hints: ["3 rows of 6."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "What is the area of this rectangle in squares?"
                show: { drawn: grid, cols: 10, rows: 4, lines: [[1, 1, 9, 1], [9, 1, 9, 3], [9, 3, 1, 3], [1, 3, 1, 1]] }
                answer: "16"
              - id: l2-n2
                type: multiple_choice
                text: "A rectangle has an area of 20 squares. It is 4 squares wide. How long is it?"
                options: ["5", "16", "80"]
                answer: "5"
              - id: l2-n3
                type: multiple_choice
                text: "Which rectangle does not have an area of 12 squares?"
                options: ["2 squares by 6 squares", "3 squares by 4 squares", "3 squares by 5 squares"]
                answer: "3 squares by 5 squares"
              - id: l2-n4
                type: text_input
                text: "What is the area of this shape in squares?"
                show: { drawn: grid, cols: 6, rows: 4, cells: [[0, 0, purple], [1, 0, purple], [2, 0, purple], [3, 0, purple], [4, 0, purple], [0, 1, purple], [1, 1, purple], [2, 1, purple], [3, 1, purple], [4, 1, purple], [3, 2, purple], [4, 2, purple], [3, 3, purple], [4, 3, purple]] }
                answer: "14"
              - id: l2-n5
                type: text_input
                text: "A wall is covered with square tiles: 7 rows of 6 tiles. What is the area of the wall in tiles?"
                answer: "42"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What is the area of this shape in squares?"
            show: { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [1, 1, blue], [2, 1, blue]] }
            options: ["6", "8", "5"]
            answer: "6"
          - id: l2-c2
            type: multiple_choice
            text: "What is the area of this shape in squares?"
            show: { drawn: grid, cols: 5, rows: 2, cells: [[1, 1, green], [2, 1, green], [3, 1, green]], halves: [[1, 0, br, green], [2, 0, bl, green]] }
            options: ["4", "5", "3"]
            answer: "4"
          - id: l2-c3
            type: text_input
            text: "What is the area of this rectangle in squares?"
            show: { drawn: grid, cols: 11, rows: 5, lines: [[1, 1, 10, 1], [10, 1, 10, 4], [10, 4, 1, 4], [1, 4, 1, 1]] }
            answer: "27"
          - id: l2-c4
            type: multiple_choice
            text: "A rectangle is 6 squares long and 4 squares wide. What is its area?"
            options: ["24", "10", "20"]
            answer: "24"
