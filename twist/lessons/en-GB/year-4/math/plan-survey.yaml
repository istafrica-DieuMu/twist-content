# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.plan-survey
skill: math.data.plan-survey
curriculum: en-GB
language: en
title:
  de: Eine Umfrage planen
  en: Planning a survey
summary: >
  Lesson 1 plans a class survey: a clear question that fits what you want
  to know, answer choices with "something else" for the rest, the right
  people to ask (every child once, not only your friends), tally marks to
  collect the answers, and the steps in order. Lesson 2 counts the tally
  marks into a table, checks that the total matches the number of
  children asked, picks the bar chart that fits, says the result in a
  sentence the data supports (9 of 24 children, not "everyone"), and ends
  with the skill check. Asking real classmates and drawing the chart by
  hand stay in the classroom.
metadata:
  year: year-4
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.data.pictograms-bar-charts, math.data.read-tables]
  also_practises: [math.data.tally, math.data.pictograms-bar-charts]
  vocabulary: { en: [survey, question, answer choices, tally marks, table, bar chart, data, result, total] }
  forms: [text, audio, drawn]
  drawn: [bar-chart, table]
  facets: []
  parts:
    - { id: question, what: { de: eine klare Frage mit Antworten wählen, en: choosing a clear question and answer choices } }
    - { id: plan, what: { de: wen man fragt und die Schritte einer Umfrage, en: who to ask and the steps of a survey } }
    - { id: organise, what: { de: Strichliste in eine Tabelle übertragen und die Summe prüfen, en: counting tally marks into a table and checking the total } }
    - { id: present, what: { de: das Ergebnis im Diagramm und in einem Satz vorstellen, en: presenting the result in a chart and a sentence } }
  misconceptions:
    - id: vague-question
      what: Asks a yes or no question that cannot show a favourite, or leaves out "something else" so some children cannot answer
      addressed: lesson 1 Learn shows a clear question with choices; l1-f1 has feedback on a yes or no question, l1-f2, l1-s5, l1-s1, l1-n1, l1-c1 and l2-c1 choose the question
    - id: unfair-sample
      what: Asks only friends, or some children twice, and thinks the result shows the whole class
      addressed: lesson 1 Learn says ask everyone once; l1-f3 has feedback on friends, l1-s2, l1-n2, l1-c2 and l2-c2 ask who to ask
    - id: overclaim
      what: Says the result is true for everyone ("all children like dogs") when only some chose it, or does not check the total
      addressed: lesson 2 Learn checks the total and says "9 of 24"; l2-f4 has feedback on "all", l2-f2, l2-s3, l1-n5 check the total, l2-s4, l2-n4 and l2-c5 choose the sentence
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die Umfrage planen, en: Planning the survey }
    goal:
      de: "Plane eine Umfrage in der Klasse. Stell eine klare Frage, frag jedes Kind einmal und halte die Antworten mit Strichen fest."
      en: "Plan a class survey. Ask a clear question, ask every child once, and use tally marks."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which club did the most children choose?"
            show: { drawn: bar-chart, rows: [[football, 8], [swimming, 5], [dance, 6]] }
            options: ["football", "swimming", "dance"]
            answer: "football"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Library books borrowed. How many books were borrowed on Tuesday?"
            show: { drawn: table, rows: [["Day", "Books"], ["Monday", 4], ["Tuesday", 7], ["Wednesday", 3]] }
            options: ["7", "4", "3"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1. Ask a clear question: Which of these pets do you like best?"
            say: "Ella wants to find out which pet her class likes best. First she needs a clear question with short answers: Which of these pets do you like best? A question like Do you like animals? only gets yes or no."
          - text: "2. Give answer choices: dog, cat, rabbit or something else"
            say: "Next she writes the answer choices: dog, cat, rabbit. She adds something else, so that every child has an answer to choose."
          - text: "3. Ask every child once."
            say: "Then she asks every child in the class, each one once. If she asked only her friends, or some children twice, the result would not show what the whole class thinks."
          - text: "4. Collect the answers with tally marks."
            say: "As she asks, she makes a tally mark for each answer. Every fifth mark goes across the four before it, so the marks are quick to count."
            show: { drawn: bar-chart, tally: true, rows: [[dog, 9], [cat, 7], [rabbit, 3], [something else, 5]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ella wants to know which pet her class likes best. Which question should she ask?"
                options: ["Which of these pets do you like best: dog, cat, rabbit or something else?", "Do you like animals?", "How old is your pet?"]
                answer: "Which of these pets do you like best: dog, cat, rabbit or something else?"
                feedback:
                  "Do you like animals?": "The answer is only yes or no. It does not tell Ella which pet is the favourite."
                hints:
                  - "The question must match what Ella wants to know."
                  - "She wants a favourite pet, so the answers should be pets."
                  - "Which of these pets do you like best: dog, cat, rabbit or something else?"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Why does Ella add \"something else\" to her answer choices?"
                options: ["So every child has an answer to choose.", "So the survey takes longer.", "So more children choose dog."]
                answer: "So every child has an answer to choose."
                hints:
                  - "Think of a child whose favourite is a hamster."
                  - "Without it, that child has no answer to pick."
                  - "So every child has an answer to choose."
              - id: l1-f3
                type: multiple_choice
                text: "Ella wants to know what her whole class thinks. Who should she ask?"
                options: ["every child in the class, once each", "only her best friends", "a few children, twice each"]
                answer: "every child in the class, once each"
                feedback:
                  "only her best friends": "Her friends might all like the same pet. To find what the whole class thinks, she asks everyone."
                hints:
                  - "The result should be about the whole class."
                  - "Nobody should be left out, and nobody should count twice."
                  - "Every child in the class, once each."
              - id: l1-f4
                type: multiple_choice
                text: "What is a quick way for Ella to record each answer as she asks?"
                options: ["a tally mark for each answer", "a drawing of each pet", "a long sentence for each child"]
                answer: "a tally mark for each answer"
                hints:
                  - "She needs something fast that she can count later."
                  - "One quick stroke for each answer."
                  - "A tally mark for each answer."
              - id: l1-f5
                type: ordering
                text: "Put the steps of Ella's survey in order."
                options: ["Show the result in a chart.", "Write the question and the answer choices.", "Count the tally marks.", "Ask every child and make a tally mark."]
                slot_count: 4
                answer: ["Write the question and the answer choices.", "Ask every child and make a tally mark.", "Count the tally marks.", "Show the result in a chart."]
                hints:
                  - "You need a question before you can ask anyone."
                  - "You can only count the marks once everyone has answered."
                  - "Question, ask and tally, count, chart."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Leo wants to know how the children in his class get to school. Which question is best?"
                options: ["How do you usually get to school: walk, car, bus, bike or another way?", "Do you like school?", "Is your school far away?"]
                answer: "How do you usually get to school: walk, car, bus, bike or another way?"
                hints: ["The answers should be ways of getting to school."]
              - id: l1-s2
                type: true_false
                text: "Leo asks only the children on his table. The result shows what the whole class thinks."
                say: "Is it true? Leo asks only the children on his table. The result shows what the whole class thinks."
                answer: false
                hints: ["Who did he leave out?"]
              - id: l1-s3
                type: multiple_choice
                text: "Leo's tally marks. How many children walk to school?"
                show: { drawn: bar-chart, tally: true, rows: [[walk, 11], [car, 6], [bus, 4], [bike, 3]] }
                options: ["11", "10", "6"]
                answer: "11"
                hints: ["Count each group of five, then the single marks."]
              - id: l1-s4
                type: multiple_choice
                text: "Leo asks 24 children. Each child answers once. How many tally marks should he have altogether?"
                options: ["24", "4", "12"]
                answer: "24"
                hints: ["One mark for each child."]
              - id: l1-s5
                type: multiple_choice
                text: "Leo's answer choices are: walk, car, bus. Which choice should he add so that every child can answer?"
                options: ["another way", "fast", "yes"]
                answer: "another way"
                hints: ["Some children come by bike or by scooter."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ava wants to find the favourite fruit in her class. Which question is best?"
                options: ["Which fruit do you like best: apple, banana, orange or another fruit?", "Do you eat fruit?", "What did you have for lunch?"]
                answer: "Which fruit do you like best: apple, banana, orange or another fruit?"
              - id: l1-n2
                type: true_false
                text: "To find out what the whole class thinks, you ask every child once."
                say: "Is it true? To find out what the whole class thinks, you ask every child once."
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Ava's tally marks. Which fruit got the most votes?"
                show: { drawn: bar-chart, tally: true, rows: [[apple, 7], [banana, 9], [orange, 4], [another fruit, 2]] }
                options: ["banana", "apple", "orange"]
                answer: "banana"
              - id: l1-n4
                type: text_input
                text: "Ava's tally marks. How many children answered altogether?"
                show: { drawn: bar-chart, tally: true, rows: [[apple, 7], [banana, 9], [orange, 4], [another fruit, 2]] }
                answer: "22"
              - id: l1-n5
                type: multiple_choice
                text: "Sam asked 30 children, but he counts only 28 tally marks. What should he do?"
                options: ["Check his tally marks and count again.", "Add two marks to football.", "Leave it, because it is close."]
                answer: "Check his tally marks and count again."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Sam wants to know which sport his class likes best. Which question is best?"
            options: ["Which sport do you like best: football, swimming, netball or another sport?", "Do you play a sport?", "Is football fun?"]
            answer: "Which sport do you like best: football, swimming, netball or another sport?"
          - id: l1-c2
            type: true_false
            text: "Asking some children twice makes a survey fairer."
            say: "Is it true? Asking some children twice makes a survey fairer."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Sam's tally marks. How many children chose swimming?"
            show: { drawn: bar-chart, tally: true, rows: [[football, 12], [swimming, 8], [netball, 5], [another sport, 3]] }
            options: ["8", "7", "12"]
            answer: "8"
          - id: l1-c4
            type: true_false
            text: "Ben wants to know which instrument his class likes best. He asks: \"Do you like music?\" Is it true? This question tells him the favourite instrument."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "How do you show 5 with tally marks?"
            options: ["four strokes with one stroke across them", "five strokes with a gap between each", "one long stroke"]
            answer: "four strokes with one stroke across them"
          - id: l1-c6
            type: multiple_choice
            text: "Ben wants to know what his whole class thinks, but he asks only the 8 children in his music club. What is wrong?"
            options: ["He has not asked the whole class.", "He asked too many children.", "Nothing is wrong."]
            answer: "He has not asked the whole class."

  - n: 2
    title: { de: Daten ordnen und vorstellen, en: Organising and presenting data }
    goal:
      de: "Zähl die Striche in eine Tabelle, prüf die Summe und sag, was sie zeigt, so wie 9 von 24 Kindern wählten Hunde."
      en: "Count tally marks into a table, check the total, and say what it shows, like 9 of 24 children chose dogs."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Tom wants to know which ice cream flavour his class likes best. Which answer choice should he add to chocolate, vanilla and strawberry?"
            options: ["another flavour", "yes", "cold"]
            answer: "another flavour"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many tally marks show chocolate?"
            show: { drawn: bar-chart, tally: true, rows: [[chocolate, 13], [vanilla, 6], [strawberry, 5]] }
            options: ["13", "12", "3"]
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "From tally marks to a table: dog 9, cat 7, rabbit 3, something else 5"
            say: "Ella counts each row of tally marks and writes the number in a table. Dog nine, cat seven, rabbit three, something else five."
            show: { drawn: table, rows: [["Pet", "Children"], ["dog", 9], ["cat", 7], ["rabbit", 3], ["something else", 5]] }
          - text: "Check: 9 + 7 + 3 + 5 = 24, and she asked 24 children."
            say: "Now she checks. Nine plus seven plus three plus five is twenty-four. She asked twenty-four children, so no answer is missing."
          - text: "Show it in a bar chart."
            say: "A bar chart shows the result at a glance. Each bar is as tall as the number in the table. The tallest bar is dog."
            show: { drawn: bar-chart, rows: [[dog, 9], [cat, 7], [rabbit, 3], [something else, 5]] }
          - text: "Say what the data shows: 9 of the 24 children like dogs best."
            say: "Last, Ella says the result in a sentence: dog is the favourite pet, chosen by nine of the twenty-four children. She does not say that all children like dogs, because fifteen chose something else."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Leo's tally marks. Write the numbers for his table."
                show: { drawn: bar-chart, tally: true, rows: [[walk, 11], [car, 6], [bus, 4], [bike, 3]] }
                frame: "walk: _   car: _   bus: _   bike: _"
                options: ["3", "4", "6", "11", "12"]
                answer: ["11", "6", "4", "3"]
                hints:
                  - "Count in fives for each crossed group, then add the single marks."
                  - "walk: two fives and one more. car: one five and one more."
                  - "11, 6, 4 and 3."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Leo asked 24 children. Does his table add up?"
                show: { drawn: table, rows: [["Way to school", "Children"], ["walk", 11], ["car", 6], ["bus", 4], ["bike", 3]] }
                options: ["Yes, 24 altogether.", "No, 23 altogether.", "No, 25 altogether."]
                answer: "Yes, 24 altogether."
                hints:
                  - "Add all the numbers in the table."
                  - "11 + 6 = 17, then 17 + 4 = 21, then add 3."
                  - "24 altogether, the same as the children he asked."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which bar chart shows Leo's table? walk 11, car 6, bus 4, bike 3"
                options:
                  - { drawn: bar-chart, rows: [[walk, 11], [car, 6], [bus, 4], [bike, 3]], key: "11-6-4-3" }
                  - { drawn: bar-chart, rows: [[walk, 11], [car, 4], [bus, 6], [bike, 3]], key: "11-4-6-3" }
                  - { drawn: bar-chart, rows: [[walk, 6], [car, 11], [bus, 4], [bike, 3]], key: "6-11-4-3" }
                answer: "11-6-4-3"
                hints:
                  - "Check each bar against the table."
                  - "The walk bar must be tallest, and car must be taller than bus."
                  - "It is the chart with 11, 6, 4 and 3."
              - id: l2-f4
                type: multiple_choice
                text: "Which sentence does Leo's data show?"
                show: { drawn: bar-chart, rows: [[walk, 11], [car, 6], [bus, 4], [bike, 3]] }
                options: ["11 of the 24 children walk to school.", "All the children walk to school.", "Nobody comes to school by bike."]
                answer: "11 of the 24 children walk to school."
                feedback:
                  "All the children walk to school.": "Walking is the most common way, but 13 children come another way. Say how many: 11 of the 24."
                hints:
                  - "Check each sentence against the chart."
                  - "Walk is the tallest bar, but there are other bars too."
                  - "11 of the 24 children walk to school."
              - id: l2-f5
                type: true_false
                text: "More children come by car than by bus and bike together."
                say: "Is it true? More children come by car than by bus and bike together."
                show: { drawn: table, rows: [["Way to school", "Children"], ["walk", 11], ["car", 6], ["bus", 4], ["bike", 3]] }
                answer: false
                hints:
                  - "Add bus and bike first."
                  - "4 + 3 = 7. Car is 6."
                  - "No. 6 is less than 7."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Ava's tally marks. Write the numbers for her table."
                show: { drawn: bar-chart, tally: true, rows: [[apple, 7], [banana, 9], [orange, 4], [another fruit, 2]] }
                frame: "apple: _   banana: _   orange: _   another fruit: _"
                options: ["2", "4", "7", "9", "10"]
                answer: ["7", "9", "4", "2"]
                hints: ["Count each crossed group as five."]
              - id: l2-s2
                type: text_input
                text: "Ava's table. How many children are in the table altogether?"
                show: { drawn: table, rows: [["Fruit", "Children"], ["apple", 7], ["banana", 9], ["orange", 4], ["another fruit", 2]] }
                answer: "22"
                hints: ["Add the four numbers."]
              - id: l2-s3
                type: multiple_choice
                text: "Ava asked 25 children, but her table shows 22. What has gone wrong?"
                options: ["Some answers were not counted.", "Nothing, the table is right.", "Too many children like bananas."]
                answer: "Some answers were not counted."
                hints: ["Each child gives one answer, so the total should be 25."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence does Ava's data show?"
                show: { drawn: bar-chart, rows: [[apple, 7], [banana, 9], [orange, 4], [another fruit, 2]] }
                options: ["Banana is the favourite fruit of 9 children.", "Every child likes bananas best.", "Orange is the favourite fruit."]
                answer: "Banana is the favourite fruit of 9 children."
                hints: ["Find the tallest bar, and say how many."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Which bar chart shows Ava's table? apple 7, banana 9, orange 4, another fruit 2"
                options:
                  - { drawn: bar-chart, rows: [[apple, 9], [banana, 7], [orange, 4], [another fruit, 2]], key: "9-7-4-2" }
                  - { drawn: bar-chart, rows: [[apple, 7], [banana, 9], [orange, 4], [another fruit, 2]], key: "7-9-4-2" }
                  - { drawn: bar-chart, rows: [[apple, 7], [banana, 9], [orange, 2], [another fruit, 4]], key: "7-9-2-4" }
                answer: "7-9-4-2"
                hints: ["Banana must be the tallest bar, and orange taller than another fruit."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Favourite colours. How many children chose blue?"
                show: { drawn: bar-chart, tally: true, rows: [[red, 8], [blue, 10], [green, 5], [another colour, 3]] }
                answer: "10"
              - id: l2-n2
                type: text_input
                text: "Favourite colours. How many children answered altogether?"
                show: { drawn: bar-chart, tally: true, rows: [[red, 8], [blue, 10], [green, 5], [another colour, 3]] }
                answer: "26"
              - id: l2-n3
                type: multiple_choice
                text: "Favourite colours. How many more children chose blue than green?"
                show: { drawn: bar-chart, rows: [[red, 8], [blue, 10], [green, 5], [another colour, 3]] }
                options: ["5", "15", "2"]
                answer: "5"
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence does the colour survey show?"
                show: { drawn: bar-chart, rows: [[red, 8], [blue, 10], [green, 5], [another colour, 3]] }
                options: ["10 of the 26 children like blue best.", "Most children like green best.", "All the children like blue best."]
                answer: "10 of the 26 children like blue best."
              - id: l2-n5
                type: true_false
                text: "Red and green together got more votes than blue."
                say: "Is it true? Red and green together got more votes than blue."
                show: { drawn: table, rows: [["Colour", "Children"], ["red", 8], ["blue", 10], ["green", 5], ["another colour", 3]] }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: question
            type: multiple_choice
            text: "Zara wants to know which school lunch her class likes best. Which question is best?"
            options: ["Which lunch do you like best: pasta, pizza, curry or something else?", "Do you have school lunch?", "Is pizza nice?"]
            answer: "Which lunch do you like best: pasta, pizza, curry or something else?"
          - id: l2-c2
            part: plan
            type: multiple_choice
            text: "Who should Zara ask to find out what her whole class thinks?"
            options: ["every child in her class, once each", "only the children who like pizza", "her family at home"]
            answer: "every child in her class, once each"
          - id: l2-c3
            part: organise
            type: fill_in_blank
            text: "Zara's tally marks. Write the numbers for her table."
            show: { drawn: bar-chart, tally: true, rows: [[pasta, 6], [pizza, 12], [curry, 5], [something else, 4]] }
            frame: "pasta: _   pizza: _   curry: _   something else: _"
            options: ["4", "5", "6", "12", "13"]
            answer: ["6", "12", "5", "4"]
          - id: l2-c4
            part: organise
            type: text_input
            text: "Zara asked every child in her class once. How many children are in her class?"
            show: { drawn: table, rows: [["Lunch", "Children"], ["pasta", 6], ["pizza", 12], ["curry", 5], ["something else", 4]] }
            answer: "27"
          - id: l2-c5
            part: present
            type: multiple_choice
            text: "Which sentence does Zara's data show?"
            show: { drawn: bar-chart, rows: [[pasta, 6], [pizza, 12], [curry, 5], [something else, 4]] }
            options: ["12 of the 27 children like pizza best.", "Everyone likes pizza best.", "Pasta got the most votes."]
            answer: "12 of the 27 children like pizza best."
          - id: l2-c6
            part: question
            type: true_false
            text: "Mo wants to know which book his class likes best. He asks: \"Do you like reading?\" Is it true? This is a good question for his survey."
            answer: false
          - id: l2-c7
            part: question
            type: multiple_choice
            text: "Priya asks: \"Which colour do you like best: red, blue or green?\" One child likes purple best. What should Priya add to her answer choices?"
            options: ["another colour", "yes or no", "red again"]
            answer: "another colour"
          - id: l2-c8
            part: question
            type: multiple_choice
            text: "Which question finds the favourite season of a class?"
            options: ["Which season do you like best: spring, summer, autumn or winter?", "Is it sunny today?", "Do you like summer?"]
            answer: "Which season do you like best: spring, summer, autumn or winter?"
          - id: l2-c9
            part: question
            type: multiple_choice
            text: "Jack asks: \"How many pets do you have?\" Which answer choices fit his question?"
            options: ["0, 1, 2, 3 or more", "dog, cat or fish", "yes or no"]
            answer: "0, 1, 2, 3 or more"
          - id: l2-c10
            part: plan
            type: true_false
            text: "Zoe wants to know the favourite game of her Year 4 class. She asks her class and the children in Year 6 too. Is it true? This is a good plan."
            answer: false
          - id: l2-c11
            part: plan
            type: ordering
            text: "Put the steps of a survey in order."
            options: ["Draw a bar chart.", "Say what the result shows.", "Ask each child once.", "Count the tally marks into a table."]
            slot_count: 4
            answer: ["Ask each child once.", "Count the tally marks into a table.", "Draw a bar chart.", "Say what the result shows."]
          - id: l2-c12
            part: plan
            type: multiple_choice
            text: "Why should each child answer only once?"
            options: ["So no child is counted twice.", "So the survey is quicker for friends.", "So more children choose football."]
            answer: "So no child is counted twice."
          - id: l2-c13
            part: plan
            type: multiple_choice
