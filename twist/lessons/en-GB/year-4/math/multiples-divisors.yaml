# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.multiples-divisors
skill: math.mult-div-larger.multiples-divisors
curriculum: en-GB
language: en
title:
  de: Vielfache und Teiler
  en: Multiples and factors
summary: >
  Lesson 1 finds multiples: the numbers in a times table, which go on
  past 10 × (multiples of 4 are 4, 8, 12, 16 …); lesson 2 finds the
  factors of a number in factor pairs, with arrays (12 = 1 × 12 = 2 × 6
  = 3 × 4), always starting with 1 and the number itself, tells factors
  from multiples, and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-facts]
  also_practises: [math.mult-div.all-tables, math.mult-div.div-facts]
  vocabulary: { en: [multiple, factor, factor pair, divisible, array, times table] }
  forms: [drawn, text, audio]
  drawn: [letter-card, dots]
  facets: [operation-signs]
  misconceptions:
    - id: multiple-factor-mixup
      what: Mixes up multiples and factors (calls 3 a multiple of 12)
      addressed: lesson 2 Learn sets the two side by side; l2-f4 (with feedback) and l2-n4 ask about a number that is a factor, not a multiple, l2-s4 the other way round; l2-c5 asks for a multiple after the factor tasks
    - id: forget-1-and-itself
      what: Leaves out 1 and the number itself as factors
      addressed: lesson 2 Learn starts each list with 1 and the number; l2-f2 (with feedback), l2-s2 and l2-n2 find every factor of a number, and l2-f1 asks for the partner of 1
    - id: near-miss
      what: Takes a number one off a multiple (13 as a multiple of 4)
      addressed: every highlight card in lesson 1 (l1-f1, l1-s1, l1-n1, l1-c1) has numbers one off a multiple; l1-f3 has feedback on 22 as a multiple of 7
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Vielfache", en: "Multiples" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "36 ÷ 4 = _"
            say: "Thirty-six divided by four."
            answer: "9"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "7 × 6 = _"
            say: "Seven times six."
            answer: "42"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Multiples of 4: 4, 8, 12, 16, 20, 24 …"
            say: "The multiples of four are the numbers in the four times table: four, eight, twelve, sixteen, and so on. They do not stop at forty: forty-four and forty-eight are multiples of four too."
          - text: "28 = 7 × 4, so 28 is a multiple of 4. 30 is not."
            say: "Twenty-eight is seven times four, so it is a multiple of four. Thirty is not: seven fours are twenty-eight and eight fours are thirty-two. Thirty falls in between."
          - text: "Multiples of 10 end in 0. Multiples of 5 end in 0 or 5. Multiples of 2 are even."
            say: "Some multiples are easy to spot. Multiples of ten end in zero. Multiples of five end in zero or five. Multiples of two are even numbers."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap every multiple of 4."
                show: { drawn: letter-card, text: "12 13 16 18 20 25" }
                spans: ["12", "16", "20"]
                hints:
                  - "Count in fours: 4, 8, 12 …"
                  - "13 is one more than 12, and 25 is one more than 24."
                  - "12, 16 and 20."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Write the next multiples of 6."
                say: "Count on in sixes. Write the next two multiples of six."
                frame: "36, 42, _, _"
                options: ["46", "48", "52", "54"]
                answer: ["48", "54"]
                hints:
                  - "Each multiple of 6 is six more than the one before."
                  - "42 + 6, then add 6 again."
                  - "48 and 54."
              - id: l1-f3
                type: multiple_choice
                text: "Which number is a multiple of 7?"
                options: ["22", "28", "30"]
                answer: "28"
                feedback:
                  "22": "21 is a multiple of 7, and 22 is one more. Count in sevens: 21, 28."
                hints:
                  - "Count in sevens: 7, 14, 21 …"
                  - "21 and then 28."
                  - "28 = 4 × 7."
              - id: l1-f4
                type: true_false
                text: "Is it true? 45 is a multiple of 5."
                answer: true
                hints:
                  - "Multiples of 5 end in 0 or 5."
                  - "45 ends in 5."
                  - "Yes. 45 = 9 × 5."
              - id: l1-f5
                type: multiple_choice
                text: "Which number is a multiple of both 2 and 5?"
                options: ["15", "25", "30"]
                answer: "30"
                hints:
                  - "A multiple of 2 is even. A multiple of 5 ends in 0 or 5."
                  - "Which number is even and ends in 0 or 5?"
                  - "30."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap every multiple of 3."
                show: { drawn: letter-card, text: "9 10 15 19 21 25" }
                spans: ["9", "15", "21"]
                hints: ["Count in threes. 10 and 19 are one more than a multiple of 3."]
              - id: l1-s2
                type: fill_in_blank
                text: "Write the next multiples of 8."
                say: "Count on in eights. Write the next two multiples of eight."
                frame: "64, 72, _, _"
                options: ["78", "80", "86", "88"]
                answer: ["80", "88"]
                hints: ["Add 8 each time."]
              - id: l1-s3
                type: multiple_choice
                text: "Which number is a multiple of 9?"
                options: ["46", "54", "56"]
                answer: "54"
                hints: ["6 × 9 = ?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? 34 is a multiple of 4."
                answer: false
                hints: ["8 × 4 = 32 and 9 × 4 = 36."]
              - id: l1-s5
                type: text_input
                text: "What is the 11th multiple of 10?"
                say: "The first multiple of ten is ten. What is the eleventh multiple of ten?"
                answer: "110"
                hints: ["11 × 10."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap every multiple of 6."
                show: { drawn: letter-card, text: "18 19 24 31 36 37" }
                spans: ["18", "24", "36"]
              - id: l1-n2
                type: fill_in_blank
                text: "Write the next multiples of 7."
                say: "Count on in sevens. Write the next two multiples of seven."
                frame: "49, 56, _, _"
                options: ["63", "64", "70", "72"]
                answer: ["63", "70"]
              - id: l1-n3
                type: multiple_choice
                text: "Which number is a multiple of 8?"
                options: ["42", "48", "50"]
                answer: "48"
              - id: l1-n4
                type: true_false
                text: "Is it true? 60 is a multiple of 3, of 5 and of 10."
                answer: true
              - id: l1-n5
                type: text_input
                text: "Which multiple of 5 comes after 95?"
                answer: "100"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap every multiple of 9."
            show: { drawn: letter-card, text: "27 28 36 44 45 50" }
            spans: ["27", "36", "45"]
          - id: l1-c2
            type: multiple_choice
            text: "Which number is a multiple of 6?"
            options: ["32", "42", "44"]
            answer: "42"
          - id: l1-c3
            type: true_false
            text: "Is it true? 26 is a multiple of 7."
            answer: false

  - n: 2
    title: { de: "Teiler", en: "Factors" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which number is a multiple of 4?"
            options: ["26", "28", "30"]
            answer: "28"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? 35 is a multiple of 5."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 × 4 = 12, so 3 and 4 are factors of 12."
            say: "Twelve dots make three rows of four. Three times four is twelve, so three and four are factors of twelve. A factor pair is two numbers that multiply to make the number."
            show: { drawn: dots, array: [3, 4] }
          - text: "12: 1 × 12, 2 × 6, 3 × 4"
            say: "Find all the factor pairs of twelve. Always start with one times twelve. Then two times six, then three times four. So the factors of twelve are one, two, three, four, six and twelve."
            show: { drawn: dots, array: [2, 6] }
          - text: "3 is a factor of 12. 12 is a multiple of 3."
            say: "Factors and multiples are two sides of one fact. Three is a factor of twelve, because three goes into twelve exactly. Twelve is a multiple of three, because it is in the three times table. A factor is never bigger than the number, but a multiple is never smaller."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Complete the factor pairs of 18."
                say: "Complete the factor pairs of eighteen."
                frame: "1 × _, 2 × _, 3 × _"
                options: ["6", "8", "9", "18"]
                answer: ["18", "9", "6"]
                hints:
                  - "Each pair multiplies to make 18."
                  - "One times what makes 18? Two times what makes 18?"
                  - "18, 9 and 6."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tap every factor of 10."
                show: { drawn: letter-card, text: "1 2 3 4 5 10 20" }
                spans: ["1", "2", "5", "10"]
                feedback:
                  "20": "20 is a multiple of 10, not a factor. A factor goes into 10 exactly."
                hints:
                  - "Find the factor pairs: 1 × 10 and 2 × 5."
                  - "Remember 1 and 10 itself."
                  - "1, 2, 5 and 10."
              - id: l2-f3
                type: multiple_choice
                text: "Which number is a factor of 24?"
                options: ["5", "8", "10"]
                answer: "8"
                hints:
                  - "A factor goes into 24 exactly, with no remainder."
                  - "Which of them is in a factor pair of 24?"
                  - "3 × 8 = 24, so 8."
              - id: l2-f4
                type: true_false
                text: "Is it true? 4 is a multiple of 20."
                answer: false
                feedback:
                  "true": "4 goes into 20 exactly, so 4 is a factor of 20. 20 is the multiple."
                hints:
                  - "A multiple is never smaller than the number."
                  - "4 × 5 = 20. Which is the factor and which is the multiple?"
                  - "No. 4 is a factor of 20."
              - id: l2-f5
                type: multiple_choice
                text: "Which is a factor pair of 16?"
                options: ["2 × 8", "3 × 5", "4 × 5"]
                answer: "2 × 8"
                hints:
                  - "The two numbers must multiply to make 16."
                  - "3 × 5 = 15 and 4 × 5 = 20."
                  - "2 × 8 = 16."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Complete the factor pairs of 20."
                say: "Complete the factor pairs of twenty."
                frame: "1 × _, 2 × _, 4 × _"
                options: ["5", "10", "15", "20"]
                answer: ["20", "10", "5"]
                hints: ["Each pair multiplies to make 20."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap every factor of 15."
                show: { drawn: letter-card, text: "1 2 3 4 5 15 30" }
                spans: ["1", "3", "5", "15"]
                hints: ["1 × 15 and 3 × 5."]
              - id: l2-s3
                type: multiple_choice
                text: "Which number is not a factor of 30?"
                options: ["5", "6", "8"]
                answer: "8"
                hints: ["Does it go into 30 exactly?"]
              - id: l2-s4
                type: true_false
                text: "Is it true? 27 is a multiple of 9."
                answer: true
                hints: ["Is 27 in the 9 times table?"]
              - id: l2-s5
                type: text_input
                text: "How many factors does 9 have?"
                answer: "3"
                hints: ["1 × 9 and 3 × 3. Count 3 only once."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Complete the factor pairs of 24."
                say: "Complete the factor pairs of twenty-four."
                frame: "1 × _, 2 × _, 3 × _, 4 × _"
                options: ["6", "8", "12", "24"]
                answer: ["24", "12", "8", "6"]
              - id: l2-n2
                type: highlight_in_text
                text: "Tap every factor of 14."
                show: { drawn: letter-card, text: "1 2 4 7 14 28" }
                spans: ["1", "2", "7", "14"]
              - id: l2-n3
                type: multiple_choice
                text: "Which number is a factor of 36?"
                options: ["7", "8", "9"]
                answer: "9"
              - id: l2-n4
                type: true_false
                text: "Is it true? 6 is a multiple of 30."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Mrs Patel puts 21 chairs in equal rows. Which row size works?"
                options: ["4", "6", "7"]
                answer: "7"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tap every multiple of 7."
            show: { drawn: letter-card, text: "14 15 21 29 35 36" }
            spans: ["14", "21", "35"]
          - id: l2-c2
            type: fill_in_blank
            text: "Complete the factor pairs of 16."
            say: "Complete the factor pairs of sixteen."
            frame: "1 × _, 2 × _, 4 × _"
            options: ["4", "6", "8", "16"]
            answer: ["16", "8", "4"]
          - id: l2-c3
            type: highlight_in_text
            text: "Tap every factor of 8."
            show: { drawn: letter-card, text: "1 2 3 4 6 8 16" }
            spans: ["1", "2", "4", "8"]
          - id: l2-c4
            type: multiple_choice
            text: "Which number is a factor of 40?"
            options: ["6", "8", "12"]
            answer: "8"
          - id: l2-c5
            type: multiple_choice
            text: "Which number is a multiple of 12?"
            options: ["4", "6", "36"]
            answer: "36"
