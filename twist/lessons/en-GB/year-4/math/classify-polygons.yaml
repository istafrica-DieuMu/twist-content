# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.classify-polygons
skill: math.shapes.classify-polygons
curriculum: en-GB
language: en
title:
  de: Dreiecke, Vierecke und regelmäßige Vielecke
  en: Classify triangles, quadrilaterals and polygons
summary: >
  Sorting 2D shapes by their properties, drawn on squared paper so the
  sides can be counted. Lesson 1 sorts triangles by their sides
  (equilateral, isosceles, scalene) and finds right-angled triangles;
  lesson 2 names quadrilaterals by their sides, parallel sides and right
  angles (rectangle, rhombus, parallelogram, trapezium, kite); lesson 3
  tells regular from irregular polygons, mixes all three and ends with the
  skill check. Options never offer a name that would also be right (a
  rhombus is also a parallelogram), so each task has one answer.
metadata:
  year: year-4
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.more-shapes, math.angles.right-angles]
  also_practises: [math.angles.right-angles]
  vocabulary: { en: [triangle, equilateral, isosceles, scalene, right-angled, quadrilateral, square, rectangle, rhombus, parallelogram, trapezium, kite, parallel, regular, irregular, polygon] }
  forms: [drawn, text, audio]
  drawn: [grid, shape]
  facets: []
  parts:
    - { id: triangles, what: { de: Dreiecke nach Seiten und Winkeln einteilen, en: classifying triangles by their sides and angles } }
    - { id: quadrilaterals, what: { de: Vierecke nach Seiten und Winkeln benennen, en: naming quadrilaterals by their sides and angles } }
    - { id: regular, what: { de: regelmäßige und unregelmäßige Vielecke unterscheiden, en: telling regular from irregular polygons } }
    - { id: properties, what: { de: die Eigenschaften einer Figur aus ihrem Namen kennen, en: knowing the properties that go with a shape's name } }
  misconceptions:
    - id: triangle-names
      what: Mixes up equilateral, isosceles and scalene
      addressed: lesson 1 Learn names each by its sides; l1-f2 and l1-f4 have feedback, l1-s4 matches names with sides, and l1-n2, l1-n3 and l3-c1 name triangles from their sides
    - id: parallel-pairs
      what: Mixes up the parallelogram, the rhombus and the trapezium (how many pairs of parallel sides, which sides are equal)
      addressed: lesson 2 Learn names each by its sides; l2-f1 has feedback, and l2-f5, l2-s3, l2-s5, l2-n5 and l3-c3 ask it
    - id: equal-sides-is-regular
      what: Thinks a polygon with equal sides is regular even when its angles differ (a rhombus), or that equal angles are enough (a rectangle)
      addressed: lesson 3 Learn shows the rectangle and the rhombus are irregular; l3-f2 has feedback, and l3-f5, l3-s4 and l3-n2 ask it
    - id: turned-shape
      what: Does not recognise a shape that is turned or upside down
      addressed: l1-n1 shows an upside-down isosceles triangle, l1-c3 a right angle at the top, and the kites and parallelograms in lesson 2 lean different ways
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Dreiecke einteilen, en: Sort triangles }
    goal:
      de: "Sortiere Dreiecke nach ihren Seiten und Winkeln, so wie ein gleichschenkliges Dreieck mit 2 gleich langen Seiten."
      en: "Sort triangles by their sides and angles, like an isosceles triangle with 2 equal sides."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Which shape is a pentagon?"
            option_audio: false
            options:
              - { drawn: shape, kind: pentagon, colour: blue }
              - { drawn: shape, kind: hexagon, colour: blue }
              - { drawn: shape, kind: octagon, colour: blue }
            answer: pentagon
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? This triangle has a right angle."
            show: { drawn: grid, cols: 5, rows: 5, lines: [[0, 0, 0, 5], [0, 5, 4, 5], [4, 5, 0, 0]] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Equilateral: 3 equal sides\nIsosceles: 2 equal sides\nScalene: no equal sides"
            say: "We sort triangles by their sides. An equilateral triangle has three equal sides. An isosceles triangle has two equal sides. A scalene triangle has no equal sides."
          - text: "Isosceles: the two slanted sides are equal."
            say: "This triangle is isosceles. Each slanted side goes 3 squares across and 6 squares up, so the two are the same length. The bottom side is shorter."
            show: { drawn: grid, cols: 6, rows: 6, lines: [[0, 6, 6, 6], [6, 6, 3, 0], [3, 0, 0, 6]] }
          - text: "Right-angled: one angle is a right angle."
            say: "We can also sort triangles by their angles. A right-angled triangle has one right angle, like the corner of a square. This one has its right angle at the bottom left."
            show: { drawn: grid, cols: 5, rows: 5, lines: [[0, 0, 0, 5], [0, 5, 4, 5], [4, 5, 0, 0]] }
          - text: "Scalene: all three sides are different."
            say: "This triangle is scalene. Every side has a different length, and it has no right angle."
            show: { drawn: grid, cols: 6, rows: 5, lines: [[0, 5, 6, 5], [6, 5, 1, 0], [1, 0, 0, 5]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What kind of triangle is this?"
                show: { drawn: grid, cols: 4, rows: 6, lines: [[0, 6, 4, 6], [4, 6, 2, 0], [2, 0, 0, 6]] }
                options: ["isosceles", "scalene", "equilateral"]
                answer: "isosceles"
                hints:
                  - "Compare the lengths of the sides."
                  - "Both slanted sides go 2 squares across and 6 squares up. The bottom is only 4 squares."
                  - "Two equal sides: isosceles."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A triangle has three equal sides. What is it called?"
                options: ["equilateral", "isosceles", "scalene"]
                answer: "equilateral"
                feedback:
                  "isosceles": "We call a triangle isosceles when two sides are equal. With all three sides equal, it is equilateral."
                hints:
                  - "Which name goes with three equal sides?"
                  - "Equi- means equal: all sides equal."
                  - "Equilateral."
              - id: l1-f3
                type: multiple_choice
                text: "What kind of triangle is this?"
                show: { drawn: grid, cols: 5, rows: 4, lines: [[0, 1, 5, 1], [5, 1, 5, 4], [5, 4, 0, 1]] }
                options: ["right-angled", "equilateral", "isosceles"]
                answer: "right-angled"
                hints:
                  - "Look at the angles. Is one of them like the corner of a square?"
                  - "The top side runs along the grid and the right side runs straight down."
                  - "It has a right angle at the top right: right-angled."
              - id: l1-f4
                type: multiple_choice
                text: "What kind of triangle is this?"
                show: { drawn: grid, cols: 6, rows: 5, lines: [[0, 5, 6, 5], [6, 5, 1, 0], [1, 0, 0, 5]] }
                options: ["scalene", "isosceles", "equilateral"]
                answer: "scalene"
                feedback:
                  "isosceles": "Check the sides: the bottom is 6 squares, and the slanted sides are not the same length."
                hints:
                  - "Compare the three sides."
                  - "The left side is short and steep, the right side is long."
                  - "No equal sides: scalene."
              - id: l1-f5
                type: true_false
                text: "Is it true? A scalene triangle has two equal sides."
                answer: false
                hints:
                  - "Which triangle has two equal sides?"
                  - "Two equal sides is isosceles."
                  - "No. A scalene triangle has no equal sides."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What kind of triangle is this?"
                show: { drawn: grid, cols: 6, rows: 4, lines: [[0, 4, 3, 4], [3, 4, 6, 0], [6, 0, 0, 4]] }
                options: ["scalene", "isosceles", "equilateral"]
                answer: "scalene"
                hints: ["Are any two sides the same length?"]
              - id: l1-s2
                type: multiple_choice
                text: "A triangle has exactly two equal sides. What is it called?"
                options: ["isosceles", "equilateral", "scalene"]
                answer: "isosceles"
                hints: ["Three equal sides is equilateral, none is scalene."]
              - id: l1-s3
                type: multiple_choice
                text: "What kind of triangle is this?"
                show: { drawn: grid, cols: 5, rows: 5, lines: [[0, 0, 0, 5], [0, 5, 4, 5], [4, 5, 0, 0]] }
                options: ["right-angled", "equilateral", "isosceles"]
                answer: "right-angled"
                hints: ["Look at the bottom left corner."]
              - id: l1-s4
                type: matching
                text: "Match each triangle with what it has."
                pairs:
                  - { left: { text: "equilateral" }, right: { text: "3 equal sides" } }
                  - { left: { text: "isosceles" }, right: { text: "2 equal sides" } }
                  - { left: { text: "scalene" }, right: { text: "no equal sides" } }
                  - { left: { text: "right-angled" }, right: { text: "a right angle" } }
                hints: ["Equi- means equal."]
              - id: l1-s5
                type: true_false
                text: "Is it true? This triangle has a right angle."
                show: { drawn: grid, cols: 6, rows: 6, lines: [[0, 6, 6, 6], [6, 6, 3, 0], [3, 0, 0, 6]] }
                answer: false
                hints: ["Is any corner like the corner of a square?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What kind of triangle is this?"
                show: { drawn: grid, cols: 6, rows: 2, lines: [[0, 0, 6, 0], [6, 0, 3, 2], [3, 2, 0, 0]] }
                options: ["isosceles", "scalene", "equilateral"]
                answer: "isosceles"
              - id: l1-n2
                type: multiple_choice
                text: "Amy's triangle has sides of 5 cm, 5 cm and 3 cm. What kind of triangle is it?"
                options: ["isosceles", "equilateral", "scalene"]
                answer: "isosceles"
              - id: l1-n3
                type: multiple_choice
                text: "A triangle has sides of 4 cm, 6 cm and 7 cm. What kind of triangle is it?"
                options: ["scalene", "isosceles", "equilateral"]
                answer: "scalene"
              - id: l1-n4
                type: true_false
                text: "Is it true? A triangle with sides of 8 cm, 8 cm and 8 cm is equilateral."
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "Which triangle is scalene?"
                options:
                  - { drawn: grid, cols: 6, rows: 6, lines: [[0, 6, 6, 6], [6, 6, 3, 0], [3, 0, 0, 6]], key: iso }
                  - { drawn: grid, cols: 6, rows: 4, lines: [[0, 4, 3, 4], [3, 4, 6, 0], [6, 0, 0, 4]], key: scalene }
                  - { drawn: grid, cols: 4, rows: 6, lines: [[0, 6, 4, 6], [4, 6, 2, 0], [2, 0, 0, 6]], key: iso-small }
                answer: scalene

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What kind of triangle is this?"
            show: { drawn: grid, cols: 6, rows: 4, lines: [[0, 4, 6, 4], [6, 4, 3, 0], [3, 0, 0, 4]] }
            options: ["isosceles", "scalene", "equilateral"]
            answer: "isosceles"
          - id: l1-c2
            type: multiple_choice
            text: "A triangle has sides of 9 cm, 9 cm and 9 cm. What kind of triangle is it?"
            options: ["equilateral", "isosceles", "scalene"]
            answer: "equilateral"
          - id: l1-c3
            type: multiple_choice
            text: "What kind of triangle is this?"
            show: { drawn: grid, cols: 6, rows: 3, lines: [[0, 0, 6, 0], [6, 0, 0, 3], [0, 3, 0, 0]] }
            options: ["right-angled", "equilateral", "isosceles"]
            answer: "right-angled"
          - id: l1-c4
            type: image_multiple_choice
            text: "Which triangle is isosceles?"
            options:
              - { drawn: grid, cols: 4, rows: 3, lines: [[0, 3, 4, 3], [4, 3, 2, 0], [2, 0, 0, 3]], key: iso }
              - { drawn: grid, cols: 5, rows: 3, lines: [[0, 3, 5, 3], [5, 3, 2, 0], [2, 0, 0, 3]], key: scalene }
              - { drawn: grid, cols: 4, rows: 3, lines: [[0, 0, 0, 3], [0, 3, 4, 3], [4, 3, 0, 0]], key: right }
            answer: iso
          - id: l1-c5
            type: true_false
            text: "Is it true? An isosceles triangle has exactly two equal sides."
            answer: true
          - id: l1-c6
            type: true_false
            text: "Is it true? This triangle is scalene."
            show: { drawn: grid, cols: 3, rows: 4, lines: [[0, 4, 3, 4], [3, 4, 3, 0], [3, 0, 0, 4]] }
            answer: true

  - n: 2
    title: { de: Vierecke benennen, en: Name quadrilaterals }
    goal:
      de: "Benenne Vierecke nach ihren Seiten und Winkeln, so wie ein Trapez mit nur 1 Paar paralleler Seiten."
      en: "Name four-sided shapes by their sides and angles, like a trapezium with just 1 pair of parallel sides."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A triangle has sides of 6 cm, 6 cm and 4 cm. What kind of triangle is it?"
            options: ["isosceles", "equilateral", "scalene"]
            answer: "isosceles"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What kind of triangle is this?"
            show: { drawn: grid, cols: 7, rows: 3, lines: [[0, 3, 4, 0], [4, 0, 7, 3], [7, 3, 0, 3]] }
            options: ["scalene", "isosceles", "equilateral"]
            answer: "scalene"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Rhombus: 4 equal sides, no right angles"
            say: "Quadrilaterals have four sides. We sort them by their sides and angles. This is a rhombus: all four sides are the same length, and its opposite sides are parallel, but it has no right angles. Each slanted side goes 3 across and 4 up, which is as long as the 5 squares along the bottom."
            show: { drawn: grid, cols: 8, rows: 4, lines: [[0, 4, 5, 4], [5, 4, 8, 0], [8, 0, 3, 0], [3, 0, 0, 4]] }
          - text: "Parallelogram: 2 pairs of parallel sides"
            say: "A parallelogram has two pairs of parallel sides. Parallel lines go in the same direction and never meet. Its opposite sides are equal, but here the slanted sides are shorter than the top and the bottom."
            show: { drawn: grid, cols: 7, rows: 4, lines: [[0, 4, 6, 4], [6, 4, 7, 0], [7, 0, 1, 0], [1, 0, 0, 4]] }
          - text: "Trapezium: only 1 pair of parallel sides"
            say: "A trapezium has only one pair of parallel sides. Here the top and the bottom are parallel. The two slanted sides lean towards each other, so they are not parallel."
            show: { drawn: grid, cols: 7, rows: 4, lines: [[0, 4, 7, 4], [7, 4, 5, 0], [5, 0, 2, 0], [2, 0, 0, 4]] }
          - text: "Kite: 2 pairs of equal sides next to each other"
            say: "A kite has two short sides next to each other at the top, and two long sides next to each other at the bottom. It has no parallel sides."
            show: { drawn: grid, cols: 6, rows: 7, lines: [[3, 0, 5, 2], [5, 2, 3, 7], [3, 7, 1, 2], [1, 2, 3, 0]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is this quadrilateral called?"
                show: { drawn: grid, cols: 7, rows: 4, lines: [[0, 4, 6, 4], [6, 4, 7, 0], [7, 0, 1, 0], [1, 0, 0, 4]] }
                options: ["parallelogram", "rhombus", "kite"]
                answer: "parallelogram"
                feedback:
                  "rhombus": "A rhombus has four equal sides. Here the slanted sides are shorter than the top and the bottom."
                hints:
                  - "Count the parallel pairs, then compare the sides."
                  - "Top and bottom are parallel, and so are the two slanted sides. The sides are not all equal."
                  - "Two pairs of parallel sides: a parallelogram."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is this quadrilateral called?"
                show: { drawn: grid, cols: 7, rows: 4, lines: [[0, 4, 7, 4], [7, 4, 5, 0], [5, 0, 2, 0], [2, 0, 0, 4]] }
                options: ["trapezium", "parallelogram", "kite"]
                answer: "trapezium"
                hints:
                  - "How many pairs of parallel sides are there?"
                  - "The top and bottom are parallel. The slanted sides lean towards each other."
                  - "One pair of parallel sides: a trapezium."
              - id: l2-f3
                type: multiple_choice
                text: "A quadrilateral has four equal sides and no right angles. What is it?"
                options: ["rhombus", "rectangle", "trapezium"]
                answer: "rhombus"
                hints:
                  - "Which shape has four equal sides?"
                  - "A square has four equal sides and right angles. Without right angles it is ..."
                  - "A rhombus."
              - id: l2-f4
                type: multiple_choice
                text: "What is this quadrilateral called?"
                show: { drawn: grid, cols: 4, rows: 6, lines: [[2, 0, 4, 2], [4, 2, 2, 6], [2, 6, 0, 2], [0, 2, 2, 0]] }
                options: ["kite", "rhombus", "trapezium"]
                answer: "kite"
                hints:
                  - "Compare the top sides with the bottom sides."
                  - "The two top sides are short, the two bottom sides are long."
                  - "Two pairs of equal sides next to each other: a kite."
              - id: l2-f5
                type: true_false
                text: "Is it true? A trapezium has two pairs of parallel sides."
                answer: false
                hints:
                  - "Which quadrilateral has two pairs of parallel sides?"
                  - "A parallelogram has two pairs."
                  - "No. A trapezium has only one pair."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What is this quadrilateral called?"
                show: { drawn: grid, cols: 8, rows: 4, lines: [[0, 4, 5, 4], [5, 4, 8, 0], [8, 0, 3, 0], [3, 0, 0, 4]] }
                options: ["rhombus", "trapezium", "kite"]
                answer: "rhombus"
                hints: ["Each slanted side is as long as the 5 squares along the bottom."]
              - id: l2-s2
                type: multiple_choice
                text: "What is this quadrilateral called?"
                show: { drawn: grid, cols: 6, rows: 4, lines: [[0, 1, 6, 1], [6, 1, 6, 4], [6, 4, 0, 4], [0, 4, 0, 1]] }
                options: ["rectangle", "square", "rhombus"]
                answer: "rectangle"
                hints: ["Four right angles. Are all the sides equal?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which quadrilateral has only one pair of parallel sides?"
                options: ["trapezium", "parallelogram", "rectangle"]
                answer: "trapezium"
                hints: ["A parallelogram and a rectangle both have two pairs."]
              - id: l2-s4
                type: matching
                text: "Match each quadrilateral with what it has."
                pairs:
                  - { left: { text: "rectangle" }, right: { text: "4 right angles, sides not all equal" } }
                  - { left: { text: "rhombus" }, right: { text: "4 equal sides, no right angles" } }
                  - { left: { text: "trapezium" }, right: { text: "only 1 pair of parallel sides" } }
                  - { left: { text: "kite" }, right: { text: "2 pairs of equal sides next to each other" } }
                hints: ["Start with the one you are sure of."]
              - id: l2-s5
                type: multiple_choice
                text: "What is this quadrilateral called?"
                show: { drawn: grid, cols: 5, rows: 4, lines: [[0, 0, 3, 0], [3, 0, 5, 4], [5, 4, 0, 4], [0, 4, 0, 0]] }
                options: ["trapezium", "rectangle", "parallelogram"]
                answer: "trapezium"
                hints: ["It has right angles on the left, but how many pairs of sides are parallel?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What is this quadrilateral called?"
                show: { drawn: grid, cols: 6, rows: 3, lines: [[0, 3, 5, 3], [5, 3, 6, 0], [6, 0, 1, 0], [1, 0, 0, 3]] }
                options: ["parallelogram", "rhombus", "trapezium"]
                answer: "parallelogram"
              - id: l2-n2
                type: multiple_choice
                text: "What is this quadrilateral called?"
                show: { drawn: grid, cols: 6, rows: 7, lines: [[3, 0, 5, 2], [5, 2, 3, 7], [3, 7, 1, 2], [1, 2, 3, 0]] }
                options: ["kite", "rhombus", "parallelogram"]
                answer: "kite"
              - id: l2-n3
                type: multiple_choice
                text: "A quadrilateral has four right angles and four equal sides. What is it?"
                options: ["square", "kite", "trapezium"]
                answer: "square"
              - id: l2-n4
                type: true_false
                text: "Is it true? A rhombus has four equal sides."
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Which shape is a trapezium?"
                options:
                  - { drawn: grid, cols: 7, rows: 4, lines: [[0, 4, 7, 4], [7, 4, 5, 0], [5, 0, 2, 0], [2, 0, 0, 4]], key: trapezium }
                  - { drawn: grid, cols: 7, rows: 4, lines: [[0, 4, 6, 4], [6, 4, 7, 0], [7, 0, 1, 0], [1, 0, 0, 4]], key: parallelogram }
                  - { drawn: grid, cols: 8, rows: 4, lines: [[0, 4, 5, 4], [5, 4, 8, 0], [8, 0, 3, 0], [3, 0, 0, 4]], key: rhombus }
                answer: trapezium

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What is this quadrilateral called?"
            show: { drawn: grid, cols: 9, rows: 3, lines: [[0, 3, 5, 3], [5, 3, 9, 0], [9, 0, 4, 0], [4, 0, 0, 3]] }
            options: ["rhombus", "kite", "trapezium"]
            answer: "rhombus"
          - id: l2-c2
            type: multiple_choice
            text: "What is this quadrilateral called?"
            show: { drawn: grid, cols: 5, rows: 3, lines: [[1, 0, 4, 0], [4, 0, 5, 3], [5, 3, 0, 3], [0, 3, 1, 0]] }
            options: ["trapezium", "parallelogram", "rectangle"]
            answer: "trapezium"
          - id: l2-c3
            type: true_false
            text: "Is it true? A kite has two pairs of parallel sides."
            answer: false
          - id: l2-c4
            type: multiple_choice
            text: "A quadrilateral has four right angles, and its sides are not all equal. What is it?"
            options: ["rectangle", "kite", "trapezium"]
            answer: "rectangle"
          - id: l2-c5
            type: image_multiple_choice
            text: "Which shape is a kite?"
            options:
              - { drawn: grid, cols: 4, rows: 5, lines: [[2, 0, 4, 2], [4, 2, 2, 5], [2, 5, 0, 2], [0, 2, 2, 0]], key: kite }
              - { drawn: grid, cols: 6, rows: 3, lines: [[0, 3, 4, 3], [4, 3, 6, 0], [6, 0, 2, 0], [2, 0, 0, 3]], key: parallelogram }
              - { drawn: grid, cols: 6, rows: 3, lines: [[2, 0, 4, 0], [4, 0, 6, 3], [6, 3, 0, 3], [0, 3, 2, 0]], key: trapezium }
            answer: kite
          - id: l2-c6
            type: true_false
            text: "Is it true? A parallelogram has two pairs of parallel sides."
            answer: true

  - n: 3
    title: { de: Regelmäßig oder unregelmäßig, en: Regular or irregular }
    goal:
      de: "Unterscheide regelmäßige und unregelmäßige Vielecke. Ein Quadrat hat gleiche Seiten und gleiche Winkel, also ist es regelmäßig."
      en: "Tell regular shapes from irregular ones. A square has equal sides and equal angles, so it is regular."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Which quadrilateral has four equal sides and no right angles?"
            options: ["rhombus", "kite", "rectangle"]
            answer: "rhombus"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "What is this quadrilateral called?"
            show: { drawn: grid, cols: 7, rows: 4, lines: [[0, 4, 7, 4], [7, 4, 5, 0], [5, 0, 2, 0], [2, 0, 0, 4]] }
            options: ["trapezium", "kite", "rhombus"]
            answer: "trapezium"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Regular: all sides equal and all angles equal"
            say: "A polygon is a flat shape with straight sides. A regular polygon has all its sides the same length and all its angles the same size. This hexagon is regular."
            show: { drawn: shape, kind: hexagon, colour: blue }
          - text: "Irregular: the sides or the angles are not all equal"
            say: "This shape has six sides, so it is a hexagon too. But its sides are not all the same length, so it is an irregular hexagon."
            show: { drawn: grid, cols: 4, rows: 5, lines: [[0, 0, 4, 0], [4, 0, 4, 2], [4, 2, 2, 2], [2, 2, 2, 5], [2, 5, 0, 5], [0, 5, 0, 0]] }
          - text: "Square: regular\nRectangle: irregular"
            say: "A square has equal sides and equal angles, so it is a regular quadrilateral. A rectangle has equal angles, but its sides are not all equal, so it is irregular. An equilateral triangle is a regular triangle."
            show: { drawn: grid, cols: 6, rows: 4, lines: [[0, 1, 6, 1], [6, 1, 6, 4], [6, 4, 0, 4], [0, 4, 0, 1]] }
          - text: "Rhombus: equal sides, angles not equal, so irregular"
            say: "Equal sides are not enough. A rhombus has four equal sides, but two of its angles are wider than the other two, so it is irregular."
            show: { drawn: grid, cols: 8, rows: 4, lines: [[0, 4, 5, 4], [5, 4, 8, 0], [8, 0, 3, 0], [3, 0, 0, 4]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Is this octagon regular or irregular?"
                show: { drawn: shape, kind: octagon, colour: green }
                options: ["regular", "irregular"]
                keep_order: true
                answer: "regular"
                hints:
                  - "Are all the sides the same length?"
                  - "All eight sides are equal, and all the angles look the same."
                  - "Regular."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "Is this rectangle regular or irregular?"
                show: { drawn: grid, cols: 6, rows: 4, lines: [[0, 1, 6, 1], [6, 1, 6, 4], [6, 4, 0, 4], [0, 4, 0, 1]] }
                options: ["regular", "irregular"]
                keep_order: true
                answer: "irregular"
                feedback:
                  "regular": "Its angles are all right angles, but the long sides are 6 squares and the short sides 3. The sides must be equal too."
                hints:
                  - "Check the angles, then the sides."
                  - "The angles are equal. Count the squares along each side."
                  - "The sides are not all equal: irregular."
              - id: l3-f3
                type: image_multiple_choice
                text: "Which shape is a regular polygon?"
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: grid, cols: 6, rows: 4, lines: [[0, 1, 6, 1], [6, 1, 6, 4], [6, 4, 0, 4], [0, 4, 0, 1]], key: rectangle }
                  - { drawn: grid, cols: 4, rows: 5, lines: [[0, 0, 4, 0], [4, 0, 4, 2], [4, 2, 2, 2], [2, 2, 2, 5], [2, 5, 0, 5], [0, 5, 0, 0]], key: l-hexagon }
                answer: square
                hints:
                  - "Look for equal sides and equal angles."
                  - "The rectangle has unequal sides. The six-sided shape has unequal sides too."
                  - "The square."
              - id: l3-f4
                type: multiple_choice
                text: "What makes a polygon regular?"
                options: ["All sides equal and all angles equal.", "All sides equal.", "It has four sides."]
                answer: "All sides equal and all angles equal."
                hints:
                  - "Think of the rhombus. Its sides are equal. Is it regular?"
                  - "A rhombus is irregular, so equal sides are not enough."
                  - "All sides and all angles equal."
              - id: l3-f5
                type: true_false
                text: "Is it true? This rhombus is a regular polygon."
                show: { drawn: grid, cols: 8, rows: 4, lines: [[0, 4, 5, 4], [5, 4, 8, 0], [8, 0, 3, 0], [3, 0, 0, 4]] }
                answer: false
                hints:
                  - "Its sides are equal. Are its angles?"
                  - "Two angles are wide and two are narrow."
                  - "No. A rhombus is irregular."

          - support: some
            tasks:
              - id: l3-s1
                type: multiple_choice
                text: "Is this pentagon regular or irregular?"
                show: { drawn: shape, kind: pentagon, colour: orange }
                options: ["regular", "irregular"]
                keep_order: true
                answer: "regular"
                hints: ["Are all the sides and angles the same?"]
              - id: l3-s2
                type: multiple_choice
                text: "Is this pentagon regular or irregular?"
                show: { drawn: grid, cols: 6, rows: 5, lines: [[0, 2, 3, 0], [3, 0, 6, 2], [6, 2, 6, 5], [6, 5, 0, 5], [0, 5, 0, 2]] }
                options: ["regular", "irregular"]
                keep_order: true
                answer: "irregular"
                hints: ["Compare the bottom side with the short upright sides."]
              - id: l3-s3
                type: multiple_choice
                text: "A triangle is regular. What kind of triangle is it?"
                options: ["equilateral", "isosceles", "right-angled"]
                answer: "equilateral"
                hints: ["All three sides must be equal."]
              - id: l3-s4
                type: multiple_choice
                text: "Which of these is irregular?"
                options: ["a square", "an equilateral triangle", "a rectangle"]
                answer: "a rectangle"
                hints: ["Which one has sides that are not all equal?"]
              - id: l3-s5
                type: true_false
                text: "Is it true? Every square is a regular polygon."
                answer: true
                hints: ["A square has equal sides and four right angles."]

          - support: none
            tasks:
              - id: l3-n1
                type: multiple_choice
                text: "Is this hexagon regular or irregular?"
                show: { drawn: grid, cols: 4, rows: 5, lines: [[0, 0, 4, 0], [4, 0, 4, 2], [4, 2, 2, 2], [2, 2, 2, 5], [2, 5, 0, 5], [0, 5, 0, 0]] }
                options: ["regular", "irregular"]
                keep_order: true
                answer: "irregular"
              - id: l3-n2
                type: multiple_choice
                text: "Which quadrilateral is regular?"
                options: ["square", "rhombus", "rectangle"]
                answer: "square"
              - id: l3-n3
                type: multiple_choice
                text: "Is this triangle regular or irregular?"
                show: { drawn: grid, cols: 6, rows: 6, lines: [[0, 6, 6, 6], [6, 6, 3, 0], [3, 0, 0, 6]] }
                options: ["regular", "irregular"]
                keep_order: true
                answer: "irregular"
              - id: l3-n4
                type: multiple_choice
                text: "I have 4 sides. Only one pair of my sides is parallel. What am I?"
                options: ["a trapezium", "a kite", "a rhombus"]
                answer: "a trapezium"
              - id: l3-n5
                type: multiple_choice
                text: "I have 3 sides and one right angle. What am I?"
                options: ["a right-angled triangle", "an equilateral triangle", "a kite"]
                answer: "a right-angled triangle"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l3-c1
            part: triangles
            type: multiple_choice
            text: "What kind of triangle is this?"
            show: { drawn: grid, cols: 4, rows: 5, lines: [[0, 5, 4, 5], [4, 5, 2, 0], [2, 0, 0, 5]] }
            options: ["isosceles", "scalene", "equilateral"]
            answer: "isosceles"
          - id: l3-c2
            part: triangles
            type: multiple_choice
            text: "What kind of triangle is this?"
            show: { drawn: grid, cols: 5, rows: 4, lines: [[0, 4, 0, 0], [0, 0, 5, 4], [5, 4, 0, 4]] }
            options: ["right-angled", "equilateral", "isosceles"]
            answer: "right-angled"
          - id: l3-c3
            part: quadrilaterals
            type: multiple_choice
            text: "What is this quadrilateral called?"
            show: { drawn: grid, cols: 8, rows: 3, lines: [[0, 3, 6, 3], [6, 3, 8, 0], [8, 0, 2, 0], [2, 0, 0, 3]] }
            options: ["parallelogram", "rhombus", "kite"]
            answer: "parallelogram"
          - id: l3-c4
            part: properties
            type: multiple_choice
            text: "A quadrilateral has two pairs of equal sides next to each other and no parallel sides. What is it?"
            options: ["kite", "parallelogram", "rectangle"]
            answer: "kite"
          - id: l3-c5
            part: regular
            type: image_multiple_choice
            text: "Which shape is a regular polygon?"
            options:
              - { drawn: shape, kind: hexagon, colour: blue }
              - { drawn: grid, cols: 8, rows: 4, lines: [[0, 4, 5, 4], [5, 4, 8, 0], [8, 0, 3, 0], [3, 0, 0, 4]], key: rhombus }
              - { drawn: grid, cols: 6, rows: 5, lines: [[0, 2, 3, 0], [3, 0, 6, 2], [6, 2, 6, 5], [6, 5, 0, 5], [0, 5, 0, 2]], key: house }
            answer: hexagon
          - id: l3-c6
            part: triangles
            type: multiple_choice
            text: "What kind of triangle is this?"
            show: { drawn: grid, cols: 5, rows: 3, lines: [[0, 0, 5, 0], [5, 0, 2, 3], [2, 3, 0, 0]] }
            options: ["scalene", "isosceles", "equilateral"]
            answer: "scalene"
          - id: l3-c7
            part: properties
            type: true_false
            text: "Is it true? A triangle with sides of 6 cm, 7 cm and 6 cm is scalene."
            answer: false
          - id: l3-c8
            part: triangles
            type: image_multiple_choice
            text: "Which triangle has a right angle?"
            options:
              - { drawn: grid, cols: 4, rows: 3, lines: [[0, 0, 4, 0], [4, 0, 4, 3], [4, 3, 0, 0]], key: right }
              - { drawn: grid, cols: 4, rows: 4, lines: [[0, 4, 4, 4], [4, 4, 2, 0], [2, 0, 0, 4]], key: iso }
              - { drawn: grid, cols: 6, rows: 3, lines: [[0, 3, 6, 3], [6, 3, 1, 0], [1, 0, 0, 3]], key: scalene }
            answer: right
          - id: l3-c9
            part: triangles
            type: true_false
            text: "Is it true? This triangle is isosceles."
            show: { drawn: grid, cols: 3, rows: 3, lines: [[0, 0, 0, 3], [0, 3, 3, 3], [3, 3, 0, 0]] }
            answer: true
          - id: l3-c10
            part: quadrilaterals
            type: multiple_choice
            text: "What is this quadrilateral called?"
            show: { drawn: grid, cols: 6, rows: 7, lines: [[3, 7, 5, 5], [5, 5, 3, 0], [3, 0, 1, 5], [1, 5, 3, 7]] }
            options: ["kite", "rhombus", "trapezium"]
            answer: "kite"
          - id: l3-c11
            part: quadrilaterals
            type: multiple_choice
            text: "What is this quadrilateral called?"
            show: { drawn: grid, cols: 6, rows: 3, lines: [[0, 0, 6, 0], [6, 0, 6, 3], [6, 3, 2, 3], [2, 3, 0, 0]] }
            options: ["trapezium", "kite", "rhombus"]
            answer: "trapezium"
          - id: l3-c12
            part: quadrilaterals
            type: image_multiple_choice
            text: "Which shape is a rhombus?"
            options:
              - { drawn: grid, cols: 8, rows: 6, lines: [[0, 3, 4, 0], [4, 0, 8, 3], [8, 3, 4, 6], [4, 6, 0, 3]], key: rhombus }
              - { drawn: grid, cols: 7, rows: 3, lines: [[0, 3, 5, 3], [5, 3, 7, 0], [7, 0, 2, 0], [2, 0, 0, 3]], key: parallelogram }
              - { drawn: grid, cols: 4, rows: 5, lines: [[2, 0, 4, 1], [4, 1, 2, 5], [2, 5, 0, 1], [0, 1, 2, 0]], key: kite }
            answer: rhombus
          - id: l3-c13
            part: quadrilaterals
            type: true_false
            text: "Is it true? This quadrilateral is a parallelogram."
            show: { drawn: grid, cols: 7, rows: 3, lines: [[2, 0, 5, 0], [5, 0, 7, 3], [7, 3, 0, 3], [0, 3, 2, 0]] }
            answer: false
          - id: l3-c14
            part: regular
            type: multiple_choice
            text: "Is this hexagon regular or irregular?"
            show: { drawn: grid, cols: 5, rows: 4, lines: [[1, 0, 4, 0], [4, 0, 5, 2], [5, 2, 4, 4], [4, 4, 1, 4], [1, 4, 0, 2], [0, 2, 1, 0]] }
            options: ["regular", "irregular"]
            keep_order: true
            answer: "irregular"
          - id: l3-c15
            part: regular
            type: multiple_choice
            text: "Is this square regular or irregular?"
            show: { drawn: grid, cols: 5, rows: 5, lines: [[1, 1, 4, 1], [4, 1, 4, 4], [4, 4, 1, 4], [1, 4, 1, 1]] }
            options: ["regular", "irregular"]
            keep_order: true
            answer: "regular"
          - id: l3-c16
            part: regular
            type: true_false
            text: "Is it true? A polygon with all its sides equal is always regular."
            answer: false
          - id: l3-c17
            part: regular
            type: image_multiple_choice
            text: "Which shape is an irregular polygon?"
            options:
              - { drawn: shape, kind: pentagon, colour: green }
              - { drawn: shape, kind: octagon, colour: green }
              - { drawn: grid, cols: 5, rows: 2, lines: [[0, 0, 5, 0], [5, 0, 5, 2], [5, 2, 0, 2], [0, 2, 0, 0]], key: rectangle }
            answer: rectangle
          - id: l3-c18
            part: properties
            type: multiple_choice
            text: "I have 4 sides. Both pairs of my opposite sides are parallel. My sides are not all equal and I have no right angles. What am I?"
            options: ["a parallelogram", "a rhombus", "a trapezium"]
            answer: "a parallelogram"
          - id: l3-c19
            part: properties
            type: sorting
            text: "Sort the shapes: how many pairs of parallel sides do they have?"
            bins:
              - { id: one, show: { text: "only 1 pair" }, say: "Only one pair." }
              - { id: two, show: { text: "2 pairs" }, say: "Two pairs." }
            options:
              - { text: "trapezium", bin: one }
              - { text: "rectangle", bin: two }
              - { text: "rhombus", bin: two }
              - { text: "parallelogram", bin: two }
          - id: l3-c20
            part: properties
            type: true_false
            text: "Is it true? A rhombus has two pairs of parallel sides."
            answer: true
