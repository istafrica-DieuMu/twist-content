# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.first-quadrant
skill: math.coordinates.first-quadrant
curriculum: en-GB
language: en
title:
  de: Koordinaten im ersten Quadranten
  en: Coordinates in the first quadrant
summary: >
  Lesson 1 reads the position of a point as coordinates (x, y) in the
  first quadrant, along first and then up ("along the corridor, then up
  the stairs"), including points on the axes and the origin. Lesson 2
  plots points by tapping the crossing on the grid (point_on_grid), joins
  points to make polygons, finds the missing vertex of a square or
  rectangle, and ends with the skill check. In lesson 1 the child also
  taps the point at given coordinates among labelled points.
metadata:
  year: year-4
  topic: { de: Koordinaten, en: Coordinates }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.space.plans-maps]
  also_practises: [math.space.plans-maps]
  vocabulary: { en: [coordinates, x-axis, y-axis, origin, point, plot, vertex, vertices, polygon, along, up] }
  forms: [text, audio, drawn]
  drawn: [coordinates, table]
  facets: []
  parts:
    - { id: read, what: { de: die Koordinaten eines Punktes angeben, en: giving the coordinates of a point } }
    - { id: plot, what: { de: einen Punkt eintragen, en: plotting a point } }
    - { id: axes, what: { de: Punkte auf den Achsen und den Ursprung angeben, en: points on the axes and the origin } }
    - { id: polygons, what: { de: Punkte zu Vielecken verbinden und eine fehlende Ecke finden, en: joining points to make polygons and finding a missing vertex } }
  misconceptions:
    - id: swap-x-y
      what: Reads or plots up first and along second, so writes (1, 4) for the point (4, 1)
      addressed: lesson 1 Learn says along the corridor, then up the stairs, and shows (2, 4) and (4, 2); l1-f1 and l1-f3 have feedback on the swapped point, l2-f1 has feedback on a tap at (5, 3); every stage offers the swapped pair or gives feedback on it
    - id: axis-zero
      what: Is unsure about points on an axis and the origin, and puts (0, 5) on the x-axis
      addressed: lesson 1 Learn puts (0, 3) on the y-axis and (5, 0) on the x-axis; l1-f4, l1-s3, l1-n4, l2-s4 and l2-n1 use a zero coordinate
    - id: missing-vertex
      what: Finds the missing vertex of a square or rectangle by copying a known vertex or swapping its coordinates
      addressed: lesson 2 Learn finds the fourth vertex from the two sides it shares; l2-s2, l2-s5, l2-n5 and l2-c4 offer a swapped or copied vertex; l2-f3 and l2-n2 have the child tap it, with feedback on a miscounted or swapped vertex
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Koordinaten ablesen, en: Reading coordinates }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is in square B3?"
            show: { drawn: table, sheet: true, header: false, rows: [["", "tree", ""], ["shop", "", "pond"], ["", "bench", "gate"]] }
            options: ["bench", "gate", "shop"]
            answer: "bench"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "In a grid reference like C2, what comes first?"
            options: ["the letter of the column", "the number of the row"]
            answer: "the letter of the column"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A is at (3, 2): 3 along, then 2 up."
            say: "This grid has two numbered axes. The x-axis goes along the bottom, the y-axis goes up the side. They meet at zero, the origin. To find point A, start at the origin. Go three along, then two up. We write its coordinates in brackets: three, two."
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[3, 2, "A"]] }
          - text: "Along the corridor, then up the stairs: (2, 4) is not (4, 2)."
            say: "The first number is always along, the second is up. Remember: along the corridor, then up the stairs. B is at two, four. C is at four, two. Same numbers, different order, different points."
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[2, 4, "B"], [4, 2, "C"]] }
          - text: "D (0, 3) is on the y-axis. E (5, 0) is on the x-axis."
            say: "A zero means you do not move that way. D is at zero, three: no steps along, three up, so it sits on the y-axis. E is at five, zero: five along and no steps up, so it sits on the x-axis. The origin is zero, zero."
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[0, 3, "D"], [5, 0, "E"]] }
          - text: "Join (1, 1), (5, 1), (5, 4) and (1, 4): a rectangle."
            say: "Points can be the vertices of a shape. Join one, one to five, one, then to five, four, then to one, four, and back. You have drawn a rectangle."
            show: { drawn: coordinates, quadrants: 1, max: 6, shape: [[1, 1], [5, 1], [5, 4], [1, 4]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What are the coordinates of A?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[4, 1, "A"]] }
                options: ["(4, 1)", "(1, 4)", "(4, 4)"]
                answer: "(4, 1)"
                feedback:
                  "(1, 4)": "That is up first. Along the corridor first: 4 along, then 1 up."
                hints:
                  - "Start at the origin. How far along is A?"
                  - "A is 4 along and 1 up."
                  - "Along first, so (4, 1)."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What are the coordinates of B?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[2, 5, "B"]] }
                options: ["(2, 5)", "(5, 2)", "(2, 4)"]
                answer: "(2, 5)"
                hints:
                  - "Read the x-axis first, under the point."
                  - "B is 2 along and 5 up."
                  - "(2, 5)."
              - id: l1-f3
                type: point_on_grid
                text: "Tap the point at (3, 1)."
                say: "Tap the point at three, one."
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[1, 3, "A"], [3, 1, "B"], [3, 3, "C"]] }
                answer: [3, 1]
                feedback:
                  "1,3": "A is at (1, 3): 1 along and 3 up. For (3, 1) go 3 along first, then 1 up."
                hints:
                  - "The first number tells you how far along."
                  - "Go 3 along, then 1 up."
                  - "Tap point B: 3 along and 1 up."
              - id: l1-f4
                type: multiple_choice
                text: "What are the coordinates of D?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[0, 4, "D"]] }
                options: ["(0, 4)", "(4, 0)", "(4, 4)"]
                answer: "(0, 4)"
                hints:
                  - "D is on the y-axis. How far along is that?"
                  - "0 along, then 4 up."
                  - "(0, 4)."
              - id: l1-f5
                type: true_false
                text: "E is at (2, 5)."
                say: "Is it true? E is at two, five."
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[5, 2, "E"]] }
                answer: false
                hints:
                  - "How far along is E?"
                  - "E is 5 along and 2 up."
                  - "No. E is at (5, 2)."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What are the coordinates of F?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[6, 3, "F"]] }
                options: ["(6, 3)", "(3, 6)", "(6, 2)"]
                answer: "(6, 3)"
                hints: ["Along first, then up."]
              - id: l1-s2
                type: point_on_grid
                text: "Tap the point at (5, 4)."
                say: "Tap the point at five, four."
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[2, 2, "A"], [4, 5, "B"], [5, 4, "C"]] }
                answer: [5, 4]
                feedback:
                  "4,5": "B is at (4, 5): 4 along. For (5, 4) go 5 along first, then 4 up."
                hints: ["Go 5 along first."]
              - id: l1-s3
                type: true_false
                text: "G is at (3, 0)."
                say: "Is it true? G is at three, zero."
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[3, 0, "G"]] }
                answer: true
                hints: ["G is on the x-axis, so it is no steps up."]
              - id: l1-s4
                type: multiple_choice
                text: "What are the coordinates of H?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[1, 5, "H"]] }
                options: ["(1, 5)", "(5, 1)", "(1, 4)"]
                answer: "(1, 5)"
                hints: ["How far along is H from the origin?"]
              - id: l1-s5
                type: multiple_choice
                text: "A point is 4 along and 2 up. How do you write its coordinates?"
                options: ["(4, 2)", "(2, 4)", "(6, 2)"]
                answer: "(4, 2)"
                hints: ["The along number comes first."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What are the coordinates of P?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[5, 1, "P"]] }
                options: ["(5, 1)", "(1, 5)", "(5, 0)"]
                answer: "(5, 1)"
              - id: l1-n2
                type: point_on_grid
                text: "Tap the point at (6, 2)."
                say: "Tap the point at six, two."
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[2, 6, "A"], [6, 2, "B"], [2, 2, "C"]] }
                answer: [6, 2]
                feedback:
                  "2,6": "A is at (2, 6): 2 along. For (6, 2) go 6 along first, then 2 up."
              - id: l1-n3
                type: true_false
                text: "Q is at (4, 4)."
                say: "Is it true? Q is at four, four."
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[4, 4, "Q"]] }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "What are the coordinates of the origin O?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[0, 0, "O"]] }
                options: ["(0, 0)", "(1, 1)", "(0, 1)"]
                answer: "(0, 0)"
              - id: l1-n5
                type: multiple_choice
                text: "R is at (3, 5) and S is at (5, 3). Which point is higher up?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[3, 5, "R"], [5, 3, "S"]] }
                options: ["R", "S"]
                answer: "R"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What are the coordinates of A?"
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[2, 3, "A"]] }
            options: ["(2, 3)", "(3, 2)", "(2, 2)"]
            answer: "(2, 3)"
          - id: l1-c2
            type: point_on_grid
            text: "Tap the point at (2, 4)."
            say: "Tap the point at two, four."
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[4, 2, "A"], [2, 4, "B"], [4, 4, "C"]] }
            answer: [2, 4]
            feedback:
              "4,2": "A is at (4, 2): 4 along. For (2, 4) go 2 along first, then 4 up."
          - id: l1-c3
            type: true_false
            text: "T is at (1, 6)."
            say: "Is it true? T is at one, six."
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[6, 1, "T"]] }
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "What are the coordinates of U?"
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[2, 0, "U"]] }
            options: ["(2, 0)", "(0, 2)", "(2, 2)"]
            answer: "(2, 0)"
          - id: l1-c5
            type: point_on_grid
            text: "Tap the point at (1, 5)."
            say: "Tap the point at one, five."
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[5, 1, "A"], [1, 5, "B"], [5, 5, "C"]] }
            answer: [1, 5]
            feedback:
              "5,1": "A is at (5, 1): 5 along. For (1, 5) go 1 along first, then 5 up."
          - id: l1-c6
            type: true_false
            text: "V is at (4, 3)."
            say: "Is it true? V is at four, three."
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[4, 3, "V"]] }
            answer: true

  - n: 2
    title: { de: Punkte eintragen und Vielecke zeichnen, en: Plotting points and drawing polygons }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What are the coordinates of A?"
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[3, 4, "A"]] }
            options: ["(3, 4)", "(4, 3)", "(3, 3)"]
            answer: "(3, 4)"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which point is at (2, 1)?"
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[1, 2, "A"], [2, 1, "B"]] }
            options: ["A", "B"]
            answer: "B"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "To plot (2, 3): 2 along, 3 up, mark the point."
            say: "To plot a point, start at the origin. For two, three, go two along the x-axis, then three up. Mark the point where you stop."
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[2, 3, "P"]] }
          - text: "Plot (1, 1), (4, 1), (4, 3) and (1, 3), then join them: a rectangle."
            say: "Plot one, one, then four, one, then four, three, then one, three. Join them in order and back to the start. The shape is a rectangle, three squares long and two squares tall."
            show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [4, 1], [4, 3], [1, 3]] }
          - text: "A (2, 1), B (5, 1) and C (5, 4) are vertices of a square. The fourth vertex is (2, 4)."
            say: "Here are three vertices of a square. The missing vertex is above A and level with C. Above A means the same along number as A: two. Level with C means the same up number as C: four. The fourth vertex is two, four."
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[2, 1, "A"], [5, 1, "B"], [5, 4, "C"]] }
          - text: "Join (1, 1), (5, 1) and (3, 4): a triangle."
            say: "Three points joined up make a triangle. Join one, one to five, one, then up to three, four, and back to one, one."
            show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [5, 1], [3, 4]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: point_on_grid
                text: "Plot the point (3, 5)."
                say: "Plot the point three, five. Tap where it goes."
                show: { drawn: coordinates, quadrants: 1, max: 6 }
                answer: [3, 5]
                feedback:
                  "5,3": "That point is at (5, 3): 5 along. For (3, 5) go 3 along first, then 5 up."
                hints:
                  - "Start at the origin and go 3 along first."
                  - "Then go 5 up from there."
                  - "Tap the crossing 3 along and 5 up."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Join A (1, 1), B (5, 1), C (5, 3) and D (1, 3) in order. What shape do you get?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[1, 1, "A"], [5, 1, "B"], [5, 3, "C"], [1, 3, "D"]] }
                options: ["rectangle", "square", "triangle"]
                answer: "rectangle"
                feedback:
                  "square": "The shape is 4 squares long but only 2 squares tall, so its sides are not all equal."
                hints:
                  - "Count how long and how tall the shape is."
                  - "From A to B is 4 along. From B to C is 2 up."
                  - "4 by 2 with right angles: a rectangle."
              - id: l2-f3
                type: point_on_grid
                text: "A, B and C are three vertices of a square. Tap the fourth vertex."
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[1, 1, "A"], [4, 1, "B"], [4, 4, "C"]] }
                answer: [1, 4]
                feedback:
                  "1,3": "That is only 3 up. Level with C means the same up number as C: 4."
                hints:
                  - "The fourth vertex is above A and level with C."
                  - "Above A: the same along number, 1. Level with C: the same up number, 4."
                  - "Tap (1, 4)."
              - id: l2-f4
                type: image_multiple_choice
                text: "Which grid shows the triangle with vertices (1, 1), (5, 1) and (1, 4)?"
                options:
                  - { drawn: coordinates, quadrants: 1, max: 6, shape: [[1, 1], [1, 5], [4, 1]], key: b }
                  - { drawn: coordinates, quadrants: 1, max: 6, shape: [[1, 1], [5, 1], [1, 4]], key: a }
                  - { drawn: coordinates, quadrants: 1, max: 6, shape: [[1, 1], [5, 1], [5, 4]], key: c }
                answer: a
                hints:
                  - "Check each vertex: along first, then up."
                  - "(5, 1) is 5 along on the bottom row. (1, 4) is straight above (1, 1)."
                  - "It is the triangle that goes 5 along the bottom and 3 up the left side."
              - id: l2-f5
                type: true_false
                text: "The points (2, 2), (6, 2), (6, 6) and (2, 6) make a square."
                say: "Is it true? The points two, two; six, two; six, six and two, six make a square."
                answer: true
                hints:
                  - "Find how long and how tall the shape is."
                  - "From 2 to 6 along is 4. From 2 to 6 up is 4."
                  - "Yes. All sides are 4 long, so it is a square."

          - support: some
            tasks:
              - id: l2-s1
                type: point_on_grid
                text: "Plot the point (4, 1)."
                say: "Plot the point four, one. Tap where it goes."
                show: { drawn: coordinates, quadrants: 1, max: 6 }
                answer: [4, 1]
                feedback:
                  "1,4": "That point is at (1, 4): 1 along. For (4, 1) go 4 along first, then 1 up."
                hints: ["4 along, then 1 up."]
              - id: l2-s2
                type: multiple_choice
                text: "A, B and C are three vertices of a rectangle. Where is the fourth vertex?"
                show: { drawn: coordinates, quadrants: 1, max: 8, points: [[2, 1, "A"], [6, 1, "B"], [6, 3, "C"]] }
                options: ["(2, 3)", "(3, 2)", "(6, 2)"]
                answer: "(2, 3)"
                hints: ["It is above A and level with C."]
              - id: l2-s3
                type: multiple_choice
                text: "Join A (1, 1), B (5, 1) and C (3, 5). What shape do you get?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[1, 1, "A"], [5, 1, "B"], [3, 5, "C"]] }
                options: ["triangle", "rectangle", "pentagon"]
                answer: "triangle"
                hints: ["How many points are joined?"]
              - id: l2-s4
                type: true_false
                text: "The point (0, 5) is on the x-axis."
                say: "Is it true? The point zero, five is on the x-axis."
                answer: false
                hints: ["0 along means you do not leave the y-axis."]
              - id: l2-s5
                type: multiple_choice
                text: "A (1, 2), B (3, 2) and C (3, 4) are three vertices of a square. Where is the fourth vertex?"
                show: { drawn: coordinates, quadrants: 1, max: 6, points: [[1, 2, "A"], [3, 2, "B"], [3, 4, "C"]] }
                options: ["(1, 4)", "(4, 1)", "(3, 1)"]
                answer: "(1, 4)"
                hints: ["Same along number as A, same up number as C."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which grid shows the point (0, 3)?"
                options:
                  - { drawn: coordinates, quadrants: 1, max: 6, points: [[0, 3, "P"]], key: a }
                  - { drawn: coordinates, quadrants: 1, max: 6, points: [[3, 0, "P"]], key: b }
                  - { drawn: coordinates, quadrants: 1, max: 6, points: [[3, 3, "P"]], key: c }
                answer: a
              - id: l2-n2
                type: point_on_grid
                text: "A, B and C are three vertices of a square. Tap the fourth vertex."
                show: { drawn: coordinates, quadrants: 1, max: 8, points: [[3, 2, "A"], [6, 2, "B"], [6, 5, "C"]] }
                answer: [3, 5]
                feedback:
                  "5,3": "That is (5, 3), the swapped point. The fourth vertex is above A, so 3 along, and level with C, so 5 up."
              - id: l2-n3
                type: multiple_choice
                text: "What are the coordinates of the top right vertex of this rectangle?"
                show: { drawn: coordinates, quadrants: 1, max: 8, shape: [[1, 1], [6, 1], [6, 4], [1, 4]] }
                options: ["(6, 4)", "(4, 6)", "(6, 1)"]
                answer: "(6, 4)"
              - id: l2-n4
                type: true_false
                text: "The points (1, 1), (4, 1) and (1, 4) make a triangle."
                say: "Is it true? The points one, one; four, one and one, four make a triangle."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "A rectangle has vertices at (2, 2), (7, 2) and (7, 5). Where is the fourth vertex?"
                options: ["(2, 5)", "(5, 2)", "(7, 7)"]
                answer: "(2, 5)"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "What are the coordinates of K?"
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[5, 4, "K"]] }
            options: ["(5, 4)", "(4, 5)", "(5, 5)"]
            answer: "(5, 4)"
          - id: l2-c2
            part: read
            type: multiple_choice
            text: "Which point is at (1, 4)?"
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[4, 1, "A"], [1, 4, "B"], [4, 4, "C"]] }
            options: ["A", "B", "C"]
            answer: "B"
            option_audio: false
          - id: l2-c3
            part: plot
            type: point_on_grid
            text: "Plot the point (2, 6)."
            say: "Plot the point two, six. Tap where it goes."
            show: { drawn: coordinates, quadrants: 1, max: 6 }
            answer: [2, 6]
            feedback:
              "6,2": "That point is at (6, 2): 6 along. For (2, 6) go 2 along first, then 6 up."
          - id: l2-c4
            part: polygons
            type: multiple_choice
            text: "A, B and C are three vertices of a square. Where is the fourth vertex?"
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[2, 3, "A"], [5, 3, "B"], [2, 6, "C"]] }
            options: ["(5, 6)", "(6, 5)", "(3, 6)"]
            answer: "(5, 6)"
          - id: l2-c5
            part: polygons
            type: true_false
            text: "The points (2, 1), (6, 1), (6, 3) and (2, 3) make a square."
            say: "Is it true? The points two, one; six, one; six, three and two, three make a square."
            answer: false
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "What are the coordinates of M?"
            show: { drawn: coordinates, quadrants: 1, max: 6, points: [[6, 5, "M"]] }
            options: ["(6, 5)", "(5, 6)", "(6, 6)"]
            answer: "(6, 5)"
          - id: l2-c7
            part: read
            type: true_false
