# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.symmetry-complete
skill: math.symmetry.complete
curriculum: en-GB
language: en
title:
  de: Symmetrische Figuren ergänzen
  en: Completing symmetrical shapes
summary: >
  Lesson 1 completes patterns of squares on squared paper with a
  vertical mirror line: each square lands the same distance from the
  line on the other side, and a reflection is back to front, not a copy;
  lesson 2 reflects in a horizontal mirror line, reflects shapes drawn
  with lines by reflecting their corners, finds the square in the wrong
  place, and ends with the skill check. The child chooses the completed
  picture or the square where a reflection goes; colouring squares or
  drawing the other half with a ruler waits for a drawing task.
metadata:
  year: year-4
  topic: { de: Symmetrie, en: Symmetry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.symmetry.identify, math.shapes.draw-freehand-ruler]
  also_practises: [math.symmetry.identify]
  vocabulary: { en: [line of symmetry, mirror line, symmetrical, reflect, reflection, complete, vertical, horizontal, squared paper] }
  forms: [drawn, text, audio]
  drawn: [grid]
  facets: []
  parts:
    - { id: place, what: { de: "zeigen, wo das Spiegelbild eines Kästchens liegt", en: showing where the reflection of a square goes } }
    - { id: complete, what: { de: "Figuren an einer senkrechten oder waagerechten Achse ergänzen", en: completing a shape in a vertical or horizontal mirror line } }
    - { id: check, what: { de: "prüfen, ob eine Figur symmetrisch ist, und den Fehler finden", en: "checking whether a shape is symmetrical and finding the mistake" } }
  misconceptions:
    - id: copies-not-mirrors
      what: Copies the half across instead of reflecting it, so the square next to the line ends up at the far edge
      addressed: lesson 1 Learn sets a copied half beside a reflected one; every image task offers the copied half (l1-f1, l1-f5 with feedback, l1-s1, l1-n1, l2-f1, l2-f3, l2-c1, l2-c4); the label tasks put a copy's square as an option (l1-f2 with feedback, l1-s2, l1-n2, l1-c1); l1-f3 and l2-w2 ask whether a copied pattern is symmetrical
    - id: wrong-distance
      what: Puts the reflection the wrong distance from the mirror line, often touching it or one square too far
      addressed: lesson 1 Learn counts the squares between a square and the line on both sides; l1-f2, l1-s2, l1-n2, l2-f2, l2-s2, l2-n2 and l2-c2 ask where a reflection goes; l2-f5, l2-s5, l2-n5 and l2-c5 find a square that is one off
    - id: horizontal-line-sideways
      what: With a horizontal mirror line, puts the top row next to the line or turns the half round sideways
      addressed: lesson 2 Learn reflects downwards row by row; l2-f1 (with feedback), l2-s1, l2-n1 offer the half moved down and turned
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "An einer senkrechten Achse spiegeln", en: "Reflecting in a vertical line" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which letter has a line of symmetry?"
            options: ["A", "F", "G"]
            answer: "A"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? The dashed line is a line of symmetry."
            say: "Look at the red dashed line. Is it true? It is a line of symmetry for this pattern."
            show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[1, 0, blue], [4, 0, blue], [2, 1, red], [3, 1, red]] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Reflect each square in the mirror line."
            say: "The red dashed line is a mirror line. Only the left half of this shape is drawn. To complete it, reflect each square: it lands the same distance from the line, on the other side."
            show: { drawn: grid, cols: 8, rows: 3, axis: 4, cells: [[3, 0, blue], [2, 1, blue], [3, 1, blue], [1, 2, red]] }
          - text: "Same distance, other side"
            say: "The red square has two squares between it and the line. Its reflection has two squares between it and the line on the right. The blue squares that touch the line get partners that touch the line. Now the shape is symmetrical."
            show: { drawn: grid, cols: 8, rows: 3, axis: 4, cells: [[3, 0, blue], [2, 1, blue], [3, 1, blue], [1, 2, red], [4, 0, blue], [4, 1, blue], [5, 1, blue], [6, 2, red]] }
          - text: "Copied, not reflected"
            say: "This one is wrong. The half has been copied across, not reflected. A reflection is back to front, so a square that touches the line on the left still touches the line on the right."
            show: { drawn: grid, cols: 8, rows: 3, axis: 4, cells: [[3, 0, blue], [2, 1, blue], [3, 1, blue], [1, 2, red], [7, 0, blue], [6, 1, blue], [7, 1, blue], [5, 2, red]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which picture completes the symmetrical shape?"
                show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[2, 0, red], [1, 0, red], [2, 1, red]] }
                options:
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[2, 0, red], [1, 0, red], [2, 1, red], [5, 0, red], [4, 0, red], [5, 1, red]], key: copied }
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[2, 0, red], [1, 0, red], [2, 1, red], [3, 0, red], [4, 0, red], [3, 1, red]], key: reflected }
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[2, 0, red], [1, 0, red], [2, 1, red], [3, 1, red], [4, 1, red], [3, 0, red]], key: upside-down }
                answer: reflected
                hints:
                  - "Reflect one square at a time."
                  - "The two squares that touch the line need partners that touch the line."
                  - "On the right: two squares in the top row starting at the line, and one square under the one by the line."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Where does the reflection of the red square go?"
                show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[1, 0, red]], labels: [[5, 0, A], [6, 0, B], [7, 0, C]] }
                options: ["A", "B", "C"]
                answer: "B"
                feedback:
                  "A": "That is where a copy would go. Count the squares between the red square and the line."
                hints:
                  - "Count the squares between the red square and the mirror line."
                  - "There are two squares between it and the line. Its reflection has two squares between it and the line too."
                  - "B."
              - id: l1-f3
                type: true_false
                text: "Is it true? The pattern is symmetrical about the mirror line."
                show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 1, blue], [3, 0, blue], [4, 0, blue], [5, 1, blue]] }
                answer: false
                feedback:
                  "true": "The right half is a copy. The bottom square touches the line on the left, but on the right it is at the far edge."
                hints:
                  - "Find the partner of each square on the left."
                  - "The bottom square on the left touches the line. Does its partner touch the line?"
                  - "No. The right half is copied, not reflected."
              - id: l1-f4
                type: multiple_choice
                text: "How many more squares must you colour to complete the symmetrical shape?"
                show: { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[2, 0, green], [1, 1, green], [2, 1, green], [0, 2, green], [3, 0, green], [3, 1, green]] }
                options: ["2", "4", "6"]
                answer: "2"
                hints:
                  - "Look for the partner of each square on the left."
                  - "The two squares that touch the line already have partners."
                  - "Two partners are missing, so 2."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which picture completes the symmetrical shape?"
                show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[2, 0, red], [0, 1, blue], [1, 1, blue]] }
                options:
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[2, 0, red], [0, 1, blue], [1, 1, blue], [3, 0, red], [5, 1, blue], [4, 1, blue]], key: reflected }
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[2, 0, red], [0, 1, blue], [1, 1, blue], [5, 0, red], [3, 1, blue], [4, 1, blue]], key: copied }
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[2, 0, red], [0, 1, blue], [1, 1, blue], [3, 0, blue], [5, 1, red], [4, 1, red]], key: colours }
                answer: reflected
                feedback:
                  copied: "This half is copied. The red square touches the line, so its reflection touches the line too."
                hints:
                  - "Each square keeps its colour when it is reflected."
                  - "The red square touches the line, so its partner touches the line too."
                  - "The picture with a red square by the line at the top and two blue squares at the right edge below."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which picture completes the symmetrical shape?"
                show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[3, 0, green], [1, 1, green], [2, 1, green], [3, 1, green]] }
                options:
                  - { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[3, 0, green], [1, 1, green], [2, 1, green], [3, 1, green], [7, 0, green], [5, 1, green], [6, 1, green], [7, 1, green]], key: copied }
                  - { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[3, 0, green], [1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [6, 0, green], [5, 0, green], [4, 0, green]], key: upside-down }
                  - { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[3, 0, green], [1, 1, green], [2, 1, green], [3, 1, green], [4, 0, green], [6, 1, green], [5, 1, green], [4, 1, green]], key: reflected }
                answer: reflected
                hints: ["The top square touches the line, so its partner touches the line too."]
              - id: l1-s2
                type: multiple_choice
                text: "Where does the reflection of the red square go?"
                show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[0, 1, red]], labels: [[4, 1, A], [6, 1, B], [7, 1, C]] }
                options: ["A", "B", "C"]
                answer: "C"
                hints: ["There are three squares between the red square and the line."]
              - id: l1-s3
                type: true_false
                text: "Is it true? The pattern is symmetrical about the mirror line."
                show: { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[2, 0, blue], [3, 0, blue], [1, 1, blue], [4, 1, blue], [0, 2, blue], [5, 2, blue]] }
                answer: true
                hints: ["Check each square for a partner the same distance from the line."]
              - id: l1-s4
                type: multiple_choice
                text: "How many more squares must you colour to complete the symmetrical shape?"
                show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[1, 0, red], [2, 0, red], [3, 0, red], [3, 1, red], [4, 0, red]] }
                options: ["1", "3", "4"]
                answer: "3"
                hints: ["Only the top square by the line has its partner."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which picture completes the symmetrical shape?"
                show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[3, 0, red], [2, 0, blue], [1, 1, blue]] }
                options:
                  - { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[3, 0, red], [2, 0, blue], [1, 1, blue], [4, 0, blue], [5, 0, red], [6, 1, red]], key: colours }
                  - { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[3, 0, red], [2, 0, blue], [1, 1, blue], [4, 0, red], [5, 0, blue], [6, 1, blue]], key: reflected }
                  - { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[3, 0, red], [2, 0, blue], [1, 1, blue], [7, 0, red], [6, 0, blue], [5, 1, blue]], key: copied }
                answer: reflected
                hints: ["Each square keeps its colour and its distance from the line."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Which picture completes the symmetrical shape?"
                show: { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[2, 0, purple], [1, 1, purple], [0, 2, purple]] }
                options:
                  - { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[2, 0, purple], [1, 1, purple], [0, 2, purple], [3, 0, purple], [4, 1, purple], [5, 2, purple]], key: reflected }
                  - { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[2, 0, purple], [1, 1, purple], [0, 2, purple], [5, 0, purple], [4, 1, purple], [3, 2, purple]], key: copied }
                  - { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[2, 0, purple], [1, 1, purple], [0, 2, purple], [3, 0, purple], [4, 1, purple], [4, 2, purple]], key: one-off }
                answer: reflected
              - id: l1-n2
                type: multiple_choice
                text: "Where does the reflection of the blue square go?"
                show: { drawn: grid, cols: 8, rows: 3, axis: 4, cells: [[2, 2, blue]], labels: [[4, 2, A], [5, 2, B], [6, 2, C]] }
                options: ["A", "B", "C"]
                answer: "B"
              - id: l1-n3
                type: true_false
                text: "Is it true? The pattern is symmetrical about the mirror line."
                show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[1, 0, green], [3, 1, green], [4, 1, green], [5, 0, green]] }
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "How many squares must you colour to complete the symmetrical shape?"
                show: { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[0, 0, blue], [1, 0, blue], [2, 1, blue], [1, 2, blue], [2, 2, blue]] }
                options: ["3", "5", "10"]
                answer: "5"
              - id: l1-n5
                type: image_multiple_choice
                text: "Which picture completes the symmetrical shape?"
                show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[0, 0, red], [2, 0, blue], [1, 1, red]] }
                options:
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[0, 0, red], [2, 0, blue], [1, 1, red], [3, 0, red], [5, 0, blue], [4, 1, red]], key: copied }
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[0, 0, red], [2, 0, blue], [1, 1, red], [5, 0, blue], [3, 0, red], [4, 1, blue]], key: colours }
                  - { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[0, 0, red], [2, 0, blue], [1, 1, red], [5, 0, red], [3, 0, blue], [4, 1, red]], key: reflected }
                answer: reflected

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Where does the reflection of the red square go?"
            show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[0, 0, red]], labels: [[3, 0, A], [4, 0, B], [5, 0, C]] }
            options: ["A", "B", "C"]
            answer: "C"
          - id: l1-c2
            type: true_false
            text: "Is it true? The pattern is symmetrical about the mirror line."
            show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[2, 0, blue], [5, 0, blue], [3, 1, red], [4, 1, red]] }
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Which picture completes the symmetrical shape?"
            show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[2, 0, green], [3, 0, green], [3, 1, green]] }
            options:
              - { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[2, 0, green], [3, 0, green], [3, 1, green], [5, 1, green], [4, 1, green], [4, 0, green]], key: upside-down }
              - { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[2, 0, green], [3, 0, green], [3, 1, green], [5, 0, green], [4, 0, green], [4, 1, green]], key: reflected }
              - { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[2, 0, green], [3, 0, green], [3, 1, green], [6, 0, green], [7, 0, green], [7, 1, green]], key: copied }
            answer: reflected
          - id: l1-c4
            type: multiple_choice
            text: "Where does the reflection of the blue square go?"
            show: { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[2, 1, blue]], labels: [[3, 1, A], [5, 1, B], [4, 1, C]] }
            options: ["A", "B", "C"]
            answer: "A"
          - id: l1-c5
            type: multiple_choice
            text: "How many more squares must you colour to complete the symmetrical shape?"
            show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [1, 1, red], [3, 0, red]] }
            options: ["3", "4", "5"]
            answer: "3"
          - id: l1-c6
            type: true_false
            text: "Is it true? The pattern is symmetrical about the mirror line."
            show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[0, 1, green], [3, 0, green], [4, 0, green], [4, 1, green]] }
            answer: false

  - n: 2
    title: { de: "Waagerecht spiegeln und Figuren ergänzen", en: "Horizontal lines and outlines" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Where does the reflection of the blue square go?"
            show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[3, 1, blue]], labels: [[4, 1, A], [5, 1, B], [7, 1, C]] }
            options: ["A", "B", "C"]
            answer: "A"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? The pattern is symmetrical about the mirror line."
            show: { drawn: grid, cols: 6, rows: 2, axis: 3, cells: [[1, 0, red], [4, 0, red], [2, 1, red], [4, 1, red]] }
            answer: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A horizontal mirror line"
            say: "A mirror line can go straight across. Now the reflection goes below the line. Each square lands the same distance below the line as it is above it."
            show: { drawn: grid, cols: 6, rows: 4, axis_row: 2, cells: [[1, 0, blue], [2, 1, blue], [3, 1, blue]] }
          - text: "Row by row"
            say: "Work row by row. The squares just above the line get partners just below it. The square two rows above the line gets a partner two rows below it. Left and right stay the same."
            show: { drawn: grid, cols: 6, rows: 4, axis_row: 2, cells: [[1, 0, blue], [2, 1, blue], [3, 1, blue], [2, 2, blue], [3, 2, blue], [1, 3, blue]] }
          - text: "Reflect the corners, then join them."
            say: "To reflect a shape drawn with lines, reflect its corners. The bottom corner is three squares left of the line, so its reflection is three squares right of the line. Then join the corners with a ruler."
            show: { drawn: grid, cols: 8, rows: 4, axis: 4, lines: [[4, 0, 1, 3], [1, 3, 4, 3], [4, 0, 7, 3], [7, 3, 4, 3]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which picture completes the symmetrical shape?"
                show: { drawn: grid, cols: 6, rows: 4, axis_row: 2, cells: [[2, 0, red], [2, 1, red], [3, 1, red]] }
                options:
                  - { drawn: grid, cols: 6, rows: 4, axis_row: 2, cells: [[2, 0, red], [2, 1, red], [3, 1, red], [2, 2, red], [2, 3, red], [3, 3, red]], key: moved-down }
                  - { drawn: grid, cols: 6, rows: 4, axis_row: 2, cells: [[2, 0, red], [2, 1, red], [3, 1, red], [2, 3, red], [2, 2, red], [3, 2, red]], key: reflected }
                  - { drawn: grid, cols: 6, rows: 4, axis_row: 2, cells: [[2, 0, red], [2, 1, red], [3, 1, red], [3, 3, red], [3, 2, red], [2, 2, red]], key: turned }
                answer: reflected
                feedback:
                  moved-down: "This half is moved down, not reflected. The two squares just above the line need partners just below it."
                hints:
                  - "The row just above the line is reflected first."
                  - "Two squares sit just above the line, so two squares sit just below it. Left and right stay the same."
                  - "The picture with two squares just below the line and one square under the left one."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Where does the reflection of the blue square go?"
                show: { drawn: grid, cols: 4, rows: 6, axis_row: 3, cells: [[1, 0, blue]], labels: [[1, 3, A], [1, 4, B], [1, 5, C]] }
                options: ["A", "B", "C"]
                answer: "C"
                hints:
                  - "Count the rows between the blue square and the line."
                  - "There are two rows between it and the line, so two rows between the line and its reflection."
                  - "C."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which picture completes the symmetrical shape?"
                show: { drawn: grid, cols: 8, rows: 4, axis: 4, lines: [[4, 0, 1, 0], [1, 0, 1, 1], [1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 4, 3]] }
                options:
                  - { drawn: grid, cols: 8, rows: 4, axis: 4, lines: [[4, 0, 1, 0], [1, 0, 1, 1], [1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 4, 3], [4, 0, 6, 0], [6, 0, 6, 1], [6, 1, 5, 1], [5, 1, 5, 3], [5, 3, 4, 3]], key: short }
                  - { drawn: grid, cols: 8, rows: 4, axis: 4, lines: [[4, 0, 1, 0], [1, 0, 1, 1], [1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 4, 3], [4, 0, 7, 0], [7, 0, 7, 1], [7, 1, 5, 1], [5, 1, 5, 3], [5, 3, 4, 3]], key: reflected }
                  - { drawn: grid, cols: 8, rows: 4, axis: 4, lines: [[4, 0, 1, 0], [1, 0, 1, 1], [1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 4, 3], [7, 0, 4, 0], [4, 0, 4, 1], [4, 1, 6, 1], [6, 1, 6, 3], [6, 3, 7, 3]], key: copied }
                answer: reflected
                hints:
                  - "Reflect each corner, then join them."
                  - "The top left corner is three squares from the line, so its partner is three squares right of the line."
                  - "The picture that makes a T, with arms the same length on both sides."
              - id: l2-f4
                type: true_false
                text: "Is it true? The pattern is symmetrical about the mirror line."
                show: { drawn: grid, cols: 6, rows: 4, axis_row: 2, cells: [[1, 0, green], [2, 1, green], [4, 1, green], [2, 2, green], [4, 2, green], [1, 3, green]] }
                answer: true
                hints:
                  - "Find the partner below the line for each square above it."
                  - "The squares just above the line have partners just below. The square in the top row has a partner in the bottom row."
                  - "Yes, every square has its partner."
              - id: l2-f5
                type: multiple_choice
                text: "One square on the right is in the wrong place. Which one?"
                show: { drawn: grid, cols: 8, rows: 2, axis: 4, cells: [[1, 0, blue], [2, 1, blue], [3, 0, blue], [4, 0, blue], [5, 1, blue], [5, 0, blue]], labels: [[4, 0, A], [5, 1, B], [5, 0, C]] }
                options: ["A", "B", "C"]
