# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.derive-facts
skill: math.mult-div.derive-facts
curriculum: en-GB
language: en
title:
  de: Schwere Aufgaben aus Kernaufgaben
  en: Harder facts from facts I know
summary: >
  Harder times table facts worked out from the core facts. Lesson 1 uses
  a near fact (9 × 6 is 10 × 6 take away one 6; 6 × 4 is 5 × 4 add one
  more 4) and doubling (4 × 7 is double 2 × 7); lesson 2 splits a fact
  into two core facts (7 × 6 = 5 × 6 + 2 × 6) on an array, and ends with
  the skill check.
metadata:
  year: year-4
  topic: { de: Einmaleins, en: Times tables }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.core-facts, math.numbers-to-100.double-halve]
  also_practises: [math.mult-div.core-facts]
  vocabulary: { en: [near fact, double, split, array, row, core facts, times] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: near-fact-one
      what: Takes away or adds 1 instead of one more group (9 × 6 = 60 − 1 = 59)
      addressed: lesson 1 Learn takes away one whole row of six; l1-f1 (with feedback), l1-s1 and l1-c1 offer the minus-one answer
    - id: split-wrong-part
      what: Splits the number of rows but adds the wrong second fact (7 × 6 = 5 × 6 + 2, not + 2 × 6)
      addressed: lesson 2 Learn colours five rows red and two rows blue and says both parts are rows of six; l2-f1 (with feedback), l2-f3 and l2-s2 offer the answer that adds only 2
    - id: double-wrong-fact
      what: Doubles the answer of a fact that does not help (4 × 7 from double 4 × 2)
      addressed: lesson 1 Learn doubles 2 × 7 to get 4 × 7; l1-f4 asks which fact to double, with feedback
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Nachbaraufgaben und Verdoppeln, en: Near facts and doubling }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "10 × 6 = _"
            say: "Ten times six."
            answer: "60"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Double 14 = _"
            say: "Double fourteen."
            answer: "28"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "9 × 6 = 10 × 6 − 6"
            say: "Nine times six is hard. Ten times six is easy: sixty. Nine sixes are one six fewer, so take away one row of six. Sixty take away six is fifty-four."
            show: { drawn: dots, array: [10, 6], split_rows: 9 }
          - text: "6 × 4 = 5 × 4 + 4"
            say: "Six times four. Five times four is twenty. Six fours are one four more. Twenty add four is twenty-four."
            show: { drawn: dots, array: [6, 4], split_rows: 5 }
          - text: "4 × 7 = double 2 × 7"
            say: "Four times seven. Two times seven is fourteen. Four is double two, so double fourteen. Four times seven is twenty-eight."
            show: { drawn: dots, array: [4, 7], split_rows: 2 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "9 × 5 = 10 × 5 − 5 = _"
                say: "Nine times five. Ten times five is fifty. Take away one five."
                show: { drawn: dots, array: [10, 5], split_rows: 9 }
                options: ["45", "49", "40"]
                answer: "45"
                feedback:
                  "49": "Take away a whole row of five, not just one dot."
                hints:
                  - "Ten fives, then one row of five fewer."
                  - "Fifty take away five."
                  - "45."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "6 × 5 is 5 × 5 and one more 5."
                say: "Six times five. Five times five is twenty-five. Add one more five."
                frame: "6 × 5 = 25 + _ = _"
                options: ["5", "1", "30", "26"]
                answer: ["5", "30"]
                hints:
                  - "Six fives are one five more than five fives."
                  - "Twenty-five add five."
                  - "5 and 30."
              - id: l1-f3
                type: text_input
                text: "4 × 6 = double 2 × 6 = _"
                say: "Four times six. Two times six is twelve. Double it."
                answer: "24"
                hints:
                  - "Four is double two."
                  - "Two times six is twelve. Double twelve."
                  - "24."
              - id: l1-f4
                type: multiple_choice
                text: "Which fact can you double to find 4 × 8?"
                say: "Which fact can you double to find four times eight?"
                options: ["2 × 8", "4 × 2", "2 × 4"]
                answer: "2 × 8"
                feedback:
                  "4 × 2": "Double four times two is sixteen, but four times eight is more. Keep the eight and halve the four."
                hints:
                  - "Keep the eight. Four is double what?"
                  - "Four is double two, so two times eight."
                  - "2 × 8."
              - id: l1-f5
                type: true_false
                text: "Is it true? 9 × 4 = 10 × 4 − 4"
                say: "Nine times four is ten times four take away four. Is that true?"
                answer: true
                hints:
                  - "Nine fours are one four fewer than ten fours."
                  - "Forty take away four is thirty-six, and nine fours are thirty-six."
                  - "Yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "9 × 10 = 90, so 9 × 9 = _"
                say: "Nine times ten is ninety. So what is nine times nine?"
                options: ["81", "89", "80"]
                answer: "81"
                hints: ["Take away one nine."]
              - id: l1-s2
                type: text_input
                text: "6 × 10 = 60, so 6 × 9 = _"
                say: "Six times ten is sixty. So what is six times nine?"
                answer: "54"
                hints: ["Six nines are one six fewer than six tens."]
              - id: l1-s3
                type: text_input
                text: "4 × 9 = double 2 × 9 = _"
                say: "Four times nine. Two times nine is eighteen. Double it."
                answer: "36"
                hints: ["Double eighteen."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 6 × 2 = 5 × 2 + 1"
                say: "Six times two is five times two add one. Is that true?"
                answer: false
                hints: ["One more row of two, not one more dot."]
              - id: l1-s5
                type: multiple_choice
                text: "Which near fact helps with 9 × 7?"
                say: "Which near fact helps you work out nine times seven?"
                options: ["10 × 7", "9 × 1", "2 × 7"]
                answer: "10 × 7"
                hints: ["Nine is one less than which easy number?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "9 × 3 = _"
                say: "Nine times three."
                answer: "27"
              - id: l1-n2
                type: text_input
                text: "6 × 10 = 60. 6 × 9 = 54. 6 × 8 = _"
                say: "Six times ten is sixty. Six times nine is fifty-four. What is six times eight?"
                answer: "48"
              - id: l1-n3
                type: multiple_choice
                text: "4 × 5 = _"
                say: "Four times five."
                options: ["20", "9", "16"]
                answer: "20"
              - id: l1-n4
                type: text_input
                text: "6 × 3 = _"
                say: "Six times three."
                answer: "18"
              - id: l1-n5
                type: true_false
                text: "Is it true? 4 × 8 = 32"
                say: "Four times eight is thirty-two. Is that true?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "9 × 2 = 10 × 2 − 2 = _"
            say: "Nine times two. Ten times two is twenty. Take away one two."
            options: ["18", "19", "16"]
            answer: "18"
          - id: l1-c2
            type: text_input
            text: "6 × 6 = _"
            say: "Six times six."
            answer: "36"
          - id: l1-c3
            type: text_input
            text: "4 × 4 = _"
            say: "Four times four."
            answer: "16"

  - n: 2
    title: { de: In zwei Kernaufgaben zerlegen, en: Split into two facts }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "9 × 6 = _"
            say: "Nine times six."
            answer: "54"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4 × 7 = double 2 × 7 = _"
            say: "Four times seven is double two times seven."
            options: ["28", "14", "24"]
            answer: "28"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 × 6"
            say: "Seven rows of six. Seven times six is not a core fact. Split the seven rows into five and two."
            show: { drawn: dots, array: [7, 6] }
          - text: "7 × 6 = 5 × 6 + 2 × 6"
            say: "Five rows of six are red: thirty. Two rows of six are blue: twelve. Both parts are rows of six."
            show: { drawn: dots, array: [7, 6], split_rows: 5 }
          - text: "30 + 12 = 42"
            say: "Thirty add twelve is forty-two. So seven times six is forty-two."
            show: { drawn: dots, array: [7, 6], split_rows: 5 }
          - text: "8 × 4 = 5 × 4 + 3 × 4 = 20 + 12 = 32"
            say: "Eight times four. Five fours are twenty. Three fours are twelve. Twenty add twelve is thirty-two."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "7 × 4 = 5 × 4 + 2 × 4 = _"
                say: "Seven times four. Five fours and two fours."
                show: { drawn: dots, array: [7, 4], split_rows: 5 }
                options: ["28", "22", "20"]
                answer: "28"
                feedback:
                  "22": "Twenty add two misses that the blue part is two rows of four: eight."
                hints:
                  - "Find the red part, then the blue part."
                  - "Five fours are twenty. Two fours are eight."
                  - "28."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "6 × 7 = 5 × 7 + 1 × 7"
                say: "Six times seven. Five sevens and one seven. Fill the gaps."
                frame: "6 × 7 = _ + _ = _"
                options: ["35", "7", "42", "36"]
                answer: ["35", "7", "42"]
                hints:
                  - "Five sevens first."
                  - "Five sevens are thirty-five, and one seven is seven."
                  - "35 + 7 = 42."
              - id: l2-f3
                type: multiple_choice
                text: "Which split works for 8 × 3?"
                say: "Which split works for eight times three?"
                show: { drawn: dots, array: [8, 3], split_rows: 5 }
                options: ["5 × 3 + 3 × 3", "5 × 3 + 3", "8 × 2 + 3"]
                answer: "5 × 3 + 3 × 3"
                hints:
                  - "Count the red rows and the blue rows."
                  - "Five rows of three and three rows of three."
                  - "5 × 3 + 3 × 3."
              - id: l2-f4
                type: text_input
                text: "7 × 5 = 5 × 5 + 2 × 5 = _"
                say: "Seven times five. Five fives and two fives."
                answer: "35"
                hints:
                  - "Five fives are twenty-five."
                  - "Two fives are ten. Twenty-five add ten."
                  - "35."
              - id: l2-f5
                type: true_false
                text: "Is it true? 6 × 6 = 5 × 6 + 1 × 6"
                say: "Six times six is five times six add one times six. Is that true?"
                answer: true
                hints:
                  - "Six rows of six are five rows and one more row."
                  - "Thirty add six is thirty-six, and six sixes are thirty-six."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "8 × 5 = 5 × 5 + 3 × 5 = _"
                say: "Eight times five. Five fives and three fives."
                answer: "40"
                hints: ["Twenty-five add fifteen."]
              - id: l2-s2
                type: multiple_choice
                text: "7 × 3 = 5 × 3 + 2 × 3 = _"
                say: "Seven times three. Five threes and two threes."
                show: { drawn: dots, array: [7, 3], split_rows: 5 }
                options: ["21", "17", "15"]
                answer: "21"
                hints: ["Fifteen add six."]
              - id: l2-s3
                type: fill_in_blank
                text: "8 × 6 = 5 × 6 + 3 × 6"
                say: "Eight times six. Five sixes and three sixes. Fill the gaps."
                frame: "8 × 6 = _ + _ = _"
                options: ["30", "18", "48", "33"]
                answer: ["30", "18", "48"]
                hints: ["Five sixes are thirty. Three sixes are eighteen."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 7 × 7 = 5 × 7 + 2"
                say: "Seven times seven is five times seven add two. Is that true?"
                answer: false
                hints: ["The second part is two rows of seven."]
              - id: l2-s5
                type: multiple_choice
                text: "Which split works for 6 × 8?"
                say: "Which split works for six times eight?"
                options: ["5 × 8 + 1 × 8", "5 × 8 + 1", "6 × 5 + 3"]
                answer: "5 × 8 + 1 × 8"
                hints: ["Five rows of eight and one more row of eight."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "There are 7 rows of chairs with 5 chairs in each row. How many chairs?"
                say: "There are seven rows of chairs, with five chairs in each row. How many chairs are there?"
                answer: "35"
              - id: l2-n2
                type: text_input
                text: "A box has 6 cakes. How many cakes are in 9 boxes?"
                say: "A box has six cakes. How many cakes are in nine boxes?"
                answer: "54"
              - id: l2-n3
                type: multiple_choice
                text: "Tom has 4 bags with 7 marbles in each. How many marbles?"
                say: "Tom has four bags with seven marbles in each. How many marbles does he have?"
                options: ["28", "11", "21"]
                answer: "28"
              - id: l2-n4
                type: text_input
                text: "A garden has 8 rows of 3 plants. How many plants?"
                say: "A garden has eight rows of three plants. How many plants are there?"
                answer: "24"
              - id: l2-n5
                type: multiple_choice
                text: "Stickers come in sheets of 6. Lily has 7 sheets. How many stickers?"
                say: "Stickers come in sheets of six. Lily has seven sheets. How many stickers does she have?"
                options: ["42", "36", "13"]
                answer: "42"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "9 × 8 = _"
            say: "Nine times eight."
            options: ["72", "79", "80"]
            answer: "72"
          - id: l2-c2
            type: text_input
            text: "6 × 4 = _"
            say: "Six times four."
            answer: "24"
          - id: l2-c3
            type: multiple_choice
            text: "Which fact can you double to find 4 × 9?"
            say: "Which fact can you double to find four times nine?"
            options: ["2 × 9", "4 × 2", "2 × 4"]
            answer: "2 × 9"
          - id: l2-c4
            type: text_input
            text: "7 × 8 = 5 × 8 + 2 × 8 = _"
            say: "Seven times eight. Five eights and two eights."
            answer: "56"
          - id: l2-c5
            type: true_false
            text: "Is it true? 8 × 7 = 5 × 7 + 3"
            say: "Eight times seven is five times seven add three. Is that true?"
            answer: false
