# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.compare-chances
skill: math.chance.compare-chances
curriculum: en-GB
language: en
title:
  de: Chancen vergleichen
  en: Comparing chances
summary: >
  Lesson 1 compares chances by counting: the parts of a spinner, the
  numbers on a dice that win (2, 4 and 6 are even: 3 of 6), the two sides
  of a coin; it compares parts with the whole spinner (1 red part of 2
  beats 2 red parts of 6) and shows that a 6 is as likely as a 1. Lesson 2
  makes a prediction and tests it with an experiment in a tally chart:
  which spinner fits a result, whether a result fits the prediction, why
  a second test comes out a little differently and why many spins tell
  more than a few. It ends with the skill check. Spinning and rolling in
  the app wait for an experiment task. Dice faces are dot patterns, and
  coins are named in the text.
metadata:
  year: year-4
  topic: { de: Wahrscheinlichkeit, en: Chance }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.chance.certain-possible-impossible, math.data.tally]
  also_practises: [math.chance.certain-possible-impossible, math.data.tally]
  vocabulary: { en: [chance, likely, unlikely, equally likely, more likely, prediction, experiment, test, spinner, dice, coin, heads, tails, even, odd] }
  forms: [text, audio, drawn]
  drawn: [spinner, dots, bar-chart]
  facets: []
  parts:
    - { id: spinner, what: { de: Chancen am Glücksrad vergleichen, en: comparing chances on a spinner } }
    - { id: dice-coin, what: { de: Chancen beim Würfel und bei der Münze vergleichen, en: comparing chances with a dice and a coin } }
    - { id: predict, what: { de: eine Vermutung und ein Ergebnis zusammenbringen, en: matching a prediction and a result } }
    - { id: trials, what: { de: "wissen, dass Versuche verschieden ausgehen und viele Versuche mehr sagen", en: knowing that tests come out differently and that many tests tell more } }
  misconceptions:
    - id: six-is-hard
      what: Thinks some dice numbers (6) are harder to roll than others
      addressed: lesson 1 Learn says each face has the same chance; l1-f3 has feedback on 6, l1-n2 and l1-c2 ask about equally likely outcomes, l2-f5 has feedback on equal counts, l2-s4 tests it
    - id: count-not-share
      what: Compares only the number of winning parts and not the whole spinner (2 red of 6 beats 1 red of 2)
      addressed: lesson 1 Learn compares 1 of 2 with 2 of 6; l1-f4 has feedback on B, l1-n3, l1-n5 and l2-c3 compare spinners of different sizes
    - id: small-sample
      what: Expects a test to match the spinner exactly, or trusts a few spins as much as many
      addressed: lesson 2 Learn runs two tests and compares 4 spins with 100; l2-f3 and l2-f5 ask about results that are close but not equal, l2-f4 has feedback on 4 spins, l2-s5, l2-n3 and l2-c5 ask about test size
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Chancen zählen, en: Counting chances }
    goal:
      de: "Vergleiche Chancen durch Zählen, so wie 3 der 6 Zahlen auf einem Würfel gerade sind."
      en: "Compare chances by counting, like 3 of the 6 numbers on a dice are even."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "The pointer lands on red. Is that certain, possible or impossible?"
            show: { drawn: spinner, sectors: [red, red, red, red] }
            options: ["certain", "possible", "impossible"]
            answer: "certain"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "A coin was tossed and the results kept in a tally. How many times did it land on heads?"
            show: { drawn: bar-chart, tally: true, rows: [[heads, 6], [tails, 4]] }
            options: ["6", "4", "10"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Red or blue: where will the pointer land more often?"
            say: "This spinner has four equal parts. Three are red and one is blue. If you spin it lots of times, where do you think the pointer will land more often: red or blue? Have a guess."
            show: { drawn: spinner, sectors: [red, red, red, blue] }
          - text: "3 of the 4 parts are red: red is more likely than blue."
            say: "Three of the four parts are red. The pointer is more likely to land on red, because red covers more of the spinner."
            show: { drawn: spinner, sectors: [red, red, red, blue] }
          - text: "A dice has 6 faces. Each number has the same chance."
            say: "A dice has six faces: one, two, three, four, five and six. Each face has the same chance of landing on top. Rolling a six is just as likely as rolling a one, even if it feels harder."
            show: { drawn: dots, count: 6, layout: dice }
          - text: "Even numbers: 2, 4 and 6, so 3 of the 6. A coin: heads is 1 of 2 sides."
            say: "Two, four and six are even, so three of the six numbers are even. An even number and an odd number are equally likely. A coin has two sides, heads and tails, so they are equally likely too."
          - text: "Did you know? A football match starts with a coin toss."
            say: "Did you know? Before a football match, the referee tosses a coin. The captain who wins the toss chooses which goal to attack, or whether to kick off. Heads and tails are equally likely, so neither team has a better chance!"
          - text: "1 red part of 2 is half the spinner. 2 red parts of 6 is less than half."
            say: "Spinner A has one red part out of two. Spinner B, here, has two red parts out of six. B has more red parts, but A gives red the better chance, because half of A is red and less than half of B is red. Always compare with the whole spinner."
            show: { drawn: spinner, sectors: [red, red, blue, blue, blue, blue] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which colour is the pointer more likely to land on?"
                show: { drawn: spinner, sectors: [blue, blue, blue, yellow] }
                options: ["blue", "yellow", "Both are equally likely."]
                answer: "blue"
                hints:
                  - "Count the parts of each colour."
                  - "3 parts are blue and 1 is yellow."
                  - "Blue covers more of the spinner, so blue."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "On which spinner is red most likely?"
                options:
                  - { drawn: spinner, sectors: [red, blue, blue, blue], key: a }
                  - { drawn: spinner, sectors: [red, red, blue, blue], key: b }
                  - { drawn: spinner, sectors: [red, red, red, blue], key: c }
                answer: c
                hints:
                  - "Each spinner has 4 parts. Count the red parts."
                  - "1 red, 2 red and 3 red."
                  - "The spinner with 3 red parts of 4."
              - id: l1-f3
                type: multiple_choice
                text: "You roll a dice. Which are you more likely to roll: a 6 or a 1?"
                show: { drawn: dots, count: 6, layout: dice }
                options: ["6", "1", "Both are equally likely."]
                answer: "Both are equally likely."
                keep_order: true
                feedback:
                  "6": "A 6 can feel harder to get than other numbers, but each face has the same chance: 1 of 6."
                hints:
                  - "How many faces show a 6? How many show a 1?"
                  - "One face shows 6 and one face shows 1."
                  - "1 of 6 each, so both are equally likely."
              - id: l1-f4
                type: multiple_choice
                text: "Spinner A has 1 red part of 2. Spinner B has 2 red parts of 6. Which spinner gives red the better chance?"
                options: ["A", "B", "Both are the same."]
                answer: "A"
                feedback:
                  "B": "B has more red parts, but 2 of 6 is less than half. Half of spinner A is red."
                hints:
                  - "Compare the red parts with the whole spinner."
                  - "1 of 2 is half. 2 of 6 is less than half."
                  - "A gives red the better chance."
              - id: l1-f5
                type: true_false
                text: "When you toss a coin, heads and tails are equally likely."
                say: "Is it true? When you toss a coin, heads and tails are equally likely."
                answer: true
                hints:
                  - "How many sides does a coin have?"
                  - "One side is heads, one side is tails."
                  - "Yes, 1 of 2 each."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which colour is the pointer least likely to land on?"
                show: { drawn: spinner, sectors: [green, green, red, red, red, blue] }
                options: ["blue", "green", "red"]
                answer: "blue"
                hints: ["Find the colour with the fewest parts."]
              - id: l1-s2
                type: multiple_choice
                text: "How many of the numbers on a dice are even?"
                options: ["3", "2", "6"]
                answer: "3"
                hints: ["The numbers are 1 to 6. Which ones are in the 2 times table?"]
              - id: l1-s3
                type: true_false
                text: "Rolling a number less than 3 is as likely as rolling an even number."
                say: "Is it true? Rolling a number less than three is as likely as rolling an even number."
                answer: false
                hints: ["Less than 3 is 1 and 2. Even is 2, 4 and 6."]
              - id: l1-s4
                type: image_multiple_choice
                text: "On which spinner are red and blue equally likely?"
                options:
                  - { drawn: spinner, sectors: [red, blue, red, blue], key: a }
                  - { drawn: spinner, sectors: [red, red, red, blue], key: b }
                  - { drawn: spinner, sectors: [red, blue, blue, blue], key: c }
                answer: a
                hints: ["You need the same number of red and blue parts."]
              - id: l1-s5
                type: multiple_choice
                text: "You roll a dice. Which is the most likely?"
                options: ["a number bigger than 2", "a 1 or a 2", "a 7"]
                answer: "a number bigger than 2"
                hints: ["Count the faces that win each time: bigger than 2 is 3, 4, 5 and 6."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Is the pointer likely or unlikely to land on green?"
                show: { drawn: spinner, sectors: [yellow, yellow, yellow, yellow, yellow, green] }
                options: ["likely", "unlikely", "impossible"]
                answer: "unlikely"
                keep_order: true
              - id: l1-n2
                type: multiple_choice
                text: "You roll a dice. Which is more likely: an odd number or an even number?"
                options: ["odd", "even", "Both are equally likely."]
                answer: "Both are equally likely."
                keep_order: true
              - id: l1-n3
                type: image_multiple_choice
                text: "On which spinner is blue least likely?"
                options:
                  - { drawn: spinner, sectors: [blue, red, red, red, red, red], key: a }
                  - { drawn: spinner, sectors: [blue, red, red], key: b }
                  - { drawn: spinner, sectors: [blue, red], key: c }
                answer: a
              - id: l1-n4
                type: text_input
                text: "A dice has the numbers 1 to 6. How many of them are bigger than 4?"
                answer: "2"
              - id: l1-n5
                type: multiple_choice
                text: "A dice game: you win on a 6. Your friend wins on a 1 or a 2. Who has the better chance?"
                options: ["your friend", "you", "Both are the same."]
                answer: "your friend"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which colour is the pointer more likely to land on?"
            show: { drawn: spinner, sectors: [red, red, red, green] }
            options: ["red", "green", "Both are equally likely."]
            answer: "red"
          - id: l1-c2
            type: multiple_choice
            text: "You toss a coin. Which is more likely: heads or tails?"
            options: ["heads", "tails", "Both are equally likely."]
            answer: "Both are equally likely."
            keep_order: true
          - id: l1-c3
            type: image_multiple_choice
            text: "On which spinner is yellow most likely?"
            options:
              - { drawn: spinner, sectors: [yellow, blue, blue], key: a }
              - { drawn: spinner, sectors: [yellow, yellow, blue], key: b }
              - { drawn: spinner, sectors: [yellow, blue, blue, blue, blue], key: c }
            answer: b
          - id: l1-c4
            type: true_false
            text: "On this spinner, green is more likely than yellow."
            say: "Is it true? On this spinner, green is more likely than yellow."
            show: { drawn: spinner, sectors: [green, yellow, yellow, green, green] }
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "You roll a dice. Which is more likely: a number less than 3 or a number bigger than 3?"
            options: ["a number less than 3", "a number bigger than 3", "Both are equally likely."]
            answer: "a number bigger than 3"
            keep_order: true
          - id: l1-c6
            type: image_multiple_choice
            text: "Which spinner gives blue a better chance than red?"
            options:
              - { drawn: spinner, sectors: [red, red, blue], key: a }
              - { drawn: spinner, sectors: [red, blue, blue], key: b }
              - { drawn: spinner, sectors: [red, blue], key: c }
            answer: b

  - n: 2
    title: { de: Vermuten und ausprobieren, en: Predicting and testing }
    goal:
      de: "Stell eine Vermutung auf, teste sie mit vielen Drehungen und einer Strichliste und schau, ob das Ergebnis passt."
      en: "Make a prediction, then test it with lots of spins and a tally chart, and see if the result fits."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which colour is the pointer more likely to land on?"
            show: { drawn: spinner, sectors: [green, blue, blue, blue] }
            options: ["blue", "green", "Both are equally likely."]
            answer: "blue"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "You roll a dice. How likely are you to roll a 3, compared with a 5?"
            options: ["equally likely", "more likely", "less likely"]
            answer: "equally likely"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "20 spins: will red or blue come up more often? Make a prediction."
            say: "Before an experiment, we make a prediction: what we think will happen. This spinner has three red parts and one blue part. We will spin it twenty times. Will red or blue come up more often? What is your prediction?"
            show: { drawn: spinner, sectors: [red, red, red, blue] }
          - text: "Prediction: red more often. Test: 20 spins. Red 14, blue 6. That fits."
            say: "Our prediction: red will come up more often than blue. Now we test it. We spin twenty times and keep a tally. Red came up fourteen times and blue six times. Red came up more often, so the result fits the prediction."
            show: { drawn: bar-chart, tally: true, rows: [[red, 14], [blue, 6]] }
          - text: "A second test: red 16, blue 4. Different, but red still wins."
            say: "We test again. This time red comes up sixteen times and blue four times. The numbers are different, because chance never comes out exactly the same. But red still comes up more often."
            show: { drawn: bar-chart, tally: true, rows: [[red, 16], [blue, 4]] }
          - text: "4 spins can fool you. 100 spins tell you much more."
            say: "With only four spins, blue might come up most, just by luck. With a hundred spins, luck evens out, and the result gets close to what the spinner shows: about three reds for every blue. The more times you test, the more you can trust the result."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "You will spin this spinner 20 times. What is the best prediction?"
                show: { drawn: spinner, sectors: [red, red, blue, blue] }
                options: ["Red and blue will come up about the same number of times.", "Red will come up every time.", "Blue will come up far more often."]
                answer: "Red and blue will come up about the same number of times."
                hints:
                  - "Count the red parts and the blue parts."
                  - "2 red and 2 blue: the same."
                  - "So about the same number of times each."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Ben spun a spinner 20 times: red 15, blue 5. Which spinner did he most likely use?"
                show: { drawn: bar-chart, tally: true, rows: [[red, 15], [blue, 5]] }
                options:
                  - { drawn: spinner, sectors: [red, red, red, blue], key: a }
                  - { drawn: spinner, sectors: [red, blue], key: b }
                  - { drawn: spinner, sectors: [red, blue, blue, blue], key: c }
                answer: a
                hints:
                  - "Red came up much more often than blue."
                  - "Look for a spinner with many more red parts than blue."
                  - "The spinner with 3 red parts and 1 blue part."
              - id: l2-f3
                type: true_false
                text: "Mia tossed a coin 20 times: 11 heads and 9 tails. The coin must be unfair, because the numbers are not the same."
                say: "Is it true? Mia tossed a coin twenty times and got eleven heads and nine tails. The coin must be unfair, because the numbers are not the same."
                show: { drawn: bar-chart, tally: true, rows: [[heads, 11], [tails, 9]] }
                answer: false
                hints:
                  - "Does chance always come out exactly even?"
                  - "11 and 9 are very close to 10 each."
                  - "No. A fair coin often gives results like this."
              - id: l2-f4
                type: multiple_choice
                text: "Which test tells you most about a spinner?"
                options: ["100 spins", "4 spins", "1 spin", "no spins, just a good feeling"]
                answer: "100 spins"
                feedback:
                  "4 spins": "With only a few spins, luck can change the result a lot."
                  "no spins, just a good feeling": "A feeling is not a test! You need to spin and count, lots of times."
                hints:
                  - "Luck matters most in a small test."
                  - "The more spins, the more luck evens out."
                  - "100 spins."
              - id: l2-f5
                type: multiple_choice
                text: "Raj rolled a dice 18 times. Does his result fit the idea that every number has the same chance?"
                show: { drawn: bar-chart, rows: [["1", 3], ["2", 4], ["3", 2], ["4", 4], ["5", 3], ["6", 2]] }
                options: ["Yes, every number came up a few times.", "No, 6 is harder to roll.", "No, each number should come up exactly 3 times."]
                answer: "Yes, every number came up a few times."
                feedback:
                  "No, each number should come up exactly 3 times.": "Chance never shares out exactly. Counts close to each other fit a fair dice."
                hints:
                  - "The numbers are all close: between 2 and 4."
                  - "A fair dice does not give exactly the same count each time."
                  - "Yes, every number came up a few times."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "You spin this spinner 40 times. Which result is most likely?"
                show: { drawn: spinner, sectors: [green, green, green, yellow] }
                options: ["green 29, yellow 11", "green 10, yellow 30", "green 40, yellow 0"]
                answer: "green 29, yellow 11"
                hints: ["Green is likely but not certain."]
              - id: l2-s2
                type: image_multiple_choice
                text: "After 20 spins: red 6, blue 14. Which spinner most likely gave this result?"
                show: { drawn: bar-chart, tally: true, rows: [[red, 6], [blue, 14]] }
                options:
                  - { drawn: spinner, sectors: [red, blue, blue, blue], key: a }
                  - { drawn: spinner, sectors: [red, red, red, blue], key: b }
                  - { drawn: spinner, sectors: [red, blue], key: c }
                answer: a
                hints: ["Blue came up much more often."]
              - id: l2-s3
                type: true_false
                text: "If you spin this spinner 50 times, blue will probably come up more often than red."
                say: "Is it true? If you spin this spinner fifty times, blue will probably come up more often than red."
                show: { drawn: spinner, sectors: [blue, blue, blue, red] }
                answer: true
                hints: ["Count the blue parts."]
              - id: l2-s4
                type: multiple_choice
                text: "Tom thinks a dice shows 6 less often than other numbers. How can he test it?"
                options: ["Roll it many times and keep a tally.", "Roll it once.", "Ask a friend which number they like."]
                answer: "Roll it many times and keep a tally."
                hints: ["A test needs lots of results to count."]
              - id: l2-s5
                type: multiple_choice
                text: "Sam tossed a coin 4 times: 3 heads and 1 tail. Why does this not show that heads is more likely?"
                show: { drawn: bar-chart, tally: true, rows: [[heads, 3], [tails, 1]] }
                options: ["4 tosses are too few, so luck can change the result.", "Heads really is more likely.", "He should have used a dice."]
                answer: "4 tosses are too few, so luck can change the result."
                hints: ["Think about how many times he tossed it."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "You will spin this spinner 30 times. What is the best prediction?"
                show: { drawn: spinner, sectors: [red, blue, yellow] }
                options: ["about 10 of each colour", "30 reds", "red 20, blue 10, yellow 0"]
                answer: "about 10 of each colour"
              - id: l2-n2
                type: image_multiple_choice
                text: "After 20 spins: yellow 10, green 10. Which spinner most likely gave this result?"
                show: { drawn: bar-chart, tally: true, rows: [[yellow, 10], [green, 10]] }
                options:
                  - { drawn: spinner, sectors: [yellow, green], key: a }
                  - { drawn: spinner, sectors: [yellow, yellow, yellow, green], key: b }
                  - { drawn: spinner, sectors: [yellow, green, green, green], key: c }
                answer: a
              - id: l2-n3
                type: true_false
                text: "The more times you spin, the more you can trust the result."
                say: "Is it true? The more times you spin, the more you can trust the result."
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "A spinner has 4 red parts and 1 blue part. Ali predicts red will come up more often. After 50 spins: red 41, blue 9. Does the result fit?"
                options: ["Yes, red came up far more often.", "No, blue should never come up.", "No, they should be equal."]
                answer: "Yes, red came up far more often."
              - id: l2-n5
                type: text_input
                text: "A coin is tossed 60 times. About how many heads do you expect?"
                answer: "30"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: spinner
            type: multiple_choice
            text: "Which colour is the pointer most likely to land on?"
            show: { drawn: spinner, sectors: [blue, blue, blue, red, red, green] }
            options: ["blue", "red", "green"]
            answer: "blue"
          - id: l2-c2
            part: dice-coin
            type: multiple_choice
            text: "You roll a dice. Which is more likely?"
            options: ["a 1, 2, 3 or 4", "a 5 or a 6", "Both are equally likely."]
            answer: "a 1, 2, 3 or 4"
            keep_order: true
          - id: l2-c3
            part: spinner
            type: image_multiple_choice
            text: "Which spinner gives green the best chance?"
            options:
              - { drawn: spinner, sectors: [green, red], key: a }
              - { drawn: spinner, sectors: [green, green, red, red, red, red], key: b }
              - { drawn: spinner, sectors: [green, red, red], key: c }
            answer: a
          - id: l2-c4
            part: predict
            type: image_multiple_choice
            text: "After 20 spins: red 16, yellow 4. Which spinner most likely gave this result?"
            show: { drawn: bar-chart, tally: true, rows: [[red, 16], [yellow, 4]] }
            options:
              - { drawn: spinner, sectors: [red, red, red, red, yellow], key: a }
              - { drawn: spinner, sectors: [red, yellow], key: b }
              - { drawn: spinner, sectors: [red, yellow, yellow, yellow, yellow], key: c }
            answer: a
          - id: l2-c5
            part: trials
            type: multiple_choice
            text: "Which test tells you most about whether a dice is fair?"
            options: ["600 rolls", "6 rolls", "1 roll"]
            answer: "600 rolls"
          - id: l2-c6
            part: spinner
            type: multiple_choice
            text: "Is the pointer likely or unlikely to land on red?"
            show: { drawn: spinner, sectors: [red, red, red, red, blue] }
            options: ["likely", "unlikely", "impossible"]
            answer: "likely"
            keep_order: true
          - id: l2-c7
            part: spinner
            type: true_false
            text: "On this spinner, red is more likely than blue."
            say: "Is it true? On this spinner, red is more likely than blue."
            show: { drawn: spinner, sectors: [red, red, blue, blue, blue, green] }
            answer: false
          - id: l2-c8
            part: spinner
            type: multiple_choice
            text: "Spinner A has 1 blue part of 4. Spinner B has 2 blue parts of 8. Which spinner gives blue the better chance?"
            options: ["A", "B", "Both are the same."]
            answer: "Both are the same."
          - id: l2-c9
            part: dice-coin
            type: multiple_choice
            text: "You roll a dice. Which is least likely?"
            options: ["a 6", "an even number", "a number less than 6"]
            answer: "a 6"
          - id: l2-c10
            part: dice-coin
