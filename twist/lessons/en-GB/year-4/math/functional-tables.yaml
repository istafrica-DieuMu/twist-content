# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.functional-tables
skill: math.patterns.functional-tables
curriculum: en-GB
language: en
title:
  de: Zusammenhänge in Tabellen
  en: Tables of values
summary: >
  Lesson 1 reads and fills price tables (1 notebook £3, 4 notebooks
  £12), finds the price of one from the price of several, and doubles
  the price when the number doubles; lesson 2 uses the same kind of
  table for eggs in boxes, legs on spiders and litres of water per
  minute, adds two columns (2 tickets and 3 tickets make 5 tickets),
  and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Zusammenhänge, en: Relationships }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.all-tables, math.money.amounts-to-100]
  also_practises: [math.mult-div.all-tables]
  vocabulary: { en: [table, row, column, price, each, double, missing value, pattern] }
  forms: [drawn, text, audio]
  drawn: [table]
  facets: [currency]
  misconceptions:
    - id: adds-not-multiplies
      what: Goes on by adding 1 or a fixed amount from column to column instead of the value of one (3 notebooks £9, so 4 notebooks £10), or adds when the number doubles
      addressed: lesson 1 Learn adds the price of one for each notebook and doubles with the number; l1-f1 and l2-f4 have feedback on the added step; l1-f4, l2-f5, l2-s5 and l2-c4 ask whether a table with a wrong step is right
    - id: total-as-unit-price
      what: Takes the price of several as the price of one, or halves when it should divide by three or more
      addressed: l1-f3 has feedback on taking the price of two as the price of one; l1-s3, l1-n2, l2-s2, l2-n2 and l2-c2 ask for the value of one from a column of three, four or two
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Preistabellen", en: "Price tables" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "4 × 3 = _"
            say: "Four times three."
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How much is £5 + £5 + £5?"
            options: ["£15", "£10", "£20"]
            answer: "£15"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "One notebook costs £3."
            say: "A notebook costs three pounds. This table shows how much several notebooks cost. Each time you buy one more, you pay three pounds more."
            show: { drawn: table, rows: [["notebooks", "1", "2", "3", "4", "5"], ["price", "£3", "£6", "£9", "£12", "£15"]] }
          - text: "4 notebooks: 4 × £3 = £12"
            say: "You can also multiply. Four notebooks cost four times three pounds, which is twelve pounds."
          - text: "Twice as many notebooks, twice the price"
            say: "Two notebooks cost six pounds. Four notebooks are twice as many, so they cost twice as much: twelve pounds."
          - text: "3 notebooks £9, so 1 notebook: £9 ÷ 3 = £3"
            say: "If you know the price of three, divide by three to find the price of one. Nine pounds divided by three is three pounds."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "A pen costs £2. Fill in the table."
                show: { drawn: table, rows: [["pens", "1", "2", "3", "4"], ["price", "£2", "£4", "?", "?"]] }
                frame: "3 pens: £_, 4 pens: £_"
                options: ["5", "6", "8", "9"]
                answer: ["6", "8"]
                feedback:
                  "5": "You added £1. Each pen costs £2, so add £2 each time."
                hints:
                  - "Each pen costs £2 more."
                  - "3 × £2 and 4 × £2."
                  - "£6 and £8."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "One ticket costs £5. How much do 6 tickets cost?"
                show: { drawn: table, rows: [["tickets", "1", "2", "6"], ["price", "£5", "£10", "?"]] }
                options: ["£30", "£11", "£25"]
                answer: "£30"
                hints:
                  - "Multiply the price of one ticket."
                  - "6 × £5."
                  - "£30."
              - id: l1-f3
                type: multiple_choice
                text: "2 ice lollies cost £4. How much does 1 cost?"
                show: { drawn: table, rows: [["ice lollies", "1", "2"], ["price", "?", "£4"]] }
                options: ["£2", "£4", "£8"]
                answer: "£2"
                feedback:
                  "£4": "£4 is the price of 2 lollies. Halve it for 1."
                  "£8": "That is the price of 4. For 1, halve £4."
                hints:
                  - "Fewer lollies cost less."
                  - "£4 ÷ 2."
                  - "£2."
              - id: l1-f4
                type: true_false
                text: "A cake costs £4. Is it true? This table is right."
                say: "A cake costs four pounds. Look at the table. Is it true? The table is right."
                show: { drawn: table, rows: [["cakes", "1", "2", "3", "4"], ["price", "£4", "£8", "£12", "£13"]] }
                answer: false
                hints:
                  - "Each cake adds £4."
                  - "4 cakes cost 4 × £4."
                  - "No. 4 cakes cost £16, not £13."
              - id: l1-f5
                type: fill_in_blank
                text: "3 balls cost £7. Double the number of balls."
                show: { drawn: table, rows: [["balls", "3", "6"], ["price", "£7", "?"]] }
                frame: "6 balls: £_"
                options: ["10", "13", "14"]
                answer: ["14"]
                hints:
                  - "6 balls are twice as many as 3."
                  - "Double £7."
                  - "£14."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "A drink costs £3. Fill in the table."
                show: { drawn: table, rows: [["drinks", "1", "2", "3", "5"], ["price", "£3", "£6", "?", "?"]] }
                frame: "3 drinks: £_, 5 drinks: £_"
                options: ["7", "9", "12", "15"]
                answer: ["9", "15"]
                hints: ["Multiply £3 by the number of drinks."]
              - id: l1-s2
                type: multiple_choice
                text: "One comic costs £4. How much do 7 comics cost?"
                options: ["£28", "£11", "£24"]
                answer: "£28"
                hints: ["7 × £4."]
              - id: l1-s3
                type: multiple_choice
                text: "4 rulers cost £8. How much does 1 cost?"
                show: { drawn: table, rows: [["rulers", "1", "4"], ["price", "?", "£8"]] }
                options: ["£2", "£4", "£8"]
                answer: "£2"
                hints: ["£8 ÷ 4."]
              - id: l1-s4
                type: true_false
                text: "A badge costs £5. Is it true? This table is right."
                say: "A badge costs five pounds. Look at the table. Is it true? The table is right."
                show: { drawn: table, rows: [["badges", "1", "2", "3", "4"], ["price", "£5", "£10", "£15", "£20"]] }
                answer: true
                hints: ["Add £5 each time."]
              - id: l1-s5
                type: fill_in_blank
                text: "4 bus tickets cost £9. Double the number of tickets."
                show: { drawn: table, rows: [["tickets", "4", "8"], ["price", "£9", "?"]] }
                frame: "8 tickets: £_"
                options: ["13", "17", "18"]
                answer: ["18"]
                hints: ["Twice as many tickets cost twice as much."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "A sticker sheet costs £6. Fill in the table."
                show: { drawn: table, rows: [["sheets", "1", "2", "4", "5"], ["price", "£6", "£12", "?", "?"]] }
                frame: "4 sheets: £_, 5 sheets: £_"
                options: ["18", "24", "30", "36"]
                answer: ["24", "30"]
              - id: l1-n2
                type: multiple_choice
                text: "3 sandwiches cost £12. How much does 1 cost?"
                show: { drawn: table, rows: [["sandwiches", "1", "3"], ["price", "?", "£12"]] }
                options: ["£4", "£6", "£9"]
                answer: "£4"
              - id: l1-n3
                type: text_input
                text: "One game costs £8. How many pounds do 9 games cost?"
                answer: "72"
              - id: l1-n4
                type: true_false
                text: "A pencil case costs £7. Is it true? This table is right."
                say: "A pencil case costs seven pounds. Look at the table. Is it true? The table is right."
                show: { drawn: table, rows: [["pencil cases", "1", "2", "3"], ["price", "£7", "£14", "£15"]] }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "5 apples cost £2. Double the number of apples."
                show: { drawn: table, rows: [["apples", "5", "10"], ["price", "£2", "?"]] }
                frame: "10 apples: £_"
                options: ["4", "7", "12"]
                answer: ["4"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "A cupcake costs £2. Fill in the table."
            show: { drawn: table, rows: [["cupcakes", "1", "2", "5", "7"], ["price", "£2", "£4", "?", "?"]] }
            frame: "5 cupcakes: £_, 7 cupcakes: £_"
            options: ["10", "12", "14", "16"]
            answer: ["10", "14"]
          - id: l1-c2
            type: multiple_choice
            text: "2 posters cost £10. How much does 1 cost?"
            options: ["£5", "£10", "£20"]
            answer: "£5"
          - id: l1-c3
            type: text_input
            text: "One book costs £6. How many pounds do 8 books cost?"
            answer: "48"

  - n: 2
    title: { de: "Tabellen ergänzen", en: "Completing tables" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "One kite costs £9. How much do 3 kites cost?"
            options: ["£27", "£12", "£18"]
            answer: "£27"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4 cards cost £12. How much does 1 cost?"
            options: ["£3", "£4", "£8"]
            answer: "£3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A box holds 6 eggs."
            say: "Tables work for more than prices. A box holds six eggs. Two boxes hold twelve, three boxes hold eighteen. Each box adds six eggs."
            show: { drawn: table, rows: [["boxes", "1", "2", "3", "4"], ["eggs", "6", "12", "18", "24"]] }
          - text: "A spider has 8 legs."
            say: "A spider has eight legs. To find the legs on five spiders, multiply: five times eight is forty."
            show: { drawn: table, rows: [["spiders", "1", "2", "5"], ["legs", "8", "16", "40"]] }
          - text: "2 boxes + 3 boxes = 5 boxes, so 12 + 18 = 30 eggs"
            say: "You can add two columns. Two boxes hold twelve eggs and three boxes hold eighteen. Together that is five boxes and thirty eggs."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "A car has 4 wheels. Fill in the table."
                show: { drawn: table, rows: [["cars", "1", "2", "3", "6"], ["wheels", "4", "8", "?", "?"]] }
                frame: "3 cars: _ wheels, 6 cars: _ wheels"
                options: ["9", "12", "20", "24"]
                answer: ["12", "24"]
                hints:
                  - "Each car adds 4 wheels."
                  - "3 × 4 and 6 × 4."
                  - "12 and 24."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "A tap fills 7 litres of water each minute. How many litres does it fill in 5 minutes?"
                show: { drawn: table, rows: [["minutes", "1", "2", "5"], ["litres", "7", "14", "?"]] }
                answer: "35"
                hints:
                  - "Multiply the litres for one minute."
                  - "5 × 7."
                  - "35 litres."
              - id: l2-f3
                type: fill_in_blank
                text: "Add the two columns."
                say: "Two packs hold ten pencils, three packs hold fifteen. How many packs and pencils are there together?"
                show: { drawn: table, rows: [["packs", "2", "3", "?"], ["pencils", "10", "15", "?"]] }
                frame: "_ packs, _ pencils"
                options: ["5", "6", "25", "30"]
                answer: ["5", "25"]
                hints:
                  - "Add the top row, then the bottom row."
                  - "2 + 3 packs, 10 + 15 pencils."
                  - "5 packs, 25 pencils."
              - id: l2-f4
                type: fill_in_blank
                text: "A bike has 2 wheels. Fill in the table."
                show: { drawn: table, rows: [["bikes", "1", "2", "3", "4"], ["wheels", "2", "4", "?", "?"]] }
                frame: "3 bikes: _ wheels, 4 bikes: _ wheels"
                options: ["5", "6", "7", "8"]
                answer: ["6", "8"]
                feedback:
                  "5": "You added 1. Each bike adds 2 wheels."
                hints:
                  - "Each bike adds 2 wheels."
                  - "3 × 2 and 4 × 2."
                  - "6 and 8."
              - id: l2-f5
                type: true_false
                text: "A star has 5 points. Is it true? This table is right."
                say: "A star has five points. Look at the table. Is it true? The table is right."
                show: { drawn: table, rows: [["stars", "1", "2", "3", "4"], ["points", "5", "10", "15", "16"]] }
                answer: false
                hints:
                  - "Each star adds 5 points."
                  - "4 stars have 4 × 5 points."
                  - "No. 4 stars have 20 points, not 16."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "A spider has 8 legs. Fill in the table."
                show: { drawn: table, rows: [["spiders", "1", "2", "3", "4"], ["legs", "8", "16", "?", "?"]] }
                frame: "3 spiders: _ legs, 4 spiders: _ legs"
                options: ["17", "24", "32", "36"]
                answer: ["24", "32"]
                hints: ["Each spider adds 8 legs."]
              - id: l2-s2
                type: text_input
                text: "3 bags hold 27 marbles. How many marbles are in 1 bag?"
                show: { drawn: table, rows: [["bags", "1", "3"], ["marbles", "?", "27"]] }
                answer: "9"
                hints: ["27 ÷ 3."]
              - id: l2-s3
                type: fill_in_blank
                text: "Add the two columns."
                say: "Two boxes hold fourteen crayons, four boxes hold twenty-eight. How many boxes and crayons are there together?"
                show: { drawn: table, rows: [["boxes", "2", "4", "?"], ["crayons", "14", "28", "?"]] }
                frame: "_ boxes, _ crayons"
                options: ["6", "8", "42", "48"]
                answer: ["6", "42"]
                hints: ["Add each row."]
              - id: l2-s4
                type: text_input
                text: "A minibus holds 9 children. How many children do 6 minibuses hold?"
                answer: "54"
                hints: ["6 × 9."]
              - id: l2-s5
                type: true_false
                text: "A pack has 6 yoghurts. Is it true? This table is right."
                say: "A pack has six yoghurts. Look at the table. Is it true? The table is right."
                show: { drawn: table, rows: [["packs", "1", "2", "3", "4"], ["yoghurts", "6", "12", "18", "24"]] }
                answer: true
                hints: ["Each pack adds 6."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "A chair has 4 legs. Fill in the table."
                show: { drawn: table, rows: [["chairs", "1", "2", "5", "8"], ["legs", "4", "8", "?", "?"]] }
                frame: "5 chairs: _ legs, 8 chairs: _ legs"
                options: ["11", "20", "28", "32"]
                answer: ["20", "32"]
              - id: l2-n2
                type: text_input
                text: "4 trays hold 28 cakes. How many cakes are on 1 tray?"
                show: { drawn: table, rows: [["trays", "1", "4"], ["cakes", "?", "28"]] }
                answer: "7"
              - id: l2-n3
                type: fill_in_blank
                text: "Add the two columns."
                say: "Three bags hold twenty-four sweets, five bags hold forty. How many bags and sweets are there together?"
                show: { drawn: table, rows: [["bags", "3", "5", "?"], ["sweets", "24", "40", "?"]] }
                frame: "_ bags, _ sweets"
                options: ["8", "9", "64", "72"]
                answer: ["8", "64"]
              - id: l2-n4
                type: text_input
                text: "A hose fills 9 litres each minute. How many litres does it fill in 7 minutes?"
                answer: "63"
              - id: l2-n5
                type: true_false
                text: "A tricycle has 3 wheels. Is it true? This table is right."
                say: "A tricycle has three wheels. Look at the table. Is it true? The table is right."
                show: { drawn: table, rows: [["tricycles", "1", "2", "3", "4"], ["wheels", "3", "6", "9", "12"]] }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "A T-shirt costs £7. Fill in the table."
            show: { drawn: table, rows: [["T-shirts", "1", "2", "3", "6"], ["price", "£7", "£14", "?", "?"]] }
            frame: "3 T-shirts: £_, 6 T-shirts: £_"
            options: ["15", "21", "35", "42"]
            answer: ["21", "42"]
          - id: l2-c2
            type: text_input
            text: "5 notebooks cost £15. How many pounds does 1 notebook cost?"
            answer: "3"
          - id: l2-c3
            type: fill_in_blank
            text: "Add the two columns."
            say: "Two cartons hold twelve eggs, four cartons hold twenty-four. How many cartons and eggs are there together?"
            show: { drawn: table, rows: [["cartons", "2", "4", "?"], ["eggs", "12", "24", "?"]] }
            frame: "_ cartons, _ eggs"
            options: ["6", "8", "36", "48"]
            answer: ["6", "36"]
          - id: l2-c4
            type: true_false
            text: "A bag of rice costs £3. Is it true? This table is right."
            say: "A bag of rice costs three pounds. Look at the table. Is it true? The table is right."
            show: { drawn: table, rows: [["bags", "1", "2", "3", "4"], ["price", "£3", "£6", "£9", "£10"]] }
            answer: false
          - id: l2-c5
            type: text_input
            text: "An octopus has 8 arms. How many arms do 9 octopuses have?"
            answer: "72"
