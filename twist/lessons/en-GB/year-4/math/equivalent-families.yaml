# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.equivalent-families
skill: math.fractions.equivalent-families
curriculum: en-GB
language: en
title:
  de: Familien gleichwertiger Brüche
  en: Families of equivalent fractions
summary: >
  Families of equivalent fractions shown with fraction bars (1/2 = 2/4 =
  3/6 = 4/8 = 5/10), found by multiplying or dividing the numerator and
  the denominator by the same number. Lesson 1 builds and continues the
  families; lesson 2 compares and orders fractions whose denominators are
  multiples of the same number (3/4 and 5/8, 2/3 and 5/6) by changing one
  of them, and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Brüche, en: Fractions }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.fractions.equivalent-simple, math.mult-div.all-tables]
  also_practises: [math.fractions.equivalent-simple, math.mult-div.all-tables]
  vocabulary: { en: [equivalent, family, numerator, denominator, multiple, compare, greater than, less than] }
  forms: [drawn, text, audio]
  drawn: [fraction]
  facets: []
  parts:
    - { id: find, what: { de: einen gleichwertigen Bruch finden, en: finding an equivalent fraction } }
    - { id: family, what: { de: Bruchfamilien erkennen und fortsetzen, en: recognising and continuing a family of fractions } }
    - { id: compare, what: { de: zwei Brüche vergleichen, en: comparing two fractions } }
    - { id: order, what: { de: Brüche ordnen, en: ordering fractions } }
  misconceptions:
    - id: adds-the-same
      what: Adds the same number to the numerator and denominator and thinks the fraction stays equal (1/2 = 2/3)
      addressed: lesson 1 Learn shows 1/2 and 2/3 are not equal; l1-f3 has feedback on 2/5, and l1-s3 and l1-s4 ask it
    - id: changes-one-number
      what: Multiplies only the denominator or only the numerator (1/3 = 1/6, 3/4 = 3/8)
      addressed: lesson 1 Learn multiplies the top and the bottom; l1-f2, l1-s1 and l1-n1 offer the unchanged numerator, and l2-f1 rewrites 3/4 as eighths
    - id: bigger-numbers-bigger-fraction
      what: Thinks a fraction with bigger numbers is bigger (3/8 > 1/2, 7/12 > 3/4)
      addressed: lesson 2 Learn shows 1/2 = 4/8 > 3/8; l2-f3 has feedback, and l2-s2, l2-s4, l2-n2 and l2-c4 ask it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Bruchfamilien finden, en: Find a fraction family }
    goal:
      de: "Bilde Familien gleichwertiger Brüche, indem du oben und unten mit derselben Zahl malnimmst, so wie ein Halb ist zwei Viertel."
      en: "Make families of equal fractions by multiplying top and bottom by the same number, like one half is two quarters."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "The bar shows 2/4. Which fraction is the same?"
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 2 }
            options: ["1/2", "1/4", "2/2"]
            answer: "1/2"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "3 × 4 = _"
            say: "Three times four."
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Would you rather have 1/2 of a pizza or 4/8 of the same pizza?"
            say: "Would you rather have one half of a pizza, or four eighths of the same pizza? Have a guess."
            show: { object: pizza }
          - text: "1/2 = 2/4 = 3/6 = 4/8 = 5/10"
            say: "It makes no difference: you get just as much pizza! These fractions all fill the same amount of the bar. They are equivalent: a family of fractions that are all equal to one half."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 4 }
          - text: "1/3 = 2/6 = 3/9 = 4/12\nMultiply the numerator and the denominator by the same number."
            say: "To find another member of a family, multiply the numerator and the denominator by the same number. One third, times two on top and bottom, is two sixths. Times three is three ninths."
            show: { drawn: fraction, kind: bar, parts: 6, shaded: 2 }
          - text: "6/8 = 3/4\nDivide the numerator and the denominator by the same number."
            say: "You can also divide the numerator and the denominator by the same number. Six eighths, divided by two on top and bottom, is three quarters."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 6 }
          - text: "Did you know? People in ancient Egypt wrote 3/4 as 1/2 + 1/4."
            say: "Did you know? People in ancient Egypt wrote three quarters as one half and one quarter. It works, because one half is two quarters!"
          - text: "1/2 is not equal to 2/3."
            say: "Adding one to the top and to the bottom does not keep a fraction the same. One half and two thirds are not equal. Only multiplying or dividing both works."
            show: { drawn: fraction, kind: bar, parts: 3, shaded: 2 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which fraction is equivalent to the shaded part?"
                show: { drawn: fraction, kind: bar, parts: 6, shaded: 3 }
                options: ["1/2", "1/3", "3/3"]
                answer: "1/2"
                hints:
                  - "How many parts are shaded out of how many?"
                  - "3 out of 6 parts: half of the bar."
                  - "3/6 = 1/2."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Find the equivalent fraction."
                say: "One third is how many sixths?"
                frame: "1/3 = _/6"
                options: ["1", "2", "3"]
                answer: ["2"]
                hints:
                  - "What do you multiply 3 by to get 6?"
                  - "3 × 2 = 6, so multiply the numerator by 2 too."
                  - "1 × 2 = 2: 2/6."
              - id: l1-f3
                type: multiple_choice
                text: "Which fraction belongs to the family of 1/4?"
                options: ["2/8", "2/5", "4/1"]
                answer: "2/8"
                feedback:
                  "2/5": "Adding 1 to the top and the bottom does not keep it equal. Multiply both by 2: 1/4 = 2/8."
                hints:
                  - "Multiply the top and the bottom by the same number."
                  - "1 × 2 = 2 and 4 × 2 = 8."
                  - "2/8."
              - id: l1-f4
                type: fill_in_blank
                text: "Continue the family."
                frame: "1/5 = 2/10 = _/15 = 4/_"
                options: ["3", "5", "16", "20"]
                answer: ["3", "20"]
                hints:
                  - "Look at how the numerators and denominators grow."
                  - "Numerators count in ones: 1, 2, 3, 4. Denominators count in fives: 5, 10, 15, 20."
                  - "3/15 and 4/20."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which bar shows a fraction equivalent to 2/3?"
                options:
                  - { drawn: fraction, kind: bar, parts: 6, shaded: 4 }
                  - { drawn: fraction, kind: bar, parts: 6, shaded: 3 }
                  - { drawn: fraction, kind: bar, parts: 6, shaded: 5 }
                answer: "4/6"
                hints:
                  - "Change 2/3 into sixths."
                  - "3 × 2 = 6, so 2 × 2 = 4."
                  - "The bar with 4 of 6 parts shaded."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Find the equivalent fraction."
                say: "Three quarters is how many eighths?"
                frame: "3/4 = _/8"
                options: ["3", "6", "7"]
                answer: ["6"]
                hints: ["4 × 2 = 8. Do the same to the 3."]
              - id: l1-s2
                type: multiple_choice
                text: "Which fraction is equivalent to 8/10?"
                options: ["4/5", "6/8", "8/5"]
                answer: "4/5"
                hints: ["Divide the top and the bottom by 2."]
              - id: l1-s3
                type: true_false
                text: "Is it true? 2/3 = 3/4"
                say: "Is it true? Two thirds is equal to three quarters."
                answer: false
                hints: ["3/4 adds one to the top and the bottom of 2/3. Does that keep it equal?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which fraction is not in the family of 1/2?"
                options: ["4/8", "6/12", "3/5"]
                answer: "3/5"
                hints: ["In the family of 1/2 the denominator is double the numerator."]
              - id: l1-s5
                type: matching
                text: "Match each fraction with an equivalent fraction."
                option_audio: false
                pairs:
                  - { left: { text: "1/2" }, right: { text: "4/8" } }
                  - { left: { text: "1/3" }, right: { text: "3/9" } }
                  - { left: { text: "1/4" }, right: { text: "3/12" } }
                  - { left: { text: "2/5" }, right: { text: "4/10" } }
                hints: ["Multiply the top and the bottom by the same number."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Find the equivalent fraction."
                say: "Two fifths is how many tenths?"
                frame: "2/5 = _/10"
                options: ["2", "4", "7"]
                answer: ["4"]
              - id: l1-n2
                type: fill_in_blank
                text: "Find the equivalent fraction."
                say: "Nine twelfths is equal to three of what? Find the missing denominator."
                frame: "9/12 = 3/_"
                options: ["3", "4", "6"]
                answer: ["4"]
              - id: l1-n3
                type: multiple_choice
                text: "Which fraction is equivalent to 5/6?"
                options: ["10/12", "6/7", "5/12"]
                answer: "10/12"
              - id: l1-n4
                type: true_false
                text: "Is it true? 3/9 and 1/3 are equivalent."
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Continue the family."
                frame: "2/3 = 4/6 = _/9 = 8/_"
                options: ["5", "6", "10", "12"]
                answer: ["6", "12"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Find the equivalent fraction."
            say: "One quarter is how many twelfths?"
            frame: "1/4 = _/12"
            options: ["3", "4", "9"]
            answer: ["3"]
          - id: l1-c2
            type: multiple_choice
            text: "Which fraction is equivalent to 6/8?"
            options: ["3/4", "4/6", "6/4"]
            answer: "3/4"
          - id: l1-c3
            type: true_false
            text: "Is it true? 3/4 = 4/5"
            say: "Is it true? Three quarters is equal to four fifths."
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Find the equivalent fraction."
            say: "Two thirds is how many twelfths?"
            frame: "2/3 = _/12"
            options: ["6", "8", "11"]
            answer: ["8"]
          - id: l1-c5
            type: multiple_choice
            text: "Which fraction is not in the family of 1/5?"
            options: ["2/10", "3/15", "2/6"]
            answer: "2/6"
          - id: l1-c6
            type: multiple_choice
            text: "Which fraction is equivalent to the shaded part?"
            show: { drawn: fraction, kind: bar, parts: 12, shaded: 9 }
            options: ["3/4", "1/4", "2/3"]
            answer: "3/4"

  - n: 2
    title: { de: Brüche vergleichen, en: Compare fractions }
    goal:
      de: "Vergleiche Brüche, indem du einen so umwandelst, dass die unteren Zahlen gleich sind. Drei Viertel sind sechs Achtel, also mehr als fünf Achtel."
      en: "Compare fractions by changing one so the bottom numbers match. Three quarters is six eighths, so it is more than five eighths."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Find the equivalent fraction."
            say: "One half is how many eighths?"
            frame: "1/2 = _/8"
            options: ["2", "4", "6"]
            answer: ["4"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which fraction is equivalent to 2/6?"
            options: ["1/3", "2/3", "1/4"]
            answer: "1/3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Would you rather have 3/4 of a cake or 5/8 of the same cake?"
            say: "Would you rather have three quarters of a cake, or five eighths of the same cake? Have a guess."
            show: { object: cake }
          - text: "3/4 or 5/8?\n3/4 = 6/8"
            say: "Take the three quarters! Here is why. To compare three quarters and five eighths, make the denominators the same. Eight is a multiple of four, so change the quarters into eighths. Three quarters is six eighths."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 6 }
          - text: "6/8 > 5/8, so 3/4 > 5/8."
            say: "Now both are eighths. Six eighths is more than five eighths, so three quarters is greater than five eighths."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 5 }
          - text: "2/3 or 5/6?\n2/3 = 4/6, and 4/6 < 5/6"
            say: "Six is a multiple of three. Two thirds is four sixths, and four sixths is less than five sixths. So two thirds is less than five sixths."
            show: { drawn: fraction, kind: bar, parts: 6, shaded: 4 }
          - text: "1/2 > 3/8"
            say: "Bigger numbers do not make a bigger fraction. Three eighths has bigger numbers than one half, but one half is four eighths, so one half is greater."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 3 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Make the denominators the same, then compare."
                frame: "3/4 = _/8, so 3/4 _ 5/8"
                options: ["3", "6", "<", ">"]
                option_audio: false
                answer: ["6", ">"]
                hints:
                  - "Change the quarters into eighths."
                  - "4 × 2 = 8 and 3 × 2 = 6. Compare 6/8 with 5/8."
                  - "6/8, so 3/4 > 5/8."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which is greater, 2/3 or 5/6?"
                options: ["2/3", "5/6", "They are equal."]
                answer: "5/6"
                hints:
                  - "Change the thirds into sixths."
                  - "2/3 = 4/6. Compare 4/6 with 5/6."
                  - "5/6 is greater."
              - id: l2-f3
                type: multiple_choice
                text: "Which is greater, 1/2 or 3/8?"
                options: ["1/2", "3/8", "They are equal."]
                answer: "1/2"
                feedback:
                  "3/8": "3/8 has bigger numbers, but 1/2 = 4/8, and 4/8 is more than 3/8."
                hints:
                  - "Change the half into eighths."
                  - "1/2 = 4/8. Compare 4/8 with 3/8."
                  - "1/2 is greater."
              - id: l2-f4
                type: true_false
                text: "Is it true? 3/5 = 6/10"
                say: "Is it true? Three fifths is equal to six tenths."
                answer: true
                hints:
                  - "Change the fifths into tenths."
                  - "5 × 2 = 10 and 3 × 2 = 6."
                  - "Yes. 3/5 = 6/10."
              - id: l2-f5
                type: ordering
                text: "Put the fractions in order, smallest first."
                options: ["7/8", "1/2", "3/8", "3/4"]
                slot_count: 4
                answer: ["3/8", "1/2", "3/4", "7/8"]
                hints:
                  - "Change them all into eighths."
                  - "1/2 = 4/8 and 3/4 = 6/8."
                  - "3/8, 4/8, 6/8, 7/8."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Write <, > or =."
                frame: "7/10 _ 3/5"
                options: ["<", ">", "="]
                option_audio: false
                answer: [">"]
                hints: ["3/5 = 6/10."]
              - id: l2-s2
                type: multiple_choice
                text: "Which is smaller, 5/12 or 1/3?"
                options: ["5/12", "1/3", "They are equal."]
                answer: "1/3"
                hints: ["Change the thirds into twelfths: 1/3 = 4/12."]
              - id: l2-s3
                type: fill_in_blank
                text: "Write <, > or =."
                frame: "2/4 _ 4/8"
                options: ["<", ">", "="]
                option_audio: false
                answer: ["="]
                hints: ["Change the quarters into eighths."]
              - id: l2-s4
                type: multiple_choice
                text: "Ella ate 3/8 of a pizza. Sam ate 1/4 of the same pizza. Who ate more?"
                options: ["Ella", "Sam", "They ate the same."]
                keep_order: true
                answer: "Ella"
                hints: ["1/4 = 2/8."]
              - id: l2-s5
                type: ordering
                text: "Put the fractions in order, smallest first."
                options: ["2/3", "1/6", "5/6", "1/2"]
                slot_count: 4
                answer: ["1/6", "1/2", "2/3", "5/6"]
                hints: ["Change them all into sixths."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Write <, > or =."
                frame: "5/6 _ 2/3"
                options: ["<", ">", "="]
                option_audio: false
                answer: [">"]
              - id: l2-n2
                type: multiple_choice
                text: "Which is greater, 3/10 or 2/5?"
                options: ["3/10", "2/5", "They are equal."]
                answer: "2/5"
              - id: l2-n3
                type: fill_in_blank
                text: "Write <, > or =."
                frame: "3/4 _ 9/12"
                options: ["<", ">", "="]
                option_audio: false
                answer: ["="]
              - id: l2-n4
                type: multiple_choice
                text: "One ribbon is 7/8 m long. Another is 3/4 m long. Which is longer?"
                options: ["the 7/8 m ribbon", "the 3/4 m ribbon", "They are the same length."]
                answer: "the 7/8 m ribbon"
              - id: l2-n5
                type: ordering
                text: "Put the fractions in order, smallest first."
                options: ["3/5", "9/10", "1/2", "7/10"]
                slot_count: 4
                answer: ["1/2", "3/5", "7/10", "9/10"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: find
            type: fill_in_blank
            text: "Find the equivalent fraction."
            say: "Two fifths is how many fifteenths?"
            frame: "2/5 = _/15"
            options: ["5", "6", "7"]
            answer: ["6"]
          - id: l2-c2
            part: family
            type: multiple_choice
            text: "Which fraction is not equal to 2/3?"
            options: ["4/6", "6/9", "3/4"]
            answer: "3/4"
          - id: l2-c3
            part: compare
            type: fill_in_blank
            text: "Write <, > or =."
            frame: "5/8 _ 1/2"
            options: ["<", ">", "="]
            option_audio: false
            answer: [">"]
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Which is greater, 3/4 or 7/12?"
            options: ["3/4", "7/12", "They are equal."]
            answer: "3/4"
          - id: l2-c5
            part: order
            type: ordering
            text: "Put the fractions in order, smallest first."
            options: ["1/3", "5/12", "1/6", "3/4"]
            slot_count: 4
            answer: ["1/6", "1/3", "5/12", "3/4"]
          - id: l2-c6
            part: find
            type: fill_in_blank
            text: "Find the equivalent fraction."
            say: "Ten twelfths is how many sixths?"
            frame: "10/12 = _/6"
            options: ["3", "5", "8"]
            answer: ["5"]
          - id: l2-c7
            part: find
            type: fill_in_blank
            text: "Find the equivalent fraction."
            say: "Four fifths is how many twentieths?"
            frame: "4/5 = _/20"
            options: ["8", "16", "19"]
            answer: ["16"]
          - id: l2-c8
            part: find
            type: multiple_choice
            text: "The bar shows 4/10. Which fraction in fifths is the same?"
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 4 }
            options: ["2/5", "4/5", "1/5"]
            answer: "2/5"
          - id: l2-c9
            part: find
            type: true_false
            text: "Is it true? 4/12 = 1/3"
            say: "Is it true? Four twelfths is equal to one third."
            answer: true
          - id: l2-c10
            part: family
            type: multiple_choice
            text: "Which fraction comes next in the family?\n1/4, 2/8, 3/12, _"
            say: "One quarter, two eighths, three twelfths. Which fraction comes next in the family?"
            options: ["4/16", "4/12", "5/16"]
            answer: "4/16"
          - id: l2-c11
            part: family
            type: multiple_choice
            text: "Which fraction is in the family of 1/3?"
            options: ["5/15", "3/6", "2/4"]
            answer: "5/15"
          - id: l2-c12
            part: family
            type: sorting
            text: "Sort the fractions: equal to 1/2 or not?"
            bins:
              - { id: half, show: { text: "equal to 1/2" }, say: "Equal to one half." }
              - { id: other, show: { text: "not equal to 1/2" }, say: "Not equal to one half." }
            options:
              - { text: "3/6", bin: half }
              - { text: "5/10", bin: half }
              - { text: "2/3", bin: other }
              - { text: "3/8", bin: other }
          - id: l2-c13
            part: family
            type: true_false
            text: "Is it true? 5/10 and 4/8 are in the same family."
            say: "Is it true? Five tenths and four eighths are in the same family."
            answer: true
          - id: l2-c14
            part: compare
            type: fill_in_blank
            text: "Write <, > or =."
            frame: "3/10 _ 1/5"
            options: ["<", ">", "="]
            option_audio: false
            answer: [">"]
          - id: l2-c15
            part: compare
            type: multiple_choice
            text: "Mia drank 1/2 of a bottle of juice. Joe drank 5/8 of the same size bottle. Who drank more?"
            options: ["Mia", "Joe", "They drank the same."]
            keep_order: true
            answer: "Joe"
          - id: l2-c16
            part: compare
            type: true_false
            text: "Is it true? 5/12 is greater than 1/2."
            say: "Is it true? Five twelfths is greater than one half."
            answer: false
          - id: l2-c17
            part: order
            type: ordering
            text: "Put the fractions in order, smallest first."
            options: ["3/4", "5/8", "1/4", "1/2"]
            slot_count: 4
            answer: ["1/4", "1/2", "5/8", "3/4"]
          - id: l2-c18
            part: order
            type: ordering
            text: "Put the fractions in order, greatest first."
            options: ["3/5", "1/2", "4/5", "3/10"]
            slot_count: 4
            answer: ["4/5", "3/5", "1/2", "3/10"]
          - id: l2-c19
            part: order
            type: multiple_choice
            text: "Which fraction is between 1/4 and 3/4?"
            options: ["1/2", "1/8", "7/8"]
            answer: "1/2"
          - id: l2-c20
            part: order
            type: multiple_choice
            text: "Which list is in order, smallest first?"
            options: ["1/4, 3/8, 1/2", "3/8, 1/4, 1/2", "1/2, 3/8, 1/4"]
            answer: "1/4, 3/8, 1/2"
