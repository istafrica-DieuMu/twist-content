# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.semi-written-div
skill: math.mult-div-larger.semi-written-div
curriculum: en-GB
language: en
title:
  de: Halbschriftlich teilen
  en: Dividing by partitioning
summary: >
  Dividing by a one-digit number with the steps written down. Lesson 1
  partitions the number into parts that divide easily (96 ÷ 4 = 80 ÷ 4 +
  16 ÷ 4), shown in a part-whole model, and checks with a
  multiplication; lesson 2 divides three-digit numbers (369 ÷ 3) and
  numbers that leave a remainder (97 ÷ 4 = 24 r 1), and ends with the
  skill check. The formal short division method comes in Year 5.
metadata:
  year: year-4
  topic: { de: Halbschriftlich malnehmen und teilen, en: Informal multiplication and division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.semi-written-mult, math.mult-div.remainder]
  also_practises: [math.mult-div-larger.tens, math.mult-div.remainder]
  vocabulary: { en: [partition, divide, divided by, part-whole, multiple, remainder, check] }
  forms: [drawn, text, audio]
  drawn: [part-whole]
  facets: [operation-signs]
  parts:
    - { id: split, what: { de: die Zahl geschickt zerlegen und in Teilaufgaben teilen, en: partitioning the number well and dividing in steps } }
    - { id: divide, what: { de: zwei- und dreistellige Zahlen durch eine einstellige Zahl teilen, en: dividing two- and three-digit numbers by a one-digit number } }
    - { id: remainder, what: { de: mit Rest teilen und die Probe machen, en: dividing with a remainder and checking } }
  misconceptions:
    - id: split-by-place
      what: Partitions into tens and ones even when the parts do not divide (78 ÷ 6 as 70 ÷ 6 + 8 ÷ 6)
      addressed: lesson 1 Learn picks 80 and 16 for 96 ÷ 4, not 90 and 6; "Which split helps?" in every stage of lesson 1 (l1-f1 with feedback, l1-s1, l1-n1) and l1-c2 offer the tens-and-ones split as a wrong option
    - id: remainder-too-big
      what: Leaves a remainder as big as or bigger than the number divided by (49 ÷ 3 = 15 r 4)
      addressed: lesson 2 Learn finishes the remainder; l2-f3 has 15 r 4 as an option with feedback, l2-s4 asks whether 15 r 4 is right, l2-c4 asks whether 59 ÷ 4 is 13 r 7
    - id: forget-a-part
      what: Divides only one part and forgets to add the other (96 ÷ 4 = 20)
      addressed: lesson 1 Learn adds the two answers; l1-f2 has 20 as a chip with feedback, l1-s2 and l1-n2 offer one part's answer as a chip
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Geschickt zerlegen", en: "Splitting to divide" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "80 ÷ 4 = _"
            say: "Eighty divided by four."
            answer: "20"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "23 ÷ 5 = _ r _"
            say: "Twenty-three divided by five."
            frame: "23 ÷ 5 = _ r _"
            options: ["3", "4", "5"]
            answer: ["4", "3"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "96 ÷ 4"
            say: "Ninety-six divided by four is too big to know straight away. Partition ninety-six into two parts that are easy to divide by four. Eighty and sixteen both divide by four."
            show: { drawn: part-whole, whole: 96, parts: [80, 16] }
          - text: "96 ÷ 4 = 80 ÷ 4 + 16 ÷ 4 = 20 + 4 = 24"
            say: "Eighty divided by four is twenty. Sixteen divided by four is four. Add the two answers: twenty-four."
          - text: "90 and 6? 90 ÷ 4 is not easy."
            say: "Why not ninety and six? Ninety and six do not divide by four. Look for a multiple of four times ten, such as forty or eighty, and make the other part a times table fact."
          - text: "Check: 24 × 4 = 96"
            say: "Check with a multiplication. Twenty-four times four is ninety-six, so the answer is right."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which split helps with 78 ÷ 6?"
                say: "Seventy-eight divided by six. Which split helps?"
                options: ["60 + 18", "70 + 8", "50 + 28"]
                answer: "60 + 18"
                feedback:
                  "70 + 8": "70 and 8 do not divide by 6. Start with ten sixes, 60, then see what is left."
                hints:
                  - "Both parts must divide by 6."
                  - "60 ÷ 6 = 10. What is left over from 78?"
                  - "60 + 18."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Work out 84 ÷ 3."
                say: "Eighty-four divided by three. Partition eighty-four into sixty and twenty-four."
                show: { drawn: part-whole, whole: 84, parts: [60, 24] }
                frame: "60 ÷ 3 = _, 24 ÷ 3 = _, 84 ÷ 3 = _"
                options: ["8", "20", "28", "30"]
                answer: ["20", "8", "28"]
                feedback:
                  "20": "That is only 60 ÷ 3. Add the answer for 24 ÷ 3 as well."
                hints:
                  - "Divide each part by 3, then add."
                  - "60 ÷ 3 = 20 and 24 ÷ 3 = 8."
                  - "20, 8 and 28."
              - id: l1-f3
                type: text_input
                text: "72 ÷ 4 = _"
                say: "Seventy-two divided by four."
                answer: "18"
                hints:
                  - "Split 72 into 40 and 32."
                  - "40 ÷ 4 = 10 and 32 ÷ 4 = 8."
                  - "10 + 8 = 18."
              - id: l1-f4
                type: true_false
                text: "Is it true? 65 ÷ 5 = 13, because 13 × 5 = 65."
                answer: true
                hints:
                  - "Check with the multiplication."
                  - "13 × 5 = 50 + 15."
                  - "Yes. 13 × 5 = 65."
              - id: l1-f5
                type: fill_in_blank
                text: "Work out 91 ÷ 7. 70 is one part. What is the other part?"
                say: "Ninety-one divided by seven. Seventy is one part. What is the other part?"
                show: { drawn: part-whole, whole: 91, parts: [70, null] }
                frame: "91 = 70 + _, 91 ÷ 7 = 10 + _ = _"
                options: ["3", "13", "21", "31"]
                answer: ["21", "3", "13"]
                hints:
                  - "91 − 70 is the other part."
                  - "The other part is 21, and 21 ÷ 7 = 3."
                  - "21, 3 and 13."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which split helps with 56 ÷ 4?"
                say: "Fifty-six divided by four. Which split helps?"
                options: ["50 + 6", "40 + 16", "30 + 26"]
                answer: "40 + 16"
                hints: ["Both parts must divide by 4."]
              - id: l1-s2
                type: fill_in_blank
                text: "Work out 75 ÷ 5."
                say: "Seventy-five divided by five. Partition seventy-five into fifty and twenty-five."
                show: { drawn: part-whole, whole: 75, parts: [50, 25] }
                frame: "50 ÷ 5 = _, 25 ÷ 5 = _, 75 ÷ 5 = _"
                options: ["5", "10", "15", "25"]
                answer: ["10", "5", "15"]
                hints: ["Divide each part, then add."]
              - id: l1-s3
                type: text_input
                text: "68 ÷ 4 = _"
                say: "Sixty-eight divided by four."
                answer: "17"
                hints: ["40 ÷ 4 and 28 ÷ 4."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 85 ÷ 5 = 15, because 15 × 5 = 85."
                answer: false
                hints: ["Work out 15 × 5."]
              - id: l1-s5
                type: text_input
                text: "96 ÷ 6 = _"
                say: "Ninety-six divided by six."
                answer: "16"
                hints: ["60 ÷ 6 and 36 ÷ 6."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which split helps with 87 ÷ 3?"
                say: "Eighty-seven divided by three. Which split helps?"
                options: ["80 + 7", "60 + 27", "70 + 17"]
                answer: "60 + 27"
              - id: l1-n2
                type: fill_in_blank
                text: "Work out 98 ÷ 7."
                say: "Ninety-eight divided by seven. Partition ninety-eight into seventy and twenty-eight."
                frame: "70 ÷ 7 = _, 28 ÷ 7 = _, 98 ÷ 7 = _"
                options: ["4", "10", "14", "28"]
                answer: ["10", "4", "14"]
              - id: l1-n3
                type: text_input
                text: "76 ÷ 4 = _"
                say: "Seventy-six divided by four."
                answer: "19"
              - id: l1-n4
                type: true_false
                text: "Is it true? 57 ÷ 3 = 19, because 19 × 3 = 57."
                answer: true
              - id: l1-n5
                type: text_input
                text: "Four friends share 92 marbles equally. How many does each friend get?"
                answer: "23"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "54 ÷ 3 = _"
            say: "Fifty-four divided by three."
            answer: "18"
          - id: l1-c2
            type: multiple_choice
            text: "Which split helps with 84 ÷ 6?"
            say: "Eighty-four divided by six. Which split helps?"
            options: ["80 + 4", "60 + 24", "70 + 14"]
            answer: "60 + 24"
          - id: l1-c3
            type: text_input
            text: "95 ÷ 5 = _"
            say: "Ninety-five divided by five."
            answer: "19"
          - id: l1-c4
            type: text_input
            text: "52 ÷ 4 = _"
            say: "Fifty-two divided by four."
            answer: "13"
          - id: l1-c5
            type: multiple_choice
            text: "Which split helps with 75 ÷ 3?"
            say: "Seventy-five divided by three. Which split helps?"
            options: ["70 + 5", "60 + 15", "50 + 25"]
            answer: "60 + 15"
          - id: l1-c6
            type: true_false
            text: "Is it true? 88 ÷ 4 = 22, because 22 × 4 = 88."
            say: "Is it true? Eighty-eight divided by four is twenty-two, because twenty-two times four is eighty-eight."
            answer: true

  - n: 2
    title: { de: "Dreistellig und mit Rest", en: "Three digits and remainders" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "64 ÷ 4 = _"
            say: "Sixty-four divided by four."
            answer: "16"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which split helps with 72 ÷ 6?"
            say: "Seventy-two divided by six. Which split helps?"
            options: ["70 + 2", "60 + 12", "50 + 22"]
            answer: "60 + 12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "369 ÷ 3 = 300 ÷ 3 + 60 ÷ 3 + 9 ÷ 3 = 100 + 20 + 3 = 123"
            say: "Three hundred and sixty-nine divided by three. Here every part divides by three, so partition into hundreds, tens and ones. One hundred, twenty and three make one hundred and twenty-three."
          - text: "192 ÷ 4 = 160 ÷ 4 + 32 ÷ 4 = 40 + 8 = 48"
            say: "One hundred and ninety-two divided by four. One hundred and sixty is forty fours. Thirty-two is eight fours. So the answer is forty-eight."
            show: { drawn: part-whole, whole: 192, parts: [160, 32] }
          - text: "97 ÷ 4 = 80 ÷ 4 + 17 ÷ 4 = 20 + 4 r 1 = 24 r 1"
            say: "Ninety-seven divided by four. Eighty divided by four is twenty. Seventeen divided by four is four, remainder one. So the answer is twenty-four remainder one. The remainder is smaller than four, so it is finished."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Work out 248 ÷ 2."
                say: "Two hundred and forty-eight divided by two. Partition into hundreds, tens and ones."
                frame: "200 ÷ 2 = _, 40 ÷ 2 = _, 8 ÷ 2 = _, 248 ÷ 2 = _"
                options: ["4", "20", "100", "124"]
                answer: ["100", "20", "4", "124"]
                hints:
                  - "Divide each part by 2."
                  - "Half of 200, half of 40, half of 8."
                  - "100, 20, 4 and 124."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "185 ÷ 5 = _"
                say: "One hundred and eighty-five divided by five."
                answer: "37"
                hints:
                  - "Split 185 into 150 and 35."
                  - "150 ÷ 5 = 30 and 35 ÷ 5 = 7."
                  - "30 + 7 = 37."
              - id: l2-f3
                type: multiple_choice
                text: "49 ÷ 3 = _"
                say: "Forty-nine divided by three."
                options: ["16 r 1", "15 r 4", "17 r 2"]
                answer: "16 r 1"
                feedback:
                  "15 r 4": "A remainder of 4 still holds another 3. Take one more 3 out: 16 r 1."
                hints:
                  - "Split 49 into 30 and 19."
                  - "30 ÷ 3 = 10, and 19 ÷ 3 = 6 r 1."
                  - "10 + 6 r 1 = 16 r 1."
              - id: l2-f4
                type: true_false
                text: "Is it true? 156 ÷ 6 = 26"
                say: "Is it true? One hundred and fifty-six divided by six is twenty-six."
                answer: true
                hints:
                  - "Check with a multiplication."
                  - "26 × 6 = 120 + 36."
                  - "Yes. 26 × 6 = 156."
              - id: l2-f5
                type: fill_in_blank
                text: "Work out 87 ÷ 5."
                say: "Eighty-seven divided by five. Partition into fifty and thirty-seven."
                frame: "50 ÷ 5 = _, 37 ÷ 5 = 7 r _, 87 ÷ 5 = _ r 2"
                options: ["2", "10", "17", "18"]
                answer: ["10", "2", "17"]
                hints:
                  - "Divide each part by 5."
                  - "50 ÷ 5 = 10 and 37 ÷ 5 = 7 r 2."
                  - "10, 2 and 17."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Work out 486 ÷ 2."
                say: "Four hundred and eighty-six divided by two. Partition into hundreds, tens and ones."
                frame: "400 ÷ 2 = _, 80 ÷ 2 = _, 6 ÷ 2 = _, 486 ÷ 2 = _"
                options: ["3", "40", "200", "243"]
                answer: ["200", "40", "3", "243"]
                hints: ["Halve each part, then add."]
              - id: l2-s2
                type: text_input
                text: "224 ÷ 4 = _"
                say: "Two hundred and twenty-four divided by four."
                answer: "56"
                hints: ["200 ÷ 4 and 24 ÷ 4."]
              - id: l2-s3
                type: multiple_choice
                text: "75 ÷ 4 = _"
                say: "Seventy-five divided by four."
                options: ["18 r 3", "17 r 7", "19 r 1"]
                answer: "18 r 3"
                hints: ["40 ÷ 4 = 10 and 35 ÷ 4 = 8 r 3."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 49 ÷ 3 = 15 r 4"
                say: "Is it true? Forty-nine divided by three is fifteen remainder four."
                answer: false
                hints: ["Can the remainder be 4 when you divide by 3?"]
              - id: l2-s5
                type: text_input
                text: "357 ÷ 7 = _"
                say: "Three hundred and fifty-seven divided by seven."
                answer: "51"
                hints: ["350 ÷ 7 and 7 ÷ 7."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A school buys 128 pencils in packs of 4. How many packs is that?"
                answer: "32"
              - id: l2-n2
                type: text_input
                text: "396 children go on a trip in 3 equal groups. How many children are in each group?"
                answer: "132"
              - id: l2-n3
                type: multiple_choice
                text: "Ollie shares 58 cards equally between 4 friends. How many does each friend get, and how many are left over?"
                options: ["14 r 2", "13 r 6", "15 r 2"]
                answer: "14 r 2"
              - id: l2-n4
                type: true_false
                text: "Is it true? 6 eggs fit in a box, so 138 eggs fill 23 boxes."
                answer: true
              - id: l2-n5
                type: text_input
                text: "A farmer packs 175 apples into bags of 5. How many bags does she fill?"
                answer: "35"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: divide
            type: text_input
            text: "84 ÷ 7 = _"
            say: "Eighty-four divided by seven."
            answer: "12"
          - id: l2-c2
            part: split
            type: multiple_choice
            text: "Which split helps with 92 ÷ 4?"
            say: "Ninety-two divided by four. Which split helps?"
            options: ["90 + 2", "80 + 12", "50 + 42"]
            answer: "80 + 12"
          - id: l2-c3
            part: divide
            type: text_input
            text: "264 ÷ 2 = _"
            say: "Two hundred and sixty-four divided by two."
            answer: "132"
          - id: l2-c4
            part: remainder
            type: true_false
            text: "Is it true? 59 ÷ 4 = 13 r 7"
            say: "Is it true? Fifty-nine divided by four is thirteen remainder seven."
            answer: false
          - id: l2-c5
            part: remainder
            type: multiple_choice
            text: "93 ÷ 6 = _"
            say: "Ninety-three divided by six."
            options: ["15 r 3", "14 r 9", "16 r 1"]
            answer: "15 r 3"
          - id: l2-c6
            part: split
            type: multiple_choice
            text: "Which split helps with 112 ÷ 8?"
            say: "One hundred and twelve divided by eight. Which split helps?"
            options: ["80 + 32", "100 + 12", "110 + 2"]
            answer: "80 + 32"
          - id: l2-c7
            part: split
            type: fill_in_blank
            text: "Work out 135 ÷ 5."
            say: "One hundred and thirty-five divided by five, in two steps."
            show: { drawn: part-whole, whole: 135, parts: [100, 35] }
            frame: "100 ÷ 5 = _, 35 ÷ 5 = _, 135 ÷ 5 = _"
            options: ["7", "20", "27", "35"]
            answer: ["20", "7", "27"]
          - id: l2-c8
            part: split
            type: fill_in_blank
            text: "Work out 78 ÷ 3. 60 is one part. What is the other part?"
            say: "Seventy-eight divided by three. Sixty is one part. What is the other part?"
            show: { drawn: part-whole, whole: 78, parts: [60, null] }
            frame: "78 = 60 + _, 78 ÷ 3 = 20 + _ = _"
            options: ["6", "8", "18", "26"]
            answer: ["18", "6", "26"]
          - id: l2-c9
            part: split
            type: true_false
            text: "Is it true? 90 + 6 is a good split for 96 ÷ 8."
            say: "Is it true? Ninety and six is a good split for ninety-six divided by eight."
            answer: false
          - id: l2-c10
            part: split
            type: multiple_choice
            text: "Which split helps with 144 ÷ 6?"
            say: "One hundred and forty-four divided by six. Which split helps?"
            options: ["120 + 24", "140 + 4", "100 + 44"]
            answer: "120 + 24"
          - id: l2-c11
            part: divide
            type: text_input
            text: "81 ÷ 3 = _"
            say: "Eighty-one divided by three."
            answer: "27"
          - id: l2-c12
            part: divide
            type: text_input
            text: "336 ÷ 3 = _"
            say: "Three hundred and thirty-six divided by three."
            answer: "112"
          - id: l2-c13
            part: divide
            type: multiple_choice
            text: "252 ÷ 4 = _"
            say: "Two hundred and fifty-two divided by four."
            options: ["63", "62", "68"]
            answer: "63"
          - id: l2-c14
            part: divide
            type: text_input
            text: "A baker shares 105 buns equally between 5 trays. How many buns go on each tray?"
            answer: "21"
          - id: l2-c15
            part: divide
            type: true_false
            text: "Is it true? 168 ÷ 8 = 21"
            say: "Is it true? One hundred and sixty-eight divided by eight is twenty-one."
            answer: true
          - id: l2-c16
            part: remainder
            type: multiple_choice
            text: "86 ÷ 3 = _"
            say: "Eighty-six divided by three."
            options: ["28 r 2", "27 r 5", "29 r 1"]
            answer: "28 r 2"
          - id: l2-c17
            part: split
            type: fill_in_blank
            text: "Work out 67 ÷ 4."
            say: "Sixty-seven divided by four. Partition it into forty and twenty-seven."
            frame: "40 ÷ 4 = _, 27 ÷ 4 = 6 r _, 67 ÷ 4 = _ r 3"
            options: ["3", "10", "16", "17"]
            answer: ["10", "3", "16"]
          - id: l2-c18
            part: remainder
            type: multiple_choice
            text: "Which calculation checks 79 ÷ 6 = 13 r 1?"
            say: "Seventy-nine divided by six is thirteen remainder one. Which calculation checks it?"
            options: ["13 × 6 + 1", "13 × 1 + 6", "6 × 1 + 13"]
            answer: "13 × 6 + 1"
          - id: l2-c19
            part: remainder
            type: text_input
            text: "Zoe has 74 stickers. She puts 5 on each page of her book. How many pages can she fill?"
            answer: "14"
          - id: l2-c20
            part: remainder
            type: true_false
            text: "Is it true? 115 ÷ 9 = 12 r 7"
            say: "Is it true? One hundred and fifteen divided by nine is twelve remainder seven."
            answer: true
