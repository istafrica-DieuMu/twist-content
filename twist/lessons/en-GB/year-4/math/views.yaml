# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.views
skill: math.space.views
curriculum: en-GB
language: en
title:
  de: Ansichten von vorne, von der Seite und von oben
  en: Views from the front, the side and above
summary: >
  Lesson 1 matches solids (a can, a cone, a ball, a cube) to how they look
  from the front and from above, and does the same for cube buildings in
  one row: from the front you see every tower, from above one square per
  tower, from the right only the tallest. Lesson 2 takes buildings with two
  rows, where a taller tower at the back shows over a lower one in front
  and the front row is on your left when you look from the right; it
  matches buildings to views and views to buildings, and ends with the
  skill check. Turning a building round on screen waits for a 3D view.
metadata:
  year: year-4
  topic: { de: Orientierung, en: Position and direction }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.solids.cube-buildings]
  also_practises: [math.solids.cube-buildings]
  vocabulary: { en: [view, front view, side view, view from above, plan, tower, row, column, hidden] }
  forms: [text, audio, drawn]
  drawn: [shape, cubes]
  facets: []
  parts:
    - { id: objects, what: { de: Ansichten von Gegenständen und Körpern zuordnen, en: matching views to everyday objects and solids } }
    - { id: front, what: { de: Würfelgebäude und ihre Ansicht von vorne zuordnen, en: matching cube buildings to their front view } }
    - { id: side, what: { de: die Ansicht eines Würfelgebäudes von rechts finden, en: finding the view of a cube building from the right } }
    - { id: top, what: { de: Würfelgebäude und ihre Ansicht von oben zuordnen, en: matching cube buildings to their view from above } }
  misconceptions:
    - id: count-all-cubes
      what: Thinks every cube shows in a view, so counts all the cubes from above or adds two towers in one column
      addressed: lesson 1 Learn shows one square per tower from above; l1-f3 has feedback on 6, l2-f2 offers the total, l2-f5 has feedback on adding the towers, l2-s2 and l2-c3 offer the total
    - id: front-row-only
      what: Draws only the front row in the front view and forgets taller towers behind
      addressed: lesson 2 Learn shows the back tower over the front one; l2-f1 has feedback on the front row only, l2-n1 and l2-c2 offer the front row, l1-f5 and l1-n4 ask about a tower behind
    - id: side-swapped
      what: Puts the back row on the left of the view from the right, or swaps left and right in the front view
      addressed: lesson 2 Learn says the front row is on your left from the right; l1-f2 and l2-f3 have feedback on the swapped view, l2-s3, l2-n3 and l2-c4 offer it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Von vorne, von der Seite, von oben", en: "From the front, the side and above" }
    goal:
      de: "Finde heraus, wie Dinge von vorne und von oben aussehen, so wie eine Dose, die von oben wie ein Kreis aussieht."
      en: "Match things to how they look from the front and from above, like a can that is a circle from above."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Here is a plan. How many cubes do you need for the building?"
            show: { drawn: cubes, plan: [[2, 1], [1, 3]], mode: plan, colour: orange }
            options: ["7", "4", "6"]
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many cubes is this building made of?"
            show: { drawn: cubes, plan: [[2, 2, 1]], mode: building, colour: blue }
            options: ["5", "3", "4"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "It is a circle from above and a rectangle from the front. What is it? Guess!"
            say: "Here is a riddle. From above it looks like a circle. From the front it looks like a rectangle. What could it be? Have a guess."
          - text: "A can: a rectangle from the front, a circle from above."
            say: "A can! Look at a can. From the front it looks like a rectangle. From above you see only the round lid, a circle. A solid looks different depending on where you look from. Each picture is called a view. A cone is a triangle from the front and a circle from above. A cube is a square from every side."
            show: { drawn: shape, kind: cylinder, colour: red }
          - text: "The front view: 1, 2 and 3 squares"
            say: "Here are three towers in a row: one cube, two cubes and three cubes. From the front you see them like a photo, as squares: one, then two, then three stacked up."
            show: { drawn: cubes, plan: [[1, 2, 3]], mode: front, colour: blue }
          - text: "The view from above: one square for each tower"
            say: "From above you see only the top cube of each tower: three squares in a row. You cannot tell how tall the towers are from above."
            show: { drawn: cubes, plan: [[1, 2, 3]], mode: top, colour: blue }
          - text: "Did you know? In Peru, giant pictures in the desert are best seen from above."
            say: "Did you know? In the desert in Peru there are giant pictures made by moving dark stones off the lighter ground: a hummingbird, a monkey and a spider. They are called the Nazca Lines and are more than fifteen hundred years old. They are so big that you see them best from above, from a plane or a high hill!"
          - text: "The view from the right: only the tallest tower"
            say: "Now look from the right. You see the tower of three cubes. The smaller towers stand behind it and are hidden."
            show: { drawn: cubes, plan: [[1, 2, 3]], mode: side, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "What does a can look like from above?"
                show: { drawn: shape, kind: cylinder, colour: green }
                options:
                  - { drawn: shape, kind: circle, colour: green }
                  - { drawn: shape, kind: rectangle, colour: green }
                  - { drawn: shape, kind: square, colour: green }
                answer: circle
                option_audio: false
                feedback:
                  rectangle: "That is the can from the front. From above you see the lid."
                hints:
                  - "Imagine the can on a table and you look down on it."
                  - "The lid is round."
                  - "A circle."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Which picture is the front view of this building?"
                show: { drawn: cubes, plan: [[2, 1, 3]], mode: building, colour: orange }
                options:
                  - { drawn: cubes, plan: [[3, 1, 2]], mode: front, colour: orange, key: swapped }
                  - { drawn: cubes, plan: [[2, 1, 3]], mode: front, colour: orange, key: front }
                  - { drawn: cubes, plan: [[2, 1, 3]], mode: top, colour: orange, key: above }
                answer: front
                feedback:
                  swapped: "Here left and right are swapped. From the front, the tower of 2 is on the left."
                  above: "That is the view from above. From the front you see how tall each tower is."
                hints:
                  - "Count the cubes in each tower, from left to right."
                  - "Left 2, middle 1, right 3."
                  - "Find the picture with 2, 1 and 3 squares stacked up."
              - id: l1-f3
                type: multiple_choice
                text: "How many squares do you see when you look at this building from above?"
                show: { drawn: cubes, plan: [[1, 3, 2]], mode: building, colour: green }
                options: ["3", "6", "2"]
                answer: "3"
                feedback:
                  "6": "6 is the number of all the cubes. From above you see only the top cube of each tower."
                hints:
                  - "From above you see each tower once."
                  - "How many towers are there?"
                  - "3 towers, so 3 squares."
              - id: l1-f4
                type: image_multiple_choice
                text: "What does a cone look like from the front?"
                show: { drawn: shape, kind: cone, colour: yellow }
                options:
                  - { drawn: shape, kind: triangle, colour: yellow }
                  - { drawn: shape, kind: circle, colour: yellow }
                  - { drawn: shape, kind: square, colour: yellow }
                answer: triangle
                option_audio: false
                feedback:
                  circle: "You see a circle from above. From the front the cone comes to a point."
                hints:
                  - "Imagine the cone at eye level in front of you."
                  - "It is wide at the bottom and comes to a point at the top."
                  - "A triangle."
              - id: l1-f5
                type: multiple_choice
                text: "You look at this building from the right. How many squares tall is the view?"
                show: { drawn: cubes, plan: [[3, 1, 2]], mode: building, colour: purple }
                options: ["3", "2", "6"]
                answer: "3"
                feedback:
                  "2": "The tower of 2 is nearest to you, but the tower of 3 behind it sticks up above it."
                hints:
                  - "From the right, the towers stand one behind the other."
                  - "You see the tallest tower, even when it is at the back."
                  - "The tallest tower has 3 cubes, so the view is 3 squares tall."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "A ball looks like a circle from the front and from above."
                say: "Is it true? A ball looks like a circle from the front and from above."
                show: { drawn: shape, kind: sphere, colour: red }
                answer: true
                hints: ["A ball is round whichever way you look."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which picture shows this building from above?"
                show: { drawn: cubes, plan: [[1, 3, 1]], mode: building, colour: blue }
                options:
                  - { drawn: cubes, plan: [[1, 3, 1]], mode: top, colour: blue, key: above }
                  - { drawn: cubes, plan: [[1, 3, 1]], mode: front, colour: blue, key: front }
                  - { drawn: cubes, plan: [[1, 3, 1]], mode: side, colour: blue, key: side }
                answer: above
                hints: ["From above, every tower is just one square."]
              - id: l1-s3
                type: multiple_choice
                text: "Which solid looks like a triangle from the front and a circle from above?"
                options: ["cone", "cylinder", "cube"]
                answer: "cone"
                hints: ["It has a round base and a point at the top."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Which picture is the front view of this building?"
                show: { drawn: cubes, plan: [[3, 2, 1]], mode: building, colour: green }
                options:
                  - { drawn: cubes, plan: [[3, 2, 1]], mode: front, colour: green, key: front }
                  - { drawn: cubes, plan: [[1, 2, 3]], mode: front, colour: green, key: swapped }
                  - { drawn: cubes, plan: [[3, 2, 1]], mode: side, colour: green, key: side }
                answer: front
                hints: ["Left 3, middle 2, right 1."]
              - id: l1-s5
                type: multiple_choice
                text: "A box shaped like a cuboid stands on the table. What shape do you see from the front?"
                show: { drawn: shape, kind: cuboid, colour: orange }
                options: ["rectangle", "circle", "triangle"]
                answer: "rectangle"
                hints: ["Its faces are flat with four straight sides."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "What do you see when you look at a cube from above?"
                show: { drawn: shape, kind: cube, colour: purple }
                options:
                  - { drawn: shape, kind: square, colour: purple }
                  - { drawn: shape, kind: circle, colour: purple }
                  - { drawn: shape, kind: triangle, colour: purple }
                answer: square
                option_audio: false
              - id: l1-n2
                type: image_multiple_choice
                text: "Which picture is the front view of this building?"
                show: { drawn: cubes, plan: [[1, 1, 2]], mode: building, colour: yellow }
                options:
                  - { drawn: cubes, plan: [[1, 1, 2]], mode: front, colour: yellow, key: front }
                  - { drawn: cubes, plan: [[2, 1, 1]], mode: front, colour: yellow, key: swapped }
                  - { drawn: cubes, plan: [[1, 1, 2]], mode: top, colour: yellow, key: above }
                answer: front
              - id: l1-n3
                type: multiple_choice
                text: "How many squares do you see when you look at this building from above?"
                show: { drawn: cubes, plan: [[2, 2, 3, 1]], mode: building, colour: red }
                options: ["4", "8", "3"]
                answer: "4"
              - id: l1-n4
                type: true_false
                text: "From the right, this building looks like a tower 1 cube tall."
                say: "Is it true? From the right, this building looks like a tower one cube tall."
                show: { drawn: cubes, plan: [[2, 1]], mode: building, colour: blue }
                answer: false
              - id: l1-n5
                type: text_input
                text: "From the front, a building in one row looks like 1, 2 and 3 squares stacked up. How many squares do you see from above?"
                answer: "3"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "What does a can look like from the front?"
            show: { drawn: shape, kind: cylinder, colour: blue }
            options:
              - { drawn: shape, kind: rectangle, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
              - { drawn: shape, kind: triangle, colour: blue }
            answer: rectangle
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "You look at this building from the right. How many squares tall is the view?"
            show: { drawn: cubes, plan: [[3, 2, 2]], mode: building, colour: orange }
            options: ["3", "2", "7"]
            answer: "3"
          - id: l1-c3
            type: image_multiple_choice
            text: "Which picture is the front view of this building?"
            show: { drawn: cubes, plan: [[2, 3, 1]], mode: building, colour: green }
            options:
              - { drawn: cubes, plan: [[2, 3, 1]], mode: front, colour: green, key: front }
              - { drawn: cubes, plan: [[1, 3, 2]], mode: front, colour: green, key: swapped }
              - { drawn: cubes, plan: [[2, 3, 1]], mode: top, colour: green, key: above }
            answer: front
          - id: l1-c4
            type: multiple_choice
            text: "How many squares do you see when you look at this building from above?"
            show: { drawn: cubes, plan: [[2, 1, 1, 3, 1]], mode: building, colour: purple }
            options: ["5", "8", "4"]
            answer: "5"
          - id: l1-c5
            type: true_false
            text: "From the front, this building looks like 2 squares, then 2, then 3."
            say: "Is it true? From the front, this building looks like two squares, then two, then three."
            show: { drawn: cubes, plan: [[2, 2, 3]], mode: building, colour: red }
            answer: true
          - id: l1-c6
            type: image_multiple_choice
            text: "Which picture shows this building from the right?"
            show: { drawn: cubes, plan: [[1, 2, 1]], mode: building, colour: yellow }
            options:
              - { drawn: cubes, plan: [[1, 2, 1]], mode: front, colour: yellow, key: front }
              - { drawn: cubes, plan: [[1, 2, 1]], mode: side, colour: yellow, key: side }
              - { drawn: cubes, plan: [[1, 2, 1]], mode: top, colour: yellow, key: above }
            answer: side

  - n: 2
    title: { de: Gebäude mit zwei Reihen, en: Buildings with two rows }
    goal:
      de: "Finde die Ansichten von Gebäuden mit zwei Reihen, bei denen ein hoher Turm hinten über einen kleinen vorne hinausragt."
      en: "Match buildings with two rows to their views, where a tall tower at the back shows over a small one."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many squares do you see when you look at this building from above?"
            show: { drawn: cubes, plan: [[3, 1, 1]], mode: building, colour: blue }
            options: ["3", "5", "1"]
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "What does a cone look like from above?"
            show: { drawn: shape, kind: cone, colour: red }
            options:
              - { drawn: shape, kind: circle, colour: red }
              - { drawn: shape, kind: triangle, colour: red }
              - { drawn: shape, kind: rectangle, colour: red }
            answer: circle
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "From the front: does the tall tower at the back hide, or show over the small one? Guess!"
            say: "This building has a tall tower at the back and a small tower in front of it. When you look from the front, do you think the tall tower hides, or shows over the small one? Have a guess."
            show: { drawn: cubes, plan: [[3, 1], [1, 2]], mode: building, colour: orange }
          - text: "Two rows: a back row and a front row"
            say: "This building has two rows of towers. At the back: three cubes on the left, one on the right. At the front: one cube on the left, two on the right."
            show: { drawn: cubes, plan: [[3, 1], [1, 2]], mode: building, colour: orange }
          - text: "The front view: 3 and 2"
            say: "It shows over it! From the front, the tall tower at the back on the left shows over the small one in front of it. So the left column is three squares tall. On the right, the front tower of two hides the back tower of one. You see the tallest tower in each column."
            show: { drawn: cubes, plan: [[3, 1], [1, 2]], mode: front, colour: orange }
          - text: "The view from the right: 2, then 3"
            say: "Now walk round to the right. The front row is nearest your left hand, so it is on the left of the view: two squares tall. The back row is on the right: three squares tall."
            show: { drawn: cubes, plan: [[3, 1], [1, 2]], mode: side, colour: orange }
          - text: "From above: one square for each tower"
            say: "From above you see four squares, one for each tower. It looks like the plan without the numbers."
            show: { drawn: cubes, plan: [[3, 1], [1, 2]], mode: top, colour: orange }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which picture is the front view of this building?"
                show: { drawn: cubes, plan: [[2, 1], [1, 1]], mode: building, colour: blue }
                options:
                  - { drawn: cubes, plan: [[2, 1], [1, 1]], mode: front, colour: blue, key: front }
                  - { drawn: cubes, plan: [[1, 1]], mode: front, colour: blue, key: front-row }
                  - { drawn: cubes, plan: [[2, 1], [1, 1]], mode: top, colour: blue, key: above }
                answer: front
                feedback:
                  front-row: "That is only the front row. The tower of 2 at the back sticks up above it."
                hints:
                  - "In each column, look for the tallest tower, front or back."
                  - "On the left the back tower has 2 cubes. On the right both have 1."
                  - "The front view is 2 squares tall on the left and 1 on the right."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How many squares do you see when you look at this building from above?"
                show: { drawn: cubes, plan: [[1, 3], [2, 1]], mode: building, colour: green }
                options: ["4", "7", "2"]
                answer: "4"
                feedback:
                  "7": "7 is all the cubes. From above you see one square for each tower."
                hints:
                  - "From above, each tower is one square."
                  - "There are 2 towers at the back and 2 at the front."
                  - "4 squares."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which picture shows this building from the right?"
                show: { drawn: cubes, plan: [[1, 3], [2, 1]], mode: building, colour: purple }
                options:
                  - { drawn: cubes, plan: [[1, 3], [2, 1]], mode: side, colour: purple, key: side }
                  - { drawn: cubes, plan: [[2, 1], [1, 3]], mode: side, colour: purple, key: swapped }
                  - { drawn: cubes, plan: [[1, 3], [2, 1]], mode: top, colour: purple, key: above }
                answer: side
                feedback:
                  swapped: "Here the rows are swapped. From the right, the front row is on your left."
                hints:
                  - "From the right, the front row is on the left of the view."
                  - "The front row's tallest tower has 2 cubes. The back row's has 3."
                  - "The view is 2 squares on the left and 3 on the right."
              - id: l2-f4
                type: image_multiple_choice
                text: "Which building has this front view?"
                show: { drawn: cubes, plan: [[1, 2], [2, 1]], mode: front, colour: orange }
                options:
                  - { drawn: cubes, plan: [[1, 2], [2, 1]], mode: building, colour: orange, key: a }
                  - { drawn: cubes, plan: [[1, 1], [1, 1]], mode: building, colour: orange, key: b }
                  - { drawn: cubes, plan: [[2, 1], [1, 1]], mode: building, colour: orange, key: c }
                answer: a
                hints:
                  - "The front view is 2 squares tall in both columns."
                  - "Each column needs a tower of 2, at the front or at the back."
                  - "It is the building with a tower of 2 in the left column and a tower of 2 in the right column."
              - id: l2-f5
                type: multiple_choice
                text: "Here is the plan of a building. How many squares tall is the left column of the front view?"
                show: { drawn: cubes, plan: [[3, 1], [2, 2]], mode: plan, colour: red }
                options: ["3", "5", "2"]
                answer: "3"
                feedback:
                  "5": "The two towers stand one behind the other, so you do not add them. You see the taller one."
                hints:
                  - "The left column has a tower at the back and one at the front."
                  - "The back one has 3 cubes, the front one 2."
                  - "You see the taller one: 3 squares."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Which picture is the front view of this building?"
                show: { drawn: cubes, plan: [[1, 2], [3, 1]], mode: building, colour: green }
                options:
                  - { drawn: cubes, plan: [[1, 2], [3, 1]], mode: front, colour: green, key: front }
                  - { drawn: cubes, plan: [[1, 2]], mode: front, colour: green, key: back-row }
                  - { drawn: cubes, plan: [[1, 2], [3, 1]], mode: top, colour: green, key: above }
                answer: front
                hints: ["In each column, find the tallest tower."]
              - id: l2-s2
                type: multiple_choice
                text: "How many squares do you see when you look at this building from above?"
                show: { drawn: cubes, plan: [[2, 2, 1], [1, 0, 1]], mode: plan, colour: blue }
                options: ["5", "6", "7"]
                answer: "5"
                hints: ["Count the squares with a number. An empty square has no tower."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which picture shows this building from the right?"
                show: { drawn: cubes, plan: [[2, 1], [1, 1]], mode: building, colour: orange }
                options:
                  - { drawn: cubes, plan: [[2, 1], [1, 1]], mode: side, colour: orange, key: side }
                  - { drawn: cubes, plan: [[1, 1], [2, 1]], mode: side, colour: orange, key: swapped }
                  - { drawn: cubes, plan: [[2, 1], [1, 1]], mode: top, colour: orange, key: above }
                answer: side
                hints: ["From the right, the front row is on your left."]
              - id: l2-s4
                type: true_false
                text: "From the front, you see the tallest tower in each column."
                say: "Is it true? From the front, you see the tallest tower in each column."
                answer: true
                hints: ["A tall tower at the back sticks up above a low one in front."]
              - id: l2-s5
                type: image_multiple_choice
                text: "From the front this building looks like 3 squares, then 1. From the right it looks like 1 square, then 3. Which plan fits?"
                options:
                  - { drawn: cubes, plan: [[3, 1], [1, 1]], mode: plan, colour: purple, key: a }
                  - { drawn: cubes, plan: [[1, 3], [1, 1]], mode: plan, colour: purple, key: b }
                  - { drawn: cubes, plan: [[1, 1], [3, 1]], mode: plan, colour: purple, key: c }
                answer: a
                hints: ["The plan shows the back row at the top. The tower of 3 must be at the back on the left."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which picture is the front view of this building?"
                show: { drawn: cubes, plan: [[2, 3], [1, 1]], mode: building, colour: red }
                options:
                  - { drawn: cubes, plan: [[2, 3], [1, 1]], mode: front, colour: red, key: front }
                  - { drawn: cubes, plan: [[3, 2], [1, 1]], mode: front, colour: red, key: swapped }
                  - { drawn: cubes, plan: [[1, 1]], mode: front, colour: red, key: front-row }
                answer: front
              - id: l2-n2
                type: multiple_choice
                text: "How many squares do you see when you look at this building from above?"
                show: { drawn: cubes, plan: [[3, 0], [1, 2]], mode: plan, colour: green }
                options: ["3", "4", "6"]
                answer: "3"
              - id: l2-n3
                type: image_multiple_choice
                text: "Which picture shows this building from the right?"
                show: { drawn: cubes, plan: [[3, 1], [2, 2]], mode: building, colour: blue }
                options:
