# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.plans-maps
skill: math.space.plans-maps
curriculum: en-GB
language: en
title:
  de: Pläne und Karten
  en: Plans and maps
summary: >
  Lesson 1 finds squares on a plan with a grid reference, the letter of
  the column first and then the number of the row (the shop is in B2),
  and gives the grid reference of a place. Lesson 2 follows and describes
  routes on a plan (2 squares right, 1 square down), puts the squares of a
  route in order, and ends with the skill check. The plans are tables
  with column letters and row numbers; a drawn map with pictures, and
  drawing a route on it, wait for a map component and a drawing task.
metadata:
  year: year-4
  topic: { de: Orientierung, en: Position and direction }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.space.follow-directions]
  also_practises: [math.space.follow-directions]
  vocabulary: { en: [plan, map, grid reference, square, column, row, left, right, up, down, route] }
  forms: [text, audio, drawn]
  drawn: [grid, table]
  facets: []
  parts:
    - { id: find, what: { de: ein Feld mit Koordinaten wie A3 finden, en: finding the square for a grid reference like A3 } }
    - { id: give-ref, what: { de: die Koordinaten eines Ortes angeben, en: giving the grid reference of a place } }
    - { id: follow, what: { de: einem Weg auf dem Plan folgen, en: following a route on a plan } }
    - { id: describe, what: { de: einen Weg auf dem Plan beschreiben, en: describing a route on a plan } }
  misconceptions:
    - id: number-first
      what: Writes the number first (2B) or swaps column and row (looks for A3 in column C, row 1)
      addressed: lesson 1 Learn says letter first, then number; l1-f2 has feedback on 2B, l1-f3 has feedback on reading A3 the wrong way round, l1-s2, l1-n1, l1-c1 and l2-c2 offer the number first
    - id: up-down-rows
      what: Goes the wrong way along the rows (up to a bigger number) or moves along the letters when told to go down
      addressed: lesson 2 Learn says right is the next letter and down the next number; l2-f1 has feedback on moving along the letters, l2-f2 has feedback on going down instead of up, l2-s3, l2-n3, l2-c4 and l2-c5 offer the route the wrong way
    - id: count-squares-not-steps
      what: Counts the start square as a step, so says 5 squares right from A to E
      addressed: lesson 2 Learn counts each step to a new square; l2-f4 has feedback on 5 squares, l2-n3 and l2-c4 offer one step too many
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Felder mit A3 finden, en: Grid references }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Start at S. Go 2 squares right. Which letter are you on?"
            show: { drawn: grid, cols: 5, rows: 3, labels: [[0, 1, "S"], [2, 1, "A"], [2, 0, "B"], [3, 1, "C"]] }
            options: ["A", "B", "C"]
            answer: "A"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Start at S. Go 1 square up, then 3 squares right. Which letter are you on?"
            show: { drawn: grid, cols: 5, rows: 3, labels: [[0, 2, "S"], [3, 1, "A"], [3, 2, "B"], [1, 1, "C"]] }
            options: ["A", "B", "C"]
            answer: "A"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Letters across the top, numbers down the side."
            say: "This plan of a town has a grid. The columns have letters across the top: A, B, C, D. The rows have numbers down the side: 1, 2, 3, 4."
            show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
          - text: "B2: column B, row 2"
            say: "To find square B2, go to column B, then go down to row 2. The shop is there. B2 is the grid reference of the shop."
            show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]], mark: [[1, 1]] }
          - text: "Letter first, then number: the park is in A1, the library is in D2."
            say: "A grid reference always gives the letter first, then the number. The park is in A1. The library is in D2."
            show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]], mark: [[0, 0], [1, 3]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is in square C1?"
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                options: ["school", "park", "library"]
                answer: "school"
                hints:
                  - "Find column C first."
                  - "Now go down column C to row 1, the top row."
                  - "In C1 is the school."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which square is the shop in?"
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                options: ["B2", "2B", "C2"]
                answer: "B2"
                feedback:
                  "2B": "The column letter comes first, then the row number: B2."
                hints:
                  - "Which column letter is above the shop?"
                  - "The shop is in column B and row 2."
                  - "Letter first: B2."
              - id: l1-f3
                type: multiple_choice
                text: "What is in square A3?"
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                options: ["station", "school", "café"]
                answer: "station"
                feedback:
                  "school": "The school is in C1. A3 means column A, row 3."
                hints:
                  - "The letter is the column, the number is the row."
                  - "Go to column A, then down to row 3."
                  - "In A3 is the station."
              - id: l1-f4
                type: multiple_choice
                text: "Which square is the pool in?"
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                options: ["D3", "C3", "D2"]
                answer: "D3"
                hints:
                  - "Look up from the pool to the letter."
                  - "The pool is in column D. Now look left to the row number."
                  - "Column D, row 3: D3."
              - id: l1-f5
                type: true_false
                text: "The café is in square B4."
                say: "Is it true? The café is in square B4."
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                answer: true
                hints:
                  - "Go to column B."
                  - "Go down column B to row 4."
                  - "Yes, the café is in B4."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What is in square D2?"
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                options: ["library", "pool", "shop"]
                answer: "library"
                hints: ["Column D first, then row 2."]
              - id: l1-s2
                type: multiple_choice
                text: "Which square is the hospital in?"
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                options: ["C4", "4C", "B4"]
                answer: "C4"
                hints: ["Letter first, then number."]
              - id: l1-s3
                type: true_false
                text: "The park is in square A2."
                say: "Is it true? The park is in square A2."
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                answer: false
                hints: ["Which row is the park in?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which two places are in column A?"
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                options: ["park and station", "park and school", "station and café"]
                answer: "park and station"
                hints: ["Column A goes down the left of the plan."]
              - id: l1-s5
                type: multiple_choice
                text: "Which place is in row 4, just left of the hospital?"
                show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
                options: ["café", "pool", "shop"]
                answer: "café"
                hints: ["Row 4 is the bottom row."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which square is the lake in?"
                show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
                options: ["C2", "2C", "B2"]
                answer: "C2"
              - id: l1-n2
                type: multiple_choice
                text: "What is in square D3?"
                show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
                options: ["church", "mill", "bridge"]
                answer: "church"
              - id: l1-n3
                type: true_false
                text: "The camp is in square A4."
                say: "Is it true? The camp is in square A4."
                show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "What is in square B1?"
                show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
                options: ["farm", "wood", "lake"]
                answer: "farm"
              - id: l1-n5
                type: text_input
                text: "The mill is in column D. Which row is it in? Type the number."
                show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
                answer: "1"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which square is the bridge in?"
            show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
            options: ["C4", "4C", "A4"]
            answer: "C4"
          - id: l1-c2
            type: multiple_choice
            text: "What is in square A2?"
            show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
            options: ["wood", "farm", "lake"]
            answer: "wood"
          - id: l1-c3
            type: true_false
            text: "The church is in square C3."
            say: "Is it true? The church is in square C3."
            show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "What is in square C2?"
            show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
            options: ["lake", "farm", "church"]
            answer: "lake"
          - id: l1-c5
            type: multiple_choice
            text: "Which square is the farm in?"
            show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
            options: ["B1", "1B", "B2"]
            answer: "B1"
          - id: l1-c6
            type: true_false
            text: "The wood and the camp are both in column A."
            say: "Is it true? The wood and the camp are both in column A."
            show: { drawn: table, sheet: true, header: false, rows: [["", "farm", "", "mill"], ["wood", "", "lake", ""], ["", "", "", "church"], ["camp", "", "bridge", ""]] }
            answer: true

  - n: 2
    title: { de: Wege auf dem Plan, en: Routes on a plan }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is in square B2?"
            show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
            options: ["shop", "café", "park"]
            answer: "shop"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which square is the library in?"
            show: { drawn: table, sheet: true, header: false, rows: [["park", "", "school", ""], ["", "shop", "", "library"], ["station", "", "", "pool"], ["", "café", "hospital", ""]] }
            options: ["D2", "2D", "D3"]
            answer: "D2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 square right: the next letter. 1 square down: the next number."
            say: "On this plan, one square right takes you to the next letter, from A1 to B1. One square down takes you to the next number, from A1 to A2. Up and left go back again."
            show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
          - text: "Home (A1), 3 squares right: B1, C1, D1. The park."
            say: "Start at home in A1. Go three squares right. Count each step to a new square: B1, C1, D1. You are at the park."
            show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]], mark: [[0, 0], [0, 3]] }
          - text: "Shop (C2), 1 square down, 2 squares left: C3, B3, A3. The school."
            say: "Start at the shop in C2. Go one square down to C3. Then go two squares left, past the pond in B3, to A3. You are at the school."
            show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]], mark: [[1, 2], [2, 0]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Start at home (A1). Go 2 squares down. Where are you?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["school", "farm", "pond"]
                answer: "school"
                feedback:
                  "farm": "The farm is to the right of home. Down means the next number in the same column."
                hints:
                  - "Down keeps the letter and changes the number."
                  - "From A1 go to A2, then A3."
                  - "A3 is the school."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Start at the shop (C2). Go 1 square up, then 1 square right. Where are you?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["park", "hall", "zoo"]
                answer: "park"
                feedback:
                  "hall": "That is down and right. Up goes to the smaller number: from row 2 to row 1."
                hints:
                  - "Up takes you to a smaller row number."
                  - "From C2, up is C1. Then right is D1."
                  - "D1 is the park."
              - id: l2-f3
                type: multiple_choice
                text: "Start at the school (A3). Go 1 square down, then 1 square right. Where are you?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["bridge", "pond", "mill"]
                answer: "bridge"
                hints:
                  - "Do one step at a time."
                  - "Down from A3 is A4. Right from A4 is B4."
                  - "B4 is the bridge."
              - id: l2-f4
                type: multiple_choice
                text: "How do you get from home (A1) to the zoo (E1)?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["4 squares right", "4 squares down", "5 squares right"]
                answer: "4 squares right"
                feedback:
                  "5 squares right": "You start in A1, so A is not a step. Count the steps: B, C, D, E. That is 4."
                hints:
                  - "Both are in row 1, so you only go right."
                  - "Count each step to a new square: B1, C1, D1, E1."
                  - "4 squares right."
              - id: l2-f5
                type: true_false
                text: "From the pond (B3), 1 square down takes you to the bridge (B4)."
                say: "Is it true? From the pond in B3, one square down takes you to the bridge in B4."
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                answer: true
                hints:
                  - "Down keeps the letter B."
                  - "The number goes from 3 to 4."
                  - "Yes, B4 is the bridge."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Start at the farm (B1). Go 2 squares down. Where are you?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["pond", "bridge", "shop"]
                answer: "pond"
                hints: ["B1, then B2, then B3."]
              - id: l2-s2
                type: multiple_choice
                text: "Start at the library (D4). Go 1 square up, then 1 square right. Where are you?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["pool", "café", "hall"]
                answer: "pool"
                hints: ["Up from D4 is D3. Then go one letter on."]
              - id: l2-s3
                type: multiple_choice
                text: "How do you get from the shop (C2) to the mill (C4)?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["2 squares down", "2 squares up", "2 squares right"]
                answer: "2 squares down"
                hints: ["The number gets bigger, from 2 to 4."]
              - id: l2-s4
                type: true_false
                text: "From the café (E2), 1 square down takes you to the zoo."
                say: "Is it true? From the café in E2, one square down takes you to the zoo."
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                answer: false
                hints: ["Down from E2 is E3. What is in E3?"]
              - id: l2-s5
                type: ordering
                text: "Start at home (A1). Go 2 squares right, then 1 square down. Put the squares you step on in order."
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["C2", "B1", "B2", "C1"]
                slot_count: 3
                answer: ["B1", "C1", "C2"]
                hints: ["Right first: the letter changes. Then down: the number changes."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Start at the park (D1). Go 2 squares down. Where are you?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["hall", "library", "café"]
                answer: "hall"
              - id: l2-n2
                type: multiple_choice
                text: "Start at the bridge (B4). Go 1 square up, then 1 square left. Where are you?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["school", "pond", "home"]
                answer: "school"
              - id: l2-n3
                type: multiple_choice
                text: "How do you get from the pond (B3) to the hall (D3)?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["2 squares right", "2 squares left", "3 squares right"]
                answer: "2 squares right"
              - id: l2-n4
                type: true_false
                text: "From the mill (C4), 2 squares up takes you to the shop."
                say: "Is it true? From the mill in C4, two squares up takes you to the shop."
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Start at A1. Go 3 squares right, then 1 square down. Which square are you in?"
                show: { drawn: table, sheet: true, header: false, rows: [["home", "farm", "", "park", "zoo"], ["", "", "shop", "", "café"], ["school", "pond", "", "hall", "pool"], ["", "bridge", "mill", "library", ""]] }
                options: ["D2", "C2", "D1"]
                answer: "D2"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: find
