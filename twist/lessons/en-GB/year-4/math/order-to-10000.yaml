# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.order-to-10000
skill: math.large-numbers.order-to-10000
curriculum: en-GB
language: en
title:
  de: Ordnen, vergleichen und runden bis 10 000
  en: Ordering, comparing and rounding to 10,000
summary: >
  Four-digit numbers on number lines, compared from the thousands, and
  rounded to the nearest 10, 100 and 1000, as Year 4 asks. Lesson 1
  places and reads numbers on lines in thousands and hundreds; lesson 2
  compares and orders, including a distance in a context; lesson 3
  rounds and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Zahlen bis 10 000, en: Numbers to 10 000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-10000, math.numbers-to-1000.round]
  also_practises: [math.numbers-to-1000.order-compare]
  vocabulary: { en: [number line, interval, greater than, less than, ascending, descending, round, nearest 1000] }
  forms: [drawn, text, audio]
  drawn: [number-line, place-value-chart]
  facets: [operation-signs]
  parts:
    - { id: number-line, what: { de: Zahlen bis 10 000 am Zahlenstrahl, en: "numbers to 10,000 on a number line" } }
    - { id: compare, what: { de: Zahlen bis 10 000 vergleichen, en: "comparing numbers to 10,000" } }
    - { id: order, what: { de: Zahlen bis 10 000 ordnen, en: "ordering numbers to 10,000" } }
    - { id: round, what: { de: "auf Zehner, Hunderter und Tausender runden", en: "rounding to the nearest 10, 100 and 1000" } }
  misconceptions:
    - id: interval
      what: Reads each interval as one hundred on a line in thousands
      addressed: lesson 1 Learn finds the interval of every line; full-stage feedback names the interval
    - id: digit-count
      what: Compares 999 and 1000 by the first digit
      addressed: lesson 2 Learn says a number with more digits is greater, then compares from the left
    - id: rounding-digit
      what: Uses the wrong digit to decide when rounding to the nearest 1000
      addressed: lesson 3 Learn names the deciding digit for each kind of rounding; tasks round one number three ways
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der Zahlenstrahl bis 10 000, en: "Number lines to 10,000" }
    goal:
      de: "Finde Zahlen auf dem Zahlenstrahl bis zehntausend. Frag zuerst, was ein Abschnitt wert ist, so wie bei 3700."
      en: "Find numbers on a number line to ten thousand. Ask first what each step is worth, like for 3700."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: point_on_line
            text: "Where is 600?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
            answer: 600
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Count in 1000s: 4000, 5000, 6000, _"
            options: ["6100", "7000", "6001"]
            answer: "7000"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "0 to 10,000"
            say: "This number line goes from zero to ten thousand in ten intervals, so each interval is one thousand."
            show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
          - text: "3000 to 4000"
            say: "Zoom in between three thousand and four thousand. Now each interval is one hundred: three thousand one hundred, three thousand two hundred, and so on."
            show: { drawn: number-line, from: 3000, to: 4000, step: 100, labels: ends }
          - text: "3700"
            say: "The arrow is seven intervals after three thousand: three thousand, seven hundred. Always ask first: what is each interval worth?"
            show: { drawn: number-line, from: 3000, to: 4000, step: 100, labels: ends, mark: 3700 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_line
                text: "Where is 4000?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
                answer: 4000
                hints:
                  - "Each interval is one thousand."
                  - "Count: one thousand, two thousand, ..."
                  - "4000 is the fourth mark after zero."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Where is the arrow pointing?"
                show: { drawn: number-line, from: 5000, to: 6000, step: 100, labels: ends, mark: 5300 }
                options: ["5003", "5030", "5300"]
                answer: "5300"
                feedback:
                  "5003": "Each interval here is one hundred, not one."
                  "5030": "Each interval here is one hundred, not ten."
                hints:
                  - "What is each interval worth?"
                  - "From 5000 to 6000 in ten intervals: each is one hundred."
                  - "Three intervals: 5300."
              - id: l1-f3
                type: point_on_line
                text: "Where is 2500?"
                show: { drawn: number-line, from: 2000, to: 3000, step: 100, labels: ends }
                answer: 2500
                hints:
                  - "2500 is halfway between 2000 and 3000."
                  - "The halfway mark is longer."
                  - "Tap the middle."
              - id: l1-f4
                type: multiple_choice
                text: "Estimate: where is the arrow pointing?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends, mark: 6500 }
                options: ["about 5500", "about 6500", "about 7500"]
                answer: "about 6500"
                hints:
                  - "Which thousands is the arrow between?"
                  - "Between 6000 and 7000, halfway."
                  - "About 6500."
              - id: l1-f5
                type: fill_in_blank
                text: "Which multiples of 1000 is 6750 between?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends, mark: 6750 }
                frame: "6750 is between _ and _"
                options: ["5000", "6000", "7000", "8000"]
                answer: ["6000", "7000"]
                hints:
                  - "6750 has 6 thousands."
                  - "Below it 6000, above it 7000."
                  - "Between 6000 and 7000."
              - id: l1-f6
                type: point_on_line
                text: "Where is 7900?"
                show: { drawn: number-line, from: 7000, to: 8000, step: 100, labels: ends }
                answer: 7900
                hints:
                  - "7900 is close to 8000."
                  - "One interval before 8000."
                  - "The mark before 8000."

          - support: some
            tasks:
              - id: l1-s1
                type: point_on_line
                text: "Where is 9000?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
                answer: 9000
                hints: ["One interval before 10,000."]
              - id: l1-s2
                type: multiple_choice
                text: "Where is the arrow pointing?"
                show: { drawn: number-line, from: 1000, to: 2000, step: 100, labels: ends, mark: 1600 }
                options: ["1006", "1060", "1600"]
                answer: "1600"
                hints: ["Each interval is one hundred."]
              - id: l1-s3
                type: point_on_line
                text: "Where is 4200?"
                show: { drawn: number-line, from: 4000, to: 5000, step: 100, labels: ends }
                answer: 4200
                hints: ["Start at 4000."]
              - id: l1-s4
                type: fill_in_blank
                text: "Which multiples of 1000 is 3080 between?"
                frame: "3080 is between _ and _"
                options: ["2000", "3000", "4000", "5000"]
                answer: ["3000", "4000"]
                hints: ["3080 has 3 thousands."]
              - id: l1-s5
                type: multiple_choice
                text: "Where is the arrow pointing?"
                show: { drawn: number-line, from: 6000, to: 7000, step: 100, labels: ends, mark: 6500 }
                options: ["6500", "6050", "6005"]
                answer: "6500"
                hints: ["Exactly halfway."]
              - id: l1-s6
                type: multiple_choice
                text: "Estimate: where is the arrow pointing?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends, mark: 1500 }
                options: ["about 500", "about 1500", "about 5000"]
                answer: "about 1500"
                hints: ["Between 1000 and 2000."]

          - support: none
            tasks:
              - id: l1-n1
                type: point_on_line
                text: "Where is 6000?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
                answer: 6000
              - id: l1-n2
                type: multiple_choice
                text: "Where is the arrow pointing?"
                show: { drawn: number-line, from: 8000, to: 9000, step: 100, labels: ends, mark: 8800 }
                options: ["8008", "8080", "8800"]
                answer: "8800"
              - id: l1-n3
                type: point_on_line
                text: "Where is 5100?"
                show: { drawn: number-line, from: 5000, to: 6000, step: 100, labels: ends }
                answer: 5100
              - id: l1-n4
                type: fill_in_blank
                text: "Which multiples of 1000 is 9450 between?"
                frame: "9450 is between _ and _"
                options: ["8000", "9000", "10,000", "9500"]
                answer: ["9000", "10,000"]
              - id: l1-n5
                type: multiple_choice
                text: "Where is the arrow pointing?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends, mark: 3000 }
                options: ["300", "3000", "30"]
                answer: "3000"
              - id: l1-n6
                type: point_on_line
                text: "Where is 2300?"
                show: { drawn: number-line, from: 2000, to: 3000, step: 100, labels: ends }
                answer: 2300

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: point_on_line
            text: "Where is 7000?"
            show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
            answer: 7000
          - id: l1-c2
            type: multiple_choice
            text: "Where is the arrow pointing?"
            show: { drawn: number-line, from: 4000, to: 5000, step: 100, labels: ends, mark: 4700 }
            options: ["4007", "4070", "4700"]
            answer: "4700"
          - id: l1-c3
            type: point_on_line
            text: "Where is 1800?"
            show: { drawn: number-line, from: 1000, to: 2000, step: 100, labels: ends }
            answer: 1800
          - id: l1-c4
            type: point_on_line
            text: "Where is 3000?"
            show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
            answer: 3000
          - id: l1-c5
            type: multiple_choice
            text: "Where is the arrow pointing?"
            show: { drawn: number-line, from: 9000, to: 10000, step: 100, labels: ends, mark: 9200 }
            options: ["9002", "9020", "9200"]
            answer: "9200"
          - id: l1-c6
            type: fill_in_blank
            text: "Which multiples of 1000 is 1450 between?"
            frame: "1450 is between _ and _"
            options: ["0", "1000", "1500", "2000"]
            answer: ["1000", "2000"]

  - n: 2
    title: { de: Vergleichen und ordnen, en: Comparing and ordering }
    goal:
      de: "Vergleiche vierstellige Zahlen von links, so wie 4281 ist größer als 4218, und bring sie in die richtige Reihenfolge."
      en: "Compare four-digit numbers from the left, like 4281 is more than 4218, and put them in order."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "582 _ 528"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is the 6 in 6213 worth?"
            options: ["60", "600", "6000"]
            answer: "6000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "999 < 1000"
            say: "A number with more digits is greater. Nine hundred and ninety-nine has three digits, one thousand has four. So one thousand is greater."
          - text: "4281 and 4218"
            say: "If both numbers have the same number of digits, compare from the left. The thousands are the same, and so are the hundreds. In the tens, eight is more than one."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [4, 2, 8, 1] }
          - text: "4281 and 4218: 4281 > 4218"
            say: "So four thousand, two hundred and eighty-one is greater than four thousand, two hundred and eighteen."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [4, 2, 1, 8] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "999 _ 1001"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "Nine is a big digit, but 1001 has four digits. More digits means greater."
                hints:
                  - "How many digits does each number have?"
                  - "999 has three digits, 1001 has four."
                  - "999 is less than 1001."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "6512 _ 6152"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "The thousands are the same."
                  - "Compare the hundreds: 5 and 1."
                  - "6512 is greater than 6152."
              - id: l2-f3
                type: ordering
                text: "Put the numbers in ascending order, smallest first."
                options: ["3050", "3500", "3005", "5300"]
                slot_count: 4
                answer: ["3005", "3050", "3500", "5300"]
                hints:
                  - "Which numbers have 3 thousands?"
                  - "For 3005, 3050 and 3500 the hundreds decide, then the tens."
                  - "3005, 3050, 3500, 5300."
              - id: l2-f4
                type: multiple_choice
                text: "Ben Nevis is 1345 m high. Snowdon is 1085 m high. Which is higher?"
                options: ["Ben Nevis", "Snowdon"]
                answer: "Ben Nevis"
                hints:
                  - "Compare 1345 and 1085."
                  - "The thousands are the same. Compare the hundreds: 3 and 0."
                  - "1345 is greater, so Ben Nevis is higher."
              - id: l2-f5
                type: multiple_choice
                text: "Which is the greatest?"
                options: ["8999", "9008", "9080"]
                answer: "9080"
                hints:
                  - "Which have the most thousands?"
                  - "9008 and 9080: compare the tens."
                  - "9080 is the greatest."
              - id: l2-f6
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ < 4000"
                options: ["4001", "3999", "4100"]
                answer: ["3999"]
                hints:
                  - "The number must be less than 4000."
                  - "Fewer than 4 thousands."
                  - "3999."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "2470 _ 2740"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Compare the hundreds."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "5000 + 300 _ 5300"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Work out the left side first."]
              - id: l2-s3
                type: ordering
                text: "Put the numbers in descending order, greatest first."
                options: ["1999", "9119", "9191", "1919"]
                slot_count: 4
                answer: ["9191", "9119", "1999", "1919"]
                hints: ["Compare from the left."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 10,000 > 9999"
                answer: true
                hints: ["More digits."]
              - id: l2-s5
                type: multiple_choice
                text: "A school raised £2470 and another raised £2407. Which raised more?"
                options: ["£2470", "£2407"]
                answer: "£2470"
                hints: ["Compare the tens."]
              - id: l2-s6
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ > 6990"
                options: ["6909", "6099", "7000"]
                answer: ["7000"]
                hints: ["Greater than 6990."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "8303 _ 8330"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Put the numbers in ascending order, smallest first."
                options: ["6006", "660", "6060", "6600"]
                slot_count: 4
                answer: ["660", "6006", "6060", "6600"]
              - id: l2-n3
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "1205 _ 1250"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? 3456 < 3465"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Which is the greatest?"
                options: ["7770", "7707", "7077"]
                answer: "7770"
              - id: l2-n6
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ < 2100"
                options: ["2101", "2010", "2110"]
                answer: ["2010"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "4090 _ 4009"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c2
            type: ordering
            text: "Put the numbers in ascending order, smallest first."
            options: ["2828", "8282", "2882", "8228"]
            slot_count: 4
            answer: ["2828", "2882", "8228", "8282"]
          - id: l2-c3
            type: multiple_choice
            text: "Which is the smallest?"
            options: ["5150", "5105", "5510"]
            answer: "5105"
          - id: l2-c4
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "6100 _ 6010"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c5
            type: ordering
            text: "Put the numbers in descending order, greatest first."
            options: ["3033", "3330", "3003", "3303"]
            slot_count: 4
            answer: ["3330", "3303", "3033", "3003"]
          - id: l2-c6
            type: true_false
            text: "Is it true? 2999 < 3000"
            say: "Is it true? Two thousand, nine hundred and ninety-nine is less than three thousand."
            answer: true

  - n: 3
    title: { de: Runden bis 10 000, en: "Rounding to the nearest 10, 100 and 1000" }
    goal:
      de: "Runde Zahlen auf Zehner, Hunderter und Tausender, so wie 3720 auf Tausender gerundet 4000 ist."
      en: "Round numbers to the nearest 10, 100 and 1000, like 3720 rounds to 4000 to the nearest thousand."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Round 471 to the nearest 100."
            options: ["400", "470", "500"]
            answer: "500"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "Round 645 to the nearest 10."
            options: ["640", "650", "600"]
            answer: "650"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3720 → 4000"
            say: "Rounding to the nearest thousand: three thousand, seven hundred and twenty is between three thousand and four thousand, and nearer to four thousand."
            show: { drawn: number-line, from: 3000, to: 4000, step: 100, labels: ends, mark: 3720 }
          - text: "The hundreds digit decides"
            say: "When you round to the nearest thousand, the hundreds digit decides: zero to four round down, five to nine round up. In three thousand, seven hundred and twenty it is seven, so round up."
          - text: "3720: 3720, 3700, 4000"
            say: "One number, rounded three ways. To the nearest ten it stays three thousand, seven hundred and twenty. To the nearest hundred it is three thousand, seven hundred. To the nearest thousand it is four thousand. The digit just to the right of the place you round to always decides."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Round 5300 to the nearest 1000."
                show: { drawn: number-line, from: 5000, to: 6000, step: 100, labels: ends, mark: 5300 }
                options: ["5000", "6000", "5300"]
                answer: "5000"
                hints:
                  - "Which thousands are either side of 5300?"
                  - "5000 and 6000. 5300 is nearer to 5000."
                  - "5300 rounds to 5000."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "Round 2650 to the nearest 1000."
                options: ["2000", "3000", "2700"]
                answer: "3000"
                feedback:
                  "2700": "That is the nearest 100. For the nearest 1000, the hundreds digit decides."
                hints:
                  - "The hundreds digit decides."
                  - "It is 6: round up."
                  - "2650 rounds to 3000."
              - id: l3-f3
                type: fill_in_blank
                text: "Round 8461."
                frame: "nearest 10: _  nearest 100: _  nearest 1000: _"
                options: ["8000", "8460", "8500", "8470"]
                answer: ["8460", "8500", "8000"]
                hints:
                  - "For the nearest 10, the ones digit 1 decides."
                  - "For the nearest 100 the tens digit 6, for the nearest 1000 the hundreds digit 4."
                  - "8460, 8500, 8000."
              - id: l3-f4
                type: true_false
                text: "Is it true? 7500 rounded to the nearest 1000 is 8000."
                answer: true
                hints:
                  - "7500 is exactly halfway."
                  - "Halfway rounds up."
                  - "Yes."
              - id: l3-f5
                type: text_input
                text: "Round 4980 to the nearest 100."
                answer: "5000"
                hints:
                  - "The hundreds either side are 4900 and 5000."
                  - "The tens digit is 8: round up."
                  - "4980 rounds to 5000."
              - id: l3-f6
                type: multiple_choice
                text: "A crowd of 6420 people watched a match. What is that to the nearest 1000?"
                options: ["6000", "6400", "7000"]
                answer: "6000"
                hints:
                  - "The hundreds digit decides."
                  - "It is 4: round down."
                  - "About 6000 people."

          - support: some
            tasks:
              - id: l3-s1
                type: multiple_choice
                text: "Round 1200 to the nearest 1000."
                options: ["1000", "2000", "1200"]
                answer: "1000"
                hints: ["The hundreds digit is 2."]
              - id: l3-s2
                type: multiple_choice
                text: "Round 9520 to the nearest 1000."
                options: ["9000", "10,000", "9500"]
                answer: "10,000"
                hints: ["The hundreds digit is 5."]
              - id: l3-s3
                type: fill_in_blank
                text: "Round 3049."
                frame: "nearest 10: _  nearest 100: _  nearest 1000: _"
                options: ["3000", "3050", "3040", "3100"]
                answer: ["3050", "3000", "3000"]
                hints: ["A different digit decides each time."]
              - id: l3-s4
                type: true_false
                text: "Is it true? 6449 rounded to the nearest 100 is 6500."
                answer: false
                hints: ["The tens digit is 4."]
              - id: l3-s5
                type: text_input
                text: "Round 2875 to the nearest 10."
                answer: "2880"
                hints: ["Halfway rounds up."]
              - id: l3-s6
                type: multiple_choice
                text: "Which number rounds to 2000 to the nearest 1000?"
                options: ["2600", "1400", "2300"]
                answer: "2300"
                hints: ["Which one is nearest to 2000?"]

          - support: none
            tasks:
              - id: l3-n1
                type: multiple_choice
                text: "Round 7800 to the nearest 1000."
                options: ["7000", "8000", "7800"]
                answer: "8000"
              - id: l3-n2
                type: text_input
                text: "Round 5555 to the nearest 100."
                answer: "5600"
              - id: l3-n3
                type: fill_in_blank
                text: "Round 6214."
                frame: "nearest 10: _  nearest 100: _  nearest 1000: _"
                options: ["6000", "6200", "6210", "6220"]
                answer: ["6210", "6200", "6000"]
