# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.compare-round-decimals
skill: math.decimals.compare-round
curriculum: en-GB
language: en
title:
  de: Dezimalzahlen vergleichen und runden
  en: Compare and round decimals
summary: >
  Comparing, ordering and rounding decimals with one and two decimal
  places. Lesson 1 compares from the biggest place and orders decimals,
  including pairs such as 0.5 and 0.45 where more digits does not mean
  bigger; lesson 2 rounds decimals with one place to the nearest whole
  number, as Year 4 asks, then two-place decimals to the nearest tenth
  (Year 5 in the National Curriculum, so those tasks are marked stretch),
  and ends with the skill check. Three decimal places come back in Year 5.
metadata:
  year: year-4
  topic: { de: Dezimalzahlen, en: Decimals }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.decimals.hundredths, math.numbers-to-1000.round]
  also_practises: [math.decimals.hundredths]
  vocabulary: { en: [compare, order, greater than, less than, round, nearest whole number, nearest tenth, halfway] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart, number-line]
  facets: [number-format, currency]
  parts:
    - { id: compare, what: { de: Dezimalzahlen vergleichen, en: comparing decimals } }
    - { id: order, what: { de: Dezimalzahlen ordnen, en: ordering decimals } }
    - { id: round, what: { de: auf Ganze oder Zehntel runden, en: rounding to the nearest whole number or tenth } }
    - { id: in-context, what: { de: "Längen, Gewichte und Preise vergleichen und runden", en: "comparing and rounding lengths, masses and prices" } }
  misconceptions:
    - id: longer-is-bigger
      what: Thinks a decimal with more digits is bigger (0.45 > 0.5, 1.09 > 1.1)
      addressed: lesson 1 Learn shows 0.5 = 0.50 on a number line; l1-f3 has feedback, and l1-f4, l1-f5, l1-n4, l1-c3 and l2-c2 ask it
    - id: halfway-rounds-down
      what: Rounds a number exactly halfway down (4.5 to 4), or rounds by dropping the decimal part
      addressed: lesson 2 Learn says halfway rounds up; l2-f3 has feedback, and l2-f1, l2-s3, l2-n2 and l2-c4 round up
    - id: wrong-place
      what: Rounds to the whole number when the nearest tenth is asked
      addressed: lesson 2 Learn rounds 2.36 to a tenth; l2-f5, l2-s5 and l2-c5 offer the whole number, and l2-n5 has the tenth typed
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Vergleichen und ordnen, en: Compare and order }
    goal:
      de: "Vergleiche Dezimalzahlen von links, zuerst die Einer, und sieh, dass null Komma fünf mehr ist als null Komma vier fünf."
      en: "Compare decimals from the left, starting with the ones, and see that zero point five is more than zero point four five."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 4, 7] }
            options: ["0.47", "0.74", "4.7"]
            answer: "0.47"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Round 470 to the nearest hundred."
            options: ["400", "470", "500"]
            answer: "500"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Which is bigger, 0.5 or 0.45?"
            say: "Which number do you think is bigger: zero point five, or zero point four five? Have a guess."
          - text: "0.5 > 0.45\n0.5 = 0.50"
            say: "Zero point five is bigger! More digits does not mean bigger. Zero point five is the same as zero point five zero: fifty hundredths. That is more than forty-five hundredths. On the number line, zero point four five comes first."
            show: { drawn: number-line, from: 0.4, to: 0.6, step: 0.01, labels: tens, mark: 0.45 }
          - text: "0.62 > 0.58"
            say: "To compare decimals, start with the biggest place, on the left. Both numbers have zero ones. Six tenths is more than five tenths, so zero point six two is greater than zero point five eight."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 6, 2] }
          - text: "2.3 < 3.1"
            say: "Look at the ones first. Two ones is less than three ones, so two point three is less than three point one. The tenths do not matter here."
          - text: "1.25 < 1.52 < 2.1"
            say: "To order decimals, compare the ones, then the tenths, then the hundredths. One point two five, one point five two, two point one."
          - text: "Did you know? At the 2008 Olympics, Michael Phelps won a swimming race in 50.58 seconds. The swimmer in second place took 50.59 seconds."
            say: "Did you know? At the 2008 Olympics, Michael Phelps won a swimming race in fifty point five eight seconds. The swimmer in second place took fifty point five nine seconds. He won by just one hundredth of a second!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Write <, > or =."
                frame: "0.62 _ 0.68"
                options: ["<", ">", "="]
                option_audio: false
                answer: ["<"]
                hints:
                  - "The ones and the tenths are the same. Look at the hundredths."
                  - "2 hundredths is less than 8 hundredths."
                  - "0.62 < 0.68."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which is the greatest?"
                options: ["3.4", "4.3", "3.9"]
                answer: "4.3"
                hints:
                  - "Look at the ones first."
                  - "Only one number has 4 ones."
                  - "4.3."
              - id: l1-f3
                type: multiple_choice
                text: "Which is greater, 0.5 or 0.45?"
                options: ["0.5", "0.45", "They are equal."]
                answer: "0.5"
                feedback:
                  "0.45": "0.45 has more digits, but 0.5 is 50 hundredths, and 50 is more than 45."
                hints:
                  - "Write 0.5 with two decimal places."
                  - "0.5 = 0.50. Compare 0.50 and 0.45."
                  - "5 tenths is more than 4 tenths, so 0.5 is greater."
              - id: l1-f4
                type: ordering
                text: "Put the numbers in order, smallest first."
                options: ["0.38", "0.83", "0.3", "0.8"]
                slot_count: 4
                answer: ["0.3", "0.38", "0.8", "0.83"]
                hints:
                  - "Sort them by tenths first."
                  - "Two have 3 tenths, two have 8 tenths. 0.3 is 0.30."
                  - "0.3, 0.38, 0.8, 0.83."
              - id: l1-f5
                type: true_false
                text: "Is it true? 1.09 is greater than 1.1."
                answer: false
                hints:
                  - "Both have 1 one. Compare the tenths."
                  - "1.09 has 0 tenths. 1.1 has 1 tenth."
                  - "No. 1.09 is less than 1.1."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Write <, > or =."
                frame: "5.27 _ 5.72"
                options: ["<", ">", "="]
                option_audio: false
                answer: ["<"]
                hints: ["The ones are the same. Compare the tenths."]
              - id: l1-s2
                type: multiple_choice
                text: "Which is the smallest?"
                options: ["0.61", "0.16", "0.6"]
                answer: "0.16"
                hints: ["Which has the fewest tenths?"]
              - id: l1-s3
                type: multiple_choice
                text: "Mia jumps 2.45 m. Tom jumps 2.54 m. Who jumps further?"
                options: ["Mia", "Tom", "They jump the same."]
                keep_order: true
                answer: "Tom"
                hints: ["Same metres. Compare the tenths."]
              - id: l1-s4
                type: ordering
                text: "Put the numbers in order, smallest first."
                options: ["7.1", "1.7", "7.01", "1.07"]
                slot_count: 4
                answer: ["1.07", "1.7", "7.01", "7.1"]
                hints: ["Ones first, then tenths."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 0.4 = 0.40"
                say: "Is it true? Zero point four is equal to zero point four zero."
                answer: true
                hints: ["4 tenths is 40 hundredths."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Write <, > or =."
                frame: "3.6 _ 3.59"
                options: ["<", ">", "="]
                option_audio: false
                answer: [">"]
              - id: l1-n2
                type: multiple_choice
                text: "Which is the greatest?"
                options: ["0.09", "0.9", "0.19"]
                answer: "0.9"
              - id: l1-n3
                type: ordering
                text: "Put the prices in order, cheapest first."
                options: ["£2.50", "£2.05", "£5.20", "£0.52"]
                slot_count: 4
                answer: ["£0.52", "£2.05", "£2.50", "£5.20"]
              - id: l1-n4
                type: true_false
                text: "Is it true? 0.75 is less than 0.8."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which number is between 0.4 and 0.5?"
                options: ["0.45", "0.54", "0.04"]
                answer: "0.45"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Write <, > or =."
            frame: "0.91 _ 0.19"
            options: ["<", ">", "="]
            option_audio: false
            answer: [">"]
          - id: l1-c2
            type: multiple_choice
            text: "Which is the smallest?"
            options: ["4.2", "2.4", "2.04"]
            answer: "2.04"
          - id: l1-c3
            type: true_false
            text: "Is it true? 0.3 is greater than 0.25."
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Write <, > or =."
            frame: "7.2 _ 7.19"
            options: ["<", ">", "="]
            option_audio: false
            answer: [">"]
          - id: l1-c5
            type: ordering
            text: "Put the numbers in order, smallest first."
            options: ["3.3", "3.03", "0.33", "3.13"]
            slot_count: 4
            answer: ["0.33", "3.03", "3.13", "3.3"]
          - id: l1-c6
            type: multiple_choice
            text: "Sara's ribbon is 0.6 m long. Jo's ribbon is 0.55 m long. Whose ribbon is longer?"
            options: ["Sara's", "Jo's", "They are the same."]
            keep_order: true
            answer: "Sara's"

  - n: 2
    title: { de: Dezimalzahlen runden, en: Round decimals }
    goal:
      de: "Runde Dezimalzahlen auf ganze Zahlen, indem du auf die Zehntel schaust, so wie drei Komma sieben wird zu 4."
      en: "Round decimals to the nearest whole number by looking at the tenths, like three point seven rounds to 4."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Write <, > or =."
            frame: "0.47 _ 0.5"
            options: ["<", ">", "="]
            option_audio: false
            answer: ["<"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is the greatest?"
            options: ["1.3", "1.03", "1.29"]
            answer: "1.3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A snail crawls 3.7 m. Is that closer to 3 m or to 4 m?"
            say: "A snail crawls three point seven metres. Is that closer to three metres or to four metres? Have a guess."
            show: { object: snail }
          - text: "3.7 rounds to 4."
            say: "It is closer to four. Three point seven is three tenths away from four and seven tenths away from three. So to the nearest whole number it rounds to four."
            show: { drawn: number-line, from: 3, to: 4, step: 0.1, labels: all, mark: 3.7 }
          - text: "3.5 rounds to 4."
            say: "Three point five is exactly halfway. The rule is the same as for whole numbers: halfway rounds up."
            show: { drawn: number-line, from: 3, to: 4, step: 0.1, labels: all, mark: 3.5 }
          - text: "6.2 rounds to 6.\nTenths 0 to 4: round down. Tenths 5 to 9: round up."
            say: "To round to the nearest whole number, look at the tenths. Two tenths is less than five, so six point two rounds down to six."
            show: { drawn: number-line, from: 6, to: 7, step: 0.1, labels: all, mark: 6.2 }
          - text: "2.36 rounds to 2.4 (nearest tenth)."
            say: "To round to the nearest tenth, look at the hundredths instead. Six hundredths is five or more, so two point three six rounds up to two point four."
            show: { drawn: number-line, from: 2.3, to: 2.4, step: 0.01, labels: ends, mark: 2.36 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Round 5.8 to the nearest whole number."
                show: { drawn: number-line, from: 5, to: 6, step: 0.1, labels: ends, mark: 5.8 }
                options: ["5", "6", "5.9"]
                answer: "6"
                hints:
                  - "Is the arrow closer to 5 or to 6?"
                  - "8 tenths is 5 or more, so round up."
                  - "6."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Round 7.3 to the nearest whole number."
                options: ["7", "8", "10"]
                answer: "7"
                hints:
                  - "Look at the tenths digit."
                  - "3 tenths is less than 5, so round down."
                  - "7."
              - id: l2-f3
                type: multiple_choice
                text: "Round 4.5 to the nearest whole number."
                options: ["4", "5", "4.5"]
                answer: "5"
                feedback:
                  "4": "4.5 is exactly halfway between 4 and 5. Halfway rounds up."
                hints:
                  - "Where is 4.5 between 4 and 5?"
                  - "It is exactly halfway."
                  - "Halfway rounds up: 5."
              - id: l2-f4
                type: text_input
                text: "Round 12.6 to the nearest whole number."
                answer: "13"
                hints:
                  - "Look at the tenths digit."
                  - "6 tenths is 5 or more, so 12 goes up by one."
                  - "13."
              - id: l2-f5
                type: multiple_choice
                text: "Round 3.42 to the nearest tenth."
                options: ["3.4", "3.5", "3"]
                answer: "3.4"
                difficulty: stretch
                hints:
                  - "For the nearest tenth, look at the hundredths."
                  - "3.42 is between 3.4 and 3.5. 2 hundredths is less than 5."
                  - "Round down: 3.4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Round 9.1 to the nearest whole number."
                show: { drawn: number-line, from: 9, to: 10, step: 0.1, labels: ends, mark: 9.1 }
                options: ["9", "10", "9.1"]
                answer: "9"
                hints: ["Which whole number is the arrow closer to?"]
              - id: l2-s2
                type: text_input
                text: "Round 6.9 to the nearest whole number."
                answer: "7"
                hints: ["9 tenths: round up."]
              - id: l2-s3
                type: multiple_choice
                text: "A pencil is 14.5 cm long. How long is it to the nearest centimetre?"
                options: ["14 cm", "15 cm", "14.5 cm"]
                answer: "15 cm"
                hints: ["14.5 is exactly halfway."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 8.49 rounds to 8 to the nearest whole number."
                answer: true
                hints: ["Look only at the tenths digit: 4."]
              - id: l2-s5
                type: multiple_choice
                text: "Round 1.87 to the nearest tenth."
                options: ["1.8", "1.9", "2"]
                answer: "1.9"
                difficulty: stretch
                hints: ["For the nearest tenth, look at the hundredths: 7."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Round 2.2 to the nearest whole number."
                answer: "2"
              - id: l2-n2
                type: text_input
                text: "Round 19.5 to the nearest whole number."
                answer: "20"
              - id: l2-n3
                type: multiple_choice
                text: "Which number rounds to 5 to the nearest whole number?"
                options: ["4.6", "5.5", "4.4"]
                answer: "4.6"
              - id: l2-n4
                type: multiple_choice
                text: "A bag of apples weighs 2.7 kg. How heavy is it to the nearest kilogram?"
                options: ["2 kg", "3 kg", "7 kg"]
                answer: "3 kg"
              - id: l2-n5
                type: text_input
                text: "Round 0.64 to the nearest tenth."
                keyboard: decimal
                answer: "0.6"
                difficulty: stretch

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: compare
            type: fill_in_blank
            text: "Write <, > or =."
            frame: "4.08 _ 4.8"
            options: ["<", ">", "="]
            option_audio: false
            answer: ["<"]
          - id: l2-c2
            part: order
            type: ordering
            text: "Put the numbers in order, smallest first."
            options: ["0.6", "0.06", "0.66", "0.16"]
            slot_count: 4
            answer: ["0.06", "0.16", "0.6", "0.66"]
          - id: l2-c3
            part: round
            type: text_input
            text: "Round 8.6 to the nearest whole number."
            answer: "9"
          - id: l2-c4
            part: round
            type: multiple_choice
            text: "Round 7.5 to the nearest whole number."
            options: ["7", "8", "7.5"]
            answer: "8"
          - id: l2-c5
            part: round
            type: multiple_choice
            text: "Round 5.23 to the nearest tenth."
            options: ["5.2", "5.3", "5"]
            answer: "5.2"
            difficulty: stretch
          - id: l2-c6
            part: compare
            type: fill_in_blank
            text: "Write <, > or =."
            frame: "0.7 _ 0.70"
            options: ["<", ">", "="]
            option_audio: false
            answer: ["="]
          - id: l2-c7
            part: compare
            type: multiple_choice
            text: "Which is the smallest?"
            options: ["0.5", "0.35", "0.53"]
            answer: "0.35"
          - id: l2-c8
            part: compare
            type: true_false
            text: "Is it true? 6.4 is greater than 6.38."
            answer: true
          - id: l2-c9
            part: compare
            type: fill_in_blank
            text: "Which digit makes it true?"
            frame: "0.4_ > 0.48"
            options: ["2", "7", "9"]
            answer: ["9"]
          - id: l2-c10
            part: order
            type: ordering
            text: "Put the numbers in order, greatest first."
            options: ["2.5", "2.05", "5.2", "2.55"]
            slot_count: 4
            answer: ["5.2", "2.55", "2.5", "2.05"]
          - id: l2-c11
            part: order
            type: ordering
            text: "Put the numbers in order, smallest first."
            options: ["1.4", "1.04", "0.41", "1.44"]
            slot_count: 4
            answer: ["0.41", "1.04", "1.4", "1.44"]
          - id: l2-c12
            part: order
            type: multiple_choice
            text: "Which list is in order, smallest first?"
            options: ["0.2, 0.25, 0.3", "0.25, 0.2, 0.3", "0.3, 0.25, 0.2"]
            answer: "0.2, 0.25, 0.3"
          - id: l2-c13
            part: order
            type: multiple_choice
            text: "Put 3.7, 3.07 and 3.17 in order. Which number comes in the middle?"
            options: ["3.7", "3.07", "3.17"]
            answer: "3.17"
          - id: l2-c14
            part: round
            type: text_input
            text: "Round 4.4 to the nearest whole number."
            answer: "4"
          - id: l2-c15
            part: round
            type: true_false
            text: "Is it true? 6.5 rounds to 6 to the nearest whole number."
            answer: false
          - id: l2-c16
            part: round
            type: multiple_choice
            text: "Round 6.75 to the nearest tenth."
            options: ["6.7", "6.8", "7"]
            answer: "6.8"
            difficulty: stretch
          - id: l2-c17
            part: in-context
            type: multiple_choice
            text: "A sunflower is 1.8 m tall. How tall is it to the nearest metre?"
            options: ["1 m", "2 m", "8 m"]
            answer: "2 m"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "Ali runs 100 m in 15.4 seconds. Ben runs 100 m in 15.38 seconds. Who is faster?"
            options: ["Ali", "Ben", "They are just as fast."]
            keep_order: true
            answer: "Ben"
          - id: l2-c19
            part: in-context
            type: ordering
            text: "Put the parcels in order, lightest first."
            options: ["1.5 kg", "1.25 kg", "0.9 kg", "1.52 kg"]
            slot_count: 4
            answer: ["0.9 kg", "1.25 kg", "1.5 kg", "1.52 kg"]
          - id: l2-c20
            part: in-context
            type: true_false
            text: "Is it true? A book costs £4.50 and a game costs £4.05. The book costs more."
            say: "Is it true? A book costs four pounds fifty, and a game costs four pounds five. The book costs more."
            answer: true
