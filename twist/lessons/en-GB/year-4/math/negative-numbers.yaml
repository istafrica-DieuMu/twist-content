# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.negative-numbers
skill: math.large-numbers.negative-numbers
curriculum: en-GB
language: en
title:
  de: Negative Zahlen
  en: Negative numbers
summary: >
  Counting back through zero and reading negative numbers. Lesson 1 counts
  back past zero in ones, twos, threes and fives and finds negative numbers
  on a number line; lesson 2 reads temperatures below zero on a
  thermometer, says which is colder, counts on and back through zero when
  the temperature rises or falls, and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Negative Zahlen, en: Negative numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.number-line]
  also_practises: [math.numbers-to-1000.number-line]
  vocabulary: { en: [negative number, zero, count back, below zero, degrees Celsius, colder, warmer, rises, falls] }
  forms: [drawn, text, audio]
  drawn: [number-line, thermometer]
  facets: []
  parts:
    - { id: count-back, what: { de: über die Null hinaus rückwärts zählen, en: counting back through zero } }
    - { id: number-line, what: { de: negative Zahlen am Zahlenstrahl, en: negative numbers on a number line } }
    - { id: thermometer, what: { de: Temperaturen unter null ablesen, en: reading temperatures below zero } }
    - { id: compare, what: { de: negative Zahlen und Temperaturen vergleichen, en: comparing negative numbers and temperatures } }
    - { id: rise-fall, what: { de: steigende und fallende Temperaturen, en: temperatures that rise and fall through zero } }
  misconceptions:
    - id: drops-the-sign
      what: Reads or places a negative number as the positive one (−4 as 4)
      addressed: lesson 1 Learn shows −3 to the left of zero; l1-f3 and l2-f1 have feedback on the positive number, and l1-f2, l2-s4 and l2-n5 offer it
    - id: bigger-digit-bigger-number
      what: Thinks −4 is greater, or warmer, than −1 because 4 is more than 1
      addressed: lesson 2 Learn compares −3 °C with −1 °C; l2-f3 has feedback, and l1-f5, l1-n5, l2-s2, l2-s5, l2-n3 and l2-c4 ask it
    - id: stuck-at-zero
      what: Counts back to zero and then up again (1, 0, 1), or does not count zero as a step
      addressed: lesson 1 Learn counts on past zero; l1-f1 offers 1 after 0, l1-s5 asks it, and l2-f4, l2-s3 and l2-c5 fall through zero
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Über die Null zurückzählen, en: Count back through zero }
    goal:
      de: "Zähl über die Null hinaus zurück zu den negativen Zahlen, so wie 2, 1, 0, minus 1, minus 2."
      en: "Count back past zero into negative numbers, like 2, 1, 0, negative 1, negative 2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What number does the arrow point to?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 600 }
            options: ["600", "60", "700"]
            answer: "600"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Count back in ones."
            frame: "4, 3, 2, _"
            options: ["0", "1", "5"]
            answer: ["1"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3, 2, 1, 0, −1, −2, −3"
            say: "Count back past zero and keep going: negative one, negative two, negative three. Numbers below zero are negative numbers. We write them with a minus sign in front."
            show: { drawn: number-line, from: -5, to: 5, labels: all, jumps: [[3, -1], [2, -1], [1, -1], [0, -1], [-1, -1], [-2, -1]] }
          - text: "−3 is 3 steps below zero."
            say: "Negative three is three steps to the left of zero. The further left a number is, the smaller it is."
            show: { drawn: number-line, from: -5, to: 5, labels: all, mark: -3 }
          - text: "−2, −1, 0, 1, 2"
            say: "Counting on goes to the right: negative two, negative one, zero, one, two. Zero counts as a step too."
            show: { drawn: number-line, from: -5, to: 5, labels: all, jumps: [[-2, 1], [-1, 1], [0, 1], [1, 1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Count back in ones."
                frame: "3, 2, 1, 0, _ , _"
                options: ["1", "−1", "−2"]
                answer: ["−1", "−2"]
                hints:
                  - "After zero, keep counting back."
                  - "The numbers below zero are negative: they get a minus sign."
                  - "−1, then −2."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What number does the arrow point to?"
                show: { drawn: number-line, from: -5, to: 5, labels: all, mark: -4 }
                options: ["−4", "4", "−6"]
                answer: "−4"
                hints:
                  - "Is the arrow left or right of zero?"
                  - "It is 4 steps to the left of zero."
                  - "−4."
              - id: l1-f3
                type: point_on_line
                text: "Where is −6?"
                say: "Where is negative six?"
                show: { drawn: number-line, from: -10, to: 10, labels: tens }
                answer: -6
                feedback:
                  "6": "That is 6. Negative six is 6 steps to the left of zero."
                hints:
                  - "Negative numbers are to the left of zero."
                  - "Start at 0 and count 6 steps left."
                  - "−6 is 4 steps right of −10."
              - id: l1-f4
                type: multiple_choice
                text: "Count back 5 steps from 2. Where do you land?"
                show: { drawn: number-line, from: -5, to: 5, labels: all }
                options: ["−3", "−2", "3"]
                answer: "−3"
                hints:
                  - "Count each step out loud: 1, 0, ..."
                  - "2 back to 0 is 2 steps. 3 more steps go below zero."
                  - "−3."
              - id: l1-f5
                type: true_false
                text: "Is it true? −5 is less than −2."
                say: "Is it true? Negative five is less than negative two."
                answer: true
                hints:
                  - "Which is further to the left on the number line?"
                  - "−5 is further from zero, on the left."
                  - "Yes. −5 is less than −2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What number does the arrow point to?"
                show: { drawn: number-line, from: -10, to: 0, labels: ends, mark: -7 }
                options: ["−7", "−3", "7"]
                answer: "−7"
                hints: ["Count left from 0."]
              - id: l1-s2
                type: fill_in_blank
                text: "Count back in twos."
                frame: "6, 4, 2, 0, _ , _"
                options: ["−1", "−2", "−3", "−4"]
                answer: ["−2", "−4"]
                hints: ["Keep taking 2 away after zero."]
              - id: l1-s3
                type: point_on_line
                text: "Where is −2?"
                say: "Where is negative two?"
                show: { drawn: number-line, from: -10, to: 10, labels: tens }
                answer: -2
                hints: ["2 steps left of zero."]
              - id: l1-s4
                type: multiple_choice
                text: "Which number is 3 less than 1?"
                options: ["−2", "2", "−3"]
                answer: "−2"
                hints: ["1, 0, then 2 more steps back."]
              - id: l1-s5
                type: true_false
                text: "Is it true? When you count back, the number after 0 is 1."
                answer: false
                hints: ["Counting back after 0 goes below zero."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What number does the arrow point to?"
                show: { drawn: number-line, from: -10, to: 10, labels: tens, mark: -8 }
                options: ["−8", "−2", "8"]
                answer: "−8"
              - id: l1-n2
                type: fill_in_blank
                text: "Count back in fives."
                frame: "15, 10, 5, 0, _ , _"
                options: ["5", "−5", "−10", "−15"]
                answer: ["−5", "−10"]
              - id: l1-n3
                type: point_on_line
                text: "Where is −9?"
                say: "Where is negative nine?"
                show: { drawn: number-line, from: -10, to: 10, labels: tens }
                answer: -9
              - id: l1-n4
                type: multiple_choice
                text: "Which number is 4 less than 2?"
                options: ["−2", "2", "−6"]
                answer: "−2"
              - id: l1-n5
                type: ordering
                text: "Put the numbers in order, smallest first."
                options: ["3", "−1", "−4", "0"]
                slot_count: 4
                answer: ["−4", "−1", "0", "3"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What number does the arrow point to?"
            show: { drawn: number-line, from: -5, to: 5, labels: all, mark: -2 }
            options: ["−2", "2", "−3"]
            answer: "−2"
          - id: l1-c2
            type: fill_in_blank
            text: "Count back in ones."
            frame: "1, 0, _ , _"
            options: ["2", "−1", "−2"]
            answer: ["−1", "−2"]
          - id: l1-c3
            type: point_on_line
            text: "Where is −5?"
            say: "Where is negative five?"
            show: { drawn: number-line, from: -10, to: 10, labels: tens }
            answer: -5
          - id: l1-c4
            type: multiple_choice
            text: "Which number is 5 less than 1?"
            options: ["−4", "4", "−5"]
            answer: "−4"
          - id: l1-c5
            type: fill_in_blank
            text: "Count back in threes."
            frame: "9, 6, 3, _ , _"
            options: ["0", "1", "−3", "−6"]
            answer: ["0", "−3"]
          - id: l1-c6
            type: point_on_line
            text: "Where is −4?"
            say: "Where is negative four?"
            show: { drawn: number-line, from: -10, to: 10, labels: tens }
            answer: -4

  - n: 2
    title: { de: Temperaturen unter null, en: Temperatures below zero }
    goal:
      de: "Lies Temperaturen unter null am Thermometer ab und zähl durch die Null zurück, wenn es kälter wird."
      en: "Read temperatures below zero on a thermometer, and count down through zero when it gets colder."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What number does the arrow point to?"
            show: { drawn: number-line, from: -10, to: 10, labels: tens, mark: -3 }
            options: ["−3", "3", "−7"]
            answer: "−3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which number is 2 less than 1?"
            options: ["−1", "1", "−2"]
            answer: "−1"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "15 °C"
            say: "A thermometer is a number line standing up. This one shows fifteen degrees Celsius."
            show: { drawn: thermometer, from: -10, to: 20, step: 5, value: 15 }
          - text: "−5 °C"
            say: "Below zero the numbers are negative. This shows negative five degrees: five degrees below zero. Water freezes at zero degrees, so it is icy outside."
            show: { drawn: thermometer, from: -10, to: 20, step: 5, value: -5 }
          - text: "−3 °C is colder than −1 °C."
            say: "The lower the red line, the colder it is. Negative three degrees is colder than negative one degree, because it is further below zero."
            show: { drawn: thermometer, from: -5, to: 5, step: 1, value: -3 }
          - text: "2 °C falls by 5 degrees: 2, 1, 0, −1, −2, −3"
            say: "When the temperature falls past zero, count back through zero. Two degrees, falling by five degrees, is negative three degrees."
            show: { drawn: number-line, from: -5, to: 5, labels: all, jumps: [[2, -5]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: -10, to: 20, step: 5, value: -5 }
                options: ["−5 °C", "5 °C", "−15 °C"]
                answer: "−5 °C"
                feedback:
                  "5 °C": "The red line stops below zero, so the temperature is negative."
                hints:
                  - "Is the top of the red line above or below 0?"
                  - "It is below 0, at the first mark under it."
                  - "−5 °C."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: -5, to: 5, step: 1, value: -2 }
                options: ["−2 °C", "2 °C", "−3 °C"]
                answer: "−2 °C"
                hints:
                  - "Find 0 on the scale."
                  - "Count the marks down from 0 to the top of the red line."
                  - "2 below zero: −2 °C."
              - id: l2-f3
                type: multiple_choice
                text: "Which is colder, −4 °C or −1 °C?"
                options: ["−4 °C", "−1 °C"]
                answer: "−4 °C"
                feedback:
                  "−1 °C": "−1 °C is closer to zero. −4 °C is further below zero, so it is colder."
                hints:
                  - "Colder means lower on the thermometer."
                  - "Which one is further below zero?"
                  - "−4 °C is 4 degrees below zero: colder."
              - id: l2-f4
                type: multiple_choice
                text: "It is 3 °C. The temperature falls by 4 degrees. What is it now?"
                options: ["−1 °C", "1 °C", "7 °C"]
                answer: "−1 °C"
                hints:
                  - "Falls means count back."
                  - "3, 2, 1, 0 is 3 steps. One more step goes below zero."
                  - "−1 °C."
              - id: l2-f5
                type: true_false
                text: "Is it true? The thermometer shows −8 °C."
                show: { drawn: thermometer, from: -10, to: 10, step: 2, value: -8 }
                answer: true
                hints:
                  - "Find 0, then look below it."
                  - "The marks go up in twos."
                  - "Yes, −8 °C."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: -10, to: 10, step: 2, value: -6 }
                options: ["−6 °C", "6 °C", "−4 °C"]
                answer: "−6 °C"
                hints: ["The red line ends below zero."]
              - id: l2-s2
                type: multiple_choice
                text: "Which is warmer, −7 °C or −2 °C?"
                options: ["−7 °C", "−2 °C"]
                answer: "−2 °C"
                hints: ["Warmer means closer to zero, higher on the thermometer."]
              - id: l2-s3
                type: multiple_choice
                text: "It is 1 °C. The temperature falls by 3 degrees. What is it now?"
                options: ["−2 °C", "2 °C", "−3 °C"]
                answer: "−2 °C"
                hints: ["Count back: 1, 0, then below zero."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Which thermometer shows −3 °C?"
                options:
                  - { drawn: thermometer, from: -5, to: 5, step: 1, value: -3, key: m3 }
                  - { drawn: thermometer, from: -5, to: 5, step: 1, value: 3, key: p3 }
                  - { drawn: thermometer, from: -5, to: 5, step: 1, value: -2, key: m2 }
                answer: m3
                hints: ["The red line must stop 3 marks below zero."]
              - id: l2-s5
                type: true_false
                text: "Is it true? −10 °C is warmer than −5 °C."
                answer: false
                hints: ["Which is further below zero?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: -10, to: 20, step: 5, value: -10 }
                options: ["−10 °C", "10 °C", "0 °C"]
                answer: "−10 °C"
              - id: l2-n2
                type: multiple_choice
                text: "It is −2 °C at night. By the morning it is 5 degrees warmer. What is the temperature in the morning?"
                options: ["3 °C", "−7 °C", "7 °C"]
                answer: "3 °C"
              - id: l2-n3
                type: ordering
                text: "Put the temperatures in order, coldest first."
                options: ["2 °C", "−6 °C", "−1 °C", "0 °C"]
                slot_count: 4
                answer: ["−6 °C", "−1 °C", "0 °C", "2 °C"]
              - id: l2-n4
                type: multiple_choice
                text: "The temperature is −4 °C. It falls by 2 degrees. What is it now?"
                options: ["−6 °C", "−2 °C", "2 °C"]
                answer: "−6 °C"
              - id: l2-n5
                type: true_false
                text: "Is it true? The thermometer shows −4 °C."
                show: { drawn: thermometer, from: -10, to: 10, step: 2, value: 4 }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: number-line
            type: point_on_line
            text: "Where is −7?"
            say: "Where is negative seven?"
            show: { drawn: number-line, from: -10, to: 10, labels: tens }
            answer: -7
          - id: l2-c2
            part: count-back
            type: fill_in_blank
            text: "Count back in threes."
            frame: "6, 3, 0, _ , _"
            options: ["3", "−3", "−6", "−9"]
            answer: ["−3", "−6"]
          - id: l2-c3
            part: thermometer
            type: multiple_choice
            text: "What temperature does the thermometer show?"
            show: { drawn: thermometer, from: -10, to: 10, step: 2, value: -4 }
            options: ["−4 °C", "4 °C", "−6 °C"]
            answer: "−4 °C"
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Which is colder, −9 °C or −3 °C?"
            options: ["−9 °C", "−3 °C"]
            answer: "−9 °C"
          - id: l2-c5
            part: rise-fall
            type: multiple_choice
            text: "It is 4 °C. The temperature falls by 6 degrees. What is it now?"
            options: ["−2 °C", "2 °C", "−10 °C"]
            answer: "−2 °C"
          - id: l2-c6
            part: count-back
            type: fill_in_blank
            text: "Count back in twos."
            frame: "3, 1, _ , _"
            options: ["0", "−1", "−2", "−3"]
            answer: ["−1", "−3"]
          - id: l2-c7
            part: count-back
            type: multiple_choice
            text: "Which number is 6 less than 2?"
            options: ["−4", "4", "−8"]
            answer: "−4"
          - id: l2-c8
            part: count-back
            type: ordering
            text: "Count back from 1. Put the numbers in order."
            options: ["−2", "0", "1", "−1"]
            slot_count: 4
            answer: ["1", "0", "−1", "−2"]
          - id: l2-c9
            part: number-line
            type: multiple_choice
            text: "What number does the arrow point to?"
            show: { drawn: number-line, from: -10, to: 0, labels: ends, mark: -6 }
            options: ["−6", "−4", "6"]
            answer: "−6"
          - id: l2-c10
            part: number-line
            type: point_on_line
            text: "Where is −3?"
            say: "Where is negative three?"
            show: { drawn: number-line, from: -5, to: 5, labels: ends }
            answer: -3
          - id: l2-c11
            part: number-line
            type: true_false
            text: "Is it true? The arrow points to −1."
            say: "Is it true? The arrow points to negative one."
            show: { drawn: number-line, from: -10, to: 0, labels: ends, mark: -9 }
            answer: false
          - id: l2-c12
            part: thermometer
            type: multiple_choice
            text: "What temperature does the thermometer show?"
            show: { drawn: thermometer, from: -5, to: 5, step: 1, value: -1 }
            options: ["−1 °C", "1 °C", "0 °C"]
            answer: "−1 °C"
          - id: l2-c13
            part: thermometer
            type: image_multiple_choice
            text: "Which thermometer shows −6 °C?"
            options:
              - { drawn: thermometer, from: -10, to: 10, step: 2, value: -6, key: m6 }
              - { drawn: thermometer, from: -10, to: 10, step: 2, value: 6, key: p6 }
              - { drawn: thermometer, from: -10, to: 10, step: 2, value: -4, key: m4 }
            answer: m6
          - id: l2-c14
            part: thermometer
            type: true_false
            text: "Is it true? The thermometer shows 2 degrees below zero."
            show: { drawn: thermometer, from: -5, to: 5, step: 1, value: -2 }
            answer: true
          - id: l2-c15
            part: compare
            type: ordering
            text: "Put the temperatures in order, warmest first."
            options: ["−3 °C", "4 °C", "−8 °C", "0 °C"]
            slot_count: 4
            answer: ["4 °C", "0 °C", "−3 °C", "−8 °C"]
          - id: l2-c16
            part: compare
            type: true_false
            text: "Is it true? −6 is greater than −2."
            say: "Is it true? Negative six is greater than negative two."
            answer: false
          - id: l2-c17
            part: compare
            type: multiple_choice
            text: "Which is the smallest number?"
            options: ["−7", "−2", "1"]
            answer: "−7"
          - id: l2-c18
            part: rise-fall
            type: multiple_choice
            text: "It is −3 °C. The temperature rises by 5 degrees. What is it now?"
            options: ["2 °C", "−8 °C", "8 °C"]
            answer: "2 °C"
          - id: l2-c19
            part: rise-fall
            type: multiple_choice
            text: "It is 0 °C. The temperature falls by 7 degrees. What is it now?"
            options: ["−7 °C", "7 °C", "−6 °C"]
            answer: "−7 °C"
          - id: l2-c20
            part: rise-fall
            type: multiple_choice
            text: "It is −6 °C. It gets 4 degrees warmer. What is the temperature now?"
            options: ["−2 °C", "−10 °C", "2 °C"]
            answer: "−2 °C"
