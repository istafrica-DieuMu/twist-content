# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.vocabulary-add-sub
skill: math.add-sub-to-1000.vocabulary
curriculum: en-GB
language: en
title:
  de: Fachwörter beim Plus- und Minusrechnen
  en: Sum and difference
summary: >
  The words for adding and subtracting. Lesson 1 names the sum as the
  answer to an addition (the sum of 345 and 230 is 575), with total and
  altogether as words that mean the same, and keeps "sum" for adding
  only; lesson 2 names the difference as the answer to a subtraction,
  finds the difference between two numbers by taking the smaller from
  the larger, and as "how many more", mixes the words, and ends with the
  skill check.
metadata:
  year: year-4
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-1000.semi-written]
  also_practises: [math.add-sub-to-1000.hundreds]
  vocabulary: { en: [add, sum, total, altogether, subtract, take away, difference, how many more] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: sum, what: { de: "die Summe finden und benennen, auch insgesamt und zusammen", en: "finding and naming the sum, also total and altogether" } }
    - { id: difference, what: { de: "die Differenz finden und benennen, auch wie viel mehr", en: "finding and naming the difference, also how many more" } }
    - { id: word, what: { de: das passende Fachwort für eine Rechnung wählen, en: choosing the right word for a calculation } }
  misconceptions:
    - id: sum-for-any-calculation
      what: Calls every calculation or every answer a sum, also a subtraction ("do these sums")
      addressed: lesson 1 Learn says a sum is only the answer to an addition; l1-f3 (with feedback), l1-s3 and l1-n3 give a subtraction whose answer is called a sum; l2-f3 and l2-c5 ask for the word for a subtraction's answer, with the sum as an option
    - id: difference-order
      what: Writes the difference between 500 and 180 as 180 − 500, or adds the numbers
      addressed: lesson 2 Learn takes the smaller number from the larger; l2-f1 (with feedback), l2-s1 and l2-n1 offer the wrong order and the addition
    - id: difference-not-how-many-more
      what: Does not see "how many more" as finding a difference and adds instead
      addressed: lesson 2 Learn shows "how many more" as a difference; l2-f5 (with feedback), l2-s5 and l2-n5 are how-many-more stories
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Addieren und die Summe", en: "Add and the sum" }
    goal:
      de: "Lern, dass das Ergebnis einer Plusaufgabe Summe heißt, so wie die Summe von 345 und 230 ist 575."
      en: "Learn that the answer to an adding question is the sum, like the sum of 345 and 230 is 575."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "345 + 230 = _"
            say: "Three hundred and forty-five add two hundred and thirty."
            answer: "575"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "640 − 210 = _"
            say: "Six hundred and forty subtract two hundred and ten."
            answer: "430"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "345 + 230 = 575. 575 is the sum."
            say: "When you add, the answer is called the sum. Five hundred and seventy-five is the sum of three hundred and forty-five and two hundred and thirty."
          - text: "sum, total, altogether"
            say: "Total and altogether mean the same as sum. Find the total of two numbers, or how many there are altogether: you add."
          - text: "640 − 210 = 430. 430 is not a sum."
            say: "People often call any calculation a sum. In maths, a sum is only the answer to an addition. Four hundred and thirty here is the answer to a subtraction, so it is not a sum."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "What is the sum of 420 and 350?"
                answer: "770"
                hints:
                  - "Sum means the answer to an addition."
                  - "Work out 420 + 350."
                  - "420 + 350 = 770."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which calculation finds the total of 260 and 140?"
                options: ["260 + 140", "260 − 140", "140 − 260"]
                answer: "260 + 140"
                hints:
                  - "Total means the same as sum."
                  - "To find a sum, you add."
                  - "260 + 140."
              - id: l1-f3
                type: true_false
                text: "Is it true? In 500 − 120 = 380, the sum is 380."
                answer: false
                feedback:
                  "true": "500 − 120 is a subtraction. A sum is only the answer to an addition."
                hints:
                  - "Is 500 − 120 an addition or a subtraction?"
                  - "A sum is the answer to an addition."
                  - "No. 380 is not a sum."
              - id: l1-f4
                type: multiple_choice
                text: "In 312 + 245 = 557, which number is the sum?"
                options: ["557", "312", "245"]
                answer: "557"
                hints:
                  - "The sum is the answer."
                  - "The answer comes after the equals sign."
                  - "557."
              - id: l1-f5
                type: text_input
                text: "The sum of two numbers is 900. One number is 600. What is the other?"
                answer: "300"
                hints:
                  - "600 + something = 900."
                  - "How much more than 600 is 900?"
                  - "600 + 300 = 900, so 300."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "What is the sum of 135 and 250?"
                answer: "385"
                hints: ["Add the two numbers."]
              - id: l1-s2
                type: multiple_choice
                text: "Which calculation finds how many there are altogether: 470 and 230?"
                options: ["470 − 230", "470 + 230", "230 − 470"]
                answer: "470 + 230"
                hints: ["Altogether means add."]
              - id: l1-s3
                type: true_false
                text: "Is it true? In 800 − 350 = 450, the sum is 450."
                answer: false
                hints: ["Is it an addition?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? In 263 + 400 = 663, the sum is 663."
                answer: true
                hints: ["A sum is the answer to an addition."]
              - id: l1-s5
                type: text_input
                text: "The sum of two numbers is 750. One number is 250. What is the other?"
                answer: "500"
                hints: ["250 + something = 750."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: text_input
                text: "A school has 214 girls and 197 boys. What is the total number of children?"
                answer: "411"
              - id: l1-n2
                type: multiple_choice
                text: "Which word means the answer to an addition?"
                options: ["sum", "difference", "product"]
                answer: "sum"
              - id: l1-n3
                type: true_false
                text: "Is it true? Ben works out 700 − 250 = 450 and says: \"The sum is 450.\""
                answer: false
              - id: l1-n4
                type: text_input
                text: "A library lends 365 books in May and 280 books in June. How many books is that altogether?"
                answer: "645"
              - id: l1-n5
                type: text_input
                text: "Zara thinks of two numbers. Their sum is 1000. One number is 450. What is the other?"
                answer: "550"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "What is the sum of 508 and 370?"
            answer: "878"
          - id: l1-c2
            type: multiple_choice
            text: "In 150 + 625 = 775, which number is the sum?"
            options: ["775", "150", "625"]
            answer: "775"
          - id: l1-c3
            type: multiple_choice
            text: "Which calculation finds the total of 380 and 90?"
            options: ["380 + 90", "380 − 90", "90 − 380"]
            answer: "380 + 90"
          - id: l1-c4
            type: text_input
            text: "What is the total of 263 and 125?"
            answer: "388"
          - id: l1-c5
            type: true_false
            text: "Is it true? The sum of 300 and 450 is 750."
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which word means the same as sum?"
            options: ["total", "difference", "take away"]
            answer: "total"

  - n: 2
    title: { de: "Subtrahieren und die Differenz", en: "Subtract and the difference" }
    goal:
      de: "Finde die Differenz zweier Zahlen, indem du die kleinere von der größeren abziehst, so wie 500 minus 180."
      en: "Find the difference between two numbers by taking the smaller from the larger, like 500 take away 180."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "What is the sum of 230 and 440?"
            answer: "670"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? In 432 + 100 = 532, the sum is 532."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "500 − 180 = 320. 320 is the difference."
            say: "When you subtract, the answer is called the difference. Three hundred and twenty is the difference between five hundred and one hundred and eighty."
          - text: "The difference between 180 and 500 is 500 − 180"
            say: "To find the difference between two numbers, take the smaller number away from the larger one. The difference between one hundred and eighty and five hundred is still five hundred take away one hundred and eighty."
          - text: "Tom 350, Amy 420. How many more? 420 − 350 = 70"
            say: "How many more and how many fewer ask for a difference too. Amy has four hundred and twenty points and Tom has three hundred and fifty. Amy has seventy more: four hundred and twenty take away three hundred and fifty."
          - text: "+ → sum   − → difference"
            say: "Sum goes with add. Difference goes with subtract."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which calculation finds the difference between 600 and 250?"
                options: ["600 − 250", "250 − 600", "600 + 250"]
                answer: "600 − 250"
                feedback:
                  "250 − 600": "Take the smaller number away from the larger one: 600 − 250."
                  "600 + 250": "That finds the sum. The difference is the answer to a subtraction."
                hints:
                  - "Difference means the answer to a subtraction."
                  - "Start with the larger number."
                  - "600 − 250."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "What is the difference between 900 and 400?"
                answer: "500"
                hints:
                  - "Difference means subtract."
                  - "Work out 900 − 400."
                  - "500."
              - id: l2-f3
                type: multiple_choice
                text: "In 735 − 420 = 315, what is 315?"
                options: ["the difference", "the sum", "the total"]
                answer: "the difference"
                hints:
                  - "Is it an addition or a subtraction?"
                  - "The answer to a subtraction has its own word."
                  - "The difference."
              - id: l2-f4
                type: true_false
                text: "Is it true? The difference between 300 and 800 is 500."
                answer: true
                hints:
                  - "Take the smaller number from the larger."
                  - "800 − 300."
                  - "Yes, 500."
              - id: l2-f5
                type: text_input
                text: "Leah has 460 stickers. Max has 310. How many more stickers does Leah have?"
                answer: "150"
                feedback:
                  "770": "770 is the sum. How many more asks for the difference: 460 − 310."
                hints:
                  - "How many more asks for a difference."
                  - "Work out 460 − 310."
                  - "150 more."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which calculation finds the difference between 140 and 520?"
                options: ["140 − 520", "520 + 140", "520 − 140"]
                answer: "520 − 140"
                hints: ["Start with the larger number."]
              - id: l2-s2
                type: text_input
                text: "What is the difference between 750 and 250?"
                answer: "500"
                hints: ["Subtract the smaller number from the larger."]
              - id: l2-s3
                type: sorting
                text: "Does each word go with adding (+) or with subtracting (−)? Sort the words."
                say: "Does the word go with adding or with subtracting? Put each word in the right group."
                bins:
                  - { id: add, show: { text: "+" }, say: "Adding." }
                  - { id: sub, show: { text: "−" }, say: "Subtracting." }
                options:
                  - { text: "sum", bin: add }
                  - { text: "difference", bin: sub }
                  - { text: "altogether", bin: add }
                  - { text: "how many more", bin: sub }
                hints: ["Sum and altogether go with adding. Difference and how many more go with subtracting."]
              - id: l2-s4
                type: true_false
                text: "Is it true? In 630 − 200 = 430, the difference is 630."
                answer: false
                hints: ["The difference is the answer."]
              - id: l2-s5
                type: text_input
                text: "A red train has 280 seats. A blue train has 340 seats. How many more seats does the blue train have?"
                answer: "60"
                hints: ["How many more: subtract."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which calculation finds the difference between 999 and 499?"
                options: ["499 − 999", "999 − 499", "999 + 499"]
                answer: "999 − 499"
              - id: l2-n2
                type: text_input
                text: "One hill is 820 metres high. Another is 570 metres high. What is the difference in height?"
                answer: "250"
              - id: l2-n3
                type: multiple_choice
                text: "Ali says: \"I worked out the difference.\" Which calculation did he do?"
                options: ["815 − 210", "815 + 210", "815 × 2"]
                answer: "815 − 210"
              - id: l2-n4
                type: true_false
                text: "Is it true? The sum of 250 and 150 is 100."
                answer: false
              - id: l2-n5
                type: text_input
                text: "Year 4 collects 512 bottle tops. Year 3 collects 380. How many fewer does Year 3 collect?"
                answer: "132"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: sum
            type: text_input
            text: "What is the sum of 245 and 330?"
            answer: "575"
          - id: l2-c2
            part: difference
            type: text_input
            text: "What is the difference between 870 and 520?"
            answer: "350"
          - id: l2-c3
            part: difference
            type: multiple_choice
            text: "Which calculation finds the difference between 360 and 940?"
            options: ["940 − 360", "360 − 940", "940 + 360"]
            answer: "940 − 360"
          - id: l2-c4
            part: difference
            type: text_input
            text: "Poppy scores 725 points and Jay scores 600. How many more points does Poppy score?"
            answer: "125"
          - id: l2-c5
            part: word
            type: multiple_choice
            text: "In 480 − 160 = 320, what is 320?"
            options: ["the sum", "the difference", "the product"]
            answer: "the difference"
          - id: l2-c6
            part: sum
            type: true_false
            text: "Is it true? In 406 + 293 = 699, the sum is 406."
            answer: false
          - id: l2-c7
            part: sum
            type: text_input
            text: "What is the total of 375 and 425?"
            answer: "800"
          - id: l2-c8
            part: sum
            type: text_input
            text: "A farmer has 284 sheep and 315 cows. How many animals does she have altogether?"
            answer: "599"
          - id: l2-c9
            part: sum
            type: multiple_choice
            text: "Which calculation finds the sum of 610 and 190?"
            options: ["610 + 190", "610 − 190", "190 − 610"]
            answer: "610 + 190"
          - id: l2-c10
            part: sum
            type: text_input
            text: "Find the sum of 199, 101 and 300."
            answer: "600"
          - id: l2-c11
            part: sum
            type: true_false
            text: "Is it true? The sum of 450 and 450 is 900."
            answer: true
          - id: l2-c12
            part: difference
            type: text_input
            text: "What is the difference between 1000 and 640?"
            answer: "360"
          - id: l2-c13
            part: difference
            type: true_false
            text: "Is it true? The difference between 700 and 250 is 950."
            answer: false
          - id: l2-c14
            part: difference
            type: text_input
            text: "A tree is 925 cm tall. A bush is 175 cm tall. What is the difference in height? Type the centimetres."
            answer: "750"
          - id: l2-c15
            part: difference
            type: text_input
            text: "Sam reads 230 pages. Ella reads 410 pages. How many fewer pages does Sam read?"
            answer: "180"
          - id: l2-c16
            part: word
            type: multiple_choice
            text: "Which word means the answer to a subtraction?"
            options: ["difference", "sum", "total"]
            answer: "difference"
          - id: l2-c17
            part: word
            type: multiple_choice
            text: "Mia adds 250 and 380. What is her answer called?"
            options: ["the sum", "the difference", "the product"]
            answer: "the sum"
          - id: l2-c18
            part: word
            type: true_false
            text: "Is it true? The word altogether tells you to subtract."
            answer: false
          - id: l2-c19
            part: word
            type: sorting
            text: "Which of these words tell you to add (+), and which to subtract (−)? Sort them."
            say: "Which of these words tell you to add, and which tell you to subtract? Sort them."
            bins:
              - { id: add, show: { text: "+" }, say: "Adding." }
              - { id: sub, show: { text: "−" }, say: "Subtracting." }
            options:
              - { text: "take away", bin: sub }
              - { text: "total", bin: add }
              - { text: "how many fewer", bin: sub }
              - { text: "add", bin: add }
          - id: l2-c20
            part: word
            type: multiple_choice
            text: "Which question asks for a difference?"
            options: ["How many more cars are red than blue?", "How many cars are there altogether?", "What is the total number of cars?"]
            answer: "How many more cars are red than blue?"
