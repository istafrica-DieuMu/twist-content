# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.mult-div-estimate
skill: math.mult-div-larger.estimate
curriculum: en-GB
language: en
title:
  de: Überschlagen beim Malnehmen und Teilen
  en: Estimating products and quotients
summary: >
  Rough answers to check multiplying and dividing. Lesson 1 rounds the
  bigger number to a multiple of 10 or 100 and keeps the one-digit
  number (7 × 48 is about 7 × 50 = 350), then uses the estimate to spot
  an answer that cannot be right; lesson 2 picks a nearby number that
  divides easily (396 ÷ 4 is about 400 ÷ 4 = 100), checks worked
  answers against the estimate, and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Halbschriftlich malnehmen und teilen, en: Informal multiplication and division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.semi-written-mult, math.numbers-to-1000.round]
  also_practises: [math.mult-div-larger.tens, math.mult-div-larger.semi-written-div]
  vocabulary: { en: [estimate, round, about, roughly, multiple of 10, multiple of 100, check] }
  forms: [text, audio]
  drawn: []
  facets: [operation-signs]
  parts:
    - { id: mult, what: { de: ein Produkt überschlagen, en: estimating a product } }
    - { id: div, what: { de: einen Quotienten überschlagen, en: estimating a quotient } }
    - { id: check, what: { de: ein Ergebnis mit dem Überschlag prüfen, en: checking an answer against the estimate } }
    - { id: in-context, what: { de: Überschlag in Sachaufgaben, en: estimating in word problems } }
  misconceptions:
    - id: round-both
      what: Rounds the one-digit number too (7 × 48 is about 10 × 50)
      addressed: lesson 1 Learn rounds only the bigger number; "Which estimate fits?" in every stage of lesson 1 (l1-f1 with feedback, l1-s1, l1-n1) and l1-c1 offers a version with both numbers rounded
    - id: easy-number-for-division
      what: Rounds to the nearest ten even when it does not divide easily (396 ÷ 4 is about 390 ÷ 4)
      addressed: lesson 2 Learn picks 400 because it divides by 4; l2-f3 offers 580 ÷ 8, l2-s3 440 ÷ 9 and l2-c2 300 ÷ 7, a nearer number that does not divide easily; l2-f1 (with feedback), l2-s1, l2-n1 and l2-n5 offer an estimate that changes the number you divide by
    - id: no-sense-check
      what: Accepts an answer far from the estimate (6 × 52 = 3012)
      addressed: lesson 1 Learn rejects an answer ten times too big; l1-f4 (with feedback), l1-s4, l1-n4, l2-f4, l2-s4 and l2-n4 ask whether an answer fits its estimate
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Überschlag beim Malnehmen", en: "Estimating products" }
    goal:
      de: "Überschlag eine Malaufgabe, indem du die große Zahl rundest. 7 mal 48 ist ungefähr 7 mal 50, also 350."
      en: "Estimate a times answer by rounding the big number. 7 times 48 is about 7 times 50, which is 350."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Round 48 to the nearest 10."
            options: ["40", "50", "45"]
            answer: "50"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "7 × 50 = _"
            say: "Seven times fifty."
            answer: "350"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 × 48 is about 7 × 50 = 350"
            say: "To estimate seven times forty-eight, round forty-eight to the nearest ten: fifty. Keep the seven as it is. Seven times fifty is three hundred and fifty, so the answer is about three hundred and fifty."
          - text: "Round the big number, keep the small one."
            say: "Only round the big number. If you round seven to ten as well, the estimate is ten times fifty, five hundred. That is too far from the real answer, three hundred and thirty-six."
          - text: "6 × 52 = 3012? Estimate: 6 × 50 = 300"
            say: "Lily works out six times fifty-two and gets three thousand and twelve. Her estimate is six times fifty, three hundred. Three thousand is far too big, so she must have made a mistake. The real answer is three hundred and twelve."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which estimate fits 4 × 29?"
                say: "Four times twenty-nine. Which estimate fits?"
                options: ["4 × 30", "4 × 20", "10 × 30"]
                answer: "4 × 30"
                feedback:
                  "10 × 30": "Keep the 4 as it is. Only round the big number."
                  "4 × 20": "29 is much nearer to 30 than to 20."
                hints:
                  - "Round 29 to the nearest 10."
                  - "29 rounds to 30. Keep the 4."
                  - "4 × 30."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "6 × 41 is about ..."
                say: "Six times forty-one is about how much?"
                options: ["240", "300", "60"]
                answer: "240"
                hints:
                  - "Round 41 to the nearest 10."
                  - "6 × 40."
                  - "About 240."
              - id: l1-f3
                type: multiple_choice
                text: "3 × 198 is about ..."
                say: "Three times one hundred and ninety-eight is about how much?"
                options: ["600", "300", "900"]
                answer: "600"
                hints:
                  - "Round 198 to the nearest 100."
                  - "198 is about 200. 3 × 200."
                  - "About 600."
              - id: l1-f4
                type: true_false
                text: "Is it true? 8 × 62 = 4096 fits the estimate."
                say: "Is it true? Eight times sixty-two is four thousand and ninety-six. That fits the estimate."
                answer: false
                feedback:
                  "true": "The estimate is 8 × 60 = 480. 4096 is far too big."
                hints:
                  - "Estimate first: round 62."
                  - "8 × 60 = 480."
                  - "No. 4096 is far from 480. The answer is 496."
              - id: l1-f5
                type: multiple_choice
                text: "Which answer fits the estimate for 5 × 79?"
                say: "Five times seventy-nine. Which answer fits the estimate?"
                options: ["395", "295", "3905"]
                answer: "395"
                hints:
                  - "Estimate: 5 × 80."
                  - "5 × 80 = 400. Which answer is close to 400?"
                  - "395."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which estimate fits 6 × 38?"
                say: "Six times thirty-eight. Which estimate fits?"
                options: ["10 × 40", "6 × 40", "6 × 30"]
                answer: "6 × 40"
                hints: ["Round only 38."]
              - id: l1-s2
                type: multiple_choice
                text: "9 × 51 is about ..."
                say: "Nine times fifty-one is about how much?"
                options: ["450", "500", "90"]
                answer: "450"
                hints: ["9 × 50."]
              - id: l1-s3
                type: multiple_choice
                text: "4 × 302 is about ..."
                say: "Four times three hundred and two is about how much?"
                options: ["1200", "120", "1500"]
                answer: "1200"
                hints: ["Round 302 to the nearest 100."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 7 × 33 = 231 fits the estimate."
                say: "Is it true? Seven times thirty-three is two hundred and thirty-one. That fits the estimate."
                answer: true
                hints: ["7 × 30 = 210."]
              - id: l1-s5
                type: multiple_choice
                text: "Which answer fits the estimate for 3 × 69?"
                say: "Three times sixty-nine. Which answer fits the estimate?"
                options: ["107", "207", "2007"]
                answer: "207"
                hints: ["3 × 70 = 210."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "A ticket costs £19. Which estimate fits the cost of 8 tickets?"
                options: ["8 × 20", "10 × 20", "8 × 10"]
                answer: "8 × 20"
              - id: l1-n2
                type: multiple_choice
                text: "A box holds 52 crayons. About how many crayons are in 4 boxes?"
                options: ["200", "250", "20"]
                answer: "200"
              - id: l1-n3
                type: multiple_choice
                text: "A train carries 297 people. About how many people do 3 trains carry?"
                options: ["900", "600", "90"]
                answer: "900"
              - id: l1-n4
                type: true_false
                text: "Is it true? Kai says 6 bags of 49 marbles hold 2094 marbles. That fits the estimate."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Ruby buys 9 books at £21 each. Which total fits the estimate?"
                options: ["£189", "£1809", "£89"]
                answer: "£189"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which estimate fits 5 × 62?"
            say: "Five times sixty-two. Which estimate fits?"
            options: ["5 × 60", "10 × 60", "5 × 70"]
            answer: "5 × 60"
          - id: l1-c2
            type: multiple_choice
            text: "8 × 39 is about ..."
            say: "Eight times thirty-nine is about how much?"
            options: ["320", "400", "240"]
            answer: "320"
          - id: l1-c3
            type: true_false
            text: "Is it true? 4 × 51 = 204 fits the estimate."
            say: "Is it true? Four times fifty-one is two hundred and four. That fits the estimate."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "9 × 22 is about ..."
            say: "Nine times twenty-two is about how much?"
            options: ["180", "200", "270"]
            answer: "180"
          - id: l1-c5
            type: multiple_choice
            text: "Which answer fits the estimate for 4 × 78?"
            say: "Four times seventy-eight. Which answer fits the estimate?"
            options: ["312", "3012", "212"]
            answer: "312"
          - id: l1-c6
            type: multiple_choice
            text: "Which estimate fits 2 × 497?"
            say: "Two times four hundred and ninety-seven. Which estimate fits?"
            options: ["2 × 500", "2 × 400", "10 × 500"]
            answer: "2 × 500"

  - n: 2
    title: { de: "Überschlag beim Teilen", en: "Estimating quotients" }
    goal:
      de: "Überschlag eine Geteiltaufgabe mit einer Zahl in der Nähe, die sich leicht teilen lässt, so wie 400 geteilt durch 4 für 396 geteilt durch 4."
      en: "Estimate a division with a nearby number that divides easily, like 400 divided by 4 for 396 divided by 4."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "7 × 31 is about ..."
            say: "Seven times thirty-one is about how much?"
            options: ["210", "300", "70"]
            answer: "210"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which estimate fits 3 × 89?"
            say: "Three times eighty-nine. Which estimate fits?"
            options: ["3 × 90", "10 × 90", "3 × 80"]
            answer: "3 × 90"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "396 ÷ 4 is about 400 ÷ 4 = 100"
            say: "To estimate three hundred and ninety-six divided by four, find a number nearby that divides easily by four. Four hundred divided by four is one hundred, so the answer is about one hundred."
          - text: "Not 390 ÷ 4: 390 does not divide easily by 4."
            say: "Rounding to the nearest ten gives three hundred and ninety, but that is hard to divide by four. For a division estimate, choose a nearby number from a times table fact: four hundred is four times one hundred."
          - text: "250 ÷ 6 is about 240 ÷ 6 = 40"
            say: "Two hundred and fifty divided by six. Twenty-four divided by six is four, so two hundred and forty divided by six is forty. The answer is about forty."
          - text: "184 ÷ 4 = 406? Estimate: 200 ÷ 4 = 50"
            say: "Sam works out one hundred and eighty-four divided by four and gets four hundred and six. His estimate is about fifty, so four hundred and six cannot be right. The real answer is forty-six."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which estimate fits 250 ÷ 6?"
                say: "Two hundred and fifty divided by six. Which estimate fits?"
                options: ["240 ÷ 6", "250 ÷ 5", "300 ÷ 10"]
                answer: "240 ÷ 6"
                feedback:
                  "250 ÷ 5": "Keep dividing by 6. Change 250 to a nearby number that divides by 6."
                  "300 ÷ 10": "Keep dividing by 6. Change only 250."
                hints:
                  - "Keep the 6. Which number near 250 divides by 6?"
                  - "24 ÷ 6 = 4, so 240 ÷ 6 = 40."
                  - "240 ÷ 6."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "422 ÷ 7 is about ..."
                say: "Four hundred and twenty-two divided by seven is about how much?"
                options: ["60", "6", "600"]
                answer: "60"
                hints:
                  - "Which number near 422 divides by 7?"
                  - "42 ÷ 7 = 6, so 420 ÷ 7 = 60."
                  - "About 60."
              - id: l2-f3
                type: multiple_choice
                text: "Which estimate fits 575 ÷ 8?"
                say: "Five hundred and seventy-five divided by eight. Which estimate fits?"
                options: ["560 ÷ 8", "580 ÷ 8", "600 ÷ 10"]
                answer: "560 ÷ 8"
                hints:
                  - "Which number near 575 divides easily by 8? 580 does not."
                  - "56 ÷ 8 = 7, so 560 ÷ 8 = 70."
                  - "560 ÷ 8."
              - id: l2-f4
                type: true_false
                text: "Is it true? 276 ÷ 3 = 92 fits the estimate."
                say: "Is it true? Two hundred and seventy-six divided by three is ninety-two. That fits the estimate."
                answer: true
                hints:
                  - "Which number near 276 divides by 3?"
                  - "270 ÷ 3 = 90."
                  - "Yes. 92 is close to 90."
              - id: l2-f5
                type: multiple_choice
                text: "Which answer fits the estimate for 492 ÷ 6?"
                say: "Four hundred and ninety-two divided by six. Which answer fits the estimate?"
                options: ["82", "820", "8"]
                answer: "82"
                hints:
                  - "Estimate: 480 ÷ 6."
                  - "48 ÷ 6 = 8, so 480 ÷ 6 = 80."
                  - "82."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which estimate fits 220 ÷ 7?"
                say: "Two hundred and twenty divided by seven. Which estimate fits?"
                options: ["220 ÷ 10", "210 ÷ 7", "200 ÷ 5"]
                answer: "210 ÷ 7"
                hints: ["Keep the 7. 21 ÷ 7 = 3."]
              - id: l2-s2
                type: multiple_choice
                text: "161 ÷ 4 is about ..."
                say: "One hundred and sixty-one divided by four is about how much?"
                options: ["40", "400", "4"]
                answer: "40"
                hints: ["160 ÷ 4."]
              - id: l2-s3
                type: multiple_choice
                text: "Which estimate fits 444 ÷ 9?"
                say: "Four hundred and forty-four divided by nine. Which estimate fits?"
                options: ["450 ÷ 9", "400 ÷ 10", "440 ÷ 9"]
                answer: "450 ÷ 9"
                hints: ["45 ÷ 9 = 5."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 357 ÷ 7 = 501 fits the estimate."
                say: "Is it true? Three hundred and fifty-seven divided by seven is five hundred and one. That fits the estimate."
                answer: false
                hints: ["350 ÷ 7 = 50."]
              - id: l2-s5
                type: multiple_choice
                text: "Which answer fits the estimate for 208 ÷ 4?"
                say: "Two hundred and eight divided by four. Which answer fits the estimate?"
                options: ["52", "502", "5"]
                answer: "52"
                hints: ["200 ÷ 4 = 50."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "460 stickers are shared between 9 children. Which estimate fits?"
                options: ["450 ÷ 9", "460 ÷ 10", "500 ÷ 5"]
                answer: "450 ÷ 9"
              - id: l2-n2
                type: multiple_choice
                text: "A ribbon 245 cm long is cut into 6 equal pieces. About how long is each piece?"
                options: ["40 cm", "400 cm", "4 cm"]
                answer: "40 cm"
              - id: l2-n3
                type: multiple_choice
                text: "Mr Jones shares £632 between 8 charities. About how much does each get?"
                options: ["£80", "£800", "£8"]
                answer: "£80"
              - id: l2-n4
                type: true_false
                text: "Is it true? Mia says 284 ÷ 4 = 71 and it fits the estimate."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "290 children sit at tables of 7. Which estimate fits?"
                options: ["280 ÷ 7", "290 ÷ 10", "300 ÷ 5"]
                answer: "280 ÷ 7"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: mult
            type: multiple_choice
            text: "Which estimate fits 9 × 68?"
            say: "Nine times sixty-eight. Which estimate fits?"
            options: ["9 × 70", "10 × 70", "9 × 60"]
            answer: "9 × 70"
          - id: l2-c2
            part: div
            type: multiple_choice
            text: "Which estimate fits 295 ÷ 7?"
            say: "Two hundred and ninety-five divided by seven. Which estimate fits?"
            options: ["280 ÷ 7", "300 ÷ 7", "300 ÷ 10"]
            answer: "280 ÷ 7"
          - id: l2-c3
            part: mult
            type: multiple_choice
            text: "4 × 199 is about ..."
            say: "Four times one hundred and ninety-nine is about how much?"
            options: ["800", "400", "1000"]
            answer: "800"
          - id: l2-c4
            part: check
            type: true_false
            text: "Is it true? 6 × 47 = 1842 fits the estimate."
            say: "Is it true? Six times forty-seven is one thousand eight hundred and forty-two. That fits the estimate."
            answer: false
          - id: l2-c5
            part: check
            type: multiple_choice
            text: "Which answer fits the estimate for 567 ÷ 7?"
            say: "Five hundred and sixty-seven divided by seven. Which answer fits the estimate?"
            options: ["81", "810", "8"]
            answer: "81"
          - id: l2-c6
            part: mult
            type: multiple_choice
            text: "7 × 59 is about ..."
            say: "Seven times fifty-nine is about how much?"
            options: ["420", "490", "350"]
            answer: "420"
          - id: l2-c7
            part: mult
            type: text_input
            text: "5 × 403 is about _"
            say: "Five times four hundred and three is about how much?"
            answer: "2000"
          - id: l2-c8
            part: mult
            type: multiple_choice
            text: "Which estimate fits 3 × 412?"
            say: "Three times four hundred and twelve. Which estimate fits?"
            options: ["3 × 400", "3 × 500", "10 × 400"]
            answer: "3 × 400"
          - id: l2-c9
            part: div
            type: multiple_choice
            text: "355 ÷ 5 is about ..."
            say: "Three hundred and fifty-five divided by five is about how much?"
            options: ["70", "7", "700"]
            answer: "70"
          - id: l2-c10
            part: div
            type: multiple_choice
            text: "Which estimate fits 638 ÷ 8?"
            say: "Six hundred and thirty-eight divided by eight. Which estimate fits?"
            options: ["640 ÷ 8", "630 ÷ 8", "600 ÷ 10"]
            answer: "640 ÷ 8"
          - id: l2-c11
            part: div
            type: text_input
            text: "182 ÷ 3 is about _"
            say: "One hundred and eighty-two divided by three is about how much?"
            answer: "60"
          - id: l2-c12
            part: div
            type: true_false
            text: "Is it true? 540 ÷ 9 is a good estimate for 547 ÷ 9."
            say: "Is it true? Five hundred and forty divided by nine is a good estimate for five hundred and forty-seven divided by nine."
            answer: true
          - id: l2-c13
            part: check
            type: multiple_choice
            text: "Which answer fits the estimate for 8 × 41?"
            say: "Eight times forty-one. Which answer fits the estimate?"
            options: ["328", "3208", "248"]
            answer: "328"
          - id: l2-c14
            part: check
            type: true_false
            text: "Ella gets 490 for 5 × 98. Her estimate is 5 × 100 = 500. Is it true? Her answer could be right."
            say: "Ella gets four hundred and ninety for five times ninety-eight. Her estimate is five times one hundred, which is five hundred. Is it true? Her answer could be right."
            answer: true
          - id: l2-c15
            part: check
            type: multiple_choice
            text: "Which worked answer fits its estimate?"
            options: ["3 × 62 = 186", "3 × 62 = 1806", "3 × 62 = 96"]
            answer: "3 × 62 = 186"
          - id: l2-c16
            part: in-context
            type: multiple_choice
            text: "A school trip costs £48 for each child. About how much do 4 children pay?"
            options: ["£200", "£2000", "£20"]
            answer: "£200"
          - id: l2-c17
            part: in-context
            type: multiple_choice
            text: "A farmer packs 318 eggs into boxes of 6. About how many boxes does he fill?"
            options: ["about 50", "about 500", "about 5"]
            answer: "about 50"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "Each bag holds 32 sweets. Which estimate fits the number of sweets in 7 bags?"
            options: ["7 × 30", "10 × 30", "7 × 40"]
            answer: "7 × 30"
          - id: l2-c19
            part: in-context
            type: true_false
            text: "A book has 196 pages. Zoe reads 4 books like it. Is it true? She reads about 800 pages."
            answer: true
          - id: l2-c20
            part: in-context
            type: multiple_choice
            text: "A minibus holds 9 people. 271 people are going to a match. About how many minibuses do they need?"
            options: ["about 30", "about 300", "about 3"]
            answer: "about 30"
