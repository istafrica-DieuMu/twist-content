# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.line-graphs
skill: math.data.line-graphs
curriculum: en-GB
language: en
title:
  de: Liniendiagramme
  en: Line graphs
summary: >
  Time graphs that show how something changes over time. Lesson 1 reads
  points on a scale in twos, fives and tens, finds the highest point and
  works out how much a value rose or fell; lesson 2 matches a table with
  its line graph, finds a wrongly plotted point, reads between two
  readings and ends with the skill check. Children do not plot points by
  hand yet: they choose and check graphs.
metadata:
  year: year-4
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.data.read-charts]
  also_practises: [math.data.read-charts]
  vocabulary: { en: [line graph, time graph, scale, axis, point, reading, rise, fall, table] }
  forms: [drawn, text, audio]
  drawn: [line-graph, bar-chart, table]
  facets: []
  parts:
    - { id: read, what: { de: einen Wert aus einem Liniendiagramm ablesen, en: reading a value from a line graph } }
    - { id: change, what: { de: Zunahme und Abnahme ablesen und berechnen, en: finding how much a value rose or fell } }
    - { id: table-graph, what: { de: Tabelle und Liniendiagramm zuordnen und prüfen, en: matching a table with its line graph and checking the points } }
    - { id: between, what: { de: Werte zwischen zwei Messungen schätzen, en: reading between two readings } }
  misconceptions:
    - id: misreads-scale
      what: Reads a point between two marks as the mark below or above (13 as 12 or 14 on a scale in twos)
      addressed: lesson 1 Learn reads 13 halfway between 12 and 14; l1-s1, l1-c1, l2-f2 and l2-s2 read between marks, with hints in l1-s1
    - id: value-not-change
      what: Gives a reading when the question asks how much it rose or fell
      addressed: lesson 1 Learn subtracts 16 − 8; l1-f3, l1-s3, l1-n3, l2-s3, l2-n3 and l2-c2 ask for the change
    - id: plots-out-of-order
      what: Sorts the values or joins the points out of order when drawing a line graph from a table
      addressed: lesson 2 Learn plots the readings in time order; l2-f1 has feedback on the sorted graph, l2-s1, l2-n1 and l2-c3 offer it, and l2-s4 and l2-n4 find a wrong point
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Liniendiagramme lesen, en: Read a line graph }
    goal:
      de: "Lies ein Liniendiagramm, um die wärmste Zeit zu finden und wie stark die Temperatur stieg, so wie von 8 auf 16 Grad."
      en: "Read a line graph to find the warmest time and how much the temperature rose, like from 8 to 16 degrees."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Favourite fruit. How many children chose bananas?"
            show: { drawn: bar-chart, rows: [[Apples, 6], [Pears, 3], [Bananas, 8]], step: 1 }
            options: ["8", "6", "3"]
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Favourite fruit. How many more children chose apples than pears?"
            show: { drawn: bar-chart, rows: [[Apples, 6], [Pears, 3], [Bananas, 8]], step: 1 }
            options: ["3", "6", "9"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Temperature in the garden"
            say: "A line graph shows how something changes over time. The times go along the bottom. The temperature goes up the side. Each point is one reading, and the line joins the points in order."
            show: { drawn: line-graph, rows: [[9am, 8], [10am, 10], [11am, 13], [12pm, 15], [1pm, 16], [2pm, 14], [3pm, 12]], step: 2, ylabel: "°C" }
          - text: "At 11am it was 13 °C."
            say: "To read a point, find the time along the bottom and go straight up to the point. Then go across to the scale. The scale goes up in twos, so the point halfway between 12 and 14 is 13."
            show: { drawn: line-graph, rows: [[9am, 8], [10am, 10], [11am, 13], [12pm, 15], [1pm, 16], [2pm, 14], [3pm, 12]], step: 2, ylabel: "°C" }
          - text: "Warmest: 1pm, 16 °C\nFrom 9am to 1pm it rose by 16 − 8 = 8 degrees."
            say: "The highest point is at 1pm. Where the line goes up, the temperature rises; where it goes down, it falls. To find how much it rose from 9am to 1pm, subtract: sixteen take away eight is eight degrees."
            show: { drawn: line-graph, rows: [[9am, 8], [10am, 10], [11am, 13], [12pm, 15], [1pm, 16], [2pm, 14], [3pm, 12]], step: 2, ylabel: "°C" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Temperature in the garden. What was the temperature at 10am?"
                show: { drawn: line-graph, rows: [[9am, 8], [10am, 10], [11am, 13], [12pm, 15], [1pm, 16], [2pm, 14], [3pm, 12]], step: 2, ylabel: "°C" }
                options: ["10 °C", "9 °C", "12 °C"]
                answer: "10 °C"
                hints:
                  - "Find 10am along the bottom."
                  - "Go up to the point, then across to the scale."
                  - "The point is on the line for 10: 10 °C."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Temperature in the garden. When was it warmest?"
                show: { drawn: line-graph, rows: [[9am, 8], [10am, 10], [11am, 13], [12pm, 15], [1pm, 16], [2pm, 14], [3pm, 12]], step: 2, ylabel: "°C" }
                options: ["1pm", "12pm", "3pm"]
                answer: "1pm"
                hints:
                  - "Warmest means the highest temperature."
                  - "Find the highest point on the line."
                  - "The highest point is above 1pm."
              - id: l1-f3
                type: text_input
                text: "Temperature in the garden. How many degrees warmer was it at 1pm than at 9am?"
                show: { drawn: line-graph, rows: [[9am, 8], [10am, 10], [11am, 13], [12pm, 15], [1pm, 16], [2pm, 14], [3pm, 12]], step: 2, ylabel: "°C" }
                answer: "8"
                hints:
                  - "Read both temperatures first."
                  - "At 9am it was 8 °C, at 1pm 16 °C. How much more is 16 than 8?"
                  - "16 − 8 = 8."
              - id: l1-f4
                type: multiple_choice
                text: "Temperature in the garden. Between which two times did the temperature fall?"
                show: { drawn: line-graph, rows: [[9am, 8], [10am, 10], [11am, 13], [12pm, 15], [1pm, 16], [2pm, 14], [3pm, 12]], step: 2, ylabel: "°C" }
                options: ["1pm and 2pm", "11am and 12pm", "9am and 10am"]
                answer: "1pm and 2pm"
                hints:
                  - "Falling means the line goes down."
                  - "Look for where the line slopes down to the right."
                  - "From 1pm to 2pm it went from 16 °C to 14 °C."
              - id: l1-f5
                type: true_false
                text: "Is it true? It was 14 °C at 2pm."
                show: { drawn: line-graph, rows: [[9am, 8], [10am, 10], [11am, 13], [12pm, 15], [1pm, 16], [2pm, 14], [3pm, 12]], step: 2, ylabel: "°C" }
                answer: true
                hints:
                  - "Find 2pm along the bottom."
                  - "Go up to the point and across."
                  - "Yes, 14 °C."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Height of a bean plant. How tall was the plant in week 3?"
                show: { drawn: line-graph, rows: [[Week 1, 2], [Week 2, 5], [Week 3, 9], [Week 4, 12], [Week 5, 14]], step: 2, ylabel: "cm" }
                options: ["9 cm", "8 cm", "10 cm"]
                answer: "9 cm"
                hints: ["The point is halfway between 8 and 10."]
              - id: l1-s2
                type: multiple_choice
                text: "Height of a bean plant. In which week was the plant 12 cm tall?"
                show: { drawn: line-graph, rows: [[Week 1, 2], [Week 2, 5], [Week 3, 9], [Week 4, 12], [Week 5, 14]], step: 2, ylabel: "cm" }
                options: ["Week 4", "Week 3", "Week 5"]
                answer: "Week 4"
                hints: ["Find 12 on the scale and go across to the line."]
              - id: l1-s3
                type: text_input
                text: "Height of a bean plant. How many centimetres did the plant grow from week 1 to week 5?"
                show: { drawn: line-graph, rows: [[Week 1, 2], [Week 2, 5], [Week 3, 9], [Week 4, 12], [Week 5, 14]], step: 2, ylabel: "cm" }
                answer: "12"
                hints: ["Subtract the height in week 1 from the height in week 5."]
              - id: l1-s4
                type: multiple_choice
                text: "Height of a bean plant. Between which weeks did it grow the most?"
                show: { drawn: line-graph, rows: [[Week 1, 2], [Week 2, 5], [Week 3, 9], [Week 4, 12], [Week 5, 14]], step: 2, ylabel: "cm" }
                options: ["Week 2 and week 3", "Week 4 and week 5", "Week 1 and week 2"]
                answer: "Week 2 and week 3"
                hints: ["The steepest part of the line shows the most growth."]
              - id: l1-s5
                type: true_false
                text: "Is it true? The plant got shorter in week 5."
                show: { drawn: line-graph, rows: [[Week 1, 2], [Week 2, 5], [Week 3, 9], [Week 4, 12], [Week 5, 14]], step: 2, ylabel: "cm" }
                answer: false
                hints: ["Does the line go up or down from week 4 to week 5?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Cars in the car park. How many cars were there at 9am?"
                show: { drawn: line-graph, rows: [[8am, 10], [9am, 40], [10am, 55], [11am, 50], [12pm, 35], [1pm, 45]], step: 10, ylabel: "cars" }
                answer: "40"
              - id: l1-n2
                type: multiple_choice
                text: "Cars in the car park. When were there the most cars?"
                show: { drawn: line-graph, rows: [[8am, 10], [9am, 40], [10am, 55], [11am, 50], [12pm, 35], [1pm, 45]], step: 10, ylabel: "cars" }
                options: ["10am", "11am", "1pm"]
                answer: "10am"
              - id: l1-n3
                type: text_input
                text: "Cars in the car park. How many fewer cars were there at 12pm than at 10am?"
                show: { drawn: line-graph, rows: [[8am, 10], [9am, 40], [10am, 55], [11am, 50], [12pm, 35], [1pm, 45]], step: 10, ylabel: "cars" }
                answer: "20"
              - id: l1-n4
                type: multiple_choice
                text: "Cars in the car park. Between which two times did the number of cars go up the most?"
                show: { drawn: line-graph, rows: [[8am, 10], [9am, 40], [10am, 55], [11am, 50], [12pm, 35], [1pm, 45]], step: 10, ylabel: "cars" }
                options: ["8am and 9am", "9am and 10am", "12pm and 1pm"]
                answer: "8am and 9am"
              - id: l1-n5
                type: true_false
                text: "Is it true? There were more cars at 1pm than at 11am."
                show: { drawn: line-graph, rows: [[8am, 10], [9am, 40], [10am, 55], [11am, 50], [12pm, 35], [1pm, 45]], step: 10, ylabel: "cars" }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A puppy's mass. What was its mass in March?"
            show: { drawn: line-graph, rows: [[Jan, 2], [Feb, 4], [Mar, 5], [Apr, 7], [May, 8]], step: 2, ylabel: "kg" }
            options: ["5 kg", "4 kg", "6 kg"]
            answer: "5 kg"
          - id: l1-c2
            type: text_input
            text: "A puppy's mass. How many kilograms heavier was it in May than in January?"
            show: { drawn: line-graph, rows: [[Jan, 2], [Feb, 4], [Mar, 5], [Apr, 7], [May, 8]], step: 2, ylabel: "kg" }
            answer: "6"
          - id: l1-c3
            type: multiple_choice
            text: "A puppy's mass. In which month was it 7 kg?"
            show: { drawn: line-graph, rows: [[Jan, 2], [Feb, 4], [Mar, 5], [Apr, 7], [May, 8]], step: 2, ylabel: "kg" }
            options: ["April", "March", "May"]
            answer: "April"
          - id: l1-c4
            type: multiple_choice
            text: "Children at the park. When were there the most children?"
            show: { drawn: line-graph, rows: [[10am, 6], [11am, 15], [12pm, 20], [1pm, 12], [2pm, 18]], step: 5, ylabel: "children" }
            options: ["12pm", "2pm", "11am"]
            answer: "12pm"
          - id: l1-c5
            type: text_input
            text: "Children at the park. How many children were there at 11am?"
            show: { drawn: line-graph, rows: [[10am, 6], [11am, 15], [12pm, 20], [1pm, 12], [2pm, 18]], step: 5, ylabel: "children" }
            answer: "15"
          - id: l1-c6
            type: true_false
            text: "Children at the park. Is it true? The number of children fell between 12pm and 1pm."
            show: { drawn: line-graph, rows: [[10am, 6], [11am, 15], [12pm, 20], [1pm, 12], [2pm, 18]], step: 5, ylabel: "children" }
            answer: true

  - n: 2
    title: { de: Vom Diagramm zur Tabelle und zurück, en: Tables and line graphs }
    goal:
      de: "Finde das Liniendiagramm zu einer Tabelle und lies zwischen zwei Messungen ab, so wie etwa 8 Grad um 9 Uhr morgens."
      en: "Match a table to its line graph, and read between two readings, like about 8 degrees at 9 in the morning."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Height of a bean plant. How tall was the plant in week 2?"
            show: { drawn: line-graph, rows: [[Week 1, 2], [Week 2, 5], [Week 3, 9], [Week 4, 12], [Week 5, 14]], step: 2, ylabel: "cm" }
            options: ["5 cm", "4 cm", "6 cm"]
            answer: "5 cm"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Cars in the car park. How many cars were there at 11am?"
            show: { drawn: line-graph, rows: [[8am, 10], [9am, 40], [10am, 55], [11am, 50], [12pm, 35], [1pm, 45]], step: 10, ylabel: "cars" }
            options: ["50", "45", "55"]
            answer: "50"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Temperature on the playground"
            say: "Here is a table of readings: four degrees at 6am, six at 8am, ten at 10am and twelve at 12pm. To draw a line graph, put the times along the bottom in order, and a scale up the side that reaches the biggest reading."
            show: { drawn: table, rows: [[Time, "°C"], [6am, "4"], [8am, "6"], [10am, "10"], [12pm, "12"]] }
          - text: "Plot each reading, then join the points in time order."
            say: "Plot one point for each reading: above 6am at 4, above 8am at 6, and so on. Then join the points with straight lines, from left to right. Do not sort the readings by size."
            show: { drawn: line-graph, rows: [[6am, 4], [8am, 6], [10am, 10], [12pm, 12]], step: 2, ylabel: "°C" }
          - text: "At 9am it was about 8 °C."
            say: "The temperature changed all the time, not only at the readings. 9am is halfway between 8am and 10am. There the line is halfway between 6 and 10, so at 9am it was about 8 degrees."
            show: { drawn: line-graph, rows: [[6am, 4], [8am, 6], [10am, 10], [12pm, 12]], step: 2, ylabel: "°C" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Noon temperatures. Which line graph shows the table?"
                show: { drawn: table, rows: [[Day, "°C"], [Mon, "3"], [Tue, "6"], [Wed, "4"], [Thu, "8"]] }
                options:
                  - { drawn: line-graph, rows: [[Mon, 3], [Tue, 6], [Wed, 4], [Thu, 8]], step: 2, key: right }
                  - { drawn: line-graph, rows: [[Mon, 3], [Tue, 4], [Wed, 6], [Thu, 8]], step: 2, key: sorted }
                  - { drawn: line-graph, rows: [[Mon, 3], [Tue, 6], [Wed, 4], [Thu, 6]], step: 2, key: wrong-thu }
                answer: right
                feedback:
                  sorted: "This graph puts the readings in order of size. A line graph keeps them in time order: Tuesday was 6 °C."
                hints:
                  - "Check each day in turn."
                  - "Tuesday was warmer than Wednesday, so the line goes down from Tuesday to Wednesday."
                  - "The graph that goes 3, 6, 4, 8."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Temperature on the playground. About what was the temperature at 11am?"
                show: { drawn: line-graph, rows: [[6am, 4], [8am, 6], [10am, 10], [12pm, 12]], step: 2, ylabel: "°C" }
                options: ["11 °C", "10 °C", "12 °C"]
                answer: "11 °C"
                hints:
                  - "11am is halfway between 10am and 12pm."
                  - "The line goes from 10 °C to 12 °C there. What is halfway?"
                  - "About 11 °C."
              - id: l2-f3
                type: fill_in_blank
                text: "A bath cools down. Fill in the table from the graph."
                show: { drawn: line-graph, rows: [[0 min, 40], [10 min, 35], [20 min, 30], [30 min, 25], [40 min, 20]], step: 5, ylabel: "°C" }
                frame: "After 10 min: _ °C   After 30 min: _ °C"
                options: ["20", "25", "30", "35"]
                answer: ["35", "25"]
                hints:
                  - "The scale goes up in fives."
                  - "Find 10 min and 30 min along the bottom, go up, then across."
                  - "35 °C and 25 °C."
              - id: l2-f4
                type: true_false
                text: "A bath cools down. Is it true? The water cooled by 20 degrees in 40 minutes."
                show: { drawn: line-graph, rows: [[0 min, 40], [10 min, 35], [20 min, 30], [30 min, 25], [40 min, 20]], step: 5, ylabel: "°C" }
                answer: true
                hints:
                  - "Read the first and the last points."
                  - "40 °C at the start, 20 °C after 40 minutes."
                  - "Yes. 40 − 20 = 20."
              - id: l2-f5
                type: multiple_choice
                text: "Why is a line graph a good choice for the playground temperature?"
                options: ["The temperature changes over time.", "Each child chose one colour.", "There is only one reading."]
                answer: "The temperature changes over time."
                hints:
                  - "What goes along the bottom of a line graph?"
                  - "A line graph shows something changing as time goes on."
                  - "The temperature changes over time."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Height of a sunflower. Which line graph shows the table?"
                show: { drawn: table, rows: [[Week, "cm"], ["1", "3"], ["2", "5"], ["3", "8"], ["4", "10"]] }
                options:
                  - { drawn: line-graph, rows: [[Week 1, 3], [Week 2, 5], [Week 3, 8], [Week 4, 10]], step: 2, key: right }
                  - { drawn: line-graph, rows: [[Week 1, 3], [Week 2, 8], [Week 3, 5], [Week 4, 10]], step: 2, key: swapped }
                  - { drawn: line-graph, rows: [[Week 1, 3], [Week 2, 5], [Week 3, 8], [Week 4, 8]], step: 2, key: flat }
                answer: right
                hints: ["Check week 3 and week 4."]
              - id: l2-s2
                type: multiple_choice
                text: "Temperature on the playground. About what was the temperature at 7am?"
                show: { drawn: line-graph, rows: [[6am, 4], [8am, 6], [10am, 10], [12pm, 12]], step: 2, ylabel: "°C" }
                options: ["5 °C", "4 °C", "6 °C"]
                answer: "5 °C"
                hints: ["7am is halfway between 6am and 8am."]
              - id: l2-s3
                type: text_input
                text: "A bath cools down. How many degrees did it cool between 10 min and 30 min?"
                show: { drawn: line-graph, rows: [[0 min, 40], [10 min, 35], [20 min, 30], [30 min, 25], [40 min, 20]], step: 5, ylabel: "°C" }
                answer: "10"
                hints: ["Read both points, then subtract."]
              - id: l2-s4
                type: multiple_choice
                text: "Ali's table: 1pm 6 °C, 2pm 8 °C, 3pm 7 °C, 4pm 5 °C. He drew this graph. Which point is wrong?"
                show: { drawn: line-graph, rows: [[1pm, 6], [2pm, 8], [3pm, 9], [4pm, 5]], step: 1, ylabel: "°C" }
                options: ["1pm", "2pm", "3pm", "4pm"]
                answer: "3pm"
                hints: ["Check each point against the table."]
              - id: l2-s5
                type: true_false
                text: "Temperature on the playground. Is it true? At 10am it was warmer than at 8am."
                show: { drawn: line-graph, rows: [[6am, 4], [8am, 6], [10am, 10], [12pm, 12]], step: 2, ylabel: "°C" }
                answer: true
                hints: ["Which point is higher?"]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Children in the library. Which line graph shows the table?"
                show: { drawn: table, rows: [[Time, "children"], [10am, "12"], [11am, "20"], [12pm, "16"], [1pm, "24"]] }
                options:
                  - { drawn: line-graph, rows: [[10am, 12], [11am, 20], [12pm, 16], [1pm, 24]], step: 4, key: right }
                  - { drawn: line-graph, rows: [[10am, 12], [11am, 16], [12pm, 20], [1pm, 24]], step: 4, key: sorted }
                  - { drawn: line-graph, rows: [[10am, 20], [11am, 12], [12pm, 16], [1pm, 24]], step: 4, key: swapped }
                answer: right
              - id: l2-n2
                type: multiple_choice
                text: "Temperature on a winter day. About what was the temperature at 11am?"
                show: { drawn: line-graph, rows: [[8am, 2], [10am, 6], [12pm, 10], [2pm, 8]], step: 2, ylabel: "°C" }
                options: ["8 °C", "6 °C", "10 °C"]
                answer: "8 °C"
              - id: l2-n3
                type: text_input
                text: "Temperature on a winter day. How many degrees did it rise from 8am to 12pm?"
                show: { drawn: line-graph, rows: [[8am, 2], [10am, 6], [12pm, 10], [2pm, 8]], step: 2, ylabel: "°C" }
                answer: "8"
              - id: l2-n4
                type: multiple_choice
                text: "Jas's table of noon temperatures: Mon 4 °C, Tue 7 °C, Wed 5 °C, Thu 9 °C. She drew this graph. Which day is plotted wrongly?"
                show: { drawn: line-graph, rows: [[Mon, 4], [Tue, 7], [Wed, 5], [Thu, 6]], step: 1, ylabel: "°C" }
                options: ["Mon", "Tue", "Wed", "Thu"]
                answer: "Thu"
              - id: l2-n5
                type: true_false
                text: "Temperature on a winter day. Is it true? The temperature fell between 12pm and 2pm."
                show: { drawn: line-graph, rows: [[8am, 2], [10am, 6], [12pm, 10], [2pm, 8]], step: 2, ylabel: "°C" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "A cup of tea cools down. What was its temperature after 10 minutes?"
            show: { drawn: line-graph, rows: [[0 min, 80], [5 min, 60], [10 min, 50], [15 min, 40], [20 min, 35]], step: 10, ylabel: "°C" }
            options: ["50 °C", "60 °C", "45 °C"]
            answer: "50 °C"
          - id: l2-c2
            part: change
            type: text_input
            text: "A cup of tea cools down. How many degrees did it cool in the first 5 minutes?"
            show: { drawn: line-graph, rows: [[0 min, 80], [5 min, 60], [10 min, 50], [15 min, 40], [20 min, 35]], step: 10, ylabel: "°C" }
            answer: "20"
          - id: l2-c3
            part: table-graph
