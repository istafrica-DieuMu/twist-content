# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.all-tables
skill: math.mult-div.all-tables
curriculum: en-GB
language: en
title:
  de: Das ganze Einmaleins
  en: All the times tables
summary: >
  Every times table fact to 10 × 10 in mixed order. Lesson 1 picks a
  quick way for each fact (from 5 ×, from 10 ×, by doubling, by
  swapping); lesson 2 finds the facts behind a number, drills the facts
  children find hardest (6 × 7, 6 × 8, 7 × 8, 6 × 9) and missing
  numbers in a fact, and ends with the skill check. The multiplication
  tables check in Year 4 asks for these facts at speed; speed comes from
  practice sessions outside the lessons.
metadata:
  year: year-4
  topic: { de: Einmaleins, en: Times tables }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.table-2-4-8, math.mult-div.table-5-10, math.mult-div.table-3-6-9, math.mult-div.table-7]
  also_practises: [math.mult-div.derive-facts, math.mult-div.commutative]
  vocabulary: { en: [times table, multiplication fact, multiple, swap, double, missing number] }
  forms: [text, audio]
  drawn: []
  facets: [operation-signs]
  parts:
    - { id: facts, what: { de: die Aufgaben des Einmaleins gemischt, en: mixed times-table facts } }
    - { id: missing, what: { de: fehlende Zahlen und Malaufgaben zu einem Ergebnis finden, en: missing numbers and facts for a product } }
    - { id: ways, what: { de: mit Hilfsaufgaben und Tauschaufgaben rechnen, en: working out facts from helper facts and swaps } }
    - { id: in-context, what: { de: Sachaufgaben mit dem Einmaleins, en: word problems with the times tables } }
  misconceptions:
    - id: add-one-not-factor
      what: Going on from a known fact, adds or takes away 1 instead of a whole group (8 × 6 = 8 × 5 + 1)
      addressed: l1-f1 offers "8 × 5 + 1" with feedback, l1-s1 offers "10 × 7 − 1", l1-n1 offers "10 × 4 − 1", l1-n2 has 1 as a chip, l1-c2 offers "5 × 7 + 1", and l2-w2 offers "10 × 6 − 1"
    - id: hard-facts
      what: Gets the facts with no quick way wrong (6 × 7, 6 × 8, 7 × 8, 6 × 9)
      addressed: lesson 2 Learn names 6 × 7, 6 × 8, 7 × 8 and 6 × 9; they come in every stage of lesson 2 (l2-f2, l2-f4, l2-s3, l2-n1, l2-n4) with feedback on 54 for 7 × 8 in l2-f2, and in the skill check (l2-c2, l2-c4)
    - id: swap-changes-result
      what: Thinks swapping the numbers changes the answer
      addressed: l1-f5, l1-s5, l1-n5, l2-w1 and l2-c1 fill a fact and its swapped fact with the same chip, with feedback in l1-f5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Jede Aufgabe hat einen Weg", en: "A way for every fact" }
    goal:
      de: "Finde für jede Malaufgabe einen schnellen Weg, so wie 9 mal 7 ist 70 minus 7."
      en: "Find a quick way for every times fact, like 9 times 7 is 70 take away 7."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "7 × 5 = _"
            say: "Seven times five."
            answer: "35"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "4 × 8 = _"
            say: "Four times eight."
            answer: "32"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 × 6 = 8 × 5 + 8 = 40 + 8 = 48"
            say: "Eight times six is one more eight than eight times five, so add a whole eight: forty add eight is forty-eight."
          - text: "9 × 7 = 10 × 7 − 7 = 70 − 7 = 63"
            say: "Nine sevens are one seven fewer than ten sevens. Seventy take away seven is sixty-three."
          - text: "4 × 6 = double 2 × 6 = double 12 = 24"
            say: "Four is double two, so four times six is double two times six. Double twelve is twenty-four."
          - text: "3 × 8 = 8 × 3 = 24"
            say: "Swap the numbers when the swapped fact is easier for you. Three times eight is the same as eight times three."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which way helps with 8 × 6?"
                say: "Eight times six. Which way helps?"
                options: ["8 × 5 + 8", "8 × 5 + 1", "8 + 6"]
                answer: "8 × 5 + 8"
                feedback:
                  "8 × 5 + 1": "Going from five groups to six adds a whole group of eight, not one."
                hints:
                  - "Start from a fact you know: 8 × 5."
                  - "8 × 6 has one more group of 8 than 8 × 5."
                  - "8 × 5 + 8."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Use 10 × 9 to find 9 × 9."
                say: "Nine times nine. Ten times nine is ninety. How much do you take away?"
                frame: "9 × 9 = 90 − _ = _"
                options: ["1", "9", "81", "89"]
                answer: ["9", "81"]
                hints:
                  - "Nine nines are one nine fewer than ten nines."
                  - "Ninety take away nine."
                  - "9 and 81."
              - id: l1-f3
                type: text_input
                text: "6 × 4 = _"
                say: "Six times four."
                answer: "24"
                hints:
                  - "Double a fact you know."
                  - "3 × 4 = 12, and 6 is double 3."
                  - "Double 12 is 24."
              - id: l1-f4
                type: true_false
                text: "Is it true? 7 × 3 = 24"
                say: "Seven times three is twenty-four. Is it true?"
                answer: false
                hints:
                  - "Swap it: 3 × 7."
                  - "Count in threes or sevens: 7, 14, 21."
                  - "No. 7 × 3 = 21."
              - id: l1-f5
                type: fill_in_blank
                text: "Swap the numbers. Fill both gaps."
                say: "Two times nine and nine times two. Fill both gaps."
                frame: "2 × 9 = _ and 9 × 2 = _"
                options: ["11", "18", "29"]
                answer: ["18", "18"]
                feedback:
                  "11": "That is 2 + 9. Two nines make eighteen."
                hints:
                  - "Swapping the numbers keeps the answer."
                  - "Two nines: 9 + 9."
                  - "18 and 18."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which way helps with 9 × 7?"
                say: "Nine times seven. Which way helps?"
                options: ["10 × 7 − 7", "10 × 7 − 1", "9 + 7"]
                answer: "10 × 7 − 7"
                hints: ["Nine sevens are one whole seven fewer than ten sevens."]
              - id: l1-s2
                type: fill_in_blank
                text: "Use 5 × 8 to find 6 × 8."
                say: "Six times eight. Five times eight is forty. How much do you add?"
                frame: "6 × 8 = 40 + _ = _"
                options: ["1", "8", "41", "48"]
                answer: ["8", "48"]
                hints: ["Add one more group of eight."]
              - id: l1-s3
                type: text_input
                text: "8 × 4 = _"
                say: "Eight times four."
                answer: "32"
                hints: ["Double 4 × 4 = 16."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 6 × 9 = 54"
                say: "Six times nine is fifty-four. Is it true?"
                answer: true
                hints: ["10 × 6 = 60, and take away one six."]
              - id: l1-s5
                type: fill_in_blank
                text: "Swap the numbers. Fill both gaps."
                say: "Three times seven and seven times three. Fill both gaps."
                frame: "3 × 7 = _ and 7 × 3 = _"
                options: ["10", "21", "24"]
                answer: ["21", "21"]
                hints: ["Swapping the numbers keeps the answer."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which way helps with 9 × 4?"
                say: "Nine times four. Which way helps?"
                options: ["10 × 4 − 4", "10 × 4 − 1", "9 + 4"]
                answer: "10 × 4 − 4"
              - id: l1-n2
                type: fill_in_blank
                text: "Use 5 × 6 to find 6 × 6."
                say: "Six times six. Five times six is thirty. How much do you add?"
                frame: "6 × 6 = 30 + _ = _"
                options: ["1", "6", "31", "36"]
                answer: ["6", "36"]
              - id: l1-n3
                type: text_input
                text: "7 × 7 = _"
                say: "Seven times seven."
                answer: "49"
              - id: l1-n4
                type: true_false
                text: "Is it true? 8 × 3 = 26"
                say: "Eight times three is twenty-six. Is it true?"
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Swap the numbers. Fill both gaps."
                say: "Four times nine and nine times four. Fill both gaps."
                frame: "4 × 9 = _ and 9 × 4 = _"
                options: ["13", "32", "36"]
                answer: ["36", "36"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "6 × 3 = _"
            say: "Six times three."
            answer: "18"
          - id: l1-c2
            type: multiple_choice
            text: "Which way helps with 6 × 7?"
            say: "Six times seven. Which way helps?"
            options: ["5 × 7 + 7", "5 × 7 + 1", "6 + 7"]
            answer: "5 × 7 + 7"
          - id: l1-c3
            type: text_input
            text: "9 × 8 = _"
            say: "Nine times eight."
            answer: "72"
          - id: l1-c4
            type: fill_in_blank
            text: "Use 5 × 4 to find 7 × 4."
            say: "Seven times four. Five times four is twenty. How much do you add?"
            frame: "7 × 4 = 20 + _ = _"
            options: ["2", "8", "22", "28"]
            answer: ["8", "28"]
          - id: l1-c5
            type: true_false
            text: "Is it true? 4 × 7 = double 2 × 7"
            say: "Four times seven is double two times seven. Is it true?"
            answer: true
          - id: l1-c6
            type: text_input
            text: "3 × 9 = _"
            say: "Three times nine."
            answer: "27"

  - n: 2
    title: { de: "Schnell und sicher", en: "Quick and sure" }
    goal:
      de: "Lern die kniffligsten Malaufgaben auswendig, so wie 7 mal 8 ist 56, und finde fehlende Zahlen in einer Aufgabe."
      en: "Learn the trickiest facts by heart, like 7 times 8 is 56, and find missing numbers in a fact."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Swap the numbers. Fill both gaps."
            say: "Five times eight and eight times five. Fill both gaps."
            frame: "5 × 8 = _ and 8 × 5 = _"
            options: ["13", "40", "45"]
            answer: ["40", "40"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which way helps with 9 × 6?"
            say: "Nine times six. Which way helps?"
            options: ["10 × 6 − 6", "10 × 6 − 1", "9 + 6"]
            answer: "10 × 6 − 6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "6 × 7 = 42, 6 × 8 = 48, 7 × 8 = 56, 6 × 9 = 54"
            say: "These four facts trip many people up. Six sevens are forty-two, six eights are forty-eight, seven eights are fifty-six, and six nines are fifty-four. Say them again and again until they come straight away."
          - text: "24 = 3 × 8 = 4 × 6"
            say: "Some numbers are in more than one times table. Twenty-four is three times eight, and also four times six. Swapped facts count too: eight times three and six times four."
          - text: "_ × 7 = 63"
            say: "To find a missing number, ask: how many sevens make sixty-three? Nine sevens make sixty-three, so the missing number is nine."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Which number is missing?"
                say: "Something times seven is forty-two. Which number is missing?"
                frame: "_ × 7 = 42"
                options: ["5", "6", "7"]
                answer: ["6"]
                hints:
                  - "How many sevens make 42?"
                  - "Count in sevens: 7, 14, 21, 28, 35, 42."
                  - "6 × 7 = 42."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "7 × 8 = _"
                say: "Seven times eight."
                options: ["54", "56", "58"]
                answer: "56"
                feedback:
                  "54": "54 is 6 × 9. Say five, six, seven, eight: 56 = 7 × 8."
                hints:
                  - "Use 5 × 8 = 40 and 2 × 8 = 16."
                  - "40 + 16."
                  - "56."
              - id: l2-f3
                type: multiple_choice
                text: "Which fact makes 36?"
                say: "Which fact makes thirty-six?"
                options: ["4 × 9", "4 × 8", "5 × 7"]
                answer: "4 × 9"
                hints:
                  - "Work out each fact."
                  - "4 × 8 = 32 and 5 × 7 = 35."
                  - "4 × 9 = 36."
              - id: l2-f4
                type: true_false
                text: "Is it true? 6 × 8 = 46"
                say: "Six times eight is forty-six. Is it true?"
                answer: false
                hints:
                  - "Start from 5 × 8 = 40."
                  - "One more eight: 40 + 8."
                  - "No. 6 × 8 = 48."
              - id: l2-f5
                type: fill_in_blank
                text: "Which number is missing?"
                say: "Eight times something is seventy-two. Which number is missing?"
                frame: "8 × _ = 72"
                options: ["8", "9", "10"]
                answer: ["9"]
                hints:
                  - "Which eight-fact is near 80?"
                  - "10 × 8 = 80. Take away one eight."
                  - "8 × 9 = 72."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which number is missing?"
                say: "Something times six is forty-eight. Which number is missing?"
                frame: "_ × 6 = 48"
                options: ["7", "8", "9"]
                answer: ["8"]
                hints: ["How many sixes make 48?"]
              - id: l2-s2
                type: multiple_choice
                text: "Which fact makes 28?"
                say: "Which fact makes twenty-eight?"
                options: ["4 × 7", "3 × 9", "5 × 6"]
                answer: "4 × 7"
                hints: ["3 × 9 = 27 and 5 × 6 = 30."]
              - id: l2-s3
                type: text_input
                text: "6 × 7 = _"
                say: "Six times seven."
                answer: "42"
                hints: ["5 × 7 = 35, and one more seven."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 9 × 9 = 81"
                say: "Nine times nine is eighty-one. Is it true?"
                answer: true
                hints: ["10 × 9 = 90, take away one nine."]
              - id: l2-s5
                type: fill_in_blank
                text: "Which number is missing?"
                say: "Seven times something is forty-nine. Which number is missing?"
                frame: "7 × _ = 49"
                options: ["6", "7", "8"]
                answer: ["7"]
                hints: ["How many sevens make 49?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A tray holds 6 rows of 9 cupcakes. How many cupcakes is that?"
                answer: "54"
              - id: l2-n2
                type: text_input
                text: "Leo reads 8 pages every day for a week. How many pages does he read?"
                answer: "56"
              - id: l2-n3
                type: text_input
                text: "Chairs stand in 4 rows of 6. How many chairs are there?"
                answer: "24"
              - id: l2-n4
                type: true_false
                text: "Is it true? 8 boxes of 6 eggs hold 48 eggs."
                answer: true
              - id: l2-n5
                type: text_input
                text: "Pencils come in packs of 10. Mrs Shah needs 70 pencils. How many packs does she buy?"
                answer: "7"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ways
            type: fill_in_blank
            text: "Swap the numbers. Fill both gaps."
            say: "Six times four and four times six. Fill both gaps."
            frame: "6 × 4 = _ and 4 × 6 = _"
            options: ["10", "24", "28"]
            answer: ["24", "24"]
          - id: l2-c2
            part: facts
            type: text_input
            text: "8 × 7 = _"
            say: "Eight times seven."
            answer: "56"
          - id: l2-c3
            part: missing
            type: fill_in_blank
            text: "Which number is missing?"
            say: "Something times nine is sixty-three. Which number is missing?"
            frame: "_ × 9 = 63"
            options: ["6", "7", "8"]
            answer: ["7"]
          - id: l2-c4
            part: facts
            type: true_false
            text: "Is it true? 9 × 6 = 56"
            say: "Nine times six is fifty-six. Is it true?"
            answer: false
          - id: l2-c5
            part: missing
            type: multiple_choice
            text: "Which fact makes 32?"
            say: "Which fact makes thirty-two?"
            options: ["4 × 8", "5 × 6", "3 × 9"]
            answer: "4 × 8"
          - id: l2-c6
            part: facts
            type: text_input
            text: "8 × 8 = _"
            say: "Eight times eight."
            answer: "64"
          - id: l2-c7
            part: facts
            type: true_false
            text: "Is it true? 8 × 9 = 63"
            say: "Eight times nine is sixty-three. Is it true?"
            answer: false
          - id: l2-c8
            part: facts
            type: matching
            text: "Match each fact with its answer."
            pairs:
              - { left: { text: "6 × 6" }, right: { text: "36" } }
              - { left: { text: "7 × 4" }, right: { text: "28" } }
              - { left: { text: "9 × 5" }, right: { text: "45" } }
              - { left: { text: "8 × 2" }, right: { text: "16" } }
          - id: l2-c9
            part: missing
            type: fill_in_blank
            text: "Which number is missing?"
            say: "Nine times something is fifty-four. Which number is missing?"
            frame: "9 × _ = 54"
            options: ["5", "6", "7"]
            answer: ["6"]
          - id: l2-c10
            part: missing
            type: multiple_choice
            text: "36 = 4 × 9. Which other fact makes 36?"
            say: "Thirty-six is four times nine. Which other fact makes thirty-six?"
            options: ["6 × 6", "5 × 7", "7 × 6"]
            answer: "6 × 6"
          - id: l2-c11
            part: missing
            type: text_input
            text: "_ × 7 = 56"
            say: "Something times seven is fifty-six. Which number is missing?"
            answer: "8"
          - id: l2-c12
            part: ways
            type: true_false
            text: "Is it true? 7 × 9 = 5 × 9 + 2 × 9"
            say: "Seven times nine is five times nine add two times nine. Is it true?"
            answer: true
          - id: l2-c13
            part: ways
            type: fill_in_blank
            text: "Use 2 × 8 to find 4 × 8."
            say: "Four times eight. Use two times eight and double it."
            frame: "4 × 8 = double _ = _"
            options: ["8", "16", "24", "32"]
            answer: ["16", "32"]
          - id: l2-c14
            part: ways
            type: true_false
            text: "Is it true? 9 × 8 = 10 × 8 − 1"
            say: "Nine times eight is ten times eight take away one. Is it true?"
            answer: false
          - id: l2-c15
            part: ways
            type: fill_in_blank
            text: "Use 10 × 3 to find 9 × 3."
            say: "Nine times three. Ten times three is thirty. How much do you take away?"
            frame: "9 × 3 = 30 − _ = _"
            options: ["1", "3", "27", "29"]
            answer: ["3", "27"]
          - id: l2-c16
            part: in-context
            type: text_input
            text: "Cinema tickets cost £8 each. How much do 6 tickets cost? Type the pounds."
            say: "Cinema tickets cost eight pounds each. How much do six tickets cost? Type the pounds."
            answer: "48"
          - id: l2-c17
            part: in-context
            type: text_input
            text: "A spider has 8 legs. How many legs do 9 spiders have?"
            answer: "72"
          - id: l2-c18
            part: in-context
            type: text_input
            text: "Each table in the hall seats 6 children. How many children can sit at 7 tables?"
            answer: "42"
          - id: l2-c19
            part: in-context
            type: multiple_choice
            text: "Ms Patel puts 63 books into piles of 9. How many piles does she make?"
            options: ["6", "7", "8"]
            answer: "7"
          - id: l2-c20
            part: in-context
            type: true_false
            text: "Is it true? 4 packs of 9 stickers hold 36 stickers."
            answer: true
