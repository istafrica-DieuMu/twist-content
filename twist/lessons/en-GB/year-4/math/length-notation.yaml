# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.length-notation
skill: math.length.notation
curriculum: en-GB
language: en
title:
  de: Längen in Kommaschreibweise
  en: Lengths as decimals
summary: >
  Lesson 1 writes metres and centimetres with a decimal point, like pounds
  and pence (1.25 m = 1 m 25 cm = 125 cm, 1.5 m = 150 cm, 1.05 m = 105
  cm), and centimetres and millimetres on a ruler (4.5 cm = 45 mm). Lesson
  2 learns 1 km = 1000 m (2 km 300 m = 2300 m), then does the same for
  kilometres and metres (2.5 km = 2 km 500 m = 2500 m,
  0.25 km = 250 m), compares lengths written in different ways, and ends
  with the skill check.
metadata:
  year: year-4
  topic: { de: Längen, en: Length }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.mm-km, math.money.decimal-notation]
  also_practises: [math.length.mm-km]
  vocabulary: { en: [millimetre, centimetre, metre, kilometre, decimal point, convert, mm, cm, m, km] }
  forms: [text, audio, drawn]
  drawn: [ruler, table]
  facets: [number-format]
  parts:
    - { id: m-cm, what: { de: Meter und Zentimeter mit Komma schreiben und umwandeln, en: writing and converting metres and centimetres as decimals } }
    - { id: cm-mm, what: { de: Zentimeter und Millimeter mit Komma schreiben und ablesen, en: writing and reading centimetres and millimetres as decimals } }
    - { id: km-m, what: { de: Kilometer und Meter mit Komma schreiben und umwandeln, en: writing and converting kilometres and metres as decimals } }
    - { id: compare, what: { de: Längen in verschiedenen Schreibweisen vergleichen, en: comparing lengths written in different ways } }
  misconceptions:
    - id: point-five-is-five
      what: Reads 1.5 m as 1 m 5 cm (or 2.5 km as 2 km 5 m) instead of one and a half
      addressed: lesson 1 Learn compares 1.5 m with £1.50; l1-f2 has feedback on 15 cm and 105 cm, l2-f1 has feedback on 2050 m, l1-c1, l2-f3, l2-c3 offer the wrong reading
    - id: missing-zero
      what: Drops the zero in 1.05 m or 3.05 km, or writes 1 km 50 m as 1.5 km
      addressed: lesson 1 Learn shows 1.05 m = 105 cm; l1-s4 and l2-f5 judge a missing zero, l2-n3 offers 3500 m for 3.05 km, l1-s2 needs 308
    - id: wrong-factor
      what: Uses 10 or 100 where 1000 is needed (2.5 km = 250 m), or 10 for metres to centimetres
      addressed: lesson 2 Learn says 1 km = 1000 m; l1-f1, l1-s1, l2-s1 and l2-c1 offer the wrong factor
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Meter, Zentimeter und Millimeter", en: "Metres, centimetres and millimetres" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many centimetres are in 1 metre?"
            options: ["100", "10", "1000"]
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "£3.50 is the same as _."
            options: ["£3 and 50p", "£3 and 5p", "350 pounds"]
            answer: "£3 and 50p"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1.25 m = 1 m 25 cm = 125 cm"
            say: "Lengths can be written with a decimal point, just like money. One pound twenty-five is one pound and twenty-five pence. In the same way, one point two five metres is one metre and twenty-five centimetres. That is one hundred and twenty-five centimetres."
          - text: "1.5 m = 1 m 50 cm = 150 cm, like £1.50"
            say: "Take care with one digit after the point. One point five metres is one and a half metres. That is one metre and fifty centimetres, not five centimetres. Think of one pound fifty."
          - text: "1.05 m = 1 m 5 cm = 105 cm"
            say: "With a zero straight after the point, it is only a few centimetres. One point zero five metres is one metre and five centimetres, which is one hundred and five centimetres. Think of one pound and five pence."
          - text: "4.5 cm = 4 cm 5 mm = 45 mm"
            say: "On a ruler, each centimetre has ten millimetres. This strip is four centimetres and five millimetres long. That is four point five centimetres, or forty-five millimetres."
            show: { drawn: ruler, length: 4.5, colour: red }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1.75 m = _"
                options: ["175 cm", "1075 cm", "17 cm"]
                answer: "175 cm"
                hints:
                  - "Read it like money: £1.75."
                  - "1 m and 75 cm."
                  - "100 cm + 75 cm = 175 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "1.5 m = _"
                options: ["150 cm", "15 cm", "105 cm"]
                answer: "150 cm"
                feedback:
                  "105 cm": "1.5 m is one and a half metres, like £1.50. That is 1 m 50 cm."
                  "15 cm": "1.5 m is more than 1 metre, so it is more than 100 cm."
                hints:
                  - "Think of £1.50."
                  - "1.5 m is 1 m and 50 cm."
                  - "150 cm."
              - id: l1-f3
                type: fill_in_blank
                text: "Write 2 m 40 cm in two other ways."
                frame: "_ m = _ cm"
                options: ["2.4", "2.04", "240", "24"]
                answer: ["2.4", "240"]
                hints:
                  - "40 cm is like 40p."
                  - "£2 and 40p is £2.40, so 2 m 40 cm is 2.4 m."
                  - "2.4 m = 240 cm."
              - id: l1-f4
                type: multiple_choice
                text: "How long is the strip?"
                show: { drawn: ruler, length: 3.7, colour: blue }
                options: ["3.7 cm", "37 cm", "3.07 cm"]
                answer: "3.7 cm"
                hints:
                  - "Read the whole centimetres first."
                  - "3 cm and 7 small marks, which are millimetres."
                  - "3 cm 7 mm is 3.7 cm."
              - id: l1-f5
                type: true_false
                text: "45 mm = 4.5 cm"
                say: "Is it true? Forty-five millimetres is four point five centimetres."
                answer: true
                hints:
                  - "10 mm make 1 cm."
                  - "40 mm is 4 cm, and 5 mm are left."
                  - "Yes, 4 cm 5 mm is 4.5 cm."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "2.36 m = _"
                options: ["236 cm", "2036 cm", "23.6 cm"]
                answer: "236 cm"
                hints: ["2 m and 36 cm."]
              - id: l1-s2
                type: text_input
                text: "3 m 8 cm = _ cm"
                answer: "308"
                hints: ["3 m is 300 cm. Add the 8."]
              - id: l1-s3
                type: multiple_choice
                text: "How many millimetres long is the strip?"
                show: { drawn: ruler, length: 6.2, colour: green }
                options: ["62 mm", "6.2 mm", "602 mm"]
                answer: "62 mm"
                hints: ["Each centimetre is 10 mm."]
              - id: l1-s4
                type: true_false
                text: "1.05 m = 1 m 50 cm"
                say: "Is it true? One point zero five metres is one metre and fifty centimetres."
                answer: false
                hints: ["Think of £1.05."]
              - id: l1-s5
                type: text_input
                text: "Write 125 cm in metres."
                keyboard: decimal
                answer: "1.25"
                hints: ["125 cm is 1 m and 25 cm."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "4.5 m = _ cm"
                answer: "450"
              - id: l1-n2
                type: text_input
                text: "Write 2 m 75 cm in metres."
                keyboard: decimal
                answer: "2.75"
              - id: l1-n3
                type: multiple_choice
                text: "Which is the same as 7.2 cm?"
                options: ["72 mm", "7 cm 20 mm", "702 mm"]
                answer: "72 mm"
              - id: l1-n4
                type: text_input
                text: "Sam is 1.34 m tall. How many centimetres is that?"
                answer: "134"
              - id: l1-n5
                type: multiple_choice
                text: "Which is the longest?"
                options: ["1.5 m", "1 m 45 cm", "140 cm"]
                answer: "1.5 m"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "1.25 m = _"
            options: ["125 cm", "1025 cm", "12.5 cm"]
            answer: "125 cm"
          - id: l1-c2
            type: multiple_choice
            text: "How long is the strip?"
            show: { drawn: ruler, length: 5.3, colour: purple }
            options: ["5.3 cm", "53 cm", "5.03 cm"]
            answer: "5.3 cm"
          - id: l1-c3
            type: true_false
            text: "3.5 m = 350 cm"
            say: "Is it true? Three point five metres is three hundred and fifty centimetres."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Which is the same as 3.4 m?"
            options: ["340 cm", "34 cm", "304 cm"]
            answer: "340 cm"
          - id: l1-c5
            type: fill_in_blank
            text: "Write 58 mm in centimetres."
            frame: "58 mm = _ cm"
            options: ["5.8", "58", "0.58"]
            answer: ["5.8"]
          - id: l1-c6
            type: true_false
            text: "2.6 m = 2 m 6 cm"
            say: "Is it true? Two point six metres is two metres and six centimetres."
            answer: false

  - n: 2
    title: { de: Kilometer und Meter, en: Kilometres and metres }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "2.5 m = _"
            options: ["250 cm", "25 cm", "205 cm"]
            answer: "250 cm"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "8.3 cm = _ mm"
            answer: "83"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 km = 1000 m"
            say: "Long distances, like the way to the next town, are measured in kilometres. We write km. One kilometre is one thousand metres. Walking one kilometre takes about fifteen minutes."
          - text: "2 km 300 m = 2000 m + 300 m = 2300 m"
            say: "Two kilometres are two thousand metres. Add the three hundred metres: two thousand three hundred metres."
          - text: "2.5 km = 2 km 500 m = 2500 m"
            say: "Kilometres can be written with a decimal point too. Two point five kilometres is two and a half kilometres. That is two kilometres and five hundred metres, or two thousand five hundred metres."
          - text: "0.5 km = 500 m. 0.25 km = 250 m"
            say: "Half a kilometre is five hundred metres. A quarter of a kilometre is two hundred and fifty metres. So two point two five kilometres is two kilometres and two hundred and fifty metres."
          - text: "3 km 750 m = 3.75 km = 3750 m"
            say: "Going the other way: three kilometres and seven hundred and fifty metres is three point seven five kilometres. In metres it is three thousand seven hundred and fifty."
          - text: "Three ways to write the same length"
            say: "Here are some lengths written three ways. Look at the last row: one point zero five kilometres is one kilometre and fifty metres, so the zero after the point matters."
            show: { drawn: table, rows: [["km", "km and m", "m"], ["2.5 km", "2 km 500 m", "2500 m"], ["0.25 km", "250 m", "250 m"], ["3.75 km", "3 km 750 m", "3750 m"], ["1.05 km", "1 km 50 m", "1050 m"]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "2.5 km = _"
                options: ["2500 m", "250 m", "2050 m"]
                answer: "2500 m"
                feedback:
                  "2050 m": "2.5 km is two and a half kilometres. Half a kilometre is 500 m, so 2500 m."
                  "250 m": "1 km is 1000 m, so 2 km alone is already 2000 m."
                hints:
                  - "1 km is 1000 m."
                  - "2 km is 2000 m, and 0.5 km is half a kilometre."
                  - "2000 m + 500 m = 2500 m."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Write 4 km 200 m in two other ways."
                frame: "_ km = _ m"
                options: ["4.2", "4.02", "4200", "420"]
                answer: ["4.2", "4200"]
                hints:
                  - "200 m is 0.2 of a kilometre."
                  - "4 km 200 m is 4.2 km."
                  - "4.2 km = 4200 m."
              - id: l2-f3
                type: multiple_choice
                text: "How many metres is 0.5 km?"
                options: ["500 m", "50 m", "5 m"]
                answer: "500 m"
                hints:
                  - "0.5 km is half a kilometre."
                  - "Half of 1000 m."
                  - "500 m."
              - id: l2-f4
                type: text_input
                text: "Write 3500 m in kilometres."
                keyboard: decimal
                answer: "3.5"
                hints:
                  - "3000 m is 3 km."
                  - "500 m left over is half a kilometre."
                  - "3.5 km."
              - id: l2-f5
                type: true_false
                text: "1 km 50 m = 1.5 km"
                say: "Is it true? One kilometre and fifty metres is one point five kilometres."
                answer: false
                hints:
                  - "1.5 km is one and a half kilometres. How many metres is that?"
                  - "1.5 km is 1 km 500 m, not 1 km 50 m."
                  - "No. 1 km 50 m is 1.05 km."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "6.25 km = _"
                options: ["6250 m", "625 m", "6025 m"]
                answer: "6250 m"
                hints: ["6 km and a quarter of a kilometre."]
              - id: l2-s2
                type: text_input
                text: "1 km 800 m = _ m"
                answer: "1800"
                hints: ["1 km is 1000 m."]
              - id: l2-s3
                type: text_input
                text: "Write 2 km 750 m in kilometres."
                keyboard: decimal
                answer: "2.75"
                hints: ["750 m is three quarters of a kilometre."]
              - id: l2-s4
                type: true_false
                text: "A quarter of a kilometre is 250 m."
                say: "Is it true? A quarter of a kilometre is two hundred and fifty metres."
                answer: true
                hints: ["1000 ÷ 4."]
              - id: l2-s5
                type: multiple_choice
                text: "Which walk is the longest?"
                options: ["1.8 km", "1 km 750 m", "1700 m"]
                answer: "1.8 km"
                hints: ["Write them all in metres."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "7.5 km = _ m"
                answer: "7500"
              - id: l2-n2
                type: text_input
                text: "Write 4250 m in kilometres."
                keyboard: decimal
                answer: "4.25"
              - id: l2-n3
                type: multiple_choice
                text: "Which is the same as 3.05 km?"
                options: ["3050 m", "3500 m", "305 m"]
                answer: "3050 m"
              - id: l2-n4
                type: text_input
                text: "A race is 5 km long. Mo has run 3.5 km. How many metres are left?"
                answer: "1500"
              - id: l2-n5
                type: multiple_choice
                text: "Which is the shortest?"
                options: ["0.4 km", "450 m", "1 km"]
                answer: "0.4 km"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: m-cm
            type: multiple_choice
            text: "1.2 m = _"
            options: ["120 cm", "12 cm", "102 cm"]
            answer: "120 cm"
          - id: l2-c2
            part: cm-mm
            type: text_input
            text: "6.4 cm = _ mm"
            answer: "64"
          - id: l2-c3
            part: km-m
            type: multiple_choice
            text: "3.5 km = _"
            options: ["3 km 500 m", "3 km 5 m", "35 km"]
            answer: "3 km 500 m"
          - id: l2-c4
            part: km-m
            type: text_input
            text: "Write 1 km 250 m in kilometres."
            keyboard: decimal
            answer: "1.25"
          - id: l2-c5
            part: compare
            type: multiple_choice
            text: "Which is the longest?"
            options: ["2.1 km", "2 km 90 m", "2009 m"]
            answer: "2.1 km"
          - id: l2-c6
            part: m-cm
            type: multiple_choice
            text: "2.08 m = _"
            options: ["208 cm", "280 cm", "20.8 cm"]
            answer: "208 cm"
          - id: l2-c7
            part: m-cm
            type: fill_in_blank
            text: "Write 360 cm in metres."
            frame: "360 cm = _ m"
            options: ["3.6", "36", "3.06"]
            answer: ["3.6"]
          - id: l2-c8
            part: m-cm
            type: true_false
            text: "4 m 7 cm = 4.7 m"
            say: "Is it true? Four metres and seven centimetres is four point seven metres."
            answer: false
          - id: l2-c9
            part: m-cm
            type: matching
            text: "Match each length in metres with the same length in centimetres."
            pairs:
              - { left: { text: "2.7 m" }, right: { text: "270 cm" } }
              - { left: { text: "2.07 m" }, right: { text: "207 cm" } }
              - { left: { text: "0.27 m" }, right: { text: "27 cm" } }
          - id: l2-c10
            part: cm-mm
            type: text_input
            text: "How long is the strip in centimetres?"
            show: { drawn: ruler, length: 9.1, colour: orange }
            keyboard: decimal
            answer: "9.1"
          - id: l2-c11
            part: cm-mm
            type: fill_in_blank
            text: "Write 7 cm 3 mm in two other ways."
            frame: "_ cm = _ mm"
            options: ["7.3", "7.03", "73", "703"]
            answer: ["7.3", "73"]
          - id: l2-c12
            part: cm-mm
            type: true_false
            text: "6 cm 4 mm = 6.04 cm"
            say: "Is it true? Six centimetres and four millimetres is six point zero four centimetres."
            answer: false
          - id: l2-c13
            part: cm-mm
            type: multiple_choice
            text: "A beetle is 23 mm long. How long is that in centimetres?"
            options: ["2.3 cm", "23 cm", "2.03 cm"]
            answer: "2.3 cm"
          - id: l2-c14
            part: km-m
            type: fill_in_blank
            text: "Write 6 km 40 m in kilometres."
            frame: "6 km 40 m = _ km"
            options: ["6.04", "6.4", "64"]
            answer: ["6.04"]
          - id: l2-c15
            part: km-m
            type: true_false
            text: "4.3 km = 4300 m"
            say: "Is it true? Four point three kilometres is four thousand three hundred metres."
            answer: true
          - id: l2-c16
            part: km-m
            type: multiple_choice
            text: "The walk to the park is 750 m. How many kilometres is that?"
            options: ["0.75 km", "7.5 km", "75 km"]
            answer: "0.75 km"
          - id: l2-c17
            part: km-m
            type: text_input
            text: "A bike ride is 8 km 600 m long. How many metres is that?"
            answer: "8600"
          - id: l2-c18
            part: compare
            type: multiple_choice
            text: "Which is the shortest?"
            options: ["1.09 m", "1 m 10 cm", "1.9 m"]
            answer: "1.09 m"
          - id: l2-c19
            part: compare
            type: ordering
            text: "Put the lengths in order, shortest first."
            options: ["3.2 m", "302 cm", "3 m 25 cm"]
            slot_count: 3
            answer: ["302 cm", "3.2 m", "3 m 25 cm"]
          - id: l2-c20
            part: compare
            type: true_false
            text: "2.4 km is longer than 2 km 90 m."
            say: "Is it true? Two point four kilometres is longer than two kilometres and ninety metres."
            answer: true
