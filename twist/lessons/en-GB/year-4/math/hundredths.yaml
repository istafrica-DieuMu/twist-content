# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.hundredths
skill: math.decimals.hundredths
curriculum: en-GB
language: en
title:
  de: Hundertstel
  en: Hundredths
summary: >
  Hundredths as one whole split into a hundred equal parts, written as
  fractions and as decimals (7/100 = 0.07, 3/10 = 0.3 = 30/100). Lesson 1
  reads hundredths on a hundred field and in a place value chart with
  tenths and hundredths; lesson 2 counts on and back in hundredths across
  a tenth, reads them on a number line, writes pence as pounds, and ends
  with the skill check.
metadata:
  year: year-4
  topic: { de: Dezimalzahlen, en: Decimals }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.decimals.tenths]
  also_practises: [math.decimals.tenths]
  vocabulary: { en: [hundredth, tenth, decimal, decimal point, whole, pence, pounds] }
  forms: [drawn, text, audio]
  drawn: [hundred-field, place-value-chart, number-line]
  facets: [number-format, currency]
  parts:
    - { id: read, what: { de: "Hundertstel am Hunderterfeld, in der Stellentafel und am Zahlenstrahl ablesen", en: "reading hundredths on a hundred field, a place value chart and a number line" } }
    - { id: write, what: { de: Zehntel und Hundertstel als Dezimalzahl schreiben, en: writing tenths and hundredths as decimals } }
    - { id: count, what: { de: in Hundertsteln vorwärts und rückwärts zählen, en: counting on and back in hundredths } }
    - { id: money, what: { de: Pence als Pfund schreiben, en: writing pence as pounds } }
  misconceptions:
    - id: hundredths-as-tenths
      what: Writes 7 hundredths as 0.7, missing the zero in the tenths place
      addressed: lesson 1 Learn shows 0.07 in the chart with 0 tenths; l1-f1 has feedback on 0.9, l1-s4 and l1-n3 put a zero in the tenths, l2-f4 has feedback on £0.9
    - id: after-09-comes-010
      what: Counts on from 0.09 to 0.010, or from 0.29 to 0.210
      addressed: lesson 2 Learn says ten hundredths make the next tenth; l2-f2, l2-s2, l2-n5 and l2-c5 cross a tenth, with feedback in l2-s2
    - id: fifty-hundredths
      what: Does not see that 50 hundredths and 5 tenths are the same number
      addressed: lesson 1 Learn shows 3/10 as 30/100; l1-f4 and l1-s3 ask it, with feedback in l1-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Zehntel und Hundertstel, en: Tenths and hundredths }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Write 3/10 as a decimal."
            say: "Write three tenths as a decimal."
            options: ["0.3", "3.10", "3.0"]
            answer: "0.3"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Count on in tenths: 0.6, 0.7, 0.8, _"
            say: "Count on in tenths. Zero point six, zero point seven, zero point eight. What comes next?"
            options: ["0.9", "0.10", "1.0"]
            answer: "0.9"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 whole = 100 hundredths\n1/100 = 0.01"
            say: "Split one whole into a hundred equal parts. Each part is one hundredth. We write it as the fraction one hundredth, or as the decimal zero point zero one."
            show: { drawn: hundred-field, filled: 1 }
          - text: "7/100 = 0.07"
            say: "Seven hundredths is zero point zero seven. There are no tenths, so the tenths digit is zero. The seven goes in the hundredths column."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 0, 7] }
          - text: "3/10 = 30/100 = 0.3"
            say: "Three whole rows of the field are three tenths. They are also thirty hundredths. Both are zero point three."
            show: { drawn: hundred-field, filled: 30 }
          - text: "34/100 = 0.34\n3 tenths and 4 hundredths"
            say: "Thirty-four hundredths is three tenths and four hundredths. We write zero point three four."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 3, 4] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The whole field is 1. What decimal is filled?"
                show: { drawn: hundred-field, filled: 9 }
                options: ["0.09", "0.9", "9.0"]
                answer: "0.09"
                feedback:
                  "0.9": "0.9 is nine tenths: nine whole rows. Only nine dots are filled, so it is nine hundredths."
                hints:
                  - "Is a whole row filled, or only some dots?"
                  - "Nine dots out of a hundred are nine hundredths. There are no whole tenths."
                  - "0.09."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Write 3/100 as a decimal."
                say: "Write three hundredths as a decimal."
                frame: "3/100 = 0._ _"
                options: ["0", "3", "30"]
                answer: ["0", "3"]
                hints:
                  - "Hundredths go in the second place after the decimal point."
                  - "There are no tenths, so the first place is 0."
                  - "0.03."
              - id: l1-f3
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 4, 6] }
                options: ["0.46", "0.64", "4.6"]
                answer: "0.46"
                hints:
                  - "Read the chart from left to right."
                  - "0 ones, 4 tenths, 6 hundredths."
                  - "0.46."
              - id: l1-f4
                type: multiple_choice
                text: "The whole field is 1. What decimal is filled?"
                show: { drawn: hundred-field, filled: 50 }
                options: ["0.5", "0.05", "50.0"]
                answer: "0.5"
                feedback:
                  "0.05": "Five whole rows are filled. That is 5 tenths, or 50 hundredths: 0.5."
                hints:
                  - "Count the whole rows. Each row is one tenth."
                  - "5 rows are 5 tenths, the same as 50 hundredths."
                  - "0.5."
              - id: l1-f5
                type: fill_in_blank
                text: "Split 0.72 into tenths and hundredths."
                frame: "0.72 = _ tenths and _ hundredths"
                options: ["2", "7", "72"]
                answer: ["7", "2"]
                hints:
                  - "The first digit after the point is tenths."
                  - "7 is in the tenths place, 2 is in the hundredths place."
                  - "7 tenths and 2 hundredths."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The whole field is 1. What decimal is filled?"
                show: { drawn: hundred-field, filled: 23 }
                options: ["0.23", "2.3", "0.32"]
                answer: "0.23"
                hints: ["2 whole rows and 3 more dots: 2 tenths and 3 hundredths."]
              - id: l1-s2
                type: fill_in_blank
                text: "Write 8/100 as a decimal."
                say: "Write eight hundredths as a decimal."
                frame: "8/100 = 0._ _"
                options: ["0", "8", "80"]
                answer: ["0", "8"]
                hints: ["No tenths, so the tenths digit is 0."]
              - id: l1-s3
                type: true_false
                text: "Is it true? 0.4 is the same as 40/100."
                say: "Is it true? Zero point four is the same as forty hundredths."
                answer: true
                hints: ["One tenth is ten hundredths."]
              - id: l1-s4
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 0, 5] }
                options: ["0.05", "0.5", "5"]
                answer: "0.05"
                hints: ["The 5 is in the hundredths column."]
              - id: l1-s5
                type: matching
                text: "Match each decimal with its fraction."
                option_audio: false
                pairs:
                  - { left: { text: "0.6" }, right: { text: "6/10" } }
                  - { left: { text: "0.06" }, right: { text: "6/100" } }
                  - { left: { text: "0.61" }, right: { text: "61/100" } }
                hints: ["Count the places after the point: one place is tenths, two places are hundredths."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The whole field is 1. What decimal is filled?"
                show: { drawn: hundred-field, filled: 61 }
                options: ["0.61", "6.1", "0.16"]
                answer: "0.61"
              - id: l1-n2
                type: text_input
                text: "Write 45/100 as a decimal."
                say: "Write forty-five hundredths as a decimal."
                keyboard: decimal
                answer: "0.45"
              - id: l1-n3
                type: fill_in_blank
                text: "Split 0.09 into tenths and hundredths."
                frame: "0.09 = _ tenths and _ hundredths"
                options: ["0", "9", "90"]
                answer: ["0", "9"]
              - id: l1-n4
                type: true_false
                text: "Is it true? 0.3 and 0.03 are the same."
                say: "Is it true? Zero point three and zero point zero three are the same."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Which decimal is 5 tenths and 8 hundredths?"
                options: ["0.58", "0.85", "5.8"]
                answer: "0.58"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The whole field is 1. What decimal is filled?"
            show: { drawn: hundred-field, filled: 14 }
            options: ["0.14", "1.4", "0.41"]
            answer: "0.14"
          - id: l1-c2
            type: multiple_choice
            text: "Write 2/100 as a decimal."
            say: "Write two hundredths as a decimal."
            options: ["0.02", "0.2", "0.12"]
            answer: "0.02"
          - id: l1-c3
            type: fill_in_blank
            text: "Split 0.36 into tenths and hundredths."
            frame: "0.36 = _ tenths and _ hundredths"
            options: ["3", "6", "36"]
            answer: ["3", "6"]
          - id: l1-c4
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 2, 0] }
            options: ["0.2", "0.02", "2.0"]
            answer: "0.2"
          - id: l1-c5
            type: true_false
            text: "Is it true? 0.08 = 8/10"
            say: "Is it true? Zero point zero eight is eight tenths."
            answer: false
          - id: l1-c6
            type: text_input
            text: "Write 25/100 as a decimal."
            say: "Write twenty-five hundredths as a decimal."
            keyboard: decimal
            answer: "0.25"

  - n: 2
    title: { de: In Hundertsteln zählen, en: Count in hundredths }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The whole field is 1. What decimal is filled?"
            show: { drawn: hundred-field, filled: 40 }
            options: ["0.4", "0.04", "4.0"]
            answer: "0.4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Write 6/100 as a decimal."
            say: "Write six hundredths as a decimal."
            options: ["0.06", "0.6", "6.0"]
            answer: "0.06"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "0.01, 0.02, 0.03 ... 0.09, 0.1"
            say: "Count in hundredths: zero point zero one, zero point zero two, zero point zero three, all the way to zero point zero nine. Ten hundredths make one tenth, so the next number is zero point one."
            show: { drawn: number-line, from: 0, to: 0.1, step: 0.01, labels: ends }
          - text: "0.28, 0.29, 0.3, 0.31"
            say: "After zero point two nine comes zero point three, because ten hundredths make the next tenth. Then we go on: zero point three one."
            show: { drawn: number-line, from: 0.2, to: 0.4, step: 0.01, labels: tens, mark: 0.3 }
          - text: "1p = £0.01\n7p = £0.07\n35p = £0.35"
            say: "A penny is one hundredth of a pound, so one penny is written zero point zero one pounds. Seven pence is zero point zero seven pounds, and thirty-five pence is zero point three five pounds."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What number does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 0.1, step: 0.01, labels: ends, mark: 0.06 }
                options: ["0.06", "0.6", "6"]
                answer: "0.06"
                hints:
                  - "The line goes from 0 to 0.1 in ten small steps."
                  - "Each step is one hundredth. Count the steps to the arrow."
                  - "6 steps: 0.06."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Count on in hundredths."
                frame: "0.27, 0.28, 0.29, _ , _"
                options: ["0.3", "0.31", "0.210", "0.4"]
                answer: ["0.3", "0.31"]
                hints:
                  - "What do ten hundredths make?"
                  - "After 0.29 the hundredths are full, so the tenths go up by one."
                  - "0.3, then 0.31."
              - id: l2-f3
                type: multiple_choice
                text: "Count back in hundredths: 0.53, 0.52, 0.51, _"
                options: ["0.5", "0.49", "0.41"]
                answer: "0.5"
                feedback:
                  "0.49": "0.49 comes one step later. One hundredth less than 0.51 is 0.50, which is 0.5."
                hints:
                  - "Take away one hundredth each time."
                  - "The hundredths digit goes 3, 2, 1, then 0."
                  - "0.50 is written 0.5."
              - id: l2-f4
                type: multiple_choice
                text: "Write 9p in pounds."
                options: ["£0.09", "£0.9", "£9"]
                answer: "£0.09"
                feedback:
                  "£0.9": "£0.90 is 90p. 9p is nine hundredths of a pound."
                hints:
                  - "One penny is one hundredth of a pound."
                  - "9p is 9 hundredths, with no tenths."
                  - "£0.09."
              - id: l2-f5
                type: multiple_choice
                text: "What number does the arrow point to?"
                show: { drawn: number-line, from: 0.3, to: 0.4, step: 0.01, labels: ends, mark: 0.37 }
                options: ["0.37", "3.7", "0.47"]
                answer: "0.37"
                hints:
                  - "The line goes from 0.3 to 0.4 in hundredths."
                  - "Count 7 steps on from 0.3."
                  - "0.37."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What number does the arrow point to?"
                show: { drawn: number-line, from: 0, to: 0.1, step: 0.01, labels: ends, mark: 0.03 }
                options: ["0.03", "0.3", "0.13"]
                answer: "0.03"
                hints: ["Each small step is one hundredth."]
              - id: l2-s2
                type: multiple_choice
                text: "Count on in hundredths: 0.07, 0.08, 0.09, _"
                options: ["0.1", "0.010", "0.19"]
                answer: "0.1"
                feedback:
                  "0.010": "0.010 is the same as 0.01. Ten hundredths make one tenth: 0.1."
                hints: ["Ten hundredths make one tenth."]
              - id: l2-s3
                type: multiple_choice
                text: "Write 48p in pounds."
                options: ["£0.48", "£4.8", "£48"]
                answer: "£0.48"
                hints: ["48p is 48 hundredths of a pound."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Ten hundredths make one tenth."
                answer: true
                hints: ["Ten dots make one row of the hundred field."]
              - id: l2-s5
                type: multiple_choice
                text: "What number does the arrow point to?"
                show: { drawn: number-line, from: 0.6, to: 0.7, step: 0.01, labels: ends, mark: 0.64 }
                options: ["0.64", "0.46", "6.4"]
                answer: "0.64"
                hints: ["Count on in hundredths from 0.6."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Count on in hundredths."
                frame: "0.96, 0.97, _ , _ , 1"
                options: ["0.98", "0.99", "0.100", "1.1"]
                answer: ["0.98", "0.99"]
              - id: l2-n2
                type: text_input
                text: "Sam has £0.25. How many pence is that?"
                answer: "25"
              - id: l2-n3
                type: multiple_choice
                text: "What number does the arrow point to?"
                show: { drawn: number-line, from: 0.8, to: 0.9, step: 0.01, labels: ends, mark: 0.82 }
                options: ["0.82", "0.28", "8.2"]
                answer: "0.82"
              - id: l2-n4
                type: true_false
                text: "Is it true? £0.05 is 50p."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Which number is one hundredth more than 0.39?"
                options: ["0.4", "0.310", "0.49"]
                answer: "0.4"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "The whole field is 1. What decimal is filled?"
            show: { drawn: hundred-field, filled: 57 }
            options: ["0.57", "5.7", "0.75"]
            answer: "0.57"
          - id: l2-c2
            part: write
            type: text_input
            text: "Write 4/100 as a decimal."
            say: "Write four hundredths as a decimal."
            keyboard: decimal
            answer: "0.04"
          - id: l2-c3
            part: read
            type: multiple_choice
            text: "What number does the arrow point to?"
            show: { drawn: number-line, from: 0.1, to: 0.2, step: 0.01, labels: ends, mark: 0.18 }
            options: ["0.18", "0.81", "1.8"]
            answer: "0.18"
          - id: l2-c4
            part: write
            type: fill_in_blank
            text: "Split 0.63 into tenths and hundredths."
            frame: "0.63 = _ tenths and _ hundredths"
            options: ["3", "6", "63"]
            answer: ["6", "3"]
          - id: l2-c5
            part: count
            type: multiple_choice
            text: "Count on in hundredths: 0.47, 0.48, 0.49, _"
            options: ["0.5", "0.410", "0.59"]
            answer: "0.5"
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 9, 1] }
            options: ["0.91", "0.19", "9.1"]
            answer: "0.91"
          - id: l2-c7
            part: read
            type: true_false
            text: "The whole field is 1. Is it true? 0.07 is filled."
            say: "The whole field is one. Is it true? Zero point zero seven is filled."
            show: { drawn: hundred-field, filled: 70 }
            answer: false
          - id: l2-c8
            part: read
            type: multiple_choice
            text: "What number does the arrow point to?"
            show: { drawn: number-line, from: 0.5, to: 0.6, step: 0.01, labels: ends, mark: 0.55 }
            options: ["0.55", "0.5", "5.5"]
            answer: "0.55"
          - id: l2-c9
            part: write
            type: text_input
            text: "Write 81/100 as a decimal."
            say: "Write eighty-one hundredths as a decimal."
            keyboard: decimal
            answer: "0.81"
          - id: l2-c10
            part: write
            type: fill_in_blank
            text: "Write 0.5 as hundredths."
            say: "Write zero point five as hundredths."
            frame: "0.5 = _/100"
            options: ["5", "50", "500"]
            answer: ["50"]
          - id: l2-c11
            part: write
            type: true_false
            text: "Is it true? 0.10 is the same as 0.1."
            say: "Is it true? Zero point one zero is the same as zero point one."
            answer: true
          - id: l2-c12
            part: count
            type: fill_in_blank
            text: "Count back in hundredths."
            frame: "0.62, 0.61, _ , _"
            options: ["0.6", "0.59", "0.69", "0.51"]
            answer: ["0.6", "0.59"]
          - id: l2-c13
            part: count
            type: multiple_choice
            text: "Which number is one hundredth less than 0.8?"
            options: ["0.79", "0.7", "0.81"]
            answer: "0.79"
          - id: l2-c14
            part: count
            type: ordering
            text: "Put the numbers in order, counting on in hundredths."
            options: ["0.1", "0.09", "0.11", "0.08"]
            slot_count: 4
            answer: ["0.08", "0.09", "0.1", "0.11"]
          - id: l2-c15
            part: count
            type: true_false
            text: "Is it true? Counting on in hundredths, 0.510 comes after 0.59."
            say: "Is it true? Counting on in hundredths, zero point five one zero comes after zero point five nine."
            answer: false
          - id: l2-c16
            part: money
            type: text_input
            text: "Write 72p in pounds. Type the pounds."
            say: "Write seventy-two pence in pounds. Type the pounds."
            keyboard: decimal
            answer: "0.72"
          - id: l2-c17
            part: money
            type: true_false
            text: "Is it true? £0.30 is 30p."
            say: "Is it true? Zero point three zero pounds is thirty pence."
            answer: true
          - id: l2-c18
            part: money
            type: multiple_choice
            text: "Ella has £0.08. How many pence is that?"
            options: ["8p", "80p", "800p"]
            answer: "8p"
          - id: l2-c19
            part: money
            type: matching
            text: "Match each amount in pence with the same amount in pounds."
            option_audio: false
            pairs:
              - { left: { text: "3p" }, right: { text: "£0.03" } }
              - { left: { text: "30p" }, right: { text: "£0.30" } }
              - { left: { text: "33p" }, right: { text: "£0.33" } }
          - id: l2-c20
            part: money
            type: multiple_choice
            text: "A pencil costs 45p and a rubber costs 9p. How much do they cost together, in pounds?"
            options: ["£0.54", "£0.45", "£5.40"]
            answer: "£0.54"
