# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.acute-obtuse
skill: math.angles.acute-obtuse
curriculum: en-GB
language: en
title:
  de: Spitze und stumpfe Winkel
  en: Acute and obtuse angles
summary: >
  Acute, right and obtuse angles, compared with a right angle and with a
  straight line (two right angles). Lesson 1 names angles drawn at any
  turn and between the hands of a clock; lesson 2 compares and orders
  angles up to two right angles by size and ends with the skill check.
  Angles are compared by eye and in right angles: degrees and the
  protractor come in Year 5.
metadata:
  year: year-4
  topic: { de: Winkel, en: Angles }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.angles.right-angles]
  also_practises: [math.angles.right-angles]
  vocabulary: { en: [angle, acute, obtuse, right angle, straight line, arm, smaller, bigger, order] }
  forms: [drawn, text, audio]
  drawn: [angle, clock]
  facets: []
  misconceptions:
    - id: turned-angle
      what: Thinks an angle changes kind when it is turned (a tilted right angle is not a right angle)
      addressed: lesson 1 Learn turns an acute angle round; l1-f4 has feedback on a turned right angle, and l1-s1, l1-n1, l1-n5 and l2-c1 show turned angles
    - id: swaps-acute-obtuse
      what: Mixes up the words acute and obtuse
      addressed: lesson 1 Learn names each with its picture; l1-f2 has feedback, l1-s4 matches angles with names and l1-s5 asks from the description
    - id: obtuse-not-straight
      what: Does not see that an obtuse angle stays smaller than a straight line, or that two right angles make a straight line
      addressed: lesson 2 Learn shows two right angles as a straight line; l2-f3, l2-f4, l2-s4 and l2-c4 order and name them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Spitz, recht oder stumpf", en: "Acute, right or obtuse" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Is it true? This is a right angle."
            show: { drawn: angle, degrees: 90, label: false }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many right angles make a half turn?"
            options: ["1", "2", "4"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A right angle is a quarter turn."
            say: "You know this one. A right angle is a quarter turn, like the corner of a page. The small square shows that it is a right angle."
            show: { drawn: angle, degrees: 90, label: false }
          - text: "Acute: smaller than a right angle"
            say: "An acute angle is smaller than a right angle. Its arms are closer together than the corner of a page."
            show: { drawn: angle, degrees: 40, label: false }
          - text: "Obtuse: bigger than a right angle, smaller than a straight line"
            say: "An obtuse angle is bigger than a right angle, but smaller than a straight line. A straight line is two right angles."
            show: { drawn: angle, degrees: 130, label: false }
          - text: "Turned round, it is still acute."
            say: "Turning an angle does not change its size. To check, compare it with a right angle: picture the corner of a page laid on it."
            show: { drawn: angle, degrees: 60, rotate: 150, label: false }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What kind of angle is this?"
                show: { drawn: angle, degrees: 30, label: false }
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "acute"
                hints:
                  - "Compare it with a right angle, the corner of a page."
                  - "The arms are much closer together than a right angle."
                  - "Smaller than a right angle: acute."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What kind of angle is this?"
                show: { drawn: angle, degrees: 120, label: false }
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "obtuse"
                feedback:
                  "acute": "This angle opens wider than a right angle. Acute angles are the small ones; this one is obtuse."
                hints:
                  - "Is it smaller or bigger than a right angle?"
                  - "The arms open wider than the corner of a page, but not to a straight line."
                  - "Bigger than a right angle: obtuse."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which angle is obtuse?"
                options:
                  - { drawn: angle, degrees: 50, label: false, key: a50 }
                  - { drawn: angle, degrees: 90, label: false, key: a90 }
                  - { drawn: angle, degrees: 150, label: false, key: a150 }
                answer: a150
                hints:
                  - "An obtuse angle is bigger than a right angle."
                  - "One angle has the right angle square. Which one opens wider than that?"
                  - "The widest angle, nearly a straight line."
              - id: l1-f4
                type: multiple_choice
                text: "What kind of angle is this?"
                show: { drawn: angle, degrees: 90, rotate: 30, label: false }
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "right"
                feedback:
                  "acute": "It is tilted, but it is still a quarter turn. Tilting an angle does not change its size."
                  "obtuse": "It is tilted, but it is still a quarter turn. Tilting an angle does not change its size."
                hints:
                  - "Turn your head, or picture the angle turned back."
                  - "Look for the small square in the corner."
                  - "It is a right angle, just turned."
              - id: l1-f5
                type: true_false
                text: "Is it true? This angle is acute."
                show: { drawn: angle, degrees: 110, label: false }
                answer: false
                hints:
                  - "Compare it with a right angle."
                  - "It opens a little wider than the corner of a page."
                  - "No. It is bigger than a right angle, so it is obtuse."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What kind of angle is this?"
                show: { drawn: angle, degrees: 70, rotate: 200, label: false }
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "acute"
                hints: ["Turning does not change the size. Is it smaller than a right angle?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which angle is acute?"
                options:
                  - { drawn: angle, degrees: 110, label: false, key: a110 }
                  - { drawn: angle, degrees: 70, label: false, key: a70 }
                  - { drawn: angle, degrees: 160, label: false, key: a160 }
                answer: a70
                hints: ["An acute angle is smaller than a right angle."]
              - id: l1-s3
                type: multiple_choice
                text: "What kind of angle is this?"
                show: { drawn: angle, degrees: 160, label: false }
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "obtuse"
                hints: ["It is almost a straight line."]
              - id: l1-s4
                type: matching
                text: "Match each angle with its name."
                pairs:
                  - { left: { drawn: angle, degrees: 20, label: false }, right: { text: "acute" } }
                  - { left: { drawn: angle, degrees: 90, label: false }, right: { text: "right" } }
                  - { left: { drawn: angle, degrees: 140, label: false }, right: { text: "obtuse" } }
                hints: ["Acute is the small one, obtuse the wide one."]
              - id: l1-s5
                type: multiple_choice
                text: "An angle is bigger than a right angle but smaller than a straight line. What is it called?"
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "obtuse"
                hints: ["Bigger than a right angle."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What kind of angle is this?"
                show: { drawn: angle, degrees: 45, rotate: 90, label: false }
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "acute"
              - id: l1-n2
                type: multiple_choice
                text: "What kind of angle do the clock hands make?"
                show: { drawn: clock, hour: 4, minute: 0 }
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "obtuse"
              - id: l1-n3
                type: multiple_choice
                text: "What kind of angle do the clock hands make?"
                show: { drawn: clock, hour: 9, minute: 0 }
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "right"
              - id: l1-n4
                type: true_false
                text: "Is it true? An obtuse angle is smaller than a right angle."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "What kind of angle is this?"
                show: { drawn: angle, degrees: 135, rotate: 270, label: false }
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "obtuse"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What kind of angle is this?"
            show: { drawn: angle, degrees: 25, label: false }
            options: ["acute", "right", "obtuse"]
            keep_order: true
            answer: "acute"
          - id: l1-c2
            type: multiple_choice
            text: "What kind of angle is this?"
            show: { drawn: angle, degrees: 145, rotate: 60, label: false }
            options: ["acute", "right", "obtuse"]
            keep_order: true
            answer: "obtuse"
          - id: l1-c3
            type: multiple_choice
            text: "What kind of angle do the clock hands make?"
            show: { drawn: clock, hour: 1, minute: 0 }
            options: ["acute", "right", "obtuse"]
            keep_order: true
            answer: "acute"

  - n: 2
    title: { de: Winkel ordnen, en: Order angles }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What kind of angle is this?"
            show: { drawn: angle, degrees: 115, label: false }
            options: ["acute", "right", "obtuse"]
            keep_order: true
            answer: "obtuse"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Which angle is acute?"
            options:
              - { drawn: angle, degrees: 35, label: false, key: a35 }
              - { drawn: angle, degrees: 100, label: false, key: a100 }
              - { drawn: angle, degrees: 170, label: false, key: a170 }
            answer: a35
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Two right angles make a straight line."
            say: "Two right angles together make a half turn. The arms point in opposite directions and make a straight line. Today we order angles up to this size."
            show: { drawn: angle, degrees: 180, label: false }
          - text: "acute, right angle, obtuse, straight line"
            say: "From smallest to biggest: acute angles come first, then a right angle, then obtuse angles, then the straight line. Any obtuse angle is bigger than any acute angle."
            show: { drawn: angle, degrees: 130, label: false }
          - text: "half a right angle, a right angle, one and a half right angles, two right angles"
            say: "We can say how big an angle is in right angles. Half a right angle is acute. One and a half right angles is obtuse. Two right angles is a straight line."
            show: { drawn: angle, degrees: 45, label: false }
          - text: "Which opens wider?"
            say: "When two angles are the same kind, compare how wide the arms open. The angle that turns further between its arms is the bigger one."
            show: { drawn: angle, degrees: 75, label: false }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which angle is the biggest?"
                options:
                  - { drawn: angle, degrees: 40, label: false, key: a40 }
                  - { drawn: angle, degrees: 100, label: false, key: a100 }
                  - { drawn: angle, degrees: 160, label: false, key: a160 }
                answer: a160
                hints:
                  - "Which angle opens the widest?"
                  - "One is acute, one is just past a right angle, one is nearly a straight line."
                  - "The one that is nearly a straight line."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which angle is the smallest?"
                options:
                  - { drawn: angle, degrees: 70, label: false, key: a70 }
                  - { drawn: angle, degrees: 20, label: false, key: a20 }
                  - { drawn: angle, degrees: 50, label: false, key: a50 }
                answer: a20
                hints:
                  - "All three are acute. Compare how wide the arms open."
                  - "Look for the arms that are closest together."
                  - "The narrowest angle."
              - id: l2-f3
                type: ordering
                text: "Put the angles in order, smallest first."
                options: ["a straight line", "a right angle", "half a right angle", "one and a half right angles"]
                slot_count: 4
                answer: ["half a right angle", "a right angle", "one and a half right angles", "a straight line"]
                hints:
                  - "Count them in right angles."
                  - "Half, then one, then one and a half, then two right angles."
                  - "Half a right angle, a right angle, one and a half right angles, a straight line."
              - id: l2-f4
                type: true_false
                text: "Is it true? This angle is two right angles."
                show: { drawn: angle, degrees: 180, label: false }
                answer: true
                hints:
                  - "What do two right angles make?"
                  - "Two quarter turns make a half turn."
                  - "Yes. A straight line is two right angles."
              - id: l2-f5
                type: multiple_choice
                text: "The clock hands make an angle. Is it smaller or bigger than a right angle?"
                show: { drawn: clock, hour: 2, minute: 0 }
                options: ["smaller", "the same", "bigger"]
                keep_order: true
                answer: "smaller"
                hints:
                  - "At 3 o'clock the hands make a right angle."
                  - "At 2 o'clock the hour hand has not gone as far round."
                  - "Smaller: it is acute."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Which angle is the biggest?"
                options:
                  - { drawn: angle, degrees: 110, label: false, key: a110 }
                  - { drawn: angle, degrees: 150, label: false, key: a150 }
                  - { drawn: angle, degrees: 130, label: false, key: a130 }
                answer: a150
                hints: ["All three are obtuse. Which is closest to a straight line?"]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which angle is the smallest?"
                options:
                  - { drawn: angle, degrees: 80, label: false, key: a80 }
                  - { drawn: angle, degrees: 120, label: false, key: a120 }
                  - { drawn: angle, degrees: 160, label: false, key: a160 }
                answer: a80
                hints: ["Only one of them is acute."]
              - id: l2-s3
                type: ordering
                text: "The hands of a clock make an angle. Put the times in order, smallest angle first."
                options: ["3 o'clock", "5 o'clock", "1 o'clock", "2 o'clock"]
                slot_count: 4
                answer: ["1 o'clock", "2 o'clock", "3 o'clock", "5 o'clock"]
                hints: ["The minute hand points to 12. The further round the hour hand is, the bigger the angle."]
              - id: l2-s4
                type: multiple_choice
                text: "Which of these angles is obtuse?"
                options: ["half a right angle", "one and a half right angles", "two right angles"]
                answer: "one and a half right angles"
                hints: ["Obtuse is between one and two right angles."]
              - id: l2-s5
                type: true_false
                text: "Is it true? This angle is bigger than a right angle."
                show: { drawn: angle, degrees: 105, label: false }
                answer: true
                hints: ["Picture the corner of a page on it."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which angle is the biggest?"
                options:
                  - { drawn: angle, degrees: 60, label: false, key: a60 }
                  - { drawn: angle, degrees: 30, label: false, key: a30 }
                  - { drawn: angle, degrees: 85, label: false, key: a85 }
                answer: a85
              - id: l2-n2
                type: ordering
                text: "The hands of a clock make an angle. Put the times in order, smallest angle first."
                options: ["4 o'clock", "3 o'clock", "1 o'clock", "2 o'clock"]
                slot_count: 4
                answer: ["1 o'clock", "2 o'clock", "3 o'clock", "4 o'clock"]
              - id: l2-n3
                type: multiple_choice
                text: "A right angle and half a right angle together. What kind of angle is that?"
                options: ["acute", "right", "obtuse"]
                keep_order: true
                answer: "obtuse"
              - id: l2-n4
                type: true_false
                text: "Is it true? Every obtuse angle is bigger than every acute angle."
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Which angle is bigger than a right angle but smaller than a straight line?"
                options:
                  - { drawn: angle, degrees: 45, label: false, key: a45 }
                  - { drawn: angle, degrees: 90, label: false, key: a90 }
                  - { drawn: angle, degrees: 135, label: false, key: a135 }
                answer: a135

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What kind of angle is this?"
            show: { drawn: angle, degrees: 55, rotate: 120, label: false }
            options: ["acute", "right", "obtuse"]
            keep_order: true
            answer: "acute"
          - id: l2-c2
            type: multiple_choice
            text: "What kind of angle do the clock hands make?"
            show: { drawn: clock, hour: 5, minute: 0 }
            options: ["acute", "right", "obtuse"]
            keep_order: true
            answer: "obtuse"
          - id: l2-c3
            type: image_multiple_choice
            text: "Which angle is the smallest?"
            options:
              - { drawn: angle, degrees: 125, label: false, key: a125 }
              - { drawn: angle, degrees: 65, label: false, key: a65 }
              - { drawn: angle, degrees: 170, label: false, key: a170 }
            answer: a65
          - id: l2-c4
            type: ordering
            text: "Put the angles in order, smallest first."
            options: ["an obtuse angle", "a straight line", "an acute angle", "a right angle"]
            slot_count: 4
            answer: ["an acute angle", "a right angle", "an obtuse angle", "a straight line"]
          - id: l2-c5
            type: true_false
            text: "Is it true? An angle of one and a half right angles is acute."
            answer: false
