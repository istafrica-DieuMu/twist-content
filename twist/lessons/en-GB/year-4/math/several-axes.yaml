# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.several-axes
skill: math.symmetry.several-axes
curriculum: en-GB
language: en
title:
  de: Mehrere Symmetrieachsen
  en: Several lines of symmetry
summary: >
  Lesson 1 counts the lines of symmetry of 2D shapes (rectangle 2, square
  4, equilateral triangle 3, regular hexagon 6, circle infinitely many) and
  shows that the line from corner to corner is a line of symmetry of the
  square but not of the rectangle. Lesson 2 counts the lines of symmetry
  of capital letters and sorts them, reflects squares and small shapes in
  a diagonal mirror line on squared paper, and ends with the skill check.
  The diagonal mirror line is drawn dashed from corner to corner;
  drawing the reflection by hand waits for a grid drawing task.
metadata:
  year: year-4
  topic: { de: Symmetrie, en: Symmetry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.symmetry.complete, math.shapes.more-shapes]
  also_practises: [math.symmetry.complete]
  vocabulary: { en: [line of symmetry, mirror line, reflect, reflection, vertical, horizontal, diagonal, regular, infinitely many] }
  forms: [text, audio, drawn]
  drawn: [grid, shape, letter-card]
  facets: []
  misconceptions:
    - id: rectangle-diagonal
      what: Thinks the line from corner to corner is a line of symmetry of every rectangle, so gives the rectangle four lines
      addressed: lesson 1 Learn folds a rectangle from corner to corner and a corner sticks out; l1-f1 has feedback on 4, l1-f3, l1-n2 and l2-c2 ask about the rectangle's diagonal
    - id: only-upright
      what: Looks only for vertical and horizontal lines and misses the diagonal ones, so gives the square 2 lines
      addressed: lesson 1 Learn adds the square's two diagonals; l1-f2 has feedback on 2, l1-s2 asks about the diagonal; lesson 2 Learn and l2-f4, l2-f5, l2-s3, l2-s5, l2-n3, l2-n4 and l2-c4 reflect in a diagonal line
    - id: diagonal-flip
      what: Reflects in a diagonal line as if it were a vertical or horizontal line, or in the other diagonal
      addressed: lesson 2 Learn moves each square straight across the line; l2-f4 has feedback on the vertical flip, l2-s5 offers the upside-down copy, l2-n3 and l2-c4 offer the other diagonal
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Symmetrieachsen von Figuren, en: Lines of symmetry in shapes }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "This shape is symmetrical about the red line."
            say: "Is it true? This shape is symmetrical about the red line."
            show: { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[1, 1, blue], [2, 1, blue], [2, 0, blue], [3, 1, blue], [4, 1, blue], [3, 0, blue]] }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many sides does a hexagon have?"
            options: ["6", "5", "8"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A rectangle has 2 lines of symmetry."
            say: "Fold a rectangle in half from top to bottom, and the halves match. Fold it from side to side, and they match again. A rectangle has two lines of symmetry."
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "Corner to corner? Not for a rectangle."
            say: "Now fold the rectangle from corner to corner. The halves do not match: a corner sticks out. The diagonal is not a line of symmetry of a rectangle."
            show: { drawn: shape, kind: rectangle, colour: purple }
          - text: "A square has 4 lines of symmetry."
            say: "A square has the same two lines as a rectangle. Because all its sides are equal, the two diagonals from corner to corner are lines of symmetry too. That makes four."
            show: { drawn: shape, kind: square, colour: orange }
          - text: "Regular shapes: as many lines as sides. A circle: infinitely many."
            say: "In a regular shape all sides and angles are equal. It has as many lines of symmetry as sides: an equilateral triangle has three, a regular hexagon six. A circle has infinitely many, because every line through its centre works. A slanted parallelogram has none at all."
            show: { drawn: shape, kind: hexagon, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many lines of symmetry does a rectangle have?"
                show: { drawn: shape, kind: rectangle, colour: green }
                options: ["2", "4", "1"]
                answer: "2"
                feedback:
                  "4": "The lines from corner to corner do not work for a rectangle: a corner sticks out when you fold it."
                hints:
                  - "Imagine folding it so the halves match."
                  - "Top to bottom works, and side to side works."
                  - "A rectangle has 2 lines of symmetry."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many lines of symmetry does a square have?"
                show: { drawn: shape, kind: square, colour: blue }
                options: ["4", "2", "1"]
                answer: "4"
                feedback:
                  "2": "You found the up and down line and the side to side line. The two diagonals of a square are lines of symmetry too."
                hints:
                  - "A square has the same lines as a rectangle, and more."
                  - "Try folding it from corner to corner."
                  - "2 straight lines and 2 diagonals: 4."
              - id: l1-f3
                type: true_false
                text: "The line from corner to corner is a line of symmetry of a rectangle."
                say: "Is it true? The line from corner to corner is a line of symmetry of a rectangle."
                show: { drawn: shape, kind: rectangle, colour: red }
                answer: false
                hints:
                  - "Imagine folding the rectangle from corner to corner."
                  - "Do the halves cover each other exactly?"
                  - "No. A corner sticks out, so it is not a line of symmetry."
              - id: l1-f4
                type: multiple_choice
                text: "This triangle has 3 equal sides. How many lines of symmetry does it have?"
                show: { drawn: shape, kind: triangle, colour: yellow }
                options: ["3", "1", "6"]
                answer: "3"
                hints:
                  - "It is a regular shape."
                  - "A regular shape has as many lines of symmetry as sides."
                  - "3 sides, so 3 lines: one from each corner to the middle of the opposite side."
              - id: l1-f5
                type: multiple_choice
                text: "How many lines of symmetry does a circle have?"
                show: { drawn: shape, kind: circle, colour: red }
                options: ["infinitely many", "4", "1"]
                answer: "infinitely many"
                hints:
                  - "Try a line straight down through the centre. Now tilt it a little."
                  - "Every line through the centre cuts the circle into two matching halves."
                  - "Infinitely many."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "This hexagon is regular. How many lines of symmetry does it have?"
                show: { drawn: shape, kind: hexagon, colour: purple }
                options: ["6", "3", "2"]
                answer: "6"
                hints: ["A regular shape has as many lines of symmetry as sides."]
              - id: l1-s2
                type: true_false
                text: "The line from corner to corner is a line of symmetry of a square."
                say: "Is it true? The line from corner to corner is a line of symmetry of a square."
                show: { drawn: shape, kind: square, colour: green }
                answer: true
                hints: ["All the sides of a square are equal. Imagine the fold."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which shape has exactly 2 lines of symmetry?"
                options:
                  - { drawn: shape, kind: rectangle, colour: blue }
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: circle, colour: blue }
                answer: rectangle
                option_audio: false
                hints: ["The square has 4, the circle infinitely many."]
              - id: l1-s4
                type: multiple_choice
                text: "This octagon is regular. How many lines of symmetry does it have?"
                show: { drawn: shape, kind: octagon, colour: red }
                options: ["8", "4", "2"]
                answer: "8"
                hints: ["Count its sides."]
              - id: l1-s5
                type: multiple_choice
                text: "This pentagon is regular. How many lines of symmetry does it have?"
                show: { drawn: shape, kind: pentagon, colour: orange }
                options: ["5", "1", "2"]
                answer: "5"
                hints: ["Each line goes from a corner to the middle of the opposite side."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Which shape has the most lines of symmetry?"
                options:
                  - { drawn: shape, kind: square, colour: green }
                  - { drawn: shape, kind: hexagon, colour: green }
                  - { drawn: shape, kind: rectangle, colour: green }
                answer: hexagon
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "A rectangle has 4 lines of symmetry."
                say: "Is it true? A rectangle has four lines of symmetry."
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "A regular shape has 7 equal sides. How many lines of symmetry does it have?"
                options: ["7", "1", "14"]
                answer: "7"
              - id: l1-n4
                type: multiple_choice
                text: "How many lines of symmetry does this slanted parallelogram have?"
                show: { drawn: shape, kind: parallelogram, colour: yellow }
                options: ["0", "2", "1"]
                answer: "0"
              - id: l1-n5
                type: text_input
                text: "How many lines of symmetry do a square and a rectangle have altogether?"
                answer: "6"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many lines of symmetry does a square have?"
            options: ["4", "2", "8"]
            answer: "4"
          - id: l1-c2
            type: multiple_choice
            text: "How many lines of symmetry does a triangle with 3 equal sides have?"
            options: ["3", "1", "0"]
            answer: "3"
          - id: l1-c3
            type: true_false
            text: "A circle has only 2 lines of symmetry."
            say: "Is it true? A circle has only two lines of symmetry."
            answer: false

  - n: 2
    title: { de: Buchstaben und schräge Spiegelachsen, en: Letters and diagonal mirror lines }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many lines of symmetry does a rectangle have?"
            options: ["2", "4", "0"]
            answer: "2"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Which shape has 4 lines of symmetry?"
            options:
              - { drawn: shape, kind: square, colour: red }
              - { drawn: shape, kind: rectangle, colour: red }
              - { drawn: shape, kind: triangle, colour: red }
            answer: square
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "H has 2 lines of symmetry: one vertical, one horizontal."
            say: "Capital letters can be symmetrical too. Fold an H down the middle, and the halves match. Fold it across the middle, and they match again. H has two lines of symmetry."
            show: { drawn: letter-card, text: "H" }
          - text: "A has 1 line. F has none."
            say: "A has one line of symmetry, straight down the middle. F has none: however you fold it, the halves never match."
            show: { drawn: letter-card, text: "A F" }
          - text: "A diagonal mirror line: the square moves straight across it."
            say: "A mirror line can be diagonal. To reflect the blue square, move it straight across the line, at a right angle to it, the same distance to the other side. It lands on the red square. On this grid, across and down swap: three across and none down becomes none across and three down."
            show: { drawn: grid, cols: 5, rows: 5, diagonal: down, cells: [[3, 0, blue], [0, 3, red]] }
          - text: "Reflect each square, one at a time."
            say: "For a bigger shape, reflect each square on its own. The three blue squares land on the three red squares. The reflection looks like the shape flipped over the diagonal line."
            show: { drawn: grid, cols: 5, rows: 5, diagonal: down, cells: [[2, 0, blue], [3, 0, blue], [3, 1, blue], [0, 2, red], [0, 3, red], [1, 3, red]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many lines of symmetry does this letter have?"
                show: { drawn: letter-card, text: "H" }
                options: ["2", "1", "4"]
                answer: "2"
                feedback:
                  "4": "Fold H from corner to corner: the halves do not match. Only the vertical and the horizontal lines work."
                hints:
                  - "Try a vertical fold, then a horizontal fold."
                  - "Both of those work. Do the diagonals work?"
                  - "H has 2 lines of symmetry."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How many lines of symmetry does this letter have?"
                show: { drawn: letter-card, text: "A" }
                options: ["1", "2", "0"]
                answer: "1"
                hints:
                  - "Try a vertical fold."
                  - "That works. Now try folding across the middle."
                  - "Only the vertical line works: 1."
              - id: l2-f3
                type: sorting
                text: "Sort the letters by their lines of symmetry."
                bins:
                  - { id: none, show: { text: "no lines" }, say: "No lines." }
                  - { id: one, show: { text: "1 line" }, say: "One line." }
                  - { id: two, show: { text: "2 lines" }, say: "Two lines." }
                options:
                  - { text: "F", bin: none }
                  - { text: "L", bin: none }
                  - { text: "T", bin: one }
                  - { text: "M", bin: one }
                  - { text: "H", bin: two }
                  - { text: "X", bin: two }
                option_audio: false
                hints:
                  - "For each letter, try a vertical fold and a horizontal fold."
                  - "T and M fold only down the middle. F and L never fold."
                  - "F, L: none. T, M: 1. H, X: 2."
              - id: l2-f4
                type: multiple_choice
                text: "The blue square is reflected in the diagonal line. Where does it land?"
                show: { drawn: grid, cols: 5, rows: 5, diagonal: down, cells: [[4, 1, blue]], labels: [[1, 4, "A"], [4, 3, "B"], [0, 1, "C"]] }
                options: ["A", "B", "C"]
                answer: "A"
                option_audio: false
                feedback:
                  "B": "That is the square flipped upside down, as if the mirror line went across. Move it straight across the diagonal line."
                hints:
                  - "Move the square straight across the line, the same distance on the other side."
                  - "Across and down swap: 4 across and 1 down becomes 1 across and 4 down."
                  - "It lands on A."
              - id: l2-f5
                type: true_false
                text: "The red squares are the reflection of the blue squares in the diagonal line."
                say: "Is it true? The red squares are the reflection of the blue squares in the diagonal line."
                show: { drawn: grid, cols: 4, rows: 4, diagonal: down, cells: [[2, 0, blue], [3, 0, blue], [0, 2, red], [0, 3, red]] }
                answer: true
                hints:
                  - "Reflect each blue square on its own."
                  - "2 across, 0 down becomes 0 across, 2 down. 3 across, 0 down becomes 0 across, 3 down."
                  - "Yes, those are the red squares."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many lines of symmetry does this letter have?"
                show: { drawn: letter-card, text: "X" }
                options: ["2", "4", "1"]
                answer: "2"
                hints: ["Try a vertical and a horizontal fold, then the diagonals."]
              - id: l2-s2
                type: multiple_choice
                text: "How many lines of symmetry does this letter have?"
                show: { drawn: letter-card, text: "F" }
                options: ["0", "1", "2"]
                answer: "0"
                hints: ["Does any fold make the halves match?"]
              - id: l2-s3
                type: multiple_choice
                text: "The blue square is reflected in the diagonal line. Where does it land?"
                show: { drawn: grid, cols: 5, rows: 5, diagonal: down, cells: [[3, 0, blue]], labels: [[3, 4, "A"], [0, 3, "B"], [1, 0, "C"]] }
                options: ["A", "B", "C"]
                answer: "B"
                option_audio: false
                hints: ["Across and down swap: 3 across, 0 down."]
              - id: l2-s4
                type: true_false
                text: "The letter N has a line of symmetry."
                say: "Is it true? The letter N has a line of symmetry."
                show: { drawn: letter-card, text: "N" }
                answer: false
                hints: ["Try a vertical fold, then a horizontal fold."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Which picture shows the blue shape reflected in the diagonal line?"
                options:
                  - { drawn: grid, cols: 5, rows: 5, diagonal: down, cells: [[2, 0, blue], [3, 0, blue], [3, 1, blue], [2, 4, red], [3, 4, red], [3, 3, red]], key: b }
                  - { drawn: grid, cols: 5, rows: 5, diagonal: down, cells: [[2, 0, blue], [3, 0, blue], [3, 1, blue], [0, 2, red], [0, 3, red], [1, 3, red]], key: a }
                  - { drawn: grid, cols: 5, rows: 5, diagonal: down, cells: [[2, 0, blue], [3, 0, blue], [3, 1, blue], [0, 2, red], [1, 2, red], [1, 3, red]], key: c }
                answer: a
                hints: ["Reflect each blue square on its own: across and down swap."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many lines of symmetry does this letter have?"
                show: { drawn: letter-card, text: "E" }
                options: ["1", "2", "0"]
                answer: "1"
              - id: l2-n2
                type: multiple_choice
                text: "Which letter has no line of symmetry?"
                options: ["S", "T", "H"]
                answer: "S"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "The blue square is reflected in the diagonal line. Where does it land?"
                show: { drawn: grid, cols: 5, rows: 5, diagonal: down, cells: [[4, 2, blue]], labels: [[0, 2, "A"], [2, 0, "B"], [2, 4, "C"]] }
                options: ["A", "B", "C"]
                answer: "C"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "The red squares are the reflection of the blue squares in the diagonal line."
                say: "Is it true? The red squares are the reflection of the blue squares in the diagonal line."
                show: { drawn: grid, cols: 4, rows: 4, diagonal: down, cells: [[3, 0, blue], [3, 1, blue], [0, 3, red], [1, 2, red]] }
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "How many lines of symmetry does the letter T have?"
                show: { drawn: letter-card, text: "T" }
                options: ["1", "2", "0"]
                answer: "1"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "A regular shape has 10 equal sides. How many lines of symmetry does it have?"
            options: ["10", "5", "2"]
            answer: "10"
          - id: l2-c2
            type: true_false
            text: "You can fold a rectangle from corner to corner so that the halves match."
            say: "Is it true? You can fold a rectangle from corner to corner so that the halves match."
            answer: false
          - id: l2-c3
            type: multiple_choice
            text: "How many lines of symmetry does this letter have?"
            show: { drawn: letter-card, text: "M" }
            options: ["1", "2", "0"]
            answer: "1"
          - id: l2-c4
            type: multiple_choice
            text: "The blue square is reflected in the diagonal line. Where does it land?"
            show: { drawn: grid, cols: 5, rows: 5, diagonal: down, cells: [[2, 1, blue]], labels: [[1, 2, "A"], [2, 3, "B"], [3, 2, "C"]] }
            options: ["A", "B", "C"]
            answer: "A"
            option_audio: false
          - id: l2-c5
            type: image_multiple_choice
            text: "Which shape has exactly 3 lines of symmetry?"
            options:
              - { drawn: shape, kind: triangle, colour: purple }
              - { drawn: shape, kind: square, colour: purple }
              - { drawn: shape, kind: rectangle, colour: purple }
            answer: triangle
            option_audio: false
