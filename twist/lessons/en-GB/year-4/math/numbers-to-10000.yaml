# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.numbers-to-10000
skill: math.large-numbers.to-10000
curriculum: en-GB
language: en
title:
  de: Zahlen bis 10 000
  en: Numbers to 10,000
summary: >
  Year 4 opens with four-digit numbers. Lesson 1 exchanges ten hundreds
  for a thousand and counts in thousands; lesson 2 puts numbers in a place
  value chart (Th, H, T, O), says what each digit is worth and finds 1000
  more or less, as Year 4 asks; lesson 3 reads and writes four-digit
  numbers in words and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Zahlen bis 10 000, en: Numbers to 10 000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value]
  also_practises: [math.numbers-to-1000.read-write]
  vocabulary: { en: [thousand, thousands, place value, digit, ten thousand, 1000 more, 1000 less] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart, base-ten]
  facets: []
  parts:
    - { id: thousands, what: { de: Hunderter zu Tausendern bündeln und in Tausendern zählen, en: exchanging hundreds for thousands and counting in thousands } }
    - { id: place-value, what: { de: Zahlen in der Stellentafel und der Wert jeder Ziffer, en: numbers in a place value chart and what each digit is worth } }
    - { id: more-less, what: { de: 1000 mehr und 1000 weniger, en: finding 1000 more or less } }
    - { id: read-write, what: { de: Zahlen bis 10 000 lesen und schreiben, en: "reading and writing numbers to 10,000" } }
  misconceptions:
    - id: new-column
      what: Does not see that ten hundreds need a new column
      addressed: lesson 1 Learn exchanges ten hundreds and opens the Th column
    - id: middle-zeros
      what: Drops zeros in the middle (writes four thousand and seven as 47 or 407)
      addressed: lessons 2 and 3 set numbers with one and two zeros in every stage; full-stage feedback names the empty column
    - id: thousand-more
      what: Changes the wrong digit for 1000 more
      addressed: lesson 2 Learn says only the thousands digit changes; feedback names the column
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehn Hunderter sind ein Tausender, en: Ten hundreds make a thousand }
    goal:
      de: "Tausch 10 Hunderter gegen 1 Tausender und zähl dann in Tausenderschritten bis zehntausend."
      en: "Swap 10 hundreds for 1 thousand, then count in thousands all the way to ten thousand."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many hundreds make 1000?"
            options: ["10", "100", "1"]
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [7, 0, 4] }
            options: ["74", "704", "740"]
            answer: "704"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10 hundreds = 1 thousand"
            say: "Ten hundreds make one thousand. We exchange them for one thousand."
            show: { drawn: base-ten, hundreds: 10, tens: 0, ones: 0 }
          - text: "Th | H | T | O"
            say: "The place value chart gets a new column: Th for thousands. It goes to the left of the hundreds."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [1, 0, 0, 0] }
          - text: "1000, 2000, 3000 ... 10,000"
            say: "Count in thousands: one thousand, two thousand, three thousand, up to nine thousand. Ten thousands make ten thousand."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many hundreds make one thousand?"
                options: ["10", "100", "1000"]
                answer: "10"
                hints:
                  - "Count in hundreds to a thousand."
                  - "One hundred, two hundred, ... nine hundred, one thousand."
                  - "Ten hundreds make one thousand."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Count in 1000s: 3000, 4000, 5000, _"
                options: ["5001", "5100", "6000"]
                answer: "6000"
                hints:
                  - "Each step is one thousand."
                  - "After five thousands come six."
                  - "It is 6000."
              - id: l1-f3
                type: multiple_choice
                text: "How many thousands are in 7000?"
                options: ["7", "70", "700"]
                answer: "7"
                hints:
                  - "Count in thousands to 7000."
                  - "One thousand, two thousand, ... seven thousand."
                  - "7000 is 7 thousands."
              - id: l1-f4
                type: multiple_choice
                text: "How many hundreds are in 2000?"
                options: ["2", "20", "200"]
                answer: "20"
                feedback:
                  "2": "2000 is 2 thousands. Each thousand is ten hundreds."
                hints:
                  - "One thousand is ten hundreds."
                  - "Two thousands are two lots of ten hundreds."
                  - "2000 is 20 hundreds."
              - id: l1-f5
                type: true_false
                text: "Is it true? 10 thousands make 10,000."
                answer: true
                hints:
                  - "Count in thousands to ten."
                  - "Nine thousand, then ten thousand."
                  - "Yes."
              - id: l1-f6
                type: multiple_choice
                text: "Count back in 1000s: 9000, 8000, 7000, _"
                options: ["6000", "6900", "7100"]
                answer: "6000"
                hints:
                  - "The numbers get smaller."
                  - "One thousand less each time."
                  - "After 7000 comes 6000."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many thousands are in 4000?"
                options: ["4", "40", "400"]
                answer: "4"
                hints: ["Count in thousands."]
              - id: l1-s2
                type: multiple_choice
                text: "How many hundreds are in 5000?"
                options: ["5", "50", "500"]
                answer: "50"
                hints: ["Each thousand is ten hundreds."]
              - id: l1-s3
                type: multiple_choice
                text: "Count in 1000s: 6000, 7000, 8000, _"
                options: ["8100", "9000", "8001"]
                answer: "9000"
                hints: ["One thousand more each time."]
              - id: l1-s4
                type: text_input
                text: "What are 8 thousands worth?"
                answer: "8000"
                hints: ["Eight lots of a thousand."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 30 hundreds make 300."
                answer: false
                hints: ["Ten hundreds make a thousand."]
              - id: l1-s6
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [3, 0, 0, 0] }
                options: ["3", "300", "3000"]
                answer: "3000"
                hints: ["The 3 is in the Th column."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many thousands are in 9000?"
                options: ["9", "90", "900"]
                answer: "9"
              - id: l1-n2
                type: multiple_choice
                text: "How many hundreds are in 3000?"
                options: ["3", "30", "300"]
                answer: "30"
              - id: l1-n3
                type: text_input
                text: "What are 5 thousands worth?"
                answer: "5000"
              - id: l1-n4
                type: multiple_choice
                text: "Count in 1000s: 2000, 3000, 4000, _"
                options: ["4100", "5000", "4001"]
                answer: "5000"
              - id: l1-n5
                type: true_false
                text: "Is it true? 1000 + 1000 + 1000 = 3000"
                answer: true
              - id: l1-n6
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [6, 0, 0, 0] }
                options: ["6", "600", "6000"]
                answer: "6000"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many hundreds are in 4000?"
            options: ["4", "40", "400"]
            answer: "40"
          - id: l1-c2
            type: multiple_choice
            text: "Count in 1000s: 7000, 8000, 9000, _"
            options: ["9100", "10,000", "9001"]
            answer: "10,000"
          - id: l1-c3
            type: text_input
            text: "What are 2 thousands worth?"
            answer: "2000"
          - id: l1-c4
            type: fill_in_blank
            text: "Count in 1000s."
            frame: "4000, 5000, _, _"
            options: ["5001", "5100", "6000", "7000"]
            answer: ["6000", "7000"]
          - id: l1-c5
            type: true_false
            text: "Is it true? 20 hundreds make 2000."
            say: "Is it true? Twenty hundreds make two thousand."
            answer: true
          - id: l1-c6
            type: text_input
            text: "1000 + 1000 + 1000 + 1000 + 1000 = _"
            answer: "5000"

  - n: 2
    title: { de: "T, H, Z und E", en: "Th, H, T and O" }
    goal:
      de: "Trag vierstellige Zahlen in die Stellentafel ein, sag, was jede Ziffer wert ist, und finde 1000 mehr oder weniger."
      en: "Put four-digit numbers in a place value chart, say what each digit is worth, and find 1000 more or less."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many hundreds are in 6000?"
            options: ["6", "60", "600"]
            answer: "60"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "What are 7 thousands worth?"
            answer: "7000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 Th, 4 H, 6 T, 2 O"
            say: "Three thousands, four hundreds, six tens and two ones. Each digit goes in its own column."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [3, 4, 6, 2] }
          - text: "3462 = 3000 + 400 + 60 + 2"
            say: "The number is three thousand, four hundred and sixty-two. Partitioned, that is three thousand add four hundred add sixty add two. The three is worth three thousand."
          - text: "3462 → 4462, 3462 → 2462"
            say: "One thousand more: only the thousands digit changes, so it is four thousand, four hundred and sixty-two. One thousand less is two thousand, four hundred and sixty-two."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [2, 5, 1, 8] }
                options: ["2518", "8152", "2581"]
                answer: "2518"
                hints:
                  - "Read from left to right."
                  - "2 thousands, 5 hundreds, 1 ten, 8 ones."
                  - "The number is 2518."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [5, 0, 0, 3] }
                options: ["53", "503", "5003"]
                answer: "5003"
                feedback:
                  "53": "There are 5 thousands. The zeros in the hundreds and tens must be written."
                  "503": "The 5 is in the thousands column, not the hundreds. A zero is missing."
                hints:
                  - "There is a 0 in the hundreds and the tens."
                  - "5 thousands, no hundreds, no tens, 3 ones."
                  - "The number is 5003."
              - id: l2-f3
                type: multiple_choice
                text: "What is the 7 in 4721 worth?"
                options: ["7", "70", "700"]
                answer: "700"
                hints:
                  - "Which place is the 7 in?"
                  - "The hundreds."
                  - "It is worth 700."
              - id: l2-f4
                type: fill_in_blank
                text: "Partition 8350."
                frame: "8350 = _ + _ + _"
                options: ["50", "300", "350", "8000"]
                answer: ["8000", "300", "50"]
                hints:
                  - "Each digit has its own value. You do not need to write the 0."
                  - "8 thousands, 3 hundreds, 5 tens."
                  - "8000 + 300 + 50."
              - id: l2-f5
                type: multiple_choice
                text: "What is 1000 more than 4628?"
                options: ["4728", "5628", "4638"]
                answer: "5628"
                feedback:
                  "4728": "That is 100 more. 1000 more changes the thousands digit."
                hints:
                  - "Which digit changes for 1000 more?"
                  - "The thousands: 4 becomes 5."
                  - "1000 more than 4628 is 5628."
              - id: l2-f6
                type: true_false
                text: "Is it true? 9000 + 40 + 6 = 9406"
                answer: false
                hints:
                  - "Are there any hundreds?"
                  - "No hundreds: a 0 in the hundreds. 40 is tens."
                  - "No, it is 9046."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [7, 3, 0, 5] }
                options: ["735", "7305", "7350"]
                answer: "7305"
                hints: ["There is a 0 in the tens."]
              - id: l2-s2
                type: multiple_choice
                text: "What is the 3 in 3815 worth?"
                options: ["3", "300", "3000"]
                answer: "3000"
                hints: ["The thousands are on the left."]
              - id: l2-s3
                type: text_input
                text: "4000 + 200 + 9 = _"
                answer: "4209"
                hints: ["No tens."]
              - id: l2-s4
                type: multiple_choice
                text: "What is 1000 less than 6150?"
                options: ["6050", "5150", "6140"]
                answer: "5150"
                hints: ["The thousands digit changes."]
              - id: l2-s5
                type: multiple_choice
                text: "In which number is the 6 worth sixty?"
                options: ["6012", "1602", "2163"]
                answer: "2163"
                hints: ["The 6 must be in the tens."]
              - id: l2-s6
                type: true_false
                text: "Is it true? 1000 more than 9500 is 10,500."
                answer: true
                hints: ["Nine thousands and one more."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [9, 0, 8, 0] }
                options: ["98", "9080", "9800"]
                answer: "9080"
              - id: l2-n2
                type: multiple_choice
                text: "What is the 2 in 6249 worth?"
                options: ["2", "20", "200"]
                answer: "200"
              - id: l2-n3
                type: text_input
                text: "7000 + 50 = _"
                answer: "7050"
              - id: l2-n4
                type: multiple_choice
                text: "What is 1000 more than 2999?"
                options: ["3000", "3999", "2909"]
                answer: "3999"
              - id: l2-n5
                type: fill_in_blank
                text: "Partition 2614."
                frame: "2614 = _ + _ + _ + _"
                options: ["4", "10", "600", "2000"]
                answer: ["2000", "600", "10", "4"]
              - id: l2-n6
                type: multiple_choice
                text: "In which number is the 1 worth one thousand?"
                options: ["4100", "1004", "4010"]
                answer: "1004"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [4, 6, 0, 0] }
            options: ["46", "460", "4600"]
            answer: "4600"
          - id: l2-c2
            type: multiple_choice
            text: "What is the 8 in 1857 worth?"
            options: ["8", "80", "800"]
            answer: "800"
          - id: l2-c3
            type: multiple_choice
            text: "What is 1000 less than 3070?"
            options: ["2070", "3060", "3970"]
            answer: "2070"
          - id: l2-c4
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [2, 0, 9, 1] }
            options: ["291", "2091", "2901"]
            answer: "2091"
          - id: l2-c5
            type: text_input
            text: "5000 + 300 + 7 = _"
            answer: "5307"
          - id: l2-c6
            type: true_false
            text: "Is it true? 1000 more than 8450 is 9450."
            say: "Is it true? One thousand more than eight thousand, four hundred and fifty is nine thousand, four hundred and fifty."
            answer: true

  - n: 3
    title: { de: Große Zahlen lesen und schreiben, en: Reading and writing four-digit numbers }
    goal:
      de: "Lies und schreib vierstellige Zahlen in Worten und Ziffern, mit Nullen an den leeren Stellen, so wie 4006."
      en: "Read and write four-digit numbers in words and digits, with zeros in the empty places, like 4006."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [8, 1, 4, 0] }
            options: ["8140", "8014", "814"]
            answer: "8140"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "What is 1000 more than 5318?"
            options: ["5418", "6318", "5328"]
            answer: "6318"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "three thousand, four hundred and sixty-two"
            say: "A long number word comes in parts: three thousand, four hundred, and sixty-two. Each part fills a column: three thousands, four hundreds, six tens and two ones."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [3, 4, 6, 2] }
          - text: "5080 → five thousand and eighty"
            say: "Five thousand and eighty has no hundreds and no ones. In words we only say what is there: five thousand and eighty. In digits the zeros hold the places: five, zero, eight, zero."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [5, 0, 8, 0] }
          - text: "4006 → four thousand and six"
            say: "Four thousand and six: four thousands and six ones, so two zeros in the middle."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Two thousand, seven hundred and thirty-five. Which number is it?"
                options: ["2735", "2000735", "27035"]
                answer: "2735"
                option_audio: false
                feedback:
                  "2000735": "Each digit takes one column. Two thousands, seven hundreds, three tens, five ones."
                hints:
                  - "Two thousand: 2 in the thousands. Seven hundred: 7 in the hundreds."
                  - "Thirty-five: 3 tens, 5 ones."
                  - "2735."
                difficulty: easy
              - id: l3-f2
                type: text_input
                text: "Listen and write the number."
                say: "Six thousand, four hundred and twelve. Write the number."
                answer: "6412"
                hints:
                  - "Six thousand, four hundred, twelve."
                  - "Twelve is 1 ten and 2 ones."
                  - "6412."
              - id: l3-f3
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Nine thousand and fifty. Which number is it?"
                options: ["950", "9050", "9500"]
                answer: "9050"
                option_audio: false
                hints:
                  - "Do you hear any hundreds?"
                  - "No hundreds: a 0 in the hundreds."
                  - "9050."
              - id: l3-f4
                type: multiple_choice
                text: "five thousand, three hundred and forty-eight"
                say: "Read the number word. Which number is it?"
                options: ["5384", "5348", "53048"]
                answer: "5348"
                option_audio: false
                hints:
                  - "Split it: five thousand, three hundred, forty-eight."
                  - "Forty-eight: 4 tens, 8 ones."
                  - "5348."
              - id: l3-f5
                type: multiple_choice
                text: "Which word matches 4006?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["four thousand and six", "four thousand and sixty", "four hundred and six"]
                answer: "four thousand and six"
                option_audio: false
                hints:
                  - "4006: 4 thousands, 6 ones."
                  - "No hundreds, no tens."
                  - "Four thousand and six."
              - id: l3-f6
                type: text_input
                text: "eight thousand, two hundred"
                say: "Read the number word and write the number."
                answer: "8200"
                hints:
                  - "Eight thousand: 8 in the thousands."
                  - "Two hundred: 2 in the hundreds. No tens, no ones."
                  - "8200."

          - support: some
            tasks:
              - id: l3-s1
                type: text_input
                text: "Listen and write the number."
                say: "Three thousand, nine hundred and seventy-one. Write the number."
                answer: "3971"
                hints: ["Seventy-one: 7 tens, 1 one."]
              - id: l3-s2
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Seven thousand and eight. Which number is it?"
                options: ["708", "7008", "7800"]
                answer: "7008"
                option_audio: false
                hints: ["No hundreds, no tens."]
              - id: l3-s3
                type: multiple_choice
                text: "two thousand, six hundred and nineteen"
                say: "Read the number word. Which number is it?"
                options: ["2691", "2619", "2609"]
                answer: "2619"
                option_audio: false
                hints: ["Nineteen is 1 ten, 9 ones."]
              - id: l3-s4
                type: multiple_choice
                text: "Which word matches 1530?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["one thousand, five hundred and thirty", "one thousand, five hundred and three", "one thousand, three hundred and fifty"]
                answer: "one thousand, five hundred and thirty"
                option_audio: false
                hints: ["1 Th, 5 H, 3 T, 0 O."]
              - id: l3-s5
                type: text_input
                text: "nine thousand, nine hundred and ninety-nine"
                say: "Read the number word and write the number."
                answer: "9999"
                hints: ["All the digits are the same."]
              - id: l3-s6
                type: text_input
                text: "Listen and write the number."
                say: "Ten thousand. Write the number."
                answer: "10000"
                hints: ["A 1 and four zeros."]

          - support: none
            tasks:
              - id: l3-n1
                type: text_input
                text: "Listen and write the number."
                say: "Four thousand, two hundred and eighty-six. Write the number."
                answer: "4286"
              - id: l3-n2
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Six thousand, three hundred. Which number is it?"
                options: ["630", "6030", "6300"]
                answer: "6300"
                option_audio: false
              - id: l3-n3
                type: multiple_choice
                text: "eight thousand and fourteen"
                say: "Read the number word. Which number is it?"
                options: ["8014", "8140", "8041"]
                answer: "8014"
                option_audio: false
              - id: l3-n4
                type: text_input
                text: "three thousand, seven hundred and two"
                say: "Read the number word and write the number."
                answer: "3702"
              - id: l3-n5
                type: multiple_choice
                text: "Which word matches 5090?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["five thousand and ninety", "five thousand, nine hundred", "five thousand and nine"]
                answer: "five thousand and ninety"
                option_audio: false
              - id: l3-n6
                type: text_input
                text: "Listen and write the number."
                say: "One thousand and one. Write the number."
                answer: "1001"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l3-c1
            part: place-value
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [6, 0, 7, 2] }
            options: ["672", "6072", "6702"]
            answer: "6072"
          - id: l3-c2
            part: place-value
            type: multiple_choice
            text: "What is the 4 in 2481 worth?"
            options: ["4", "40", "400"]
            answer: "400"
          - id: l3-c3
