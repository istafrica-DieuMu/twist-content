# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.mass-estimate
skill: math.mass-capacity.estimate-mass
curriculum: en-GB
language: en
title:
  de: Gewichte schätzen
  en: Estimating mass
summary: >
  Lesson 1 learns benchmarks to compare with (a paper clip is about
  1 g, a packet of pasta 500 g, a bag of sugar 1 kg) and estimates
  fruit, eggs, pets, a child and a school bag with them; lesson 2
  changes between kilograms and grams (1 kg = 1000 g, 1 kg 500 g =
  1500 g, 2500 g = 2 kg 500 g, half a kilogram = 500 g), picks grams or
  kilograms for a thing, and ends with the skill check. Tonnes are left
  out, as the National Curriculum does not name them in key stage 2.
  Weighing on a real scale stays in the classroom.
metadata:
  year: year-4
  topic: { de: Gewichte, en: Mass }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mass-capacity.g-kg]
  also_practises: [math.mass-capacity.g-kg]
  vocabulary: { en: [mass, weigh, estimate, about, gram, g, kilogram, kg, benchmark] }
  forms: [picture, text, audio]
  drawn: []
  facets: [units]
  misconceptions:
    - id: no-feel-for-units
      what: Estimates with the wrong unit because the size of a gram or a kilogram is not felt (a child of 30 g, a pear of 200 kg)
      addressed: lesson 1 Learn sets the benchmarks 1 g, 500 g and 1 kg; l1-f3 has feedback on 30 g for a child, l1-f4, l1-n4 claim a mass in the wrong unit, l2-f2 offers 200 kg for a pear and has feedback on it, l2-s2 and l2-c3 offer the right number in the wrong unit
    - id: kilo-as-hundred
      what: Thinks 1 kg = 100 g, so writes 2 kg as 200 g, 1 kg 300 g as 130 g or 1030 g, and half a kilogram as 50 g
      addressed: lesson 2 Learn builds 1500 g from 1000 g and 500 g and halves 1000 g; l2-f1 has feedback on 200, l2-f3 on 130 and 1030, l2-f5 on 50 g, l2-f4 asks whether 3 kg is 300 g, l2-s4, l2-s5, l2-n3 and l2-c4 change mixed kilograms and grams
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit Stützpunkten schätzen", en: "Estimating with benchmarks" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many grams are in 1 kilogram?"
            options: ["10", "100", "1000"]
            answer: "1000"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which is heavier: 1 kg or 800 g?"
            options: ["1 kg", "800 g"]
            answer: "1 kg"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "a paper clip: about 1 g"
            say: "A benchmark is something you know the mass of, so you can compare. A paper clip weighs about one gram. That is very light."
            show: { object: paper-clip }
          - text: "a packet of pasta: 500 g. A bag of sugar: 1 kg."
            say: "A packet of pasta from the shop often weighs five hundred grams. A bag of sugar weighs one kilogram, which is one thousand grams."
            show: { object: bag-of-sugar }
          - text: "an apple: about 150 g"
            say: "To estimate, compare with a benchmark. An apple is much heavier than a paper clip, but much lighter than a packet of pasta. Three apples are about as heavy as the pasta. So one apple is about one hundred and fifty grams."
            show: { object: apple }
          - text: "Light things in grams, heavier things in kilograms"
            say: "We weigh light things such as an egg or a pencil in grams. We weigh heavier things such as a cat or a school bag in kilograms."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which is about as heavy as a bag of sugar, 1 kg?"
                options: [{ object: pineapple }, { object: egg }, { object: car }]
                answer: pineapple
                hints:
                  - "A bag of sugar is 1 kg. Which one could you lift as easily?"
                  - "An egg is far lighter. A car is far too heavy to lift."
                  - "The pineapple."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "About how heavy is an apple?"
                show: { object: apple }
                options: ["150 g", "15 g", "15 kg"]
                answer: "150 g"
                hints:
                  - "A paper clip is 1 g and a packet of pasta is 500 g."
                  - "About three apples weigh as much as the pasta."
                  - "About 150 g."
              - id: l1-f3
                type: multiple_choice
                text: "About how heavy is a 9-year-old child?"
                show: { object: child }
                options: ["30 kg", "30 g", "300 kg"]
                answer: "30 kg"
                feedback:
                  "30 g": "30 g is about 30 paper clips. A child is much heavier: use kilograms."
                hints:
                  - "A child is much heavier than a bag of sugar."
                  - "Think of about 30 bags of sugar."
                  - "About 30 kg."
              - id: l1-f4
                type: true_false
                text: "Is it true? A cat weighs about 4 g."
                show: { object: cat }
                answer: false
                hints:
                  - "4 g is about four paper clips."
                  - "A cat is heavier than a bag of sugar."
                  - "No. A cat weighs about 4 kg."
              - id: l1-f5
                type: multiple_choice
                text: "About how heavy is a school bag full of books?"
                show: { object: schoolbag }
                options: ["3 kg", "3 g", "300 kg"]
                answer: "3 kg"
                hints:
                  - "Is it lighter or heavier than a bag of sugar?"
                  - "A full bag is like a few bags of sugar."
                  - "About 3 kg."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which is about as heavy as a packet of pasta, 500 g?"
                options: [{ object: book }, { object: egg }, { object: elephant }]
                answer: book
                hints: ["Half a bag of sugar."]
              - id: l1-s2
                type: multiple_choice
                text: "About how heavy is an egg?"
                show: { object: egg }
                options: ["60 g", "6 g", "6 kg"]
                answer: "60 g"
                hints: ["An egg is lighter than an apple."]
              - id: l1-s3
                type: multiple_choice
                text: "Which unit would you use to weigh a dog?"
                show: { object: dog }
                options: ["kilograms", "grams"]
                answer: "kilograms"
                keep_order: true
                hints: ["Is a dog heavier than a bag of sugar?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? A banana weighs about 120 g."
                show: { object: banana }
                answer: true
                hints: ["A banana is a little lighter than an apple."]
              - id: l1-s5
                type: multiple_choice
                text: "Four apples weigh about 600 g. Is that more or less than 1 kg?"
                options: ["more", "less"]
                answer: "less"
                keep_order: true
                hints: ["1 kg is 1000 g."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "About how heavy is a bike?"
                show: { object: bike }
                options: ["12 kg", "12 g", "120 kg"]
                answer: "12 kg"
              - id: l1-n2
                type: multiple_choice
                text: "Which unit would you use to weigh a pencil?"
                show: { object: pencil }
                options: ["kilograms", "grams"]
                answer: "grams"
                keep_order: true
              - id: l1-n3
                type: image_multiple_choice
                text: "Which weighs about 20 kg?"
                options: [{ object: dog }, { object: mouse }, { object: apple }]
                answer: dog
              - id: l1-n4
                type: true_false
                text: "Is it true? A mouse weighs about 2 kg."
                show: { object: mouse }
                answer: false
              - id: l1-n5
                type: text_input
                text: "A bag of sugar weighs 1 kg. A cat weighs 4 kg. About how many bags of sugar weigh as much as the cat?"
                answer: "4"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "About how heavy is a pineapple?"
            show: { object: pineapple }
            options: ["1 kg", "1 g", "10 kg"]
            answer: "1 kg"
          - id: l1-c2
            type: multiple_choice
            text: "Which unit would you use to weigh an egg?"
            options: ["kilograms", "grams"]
            answer: "grams"
            keep_order: true
          - id: l1-c3
            type: true_false
            text: "Is it true? A school bag full of books weighs about 3 kg."
            answer: true


  - n: 2
    title: { de: "Kilogramm und Gramm umrechnen", en: "Kilograms and grams" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "About how heavy is a dog?"
            show: { object: dog }
            options: ["20 kg", "20 g", "200 kg"]
            answer: "20 kg"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which unit would you use to weigh a banana?"
            options: ["kilograms", "grams"]
            answer: "grams"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 kg = 1000 g"
            say: "One kilogram is one thousand grams. A bag of sugar weighs one kilogram, so it also weighs one thousand grams."
            show: { object: bag-of-sugar }
          - text: "1 kg 500 g = 1000 g + 500 g = 1500 g"
            say: "One kilogram and five hundred grams. Change the kilogram into one thousand grams, then add the five hundred grams. That makes one thousand five hundred grams."
          - text: "2500 g = 2000 g + 500 g = 2 kg 500 g"
            say: "Now the other way. Two thousand five hundred grams is two thousand grams and five hundred more. Two thousand grams is two kilograms. So it is two kilograms and five hundred grams."
          - text: "half a kilogram = 500 g"
            say: "Half of one thousand is five hundred. So half a kilogram is five hundred grams, like a packet of pasta."
            show: { object: pasta }
          - text: "g or kg?"
            say: "Choose the unit that fits. An egg or a pencil in grams, a dog or a bike in kilograms."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many grams are in 2 kg?"
                options: ["20", "200", "2000"]
                answer: "2000"
                feedback:
                  "200": "1 kg is 1000 g, not 100 g. 2 kg is 1000 g + 1000 g = 2000 g."
                hints:
                  - "How many grams are in 1 kg?"
                  - "Each kilogram is 1000 g: 1000 g + 1000 g."
                  - "2000."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "About how heavy is a pear?"
                show: { object: pear }
                options: ["200 g", "200 kg", "2 g"]
                answer: "200 g"
                feedback:
                  "200 kg": "200 kg is heavier than a cow. A pear is light: use grams."
                hints:
                  - "A pear is about as heavy as an apple."
                  - "An apple is about 150 g."
                  - "About 200 g."
              - id: l2-f3
                type: fill_in_blank
                text: "Write it in grams."
                say: "One kilogram and three hundred grams. Write it in grams."
                frame: "1 kg 300 g = _ g"
                options: ["130", "1030", "1300"]
                answer: ["1300"]
                feedback:
                  "130": "1 kg is 1000 g, not 100 g. 1000 + 300 = 1300."
                  "1030": "1000 g and 300 g make 1300 g."
                hints:
                  - "1 kg = 1000 g."
                  - "1000 g + 300 g."
                  - "1300."
              - id: l2-f4
                type: true_false
                text: "Is it true? 3 kg = 300 g"
                say: "Is it true? Three kilograms is three hundred grams."
                answer: false
                hints:
                  - "1 kg = 1000 g."
                  - "3 kg is 1000 g + 1000 g + 1000 g."
                  - "No. 3 kg = 3000 g."
              - id: l2-f5
                type: multiple_choice
                text: "How many grams is half a kilogram?"
                options: ["5 g", "50 g", "500 g"]
                answer: "500 g"
                feedback:
                  "50 g": "Half of 100 is 50, but 1 kg is 1000 g. Half of 1000 g is 500 g."
                hints:
                  - "How many grams make a whole kilogram?"
                  - "Find half of 1000."
                  - "500 g."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "How many grams are in 4 kg?"
                answer: "4000"
                hints: ["Each kilogram is 1000 g."]
              - id: l2-s2
                type: multiple_choice
                text: "About how heavy is a horse?"
                show: { object: horse }
                options: ["500 kg", "500 g", "5 kg"]
                answer: "500 kg"
                hints: ["A horse is much heavier than you are."]
              - id: l2-s3
                type: sorting
                text: "Which unit fits? Sort the pictures."
                bins:
                  - { id: g, show: { text: "grams" }, say: "Grams." }
                  - { id: kg, show: { text: "kilograms" }, say: "Kilograms." }
                options:
                  - { object: egg, bin: g }
                  - { object: pencil, bin: g }
                  - { object: paper-clip, bin: g }
                  - { object: dog, bin: kg }
                  - { object: bike, bin: kg }
                  - { object: schoolbag, bin: kg }
                hints: ["Light things in grams, heavier things in kilograms."]
              - id: l2-s4
                type: fill_in_blank
                text: "Write it in grams."
                say: "Two kilograms and four hundred grams. Write it in grams."
                frame: "2 kg 400 g = _ g"
                options: ["240", "2040", "2400"]
                answer: ["2400"]
                hints: ["2 kg = 2000 g."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 3500 g = 3 kg 500 g"
                say: "Is it true? Three thousand five hundred grams is three kilograms and five hundred grams."
                answer: true
                hints: ["3000 g = 3 kg."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A sack of potatoes weighs 5 kg. How many grams is that?"
                answer: "5000"
              - id: l2-n2
                type: image_multiple_choice
                text: "Which weighs about half a kilogram?"
                options: [{ object: book }, { object: paper-clip }, { object: dog }]
                answer: book
              - id: l2-n3
                type: multiple_choice
                text: "A melon weighs 1800 g. How much is that in kilograms and grams?"
                options: ["1 kg 800 g", "18 kg", "1 kg 80 g"]
                answer: "1 kg 800 g"
              - id: l2-n4
                type: true_false
                text: "Is it true? 6000 g = 6 kg"
                say: "Is it true? Six thousand grams is six kilograms."
                answer: true
              - id: l2-n5
                type: text_input
                text: "An empty box weighs 1 kg. The toys inside weigh 700 g. How many grams do the box and the toys weigh altogether?"
                answer: "1700"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "About how heavy is a pencil?"
            show: { object: pencil }
            options: ["5 g", "500 g", "5 kg"]
            answer: "5 g"
          - id: l2-c2
            type: text_input
            text: "How many grams are in 7 kg?"
            answer: "7000"
          - id: l2-c3
            type: multiple_choice
            text: "About how heavy is a packed suitcase?"
            show: { object: suitcase }
            options: ["15 kg", "15 g", "150 kg"]
            answer: "15 kg"
          - id: l2-c4
            type: fill_in_blank
            text: "Write it in grams."
            say: "Three kilograms and four hundred grams. Write it in grams."
            frame: "3 kg 400 g = _ g"
            options: ["340", "3040", "3400"]
            answer: ["3400"]
          - id: l2-c5
            type: image_multiple_choice
            text: "Which would you weigh in kilograms?"
            options: [{ object: cat }, { object: egg }, { object: pencil }]
            answer: cat
