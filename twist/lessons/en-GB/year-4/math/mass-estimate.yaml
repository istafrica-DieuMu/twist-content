# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.mass-estimate
skill: math.mass-capacity.estimate-mass
curriculum: en-GB
language: en
title:
  de: Gewichte schätzen
  en: Estimating mass
summary: >
  Lesson 1 learns benchmarks to compare with (a paper clip is about
  1 g, a packet of pasta 500 g, a bag of sugar 1 kg) and estimates
  fruit, eggs, pets, a child and a school bag with them; lesson 2 learns
  1 tonne = 1000 kg with a small car as the benchmark, picks grams,
  kilograms or tonnes for a thing, changes between tonnes and kilograms,
  and ends with the skill check. Weighing on a real scale stays in the
  classroom.
metadata:
  year: year-4
  topic: { de: Gewichte, en: Mass }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mass-capacity.g-kg]
  also_practises: [math.mass-capacity.g-kg]
  vocabulary: { en: [mass, weigh, estimate, about, gram, g, kilogram, kg, tonne, t, benchmark] }
  forms: [picture, text, audio]
  drawn: []
  facets: [units]
  misconceptions:
    - id: no-feel-for-units
      what: Estimates with the wrong unit because the size of a gram or a kilogram is not felt (a child of 30 g, an elephant of 5 kg)
      addressed: lesson 1 Learn sets the benchmarks 1 g, 500 g and 1 kg; l1-f3 has feedback on 30 g for a child, l1-f4, l1-n4 claim a mass in the wrong unit, l2-f3 has feedback on an elephant of 5 kg, l2-f2, l2-s2 and l2-c3 offer the right number in the wrong unit
    - id: tonne-as-hundred
      what: Thinks 1 t = 100 kg, or writes 1 t 500 kg as 150 kg or 1050 kg
      addressed: lesson 2 Learn builds 1500 kg from 1000 kg and 500 kg; l2-f1 has feedback on 100, l2-f5 on 150 and 1050, l2-f4 asks whether 2 t is 200 kg, l2-s4, l2-n3 and l2-c4 change mixed tonnes and kilograms
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit Stützpunkten schätzen", en: "Estimating with benchmarks" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many grams are in 1 kilogram?"
            options: ["10", "100", "1000"]
            answer: "1000"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which is heavier: 1 kg or 800 g?"
            options: ["1 kg", "800 g"]
            answer: "1 kg"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "a paper clip: about 1 g"
            say: "A benchmark is something you know the mass of, so you can compare. A paper clip weighs about one gram. That is very light."
            show: { object: paper-clip }
          - text: "a packet of pasta: 500 g. A bag of sugar: 1 kg."
            say: "A packet of pasta from the shop often weighs five hundred grams. A bag of sugar weighs one kilogram, which is one thousand grams."
            show: { object: bag-of-sugar }
          - text: "an apple: about 150 g"
            say: "To estimate, compare with a benchmark. An apple is much heavier than a paper clip, but much lighter than a packet of pasta. Three apples are about as heavy as the pasta. So one apple is about one hundred and fifty grams."
            show: { object: apple }
          - text: "Light things in grams, heavier things in kilograms"
            say: "We weigh light things such as an egg or a pencil in grams. We weigh heavier things such as a cat or a school bag in kilograms."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which is about as heavy as a bag of sugar, 1 kg?"
                options: [{ object: pineapple }, { object: egg }, { object: car }]
                answer: pineapple
                hints:
                  - "A bag of sugar is 1 kg. Which one could you lift as easily?"
                  - "An egg is far lighter. A car is far too heavy to lift."
                  - "The pineapple."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "About how heavy is an apple?"
                show: { object: apple }
                options: ["150 g", "15 g", "15 kg"]
                answer: "150 g"
                hints:
                  - "A paper clip is 1 g and a packet of pasta is 500 g."
                  - "About three apples weigh as much as the pasta."
                  - "About 150 g."
              - id: l1-f3
                type: multiple_choice
                text: "About how heavy is a 9-year-old child?"
                show: { object: child }
                options: ["30 kg", "30 g", "300 kg"]
                answer: "30 kg"
                feedback:
                  "30 g": "30 g is about 30 paper clips. A child is much heavier: use kilograms."
                hints:
                  - "A child is much heavier than a bag of sugar."
                  - "Think of about 30 bags of sugar."
                  - "About 30 kg."
              - id: l1-f4
                type: true_false
                text: "Is it true? A cat weighs about 4 g."
                show: { object: cat }
                answer: false
                hints:
                  - "4 g is about four paper clips."
                  - "A cat is heavier than a bag of sugar."
                  - "No. A cat weighs about 4 kg."
              - id: l1-f5
                type: multiple_choice
                text: "About how heavy is a school bag full of books?"
                show: { object: schoolbag }
                options: ["3 kg", "3 g", "300 kg"]
                answer: "3 kg"
                hints:
                  - "Is it lighter or heavier than a bag of sugar?"
                  - "A full bag is like a few bags of sugar."
                  - "About 3 kg."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which is about as heavy as a packet of pasta, 500 g?"
                options: [{ object: book }, { object: egg }, { object: elephant }]
                answer: book
                hints: ["Half a bag of sugar."]
              - id: l1-s2
                type: multiple_choice
                text: "About how heavy is an egg?"
                show: { object: egg }
                options: ["60 g", "6 g", "6 kg"]
                answer: "60 g"
                hints: ["An egg is lighter than an apple."]
              - id: l1-s3
                type: multiple_choice
                text: "Which unit would you use to weigh a dog?"
                show: { object: dog }
                options: ["kilograms", "grams"]
                answer: "kilograms"
                keep_order: true
                hints: ["Is a dog heavier than a bag of sugar?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? A banana weighs about 120 g."
                show: { object: banana }
                answer: true
                hints: ["A banana is a little lighter than an apple."]
              - id: l1-s5
                type: multiple_choice
                text: "Four apples weigh about 600 g. Is that more or less than 1 kg?"
                options: ["more", "less"]
                answer: "less"
                keep_order: true
                hints: ["1 kg is 1000 g."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "About how heavy is a bike?"
                show: { object: bike }
                options: ["12 kg", "12 g", "120 kg"]
                answer: "12 kg"
              - id: l1-n2
                type: multiple_choice
                text: "Which unit would you use to weigh a pencil?"
                show: { object: pencil }
                options: ["kilograms", "grams"]
                answer: "grams"
                keep_order: true
              - id: l1-n3
                type: image_multiple_choice
                text: "Which weighs about 20 kg?"
                options: [{ object: dog }, { object: mouse }, { object: apple }]
                answer: dog
              - id: l1-n4
                type: true_false
                text: "Is it true? A mouse weighs about 2 kg."
                show: { object: mouse }
                answer: false
              - id: l1-n5
                type: text_input
                text: "A bag of sugar weighs 1 kg. A cat weighs 4 kg. About how many bags of sugar weigh as much as the cat?"
                answer: "4"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "About how heavy is a pineapple?"
            show: { object: pineapple }
            options: ["1 kg", "1 g", "10 kg"]
            answer: "1 kg"
          - id: l1-c2
            type: multiple_choice
            text: "Which unit would you use to weigh an egg?"
            options: ["kilograms", "grams"]
            answer: "grams"
            keep_order: true
          - id: l1-c3
            type: true_false
            text: "Is it true? A school bag full of books weighs about 3 kg."
            answer: true

  - n: 2
    title: { de: "Die Tonne", en: "The tonne" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "About how heavy is a dog?"
            show: { object: dog }
            options: ["20 kg", "20 g", "200 kg"]
            answer: "20 kg"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which unit would you use to weigh a banana?"
            options: ["kilograms", "grams"]
            answer: "grams"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 tonne = 1000 kg"
            say: "Very heavy things are weighed in tonnes. One tonne is one thousand kilograms. We write t for tonne."
          - text: "a small car: about 1 t"
            say: "A small car weighs about one tonne. An elephant weighs about five tonnes, as much as five small cars."
            show: { object: car }
          - text: "1500 kg = 1000 kg + 500 kg = 1 t 500 kg"
            say: "One thousand five hundred kilograms is one thousand kilograms and five hundred more. That is one tonne and five hundred kilograms."
          - text: "g, kg or t?"
            say: "Choose the unit that fits. An egg in grams, a dog in kilograms, a lorry in tonnes."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many kilograms are in 1 tonne?"
                options: ["10", "100", "1000"]
                answer: "1000"
                feedback:
                  "100": "100 is the number of centimetres in a metre. A tonne is 1000 kg."
                hints:
                  - "A tonne is much heavier than a kilogram."
                  - "It is the same number as grams in a kilogram."
                  - "1000."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "About how heavy is a bus?"
                show: { object: bus }
                options: ["12 t", "12 kg", "12 g"]
                answer: "12 t"
                hints:
                  - "A bus is much heavier than a car."
                  - "A car is about 1 t."
                  - "About 12 t."
              - id: l2-f3
                type: multiple_choice
                text: "About how heavy is an elephant?"
                show: { object: elephant }
                options: ["5 t", "5 kg", "50 kg"]
                answer: "5 t"
                feedback:
                  "5 kg": "5 kg is about as heavy as a cat. An elephant is as heavy as several cars."
                hints:
                  - "Is an elephant heavier than a car?"
                  - "An elephant weighs as much as about five small cars."
                  - "About 5 t."
              - id: l2-f4
                type: true_false
                text: "Is it true? 2 t = 200 kg"
                say: "Is it true? Two tonnes is two hundred kilograms."
                answer: false
                hints:
                  - "1 t = 1000 kg."
                  - "2 t is 1000 kg + 1000 kg."
                  - "No. 2 t = 2000 kg."
              - id: l2-f5
                type: fill_in_blank
                text: "Write it in kilograms."
                say: "One tonne and five hundred kilograms. Write it in kilograms."
                frame: "1 t 500 kg = _ kg"
                options: ["150", "1050", "1500"]
                answer: ["1500"]
                feedback:
                  "150": "1 t is 1000 kg, not 100 kg. 1000 + 500 = 1500."
                  "1050": "1000 kg and 500 kg make 1500 kg."
                hints:
                  - "1 t = 1000 kg."
                  - "1000 kg + 500 kg."
                  - "1500."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "How many kilograms are in 3 tonnes?"
                answer: "3000"
                hints: ["Each tonne is 1000 kg."]
              - id: l2-s2
                type: multiple_choice
                text: "About how heavy is a small car?"
                show: { object: car }
                options: ["1 t", "1 kg", "100 g"]
                answer: "1 t"
                hints: ["You could not lift a car."]
              - id: l2-s3
                type: sorting
                text: "Which unit fits? Sort the pictures."
                bins:
                  - { id: g, show: { text: "grams" }, say: "Grams." }
                  - { id: kg, show: { text: "kilograms" }, say: "Kilograms." }
                  - { id: t, show: { text: "tonnes" }, say: "Tonnes." }
                options:
                  - { object: egg, bin: g }
                  - { object: pencil, bin: g }
                  - { object: dog, bin: kg }
                  - { object: bike, bin: kg }
                  - { object: bus, bin: t }
                  - { object: elephant, bin: t }
                hints: ["Light things in grams, heavier things in kilograms, very heavy things in tonnes."]
              - id: l2-s4
                type: fill_in_blank
                text: "Write it in kilograms."
                say: "Four tonnes and two hundred kilograms. Write it in kilograms."
                frame: "4 t 200 kg = _ kg"
                options: ["420", "4020", "4200"]
                answer: ["4200"]
                hints: ["4 t = 4000 kg."]
              - id: l2-s5
                type: true_false
                text: "Is it true? A cow weighs about 600 kg."
                show: { object: cow }
                answer: true
                hints: ["A cow is lighter than a small car."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A lorry can carry 8 tonnes. How many kilograms is that?"
                answer: "8000"
              - id: l2-n2
                type: image_multiple_choice
                text: "Which weighs about 1 tonne?"
                options: [{ object: car }, { object: bike }, { object: dog }]
                answer: car
              - id: l2-n3
                type: multiple_choice
                text: "A crane lifts 2500 kg. How much is that in tonnes and kilograms?"
                options: ["2 t 500 kg", "25 t", "2 t 50 kg"]
                answer: "2 t 500 kg"
              - id: l2-n4
                type: true_false
                text: "Is it true? 6000 kg = 6 t"
                say: "Is it true? Six thousand kilograms is six tonnes."
                answer: true
              - id: l2-n5
                type: text_input
                text: "A van weighs 2 t. Its load weighs 700 kg. How many kilograms is that altogether?"
                answer: "2700"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "About how heavy is a pencil?"
            show: { object: pencil }
            options: ["5 g", "500 g", "5 kg"]
            answer: "5 g"
          - id: l2-c2
            type: text_input
            text: "How many kilograms are in 5 tonnes?"
            answer: "5000"
          - id: l2-c3
            type: multiple_choice
            text: "About how heavy is a packed suitcase?"
            show: { object: suitcase }
            options: ["15 kg", "15 g", "150 kg"]
            answer: "15 kg"
          - id: l2-c4
            type: fill_in_blank
            text: "Write it in kilograms."
            say: "Three tonnes and four hundred kilograms. Write it in kilograms."
            frame: "3 t 400 kg = _ kg"
            options: ["340", "3040", "3400"]
            answer: ["3400"]
          - id: l2-c5
            type: image_multiple_choice
            text: "Which would you weigh in tonnes?"
            options: [{ object: elephant }, { object: cat }, { object: apple }]
            answer: elephant
