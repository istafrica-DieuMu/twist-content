# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.written-large
skill: math.written-add-sub.large
curriculum: en-GB
language: en
title:
  de: Schriftlich rechnen mit großen Zahlen
  en: Column addition and subtraction with large numbers
summary: >
  Column addition and subtraction with four-digit numbers, as Year 4 asks,
  and a five-digit stretch in each lesson. Lesson 1 adds with several
  carries and with numbers of different lengths lined up by place value,
  and checks the size with an estimate; lesson 2 subtracts with exchange,
  checks with the inverse (the answer plus the number taken away gives the
  first number), and ends with the skill check. Typed answers are plain
  digits; writing the digits into the columns waits for a column input.
metadata:
  year: year-4
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.written-add-sub.check, math.large-numbers.to-10000]
  also_practises: [math.written-add-sub.check]
  vocabulary: { en: [column addition, column subtraction, carry, exchange, thousands, hundreds, tens, ones, estimate, inverse] }
  forms: [text, audio, drawn]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: add, what: { de: große Zahlen schriftlich addieren, en: adding large numbers in columns } }
    - { id: sub, what: { de: große Zahlen schriftlich subtrahieren, en: subtracting large numbers in columns } }
    - { id: check, what: { de: "mit Überschlag und Umkehraufgabe prüfen, Fehler finden", en: "checking with an estimate or the inverse and finding mistakes" } }
  misconceptions:
    - id: forget-carry
      what: Writes both digits of a column total, or forgets to add the carried digit in the next column
      addressed: lesson 1 Learn carries each ten aloud; l1-f2 has feedback on writing 14, l1-s3 asks for a digit after a carry, l1-s4, l1-c2 and l1-c3 offer an answer without the carry
    - id: line-up-left
      what: Lines up numbers of different lengths on the left instead of by place value
      addressed: lesson 1 Learn sets 3706 + 845 with ones under ones; l1-f4 asks what went wrong when 529 was lined up on the left
    - id: smaller-from-larger
      what: Takes the smaller digit from the larger in each column instead of exchanging
      addressed: lesson 2 Learn exchanges a ten and a thousand; l2-f2 has feedback on 7 − 2, l2-f4 and l2-c3 ask what went wrong with a smaller-from-larger answer, l2-n3 judges one
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Schriftlich addieren, en: Column addition }
    goal:
      de: "Addiere vierstellige Zahlen schriftlich mit Übertrag, so wie 4568 + 2375, und prüf mit einem Überschlag."
      en: "Add four-digit numbers in columns, carrying when you need to, like 4568 + 2375, and check with an estimate."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Estimate: about how much is 3912 + 2087?"
            options: ["about 6000", "about 5000", "about 7000"]
            answer: "about 6000"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Work out the column addition."
            show: { drawn: written-calc, rows: ["456", "327"], op: "+", result: "___" }
            answer: "783"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4568 + 2375"
            say: "Write the numbers in columns: thousands under thousands, hundreds under hundreds, tens under tens, ones under ones. Always start with the ones."
            show: { drawn: written-calc, rows: ["4568", "2375"], op: "+" }
          - text: "4568 + 2375 = 6943"
            say: "Ones: eight plus five is thirteen. Write three and carry one ten into the tens. Tens: six plus seven plus the one carried is fourteen. Write four and carry one hundred. Hundreds: five plus three plus one is nine. Thousands: four plus two is six. The answer is six thousand, nine hundred and forty-three."
            show: { drawn: written-calc, rows: ["4568", "2375"], op: "+", carry: " 11 ", result: "6943" }
          - text: "3706 + 845 = 4551"
            say: "When the numbers have different lengths, line them up from the right, ones under ones. Ones: six plus five is eleven, carry one. Tens: nothing plus four plus one is five. Hundreds: seven plus eight is fifteen, carry one. Thousands: three plus one is four."
            show: { drawn: written-calc, rows: ["3706", "845"], op: "+", carry: "1 1 ", result: "4551" }
          - text: "Estimate: 4600 + 2400 = 7000. 6943 is close, so it makes sense."
            say: "Check your answer with an estimate. Round each number: about four thousand six hundred plus about two thousand four hundred is about seven thousand. Six thousand, nine hundred and forty-three is close to that."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "Work out the column addition."
                show: { drawn: written-calc, rows: ["3245", "1632"], op: "+", result: "____" }
                answer: "4877"
                hints:
                  - "Start with the ones: 5 + 2."
                  - "Ones 7, tens 4 + 3 = 7, hundreds 2 + 6 = 8, thousands 3 + 1 = 4."
                  - "The answer is 4877."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "2758 + 1466. Ones: 8 + 6 = 14. What do you do?"
                show: { drawn: written-calc, rows: ["2758", "1466"], op: "+" }
                options: ["Write 4 and carry 1 ten.", "Write 14 in the ones.", "Write 1 and carry 4."]
                answer: "Write 4 and carry 1 ten."
                feedback:
                  "Write 14 in the ones.": "Only one digit fits in each column. 14 is 1 ten and 4 ones, so the ten is carried."
                hints:
                  - "14 is 1 ten and 4 ones."
                  - "The 4 ones stay in the ones column."
                  - "Write 4 and carry 1 ten."
              - id: l1-f3
                type: text_input
                text: "Now finish it. Work out the column addition."
                show: { drawn: written-calc, rows: ["2758", "1466"], op: "+", carry: "111 ", result: "___4" }
                answer: "4224"
                hints:
                  - "Tens: 5 + 6 and the 1 carried."
                  - "Tens 12, write 2 carry 1. Hundreds 7 + 4 + 1 = 12, write 2 carry 1. Thousands 2 + 1 + 1."
                  - "The answer is 4224."
              - id: l1-f4
                type: multiple_choice
                text: "Kai works out 4083 + 529 and gets 9373. What went wrong?"
                options: ["He lined the numbers up on the left, not by place value.", "He forgot to carry.", "He took away instead of adding."]
                answer: "He lined the numbers up on the left, not by place value."
                hints:
                  - "Estimate: about 4000 + 500. Is 9373 close?"
                  - "9373 is 4083 + 5290. The 5 went under the thousands."
                  - "He lined the numbers up on the left. Ones go under ones."
              - id: l1-f5
                type: multiple_choice
                text: "Which answer fits the estimate? 3812 + 2094"
                options: ["5906", "4906", "6906"]
                answer: "5906"
                hints:
                  - "Round each number to the nearest hundred."
                  - "About 3800 + 2100 = 5900."
                  - "5906 is close to 5900."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Work out the column addition."
                show: { drawn: written-calc, rows: ["5167", "2425"], op: "+", result: "____" }
                answer: "7592"
                hints: ["Ones: 7 + 5 = 12. Write 2, carry 1."]
              - id: l1-s2
                type: text_input
                text: "Work out the column addition."
                show: { drawn: written-calc, rows: ["3489", "2734"], op: "+", result: "____" }
                answer: "6223"
                hints: ["There is a carry into the tens, the hundreds and the thousands."]
              - id: l1-s3
                type: multiple_choice
                text: "Which digit is missing from the answer?"
                show: { drawn: written-calc, rows: ["1675", "2378"], op: "+", carry: "111 ", result: "4_53" }
                options: ["0", "1", "9"]
                answer: "0"
                hints: ["Hundreds: 6 + 3 + 1 carried = 10."]
              - id: l1-s4
                type: true_false
                text: "6250 + 2875 = 8125"
                say: "Is it true? Six thousand two hundred and fifty plus two thousand eight hundred and seventy-five is eight thousand one hundred and twenty-five."
                answer: false
                hints: ["Hundreds: 2 + 8 + 1 carried is 11, so 1 thousand is carried."]
              - id: l1-s5
                type: text_input
                text: "A school library has 2468 books. It buys 735 more. How many books does it have now?"
                answer: "3203"
                hints: ["Line up the ones: 735 goes under 468."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "4706 + 3195 = _"
                answer: "7901"
              - id: l1-n2
                type: text_input
                text: "2864 + 5379 = _"
                answer: "8243"
              - id: l1-n3
                type: multiple_choice
                text: "Which answer fits the estimate? 4975 + 3018"
                options: ["7993", "6993", "8993"]
                answer: "7993"
              - id: l1-n4
                type: text_input
                text: "15,342 + 23,516 = _"
                answer: "38858"
                difficulty: stretch
              - id: l1-n5
                type: text_input
                text: "Two villages have 3708 and 4594 people. How many people is that altogether?"
                answer: "8302"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Work out the column addition."
            show: { drawn: written-calc, rows: ["3526", "2348"], op: "+", result: "____" }
            answer: "5874"
          - id: l1-c2
            type: multiple_choice
            text: "6487 + 1756 = _"
            options: ["8243", "7133", "8143"]
            answer: "8243"
          - id: l1-c3
            type: true_false
            text: "2390 + 4815 = 7205"
            say: "Is it true? Two thousand three hundred and ninety plus four thousand eight hundred and fifteen is seven thousand two hundred and five."
            answer: true
          - id: l1-c4
            type: text_input
            text: "Work out the column addition."
            show: { drawn: written-calc, rows: ["2683", "4519"], op: "+", result: "____" }
            answer: "7202"
          - id: l1-c5
            type: multiple_choice
            text: "Which answer fits the estimate? 5103 + 2899"
            options: ["8002", "7002", "9002"]
            answer: "8002"
          - id: l1-c6
            type: text_input
            text: "6458 + 793 = _"
            answer: "7251"

  - n: 2
    title: { de: Schriftlich subtrahieren, en: Column subtraction }
    goal:
      de: "Subtrahiere vierstellige Zahlen schriftlich mit Entbündeln, so wie 5342 − 1826, und prüf mit der Umkehraufgabe."
      en: "Subtract four-digit numbers in columns with exchanging, like 5342 − 1826, and check with the inverse."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Work out the column addition."
            show: { drawn: written-calc, rows: ["2546", "3275"], op: "+", result: "____" }
            answer: "5821"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "The ones add up to 15. What do you carry into the tens?"
            options: ["1 ten", "5 ones", "15"]
            answer: "1 ten"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5342 − 1826"
            say: "Column subtraction also starts with the ones. Ones: two take away six. There are not enough ones, so we exchange."
            show: { drawn: written-calc, rows: ["5342", "1826"], op: "-" }
          - text: "Exchange 1 ten for 10 ones: 12 − 6 = 6"
            say: "Exchange one of the four tens for ten ones. Now there are three tens and twelve ones. Twelve take away six is six. Tens: three take away two is one."
            show: { drawn: written-calc, rows: ["5342", "1826"], op: "-", above: "  31", cross: "  x ", result: "  16" }
          - text: "Exchange 1 thousand for 10 hundreds: 13 − 8 = 5. 5342 − 1826 = 3516"
            say: "Hundreds: three take away eight. Exchange one thousand for ten hundreds. Now there are four thousands and thirteen hundreds. Thirteen take away eight is five. Thousands: four take away one is three. The answer is three thousand, five hundred and sixteen."
            show: { drawn: written-calc, rows: ["5342", "1826"], op: "-", above: "4131", cross: "x x ", result: "3516" }
          - text: "Check with the inverse: 3516 + 1826 = 5342"
            say: "Check it with the inverse. Add the answer to the number you took away. Three thousand five hundred and sixteen plus one thousand eight hundred and twenty-six is five thousand three hundred and forty-two, the number we started with. So the answer is right."
            show: { drawn: written-calc, rows: ["3516", "1826"], op: "+", carry: "1 1 ", result: "5342" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: text_input
                text: "Work out the column subtraction."
                show: { drawn: written-calc, rows: ["4785", "2341"], op: "-", result: "____" }
                answer: "2444"
                hints:
                  - "Start with the ones: 5 − 1."
                  - "Ones 4, tens 8 − 4 = 4, hundreds 7 − 3 = 4, thousands 4 − 2 = 2."
                  - "The answer is 2444."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "6352 − 2417. Ones: 2 − 7. What do you do?"
                show: { drawn: written-calc, rows: ["6352", "2417"], op: "-" }
                options: ["Exchange 1 ten for 10 ones, then 12 − 7.", "Work out 7 − 2 instead.", "Write 0 in the ones."]
                answer: "Exchange 1 ten for 10 ones, then 12 − 7."
                feedback:
                  "Work out 7 − 2 instead.": "You must take the bottom number from the top one. When there are not enough ones, exchange a ten."
                hints:
                  - "There are not enough ones to take away 7."
                  - "Take 1 of the 5 tens and change it for 10 ones."
                  - "Exchange 1 ten for 10 ones, then 12 − 7."
              - id: l2-f3
                type: text_input
                text: "Now finish it. Work out the column subtraction."
                show: { drawn: written-calc, rows: ["6352", "2417"], op: "-", above: "5141", cross: "x x ", result: "___5" }
                answer: "3935"
                hints:
                  - "Tens: 4 − 1. Hundreds: 3 − 4 needs an exchange."
                  - "Hundreds: 13 − 4 = 9. Thousands: 5 − 2 = 3."
                  - "The answer is 3935."
              - id: l2-f4
                type: multiple_choice
                text: "Lily works out 5274 − 1839 and gets 4645. What went wrong?"
                options: ["She took the smaller digit from the bigger one instead of exchanging.", "She added instead of taking away.", "She lined the numbers up on the left."]
                answer: "She took the smaller digit from the bigger one instead of exchanging."
                hints:
                  - "Look at the ones: 4 − 9. What did she write?"
                  - "She wrote 5, which is 9 − 4. She did the same in the hundreds."
                  - "She took the smaller digit from the bigger one. The answer is 3435."
              - id: l2-f5
                type: multiple_choice
                text: "Check 7426 − 2815 = 4611 with the inverse. Which calculation do you do?"
                options: ["4611 + 2815", "7426 + 2815", "4611 − 2815"]
                answer: "4611 + 2815"
                hints:
                  - "The inverse of taking away is adding."
                  - "Add the answer to the number you took away."
                  - "4611 + 2815 should give 7426."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Work out the column subtraction."
                show: { drawn: written-calc, rows: ["8563", "3248"], op: "-", result: "____" }
                answer: "5315"
                hints: ["Ones: 3 − 8 needs an exchange: 13 − 8."]
              - id: l2-s2
                type: text_input
                text: "Work out the column subtraction."
                show: { drawn: written-calc, rows: ["7214", "3562"], op: "-", result: "____" }
                answer: "3652"
                hints: ["The tens and the hundreds both need an exchange."]
              - id: l2-s3
                type: multiple_choice
                text: "Which digit is missing from the answer?"
                show: { drawn: written-calc, rows: ["5432", "2718"], op: "-", result: "27_4" }
                options: ["1", "2", "9"]
                answer: "1"
                hints: ["After the exchange in the ones, the tens are 2 − 1."]
              - id: l2-s4
                type: true_false
                text: "9156 − 4372 = 4784"
                say: "Is it true? Nine thousand one hundred and fifty-six take away four thousand three hundred and seventy-two is four thousand seven hundred and eighty-four."
                answer: true
                hints: ["Check with the inverse: 4784 + 4372."]
              - id: l2-s5
                type: text_input
                text: "A pool holds 6250 litres. 1875 litres are let out. How many litres are left?"
                answer: "4375"
                hints: ["6250 − 1875. Three columns need an exchange."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "8436 − 5172 = _"
                answer: "3264"
              - id: l2-n2
                type: text_input
                text: "6721 − 3458 = _"
                answer: "3263"
              - id: l2-n3
                type: true_false
                text: "4823 − 1564 = 3359"
                say: "Is it true? Four thousand eight hundred and twenty-three take away one thousand five hundred and sixty-four is three thousand three hundred and fifty-nine."
                answer: false
              - id: l2-n4
                type: text_input
                text: "47,385 − 12,163 = _"
                answer: "35222"
                difficulty: stretch
              - id: l2-n5
                type: text_input
                text: "A theatre has 2450 seats. 1678 tickets are sold. How many seats are still free?"
                answer: "772"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: text_input
            text: "3657 + 2486 = _"
            answer: "6143"
          - id: l2-c2
            part: sub
            type: text_input
            text: "7342 − 2615 = _"
            answer: "4727"
          - id: l2-c3
            part: check
            type: multiple_choice
            text: "Jack works out 6182 − 2547 and gets 4445. What went wrong?"
            options: ["He took the smaller digit from the bigger one instead of exchanging.", "He forgot to carry.", "He lined the numbers up on the left."]
            answer: "He took the smaller digit from the bigger one instead of exchanging."
          - id: l2-c4
            part: check
            type: multiple_choice
            text: "Which answer fits the estimate? 8124 − 3987"
            options: ["4137", "5137", "3137"]
            answer: "4137"
          - id: l2-c5
            part: add
            type: text_input
            text: "A charity raised £3765 in May and £2849 in June. How much did it raise altogether? Type the pounds."
            answer: "6614"
          - id: l2-c6
            part: add
            type: text_input
            text: "Work out the column addition."
            show: { drawn: written-calc, rows: ["4279", "3586"], op: "+", result: "____" }
            answer: "7865"
          - id: l2-c7
            part: add
            type: text_input
            text: "5068 + 937 = _"
            answer: "6005"
          - id: l2-c8
            part: add
            type: multiple_choice
            text: "2795 + 3468 = _"
            options: ["6263", "5153", "6163"]
            answer: "6263"
          - id: l2-c9
            part: add
            type: true_false
            text: "1987 + 4026 = 6013"
            say: "Is it true? One thousand nine hundred and eighty-seven plus four thousand and twenty-six is six thousand and thirteen."
            answer: true
          - id: l2-c10
            part: add
            type: text_input
            text: "4608 + 3795 = _"
            answer: "8403"
          - id: l2-c11
            part: sub
            type: text_input
            text: "Work out the column subtraction."
            show: { drawn: written-calc, rows: ["6074", "2358"], op: "-", result: "____" }
            answer: "3716"
          - id: l2-c12
            part: sub
            type: text_input
            text: "8005 − 2647 = _"
            answer: "5358"
          - id: l2-c13
            part: sub
            type: multiple_choice
            text: "5631 − 2874 = _"
            options: ["2757", "3243", "2857"]
            answer: "2757"
          - id: l2-c14
            part: sub
            type: true_false
            text: "7340 − 1586 = 5854"
            say: "Is it true? Seven thousand three hundred and forty take away one thousand five hundred and eighty-six is five thousand eight hundred and fifty-four."
            answer: false
          - id: l2-c15
            part: sub
            type: text_input
            text: "A shop has 4200 stickers. It sells 1765 of them. How many stickers are left?"
            answer: "2435"
          - id: l2-c16
            part: sub
            type: text_input
            text: "9150 − 4673 = _"
            answer: "4477"
          - id: l2-c17
            part: check
            type: true_false
            text: "Is it true? 2737 + 3478 = 6215, so 6215 − 3478 = 2737 is right."
            say: "Is it true? Two thousand seven hundred and thirty-seven plus three thousand four hundred and seventy-eight is six thousand two hundred and fifteen. So six thousand two hundred and fifteen take away three thousand four hundred and seventy-eight is two thousand seven hundred and thirty-seven."
            answer: true
          - id: l2-c18
            part: check
            type: multiple_choice
            text: "Estimate: about how much is 6980 − 3020?"
            options: ["about 4000", "about 3000", "about 10,000"]
            answer: "about 4000"
          - id: l2-c19
            part: check
            type: multiple_choice
            text: "Rob works out 3567 + 1428 and gets 4985. What went wrong?"
            options: ["He forgot to carry.", "He lined the numbers up on the left.", "He took away instead of adding."]
            answer: "He forgot to carry."
          - id: l2-c20
            part: check
            type: true_false
            text: "Ella works out 8264 − 3519 and gets 5745. Is it true that her answer fits an estimate?"
            say: "Ella works out eight thousand two hundred and sixty-four take away three thousand five hundred and nineteen, and gets five thousand seven hundred and forty-five. Is it true that her answer fits an estimate?"
            answer: false
