# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.fraction-decimals
skill: math.decimals.fraction-equivalents
curriculum: en-GB
language: en
title:
  de: Brüche und Dezimalzahlen
  en: Fractions and decimals
summary: >
  Writing tenths and hundredths as decimals and back (0.71 = 71/100,
  3/10 = 0.3), and the decimal equivalents of 1/2, 1/4 and 3/4 that
  Year 4 asks for. Lesson 1 links tenths and hundredths with one and two
  decimal places and finds 1/2 = 0.5; lesson 2 finds 1/4 = 0.25 and
  3/4 = 0.75 on a hundred field and with money, and ends with the skill
  check.
metadata:
  year: year-4
  topic: { de: Dezimalzahlen, en: Decimals }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.decimals.hundredths, math.fractions.equivalent-simple]
  also_practises: [math.decimals.hundredths]
  vocabulary: { en: [fraction, decimal, tenth, hundredth, half, quarter, three quarters, equivalent] }
  forms: [drawn, text, audio]
  drawn: [fraction, hundred-field]
  facets: [number-format, currency]
  misconceptions:
    - id: digits-make-the-decimal
      what: Writes the digits of the fraction as the decimal (1/4 = 0.14 or 0.4, 1/2 = 0.12, 3/4 = 0.34)
      addressed: lesson 2 Learn finds 1/4 as 25 hundredths; l1-f4, l2-f1 and l2-f2 have feedback on it, and l2-s2, l2-n2 and l2-c3 offer it again
    - id: tenths-or-hundredths
      what: Mixes up one and two decimal places (0.4 = 4/100, 0.71 = 71/10)
      addressed: lesson 1 Learn says one place is tenths and two places are hundredths; l1-f1 has feedback, and l1-f5, l1-s1 and l1-n2 ask it
    - id: equal-forms
      what: Does not see that 5/10, 50/100, 2/4 and 0.5 are all one half
      addressed: lesson 1 Learn shows 1/2 = 5/10 = 0.5 and lesson 2 Learn 2/4 = 50/100; l1-s5, l2-f4, l2-s3 and l2-n4 ask it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Zehntel und Hundertstel als Brüche, en: Tenths and hundredths as fractions }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Write 7/100 as a decimal."
            say: "Write seven hundredths as a decimal."
            options: ["0.07", "0.7", "7.0"]
            answer: "0.07"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Find the equivalent fraction."
            say: "One half is how many quarters?"
            frame: "1/2 = _/4"
            options: ["1", "2", "3"]
            answer: ["2"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "71/100 = 0.71"
            say: "Seventy-one hundredths is zero point seven one. Two decimal places mean hundredths."
            show: { drawn: hundred-field, filled: 71 }
          - text: "0.3 = 3/10"
            say: "One decimal place means tenths. Zero point three is three tenths."
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 3 }
          - text: "1/2 = 5/10 = 0.5"
            say: "Half of a bar of ten parts is five parts: five tenths. So one half is zero point five."
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 5 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Write 0.71 as a fraction."
                options: ["71/100", "71/10", "7/100"]
                answer: "71/100"
                feedback:
                  "71/10": "71 tenths would be more than 7 wholes. Two decimal places mean hundredths."
                hints:
                  - "How many digits are after the decimal point?"
                  - "Two places after the point mean hundredths."
                  - "71/100."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What decimal is shaded?"
                show: { drawn: fraction, kind: bar, parts: 10, shaded: 7 }
                options: ["0.7", "0.07", "7.0"]
                answer: "0.7"
                hints:
                  - "The bar has 10 equal parts. Each part is one tenth."
                  - "7 parts are shaded: 7 tenths."
                  - "0.7."
              - id: l1-f3
                type: fill_in_blank
                text: "Write 0.39 as a fraction."
                frame: "0.39 = _/100"
                options: ["3", "9", "39"]
                answer: ["39"]
                hints:
                  - "Two decimal places mean hundredths."
                  - "0.39 is 3 tenths and 9 hundredths, which is 39 hundredths."
                  - "39/100."
              - id: l1-f4
                type: multiple_choice
                text: "Which decimal is 1/2?"
                say: "Which decimal is one half?"
                options: ["0.5", "0.12", "0.2"]
                answer: "0.5"
                feedback:
                  "0.12": "The digits of a fraction do not make its decimal. Half of 10 tenths is 5 tenths: 0.5."
                hints:
                  - "Think of a bar of 10 tenths."
                  - "Half of 10 tenths is 5 tenths."
                  - "0.5."
              - id: l1-f5
                type: true_false
                text: "Is it true? 0.4 = 4/100"
                say: "Is it true? Zero point four is four hundredths."
                answer: false
                hints:
                  - "How many decimal places does 0.4 have?"
                  - "One decimal place means tenths."
                  - "No. 0.4 = 4/10."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Write 0.9 as a fraction."
                options: ["9/10", "9/100", "1/9"]
                answer: "9/10"
                hints: ["One decimal place means tenths."]
              - id: l1-s2
                type: fill_in_blank
                text: "Write 0.06 as a fraction."
                frame: "0.06 = _/100"
                options: ["6", "60", "600"]
                answer: ["6"]
                hints: ["No tenths and 6 hundredths."]
              - id: l1-s3
                type: multiple_choice
                text: "The whole field is 1. Which fraction and decimal match the filled part?"
                show: { drawn: hundred-field, filled: 83 }
                options: ["83/100 = 0.83", "83/10 = 8.3", "8/100 = 0.08"]
                answer: "83/100 = 0.83"
                hints: ["Count the filled dots out of 100."]
              - id: l1-s4
                type: matching
                text: "Match each fraction with its decimal."
                option_audio: false
                pairs:
                  - { left: { text: "1/2" }, right: { text: "0.5" } }
                  - { left: { text: "3/10" }, right: { text: "0.3" } }
                  - { left: { text: "3/100" }, right: { text: "0.03" } }
                  - { left: { text: "13/100" }, right: { text: "0.13" } }
                hints: ["Tenths have one decimal place, hundredths have two."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 5/10 and 1/2 are both 0.5."
                answer: true
                hints: ["Half of a bar of ten parts is five parts."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Write 47/100 as a decimal."
                say: "Write forty-seven hundredths as a decimal."
                keyboard: decimal
                answer: "0.47"
              - id: l1-n2
                type: multiple_choice
                text: "Write 0.02 as a fraction."
                options: ["2/100", "2/10", "1/2"]
                answer: "2/100"
              - id: l1-n3
                type: multiple_choice
                text: "Which decimal is 6/10?"
                options: ["0.6", "0.06", "0.16"]
                answer: "0.6"
              - id: l1-n4
                type: true_false
                text: "Is it true? 0.50 = 1/2"
                say: "Is it true? Zero point five zero is one half."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Max has run 0.8 of a race. Write that as a fraction."
                options: ["8/10", "8/100", "1/8"]
                answer: "8/10"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Write 0.53 as a fraction."
            options: ["53/100", "53/10", "5/100"]
            answer: "53/100"
          - id: l1-c2
            type: multiple_choice
            text: "What decimal is shaded?"
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 4 }
            options: ["0.4", "0.04", "4.0"]
            answer: "0.4"
          - id: l1-c3
            type: fill_in_blank
            text: "Write 0.07 as a fraction."
            frame: "0.07 = _/100"
            options: ["7", "70", "700"]
            answer: ["7"]

  - n: 2
    title: { de: Viertel und Dreiviertel, en: Quarters and three quarters }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Write 0.31 as a fraction."
            options: ["31/100", "31/10", "3/100"]
            answer: "31/100"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Write 1/2 as a decimal."
            say: "Write one half as a decimal."
            frame: "1/2 = 0._"
            options: ["2", "5", "12"]
            answer: ["5"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1/4 = 25/100 = 0.25"
            say: "Split the hundred field into four equal parts. Each part has twenty-five hundredths. So one quarter is zero point two five."
            show: { drawn: hundred-field, filled: 25 }
          - text: "3/4 = 75/100 = 0.75"
            say: "Three quarters is three lots of twenty-five hundredths. That is seventy-five hundredths: zero point seven five."
            show: { drawn: hundred-field, filled: 75 }
          - text: "2/4 = 1/2 = 50/100 = 0.5"
            say: "Two quarters make a half. That is fifty hundredths, or zero point five."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 2 }
          - text: "1/4 of £1 = 25p = £0.25"
            say: "A quarter of a pound is twenty-five pence. We write it as zero point two five pounds. Half of a pound is fifty pence, and three quarters of a pound is seventy-five pence."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What decimal is shaded?"
                show: { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
                options: ["0.25", "0.4", "0.14"]
                answer: "0.25"
                feedback:
                  "0.4": "Four parts does not make 0.4. One quarter of a hundred is 25, so 1/4 is 0.25."
                  "0.14": "The digits of 1/4 do not make its decimal. One quarter is 25 hundredths: 0.25."
                hints:
                  - "One part of four is one quarter."
                  - "A quarter of 100 hundredths is 25 hundredths."
                  - "0.25."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which decimal is 3/4?"
                say: "Which decimal is three quarters?"
                options: ["0.75", "0.34", "0.3"]
                answer: "0.75"
                feedback:
                  "0.34": "The digits of 3/4 do not make its decimal. Three quarters is three lots of 25 hundredths."
                hints:
                  - "One quarter is 0.25."
                  - "Three quarters is 25 + 25 + 25 hundredths."
                  - "75 hundredths: 0.75."
              - id: l2-f3
                type: fill_in_blank
                text: "Write 1/4 as hundredths and as a decimal."
                say: "Write one quarter as hundredths and as a decimal."
                frame: "1/4 = _/100 = 0._ _"
                options: ["2", "4", "5", "25"]
                answer: ["25", "2", "5"]
                hints:
                  - "Split 100 into four equal parts."
                  - "100 ÷ 4 = 25, so 1/4 = 25/100."
                  - "25/100 = 0.25."
              - id: l2-f4
                type: true_false
                text: "Is it true? 0.5 is the same as 2/4."
                say: "Is it true? Zero point five is the same as two quarters."
                answer: true
                hints:
                  - "What do two quarters make?"
                  - "Two quarters make one half."
                  - "Yes. 2/4 = 1/2 = 0.5."
              - id: l2-f5
                type: multiple_choice
                text: "£0.50 is what fraction of £1?"
                options: ["1/2", "1/50", "5/100"]
                answer: "1/2"
                hints:
                  - "£0.50 is 50p. How many pence are in £1?"
                  - "50p is 50 out of 100 pence."
                  - "50/100 is one half."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What decimal is shaded?"
                show: { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
                options: ["0.75", "0.3", "0.43"]
                answer: "0.75"
                hints: ["Each quarter is 0.25. How many quarters are shaded?"]
              - id: l2-s2
                type: multiple_choice
                text: "Write 0.25 as a fraction."
                options: ["1/4", "2/5", "25/10"]
                answer: "1/4"
                hints: ["0.25 is 25 hundredths. How many 25s make 100?"]
              - id: l2-s3
                type: multiple_choice
                text: "The whole field is 1. What fraction is filled?"
                show: { drawn: hundred-field, filled: 50 }
                options: ["1/2", "1/5", "1/50"]
                answer: "1/2"
                hints: ["50 out of 100."]
              - id: l2-s4
                type: matching
                text: "Match each fraction with its decimal."
                option_audio: false
                pairs:
                  - { left: { text: "1/4" }, right: { text: "0.25" } }
                  - { left: { text: "1/2" }, right: { text: "0.5" } }
                  - { left: { text: "3/4" }, right: { text: "0.75" } }
                  - { left: { text: "1/10" }, right: { text: "0.1" } }
                hints: ["A quarter is 25 hundredths."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 1/4 = 0.4"
                say: "Is it true? One quarter is zero point four."
                answer: false
                hints: ["A quarter of 100 is 25."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Write 3/4 as hundredths and as a decimal."
                say: "Write three quarters as hundredths and as a decimal."
                frame: "3/4 = _/100 = 0._ _"
                options: ["3", "5", "7", "75"]
                answer: ["75", "7", "5"]
              - id: l2-n2
                type: multiple_choice
                text: "Write 0.75 as a fraction."
                options: ["3/4", "7/5", "75/10"]
                answer: "3/4"
              - id: l2-n3
                type: multiple_choice
                text: "Ben has 1/4 of a litre of juice. How much is that as a decimal?"
                say: "Ben has one quarter of a litre of juice. How much is that as a decimal?"
                options: ["0.25 litres", "0.4 litres", "1.4 litres"]
                answer: "0.25 litres"
              - id: l2-n4
                type: multiple_choice
                text: "Which one is not equal to 1/2?"
                say: "Which one is not equal to one half?"
                options: ["0.5", "50/100", "0.2"]
                answer: "0.2"
              - id: l2-n5
                type: true_false
                text: "Is it true? Two quarters make 0.5."
                say: "Is it true? Two quarters make zero point five."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Write 0.61 as a fraction."
            options: ["61/100", "61/10", "6/100"]
            answer: "61/100"
          - id: l2-c2
            type: multiple_choice
            text: "What decimal is shaded?"
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 9 }
            options: ["0.9", "0.09", "0.19"]
            answer: "0.9"
          - id: l2-c3
            type: multiple_choice
            text: "Which decimal is 1/4?"
            say: "Which decimal is one quarter?"
            options: ["0.25", "0.4", "1.4"]
            answer: "0.25"
          - id: l2-c4
            type: fill_in_blank
            text: "Write 0.04 as a fraction."
            frame: "0.04 = _/100"
            options: ["4", "40", "400"]
            answer: ["4"]
          - id: l2-c5
            type: text_input
            text: "Write 3/4 as a decimal."
            say: "Write three quarters as a decimal."
            keyboard: decimal
            answer: "0.75"
