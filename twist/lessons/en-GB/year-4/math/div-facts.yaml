# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.div-facts
skill: math.mult-div.div-facts
curriculum: en-GB
language: en
title:
  de: Alle Geteiltaufgaben
  en: Division facts
summary: >
  Every division fact from the times tables. Lesson 1 gets two division
  facts from each multiplication (6 × 4 = 24 gives 24 ÷ 4 = 6 and
  24 ÷ 6 = 4), divides by 2, 3, 4, 5 and 10, and learns what happens
  when you divide a number by itself or by 1; lesson 2 divides by 6, 7,
  8 and 9, checks each answer with the multiplication, and ends with the
  skill check.
metadata:
  year: year-4
  topic: { de: Geteiltaufgaben, en: Division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-inverse, math.mult-div.all-tables]
  also_practises: [math.mult-div.div-inverse, math.mult-div.all-tables]
  vocabulary: { en: [divide, divided by, division fact, fact family, inverse, check] }
  forms: [text, audio]
  drawn: []
  facets: [operation-signs]
  parts:
    - { id: small, what: { de: "durch 2, 3, 4, 5 und 10 teilen", en: "dividing by 2, 3, 4, 5 and 10" } }
    - { id: big, what: { de: "durch 6, 7, 8 und 9 teilen", en: "dividing by 6, 7, 8 and 9" } }
    - { id: rules, what: { de: durch 1 und durch die Zahl selbst teilen, en: dividing by 1 and by the number itself } }
    - { id: check, what: { de: mit der Malaufgabe die Probe machen, en: checking a division with a multiplication } }
  misconceptions:
    - id: divide-by-itself-zero
      what: Thinks a number divided by itself is 0 or the number (8 ÷ 8 = 0), or that dividing by 1 gives 1
      addressed: lesson 1 Learn gives both rules; l1-f3, l1-s3 and l1-n3 ask n ÷ n or n ÷ 1 with the wrong rule as options, with feedback in l1-f3; l1-c3 asks whether 5 ÷ 5 is 0
    - id: check-wrong-operation
      what: Checks a division with an addition or subtraction instead of the multiplication
      addressed: lesson 2 Learn checks 56 ÷ 8 = 7 with 7 × 8; every stage of lesson 2 has a "Which check fits?" task offering the addition and subtraction (l2-f1 with feedback, l2-s1, l2-n1); l2-f3 and l2-n3 need the check to find a wrong answer
    - id: big-number-second
      what: Writes the small number first in a division of a fact family (6 ÷ 24)
      addressed: l1-f2 has 6 ÷ 24 as an option with feedback; l1-s2 and l1-n2 build both divisions with the whole first
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zwei Geteiltaufgaben aus einer Malaufgabe", en: "Two divisions from one multiplication" }
    goal:
      de: "Finde zu jeder Malaufgabe zwei Geteiltaufgaben. 6 mal 4 ist 24, also ist 24 geteilt durch 4 gleich 6."
      en: "Find two divisions in every times fact. 6 times 4 is 24, so 24 divided by 4 is 6."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "15 ÷ 5 = _"
            say: "Fifteen divided by five."
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "6 × 4 = _"
            say: "Six times four."
            answer: "24"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "6 × 4 = 24, so 24 ÷ 4 = 6 and 24 ÷ 6 = 4"
            say: "Every multiplication gives you two division facts. Six times four is twenty-four. So twenty-four divided by four is six, and twenty-four divided by six is four. The biggest number, twenty-four, always comes first in the division."
          - text: "35 ÷ 5 = ?   ? × 5 = 35   7 × 5 = 35, so 35 ÷ 5 = 7"
            say: "To divide thirty-five by five, ask: what times five is thirty-five? Seven times five is thirty-five, so the answer is seven."
          - text: "8 ÷ 8 = 1   8 ÷ 1 = 8"
            say: "Two rules always work. A number divided by itself is one: eight shared between eight people gives one each. A number divided by one stays the same: eight shared with one person gives that person all eight."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "40 ÷ 10 = _"
                say: "Forty divided by ten."
                answer: "4"
                hints:
                  - "What times ten is forty?"
                  - "Count in tens: 10, 20, 30, 40."
                  - "4 × 10 = 40, so the answer is 4."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "3 × 8 = 24. Which division belongs to it?"
                say: "Three times eight is twenty-four. Which division belongs to it?"
                options: ["24 ÷ 8 = 3", "8 ÷ 24 = 3", "24 ÷ 3 = 6"]
                answer: "24 ÷ 8 = 3"
                feedback:
                  "8 ÷ 24 = 3": "The biggest number comes first: start with 24 and divide."
                hints:
                  - "Start with the biggest number, 24."
                  - "24 divided by one of the other numbers gives the third."
                  - "24 ÷ 8 = 3."
              - id: l1-f3
                type: multiple_choice
                text: "9 ÷ 9 = _"
                say: "Nine divided by nine."
                options: ["0", "1", "9"]
                answer: "1"
                feedback:
                  "0": "Dividing is not taking away. Nine shared between nine gives one each."
                  "9": "That is 9 ÷ 1. Nine shared between nine gives one each."
                hints:
                  - "Share nine sweets between nine children."
                  - "How many does each child get?"
                  - "9 ÷ 9 = 1."
              - id: l1-f4
                type: true_false
                text: "Is it true? 18 ÷ 3 = 6"
                say: "Eighteen divided by three is six. Is it true?"
                answer: true
                hints:
                  - "What times three is eighteen?"
                  - "Count in threes: 3, 6, 9, 12, 15, 18."
                  - "6 × 3 = 18, so yes."
              - id: l1-f5
                type: text_input
                text: "32 ÷ 4 = _"
                say: "Thirty-two divided by four."
                answer: "8"
                hints:
                  - "What times four is thirty-two?"
                  - "4 × 8 or 8 × 4."
                  - "8 × 4 = 32, so the answer is 8."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "45 ÷ 5 = _"
                say: "Forty-five divided by five."
                answer: "9"
                hints: ["What times five is forty-five?"]
              - id: l1-s2
                type: fill_in_blank
                text: "5 × 7 = 35. Write both divisions."
                say: "Five times seven is thirty-five. Write both divisions."
                frame: "35 ÷ 7 = _ and 35 ÷ 5 = _"
                options: ["5", "7", "35"]
                answer: ["5", "7"]
                hints: ["Divide 35 by one number to get the other."]
              - id: l1-s3
                type: multiple_choice
                text: "6 ÷ 1 = _"
                say: "Six divided by one."
                options: ["0", "1", "6"]
                answer: "6"
                hints: ["Six shared with one person: how many does that person get?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? 27 ÷ 3 = 8"
                say: "Twenty-seven divided by three is eight. Is it true?"
                answer: false
                hints: ["What is 8 × 3?"]
              - id: l1-s5
                type: text_input
                text: "16 ÷ 2 = _"
                say: "Sixteen divided by two."
                answer: "8"
                hints: ["Half of sixteen."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "90 ÷ 10 = _"
                say: "Ninety divided by ten."
                answer: "9"
              - id: l1-n2
                type: fill_in_blank
                text: "4 × 9 = 36. Write both divisions."
                say: "Four times nine is thirty-six. Write both divisions."
                frame: "36 ÷ 9 = _ and 36 ÷ 4 = _"
                options: ["4", "9", "36"]
                answer: ["4", "9"]
              - id: l1-n3
                type: multiple_choice
                text: "7 ÷ 7 = _"
                say: "Seven divided by seven."
                options: ["0", "1", "7"]
                answer: "1"
              - id: l1-n4
                type: text_input
                text: "28 ÷ 4 = _"
                say: "Twenty-eight divided by four."
                answer: "7"
              - id: l1-n5
                type: text_input
                text: "Mr Khan shares 30 stickers equally between 5 children. How many does each child get?"
                answer: "6"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "24 ÷ 3 = _"
            say: "Twenty-four divided by three."
            answer: "8"
          - id: l1-c2
            type: text_input
            text: "50 ÷ 5 = _"
            say: "Fifty divided by five."
            answer: "10"
          - id: l1-c3
            type: true_false
            text: "Is it true? 5 ÷ 5 = 0"
            say: "Five divided by five is zero. Is it true?"
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Which number is missing?"
            say: "Twenty divided by something is four. Which number is missing?"
            frame: "20 ÷ _ = 4"
            options: ["4", "5", "16"]
            answer: ["5"]
          - id: l1-c5
            type: text_input
            text: "70 ÷ 10 = _"
            say: "Seventy divided by ten."
            answer: "7"
          - id: l1-c6
            type: true_false
            text: "Is it true? 9 ÷ 1 = 9"
            say: "Nine divided by one is nine. Is it true?"
            answer: true

  - n: 2
    title: { de: "Teilen und prüfen", en: "Divide and check" }
    goal:
      de: "Teile durch 6, 7, 8 und 9 und prüf jedes Ergebnis mit einer Malaufgabe, so wie 7 mal 8 für 56 geteilt durch 8."
      en: "Divide by 6, 7, 8 and 9, and check each answer by multiplying, like 7 times 8 for 56 divided by 8."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "20 ÷ 4 = _"
            say: "Twenty divided by four."
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "10 ÷ 1 = _"
            say: "Ten divided by one."
            options: ["1", "10", "0"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "56 ÷ 8 = ?   ? × 8 = 56"
            say: "Dividing by six, seven, eight or nine works the same way. Fifty-six divided by eight: what times eight is fifty-six? Seven times eight is fifty-six, so the answer is seven."
          - text: "56 ÷ 8 = 7   check: 7 × 8 = 56"
            say: "Check a division with the multiplication. Multiply your answer by the number you divided by. If you get back to the number you started with, your answer is right."
          - text: "54 ÷ 9 = 7?   check: 7 × 9 = 63, not 54"
            say: "Ruby says fifty-four divided by nine is seven. Check it: seven times nine is sixty-three, not fifty-four. So Ruby is wrong. Six times nine is fifty-four, so the answer is six."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "42 ÷ 6 = 7. Which check fits?"
                say: "Forty-two divided by six is seven. Which check fits?"
                options: ["7 × 6 = 42", "7 + 6 = 13", "42 − 6 = 36"]
                answer: "7 × 6 = 42"
                feedback:
                  "7 + 6 = 13": "Division is checked with multiplication, not addition."
                  "42 − 6 = 36": "Division is checked with multiplication, not subtraction."
                hints:
                  - "Multiplication undoes division."
                  - "Multiply the answer, 7, by the number you divided by, 6."
                  - "7 × 6 = 42."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "63 ÷ 7 = _"
                say: "Sixty-three divided by seven."
                answer: "9"
                hints:
                  - "What times seven is sixty-three?"
                  - "Ten sevens are 70. One fewer seven."
                  - "9 × 7 = 63, so the answer is 9."
              - id: l2-f3
                type: true_false
                text: "Is it true? 48 ÷ 8 = 7"
                say: "Forty-eight divided by eight is seven. Is it true?"
                answer: false
                hints:
                  - "Check it with a multiplication."
                  - "7 × 8 = 56, not 48."
                  - "No. 6 × 8 = 48, so 48 ÷ 8 = 6."
              - id: l2-f4
                type: text_input
                text: "54 ÷ 6 = _"
                say: "Fifty-four divided by six."
                answer: "9"
                hints:
                  - "What times six is fifty-four?"
                  - "10 × 6 = 60. Take away one six."
                  - "9 × 6 = 54, so the answer is 9."
              - id: l2-f5
                type: fill_in_blank
                text: "Divide and check."
                say: "Seventy-two divided by nine. Then check it."
                frame: "72 ÷ 9 = _, check: _ × 9 = 72"
                options: ["7", "8", "9"]
                answer: ["8", "8"]
                hints:
                  - "What times nine is seventy-two?"
                  - "8 × 9 = 72."
                  - "8 and 8."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "36 ÷ 9 = 4. Which check fits?"
                say: "Thirty-six divided by nine is four. Which check fits?"
                options: ["4 × 9 = 36", "4 + 9 = 13", "36 − 9 = 27"]
                answer: "4 × 9 = 36"
                hints: ["Multiplication undoes division."]
              - id: l2-s2
                type: text_input
                text: "49 ÷ 7 = _"
                say: "Forty-nine divided by seven."
                answer: "7"
                hints: ["What times seven is forty-nine?"]
              - id: l2-s3
                type: true_false
                text: "Is it true? 64 ÷ 8 = 8"
                say: "Sixty-four divided by eight is eight. Is it true?"
                answer: true
                hints: ["Check: what is 8 × 8?"]
              - id: l2-s4
                type: text_input
                text: "36 ÷ 6 = _"
                say: "Thirty-six divided by six."
                answer: "6"
                hints: ["What times six is thirty-six?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Divide and check."
                say: "Forty-two divided by seven. Then check it."
                frame: "42 ÷ 7 = _, check: _ × 7 = 42"
                options: ["5", "6", "7"]
                answer: ["6", "6"]
                hints: ["What times seven is forty-two?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "56 ÷ 7 = 8. Which check fits?"
                say: "Fifty-six divided by seven is eight. Which check fits?"
                options: ["8 × 7 = 56", "8 + 7 = 15", "56 − 7 = 49"]
                answer: "8 × 7 = 56"
              - id: l2-n2
                type: text_input
                text: "81 ÷ 9 = _"
                say: "Eighty-one divided by nine."
                answer: "9"
              - id: l2-n3
                type: true_false
                text: "Is it true? 63 ÷ 9 = 6"
                say: "Sixty-three divided by nine is six. Is it true?"
                answer: false
              - id: l2-n4
                type: text_input
                text: "48 ÷ 6 = _"
                say: "Forty-eight divided by six."
                answer: "8"
              - id: l2-n5
                type: text_input
                text: "There are 56 children. They make teams of 8. How many teams are there?"
                answer: "7"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: big
            type: text_input
            text: "21 ÷ 7 = _"
            say: "Twenty-one divided by seven."
            answer: "3"
          - id: l2-c2
            part: big
            type: text_input
            text: "72 ÷ 8 = _"
            say: "Seventy-two divided by eight."
            answer: "9"
          - id: l2-c3
            part: rules
            type: multiple_choice
            text: "4 ÷ 4 = _"
            say: "Four divided by four."
            options: ["0", "1", "4"]
            answer: "1"
          - id: l2-c4
            part: check
            type: multiple_choice
            text: "45 ÷ 9 = 5. Which check fits?"
            say: "Forty-five divided by nine is five. Which check fits?"
            options: ["5 × 9 = 45", "5 + 9 = 14", "45 − 9 = 36"]
            answer: "5 × 9 = 45"
          - id: l2-c5
            part: big
            type: text_input
            text: "A baker puts 40 rolls into bags of 8. How many bags does she fill?"
            answer: "5"
          - id: l2-c6
            part: small
            type: text_input
            text: "18 ÷ 2 = _"
            say: "Eighteen divided by two."
            answer: "9"
          - id: l2-c7
            part: small
            type: text_input
            text: "30 ÷ 3 = _"
            say: "Thirty divided by three."
            answer: "10"
          - id: l2-c8
            part: small
            type: true_false
            text: "Is it true? 40 ÷ 5 = 9"
            say: "Forty divided by five is nine. Is it true?"
            answer: false
          - id: l2-c9
            part: small
            type: matching
            text: "Match each division with its answer."
            pairs:
              - { left: { text: "12 ÷ 3" }, right: { text: "4" } }
              - { left: { text: "60 ÷ 10" }, right: { text: "6" } }
              - { left: { text: "20 ÷ 2" }, right: { text: "10" } }
              - { left: { text: "25 ÷ 5" }, right: { text: "5" } }
          - id: l2-c10
            part: small
            type: text_input
            text: "A ribbon 80 cm long is cut into 10 equal pieces. How long is each piece? Type the centimetres."
            answer: "8"
          - id: l2-c11
            part: big
            type: text_input
            text: "27 ÷ 9 = _"
            say: "Twenty-seven divided by nine."
            answer: "3"
          - id: l2-c12
            part: big
            type: multiple_choice
            text: "Which division has the answer 7?"
            options: ["42 ÷ 6", "36 ÷ 6", "64 ÷ 8"]
            answer: "42 ÷ 6"
          - id: l2-c13
            part: rules
            type: text_input
            text: "12 ÷ 1 = _"
            say: "Twelve divided by one."
            answer: "12"
          - id: l2-c14
            part: rules
            type: true_false
            text: "Is it true? 6 ÷ 6 = 1"
            say: "Six divided by six is one. Is it true?"
            answer: true
          - id: l2-c15
            part: rules
            type: multiple_choice
            text: "Which division has the answer 1?"
            options: ["3 ÷ 3", "3 ÷ 1", "30 ÷ 3"]
            answer: "3 ÷ 3"
          - id: l2-c16
            part: rules
            type: fill_in_blank
            text: "Which number is missing?"
            say: "Something divided by eight is one. Which number is missing?"
            frame: "_ ÷ 8 = 1"
            options: ["0", "1", "8"]
            answer: ["8"]
          - id: l2-c17
            part: check
            type: true_false
            text: "Sam says 54 ÷ 6 = 8. He checks: 8 × 6 = 48. Is his answer right?"
            say: "Sam says fifty-four divided by six is eight. He checks: eight times six is forty-eight. Is his answer right?"
            answer: false
          - id: l2-c18
            part: check
            type: multiple_choice
            text: "Ava checks a division with 9 × 4 = 36. Which division is she checking?"
            say: "Ava checks a division with nine times four is thirty-six. Which division is she checking?"
            options: ["36 ÷ 4 = 9", "36 ÷ 9 = 5", "9 ÷ 4 = 36"]
            answer: "36 ÷ 4 = 9"
          - id: l2-c19
            part: check
            type: multiple_choice
            text: "Leo says 32 ÷ 8 = 5. Check it with a multiplication. What is the right answer?"
            say: "Leo says thirty-two divided by eight is five. Check it with a multiplication. What is the right answer?"
            options: ["3", "4", "6"]
            answer: "4"
          - id: l2-c20
            part: check
            type: true_false
            text: "Is it true? 4 × 7 = 28 shows that 28 ÷ 7 = 4."
            say: "Is it true? Four times seven is twenty-eight shows that twenty-eight divided by seven is four."
            answer: true
