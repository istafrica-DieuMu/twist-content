# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.sequences-to-million
skill: math.large-numbers.sequences
curriculum: en-GB
language: en
title:
  de: Zahlenfolgen bis 1 000 000
  en: Sequences to 1,000,000
summary: >
  Counting in large steps and continuing sequences. Lesson 1 counts
  forwards and backwards in 1000s from any number and in 25s, as Year 4
  asks, and crosses 10,000. Lesson 2 counts in 10,000s and 100,000s up to
  1,000,000, finds the rule of a sequence and the number that does not
  fit, and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Zahlen bis 1 000 000, en: Numbers to 1 000 000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-10000]
  also_practises: [math.large-numbers.to-10000]
  vocabulary: { en: [count on, count back, step, sequence, rule, thousand, ten thousand, hundred thousand, million] }
  forms: [text, audio, drawn]
  drawn: [number-line, place-value-chart]
  facets: []
  parts:
    - { id: thousands-25s, what: { de: in Tausendern und Fünfundzwanzigern vorwärts und rückwärts zählen, en: counting on and back in 1000s and 25s } }
    - { id: big-steps, what: { de: in Zehntausendern und Hunderttausendern bis zur Million zählen, en: "counting in 10,000s and 100,000s up to 1,000,000" } }
    - { id: rule, what: { de: die Regel einer Folge finden und anwenden, en: finding and using the rule of a sequence } }
  misconceptions:
    - id: wrong-digit
      what: Changes the hundreds or tens digit when counting in 1000s (2500, 2600) or the thousands digit when counting in 10,000s
      addressed: lesson 1 Learn says only the thousands digit changes; l1-f1 has feedback on 100 more, l2-f1 has feedback on 1000 more, l1-f3, l1-c1, l2-f5 and l2-s2 offer the wrong digit
    - id: boundary
      what: Stops or goes wrong at a boundary (9000 then 1000, or 97,000 then 98,000 in 10,000s)
      addressed: lesson 1 Learn crosses 10,000 with a new column; l1-f4 has feedback on 1000, l1-n4, l1-c3, l2-f3, l2-s1, l2-c1 and l2-c5 cross a boundary
    - id: rule-size
      what: Gives the rule of a sequence with the wrong size of step (+1000 for +10,000)
      addressed: lesson 2 Learn finds the rule from the digit that changes; l2-f4 has feedback, l2-s3, l2-n3, l2-c4 ask the rule, l2-s5 finds the number that does not fit
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: In Tausendern und Fünfundzwanzigern zählen, en: Counting in 1000s and 25s }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is 1000 more than 3450?"
            options: ["4450", "3550", "3460"]
            answer: "4450"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [5, 0, 7, 2] }
            options: ["5072", "572", "5702"]
            answer: "5072"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Count in 1000s: 2000, 3000, 4000. From any number: 1250, 2250, 3250."
            say: "When you count in thousands, only the thousands digit changes: two thousand, three thousand, four thousand. It works from any number: one thousand two hundred and fifty, two thousand two hundred and fifty, three thousand two hundred and fifty."
            show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: all, jumps: [[2000, 1000], [3000, 1000]] }
          - text: "9000 + 1000 = 10,000"
            say: "After nine thousand comes ten thousand. Ten lots of one thousand make ten thousand, and the number needs a new column on the left."
            show: { drawn: place-value-chart, columns: [ten-thousands, thousands, hundreds, tens, ones], values: [1, 0, 0, 0, 0] }
          - text: "Count in 25s: 0, 25, 50, 75, 100, 125"
            say: "Four steps of twenty-five make one hundred. Zero, twenty-five, fifty, seventy-five, one hundred, one hundred and twenty-five. The ending goes 25, 50, 75, 00 again and again."
            show: { drawn: number-line, from: 0, to: 100, step: 5, labels: ends, jumps: [[0, 25], [25, 25], [50, 25], [75, 25]] }
          - text: "Count back: 5000, 4000, 3000 and 200, 175, 150"
            say: "You can count back too. In thousands: five thousand, four thousand, three thousand. In twenty-fives: two hundred, one hundred and seventy-five, one hundred and fifty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Count on in 1000s: 2500, 3500, 4500, _"
                options: ["5500", "4600", "5000"]
                answer: "5500"
                feedback:
                  "4600": "That is 100 more. Counting in 1000s changes the thousands digit."
                hints:
                  - "Which digit changes each time?"
                  - "The thousands digit goes 2, 3, 4. The 500 stays."
                  - "Next is 5500."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Count in 25s."
                frame: "25, 50, 75, _, _"
                options: ["80", "100", "125", "150"]
                answer: ["100", "125"]
                hints:
                  - "Four 25s make 100."
                  - "75 + 25 = 100, then add 25 again."
                  - "100 and 125."
              - id: l1-f3
                type: multiple_choice
                text: "Count back in 1000s: 7300, 6300, 5300, _"
                options: ["4300", "5200", "4200"]
                answer: "4300"
                hints:
                  - "Only the thousands digit changes."
                  - "It goes 7, 6, 5 and then one less."
                  - "Next is 4300."
              - id: l1-f4
                type: multiple_choice
                text: "Count on in 1000s: 7000, 8000, 9000, _"
                options: ["10,000", "1000", "9100"]
                answer: "10,000"
                feedback:
                  "1000": "Nine thousand and one more thousand make ten thousand: 10,000, not 1000."
                hints:
                  - "What is 9000 + 1000?"
                  - "Ten lots of 1000 make a number with five digits."
                  - "Next is 10,000."
              - id: l1-f5
                type: point_on_line
                text: "Start at 3000. Count on 4 thousands. Tap where you land."
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
                answer: 7000
                hints:
                  - "Find 3000 first."
                  - "Count 4 jumps of 1000: 4000, 5000, 6000, 7000."
                  - "Tap 7000."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Count in 25s."
                frame: "150, 175, _, _"
                options: ["180", "200", "225", "250"]
                answer: ["200", "225"]
                hints: ["175 + 25 = 200."]
              - id: l1-s2
                type: multiple_choice
                text: "Count back in 25s: 300, 275, 250, _"
                options: ["225", "240", "200"]
                answer: "225"
                hints: ["Each step is 25 less."]
              - id: l1-s3
                type: fill_in_blank
                text: "Count on in 1000s."
                frame: "6750, 7750, _, _"
                options: ["7850", "8750", "9750", "8850"]
                answer: ["8750", "9750"]
                hints: ["The 750 stays the same."]
              - id: l1-s4
                type: true_false
                text: "Counting on in 1000s from 4321, the next number is 5321."
                say: "Is it true? Counting on in thousands from four thousand three hundred and twenty-one, the next number is five thousand three hundred and twenty-one."
                answer: true
                hints: ["Only the thousands digit changes."]
              - id: l1-s5
                type: text_input
                text: "Count in 25s from 0. How many steps does it take to reach 200?"
                answer: "8"
                hints: ["4 steps make 100."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Count on in 1000s: 5040, 6040, 7040, _"
                answer: "8040"
              - id: l1-n2
                type: text_input
                text: "Count back in 25s: 500, 475, 450, _"
                answer: "425"
              - id: l1-n3
                type: multiple_choice
                text: "Which number is in the sequence 0, 25, 50, 75 ...?"
                options: ["350", "360", "330"]
                answer: "350"
              - id: l1-n4
                type: true_false
                text: "9500 + 1000 = 10,500"
                say: "Is it true? Nine thousand five hundred plus one thousand is ten thousand five hundred."
                answer: true
              - id: l1-n5
                type: text_input
                text: "A school collects bottle tops. It has 2600 and collects 1000 more each week. How many does it have after 3 weeks?"
                answer: "5600"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Count on in 1000s: 1900, 2900, 3900, _"
            options: ["4900", "4000", "5900"]
            answer: "4900"
          - id: l1-c2
            type: fill_in_blank
            text: "Count in 25s."
            frame: "400, 425, _, _"
            options: ["430", "450", "475", "500"]
            answer: ["450", "475"]
          - id: l1-c3
            type: multiple_choice
            text: "Count back in 1000s: 10,000, 9000, 8000, _"
            options: ["7000", "7900", "6000"]
            answer: "7000"
          - id: l1-c4
            type: text_input
            text: "Count back in 1000s: 9150, 8150, 7150, _"
            answer: "6150"
          - id: l1-c5
            type: multiple_choice
            text: "Count back in 25s: 125, 100, 75, _"
            options: ["50", "25", "70"]
            answer: "50"
          - id: l1-c6
            type: true_false
            text: "Counting on in 1000s from 9200, the next number is 9300."
            say: "Is it true? Counting on in thousands from nine thousand two hundred, the next number is nine thousand three hundred."
            answer: false

  - n: 2
    title: { de: In großen Schritten bis zur Million, en: Big steps to a million }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Count on in 1000s: 4200, 5200, _"
            options: ["6200", "5300", "6000"]
            answer: "6200"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Count in 25s: 75, 100, _"
            options: ["125", "150", "110"]
            answer: "125"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Count in 10,000s: 10,000, 20,000, 30,000 ... 100,000"
            say: "Now take bigger steps. Count in ten thousands: ten thousand, twenty thousand, thirty thousand. Ten steps take you to one hundred thousand."
            show: { drawn: number-line, from: 0, to: 100000, step: 10000, labels: ends, jumps: [[0, 10000], [10000, 10000], [20000, 10000]] }
          - text: "Count in 100,000s: 100,000, 200,000 ... 1,000,000"
            say: "Count in hundred thousands: one hundred thousand, two hundred thousand, up to nine hundred thousand. Ten hundred thousands make one million."
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, jumps: [[700000, 100000], [800000, 100000], [900000, 100000]] }
          - text: "From any number: 34,500, 44,500, 54,500"
            say: "You can start anywhere. Thirty-four thousand five hundred, forty-four thousand five hundred, fifty-four thousand five hundred. Only the ten thousands digit changes."
            show: { drawn: place-value-chart, columns: [ten-thousands, thousands, hundreds, tens, ones], values: [3, 4, 5, 0, 0] }
          - text: "The rule: 250,000, 300,000, 350,000 goes up by 50,000 each time."
            say: "To find the rule of a sequence, look at the difference between two numbers next to each other. From two hundred and fifty thousand to three hundred thousand is fifty thousand. Check the next step: also fifty thousand. The rule is add fifty thousand."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Count on in 10,000s: 20,000, 30,000, 40,000, _"
                options: ["50,000", "41,000", "40,100"]
                answer: "50,000"
                feedback:
                  "41,000": "That is 1000 more. A step of 10,000 changes the ten thousands digit."
                hints:
                  - "Which digit changes each time?"
                  - "The ten thousands digit goes 2, 3, 4."
                  - "Next is 50,000."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Count on in 100,000s."
                frame: "300,000, 400,000, _, _"
                options: ["410,000", "500,000", "600,000", "700,000"]
                answer: ["500,000", "600,000"]
                hints:
                  - "Each step is one hundred thousand."
                  - "3, 4, then 5 and 6 hundred thousands."
                  - "500,000 and 600,000."
              - id: l2-f3
                type: multiple_choice
                text: "Count on in 100,000s: 700,000, 800,000, 900,000, _"
                options: ["1,000,000", "910,000", "990,000"]
                answer: "1,000,000"
                hints:
                  - "What do ten hundred thousands make?"
                  - "900,000 + 100,000 needs a new column."
                  - "Next is 1,000,000, one million."
              - id: l2-f4
                type: multiple_choice
                text: "What is the rule? 15,000, 25,000, 35,000, 45,000"
                options: ["+10,000", "+1000", "+5000"]
                answer: "+10,000"
                option_audio: false
                feedback:
                  "+1000": "15,000 + 1000 is 16,000. Look at which digit changes: the ten thousands."
                hints:
                  - "Find the difference between 15,000 and 25,000."
                  - "The ten thousands digit goes up by one each time."
                  - "The rule is +10,000."
              - id: l2-f5
                type: multiple_choice
                text: "Count back in 10,000s: 63,200, 53,200, 43,200, _"
                options: ["33,200", "42,200", "23,200"]
                answer: "33,200"
                hints:
                  - "Only the ten thousands digit changes."
                  - "It goes 6, 5, 4, then one less."
                  - "Next is 33,200."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Count on in 10,000s."
                frame: "77,000, 87,000, 97,000, _"
                options: ["98,000", "107,000", "170,000"]
                answer: ["107,000"]
                hints: ["97,000 + 10,000 crosses 100,000."]
              - id: l2-s2
                type: multiple_choice
                text: "Count back in 100,000s: 1,000,000, 900,000, 800,000, _"
                options: ["700,000", "790,000", "600,000"]
                answer: "700,000"
                hints: ["Each step is one hundred thousand less."]
              - id: l2-s3
                type: multiple_choice
                text: "What is the rule? 250,000, 300,000, 350,000, 400,000"
                options: ["+50,000", "+5000", "+100,000"]
                answer: "+50,000"
                option_audio: false
                hints: ["What do you add to 250,000 to get 300,000?"]
              - id: l2-s4
                type: true_false
                text: "Counting on in 100,000s from 450,000, the next number is 460,000."
                say: "Is it true? Counting on in hundred thousands from four hundred and fifty thousand, the next number is four hundred and sixty thousand."
                answer: false
                hints: ["Which digit changes in a step of 100,000?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which number does not fit? 120,000, 130,000, 140,000, 145,000, 160,000"
                options: ["130,000", "145,000", "160,000"]
                answer: "145,000"
                hints: ["Find the rule from the first numbers, then check each step."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Count on in 10,000s: 6000, 16,000, 26,000, _"
                answer: "36000"
              - id: l2-n2
                type: text_input
                text: "Count back in 100,000s: 640,000, 540,000, 440,000, _"
                answer: "340000"
              - id: l2-n3
                type: multiple_choice
                text: "What is the rule? 975,000, 950,000, 925,000, 900,000"
                options: ["−25,000", "−2500", "+25,000"]
                answer: "−25,000"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "1,000,000 is ten lots of 100,000."
                say: "Is it true? One million is ten lots of one hundred thousand."
                answer: true
              - id: l2-n5
                type: text_input
                text: "A town has 92,000 people. The number grows by 10,000 twice. How many people live there now?"
                answer: "112000"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: thousands-25s
            type: multiple_choice
            text: "Count on in 1000s: 8600, 9600, _"
            options: ["10,600", "9700", "10,000"]
            answer: "10,600"
          - id: l2-c2
            part: thousands-25s
            type: fill_in_blank
            text: "Count back in 25s."
            frame: "650, 625, _, _"
            options: ["550", "575", "600", "615"]
            answer: ["600", "575"]
          - id: l2-c3
            part: big-steps
            type: multiple_choice
            text: "Count on in 100,000s: 600,000, 700,000, 800,000, _"
            options: ["900,000", "810,000", "1,000,000"]
            answer: "900,000"
          - id: l2-c4
            part: rule
            type: multiple_choice
            text: "What is the rule? 41,000, 51,000, 61,000, 71,000"
            options: ["+10,000", "+1000", "+100,000"]
            answer: "+10,000"
            option_audio: false
          - id: l2-c5
            part: big-steps
            type: text_input
            text: "Count on in 10,000s: 970,000, 980,000, 990,000, _"
            answer: "1000000"
          - id: l2-c6
            part: thousands-25s
            type: fill_in_blank
            text: "Count on in 1000s."
            frame: "3480, 4480, _, _"
            options: ["5480", "6480", "4580", "5580"]
            answer: ["5480", "6480"]
          - id: l2-c7
            part: thousands-25s
            type: text_input
            text: "What is 1000 less than 6025?"
            answer: "5025"
          - id: l2-c8
            part: thousands-25s
            type: multiple_choice
            text: "Count in 25s: 225, 250, 275, _"
            options: ["300", "280", "325"]
            answer: "300"
          - id: l2-c9
            part: thousands-25s
            type: true_false
            text: "Counting back in 1000s from 10,400, the next number is 9400."
            say: "Is it true? Counting back in thousands from ten thousand four hundred, the next number is nine thousand four hundred."
            answer: true
          - id: l2-c10
            part: thousands-25s
            type: point_on_line
            text: "Start at 8000. Count back 5 thousands. Tap where you land."
            show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
            answer: 3000
          - id: l2-c11
            part: big-steps
            type: fill_in_blank
            text: "Count on in 10,000s."
            frame: "45,300, 55,300, _, _"
            options: ["65,300", "75,300", "56,300", "66,300"]
            answer: ["65,300", "75,300"]
          - id: l2-c12
            part: big-steps
            type: multiple_choice
            text: "Count back in 100,000s: 830,000, 730,000, 630,000, _"
            options: ["530,000", "620,000", "430,000"]
            answer: "530,000"
          - id: l2-c13
            part: big-steps
            type: text_input
            text: "Count on in 10,000s: 85,000, 95,000, _"
            answer: "105000"
          - id: l2-c14
            part: big-steps
            type: true_false
            text: "Counting back in 10,000s from 100,000, the next number is 99,000."
            say: "Is it true? Counting back in ten thousands from one hundred thousand, the next number is ninety-nine thousand."
            answer: false
          - id: l2-c15
            part: big-steps
            type: point_on_line
            text: "Start at 200,000. Count on 3 hundred thousands. Tap where you land."
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends }
            answer: 500000
          - id: l2-c16
            part: rule
            type: multiple_choice
            text: "What is the rule? 4750, 4775, 4800, 4825"
            options: ["+25", "+250", "+50"]
            answer: "+25"
            option_audio: false
          - id: l2-c17
            part: rule
            type: multiple_choice
            text: "What is the rule? 86,000, 76,000, 66,000, 56,000"
            options: ["−10,000", "−1000", "+10,000"]
            answer: "−10,000"
            option_audio: false
          - id: l2-c18
            part: rule
            type: multiple_choice
            text: "Which number does not fit? 3200, 4200, 5200, 6300, 7200"
            options: ["4200", "6300", "7200"]
            answer: "6300"
          - id: l2-c19
            part: rule
            type: true_false
            text: "The rule of 600,000, 500,000, 400,000 is −100,000."
            say: "Is it true? The rule of six hundred thousand, five hundred thousand, four hundred thousand is take away one hundred thousand."
            answer: true
          - id: l2-c20
            part: rule
            type: fill_in_blank
            text: "The rule is +25,000. Continue the sequence."
            say: "The rule is add twenty-five thousand. Continue the sequence."
            frame: "50,000, 75,000, _, _"
            options: ["100,000", "125,000", "80,000", "150,000"]
            answer: ["100,000", "125,000"]
