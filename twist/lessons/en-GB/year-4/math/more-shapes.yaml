# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.more-shapes
skill: math.shapes.more-shapes
curriculum: en-GB
language: en
title:
  de: Sechseck, Achteck, Parallelogramm
  en: Hexagons, octagons and parallelograms
summary: >
  Lesson 1 names polygons by their sides and vertices (pentagon, hexagon,
  octagon), learns that a polygon has as many vertices as sides, and finds
  them in things around us (a stop sign, a honeycomb). Lesson 2 sorts
  quadrilaterals: square, rectangle, parallelogram and trapezium, using
  the terms parallel and right angle, and ends with the skill check. Every
  shape is shown with the shape component; classifying triangles waits for
  a component that draws isosceles and scalene triangles.
metadata:
  year: year-4
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.properties]
  also_practises: [math.shapes.properties]
  vocabulary: { en: [polygon, pentagon, hexagon, octagon, quadrilateral, parallelogram, trapezium, parallel, right angle, side, vertex, vertices] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: polygons, what: { de: "Fünfeck, Sechseck und Achteck erkennen und benennen", en: "naming pentagons, hexagons and octagons" } }
    - { id: sides-vertices, what: { de: Seiten und Ecken zählen, en: counting sides and vertices } }
    - { id: quadrilaterals, what: { de: Vierecke erkennen und benennen, en: recognising and naming quadrilaterals } }
    - { id: parallel, what: { de: parallele Seiten und rechte Winkel, en: parallel sides and right angles } }
  misconceptions:
    - id: name-by-look
      what: Names a shape by how round it looks (calls an octagon a circle) instead of counting sides, or thinks sides and vertices can differ in number
      addressed: lesson 1 Learn names each polygon by its sides; l1-f4 has feedback on calling the stop sign a circle, l1-f5 claims a pentagon has 6 sides, l1-s4 calls a hexagon an octagon, l2-c2 asks about a shape that looks round
    - id: slanted-not-quadrilateral
      what: Thinks only squares and rectangles are quadrilaterals, so a slanted parallelogram or a trapezium is not one
      addressed: lesson 2 Learn pushes a rectangle over into a parallelogram and calls all four shapes quadrilaterals; l2-f2 has feedback on the pentagon, l2-s5 sorts quadrilaterals, l2-n2 and l2-c5 ask about the parallelogram's sides
    - id: parallel-meaning
      what: Thinks parallel means the same length, or that any two sides of a shape are parallel
      addressed: lesson 2 Learn compares parallel lines with railway tracks; l2-f4 has feedback on the trapezium, l2-f5 asks what parallel means, l2-s3 and l2-c4 ask how many pairs of parallel sides
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Fünfeck, Sechseck, Achteck", en: "Pentagons, hexagons and octagons" }
    goal:
      de: "Benenne Formen, indem du ihre Seiten zählst, so wie ein Stoppschild mit 8 Seiten ein Achteck ist."
      en: "Name shapes by counting their sides, like a stop sign with 8 sides is an octagon."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many sides does this shape have?"
            show: { drawn: shape, kind: triangle, colour: blue }
            options: ["3", "4", "5"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "A square has four sides of the same length."
            say: "Is it true? A square has four sides of the same length."
            show: { drawn: shape, kind: square, colour: yellow }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "hexagon: 6 sides, 6 vertices"
            say: "This is a hexagon. It has six straight sides and six corners. In maths a corner is called a vertex, and more than one are vertices. The cells in a honeycomb are hexagons."
            show: { drawn: shape, kind: hexagon, colour: yellow }
          - text: "pentagon: 5 sides, 5 vertices"
            say: "A shape with straight sides is a polygon. You name a polygon by counting its sides. This one has five sides, so it is a pentagon."
            show: { drawn: shape, kind: pentagon, colour: green }
          - text: "octagon: 8 sides, 8 vertices"
            say: "This is an octagon. It has eight sides. A stop sign is an octagon. It looks almost round, but it has eight straight sides."
            show: { drawn: shape, kind: octagon, colour: red }
          - text: "sides = vertices"
            say: "Count the sides and the vertices of any polygon: there are always the same number. A triangle has three of each, a hexagon has six of each."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is this shape called?"
                show: { drawn: shape, kind: hexagon, colour: green }
                options: ["hexagon", "octagon", "pentagon"]
                answer: "hexagon"
                hints:
                  - "Count the sides."
                  - "There are 6 sides."
                  - "A shape with 6 sides is a hexagon."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many vertices does an octagon have?"
                options: ["8", "6", "4"]
                answer: "8"
                hints:
                  - "Sides and vertices come in the same number."
                  - "An octagon has 8 sides."
                  - "So it has 8 vertices."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which shape is a hexagon?"
                options:
                  - { drawn: shape, kind: hexagon, colour: red }
                  - { drawn: shape, kind: pentagon, colour: red }
                  - { drawn: shape, kind: rectangle, colour: red }
                answer: hexagon
                option_audio: false
                hints:
                  - "A hexagon has 6 sides."
                  - "Count the sides of each shape."
                  - "It is the shape with 6 sides."
              - id: l1-f4
                type: multiple_choice
                text: "A stop sign has 8 straight sides. What shape is it?"
                show: { drawn: shape, kind: octagon, colour: red }
                options: ["octagon", "hexagon", "circle"]
                answer: "octagon"
                feedback:
                  "circle": "A stop sign looks almost round, but it has 8 straight sides. A circle has no straight sides."
                hints:
                  - "Count the straight sides, not how round it looks."
                  - "There are 8 sides."
                  - "A shape with 8 sides is an octagon."
              - id: l1-f5
                type: true_false
                text: "A pentagon has 5 vertices and 6 sides."
                say: "Is it true? A pentagon has five vertices and six sides."
                answer: false
                hints:
                  - "Sides and vertices come in the same number."
                  - "5 vertices means 5 sides."
                  - "No. A pentagon has 5 vertices and 5 sides."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many sides does a hexagon have?"
                options: ["6", "5", "8"]
                answer: "6"
                hints: ["The cells in a honeycomb are hexagons. Count their sides."]
              - id: l1-s2
                type: matching
                text: "Match each shape to its number of sides."
                pairs:
                  - { left: { drawn: shape, kind: triangle, colour: blue }, right: { text: "3 sides" } }
                  - { left: { drawn: shape, kind: pentagon, colour: blue }, right: { text: "5 sides" } }
                  - { left: { drawn: shape, kind: hexagon, colour: blue }, right: { text: "6 sides" } }
                  - { left: { drawn: shape, kind: octagon, colour: blue }, right: { text: "8 sides" } }
                hints: ["Count the sides of each shape."]
              - id: l1-s3
                type: multiple_choice
                text: "What is this shape called?"
                show: { drawn: shape, kind: pentagon, colour: orange }
                options: ["pentagon", "hexagon", "quadrilateral"]
                answer: "pentagon"
                hints: ["Count the sides: 5 sides is a pentagon."]
              - id: l1-s4
                type: true_false
                text: "This shape is an octagon."
                say: "Is it true? This shape is an octagon."
                show: { drawn: shape, kind: hexagon, colour: red }
                answer: false
                hints: ["An octagon has 8 sides. Count these."]
              - id: l1-s5
                type: multiple_choice
                text: "Which shape has the most vertices?"
                options: ["octagon", "hexagon", "pentagon"]
                answer: "octagon"
                hints: ["Pentagon 5, hexagon 6, octagon 8."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "A polygon has 8 sides. What is it called?"
                options: ["octagon", "hexagon", "quadrilateral"]
                answer: "octagon"
              - id: l1-n2
                type: image_multiple_choice
                text: "Which shape has 6 vertices?"
                options:
                  - { drawn: shape, kind: hexagon, colour: yellow }
                  - { drawn: shape, kind: pentagon, colour: yellow }
                  - { drawn: shape, kind: octagon, colour: yellow }
                answer: hexagon
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "A quadrilateral has 4 sides and 4 vertices."
                say: "Is it true? A quadrilateral has four sides and four vertices."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Each cell in a honeycomb has 6 sides. What shape is it?"
                options: ["hexagon", "octagon", "pentagon"]
                answer: "hexagon"
              - id: l1-n5
                type: text_input
                text: "How many vertices do a triangle and an octagon have altogether?"
                answer: "11"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is this shape called?"
            show: { drawn: shape, kind: octagon, colour: blue }
            options: ["hexagon", "pentagon", "octagon"]
            answer: "octagon"
          - id: l1-c2
            type: multiple_choice
            text: "How many vertices does a pentagon have?"
            options: ["5", "4", "6"]
            answer: "5"
          - id: l1-c3
            type: true_false
            text: "An octagon has 8 sides."
            say: "Is it true? An octagon has eight sides."
            answer: true
          - id: l1-c4
            type: image_multiple_choice
            text: "Which shape has 5 sides?"
            options:
              - { drawn: shape, kind: pentagon, colour: green }
              - { drawn: shape, kind: hexagon, colour: green }
              - { drawn: shape, kind: square, colour: green }
            answer: pentagon
            option_audio: false
          - id: l1-c5
            type: text_input
            text: "How many vertices do two hexagons have altogether?"
            answer: "12"
          - id: l1-c6
            type: true_false
            text: "This shape has 6 vertices."
            say: "Is it true? This shape has six vertices."
            show: { drawn: shape, kind: octagon, colour: yellow }
            answer: false

  - n: 2
    title: { de: "Vierecke und das Parallelogramm", en: "Quadrilaterals and the parallelogram" }
    goal:
      de: "Sortiere Vierecke in Quadrate, Rechtecke, Parallelogramme und Trapeze, mit Hilfe von parallelen Seiten und rechten Winkeln."
      en: "Sort four-sided shapes into squares, rectangles, parallelograms and trapeziums, using parallel sides and right angles."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many vertices does a hexagon have?"
            options: ["6", "8", "5"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which polygon has 5 sides?"
            options: ["pentagon", "hexagon", "octagon"]
            answer: "pentagon"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "quadrilateral: 4 sides, 4 vertices"
            say: "Every polygon with four sides is a quadrilateral. You know the rectangle: opposite sides are the same length, and all four angles are right angles."
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "parallel: always the same distance apart, never meet"
            say: "Push the top of a rectangle to one side and it leans over. Now it is a parallelogram. Its opposite sides are still the same length, and they are parallel. Parallel lines are like railway tracks: always the same distance apart, so they never meet. The angles are not right angles any more."
            show: { drawn: shape, kind: parallelogram, colour: blue }
          - text: "trapezium: one pair of parallel sides"
            say: "This is a trapezium. Only its top and bottom sides are parallel. The other two sides lean towards each other."
            show: { drawn: shape, kind: trapezoid, colour: blue }
          - text: "square, rectangle, parallelogram, trapezium: all quadrilaterals"
            say: "A square has four equal sides and four right angles. A rectangle has four right angles. A parallelogram has two pairs of parallel sides. A trapezium has one pair. All four have four sides, so all four are quadrilaterals."
            show: { drawn: shape, row: [square, rectangle, parallelogram, trapezoid], colours: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many vertices does a parallelogram have?"
                options: ["4", "6", "3"]
                answer: "4"
                hints:
                  - "A parallelogram is a rectangle pushed over."
                  - "Pushing it over does not add any sides."
                  - "It has 4 vertices."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which shape is a quadrilateral?"
                options:
                  - { drawn: shape, kind: parallelogram, colour: green }
                  - { drawn: shape, kind: pentagon, colour: green }
                  - { drawn: shape, kind: triangle, colour: green }
                answer: parallelogram
                option_audio: false
                feedback:
                  "pentagon": "That is a pentagon with 5 sides. A quadrilateral has 4 sides."
                hints:
                  - "A quadrilateral has 4 sides."
                  - "A shape that leans over can still have 4 sides."
                  - "It is the parallelogram, the shape that leans."
              - id: l2-f3
                type: multiple_choice
                text: "A quadrilateral has 4 equal sides and 4 right angles. What is its most exact name?"
                options: ["square", "parallelogram", "hexagon"]
                answer: "square"
                feedback:
                  "parallelogram": "A square is a special parallelogram, but with 4 equal sides and 4 right angles the most exact name is square."
                hints:
                  - "All the sides are equal."
                  - "The angles are right angles, so it does not lean."
                  - "It is a square."
              - id: l2-f4
                type: image_multiple_choice
                text: "Which shape has only one pair of parallel sides?"
                options:
                  - { drawn: shape, kind: trapezoid, colour: orange }
                  - { drawn: shape, kind: parallelogram, colour: orange }
                  - { drawn: shape, kind: rectangle, colour: orange }
                answer: trapezoid
                option_audio: false
                feedback:
                  "parallelogram": "A parallelogram has two pairs of parallel sides: top and bottom, and left and right."
                hints:
                  - "Parallel sides never meet, however long you make them."
                  - "In one shape the left and right sides lean towards each other."
                  - "It is the trapezium."
              - id: l2-f5
                type: multiple_choice
                text: "What does parallel mean?"
                options: ["The lines stay the same distance apart and never meet.", "The lines meet at a vertex.", "The lines are the same length."]
                answer: "The lines stay the same distance apart and never meet."
                feedback:
                  "The lines are the same length.": "Parallel lines can have different lengths. What matters is that they never meet."
                hints:
                  - "Think of railway tracks."
                  - "The two rails are always the same distance apart."
                  - "Parallel lines stay the same distance apart and never meet."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Match each shape to its name."
                pairs:
                  - { left: { drawn: shape, kind: square, colour: green }, right: { text: "square" } }
                  - { left: { drawn: shape, kind: rectangle, colour: green }, right: { text: "rectangle" } }
                  - { left: { drawn: shape, kind: parallelogram, colour: green }, right: { text: "parallelogram" } }
                  - { left: { drawn: shape, kind: trapezoid, colour: green }, right: { text: "trapezium" } }
                  - { left: { drawn: shape, kind: hexagon, colour: green }, right: { text: "hexagon" } }
                option_audio: false
                hints: ["Count the sides first. Then look for right angles and parallel sides."]
              - id: l2-s2
                type: true_false
                text: "Every square is a quadrilateral."
                say: "Is it true? Every square is a quadrilateral."
                answer: true
                hints: ["How many sides does a square have?"]
              - id: l2-s3
                type: multiple_choice
                text: "How many pairs of parallel sides does this shape have?"
                show: { drawn: shape, kind: parallelogram, colour: orange }
                options: ["2", "1", "0"]
                answer: "2"
                hints: ["Look at top and bottom, then left and right."]
              - id: l2-s4
                type: multiple_choice
                text: "How many right angles does a rectangle have?"
                show: { drawn: shape, kind: rectangle, colour: yellow }
                options: ["4", "2", "0"]
                answer: "4"
                hints: ["Look at each vertex in turn."]
              - id: l2-s5
                type: sorting
                text: "Quadrilateral or not?"
                say: "Sort the names: quadrilateral or not a quadrilateral?"
                bins:
                  - { id: quad, show: { text: "quadrilateral" }, say: "Quadrilateral." }
                  - { id: not, show: { text: "not a quadrilateral" }, say: "Not a quadrilateral." }
                options:
                  - { text: "square", bin: quad }
                  - { text: "parallelogram", bin: quad }
                  - { text: "trapezium", bin: quad }
                  - { text: "hexagon", bin: not }
                  - { text: "triangle", bin: not }
                  - { text: "octagon", bin: not }
                hints: ["A quadrilateral has 4 sides, even if it leans."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which shape has 6 vertices?"
                options: ["hexagon", "parallelogram", "pentagon"]
                answer: "hexagon"
              - id: l2-n2
                type: true_false
                text: "A parallelogram has 5 sides."
                say: "Is it true? A parallelogram has five sides."
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Which quadrilateral always has 4 equal sides?"
                options: ["square", "rectangle", "trapezium"]
                answer: "square"
              - id: l2-n4
                type: multiple_choice
                text: "What do we call the point where two sides of a shape meet?"
                options: ["vertex", "side", "centre"]
                answer: "vertex"
              - id: l2-n5
                type: text_input
                text: "How many vertices do a trapezium and a hexagon have altogether?"
                answer: "10"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: sides-vertices
            type: multiple_choice
            text: "How many sides does this shape have?"
            show: { drawn: shape, kind: hexagon, colour: orange }
            options: ["6", "5", "8"]
            answer: "6"
          - id: l2-c2
            part: polygons
            type: multiple_choice
            text: "A shape looks almost round, but it has 8 vertices. What is it called?"
            options: ["octagon", "circle", "hexagon"]
            answer: "octagon"
          - id: l2-c3
            part: quadrilaterals
            type: multiple_choice
            text: "A quadrilateral leans over. Both pairs of opposite sides are parallel. What is it called?"
            show: { drawn: shape, kind: parallelogram, colour: green }
            options: ["parallelogram", "trapezium", "hexagon"]
            answer: "parallelogram"
          - id: l2-c4
            part: parallel
            type: multiple_choice
            text: "How many pairs of parallel sides does a trapezium have?"
            show: { drawn: shape, kind: trapezoid, colour: purple }
            options: ["1", "2", "4"]
            answer: "1"
          - id: l2-c5
            part: quadrilaterals
            type: image_multiple_choice
            text: "Which quadrilateral has 4 equal sides?"
            options:
              - { drawn: shape, kind: square, colour: purple }
              - { drawn: shape, kind: rectangle, colour: purple }
              - { drawn: shape, kind: parallelogram, colour: purple }
            answer: square
            option_audio: false
          - id: l2-c6
            part: polygons
            type: image_multiple_choice
            text: "Which shape is an octagon?"
            options:
              - { drawn: shape, kind: octagon, colour: blue }
              - { drawn: shape, kind: hexagon, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
            answer: octagon
            option_audio: false
          - id: l2-c7
            part: polygons
            type: true_false
            text: "This shape is a pentagon."
            say: "Is it true? This shape is a pentagon."
            show: { drawn: shape, kind: pentagon, colour: purple }
            answer: true
          - id: l2-c8
            part: polygons
            type: multiple_choice
            text: "What do we call any flat shape with straight sides?"
            options: ["polygon", "circle", "vertex"]
            answer: "polygon"
          - id: l2-c9
            part: polygons
            type: matching
            text: "Match each name to its number of vertices."
            pairs:
              - { left: { text: "pentagon" }, right: { text: "5 vertices" } }
              - { left: { text: "hexagon" }, right: { text: "6 vertices" } }
              - { left: { text: "octagon" }, right: { text: "8 vertices" } }
          - id: l2-c10
            part: sides-vertices
            type: text_input
            text: "How many more vertices does an octagon have than a pentagon?"
            answer: "3"
          - id: l2-c11
            part: sides-vertices
            type: true_false
            text: "A triangle and a square have 8 vertices altogether."
            say: "Is it true? A triangle and a square have eight vertices altogether."
            answer: false
          - id: l2-c12
            part: sides-vertices
            type: text_input
            text: "How many vertices does this shape have?"
            show: { drawn: shape, kind: octagon, colour: green }
            answer: "8"
          - id: l2-c13
            part: sides-vertices
            type: multiple_choice
            text: "A polygon has 7 vertices. How many sides does it have?"
            options: ["7", "6", "14"]
            answer: "7"
          - id: l2-c14
            part: quadrilaterals
            type: true_false
            text: "This shape is a quadrilateral."
            say: "Is it true? This shape is a quadrilateral."
            show: { drawn: shape, kind: trapezoid, colour: orange }
            answer: true
          - id: l2-c15
            part: quadrilaterals
            type: multiple_choice
            text: "A quadrilateral has 4 right angles. Its opposite sides are the same length, but its 4 sides are not all equal. What is it?"
            options: ["rectangle", "square", "trapezium"]
            answer: "rectangle"
          - id: l2-c16
            part: quadrilaterals
            type: image_multiple_choice
            text: "Which shape is not a quadrilateral?"
            options:
              - { drawn: shape, kind: trapezoid, colour: yellow }
              - { drawn: shape, kind: parallelogram, colour: yellow }
              - { drawn: shape, kind: pentagon, colour: yellow }
            answer: pentagon
            option_audio: false
          - id: l2-c17
            part: parallel
            type: true_false
            text: "The opposite sides of a parallelogram are parallel."
            say: "Is it true? The opposite sides of a parallelogram are parallel."
            show: { drawn: shape, kind: parallelogram, colour: red }
            answer: true
          - id: l2-c18
            part: parallel
            type: multiple_choice
            text: "Which shape has 4 right angles?"
            options: ["rectangle", "parallelogram", "trapezium"]
            answer: "rectangle"
          - id: l2-c19
            part: parallel
            type: image_multiple_choice
            text: "Which shape has no parallel sides?"
            options:
              - { drawn: shape, kind: triangle, colour: green }
              - { drawn: shape, kind: rectangle, colour: green }
              - { drawn: shape, kind: parallelogram, colour: green }
            answer: triangle
            option_audio: false
          - id: l2-c20
            part: parallel
            type: multiple_choice
            text: "Which sentence about a rectangle is true?"
            options: ["It has 2 pairs of parallel sides.", "It has 1 pair of parallel sides.", "It has no right angles."]
            answer: "It has 2 pairs of parallel sides."
