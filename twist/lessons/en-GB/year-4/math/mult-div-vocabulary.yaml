# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.mult-div-vocabulary
skill: math.mult-div.vocabulary
curriculum: en-GB
language: en
title:
  de: Fachwörter beim Malnehmen und Teilen
  en: Words for multiplying and dividing
summary: >
  The words of multiplying and dividing. Lesson 1 reads × as "times"
  or "multiplied by", names the product as the answer to a
  multiplication and works out "the product of 6 and 7"; lesson 2 reads
  ÷ as "divided by", names the quotient as the answer to a division,
  keeps the numbers in order ("the quotient of 20 and 4" is 20 ÷ 4),
  sorts the words to the right operation, and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Geteiltaufgaben, en: Division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-facts]
  also_practises: [math.mult-div.all-tables, math.mult-div.div-facts]
  vocabulary: { en: [times, multiply, multiplied by, product, divide, divided by, quotient, sum, difference] }
  forms: [text, audio]
  drawn: []
  facets: [operation-signs]
  misconceptions:
    - id: product-is-sum
      what: Takes the product to be the sum (the product of 6 and 7 is 13)
      addressed: lesson 1 Learn ties product to times; l1-f2, l1-s2, l1-n2 and l2-c1 offer the sum, with feedback in l1-f2; l1-n4 claims the sum is the product
    - id: quotient-product-swap
      what: Mixes up product and quotient
      addressed: lesson 2 Learn sets them side by side; the sorting and matching tasks in every stage of lesson 2 (l2-f3, l2-s3, l2-n3) have both words, and l2-f4 (with feedback) and l2-n4 name the wrong one
    - id: quotient-order
      what: Divides the second number by the first (the quotient of 20 and 4 written as 4 ÷ 20)
      addressed: lesson 2 Learn says the first number is divided by the second; l2-f1 (with feedback), l2-s1 and l2-n1 offer the numbers the wrong way round
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mal und Produkt", en: "Times and product" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "42 ÷ 6 = _"
            say: "Forty-two divided by six."
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "8 × 4 = _"
            say: "Eight times four."
            answer: "32"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "6 × 7: six times seven, six multiplied by seven"
            say: "We read the times sign as times or multiplied by. Six times seven and six multiplied by seven mean the same thing."
          - text: "6 × 7 = 42. 42 is the product."
            say: "The answer to a multiplication is called the product. Forty-two is the product of six and seven."
          - text: "The product of 6 and 7 is 6 × 7 = 42, not 6 + 7"
            say: "When you see the word product, multiply. The product of six and seven is forty-two. Thirteen would be their sum, which you get by adding."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is the answer to a multiplication called?"
                options: ["the product", "the sum", "the difference"]
                answer: "the product"
                hints:
                  - "Sum is the word for adding. Difference is the word for subtracting."
                  - "Which word goes with times?"
                  - "The product."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is the product of 5 and 8?"
                options: ["13", "40", "3"]
                answer: "40"
                feedback:
                  "13": "13 is the sum of 5 and 8. The product means times: 5 × 8."
                  "3": "3 is the difference. The product means times: 5 × 8."
                hints:
                  - "Product means the answer to a multiplication."
                  - "Work out 5 × 8."
                  - "5 × 8 = 40."
              - id: l1-f3
                type: multiple_choice
                text: "Which calculation says \"9 multiplied by 3\"?"
                options: ["9 × 3", "9 + 3", "9 ÷ 3"]
                answer: "9 × 3"
                hints:
                  - "Multiplied by is another way to say times."
                  - "Which sign means times?"
                  - "9 × 3."
              - id: l1-f4
                type: true_false
                text: "Is it true? In 4 × 9 = 36, the product is 36."
                answer: true
                hints:
                  - "The product is the answer to a multiplication."
                  - "What is the answer to 4 × 9?"
                  - "Yes. 36 is the product."
              - id: l1-f5
                type: text_input
                text: "The product of two numbers is 24. One number is 6. What is the other?"
                answer: "4"
                hints:
                  - "Something times 6 makes 24."
                  - "How many sixes make 24?"
                  - "4 × 6 = 24, so 4."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "In 7 × 3 = 21, what is 21?"
                options: ["the product", "the sum", "the quotient"]
                answer: "the product"
                hints: ["21 is the answer to a multiplication."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the product of 9 and 4?"
                options: ["13", "36", "5"]
                answer: "36"
                hints: ["Product means times."]
              - id: l1-s3
                type: multiple_choice
                text: "How do you say 8 × 6?"
                options: ["eight multiplied by six", "eight divided by six", "eight add six"]
                answer: "eight multiplied by six"
                hints: ["The sign × means times."]
              - id: l1-s4
                type: true_false
                text: "Is it true? The product of 3 and 10 is 13."
                answer: false
                hints: ["Product means times, not add."]
              - id: l1-s5
                type: text_input
                text: "Find the product of 7 and 7."
                answer: "49"
                hints: ["Work out 7 × 7."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which word means the answer to a multiplication?"
                options: ["product", "difference", "sum"]
                answer: "product"
              - id: l1-n2
                type: multiple_choice
                text: "What is the product of 6 and 9?"
                options: ["15", "54", "3"]
                answer: "54"
              - id: l1-n3
                type: multiple_choice
                text: "Which calculation says \"12 multiplied by 2\"?"
                options: ["12 ÷ 2", "12 × 2", "12 − 2"]
                answer: "12 × 2"
              - id: l1-n4
                type: true_false
                text: "Is it true? The product of 8 and 2 is 10."
                answer: false
              - id: l1-n5
                type: text_input
                text: "The product of two numbers is 35. One number is 5. What is the other?"
                answer: "7"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is the product of 4 and 7?"
            options: ["11", "28", "3"]
            answer: "28"
          - id: l1-c2
            type: true_false
            text: "Is it true? In 5 × 6 = 30, the product is 30."
            answer: true
          - id: l1-c3
            type: text_input
            text: "Find the product of 8 and 3."
            answer: "24"

  - n: 2
    title: { de: "Geteilt durch und Quotient", en: "Divided by and quotient" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is the product of 3 and 9?"
            options: ["12", "27", "6"]
            answer: "27"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Find the product of 6 and 5."
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "20 ÷ 4: twenty divided by four"
            say: "We read the division sign as divided by. Twenty divided by four asks how many fours make twenty."
          - text: "20 ÷ 4 = 5. 5 is the quotient."
            say: "The answer to a division is called the quotient. Five is the quotient of twenty and four."
          - text: "The quotient of 20 and 4 is 20 ÷ 4, not 4 ÷ 20"
            say: "Keep the numbers in order. The quotient of twenty and four means twenty divided by four. The first number is divided by the second."
          - text: "× → product   ÷ → quotient"
            say: "Product goes with times. Quotient goes with divided by. Sum goes with add, and difference goes with subtract."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which calculation finds the quotient of 18 and 3?"
                options: ["18 ÷ 3", "3 ÷ 18", "18 × 3"]
                answer: "18 ÷ 3"
                feedback:
                  "3 ÷ 18": "Keep the numbers in order: the first number, 18, is divided by the second, 3."
                  "18 × 3": "That finds the product. The quotient is the answer to a division."
                hints:
                  - "Quotient means the answer to a division."
                  - "The first number is divided by the second."
                  - "18 ÷ 3."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "What is the quotient of 32 and 8?"
                answer: "4"
                hints:
                  - "Quotient means divide."
                  - "Work out 32 ÷ 8."
                  - "4 × 8 = 32, so 4."
              - id: l2-f3
                type: sorting
                text: "Sort the words."
                say: "Does the word go with multiplying or with dividing? Put each word in the right group."
                bins:
                  - { id: mult, show: { text: "×" }, say: "Multiplying." }
                  - { id: div, show: { text: "÷" }, say: "Dividing." }
                options:
                  - { text: "product", bin: mult }
                  - { text: "quotient", bin: div }
                  - { text: "times", bin: mult }
                  - { text: "divided by", bin: div }
                hints:
                  - "The answer to a multiplication has its own word, and so does the answer to a division."
                  - "Product and times go with multiplying."
                  - "× : product, times. ÷ : quotient, divided by."
              - id: l2-f4
                type: true_false
                text: "Is it true? In 45 ÷ 5 = 9, the product is 9."
                answer: false
                feedback:
                  "true": "9 is the answer to a division, so it is the quotient."
                hints:
                  - "Is 45 ÷ 5 a multiplication or a division?"
                  - "The answer to a division is the quotient."
                  - "No. 9 is the quotient."
              - id: l2-f5
                type: multiple_choice
                text: "How do you say 56 ÷ 7?"
                options: ["fifty-six divided by seven", "fifty-six times seven", "seven divided by fifty-six"]
                answer: "fifty-six divided by seven"
                hints:
                  - "The sign ÷ is read as divided by."
                  - "Read the numbers in the order they are written."
                  - "Fifty-six divided by seven."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which calculation finds the quotient of 40 and 5?"
                options: ["5 ÷ 40", "40 ÷ 5", "40 − 5"]
                answer: "40 ÷ 5"
                hints: ["The first number is divided by the second."]
              - id: l2-s2
                type: text_input
                text: "What is the quotient of 63 and 9?"
                answer: "7"
                hints: ["Work out 63 ÷ 9."]
              - id: l2-s3
                type: matching
                text: "Match each word to what it means."
                pairs:
                  - { left: { text: "product" }, right: { text: "the answer to a multiplication" } }
                  - { left: { text: "quotient" }, right: { text: "the answer to a division" } }
                  - { left: { text: "sum" }, right: { text: "the answer to an addition" } }
                  - { left: { text: "difference" }, right: { text: "the answer to a subtraction" } }
                hints: ["Product goes with times, quotient goes with divided by."]
              - id: l2-s4
                type: true_false
                text: "Is it true? In 24 ÷ 6 = 4, the quotient is 4."
                answer: true
                hints: ["The answer to a division is the quotient."]
              - id: l2-s5
                type: multiple_choice
                text: "What is the product of 10 and 3?"
                options: ["30", "13", "7"]
                answer: "30"
                hints: ["Product means times."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which calculation finds the quotient of 27 and 9?"
                options: ["27 × 9", "9 ÷ 27", "27 ÷ 9"]
                answer: "27 ÷ 9"
              - id: l2-n2
                type: text_input
                text: "What is the quotient of 48 and 6?"
                answer: "8"
              - id: l2-n3
                type: sorting
                text: "Sort the words."
                say: "Does the word go with multiplying or with dividing? Put each word in the right group."
                bins:
                  - { id: mult, show: { text: "×" }, say: "Multiplying." }
                  - { id: div, show: { text: "÷" }, say: "Dividing." }
                options:
                  - { text: "quotient", bin: div }
                  - { text: "multiplied by", bin: mult }
                  - { text: "product", bin: mult }
                  - { text: "divided by", bin: div }
              - id: l2-n4
                type: true_false
                text: "Is it true? In 7 × 8 = 56, the quotient is 56."
                answer: false
              - id: l2-n5
                type: text_input
                text: "The quotient of a number and 4 is 9. What is the number?"
                answer: "36"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What is the product of 7 and 6?"
            options: ["13", "42", "1"]
            answer: "42"
          - id: l2-c2
            type: text_input
            text: "What is the quotient of 81 and 9?"
            answer: "9"
          - id: l2-c3
            type: multiple_choice
            text: "In 36 ÷ 4 = 9, what is 9?"
            options: ["the quotient", "the product", "the difference"]
            answer: "the quotient"
          - id: l2-c4
            type: multiple_choice
            text: "Which calculation finds the quotient of 30 and 6?"
            options: ["30 ÷ 6", "6 ÷ 30", "30 × 6"]
            answer: "30 ÷ 6"
          - id: l2-c5
            type: true_false
            text: "Is it true? The product of 2 and 9 is 18."
            answer: true
