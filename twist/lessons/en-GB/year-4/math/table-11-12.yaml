# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.table-11-12
skill: math.mult-div.table-11-12
curriculum: en-GB
language: en
title:
  de: Die 11er- und 12er-Reihe
  en: The 11 and 12 times tables
summary: >
  The 11 and 12 times tables and their division facts, so that every
  multiplication fact up to 12 × 12 is known, as the Year 4
  multiplication tables check asks. Lesson 1 builds the 11 times table
  from ten groups and one more group, and shows where the repeated-digit
  pattern stops; lesson 2 builds the 12 times table from ten groups and
  two groups or by doubling the 6 times table, adds division facts, and
  ends with the skill check. Speed comes from practice sessions.
metadata:
  year: year-4
  topic: { de: Einmaleins, en: Times tables }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.all-tables]
  also_practises: [math.mult-div.all-tables, math.mult-div.div-facts]
  vocabulary: { en: [times table, multiple, multiplication fact, division fact, eleven, twelve, double] }
  forms: [text, audio]
  drawn: []
  facets: [operation-signs]
  parts:
    - { id: eleven, what: { de: die Aufgaben der 11er-Reihe, en: the 11 times table facts } }
    - { id: twelve, what: { de: die Aufgaben der 12er-Reihe, en: the 12 times table facts } }
    - { id: division, what: { de: die Geteiltaufgaben zur 11er- und 12er-Reihe, en: the division facts for 11 and 12 } }
    - { id: in-context, what: { de: Sachaufgaben mit der 11er- und 12er-Reihe, en: word problems with the 11 and 12 times tables } }
  misconceptions:
    - id: repeated-digit-pattern
      what: Carries the 11 times table pattern past 9 (11 × 10 = 1010, 11 × 12 = 1212)
      addressed: lesson 1 Learn shows where the pattern stops; l1-f3 has feedback on 1212, and l1-s2, l1-s4 and l1-c2 offer the pattern answer
    - id: one-group-out
      what: Gives the answer from the next-door table (12 × 8 = 88, 12 × 11 = 121)
      addressed: lesson 2 Learn builds 12 × from 10 × and 2 ×; l2-f3 has feedback on 88, and l2-s4 and l2-c3 offer the 11 times table answer (121, 77)
    - id: hard-twelves
      what: Gets the bigger twelves wrong (12 × 7, 12 × 8, 12 × 9, 12 × 12)
      addressed: they come in every stage of lesson 2 (l2-f3, l2-f5, l2-s1, l2-s2, l2-n2) and in the skill check (l2-c2, l2-c3, l2-c5)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die 11er-Reihe, en: The 11 times table }
    goal:
      de: "Lern die Elferreihe. 11 mal 4 sind 10 Vierer und noch ein Vierer, also 44."
      en: "Learn the 11 times table. 11 times 4 is 10 fours and one more four, so 44."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "9 × 7 = _"
            say: "Nine times seven."
            answer: "63"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "10 × 8 = _"
            say: "Ten times eight."
            answer: "80"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "11 × 4 = 10 × 4 + 4 = 40 + 4 = 44"
            say: "Eleven fours are ten fours and one more four. Forty add four is forty-four."
          - text: "11, 22, 33, 44, 55, 66, 77, 88, 99"
            say: "Up to eleven times nine, the answer has the same digit twice. Eleven times six is sixty-six."
          - text: "11 × 10 = 110\n11 × 11 = 121\n11 × 12 = 132"
            say: "After that the pattern stops. Eleven tens are a hundred and ten. Eleven times eleven is a hundred and ten add eleven: a hundred and twenty-one. Eleven times twelve is a hundred and twenty add twelve: a hundred and thirty-two."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "11 × 3 = _"
                say: "Eleven times three."
                answer: "33"
                hints:
                  - "Eleven threes are ten threes and one more three."
                  - "30 + 3."
                  - "33."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Use 10 × 7 to find 11 × 7."
                say: "Eleven times seven. Ten sevens are seventy. What do you add?"
                frame: "11 × 7 = 70 + _ = _"
                options: ["1", "7", "71", "77"]
                answer: ["7", "77"]
                hints:
                  - "Eleven sevens are one more seven than ten sevens."
                  - "Add a whole seven, not one."
                  - "70 + 7 = 77."
              - id: l1-f3
                type: multiple_choice
                text: "11 × 12 = _"
                say: "Eleven times twelve."
                options: ["132", "122", "1212"]
                answer: "132"
                feedback:
                  "1212": "The repeated-digit pattern stops at 11 × 9. 11 × 12 is 10 twelves and one more twelve: 120 + 12."
                hints:
                  - "Think of 10 × 12 first."
                  - "10 × 12 = 120. Add one more 12."
                  - "120 + 12 = 132."
              - id: l1-f4
                type: true_false
                text: "Is it true? 11 × 8 = 88"
                say: "Is it true? Eleven times eight is eighty-eight."
                answer: true
                hints:
                  - "Ten eights and one more eight."
                  - "80 + 8."
                  - "Yes, 88."
              - id: l1-f5
                type: text_input
                text: "A football team has 11 players. How many players are in 5 teams?"
                answer: "55"
                hints:
                  - "Which calculation is it?"
                  - "5 teams of 11: 11 × 5."
                  - "55."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "11 × 6 = _"
                say: "Eleven times six."
                answer: "66"
                hints: ["Ten sixes and one more six."]
              - id: l1-s2
                type: multiple_choice
                text: "11 × 11 = _"
                say: "Eleven times eleven."
                options: ["121", "111", "1111"]
                answer: "121"
                hints: ["10 × 11 = 110. Add one more 11."]
              - id: l1-s3
                type: fill_in_blank
                text: "Find the missing number."
                say: "What times eleven is ninety-nine?"
                frame: "_ × 11 = 99"
                options: ["8", "9", "11"]
                answer: ["9"]
                hints: ["Count in elevens to 99."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 11 × 10 = 1010"
                say: "Is it true? Eleven times ten is one thousand and ten."
                answer: false
                hints: ["Multiplying by 10 moves the digits one place left."]
              - id: l1-s5
                type: text_input
                text: "Stickers come in sheets of 11. Tom buys 12 sheets. How many stickers does he get?"
                answer: "132"
                hints: ["12 × 11 is 10 elevens and 2 more elevens."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "11 × 9 = _"
                say: "Eleven times nine."
                answer: "99"
              - id: l1-n2
                type: text_input
                text: "12 × 11 = _"
                say: "Twelve times eleven."
                answer: "132"
              - id: l1-n3
                type: fill_in_blank
                text: "Find the missing number."
                say: "Eleven times what is seventy-seven?"
                frame: "11 × _ = 77"
                options: ["6", "7", "8"]
                answer: ["7"]
              - id: l1-n4
                type: multiple_choice
                text: "Which number is in the 11 times table?"
                options: ["56", "65", "55"]
                answer: "55"
              - id: l1-n5
                type: text_input
                text: "110 ÷ 11 = _"
                say: "One hundred and ten divided by eleven."
                answer: "10"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "11 × 5 = _"
            say: "Eleven times five."
            answer: "55"
          - id: l1-c2
            type: multiple_choice
            text: "11 × 10 = _"
            say: "Eleven times ten."
            options: ["110", "1010", "111"]
            answer: "110"
          - id: l1-c3
            type: fill_in_blank
            text: "Find the missing number."
            say: "What times eleven is forty-four?"
            frame: "_ × 11 = 44"
            options: ["3", "4", "40"]
            answer: ["4"]
          - id: l1-c4
            type: text_input
            text: "99 ÷ 11 = _"
            say: "Ninety-nine divided by eleven."
            answer: "9"
          - id: l1-c5
            type: true_false
            text: "Is it true? 12 × 11 = 1212"
            say: "Is it true? Twelve times eleven is one thousand two hundred and twelve."
            answer: false
          - id: l1-c6
            type: text_input
            text: "A pack has 11 cards. How many cards are in 6 packs?"
            answer: "66"

  - n: 2
    title: { de: Die 12er-Reihe, en: The 12 times table }
    goal:
      de: "Lern die Zwölferreihe mit 10 und 2, so wie 12 mal 4 ist 40 plus 8, also 48."
      en: "Learn the 12 times table by using 10 and 2, like 12 times 4 is 40 add 8, which is 48."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "11 × 7 = _"
            say: "Eleven times seven."
            answer: "77"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "11 × 12 = _"
            say: "Eleven times twelve."
            answer: "132"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "12 × 4 = 10 × 4 + 2 × 4 = 40 + 8 = 48"
            say: "Twelve is ten and two. So twelve fours are ten fours and two fours: forty add eight is forty-eight."
          - text: "12 × 6 = double 6 × 6 = double 36 = 72"
            say: "Or use doubling. Twelve is double six, so twelve sixes are double six sixes. Double thirty-six is seventy-two."
          - text: "12, 24, 36, 48, 60, 72, 84, 96, 108, 120, 132, 144"
            say: "Count in twelves: twelve, twenty-four, thirty-six, all the way to a hundred and forty-four. Twelve twelves are a hundred and forty-four."
          - text: "12 × 7 = 84\n84 ÷ 12 = 7\n84 ÷ 7 = 12"
            say: "Every multiplication fact gives two division facts. Twelve sevens are eighty-four, so eighty-four divided by twelve is seven, and eighty-four divided by seven is twelve."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Use 10 × 3 and 2 × 3 to find 12 × 3."
                say: "Twelve times three. Ten threes are thirty. Two threes are how many?"
                frame: "12 × 3 = 30 + _ = _"
                options: ["2", "6", "32", "36"]
                answer: ["6", "36"]
                hints:
                  - "Twelve threes are ten threes and two threes."
                  - "Two threes are 6."
                  - "30 + 6 = 36."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "12 × 5 = _"
                say: "Twelve times five."
                answer: "60"
                hints:
                  - "Ten fives and two fives."
                  - "50 + 10."
                  - "60."
              - id: l2-f3
                type: multiple_choice
                text: "12 × 8 = _"
                say: "Twelve times eight."
                options: ["96", "98", "88"]
                answer: "96"
                feedback:
                  "88": "That is 11 × 8. 12 × 8 has one more eight: 88 + 8 = 96."
                hints:
                  - "Ten eights and two eights."
                  - "80 + 16."
                  - "96."
              - id: l2-f4
                type: fill_in_blank
                text: "Find the missing number."
                say: "What times twelve is eighty-four?"
                frame: "_ × 12 = 84"
                options: ["6", "7", "8"]
                answer: ["7"]
                hints:
                  - "Count in twelves until you reach 84."
                  - "12, 24, 36, 48, 60, 72, 84."
                  - "Seven twelves: 7."
              - id: l2-f5
                type: text_input
                text: "Eggs come in boxes of 12. How many eggs are in 9 boxes?"
                answer: "108"
                hints:
                  - "9 boxes of 12: 12 × 9."
                  - "Ten nines and two nines: 90 + 18."
                  - "108."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "7 × 12 = _"
                say: "Seven times twelve."
                answer: "84"
                hints: ["Seventy and fourteen."]
              - id: l2-s2
                type: multiple_choice
                text: "12 × 12 = _"
                say: "Twelve times twelve."
                options: ["144", "124", "132"]
                answer: "144"
                hints: ["120 and two more twelves."]
              - id: l2-s3
                type: text_input
                text: "60 ÷ 12 = _"
                say: "Sixty divided by twelve."
                answer: "5"
                hints: ["How many twelves make 60?"]
              - id: l2-s4
                type: true_false
                text: "Is it true? 12 × 11 = 121"
                say: "Is it true? Twelve times eleven is one hundred and twenty-one."
                answer: false
                hints: ["121 is 11 × 11. Add one more 11."]
              - id: l2-s5
                type: text_input
                text: "A year has 12 months. How many months are in 6 years?"
                answer: "72"
                hints: ["Double 6 × 6."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "12 × 10 = _"
                say: "Twelve times ten."
                answer: "120"
              - id: l2-n2
                type: text_input
                text: "96 ÷ 12 = _"
                say: "Ninety-six divided by twelve."
                answer: "8"
              - id: l2-n3
                type: multiple_choice
                text: "Which fact is wrong?"
                options: ["12 × 4 = 48", "12 × 9 = 108", "12 × 6 = 62"]
                answer: "12 × 6 = 62"
              - id: l2-n4
                type: text_input
                text: "144 ÷ 12 = _"
                say: "One hundred and forty-four divided by twelve."
                answer: "12"
              - id: l2-n5
                type: text_input
                text: "Pencils come in packs of 12. Mia needs 132 pencils. How many packs does she need?"
                answer: "11"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: eleven
            type: text_input
            text: "4 × 11 = _"
            say: "Four times eleven."
            answer: "44"
          - id: l2-c2
            part: twelve
            type: text_input
            text: "12 × 9 = _"
            say: "Twelve times nine."
            answer: "108"
          - id: l2-c3
            part: twelve
            type: multiple_choice
            text: "12 × 7 = _"
            say: "Twelve times seven."
            options: ["84", "77", "74"]
            answer: "84"
          - id: l2-c4
            part: division
            type: text_input
            text: "72 ÷ 12 = _"
            say: "Seventy-two divided by twelve."
            answer: "6"
          - id: l2-c5
            part: division
            type: fill_in_blank
            text: "Find the missing number."
            say: "What times twelve is one hundred and forty-four?"
            frame: "_ × 12 = 144"
            options: ["11", "12", "14"]
            answer: ["12"]
          - id: l2-c6
            part: eleven
            type: multiple_choice
            text: "Which number is not in the 11 times table?"
            options: ["66", "121", "111"]
            answer: "111"
          - id: l2-c7
            part: eleven
            type: true_false
            text: "Is it true? 10 × 11 = 101"
            say: "Is it true? Ten times eleven is one hundred and one."
            answer: false
          - id: l2-c8
            part: eleven
            type: fill_in_blank
            text: "Count in elevens. Which numbers are missing?"
            frame: "88, 99, _, _"
            options: ["100", "110", "111", "121"]
            answer: ["110", "121"]
          - id: l2-c9
            part: eleven
            type: multiple_choice
            text: "_ × 11 = 66"
            say: "What times eleven is sixty-six?"
            options: ["6", "5", "7"]
            answer: "6"
          - id: l2-c10
            part: twelve
            type: text_input
            text: "8 × 12 = _"
            say: "Eight times twelve."
            answer: "96"
          - id: l2-c11
            part: twelve
            type: true_false
            text: "Is it true? 12 × 11 = 132"
            say: "Is it true? Twelve times eleven is one hundred and thirty-two."
            answer: true
          - id: l2-c12
            part: twelve
            type: fill_in_blank
            text: "Count in twelves. Which numbers are missing?"
            frame: "72, 84, _, _"
            options: ["94", "96", "106", "108"]
            answer: ["96", "108"]
          - id: l2-c13
            part: division
            type: text_input
            text: "121 ÷ 11 = _"
            say: "One hundred and twenty-one divided by eleven."
            answer: "11"
          - id: l2-c14
            part: division
            type: multiple_choice
            text: "108 ÷ 12 = _"
            say: "One hundred and eight divided by twelve."
            options: ["9", "8", "12"]
            answer: "9"
          - id: l2-c15
            part: division
            type: fill_in_blank
            text: "Find the missing number."
            say: "What divided by eleven is five?"
            frame: "_ ÷ 11 = 5"
            options: ["50", "55", "60"]
            answer: ["55"]
          - id: l2-c16
            part: in-context
            type: text_input
            text: "A minibus has 11 seats. How many seats are there on 3 minibuses?"
            answer: "33"
          - id: l2-c17
            part: in-context
            type: text_input
            text: "A box holds 12 cupcakes. How many cupcakes are in 3 boxes?"
            answer: "36"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "Juice comes in packs of 12 cartons. The school needs 120 cartons. How many packs does it need?"
            options: ["10", "12", "11"]
            answer: "10"
          - id: l2-c19
            part: in-context
            type: text_input
            text: "Leo saves £11 every month. How much has he saved after 9 months? Type the pounds."
            answer: "99"
          - id: l2-c20
            part: in-context
            type: multiple_choice
            text: "There are 12 pencils in each pack. Sara has 5 packs and gives 1 pack away. How many pencils does she have now?"
            options: ["48", "60", "59"]
            answer: "48"
