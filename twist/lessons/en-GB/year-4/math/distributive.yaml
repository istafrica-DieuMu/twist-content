# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.distributive
skill: math.mult-div-larger.distributive
curriculum: en-GB
language: en
title:
  de: Malnehmen durch Zerlegen
  en: Multiplying by partitioning
summary: >
  Splitting one number to multiply bigger numbers. Lesson 1 partitions a
  two-digit number into tens and ones (6 × 14 = 6 × 10 + 6 × 4), shows
  it on an array split in two and in a grid, and says why it works: both
  parts are multiplied; lesson 2 splits cleverly, also by taking away
  (7 × 19 = 7 × 20 − 7 × 1), and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.tens, math.mult-div.derive-facts]
  also_practises: [math.mult-div-larger.tens, math.mult-div.all-tables]
  vocabulary: { en: [partition, tens, ones, array, grid method, multiply, near multiple of 10] }
  forms: [drawn, text, audio]
  drawn: [dots, table]
  facets: [operation-signs]
  parts:
    - { id: split, what: { de: "eine Malaufgabe passend zerlegen und erklären, warum das geht", en: splitting a multiplication and explaining why it works } }
    - { id: tens-ones, what: { de: mit Zehnern und Einern zerlegen und rechnen, en: splitting into tens and ones and working it out } }
    - { id: near-ten, what: { de: mit einer runden Zahl rechnen und den Rest wegnehmen oder dazutun, en: multiplying by a near multiple of 10 and taking away or adding the extra } }
    - { id: in-context, what: { de: Sachaufgaben mit Zerlegen lösen, en: solving word problems by splitting } }
  misconceptions:
    - id: multiply-one-part
      what: Multiplies only the tens or only the ones (6 × 14 = 60 + 4)
      addressed: lesson 1 Learn splits the array into two parts that are both multiplied; l1-f2 (with feedback), l1-s2 and l1-n2 offer the one-part result, l1-f4, l1-s4 and l1-c3 ask whether a one-part split is right
    - id: take-away-one
      what: Takes away 1 instead of a whole group when using a near multiple of 10 (7 × 19 = 140 − 1)
      addressed: lesson 2 Learn takes away a whole 7, not 1; l2-f1 has 139 as a chip with feedback, l2-s1 and l2-n1 offer the minus-one result as a chip, l2-f4 and l2-c4 ask whether a minus-one answer is right
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zehner und Einer", en: "Tens and ones" }
    goal:
      de: "Zerlege eine Zahl in Zehner und Einer und rechne mal, so wie 6 mal 14 ist 6 mal 10 plus 6 mal 4."
      en: "Split a number into tens and ones to multiply, like 6 times 14 is 6 times 10 add 6 times 4."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 × 10 = _"
            say: "Six times ten."
            answer: "60"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "4 × 30 = _"
            say: "Four times thirty."
            answer: "120"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "14 rows of 6 dots. How many dots? Guess!"
            say: "Here are fourteen rows of six dots. How many dots do you think there are? Have a guess before we count them a clever way."
            show: { drawn: dots, array: [14, 6] }
          - text: "14 × 6 = 10 × 6 + 4 × 6"
            say: "Here are fourteen rows of six. They are hard to count all at once, so split them: ten red rows and four blue rows. Ten sixes are sixty. Four sixes are twenty-four."
            show: { drawn: dots, array: [14, 6], split_rows: 10 }
          - text: "60 + 24 = 84"
            say: "Add the two parts: sixty and twenty-four make eighty-four. Was your guess close? Every dot is still counted, so fourteen times six is eighty-four."
          - text: "6 × 14 = 6 × 10 + 6 × 4"
            say: "The same works for six times fourteen. Partition fourteen into ten and four. Multiply both parts by six, then add. You must multiply both parts, not just the ten."
          - text: "Grid method"
            say: "A grid keeps it tidy. Write the parts of fourteen along the top and six down the side. Six times ten is sixty, six times four is twenty-four. Sixty add twenty-four is eighty-four."
            show: { drawn: table, rows: [["×", "10", "4"], ["6", "60", "24"]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Partition 13 to work out 4 × 13."
                say: "Four times thirteen. Partition thirteen into ten and three."
                frame: "4 × 13 = 4 × 10 + 4 × 3 = _ + _ = _"
                options: ["12", "40", "43", "52"]
                answer: ["40", "12", "52"]
                hints:
                  - "Multiply both parts by 4."
                  - "4 × 10 = 40 and 4 × 3 = 12."
                  - "40 + 12 = 52."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "5 × 16 = _"
                say: "Five times sixteen."
                options: ["80", "56", "60"]
                answer: "80"
                feedback:
                  "56": "You multiplied only the ten. Multiply the 6 by 5 too: 50 + 30."
                hints:
                  - "Partition 16 into 10 and 6."
                  - "5 × 10 = 50 and 5 × 6 = 30."
                  - "50 + 30 = 80."
              - id: l1-f3
                type: fill_in_blank
                text: "Fill in the grid for 3 × 17."
                say: "Three times seventeen. Fill in the grid."
                show: { drawn: table, rows: [["×", "10", "7"], ["3", "?", "?"]] }
                frame: "3 × 10 = _, 3 × 7 = _, 3 × 17 = _"
                options: ["21", "30", "37", "51"]
                answer: ["30", "21", "51"]
                hints:
                  - "Multiply 3 by each part along the top."
                  - "3 × 10 = 30 and 3 × 7 = 21."
                  - "30 + 21 = 51."
              - id: l1-f4
                type: true_false
                text: "Is it true? 7 × 12 = 7 × 10 + 2"
                say: "Is it true? Seven times twelve is seven times ten add two."
                answer: false
                hints:
                  - "Both parts of 12 must be multiplied by 7."
                  - "7 × 12 = 7 × 10 + 7 × 2."
                  - "No. It should be + 7 × 2, not + 2."
              - id: l1-f5
                type: text_input
                text: "6 × 15 = _"
                say: "Six times fifteen."
                answer: "90"
                hints:
                  - "Partition 15 into 10 and 5."
                  - "6 × 10 = 60 and 6 × 5 = 30."
                  - "60 + 30 = 90."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Partition 18 to work out 3 × 18."
                say: "Three times eighteen. Partition eighteen into ten and eight."
                frame: "3 × 18 = 3 × 10 + 3 × 8 = _ + _ = _"
                options: ["24", "30", "38", "54"]
                answer: ["30", "24", "54"]
                hints: ["Multiply both parts by 3."]
              - id: l1-s2
                type: multiple_choice
                text: "4 × 17 = _"
                say: "Four times seventeen."
                options: ["47", "68", "28"]
                answer: "68"
                hints: ["4 × 10 + 4 × 7."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fill in the grid for 8 × 14."
                say: "Eight times fourteen. Fill in the grid."
                show: { drawn: table, rows: [["×", "10", "4"], ["8", "?", "?"]] }
                frame: "8 × 10 = _, 8 × 4 = _, 8 × 14 = _"
                options: ["32", "80", "84", "112"]
                answer: ["80", "32", "112"]
                hints: ["Multiply 8 by 10 and by 4, then add."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 9 × 13 = 9 × 10 + 9 × 3"
                say: "Is it true? Nine times thirteen is nine times ten add nine times three."
                answer: true
                hints: ["Are both parts of 13 multiplied by 9?"]
              - id: l1-s5
                type: text_input
                text: "7 × 14 = _"
                say: "Seven times fourteen."
                answer: "98"
                hints: ["70 + 28."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Partition 16 to work out 6 × 16."
                say: "Six times sixteen. Partition sixteen into ten and six."
                frame: "6 × 16 = 6 × 10 + 6 × 6 = _ + _ = _"
                options: ["36", "60", "66", "96"]
                answer: ["60", "36", "96"]
              - id: l1-n2
                type: multiple_choice
                text: "3 × 24 = _"
                say: "Three times twenty-four."
                options: ["64", "72", "27"]
                answer: "72"
              - id: l1-n3
                type: text_input
                text: "5 × 23 = _"
                say: "Five times twenty-three."
                answer: "115"
              - id: l1-n4
                type: true_false
                text: "Is it true? 4 × 26 = 4 × 20 + 4 × 6"
                say: "Is it true? Four times twenty-six is four times twenty add four times six."
                answer: true
              - id: l1-n5
                type: text_input
                text: "A minibus has 16 seats. How many seats are there in 6 minibuses?"
                answer: "96"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "4 × 18 = _"
            say: "Four times eighteen."
            answer: "72"
          - id: l1-c2
            type: fill_in_blank
            text: "Partition 15 to work out 7 × 15."
            say: "Seven times fifteen. Partition fifteen into ten and five."
            frame: "7 × 15 = 7 × 10 + 7 × 5 = _ + _ = _"
            options: ["35", "70", "75", "105"]
            answer: ["70", "35", "105"]
          - id: l1-c3
            type: true_false
            text: "Is it true? 8 × 13 = 80 + 3"
            say: "Is it true? Eight times thirteen is eighty add three."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "6 × 13 = _"
            say: "Six times thirteen."
            options: ["78", "63", "69"]
            answer: "78"
          - id: l1-c5
            type: fill_in_blank
            text: "Fill in the grid for 5 × 18."
            say: "Five times eighteen. Fill in the grid."
            show: { drawn: table, rows: [["×", "10", "8"], ["5", "?", "?"]] }
            frame: "5 × 10 = _, 5 × 8 = _, 5 × 18 = _"
            options: ["40", "50", "58", "90"]
            answer: ["50", "40", "90"]
          - id: l1-c6
            type: text_input
            text: "A box holds 12 eggs. How many eggs are in 7 boxes?"
            answer: "84"

  - n: 2
    title: { de: "Geschickt zerlegen", en: "Splitting cleverly" }
    goal:
      de: "Zerlege Zahlen geschickt, auch mit Minus, so wie 7 mal 19 ist 7 mal 20 minus 7."
      en: "Split numbers cleverly, also by taking away, like 7 times 19 is 7 times 20 take away 7."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "3 × 16 = _"
            say: "Three times sixteen."
            answer: "48"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? 6 × 12 = 6 × 10 + 6 × 2"
            say: "Is it true? Six times twelve is six times ten add six times two."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 × 20 = 140. Is 7 × 19 more or less?"
            say: "Seven twenties are one hundred and forty. Is seven times nineteen more or less than that? Have a guess."
          - text: "7 × 19 = 7 × 20 − 7 × 1 = 140 − 7 = 133"
            say: "Less! Nineteen is close to twenty. Seven twenties are one hundred and forty. But that is one seven too many, so take away seven: one hundred and thirty-three."
            show: { drawn: dots, array: [7, 20] }
          - text: "Take away a whole 7, not 1."
            say: "Be careful. Each of the seven rows had one dot too many, so you take away seven dots, not one. One hundred and forty take away one is wrong."
          - text: "4 × 25 = 4 × 20 + 4 × 5 = 80 + 20 = 100"
            say: "Choose the split that is easiest for you. Twenty-five is twenty and five. Four twenties are eighty and four fives are twenty, so the answer is one hundred."
          - text: "Did you know? Until 1971, British money had 12 pennies in a shilling. 14 shillings: 14 × 10 + 14 × 2 = 168 pennies."
            say: "Did you know? Until nineteen seventy-one, British money had twelve pennies in every shilling. Shopkeepers multiplied by twelve all day long! Fourteen shillings: fourteen times ten is one hundred and forty, fourteen times two is twenty-eight, so that is one hundred and sixty-eight pennies."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Use 20 to work out 7 × 19."
                say: "Seven times nineteen. Use seven times twenty."
                frame: "7 × 19 = 7 × 20 − 7 = _ − 7 = _"
                options: ["133", "139", "140", "147"]
                answer: ["140", "133"]
                feedback:
                  "139": "You took away 1. Seven twenties have one seven too many, so take away 7."
                hints:
                  - "7 × 20 = 140."
                  - "19 is one less than 20, so take away one 7."
                  - "140 and 133."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which split helps most with 6 × 29?"
                say: "Six times twenty-nine. Which split helps most?"
                options: ["6 × 30 − 6", "6 × 20 + 9", "6 + 29", "Count on your fingers"]
                answer: "6 × 30 − 6"
                feedback:
                  "Count on your fingers": "You would need a lot of fingers! A split is much quicker: 29 is close to 30."
                hints:
                  - "29 is very close to a multiple of 10."
                  - "Six thirties take away one six."
                  - "6 × 30 − 6."
              - id: l2-f3
                type: text_input
                text: "5 × 39 = _"
                say: "Five times thirty-nine."
                answer: "195"
                hints:
                  - "39 is close to 40."
                  - "5 × 40 = 200. Take away one 5."
                  - "200 − 5 = 195."
              - id: l2-f4
                type: true_false
                text: "Is it true? 8 × 19 = 160 − 1 = 159"
                say: "Is it true? Eight times nineteen is one hundred and sixty take away one, one hundred and fifty-nine."
                answer: false
                hints:
                  - "Eight twenties have one eight too many."
                  - "Take away 8, not 1."
                  - "No. 160 − 8 = 152."
              - id: l2-f5
                type: fill_in_blank
                text: "Partition 32 to work out 3 × 32."
                say: "Three times thirty-two. Partition thirty-two into thirty and two."
                frame: "3 × 32 = 3 × 30 + 3 × 2 = _ + _ = _"
                options: ["6", "62", "90", "96"]
                answer: ["90", "6", "96"]
                hints:
                  - "Multiply both parts by 3."
                  - "3 × 30 = 90 and 3 × 2 = 6."
                  - "90 + 6 = 96."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Use 30 to work out 4 × 29."
                say: "Four times twenty-nine. Use four times thirty."
                frame: "4 × 29 = 4 × 30 − 4 = _ − 4 = _"
                options: ["116", "119", "120", "124"]
                answer: ["120", "116"]
                hints: ["Take away a whole 4."]
              - id: l2-s2
                type: multiple_choice
                text: "Which split helps most with 9 × 21?"
                say: "Nine times twenty-one. Which split helps most?"
                options: ["9 × 20 + 9", "9 × 20 + 1", "9 + 21"]
                answer: "9 × 20 + 9"
                hints: ["21 is one more than 20, so add one 9."]
              - id: l2-s3
                type: text_input
                text: "6 × 49 = _"
                say: "Six times forty-nine."
                answer: "294"
                hints: ["6 × 50 = 300."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 3 × 41 = 3 × 40 + 3 = 123"
                say: "Is it true? Three times forty-one is three times forty add three, one hundred and twenty-three."
                answer: true
                hints: ["41 is one more than 40, so add one 3."]
              - id: l2-s5
                type: text_input
                text: "8 × 25 = _"
                say: "Eight times twenty-five."
                answer: "200"
                hints: ["8 × 20 + 8 × 5."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "A book costs £9. Mr Lewis buys 19 books. Use 20 to find the cost."
                say: "A book costs nine pounds. Mr Lewis buys nineteen books. Use twenty to find the cost."
                frame: "9 × 19 = 9 × 20 − 9 = _ − 9 = £_"
                options: ["171", "179", "180", "189"]
                answer: ["180", "171"]
              - id: l2-n2
                type: text_input
                text: "A box holds 24 crayons. How many crayons are in 4 boxes?"
                answer: "96"
              - id: l2-n3
                type: text_input
                text: "Seven children each run 39 laps of the field over the term. How many laps do they run altogether?"
                answer: "273"
              - id: l2-n4
                type: true_false
                text: "Is it true? 5 × 31 = 155"
                say: "Is it true? Five times thirty-one is one hundred and fifty-five."
                answer: true
              - id: l2-n5
                type: text_input
                text: "Tickets cost £6 each. How much do 18 tickets cost?"
                answer: "108"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: tens-ones
            type: text_input
            text: "6 × 17 = _"
            say: "Six times seventeen."
            answer: "102"
          - id: l2-c2
            part: tens-ones
            type: fill_in_blank
            text: "Fill in the grid for 4 × 23."
            say: "Four times twenty-three. Fill in the grid."
            show: { drawn: table, rows: [["×", "20", "3"], ["4", "?", "?"]] }
            frame: "4 × 20 = _, 4 × 3 = _, 4 × 23 = _"
            options: ["12", "80", "83", "92"]
            answer: ["80", "12", "92"]
          - id: l2-c3
            part: near-ten
            type: text_input
            text: "3 × 59 = _"
            say: "Three times fifty-nine."
            answer: "177"
          - id: l2-c4
            part: near-ten
            type: true_false
            text: "Is it true? 6 × 19 = 120 − 1 = 119"
            say: "Is it true? Six times nineteen is one hundred and twenty take away one, one hundred and nineteen."
            answer: false
          - id: l2-c5
            part: split
            type: multiple_choice
            text: "Why does 5 × 14 = 5 × 10 + 5 × 4 work?"
            options: ["14 is 10 and 4, and both parts are multiplied by 5", "You can always add 4 at the end", "5 × 14 is the same as 5 + 14"]
            answer: "14 is 10 and 4, and both parts are multiplied by 5"
          - id: l2-c6
            part: tens-ones
            type: fill_in_blank
            text: "Partition 17 to work out 5 × 17."
            say: "Five times seventeen. Partition seventeen into ten and seven."
            frame: "5 × 17 = 5 × 10 + 5 × 7 = _ + _ = _"
            options: ["35", "50", "57", "85"]
            answer: ["50", "35", "85"]
          - id: l2-c7
            part: tens-ones
            type: multiple_choice
            text: "8 × 16 = _"
            say: "Eight times sixteen."
            options: ["128", "86", "96"]
            answer: "128"
          - id: l2-c8
            part: tens-ones
            type: text_input
            text: "9 × 14 = _"
            say: "Nine times fourteen."
            answer: "126"
          - id: l2-c9
            part: near-ten
            type: fill_in_blank
            text: "Use 40 to work out 6 × 39."
            say: "Six times thirty-nine. Use six times forty."
            frame: "6 × 39 = 6 × 40 − 6 = _ − 6 = _"
            options: ["234", "239", "240", "246"]
            answer: ["240", "234"]
          - id: l2-c10
            part: near-ten
            type: multiple_choice
            text: "Which split helps most with 8 × 49?"
            say: "Eight times forty-nine. Which split helps most?"
            options: ["8 × 50 − 8", "8 × 50 − 1", "8 + 49"]
            answer: "8 × 50 − 8"
          - id: l2-c11
            part: near-ten
            type: text_input
            text: "7 × 29 = _"
            say: "Seven times twenty-nine."
            answer: "203"
          - id: l2-c12
            part: split
            type: multiple_choice
            text: "Which is the same as 7 × 16?"
            say: "Which is the same as seven times sixteen?"
            options: ["7 × 10 + 7 × 6", "7 × 10 + 6", "7 + 16"]
            answer: "7 × 10 + 7 × 6"
          - id: l2-c13
            part: split
            type: true_false
            text: "Is it true? 9 × 18 = 9 × 20 − 9 × 2"
            say: "Is it true? Nine times eighteen is nine times twenty take away nine times two."
            answer: true
          - id: l2-c14
            part: split
            type: multiple_choice
            text: "Kim works out 3 × 27 as 3 × 20 + 7 = 67. What went wrong?"
            say: "Kim works out three times twenty-seven as three times twenty add seven, sixty-seven. What went wrong?"
            options: ["She did not multiply the 7 by 3.", "She should have split 27 into 2 and 7.", "Nothing. 67 is right."]
            answer: "She did not multiply the 7 by 3."
          - id: l2-c15
            part: split
            type: matching
            text: "Match each multiplication with a split that works."
            pairs:
              - { left: { text: "6 × 13" }, right: { text: "6 × 10 + 6 × 3" } }
              - { left: { text: "4 × 28" }, right: { text: "4 × 30 − 4 × 2" } }
              - { left: { text: "5 × 21" }, right: { text: "5 × 20 + 5" } }
              - { left: { text: "3 × 45" }, right: { text: "3 × 40 + 3 × 5" } }
          - id: l2-c16
            part: in-context
            type: text_input
            text: "A packet has 18 biscuits. How many biscuits are in 5 packets?"
            answer: "90"
          - id: l2-c17
            part: in-context
            type: text_input
            text: "A bag of compost costs £19. How much do 4 bags cost? Type the pounds."
            say: "A bag of compost costs nineteen pounds. How much do four bags cost? Type the pounds."
            answer: "76"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "A school orders 6 boxes of pencils. Each box has 25 pencils. How many pencils is that?"
            options: ["150", "125", "31"]
            answer: "150"
          - id: l2-c19
            part: in-context
            type: true_false
            text: "Is it true? 8 rows of 13 chairs make 104 chairs."
            answer: true
          - id: l2-c20
            part: in-context
            type: text_input
            text: "A train has 7 carriages with 49 seats in each. How many seats are there?"
            answer: "343"
