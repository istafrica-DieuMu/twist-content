# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.written-mult-one
skill: math.written-mult-div.mult-one-digit
curriculum: en-GB
language: en
title:
  de: Schriftlich mit einer einstelligen Zahl malnehmen
  en: Short multiplication by a one-digit number
summary: >
  Short multiplication of two- and three-digit numbers by a one-digit
  number, starting with the ones, as Year 4 asks. Lesson 1 multiplies
  without carrying (231 × 3) and with one carry (46 × 3), and checks the
  size with an estimate; lesson 2 carries into several columns (347 × 6 =
  2082), explains that a carried digit is added after multiplying, finds
  the step where a carry was lost, and ends with the skill check. The
  short multiplication layout is drawn with the carried digits written
  small; writing the digits into the columns waits for a column input.
metadata:
  year: year-4
  topic: { de: Schriftlich malnehmen, en: Written multiplication }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.semi-written-mult, math.written-add-sub.add-carry]
  also_practises: [math.mult-div-larger.semi-written-mult]
  vocabulary: { en: [short multiplication, multiply, carry, ones, tens, hundreds, estimate] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: multiply, what: { de: schriftlich mit einer einstelligen Zahl malnehmen, en: multiplying by a one-digit number in columns } }
    - { id: explain, what: { de: den Übertrag erklären und Fehler finden, en: explaining the carrying and finding mistakes } }
    - { id: estimate, what: { de: mit einem Überschlag prüfen, en: checking with an estimate } }
  misconceptions:
    - id: forget-carry
      what: Writes the carried digit but does not add it in the next column, or writes both digits of a product in one column
      addressed: lesson 2 Learn adds each carry aloud and checks 258 × 3; l1-f3 has feedback on writing 28, l1-s4 and l2-f3 judge an answer with lost carries, l2-c3 finds a lost carry, l1-n3 and l2-n3 offer the no-carry answer
    - id: multiply-carry
      what: Multiplies the carried digit as well, or does not know what it stands for
      addressed: lesson 2 Learn says the carry is tens waiting to be added; l2-f4 asks what the carried 4 stands for, l2-s4 asks whether the carry is multiplied
    - id: start-left
      what: Starts with the hundreds instead of the ones
      addressed: both Learn parts start with the ones; the step frames in l1-f1, l1-s3 and l2-f1 always go ones, tens, hundreds
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Malnehmen mit und ohne Übertrag, en: Multiplying with and without carrying }
    goal:
      de: "Multipliziere schriftlich, fang bei den Einern an und trag weiter, wenn es nötig ist, so wie 46 mal 3 ist 138."
      en: "Multiply in columns, starting with the ones, and carry when you need to, like 46 times 3 is 138."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "34 × 3 = 30 × 3 + 4 × 3 = 90 + 12 = _"
            answer: "102"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "In column addition the ones make 7 + 8 = 15. What do you carry into the tens?"
            options: ["1 ten", "5 ones", "15"]
            answer: "1 ten"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "231 × 3. Will the answer be more or less than 600?"
            say: "Two hundred and thirty-one times three. Before we work it out: do you think the answer is more or less than six hundred? Have a guess."
            show: { drawn: written-calc, rows: ["231", "3"], op: "×" }
          - text: "231 × 3: ones 1 × 3 = 3, tens 3 × 3 = 9, hundreds 2 × 3 = 6. Answer 693."
            say: "Short multiplication. Write two hundred and thirty-one, and the three under its ones. Start with the ones: one times three is three. Tens: three times three is nine, nine tens. Hundreds: two times three is six, six hundreds. The answer is six hundred and ninety-three: more than six hundred."
            show: { drawn: written-calc, rows: ["231", "3"], op: "×", result: "693" }
          - text: "Estimate: 231 is about 200, and 200 × 3 = 600. 693 is close."
            say: "Check the size with an estimate. Two hundred and thirty-one is about two hundred. Two hundred times three is six hundred. Six hundred and ninety-three is close, so it makes sense."
          - text: "46 × 3: 6 × 3 = 18, write 8, carry 1. 4 × 3 = 12, add the 1: 13. Answer 138."
            say: "Now forty-six times three. Ones: six times three is eighteen. Only one digit fits in the ones, so write eight and carry one ten. Tens: four times three is twelve tens, and add the one ten carried: thirteen. The answer is one hundred and thirty-eight."
            show: { drawn: written-calc, rows: ["46", "3"], op: "×", carry: "1 ", result: "138" }
          - text: "Did you know? The oldest times table we know with tens in it is about 2300 years old. It was written on strips of bamboo in China."
            say: "Did you know? The oldest times table we know that works with tens, like ours, is about two thousand three hundred years old. It was written in ink on thin strips of bamboo in China. Children were learning their tables more than two thousand years ago!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Work out 213 × 3 in steps."
                frame: "ones: 3 × 3 = _   tens: 1 × 3 = _   hundreds: 2 × 3 = _"
                options: ["3", "5", "6", "9"]
                answer: ["9", "3", "6"]
                hints:
                  - "Start with the ones digit, 3."
                  - "3 × 3, then 1 × 3, then 2 × 3."
                  - "9, 3 and 6, so 213 × 3 = 639."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "324 × 2 = _"
                show: { drawn: written-calc, rows: ["324", "2"], op: "×", result: "___" }
                answer: "648"
                hints:
                  - "Start with the ones: 4 × 2."
                  - "Ones 8, tens 2 × 2 = 4, hundreds 3 × 2 = 6."
                  - "324 × 2 = 648."
              - id: l1-f3
                type: multiple_choice
                text: "57 × 4. Ones: 7 × 4 = 28. What do you do?"
                show: { drawn: written-calc, rows: ["57", "4"], op: "×" }
                options: ["Write 8 and carry 2 tens.", "Write 28 in the ones.", "Write 2 and carry 8."]
                answer: "Write 8 and carry 2 tens."
                feedback:
                  "Write 28 in the ones.": "Only one digit fits in the ones. 28 is 2 tens and 8 ones, so the 2 tens are carried."
                hints:
                  - "28 is 2 tens and 8 ones."
                  - "The 8 ones stay in the ones."
                  - "Write 8 and carry 2 tens."
              - id: l1-f4
                type: text_input
                text: "Now finish it: 57 × 4 = _"
                show: { drawn: written-calc, rows: ["57", "4"], op: "×", carry: "2 ", result: "__8" }
                answer: "228"
                hints:
                  - "You wrote 8 and carried 2. Tens: 5 × 4."
                  - "5 × 4 = 20 tens, add the 2 carried: 22."
                  - "57 × 4 = 228."
              - id: l1-f5
                type: multiple_choice
                text: "Which answer fits the estimate? 312 × 3"
                options: ["936", "636", "9036"]
                answer: "936"
                hints:
                  - "312 is about 300."
                  - "300 × 3 = 900."
                  - "936 is close to 900."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "432 × 2 = _"
                answer: "864"
                hints: ["Ones first: 2 × 2."]
              - id: l1-s2
                type: text_input
                text: "38 × 5 = _"
                answer: "190"
                hints: ["8 × 5 = 40: write 0 and carry 4 tens."]
              - id: l1-s3
                type: fill_in_blank
                text: "Work out 63 × 4 in steps."
                frame: "ones: 3 × 4 = 12, write _ and carry 1   tens: 6 × 4 + 1 = _"
                options: ["1", "2", "24", "25"]
                answer: ["2", "25"]
                hints: ["Add the carried 1 after you multiply."]
              - id: l1-s4
                type: true_false
                text: "29 × 3 = 67"
                say: "Is it true? Twenty-nine times three is sixty-seven."
                answer: false
                hints: ["9 × 3 = 27: write 7 and carry 2. Did the 2 get added?"]
              - id: l1-s5
                type: text_input
                text: "A packet holds 24 stickers. How many stickers are in 4 packets?"
                answer: "96"
                hints: ["24 × 4."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "221 × 4 = _"
                answer: "884"
              - id: l1-n2
                type: text_input
                text: "76 × 3 = _"
                answer: "228"
              - id: l1-n3
                type: multiple_choice
                text: "Which answer fits the estimate? 49 × 6"
                options: ["294", "244", "394"]
                answer: "294"
              - id: l1-n4
                type: true_false
                text: "143 × 2 = 286"
                say: "Is it true? One hundred and forty-three times two is two hundred and eighty-six."
                answer: true
              - id: l1-n5
                type: text_input
                text: "A minibus seats 16 children. How many children fit in 7 minibuses?"
                answer: "112"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "123 × 3 = _"
            answer: "369"
          - id: l1-c2
            type: text_input
            text: "54 × 3 = _"
            answer: "162"
          - id: l1-c3
            type: multiple_choice
            text: "68 × 2. Ones: 8 × 2 = 16. How many tens do you carry?"
            options: ["1", "6", "16"]
            answer: "1"
          - id: l1-c4
            type: text_input
            text: "241 × 2 = _"
            answer: "482"
          - id: l1-c5
            type: text_input
            text: "27 × 4 = _"
            answer: "108"
          - id: l1-c6
            type: multiple_choice
            text: "Which answer fits the estimate? 198 × 3"
            options: ["594", "394", "5940"]
            answer: "594"

  - n: 2
    title: { de: Mehrere Überträge, en: Carrying more than once }
    goal:
      de: "Trag in mehr als eine Spalte weiter, so wie bei 347 mal 6, und addiere jeden Übertrag erst nach dem Malnehmen."
      en: "Carry into more than one column, like 347 times 6, and add each carried digit after you multiply."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "45 × 3 = _"
            answer: "135"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which answer fits the estimate? 52 × 4"
            options: ["208", "28", "2008"]
            answer: "208"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "347 × 6. Will the answer have 3 digits or 4?"
            say: "Three hundred and forty-seven times six. Do you think the answer will have three digits or four? Have a guess."
            show: { drawn: written-calc, rows: ["347", "6"], op: "×" }
          - text: "347 × 6: 7 × 6 = 42, write 2, carry 4. 4 × 6 = 24, + 4 = 28, write 8, carry 2. 3 × 6 = 18, + 2 = 20. Answer 2082."
            say: "Three hundred and forty-seven times six. Ones: seven times six is forty-two. Write two and carry four tens. Tens: four times six is twenty-four tens, plus the four carried makes twenty-eight. Write eight and carry two hundreds. Hundreds: three times six is eighteen, plus two is twenty. Write twenty. The answer is two thousand and eighty-two. That has four digits!"
            show: { drawn: written-calc, rows: ["347", "6"], op: "×", carry: "24 ", result: "2082" }
          - text: "A carried digit is added after you multiply. It is never multiplied."
            say: "The four you carried from the ones stands for four tens. It is written small in the tens column, and you add it after you multiply the tens. You never multiply the carried digit."
          - text: "Estimate: 347 is about 350, and 350 × 6 = 2100. 2082 is close."
            say: "Check with an estimate. Three hundred and forty-seven is about three hundred and fifty. Three hundred and fifty times six is two thousand one hundred. Two thousand and eighty-two is close."
          - text: "258 × 3 = 654? Check: 8 × 3 = 24, carry 2. 5 × 3 + 2 = 17, carry 1. 2 × 3 + 1 = 7. So it is 774."
            say: "Someone wrote two hundred and fifty-eight times three is six hundred and fifty-four. Check each step. Eight times three is twenty-four: write four, carry two. Five times three is fifteen, plus two is seventeen: write seven, carry one. Two times three is six, plus one is seven. The right answer is seven hundred and seventy-four. They forgot both carries."
            show: { drawn: written-calc, rows: ["258", "3"], op: "×", carry: "12 ", result: "774" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Work out 164 × 4 in steps."
                frame: "ones: 4 × 4 = 16, write _ and carry 1   tens: 6 × 4 + 1 = 25, write _ and carry 2   hundreds: 1 × 4 + 2 = _"
                options: ["1", "2", "5", "6"]
                answer: ["6", "5", "6"]
                hints:
                  - "Each time, write the ones digit and carry the tens."
                  - "16: write 6. 25: write 5. Then 4 + 2."
                  - "6, 5 and 6, so 164 × 4 = 656."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "235 × 4 = _"
                show: { drawn: written-calc, rows: ["235", "4"], op: "×", result: "___" }
                answer: "940"
                hints:
                  - "Ones: 5 × 4 = 20. Write 0, carry 2."
                  - "Tens: 3 × 4 + 2 = 14. Write 4, carry 1. Hundreds: 2 × 4 + 1."
                  - "235 × 4 = 940."
              - id: l2-f3
                type: multiple_choice
                text: "Ruby works out 278 × 3 and gets 614. What went wrong?"
                options: ["She forgot to add the carried digits.", "She multiplied by 2.", "She started with the hundreds.", "Her pencil got tired."]
                answer: "She forgot to add the carried digits."
                feedback:
                  "Her pencil got tired.": "Pencils never get tired! Look at the carries: 8 × 3 = 24 carries 2."
                hints:
                  - "Estimate: 278 is about 300, and 300 × 3 = 900. Is 614 close?"
                  - "8 × 3 = 24 carries 2. 7 × 3 = 21, + 2 = 23, carries 2."
                  - "She forgot the carries. The answer is 834."
              - id: l2-f4
                type: multiple_choice
                text: "In 347 × 6, you carry 4 from the ones. What does the 4 stand for?"
                options: ["4 tens", "4 ones", "4 hundreds"]
                answer: "4 tens"
                feedback:
                  "4 ones": "7 × 6 = 42 is 4 tens and 2 ones. The 2 ones stay. The 4 is tens."
                hints:
                  - "7 × 6 = 42."
                  - "42 is 4 tens and 2 ones."
                  - "The carried 4 is 4 tens."
              - id: l2-f5
                type: text_input
                text: "A school buys 6 boxes of pencils. Each box holds 125 pencils. How many pencils is that?"
                answer: "750"
                hints:
                  - "125 × 6."
                  - "5 × 6 = 30: write 0, carry 3. 2 × 6 + 3 = 15: write 5, carry 1."
                  - "1 × 6 + 1 = 7, so 750 pencils."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "426 × 3 = _"
                answer: "1278"
                hints: ["Hundreds: 4 × 3 = 12, and nothing is carried into them."]
              - id: l2-s2
                type: text_input
                text: "189 × 5 = _"
                answer: "945"
                hints: ["9 × 5 = 45: write 5, carry 4."]
              - id: l2-s3
                type: multiple_choice
                text: "Which answer fits the estimate? 512 × 7"
                options: ["3584", "584", "35,084"]
                answer: "3584"
                hints: ["512 is about 500. What is 500 × 7?"]
              - id: l2-s4
                type: true_false
                text: "In short multiplication, you multiply the carried digit too."
                say: "Is it true? In short multiplication, you multiply the carried digit too."
                answer: false
                hints: ["What do you do with the carried digit after you multiply?"]
              - id: l2-s5
                type: text_input
                text: "A train has 8 carriages with 74 seats in each. How many seats is that?"
                answer: "592"
                hints: ["74 × 8."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "367 × 4 = _"
                answer: "1468"
              - id: l2-n2
                type: text_input
                text: "508 × 6 = _"
                answer: "3048"
              - id: l2-n3
                type: multiple_choice
                text: "Which is right? 243 × 5"
                options: ["1215", "1005", "1225"]
                answer: "1215"
              - id: l2-n4
                type: true_false
                text: "394 × 2 = 788"
                say: "Is it true? Three hundred and ninety-four times two is seven hundred and eighty-eight."
                answer: true
              - id: l2-n5
                type: text_input
                text: "A cinema shows a film 7 times. 136 people watch it each time. How many people is that altogether?"
                answer: "952"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: multiply
            type: text_input
            text: "432 × 3 = _"
            answer: "1296"
          - id: l2-c2
            part: multiply
            type: text_input
            text: "86 × 7 = _"
            answer: "602"
          - id: l2-c3
            part: explain
            type: multiple_choice
            text: "Ali works out 156 × 4 and gets 424. What went wrong?"
            options: ["He forgot to add a carried digit.", "He added instead of multiplying.", "He started with the hundreds."]
            answer: "He forgot to add a carried digit."
          - id: l2-c4
            part: estimate
            type: multiple_choice
            text: "Which answer fits the estimate? 693 × 4"
            options: ["2772", "1772", "3772"]
            answer: "2772"
          - id: l2-c5
            part: multiply
            type: text_input
            text: "Tickets cost £8 each. 245 tickets are sold. How much money is that? Type the pounds."
            answer: "1960"
          - id: l2-c6
            part: multiply
            type: text_input
            text: "243 × 2 = _"
            show: { drawn: written-calc, rows: ["243", "2"], op: "×", result: "___" }
            answer: "486"
          - id: l2-c7
            part: multiply
            type: text_input
            text: "75 × 6 = _"
            answer: "450"
          - id: l2-c8
            part: multiply
            type: true_false
            text: "158 × 3 = 474"
            say: "Is it true? One hundred and fifty-eight times three is four hundred and seventy-four."
            answer: true
          - id: l2-c9
            part: multiply
            type: text_input
            text: "A tray holds 48 eggs. How many eggs are on 9 trays?"
            answer: "432"
          - id: l2-c10
            part: explain
            type: fill_in_blank
            text: "Work out 152 × 6 in steps."
            frame: "ones: 2 × 6 = 12, write _ and carry 1   tens: 5 × 6 + 1 = 31, write _ and carry 3   hundreds: 1 × 6 + 3 = _"
            options: ["1", "2", "3", "9"]
            answer: ["2", "1", "9"]
          - id: l2-c11
            part: explain
            type: multiple_choice
            text: "In 239 × 4, you carry 3 from the ones. What do you do with it?"
            options: ["Add it after you multiply the tens.", "Multiply it by 4.", "Write it in the ones."]
            answer: "Add it after you multiply the tens."
          - id: l2-c12
            part: explain
            type: true_false
            text: "In 85 × 3, you write 5 in the ones and carry 1 ten."
            say: "Is it true? In eighty-five times three, you write five in the ones and carry one ten."
            answer: true
          - id: l2-c13
            part: explain
            type: multiple_choice
            text: "Zac works out 47 × 6 and gets 2442. What went wrong?"
            options: ["He wrote both digits of each product instead of carrying.", "He forgot to multiply the tens.", "He started with the tens."]
            answer: "He wrote both digits of each product instead of carrying."
          - id: l2-c14
            part: explain
            type: multiple_choice
            text: "253 × 4: which step is wrong?"
            options: ["ones: 3 × 4 = 12, write 2, carry 1", "tens: 5 × 4 + 1 = 21, write 1, carry 2", "hundreds: 2 × 4 = 8, so the answer is 812"]
            answer: "hundreds: 2 × 4 = 8, so the answer is 812"
          - id: l2-c15
            part: explain
            type: true_false
            text: "Mia works out 138 × 5 and gets 590. Is it true that she forgot to add a carried digit?"
            say: "Mia works out one hundred and thirty-eight times five and gets five hundred and ninety. Is it true that she forgot to add a carried digit?"
            answer: true
          - id: l2-c16
            part: estimate
            type: multiple_choice
            text: "Which answer fits the estimate? 398 × 5"
            options: ["1990", "990", "2990"]
            answer: "1990"
          - id: l2-c17
            part: estimate
            type: multiple_choice
            text: "Estimate: about how much is 612 × 4?"
            options: ["about 2400", "about 240", "about 24,000"]
            answer: "about 2400"
          - id: l2-c18
            part: estimate
            type: true_false
            text: "Tom works out 289 × 3 and gets 567. Is it true that his answer fits an estimate?"
            say: "Tom works out two hundred and eighty-nine times three and gets five hundred and sixty-seven. Is it true that his answer fits an estimate?"
            answer: false
          - id: l2-c19
            part: estimate
            type: multiple_choice
            text: "Which is the best estimate for 47 × 8?"
            options: ["50 × 8 = 400", "40 × 8 = 320", "47 + 8 = 55"]
            answer: "50 × 8 = 400"
          - id: l2-c20
            part: estimate
            type: multiple_choice
            text: "Ben says 506 × 7 = 3542. Use an estimate. Is the size right?"
            options: ["Yes, it is about 3500.", "No, it should be about 350.", "No, it should be about 35,000."]
            answer: "Yes, it is about 3500."
