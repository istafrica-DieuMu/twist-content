# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.proportional
skill: math.patterns.proportional
curriculum: en-GB
language: en
title:
  de: Proportionale Zusammenhänge
  en: Scaling problems
summary: >
  Lesson 1 works from what is known to one and then to the amount asked
  for (3 notebooks cost £6, so 1 costs £2 and 5 cost £10), with prices in
  pounds and pence, bags of fruit and packs of cards, often in a table.
  Lesson 2 scales recipes and journeys by halving, doubling and adding
  parts, notices where "twice as many, twice as much" does not hold (three
  eggs boil as fast as one), and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Zusammenhänge, en: Relationships }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.patterns.functional-tables, math.mult-div.div-facts]
  also_practises: [math.patterns.functional-tables, math.mult-div.div-facts]
  vocabulary: { en: [cost, each, one, twice as many, double, halve, recipe, the same rate, table] }
  forms: [text, audio, drawn]
  drawn: [table]
  facets: []
  parts:
    - { id: via-one, what: { de: vom Bekannten auf eins und dann auf die gesuchte Menge schließen, en: working from what is known to one and then to the amount needed } }
    - { id: scale, what: { de: Rezepte und Wege durch Halbieren und Verdoppeln umrechnen, en: scaling recipes and journeys by halving and doubling } }
    - { id: not-proportional, what: { de: "erkennen, ob eine Menge wirklich mitwächst", en: spotting whether an amount really grows with the number } }
  misconceptions:
    - id: add-not-multiply
      what: Adds or takes away the difference instead of scaling (5 bags hold 20, so 3 bags hold 18)
      addressed: lesson 1 Learn goes to one first; l1-f2 has feedback on 30 − 6, l1-f4 has feedback on 18, l2-f1 has feedback on 204 ml, l2-f5 and l2-c2 offer an added answer
    - id: skip-one
      what: Jumps straight to the amount asked for without finding one, and multiplies the wrong numbers
      addressed: lesson 1 Learn and the frames in l1-f1, l1-f5, l1-s5 find one first; l2 Learn builds 6 people from 4 and 2
    - id: everything-scales
      what: Thinks every quantity grows in proportion (3 eggs take three times as long to boil)
      addressed: lesson 2 Learn boils three eggs in one pan; l2-f4 has feedback on 24 minutes, l2-s3, l2-s5 and l2-c4 ask about things that do not grow
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Erst auf eins, dann auf die Menge", en: "To one first, then to the amount" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Each bag holds the same number of apples. How many apples are in 3 bags?"
            show: { drawn: table, rows: [["Bags", "Apples"], [1, 4], [2, 8], [3, "?"]] }
            options: ["12", "10", "9"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "24 ÷ 4 = _"
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 notebooks cost £6. 1 notebook: £6 ÷ 3 = £2."
            say: "Three notebooks cost six pounds. Mia wants five notebooks. You cannot go straight from three to five, so first find the cost of one. Share six pounds between three notebooks: six divided by three is two. One notebook costs two pounds."
          - text: "1 notebook costs £2. 5 notebooks: 5 × £2 = £10."
            say: "Now go from one to five. Five notebooks cost five times two pounds, which is ten pounds. A table helps you keep track: three, then one, then five."
            show: { drawn: table, rows: [["Notebooks", "Cost"], [3, "£6"], [1, "£2"], [5, "£10"]] }
          - text: "4 apples cost 80p. 1 apple: 80p ÷ 4 = 20p. 7 apples: 7 × 20p = 140p = £1.40"
            say: "Another one. Four apples cost eighty pence. One apple costs eighty divided by four, which is twenty pence. Seven apples cost seven times twenty pence: one hundred and forty pence, or one pound forty."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "4 pens cost £8. How much do 3 pens cost?"
                frame: "1 pen: £8 ÷ 4 = £_   3 pens: 3 × £_ = £_"
                options: ["2", "4", "6", "8"]
                answer: ["2", "2", "6"]
                hints:
                  - "Find the cost of 1 pen first."
                  - "£8 ÷ 4 = £2 for one pen."
                  - "3 × £2 = £6."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "6 stickers cost 30p. How much does 1 sticker cost?"
                options: ["5p", "6p", "24p"]
                answer: "5p"
                feedback:
                  "24p": "30 − 6 takes away. To share the cost between 6 stickers, divide: 30 ÷ 6."
                hints:
                  - "Share 30p equally between 6 stickers."
                  - "30 ÷ 6."
                  - "Each sticker costs 5p."
              - id: l1-f3
                type: text_input
                text: "1 ticket costs £7. How much do 4 tickets cost? Type the pounds."
                answer: "28"
                hints:
                  - "You already know the cost of one."
                  - "4 tickets cost 4 × £7."
                  - "£28."
              - id: l1-f4
                type: multiple_choice
                text: "5 bags hold 20 oranges altogether. Each bag holds the same. How many oranges are in 3 bags?"
                options: ["12", "18", "15"]
                answer: "12"
                feedback:
                  "18": "Taking away 2 bags is not taking away 2 oranges. Find 1 bag first: 20 ÷ 5 = 4."
                hints:
                  - "How many oranges are in 1 bag?"
                  - "20 ÷ 5 = 4 oranges in each bag."
                  - "3 × 4 = 12 oranges."
              - id: l1-f5
                type: fill_in_blank
                text: "Each pack holds the same number of cards. Fill in the table."
                show: { drawn: table, rows: [["Packs", "Cards"], [2, 16], [1, "?"], [5, "?"]] }
                frame: "1 pack: _ cards   5 packs: _ cards"
                options: ["8", "10", "32", "40"]
                answer: ["8", "40"]
                hints:
                  - "Go from 2 packs to 1 pack first."
                  - "16 ÷ 2 = 8 cards in one pack."
                  - "5 × 8 = 40 cards."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "3 cakes cost £9. How much does 1 cake cost? Type the pounds."
                answer: "3"
                hints: ["Share £9 between 3 cakes."]
              - id: l1-s2
                type: text_input
                text: "8 pencils cost 40p. How much do 5 pencils cost? Type the pence."
                answer: "25"
                hints: ["1 pencil costs 40p ÷ 8."]
              - id: l1-s3
                type: multiple_choice
                text: "A car goes 60 miles in 2 hours at a steady speed. How far does it go in 5 hours at the same speed?"
                options: ["150 miles", "120 miles", "300 miles"]
                answer: "150 miles"
                hints: ["How far does it go in 1 hour?"]
              - id: l1-s4
                type: true_false
                text: "4 bottles of water cost £2. So 8 bottles cost £4."
                say: "Is it true? Four bottles of water cost two pounds. So eight bottles cost four pounds."
                answer: true
                hints: ["8 bottles is twice as many as 4."]
              - id: l1-s5
                type: fill_in_blank
                text: "Each box holds the same number of eggs. Fill in the table."
                show: { drawn: table, rows: [["Boxes", "Eggs"], [3, 18], [1, "?"], [4, "?"]] }
                frame: "1 box: _ eggs   4 boxes: _ eggs"
                options: ["6", "12", "18", "24"]
                answer: ["6", "24"]
                hints: ["18 ÷ 3 for one box."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "5 books cost £30. How much do 2 books cost? Type the pounds."
                answer: "12"
              - id: l1-n2
                type: text_input
                text: "3 trays hold 27 buns. Each tray holds the same. How many buns do 5 trays hold?"
                answer: "45"
              - id: l1-n3
                type: multiple_choice
                text: "6 metres of ribbon cost £12. How much do 9 metres cost?"
                options: ["£18", "£15", "£21"]
                answer: "£18"
              - id: l1-n4
                type: true_false
                text: "2 sandwiches cost £5. So 1 sandwich costs £3."
                say: "Is it true? Two sandwiches cost five pounds. So one sandwich costs three pounds."
                answer: false
              - id: l1-n5
                type: text_input
                text: "A machine fills 4 bottles every minute. How many bottles does it fill in 9 minutes?"
                answer: "36"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "3 rulers cost 90p. How much does 1 ruler cost? Type the pence."
            answer: "30"
          - id: l1-c2
            type: text_input
            text: "1 bus ticket costs £3. How much do 6 tickets cost? Type the pounds."
            answer: "18"
          - id: l1-c3
            type: multiple_choice
            text: "4 boxes hold 32 crayons. Each box holds the same. How many crayons are in 7 boxes?"
            options: ["56", "35", "28"]
            answer: "56"
          - id: l1-c4
            type: text_input
            text: "5 pears cost £2.50. How much does 1 pear cost? Type the pence."
            answer: "50"
          - id: l1-c5
            type: multiple_choice
            text: "2 boxes hold 18 eggs. Each box holds the same. How many eggs are in 7 boxes?"
            options: ["63", "23", "54"]
            answer: "63"
          - id: l1-c6
            type: true_false
            text: "3 comics cost £12. So 4 comics cost £13."
            say: "Is it true? Three comics cost twelve pounds. So four comics cost thirteen pounds."
            answer: false

  - n: 2
    title: { de: Rezepte und Strecken, en: Recipes and journeys }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "5 pencils cost 50p. How much does 1 pencil cost? Type the pence."
            answer: "10"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "1 apple costs 20p. How much do 6 apples cost?"
            options: ["£1.20", "26p", "£6.20"]
            answer: "£1.20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Pancakes for 4 people: 2 eggs, 200 g flour, 400 ml milk. For 8 people: double it all."
            say: "This pancake recipe is for four people: two eggs, two hundred grams of flour and four hundred millilitres of milk. For eight people you need twice as much of everything: four eggs, four hundred grams of flour, eight hundred millilitres of milk."
            show: { drawn: table, rows: [["People", "Eggs", "Flour", "Milk"], [4, 2, "200 g", "400 ml"], [8, 4, "400 g", "800 ml"]] }
          - text: "For 2 people: halve it all. 1 egg, 100 g flour, 200 ml milk."
            say: "For two people, halve everything: one egg, one hundred grams of flour and two hundred millilitres of milk."
            show: { drawn: table, rows: [["People", "Eggs", "Flour", "Milk"], [4, 2, "200 g", "400 ml"], [2, 1, "100 g", "200 ml"]] }
          - text: "For 6 people: 4 people + 2 people. 2 + 1 = 3 eggs, 200 g + 100 g = 300 g flour."
            say: "For six people, add the amounts for four and for two. Two eggs plus one egg is three eggs. Two hundred grams plus one hundred grams is three hundred grams of flour."
            show: { drawn: table, rows: [["People", "Eggs", "Flour", "Milk"], [4, 2, "200 g", "400 ml"], [2, 1, "100 g", "200 ml"], [6, 3, "300 g", "600 ml"]] }
          - text: "1 egg boils in 8 minutes. 3 eggs in the same pan still take 8 minutes."
            say: "Careful: not everything grows. One egg takes eight minutes to boil. Three eggs in the same pan also take eight minutes, not twenty-four. Ask yourself: does more of one thing really mean more of the other?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Squash for 4 people needs 200 ml of juice. How much juice for 8 people?"
                options: ["400 ml", "204 ml", "800 ml"]
                answer: "400 ml"
                feedback:
                  "204 ml": "Twice as many people need twice as much juice, not 4 ml more."
                hints:
                  - "8 people is twice as many as 4."
                  - "Double 200 ml."
                  - "400 ml."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Pancakes for 4 people: 2 eggs and 200 g of flour. What do you need for 2 people?"
                frame: "eggs: _   flour: _ g"
                options: ["1", "4", "100", "400"]
                answer: ["1", "100"]
                hints:
                  - "2 people is half of 4 people."
                  - "Halve 2 eggs and halve 200 g."
                  - "1 egg and 100 g."
              - id: l2-f3
                type: text_input
                text: "Pancakes for 4 people need 400 ml of milk. How much milk for 6 people? Type the millilitres."
                answer: "600"
                hints:
                  - "6 people is 4 people and 2 people."
                  - "For 2 people you need half of 400 ml, which is 200 ml."
                  - "400 ml + 200 ml = 600 ml."
              - id: l2-f4
                type: multiple_choice
                text: "1 egg takes 8 minutes to boil. How long do 3 eggs take, boiled together in one pan?"
                options: ["8 minutes", "24 minutes", "11 minutes"]
                answer: "8 minutes"
                feedback:
                  "24 minutes": "The eggs boil at the same time in one pan, so it does not take three times as long."
                hints:
                  - "Do the eggs boil one after the other or all at once?"
                  - "They are in the pan together."
                  - "Still 8 minutes."
              - id: l2-f5
                type: multiple_choice
                text: "Rice for 3 people: 150 g. How much rice for 5 people?"
                options: ["250 g", "300 g", "152 g"]
                answer: "250 g"
                hints:
                  - "Find the rice for 1 person first."
                  - "150 g ÷ 3 = 50 g for each person."
                  - "5 × 50 g = 250 g."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "A cake for 6 people needs 3 eggs. How many eggs does a cake for 12 people need?"
                answer: "6"
                hints: ["12 people is twice as many as 6."]
              - id: l2-s2
                type: multiple_choice
                text: "Fruit salad for 4 people uses 8 strawberries. How many strawberries for 3 people?"
                options: ["6", "7", "2"]
                answer: "6"
                hints: ["How many strawberries for 1 person?"]
              - id: l2-s3
                type: true_false
                text: "One child walks to the park in 3 minutes. Four children walking together take 12 minutes."
                say: "Is it true? One child walks to the park in three minutes. Four children walking together take twelve minutes."
                answer: false
                hints: ["Do they walk one after the other?"]
              - id: l2-s4
                type: text_input
                text: "A cyclist rides 12 km in 1 hour. How far does she ride in 4 hours at the same speed? Type the kilometres."
                answer: "48"
                hints: ["4 × 12 km."]
              - id: l2-s5
                type: multiple_choice
                text: "Which one grows in proportion?"
                options: ["the cost of pens at 40p each", "the time a song lasts when more people sing it", "the time 2 towels take to dry side by side"]
                answer: "the cost of pens at 40p each"
                hints: ["Ask: does more of one thing really mean more of the other?"]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Soup for 2 people needs 300 ml of stock. How much for 6 people? Type the millilitres."
                answer: "900"
              - id: l2-n2
                type: text_input
                text: "8 biscuits cost £2. How many biscuits can you buy for £5?"
                answer: "20"
              - id: l2-n3
                type: multiple_choice
                text: "A recipe for 4 people uses 6 potatoes. How many potatoes for 10 people?"
                options: ["15", "12", "60"]
                answer: "15"
              - id: l2-n4
                type: true_false
                text: "5 bags of sand weigh 10 kg together. Each bag weighs the same. So 1 bag weighs 2 kg."
                say: "Is it true? Five bags of sand weigh ten kilograms together. Each bag weighs the same. So one bag weighs two kilograms."
                answer: true
              - id: l2-n5
                type: text_input
                text: "A tap fills 3 buckets in 6 minutes. How long does it take to fill 5 buckets at the same rate? Type the minutes."
                answer: "10"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: via-one
            type: text_input
            text: "6 notebooks cost £18. How much do 4 notebooks cost? Type the pounds."
            answer: "12"
          - id: l2-c2
            part: via-one
            type: multiple_choice
            text: "5 packs hold 40 stickers. Each pack holds the same. How many stickers are in 2 packs?"
            options: ["16", "37", "20"]
            answer: "16"
          - id: l2-c3
            part: scale
            type: fill_in_blank
            text: "Pizza dough for 4 people: 400 g of flour and 2 teaspoons of yeast. What do you need for 8 people?"
            frame: "flour: _ g   yeast: _ teaspoons"
            options: ["2", "4", "404", "800"]
            answer: ["800", "4"]
          - id: l2-c4
            part: not-proportional
            type: multiple_choice
            text: "One tray of biscuits takes 10 minutes to bake. How long do 2 trays take, side by side in the same oven?"
            options: ["10 minutes", "20 minutes", "12 minutes"]
            answer: "10 minutes"
          - id: l2-c5
            part: scale
            type: text_input
            text: "A bus travels 30 miles in 1 hour. How far does it travel in 3 hours at the same speed? Type the miles."
            answer: "90"
          - id: l2-c6
            part: via-one
            type: text_input
            text: "7 cinema tickets cost £42. How much do 3 tickets cost? Type the pounds."
            answer: "18"
          - id: l2-c7
            part: via-one
            type: fill_in_blank
            text: "Each bag holds the same number of marbles. Fill in the table."
            show: { drawn: table, rows: [["Bags", "Marbles"], [4, 24], [1, "?"], [6, "?"]] }
            frame: "1 bag: _ marbles   6 bags: _ marbles"
            options: ["6", "20", "26", "36"]
            answer: ["6", "36"]
          - id: l2-c8
            part: via-one
            type: true_false
            text: "5 lollies cost 60p. So 2 lollies cost 24p."
            say: "Is it true? Five lollies cost sixty pence. So two lollies cost twenty-four pence."
            answer: true
          - id: l2-c9
            part: via-one
            type: multiple_choice
            text: "9 copies of the same book weigh 1800 g together. How much do 4 copies weigh?"
            options: ["800 g", "900 g", "400 g"]
            answer: "800 g"
          - id: l2-c10
            part: via-one
            type: text_input
            text: "4 shelves hold 32 books. Each shelf holds the same. How many books do 9 shelves hold?"
            answer: "72"
          - id: l2-c11
            part: scale
            type: text_input
            text: "A recipe for 4 people uses 300 g of pasta. How much pasta do 2 people need? Type the grams."
            answer: "150"
          - id: l2-c12
            part: scale
            type: multiple_choice
            text: "Biscuits for 6 people need 120 g of butter. How much butter do you need for 9 people?"
            options: ["180 g", "123 g", "240 g"]
            answer: "180 g"
          - id: l2-c13
            part: scale
            type: fill_in_blank
            text: "Smoothies for 2 people: 4 bananas and 300 ml of milk. What do you need for 6 people?"
            frame: "bananas: _   milk: _ ml"
            options: ["8", "12", "600", "900"]
            answer: ["12", "900"]
          - id: l2-c14
            part: scale
            type: text_input
            text: "Nina walks 8 km in 2 hours at a steady pace. How far does she walk in 5 hours at the same pace? Type the kilometres."
            answer: "20"
          - id: l2-c15
            part: scale
            type: true_false
            text: "Lemonade for 4 people needs 6 lemons. So lemonade for 8 people needs 10 lemons."
            say: "Is it true? Lemonade for four people needs six lemons. So lemonade for eight people needs ten lemons."
            answer: false
          - id: l2-c16
            part: not-proportional
            type: true_false
            text: "A bath takes 10 minutes to fill. Two children share the bath. So it takes 20 minutes to fill."
            say: "Is it true? A bath takes ten minutes to fill. Two children share the bath. So it takes twenty minutes to fill."
            answer: false
          - id: l2-c17
            part: not-proportional
            type: multiple_choice
            text: "Ella is 8 and her brother is 4. When Ella is 16, how old will her brother be?"
            options: ["12", "8", "16"]
            answer: "12"
          - id: l2-c18
            part: not-proportional
            type: multiple_choice
            text: "Which one does not grow in proportion?"
            options: ["the cost of apples at 20p each", "the number of wheels on bikes, 2 on each", "the time a bus takes to reach town when 20 more people get on"]
            answer: "the time a bus takes to reach town when 20 more people get on"
          - id: l2-c19
            part: not-proportional
            type: true_false
            text: "1 ice lolly costs 40p. 3 ice lollies cost three times as much: £1.20."
            say: "Is it true? One ice lolly costs forty pence. Three ice lollies cost three times as much: one pound twenty."
            answer: true
          - id: l2-c20
            part: not-proportional
            type: text_input
            text: "Mo swims one length of the pool in 2 minutes. He swims 6 lengths, one after the other, at the same speed. How many minutes does that take?"
            answer: "12"
