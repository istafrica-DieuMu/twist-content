# Lesson set: Maths, Year 4. Hand-authored draft.
id: en-GB.math.table-7
skill: math.mult-div.table-7
curriculum: en-GB
language: en
title:
  de: Die Siebenerreihe
  en: The 7 times table
summary: >
  The 7 times table, the one with the fewest shortcuts. Lesson 1 builds
  it from five sevens (6 × 7 is 5 × 7 and one more 7) on an array;
  lesson 2 uses the commutative law, the 10 times table (9 × 7 is
  70 take away 7) and the two facts to learn by heart (7 × 7 and 7 × 8),
  and ends with the skill check.
metadata:
  year: year-4
  topic: { de: Einmaleins, en: Times tables }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.derive-facts]
  also_practises: [math.mult-div.derive-facts, math.mult-div.commutative]
  vocabulary: { en: [7 times table, multiple, count in sevens, array, row, swap, 10 times table] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: [operation-signs]
  parts:
    - { id: facts, what: { de: die Aufgaben der Siebenerreihe, en: the 7 times table facts } }
    - { id: count, what: { de: in Siebenerschritten zählen und die Zahlen der Reihe erkennen, en: counting in sevens and spotting multiples of 7 } }
    - { id: helpers, what: { de: mit Hilfsaufgaben rechnen, en: working out a fact from a helper fact } }
    - { id: in-context, what: { de: Sachaufgaben mit der Siebenerreihe, en: word problems with the 7 times table } }
  misconceptions:
    - id: add-the-factor
      what: Adds the first number instead of one more 7 when going on from 5 × 7 (6 × 7 = 35 + 6 = 41)
      addressed: lesson 1 Learn shows 6 × 7 as five red rows and one blue row of seven; l1-f2 has 6 and 41 as chips with feedback on 41, l1-f4 asks whether 6 × 7 is 41
    - id: seven-eight
      what: Mixes up 7 × 8 with the numbers next to it (54, 58)
      addressed: lesson 2 Learn gives "5, 6, 7, 8" (56 = 7 × 8); l1-f5 has 54 with feedback, l1-n4 asks whether 8 × 7 is 54, 7 × 8 or 8 × 7 comes in every stage of lesson 2 (l2-f4, l2-s2, l2-n5), and l2-c17 asks for 8 packs of 7
    - id: ten-minus-one
      what: Takes away 1 instead of 7 when using the 10 times table (9 × 7 = 70 − 1)
      addressed: lesson 2 Learn takes one row of seven away from ten rows; l2-f2 has 1 and 69 as chips with feedback on 69, l2-s2 has 2 and 68 (two taken away instead of two sevens)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit fünf mal sieben", en: "From five sevens" }
    goal:
      de: "Bau die Siebenerreihe von fünf mal sieben aus. 5 mal 7 ist 35, also ist 6 mal 7 gleich 42."
      en: "Build the 7 times table from five sevens. 5 times 7 is 35, so 6 times 7 is 42."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "35 + 7 = _"
            say: "Thirty-five add seven."
            answer: "42"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Double 14 = _"
            say: "What is double fourteen?"
            answer: "28"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "How many days are there in 7 weeks? Have a guess."
            say: "A week has seven days. How many days do you think there are in seven weeks? Have a guess."
          - text: "7, 14, 21, 28, 35, 42, 49, 56, 63, 70"
            say: "This is the 7 times table. Count on in sevens: seven, fourteen, twenty-one, and keep going up to seventy. The seventh number is forty-nine, so seven weeks are forty-nine days."
          - text: "5 × 7 = 35, so 6 × 7 = 35 + 7 = 42"
            say: "Five rows of seven make thirty-five. Six rows of seven is one more row, so one more seven. Thirty-five add seven is forty-two."
            show: { drawn: dots, array: [6, 7], split_rows: 5 }
          - text: "8 × 7 = 5 × 7 + 3 × 7 = 35 + 21 = 56"
            say: "Split eight rows of seven into five rows and three rows. Five sevens are thirty-five, three sevens are twenty-one. Together they make fifty-six."
            show: { drawn: dots, array: [8, 7], split_rows: 5 }
          - text: "Did you know? A year has 365 days: 52 weeks and 1 day. So your birthday moves on one day of the week each year."
            say: "Did you know? A year has three hundred and sixty-five days. That is fifty-two weeks and one day more. So if your birthday is on a Monday this year, next year it will be on a Tuesday. In a leap year, with its extra day in February, it jumps two days!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Count in sevens. Which number is missing?"
                frame: "14, 21, _, 35"
                options: ["27", "28", "29"]
                answer: ["28"]
                hints:
                  - "Each number is seven more than the one before."
                  - "Start at 21 and count on seven."
                  - "21 + 7 = 28."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Use 5 × 7 to find 6 × 7."
                say: "Six times seven. Five times seven is thirty-five. How much more do you add?"
                frame: "6 × 7 = 35 + _ = _"
                options: ["6", "7", "41", "42"]
                answer: ["7", "42"]
                feedback:
                  "41": "Six sevens are one more row of seven, so add seven, not six."
                hints:
                  - "Six rows of seven is one more row than five rows."
                  - "One row has seven dots. Thirty-five add seven."
                  - "7 and 42."
                show: { drawn: dots, array: [6, 7], split_rows: 5 }
              - id: l1-f3
                type: text_input
                text: "7 × 7 = _"
                say: "Seven times seven."
                answer: "49"
                hints:
                  - "Split it: five sevens and two sevens."
                  - "5 × 7 = 35 and 2 × 7 = 14."
                  - "35 + 14 = 49."
              - id: l1-f4
                type: true_false
                text: "Is it true? 6 × 7 = 41"
                say: "Six times seven is forty-one. Is it true?"
                answer: false
                hints:
                  - "Five times seven is thirty-five."
                  - "Six sevens is one more seven, not one more six."
                  - "No. 6 × 7 = 42."
              - id: l1-f5
                type: multiple_choice
                text: "Which number is a multiple of 7?"
                options: ["54", "56", "58"]
                answer: "56"
                feedback:
                  "54": "54 is 6 × 9. 8 × 7 is 56."
                hints:
                  - "Count on in sevens from 49."
                  - "7 × 7 = 49, so 8 × 7 is seven more."
                  - "49 + 7 = 56."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Count in sevens. Which number is missing?"
                frame: "42, _, 56, 63"
                options: ["48", "49", "50"]
                answer: ["49"]
                hints: ["How much do you add each time?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Split 9 × 7 into 5 × 7 and 4 × 7."
                say: "Work out five times seven and four times seven. Then nine times seven."
                frame: "5 × 7 = _, 4 × 7 = _, so 9 × 7 = _"
                options: ["28", "35", "62", "63"]
                answer: ["35", "28", "63"]
                hints: ["Nine sevens are five sevens and four sevens together: 35 + 28."]
              - id: l1-s3
                type: text_input
                text: "6 × 7 = _"
                say: "Six times seven."
                answer: "42"
                hints: ["Five sevens and one more seven."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 4 × 7 = 28"
                say: "Four times seven is twenty-eight. Is it true?"
                answer: true
                hints: ["2 × 7 = 14. Double it."]
              - id: l1-s5
                type: multiple_choice
                text: "Which number is a multiple of 7?"
                options: ["34", "35", "36"]
                answer: "35"
                hints: ["What is 5 × 7?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Count in sevens. Which number is missing?"
                frame: "56, 63, _"
                options: ["69", "70", "71"]
                answer: ["70"]
              - id: l1-n2
                type: fill_in_blank
                text: "Use 5 × 7 to find 7 × 7."
                say: "Seven times seven. Five times seven is thirty-five. How much more do you add?"
                frame: "7 × 7 = 35 + _ = _"
                options: ["7", "14", "42", "49"]
                answer: ["14", "49"]
              - id: l1-n3
                type: text_input
                text: "9 × 7 = _"
                say: "Nine times seven."
                answer: "63"
              - id: l1-n4
                type: true_false
                text: "Is it true? 8 × 7 = 54"
                say: "Eight times seven is fifty-four. Is it true?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "There are 7 days in a week. How many days are there in 4 weeks?"
                answer: "28"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "2 × 7 = _"
            say: "Two times seven."
            answer: "14"
          - id: l1-c2
            type: fill_in_blank
            text: "Use 7 × 5 to find 7 × 9."
            say: "Seven times nine. Seven times five is thirty-five. How much more do you add?"
            frame: "7 × 9 = 35 + _ = _"
            options: ["28", "35", "56", "63"]
            answer: ["28", "63"]
          - id: l1-c3
            type: true_false
            text: "Is it true? 45 is a multiple of 7."
            say: "Forty-five is a multiple of seven. Is it true?"
            answer: false
          - id: l1-c4
            type: text_input
            text: "4 × 7 = _"
            say: "Four times seven."
            answer: "28"
          - id: l1-c5
            type: fill_in_blank
            text: "Count in sevens. Which number is missing?"
            say: "Count in sevens. Which number is missing?"
            frame: "35, 42, _, 56"
            options: ["49", "48", "50"]
            answer: ["49"]
          - id: l1-c6
            type: true_false
            text: "Is it true? 7 × 6 = 42"
            say: "Seven times six is forty-two. Is it true?"
            answer: true

  - n: 2
    title: { de: "Tauschen und merken", en: "Swap and remember" }
    goal:
      de: "Tausch Zahlen, nutze die Zehnerreihe für die Siebener und lern 7 mal 7 ist 49 auswendig."
      en: "Swap numbers, use the 10 times table for sevens, and learn that 7 times 7 is 49 by heart."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Count in sevens. Which number is missing?"
            frame: "28, 35, _, 49"
            options: ["41", "42", "43"]
            answer: ["42"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Work out 5 × 7, then 10 × 7."
            say: "Work out five times seven, then ten times seven."
            frame: "5 × 7 = _, 10 × 7 = _"
            options: ["35", "70", "75"]
            answer: ["35", "70"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Which do you think is more: 7 × 3 or 3 × 7?"
            say: "Seven threes or three sevens. Which do you think is more? Or are they the same? Have a guess."
          - text: "7 × 3 = 3 × 7 = 21"
            say: "You already know many 7 times table facts from other tables. Seven times three is the same as three times seven: twenty-one. Swapping the numbers does not change the answer."
            show: { drawn: dots, array: [3, 7] }
          - text: "10 × 7 = 70, so 9 × 7 = 70 − 7 = 63"
            say: "Nine sevens are one row fewer than ten sevens. So take away a whole seven: seventy take away seven is sixty-three."
            show: { drawn: dots, array: [9, 7] }
          - text: "7 × 7 = 49 and 56 = 7 × 8"
            say: "Learn two facts by heart. Seven times seven is forty-nine. For seven times eight, say five, six, seven, eight: fifty-six is seven times eight."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "7 × 4: which fact gives the same answer?"
                say: "Seven times four. Which fact gives the same answer?"
                options: ["4 × 7", "7 × 7", "4 + 7"]
                answer: "4 × 7"
                feedback:
                  "4 + 7": "That is an addition. Swap the two numbers but keep the times sign."
                hints:
                  - "Swap the two numbers round."
                  - "Seven times four becomes four times seven."
                  - "4 × 7."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Use 10 × 7 to find 9 × 7."
                say: "Nine times seven. Ten times seven is seventy. How much do you take away?"
                frame: "9 × 7 = 70 − _ = _"
                options: ["1", "7", "63", "69"]
                answer: ["7", "63"]
                feedback:
                  "69": "Nine sevens are one whole row of seven fewer than ten sevens. Take away seven, not one."
                hints:
                  - "Nine sevens are one row fewer than ten sevens."
                  - "One row has seven dots. Seventy take away seven."
                  - "7 and 63."
              - id: l2-f3
                type: fill_in_blank
                text: "Swap the numbers to find 7 × 6."
                say: "Seven times six. Swap the numbers and work it out."
                frame: "7 × 6 = _ × 7 = _"
                options: ["6", "7", "42", "49"]
                answer: ["6", "42"]
                hints:
                  - "Swap the two numbers round."
                  - "Seven times six becomes six times seven: five sevens and one more seven."
                  - "6 and 42."
              - id: l2-f4
                type: true_false
                text: "Is it true? 7 × 8 = 56"
                say: "Seven times eight is fifty-six. Is it true?"
                answer: true
                hints:
                  - "Say it in order: five, six, seven, eight."
                  - "56 = 7 × 8."
                  - "Yes, it is true."
              - id: l2-f5
                type: fill_in_blank
                text: "Count back in sevens. Which number is missing?"
                frame: "63, 56, _, 42"
                options: ["48", "49", "50"]
                answer: ["49"]
                hints:
                  - "Each number is seven less than the one before."
                  - "Start at 56 and count back seven."
                  - "56 − 7 = 49."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "7 × 9: which fact gives the same answer?"
                say: "Seven times nine. Which fact gives the same answer?"
                options: ["9 × 7", "9 + 7", "7 × 7"]
                answer: "9 × 7"
                hints: ["Swap the two numbers round."]
              - id: l2-s2
                type: fill_in_blank
                text: "Use 10 × 7 to find 8 × 7."
                say: "Eight times seven. Ten times seven is seventy. How much do you take away?"
                frame: "8 × 7 = 70 − _ = _"
                options: ["2", "14", "56", "68"]
                answer: ["14", "56"]
                hints: ["Eight sevens are two rows of seven fewer than ten sevens. 2 × 7 = 14."]
              - id: l2-s3
                type: text_input
                text: "4 ladybirds have 7 spots each. How many spots is that? 7 × 4 = _"
                say: "Four ladybirds have seven spots each. How many spots is that? Seven times four."
                show: { object: ladybird, count: 4 }
                answer: "28"
                hints: ["Swap it: four times seven."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 7 × 7 = 47"
                say: "Seven times seven is forty-seven. Is it true?"
                answer: false
                hints: ["Five sevens and two sevens: 35 + 14."]
              - id: l2-s5
                type: fill_in_blank
                text: "Count back in sevens. Which number is missing?"
                frame: "70, 63, _, 49"
                options: ["54", "56", "57"]
                answer: ["56"]
                hints: ["Take seven away each time."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "There are 7 days in a week. How many days are there in 9 weeks?"
                answer: "63"
              - id: l2-n2
                type: text_input
                text: "Ava buys 6 packs of stickers. Each pack has 7 stickers. How many stickers does she have?"
                answer: "42"
              - id: l2-n3
                type: text_input
                text: "A cinema row has 7 seats. How many seats are there in 3 rows?"
                answer: "21"
              - id: l2-n4
                type: true_false
                text: "Is it true? 7 × 6 = 49"
                say: "Seven times six is forty-nine. Is it true?"
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Work out 7 × 8 and 7 × 7."
                say: "Work out seven times eight and seven times seven."
                frame: "7 × 8 = _, 7 × 7 = _"
                options: ["47", "49", "54", "56"]
                answer: ["56", "49"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: facts
            type: text_input
            text: "7 × 2 = _"
            say: "Seven times two."
            answer: "14"
          - id: l2-c2
            part: in-context
            type: text_input
            text: "A bus ticket costs £7. How much do 5 tickets cost? Type the pounds."
            answer: "35"
          - id: l2-c3
            part: count
            type: fill_in_blank
            text: "Count in sevens. Which number is missing?"
            frame: "21, 28, _, 42"
            options: ["34", "35", "36"]
            answer: ["35"]
          - id: l2-c4
            part: facts
            type: true_false
            text: "Is it true? 7 × 6 = 48"
            say: "Seven times six is forty-eight. Is it true?"
            answer: false
          - id: l2-c5
            part: count
            type: multiple_choice
            text: "Which number is not a multiple of 7?"
            options: ["42", "48", "63"]
            answer: "48"
          - id: l2-c6
            part: facts
            type: text_input
            text: "7 × 6 = _"
            say: "Seven times six."
            answer: "42"
          - id: l2-c7
            part: facts
            type: text_input
            text: "7 × 9 = _"
            say: "Seven times nine."
            answer: "63"
          - id: l2-c8
            part: facts
            type: multiple_choice
            text: "_ × 7 = 49"
            say: "What times seven is forty-nine?"
            options: ["7", "6", "8"]
            answer: "7"
          - id: l2-c9
            part: count
            type: true_false
            text: "Is it true? 63 is a multiple of 7."
            say: "Sixty-three is a multiple of seven. Is it true?"
            answer: true
          - id: l2-c10
            part: count
            type: fill_in_blank
            text: "Count back in sevens. Which number is missing?"
            say: "Count back in sevens. Which number is missing?"
            frame: "56, 49, _, 35"
            options: ["42", "43", "41"]
            answer: ["42"]
          - id: l2-c11
            part: count
            type: multiple_choice
            text: "Which number is a multiple of 7?"
            say: "Which number is a multiple of seven?"
            options: ["27", "47", "49"]
            answer: "49"
          - id: l2-c12
            part: helpers
            type: fill_in_blank
            text: "Use 7 × 5 to find 7 × 9."
            say: "Seven times nine. Seven times five is thirty-five. How much more do you add?"
            frame: "7 × 9 = 35 + _ = _"
            options: ["28", "35", "56", "63"]
            answer: ["28", "63"]
          - id: l2-c13
            part: helpers
            type: fill_in_blank
            text: "Use 7 × 2 to find 7 × 4."
            say: "Seven times four. Seven times two is fourteen. How much more do you add?"
            frame: "7 × 4 = 14 + _ = _"
            options: ["2", "14", "16", "28"]
            answer: ["14", "28"]
          - id: l2-c14
            part: helpers
            type: fill_in_blank
            text: "Swap the numbers to find 7 × 2."
            say: "Seven times two. Swap the numbers."
            frame: "7 × 2 = _ × 7 = _"
            options: ["2", "14", "9", "72"]
            answer: ["2", "14"]
          - id: l2-c15
            part: helpers
            type: multiple_choice
            text: "7 × 5: which fact gives the same answer?"
            say: "Seven times five. Which fact gives the same answer?"
            options: ["5 × 7", "7 × 6", "5 + 7"]
            answer: "5 × 7"
          - id: l2-c16
            part: helpers
            type: true_false
            text: "Is it true? 7 × 4 = 7 × 5 − 7"
            say: "Seven times four is seven times five take away seven. Is it true?"
            answer: true
          - id: l2-c17
            part: in-context
            type: text_input
            text: "A pack has 7 pencils. How many pencils are in 8 packs?"
            say: "A pack has seven pencils. How many pencils are in eight packs?"
            answer: "56"
          - id: l2-c18
            part: in-context
            type: text_input
            text: "Sam swims 7 lengths every day. How many lengths does he swim in 4 days?"
            say: "Sam swims seven lengths every day. How many lengths does he swim in four days?"
            answer: "28"
          - id: l2-c19
            part: in-context
            type: multiple_choice
            text: "The summer holidays last 6 weeks. There are 7 days in a week. How many days is that?"
            say: "The summer holidays last six weeks. There are seven days in a week. How many days is that?"
            options: ["42", "36", "13"]
            answer: "42"
          - id: l2-c20
            part: in-context
            type: text_input
            text: "Football stickers cost 7p each. How much do 3 stickers cost? Type the pence."
            say: "Football stickers cost seven pence each. How much do three stickers cost? Type the pence."
            answer: "21"
