# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-short-texts
skill: fl.reading.short-texts
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Kurze Texte lesen (Französisch)
  en: Reading short texts in French
summary: >
  Reading short French texts with pictures and understanding the main
  points: a profile, a holiday postcard, a picture-book page about a lost
  cat, a small comic. Lesson 1 reads profiles and postcards and finds who
  writes, where they are and what they do; lesson 2 reads short stories and
  comics, finds who is in them and what happens, puts the events in order,
  and ends with the skill check. The voice gives the instructions in English
  and does not read the French text, so every task tests reading.
metadata:
  year: ly-3
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.sentences, fl.reading.sound-spelling]
  also_practises: [fl.culture-strategies.guess-meaning, fl.themes.family, fl.themes.weather, fl.themes.hobbies]
  vocabulary: { fr: [nom, âge, "j'habite à", animal, "j'aime", cher, chère, bisous, les vacances, la mer, il fait beau, nager, un jour, cherche, sous, trouve, la boîte, il pleut] }
  forms: [text, picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: every-word
      what: Stops at the first unknown word and thinks the text cannot be read
      addressed: lesson 1 Learn says you do not need every word and to look for the words you know; the full-stage hints name a word to look for
    - id: cher-bisous
      what: Takes the name after Cher or Chère for the writer of a postcard
      addressed: lesson 1 Learn shows that Cher or Chère names the reader and the name after Bisous is the writer; l1-f2 and l1-s3 give feedback on the Cher name
    - id: word-not-text
      what: Picks an option because a word from the text appears in it, not because the text says it
      addressed: l2-f2 and l2-f5 offer places from the story that are the wrong answer, with feedback sending the child back to the sentence; l2-s4 and l2-c2 do the same without help
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Steckbriefe und Postkarten, en: Profiles and postcards }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Le chat est sous la table."
            say: { en: "Read the sentence. Which picture matches?" }
            options: [{ object: cat }, { object: dog }, { object: mouse }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Il fait beau aujourd'hui.\n\nIs it sunny today?"
            say: { en: "Read the sentence. Is it sunny today?" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Nom : Jules\nÂge : 9 ans\nJ'habite à : Lyon\nAnimal : un lapin\nJ'aime : le foot et la pizza"
            say: { en: "This is a profile. On the left it says what each line is about. Nom is name, âge is age, j'habite à is where I live, animal is pet. On the right is the answer. Jules is nine, lives in Lyon and has a rabbit." }
            show: { object: rabbit }
          - text: "Chère mamie,\nJe suis en vacances à la mer. Il fait beau et chaud. Tous les jours, je nage dans la mer.\nBisous,\nEmma"
            say: { en: "This is a postcard. After chère comes the person it is for: Grandma. At the end, after bisous, comes the person who wrote it: Emma. Emma is on holiday by the sea and swims every day." }
            show: { object: sun }
          - text: "Cher, Chère = to whom?\nBisous = from whom?"
            say: { en: "You do not need to know every word. Keep reading and look for the words you know: mer, beau, nage. Then you already know what it is about." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                option_audio: false
                text: "Nom : Amira\nÂge : 10 ans\nJ'habite à : Lille\nAnimal : un chat\nJ'aime : la danse et les livres\n\nHow old is Amira?"
                say: { en: "Read the profile. How old is Amira?" }
                options: ["9", "10", "11"]
                answer: "10"
                hints:
                  - "Find the line about age."
                  - "Âge means age."
                  - "Âge : 10 ans. Amira is ten."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Cher Max,\nJe suis à la ferme de papi. Il y a des vaches et des cochons. J'aide papi tous les jours.\nBisous,\nHugo\n\nWho wrote the postcard?"
                say: { en: "Read the postcard. Who wrote it?" }
                options: ["Max", "Hugo", "Grandpa"]
                answer: "Hugo"
                feedback:
                  "Max": "After cher comes the person the card is for. The writer comes after bisous."
                  "Grandpa": "Grandpa is in the card, but he did not write it. Look at the name after bisous."
                hints:
                  - "Look at the end of the card."
                  - "The name after bisous is the writer."
                  - "Bisous, Hugo. Hugo wrote the card."
              - id: l1-f3
                type: multiple_choice
                option_audio: false
                text: "Cher Max,\nJe suis à la ferme de papi. Il y a des vaches et des cochons. J'aide papi tous les jours.\nBisous,\nHugo\n\nWhere is Hugo?"
                say: { en: "Read the postcard again. Where is Hugo?" }
                options: ["on a farm", "by the sea", "at school"]
                answer: "on a farm"
                hints:
                  - "Read the first sentence after Cher Max."
                  - "Ferme looks like farm. And there are cows and pigs."
                  - "Hugo is on Grandpa's farm."
              - id: l1-f4
                type: image_multiple_choice
                option_audio: false
                text: "Nom : Oscar\nÂge : 8 ans\nJ'habite à : Paris\nAnimal : un chien\nJ'aime : nager"
                say: { en: "Read the profile. Which pet has Oscar got?" }
                options: [{ object: dog }, { object: cat }, { object: rabbit }]
                answer: dog
                hints:
                  - "Animal means pet."
                  - "Find the line that starts with animal."
                  - "Animal : un chien. Oscar has a dog."
              - id: l1-f5
                type: true_false
                text: "Chers maman et papa,\nJe suis en classe verte. Il pleut et il fait froid, mais c'est super. On chante tous les soirs.\nBisous,\nLucie\n\nIs the weather nice?"
                say: { en: "Read the postcard. Is the weather nice?" }
                answer: false
                hints:
                  - "Find the words about the weather."
                  - "Lucie writes: il pleut et il fait froid."
                  - "No, it is raining and cold."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                option_audio: false
                text: "Nom : Louis\nÂge : 11 ans\nJ'habite à : Marseille\nAnimal : un poisson\nJ'aime : le tennis et la guitare\n\nWhere does Louis live?"
                say: { en: "Read the profile. Where does Louis live?" }
                options: ["in Marseille", "in Lille", "in Paris"]
                answer: "in Marseille"
                hints: ["J'habite à means I live in."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Chère Ella,\nJe suis à la montagne avec ma famille. Il y a beaucoup de neige. Aujourd'hui, j'ai fait un grand bonhomme de neige !\nBisous,\nNoah\n\nWhat did Noah do today?"
                say: { en: "Read the postcard. What did Noah do today?" }
                options: ["He made a snowman.", "He swam in the sea.", "He played football."]
                answer: "He made a snowman."
                hints: ["Read the sentence with aujourd'hui."]
              - id: l1-s3
                type: multiple_choice
                option_audio: false
                text: "Chère Ella,\nJe suis à la montagne avec ma famille. Il y a beaucoup de neige. Aujourd'hui, j'ai fait un grand bonhomme de neige !\nBisous,\nNoah\n\nWho is the card for?"
                say: { en: "Read the postcard again. Who is the card for?" }
                options: ["Ella", "Noah", "Noah's family"]
                answer: "Ella"
                feedback:
                  "Noah": "Noah comes after bisous, so he is the writer. The person the card is for comes after chère."
                hints: ["Look at the name after chère."]
              - id: l1-s4
                type: image_multiple_choice
                option_audio: false
                text: "Nom : Inès\nÂge : 9 ans\nJ'habite à : Nantes\nAnimal : une tortue\nJ'aime : peindre"
                say: { en: "Read the profile. What does Inès like doing?" }
                options: [{ object: paint }, { object: swim }, { object: sing }]
                answer: paint
                hints: ["Find the line with j'aime."]
              - id: l1-s5
                type: true_false
                text: "Chère Zoé,\nJe suis à Londres avec mon école. On visite un musée. Il fait beau !\nBisous,\nThéo\n\nIs Théo in London?"
                say: { en: "Read the postcard. Is Théo in London?" }
                answer: true
                hints: ["Londres is the French name for London."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                option_audio: false
                text: "Nom : Chloé\nÂge : 8 ans\nJ'habite à : Bordeaux\nAnimal : un hamster\nJ'aime : chanter et danser\n\nWhat does Chloé like doing?"
                say: { en: "Read the profile. What does Chloé like doing?" }
                options: ["singing and dancing", "singing and swimming", "reading and dancing"]
                answer: "singing and dancing"
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Cher Léo,\nJe suis chez ma tante à Paris. On mange des croissants tous les matins. C'est délicieux !\nBisous,\nSam\n\nWho wrote the postcard?"
                say: { en: "Read the postcard. Who wrote it?" }
                options: ["Sam", "Léo", "the aunt"]
                answer: "Sam"
              - id: l1-n3
                type: multiple_choice
                option_audio: false
                text: "Cher Léo,\nJe suis chez ma tante à Paris. On mange des croissants tous les matins. C'est délicieux !\nBisous,\nSam\n\nWhat does Sam eat every morning?"
                say: { en: "Read the postcard again. What does Sam eat every morning?" }
                options: ["croissants", "pizza", "crêpes"]
                answer: "croissants"
              - id: l1-n4
                type: true_false
                text: "Nom : Arthur\nÂge : 10 ans\nJ'habite à : Nice\nAnimal : un chat\n\nHas Arthur got a dog?"
                say: { en: "Read the profile. Has Arthur got a dog?" }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                option_audio: false
                text: "Chère mamie,\nJe suis à la mer. Tous les jours, je fais du vélo avec papa.\nBisous,\nLina"
                say: { en: "Read the postcard. What does Lina do every day?" }
                options: [{ object: ride-bike }, { object: swim }, { object: read }]
                answer: ride-bike

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "Nom : Maël\nÂge : 9 ans\nJ'habite à : Rennes\nAnimal : un lapin\n\nWhich pet has Maël got?"
            say: { en: "Read the profile. Which pet has Maël got?" }
            options: ["a rabbit", "a cat", "a fish"]
            answer: "a rabbit"
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Chère Jade,\nJe suis au zoo avec ma classe.\nBisous,\nLéna\n\nWho is the card for?"
            say: { en: "Read the postcard. Who is the card for?" }
            options: ["Jade", "Léna"]
            answer: "Jade"
          - id: l1-c3
            type: true_false
            text: "Chère Jade,\nJe suis au zoo avec ma classe.\nBisous,\nLéna\n\nIs Léna at the zoo?"
            say: { en: "Read the postcard again. Is Léna at the zoo?" }
            answer: true

  - n: 2
    title: { de: Geschichten und Comics, en: Stories and comics }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            text: "Nom : Zoé\nÂge : 8 ans\nAnimal : un chien\n\nHow old is Zoé?"
            say: { en: "Read the profile. How old is Zoé?" }
            options: ["8", "9", "10"]
            answer: "8"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Cher Tom,\nJe suis à la mer.\nBisous,\nAnna\n\nWho wrote it?"
            say: { en: "Read the postcard. Who wrote it?" }
            options: ["Anna", "Tom"]
            answer: "Anna"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Léo a un petit chat. Il s'appelle Mimi. Un jour, Mimi n'est pas dans la maison. Léo cherche dans le jardin. Il cherche sous le lit. Puis il entend « Miaou ! » Mimi est dans une boîte !"
            say: { en: "This is a page from a picture book. Read it slowly. Who is in the story? Léo and his cat Mimi." }
            show: { objects: [cat, box] }
          - text: "un jour = one day\npuis = then\ncherche = looks for"
            say: { en: "Un jour shows that something is about to happen. Mimi is missing. Léo looks for her. Puis shows what comes next. In the end he finds Mimi in a box. French puts speech in these marks: « Miaou ! »." }
          - text: "Ben : Je peux jouer au foot, maman ?\nMaman : Non, désolée. Il pleut.\nBen : D'accord. Alors je lis un livre."
            say: { en: "This is a comic. The name before the colon shows who is speaking. Ben wants to play football, but it is raining. So he reads a book." }
            show: { objects: [rain, book] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Léo a un petit chat. Il s'appelle Mimi. Un jour, Mimi n'est pas dans la maison. Léo cherche dans le jardin. Il cherche sous le lit. Puis il entend « Miaou ! » Mimi est dans une boîte !\n\nWhat is the story about?"
                say: { en: "Read the story. What is it about?" }
                options: ["Léo is looking for his cat.", "Léo is buying a cat.", "Léo is playing in the garden."]
                answer: "Léo is looking for his cat."
                hints:
                  - "What happens after un jour?"
                  - "Mimi is not in the house. Léo looks in the garden and under the bed."
                  - "Léo is looking for Mimi, his cat."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                option_audio: false
                text: "Léo a un petit chat. Il s'appelle Mimi. Un jour, Mimi n'est pas dans la maison. Léo cherche dans le jardin. Il cherche sous le lit. Puis il entend « Miaou ! » Mimi est dans une boîte !\n\nWhere is Mimi in the end?"
                say: { en: "Read the story again. Where is Mimi in the end?" }
                options: ["in a box", "under the bed", "in the garden"]
                answer: "in a box"
                feedback:
                  "under the bed": "Léo looks under the bed, but Mimi is not there. Read the last sentence."
                  "in the garden": "Léo looks in the garden first. Read the last sentence."
                hints:
                  - "Read the last sentence."
                  - "Mimi est dans une boîte."
                  - "Une boîte is a box. Mimi is in a box."
              - id: l2-f3
                type: true_false
                text: "Ben : Je peux jouer au foot, maman ?\nMaman : Non, désolée. Il pleut.\nBen : D'accord. Alors je lis un livre.\n\nCan Ben play football?"
                say: { en: "Read the comic. Can Ben play football?" }
                show: { objects: [rain, book] }
                answer: false
                hints:
                  - "Read what Mum says."
                  - "Maman says: non, désolée. Il pleut."
                  - "No, it is raining. Ben reads a book."
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Léo a un petit chat. Il s'appelle Mimi. Un jour, Mimi n'est pas dans la maison. Léo cherche dans le jardin. Il cherche sous le lit. Puis il entend « Miaou ! » Mimi est dans une boîte !\n\nPut the sentences in order."
                say: { en: "Read the story of Léo and Mimi again. Put the sentences in order." }
                options: ["Il entend « Miaou ! »", "Mimi n'est pas dans la maison.", "Il cherche sous le lit."]
                slot_count: 3
                answer: ["Mimi n'est pas dans la maison.", "Il cherche sous le lit.", "Il entend « Miaou ! »"]
                hints:
                  - "What happens first? Mimi is missing."
                  - "Then Léo looks for her."
                  - "Mimi is missing, Léo looks under the bed, then he hears Miaou."
              - id: l2-f5
                type: image_multiple_choice
                option_audio: false
                text: "Mamie a un chapeau rouge. Un jour, le vent prend le chapeau. Il vole au-dessus de la maison et dans un arbre. Un petit oiseau s'installe dans le chapeau. « Regarde, mamie ! C'est un nid ! » dit Tim."
                say: { en: "Read the story. Where does the hat land?" }
                options: [{ object: tree }, { object: house }, { object: car }]
                answer: tree
                feedback:
                  house: "The hat flies over the house, au-dessus de la maison, but it lands somewhere else. Read on: et dans un ..."
                hints:
                  - "Find the words et dans."
                  - "Il vole au-dessus de la maison et dans un arbre."
                  - "Un arbre is a tree."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Mia : J'ai très faim !\nPapa : Voici un sandwich.\nMia : Merci, papa ! Je peux avoir du jus aussi ?\n\nWhat else does Mia want?"
                say: { en: "Read the comic. What else does Mia want?" }
                options: ["some juice", "a sandwich", "some milk"]
                answer: "some juice"
                hints: ["Read Mia's last line. Aussi means too."]
              - id: l2-s2
                type: multiple_choice
                option_audio: false
                text: "Mamie a un chapeau rouge. Un jour, le vent prend le chapeau. Il vole au-dessus de la maison et dans un arbre. Un petit oiseau s'installe dans le chapeau. « Regarde, mamie ! C'est un nid ! » dit Tim.\n\nWho sits in the hat in the end?"
                say: { en: "Read the story again. Who sits in the hat in the end?" }
                options: ["a bird", "Tim", "Grandma"]
                answer: "a bird"
                hints: ["Un oiseau is a bird."]
              - id: l2-s3
                type: true_false
                text: "Lou : Tu viens au parc ?\nNathan : Oui ! Je prends mon ballon.\n\nIs Nathan going to the park?"
                say: { en: "Read the comic. Is Nathan going to the park?" }
                answer: true
                hints: ["Nathan says oui."]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Le chien de Paul s'appelle Max. Max adore l'eau. Un jour, Paul et Max vont au lac. Paul lit un livre sur le banc. Max saute dans le lac !\n\nWhere does Max jump?"
                say: { en: "Read the story. Where does Max jump?" }
                options: ["into the lake", "onto the bench", "onto the book"]
                answer: "into the lake"
                hints: ["Read the last sentence. Le lac is the lake."]
              - id: l2-s5
                type: ordering
                option_audio: false
                text: "Le chien de Paul s'appelle Max. Max adore l'eau. Un jour, Paul et Max vont au lac. Paul lit un livre sur le banc. Max saute dans le lac !\n\nPut the sentences in order."
                say: { en: "Read the story of Paul and Max again. Put the sentences in order." }
                options: ["Max saute dans le lac.", "Paul et Max vont au lac.", "Paul lit un livre."]
                slot_count: 3
                answer: ["Paul et Max vont au lac.", "Paul lit un livre.", "Max saute dans le lac."]
                hints: ["First they go to the lake."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                option_audio: false
                text: "Clara a un nouveau vélo. Il est bleu. Le samedi, elle fait du vélo avec sa sœur dans le parc.\n\nWhat colour is Clara's bike?"
                say: { en: "Read the text. What colour is Clara's bike?" }
                options: ["blue", "red", "green"]
                answer: "blue"
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "Clara a un nouveau vélo. Il est bleu. Le samedi, elle fait du vélo avec sa sœur dans le parc.\n\nWho does Clara ride with?"
                say: { en: "Read the text again. Who does Clara ride with?" }
                options: ["her sister", "her brother", "her mum"]
                answer: "her sister"
              - id: l2-n3
                type: true_false
                text: "Emma : On mange une glace ?\nLéo : Non merci, j'ai froid !\n\nDoes Léo want an ice cream?"
                say: { en: "Read the comic. Does Léo want an ice cream?" }
                answer: false
              - id: l2-n4
                type: image_multiple_choice
                option_audio: false
                text: "Lucas cherche son ballon. Il n'est pas dans le jardin. Il n'est pas sous la table. Ah ! Il est dans la chambre de sa sœur !"
                say: { en: "Read the story. What is Lucas looking for?" }
                options: [{ object: ball }, { object: cat }, { object: book }]
                answer: ball
              - id: l2-n5
                type: multiple_choice
                option_audio: false
                text: "Lucas cherche son ballon. Il n'est pas dans le jardin. Il n'est pas sous la table. Ah ! Il est dans la chambre de sa sœur !\n\nWhere is it in the end?"
                say: { en: "Read the story again. Where is it in the end?" }
                options: ["in his sister's room", "in the garden", "under the table"]
                answer: "in his sister's room"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            option_audio: false
            text: "Nom : Romane\nÂge : 10 ans\nJ'habite à : Toulouse\nAnimal : un chien\nJ'aime : le tennis\n\nWhat does Romane like?"
            say: { en: "Read the profile. What does Romane like?" }
            options: ["tennis", "football", "painting"]
            answer: "tennis"
          - id: l2-c2
            type: multiple_choice
            option_audio: false
            text: "Un jour, Tom va à la plage avec papa. Ils font un château de sable. Puis une grande vague arrive. Le château a disparu !\n\nWhat happens to the sandcastle?"
            say: { en: "Read the story. What happens to the sandcastle?" }
            options: ["A big wave takes it away.", "Dad takes it home.", "Tom makes it bigger."]
            answer: "A big wave takes it away."
          - id: l2-c3
            type: multiple_choice
            option_audio: false
            text: "Chère Lola,\nJe suis en vacances à la campagne. Il fait chaud. Je joue avec les chèvres !\nBisous,\nAdam\n\nWho wrote the postcard?"
            say: { en: "Read the postcard. Who wrote it?" }
            options: ["Adam", "Lola", "the goats"]
            answer: "Adam"
          - id: l2-c4
            type: true_false
            text: "Maman : Tu as fini tes devoirs ?\nJade : Oui, maman !\n\nHas Jade finished her homework?"
            say: { en: "Read the comic. Has Jade finished her homework?" }
            answer: true
          - id: l2-c5
            type: ordering
            option_audio: false
            text: "Un jour, Tom va à la plage avec papa. Ils font un château de sable. Puis une grande vague arrive. Le château a disparu !\n\nPut the sentences in order."
            say: { en: "Read the story of Tom again. Put the sentences in order." }
            options: ["Une grande vague arrive.", "Tom va à la plage.", "Ils font un château de sable."]
            slot_count: 3
            answer: ["Tom va à la plage.", "Ils font un château de sable.", "Une grande vague arrive."]
