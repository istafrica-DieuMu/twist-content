# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-jobs
skill: fl.themes.jobs
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Berufe (Französisch)
  en: Jobs in French
summary: >
  Naming jobs in French and saying what someone does at work. Lesson 1
  brings médecin, professeur, fermier, cuisinier, policier and pompier with
  il est ... and elle est ..., and two rules that differ from English: there
  is no un or une after est (il est médecin, he's a doctor), and many job
  words change for a woman (cuisinier, cuisinière). Lesson 2 says what each
  one does (le pompier éteint le feu), asks "Qu'est-ce que tu veux faire
  plus tard ?" and answers "Je veux être ...", and ends with the skill
  check. Instructions are in English; the French is spoken and shown.
metadata:
  year: ly-3
  topic: { de: Berufe, en: Jobs }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.he-she-it]
  also_practises: [fl.grammar.he-she-it]
  vocabulary: { fr: [médecin, professeur, professeure, fermier, fermière, cuisinier, cuisinière, policier, policière, pompier, "il est ...", "elle est ...", "Qu'est-ce que tu veux faire plus tard ?", "Je veux être ..."] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: name, what: { de: Berufe auf Französisch verstehen und benennen, en: understanding and naming jobs in French } }
    - { id: est-job, what: { de: "den Beruf mit il est oder elle est nennen, ohne un oder une", en: "saying a job with il est or elle est, with no un or une" } }
    - { id: feminine, what: { de: das Berufswort für eine Frau, en: the job word for a woman } }
    - { id: work, what: { de: "sagen und verstehen, was jemand bei der Arbeit macht", en: saying and understanding what someone does at work } }
    - { id: want, what: { de: "sagen und verstehen, was jemand werden will (je veux être ...)", en: "saying and understanding what someone wants to be (je veux être ...)" } }
  misconceptions:
    - id: article-after-est
      what: Puts un or une before the job, as in English (il est un médecin)
      addressed: lesson 1 Learn says there is no un after est; l1-f3, l1-s3, l1-n3 and l1-c2 offer the form with un, with feedback in l1-f3; l2-f4, l2-n4 and l2-c3 offer je veux être un ... again
    - id: masculine-for-everyone
      what: Uses the masculine job word for a woman or girl (elle est cuisinier)
      addressed: lesson 1 Learn shows cuisinier and cuisinière, fermier and fermière; l1-f6, l1-s5 and l2-c5 ask for the feminine form, with feedback in l1-f6
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Il est médecin.", en: "Il est médecin." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Who is it about, a boy or a girl?"
            say: { en: "Listen. Who is it about, a boy or a girl?" }
            audio: { fr: "Elle joue au tennis." }
            options: [{ object: boy }, { object: girl }]
            answer: girl
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word means he?"
            say: { en: "Which French word means he?" }
            options: ["il", "elle", "je"]
            answer: "il"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "Il est médecin."
            say: { en: "Today we learn jobs in French. Listen and repeat.", fr: "Il est médecin." }
            show: { object: doctor }
          - text: "Elle est professeure."
            say: { en: "And:", fr: "Elle est professeure." }
            show: { object: teacher }
          - text: "Il est fermier. Il est cuisinier. Il est policier. Il est pompier."
            say: { en: "Here are four more. A farmer, a cook, a police officer and a firefighter.", fr: "Il est fermier. Il est cuisinier. Il est policier. Il est pompier." }
            show: { object: firefighter }
          - text: "He's a cook. = Il est cuisinier."
            say: { en: "In English we say he's a cook. In French there is no un after est. You just say il est cuisinier.", fr: "Il est cuisinier." }
            show: { object: cook }
          - text: "il est cuisinier, elle est cuisinière\nil est fermier, elle est fermière\nil est policier, elle est policière"
            say: { en: "Many job words change for a woman. Cuisinier becomes cuisinière. Fermier becomes fermière.", fr: "Il est cuisinier. Elle est cuisinière." }
            show: { object: cook }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Il est fermier." }
                options: [{ object: farmer }, { object: cook }, { object: doctor }]
                answer: farmer
                hints:
                  - "Listen to the last word."
                  - "Fermier sounds a bit like farmer."
                  - "Tap the farmer in the straw hat."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Il est pompier." }
                options: [{ object: police-officer }, { object: firefighter }, { object: teacher }]
                answer: firefighter
                feedback:
                  police-officer: "Policier is the police officer. Listen again: pompier."
                hints:
                  - "Listen again: pompier."
                  - "Policier and pompier both start with p. Pompier puts out fires."
                  - "Tap the firefighter in the red helmet."
              - id: l1-f3
                type: multiple_choice
                text: "How do you say this in French?\nHe's a doctor."
                say: { en: "How do you say this in French?" }
                show: { object: doctor }
                options: ["Il est médecin.", "Il est un médecin.", "Elle est médecin."]
                answer: "Il est médecin."
                option_audio: false
                feedback:
                  "Il est un médecin.": "In French there is no un after est. Il est médecin."
                hints:
                  - "He is il."
                  - "In French, nothing goes between est and the job."
                  - "Il est médecin."
              - id: l1-f4
                type: speak
                say: { en: "Who is it? Say it in French.", fr: "Elle est professeure." }
                show: { object: teacher }
                expected_text: "Elle est professeure."
                hints:
                  - "Listen again and say it with me."
                  - "First elle est, then professeure."
                  - "Say it with me: elle est professeure."
              - id: l1-f5
                type: true_false
                text: "Does it match the picture?\nIl est cuisinier."
                say: { en: "Read the sentence. Does it match the picture?" }
                show: { object: cook }
                answer: true
                hints:
                  - "Look at the hat and the spoon."
                  - "Un cuisinier cooks food."
                  - "Yes, it matches."
              - id: l1-f6
                type: fill_in_blank
                text: "Lucie works in a restaurant kitchen. Finish the sentence."
                say: { en: "Lucie is a cook. Finish the sentence." }
                frame: "Elle est _."
                options: ["cuisinière", "cuisinier", "une cuisinière"]
                answer: ["cuisinière"]
                option_audio: false
                feedback:
                  "cuisinier": "Lucie is a woman, so the word changes: cuisinière."
                  "une cuisinière": "No une after est. Elle est cuisinière."
                hints:
                  - "Lucie is a woman. Does the word change?"
                  - "Cuisinier becomes cuisinière for a woman, and there is no une."
                  - "Elle est cuisinière."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Il est policier." }
                options: [{ object: firefighter }, { object: farmer }, { object: police-officer }]
                answer: police-officer
                hints: ["Policier sounds a bit like police."]
              - id: l1-s2
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Elle est professeure." }
                options: [{ object: doctor }, { object: teacher }, { object: cook }]
                answer: teacher
                hints: ["Une professeure works at a school."]
              - id: l1-s3
                type: multiple_choice
                text: "How do you say this in French?\nHe's a firefighter."
                say: { en: "How do you say this in French?" }
                show: { object: firefighter }
                options: ["Il est un pompier.", "Il est pompier.", "Il pompier."]
                answer: "Il est pompier."
                option_audio: false
                hints: ["You need est, but no un."]
              - id: l1-s4
                type: speak
                say: { en: "Who is it? Say it in French.", fr: "Il est fermier." }
                show: { object: farmer }
                expected_text: "Il est fermier."
                hints: ["Il est, then the job. No un."]
              - id: l1-s5
                type: multiple_choice
                text: "Emma is a farmer. How do you say it in French?"
                say: { en: "Emma is a farmer. How do you say it in French?" }
                options: ["Elle est fermière.", "Elle est fermier.", "Il est fermier."]
                answer: "Elle est fermière."
                option_audio: false
                hints: ["Emma is a woman: elle, and the job word changes."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Il est cuisinier." }
                options: [{ object: cook }, { object: farmer }, { object: teacher }]
                answer: cook
              - id: l1-n2
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Il est médecin." }
                options: [{ object: police-officer }, { object: doctor }, { object: firefighter }]
                answer: doctor
              - id: l1-n3
                type: multiple_choice
                text: "How do you say this in French?\nHe's a police officer."
                say: { en: "How do you say this in French?" }
                show: { object: police-officer }
                options: ["Il est policier.", "Il est un policier.", "Il a policier."]
                answer: "Il est policier."
                option_audio: false
              - id: l1-n4
                type: speak
                say: { en: "Who is it? Say it in French." }
                show: { object: firefighter }
                expected_text: "Il est pompier."
              - id: l1-n5
                type: true_false
                text: "Does it match the picture?\nIl est fermier."
                say: { en: "Read the sentence. Does it match the picture?" }
                show: { object: doctor }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which picture matches?"
            say: { en: "Listen. Which picture matches?" }
            audio: { fr: "Il est pompier." }
            options: [{ object: doctor }, { object: firefighter }, { object: cook }]
            answer: firefighter
          - id: l1-c2
            type: multiple_choice
            text: "How do you say this in French?\nHe's a cook."
            say: { en: "How do you say this in French?" }
            show: { object: cook }
            options: ["Il est un cuisinier.", "Il est cuisinier.", "Elle est cuisinière."]
            answer: "Il est cuisinier."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Does it match the picture?\nElle est professeure."
            say: { en: "Read the sentence. Does it match the picture?" }
            show: { object: teacher }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Which job is it?"
            say: { en: "Listen. Which job is it?" }
            audio: { fr: "Il est policier." }
            options: ["a police officer", "a firefighter", "a farmer"]
            answer: "a police officer"
          - id: l1-c5
            type: true_false
            text: "Is it written correctly?\nIl est un pompier."
            say: { en: "Read the sentence. Is it written correctly?" }
            answer: false
          - id: l1-c6
            type: matching
            option_audio: false
            text: "Match each picture to its job."
            say: { en: "Match each picture to its job." }
            pairs:
              - { left: { object: doctor }, right: { text: "médecin" } }
              - { left: { object: firefighter }, right: { text: "pompier" } }
              - { left: { object: cook }, right: { text: "cuisinier" } }

  - n: 2
    title: { de: "Was willst du werden?", en: "What do you want to be?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Il est fermier." }
            options: [{ object: farmer }, { object: teacher }, { object: police-officer }]
            answer: farmer
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How do you say this in French?\nHe's a doctor."
            say: { en: "How do you say this in French?" }
            options: ["Il est médecin.", "Il est un médecin.", "Il médecin."]
            answer: "Il est médecin."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Le médecin aide les malades."
            say: { en: "This is how you say what someone does at work. The doctor helps people who are ill.", fr: "Le médecin aide les malades." }
            show: { object: doctor }
          - text: "Le fermier travaille à la ferme.\nLe professeur travaille à l'école."
            say: { en: "Travaille means works. The farmer works on the farm. The teacher works at school.", fr: "Le fermier travaille à la ferme. Le professeur travaille à l'école." }
            show: { object: farmer }
          - text: "Le pompier éteint le feu.\nLe cuisinier prépare les repas."
            say: { en: "The firefighter puts out the fire. The cook makes the meals.", fr: "Le pompier éteint le feu. Le cuisinier prépare les repas." }
            show: { object: firefighter }
          - text: "Qu'est-ce que tu veux faire plus tard ?\nJe veux être cuisinier."
            say: { en: "To ask what someone wants to be, say: qu'est-ce que tu veux faire plus tard? Answer with je veux être, then the job. Again, no un.", fr: "Qu'est-ce que tu veux faire plus tard ? Je veux être cuisinier." }
            show: { object: cook }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Who does this job?"
                say: { en: "Listen. Who does this job?" }
                audio: { fr: "Il prépare les repas au restaurant." }
                options: [{ object: cook }, { object: teacher }, { object: farmer }]
                answer: cook
                hints:
                  - "Listen for the place: au restaurant."
                  - "Who makes meals in a restaurant?"
                  - "Tap the cook."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Match each job to what the person does."
                say: { en: "Tap a job, then what that person does at work." }
                option_audio: false
                pairs:
                  - { left: { text: "le professeur" }, right: { text: "travaille à l'école" } }
                  - { left: { text: "le pompier" }, right: { text: "éteint le feu" } }
                  - { left: { text: "le fermier" }, right: { text: "travaille à la ferme" } }
                hints:
                  - "Start with the one you are sure of."
                  - "Ferme is in fermier. Le feu is the fire."
                  - "Professeur and école, pompier and le feu, fermier and la ferme."
              - id: l2-f3
                type: audio_choice
                text: "What does the child want to be?"
                say: { en: "Listen. What does the child want to be?" }
                audio: { turns: [{ fr: "Qu'est-ce que tu veux faire plus tard ?", speaker: female }, { fr: "Je veux être médecin.", speaker: male }] }
                options: [{ object: police-officer }, { object: doctor }, { object: cook }]
                answer: doctor
                hints:
                  - "Listen to the word at the end."
                  - "Médecin is the doctor."
                  - "Tap the doctor."
              - id: l2-f4
                type: ordering
                text: "Build the sentence: I want to be a farmer."
                say: { en: "Build the sentence in French: I want to be a farmer." }
                options: ["veux", "fermier.", "Je", "un", "être"]
                slot_count: 4
                answer: ["Je", "veux", "être", "fermier."]
                option_audio: false
                hints:
                  - "The sentence starts with Je."
                  - "Je veux être, then the job. There is no un, so one card is left over."
                  - "Je veux être fermier."
              - id: l2-f5
                type: speak
                say: { en: "What do you want to be? Answer in French. For example:", fr: "Je veux être professeur." }
                show: { object: teacher }
                expected_text: "Je veux être professeur."
                hints:
                  - "Listen again and say it with me."
                  - "First je veux être, then the job."
                  - "Say it with me: je veux être professeur."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Who does this job?"
                say: { en: "Listen. Who does this job?" }
                audio: { fr: "Elle éteint le feu." }
                options: [{ object: police-officer }, { object: firefighter }, { object: doctor }]
                answer: firefighter
                hints: ["Le feu is the fire."]
              - id: l2-s2
                type: matching
                text: "Match each job to what the person does."
                say: { en: "Tap a job, then what that person does at work." }
                option_audio: false
                pairs:
                  - { left: { text: "le médecin" }, right: { text: "aide les malades" } }
                  - { left: { text: "le cuisinier" }, right: { text: "prépare les repas" } }
                  - { left: { text: "le pompier" }, right: { text: "éteint le feu" } }
                hints: ["Les malades are people who are ill."]
              - id: l2-s3
                type: audio_choice
                text: "What does the child want to be?"
                say: { en: "Listen. What does the child want to be?" }
                audio: { fr: "Je veux être policière.", speaker: female }
                options: [{ object: firefighter }, { object: teacher }, { object: police-officer }]
                answer: police-officer
                hints: ["Policière is a woman police officer."]
              - id: l2-s4
                type: ordering
                text: "Build the question: What do you want to do when you grow up?"
                say: { en: "Build the question in French: what do you want to do when you grow up?" }
                options: ["plus tard ?", "Qu'est-ce que", "faire", "tu veux"]
                slot_count: 4
                answer: ["Qu'est-ce que", "tu veux", "faire", "plus tard ?"]
                option_audio: false
                hints: ["The question starts with Qu'est-ce que."]
              - id: l2-s5
                type: speak
                say: { en: "What do you want to be? Answer in French. For example:", fr: "Je veux être pompier." }
                show: { object: firefighter }
                expected_text: "Je veux être pompier."
                hints: ["First je veux être."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Who does this job?"
                say: { en: "Listen. Who does this job?" }
                audio: { fr: "Il travaille à l'école avec les enfants." }
                options: [{ object: teacher }, { object: cook }, { object: farmer }]
                answer: teacher
              - id: l2-n2
                type: matching
                text: "Match each job to what the person does."
                say: { en: "Tap a job, then what that person does at work." }
                option_audio: false
                pairs:
                  - { left: { text: "le fermier" }, right: { text: "travaille à la ferme" } }
                  - { left: { text: "le médecin" }, right: { text: "aide les malades" } }
                  - { left: { text: "le professeur" }, right: { text: "travaille à l'école" } }
              - id: l2-n3
                type: audio_choice
                text: "What does the child want to be?"
                say: { en: "Listen. What does the child want to be?" }
                audio: { turns: [{ fr: "Qu'est-ce que tu veux faire plus tard ?", speaker: female }, { fr: "Je veux être cuisinier.", speaker: male }] }
                options: [{ object: farmer }, { object: cook }, { object: doctor }]
                answer: cook
              - id: l2-n4
                type: ordering
                text: "Build the sentence: I want to be a doctor."
                say: { en: "Build the sentence in French: I want to be a doctor." }
                options: ["médecin.", "être", "un", "Je", "veux"]
                slot_count: 4
                answer: ["Je", "veux", "être", "médecin."]
                option_audio: false
              - id: l2-n5
                type: speak
                say: { en: "You want to be a police officer. Say it in French with je veux être." }
                show: { object: police-officer }
                expected_text: "Je veux être policier."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: name
            type: audio_choice
            text: "Which picture matches?"
            say: { en: "Listen. Which picture matches?" }
            audio: { fr: "Mon papa est fermier.", speaker: male }
            options: [{ object: cook }, { object: farmer }, { object: police-officer }]
            answer: farmer
          - id: l2-c2
            part: work
            type: audio_choice
            text: "Who does this job?"
            say: { en: "Listen. Who does this job?" }
            audio: { fr: "Elle aide les malades à l'hôpital." }
            options: [{ object: doctor }, { object: farmer }, { object: firefighter }]
            answer: doctor
          - id: l2-c3
            part: want
            type: multiple_choice
            text: "How do you say this in French?\nI want to be a cook."
            say: { en: "How do you say this in French?" }
            options: ["Je veux être un cuisinier.", "Je veux être cuisinier.", "Je suis cuisinier."]
            answer: "Je veux être cuisinier."
            option_audio: false
          - id: l2-c4
            part: want
            type: audio_choice
            text: "What does the child want to be?"
            say: { en: "Listen. What does the child want to be?" }
            audio: { fr: "Je veux être professeure.", speaker: female }
            options: [{ object: cook }, { object: police-officer }, { object: teacher }]
            answer: teacher
          - id: l2-c5
            part: feminine
            type: fill_in_blank
            text: "Chloé is a police officer. Finish the sentence."
            say: { en: "Chloé is a police officer. Finish the sentence." }
            frame: "Elle est _."
            options: ["policière", "policier", "une policière"]
            answer: ["policière"]
            option_audio: false
          - id: l2-c6
            part: name
            type: audio_choice
            text: "What is the mum's job?"
            say: { en: "Listen. What is the mum's job?" }
            audio: { fr: "Ma maman est médecin.", speaker: male }
            options: ["a doctor", "a teacher", "a cook"]
            answer: "a doctor"
          - id: l2-c7
            part: name
            type: matching
            option_audio: false
            text: "Match each picture to its job."
            say: { en: "Match each picture to its job." }
            pairs:
              - { left: { object: farmer }, right: { text: "fermier" } }
              - { left: { object: police-officer }, right: { text: "policier" } }
              - { left: { object: teacher }, right: { text: "professeur" } }
              - { left: { object: cook }, right: { text: "cuisinier" } }
          - id: l2-c8
            part: name
            type: image_multiple_choice
            option_audio: false
            text: "Which picture shows le pompier?"
            say: { en: "Read the word. Which picture shows it?" }
            options: [{ object: firefighter }, { object: police-officer }, { object: doctor }]
            answer: firefighter
          - id: l2-c9
            part: est-job
            type: ordering
            option_audio: false
            text: "Build the sentence: my brother is a police officer."
            say: { en: "Build the sentence: my brother is a police officer." }
            options: ["policier.", "Mon frère", "un", "est"]
            slot_count: 3
            answer: ["Mon frère", "est", "policier."]
          - id: l2-c10
            part: est-job
