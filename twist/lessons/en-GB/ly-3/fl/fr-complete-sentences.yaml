# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-complete-sentences
skill: fl.writing.complete-sentences
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Sätze nach Muster schreiben (Französisch)
  en: Completing sentences in French
summary: >
  Completing French sentences from a model and building new ones to the
  same pattern: J'aime ..., J'ai un ... / une ..., Je sais ..., J'ai ... ans.
  Lesson 1 fills the gap in a model sentence from a picture and learns which
  pattern says what, including J'ai neuf ans for an age (not je suis);
  lesson 2 changes one part of a model to make a sentence of the child's
  own, with un or une, le, la or les after j'aime, and j' before a vowel,
  and ends with the skill check. The child writes by choosing word cards,
  putting them in order and typing short words; free writing is not marked.
metadata:
  year: ly-3
  topic: { de: Schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.writing.words-from-memory, fl.grammar.chunks]
  also_practises: [fl.themes.hobbies, fl.themes.food, fl.themes.outside-animals, fl.grammar.plurals-articles]
  vocabulary: { fr: ["J'aime ...", "Je n'aime pas ...", "J'ai un ... / une ...", "Je sais ...", "J'ai ... ans", "Je suis ...", et, mais, un, une, le, la, les] }
  forms: [text, picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: suis-for-age
      what: Says an age with je suis, as in English (je suis neuf ans)
      addressed: lesson 1 Learn says French has your age, j'ai neuf ans; l1-f2, l1-s2, l1-n2 and l2-c2 offer je suis for the age, with feedback in l1-f2
    - id: no-article-after-aime
      what: Leaves out le, la or les after j'aime, as in English (j'aime pommes)
      addressed: lesson 2 Learn says j'aime takes le, la or les before a thing; l2-f2, l2-s2 and l2-c3 ask for the article, with feedback in l2-f2
    - id: je-before-vowel
      what: Writes je aime or je ai instead of j'aime, j'ai
      addressed: lesson 2 Learn shows je becoming j' before a vowel; l2-f4, l2-s4 and l2-n4 ask which sentence is written correctly, with feedback in l2-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das Muster ergänzen, en: Completing the model }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            option_audio: false
            text: "Finish the word."
            say: { en: "Chat is the French word for cat. Which letter is missing? Tap it." }
            show: { object: cat }
            frame: "ch_t"
            options: ["a", "e", "o"]
            answer: ["a"]
            difficulty: easy
          - id: l1-w2
            type: ordering
            option_audio: false
            text: "Put the words in order."
            say: { en: "Build the sentence: I like singing." }
            options: ["chanter", "J'aime"]
            slot_count: 2
            answer: ["J'aime", "chanter"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "J'aime nager.\nJ'aime danser."
            say: { en: "This is a model. The start stays the same: j'aime. Only the word at the end changes. That way you can write lots of sentences.", fr: "J'aime nager. J'aime danser." }
            show: { objects: [swim, dance] }
          - text: "J'ai neuf ans.\nJ'ai un chien.\nJ'aime le foot.\nJe sais nager."
            say: { en: "Four patterns you already know. J'ai ... ans: your age. In French you have your age, so never say je suis neuf. J'ai un ...: what you have. J'aime: what you like. Je sais: what you can do.", fr: "J'ai neuf ans. J'ai un chien. J'aime le foot. Je sais nager." }
          - text: "J'ai un ___.\nJ'ai un chat."
            say: { en: "Look at the picture and put the right word in the gap. A full stop goes at the end.", fr: "J'ai un chat." }
            show: { object: cat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence to match the picture."
                say: { en: "The child has got a dog. Finish the sentence." }
                show: { object: dog }
                frame: "J'ai un _."
                options: ["chien", "chat", "lapin"]
                answer: ["chien"]
                hints:
                  - "Look at the picture. Which animal is it?"
                  - "It is a dog."
                  - "A dog is un chien."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Léa is ten. Which sentence is right?"
                say: { en: "Léa is ten years old. Which sentence is right?" }
                options: ["J'ai dix ans.", "Je suis dix ans.", "Je sais dix ans."]
                answer: "J'ai dix ans."
                feedback:
                  "Je suis dix ans.": "In French you have your age: j'ai dix ans."
                hints:
                  - "In French, do you have your age or are you your age?"
                  - "French uses j'ai for your age."
                  - "J'ai dix ans."
              - id: l1-f3
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence to match the picture."
                say: { en: "The child likes reading. Finish the sentence." }
                show: { object: read }
                frame: "J'aime _."
                options: ["lire", "nager", "chanter"]
                answer: ["lire"]
                hints:
                  - "What is the child doing?"
                  - "The child is reading a book."
                  - "Reading is lire."
              - id: l1-f4
                type: matching
                option_audio: false
                text: "Which start goes with which ending?"
                say: { en: "Match each start of a sentence to an ending that fits." }
                pairs:
                  - { left: { text: "J'ai" }, right: { text: "un lapin." } }
                  - { left: { text: "J'aime" }, right: { text: "la pizza." } }
                  - { left: { text: "Je sais" }, right: { text: "nager." } }
                hints:
                  - "J'ai is what you have. Je sais is what you can do."
                  - "You have an animal. You can swim."
                  - "J'ai un lapin. J'aime la pizza. Je sais nager."
              - id: l1-f5
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nJ'ai un ___."
                say: { en: "The child has got a cat. Write the French word for cat." }
                show: { object: cat }
                answer: "chat"
                hints:
                  - "It is the animal that says miaou."
                  - "It starts with ch, like in chien."
                  - "Write c h a t."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence to match the picture."
                say: { en: "The child can ride a bike. Finish the sentence." }
                show: { object: ride-bike }
                frame: "Je sais faire du _."
                options: ["vélo", "foot", "piano"]
                answer: ["vélo"]
                hints: ["Un vélo is a bike."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Tom is eight. Which sentence is right?"
                say: { en: "Tom is eight years old. Which sentence is right?" }
                options: ["Je suis huit ans.", "J'ai huit ans.", "J'aime huit ans."]
                answer: "J'ai huit ans."
                hints: ["You have your age in French."]
              - id: l1-s3
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence to match the picture."
                say: { en: "The child has got a rabbit. Finish the sentence." }
                show: { object: rabbit }
                frame: "J'ai un _."
                options: ["lapin", "poisson", "chien"]
                answer: ["lapin"]
                hints: ["Look at the long ears."]
              - id: l1-s4
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I have got a fish." }
                options: ["poisson.", "J'ai", "un"]
                slot_count: 3
                answer: ["J'ai", "un", "poisson."]
                hints: ["Start with J'ai."]
              - id: l1-s5
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nJ'aime ___."
                say: { en: "The child likes swimming. Write the French word for to swim." }
                show: { object: swim }
                answer: "nager"
                hints: ["It is n a g e r."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence to match the picture."
                say: { en: "The child likes dancing. Finish the sentence." }
                show: { object: dance }
                frame: "J'aime _."
                options: ["danser", "lire", "peindre"]
                answer: ["danser"]
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Inès is nine. Which sentence is right?"
                say: { en: "Inès is nine years old. Which sentence is right?" }
                options: ["Je suis neuf.", "Je sais neuf ans.", "J'ai neuf ans."]
                answer: "J'ai neuf ans."
              - id: l1-n3
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I can sing." }
                options: ["chanter.", "sais", "Je"]
                slot_count: 3
                answer: ["Je", "sais", "chanter."]
              - id: l1-n4
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence to match the picture."
                say: { en: "The child likes painting. Finish the sentence." }
                show: { object: paint }
                frame: "J'aime _."
                options: ["peindre", "chanter", "nager"]
                answer: ["peindre"]
              - id: l1-n5
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nJ'ai un ___."
                say: { en: "The child has got a dog. Write the French word for dog." }
                show: { object: dog }
                answer: "chien"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            option_audio: false
            text: "Finish the sentence to match the picture."
            say: { en: "The child can play the guitar. Finish the sentence." }
            show: { object: play-guitar }
            frame: "Je sais jouer de la _."
            options: ["guitare", "piano", "tennis"]
            answer: ["guitare"]
          - id: l1-c2
            type: ordering
            option_audio: false
            text: "Put the words in order."
            say: { en: "Build the sentence: I like football." }
            options: ["le foot.", "J'aime"]
            slot_count: 2
            answer: ["J'aime", "le foot."]
          - id: l1-c3
            type: multiple_choice
            option_audio: false
            text: "Which pattern says what you can do?"
            say: { en: "Which pattern says what you can do?" }
            options: ["Je sais ...", "J'ai ...", "J'aime ..."]
            answer: "Je sais ..."

  - n: 2
    title: { de: Eigene Sätze nach Muster, en: My own sentences from a model }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            option_audio: false
            text: "Finish the sentence to match the picture."
            say: { en: "The child can swim. Finish the sentence." }
            show: { object: swim }
            frame: "Je sais _."
            options: ["nager", "lire"]
            answer: ["nager"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            option_audio: false
            text: "The child has got a dog. Finish the sentence."
            say: { en: "The child has got a dog. Finish the sentence." }
            show: { object: dog }
            frame: "_ un chien."
            options: ["J'ai", "Je suis"]
            answer: ["J'ai"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Model: J'ai un chat.\nMy sentence: J'ai un chien."
            say: { en: "Now you write your own sentences. Take the model and swap just one word. Un chat becomes un chien, and it is your sentence.", fr: "J'ai un chat. J'ai un chien." }
            show: { objects: [cat, dog] }
          - text: "J'aime le foot.\nJ'aime la pizza.\nJ'aime les pommes."
            say: { en: "After j'aime, a thing always has le, la or les in front. In English you say I like apples. In French you say j'aime les pommes.", fr: "J'aime le foot. J'aime la pizza. J'aime les pommes." }
            show: { objects: [pizza, apple] }
          - text: "je + aime = j'aime\nje + ai = j'ai\nJ'aime les chats, mais je n'aime pas les chiens.\nJ'ai un chat, mais je n'ai pas de chien."
            say: { en: "Before a vowel, je becomes j'. With et and mais you can join two sentences into one. After je n'ai pas, un or une becomes de: je n'ai pas de chien.", fr: "J'aime les chats, mais je n'aime pas les chiens. J'ai un chat, mais je n'ai pas de chien." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                option_audio: false
                text: "Model: J'ai un chat.\nWrite the sentence for the picture."
                say: { en: "Swap one word in the model so it fits the picture." }
                show: { object: fish }
                frame: "J'ai un _."
                options: ["poisson", "chat", "chien"]
                answer: ["poisson"]
                hints:
                  - "Keep the start of the model. Change the animal."
                  - "The picture shows a fish."
                  - "J'ai un poisson."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                option_audio: false
                text: "The child likes bananas. Which sentence is right?"
                say: { en: "The child likes bananas. Which sentence is right?" }
                show: { object: banana }
                options: ["J'aime les bananes.", "J'aime bananes.", "J'aime un bananes."]
                answer: "J'aime les bananes."
                feedback:
                  "J'aime bananes.": "In French, j'aime needs le, la or les before a thing. Bananes is plural: les bananes."
                hints:
                  - "Does a word go between j'aime and bananes?"
                  - "After j'aime comes le, la or les. Bananes is more than one."
                  - "J'aime les bananes."
              - id: l2-f3
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I like cats and I like dogs." }
                options: ["les chiens.", "J'aime", "et", "j'aime", "les chats"]
                slot_count: 5
                answer: ["J'aime", "les chats", "et", "j'aime", "les chiens."]
                hints:
                  - "It starts with J'aime with a capital J."
                  - "Et joins the two parts."
                  - "J'aime les chats et j'aime les chiens."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Which sentence is written correctly?"
                say: { en: "Which sentence is written correctly?" }
                options: ["J'aime la musique.", "Je aime la musique.", "J'aime musique."]
                answer: "J'aime la musique."
                feedback:
                  "Je aime la musique.": "Before a vowel, je becomes j': j'aime."
                hints:
                  - "Look at the start and at the word before musique."
                  - "Je becomes j' before aime, and a thing needs la."
                  - "J'aime la musique."
              - id: l2-f5
                type: fill_in_blank
                option_audio: false
                text: "The child has got a cat but not a dog. Finish the sentence."
                say: { en: "The child has got a cat but not a dog. Finish the sentence." }
                frame: "J'ai un chat, _ je n'ai pas de chien."
                options: ["mais", "et", "le"]
                answer: ["mais"]
                hints:
                  - "The second part says something different."
                  - "Mais means but."
                  - "J'ai un chat, mais je n'ai pas de chien."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                option_audio: false
                text: "Model: J'aime nager.\nWrite the sentence for the picture."
                say: { en: "Swap one word in the model so it fits the picture." }
                show: { object: sing }
                frame: "J'aime _."
                options: ["chanter", "nager", "danser"]
                answer: ["chanter"]
                hints: ["The picture shows singing."]
              - id: l2-s2
                type: fill_in_blank
                option_audio: false
                text: "The child likes pizza. Finish the sentence."
                say: { en: "The child likes pizza. Finish the sentence." }
                show: { object: pizza }
                frame: "J'aime _ pizza."
                options: ["la", "les", "un"]
                answer: ["la"]
                hints: ["One pizza, and la pizza is feminine."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I like football but I don't like tennis." }
                options: ["mais", "J'aime le foot,", "le tennis.", "je n'aime pas"]
                slot_count: 4
                answer: ["J'aime le foot,", "mais", "je n'aime pas", "le tennis."]
                hints: ["Mais comes in the middle."]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Which sentence is written correctly?"
                say: { en: "Which sentence is written correctly?" }
                options: ["Je ai un lapin.", "J'ai un lapin.", "J'ai lapin."]
                answer: "J'ai un lapin."
                hints: ["Je becomes j' before ai."]
              - id: l2-s5
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nJ'aime ___ chats."
                say: { en: "The child likes cats. Write the word that goes before chats." }
                show: { object: cat }
                answer: "les"
                hints: ["More than one cat: le, la or les?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: fill_in_blank
                option_audio: false
                text: "Model: J'ai un lapin.\nNoah has got a dog. Write Noah's sentence."
                say: { en: "Noah has got a dog. Write his sentence. Swap one word in the model." }
                frame: "J'ai un _."
                options: ["chien", "lapin", "chat"]
                answer: ["chien"]
              - id: l2-n2
                type: fill_in_blank
                option_audio: false
                text: "The child likes apples. Finish the sentence."
                say: { en: "The child likes apples. Finish the sentence." }
                show: { object: apple }
                frame: "J'aime _ pommes."
                options: ["les", "la", "une"]
                answer: ["les"]
              - id: l2-n3
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I am ten and I can swim." }
                options: ["je sais nager.", "J'ai dix ans", "et"]
                slot_count: 3
                answer: ["J'ai dix ans", "et", "je sais nager."]
              - id: l2-n4
                type: multiple_choice
                option_audio: false
                text: "Which sentence is written correctly?"
                say: { en: "Which sentence is written correctly?" }
                options: ["J'aime le chocolat.", "Je aime le chocolat.", "J'aime chocolat."]
                answer: "J'aime le chocolat."
              - id: l2-n5
                type: text_input
                keyboard: letters
                text: "Write the missing word.\nJe sais ___."
                say: { en: "The child can dance. Write the French word for to dance." }
                show: { object: dance }
                answer: "danser"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            option_audio: false
            text: "Model: J'aime lire.\nWrite the sentence for the picture."
            say: { en: "Swap one word in the model so it fits the picture." }
            show: { object: play-tennis }
            frame: "J'aime jouer au _."
            options: ["tennis", "foot", "piano"]
            answer: ["tennis"]
          - id: l2-c2
            type: multiple_choice
            option_audio: false
            text: "Chloé is eleven. Which sentence is right?"
            say: { en: "Chloé is eleven years old. Which sentence is right?" }
            options: ["J'ai onze ans.", "Je suis onze ans.", "J'aime onze ans."]
            answer: "J'ai onze ans."
          - id: l2-c3
            type: multiple_choice
            option_audio: false
            text: "The child likes oranges. Which sentence is right?"
            say: { en: "The child likes oranges. Which sentence is right?" }
            show: { object: orange }
            options: ["J'aime oranges.", "J'aime les oranges.", "Je aime les oranges."]
            answer: "J'aime les oranges."
          - id: l2-c4
            type: ordering
            option_audio: false
            text: "Put the words in order."
            say: { en: "Build the sentence: I have got a rabbit but I haven't got a cat." }
            options: ["mais", "je n'ai pas", "J'ai un lapin,", "de chat."]
            slot_count: 4
            answer: ["J'ai un lapin,", "mais", "je n'ai pas", "de chat."]
          - id: l2-c5
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nJ'ai un ___."
            say: { en: "The child has got a rabbit. Write the French word for rabbit." }
            show: { object: rabbit }
            answer: "lapin"
