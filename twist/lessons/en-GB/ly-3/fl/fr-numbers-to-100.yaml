# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-numbers-to-100
skill: fl.themes.numbers-to-100
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Zahlen bis 100 und Preise (Französisch)
  en: Numbers to 100 and prices in French
summary: >
  The tens and the two-digit numbers to 100 in French, and prices in
  euros. Lesson 1 brings vingt to soixante and the numbers between, with
  et un (vingt et un) and the sound-alikes (quarante and quatorze,
  soixante and seize); lesson 2 brings the numbers that count in twenties:
  soixante-dix (60 + 10), quatre-vingts (4 × 20) and quatre-vingt-dix, and
  cent; lesson 3 asks Ça coûte combien ? and gives prices in euros and
  cents written the French way (2,50 €, said deux euros cinquante), and
  ends with the skill check.
  Instructions are in English; children read numerals and the French is
  spoken and shown in short form.
metadata:
  year: ly-3
  topic: { de: Zahlen, en: Numbers }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.numbers-to-20]
  also_practises: [fl.themes.food, fl.speaking.role-play]
  vocabulary: { fr: [vingt, trente, quarante, cinquante, soixante, soixante-dix, quatre-vingts, quatre-vingt-dix, cent, vingt et un, soixante et onze, "Ça coûte combien ?", "C'est combien ?", euros, "deux euros cinquante"] }
  forms: [audio, text, picture]
  drawn: [coins]
  facets: [currency]
  misconceptions:
    - id: count-in-twenties
      what: Hears soixante-dix as 60 or 610 and quatre-vingts as 4 and 20 (24), not knowing that French counts 70 to 99 as sixty-ten and four twenties
      addressed: lesson 2 Learn builds 70 as 60 + 10 and 80 as 4 × 20; l2-f1 and l2-f2 give feedback on 60 and 24, and l2-s1, l2-s3, l2-n1, l2-c1, l2-c3, l3-c1 and l3-c5 ask for numbers from 70 to 99
    - id: sound-alikes
      what: Mixes up quarante and quatorze, soixante and seize, cent and cinq
      addressed: lesson 1 Learn sets seize against soixante; l1-f2 and l1-f3 give feedback on 14 and 16, and l1-s3 and l2-n4 set the sound-alikes against each other
    - id: et-un
      what: Says vingt-un instead of vingt et un, or reads trente et un as 13
      addressed: lesson 1 Learn says one joins with et; l1-f4, l1-s4, l1-n3, l2-c2 and l3-c3 ask for a number with et un or et onze
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "vingt bis soixante", en: "vingt to soixante" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Douze." }
            options: ["12", "2", "16"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Dix-sept." }
            options: ["17", "7", "16"]
            answer: "17"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "20 vingt\n30 trente\n40 quarante"
            say: { en: "The tens in French. Listen and repeat.", fr: "Vingt. Trente. Quarante." }
          - text: "50 cinquante\n60 soixante"
            say: { en: "Cinquante is fifty, soixante is sixty. Soixante sounds like swa-sont.", fr: "Cinquante. Soixante." }
          - text: "21 vingt et un\n22 vingt-deux\n35 trente-cinq"
            say: { en: "Tens first, then the ones, as in English. With one, French says et un, and one: vingt et un, trente et un. The others join with a hyphen: vingt-deux, trente-cinq.", fr: "Vingt et un. Vingt-deux. Trente-cinq." }
          - text: "14 quatorze, 40 quarante\n16 seize, 60 soixante"
            say: { en: "Careful with these. Quatorze is 14, quarante is 40. Seize is 16, soixante is 60.", fr: "Quatorze, quarante. Seize, soixante." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Vingt-quatre." }
                options: ["24", "14", "20"]
                answer: "24"
                hints:
                  - "Listen to the first part: vingt."
                  - "Vingt is 20, quatre is 4."
                  - "Vingt-quatre is 24."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Quarante." }
                options: ["40", "14", "4"]
                answer: "40"
                feedback:
                  "14": "14 is quatorze. You heard quarante, 40."
                hints:
                  - "Quarante or quatorze?"
                  - "Quarante ends in -ante, like the tens."
                  - "Quarante is 40."
              - id: l1-f3
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Soixante." }
                options: ["60", "16", "6"]
                answer: "60"
                feedback:
                  "16": "16 is seize, a short word. Soixante is longer: 60."
                hints:
                  - "Was it a short word or a long one?"
                  - "Seize is short. Soixante is long."
                  - "Soixante is 60."
              - id: l1-f4
                type: multiple_choice
                text: "trente et un"
                say: { en: "Read the number word. Which number is it?" }
                options: ["31", "13", "30"]
                answer: "31"
                option_audio: false
                hints:
                  - "Trente is a ten."
                  - "Trente is 30, et un means and one."
                  - "Trente et un is 31."
              - id: l1-f5
                type: true_false
                text: "35"
                say: { en: "Listen. Is this the number?", fr: "Trente-cinq." }
                answer: true
                hints:
                  - "Listen again: trente-cinq."
                  - "Trente is 30, cinq is 5."
                  - "Yes, it is 35."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Cinquante-deux." }
                options: ["52", "25", "12"]
                answer: "52"
                hints: ["Cinquante is 50."]
              - id: l1-s2
                type: multiple_choice
                text: "vingt, trente, quarante, _"
                say: { en: "Which ten comes next?" }
                options: ["cinquante", "soixante", "quatorze"]
                answer: "cinquante"
                option_audio: false
                hints: ["20, 30, 40, ..."]
              - id: l1-s3
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Seize." }
                options: ["16", "60", "6"]
                answer: "16"
                hints: ["Seize is the short one."]
              - id: l1-s4
                type: fill_in_blank
                text: "41 = quarante _ un"
                say: { en: "Forty-one in French. Fill the gap." }
                frame: "quarante _ un"
                options: ["et", "-", "deux"]
                answer: ["et"]
                option_audio: false
                hints: ["With one, French says et."]
              - id: l1-s5
                type: speak
                text: "60"
                say: { en: "Say the number in French.", fr: "Soixante." }
                expected_text: "soixante"
                hints: ["Say it with me: soixante."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Quarante-huit." }
                options: ["48", "84", "18"]
                answer: "48"
              - id: l1-n2
                type: text_input
                text: "Listen and write the number."
                say: { en: "Listen and write the number.", fr: "Trente-sept." }
                answer: "37"
              - id: l1-n3
                type: multiple_choice
                text: "soixante et un"
                say: { en: "Read the number word. Which number is it?" }
                options: ["61", "16", "71"]
                answer: "61"
                option_audio: false
              - id: l1-n4
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Vingt et un." }
                options: ["21", "20", "12"]
                answer: "21"
              - id: l1-n5
                type: true_false
                text: "45"
                say: { en: "Listen. Is this the number?", fr: "Cinquante-quatre." }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Trente-trois." }
            options: ["33", "13", "30"]
            answer: "33"
          - id: l1-c2
            type: multiple_choice
            text: "cinquante"
            say: { en: "Read the number word. Which number is it?" }
            options: ["50", "15", "5"]
            answer: "50"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "26"
            say: { en: "Listen. Is this the number?", fr: "Vingt-six." }
            answer: true

  - n: 2
    title: { de: "soixante-dix bis cent", en: "soixante-dix to cent" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Soixante-cinq." }
            options: ["65", "56", "15"]
            answer: "65"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "quarante et un"
            say: { en: "Read the number word. Which number is it?" }
            options: ["41", "14", "40"]
            answer: "41"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "70 = 60 + 10\nsoixante-dix"
            say: { en: "French has no word for seventy. It says sixty-ten: soixante-dix. Then 71 is soixante et onze, sixty and eleven, and 75 is soixante-quinze, sixty-fifteen.", fr: "Soixante-dix. Soixante et onze. Soixante-quinze." }
          - text: "80 = 4 × 20\nquatre-vingts"
            say: { en: "Eighty is four twenties: quatre-vingts. 81 is quatre-vingt-un, 85 quatre-vingt-cinq.", fr: "Quatre-vingts. Quatre-vingt-un. Quatre-vingt-cinq." }
          - text: "90 = 4 × 20 + 10\nquatre-vingt-dix"
            say: { en: "Ninety is four twenties and ten: quatre-vingt-dix. 95 is quatre-vingt-quinze.", fr: "Quatre-vingt-dix. Quatre-vingt-quinze." }
          - text: "100 cent"
            say: { en: "And a hundred is cent. Careful: cent sounds a bit like cinq, five.", fr: "Cent." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Soixante-dix." }
                options: ["70", "60", "16"]
                answer: "70"
                feedback:
                  "60": "You heard soixante, but then dix as well: 60 + 10 = 70."
                hints:
                  - "Listen to both parts."
                  - "Soixante is 60, dix is 10."
                  - "60 + 10 = 70."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Quatre-vingts." }
                options: ["80", "24", "40"]
                answer: "80"
                feedback:
                  "24": "Quatre-vingts is not 20 and 4. It is four twenties: 4 × 20 = 80."
                hints:
                  - "Quatre is 4, vingt is 20."
                  - "It means four twenties."
                  - "4 × 20 = 80."
              - id: l2-f3
                type: multiple_choice
                text: "quatre-vingt-dix"
                say: { en: "Read the number word. Which number is it?" }
                options: ["90", "80", "70"]
                answer: "90"
                option_audio: false
                hints:
                  - "Quatre-vingts is 80."
                  - "Dix adds ten."
                  - "80 + 10 = 90."
              - id: l2-f4
                type: fill_in_blank
                text: "75 = soixante-_"
                say: { en: "Seventy-five is sixty and fifteen. Fill the gap." }
                frame: "soixante-_"
                options: ["quinze", "cinq", "quatorze"]
                answer: ["quinze"]
                option_audio: false
                hints:
                  - "75 = 60 + ?"
                  - "60 + 15 = 75."
                  - "Fifteen is quinze."
              - id: l2-f5
                type: speak
                text: "100"
                say: { en: "Say the number in French.", fr: "Cent." }
                expected_text: "cent"
                hints:
                  - "It is one short word."
                  - "It sounds like sont, through your nose."
                  - "Say it with me: cent."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Soixante-douze." }
                options: ["72", "62", "12"]
                answer: "72"
                hints: ["60 + 12."]
              - id: l2-s2
                type: multiple_choice
                text: "quatre-vingt-cinq"
                say: { en: "Read the number word. Which number is it?" }
                options: ["85", "45", "25"]
                answer: "85"
                option_audio: false
                hints: ["Quatre-vingts is 80."]
              - id: l2-s3
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Quatre-vingt-dix-neuf." }
                options: ["99", "89", "19"]
                answer: "99"
                hints: ["80 + 19."]
              - id: l2-s4
                type: matching
                option_audio: false
                text: "Match each number with its word."
                pairs:
                  - { left: { text: "70" }, right: { text: "soixante-dix" } }
                  - { left: { text: "80" }, right: { text: "quatre-vingts" } }
                  - { left: { text: "90" }, right: { text: "quatre-vingt-dix" } }
                  - { left: { text: "100" }, right: { text: "cent" } }
                hints: ["Quatre-vingts is four twenties."]
              - id: l2-s5
                type: speak
                text: "80"
                say: { en: "Say the number in French.", fr: "Quatre-vingts." }
                expected_text: "quatre-vingts"
                hints: ["Say it with me: quatre-vingts."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Soixante-dix-huit." }
                options: ["78", "68", "18"]
                answer: "78"
              - id: l2-n2
                type: text_input
                text: "Listen and write the number."
                say: { en: "Listen and write the number.", fr: "Quatre-vingt-trois." }
                answer: "83"
              - id: l2-n3
                type: multiple_choice
                text: "soixante-seize"
                say: { en: "Read the number word. Which number is it?" }
                options: ["76", "66", "16"]
                answer: "76"
                option_audio: false
              - id: l2-n4
                type: audio_choice
                say: { en: "Listen. Which number is it?" }
                audio: { fr: "Cent." }
                options: ["100", "5", "7"]
                answer: "100"
              - id: l2-n5
                type: true_false
                text: "91"
                say: { en: "Listen. Is this the number?", fr: "Quatre-vingt-onze." }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Quatre-vingt-quatre." }
            options: ["84", "24", "44"]
            answer: "84"
          - id: l2-c2
            type: multiple_choice
            text: "soixante et onze"
            say: { en: "Read the number word. Which number is it?" }
            options: ["71", "61", "11"]
            answer: "71"
            option_audio: false
          - id: l2-c3
            type: true_false
            text: "70"
            say: { en: "Listen. Is this the number?", fr: "Quatre-vingts." }
            answer: false

  - n: 3
    title: { de: "Ça coûte combien ?", en: "Ça coûte combien ?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Quatre-vingt-dix." }
            options: ["90", "80", "70"]
            answer: "90"
            difficulty: easy
          - id: l3-w2
            type: audio_choice
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Soixante-quinze." }
            options: ["75", "65", "15"]
            answer: "75"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Le ballon, ça coûte combien ?"
            say: { en: "To ask the price, say ça coûte combien? or c'est combien?", fr: "Le ballon, ça coûte combien ?" }
            show: { object: ball }
          - text: "Le ballon coûte vingt euros.\n20 € = vingt euros"
            say: { en: "In France, prices are in euros. Le ballon coûte vingt euros: the ball costs twenty euros. On the label the euro sign comes after the number.", fr: "Le ballon coûte vingt euros." }
            show: { object: ball }
          - text: "2,50 € = deux euros cinquante"
            say: { en: "In France a price is written with the euro sign after the number and a comma before the cents, where we write a point. Two euros and fifty cents is written two, comma, fifty, then the euro sign. You say deux euros cinquante.", fr: "Deux euros cinquante." }
            show: { drawn: coins, values: [200, 50], currency: eur }
          - text: "La glace coûte deux euros cinquante.\n2,50 € = deux euros cinquante"
            say: { en: "For a price with cents, say the euros, then the cents: deux euros cinquante. You leave out the word cents.", fr: "La glace coûte deux euros cinquante." }
            show: { object: ice-cream }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: audio_choice
                say: { en: "Listen. How much is the ball?" }
                audio: { fr: "Le ballon coûte vingt-cinq euros." }
                options: ["25 €", "35 €", "20 €"]
                answer: "25 €"
                hints:
                  - "Listen for the number before euros."
                  - "Vingt-cinq."
                  - "25 €."
                difficulty: easy
              - id: l3-f2
                type: audio_choice
                say: { en: "Listen. How much is the ice cream?" }
                audio: { fr: "C'est combien, la glace ? Deux euros cinquante." }
                options: ["2,50 €", "2,15 €", "50,20 €"]
                answer: "2,50 €"
                hints:
                  - "Euros come first, then the cents."
                  - "Deux euros, then cinquante."
                  - "2,50 €."
              - id: l3-f3
                type: multiple_choice
                text: "Le vélo : 80 €. How do you say the price?"
                show: { object: bike }
                options: ["quatre-vingts euros", "huit euros", "soixante euros"]
                answer: "quatre-vingts euros"
                option_audio: false
                feedback:
                  "huit euros": "Huit euros is \"8 €\". Eighty is four twenties: quatre-vingts."
                hints:
                  - "80 is four twenties."
                  - "Four is quatre, twenty is vingt."
                  - "Quatre-vingts euros."
              - id: l3-f4
                type: multiple_choice
                text: "You want to know the price. What do you ask?"
                options: ["Ça coûte combien ?", "Comment tu t'appelles ?", "Tu as quel âge ?"]
                answer: "Ça coûte combien ?"
                option_audio: false
                hints:
                  - "Combien means how much."
                  - "Ça coûte means it costs."
                  - "Ça coûte combien ?"
              - id: l3-f5
                type: speak
                text: "70 €"
                say: { en: "Say the price in French.", fr: "Soixante-dix euros." }
                expected_text: "soixante-dix euros"
                hints:
                  - "70 is sixty-ten."
                  - "Soixante-dix, then euros."
                  - "Say it with me: soixante-dix euros."

          - support: some
            tasks:
              - id: l3-s1
                type: audio_choice
                say: { en: "Listen. How much is the pizza?" }
                audio: { fr: "La pizza coûte douze euros." }
                options: ["12 €", "2 €", "20 €"]
                answer: "12 €"
                hints: ["Douze is 12."]
              - id: l3-s2
                type: audio_choice
                say: { en: "Listen. How much is the book?" }
                audio: { fr: "Le livre coûte quinze euros cinquante." }
                options: ["15,50 €", "50,15 €", "5,50 €"]
                answer: "15,50 €"
                hints: ["Euros first, then cents."]
              - id: l3-s3
                type: multiple_choice
                text: "The label says \"90 €\". How do you say the price?"
                options: ["quatre-vingt-dix euros", "neuf euros", "quatre-vingts euros"]
                answer: "quatre-vingt-dix euros"
                option_audio: false
                hints: ["90 is four twenties and ten."]
              - id: l3-s4
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the question: how much does the ball cost?" }
                options: ["combien ?", "Le ballon,", "ça coûte"]
                slot_count: 3
                answer: ["Le ballon,", "ça coûte", "combien ?"]
                hints: ["Start with the thing you want."]
              - id: l3-s5
                type: speak
                say: { en: "Ask the price in French.", fr: "Ça coûte combien ?" }
                expected_text: "Ça coûte combien ?"
                hints: ["Say it with me: ça coûte combien ?"]

          - support: none
            tasks:
              - id: l3-n1
                type: audio_choice
                say: { en: "Listen. How much is the game?" }
                audio: { fr: "Le jeu coûte quarante-neuf euros." }
                options: ["49 €", "94 €", "19 €"]
                answer: "49 €"
              - id: l3-n2
                type: text_input
                text: "Listen. How many euros does the bag cost?"
                say: { en: "Listen. How many euros does the bag cost?", fr: "Le sac coûte soixante-six euros." }
                answer: "66"
              - id: l3-n3
                type: audio_choice
                say: { en: "Listen. How much is the cake?" }
                audio: { fr: "C'est combien ? Un euro quatre-vingts." }
                options: ["1,80 €", "1,20 €", "4,80 €"]
                answer: "1,80 €"
              - id: l3-n4
                type: multiple_choice
                text: "The label says \"75 €\". How do you say the price?"
                options: ["soixante-quinze euros", "soixante-cinq euros", "sept euros cinq"]
                answer: "soixante-quinze euros"
                option_audio: false
              - id: l3-n5
                type: true_false
                text: "96 €"
                say: { en: "Listen. Is this the price?", fr: "Quatre-vingt-seize euros." }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l3-c1
            type: audio_choice
            say: { en: "Listen. How much is the bike?" }
            audio: { fr: "Le vélo coûte quatre-vingt-dix-neuf euros." }
            options: ["99 €", "89 €", "19 €"]
            answer: "99 €"
          - id: l3-c2
