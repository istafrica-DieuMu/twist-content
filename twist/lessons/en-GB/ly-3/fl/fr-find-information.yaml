# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-find-information
skill: fl.reading.find-information
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Informationen finden (Französisch)
  en: Finding information in French texts
summary: >
  Finding one piece of information in an everyday French text without
  reading every word: a café menu with prices in euros, a school timetable
  (emploi du temps), a party invitation, a poster for a school fair.
  Lesson 1 reads menus and timetables, drawn as tables, and finds a price, a
  day or a lesson by row and column; lesson 2 reads invitations and posters
  and finds when, where and what to bring, with times written the French way
  (15 h), and ends with the skill check. The voice asks in English and does
  not read the French text.
metadata:
  year: ly-3
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.short-texts]
  also_practises: [fl.themes.food, fl.themes.school, fl.themes.time, fl.themes.calendar]
  vocabulary: { fr: [le menu, le prix, une crêpe, un croissant, une glace, un jus d'orange, lundi, mardi, mercredi, jeudi, vendredi, samedi, maths, français, anglais, sport, dessin, musique, la fête, quand, où, apporte, de, "l'entrée"] }
  forms: [drawn, text, audio]
  drawn: [table]
  facets: []
  misconceptions:
    - id: read-everything
      what: Reads the whole text from the top instead of looking for the one thing the question asks for
      addressed: lesson 1 Learn says to think first what you are looking for, then look only for that; the full-stage hints name the word to look for
    - id: wrong-row
      what: Reads the right column but slips to the row above or below in a table
      addressed: lesson 1 Learn follows the row with a finger and marks the cell; l1-f2 and l1-s2 give feedback on the neighbouring row
    - id: day-time
      what: Mixes up the day or date with the time on an invitation or poster, or reads 15 h as 15 o'clock in the morning
      addressed: lesson 2 Learn separates quand (day and time) from où and says 15 h is 3 pm; l2-f2 gives feedback when the day is picked for the time; l2-s2 and l2-c3 ask for a time again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Speisekarten und Stundenpläne, en: Menus and timetables }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            option_audio: false
            text: "Nom : Kai\nÂge : 9 ans\nAnimal : un poisson\n\nWhich pet has Kai got?"
            say: { en: "Read the profile. Which pet has Kai got?" }
            options: ["a fish", "a cat", "a dog"]
            answer: "a fish"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "Chère Ava,\nJe suis à la mer.\nBisous,\nRose\n\nWho wrote it?"
            say: { en: "Read the postcard. Who wrote it?" }
            options: ["Rose", "Ava"]
            answer: "Rose"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "How much is a crêpe?"
            show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une crêpe", "3 €"], ["un croissant", "2 €"], ["une glace", "4 €"]] }
            say: { en: "This is a menu from a French café. Prices are in euros, and the euro sign comes after the number. You do not need to read it all. First think: what am I looking for? Here, the price of une crêpe." }
          - text: "une crêpe → 3 €"
            show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une crêpe", "3 €"], ["un croissant", "2 €"], ["une glace", "4 €"]], mark: [[1, 0], [1, 1]] }
            say: { en: "Find une crêpe in the left column. Run your finger along the same row to the right. There is the price: three euros." }
          - text: "What does the class have on Tuesday at 10?"
            show: { drawn: table, rows: [["", "lundi", "mardi"], ["9 h", "maths", "français"], ["10 h", "dessin", "musique"]], mark: [[2, 2]] }
            say: { en: "A timetable, un emploi du temps, works the same way. The days are along the top, the times down the left. Mardi is Tuesday. Where the mardi column meets the 10 h row, it says musique: music." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                option_audio: false
                text: "How much is the ice cream?"
                show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une glace", "4 €"], ["un croissant", "2 €"], ["un jus d'orange", "1 €"]] }
                say: { en: "Read the menu. How much is the ice cream?" }
                options: ["4 €", "2 €", "1 €"]
                answer: "4 €"
                hints:
                  - "Une glace is an ice cream. Find it first."
                  - "Run along the row of une glace to the right."
                  - "Next to une glace it says 4 €."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "What does the class have on Monday at 10?"
                show: { drawn: table, rows: [["", "lundi", "mardi"], ["9 h", "français", "maths"], ["10 h", "sport", "dessin"], ["11 h", "musique", "anglais"]] }
                say: { en: "Read the timetable. What does the class have on Monday at ten o'clock?" }
                options: ["sport", "français", "musique"]
                answer: "sport"
                feedback:
                  "français": "Français is at nine, one row too high. Find the row with 10 h."
                  "musique": "Musique is at eleven, one row too low. Find the row with 10 h."
                hints:
                  - "Lundi is Monday. Find its column."
                  - "Then find the row with 10 h on the left."
                  - "Monday at ten: sport, which is PE."
              - id: l1-f3
                type: true_false
                text: "A croissant costs 2 €."
                show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une crêpe", "3 €"], ["un croissant", "2 €"], ["un chocolat chaud", "3 €"]] }
                say: { en: "Read the menu. Is this true?" }
                answer: true
                hints:
                  - "Find the row with un croissant."
                  - "Run along the row to the price."
                  - "Yes, it says 2 €."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "On which day does the class have art?"
                show: { drawn: table, rows: [["", "mercredi", "jeudi", "vendredi"], ["9 h", "maths", "français", "maths"], ["10 h", "musique", "dessin", "sport"]] }
                say: { en: "Read the timetable. On which day does the class have art?" }
                options: ["jeudi", "mercredi", "vendredi"]
                answer: "jeudi"
                hints:
                  - "Dessin means art. Find the word in the timetable."
                  - "Go up from dessin to the day."
                  - "Above dessin it says jeudi, Thursday."
              - id: l1-f5
                type: multiple_choice
                option_audio: false
                text: "What is the cheapest?"
                show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une crêpe", "3 €"], ["un jus d'orange", "1 €"], ["un sandwich", "5 €"]] }
                say: { en: "Read the menu. What is the cheapest?" }
                options: ["un jus d'orange", "une crêpe", "un sandwich"]
                answer: "un jus d'orange"
                hints:
                  - "Cheapest means the smallest price."
                  - "Look only at the prices: 3, 1 and 5."
                  - "1 € is the smallest: un jus d'orange."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                option_audio: false
                text: "How much is a sandwich?"
                show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une glace", "3 €"], ["un sandwich", "4 €"], ["un croissant", "2 €"]] }
                say: { en: "Read the menu. How much is a sandwich?" }
                options: ["4 €", "3 €", "2 €"]
                answer: "4 €"
                hints: ["Find un sandwich, then go along the row."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "What does the class have on Tuesday at 11?"
                show: { drawn: table, rows: [["", "lundi", "mardi"], ["9 h", "maths", "anglais"], ["10 h", "musique", "français"], ["11 h", "dessin", "sport"]] }
                say: { en: "Read the timetable. What does the class have on Tuesday at eleven o'clock?" }
                options: ["sport", "français", "dessin"]
                answer: "sport"
                feedback:
                  "français": "Français is at ten, one row too high. Find 11 h."
                hints: ["Mardi column, 11 h row."]
              - id: l1-s3
                type: true_false
                text: "The class has music on Friday."
                show: { drawn: table, rows: [["", "jeudi", "vendredi"], ["9 h", "musique", "anglais"], ["10 h", "maths", "sport"]] }
                say: { en: "Read the timetable. Is this true?" }
                answer: false
                hints: ["Vendredi is Friday. What is in its column?"]
              - id: l1-s4
                type: multiple_choice
                option_audio: false
                text: "Which is the dearest?"
                show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une crêpe", "3 €"], ["une pizza", "8 €"], ["une glace", "4 €"]] }
                say: { en: "Read the menu. Which is the dearest, the one that costs the most?" }
                options: ["une pizza", "une glace", "une crêpe"]
                answer: "une pizza"
                hints: ["Look for the biggest price."]
              - id: l1-s5
                type: multiple_choice
                option_audio: false
                text: "At what time is English on Monday?"
                show: { drawn: table, rows: [["", "lundi", "mardi"], ["9 h", "maths", "sport"], ["10 h", "anglais", "musique"]] }
                say: { en: "Read the timetable. At what time is English on Monday?" }
                options: ["10 h", "9 h"]
                answer: "10 h"
                hints: ["Anglais is English. Find it under lundi, then look left."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                option_audio: false
                text: "How much is a hot chocolate?"
                show: { drawn: table, rows: [["Café du Parc", "Prix"], ["un croissant", "2 €"], ["un chocolat chaud", "3 €"], ["un jus d'orange", "1 €"]] }
                say: { en: "Read the menu. How much is a hot chocolate?" }
                options: ["3 €", "2 €", "1 €"]
                answer: "3 €"
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "What does the class have on Thursday at 9?"
                show: { drawn: table, rows: [["", "mercredi", "jeudi"], ["9 h", "sport", "français"], ["10 h", "maths", "dessin"]] }
                say: { en: "Read the timetable. What does the class have on Thursday at nine o'clock?" }
                options: ["français", "sport", "dessin"]
                answer: "français"
              - id: l1-n3
                type: true_false
                text: "A crêpe costs 5 €."
                show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une crêpe", "3 €"], ["un sandwich", "5 €"]] }
                say: { en: "Read the menu. Is this true?" }
                answer: false
              - id: l1-n4
                type: multiple_choice
                option_audio: false
                text: "On which day is PE?"
                show: { drawn: table, rows: [["", "lundi", "mardi", "mercredi"], ["9 h", "maths", "anglais", "sport"]] }
                say: { en: "Read the timetable. On which day is PE?" }
                options: ["mercredi", "lundi", "mardi"]
                answer: "mercredi"
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                text: "Tom has 2 €. What can he buy?"
                show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une glace", "4 €"], ["un croissant", "2 €"], ["une crêpe", "3 €"]] }
                say: { en: "Read the menu. Tom has two euros. What can he buy?" }
                options: ["un croissant", "une glace", "une crêpe"]
                answer: "un croissant"
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "How much is an orange juice?"
            show: { drawn: table, rows: [["Café du Parc", "Prix"], ["un jus d'orange", "2 €"], ["une glace", "3 €"]] }
            say: { en: "Read the menu. How much is an orange juice?" }
            options: ["2 €", "3 €"]
            answer: "2 €"
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "What does the class have on Friday at 10?"
            show: { drawn: table, rows: [["", "jeudi", "vendredi"], ["9 h", "maths", "dessin"], ["10 h", "anglais", "musique"]] }
            say: { en: "Read the timetable. What does the class have on Friday at ten o'clock?" }
            options: ["musique", "dessin", "anglais"]
            answer: "musique"
          - id: l1-c3
            type: true_false
            text: "Ice cream is the cheapest."
            show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une glace", "2 €"], ["une pizza", "7 €"], ["une crêpe", "3 €"]] }
            say: { en: "Read the menu. Is this true?" }
            answer: true

  - n: 2
    title: { de: Einladungen und Plakate, en: Invitations and posters }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            text: "How much is the pizza?"
            show: { drawn: table, rows: [["Café du Parc", "Prix"], ["une pizza", "6 €"], ["un jus d'orange", "1 €"]] }
            say: { en: "Read the menu. How much is the pizza?" }
            options: ["6 €", "1 €"]
            answer: "6 €"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "What does the class have on Tuesday at 9?"
            show: { drawn: table, rows: [["", "lundi", "mardi"], ["9 h", "anglais", "sport"]] }
            say: { en: "Read the timetable. What does the class have on Tuesday at nine o'clock?" }
            options: ["sport", "anglais"]
            answer: "sport"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Viens à ma fête !\nQuand : samedi, à 15 h\nOù : 12 rue des Lilas\nApporte : ton maillot de bain\nDe : Lucie"
            say: { en: "This is an invitation. It has key words, like a profile. Quand means when, où means where, apporte means bring." }
          - text: "Quand : samedi, à 15 h\n= Saturday, at 3 pm"
            say: { en: "After quand there are two things: the day, samedi, and the time, 15 h. The French often use the 24-hour clock, so 15 h is 3 pm. If someone asks what time, look for the number with h, not the day." }
          - text: "FÊTE DE L'ÉCOLE\nvendredi 14 juin\nde 10 h à 14 h\nJeux, musique et gâteaux !\nEntrée : 1 €"
            say: { en: "This is a poster for a school fair. At the top it says what it is. Underneath are the day, the time and what there is. L'entrée is the price to get in. Again, look only for what you want to know." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Viens à ma fête !\nQuand : dimanche, à 14 h\nOù : au parc\nApporte : un ballon\nDe : Hugo\n\nWhere is the party?"
                say: { en: "Read the invitation. Where is the party?" }
                options: ["in the park", "at Hugo's house", "at school"]
                answer: "in the park"
                hints:
                  - "Où means where. Find that line."
                  - "Où : au parc."
                  - "The party is in the park."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                option_audio: false
                text: "Viens à ma fête !\nQuand : dimanche, à 14 h\nOù : au parc\nApporte : un ballon\nDe : Hugo\n\nAt what time is the party?"
                say: { en: "Read the invitation again. At what time is the party?" }
                options: ["2 pm", "Sunday", "4 pm"]
                answer: "2 pm"
                feedback:
                  "Sunday": "Sunday is the day. The question asks for the time: the number with h."
                hints:
                  - "Look at the line with quand."
                  - "The time is the number with h: 14 h."
                  - "14 h is 2 pm."
              - id: l2-f3
                type: image_multiple_choice
                option_audio: false
                text: "Viens à ma fête !\nQuand : dimanche, à 14 h\nOù : au parc\nApporte : un ballon\nDe : Hugo"
                say: { en: "Read the invitation. What should you bring?" }
                options: [{ object: ball }, { object: cake }, { object: present }]
                answer: ball
                hints:
                  - "Apporte means bring."
                  - "Apporte : un ballon."
                  - "Un ballon is a ball."
              - id: l2-f4
                type: true_false
                text: "FÊTE DE L'ÉCOLE\nvendredi 14 juin\nde 10 h à 14 h\nJeux, musique et gâteaux !\nEntrée : 1 €\n\nIs the fair on a Friday?"
                say: { en: "Read the poster. Is the fair on a Friday?" }
                answer: true
                hints:
                  - "Find the day under the title."
                  - "It says vendredi."
                  - "Yes, vendredi is Friday."
              - id: l2-f5
                type: multiple_choice
                option_audio: false
                text: "FÊTE DE L'ÉCOLE\nvendredi 14 juin\nde 10 h à 14 h\nJeux, musique et gâteaux !\nEntrée : 1 €\n\nHow much does it cost to get in?"
                say: { en: "Read the poster again. How much does it cost to get in?" }
                options: ["1 €", "10 €", "14 €"]
                answer: "1 €"
                hints:
                  - "L'entrée is the price to get in."
                  - "Find the line with entrée."
                  - "Entrée : 1 €."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Viens à ma fête !\nQuand : samedi, à 16 h\nOù : 8 rue Victor Hugo\nApporte : ton pyjama\nDe : Manon\n\nWhose party is it?"
                say: { en: "Read the invitation. Whose party is it?" }
                options: ["Manon's", "Victor Hugo's", "Lucie's"]
                answer: "Manon's"
                hints: ["De means from. The person who invites you is after de."]
              - id: l2-s2
                type: multiple_choice
                option_audio: false
                text: "Viens à ma fête !\nQuand : samedi, à 16 h\nOù : 8 rue Victor Hugo\nApporte : ton pyjama\nDe : Manon\n\nAt what time is the party?"
                say: { en: "Read the invitation again. At what time is the party?" }
                options: ["4 pm", "6 pm", "8 pm"]
                answer: "4 pm"
                hints: ["16 h on the 24-hour clock."]
              - id: l2-s3
                type: multiple_choice
                option_audio: false
                text: "Viens à ma fête !\nQuand : samedi, à 16 h\nOù : 8 rue Victor Hugo\nApporte : ton pyjama\nDe : Manon\n\nWhat should you bring?"
                say: { en: "Read the invitation again. What should you bring?" }
                options: ["your pyjamas", "a cake", "your swimming costume"]
                answer: "your pyjamas"
                hints: ["Find the line with apporte."]
              - id: l2-s4
                type: true_false
                text: "CONCERT DE LA CLASSE\nmardi 3 mars, à 18 h\nSalle de musique\nEntrée gratuite\n\nIs the concert on Wednesday?"
                say: { en: "Read the poster. Is the concert on Wednesday?" }
                answer: false
                hints: ["Mardi is Tuesday."]
              - id: l2-s5
                type: multiple_choice
                option_audio: false
                text: "CONCERT DE LA CLASSE\nmardi 3 mars, à 18 h\nSalle de musique\nEntrée gratuite\n\nWhere is the concert?"
                say: { en: "Read the poster again. Where is the concert?" }
                options: ["in the music room", "in the park", "in the café"]
                answer: "in the music room"
                hints: ["Salle de musique is a room for music."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                option_audio: false
                text: "Viens à ma fête !\nQuand : mercredi, à 15 h\nOù : à la piscine\nApporte : ton maillot de bain\nDe : Nathan\n\nWhere is the party?"
                say: { en: "Read the invitation. Where is the party?" }
                options: ["at the swimming pool", "in the park", "at school"]
                answer: "at the swimming pool"
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "Viens à ma fête !\nQuand : mercredi, à 15 h\nOù : à la piscine\nApporte : ton maillot de bain\nDe : Nathan\n\nOn which day is the party?"
                say: { en: "Read the invitation again. On which day is the party?" }
                options: ["Wednesday", "Monday", "Saturday"]
                answer: "Wednesday"
              - id: l2-n3
                type: true_false
                text: "MARCHÉ DE NOËL\nsamedi 12 décembre\nde 9 h à 17 h\nCadeaux, crêpes et chocolat chaud\n\nDoes the market end at 5 pm?"
                say: { en: "Read the poster. Does the market end at five pm?" }
                answer: true
              - id: l2-n4
                type: multiple_choice
                option_audio: false
                text: "MARCHÉ DE NOËL\nsamedi 12 décembre\nde 9 h à 17 h\nCadeaux, crêpes et chocolat chaud\n\nWhat can you eat there?"
                say: { en: "Read the poster again. What can you eat there?" }
                options: ["crêpes", "pizza", "ice cream"]
                answer: "crêpes"
              - id: l2-n5
                type: image_multiple_choice
                option_audio: false
                text: "Viens à ma fête !\nQuand : vendredi, à 17 h\nOù : chez moi\nApporte : ton vélo\nDe : Léa"
                say: { en: "Read the invitation. What should you bring?" }
                options: [{ object: bike }, { object: ball }, { object: book }]
                answer: bike

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            option_audio: false
            text: "What does the class have on Wednesday at 10?"
            show: { drawn: table, rows: [["", "mardi", "mercredi"], ["9 h", "musique", "anglais"], ["10 h", "maths", "dessin"], ["11 h", "sport", "français"]] }
            say: { en: "Read the timetable. What does the class have on Wednesday at ten o'clock?" }
            options: ["dessin", "anglais", "français"]
            answer: "dessin"
          - id: l2-c2
            type: multiple_choice
            option_audio: false
            text: "How much is a croissant?"
            show: { drawn: table, rows: [["Boulangerie", "Prix"], ["une baguette", "1 €"], ["un croissant", "2 €"], ["un gâteau", "9 €"]] }
            say: { en: "Read the price list. How much is a croissant?" }
            options: ["2 €", "1 €", "9 €"]
            answer: "2 €"
          - id: l2-c3
            type: multiple_choice
            option_audio: false
            text: "Viens à ma fête !\nQuand : dimanche, à 11 h\nOù : 5 rue du Port\nApporte : un jeu\nDe : Yanis\n\nAt what time is the party?"
            say: { en: "Read the invitation. At what time is the party?" }
            options: ["11 am", "Sunday", "5 pm"]
            answer: "11 am"
          - id: l2-c4
            type: multiple_choice
            option_audio: false
            text: "Viens à ma fête !\nQuand : dimanche, à 11 h\nOù : 5 rue du Port\nApporte : un jeu\nDe : Yanis\n\nWhat should you bring?"
            say: { en: "Read the invitation again. What should you bring?" }
            options: ["a game", "a ball", "your pyjamas"]
            answer: "a game"
          - id: l2-c5
            type: true_false
            text: "FÊTE DU SPORT\njeudi 2 juillet\nde 13 h à 16 h\nEntrée : 2 €\n\nDoes it start at 1 pm?"
            say: { en: "Read the poster. Does it start at one pm?" }
            answer: true
