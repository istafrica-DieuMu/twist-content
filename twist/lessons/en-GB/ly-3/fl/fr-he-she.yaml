# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-he-she
skill: fl.grammar.he-she-it
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Über andere sprechen (Französisch)
  en: Talking about others in French
summary: >
  Talking about other people with il and elle, and the verb changes that
  go with them. Lesson 1 sets je joue against il joue, j'aime against elle
  aime (no s, unlike she likes) and je m'appelle against il s'appelle;
  lesson 2 sets j'ai against il a (and elle a neuf ans) and je suis
  against elle est, and ends with the skill check. Instructions are in
  English; the French is spoken and shown in short form.
metadata:
  year: ly-3
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks, fl.themes.family]
  also_practises: [fl.themes.hobbies, fl.themes.family]
  vocabulary: { fr: [il, elle, il joue, elle aime, il s'appelle, il a, elle a ... ans, il est, elle est] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: il-elle, what: { de: il für einen Jungen und elle für ein Mädchen wählen, en: choosing il for a boy and elle for a girl } }
    - { id: aime-joue, what: { de: "das Verb nach il und elle ohne s (il joue, elle aime)", en: "the verb after il and elle with no s (il joue, elle aime)" } }
    - { id: avoir, what: { de: "j'ai wird il a oder elle a, auch für das Alter", en: "j'ai becomes il a or elle a, also for an age" } }
    - { id: etre, what: { de: je suis wird il est oder elle est, en: je suis becomes il est or elle est } }
    - { id: understand, what: { de: "verstehen, was jemand über eine andere Person sagt", en: understanding what someone says about another person } }
  misconceptions:
    - id: keeps-je-form
      what: Keeps the je form of the verb with il or elle (elle ai un chien, il suis grand)
      addressed: lesson 2 Learn sets j'ai against il a and je suis against il est; l2-f1 and l2-f2 give feedback on ai and suis, and l1-f4, l1-n1, l2-s1, l2-s4, l2-n1, l2-c2 and l2-c4 offer the je form
    - id: english-s
      what: Adds an s as in English she likes (elle aimes, il joues)
      addressed: lesson 1 Learn says French adds no s after il or elle; l1-f1 gives feedback on aimes, and l1-s1, l1-s3, l1-n5, l1-c1 and l2-c1 offer the form with s
    - id: il-elle
      what: Uses il for a girl or elle for a boy
      addressed: lesson 1 Learn sets il for a boy against elle for a girl; l1-f3, l1-s4 and l1-c3 ask for il or elle
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Il joue, elle aime", en: "Il joue, elle aime" }
    goal:
      de: "Sprich mit il und elle über einen Jungen oder ein Mädchen, so wie elle aime danser."
      en: "Talk about a boy or a girl with il and elle, like elle aime danser."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How do you say this in French?\nI like football."
            say: { en: "How do you say I like football in French?" }
            options: ["J'aime le foot.", "Je suis le foot.", "J'ai le foot."]
            answer: "J'aime le foot."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Who is it?"
            say: { en: "Listen. Who is it?" }
            audio: { fr: "C'est ma mamie.", speaker: male }
            options: [{ object: grandma }, { object: mum }, { object: girl }]
            answer: grandma
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Il joue au foot."
            say: { en: "Guess first! Je joue au foot means I play football. Now Tom's sister points at Tom and says il joue au foot. Who do you think plays football: the sister, or Tom?", fr: "Il joue au foot." }
            show: { object: play-football }
          - text: "Je joue au foot.\nIl joue au foot."
            say: { en: "Tom! Il means he. To talk about a boy or a man, change je to il, he. The verb sounds just the same: je joue, il joue.", fr: "Je joue au foot. Il joue au foot." }
            show: { object: play-football }
          - text: "J'aime danser.\nElle aime danser."
            say: { en: "For a girl or a woman, say elle, she. J'aime becomes elle aime. In English you add an s: she likes. In French you do not: elle aime, never elle aimes.", fr: "J'aime danser. Elle aime danser." }
            show: { object: dance }
          - text: "Je m'appelle Tom.\nIl s'appelle Tom."
            say: { en: "Je m'appelle becomes il s'appelle or elle s'appelle: his name is, her name is.", fr: "Je m'appelle Tom. Il s'appelle Tom." }
            show: { object: boy }
          - text: "Did you know? French has no word like it for things.\nla table: elle\nle livre: il"
            say: { en: "Did you know? French has no word like it for things. A thing is a he or a she, just like its le or la. La table is a she, so a French child says elle for a table. Le livre is a he, so a book is il!", fr: "La table, elle. Le livre, il." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Léa likes dancing. Which sentence is right?"
                say: { en: "Léa likes dancing. Which sentence is right?" }
                show: { object: dance }
                options: ["Elle aime danser.", "Elle aimes danser.", "J'aime danser."]
                answer: "Elle aime danser."
                option_audio: false
                feedback:
                  "Elle aimes danser.": "In English she likes has an s. In French there is no s: elle aime."
                hints:
                  - "Léa is a girl, so the sentence starts with elle."
                  - "French adds no s after elle."
                  - "Elle aime danser."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What does he play?"
                say: { en: "Listen. What does he play?" }
                audio: { fr: "Il joue au tennis." }
                options: [{ object: play-tennis }, { object: play-football }, { object: play-guitar }]
                answer: play-tennis
                hints:
                  - "Listen to the end."
                  - "Il joue au tennis."
                  - "He plays tennis."
              - id: l1-f3
                type: fill_in_blank
                text: "Tom likes football. Finish the sentence."
                frame: "_ aime le foot."
                options: ["Il", "Elle", "J'"]
                answer: ["Il"]
                option_audio: false
                hints:
                  - "Is Tom a boy or a girl?"
                  - "For a boy, say il."
                  - "Il aime le foot."
              - id: l1-f4
                type: multiple_choice
                text: "Her name is Inès. Which sentence is right?"
                say: { en: "Her name is Inès. Which sentence is right?" }
                show: { object: girl }
                options: ["Elle s'appelle Inès.", "Je m'appelle Inès.", "Il s'appelle Inès."]
                answer: "Elle s'appelle Inès."
                option_audio: false
                feedback:
                  "Je m'appelle Inès.": "That is Inès talking about herself. You are talking about her: elle s'appelle."
                hints:
                  - "You are talking about Inès, not about you."
                  - "Je m'appelle becomes elle s'appelle."
                  - "Elle s'appelle Inès."
              - id: l1-f5
                type: speak
                say: { en: "Say in French: he plays football.", fr: "Il joue au foot." }
                show: { object: play-football }
                expected_text: "Il joue au foot."
                hints:
                  - "He is il."
                  - "Il joue, then au foot."
                  - "Say it with me: il joue au foot."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Max likes reading. Which sentence is right?"
                say: { en: "Max likes reading. Which sentence is right?" }
                show: { object: read }
                options: ["Il aime lire.", "Il aimes lire.", "Elle aime lire."]
                answer: "Il aime lire."
                option_audio: false
                hints: ["Max is a boy, and French adds no s."]
              - id: l1-s2
                type: audio_choice
                text: "What does Hugo like?"
                say: { en: "Listen. What does Hugo like?" }
                audio: { fr: "Voici mon frère. Il s'appelle Hugo. Il aime chanter.", speaker: female }
                options: [{ object: sing }, { object: swim }, { object: read }]
                answer: sing
                hints: ["Listen after il aime."]
              - id: l1-s3
                type: fill_in_blank
                text: "Grandma loves cats. Finish the sentence."
                frame: "Mamie _ les chats."
                options: ["aime", "aimes", "aimer"]
                answer: ["aime"]
                option_audio: false
                hints: ["No s after a person's name either."]
              - id: l1-s4
                type: true_false
                text: "Sam is a boy. Is this sentence right for Sam?\nElle joue au foot."
                say: { en: "Sam is a boy. Is the sentence right for Sam?" }
                answer: false
                hints: ["For a boy, say il."]
              - id: l1-s5
                type: speak
                say: { en: "Say in French: she likes singing.", fr: "Elle aime chanter." }
                show: { object: sing }
                expected_text: "Elle aime chanter."
                hints: ["Say it with me: elle aime chanter."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Dad plays the guitar. Which sentence is right?"
                say: { en: "Dad plays the guitar. Which sentence is right?" }
                show: { object: play-guitar }
                options: ["Il joue de la guitare.", "Il joues de la guitare.", "Je joue de la guitare."]
                answer: "Il joue de la guitare."
                option_audio: false
              - id: l1-n2
                type: audio_choice
                text: "What does Chloé like?"
                say: { en: "Listen. What does Chloé like?" }
                audio: { fr: "Ma sœur s'appelle Chloé. Elle aime nager.", speaker: male }
                options: [{ object: swim }, { object: dance }, { object: ride-bike }]
                answer: swim
              - id: l1-n3
                type: ordering
                option_audio: false
                text: "Build the sentence: she likes painting."
                say: { en: "Build the sentence: she likes painting." }
                options: ["peindre.", "aime", "Elle"]
                slot_count: 3
                answer: ["Elle", "aime", "peindre."]
              - id: l1-n4
                type: fill_in_blank
                text: "Grandad's name is Paul. Finish the sentence."
                frame: "Papi _ Paul."
                options: ["s'appelle", "m'appelle", "appelle"]
                answer: ["s'appelle"]
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it written correctly?\nElle aimes le chocolat."
                say: { en: "Read the sentence. Is it written correctly?" }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Hugo likes swimming. Which sentence is right?"
            say: { en: "Hugo likes swimming. Which sentence is right?" }
            options: ["Il aime nager.", "Il aimes nager.", "Elle aime nager."]
            answer: "Il aime nager."
            option_audio: false
          - id: l1-c2
            type: audio_choice
            text: "What does he play?"
            say: { en: "Listen. What does he play?" }
            audio: { fr: "Il joue de la guitare." }
            options: [{ object: play-guitar }, { object: play-tennis }, { object: sing }]
            answer: play-guitar
          - id: l1-c3
            type: fill_in_blank
            text: "Zoé loves dancing. Finish the sentence."
            frame: "_ aime danser."
            options: ["Elle", "Il", "J'"]
            answer: ["Elle"]
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Her name is Manon. Is this sentence right?\nElle s'appelle Manon."
            say: { en: "Her name is Manon. Read the sentence. Is it right?" }
            answer: true
          - id: l1-c5
            type: ordering
            option_audio: false
            text: "Build the sentence: he likes singing."
            say: { en: "Build the sentence: he likes singing." }
            options: ["chanter.", "aime", "Il", "aimes"]
            slot_count: 3
            answer: ["Il", "aime", "chanter."]
          - id: l1-c6
            type: audio_choice
            text: "What does she like?"
            say: { en: "Listen. What does she like?" }
            audio: { fr: "Elle aime lire." }
            options: [{ object: read }, { object: sing }, { object: paint }]
            answer: read

  - n: 2
    title: { de: "Il a, elle est", en: "Il a, elle est" }
    goal:
      de: "Sag, was ein anderes Kind hat oder wie es ist, so wie il a un chien oder elle est grande."
      en: "Say what someone else has or is, as in il a un chien or elle est grande."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Léa likes singing. Which sentence is right?"
            say: { en: "Léa likes singing. Which sentence is right?" }
            options: ["Elle aime chanter.", "Elle aimes chanter.", "J'aime chanter."]
            answer: "Elle aime chanter."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "What does she play?"
            say: { en: "Listen. What does she play?" }
            audio: { fr: "Elle joue au foot." }
            options: [{ object: play-football }, { object: play-tennis }, { object: dance }]
            answer: play-football
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Il a un chien."
            say: { en: "Guess first! You know j'ai un chien: I have got a dog. Now listen: il a un chien. Who has got the dog now: you, or a boy?", fr: "Il a un chien." }
            show: { object: dog }
          - text: "J'ai un chien.\nIl a un chien."
            say: { en: "A boy! Some verbs change more. J'ai, I have, becomes il a or elle a: he has, she has.", fr: "J'ai un chien. Il a un chien." }
            show: { object: dog }
          - text: "J'ai neuf ans.\nElle a neuf ans."
            say: { en: "Age works the same way: elle a neuf ans, she is nine.", fr: "J'ai neuf ans. Elle a neuf ans." }
            show: { object: girl }
          - text: "Je suis grand.\nIl est grand. Elle est grande."
            say: { en: "Je suis, I am, becomes il est or elle est. For a girl, the describing word adds an e: elle est grande.", fr: "Je suis grand. Il est grand. Elle est grande." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Tom has got a cat. Which sentence is right?"
                say: { en: "Tom has got a cat. Which sentence is right?" }
                show: { object: cat }
                options: ["Il a un chat.", "Il ai un chat.", "Il est un chat."]
                answer: "Il a un chat."
                option_audio: false
                feedback:
                  "Il ai un chat.": "Ai goes with je: j'ai. With il, say il a."
                  "Il est un chat.": "That says Tom is a cat. Miaou! Tom has got a cat: il a un chat."
                hints:
                  - "Has got is a, from j'ai."
                  - "J'ai becomes il a."
                  - "Il a un chat."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Léa is tall. Which sentence is right?"
                say: { en: "Léa is tall. Which sentence is right?" }
                options: ["Elle est grande.", "Elle suis grande.", "Elle a grande."]
                answer: "Elle est grande."
                option_audio: false
                feedback:
                  "Elle suis grande.": "Suis goes with je: je suis. With elle, say elle est."
                hints:
                  - "Is is est, from je suis."
                  - "Je suis becomes elle est."
                  - "Elle est grande."
              - id: l2-f3
                type: audio_choice
                text: "How old is Max?"
                say: { en: "Listen. How old is Max?" }
                audio: { fr: "Voici mon ami Max. Il a dix ans.", speaker: female }
                options: ["10", "2", "12"]
                answer: "10"
                hints:
                  - "Listen after il a."
                  - "Dix, not deux or douze."
                  - "Max is 10."
              - id: l2-f4
                type: fill_in_blank
                text: "Mum has got a car. Finish the sentence."
                frame: "Maman _ une voiture."
                options: ["a", "ai", "est"]
                answer: ["a"]
                option_audio: false
                hints:
                  - "Has got is a form of j'ai."
                  - "With a person's name, it is like elle."
                  - "Maman a une voiture."
              - id: l2-f5
                type: speak
                say: { en: "Say in French: she is nine.", fr: "Elle a neuf ans." }
                show: { object: girl }
                expected_text: "Elle a neuf ans."
                hints:
                  - "Age uses a."
                  - "Elle a, then neuf ans."
                  - "Say it with me: elle a neuf ans."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Hugo has got a rabbit. Which sentence is right?"
                say: { en: "Hugo has got a rabbit. Which sentence is right?" }
                options: ["Il a un lapin.", "Il ai un lapin.", "J'ai un lapin."]
                answer: "Il a un lapin."
                option_audio: false
                hints: ["J'ai becomes il a."]
              - id: l2-s2
                type: fill_in_blank
                text: "Dad is happy. Finish the sentence."
                frame: "Papa _ content."
                options: ["est", "suis", "a"]
                answer: ["est"]
                option_audio: false
                hints: ["Is is est."]
              - id: l2-s3
                type: audio_choice
                text: "What has the sister got?"
                say: { en: "Listen. What has the sister got?" }
                audio: { fr: "Ma sœur a huit ans. Elle a un chat.", speaker: male }
                options: [{ object: cat }, { object: dog }, { object: rabbit }]
                answer: cat
                hints: ["Listen after elle a un."]
              - id: l2-s4
                type: true_false
                text: "Is it written correctly?\nIl suis petit."
                say: { en: "Read the sentence. Is it written correctly?" }
                answer: false
                hints: ["Suis goes with je."]
              - id: l2-s5
                type: ordering
                option_audio: false
                text: "Build the sentence: he is ten."
                say: { en: "Build the sentence: he is ten." }
                options: ["dix ans.", "a", "Il"]
                slot_count: 3
                answer: ["Il", "a", "dix ans."]
                hints: ["Age uses a: il a."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Grandma has got a dog. Which sentence is right?"
                say: { en: "Grandma has got a dog. Which sentence is right?" }
                options: ["Mamie a un chien.", "Mamie ai un chien.", "Mamie est un chien."]
                answer: "Mamie a un chien."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Inès is sad. Finish the sentence."
                frame: "Inès _ triste."
                options: ["est", "suis", "a"]
                answer: ["est"]
                option_audio: false
              - id: l2-n3
                type: audio_choice
                text: "What does Paul like?"
                say: { en: "Listen. What does Paul like?" }
                audio: { fr: "Voici Paul. Il a neuf ans. Il est grand. Il aime le foot." }
                options: [{ object: play-football }, { object: swim }, { object: read }]
                answer: play-football
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Build the sentence: she has got a bike."
                say: { en: "Build the sentence: she has got a bike." }
                options: ["un vélo.", "Elle", "a"]
                slot_count: 3
                answer: ["Elle", "a", "un vélo."]
              - id: l2-n5
                type: true_false
                text: "Your friend Mia is eleven. Is this sentence right for Mia?\nElle a onze ans."
                say: { en: "Your friend Mia is eleven. Is the sentence right for Mia?" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: aime-joue
            type: multiple_choice
            text: "Max plays tennis. Which sentence is right?"
            say: { en: "Max plays tennis. Which sentence is right?" }
            options: ["Il joue au tennis.", "Il joues au tennis.", "Je joue au tennis."]
            answer: "Il joue au tennis."
            option_audio: false
          - id: l2-c2
            part: etre
            type: multiple_choice
            text: "Chloé is happy. Which sentence is right?"
            say: { en: "Chloé is happy. Which sentence is right?" }
            options: ["Elle est contente.", "Elle suis contente.", "Elle a contente."]
            answer: "Elle est contente."
            option_audio: false
          - id: l2-c3
            part: understand
            type: audio_choice
            text: "How old is Zoé?"
            say: { en: "Listen. How old is Zoé?" }
            audio: { fr: "Voici ma cousine. Elle s'appelle Zoé. Elle a sept ans.", speaker: male }
            options: ["7", "17", "11"]
            answer: "7"
          - id: l2-c4
            part: avoir
            type: fill_in_blank
            text: "Léo has got a fish. Finish the sentence."
            frame: "Léo _ un poisson."
            options: ["a", "ai", "est"]
            answer: ["a"]
            option_audio: false
          - id: l2-c5
            part: understand
            type: audio_choice
            text: "What does the brother like?"
            say: { en: "Listen. What does the brother like?" }
            audio: { fr: "Mon frère aime lire, mais il n'aime pas danser.", speaker: female }
            options: [{ object: read }, { object: dance }, { object: sing }]
            answer: read
          - id: l2-c6
            part: il-elle
            type: audio_choice
            text: "Who is it about?"
            say: { en: "Listen. Who is it about?" }
            audio: { fr: "Elle aime peindre." }
            options: [{ object: girl }, { object: boy }]
            answer: girl
          - id: l2-c7
            part: il-elle
            type: sorting
            option_audio: false
            text: "Do you say il or elle? Sort the cards."
            say: { en: "Do you say il or elle for each person? Sort the cards." }
            bins:
              - { id: il, show: { text: "il" } }
              - { id: elle, show: { text: "elle" } }
            options:
              - { text: "Papi", bin: il }
              - { text: "mon frère", bin: il }
              - { text: "Tom", bin: il }
              - { text: "Maman", bin: elle }
              - { text: "ma sœur", bin: elle }
              - { text: "Inès", bin: elle }
          - id: l2-c8
            part: il-elle
            type: true_false
            text: "Léa is a girl. Is this sentence right for Léa?\nIl a dix ans."
            say: { en: "Léa is a girl. Read the sentence. Is it right for Léa?" }
            answer: false
          - id: l2-c9
            part: understand
            type: true_false
            text: "Is Emma happy?"
            say: { en: "Listen. Is Emma happy?" }
            audio: { fr: "Voici ma cousine Emma. Elle est triste.", speaker: male }
            answer: false
          - id: l2-c10
            part: il-elle
            type: ordering
            option_audio: false
            text: "Build the sentence: she plays tennis."
            say: { en: "Build the sentence: she plays tennis." }
            options: ["au tennis.", "joue", "Il", "Elle"]
            slot_count: 3
            answer: ["Elle", "joue", "au tennis."]
          - id: l2-c11
            part: aime-joue
            type: fill_in_blank
            option_audio: false
            text: "Inès plays the guitar. Finish the sentence."
            say: { en: "Inès plays the guitar. Finish the sentence." }
            frame: "Inès _ de la guitare."
            options: ["joue", "joues", "jouer"]
            answer: ["joue"]
          - id: l2-c12
            part: aime-joue
            type: true_false
            text: "Is it written correctly?\nMa sœur aime chanter."
