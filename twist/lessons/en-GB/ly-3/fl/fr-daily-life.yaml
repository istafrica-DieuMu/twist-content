# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-daily-life
skill: fl.culture-strategies.compare-daily-life
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Alltag in Frankreich (Französisch)
  en: Daily life in France
summary: >
  Comparing a child's day in France with a day in England, through Jade,
  who is nine and lives in Lyon. Lesson 1 is about school: no uniform in
  most state schools, a school day from about half past eight to half past
  four with a long lunch at la cantine, many schools with no lessons on
  Wednesday afternoon, and Jade's class, CM1, which is Year 5 in England.
  Lesson 2 is about food and celebrations (tartines and hot chocolate in a
  bowl for breakfast, le goûter after school, le 14 juillet), and ends with
  the skill check. Every lesson names what is the same as well as what
  differs, and says "many children", not "all children".
metadata:
  year: ly-3
  topic: { de: Die Welt der Sprache, en: Where the language is spoken }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.culture-strategies.where-spoken]
  also_practises: [fl.themes.school, fl.themes.food, fl.themes.clothes]
  vocabulary: { fr: [l'école, la cantine, le mercredi, CM1, le petit déjeuner, la tartine, le beurre, la confiture, un bol, le chocolat chaud, le goûter, le 14 juillet] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: all-different
      what: Thinks life in France is different in every way and misses what is the same
      addressed: lesson 1 Learn ends with what Jade and the child share; every sorting task has a bin for both countries (l1-f5, l2-s5, l2-c5); l1-s4 and l2-n3 ask what is the same
    - id: all-children
      what: Turns one child's habit into a rule for everyone ("all French children eat croissants every day")
      addressed: lesson 2 Learn says Jade is one child and to say "many", not "all"; l2-f3, l2-s3 and l2-c4 offer the "all" or "nobody" sentence as a wrong option, with feedback in l2-f3
    - id: uniform-everywhere
      what: Expects French children to wear a school uniform, as most English children do
      addressed: lesson 1 Learn says most French state schools have no uniform; l1-f2 asks, with feedback, and l1-n2 asks again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Ein Schultag in Frankreich, en: A school day in France }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { en: "Listen. Where does Jade live?" }
            audio: { fr: "Salut ! Je m'appelle Jade. J'habite à Lyon, en France." }
            options: ["in France", "in Canada", "in Belgium"]
            answer: "in France"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is the capital of France?"
            say: { en: "What is the capital of France?" }
            options: ["Paris", "Lyon", "Brussels"]
            answer: "Paris"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Salut ! Je m'appelle Jade. J'ai neuf ans. Je vais à l'école Victor Hugo."
            say: { en: "Jade is nine and goes to school in France. Listen to what she says.", fr: "Salut ! Je m'appelle Jade. J'ai neuf ans. Je vais à l'école Victor Hugo." }
            show: { object: girl }
          - text: "no school uniform\nÀ l'école, je porte un jean et un pull."
            say: { en: "In most French state schools there is no uniform. Children wear their own clothes. In England most children wear a school uniform.", fr: "À l'école, je porte un jean et un pull." }
            show: { object: jumper, colour: green }
          - text: "8 h 30 to 16 h 30\nla cantine\nL'école commence à huit heures et demie. Le mercredi après-midi, je n'ai pas école."
            say: { en: "Jade's school starts at half past eight and finishes at half past four. Lunch is long, often an hour and a half. Many children eat at la cantine: a starter, a main course, cheese or a yoghurt, and a pudding. On Wednesday afternoon many French children have no school.", fr: "L'école commence à huit heures et demie. Le mercredi après-midi, je n'ai pas école." }
          - text: "CM1 = Year 5"
            say: { en: "Jade's class is called CM1. In England she would be in Year 5. A lot is the same too: Jade has maths and PE, she plays football at break time, and she has a long holiday in summer." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { en: "Listen. What does Jade wear at school?" }
                audio: { fr: "À l'école, je porte un pull rouge et un jean." }
                options: [{ object: jumper, colour: red }, { object: jumper, colour: blue }, { object: dress }]
                answer: red
                hints:
                  - "Listen for the colour."
                  - "Jade says un pull rouge."
                  - "Rouge is red. Tap the red jumper."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Most children in French state schools wear a school uniform."
                say: { en: "Is this true?" }
                answer: false
                feedback:
                  "true": "In England most children wear a uniform. In most French state schools children wear their own clothes."
                hints:
                  - "Think of what Jade wears."
                  - "Jade wears her own jumper and jeans."
                  - "No, most French state schools have no uniform."
              - id: l1-f3
                type: audio_choice
                say: { en: "Listen. When does Jade's school start?" }
                audio: { fr: "L'école commence à huit heures et demie." }
                options: ["at half past eight", "at nine o'clock", "at half past nine"]
                answer: "at half past eight"
                hints:
                  - "Listen to the number before heures."
                  - "Huit is eight. Et demie is half past."
                  - "At half past eight."
              - id: l1-f4
                type: multiple_choice
                text: "Jade is in CM1. Which year is that in England?"
                say: { en: "Jade is in CM1. Which year is that in England?" }
                options: ["Year 5", "Year 1", "Year 3"]
                answer: "Year 5"
                option_audio: false
                hints:
                  - "Jade is nine."
                  - "In England, children of nine and ten are in Year 5."
                  - "CM1 is Year 5."
              - id: l1-f5
                type: sorting
                text: "In France, in England or in both?"
                say: { en: "Sort the cards. Is it in France, in England, or in both?" }
                option_audio: false
                bins:
                  - { id: france, show: { text: "in France" } }
                  - { id: england, show: { text: "in England" } }
                  - { id: both, show: { text: "in both" } }
                options:
                  - { text: "no uniform in most state schools", bin: france }
                  - { text: "no school on Wednesday afternoon in many schools", bin: france }
                  - { text: "a uniform in most schools", bin: england }
                  - { text: "school until about half past three", bin: england }
                  - { text: "maths and PE", bin: both }
                  - { text: "football at break time", bin: both }
                hints:
                  - "Think of everything Jade told you."
                  - "No uniform and free Wednesday afternoons are in France."
                  - "Maths, PE and football at break are in both."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { en: "Listen. Where does Jade eat lunch?" }
                audio: { fr: "À midi, je mange à la cantine avec mes copains." }
                options: ["at school, in la cantine", "at home", "in the park"]
                answer: "at school, in la cantine"
                hints: ["La cantine is the school canteen."]
              - id: l1-s2
                type: multiple_choice
                text: "What does Jade have at lunch at la cantine?"
                say: { en: "What does Jade often have at lunch at la cantine?" }
                options: ["a starter, a main, cheese or a yoghurt, and a pudding", "a sandwich from home", "only a pudding"]
                answer: "a starter, a main, cheese or a yoghurt, and a pudding"
                hints: ["Lunch in France is long, with several courses."]
              - id: l1-s3
                type: true_false
                text: "Many French children have no school on Wednesday afternoon."
                say: { en: "Is this true?" }
                answer: true
                hints: ["Think of what Jade says about le mercredi."]
              - id: l1-s4
                type: multiple_choice
                text: "What is the same for Jade and for you?"
                say: { en: "What is the same for Jade and for a child in England?" }
                options: ["They play football at break time.", "They wear a school uniform.", "They finish school at half past four."]
                answer: "They play football at break time."
                hints: ["Jade has no uniform and finishes later."]
              - id: l1-s5
                type: audio_choice
                say: { en: "Listen. When does Jade's school finish?" }
                audio: { fr: "L'école finit à seize heures trente." }
                options: ["at half past four", "at half past three", "at six o'clock"]
                answer: "at half past four"
                hints: ["Seize heures trente is 16:30 on the 24-hour clock."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { en: "Listen. Which class is Hugo in?" }
                audio: { fr: "Je m'appelle Hugo. J'ai dix ans. Je suis en CM2." }
                options: ["CM2", "CM1", "CP"]
                answer: "CM2"
              - id: l1-n2
                type: multiple_choice
                text: "What do most children wear at a French state school?"
                say: { en: "What do most children wear at a French state school?" }
                options: ["their own clothes", "a school uniform", "a tracksuit every day"]
                answer: "their own clothes"
              - id: l1-n3
                type: true_false
                text: "Lunch at a French school is often short, about 20 minutes."
                say: { en: "Is this true?" }
                answer: false
              - id: l1-n4
                type: audio_choice
                say: { en: "Listen. What does Léo do on Wednesday afternoon?" }
                audio: { fr: "Le mercredi après-midi, je n'ai pas école. Je vais au judo." }
                options: ["He goes to judo.", "He goes to school.", "He has lunch at la cantine."]
                answer: "He goes to judo."
              - id: l1-n5
                type: multiple_choice
                text: "Hugo is in CM2. Which year is that in England?"
                say: { en: "Hugo is in CM2, the class after CM1. Which year is that in England?" }
                options: ["Year 6", "Year 5", "Year 2"]
                answer: "Year 6"
                option_audio: false
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { en: "Listen. Where does Lina eat lunch?" }
            audio: { fr: "Je mange à la cantine. Aujourd'hui, il y a du poulet et des frites !" }
            options: ["at la cantine", "at home", "at a café"]
            answer: "at la cantine"
          - id: l1-c2
            type: true_false
            text: "Jade plays football at break time, like many children in England."
            say: { en: "Is this true?" }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Which is different in France?"
            say: { en: "Which is different in France?" }
            options: ["Many children have no school on Wednesday afternoon.", "Children learn maths.", "Children have a summer holiday."]
            answer: "Many children have no school on Wednesday afternoon."

  - n: 2
    title: { de: Essen und Feste in Frankreich, en: Food and celebrations in France }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Most French state schools have a school uniform."
            say: { en: "Is this true?" }
            answer: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { en: "Listen. Where does Jade eat lunch?" }
            audio: { fr: "À midi, je mange à la cantine." }
            options: ["at la cantine", "at home"]
            answer: "at la cantine"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "le petit déjeuner\nLe matin, je mange des tartines avec du beurre et de la confiture. Je bois un chocolat chaud dans un bol."
            say: { en: "For breakfast Jade has tartines: bread with butter and jam. She drinks hot chocolate from a bowl, un bol. Some families have croissants at the weekend.", fr: "Le matin, je mange des tartines avec du beurre et de la confiture. Je bois un chocolat chaud dans un bol." }
            show: { objects: [bread, milk] }
          - text: "le goûter, 16 h 30\nAprès l'école, c'est le goûter ! Je mange une pomme."
            say: { en: "After school many French children have le goûter, an afternoon snack: bread with chocolate, a biscuit or fruit. Dinner is often later, at about half past seven.", fr: "Après l'école, c'est le goûter ! Je mange une pomme." }
            show: { object: apple }
          - text: "le 14 juillet\nLe 14 juillet, on regarde les feux d'artifice."
            say: { en: "On 14 July France has its national day, with a parade and fireworks. In England there is no national day like it, but many children watch fireworks on Bonfire Night.", fr: "Le 14 juillet, on regarde les feux d'artifice." }
          - text: "many, not all"
            say: { en: "Jade is one child. Not everyone in France does the same. So we say: many French children have hot chocolate for breakfast. We do not say all French children." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { en: "Listen. What does Jade drink at breakfast?" }
                audio: { fr: "Le matin, je bois un chocolat chaud dans un bol." }
                options: ["hot chocolate", "orange juice", "tea"]
                answer: "hot chocolate"
                hints:
                  - "Listen for chocolat."
                  - "Un chocolat chaud is a hot chocolate."
                  - "She drinks hot chocolate."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is a tartine?"
                say: { en: "What is a tartine?" }
                options: ["bread with butter and jam", "a hot drink", "a chocolate cake"]
                answer: "bread with butter and jam"
                hints:
                  - "Jade eats it at breakfast."
                  - "It has beurre and confiture on it."
                  - "Bread with butter and jam."
              - id: l2-f3
                type: multiple_choice
                text: "Jade drinks hot chocolate in the morning. Which sentence is best?"
                say: { en: "Jade drinks hot chocolate in the morning. Which sentence is best?" }
                options: ["Many French children drink hot chocolate in the morning.", "All French children drink hot chocolate in the morning.", "Nobody in England drinks hot chocolate."]
                answer: "Many French children drink hot chocolate in the morning."
                feedback:
                  "All French children drink hot chocolate in the morning.": "Jade is one child. Not everyone does the same, so say many, not all."
                hints:
                  - "Is Jade every child in France?"
                  - "Say many, not all or nobody."
                  - "Many French children drink hot chocolate in the morning."
              - id: l2-f4
                type: audio_choice
                say: { en: "Listen. What does Hugo have for le goûter?" }
                audio: { fr: "Après l'école, pour le goûter, je mange du pain et du chocolat." }
                options: ["bread and chocolate", "a pizza", "soup"]
                answer: "bread and chocolate"
                hints:
                  - "Listen after pour le goûter."
                  - "Du pain is bread."
                  - "Bread and chocolate."
              - id: l2-f5
                type: multiple_choice
                text: "What happens on 14 July in France?"
                say: { en: "What happens on 14 July in France?" }
                options: ["a parade and fireworks", "Easter egg hunts", "presents from le Père Noël"]
                answer: "a parade and fireworks"
                hints:
                  - "It is France's national day."
                  - "At night the sky lights up."
                  - "A parade and fireworks."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { en: "Listen. What does Jade eat in the morning?" }
                audio: { fr: "Le matin, je mange des tartines avec de la confiture." }
                options: [{ object: bread }, { object: pizza }, { object: egg }]
                answer: bread
                hints: ["Tartines are slices of bread."]
              - id: l2-s2
                type: multiple_choice
                text: "What is le goûter?"
                say: { en: "What is le goûter?" }
                options: ["a snack after school", "a big lunch", "a breakfast drink"]
                answer: "a snack after school"
                hints: ["Many children have it at about half past four."]
              - id: l2-s3
                type: multiple_choice
                text: "Hugo has croissants at the weekend. Which sentence is best?"
                say: { en: "Hugo has croissants at the weekend. Which sentence is best?" }
                options: ["All French children eat croissants every day.", "Some French families have croissants at the weekend.", "Nobody in France eats croissants."]
                answer: "Some French families have croissants at the weekend."
                hints: ["Hugo is one child."]
              - id: l2-s4
                type: true_false
                text: "Dinner in France is often at about half past seven."
                say: { en: "Is this true?" }
                answer: true
                hints: ["Remember le goûter comes first, after school."]
              - id: l2-s5
                type: sorting
                text: "In France, in England or in both?"
                say: { en: "Sort the cards. Is it in France, in England, or in both?" }
                option_audio: false
                bins:
                  - { id: france, show: { text: "in France" } }
                  - { id: england, show: { text: "in England" } }
                  - { id: both, show: { text: "in both" } }
                options:
                  - { text: "le goûter after school", bin: france }
                  - { text: "a national day on 14 July", bin: france }
                  - { text: "Bonfire Night", bin: england }
                  - { text: "birthday cake with candles", bin: both }
                hints: ["Birthdays are the same in both countries."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { en: "Listen. What does Lina drink in the morning?" }
                audio: { fr: "Le matin, je bois un jus d'orange et je mange une tartine." }
                options: [{ object: juice }, { object: milk }, { object: water }]
                answer: juice
              - id: l2-n2
                type: audio_choice
                say: { en: "Listen. What does Tom see on 14 July?" }
                audio: { fr: "C'est le 14 juillet ! Le soir, on regarde les feux d'artifice." }
                options: ["fireworks", "a Christmas tree", "Easter eggs"]
                answer: "fireworks"
              - id: l2-n3
                type: multiple_choice
                text: "What is the same for Jade and for you?"
                say: { en: "What is the same for Jade and for a child in England?" }
                options: ["Birthdays with a cake and candles.", "Le goûter at half past four.", "Hot chocolate in a bowl."]
                answer: "Birthdays with a cake and candles."
              - id: l2-n4
                type: true_false
                text: "Le goûter is a snack before school."
                say: { en: "Is this true?" }
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "What does Jade drink her hot chocolate from?"
                say: { en: "What does Jade drink her hot chocolate from?" }
                options: ["a bowl", "a bottle", "a glass"]
                answer: "a bowl"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { en: "Listen. When does Manon have dinner?" }
            audio: { fr: "Le soir, je dîne à sept heures et demie." }
            options: ["at half past seven", "at half past five", "at half past four"]
            answer: "at half past seven"
          - id: l2-c2
            type: multiple_choice
            text: "Which is true for many French primary schools?"
            say: { en: "Which is true for many French primary schools?" }
            options: ["Lunch is long, often an hour and a half.", "Lunch is only ten minutes.", "There is no lunch at school."]
            answer: "Lunch is long, often an hour and a half."
          - id: l2-c3
            type: audio_choice
            say: { en: "Listen. What does Noah eat for le goûter?" }
            audio: { fr: "Pour le goûter, je mange une pomme et un biscuit." }
            options: ["an apple and a biscuit", "bread and jam", "a croissant"]
            answer: "an apple and a biscuit"
          - id: l2-c4
            type: multiple_choice
            text: "Léa goes to judo on Wednesday afternoon. Which sentence is best?"
            say: { en: "Léa goes to judo on Wednesday afternoon. Which sentence is best?" }
            options: ["Many French children have clubs on Wednesday afternoon.", "All French children do judo.", "French children never go to clubs."]
            answer: "Many French children have clubs on Wednesday afternoon."
          - id: l2-c5
            type: sorting
            text: "In France, in England or in both?"
            say: { en: "Sort these cards. France, England, or both?" }
            option_audio: false
            bins:
              - { id: france, show: { text: "in France" } }
              - { id: england, show: { text: "in England" } }
              - { id: both, show: { text: "in both" } }
            options:
              - { text: "class CM1 for children of nine", bin: france }
              - { text: "a uniform in most schools", bin: england }
              - { text: "maths lessons", bin: both }
              - { text: "fireworks on a special night", bin: both }
