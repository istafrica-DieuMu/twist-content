# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-video
skill: fl.listening.video
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Kurze Clips verstehen (Französisch)
  en: Understanding short clips in French
summary: >
  Short French clips and cartoons on familiar topics: a dog in the park,
  making crêpes, the weather report, a trip to the zoo, a race between a
  snail and a bird. Each clip is a few spoken lines with its pictures on
  screen, so the child uses what it sees to understand what it hears.
  Lesson 1 finds what a clip is about with the help of the pictures; lesson
  2 listens for details and for the order of the scenes (d'abord, ensuite,
  à la fin), and ends with the skill check. Questions and options are in
  English or pictures, so every task tests listening.
metadata:
  year: ly-3
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.stories]
  also_practises: [fl.culture-strategies.guess-meaning, fl.themes.weather, fl.themes.food, fl.themes.outside-animals]
  vocabulary: { fr: [regarde, aujourd'hui, "d'abord", ensuite, à la fin, le matin, l'après-midi, il fait beau, il pleut, les œufs, le lait, les crêpes, le zoo, la course, rapide, lent, gagne] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: gist, what: { de: "mit Hilfe der Bilder verstehen, worum es im Clip geht", en: understanding what a clip is about with the help of the pictures } }
    - { id: detail, what: { de: "eine Einzelheit heraushören: wie viele, welche Farbe, wo", en: "listening for a detail: how many, what colour, where" } }
    - { id: which-one, what: { de: "hören, was der Clip über jedes von zwei Dingen im Bild sagt", en: what the clip says about each of two things in the picture } }
    - { id: order, what: { de: "die Reihenfolge und das Ende verstehen (d'abord, ensuite, à la fin)", en: "understanding the order and the end (d'abord, ensuite, à la fin)" } }
  misconceptions:
    - id: ignore-pictures
      what: Listens only and gives up on unknown words, without using the pictures of the clip
      addressed: lesson 1 Learn says the pictures help you understand; the full-stage hints of lesson 1 point to the pictures first
    - id: picture-not-words
      what: Picks whatever is in the picture, even when the clip says something else about it
      addressed: l1-f4, l1-s4 and l2-f3 show two animals and ask about one; feedback in l1-f4 and l1-s4 says to listen to what the clip says about each
    - id: first-mentioned
      what: Takes the first thing heard as the answer when the question asks about the end
      addressed: lesson 2 Learn brings d'abord, ensuite, à la fin and le matin, l'après-midi; l2-f2 gives feedback when the morning weather is taken for the afternoon; l2-n2 and l2-c2 ask about the end again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Worum geht es im Clip?", en: "What is the clip about?" }
    goal:
      de: "Schau einen kurzen französischen Clip an und finde mit Hilfe der Bilder heraus, worum es geht."
      en: "Watch a short French clip and use the pictures to find out what it is about."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "What does the mouse find?"
            say: { en: "Listen to the story. What does the mouse find?" }
            audio: { fr: "Une petite souris a faim. Elle trouve du fromage. Miam !" }
            options: [{ object: cheese }, { object: bread }, { object: apple }]
            answer: cheese
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which animal is it?"
            say: { en: "Listen. Which animal is it?" }
            audio: { fr: "Regarde ! Il est grand et gris. C'est un éléphant." }
            options: [{ object: elephant }, { object: mouse }, { object: giraffe }]
            answer: elephant
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { en: "Now you watch short clips, like little films. Look at the pictures. They help you understand.", fr: "Regarde, voici Sam et son chien Rex. Sam lance la balle. Rex court, court. Bravo, Rex !" }
            show: { objects: [dog, ball] }
          - say: { en: "What did you see? A dog and a ball. What did you hear? Chien, balle and court. The pictures and the words together tell you: Sam is playing with his dog." }
            show: { objects: [dog, ball] }
          - text: "pictures + words you know = what it is about"
            say: { en: "You do not need to understand every word. Look at the pictures and listen for the words you know. Then you know what the clip is about." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What is the clip about?"
                say: { en: "Look and listen. What is the clip about?" }
                show: { objects: [egg, milk] }
                audio: { fr: "Bonjour ! Aujourd'hui, on fait des crêpes. D'abord, deux œufs. Ensuite, du lait. On mélange. Miam, des crêpes !" }
                options: ["Someone is making pancakes.", "Someone is buying eggs.", "Someone is having a party."]
                answer: "Someone is making pancakes."
                hints:
                  - "Look at the pictures: eggs and milk."
                  - "You hear: on fait des crêpes."
                  - "Des crêpes are thin French pancakes. Someone is making them."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What kind of clip is it?"
                say: { en: "Look and listen. What kind of clip is it?" }
                show: { objects: [sun, rain] }
                audio: { fr: "Bonjour ! Voici la météo pour aujourd'hui. Le matin, il fait beau. L'après-midi, il pleut." }
                options: ["the weather report", "a cooking clip", "an animal film"]
                answer: "the weather report"
                hints:
                  - "Look at the pictures: sun and rain."
                  - "Do you hear il fait beau and il pleut?"
                  - "La météo is the weather report."
              - id: l1-f3
                type: audio_choice
                text: "Where is the clip?"
                say: { en: "Look and listen. Where is the clip?" }
                show: { objects: [elephant, giraffe, monkey] }
                audio: { fr: "Bienvenue au zoo ! Voici Ella, l'éléphante. Elle est très grande. Et voici un singe. Il adore les bananes !" }
                options: ["at the zoo", "on a farm", "at school"]
                answer: "at the zoo"
                feedback:
                  "on a farm": "Elephants and monkeys do not live on a farm. Listen to the first sentence: bienvenue au zoo."
                hints:
                  - "Look at the animals. Where do you see animals like these?"
                  - "The first sentence is bienvenue au zoo."
                  - "They are at the zoo."
              - id: l1-f4
                type: audio_choice
                text: "Who wins the race?"
                say: { en: "Look and listen. Who wins the race?" }
                show: { objects: [snail, bird] }
                audio: { fr: "Léo l'escargot est lent. Bella l'oiseau est rapide. C'est la course ! Bella vole, mais elle s'arrête et elle dort. Léo avance lentement, lentement, et il gagne !" }
                options: [{ object: snail }, { object: bird }]
                answer: snail
                feedback:
                  bird: "Bella is fast, but she stops and sleeps. Listen to the end: Léo ... il gagne."
                hints:
                  - "Both animals are in the picture. Listen to what the clip says about each."
                  - "Bella the bird stops and sleeps: elle dort."
                  - "Léo the snail wins."
              - id: l1-f5
                type: true_false
                text: "Sam is playing with his cat."
                say: { en: "Look and listen. Is this true?", fr: "Regarde, voici Sam et son chien Rex. Sam lance la balle. Rex court, court. Bravo, Rex !" }
                show: { objects: [dog, ball] }
                answer: false
                hints:
                  - "Look at the picture. Which animal do you see?"
                  - "You hear son chien Rex."
                  - "No, Rex is a dog."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What is the clip about?"
                say: { en: "Look and listen. What is the clip about?" }
                show: { objects: [whale, octopus] }
                audio: { fr: "Regarde la mer ! Il y a une grande baleine. Et voici une pieuvre. Elle a huit bras." }
                options: ["animals in the sea", "animals at the zoo", "animals on a farm"]
                answer: "animals in the sea"
                hints: ["La mer is the sea. Look at the animals."]
              - id: l1-s2
                type: audio_choice
                text: "What is Lily doing?"
                say: { en: "Look and listen. What is Lily doing?" }
                show: { objects: [bread, milk] }
                audio: { fr: "Il est sept heures. Lily se lève. Elle prend son petit déjeuner : du pain et du lait. Miam !" }
                options: ["She is having breakfast.", "She is going to bed.", "She is playing football."]
                answer: "She is having breakfast."
                hints: ["Look at the bread and milk. Listen for petit déjeuner."]
              - id: l1-s3
                type: true_false
                text: "The clip is about a birthday."
                say: { en: "Look and listen. Is this true?", fr: "Joyeux anniversaire, Tom ! Voici ton gâteau. Et voici tes ballons. Souffle les bougies !" }
                show: { objects: [cake, balloon] }
                answer: true
                hints: ["Do you hear joyeux anniversaire?"]
              - id: l1-s4
                type: audio_choice
                text: "Which animal loves bananas?"
                say: { en: "Look and listen. Which animal loves bananas?" }
                show: { objects: [elephant, monkey] }
                audio: { fr: "Voici Ella, l'éléphante. Elle est très grande. Et voici un singe. Il adore les bananes !" }
                options: [{ object: elephant }, { object: monkey }]
                answer: monkey
                feedback:
                  elephant: "About Ella you only hear: elle est très grande. The monkey loves bananas."
                hints: ["Listen to what the clip says about each animal."]
              - id: l1-s5
                type: audio_choice
                text: "What is Mia making?"
                say: { en: "Look and listen. What is Mia making?" }
                show: { objects: [snow, snowman] }
                audio: { fr: "Il fait froid et il neige. Mia sort dans le jardin. Elle fait un grand bonhomme de neige !" }
                options: [{ object: snowman }, { object: house }, { object: kite }]
                answer: snowman
                hints: ["Look at the pictures. It is snowing: il neige."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What is the clip about?"
                say: { en: "Look and listen. What is the clip about?" }
                show: { objects: [cow, pig] }
                audio: { fr: "Bienvenue à la ferme ! Voici la vache. Meuh ! Et voici le cochon. Il est tout rose." }
                options: ["animals on a farm", "animals in the sea", "a trip to the shops"]
                answer: "animals on a farm"
              - id: l1-n2
                type: audio_choice
                text: "What is the weather like?"
                say: { en: "Look and listen. What is the weather like?" }
                show: { objects: [snow, sun] }
                audio: { fr: "Voici la météo. Aujourd'hui, il neige. Il fait très froid !" }
                options: ["It is snowing.", "It is sunny.", "It is raining."]
                answer: "It is snowing."
              - id: l1-n3
                type: true_false
                text: "The clip is about making a kite."
                say: { en: "Look and listen. Is this true?", fr: "On fait un cerf-volant ! Il faut du papier, des ciseaux et des crayons. On coupe, on colorie, et voilà !" }
                show: { objects: [scissors, crayon, kite] }
                answer: true
              - id: l1-n4
                type: audio_choice
                text: "Who is hungry?"
                say: { en: "Look and listen. Who is hungry?" }
                show: { objects: [cat, dog] }
                audio: { fr: "Le chat dort sur le canapé. Le chien a faim. Il veut son repas !" }
                options: [{ object: cat }, { object: dog }]
                answer: dog
              - id: l1-n5
                type: audio_choice
                text: "Where are the children?"
                say: { en: "Look and listen. Where are the children?" }
                show: { objects: [teacher, book] }
                audio: { fr: "Bonjour, les enfants ! Ouvrez vos livres, s'il vous plaît. Aujourd'hui, on lit une histoire." }
                options: ["at school", "at the zoo", "at the beach"]
                answer: "at school"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "What is the clip about?"
            say: { en: "Look and listen. What is the clip about?" }
            show: { objects: [cake, present] }
            audio: { fr: "C'est l'anniversaire de Zoé ! Voici un gâteau et un cadeau. Joyeux anniversaire, Zoé !" }
            options: ["a birthday", "a trip to the zoo", "the weather"]
            answer: "a birthday"
          - id: l1-c2
            type: audio_choice
            text: "What does the bird do?"
            say: { en: "Look and listen. What does the bird do?" }
            show: { objects: [bird, snail] }
            audio: { fr: "L'escargot mange une feuille. L'oiseau chante dans l'arbre." }
            options: ["It sings.", "It eats a leaf.", "It sleeps."]
            answer: "It sings."
          - id: l1-c3
            type: true_false
            text: "The clip is about the weather."
            say: { en: "Look and listen. Is this true?", fr: "Voici la météo. Aujourd'hui, il y a du soleil. Il fait chaud !" }
            show: { object: sun }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "What is the clip about?"
            say: { en: "Look and listen. What is the clip about?" }
            show: { objects: [book, girl] }
            audio: { fr: "Le soir, maman lit une histoire à Léa. Léa écoute." }
            options: ["a bedtime story", "a football match", "a trip to the zoo"]
            answer: "a bedtime story"
          - id: l1-c5
            type: true_false
            text: "The clip is about the zoo."
            say: { en: "Look and listen. Is this true?", fr: "Bienvenue à la ferme ! Voici les poules et les vaches." }
            show: { objects: [hen, cow] }
            answer: false
          - id: l1-c6
            type: audio_choice
            text: "Where is the clip?"
            say: { en: "Look and listen. Where is the clip?" }
            show: { object: swimming-pool }
            audio: { fr: "Aujourd'hui, on nage à la piscine. L'eau est bleue !" }
            options: ["at the swimming pool", "at the beach", "in the park"]
            answer: "at the swimming pool"

  - n: 2
    title: { de: "Genau hinhören", en: "Listening for details" }
    goal:
      de: "Hör bei einem Clip genau hin und finde kleine Dinge und die Reihenfolge, mit d'abord und ensuite."
      en: "Listen closely to a clip for small details and the order, with d'abord and ensuite."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "What kind of clip is it?"
            say: { en: "Look and listen. What kind of clip is it?" }
            show: { object: rain }
            audio: { fr: "Voici la météo. Aujourd'hui, il pleut." }
            options: ["the weather report", "an animal film", "a cooking clip"]
            answer: "the weather report"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Where are the children?"
            say: { en: "Look and listen. Where are the children?" }
            show: { objects: [giraffe, lion] }
            audio: { fr: "Bienvenue au zoo ! Regarde la girafe !" }
            options: ["at the zoo", "at school", "at the seaside"]
            answer: "at the zoo"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: { en: "Now you listen closely. In a clip, one thing often happens after another. Listen for d'abord, ensuite and à la fin.", fr: "D'abord, Lily se lève. Ensuite, elle prend son petit déjeuner. À la fin, elle va à l'école en bus." }
            show: { objects: [bed, bread, bus] }
          - text: "d'abord = first\nensuite = then\nà la fin = in the end"
            say: { en: "D'abord means first, ensuite means then, à la fin means in the end. First Lily gets up, then she has breakfast, in the end she goes to school by bus." }
          - text: "le matin : il fait beau\nl'après-midi : il pleut"
            say: { en: "One more example. What is the weather like in the afternoon? Listen to the end. Le matin is the morning, l'après-midi is the afternoon.", fr: "Le matin, il fait beau. L'après-midi, il pleut." }
            show: { objects: [sun, rain] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Look and listen. Put the pictures in order.", fr: "Aujourd'hui, on fait un gâteau. D'abord, deux œufs. Ensuite, du lait. À la fin, voilà le gâteau !" }
                options: [{ object: cake }, { object: egg }, { object: milk }]
                slot_count: 3
                answer: [egg, milk, cake]
                hints:
                  - "Listen for d'abord. What comes first?"
                  - "First you hear œufs, then lait."
                  - "Eggs, milk, cake."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "What is the weather like in the afternoon?"
                say: { en: "Look and listen. What is the weather like in the afternoon?" }
                show: { objects: [sun, rain] }
                audio: { fr: "Voici la météo. Le matin, il fait beau. L'après-midi, il pleut." }
                options: [{ object: sun }, { object: rain }]
                answer: rain
                feedback:
                  sun: "Il fait beau is in the morning, le matin. Listen to the end: l'après-midi, il pleut."
                hints:
                  - "Listen for l'après-midi."
                  - "Le matin comes first. The afternoon comes after it."
                  - "L'après-midi, il pleut. It rains."
              - id: l2-f3
                type: audio_choice
                text: "What colour is the giraffe's ball?"
                say: { en: "Look and listen. What colour is the giraffe's ball?" }
                show: { objects: [giraffe, elephant] }
                audio: { fr: "L'éléphant joue avec une balle bleue. La girafe a une balle rouge." }
                options: ["red", "blue", "green"]
                answer: "red"
                feedback:
                  "blue": "The blue ball is the elephant's. Listen to what the clip says about the giraffe."
                hints:
                  - "Listen to what the clip says about la girafe."
                  - "First the elephant, then the giraffe."
                  - "La girafe a une balle rouge."
              - id: l2-f4
                type: audio_choice
                text: "How many eggs do you need?"
                say: { en: "Look and listen. How many eggs do you need?" }
                show: { objects: [egg, cake] }
                audio: { fr: "Pour le gâteau, il faut trois œufs, du lait et du sucre." }
                options: ["3", "2", "4"]
                answer: "3"
                hints:
                  - "Listen for the number before œufs."
                  - "Count in French: un, deux, trois, quatre. Which one do you hear?"
                  - "Trois œufs: three eggs."
              - id: l2-f5
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Look and listen. Put the pictures in order.", fr: "On fait un cerf-volant ! D'abord, on coupe avec les ciseaux. Ensuite, on colorie avec les crayons. À la fin, le cerf-volant vole !" }
                options: [{ object: kite }, { object: crayon }, { object: scissors }]
                slot_count: 3
                answer: [scissors, crayon, kite]
                hints:
                  - "Listen for d'abord: what do you need first?"
                  - "First you hear ciseaux, then crayons."
                  - "Scissors, crayons, kite."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Look and listen. Put the pictures in order.", fr: "D'abord, Tom mange du gâteau. Ensuite, il joue au ballon. À la fin, il va au lit." }
                options: [{ object: bed }, { object: cake }, { object: ball }]
                slot_count: 3
                answer: [cake, ball, bed]
                hints: ["Listen for d'abord, ensuite and à la fin."]
              - id: l2-s2
                type: audio_choice
                text: "Where does the cat sleep?"
                say: { en: "Look and listen. Where does the cat sleep?" }
                show: { objects: [cat, sofa] }
                audio: { fr: "Le chien dort dans le jardin. Le chat dort sur le canapé." }
                options: ["on the sofa", "in the garden", "in the bed"]
                answer: "on the sofa"
                hints: ["Listen to what the clip says about le chat."]
              - id: l2-s3
                type: true_false
                text: "In the end, Lily goes to school by bike."
                say: { en: "Look and listen. Is this true?", fr: "D'abord, Lily se lève. Ensuite, elle mange. À la fin, elle va à l'école en bus." }
                show: { objects: [bus, bike] }
                answer: false
                hints: ["Listen to the last sentence: en bus."]
              - id: l2-s4
                type: audio_choice
                text: "What does Max eat in the end?"
                say: { en: "Look and listen. What does Max eat in the end?" }
                show: { objects: [apple, ice-cream] }
                audio: { fr: "D'abord, Max mange une pomme. À la fin, il mange une glace." }
                options: [{ object: apple }, { object: ice-cream }]
                answer: ice-cream
                hints: ["Listen for à la fin."]
              - id: l2-s5
                type: audio_choice
                text: "How many monkeys are there?"
                say: { en: "Look and listen. How many monkeys are there?" }
                show: { object: monkey }
                audio: { fr: "Regarde ! Il y a cinq singes dans l'arbre." }
                options: ["5", "4", "6"]
                answer: "5"
                hints: ["Listen for the number before singes."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Look and listen. Put the pictures in order.", fr: "D'abord, il pleut. Ensuite, il y a du soleil. À la fin, il neige !" }
                options: [{ object: snow }, { object: rain }, { object: sun }]
                slot_count: 3
                answer: [rain, sun, snow]
              - id: l2-n2
                type: audio_choice
                text: "What is the weather like in the afternoon?"
                say: { en: "Look and listen. What is the weather like in the afternoon?" }
                show: { objects: [rain, sun] }
                audio: { fr: "Le matin, il pleut. L'après-midi, il fait beau." }
                options: [{ object: rain }, { object: sun }]
                answer: sun
              - id: l2-n3
                type: audio_choice
                text: "What colour is the dog?"
                say: { en: "Look and listen. What colour is the dog?" }
                show: { objects: [dog, cat] }
                audio: { fr: "Le chat est noir. Le chien est marron." }
                options: ["brown", "black", "white"]
                answer: "brown"
              - id: l2-n4
                type: true_false
                text: "The snail wins the race."
                say: { en: "Look and listen. Is this true?", fr: "C'est la course ! L'oiseau vole vite. L'escargot est lent. À la fin, l'oiseau gagne." }
                show: { objects: [snail, bird] }
                answer: false
              - id: l2-n5
                type: audio_choice
                text: "What does Lucie need for the crêpes?"
                say: { en: "Look and listen. What does Lucie need for the crêpes?" }
                show: { objects: [egg, milk] }
                audio: { fr: "Pour les crêpes, il faut des œufs, du lait et de la farine." }
                options: ["eggs, milk and flour", "eggs, cheese and milk", "milk and apples"]
                answer: "eggs, milk and flour"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: gist
            type: audio_choice
            text: "What is the clip about?"
            say: { en: "Look and listen. What is the clip about?" }
            show: { objects: [fish, boat] }
            audio: { fr: "Papi et moi, on est sur le bateau. On pêche des poissons. Regarde, un gros poisson !", speaker: female }
            options: ["fishing from a boat", "a trip to the zoo", "a birthday party"]
            answer: "fishing from a boat"
          - id: l2-c2
