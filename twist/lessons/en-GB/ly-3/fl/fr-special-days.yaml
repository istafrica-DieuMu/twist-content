# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-special-days
skill: fl.themes.special-days
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Feste feiern (Französisch)
  en: Special days in French
summary: >
  Words, greetings and customs for special days in France. Lesson 1 brings
  birthdays (Joyeux anniversaire !, le gâteau, les bougies, les cadeaux)
  and Christmas (Joyeux Noël !, le sapin, le Père Noël, the big family meal
  on the evening of 24 December and shoes by the tree where the presents
  appear). Lesson 2 brings la galette des rois in January (the hidden fève
  and the paper crown), Easter (Joyeuses Pâques !, chocolate eggs brought
  by the bells, les cloches), le poisson d'avril on 1 April and le 14
  juillet with its fireworks, and ends with the skill check.
metadata:
  year: ly-3
  topic: { de: Feste, en: Special days }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.calendar]
  also_practises: [fl.themes.calendar, fl.culture-strategies.compare-daily-life]
  vocabulary: { fr: ["Joyeux anniversaire !", le gâteau, la bougie, le cadeau, le ballon, "Joyeux Noël !", le sapin de Noël, le Père Noël, le réveillon, la chaussure, la galette des rois, la fève, la couronne, "Joyeuses Pâques !", les œufs en chocolat, les cloches, le poisson d'avril, le 14 juillet, les feux d'artifice] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: greetings, what: { de: den passenden Gruß für jedes Fest kennen, en: knowing the right greeting for each special day } }
    - { id: words, what: { de: Wörter für Feste verstehen, en: understanding the words for special days } }
    - { id: customs, what: { de: Bräuche in Frankreich kennen, en: knowing customs in France } }
    - { id: dates, what: { de: "wissen, wann ein Fest ist", en: knowing when each special day is } }
  misconceptions:
    - id: wrong-greeting
      what: Uses one greeting for every special day (joyeux Noël on a birthday card, joyeux Pâques)
      addressed: every stage has a greeting task with the other days' greetings as options (l1-f3, l1-s5, l2-f3, l2-s3, l2-c2); l2-f3 gives feedback on joyeux Pâques
    - id: same-as-england
      what: Expects French customs to match English ones (a stocking from Father Christmas, the Easter bunny, April Fool's tricks with no fish)
      addressed: lesson 1 Learn sets the shoes by the tree against the stocking; lesson 2 Learn names the bells and the paper fish; l1-f6, l1-n2, l2-f5, l2-s4 and l2-c5 ask about them, with feedback in l1-f6
    - id: dates
      what: Mixes up the dates (le 14 juillet, le premier avril, le 25 décembre)
      addressed: lesson 2 Learn gives each day its date; l2-s5 matches days and dates, l2-n2 and l2-c4 ask for them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Geburtstag und Weihnachten, en: Birthdays and Christmas }
    goal:
      de: "Lerne französische Wörter für Geburtstag und Weihnachten, zum Beispiel joyeux anniversaire und le sapin."
      en: "Learn French words for birthdays and Christmas, like joyeux anniversaire and le sapin."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which month is it?"
            say: { en: "Listen. Which month is it?" }
            audio: { fr: "décembre" }
            options: ["December", "September", "November"]
            answer: "December"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "When is the child's birthday?"
            say: { en: "Listen. When is the child's birthday?" }
            audio: { turns: [{ fr: "C'est quand, ton anniversaire ?", speaker: female }, { fr: "C'est en mai.", speaker: male }] }
            options: ["in May", "in March", "in July"]
            answer: "in May"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "Joyeux anniversaire !"
            say: { en: "Guess first! At Manon's party, everyone sings joyeux anniversaire. Which special day do you think it is?", fr: "Joyeux anniversaire !" }
          - text: "Joyeux anniversaire ! Voici un cadeau pour toi."
            say: { en: "A birthday! On someone's birthday you say joyeux anniversaire. There is a cake, le gâteau, with candles, les bougies. A present is un cadeau.", fr: "Joyeux anniversaire ! Voici un cadeau pour toi." }
            show: { objects: [cake, present] }
          - text: "Joyeux Noël !"
            say: { en: "Christmas is Noël. You say joyeux Noël. The Christmas tree is le sapin de Noël, and Father Christmas is le Père Noël.", fr: "Joyeux Noël !" }
            show: { object: fir-tree }
          - text: "le réveillon, le 24 décembre\nLe réveillon. Les chaussures."
            say: { en: "Many French families have a big meal on the evening of 24 December. It is called le réveillon. Some children put their shoes by the tree or the fireplace. In the morning, the presents from le Père Noël are there. In England it is often a stocking.", fr: "Le réveillon. Les chaussures." }
            show: { object: shoe }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which special day is it?"
                say: { en: "Listen. Which special day is it?" }
                audio: { fr: "Joyeux anniversaire, Léa !" }
                options: ["a birthday", "Christmas", "Easter"]
                answer: "a birthday"
                hints:
                  - "Listen to the word after joyeux."
                  - "You hear anniversaire."
                  - "Anniversaire means birthday."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                option_audio: false
                text: "Which picture matches?\nun gâteau d'anniversaire"
                say: { en: "Read. Which picture matches?" }
                options: [{ object: cake }, { object: pie }, { object: bread }]
                answer: cake
                hints:
                  - "Read the first word: gâteau."
                  - "Un gâteau is a cake."
                  - "Tap the cake with the candle."
              - id: l1-f3
                type: multiple_choice
                text: "What do you say at Christmas?"
                say: { en: "What do you say in French at Christmas?" }
                options: ["Joyeux Noël !", "Joyeux anniversaire !", "Bonne nuit !"]
                answer: "Joyeux Noël !"
                option_audio: false
                hints:
                  - "What is Christmas in French?"
                  - "Christmas is Noël."
                  - "You say joyeux Noël."
              - id: l1-f4
                type: fill_in_blank
                text: "It is Hugo's birthday today. What do you write on the card?"
                say: { en: "It is Hugo's birthday today. What do you write on the card?" }
                frame: "Joyeux _, Hugo !"
                options: ["anniversaire", "Noël", "matin"]
                answer: ["anniversaire"]
                option_audio: false
                hints:
                  - "Which special day is it for Hugo?"
                  - "It is his birthday."
                  - "Birthday is anniversaire."
              - id: l1-f5
                type: audio_choice
                text: "What does Tom get?"
                say: { en: "Listen. What does Tom get?" }
                audio: { fr: "Joyeux anniversaire, Tom ! Voici un cadeau pour toi." }
                options: [{ object: present }, { object: cake }, { object: balloon }]
                answer: present
                hints:
                  - "Listen to the end: un cadeau."
                  - "What do you get on your birthday?"
                  - "Un cadeau is a present."
              - id: l1-f6
                type: multiple_choice
                text: "Where do some French children find their Christmas presents?"
                say: { en: "Where do some French children find their Christmas presents in the morning?" }
                options: ["by their shoes", "in a stocking on the bed", "in a big egg"]
                answer: "by their shoes"
                feedback:
                  "in a stocking on the bed": "The stocking is what many English children have. In France some children put out their shoes."
                hints:
                  - "Think of what children put by the tree or the fireplace."
                  - "It is something you wear on your feet."
                  - "By their shoes."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                option_audio: false
                text: "Which picture matches?\nle sapin de Noël"
                say: { en: "Read. Which picture matches?" }
                options: [{ object: fir-tree }, { object: tree }, { object: leaf }]
                answer: fir-tree
                hints: ["Which tree do you bring inside at Christmas?"]
              - id: l1-s2
                type: audio_choice
                text: "Which special day is it?"
                say: { en: "Listen. Which special day is it?" }
                audio: { fr: "Joyeux Noël, mamie !" }
                options: ["Christmas", "a birthday", "Easter"]
                answer: "Christmas"
                hints: ["Noël means Christmas."]
              - id: l1-s3
                type: multiple_choice
                text: "Who brings the Christmas presents in France?"
                say: { en: "Who brings the Christmas presents in France?" }
                options: ["le Père Noël", "le lapin de Pâques", "la petite souris"]
                answer: "le Père Noël"
                option_audio: false
                hints: ["The word Noël is in his name."]
              - id: l1-s4
                type: matching
                text: "Match each word to its picture."
                say: { en: "Read the word, then tap its picture." }
                option_audio: false
                pairs:
                  - { left: { text: "le gâteau" }, right: { object: cake } }
                  - { left: { text: "la bougie" }, right: { object: candle } }
                  - { left: { text: "le cadeau" }, right: { object: present } }
                  - { left: { text: "le ballon" }, right: { object: balloon } }
                hints: ["Gâteau and cadeau look alike. Un gâteau is to eat."]
              - id: l1-s5
                type: fill_in_blank
                text: "What do you write on a Christmas card?"
                say: { en: "What do you write on a Christmas card?" }
                frame: "Joyeux _ !"
                options: ["Noël", "anniversaire", "Pâques"]
                answer: ["Noël"]
                option_audio: false
                hints: ["Christmas is Noël."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What is on Manon's cake?"
                say: { en: "Listen. What is on Manon's cake?" }
                audio: { fr: "C'est mon anniversaire aujourd'hui. Regarde mon gâteau ! Il y a neuf bougies.", speaker: female }
                options: ["nine candles", "nine strawberries", "ten candles"]
                answer: "nine candles"
              - id: l1-n2
                type: multiple_choice
                text: "What is le réveillon?"
                say: { en: "What is le réveillon?" }
                options: ["a big meal on the evening of 24 December", "a present on 25 December", "a song about the tree"]
                answer: "a big meal on the evening of 24 December"
              - id: l1-n3
                type: true_false
                text: "Joyeux anniversaire means Happy Christmas."
                say: { en: "Is this true?" }
                answer: false
              - id: l1-n4
                type: true_false
                text: "Le sapin de Noël is the Christmas tree."
                say: { en: "Is this true?" }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                option_audio: false
                text: "Manon gets something at her party. Which picture matches?\nun ballon"
                say: { en: "Manon gets something at her party. Read. Which picture matches?" }
                options: [{ object: balloon }, { object: bell }, { object: candle }]
                answer: balloon

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which special day is it?"
            say: { en: "Listen. Which special day is it?" }
            audio: { fr: "Joyeux Noël et bonne année !" }
            options: ["Christmas", "a birthday", "Easter"]
            answer: "Christmas"
          - id: l1-c2
            type: multiple_choice
            text: "What do you say on someone's birthday?"
            say: { en: "What do you say in French on someone's birthday?" }
            options: ["Joyeux anniversaire !", "Joyeux Noël !", "Bonjour !"]
            answer: "Joyeux anniversaire !"
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "What is un cadeau?"
            say: { en: "What is un cadeau?" }
            options: ["a present", "a cake", "a candle"]
            answer: "a present"
          - id: l1-c4
            type: image_multiple_choice
            option_audio: false
            text: "Which picture matches?\nune bougie"
            say: { en: "Read. Which picture matches?" }
            options: [{ object: candle }, { object: present }, { object: cake }]
            answer: candle
          - id: l1-c5
            type: true_false
            text: "Le réveillon is a big meal on the evening of 24 December."
            say: { en: "Is this true?" }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "What does Hugo put by the tree?"
            say: { en: "Listen. What does Hugo put by the tree?" }
            audio: { fr: "Ce soir, je mets mes chaussures près du sapin.", speaker: male }
            options: [{ object: shoe }, { object: cake }, { object: present }]
            answer: shoe

  - n: 2
    title: { de: "Galette, Ostern, 1. April und 14. Juli", en: "Galette, Easter, 1 April and 14 July" }
    goal:
      de: "Entdecke, wie Kinder in Frankreich Ostern, den ersten April und den Nationalfeiertag feiern, und sag joyeuses Pâques."
      en: "Find out how children in France celebrate Easter, April Fools' Day and 14 July, and say joyeuses Pâques."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which special day is it?"
            say: { en: "Listen. Which special day is it?" }
            audio: { fr: "Joyeux anniversaire, Max !" }
            options: ["a birthday", "Christmas", "Easter"]
            answer: "a birthday"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            option_audio: false
            text: "Which picture matches?\nun cadeau"
            say: { en: "Read. Which picture matches?" }
            options: [{ object: present }, { object: cake }, { object: shoe }]
            answer: present
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "la galette des rois"
            say: { en: "Guess first! In January, many French families share a flat cake with something small hidden inside. What do you think is hidden in it?", fr: "La galette des rois." }
          - text: "la galette des rois\nLa galette des rois. La couronne."
            say: { en: "A tiny figure! In January, many French families share la galette des rois, a flat cake. A tiny figure called la fève is hidden inside. Whoever finds it is king or queen for the day and wears a paper crown, la couronne.", fr: "La galette des rois. La couronne." }
            show: { object: crown }
          - text: "Did you know? Fève means bean. Long ago, the hidden fève was a real dried bean."
            say: { en: "Did you know? Fève is the French word for a broad bean. Long ago, the thing hidden in the galette was a real dried bean. Today it is usually a tiny china figure, and some people collect them!", fr: "La fève." }
          - text: "Joyeuses Pâques !"
            say: { en: "Easter is Pâques. You say joyeuses Pâques. Many children hunt for chocolate eggs, les œufs en chocolat. In France the story is that the church bells, les cloches, fly away and bring the eggs back on Easter Sunday.", fr: "Joyeuses Pâques !" }
            show: { objects: [egg, bell] }
          - text: "le premier avril\nPoisson d'avril !"
            say: { en: "On 1 April, many children try to stick a paper fish on someone's back without them noticing. Then they shout poisson d'avril!", fr: "Poisson d'avril !" }
            show: { object: fish }
          - text: "le 14 juillet\nLe 14 juillet. Les feux d'artifice."
            say: { en: "On 14 July France has its national day, la fête nationale. There is a parade, and at night there are fireworks, les feux d'artifice.", fr: "Le 14 juillet. Les feux d'artifice." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which special day is it?"
                say: { en: "Listen. Which special day is it?" }
                audio: { fr: "Joyeuses Pâques, maman !" }
                options: ["Easter", "Christmas", "a birthday"]
                answer: "Easter"
                hints:
                  - "Listen to the word after joyeuses."
                  - "You hear Pâques."
                  - "Pâques means Easter."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                option_audio: false
                text: "Which picture matches?\nun œuf en chocolat"
                say: { en: "Read. Which picture matches?" }
                options: [{ object: egg }, { object: ball }, { object: apple }]
                answer: egg
                hints:
                  - "Read the first word: œuf."
                  - "Un œuf is an egg."
                  - "Tap the egg."
              - id: l2-f3
                type: fill_in_blank
                text: "What do you write on an Easter card?"
                say: { en: "What do you write on an Easter card?" }
                frame: "_ Pâques !"
                options: ["Joyeuses", "Joyeux", "Joyeuse"]
                answer: ["Joyeuses"]
                option_audio: false
                feedback:
                  "Joyeux": "Pâques takes joyeuses, with -euses: joyeuses Pâques."
                  "Joyeuse": "Pâques is plural here, so it is joyeuses, with an s: joyeuses Pâques."
                hints:
                  - "Pâques does not take the same word as Noël."
                  - "You say joyeux Noël, but joyeuses Pâques."
                  - "Joyeuses."
              - id: l2-f4
                type: matching
                text: "Match each French word to its meaning."
                say: { en: "Tap a French word, then its meaning in English." }
                option_audio: false
                pairs:
                  - { left: { text: "la couronne" }, right: { text: "the crown" } }
                  - { left: { text: "les cloches" }, right: { text: "the bells" } }
                  - { left: { text: "les feux d'artifice" }, right: { text: "the fireworks" } }
                hints:
                  - "Think of the special day each word belongs to."
                  - "The king or queen of the galette wears la couronne."
                  - "La couronne is the crown, les cloches are the bells, les feux d'artifice are the fireworks."
              - id: l2-f5
                type: multiple_choice
                text: "In France, who brings the Easter eggs in the story?"
                say: { en: "In France, who brings the Easter eggs in the story?" }
                options: ["the bells", "Father Christmas", "the king"]
                answer: "the bells"
                hints:
                  - "Think of the church."
                  - "Les cloches fly away and come back."
                  - "The bells."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which day do you hear this on?"
                say: { en: "Listen. Which day do you hear this on?" }
                audio: { fr: "Poisson d'avril !" }
                options: ["1 April", "14 July", "25 December"]
                answer: "1 April"
                hints: ["Avril means April."]
              - id: l2-s2
                type: multiple_choice
                text: "What is hidden inside la galette des rois?"
                say: { en: "What is hidden inside la galette des rois?" }
                options: ["a tiny figure, la fève", "a chocolate egg", "a paper fish"]
                answer: "a tiny figure, la fève"
                hints: ["Whoever finds it becomes king or queen."]
              - id: l2-s3
                type: multiple_choice
                text: "It is 25 December. What do you say?"
                say: { en: "It is 25 December. What do you say?" }
                options: ["Joyeux Noël !", "Joyeuses Pâques !", "Poisson d'avril !"]
                answer: "Joyeux Noël !"
                option_audio: false
                hints: ["25 December is Christmas Day."]
              - id: l2-s4
                type: true_false
                text: "On 1 April, many French children stick a paper fish on someone's back."
                say: { en: "Is this true?" }
                answer: true
                hints: ["Poisson means fish."]
              - id: l2-s5
                type: matching
                text: "When is each special day?"
                say: { en: "Match each special day to its date." }
                option_audio: false
                pairs:
                  - { left: { text: "le poisson d'avril" }, right: { text: "1 April" } }
                  - { left: { text: "la fête nationale" }, right: { text: "14 July" } }
                  - { left: { text: "Noël" }, right: { text: "25 December" } }
                hints: ["Avril is in the name of one of them."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Jules has found la fève. What does he want now?"
                say: { en: "Listen. Jules has found la fève. What does he want now?" }
                audio: { fr: "J'ai la fève ! Je suis le roi ! Donne-moi la couronne !", speaker: male }
                options: [{ object: crown }, { object: egg }, { object: fish }]
                answer: crown
              - id: l2-n2
                type: audio_choice
                text: "What is Inès looking at?"
                say: { en: "Listen. What is Inès looking at?" }
                audio: { fr: "C'est le 14 juillet. Regarde les feux d'artifice !", speaker: female }
                options: ["fireworks on the national day", "the Christmas tree", "Easter eggs in the garden"]
                answer: "fireworks on the national day"
              - id: l2-n3
                type: fill_in_blank
                text: "Chloé sticks a paper fish on her dad's back. What does she shout?"
                say: { en: "Chloé sticks a paper fish on her dad's back. What does she shout?" }
                frame: "_ d'avril !"
                options: ["Poisson", "Cadeau", "Gâteau"]
                answer: ["Poisson"]
                option_audio: false
              - id: l2-n4
                type: sorting
                text: "Which special day does it belong to?"
                say: { en: "Sort the words: Christmas or Easter?" }
                option_audio: false
                bins:
                  - { id: noel, show: { text: "Noël" } }
                  - { id: paques, show: { text: "Pâques" } }
                options:
                  - { text: "le sapin", bin: noel }
                  - { text: "le Père Noël", bin: noel }
                  - { text: "les œufs en chocolat", bin: paques }
                  - { text: "les cloches", bin: paques }
              - id: l2-n5
                type: multiple_choice
                text: "What does the person who finds la fève wear?"
                say: { en: "What does the person who finds la fève wear?" }
                options: ["a paper crown", "a big hat", "new shoes"]
                answer: "a paper crown"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: greetings
            type: audio_choice
            text: "Which special day is it?"
            say: { en: "Listen. Which special day is it?" }
            audio: { fr: "Joyeux anniversaire, Zoé ! Tu as dix ans !" }
            options: ["a birthday", "Christmas", "Easter"]
            answer: "a birthday"
          - id: l2-c2
            part: greetings
            type: multiple_choice
            text: "What do you say at Easter?"
            say: { en: "What do you say in French at Easter?" }
            options: ["Joyeuses Pâques !", "Joyeux Noël !", "Joyeux anniversaire !"]
            answer: "Joyeuses Pâques !"
            option_audio: false
          - id: l2-c3
            part: words
            type: matching
            text: "Match each word to its meaning."
            say: { en: "Match each French word to its meaning in English." }
            option_audio: false
            pairs:
              - { left: { text: "le gâteau" }, right: { text: "the cake" } }
              - { left: { text: "le sapin" }, right: { text: "the fir tree" } }
              - { left: { text: "la bougie" }, right: { text: "the candle" } }
          - id: l2-c4
            part: dates
            type: multiple_choice
            text: "When is la fête nationale in France?"
            say: { en: "When is la fête nationale in France?" }
            options: ["14 July", "1 April", "25 December"]
            answer: "14 July"
          - id: l2-c5
            part: customs
            type: multiple_choice
            text: "What do some French children put by the tree for le Père Noël?"
            say: { en: "What do some French children put by the tree for le Père Noël?" }
            options: ["their shoes", "a chocolate egg", "a paper fish"]
            answer: "their shoes"
          - id: l2-c6
            part: greetings
            type: fill_in_blank
            option_audio: false
            text: "It is Mia's birthday. What do you say?"
