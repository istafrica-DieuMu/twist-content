# Lesson set: French, learning year 3 (Year 5). Hand-authored draft.
id: en-GB.fl.fr-time
skill: fl.themes.time
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Die Uhrzeit (Französisch)
  en: Telling the time in French
summary: >
  Asking the time in French and giving o'clock and half past. Lesson 1
  brings Quelle heure est-il ? Il est trois heures., always with heures,
  il est une heure, and midi and minuit for twelve o'clock; lesson 2 adds
  half past with et demie after heures (Il est quatre heures et demie),
  naming the hour that has passed as in English, and ends with the skill
  check. Instructions are in English; the French is spoken and shown in
  short form, and clocks show the times.
metadata:
  year: ly-3
  topic: { de: Uhrzeit, en: Time }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.numbers-to-20]
  also_practises: [fl.themes.numbers-to-20]
  vocabulary: { fr: ["Quelle heure est-il ?", "Il est ... heures.", "Il est une heure.", "Il est midi.", "Il est minuit.", "et demie"] }
  forms: [audio, text, drawn]
  drawn: [clock]
  facets: [time-format]
  parts:
    - { id: oclock, what: { de: "volle Stunden mit heures sagen und verstehen", en: saying and understanding o'clock with heures } }
    - { id: half-past, what: { de: "halbe Stunden mit et demie", en: half past with et demie } }
    - { id: midi-minuit, what: { de: midi und minuit unterscheiden, en: telling midi from minuit } }
    - { id: ask-use, what: { de: "nach der Uhrzeit fragen und verstehen, wann etwas ist", en: asking the time and understanding when something happens } }
  misconceptions:
    - id: no-heures
      what: Says only the number (il est trois) or mixes heures up with ans (il est neuf ans)
      addressed: lesson 1 Learn models il est ... heures; l1-f2 gives feedback on il est trois, and l1-s2, l1-n2, l2-w2 and l2-c2 offer the bare number or ans
    - id: midi-minuit
      what: Mixes up midi (midday) and minuit (midnight), or says douze heures
      addressed: lesson 1 Learn sets midi against minuit; l1-f4 gives feedback on minuit, and l1-n3, l1-c2 and l2-c3 ask for one or the other
    - id: demie-first
      what: Puts demie in front, as English puts half first (il est demie quatre)
      addressed: lesson 2 Learn says et demie comes after heures; l2-f2 gives feedback on the demie-first version, and l2-f4, l2-s2, l2-n2 and l2-c2 ask for the right order
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Il est trois heures.", en: "Il est trois heures." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which number is it?"
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Sept." }
            options: ["7", "17", "11"]
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which number is it?"
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Onze." }
            options: ["11", "12", "7"]
            answer: "11"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Quelle heure est-il ?\nIl est trois heures."
            say: { en: "To ask the time, say quelle heure est-il? The answer: il est, the number, then heures. Il est trois heures, it's three o'clock.", fr: "Quelle heure est-il ? Il est trois heures." }
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "Il est une heure."
            say: { en: "One o'clock has just one hour: il est une heure.", fr: "Il est une heure." }
            show: { drawn: clock, hour: 1, minute: 0 }
          - text: "Il est midi. Il est minuit."
            say: { en: "Twelve o'clock in the day is midi, midday. Twelve o'clock at night is minuit, midnight.", fr: "Il est midi. Il est minuit." }
            show: { drawn: clock, hour: 12, minute: 0 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the clock that matches."
                say: { en: "Listen. Tap the clock that matches." }
                audio: { fr: "Il est sept heures." }
                options:
                  - { drawn: clock, hour: 7, minute: 0 }
                  - { drawn: clock, hour: 11, minute: 0 }
                  - { drawn: clock, hour: 5, minute: 0 }
                answer: "7:00"
                hints:
                  - "Listen for the number."
                  - "Sept is seven."
                  - "Tap the clock with the short hand on 7."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What time is it?"
                say: { en: "What time is it? Tap the sentence that matches." }
                show: { drawn: clock, hour: 3, minute: 0 }
                options: ["Il est trois heures.", "Il est trois.", "Il est six heures."]
                answer: "Il est trois heures."
                option_audio: false
                feedback:
                  "Il est trois.": "Nearly! French always adds heures: il est trois heures."
                hints:
                  - "The short hand points to 3."
                  - "After the number comes heures."
                  - "Il est trois heures."
              - id: l1-f3
                type: audio_choice
                text: "Tap the clock that matches."
                say: { en: "Listen. Tap the clock that matches." }
                audio: { fr: "Il est dix heures." }
                options:
                  - { drawn: clock, hour: 10, minute: 0 }
                  - { drawn: clock, hour: 2, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 0 }
                answer: "10:00"
                hints:
                  - "Listen for the number."
                  - "Dix is ten."
                  - "Tap the clock with the short hand on 10."
              - id: l1-f4
                type: multiple_choice
                text: "It is twelve o'clock in the day. What do you say?"
                show: { drawn: clock, hour: 12, minute: 0 }
                options: ["Il est midi.", "Il est minuit.", "Il est deux heures."]
                answer: "Il est midi."
                option_audio: false
                feedback:
                  "Il est minuit.": "Minuit is twelve o'clock at night. In the day it is midi."
                hints:
                  - "It is daytime."
                  - "Midi has mi- and di, like midday."
                  - "Il est midi."
              - id: l1-f5
                type: speak
                say: { en: "Say the time in French.", fr: "Il est cinq heures." }
                show: { drawn: clock, hour: 5, minute: 0 }
                expected_text: "Il est cinq heures."
                hints:
                  - "Start with il est."
                  - "Cinq, then heures."
                  - "Say it with me: il est cinq heures."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the clock that matches."
                say: { en: "Listen. Tap the clock that matches." }
                audio: { fr: "Il est une heure." }
                options:
                  - { drawn: clock, hour: 1, minute: 0 }
                  - { drawn: clock, hour: 11, minute: 0 }
                  - { drawn: clock, hour: 7, minute: 0 }
                answer: "1:00"
                hints: ["Une is one."]
              - id: l1-s2
                type: multiple_choice
                text: "What time is it?"
                say: { en: "What time is it? Tap the sentence that matches." }
                show: { drawn: clock, hour: 9, minute: 0 }
                options: ["Il est neuf heures.", "Il est neuf.", "Il est neuf ans."]
                answer: "Il est neuf heures."
                option_audio: false
                hints: ["Ans is for age. For the time, say heures."]
              - id: l1-s3
                type: true_false
                text: "Does the clock match?\nIl est quatre heures."
                say: { en: "Listen. Does the clock match?", fr: "Il est quatre heures." }
                show: { drawn: clock, hour: 8, minute: 0 }
                answer: false
                hints: ["Quatre is four."]
              - id: l1-s4
                type: audio_choice
                text: "Tap the clock that matches."
                say: { en: "Listen. Tap the clock that matches." }
                audio: { turns: [{ fr: "Quelle heure est-il ?", speaker: male }, { fr: "Il est six heures.", speaker: female }] }
                options:
                  - { drawn: clock, hour: 6, minute: 0 }
                  - { drawn: clock, hour: 9, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 0 }
                answer: "6:00"
                hints: ["Six is six."]
              - id: l1-s5
                type: speak
                say: { en: "Ask in French: what time is it?", fr: "Quelle heure est-il ?" }
                expected_text: "Quelle heure est-il ?"
                hints: ["Say it with me: quelle heure est-il ?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the clock that matches."
                say: { en: "Listen. Tap the clock that matches." }
                audio: { fr: "Il est quatre heures." }
                options:
                  - { drawn: clock, hour: 4, minute: 0 }
                  - { drawn: clock, hour: 8, minute: 0 }
                  - { drawn: clock, hour: 2, minute: 0 }
                answer: "4:00"
              - id: l1-n2
                type: multiple_choice
                text: "What time is it?"
                say: { en: "What time is it? Tap the sentence that matches." }
                show: { drawn: clock, hour: 11, minute: 0 }
                options: ["Il est onze heures.", "Il est onze.", "Il est douze heures."]
                answer: "Il est onze heures."
                option_audio: false
              - id: l1-n3
                type: audio_choice
                text: "What time is it?"
                say: { en: "Listen. What time is it?" }
                audio: { fr: "Il est minuit." }
                options: ["midnight", "midday", "one o'clock"]
                answer: "midnight"
              - id: l1-n4
                type: true_false
                text: "Does the clock match?\nIl est deux heures."
                say: { en: "Listen. Does the clock match?", fr: "Il est deux heures." }
                show: { drawn: clock, hour: 2, minute: 0 }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                option_audio: false
                text: "Which clock matches?\nIl est huit heures."
                say: { en: "Read the sentence. Which clock matches?" }
                options:
                  - { drawn: clock, hour: 8, minute: 0 }
                  - { drawn: clock, hour: 3, minute: 0 }
                  - { drawn: clock, hour: 6, minute: 0 }
                answer: "8:00"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the clock that matches."
            say: { en: "Listen. Tap the clock that matches." }
            audio: { fr: "Il est neuf heures." }
            options:
              - { drawn: clock, hour: 9, minute: 0 }
              - { drawn: clock, hour: 5, minute: 0 }
              - { drawn: clock, hour: 1, minute: 0 }
            answer: "9:00"
          - id: l1-c2
            type: multiple_choice
            text: "It is twelve o'clock at night. What do you say?"
            show: { drawn: clock, hour: 12, minute: 0 }
            options: ["Il est minuit.", "Il est midi.", "Il est douze."]
            answer: "Il est minuit."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Does the clock match?\nIl est six heures."
            say: { en: "Listen. Does the clock match?", fr: "Il est six heures." }
            show: { drawn: clock, hour: 6, minute: 0 }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "What time is it?"
            say: { en: "Listen. What time is it?" }
            audio: { fr: "Il est onze heures." }
            options: ["eleven o'clock", "seven o'clock", "twelve o'clock"]
            answer: "eleven o'clock"
          - id: l1-c5
            type: image_multiple_choice
            option_audio: false
            text: "Which clock matches?\nIl est midi."
            say: { en: "Read the sentence. Which clock matches?" }
            options:
              - { drawn: clock, hour: 12, minute: 0 }
              - { drawn: clock, hour: 6, minute: 0 }
              - { drawn: clock, hour: 3, minute: 0 }
            answer: "12:00"
          - id: l1-c6
            type: ordering
            option_audio: false
            text: "Build the sentence: it's ten o'clock."
            say: { en: "Build the sentence: it's ten o'clock." }
            options: ["dix heures.", "Il", "est"]
            slot_count: 3
            answer: ["Il", "est", "dix heures."]

  - n: 2
    title: { de: "et demie", en: "et demie" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tap the clock that matches."
            say: { en: "Listen. Tap the clock that matches." }
            audio: { fr: "Il est trois heures." }
            options:
              - { drawn: clock, hour: 3, minute: 0 }
              - { drawn: clock, hour: 9, minute: 0 }
              - { drawn: clock, hour: 12, minute: 0 }
            answer: "3:00"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What time is it?"
            say: { en: "What time is it? Tap the sentence that matches." }
            show: { drawn: clock, hour: 1, minute: 0 }
            options: ["Il est une heure.", "Il est un.", "Il est onze heures."]
            answer: "Il est une heure."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Il est quatre heures et demie."
            say: { en: "For half past, add et demie after heures: il est quatre heures et demie, half past four. As in English, you name the hour that has just passed.", fr: "Il est quatre heures et demie." }
            show: { drawn: clock, hour: 4, minute: 30 }
          - text: "Il est une heure et demie."
            say: { en: "Half past one: il est une heure et demie.", fr: "Il est une heure et demie." }
            show: { drawn: clock, hour: 1, minute: 30 }
          - text: "Il est sept heures et demie.\nEt demie comes last."
            say: { en: "In English half comes first. In French et demie comes last, after heures. Never il est demie quatre.", fr: "Il est sept heures et demie." }
            show: { drawn: clock, hour: 7, minute: 30 }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tap the clock that matches."
                say: { en: "Listen. Tap the clock that matches." }
                audio: { fr: "Il est quatre heures et demie." }
                options:
                  - { drawn: clock, hour: 4, minute: 30 }
                  - { drawn: clock, hour: 3, minute: 30 }
                  - { drawn: clock, hour: 4, minute: 0 }
                answer: "4:30"
                feedback:
                  "4:00": "Listen to the end: et demie means half past."
                hints:
                  - "Listen to the end."
                  - "Quatre heures et demie is half past four."
                  - "Tap the clock with the long hand on 6, just past 4."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What time is it?"
                say: { en: "What time is it? Tap the sentence that matches." }
                show: { drawn: clock, hour: 7, minute: 30 }
                options: ["Il est sept heures et demie.", "Il est demie sept heures.", "Il est sept heures."]
                answer: "Il est sept heures et demie."
                option_audio: false
                feedback:
                  "Il est demie sept heures.": "In French et demie comes last: il est sept heures et demie."
                hints:
                  - "It is half past seven."
                  - "Et demie comes after heures."
                  - "Il est sept heures et demie."
              - id: l2-f3
                type: audio_choice
                text: "Tap the clock that matches."
                say: { en: "Listen. Tap the clock that matches." }
                audio: { turns: [{ fr: "Léa, quelle heure est-il ?", speaker: male }, { fr: "Il est deux heures et demie.", speaker: female }] }
                options:
                  - { drawn: clock, hour: 2, minute: 30 }
                  - { drawn: clock, hour: 2, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 30 }
                answer: "2:30"
                hints:
                  - "Listen for the number and for et demie."
                  - "Deux is two."
                  - "Half past two."
              - id: l2-f4
                type: fill_in_blank
                text: "It is half past nine. Finish the sentence."
                say: { en: "It is half past nine. Finish the sentence." }
                show: { drawn: clock, hour: 9, minute: 30 }
                frame: "Il est neuf heures _."
                options: ["et demie", "demie", "midi"]
                answer: ["et demie"]
                option_audio: false
                hints:
                  - "Half past is two words."
                  - "Et, then demie."
                  - "Il est neuf heures et demie."
              - id: l2-f5
                type: speak
                say: { en: "Say the time in French.", fr: "Il est six heures et demie." }
                show: { drawn: clock, hour: 6, minute: 30 }
                expected_text: "Il est six heures et demie."
                hints:
                  - "Start with il est six heures."
                  - "Then et demie."
                  - "Say it with me: il est six heures et demie."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Tap the clock that matches."
                say: { en: "Listen. Tap the clock that matches." }
                audio: { fr: "Il est dix heures et demie." }
                options:
                  - { drawn: clock, hour: 10, minute: 30 }
                  - { drawn: clock, hour: 9, minute: 30 }
                  - { drawn: clock, hour: 10, minute: 0 }
                answer: "10:30"
                hints: ["Dix is ten; et demie is half past."]
              - id: l2-s2
                type: multiple_choice
                text: "What time is it?"
                say: { en: "What time is it? Tap the sentence that matches." }
                show: { drawn: clock, hour: 3, minute: 30 }
                options: ["Il est trois heures et demie.", "Il est demie trois.", "Il est trois heures."]
                answer: "Il est trois heures et demie."
                option_audio: false
                hints: ["Et demie comes last."]
              - id: l2-s3
                type: audio_choice
                text: "When does the film start?"
                say: { en: "Listen. When does the film start?" }
                audio: { fr: "Le film commence à huit heures et demie." }
                options: ["half past eight", "eight o'clock", "half past nine"]
                answer: "half past eight"
                hints: ["Listen for the number and for et demie."]
              - id: l2-s4
                type: true_false
                text: "Does the clock match?\nIl est cinq heures et demie."
                say: { en: "Listen. Does the clock match?", fr: "Il est cinq heures et demie." }
                show: { drawn: clock, hour: 5, minute: 30 }
                answer: true
                hints: ["The long hand on 6 means half past."]
              - id: l2-s5
                type: speak
                say: { en: "Say the time in French.", fr: "Il est onze heures et demie." }
                show: { drawn: clock, hour: 11, minute: 30 }
                expected_text: "Il est onze heures et demie."
                hints: ["Say it with me: il est onze heures et demie."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Tap the clock that matches."
                say: { en: "Listen. Tap the clock that matches." }
                audio: { fr: "Il est une heure et demie." }
                options:
                  - { drawn: clock, hour: 1, minute: 30 }
                  - { drawn: clock, hour: 12, minute: 30 }
                  - { drawn: clock, hour: 1, minute: 0 }
                answer: "1:30"
              - id: l2-n2
                type: multiple_choice
                text: "What time is it?"
                say: { en: "What time is it? Tap the sentence that matches." }
                show: { drawn: clock, hour: 8, minute: 30 }
                options: ["Il est huit heures et demie.", "Il est demie huit.", "Il est huit ans et demie."]
                answer: "Il est huit heures et demie."
                option_audio: false
              - id: l2-n3
                type: audio_choice
                text: "When does school start?"
                say: { en: "Listen. When does school start?" }
                audio: { fr: "L'école commence à neuf heures." }
                options: ["nine o'clock", "half past nine", "five o'clock"]
                answer: "nine o'clock"
              - id: l2-n4
                type: true_false
                text: "Does the clock match?\nIl est deux heures et demie."
                say: { en: "Listen. Does the clock match?", fr: "Il est deux heures et demie." }
                show: { drawn: clock, hour: 2, minute: 0 }
                answer: false
              - id: l2-n5
                type: image_multiple_choice
                option_audio: false
                text: "Which clock matches?\nIl est onze heures et demie."
                say: { en: "Read the sentence. Which clock matches?" }
                options:
                  - { drawn: clock, hour: 11, minute: 30 }
                  - { drawn: clock, hour: 11, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 30 }
                answer: "11:30"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: oclock
            type: audio_choice
            text: "Tap the clock that matches."
            say: { en: "Listen. Tap the clock that matches." }
            audio: { fr: "Il est cinq heures." }
            options:
              - { drawn: clock, hour: 5, minute: 0 }
              - { drawn: clock, hour: 5, minute: 30 }
              - { drawn: clock, hour: 9, minute: 0 }
            answer: "5:00"
          - id: l2-c2
            part: half-past
            type: multiple_choice
            text: "What time is it?"
            say: { en: "What time is it? Tap the sentence that matches." }
            show: { drawn: clock, hour: 10, minute: 30 }
            options: ["Il est dix heures et demie.", "Il est demie dix.", "Il est dix."]
            answer: "Il est dix heures et demie."
            option_audio: false
          - id: l2-c3
            part: midi-minuit
            type: audio_choice
            text: "What time is it?"
            say: { en: "Listen. What time is it?" }
            audio: { turns: [{ fr: "Quelle heure est-il ?", speaker: female }, { fr: "Il est midi.", speaker: male }] }
            options: ["midday", "midnight", "half past twelve"]
            answer: "midday"
          - id: l2-c4
            part: half-past
            type: image_multiple_choice
            option_audio: false
            text: "Which clock matches?\nIl est six heures et demie."
            say: { en: "Read the sentence. Which clock matches?" }
            options:
              - { drawn: clock, hour: 6, minute: 30 }
              - { drawn: clock, hour: 5, minute: 30 }
              - { drawn: clock, hour: 6, minute: 0 }
            answer: "6:30"
          - id: l2-c5
            part: ask-use
            type: audio_choice
            text: "When does the bus leave?"
            say: { en: "Listen. When does the bus leave?" }
            audio: { fr: "Le bus part à trois heures et demie." }
            options: ["half past three", "three o'clock", "half past two"]
            answer: "half past three"
          - id: l2-c6
            part: oclock
            type: fill_in_blank
            option_audio: false
            text: "Look at the clock. Finish the sentence."
            say: { en: "Look at the clock. Finish the sentence." }
            show: { drawn: clock, hour: 4, minute: 0 }
            frame: "Il est _ heures."
            options: ["quatre", "huit", "cinq"]
            answer: ["quatre"]
          - id: l2-c7
            part: oclock
            type: audio_choice
            text: "What time is it?"
            say: { en: "Listen. What time is it?" }
            audio: { fr: "Il est huit heures." }
            options: ["eight o'clock", "half past eight", "four o'clock"]
            answer: "eight o'clock"
          - id: l2-c8
            part: oclock
            type: ordering
            option_audio: false
            text: "Build the sentence: it's one o'clock."
            say: { en: "Build the sentence: it's one o'clock." }
            options: ["une heure.", "est", "Il", "un"]
            slot_count: 3
            answer: ["Il", "est", "une heure."]
          - id: l2-c9
            part: oclock
            type: matching
            option_audio: false
            text: "Match each clock to its sentence."
            say: { en: "Match each clock to its sentence." }
            pairs:
