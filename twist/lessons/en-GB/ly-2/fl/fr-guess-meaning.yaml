# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-guess-meaning
skill: fl.culture-strategies.guess-meaning
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Neue Wörter erraten (Französisch)
  en: Guessing new words in French
summary: >
  Working out what an unknown French word means instead of giving up.
  Lesson 1 brings two tricks: look at the picture (l'escargot, le
  hérisson, la pieuvre) and look for an English word that looks or sounds
  alike (la musique, la girafe), with a warning about false friends (le
  pain is bread, la librairie is a bookshop, le car is a coach). Lesson 2
  adds two more: the words you know in the sentence (soif next to eau) and
  what the speaker does (a finger on the lips, a wave), and ends with the
  skill check. The French is spoken; questions and answers are in English.
metadata:
  year: ly-2
  topic: { de: Lernstrategien, en: Learning strategies }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.short-dialogues]
  also_practises: [fl.culture-strategies.compare-languages, fl.listening.classroom-phrases]
  vocabulary: { fr: ["l'escargot", le hérisson, la pieuvre, "l'araignée", la musique, la famille, le pain, la librairie, le car, "j'ai soif", le parapluie, le bonnet, délicieux, énorme, "Chut !", "Bravo !", "À demain !"] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: picture, what: { de: ein neues Wort mit Hilfe eines Bildes erraten, en: guessing a new word from a picture } }
    - { id: alike, what: { de: "Wörter nutzen, die wie Englisch aussehen, und falsche Freunde erkennen", en: "using words that look like English, and spotting false friends" } }
    - { id: context, what: { de: ein neues Wort aus den bekannten Wörtern im Satz erraten, en: guessing a new word from the words around it } }
    - { id: gesture, what: { de: "aus dem, was jemand tut, erraten, was er sagt", en: guessing from what the speaker does } }
  misconceptions:
    - id: gives-up
      what: Stops listening or answering as soon as one word is unknown
      addressed: lesson 1 Learn says an unknown word can often be guessed; l2-f5, l2-s4 and l2-c5 ask which way of working helps and offer giving up as a wrong option
    - id: sound-alike-trap
      what: Trusts a word that only partly sounds like an English one, even when the picture or sentence says otherwise (l'escargot as cargo, l'araignée as rain, le bonnet as a car bonnet)
      addressed: l1-f1 gives feedback to look at the picture first; l1-s2, l1-n1, l2-f4 and l2-c1 set a sound-alike distractor next to the picture or the sentence
    - id: false-friend
      what: Takes a word that looks exactly like an English one to mean the same (le pain as pain, la librairie as library, le car as car)
      addressed: lesson 1 Learn names three false friends; l1-f5 gives feedback, and l1-s5, l1-n3, l2-w2 and l2-c3 ask again
    - id: ignores-context
      what: Guesses from the unknown word alone and ignores the known words around it
      addressed: lesson 2 Learn works out soif from eau; l2-f1 gives feedback on hungry, and l2-s1, l2-n1, l2-n3 and l2-n5 name the known word in the sentence
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bilder und ähnliche Wörter", en: "Pictures and words that look alike" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "What is it about?"
            say: { en: "Listen. What is it about?" }
            audio: { fr: "J'ai faim. Je voudrais une pomme, s'il te plaît.", speaker: female }
            options: ["food", "the weather", "a pet"]
            answer: "food"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which pet has the child got?"
            say: { en: "Listen. Which pet has the child got?" }
            audio: { turns: [{ fr: "Tu as un animal ?", speaker: female }, { fr: "Oui, j'ai un chien.", speaker: male }] }
            options: [{ object: dog }, { object: cat }, { object: rabbit }]
            answer: dog
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "l'escargot"
            say: { en: "You do not know this word. Don't give up! Look at the picture: l'escargot is a snail.", fr: "L'escargot." }
            show: { object: snail }
          - text: "la musique, la girafe, le crocodile"
            say: { en: "Many French words look and sound like English ones: la musique is music, la girafe is a giraffe.", fr: "La musique. La girafe. Le crocodile." }
          - text: "le pain = bread\nla librairie = bookshop\nle car = coach"
            say: { en: "Careful: some words look like English but mean something else. Le pain is bread, not pain. La librairie is a bookshop. Le car is a coach. Always check with the picture or the sentence.", fr: "Le pain. La librairie. Le car." }
            show: { object: bread }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What does “l'escargot” mean?"
                say: { en: "Look at the picture. What does l'escargot mean?" }
                show: { object: snail }
                options: ["a snail", "a scarf", "a cargo ship"]
                answer: "a snail"
                feedback:
                  "a cargo ship": "Escargot sounds a bit like cargo, but look at the picture first."
                hints:
                  - "Look at the picture first."
                  - "The picture shows a small animal with a shell."
                  - "L'escargot is a snail."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What does “la musique” mean?"
                options: ["music", "a museum", "a mouse"]
                answer: "music"
                hints:
                  - "Read the word slowly."
                  - "Which English word looks almost the same?"
                  - "La musique is music."
              - id: l1-f3
                type: multiple_choice
                text: "What does “la pieuvre” mean?"
                say: { en: "Look at the picture. What does la pieuvre mean?" }
                show: { object: octopus }
                options: ["an octopus", "a fish", "a pear"]
                answer: "an octopus"
                hints:
                  - "The word does not look like English, so the picture helps."
                  - "How many arms has the animal got?"
                  - "La pieuvre is an octopus."
              - id: l1-f4
                type: matching
                option_audio: false
                text: "Match the words that look alike."
                say: { en: "Tap a French word, then the English word that looks like it." }
                pairs:
                  - { left: { text: "la banane", say: { fr: "La banane." } }, right: { text: "banana" } }
                  - { left: { text: "le train", say: { fr: "Le train." } }, right: { text: "train" } }
                  - { left: { text: "la girafe", say: { fr: "La girafe." } }, right: { text: "giraffe" } }
                  - { left: { text: "le crocodile", say: { fr: "Le crocodile." } }, right: { text: "crocodile" } }
                hints:
                  - "Look at the first letters."
                  - "Girafe has one f; giraffe has two."
                  - "La banane goes with banana, la girafe with giraffe."
              - id: l1-f5
                type: true_false
                text: "Le pain means pain."
                say: { en: "Look at the picture. Read the sentence. Is it true?" }
                show: { object: bread }
                answer: false
                feedback:
                  "true": "Le pain is a false friend. It looks like pain, but it means bread."
                hints:
                  - "Look at the picture."
                  - "Some words look like English but mean something else."
                  - "No. Le pain means bread."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ben hears “le hérisson” and sees this picture. What helps him?"
                show: { object: hedgehog }
                options: ["the picture", "the sound of the word", "nothing"]
                answer: "the picture"
                hints: ["Hérisson does not sound like hedgehog."]
              - id: l1-s2
                type: multiple_choice
                text: "What does “l'araignée” mean?"
                say: { en: "Look at the picture. What does l'araignée mean?" }
                show: { object: spider }
                options: ["a spider", "rain", "a rainbow"]
                answer: "a spider"
                hints: ["Look at the picture, not only the sound."]
              - id: l1-s3
                type: multiple_choice
                text: "What does “la famille” mean?"
                options: ["the family", "a film", "a flame"]
                answer: "the family"
                hints: ["Which English word looks almost the same?"]
              - id: l1-s4
                type: matching
                option_audio: false
                text: "Match the words that look alike."
                say: { en: "Tap a French word, then the English word that looks like it." }
                pairs:
                  - { left: { text: "l'éléphant", say: { fr: "L'éléphant." } }, right: { text: "elephant" } }
                  - { left: { text: "la carotte", say: { fr: "La carotte." } }, right: { text: "carrot" } }
                  - { left: { text: "le zèbre", say: { fr: "Le zèbre." } }, right: { text: "zebra" } }
                hints: ["Look at the first letters."]
              - id: l1-s5
                type: true_false
                text: "La librairie is a bookshop."
                say: { en: "Read the sentence. Is it true?" }
                answer: true
                hints: ["La librairie is a false friend."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What does “le canard” mean?"
                say: { en: "Look at the picture. What does le canard mean?" }
                show: { object: duck }
                options: ["a duck", "a card", "a canal"]
                answer: "a duck"
              - id: l1-n2
                type: multiple_choice
                text: "What does “le dentiste” mean?"
                options: ["the dentist", "a dent", "a tent"]
                answer: "the dentist"
              - id: l1-n3
                type: true_false
                text: "Le car means a car."
                say: { en: "Look at the picture. Read the sentence. Is it true?" }
                show: { object: bus }
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "What does “le papillon” mean?"
                say: { en: "Look at the picture. What does le papillon mean?" }
                show: { object: butterfly }
                options: ["a butterfly", "a pillow", "a pavilion"]
                answer: "a butterfly"
              - id: l1-n5
                type: multiple_choice
                text: "Which word looks like English and means the same?"
                options: ["le chocolat", "le pain", "la librairie"]
                answer: "le chocolat"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What does “le hibou” mean?"
            say: { en: "Look at the picture. What does le hibou mean?" }
            show: { object: owl }
            options: ["an owl", "a hippo", "a shoe"]
            answer: "an owl"
          - id: l1-c2
            type: multiple_choice
            text: "What does “le dinosaure” mean?"
            options: ["a dinosaur", "dinner", "a door"]
            answer: "a dinosaur"
          - id: l1-c3
            type: true_false
            text: "Le pain is something to eat."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "What does “la grenouille” mean?"
            say: { en: "Look at the picture. What does la grenouille mean?" }
            show: { object: frog }
            options: ["a frog", "a granny", "a green bean"]
            answer: "a frog"
          - id: l1-c5
            type: multiple_choice
            text: "What does “la limonade” mean?"
            options: ["a lime tree", "lemonade", "a lemon"]
            answer: "lemonade"
          - id: l1-c6
            type: true_false
            text: "Les vacances means the holidays."
            say: { en: "Read the sentence. Is it true?" }
            answer: true

  - n: 2
    title: { de: "Der Satz und die Gesten helfen", en: "The sentence and gestures help" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What does “l'escargot” mean?"
            say: { en: "Look at the picture. What does l'escargot mean?" }
            show: { object: snail }
            options: ["a snail", "a carrot", "a scarf"]
            answer: "a snail"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "La librairie is a library."
            say: { en: "Read the sentence. Is it true?" }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "J'ai soif. Je voudrais de l'eau."
            say: { en: "You know eau: water. Someone who wants water is thirsty. So j'ai soif means I'm thirsty. The words you know help.", fr: "J'ai soif. Je voudrais de l'eau." }
            show: { object: water }
          - text: "Il pleut. Prends ton parapluie !"
            say: { en: "You know il pleut: it is raining. So le parapluie is something for the rain: an umbrella.", fr: "Il pleut. Prends ton parapluie !" }
            show: { object: umbrella }
          - text: "Chut !"
            say: { en: "Watch what the person does. A finger on the lips: chut! means be quiet.", fr: "Chut !" }
            show: { object: quiet }
          - text: "Salut ! À demain !"
            say: { en: "A wave at the end of the day: à demain means see you tomorrow.", fr: "Salut ! À demain !" }
            show: { object: wave }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "What does j'ai soif mean?"
                say: { en: "Listen. What does j'ai soif mean?" }
                audio: { fr: "J'ai soif. Je voudrais de l'eau, s'il te plaît.", speaker: male }
                options: ["I'm thirsty.", "I'm hungry.", "I'm tired."]
                answer: "I'm thirsty."
                feedback:
                  "I'm hungry.": "Hungry is j'ai faim. The child wants water, so they are thirsty."
                hints:
                  - "Which word do you know in the sentence?"
                  - "De l'eau is water."
                  - "If you want water, you are thirsty."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "What is le parapluie?"
                say: { en: "Listen. What is le parapluie?" }
                audio: { fr: "Il pleut ! Prends ton parapluie !" }
                options: [{ object: umbrella }, { object: sun }, { object: ball }]
                answer: umbrella
                hints:
                  - "Which words do you know?"
                  - "Il pleut means it is raining."
                  - "You take an umbrella in the rain."
              - id: l2-f3
                type: multiple_choice
                text: "The teacher puts a finger on her lips and says: “Chut !” What does it mean?"
                show: { object: quiet }
                options: ["Be quiet!", "Stand up!", "Well done!"]
                answer: "Be quiet!"
                hints:
                  - "Look at what the teacher does."
                  - "A finger on the lips."
                  - "Chut! means be quiet."
              - id: l2-f4
                type: multiple_choice
                text: "Mum says: “Il fait froid. Mets ton bonnet !” What is a bonnet?"
                options: ["a woolly hat", "the front of a car", "a bed"]
                answer: "a woolly hat"
                feedback:
                  "the front of a car": "In English a bonnet can be on a car, but Mum says il fait froid. You put on something warm."
                hints:
                  - "Which words do you know?"
                  - "Il fait froid means it is cold."
                  - "When it is cold you put on a woolly hat."
              - id: l2-f5
                type: multiple_choice
                text: "You hear a sentence with one new word. What helps most?"
                options: ["Look at the words you know around it.", "Stop listening.", "Guess any word."]
                answer: "Look at the words you know around it."
                hints:
                  - "Don't give up."
                  - "The other words in the sentence give you clues."
                  - "Look at the words you know around it."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "What are des gants?"
                say: { en: "Listen. What are des gants?" }
                audio: { fr: "Il neige ! Mets tes gants !" }
                options: ["gloves", "giants", "sandals"]
                answer: "gloves"
                hints: ["Il neige means it is snowing."]
              - id: l2-s2
                type: multiple_choice
                text: "Léa waves and says: “À demain !” What does it mean?"
                show: { object: wave }
                options: ["See you tomorrow!", "Good morning!", "Come here!"]
                answer: "See you tomorrow!"
                hints: ["Léa is waving goodbye."]
              - id: l2-s3
                type: audio_choice
                text: "What does délicieux mean?"
                say: { en: "Listen. What does délicieux mean?" }
                audio: { fr: "Mmm ! Ce gâteau est délicieux !" }
                options: ["delicious", "horrible", "dirty"]
                answer: "delicious"
                hints: ["Listen to the voice: mmm!"]
              - id: l2-s4
                type: multiple_choice
                text: "Sam does not know one word in a sentence. What should he do?"
                options: ["Use the other words and the picture.", "Give up.", "Cover his ears."]
                answer: "Use the other words and the picture."
                hints: ["Don't give up."]
              - id: l2-s5
                type: true_false
                text: "J'ai soif means I'm hungry."
                say: { en: "Read the sentence. Is it true?" }
                answer: false
                hints: ["The thirsty child wanted water."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "What is le lit?"
                say: { en: "Listen. What is le lit?" }
                audio: { fr: "Le bébé est fatigué. Il va au lit." }
                options: [{ object: bed }, { object: bath }, { object: table }]
                answer: bed
              - id: l2-n2
                type: multiple_choice
                text: "The teacher smiles and says: “Bravo !” What does it mean?"
                options: ["Well done!", "Sit down!", "Be quiet!"]
                answer: "Well done!"
              - id: l2-n3
                type: multiple_choice
                text: "Dad says: “Il y a du soleil. Mets ta casquette !” What is a casquette?"
                options: ["a cap", "a cassette", "a scarf"]
                answer: "a cap"
              - id: l2-n4
                type: audio_choice
                text: "What does énorme mean?"
                say: { en: "Listen. What does énorme mean?" }
                audio: { fr: "Regarde ! Un éléphant énorme ! Il est très, très grand !" }
                options: ["huge", "tiny", "noisy"]
                answer: "huge"
              - id: l2-n5
                type: multiple_choice
                text: "“Il pleut, prends ton parapluie !” Which words tell you most about “parapluie”?"
                options: ["il pleut", "prends", "ton"]
                answer: "il pleut"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: picture
            type: multiple_choice
            text: "What does “le requin” mean?"
            say: { en: "Look at the picture. What does le requin mean?" }
            show: { object: shark }
            options: ["a shark", "a ring", "a raincoat"]
            answer: "a shark"
          - id: l2-c2
            part: context
            type: audio_choice
            text: "What is un pull?"
            say: { en: "Listen. What is un pull?" }
            audio: { fr: "Brr, il fait froid ! Où est mon pull ?", speaker: female }
            options: ["a jumper", "a swimming pool", "a pillow"]
            answer: "a jumper"
          - id: l2-c3
            part: alike
            type: true_false
            text: "Le car means a coach."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
          - id: l2-c4
            part: gesture
            type: multiple_choice
            text: "The teacher puts her finger on her lips. What does she say?"
            options: ["Chut !", "Bravo !", "À demain !"]
            answer: "Chut !"
            option_audio: false
          - id: l2-c5
            part: context
            type: multiple_choice
            text: "You hear a French word you don't know. What helps you?"
            options: ["the picture and the words around it", "giving up", "a word that sounds alike, even when the picture shows something else"]
            answer: "the picture and the words around it"
          - id: l2-c6
            part: picture
            type: multiple_choice
            text: "What does “la coccinelle” mean?"
            say: { en: "Look at the picture. What does la coccinelle mean?" }
            show: { object: ladybird }
            options: ["a coconut", "a ladybird", "a cinema"]
            answer: "a ladybird"
          - id: l2-c7
            part: picture
            type: multiple_choice
            text: "What does “la tortue” mean?"
            say: { en: "Look at the picture. What does la tortue mean?" }
            show: { object: tortoise }
            options: ["a tart", "a torch", "a tortoise"]
            answer: "a tortoise"
          - id: l2-c8
            part: picture
            type: true_false
            text: "Le renard means a reindeer."
            say: { en: "Look at the picture. Read the sentence. Is it true?" }
            show: { object: fox }
            answer: false
          - id: l2-c9
            part: picture
            type: multiple_choice
            text: "What does “les ciseaux” mean?"
            say: { en: "Look at the picture. What does les ciseaux mean?" }
            show: { object: scissors }
            options: ["scissors", "a seesaw", "the sea"]
            answer: "scissors"
          - id: l2-c10
            part: alike
            type: matching
            option_audio: false
            text: "Which English word goes with each French word?"
            say: { en: "Tap a French word, then the English word it looks like." }
            pairs:
              - { left: { text: "le tigre", say: { fr: "Le tigre." } }, right: { text: "tiger" } }
              - { left: { text: "la tomate", say: { fr: "La tomate." } }, right: { text: "tomato" } }
              - { left: { text: "le docteur", say: { fr: "Le docteur." } }, right: { text: "doctor" } }
          - id: l2-c11
            part: alike
            type: multiple_choice
            text: "What does “le dragon” mean?"
            options: ["a drawing", "a dragon", "a dress"]
            answer: "a dragon"
          - id: l2-c12
            part: alike
            type: true_false
            text: "You can buy books in a librairie."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
          - id: l2-c13
            part: alike
            type: multiple_choice
            text: "Which one is a false friend? It looks like English but means something else."
            options: ["la girafe", "la librairie", "la banane"]
            answer: "la librairie"
            option_audio: false
          - id: l2-c14
            part: context
            type: audio_choice
            text: "What is une bougie?"
            say: { en: "Listen. What is une bougie?" }
            audio: { fr: "Joyeux anniversaire ! Souffle la bougie !" }
            options: [{ object: cake }, { object: candle }, { object: present }]
            answer: candle
          - id: l2-c15
            part: context
            type: multiple_choice
            text: "Grandma says: “Il fait chaud ! Je voudrais une glace.” What does chaud mean?"
            options: ["cold", "hot", "a shoe"]
            answer: "hot"
          - id: l2-c16
            part: context
            type: audio_choice
            text: "What is la piscine?"
            say: { en: "Listen. What is la piscine?" }
            audio: { fr: "Il fait chaud. On va nager à la piscine !" }
            options: [{ object: school }, { object: swimming-pool }, { object: park }]
            answer: swimming-pool
          - id: l2-c17
            part: gesture
            type: multiple_choice
            text: "The teacher points at the board and says: “Regardez !” What does it mean?"
            show: { object: point }
            options: ["Listen!", "Sit down!", "Look!"]
            answer: "Look!"
          - id: l2-c18
            part: gesture
            type: multiple_choice
            text: "The teacher claps and smiles. What does she say?"
            options: ["Au revoir !", "Bravo !", "Asseyez-vous !"]
            answer: "Bravo !"
            option_audio: false
          - id: l2-c19
            part: gesture
            type: multiple_choice
            text: "The PE teacher puts his hands over his ears and says: “Trop de bruit !” What does he mean?"
            options: ["It's too noisy!", "It's too cold!", "It's too late!"]
