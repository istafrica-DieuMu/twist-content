# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-weather
skill: fl.themes.weather
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Das Wetter (Französisch)
  en: The weather in French
summary: >
  Describing the weather in French and understanding a short weather
  report. Lesson 1 brings il fait beau, il pleut, il neige, il y a du vent
  and il y a des nuages, and which ones take il fait; lesson 2 adds il
  fait chaud and il fait froid (never il est chaud), asks Quel temps
  fait-il ?, picks out the weather for two towns or two days in a short
  report, and ends with the skill check. Instructions are in English; the
  French is heard and shown in short form. A thermometer shows hot and
  cold.
metadata:
  year: ly-2
  topic: { de: Wetter, en: Weather }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.calendar]
  also_practises: [fl.themes.outside-animals]
  vocabulary: { fr: [il fait beau, il pleut, il neige, il y a du vent, il y a des nuages, il fait chaud, il fait froid, "Quel temps fait-il ?", "aujourd'hui", demain] }
  forms: [audio, picture, text, drawn]
  drawn: [thermometer]
  facets: []
  misconceptions:
    - id: il-fait-pleut
      what: Puts il fait in front of every weather word (il fait pleut, il fait neige)
      addressed: lesson 1 Learn sorts il fait beau apart from il pleut and il neige, which stand alone; l1-f3 gives feedback on il fait pleut, l1-s4 sorts the phrases, and l1-n3 and l2-c4 offer il fait neige or il fait pleut again
    - id: il-est-chaud
      what: Says il est chaud or c'est froid after the English it is hot
      addressed: lesson 2 Learn says weather takes il fait, and il est chaud means he is hot; l2-f2 gives feedback on il est chaud, and l2-s3 and l2-n3 keep it among the options
    - id: cloud-rain
      what: Mixes up il y a des nuages and il pleut, both shown with a grey cloud
      addressed: il pleut is heard with the cloud picture among the options in l1-f2, l1-s2 and l1-n2, with feedback in l1-f2; il y a des nuages is never set against the rain or snow picture, which also show a cloud
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Il fait beau.", en: "Il fait beau." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { en: "Listen. Which day is it?" }
            audio: { fr: "On est lundi." }
            options: ["Monday", "Sunday", "Tuesday"]
            answer: "Monday"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which season is l'hiver?"
            options: ["winter", "spring", "summer"]
            answer: "winter"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "Il fait beau."
            say: { en: "The weather in French. When the sun shines, you say il fait beau, the weather is nice.", fr: "Il fait beau." }
            show: { object: sun }
          - text: "Il pleut. Il neige."
            say: { en: "Il pleut means it is raining. Il neige means it is snowing. These two stand alone: no fait.", fr: "Il pleut. Il neige." }
            show: { objects: [rain, snow] }
          - text: "Il y a du vent. Il y a des nuages."
            say: { en: "Il y a means there is. Il y a du vent, it is windy. Il y a des nuages, it is cloudy.", fr: "Il y a du vent. Il y a des nuages." }
            show: { objects: [wind, cloud] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { en: "Listen. What is the weather like?" }
                audio: { fr: "Il neige." }
                options: [{ object: snow }, { object: sun }, { object: wind }]
                answer: snow
                hints:
                  - "Listen again: il neige."
                  - "Neige is snow."
                  - "Tap the snow."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { en: "Listen. What is the weather like?" }
                audio: { fr: "Il pleut." }
                options: [{ object: rain }, { object: cloud }, { object: sun }]
                answer: rain
                feedback:
                  cloud: "That is il y a des nuages, it is cloudy. Il pleut means it is raining."
                hints:
                  - "Listen again: il pleut."
                  - "Il pleut means it is raining."
                  - "Tap the rain."
              - id: l1-f3
                type: multiple_choice
                text: "It is raining."
                say: { en: "How do you say it is raining in French?" }
                options: ["Il pleut.", "Il fait pleut.", "Il y a pleut."]
                answer: "Il pleut."
                option_audio: false
                feedback:
                  "Il fait pleut.": "Nearly! Il pleut stands alone, with no fait."
                hints:
                  - "Raining and snowing stand alone."
                  - "There is no fait and no il y a."
                  - "Il pleut."
              - id: l1-f4
                type: true_false
                say: { en: "Listen. Does it match the picture?", fr: "Il y a du vent." }
                text: "Il y a du vent."
                show: { object: wind }
                answer: true
                hints:
                  - "Listen again: il y a du vent."
                  - "Vent is wind."
                  - "Yes, it matches."
              - id: l1-f5
                type: speak
                say: { en: "Say it in French.", fr: "Il fait beau." }
                show: { object: sun }
                expected_text: "Il fait beau."
                hints:
                  - "Listen again: il fait beau."
                  - "Il fait, then beau."
                  - "Say it with me: il fait beau."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { en: "Listen. What is the weather like?" }
                audio: { fr: "Il y a des nuages." }
                options: [{ object: cloud }, { object: sun }, { object: wind }]
                answer: cloud
                hints: ["Nuages are clouds."]
              - id: l1-s2
                type: audio_choice
                say: { en: "Listen. What is the weather like?" }
                audio: { fr: "Il pleut." }
                options: [{ object: cloud }, { object: wind }, { object: rain }]
                answer: rain
                hints: ["Il pleut means it is raining."]
              - id: l1-s3
                type: true_false
                say: { en: "Listen. Does it match the picture?", fr: "Il fait beau." }
                text: "Il fait beau."
                show: { object: snow }
                answer: false
                hints: ["Il fait beau goes with the sun."]
              - id: l1-s4
                type: sorting
                option_audio: false
                text: "With fait or without?"
                say: { en: "Does the weather word take il fait, or does it stand alone? Sort the cards." }
                bins:
                  - { id: fait, show: { text: "il fait ..." }, say: { fr: "il fait" } }
                  - { id: alone, show: { text: "il ... on its own" }, say: { en: "on its own" } }
                options:
                  - { text: "beau", bin: fait }
                  - { text: "pleut", bin: alone }
                  - { text: "neige", bin: alone }
                hints: ["Pleut and neige stand alone."]
              - id: l1-s5
                type: speak
                say: { en: "Say it in French.", fr: "Il neige." }
                show: { object: snow }
                expected_text: "Il neige."
                hints: ["Say it with me: il neige."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { en: "Listen. What is the weather like?" }
                audio: { fr: "Il fait beau." }
                options: [{ object: sun }, { object: snow }, { object: cloud }]
                answer: sun
              - id: l1-n2
                type: audio_choice
                say: { en: "Listen. What is the weather like?" }
                audio: { fr: "Il pleut." }
                options: [{ object: wind }, { object: rain }, { object: cloud }]
                answer: rain
              - id: l1-n3
                type: multiple_choice
                text: "It is snowing."
                say: { en: "How do you say it is snowing in French?" }
                options: ["Il neige.", "Il fait neige.", "Il y a neige."]
                answer: "Il neige."
                option_audio: false
              - id: l1-n4
                type: true_false
                say: { en: "Listen. Does it match the picture?", fr: "Il y a des nuages." }
                text: "Il y a des nuages."
                show: { object: cloud }
                answer: true
              - id: l1-n5
                type: speak
                say: { en: "Say it in French.", fr: "Il y a du vent." }
                show: { object: wind }
                expected_text: "Il y a du vent."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { en: "Listen. What is the weather like?" }
            audio: { fr: "Il y a du vent." }
            options: [{ object: wind }, { object: sun }, { object: snow }]
            answer: wind
          - id: l1-c2
            type: image_multiple_choice
            option_audio: false
            text: "Il neige."
            say: { en: "Read the sentence. Which picture matches?" }
            options: [{ object: snow }, { object: sun }, { object: wind }]
            answer: snow
          - id: l1-c3
            type: true_false
            say: { en: "Listen. Does it match the picture?", fr: "Il pleut." }
            text: "Il pleut."
            show: { object: sun }
            answer: false

  - n: 2
    title: { de: "Quel temps fait-il ?", en: "Quel temps fait-il ?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { en: "Listen. What is the weather like?" }
            audio: { fr: "Il neige." }
            options: [{ object: snow }, { object: wind }, { object: sun }]
            answer: snow
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            option_audio: false
            text: "Il fait beau."
            say: { en: "Read the sentence. Which picture matches?" }
            options: [{ object: sun }, { object: rain }, { object: cloud }]
            answer: sun
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Il fait chaud."
            say: { en: "Il fait chaud means it is hot. Weather takes il fait. Il est chaud would mean he is hot, like a person.", fr: "Il fait chaud." }
            show: { drawn: thermometer, from: -10, to: 30, step: 5, value: 30 }
          - text: "Il fait froid."
            say: { en: "Il fait froid means it is cold.", fr: "Il fait froid." }
            show: { drawn: thermometer, from: -10, to: 30, step: 5, value: -5 }
          - text: "Quel temps fait-il ?\nIl fait beau et il fait chaud."
            say: { en: "To ask about the weather, say quel temps fait-il? What is the weather like?", fr: "Quel temps fait-il ? Il fait beau et il fait chaud." }
          - text: "Aujourd'hui, à Paris, il pleut. Demain, il fait beau."
            say: { en: "A weather report. Aujourd'hui means today, demain means tomorrow. À Paris means in Paris. Listen for the place and the day.", fr: "Aujourd'hui, à Paris, il pleut. Demain, il fait beau." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { en: "Listen. Is it hot or cold?" }
                audio: { fr: "Il fait froid." }
                options: ["cold", "hot"]
                keep_order: true
                answer: "cold"
                hints:
                  - "Listen again: il fait froid."
                  - "Froid sounds a little like frozen."
                  - "Froid is cold."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "It is hot today."
                say: { en: "Look at the thermometer. How do you say it is hot?" }
                show: { drawn: thermometer, from: -10, to: 30, step: 5, value: 30 }
                options: ["Il fait chaud.", "Il est chaud.", "Il fait froid."]
                answer: "Il fait chaud."
                option_audio: false
                feedback:
                  "Il est chaud.": "Il est chaud means he is hot. For the weather, say il fait chaud."
                hints:
                  - "Weather takes il fait."
                  - "Hot is chaud."
                  - "Il fait chaud."
              - id: l2-f3
                type: audio_choice
                say: { en: "Listen to the weather report. What is the weather like in Paris?" }
                audio: { fr: "Aujourd'hui, à Paris, il pleut. À Nice, il fait beau." }
                options: [{ object: rain }, { object: sun }, { object: snow }]
                answer: rain
                feedback:
                  sun: "That is the weather in Nice. In Paris, il pleut."
                hints:
                  - "Listen for à Paris."
                  - "À Paris, il pleut."
                  - "Il pleut means it is raining."
              - id: l2-f4
                type: audio_choice
                say: { en: "Listen. What is the weather like tomorrow?" }
                audio: { fr: "Aujourd'hui, il y a du vent. Demain, il neige." }
                options: [{ object: snow }, { object: wind }, { object: sun }]
                answer: snow
                hints:
                  - "Demain means tomorrow."
                  - "Listen after demain."
                  - "Demain, il neige: tap the snow."
              - id: l2-f5
                type: speak
                say: { en: "Ask in French: what is the weather like?", fr: "Quel temps fait-il ?" }
                expected_text: "Quel temps fait-il ?"
                hints:
                  - "It starts with quel temps."
                  - "Quel temps fait-il?"
                  - "Say it with me: quel temps fait-il ?"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { en: "Listen. Is it hot or cold?" }
                audio: { fr: "Il fait chaud." }
                options: ["cold", "hot"]
                keep_order: true
                answer: "hot"
                hints: ["Chaud is hot."]
              - id: l2-s2
                type: audio_choice
                say: { en: "Listen to the weather report. What is the weather like in Lyon?" }
                audio: { fr: "À Lyon, il y a du vent. À Lille, il pleut." }
                options: [{ object: wind }, { object: rain }, { object: cloud }]
                answer: wind
                hints: ["Listen for à Lyon."]
              - id: l2-s3
                type: multiple_choice
                text: "It is cold today."
                say: { en: "Look at the thermometer. How do you say it is cold?" }
                show: { drawn: thermometer, from: -10, to: 30, step: 5, value: -5 }
                options: ["Il est froid.", "Il fait froid.", "Il fait chaud."]
                answer: "Il fait froid."
                option_audio: false
                hints: ["Weather takes il fait."]
              - id: l2-s4
                type: true_false
                text: "Aujourd'hui, il fait beau. Demain, il pleut.\nIs it raining today?"
                say: { en: "Read the weather report. Is it raining today?" }
                answer: false
                hints: ["Aujourd'hui is today."]
              - id: l2-s5
                type: speak
                say: { en: "Your friend asks: Quel temps fait-il ? It is cold. Answer in French.", fr: "Il fait froid." }
                show: { drawn: thermometer, from: -10, to: 30, step: 5, value: -5 }
                expected_text: "Il fait froid."
                hints: ["Say it with me: il fait froid."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { en: "Listen. What is the weather like in Nice?" }
                audio: { fr: "À Paris, il y a des nuages. À Nice, il fait beau et il fait chaud." }
                options: ["sunny and hot", "cloudy and cold", "sunny and cold"]
                answer: "sunny and hot"
              - id: l2-n2
                type: audio_choice
                say: { en: "Listen. What is the weather like today?" }
                audio: { fr: "Aujourd'hui, il neige et il fait froid. Demain, il fait beau." }
                options: [{ object: snow }, { object: sun }, { object: rain }]
                answer: snow
              - id: l2-n3
                type: multiple_choice
                text: "Quel temps fait-il ?"
                say: { en: "It is hot and sunny. Answer the question." }
                show: { drawn: thermometer, from: -10, to: 30, step: 5, value: 25 }
                options: ["Il fait beau et il fait chaud.", "Il est beau et il est chaud.", "Il fait beau et il fait froid."]
                answer: "Il fait beau et il fait chaud."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "À Lille, il pleut. À Lyon, il neige.\nIs it snowing in Lyon?"
                say: { en: "Read the weather report. Is it snowing in Lyon?" }
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                option_audio: false
                text: "Demain, il y a des nuages."
                say: { en: "Read the weather report. What is the weather like tomorrow?" }
                options: [{ object: cloud }, { object: sun }, { object: wind }]
                answer: cloud

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { en: "Listen to the weather report. What is the weather like in Lille?" }
            audio: { fr: "À Nice, il fait beau. À Lille, il y a du vent." }
            options: [{ object: wind }, { object: sun }, { object: snow }]
            answer: wind
          - id: l2-c2
            type: multiple_choice
            text: "Il fait froid."
            say: { en: "Read the sentence. What does it mean?" }
            options: ["It is cold.", "It is hot.", "It is windy."]
            answer: "It is cold."
            option_audio: false
          - id: l2-c3
            type: audio_choice
            say: { en: "Listen. What is the weather like tomorrow?" }
            audio: { fr: "Aujourd'hui, il y a des nuages. Demain, il y a du vent." }
            options: [{ object: wind }, { object: cloud }, { object: sun }]
            answer: wind
          - id: l2-c4
            type: multiple_choice
            text: "It is raining in Paris."
            say: { en: "How do you say it is raining in Paris?" }
            options: ["À Paris, il pleut.", "À Paris, il fait pleut.", "À Paris, il est pluie."]
            answer: "À Paris, il pleut."
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Il fait chaud."
            say: { en: "Read the sentence. Does it match the thermometer?" }
            show: { drawn: thermometer, from: -10, to: 30, step: 5, value: -5 }
            answer: false
