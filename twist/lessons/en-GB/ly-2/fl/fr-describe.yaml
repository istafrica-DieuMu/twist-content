# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-describe
skill: fl.speaking.describe
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Tiere und Personen beschreiben (Französisch)
  en: Describing animals and people in French
summary: >
  Describing an animal, a person or a pet in a few French sentences: Il est
  grand et gris. Il a une trompe. Lesson 1 understands animal riddles,
  heard and read, and finds the animal; lesson 2 builds descriptions with
  il est and il a, uses elle for a girl or a la word (la girafe, elle est
  grande), and describes a pet with mon chat est ..., and ends with the
  skill check. Speaking tasks are practice only; the skill check asks for
  the building blocks of a description.
metadata:
  year: ly-2
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.ask-answer]
  also_practises: [fl.themes.outside-animals, fl.themes.colours, fl.themes.body]
  vocabulary: { fr: [grand, grande, petit, petite, long, très, gris, noir, blanc, jaune, vert, marron, "il est ...", "elle est ...", "il a ...", "elle a ...", "il n'a pas de ...", quatre pattes, deux ailes, une queue, une trompe, un long cou, deux grandes oreilles, il nage, il vole, il saute] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: understand, what: { de: eine kurze Beschreibung verstehen, en: understanding a short description } }
    - { id: est-a, what: { de: "sagen, wie etwas ist und was es hat (il est, il a)", en: "saying what something is like and what it has (il est, il a)" } }
    - { id: il-elle, what: { de: "il oder elle wählen, für einen Jungen, ein Mädchen oder ein la-Wort", en: "choosing il or elle for a boy, a girl or a la word" } }
    - { id: build, what: { de: einen beschreibenden Satz bauen, en: putting a describing sentence together } }
  misconceptions:
    - id: est-a
      what: Mixes up il est and il a (il est quatre pattes, il a grand)
      addressed: lesson 1 Learn says il est tells what it is like and il a tells what it has; l2-f1 and l2-f2 give feedback on the wrong verb, and l2-s1, l2-s2, l2-n1, l2-c2 and l2-c3 ask for est or a
    - id: il-elle
      what: Says il for a girl or for a la word (la girafe, il est grand)
      addressed: lesson 2 Learn brings elle with la girafe and with Léa; l2-f3 gives feedback on il, and l2-n2, l2-n3, l2-n5 and l2-c5 ask for il or elle
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Tierrätsel", en: "Animal riddles" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which picture is it?"
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "L'éléphant." }
            options: [{ object: elephant }, { object: zebra }, { object: lion }]
            answer: elephant
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "What has the child got?"
            say: { en: "Listen. What has the child got?" }
            audio: { turns: [{ fr: "Tu as un animal ?", speaker: female }, { fr: "Oui, j'ai un lapin.", speaker: male }] }
            options: [{ object: rabbit }, { object: cat }, { object: dog }]
            answer: rabbit
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Il est grand. Il est gris."
            say: { en: "This is how you describe an animal. Il est tells what it is like: grand is big, petit is small, long is long, très grand is very big. Colours come after: gris, noir, blanc, jaune, vert, marron.", fr: "Il est grand. Il est gris." }
          - text: "Il a quatre pattes et une queue."
            say: { en: "Il a tells what it has: quatre pattes, four legs; deux ailes, two wings; une queue, a tail; deux grandes oreilles, two big ears; une trompe, an elephant's trunk. Il n'a pas de pattes means it has no legs.", fr: "Il a quatre pattes et une queue." }
          - text: "Il nage. Il vole. Il saute."
            say: { en: "You can say what it does too. Il nage, it swims. Il vole, it flies. Il saute, it jumps.", fr: "Il nage. Il vole. Il saute." }
          - text: "Il est très grand et gris. Il a une trompe et deux grandes oreilles.\nC'est l'éléphant !"
            say: { en: "Put it together and you have a riddle. The answer: an elephant!", fr: "Il est très grand et gris. Il a une trompe et deux grandes oreilles. C'est l'éléphant !" }
            show: { object: elephant }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                option_audio: false
                text: "Which animal is it?\nIl est petit et blanc. Il a deux grandes oreilles."
                say: { en: "Read the riddle. Which animal is it?" }
                options: [{ object: rabbit }, { object: elephant }, { object: horse }]
                answer: rabbit
                feedback:
                  elephant: "The elephant has big ears, but it is not petit. Petit means small."
                hints:
                  - "Read the first sentence: petit et blanc."
                  - "It is small and white, with two big ears."
                  - "It is the rabbit."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which animal is it?"
                say: { en: "Listen to the riddle. Which animal is it?" }
                audio: { fr: "Il est noir et blanc. Il a quatre pattes." }
                options: [{ object: zebra }, { object: lion }, { object: crocodile }]
                answer: zebra
                hints:
                  - "Listen for the colours."
                  - "Noir et blanc is black and white."
                  - "It is the zebra."
              - id: l1-f3
                type: audio_choice
                text: "Which animal is it?"
                say: { en: "Listen to the riddle. Which animal is it?" }
                audio: { fr: "Il est long et vert. Il a quatre pattes et une grande bouche." }
                options: [{ object: crocodile }, { object: snake }, { object: lion }]
                answer: crocodile
                feedback:
                  snake: "The snake is long, but il a quatre pattes: it has four legs."
                hints:
                  - "Long and green: two animals fit. Listen for the legs."
                  - "Quatre pattes is four legs."
                  - "It is the crocodile."
              - id: l1-f4
                type: true_false
                text: "Does the riddle match the picture?\nIl a deux pattes et deux ailes. Il vole."
                say: { en: "Read the riddle. Does it match the picture?" }
                show: { object: bird }
                answer: true
                hints:
                  - "Deux ailes is two wings."
                  - "Il vole means it flies."
                  - "Yes, it is the bird."
              - id: l1-f5
                type: image_multiple_choice
                option_audio: false
                text: "Which animal is it?\nIl est long. Il n'a pas de pattes."
                say: { en: "Read the riddle. Which animal is it?" }
                options: [{ object: snake }, { object: crocodile }, { object: lion }]
                answer: snake
                hints:
                  - "Read the second sentence carefully."
                  - "Il n'a pas de pattes means it has no legs."
                  - "It is the snake."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which animal is it?"
                say: { en: "Listen to the riddle. Which animal is it?" }
                audio: { fr: "Il est petit. Il nage. Il n'a pas de pattes." }
                options: [{ object: fish }, { object: duck }, { object: crab }]
                answer: fish
                hints: ["No legs, and it swims."]
              - id: l1-s2
                type: image_multiple_choice
                option_audio: false
                text: "Which animal is it?\nIl est grand et gris. Il a une trompe."
                say: { en: "Read the riddle. Which animal is it?" }
                options: [{ object: elephant }, { object: horse }, { object: rabbit }]
                answer: elephant
                hints: ["Une trompe is a trunk."]
              - id: l1-s3
                type: true_false
                text: "Does the riddle match the picture?\nIl a quatre pattes. Il vole."
                say: { en: "Read the riddle. Does it match the picture?" }
                show: { object: horse }
                answer: false
                hints: ["Il vole means it flies."]
              - id: l1-s4
                type: audio_choice
                text: "Which animal is it?"
                say: { en: "Listen to the riddle. Which animal is it?" }
                audio: { fr: "Il a une longue queue. Il aime les bananes." }
                options: [{ object: monkey }, { object: lion }, { object: dog }]
                answer: monkey
                hints: ["Who likes bananas?"]
              - id: l1-s5
                type: image_multiple_choice
                option_audio: false
                text: "Which animal is it?\nIl est jaune. Il a deux pattes et deux ailes. Il nage."
                say: { en: "Read the riddle. Which animal is it?" }
                options: [{ object: duck }, { object: fish }, { object: lion }]
                answer: duck
                hints: ["Two legs and two wings, and it swims."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which animal is it?"
                say: { en: "Listen to the riddle. Which animal is it?" }
                audio: { fr: "Il est grand et jaune. Il a quatre pattes." }
                options: [{ object: lion }, { object: zebra }, { object: duck }]
                answer: lion
              - id: l1-n2
                type: image_multiple_choice
                option_audio: false
                text: "Which animal is it?\nIl est petit et noir. Il a quatre pattes et une queue. Il dit miaou."
                say: { en: "Read the riddle. Which animal is it?" }
                options: [{ object: cat }, { object: rabbit }, { object: bird }]
                answer: cat
              - id: l1-n3
                type: true_false
                text: "Does the riddle match the picture?\nIl a une trompe et deux grandes oreilles."
                say: { en: "Read the riddle. Does it match the picture?" }
                show: { object: lion }
                answer: false
              - id: l1-n4
                type: audio_choice
                text: "Which animal is it?"
                say: { en: "Listen to the riddle. Which animal is it?" }
                audio: { fr: "Il est grand. Il a quatre pattes. Il saute, mais il ne vole pas." }
                options: [{ object: horse }, { object: bird }, { object: fish }]
                answer: horse
              - id: l1-n5
                type: image_multiple_choice
                option_audio: false
                text: "Which animal is it?\nIl nage. Il est très grand. Il n'a pas de pattes."
                say: { en: "Read the riddle. Which animal is it?" }
                options: [{ object: shark }, { object: crab }, { object: duck }]
                answer: shark

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which animal is it?"
            say: { en: "Listen to the riddle. Which animal is it?" }
            audio: { fr: "Il est gris et très grand. Il a une trompe." }
            options: [{ object: elephant }, { object: horse }, { object: shark }]
            answer: elephant
          - id: l1-c2
            type: image_multiple_choice
            option_audio: false
            text: "Which animal is it?\nIl a deux pattes et deux ailes. Il est petit. Il vole."
            say: { en: "Read the riddle. Which animal is it?" }
            options: [{ object: bird }, { object: fish }, { object: dog }]
            answer: bird
          - id: l1-c3
            type: true_false
            text: "Does the riddle match the picture?\nIl est noir et blanc. Il a quatre pattes."
            say: { en: "Read the riddle. Does it match the picture?" }
            show: { object: zebra }
            answer: true
          - id: l1-c4
            type: image_multiple_choice
            option_audio: false
            text: "Which animal is it?\nIl est rouge. Il a dix pattes. Il nage."
            say: { en: "Read the riddle. Which animal is it?" }
            options: [{ object: fish }, { object: crab }, { object: duck }]
            answer: crab
          - id: l1-c5
            type: audio_choice
            text: "Which animal is it?"
            say: { en: "Listen to the riddle. Which animal is it?" }
            audio: { fr: "Il est blanc. Il a quatre pattes. Il dit bêê." }
            options: [{ object: cow }, { object: horse }, { object: sheep }]
            answer: sheep
          - id: l1-c6
            type: true_false
            text: "Does the riddle match the picture?\nIl n'a pas de pattes. Il nage."
            say: { en: "Read the riddle. Does it match the picture?" }
            show: { object: fish }
            answer: true

  - n: 2
    title: { de: "Il est ... Elle a ...", en: "Il est ... Elle a ..." }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which animal is it?"
            say: { en: "Listen to the riddle. Which animal is it?" }
            audio: { fr: "Il est long et vert. Il n'a pas de pattes." }
            options: [{ object: snake }, { object: crocodile }, { object: lion }]
            answer: snake
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            option_audio: false
            text: "Which animal is it?\nIl est petit. Il a deux grandes oreilles."
            say: { en: "Read the riddle. Which animal is it?" }
            options: [{ object: rabbit }, { object: zebra }, { object: snake }]
            answer: rabbit
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Il est grand. Il a quatre pattes."
            say: { en: "Now you describe. Il est says what it is like. Il a says what it has. Never il est quatre pattes.", fr: "Il est grand. Il a quatre pattes." }
          - text: "La girafe ? Elle est grande. Elle a un long cou."
            say: { en: "For a la word, like la girafe, say elle, not il. The describing word adds an e: grande, petite, verte.", fr: "La girafe ? Elle est grande. Elle a un long cou." }
            show: { object: giraffe }
          - text: "Voici Léa. Elle a neuf ans. Elle est petite. Elle a un chat."
            say: { en: "People work the same way. Léa is a girl, so elle. Her age uses a: elle a neuf ans. A boy is il: il a dix ans.", fr: "Voici Léa. Elle a neuf ans. Elle est petite. Elle a un chat." }
            show: { object: girl }
          - text: "Mon chien est petit et marron. Il a une longue queue."
            say: { en: "To describe your pet, start with mon: mon chien est petit et marron. Il a une longue queue.", fr: "Mon chien est petit et marron. Il a une longue queue." }
            show: { object: dog }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "The zebra is black and white. Finish the sentence."
                say: { en: "The zebra is black and white. Finish the sentence." }
                show: { object: zebra }
                frame: "Le zèbre ? Il _ noir et blanc."
                options: ["est", "a", "ai"]
                answer: ["est"]
                option_audio: false
                feedback:
                  "a": "Il a tells what it has. Black and white is what it is like: il est."
                hints:
                  - "Is this what it is like, or what it has?"
                  - "Colours tell what it is like."
                  - "Il est noir et blanc."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "The lion has four legs. Finish the sentence."
                say: { en: "The lion has four legs. Finish the sentence." }
                show: { object: lion }
                frame: "Le lion ? Il _ quatre pattes."
                options: ["a", "est", "ai"]
                answer: ["a"]
                option_audio: false
                feedback:
                  "est": "Legs are something it has, so il a."
                hints:
                  - "Is this what it is like, or what it has?"
                  - "Legs are something it has."
                  - "Il a quatre pattes."
              - id: l2-f3
                type: multiple_choice
                text: "La girafe. Which sentence fits?"
                say: { en: "Look at the giraffe. Which sentence fits?" }
                show: { object: giraffe }
                options: ["Elle a un long cou.", "Il a un long cou.", "Elle est un long cou."]
                answer: "Elle a un long cou."
                option_audio: false
                feedback:
                  "Il a un long cou.": "Girafe is a la word, so you say elle."
                hints:
                  - "La girafe is a la word."
                  - "La words take elle, and a neck is something it has."
                  - "Elle a un long cou."
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Build the sentence: it is small and grey."
                say: { en: "Build the sentence: it is small and grey." }
                options: ["gris.", "Il", "petit", "est", "et"]
                slot_count: 5
                answer: ["Il", "est", "petit", "et", "gris."]
                hints:
                  - "Start with Il est."
                  - "Then small, then and, then the colour."
                  - "Il est petit et gris."
              - id: l2-f5
                type: speak
                say: { en: "Describe the elephant in French: it is big and grey.", fr: "Il est grand et gris." }
                show: { object: elephant }
                expected_text: "Il est grand et gris."
                hints:
                  - "Start with il est."
                  - "Big is grand, grey is gris."
                  - "Say it with me: il est grand et gris."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "The mouse is small. Finish the sentence."
                say: { en: "The mouse is small. Finish the sentence." }
                show: { object: mouse }
                frame: "La souris ? Elle _ petite."
                options: ["est", "a", "ai"]
                answer: ["est"]
                option_audio: false
                hints: ["Small is what it is like."]
              - id: l2-s2
                type: multiple_choice
                text: "Max is a boy. He is nine. Which sentence fits?"
                say: { en: "Max is a boy. He is nine. Which sentence fits?" }
                options: ["Il a neuf ans.", "Il est neuf ans.", "Elle a neuf ans."]
                answer: "Il a neuf ans."
                option_audio: false
                hints: ["Age uses a in French."]
              - id: l2-s3
                type: audio_choice
                text: "Which pet is it?"
                say: { en: "Listen. Which pet is it?" }
                audio: { fr: "Voici mon animal. Il est petit et noir. Il a une longue queue. Il dit miaou.", speaker: female }
                options: [{ object: cat }, { object: rabbit }, { object: fish }]
                answer: cat
                hints: ["Listen for the sound at the end."]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Build the sentence: she has got a dog."
                say: { en: "Build the sentence: she has got a dog." }
                options: ["un chien.", "a", "Elle"]
                slot_count: 3
                answer: ["Elle", "a", "un chien."]
                hints: ["Start with Elle."]
              - id: l2-s5
                type: speak
                say: { en: "Describe Léa in French: she is small.", fr: "Elle est petite." }
                show: { object: girl }
                expected_text: "Elle est petite."
                hints: ["Say it with me: elle est petite."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "The lion is big and yellow. Finish the sentence."
                say: { en: "The lion is big and yellow. Finish the sentence." }
                show: { object: lion }
                frame: "Le lion ? Il _ grand et jaune."
                options: ["est", "a", "ai"]
                answer: ["est"]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "La vache. Which sentence fits?"
                say: { en: "Look at the cow. Which sentence fits?" }
                show: { object: cow }
                options: ["Elle a quatre pattes.", "Il a quatre pattes.", "Elle est quatre pattes."]
                answer: "Elle a quatre pattes."
                option_audio: false
              - id: l2-n3
                type: true_false
                text: "Tom is a boy. Is the sentence right?\nVoici Tom. Elle est grand."
                say: { en: "Tom is a boy. Read the sentence. Is it right?" }
                show: { object: boy }
                answer: false
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Build the sentence: my dog is big."
                say: { en: "Build the sentence: my dog is big." }
                options: ["est", "Mon chien", "grand."]
                slot_count: 3
                answer: ["Mon chien", "est", "grand."]
              - id: l2-n5
                type: fill_in_blank
                text: "Describe the crocodile. Fill both gaps."
                say: { en: "Describe the crocodile. Fill both gaps." }
                show: { object: crocodile }
                frame: "Le crocodile ? _ est long. _ a une grande bouche."
                options: ["Il", "Elle", "est"]
                answer: ["Il", "Il"]
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: understand
            type: audio_choice
            text: "Which animal is it?"
            say: { en: "Listen to the riddle. Which animal is it?" }
            audio: { fr: "Il est très grand et gris. Il n'a pas de pattes. Il nage." }
            options: [{ object: shark }, { object: elephant }, { object: crab }]
            answer: shark
          - id: l2-c2
            part: est-a
            type: fill_in_blank
            text: "The frog is green. Finish the sentence."
            say: { en: "The frog is green. Finish the sentence." }
            show: { object: frog }
            frame: "La grenouille ? Elle _ verte."
            options: ["est", "a", "ai"]
            answer: ["est"]
            option_audio: false
          - id: l2-c3
            part: il-elle
            type: multiple_choice
            text: "Ben is a boy. He has got a rabbit. Which sentence fits?"
            say: { en: "Ben is a boy. He has got a rabbit. Which sentence fits?" }
            options: ["Il a un lapin.", "Il est un lapin.", "Elle a un lapin."]
            answer: "Il a un lapin."
            option_audio: false
          - id: l2-c4
            part: build
            type: ordering
            option_audio: false
            text: "Build the sentence: my cat is small and black."
            say: { en: "Build the sentence: my cat is small and black." }
            options: ["noir.", "Mon chat", "est", "petit", "et"]
            slot_count: 5
            answer: ["Mon chat", "est", "petit", "et", "noir."]
          - id: l2-c5
            part: il-elle
            type: multiple_choice
            text: "La girafe. Which description fits?"
            say: { en: "Look at the giraffe. Which description fits?" }
            show: { object: giraffe }
            options: ["Elle est grande. Elle a un long cou.", "Il est grand. Il a un long cou.", "Elle a grande. Elle est un long cou."]
            answer: "Elle est grande. Elle a un long cou."
            option_audio: false
          - id: l2-c6
            part: understand
            type: audio_choice
            text: "Which animal is it?"
            say: { en: "Listen to the riddle. Which animal is it?" }
            audio: { fr: "Elle est petite et verte. Elle a quatre pattes. Elle saute et elle nage." }
            options: [{ object: crocodile }, { object: frog }, { object: snake }]
            answer: frog
          - id: l2-c7
            part: understand
            type: image_multiple_choice
            option_audio: false
            text: "Which animal is it?\nIl est rose. Il a quatre pattes et une petite queue."
            say: { en: "Read the riddle. Which animal is it?" }
            options: [{ object: sheep }, { object: pig }, { object: horse }]
            answer: pig
          - id: l2-c8
            part: understand
            type: true_false
            text: "Does the description match the picture?\nElle est très grande. Elle a un long cou."
            say: { en: "Read the description. Does it match the picture?" }
            show: { object: cow }
            answer: false
          - id: l2-c9
            part: understand
            type: audio_choice
            text: "What is Hugo's dog like?"
            say: { en: "Listen. What is Hugo's dog like?" }
            audio: { fr: "Mon chien est grand et noir. Il a une petite queue.", speaker: male }
            options: ["big and black, with a small tail", "small and black, with a long tail", "big and white, with a small tail"]
            answer: "big and black, with a small tail"
          - id: l2-c10
            part: est-a
            type: true_false
            text: "Is the sentence right?\nLe cheval ? Il est quatre pattes."
            say: { en: "Read the sentence. Is it right?" }
            show: { object: horse }
            answer: false
          - id: l2-c11
            part: est-a
            type: fill_in_blank
            text: "The rabbit is white and has two big ears. Fill both gaps."
            say: { en: "The rabbit is white and has two big ears. Fill both gaps." }
