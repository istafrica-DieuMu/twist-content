# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-short-dialogues
skill: fl.listening.short-dialogues
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Kurze Gespräche verstehen (Französisch)
  en: Understanding short conversations in French
summary: >
  French learning year 2 starts by listening to short, slow conversations
  on familiar topics: meeting someone, pets, food, how someone feels.
  Lesson 1 finds what a conversation is about; lesson 2 picks out one
  detail (a name, an age, an animal, a colour) and ends with the skill
  check. Conversations are in French; questions and answers are in English
  or pictures, so the task tests listening, not reading French.
metadata:
  year: ly-2
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.listening.classroom-phrases]
  vocabulary: { fr: [bonjour, je m'appelle, j'ai ... ans, un chien, un chat, un lapin, j'ai faim, une pomme, content, triste, rouge, bleu, vert, jaune] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: every-word
      what: Gives up because not every word is understood
      addressed: Learn says you do not need every word; listen for words you know
    - id: first-word
      what: Picks the first familiar word heard instead of the answer
      addressed: lesson 2 sets a wrong word early ("C'est rouge ? Non, c'est bleu."); feedback says to listen to the end
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Worum geht es?", en: "What is it about?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "le lion" }
            options: [{ object: lion }, { object: elephant }, { object: giraffe }]
            answer: lion
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "la banane" }
            options: [{ object: apple }, { object: banana }, { object: orange }]
            answer: banana
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { en: "Now you will hear a short conversation. You do not need to understand every word. Listen for words you know.", fr: "Bonjour ! Je m'appelle Hugo. Et toi ? Je m'appelle Léa." }
          - text: "Hugo, Léa"
            say: { en: "Did you hear the names? Hugo and Léa. They say hello and their names. That is what it is about: meeting each other." }
          - say: { en: "Another one. Listen for an animal.", fr: "Tu as un animal ? Oui, j'ai un chien." }
            show: { object: dog }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { en: "Listen. What is it about?" }
                audio: { fr: "J'ai faim. Je voudrais une pomme, s'il te plaît. Voilà !" }
                options: ["food", "animals", "colours"]
                answer: "food"
                hints:
                  - "Listen again. Which word do you know?"
                  - "Une pomme is an apple."
                  - "It is about food."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { en: "Listen. Which pet does the child have?" }
                audio: { fr: "Tu as un animal ? Oui, j'ai un chat." }
                options: [{ object: dog }, { object: cat }, { object: fish }]
                answer: cat
                hints:
                  - "Listen for the animal at the end."
                  - "Un chat."
                  - "Un chat is a cat."
              - id: l1-f3
                type: audio_choice
                say: { en: "Listen. What is it about?" }
                audio: { fr: "Bonjour ! Ça va ? Ça va bien, merci." }
                options: ["two people say hello", "two people eat", "two people paint"]
                answer: "two people say hello"
                hints:
                  - "You know bonjour."
                  - "Ça va means how are you."
                  - "They say hello."
              - id: l1-f4
                type: true_false
                say: { en: "Listen. Is it about an animal?", fr: "Ma couleur préférée, c'est le bleu. Et toi ? Moi, j'aime le rouge." }
                answer: false
                hints:
                  - "Did you hear bleu and rouge?"
                  - "Those are colours."
                  - "No, it is about colours."
              - id: l1-f5
                type: audio_choice
                say: { en: "Listen. How does the child feel?" }
                audio: { fr: "Ça va ? Non, je suis triste. J'ai perdu mon ballon." }
                options: ["happy", "sad", "tired"]
                answer: "sad"
                hints:
                  - "Listen for the feeling."
                  - "Triste."
                  - "Triste means sad."
              - id: l1-f6
                type: audio_choice
                say: { en: "Listen. What is the girl called?" }
                audio: { turns: [{ fr: "Salut ! Je m'appelle Tom. Et toi ?", speaker: male }, { fr: "Je m'appelle Chloé.", speaker: female }] }
                options: ["Tom", "Chloé", "Léa"]
                answer: "Chloé"
                feedback:
                  "Tom": "Tom is the boy. He asks, and the girl answers: je m'appelle Chloé."
                hints:
                  - "Who says je m'appelle second?"
                  - "Listen to the end."
                  - "Chloé."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { en: "Listen. What is it about?" }
                audio: { fr: "Regarde ! Un éléphant ! Et là, une girafe !" }
                options: ["animals", "food", "school"]
                answer: "animals"
                hints: ["Éléphant and girafe sound like English."]
              - id: l1-s2
                type: audio_choice
                say: { en: "Listen. What does the child want?" }
                audio: { fr: "Je voudrais une banane, s'il te plaît. Oui, voilà." }
                options: [{ object: apple }, { object: banana }, { object: strawberry }]
                answer: banana
                hints: ["Listen for the food."]
              - id: l1-s3
                type: true_false
                say: { en: "Listen. Is someone saying who they are?", fr: "Bonjour ! Je m'appelle Lucas. J'ai neuf ans." }
                answer: true
                hints: ["Je m'appelle Lucas."]
              - id: l1-s4
                type: audio_choice
                say: { en: "Listen. How does the child feel?" }
                audio: { fr: "Ça va ? Oui ! Je suis content. C'est mon anniversaire !" }
                options: ["happy", "sad", "ill"]
                answer: "happy"
                hints: ["Content means happy."]
              - id: l1-s5
                type: audio_choice
                say: { en: "Listen. Which animal is it?" }
                audio: { fr: "Qu'est-ce que c'est ? C'est une grenouille. Elle est verte." }
                options: [{ object: frog }, { object: fish }, { object: duck }]
                answer: frog
                hints: ["Une grenouille is green."]
              - id: l1-s6
                type: audio_choice
                say: { en: "Listen. What is it about?" }
                audio: { fr: "Ton sac est de quelle couleur ? Il est jaune. Et le tien ? Le mien est vert." }
                options: ["colours", "numbers", "animals"]
                answer: "colours"
                hints: ["Jaune, vert."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { en: "Listen. What is it about?" }
                audio: { fr: "J'ai soif. Je voudrais de l'eau, s'il te plaît. Bien sûr." }
                options: ["something to drink", "colours", "animals"]
                answer: "something to drink"
              - id: l1-n2
                type: audio_choice
                say: { en: "Listen. Which pet does the child have?" }
                audio: { fr: "Tu as un animal ? Oui, j'ai un lapin. Il est blanc." }
                options: [{ object: rabbit }, { object: mouse }, { object: dog }]
                answer: rabbit
              - id: l1-n3
                type: true_false
                say: { en: "Listen. Is it about food?", fr: "Tu aimes la pizza ? Oui, j'adore la pizza !" }
                answer: true
              - id: l1-n4
                type: audio_choice
                say: { en: "Listen. What is the boy called?" }
                audio: { turns: [{ fr: "Bonjour, comment tu t'appelles ?", speaker: female }, { fr: "Je m'appelle Nathan. Et toi ?", speaker: male }, { fr: "Moi, c'est Emma.", speaker: female }] }
                options: ["Nathan", "Emma", "Hugo"]
                answer: "Nathan"
              - id: l1-n5
                type: audio_choice
                say: { en: "Listen. How does the child feel?" }
                audio: { fr: "Ça va ? Je suis fatigué. Je veux dormir." }
                options: ["tired", "happy", "hungry"]
                answer: "tired"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { en: "Listen. What is it about?" }
            audio: { fr: "Bonjour ! Ça va ? Oui, ça va bien !" }
            options: ["two people say hello", "two people play football", "two people eat"]
            answer: "two people say hello"
          - id: l1-c2
            type: audio_choice
            say: { en: "Listen. Which pet does the child have?" }
            audio: { fr: "J'ai un chien. Il est marron." }
            options: [{ object: cat }, { object: dog }, { object: rabbit }]
            answer: dog
          - id: l1-c3
            type: audio_choice
            say: { en: "Listen. What does the child want?" }
            audio: { fr: "Je voudrais une pomme, s'il te plaît." }
            options: [{ object: apple }, { object: banana }, { object: bread }]
            answer: apple

  - n: 2
    title: { de: Genau hinhören, en: Listening for details }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { en: "Listen. What is it about?" }
            audio: { fr: "Tu as un animal ? Oui, un chat." }
            options: ["animals", "colours", "food"]
            answer: "animals"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { en: "Listen. How does the child feel?" }
            audio: { fr: "Je suis content !", speaker: male }
            options: ["happy", "sad", "tired"]
            answer: "happy"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: { en: "Now listen closely. What colour is the ball? Listen to the end.", fr: "Ton ballon est rouge ? Non, il est bleu." }
          - text: "rouge → bleu"
            say: { en: "First you hear rouge, red. But then: non, il est bleu. The ball is blue. Always listen to the end." }
          - say: { en: "One more. How old is Léo?", fr: "Tu as quel âge, Léo ? J'ai neuf ans." }
            text: "neuf = 9"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { en: "Listen. What colour is the bag?" }
                audio: { fr: "Ton sac est vert ? Non, il est jaune." }
                options: ["green", "yellow", "red"]
                answer: "yellow"
                feedback:
                  "green": "Vert comes first, but then you hear: non, il est jaune."
                hints:
                  - "Listen to the end."
                  - "Non means no."
                  - "Jaune: yellow."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { en: "Listen. How old is Manon?" }
                audio: { fr: "Tu as quel âge, Manon ? J'ai huit ans." }
                options: ["7", "8", "9"]
                answer: "8"
                hints:
                  - "Listen for the number."
                  - "Huit."
                  - "Huit is eight."
              - id: l2-f3
                type: audio_choice
                say: { en: "Listen. Which animal does the child like best?" }
                audio: { fr: "Tu aimes les chats ? Un peu. Mais j'adore les chiens !" }
                options: [{ object: cat }, { object: dog }, { object: mouse }]
                answer: dog
                feedback:
                  cat: "Les chats come first, but un peu means only a little. J'adore les chiens."
                hints:
                  - "Listen for j'adore."
                  - "J'adore les chiens."
                  - "Dogs."
              - id: l2-f4
                type: audio_choice
                say: { en: "Listen. What does the child eat?" }
                audio: { fr: "Qu'est-ce que tu manges ? Un sandwich et une pomme." }
                options: ["a sandwich and an apple", "a banana", "pizza"]
                answer: "a sandwich and an apple"
                hints:
                  - "Two things."
                  - "Un sandwich, une pomme."
                  - "A sandwich and an apple."
              - id: l2-f5
                type: true_false
                say: { en: "Listen. Is the dog called Max?", fr: "Comment s'appelle ton chien ? Il s'appelle Rex." }
                answer: false
                hints:
                  - "Listen for the name."
                  - "Il s'appelle Rex."
                  - "No, he is called Rex."
              - id: l2-f6
                type: audio_choice
                say: { en: "Listen. Which colour does the child like?" }
                audio: { fr: "Ta couleur préférée, c'est le rouge ? Non, c'est le bleu." }
                options: ["red", "blue", "green"]
                answer: "blue"
                hints:
                  - "Listen to the end."
                  - "Non, c'est le bleu."
                  - "Blue."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { en: "Listen. How old is Tom?" }
                audio: { fr: "Tom, tu as quel âge ? J'ai dix ans." }
                options: ["8", "9", "10"]
                answer: "10"
                hints: ["Dix."]
              - id: l2-s2
                type: audio_choice
                say: { en: "Listen. Which animal does the child see?" }
                audio: { fr: "C'est un canard ? Non, c'est une chèvre !" }
                options: [{ object: duck }, { object: goat }, { object: cow }]
                answer: goat
                hints: ["Listen to the end."]
              - id: l2-s3
                type: audio_choice
                say: { en: "Listen. What colour is the hat?" }
                audio: { fr: "J'aime ton chapeau. Merci, il est vert." }
                options: ["green", "blue", "yellow"]
                answer: "green"
                hints: ["Vert."]
              - id: l2-s4
                type: true_false
                say: { en: "Listen. Is Lucas nine?", fr: "Tu as neuf ans, Lucas ? Oui." }
                answer: true
                hints: ["Oui."]
              - id: l2-s5
                type: audio_choice
                say: { en: "Listen. What does the child drink?" }
                audio: { fr: "Du jus d'orange ou du lait ? Du lait, s'il te plaît." }
                options: ["orange juice", "milk", "water"]
                answer: "milk"
                hints: ["Du lait, s'il te plaît."]
              - id: l2-s6
                type: audio_choice
                say: { en: "Listen. What is the cat called?" }
                audio: { fr: "Mon chat s'appelle Minou. Il est noir." }
                options: ["Milo", "Minou", "Max"]
                answer: "Minou"
                hints: ["Listen closely to the name."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { en: "Listen. What colour is the bike?" }
                audio: { fr: "Ton vélo est bleu ? Non, il est rouge." }
                options: ["blue", "red", "yellow"]
                answer: "red"
              - id: l2-n2
                type: audio_choice
                say: { en: "Listen. How old is Emma?" }
                audio: { fr: "Tu as quel âge, Emma ? J'ai sept ans." }
                options: ["7", "8", "11"]
                answer: "7"
              - id: l2-n3
                type: audio_choice
                say: { en: "Listen. Which animal does the child like best?" }
                audio: { fr: "Les poissons, c'est bien. Mais j'adore les chevaux." }
                options: ["fish", "horses", "cats"]
                answer: "horses"
              - id: l2-n4
                type: true_false
                say: { en: "Listen. Does the child eat a banana?", fr: "Tu veux une banane ? Non, merci. Une pomme, s'il te plaît." }
                answer: false
              - id: l2-n5
                type: audio_choice
                say: { en: "Listen. What is the dog called?" }
                audio: { fr: "Voici mon chien. Il s'appelle Filou." }
                options: ["Filou", "Félix", "Max"]
                answer: "Filou"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { en: "Listen. What is it about?" }
            audio: { fr: "Regarde le singe ! Il est drôle. Et le lion est grand !" }
            options: ["animals", "food", "colours"]
            answer: "animals"
          - id: l2-c2
            type: audio_choice
            say: { en: "Listen. What colour is the coat?" }
            audio: { fr: "Ton manteau est noir ? Non, il est bleu." }
            options: ["black", "blue", "red"]
            answer: "blue"
          - id: l2-c3
            type: audio_choice
            say: { en: "Listen. How old is Inès?" }
            audio: { fr: "Inès, tu as quel âge ? J'ai onze ans." }
            options: ["10", "11", "12"]
            answer: "11"
          - id: l2-c4
            type: audio_choice
            say: { en: "Listen. Which pet does the child have?" }
            audio: { fr: "Tu as un animal ? Oui, j'ai un poisson." }
            options: [{ object: fish }, { object: cat }, { object: dog }]
            answer: fish
          - id: l2-c5
            type: audio_choice
            say: { en: "Listen. How does the child feel?" }
            audio: { fr: "Ça va ? Pas très bien. Je suis triste." }
            options: ["happy", "sad", "tired"]
            answer: "sad"
