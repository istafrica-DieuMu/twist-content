# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-short-dialogues
skill: fl.listening.short-dialogues
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Kurze Gespräche verstehen (Französisch)
  en: Understanding short conversations in French
summary: >
  French learning year 2 starts by listening to short, slow conversations
  on familiar topics: meeting someone, pets, food, how someone feels.
  Lesson 1 finds what a conversation is about; lesson 2 picks out one
  detail (a name, an age, an animal, a colour) and ends with the skill
  check. Conversations are in French; questions and answers are in English
  or pictures, so the task tests listening, not reading French.
metadata:
  year: ly-2
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.listening.classroom-phrases]
  vocabulary: { fr: [bonjour, je m'appelle, j'ai ... ans, un chien, un chat, un lapin, j'ai faim, une pomme, content, triste, rouge, bleu, vert, jaune] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: topic, what: { de: "sagen, worum es im Gespräch geht", en: saying what a conversation is about } }
    - { id: who, what: { de: "verstehen, wie jemand heißt und wer was hat", en: understanding what someone is called and who has what } }
    - { id: detail, what: { de: "eine Einzelheit heraushören (Alter, Tier, Essen, Farbe, Gefühl)", en: "picking out a detail (an age, an animal, food, a colour, a feeling)" } }
  misconceptions:
    - id: every-word
      what: Gives up because not every word is understood
      addressed: Learn says you do not need every word; listen for words you know
    - id: first-word
      what: Picks the first familiar word heard instead of the answer
      addressed: lesson 2 sets a wrong word early ("C'est rouge ? Non, c'est bleu."); feedback says to listen to the end
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Worum geht es?", en: "What is it about?" }
    goal:
      de: "Hör einem kurzen Gespräch auf Französisch zu und find heraus, worum es geht, zum Beispiel um ein Haustier."
      en: "Listen to a short talk in French and work out what it is about, like a pet."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "le lion" }
            options: [{ object: lion }, { object: elephant }, { object: giraffe }]
            answer: lion
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "la banane" }
            options: [{ object: apple }, { object: banana }, { object: orange }]
            answer: banana
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { en: "Now you will hear a short conversation. You do not need to understand every word. Listen for words you know.", fr: "Bonjour ! Je m'appelle Hugo. Et toi ? Je m'appelle Léa." }
          - text: "Hugo, Léa"
            say: { en: "Did you hear the names? Hugo and Léa. They say hello and their names. That is what it is about: meeting each other." }
          - say: { en: "Another one. Listen for an animal.", fr: "Tu as un animal ? Oui, j'ai un chien." }
            show: { object: dog }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What is it about?"
                say: { en: "Listen. What is it about?" }
                audio: { turns: [{ fr: "J'ai faim. Je voudrais une pomme, s'il te plaît.", speaker: male }, { fr: "Voilà !", speaker: female }] }
                options: ["food", "animals", "colours"]
                answer: "food"
                hints:
                  - "Listen again. Which word do you know?"
                  - "Une pomme is an apple."
                  - "It is about food."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which pet does the child have?"
                say: { en: "Listen. Which pet does the child have?" }
                audio: { turns: [{ fr: "Tu as un animal ?", speaker: male }, { fr: "Oui, j'ai un chat.", speaker: female }] }
                options: [{ object: dog }, { object: cat }, { object: fish }]
                answer: cat
                hints:
                  - "Listen for the animal at the end."
                  - "Un chat."
                  - "Un chat is a cat."
              - id: l1-f3
                type: audio_choice
                text: "What is it about?"
                say: { en: "Listen. What is it about?" }
                audio: { turns: [{ fr: "Bonjour ! Ça va ?", speaker: female }, { fr: "Ça va bien, merci.", speaker: male }] }
                options: ["two people say hello", "two people eat", "two people paint"]
                answer: "two people say hello"
                hints:
                  - "You know bonjour."
                  - "Ça va means how are you."
                  - "They say hello."
              - id: l1-f4
                type: true_false
                text: "Is it about an animal?"
                say: { en: "Listen. Is it about an animal?" }
                audio: { turns: [{ fr: "Ma couleur préférée, c'est le bleu. Et toi ?", speaker: female }, { fr: "Moi, j'aime le rouge.", speaker: male }] }
                answer: false
                hints:
                  - "Did you hear bleu and rouge?"
                  - "Those are colours."
                  - "No, it is about colours."
              - id: l1-f5
                type: audio_choice
                text: "How does the child feel?"
                say: { en: "Listen. How does the child feel?" }
                audio: { turns: [{ fr: "Ça va ?", speaker: female }, { fr: "Non, je suis triste. J'ai perdu mon ballon.", speaker: male }] }
                options: ["happy", "sad", "tired"]
                answer: "sad"
                hints:
                  - "Listen for the feeling."
                  - "Triste."
                  - "Triste means sad."
              - id: l1-f6
                type: audio_choice
                text: "What is the girl called?"
                say: { en: "Listen. What is the girl called?" }
                audio: { turns: [{ fr: "Salut ! Je m'appelle Tom. Et toi ?", speaker: male }, { fr: "Je m'appelle Chloé.", speaker: female }] }
                options: ["Tom", "Chloé", "Léa"]
                answer: "Chloé"
                feedback:
                  "Tom": "Tom is the boy. He asks, and the girl answers: je m'appelle Chloé."
                hints:
                  - "Who says je m'appelle second?"
                  - "Listen to the end."
                  - "Chloé."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What is it about?"
                say: { en: "Listen. What is it about?" }
                audio: { turns: [{ fr: "Regarde ! Un éléphant !", speaker: male }, { fr: "Et là, une girafe !", speaker: female }] }
                options: ["animals", "food", "school"]
                answer: "animals"
                hints: ["Éléphant and girafe sound like English."]
              - id: l1-s2
                type: audio_choice
                text: "What does the child want?"
                say: { en: "Listen. What does the child want?" }
                audio: { turns: [{ fr: "Je voudrais une banane, s'il te plaît.", speaker: female }, { fr: "Oui, voilà.", speaker: male }] }
                options: [{ object: apple }, { object: banana }, { object: strawberry }]
                answer: banana
                hints: ["Listen for the food."]
              - id: l1-s3
                type: true_false
                text: "Is someone saying who they are?"
                say: { en: "Listen. Is someone saying who they are?" }
                audio: { fr: "Bonjour ! Je m'appelle Lucas. J'ai neuf ans.", speaker: male }
                answer: true
                hints: ["Je m'appelle Lucas."]
              - id: l1-s4
                type: audio_choice
                text: "How does the child feel?"
                say: { en: "Listen. How does the child feel?" }
                audio: { turns: [{ fr: "Ça va ?", speaker: female }, { fr: "Oui ! Je suis content. C'est mon anniversaire !", speaker: male }] }
                options: ["happy", "sad", "ill"]
                answer: "happy"
                hints: ["Content means happy."]
              - id: l1-s5
                type: audio_choice
                text: "Which animal is it?"
                say: { en: "Listen. Which animal is it?" }
                audio: { turns: [{ fr: "Qu'est-ce que c'est ?", speaker: male }, { fr: "C'est une grenouille. Elle est verte.", speaker: female }] }
                options: [{ object: frog }, { object: fish }, { object: duck }]
                answer: frog
                hints: ["Une grenouille is green."]
              - id: l1-s6
                type: audio_choice
                text: "What is it about?"
                say: { en: "Listen. What is it about?" }
                audio: { turns: [{ fr: "Ton sac est de quelle couleur ?", speaker: female }, { fr: "Il est jaune. Et le tien ?", speaker: male }, { fr: "Le mien est vert.", speaker: female }] }
                options: ["colours", "numbers", "animals"]
                answer: "colours"
                hints: ["Jaune, vert."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What is it about?"
                say: { en: "Listen. What is it about?" }
                audio: { turns: [{ fr: "J'ai soif. Je voudrais de l'eau, s'il te plaît.", speaker: male }, { fr: "Bien sûr.", speaker: female }] }
                options: ["something to drink", "colours", "animals"]
                answer: "something to drink"
              - id: l1-n2
                type: audio_choice
                text: "Which pet does the child have?"
                say: { en: "Listen. Which pet does the child have?" }
                audio: { turns: [{ fr: "Tu as un animal ?", speaker: female }, { fr: "Oui, j'ai un lapin. Il est blanc.", speaker: male }] }
                options: [{ object: rabbit }, { object: mouse }, { object: dog }]
                answer: rabbit
              - id: l1-n3
                type: true_false
                text: "Is it about food?"
                say: { en: "Listen. Is it about food?" }
                audio: { turns: [{ fr: "Tu aimes la pizza ?", speaker: male }, { fr: "Oui, j'adore la pizza !", speaker: female }] }
                answer: true
              - id: l1-n4
                type: audio_choice
                text: "What is the boy called?"
                say: { en: "Listen. What is the boy called?" }
                audio: { turns: [{ fr: "Bonjour, comment tu t'appelles ?", speaker: female }, { fr: "Je m'appelle Nathan. Et toi ?", speaker: male }, { fr: "Moi, c'est Emma.", speaker: female }] }
                options: ["Nathan", "Emma", "Hugo"]
                answer: "Nathan"
              - id: l1-n5
                type: audio_choice
                text: "How does the child feel?"
                say: { en: "Listen. How does the child feel?" }
                audio: { turns: [{ fr: "Ça va ?", speaker: female }, { fr: "Je suis fatigué. Je veux dormir.", speaker: male }] }
                options: ["tired", "happy", "hungry"]
                answer: "tired"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "What is it about?"
            say: { en: "Listen. What is it about?" }
            audio: { turns: [{ fr: "Tu aimes le rouge ?", speaker: male }, { fr: "Non, j'aime le vert.", speaker: female }] }
            options: ["food", "colours", "two people say hello"]
            answer: "colours"
          - id: l1-c2
            type: audio_choice
            text: "Which pet does the child have?"
            say: { en: "Listen. Which pet does the child have?" }
            audio: { fr: "J'ai un chien. Il est marron.", speaker: female }
            options: [{ object: cat }, { object: dog }, { object: rabbit }]
            answer: dog
          - id: l1-c3
            type: audio_choice
            text: "What does the child want?"
            say: { en: "Listen. What does the child want?" }
            audio: { turns: [{ fr: "J'ai faim !", speaker: male }, { fr: "Tu veux du pain ?", speaker: female }, { fr: "Oui, merci !", speaker: male }] }
            options: [{ object: apple }, { object: banana }, { object: bread }]
            answer: bread
          - id: l1-c4
            type: audio_choice
            text: "What is it about?"
            say: { en: "Listen. What is it about?" }
            audio: { turns: [{ fr: "Tu aimes les bananes ?", speaker: male }, { fr: "Oui, et j'aime les pommes !", speaker: female }] }
            options: ["animals", "food", "colours"]
            answer: "food"
          - id: l1-c5
            type: true_false
            text: "Is it about animals?"
            say: { en: "Listen. Is it about animals?" }
            audio: { turns: [{ fr: "Regarde ! Un lion !", speaker: female }, { fr: "Oh, il est grand !", speaker: male }] }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "How does the child feel?"
            say: { en: "Listen. How does the child feel?" }
            audio: { turns: [{ fr: "Tu es triste ?", speaker: female }, { fr: "Non, je suis content !", speaker: male }] }
            options: ["sad", "tired", "happy"]
            answer: "happy"

  - n: 2
    title: { de: Genau hinhören, en: Listening for details }
    goal:
      de: "Hör bis zum Ende genau zu und find eine Kleinigkeit heraus, zum Beispiel welche Farbe der Ball hat."
      en: "Listen right to the end and pick out one detail, like the colour of the ball."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "What is it about?"
            say: { en: "Listen. What is it about?" }
            audio: { turns: [{ fr: "Tu as un animal ?", speaker: male }, { fr: "Oui, un chat.", speaker: female }] }
            options: ["animals", "colours", "food"]
            answer: "animals"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "How does the child feel?"
            say: { en: "Listen. How does the child feel?" }
            audio: { fr: "Je suis content !", speaker: male }
            options: ["happy", "sad", "tired"]
            answer: "happy"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: { en: "Now listen closely. What colour is the ball? Listen to the end.", fr: "Ton ballon est rouge ? Non, il est bleu." }
          - text: "rouge → bleu"
            say: { en: "First you hear rouge, red. But then: non, il est bleu. The ball is blue. Always listen to the end." }
          - say: { en: "One more. How old is Léo?", fr: "Tu as quel âge, Léo ? J'ai neuf ans." }
            text: "neuf = 9"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "What colour is the bag?"
                say: { en: "Listen. What colour is the bag?" }
                audio: { turns: [{ fr: "Ton sac est vert ?", speaker: male }, { fr: "Non, il est jaune.", speaker: female }] }
                options: ["green", "yellow", "red"]
                answer: "yellow"
                feedback:
                  "green": "Vert comes first, but then you hear: non, il est jaune."
                hints:
                  - "Listen to the end."
                  - "Non means no."
                  - "Jaune: yellow."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "How old is Manon?"
                say: { en: "Listen. How old is Manon?" }
                audio: { turns: [{ fr: "Tu as quel âge, Manon ?", speaker: male }, { fr: "J'ai huit ans.", speaker: female }] }
                options: ["7", "8", "9"]
                answer: "8"
                hints:
                  - "Listen for the number."
                  - "Huit."
                  - "Huit is eight."
              - id: l2-f3
                type: audio_choice
                text: "Which animal does the child like best?"
                say: { en: "Listen. Which animal does the child like best?" }
                audio: { turns: [{ fr: "Tu aimes les chats ?", speaker: female }, { fr: "Un peu. Mais j'adore les chiens !", speaker: male }] }
                options: [{ object: cat }, { object: dog }, { object: mouse }]
                answer: dog
                feedback:
                  cat: "Les chats come first, but un peu means only a little. J'adore les chiens."
                hints:
                  - "Listen for j'adore."
                  - "J'adore les chiens."
                  - "Dogs."
              - id: l2-f4
                type: audio_choice
                text: "What does the child eat?"
                say: { en: "Listen. What does the child eat?" }
                audio: { turns: [{ fr: "Qu'est-ce que tu manges ?", speaker: male }, { fr: "Un sandwich et une pomme.", speaker: female }] }
                options: ["a sandwich and an apple", "a banana", "pizza"]
                answer: "a sandwich and an apple"
                hints:
                  - "Two things."
                  - "Un sandwich, une pomme."
                  - "A sandwich and an apple."
              - id: l2-f5
                type: true_false
                text: "Is the dog called Max?"
                say: { en: "Listen. Is the dog called Max?" }
                audio: { turns: [{ fr: "Comment s'appelle ton chien ?", speaker: female }, { fr: "Il s'appelle Rex.", speaker: male }] }
                answer: false
                hints:
                  - "Listen for the name."
                  - "Il s'appelle Rex."
                  - "No, he is called Rex."
              - id: l2-f6
                type: audio_choice
                text: "Which colour does the child like?"
                say: { en: "Listen. Which colour does the child like?" }
                audio: { turns: [{ fr: "Ta couleur préférée, c'est le rouge ?", speaker: male }, { fr: "Non, c'est le bleu.", speaker: female }] }
                options: ["red", "blue", "green"]
                answer: "blue"
                hints:
                  - "Listen to the end."
                  - "Non, c'est le bleu."
                  - "Blue."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "How old is Tom?"
                say: { en: "Listen. How old is Tom?" }
                audio: { turns: [{ fr: "Tom, tu as quel âge ?", speaker: female }, { fr: "J'ai dix ans.", speaker: male }] }
                options: ["8", "9", "10"]
                answer: "10"
                hints: ["Dix."]
              - id: l2-s2
                type: audio_choice
                text: "Which animal does the child see?"
                say: { en: "Listen. Which animal does the child see?" }
                audio: { turns: [{ fr: "C'est un canard ?", speaker: male }, { fr: "Non, c'est une chèvre !", speaker: female }] }
                options: [{ object: duck }, { object: goat }, { object: cow }]
                answer: goat
                hints: ["Listen to the end."]
              - id: l2-s3
                type: audio_choice
                text: "What colour is the hat?"
                say: { en: "Listen. What colour is the hat?" }
                audio: { turns: [{ fr: "J'aime ton chapeau.", speaker: female }, { fr: "Merci, il est vert.", speaker: male }] }
                options: ["green", "blue", "yellow"]
                answer: "green"
                hints: ["Vert."]
              - id: l2-s4
                type: true_false
                text: "Is Lucas nine?"
                say: { en: "Listen. Is Lucas nine?" }
                audio: { turns: [{ fr: "Tu as neuf ans, Lucas ?", speaker: female }, { fr: "Oui.", speaker: male }] }
                answer: true
                hints: ["Oui."]
              - id: l2-s5
                type: audio_choice
                text: "What does the child drink?"
                say: { en: "Listen. What does the child drink?" }
                audio: { turns: [{ fr: "Du jus d'orange ou du lait ?", speaker: male }, { fr: "Du lait, s'il te plaît.", speaker: female }] }
                options: ["orange juice", "milk", "water"]
                answer: "milk"
                hints: ["Du lait, s'il te plaît."]
              - id: l2-s6
                type: audio_choice
                text: "What is the cat called?"
                say: { en: "Listen. What is the cat called?" }
                audio: { fr: "Mon chat s'appelle Minou. Il est noir.", speaker: female }
                options: ["Milo", "Minou", "Max"]
                answer: "Minou"
                hints: ["Listen closely to the name."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "What colour is the bike?"
                say: { en: "Listen. What colour is the bike?" }
                audio: { turns: [{ fr: "Ton vélo est bleu ?", speaker: female }, { fr: "Non, il est rouge.", speaker: male }] }
                options: ["blue", "red", "yellow"]
                answer: "red"
              - id: l2-n2
                type: audio_choice
                text: "How old is Emma?"
                say: { en: "Listen. How old is Emma?" }
                audio: { turns: [{ fr: "Tu as quel âge, Emma ?", speaker: male }, { fr: "J'ai sept ans.", speaker: female }] }
                options: ["7", "8", "11"]
                answer: "7"
              - id: l2-n3
                type: audio_choice
                text: "Which animal does the child like best?"
                say: { en: "Listen. Which animal does the child like best?" }
                audio: { fr: "Les poissons, c'est bien. Mais j'adore les chevaux.", speaker: male }
                options: ["fish", "horses", "cats"]
                answer: "horses"
              - id: l2-n4
                type: true_false
                text: "Does the child eat a banana?"
                say: { en: "Listen. Does the child eat a banana?" }
                audio: { turns: [{ fr: "Tu veux une banane ?", speaker: female }, { fr: "Non, merci. Une pomme, s'il te plaît.", speaker: male }] }
                answer: false
              - id: l2-n5
                type: audio_choice
                text: "What is the dog called?"
                say: { en: "Listen. What is the dog called?" }
                audio: { fr: "Voici mon chien. Il s'appelle Filou.", speaker: male }
                options: ["Filou", "Félix", "Max"]
                answer: "Filou"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: topic
            type: audio_choice
            text: "What is it about?"
            say: { en: "Listen. What is it about?" }
            audio: { turns: [{ fr: "Regarde le singe ! Il est drôle.", speaker: female }, { fr: "Et le lion est grand !", speaker: male }] }
            options: ["animals", "food", "colours"]
            answer: "animals"
          - id: l2-c2
            part: detail
            type: audio_choice
            text: "What colour is the coat?"
            say: { en: "Listen. What colour is the coat?" }
            audio: { turns: [{ fr: "Ton manteau est noir ?", speaker: male }, { fr: "Non, il est bleu.", speaker: female }] }
            options: ["black", "blue", "red"]
            answer: "blue"
          - id: l2-c3
            part: detail
            type: audio_choice
            text: "How old is Inès?"
            say: { en: "Listen. How old is Inès?" }
            audio: { turns: [{ fr: "Inès, tu as quel âge ?", speaker: male }, { fr: "J'ai onze ans.", speaker: female }] }
            options: ["10", "11", "12"]
            answer: "11"
          - id: l2-c4
            part: detail
            type: audio_choice
            text: "Which pet does the child have?"
            say: { en: "Listen. Which pet does the child have?" }
            audio: { turns: [{ fr: "Tu as un animal ?", speaker: female }, { fr: "Oui, j'ai un poisson.", speaker: male }] }
            options: [{ object: fish }, { object: cat }, { object: dog }]
            answer: fish
          - id: l2-c5
            part: detail
            type: audio_choice
            text: "How does the child feel?"
            say: { en: "Listen. How does the child feel?" }
            audio: { turns: [{ fr: "Ça va ?", speaker: male }, { fr: "Pas très bien. Je suis triste.", speaker: female }] }
            options: ["happy", "sad", "tired"]
            answer: "sad"
          - id: l2-c6
            part: topic
            type: audio_choice
            text: "What is it about?"
            say: { en: "Listen. What is it about?" }
            audio: { turns: [{ fr: "J'ai un chien et un chat. Et toi ?", speaker: female }, { fr: "Moi, j'ai un poisson.", speaker: male }] }
            options: ["food", "animals", "feelings"]
            answer: "animals"
          - id: l2-c7
            part: topic
            type: audio_choice
            text: "What is it about?"
            say: { en: "Listen. What is it about?" }
            audio: { turns: [{ fr: "Tu veux une pizza ?", speaker: male }, { fr: "Oui ! Et un jus d'orange, s'il te plaît.", speaker: female }] }
            options: ["colours", "animals", "food and drink"]
            answer: "food and drink"
          - id: l2-c8
            part: topic
            type: true_false
            text: "Is it about colours?"
