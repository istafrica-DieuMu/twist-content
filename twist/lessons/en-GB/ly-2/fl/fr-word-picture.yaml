# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-word-picture
skill: fl.reading.word-picture
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Wörter lesen und Bildern zuordnen (Französisch)
  en: Reading French words and matching them to pictures
summary: >
  The first French reading: familiar words with their le or la on a word
  card, matched to their pictures. Lesson 1 reads words among others with
  the same start (le chat, le chien, la chaise; la pomme, le poisson, la
  porte); lesson 2 reads words that look like English words but mean
  something else (le pain, la main, le four, la robe), words that look
  alike to the end (le ballon, la baleine, le bateau) and long words, and
  ends with the skill check. The voice never says the word to be read.
metadata:
  year: ly-2
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.name-things]
  also_practises: [fl.themes.outside-animals, fl.themes.food]
  vocabulary: { fr: [le chat, le chien, la chaise, la pomme, le poisson, la porte, le lapin, le lait, la lampe, le pain, la main, le four, la robe, le ballon, la baleine, le bateau, le papillon, le crocodile] }
  forms: [picture, text, drawn]
  drawn: [word-card]
  facets: []
  parts:
    - { id: start, what: { de: Wörter mit gleichem Anfang bis zum Ende lesen, en: reading words with the same start to the end } }
    - { id: false-friends, what: { de: "Wörter lesen, die wie englische Wörter aussehen, aber etwas anderes heißen", en: reading words that look like English words but mean something else } }
    - { id: long, what: { de: längere Wörter lesen, en: reading longer words } }
  misconceptions:
    - id: first-letters
      what: Guesses from the first letters and picks any picture whose word starts the same (le chien for le chat)
      addressed: lesson 1 Learn says to read to the end of the word; most tasks set three words with the same start, l1-f1 gives feedback when chien is taken for chat and l2-f3 when ballon is taken for baleine
    - id: english-look-alike
      what: Reads a French word as the English word it looks like (le pain as pain, le four as four, la main as main)
      addressed: lesson 2 Learn shows le pain, la main, le four and la robe; l2-f1 gives feedback when pain is read as the English word, and l2-f2, l2-f4, l2-s1, l2-n5 and the skill check (l2-c3, l2-c5) use these words
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bis zum Ende lesen", en: "Read to the end" }
    goal:
      de: "Lies französische Wörter bis zum Ende und finde ihr Bild, so wie le chat und le chien."
      en: "Read French words right to the end and find their picture, like le chat and le chien."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "la pomme" }
            options: [{ object: apple }, { object: banana }, { object: strawberry }]
            answer: apple
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "le chien" }
            options: [{ object: cat }, { object: dog }, { object: rabbit }]
            answer: dog
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "le chat"
            say: { en: "Now you will read French words. In the tasks the voice will not say the word: you read it yourself. This one says le chat, the cat.", fr: "le chat" }
            show: { object: cat }
          - text: "le chat, le chien, la chaise"
            say: { en: "These three all start with ch. So look past the start, right to the end: chat ends in t, chien ends in n, chaise ends in se." }
          - text: "la pomme, le poisson, la porte"
            say: { en: "These all start with po. Read on: pomme is an apple, poisson is a fish, porte is a door." }
          - text: "le lapin, le lait, la lampe"
            say: { en: "These three words start with la: lapin, lait, lampe. Lapin is a rabbit, lait is milk, lampe is a lamp. The le or la in front is a separate little word, so read the word after it to the end." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le chat" }
                options: [{ object: cat }, { object: dog }, { object: chair }]
                answer: cat
                feedback:
                  dog: "Chien and chat both start with ch. Read on: c, h, a, t."
                hints:
                  - "Read the whole word, not just the start."
                  - "Chat ends in t; chien ends in n; chaise ends in se."
                  - "Le chat is the cat."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "la chaise" }
                options: [{ object: chair }, { object: cat }, { object: dog }]
                answer: chair
                hints:
                  - "It starts with ch, like chat and chien. Read to the end."
                  - "It ends in se: chai, se."
                  - "La chaise is the chair."
              - id: l1-f3
                type: matching
                option_audio: false
                text: "Match each word with its picture."
                say: { en: "Read each word. Tap it, then its picture." }
                pairs:
                  - left: { text: "le lapin" }
                    right: { object: rabbit }
                  - left: { text: "le lait" }
                    right: { object: milk }
                  - left: { text: "la lampe" }
                    right: { object: lamp }
                hints:
                  - "All three start with la. Look at the end of each word."
                  - "Lait is short. Lapin ends in in. Lampe ends in pe."
                  - "Lapin: rabbit. Lait: milk. Lampe: lamp."
              - id: l1-f4
                type: true_false
                text: "le poisson\nDoes the word match the picture?"
                show: { object: fish }
                answer: true
                hints:
                  - "Read the word to the end."
                  - "Poisson has a double s in the middle."
                  - "Yes. Le poisson is the fish."
              - id: l1-f5
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "la porte" }
                options: [{ object: door }, { object: apple }, { object: fish }]
                answer: door
                hints:
                  - "It starts with po, like pomme and poisson."
                  - "Read on: r, t, e."
                  - "La porte is the door."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le chien" }
                options: [{ object: dog }, { object: cat }, { object: chair }]
                answer: dog
                hints: ["Chien ends in n."]
              - id: l1-s2
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "la pomme" }
                options: [{ object: apple }, { object: door }, { object: fish }]
                answer: apple
                hints: ["Pomme has a double m."]
              - id: l1-s3
                type: true_false
                text: "la lampe\nDoes the word match the picture?"
                show: { object: milk }
                answer: false
                hints: ["Lampe ends in pe. Is that milk?"]
              - id: l1-s4
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le lait" }
                options: [{ object: milk }, { object: rabbit }, { object: lamp }]
                answer: milk
                hints: ["Of lapin, lait and lampe, it is the shortest word."]
              - id: l1-s5
                type: matching
                option_audio: false
                text: "Match each word with its picture."
                say: { en: "Read each word. Tap it, then its picture." }
                pairs:
                  - left: { text: "la porte" }
                    right: { object: door }
                  - left: { text: "la pomme" }
                    right: { object: apple }
                  - left: { text: "le poisson" }
                    right: { object: fish }
                hints: ["They all start with po. Look at the end."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le lapin" }
                options: [{ object: rabbit }, { object: lamp }, { object: milk }]
                answer: rabbit
              - id: l1-n2
                type: true_false
                text: "la chaise\nDoes the word match the picture?"
                show: { object: chair }
                answer: true
              - id: l1-n3
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le poisson" }
                options: [{ object: fish }, { object: apple }, { object: door }]
                answer: fish
              - id: l1-n4
                type: matching
                option_audio: false
                text: "Match each word with its picture."
                say: { en: "Read each word. Tap it, then its picture." }
                pairs:
                  - left: { text: "le chat" }
                    right: { object: cat }
                  - left: { text: "le chien" }
                    right: { object: dog }
                  - left: { text: "la chaise" }
                    right: { object: chair }
              - id: l1-n5
                type: true_false
                text: "le chien\nDoes the word match the picture?"
                show: { object: cat }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "Which word goes with the picture?"
            show: { object: door }
            options: ["la chaise", "la porte", "la lampe"]
            answer: "la porte"
          - id: l1-c2
            type: matching
            option_audio: false
            text: "Match each word with its picture."
            say: { en: "Read each word. Tap it, then its picture." }
            pairs:
              - left: { text: "le chat" }
                right: { object: cat }
              - left: { text: "la pomme" }
                right: { object: apple }
              - left: { text: "la lampe" }
                right: { object: lamp }
          - id: l1-c3
            type: true_false
            text: "le lait\nDoes the word match the picture?"
            show: { object: milk }
            answer: true
          - id: l1-c4
            type: multiple_choice
            option_audio: false
            text: "Which word goes with the picture?"
            show: { object: fish }
            options: ["la pomme", "le poisson", "la porte"]
            answer: "le poisson"
          - id: l1-c5
            type: true_false
            text: "le chat\nDoes the word match the picture?"
            show: { object: chair }
            answer: false
          - id: l1-c6
            type: multiple_choice
            option_audio: false
            text: "Which word goes with the picture?"
            show: { object: rabbit }
            options: ["le lait", "la lampe", "le lapin"]
            answer: "le lapin"

  - n: 2
    title: { de: "Wörter, die täuschen", en: "Words that trick you" }
    goal:
      de: "Lies genau und lass dich nicht von Wörtern reinlegen, die englisch aussehen, so wie le pain, das Brot."
      en: "Read carefully and don't be tricked by words that look English, like le pain, bread."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture is it?"
            show: { drawn: word-card, text: "le chien" }
            options: [{ object: chair }, { object: dog }, { object: fish }]
            answer: dog
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture is it?"
            show: { drawn: word-card, text: "la lampe" }
            options: [{ object: lamp }, { object: milk }, { object: rabbit }]
            answer: lamp
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "le pain"
            say: { en: "Careful! Some French words look like English words but mean something else. Le pain is bread. It has nothing to do with pain.", fr: "le pain" }
            show: { object: bread }
          - text: "la main, le four, la robe"
            say: { en: "La main is a hand. Le four is an oven, not the number four. La robe is a dress.", fr: "la main, le four, la robe" }
          - text: "le ballon, la baleine, le bateau"
            say: { en: "These look alike at the start: ba. Read to the end. Ballon is a ball, baleine is a whale, bateau is a boat.", fr: "le ballon, la baleine, le bateau" }
          - text: "le pa-pil-lon, le cro-co-dile"
            say: { en: "Long words: read them in parts. Papillon is a butterfly. Crocodile looks just like the English word, and this time it means the same.", fr: "le papillon, le crocodile" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le pain" }
                options: [{ object: bread }, { object: sad }, { object: hand }]
                answer: bread
                feedback:
                  sad: "Pain looks like the English word pain, but in French it means bread."
                hints:
                  - "This word looks English. Is it?"
                  - "In French, le pain is something to eat."
                  - "Le pain is bread."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le four" }
                options: [{ object: oven }, { object: hand }, { object: foot }]
                answer: oven
                hints:
                  - "In French, four is not a number."
                  - "You find it in the kitchen and it gets hot."
                  - "Le four is the oven."
              - id: l2-f3
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "la baleine" }
                options: [{ object: whale }, { object: ball }, { object: boat }]
                answer: whale
                feedback:
                  ball: "Ballon and baleine both start with bal. Read to the end: b, a, l, e, i, n, e."
                hints:
                  - "It starts with ba, like ballon and bateau."
                  - "It ends in eine, not lon or teau."
                  - "La baleine is the whale."
              - id: l2-f4
                type: matching
                option_audio: false
                text: "Match each word with its picture."
                say: { en: "Read each word. Tap it, then its picture." }
                pairs:
                  - left: { text: "la main" }
                    right: { object: hand }
                  - left: { text: "la robe" }
                    right: { object: dress }
                  - left: { text: "le pain" }
                    right: { object: bread }
                hints:
                  - "These words look English, but they mean something else."
                  - "One is part of your body, one you wear, one you eat."
                  - "Main: hand. Robe: dress. Pain: bread."
              - id: l2-f5
                type: true_false
                text: "le bateau\nDoes the word match the picture?"
                show: { object: ball }
                answer: false
                hints:
                  - "Read to the end: ba, teau."
                  - "Bateau is something that floats on water."
                  - "No. Le bateau is a boat, and this is a ball."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "la main" }
                options: [{ object: hand }, { object: foot }, { object: mouth }]
                answer: hand
                hints: ["It is part of your body, and it has five fingers."]
              - id: l2-s2
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le ballon" }
                options: [{ object: ball }, { object: whale }, { object: boat }]
                answer: ball
                hints: ["It ends in lon, not leine or teau."]
              - id: l2-s3
                type: true_false
                text: "la robe\nDoes the word match the picture?"
                show: { object: dress }
                answer: true
                hints: ["La robe is something you wear."]
              - id: l2-s4
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le papillon" }
                options: [{ object: butterfly }, { object: bread }, { object: crocodile }]
                answer: butterfly
                hints: ["Read it in parts: pa, pil, lon."]
              - id: l2-s5
                type: matching
                option_audio: false
                text: "Match each word with its picture."
                say: { en: "Read each word. Tap it, then its picture." }
                pairs:
                  - left: { text: "le ballon" }
                    right: { object: ball }
                  - left: { text: "la baleine" }
                    right: { object: whale }
                  - left: { text: "le bateau" }
                    right: { object: boat }
                hints: ["They all start with ba. Look at the end."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le bateau" }
                options: [{ object: boat }, { object: ball }, { object: whale }]
                answer: boat
              - id: l2-n2
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "la robe" }
                options: [{ object: dress }, { object: skirt }, { object: jacket }]
                answer: dress
              - id: l2-n3
                type: true_false
                text: "la main\nDoes the word match the picture?"
                show: { object: foot }
                answer: false
              - id: l2-n4
                type: image_multiple_choice
                option_audio: false
                text: "Read the word. Which picture is it?"
                show: { drawn: word-card, text: "le crocodile" }
                options: [{ object: crocodile }, { object: cat }, { object: cow }]
                answer: crocodile
              - id: l2-n5
                type: matching
                option_audio: false
                text: "Match each word with its picture."
                say: { en: "Read each word. Tap it, then its picture." }
                pairs:
                  - left: { text: "le four" }
                    right: { object: oven }
                  - left: { text: "le papillon" }
                    right: { object: butterfly }
                  - left: { text: "la main" }
                    right: { object: hand }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: long
            type: multiple_choice
            option_audio: false
            text: "Which word goes with the picture?"
            show: { object: whale }
            options: ["la baleine", "le ballon", "le bateau"]
            answer: "la baleine"
          - id: l2-c2
            part: start
            type: true_false
            text: "le lapin\nDoes the word match the picture?"
            show: { object: rabbit }
            answer: true
          - id: l2-c3
            part: false-friends
            type: matching
            option_audio: false
            text: "Match the words to the pictures."
            say: { en: "Read each word. Tap it, then its picture." }
            pairs:
              - left: { text: "le pain" }
                right: { object: bread }
              - left: { text: "le four" }
                right: { object: oven }
              - left: { text: "la porte" }
                right: { object: door }
          - id: l2-c4
            part: start
            type: multiple_choice
            option_audio: false
            text: "Which word goes with the picture?"
            show: { object: chair }
            options: ["la chaise", "le chat", "le chien"]
            answer: "la chaise"
          - id: l2-c5
            part: false-friends
            type: multiple_choice
            option_audio: false
            text: "Which word goes with the picture?"
            show: { object: bread }
            options: ["le pain", "la main", "le bain"]
            answer: "le pain"
          - id: l2-c6
            part: start
            type: multiple_choice
            option_audio: false
            text: "Which word goes with the picture?"
            show: { object: dog }
            options: ["le chat", "la chaise", "le chien"]
            answer: "le chien"
          - id: l2-c7
            part: start
            type: multiple_choice
            option_audio: false
            text: "Which word goes with the picture?"
            show: { object: apple }
            options: ["la porte", "la pomme", "le poisson"]
            answer: "la pomme"
          - id: l2-c8
            part: start
            type: multiple_choice
            option_audio: false
            text: "Which word goes with the picture?"
            show: { object: lamp }
            options: ["le lapin", "le lait", "la lampe"]
            answer: "la lampe"
          - id: l2-c9
            part: start
            type: true_false
            text: "la porte\nDoes the word match the picture?"
            show: { object: apple }
            answer: false
          - id: l2-c10
            part: start
            type: matching
            option_audio: false
            text: "Which picture goes with each word?"
            say: { en: "Read each word. Then tap its picture." }
            pairs:
              - left: { text: "le lait" }
                right: { object: milk }
              - left: { text: "la pomme" }
                right: { object: apple }
              - left: { text: "le chien" }
                right: { object: dog }
              - left: { text: "la lampe" }
                right: { object: lamp }
          - id: l2-c11
