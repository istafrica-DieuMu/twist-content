# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-sentences
skill: fl.reading.sentences
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Kurze Sätze lesen (Französisch)
  en: Reading short sentences in French
summary: >
  Reading short French sentences made of familiar words and matching them
  to pictures. Lesson 1 reads a sentence and finds its picture, where
  every word counts (un ballon rouge, not une voiture rouge), with
  sentences about how many, the weather and feelings; lesson 2 goes the
  other way, from a picture to its sentence, reads sentences with ne ...
  pas, and ends with the skill check. The voice never reads the sentence
  to be understood.
metadata:
  year: ly-2
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.word-picture]
  also_practises: [fl.themes.weather, fl.themes.feelings, fl.themes.colours]
  vocabulary: { fr: ["J'ai ...", "C'est ...", "Il y a ...", "Il pleut.", "Il neige.", "Il y a du vent.", "Il y a du soleil.", "Je suis content.", "Je suis triste.", "Je suis fatigué.", "ne ... pas", "Je n'ai pas de ..."] }
  forms: [picture, text, drawn]
  drawn: [word-card]
  facets: []
  parts:
    - { id: to-picture, what: { de: einen Satz lesen und das passende Bild finden, en: reading a sentence and finding its picture } }
    - { id: to-sentence, what: { de: zu einem Bild den passenden Satz finden, en: finding the sentence for a picture } }
    - { id: negative, what: { de: Sätze mit ne ... pas verstehen, en: understanding sentences with ne ... pas } }
  misconceptions:
    - id: one-word
      what: Reads one familiar word and picks the picture for it (a red car for J'ai un ballon rouge)
      addressed: lesson 1 Learn says to read every word; the picture options share a word with the sentence, and l1-f1 and l2-f1 give feedback when only the colour was read
    - id: misses-ne-pas
      what: Overlooks ne ... pas and takes the sentence as positive
      addressed: lesson 2 Learn brings ne ... pas and n'; l2-f2 gives feedback when happy is picked for Je ne suis pas content, and every stage of lesson 2 and the skill check have a sentence with ne ... pas
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Jedes Wort zählt", en: "Every word counts" }
    goal:
      de: "Lies einen kurzen französischen Satz Wort für Wort und finde das passende Bild, so wie un ballon rouge."
      en: "Read a short French sentence word by word and find its picture, like un ballon rouge."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture is it?"
            show: { drawn: word-card, text: "le bateau" }
            options: [{ object: boat }, { object: ball }, { object: whale }]
            answer: boat
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture is it?"
            show: { drawn: word-card, text: "la robe" }
            options: [{ object: dress }, { object: hand }, { object: bread }]
            answer: dress
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "a red ball\nun ballon rouge ? un rouge ballon ?"
            say: { en: "Léa has sent you a postcard from France, in French! First, a guess. In English you say a red ball. Where do you think French puts the colour word: before the ball, or after it?" }
          - text: "J'ai un ballon rouge.\nC'est une voiture verte."
            say: { en: "After! Now you read whole sentences, like on Léa's postcard. Read every word. J'ai un ballon rouge: I have got a red ball. C'est une voiture verte: it's a green car. In French the colour comes after the thing: ballon rouge, voiture verte.", fr: "J'ai un ballon rouge. C'est une voiture verte." }
            show: { object: ball, colour: red }
          - text: "Il y a trois chats."
            say: { en: "Il y a means there is or there are. Il y a trois chats: there are three cats.", fr: "Il y a trois chats." }
            show: { object: cat, count: 3, layout: row }
          - text: "Il pleut. Il neige.\nIl y a du vent. Il y a du soleil."
            say: { en: "Weather sentences: il pleut, it's raining; il neige, it's snowing; il y a du vent, it's windy; il y a du soleil, it's sunny.", fr: "Il pleut. Il neige. Il y a du vent. Il y a du soleil." }
          - text: "Did you know? When it rains very hard, French people say il pleut des cordes: it's raining ropes!"
            say: { en: "Did you know? When it rains very hard, French people say il pleut des cordes. That means it's raining ropes! In English we say it's raining cats and dogs.", fr: "Il pleut des cordes !" }
            show: { object: rain }
          - text: "Je suis content. Je suis triste.\nJe suis fatigué."
            say: { en: "Je suis means I am. Content is happy, triste is sad, fatigué is tired.", fr: "Je suis content. Je suis triste. Je suis fatigué." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                option_audio: false
                text: "J'ai un ballon rouge.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options:
                  - { object: ball, colour: red, key: ball-red }
                  - { object: car, colour: red, key: car-red }
                  - { object: ball, colour: blue, key: ball-blue }
                answer: ball-red
                feedback:
                  car-red: "Rouge fits, but read every word: un ballon is a ball."
                hints:
                  - "Read every word, not only the colour."
                  - "Ballon is a ball; rouge is red."
                  - "The red ball."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                option_audio: false
                text: "Il y a trois chiens.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options:
                  - { object: dog, count: 3, layout: row, key: dogs-3 }
                  - { object: cat, count: 3, layout: row, key: cats-3 }
                  - { object: dog, count: 2, layout: row, key: dogs-2 }
                answer: dogs-3
                feedback:
                  cats-3: "Miaou! Those are three cats. Chiens are dogs: ouaf ouaf!"
                hints:
                  - "The sentence tells you how many and what."
                  - "Trois is three; chiens are dogs."
                  - "Three dogs."
              - id: l1-f3
                type: image_multiple_choice
                option_audio: false
                text: "Il neige.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: snow }, { object: rain }, { object: sun }]
                answer: snow
                hints:
                  - "It is about the weather."
                  - "Il pleut is rain; il neige is something else."
                  - "Il neige: it's snowing."
              - id: l1-f4
                type: true_false
                text: "Je suis fatigué.\nDoes the sentence match the picture?"
                show: { object: tired }
                answer: true
                hints:
                  - "Read the last word."
                  - "Fatigué means tired."
                  - "Yes. The child is tired."
              - id: l1-f5
                type: matching
                option_audio: false
                text: "Match each sentence with its picture."
                say: { en: "Read each sentence. Tap it, then its picture." }
                pairs:
                  - left: { text: "Il pleut." }
                    right: { object: rain }
                  - left: { text: "Il neige." }
                    right: { object: snow }
                  - left: { text: "Il y a du vent." }
                    right: { object: wind }
                hints:
                  - "These are all about the weather."
                  - "Vent is wind."
                  - "Il pleut: rain. Il neige: snow. Il y a du vent: wind."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                option_audio: false
                text: "C'est une voiture bleue.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options:
                  - { object: car, colour: blue, key: car-blue }
                  - { object: ball, colour: blue, key: ball-blue }
                  - { object: car, colour: green, key: car-green }
                answer: car-blue
                hints: ["Read both: voiture and bleue."]
              - id: l1-s2
                type: image_multiple_choice
                option_audio: false
                text: "Je suis triste.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: sad }, { object: happy }, { object: angry }]
                answer: sad
                hints: ["Triste means sad."]
              - id: l1-s3
                type: true_false
                text: "Il y a deux pommes.\nDoes the sentence match the picture?"
                show: { object: apple, count: 3, layout: row }
                answer: false
                hints: ["Count the apples. Deux is two."]
              - id: l1-s4
                type: image_multiple_choice
                option_audio: false
                text: "Il y a du soleil.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: sun }, { object: wind }, { object: snow }]
                answer: sun
                hints: ["Soleil is the sun."]
              - id: l1-s5
                type: matching
                option_audio: false
                text: "Match each sentence with its picture."
                say: { en: "Read each sentence. Tap it, then its picture." }
                pairs:
                  - left: { text: "Je suis content." }
                    right: { object: happy }
                  - left: { text: "Je suis triste." }
                    right: { object: sad }
                  - left: { text: "Je suis fatigué." }
                    right: { object: tired }
                hints: ["Content: happy. Triste: sad. Fatigué: tired."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                option_audio: false
                text: "J'ai une robe jaune.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options:
                  - { object: dress, colour: yellow, key: dress-yellow }
                  - { object: skirt, colour: yellow, key: skirt-yellow }
                  - { object: dress, colour: red, key: dress-red }
                answer: dress-yellow
              - id: l1-n2
                type: image_multiple_choice
                option_audio: false
                text: "Il y a cinq poissons.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options:
                  - { object: fish, count: 5, layout: row, key: fish-5 }
                  - { object: fish, count: 4, layout: row, key: fish-4 }
                  - { object: duck, count: 5, layout: row, key: ducks-5 }
                answer: fish-5
              - id: l1-n3
                type: true_false
                text: "Il pleut.\nDoes the sentence match the picture?"
                show: { object: sun }
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                option_audio: false
                text: "Je suis content.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: happy }, { object: sad }, { object: tired }]
                answer: happy
              - id: l1-n5
                type: true_false
                text: "J'ai un ballon vert.\nDoes the sentence match the picture?"
                show: { object: ball, colour: green }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            option_audio: false
            text: "C'est une robe rouge.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options:
              - { object: dress, colour: red, key: dress-red }
              - { object: dress, colour: blue, key: dress-blue }
              - { object: car, colour: red, key: car-red }
            answer: dress-red
          - id: l1-c2
            type: image_multiple_choice
            option_audio: false
            text: "Il y a deux chats.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options:
              - { object: cat, count: 2, layout: row, key: cats-2 }
              - { object: cat, count: 4, layout: row, key: cats-4 }
              - { object: dog, count: 2, layout: row, key: dogs-2 }
            answer: cats-2
          - id: l1-c3
            type: true_false
            text: "Je suis triste.\nDoes the sentence match the picture?"
            show: { object: happy }
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            option_audio: false
            text: "Il y a du vent.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options: [{ object: sun }, { object: wind }, { object: rain }]
            answer: wind
          - id: l1-c5
            type: true_false
            text: "Il y a quatre chiens.\nDoes the sentence match the picture?"
            show: { object: dog, count: 4, layout: row }
            answer: true
          - id: l1-c6
            type: image_multiple_choice
            option_audio: false
            text: "C'est une jupe bleue.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options:
              - { object: dress, colour: blue, key: dress-blue }
              - { object: skirt, colour: red, key: skirt-red }
              - { object: skirt, colour: blue, key: skirt-blue }
            answer: skirt-blue

  - n: 2
    title: { de: "Vom Bild zum Satz, ne ... pas", en: "From picture to sentence, ne ... pas" }
    goal:
      de: "Schau dir ein Bild an, such den passenden Satz und achte auf ne und pas, so wie il ne pleut pas."
      en: "Look at a picture, find the sentence that fits and watch for ne and pas, like il ne pleut pas."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            option_audio: false
            text: "Il pleut.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options: [{ object: rain }, { object: snow }, { object: sun }]
            answer: rain
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            option_audio: false
            text: "J'ai un ballon bleu.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options:
              - { object: ball, colour: blue, key: ball-blue }
              - { object: ball, colour: red, key: ball-red }
              - { object: car, colour: blue, key: car-blue }
            answer: ball-blue
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Je ne suis pas content."
            show: { object: sad }
            say: { en: "Here are two new little words, ne and pas. Content means happy. Look at Hugo's face. What do you think ne ... pas means?" }
          - text: "Je ne suis pas content."
            say: { en: "Not! Ne and pas go either side of the verb and mean not. Je ne suis pas content: I am not happy. Two small words change the whole sentence, so look out for them.", fr: "Je ne suis pas content." }
            show: { object: sad }
          - text: "Il ne pleut pas."
            say: { en: "Il ne pleut pas: it is not raining.", fr: "Il ne pleut pas." }
            show: { object: sun }
          - text: "Je n'ai pas de chien."
            say: { en: "Before a vowel, ne becomes n'. Je n'ai pas de chien: I have not got a dog.", fr: "Je n'ai pas de chien." }
          - text: "picture → sentence"
            say: { en: "Now it goes the other way: look at a picture and find the sentence that fits. Check every word of each sentence against the picture." }
            show: { object: car, colour: yellow }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Which sentence matches the picture?"
                show: { object: car, colour: red }
                options: ["C'est une voiture rouge.", "C'est un ballon rouge.", "C'est une voiture verte."]
                answer: "C'est une voiture rouge."
                feedback:
                  "C'est un ballon rouge.": "Rouge is right, but read every word: un ballon is a ball."
                hints:
                  - "What is it, and what colour is it?"
                  - "A car is une voiture; red is rouge."
                  - "C'est une voiture rouge."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                option_audio: false
                text: "Je ne suis pas content.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: happy }, { object: sad }]
                answer: sad
                feedback:
                  happy: "Content means happy, but ne ... pas means not: I am not happy."
                hints:
                  - "Look for ne and pas."
                  - "Ne ... pas means not."
                  - "Not happy: the sad child."
              - id: l2-f3
                type: true_false
                text: "Il ne pleut pas.\nDoes the sentence match the picture?"
                show: { object: rain }
                answer: false
                hints:
                  - "Look for ne and pas."
                  - "Il ne pleut pas means it is not raining."
                  - "No. In the picture it is raining."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Which sentence matches the picture?"
                show: { object: cat, count: 4, layout: row }
                options: ["Il y a quatre chats.", "Il y a quatre chiens.", "Il y a trois chats."]
                answer: "Il y a quatre chats."
                hints:
                  - "Count, and look at what they are."
                  - "Four is quatre; cats are chats."
                  - "Il y a quatre chats."
              - id: l2-f5
                type: image_multiple_choice
                option_audio: false
                text: "Il ne neige pas. Il pleut.\n\nWhich picture matches?"
                say: { en: "Read the sentences. Which picture matches?" }
                options: [{ object: rain }, { object: snow }, { object: sun }]
                answer: rain
                hints:
                  - "There are two sentences. Read both."
                  - "Il ne neige pas: no snow. Then: il pleut."
                  - "It is raining."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Which sentence matches the picture?"
                show: { object: snow }
                options: ["Il neige.", "Il ne neige pas.", "Il pleut."]
                answer: "Il neige."
                hints: ["Is there ne ... pas in the sentence you chose?"]
              - id: l2-s2
                type: image_multiple_choice
                option_audio: false
                text: "Je n'ai pas de ballon. J'ai une voiture.\n\nWhich picture matches?"
                say: { en: "Read the sentences. Which picture matches?" }
                options: [{ object: car }, { object: ball }, { object: bike }]
                answer: car
                hints: ["N'ai pas means have not got. What does the child have?"]
              - id: l2-s3
                type: true_false
                text: "Je ne suis pas triste.\nDoes the sentence match the picture?"
                show: { object: happy }
                answer: true
                hints: ["Not sad: is the child sad?"]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Which sentence matches the picture?"
                show: { object: dress, colour: green }
                options: ["C'est une robe verte.", "C'est une robe bleue.", "C'est une jupe verte."]
                answer: "C'est une robe verte."
                hints: ["Check the thing and the colour."]
              - id: l2-s5
                type: image_multiple_choice
                option_audio: false
                text: "Il y a du soleil. Il ne pleut pas.\n\nWhich picture matches?"
                say: { en: "Read the sentences. Which picture matches?" }
                options: [{ object: sun }, { object: rain }, { object: snow }]
                answer: sun
                hints: ["Soleil is the sun."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                option_audio: false
                text: "Which sentence matches the picture?"
                show: { object: tired }
                options: ["Je suis fatigué.", "Je ne suis pas fatigué.", "Je suis content."]
                answer: "Je suis fatigué."
              - id: l2-n2
                type: image_multiple_choice
                option_audio: false
                text: "Je ne suis pas triste.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: happy }, { object: sad }]
                answer: happy
              - id: l2-n3
                type: true_false
                text: "Il y a trois pommes.\nDoes the sentence match the picture?"
                show: { object: apple, count: 3, layout: row }
                answer: true
              - id: l2-n4
                type: multiple_choice
                option_audio: false
                text: "Which sentence matches the picture?"
                show: { object: ball, colour: blue }
                options: ["J'ai un ballon bleu.", "J'ai un ballon vert.", "J'ai une voiture bleue."]
                answer: "J'ai un ballon bleu."
              - id: l2-n5
                type: image_multiple_choice
                option_audio: false
                text: "Il ne neige pas. Il y a du vent.\n\nWhich picture matches?"
                say: { en: "Read the sentences. Which picture matches?" }
                options: [{ object: wind }, { object: snow }, { object: rain }]
                answer: wind

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: to-picture
            type: image_multiple_choice
            option_audio: false
            text: "J'ai un ballon jaune.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options:
              - { object: ball, colour: yellow, key: ball-yellow }
              - { object: ball, colour: green, key: ball-green }
              - { object: car, colour: yellow, key: car-yellow }
            answer: ball-yellow
          - id: l2-c2
            part: negative
            type: image_multiple_choice
            option_audio: false
            text: "Il ne pleut pas. Il neige.\n\nWhich picture matches?"
            say: { en: "Read the sentences. Which picture matches?" }
            options: [{ object: snow }, { object: rain }, { object: sun }]
            answer: snow
          - id: l2-c3
            part: to-sentence
            type: multiple_choice
            option_audio: false
            text: "Which sentence matches the picture?"
            show: { object: dog, count: 2, layout: row }
            options: ["Il y a deux chiens.", "Il y a deux chats.", "Il y a trois chiens."]
            answer: "Il y a deux chiens."
          - id: l2-c4
            part: to-picture
            type: true_false
            text: "Il y a du vent.\nDoes the sentence match the picture?"
            show: { object: snow }
            answer: false
          - id: l2-c5
            part: to-sentence
            type: multiple_choice
            option_audio: false
            text: "Which sentence matches the picture?"
            show: { object: car, colour: yellow }
            options: ["C'est une voiture jaune.", "C'est un ballon jaune.", "Ce n'est pas une voiture."]
            answer: "C'est une voiture jaune."
          - id: l2-c6
            part: to-picture
            type: image_multiple_choice
            option_audio: false
            text: "Il y a quatre canards.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options:
              - { object: duck, count: 3, layout: row, key: ducks-3 }
              - { object: fish, count: 4, layout: row, key: fish-4 }
              - { object: duck, count: 4, layout: row, key: ducks-4 }
            answer: ducks-4
          - id: l2-c7
            part: to-picture
            type: image_multiple_choice
            option_audio: false
            text: "Je suis fatigué.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options: [{ object: happy }, { object: tired }, { object: sad }]
            answer: tired
          - id: l2-c8
            part: to-picture
            type: image_multiple_choice
            option_audio: false
            text: "J'ai une jupe verte.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options:
              - { object: dress, colour: green, key: dress-green }
              - { object: skirt, colour: green, key: skirt-green }
              - { object: skirt, colour: yellow, key: skirt-yellow }
            answer: skirt-green
          - id: l2-c9
            part: to-picture
            type: true_false
            text: "Il y a du soleil.\nDoes the sentence match the picture?"
            show: { object: sun }
            answer: true
          - id: l2-c10
            part: to-picture
            type: image_multiple_choice
            option_audio: false
            text: "Il y a deux pommes.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options:
              - { object: pear, count: 2, layout: row, key: pears-2 }
              - { object: apple, count: 2, layout: row, key: apples-2 }
              - { object: apple, count: 3, layout: row, key: apples-3 }
            answer: apples-2
          - id: l2-c11
            part: to-sentence
            type: multiple_choice
            option_audio: false
            text: "Which sentence matches the picture?"
