# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-stories
skill: fl.listening.stories
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Geschichten hören (Französisch)
  en: Listening to stories in French
summary: >
  Short picture stories read aloud in French: a hungry hedgehog, a snail
  in the rain, a crab at the seaside, a lost teddy, a windy day. Lesson 1
  listens for the gist: who is in the story, what it is about and how it
  ends. Lesson 2 listens for the order of events with d'abord, puis and à
  la fin, puts the pictures in order, and ends with the skill check.
  Questions are in English, so the task tests listening, not reading.
metadata:
  year: ly-2
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.short-dialogues]
  also_practises: [fl.culture-strategies.guess-meaning, fl.themes.food]
  vocabulary: { fr: ["d'abord", puis, "à la fin", "il a faim", content, triste, "il a peur", une histoire] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: gist, what: { de: "verstehen, wer in der Geschichte vorkommt und worum es geht", en: understanding who is in the story and what it is about } }
    - { id: detail, what: { de: "heraushören, wer etwas tut und was passiert", en: picking out who does something and what happens } }
    - { id: end, what: { de: "verstehen, wie die Geschichte endet", en: understanding how the story ends } }
    - { id: order, what: { de: die Bilder in die richtige Reihenfolge bringen, en: putting the pictures in order } }
  misconceptions:
    - id: every-word
      what: Gives up because not every word of the story is understood
      addressed: lesson 1 Learn says the child need not understand every word and should listen for the words it knows; the gist tasks ask only for those
    - id: first-mentioned
      what: Takes the first thing heard as the answer, even when the question asks how the story ends
      addressed: l1-f4 gives feedback when Zoé's scared moment is taken for the ending; lesson 2 Learn brings d'abord, puis and à la fin, and l2-f3 gives feedback when the last thing is taken for the first
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Worum geht es in der Geschichte?", en: "What is the story about?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which pet does the child have?"
            say: { en: "Listen. Which pet does the child have?" }
            audio: { turns: [{ fr: "Tu as un animal ?", speaker: female }, { fr: "Oui, j'ai un lapin.", speaker: male }] }
            options: [{ object: rabbit }, { object: dog }, { object: cat }]
            answer: rabbit
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "What is it about?"
            say: { en: "Listen. What is it about?" }
            audio: { turns: [{ fr: "Je voudrais une banane, s'il te plaît.", speaker: male }, { fr: "Voilà !", speaker: female }, { fr: "Merci !", speaker: male }] }
            options: ["food", "colours", "animals"]
            answer: "food"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { en: "Now you will hear a story in French. You do not need to understand every word. Listen for the words you know.", fr: "Voici un petit hérisson. Le hérisson a faim. Il trouve une fraise dans le jardin. Miam ! Mais un renard arrive. Le hérisson a peur. Il court sous un arbre." }
            show: { objects: [hedgehog, strawberry] }
          - say: { en: "Did you hear the animals? Le hérisson, the hedgehog, and le renard, the fox. The hedgehog finds a strawberry. Then the fox comes, and the hedgehog runs under a tree." }
            show: { objects: [hedgehog, fox] }
          - text: "hérisson, fraise, renard, arbre"
            say: { en: "Four words you can picture. They tell you nearly the whole story." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Who is in the story?"
                say: { en: "Listen to the story. Who is in the story?" }
                audio: { fr: "Il pleut. Un petit escargot sort dans le jardin. D'abord, il mange une feuille. Puis il mange une fraise. Le soleil arrive, et l'escargot dort sous une fleur." }
                options: [{ object: snail }, { object: frog }, { object: bird }]
                answer: snail
                hints:
                  - "Listen for the words you know."
                  - "It is a small, slow animal that likes the rain."
                  - "Un escargot is a snail."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What is the story about?"
                say: { en: "Listen to the story. What is it about?" }
                audio: { fr: "Voici Rex. Rex est un chien. Il a très faim. D'abord, il mange du pain. Puis il boit du lait. À la fin, il est très fatigué et il dort sur le canapé." }
                options: ["A dog is hungry.", "A dog plays ball.", "A dog is lost."]
                answer: "A dog is hungry."
                hints:
                  - "What does Rex do in the story?"
                  - "He eats bread and drinks milk."
                  - "Il a faim means he is hungry."
              - id: l1-f3
                type: true_false
                text: "Is the hedgehog under a tree at the end?"
                say: { en: "Listen to the story. Is the hedgehog under a tree at the end?", fr: "Voici un petit hérisson. Le hérisson a faim. Il trouve une fraise dans le jardin. Miam ! Mais un renard arrive. Le hérisson a peur. Il court sous un arbre." }
                answer: true
                hints:
                  - "Listen to the last sentence."
                  - "Il court sous un arbre."
                  - "Yes, he runs under a tree."
              - id: l1-f4
                type: audio_choice
                text: "How does Zoé feel at the end?"
                say: { en: "Listen to the story. How does Zoé feel at the end?" }
                audio: { fr: "C'est l'été. Zoé est à la plage avec son papa. Elle fait un château de sable. Puis un crabe arrive ! Zoé a peur. Mais le crabe est petit et gentil. À la fin, Zoé est contente." }
                options: [{ object: happy }, { object: scared }, { object: sad }]
                answer: happy
                feedback:
                  scared: "Zoé is scared in the middle. Listen to the end: à la fin, Zoé est contente."
                hints:
                  - "Listen right to the last sentence."
                  - "The crab is small and kind."
                  - "Contente means happy."
              - id: l1-f5
                type: audio_choice
                text: "What does Zoé make?"
                say: { en: "Listen to the story. What does Zoé make?" }
                audio: { fr: "C'est l'été. Zoé est à la plage avec son papa. Elle fait un château de sable. Puis un crabe arrive ! Zoé a peur. Mais le crabe est petit et gentil. À la fin, Zoé est contente." }
                options: [{ object: sandcastle }, { object: cake }, { object: snowman }]
                answer: sandcastle
                hints:
                  - "Listen for elle fait un ..."
                  - "Un château de sable. Sable is sand."
                  - "She makes a sandcastle."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What is Nathan looking for?"
                say: { en: "Listen to the story. What is Nathan looking for?" }
                audio: { fr: "Nathan cherche son nounours. Il n'est pas sur le lit. Il n'est pas dans la cuisine. Ah ! Le chien a le nounours dans le jardin. Nathan est content." }
                options: [{ object: teddy }, { object: ball }, { object: book }]
                answer: teddy
                hints: ["Un nounours is a cuddly toy bear."]
              - id: l1-s2
                type: audio_choice
                text: "Who has the teddy?"
                say: { en: "Listen to the story. Who has the teddy?" }
                audio: { fr: "Nathan cherche son nounours. Il n'est pas sur le lit. Il n'est pas dans la cuisine. Ah ! Le chien a le nounours dans le jardin. Nathan est content." }
                options: [{ object: dog }, { object: cat }, { object: mum }]
                answer: dog
                hints: ["Listen for le chien a le nounours."]
              - id: l1-s3
                type: true_false
                text: "Is the snail still eating at the end?"
                say: { en: "Listen to the story. Is the snail still eating at the end?", fr: "Il pleut. Un petit escargot sort dans le jardin. D'abord, il mange une feuille. Puis il mange une fraise. Le soleil arrive, et l'escargot dort sous une fleur." }
                answer: false
                hints: ["Listen to the end: l'escargot dort. Dort means sleeps."]
              - id: l1-s4
                type: audio_choice
                text: "What does Rex drink?"
                say: { en: "Listen to the story. What does Rex drink?" }
                audio: { fr: "Voici Rex. Rex est un chien. Il a très faim. D'abord, il mange du pain. Puis il boit du lait. À la fin, il est très fatigué et il dort sur le canapé." }
                options: [{ object: milk }, { object: juice }, { object: water }]
                answer: milk
                hints: ["Listen for il boit du ..."]
              - id: l1-s5
                type: audio_choice
                text: "What flies away?"
                say: { en: "Listen to the story. What flies away?" }
                audio: { fr: "Il y a du vent. Mamie va au parc avec son parapluie. Oh non ! Le parapluie s'envole. Il vole, il vole, et il tombe dans une flaque. Mamie rit." }
                options: [{ object: umbrella }, { object: kite }, { object: hat }]
                answer: umbrella
                hints: ["Listen for le parapluie."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What is the story about?"
                say: { en: "Listen to the story. What is it about?" }
                audio: { fr: "Il y a du vent. Mamie va au parc avec son parapluie. Oh non ! Le parapluie s'envole. Il vole, il vole, et il tombe dans une flaque. Mamie rit." }
                options: ["A windy day in the park", "A birthday party", "A day in the snow"]
                answer: "A windy day in the park"
              - id: l1-n2
                type: audio_choice
                text: "Where does the umbrella land?"
                say: { en: "Listen to the story. Where does the umbrella land?" }
                audio: { fr: "Il y a du vent. Mamie va au parc avec son parapluie. Oh non ! Le parapluie s'envole. Il vole, il vole, et il tombe dans une flaque. Mamie rit." }
                options: [{ object: puddle }, { object: tree }, { object: house }]
                answer: puddle
              - id: l1-n3
                type: true_false
                text: "Is Nathan happy at the end?"
                say: { en: "Listen to the story. Is Nathan happy at the end?", fr: "Nathan cherche son nounours. Il n'est pas sur le lit. Il n'est pas dans la cuisine. Ah ! Le chien a le nounours dans le jardin. Nathan est content." }
                answer: true
              - id: l1-n4
                type: audio_choice
                text: "What does the owl see?"
                say: { en: "Listen to the story. What does the owl see?" }
                audio: { fr: "C'est la nuit. La lune brille. Un hibou est dans un arbre. Il voit une souris. La souris court vite dans sa maison. Le hibou a encore faim." }
                options: [{ object: mouse }, { object: fish }, { object: frog }]
                answer: mouse
              - id: l1-n5
                type: audio_choice
                text: "What does the hedgehog find?"
                say: { en: "Listen to the story. What does the hedgehog find?" }
                audio: { fr: "Voici un petit hérisson. Le hérisson a faim. Il trouve une fraise dans le jardin. Miam ! Mais un renard arrive. Le hérisson a peur. Il court sous un arbre." }
                options: [{ object: strawberry }, { object: apple }, { object: carrot }]
                answer: strawberry

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Where does Rex sleep?"
            say: { en: "Listen to the story. Where does Rex sleep?" }
            audio: { fr: "Voici Rex. Rex est un chien. Il a très faim. D'abord, il mange du pain. Puis il boit du lait. À la fin, il est très fatigué et il dort sur le canapé." }
            options: [{ object: sofa }, { object: bed }, { object: chair }]
            answer: sofa
          - id: l1-c2
            type: audio_choice
            text: "Who comes to the hedgehog?"
            say: { en: "Listen to the story. Who comes to the hedgehog?" }
            audio: { fr: "Voici un petit hérisson. Le hérisson a faim. Il trouve une fraise dans le jardin. Miam ! Mais un renard arrive. Le hérisson a peur. Il court sous un arbre." }
            options: [{ object: fox }, { object: dog }, { object: cat }]
            answer: fox
          - id: l1-c3
            type: true_false
            text: "Is the owl in a tree?"
            say: { en: "Listen to the story. Is the owl in a tree?", fr: "C'est la nuit. La lune brille. Un hibou est dans un arbre. Il voit une souris. La souris court vite dans sa maison. Le hibou a encore faim." }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Where is Zoé?"
            say: { en: "Listen to the story. Where is Zoé?" }
            audio: { fr: "C'est l'été. Zoé est à la plage avec son papa. Elle fait un château de sable. Puis un crabe arrive ! Zoé a peur. Mais le crabe est petit et gentil. À la fin, Zoé est contente." }
            options: ["in the park", "at the beach", "at school"]
            answer: "at the beach"
          - id: l1-c5
            type: true_false
            text: "Is Mamie sad at the end?"
            say: { en: "Listen to the story. Is Mamie sad at the end?" }
            audio: { fr: "Il y a du vent. Mamie va au parc avec son parapluie. Oh non ! Le parapluie s'envole. Il vole, il vole, et il tombe dans une flaque. Mamie rit." }
            answer: false
          - id: l1-c6
            type: audio_choice
            text: "What is the story about?"
            say: { en: "Listen to the story. What is it about?" }
            audio: { fr: "Il pleut. Un petit escargot sort dans le jardin. D'abord, il mange une feuille. Puis il mange une fraise. Le soleil arrive, et l'escargot dort sous une fleur." }
            options: ["A snail at the beach", "A snail in the rain", "A snail at school"]
            answer: "A snail in the rain"

  - n: 2
    title: { de: "D'abord, puis, à la fin", en: "D'abord, puis, à la fin" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Where does the hedgehog run?"
            say: { en: "Listen to the story. Where does the hedgehog run?" }
            audio: { fr: "Voici un petit hérisson. Le hérisson a faim. Il trouve une fraise dans le jardin. Miam ! Mais un renard arrive. Le hérisson a peur. Il court sous un arbre." }
            options: [{ object: tree }, { object: house }, { object: boat }]
            answer: tree
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Who comes to see Zoé?"
            say: { en: "Listen to the story. Who comes to see Zoé?" }
            audio: { fr: "C'est l'été. Zoé est à la plage avec son papa. Elle fait un château de sable. Puis un crabe arrive ! Zoé a peur. Mais le crabe est petit et gentil. À la fin, Zoé est contente." }
            options: [{ object: crab }, { object: fish }, { object: dog }]
            answer: crab
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "d'abord, puis, à la fin"
            say: { en: "These words tell you what happens in order. D'abord means first, puis means then, à la fin means in the end.", fr: "D'abord. Puis. À la fin." }
          - say: { en: "Listen to Rex again. Listen for d'abord, puis and à la fin.", fr: "Voici Rex. Rex est un chien. Il a très faim. D'abord, il mange du pain. Puis il boit du lait. À la fin, il est très fatigué et il dort sur le canapé." }
            show: { object: dog }
          - text: "bread, milk, sofa"
            say: { en: "First Rex eats bread, then he drinks milk, in the end he sleeps on the sofa. So the pictures go: bread, milk, sofa." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "Voici Rex. Rex est un chien. Il a très faim. D'abord, il mange du pain. Puis il boit du lait. À la fin, il est très fatigué et il dort sur le canapé." }
                options: [{ object: milk }, { object: sofa }, { object: bread }]
                slot_count: 3
                answer: [bread, milk, sofa]
                hints:
                  - "Listen for d'abord. What does Rex eat first?"
                  - "D'abord le pain, puis le lait."
                  - "Bread, milk, sofa."
                difficulty: easy
              - id: l2-f2
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "Il pleut. Un petit escargot sort dans le jardin. D'abord, il mange une feuille. Puis il mange une fraise. Le soleil arrive, et l'escargot dort sous une fleur." }
                options: [{ object: flower }, { object: leaf }, { object: strawberry }]
                slot_count: 3
                answer: [leaf, strawberry, flower]
                hints:
                  - "What does the snail eat first?"
                  - "D'abord une feuille, puis une fraise."
                  - "Leaf, strawberry, flower."
              - id: l2-f3
                type: audio_choice
                text: "What does the puppy do first?"
                say: { en: "Listen to the story. What does the puppy do first?" }
                audio: { fr: "Léa a un nouveau chiot. D'abord, le chiot boit de l'eau. Puis il joue avec le ballon. À la fin, il dort dans le lit de Léa." }
                options: [{ object: water }, { object: ball }]
                answer: water
                feedback:
                  ball: "The puppy plays with the ball after that. Listen for d'abord: d'abord, le chiot boit de l'eau."
                hints:
                  - "Listen for d'abord."
                  - "D'abord, le chiot boit de l'eau."
                  - "First the puppy drinks water."
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "C'est l'été. Zoé est à la plage avec son papa. Elle fait un château de sable. Puis un crabe arrive ! Zoé a peur. Mais le crabe est petit et gentil. À la fin, Zoé est contente." }
                options: [{ object: happy }, { object: sandcastle }, { object: crab }]
                slot_count: 3
                answer: [sandcastle, crab, happy]
                hints:
                  - "What does Zoé make at the start?"
                  - "The sandcastle, then the crab comes."
                  - "Sandcastle, crab, happy Zoé."
              - id: l2-f5
                type: audio_choice
                text: "What happens in the end?"
                say: { en: "Listen to the story. What happens in the end?" }
                audio: { fr: "Papa et Jules sont sur un bateau. D'abord, ils voient un poisson. Puis ils voient une baleine ! À la fin, il pleut et ils rentrent à la maison." }
                options: [{ object: rain }, { object: whale }, { object: fish }]
                answer: rain
                hints:
                  - "Listen for à la fin."
                  - "À la fin, il pleut."
                  - "In the end it rains."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "Papa et Jules sont sur un bateau. D'abord, ils voient un poisson. Puis ils voient une baleine ! À la fin, il pleut et ils rentrent à la maison." }
                options: [{ object: whale }, { object: rain }, { object: fish }]
                slot_count: 3
                answer: [fish, whale, rain]
                hints: ["D'abord un poisson, puis une baleine."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "Il y a du vent. Mamie va au parc avec son parapluie. Oh non ! Le parapluie s'envole. Il vole, il vole, et il tombe dans une flaque. Mamie rit." }
                options: [{ object: puddle }, { object: park }, { object: umbrella }]
                slot_count: 3
                answer: [park, umbrella, puddle]
                hints: ["Mamie goes to the park first. Then the umbrella flies away."]
              - id: l2-s3
                type: audio_choice
                text: "What does the puppy do in the end?"
                say: { en: "Listen to the story. What does the puppy do in the end?" }
                audio: { fr: "Léa a un nouveau chiot. D'abord, le chiot boit de l'eau. Puis il joue avec le ballon. À la fin, il dort dans le lit de Léa." }
                options: [{ object: bed }, { object: ball }, { object: water }]
                answer: bed
                hints: ["Listen for à la fin: il dort. Dort means sleeps."]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "C'est l'anniversaire de Papi. D'abord, Maman fait un gâteau. Puis elle met des bougies sur le gâteau. À la fin, Papi ouvre son cadeau." }
                options: [{ object: present }, { object: cake }, { object: candle }]
                slot_count: 3
                answer: [cake, candle, present]
                hints: ["You need the cake before you can put candles on it."]
              - id: l2-s5
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "Léa a un nouveau chiot. D'abord, le chiot boit de l'eau. Puis il joue avec le ballon. À la fin, il dort dans le lit de Léa." }
                options: [{ object: ball }, { object: bed }, { object: water }]
                slot_count: 3
                answer: [water, ball, bed]
                hints: ["D'abord l'eau, puis le ballon."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "C'est lundi. Inès prépare son cartable. D'abord, elle met son livre. Puis elle met sa trousse. À la fin, elle met une pomme pour la récré." }
                options: [{ object: apple }, { object: book }, { object: pencil-case }]
                slot_count: 3
                answer: [book, pencil-case, apple]
              - id: l2-n2
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "Tom est à la ferme de Papi. D'abord, il donne à manger au cochon. Puis il donne à manger à la vache. À la fin, il donne à manger à la poule." }
                options: [{ object: cow }, { object: hen }, { object: pig }]
                slot_count: 3
                answer: [pig, cow, hen]
              - id: l2-n3
                type: audio_choice
                text: "What does Sam put on?"
                say: { en: "Listen to the story. What does Sam put on?" }
                audio: { fr: "Le matin, il pleut. Sam met sa veste. L'après-midi, le soleil arrive. Sam joue au foot avec son chien." }
                options: [{ object: jacket }, { object: jumper }, { object: t-shirt }]
                answer: jacket
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Put the pictures in order."
                say: { en: "Listen to the story. Put the pictures in order.", fr: "Il est tard. D'abord, Léo boit son lait. Puis il lit un livre avec Maman. À la fin, il va au lit." }
                options: [{ object: bed }, { object: milk }, { object: book }]
                slot_count: 3
                answer: [milk, book, bed]
              - id: l2-n5
                type: audio_choice
                text: "Who comes to the picnic?"
                say: { en: "Listen to the story. Who comes to the picnic?" }
                audio: { fr: "Emma et son papi font un pique-nique dans le parc. D'abord, ils mangent du fromage. Puis une abeille arrive. À la fin, ils mangent une glace." }
                options: [{ object: bee }, { object: ant }, { object: dog }]
                answer: bee

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: order
            type: ordering
