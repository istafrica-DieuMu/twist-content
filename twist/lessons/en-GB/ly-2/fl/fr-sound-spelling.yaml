# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-sound-spelling
skill: fl.reading.sound-spelling
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Laute und Schreibweisen (Französisch)
  en: French sounds and spellings
summary: >
  French is not written the way an English reader expects. Lesson 1 shows
  silent letters at the end of a word (le chat, le lit, la souris), ou for
  the sound oo (la poule, rouge) and oi for the sound wa (trois, la
  poire); lesson 2 brings eau and au for oh (le bateau, le gâteau), ch for
  sh (le chien) and é (le bébé, le vélo), and ends with the skill check.
  Children hear words and choose the spelling, sort pictures by the
  spelling of their sound, fill missing letters and find the silent
  letter.
metadata:
  year: ly-2
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.word-picture]
  also_practises: [fl.speaking.imitate, fl.culture-strategies.compare-languages]
  vocabulary: { fr: [le chat, le lit, la souris, rouge, la poule, le loup, la bouche, le hibou, trois, le poisson, la poire, "l'étoile", "l'oiseau", le bateau, le gâteau, le chapeau, le cadeau, le seau, le chien, la chaise, le cochon, le bébé, le vélo, "l'éléphant"] }
  forms: [audio, picture, text, drawn]
  drawn: [letter-card, word-card]
  facets: []
  parts:
    - { id: silent, what: { de: stumme Buchstaben am Wortende erkennen, en: recognising silent letters at the end of a word } }
    - { id: ou-oi, what: { de: ou und oi lesen und schreiben, en: reading and spelling ou and oi } }
    - { id: eau, what: { de: eau und au für den Laut o erkennen, en: recognising eau and au for the sound oh } }
    - { id: ch-e, what: { de: ch und é erkennen, en: recognising ch and é } }
  misconceptions:
    - id: english-spelling
      what: Writes a French sound the English way (la pool for la poule, trwa for trois, le bato for le bateau, le shien for le chien)
      addressed: lesson 1 Learn sets ou against English oo and oi against wa, lesson 2 Learn shows eau and ch; l1-f1 gives feedback on la pool and l2-f1 on le bato, and every hear-and-choose task keeps an English-style spelling among the options
    - id: says-every-letter
      what: Expects to hear every letter, so says the t of chat or leaves silent letters out when writing
      addressed: lesson 1 Learn shows the silent t and s; the do-you-hear tasks (l1-f3, l1-s3, l2-w2, l2-c3) and the tap-the-silent-letter tasks (l1-f5, l1-s5, l1-n5) ask about it, and the spelling options keep a version without the silent letter (troi, la poir)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Stumme Buchstaben, ou und oi", en: "Silent letters, ou and oi" }
    goal:
      de: "Find Buchstaben, die man schreibt, aber nicht spricht, so wie bei chat, und hör ou und oi."
      en: "Find letters you write but do not say at the end of French words, and listen for ou and oi."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture is it?"
            show: { drawn: word-card, text: "le chat" }
            options: [{ object: cat }, { object: dog }, { object: chair }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture is it?"
            show: { drawn: word-card, text: "le poisson" }
            options: [{ object: fish }, { object: apple }, { object: door }]
            answer: fish
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "la souris"
            say: { en: "La souris is a mouse. Look at the last letter, s. What do you think: do French people say that s?" }
          - text: "le chat, le lit, la souris"
            say: { en: "No, they don't! In French, the last letter is often silent. You write the t of chat and lit and the s of souris, but you do not say them. Listen.", fr: "le chat, le lit, la souris" }
          - text: "ou: rouge, la souris, la poule"
            say: { en: "The letters o and u together sound like oo in moon. English writes oo; French writes ou.", fr: "rouge, la souris, la poule" }
            show: { object: hen }
          - text: "oi: trois, le poisson, la poire"
            say: { en: "The letters o and i together sound like wa.", fr: "trois, le poisson, la poire" }
            show: { object: pear }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: hen }
                audio: { fr: "la poule" }
                options: ["la poule", "la pool", "la poul"]
                answer: "la poule"
                feedback:
                  "la pool": "That is the English way to write oo. In French, the sound oo is written ou."
                hints:
                  - "Listen for the sound in the middle: oo."
                  - "In French, oo is written o, u."
                  - "la poule"
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                audio: { fr: "trois" }
                options: ["trois", "trwa", "troi"]
                answer: "trois"
                hints:
                  - "Listen for the sound wa."
                  - "Wa is written o, i. And there is a silent letter at the end."
                  - "trois"
              - id: l1-f3
                type: true_false
                text: "Do you hear the s at the end of “la souris”?"
                say: { en: "Listen. Do you hear the s at the end?", fr: "la souris" }
                answer: false
                hints:
                  - "Listen again to the very end."
                  - "Souris ends with the sound ee."
                  - "No. The s is written but not said."
              - id: l1-f4
                type: sorting
                text: "ou or oi?"
                say: { en: "Tap each picture to hear its word. Does the word have ou or oi? Sort the pictures." }
                bins:
                  - { id: ou, show: { text: "ou" } }
                  - { id: oi, show: { text: "oi" } }
                options:
                  - { object: hen, say: { fr: "la poule" }, bin: ou }
                  - { object: pear, say: { fr: "la poire" }, bin: oi }
                  - { object: wolf, say: { fr: "le loup" }, bin: ou }
                  - { object: star, say: { fr: "l'étoile" }, bin: oi }
                hints:
                  - "Listen to each word. Do you hear oo or wa?"
                  - "Oo is written ou; wa is written oi."
                  - "Poule and loup go to ou. Poire and étoile go to oi."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the letter you do not hear."
                say: { en: "Listen. Tap the letter you do not hear.", fr: "le chat" }
                show: { drawn: letter-card, text: "c h a t" }
                spans: ["t"]
                hints:
                  - "Say the word slowly: chat."
                  - "Listen to the end. Which letter makes no sound?"
                  - "The t at the end."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                audio: { fr: "rouge" }
                options: ["rouge", "rooj", "rouje"]
                answer: "rouge"
                hints: ["Oo is written ou. The end is ge."]
              - id: l1-s2
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: pear }
                audio: { fr: "la poire" }
                options: ["la poire", "la pwar", "la poir"]
                answer: "la poire"
                hints: ["Wa is written oi, and poire ends in a silent e."]
              - id: l1-s3
                type: true_false
                text: "Do you hear the t at the end of “le lit”?"
                say: { en: "Listen. Do you hear the t at the end?", fr: "le lit" }
                answer: false
                hints: ["Listen to the end: lit ends with the sound ee."]
              - id: l1-s4
                type: sorting
                text: "ou or oi?"
                say: { en: "Tap each picture to hear its word. Does the word have ou or oi? Sort the pictures." }
                bins:
                  - { id: ou, show: { text: "ou" } }
                  - { id: oi, show: { text: "oi" } }
                options:
                  - { object: mouth, say: { fr: "la bouche" }, bin: ou }
                  - { object: fish, say: { fr: "le poisson" }, bin: oi }
                  - { object: mouse, say: { fr: "la souris" }, bin: ou }
                  - { object: bird, say: { fr: "l'oiseau" }, bin: oi }
                hints: ["Oo is written ou; wa is written oi."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the letter you do not hear."
                say: { en: "Listen. Tap the letter you do not hear.", fr: "trois" }
                show: { drawn: letter-card, text: "t r o i s" }
                spans: ["s"]
                hints: ["Listen to the very end of the word."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: wolf }
                audio: { fr: "le loup" }
                options: ["le loup", "le loo", "le lou"]
                answer: "le loup"
              - id: l1-n2
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: star }
                audio: { fr: "l'étoile" }
                options: ["l'étoile", "l'étwal", "l'étoil"]
                answer: "l'étoile"
              - id: l1-n3
                type: true_false
                text: "“le poisson” has the sound wa."
                say: { en: "Listen. Is that right?", fr: "le poisson" }
                answer: true
              - id: l1-n4
                type: sorting
                text: "ou or oi?"
                say: { en: "Tap each picture to hear its word. Does the word have ou or oi? Sort the pictures." }
                bins:
                  - { id: ou, show: { text: "ou" } }
                  - { id: oi, show: { text: "oi" } }
                options:
                  - { object: wolf, say: { fr: "le loup" }, bin: ou }
                  - { object: bird, say: { fr: "l'oiseau" }, bin: oi }
                  - { object: mouth, say: { fr: "la bouche" }, bin: ou }
                  - { object: star, say: { fr: "l'étoile" }, bin: oi }
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the letter you do not hear."
                say: { en: "Listen. Tap the letter you do not hear.", fr: "le lit" }
                show: { drawn: letter-card, text: "l i t" }
                spans: ["t"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which spelling is right?"
            say: { en: "Listen. Which spelling is right?" }
            show: { object: mouth }
            audio: { fr: "la bouche" }
            options: ["la bouche", "la boosh", "la bouch"]
            answer: "la bouche"
          - id: l1-c2
            type: audio_choice
            text: "Which spelling is right?"
            say: { en: "Listen. Which spelling is right?" }
            show: { object: fish }
            audio: { fr: "le poisson" }
            options: ["le poisson", "le pwasson", "le poison"]
            answer: "le poisson"
          - id: l1-c3
            type: multiple_choice
            option_audio: false
            text: "Which word has the sound oo?"
            say: { en: "Read the words. Which word has the sound oo?" }
            options: ["la poire", "le loup", "trois"]
            answer: "le loup"
          - id: l1-c4
            type: fill_in_blank
            option_audio: false
            text: "Fill in the missing letters."
            say: { en: "Listen. Fill in the missing letters.", fr: "rouge" }
            frame: "r_ge"
            options: ["oo", "ou", "u"]
            answer: ["ou"]
          - id: l1-c5
            type: highlight_in_text
            text: "Tap the letter you do not hear."
            say: { en: "Listen. Tap the letter you do not hear.", fr: "le loup" }
            show: { drawn: letter-card, text: "l o u p" }
            spans: ["p"]
          - id: l1-c6
            type: true_false
            text: "“l'étoile” has the sound oo."
            say: { en: "Listen. Is that right?", fr: "l'étoile" }
            answer: false

  - n: 2
    title: { de: "eau, ch und é", en: "eau, ch and é" }
    goal:
      de: "Hör ein französisches Wort und wähl die richtige Schreibweise, so wie bei bateau oder vélo."
      en: "Hear a French word and choose how it is spelt, like bateau or vélo."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which spelling is right?"
            say: { en: "Listen. Which spelling is right?" }
            show: { object: mouse }
            audio: { fr: "la souris" }
            options: ["la souris", "la soori", "la sourie"]
            answer: "la souris"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Do you hear the t at the end of “le chat”?"
            say: { en: "Listen. Do you hear the t at the end?", fr: "le chat" }
            answer: false
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "le bateau"
            say: { en: "Look at the end of le bateau, a boat: e, a, u. Three letters. What do you think: how many sounds do they make?" }
            show: { object: boat }
          - text: "eau, au: le bateau, le gâteau, le chapeau"
            say: { en: "Just one! The letters e, a, u, or just a, u, sound like oh. English might write o or ow; French writes eau or au.", fr: "le bateau, le gâteau, le chapeau" }
            show: { object: boat }
          - text: "ch: le chat, le chien, le cochon"
            say: { en: "In French, ch sounds like sh in ship, not like ch in chips.", fr: "le chat, le chien, le cochon" }
            show: { object: dog }
          - text: "é: le bébé, le vélo, l'éléphant"
            say: { en: "An e with this accent, é, sounds like ay in day, but short and clean.", fr: "le bébé, le vélo, l'éléphant" }
            show: { object: baby }
          - text: "Did you know? Oiseau, bird, has all five vowels: a, e, i, o, u."
            say: { en: "Did you know? The French word for bird, oiseau, has all five vowels in it: a, e, i, o and u. But oi says wa, and eau says oh, so the whole word sounds like wa-zo!", fr: "l'oiseau" }
            show: { object: bird }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: boat }
                audio: { fr: "le bateau" }
                options: ["le bateau", "le bato", "le batoe"]
                answer: "le bateau"
                feedback:
                  "le bato": "That is how it sounds, but French writes the oh at the end of bateau as eau."
                hints:
                  - "Listen for the sound at the end: oh."
                  - "At the end of a word, oh is often written eau."
                  - "le bateau"
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: dog }
                audio: { fr: "le chien" }
                options: ["le chien", "le shien", "le shyan"]
                answer: "le chien"
                hints:
                  - "Listen for the sound at the start: sh."
                  - "In French, sh is written ch."
                  - "le chien"
              - id: l2-f3
                type: sorting
                text: "eau or ch?"
                say: { en: "Tap each picture to hear its word. Does the word have the sound oh, written eau, or the sound sh, written ch? Sort the pictures." }
                bins:
                  - { id: eau, show: { text: "eau" } }
                  - { id: ch, show: { text: "ch" } }
                options:
                  - { object: boat, say: { fr: "le bateau" }, bin: eau }
                  - { object: cake, say: { fr: "le gâteau" }, bin: eau }
                  - { object: cat, say: { fr: "le chat" }, bin: ch }
                  - { object: chair, say: { fr: "la chaise" }, bin: ch }
                hints:
                  - "Listen to each word: oh or sh?"
                  - "Oh at the end goes to eau; sh goes to ch."
                  - "Bateau and gâteau go to eau. Chat and chaise go to ch."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Fill in the missing letters."
                say: { en: "Listen. Fill in the missing letters.", fr: "le chapeau" }
                show: { object: hat }
                frame: "le chap_"
                options: ["eau", "o", "ow"]
                answer: ["eau"]
                hints:
                  - "Listen to the end: oh."
                  - "It ends like bateau."
                  - "le chapeau"
              - id: l2-f5
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: baby }
                audio: { fr: "le bébé" }
                options: ["le bébé", "le baybay", "le bebe"]
                answer: "le bébé"
                hints:
                  - "Listen for the sound ay, twice."
                  - "In French, ay is written é, with an accent."
                  - "le bébé"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: cake }
                audio: { fr: "le gâteau" }
                options: ["le gâteau", "le gato", "le gâtoe"]
                answer: "le gâteau"
                hints: ["It ends like bateau."]
              - id: l2-s2
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: chair }
                audio: { fr: "la chaise" }
                options: ["la chaise", "la shaise", "la chez"]
                answer: "la chaise"
                hints: ["Sh is written ch."]
              - id: l2-s3
                type: true_false
                text: "In “le vélo”, é sounds like ay."
                say: { en: "Listen. Is that right?", fr: "le vélo" }
                answer: true
                hints: ["Listen to the middle: v, ay, lo."]
              - id: l2-s4
                type: sorting
                text: "eau or ch?"
                say: { en: "Tap each picture to hear its word. Does the word have the sound oh, written eau, or the sound sh, written ch? Sort the pictures." }
                bins:
                  - { id: eau, show: { text: "eau" } }
                  - { id: ch, show: { text: "ch" } }
                options:
                  - { object: dog, say: { fr: "le chien" }, bin: ch }
                  - { object: present, say: { fr: "le cadeau" }, bin: eau }
                  - { object: pig, say: { fr: "le cochon" }, bin: ch }
                  - { object: bucket, say: { fr: "le seau" }, bin: eau }
                hints: ["Oh at the end goes to eau; sh goes to ch."]
              - id: l2-s5
                type: fill_in_blank
                option_audio: false
                text: "Fill in the missing letter."
                say: { en: "Listen. Fill in the missing letter.", fr: "le vélo" }
                show: { object: bike }
                frame: "le v_lo"
                options: ["é", "ay", "e"]
                answer: ["é"]
                hints: ["Ay is written é."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: present }
                audio: { fr: "le cadeau" }
                options: ["le cadeau", "le cado", "le kadeau"]
                answer: "le cadeau"
              - id: l2-n2
                type: audio_choice
                text: "Which spelling is right?"
                say: { en: "Listen. Which spelling is right?" }
                show: { object: pig }
                audio: { fr: "le cochon" }
                options: ["le cochon", "le coshon", "le cochonne"]
                answer: "le cochon"
              - id: l2-n3
                type: true_false
                text: "In “le chat”, ch sounds like ch in chips."
                say: { en: "Listen. Is that right?", fr: "le chat" }
                answer: false
              - id: l2-n4
                type: sorting
                text: "é or ch?"
                say: { en: "Tap each picture to hear its word. Does the word have é or ch? Sort the pictures." }
                bins:
                  - { id: e-acute, show: { text: "é" } }
                  - { id: ch, show: { text: "ch" } }
                options:
                  - { object: baby, say: { fr: "le bébé" }, bin: e-acute }
                  - { object: bike, say: { fr: "le vélo" }, bin: e-acute }
                  - { object: dog, say: { fr: "le chien" }, bin: ch }
                  - { object: pig, say: { fr: "le cochon" }, bin: ch }
              - id: l2-n5
                type: fill_in_blank
                option_audio: false
                text: "Fill in the missing letters."
                say: { en: "Listen. Fill in the missing letters.", fr: "le seau" }
                show: { object: bucket }
                frame: "le s_"
                options: ["eau", "o", "ow"]
                answer: ["eau"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: ou-oi
            type: audio_choice
            text: "Which spelling is right?"
            say: { en: "Listen. Which spelling is right?" }
            show: { object: bird }
            audio: { fr: "l'oiseau" }
            options: ["l'oiseau", "l'wazo", "l'oisau"]
            answer: "l'oiseau"
          - id: l2-c2
            part: eau
            type: audio_choice
            text: "Which spelling is right?"
            say: { en: "Listen. Which spelling is right?" }
            show: { object: hat }
            audio: { fr: "le chapeau" }
            options: ["le chapeau", "le shapo", "le chapo"]
            answer: "le chapeau"
          - id: l2-c3
            part: silent
            type: true_false
            text: "Do you hear the p at the end of “le loup”?"
            say: { en: "Listen. Do you hear the p at the end?", fr: "le loup" }
            answer: false
          - id: l2-c4
            part: ou-oi
            type: sorting
            text: "Sort the pictures: ou or oi?"
            say: { en: "Tap each picture to hear its word. Then put it under ou or oi." }
            bins:
              - { id: ou, show: { text: "ou" } }
              - { id: oi, show: { text: "oi" } }
            options:
              - { object: owl, say: { fr: "le hibou" }, bin: ou }
              - { object: pear, say: { fr: "la poire" }, bin: oi }
              - { object: mouth, say: { fr: "la bouche" }, bin: ou }
              - { object: fish, say: { fr: "le poisson" }, bin: oi }
          - id: l2-c5
            part: ch-e
            type: audio_choice
            text: "Which spelling is right?"
            say: { en: "Listen. Which spelling is right?" }
            show: { object: elephant }
            audio: { fr: "l'éléphant" }
            options: ["l'éléphant", "l'aylayfan", "l'elephant"]
            answer: "l'éléphant"
          - id: l2-c6
            part: silent
            type: highlight_in_text
            text: "Tap every word that ends with a letter you do not hear."
