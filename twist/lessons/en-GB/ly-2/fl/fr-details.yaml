# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-details
skill: fl.listening.details
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Einzelheiten heraushören (Französisch)
  en: Listening for details in French
summary: >
  Picking one detail out of a short French recording. Lesson 1 listens
  for numbers (an age, how many, a bus number) and colours; lesson 2
  listens for names and times on the hour (à quatre heures), and ends
  with the skill check. Every recording holds a second number, colour or
  name, so the child must listen for the one the question asks about.
metadata:
  year: ly-2
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.short-dialogues, fl.themes.numbers-to-20]
  also_practises: [fl.themes.colours, fl.themes.numbers-to-20]
  vocabulary: { fr: ["J'ai ... ans", "il y a", le numéro, rouge, bleu, vert, jaune, noir, blanc, rose, violet, marron, orange, "Il est ... heures", "à ... heures"] }
  forms: [audio, text, drawn]
  drawn: [colour-swatch, clock]
  facets: []
  parts:
    - { id: numbers, what: { de: Zahlen heraushören, en: picking out numbers } }
    - { id: colours, what: { de: Farben heraushören, en: picking out colours } }
    - { id: times, what: { de: Uhrzeiten heraushören, en: picking out times } }
    - { id: names, what: { de: "Namen heraushören und wissen, wer was hat", en: picking out names and who has what } }
  misconceptions:
    - id: other-detail
      what: Picks the first or the other number, colour or name heard instead of the one the question asks about
      addressed: lesson 1 Learn plays Sami saying how many cats before his age; every recording holds a second detail, and l1-f1, l1-f2, l2-f1 and l2-f2 give feedback when the other detail is chosen
    - id: teen-numbers
      what: Hears dix-sept as sept, quatorze as quatre, treize as trois
      addressed: l1-s4, l1-n4, l2-c1 and l2-c5 set the teen number against the small number in the same recording
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zahlen und Farben heraushören", en: "Listening for numbers and colours" }
    goal:
      de: "Hör genau hin und finde die eine Zahl oder Farbe, nach der gefragt wird, so wie neuf ans."
      en: "Listen closely and pick out the one number or colour the question asks for, like neuf ans."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which number do you hear?"
            say: { en: "Listen. Which number do you hear?" }
            audio: { fr: "quinze" }
            options: ["15", "5", "50"]
            answer: "15"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "What is it about?"
            say: { en: "Listen. What is it about?" }
            audio: { turns: [{ fr: "Tu as un animal ?", speaker: female }, { fr: "Oui, j'ai un chien.", speaker: male }] }
            options: ["pets", "food", "the weather"]
            answer: "pets"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { en: "Now listen for one detail. The question tells you what to listen for. Sami says two numbers. Which one is his age?", fr: "Salut, je m'appelle Sami. J'ai deux chats. J'ai neuf ans." }
          - text: "deux chats, neuf ans"
            say: { en: "Deux is how many cats. His age comes with ans: j'ai neuf ans. Sami is nine." }
          - say: { en: "Now a question about a colour. What colour is Clara's bike?", fr: "Je m'appelle Clara. Mon sac est rouge. Mon vélo est bleu." }
          - text: "sac rouge, vélo bleu"
            say: { en: "Rouge goes with the bag. The question asks about the bike, le vélo: bleu, blue." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "How old is Léna?"
                say: { en: "Listen. How old is Léna?" }
                audio: { fr: "Je m'appelle Léna. J'ai trois lapins et j'ai dix ans.", speaker: female }
                options: ["10", "3", "13"]
                answer: "10"
                feedback:
                  "3": "Trois is how many rabbits. Her age comes with ans: dix ans."
                hints:
                  - "There are two numbers. Which one goes with ans?"
                  - "Trois lapins, dix ans."
                  - "Dix ans: Léna is 10."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What colour is Tom's bike?"
                say: { en: "Listen. What colour is Tom's bike?" }
                audio: { fr: "Je m'appelle Tom. Mon vélo est vert. Mon sac est jaune.", speaker: male }
                options: [{ drawn: colour-swatch, colour: green }, { drawn: colour-swatch, colour: yellow }, { drawn: colour-swatch, colour: red }]
                answer: green
                feedback:
                  yellow: "Jaune is the bag. Listen for vélo: mon vélo est vert."
                hints:
                  - "Listen for vélo, the bike."
                  - "Mon vélo est vert."
                  - "Vert is green."
              - id: l1-f3
                type: audio_choice
                text: "Which bus does Hugo take?"
                say: { en: "Listen. Which bus does Hugo take?" }
                audio: { fr: "Je m'appelle Hugo. Je prends le bus numéro quinze. Le bus de Léa, c'est le numéro onze.", speaker: male }
                options: ["15", "11", "5"]
                answer: "15"
                hints:
                  - "Two buses. Which one is Hugo's?"
                  - "Hugo says: je prends le bus numéro quinze."
                  - "Quinze is 15."
              - id: l1-f4
                type: true_false
                text: "Has Zoé got four fish?"
                say: { en: "Listen. Has Zoé got four fish?" }
                audio: { fr: "Zoé a deux chats et quatre poissons." }
                answer: true
                hints:
                  - "Listen for poissons, fish."
                  - "Deux chats, quatre poissons."
                  - "Yes. Quatre poissons: four fish."
              - id: l1-f5
                type: audio_choice
                text: "What colour is the cat?"
                say: { en: "Listen. What colour is the cat?" }
                audio: { fr: "J'ai un chien noir et un chat blanc.", speaker: female }
                options: [{ drawn: colour-swatch, colour: white }, { drawn: colour-swatch, colour: black }, { drawn: colour-swatch, colour: brown }]
                answer: white
                hints:
                  - "Listen for chat, then the colour after it."
                  - "Un chat blanc."
                  - "Blanc is white."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "How many dogs are in the garden?"
                say: { en: "Listen. How many dogs are in the garden?" }
                audio: { fr: "Il y a cinq chats et trois chiens dans le jardin." }
                options: ["3", "5", "8"]
                answer: "3"
                hints: ["Listen for chiens, dogs."]
              - id: l1-s2
                type: audio_choice
                text: "What colour is Inès's dress?"
                say: { en: "Listen. What colour is Inès's dress?" }
                audio: { fr: "Je m'appelle Inès. Ma robe est rose. Mon chapeau est violet.", speaker: female }
                options: [{ drawn: colour-swatch, colour: pink }, { drawn: colour-swatch, colour: purple }, { drawn: colour-swatch, colour: red }]
                answer: pink
                hints: ["La robe is the dress."]
              - id: l1-s3
                type: true_false
                text: "Is Lucas sixteen?"
                say: { en: "Listen. Is Lucas sixteen?" }
                audio: { fr: "Je m'appelle Lucas. J'ai douze ans. Mon frère a seize ans.", speaker: male }
                answer: false
                hints: ["Seize ans is his brother's age. What does Lucas say about himself?"]
              - id: l1-s4
                type: audio_choice
                text: "How old is Malik?"
                say: { en: "Listen. How old is Malik?" }
                audio: { fr: "Ma sœur a sept ans. Moi, j'ai dix-sept ans. Je m'appelle Malik.", speaker: male }
                options: ["17", "7", "10"]
                answer: "17"
                hints: ["Moi means me. Listen to what comes after it."]
              - id: l1-s5
                type: audio_choice
                text: "What colour is the car?"
                say: { en: "Listen. What colour is the car?" }
                audio: { fr: "La voiture est bleue, et le bus est jaune." }
                options: [{ drawn: colour-swatch, colour: blue }, { drawn: colour-swatch, colour: yellow }, { drawn: colour-swatch, colour: green }]
                answer: blue
                hints: ["La voiture is the car."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "How many apples are in the bag?"
                say: { en: "Listen. How many apples are in the bag?" }
                audio: { fr: "Dans mon sac, j'ai deux bananes et six pommes.", speaker: male }
                options: ["6", "2", "8"]
                answer: "6"
              - id: l1-n3
                type: true_false
                text: "Is the first bus number twenty?"
                say: { en: "Listen. Is the first bus number twenty?" }
                audio: { fr: "Voilà le bus numéro vingt ! Le bus numéro douze arrive après." }
                answer: true
              - id: l1-n2
                type: audio_choice
                text: "What colour is Grandpa's hat?"
                say: { en: "Listen. What colour is Grandpa's hat?" }
                audio: { fr: "Le chapeau de Papi est marron. Son pull est vert." }
                options: [{ drawn: colour-swatch, colour: brown }, { drawn: colour-swatch, colour: green }, { drawn: colour-swatch, colour: black }]
                answer: brown
              - id: l1-n4
                type: audio_choice
                text: "How old is Emma?"
                say: { en: "Listen. How old is Emma?" }
                audio: { fr: "Voici Emma. Elle a quatorze ans. Son chien a quatre ans." }
                options: ["14", "4", "40"]
                answer: "14"
                feedback:
                  "40": "Forty? Emma is not a grown-up yet! Elle a quatorze ans: 14."
              - id: l1-n5
                type: audio_choice
                text: "What colour is the ball?"
                say: { en: "Listen. What colour is the ball?" }
                audio: { fr: "Le ballon est orange. Le cerf-volant est rouge." }
                options: [{ drawn: colour-swatch, colour: orange }, { drawn: colour-swatch, colour: red }, { drawn: colour-swatch, colour: yellow }]
                answer: orange

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "How old is Nina?"
            say: { en: "Listen. How old is Nina?" }
            audio: { fr: "Je m'appelle Nina. J'ai huit ans. Mon frère a onze ans.", speaker: female }
            options: ["8", "11", "18"]
            answer: "8"
          - id: l1-c2
            type: audio_choice
            text: "What colour is the pencil?"
            say: { en: "Listen. What colour is the pencil?" }
            audio: { fr: "Ma trousse est verte et mon crayon est bleu.", speaker: female }
            options: [{ drawn: colour-swatch, colour: blue }, { drawn: colour-swatch, colour: green }, { drawn: colour-swatch, colour: red }]
            answer: blue
          - id: l1-c3
            type: true_false
            text: "Are there three ducks on the lake?"
            say: { en: "Listen. Are there three ducks on the lake?" }
            audio: { fr: "Sur le lac, il y a trois canards et deux bateaux." }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "How many balls are there?"
            say: { en: "Listen. How many balls are there?" }
            audio: { fr: "Il y a quatre ballons et onze crayons." }
            options: ["4", "11", "14"]
            answer: "4"
          - id: l1-c5
            type: audio_choice
            text: "What colour is the dog?"
            say: { en: "Listen. What colour is the dog?" }
            audio: { fr: "Le chat est noir. Le chien est blanc." }
            options: [{ drawn: colour-swatch, colour: black }, { drawn: colour-swatch, colour: white }, { drawn: colour-swatch, colour: brown }]
            answer: white
          - id: l1-c6
            type: true_false
            text: "Is Hugo eighteen?"
            say: { en: "Listen. Is Hugo eighteen?" }
            audio: { fr: "Je m'appelle Hugo. J'ai huit ans. Mon cousin a dix-huit ans.", speaker: male }
            answer: false

  - n: 2
    title: { de: "Namen und Uhrzeiten heraushören", en: "Listening for names and times" }
    goal:
      de: "Hör heraus, wer etwas hat und um wie viel Uhr etwas ist, so wie à quatre heures."
      en: "Listen for who has something and what time things happen, like à quatre heures."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "How old is the boy?"
            say: { en: "Listen. How old is the boy?" }
            audio: { fr: "J'ai deux chiens. J'ai neuf ans.", speaker: male }
            options: ["9", "2", "19"]
            answer: "9"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "What colour is the bag?"
            say: { en: "Listen. What colour is the bag?" }
            audio: { fr: "Mon vélo est rouge. Mon sac est bleu.", speaker: male }
            options: [{ drawn: colour-swatch, colour: blue }, { drawn: colour-swatch, colour: red }, { drawn: colour-swatch, colour: yellow }]
            answer: blue
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { en: "When the question asks who, listen for the names and remember who has what. Who has a dog?", fr: "Salut, je suis Jules. Voici mon amie Clara. Clara a un chien." }
          - text: "Jules, Clara: un chien"
            say: { en: "Two names: Jules and Clara. Clara a un chien, so Clara has the dog." }
          - text: "Il est trois heures."
            say: { en: "Times on the hour: il est trois heures, it's three o'clock. Heures means hours.", fr: "Il est trois heures." }
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "à quatre heures"
            say: { en: "Listen for à before the time. La fête est à quatre heures: the party is at four o'clock.", fr: "La fête est à quatre heures." }
            show: { drawn: clock, hour: 4, minute: 0 }
          - text: "Did you know? French children often have a snack after school called le goûter. Some people call it le quatre-heures: the four o'clock!"
            say: { en: "Did you know? After school, French children often have a snack called le goûter. It is eaten at about four o'clock, so some people call it le quatre-heures: the four o'clock!", fr: "le goûter, le quatre-heures" }
            show: { object: chocolate }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "What time is the party?"
                say: { en: "Listen. What time is the party?" }
                audio: { fr: "Viens à ma fête samedi ! C'est à quatre heures. On mange le gâteau à cinq heures.", speaker: female }
                options: [{ drawn: clock, hour: 4, minute: 0 }, { drawn: clock, hour: 5, minute: 0 }, { drawn: clock, hour: 2, minute: 0 }]
                answer: "4:00"
                feedback:
                  "5:00": "Five o'clock is when they eat the cake. The party is à quatre heures."
                hints:
                  - "Two times. Which one goes with the party?"
                  - "C'est à quatre heures."
                  - "Four o'clock."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Who has a cat?"
                say: { en: "Listen. Who has a cat?" }
                audio: { fr: "Je m'appelle Max. J'ai un chien. Ma copine Lina a un chat.", speaker: male }
                options: ["Lina", "Max", "Léo"]
                answer: "Lina"
                feedback:
                  "Max": "Max has a dog. Listen to the end: Lina a un chat."
                hints:
                  - "Two names. Who has which animal?"
                  - "Max: un chien. Lina: un chat."
                  - "Lina has the cat."
              - id: l2-f3
                type: audio_choice
                text: "What time does Tom go to bed?"
                say: { en: "Listen. What time does Tom go to bed?" }
                audio: { fr: "Je m'appelle Tom. Je vais au lit à huit heures. Ma sœur va au lit à neuf heures.", speaker: male }
                options: [{ drawn: clock, hour: 8, minute: 0 }, { drawn: clock, hour: 9, minute: 0 }, { drawn: clock, hour: 7, minute: 0 }]
                answer: "8:00"
                hints:
                  - "Tom talks about himself and about his sister."
                  - "Je vais au lit à huit heures."
                  - "Eight o'clock."
              - id: l2-f4
                type: true_false
                text: "Is the girl called Manon?"
                say: { en: "Listen. Is the girl called Manon?" }
                audio: { fr: "Bonjour ! Je m'appelle Manon. Mon frère s'appelle Paul.", speaker: female }
                answer: true
                hints:
                  - "Listen for je m'appelle."
                  - "Paul is her brother."
                  - "Yes, she is Manon."
              - id: l2-f5
                type: audio_choice
                text: "What time is it now?"
                say: { en: "Listen. What time is it now?" }
                audio: { fr: "Il est onze heures. Le film commence à deux heures." }
                options: [{ drawn: clock, hour: 11, minute: 0 }, { drawn: clock, hour: 2, minute: 0 }, { drawn: clock, hour: 12, minute: 0 }]
                answer: "11:00"
                hints:
                  - "Il est ... heures tells you the time now."
                  - "Il est onze heures. The film is later."
                  - "Eleven o'clock."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Who is ten?"
                say: { en: "Listen. Who is ten?" }
                audio: { fr: "Voici Adam et Julie. Adam a dix ans. Julie a douze ans." }
                options: ["Adam", "Julie", "Noah"]
                answer: "Adam"
                hints: ["Dix is ten. Whose name comes before it?"]
              - id: l2-s2
                type: audio_choice
                text: "What time does school start?"
                say: { en: "Listen. What time does school start?" }
                audio: { fr: "Le bus arrive à sept heures. L'école commence à huit heures." }
                options: [{ drawn: clock, hour: 8, minute: 0 }, { drawn: clock, hour: 7, minute: 0 }, { drawn: clock, hour: 9, minute: 0 }]
                answer: "8:00"
                hints: ["L'école is school."]
              - id: l2-s3
                type: true_false
                text: "Has Léo got a rabbit?"
                say: { en: "Listen. Has Léo got a rabbit?" }
                audio: { fr: "Léo a un poisson. Sa sœur Alice a un lapin." }
                answer: false
                hints: ["Who has the rabbit, Léo or Alice?"]
              - id: l2-s4
                type: audio_choice
                text: "Who likes football?"
                say: { en: "Listen. Who likes football?" }
                audio: { fr: "Moi, c'est Sarah. J'aime danser. Mon ami Yanis aime le foot.", speaker: female }
                options: ["Yanis", "Sarah", "Léa"]
                answer: "Yanis"
                hints: ["Sarah likes dancing. Listen for le foot."]
              - id: l2-s5
                type: audio_choice
                text: "What time is the snack?"
                say: { en: "Listen. What time is the snack?" }
                audio: { fr: "On mange le goûter à quatre heures. Le parc ferme à six heures." }
                options: [{ drawn: clock, hour: 4, minute: 0 }, { drawn: clock, hour: 6, minute: 0 }, { drawn: clock, hour: 10, minute: 0 }]
                answer: "4:00"
                hints: ["Le goûter is the afternoon snack."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "What time is swimming?"
                say: { en: "Listen. What time is swimming?" }
                audio: { fr: "La piscine, c'est à trois heures. Le foot, c'est à cinq heures." }
                options: [{ drawn: clock, hour: 3, minute: 0 }, { drawn: clock, hour: 5, minute: 0 }, { drawn: clock, hour: 1, minute: 0 }]
                answer: "3:00"
              - id: l2-n3
                type: true_false
                text: "Is it seven o'clock?"
                say: { en: "Listen. Is it seven o'clock?" }
                audio: { fr: "Il est sept heures. Vite, au lit !" }
                answer: true
              - id: l2-n2
                type: audio_choice
                text: "Who has a red bike?"
                say: { en: "Listen. Who has a red bike?" }
                audio: { fr: "Je m'appelle Ethan. Mon vélo est bleu. Le vélo de Rose est rouge.", speaker: male }
                options: ["Rose", "Ethan", "Mia"]
                answer: "Rose"
              - id: l2-n4
                type: audio_choice
                text: "Who is the teacher?"
                say: { en: "Listen. Who is the teacher?" }
                audio: { fr: "Voici Lucie, une élève. Et voici Madame Martin, la maîtresse." }
                options: ["Madame Martin", "Lucie", "Madame Petit"]
                answer: "Madame Martin"
              - id: l2-n5
                type: audio_choice
                text: "What time does Grandpa come?"
                say: { en: "Listen. What time does Grandpa come?" }
                audio: { fr: "Papi arrive à six heures. Mamie arrive à dix heures." }
                options: [{ drawn: clock, hour: 6, minute: 0 }, { drawn: clock, hour: 10, minute: 0 }, { drawn: clock, hour: 2, minute: 0 }]
                answer: "6:00"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: numbers
            type: audio_choice
            text: "How old is Ali?"
            say: { en: "Listen. How old is Ali?" }
            audio: { fr: "Mon frère a cinq ans. Moi, j'ai quinze ans. Je m'appelle Ali.", speaker: male }
            options: ["15", "5", "50"]
            answer: "15"
          - id: l2-c2
            part: colours
            type: audio_choice
            text: "What colour is Sophie's bag?"
            say: { en: "Listen. What colour is Sophie's bag?" }
            audio: { fr: "Le sac de Sophie est violet. Sa trousse est rose." }
            options: [{ drawn: colour-swatch, colour: purple }, { drawn: colour-swatch, colour: pink }, { drawn: colour-swatch, colour: blue }]
            answer: purple
          - id: l2-c3
            part: times
            type: audio_choice
            text: "What time is Noé's party?"
            say: { en: "Listen. What time is Noé's party?" }
            audio: { fr: "La fête de Noé est à deux heures. On mange le gâteau à trois heures." }
            options: [{ drawn: clock, hour: 2, minute: 0 }, { drawn: clock, hour: 3, minute: 0 }, { drawn: clock, hour: 12, minute: 0 }]
            answer: "2:00"
          - id: l2-c4
            part: names
            type: audio_choice
            text: "Who has a dog?"
            say: { en: "Listen. Who has a dog?" }
            audio: { fr: "Moi, c'est Hana. J'ai un lapin. Mon cousin Théo a un chien.", speaker: female }
            options: ["Théo", "Hana", "Max"]
            answer: "Théo"
          - id: l2-c5
            part: numbers
            type: audio_choice
            text: "How many cats has Grandma got?"
            say: { en: "Listen. How many cats has Grandma got?" }
            audio: { fr: "Chez Mamie, il y a deux chiens et treize chats !" }
            options: ["13", "3", "2"]
            answer: "13"
          - id: l2-c6
            part: numbers
            type: audio_choice
            text: "How many pencils has Jade got?"
            say: { en: "Listen. How many pencils has Jade got?" }
            audio: { fr: "Je m'appelle Jade. J'ai douze crayons et deux gommes.", speaker: female }
            options: ["2", "12", "20"]
            answer: "12"
          - id: l2-c7
            part: numbers
            type: true_false
            text: "Does Sam take bus number nineteen?"
            say: { en: "Listen. Does Sam take bus number nineteen?" }
            audio: { fr: "Je prends le bus numéro neuf. Mon ami Sam prend le bus numéro dix-neuf.", speaker: male }
            answer: true
          - id: l2-c8
            part: numbers
            type: audio_choice
            text: "How old is Lou's sister?"
            say: { en: "Listen. How old is Lou's sister?" }
            audio: { fr: "Je m'appelle Lou. J'ai six ans. Ma sœur a seize ans.", speaker: female }
            options: ["6", "10", "16"]
            answer: "16"
          - id: l2-c9
            part: colours
            type: audio_choice
            text: "What colour is Paul's jumper?"
