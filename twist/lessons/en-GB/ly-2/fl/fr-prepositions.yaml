# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-prepositions
skill: fl.grammar.prepositions
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Wo ist es? (Französisch)
  en: Where is it? in French
summary: >
  Saying where something is in French. Lesson 1 brings dans, sur and sous
  (sur is on, sous is under, though they sound alike); lesson 2 adds à
  côté de and derrière, answers Où est ... ? with Il est ... or Elle est
  ..., and ends with the skill check. Children hear where things are and
  choose the English meaning, fill the gap, build the sentence and say
  it. A picture of a scene (a cat under a table) needs a scene component
  the bank does not have yet, so the tasks work with words, sentences and
  the two pictures side by side.
metadata:
  year: ly-2
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.questions, fl.themes.home]
  also_practises: [fl.themes.home, fl.speaking.ask-answer]
  vocabulary: { fr: [dans, sur, sous, "à côté de", derrière, "Où est ... ?", "Il est ...", "Elle est ..."] }
  forms: [audio, text, picture]
  drawn: []
  facets: []
  parts:
    - { id: dans-sur-sous, what: { de: "dans, sur und sous verstehen", en: "understanding dans, sur and sous" } }
    - { id: cote-derriere, what: { de: à côté de und derrière verstehen, en: understanding à côté de and derrière } }
    - { id: say-where, what: { de: "auf Französisch sagen, wo etwas ist", en: saying in French where something is } }
  misconceptions:
    - id: sur-sous
      what: Mixes up sur (on) and sous (under) because they sound alike
      addressed: lesson 1 Learn sets sur against sous; l1-f2 gives feedback when sur is taken for under, sur and sous share every option set in lesson 1, and l2-c1 asks for sous with on among the options
    - id: a-cote-without-de
      what: Leaves out de and says à côté la porte
      addressed: lesson 2 Learn says à côté de is three words; l2-f4 gives feedback on à côté, and l2-n4 and l2-c4 keep à côté among the options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "dans, sur, sous", en: "dans, sur, sous" }
    goal:
      de: "Hör, ob etwas in, auf oder unter etwas ist, und verwechsle sur und sous nicht."
      en: "Hear if something is in, on or under, and don't mix up sur and sous."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tap the room you hear."
            say: { en: "Listen. Tap the room." }
            audio: { fr: "la chambre" }
            options: [{ object: bedroom }, { object: kitchen }, { object: bathroom }]
            answer: bedroom
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which answer fits the question?"
            say: { en: "Listen to the question. Which answer fits?" }
            audio: { fr: "Où est le chat ?" }
            options: ["Dans le jardin.", "Trois.", "C'est un chat."]
            answer: "Dans le jardin."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Le chat est dans la boîte."
            say: { en: "Dans means in. Le chat est dans la boîte: the cat is in the box.", fr: "Le chat est dans la boîte." }
            show: { objects: [cat, box] }
          - text: "Le livre est sur la table."
            say: { en: "Sur means on. Le livre est sur la table: the book is on the table.", fr: "Le livre est sur la table." }
            show: { objects: [book, table] }
          - text: "Le ballon est sous la chaise."
            say: { en: "Sous means under. Le ballon est sous la chaise: the ball is under the chair. Sur and sous sound alike. Sur, with a u, is on. Sous, with ou, is under.", fr: "Le ballon est sous la chaise." }
            show: { objects: [ball, chair] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Where is the cat?"
                say: { en: "Listen. Where is the cat?" }
                audio: { fr: "Le chat est dans la boîte." }
                options: ["in the box", "on the box", "under the box"]
                answer: "in the box"
                hints:
                  - "Listen for the small word before la boîte."
                  - "Le chat est dans la boîte."
                  - "Dans means in."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Where is the book?"
                say: { en: "Listen. Where is the book?" }
                audio: { fr: "Le livre est sur la table." }
                options: ["on the table", "under the table", "in the table"]
                answer: "on the table"
                feedback:
                  "under the table": "Sur and sous sound alike. Sur is on; sous is under."
                hints:
                  - "Listen for the small word before la table."
                  - "Is it sur or sous? Sur has the sound u."
                  - "Sur means on."
              - id: l1-f3
                type: matching
                option_audio: false
                text: "Match each French word with its meaning."
                say: { en: "Tap a French word, then its English meaning." }
                pairs:
                  - left: { text: "dans" }
                    right: { text: "in" }
                  - left: { text: "sur" }
                    right: { text: "on" }
                  - left: { text: "sous" }
                    right: { text: "under" }
                hints:
                  - "Start with dans."
                  - "Sur, with a u, means on. Sous, with ou, means under."
                  - "Dans: in. Sur: on. Sous: under."
              - id: l1-f4
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence.\nThe ball is under the chair."
                show: { objects: [ball, chair] }
                frame: "Le ballon est _ la chaise."
                options: ["sous", "sur", "dans"]
                answer: ["sous"]
                hints:
                  - "Where is the ball? Under the chair."
                  - "Is under sous or sur?"
                  - "Le ballon est sous la chaise."
              - id: l1-f5
                type: speak
                text: "Say in French: The cat is on the bed."
                say: { en: "Say in French: The cat is on the bed.", fr: "Le chat est sur le lit." }
                show: { objects: [cat, bed] }
                expected_text: "Le chat est sur le lit."
                hints:
                  - "Start with le chat est."
                  - "On is sur."
                  - "Say it with me: Le chat est sur le lit."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Where is the pencil?"
                say: { en: "Listen. Where is the pencil?" }
                audio: { turns: [{ fr: "Où est mon crayon ?", speaker: male }, { fr: "Il est sous le livre.", speaker: female }] }
                options: ["under the book", "in the book", "on the book"]
                answer: "under the book"
                hints: ["Listen for the word before le livre."]
              - id: l1-s2
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence.\nThe apple is in the schoolbag."
                show: { objects: [apple, schoolbag] }
                frame: "La pomme est _ le cartable."
                options: ["dans", "sur", "sous"]
                answer: ["dans"]
                hints: ["In is dans."]
              - id: l1-s3
                type: true_false
                text: "Le chien est sur le lit.\nDoes that mean the dog is on the bed?"
                answer: true
                hints: ["Sur means on."]
              - id: l1-s4
                type: ordering
                option_audio: false
                text: "Build the sentence: The mouse is under the table."
                say: { en: "Build the sentence: The mouse is under the table." }
                options: ["sous", "La souris", "la table.", "est"]
                slot_count: 4
                answer: ["La souris", "est", "sous", "la table."]
                hints: ["The sentence starts with la souris est."]
              - id: l1-s5
                type: speak
                text: "Say in French: The ball is in the box."
                say: { en: "Say in French: The ball is in the box.", fr: "Le ballon est dans la boîte." }
                show: { objects: [ball, box] }
                expected_text: "Le ballon est dans la boîte."
                hints: ["Say it with me: Le ballon est dans la boîte."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Where are the shoes?"
                say: { en: "Listen. Where are the shoes?" }
                audio: { fr: "Les chaussures sont sous le lit." }
                options: ["under the bed", "on the bed", "in the bed"]
                answer: "under the bed"
              - id: l1-n2
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence.\nThe lamp is on the table."
                show: { objects: [lamp, table] }
                frame: "La lampe est _ la table."
                options: ["sur", "sous", "dans"]
                answer: ["sur"]
              - id: l1-n3
                type: true_false
                text: "Le chat est sous la chaise.\nDoes that mean the cat is on the chair?"
                answer: false
              - id: l1-n4
                type: ordering
                option_audio: false
                text: "Build the sentence: The book is in the schoolbag."
                say: { en: "Build the sentence: The book is in the schoolbag." }
                options: ["dans", "Le livre", "le cartable.", "est"]
                slot_count: 4
                answer: ["Le livre", "est", "dans", "le cartable."]
              - id: l1-n5
                type: audio_choice
                text: "Where is the teddy?"
                say: { en: "Listen. Where is the teddy?" }
                audio: { fr: "Le nounours est sur le canapé." }
                options: ["on the sofa", "under the sofa", "in the sofa"]
                answer: "on the sofa"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Where is the mouse?"
            say: { en: "Listen. Where is the mouse?" }
            audio: { fr: "La souris est sous la table." }
            options: ["under the table", "on the table", "in the table"]
            answer: "under the table"
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "How do you say “under” in French?"
            say: { en: "How do you say under in French?" }
            options: ["sur", "dans", "sous"]
            answer: "sous"
          - id: l1-c3
            type: true_false
            text: "Listen. Is the cat in the box?"
            say: { en: "Listen. Is the cat in the box?", fr: "Le chat est sur la boîte." }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "Where is the book?"
            say: { en: "Listen. Where is the book?" }
            audio: { fr: "Le livre est sous la chaise." }
            options: ["on the chair", "under the chair", "in the chair"]
            answer: "under the chair"
          - id: l1-c5
            type: ordering
            option_audio: false
            text: "Build the sentence: The ball is on the bed."
            say: { en: "Build the sentence: The ball is on the bed." }
            options: ["sur", "le lit.", "Le ballon", "est"]
            slot_count: 4
            answer: ["Le ballon", "est", "sur", "le lit."]
          - id: l1-c6
            type: multiple_choice
            text: "What does “dans” mean?"
            say: { en: "What does dans mean?" }
            options: ["on", "in", "under"]
            answer: "in"

  - n: 2
    title: { de: "à côté de, derrière", en: "à côté de, derrière" }
    goal:
      de: "Sag auf Französisch, wo etwas ist, auch neben oder hinter etwas, so wie il est derrière la porte."
      en: "Say in French where something is, even next to or behind, like il est derrière la porte."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Where is the ball?"
            say: { en: "Listen. Where is the ball?" }
            audio: { fr: "Le ballon est sur la chaise." }
            options: ["on the chair", "under the chair", "in the chair"]
            answer: "on the chair"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            option_audio: false
            text: "Finish the sentence.\nThe dog is under the table."
            show: { objects: [dog, table] }
            frame: "Le chien est _ la table."
            options: ["sous", "sur", "dans"]
            answer: ["sous"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Le chat est à côté de la lampe."
            say: { en: "À côté de means next to. It is three words, so keep all three: à côté de.", fr: "Le chat est à côté de la lampe." }
            show: { objects: [cat, lamp] }
          - text: "Le chien est derrière la porte."
            say: { en: "Derrière means behind. Le chien est derrière la porte: the dog is behind the door.", fr: "Le chien est derrière la porte." }
            show: { objects: [dog, door] }
          - text: "Où est le chat ?\nIl est sous la table.\nOù est la souris ?\nElle est dans la boîte."
            say: { en: "Answer Où est ... ? with il est and the place: il est sous la table. For a une noun, say elle: Où est la souris ? Elle est dans la boîte.", fr: "Où est le chat ? Il est sous la table. Où est la souris ? Elle est dans la boîte." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Where is the dog?"
                say: { en: "Listen. Where is the dog?" }
                audio: { fr: "Le chien est derrière la porte." }
                options: ["behind the door", "next to the door", "on the door"]
                answer: "behind the door"
                hints:
                  - "Listen for the word before la porte."
                  - "Derrière."
                  - "Derrière means behind."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Where is the schoolbag?"
                say: { en: "Listen. Where is the schoolbag?" }
                audio: { fr: "Le cartable est à côté de la chaise." }
                options: ["next to the chair", "behind the chair", "under the chair"]
                answer: "next to the chair"
                hints:
                  - "Listen for the words before la chaise."
                  - "À côté de la chaise."
                  - "À côté de means next to."
              - id: l2-f3
                type: matching
                option_audio: false
                text: "Match each French word with its meaning."
                say: { en: "Tap a French word, then its English meaning." }
                pairs:
                  - left: { text: "dans" }
                    right: { text: "in" }
                  - left: { text: "sur" }
                    right: { text: "on" }
                  - left: { text: "sous" }
                    right: { text: "under" }
                  - left: { text: "à côté de" }
                    right: { text: "next to" }
                  - left: { text: "derrière" }
                    right: { text: "behind" }
                hints:
                  - "Start with the two new ones."
                  - "À côté de is next to; derrière is behind."
                  - "Dans: in. Sur: on. Sous: under. À côté de: next to. Derrière: behind."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence.\nThe cat is next to the lamp."
                show: { objects: [cat, lamp] }
                frame: "Le chat est _ la lampe."
                options: ["à côté de", "à côté", "derrière"]
                answer: ["à côté de"]
                feedback:
                  "à côté": "Nearly! Next to is three words: à côté de."
                hints:
                  - "Next to is à côté de."
                  - "Count the words: à, côté, de."
                  - "Le chat est à côté de la lampe."
              - id: l2-f5
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Où est la souris ?" }
                options: ["Elle est sous le lit.", "Il y a deux souris.", "C'est une souris."]
                answer: "Elle est sous le lit."
                hints:
                  - "Où asks where."
                  - "The answer needs a place word."
                  - "Elle est sous le lit."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Where is Dad?"
                say: { en: "Listen. Where is Dad?" }
                audio: { turns: [{ fr: "Où est Papa ?", speaker: female }, { fr: "Il est derrière la maison.", speaker: male }] }
                options: ["behind the house", "in the house", "next to the house"]
                answer: "behind the house"
                hints: ["Listen for the word before la maison."]
              - id: l2-s2
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence.\nThe ball is behind the sofa."
                show: { objects: [ball, sofa] }
                frame: "Le ballon est _ le canapé."
                options: ["derrière", "dans", "sur"]
                answer: ["derrière"]
                hints: ["Behind is derrière."]
              - id: l2-s3
                type: true_false
                text: "La lampe est à côté de la fenêtre.\nDoes that mean the lamp is next to the window?"
                answer: true
                hints: ["À côté de means next to."]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Build the answer: It's next to the door."
                say: { en: "Build the answer: It's next to the door." }
                options: ["à côté de", "Il est", "la porte."]
                slot_count: 3
                answer: ["Il est", "à côté de", "la porte."]
                hints: ["Start with il est."]
              - id: l2-s5
                type: speak
                text: "Answer in French: It's behind the door."
                say: { en: "Answer in French: It's behind the door.", fr: "Il est derrière la porte." }
                show: { objects: [dog, door] }
                expected_text: "Il est derrière la porte."
                hints: ["Say it with me: Il est derrière la porte."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Where is the bike?"
                say: { en: "Listen. Where is the bike?" }
                audio: { fr: "Le vélo est à côté de la maison." }
                options: ["next to the house", "behind the house", "in the house"]
                answer: "next to the house"
              - id: l2-n2
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence.\nThe dog is behind the tree."
                show: { objects: [dog, tree] }
                frame: "Le chien est _ l'arbre."
                options: ["derrière", "sous", "dans"]
                answer: ["derrière"]
              - id: l2-n3
                type: true_false
                text: "Le chat est derrière la chaise.\nDoes that mean the cat is next to the chair?"
                answer: false
              - id: l2-n4
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence.\nThe book is next to the lamp."
                show: { objects: [book, lamp] }
                frame: "Le livre est _ la lampe."
                options: ["à côté de", "à côté", "sur"]
                answer: ["à côté de"]
              - id: l2-n5
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Où est le ballon ?" }
                options: ["Il est sous la chaise.", "C'est un ballon.", "Il y a trois ballons."]
                answer: "Il est sous la chaise."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: dans-sur-sous
            type: audio_choice
            text: "Where is the teddy?"
            say: { en: "Listen. Where is the teddy?" }
            audio: { fr: "Le nounours est sous le lit." }
            options: ["under the bed", "on the bed", "next to the bed"]
            answer: "under the bed"
          - id: l2-c2
            part: cote-derriere
            type: audio_choice
            text: "Where is the cat?"
            say: { en: "Listen. Where is the cat?" }
            audio: { fr: "Le chat est derrière le canapé." }
            options: ["behind the sofa", "next to the sofa", "on the sofa"]
            answer: "behind the sofa"
          - id: l2-c3
            part: say-where
            type: fill_in_blank
            option_audio: false
            text: "Finish the sentence.\nThe pencil is on the book."
            show: { objects: [pencil, book] }
            frame: "Le crayon est _ le livre."
            options: ["sur", "sous", "dans"]
            answer: ["sur"]
          - id: l2-c4
            part: say-where
            type: fill_in_blank
            option_audio: false
            text: "Finish the sentence.\nThe chair is next to the table."
            show: { objects: [chair, table] }
            frame: "La chaise est _ la table."
            options: ["à côté de", "à côté", "derrière"]
            answer: ["à côté de"]
          - id: l2-c5
            part: say-where
            type: ordering
            option_audio: false
            text: "Build the sentence: The rabbit is in the garden."
            say: { en: "Build the sentence: The rabbit is in the garden." }
            options: ["dans", "Le lapin", "le jardin.", "est"]
            slot_count: 4
            answer: ["Le lapin", "est", "dans", "le jardin."]
          - id: l2-c6
            part: dans-sur-sous
            type: audio_choice
            text: "Where is the ball?"
            say: { en: "Listen. Where is the ball?" }
            audio: { fr: "Le ballon est sous le canapé." }
            options: ["on the sofa", "under the sofa", "behind the sofa"]
            answer: "under the sofa"
          - id: l2-c7
            part: dans-sur-sous
            type: audio_choice
            text: "Where are the shoes?"
            say: { en: "Listen. Where are the shoes?" }
            audio: { fr: "Les chaussures sont sur la table." }
            options: ["under the table", "behind the table", "on the table"]
            answer: "on the table"
          - id: l2-c8
            part: dans-sur-sous
            type: true_false
            text: "Listen. Is the ball under the bed?"
            say: { en: "Listen. Is the ball under the bed?", fr: "Le ballon est sur le lit." }
            answer: false
          - id: l2-c9
            part: dans-sur-sous
            type: multiple_choice
            text: "What does “sous” mean?"
            say: { en: "What does sous mean?" }
            options: ["under", "on", "in"]
            answer: "under"
          - id: l2-c10
            part: dans-sur-sous
            type: audio_choice
            text: "Where is the mouse?"
            say: { en: "Listen. Where is the mouse?" }
            audio: { fr: "La souris est dans le cartable." }
            options: ["under the schoolbag", "on the schoolbag", "in the schoolbag"]
            answer: "in the schoolbag"
          - id: l2-c11
            part: dans-sur-sous
            type: multiple_choice
            option_audio: false
            text: "How do you say “on” in French?"
            say: { en: "How do you say on in French?" }
            options: ["sous", "sur", "dans"]
            answer: "sur"
          - id: l2-c12
            part: cote-derriere
            type: audio_choice
            text: "Where is the cat?"
            say: { en: "Listen. Where is the cat?" }
            audio: { fr: "Le chat est à côté de la porte." }
            options: ["behind the door", "next to the door", "in the door"]
            answer: "next to the door"
          - id: l2-c13
            part: cote-derriere
            type: audio_choice
            text: "Where is the bike?"
            say: { en: "Listen. Where is the bike?" }
            audio: { fr: "Le vélo est derrière l'arbre." }
            options: ["next to the tree", "on the tree", "behind the tree"]
            answer: "behind the tree"
          - id: l2-c14
            part: cote-derriere
            type: true_false
            text: "Listen. Is the dog next to the house?"
            say: { en: "Listen. Is the dog next to the house?", fr: "Le chien est à côté de la maison." }
            answer: true
          - id: l2-c15
            part: cote-derriere
            type: multiple_choice
            text: "What does “derrière” mean?"
            say: { en: "What does derrière mean?" }
            options: ["next to", "behind", "under"]
            answer: "behind"
          - id: l2-c16
            part: cote-derriere
            type: audio_choice
