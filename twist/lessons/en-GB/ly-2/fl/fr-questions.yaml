# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-questions
skill: fl.grammar.questions
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Fragen stellen und verstehen (Französisch)
  en: Asking and understanding questions in French
summary: >
  French questions with a question word and yes/no questions. Lesson 1
  brings Qu'est-ce que c'est ?, Où ... ?, Qui est-ce ? and Combien de ... ?,
  what each one asks for and which answer fits; lesson 2 asks yes/no
  questions with a rising voice or with est-ce que (Tu as un chien ?
  Est-ce que tu aimes la pizza ?), answers them with oui or non and the
  right verb, builds questions from word cards, and ends with the skill
  check. Instructions are in English; the French is heard and shown in
  short form.
metadata:
  year: ly-2
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks]
  also_practises: [fl.themes.numbers-to-10, fl.themes.food]
  vocabulary: { fr: ["Qu'est-ce que c'est ?", "C'est ...", "Où est ... ?", "Qui est-ce ?", "Combien de ... ?", "Est-ce que ... ?", "Tu as ... ?", "Tu aimes ... ?", oui, non, "je n'ai pas de", "je n'aime pas"] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: wh-meaning, what: { de: "verstehen, wonach ein Fragewort fragt", en: understanding what a question word asks for } }
    - { id: wh-answer, what: { de: die passende Antwort auf eine Frage mit Fragewort wählen, en: choosing the answer that fits a question-word question } }
    - { id: yes-no, what: { de: Ja-Nein-Fragen verstehen und kurz antworten, en: understanding yes/no questions and answering them } }
    - { id: build, what: { de: Fragen auf Französisch bilden, en: making questions in French } }
  misconceptions:
    - id: qui-quest-ce
      what: Mixes up qui (who) and qu'est-ce que (what) because both start with qu
      addressed: lesson 1 Learn sets qui against qu'est-ce que; l1-f2 gives feedback when qui is taken for what, l1-s3, l1-s4 and l1-c1 ask for who or what with the other among the options, and l2-c2 asks Qui est-ce ? with a thing among the answers
    - id: answer-verb
      what: Answers a yes/no question with the wrong verb (Tu as un chat ? Oui, j'aime les chats.)
      addressed: lesson 2 Learn pairs Tu as with j'ai and Tu aimes with j'aime; l2-f1 gives feedback on j'aime, and l2-s1, l2-n1 and l2-c3 keep the other verb among the options
    - id: question-order
      what: Expects a French question to need a helper word in front, as English needs do or have, and changes the order of the sentence
      addressed: lesson 2 Learn shows that Tu as un chien ? is the sentence with a question voice, and that est-ce que goes in front without changing the rest; an ordering task in every stage of lesson 2 and in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Fragewörter", en: "Question words" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "What is the girl called?"
            say: { en: "Listen. What is the girl called?" }
            audio: { fr: "Bonjour ! Je m'appelle Léa.", speaker: female }
            options: ["Léa", "Lucas", "Emma"]
            answer: "Léa"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "How old is the boy?"
            say: { en: "Listen. How old is the boy?" }
            audio: { fr: "Salut ! J'ai huit ans.", speaker: male }
            options: ["8", "9", "10"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "Qu'est-ce que c'est ?\nC'est un chat."
            say: { en: "Qu'est-ce que c'est ? means What is it? The answer: C'est un chat, it's a cat.", fr: "Qu'est-ce que c'est ? C'est un chat." }
            show: { object: cat }
          - text: "Où est le chien ?\nDans le jardin."
            say: { en: "Où means where. Où est le chien ? Where is the dog? The answer is a place: dans le jardin, in the garden. Où has a little accent; without it, ou means or.", fr: "Où est le chien ? Dans le jardin." }
            show: { object: garden }
          - text: "Qui est-ce ?\nC'est Mamie."
            say: { en: "Qui means who. Qui est-ce ? Who is it? The answer is a person: C'est Mamie. Qui and qu'est-ce que both start with qu. Qui asks who; qu'est-ce que asks what.", fr: "Qui est-ce ? C'est Mamie." }
            show: { object: grandma }
          - text: "Combien de chats ?\nTrois."
            say: { en: "Combien means how many. Combien de chats ? How many cats? The answer is a number: trois.", fr: "Combien de chats ? Trois." }
            show: { object: cat, count: 3, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What does “où” mean?"
                options: ["where", "who", "what"]
                answer: "where"
                hints:
                  - "Où est le chien ? The answer was dans le jardin."
                  - "Dans le jardin is a place. Which question word asks for a place?"
                  - "Où means where."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What does “qui” mean?"
                options: ["who", "what", "how many"]
                answer: "who"
                feedback:
                  "what": "Qu'est-ce que asks what. Qui on its own asks who."
                hints:
                  - "Qui est-ce ? C'est Mamie."
                  - "Mamie is a person. Which question word asks for a person?"
                  - "Qui means who."
              - id: l1-f3
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Combien de pommes ?" }
                options: ["Trois.", "Dans la cuisine.", "C'est Papa."]
                answer: "Trois."
                hints:
                  - "Listen for the question word: combien."
                  - "Combien asks how many, so the answer is a number."
                  - "Trois."
              - id: l1-f4
                type: audio_choice
                text: "Look at the picture. Which answer fits the question?"
                say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
                show: { object: apple }
                audio: { fr: "Qu'est-ce que c'est ?" }
                options: ["C'est une pomme.", "C'est Mamie.", "Deux."]
                answer: "C'est une pomme."
                hints:
                  - "Qu'est-ce que c'est ? asks what something is."
                  - "The answer is a thing. What is in the picture?"
                  - "C'est une pomme."
              - id: l1-f5
                type: matching
                option_audio: false
                text: "Match each question with its meaning."
                say: { en: "Tap a French question, then what it means." }
                pairs:
                  - left: { text: "Qu'est-ce que c'est ?" }
                    right: { text: "What is it?" }
                  - left: { text: "Où ... ?" }
                    right: { text: "Where ...?" }
                  - left: { text: "Qui est-ce ?" }
                    right: { text: "Who is it?" }
                  - left: { text: "Combien de ... ?" }
                    right: { text: "How many ...?" }
                hints:
                  - "Start with the one you are sure of."
                  - "Qui and qu'est-ce que both start with qu: qui is the person one."
                  - "Qu'est-ce que c'est: What is it? Où: Where? Qui est-ce: Who is it? Combien: How many?"

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What does the question ask for?"
                say: { en: "Listen. What does the question ask for?" }
                audio: { fr: "Où est le chat ?" }
                options: ["a place", "a number", "a person"]
                answer: "a place"
                hints: ["Où means where."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Which question asks how many?"
                options: ["Combien de chiens ?", "Où est le chien ?", "Qui est-ce ?"]
                answer: "Combien de chiens ?"
                hints: ["How many is combien."]
              - id: l1-s3
                type: audio_choice
                text: "Look at the picture. Which answer fits the question?"
                say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
                show: { object: dad }
                audio: { fr: "Qui est-ce ?" }
                options: ["C'est Papa.", "C'est un livre.", "Cinq."]
                answer: "C'est Papa."
                hints: ["Qui asks who, so the answer is a person."]
              - id: l1-s4
                type: true_false
                text: "“Qu'est-ce que c'est ?” asks who someone is."
                say: { en: "Read it. Is that right?" }
                answer: false
                hints: ["Qu'est-ce que c'est ? is answered with C'est un chat."]
              - id: l1-s5
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Où est Maman ?" }
                options: ["Dans le jardin.", "Deux.", "C'est un chat."]
                answer: "Dans le jardin."
                hints: ["Où asks where, so the answer is a place."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                option_audio: false
                text: "Which question asks where?"
                options: ["Où est le livre ?", "Qui est-ce ?", "Qu'est-ce que c'est ?"]
                answer: "Où est le livre ?"
              - id: l1-n2
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Combien de chats ?" }
                options: ["Quatre.", "C'est un chat.", "Dans la maison."]
                answer: "Quatre."
              - id: l1-n3
                type: multiple_choice
                text: "What does “combien” mean?"
                options: ["how many", "where", "who"]
                answer: "how many"
              - id: l1-n4
                type: true_false
                text: "“Où est le chien ?” asks where the dog is."
                say: { en: "Read it. Is that right?" }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "Look at the picture. Which answer fits the question?"
                say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
                show: { object: book }
                audio: { fr: "Qu'est-ce que c'est ?" }
                options: ["C'est un livre.", "C'est Léa.", "Trois."]
                answer: "C'est un livre."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "Which question asks who?"
            options: ["Qui est-ce ?", "Où est le chat ?", "Combien de chats ?"]
            answer: "Qui est-ce ?"
          - id: l1-c2
            type: audio_choice
            text: "Which answer fits the question?"
            say: { en: "Listen to the question. Which answer fits?" }
            audio: { fr: "Où est Papi ?" }
            options: ["Dans la cuisine.", "Six.", "C'est un ballon."]
            answer: "Dans la cuisine."
          - id: l1-c3
            type: audio_choice
            text: "Look at the picture. Which answer fits the question?"
            say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
            show: { object: ball }
            audio: { fr: "Qu'est-ce que c'est ?" }
            options: ["C'est un ballon.", "C'est Tom.", "Deux."]
            answer: "C'est un ballon."
          - id: l1-c4
            type: audio_choice
            text: "What does the question ask for?"
            say: { en: "Listen. What does the question ask for?" }
            audio: { fr: "Combien de chiens ?" }
            options: ["a person", "a number", "a place"]
            answer: "a number"
          - id: l1-c5
            type: audio_choice
            text: "Look at the picture. Which answer fits the question?"
            say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
            show: { object: grandpa }
            audio: { fr: "Qui est-ce ?" }
            options: ["C'est un vélo.", "C'est Papi.", "Quatre."]
            answer: "C'est Papi."
          - id: l1-c6
            type: true_false
            text: "“Combien de pommes ?” asks how many apples there are."
            say: { en: "Read it. Is that right?" }
            answer: true

  - n: 2
    title: { de: "Ja-Nein-Fragen", en: "Yes/no questions" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What does “où” mean?"
            options: ["where", "who", "how many"]
            answer: "where"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Which answer fits the question?"
            say: { en: "Listen to the question. Which answer fits?" }
            audio: { fr: "Combien de lapins ?" }
            options: ["Deux.", "C'est un lapin.", "Dans le jardin."]
            answer: "Deux."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Tu as un chien ?"
            say: { en: "A question with no question word. It is the same as the sentence, but your voice goes up at the end. Tu as un chien ? Have you got a dog?", fr: "Tu as un chien ?" }
            show: { object: dog }
          - text: "Est-ce que tu as un chien ?"
            say: { en: "Or put est-ce que at the start. It asks the same thing, and the rest stays in the same order.", fr: "Est-ce que tu as un chien ?" }
          - text: "Oui, j'ai un chien.\nNon, je n'ai pas de chien."
            say: { en: "Answer with oui or non. Tu as ... ? is answered with j'ai, I have got: oui, j'ai un chien, or non, je n'ai pas de chien.", fr: "Oui, j'ai un chien. Non, je n'ai pas de chien." }
          - text: "Tu aimes les pommes ?\nOui, j'aime les pommes."
            say: { en: "Tu aimes ... ? asks if you like something. Answer with j'aime: oui, j'aime les pommes, or non, je n'aime pas les pommes.", fr: "Tu aimes les pommes ? Oui, j'aime les pommes." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Tu as un chat ?" }
                options: ["Oui, j'ai un chat.", "Oui, j'aime les chats.", "C'est un chat."]
                answer: "Oui, j'ai un chat."
                feedback:
                  "Oui, j'aime les chats.": "That answers Tu aimes ... ? The question is Tu as ... ? so the answer needs j'ai."
                hints:
                  - "Listen to the verb in the question: tu as."
                  - "Tu as is answered with j'ai."
                  - "Oui, j'ai un chat."
                difficulty: easy
              - id: l2-f2
                type: ordering
                option_audio: false
                text: "Build the question: Have you got a rabbit?"
                say: { en: "Build the question: Have you got a rabbit?" }
                options: ["un lapin ?", "Est-ce que", "tu as"]
                slot_count: 3
                answer: ["Est-ce que", "tu as", "un lapin ?"]
                hints:
                  - "Est-ce que goes at the start."
                  - "After it, the sentence stays as it is: tu as un lapin."
                  - "Est-ce que tu as un lapin ?"
              - id: l2-f3
                type: multiple_choice
                option_audio: false
                text: "Which question can you answer with oui or non?"
                options: ["Tu aimes la pizza ?", "Où est la pizza ?", "Qui est-ce ?"]
                answer: "Tu aimes la pizza ?"
                hints:
                  - "Où and qui ask for a place and a person."
                  - "Which question has no question word?"
                  - "Tu aimes la pizza ? Oui or non."
              - id: l2-f4
                type: audio_choice
                text: "Is the answer yes or no?"
                say: { en: "Listen. Is the answer yes or no?" }
                audio: { turns: [{ fr: "Tu aimes le lait ?", speaker: female }, { fr: "Non, je n'aime pas le lait.", speaker: male }] }
                options: ["yes", "no"]
                answer: "no"
                hints:
                  - "Listen for oui or non."
                  - "Je n'aime pas means I don't like."
                  - "Non: the answer is no."
              - id: l2-f5
                type: fill_in_blank
                option_audio: false
                text: "Finish the answer.\nTu as un vélo ?"
                say: { en: "Have you got a bike? No. Finish the answer." }
                show: { object: bike }
                frame: "Non, je _ pas de vélo."
                options: ["n'ai", "ai", "n'aime"]
                answer: ["n'ai"]
                hints:
                  - "The question uses tu as, so the answer uses ai."
                  - "No needs n' before ai and pas after it."
                  - "Non, je n'ai pas de vélo."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Tu aimes les bananes ?" }
                options: ["Oui, j'aime les bananes.", "Oui, j'ai une banane.", "Où est la banane ?"]
                answer: "Oui, j'aime les bananes."
                hints: ["Tu aimes is answered with j'aime."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Build the question: Do you like pizza?"
                say: { en: "Build the question: Do you like pizza?" }
                options: ["la pizza ?", "Tu", "aimes"]
                slot_count: 3
                answer: ["Tu", "aimes", "la pizza ?"]
                hints: ["It is the sentence tu aimes la pizza, with a question mark."]
              - id: l2-s3
                type: true_false
                text: "“Est-ce que tu as un chien ?” and “Tu as un chien ?” ask the same thing."
                say: { en: "Read it. Is that right?" }
                answer: true
                hints: ["Est-ce que at the start only shows it is a question."]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Which question can you answer with oui or non?"
                options: ["Est-ce que tu aimes le foot ?", "Combien de ballons ?", "Où est le ballon ?"]
                answer: "Est-ce que tu aimes le foot ?"
                hints: ["Est-ce que starts a yes/no question."]
              - id: l2-s5
                type: speak
                text: "Ask in French: Have you got a cat?"
                say: { en: "Ask in French: Have you got a cat?", fr: "Tu as un chat ?" }
                show: { object: cat }
                expected_text: "Tu as un chat ?"
                hints: ["Say the sentence and let your voice go up: Tu as un chat ?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Est-ce que tu as une trousse ?" }
                options: ["Oui, j'ai une trousse.", "Oui, j'aime la trousse.", "C'est une trousse."]
                answer: "Oui, j'ai une trousse."
              - id: l2-n2
                type: ordering
                option_audio: false
                text: "Build the question: Have you got a dog?"
                say: { en: "Build the question: Have you got a dog?" }
                options: ["un chien ?", "tu as", "Est-ce que"]
                slot_count: 3
                answer: ["Est-ce que", "tu as", "un chien ?"]
              - id: l2-n3
                type: audio_choice
                text: "Is the answer yes or no?"
                say: { en: "Listen. Is the answer yes or no?" }
                audio: { turns: [{ fr: "Tu as un lapin ?", speaker: male }, { fr: "Oui, j'ai un lapin blanc.", speaker: female }] }
                options: ["yes", "no"]
                answer: "yes"
              - id: l2-n4
                type: fill_in_blank
                option_audio: false
                text: "Finish the answer.\nTu aimes le fromage ?"
                say: { en: "Do you like cheese? Yes. Finish the answer." }
                show: { object: cheese }
                frame: "Oui, j'_ le fromage."
                options: ["aime", "ai", "n'aime"]
                answer: ["aime"]
              - id: l2-n5
                type: multiple_choice
                option_audio: false
                text: "Which question asks what something is?"
                options: ["Qu'est-ce que c'est ?", "Qui est-ce ?", "Tu as un chat ?"]
                answer: "Qu'est-ce que c'est ?"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: wh-meaning
            type: multiple_choice
            option_audio: false
            text: "Which question word means where?"
            options: ["où", "qui", "combien"]
            answer: "où"
          - id: l2-c2
            part: wh-answer
            type: audio_choice
            text: "Look at the picture. Which answer fits the question?"
            say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
            show: { object: grandma }
            audio: { fr: "Qui est-ce ?" }
            options: ["C'est Mamie.", "C'est une pomme.", "Trois."]
            answer: "C'est Mamie."
          - id: l2-c3
            part: yes-no
            type: audio_choice
            text: "Which answer fits the question?"
            say: { en: "Listen to the question. Which answer fits?" }
            audio: { fr: "Tu as un ballon ?" }
            options: ["Oui, j'ai un ballon.", "Oui, j'aime le ballon.", "Où est le ballon ?"]
            answer: "Oui, j'ai un ballon."
          - id: l2-c4
            part: build
            type: ordering
            option_audio: false
            text: "Build the question: Do you like strawberries?"
            say: { en: "Build the question: Do you like strawberries?" }
            options: ["les fraises ?", "aimes", "Est-ce que", "tu"]
            slot_count: 4
            answer: ["Est-ce que", "tu", "aimes", "les fraises ?"]
          - id: l2-c5
            part: wh-answer
            type: audio_choice
            text: "Which answer fits the question?"
            say: { en: "Listen to the question. Which answer fits?" }
            audio: { fr: "Combien de fleurs ?" }
            options: ["Cinq.", "Dans le jardin.", "C'est une fleur."]
            answer: "Cinq."
          - id: l2-c6
            part: wh-meaning
            type: audio_choice
            text: "What does the question ask for?"
            say: { en: "Listen. What does the question ask for?" }
            audio: { fr: "Qui est-ce ?" }
            options: ["a place", "a number", "a person"]
            answer: "a person"
          - id: l2-c7
            part: wh-meaning
            type: audio_choice
            text: "What does the question ask for?"
            say: { en: "Listen. What does the question ask for?" }
            audio: { fr: "Combien de livres ?" }
            options: ["a number", "a person", "a place"]
            answer: "a number"
          - id: l2-c8
            part: wh-meaning
            type: multiple_choice
            text: "What does “qu'est-ce que” mean?"
            say: { en: "What does qu'est-ce que mean?" }
            options: ["who", "what", "where"]
            answer: "what"
          - id: l2-c9
            part: wh-meaning
            type: multiple_choice
            option_audio: false
            text: "You want to know how many dogs there are. Which question word do you need?"
            say: { en: "You want to know how many dogs there are. Which question word do you need?" }
            options: ["qui", "où", "combien"]
            answer: "combien"
          - id: l2-c10
            part: wh-answer
            type: multiple_choice
            option_audio: false
            text: "“Où est le chat ?” Which answer fits?"
            say: { en: "Which answer fits the question?", fr: "Où est le chat ?" }
            options: ["C'est Papi.", "Dans la cuisine.", "Cinq."]
            answer: "Dans la cuisine."
          - id: l2-c11
            part: wh-answer
            type: audio_choice
            text: "Which question fits this answer?"
            say: { en: "Listen to the answer. Which question fits?" }
            audio: { fr: "Dans le jardin." }
            options: ["Qui est-ce ?", "Combien de chiens ?", "Où est le chien ?"]
            answer: "Où est le chien ?"
          - id: l2-c12
            part: wh-answer
            type: multiple_choice
