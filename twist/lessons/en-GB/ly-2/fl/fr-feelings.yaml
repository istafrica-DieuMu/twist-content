# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-feelings
skill: fl.themes.feelings
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Gefühle (Französisch)
  en: Feelings in French
summary: >
  Saying how you feel in French and asking others. Lesson 1 brings je suis
  content, triste, en colère and fatigué, and j'ai peur, which takes j'ai
  instead of je suis; a girl adds an e (contente, fatiguée). Lesson 2 asks
  Ça va ? and Tu es ... ? and answers with Oui, je suis ... or Non, ça va
  bien, and ends with the skill check. Instructions are in English; the
  French is heard and shown in short form.
metadata:
  year: ly-2
  topic: { de: Gefühle, en: Feelings }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks]
  also_practises: [fl.grammar.questions, fl.speaking.greet]
  vocabulary: { fr: [content, contente, triste, en colère, fatigué, fatiguée, "j'ai peur", "je suis ...", "Ça va ?", "Ça va bien.", "Ça ne va pas.", "Tu es ... ?", "Tu as peur ?"] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: feel, what: { de: "sagen, wie ich mich fühle (je suis ..., j'ai peur)", en: "saying how I feel (je suis ..., j'ai peur)" } }
    - { id: form, what: { de: "die Form für ein Mädchen oder einen Jungen wählen (content, contente)", en: "choosing the girl's or the boy's form (content, contente)" } }
    - { id: ask, what: { de: "fragen, wie es jemandem geht (Ça va ? Tu es ... ?)", en: "asking how someone feels (Ça va ? Tu es ... ?)" } }
    - { id: understand, what: { de: "verstehen, wie es jemandem geht", en: understanding how someone feels } }
  misconceptions:
    - id: je-suis-peur
      what: Says je suis peur after the English I am scared
      addressed: lesson 1 Learn says that scared takes j'ai, I have fear; l1-f3 gives feedback on je suis peur, and l1-s3, l1-n3 and l2-c3 offer it again
    - id: agreement
      what: Leaves off the e when a girl talks about herself (Léa says je suis content)
      addressed: lesson 1 Learn shows content and contente, fatigué and fatiguée; l1-f4 gives feedback on content for Léa, and l1-s4, l1-n4 and l2-c4 ask for the girl's or the boy's form
    - id: oui-only
      what: Answers Ça va ? with oui instead of a feeling
      addressed: lesson 2 Learn models Ça va bien and Ça ne va pas; l2-f1 gives feedback on Oui, and l2-s1 and l2-n1 ask for the answer again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Je suis content.", en: "Je suis content." }
    goal:
      de: "Sag auf Französisch, wie du dich fühlst, so wie je suis triste oder j'ai peur."
      en: "Say how you feel in French, like je suis triste or j'ai peur."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How do you say I am nine in French?"
            say: { en: "How do you say I am nine in French?" }
            options: ["J'ai neuf ans.", "Je suis neuf.", "Je neuf ans."]
            answer: "J'ai neuf ans."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How do you say my name is Sam in French?"
            say: { en: "How do you say my name is Sam in French?" }
            options: ["Je m'appelle Sam.", "J'ai Sam.", "Je suis appelle Sam."]
            answer: "Je m'appelle Sam."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "Je suis content."
            say: { en: "Listen to Léo and look at his face. What do you think content means?", fr: "Je suis content." }
            show: { object: happy }
          - text: "Je suis content."
            say: { en: "Happy! Content means happy. This is how you say how you feel. Je suis means I am. Listen and repeat.", fr: "Je suis content." }
            show: { object: happy }
          - text: "Je suis triste. Je suis en colère."
            say: { en: "Triste is sad. En colère is angry.", fr: "Je suis triste. Je suis en colère." }
            show: { objects: [sad, angry] }
          - text: "Léo: Je suis content. Je suis fatigué.\nLéa: Je suis contente. Je suis fatiguée."
            say: { en: "Fatigué is tired. A girl adds an e: contente, fatiguée. You can hear the t at the end of contente; fatigué and fatiguée sound the same.", fr: "Je suis content. Je suis fatigué. Je suis contente. Je suis fatiguée." }
            show: { object: tired }
          - text: "J'ai peur."
            say: { en: "Scared is different. In French you say j'ai peur, I have fear. Never je suis peur.", fr: "J'ai peur." }
            show: { object: scared }
          - text: "Did you know? When you get goosebumps, French people say j'ai la chair de poule: I have hen's flesh! In English it's a goose, in French a hen."
            say: { en: "Did you know? When you are scared or cold, you can get goosebumps. In French you say j'ai la chair de poule: I have hen's flesh! English thinks of a goose, French thinks of a hen. It starts with j'ai, just like j'ai peur.", fr: "J'ai la chair de poule !" }
            show: { object: hen }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "How does the child feel?"
                say: { en: "Listen. How does the child feel?" }
                audio: { fr: "Je suis fatigué.", speaker: male }
                options: [{ object: tired }, { object: sad }, { object: happy }]
                answer: tired
                hints:
                  - "Listen again: fatigué."
                  - "Fatigué means tired."
                  - "Tap the yawning child."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "How does the child feel?"
                say: { en: "Listen. How does the child feel?" }
                audio: { fr: "Je suis en colère.", speaker: female }
                options: [{ object: happy }, { object: scared }, { object: angry }]
                answer: angry
                hints:
                  - "Listen again: en colère."
                  - "En colère means angry."
                  - "Tap the angry child."
              - id: l1-f3
                type: multiple_choice
                text: "How do you say I'm scared in French?"
                say: { en: "How do you say I'm scared in French?" }
                options: ["J'ai peur.", "Je suis peur.", "Je peur."]
                answer: "J'ai peur."
                option_audio: false
                feedback:
                  "Je suis peur.": "For scared, French uses j'ai, I have: j'ai peur."
                hints:
                  - "Scared does not take je suis."
                  - "In French you have fear."
                  - "J'ai peur."
              - id: l1-f4
                type: multiple_choice
                text: "Léa is a girl. She is happy. What does she say?"
                say: { en: "Léa is a girl. She is happy. What does she say?" }
                options: ["Je suis contente.", "Je suis content.", "J'ai content."]
                answer: "Je suis contente."
                option_audio: false
                feedback:
                  "Je suis content.": "That is what a boy says. Léa is a girl, so she adds an e: contente."
                hints:
                  - "Léa is a girl."
                  - "A girl adds an e to the feeling word."
                  - "Je suis contente."
              - id: l1-f5
                type: speak
                say: { en: "Say it in French: I'm sad.", fr: "Je suis triste." }
                show: { object: sad }
                expected_text: "Je suis triste."
                hints:
                  - "Start with je suis."
                  - "Sad is triste."
                  - "Say it with me: je suis triste."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "How does the child feel?"
                say: { en: "Listen. How does the child feel?" }
                audio: { fr: "J'ai peur.", speaker: male }
                options: [{ object: tired }, { object: scared }, { object: angry }]
                answer: scared
                hints: ["J'ai peur means I'm scared."]
              - id: l1-s2
                type: audio_choice
                text: "How does the child feel?"
                say: { en: "Listen. How does the child feel?" }
                audio: { fr: "Je suis content.", speaker: male }
                options: [{ object: sad }, { object: angry }, { object: happy }]
                answer: happy
                hints: ["Content means happy."]
              - id: l1-s3
                type: multiple_choice
                text: "Tom is scared. What does he say?"
                say: { en: "Tom is scared. What does he say?" }
                options: ["Je suis peur.", "J'ai peur.", "Je suis triste."]
                answer: "J'ai peur."
                option_audio: false
                hints: ["Scared takes j'ai."]
              - id: l1-s4
                type: multiple_choice
                text: "Max is a boy. He is tired. What does he say?"
                say: { en: "Max is a boy. He is tired. What does he say?" }
                options: ["Je suis fatigué.", "Je suis fatiguée.", "J'ai fatigué."]
                answer: "Je suis fatigué."
                option_audio: false
                hints: ["Only a girl adds the e."]
              - id: l1-s5
                type: speak
                say: { en: "Say it in French: I'm scared.", fr: "J'ai peur." }
                show: { object: scared }
                expected_text: "J'ai peur."
                hints: ["Say it with me: j'ai peur."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "How does the child feel?"
                say: { en: "Listen. How does the child feel?" }
                audio: { fr: "Je suis triste.", speaker: female }
                options: [{ object: sad }, { object: tired }, { object: happy }]
                answer: sad
              - id: l1-n2
                type: true_false
                text: "Does the sentence match the picture?\nJe suis en colère."
                say: { en: "Read the sentence. Does it match the picture?" }
                show: { object: happy }
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Du chien means of the dog. How do you say I'm scared of the dog?"
                say: { en: "Du chien means of the dog. How do you say I'm scared of the dog?" }
                options: ["J'ai peur du chien.", "Je suis peur du chien.", "Je peur du chien."]
                answer: "J'ai peur du chien."
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Chloé is a girl. She is tired. What does she say?"
                say: { en: "Chloé is a girl. She is tired. What does she say?" }
                options: ["Je suis fatiguée.", "Je suis fatigué.", "J'ai fatiguée."]
                answer: "Je suis fatiguée."
                option_audio: false
              - id: l1-n5
                type: speak
                say: { en: "Say it in French: I'm angry.", fr: "Je suis en colère." }
                show: { object: angry }
                expected_text: "Je suis en colère."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "How does the child feel?"
            say: { en: "Listen. How does the child feel?" }
            audio: { fr: "Je suis fatiguée.", speaker: female }
            options: [{ object: tired }, { object: angry }, { object: scared }]
            answer: tired
          - id: l1-c2
            type: true_false
            text: "Does the sentence match the picture?\nJ'ai peur."
            say: { en: "Read the sentence. Does it match the picture?" }
            show: { object: scared }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "How do you say I'm angry in French?"
            say: { en: "How do you say I'm angry in French?" }
            options: ["Je suis en colère.", "J'ai en colère.", "Je suis triste."]
            answer: "Je suis en colère."
            option_audio: false
          - id: l1-c4
            type: audio_choice
            text: "How does Léo feel?"
            say: { en: "Listen. How does Léo feel?" }
            audio: { fr: "Je suis content !", speaker: male }
            options: [{ object: scared }, { object: happy }, { object: tired }]
            answer: happy
          - id: l1-c5
            type: true_false
            text: "Max is a boy. He says: “Je suis contente.”\nIs that right?"
            say: { en: "Max is a boy. He says: Je suis contente. Is that right?" }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Which feeling takes j'ai, not je suis?"
            say: { en: "Which feeling takes j'ai, not je suis?" }
            options: ["triste", "peur", "content"]
            answer: "peur"
            option_audio: false

  - n: 2
    title: { de: "Ça va ?", en: "Ça va ?" }
    goal:
      de: "Frag andere auf Französisch, wie es ihnen geht, und antworte selbst, so wie ça va bien, merci."
      en: "Ask others how they feel in French and answer too, like ça va bien, merci."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "How does the child feel?"
            say: { en: "Listen. How does the child feel?" }
            audio: { fr: "Je suis en colère.", speaker: female }
            options: [{ object: angry }, { object: happy }, { object: tired }]
            answer: angry
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Sam is a boy. How does he say I'm happy?"
            say: { en: "Sam is a boy. How does he say I'm happy?" }
            options: ["Je suis content.", "J'ai content.", "Je suis triste."]
            answer: "Je suis content."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Salut ! Ça va ?"
            say: { en: "Hugo sees you in the playground. Listen. What do you think he is asking you?", fr: "Salut ! Ça va ?" }
          - text: "Ça va ?"
            say: { en: "He is asking how you are! Ça va ? means How are you? or Are you OK? You answer with how you feel.", fr: "Ça va ?" }
          - text: "Ça va bien, merci. / Ça ne va pas."
            say: { en: "Ça va bien, merci means I'm fine, thank you. Ça ne va pas means I'm not OK. Do not just say oui.", fr: "Ça va bien, merci. Ça ne va pas." }
          - text: "Tu es triste ? Oui, je suis triste."
            say: { en: "To ask about one feeling, say tu es and the feeling, with a question in your voice. Tu es means you are. Answer with oui and the whole sentence, or say non, ça va bien.", fr: "Tu es triste ? Oui, je suis triste." }
            show: { object: sad }
          - text: "Tu as peur ? Oui, j'ai peur."
            say: { en: "Scared is still different: tu as peur ? Oui, j'ai peur.", fr: "Tu as peur ? Oui, j'ai peur." }
            show: { object: scared }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Hugo asks you a question. Which answer fits?"
                say: { en: "Hugo asks you a question. Listen. Which answer fits?" }
                audio: { fr: "Salut ! Ça va ?", speaker: male }
                options: ["Ça va bien, merci.", "Oui.", "Je m'appelle Hugo."]
                answer: "Ça va bien, merci."
                feedback:
                  "Oui.": "Ça va ? asks how you are. Tell Hugo how you feel: ça va bien, merci."
                hints:
                  - "Ça va ? asks how you are."
                  - "Answer with how you feel."
                  - "Ça va bien, merci."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "How does Inès feel?"
                say: { en: "Listen. How does Inès feel?" }
                audio: { turns: [{ fr: "Inès, ça va ?", speaker: male }, { fr: "Non, ça ne va pas. Je suis triste.", speaker: female }] }
                options: [{ object: sad }, { object: happy }, { object: angry }]
                answer: sad
                hints:
                  - "Listen to the end."
                  - "Ça ne va pas. Je suis triste."
                  - "Triste is sad."
              - id: l2-f3
                type: multiple_choice
                text: "Ask your friend: Are you tired?"
                say: { en: "Your friend is yawning. Ask: are you tired?" }
                options: ["Tu es fatigué ?", "Je suis fatigué.", "Tu as fatigué ?"]
                answer: "Tu es fatigué ?"
                option_audio: false
                hints:
                  - "You are asking, so start with you."
                  - "You are is tu es."
                  - "Tu es fatigué ?"
              - id: l2-f4
                type: audio_choice
                text: "Which answer fits?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Tu as peur ?" }
                options: ["Oui, j'ai peur.", "Oui, je suis peur.", "Oui, tu as peur."]
                answer: "Oui, j'ai peur."
                hints:
                  - "Answer about yourself."
                  - "Tu as becomes j'ai."
                  - "Oui, j'ai peur."
              - id: l2-f5
                type: speak
                say: { en: "Ask your friend in French: how are you?", fr: "Ça va ?" }
                expected_text: "Ça va ?"
                hints:
                  - "It is two short words."
                  - "Make your voice go up at the end."
                  - "Say it with me: ça va ?"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which answer fits?"
                say: { en: "Listen. Which answer fits?" }
                audio: { fr: "Bonjour, Zoé. Ça va ?" }
                options: ["Oui.", "Ça ne va pas.", "Bonjour, Zoé."]
                answer: "Ça ne va pas."
                hints: ["Answer with how you feel."]
              - id: l2-s2
                type: audio_choice
                text: "How does Lucas feel?"
                say: { en: "Listen. How does Lucas feel?" }
                audio: { turns: [{ fr: "Lucas, tu es triste ?", speaker: female }, { fr: "Non, ça va bien. Je suis content !", speaker: male }] }
                options: [{ object: happy }, { object: sad }, { object: tired }]
                answer: happy
                hints: ["Listen for non, then the end."]
              - id: l2-s3
                type: multiple_choice
                text: "Ask your friend: Are you angry?"
                say: { en: "Your friend is frowning. Ask: are you angry?" }
                options: ["Tu es en colère ?", "Je suis en colère.", "Tu as en colère ?"]
                answer: "Tu es en colère ?"
                option_audio: false
                hints: ["You are is tu es."]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Tom is tired. Build his answer: yes, I'm tired."
                say: { en: "Tom is tired. Build his answer: yes, I'm tired." }
                options: ["fatigué.", "Oui,", "suis", "je"]
                slot_count: 4
                answer: ["Oui,", "je", "suis", "fatigué."]
                hints: ["Oui comes first, then je suis."]
              - id: l2-s5
                type: speak
                say: { en: "Your friend asks: Ça va ? Answer: I'm fine, thank you.", fr: "Ça va bien, merci." }
                expected_text: "Ça va bien, merci."
                hints: ["Say it with me: ça va bien, merci."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which answer fits?"
                say: { en: "Listen. Which answer fits?" }
                audio: { fr: "Bonjour, Madame Petit. Ça va ?" }
                options: ["Ça va bien, merci.", "Oui.", "Au revoir."]
                answer: "Ça va bien, merci."
              - id: l2-n2
                type: audio_choice
                text: "How does Nina feel?"
                say: { en: "Listen. How does Nina feel?" }
                audio: { turns: [{ fr: "Nina, tu es contente ?", speaker: male }, { fr: "Non, ça ne va pas. J'ai peur du chien.", speaker: female }] }
                options: [{ object: scared }, { object: happy }, { object: angry }]
                answer: scared
              - id: l2-n3
                type: multiple_choice
                text: "Ask your friend: Are you sad?"
                say: { en: "Your friend is crying. Ask: are you sad?" }
                options: ["Tu es triste ?", "Je suis triste.", "Tu as triste ?"]
                answer: "Tu es triste ?"
                option_audio: false
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Build the answer: yes, I'm scared."
                say: { en: "Build the answer: yes, I'm scared." }
                options: ["peur.", "j'ai", "Oui,"]
                slot_count: 3
                answer: ["Oui,", "j'ai", "peur."]
              - id: l2-n5
                type: true_false
                text: "Léo: Tu es fatigué ?\nMax: Non, ça va bien.\nIs Max tired?"
                say: { en: "Read the chat. Is Max tired?" }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: understand
            type: audio_choice
            text: "How does Paul feel?"
            say: { en: "Listen. How does Paul feel?" }
            audio: { turns: [{ fr: "Paul, ça va ?", speaker: female }, { fr: "Non. Je suis fatigué.", speaker: male }] }
            options: [{ object: tired }, { object: happy }, { object: sad }]
            answer: tired
          - id: l2-c2
            part: ask
            type: multiple_choice
            text: "Ask your friend: how are you?"
            say: { en: "You meet your friend. Ask: how are you?" }
            options: ["Ça va ?", "Ça va bien, merci.", "Tu as peur ?"]
            answer: "Ça va ?"
            option_audio: false
          - id: l2-c3
            part: feel
            type: multiple_choice
            text: "Your friend asks: tu as peur du chien ? You are scared. What do you say?"
            say: { en: "Your friend asks: tu as peur du chien ? You are scared. What do you say?" }
            options: ["Oui, j'ai peur du chien.", "Oui, je suis peur du chien.", "Non, ça va bien."]
            answer: "Oui, j'ai peur du chien."
            option_audio: false
          - id: l2-c4
            part: form
            type: multiple_choice
            text: "Emma is a girl. She is happy. What does she say?"
            say: { en: "Emma is a girl. She is happy. What does she say?" }
            options: ["Je suis contente.", "Je suis content.", "Je suis fatiguée."]
            answer: "Je suis contente."
            option_audio: false
          - id: l2-c5
            part: understand
            type: audio_choice
            text: "Is Hugo OK?"
            say: { en: "Listen. Is Hugo OK?" }
            audio: { turns: [{ fr: "Hugo, tu es triste ?", speaker: female }, { fr: "Non, non, ça va bien, merci.", speaker: male }] }
            options: ["Yes, he is fine.", "No, he is sad.", "No, he is scared."]
            answer: "Yes, he is fine."
          - id: l2-c6
            part: understand
            type: audio_choice
            text: "How does Malik feel?"
            say: { en: "Listen. How does Malik feel?" }
            audio: { turns: [{ fr: "Malik, ça va ?", speaker: female }, { fr: "Non, je suis en colère !", speaker: male }] }
            options: [{ object: sad }, { object: angry }, { object: scared }]
            answer: angry
          - id: l2-c7
            part: understand
            type: true_false
            text: "Is Clara tired?"
            say: { en: "Listen. Is Clara tired?" }
            audio: { turns: [{ fr: "Clara, tu es fatiguée ?", speaker: male }, { fr: "Oui, je suis fatiguée.", speaker: female }] }
            answer: true
          - id: l2-c8
            part: understand
            type: audio_choice
            text: "How does Jules feel?"
            say: { en: "Listen. How does Jules feel?" }
            audio: { turns: [{ fr: "Tu es content, Jules ?", speaker: female }, { fr: "Non, je suis triste.", speaker: male }] }
            options: ["happy", "tired", "sad"]
            answer: "sad"
          - id: l2-c9
            part: ask
            type: multiple_choice
            text: "Your friend looks scared. Ask: are you scared?"
            say: { en: "Your friend looks scared. Ask: are you scared?" }
            options: ["Tu es peur ?", "Tu as peur ?", "J'ai peur."]
            answer: "Tu as peur ?"
            option_audio: false
          - id: l2-c10
            part: ask
            type: ordering
            option_audio: false
            text: "Léa is a girl. Build the question: are you happy?"
            say: { en: "Léa is a girl. Build the question: are you happy?" }
            options: ["contente ?", "Tu", "content ?", "es"]
            slot_count: 3
            answer: ["Tu", "es", "contente ?"]
          - id: l2-c11
