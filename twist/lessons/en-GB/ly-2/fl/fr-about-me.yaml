# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-about-me
skill: fl.grammar.chunks
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Über mich sprechen (Französisch)
  en: Talking about me in French
summary: >
  Set sentence patterns for talking about yourself in French: j'ai ...,
  je suis ..., j'aime ... and je sais .... Lesson 1 brings j'ai for age and
  for things you have got (j'ai neuf ans, j'ai un chien) and je suis for
  how you are (je suis fatigué), and why age takes j'ai, never je suis.
  Lesson 2 adds j'aime and je sais, shows how je joins up with aime and
  ai, has the child choose the starter for what they want to say and build
  sentences from word cards, and ends with the skill check. Speaking is
  practised, not marked.
metadata:
  year: ly-2
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.greet]
  also_practises: [fl.themes.numbers-to-10, fl.speaking.likes]
  vocabulary: { fr: [je m'appelle, "j'ai ... ans", "j'ai un ...", je suis, content, triste, fatigué, j'aime, je sais, nager, chanter, lire, danser, le foot] }
  forms: [audio, picture, drawn, text]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: je-suis-age
      what: Says je suis huit ans, copying English I am eight
      addressed: lesson 1 Learn says age takes j'ai, never je suis; l1-f2 gives feedback when je suis is chosen for an age, l1-n4 asks whether je suis huit ans is right, and l2-w1 and l2-c1 ask for the age starter again
    - id: no-elision
      what: Writes or says je aime and je ai instead of j'aime and j'ai
      addressed: lesson 2 Learn shows je joining up with aime and ai; l2-f3 gives feedback on je aime, and l2-s4 and l2-c4 ask which spelling is right
    - id: wrong-starter
      what: Picks a starter that does not fit what they want to say (je sais for a pet, j'aime for how they are)
      addressed: '"Which starter do you need?" tasks in every stage (l1-f2, l1-s1, l1-n1, l2-f2, l2-s2, l2-n2) and in both checks'
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "J'ai, je suis", en: "J'ai, je suis" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Does the answer fit the question?"
            say: { en: "Listen to the question and the answer. Does the answer fit?", fr: "Tu as quel âge ? J'ai neuf ans." }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "How is the child?"
            say: { en: "Listen. How is the child?" }
            audio: { fr: "Ça va bien, merci." }
            options: ["well", "so-so", "not well"]
            answer: "well"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "J'ai neuf ans. J'ai un chien."
            say: { en: "Sentence starters help you talk about yourself. J'ai means I have. You use it for your age and for things you have got.", fr: "J'ai neuf ans. J'ai un chien." }
            show: { object: dog }
          - text: "Je suis fatigué. Je suis triste."
            say: { en: "Je suis means I am. Use it to say how you are.", fr: "Je suis fatigué. Je suis triste." }
            show: { object: tired }
          - text: "I am eight. → J'ai huit ans."
            say: { en: "Careful: for your age, French says I have eight years. J'ai huit ans. Never je suis.", fr: "J'ai huit ans." }
          - say: { en: "Listen to Lucas.", fr: "Je m'appelle Lucas. J'ai neuf ans. J'ai un chat. Je suis content." }
            show: { object: boy }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What has Lucas got?"
                say: { en: "Listen. What has Lucas got? Tap the picture." }
                audio: { fr: "J'ai un chien." }
                options: [{ object: cat }, { object: dog }, { object: fish }]
                answer: dog
                hints:
                  - "Listen for the word after j'ai un."
                  - "Un chien says ouaf."
                  - "Tap the dog."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "You want to say: I am eight. Which starter do you need?"
                options: ["J'ai ...", "Je suis ..."]
                answer: "J'ai ..."
                option_audio: false
                feedback:
                  "Je suis ...": "For your age, French says j'ai: j'ai huit ans."
                hints:
                  - "It is your age. How does French say an age?"
                  - "French says I have eight years."
                  - "J'ai: j'ai huit ans."
              - id: l1-f3
                type: audio_choice
                text: "How is Léa?"
                say: { en: "Listen. How is Léa? Tap the picture." }
                audio: { fr: "Je suis fatiguée." }
                options: [{ object: happy }, { object: tired }, { object: sad }]
                answer: tired
                hints:
                  - "Listen for the word after je suis."
                  - "Fatigué means tired."
                  - "Tap the tired child."
              - id: l1-f4
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I have got a cat." }
                options: ["chat", "J'ai", "un"]
                slot_count: 3
                answer: ["J'ai", "un", "chat"]
                option_audio: false
                hints:
                  - "Start with the starter for I have got."
                  - "J'ai, then un, then the animal."
                  - "J'ai un chat."
              - id: l1-f5
                type: speak
                say: { en: "Say how old you are. You can say it like this:", fr: "J'ai neuf ans." }
                expected_text: "j'ai neuf ans"
                hints:
                  - "Listen again: j'ai neuf ans."
                  - "J'ai, then your number, then ans."
                  - "Say it with me: J'ai neuf ans."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "You want to say: I have got a fish. Which starter do you need?"
                options: ["Je suis ...", "J'ai ..."]
                answer: "J'ai ..."
                option_audio: false
                hints: ["J'ai means I have."]
              - id: l1-s2
                type: audio_choice
                text: "How old is Hugo?"
                say: { en: "Listen. How old is Hugo? Tap the dots." }
                audio: { fr: "J'ai dix ans." }
                options:
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                  - { drawn: dots, count: 9, layout: dice }
                answer: "10"
                hints: ["Dix starts with d."]
              - id: l1-s3
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I am sad." }
                options: ["triste", "Je", "suis"]
                slot_count: 3
                answer: ["Je", "suis", "triste"]
                option_audio: false
                hints: ["Je suis first, then how you are."]
              - id: l1-s4
                type: audio_choice
                text: "How is Tom?"
                say: { en: "Listen. How is Tom? Tap the picture." }
                audio: { fr: "Je suis triste." }
                options: [{ object: sad }, { object: happy }, { object: tired }]
                answer: sad
                hints: ["Triste means sad."]
              - id: l1-s5
                type: speak
                say: { en: "Say that you have got a dog.", fr: "J'ai un chien." }
                show: { object: dog }
                expected_text: "j'ai un chien"
                hints: ["J'ai, then un chien."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "You want to say: I am tired. Which starter do you need?"
                options: ["J'ai ...", "Je suis ..."]
                answer: "Je suis ..."
                option_audio: false
              - id: l1-n2
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I am nine." }
                options: ["neuf", "ans", "J'ai"]
                slot_count: 3
                answer: ["J'ai", "neuf", "ans"]
                option_audio: false
              - id: l1-n3
                type: audio_choice
                text: "What has Manon got?"
                say: { en: "Listen. What has Manon got? Tap the picture." }
                audio: { fr: "J'ai un lapin." }
                options: [{ object: dog }, { object: cat }, { object: rabbit }]
                answer: rabbit
              - id: l1-n4
                type: true_false
                text: "Is this right in French? “Je suis huit ans.”"
                say: { en: "Is this right in French?", fr: "Je suis huit ans." }
                answer: false
              - id: l1-n5
                type: speak
                say: { en: "Say your name and your age in French." }
                expected_text: "je m'appelle léa j'ai huit ans"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "How is Jules?"
            say: { en: "Listen. How is Jules? Tap the picture." }
            audio: { fr: "Je suis content." }
            options: [{ object: tired }, { object: sad }, { object: happy }]
            answer: happy
          - id: l1-c2
            type: multiple_choice
            text: "You want to say: I have got a cat. Which starter do you need?"
            options: ["J'ai ...", "Je suis ..."]
            answer: "J'ai ..."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is this right in French? “J'ai neuf ans.”"
            say: { en: "Is this right in French?", fr: "J'ai neuf ans." }
            answer: true

  - n: 2
    title: { de: "J'aime, je sais", en: "J'aime, je sais" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "You want to say: I am ten. Which starter do you need?"
            options: ["Je suis ...", "J'ai ..."]
            answer: "J'ai ..."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "What has Léa got?"
            say: { en: "Do you remember? What has Léa got?" }
            audio: { fr: "J'ai un poisson." }
            options: [{ object: fish }, { object: cat }]
            answer: fish
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "J'aime le foot. J'aime les pommes. J'aime lire."
            say: { en: "J'aime means I like. Put le, la or les before the thing you like. For something you like doing, the action word comes straight after: j'aime lire, I like reading.", fr: "J'aime le foot. J'aime les pommes. J'aime lire." }
            show: { object: play-football }
          - text: "Je sais nager. Je sais chanter."
            say: { en: "Je sais means I can, for something you have learnt to do.", fr: "Je sais nager. Je sais chanter." }
            show: { object: swim }
          - text: "je + aime → j'aime\nje + ai → j'ai"
            say: { en: "Je joins up with aime to make j'aime, and with ai to make j'ai. We never write je aime.", fr: "J'aime. J'ai." }
          - say: { en: "Now all four starters together. Listen to Chloé.", fr: "Je m'appelle Chloé. J'ai huit ans. J'ai un chat. J'aime le foot et je sais nager." }
            show: { object: girl }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "What does Chloé like?"
                say: { en: "Listen. What does Chloé like? Tap the picture." }
                audio: { fr: "J'aime le foot." }
                options: [{ object: swim }, { object: play-football }, { object: sing }]
                answer: play-football
                hints:
                  - "Listen for the word after j'aime le."
                  - "Le foot is football."
                  - "Tap football."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "You want to say: I can swim. Which starter do you need?"
                options: ["Je sais ...", "J'ai ...", "Je suis ..."]
                answer: "Je sais ..."
                option_audio: false
                hints:
                  - "Swimming is something you have learnt to do."
                  - "Je sais means I can."
                  - "Je sais: je sais nager."
              - id: l2-f3
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["J'aime les pommes.", "Je aime les pommes."]
                answer: "J'aime les pommes."
                option_audio: false
                feedback:
                  "Je aime les pommes.": "Je and aime join up: j'aime."
                hints:
                  - "Look at the start of each sentence."
                  - "Before aime, je loses its e and joins up."
                  - "J'aime les pommes."
              - id: l2-f4
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I can sing." }
                options: ["chanter", "sais", "Je"]
                slot_count: 3
                answer: ["Je", "sais", "chanter"]
                option_audio: false
                hints:
                  - "Start with the starter for I can."
                  - "Je sais, then what you can do."
                  - "Je sais chanter."
              - id: l2-f5
                type: speak
                say: { en: "Say what you like. You can say it like this:", fr: "J'aime le foot." }
                show: { object: play-football }
                expected_text: "j'aime le foot"
                hints:
                  - "Listen again: j'aime le foot."
                  - "J'aime is one word when you say it: jem."
                  - "Say it with me: J'aime le foot."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "What can Hugo do?"
                say: { en: "Listen. What can Hugo do? Tap the picture." }
                audio: { fr: "Je sais nager." }
                options: [{ object: dance }, { object: read }, { object: swim }]
                answer: swim
                hints: ["Nager is to swim."]
              - id: l2-s2
                type: multiple_choice
                text: "You want to say: I like apples. Which starter do you need?"
                options: ["Je suis ...", "J'aime ...", "Je sais ..."]
                answer: "J'aime ..."
                option_audio: false
                hints: ["J'aime means I like."]
              - id: l2-s3
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I like football." }
                options: ["foot", "J'aime", "le"]
                slot_count: 3
                answer: ["J'aime", "le", "foot"]
                option_audio: false
                hints: ["J'aime, then le, then the thing."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["Je ai un chien.", "J'ai un chien."]
                answer: "J'ai un chien."
                option_audio: false
                hints: ["Je joins up with ai."]
              - id: l2-s5
                type: speak
                say: { en: "Say that you can sing.", fr: "Je sais chanter." }
                show: { object: sing }
                expected_text: "je sais chanter"
                hints: ["Je sais, then chanter."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "What does Inès tell you?"
                say: { en: "Listen. What does Inès tell you?" }
                audio: { fr: "Je m'appelle Inès. J'ai neuf ans et je sais danser." }
                options: ["her name, her age and what she can do", "her name, her age and what she likes", "her name and her pet"]
                answer: "her name, her age and what she can do"
              - id: l2-n2
                type: multiple_choice
                text: "You want to say: I am happy. Which starter do you need?"
                options: ["J'ai ...", "Je sais ...", "Je suis ..."]
                answer: "Je suis ..."
                option_audio: false
              - id: l2-n3
                type: ordering
                text: "Put the words in order."
                say: { en: "Build the sentence: I can read." }
                options: ["lire", "Je", "sais"]
                slot_count: 3
                answer: ["Je", "sais", "lire"]
                option_audio: false
              - id: l2-n4
                type: audio_choice
                text: "What does Théo like?"
                say: { en: "Listen. What does Théo like? Tap the picture." }
                audio: { fr: "J'aime lire." }
                options: [{ object: paint }, { object: read }, { object: swim }]
                answer: read
              - id: l2-n5
                type: speak
                say: { en: "Say one thing you like and one thing you can do." }
                expected_text: "j'aime le foot je sais nager"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "You want to say: I am nine. Which starter do you need?"
            options: ["Je suis ...", "Je sais ...", "J'ai ..."]
            answer: "J'ai ..."
            option_audio: false
          - id: l2-c2
            type: ordering
            text: "Put the words in order."
            say: { en: "Build the sentence: I have got a rabbit." }
            options: ["lapin", "J'ai", "un"]
            slot_count: 3
            answer: ["J'ai", "un", "lapin"]
            option_audio: false
          - id: l2-c3
            type: audio_choice
            text: "What can Camille do?"
            say: { en: "Listen. What can Camille do? Tap the picture." }
            audio: { fr: "Je m'appelle Camille. Je sais jouer au tennis." }
            options: [{ object: play-football }, { object: ride-bike }, { object: play-tennis }]
            answer: play-tennis
          - id: l2-c4
            type: multiple_choice
            text: "Which sentence is right?"
            options: ["J'aime le chocolat.", "Je aime le chocolat."]
            answer: "J'aime le chocolat."
            option_audio: false
          - id: l2-c5
            type: audio_choice
            text: "How is Nathan?"
            say: { en: "Listen. How is Nathan? Tap the picture." }
            audio: { fr: "Je m'appelle Nathan. Aujourd'hui, je suis fatigué." }
            options: [{ object: happy }, { object: tired }, { object: sad }]
            answer: tired
