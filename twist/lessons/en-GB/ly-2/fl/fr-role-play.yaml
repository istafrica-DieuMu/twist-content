# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-role-play
skill: fl.speaking.role-play
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Kleine Rollenspiele (Französisch)
  en: Little role plays in French
summary: >
  Two short everyday scenes in France with fixed phrases. Lesson 1 is at a
  market stall: Sam buys fruit from Madame Roux (Vous désirez ? Je
  voudrais ..., s'il vous plaît. Voilà. C'est combien ? Deux euros, s'il
  vous plaît. Merci, au revoir !), saying s'il vous plaît to a grown-up.
  Lesson 2 is in a park, where Sam meets Léo (Comment tu t'appelles ? Tu
  as quel âge ? Tu as un animal ? Tu veux jouer ?), and it ends with the
  skill check. The child picks the reply that fits, puts a scene's lines in
  order and speaks one part. Speaking is practised, not marked; the checks
  ask for the fitting reply, the order and details heard in a scene.
metadata:
  year: ly-2
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 11
  builds_on: [fl.speaking.ask-answer, fl.themes.food]
  also_practises: [fl.themes.hello, fl.listening.short-dialogues]
  vocabulary: { fr: ["Vous désirez ?", "Je voudrais ..., s'il vous plaît.", "Voilà.", "C'est combien ?", "Deux euros, s'il vous plaît.", "Merci, au revoir !", "Comment tu t'appelles ?", "Tu as quel âge ?", "Et toi ?", "Moi aussi.", "Tu as un animal ?", "Non, je n'ai pas d'animal.", "Tu veux jouer ?", "Oui, je veux bien !"] }
  forms: [audio, text, picture]
  drawn: []
  facets: []
  parts:
    - { id: reply, what: { de: im Gespräch die passende Antwort wählen, en: choosing the reply that fits in a conversation } }
    - { id: phrase, what: { de: "wissen, was man in einer Lage sagt", en: knowing what to say in a situation } }
    - { id: order, what: { de: ein Gespräch in die richtige Reihenfolge bringen, en: putting a conversation in order } }
    - { id: listen, what: { de: ein kurzes Alltagsgespräch verstehen, en: understanding a short everyday conversation } }
  misconceptions:
    - id: tu-vous
      what: Says s'il te plaît to a shopkeeper, the form for friends, instead of s'il vous plaît
      addressed: lesson 1 Learn sets s'il vous plaît for grown-ups against s'il te plaît for friends; l1-f4 gives feedback on s'il te plaît, and l1-n1 keeps it among the options
    - id: question-mixup
      what: Answers a question with the reply to a different one (Tu as quel âge ? Je m'appelle Sam.)
      addressed: l1-f1 and l2-f1 give feedback on a reply to another question; l2-s1 and l2-n1 offer replies to other questions, and l1-s4 and l2-s4 ask whether a reply fits
    - id: answer-verb
      what: Answers Tu as un animal ? with je n'aime pas instead of je n'ai pas
      addressed: lesson 2 Learn models Non, je n'ai pas d'animal; l2-s3 offers Non, je n'aime pas, and l2-c2 asks the detail again
    - id: line-order
      what: Knows the phrases but not who says what when, so the scene does not work
      addressed: every stage has an ordering task with the lines of a scene (l1-f5, l1-s5, l1-n4, l2-f5, l2-s5, l2-n4), and the skill check has one (l2-c3)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Auf dem Markt", en: "At the market" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "You would like some bread. How do you ask?"
            say: { en: "You would like some bread. How do you ask politely?" }
            options: ["Je voudrais du pain, s'il vous plaît.", "Je veux pain.", "J'aime le pain."]
            answer: "Je voudrais du pain, s'il vous plaît."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Does the child like cheese?"
            say: { en: "Listen. Does the child like cheese?" }
            audio: { turns: [{ fr: "Tu aimes le fromage ?", speaker: female }, { fr: "Non, je n'aime pas ça.", speaker: male }] }
            options: ["yes", "no"]
            keep_order: true
            answer: "no"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Madame Roux : Bonjour ! Vous désirez ?\nSam : Bonjour, Madame. Je voudrais deux bananes, s'il vous plaît."
            say: { en: "Sam is on holiday in France. He buys fruit at the market. Vous désirez ? means What would you like?", fr: "Bonjour ! Vous désirez ? Bonjour, Madame. Je voudrais deux bananes, s'il vous plaît." }
            show: { object: banana, count: 2, layout: row }
          - text: "Madame Roux : Voilà.\nSam : C'est combien ?\nMadame Roux : Deux euros, s'il vous plaît."
            say: { en: "Voilà means here you are. C'est combien ? means how much is it? In France you pay in euros.", fr: "Voilà. C'est combien ? Deux euros, s'il vous plaît." }
          - text: "Sam : Voilà. Merci, au revoir !\nMadame Roux : Au revoir !"
            say: { en: "Sam hands over the money and says voilà too. Then merci, thank you, and au revoir.", fr: "Voilà. Merci, au revoir ! Au revoir !" }
          - text: "s'il vous plaît: to a grown-up\ns'il te plaît: to a friend"
            say: { en: "Say s'il vous plaît to a grown-up you do not know, like a shopkeeper. S'il te plaît is for friends and family.", fr: "S'il vous plaît. S'il te plaît." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Madame Roux : Bonjour ! Vous désirez ?\nWhat do you answer?"
                say: { en: "Madame Roux asks you a question. What do you answer?" }
                options: ["Bonjour, Madame. Je voudrais une pomme, s'il vous plaît.", "Ça va bien, merci.", "Je m'appelle Sam."]
                answer: "Bonjour, Madame. Je voudrais une pomme, s'il vous plaît."
                option_audio: false
                feedback:
                  "Ça va bien, merci.": "That answers Ça va ? Madame Roux asks what you would like."
                hints:
                  - "Vous désirez ? means what would you like?"
                  - "Say what you would like with je voudrais."
                  - "Bonjour, Madame. Je voudrais une pomme, s'il vous plaît."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What does the child buy?"
                say: { en: "Listen. What does the child buy?" }
                audio: { turns: [{ fr: "Je voudrais trois oranges, s'il vous plaît.", speaker: male }, { fr: "Voilà.", speaker: female }] }
                options: [{ object: orange }, { object: apple }, { object: banana }]
                answer: orange
                hints:
                  - "Listen after je voudrais."
                  - "Trois oranges."
                  - "Tap the orange."
              - id: l1-f3
                type: multiple_choice
                text: "You give Madame Roux the money. What do you say?"
                options: ["Voilà.", "Vous désirez ?", "C'est combien ?"]
                answer: "Voilà."
                option_audio: false
                hints:
                  - "You are handing something over."
                  - "Here you are is voilà."
                  - "Voilà."
              - id: l1-f4
                type: multiple_choice
                text: "You are talking to the shopkeeper. Which is polite?"
                say: { en: "You are talking to the shopkeeper. Which way of asking is polite?" }
                options: ["Je voudrais un gâteau, s'il vous plaît.", "Je voudrais un gâteau, s'il te plaît.", "Un gâteau !"]
                answer: "Je voudrais un gâteau, s'il vous plaît."
                option_audio: false
                feedback:
                  "Je voudrais un gâteau, s'il te plaît.": "S'il te plaît is for friends. The shopkeeper is a grown-up you do not know: s'il vous plaît."
                hints:
                  - "The shopkeeper is a grown-up you do not know."
                  - "Grown-ups get s'il vous plaît."
                  - "Je voudrais un gâteau, s'il vous plaît."
              - id: l1-f5
                type: ordering
                option_audio: false
                text: "Put the scene at the market in order."
                say: { en: "Put the lines of the scene in order." }
                options: ["Merci, au revoir !", "Je voudrais un gâteau, s'il vous plaît.", "Voilà."]
                slot_count: 3
                answer: ["Je voudrais un gâteau, s'il vous plaît.", "Voilà.", "Merci, au revoir !"]
                hints:
                  - "First you ask for something."
                  - "Then Madame Roux hands it over."
                  - "Je voudrais un gâteau, voilà, merci, au revoir."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Madame Roux : Voilà.\nShe hands you the bananas. What do you say?"
                say: { en: "Madame Roux hands you the bananas. What do you say?" }
                options: ["Merci, Madame.", "Vous désirez ?", "S'il te plaît."]
                answer: "Merci, Madame."
                option_audio: false
                hints: ["You get something, so you say thank you."]
              - id: l1-s2
                type: audio_choice
                text: "How much is the milk?"
                say: { en: "Listen. How much is the milk?" }
                audio: { turns: [{ fr: "Je voudrais du lait, s'il vous plaît.", speaker: male }, { fr: "Voilà.", speaker: female }, { fr: "C'est combien ?", speaker: male }, { fr: "Deux euros, s'il vous plaît.", speaker: female }] }
                options: ["2 €", "12 €", "3 €"]
                answer: "2 €"
                hints: ["Listen after C'est combien ?"]
              - id: l1-s3
                type: speak
                text: "Ask Madame Roux how much it is."
                say: { en: "Ask Madame Roux how much it is.", fr: "C'est combien ?" }
                expected_text: "C'est combien ?"
                hints: ["Say it with me: c'est combien ?"]
              - id: l1-s4
                type: true_false
                text: "Madame Roux : Vous désirez ?\nSam : Merci, au revoir !"
                say: { en: "Read the scene. Does Sam's reply fit?" }
                answer: false
                hints: ["Vous désirez ? asks what you would like."]
              - id: l1-s5
                type: ordering
                option_audio: false
                text: "Put the scene at the market in order."
                say: { en: "Put the lines of the scene in order." }
                options: ["Voilà.", "Bonjour ! Vous désirez ?", "Merci, au revoir !", "Je voudrais du pain, s'il vous plaît."]
                slot_count: 4
                answer: ["Bonjour ! Vous désirez ?", "Je voudrais du pain, s'il vous plaît.", "Voilà.", "Merci, au revoir !"]
                hints: ["Madame Roux speaks first."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "At the ice cream stall the man asks: “Vous désirez ?” What do you say?"
                say: { en: "At the ice cream stall the man asks you: Vous désirez ? What do you say?" }
                options: ["Je voudrais une glace, s'il vous plaît.", "Je voudrais une glace, s'il te plaît.", "Voilà."]
                answer: "Je voudrais une glace, s'il vous plaît."
                option_audio: false
              - id: l1-n2
                type: audio_choice
                text: "What does the child buy?"
                say: { en: "Listen. What does the child buy?" }
                audio: { turns: [{ fr: "Bonjour ! Je voudrais des fraises, s'il vous plaît.", speaker: female }, { fr: "Voilà.", speaker: male }] }
                options: [{ object: strawberry }, { object: apple }, { object: pear }]
                answer: strawberry
              - id: l1-n3
                type: speak
                text: "Say thank you and goodbye to Madame Roux."
                say: { en: "Say thank you and goodbye to Madame Roux.", fr: "Merci, au revoir !" }
                expected_text: "Merci, au revoir !"
              - id: l1-n4
                type: ordering
                option_audio: false
                text: "Put the lines in order."
                say: { en: "Put the lines of the scene in order." }
                options: ["Voilà. Merci !", "C'est combien ?", "Trois euros, s'il vous plaît."]
                slot_count: 3
                answer: ["C'est combien ?", "Trois euros, s'il vous plaît.", "Voilà. Merci !"]
              - id: l1-n5
                type: multiple_choice
                text: "Sam : Je voudrais une pizza, s'il vous plaît.\nWhat does the shopkeeper say?"
                say: { en: "Sam asks for a pizza. What does the shopkeeper say as she hands it over?" }
                options: ["Voilà.", "Merci, Madame.", "Je voudrais une pizza."]
                answer: "Voilà."
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "You get your bananas. What do you say?"
            options: ["Merci.", "Voilà.", "Vous désirez ?"]
            answer: "Merci."
            option_audio: false
          - id: l1-c2
            type: audio_choice
            text: "What does the child buy?"
            say: { en: "Listen. What does the child buy?" }
            audio: { turns: [{ fr: "Je voudrais deux pommes, s'il vous plaît.", speaker: female }, { fr: "Voilà.", speaker: male }] }
            options: [{ object: apple }, { object: pear }, { object: banana }]
            answer: apple
          - id: l1-c3
            type: multiple_choice
            text: "You want to know what the cake costs. What do you ask?"
            options: ["C'est combien ?", "Vous désirez ?", "Tu as quel âge ?"]
            answer: "C'est combien ?"
            option_audio: false
          - id: l1-c4
            type: audio_choice
            text: "How much are the bananas?"
            say: { en: "Listen. How much are the bananas?" }
            audio: { turns: [{ fr: "Les bananes, c'est combien ?", speaker: male }, { fr: "Trois euros, s'il vous plaît.", speaker: female }] }
            options: ["13 €", "3 €", "2 €"]
            answer: "3 €"
          - id: l1-c5
            type: multiple_choice
            text: "Madame Roux : Vous désirez ?\nYou would like four apples. What do you say?"
            say: { en: "Madame Roux asks what you would like. You would like four apples. What do you say?" }
            options: ["Quatre euros, s'il vous plaît.", "Je voudrais quatre pommes, s'il vous plaît.", "C'est combien, les pommes ?"]
            answer: "Je voudrais quatre pommes, s'il vous plaît."
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Madame Roux : Vous désirez ?\nSam : Je voudrais une orange, s'il vous plaît."
            say: { en: "Read the scene. Does Sam's reply fit?" }
            answer: true

  - n: 2
    title: { de: "Im Park", en: "In the park" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Madame Roux : Voilà.\nShe hands you the apples. What do you say?"
            say: { en: "Madame Roux hands you the apples. What do you say?" }
            options: ["Merci.", "C'est combien ?", "Vous désirez ?"]
            answer: "Merci."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "How much is the cake?"
            say: { en: "Listen. How much is the cake?" }
            audio: { turns: [{ fr: "C'est combien, le gâteau ?", speaker: male }, { fr: "Cinq euros, s'il vous plaît.", speaker: female }] }
            options: ["5 €", "15 €", "4 €"]
            answer: "5 €"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Léo : Salut ! Je m'appelle Léo. Comment tu t'appelles ?\nSam : Salut, Léo. Je m'appelle Sam."
            say: { en: "Sam meets Léo in the park. Children say tu to each other. Comment tu t'appelles ? means what's your name?", fr: "Salut ! Je m'appelle Léo. Comment tu t'appelles ? Salut, Léo. Je m'appelle Sam." }
            show: { object: park }
          - text: "Léo : Tu as quel âge ?\nSam : J'ai neuf ans. Et toi ?\nLéo : Moi aussi, j'ai neuf ans !"
            say: { en: "Tu as quel âge ? means how old are you? Et toi ? means and you? Moi aussi means me too.", fr: "Tu as quel âge ? J'ai neuf ans. Et toi ? Moi aussi, j'ai neuf ans !" }
          - text: "Léo : Tu as un animal ?\nSam : Oui, j'ai un chien. Et toi ?\nLéo : Non, je n'ai pas d'animal."
            say: { en: "Tu as un animal ? means have you got a pet? Answer with j'ai, or non, je n'ai pas d'animal.", fr: "Tu as un animal ? Oui, j'ai un chien. Et toi ? Non, je n'ai pas d'animal." }
          - text: "Léo : Tu veux jouer ?\nSam : Oui, je veux bien !"
            say: { en: "Tu veux jouer ? means do you want to play? Oui, je veux bien means yes, I'd like that.", fr: "Tu veux jouer ? Oui, je veux bien !" }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Léo : Salut ! Comment tu t'appelles ?\nWhat do you answer?"
                say: { en: "Léo asks you a question. What do you answer?" }
                options: ["Je m'appelle Sam.", "J'ai neuf ans.", "Ça va bien."]
                answer: "Je m'appelle Sam."
                option_audio: false
                feedback:
                  "J'ai neuf ans.": "That tells your age. Léo asks your name."
                hints:
                  - "Comment tu t'appelles ? asks your name."
                  - "Your name starts with je m'appelle."
                  - "Je m'appelle Sam."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "How old is the child?"
                say: { en: "Listen. How old is the child?" }
                audio: { turns: [{ fr: "Tu as quel âge ?", speaker: male }, { fr: "J'ai dix ans.", speaker: female }] }
                options: ["10", "2", "12"]
                answer: "10"
                hints:
                  - "Listen after j'ai."
                  - "Dix, not deux or douze."
                  - "Dix is ten."
              - id: l2-f3
                type: speak
                text: "Ask Léo if he wants to play."
                say: { en: "Ask Léo if he wants to play.", fr: "Tu veux jouer ?" }
                expected_text: "Tu veux jouer ?"
                hints:
                  - "Want to is tu veux."
                  - "Play is jouer."
                  - "Say it with me: tu veux jouer ?"
              - id: l2-f4
                type: multiple_choice
                text: "You want to know if Léo has got a pet. What do you ask?"
                options: ["Tu as un animal ?", "Tu aimes les animaux ?", "Tu as quel âge ?"]
                answer: "Tu as un animal ?"
                option_audio: false
                hints:
                  - "Have you got is tu as."
                  - "A pet is un animal."
                  - "Tu as un animal ?"
              - id: l2-f5
                type: ordering
                option_audio: false
                text: "Put the scene in the park in order."
                say: { en: "Put the lines of the scene in order." }
                options: ["Je m'appelle Léo.", "Comment tu t'appelles ?", "Je m'appelle Sam. Et toi ?"]
                slot_count: 3
                answer: ["Comment tu t'appelles ?", "Je m'appelle Sam. Et toi ?", "Je m'appelle Léo."]
                hints:
                  - "First comes the question."
                  - "Et toi ? asks the question back."
                  - "Comment tu t'appelles ? Je m'appelle Sam. Et toi ? Je m'appelle Léo."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Léo : Tu as quel âge ?\nWhat do you answer?"
                say: { en: "Léo asks you a question. What do you answer?" }
                options: ["J'ai neuf ans.", "Je m'appelle Sam.", "Oui, je veux bien !"]
                answer: "J'ai neuf ans."
                option_audio: false
                hints: ["Quel âge asks how old you are."]
              - id: l2-s2
                type: audio_choice
                text: "Which pet has the child got?"
                say: { en: "Listen. Which pet has the child got?" }
                audio: { turns: [{ fr: "Tu as un animal ?", speaker: male }, { fr: "Oui, j'ai un lapin.", speaker: female }] }
                options: [{ object: rabbit }, { object: dog }, { object: cat }]
                answer: rabbit
                hints: ["Listen after j'ai."]
              - id: l2-s3
                type: multiple_choice
                text: "Léo : Tu as un animal ?\nYou haven't got a pet. What do you say?"
                say: { en: "You haven't got a pet. What do you say?" }
                options: ["Non, je n'ai pas d'animal.", "Non, je n'aime pas.", "Oui, j'ai un chat."]
                answer: "Non, je n'ai pas d'animal."
                option_audio: false
                hints: ["Tu as is answered with j'ai, or je n'ai pas."]
              - id: l2-s4
                type: true_false
                text: "Léo : Tu veux jouer ?\nSam : J'ai neuf ans."
                say: { en: "Read the scene. Does Sam's reply fit?" }
                answer: false
                hints: ["Léo asks if Sam wants to play."]
              - id: l2-s5
                type: ordering
                option_audio: false
                text: "Put the scene in the park in order."
                say: { en: "Put the lines of the scene in order." }
                options: ["Non, je n'ai pas d'animal.", "Tu as un animal ?", "Oui, j'ai un chat. Et toi ?"]
                slot_count: 3
                answer: ["Tu as un animal ?", "Oui, j'ai un chat. Et toi ?", "Non, je n'ai pas d'animal."]
                hints: ["The question comes first."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Léo : Tu veux jouer ?\nWhat do you answer?"
                say: { en: "Léo asks you a question. What do you answer?" }
                options: ["Oui, je veux bien !", "Oui, j'ai un chien.", "J'ai neuf ans."]
                answer: "Oui, je veux bien !"
                option_audio: false
              - id: l2-n2
                type: audio_choice
                text: "How old is Inès?"
                say: { en: "Listen. How old is Inès?" }
                audio: { fr: "Salut ! Je m'appelle Inès. J'ai huit ans. J'ai un chat.", speaker: female }
                options: ["8", "18", "9"]
                answer: "8"
              - id: l2-n3
                type: speak
                text: "Ask Léo his name."
                say: { en: "Ask Léo his name.", fr: "Comment tu t'appelles ?" }
                expected_text: "Comment tu t'appelles ?"
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Put the lines in order."
                say: { en: "Put the lines of the scene in order." }
                options: ["Moi aussi, j'ai neuf ans !", "Tu as quel âge ?", "J'ai neuf ans. Et toi ?"]
                slot_count: 3
                answer: ["Tu as quel âge ?", "J'ai neuf ans. Et toi ?", "Moi aussi, j'ai neuf ans !"]
              - id: l2-n5
                type: true_false
                text: "Léo : Comment tu t'appelles ?\nSam : Je m'appelle Sam."
                say: { en: "Read the scene. Does Sam's reply fit?" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: reply
            type: multiple_choice
            text: "Madame Roux : Bonjour ! Vous désirez ?\nWhat do you answer?"
            say: { en: "You are at the market again. What do you answer?" }
            options: ["Je voudrais des fraises, s'il vous plaît.", "Je m'appelle Sam.", "Merci, au revoir !"]
            answer: "Je voudrais des fraises, s'il vous plaît."
            option_audio: false
          - id: l2-c2
            part: listen
            type: audio_choice
            text: "Has Hugo got a pet?"
            say: { en: "Listen. Has Hugo got a pet?" }
            audio: { fr: "Salut ! Je m'appelle Hugo. J'ai dix ans. Je n'ai pas d'animal.", speaker: male }
            options: ["no", "yes, a dog", "yes, a cat"]
            answer: "no"
          - id: l2-c3
            part: order
            type: ordering
            option_audio: false
            text: "Put the scene at the ice cream stall in order."
            say: { en: "Put the lines of the scene in order." }
            options: ["Voilà. Merci, au revoir !", "Je voudrais une glace, s'il vous plaît.", "Voilà. C'est trois euros."]
