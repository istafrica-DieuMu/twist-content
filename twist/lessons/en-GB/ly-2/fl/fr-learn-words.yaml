# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-learn-words
skill: fl.culture-strategies.learn-words
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Wörter lernen und behalten (Französisch)
  en: Learning and remembering French words
summary: >
  Ways to remember new French words. Lesson 1 brings picture cards
  (picture on the front, the word with le or la on the back), saying the
  word aloud with a movement (Sautez ! Tapez dans vos mains !), and a few
  words each day instead of many at once. Lesson 2 brings the word book
  (French on the left, English on the right), sorting words by topic, and
  finding words in a picture dictionary by topic and by ABC, looking under
  the word itself and not under le or la, and ends with the skill check.
  Instructions are in English; the French words are read and heard.
metadata:
  year: ly-2
  topic: { de: Lernstrategien, en: Learning strategies }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.word-picture]
  also_practises: [fl.reading.word-picture, fl.listening.classroom-phrases]
  vocabulary: { fr: [le canard, "l'abeille", le soleil, la lune, "l'étoile", le nuage, le serpent, le coquillage, "Sautez !", "Tapez dans vos mains !", le chat, la vache, le gâteau, la tasse, le crayon, la règle, la gomme, la trousse, la jupe, le pull, la robe] }
  forms: [picture, text, audio, drawn]
  drawn: [word-card, table]
  facets: []
  parts:
    - { id: cards, what: { de: Bildkarten mit le oder la nutzen, en: using picture cards with le or la } }
    - { id: remember, what: { de: "Wörter behalten: laut sagen, bewegen, wiederholen", en: "keeping words: saying them aloud, moving and saying them again" } }
    - { id: word-book, what: { de: ein Wörterheft führen und Wörter nach Themen ordnen, en: keeping a word book and sorting words by topic } }
    - { id: dictionary, what: { de: ein Wort im Bildwörterbuch nach Thema und ABC finden, en: finding a word in a picture dictionary by topic and by ABC } }
  misconceptions:
    - id: look-once
      what: Thinks looking at a word once is enough to keep it
      addressed: lesson 1 Learn shows saying, checking and repeating; l1-f2 gives feedback on looking once, and l1-s1 and l2-c2 ask again
    - id: cram
      what: Tries to learn a long list in one go and never repeats it
      addressed: lesson 1 Learn says a few words each day and again the next day; l1-s3, l1-n2 and l2-c2 ask about it
    - id: no-article
      what: Learns the noun without le or la, and later cannot tell whether it is le or la
      addressed: lesson 1 Learn writes le or la on every card; l1-f3 gives feedback on a card without it, and l1-s5, l1-c3 and l2-c5 ask for the best card
    - id: abc-article
      what: Looks under l for la banane or le chat, because the word starts with le or la
      addressed: lesson 2 Learn says to look under the word itself; l2-f5 gives feedback on l, and l2-s4, l2-s5, l2-n3, l2-n4 and l2-c4 ask for the letter or the ABC order
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bildkarten und Bewegungen", en: "Picture cards and movements" }
    goal:
      de: "Merk dir neue Wörter mit Bildkarten und Bewegungen, und schreib immer le oder la dazu, so wie le canard."
      en: "Remember new words with picture cards and movements, and always add le or la, like le canard."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture matches?"
            show: { drawn: word-card, text: "le chat" }
            options: [{ object: cat }, { object: dog }, { object: rabbit }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture matches?"
            show: { drawn: word-card, text: "la pomme" }
            options: [{ object: apple }, { object: banana }, { object: pear }]
            answer: apple
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Picture card: the picture on the front"
            say: { en: "Make picture cards. Draw the picture on the front. Look at it and say the word.", fr: "Le canard." }
            show: { object: duck }
          - text: "the word on the back, with le or la"
            say: { en: "Write the word on the back, and always write le or la with it, so you know which one it takes. Then turn the card over to check.", fr: "Le canard." }
            show: { drawn: word-card, text: "le canard" }
          - text: "Sautez !"
            say: { en: "Say the word aloud and do a movement with it. Your body helps you remember.", fr: "Sautez !" }
            show: { object: jump }
          - text: "A few words every day"
            say: { en: "Learn a few words today, say them again tomorrow, and again in a few days. That way they stay in your head." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                option_audio: false
                text: "This word is on the back of your picture card. What do you draw on the front?"
                show: { drawn: word-card, text: "l'abeille" }
                options: [{ object: bee }, { object: butterfly }, { object: bird }]
                answer: bee
                hints:
                  - "Read the word: l'abeille."
                  - "It is a small insect that makes honey."
                  - "Draw the bee."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which tip helps you keep new words?"
                options: ["I say the word aloud and do a movement.", "I look at the word once.", "I never say it aloud."]
                answer: "I say the word aloud and do a movement."
                feedback:
                  "I look at the word once.": "Once is not enough. Say the word aloud, check it and say it again another day."
                hints:
                  - "Which tip uses your voice and your body?"
                  - "Looking once is soon forgotten."
                  - "Say it aloud and do a movement."
              - id: l1-f3
                type: multiple_choice
                text: "Max makes a card for “chat”. What should he write on the back?"
                options: ["le chat", "chat", "the chat"]
                answer: "le chat"
                option_audio: false
                feedback:
                  "chat": "Nearly! Write le with it, so Max knows it is le chat."
                hints:
                  - "Remember le or la."
                  - "Chat takes le."
                  - "le chat"
              - id: l1-f4
                type: matching
                option_audio: false
                text: "Which picture goes with which card?"
                say: { en: "Tap a card, then its picture." }
                pairs:
                  - { left: { text: "le soleil" }, right: { object: sun } }
                  - { left: { text: "la lune" }, right: { object: moon } }
                  - { left: { text: "l'étoile" }, right: { object: star } }
                  - { left: { text: "le nuage" }, right: { object: cloud } }
                hints:
                  - "Start with the word you know best."
                  - "Le soleil is the sun, la lune is the moon."
                  - "L'étoile is the star, le nuage the cloud."
              - id: l1-f5
                type: speak
                text: "Say it and do it!"
                say: { en: "Clap your hands and say it in French.", fr: "Tapez dans vos mains !" }
                show: { object: clap }
                expected_text: "Tapez dans vos mains !"
                hints:
                  - "Clap while you say it."
                  - "Tapez dans vos mains."
                  - "Say it with me: tapez dans vos mains !"

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Lena looks at the picture, says the word aloud, then turns the card over to check. Is that a good way to learn words?"
                answer: true
                hints: ["She says it and checks it."]
              - id: l1-s2
                type: multiple_choice
                text: "Tom wants to remember “nager”. Which movement fits?"
                options: ["He moves his arms as if he is swimming.", "He claps his hands.", "He sits still."]
                answer: "He moves his arms as if he is swimming."
                hints: ["Nager means to swim."]
              - id: l1-s3
                type: multiple_choice
                text: "When is the best time to say your new words again?"
                options: ["tomorrow, and again in a few days", "never", "once a year"]
                answer: "tomorrow, and again in a few days"
                hints: ["Words stay when you say them again soon."]
              - id: l1-s4
                type: image_multiple_choice
                option_audio: false
                text: "This word is on the back of your picture card. What do you draw on the front?"
                show: { drawn: word-card, text: "le serpent" }
                options: [{ object: snake }, { object: snail }, { object: sun }]
                answer: snake
                hints: ["Le serpent is long and has no legs."]
              - id: l1-s5
                type: multiple_choice
                text: "Your teacher says “la vache”. Which card is best?"
                say: { en: "Your teacher says la vache. Which card is best?" }
                options: ["la vache", "vache", "le vache"]
                answer: "la vache"
                option_audio: false
                hints: ["Listen: la vache."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ben always forgets the word “l'échelle”. What can he do?"
                show: { object: ladder }
                options: ["He makes a picture card with a ladder.", "He reads the word once.", "He learns fifty words at once."]
                answer: "He makes a picture card with a ladder."
              - id: l1-n2
                type: true_false
                text: "It is good to learn lots of words all at once and never again."
                say: { en: "Read the sentence. Is it true?" }
                answer: false
              - id: l1-n3
                type: image_multiple_choice
                option_audio: false
                text: "This word is on the back of your picture card. What do you draw on the front?"
                show: { drawn: word-card, text: "le coquillage" }
                options: [{ object: shell }, { object: snail }, { object: fish }]
                answer: shell
              - id: l1-n4
                type: matching
                option_audio: false
                text: "Which picture goes with which card?"
                say: { en: "Tap a card, then its picture." }
                pairs:
                  - { left: { text: "la vache" }, right: { object: cow } }
                  - { left: { text: "le chat" }, right: { object: cat } }
                  - { left: { text: "le gâteau" }, right: { object: cake } }
                  - { left: { text: "la tasse" }, right: { object: cup } }
              - id: l1-n5
                type: speak
                text: "Say it and do it!"
                say: { en: "Jump and say it in French.", fr: "Sautez !" }
                show: { object: jump }
                expected_text: "Sautez !"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            option_audio: false
            text: "Read the card. Which picture matches?"
            show: { drawn: word-card, text: "le canard" }
            options: [{ object: duck }, { object: hen }, { object: bird }]
            answer: duck
          - id: l1-c2
            type: true_false
            text: "You remember words better when you say them again often."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Which card is best?"
            options: ["la lune", "lune", "the lune"]
            answer: "la lune"
            option_audio: false
          - id: l1-c4
            type: image_multiple_choice
            option_audio: false
            text: "Read the card. Which picture matches?"
            show: { drawn: word-card, text: "le soleil" }
            options: [{ object: moon }, { object: sun }, { object: star }]
            answer: sun
          - id: l1-c5
            type: multiple_choice
            text: "Which movement fits “Tapez dans vos mains !”?"
            options: ["You jump.", "You clap your hands.", "You sit down."]
            answer: "You clap your hands."
          - id: l1-c6
            type: true_false
            text: "A card with only “nuage” on the back, with no le or la, is the best card."
            say: { en: "Read the sentence. Is it true?" }
            answer: false

  - n: 2
    title: { de: "Wörterheft und Bildwörterbuch", en: "Word book and picture dictionary" }
    goal:
      de: "Ordne Wörter nach Themen und nach dem ABC, so steht la banane unter b."
      en: "Sort words by topic and in ABC order, so la banane goes under b."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            option_audio: false
            text: "Read the card. Which picture matches?"
            show: { drawn: word-card, text: "l'étoile" }
            options: [{ object: star }, { object: sun }, { object: moon }]
            answer: star
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Saying a word aloud with a movement helps you remember it."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "My word book"
            say: { en: "In your word book, write the French on the left and the English on the right. To test yourself, cover one side and say the words." }
            show: { drawn: table, rows: [[français, English], [le chat, cat], [le chien, dog], ["l'oiseau", bird]] }
          - text: "Animals: le chat, le chien\nFood: la pomme, le pain"
            say: { en: "Put words that belong together under one topic: animals, food, school, clothes. Then you find them again quickly." }
          - text: "Picture dictionary"
            say: { en: "A picture dictionary has pages by topic, and an ABC list at the back. Look in the right topic, or find the first letter." }
            show: { object: book-open }
          - text: "la banane: look under b\nl'arbre: look under a"
            say: { en: "In the ABC list, look under the word itself, not under le, la or l'. La banane is under b. L'arbre is under a." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                option_audio: false
                text: "Sort the words by topic."
                bins:
                  - { id: animals, show: { text: "animals" } }
                  - { id: food, show: { text: "food" } }
                options:
                  - { text: "le chat", bin: animals }
                  - { text: "la grenouille", bin: animals }
                  - { text: "la vache", bin: animals }
                  - { text: "la pomme", bin: food }
                  - { text: "le pain", bin: food }
                  - { text: "le fromage", bin: food }
                hints:
                  - "Ask: can you eat it?"
                  - "La grenouille is a frog. Le fromage is cheese."
                  - "Le chat, la grenouille and la vache are animals."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What do you write in the gap?"
                show: { drawn: table, rows: [[français, English], [le chien, "?"]] }
                options: ["dog", "cat", "chicken"]
                answer: "dog"
                hints:
                  - "The right side is English."
                  - "Le chien is a pet that barks."
                  - "dog"
              - id: l2-f3
                type: multiple_choice
                text: "In which topic of the picture dictionary do you find “la vache”?"
                options: ["animals", "food", "school"]
                answer: "animals"
                hints:
                  - "What is la vache?"
                  - "La vache is a cow."
                  - "A cow is an animal."
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Put the words in ABC order."
                options: ["chat", "banane", "arbre"]
                slot_count: 3
                answer: ["arbre", "banane", "chat"]
                hints:
                  - "Look at the first letter of each word."
                  - "A, b, c."
                  - "arbre, banane, chat"
              - id: l2-f5
                type: multiple_choice
                text: "Under which letter do you find “la banane” in the ABC list?"
                options: ["b", "l", "a"]
                answer: "b"
                option_audio: false
                feedback:
                  "l": "La is not part of the word. Look under the word itself: banane, b."
                hints:
                  - "Leave out la."
                  - "Which letter does banane start with?"
                  - "b"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "In which topic do you find “le crayon”?"
                options: ["school", "clothes", "animals"]
                answer: "school"
                hints: ["Le crayon is a pencil."]
              - id: l2-s2
                type: matching
                option_audio: false
                text: "Match the French and the English."
                pairs:
                  - { left: { text: "le crayon" }, right: { text: "pencil" } }
                  - { left: { text: "la règle" }, right: { text: "ruler" } }
                  - { left: { text: "la gomme" }, right: { text: "rubber" } }
                hints: ["La règle is for drawing straight lines."]
              - id: l2-s3
                type: sorting
                option_audio: false
                text: "Sort the words by topic."
                bins:
                  - { id: school, show: { text: "school" } }
                  - { id: clothes, show: { text: "clothes" } }
                options:
                  - { text: "le crayon", bin: school }
                  - { text: "la règle", bin: school }
                  - { text: "la trousse", bin: school }
                  - { text: "la jupe", bin: clothes }
                  - { text: "le pull", bin: clothes }
                  - { text: "la robe", bin: clothes }
                hints: ["Can you wear it?"]
              - id: l2-s4
                type: multiple_choice
                text: "Under which letter do you find “l'orange”?"
                options: ["o", "l", "r"]
                answer: "o"
                option_audio: false
                hints: ["Leave out l'."]
              - id: l2-s5
                type: ordering
                option_audio: false
                text: "Put the words in ABC order."
                options: ["le lapin", "la fraise", "le chat"]
                slot_count: 3
                answer: ["le chat", "la fraise", "le lapin"]
                hints: ["Look at the word after le or la."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What do you write in the gap?"
                show: { drawn: table, rows: [[français, English], ["?", cat]] }
                options: ["le chat", "le chien", "la vache"]
                answer: "le chat"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "In which topic do you look for “la fraise”?"
                options: ["food", "clothes", "school"]
                answer: "food"
              - id: l2-n3
                type: ordering
                option_audio: false
                text: "Put the words in ABC order."
                options: ["la pomme", "le gâteau", "la banane"]
                slot_count: 3
                answer: ["la banane", "le gâteau", "la pomme"]
              - id: l2-n4
                type: multiple_choice
                text: "Under which letter do you find “le zèbre”?"
                options: ["z", "l", "e"]
                answer: "z"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Mia covers the English side of her word book and says the words. Is that a good way to test herself?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: cards
            type: image_multiple_choice
            option_audio: false
            text: "Read the card. Which picture matches?"
            show: { drawn: word-card, text: "la vache" }
            options: [{ object: cow }, { object: horse }, { object: sheep }]
            answer: cow
          - id: l2-c2
            part: remember
            type: multiple_choice
            text: "Which way helps you keep new words best?"
            options: ["Say them aloud again tomorrow.", "Look at the list once.", "Learn the whole book in one go."]
            answer: "Say them aloud again tomorrow."
          - id: l2-c3
            part: dictionary
            type: multiple_choice
            text: "In which topic do you find “la jupe”?"
            options: ["clothes", "food", "animals"]
            answer: "clothes"
          - id: l2-c4
            part: dictionary
            type: ordering
            option_audio: false
            text: "Put the words in ABC order."
            options: ["le poisson", "l'arbre", "la maison"]
            slot_count: 3
            answer: ["l'arbre", "la maison", "le poisson"]
          - id: l2-c5
            part: cards
            type: multiple_choice
            text: "Which picture card helps you most with a new word?"
            options: ["the picture on the front, le chien on the back", "only chien on the back", "the picture alone, with no word"]
            answer: "the picture on the front, le chien on the back"
          - id: l2-c6
            part: cards
            type: true_false
            text: "Léo writes only “soleil” on the back of his card, with no le or la. Is that the best card?"
            say: { en: "Read about Léo's card. Is that the best card?" }
            answer: false
          - id: l2-c7
            part: cards
            type: matching
            option_audio: false
            text: "Which card goes with which picture?"
            say: { en: "Tap a card, then its picture." }
            pairs:
              - { left: { text: "l'abeille" }, right: { object: bee } }
              - { left: { text: "le serpent" }, right: { object: snake } }
              - { left: { text: "le coquillage" }, right: { object: shell } }
          - id: l2-c8
            part: cards
            type: multiple_choice
            text: "What goes on the front of a picture card?"
            options: ["the English word", "the picture", "nothing"]
            answer: "the picture"
          - id: l2-c9
            part: remember
            type: multiple_choice
            text: "Inès jumps each time she says her new word. Which word is she learning?"
            options: ["nager", "sauter", "Tapez dans vos mains !"]
            answer: "sauter"
            option_audio: false
          - id: l2-c10
            part: remember
            type: true_false
            text: "You learn five new words today and say them again tomorrow. That helps you remember them."
            say: { en: "Read the sentences. Is that true?" }
            answer: true
          - id: l2-c11
            part: remember
            type: multiple_choice
            text: "Sam has twenty new words to learn. What is the best plan?"
            options: ["all twenty tonight, then never again", "a few words each day, and say them again", "look at them once"]
            answer: "a few words each day, and say them again"
          - id: l2-c12
            part: remember
            type: true_false
            text: "Looking at a new word once is enough to remember it."
            say: { en: "Read the sentence. Is it true?" }
            answer: false
          - id: l2-c13
            part: word-book
            type: true_false
            text: "This is a line from Max's word book. Is it right?"
            say: { en: "This is a line from Max's word book. Is it right?" }
            show: { drawn: table, rows: [[français, English], [la lune, sun]] }
            answer: false
          - id: l2-c14
            part: word-book
            type: sorting
            option_audio: false
            text: "Animals or clothes? Sort the words."
            bins:
              - { id: animals, show: { text: "animals" } }
              - { id: clothes, show: { text: "clothes" } }
            options:
              - { text: "le canard", bin: animals }
              - { text: "la robe", bin: clothes }
              - { text: "le serpent", bin: animals }
              - { text: "la jupe", bin: clothes }
          - id: l2-c15
            part: word-book
            type: true_false
            text: "In a word book, the French goes on the left and the English on the right."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
          - id: l2-c16
            part: word-book
            type: multiple_choice
            text: "Tom tests himself with his word book. What does he do?"
            options: ["He reads both sides once.", "He covers one side and says the words.", "He tears out the page."]
            answer: "He covers one side and says the words."
          - id: l2-c17
            part: word-book
            type: matching
            option_audio: false
            text: "Which English word goes with each French word?"
            pairs:
              - { left: { text: "le soleil" }, right: { text: "sun" } }
              - { left: { text: "la tasse" }, right: { text: "cup" } }
              - { left: { text: "le nuage" }, right: { text: "cloud" } }
          - id: l2-c18
            part: dictionary
            type: true_false
            text: "Léa looks for “la tasse” under t in the ABC list. Is that right?"
            say: { en: "Read about Léa. Is that right?" }
            answer: true
          - id: l2-c19
            part: dictionary
            type: multiple_choice
            text: "Which topic page of the picture dictionary has le canard, la vache and le chat?"
            options: ["food", "clothes", "animals"]
            answer: "animals"
          - id: l2-c20
