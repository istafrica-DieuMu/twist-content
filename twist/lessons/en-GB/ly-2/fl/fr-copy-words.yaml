# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-copy-words
skill: fl.writing.copy-words
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Wörter abschreiben (Französisch)
  en: Copying French words
summary: >
  Copying familiar French words exactly and labelling pictures. Lesson 1
  copies short words with their le or la from a word card, with the
  letters you do not hear (le chat, le lit), double letters (la pomme, la
  trousse) and accents (l'école, la règle); lesson 2 labels pictures from
  a word list (la girafe, le garçon, le zèbre, le hérisson) and ends with
  the skill check. The model is always on screen. The child types on the
  French letter keyboard, which has é, è, à and ç.
metadata:
  year: ly-2
  topic: { de: Schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.word-picture]
  also_practises: [fl.reading.sound-spelling]
  vocabulary: { fr: [le chat, la pomme, le poisson, le lit, "l'école", la trousse, "l'éléphant", la chaise, la règle, le crayon, le lapin, le ballon, le zèbre, la gomme, le stylo, la fraise, la girafe, le garçon, le papillon, le hérisson, la baleine] }
  forms: [picture, text, drawn]
  drawn: [word-card]
  facets: []
  parts:
    - { id: copy, what: { de: "ein Wort genau abschreiben, mit Akzenten und allen Buchstaben", en: "copying a word exactly, with its accents and every letter" } }
    - { id: label, what: { de: ein Bild mit einem Wort aus einer Wortliste beschriften, en: labelling a picture with a word from a word list } }
    - { id: check, what: { de: eine Abschrift Buchstabe für Buchstabe prüfen, en: checking a copy letter by letter } }
  misconceptions:
    - id: drops-accents
      what: Leaves out accents and the cedilla (ecole, elephant, garcon), as English has none
      addressed: lesson 1 Learn says accents are part of the word; l1-f5 and l1-s2 copy é, l1-n4 chooses è, l2-f5, l2-n4, l2-c3 and l2-c4 test a copy without its accent, and lesson 2 Learn shows ç
    - id: drops-letters
      what: Leaves out letters that are not heard or are doubled (le li, la pome, le poison), or copies a French word with its English spelling (la giraffe)
      addressed: lesson 1 Learn shows the silent t of chat and the double m of pomme; l1-f2 gives feedback on la pome, l1-f4 and l1-n3 show copies with a letter missing, l2-f1 hints at the one f of girafe and l2-f3 gives feedback on papilon
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Genau abschreiben", en: "Copy it exactly" }
    goal:
      de: "Schreib französische Wörter ganz genau ab, auch die stummen Buchstaben und die kleinen Striche, so wie l'école."
      en: "Copy French words exactly, with the letters you do not hear and the accents, like l'école."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture is it?"
            show: { drawn: word-card, text: "le chien" }
            options: [{ object: dog }, { object: cat }, { object: chair }]
            answer: dog
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            option_audio: false
            text: "Read the word. Which picture is it?"
            show: { drawn: word-card, text: "le pain" }
            options: [{ object: bread }, { object: hand }, { object: oven }]
            answer: bread
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "le chat"
            say: { en: "Listen to the French word for cat. What do you think: is there a t at the end when you write it?", fr: "le chat" }
            show: { object: cat }
          - text: "le chat, le lit"
            say: { en: "Yes, there is! You write the t, but you do not hear it. So copy what you see, not what you hear. French words often have letters you do not hear: le chat and le lit both end in a t." }
            show: { drawn: word-card, text: "le chat" }
          - text: "la pomme, la trousse"
            say: { en: "Look out for double letters. Pomme has two m's, trousse has two s's. Count them as you copy." }
          - text: "l'école, la règle"
            say: { en: "The little marks over a letter are accents. They are part of the word, so copy them too: é in école, è in règle. The keyboard has é, è, à and ç." }
          - text: "Did you know? Keyboards in France start with A Z E R T Y, not Q W E R T Y."
            say: { en: "Did you know? Keyboards in France are not the same as ours. The top row of letters starts A, Z, E, R, T, Y, not Q, W, E, R, T, Y. And they have keys for é, è, ç and à, so French children can type accents with one press." }
          - text: "look, copy, check"
            say: { en: "So: look at the word, copy it, then check your copy against it, one letter at a time." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                keyboard: letters
                text: "Copy the word."
                show: { drawn: word-card, text: "le chat" }
                answer: "le chat"
                hints:
                  - "Copy it letter by letter, with le in front."
                  - "Chat ends in a t that you do not hear."
                  - "le chat"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Which word is copied correctly?"
                show: { drawn: word-card, text: "la pomme" }
                options: ["la pomme", "la pome", "la pom"]
                answer: "la pomme"
                feedback:
                  "la pome": "Look again: pomme has two m's."
                hints:
                  - "Compare each copy with the card, letter by letter."
                  - "Count the m's on the card, and look at the end."
                  - "la pomme"
              - id: l1-f3
                type: fill_in_blank
                option_audio: false
                text: "Fill in the missing letters."
                show: { drawn: word-card, text: "le poisson" }
                frame: "le poi_on"
                options: ["ss", "s", "c"]
                answer: ["ss"]
                hints:
                  - "Look at the middle of the word on the card."
                  - "Poisson has a double letter in the middle."
                  - "ss: le poisson."
              - id: l1-f4
                type: true_false
                text: "Card: le lit\nCopy: le li\nIs the copy right?"
                answer: false
                hints:
                  - "Compare letter by letter."
                  - "Look at the end of the word."
                  - "No. Lit ends in a t, even though you do not hear it."
              - id: l1-f5
                type: text_input
                keyboard: letters
                text: "Copy the word."
                show: { drawn: word-card, text: "l'école" }
                answer: "l'école"
                hints:
                  - "Copy every letter, the apostrophe and the accent."
                  - "The first e has an accent: é."
                  - "l'école"

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                keyboard: letters
                text: "Copy the word."
                show: { drawn: word-card, text: "la trousse" }
                answer: "la trousse"
                hints: ["Trousse has two s's."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Which word is copied correctly?"
                show: { drawn: word-card, text: "l'éléphant" }
                options: ["l'éléphant", "l'elephant", "l'éléfant"]
                answer: "l'éléphant"
                hints: ["Check the accents and the ph."]
              - id: l1-s3
                type: fill_in_blank
                option_audio: false
                text: "Fill in the missing letters."
                show: { drawn: word-card, text: "la chaise" }
                frame: "la ch_se"
                options: ["ai", "è", "e"]
                answer: ["ai"]
                hints: ["Look at the card: two letters go in the gap."]
              - id: l1-s4
                type: true_false
                text: "Card: la règle\nCopy: la règle\nIs the copy right?"
                answer: true
                hints: ["Check the accent on the first e."]
              - id: l1-s5
                type: text_input
                keyboard: letters
                text: "Copy the word."
                show: { drawn: word-card, text: "le crayon" }
                answer: "le crayon"
                hints: ["Crayon has a y in the middle."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                keyboard: letters
                text: "Copy the word."
                show: { drawn: word-card, text: "le lapin" }
                answer: "le lapin"
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Which word is copied correctly?"
                show: { drawn: word-card, text: "le ballon" }
                options: ["le ballon", "le balon", "le ballonn"]
                answer: "le ballon"
              - id: l1-n3
                type: true_false
                text: "Card: le poisson\nCopy: le poison\nIs the copy right?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                option_audio: false
                text: "Fill in the missing letter."
                show: { drawn: word-card, text: "le zèbre" }
                frame: "le z_bre"
                options: ["è", "é", "e"]
                answer: ["è"]
              - id: l1-n5
                type: text_input
                keyboard: letters
                text: "Copy the word."
                show: { drawn: word-card, text: "la gomme" }
                answer: "la gomme"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            keyboard: letters
            text: "Copy the word."
            show: { drawn: word-card, text: "le stylo" }
            answer: "le stylo"
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Which word is copied correctly?"
            show: { drawn: word-card, text: "la fraise" }
            options: ["la fraise", "la frais", "la fraize"]
            answer: "la fraise"
          - id: l1-c3
            type: true_false
            text: "Card: l'école\nCopy: l'ecole\nIs the copy right?"
            answer: false
          - id: l1-c4
            type: text_input
            keyboard: letters
            text: "Copy the word."
            show: { drawn: word-card, text: "le lit" }
            answer: "le lit"
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "Which word is copied correctly?"
            show: { drawn: word-card, text: "la règle" }
            options: ["la regle", "la règle", "la régle"]
            answer: "la règle"
          - id: l1-c6
            type: true_false
            text: "Card: la trousse\nCopy: la trousse\nIs the copy right?"
            answer: true

  - n: 2
    title: { de: "Bilder beschriften", en: "Labelling pictures" }
    goal:
      de: "Such das passende Wort aus der Liste und schreib es genau unter das Bild, so wie le garçon."
      en: "Find the right word in the list and write it under the picture, like le garçon."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            keyboard: letters
            text: "Copy the word."
            show: { drawn: word-card, text: "la pomme" }
            answer: "la pomme"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Which word is copied correctly?"
            show: { drawn: word-card, text: "la trousse" }
            options: ["la trousse", "la trouse", "la trous"]
            answer: "la trousse"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "giraffe in French: ff or f?"
            say: { en: "What do you think: does French write giraffe with two f's, like English, or with one?" }
            show: { object: giraffe }
          - text: "la girafe, le papillon"
            say: { en: "With one! Some words look like English but are spelt differently. French girafe has one f. Papillon, a butterfly, has two l's." }
          - text: "Word list: la girafe, le garçon, le zèbre"
            say: { en: "Now you label pictures, like a picture dictionary. The words are in a word list. Find the word that fits the picture, then copy it exactly." }
            show: { object: giraffe }
          - text: "le garçon"
            say: { en: "Garçon, a boy, has a c with a little tail: ç. It sounds like s. The keyboard has it.", fr: "le garçon" }
            show: { object: boy }
          - text: "look, copy, check"
            say: { en: "When you have written the label, check it against the list, one letter at a time, accents too." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: text_input
                keyboard: letters
                text: "Label the picture.\nWord list: la girafe, le garçon, le zèbre"
                show: { object: giraffe }
                answer: "la girafe"
                hints:
                  - "Which word in the list is this animal?"
                  - "It is la girafe. French girafe has one f, not two."
                  - "la girafe"
                difficulty: easy
              - id: l2-f2
                type: text_input
                keyboard: letters
                text: "Label the picture.\nWord list: la girafe, le garçon, le zèbre"
                show: { object: boy }
                answer: "le garçon"
                hints:
                  - "Which word in the list means boy?"
                  - "Le garçon. Look for the c with a tail."
                  - "le garçon"
              - id: l2-f3
                type: multiple_choice
                option_audio: false
                text: "Which label is right?\nWord list: le papillon, la fraise, le hérisson"
                show: { object: butterfly }
                options: ["le papillon", "le papilon", "le pappillon"]
                answer: "le papillon"
                feedback:
                  "le papilon": "Look at the list: papillon has two l's."
                hints:
                  - "Find papillon in the list and compare."
                  - "Count the p's and the l's."
                  - "le papillon"
              - id: l2-f4
                type: matching
                option_audio: false
                text: "Match each label with its picture."
                say: { en: "Read each label. Tap it, then its picture." }
                pairs:
                  - left: { text: "le zèbre" }
                    right: { object: zebra }
                  - left: { text: "la girafe" }
                    right: { object: giraffe }
                  - left: { text: "le garçon" }
                    right: { object: boy }
                hints:
                  - "Start with the one you are sure of."
                  - "Zèbre sounds like zebra; girafe like giraffe."
                  - "Le zèbre: the zebra. La girafe: the giraffe. Le garçon: the boy."
              - id: l2-f5
                type: true_false
                text: "Label: l'elephant\nWord list: l'éléphant, le lapin, la baleine\nIs the label right?"
                show: { object: elephant }
                answer: false
                hints:
                  - "Compare the label with the list."
                  - "Look at the e's."
                  - "No. Éléphant has two é's: l'éléphant."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                keyboard: letters
                text: "Label the picture.\nWord list: la girafe, le garçon, le zèbre"
                show: { object: zebra }
                answer: "le zèbre"
                hints: ["The accent on zèbre leans back: è."]
              - id: l2-s2
                type: text_input
                keyboard: letters
                text: "Label the picture.\nWord list: le hérisson, la fraise, le papillon"
                show: { object: hedgehog }
                answer: "le hérisson"
                hints: ["Hérisson has é and two s's."]
              - id: l2-s3
                type: multiple_choice
                option_audio: false
                text: "Which label is right?\nWord list: le hérisson, la fraise, le papillon"
                show: { object: strawberry }
                options: ["la fraise", "la frése", "la frais"]
                answer: "la fraise"
                hints: ["Find fraise in the list and compare."]
              - id: l2-s4
                type: true_false
                text: "Label: le papillon\nWord list: le hérisson, la fraise, le papillon\nIs the label right?"
                show: { object: butterfly }
                answer: true
                hints: ["Count the l's in the label and in the list."]
              - id: l2-s5
                type: text_input
                keyboard: letters
                text: "Label the picture.\nWord list: l'école, la chaise, la trousse"
                show: { object: school }
                answer: "l'école"
                hints: ["Start with l' and keep the accent."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                keyboard: letters
                text: "Label the picture.\nWord list: l'éléphant, le lapin, la baleine"
                show: { object: elephant }
                answer: "l'éléphant"
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "Which label is right?\nWord list: le garçon, la girafe, le zèbre"
                show: { object: boy }
                options: ["le garçon", "le garcon", "le garson"]
                answer: "le garçon"
              - id: l2-n3
                type: text_input
                keyboard: letters
                text: "Label the picture.\nWord list: l'éléphant, le lapin, la baleine"
                show: { object: whale }
                answer: "la baleine"
              - id: l2-n4
                type: true_false
                text: "Label: la regle\nWord list: la règle, la gomme, le crayon\nIs the label right?"
                show: { object: ruler }
                answer: false
              - id: l2-n5
                type: text_input
                keyboard: letters
                text: "Label the picture.\nWord list: l'éléphant, le lapin, la baleine"
                show: { object: rabbit }
                answer: "le lapin"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: copy
            type: text_input
            keyboard: letters
            text: "Copy the word."
            show: { drawn: word-card, text: "la chaise" }
            answer: "la chaise"
          - id: l2-c2
            part: label
            type: text_input
            keyboard: letters
            text: "Label the picture.\nWord list: le poisson, la pomme, le zèbre"
            show: { object: fish }
            answer: "le poisson"
          - id: l2-c3
            part: label
            type: multiple_choice
            option_audio: false
            text: "Which label is right?\nWord list: le hérisson, la gomme, le stylo"
            show: { object: hedgehog }
            options: ["le hérisson", "le herisson", "le hérison"]
            answer: "le hérisson"
          - id: l2-c4
            part: check
            type: true_false
            text: "Card: le garçon\nCopy: le garcon\nIs the copy right?"
            answer: false
          - id: l2-c5
            part: label
            type: text_input
            keyboard: letters
            text: "Label the picture.\nWord list: la fraise, le hérisson, la gomme"
            show: { object: strawberry }
            answer: "la fraise"
          - id: l2-c6
            part: copy
            type: text_input
            keyboard: letters
            text: "Copy the word."
            show: { drawn: word-card, text: "la règle" }
            answer: "la règle"
          - id: l2-c7
            part: copy
            type: text_input
            keyboard: letters
            text: "Copy the word."
            show: { drawn: word-card, text: "le papillon" }
            answer: "le papillon"
          - id: l2-c8
            part: copy
            type: multiple_choice
            option_audio: false
            text: "Which word is copied correctly?"
            show: { drawn: word-card, text: "la baleine" }
            options: ["la balene", "la baleine", "la baleinne"]
            answer: "la baleine"
          - id: l2-c9
            part: copy
            type: fill_in_blank
            option_audio: false
            text: "Fill in the missing letters."
            show: { drawn: word-card, text: "la girafe" }
            frame: "la gira_"
            options: ["ffe", "fe", "phe"]
            answer: ["fe"]
          - id: l2-c10
            part: copy
            type: text_input
            keyboard: letters
            text: "Copy the word."
            show: { drawn: word-card, text: "le zèbre" }
            answer: "le zèbre"
          - id: l2-c11
            part: copy
            type: fill_in_blank
            option_audio: false
            text: "Fill in the missing letter."
            show: { drawn: word-card, text: "le hérisson" }
            frame: "le h_risson"
            options: ["è", "e", "é"]
            answer: ["é"]
          - id: l2-c12
            part: label
            type: text_input
            keyboard: letters
            text: "Label the picture.\nWord list: la baleine, le chat, la règle"
            show: { object: cat }
            answer: "le chat"
          - id: l2-c13
            part: label
            type: multiple_choice
            option_audio: false
            text: "Which label is right?\nWord list: la girafe, le lit, la gomme"
            show: { object: bed }
            options: ["le li", "le lit", "le lie"]
            answer: "le lit"
          - id: l2-c14
            part: label
            type: text_input
            keyboard: letters
            text: "Label the picture.\nWord list: le ballon, la trousse, le papillon"
            show: { object: pencil-case }
            answer: "la trousse"
          - id: l2-c15
            part: label
            type: matching
            option_audio: false
            text: "Which label goes with which picture?"
            say: { en: "Read each label. Tap it, then the picture it names." }
            pairs:
              - left: { text: "la baleine" }
                right: { object: whale }
              - left: { text: "le hérisson" }
                right: { object: hedgehog }
              - left: { text: "la pomme" }
                right: { object: apple }
          - id: l2-c16
            part: check
            type: true_false
            text: "Card: la gomme\nCopy: la gome\nIs the copy right?"
            answer: false
          - id: l2-c17
            part: check
            type: true_false
            text: "Card: le crayon\nCopy: le crayon\nIs the copy right?"
            answer: true
          - id: l2-c18
            part: check
            type: true_false
            text: "Label: la girafe\nWord list: la girafe, le zèbre, le lapin\nIs the label right?"
            show: { object: giraffe }
            answer: true
          - id: l2-c19
            part: check
            type: multiple_choice
            option_audio: false
            text: "Which copy has a mistake?"
            show: { drawn: word-card, text: "l'éléphant" }
            options: ["l'éléphant", "l'élephant"]
            answer: "l'élephant"
          - id: l2-c20
            part: check
            type: true_false
            text: "Card: le hérisson\nCopy: le hérrisson\nIs the copy right?"
            answer: false
