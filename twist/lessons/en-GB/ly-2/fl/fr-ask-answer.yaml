# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-ask-answer
skill: fl.speaking.ask-answer
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Fragen stellen und beantworten (Französisch)
  en: Asking and answering questions in French
summary: >
  Asking simple questions in French and giving the answer that fits.
  Lesson 1 asks Tu as un animal ?, Qu'est-ce que c'est ? and C'est de
  quelle couleur ? and answers them (Oui, j'ai un chat. Non, je n'ai pas
  de chien. C'est un livre. C'est vert.); lesson 2 asks Où est ... ? and
  Combien de ... ?, answers with Il est dans ... and Il y a ..., matches
  each question with the kind of answer it wants, and ends with the skill
  check. Speaking tasks are practice only.
metadata:
  year: ly-2
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.likes, fl.grammar.questions]
  also_practises: [fl.themes.school, fl.themes.colours, fl.themes.numbers-to-10]
  vocabulary: { fr: ["Tu as un animal ?", "Oui, j'ai ...", "Non, je n'ai pas de ...", "Qu'est-ce que c'est ?", "C'est un ...", "C'est de quelle couleur ?", "Où est ... ?", "Il est dans ...", "Elle est dans ...", "Combien de ... ?", "Il y a ..."] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: pas-un
      what: Keeps un or une after pas (je n'ai pas un chien) instead of de
      addressed: lesson 1 Learn shows je n'ai pas de chien and je n'ai pas d'animal; l1-f1 gives feedback on pas un, and l1-s1, l1-n4, l1-c1 and l2-c1 keep pas un among the options or ask for de
    - id: answer-kind
      what: Gives an answer that does not fit the question word (a place for Combien ?, a thing for C'est de quelle couleur ?)
      addressed: lesson 2 Learn pairs Où with a place and Combien with a number; l1-f3 gives feedback on a thing for a colour question and l2-f1 on a place for Combien; the which-question tasks and the matching task l2-f4 test the pairing
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Hast du ...? Was ist das?", en: "Have you got ...? What is it?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which answer fits the question?"
            say: { en: "Listen to the question. Which answer fits?" }
            audio: { fr: "Tu aimes les pommes ?" }
            options: ["Oui, j'aime les pommes.", "C'est une pomme.", "Trois."]
            answer: "Oui, j'aime les pommes."
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "What does Hugo like?"
            say: { en: "Listen. What does Hugo like?" }
            audio: { fr: "Je m'appelle Hugo. J'aime le foot." }
            options: [{ object: play-football }, { object: swim }, { object: read }]
            answer: play-football
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Tu as un animal ?\nOui, j'ai un chat."
            say: { en: "Tu as un animal ? means Have you got a pet? Answer: oui, j'ai un chat. Yes, I have got a cat.", fr: "Tu as un animal ? Oui, j'ai un chat." }
            show: { object: cat }
          - text: "Non, je n'ai pas de chien.\nNon, je n'ai pas d'animal."
            say: { en: "To say no, put n' and pas round ai. After pas, un and une change to de, or d' before a vowel: je n'ai pas de chien, je n'ai pas d'animal.", fr: "Non, je n'ai pas de chien. Non, je n'ai pas d'animal." }
          - text: "Qu'est-ce que c'est ?\nC'est un livre."
            say: { en: "Qu'est-ce que c'est ? What is it? Answer with c'est: c'est un livre.", fr: "Qu'est-ce que c'est ? C'est un livre." }
            show: { object: book }
          - text: "C'est de quelle couleur ?\nC'est vert."
            say: { en: "C'est de quelle couleur ? What colour is it? Answer with c'est and the colour: c'est vert.", fr: "C'est de quelle couleur ? C'est vert." }
            show: { object: crayon, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "You have not got a pet."
                say: { en: "You have not got a pet. Listen to the question. Which answer fits?" }
                audio: { fr: "Tu as un animal ?" }
                options: ["Non, je n'ai pas d'animal.", "Non, je n'ai pas un animal.", "Oui, j'ai un chien."]
                answer: "Non, je n'ai pas d'animal."
                feedback:
                  "Non, je n'ai pas un animal.": "After pas, un changes: je n'ai pas d'animal."
                hints:
                  - "You have not got a pet, so the answer starts with non."
                  - "After pas, un and une change to de, or d' before a vowel."
                  - "Non, je n'ai pas d'animal."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Look at the picture. Which answer fits the question?"
                say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
                show: { object: pencil-case }
                audio: { fr: "Qu'est-ce que c'est ?" }
                options: ["C'est une trousse.", "C'est vert.", "Oui, j'ai une trousse."]
                answer: "C'est une trousse."
                hints:
                  - "Qu'est-ce que c'est ? asks what something is."
                  - "Answer with c'est and the thing."
                  - "C'est une trousse."
              - id: l1-f3
                type: audio_choice
                text: "Look at the picture. Which answer fits the question?"
                say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
                show: { object: ball, colour: red }
                audio: { fr: "C'est de quelle couleur ?" }
                options: ["C'est rouge.", "C'est un ballon.", "J'ai un ballon."]
                answer: "C'est rouge."
                feedback:
                  "C'est un ballon.": "That says what it is. The question asks for the colour."
                hints:
                  - "Couleur sounds like colour."
                  - "The answer needs a colour word."
                  - "C'est rouge."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "Which question goes with this answer?\n“Oui, j'ai un lapin.”"
                options: ["Tu as un lapin ?", "Qu'est-ce que c'est ?", "C'est de quelle couleur ?"]
                answer: "Tu as un lapin ?"
                hints:
                  - "The answer starts with oui. Which question can you answer with oui?"
                  - "J'ai answers a question with tu as."
                  - "Tu as un lapin ?"
              - id: l1-f5
                type: speak
                say: { en: "Ask in French: Have you got a pet?", fr: "Tu as un animal ?" }
                show: { object: dog }
                expected_text: "Tu as un animal ?"
                hints:
                  - "Start with tu as."
                  - "A pet is un animal. Let your voice go up at the end."
                  - "Say it with me: Tu as un animal ?"

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "You have not got a dog."
                say: { en: "You have not got a dog. Listen to the question. Which answer fits?" }
                audio: { fr: "Tu as un chien ?" }
                options: ["Non, je n'ai pas de chien.", "Non, je n'ai pas un chien.", "Oui, j'aime les chiens."]
                answer: "Non, je n'ai pas de chien."
                hints: ["After pas, un changes to de."]
              - id: l1-s2
                type: audio_choice
                text: "Look at the picture. Which answer fits the question?"
                say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
                show: { object: car, colour: blue }
                audio: { fr: "C'est de quelle couleur ?" }
                options: ["C'est bleu.", "C'est une voiture.", "Non, merci."]
                answer: "C'est bleu."
                hints: ["The question asks for a colour."]
              - id: l1-s3
                type: fill_in_blank
                option_audio: false
                text: "Finish the answer.\nQu'est-ce que c'est ?"
                say: { en: "What is it? Finish the answer." }
                show: { object: book }
                frame: "C'est _ livre."
                options: ["un", "une", "de"]
                answer: ["un"]
                hints: ["Livre is an un noun."]
              - id: l1-s4
                type: multiple_choice
                option_audio: false
                text: "Which question goes with this answer?\n“C'est jaune.”"
                options: ["C'est de quelle couleur ?", "Tu as un animal ?", "Qu'est-ce que c'est ?"]
                answer: "C'est de quelle couleur ?"
                hints: ["Jaune is a colour."]
              - id: l1-s5
                type: speak
                say: { en: "Answer in French: It's a book.", fr: "C'est un livre." }
                show: { object: book }
                expected_text: "C'est un livre."
                hints: ["Say it with me: C'est un livre."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "You have got a bike."
                say: { en: "You have got a bike. Listen to the question. Which answer fits?" }
                audio: { fr: "Tu as un vélo ?" }
                options: ["Oui, j'ai un vélo.", "Oui, j'aime le vélo.", "C'est un vélo."]
                answer: "Oui, j'ai un vélo."
              - id: l1-n2
                type: audio_choice
                text: "Look at the picture. Which answer fits the question?"
                say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
                show: { object: umbrella }
                audio: { fr: "Qu'est-ce que c'est ?" }
                options: ["C'est un parapluie.", "C'est bleu.", "Non, je n'ai pas de parapluie."]
                answer: "C'est un parapluie."
              - id: l1-n3
                type: audio_choice
                text: "Look at the picture. Which answer fits the question?"
                say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
                show: { object: leaf, colour: yellow }
                audio: { fr: "C'est de quelle couleur ?" }
                options: ["C'est jaune.", "C'est une feuille.", "C'est vert."]
                answer: "C'est jaune."
              - id: l1-n4
                type: fill_in_blank
                option_audio: false
                text: "Finish the answer.\nTu as un chat ?"
                say: { en: "Have you got a cat? No. Finish the answer." }
                frame: "Non, je n'ai pas _ chat."
                options: ["de", "un", "le"]
                answer: ["de"]
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                text: "Which question goes with this answer?\n“C'est une banane.”"
                options: ["Qu'est-ce que c'est ?", "Tu as une banane ?", "C'est de quelle couleur ?"]
                answer: "Qu'est-ce que c'est ?"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "You have not got a fish."
            say: { en: "You have not got a fish. Listen to the question. Which answer fits?" }
            audio: { fr: "Tu as un poisson ?" }
            options: ["Non, je n'ai pas de poisson.", "Non, je n'ai pas un poisson.", "Oui, j'ai un poisson."]
            answer: "Non, je n'ai pas de poisson."
          - id: l1-c2
            type: audio_choice
            text: "Look at the picture. Which answer fits the question?"
            say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
            show: { object: crayon, colour: purple }
            audio: { fr: "C'est de quelle couleur ?" }
            options: ["C'est violet.", "C'est un crayon.", "C'est rose."]
            answer: "C'est violet."
          - id: l1-c3
            type: audio_choice
            text: "Look at the picture. Which answer fits the question?"
            say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
            show: { object: rubber }
            audio: { fr: "Qu'est-ce que c'est ?" }
            options: ["C'est une gomme.", "C'est rose.", "J'ai une gomme."]
            answer: "C'est une gomme."

  - n: 2
    title: { de: "Wo ist ...? Wie viele?", en: "Where is ...? How many?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "You have got a cat."
            say: { en: "You have got a cat. Listen to the question. Which answer fits?" }
            audio: { fr: "Tu as un animal ?" }
            options: ["Oui, j'ai un chat.", "Non, je n'ai pas de chat.", "C'est un chat."]
            answer: "Oui, j'ai un chat."
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Look at the picture. Which answer fits the question?"
            say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
            show: { object: balloon, colour: green }
            audio: { fr: "C'est de quelle couleur ?" }
            options: ["C'est vert.", "C'est un ballon.", "Oui, merci."]
            answer: "C'est vert."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Où est le chat ?\nIl est dans le jardin.\nOù est la souris ?\nElle est dans la cuisine."
            say: { en: "Où est ... ? asks where. The answer is a place: il est dans le jardin, it's in the garden. For a une noun, say elle: Où est la souris ? Elle est dans la cuisine.", fr: "Où est le chat ? Il est dans le jardin. Où est la souris ? Elle est dans la cuisine." }
            show: { object: garden }
          - text: "Combien de pommes ?\nIl y a trois pommes."
            say: { en: "Combien de ... ? asks how many. Answer with il y a, there are, and a number: il y a trois pommes.", fr: "Combien de pommes ? Il y a trois pommes." }
            show: { object: apple, count: 3, layout: row }
          - text: "Où ? → a place\nCombien ? → a number"
            say: { en: "So listen for the question word first. Où wants a place. Combien wants a number." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Combien de chats ?" }
                options: ["Il y a deux chats.", "Il est dans le jardin.", "C'est un chat."]
                answer: "Il y a deux chats."
                feedback:
                  "Il est dans le jardin.": "That says where. Combien asks how many, so the answer needs a number."
                hints:
                  - "Listen for the question word: combien."
                  - "Combien wants a number."
                  - "Il y a deux chats."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Where is the dog?"
                say: { en: "Listen. Where is the dog?" }
                audio: { fr: "Où est le chien ? Il est dans le parc." }
                options: [{ object: park }, { object: kitchen }, { object: school }]
                answer: park
                hints:
                  - "Listen to the answer after the question."
                  - "Il est dans le parc."
                  - "Le parc is the park."
              - id: l2-f3
                type: audio_choice
                text: "Count the balls. Which answer fits the question?"
                say: { en: "Count the balls. Listen to the question. Which answer fits?" }
                show: { object: ball, count: 4, layout: row }
                audio: { fr: "Combien de ballons ?" }
                options: ["Il y a quatre ballons.", "Il y a cinq ballons.", "Il est dans la maison."]
                answer: "Il y a quatre ballons."
                hints:
                  - "Combien wants a number. Count the balls."
                  - "There are four. Quatre is four."
                  - "Il y a quatre ballons."
              - id: l2-f4
                type: matching
                option_audio: false
                text: "Match each question with its answer."
                say: { en: "Tap a question, then the answer that fits." }
                pairs:
                  - left: { text: "Où est le chat ?" }
                    right: { text: "Il est dans le jardin." }
                  - left: { text: "Combien de chats ?" }
                    right: { text: "Il y a trois chats." }
                  - left: { text: "Qu'est-ce que c'est ?" }
                    right: { text: "C'est un chat." }
                  - left: { text: "C'est de quelle couleur ?" }
                    right: { text: "C'est noir." }
                hints:
                  - "Look at the question word in each question."
                  - "Où wants a place; combien wants a number; couleur wants a colour."
                  - "Où: dans le jardin. Combien: il y a trois. Qu'est-ce que c'est: c'est un chat. Couleur: c'est noir."
              - id: l2-f5
                type: speak
                say: { en: "Ask in French: Where is the cat?", fr: "Où est le chat ?" }
                show: { object: cat }
                expected_text: "Où est le chat ?"
                hints:
                  - "Start with où, where."
                  - "Où est, then le chat."
                  - "Say it with me: Où est le chat ?"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which answer fits the question?"
                say: { en: "Listen to the question. Which answer fits?" }
                audio: { fr: "Où est Papa ?" }
                options: ["Il est dans la cuisine.", "Il y a trois.", "C'est un livre."]
                answer: "Il est dans la cuisine."
                hints: ["Où wants a place."]
              - id: l2-s2
                type: audio_choice
                text: "Count the fish. Which answer fits the question?"
                say: { en: "Count the fish. Listen to the question. Which answer fits?" }
                show: { object: fish, count: 3, layout: row }
                audio: { fr: "Combien de poissons ?" }
                options: ["Il y a trois poissons.", "Il y a deux poissons.", "C'est un poisson."]
                answer: "Il y a trois poissons."
                hints: ["Count them, then find trois."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the answer: There are five apples." }
                options: ["pommes.", "Il y a", "cinq"]
                slot_count: 3
                answer: ["Il y a", "cinq", "pommes."]
                hints: ["Start with il y a, then the number."]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Which question goes with this answer?\n“Il est dans la maison.”"
                options: ["Où est le chat ?", "Combien de chats ?", "Tu as un chat ?"]
                answer: "Où est le chat ?"
                hints: ["Dans la maison is a place."]
              - id: l2-s5
                type: speak
                say: { en: "Answer in French: There are two dogs.", fr: "Il y a deux chiens." }
                show: { object: dog, count: 2, layout: row }
                expected_text: "Il y a deux chiens."
                hints: ["Say it with me: Il y a deux chiens."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Where is Mum?"
                say: { en: "Listen. Where is Mum?" }
                audio: { fr: "Où est Maman ? Elle est dans le jardin." }
                options: [{ object: garden }, { object: kitchen }, { object: school }]
                answer: garden
              - id: l2-n2
                type: audio_choice
                text: "Count the ducks. Which answer fits the question?"
                say: { en: "Count the ducks. Listen to the question. Which answer fits?" }
                show: { object: duck, count: 5, layout: row }
                audio: { fr: "Combien de canards ?" }
                options: ["Il y a cinq canards.", "Il y a six canards.", "Il est dans le parc."]
                answer: "Il y a cinq canards."
              - id: l2-n3
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the question: Where is the rabbit?" }
                options: ["le lapin ?", "Où", "est"]
                slot_count: 3
                answer: ["Où", "est", "le lapin ?"]
              - id: l2-n4
                type: multiple_choice
                option_audio: false
                text: "Which question goes with this answer?\n“Il y a quatre livres.”"
                options: ["Combien de livres ?", "Où est le livre ?", "Qu'est-ce que c'est ?"]
                answer: "Combien de livres ?"
              - id: l2-n5
                type: speak
                say: { en: "Ask in French: How many cats?", fr: "Combien de chats ?" }
                show: { object: cat, count: 3, layout: row }
                expected_text: "Combien de chats ?"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "You have not got a rabbit."
            say: { en: "You have not got a rabbit. Listen to the question. Which answer fits?" }
            audio: { fr: "Tu as un lapin ?" }
            options: ["Non, je n'ai pas de lapin.", "Non, je n'ai pas un lapin.", "Oui, j'ai un lapin."]
            answer: "Non, je n'ai pas de lapin."
          - id: l2-c2
            type: audio_choice
            text: "Count the flowers. Which answer fits the question?"
            say: { en: "Count the flowers. Listen to the question. Which answer fits?" }
            show: { object: flower, count: 2, layout: row }
            audio: { fr: "Combien de fleurs ?" }
            options: ["Il y a deux fleurs.", "Elle est dans le jardin.", "C'est une fleur."]
            answer: "Il y a deux fleurs."
          - id: l2-c3
            type: multiple_choice
            option_audio: false
            text: "Which question goes with this answer?\n“Oui, j'ai un chien.”"
            options: ["Tu as un chien ?", "Où est le chien ?", "Combien de chiens ?"]
            answer: "Tu as un chien ?"
          - id: l2-c4
            type: audio_choice
            text: "Where is the cat?"
            say: { en: "Listen. Where is the cat?" }
            audio: { fr: "Où est le chat ? Il est dans la cuisine." }
            options: [{ object: kitchen }, { object: garden }, { object: park }]
            answer: kitchen
          - id: l2-c5
            type: audio_choice
            text: "Look at the picture. Which answer fits the question?"
            say: { en: "Look at the picture. Listen to the question. Which answer fits?" }
            show: { object: t-shirt, colour: pink }
            audio: { fr: "C'est de quelle couleur ?" }
            options: ["C'est rose.", "C'est un tee-shirt.", "C'est rouge."]
            answer: "C'est rose."
