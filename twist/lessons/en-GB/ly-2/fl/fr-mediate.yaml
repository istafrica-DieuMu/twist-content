# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-mediate
skill: fl.culture-strategies.mediate
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Für Opa auf Englisch sagen (Französisch)
  en: Telling Grandad in English
summary: >
  Mediation: telling someone in English what a short French sign or
  sentence means. The Smith family is on holiday in France and Grandad
  speaks no French. Lesson 1 explains signs (OUVERT, FERMÉ, POUSSEZ,
  TIREZ, TOILETTES, ENTRÉE, SORTIE, CHIENS INTERDITS) by saying what they
  mean rather than word for word. Lesson 2 passes on short spoken and
  written sentences (a waiter, a bus driver, a card from a French friend),
  turning je into the person who said it, and ends with the skill check.
  The French is read or heard; the answers are in English.
metadata:
  year: ly-2
  topic: { de: Sprachmittlung, en: Mediation }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.sentences]
  also_practises: [fl.reading.sentences, fl.listening.short-dialogues]
  vocabulary: { fr: [ouvert, fermé, poussez, tirez, toilettes, entrée, sortie, chiens interdits, "l'arrêt de bus", "Vous voulez ... ?", "Désolé", "j'ai ..."] }
  forms: [text, audio, drawn, picture]
  drawn: [word-card]
  facets: []
  misconceptions:
    - id: word-for-word
      what: Translates a sign word for word or by its look, so it sounds odd or wrong in English (ENTRÉE as the entree, SORTIE as sorry, CHIENS INTERDITS as dogs interdicted)
      addressed: lesson 1 Learn shows SORTIE as This is the way out; l1-f5 gives feedback on the entree, l1-s5, l1-n1 and l1-c3 offer the word-for-word version, and l2-f5 and l2-c5 ask what matters when passing something on
    - id: keeps-je
      what: Keeps I or my when passing on what someone else wrote (I have got a cat, for Léa's cat)
      addressed: lesson 2 Learn turns J'ai un nouveau chien into Léa has got a new dog; l2-f2 and l2-f4 give feedback on the I version, and l2-s2, l2-s4, l2-n2, l2-n5 and l2-c2 ask again
    - id: poussez-tirez
      what: Mixes up poussez (push) and tirez (pull) on doors
      addressed: lesson 1 Learn sets the two side by side; l1-f4 gives feedback on push, and l1-s1, l1-c2 and l2-c4 ask for one or the other
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Schilder erklären", en: "Explaining signs" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Read the sentence. Which picture matches?"
            show: { drawn: word-card, text: "Le chat est dans le jardin." }
            options: [{ object: cat }, { object: dog }, { object: rabbit }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Read the sentence. What does it mean?"
            show: { drawn: word-card, text: "J'aime les pommes." }
            options: ["I like apples.", "I have got apples.", "I am an apple."]
            answer: "I like apples."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The Smith family is on holiday in France."
            say: { en: "The Smith family is on holiday in France. Grandad speaks no French, so you help him. You tell him in English what a sign says." }
            show: { object: car }
          - text: "Grandad asks: What does it say?"
            say: { en: "The sign says ouvert. You do not need to say each word. Say what it means: The shop is open.", fr: "Ouvert." }
            show: { drawn: word-card, text: "OUVERT" }
          - text: "SORTIE: This is the way out.\nENTRÉE: This is the way in."
            say: { en: "Sortie looks a bit like sorry, but it means exit. Tell Grandad: This is the way out. Entrée is the way in.", fr: "Sortie. Entrée." }
            show: { drawn: word-card, text: "SORTIE" }
          - text: "POUSSEZ = push\nTIREZ = pull"
            say: { en: "On doors you see poussez, push, or tirez, pull. Fermé means closed. Toilettes are the toilets, and chiens interdits means no dogs.", fr: "Poussez. Tirez." }
            show: { drawn: word-card, text: "POUSSEZ  TIREZ" }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Grandad asks: What does it say?"
                show: { drawn: word-card, text: "FERMÉ" }
                options: ["The shop is closed.", "The shop is open.", "The shop is far away."]
                answer: "The shop is closed."
                hints:
                  - "Fermé is the opposite of ouvert."
                  - "Ouvert is open."
                  - "Fermé means closed."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Your little brother needs the loo. What do you tell him?"
                show: { drawn: word-card, text: "TOILETTES" }
                options: ["The toilets are there.", "There are no toilets.", "This is the way out."]
                answer: "The toilets are there."
                hints:
                  - "The word looks like an English one."
                  - "Toilettes looks like toilets."
                  - "The toilets are there."
              - id: l1-f3
                type: multiple_choice
                text: "Grandad has his dog Rex with him. What do you tell him?"
                show: { drawn: word-card, text: "CHIENS INTERDITS" }
                options: ["Dogs are not allowed in.", "Dogs are welcome.", "Dogs for sale."]
                answer: "Dogs are not allowed in."
                hints:
                  - "Chiens are dogs."
                  - "Interdits means not allowed."
                  - "Dogs are not allowed in."
              - id: l1-f4
                type: multiple_choice
                text: "Grandad wants to open the door. What do you tell him?"
                show: { drawn: word-card, text: "TIREZ" }
                options: ["You have to pull.", "You have to push.", "The door is closed."]
                answer: "You have to pull."
                feedback:
                  "You have to push.": "Push is poussez. Tirez means pull."
                hints:
                  - "Is it poussez or tirez?"
                  - "Tirez is the other one, not push."
                  - "Tirez means pull."
              - id: l1-f5
                type: multiple_choice
                text: "How do you tell Grandad best?"
                show: { drawn: word-card, text: "ENTRÉE" }
                options: ["This is the way in.", "The entree.", "This is the way out."]
                answer: "This is the way in."
                feedback:
                  "The entree.": "Grandad will not know what that means. On a door, entrée is the way in."
                hints:
                  - "Say what the sign means, not how it looks."
                  - "Entrée is the opposite of sortie."
                  - "This is the way in."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Grandad asks: What do I have to do?"
                show: { drawn: word-card, text: "POUSSEZ" }
                options: ["Push.", "Pull.", "Wait."]
                answer: "Push."
                hints: ["Poussez and push both start with p."]
              - id: l1-s2
                type: matching
                option_audio: false
                text: "What do the signs mean?"
                pairs:
                  - { left: { text: "SORTIE" }, right: { text: "way out" } }
                  - { left: { text: "OUVERT" }, right: { text: "open" } }
                  - { left: { text: "ARRÊT DE BUS" }, right: { text: "bus stop" } }
                hints: ["Arrêt means stop."]
              - id: l1-s3
                type: multiple_choice
                text: "Your sister wants an ice cream. What do you tell her?"
                show: { drawn: word-card, text: "GLACE 2 €" }
                options: ["An ice cream costs two euros.", "Two ice creams are free.", "The ice is cold."]
                answer: "An ice cream costs two euros."
                hints: ["Une glace is an ice cream. In France the € sign comes after the number: 2 € is two euros."]
              - id: l1-s4
                type: true_false
                text: "The sign says OUVERT. Grandad says: The shop is closed. Is he right?"
                show: { drawn: word-card, text: "OUVERT" }
                answer: false
                hints: ["Ouvert means open."]
              - id: l1-s5
                type: multiple_choice
                text: "Grandad asks: What does it say?"
                show: { drawn: word-card, text: "ARRÊT DE BUS" }
                options: ["The bus stops here.", "Stop the bus now!", "The bus is broken."]
                answer: "The bus stops here."
                hints: ["It is a sign at the side of the road, not an order."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How do you tell Grandad best?"
                show: { drawn: word-card, text: "SORTIE" }
                options: ["This is the way out.", "It says sorry.", "This is the way in."]
                answer: "This is the way out."
              - id: l1-n2
                type: multiple_choice
                text: "The sign says “Baignade interdite”. Your brother wants to swim. What do you tell him?"
                show: { object: swim, crossed: true }
                options: ["Swimming is not allowed here.", "You can swim here.", "The pool is open."]
                answer: "Swimming is not allowed here."
              - id: l1-n3
                type: multiple_choice
                text: "Grandad pushes and pushes. What do you tell him?"
                show: { drawn: word-card, text: "TIREZ" }
                options: ["You have to pull it.", "Push harder.", "It is the toilets."]
                answer: "You have to pull it."
              - id: l1-n4
                type: multiple_choice
                text: "Grandad asks: Can we go in?"
                show: { drawn: word-card, text: "OUVERT" }
                options: ["Yes, it is open.", "No, it is closed.", "Only dogs can go in."]
                answer: "Yes, it is open."
              - id: l1-n5
                type: true_false
                text: "The sign says TOILETTES. Your brother says: That is the way out. Is he right?"
                show: { drawn: word-card, text: "TOILETTES" }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Grandad asks: What does it say?"
            show: { drawn: word-card, text: "FERMÉ" }
            options: ["It is closed.", "It is open.", "Push."]
            answer: "It is closed."
          - id: l1-c2
            type: multiple_choice
            text: "Grandad wants to go in. What do you tell him?"
            show: { drawn: word-card, text: "POUSSEZ" }
            options: ["You have to push.", "You have to pull.", "Dogs are not allowed."]
            answer: "You have to push."
          - id: l1-c3
            type: multiple_choice
            text: "How do you tell Grandad best?"
            show: { drawn: word-card, text: "CHIENS INTERDITS" }
            options: ["Dogs are not allowed here.", "Dogs interdicted.", "Chips are here."]
            answer: "Dogs are not allowed here."

  - n: 2
    title: { de: "Sätze weitersagen", en: "Passing on what people say" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Grandad asks: What does it say?"
            show: { drawn: word-card, text: "SORTIE" }
            options: ["This is the way out.", "This is the way in.", "The shop is closed."]
            answer: "This is the way out."
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Grandad wants to open the door. What do you tell him?"
            show: { drawn: word-card, text: "POUSSEZ" }
            options: ["Push.", "Pull.", "It is open."]
            answer: "Push."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Bonjour ! Vous voulez une glace ?"
            say: { en: "In the café the waiter asks something. Grandad looks at you. You tell him: He asks if we want an ice cream.", fr: "Bonjour ! Vous voulez une glace ?" }
            show: { object: ice-cream }
          - text: "J'ai un nouveau chien. Léa"
            say: { en: "A card from your French friend Léa. She writes j'ai, I have. When you tell Mum, say Léa, not I: Léa has got a new dog." }
            show: { drawn: word-card, text: "J'ai un nouveau chien. Léa" }
          - text: "Say what it means, in your own words."
            say: { en: "You do not have to say every word. Say what matters, in your own words, so the other person understands." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { en: "Listen to the waiter. Grandad asks: What did he say?" }
                audio: { fr: "Bonjour ! Vous voulez une glace ?", speaker: male }
                options: ["He asks if we want an ice cream.", "He says the ice cream is cold.", "He has got no ice cream."]
                answer: "He asks if we want an ice cream."
                hints:
                  - "Is it a question?"
                  - "Vous voulez ...? means do you want ...?"
                  - "He asks if we want an ice cream."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Mum asks: What does Léa write?"
                show: { drawn: word-card, text: "J'ai un chat. Il s'appelle Minou. Léa" }
                options: ["Léa has got a cat called Minou.", "I have got a cat called Minou.", "Minou has got a cat."]
                answer: "Léa has got a cat called Minou."
                feedback:
                  "I have got a cat called Minou.": "Léa wrote j'ai. When you pass it on, say Léa: Léa has got a cat."
                hints:
                  - "Who has got the cat?"
                  - "Léa wrote it, so j'ai means Léa has got."
                  - "Léa has got a cat called Minou."
              - id: l2-f3
                type: audio_choice
                say: { en: "Listen to the bus driver. Grandad asks: What did he say?" }
                audio: { fr: "La gare ? C'est le bus numéro cinq.", speaker: male }
                options: ["The bus to the station is number 5.", "The station is closed.", "There are five buses."]
                answer: "The bus to the station is number 5."
                hints:
                  - "La gare is the station."
                  - "Numéro cinq is number five."
                  - "The bus to the station is number 5."
              - id: l2-f4
                type: multiple_choice
                text: "Mum asks: What does Tom write?"
                show: { drawn: word-card, text: "J'ai froid et je suis fatigué. Tom" }
                options: ["Tom is cold and tired.", "I am cold and tired.", "Tom is hot and happy."]
                answer: "Tom is cold and tired."
                feedback:
                  "I am cold and tired.": "You are not cold! Tom wrote it, so say Tom is cold and tired."
                hints:
                  - "Who wrote the card?"
                  - "Tom wrote je, so say Tom."
                  - "Tom is cold and tired."
              - id: l2-f5
                type: multiple_choice
                text: "What matters most when you tell Grandad what a sign or sentence says?"
                options: ["Saying what it means.", "Saying every word in the same order.", "Saying it in French."]
                answer: "Saying what it means."
                hints:
                  - "Grandad speaks no French."
                  - "He needs to understand it."
                  - "Say what it means."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { en: "Listen to the shopkeeper. What do you tell Grandad?" }
                audio: { fr: "Désolé, le magasin est fermé.", speaker: male }
                options: ["Sorry, the shop is closed.", "The shop is open.", "The shop is small."]
                answer: "Sorry, the shop is closed."
                hints: ["Fermé means closed."]
              - id: l2-s2
                type: multiple_choice
                text: "Mum asks: What does Inès write?"
                show: { drawn: word-card, text: "Mon anniversaire, c'est le dix mai. Inès" }
                options: ["Inès's birthday is on 10 May.", "My birthday is on 10 May.", "Inès is ten."]
                answer: "Inès's birthday is on 10 May."
                hints: ["Mon means my, so whose birthday is it?"]
              - id: l2-s3
                type: audio_choice
                say: { en: "Listen to the waiter. Grandad asks: What did he say?" }
                audio: { fr: "Vous voulez de l'eau ou du jus d'orange ?", speaker: male }
                options: ["He asks if we want water or orange juice.", "He says there is no water.", "He wants an orange juice."]
                answer: "He asks if we want water or orange juice."
                hints: ["Vous voulez ...? is a question."]
              - id: l2-s4
                type: true_false
                text: "Max writes: J'ai un chien. You tell Mum: Max has got a dog. Is that right?"
                answer: true
                hints: ["Max wrote j'ai."]
              - id: l2-s5
                type: multiple_choice
                text: "Your sister wants to swim. What do you tell her?"
                show: { drawn: word-card, text: "PISCINE FERMÉE" }
                options: ["The swimming pool is closed.", "The swimming pool is open.", "The fish are closed."]
                answer: "The swimming pool is closed."
                hints: ["La piscine is the swimming pool."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { en: "Listen to the waiter. Grandad asks: What did he say?" }
                audio: { fr: "Vous voulez un gâteau ?", speaker: male }
                options: ["He asks if we want some cake.", "He has got a cake.", "He likes cake."]
                answer: "He asks if we want some cake."
              - id: l2-n2
                type: multiple_choice
                text: "Mum asks: What does Paul write?"
                show: { drawn: word-card, text: "J'aime le foot. Je joue samedi. Paul" }
                options: ["Paul likes football. He plays on Saturday.", "I like football. I play on Saturday.", "Paul doesn't like football."]
                answer: "Paul likes football. He plays on Saturday."
              - id: l2-n3
                type: audio_choice
                say: { en: "Grandad asks a man where the toilets are. Listen. What do you tell Grandad?" }
                audio: { fr: "Les toilettes ? Désolé, c'est fermé.", speaker: male }
                options: ["Sorry, the toilets are closed.", "The toilets are open.", "There are no toilets in France."]
                answer: "Sorry, the toilets are closed."
              - id: l2-n4
                type: multiple_choice
                text: "Your brother asks how much an ice cream is."
                show: { drawn: word-card, text: "GLACE 3 €" }
                options: ["Three euros.", "Three pounds.", "Thirteen euros."]
                answer: "Three euros."
              - id: l2-n5
                type: true_false
                text: "Léa writes: Je suis contente ! You tell Mum: I am happy! Is that right?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Grandad looks for the way out. Which sign does he need?"
            options: ["SORTIE", "ENTRÉE", "TOILETTES"]
            answer: "SORTIE"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Mum asks: What does Léo write?"
            show: { drawn: word-card, text: "J'ai un nouveau vélo. Léo" }
            options: ["Léo has got a new bike.", "I have got a new bike.", "Léo wants a bike."]
            answer: "Léo has got a new bike."
          - id: l2-c3
            type: audio_choice
            say: { en: "Listen to the waiter. Grandad asks: What did he say?" }
            audio: { fr: "Désolé, il n'y a pas de pizza. Vous voulez une glace ?", speaker: male }
            options: ["There is no pizza. He asks if we want an ice cream.", "The pizza is ready.", "There is no ice cream."]
            answer: "There is no pizza. He asks if we want an ice cream."
          - id: l2-c4
            type: multiple_choice
            text: "Mum asks: What does the door say?"
            show: { drawn: word-card, text: "TIREZ" }
            options: ["Pull.", "Push.", "Closed."]
            answer: "Pull."
          - id: l2-c5
            type: multiple_choice
            text: "How should you pass on a French message?"
            options: ["Say what it means, in your own words.", "Say every word in the same order.", "Say only the first word."]
            answer: "Say what it means, in your own words."
