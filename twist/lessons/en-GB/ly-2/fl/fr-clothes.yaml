# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-clothes
skill: fl.themes.clothes
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Kleidung (Französisch)
  en: Clothes in French
summary: >
  Clothes words, clothes with a colour, and saying what someone is
  wearing. Lesson 1 brings un pull, une veste, une robe, une jupe, un
  tee-shirt, un pantalon, une chaussure, une chaussette, des bottes and un
  bonnet; lesson 2 puts the colour after the word, with an extra e for
  une words (un pull vert, une robe verte), says je porte, il porte and
  elle porte, and ends with the skill check. Instructions are in English;
  the French is heard and shown in short form.
metadata:
  year: ly-2
  topic: { de: Kleidung, en: Clothes }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.colours]
  also_practises: [fl.themes.colours, fl.grammar.plurals-articles]
  vocabulary: { fr: [un pull, une veste, une robe, une jupe, un tee-shirt, un pantalon, une chaussure, une chaussette, des bottes, un bonnet, je porte, il porte, elle porte] }
  forms: [audio, picture, text, drawn]
  drawn: [colour-swatch]
  facets: []
  misconceptions:
    - id: veste-vest
      what: Takes une veste for a vest, and mixes it up with un pull, another top with long sleeves
      addressed: lesson 1 Learn says une veste is a jacket, not a vest; une veste and un pull share an option set in every stage of lesson 1, with feedback in l1-f1, and l2-f1 gives feedback on the green jacket for un pull vert
    - id: colour-first
      what: Puts the colour before the word, as in English (un rouge pull)
      addressed: lesson 2 Learn says the colour comes after; an ordering task in every stage of lesson 2
    - id: no-agreement
      what: Leaves the colour unchanged after a une word (une robe vert)
      addressed: lesson 2 Learn sets vert against verte; l2-f3 and l2-n3 choose verte and l2-c3 bleue for a une word, and l2-s3 keeps bleu for an un word
    - id: plural-trousers
      what: Says des pantalons for one pair of trousers, because trousers is plural in English
      addressed: lesson 1 Learn says un pantalon is one; l1-s4 and l2-c4 offer des pantalons
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was ziehst du an?", en: "What do you wear?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tap the colour you hear."
            say: { en: "Listen. Tap the colour." }
            audio: { fr: "rouge" }
            options: [{ drawn: colour-swatch, colour: red }, { drawn: colour-swatch, colour: blue }, { drawn: colour-swatch, colour: green }]
            answer: red
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tap the colour you hear."
            say: { en: "Listen. Tap the colour." }
            audio: { fr: "vert" }
            options: [{ drawn: colour-swatch, colour: yellow }, { drawn: colour-swatch, colour: green }, { drawn: colour-swatch, colour: black }]
            answer: green
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "un pull, une veste"
            say: { en: "Un pull is a jumper. Une veste is a jacket, with a zip and a hood. Careful: une veste is not a vest!", fr: "un pull, une veste" }
            show: { object: jumper }
          - text: "une robe, une jupe"
            say: { en: "Une robe is a dress. Une jupe is a skirt.", fr: "une robe, une jupe" }
            show: { object: dress }
          - text: "un tee-shirt, un pantalon"
            say: { en: "Un tee-shirt, and un pantalon, trousers. In English trousers are plural, but in French it is just one: un pantalon.", fr: "un tee-shirt, un pantalon" }
            show: { object: trousers }
          - text: "une chaussure, une chaussette,\ndes bottes, un bonnet"
            say: { en: "Une chaussure is a shoe, une chaussette is a sock. Des bottes are boots, like your wellies, and un bonnet is a woolly hat.", fr: "une chaussure, une chaussette, des bottes, un bonnet" }
            show: { object: shoe }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "une veste" }
                options: [{ object: jacket }, { object: jumper }, { object: t-shirt }]
                answer: jacket
                feedback:
                  jumper: "That is un pull. Une veste is a jacket, with a zip."
                hints:
                  - "Listen again: une veste. It is not a vest."
                  - "It has a zip and a hood."
                  - "Tap the jacket."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "un pantalon" }
                options: [{ object: trousers }, { object: skirt }, { object: sock }]
                answer: trousers
                hints:
                  - "Listen again: un pantalon."
                  - "You wear it on both legs."
                  - "Tap the trousers."
              - id: l1-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "une jupe" }
                show: { object: skirt }
                answer: true
                hints:
                  - "Listen again: une jupe."
                  - "Une jupe is a skirt."
                  - "Yes, it is a skirt."
              - id: l1-f4
                type: matching
                option_audio: false
                text: "Match each word with its picture."
                say: { en: "Read each word. Tap it, then its picture." }
                pairs:
                  - left: { text: "un bonnet" }
                    right: { object: woolly-hat }
                  - left: { text: "une chaussette" }
                    right: { object: sock }
                  - left: { text: "une robe" }
                    right: { object: dress }
                hints:
                  - "Start with the one you are sure of."
                  - "Une chaussette is the small thing you wear inside a shoe."
                  - "Un bonnet: woolly hat. Une chaussette: sock. Une robe: dress."
              - id: l1-f5
                type: speak
                say: { en: "Say it in French.", fr: "un pull" }
                show: { object: jumper }
                expected_text: "un pull"
                hints:
                  - "Listen again: un pull."
                  - "Pull has the French u sound, as in tu."
                  - "Say it with me: un pull."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "un pull" }
                options: [{ object: jumper }, { object: jacket }, { object: dress }]
                answer: jumper
                hints: ["Un pull has no zip."]
              - id: l1-s2
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "une chaussette" }
                options: [{ object: sock }, { object: shoe }, { object: woolly-hat }]
                answer: sock
                hints: ["Chaussure and chaussette start the same. Listen to the end: ette."]
              - id: l1-s3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "un tee-shirt" }
                show: { object: jumper }
                answer: false
                hints: ["Un tee-shirt is a T-shirt, with short sleeves."]
              - id: l1-s4
                type: multiple_choice
                option_audio: false
                text: "Which is right for one pair of trousers?"
                show: { object: trousers }
                options: ["un pantalon", "des pantalons", "une pantalon"]
                answer: "un pantalon"
                hints: ["In French, trousers are just one thing."]
              - id: l1-s5
                type: speak
                say: { en: "Say it in French.", fr: "une robe" }
                show: { object: dress }
                expected_text: "une robe"
                hints: ["Say it with me: une robe."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "une robe" }
                options: [{ object: dress }, { object: skirt }, { object: t-shirt }]
                answer: dress
              - id: l1-n2
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "un bonnet" }
                options: [{ object: woolly-hat }, { object: hat }, { object: shoe }]
                answer: woolly-hat
              - id: l1-n3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "une chaussure" }
                show: { object: shoe }
                answer: true
              - id: l1-n4
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "une jupe" }
                options: [{ object: skirt }, { object: dress }, { object: trousers }]
                answer: skirt
              - id: l1-n5
                type: speak
                say: { en: "Say it in French.", fr: "une veste" }
                show: { object: jacket }
                expected_text: "une veste"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "un tee-shirt" }
            options: [{ object: t-shirt }, { object: jumper }, { object: jacket }]
            answer: t-shirt
          - id: l1-c2
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "une chaussure" }
            options: [{ object: shoe }, { object: sock }, { object: wellies }]
            answer: shoe
          - id: l1-c3
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "un pantalon" }
            show: { object: skirt }
            answer: false

  - n: 2
    title: { de: "Ein grüner Pullover: Farben und Kleidung", en: "Un pull vert: colours and clothes" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "un pantalon" }
            options: [{ object: trousers }, { object: skirt }, { object: dress }]
            answer: trousers
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "une veste" }
            options: [{ object: jumper }, { object: jacket }, { object: t-shirt }]
            answer: jacket
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "un pull rouge"
            say: { en: "In French the colour comes after the clothes: un pull rouge, a red jumper.", fr: "un pull rouge" }
            show: { object: jumper, colour: red }
          - text: "un pull vert, une robe verte"
            say: { en: "After a une word, the colour gets an extra e: une robe verte. Sometimes you hear it, vert and verte. Sometimes you do not, bleu and bleue. Colours that already end in e stay the same: une robe rouge, une robe jaune.", fr: "un pull vert, une robe verte" }
            show: { object: dress, colour: green }
          - text: "Je porte une veste bleue."
            say: { en: "Je porte means I'm wearing. Il porte, he's wearing. Elle porte, she's wearing.", fr: "Je porte une veste bleue." }
            show: { object: jacket, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "un pull vert" }
                options:
                  - { object: jumper, colour: green, key: jumper-green }
                  - { object: jacket, colour: green, key: jacket-green }
                  - { object: jumper, colour: red, key: jumper-red }
                answer: jumper-green
                feedback:
                  jacket-green: "Vert is right, but un pull is a jumper. Une veste is a jacket."
                hints:
                  - "Listen for two things: what it is and its colour."
                  - "Un pull is a jumper; vert is green."
                  - "The green jumper."
                difficulty: easy
              - id: l2-f2
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build it in French: a red skirt." }
                options: ["rouge", "une jupe"]
                slot_count: 2
                answer: ["une jupe", "rouge"]
                hints:
                  - "Which comes first in French, the colour or the clothes?"
                  - "In French the colour comes after."
                  - "une jupe rouge"
              - id: l2-f3
                type: multiple_choice
                option_audio: false
                text: "une robe _"
                say: { en: "A green dress. Which word fits?" }
                show: { object: dress, colour: green }
                options: ["verte", "vert", "verts"]
                answer: "verte"
                hints:
                  - "Is robe an un word or a une word?"
                  - "After a une word, the colour gets an extra e."
                  - "une robe verte"
              - id: l2-f4
                type: audio_choice
                text: "What colour is Léa's skirt?"
                say: { en: "Listen. What colour is Léa's skirt?" }
                audio: { fr: "Aujourd'hui, Léa porte une jupe jaune et un tee-shirt bleu." }
                options:
                  - { object: skirt, colour: yellow, key: skirt-yellow }
                  - { object: skirt, colour: blue, key: skirt-blue }
                  - { object: skirt, colour: red, key: skirt-red }
                answer: skirt-yellow
                hints:
                  - "Listen for jupe, then the colour after it."
                  - "Une jupe jaune. Bleu goes with the tee-shirt."
                  - "Jaune is yellow."
              - id: l2-f5
                type: speak
                say: { en: "Say in French: I'm wearing a blue jumper.", fr: "Je porte un pull bleu." }
                show: { object: jumper, colour: blue }
                expected_text: "Je porte un pull bleu."
                hints:
                  - "Start with je porte."
                  - "Then the jumper, then the colour."
                  - "Say it with me: Je porte un pull bleu."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "une veste rouge" }
                options:
                  - { object: jacket, colour: red, key: jacket-red }
                  - { object: jumper, colour: red, key: jumper-red }
                  - { object: jacket, colour: blue, key: jacket-blue }
                answer: jacket-red
                hints: ["Une veste is the jacket."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build it in French: a green jacket." }
                options: ["verte", "une veste"]
                slot_count: 2
                answer: ["une veste", "verte"]
                hints: ["The colour comes after."]
              - id: l2-s3
                type: multiple_choice
                option_audio: false
                text: "un pull _"
                say: { en: "A blue jumper. Which word fits?" }
                show: { object: jumper, colour: blue }
                options: ["bleu", "bleue", "bleus"]
                answer: "bleu"
                hints: ["Pull is an un word, so no extra e."]
              - id: l2-s4
                type: audio_choice
                text: "What colour is Tom's jumper?"
                say: { en: "Listen. What colour is Tom's jumper?" }
                audio: { fr: "Tom porte un pantalon noir et un pull vert." }
                options:
                  - { object: jumper, colour: green, key: jumper-green }
                  - { object: jumper, colour: blue, key: jumper-blue }
                  - { object: jumper, colour: red, key: jumper-red }
                answer: jumper-green
                hints: ["Noir goes with the trousers. Listen for pull."]
              - id: l2-s5
                type: speak
                say: { en: "Say in French: She is wearing a red dress.", fr: "Elle porte une robe rouge." }
                show: { object: dress, colour: red }
                expected_text: "Elle porte une robe rouge."
                hints: ["Say it with me: Elle porte une robe rouge."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "une robe bleue" }
                options:
                  - { object: dress, colour: blue, key: dress-blue }
                  - { object: skirt, colour: blue, key: skirt-blue }
                  - { object: dress, colour: green, key: dress-green }
                answer: dress-blue
              - id: l2-n2
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I'm wearing a yellow T-shirt." }
                options: ["un tee-shirt", "porte", "jaune", "Je"]
                slot_count: 4
                answer: ["Je", "porte", "un tee-shirt", "jaune"]
              - id: l2-n3
                type: multiple_choice
                option_audio: false
                text: "une jupe _"
                say: { en: "A green skirt. Which word fits?" }
                show: { object: skirt, colour: green }
                options: ["verte", "vert", "vertes"]
                answer: "verte"
              - id: l2-n4
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "un pull rouge" }
                show: { object: jacket, colour: red }
                answer: false
              - id: l2-n5
                type: audio_choice
                text: "What colour is Chloé's T-shirt?"
                say: { en: "Listen. What colour is Chloé's T-shirt?" }
                audio: { fr: "Chloé porte une jupe verte et un tee-shirt rose." }
                options:
                  - { object: t-shirt, colour: pink, key: t-shirt-pink }
                  - { object: t-shirt, colour: purple, key: t-shirt-purple }
                  - { object: t-shirt, colour: blue, key: t-shirt-blue }
                answer: t-shirt-pink

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "des bottes" }
            options: [{ object: wellies }, { object: shoe }, { object: sock }]
            answer: wellies
          - id: l2-c2
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "une jupe rouge" }
            options:
              - { object: skirt, colour: red, key: skirt-red }
              - { object: dress, colour: red, key: dress-red }
              - { object: skirt, colour: yellow, key: skirt-yellow }
            answer: skirt-red
          - id: l2-c3
            type: multiple_choice
            option_audio: false
            text: "une veste _"
            say: { en: "A blue jacket. Which word fits?" }
            show: { object: jacket, colour: blue }
            options: ["bleue", "bleu", "bleus"]
            answer: "bleue"
          - id: l2-c4
            type: multiple_choice
            option_audio: false
            text: "You are wearing one pair of trousers. Which sentence is right?"
            options: ["Je porte un pantalon.", "Je porte des pantalons.", "Je porte une pantalon."]
            answer: "Je porte un pantalon."
          - id: l2-c5
            type: audio_choice
            text: "What colour is Sam's jumper?"
            say: { en: "Listen. What colour is Sam's jumper?" }
            audio: { fr: "Sam porte une veste verte et un pull jaune." }
            options:
              - { object: jumper, colour: yellow, key: jumper-yellow }
              - { object: jumper, colour: green, key: jumper-green }
              - { object: jumper, colour: red, key: jumper-red }
            answer: jumper-yellow
