# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-where-spoken
skill: fl.culture-strategies.where-spoken
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Wo man Französisch spricht
  en: Where French is spoken
summary: >
  Where French is spoken and a few things from France. Lesson 1 names the
  countries: France, then Belgium, Switzerland, Luxembourg, Canada
  (Quebec) and countries in Africa such as Senegal and Côte d'Ivoire, and
  the child hears children say where they live (J'habite à Montréal, au
  Canada). Lesson 2 visits Paris and brings a few places and things from
  France (the Eiffel Tower, the baguette, cheese, the euro, driving on the
  right, the fast TGV train, Bastille Day on 14 July), and ends with the
  skill check. Questions and answers are in English; the French is spoken.
  Lesson 1 has no warm-up, because the skill builds on no earlier one.
metadata:
  year: ly-2
  topic: { de: Die Welt der Sprache, en: Where the language is spoken }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.listening.short-dialogues]
  vocabulary: { fr: ["J'habite à ...", "J'habite en France.", la France, la Belgique, la Suisse, le Canada, le Sénégal, Paris, la tour Eiffel, la baguette, le fromage, "l'euro", le train] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: countries, what: { de: "wissen, in welchen Ländern man Französisch spricht", en: knowing which countries speak French } }
    - { id: from, what: { de: "verstehen, wo ein Kind wohnt (J'habite à ...)", en: "understanding where a child lives (J'habite à ...)" } }
    - { id: france, what: { de: Orte und Dinge aus Frankreich kennen, en: knowing places and things from France } }
  misconceptions:
    - id: france-only
      what: Thinks French is spoken only in France
      addressed: lesson 1 Learn lists the other countries; every stage of lesson 1 has a child from Belgium, Switzerland, Canada or Senegal, and the sorting tasks put countries far from France into the French bin
    - id: language-per-country
      what: Thinks every country has its own language named after it (Belgian, Swiss, Canadian)
      addressed: lesson 1 Learn says the people in all these countries speak French; l1-f4 gives feedback on Belgian, and l1-s6, l1-n3 and l2-c2 ask about Swiss and Canadian
    - id: pounds-everywhere
      what: Expects to pay with pounds in France, and to drive on the left
      addressed: lesson 2 Learn names the euro and driving on the right; l2-f3 gives feedback on pounds, l2-f4 on the left, and l2-s3, l2-n4 and l2-c4 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wo spricht man Französisch?", en: "Where do people speak French?" }
    goal:
      de: "Find heraus, in welchen Ländern man Französisch spricht, und hör, wo Kinder wohnen, so wie j'habite à Paris."
      en: "Find out which countries speak French and hear where children live, like j'habite à Paris."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "Where do people speak French?"
            say: { en: "Guess: do people speak French only in France, or in other countries too?" }
          - text: "France\nBonjour ! J'habite à Paris, en France."
            say: { en: "In other countries too, as you will see! But French comes from France. Its capital is Paris.", fr: "Bonjour ! J'habite à Paris, en France." }
          - text: "Belgium, Switzerland, Luxembourg\nJ'habite à Bruxelles, en Belgique."
            say: { en: "Next door to France, people speak French too: in Belgium, in Switzerland and in Luxembourg. Belgium and Switzerland have other languages as well.", fr: "J'habite à Bruxelles, en Belgique." }
          - text: "Canada, Senegal, Côte d'Ivoire\nJ'habite à Montréal, au Canada."
            say: { en: "Far away, people speak French in Canada, mostly in Quebec, and in many countries in Africa, such as Senegal and Côte d'Ivoire. There is no Belgian or Canadian language: all these people speak French.", fr: "J'habite à Montréal, au Canada." }
          - text: "J'habite à ...\nSalut ! Je m'appelle Awa. J'habite à Dakar, au Sénégal."
            say: { en: "J'habite à means I live in. Listen for the town or the country.", fr: "Salut ! Je m'appelle Awa. J'habite à Dakar, au Sénégal." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which country does French come from?"
                options: ["France", "Canada", "Belgium"]
                answer: "France"
                hints:
                  - "Its name sounds like French."
                  - "Its capital is Paris."
                  - "French comes from France."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Where does Lucas live?"
                say: { en: "Listen. Where does Lucas live?" }
                audio: { fr: "Salut ! Je m'appelle Lucas. J'habite à Paris, en France.", speaker: male }
                options: ["in France", "in Canada", "in Belgium"]
                answer: "in France"
                hints:
                  - "Listen for the end: en ..."
                  - "Paris is the capital of France."
                  - "Lucas lives in France."
              - id: l1-f3
                type: true_false
                text: "People speak French in Switzerland."
                say: { en: "Read the sentence. Is it true?" }
                answer: true
                hints:
                  - "Switzerland is next door to France."
                  - "Many people there speak French."
                  - "Yes, it is true."
              - id: l1-f4
                type: multiple_choice
                text: "Emma lives in Belgium. She says: “Bonjour ! Ça va ?” Which language does she speak?"
                options: ["French", "Belgian", "English"]
                answer: "French"
                feedback:
                  "Belgian": "There is no Belgian language. In Belgium many people speak French."
                hints:
                  - "Belgium is next door to France."
                  - "There is no language called Belgian."
                  - "Emma speaks French."
              - id: l1-f5
                type: sorting
                option_audio: false
                text: "Where do people speak French?"
                say: { en: "Do people speak French there? Sort the countries." }
                bins:
                  - { id: french, show: { text: "French is spoken here." } }
                  - { id: other, show: { text: "French is not spoken here." } }
                options:
                  - { text: "France", bin: french }
                  - { text: "Belgium", bin: french }
                  - { text: "Senegal", bin: french }
                  - { text: "Norway", bin: other }
                  - { text: "Poland", bin: other }
                  - { text: "Germany", bin: other }
                hints:
                  - "Think of France, its neighbours and the countries far away."
                  - "Senegal is in Africa, and people speak French there."
                  - "France, Belgium and Senegal go in the French bin."
              - id: l1-f6
                type: audio_choice
                text: "Where does Moussa live?"
                say: { en: "Listen. Where does Moussa live?" }
                audio: { fr: "Bonjour ! Je m'appelle Moussa. J'habite à Abidjan, en Côte d'Ivoire.", speaker: male }
                options: ["in Côte d'Ivoire", "in France", "in Canada"]
                answer: "in Côte d'Ivoire"
                hints:
                  - "Listen for the end: en ..."
                  - "Côte d'Ivoire is a country in Africa."
                  - "Moussa lives in Côte d'Ivoire."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Where does Chloé live?"
                say: { en: "Listen. Where does Chloé live?" }
                audio: { fr: "Bonjour ! Je m'appelle Chloé. J'habite à Montréal, au Canada.", speaker: female }
                options: ["in Canada", "in France", "in Switzerland"]
                answer: "in Canada"
                hints: ["Listen for the end: au ..."]
              - id: l1-s2
                type: true_false
                text: "People speak French in Spain."
                say: { en: "Read the sentence. Is it true?" }
                answer: false
                hints: ["In Spain people speak Spanish."]
              - id: l1-s3
                type: multiple_choice
                text: "In which country do many people speak French?"
                options: ["Senegal", "Italy", "Poland"]
                answer: "Senegal"
                hints: ["One of these countries is in Africa."]
              - id: l1-s4
                type: audio_choice
                text: "Where does Noah live?"
                say: { en: "Listen. Where does Noah live?" }
                audio: { fr: "Salut ! Je m'appelle Noah. J'habite à Genève, en Suisse.", speaker: male }
                options: ["in Switzerland", "in Belgium", "in Senegal"]
                answer: "in Switzerland"
                hints: ["La Suisse is Switzerland."]
              - id: l1-s5
                type: multiple_choice
                text: "Where is Quebec?"
                options: ["in Canada", "in France", "in Africa"]
                answer: "in Canada"
                hints: ["Montréal is in Quebec."]
              - id: l1-s6
                type: true_false
                text: "People in Canada speak a language called Canadian."
                say: { en: "Read the sentence. Is it true?" }
                answer: false
                hints: ["There is no Canadian language. In Quebec people speak French."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Where does Awa live?"
                say: { en: "Listen. Where does Awa live?" }
                audio: { fr: "Bonjour ! Je m'appelle Awa. J'habite à Dakar, au Sénégal.", speaker: female }
                options: ["in Senegal", "in Canada", "in France"]
                answer: "in Senegal"
              - id: l1-n2
                type: true_false
                text: "People speak French in Canada."
                say: { en: "Read the sentence. Is it true?" }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Léo lives in Geneva, in Switzerland. Which language does he speak at school?"
                options: ["French", "Swiss", "Belgian"]
                answer: "French"
              - id: l1-n4
                type: sorting
                option_audio: false
                text: "Where do people speak French?"
                say: { en: "Do people speak French there? Sort the countries." }
                bins:
                  - { id: french, show: { text: "French is spoken here." } }
                  - { id: other, show: { text: "French is not spoken here." } }
                options:
                  - { text: "Switzerland", bin: french }
                  - { text: "Canada", bin: french }
                  - { text: "Luxembourg", bin: french }
                  - { text: "Spain", bin: other }
                  - { text: "Turkey", bin: other }
                  - { text: "Greece", bin: other }
              - id: l1-n5
                type: audio_choice
                text: "Where does Hugo live?"
                say: { en: "Listen. Where does Hugo live?" }
                audio: { fr: "Salut ! Je m'appelle Hugo. J'habite à Bruxelles, en Belgique.", speaker: male }
                options: ["in Belgium", "in France", "in Switzerland"]
                answer: "in Belgium"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Where does Inès live?"
            say: { en: "Listen. Where does Inès live?" }
            audio: { fr: "Bonjour ! Je m'appelle Inès. J'habite à Lyon, en France.", speaker: female }
            options: ["in France", "in Belgium", "in Canada"]
            answer: "in France"
          - id: l1-c2
            type: true_false
            text: "People speak French in Luxembourg."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Where do people speak French?"
            options: ["in Belgium", "in Poland", "in Greece"]
            answer: "in Belgium"
          - id: l1-c4
            type: audio_choice
            text: "Where does Léo live?"
            say: { en: "Listen. Where does Léo live?" }
            audio: { fr: "Bonjour ! Je m'appelle Léo. J'habite à Lausanne, en Suisse.", speaker: male }
            options: ["in France", "in Switzerland", "in Senegal"]
            answer: "in Switzerland"
          - id: l1-c5
            type: true_false
            text: "People in Belgium speak a language called Belgian."
            say: { en: "Read the sentence. Is it true?" }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Where is Senegal?"
            options: ["in Canada", "in Africa", "next to France"]
            answer: "in Africa"

  - n: 2
    title: { de: "Ein Besuch in Paris", en: "A visit to Paris" }
    goal:
      de: "Besuch Paris und lerne Dinge aus Frankreich kennen, zum Beispiel la baguette und den Eiffelturm."
      en: "Visit Paris and get to know things from France, like la baguette and the Eiffel Tower."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Where does Zoé live?"
            say: { en: "Listen. Where does Zoé live?" }
            audio: { fr: "Salut ! Je m'appelle Zoé. J'habite à Québec, au Canada.", speaker: female }
            options: ["in Canada", "in Senegal", "in Belgium"]
            answer: "in Canada"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "People speak French in Belgium."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "How tall is la tour Eiffel?"
            say: { en: "Guess: how tall is the Eiffel Tower in Paris? As tall as a house, as tall as a church, or more than three hundred metres?", fr: "La tour Eiffel." }
          - text: "Paris: la tour Eiffel"
            say: { en: "More than three hundred metres, much taller than a church! Paris is the capital of France. Its most famous tower is la tour Eiffel, the Eiffel Tower. It is made of iron and is over three hundred metres tall.", fr: "La tour Eiffel." }
          - text: "la baguette, le fromage\nUne baguette, s'il vous plaît."
            say: { en: "Many French families buy a long, thin loaf every day: la baguette. France is famous for its cheese, le fromage, too.", fr: "Une baguette, s'il vous plaît." }
            show: { objects: [bread, cheese] }
          - text: "Did you know? In 2022, baking baguettes was put on a UNESCO list of the world's living traditions."
            say: { en: "Did you know? In twenty twenty-two, the baguette got a special honour. UNESCO, a world group that looks after treasures and traditions, put the skill of baking baguettes on its list of the world's living traditions. Bakers are very proud of it!", fr: "La baguette." }
            show: { object: bread }
          - text: "l'euro, on roule à droite"
            say: { en: "In France you pay in euros, not pounds. And cars drive on the right, not on the left as in the UK.", fr: "L'euro." }
          - text: "le TGV, le 14 juillet"
            say: { en: "The TGV is a very fast train. It goes from Paris to Marseille in about three hours. On 14 July France has its national day, and many towns have fireworks.", fr: "Le TGV. Le quatorze juillet." }
            show: { object: train }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which city is the capital of France?"
                options: ["Paris", "Brussels", "Montréal"]
                answer: "Paris"
                hints:
                  - "The Eiffel Tower is there."
                  - "Brussels is in Belgium, Montréal in Canada."
                  - "Paris."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "What is a baguette?"
                option_audio: false
                options: [{ object: bread }, { object: cake }, { object: cheese }]
                answer: bread
                hints:
                  - "Many French families buy it at the baker's every day."
                  - "It is long and thin."
                  - "A baguette is a loaf of bread."
              - id: l2-f3
                type: multiple_choice
                text: "Tom is on holiday in France. He buys an ice cream. Which money does he pay with?"
                options: ["euros", "pounds", "francs"]
                answer: "euros"
                feedback:
                  "pounds": "Pounds are the money in the UK. In France you pay in euros."
                  "francs": "Francs were the money in France long ago, until 2002. Today France pays in euros."
                hints:
                  - "France does not use the same money as the UK."
                  - "France pays in euros, like many countries in Europe."
                  - "Euros."
              - id: l2-f4
                type: multiple_choice
                text: "On which side of the road do cars drive in France?"
                options: ["on the right", "on the left", "in the middle"]
                answer: "on the right"
                feedback:
                  "on the left": "That is the UK. In France, on roule à droite: on the right."
                  "in the middle": "In the middle? That would be a very scary drive! In France, cars drive on the right."
                hints:
                  - "It is not the same as in the UK."
                  - "In the UK cars drive on the left."
                  - "In France they drive on the right."
              - id: l2-f5
                type: audio_choice
                text: "What does Léa want to see in Paris?"
                say: { en: "Listen. What does Léa want to see in Paris?" }
                audio: { fr: "J'habite à Lyon. Demain, je vais à Paris. Je voudrais voir la tour Eiffel !", speaker: female }
                options: ["the Eiffel Tower", "a fast train", "a cheese shop"]
                answer: "the Eiffel Tower"
                hints:
                  - "Listen to the end."
                  - "Je voudrais voir means I would like to see."
                  - "La tour Eiffel."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "The TGV is a very fast train."
                say: { en: "Read the sentence. Is it true?" }
                answer: true
                hints: ["It goes from Paris to Marseille in about three hours."]
              - id: l2-s2
                type: multiple_choice
                text: "When is France's national day?"
                options: ["14 July", "25 December", "5 November"]
                answer: "14 July"
                hints: ["Many towns have fireworks on that summer day."]
              - id: l2-s3
                type: true_false
                text: "In France you pay with pounds."
                say: { en: "Read the sentence. Is it true?" }
                answer: false
                hints: ["France uses the euro."]
              - id: l2-s4
                type: image_multiple_choice
                text: "France is famous for le fromage. Which picture is it?"
                option_audio: false
                options: [{ object: cheese }, { object: milk }, { object: bread }]
                answer: cheese
                hints: ["Le fromage is cheese."]
              - id: l2-s5
                type: audio_choice
                text: "What does Hugo buy?"
                say: { en: "Listen. What does Hugo buy?" }
                audio: { fr: "Bonjour, Madame. Une baguette, s'il vous plaît.", speaker: male }
                options: [{ object: bread }, { object: cake }, { object: cheese }]
                answer: bread
                hints: ["A baguette is bread."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What is la tour Eiffel?"
                options: ["a tall iron tower in Paris", "a fast train", "a French cheese"]
                answer: "a tall iron tower in Paris"
              - id: l2-n2
                type: audio_choice
                text: "How does Nina travel to Marseille?"
                say: { en: "Listen. How does Nina travel to Marseille?" }
                audio: { fr: "J'habite à Paris. Demain, je vais à Marseille en TGV.", speaker: female }
                options: [{ object: train }, { object: car }, { object: boat }]
                answer: train
              - id: l2-n3
                type: true_false
                text: "On 14 July France has its national day."
                say: { en: "Read the sentence. Is it true?" }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Sam's family drives from Calais to Paris. Which side of the road do they drive on?"
                options: ["on the right", "on the left", "in the middle"]
                answer: "on the right"
              - id: l2-n5
                type: multiple_choice
                text: "Which city is not in France?"
                options: ["Montréal", "Lyon", "Marseille"]
                answer: "Montréal"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: from
            type: audio_choice
            text: "Where does Paul live?"
            say: { en: "Listen. Where does Paul live?" }
            audio: { fr: "Bonjour ! Je m'appelle Paul. J'habite à Genève, en Suisse.", speaker: male }
            options: ["in Switzerland", "in France", "in Canada"]
            answer: "in Switzerland"
          - id: l2-c2
            part: countries
            type: multiple_choice
            text: "Chloé lives in Montréal. Which language does she speak?"
            options: ["French", "Canadian", "Spanish"]
            answer: "French"
          - id: l2-c3
            part: countries
            type: true_false
            text: "People speak French in Germany."
            say: { en: "Read the sentence. Is it true?" }
            answer: false
          - id: l2-c4
            part: france
            type: multiple_choice
            text: "You buy a baguette in Paris. Which money do you pay with?"
            options: ["euros", "pounds", "dollars"]
            answer: "euros"
          - id: l2-c5
            part: france
            type: multiple_choice
            text: "What is the TGV?"
            options: ["a very fast train", "a tower in Paris", "a long loaf of bread"]
            answer: "a very fast train"
          - id: l2-c6
            part: countries
            type: multiple_choice
            text: "Which country is far from France, but people there speak French too?"
            options: ["Belgium", "Spain", "Canada"]
            answer: "Canada"
          - id: l2-c7
            part: countries
            type: true_false
            text: "French is spoken only in France."
            say: { en: "Read the sentence. Is it true?" }
            answer: false
          - id: l2-c8
            part: countries
            type: sorting
            option_audio: false
            text: "Sort the countries: is French spoken there?"
            say: { en: "Read each country. Is French spoken there? Sort them." }
            bins:
              - { id: french, show: { text: "French is spoken here." } }
              - { id: other, show: { text: "French is not spoken here." } }
            options:
              - { text: "Italy", bin: other }
              - { text: "Côte d'Ivoire", bin: french }
              - { text: "Portugal", bin: other }
              - { text: "Belgium", bin: french }
          - id: l2-c9
            part: countries
            type: multiple_choice
            text: "Awa lives in Dakar, in Senegal. Which language does she learn at school?"
            options: ["Spanish", "French", "German"]
            answer: "French"
          - id: l2-c10
            part: countries
            type: multiple_choice
            text: "Which two countries are next door to France and speak French?"
            options: ["Canada and Senegal", "Spain and Italy", "Belgium and Switzerland"]
            answer: "Belgium and Switzerland"
          - id: l2-c11
            part: from
            type: audio_choice
            text: "Where does Jade live?"
            say: { en: "Listen. Where does Jade live?" }
            audio: { fr: "Salut ! Je m'appelle Jade. J'habite au Luxembourg.", speaker: female }
            options: ["in Belgium", "in Luxembourg", "in France"]
            answer: "in Luxembourg"
          - id: l2-c12
            part: from
            type: audio_choice
            text: "Where does Malik live?"
            say: { en: "Listen. Where does Malik live?" }
            audio: { fr: "Bonjour ! Je m'appelle Malik. J'habite à Liège, en Belgique.", speaker: male }
            options: ["in Switzerland", "in Canada", "in Belgium"]
            answer: "in Belgium"
          - id: l2-c13
            part: from
            type: true_false
            text: "Does Clara live in France?"
            say: { en: "Listen. Does Clara live in France?" }
            audio: { fr: "Salut ! Je m'appelle Clara. J'habite à Marseille, en France.", speaker: female }
            answer: true
          - id: l2-c14
            part: from
            type: audio_choice
            text: "Which city does Théo live in?"
            say: { en: "Listen. Which city does Théo live in?" }
            audio: { fr: "Bonjour ! Je m'appelle Théo. J'habite à Toulouse, en France.", speaker: male }
            options: ["Paris", "Toulouse", "Genève"]
            answer: "Toulouse"
          - id: l2-c15
            part: from
            type: audio_choice
            text: "Who lives in Senegal?"
            say: { en: "Listen. Who lives in Senegal?" }
            audio: { turns: [{ fr: "Je m'appelle Karim. J'habite à Dakar, au Sénégal.", speaker: male }, { fr: "Et moi, je m'appelle Lou. J'habite à Paris.", speaker: female }] }
            options: ["Karim", "Lou", "both"]
            answer: "Karim"
          - id: l2-c16
            part: france
            type: image_multiple_choice
            option_audio: false
            text: "Which picture shows la tour Eiffel?"
            options: [{ object: station }, { object: eiffel-tower }, { object: church }]
            answer: eiffel-tower
          - id: l2-c17
            part: france
            type: true_false
            text: "In France, cars drive on the right."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
          - id: l2-c18
            part: france
