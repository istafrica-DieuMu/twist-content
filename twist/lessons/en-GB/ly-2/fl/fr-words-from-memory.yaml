# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-words-from-memory
skill: fl.writing.words-from-memory
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Wörter aus dem Gedächtnis schreiben (Französisch)
  en: Writing French words from memory
summary: >
  Writing practised French words without a model and checking them in a
  word list. Lesson 1 learns look, cover, write, check: the word is shown
  for a moment and then covered, or only the picture is shown, and the
  child types the word with its le or la, minding silent letters, ou, oi,
  eau, ch and é. Lesson 2 checks words in an alphabetical word list, finds
  and corrects mistakes, and ends with the skill check.
metadata:
  year: ly-2
  topic: { de: Schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.writing.copy-words, fl.reading.sound-spelling]
  also_practises: [fl.culture-strategies.learn-words]
  vocabulary: { fr: [le chat, le chien, la poule, la poire, la souris, le chapeau, le bateau, le cadeau, le gâteau, le cochon, la trousse, le crayon, la chaise, le bébé, le vélo, "l'étoile", le poisson, trois, le lapin, une liste de mots] }
  forms: [picture, text, drawn]
  drawn: [word-card, letter-card]
  facets: []
  parts:
    - { id: spell, what: { de: geübte Wörter aus dem Kopf schreiben, en: writing practised words from memory } }
    - { id: choose, what: { de: die richtige Schreibung erkennen, en: recognising the right spelling } }
    - { id: check, what: { de: ein Wort in der Wörterliste prüfen und verbessern, en: checking a word in a word list and correcting it } }
    - { id: abc, what: { de: Wörter nach dem ABC ordnen und finden, en: putting words in ABC order and finding them } }
  misconceptions:
    - id: english-spelling
      what: Writes from memory with English spellings of French sounds (la pool, le bato, le shien, trwa)
      addressed: lesson 1 Learn says to remember the French letters, not only the sound; l1-f2 gives feedback on la pool, every spelling choice keeps an English-style spelling, and the correct-it tasks (l2-f3, l2-n3, l2-c5) start from one
    - id: trusts-memory
      what: Does not check a word, or looks only at its first letters in the word list
      addressed: lesson 2 Learn shows checking letter by letter in the list; l2-f1 gives feedback on chein, and the find-the-mistake tasks set a wrong word among right ones that start the same way (poule, poir; chapeau, gato)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ansehen, abdecken, schreiben, prüfen", en: "Look, cover, write, check" }
    goal:
      de: "Schau dir ein Wort an, deck es zu und schreib es aus dem Kopf, mit le oder la, so wie la souris."
      en: "Look at a word, cover it and write it from memory with le or la, like la souris."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            keyboard: letters
            text: "Copy the word."
            show: { drawn: word-card, text: "la poule" }
            answer: "la poule"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which spelling is right?"
            say: { en: "Listen. Which spelling is right?" }
            show: { object: boat }
            audio: { fr: "le bateau" }
            options: ["le bateau", "le bato", "le batoe"]
            answer: "le bateau"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "look, say, cover, write, check"
            say: { en: "To learn a word by heart: look at it, say it, cover it, write it, then check it against the word. Do it with me.", fr: "la souris" }
            show: { drawn: word-card, text: "la souris" }
          - text: "la souris"
            say: { en: "Think of the letters, not only the sound. Souris: ou says oo, and the s at the end is silent, but you still write it." }
            show: { object: mouse }
          - text: "ou, oi, eau, ch, é"
            say: { en: "Remember the French spellings: ou for oo, oi for wa, eau for oh, ch for sh, é for ay. And always write le or la with the word." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                keyboard: letters
                text: "Look at the word. When it is covered, write it."
                show: { drawn: word-card, text: "le chat", flash: 3 }
                answer: "le chat"
                hints:
                  - "Say it to yourself: le chat. Le, then the word."
                  - "Chat ends in a letter you do not hear."
                  - "le chat"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Which spelling is right?"
                show: { object: hen }
                options: ["la poule", "la pool", "la poulle"]
                answer: "la poule"
                feedback:
                  "la pool": "That is the English way to write it. In French the sound oo is written ou."
                hints:
                  - "Say the word: la poule. Which sound is in the middle?"
                  - "Oo is written ou, and poule ends with an e."
                  - "la poule"
              - id: l1-f3
                type: text_input
                keyboard: letters
                text: "Write the word for the picture, with le or la."
                show: { object: hat }
                answer: "le chapeau"
                hints:
                  - "It is le chapeau. Say it slowly."
                  - "Sh is written ch; the oh at the end is eau."
                  - "le chapeau"
              - id: l1-f4
                type: fill_in_blank
                option_audio: false
                text: "Fill in the missing letters."
                show: { object: boat }
                frame: "le bat_"
                options: ["eau", "o", "au"]
                answer: ["eau"]
                hints:
                  - "Which sound is at the end of bateau?"
                  - "Oh at the end of a word is often three letters."
                  - "le bateau"
              - id: l1-f5
                type: text_input
                keyboard: letters
                text: "Look at the word. When it is covered, write it."
                show: { drawn: word-card, text: "la trousse", flash: 3 }
                answer: "la trousse"
                hints:
                  - "Ou says oo. Count the s's."
                  - "There are two s's, then an e."
                  - "la trousse"

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                keyboard: letters
                text: "Write the word for the picture, with le or la."
                show: { object: pear }
                answer: "la poire"
                hints: ["Wa is written oi, and there is an e at the end."]
              - id: l1-s2
                type: text_input
                keyboard: letters
                text: "Look at the word. When it is covered, write it."
                show: { drawn: word-card, text: "le crayon", flash: 3 }
                answer: "le crayon"
                hints: ["There is a y in the middle."]
              - id: l1-s3
                type: multiple_choice
                option_audio: false
                text: "Which spelling is right?"
                show: { object: dog }
                options: ["le chien", "le shien", "le chein"]
                answer: "le chien"
                hints: ["Sh is written ch; then i before e."]
              - id: l1-s4
                type: text_input
                keyboard: letters
                text: "Write the word for the picture, with le or la."
                show: { object: mouse }
                answer: "la souris"
                hints: ["There is a silent letter at the end."]
              - id: l1-s5
                type: fill_in_blank
                option_audio: false
                text: "Fill in the missing letters."
                show: { object: baby }
                frame: "le b_b_"
                options: ["é", "e", "ay"]
                answer: ["é", "é"]
                hints: ["Ay is written é, both times."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                keyboard: letters
                text: "Write the word for the picture, with le or la."
                show: { object: pig }
                answer: "le cochon"
              - id: l1-n2
                type: text_input
                keyboard: letters
                text: "Look at the word. When it is covered, write it."
                show: { drawn: word-card, text: "la chaise", flash: 3 }
                answer: "la chaise"
              - id: l1-n3
                type: multiple_choice
                option_audio: false
                text: "Which spelling is right?"
                show: { object: cake }
                options: ["le gâteau", "le gato", "le gâtau"]
                answer: "le gâteau"
              - id: l1-n4
                type: text_input
                keyboard: letters
                text: "Write the word for the picture, with le, la or l'."
                show: { object: star }
                answer: "l'étoile"
              - id: l1-n5
                type: text_input
                keyboard: letters
                text: "Write the word for the picture, with le or la."
                show: { object: bike }
                answer: "le vélo"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            keyboard: letters
            text: "Write the word for the picture, with le or la."
            show: { object: cat }
            answer: "le chat"
          - id: l1-c2
            type: text_input
            keyboard: letters
            text: "Write the word for the picture, with le or la."
            show: { object: hen }
            answer: "la poule"
          - id: l1-c3
            type: multiple_choice
            option_audio: false
            text: "Which spelling is right?"
            show: { object: present }
            options: ["le cado", "le cadeau", "le cadau"]
            answer: "le cadeau"
          - id: l1-c4
            type: text_input
            keyboard: letters
            text: "Write the word for the picture, with le or la."
            show: { object: pencil }
            answer: "le crayon"
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "Which spelling is right?"
            show: { object: pear }
            options: ["la pwar", "la poire", "la poir"]
            answer: "la poire"
          - id: l1-c6
            type: fill_in_blank
            option_audio: false
            text: "Fill in the missing letters."
            show: { object: mouse }
            frame: "la s_ris"
            options: ["oo", "u", "ou"]
            answer: ["ou"]

  - n: 2
    title: { de: "In der Wörterliste prüfen", en: "Checking in a word list" }
    goal:
      de: "Prüf deine Wörter in einer Wörterliste und verbessere Fehler, auch die Akzente, so wie bei vélo."
      en: "Check your words in a word list and fix mistakes, accents too, like in vélo."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            keyboard: letters
            text: "Write the word for the picture, with le or la."
            show: { object: dog }
            answer: "le chien"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Which spelling is right?"
            show: { object: mouse }
            options: ["la souris", "la souri", "la soori"]
            answer: "la souris"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Word list:\nbateau, chapeau, chat, chien, poire, poule"
            say: { en: "A word list is in alphabetical order. To check a word, find its first letter, then the next letters, and compare your word letter by letter." }
          - text: "Tom wrote: le chein\nWord list: chien\nc, h, i, e, n"
            say: { en: "Tom wrote chein. In the list it is chien: c, h, i, e, n. The i comes before the e. So Tom corrects it to le chien." }
          - text: "Mia wrote: le velo\nWord list: vélo"
            say: { en: "Check the accents too. Mia wrote velo, but the list has vélo, with é. Accents are part of the spelling." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Word list: bateau, chapeau, chat, chien, poire, poule\nTom wrote: le chein\nWhich is the right spelling?"
                options: ["le chien", "le chein", "le shien"]
                answer: "le chien"
                feedback:
                  "le chein": "Check it in the list letter by letter: c, h, i, e, n."
                hints:
                  - "Find the word in the list. It starts with ch."
                  - "Compare letter by letter. Which comes first, i or e?"
                  - "le chien"
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Which word is spelt wrong? Check each one in the list.\nWord list: chat, poire, poule, souris"
                show: { drawn: letter-card, text: "poule chat poir souris" }
                spans: ["poir"]
                hints:
                  - "Find each word in the list and compare."
                  - "Look carefully at the two words that start with po."
                  - "Poir is wrong: the list has poire."
              - id: l2-f3
                type: text_input
                keyboard: letters
                text: "Tom wrote “le bato”. Write it correctly.\nWord list: bateau, cadeau, chapeau"
                answer: "le bateau"
                hints:
                  - "Find the word in the list that starts with ba."
                  - "The list has bateau, with eau at the end."
                  - "le bateau"
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Put the words in alphabetical order, like a word list."
                options: ["poule", "chat", "souris", "bateau"]
                slot_count: 4
                answer: ["bateau", "chat", "poule", "souris"]
                hints:
                  - "Look at the first letter of each word."
                  - "b comes first in the alphabet, then c, p and s."
                  - "bateau, chat, poule, souris"
              - id: l2-f5
                type: true_false
                text: "Word list: bébé, cochon, étoile, vélo\nMia wrote: le velo\nIs it right?"
                answer: false
                hints:
                  - "Find vélo in the list."
                  - "Look at the e in the list and in Mia's word."
                  - "No. It needs the accent: le vélo."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Word list: cadeau, cochon, gâteau, lapin\nSam wrote: le cochonne\nWhich is the right spelling?"
                options: ["le cochon", "le cochonne", "le coshon"]
                answer: "le cochon"
                hints: ["Compare Sam's word with the list, right to the end."]
              - id: l2-s2
                type: highlight_in_text
                text: "Which word is spelt wrong? Check each one in the list.\nWord list: bateau, chien, lapin, vélo"
                show: { drawn: letter-card, text: "lapin batau chien vélo" }
                spans: ["batau"]
                hints: ["Look at the end of each word."]
              - id: l2-s3
                type: text_input
                keyboard: letters
                text: "Léa wrote “la souri”. Write it correctly.\nWord list: poule, souris, trousse"
                answer: "la souris"
                hints: ["The list has a silent letter at the end."]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Put the words in alphabetical order, like a word list."
                options: ["lapin", "cochon", "vélo", "étoile"]
                slot_count: 4
                answer: ["cochon", "étoile", "lapin", "vélo"]
                hints: ["First letters: c, é, l, v. É counts as e."]
              - id: l2-s5
                type: true_false
                text: "Word list: chaise, chat, crayon, trousse\nMia wrote: la trousse\nIs it right?"
                answer: true
                hints: ["Compare it with the list letter by letter."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                option_audio: false
                text: "Word list: étoile, poire, poisson, trois\nBen wrote: l'étoil\nWhich is the right spelling?"
                options: ["l'étoile", "l'étoil", "l'étwal"]
                answer: "l'étoile"
              - id: l2-n2
                type: highlight_in_text
                text: "Which word is spelt wrong? Check each one in the list.\nWord list: chapeau, gâteau, poire, souris"
                show: { drawn: letter-card, text: "chapeau gato poire souris" }
                spans: ["gato"]
              - id: l2-n3
                type: text_input
                keyboard: letters
                text: "Zoé wrote “le shien”. Write it correctly.\nWord list: chat, chien, cochon"
                answer: "le chien"
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Put the words in alphabetical order, like a word list."
                options: ["souris", "poire", "chapeau", "gâteau"]
                slot_count: 4
                answer: ["chapeau", "gâteau", "poire", "souris"]
              - id: l2-n5
                type: true_false
                text: "Word list: bateau, bébé, poule, vélo\nTom wrote: le bébé\nIs it right?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: spell
            type: text_input
            keyboard: letters
            text: "Write the word for the picture, with le or la."
            show: { object: present }
            answer: "le cadeau"
          - id: l2-c2
            part: spell
            type: text_input
            keyboard: letters
            text: "Look at the word. When it is covered, write it."
            show: { drawn: word-card, text: "le poisson", flash: 3 }
            answer: "le poisson"
          - id: l2-c3
            part: check
            type: multiple_choice
            option_audio: false
            text: "Word list: chaise, chat, chien, crayon\nNoah wrote: la chese\nWhich is the right spelling?"
            options: ["la chaise", "la chese", "la chaize"]
            answer: "la chaise"
          - id: l2-c4
            part: check
            type: highlight_in_text
            text: "Which word is spelt wrong? Check each one in the word list.\nWord list: cochon, lapin, poule, trousse"
            show: { drawn: letter-card, text: "trousse cochon lapen poule" }
            spans: ["lapen"]
          - id: l2-c5
            part: check
            type: text_input
            keyboard: letters
            text: "Lily wrote “trwa”. Write it correctly.\nWord list: poire, trois, trousse"
            answer: "trois"
          - id: l2-c6
            part: spell
            type: text_input
            keyboard: letters
            text: "Write the word for the picture, with le or la."
            show: { object: rabbit }
            answer: "le lapin"
          - id: l2-c7
            part: spell
            type: text_input
            keyboard: letters
            text: "Look at the word. When it is covered, write it."
            show: { drawn: word-card, text: "le gâteau", flash: 3 }
            answer: "le gâteau"
          - id: l2-c8
            part: spell
            type: text_input
            keyboard: letters
            text: "Write the word for the picture, with le or la."
            show: { object: baby }
            answer: "le bébé"
          - id: l2-c9
            part: choose
            type: multiple_choice
            option_audio: false
            text: "Which spelling is right?"
            show: { object: pencil-case }
            options: ["la trouse", "la trousse", "la troosse"]
            answer: "la trousse"
          - id: l2-c10
            part: choose
            type: multiple_choice
            option_audio: false
            text: "Which spelling is right?"
            show: { object: bike }
            options: ["le velo", "le vaylo", "le vélo"]
            answer: "le vélo"
          - id: l2-c11
            part: choose
            type: multiple_choice
            option_audio: false
            text: "Which spelling is right?"
            show: { object: pencil }
            options: ["le craion", "le crayon", "le creyon"]
            answer: "le crayon"
          - id: l2-c12
            part: choose
            type: multiple_choice
            option_audio: false
            text: "Which spelling is right?"
            show: { object: fish }
            options: ["le pwasson", "le poisson", "le poison"]
            answer: "le poisson"
          - id: l2-c13
            part: choose
            type: multiple_choice
            option_audio: false
            text: "Which spelling is right?"
            show: { object: hat }
            options: ["le shapeau", "le chapo", "le chapeau"]
            answer: "le chapeau"
          - id: l2-c14
            part: check
            type: true_false
            text: "Word list: cadeau, chapeau, poisson, souris\nInès wrote: le chapau\nIs it right?"
            answer: false
          - id: l2-c15
            part: check
            type: text_input
            keyboard: letters
            text: "Emma wrote “la pool”. Write it correctly.\nWord list: poire, poisson, poule"
            answer: "la poule"
          - id: l2-c16
            part: abc
            type: ordering
            option_audio: false
            text: "Put the words in alphabetical order, like a word list."
            options: ["trousse", "bébé", "lapin", "crayon"]
            slot_count: 4
            answer: ["bébé", "crayon", "lapin", "trousse"]
          - id: l2-c17
            part: abc
            type: ordering
            option_audio: false
            text: "Put the words in alphabetical order, like a word list."
            options: ["poule", "poisson", "cochon", "poire"]
            slot_count: 4
            answer: ["cochon", "poire", "poisson", "poule"]
          - id: l2-c18
            part: abc
            type: multiple_choice
            option_audio: false
            text: "Which word comes first in a word list?"
            options: ["chien", "chat", "chapeau"]
            answer: "chapeau"
          - id: l2-c19
            part: abc
            type: multiple_choice
            option_audio: false
            text: "Word list: cadeau, _, chien, lapin\nWhich word fits in the gap?"
            options: ["bateau", "chat", "poule"]
            answer: "chat"
          - id: l2-c20
            part: abc
            type: true_false
            text: "bébé, chien, étoile, poule, souris\nIs this list in alphabetical order?"
            answer: true
