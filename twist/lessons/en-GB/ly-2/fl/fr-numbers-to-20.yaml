# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-numbers-to-20
skill: fl.themes.numbers-to-20
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Zahlen bis 20 (Französisch)
  en: Numbers to 20 in French
summary: >
  The French numbers eleven to twenty, asking someone's age and hearing a
  phone number. Lesson 1 brings onze to seize, which each have their own
  word, counts on from dix, and keeps douze, treize and seize apart from
  deux, trois and six; lesson 2 adds dix-sept, dix-huit, dix-neuf and
  vingt, Tu as quel âge ? J'ai ... ans, and phone numbers said in pairs
  (zéro six, douze, quinze ...), and ends with the skill check. Children
  read numerals; the number words are heard.
metadata:
  year: ly-2
  topic: { de: Zahlen, en: Numbers }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.numbers-to-10]
  also_practises: [fl.grammar.chunks]
  vocabulary: { fr: [onze, douze, treize, quatorze, quinze, seize, dix-sept, dix-huit, dix-neuf, vingt, "Tu as quel âge ?", "J'ai ... ans.", zéro, un numéro de téléphone] }
  forms: [audio, text]
  drawn: []
  facets: []
  parts:
    - { id: numbers, what: { de: die Zahlen von 11 bis 20 auf Französisch verstehen, en: understanding the numbers from 11 to 20 in French } }
    - { id: count, what: { de: auf Französisch bis 20 zählen, en: counting to 20 in French } }
    - { id: age, what: { de: "nach dem Alter fragen und es sagen (Tu as quel âge ? J'ai ... ans.)", en: "asking and saying someone's age (Tu as quel âge ? J'ai ... ans.)" } }
    - { id: phone, what: { de: französische Telefonnummern in Paaren verstehen, en: understanding French phone numbers said in pairs } }
  misconceptions:
    - id: small-number
      what: Hears douze as deux, treize as trois, seize as six, quatorze as quatre
      addressed: lesson 1 Learn sets each pair side by side; l1-f1 gives feedback when douze is taken for 2, every stage of lesson 1 keeps the small number among the options, l1-s5 asks whether quatre is 14, and l1-n4 matches both numbers of two pairs
    - id: dix-plus
      what: Hears only the last part of dix-sept, dix-huit and dix-neuf and takes 7, 8 or 9
      addressed: lesson 2 Learn shows dix-sept as ten and seven; l2-f1 gives feedback when dix-huit is taken for 8, and l2-s1, l2-n1 and the skill check keep the small number among the options
    - id: phone-digits
      what: Expects a phone number to be said digit by digit, as in English, and misses that French says it in pairs
      addressed: lesson 2 Learn says French phone numbers come in pairs; every stage of lesson 2 and the skill check have a phone number, with digit-by-digit numbers among the options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "onze bis seize", en: "onze to seize" }
    goal:
      de: "Hör die französischen Zahlen von 11 bis 16 und halte douze und deux gut auseinander."
      en: "Listen to the French numbers from 11 to 16 and keep douze and deux apart."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which number do you hear?"
            say: { en: "Listen. Which number do you hear?" }
            audio: { fr: "sept" }
            options: ["6", "7", "9"]
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which number do you hear?"
            say: { en: "Listen. Which number do you hear?" }
            audio: { fr: "dix" }
            options: ["10", "2", "6"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "10 dix, 11 onze, 12 douze, 13 treize"
            say: { en: "After ten, each number up to sixteen has its own word. Listen.", fr: "dix, onze, douze, treize" }
          - text: "14 quatorze, 15 quinze, 16 seize"
            say: { en: "And on to sixteen.", fr: "quatorze, quinze, seize" }
          - text: "2 deux, 12 douze\n3 trois, 13 treize\n6 six, 16 seize"
            say: { en: "Careful: douze sounds a bit like deux, treize like trois, seize like six. The ze at the end tells you it is the bigger number.", fr: "deux, douze. Trois, treize. Six, seize." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which number do you hear?"
                say: { en: "Listen. Which number do you hear?" }
                audio: { fr: "douze" }
                options: ["12", "2", "20"]
                answer: "12"
                feedback:
                  "2": "Deux is 2. Douze ends in ze: 12."
                hints:
                  - "Listen to the end of the word."
                  - "Numbers ending in ze are between 11 and 16."
                  - "Douze is 12."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which number do you hear?"
                say: { en: "Listen. Which number do you hear?" }
                audio: { fr: "quinze" }
                options: ["15", "5", "50"]
                answer: "15"
                hints:
                  - "Listen to the end: ze."
                  - "Ze at the end means a number between 11 and 16."
                  - "Quinze is 15."
              - id: l1-f3
                type: audio_choice
                text: "Which number comes next?"
                say: { en: "Listen and count on. Which number comes next?" }
                audio: { fr: "onze, douze, treize ..." }
                options: ["14", "13", "4"]
                answer: "14"
                hints:
                  - "Onze, douze, treize: 11, 12, 13."
                  - "What comes after 13?"
                  - "14, quatorze."
              - id: l1-f4
                type: matching
                option_audio: false
                text: "Match each number with its word."
                say: { en: "Tap a number, then its French word." }
                pairs:
                  - left: { text: "11" }
                    right: { text: "onze" }
                  - left: { text: "13" }
                    right: { text: "treize" }
                  - left: { text: "16" }
                    right: { text: "seize" }
                  - left: { text: "14" }
                    right: { text: "quatorze" }
                hints:
                  - "Each word starts like a small number you know."
                  - "Treize starts like trois, seize like six, quatorze like quatre."
                  - "11 onze, 13 treize, 14 quatorze, 16 seize."
              - id: l1-f5
                type: speak
                text: "Count in French from 10 to 16."
                say: { en: "Count in French from ten to sixteen.", fr: "dix, onze, douze, treize, quatorze, quinze, seize" }
                expected_text: "dix, onze, douze, treize, quatorze, quinze, seize"
                hints:
                  - "Start with dix."
                  - "Dix, onze, douze, treize ..."
                  - "Say it with me: dix, onze, douze, treize, quatorze, quinze, seize."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which number do you hear?"
                say: { en: "Listen. Which number do you hear?" }
                audio: { fr: "seize" }
                options: ["16", "6", "60"]
                answer: "16"
                hints: ["Ze at the end: a number between 11 and 16."]
              - id: l1-s2
                type: audio_choice
                text: "Which number do you hear?"
                say: { en: "Listen. Which number do you hear?" }
                audio: { fr: "treize" }
                options: ["13", "3", "30"]
                answer: "13"
                hints: ["Trois is 3; treize is the bigger one."]
              - id: l1-s3
                type: text_input
                text: "Listen. Write the number."
                say: { en: "Listen. Write the number.", fr: "onze" }
                answer: "11"
                hints: ["Onze is the first number after dix."]
              - id: l1-s4
                type: audio_choice
                text: "Which number comes next?"
                say: { en: "Listen and count on. Which number comes next?" }
                audio: { fr: "quatorze, quinze ..." }
                options: ["16", "13", "6"]
                answer: "16"
                hints: ["Quatorze, quinze: 14, 15."]
              - id: l1-s5
                type: true_false
                text: "14\nDoes the voice say this number?"
                say: { en: "Listen. Does the voice say this number?", fr: "quatre" }
                answer: false
                hints: ["Fourteen is quatorze. Did you hear the end of it?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which number do you hear?"
                say: { en: "Listen. Which number do you hear?" }
                audio: { fr: "quatorze" }
                options: ["14", "4", "40"]
                answer: "14"
              - id: l1-n2
                type: text_input
                text: "Listen. Write the number."
                say: { en: "Listen. Write the number.", fr: "douze" }
                answer: "12"
              - id: l1-n3
                type: audio_choice
                text: "Which number comes next?"
                say: { en: "Listen and count on. Which number comes next?" }
                audio: { fr: "onze, douze ..." }
                options: ["13", "3", "14"]
                answer: "13"
              - id: l1-n4
                type: matching
                option_audio: false
                text: "Match each number with its word."
                say: { en: "Tap a number, then its French word." }
                pairs:
                  - left: { text: "12" }
                    right: { text: "douze" }
                  - left: { text: "2" }
                    right: { text: "deux" }
                  - left: { text: "16" }
                    right: { text: "seize" }
                  - left: { text: "6" }
                    right: { text: "six" }
              - id: l1-n5
                type: true_false
                text: "16\nDoes the voice say this number?"
                say: { en: "Listen. Does the voice say this number?", fr: "seize" }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which number do you hear?"
            say: { en: "Listen. Which number do you hear?" }
            audio: { fr: "onze" }
            options: ["11", "1", "12"]
            answer: "11"
          - id: l1-c2
            type: text_input
            text: "Listen. Write the number."
            say: { en: "Listen. Write the number.", fr: "seize" }
            answer: "16"
          - id: l1-c3
            type: audio_choice
            text: "Which number do you hear?"
            say: { en: "Listen. Which number do you hear?" }
            audio: { fr: "treize" }
            options: ["13", "3", "12"]
            answer: "13"
          - id: l1-c4
            type: true_false
            text: "Listen. Tom hears this number and writes 4. Is he right?"
            say: { en: "Listen. Tom hears this number and writes four. Is he right?", fr: "quatorze" }
            answer: false
          - id: l1-c5
            type: audio_choice
            text: "Which number comes next?"
            say: { en: "Listen and count on. Which number comes next?" }
            audio: { fr: "douze, treize, quatorze ..." }
            options: ["15", "5", "16"]
            answer: "15"
          - id: l1-c6
            type: matching
            option_audio: false
            text: "Match each number with its word."
            say: { en: "Tap a number, then its French word." }
            pairs:
              - left: { text: "15" }
                right: { text: "quinze" }
              - left: { text: "5" }
                right: { text: "cinq" }
              - left: { text: "13" }
                right: { text: "treize" }
              - left: { text: "3" }
                right: { text: "trois" }

  - n: 2
    title: { de: "dix-sept bis vingt, Alter und Telefon", en: "dix-sept to vingt, ages and phone numbers" }
    goal:
      de: "Zähl auf Französisch bis 20, frag nach dem Alter und sag zum Beispiel j'ai dix ans."
      en: "Count to 20 in French, ask how old someone is and answer, like j'ai dix ans."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which number do you hear?"
            say: { en: "Listen. Which number do you hear?" }
            audio: { fr: "quinze" }
            options: ["15", "5", "16"]
            answer: "15"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Listen. Write the number."
            say: { en: "Listen. Write the number.", fr: "treize" }
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "17 dix-sept, 18 dix-huit, 19 dix-neuf"
            say: { en: "Now French counts ten and seven: dix-sept is 17. Dix-huit is 18, dix-neuf is 19. Listen for dix at the start.", fr: "dix-sept, dix-huit, dix-neuf" }
          - text: "20 vingt"
            say: { en: "Twenty is vingt. You do not hear the g or the t.", fr: "vingt" }
          - text: "Tu as quel âge ?\nJ'ai dix ans."
            say: { en: "To ask someone's age, say tu as quel âge ? The answer: j'ai dix ans, I am ten. In French you say you have the years: j'ai ... ans.", fr: "Tu as quel âge ? J'ai dix ans." }
          - text: "06 12 15 18 20"
            say: { en: "French phone numbers are said in pairs, not one digit at a time. Listen.", fr: "zéro six, douze, quinze, dix-huit, vingt" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which number do you hear?"
                say: { en: "Listen. Which number do you hear?" }
                audio: { fr: "dix-huit" }
                options: ["18", "8", "10"]
                answer: "18"
                feedback:
                  "8": "You heard huit at the end, but dix comes first: ten and eight is 18."
                hints:
                  - "Listen to the start of the word."
                  - "Dix and huit: ten and eight."
                  - "Dix-huit is 18."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which number do you hear?"
                say: { en: "Listen. Which number do you hear?" }
                audio: { fr: "vingt" }
                options: ["20", "12", "2"]
                answer: "20"
                hints:
                  - "It is a short word, with no ze at the end."
                  - "It comes after dix-neuf."
                  - "Vingt is 20."
              - id: l2-f3
                type: audio_choice
                text: "How old is Chloé?"
                say: { en: "Listen. How old is Chloé?" }
                audio: { turns: [{ fr: "Chloé, tu as quel âge ?", speaker: male }, { fr: "J'ai onze ans.", speaker: female }] }
                options: ["11", "12", "1"]
                answer: "11"
                hints:
                  - "Listen to the answer: j'ai ... ans."
                  - "J'ai onze ans."
                  - "Onze is 11."
              - id: l2-f4
                type: audio_choice
                text: "Which phone number do you hear?"
                say: { en: "Listen to the phone number. Which one is it?" }
                audio: { fr: "zéro six, douze, quinze, dix-huit, vingt" }
                options: ["06 12 15 18 20", "06 02 05 08 20", "06 12 15 08 02"]
                answer: "06 12 15 18 20"
                hints:
                  - "French phone numbers come in pairs."
                  - "You hear douze, quinze, dix-huit: 12, 15, 18."
                  - "06 12 15 18 20"
              - id: l2-f5
                type: text_input
                text: "Listen. Write the number."
                say: { en: "Listen. Write the number.", fr: "dix-neuf" }
                answer: "19"
                hints:
                  - "Dix at the start, then a number you know."
                  - "Dix and neuf: ten and nine."
                  - "19"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which number do you hear?"
                say: { en: "Listen. Which number do you hear?" }
                audio: { fr: "dix-sept" }
                options: ["17", "7", "70"]
                answer: "17"
                hints: ["Dix and sept: ten and seven."]
              - id: l2-s2
                type: audio_choice
                text: "How old is Hugo?"
                say: { en: "Listen. How old is Hugo?" }
                audio: { turns: [{ fr: "Hugo, tu as quel âge ?", speaker: female }, { fr: "J'ai treize ans.", speaker: male }] }
                options: ["13", "3", "30"]
                answer: "13"
                hints: ["Treize ends in ze."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Put the numbers in order, smallest first."
                options: ["dix-neuf", "quinze", "vingt", "onze"]
                slot_count: 4
                answer: ["onze", "quinze", "dix-neuf", "vingt"]
                hints: ["Onze is 11, quinze 15, dix-neuf 19, vingt 20."]
              - id: l2-s4
                type: audio_choice
                text: "Which phone number do you hear?"
                say: { en: "Listen to the phone number. Which one is it?" }
                audio: { fr: "zéro six, onze, seize, dix-sept, quatorze" }
                options: ["06 11 16 17 14", "06 11 06 07 14", "06 01 16 17 04"]
                answer: "06 11 16 17 14"
                hints: ["Each pair is one number: onze, seize, dix-sept, quatorze."]
              - id: l2-s5
                type: speak
                text: "Say in French: I am nine."
                say: { en: "Say in French: I am nine.", fr: "J'ai neuf ans." }
                expected_text: "J'ai neuf ans."
                hints: ["You have your years: j'ai neuf ans."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which number do you hear?"
                say: { en: "Listen. Which number do you hear?" }
                audio: { fr: "dix-neuf" }
                options: ["19", "9", "90"]
                answer: "19"
              - id: l2-n2
                type: text_input
                text: "Listen. Write the number."
                say: { en: "Listen. Write the number.", fr: "vingt" }
                answer: "20"
              - id: l2-n3
                type: audio_choice
                text: "How old is Inès?"
                say: { en: "Listen. How old is Inès?" }
                audio: { turns: [{ fr: "Inès, tu as quel âge ?", speaker: male }, { fr: "J'ai douze ans.", speaker: female }] }
                options: ["12", "2", "20"]
                answer: "12"
              - id: l2-n4
                type: audio_choice
                text: "Which phone number do you hear?"
                say: { en: "Listen to the phone number. Which one is it?" }
                audio: { fr: "zéro sept, vingt, dix-huit, douze, treize" }
                options: ["07 20 18 12 13", "07 02 08 12 03", "07 20 08 02 13"]
                answer: "07 20 18 12 13"
              - id: l2-n5
                type: ordering
                option_audio: false
                text: "Put the numbers in order, smallest first."
                options: ["dix-huit", "douze", "seize", "quatorze"]
                slot_count: 4
                answer: ["douze", "quatorze", "seize", "dix-huit"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: numbers
            type: text_input
            text: "Listen. Write the number."
            say: { en: "Listen. Write the number.", fr: "quatorze" }
            answer: "14"
          - id: l2-c2
            part: numbers
            type: text_input
            text: "Listen. Write the number."
            say: { en: "Listen. Write the number.", fr: "dix-sept" }
            answer: "17"
          - id: l2-c3
            part: age
            type: audio_choice
            text: "How old is Lucas?"
            say: { en: "Listen. How old is Lucas?" }
            audio: { turns: [{ fr: "Lucas, tu as quel âge ?", speaker: female }, { fr: "J'ai seize ans.", speaker: male }] }
            options: ["16", "6", "60"]
            answer: "16"
          - id: l2-c4
            part: phone
            type: audio_choice
            text: "Which phone number do you hear?"
            say: { en: "Listen to the phone number. Which one is it?" }
            audio: { fr: "zéro six, treize, dix-neuf, quinze, onze" }
            options: ["06 13 19 15 11", "06 03 09 05 11", "06 13 09 15 01"]
            answer: "06 13 19 15 11"
          - id: l2-c5
            part: numbers
            type: matching
            option_audio: false
            text: "Match the numbers to the words."
            say: { en: "Tap a number, then its French word." }
            pairs:
              - left: { text: "17" }
                right: { text: "dix-sept" }
              - left: { text: "18" }
                right: { text: "dix-huit" }
              - left: { text: "19" }
                right: { text: "dix-neuf" }
              - left: { text: "20" }
                right: { text: "vingt" }
          - id: l2-c6
            part: numbers
            type: text_input
            text: "Listen. Write the number."
            say: { en: "Listen. Write the number.", fr: "dix-huit" }
            answer: "18"
          - id: l2-c7
            part: numbers
            type: true_false
            text: "Listen. Mia hears this number and writes 9. Is she right?"
            say: { en: "Listen. Mia hears this number and writes nine. Is she right?", fr: "dix-neuf" }
            answer: false
          - id: l2-c8
            part: count
            type: audio_choice
            text: "Which number comes next?"
            say: { en: "Listen and count on. Which number comes next?" }
            audio: { fr: "dix-sept, dix-huit ..." }
            options: ["19", "9", "20"]
            answer: "19"
          - id: l2-c9
            part: count
            type: audio_choice
            text: "Which number comes next?"
            say: { en: "Listen and count on. Which number comes next?" }
            audio: { fr: "quinze, seize ..." }
            options: ["17", "7", "18"]
            answer: "17"
          - id: l2-c10
            part: count
            type: ordering
            option_audio: false
            text: "Put the numbers in order, smallest first."
            options: ["vingt", "treize", "dix-sept", "onze"]
            slot_count: 4
            answer: ["onze", "treize", "dix-sept", "vingt"]
          - id: l2-c11
            part: count
            type: fill_in_blank
            option_audio: false
            text: "Which number is missing?"
            say: { en: "Which number is missing? Fill the gap." }
            frame: "dix-sept, _, dix-neuf, vingt"
            options: ["huit", "dix-huit", "seize"]
            answer: ["dix-huit"]
          - id: l2-c12
            part: count
            type: audio_choice
            text: "Which number comes next?"
            say: { en: "Listen and count on. Which number comes next?" }
            audio: { fr: "dix-sept, dix-huit, dix-neuf ..." }
            options: ["20", "10", "12"]
            answer: "20"
          - id: l2-c13
            part: age
            type: audio_choice
            text: "How old is Manon?"
            say: { en: "Listen. How old is Manon?" }
            audio: { turns: [{ fr: "Manon, tu as quel âge ?", speaker: male }, { fr: "J'ai quatorze ans.", speaker: female }] }
            options: ["14", "4", "40"]
            answer: "14"
          - id: l2-c14
            part: age
            type: audio_choice
            text: "How old is Jules?"
            say: { en: "Listen. How old is Jules?" }
            audio: { turns: [{ fr: "Jules, tu as quel âge ?", speaker: female }, { fr: "J'ai dix-sept ans.", speaker: male }] }
            options: ["17", "7", "10"]
            answer: "17"
          - id: l2-c15
            part: age
            type: multiple_choice
            text: "You want to know how old your friend is. What do you ask?"
            say: "You want to know how old your friend is. What do you ask?"
            options: ["Tu as quel âge ?", "J'ai quel âge ?", "Tu as dix ans."]
            answer: "Tu as quel âge ?"
            option_audio: false
          - id: l2-c16
            part: age
            type: multiple_choice
            text: "How do you say in French: I am twelve?"
            say: "How do you say in French: I am twelve?"
