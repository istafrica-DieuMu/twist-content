# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-food
skill: fl.themes.food
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Essen und Trinken (Französisch)
  en: Food and drink in French
summary: >
  Food and drink words in French, saying what you like and do not like,
  and asking politely for something. Lesson 1 brings le pain, le fromage,
  la pizza, la glace and le gâteau with j'aime le ... and je n'aime pas
  le ..., always with le or la after aime; lesson 2 adds le lait, le jus
  d'orange and l'eau, Je voudrais ..., s'il vous plaît, and Tu aimes ... ?
  with oui and non, and ends with the skill check. Instructions are in
  English; the French is heard and shown in short form.
metadata:
  year: ly-2
  topic: { de: Essen und Trinken, en: Food and drink }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks]
  also_practises: [fl.grammar.questions, fl.themes.hello]
  vocabulary: { fr: [le pain, le fromage, la pizza, la glace, le gâteau, le lait, le jus d'orange, "l'eau", "j'aime le ...", "je n'aime pas le ...", "Je voudrais ..., s'il vous plaît.", "Tu aimes ... ?", "Oui, j'aime ça.", "Non, je n'aime pas ça."] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: no-article
      what: Leaves out le or la after aime, as in English (j'aime fromage)
      addressed: lesson 1 Learn says French keeps le or la after j'aime; l1-f3 gives feedback on j'aime fromage, and l1-s3, l1-n3 and l2-c2 offer the form without the article
    - id: je-veux
      what: Orders with je veux (I want), which sounds rude, instead of je voudrais
      addressed: lesson 2 Learn sets je voudrais against je veux; l2-f3 gives feedback on je veux, and l2-s3, l2-n3 and l2-c4 keep it among the options
    - id: ne-pas
      what: Leaves out the n' or the pas (je aime pas, je n'aime le lait)
      addressed: lesson 1 Learn wraps n' and pas round aime; l1-f4, l1-s4 and l1-n4 build or choose je n'aime pas
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "J'aime la pizza.", en: "J'aime la pizza." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Une banane." }
            options: [{ object: banana }, { object: apple }, { object: carrot }]
            answer: banana
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "I like football."
            say: { en: "How do you say I like football in French?" }
            options: ["J'aime le foot.", "Je sais le foot.", "Je suis le foot."]
            answer: "J'aime le foot."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "le pain, le fromage, le gâteau"
            say: { en: "Food in French. Le pain is bread, le fromage is cheese, le gâteau is cake.", fr: "Le pain. Le fromage. Le gâteau." }
            show: { objects: [bread, cheese, cake] }
          - text: "la pizza, la glace"
            say: { en: "La pizza is pizza. La glace is ice cream.", fr: "La pizza. La glace." }
            show: { objects: [pizza, ice-cream] }
          - text: "J'aime le fromage."
            say: { en: "J'aime means I like. In English you say I like cheese. In French you keep le or la: j'aime le fromage, j'aime la pizza.", fr: "J'aime le fromage. J'aime la pizza." }
            show: { object: cheese }
          - text: "Je n'aime pas le gâteau."
            say: { en: "To say you do not like something, wrap n' and pas around aime: je n'aime pas le gâteau.", fr: "Je n'aime pas le gâteau." }
            show: { object: cake }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le fromage." }
                options: [{ object: cheese }, { object: bread }, { object: cake }]
                answer: cheese
                hints:
                  - "Listen again: le fromage."
                  - "Fromage is a new word. It is yellow and you can put it in a sandwich."
                  - "Le fromage is cheese."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "La glace." }
                options: [{ object: pizza }, { object: ice-cream }, { object: cake }]
                answer: ice-cream
                hints:
                  - "Listen again: la glace."
                  - "It is cold and sweet."
                  - "La glace is ice cream."
              - id: l1-f3
                type: multiple_choice
                text: "I like cheese."
                say: { en: "How do you say I like cheese in French?" }
                options: ["J'aime le fromage.", "J'aime fromage.", "Je suis le fromage."]
                answer: "J'aime le fromage."
                option_audio: false
                feedback:
                  "J'aime fromage.": "Nearly! French keeps le after j'aime: j'aime le fromage."
                hints:
                  - "Liking is j'aime."
                  - "French keeps le or la before the food."
                  - "J'aime le fromage."
              - id: l1-f4
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I don't like bread." }
                options: ["pas", "Je", "le pain.", "n'aime"]
                slot_count: 4
                answer: ["Je", "n'aime", "pas", "le pain."]
                hints:
                  - "Start with Je."
                  - "N' and pas go either side of aime."
                  - "Je n'aime pas le pain."
              - id: l1-f5
                type: speak
                say: { en: "Say it in French: I like pizza.", fr: "J'aime la pizza." }
                show: { object: pizza }
                expected_text: "J'aime la pizza."
                hints:
                  - "Start with j'aime."
                  - "Pizza takes la."
                  - "Say it with me: j'aime la pizza."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le pain." }
                options: [{ object: cake }, { object: bread }, { object: cheese }]
                answer: bread
                hints: ["Le pain is bread."]
              - id: l1-s2
                type: audio_choice
                say: { en: "Listen. What does Léa like?" }
                audio: { fr: "Je m'appelle Léa. J'aime le gâteau." }
                options: [{ object: cake }, { object: pizza }, { object: ice-cream }]
                answer: cake
                hints: ["Le gâteau is cake."]
              - id: l1-s3
                type: multiple_choice
                text: "I like ice cream."
                say: { en: "How do you say I like ice cream in French?" }
                options: ["J'aime glace.", "J'aime la glace.", "Je n'aime pas la glace."]
                answer: "J'aime la glace."
                option_audio: false
                hints: ["Keep la before glace."]
              - id: l1-s4
                type: true_false
                text: "Je n'aime pas le fromage.\nDoes the child like cheese?"
                say: { en: "Read the sentence. Does the child like cheese?" }
                answer: false
                hints: ["N' ... pas means not."]
              - id: l1-s5
                type: speak
                say: { en: "Say it in French: I don't like cake.", fr: "Je n'aime pas le gâteau." }
                show: { object: cake }
                expected_text: "Je n'aime pas le gâteau."
                hints: ["Say it with me: je n'aime pas le gâteau."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "La pizza." }
                options: [{ object: pizza }, { object: bread }, { object: cheese }]
                answer: pizza
              - id: l1-n2
                type: audio_choice
                say: { en: "Listen. What does Hugo not like?" }
                audio: { fr: "J'aime la pizza, mais je n'aime pas le fromage." }
                options: [{ object: cheese }, { object: pizza }, { object: cake }]
                answer: cheese
              - id: l1-n3
                type: multiple_choice
                text: "I like bread."
                say: { en: "How do you say I like bread in French?" }
                options: ["J'aime le pain.", "J'aime pain.", "Je n'aime pas le pain."]
                answer: "J'aime le pain."
                option_audio: false
              - id: l1-n4
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I don't like ice cream." }
                options: ["la glace.", "n'aime", "pas", "Je"]
                slot_count: 4
                answer: ["Je", "n'aime", "pas", "la glace."]
              - id: l1-n5
                type: true_false
                text: "J'aime le gâteau."
                say: { en: "Read the sentence. Does it match the picture?" }
                show: { object: cake }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Le gâteau." }
            options: [{ object: cake }, { object: cheese }, { object: ice-cream }]
            answer: cake
          - id: l1-c2
            type: audio_choice
            say: { en: "Listen. What does Zoé like?" }
            audio: { fr: "Je n'aime pas le pain. J'aime la glace." }
            options: [{ object: bread }, { object: ice-cream }, { object: pizza }]
            answer: ice-cream
          - id: l1-c3
            type: true_false
            text: "J'aime la pizza."
            say: { en: "Read the sentence. Does it match the picture?" }
            show: { object: bread }
            answer: false

  - n: 2
    title: { de: "Je voudrais ..., s'il vous plaît.", en: "Je voudrais ..., s'il vous plaît." }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Le fromage." }
            options: [{ object: cheese }, { object: cake }, { object: bread }]
            answer: cheese
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "I like pizza."
            say: { en: "How do you say I like pizza in French?" }
            options: ["J'aime la pizza.", "J'aime pizza.", "Je suis la pizza."]
            answer: "J'aime la pizza."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "le lait, le jus d'orange, l'eau"
            say: { en: "Drinks. Le lait is milk, le jus d'orange is orange juice, l'eau is water.", fr: "Le lait. Le jus d'orange. L'eau." }
            show: { objects: [milk, juice, water] }
          - text: "Je voudrais une glace, s'il vous plaît."
            say: { en: "To ask politely, say je voudrais, I would like, and s'il vous plaît. Je veux means I want. It sounds rude in a café. For some bread or some water, say du pain, de l'eau.", fr: "Je voudrais une glace, s'il vous plaît." }
            show: { object: ice-cream }
          - text: "Tu aimes le lait ? Oui, j'aime ça. / Non, je n'aime pas ça."
            say: { en: "Tu aimes ...? asks do you like ...? Answer oui, j'aime ça, yes, I like it, or non, je n'aime pas ça.", fr: "Tu aimes le lait ? Oui, j'aime ça. Non, je n'aime pas ça." }
            show: { object: milk }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { en: "Listen. Tap the drink." }
                audio: { fr: "Le jus d'orange." }
                options: [{ object: juice }, { object: milk }, { object: water }]
                answer: juice
                hints:
                  - "Listen for orange."
                  - "Le jus is juice."
                  - "Tap the orange juice."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { en: "Listen. What does Max ask for?" }
                audio: { fr: "Bonjour, Madame. Je voudrais de l'eau, s'il vous plaît." }
                options: [{ object: water }, { object: milk }, { object: juice }]
                answer: water
                hints:
                  - "Listen after je voudrais."
                  - "Max says de l'eau."
                  - "L'eau is water."
              - id: l2-f3
                type: multiple_choice
                text: "You are in a café. Ask for a pizza."
                say: { en: "You are in a café. Ask politely for a pizza." }
                options: ["Je voudrais une pizza, s'il vous plaît.", "Je veux une pizza.", "J'aime la pizza."]
                answer: "Je voudrais une pizza, s'il vous plaît."
                option_audio: false
                feedback:
                  "Je veux une pizza.": "Je veux means I want. It sounds rude. Say je voudrais and s'il vous plaît."
                hints:
                  - "Asking politely needs two polite parts."
                  - "I would like is je voudrais. Please is s'il vous plaît."
                  - "Je voudrais une pizza, s'il vous plaît."
              - id: l2-f4
                type: audio_choice
                say: { en: "Listen. Your friend likes milk. Which answer fits?" }
                audio: { fr: "Tu aimes le lait ?" }
                options: ["Oui, j'aime ça.", "Non, je n'aime pas ça.", "Je voudrais le lait."]
                answer: "Oui, j'aime ça."
                hints:
                  - "Tu aimes ...? asks do you like ...?"
                  - "Your friend likes it, so the answer starts with oui."
                  - "Oui, j'aime ça."
              - id: l2-f5
                type: speak
                say: { en: "Ask politely for an orange juice.", fr: "Je voudrais un jus d'orange, s'il vous plaît." }
                show: { object: juice }
                expected_text: "Je voudrais un jus d'orange, s'il vous plaît."
                hints:
                  - "Start with je voudrais."
                  - "End with s'il vous plaît."
                  - "Say it with me: je voudrais un jus d'orange, s'il vous plaît."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { en: "Listen. Tap the drink." }
                audio: { fr: "Le lait." }
                options: [{ object: water }, { object: milk }, { object: juice }]
                answer: milk
                hints: ["Le lait is milk."]
              - id: l2-s2
                type: audio_choice
                say: { en: "Listen. Does Inès like water?" }
                audio: { fr: "Inès, tu aimes l'eau ? Non, je n'aime pas ça. J'aime le jus d'orange." }
                options: ["No, she likes orange juice.", "Yes, she likes water.", "No, she likes milk."]
                answer: "No, she likes orange juice."
                hints: ["Listen for non, then the end."]
              - id: l2-s3
                type: multiple_choice
                text: "You are at the baker's. Ask for bread."
                say: { en: "You are at the baker's. Ask politely for some bread." }
                options: ["Je veux du pain.", "Je voudrais du pain, s'il vous plaît.", "J'aime le pain."]
                answer: "Je voudrais du pain, s'il vous plaît."
                option_audio: false
                hints: ["Je voudrais is polite; je veux is not."]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the question: do you like cheese?" }
                options: ["le fromage ?", "Tu", "aimes"]
                slot_count: 3
                answer: ["Tu", "aimes", "le fromage ?"]
                hints: ["Start with Tu."]
              - id: l2-s5
                type: speak
                say: { en: "Your friend asks: Tu aimes la glace ? Say yes, I like it.", fr: "Oui, j'aime ça." }
                show: { object: ice-cream }
                expected_text: "Oui, j'aime ça."
                hints: ["Say it with me: oui, j'aime ça."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { en: "Listen. Tap the drink." }
                audio: { fr: "L'eau." }
                options: [{ object: water }, { object: juice }, { object: milk }]
                answer: water
              - id: l2-n2
                type: audio_choice
                say: { en: "Listen. What does Chloé ask for?" }
                audio: { fr: "Bonjour, Monsieur. Je voudrais une glace et un jus d'orange, s'il vous plaît." }
                options: ["ice cream and orange juice", "ice cream and milk", "cake and orange juice"]
                answer: "ice cream and orange juice"
              - id: l2-n3
                type: multiple_choice
                text: "You are in a café. Ask for some milk."
                say: { en: "You are in a café. Ask politely for some milk." }
                options: ["Je voudrais du lait, s'il vous plaît.", "Je veux du lait.", "Tu aimes le lait ?"]
                answer: "Je voudrais du lait, s'il vous plaît."
                option_audio: false
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the order: I would like a cake, please." }
                options: ["s'il vous plaît.", "un gâteau,", "Je voudrais"]
                slot_count: 3
                answer: ["Je voudrais", "un gâteau,", "s'il vous plaît."]
              - id: l2-n5
                type: true_false
                text: "Tom: Tu aimes la pizza ?\nLéo: Non, je n'aime pas ça.\nDoes Léo like pizza?"
                say: { en: "Read the chat. Does Léo like pizza?" }
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { en: "Listen. What does Paul ask for?" }
            audio: { fr: "Je voudrais du fromage, s'il vous plaît." }
            options: [{ object: cheese }, { object: bread }, { object: milk }]
            answer: cheese
          - id: l2-c2
            type: multiple_choice
            text: "I like orange juice."
            say: { en: "How do you say I like orange juice in French?" }
            options: ["J'aime le jus d'orange.", "J'aime jus d'orange.", "Je voudrais jus d'orange."]
            answer: "J'aime le jus d'orange."
            option_audio: false
          - id: l2-c3
            type: audio_choice
            say: { en: "Listen. What does Nina not like?" }
            audio: { fr: "Nina, tu aimes le gâteau ? Oui ! Et le lait ? Non, je n'aime pas ça." }
            options: [{ object: milk }, { object: cake }, { object: water }]
            answer: milk
          - id: l2-c4
            type: multiple_choice
            text: "You are in a café. Ask for an ice cream."
            say: { en: "You are in a café. Ask politely for an ice cream." }
            options: ["Je voudrais une glace, s'il vous plaît.", "Je veux une glace.", "J'aime la glace."]
            answer: "Je voudrais une glace, s'il vous plaît."
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Je n'aime pas le pain.\nDoes the child like bread?"
            say: { en: "Read the sentence. Does the child like bread?" }
            answer: false
