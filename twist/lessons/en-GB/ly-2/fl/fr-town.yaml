# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-town
skill: fl.themes.town
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: In der Stadt (Französisch)
  en: In town in French
summary: >
  Places in town and simple directions in French. Lesson 1 learns the
  places (l'école, le parc, le magasin, la bibliothèque, la gare, la
  piscine, l'arrêt de bus) and what you do there; lesson 2 understands
  tourne à gauche, tourne à droite and va tout droit, follows a short way
  to a place, and ends with the skill check. The places are shown as
  pictures (the bus stop as its sign), directions as arrows. Following a
  way on a street map waits for a map component.
metadata:
  year: ly-2
  topic: { de: In der Stadt, en: In town }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.questions]
  also_practises: [fl.listening.details, fl.listening.short-dialogues]
  vocabulary: { fr: [l'école, le parc, le magasin, la bibliothèque, la gare, la piscine, l'arrêt de bus, tourne à gauche, tourne à droite, va tout droit, "Pardon, où est ... ?"] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: places, what: { de: Orte in der Stadt verstehen und benennen, en: understanding and naming places in town } }
    - { id: what-there, what: { de: "wissen, was man an einem Ort macht", en: knowing what you do at a place } }
    - { id: directions, what: { de: "tourne à gauche, tourne à droite und va tout droit verstehen", en: "understanding tourne à gauche, tourne à droite and va tout droit" } }
    - { id: way, what: { de: einen kurzen Weg mit zwei Schritten verstehen, en: understanding a short way in two steps } }
  misconceptions:
    - id: droit-droite
      what: Hears tout droit (straight on) as à droite (right), because the two words sound almost the same
      addressed: lesson 2 Learn sets à droite against tout droit; l2-f3 gives feedback when the right arrow is tapped for va tout droit, and l2-s5, l2-n1 and l2-c2 keep both arrows among the options
    - id: librairie
      what: Expects the library to be la librairie, which is a bookshop, and does not recognise la bibliothèque
      addressed: lesson 1 Learn says a library is la bibliothèque and that la librairie is a bookshop; l1-f2 gives feedback when the shop is chosen, and l1-s2 and l1-c2 ask for the library again
    - id: left-right
      what: Mixes up gauche and droite
      addressed: lesson 2 Learn gives one arrow per screen; l2-f2 gives feedback when the left arrow is tapped for à droite, and every stage of lesson 2 asks for both
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Orte in der Stadt", en: "Places in town" }
    goal:
      de: "Lerne Orte in der Stadt auf Französisch und was man dort macht, zum Beispiel la piscine."
      en: "Learn places in town in French and what you do there, like la piscine."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "What is the question?"
            say: { en: "Listen. What is the question?" }
            audio: { fr: "Où est le bus ?" }
            options: ["Where is the bus?", "What is it?", "How old are you?"]
            answer: "Where is the bus?"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Where is the dog?"
            say: { en: "Listen. Where is the dog?" }
            audio: { turns: [{ fr: "Où est le chien ?", speaker: female }, { fr: "Il est dans le jardin.", speaker: male }] }
            options: [{ object: garden }, { object: kitchen }, { object: bedroom }]
            answer: garden
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "la librairie ?"
            say: { en: "Emma is in a French town for the first time. She sees a sign: la librairie. It looks like an English word. What do you think it is?", fr: "la librairie" }
          - text: "l'école, le parc, le magasin"
            say: { en: "It's a bookshop, not a library! You'll see why soon. These are places in town. L'école is the school, le parc is the park, and le magasin is the shop.", fr: "L'école. Le parc. Le magasin." }
            show: { objects: [school, park, shop] }
          - text: "la bibliothèque, la gare, la piscine"
            say: { en: "La bibliothèque is the library. La gare is the station, where the trains stop. La piscine is the swimming pool.", fr: "La bibliothèque. La gare. La piscine." }
            show: { objects: [library, station, swimming-pool] }
          - text: "la bibliothèque, la librairie"
            say: { en: "Careful. La librairie sounds like library, but it is a bookshop, where you buy books. The library, where you borrow books, is la bibliothèque.", fr: "La bibliothèque." }
            show: { object: library }
          - text: "l'arrêt de bus"
            say: { en: "L'arrêt de bus is the bus stop. Arrêt means stop. You wait there for the bus.", fr: "L'arrêt de bus." }
            show: { object: sign-bus-stop }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which place is it?"
                say: { en: "Listen. Which place is it?" }
                audio: { fr: "Le parc." }
                options: [{ object: park }, { object: school }, { object: shop }]
                answer: park
                hints:
                  - "Listen again: le parc."
                  - "Parc sounds almost like the English word."
                  - "Le parc is the park."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which place is it?"
                say: { en: "Listen. Which place is it?" }
                audio: { fr: "La bibliothèque." }
                options: [{ object: library }, { object: shop }, { object: station }]
                answer: library
                feedback:
                  shop: "That is le magasin. La bibliothèque is where you borrow books."
                hints:
                  - "It is a new word that does not sound like the English."
                  - "You borrow books there."
                  - "La bibliothèque is the library."
              - id: l1-f3
                type: audio_choice
                text: "Which place is it?"
                say: { en: "Listen. Which place is it?" }
                audio: { fr: "La gare." }
                options: [{ object: station }, { object: swimming-pool }, { object: park }]
                answer: station
                hints:
                  - "Listen again: la gare."
                  - "Trains stop there."
                  - "La gare is the station."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "Where can you swim?"
                say: { en: "Where can you swim? Read the answers." }
                options: ["à la piscine", "à la gare", "à l'école"]
                answer: "à la piscine"
                hints:
                  - "Which place has water to swim in?"
                  - "La piscine is the swimming pool."
                  - "À la piscine."
              - id: l1-f5
                type: speak
                text: "Say it in French: the school."
                say: { en: "Say it in French: the school.", fr: "L'école." }
                show: { object: school }
                expected_text: "l'école"
                hints:
                  - "Listen again: l'école."
                  - "Lay-coll."
                  - "Say it with me: l'école."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which place is it?"
                say: { en: "Listen. Which place is it?" }
                audio: { fr: "Le magasin." }
                options: [{ object: shop }, { object: library }, { object: school }]
                answer: shop
                hints: ["You buy things there."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Where do you borrow books?"
                say: { en: "Where do you borrow books? Read the answers." }
                options: ["à la bibliothèque", "au parc", "à l'arrêt de bus"]
                answer: "à la bibliothèque"
                hints: ["The library is la bibliothèque."]
              - id: l1-s3
                type: matching
                option_audio: false
                text: "Match the words and the pictures."
                say: { en: "Read the words. Tap a word, then its picture." }
                pairs:
                  - left: { text: "l'école" }
                    right: { object: school }
                  - left: { text: "la gare" }
                    right: { object: station }
                  - left: { text: "la piscine" }
                    right: { object: swimming-pool }
                hints: ["La gare has trains; la piscine has water."]
              - id: l1-s4
                type: audio_choice
                text: "Where is Tom?"
                say: { en: "Listen. Where is Tom?" }
                audio: { turns: [{ fr: "Où est Tom ?", speaker: female }, { fr: "Il est au parc.", speaker: male }] }
                options: [{ object: park }, { object: school }, { object: station }]
                answer: park
                hints: ["Listen to the last word."]
              - id: l1-s5
                type: speak
                text: "Say it in French: the station."
                say: { en: "Say it in French: the station.", fr: "La gare." }
                show: { object: station }
                expected_text: "la gare"
                hints: ["Say it with me: la gare."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which place is it?"
                say: { en: "Listen. Which place is it?" }
                audio: { fr: "La piscine." }
                options: [{ object: swimming-pool }, { object: park }, { object: station }]
                answer: swimming-pool
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Where do you buy bread and milk?"
                say: { en: "Where do you buy bread and milk? Read the answers." }
                options: ["au magasin", "à l'école", "à la bibliothèque"]
                answer: "au magasin"
              - id: l1-n3
                type: matching
                option_audio: false
                text: "Match the words and the pictures."
                say: { en: "Read the words. Tap a word, then its picture." }
                pairs:
                  - left: { text: "le magasin" }
                    right: { object: shop }
                  - left: { text: "la bibliothèque" }
                    right: { object: library }
                  - left: { text: "l'arrêt de bus" }
                    right: { object: sign-bus-stop }
              - id: l1-n4
                type: audio_choice
                text: "Where is Mum?"
                say: { en: "Listen. Where is Mum?" }
                audio: { turns: [{ fr: "Où est Maman ?", speaker: male }, { fr: "Elle est à la gare.", speaker: female }] }
                options: [{ object: station }, { object: shop }, { object: library }]
                answer: station
              - id: l1-n5
                type: true_false
                text: "On lit des livres à la bibliothèque.\nOn lit des livres means you read books. Is it true?"
                say: { en: "Read the sentence. On lit des livres means you read books. Is it true?" }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which place is it?"
            say: { en: "Listen. Which place is it?" }
            audio: { fr: "L'arrêt de bus." }
            options: [{ object: sign-bus-stop }, { object: shop }, { object: station }]
            answer: sign-bus-stop
          - id: l1-c2
            type: audio_choice
            text: "Which place is it?"
            say: { en: "Listen. Which place is it?" }
            audio: { fr: "La bibliothèque." }
            options: [{ object: school }, { object: library }, { object: swimming-pool }]
            answer: library
          - id: l1-c3
            type: true_false
            text: "On nage à la gare.\nOn nage means you swim. Is it true?"
            say: { en: "Read the sentence. On nage means you swim. Is it true?" }
            answer: false
          - id: l1-c4
            type: multiple_choice
            option_audio: false
            text: "What is this place in French?"
            say: { en: "What is this place in French? Read the answers." }
            show: { object: park }
            options: ["la gare", "le parc", "le magasin"]
            answer: "le parc"
          - id: l1-c5
            type: audio_choice
            text: "Where is Léo?"
            say: { en: "Listen. Where is Léo?" }
            audio: { turns: [{ fr: "Où est Léo ?", speaker: female }, { fr: "Il est au magasin.", speaker: male }] }
            options: [{ object: park }, { object: shop }, { object: school }]
            answer: shop
          - id: l1-c6
            type: true_false
            text: "On attend le bus à l'arrêt de bus.\nOn attend le bus means you wait for the bus. Is it true?"
            say: { en: "Read the sentence. On attend le bus means you wait for the bus. Is it true?" }
            answer: true

  - n: 2
    title: { de: "Nach dem Weg fragen", en: "Asking the way" }
    goal:
      de: "Hör, wie man den Weg erklärt, und folge den Schritten, so wie tourne à gauche."
      en: "Listen to how someone gives directions and follow the steps, like tourne à gauche."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which place is it?"
            say: { en: "Listen. Which place is it?" }
            audio: { fr: "L'école." }
            options: [{ object: school }, { object: shop }, { object: park }]
            answer: school
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Where do you wait for the bus?"
            say: { en: "Where do you wait for the bus? Read the answers." }
            options: ["à l'arrêt de bus", "au magasin", "à la piscine"]
            answer: "à l'arrêt de bus"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Tourne à gauche."
            say: { en: "Emma is lost and asks the way. Listen to the answer. Do you think she has to turn left or right?", fr: "Tourne à gauche." }
          - text: "Tourne à gauche. ←"
            say: { en: "Left! This is how you give directions. Tourne à gauche means turn left.", fr: "Tourne à gauche." }
          - text: "Tourne à droite. →"
            say: { en: "Tourne à droite means turn right.", fr: "Tourne à droite." }
          - text: "Va tout droit. ↑\nTourne à droite. →"
            say: { en: "Va tout droit means go straight on. Listen closely: tout droit, straight on, sounds almost like à droite, right. Listen for tout.", fr: "Va tout droit. Tourne à droite." }
          - text: "Did you know? In France, cars drive on the right: à droite. In the UK, they drive on the left."
            say: { en: "Did you know? In France, cars drive on the right side of the road, à droite. In the UK, they drive on the left, à gauche. So in France, look left first when you cross the road!", fr: "à droite, à gauche" }
            show: { object: car }
          - text: "Pardon, où est le parc ?\nVa tout droit, puis tourne à gauche."
            say: { en: "To ask the way, say Pardon, où est ... ? Then listen for the steps.", fr: "Pardon, où est le parc ? Va tout droit, puis tourne à gauche." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Emma asks the way. Which arrow fits?"
                say: { en: "Emma asks the way. Listen. Which arrow fits?" }
                audio: { fr: "Tourne à gauche." }
                options: ["←", "→", "↑"]
                answer: "←"
                hints:
                  - "Listen for gauche or droite."
                  - "It was gauche."
                  - "Gauche is left. Tap the left arrow."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which arrow fits?"
                say: { en: "Listen. Which arrow fits?" }
                audio: { fr: "Tourne à droite." }
                options: ["→", "←", "↑"]
                answer: "→"
                feedback:
                  "←": "That is à gauche, left. À droite is right."
                hints:
                  - "Listen closely: gauche or droite?"
                  - "It was droite."
                  - "Droite is right. Tap the right arrow."
              - id: l2-f5
                type: speak
                text: "Say it in French: turn right."
                say: { en: "Say it in French: turn right.", fr: "Tourne à droite." }
                expected_text: "Tourne à droite."
                hints:
                  - "Turn is tourne."
                  - "Right is à droite."
                  - "Say it with me: tourne à droite."
              - id: l2-f3
                type: audio_choice
                text: "Which arrow fits?"
                say: { en: "Listen. Which arrow fits?" }
                audio: { fr: "Va tout droit." }
                options: ["↑", "→", "←"]
                answer: "↑"
                feedback:
                  "→": "You heard tout droit, with tout. That means straight on. Right is à droite."
                hints:
                  - "Did you hear tout before droit?"
                  - "Tout droit is not à droite. You do not turn."
                  - "Tout droit is straight on. Tap the arrow pointing up."
              - id: l2-f4
                type: audio_choice
                text: "How does Emma get to the library?"
                say: { en: "Listen. How does Emma get to the library?" }
                audio: { turns: [{ fr: "Pardon, où est la bibliothèque ?", speaker: female }, { fr: "Va tout droit, puis tourne à gauche.", speaker: male }] }
                options: ["straight on, then left", "straight on, then right", "left, then straight on"]
                answer: "straight on, then left"
                hints:
                  - "There are two steps. Puis means then."
                  - "First va tout droit, then tourne à gauche."
                  - "Straight on, then left."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Where does Emma turn left?"
                say: { en: "Listen. Where does Emma turn left?" }
                audio: { fr: "Va tout droit et tourne à gauche au parc." }
                options: [{ object: park }, { object: school }, { object: station }]
                answer: park
                hints: ["Listen to the end: au ..."]
              - id: l2-s2
                type: multiple_choice
                option_audio: false
                text: "→\nWhat do you say for this arrow?"
                say: { en: "What do you say for this arrow?" }
                options: ["Tourne à droite.", "Tourne à gauche.", "Va tout droit."]
                answer: "Tourne à droite."
                hints: ["The arrow points right."]
              - id: l2-s3
                type: audio_choice
                text: "How does Emma get to the station?"
                say: { en: "Listen. How does Emma get to the station?" }
                audio: { fr: "La gare ? Tourne à droite, puis va tout droit." }
                options: ["right, then straight on", "left, then straight on", "straight on, then right"]
                answer: "right, then straight on"
                hints: ["Which comes first, tourne à droite or va tout droit?"]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Build the way: go straight on, then turn left."
                say: { en: "Build the way: go straight on, then turn left." }
                options: ["puis", "tourne à gauche.", "Va tout droit,"]
                slot_count: 3
                answer: ["Va tout droit,", "puis", "tourne à gauche."]
                hints: ["First you go straight on."]
              - id: l2-s5
                type: true_false
                text: "→\nDoes the arrow match what you hear?"
                say: { en: "Listen. Does the arrow match?", fr: "Va tout droit." }
                answer: false
                hints: ["Listen for tout: tout droit is straight on."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which arrow fits?"
                say: { en: "Listen. Which arrow fits?" }
                audio: { fr: "Tourne à droite à l'arrêt de bus." }
                options: ["↑", "→", "←"]
                answer: "→"
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "←\nWhat do you say for this arrow?"
                say: { en: "What do you say for this arrow?" }
                options: ["Tourne à gauche.", "Tourne à droite.", "Va tout droit."]
                answer: "Tourne à gauche."
              - id: l2-n3
                type: audio_choice
                text: "How does Ben get to the swimming pool?"
                say: { en: "Listen. How does Ben get to the swimming pool?" }
                audio: { turns: [{ fr: "Où est la piscine ?", speaker: male }, { fr: "Tourne à gauche, puis tourne à droite.", speaker: female }] }
                options: ["left, then right", "right, then left", "straight on, then right"]
                answer: "left, then right"
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Build the way: turn right, then go straight on."
                say: { en: "Build the way: turn right, then go straight on." }
                options: ["va tout droit.", "puis", "Tourne à droite,"]
                slot_count: 3
                answer: ["Tourne à droite,", "puis", "va tout droit."]
              - id: l2-n5
                type: true_false
                text: "←\nDoes the arrow match what you hear?"
                say: { en: "Listen. Does the arrow match?", fr: "Tourne à gauche." }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: directions
            type: audio_choice
            text: "How does Mia get to the shop?"
            say: { en: "Listen. How does Mia get to the shop?" }
            audio: { turns: [{ fr: "Pardon, où est le magasin ?", speaker: female }, { fr: "Tourne à gauche.", speaker: male }] }
            options: ["left", "right", "straight on"]
            answer: "left"
          - id: l2-c2
            part: directions
            type: multiple_choice
            option_audio: false
            text: "↑\nWhat do you say for this arrow?"
            say: { en: "What do you say for this arrow?" }
            options: ["Va tout droit.", "Tourne à droite.", "Tourne à gauche."]
            answer: "Va tout droit."
          - id: l2-c3
            part: way
            type: audio_choice
            text: "How does Tom get to the school?"
            say: { en: "Listen. How does Tom get to the school?" }
            audio: { turns: [{ fr: "Pardon, où est l'école ?", speaker: male }, { fr: "Va tout droit, puis tourne à droite.", speaker: female }] }
            options: ["straight on, then right", "straight on, then left", "right, then straight on"]
            answer: "straight on, then right"
          - id: l2-c4
            part: places
            type: audio_choice
            text: "Where is Mia?"
            say: { en: "Listen. Where is Mia?" }
            audio: { turns: [{ fr: "Où est Mia ?", speaker: male }, { fr: "Elle est à la piscine.", speaker: female }] }
            options: [{ object: swimming-pool }, { object: library }, { object: station }]
            answer: swimming-pool
          - id: l2-c5
            part: directions
            type: true_false
            text: "↑\nDoes the arrow match what you hear?"
            say: { en: "Listen. Does the arrow match?", fr: "Tourne à droite." }
            answer: false
          - id: l2-c6
            part: places
            type: multiple_choice
            option_audio: false
            text: "What is this place in French?"
            say: { en: "What is this place in French? Read the answers." }
            show: { object: station }
            options: ["la piscine", "le magasin", "la gare"]
            answer: "la gare"
          - id: l2-c7
            part: places
            type: multiple_choice
            option_audio: false
            text: "What is this place in French?"
            say: { en: "What is this place in French? Read the answers." }
            show: { object: library }
            options: ["la librairie", "la bibliothèque", "l'école"]
            answer: "la bibliothèque"
          - id: l2-c8
            part: places
            type: audio_choice
            text: "Where does Hugo want to go?"
            say: { en: "Listen. Where does Hugo want to go?" }
            audio: { turns: [{ fr: "Pardon, où est la bibliothèque ?", speaker: male }, { fr: "Va tout droit.", speaker: female }] }
            options: [{ object: school }, { object: shop }, { object: library }]
            answer: library
          - id: l2-c9
            part: places
            type: matching
            option_audio: false
            text: "Which picture goes with each place?"
            say: { en: "Read each place. Tap it, then its picture." }
            pairs:
              - left: { text: "le parc" }
                right: { object: park }
              - left: { text: "l'arrêt de bus" }
                right: { object: sign-bus-stop }
              - left: { text: "l'école" }
                right: { object: school }
              - left: { text: "la piscine" }
