# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-plurals-articles
skill: fl.grammar.plurals-articles
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Mehrzahl und Artikel (Französisch)
  en: Plurals and articles in French
summary: >
  French nouns with their little words. Lesson 1 learns that every noun
  takes un or une, that the plural s is written but not heard (un chat,
  deux chats), and that des means more than one; lesson 2 brings le, la,
  l' before a vowel, and les for every plural, and ends with the skill
  check. Instructions are in English; the French is heard and shown in
  short form.
metadata:
  year: ly-2
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks, fl.themes.numbers-to-10]
  also_practises: [fl.themes.numbers-to-10]
  vocabulary: { fr: [un, une, des, le, la, "l'", les, chat, chien, lapin, pomme, banane, fraise, voiture, orange, arbre, éléphant, abeille] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: hear, what: { de: "hören, ob es eins oder mehrere sind", en: hearing whether it is one or more than one } }
    - { id: plural, what: { de: die Mehrzahl mit s schreiben, en: writing the plural with s } }
    - { id: un-une, what: { de: un oder une wählen, en: choosing un or une } }
    - { id: the, what: { de: "le, la, l' oder les wählen", en: "choosing le, la, l' or les" } }
  misconceptions:
    - id: silent-s
      what: Leaves the plural s off in writing (deux chat) because it is not heard, or listens for an s to tell one from many
      addressed: lesson 1 Learn says the s is written but not said; l1-f2 gives feedback on deux chien, l1-f4 and l1-n4 ask whether the s is heard, and l2-f3 gives feedback when the child listens for the s instead of the little word
    - id: one-article
      what: Uses un and le for every noun, as English uses a and the for every noun
      addressed: lesson 1 Learn says to learn each noun with its little word; an un-or-une task in every stage of lesson 1 and the skill check, and the matching task l2-f4 pairs un with le and une with la
    - id: no-elision
      what: Writes la orange or le arbre before a vowel
      addressed: lesson 2 Learn shows l'orange, l'arbre and l'éléphant; l2-f1 gives feedback on la orange, and l2-s1, l2-n1, l2-n4 and l2-c3 ask for l' or test la éléphant
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "un, une, des", en: "un, une, des" }
    goal:
      de: "Lerne jedes Wort mit un oder une und sag des, wenn es mehr als eins ist, so wie des chats."
      en: "Learn each word with un or une, and say des for more than one, like des chats."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which number do you hear?"
            say: { en: "Listen. Which number do you hear?" }
            audio: { fr: "trois" }
            options: ["2", "3", "8"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "What does the child want?"
            say: { en: "Listen. What does the child want?" }
            audio: { fr: "Je voudrais une banane, s'il te plaît.", speaker: female }
            options: [{ object: banana }, { object: apple }, { object: bread }]
            answer: banana
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "un pomme or une pomme?"
            say: { en: "In English we say a cat and an apple. In French, a cat is un chat. What do you think: is an apple un pomme, or une pomme?" }
            show: { objects: [cat, apple] }
          - text: "un chat, une pomme"
            say: { en: "Une pomme! In French, every noun has a little word in front. Some nouns take un, some take une. Un chat, a cat. Une pomme, an apple. Learn each noun with its little word.", fr: "un chat, une pomme" }
            show: { objects: [cat, apple] }
          - text: "un chat, deux chats"
            say: { en: "For more than one, write an s on the end. But you do not hear it! Chat and chats sound the same.", fr: "un chat, deux chats" }
            show: { object: cat, count: 2, layout: row }
          - text: "des chats, des pommes"
            say: { en: "Des means some, or more than one. It is the same for un nouns and une nouns: des chats, des pommes.", fr: "des chats, des pommes" }
          - text: "un vélo, un ballon, un crayon\nune voiture, une fleur, une maison, une fraise"
            say: { en: "Here are more nouns with their little word. Say them with un or une, so you remember which one goes with each noun.", fr: "un vélo, un ballon, un crayon. Une voiture, une fleur, une maison, une fraise." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "One cat, or more than one?"
                say: { en: "Listen. One cat, or more than one?" }
                audio: { fr: "des chats" }
                options: [{ object: cat }, { object: cat, count: 3, layout: row }]
                answer: "3"
                feedback:
                  cat: "You heard des, not un. Des means more than one."
                hints:
                  - "Listen to the little word at the start."
                  - "Un means one. Des means more than one."
                  - "Des chats: more than one cat."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Which word fits? deux _"
                say: { en: "Two dogs. Which word fits?" }
                show: { object: dog, count: 2, layout: row }
                options: ["chiens", "chien", "un chien"]
                answer: "chiens"
                feedback:
                  "chien": "There are two dogs, so write the s, even though you do not hear it."
                hints:
                  - "How many dogs are there?"
                  - "More than one: add an s on the end."
                  - "deux chiens"
              - id: l1-f3
                type: multiple_choice
                option_audio: false
                keep_order: true
                text: "Un or une? _ pomme"
                say: { en: "An apple. Un or une?" }
                show: { object: apple }
                options: ["un", "une"]
                answer: "une"
                hints:
                  - "Pomme is one of the une nouns."
                  - "Many nouns that end in e take une, like banane."
                  - "une pomme"
              - id: l1-f4
                type: true_false
                text: "Do you hear an s at the end of “deux lapins”?"
                say: { en: "Listen. Do you hear an s at the end of lapins?", fr: "deux lapins" }
                answer: false
                hints:
                  - "Listen again: deux lapins."
                  - "Lapin and lapins sound the same."
                  - "No. The s is written but not said."
              - id: l1-f5
                type: speak
                text: "Say it in French: two cats."
                say: { en: "Say it in French: two cats.", fr: "deux chats" }
                show: { object: cat, count: 2, layout: row }
                expected_text: "deux chats"
                hints:
                  - "Start with the number: deux."
                  - "Then chats. You do not say the s."
                  - "Say it with me: deux chats."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "One fish, or more than one?"
                say: { en: "Listen. One fish, or more than one?" }
                audio: { fr: "un poisson" }
                options: [{ object: fish, count: 4, layout: row }, { object: fish }]
                answer: fish
                hints: ["Un means one."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                keep_order: true
                text: "Un or une? _ voiture"
                say: { en: "A car. Un or une?" }
                show: { object: car }
                options: ["un", "une"]
                answer: "une"
                hints: ["Voiture is an une noun."]
              - id: l1-s3
                type: multiple_choice
                option_audio: false
                text: "Which word fits? trois _"
                say: { en: "Three balls. Which word fits?" }
                show: { object: ball, count: 3, layout: row }
                options: ["ballons", "ballon", "un ballon"]
                answer: "ballons"
                hints: ["More than one: add an s."]
              - id: l1-s4
                type: true_false
                text: "“des fraises” means more than one strawberry."
                say: { en: "Read it. Is that right?" }
                answer: true
                hints: ["Des means more than one."]
              - id: l1-s5
                type: audio_choice
                text: "Which picture matches?"
                say: { en: "Listen. Which picture matches?" }
                audio: { fr: "deux lapins" }
                options: [{ object: rabbit }, { object: rabbit, count: 2, layout: row }, { object: rabbit, count: 5, layout: row }]
                answer: "2"
                hints: ["Deux is two. You will not hear the s."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "One banana, or more than one?"
                say: { en: "Listen. One banana, or more than one?" }
                audio: { fr: "des bananes" }
                options: [{ object: banana }, { object: banana, count: 3, layout: row }]
                answer: "3"
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                keep_order: true
                text: "Un or une? _ vélo"
                say: { en: "A bike. Un or une?" }
                show: { object: bike }
                options: ["un", "une"]
                answer: "un"
              - id: l1-n3
                type: multiple_choice
                option_audio: false
                text: "Which word fits? cinq _"
                say: { en: "Five pencils. Which word fits?" }
                show: { object: pencil, count: 5, layout: row }
                options: ["crayons", "crayon", "un crayon"]
                answer: "crayons"
              - id: l1-n4
                type: true_false
                text: "Do you hear an s at the end of “trois chiens”?"
                say: { en: "Listen. Do you hear an s at the end of chiens?", fr: "trois chiens" }
                answer: false
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                keep_order: true
                text: "Un or une? _ fleur"
                say: { en: "A flower. Un or une?" }
                show: { object: flower }
                options: ["un", "une"]
                answer: "une"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "One ball, or more than one?"
            say: { en: "Listen. One ball, or more than one?" }
            audio: { fr: "un ballon" }
            options: [{ object: ball }, { object: ball, count: 3, layout: row }]
            answer: ball
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            keep_order: true
            text: "Un or une? _ maison"
            say: { en: "A house. Un or une?" }
            show: { object: house }
            options: ["un", "une"]
            answer: "une"
          - id: l1-c3
            type: multiple_choice
            option_audio: false
            text: "Which word fits? deux _"
            say: { en: "Two cats. Which word fits?" }
            show: { object: cat, count: 2, layout: row }
            options: ["chats", "chat", "un chat"]
            answer: "chats"
          - id: l1-c4
            type: audio_choice
            text: "One flower, or more than one?"
            say: { en: "Listen. One flower, or more than one?" }
            audio: { fr: "des fleurs" }
            options: [{ object: flower }, { object: flower, count: 3, layout: row }]
            answer: "3"
          - id: l1-c5
            type: true_false
            text: "“un crayon” means more than one pencil."
            say: { en: "Read it. Is that right?" }
            answer: false
          - id: l1-c6
            type: text_input
            keyboard: letters
            text: "Four cars. Write the missing word: quatre _"
            say: { en: "Four cars. Write the missing word." }
            show: { object: car, count: 4, layout: row }
            answer: "voitures"

  - n: 2
    title: { de: "le, la, l', les", en: "le, la, l', les" }
    goal:
      de: "Such das richtige Wort für der, die oder das auf Französisch, zum Beispiel le chien oder les chiens."
      en: "Pick the right French word for the, like le chien or les chiens."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            keep_order: true
            text: "Un or une? _ chat"
            say: { en: "A cat. Un or une?" }
            show: { object: cat }
            options: ["un", "une"]
            answer: "un"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "One apple, or more than one?"
            say: { en: "Listen. One apple, or more than one?" }
            audio: { fr: "des pommes" }
            options: [{ object: apple }, { object: apple, count: 4, layout: row }]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "the dog, the apple"
            say: { en: "In English we say the dog and the apple. What do you think: does French use the same word for the both times?" }
            show: { objects: [dog, apple] }
          - text: "le chien, la pomme"
            say: { en: "No! French has two words for the, as well. Un nouns take le: le chien. Une nouns take la: la pomme.", fr: "le chien, la pomme" }
            show: { objects: [dog, apple] }
          - text: "l'orange, l'arbre, l'éléphant"
            say: { en: "Before a, e, i, o or u, le and la drop their vowel and join on: l'orange, l'arbre, l'éléphant.", fr: "l'orange, l'arbre, l'éléphant" }
          - text: "le chien, les chiens"
            say: { en: "For more than one it is always les: les chiens, les pommes. Chien and chiens sound the same, so listen to the little word. Le is one, les is more than one.", fr: "le chien, les chiens" }
          - text: "Did you know? Le tour and la tour mean different things.\nle Tour de France: a bike race\nla tour Eiffel: a tower"
            say: { en: "Did you know? A few French words change their meaning with le or la. Le tour is a trip round, like le Tour de France, a famous bike race. La tour is a tower, like la tour Eiffel. So the little word really matters!", fr: "le Tour de France, la tour Eiffel" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Which little word fits? _ orange"
                say: { en: "The orange. Which little word fits?" }
                show: { object: orange }
                options: ["l'", "la", "le"]
                answer: "l'"
                feedback:
                  "la": "Orange starts with o, so la drops its a: l'orange."
                hints:
                  - "Look at the first letter of orange."
                  - "Before a, e, i, o or u we write l'."
                  - "l'orange"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                option_audio: false
                text: "Which little word fits? _ chats"
                say: { en: "The cats. Which little word fits?" }
                show: { object: cat, count: 3, layout: row }
                options: ["les", "le", "la"]
                answer: "les"
                hints:
                  - "How many cats are there?"
                  - "More than one always takes les."
                  - "les chats"
              - id: l2-f3
                type: audio_choice
                text: "One dog, or more than one?"
                say: { en: "Listen. One dog, or more than one?" }
                audio: { fr: "les chiens" }
                options: [{ object: dog }, { object: dog, count: 3, layout: row }]
                answer: "3"
                feedback:
                  dog: "Chien and chiens sound the same. Listen to the little word: les, so more than one."
                hints:
                  - "Chiens sounds the same either way, so listen to the little word."
                  - "Le is one, les is more than one."
                  - "Les chiens: more than one dog."
              - id: l2-f4
                type: matching
                option_audio: false
                text: "Match each noun with its word for the."
                say: { en: "Tap a noun, then the same noun with le, la or l'." }
                pairs:
                  - left: { text: "un chien" }
                    right: { text: "le chien" }
                  - left: { text: "une banane" }
                    right: { text: "la banane" }
                  - left: { text: "un éléphant" }
                    right: { text: "l'éléphant" }
                hints:
                  - "Un nouns take le, une nouns take la."
                  - "Éléphant starts with é, so it takes l'."
                  - "un chien, le chien. Une banane, la banane. Un éléphant, l'éléphant."
              - id: l2-f5
                type: fill_in_blank
                option_audio: false
                text: "I like strawberries. Finish the sentence."
                say: { en: "I like strawberries. Finish the sentence." }
                show: { object: strawberry, count: 3, layout: row }
                frame: "J'aime _ fraises."
                options: ["les", "la", "le"]
                answer: ["les"]
                hints:
                  - "Fraises ends in s: more than one."
                  - "More than one takes les."
                  - "J'aime les fraises."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Which little word fits? _ arbre"
                say: { en: "The tree. Which little word fits?" }
                show: { object: tree }
                options: ["l'", "le", "la"]
                answer: "l'"
                hints: ["Arbre starts with a."]
              - id: l2-s2
                type: multiple_choice
                option_audio: false
                text: "Which little word fits? _ voiture"
                say: { en: "The car. Which little word fits?" }
                show: { object: car }
                options: ["la", "le", "les"]
                answer: "la"
                hints: ["Une voiture, so the car is ... voiture."]
              - id: l2-s3
                type: audio_choice
                text: "One rabbit, or more than one?"
                say: { en: "Listen. One rabbit, or more than one?" }
                audio: { fr: "le lapin" }
                options: [{ object: rabbit }, { object: rabbit, count: 3, layout: row }]
                answer: rabbit
                hints: ["Le means one."]
              - id: l2-s4
                type: true_false
                text: "Les is for more than one, with un nouns and with une nouns."
                say: { en: "Read it. Is that right?" }
                answer: true
                hints: ["Think of les chiens and les pommes."]
              - id: l2-s5
                type: multiple_choice
                option_audio: false
                text: "Which little word fits? _ pommes"
                say: { en: "The apples. Which little word fits?" }
                show: { object: apple, count: 4, layout: row }
                options: ["les", "la", "l'"]
                answer: "les"
                hints: ["How many apples are there?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                option_audio: false
                text: "Which little word fits? _ abeille"
                say: { en: "The bee. Which little word fits?" }
                show: { object: bee }
                options: ["l'", "la", "le"]
                answer: "l'"
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "Which little word fits? _ ballon"
                say: { en: "The ball. Which little word fits?" }
                show: { object: ball }
                options: ["le", "la", "les"]
                answer: "le"
              - id: l2-n3
                type: audio_choice
                text: "One flower, or more than one?"
                say: { en: "Listen. One flower, or more than one?" }
                audio: { fr: "les fleurs" }
                options: [{ object: flower }, { object: flower, count: 4, layout: row }]
                answer: "4"
              - id: l2-n4
                type: true_false
                text: "Is this written correctly? la éléphant"
                say: { en: "Read it. Is it written correctly?" }
                answer: false
              - id: l2-n5
                type: fill_in_blank
                option_audio: false
                text: "Ask for a banana. Finish the sentence."
                say: { en: "Ask for a banana. Finish the sentence." }
                show: { object: banana }
                frame: "Je voudrais _ banane, s'il te plaît."
                options: ["une", "un", "des"]
                answer: ["une"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: plural
            type: multiple_choice
            option_audio: false
            text: "Which word fits? quatre _"
            say: { en: "Four rabbits. Which word fits?" }
            show: { object: rabbit, count: 4, layout: row }
            options: ["lapins", "lapin", "un lapin"]
            answer: "lapins"
          - id: l2-c2
            part: un-une
            type: multiple_choice
            option_audio: false
            keep_order: true
            text: "Un or une? _ fraise"
            say: { en: "A strawberry. Un or une?" }
            show: { object: strawberry }
            options: ["un", "une"]
            answer: "une"
          - id: l2-c3
            part: the
            type: multiple_choice
            option_audio: false
            text: "Which little word fits? _ escargot"
            say: { en: "The snail. Which little word fits?" }
            show: { object: snail }
            options: ["l'", "le", "la"]
            answer: "l'"
          - id: l2-c4
            part: hear
            type: audio_choice
            text: "One fish, or more than one?"
            say: { en: "Listen. One fish, or more than one?" }
            audio: { fr: "les poissons" }
            options: [{ object: fish }, { object: fish, count: 3, layout: row }]
            answer: "3"
          - id: l2-c5
            part: the
            type: multiple_choice
            option_audio: false
            text: "Which little word fits? _ chaises"
            say: { en: "The chairs. Which little word fits?" }
            show: { object: chair, count: 2, layout: row }
            options: ["les", "la", "le"]
            answer: "les"
          - id: l2-c11
            part: plural
            type: multiple_choice
            option_audio: false
            text: "How do you write it in French? three dogs"
            say: { en: "How do you write it in French? Three dogs." }
            options: ["trois chien", "trois chiens", "un chiens"]
            answer: "trois chiens"
          - id: l2-c6
            part: hear
            type: audio_choice
            text: "Which picture matches?"
            say: { en: "Listen. Which picture matches?" }
            audio: { fr: "un chien" }
            options: [{ object: dog, count: 3, layout: row }, { object: dog }]
            answer: dog
          - id: l2-c12
            part: plural
            type: multiple_choice
            option_audio: false
            text: "Which one means more than one rabbit?"
            say: { en: "Which one means more than one rabbit?" }
            options: ["un lapin", "le lapin", "des lapins"]
            answer: "des lapins"
          - id: l2-c14
            part: un-une
            type: multiple_choice
            option_audio: false
            text: "Which noun takes une?"
            say: { en: "Which noun takes une?" }
            options: ["chat", "maison", "crayon"]
            answer: "maison"
          - id: l2-c7
            part: hear
            type: audio_choice
            text: "Which picture matches?"
            say: { en: "Listen. Which picture matches?" }
            audio: { fr: "des voitures" }
            options: [{ object: car }, { object: car, count: 3, layout: row }]
            answer: "3"
          - id: l2-c15
            part: un-une
            type: multiple_choice
            option_audio: false
            text: "Which noun takes un?"
            say: { en: "Which noun takes un?" }
            options: ["pomme", "fraise", "ballon"]
            answer: "ballon"
          - id: l2-c17
            part: un-une
            type: multiple_choice
            option_audio: false
            text: "Which one is right?"
            say: { en: "A rabbit. Which one is right?" }
            show: { object: rabbit }
            options: ["une lapin", "un lapin"]
            answer: "un lapin"
          - id: l2-c9
            part: hear
            type: true_false
            text: "Is it more than one banana?"
            say: { en: "Listen. Is it more than one banana?", fr: "les bananes" }
            answer: true
          - id: l2-c18
            part: the
            type: multiple_choice
            option_audio: false
