# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-calendar
skill: fl.themes.calendar
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Tage, Monate, Geburtstag (Französisch)
  en: Days, months and birthdays in French
summary: >
  Lesson 1 brings the days of the week in French, in order, with On est
  quel jour aujourd'hui ? On est lundi., the weekend, the two m-days that
  are easy to mix up (mardi and mercredi), and the small first letter
  French uses for days and months. Lesson 2 brings the twelve months, the
  four seasons and C'est quand, ton anniversaire ? Mon anniversaire, c'est
  le cinq mai., and ends with the skill check. Instructions are in English;
  the French is heard and shown, and a table shows the days and months in
  order. Writing a day or month from memory is typed.
metadata:
  year: ly-2
  topic: { de: Kalender, en: Calendar }
  ages: [8-10]
  lesson_minutes: 11
  builds_on: [fl.themes.numbers-to-20]
  also_practises: [fl.speaking.imitate, fl.writing.words-from-memory]
  vocabulary: { fr: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche, le week-end, "On est quel jour aujourd'hui ?", "On est lundi.", janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre, le printemps, "l'été", "l'automne", "l'hiver", "C'est quand, ton anniversaire ?", "Mon anniversaire, c'est le cinq mai."] }
  forms: [audio, text, picture, drawn]
  drawn: [table]
  facets: []
  parts:
    - { id: days, what: { de: die Wochentage, en: the days of the week } }
    - { id: months, what: { de: die Monate, en: the months } }
    - { id: seasons, what: { de: die Jahreszeiten, en: the seasons } }
    - { id: birthday, what: { de: "sagen, wann ein Geburtstag ist", en: saying when a birthday is } }
  misconceptions:
    - id: capital-letters
      what: Writes days and months with a capital letter, as in English (Lundi, Mai)
      addressed: lesson 1 Learn says French days and months start with a small letter; l1-f4 gives feedback on Lundi, l2-s4 asks again, and the typed tasks l1-n3, l2-n4 and l2-c4 check the small letter
    - id: mardi-mercredi
      what: Mixes up mardi and mercredi, which both start with m
      addressed: lesson 1 Learn says mercredi is the longer word, like Wednesday; l1-f3 gives feedback on Tuesday, and l1-s1, l1-c3 and l2-c4 set the two apart
    - id: juin-juillet
      what: Mixes up juin and juillet, which sound alike
      addressed: lesson 2 Learn says juin is short and juillet has two parts; l2-f1 gives feedback on June, and l2-s1, l2-n3 and l2-c3 set the two against each other
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die Wochentage", en: "Days of the week" }
    goal:
      de: "Lern die Wochentage auf Französisch und sag, welcher Tag heute ist, so wie on est lundi."
      en: "Learn the days of the week in French and say what day it is, like on est lundi."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which number is it?"
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Douze." }
            options: ["12", "2", "10"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which number is it?"
            say: { en: "Listen. Which number is it?" }
            audio: { fr: "Quinze." }
            options: ["15", "5", "14"]
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "lundi, mardi or jeudi?"
            say: { en: "Monday is named after the moon. In French, the moon is la lune. Guess: which French day is Monday? Lundi, mardi or jeudi?", fr: "Lundi, mardi, jeudi." }
            show: { object: moon }
          - text: "lundi, mardi, mercredi, jeudi, vendredi"
            say: { en: "Lundi! You can hear la lune in it. Here are the school days in French. Lundi is Monday, mardi Tuesday, mercredi Wednesday, jeudi Thursday, vendredi Friday.", fr: "Lundi, mardi, mercredi, jeudi, vendredi." }
            show: { drawn: table, rows: [[lundi, mardi, mercredi, jeudi, vendredi]], header: false }
          - text: "samedi, dimanche: le week-end"
            say: { en: "Samedi is Saturday and dimanche is Sunday. Together they are le week-end.", fr: "Samedi, dimanche. Le week-end." }
          - text: "mardi, mercredi"
            say: { en: "Mardi and mercredi both start with m. Mardi is Tuesday. Mercredi is the longer word, like Wednesday.", fr: "Mardi. Mercredi." }
          - text: "Did you know? Mardi is named after the planet Mars, mercredi after Mercury, jeudi after Jupiter and vendredi after Venus."
            say: { en: "Did you know? The ancient Romans named days after the moon and the planets, and French still uses those names. Lundi is the moon's day. Mardi is named after Mars, mercredi after Mercury, jeudi after Jupiter and vendredi after Venus. Look at the night sky, and you can see some of the days of the week!", fr: "Lundi, mardi, mercredi, jeudi, vendredi." }
          - text: "On est quel jour aujourd'hui ?\nOn est lundi."
            say: { en: "To ask what day it is, say on est quel jour aujourd'hui? The answer: on est lundi. In French, days start with a small letter: lundi, not Lundi.", fr: "On est quel jour aujourd'hui ? On est lundi." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which day is it?"
                say: { en: "Listen. Which day is it?" }
                audio: { fr: "Lundi." }
                options: ["Monday", "Tuesday", "Friday"]
                answer: "Monday"
                hints:
                  - "Listen again: lundi."
                  - "Lundi is the first day of the school week."
                  - "Lundi is Monday."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which day is missing?"
                say: { en: "Which day is missing?" }
                show: { drawn: table, rows: [[lundi, mardi, "?", jeudi]], header: false }
                options: ["mercredi", "vendredi", "dimanche"]
                answer: "mercredi"
                option_audio: false
                feedback:
                  "dimanche": "Sunday in the middle of the week? That would be nice! But after mardi comes mercredi."
                hints:
                  - "Say the days in English: Monday, Tuesday, ..."
                  - "After Tuesday comes Wednesday."
                  - "Wednesday is mercredi."
              - id: l1-f3
                type: audio_choice
                text: "Which day is it?"
                say: { en: "Listen. Which day is it?" }
                audio: { fr: "Mercredi." }
                options: ["Wednesday", "Tuesday", "Thursday"]
                answer: "Wednesday"
                feedback:
                  "Tuesday": "Tuesday is mardi, the short m-day. Mercredi is the long one: Wednesday."
                hints:
                  - "Is it the short m-day or the long one?"
                  - "Mercredi is the long one."
                  - "Mercredi is Wednesday."
              - id: l1-f4
                type: multiple_choice
                text: "Which is written the French way?"
                say: { en: "Which word is written the French way?" }
                options: ["lundi", "Lundi", "Lundy"]
                answer: "lundi"
                option_audio: false
                feedback:
                  "Lundi": "In English, Monday has a capital M. In French, days start with a small letter: lundi."
                hints:
                  - "Look at the first letter."
                  - "French days start with a small letter."
                  - "lundi"
              - id: l1-f5
                type: speak
                text: "lundi, mardi, mercredi, jeudi, vendredi"
                say: { en: "Say the days from Monday to Friday.", fr: "Lundi, mardi, mercredi, jeudi, vendredi." }
                expected_text: "Lundi, mardi, mercredi, jeudi, vendredi."
                hints:
                  - "Start with lundi."
                  - "Most days end in di."
                  - "Say it with me: lundi, mardi, mercredi, jeudi, vendredi."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which day is it?"
                say: { en: "Listen. Which day is it?" }
                audio: { fr: "Mardi." }
                options: ["Tuesday", "Wednesday", "Thursday"]
                answer: "Tuesday"
                hints: ["Mardi is the short m-day."]
              - id: l1-s2
                type: multiple_choice
                text: "Which day is missing?"
                say: { en: "Which day is missing?" }
                show: { drawn: table, rows: [[vendredi, "?", dimanche]], header: false }
                options: ["samedi", "lundi", "jeudi"]
                answer: "samedi"
                option_audio: false
                hints: ["Between Friday and Sunday comes Saturday."]
              - id: l1-s3
                type: speak
                text: "Today is Friday."
                say: { en: "Today is Friday. Say it in French.", fr: "On est vendredi." }
                expected_text: "On est vendredi."
                hints: ["Start with on est."]
              - id: l1-s4
                type: true_false
                text: "Samedi et dimanche, c'est le week-end."
                say: { en: "Read the sentence. Is it true?" }
                answer: true
                hints: ["Samedi and dimanche are Saturday and Sunday."]
              - id: l1-s5
                type: multiple_choice
                text: "Which day comes after jeudi?"
                options: ["vendredi", "mercredi", "mardi"]
                answer: "vendredi"
                option_audio: false
                hints: ["Jeudi is Thursday."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which day is it?"
                say: { en: "Listen. Which day is it?" }
                audio: { fr: "Dimanche." }
                options: ["Sunday", "Saturday", "Monday"]
                answer: "Sunday"
              - id: l1-n2
                type: ordering
                option_audio: false
                text: "Put the days in order."
                options: ["mercredi", "lundi", "mardi"]
                slot_count: 3
                answer: ["lundi", "mardi", "mercredi"]
              - id: l1-n3
                type: text_input
                keyboard: letters
                text: "Write Wednesday in French."
                say: { en: "Write the French word for Wednesday." }
                answer: "mercredi"
              - id: l1-n4
                type: audio_choice
                text: "Which day is it today?"
                say: { en: "Listen. Which day is it today?" }
                audio: { turns: [{ fr: "On est quel jour aujourd'hui ?", speaker: female }, { fr: "On est jeudi.", speaker: male }] }
                options: ["Thursday", "Tuesday", "Friday"]
                answer: "Thursday"
              - id: l1-n5
                type: true_false
                text: "Lundi, c'est le week-end."
                say: { en: "Read the sentence. Is it true?" }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which day is it?"
            say: { en: "Listen. Which day is it?" }
            audio: { fr: "Vendredi." }
            options: ["Friday", "Thursday", "Monday"]
            answer: "Friday"
          - id: l1-c2
            type: multiple_choice
            text: "Which day is missing?"
            say: { en: "Which day is missing?" }
            show: { drawn: table, rows: [[mardi, "?", jeudi]], header: false }
            options: ["mercredi", "lundi", "vendredi"]
            answer: "mercredi"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Mercredi comes after mardi."
            say: { en: "Read the sentence. Is it true?" }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Which day is it today?"
            say: { en: "Listen. Which day is it today?" }
            audio: { turns: [{ fr: "On est quel jour aujourd'hui ?", speaker: male }, { fr: "On est mardi.", speaker: female }] }
            options: ["Tuesday", "Wednesday", "Thursday"]
            answer: "Tuesday"
          - id: l1-c5
            type: multiple_choice
            text: "Which day comes before lundi?"
            options: ["mardi", "dimanche", "samedi"]
            answer: "dimanche"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Vendredi is part of the weekend."
            say: { en: "Read the sentence. Is it true?" }
            answer: false

  - n: 2
    title: { de: "C'est quand, ton anniversaire ?", en: "C'est quand, ton anniversaire ?" }
    goal:
      de: "Lern die Monate und Jahreszeiten auf Französisch und sag, wann du Geburtstag hast, so wie le cinq mai."
      en: "Learn the months and seasons in French and say when your birthday is, like le cinq mai."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which day is it?"
            say: { en: "Listen. Which day is it?" }
            audio: { fr: "Samedi." }
            options: ["Saturday", "Sunday", "Monday"]
            answer: "Saturday"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which day is missing?"
            say: { en: "Which day is missing?" }
            show: { drawn: table, rows: [[dimanche, "?", mardi]], header: false }
            options: ["lundi", "samedi", "jeudi"]
            answer: "lundi"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "March = ?"
            say: { en: "Now the months. Many French months sound a bit like the English ones. Guess: what is March in French?" }
          - text: "janvier, février, mars, avril, mai, juin"
            say: { en: "March is mars. Here are the months in French. Many sound like the English: janvier, février, mars, avril, mai, juin.", fr: "Janvier, février, mars, avril, mai, juin." }
            show: { drawn: table, rows: [[janvier, février, mars, avril, mai, juin]], header: false }
          - text: "juillet, août, septembre, octobre, novembre, décembre"
            say: { en: "And juillet, août, septembre, octobre, novembre, décembre. Juin and juillet sound alike: juin is short, June; juillet has two parts, July. Months start with a small letter too.", fr: "Juillet, août, septembre, octobre, novembre, décembre." }
            show: { drawn: table, rows: [[juillet, août, septembre, octobre, novembre, décembre]], header: false }
          - text: "le printemps, l'été, l'automne, l'hiver"
            say: { en: "The seasons. Le printemps is spring, l'été is summer, l'automne is autumn, l'hiver is winter.", fr: "Le printemps, l'été, l'automne, l'hiver." }
            show: { objects: [sun, snowman] }
          - text: "C'est quand, ton anniversaire ?\nMon anniversaire, c'est le cinq mai."
            say: { en: "To ask about a birthday, say c'est quand, ton anniversaire? Answer with le, the number, then the month: c'est le cinq mai, the fifth of May.", fr: "C'est quand, ton anniversaire ? Mon anniversaire, c'est le cinq mai." }
            show: { object: present }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which month is it?"
                say: { en: "Listen. Which month is it?" }
                audio: { fr: "Juillet." }
                options: ["July", "June", "January"]
                answer: "July"
                feedback:
                  "June": "June is juin, the short one. Juillet has two parts: July."
                hints:
                  - "Was it short or in two parts?"
                  - "Juillet has two parts."
                  - "Juillet is July."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which month is missing?"
                say: { en: "Which month is missing?" }
                show: { drawn: table, rows: [[mars, "?", mai]], header: false }
                options: ["avril", "août", "juin"]
                answer: "avril"
                option_audio: false
                feedback:
                  "août": "August between March and May? Then summer would come very early! Between mars and mai comes avril."
                hints:
                  - "Say the months in English: March, ..., May."
                  - "Between March and May comes April."
                  - "April is avril."
              - id: l2-f3
                type: audio_choice
                text: "When is the birthday?"
                say: { en: "Listen. When is the birthday?" }
                audio: { turns: [{ fr: "C'est quand, ton anniversaire ?", speaker: male }, { fr: "Mon anniversaire, c'est le cinq mai.", speaker: female }] }
                options: ["5 May", "5 March", "15 May"]
                answer: "5 May"
                hints:
                  - "Listen for the number, then the month."
                  - "Cinq is five. Mai is May."
                  - "5 May."
              - id: l2-f4
                type: sorting
                text: "L'été or l'hiver?"
                say: { en: "Summer or winter? Sort the pictures." }
                bins:
                  - { id: ete, show: { text: "l'été" }, say: { fr: "l'été" } }
                  - { id: hiver, show: { text: "l'hiver" }, say: { fr: "l'hiver" } }
                options:
                  - { object: sun, bin: ete }
                  - { object: snowman, bin: hiver }
                  - { object: ice-cream, bin: ete }
                  - { object: woolly-hat, bin: hiver }
                hints:
                  - "L'été is summer."
                  - "L'hiver is winter, when it is cold."
                  - "Sun and ice cream go in l'été; the snowman and the woolly hat go in l'hiver."
              - id: l2-f5
                type: speak
                text: "My birthday is on 10 June."
                say: { en: "Say in French: my birthday is on the tenth of June.", fr: "Mon anniversaire, c'est le dix juin." }
                expected_text: "Mon anniversaire, c'est le dix juin."
                hints:
                  - "Start with mon anniversaire, c'est le."
                  - "Then dix, then juin."
                  - "Say it with me: mon anniversaire, c'est le dix juin."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which month is it?"
                say: { en: "Listen. Which month is it?" }
                audio: { fr: "Juin." }
                options: ["June", "July", "January"]
                answer: "June"
                hints: ["Juin is the short one."]
              - id: l2-s2
                type: multiple_choice
                text: "Which season is l'hiver?"
                options: ["winter", "summer", "spring"]
                answer: "winter"
                hints: ["L'hiver is the cold season."]
              - id: l2-s3
                type: audio_choice
                text: "When is the birthday?"
                say: { en: "Listen. When is the birthday?" }
                audio: { fr: "Mon anniversaire, c'est le douze octobre.", speaker: male }
                options: ["12 October", "2 October", "12 August"]
                answer: "12 October"
                hints: ["Douze is twelve."]
              - id: l2-s4
                type: multiple_choice
                text: "Which is written the French way?"
                say: { en: "Which word is written the French way?" }
                options: ["janvier", "Janvier", "January"]
                answer: "janvier"
                option_audio: false
                hints: ["French months start with a small letter."]
              - id: l2-s5
                type: ordering
                option_audio: false
                text: "Put the months in order."
                options: ["mars", "janvier", "février"]
                slot_count: 3
                answer: ["janvier", "février", "mars"]
                hints: ["Janvier is January."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which month is it?"
                say: { en: "Listen. Which month is it?" }
                audio: { fr: "Août." }
                options: ["August", "April", "October"]
                answer: "August"
              - id: l2-n2
                type: multiple_choice
                text: "Which month is missing?"
                say: { en: "Which month is missing?" }
                show: { drawn: table, rows: [[septembre, "?", novembre]], header: false }
                options: ["octobre", "décembre", "août"]
                answer: "octobre"
                option_audio: false
              - id: l2-n3
                type: audio_choice
                text: "When is Léa's birthday?"
                say: { en: "Listen. When is Léa's birthday?" }
                audio: { turns: [{ fr: "Léa, c'est quand, ton anniversaire ?", speaker: male }, { fr: "C'est le vingt juillet.", speaker: female }] }
                options: ["20 July", "20 June", "12 July"]
                answer: "20 July"
              - id: l2-n4
                type: text_input
                keyboard: letters
                text: "Write May in French."
                say: { en: "Write the French word for May." }
                answer: "mai"
              - id: l2-n5
                type: true_false
                text: "L'été comes after le printemps."
                say: { en: "Read the sentence. Is it true?" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: days
            type: audio_choice
            text: "Which day is it?"
            say: { en: "Listen. Which day is it?" }
            audio: { fr: "Jeudi." }
            options: ["Thursday", "Tuesday", "Wednesday"]
            answer: "Thursday"
          - id: l2-c2
            part: months
            type: multiple_choice
            text: "Which month is missing?"
            say: { en: "Which month is missing?" }
            show: { drawn: table, rows: [[avril, "?", juin]], header: false }
            options: ["mai", "mars", "juillet"]
            answer: "mai"
            option_audio: false
          - id: l2-c3
            part: birthday
            type: audio_choice
            text: "When is the birthday?"
            say: { en: "Listen. When is the birthday?" }
            audio: { turns: [{ fr: "C'est quand, ton anniversaire ?", speaker: female }, { fr: "C'est le quinze juin.", speaker: male }] }
            options: ["15 June", "15 July", "5 June"]
            answer: "15 June"
          - id: l2-c4
            part: days
            type: text_input
            keyboard: letters
            text: "Write Tuesday in French."
            say: { en: "Write the French word for Tuesday." }
            answer: "mardi"
          - id: l2-c5
            part: seasons
            type: multiple_choice
            text: "Which season is l'été?"
            options: ["summer", "autumn", "winter"]
            answer: "summer"
          - id: l2-c6
            part: days
            type: ordering
            option_audio: false
            text: "Put the days in order."
            options: ["jeudi", "mardi", "vendredi", "mercredi"]
            slot_count: 4
            answer: ["mardi", "mercredi", "jeudi", "vendredi"]
          - id: l2-c7
            part: days
            type: true_false
            text: "Is it Tuesday today?"
            say: { en: "Listen. Is it Tuesday today?" }
            audio: { turns: [{ fr: "On est quel jour aujourd'hui ?", speaker: female }, { fr: "On est mercredi.", speaker: male }] }
            answer: false
          - id: l2-c8
            part: days
            type: text_input
            keyboard: letters
            text: "Today is vendredi. Which day is it tomorrow? Write it in French."
            say: { en: "Today is vendredi. Which day is it tomorrow? Write it in French." }
            answer: "samedi"
          - id: l2-c9
            part: months
            type: multiple_choice
            text: "Christmas Day is on 25 December. Which month is that in French?"
            options: ["novembre", "décembre", "septembre"]
            answer: "décembre"
            option_audio: false
          - id: l2-c10
            part: months
            type: ordering
            option_audio: false
            text: "Put the months in order."
            options: ["août", "juin", "juillet", "mai"]
            slot_count: 4
            answer: ["mai", "juin", "juillet", "août"]
          - id: l2-c11
            part: months
            type: true_false
            text: "Is the month June?"
            say: { en: "Listen. Is the month June?" }
            audio: { fr: "Juillet." }
            answer: false
          - id: l2-c12
            part: months
            type: text_input
            keyboard: letters
            text: "Which month comes after février? Write it in French."
            say: { en: "Which month comes after février? Write it in French." }
            answer: "mars"
          - id: l2-c13
            part: seasons
            type: sorting
            text: "Sort the pictures: l'été or l'hiver?"
