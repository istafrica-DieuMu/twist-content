# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-likes
skill: fl.speaking.likes
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Was ich mag und nicht mag (Französisch)
  en: What I like and don't like in French
summary: >
  Saying what you like and do not like in French, and asking others.
  Lesson 1 brings j'aime, j'adore, je n'aime pas and je déteste with
  food, always with le, la or les before the food, heard, read and built
  from word cards. Lesson 2 asks tu aimes ... ?, answers with oui, j'aime
  ça and non, je n'aime pas ça, asks back with et toi ?, and ends with the
  skill check. Speaking is practised, not marked.
metadata:
  year: ly-2
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.name-things, fl.grammar.chunks]
  also_practises: [fl.themes.food, fl.grammar.questions]
  vocabulary: { fr: [j'aime, j'adore, je n'aime pas, je déteste, "tu aimes ... ?", "oui, j'aime ça", "non, je n'aime pas ça", "et toi ?", mais, la pizza, le fromage, le lait, le gâteau, la glace, les pommes, les bananes, les carottes, les tomates, le chocolat] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: like, what: { de: "sagen, was ich mag und liebe (j'aime, j'adore)", en: "saying what I like and love (j'aime, j'adore)" } }
    - { id: dislike, what: { de: "sagen, was ich nicht mag (je n'aime pas, je déteste)", en: "saying what I do not like (je n'aime pas, je déteste)" } }
    - { id: ask, what: { de: "andere fragen (Tu aimes ... ? Et toi ?)", en: "asking others (Tu aimes ... ? Et toi ?)" } }
    - { id: answer, what: { de: "auf „Tu aimes ... ?“ mit je antworten", en: "answering Tu aimes ... ? with je" } }
  misconceptions:
    - id: hears-aime
      what: Hears aime in je n'aime pas and takes it for liking
      addressed: lesson 1 Learn wraps ne and pas round aime; l1-f2 gives feedback when yes is chosen, and l1-s1, l1-n2, l1-c2 and l2-c1 ask about a food someone does not like
    - id: no-article
      what: Leaves out le, la or les after j'aime (j'aime pizza), as in English
      addressed: lesson 1 Learn says the food always takes le, la or les; l1-s2, l1-c3 and l2-c4 ask which sentence is right, and every word-card task has the article
    - id: tu-in-answer
      what: Answers tu aimes ... ? with tu (oui, tu aimes ça) by copying the question
      addressed: lesson 2 Learn says you answer with je; l2-f2 gives feedback on oui, tu aimes ça, and l2-s1, l2-n1 and l2-c2 keep the tu answer among the options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "J'aime, je n'aime pas", en: "J'aime, je n'aime pas" }
    goal:
      de: "Sag auf Französisch, was du liebst, magst oder gar nicht magst, so wie j'adore la glace."
      en: "Say what you love, like or do not like in French, like j'adore la glace."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Is that the right name for the picture?"
            say: { en: "Listen. Is that the right name for the picture?" }
            audio: { fr: "C'est une pomme." }
            show: { object: apple }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "You want to say: I have got a dog. Which starter do you need?"
            options: ["J'ai ...", "Je suis ..."]
            answer: "J'ai ..."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "J'adore la glace !"
            say: { en: "Listen to Tom. What do you think: does he love ice cream, or hate it?", fr: "J'adore la glace !" }
            show: { object: ice-cream }
          - text: "J'aime la pizza. J'adore la glace."
            say: { en: "He loves it! J'adore sounds like adore. J'aime means I like. J'adore means I love.", fr: "J'aime la pizza. J'adore la glace." }
            show: { object: pizza }
          - text: "Je n'aime pas le lait."
            say: { en: "Je n'aime pas means I don't like. N' and pas go either side of aime, so listen for them.", fr: "Je n'aime pas le lait." }
            show: { object: milk }
          - text: "Je déteste les carottes."
            say: { en: "Je déteste means I hate.", fr: "Je déteste les carottes." }
            show: { object: carrot }
          - text: "J'aime la pizza. J'aime les pommes."
            say: { en: "In French the food always has le, la or les in front: j'aime la pizza, never j'aime pizza.", fr: "J'aime la pizza. J'aime les pommes." }
          - text: "Did you know? Croissant is the French word for a crescent, the shape of a thin moon."
            say: { en: "Did you know? Croissant is the French word for a crescent: the curved shape of a thin moon. Look at a croissant, and you can see why it got its name!", fr: "le croissant" }
            show: { object: croissant }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What does Léa like?"
                say: { en: "Listen. What does Léa like? Tap the picture." }
                audio: { fr: "J'aime le fromage.", speaker: female }
                options: [{ object: milk }, { object: cheese }, { object: cake }]
                answer: cheese
                hints:
                  - "Listen for the food after j'aime le."
                  - "Le fromage is cheese."
                  - "Tap the cheese."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Does Hugo like milk?"
                say: { en: "Listen. Does Hugo like milk?" }
                audio: { fr: "Je n'aime pas le lait.", speaker: male }
                options: ["yes", "no"]
                answer: "no"
                keep_order: true
                feedback:
                  "yes": "Listen for n' and pas. Je n'aime pas means I don't like."
                hints:
                  - "Do you hear n' before aime, and pas after it?"
                  - "Ne ... pas means not."
                  - "No. Hugo does not like milk."
              - id: l1-f3
                type: ordering
                text: "Build the sentence: I don't like milk."
                say: { en: "Build the sentence: I don't like milk." }
                options: ["pas", "Je", "le lait", "n'aime"]
                slot_count: 4
                answer: ["Je", "n'aime", "pas", "le lait"]
                option_audio: false
                hints:
                  - "Start with Je."
                  - "N' and pas go either side of aime."
                  - "Je n'aime pas le lait."
              - id: l1-f4
                type: true_false
                text: "Does Tom like ice cream?"
                say: { en: "Listen. Does Tom like ice cream?" }
                audio: { fr: "J'adore la glace !", speaker: male }
                show: { object: ice-cream }
                answer: true
                hints:
                  - "Listen to the start: j'adore."
                  - "J'adore means I love."
                  - "Yes. Tom loves ice cream."
              - id: l1-f5
                type: speak
                say: { en: "Say that you like pizza.", fr: "J'aime la pizza." }
                show: { object: pizza }
                expected_text: "j'aime la pizza"
                hints:
                  - "Listen again: j'aime la pizza."
                  - "Remember la before pizza."
                  - "Say it with me: J'aime la pizza."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What does Manon not like?"
                say: { en: "Listen. What does Manon not like? Tap the picture." }
                audio: { fr: "J'aime les pommes, mais je n'aime pas les bananes.", speaker: female }
                options: [{ object: apple }, { object: cheese }, { object: banana }]
                answer: banana
                hints: ["Listen for the food after n'aime pas."]
              - id: l1-s2
                type: multiple_choice
                text: "Which sentence is right?"
                options: ["J'aime pizza.", "J'aime la pizza."]
                answer: "J'aime la pizza."
                option_audio: false
                hints: ["The food needs le, la or les."]
              - id: l1-s3
                type: true_false
                text: "Does Jules like carrots?"
                say: { en: "Listen. Does Jules like carrots?" }
                audio: { fr: "Je déteste les carottes.", speaker: male }
                show: { object: carrot }
                answer: false
                hints: ["Je déteste means I hate."]
              - id: l1-s4
                type: ordering
                text: "Build the sentence: I like cake."
                say: { en: "Build the sentence: I like cake." }
                options: ["gâteau", "J'aime", "le"]
                slot_count: 3
                answer: ["J'aime", "le", "gâteau"]
                option_audio: false
                hints: ["J'aime, then le, then the food."]
              - id: l1-s5
                type: speak
                say: { en: "Say that you don't like milk.", fr: "Je n'aime pas le lait." }
                show: { object: milk }
                expected_text: "je n'aime pas le lait"
                hints: ["Je n'aime pas, then le lait."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What does Chloé love?"
                say: { en: "Listen. What does Chloé love? Tap the picture." }
                audio: { fr: "J'adore le gâteau !", speaker: female }
                options: [{ object: pizza }, { object: ice-cream }, { object: cake }]
                answer: cake
              - id: l1-n2
                type: audio_choice
                text: "Does Lucas like tomatoes?"
                say: { en: "Listen. Does Lucas like tomatoes?" }
                audio: { fr: "Je n'aime pas les tomates.", speaker: male }
                options: ["yes", "no"]
                answer: "no"
                keep_order: true
              - id: l1-n3
                type: ordering
                text: "Build the sentence: I don't like cheese."
                say: { en: "Build the sentence: I don't like cheese." }
                options: ["n'aime", "le fromage", "Je", "pas"]
                slot_count: 4
                answer: ["Je", "n'aime", "pas", "le fromage"]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Does Inès like apples?"
                say: { en: "Listen. Does Inès like apples?" }
                audio: { fr: "J'aime les pommes.", speaker: female }
                show: { object: apple }
                answer: true
              - id: l1-n5
                type: speak
                say: { en: "Say one food you like and one food you don't like." }
                expected_text: "j'aime la pizza je n'aime pas le lait"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "What does Théo like?"
            say: { en: "Listen. What does Théo like? Tap the picture." }
            audio: { fr: "J'aime la glace.", speaker: male }
            options: [{ object: cake }, { object: ice-cream }, { object: cheese }]
            answer: ice-cream
          - id: l1-c2
            type: audio_choice
            text: "Does Léa like cheese?"
            say: { en: "Listen. Does Léa like cheese?" }
            audio: { fr: "Je n'aime pas le fromage.", speaker: female }
            options: ["yes", "no"]
            answer: "no"
            keep_order: true
          - id: l1-c3
            type: multiple_choice
            text: "Which sentence is right?"
            options: ["J'aime les bananes.", "J'aime bananes."]
            answer: "J'aime les bananes."
            option_audio: false
          - id: l1-c4
            type: audio_choice
            text: "What does Malik hate?"
            say: { en: "Listen. What does Malik hate? Tap the picture." }
            audio: { fr: "Je déteste les tomates.", speaker: male }
            options: [{ object: carrot }, { object: tomato }, { object: apple }]
            answer: tomato
          - id: l1-c5
            type: multiple_choice
            text: "Which one means I love?"
            options: ["je déteste", "je n'aime pas", "j'adore"]
            answer: "j'adore"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Does Emma like cheese?"
            say: { en: "Listen. Does Emma like cheese?" }
            audio: { fr: "J'adore le fromage !", speaker: female }
            show: { object: cheese }
            answer: true

  - n: 2
    title: { de: "Tu aimes ...?", en: "Tu aimes ...?" }
    goal:
      de: "Frag einen Freund, was er mag, antworte und frag zurück, so wie et toi."
      en: "Ask a friend what they like, answer, and ask back with et toi."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Does Hugo like milk?"
            say: { en: "Do you remember? Does Hugo like milk?" }
            audio: { fr: "Moi, je n'aime pas le lait.", speaker: male }
            options: ["yes", "no"]
            answer: "no"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Does Chloé like cake?"
            say: { en: "Do you remember? Does Chloé like cake?" }
            audio: { fr: "J'adore le gâteau.", speaker: female }
            show: { object: cake }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tu aimes le chocolat ?"
            say: { en: "Listen. Is Léa telling you something, or asking you something? What do you think?", fr: "Tu aimes le chocolat ?" }
          - text: "Tu aimes le chocolat ?"
            say: { en: "She is asking! Her voice goes up at the end. To ask a friend, say tu aimes, then the food, with your voice going up.", fr: "Tu aimes le chocolat ?" }
          - text: "Oui, j'aime ça. Non, je n'aime pas ça."
            say: { en: "To say yes: oui, j'aime ça. To say no: non, je n'aime pas ça. You answer with je, about yourself, not with tu.", fr: "Oui, j'aime ça. Non, je n'aime pas ça." }
          - say: { en: "Ask back with et toi ? Listen to Léa and Hugo.", fr: "Tu aimes la pizza ? Oui, j'adore ! Et toi ? Non, je n'aime pas ça." }
            show: { object: pizza }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Is someone asking a question?"
                say: { en: "Listen. Is someone asking a question?" }
                audio: { fr: "Tu aimes les pommes ?" }
                answer: true
                hints:
                  - "Listen to the start: tu aimes."
                  - "Does the voice go up at the end?"
                  - "Yes. Tu aimes les pommes ? asks do you like apples?"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "“Tu aimes le lait ?” You like it. What do you answer?"
                say: { en: "Your friend asks: tu aimes le lait ? You like it. What do you answer?" }
                options: ["Oui, j'aime ça.", "Oui, tu aimes ça.", "Non, je n'aime pas ça."]
                answer: "Oui, j'aime ça."
                option_audio: false
                feedback:
                  "Oui, tu aimes ça.": "You are talking about yourself, so you say je: oui, j'aime ça."
                hints:
                  - "You like it, so the answer starts with oui."
                  - "You talk about yourself, so you use je, not tu."
                  - "Oui, j'aime ça."
              - id: l2-f3
                type: audio_choice
                text: "Does Hugo like pizza?"
                say: { en: "Listen. Does Hugo like pizza?" }
                audio: { turns: [{ fr: "Tu aimes la pizza, Hugo ?", speaker: female }, { fr: "Non, je n'aime pas ça.", speaker: male }] }
                options: ["yes", "no"]
                answer: "no"
                keep_order: true
                hints:
                  - "Listen to Hugo's answer, after the question."
                  - "Does he say oui or non?"
                  - "No. He says non, je n'aime pas ça."
              - id: l2-f4
                type: ordering
                text: "Build the question: Do you like cheese?"
                say: { en: "Build the question: Do you like cheese?" }
                options: ["le fromage ?", "aimes", "Tu"]
                slot_count: 3
                answer: ["Tu", "aimes", "le fromage ?"]
                option_audio: false
                hints:
                  - "A question to a friend starts with tu."
                  - "Tu aimes, then the food."
                  - "Tu aimes le fromage ?"
              - id: l2-f5
                type: speak
                say: { en: "Ask a friend if they like ice cream.", fr: "Tu aimes la glace ?" }
                show: { object: ice-cream }
                expected_text: "tu aimes la glace"
                hints:
                  - "Listen again: tu aimes la glace ?"
                  - "Let your voice go up at the end."
                  - "Say it with me: Tu aimes la glace ?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "“Tu aimes les carottes ?” You don't like them. What do you answer?"
                say: { en: "Your friend asks: tu aimes les carottes ? You don't like them. What do you answer?" }
                options: ["Oui, j'aime ça.", "Non, tu n'aimes pas ça.", "Non, je n'aime pas ça."]
                answer: "Non, je n'aime pas ça."
                option_audio: false
                hints: ["Non, and then je, because it is about you."]
              - id: l2-s2
                type: audio_choice
                text: "What is Léa asking about?"
                say: { en: "Listen. What is Léa asking about? Tap the picture." }
                audio: { fr: "Tu aimes le gâteau ?", speaker: female }
                options: [{ object: cheese }, { object: cake }, { object: milk }]
                answer: cake
                hints: ["Le gâteau is cake."]
              - id: l2-s3
                type: true_false
                text: "Does the answer fit the question?"
                say: { en: "Listen to the question and the answer. Does the answer fit?" }
                audio: { turns: [{ fr: "Tu aimes le chocolat ?", speaker: female }, { fr: "Oui, j'adore !", speaker: male }] }
                answer: true
                hints: ["Tu aimes asks if you like it. J'adore means I love it."]
              - id: l2-s4
                type: audio_choice
                text: "Who likes pizza?"
                say: { en: "Listen to the two children. Who likes pizza?" }
                audio: { turns: [{ fr: "Tu aimes la pizza ?", speaker: female }, { fr: "Oui, j'aime ça. Et toi ?", speaker: male }, { fr: "Non, je n'aime pas ça.", speaker: female }] }
                options: ["only the boy", "only the girl", "both children"]
                answer: "only the boy"
                hints: ["The first answer is oui. The second is non."]
              - id: l2-s5
                type: speak
                say: { en: "Your friend asks: tu aimes les pommes ? You do. Answer in French.", fr: "Oui, j'aime ça." }
                show: { object: apple }
                expected_text: "oui j'aime ça"
                hints: ["Oui, then j'aime ça."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "“Tu aimes le fromage ?” You love it. What do you answer?"
                say: { en: "Your friend asks: tu aimes le fromage ? You love it. What do you answer?" }
                options: ["Non, je déteste ça.", "Oui, tu adores !", "Oui, j'adore !"]
                answer: "Oui, j'adore !"
                option_audio: false
              - id: l2-n2
                type: true_false
                text: "Does the answer fit the question?"
                say: { en: "Listen to the question and the answer. Does the answer fit?" }
                audio: { turns: [{ fr: "Tu aimes les bananes ?", speaker: female }, { fr: "Je m'appelle Tom.", speaker: male }] }
                answer: false
              - id: l2-n3
                type: ordering
                text: "Build the question: Do you like milk?"
                say: { en: "Build the question: Do you like milk?" }
                options: ["aimes", "le lait ?", "Tu"]
                slot_count: 3
                answer: ["Tu", "aimes", "le lait ?"]
                option_audio: false
              - id: l2-n4
                type: audio_choice
                text: "Does Manon like tomatoes?"
                say: { en: "Listen. Does Manon like tomatoes?" }
                audio: { turns: [{ fr: "Tu aimes les tomates, Manon ?", speaker: male }, { fr: "Oui, j'aime ça !", speaker: female }] }
                options: ["yes", "no"]
                answer: "yes"
                keep_order: true
              - id: l2-n5
                type: speak
                say: { en: "Ask a friend in French if they like chocolate." }
                expected_text: "tu aimes le chocolat"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: dislike
            type: audio_choice
            text: "What does Jules not like?"
            say: { en: "Listen. What does Jules not like? Tap the picture." }
            audio: { fr: "J'aime le gâteau, mais je n'aime pas le fromage.", speaker: male }
            options: [{ object: cake }, { object: apple }, { object: cheese }]
            answer: cheese
          - id: l2-c2
            part: answer
            type: multiple_choice
            text: "“Tu aimes la glace ?” You don't like it. What do you answer?"
            say: { en: "Your friend asks: tu aimes la glace ? You don't like it. What do you answer?" }
            options: ["Non, tu n'aimes pas ça.", "Non, je n'aime pas ça.", "Oui, j'aime ça."]
            answer: "Non, je n'aime pas ça."
            option_audio: false
          - id: l2-c3
            part: dislike
            type: ordering
            text: "Build the sentence: I don't like carrots."
            say: { en: "Build the sentence: I don't like carrots." }
            options: ["les carottes", "pas", "n'aime", "Je"]
            slot_count: 4
            answer: ["Je", "n'aime", "pas", "les carottes"]
            option_audio: false
          - id: l2-c4
            part: like
            type: multiple_choice
            text: "Which sentence is right?"
            options: ["J'aime lait.", "J'aime le lait."]
            answer: "J'aime le lait."
            option_audio: false
          - id: l2-c5
            part: answer
            type: true_false
            text: "Does the answer fit the question?"
            say: { en: "Listen to the question and the answer. Does the answer fit?" }
            audio: { turns: [{ fr: "Tu aimes les pommes ?", speaker: male }, { fr: "Non, je n'aime pas ça.", speaker: female }] }
            answer: true
          - id: l2-c6
            part: like
            type: audio_choice
            text: "What does Nina love?"
            say: { en: "Listen. What does Nina love? Tap the picture." }
            audio: { fr: "J'aime le lait, mais j'adore la glace !", speaker: female }
            options: [{ object: milk }, { object: cake }, { object: ice-cream }]
            answer: ice-cream
          - id: l2-c7
            part: like
            type: ordering
            text: "Build the sentence: I love chocolate."
            say: { en: "Build the sentence: I love chocolate." }
            options: ["chocolat", "le chocolat", "J'adore"]
            slot_count: 2
            answer: ["J'adore", "le chocolat"]
            option_audio: false
          - id: l2-c8
            part: like
            type: multiple_choice
            text: "Which sentence means I love pizza?"
            options: ["J'aime la pizza.", "Je déteste la pizza.", "J'adore la pizza."]
            answer: "J'adore la pizza."
            option_audio: false
          - id: l2-c9
            part: like
            type: fill_in_blank
            text: "Finish the sentence: I like apples."
            say: { en: "Finish the sentence: I like apples." }
            frame: "J'aime _ pommes."
            options: ["le", "les", "la"]
            answer: ["les"]
            option_audio: false
          - id: l2-c10
            part: dislike
            type: audio_choice
            text: "What does Paul hate?"
            say: { en: "Listen. What does Paul hate? Tap the picture." }
            audio: { fr: "Je déteste le lait ! Mais j'aime le fromage.", speaker: male }
            options: [{ object: cheese }, { object: milk }, { object: cake }]
            answer: milk
          - id: l2-c11
            part: dislike
            type: true_false
            text: "Does Zoé hate bananas?"
            say: { en: "Listen. Does Zoé hate bananas?" }
            audio: { fr: "Beurk ! Je déteste les bananes.", speaker: female }
            show: { object: banana }
            answer: true
          - id: l2-c12
            part: dislike
