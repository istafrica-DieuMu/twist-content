# Lesson set: French, learning year 2 (Year 4). Hand-authored draft.
id: en-GB.fl.fr-home
skill: fl.themes.home
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Zu Hause (Französisch)
  en: At home in French
summary: >
  Rooms and furniture in French. Lesson 1 learns the furniture and things
  in a house by ear and picture (le lit, la table, la chaise, le canapé,
  l'armoire, la lampe, le miroir, le frigo, le four); lesson 2 learns the
  rooms (la cuisine, la salle de bains, la chambre, le salon, le jardin),
  says which room something is in (Le lit est dans la chambre.), and ends
  with the skill check. The rooms and the garden are shown as pictures.
  Speaking tasks are practice only.
metadata:
  year: ly-2
  topic: { de: Zu Hause, en: At home }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.grammar.questions, fl.speaking.name-things]
  vocabulary: { fr: [la maison, le lit, la table, la chaise, le canapé, "l'armoire", la lampe, le miroir, le frigo, le four, la baignoire, la cuisine, la salle de bains, la chambre, le salon, le jardin, "est dans"] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: chambre-any-room
      what: Takes la chambre for any room, as chamber suggests, and mixes it up with la salle de bains
      addressed: lesson 2 Learn says la chambre is the bedroom, the room with your bed, and that bain means bath; l2-f1 gives feedback when the bathroom is tapped for la chambre, and l2-n1, l2-c1 and l2-c3 set the two rooms against each other
    - id: chaise-table
      what: Mixes up la chaise and la table, which are often named together
      addressed: l1-f1 gives feedback when the table is tapped for la chaise; chair and table share an option set in l1-s1 and l1-c2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Möbel und Dinge im Haus", en: "Furniture and things in the house" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "la maison" }
            options: [{ object: house }, { object: tree }, { object: car }]
            answer: house
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "le chat" }
            options: [{ object: dog }, { object: cat }, { object: mouse }]
            answer: cat
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "le lit, la table, la chaise"
            say: { en: "Things in a house. Le lit is the bed, la table the table, la chaise the chair.", fr: "le lit, la table, la chaise" }
            show: { object: bed }
          - text: "le canapé, l'armoire, la lampe"
            say: { en: "Le canapé is a sofa. L'armoire is a big cupboard for your clothes. La lampe is a lamp.", fr: "le canapé, l'armoire, la lampe" }
            show: { object: sofa }
          - text: "le miroir, le frigo, le four"
            say: { en: "Le miroir sounds like mirror. Le frigo is the fridge, and le four is the oven.", fr: "le miroir, le frigo, le four" }
            show: { object: fridge }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "la chaise" }
                options: [{ object: chair }, { object: table }, { object: sofa }]
                answer: chair
                feedback:
                  table: "That is la table. La chaise is the chair you sit on."
                hints:
                  - "Listen again: la chaise."
                  - "You sit on it at the table."
                  - "Tap the chair."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "l'armoire" }
                options: [{ object: cupboard }, { object: fridge }, { object: door }]
                answer: cupboard
                hints:
                  - "Listen again: l'armoire."
                  - "You keep your clothes in it."
                  - "Tap the cupboard."
              - id: l1-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "le canapé" }
                show: { object: sofa }
                answer: true
                hints:
                  - "Listen again: le canapé."
                  - "Le canapé is something you sit on with your family."
                  - "Yes. Le canapé is the sofa."
              - id: l1-f4
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "le frigo" }
                options: [{ object: fridge }, { object: oven }, { object: cupboard }]
                answer: fridge
                hints:
                  - "Listen again: le frigo."
                  - "Frigo sounds a bit like fridge. It keeps food cold."
                  - "Tap the fridge."
              - id: l1-f5
                type: speak
                say: { en: "Say it in French.", fr: "le lit" }
                show: { object: bed }
                expected_text: "le lit"
                hints:
                  - "Listen again: le lit."
                  - "You do not say the t at the end."
                  - "Say it with me: le lit."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "la table" }
                options: [{ object: table }, { object: chair }, { object: bed }]
                answer: table
                hints: ["La table sounds like table."]
              - id: l1-s2
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "le miroir" }
                options: [{ object: mirror }, { object: window }, { object: lamp }]
                answer: mirror
                hints: ["Miroir sounds like mirror."]
              - id: l1-s3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "la lampe" }
                show: { object: clock }
                answer: false
                hints: ["La lampe gives light."]
              - id: l1-s4
                type: matching
                option_audio: false
                text: "Match each word with its picture."
                say: { en: "Read each word. Tap it, then its picture." }
                pairs:
                  - left: { text: "le lit" }
                    right: { object: bed }
                  - left: { text: "le four" }
                    right: { object: oven }
                  - left: { text: "le canapé" }
                    right: { object: sofa }
                hints: ["Le four is not the number four. It gets hot and cooks food."]
              - id: l1-s5
                type: speak
                say: { en: "Say it in French.", fr: "la chaise" }
                show: { object: chair }
                expected_text: "la chaise"
                hints: ["Say it with me: la chaise."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "le four" }
                options: [{ object: oven }, { object: fridge }, { object: kettle }]
                answer: oven
              - id: l1-n2
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "le lit" }
                options: [{ object: bed }, { object: sofa }, { object: chair }]
                answer: bed
              - id: l1-n3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "l'armoire" }
                show: { object: fridge }
                answer: false
              - id: l1-n4
                type: audio_choice
                text: "Tap the picture you hear."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "la lampe" }
                options: [{ object: lamp }, { object: mirror }, { object: clock }]
                answer: lamp
              - id: l1-n5
                type: speak
                say: { en: "Say it in French.", fr: "le canapé" }
                show: { object: sofa }
                expected_text: "le canapé"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "le canapé" }
            options: [{ object: sofa }, { object: bed }, { object: table }]
            answer: sofa
          - id: l1-c2
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "la chaise" }
            options: [{ object: table }, { object: chair }, { object: lamp }]
            answer: chair
          - id: l1-c3
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "le frigo" }
            show: { object: fridge }
            answer: true

  - n: 2
    title: { de: "Die Zimmer", en: "The rooms" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "la table" }
            options: [{ object: chair }, { object: table }, { object: sofa }]
            answer: table
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Tap the picture you hear."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "le frigo" }
            options: [{ object: oven }, { object: fridge }, { object: cupboard }]
            answer: fridge
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "la cuisine, la salle de bains, la baignoire"
            say: { en: "The rooms. La cuisine is the kitchen. La salle de bains is the bathroom: bain means bath, and the bath is la baignoire.", fr: "la cuisine, la salle de bains, la baignoire" }
            show: { object: kitchen }
          - text: "la chambre, le salon, le jardin"
            say: { en: "La chambre is the bedroom, the room with your bed. It does not mean any room. Le salon is the living room, and le jardin is the garden.", fr: "la chambre, le salon, le jardin" }
            show: { object: bedroom }
          - text: "Le lit est dans la chambre.\nOù est le frigo ? Dans la cuisine."
            say: { en: "To say where something is, use est dans: le lit est dans la chambre, the bed is in the bedroom. Où est le frigo ? Dans la cuisine.", fr: "Le lit est dans la chambre. Où est le frigo ? Dans la cuisine." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tap the room you hear."
                say: { en: "Listen. Tap the room." }
                audio: { fr: "la chambre" }
                options: [{ object: bedroom }, { object: bathroom }, { object: living-room }]
                answer: bedroom
                feedback:
                  bathroom: "That is la salle de bains, with the bath. La chambre is the bedroom."
                hints:
                  - "Listen again: la chambre."
                  - "It is the room with your bed."
                  - "Tap the bedroom."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Where is the sofa?"
                say: { en: "Listen. Where is the sofa?" }
                audio: { fr: "Le canapé est dans le salon." }
                options: [{ object: living-room }, { object: kitchen }, { object: garden }]
                answer: living-room
                hints:
                  - "Listen for the room after dans."
                  - "Dans le salon."
                  - "Le salon is the living room."
              - id: l2-f3
                type: sorting
                text: "Which room?"
                say: { en: "Tap each picture to hear its word. Is it in the kitchen or in the bedroom? Sort the pictures." }
                bins:
                  - { id: kitchen, show: { object: kitchen }, say: { fr: "la cuisine" } }
                  - { id: bedroom, show: { object: bedroom }, say: { fr: "la chambre" } }
                options:
                  - { object: fridge, say: { fr: "le frigo" }, bin: kitchen }
                  - { object: oven, say: { fr: "le four" }, bin: kitchen }
                  - { object: bed, say: { fr: "le lit" }, bin: bedroom }
                  - { object: cupboard, say: { fr: "l'armoire" }, bin: bedroom }
                hints:
                  - "Where do you cook, and where do you sleep?"
                  - "Le frigo and le four are for food."
                  - "Frigo and four go in la cuisine. Lit and armoire go in la chambre."
              - id: l2-f4
                type: true_false
                text: "Le frigo est dans la salle de bains.\nIs that right?"
                say: { en: "Read and listen. Is that right?", fr: "Le frigo est dans la salle de bains." }
                answer: false
                hints:
                  - "Where do you keep food cold?"
                  - "La salle de bains is the bathroom."
                  - "No. Le frigo est dans la cuisine."
              - id: l2-f5
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence."
                show: { object: bath }
                frame: "La baignoire est dans _."
                options: ["la salle de bains", "la cuisine", "le jardin"]
                answer: ["la salle de bains"]
                hints:
                  - "La baignoire is the bath. Which room is it in?"
                  - "Bain means bath."
                  - "La baignoire est dans la salle de bains."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Tap the room you hear."
                say: { en: "Listen. Tap the room." }
                audio: { fr: "le salon" }
                options: [{ object: living-room }, { object: bedroom }, { object: kitchen }]
                answer: living-room
                hints: ["Le salon is where the sofa is."]
              - id: l2-s2
                type: audio_choice
                text: "Where is the cat?"
                say: { en: "Listen. Where is the cat?" }
                audio: { fr: "Où est le chat ? Il est dans le jardin." }
                options: [{ object: garden }, { object: kitchen }, { object: bathroom }]
                answer: garden
                hints: ["Listen for the place after dans."]
              - id: l2-s3
                type: sorting
                text: "Which room?"
                say: { en: "Tap each picture to hear its word. Is it in the bathroom or in the kitchen? Sort the pictures." }
                bins:
                  - { id: bathroom, show: { object: bathroom }, say: { fr: "la salle de bains" } }
                  - { id: kitchen, show: { object: kitchen }, say: { fr: "la cuisine" } }
                options:
                  - { object: bath, say: { fr: "la baignoire" }, bin: bathroom }
                  - { object: mirror, say: { fr: "le miroir" }, bin: bathroom }
                  - { object: fridge, say: { fr: "le frigo" }, bin: kitchen }
                  - { object: oven, say: { fr: "le four" }, bin: kitchen }
                hints: ["You wash in the bathroom and cook in the kitchen."]
              - id: l2-s4
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence."
                show: { object: bed }
                frame: "Le lit est dans _."
                options: ["la chambre", "la cuisine", "le salon"]
                answer: ["la chambre"]
                hints: ["You sleep in this room."]
              - id: l2-s5
                type: speak
                say: { en: "Say in French: The bed is in the bedroom.", fr: "Le lit est dans la chambre." }
                show: { object: bedroom }
                expected_text: "Le lit est dans la chambre."
                hints: ["Say it with me: Le lit est dans la chambre."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Tap the room you hear."
                say: { en: "Listen. Tap the room." }
                audio: { fr: "la salle de bains" }
                options: [{ object: bathroom }, { object: bedroom }, { object: kitchen }]
                answer: bathroom
              - id: l2-n2
                type: audio_choice
                text: "Where is Mum?"
                say: { en: "Listen. Where is Mum?" }
                audio: { fr: "Où est Maman ? Elle est dans la cuisine." }
                options: [{ object: kitchen }, { object: garden }, { object: living-room }]
                answer: kitchen
              - id: l2-n3
                type: true_false
                text: "Le canapé est dans le salon.\nIs that right?"
                say: { en: "Read and listen. Is that right?", fr: "Le canapé est dans le salon." }
                answer: true
              - id: l2-n4
                type: fill_in_blank
                option_audio: false
                text: "Finish the sentence."
                show: { object: oven }
                frame: "Le four est dans _."
                options: ["la cuisine", "la chambre", "la salle de bains"]
                answer: ["la cuisine"]
              - id: l2-n5
                type: speak
                say: { en: "Say in French: The sofa is in the living room.", fr: "Le canapé est dans le salon." }
                show: { object: living-room }
                expected_text: "Le canapé est dans le salon."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Where is the bed?"
            say: { en: "Listen. Where is the bed?" }
            audio: { fr: "Où est le lit ? Il est dans la chambre." }
            options: [{ object: bedroom }, { object: bathroom }, { object: living-room }]
            answer: bedroom
          - id: l2-c2
            type: audio_choice
            text: "Tap the room you hear."
            say: { en: "Listen. Tap the room." }
            audio: { fr: "la cuisine" }
            options: [{ object: kitchen }, { object: bathroom }, { object: garden }]
            answer: kitchen
          - id: l2-c3
            type: true_false
            text: "La baignoire est dans la chambre.\nIs that right?"
            say: { en: "Read and listen. Is that right?", fr: "La baignoire est dans la chambre." }
            answer: false
          - id: l2-c4
            type: fill_in_blank
            option_audio: false
            text: "Finish the sentence."
            show: { object: mirror }
            frame: "Le miroir est dans _."
            options: ["la salle de bains", "le jardin", "la cuisine"]
            answer: ["la salle de bains"]
          - id: l2-c5
            type: sorting
            text: "Sort the things into the rooms."
            say: { en: "Tap each picture to hear its word. Is it in the bathroom or in the living room?" }
            bins:
              - { id: bathroom, show: { object: bathroom }, say: { fr: "la salle de bains" } }
              - { id: living-room, show: { object: living-room }, say: { fr: "le salon" } }
            options:
              - { object: bath, say: { fr: "la baignoire" }, bin: bathroom }
              - { object: mirror, say: { fr: "le miroir" }, bin: bathroom }
              - { object: sofa, say: { fr: "le canapé" }, bin: living-room }
