# Lesson set: English, Year 3. Hand-authored draft.
id: en-GB.lit-en.exception-words-ks2
skill: lit-en.word-reading.exception-words-ks2
curriculum: en-GB
language: en
title:
  de: Schwierige Wörter lesen
  en: Reading tricky words
summary: >
  Exception words from the Year 3 and 4 list do not sound the way their
  letters suggest: island has a silent s, heart sounds like art, women
  sounds like wimmin. Lesson 1 finds the tricky part of each word; lesson
  2 reads the words in sentences and chooses the right spelling of a word
  that is heard, and ends with the skill check.
metadata:
  year: year-3
  topic: { de: Wörter lesen, en: Reading words }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-en.word-reading.exception-words-y2]
  also_practises: [lit-en.word-reading.morphology]
  vocabulary: { en: [exception word, tricky part, silent letter, sound, spelling] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: sound-out-everything
      what: Sounds out an exception word letter by letter (is-land, wo-men)
      addressed: Learn names the tricky part of each word and how it really sounds
    - id: spelling-by-sound
      what: Chooses a spelling that matches the sound (hart for heart, wimmin for women)
      addressed: lesson 2 sets the sound-alike spelling as an option, with feedback
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der schwierige Teil, en: The tricky part }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What does reread mean?"
            options: ["read again", "not read", "read wrongly"]
            answer: "read again"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tap the root word."
            say: "The word is split into parts. Tap the root word."
            show: { drawn: letter-card, text: "un kind ly" }
            spans: ["kind"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "island"
            say: "Some words do not sound the way they look. In island, the s is silent. We say i-land."
            show: { drawn: letter-card, text: "i s l a n d" }
          - text: "heart   women"
            say: "In heart, the e is silent and ear sounds like ar: heart. In women, the o sounds like i: women."
          - text: "Find the tricky part"
            say: "To learn a tricky word, find the part that does not follow the usual rules. Look at it hard, then read the whole word."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "The word island is split into letters. Tap the letter you do not hear."
                show: { drawn: letter-card, text: "i s l a n d" }
                spans: ["s"]
                hints:
                  - "Say the word: island."
                  - "Do you hear an s?"
                  - "The s is silent."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How does the ear in heart sound?"
                say: "In the word heart, how do the letters e, a and r sound?"
                options: ["like ar in car", "like ear in hear", "like air in hair"]
                answer: "like ar in car"
                option_audio: false
                hints:
                  - "Say heart out loud."
                  - "It rhymes with part."
                  - "Like ar in car."
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "The word knowledge is split into letters. Tap the letter at the start that you do not hear."
                show: { drawn: letter-card, text: "k n o w l e d g e" }
                spans: ["k"]
                hints:
                  - "Say knowledge."
                  - "It starts with an n sound."
                  - "The k is silent."
              - id: l1-f4
                type: true_false
                text: "Is it true? In women, the o sounds like i."
                answer: true
                hints:
                  - "Say women."
                  - "We say wimmin."
                  - "Yes."
              - id: l1-f5
                type: multiple_choice
                text: "What is tricky about February?"
                say: "What is tricky about the word February?"
                options: ["the first r is often not said", "the y is silent", "the F sounds like v"]
                answer: "the first r is often not said"
                option_audio: false
                hints:
                  - "Say it slowly: Feb-ru-ary."
                  - "Many people say Feb-yoo-ary."
                  - "The first r is easy to miss."
              - id: l1-f6
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "bicycle" }
                options: [{ object: bike }, { object: bus }, { object: car }]
                answer: bike
                hints:
                  - "Bi- means two."
                  - "The y sounds like i: bi-sick-le."
                  - "A bicycle is a bike."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "The word answer is split into letters. Tap the letter you do not hear."
                show: { drawn: letter-card, text: "a n s w e r" }
                spans: ["w"]
                hints: ["Say answer. Is there a w sound?"]
              - id: l1-s2
                type: multiple_choice
                text: "How does the ui in fruit sound?"
                say: "In the word fruit, how do the letters u and i sound?"
                options: ["like oo in moon", "like ui in ruin", "like i in pin"]
                answer: "like oo in moon"
                option_audio: false
                hints: ["Fruit rhymes with boot."]
              - id: l1-s3
                type: true_false
                text: "Is it true? In guard, the u is silent."
                answer: true
                hints: ["We say gard."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "The word often is split into letters. Many people do not say one of them. Tap it."
                show: { drawn: letter-card, text: "o f t e n" }
                spans: ["t"]
                hints: ["Offen."]
              - id: l1-s5
                type: multiple_choice
                text: "How does the ei in eight sound?"
                say: "In the word eight, how do the letters e and i sound?"
                options: ["like ay in play", "like ee in see", "like i in sit"]
                answer: "like ay in play"
                option_audio: false
                hints: ["Eight rhymes with late."]
              - id: l1-s6
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "fruit" }
                options: [{ object: frog }, { object: apple }, { object: fish }]
                answer: apple
                hints: ["Which one is a fruit?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "The word castle is split into letters. Tap the letter you do not hear."
                show: { drawn: letter-card, text: "c a s t l e" }
                spans: ["t"]
              - id: l1-n2
                type: multiple_choice
                text: "How does the ough in thought sound?"
                say: "In the word thought, how do the letters o, u, g and h sound?"
                options: ["like or in fork", "like oo in moon", "like off in office"]
                answer: "like or in fork"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Is it true? In build, the u is silent."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "What is tricky about busy?"
                say: "What is tricky about the word busy?"
                options: ["the u sounds like i", "the s is silent", "the y sounds like igh"]
                answer: "the u sounds like i"
                option_audio: false
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "The word guide is split into letters. Tap the letter after g that you do not hear."
                show: { drawn: letter-card, text: "g u i d e" }
                spans: ["u"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the silent letter."
            say: "The word listen is split into letters. Tap the letter you do not hear."
            show: { drawn: letter-card, text: "l i s t e n" }
            spans: ["t"]
          - id: l1-c2
            type: true_false
            text: "Is it true? In heart, the ear sounds like ar."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "How does the ei in weight sound?"
            say: "In the word weight, how do the letters e and i sound?"
            options: ["like ay in play", "like ee in see", "like igh in high"]
            answer: "like ay in play"
            option_audio: false

  - n: 2
    title: { de: Schwierige Wörter im Satz, en: Tricky words in sentences }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the silent letter."
            say: "The word island is split into letters. Tap the letter you do not hear."
            show: { drawn: letter-card, text: "i s l a n d" }
            spans: ["s"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? In women, the o sounds like i."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Which spelling is right?"
            say: "When you hear a tricky word, the spelling that matches the sound is often wrong. You hear hart, but the word is spelt heart."
          - text: "heart, not hart"
            say: "So for tricky words, picture the word you have read, not the sounds you hear."
          - text: "The women walked to the island."
            say: "Read the sentence. Two tricky words: women and island. Read them as wholes: The women walked to the island."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: "Listen to the word. Tap the right spelling."
                audio: { en: "Heart." }
                options: ["hart", "heart", "haert"]
                answer: "heart"
                feedback:
                  "hart": "Hart matches the sound, but heart has an e and an a: h e a r t."
                hints:
                  - "It is a tricky word."
                  - "The spelling has a silent e."
                  - "h e a r t."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tap the tricky word."
                say: "Read the sentence. Tap the tricky word."
                show: { drawn: letter-card, text: "We sailed to an island" }
                spans: ["island"]
                hints:
                  - "Which word does not sound the way it looks?"
                  - "One word has a silent s."
                  - "Island."
              - id: l2-f3
                type: audio_choice
                say: "Listen to the word. Tap the right spelling."
                audio: { en: "Women." }
                options: ["wimmin", "women", "wemen"]
                answer: "women"
                hints:
                  - "It is spelt like woman."
                  - "w o m e n."
                  - "Women."
              - id: l2-f4
                type: true_false
                text: "Our class goes to the library every week."
                say: "Read the sentence. Is library spelt correctly?"
                answer: true
                hints:
                  - "Look for both r's."
                  - "l i b r a r y."
                  - "Yes."
              - id: l2-f5
                type: audio_choice
                say: "Listen to the word. Tap the right spelling."
                audio: { en: "Guard." }
                options: ["gard", "guard", "guarde"]
                answer: "guard"
                hints:
                  - "There is a silent letter after the g."
                  - "g u a r d."
                  - "Guard."
              - id: l2-f6
                type: multiple_choice
                text: "Which sentence is spelt correctly?"
                options: ["I have eight sweets.", "I have ate sweets.", "I have ayt sweets."]
                answer: "I have eight sweets."
                option_audio: false
                hints:
                  - "Which spelling is the number?"
                  - "Ate is from eat."
                  - "Eight."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: "Listen to the word. Tap the right spelling."
                audio: { en: "Answer." }
                options: ["anser", "answer", "answere"]
                answer: "answer"
                hints: ["Silent w."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tap the tricky word."
                say: "Read the sentence. Tap the tricky word."
                show: { drawn: letter-card, text: "I am very busy today" }
                spans: ["busy"]
                hints: ["The u sounds like i."]
              - id: l2-s3
                type: true_false
                text: "Bananas are my favourite frute."
                say: "Read the sentence. Is every word spelt correctly?"
                answer: false
                hints: ["Fruit is spelt f r u i t."]
              - id: l2-s4
                type: audio_choice
                say: "Listen to the word. Tap the right spelling."
                audio: { en: "Build." }
                options: ["bild", "build", "biuld"]
                answer: "build"
                hints: ["There is a silent u."]
              - id: l2-s5
                type: multiple_choice
                text: "Which sentence is spelt correctly?"
                options: ["I often walk to school.", "I offen walk to school.", "I ofen walk to school."]
                answer: "I often walk to school."
                option_audio: false
                hints: ["Often has a t."]
              - id: l2-s6
                type: highlight_in_text
                text: "Tap the tricky word."
                say: "Read the sentence. Tap the tricky word."
                show: { drawn: letter-card, text: "The guard opened the gate" }
                spans: ["guard"]
                hints: ["Silent u."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: "Listen to the word. Tap the right spelling."
                audio: { en: "Island." }
                options: ["iland", "island", "eyeland"]
                answer: "island"
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the tricky word."
                say: "Read the sentence. Tap the tricky word."
                show: { drawn: letter-card, text: "My birthday is in February" }
                spans: ["February"]
              - id: l2-n3
                type: true_false
                text: "The dog heard a strange noise."
                say: "Read the sentence. Is every word spelt correctly?"
                answer: true
              - id: l2-n4
                type: audio_choice
                say: "Listen to the word. Tap the right spelling."
                audio: { en: "Thought." }
                options: ["thort", "thought", "thoght"]
                answer: "thought"
              - id: l2-n5
                type: multiple_choice
                text: "Which sentence is spelt correctly?"
                options: ["I can hear my heart beat.", "I can hear my hart beat.", "I can here my heart beat."]
                answer: "I can hear my heart beat."
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tap the silent letter."
            say: "The word knowledge is split into letters. Tap the letter you do not hear."
            show: { drawn: letter-card, text: "k n o w l e d g e" }
            spans: ["k"]
          - id: l2-c2
            type: audio_choice
            say: "Listen to the word. Tap the right spelling."
            audio: { en: "Weight." }
            options: ["wate", "weight", "waite"]
            answer: "weight"
          - id: l2-c3
            type: highlight_in_text
            text: "Tap the tricky word."
            say: "Read the sentence. Tap the tricky word."
            show: { drawn: letter-card, text: "Two women ran a shop" }
            spans: ["women"]
          - id: l2-c4
            type: true_false
            text: "I want to bild a den."
            say: "Read the sentence. Is every word spelt correctly?"
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "How does the ear in heard sound?"
            say: "In the word heard, how do the letters e, a and r sound?"
            options: ["like er in her", "like ear in hear", "like ar in car"]
            answer: "like er in her"
            option_audio: false
