# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-g-o-c-k
skill: lit-en.phonics.g-o-c-k
curriculum: en-GB
language: en
title:
  de: Die Laute g, o, c, k
  en: The sounds g, o, c, k
summary: >
  The third set of phonics letters. Lesson 1 links g, o, c and k to their
  sounds, and shows that c and k make the same sound; lesson 2 blends them
  with the letters so far into words (on, dog, cat, kit) and ends with the
  skill check. The sounds are played from the sound bank, never as letter
  names.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonics.i-n-m-d]
  also_practises: [lit-en.phonics.s-a-t-p, lit-en.phonics.i-n-m-d]
  vocabulary: { en: [sound, letter, blend, word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.g, en.o, en.k]
  facets: []
  misconceptions:
    - id: c-k-different
      what: Thinks c and k make different sounds, or picks only one of them for the sound
      addressed: lesson 1 Learn plays one sound for both letters; the click-sound picture task in every stage of lesson 1 has an answer spelt with k (kite in l1-f3) or with c (cup in l1-s3, crayon in l1-n3), and the l1-f3 hints say cat starts with the same sound; no task asks which one letter makes the click, so c and k never compete as options
    - id: g-k-mixup
      what: Mixes up g and the c/k sound, both made at the back of the throat
      addressed: g and c or k share an option set in every stage of lesson 1 (l1-f1, l1-s2, l1-n1), with feedback in l1-f1, l1-f3 and l1-f5; lesson 2 sets got against cot in l2-f1, gap against cap in l2-f5 and g against c and k in l2-s2
    - id: o-a-vowel
      what: Hears the middle vowel wrong (cot as cat)
      addressed: lesson 2 sets o against a in every stage, with the two words differing only in the middle sound (top or tap in l2-f2, with feedback; pot and pat in l2-s1, top and tap in l2-s3; map and mop in l2-n1)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "g, o, c, k", en: "g, o, c, k" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "g"
            say: "This letter makes a sound from the back of your throat. Gorilla, garden and gate all start with it. Listen."
            show: { drawn: letter-card, text: "g" }
            sound: en.g
          - text: "o"
            say: "This letter makes a short sound with a round mouth. Ostrich, otter and olive all start with it. Listen."
            show: { drawn: letter-card, text: "o" }
            sound: en.o
          - text: "c"
            say: "This letter makes a short sound, like a click. Comb, cave and cookie all start with it. Listen."
            show: { drawn: letter-card, text: "c" }
            sound: en.k
          - text: "k"
            say: "This letter makes the same sound. Kangaroo, king and kettle all start with it. Two letters, one sound. Listen."
            show: { drawn: letter-card, text: "k" }
            sound: en.k

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.g }
                options: ["g", "o", "c"]
                answer: "g"
                feedback:
                  "c": "That letter makes a click, like in comb. This sound is softer, like in gorilla."
                hints:
                  - "Listen again. It comes from the back of your throat."
                  - "Gorilla starts with this sound."
                  - "It is the letter with a tail that hangs down."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "o" }
                options: [{ object: octopus }, { object: apple }, { object: egg }]
                answer: octopus
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts like otter?"
                  - "Octopus starts with this letter. Tap the octopus."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                text: "What starts with this sound?"
                say: "Listen to the sound. Which picture starts with it?"
                audio: { sound: en.k }
                options: [{ object: kite }, { object: goat }, { object: sun }]
                answer: kite
                feedback:
                  goat: "Goat starts with the softer sound, like in gorilla. Listen for the click."
                hints:
                  - "Say the name of each picture. Listen to the start."
                  - "Which one starts like kangaroo? Cat starts with this sound too."
                  - "Kite starts with the click sound. Tap the kite."
              - id: l1-f4
                type: true_false
                text: "Does it start with this letter?"
                say: "Cat. Does cat start with this letter?"
                show: { drawn: letter-card, text: "c" }
                answer: true
                hints:
                  - "Say cat slowly. Listen to the start."
                  - "It starts with a click, like comb."
                  - "Yes, cat starts with this letter."
              - id: l1-f5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "g" }
                options: [{ object: cake }, { object: girl }, { object: dog }]
                answer: girl
                feedback:
                  cake: "Cake starts with a click. This letter is softer, like in gorilla."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts like garden?"
                  - "Girl starts with this letter. Tap the girl."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.o }
                options: ["a", "o", "i"]
                answer: "o"
                hints: ["Listen again. Is your mouth round?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "k" }
                options: [{ object: girl }, { object: kite }, { object: moon }]
                answer: kite
                hints: ["Which one starts like kangaroo?"]
              - id: l1-s3
                type: audio_choice
                text: "What starts with this sound?"
                say: "Listen to the sound. Which picture starts with it?"
                audio: { sound: en.k }
                options: [{ object: goat }, { object: pig }, { object: cup }]
                answer: cup
                hints: ["Is it a click or the softer sound?"]
              - id: l1-s4
                type: true_false
                text: "Does it start with this letter?"
                say: "Goat. Does goat start with this letter?"
                show: { drawn: letter-card, text: "c" }
                answer: false
                hints: ["Say goat slowly. Is the start a click?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "o" }
                options: [{ object: orange }, { object: ant }, { object: fish }]
                answer: orange
                hints: ["Which one starts with a round mouth?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.g }
                options: ["d", "k", "g"]
                answer: "g"
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "c" }
                options: [{ object: car }, { object: goat }, { object: bed }]
                answer: car
              - id: l1-n3
                type: audio_choice
                text: "What starts with this sound?"
                say: "Listen to the sound. Which picture starts with it?"
                audio: { sound: en.k }
                options: [{ object: girl }, { object: crayon }, { object: dog }]
                answer: crayon
              - id: l1-n4
                type: true_false
                text: "Does it start with this letter?"
                say: "Octopus. Does octopus start with this letter?"
                show: { drawn: letter-card, text: "o" }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "k" }
                options: [{ object: kite }, { object: goat }, { object: orange }]
                answer: kite

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.o }
            options: ["o", "g", "a"]
            answer: "o"
          - id: l1-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "g" }
            options: [{ object: cow }, { object: goat }, { object: sun }]
            answer: goat
          - id: l1-c3
            type: true_false
            text: "Does it start with this letter?"
            say: "Clock. Does clock start with this letter?"
            show: { drawn: letter-card, text: "c" }
            answer: true

  - n: 2
    title: { de: "on, dog, cat", en: "on, dog, cat" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "o n → on"
            say: "Two sounds. Say them slowly, then push them together: on. The hat is on the cat."
            show: { drawn: letter-card, text: "o n" }
          - text: "d o g → dog"
            say: "Point to each letter and say its sound. Then push them together: dog."
            show: { drawn: letter-card, text: "d o g" }
          - text: "c a t → cat"
            say: "This word starts with the click sound. Slowly, then fast: cat."
            show: { drawn: letter-card, text: "c a t" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "got" }
                options: ["got", "cot", "pot"]
                answer: "got"
                feedback:
                  "cot": "Cot starts with a click. Got starts with the softer sound, like gorilla."
                hints:
                  - "Listen to the first sound."
                  - "Is it a click or the softer sound?"
                  - "Got."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which letter finishes the word?"
                say: "Top. Which letter is missing in the middle of top?"
                frame: "t_p"
                options: ["o", "a", "i"]
                answer: ["o"]
                feedback:
                  "a": "That makes tap. In top your mouth is round in the middle."
                hints:
                  - "Say top slowly: the first sound, the middle sound, the last sound."
                  - "Your mouth is round in the middle."
                  - "It is the round letter, like in octopus."
              - id: l2-f3
                type: true_false
                text: "Is this the word?"
                say: "Kit. Does the card say kit?"
                show: { drawn: letter-card, text: "kit" }
                answer: true
                hints:
                  - "Say each sound."
                  - "Push them together, faster."
                  - "Yes, it says kit."
              - id: l2-f4
                type: fill_in_blank
                text: "Which letter finishes the word?"
                say: "Dig. Which letter is missing at the end of dig?"
                frame: "di_"
                options: ["g", "k", "d"]
                answer: ["g"]
                hints:
                  - "Say dig slowly. Listen to the end."
                  - "The last sound is the softer one, like the start of gorilla."
                  - "It is the letter with a tail that hangs down."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "cap" }
                options: ["gap", "cap", "kit"]
                answer: "cap"
                feedback:
                  "gap": "Gap starts with the softer sound, like gorilla. Cap starts with a click."
                hints:
                  - "Listen to the first sound, then the middle."
                  - "It starts with a click, and the middle is the sound in ant."
                  - "Cap."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "pot" }
                options: ["pat", "pot", "pit"]
                answer: "pot"
                hints: ["Listen to the middle sound."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which letter finishes the word?"
                say: "Gap. Which letter is missing at the start of gap?"
                frame: "_ap"
                options: ["c", "g", "k"]
                answer: ["g"]
                hints: ["Is the start a click or the softer sound?"]
              - id: l2-s3
                type: true_false
                text: "Is this the word?"
                say: "Top. Does the card say top?"
                show: { drawn: letter-card, text: "tap" }
                answer: false
                hints: ["Look at the middle letter. Is your mouth round for it?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Which letter finishes the word?"
                say: "Mop. Which letter is missing in the middle of mop?"
                frame: "m_p"
                options: ["i", "a", "o"]
                answer: ["o"]
                hints: ["Say mop slowly. Listen to the middle."]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "kid" }
                options: ["kit", "kid", "did"]
                answer: "kid"
                hints: ["Listen to the start and to the end."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "map" }
                options: ["mop", "map", "got"]
                answer: "map"
              - id: l2-n2
                type: fill_in_blank
                text: "Which letter finishes the word?"
                say: "Nod. Which letter is missing in the middle of nod?"
                frame: "n_d"
                options: ["o", "a", "i"]
                answer: ["o"]
              - id: l2-n3
                type: true_false
                text: "Is this the word?"
                say: "Gap. Does the card say gap?"
                show: { drawn: letter-card, text: "gap" }
                answer: true
              - id: l2-n4
                type: fill_in_blank
                text: "Which letter finishes the word?"
                say: "Can. Which letter is missing at the start of can?"
                frame: "_an"
                options: ["g", "c", "d"]
                answer: ["c"]
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "pig" }
                options: ["dig", "pig", "pin"]
                answer: "pig"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.g }
            options: ["t", "g", "d"]
            answer: "g"
          - id: l2-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "c" }
            options: [{ object: girl }, { object: cake }, { object: octopus }]
            answer: cake
          - id: l2-c3
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "dot" }
            options: ["dot", "dig", "got"]
            answer: "dot"
          - id: l2-c4
            type: fill_in_blank
            text: "Which letter finishes the word?"
            say: "Tag. Which letter is missing at the end of tag?"
            frame: "ta_"
            options: ["k", "g", "p"]
            answer: ["g"]
