# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.justify-views
skill: lit-en.comprehension.justify-views
curriculum: en-GB
language: en
title:
  de: Meinungen mit Belegen begründen
  en: Backing up views with evidence
summary: >
  A good answer about a text gives a view, a reason, and evidence from the
  text (point, evidence, explain). Lesson 1 matches views to the evidence
  that supports them in short original passages; lesson 2 picks the
  strongest evidence, spots answers with no evidence, and builds a full
  point-evidence-explain answer, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Wie Texte funktionieren, en: How texts work }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.comprehension.inference-evidence]
  also_practises: [lit-en.comprehension.retrieve-present]
  vocabulary: { en: [view, reason, evidence, quotation, point, explain, suggests, shows] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: opinion-without-evidence
      what: States a view with no evidence from the text ("I think she is sad because I just do")
      addressed: lesson 2 asks which answers have evidence; feedback names the missing part
    - id: evidence-not-linked
      what: Quotes a line that does not support the view
      addressed: options include a real quotation that does not fit the view, with feedback
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Welcher Beleg passt?, en: Which evidence fits? }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "\"The film lasts 95 minutes.\" Fact or opinion?"
            say: "Read the sentence. Is it a fact or an opinion?"
            options: ["fact", "opinion"]
            answer: "fact"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word in a text often shows a character is nervous?"
            options: ["trembling", "laughing", "yawning"]
            answer: "trembling"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Jas stared at the stage. Her hands were shaking and she kept checking the door."
            say: "Read the passage. What view could you have about Jas? Perhaps: Jas is nervous."
          - text: "Point: Jas is nervous.\nEvidence: \"Her hands were shaking.\"\nExplain: Shaking hands are a sign of nerves."
            say: "A strong answer has three parts. The point is your view. The evidence is words from the text, in quotation marks. The explanation says how the evidence shows your point."
          - text: "Not evidence: \"Jas stared at the stage.\""
            say: "Be careful: this line is from the text, but on its own it does not show she is nervous. Choose evidence that really supports your point."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Tom slammed the door and threw his bag on the floor. He would not speak to anyone at dinner.\n\nView: Tom is angry. Which quotation best supports this?"
                say: "Read the passage and the view. Which quotation best supports it?"
                options: ["\"Tom slammed the door\"", "\"at dinner\"", "\"his bag\""]
                answer: "\"Tom slammed the door\""
                option_audio: false
                feedback:
                  "\"at dinner\"": "These words are in the text, but they do not show anger."
                hints:
                  - "Which words show a feeling?"
                  - "Slamming a door shows anger."
                  - "\"Tom slammed the door.\""
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "The old house had broken windows, and ivy covered the walls. Nobody had opened the gate for years.\n\nView: The house has been empty for a long time. Which quotation best supports this?"
                say: "Read the passage and the view. Which quotation best supports it?"
                options: ["\"Nobody had opened the gate for years\"", "\"The old house\"", "\"covered the walls\""]
                answer: "\"Nobody had opened the gate for years\""
                option_audio: false
                hints:
                  - "Which words tell you about time?"
                  - "For years."
                  - "\"Nobody had opened the gate for years.\""
              - id: l1-f3
                type: true_false
                text: "Priya smiled all the way home and hugged her mum at the door.\n\nView: Priya is happy. Evidence: \"hugged her mum\". Does the evidence support the view?"
                say: "Read the passage, the view and the evidence. Does the evidence support the view?"
                answer: true
                hints:
                  - "Do people hug when they are happy?"
                  - "Smiling and hugging both show it."
                  - "Yes."
              - id: l1-f4
                type: multiple_choice
                text: "The fox crept closer, keeping low in the grass, its eyes fixed on the hens.\n\nWhich view does this evidence best support?"
                say: "Read the passage. Which view does it best support?"
                options: ["The fox is planning to catch a hen.", "The fox is tired.", "The fox is lost."]
                answer: "The fox is planning to catch a hen."
                option_audio: false
                hints:
                  - "What does crept and eyes fixed suggest?"
                  - "It is hunting."
                  - "It plans to catch a hen."
              - id: l1-f5
                type: true_false
                text: "Leo yawned again and again, and his eyes kept closing during the story.\n\nView: Leo is bored. Evidence: \"his eyes kept closing\". Is this the only possible view?"
                say: "Read the passage. Is boredom the only possible view?"
                answer: false
                hints:
                  - "Could there be another reason for yawning?"
                  - "He might be tired."
                  - "No: tired is possible too."
              - id: l1-f6
                type: multiple_choice
                text: "Grandad kept every letter she had ever sent him, tied with a ribbon in a box by his bed.\n\nView: Grandad loves his granddaughter. Which quotation best supports this?"
                say: "Read the passage and the view. Which quotation best supports it?"
                options: ["\"kept every letter she had ever sent him\"", "\"by his bed\"", "\"in a box\""]
                answer: "\"kept every letter she had ever sent him\""
                option_audio: false
                hints:
                  - "What shows he cares?"
                  - "He keeps every letter."
                  - "\"kept every letter she had ever sent him\""

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The crowd jumped to their feet, cheering and waving scarves as the ball hit the net.\n\nView: The crowd is excited. Which quotation best supports this?"
                say: "Read the passage and the view. Which quotation best supports it?"
                options: ["\"cheering and waving scarves\"", "\"the ball\"", "\"the net\""]
                answer: "\"cheering and waving scarves\""
                option_audio: false
                hints: ["Which words show a feeling?"]
              - id: l1-s2
                type: true_false
                text: "Mo hid behind the sofa when the thunder began.\n\nView: Mo is frightened. Evidence: \"behind the sofa\". Does the evidence support the view?"
                say: "Read the passage, the view and the evidence. Does the evidence support the view?"
                answer: true
                hints: ["Why do people hide?"]
              - id: l1-s3
                type: multiple_choice
                text: "Every morning Ava fed the birds, filled their water bowl and checked the nest box.\n\nWhich view does this evidence best support?"
                say: "Read the passage. Which view does it best support?"
                options: ["Ava cares about the birds.", "Ava is afraid of birds.", "Ava is late for school."]
                answer: "Ava cares about the birds."
                option_audio: false
                hints: ["What does she do every morning?"]
              - id: l1-s4
                type: multiple_choice
                text: "The path was icy and the wind howled. Sam's fingers were numb inside his gloves.\n\nView: It is very cold. Which quotation best supports this?"
                say: "Read the passage and the view. Which quotation best supports it?"
                options: ["\"Sam's fingers were numb\"", "\"The path\"", "\"inside his gloves\""]
                answer: "\"Sam's fingers were numb\""
                option_audio: false
                hints: ["Which words show cold?"]
              - id: l1-s5
                type: true_false
                text: "Isla read the last page, closed the book and sighed with a smile.\n\nView: Isla enjoyed the book. Evidence: \"closed the book\". Is this the best evidence?"
                say: "Read the passage. Is closed the book the best evidence?"
                answer: false
                hints: ["Which words show enjoyment?"]
              - id: l1-s6
                type: multiple_choice
                text: "The dog wagged its tail so hard its whole body wiggled when Dad came home.\n\nWhich view does this evidence best support?"
                say: "Read the passage. Which view does it best support?"
                options: ["The dog is pleased to see Dad.", "The dog is hungry.", "The dog is cold."]
                answer: "The dog is pleased to see Dad."
                option_audio: false
                hints: ["Why do dogs wag their tails?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ruby checked the clock, tapped her foot and sighed loudly as the queue moved slowly.\n\nView: Ruby is impatient. Which quotation best supports this?"
                say: "Read the passage and the view. Which quotation best supports it?"
                options: ["\"tapped her foot and sighed loudly\"", "\"the clock\"", "\"the queue\""]
                answer: "\"tapped her foot and sighed loudly\""
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "The kitchen smelled of fresh bread, and the table was laid with the best plates.\n\nView: The family is getting ready for a special meal. Evidence: \"the best plates\". Does the evidence support the view?"
                say: "Read the passage, the view and the evidence. Does the evidence support the view?"
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Kai had not won a single race all year, but he trained every evening in the rain.\n\nWhich view does this evidence best support?"
                say: "Read the passage. Which view does it best support?"
                options: ["Kai is determined.", "Kai is lazy.", "Kai likes the rain."]
                answer: "Kai is determined."
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Lena whispered the answer and looked down at her shoes when the teacher praised her.\n\nView: Lena is shy. Which quotation best supports this?"
                say: "Read the passage and the view. Which quotation best supports it?"
                options: ["\"looked down at her shoes\"", "\"the teacher\"", "\"the answer\""]
                answer: "\"looked down at her shoes\""
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Ben laughed so hard at the joke that he nearly fell off his chair.\n\nView: Ben found the joke funny. Is \"nearly fell off his chair\" good evidence?"
                say: "Read the passage. Is that good evidence for the view?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The baby's cheeks were wet and she would not stop wailing.\n\nView: The baby is upset. Which quotation best supports this?"
            say: "Read the passage and the view. Which quotation best supports it?"
            options: ["\"would not stop wailing\"", "\"The baby's cheeks\"", "\"she\""]
            answer: "\"would not stop wailing\""
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Ms Hill handed out stickers, laughed at the class's jokes and let them choose the story.\n\nWhich view does this evidence best support?"
            say: "Read the passage. Which view does it best support?"
            options: ["Ms Hill is a kind teacher.", "Ms Hill is strict.", "Ms Hill is unwell."]
            answer: "Ms Hill is a kind teacher."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "The garden was full of weeds and the swing hung by one rope.\n\nView: Nobody looks after the garden. Evidence: \"full of weeds\". Does the evidence support the view?"
            say: "Read the passage, the view and the evidence. Does the evidence support the view?"
            answer: true

  - n: 2
    title: { de: "Punkt, Beleg, Erklärung", en: "Point, evidence, explain" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ella hugged the puppy and would not put it down.\n\nView: Ella loves the puppy. Which quotation best supports this?"
            say: "Read the passage and the view. Which quotation best supports it?"
            options: ["\"would not put it down\"", "\"the puppy\"", "\"Ella\""]
            answer: "\"would not put it down\""
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? Evidence is words taken from the text."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I think the giant is lonely."
            say: "This answer has a point but no evidence. A reader cannot tell why you think it."
          - text: "I think the giant is lonely because \"he sat by the window every evening, waiting for a visitor\"."
            say: "Now it has evidence. It is better, but it still does not explain the link."
          - text: "… This shows he wants company, because he hopes someone will come."
            say: "The explanation finishes it: point, evidence, explain. That is a full answer."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which answer gives evidence from the text?"
                options: ["The king is greedy because \"he kept all the gold for himself\".", "The king is greedy because I think so.", "The king is greedy."]
                answer: "The king is greedy because \"he kept all the gold for himself\"."
                option_audio: false
                feedback:
                  "The king is greedy because I think so.": "I think so is a reason from you, not from the text. Use words from the story."
                hints:
                  - "Evidence uses words from the text."
                  - "Look for quotation marks."
                  - "The first answer."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Put the answer in the order point, evidence, explain."
                options: ["This shows she wants to win.", "Mia is competitive.", "\"She practised her serve until dark.\""]
                slot_count: 3
                answer: ["Mia is competitive.", "\"She practised her serve until dark.\"", "This shows she wants to win."]
                option_audio: false
                hints:
                  - "The point comes first."
                  - "Then the quotation, then the explanation."
                  - "Point, evidence, explain."
              - id: l2-f3
                type: true_false
                text: "\"I think the wolf is clever.\"\n\nDoes this answer have evidence?"
                say: "Read the answer. Does it have evidence from the text?"
                answer: false
                feedback:
                  "true": "There are no words from the text. It is a point only."
                hints:
                  - "Are there words from the text?"
                  - "There are no quotation marks."
                  - "No, it is only a point."
              - id: l2-f4
                type: multiple_choice
                text: "The knight rode into the dark forest alone, although every villager had warned him.\n\nWhich is the best full answer?"
                say: "Read the passage. Which is the best full answer?"
                options: ["The knight is brave because \"he rode into the dark forest alone\"; this shows he is not afraid of danger.", "The knight is brave.", "The knight is brave because he has a horse."]
                answer: "The knight is brave because \"he rode into the dark forest alone\"; this shows he is not afraid of danger."
                option_audio: false
                hints:
                  - "A full answer has point, evidence and explanation."
                  - "Only one has all three."
                  - "The first answer."
              - id: l2-f5
                type: multiple_choice
                text: "Which explanation best links the evidence to the point?\nPoint: Max is worried.\nEvidence: \"He bit his nails and kept looking at the phone.\""
                options: ["This shows he is anxious about news.", "Phones are useful.", "Max has nails."]
                answer: "This shows he is anxious about news."
                option_audio: false
                hints:
                  - "The explanation says how the evidence shows the point."
                  - "Biting nails and checking the phone are signs of worry."
                  - "This shows he is anxious about news."
              - id: l2-f6
                type: true_false
                text: "Is it true? A full answer has a point, evidence and an explanation."
                answer: true
                hints:
                  - "Remember the three parts."
                  - "Point, evidence, explain."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which answer gives evidence from the text?"
                options: ["The town is poor because \"the shops were boarded up\".", "The town is poor, I just know.", "The town is poor."]
                answer: "The town is poor because \"the shops were boarded up\"."
                option_audio: false
                hints: ["Look for words from the text."]
              - id: l2-s2
                type: ordering
                text: "Put the answer in the order point, evidence, explain."
                options: ["\"He gave his coat to the shivering boy.\"", "This shows he puts others first.", "Raj is generous."]
                slot_count: 3
                answer: ["Raj is generous.", "\"He gave his coat to the shivering boy.\"", "This shows he puts others first."]
                option_audio: false
                hints: ["Point first."]
              - id: l2-s3
                type: true_false
                text: "\"Lily is kind because she shared her lunch with a new girl.\"\n\nDoes this answer have evidence?"
                say: "Read the answer. Does it give a reason from the story?"
                answer: true
                hints: ["It says what Lily did."]
              - id: l2-s4
                type: multiple_choice
                text: "Which explanation best links the evidence to the point?\nPoint: The storm was dangerous.\nEvidence: \"Trees crashed onto the road.\""
                options: ["This shows the wind was strong enough to cause harm.", "Roads are long.", "Trees are green."]
                answer: "This shows the wind was strong enough to cause harm."
                option_audio: false
                hints: ["How does the evidence show danger?"]
              - id: l2-s5
                type: multiple_choice
                text: "What is missing from this answer?\n\"The witch is cruel because 'she locked the children in the tower'.\""
                options: ["an explanation", "a point", "evidence"]
                answer: "an explanation"
                hints: ["It has a point and evidence."]
              - id: l2-s6
                type: true_false
                text: "Is it true? Any sentence from the text is good evidence for any point."
                answer: false
                hints: ["The evidence must support the point."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which answer gives evidence from the text?"
                options: ["The robot is curious because \"it opened every door it found\".", "The robot is curious, obviously.", "The robot is curious."]
                answer: "The robot is curious because \"it opened every door it found\"."
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Put the answer in the order point, evidence, explain."
                options: ["This shows she has not slept.", "\"Her eyes had dark rings and she yawned all morning.\"", "Amy is exhausted."]
                slot_count: 3
                answer: ["Amy is exhausted.", "\"Her eyes had dark rings and she yawned all morning.\"", "This shows she has not slept."]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "What is missing from this answer?\n\"I think the prince is spoilt.\""
                options: ["evidence and an explanation", "a point", "nothing"]
                answer: "evidence and an explanation"
              - id: l2-n4
                type: true_false
                text: "\"The cat is hungry because 'it meowed by its empty bowl'. This shows it wants food.\"\n\nIs this a full answer?"
                say: "Read the answer. Is it a full answer?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Which explanation best links the evidence to the point?\nPoint: The sea was calm.\nEvidence: \"The boat barely rocked.\""
                options: ["This shows there were no big waves.", "Boats float.", "The sea is blue."]
                answer: "This shows there were no big waves."
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "The girl ran past the gate three times, too scared to knock on the door.\n\nView: The girl is nervous. Which quotation best supports this?"
            say: "Read the passage and the view. Which quotation best supports it?"
            options: ["\"too scared to knock on the door\"", "\"past the gate\"", "\"three times\""]
            answer: "\"too scared to knock on the door\""
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Which answer gives evidence from the text?"
            options: ["The owl is wise because \"the animals came to it for advice\".", "The owl is wise, as all owls are.", "The owl is wise."]
            answer: "The owl is wise because \"the animals came to it for advice\"."
            option_audio: false
          - id: l2-c3
            type: ordering
            text: "Put the answer in the order point, evidence, explain."
            options: ["This shows he did not want anyone to know.", "Jack is secretive.", "\"He hid the map under a loose floorboard.\""]
            slot_count: 3
            answer: ["Jack is secretive.", "\"He hid the map under a loose floorboard.\"", "This shows he did not want anyone to know."]
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "What is missing from this answer?\n\"The dragon is lonely because 'it flew over the village every night, watching the lights'.\""
            options: ["an explanation", "a point", "evidence"]
            answer: "an explanation"
          - id: l2-c5
            type: true_false
            text: "\"I think the story is sad.\"\n\nDoes this answer have evidence?"
            say: "Read the answer. Does it have evidence from the text?"
            answer: false
