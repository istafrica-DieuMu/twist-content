# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-y-z-qu
skill: lit-en.phonics.y-z-qu
curriculum: en-GB
language: en
title:
  de: Die Laute y, z, zz, qu
  en: The sounds y, z, zz, qu
summary: >
  The last letters of the first phonics phase. Lesson 1 links y and z to
  their sounds and shows that q always comes with u to make one sound
  (queen); lesson 2 adds zz at the end of a short word (buzz), blends
  words with all the letters (yes, zip, quiz, fizz), and ends with the
  skill check. The sounds are played from the sound bank, never as letter
  names.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonics.j-v-w-x]
  also_practises: [lit-en.phonics.j-v-w-x]
  vocabulary: { en: [sound, letter, blend, word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.y, en.z, en.kw]
  facets: []
  misconceptions:
    - id: q-alone
      what: Writes q without u, or reads qu as two separate sounds
      addressed: lesson 1 Learn shows q and u together on one card and says they make one sound; every qu task uses the two letters together, and the lesson 2 spelling tasks offer q alone as a wrong option (l2-f2 with feedback, l2-s2, l2-n2)
    - id: z-s-mixup
      what: Mixes up z and s, which are made the same way except for the buzz
      addressed: z and s share an option set in every stage of lesson 1 (l1-f1 with feedback, l1-s2, l1-s3, l1-n2, l1-n4, l1-c1); lesson 2 sets zip against sip (l2-f1, with feedback), offers s beside z at the start of zap (l2-n4) and puts snake beside zebra in the skill check (l2-c2)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "y, z, qu", en: "y, z, qu" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "y"
            say: "This letter makes a short sound with your tongue. Yellow, yawn and yoghurt all start with it. Listen."
            show: { drawn: letter-card, text: "y" }
            sound: en.y
          - text: "z"
            say: "This letter makes a buzz, like a bee. Zoo, zero and zigzag all start with it. Listen."
            show: { drawn: letter-card, text: "z" }
            sound: en.z
          - text: "qu"
            say: "The first letter never goes anywhere without its friend, the second letter. Together they make one sound, a click and then round lips. Question, quiet and quilt start with it. Listen."
            show: { drawn: letter-card, text: "qu" }
            sound: en.kw

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.z }
                options: ["z", "s", "y"]
                answer: "z"
                feedback:
                  "s": "That letter hisses like a snake. This one buzzes like a bee."
                hints:
                  - "Listen again. Is it a hiss or a buzz?"
                  - "Zoo starts with this sound."
                  - "It is the zigzag letter."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with these letters?"
                say: "Look at the letters. What starts with their sound? Tap the picture."
                show: { drawn: letter-card, text: "qu" }
                options: [{ object: queen }, { object: cup }, { object: kite }]
                answer: queen
                feedback:
                  kite: "Kite starts with a click only. These two letters make a click and then round lips: queen."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts like quiet?"
                  - "Queen starts with these letters. Tap the queen."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.y }
                options: ["j", "y", "w"]
                answer: "y"
                hints:
                  - "Listen again. Does your tongue glide?"
                  - "Yellow starts with this sound."
                  - "It is the letter with two arms up and a long tail, and no dot."
              - id: l1-f4
                type: true_false
                text: "Does it start with this letter?"
                say: "Zebra. Does zebra start with this letter?"
                show: { drawn: letter-card, text: "z" }
                answer: true
                hints:
                  - "Say zebra slowly. Listen to the start."
                  - "Do you hear a buzz?"
                  - "Yes, zebra starts with this letter."
              - id: l1-f5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "y" }
                options: [{ object: jug }, { object: yo-yo }, { object: egg }]
                answer: yo-yo
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts like yellow?"
                  - "Yo-yo starts with this letter. Tap the yo-yo."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.kw }
                options: ["c", "qu", "w"]
                answer: "qu"
                hints: ["Listen again. Is it one sound or a click and round lips?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "z" }
                options: [{ object: sock }, { object: zip }, { object: snail }]
                answer: zip
                hints: ["Which one starts with a buzz?"]
              - id: l1-s3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.z }
                options: ["s", "x", "z"]
                answer: "z"
                hints: ["Listen again. Hiss or buzz?"]
              - id: l1-s4
                type: true_false
                text: "Does it start with these letters?"
                say: "Kite. Does kite start with these letters?"
                show: { drawn: letter-card, text: "qu" }
                answer: false
                hints: ["Say kite slowly. Do your lips go round after the click?"]
              - id: l1-s5
                type: true_false
                text: "Does it start with this letter?"
                say: "Jug. Does jug start with this letter?"
                show: { drawn: letter-card, text: "y" }
                answer: false
                hints: ["Say jug slowly. Does it start like yellow?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.y }
                options: ["y", "v", "j"]
                answer: "y"
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "z" }
                options: [{ object: zebra }, { object: sun }, { object: fox }]
                answer: zebra
              - id: l1-n3
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.kw }
                options: ["qu", "k", "x"]
                answer: "qu"
              - id: l1-n4
                type: true_false
                text: "Does it start with this letter?"
                say: "Sun. Does sun start with this letter?"
                show: { drawn: letter-card, text: "z" }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                text: "What starts with these letters?"
                say: "Look at the letters. What starts with their sound? Tap the picture."
                show: { drawn: letter-card, text: "qu" }
                options: [{ object: car }, { object: web }, { object: queen }]
                answer: queen

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.z }
            options: ["z", "s", "j"]
            answer: "z"
          - id: l1-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "y" }
            options: [{ object: girl }, { object: yo-yo }, { object: web }]
            answer: yo-yo
          - id: l1-c3
            type: true_false
            text: "Does it start with these letters?"
            say: "Queen. Does queen start with these letters?"
            show: { drawn: letter-card, text: "qu" }
            answer: true

  - n: 2
    title: { de: "yes, zip, quiz, buzz", en: "yes, zip, quiz, buzz" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "y e s → yes"
            say: "Point to each letter and say its sound. Then push them together: yes."
            show: { drawn: letter-card, text: "y e s" }
          - text: "qu i z → quiz"
            say: "The first two letters make one sound. Slowly, then fast: quiz."
            show: { drawn: letter-card, text: "qu i z" }
          - text: "b u zz → buzz"
            say: "At the end of some short words, the buzz is written with two letters the same. Buzz."
            show: { drawn: letter-card, text: "b u zz" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "zip" }
                options: ["zip", "sip", "lip"]
                answer: "zip"
                feedback:
                  "sip": "Sip starts with a hiss. Zip starts with a buzz."
                hints:
                  - "Listen to the first sound."
                  - "Is it a hiss or a buzz?"
                  - "Zip."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which letters start the word?"
                say: "Quack. Which letters are missing at the start of quack?"
                frame: "_ack"
                options: ["qu", "q", "k"]
                answer: ["qu"]
                feedback:
                  "q": "This letter never goes alone. It always takes its friend with it, the letter shaped like a cup."
                hints:
                  - "Quack starts with a click and round lips."
                  - "That sound needs two letters."
                  - "The two letters from queen."
              - id: l2-f3
                type: true_false
                text: "Is this the word?"
                say: "Yum. Does the card say yum?"
                show: { drawn: letter-card, text: "yum" }
                answer: true
                hints:
                  - "Say each sound."
                  - "Push them together, faster."
                  - "Yes, it says yum."
              - id: l2-f4
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Fizz. Which letters are missing at the end of fizz?"
                frame: "fi_"
                options: ["zz", "z", "ss"]
                answer: ["zz"]
                hints:
                  - "Fizz ends with a buzz."
                  - "In fizz, like in buzz, the buzz is written with two letters the same."
                  - "Two zigzag letters."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "yuck" }
                options: ["duck", "yuck", "luck"]
                answer: "yuck"
                hints:
                  - "Listen to the first sound."
                  - "It starts like yellow."
                  - "Yuck."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "zap" }
                options: ["tap", "zip", "zap"]
                answer: "zap"
                hints: ["Listen to the start and the middle."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which letters start the word?"
                say: "Quick. Which letters are missing at the start of quick?"
                frame: "_ick"
                options: ["k", "qu", "q"]
                answer: ["qu"]
                hints: ["Is there a click and round lips?"]
              - id: l2-s3
                type: true_false
                text: "Is this the word?"
                say: "Yell. Does the card say yell?"
                show: { drawn: letter-card, text: "bell" }
                answer: false
                hints: ["Look at the first letter."]
              - id: l2-s4
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Jazz. Which letters are missing at the end of jazz?"
                frame: "ja_"
                options: ["ss", "zz", "z"]
                answer: ["zz"]
                hints: ["Which sound do you hear at the end, a hiss or a buzz?"]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "quack" }
                options: ["quack", "back", "quick"]
                answer: "quack"
                hints: ["Listen to the start and the middle."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "yum" }
                options: ["yum", "yell", "hum"]
                answer: "yum"
              - id: l2-n2
                type: fill_in_blank
                text: "Which letters start the word?"
                say: "Quit. Which letters are missing at the start of quit?"
                frame: "_it"
                options: ["qu", "k", "q"]
                answer: ["qu"]
              - id: l2-n3
                type: true_false
                text: "Is this the word?"
                say: "Zip. Does the card say zip?"
                show: { drawn: letter-card, text: "zip" }
                answer: true
              - id: l2-n4
                type: fill_in_blank
                text: "Which letter starts the word?"
                say: "Zap. Which letter is missing at the start of zap?"
                frame: "_ap"
                options: ["s", "z", "y"]
                answer: ["z"]
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "fizz" }
                options: ["fix", "fizz", "fin"]
                answer: "fizz"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Which letters make this sound?"
            say: "Listen to the sound. Tap its letters."
            audio: { sound: en.kw }
            options: ["k", "w", "qu"]
            answer: "qu"
          - id: l2-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "z" }
            options: [{ object: snake }, { object: zebra }, { object: cup }]
            answer: zebra
          - id: l2-c3
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "yap" }
            options: ["yap", "zap", "map"]
            answer: "yap"
          - id: l2-c4
            type: fill_in_blank
            text: "Which letters finish the word?"
            say: "Fuzz. Which letters are missing at the end of fuzz?"
            frame: "fu_"
            options: ["z", "ss", "zz"]
            answer: ["zz"]
