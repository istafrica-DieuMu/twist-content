# Lesson set: English, Year 1. Hand-authored draft.
id: en-GB.lit-en.alternative-pronunciations
skill: lit-en.phonics.alternative-pronunciations
curriculum: en-GB
language: en
title:
  de: Eine Schreibung, zwei Laute
  en: One spelling, two sounds
summary: >
  Some spellings stand for more than one sound: ow in cow and in snow, ea
  in leaf and in bread. The reader tries one sound, and if the word makes
  no sense, tries the other. Lesson 1 takes ow and ea; lesson 2 takes ie
  (pie, field), ou (mouse, soup) and y (sky, funny), and ends with the
  skill check.
metadata:
  year: year-1
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-en.phonics.new-graphemes]
  also_practises: [lit-en.phonics.split-digraphs]
  vocabulary: { en: [sound, spelling, try the other sound, makes sense] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: one-sound-only
      what: Reads every ow as in cow (snow to rhyme with cow) and gives up when the word makes no sense
      addressed: Learn shows the "try the other sound" step; hints say "Does that make sense? Try the other sound."
    - id: guessing
      what: Guesses a word from the picture without reading it
      addressed: some tasks have no picture and ask which sound the letters make in a word
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "ow und ea", en: "ow and ea" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "leaf" }
            options: [{ object: leaf }, { object: leg }, { object: lamp }]
            answer: leaf
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "cow" }
            options: [{ object: cow }, { object: cat }, { object: cup }]
            answer: cow
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "cow   snow"
            say: "O and w can make two sounds. In cow they say ow. In snow they say oh."
            show: { objects: [cow, snowman] }
          - text: "bread"
            say: "E and a usually say ee, as in leaf. Try it in this word: br ... ee ... d. Breed? That is not the word for this picture. Try the other sound, e as in bed: br ... e ... d. Bread!"
            show: { object: bread }
          - text: "Try the other sound"
            say: "When a word does not make sense, try the other sound the letters can make."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How does ow sound in snow?"
                say: "In the word snow, which sound do o and w make?"
                show: { object: snowman }
                options: ["oh, as in boat", "ow, as in cow"]
                answer: "oh, as in boat"
                feedback:
                  "ow, as in cow": "Sn-ow to rhyme with cow is not a word. Try the other sound: snow."
                hints:
                  - "Try ow first. Does it make a word?"
                  - "Now try oh."
                  - "Snow rhymes with go."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How does ea sound in bread?"
                say: "In the word bread, which sound do e and a make?"
                show: { object: bread }
                options: ["ee, as in leaf", "e, as in bed"]
                answer: "e, as in bed"
                hints:
                  - "Try ee first: breed. Is that the picture?"
                  - "Try e: bread."
                  - "e, as in bed."
              - id: l1-f3
                type: sorting
                text: "Sort the words by the ow sound."
                say: "Read each word. Does ow sound like cow, or like snow? Put it in the right group."
                option_audio: false
                bins:
                  - { id: cow, show: { object: cow } }
                  - { id: snow, show: { object: snowman } }
                options:
                  - { text: "now", bin: cow }
                  - { text: "show", bin: snow }
                  - { text: "town", bin: cow }
                  - { text: "slow", bin: snow }
                hints:
                  - "Read each word both ways. Which one is a real word?"
                  - "Now and town sound like cow."
                  - "Show and slow sound like snow."
              - id: l1-f4
                type: true_false
                text: "Is it true? In leaf, ea says ee."
                show: { object: leaf }
                answer: true
                hints:
                  - "Say leaf slowly."
                  - "l ... ee ... f."
                  - "Yes."
              - id: l1-f5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "snowman" }
                options: [{ object: snowman }, { object: snail }, { object: snake }]
                answer: snowman
                hints:
                  - "Read it in two parts: snow, man."
                  - "Ow here says oh."
                  - "Snowman."
              - id: l1-f6
                type: multiple_choice
                text: "How does ow sound in clown?"
                say: "In the word clown, which sound do o and w make?"
                show: { object: clown }
                options: ["oh, as in boat", "ow, as in cow"]
                answer: "ow, as in cow"
                hints:
                  - "Try both sounds."
                  - "Cl-oh-n is not a word."
                  - "Clown rhymes with town."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How does ea sound in head?"
                say: "In the word head, which sound do e and a make?"
                options: ["ee, as in leaf", "e, as in bed"]
                answer: "e, as in bed"
                hints: ["Try both. Which makes a word?"]
              - id: l1-s2
                type: sorting
                text: "Sort the words by the ea sound."
                say: "Read each word. Does ea sound like leaf, or like bread? Put it in the right group."
                option_audio: false
                bins:
                  - { id: leaf, show: { object: leaf } }
                  - { id: bread, show: { object: bread } }
                options:
                  - { text: "sea", bin: leaf }
                  - { text: "head", bin: bread }
                  - { text: "eat", bin: leaf }
                  - { text: "dead", bin: bread }
                hints: ["Try both sounds for each word."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "clown" }
                options: [{ object: clock }, { object: clown }, { object: cloud }]
                answer: clown
                hints: ["Ow here says ow, as in cow."]
              - id: l1-s4
                type: true_false
                text: "Is it true? In grow, ow sounds like cow."
                answer: false
                hints: ["Gr-ow like cow is not a word."]
              - id: l1-s5
                type: multiple_choice
                text: "How does ow sound in down?"
                say: "In the word down, which sound do o and w make?"
                options: ["oh, as in boat", "ow, as in cow"]
                answer: "ow, as in cow"
                hints: ["Down rhymes with town."]
              - id: l1-s6
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "bread" }
                options: [{ object: bird }, { object: bread }, { object: bed }]
                answer: bread
                hints: ["Ea here says e."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How does ow sound in blow?"
                say: "In the word blow, which sound do o and w make?"
                options: ["oh, as in boat", "ow, as in cow"]
                answer: "oh, as in boat"
              - id: l1-n2
                type: sorting
                text: "Sort the words by the ow sound."
                say: "Read each word. Does ow sound like cow, or like snow? Put it in the right group."
                option_audio: false
                bins:
                  - { id: cow, show: { object: cow } }
                  - { id: snow, show: { object: snowman } }
                options:
                  - { text: "how", bin: cow }
                  - { text: "low", bin: snow }
                  - { text: "brown", bin: cow }
                  - { text: "grow", bin: snow }
              - id: l1-n3
                type: multiple_choice
                text: "How does ea sound in read?"
                say: "In the word read, as in I read a book every day, which sound do e and a make?"
                options: ["ee, as in leaf", "e, as in bed"]
                answer: "ee, as in leaf"
              - id: l1-n4
                type: true_false
                text: "Is it true? In bread, ea says e."
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "cow" }
                options: [{ object: cow }, { object: goat }, { object: clown }]
                answer: cow

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How does ow sound in show?"
            say: "In the word show, which sound do o and w make?"
            options: ["oh, as in boat", "ow, as in cow"]
            answer: "oh, as in boat"
          - id: l1-c2
            type: multiple_choice
            text: "How does ea sound in head?"
            say: "In the word head, which sound do e and a make?"
            options: ["ee, as in leaf", "e, as in bed"]
            answer: "e, as in bed"
          - id: l1-c3
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "snowman" }
            options: [{ object: snake }, { object: snowman }, { object: sun }]
            answer: snowman

  - n: 2
    title: { de: "ie, ou und y", en: "ie, ou and y" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How does ow sound in town?"
            say: "In the word town, which sound do o and w make?"
            options: ["oh, as in boat", "ow, as in cow"]
            answer: "ow, as in cow"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How does ea sound in sea?"
            say: "In the word sea, which sound do e and a make?"
            options: ["ee, as in leaf", "e, as in bed"]
            answer: "ee, as in leaf"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "pie   field"
            say: "I and e say igh in pie, but ee in field."
            show: { object: pie }
          - text: "mouse   soup"
            say: "O and u say ow in mouse, but oo in soup."
            show: { object: mouse }
          - text: "sky   funny"
            say: "Y at the end of a word can say igh, as in sky and my, or ee, as in funny and happy. Try both and keep the one that makes a word."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How does ie sound in field?"
                say: "In the word field, which sound do i and e make?"
                options: ["igh, as in pie", "ee, as in tree"]
                answer: "ee, as in tree"
                hints:
                  - "Try igh first: f-igh-ld. Is that a word?"
                  - "Try ee."
                  - "Field rhymes with shield."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How does y sound in happy?"
                say: "In the word happy, which sound does the y at the end make?"
                options: ["igh, as in sky", "ee, as in tree"]
                answer: "ee, as in tree"
                hints:
                  - "Try both at the end of happ-."
                  - "Happ-igh is not a word."
                  - "Happy ends with ee."
              - id: l2-f3
                type: sorting
                text: "Sort the words by the y sound."
                say: "Read each word. Does the y say igh, or ee? Put it in the right group."
                option_audio: false
                bins:
                  - { id: igh, show: { text: "igh" }, say: "igh" }
                  - { id: ee, show: { text: "ee" }, say: "ee" }
                options:
                  - { text: "my", bin: igh }
                  - { text: "funny", bin: ee }
                  - { text: "fly", bin: igh }
                  - { text: "sunny", bin: ee }
                hints:
                  - "Short words like my often say igh."
                  - "Longer words like funny often end in ee."
                  - "my, fly: igh. funny, sunny: ee."
              - id: l2-f4
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "mouse" }
                options: [{ object: mouse }, { object: moon }, { object: mouth }]
                answer: mouse
                hints:
                  - "Ou here says ow."
                  - "m ... ow ... s."
                  - "Mouse."
              - id: l2-f5
                type: multiple_choice
                text: "How does ou sound in soup?"
                say: "In the word soup, which sound do o and u make?"
                options: ["ow, as in mouse", "oo, as in moon"]
                answer: "oo, as in moon"
                hints:
                  - "Try ow: s-ow-p. Is that a word?"
                  - "Try oo."
                  - "Soup."
              - id: l2-f6
                type: true_false
                text: "Is it true? In pie, ie says igh."
                show: { object: pie }
                answer: true
                hints:
                  - "Say pie."
                  - "p ... igh."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How does y sound in sky?"
                say: "In the word sky, which sound does y make?"
                options: ["igh, as in pie", "ee, as in tree"]
                answer: "igh, as in pie"
                hints: ["Sky rhymes with my."]
              - id: l2-s2
                type: multiple_choice
                text: "How does ie sound in chief?"
                say: "In the word chief, which sound do i and e make?"
                options: ["igh, as in pie", "ee, as in tree"]
                answer: "ee, as in tree"
                hints: ["Try both."]
              - id: l2-s3
                type: sorting
                text: "Sort the words by the ou sound."
                say: "Read each word. Does ou sound like mouse, or like soup? Put it in the right group."
                option_audio: false
                bins:
                  - { id: mouse, show: { object: mouse } }
                  - { id: soup, show: { text: "soup" }, say: "soup" }
                options:
                  - { text: "out", bin: mouse }
                  - { text: "you", bin: soup }
                  - { text: "loud", bin: mouse }
                  - { text: "group", bin: soup }
                hints: ["Try both sounds for each word."]
              - id: l2-s4
                type: true_false
                text: "Is it true? In funny, the y says igh."
                answer: false
                hints: ["Funn-igh is not a word."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "cloud" }
                options: [{ object: cloud }, { object: clown }, { object: clock }]
                answer: cloud
                hints: ["Ou here says ow."]
              - id: l2-s6
                type: multiple_choice
                text: "How does y sound in by?"
                say: "In the word by, which sound does y make?"
                options: ["igh, as in pie", "ee, as in tree"]
                answer: "igh, as in pie"
                hints: ["By rhymes with my."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How does ie sound in tie?"
                say: "In the word tie, which sound do i and e make?"
                options: ["igh, as in pie", "ee, as in tree"]
                answer: "igh, as in pie"
              - id: l2-n2
                type: sorting
                text: "Sort the words by the y sound."
                say: "Read each word. Does the y say igh, or ee? Put it in the right group."
                option_audio: false
                bins:
                  - { id: igh, show: { text: "igh" }, say: "igh" }
                  - { id: ee, show: { text: "ee" }, say: "ee" }
                options:
                  - { text: "cry", bin: igh }
                  - { text: "jolly", bin: ee }
                  - { text: "why", bin: igh }
                  - { text: "silly", bin: ee }
              - id: l2-n3
                type: multiple_choice
                text: "How does ou sound in you?"
                say: "In the word you, which sound do o and u make?"
                options: ["ow, as in mouse", "oo, as in moon"]
                answer: "oo, as in moon"
              - id: l2-n4
                type: true_false
                text: "Is it true? In field, ie says ee."
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                show: { drawn: letter-card, text: "house" }
                options: [{ object: house }, { object: hat }, { object: hand }]
                answer: house

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "How does ow sound in slow?"
            say: "In the word slow, which sound do o and w make?"
            options: ["oh, as in boat", "ow, as in cow"]
            answer: "oh, as in boat"
          - id: l2-c2
            type: multiple_choice
            text: "How does ea sound in bread?"
            say: "In the word bread, which sound do e and a make?"
            options: ["ee, as in leaf", "e, as in bed"]
            answer: "e, as in bed"
          - id: l2-c3
            type: multiple_choice
            text: "How does y sound in sunny?"
            say: "In the word sunny, which sound does the y at the end make?"
            options: ["igh, as in sky", "ee, as in tree"]
            answer: "ee, as in tree"
          - id: l2-c4
            type: multiple_choice
            text: "How does ou sound in group?"
            say: "In the word group, which sound do o and u make?"
            options: ["ow, as in mouse", "oo, as in moon"]
            answer: "oo, as in moon"
          - id: l2-c5
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            show: { drawn: letter-card, text: "clown" }
            options: [{ object: cloud }, { object: clown }, { object: clock }]
            answer: clown
