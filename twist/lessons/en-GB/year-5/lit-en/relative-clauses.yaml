# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.relative-clauses
skill: lit-en.grammar.relative-clauses
curriculum: en-GB
language: en
title:
  de: Relativsätze mit who, which, where und Co.
  en: Relative clauses
summary: >
  Relative clauses from Appendix 2 of the National Curriculum for Year
  5. Lesson 1 chooses the relative pronoun: who for people, which for
  things and animals, where for places, when for times, whose for
  belonging, and that for people or things. Lesson 2 finds the relative
  clause in a sentence, joins two sentences with one, and puts commas
  round a relative clause that adds extra information in the middle of
  a sentence; it ends with the skill check. Options never offer both
  which and that (or who and that) where both would be right.
metadata:
  year: year-5
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.conjunctions-y2]
  also_practises: [lit-en.grammar.conjunctions-y2]
  vocabulary: { en: [relative clause, relative pronoun, who, which, where, when, whose, that, noun, main clause, comma] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: which-for-people
      what: Uses which for people (the boy which lives next door)
      addressed: Learn screen 1 of lesson 1; l1-f1 (feedback), l1-f3, l1-s1, l1-n1, l2-c1
    - id: whose-whos
      what: Confuses whose (belonging) with who's (who is), or uses who for belonging
      addressed: Learn screen 3 of lesson 1; l1-f4 (feedback), l1-s4, l1-n4, l2-c2
    - id: clause-is-whole-sentence
      what: Thinks the relative clause is the whole sentence, or marks only the pronoun
      addressed: Learn of lesson 2; l2-f1 (feedback), l2-f2, l2-s2, l2-n2, l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das richtige Relativpronomen, en: Choosing the relative pronoun }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which word joins the sentence? \"I wore my coat _ it was cold.\""
            options: ["because", "but", "or"]
            answer: "because"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word joins the sentence? \"We can play inside _ it rains.\""
            options: ["if", "and", "but"]
            answer: "if"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The girl who won the race is my cousin.\nThe bike which I got for my birthday is red."
            say: "A relative clause tells us more about a noun. It starts with a relative pronoun. Use who for people and which for things and animals."
          - text: "the park where we play\nthe day when it snowed"
            say: "Use where for a place and when for a time: the park where we play, the day when it snowed."
          - text: "the boy whose dog ran away\nwhose = belonging to whom"
            say: "Use whose for belonging: the boy whose dog ran away. It is the dog belonging to the boy. Do not mix it up with who's, which means who is."
          - text: "the girl that won\nthe bike that I got"
            say: "That can be used for people or things: the girl that won, the bike that I got."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "The man _ fixed our roof was very kind."
                options: ["who", "which", "where"]
                answer: ["who"]
                option_audio: false
                feedback:
                  "which": "The man is a person. For people, use who."
                hints:
                  - "Is the man a person, a thing or a place?"
                  - "For people, use who."
                  - "Who."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "This is the house _ I was born."
                options: ["where", "who", "when"]
                answer: ["where"]
                option_audio: false
                hints:
                  - "The house is a place."
                  - "Which pronoun is for places?"
                  - "Where."
              - id: l1-f3
                type: matching
                text: "Match each noun to its relative pronoun."
                say: "Match each noun to the relative pronoun you would use after it."
                option_audio: false
                pairs:
                  - { left: { text: "the teacher ..." }, right: { text: "who" } }
                  - { left: { text: "the castle ..." }, right: { text: "which" } }
                  - { left: { text: "the town ... we live" }, right: { text: "where" } }
                  - { left: { text: "the morning ... it snowed" }, right: { text: "when" } }
                hints:
                  - "Person, thing, place, time."
                  - "A teacher is a person; a castle is a thing."
                  - "Teacher: who. Castle: which. Town: where. Morning: when."
              - id: l1-f4
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "That is the girl _ cat climbed the tree."
                options: ["whose", "who's", "which"]
                answer: ["whose"]
                option_audio: false
                feedback:
                  "who's": "Who's means who is. Here the cat belongs to the girl, so use whose."
                hints:
                  - "Who does the cat belong to?"
                  - "For belonging, use whose."
                  - "Whose."
              - id: l1-f5
                type: true_false
                text: "Is it true? \"The dog which barked all night\" uses the right relative pronoun."
                answer: true
                hints:
                  - "Is a dog a person?"
                  - "For animals and things, use which."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "My aunt, _ lives in Leeds, is a doctor."
                options: ["who", "which", "when"]
                answer: ["who"]
                option_audio: false
                hints: ["Your aunt is a person."]
              - id: l1-s2
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "I remember the summer _ we went to Wales."
                options: ["when", "where", "who"]
                answer: ["when"]
                option_audio: false
                hints: ["Summer is a time."]
              - id: l1-s3
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "The book _ I borrowed is overdue."
                options: ["which", "who", "where"]
                answer: ["which"]
                option_audio: false
                hints: ["A book is a thing."]
              - id: l1-s4
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "We thanked the farmer _ field we crossed."
                options: ["whose", "who's", "where"]
                answer: ["whose"]
                option_audio: false
                hints: ["The field belongs to the farmer."]
              - id: l1-s5
                type: true_false
                text: "Is it true? \"The boy which sits next to me\" uses the right relative pronoun."
                answer: false
                hints: ["Is the boy a person or a thing?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "The pilot _ flew the plane waved to us."
                options: ["who", "which", "where"]
                answer: ["who"]
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "We found the cave _ the bats sleep."
                options: ["where", "when", "whose"]
                answer: ["where"]
                option_audio: false
              - id: l1-n3
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "The cake _ Mum made was delicious."
                options: ["which", "who", "when"]
                answer: ["which"]
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Choose the relative pronoun."
                frame: "The singer _ voice is famous came to our school."
                options: ["whose", "who's", "which"]
                answer: ["whose"]
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? You can use that for people and for things."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Choose the relative pronoun."
            frame: "The nurse _ helped me was very gentle."
            options: ["who", "which", "where"]
            answer: ["who"]
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Choose the relative pronoun."
            frame: "That is the shop _ we buy our bread."
            options: ["where", "when", "who"]
            answer: ["where"]
            option_audio: false
          - id: l1-c3
            type: fill_in_blank
            text: "Choose the relative pronoun."
            frame: "The boy _ bag was lost went to the office."
            options: ["whose", "who's", "which"]
            answer: ["whose"]
            option_audio: false

  - n: 2
    title: { de: Relativsätze finden und bilden, en: Finding and building relative clauses }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Choose the relative pronoun."
            frame: "The parrot _ talks belongs to my gran."
            options: ["which", "who", "where"]
            answer: ["which"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Choose the relative pronoun."
            frame: "Friday is the day _ we have PE."
            options: ["when", "where", "whose"]
            answer: ["when"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The fox, which had a bushy tail, ran across the road."
            say: "The relative clause is the relative pronoun and the words that belong with it: which had a bushy tail. It tells us more about the fox. Take it out, and the main clause still makes sense: The fox ran across the road."
          - text: "I have a friend. She can speak three languages.\n→ I have a friend who can speak three languages."
            say: "A relative clause can join two sentences. The second sentence is about the friend, so who replaces she."
          - text: "Mr Shah, who teaches Year 5, plays the drums."
            say: "When a relative clause adds extra information in the middle of a sentence, put a comma before it and a comma after it, like a pair of hands holding it."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tap every word of the relative clause."
                say: "Tap every word of the relative clause, from the relative pronoun to its end."
                show: { drawn: letter-card, text: "The cake which Gran baked was enormous" }
                spans: ["which", "Gran", "baked"]
                feedback:
                  "which": "Which starts the clause, but the clause goes on: which Gran baked."
                hints:
                  - "Find the relative pronoun first."
                  - "Then add the words that tell us about the cake."
                  - "Which Gran baked."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "\"The children who finished early went out to play.\"\n\nWhich is the relative clause?"
                options: ["who finished early", "The children went out to play", "who"]
                answer: "who finished early"
                option_audio: false
                hints:
                  - "Start at the relative pronoun."
                  - "What does it tell us about the children?"
                  - "Who finished early."
              - id: l2-f3
                type: multiple_choice
                text: "I saw a horse. It was jumping a fence.\n\nWhich sentence joins them with a relative clause?"
                options: ["I saw a horse which was jumping a fence.", "I saw a horse who was jumping a fence.", "I saw a horse it was jumping a fence."]
                answer: "I saw a horse which was jumping a fence."
                option_audio: false
                hints:
                  - "Which word replaces it?"
                  - "A horse is an animal."
                  - "I saw a horse which was jumping a fence."
              - id: l2-f4
                type: multiple_choice
                text: "Which sentence has its commas in the right place?"
                options: ["Our dog, which is called Pip, loves the park.", "Our dog which, is called Pip loves the park.", "Our dog which is called, Pip, loves the park."]
                answer: "Our dog, which is called Pip, loves the park."
                option_audio: false
                hints:
                  - "Find the relative clause."
                  - "The commas go round the whole clause."
                  - "Our dog, which is called Pip, loves the park."
              - id: l2-f5
                type: true_false
                text: "\"The tower, which is very old, is closed.\"\n\nIs it true? Without the relative clause, the sentence still makes sense."
                answer: true
                hints:
                  - "Cover up which is very old."
                  - "Read what is left."
                  - "Yes: The tower is closed."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap every word of the relative clause."
                say: "Tap every word of the relative clause."
                show: { drawn: letter-card, text: "The girl who sings in our choir is my sister" }
                spans: ["who", "sings", "in", "our", "choir"]
                hints: ["Start at who and stop before the main verb is."]
              - id: l2-s2
                type: multiple_choice
                text: "\"We visited the farm where my dad grew up.\"\n\nWhich is the relative clause?"
                options: ["where my dad grew up", "We visited the farm", "where"]
                answer: "where my dad grew up"
                option_audio: false
                hints: ["Start at the relative pronoun."]
              - id: l2-s3
                type: multiple_choice
                text: "This is my uncle. His car is electric.\n\nWhich sentence joins them with a relative clause?"
                options: ["This is my uncle whose car is electric.", "This is my uncle who's car is electric.", "This is my uncle which car is electric."]
                answer: "This is my uncle whose car is electric."
                option_audio: false
                hints: ["The car belongs to the uncle."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence has its commas in the right place?"
                options: ["London, which is the capital, is busy.", "London which, is the capital, is busy.", "London, which is, the capital is busy."]
                answer: "London, which is the capital, is busy."
                option_audio: false
                hints: ["Commas go round the whole clause."]
              - id: l2-s5
                type: ordering
                text: "Build the sentence with a relative clause."
                say: "Put the cards in order to make one sentence about the boy who scored."
                option_audio: false
                options: ["got a medal.", "The boy", "who scored"]
                slot_count: 3
                answer: ["The boy", "who scored", "got a medal."]
                hints: ["The relative clause comes straight after the noun it describes."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tap every word of the relative clause."
                say: "Tap every word of the relative clause."
                show: { drawn: letter-card, text: "The robot that Sam built can dance" }
                spans: ["that", "Sam", "built"]
              - id: l2-n2
                type: multiple_choice
                text: "\"I will never forget the day when we met.\"\n\nWhich is the relative clause?"
                options: ["when we met", "I will never forget the day", "when"]
                answer: "when we met"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "We met a pilot. She had flown round the world.\n\nWhich sentence joins them with a relative clause?"
                options: ["We met a pilot who had flown round the world.", "We met a pilot which had flown round the world.", "We met a pilot she had flown round the world."]
                answer: "We met a pilot who had flown round the world."
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence has its commas in the right place?"
                options: ["Mrs Green, who runs the café, makes great soup.", "Mrs Green who, runs the café makes great soup.", "Mrs Green who runs, the café, makes great soup."]
                answer: "Mrs Green, who runs the café, makes great soup."
                option_audio: false
              - id: l2-n5
                type: ordering
                text: "Build the sentence with a relative clause."
                say: "Put the cards in order to make one sentence about the river."
                option_audio: false
                options: ["which flooded last year,", "is calm today.", "The river,"]
                slot_count: 3
                answer: ["The river,", "which flooded last year,", "is calm today."]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Choose the relative pronoun."
            frame: "The author _ wrote this book lives in Cornwall."
            options: ["who", "which", "when"]
            answer: ["who"]
            option_audio: false
          - id: l2-c2
            type: fill_in_blank
            text: "Choose the relative pronoun."
            frame: "I spoke to the woman _ purse was found."
            options: ["whose", "who's", "where"]
            answer: ["whose"]
            option_audio: false
          - id: l2-c3
            type: highlight_in_text
            text: "Tap every word of the relative clause."
            say: "Tap every word of the relative clause."
            show: { drawn: letter-card, text: "The kite which we flew got stuck in a tree" }
            spans: ["which", "we", "flew"]
          - id: l2-c4
            type: multiple_choice
            text: "Which sentence has its commas in the right place?"
            options: ["My cat, which is ten, still chases mice.", "My cat which, is ten, still chases mice.", "My cat which is ten still, chases mice."]
            answer: "My cat, which is ten, still chases mice."
            option_audio: false
          - id: l2-c5
            type: fill_in_blank
            text: "Choose the relative pronoun."
            frame: "We went back to the beach _ we found the crab."
            options: ["where", "who", "whose"]
            answer: ["where"]
            option_audio: false
