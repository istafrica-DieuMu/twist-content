# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.modal-verbs
skill: lit-en.grammar.modal-verbs
curriculum: en-GB
language: en
title:
  de: Wahrscheinlichkeit mit Modalverben ausdrücken
  en: How likely? Modal verbs and adverbs
summary: >
  Indicating degrees of possibility, from Appendix 2 of the National
  Curriculum for Year 5. Lesson 1 takes modal verbs: will for certain,
  should for likely, might, may and could for possible, and will not or
  cannot for impossible, always followed by the base form of the verb.
  Lesson 2 takes adverbs of possibility: definitely, certainly and
  surely, probably, and perhaps, possibly and maybe; it ends with the
  skill check. Scale tasks never ask children to rank two words of the
  same strength (might and may) against each other.
metadata:
  year: year-5
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.tense-progressive]
  also_practises: [lit-en.composition.audience-purpose]
  vocabulary: { en: [modal verb, adverb, possibility, certain, likely, possible, impossible, will, should, might, may, could, definitely, probably, perhaps, surely] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: might-means-will
      what: Thinks might and will say the same, so a forecast of might rain means it will rain
      addressed: Learn screen 1 of lesson 1; l1-f1 (feedback), l1-f3, l1-s1, l1-n1, l2-c1
    - id: modal-plus-ed
      what: Puts a past or -s form after a modal verb (she might comes, we could went)
      addressed: Learn screen 3 of lesson 1; l1-f4 (feedback), l1-s4, l1-n4, l2-c2
    - id: perhaps-is-certain
      what: Mixes up adverbs of possibility, treating perhaps or probably as certainly
      addressed: Learn of lesson 2; l2-f1 (feedback), l2-f2, l2-s2, l2-n2, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Modalverben, en: Modal verbs }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which verb fits? \"Yesterday, Ana _ to the shops.\""
            options: ["walked", "walks", "is walking"]
            answer: "walked"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which verb fits? \"Right now, the twins _ football.\""
            options: ["are playing", "played", "was playing"]
            answer: "are playing"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "It will rain. (certain)\nIt should rain. (likely)\nIt might rain. (possible)\nIt will not rain. (impossible)"
            say: "Modal verbs show how likely something is. Will means it is certain. Should means it is likely. Might means it is possible. Will not means there is no chance."
          - text: "might, may, could: possible\ncannot, can't, won't: impossible"
            say: "May and could also say something is possible. Cannot and won't say it is impossible."
          - text: "She might come.\nnot: She might comes. / She might came."
            say: "After a modal verb, use the base form of the verb: might come, should win, will be. Never add s or ed."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"We might go to the beach tomorrow.\"\n\nHow likely is the trip?"
                options: ["certain", "possible", "impossible"]
                answer: "possible"
                keep_order: true
                feedback:
                  "certain": "Might does not mean it will happen. It is only possible."
                hints:
                  - "Look at the modal verb."
                  - "Might shows something could happen, or not."
                  - "Possible."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the modal verb."
                say: "Tap the modal verb in the sentence."
                show: { drawn: letter-card, text: "The parcel should arrive on Monday" }
                spans: ["should"]
                hints:
                  - "A modal verb comes before the main verb."
                  - "Look for will, should, might, may, could or can."
                  - "Should."
              - id: l1-f3
                type: ordering
                text: "Order from least likely to most likely."
                say: "Put the sentences in order, from the least likely to the most likely."
                option_audio: false
                options: ["It will snow.", "It will not snow.", "It might snow."]
                slot_count: 3
                answer: ["It will not snow.", "It might snow.", "It will snow."]
                hints:
                  - "Which one says there is no chance?"
                  - "Will not is impossible, might is possible, will is certain."
                  - "Will not, might, will."
              - id: l1-f4
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["Tom could swim across the lake.", "Tom could swims across the lake.", "Tom could swam across the lake."]
                answer: "Tom could swim across the lake."
                option_audio: false
                feedback:
                  "Tom could swims across the lake.": "After a modal verb, use the base form: could swim, without s."
                hints:
                  - "Look at the verb after could."
                  - "After a modal verb, use the base form."
                  - "Tom could swim across the lake."
              - id: l1-f5
                type: multiple_choice
                text: "Choose the modal verb that shows it is certain. \"The sun _ rise tomorrow.\""
                options: ["will", "might", "could"]
                answer: "will"
                hints:
                  - "Is it certain or only possible?"
                  - "The sun rises every day."
                  - "Will."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"You cannot fly by flapping your arms.\"\n\nHow likely is it?"
                options: ["certain", "possible", "impossible"]
                answer: "impossible"
                keep_order: true
                hints: ["Cannot means no chance."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tap the modal verb."
                say: "Tap the modal verb in the sentence."
                show: { drawn: letter-card, text: "Our team may win the cup this year" }
                spans: ["may"]
                hints: ["It comes before win."]
              - id: l1-s3
                type: multiple_choice
                text: "Choose the modal verb that shows it is likely, but not certain. \"The bus _ be here soon; it is usually on time.\""
                options: ["should", "will not", "cannot"]
                answer: "should"
                hints: ["Likely, not certain and not impossible."]
              - id: l1-s4
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["Mum will be home at six.", "Mum will is home at six.", "Mum will was home at six."]
                answer: "Mum will be home at six."
                option_audio: false
                hints: ["The base form of is is be."]
              - id: l1-s5
                type: true_false
                text: "Is it true? \"It might rain\" means it is certain to rain."
                answer: false
                hints: ["Might shows possibility."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"The film could be scary.\"\n\nHow likely is it?"
                options: ["certain", "possible", "impossible"]
                answer: "possible"
                keep_order: true
              - id: l1-n2
                type: highlight_in_text
                text: "Tap the two modal verbs."
                say: "Tap both modal verbs in the sentence."
                show: { drawn: letter-card, text: "Penguins cannot fly but they can swim fast" }
                spans: ["cannot", "can"]
              - id: l1-n3
                type: ordering
                text: "Order from least likely to most likely."
                say: "Put the sentences in order, from the least likely to the most likely."
                option_audio: false
                options: ["We should win.", "We will win.", "We won't win.", "We might win."]
                slot_count: 4
                answer: ["We won't win.", "We might win.", "We should win.", "We will win."]
              - id: l1-n4
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["You should drink more water.", "You should drinks more water.", "You should drank more water."]
                answer: "You should drink more water."
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? Will not shows that something is impossible."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"Ben will not be at school tomorrow.\"\n\nHow likely is it that Ben comes?"
            options: ["certain", "possible", "impossible"]
            answer: "impossible"
            keep_order: true
          - id: l1-c2
            type: highlight_in_text
            text: "Tap the modal verb."
            say: "Tap the modal verb in the sentence."
            show: { drawn: letter-card, text: "The baby might sleep after lunch" }
            spans: ["might"]
          - id: l1-c3
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["She may come later.", "She may comes later.", "She may came later."]
            answer: "She may come later."
            option_audio: false

  - n: 2
    title: { de: Adverbien der Wahrscheinlichkeit, en: Adverbs of possibility }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"The shop should be open now.\"\n\nHow likely is it?"
            options: ["certain", "likely", "impossible"]
            answer: "likely"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tap the modal verb."
            say: "Tap the modal verb in the sentence."
            show: { drawn: letter-card, text: "Dad could fix the bike later" }
            spans: ["could"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "definitely, certainly, surely: very sure\nprobably: likely\nperhaps, possibly, maybe: not sure"
            say: "Adverbs can show how likely something is too. Definitely, certainly and surely show you are very sure. Probably means it is likely. Perhaps, possibly and maybe show you are not sure."
          - text: "Perhaps we will see a fox.\nWe will probably see a fox.\nWe will definitely see a fox."
            say: "The same sentence changes with the adverb. Perhaps: not sure. Probably: likely. Definitely: certain."
          - text: "Surely you have finished by now!"
            say: "Surely shows the speaker is very sure, and a little surprised if they are wrong."
          - text: "It will probably rain, so take a coat."
            say: "Writers use these words to be careful and honest. A report says the bridge will probably close, not that it definitely will, if nobody is sure."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"Perhaps the treasure is under the old oak.\"\n\nHow sure is the speaker?"
                options: ["very sure", "not sure", "sure it is not there"]
                answer: "not sure"
                keep_order: true
                feedback:
                  "very sure": "Perhaps shows the speaker is not sure. Definitely would show they are very sure."
                hints:
                  - "Look at the adverb at the start."
                  - "Perhaps means maybe."
                  - "Not sure."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Order from least sure to most sure."
                say: "Put the sentences in order, from the least sure to the most sure."
                option_audio: false
                options: ["She will definitely win.", "Perhaps she will win.", "She will probably win."]
                slot_count: 3
                answer: ["Perhaps she will win.", "She will probably win.", "She will definitely win."]
                hints:
                  - "Which adverb shows the least certainty?"
                  - "Perhaps, then probably, then definitely."
                  - "Perhaps, probably, definitely."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the adverb of possibility."
                say: "Tap the adverb that shows how likely it is."
                show: { drawn: letter-card, text: "The train will certainly be late today" }
                spans: ["certainly"]
                hints:
                  - "It is an adverb ending in ly."
                  - "It tells you how sure the speaker is."
                  - "Certainly."
              - id: l2-f4
                type: multiple_choice
                text: "The weather forecast is not sure if it will snow. Which sentence fits?"
                options: ["It will possibly snow tonight.", "It will definitely snow tonight.", "It will certainly snow tonight."]
                answer: "It will possibly snow tonight."
                option_audio: false
                hints:
                  - "The forecast is not sure."
                  - "Which adverb shows doubt?"
                  - "Possibly."
              - id: l2-f5
                type: true_false
                text: "Is it true? \"We will probably win\" means the speaker thinks winning is likely."
                answer: true
                hints:
                  - "What does probably mean?"
                  - "Probably means likely."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"Surely you remembered your PE kit!\"\n\nHow sure is the speaker?"
                options: ["very sure", "not sure", "sure it was forgotten"]
                answer: "very sure"
                keep_order: true
                hints: ["Surely shows strong certainty."]
              - id: l2-s2
                type: multiple_choice
                text: "Which word means the same as perhaps?"
                options: ["maybe", "definitely", "certainly"]
                answer: "maybe"
                hints: ["Both show you are not sure."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the adverb of possibility."
                say: "Tap the adverb that shows how likely it is."
                show: { drawn: letter-card, text: "Maybe the cat is hiding in the shed" }
                spans: ["Maybe"]
                hints: ["Look at the start of the sentence."]
              - id: l2-s4
                type: fill_in_blank
                text: "Choose the adverb that fits."
                say: "The museum is always shut on Mondays. Choose the adverb."
                frame: "The museum will _ be shut on Monday."
                options: ["definitely", "perhaps", "possibly"]
                answer: ["definitely"]
                option_audio: false
                hints: ["It is always shut, so you are very sure."]
              - id: l2-s5
                type: true_false
                text: "Is it true? \"Possibly\" shows the writer is very sure."
                answer: false
                hints: ["Possibly means it might happen."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"The answer is definitely 42.\"\n\nHow sure is the speaker?"
                options: ["very sure", "not sure", "sure it is wrong"]
                answer: "very sure"
                keep_order: true
              - id: l2-n2
                type: ordering
                text: "Order from least sure to most sure."
                say: "Put the sentences in order, from the least sure to the most sure."
                option_audio: false
                options: ["The door is probably locked.", "Maybe the door is locked.", "The door is certainly locked."]
                slot_count: 3
                answer: ["Maybe the door is locked.", "The door is probably locked.", "The door is certainly locked."]
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the adverb of possibility."
                say: "Tap the adverb that shows how likely it is."
                show: { drawn: letter-card, text: "Ella will probably bring her guitar" }
                spans: ["probably"]
              - id: l2-n4
                type: fill_in_blank
                text: "Choose the adverb that fits."
                say: "Nobody knows yet if the trip will go ahead. Choose the adverb."
                frame: "_ the trip will go ahead."
                options: ["Perhaps", "Certainly", "Definitely"]
                answer: ["Perhaps"]
                option_audio: false
              - id: l2-n5
                type: multiple_choice
                text: "A scientist is not sure about a new planet. Which sentence fits a careful report?"
                options: ["There may possibly be water on the planet.", "There is definitely water on the planet.", "There is certainly no doubt about water."]
                answer: "There may possibly be water on the planet."
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "\"Grandad might visit at the weekend.\"\n\nHow likely is the visit?"
            options: ["certain", "possible", "impossible"]
            answer: "possible"
            keep_order: true
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["We should leave now.", "We should leaves now.", "We should left now."]
            answer: "We should leave now."
            option_audio: false
          - id: l2-c3
            type: ordering
            text: "Order from least likely to most likely."
            say: "Put the sentences in order, from the least likely to the most likely."
            option_audio: false
            options: ["The dog will eat it.", "The dog won't eat it.", "The dog might eat it."]
            slot_count: 3
            answer: ["The dog won't eat it.", "The dog might eat it.", "The dog will eat it."]
          - id: l2-c4
            type: multiple_choice
            text: "\"The parcel will probably come today.\"\n\nHow sure is the speaker?"
            options: ["completely sure", "fairly sure", "not sure at all"]
            answer: "fairly sure"
            keep_order: true
          - id: l2-c5
            type: highlight_in_text
            text: "Tap the adverb of possibility."
            say: "Tap the adverb that shows how likely it is."
            show: { drawn: letter-card, text: "Surely the bus has gone by now" }
            spans: ["Surely"]
