# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.research-ideas
skill: lit-en.composition.research-ideas
curriculum: en-GB
language: en
title:
  de: Ideen sammeln und recherchieren
  en: Gathering and developing ideas
summary: >
  Children note ideas for a piece of writing from reading and research,
  then develop them. Lesson 1 takes note-making: key words instead of
  whole sentences, keeping only what fits the purpose, and noting where
  a fact came from. Lesson 2 takes developing the notes: grouping them
  under headings that become paragraphs, turning notes into sentences in
  your own words, adding a detail or example, and checking a source is
  reliable; it ends with the skill check. Children choose, sort and
  order notes; their own plans are not marked.
metadata:
  year: year-5
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.composition.plan-key-words, lit-en.comprehension.retrieve]
  also_practises: [lit-en.comprehension.retrieve-present]
  vocabulary: { en: [research, notes, key words, source, relevant, heading, paragraph, own words, copy, reliable, detail, example] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: key-words, what: { de: "Stichwörter notieren und die Quelle festhalten", en: noting key words and where they came from } }
    - { id: fits-purpose, what: { de: "nur Notizen behalten, die zum Zweck passen", en: keeping only notes that fit the purpose } }
    - { id: organise, what: { de: Notizen unter Überschriften für Absätze ordnen, en: grouping notes under headings for paragraphs } }
    - { id: own-words, what: { de: aus Notizen Sätze in eigenen Worten machen, en: turning notes into sentences in your own words } }
    - { id: develop, what: { de: "eine Idee mit Einzelheit, Beispiel oder Grund ausbauen und Quellen prüfen", en: "developing an idea with a detail, an example or a reason, and checking sources" } }
  misconceptions:
    - id: notes-copy-everything
      what: Copies whole sentences from the source instead of noting key words
      addressed: Learn screen 2 of lesson 1; l1-f1 (feedback), l1-f3, l1-s1, l1-n1, l2-c1
    - id: every-fact-belongs
      what: Notes every interesting fact, even ones that do not fit the purpose of the writing
      addressed: Learn screen 3 of lesson 1; l1-f4 (feedback), l1-s3, l1-n3, l2-c2
    - id: copy-into-writing
      what: Copies the source word for word into the final writing instead of using own words
      addressed: Learn screen 3 of lesson 2; l2-f3 (feedback), l2-s3, l2-n3, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Notizen machen, en: Making notes }
    goal:
      de: "Schreib beim Recherchieren nur die Schlüsselwörter auf, die zu deinem Thema passen, und notiere, woher jede Tatsache kommt."
      en: "When you research, note only the key words that fit your purpose, and write down where each fact came from."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Puffins\nHome: Puffins nest in burrows on cliffs.\nFood: They catch small fish such as sand eels.\n\nWhat do puffins eat?"
            options: ["small fish such as sand eels", "burrows on cliffs", "grass and seeds"]
            answer: "small fish such as sand eels"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which is a key word note for a story plan?"
            options: ["dark forest, lost dog", "Once upon a time there was a very dark forest where a dog got lost.", "the"]
            answer: "dark forest, lost dog"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Source: The Great Fire of London started on 2 September 1666 in a bakery on Pudding Lane.\nCopy every word, or just a few?"
            say: "Here is a guess to start. You are making notes from this sentence about the Great Fire of London. Should you copy every word, or write down just a few? What do you think?"
          - text: "Source: The Great Fire of London started on 2 September 1666 in a bakery on Pudding Lane.\nNote: 2 Sept 1666, bakery, Pudding Lane"
            say: "Just a few! When you research, read a source and note only the key words: the facts you need, not whole sentences. Notes are quick to write and easy to read back."
          - text: "Purpose: a report on how the fire spread.\nKeep: strong wind, wooden houses\nLeave out: the baker's name"
            say: "Keep your purpose in mind. If you are writing about how the fire spread, note the wind and the wooden houses. An interesting fact that does not fit can be left out."
          - text: "Source: Our London Book, page 12"
            say: "Write down where each fact came from: the book and page, or the website. Then you can check it later."
          - text: "Did you know? The Monument to the Great Fire of London is 202 feet tall. It stands 202 feet from the spot where the fire started."
            say: "Did you know? In London there is a tall stone column called the Monument, built to remember the Great Fire. It is two hundred and two feet tall, and it stands two hundred and two feet from the spot in Pudding Lane where the fire started. If it fell over in the right direction, its top would land on the bakery's spot! That is a fact worth a note."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Source: Hedgehogs sleep through the winter. This is called hibernation.\n\nWhich is the best note?"
                options: ["sleep all winter = hibernation", "Hedgehogs sleep through the winter. This is called hibernation.", "hedgehogs"]
                answer: "sleep all winter = hibernation"
                option_audio: false
                feedback:
                  "Hedgehogs sleep through the winter. This is called hibernation.": "That copies the whole source. A note keeps only the key words."
                hints:
                  - "Notes are short."
                  - "Keep only the key facts: sleep, winter, hibernation."
                  - "Sleep all winter = hibernation."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "You are researching what bats eat. Tap the key words to note."
                say: "You are researching what bats eat. Tap the key words you would note."
                show: { drawn: letter-card, text: "Most bats in Britain eat insects such as moths and midges" }
                spans: ["insects", "moths", "midges"]
                hints:
                  - "Your question is: what do bats eat?"
                  - "Look for the food words."
                  - "Insects, moths and midges."
              - id: l1-f3
                type: true_false
                text: "Is it true? Good notes copy out every sentence from the source."
                answer: false
                hints:
                  - "Why do we make notes?"
                  - "Notes are quick and short."
                  - "No, it is not true."
              - id: l1-f4
                type: multiple_choice
                text: "You are writing about how the Romans built roads. Which note fits your purpose?"
                options: ["straight roads, stone layers, ditches for rain", "Romans liked grapes", "Julius Caesar's birthday"]
                answer: "straight roads, stone layers, ditches for rain"
                option_audio: false
                feedback:
                  "Romans liked grapes": "That may be true, but it is not about roads. Keep only notes that fit your purpose."
                hints:
                  - "What is your writing about?"
                  - "It is about building roads."
                  - "Straight roads, stone layers, ditches for rain."
              - id: l1-f5
                type: multiple_choice
                text: "Why do you write down where a fact came from?"
                options: ["so you can check it later", "to make the notes longer", "because notes must be in pen"]
                answer: "so you can check it later"
                hints:
                  - "What if you are not sure a fact is right?"
                  - "You can go back to the source."
                  - "So you can check it later."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Source: The River Severn is the longest river in Britain. It is about 354 kilometres long.\n\nWhich is the best note?"
                options: ["Severn: longest UK river, about 354 km", "The River Severn is the longest river in Britain.", "river"]
                answer: "Severn: longest UK river, about 354 km"
                option_audio: false
                hints: ["Key words and numbers only."]
              - id: l1-s2
                type: highlight_in_text
                text: "You are researching where penguins live. Tap the key words to note."
                say: "You are researching where penguins live. Tap the key words you would note."
                show: { drawn: letter-card, text: "Emperor penguins live on the ice of Antarctica" }
                spans: ["ice", "Antarctica"]
                hints: ["Your question is where, so look for places."]
              - id: l1-s3
                type: sorting
                text: "You are writing a report on how bees make honey. Keep or leave out?"
                say: "You are writing a report on how bees make honey. Keep each note, or leave it out?"
                option_audio: false
                bins:
                  - { id: keep, show: { text: "keep" }, say: "Keep." }
                  - { id: leave, show: { text: "leave out" }, say: "Leave out." }
                options:
                  - { text: "collect nectar from flowers", bin: keep }
                  - { text: "bees can sting", bin: leave }
                  - { text: "store nectar in wax cells", bin: keep }
                  - { text: "my uncle hates bees", bin: leave }
                hints: ["Does the note tell you how honey is made?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? You should note the book or website each fact came from."
                answer: true
                hints: ["How would you check a fact later?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which is a note, not a full sentence?"
                options: ["lived 1000 years ago", "The Vikings lived over a thousand years ago.", "Did you know that the Vikings lived long ago?"]
                answer: "lived 1000 years ago"
                option_audio: false
                hints: ["A note is short and has no full stop."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Source: Cheetahs are the fastest land animals. They can run at over 100 kilometres per hour.\n\nWhich is the best note?"
                options: ["fastest land animal, over 100 km/h", "Cheetahs are the fastest land animals.", "fast"]
                answer: "fastest land animal, over 100 km/h"
                option_audio: false
              - id: l1-n2
                type: highlight_in_text
                text: "You are researching what owls eat. Tap the key words to note."
                say: "You are researching what owls eat. Tap the key words you would note."
                show: { drawn: letter-card, text: "Barn owls hunt mice, voles and shrews at night" }
                spans: ["mice", "voles", "shrews"]
              - id: l1-n3
                type: sorting
                text: "You are writing about why the Titanic sank. Keep or leave out?"
                say: "You are writing about why the Titanic sank. Keep each note, or leave it out?"
                option_audio: false
                bins:
                  - { id: keep, show: { text: "keep" }, say: "Keep." }
                  - { id: leave, show: { text: "leave out" }, say: "Leave out." }
                options:
                  - { text: "hit an iceberg at night", bin: keep }
                  - { text: "had a swimming pool", bin: leave }
                  - { text: "not enough lifeboats", bin: keep }
                  - { text: "menu had oysters", bin: leave }
              - id: l1-n4
                type: true_false
                text: "Is it true? An interesting fact that does not fit your purpose can be left out of your notes."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Ali notes facts about volcanoes from a website. What else should he write down?"
                options: ["the name of the website", "the colour of the website", "how long he spent reading"]
                answer: "the name of the website"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Source: Mount Everest is the highest mountain on Earth. It is in the Himalayas.\n\nWhich is the best note?"
            options: ["highest mountain, Himalayas", "Mount Everest is the highest mountain on Earth.", "mountain"]
            answer: "highest mountain, Himalayas"
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Is it true? Notes should use key words, not whole sentences."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "You are writing about how plants grow. Which note fits your purpose?"
            options: ["need water, light and warmth", "roses are red", "my gran likes daisies"]
            answer: "need water, light and warmth"
          - id: l1-c4
            type: multiple_choice
            text: "Source: African elephants can live for about 70 years.\n\nWhich is the best note?"
            options: ["elephants: live about 70 years", "African elephants can live for about 70 years.", "elephants"]
            answer: "elephants: live about 70 years"
            option_audio: false
          - id: l1-c5
            type: sorting
            text: "You are writing about what astronauts eat in space. Keep or leave out?"
            say: "You are writing about what astronauts eat in space. Keep each note, or leave it out?"
            option_audio: false
            bins:
              - { id: keep, show: { text: "keep" }, say: "Keep." }
              - { id: leave, show: { text: "leave out" }, say: "Leave out." }
            options:
              - { text: "food in sealed packets", bin: keep }
              - { text: "rockets are very loud", bin: leave }
              - { text: "drinks through a straw", bin: keep }
              - { text: "the first astronaut was Russian", bin: leave }
          - id: l1-c6
            type: true_false
            text: "Is it true? You do not need to note where a fact came from if it looks interesting."
            say: "Is it true? You do not need to note where a fact came from if it looks interesting."
            answer: false

  - n: 2
    title: { de: Ideen ordnen und ausbauen, en: Organising and developing ideas }
    goal:
      de: "Ordne deine Notizen unter Überschriften und mach aus jeder einen Satz in deinen Worten, so wie: Frösche legen ihren Laich in Teiche."
      en: "Sort your notes under headings, then turn each note into your own sentence, like frogs lay their spawn in ponds."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Source: Swifts spend almost their whole lives flying. They even sleep in the air.\n\nWhich is the best note?"
            options: ["nearly always flying, sleep in air", "Swifts spend almost their whole lives flying.", "birds"]
            answer: "nearly always flying, sleep in air"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? You should write down where your facts came from."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Notes on frogs:\nlay spawn in ponds | tadpoles hatch | eat insects | eaten by herons\n\nWhich notes go together?"
            say: "Here are some notes on frogs. Which notes do you think go together? Have a guess."
          - text: "Notes on frogs:\nlay spawn in ponds | tadpoles hatch | eat insects | eaten by herons\n\nHeadings: Life cycle | Food"
            say: "Did you put spawn with tadpoles, and insects with herons? When your notes are ready, sort them under headings. Spawn and tadpoles go under Life cycle. Insects and herons go under Food. Each heading becomes a paragraph."
          - text: "Note: lay spawn in ponds\nSentence: In spring, frogs lay their spawn in shallow ponds."
            say: "Then turn each note into a sentence in your own words. Do not copy the source word for word: say it your way."
          - text: "Develop it: add a detail or an example.\nA common frog can lay more than 1000 eggs at once."
            say: "Develop an idea by adding a detail, an example or a reason. That makes your writing more interesting."
          - text: "Check: Is the source reliable?"
            say: "Use reliable sources: an information book, a museum or a known website. A random comment online may be wrong, so check it in a second source."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Your report on the Ancient Egyptians has two paragraphs: Food and Homes. Sort the notes under the headings."
                say: "Your report on the Ancient Egyptians has two paragraphs: Food and Homes. Sort the notes."
                option_audio: false
                bins:
                  - { id: food, show: { text: "Food" }, say: "Food." }
                  - { id: homes, show: { text: "Homes" }, say: "Homes." }
                options:
                  - { text: "bread and onions", bin: food }
                  - { text: "mud-brick houses", bin: homes }
                  - { text: "fish from the Nile", bin: food }
                  - { text: "flat roofs to sleep on", bin: homes }
                hints:
                  - "Is each note about eating or about where they lived?"
                  - "Bread and fish are things to eat."
                  - "Bread and fish: Food. Mud-brick and flat roofs: Homes."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Note: \"eat insects, slugs, worms\"\n\nWhich sentence turns the note into good writing?"
                options: ["Hedgehogs feed on insects, slugs and worms.", "eat insects, slugs, worms", "Hedgehogs."]
                answer: "Hedgehogs feed on insects, slugs and worms."
                option_audio: false
                hints:
                  - "A sentence has a subject and a verb."
                  - "Who eats them?"
                  - "Hedgehogs feed on insects, slugs and worms."
              - id: l2-f3
                type: multiple_choice
                text: "Source: \"The Thames Barrier protects London from flooding by high tides.\"\n\nWhich sentence uses your own words?"
                options: ["A huge set of gates on the Thames stops high tides from flooding London.", "The Thames Barrier protects London from flooding by high tides.", "The Thames Barrier protects London."]
                answer: "A huge set of gates on the Thames stops high tides from flooding London."
                option_audio: false
                feedback:
                  "The Thames Barrier protects London from flooding by high tides.": "That copies the source word for word. Say the same fact in your own way."
                hints:
                  - "Which one does not copy the source?"
                  - "Own words say the fact in a new way."
                  - "A huge set of gates on the Thames ..."
              - id: l2-f4
                type: multiple_choice
                text: "Kai writes: \"Owls hunt at night.\"\nWhich sentence develops the idea with a detail?"
                options: ["Their soft feathers let them fly silently, so mice do not hear them coming.", "Owls are birds.", "Owls hunt at night."]
                answer: "Their soft feathers let them fly silently, so mice do not hear them coming."
                option_audio: false
                hints:
                  - "Developing means adding something new."
                  - "Look for a detail that explains how they hunt."
                  - "Their soft feathers let them fly silently."
              - id: l2-f5
                type: true_false
                text: "Is it true? For a report on the planets, an information book from a space museum is more reliable than a comment from a stranger online."
                answer: true
                hints:
                  - "Who checks the facts?"
                  - "Experts write museum books."
                  - "The information book from a space museum."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Your report on sharks has two paragraphs: Body and Food. Sort the notes under the headings."
                say: "Your report on sharks has two paragraphs: Body and Food. Sort the notes."
                option_audio: false
                bins:
                  - { id: body, show: { text: "Body" }, say: "Body." }
                  - { id: food, show: { text: "Food" }, say: "Food." }
                options:
                  - { text: "rows of sharp teeth", bin: body }
                  - { text: "seals and fish", bin: food }
                  - { text: "skin like sandpaper", bin: body }
                  - { text: "some eat tiny plankton", bin: food }
                hints: ["Is it about what sharks look like or what they eat?"]
              - id: l2-s2
                type: ordering
                text: "Put the steps for writing a report in order."
                say: "Put the steps for writing a report in order."
                option_audio: false
                options: ["write paragraphs in your own words", "check and improve", "read sources and make notes", "sort notes under headings"]
                slot_count: 4
                answer: ["read sources and make notes", "sort notes under headings", "write paragraphs in your own words", "check and improve"]
                hints: ["You cannot sort notes before you have made them."]
              - id: l2-s3
                type: multiple_choice
                text: "Source: \"Honeybees communicate by doing a waggle dance.\"\n\nWhich sentence uses your own words?"
                options: ["Bees wiggle in a special dance to tell each other things.", "Honeybees communicate by doing a waggle dance.", "Honeybees communicate."]
                answer: "Bees wiggle in a special dance to tell each other things."
                option_audio: false
                hints: ["Which one is not copied?"]
              - id: l2-s4
                type: true_false
                text: "Is it true? If a fact comes from one comment online, it is a good idea to check it in another source."
                answer: true
                hints: ["Could a comment online be wrong?"]
              - id: l2-s5
                type: multiple_choice
                text: "Mia writes: \"Castles had thick walls.\"\nWhich sentence develops the idea with a reason?"
                options: ["The walls were thick so that enemies could not break through.", "Castles were big.", "Castles had walls."]
                answer: "The walls were thick so that enemies could not break through."
                option_audio: false
                hints: ["Look for a sentence that says why."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Your report on the Vikings has two paragraphs: Ships and Daily life. Sort the notes under the headings."
                say: "Your report on the Vikings has two paragraphs: Ships and Daily life. Sort the notes."
                option_audio: false
                bins:
                  - { id: ships, show: { text: "Ships" }, say: "Ships." }
                  - { id: life, show: { text: "Daily life" }, say: "Daily life." }
                options:
                  - { text: "longships with a dragon head", bin: ships }
                  - { text: "farmed and kept animals", bin: life }
                  - { text: "oars and a square sail", bin: ships }
                  - { text: "longhouses with a fire in the middle", bin: life }
              - id: l2-n2
                type: multiple_choice
                text: "Note: \"born 1820, nurse, Crimean War\"\n\nWhich sentence turns the note into good writing?"
                options: ["Florence Nightingale, born in 1820, worked as a nurse in the Crimean War.", "born 1820, nurse, Crimean War", "Florence."]
                answer: "Florence Nightingale, born in 1820, worked as a nurse in the Crimean War."
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Source: \"Earthworms improve soil by mixing it as they tunnel.\"\n\nWhich sentence uses your own words?"
                options: ["As worms dig, they stir up the soil and make it better for plants.", "Earthworms improve soil by mixing it as they tunnel.", "Earthworms improve soil."]
                answer: "As worms dig, they stir up the soil and make it better for plants."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Is it true? A made-up story about a talking king is a reliable source for a report on the Tudors."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Leo writes: \"Rainforests are important.\"\nWhich sentence develops the idea with an example?"
                options: ["For example, many medicines come from rainforest plants.", "Rainforests are forests.", "Rainforests are important."]
                answer: "For example, many medicines come from rainforest plants."
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: key-words
            type: multiple_choice
            text: "Source: \"Polar bears have black skin under their white fur, which helps them soak up heat.\"\n\nWhich is the best note?"
            options: ["black skin, white fur, soaks up heat", "Polar bears have black skin under their white fur.", "bears"]
            answer: "black skin, white fur, soaks up heat"
            option_audio: false
          - id: l2-c2
            part: fits-purpose
            type: multiple_choice
            text: "You are writing about how volcanoes erupt. Which note fits your purpose?"
            options: ["magma rises, pressure builds, lava bursts out", "volcano films are exciting", "my cousin went to Italy"]
            answer: "magma rises, pressure builds, lava bursts out"
            option_audio: false
          - id: l2-c3
            part: organise
            type: sorting
            text: "Your report on dolphins has two paragraphs: Food and Family. Sort the notes under the headings."
            say: "Your report on dolphins has two paragraphs: Food and Family. Sort the notes."
            option_audio: false
            bins:
              - { id: food, show: { text: "Food" }, say: "Food." }
              - { id: family, show: { text: "Family" }, say: "Family." }
            options:
              - { text: "catch fish and squid", bin: food }
              - { text: "live in groups called pods", bin: family }
              - { text: "calves stay with mothers", bin: family }
              - { text: "use clicks to find prey", bin: food }
          - id: l2-c4
            part: own-words
            type: multiple_choice
            text: "Source: \"Stonehenge was built in stages over many hundreds of years.\"\n\nWhich sentence uses your own words?"
            options: ["People took hundreds of years to build Stonehenge, bit by bit.", "Stonehenge was built in stages over many hundreds of years.", "Stonehenge was built."]
            answer: "People took hundreds of years to build Stonehenge, bit by bit."
            option_audio: false
          - id: l2-c5
            part: own-words
            type: true_false
            text: "Is it true? Copying a sentence from the source word for word is the same as using your own words."
            answer: false
          - id: l2-c6
            part: key-words
            type: highlight_in_text
            text: "You are researching what giraffes eat. Tap the key words to note."
            say: "You are researching what giraffes eat. Tap the key words you would note."
            show: { drawn: letter-card, text: "Giraffes mostly eat acacia leaves" }
            spans: ["acacia", "leaves"]
          - id: l2-c7
            part: key-words
            type: multiple_choice
            text: "Source: \"The first Olympic Games were held in Greece nearly 3000 years ago.\"\n\nWhich is the best note?"
            options: ["first Olympics: Greece, nearly 3000 years ago", "The first Olympic Games were held in Greece nearly 3000 years ago.", "Olympics"]
