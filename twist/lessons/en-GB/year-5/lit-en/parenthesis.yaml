# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.parenthesis
skill: lit-en.grammar.parenthesis
curriculum: en-GB
language: en
title:
  de: Einschübe mit Klammern, Strichen und Kommas
  en: Parenthesis and commas for clarity
summary: >
  Punctuation from Appendix 2 of the National Curriculum for Year 5.
  Lesson 1 takes parenthesis: extra information added to a sentence
  inside a pair of brackets, a pair of dashes or a pair of commas, and
  the test that the sentence still makes sense without it. Lesson 2
  takes commas that make meaning clear: after a fronted adverbial or
  before a name being spoken to, where a missing comma changes the
  meaning (Let's eat, Grandma); it ends with the skill check. House
  style has no en dash character, so a parenthetic dash is written as a
  spaced hyphen ( - ) in these records; the app should draw it as a
  dash.
metadata:
  year: year-5
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.relative-clauses]
  also_practises: [lit-en.grammar.relative-clauses, lit-en.grammar.fronted-adverbials]
  vocabulary: { en: [parenthesis, brackets, dashes, commas, pair, extra information, main clause, fronted adverbial, ambiguous, clarity] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: mark-pair, what: { de: "Einschübe mit einem Paar Klammern, Striche oder Kommas markieren", en: "marking parenthesis with a pair of brackets, dashes or commas" } }
    - { id: find-extra, what: { de: "den Einschub finden, ohne den der Satz noch Sinn ergibt", en: the extra information the sentence still makes sense without } }
    - { id: comma-name, what: { de: ein Komma vor oder um den Namen der angesprochenen Person, en: a comma before or round the name of the person spoken to } }
    - { id: comma-adverbial, what: { de: "ein Komma nach einer vorangestellten Angabe, damit der Satz klar ist", en: a comma after a fronted adverbial so the sentence is clear } }
  misconceptions:
    - id: one-bracket-only
      what: Uses only one bracket, dash or comma, so the reader cannot tell where the extra information ends
      addressed: Learn screen 2 of lesson 1; l1-f2 (feedback), l1-f4, l1-s2, l1-n2, l2-c1
    - id: essential-in-brackets
      what: Puts words the sentence needs inside the brackets, so what is left no longer makes sense
      addressed: Learn screen 1 of lesson 1; l1-f3 (feedback), l1-s3, l1-n3, l2-c2
    - id: commas-decoration
      what: Thinks commas are only for pauses or decoration and do not change meaning
      addressed: Learn of lesson 2; l2-f1 (feedback), l2-f2, l2-s1, l2-n1, l2-c4
  twist_reuse: []
  dashes: true
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Klammern, Striche und Kommas", en: "Brackets, dashes and commas" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Choose the relative pronoun."
            frame: "The girl _ lives next door has a puppy."
            options: ["who", "which", "where"]
            answer: ["who"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which sentence has its commas in the right place?"
            options: ["Our school, which is very old, has a bell.", "Our school which, is very old has a bell.", "Our school which is, very old, has a bell."]
            answer: "Our school, which is very old, has a bell."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mount Snowdon (the highest mountain in Wales) is popular with walkers."
            say: "Parenthesis is extra information added to a sentence. Here the brackets hold the highest mountain in Wales. Take it out and the sentence still makes sense: Mount Snowdon is popular with walkers."
          - text: "brackets: ( ... )\ndashes: - ... -\ncommas: , ... ,"
            say: "You can mark parenthesis with a pair of brackets, a pair of dashes, or a pair of commas. Always use a pair: one at the start and one at the end of the extra information."
          - text: "My cousin - who is only six - can swim a length.\nMy cousin, who is only six, can swim a length."
            say: "Dashes make the extra information stand out more. Commas are quieter. Brackets often hold a fact or an aside."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap every word of the extra information."
                say: "Tap every word of the parenthesis, the extra information between the commas."
                show: { drawn: letter-card, text: "Mr Price, our head teacher, loves jazz." }
                spans: ["our", "head", "teacher"]
                hints:
                  - "Look between the two commas."
                  - "Which words could you take out?"
                  - "Our head teacher."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which sentence uses brackets correctly?"
                options: ["The Thames (the longest river in England) flows through London.", "The Thames (the longest river in England flows through London.", "The Thames the longest river (in England) flows through London."]
                answer: "The Thames (the longest river in England) flows through London."
                option_audio: false
                feedback:
                  "The Thames (the longest river in England flows through London.": "There is only one bracket. Brackets come in a pair, so the reader knows where the extra information ends."
                hints:
                  - "Brackets come in a pair."
                  - "They go round all the extra information."
                  - "The Thames (the longest river in England) flows ..."
              - id: l1-f3
                type: multiple_choice
                text: "Which words are extra information that could go in brackets?\n\"The cake which Mum made for my birthday was chocolate.\""
                options: ["which Mum made for my birthday", "The cake was chocolate", "was chocolate"]
                answer: "which Mum made for my birthday"
                option_audio: false
                feedback:
                  "was chocolate": "Without was chocolate, the sentence makes no sense. Extra information is a part you can take out."
                hints:
                  - "Which part could you take out?"
                  - "Read the sentence without it."
                  - "Which Mum made for my birthday."
              - id: l1-f4
                type: fill_in_blank
                text: "Add the missing punctuation."
                say: "The parenthesis starts with a dash. What goes at the end of it?"
                frame: "Our dog - a big hairy collie _ loves the snow."
                options: ["-", ".", "("]
                answer: ["-"]
                option_audio: false
                hints:
                  - "Parenthesis marks come in pairs."
                  - "It started with a dash."
                  - "Another dash."
              - id: l1-f5
                type: true_false
                text: "\"The bus (number 42) was late.\"\n\nIs it true? Without the brackets and what is inside, the sentence still makes sense."
                answer: true
                hints:
                  - "Cover up (number 42)."
                  - "Read what is left."
                  - "Yes: The bus was late."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap every word of the extra information."
                say: "Tap every word of the parenthesis, the extra information between the commas."
                show: { drawn: letter-card, text: "Paris, the capital of France, has a famous tower." }
                spans: ["the", "capital", "of", "France"]
                hints: ["Look between the commas."]
              - id: l1-s2
                type: multiple_choice
                text: "Which sentence uses dashes correctly?"
                options: ["The snake - all four metres of it - slid away.", "The snake - all four metres of it slid away.", "The snake all four - metres of it - slid away."]
                answer: "The snake - all four metres of it - slid away."
                option_audio: false
                hints: ["A pair of dashes goes round all the extra words."]
              - id: l1-s3
                type: multiple_choice
                text: "Which words are extra information?\n\"Jupiter, the largest planet, has many moons.\""
                options: ["the largest planet", "Jupiter has", "many moons"]
                answer: "the largest planet"
                option_audio: false
                hints: ["Which part can you take out?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Add the missing punctuation."
                say: "The parenthesis starts with a bracket. What goes at the end of it?"
                frame: "Ava (my best friend _ is moving to Leeds."
                options: [")", "(", ","]
                answer: [")"]
                option_audio: false
                hints: ["It needs a closing bracket."]
              - id: l1-s5
                type: true_false
                text: "Is it true? Parenthesis can be marked with a pair of commas."
                answer: true
                hints: ["Brackets, dashes or commas."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap every word of the extra information."
                say: "Tap every word of the parenthesis, the extra information between the commas."
                show: { drawn: letter-card, text: "Ben, who is nine, plays the violin." }
                spans: ["who", "is", "nine"]
              - id: l1-n2
                type: multiple_choice
                text: "Which sentence uses brackets correctly?"
                options: ["The shop (open since 1920) sells toys.", "The shop (open since 1920 sells toys.", "The shop open (since) 1920 sells toys."]
                answer: "The shop (open since 1920) sells toys."
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Where should the brackets go?\n\"Emperor penguins the largest penguins live in Antarctica.\""
                options: ["Emperor penguins (the largest penguins) live in Antarctica.", "Emperor penguins the largest (penguins live) in Antarctica.", "(Emperor penguins) the largest penguins live in Antarctica."]
                answer: "Emperor penguins (the largest penguins) live in Antarctica."
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Add the missing punctuation."
                say: "The parenthesis starts with a comma. What goes at the end of it?"
                frame: "Mrs Ali, our music teacher_ plays the harp."
                options: [",", ")", "."]
                answer: [","]
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? You only need one bracket to mark extra information."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap every word of the extra information."
            say: "Tap every word of the parenthesis, the extra information between the commas."
            show: { drawn: letter-card, text: "My gran, a retired nurse, knits scarves." }
            spans: ["a", "retired", "nurse"]
          - id: l1-c2
            type: multiple_choice
            text: "Which sentence uses dashes correctly?"
            options: ["The storm - the worst for years - blew down trees.", "The storm - the worst for years blew down trees.", "The storm the worst - for years - blew down trees."]
            answer: "The storm - the worst for years - blew down trees."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "\"Sam (my brother) is tall.\"\n\nIs it true? \"my brother\" is the extra information."
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Add the missing punctuation."
            say: "Read the sentence. Add the missing punctuation."
            frame: "The parrot_ bright green and noisy_ sat on my shoulder."
            options: [",", "(", "."]
            answer: [",", ","]
            option_audio: false
          - id: l1-c5
            type: highlight_in_text
            text: "Tap every word of the extra information."
            say: "Tap every word of the parenthesis, the extra information between the dashes."
            show: { drawn: letter-card, text: "The puppy - only ten weeks old - chewed my shoe." }
            spans: ["only", "ten", "weeks", "old"]
          - id: l1-c6
            type: true_false
            text: "\"My uncle - a pilot flies to Spain every week.\"\n\nIs it true? The dashes are used correctly."
            say: "Read the sentence. Is it true? The dashes are used correctly."
            answer: false

  - n: 2
    title: { de: Kommas für Klarheit, en: Commas that change meaning }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which sentence uses brackets correctly?"
            options: ["The castle (built in 1280) is on a hill.", "The castle (built in 1280 is on a hill.", "The castle built (in 1280 is) on a hill."]
            answer: "The castle (built in 1280) is on a hill."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which words are extra information?\n\"Leo, my little brother, loves dinosaurs.\""
            options: ["my little brother", "Leo loves", "dinosaurs"]
            answer: "my little brother"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Let's eat, Grandma!\nLet's eat Grandma!"
            say: "Commas can change the meaning of a sentence. With a comma, we are telling Grandma it is time to eat. Without it, we are going to eat Grandma! A comma goes before the name of the person you are speaking to."
          - text: "After eating, the dog went to sleep.\nAfter eating the dog ..."
            say: "A comma after a fronted adverbial shows where it ends. After eating, the dog went to sleep. Without the comma, the reader might think someone ate the dog."
          - text: "I'm sorry, Tom, but you are out."
            say: "If the name is in the middle of the sentence, it gets a comma on each side, like parenthesis."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which sentence means you are telling Ali to come and eat?"
                options: ["Let's eat, Ali.", "Let's eat Ali.", "Lets, eat Ali."]
                answer: "Let's eat, Ali."
                option_audio: false
                feedback:
                  "Let's eat Ali.": "Without a comma, this says you are going to eat Ali! The comma before Ali shows you are speaking to him."
                hints:
                  - "Who is being spoken to?"
                  - "A comma goes before the name of the person you speak to."
                  - "Let's eat, Ali."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which sentence makes it clear that the children did not stop the horses?"
                options: ["When the children stopped, the horses ran on.", "When the children stopped the horses ran on.", "When, the children stopped the horses ran on."]
                answer: "When the children stopped, the horses ran on."
                option_audio: false
                hints:
                  - "Where does the fronted adverbial end?"
                  - "When the children stopped is the first part."
                  - "When the children stopped, the horses ran on."
              - id: l2-f3
                type: fill_in_blank
                text: "Add the comma that makes the meaning clear."
                say: "You are asking Max a question. Where does the comma go?"
                frame: "Are you ready_ Max?"
                options: [",", ".", "!"]
                answer: [","]
                option_audio: false
                hints:
                  - "Max is the person you are speaking to."
                  - "Put a comma before his name."
                  - "A comma."
              - id: l2-f4
                type: true_false
                text: "Is it true? \"After cooking, Dad sat down\" and \"After cooking Dad sat down\" can mean different things."
                answer: true
                hints:
                  - "Read the second one carefully."
                  - "Without a comma, it sounds like someone cooked Dad."
                  - "Yes, it is true."
              - id: l2-f5
                type: multiple_choice
                text: "Which sentence is punctuated correctly?"
                options: ["Thank you, Mrs Bell, for the books.", "Thank you Mrs Bell for, the books.", "Thank, you Mrs Bell for the books."]
                answer: "Thank you, Mrs Bell, for the books."
                option_audio: false
                hints:
                  - "Mrs Bell is the person spoken to."
                  - "In the middle, a name has a comma on each side."
                  - "Thank you, Mrs Bell, for the books."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which sentence means you are asking Gran to help you cook?"
                options: ["Can we cook, Gran?", "Can we cook Gran?", "Can, we cook Gran?"]
                answer: "Can we cook, Gran?"
                option_audio: false
                hints: ["Gran is the person you speak to."]
              - id: l2-s2
                type: multiple_choice
                text: "Which sentence makes it clear that the cat did not eat the mouse?"
                options: ["While the cat ate, the mouse escaped.", "While the cat ate the mouse escaped.", "While, the cat ate the mouse escaped."]
                answer: "While the cat ate, the mouse escaped."
                option_audio: false
                hints: ["Where does the fronted adverbial end?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Add the comma that makes the meaning clear."
                say: "You are speaking to Nadia. Where does the comma go?"
                frame: "Look out_ Nadia!"
                options: [",", "?", "."]
                answer: [","]
                option_audio: false
                hints: ["A comma before the name."]
              - id: l2-s4
                type: true_false
                text: "Is it true? \"Let's eat Grandma!\" and \"Let's eat, Grandma!\" mean the same thing."
                answer: false
                hints: ["Who is being eaten in the first one?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which sentence is punctuated correctly?"
                options: ["Well done, Jake, that was brilliant!", "Well done Jake that, was brilliant!", "Well, done Jake that was brilliant!"]
                answer: "Well done, Jake, that was brilliant!"
                option_audio: false
                hints: ["A name in the middle has a comma on each side."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which sentence means you are asking Rosie to come and draw?"
                options: ["Shall we draw, Rosie?", "Shall we draw Rosie?", "Shall, we draw Rosie?"]
                answer: "Shall we draw, Rosie?"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Which sentence makes it clear that Dad was not cleaning the cat?"
                options: ["While Dad was cleaning, the cat slept.", "While Dad was cleaning the cat slept.", "While, Dad was cleaning the cat slept."]
                answer: "While Dad was cleaning, the cat slept."
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Add the comma that makes the meaning clear."
                say: "You are speaking to Mr Shaw. Where does the comma go?"
                frame: "Good morning_ Mr Shaw."
                options: [",", "!", "?"]
                answer: [","]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence is punctuated correctly?"
                options: ["Hurry up, Ellie, or we'll miss the bus!", "Hurry up Ellie or, we'll miss the bus!", "Hurry, up Ellie or we'll miss the bus!"]
                answer: "Hurry up, Ellie, or we'll miss the bus!"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? A comma after a fronted adverbial can stop a sentence being misread."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: mark-pair
            type: multiple_choice
            text: "Which sentence uses brackets correctly?"
            options: ["The owl (a barn owl) hooted all night.", "The owl (a barn owl hooted all night.", "The owl a barn (owl hooted) all night."]
            answer: "The owl (a barn owl) hooted all night."
            option_audio: false
          - id: l2-c2
            part: find-extra
            type: multiple_choice
            text: "Which words are extra information?\n\"Cardiff, the capital of Wales, has a castle.\""
            options: ["the capital of Wales", "Cardiff has", "a castle"]
            answer: "the capital of Wales"
            option_audio: false
          - id: l2-c3
            part: mark-pair
            type: fill_in_blank
            text: "Add the missing punctuation."
            say: "Read the sentence. Add the missing punctuation."
            frame: "The cake - still warm from the oven _ smelt delicious."
            options: ["-", ")", "?"]
            answer: ["-"]
            option_audio: false
          - id: l2-c4
            part: comma-name
            type: multiple_choice
            text: "Which sentence means you are telling Sam it is time to eat?"
            options: ["Time to eat, Sam!", "Time to eat Sam!", "Time, to eat Sam!"]
            answer: "Time to eat, Sam!"
            option_audio: false
          - id: l2-c5
            part: comma-adverbial
            type: true_false
            text: "Is it true? \"While Mum cooked the dog barked\" needs a comma after cooked to be clear."
            answer: true
          - id: l2-c6
            part: mark-pair
            type: fill_in_blank
            text: "Add the missing punctuation."
            say: "Read the sentence. Add the missing punctuation."
            frame: "The fox _ hungry after the long winter _ crept closer."
            options: ["-", "(", "."]
            answer: ["-", "-"]
            option_audio: false
          - id: l2-c7
            part: mark-pair
            type: multiple_choice
            text: "Which sentence uses commas for parenthesis correctly?"
            options: ["The hedgehog, tired and hungry, crept into the garden.", "The hedgehog tired, and hungry crept into the garden.", "The hedgehog, tired and hungry crept into the garden."]
            answer: "The hedgehog, tired and hungry, crept into the garden."
            option_audio: false
          - id: l2-c8
            part: mark-pair
            type: true_false
            text: "\"The film (it lasted three hours was boring.\"\n\nIs it true? The brackets are used correctly."
            say: "Read the sentence. Is it true? The brackets are used correctly."
            answer: false
          - id: l2-c9
            part: find-extra
            type: highlight_in_text
            text: "Tap every word of the extra information."
            say: "Tap every word of the parenthesis, the extra information between the dashes."
            show: { drawn: letter-card, text: "My bedroom - the smallest room upstairs - is painted blue." }
            spans: ["the", "smallest", "room", "upstairs"]
          - id: l2-c10
            part: find-extra
            type: multiple_choice
            text: "Which words could go in brackets?\n\"Our town which has a market every Friday is near the sea.\""
            options: ["which has a market every Friday", "Our town is near the sea", "is near the sea"]
            answer: "which has a market every Friday"
            option_audio: false
          - id: l2-c11
            part: find-extra
            type: true_false
            text: "\"Elena, my neighbour, grows tomatoes.\"\n\nIs it true? You can take out \"my neighbour\" and the sentence still makes sense."
            say: "Read the sentence. Is it true? You can take out my neighbour, and the sentence still makes sense."
            answer: true
          - id: l2-c12
            part: find-extra
            type: multiple_choice
            text: "\"The tiger - a big cat from Asia - has striped fur.\"\n\nWhat is left when you take out the parenthesis?"
            options: ["The tiger has striped fur.", "The tiger a big cat from Asia.", "A big cat from Asia has striped fur."]
            answer: "The tiger has striped fur."
            option_audio: false
          - id: l2-c13
            part: comma-name
            type: true_false
            text: "\"Dinner is ready Mia.\"\n\nIs it true? You are speaking to Mia, so this sentence needs a comma before Mia."
            say: "Read the sentence. Is it true? You are speaking to Mia, so this sentence needs a comma before Mia."
            answer: true
          - id: l2-c14
            part: comma-name
            type: highlight_in_text
            text: "You are speaking to Dr Jones. Tap the two words that need a comma after them."
            say: "You are speaking to Doctor Jones. Tap the two words that need a comma after them."
            show: { drawn: letter-card, text: "Yes Dr Jones I have taken my medicine." }
            spans: ["Yes", "Jones"]
          - id: l2-c15
            part: comma-name
            type: multiple_choice
            text: "Which sentence is punctuated correctly?"
            options: ["Please, Mr Lee, can we go outside?", "Please Mr Lee can, we go outside?", "Please, Mr Lee can we go outside?"]
            answer: "Please, Mr Lee, can we go outside?"
            option_audio: false
          - id: l2-c16
            part: comma-name
            type: multiple_choice
            text: "Which sentence asks Jack whether the dog is his?"
            options: ["Is that your dog, Jack?", "Is that your dog Jack?", "Is that, your dog Jack?"]
            answer: "Is that your dog, Jack?"
            option_audio: false
          - id: l2-c17
            part: comma-adverbial
            type: multiple_choice
            text: "\"As soon as we had finished painting the door opened.\"\n\nWhere should the comma go?"
            options: ["after painting", "after door", "after finished"]
            answer: "after painting"
            option_audio: false
          - id: l2-c18
            part: comma-adverbial
            type: fill_in_blank
            text: "Add the comma that makes the meaning clear."
            say: "Read the sentence. Add the comma that makes the meaning clear."
            frame: "Before eating_ Sam washed his hands."
            options: [",", ".", "?"]
            answer: [","]
            option_audio: false
          - id: l2-c19
            part: comma-adverbial
            type: true_false
            text: "\"After the match, we went for pizza.\"\n\nIs it true? The comma is in the wrong place."
            say: "Read the sentence. Is it true? The comma is in the wrong place."
            answer: false
          - id: l2-c20
            part: comma-adverbial
            type: highlight_in_text
            text: "Tap the word that needs a comma after it."
            say: "Tap the word that needs a comma after it."
            show: { drawn: letter-card, text: "Once the rain stopped the children ran outside." }
            spans: ["stopped"]
