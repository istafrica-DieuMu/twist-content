# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.suffixes-ks2-upper
skill: lit-en.spelling.suffixes-ks2-upper
curriculum: en-GB
language: en
title:
  de: Weitere Nachsilben richtig schreiben
  en: "Further suffixes: -cious, -cial, -ant, -able and -fer"
summary: >
  The Years 5 and 6 suffixes from Appendix 1 of the National Curriculum,
  with the guidance for each. Lesson 1: -cious or -tious (space gives
  spacious, caution gives cautious) and -cial after a vowel, -tial after
  a consonant. Lesson 2: -ant, -ance and -ancy against -ent, -ence and
  -ency, using a related word and the soft c, soft g and qu rule.
  Lesson 3: -able or -ible (a related -ation word or a whole root word
  takes -able), -ably and -ibly, and doubling the r of -fer when the
  stress stays on it; it ends with the skill check. Exception words
  (anxious, initial, financial) are taught as words to learn.
metadata:
  year: year-5
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.spelling.prefixes-suffixes-ks2]
  also_practises: [lit-en.spelling.prefixes-suffixes-ks2]
  vocabulary: { en: [suffix, root word, related word, vowel, consonant, soft c, soft g, stress, syllable, exception] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: cious-tious-guess
      what: Guesses between -cious and -tious by sound, writing spatious or cautious as caucious
      addressed: Learn screen 1 of lesson 1; l1-f1 (feedback), l1-f3, l1-s1, l1-n1, l3-c1
    - id: cial-tial-guess
      what: Writes -tial after a vowel (offitial) or -cial after a consonant (essencial)
      addressed: Learn screen 2 of lesson 1; l1-f4 (feedback), l1-s3, l1-n3, l3-c2
    - id: ant-ent-guess
      what: Mixes -ant and -ent (and -ance and -ence), writing hesitent or innocance
      addressed: Learn of lesson 2; l2-f1 (feedback), l2-f3, l2-s2, l2-n2, l3-c3
    - id: able-ible-guess
      what: Uses -ible after a whole root word (dependible) or -able where the root is not a word (possable)
      addressed: Learn screens 1 and 2 of lesson 3; l3-f1 (feedback), l3-f2, l3-s1, l3-n1, l3-c4
    - id: fer-always-doubles
      what: Doubles the r of -fer every time (refference) or never (prefering)
      addressed: Learn screen 3 of lesson 3; l3-f4 (feedback), l3-s4, l3-n4, l3-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "-cious, -tious, -cial, -tial", en: "-cious, -tious, -cial and -tial" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which word means someone who works with music?"
            options: ["musician", "musition", "musision"]
            answer: "musician"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word means the opposite of appear?"
            options: ["disappear", "misappear", "reappear"]
            answer: "disappear"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "space → spacious\ngrace → gracious\ncaution → cautious\nambition → ambitious"
            say: "The ending shus can be spelt cious or tious. Look at the root word. If it ends in ce, like space and grace, use cious. If a related word ends in tion, like caution and ambition, use tious."
          - text: "anxious"
            say: "One word to learn: anxious. It ends in xious."
          - text: "after a vowel: special, official, social\nafter a consonant: partial, essential, confidential"
            say: "The ending shul can be spelt cial or tial. After a vowel letter, use cial: special, official. After a consonant letter, use tial: partial, essential."
          - text: "Learn these: initial, financial, commercial"
            say: "Some words break the rule and must be learnt: initial has tial after a vowel, and financial and commercial have cial after a consonant."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "space → ?"
                say: "A room with lots of space is ... Which spelling is right?"
                options: ["spacious", "spatious", "spaceous"]
                answer: "spacious"
                option_audio: false
                feedback:
                  "spatious": "Space ends in ce, so the ending is cious: spacious."
                hints:
                  - "How does the root word end?"
                  - "Space ends in ce, so keep the c."
                  - "Spacious."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Match each root word to its adjective."
                say: "Match each root word to the adjective made from it."
                option_audio: false
                pairs:
                  - { left: { text: "grace" }, right: { text: "gracious" } }
                  - { left: { text: "nutrition" }, right: { text: "nutritious" } }
                  - { left: { text: "vice" }, right: { text: "vicious" } }
                  - { left: { text: "infection" }, right: { text: "infectious" } }
                hints:
                  - "Root words ending in ce take cious."
                  - "Related words ending in tion take tious."
                  - "Gracious, nutritious, vicious, infectious."
              - id: l1-f3
                type: text_input
                text: "caution → c____ous\nWrite the whole word."
                say: "Write the word cautious. It comes from caution."
                keyboard: letters
                answer: "cautious"
                hints:
                  - "Caution ends in tion."
                  - "So the ending is tious."
                  - "cautious"
              - id: l1-f4
                type: multiple_choice
                text: "Which spelling is right?"
                say: "The word means very important. Which spelling is right?"
                options: ["essential", "essencial", "essentiall"]
                answer: "essential"
                option_audio: false
                feedback:
                  "essencial": "The letter before the ending is n, a consonant. After a consonant, use tial."
                hints:
                  - "Which letter comes just before the ending?"
                  - "n is a consonant."
                  - "Essential."
              - id: l1-f5
                type: sorting
                text: "-cial or -tial?"
                say: "Does each word end in cial or tial? Sort them."
                option_audio: false
                bins:
                  - { id: cial, show: { text: "-cial" }, say: "C I A L." }
                  - { id: tial, show: { text: "-tial" }, say: "T I A L." }
                options:
                  - { text: "spe...", bin: cial }
                  - { text: "par...", bin: tial }
                  - { text: "offi...", bin: cial }
                  - { text: "confiden...", bin: tial }
                hints:
                  - "Look at the last letter before the dots."
                  - "Vowel before: cial. Consonant before: tial."
                  - "special and official: cial. partial and confidential: tial."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "ambition → ?"
                say: "Someone with big ambitions is ... Which spelling is right?"
                options: ["ambitious", "ambicious", "ambitous"]
                answer: "ambitious"
                option_audio: false
                hints: ["Ambition ends in tion."]
              - id: l1-s2
                type: text_input
                text: "malice → mali_____\nWrite the whole word."
                say: "Write the word malicious. It comes from malice."
                keyboard: letters
                answer: "malicious"
                hints: ["Malice ends in ce."]
              - id: l1-s3
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Something from the people in charge is ... Which spelling is right?"
                options: ["official", "offitial", "oficial"]
                answer: "official"
                option_audio: false
                hints: ["The letter before the ending is i, a vowel."]
              - id: l1-s4
                type: true_false
                text: "Is it true? The word anxious follows the -cious rule."
                answer: false
                hints: ["Look at the letter before ious."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap every word that is spelt correctly."
                say: "Tap every word that is spelt correctly."
                show: { drawn: letter-card, text: "precious partial delicious cautious socitial" }
                spans: ["precious", "partial", "delicious", "cautious"]
                hints: ["One word has tial after a vowel."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "fiction → ?"
                say: "Something made up and not true is ... Which spelling is right?"
                options: ["fictitious", "ficticious", "fictious"]
                answer: "fictitious"
                option_audio: false
              - id: l1-n2
                type: text_input
                text: "Write the word you hear. It comes from grace."
                say: "Write the word gracious."
                keyboard: letters
                answer: "gracious"
              - id: l1-n3
                type: multiple_choice
                text: "Which spelling is right?"
                say: "A street where people live in houses is a residential street. Which spelling is right?"
                options: ["residential", "residencial", "residentual"]
                answer: "residential"
                option_audio: false
              - id: l1-n4
                type: text_input
                text: "Write the word you hear. It is the opposite of ordinary."
                say: "Write the word special."
                keyboard: letters
                answer: "special"
              - id: l1-n5
                type: true_false
                text: "Is it true? The word initial breaks the -cial rule."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "infection → ?"
            say: "A cold that spreads is ... Which spelling is right?"
            options: ["infectious", "infecious", "infectous"]
            answer: "infectious"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which spelling is right?"
            say: "To do with friends and groups is ... Which spelling is right?"
            options: ["social", "sotial", "socail"]
            answer: "social"
            option_audio: false
          - id: l1-c3
            type: text_input
            text: "Write the word you hear. It comes from space."
            say: "Write the word spacious."
            keyboard: letters
            answer: "spacious"

  - n: 2
    title: { de: "-ant oder -ent", en: "-ant or -ent" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "nutrition → ?"
            say: "Food that is good for you is ... Which spelling is right?"
            options: ["nutritious", "nutricious", "nutritous"]
            answer: "nutritious"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Only part of something is ... Which spelling is right?"
            options: ["partial", "parcial", "partiall"]
            answer: "partial"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "hesitation → hesitant, hesitancy\nobservation → observant, observance\nexpectation → expectant"
            say: "The endings ant and ent sound alike. Say a related word. If it has a clear ay sound, as in hesitation and observation, use ant, ance or ancy."
          - text: "innocent, innocence\ndecent, decency\nfrequent, frequency\nurgent, urgency"
            say: "Use ent, ence or ency after a soft c, which sounds like s, a soft g, which sounds like j, or qu. Innocent and decent have a soft c, urgent has a soft g, and frequent has qu."
          - text: "-ant → -ance, -ancy\n-ent → -ence, -ency"
            say: "The adjective and the noun go together. If the adjective ends in ant, the noun ends in ance or ancy. If it ends in ent, the noun ends in ence or ency."
          - text: "Learn these: assistant, obedient, independent"
            say: "Some words have no clue and must be learnt: assistant, obedient, independent."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "hesitation → ?"
                say: "Someone who holds back is ... Which spelling is right?"
                options: ["hesitant", "hesitent", "hesitint"]
                answer: "hesitant"
                option_audio: false
                feedback:
                  "hesitent": "Say the related word: hesitation. It has a clear ay sound, so use ant."
                hints:
                  - "Say a related word that ends in tion."
                  - "Hesitation has a clear ay sound."
                  - "Hesitant."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Match each adjective to its noun."
                say: "Match each adjective to the noun that goes with it."
                option_audio: false
                pairs:
                  - { left: { text: "observant" }, right: { text: "observance" } }
                  - { left: { text: "innocent" }, right: { text: "innocence" } }
                  - { left: { text: "decent" }, right: { text: "decency" } }
                  - { left: { text: "hesitant" }, right: { text: "hesitancy" } }
                hints:
                  - "ant goes with ance or ancy."
                  - "ent goes with ence or ency."
                  - "Observance, innocence, decency, hesitancy."
              - id: l2-f3
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Something that happens often is ... Which spelling is right?"
                options: ["frequent", "frequant", "freqent"]
                answer: "frequent"
                option_audio: false
                hints:
                  - "Look at the letters before the ending."
                  - "After qu, use ent."
                  - "Frequent."
              - id: l2-f4
                type: text_input
                text: "innocent → innoc____\nWrite the noun."
                say: "Write the noun innocence. It goes with innocent."
                keyboard: letters
                answer: "innocence"
                hints:
                  - "innocent ends in ent."
                  - "ent goes with ence."
                  - "innocence"
              - id: l2-f5
                type: sorting
                text: "-ant or -ent?"
                say: "Does each word end in ant or ent? Sort them."
                option_audio: false
                bins:
                  - { id: ant, show: { text: "-ant" }, say: "A N T." }
                  - { id: ent, show: { text: "-ent" }, say: "E N T." }
                options:
                  - { text: "expect... (expectation)", bin: ant }
                  - { text: "dec... (soft c)", bin: ent }
                  - { text: "toler... (toleration)", bin: ant }
                  - { text: "urg... (soft g)", bin: ent }
                hints:
                  - "Read the clue in brackets."
                  - "An ation word gives ant; a soft c or g gives ent."
                  - "expectant and tolerant: ant. decent and urgent: ent."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "observation → ?"
                say: "Someone who notices things is ... Which spelling is right?"
                options: ["observant", "observent", "obsevant"]
                answer: "observant"
                option_audio: false
                hints: ["Observation has a clear ay sound."]
              - id: l2-s2
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Not guilty is ... Which spelling is right?"
                options: ["innocent", "innocant", "inocent"]
                answer: "innocent"
                option_audio: false
                hints: ["The c is soft, like s."]
              - id: l2-s3
                type: text_input
                text: "frequent → frequ____\nWrite the noun."
                say: "Write the noun frequency. It goes with frequent."
                keyboard: letters
                answer: "frequency"
                hints: ["ent goes with ency."]
              - id: l2-s4
                type: true_false
                text: "Is it true? If an adjective ends in -ant, its noun ends in -ance or -ancy."
                answer: true
                hints: ["Think of hesitant and hesitancy."]
              - id: l2-s5
                type: multiple_choice
                text: "Which of these words must be learnt, because no related word gives a clue?"
                options: ["assistant", "hesitant", "observant"]
                answer: "assistant"
                option_audio: false
                hints: ["Hesitation and observation give clues."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "expectation → ?"
                say: "Waiting for something is being ... Which spelling is right?"
                options: ["expectant", "expectent", "expecktant"]
                answer: "expectant"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Something that needs doing straight away is ... Which spelling is right?"
                options: ["urgent", "urgant", "ergent"]
                answer: "urgent"
                option_audio: false
              - id: l2-n3
                type: text_input
                text: "decent → dec____\nWrite the noun."
                say: "Write the noun decency. It goes with decent."
                keyboard: letters
                answer: "decency"
              - id: l2-n4
                type: text_input
                text: "Write the word you hear. It is the noun of tolerant."
                say: "Write the word tolerance."
                keyboard: letters
                answer: "tolerance"
              - id: l2-n5
                type: highlight_in_text
                text: "Tap every word that is spelt correctly."
                say: "Tap every word that is spelt correctly."
                show: { drawn: letter-card, text: "obedient hesitancy innocance frequent" }
                spans: ["obedient", "hesitancy", "frequent"]

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "toleration → ?"
            say: "Someone who puts up with things is ... Which spelling is right?"
            options: ["tolerant", "tolerent", "tollerant"]
            answer: "tolerant"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Which noun goes with confident?"
            options: ["confidence", "confidance", "confidency"]
            answer: "confidence"
            option_audio: false
          - id: l2-c3
            type: text_input
            text: "Write the word you hear. It is the noun of urgent."
            say: "Write the word urgency."
            keyboard: letters
            answer: "urgency"

  - n: 3
    title: { de: "-able, -ible und -fer", en: "-able, -ible and -fer" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "hesitant → ?"
            say: "Which noun goes with hesitant?"
            options: ["hesitancy", "hesitency", "hesitansy"]
            answer: "hesitancy"
            option_audio: false
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "Which spelling is right?"
            say: "Happening often is ... Which spelling is right?"
            options: ["frequent", "frequant", "frequint"]
            answer: "frequent"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "adoration → adorable\napplication → applicable\ndepend → dependable\ncomfort → comfortable"
            say: "Use able if there is a related word ending in ation, like adoration and application. Use able, too, if the root is a whole word you can hear on its own, like depend and comfort. A final e drops: adore, adorable. But after a soft c or g it stays: noticeable, changeable."
          - text: "possible, horrible, terrible, visible, incredible"
            say: "Use ible when the root is not a whole word on its own. Poss, horr and terr are not words, so we write possible, horrible and terrible."
          - text: "able → ably: comfortably\nible → ibly: possibly"
            say: "For adverbs, able becomes ably and ible becomes ibly: comfortably, reasonably, possibly, horribly."
          - text: "refer → referring, referred\nrefer → reference"
            say: "Words ending in fer. Say the new word. If the fer is still stressed, double the r: referring, referred, preferring. If the stress moves away from fer, keep one r: reference, preference."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "depend → ?"
                say: "Someone you can rely on is ... Which spelling is right?"
                options: ["dependable", "dependible", "dependeble"]
                answer: "dependable"
                option_audio: false
                feedback:
                  "dependible": "Depend is a whole word on its own, so it takes able."
                hints:
                  - "Is the root a whole word on its own?"
                  - "Depend is a word you can say by itself."
                  - "Dependable."
                difficulty: easy
              - id: l3-f2
                type: sorting
                text: "-able or -ible?"
                say: "Does each word end in able or ible? Sort them."
                option_audio: false
                bins:
                  - { id: able, show: { text: "-able" }, say: "A B L E." }
                  - { id: ible, show: { text: "-ible" }, say: "I B L E." }
                options:
                  - { text: "comfort...", bin: able }
                  - { text: "terr...", bin: ible }
                  - { text: "enjoy...", bin: able }
                  - { text: "vis...", bin: ible }
                hints:
                  - "Is the part before the dots a whole word?"
                  - "Comfort and enjoy are words; terr and vis are not."
                  - "comfortable and enjoyable: able. terrible and visible: ible."
              - id: l3-f3
                type: text_input
                text: "notice → notice____\nWrite the whole word."
                say: "Write the word noticeable. It comes from notice."
                keyboard: letters
                answer: "noticeable"
                hints:
                  - "The c in notice is soft."
                  - "After a soft c, keep the e."
                  - "noticeable"
              - id: l3-f4
                type: multiple_choice
                text: "prefer + ing → ?"
                say: "Which spelling is right?"
                options: ["preferring", "prefering", "preffering"]
                answer: "preferring"
                option_audio: false
                feedback:
                  "prefering": "Say it: pre-FER-ring. The fer is still stressed, so double the r."
                hints:
                  - "Say the new word. Where is the stress?"
                  - "pre-FER-ring: the stress is still on fer."
                  - "Preferring."
              - id: l3-f5
                type: multiple_choice
                text: "Which adverb is spelt correctly?"
                options: ["possibly", "possably", "possiblely"]
                answer: "possibly"
                option_audio: false
                hints:
                  - "Possible ends in ible."
                  - "ible becomes ibly."
                  - "Possibly."

          - support: some
            tasks:
              - id: l3-s1
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Very bad is ... Which spelling is right?"
                options: ["horrible", "horrable", "horible"]
                answer: "horrible"
                option_audio: false
                hints: ["Is horr a whole word?"]
              - id: l3-s2
                type: text_input
                text: "adore → ador____\nWrite the whole word."
                say: "Write the word adorable. It comes from adore."
                keyboard: letters
                answer: "adorable"
                hints: ["Drop the e, then add able."]
              - id: l3-s3
                type: multiple_choice
                text: "Which adverb is spelt correctly?"
                options: ["comfortably", "comfortibly", "comfortablely"]
                answer: "comfortably"
                option_audio: false
                hints: ["able becomes ably."]
              - id: l3-s4
                type: multiple_choice
                text: "refer → ?"
                say: "A book that lists facts is a reference book. Which spelling is right?"
                options: ["reference", "refference", "referrence"]
                answer: "reference"
                option_audio: false
                hints: ["Say REF-er-ence. Is fer stressed?"]
              - id: l3-s5
                type: true_false
                text: "Is it true? The root of possible is a whole word on its own."
                answer: false
                hints: ["Is poss a word?"]

          - support: none
            tasks:
              - id: l3-n1
                type: multiple_choice
                text: "Which spelling is right?"
                say: "Hard to believe is ... Which spelling is right?"
                options: ["incredible", "incredable", "incredeble"]
                answer: "incredible"
                option_audio: false
              - id: l3-n2
                type: text_input
                text: "change → change____\nWrite the whole word."
                say: "Write the word changeable. It comes from change."
                keyboard: letters
                answer: "changeable"
              - id: l3-n3
                type: text_input
                text: "Write the word you hear. It is the adverb of terrible."
                say: "Write the word terribly."
                keyboard: letters
                answer: "terribly"
              - id: l3-n4
                type: multiple_choice
                text: "transfer + ed → ?"
                options: ["transferred", "transfered", "transffered"]
                answer: "transferred"
                option_audio: false
              - id: l3-n5
                type: highlight_in_text
                text: "Tap every word that is spelt correctly."
                say: "Tap every word that is spelt correctly."
                show: { drawn: letter-card, text: "reasonable preference referred visable" }
                spans: ["reasonable", "preference", "referred"]

      - activity: check
        size: skill
        tasks:
          - id: l3-c1
