# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.silent-letters
skill: lit-en.spelling.silent-letters
curriculum: en-GB
language: en
title:
  de: Wörter mit stummen Buchstaben
  en: Words with silent letters
summary: >
  Letters that are written but not heard, as listed for Years 5 and 6
  in Appendix 1 of the National Curriculum. Lesson 1 takes the common
  pairs: kn and gn at the start (knight, gnome), wr (write, wrist), mb
  at the end (lamb, thumb) and gn at the end (sign). Lesson 2 takes the
  rarer ones: mn (solemn, autumn), ps (psalm), silent t (castle,
  listen), silent l (calm, half), silent b (doubt, debt), silent s
  (island) and silent h (honest); it ends with the skill check. Related
  words that sound the letter (signature, autumnal) help children
  remember it. Spellings are written with `keyboard: letters`.
metadata:
  year: year-5
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.spelling.word-list-3-4]
  also_practises: [lit-en.spelling.word-list-3-4]
  vocabulary: { en: [silent letter, knight, knuckle, gnome, wrist, wreck, lamb, thumb, climb, sign, solemn, autumn, column, psalm, castle, listen, calm, half, doubt, debt, island, honest] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: start, what: { de: "stumme Buchstaben am Wortanfang: kn, gn, wr", en: "silent letters at the start: kn, gn, wr" } }
    - { id: end, what: { de: "stumme Buchstaben am Wortende: mb, gn, mn", en: "silent letters at the end: mb, gn, mn" } }
    - { id: rarer, what: { de: "seltenere stumme Buchstaben: t, l, b, s, h, ps", en: "rarer silent letters: t, l, b, s, h, ps" } }
    - { id: related-word, what: { de: "ein verwandtes Wort, in dem man den Buchstaben hört", en: a related word in which the letter is heard } }
  misconceptions:
    - id: spell-as-heard
      what: Spells only the sounds heard, leaving out the silent letter (nife, rist, lam)
      addressed: Learn screens 1 and 2 of lesson 1; l1-f1 (feedback), l1-f3, l1-s2, l1-n2, l2-f3, l2-c2
    - id: silent-letter-anywhere
      what: Adds silent letters where there are none (knot is right, but knap for nap) or in the wrong place (lambe)
      addressed: Learn screen 4 of lesson 1; l1-f4 (feedback), l1-s4, l1-n4
    - id: no-related-word
      what: Does not use a related word in which the letter is heard (sign and signature, autumn and autumnal) to remember the spelling
      addressed: Learn screen 4 of lesson 2; l2-f4 (feedback), l2-s4, l2-n4, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "kn, gn, wr und mb", en: "kn, gn, wr and mb" }
    goal:
      de: "Schreib englische Wörter mit einem stummen Buchstaben am Anfang oder am Ende richtig, so wie knight, write und thumb."
      en: "Spell words with a silent letter at the start or the end, like knight, write and thumb."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which spelling is right?\nYou can borrow a book from the ______."
            say: "A building where you can borrow a book is a library. Which spelling is right?"
            options: ["library", "libary", "librery"]
            answer: "library"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Write the missing word.\nWhat is the ______?"
            say: "Write the word answer. What is the answer?"
            keyboard: letters
            answer: "answer"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "knife\n\nWhich letter do you write but never say?"
            say: "Say the word knife out loud. Which letter do you write but never say? Make a guess."
          - text: "knight  knock  knee  knife"
            say: "The k! Some letters are written but not heard. We call them silent letters. In knight, knock, knee and knife the k is silent: we only say the n."
          - text: "write  wrist  wrong  wreck\ngnome  gnaw"
            say: "In write, wrist, wrong and wreck the w is silent. In gnome and gnaw the g is silent. So at the start of a word, the sound n may be spelt kn or gn, and the sound r may be spelt wr."
          - text: "lamb  thumb  climb  comb  bomb\nsign  design  foreign"
            say: "At the end of a word, m may be spelt mb, as in lamb and thumb, and n may be spelt gn, as in sign and design. You have to learn which words have them: most words do not."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which spelling is right?\nYou cut bread with a ______."
                say: "You cut bread with a knife. Which spelling is right?"
                options: ["knife", "nife", "gnife"]
                answer: "knife"
                option_audio: false
                feedback:
                  "nife": "Knife has a silent k at the start, like knee and knock."
                hints:
                  - "Does it belong with knee and knock?"
                  - "Those words start with a silent k."
                  - "Knife."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "Tap the letter you can see but cannot hear."
                show: { drawn: letter-card, text: "w r i s t" }
                spans: ["w"]
                option_audio: false
                hints:
                  - "Say the word slowly: rist."
                  - "Which letter makes no sound?"
                  - "The w."
              - id: l1-f3
                type: text_input
                text: "Write the missing word.\nYou have four fingers and a ______."
                say: "Write the word thumb. You have four fingers and a thumb."
                keyboard: letters
                answer: "thumb"
                hints:
                  - "It ends like lamb and climb."
                  - "The m at the end is spelt mb."
                  - "thumb"
              - id: l1-f4
                type: multiple_choice
                text: "Which word has NO silent letter?"
                options: ["nap", "knot", "wrap"]
                answer: "nap"
                option_audio: false
                feedback:
                  "knot": "Knot has a silent k. Most words starting with n have no silent letter, like nap."
                hints:
                  - "Look at the first two letters of each word."
                  - "kn and wr hide a silent letter."
                  - "Nap."
              - id: l1-f5
                type: sorting
                text: "Silent k, silent w or silent b?"
                say: "Which letter is silent in each word? Sort them."
                option_audio: false
                bins:
                  - { id: k, show: { text: "silent k" }, say: "Silent k." }
                  - { id: w, show: { text: "silent w" }, say: "Silent w." }
                  - { id: b, show: { text: "silent b" }, say: "Silent b." }
                options:
                  - { text: "knuckle", bin: k }
                  - { text: "wreck", bin: w }
                  - { text: "climb", bin: b }
                  - { text: "kneel", bin: k }
                  - { text: "comb", bin: b }
                hints:
                  - "Say each word and listen for the missing sound."
                  - "kn, wr and mb each hide one letter."
                  - "Knuckle and kneel: k. Wreck: w. Climb and comb: b."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which spelling is right?\nA small statue of a little man in a garden is a ______."
                say: "A small statue of a little man in a garden is a gnome. Which spelling is right?"
                options: ["gnome", "nome", "knome"]
                answer: "gnome"
                option_audio: false
                hints: ["It starts like gnaw."]
              - id: l1-s2
                type: text_input
                text: "Write the missing word.\nThat answer is ______."
                say: "Write the word wrong. That answer is wrong."
                keyboard: letters
                answer: "wrong"
                hints: ["It starts like write and wrist."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "Tap the letter you can see but cannot hear."
                show: { drawn: letter-card, text: "s i g n" }
                spans: ["g"]
                option_audio: false
                hints: ["Say sign. Do you hear a g?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which word is spelt correctly?"
                options: ["lamb", "lambe", "lam"]
                answer: "lamb"
                option_audio: false
                hints: ["Like thumb: mb at the end, nothing after it."]
              - id: l1-s5
                type: true_false
                text: "Is it true? In the word knight, the k is silent."
                answer: true
                hints: ["Say knight. Which sound comes first?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which spelling is right?\nTo make a building or a dress, you first ______ it."
                say: "To make a building or a dress, you first design it. Which spelling is right?"
                options: ["design", "desine", "desighn"]
                answer: "design"
                option_audio: false
              - id: l1-n2
                type: text_input
                text: "Write the missing word.\nPlease ______ on the door."
                say: "Write the word knock. Please knock on the door."
                keyboard: letters
                answer: "knock"
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "Tap the letter you can see but cannot hear."
                show: { drawn: letter-card, text: "c l i m b" }
                spans: ["b"]
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Which word has NO silent letter?"
                options: ["rest", "wrestle", "wrap"]
                answer: "rest"
                option_audio: false
              - id: l1-n5
                type: text_input
                text: "Write the missing word.\nI ______ a letter to my aunt."
                say: "Write the word write. I write a letter to my aunt."
                keyboard: letters
                answer: "write"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which spelling is right?\nYou bend your leg at the ______."
            say: "You bend your leg at the knee. Which spelling is right?"
            options: ["knee", "nee", "gnee"]
            answer: "knee"
            option_audio: false
          - id: l1-c2
            type: highlight_in_text
            text: "Tap the silent letter."
            say: "Tap the letter you can see but cannot hear."
            show: { drawn: letter-card, text: "w r e c k" }
            spans: ["w"]
            option_audio: false
          - id: l1-c3
            type: text_input
            text: "Write the missing word.\nI ______ my hair."
            say: "Write the word comb. I comb my hair."
            keyboard: letters
            answer: "comb"
          - id: l1-c4
            type: text_input
            text: "Write the missing word.\nGran likes to ______ jumpers for the whole family."
            say: "Write the word knit. Gran likes to knit jumpers for the whole family."
            keyboard: letters
            answer: "knit"
          - id: l1-c5
            type: multiple_choice
            text: "Which spelling is right?\nMy fingers were ______ with cold."
            say: "My fingers were numb with cold. Which spelling is right?"
            options: ["numb", "num", "numbe"]
            answer: "numb"
            option_audio: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tap the silent letter."
            say: "Tap the letter you can see but cannot hear."
            show: { drawn: letter-card, text: "w r i g g l e" }
            spans: ["w"]
            option_audio: false

  - n: 2
    title: { de: Seltenere stumme Buchstaben, en: Rarer silent letters }
    goal:
      de: "Schreib Wörter mit selteneren stummen Buchstaben wie autumn und island und nimm ein verwandtes Wort zu Hilfe, so wie signature für sign."
      en: "Spell words with rarer silent letters, like autumn and island, and use a related word to help, like signature for sign."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which spelling is right?\nA dog likes to ______ a bone."
            say: "A dog likes to gnaw a bone. Which spelling is right?"
            options: ["gnaw", "naw", "knaw"]
            answer: "gnaw"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Write the missing word.\nA ______ is a baby sheep."
            say: "Write the word lamb. A lamb is a baby sheep."
            keyboard: letters
            answer: "lamb"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "autumn\n\nWhich letter do you write but never say?"
            say: "Say the word autumn out loud. Which letter do you write but never say? Make a guess."
          - text: "solemn  autumn  column  hymn\npsalm  psychology"
            say: "The n at the end! Here the n is silent after m: solemn, autumn, column, hymn. In psalm and psychology, the p at the start is silent."
          - text: "castle  listen  whistle  fasten\ncalm  half  could  salmon\ndoubt  debt  island  honest  hour"
            say: "More silent letters: the t in castle and listen, the l in calm and half, the b in doubt and debt, the s in island and the h at the start of honest and hour."
          - text: "sign → signature\nautumn → autumnal\nbomb → bombard"
            say: "A trick: find a related word where you can hear the letter. In signature you hear the g, in autumnal you hear the n, in bombard you hear the b. That reminds you the letter is there."
          - text: "Did you know? Nobody ever said the b in debt and doubt. Writers added it more than 500 years ago."
            say: "Did you know? Long ago, English people wrote dette and doute, with no b at all. More than five hundred years ago, writers who loved Latin added a b, to make the words look like the Latin words they came from. People never started saying the b, so it has been silent ever since!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which spelling is right?\nThe season after summer is ______."
                say: "The season after summer is autumn. Which spelling is right?"
                options: ["autumn", "autum", "awtumn"]
                answer: "autumn"
                option_audio: false
                feedback:
                  "autum": "Autumn ends in mn, like solemn and column. The n is silent."
                hints:
                  - "It ends like solemn and column."
                  - "There is a silent n after the m."
                  - "Autumn."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "Tap the letter you can see but cannot hear."
                show: { drawn: letter-card, text: "c a s t l e" }
                spans: ["t"]
                option_audio: false
                hints:
                  - "Say castle slowly: cas-sul."
                  - "One letter in the middle is not heard."
                  - "The t."
              - id: l2-f3
                type: text_input
                text: "Write the missing word.\nBritain is an ______."
                say: "Write the word island. Britain is an island."
                keyboard: letters
                answer: "island"
                hints:
                  - "It starts with a long i sound, spelt i."
                  - "There is a silent s after the i."
                  - "island"
              - id: l2-f4
                type: multiple_choice
                text: "Which related word helps you remember the g in sign?"
                options: ["signature", "sing", "sight"]
                answer: "signature"
                option_audio: false
                feedback:
                  "sing": "Sing has a g, but it is not related to sign. In signature, you hear the g of sign."
                hints:
                  - "Which word comes from sign?"
                  - "You sign your name; that is your ..."
                  - "Signature."
              - id: l2-f5
                type: matching
                text: "Match each word to its silent letter."
                say: "Match each word to the letter that is silent in it."
                option_audio: false
                pairs:
                  - { left: { text: "calm" }, right: { text: "l" } }
                  - { left: { text: "doubt" }, right: { text: "b" } }
                  - { left: { text: "honest" }, right: { text: "h" } }
                  - { left: { text: "listen" }, right: { text: "t" } }
                hints:
                  - "Say each word and listen for the missing sound."
                  - "Calm sounds like carm; doubt sounds like dout."
                  - "Calm: l. Doubt: b. Honest: h. Listen: t."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which spelling is right?\nA wedding can be a ______ moment."
                say: "A wedding can be a solemn moment. Which spelling is right?"
                options: ["solemn", "solem", "sollemn"]
                answer: "solemn"
                option_audio: false
                hints: ["Like autumn: mn at the end."]
              - id: l2-s2
                type: text_input
                text: "Write the missing word.\nI ______ it will snow today."
                say: "Write the word doubt. I doubt it will snow today."
                keyboard: letters
                answer: "doubt"
                hints: ["There is a silent b before the t."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the two silent letters."
                say: "This word is psalm. Tap the two letters you can see but cannot hear."
                show: { drawn: letter-card, text: "p s a l m" }
                spans: ["p", "l"]
                option_audio: false
                hints: ["Say psalm slowly: sahm. Which two letters make no sound?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which related word helps you remember the n in column?"
                options: ["columnist", "colour", "come"]
                answer: "columnist"
                option_audio: false
                hints: ["In which word do you hear the n?"]
              - id: l2-s5
                type: true_false
                text: "Is it true? In the word hour, the h is silent."
                answer: true
                hints: ["Say hour. Does it sound like our?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which spelling is right?\nSomething you owe is a ______."
                say: "Something you owe is a debt. Which spelling is right?"
                options: ["debt", "det", "dept"]
                answer: "debt"
                option_audio: false
              - id: l2-n2
                type: text_input
                text: "Write the missing word.\n______ to the music."
                say: "Write the word listen. Listen to the music."
                keyboard: letters
                answer: "listen"
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the silent letter."
                say: "Tap the letter you can see but cannot hear."
                show: { drawn: letter-card, text: "h a l f" }
                spans: ["l"]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Which related word helps you remember the n in autumn?"
                options: ["autumnal", "author", "aunt"]
                answer: "autumnal"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? The word salmon has no silent letter."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: start
            type: multiple_choice
            text: "Which spelling is right?\nA brave ______ rode a horse."
            say: "A brave knight rode a horse. Which spelling is right?"
            options: ["knight", "nite", "kight"]
            answer: "knight"
            option_audio: false
          - id: l2-c2
            part: start
            type: text_input
            text: "Write the missing word.\nI wear a watch on my ______."
            say: "Write the word wrist. I wear a watch on my wrist."
            keyboard: letters
            answer: "wrist"
          - id: l2-c3
            part: rarer
            type: highlight_in_text
            text: "Tap the silent letter."
            say: "Tap the letter you can see but cannot hear."
            show: { drawn: letter-card, text: "f a s t e n" }
            spans: ["t"]
            option_audio: false
          - id: l2-c4
            part: related-word
            type: multiple_choice
            text: "Which related word helps you remember the b in bomb?"
            options: ["bombard", "boom", "bottom"]
            answer: "bombard"
            option_audio: false
          - id: l2-c5
            part: end
            type: text_input
            text: "Write the missing word.\nThe temple has a tall stone ______."
            say: "Write the word column. The temple has a tall stone column."
            keyboard: letters
            answer: "column"
          - id: l2-c6
            part: start
            type: text_input
            text: "Write the missing word.\nThe worm began to ______ in my hand."
            say: "Write the word wriggle. The worm began to wriggle in my hand."
            keyboard: letters
            answer: "wriggle"
          - id: l2-c7
            part: start
            type: multiple_choice
            text: "Which spelling is right?\nDo you ______ the way to the station?"
            say: "Do you know the way to the station? Which spelling is right?"
            options: ["know", "gnow", "knowe"]
            answer: "know"
            option_audio: false
          - id: l2-c8
            part: start
            type: true_false
            text: "Is it true? In the word gnash, the n is silent."
            say: "Is it true? In the word gnash, the n is silent."
            answer: false
          - id: l2-c9
            part: end
            type: text_input
            text: "Write the missing word.\nThe bird sat on a high ______ of the oak tree."
            say: "Write the word limb. The bird sat on a high limb of the oak tree."
            keyboard: letters
            answer: "limb"
          - id: l2-c10
            part: end
            type: multiple_choice
            text: "Which spelling is right?\nWe found a ______ of bread on the floor."
            say: "We found a crumb of bread on the floor. Which spelling is right?"
            options: ["crumb", "crum", "crumm"]
            answer: "crumb"
            option_audio: false
          - id: l2-c11
            part: end
            type: highlight_in_text
            text: "Tap the silent letter."
            say: "Tap the letter you can see but cannot hear."
            show: { drawn: letter-card, text: "t o m b" }
            spans: ["b"]
            option_audio: false
          - id: l2-c12
            part: end
            type: true_false
            text: "Is it true? The word plumber has a silent b."
            say: "Is it true? The word plumber has a silent b."
            answer: true
          - id: l2-c13
            part: rarer
            type: text_input
            text: "Write the missing word.\nThe prickly purple ______ is the national flower of Scotland."
            say: "Write the word thistle. The prickly purple thistle is the national flower of Scotland."
            keyboard: letters
            answer: "thistle"
          - id: l2-c14
            part: rarer
            type: multiple_choice
            text: "Which spelling is right?\nUse a stick of ______ to write on the board."
            say: "Use a stick of chalk to write on the board. Which spelling is right?"
            options: ["chalk", "chork", "chawk"]
            answer: "chalk"
            option_audio: false
          - id: l2-c15
            part: rarer
            type: highlight_in_text
            text: "Tap the silent letter."
            say: "Tap the letter you can see but cannot hear."
            show: { drawn: letter-card, text: "h o n o u r" }
            spans: ["h"]
            option_audio: false
          - id: l2-c16
            part: rarer
            type: sorting
            text: "Silent t or silent l?"
            say: "Which letter is silent in each word? Sort them."
            option_audio: false
            bins:
              - { id: t, show: { text: "silent t" }, say: "Silent t." }
              - { id: l, show: { text: "silent l" }, say: "Silent l." }
            options:
              - { text: "glisten", bin: t }
              - { text: "palm", bin: l }
              - { text: "folk", bin: l }
              - { text: "rustle", bin: t }
          - id: l2-c17
            part: rarer
            type: matching
            text: "Which letter is silent? Match each word to it."
            say: "Which letter is silent in each word? Match each word to its silent letter."
            option_audio: false
            pairs:
              - { left: { text: "isle" }, right: { text: "s" } }
              - { left: { text: "doubtful" }, right: { text: "b" } }
              - { left: { text: "should" }, right: { text: "l" } }
          - id: l2-c18
            part: related-word
            type: multiple_choice
            text: "Which related word helps you remember the t in soften?"
            options: ["soft", "son", "often"]
            answer: "soft"
            option_audio: false
          - id: l2-c19
            part: related-word
            type: true_false
            text: "Is it true? You hear the t in moist, so moist helps you remember the silent t in moisten."
            say: "Is it true? You hear the t in moist, so moist helps you remember the silent t in moisten."
            answer: true
          - id: l2-c20
