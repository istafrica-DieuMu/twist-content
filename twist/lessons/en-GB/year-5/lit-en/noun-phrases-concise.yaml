# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.noun-phrases-concise
skill: lit-en.grammar.noun-phrases-concise
curriculum: en-GB
language: en
title:
  de: Viel Information in einer Nominalgruppe
  en: Expanded noun phrases that say a lot in few words
summary: >
  Expanded noun phrases to convey complicated information concisely,
  from Appendix 2 of the National Curriculum for Year 5. Lesson 1 takes
  the parts of a long noun phrase: determiner, adjectives, nouns used as
  modifiers and a prepositional phrase after the head noun (the old
  stone bridge over the river), and how to find the head noun. Lesson 2
  packs information from several sentences into one noun phrase (a
  wooden box with a brass lock), with hyphenated modifiers such as a
  ten-year-old girl; it ends with the skill check. Children choose,
  order and build phrases from cards.
metadata:
  year: year-5
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.expanded-noun-phrases]
  also_practises: [lit-en.grammar.expanded-noun-phrases, lit-en.grammar.relative-clauses]
  vocabulary: { en: [noun phrase, expanded noun phrase, head noun, determiner, adjective, preposition, prepositional phrase, concise, hyphen] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: head-noun, what: { de: das Kernnomen einer langen Nominalgruppe finden, en: finding the head noun of a long noun phrase } }
    - { id: phrase-parts, what: { de: "die Teile einer Nominalgruppe: Adjektive, Nomen als Beschreibung, Präpositionalgruppe", en: "the parts of a noun phrase: adjectives, nouns as modifiers and a prepositional phrase" } }
    - { id: pack-facts, what: { de: mehrere Fakten in eine Nominalgruppe packen, en: packing several facts into one noun phrase } }
    - { id: hyphen, what: { de: "Wörter mit Bindestrich vor dem Nomen (a ten-year-old girl)", en: "modifiers joined by hyphens before the noun (a ten-year-old girl)" } }
  misconceptions:
    - id: head-is-first-noun
      what: Thinks the head noun is the first noun in the phrase, so in the stone bridge over the river picks stone or river
      addressed: Learn screen 2 of lesson 1; l1-f2 (feedback), l1-f4, l1-s2, l1-n2, l2-c1
    - id: longer-is-better
      what: Thinks piling up adjectives (a big, huge, large, enormous dog) gives more information
      addressed: Learn screen 3 of lesson 1; l1-f5 (feedback), l1-s5, l1-n5
    - id: concise-drops-facts
      what: Makes writing shorter by leaving facts out, instead of packing them into one noun phrase
      addressed: Learn of lesson 2; l2-f1 (feedback), l2-f3, l2-s1, l2-n1, l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Teile einer langen Nominalgruppe, en: The parts of a long noun phrase }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is an expanded noun phrase?"
            options: ["the tall teacher with curly hair", "the teacher", "teaches"]
            answer: "the tall teacher with curly hair"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tap the adjective."
            say: "Tap the adjective in the noun phrase."
            show: { drawn: letter-card, text: "a shiny coin" }
            spans: ["shiny"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "the old stone bridge over the river\ndeterminer: the\nadjective: old\nnoun as adjective: stone\nhead noun: bridge\nprepositional phrase: over the river"
            say: "A long noun phrase is built round one main noun, the head noun. Here it is bridge. Before it come a determiner, the, an adjective, old, and another noun used like an adjective, stone. After it comes a prepositional phrase, over the river."
          - text: "the old stone bridge over the river\nWhat is it? A bridge."
            say: "To find the head noun, ask: what is it? It is a bridge, not a stone and not a river. Every other word tells us more about the bridge."
          - text: "a big, huge, enormous dog\na huge black dog with a spiked collar"
            say: "More words is not always more information. Big, huge and enormous all say the same thing. Choose words that each add something new: colour, material, what it has, where it is."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the prepositional phrase."
                say: "Tap every word of the prepositional phrase after the head noun."
                show: { drawn: letter-card, text: "a small cottage by the sea" }
                spans: ["by", "the", "sea"]
                hints:
                  - "A prepositional phrase starts with a word like by, with, in or under."
                  - "It comes after cottage."
                  - "By the sea."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"the brave young firefighter from Leeds\"\n\nWhat is the head noun?"
                options: ["firefighter", "Leeds", "young"]
                answer: "firefighter"
                feedback:
                  "Leeds": "Leeds tells us where the firefighter is from. Ask: what is it? A firefighter."
                hints:
                  - "Ask: who or what is it?"
                  - "The other words describe this person."
                  - "Firefighter."
              - id: l1-f3
                type: ordering
                text: "Build the expanded noun phrase."
                say: "Put the cards in order to build a noun phrase about a cat."
                option_audio: false
                options: ["with white paws", "the", "fluffy", "cat"]
                slot_count: 4
                answer: ["the", "fluffy", "cat", "with white paws"]
                hints:
                  - "Start with the determiner."
                  - "The adjective comes before the noun, the prepositional phrase after."
                  - "The fluffy cat with white paws."
              - id: l1-f4
                type: multiple_choice
                text: "\"a wooden chest under the bed\"\n\nWhat is the head noun?"
                options: ["chest", "bed", "wooden"]
                answer: "chest"
                hints:
                  - "What is under the bed?"
                  - "The chest is under the bed."
                  - "Chest."
              - id: l1-f5
                type: multiple_choice
                text: "Which noun phrase gives the reader the most information?"
                options: ["a rusty red bike with a flat tyre", "a big, large, huge bike", "a bike"]
                answer: "a rusty red bike with a flat tyre"
                option_audio: false
                feedback:
                  "a big, large, huge bike": "Big, large and huge all say the same thing. Each word should add something new."
                hints:
                  - "Which words add something new?"
                  - "Rusty, red and a flat tyre are three different facts."
                  - "A rusty red bike with a flat tyre."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the prepositional phrase."
                say: "Tap every word of the prepositional phrase after the head noun."
                show: { drawn: letter-card, text: "an ancient map of the island" }
                spans: ["of", "the", "island"]
                hints: ["It starts with of."]
              - id: l1-s2
                type: multiple_choice
                text: "\"the cheerful baker on the corner\"\n\nWhat is the head noun?"
                options: ["baker", "corner", "cheerful"]
                answer: "baker"
                hints: ["Who is on the corner?"]
              - id: l1-s3
                type: ordering
                text: "Build the expanded noun phrase."
                say: "Put the cards in order to build a noun phrase about a castle."
                option_audio: false
                options: ["castle", "on the hill", "a", "crumbling"]
                slot_count: 4
                answer: ["a", "crumbling", "castle", "on the hill"]
                hints: ["Determiner, adjective, noun, then the prepositional phrase."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the noun used like an adjective."
                say: "One noun here describes the head noun, like an adjective. Tap it."
                show: { drawn: letter-card, text: "the shiny football boots" }
                spans: ["football"]
                hints: ["What kind of boots?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which noun phrase gives the reader the most information?"
                options: ["a tiny grey mouse with a long tail", "a small, little, tiny mouse", "a mouse"]
                answer: "a tiny grey mouse with a long tail"
                option_audio: false
                hints: ["Each word should add something new."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the prepositional phrase."
                say: "Tap every word of the prepositional phrase after the head noun."
                show: { drawn: letter-card, text: "the glass jar with a cork lid" }
                spans: ["with", "a", "cork", "lid"]
              - id: l1-n2
                type: multiple_choice
                text: "\"the noisy flock of seagulls above the harbour\"\n\nWhat is the head noun?"
                options: ["flock", "seagulls", "harbour"]
                answer: "flock"
                difficulty: stretch
              - id: l1-n3
                type: ordering
                text: "Build the expanded noun phrase."
                say: "Put the cards in order to build a noun phrase about a ship."
                option_audio: false
                options: ["pirate", "the", "ship", "with black sails"]
                slot_count: 4
                answer: ["the", "pirate", "ship", "with black sails"]
              - id: l1-n4
                type: true_false
                text: "\"a heavy leather bag\"\n\nIs it true? The head noun is leather."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Which noun phrase gives the reader the most information?"
                options: ["a steep rocky path through the woods", "a long, lengthy, long path", "the path"]
                answer: "a steep rocky path through the woods"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"the bright yellow kite in the tree\"\n\nWhat is the head noun?"
            options: ["kite", "tree", "yellow"]
            answer: "kite"
          - id: l1-c2
            type: highlight_in_text
            text: "Tap the prepositional phrase."
            say: "Tap every word of the prepositional phrase after the head noun."
            show: { drawn: letter-card, text: "a tall girl in the blue coat" }
            spans: ["in", "the", "blue", "coat"]
          - id: l1-c3
            type: ordering
            text: "Build the expanded noun phrase."
            say: "Put the cards in order to build a noun phrase about a dog."
            option_audio: false
            options: ["dog", "a", "muddy", "with a stick"]
            slot_count: 4
            answer: ["a", "muddy", "dog", "with a stick"]
          - id: l1-c4
            type: highlight_in_text
            text: "Tap the noun used like an adjective."
            say: "One noun here describes the head noun, like an adjective. Tap it."
            show: { drawn: letter-card, text: "the old garden gate" }
            spans: ["garden"]
          - id: l1-c5
            type: true_false
            text: "\"the tallest tree in the park\"\n\nIs it true? The head noun is tree."
            say: "Read the noun phrase. Is it true? The head noun is tree."
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which noun phrase uses three words that say the same thing?"
            options: ["a cold, chilly, freezing night", "a cold night under the stars", "a clear frosty night in winter"]
            answer: "a cold, chilly, freezing night"
            option_audio: false

  - n: 2
    title: { de: Viel sagen mit wenigen Wörtern, en: Saying a lot in few words }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"the old lighthouse on the cliff\"\n\nWhat is the head noun?"
            options: ["lighthouse", "cliff", "old"]
            answer: "lighthouse"
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tap the prepositional phrase."
            say: "Tap every word of the prepositional phrase after the head noun."
            show: { drawn: letter-card, text: "a rope ladder to the treehouse" }
            spans: ["to", "the", "treehouse"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "There was a box. It was made of wood. It had a lock. The lock was brass.\n→ a wooden box with a brass lock"
            say: "Concise means saying a lot in few words. Four sentences about a box can become one noun phrase: a wooden box with a brass lock. Every fact is still there."
          - text: "There was a girl who was ten years old.\n→ a ten-year-old girl"
            say: "Some facts can become one word joined by hyphens before the noun: a ten-year-old girl, a two-metre wall."
          - text: "Concise does not mean leaving facts out."
            say: "Being concise is not the same as cutting facts. The skill is to keep the facts and pack them into fewer words."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"There was a cat. It was black. It had green eyes.\"\n\nWhich noun phrase keeps every fact?"
                options: ["a black cat with green eyes", "a cat", "a black cat"]
                answer: "a black cat with green eyes"
                option_audio: false
                feedback:
                  "a black cat": "That is shorter, but the green eyes are lost. Keep every fact: a black cat with green eyes."
                hints:
                  - "List the facts: cat, black, green eyes."
                  - "Black goes before cat; with green eyes goes after."
                  - "A black cat with green eyes."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "There was a tower. It was made of stone. It was by the gate.\nPack the facts into one noun phrase."
                say: "There was a tower. It was made of stone. It was by the gate. Put the cards in order."
                option_audio: false
                options: ["by the gate", "the", "tower", "stone"]
                slot_count: 4
                answer: ["the", "stone", "tower", "by the gate"]
                hints:
                  - "What is it? A tower."
                  - "Stone goes before tower; by the gate goes after."
                  - "The stone tower by the gate."
              - id: l2-f3
                type: multiple_choice
                text: "Which sentence is the most concise and still gives every fact?\nFacts: a scientist, she is famous, she studies volcanoes, she visited our school."
                options: ["A famous volcano scientist visited our school.", "A scientist visited our school.", "A scientist who was famous and who studied volcanoes visited our school, and she was famous."]
                answer: "A famous volcano scientist visited our school."
                option_audio: false
                hints:
                  - "Which one keeps every fact without repeating?"
                  - "Volcano can describe the scientist."
                  - "A famous volcano scientist visited our school."
              - id: l2-f4
                type: fill_in_blank
                text: "A boy who is eight years old.\nMake the noun phrase concise."
                say: "A boy who is eight years old. Complete the concise noun phrase."
                frame: "an _ boy"
                options: ["eight-year-old", "eight years old", "eight year old"]
                answer: ["eight-year-old"]
                option_audio: false
                hints:
                  - "Before the noun, the words join with hyphens."
                  - "Year is singular when it is joined up."
                  - "Eight-year-old."
              - id: l2-f5
                type: true_false
                text: "\"a three-metre crocodile\"\n\nIs it true? This means a crocodile that is three metres long."
                answer: true
                hints:
                  - "What does three-metre describe?"
                  - "It tells us the crocodile's length."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"There was a house. It was tiny. It had a red door.\"\n\nWhich noun phrase keeps every fact?"
                options: ["a tiny house with a red door", "a tiny house", "a house with a door"]
                answer: "a tiny house with a red door"
                option_audio: false
                hints: ["Check the list: tiny, house, red door."]
              - id: l2-s2
                type: ordering
                text: "There was a dragon. It was green. It lived in the mountains.\nPack the facts into one noun phrase."
                say: "There was a dragon. It was green. It lived in the mountains. Put the cards in order."
                option_audio: false
                options: ["dragon", "green", "from the mountains", "a"]
                slot_count: 4
                answer: ["a", "green", "dragon", "from the mountains"]
                hints: ["Determiner, adjective, noun, then the prepositional phrase."]
              - id: l2-s3
                type: fill_in_blank
                text: "A walk that takes two hours.\nMake the noun phrase concise."
                say: "A walk that takes two hours. Complete the concise noun phrase."
                frame: "a _ walk"
                options: ["two-hour", "two hours", "two-hours"]
                answer: ["two-hour"]
                option_audio: false
                hints: ["Join with a hyphen; hour stays singular."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence is the most concise and still gives every fact?\nFacts: a jacket, it is waterproof, it has a hood, it is in the hall."
                options: ["The waterproof jacket with a hood is in the hall.", "The jacket is in the hall.", "The jacket, which is waterproof, and which has a hood, which is in the hall."]
                answer: "The waterproof jacket with a hood is in the hall."
                option_audio: false
                hints: ["Keep all four facts in one clear sentence."]
              - id: l2-s5
                type: true_false
                text: "Is it true? Making writing concise means leaving out facts."
                answer: false
                hints: ["Concise keeps the facts in fewer words."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"There was a spider. It was hairy. It had long legs.\"\n\nWhich noun phrase keeps every fact?"
                options: ["a hairy spider with long legs", "a hairy spider", "a spider with legs"]
                answer: "a hairy spider with long legs"
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "There was a clock. It was gold. It was on the wall.\nPack the facts into one noun phrase."
                say: "There was a clock. It was gold. It was on the wall. Put the cards in order."
                option_audio: false
                options: ["on the wall", "clock", "the", "gold"]
                slot_count: 4
                answer: ["the", "gold", "clock", "on the wall"]
              - id: l2-n3
                type: fill_in_blank
                text: "A bridge that is one hundred years old.\nMake the noun phrase concise."
                say: "A bridge that is one hundred years old. Complete the concise noun phrase."
                frame: "a _ bridge"
                options: ["hundred-year-old", "hundred years old", "hundred-years-old"]
                answer: ["hundred-year-old"]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence is the most concise and still gives every fact?\nFacts: a fox, it is young, it has a bushy tail, it ran past."
                options: ["A young fox with a bushy tail ran past.", "A fox ran past.", "A fox ran past, and it was young, and it had a tail that was bushy."]
                answer: "A young fox with a bushy tail ran past."
                option_audio: false
              - id: l2-n5
                type: highlight_in_text
                text: "Tap the head noun."
                say: "Tap the head noun of this long noun phrase."
                show: { drawn: letter-card, text: "the enormous ten-tonne lorry with a broken mirror" }
                spans: ["lorry"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: head-noun
            type: multiple_choice
            text: "\"the friendly librarian with silver glasses\"\n\nWhat is the head noun?"
            options: ["librarian", "glasses", "friendly"]
            answer: "librarian"
          - id: l2-c2
            part: phrase-parts
            type: highlight_in_text
            text: "Tap the prepositional phrase."
            say: "Tap every word of the prepositional phrase after the head noun."
            show: { drawn: letter-card, text: "a narrow path between the fields" }
            spans: ["between", "the", "fields"]
          - id: l2-c3
            part: pack-facts
            type: multiple_choice
            text: "\"There was a vase. It was blue. It had a crack.\"\n\nWhich noun phrase keeps every fact?"
            options: ["a blue vase with a crack", "a blue vase", "a vase"]
            answer: "a blue vase with a crack"
            option_audio: false
          - id: l2-c4
            part: hyphen
            type: fill_in_blank
            text: "A race that is five kilometres long.\nMake the noun phrase concise."
            say: "A race that is five kilometres long. Complete the concise noun phrase."
            frame: "a _ race"
            options: ["five-kilometre", "five kilometres", "five-kilometres"]
            answer: ["five-kilometre"]
            option_audio: false
          - id: l2-c5
            part: pack-facts
            type: ordering
            text: "There was a necklace. It was silver. It was in the box.\nPack the facts into one noun phrase."
            say: "There was a necklace. It was silver. It was in the box. Put the cards in order."
            option_audio: false
            options: ["necklace", "in the box", "silver", "the"]
            slot_count: 4
            answer: ["the", "silver", "necklace", "in the box"]
          - id: l2-c6
            part: head-noun
            type: highlight_in_text
            text: "Tap the head noun."
            say: "Tap the head noun of this noun phrase."
            show: { drawn: letter-card, text: "a huge pile of dirty washing" }
            spans: ["pile"]
          - id: l2-c7
            part: head-noun
            type: true_false
            text: "\"the little red post box on the corner\"\n\nIs it true? The head noun is corner."
            say: "Read the noun phrase. Is it true? The head noun is corner."
            answer: false
          - id: l2-c8
            part: head-noun
            type: multiple_choice
            text: "\"three noisy children from the class next door\"\n\nWhat is the head noun?"
            options: ["children", "class", "door"]
            answer: "children"
          - id: l2-c9
            part: head-noun
            type: multiple_choice
            text: "Which noun phrase has bike as its head noun?"
            options: ["an old bike with a basket", "a bike shed by the gate", "the bike shop on the corner"]
            answer: "an old bike with a basket"
            option_audio: false
          - id: l2-c10
            part: phrase-parts
            type: highlight_in_text
            text: "Tap the noun used like an adjective."
            say: "One noun here describes the head noun, like an adjective. Tap it."
            show: { drawn: letter-card, text: "a soft woolly winter hat" }
            spans: ["winter"]
          - id: l2-c11
            part: phrase-parts
            type: highlight_in_text
            text: "Tap the prepositional phrase."
            say: "Tap every word of the prepositional phrase after the head noun."
            show: { drawn: letter-card, text: "a broken window above the door" }
            spans: ["above", "the", "door"]
          - id: l2-c12
            part: phrase-parts
            type: ordering
            text: "Build the expanded noun phrase."
            say: "Put the cards in order to build a noun phrase about some boots."
            option_audio: false
            options: ["boots", "with red laces", "muddy", "the", "football"]
            slot_count: 5
            answer: ["the", "muddy", "football", "boots", "with red laces"]
          - id: l2-c13
            part: phrase-parts
            type: multiple_choice
            text: "\"a sleepy dog by the fire\"\n\nWhat does \"by the fire\" tell the reader?"
            options: ["where the dog is", "what the dog looks like", "how many dogs there are"]
            answer: "where the dog is"
          - id: l2-c14
            part: pack-facts
            type: fill_in_blank
            text: "There was a box. It was made of cardboard. It was full of toys.\nComplete the noun phrase so it keeps every fact."
            say: "There was a box. It was made of cardboard. It was full of toys. Complete the noun phrase so it keeps every fact."
            frame: "a _ box _"
            options: ["cardboard", "full of toys", "big", "with a lid"]
            answer: ["cardboard", "full of toys"]
            option_audio: false
          - id: l2-c15
            part: pack-facts
            type: multiple_choice
            text: "Which sentence is the most concise and still gives every fact?\nFacts: a train, it is old, it runs on steam, it left the station."
            options: ["The old steam train left the station.", "The train left the station.", "The train, which was old and which ran on steam, left the station."]
            answer: "The old steam train left the station."
            option_audio: false
          - id: l2-c16
            part: pack-facts
            type: true_false
            text: "\"There was a tent. It was orange. It had two doors.\"\n\nIs it true? \"an orange tent\" keeps every fact."
            say: "Read the sentences. Is it true? An orange tent keeps every fact."
            answer: false
          - id: l2-c17
            part: hyphen
            type: multiple_choice
            text: "Which phrase means a holiday that lasts two weeks?"
            options: ["a two-week holiday", "a two weeks holiday", "a two-weeks-holiday"]
            answer: "a two-week holiday"
            option_audio: false
          - id: l2-c18
            part: hyphen
            type: true_false
            text: "Is it true? \"a twelve-year-old boy\" is written correctly."
            say: "Is it true? This noun phrase is written correctly."
            answer: true
          - id: l2-c19
            part: hyphen
