# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.perfect-forms
skill: lit-en.grammar.perfect-forms
curriculum: en-GB
language: en
title:
  de: Zeit und Ursache mit Perfektformen zeigen
  en: Perfect forms for time and cause
summary: >
  The perfect form of verbs to mark relationships of time and cause,
  from Appendix 2 of the National Curriculum for Year 5. Lesson 1 takes
  the past perfect (had seen, had left) for something that happened
  before another past event, and which event came first. Lesson 2
  takes cause: the past perfect for the reason in the past (She was
  tired because she had run all the way), the present perfect for a past
  event that still matters now (I have lost my key, so I cannot get
  in), and choosing between simple past, present perfect and past
  perfect; it ends with the skill check.
metadata:
  year: year-5
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.present-perfect]
  also_practises: [lit-en.grammar.present-perfect, lit-en.grammar.tense-progressive]
  vocabulary: { en: [verb, tense, simple past, present perfect, past perfect, had, has, have, past participle, before, because, cause] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: order-of-telling
      what: Thinks the event told first in a sentence happened first, even when the past perfect marks the other one as earlier
      addressed: Learn screen 2 of lesson 1; l1-f2 (feedback), l1-f4, l1-s2, l1-n2, l2-c1
    - id: had-plus-past-simple
      what: Uses the simple past after had (had went, had ate) instead of the past participle
      addressed: Learn screen 3 of lesson 1; l1-f3 (feedback), l1-s3, l1-n3, l2-c2
    - id: had-and-has-same
      what: Mixes the present perfect (has gone, it still matters now) and the past perfect (had gone, before another past event)
      addressed: Learn screens 2 and 3 of lesson 2; l2-f3 (feedback), l2-s3, l2-n3, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was war vorher?", en: What happened first }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which sentence uses the present perfect?"
            options: ["Mia has finished her homework.", "Mia finishes her homework.", "Mia is finishing her homework."]
            answer: "Mia has finished her homework."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word completes the present perfect? \"We _ visited the castle.\""
            options: ["have", "has", "are"]
            answer: "have"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The film had started when we arrived."
            say: "This is the past perfect: had plus a past participle, had started. It shows that something happened before another event in the past. The film started first. Then we arrived."
          - text: "When we arrived, the film had started.\n1. the film started  2. we arrived"
            say: "The order of the words does not matter. Had shows which event came first, wherever it is in the sentence."
          - text: "had + past participle\nhad gone, had eaten, had seen, had written, had taken\nnot: had went, had ate"
            say: "After had, use the past participle. Many are regular: had started, had walked. Some are irregular and must be learnt: had gone, had eaten, had seen. Never had went or had ate."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the two words of the past perfect."
                say: "Tap the two words that make the past perfect."
                show: { drawn: letter-card, text: "Sara had locked the door before she left" }
                spans: ["had", "locked"]
                hints:
                  - "Look for had."
                  - "Had is followed by a past participle."
                  - "Had locked."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"When Dad got home, the children had cooked dinner.\"\n\nWhat happened first?"
                options: ["the children cooked dinner", "Dad got home", "both at the same time"]
                answer: "the children cooked dinner"
                feedback:
                  "Dad got home": "Dad getting home comes first in the sentence, but had cooked shows the cooking happened before."
                hints:
                  - "Which verb has had?"
                  - "Had cooked happened before the other event."
                  - "The children cooked dinner."
              - id: l1-f3
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["By noon, we had eaten all the sandwiches.", "By noon, we had ate all the sandwiches.", "By noon, we had eat all the sandwiches."]
                answer: "By noon, we had eaten all the sandwiches."
                option_audio: false
                feedback:
                  "By noon, we had ate all the sandwiches.": "After had, use the past participle: eaten, not ate."
                hints:
                  - "After had, use the past participle."
                  - "Eat, ate, eaten."
                  - "We had eaten."
              - id: l1-f4
                type: ordering
                text: "\"The train had left when Ali reached the station.\"\nPut the events in the order they happened."
                say: "The train had left when Ali reached the station. Put the events in order."
                option_audio: false
                options: ["Ali reached the station.", "The train left."]
                slot_count: 2
                answer: ["The train left.", "Ali reached the station."]
                hints:
                  - "Which event has had in the sentence?"
                  - "The train had left: that came first."
                  - "The train left, then Ali reached the station."
              - id: l1-f5
                type: fill_in_blank
                text: "Complete the past perfect."
                say: "The rain started before we looked out. Fill the gap to show that."
                frame: "When we looked out, it _ already started to rain."
                options: ["had", "has", "is"]
                answer: ["had"]
                option_audio: false
                hints:
                  - "It is about something before another past event."
                  - "The past perfect uses had."
                  - "Had."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the two words of the past perfect."
                say: "Tap the two words that make the past perfect."
                show: { drawn: letter-card, text: "Before the match the players had trained hard" }
                spans: ["had", "trained"]
                hints: ["Had and the verb after it."]
              - id: l1-s2
                type: multiple_choice
                text: "\"By the time the firefighters came, the fire had gone out.\"\n\nWhat happened first?"
                options: ["the fire went out", "the firefighters came", "both at the same time"]
                answer: "the fire went out"
                hints: ["Which verb has had?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["Leo had written his name on the card.", "Leo had wrote his name on the card.", "Leo had writed his name on the card."]
                answer: "Leo had written his name on the card."
                option_audio: false
                hints: ["Write, wrote, written."]
              - id: l1-s4
                type: ordering
                text: "\"When Mum opened the box, the kitten had escaped.\"\nPut the events in the order they happened."
                say: "When Mum opened the box, the kitten had escaped. Put the events in order."
                option_audio: false
                options: ["Mum opened the box.", "The kitten escaped."]
                slot_count: 2
                answer: ["The kitten escaped.", "Mum opened the box."]
                hints: ["Had escaped came first."]
              - id: l1-s5
                type: true_false
                text: "\"She had seen the film before.\"\n\nIs it true? This sentence uses the past perfect."
                answer: true
                hints: ["Had plus a past participle."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the two words of the past perfect."
                say: "Tap the two words that make the past perfect."
                show: { drawn: letter-card, text: "The snow had melted by the morning" }
                spans: ["had", "melted"]
              - id: l1-n2
                type: multiple_choice
                text: "\"Jo smiled because she had won.\"\n\nWhat happened first?"
                options: ["Jo won", "Jo smiled", "both at the same time"]
                answer: "Jo won"
              - id: l1-n3
                type: multiple_choice
                text: "Which sentence is correct?"
                options: ["They had gone home early.", "They had went home early.", "They had go home early."]
                answer: "They had gone home early."
                option_audio: false
              - id: l1-n4
                type: text_input
                text: "Write the past participle.\n\"By the end of the day, the hens had _ six eggs.\" (lay)"
                say: "Write the past participle of lay to complete the sentence."
                keyboard: letters
                answer: "laid"
              - id: l1-n5
                type: true_false
                text: "\"We walked to the park.\"\n\nIs it true? This sentence uses the past perfect."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"When the bell rang, Ella had finished her test.\"\n\nWhat happened first?"
            options: ["Ella finished her test", "the bell rang", "both at the same time"]
            answer: "Ella finished her test"
          - id: l1-c2
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["I had taken my coat.", "I had took my coat.", "I had take my coat."]
            answer: "I had taken my coat."
            option_audio: false
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the two words of the past perfect."
            say: "Tap the two words that make the past perfect."
            show: { drawn: letter-card, text: "The guests had left before midnight" }
            spans: ["had", "left"]

  - n: 2
    title: { de: Ursache und Jetzt, en: Cause and now }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"When I woke up, Mum had made pancakes.\"\n\nWhat happened first?"
            options: ["Mum made pancakes", "I woke up", "both at the same time"]
            answer: "Mum made pancakes"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["He had seen a fox.", "He had saw a fox.", "He had see a fox."]
            answer: "He had seen a fox."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tom was soaked because he had forgotten his umbrella."
            say: "The past perfect can show cause. Tom forgot his umbrella first. That is why he was soaked. Had forgotten gives the reason, and it happened before."
          - text: "I have lost my key, so I cannot get in."
            say: "The present perfect, have lost or has lost, is about the past but matters now. The key is still lost, so right now I cannot get in."
          - text: "I had lost my key, so I could not get in.\n(past perfect: all in the past)"
            say: "Change it to the past perfect, and the whole story is in the past: I had lost my key, so I could not get in. Has and have link to now. Had links to another past time."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"Priya was tired because she had run all the way to school.\"\n\nWhy was Priya tired?"
                options: ["She had run all the way to school.", "She was going to run.", "She runs every day."]
                answer: "She had run all the way to school."
                option_audio: false
                hints:
                  - "Look after because."
                  - "The past perfect gives the earlier reason."
                  - "She had run all the way to school."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Complete the sentence to show the cause."
                say: "The plant died. The reason came before: nobody watered it."
                frame: "The plant died because nobody _ watered it."
                options: ["had", "has", "will"]
                answer: ["had"]
                option_audio: false
                hints:
                  - "The reason happened before the plant died."
                  - "Something before another past event uses had."
                  - "Had."
              - id: l2-f3
                type: multiple_choice
                text: "Which sentence shows the action still matters now?"
                options: ["I have broken my arm, so I can't play today.", "I had broken my arm, so I couldn't play that day.", "I broke my arm when I was five."]
                answer: "I have broken my arm, so I can't play today."
                option_audio: false
                feedback:
                  "I had broken my arm, so I couldn't play that day.": "Had broken puts it all in the past. Have broken links the past to now: I can't play today."
                hints:
                  - "Look for a link to today."
                  - "Has and have link the past to now."
                  - "I have broken my arm, so I can't play today."
              - id: l2-f4
                type: matching
                text: "Match each sentence to its verb form."
                say: "Match each sentence to the form of the verb it uses."
                option_audio: false
                pairs:
                  - { left: { text: "We have finished." }, right: { text: "present perfect" } }
                  - { left: { text: "We had finished." }, right: { text: "past perfect" } }
                  - { left: { text: "We finished." }, right: { text: "simple past" } }
                hints:
                  - "Look for have, had or no helper verb."
                  - "Have is present perfect; had is past perfect."
                  - "We have finished: present perfect. We had finished: past perfect. We finished: simple past."
              - id: l2-f5
                type: true_false
                text: "\"Because the bridge had collapsed, the road was closed.\"\n\nIs it true? The bridge collapsed before the road was closed."
                answer: true
                hints:
                  - "Which verb has had?"
                  - "Had collapsed came first."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"The children cheered because their team had scored.\"\n\nWhy did the children cheer?"
                options: ["Their team had scored.", "Their team was going to score.", "Their team scores a lot."]
                answer: "Their team had scored."
                option_audio: false
                hints: ["Look after because."]
              - id: l2-s2
                type: fill_in_blank
                text: "Complete the sentence to show the cause."
                say: "Sam was hungry. The reason came before: he skipped breakfast."
                frame: "Sam was hungry because he _ skipped breakfast."
                options: ["had", "has", "is"]
                answer: ["had"]
                option_audio: false
                hints: ["The reason came before another past event."]
              - id: l2-s3
                type: multiple_choice
                text: "Which sentence shows the action still matters now?"
                options: ["Nana has arrived, so let's go and say hello.", "Nana had arrived, so we went to say hello.", "Nana arrived last year."]
                answer: "Nana has arrived, so let's go and say hello."
                option_audio: false
                hints: ["Which one links to right now?"]
              - id: l2-s4
                type: ordering
                text: "Build the sentence that shows why Lily missed the bus."
                say: "Put the cards in order to show why Lily missed the bus."
                option_audio: false
                options: ["because", "she had overslept.", "Lily missed the bus"]
                slot_count: 3
                answer: ["Lily missed the bus", "because", "she had overslept."]
                hints: ["The result first, then because, then the earlier reason."]
              - id: l2-s5
                type: true_false
                text: "\"I have finished my book, so I need a new one.\"\n\nIs it true? This sentence uses the past perfect."
                answer: false
                hints: ["Have or had?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"The ground was wet because it had rained all night.\"\n\nWhy was the ground wet?"
                options: ["It had rained all night.", "It was about to rain.", "It rains every night."]
                answer: "It had rained all night."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Complete the sentence to show the cause."
                say: "Mia could not open the door. The reason came before: she left her key at school."
                frame: "Mia could not open the door because she _ left her key at school."
                options: ["had", "has", "will"]
                answer: ["had"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Which sentence shows the action still matters now?"
                options: ["Someone has eaten the last biscuit, so there are none left.", "Someone had eaten the last biscuit, so there were none left.", "Someone ate a biscuit on Monday."]
                answer: "Someone has eaten the last biscuit, so there are none left."
                option_audio: false
              - id: l2-n4
                type: text_input
                text: "Write the past participle.\n\"Ben was scared because he had never _ a horse before.\" (ride)"
                say: "Write the past participle of ride to complete the sentence."
                keyboard: letters
                answer: "ridden"
              - id: l2-n5
                type: matching
                text: "Match each sentence to its verb form."
                say: "Match each sentence to the form of the verb it uses."
                option_audio: false
                pairs:
                  - { left: { text: "She had sung." }, right: { text: "past perfect" } }
                  - { left: { text: "She sang." }, right: { text: "simple past" } }
                  - { left: { text: "She has sung." }, right: { text: "present perfect" } }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "\"When we got to the beach, the tide had come in.\"\n\nWhat happened first?"
            options: ["the tide came in", "we got to the beach", "both at the same time"]
            answer: "the tide came in"
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence is correct?"
            options: ["The bird had flown away.", "The bird had flew away.", "The bird had fly away."]
            answer: "The bird had flown away."
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "Complete the sentence to show the cause."
            say: "Zac felt ill. The reason came before: he ate too many sweets."
            frame: "Zac felt ill because he _ eaten too many sweets."
            options: ["had", "has", "is"]
            answer: ["had"]
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which sentence shows the action still matters now?"
            options: ["The shop has closed, so we can't buy milk now.", "The shop had closed, so we couldn't buy milk.", "The shop closed at six yesterday."]
            answer: "The shop has closed, so we can't buy milk now."
            option_audio: false
          - id: l2-c5
            type: text_input
            text: "Write the past participle.\n\"By Friday, Amy had _ ten lengths.\" (swim)"
            say: "Write the past participle of swim to complete the sentence."
            keyboard: letters
            answer: "swum"
