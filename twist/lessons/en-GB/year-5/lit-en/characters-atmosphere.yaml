# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.characters-atmosphere
skill: lit-en.composition.characters-atmosphere
curriculum: en-GB
language: en
title:
  de: Schauplatz, Figuren und Stimmung beschreiben
  en: Settings, characters, atmosphere and dialogue
summary: >
  Children learn the choices writers make to bring a story to life.
  Lesson 1 takes setting and atmosphere: details from the senses, and
  word choices (light, weather, sounds) that make a place feel eerie,
  calm or cheerful. Lesson 2 takes character and dialogue: showing what
  a character is like through actions and speech instead of telling
  the reader, and dialogue that moves the story on; it ends with the
  skill check. Free writing is not marked, so children choose, sort and
  improve sentences and punctuate speech.
metadata:
  year: year-5
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.composition.setting-character-plot, lit-en.grammar.direct-speech-full]
  also_practises: [lit-en.grammar.direct-speech-full, lit-en.comprehension.figurative-language]
  vocabulary: { en: [setting, character, atmosphere, mood, senses, eerie, show not tell, dialogue, inverted commas, reporting clause] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: setting-is-a-list
      what: Describes a setting as a list of things in it (there was a tree and a house) without any mood
      addressed: Learn screens 1 and 2 of lesson 1; l1-f1 (feedback), l1-f3, l1-s1, l1-n1, l2-c1
    - id: telling-feelings
      what: Tells the reader how a character feels (Tom was scared) instead of showing it through actions and speech
      addressed: Learn screen 1 of lesson 2; l2-f1 (feedback), l2-f2, l2-s1, l2-n1, l2-c3
    - id: dialogue-small-talk
      what: Fills a story with dialogue that only says hello and goodbye, which neither shows character nor moves the story on
      addressed: Learn screen 2 of lesson 2; l2-f4 (feedback), l2-s4, l2-n4, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Schauplatz und Stimmung, en: Setting and atmosphere }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is the setting of a story?"
            options: ["where and when it happens", "who it is about", "the problem the hero solves"]
            answer: "where and when it happens"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which is punctuated correctly?"
            options: ["\"Look out!\" shouted Ella.", "\"Look out\"! shouted Ella.", "Look out! \"shouted Ella.\""]
            answer: "\"Look out!\" shouted Ella."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "There was a house. It had a garden."
            say: "This tells us what is there, but we feel nothing. It is a list, not a setting that comes alive."
          - text: "Ivy crawled over the broken windows. Somewhere inside, a door creaked, then banged shut."
            say: "Now the house feels eerie. Writers use the senses, what we see, hear, smell and feel, and choose words with a mood: crawled, broken, creaked, banged."
          - text: "Atmosphere: the feeling a place gives the reader.\neerie, tense, calm, cheerful, gloomy"
            say: "Atmosphere is the feeling a place gives the reader. Light, weather and sounds can change it. Golden sunlight and birdsong feel cheerful. Thick fog and a distant howl feel eerie."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which sentence brings the beach to life?"
                options: ["Waves hissed on the sand and the warm air tasted of salt.", "There was a beach. There was sand.", "The beach was a beach with sea."]
                answer: "Waves hissed on the sand and the warm air tasted of salt."
                option_audio: false
                feedback:
                  "There was a beach. There was sand.": "That lists what is there, but the reader feels nothing. Add what you hear, feel or taste."
                hints:
                  - "Which one uses the senses?"
                  - "Look for sounds and tastes."
                  - "Waves hissed on the sand ..."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"Shadows stretched across the empty corridor. A light flickered and died.\"\n\nWhat atmosphere does this create?"
                options: ["eerie", "cheerful", "busy"]
                answer: "eerie"
                hints:
                  - "Think about the light and the empty corridor."
                  - "A light flickering out feels uneasy."
                  - "Eerie."
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the words that make the forest feel gloomy."
                say: "Tap the words that make this forest feel gloomy."
                show: { drawn: letter-card, text: "Dark trees dripped with cold rain under a heavy grey sky" }
                spans: ["Dark", "dripped", "cold", "heavy", "grey"]
                hints:
                  - "Look for the describing words and the verb."
                  - "Which words are about darkness, cold and weight?"
                  - "Dark, dripped, cold, heavy and grey."
              - id: l1-f4
                type: sorting
                text: "Cheerful or eerie?"
                say: "Does each detail make a setting feel cheerful or eerie? Sort them."
                option_audio: false
                bins:
                  - { id: cheerful, show: { text: "cheerful" }, say: "Cheerful." }
                  - { id: eerie, show: { text: "eerie" }, say: "Eerie." }
                options:
                  - { text: "golden sunlight on the meadow", bin: cheerful }
                  - { text: "a distant howl in the fog", bin: eerie }
                  - { text: "children laughing on the swings", bin: cheerful }
                  - { text: "a gate creaking in the wind", bin: eerie }
                hints:
                  - "How would you feel if you were there?"
                  - "Sunlight and laughter feel happy; fog and creaking do not."
                  - "Sunlight and laughing: cheerful. Howl and creaking gate: eerie."
              - id: l1-f5
                type: multiple_choice
                text: "Which sense does this use? \"The kitchen smelt of warm bread and cinnamon.\""
                options: ["smell", "hearing", "touch"]
                answer: "smell"
                hints:
                  - "Look at the verb."
                  - "Smelt tells you which sense."
                  - "Smell."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which sentence brings the market to life?"
                options: ["Traders shouted prices while the smell of hot doughnuts drifted past.", "There was a market with stalls.", "The market was in the town."]
                answer: "Traders shouted prices while the smell of hot doughnuts drifted past."
                option_audio: false
                hints: ["Look for sounds and smells."]
              - id: l1-s2
                type: multiple_choice
                text: "\"Snow lay soft and still. Only the crackle of the fire broke the silence.\"\n\nWhat atmosphere does this create?"
                options: ["calm", "frightening", "noisy"]
                answer: "calm"
                hints: ["Soft, still, a crackling fire: how does it feel?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the words that make the garden feel cheerful."
                say: "Tap the words that make this garden feel cheerful."
                show: { drawn: letter-card, text: "Bright flowers danced while bees hummed in the warm sun" }
                spans: ["Bright", "danced", "hummed", "warm"]
                hints: ["Four words: two for colour and warmth, two actions."]
              - id: l1-s4
                type: true_false
                text: "Is it true? Changing the weather in a description can change its atmosphere."
                answer: true
                hints: ["Think of a park in sunshine and in a thunderstorm."]
              - id: l1-s5
                type: multiple_choice
                text: "Which word makes the cave sound gloomy? \"Water _ from the roof of the cave.\""
                options: ["dripped", "sparkled", "danced"]
                answer: "dripped"
                hints: ["Which one sounds cold and lonely, not happy?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which sentence brings the attic to life?"
                options: ["Dust swirled in a thin beam of light, and the floorboards groaned under my feet.", "There was an attic with boxes.", "The attic was upstairs."]
                answer: "Dust swirled in a thin beam of light, and the floorboards groaned under my feet."
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "\"Thunder crashed. The wind tore at the tent as the children huddled together.\"\n\nWhat atmosphere does this create?"
                options: ["tense", "relaxed", "sleepy"]
                answer: "tense"
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the words that make the street feel eerie."
                say: "Tap the words that make this street feel eerie."
                show: { drawn: letter-card, text: "The empty street was silent except for a whispering wind" }
                spans: ["empty", "silent", "whispering"]
              - id: l1-n4
                type: sorting
                text: "Calm or tense?"
                say: "Does each detail make a setting feel calm or tense? Sort them."
                option_audio: false
                bins:
                  - { id: calm, show: { text: "calm" }, say: "Calm." }
                  - { id: tense, show: { text: "tense" }, say: "Tense." }
                options:
                  - { text: "ripples spreading on a still lake", bin: calm }
                  - { text: "footsteps getting closer in the dark", bin: tense }
                  - { text: "a cat asleep by the fire", bin: calm }
                  - { text: "a phone ringing in an empty house", bin: tense }
              - id: l1-n5
                type: multiple_choice
                text: "Which sense does this use? \"The rough bark scratched her fingers.\""
                options: ["touch", "sight", "taste"]
                answer: "touch"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"Fairy lights twinkled and music spilled out of the hall.\"\n\nWhat atmosphere does this create?"
            options: ["cheerful", "eerie", "gloomy"]
            answer: "cheerful"
          - id: l1-c2
            type: true_false
            text: "Is it true? A list of things in a place always creates a strong atmosphere."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Which sense does this use? \"Far away, an owl hooted.\""
            options: ["hearing", "smell", "touch"]
            answer: "hearing"

  - n: 2
    title: { de: Figuren und Dialoge, en: Characters and dialogue }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"Mist curled round the gravestones. A bell tolled once.\"\n\nWhat atmosphere does this create?"
            options: ["eerie", "cheerful", "busy"]
            answer: "eerie"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which sentence brings the playground to life?"
            options: ["Shrieks of laughter bounced off the walls as a ball thudded against the fence.", "There was a playground.", "The playground had a fence."]
            answer: "Shrieks of laughter bounced off the walls as a ball thudded against the fence."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Tell: Maya was nervous.\nShow: Maya chewed her sleeve and kept glancing at the door."
            say: "Telling says how a character feels. Showing lets the reader work it out from what the character does. Chewing her sleeve and glancing at the door show that Maya is nervous."
          - text: "\"Hello,\" said Ben.\n\"Hello,\" said Sam.\n\n\"Quick, the bridge is going to collapse!\" gasped Ben."
            say: "Dialogue should do a job. Hello and hello tells us nothing. Good dialogue shows what a character is like, or moves the story on, like Ben's warning about the bridge."
          - text: "\"I'm not scared,\" Leo muttered, but his voice shook."
            say: "Speech and actions together show character. Leo says he is not scared, but his shaking voice shows he is. Remember: the spoken words go inside the inverted commas, with the punctuation."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which sentence shows that Kit is angry, without telling?"
                options: ["Kit slammed the door so hard the windows rattled.", "Kit was angry.", "Kit felt very, very angry."]
                answer: "Kit slammed the door so hard the windows rattled."
                option_audio: false
                feedback:
                  "Kit was angry.": "That tells the reader. Show it with an action, so the reader works it out."
                hints:
                  - "Which one uses an action?"
                  - "What might an angry person do?"
                  - "Kit slammed the door ..."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "\"Gran's eyes crinkled as she pressed a warm biscuit into my hand.\"\n\nWhat does this show about Gran?"
                options: ["She is kind and loving.", "She is strict and cross.", "She is shy and quiet."]
                answer: "She is kind and loving."
                hints:
                  - "What does Gran do?"
                  - "Smiling eyes and a gift of a biscuit."
                  - "She is kind and loving."
              - id: l2-f3
                type: sorting
                text: "Showing or telling?"
                say: "Does each sentence show or tell how a character feels? Sort them."
                option_audio: false
                bins:
                  - { id: show, show: { text: "showing" }, say: "Showing." }
                  - { id: tell, show: { text: "telling" }, say: "Telling." }
                options:
                  - { text: "Ravi punched the air and whooped.", bin: show }
                  - { text: "Ravi was happy.", bin: tell }
                  - { text: "Lucy's hands trembled as she opened the letter.", bin: show }
                  - { text: "Lucy felt worried.", bin: tell }
                hints:
                  - "Does the sentence name the feeling?"
                  - "Happy and worried are named; whooping and trembling are actions."
                  - "Whooped and trembled: showing. Was happy and felt worried: telling."
              - id: l2-f4
                type: multiple_choice
                text: "Which line of dialogue moves the story on?"
                options: ["\"Someone has stolen the crown, and the guard has vanished!\"", "\"Hello, how are you?\"", "\"I am fine, thank you.\""]
                answer: "\"Someone has stolen the crown, and the guard has vanished!\""
                option_audio: false
                feedback:
                  "\"Hello, how are you?\"": "That is small talk. Nothing happens. Good dialogue moves the story on or shows character."
                hints:
                  - "Which line tells us something new happens?"
                  - "Look for a problem or an event."
                  - "Someone has stolen the crown ..."
              - id: l2-f5
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["\"We have to hide,\" whispered Ada.", "\"We have to hide\" whispered Ada.", "\"We have to hide,\" whispered Ada"]
                answer: "\"We have to hide,\" whispered Ada."
                option_audio: false
                hints:
                  - "Look inside the inverted commas and at the end."
                  - "A comma goes before the closing inverted commas, and the sentence ends with a full stop."
                  - "\"We have to hide,\" whispered Ada."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which sentence shows that Finn is tired, without telling?"
                options: ["Finn yawned and rested his head on the desk.", "Finn was tired.", "Finn felt sleepy."]
                answer: "Finn yawned and rested his head on the desk."
                option_audio: false
                hints: ["Which one uses an action?"]
              - id: l2-s2
                type: multiple_choice
                text: "\"Put that down this instant!\" snapped Mr Black, tapping his ruler on the desk.\n\nWhat does this show about Mr Black?"
                options: ["He is strict and impatient.", "He is gentle and calm.", "He is funny and silly."]
                answer: "He is strict and impatient."
                hints: ["How does he speak, and what does he do?"]
              - id: l2-s3
                type: sorting
                text: "Showing or telling?"
                say: "Does each sentence show or tell how a character feels? Sort them."
                option_audio: false
                bins:
                  - { id: show, show: { text: "showing" }, say: "Showing." }
                  - { id: tell, show: { text: "telling" }, say: "Telling." }
                options:
                  - { text: "Omar was jealous of his brother.", bin: tell }
                  - { text: "Nell hid behind the sofa, peeping out.", bin: show }
                  - { text: "Jo was proud of her painting.", bin: tell }
                  - { text: "Dev stared at his shoes and mumbled.", bin: show }
                hints: ["Is the feeling named?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which line of dialogue shows what the character is like?"
                options: ["\"Me? Scared of a ghost? Never!\" boasted Harry, puffing out his chest.", "\"Good morning,\" said Harry.", "\"Yes,\" said Harry."]
                answer: "\"Me? Scared of a ghost? Never!\" boasted Harry, puffing out his chest."
                option_audio: false
                hints: ["Which one tells you about Harry?"]
              - id: l2-s5
                type: true_false
                text: "Is it true? \"Tom was sad\" shows the reader how Tom feels without telling."
                answer: false
                hints: ["Does it name the feeling?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which sentence shows that Isla is excited, without telling?"
                options: ["Isla bounced on her toes, clutching the tickets.", "Isla was excited.", "Isla felt really excited."]
                answer: "Isla bounced on her toes, clutching the tickets."
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "\"Sam crept to the edge, peered down and quickly stepped back.\"\n\nHow does Sam feel?"
                options: ["afraid of the drop", "bored", "proud"]
                answer: "afraid of the drop"
              - id: l2-n3
                type: multiple_choice
                text: "Which is punctuated correctly?"
                options: ["\"Where is the map?\" asked Zoe.", "\"Where is the map\"? asked Zoe.", "\"Where is the map,\" asked Zoe?"]
                answer: "\"Where is the map?\" asked Zoe."
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Which line of dialogue moves the story on?"
                options: ["\"The boat has a hole in it, and we're sinking!\"", "\"Nice weather today.\"", "\"Yes, it is.\""]
                answer: "\"The boat has a hole in it, and we're sinking!\""
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? What a character says and does can show the reader what they are like."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which sentence brings the castle to life?"
            options: ["Icy wind moaned through the arrow slits, and a torch spat in the dark.", "There was a castle on a hill.", "The castle had towers."]
            answer: "Icy wind moaned through the arrow slits, and a torch spat in the dark."
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "\"Sunlight sparkled on the river as ducks splashed and chattered.\"\n\nWhat atmosphere does this create?"
            options: ["cheerful", "tense", "eerie"]
            answer: "cheerful"
          - id: l2-c3
            type: multiple_choice
            text: "Which sentence shows that Ella is nervous, without telling?"
            options: ["Ella twisted her hair and kept checking the clock.", "Ella was nervous.", "Ella felt a bit nervous."]
            answer: "Ella twisted her hair and kept checking the clock."
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which line of dialogue moves the story on?"
            options: ["\"The dragon's egg has hatched, and the baby is gone!\"", "\"Hi there.\"", "\"Bye, see you later.\""]
            answer: "\"The dragon's egg has hatched, and the baby is gone!\""
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Which is punctuated correctly?"
            options: ["\"Run to the gate!\" yelled Sami.", "\"Run to the gate\"! yelled Sami.", "\"Run to the gate!\" yelled Sami"]
            answer: "\"Run to the gate!\" yelled Sami."
            option_audio: false
