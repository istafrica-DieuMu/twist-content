# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.retrieve-present
skill: lit-en.comprehension.retrieve-present
curriculum: en-GB
language: en
title:
  de: Informationen finden und darstellen
  en: Finding and presenting information
summary: >
  Finding information in non-fiction quickly, using headings and key
  words, and recording it. Lesson 1 finds facts in one short text by
  skimming headings and scanning for key words; lesson 2 brings together
  facts from two texts, records the key facts in short frames and ends with the skill
  check. The texts are written for Twist and use well-established facts.
metadata:
  year: year-5
  topic: { de: Sachtexte, en: Information texts }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.texts.non-fiction-structures]
  also_practises: []
  vocabulary: { en: [non-fiction, heading, key word, skim, scan, record, table, source] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: find, what: { de: "eine Information in einem Text finden, oder prüfen, ob sie dort steht", en: "finding a fact in one text, or checking whether the text says it" } }
    - { id: heading, what: { de: die Überschrift oder das Schlüsselwort zum Suchen wählen, en: choosing the heading or key word to look for } }
    - { id: which-text, what: { de: "sagen, welcher von zwei Texten eine Information gibt", en: telling which of two texts gives a fact } }
    - { id: record, what: { de: Schlüsselinformationen aus zwei Texten in wenigen Wörtern festhalten, en: recording key facts from two texts in a few words } }
    - { id: present, what: { de: Informationen aus zwei Texten in einem Satz verbinden, en: joining facts from two texts in one sentence } }
  misconceptions:
    - id: read-every-word
      what: Reads the whole text from the top for every question
      addressed: Learn shows skimming the headings first, then scanning for the key word
    - id: copy-whole-sentence
      what: Copies whole sentences instead of recording the key fact
      addressed: lesson 2 records the key fact in a short frame, not a whole sentence
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Überfliegen und gezielt suchen, en: Skimming and scanning }
    goal:
      de: "Finde eine Tatsache schnell: Überflieg zuerst die Überschriften und such dann nach dem Schlüsselwort, so wie, wo Igel schlafen."
      en: "Find a fact fast by skimming the headings, then scanning for the key word, like where hedgehogs sleep."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is a non-fiction text?"
            options: ["a guide to looking after rabbits", "a fairy tale about a giant", "a poem about the sea"]
            answer: "a guide to looking after rabbits"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? Headings tell you what each part of a text is about."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "You need one fact about hedgehogs. Do you read every word, from the very first one?"
            say: "You need just one fact from a text about hedgehogs. Do you read every single word, starting from the very first one? What do you think?"
          - text: "Hedgehogs\n\nFood: Hedgehogs eat beetles, worms and slugs.\nHomes: They sleep in piles of leaves and under hedges.\nWinter: In cold months they hibernate, which means they sleep deeply until spring."
            say: "No, there is a faster way. Here is a short information text about hedgehogs. It has three headings: Food, Homes and Winter."
          - text: "Where do hedgehogs sleep?"
            say: "To answer a question, first skim: look at the headings. Sleeping places are homes, so look under Homes. Then scan: look for the key word. Hedgehogs sleep in piles of leaves and under hedges."
          - text: "skim the headings → scan for the key word"
            say: "You do not need to read every word again. Skim, then scan."
          - text: "Did you know? A hedgehog has about 5,000 to 7,000 spines."
            say: "Did you know? A grown-up hedgehog has about five thousand to seven thousand spines on its back. When it is scared, it rolls up into a tight, prickly ball!"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Hedgehogs\nFood: Hedgehogs eat beetles, worms and slugs.\nHomes: They sleep in piles of leaves and under hedges.\nWinter: In cold months they hibernate.\n\nUnder which heading would you look to find what hedgehogs eat?"
                say: "Read the question at the bottom. Under which heading would you look?"
                options: ["Food", "Homes", "Winter"]
                answer: "Food"
                hints:
                  - "Skim the headings first."
                  - "Eating is about food."
                  - "Food."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Hedgehogs\nFood: Hedgehogs eat beetles, worms and slugs.\nHomes: They sleep in piles of leaves and under hedges.\nWinter: In cold months they hibernate.\n\nWhat do hedgehogs do in cold months?"
                say: "Read the question at the bottom. Find the answer in the text."
                options: ["they hibernate", "they eat slugs", "they build hedges"]
                answer: "they hibernate"
                hints:
                  - "Which heading is about cold months?"
                  - "Look under Winter."
                  - "They hibernate."
              - id: l1-f3
                type: true_false
                text: "Hedgehogs\nFood: Hedgehogs eat beetles, worms and slugs.\nHomes: They sleep in piles of leaves and under hedges.\nWinter: In cold months they hibernate.\n\nIs it true? The text says hedgehogs eat slugs."
                say: "Read the question at the bottom. Is it true?"
                answer: true
                hints:
                  - "Scan for the key word slugs."
                  - "It is under Food."
                  - "Yes."
              - id: l1-f4
                type: multiple_choice
                text: "The Moon\nSize: The Moon is much smaller than the Earth.\nLight: It does not make its own light; it reflects light from the Sun.\nVisits: People first walked on the Moon in 1969.\n\nWhen did people first walk on the Moon?"
                say: "Read the question at the bottom. Find the answer in the text."
                options: ["1969", "the Sun", "much smaller"]
                answer: "1969"
                hints:
                  - "Skim the headings. Which one is about people going there?"
                  - "Look under Visits."
                  - "1969."
              - id: l1-f5
                type: multiple_choice
                text: "The Moon\nSize: The Moon is much smaller than the Earth.\nLight: It does not make its own light; it reflects light from the Sun.\nVisits: People first walked on the Moon in 1969.\n\nWhich key word would you scan for to find out why the Moon shines?"
                say: "Read the question at the bottom. Which key word would you look for?"
                options: ["light", "size", "walked"]
                answer: "light"
                hints:
                  - "Shining is about light."
                  - "The heading Light will help."
                  - "Light."
              - id: l1-f6
                type: true_false
                text: "The Moon\nSize: The Moon is much smaller than the Earth.\nLight: It does not make its own light; it reflects light from the Sun.\nVisits: People first walked on the Moon in 1969.\n\nIs it true? The text says the Moon makes its own light."
                say: "Read the question at the bottom. Is it true?"
                answer: false
                hints:
                  - "Look under Light."
                  - "It does not make its own light."
                  - "No."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Volcanoes\nInside: Deep underground there is hot melted rock called magma.\nEruptions: When magma comes out of the ground, it is called lava.\nWhere: Many volcanoes are found around the Pacific Ocean.\n\nWhat is magma called when it comes out of the ground?"
                say: "Read the question at the bottom. Find the answer in the text."
                options: ["lava", "rock", "the Pacific"]
                answer: "lava"
                hints: ["Look under Eruptions."]
              - id: l1-s2
                type: multiple_choice
                text: "Volcanoes\nInside: Deep underground there is hot melted rock called magma.\nEruptions: When magma comes out of the ground, it is called lava.\nWhere: Many volcanoes are found around the Pacific Ocean.\n\nUnder which heading would you look to find where volcanoes are?"
                say: "Read the question at the bottom. Under which heading would you look?"
                options: ["Where", "Inside", "Eruptions"]
                answer: "Where"
                hints: ["The question asks where."]
              - id: l1-s3
                type: true_false
                text: "Volcanoes\nInside: Deep underground there is hot melted rock called magma.\nEruptions: When magma comes out of the ground, it is called lava.\nWhere: Many volcanoes are found around the Pacific Ocean.\n\nIs it true? Magma is cold."
                say: "Read the question at the bottom. Is it true?"
                answer: false
                hints: ["Scan for magma."]
              - id: l1-s4
                type: multiple_choice
                text: "Honeybees\nWork: Worker bees collect nectar from flowers.\nHome: Honeybees live together in a hive.\nFood: They turn nectar into honey.\n\nWhat do bees make from nectar?"
                say: "Read the question at the bottom. Find the answer in the text."
                options: ["honey", "a hive", "flowers"]
                answer: "honey"
                hints: ["Look under Food."]
              - id: l1-s5
                type: multiple_choice
                text: "Honeybees\nWork: Worker bees collect nectar from flowers.\nHome: Honeybees live together in a hive.\nFood: They turn nectar into honey.\n\nWhich key word would you scan for to find where bees live?"
                say: "Read the question at the bottom. Which key word would you look for?"
                options: ["home", "honey", "flowers"]
                answer: "home"
                hints: ["Where they live is their home."]
              - id: l1-s6
                type: true_false
                text: "Honeybees\nWork: Worker bees collect nectar from flowers.\nHome: Honeybees live together in a hive.\nFood: They turn nectar into honey.\n\nIs it true? The text says bees live alone."
                say: "Read the question at the bottom. Is it true?"
                answer: false
                hints: ["Look under Home."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Owls\nHunting: Most owls hunt at night.\nEyes: Their large eyes help them see in the dark.\nSound: Their soft feathers let them fly almost silently.\n\nWhy can owls see in the dark?"
                say: "Read the question at the bottom. Find the answer in the text."
                options: ["their large eyes", "their soft feathers", "they hunt at night"]
                answer: "their large eyes"
              - id: l1-n2
                type: multiple_choice
                text: "Owls\nHunting: Most owls hunt at night.\nEyes: Their large eyes help them see in the dark.\nSound: Their soft feathers let them fly almost silently.\n\nUnder which heading would you look to find how quiet owls are?"
                say: "Read the question at the bottom. Under which heading would you look?"
                options: ["Sound", "Eyes", "Hunting"]
                answer: "Sound"
              - id: l1-n3
                type: true_false
                text: "Owls\nHunting: Most owls hunt at night.\nEyes: Their large eyes help them see in the dark.\nSound: Their soft feathers let them fly almost silently.\n\nIs it true? The text says most owls hunt at night."
                say: "Read the question at the bottom. Is it true?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Tropical rainforests\nWeather: Tropical rainforests are hot and very wet.\nPlants: Tall trees form a roof of leaves called the canopy.\nAnimals: Monkeys, frogs and parrots live there.\n\nWhat is the roof of leaves called?"
                say: "Read the question at the bottom. Find the answer in the text."
                options: ["the canopy", "the weather", "parrots"]
                answer: "the canopy"
              - id: l1-n5
                type: multiple_choice
                text: "Tropical rainforests\nWeather: Tropical rainforests are hot and very wet.\nPlants: Tall trees form a roof of leaves called the canopy.\nAnimals: Monkeys, frogs and parrots live there.\n\nWhich key word would you scan for to find out about rain?"
                say: "Read the question at the bottom. Which key word would you look for?"
                options: ["wet", "canopy", "parrots"]
                answer: "wet"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Penguins\nHome: Most penguins live in the southern half of the world.\nSwimming: They cannot fly, but they swim very fast.\nFood: They eat fish and krill.\n\nWhat do penguins eat?"
            say: "Read the question at the bottom. Find the answer in the text."
            options: ["fish and krill", "the southern half", "they swim fast"]
            answer: "fish and krill"
          - id: l1-c2
            type: multiple_choice
            text: "Camels\nHumps: A camel's hump stores fat, not water.\nFeet: Wide feet stop camels sinking into the sand.\nDrinking: A thirsty camel can drink a lot of water very quickly.\n\nUnder which heading would you look to find why camels do not sink?"
            say: "Read the question at the bottom. Under which heading would you look?"
            options: ["Feet", "Humps", "Drinking"]
            answer: "Feet"
          - id: l1-c3
            type: true_false
            text: "Sunflowers\nHeight: Some sunflowers grow taller than a grown-up.\nSeeds: Each flower head holds hundreds of seeds.\nSun: Young sunflowers turn to face the sun.\n\nIs it true? The text says sunflowers can grow very tall."
            say: "Read the question at the bottom. Is it true?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Seahorses\nSwimming: Seahorses swim upright and quite slowly.\nTails: They hold on to seaweed with their tails.\nBabies: The father seahorse carries the eggs.\n\nWho carries the eggs?"
            say: "Read the question at the bottom. Find the answer in the text."
            options: ["the father seahorse", "the mother seahorse", "the seaweed"]
            answer: "the father seahorse"
          - id: l1-c5
            type: true_false
            text: "Rainbows\nWhen: You can see a rainbow when the sun shines during rain.\nColours: A rainbow has seven colours.\nShape: From the ground, a rainbow looks like an arch.\n\nIs it true? The text says a rainbow has nine colours."
            say: "Read the question at the bottom. Is it true?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Ants\nColonies: Ants live in large groups called colonies.\nStrength: An ant can carry many times its own weight.\nQueens: The queen ant lays all the eggs.\n\nWhich key word would you scan for to find out how strong ants are?"
            say: "Read the question at the bottom. Which key word would you look for?"
            options: ["strength", "queens", "colonies"]
            answer: "strength"

  - n: 2
    title: { de: Aus zwei Texten sammeln, en: Gathering from two texts }
    goal:
      de: "Sammle Tatsachen aus zwei Texten, schreib sie kurz auf und verbinde sie zu einem Satz, so wie über Froschlaich und Kaulquappen."
      en: "Collect facts from two texts, note them in a few words and join them in one sentence, like frogspawn and tadpoles."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Is it true? To skim a text, you look at the headings first."
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which key word would you scan for to find what an animal eats?"
            options: ["food", "home", "size"]
            answer: "food"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Frogs lay eggs in ponds. What do you think hatches out of them?"
            say: "Frogs lay their eggs in ponds. What do you think hatches out of them: baby frogs with legs, tadpoles, or little fish? Make a guess."
          - text: "Text A: Frogs lay their eggs in ponds. The eggs are called frogspawn.\nText B: A frog's eggs hatch into tadpoles, which later grow legs."
            say: "Tadpoles! But you needed two texts to find out. Often one text does not tell you everything. Text A says where frogs lay eggs. Text B says what hatches from them."
          - text: "eggs: in ponds (A) · eggs hatch into: tadpoles (B)"
            say: "When you record information, write the key fact in a few words and note which text it came from."
          - text: "Frogs lay eggs called frogspawn in ponds, and the eggs hatch into tadpoles."
            say: "To present it, join the facts from both texts into one clear sentence."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Text A: Swallows fly to Africa every autumn.\nText B: Swallows build nests of mud under roofs.\n\nWhich text tells you where swallows go in autumn?"
                say: "Read both texts. Which one answers the question?"
                options: ["Text A", "Text B", "both"]
                answer: "Text A"
                hints:
                  - "Scan for autumn."
                  - "Text A mentions autumn."
                  - "Text A."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Text A: Swallows fly to Africa every autumn.\nText B: Swallows build nests of mud under roofs.\n\nRecord the facts in a few words."
                say: "Record the facts from both texts in a few words."
                frame: "In autumn they go to: _  Their nests are made of: _"
                options: ["Africa", "mud", "roofs", "autumn"]
                answer: ["Africa", "mud"]
                option_audio: false
                hints:
                  - "One fact from each text."
                  - "Text A: Africa. Text B: mud."
                  - "Africa, mud."
              - id: l2-f3
                type: multiple_choice
                text: "Text A: Swallows fly to Africa every autumn.\nText B: Swallows build nests of mud under roofs.\n\nWhich sentence uses both texts?"
                options: ["Swallows build mud nests under roofs and fly to Africa in autumn.", "Swallows fly to Africa.", "Swallows like roofs."]
                answer: "Swallows build mud nests under roofs and fly to Africa in autumn."
                option_audio: false
                hints:
                  - "Look for a fact from A and a fact from B."
                  - "Look for the sentence with both Africa and mud nests."
                  - "Swallows build mud nests under roofs and fly to Africa in autumn."
              - id: l2-f4
                type: multiple_choice
                text: "Text A: The River Thames flows through London.\nText B: The Thames is about 346 kilometres long.\n\nHow long is the Thames?"
                say: "Read both texts. Find the answer."
                options: ["about 346 kilometres", "London", "it flows"]
                answer: "about 346 kilometres"
                hints:
                  - "Scan for long."
                  - "Text B."
                  - "About 346 kilometres."
              - id: l2-f5
                type: true_false
                text: "Text A: Sharks have been on Earth for millions of years.\nText B: Some sharks lose and regrow thousands of teeth.\n\nIs it true? Text A tells you about sharks' teeth."
                say: "Read both texts. Is it true?"
                answer: false
                hints:
                  - "Scan both texts for teeth."
                  - "Teeth are in Text B."
                  - "No."
              - id: l2-f6
                type: fill_in_blank
                text: "Text A: Sharks have been on Earth for millions of years.\nText B: Some sharks lose and regrow thousands of teeth.\n\nRecord the facts in a few words."
                say: "Record the facts from both texts in a few words."
                frame: "On Earth for: _  Teeth they can regrow: _"
                options: ["millions of years", "thousands", "sharks", "hundreds"]
                answer: ["millions of years", "thousands"]
                option_audio: false
                hints:
                  - "One fact from each text."
                  - "A: millions of years. B: thousands."
                  - "Millions of years, thousands."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Text A: Oak trees can live for hundreds of years.\nText B: Acorns are the seeds of oak trees.\n\nWhich text tells you about acorns?"
                say: "Read both texts. Which one answers the question?"
                options: ["Text B", "Text A", "both"]
                answer: "Text B"
                hints: ["Scan for acorns."]
              - id: l2-s2
                type: fill_in_blank
                text: "Text A: Oak trees can live for hundreds of years.\nText B: Acorns are the seeds of oak trees.\n\nRecord the facts in a few words."
                say: "Record the facts from both texts in a few words."
                frame: "Oaks live for: _  Their seeds are: _"
                options: ["hundreds of years", "acorns", "leaves", "ten years"]
                answer: ["hundreds of years", "acorns"]
                option_audio: false
                hints: ["One fact from each text."]
              - id: l2-s3
                type: multiple_choice
                text: "Text A: Oak trees can live for hundreds of years.\nText B: Acorns are the seeds of oak trees.\n\nWhich sentence uses both texts?"
                options: ["Oak trees, whose seeds are acorns, can live for hundreds of years.", "Oaks are trees.", "Acorns are small."]
                answer: "Oak trees, whose seeds are acorns, can live for hundreds of years."
                option_audio: false
                hints: ["A fact from each text."]
              - id: l2-s4
                type: true_false
                text: "Text A: The Sahara is the largest hot desert.\nText B: Camels can go days without water.\n\nIs it true? Text B tells you about camels."
                say: "Read both texts. Is it true?"
                answer: true
                hints: ["Scan for camels."]
              - id: l2-s5
                type: multiple_choice
                text: "Text A: The Sahara is the largest hot desert.\nText B: Camels can go days without water.\n\nHow long can camels go without water?"
                say: "Read both texts. Find the answer."
                options: ["days", "the largest", "hot"]
                answer: "days"
                hints: ["Text B."]
              - id: l2-s6
                type: fill_in_blank
                text: "Text A: The Sahara is the largest hot desert.\nText B: Camels can go days without water.\n\nRecord the facts in a few words."
                say: "Record the facts from both texts in a few words."
                frame: "Largest hot desert: _  Camels without water: _"
                options: ["the Sahara", "days", "weeks", "camels"]
                answer: ["the Sahara", "days"]
                option_audio: false
                hints: ["One fact from each text."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Text A: Butterflies start life as caterpillars.\nText B: A caterpillar makes a chrysalis before it changes.\n\nWhich text tells you about the chrysalis?"
                say: "Read both texts. Which one answers the question?"
                options: ["Text B", "Text A", "both"]
                answer: "Text B"
              - id: l2-n2
                type: fill_in_blank
                text: "Text A: Butterflies start life as caterpillars.\nText B: A caterpillar makes a chrysalis before it changes.\n\nRecord the facts in a few words."
                say: "Record the facts from both texts in a few words."
                frame: "Butterflies start as: _  Before changing it makes: _"
                options: ["caterpillars", "a chrysalis", "eggs", "wings"]
                answer: ["caterpillars", "a chrysalis"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Text A: Butterflies start life as caterpillars.\nText B: A caterpillar makes a chrysalis before it changes.\n\nWhich sentence uses both texts?"
                options: ["A butterfly starts as a caterpillar, which makes a chrysalis before it changes.", "Butterflies have wings.", "Caterpillars eat leaves."]
                answer: "A butterfly starts as a caterpillar, which makes a chrysalis before it changes."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Text A: Mount Everest is the highest mountain on Earth.\nText B: Climbers often use extra oxygen near the top.\n\nIs it true? Text A tells you why climbers use oxygen."
                say: "Read both texts. Is it true?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Text A: Mount Everest is the highest mountain on Earth.\nText B: Climbers often use extra oxygen near the top.\n\nWhat do climbers often use near the top?"
                say: "Read both texts. Find the answer."
                options: ["extra oxygen", "the highest mountain", "Earth"]
                answer: "extra oxygen"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: find
            type: multiple_choice
            text: "Whales\nBreathing: Whales breathe air through a blowhole.\nSize: The blue whale is the largest animal ever known.\nFood: Blue whales eat tiny shrimp-like animals called krill.\n\nHow do whales breathe?"
            say: "Read the question at the bottom. Find the answer in the text."
            options: ["through a blowhole", "they eat krill", "they are large"]
            answer: "through a blowhole"
          - id: l2-c2
            part: heading
            type: multiple_choice
            text: "Whales\nBreathing: Whales breathe air through a blowhole.\nSize: The blue whale is the largest animal ever known.\nFood: Blue whales eat tiny shrimp-like animals called krill.\n\nUnder which heading would you look to find the largest animal?"
            say: "Read the question at the bottom. Under which heading would you look?"
            options: ["Size", "Food", "Breathing"]
            answer: "Size"
          - id: l2-c3
            part: which-text
            type: multiple_choice
            text: "Text A: Tigers are the largest wild cats.\nText B: Every tiger has its own pattern of stripes.\n\nWhich text tells you about stripes?"
            say: "Read both texts. Which one answers the question?"
            options: ["Text B", "Text A", "both"]
            answer: "Text B"
          - id: l2-c4
            part: record
            type: fill_in_blank
            text: "Text A: Tigers are the largest wild cats.\nText B: Every tiger has its own pattern of stripes.\n\nRecord the facts in a few words."
            say: "Record the facts from both texts in a few words."
            frame: "Largest wild cats: _  Each has its own: _"
            options: ["tigers", "stripes", "lions", "spots"]
            answer: ["tigers", "stripes"]
            option_audio: false
          - id: l2-c5
            part: present
