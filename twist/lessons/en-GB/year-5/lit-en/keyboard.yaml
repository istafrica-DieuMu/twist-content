# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.keyboard
skill: lit-en.handwriting.keyboard
curriculum: en-GB
language: en
title:
  de: Texte am Computer schreiben
  en: Typing and laying out a text
summary: >
  Children type a short text and lay it out clearly. Lesson 1 takes the
  keys: the shift key for one capital letter, caps lock for a word in
  capitals, one space between words, no space before a full stop or a
  comma and one space after it. Lesson 2 takes layout: a title at the
  top, the Enter key for a new paragraph, and when a new paragraph
  starts (a new time, place, topic or speaker); it ends with the skill
  check. Typed answers use `keyboard: letters`, which checks capitals
  exactly. The app has no word processor, so laying out a whole page is
  taught with choice tasks; the skill check marks what a screen can
  mark, and typing a whole text is left to Practise.
metadata:
  year: year-5
  topic: { de: Texte gestalten, en: Presenting writing }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.handwriting.joined-legible]
  also_practises: [lit-en.grammar.sentence-punctuation]
  vocabulary: { en: [keyboard, shift key, caps lock, space bar, Enter key, paragraph, title, full stop, comma, layout] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: capitals, what: { de: Großbuchstaben mit Umschalttaste und Feststelltaste tippen, en: typing capital letters with shift and caps lock } }
    - { id: spacing, what: { de: "Leerzeichen und Satzzeichen: keins davor, eins danach", en: "spaces and punctuation: none before a full stop or comma, one after" } }
    - { id: paragraphs, what: { de: "mit Enter einen neuen Absatz beginnen, wenn Zeit, Ort, Thema oder Sprecher wechseln", en: "pressing Enter for a new paragraph when the time, place, topic or speaker changes" } }
    - { id: layout, what: { de: einen Titel und Absätze anordnen, en: laying out a title and paragraphs } }
  misconceptions:
    - id: caps-lock-for-capitals
      what: Turns on caps lock for every capital letter and then types the rest of the word in capitals too
      addressed: Learn screen 1 of lesson 1; l1-f1 (feedback), l1-s1, l1-n1, l2-c1
    - id: space-before-punctuation
      what: Types a space before a full stop or a comma, or none after it
      addressed: Learn screen 2 of lesson 1; l1-f3 (feedback), l1-f4, l1-s3, l1-n3, l2-c2
    - id: one-long-block
      what: Types the whole text as one block, or presses Enter at the end of every line as on paper
      addressed: Learn screens 2 and 3 of lesson 2; l2-f2 (feedback), l2-f4, l2-s2, l2-n2, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Großbuchstaben und Leerzeichen, en: Capitals and spaces }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "In neat handwriting, what should the gap between two words look like?"
            options: ["a clear gap, the same every time", "no gap at all", "a different size each time"]
            answer: "a clear gap, the same every time"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? Legible writing is writing that is easy to read."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Shift + m = M\nCaps lock: MMMM"
            say: "To type one capital letter, hold down the shift key and press the letter. Caps lock turns every letter into a capital until you press it again, so use it only for a whole word in capitals."
          - text: "I like cats. My cat is grey.\nnot: I like cats .My cat is grey."
            say: "Press the space bar once between words. A full stop or a comma goes straight after the last word, with no space before it, and one space after it."
          - text: "Paris\nMr Khan\nI"
            say: "The same capital letters as in handwriting: the start of a sentence, names of people and places, and the word I on its own."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "You want to type the name Ravi. How do you make the capital R?"
                options: ["hold shift and press r", "turn on caps lock and type the whole name", "press r twice"]
                answer: "hold shift and press r"
                feedback:
                  "turn on caps lock and type the whole name": "Caps lock makes every letter a capital: RAVI. For one capital, hold shift."
                hints:
                  - "You want only one capital letter."
                  - "One key turns a single letter into a capital while you hold it."
                  - "Hold shift and press r."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Type the name of the city: london. Give it its capital letter."
                say: "Type the name of the city London, with its capital letter."
                keyboard: letters
                answer: "London"
                hints:
                  - "Names of places start with a capital letter."
                  - "Hold shift for the first letter only."
                  - "London."
              - id: l1-f3
                type: multiple_choice
                text: "Which is typed correctly?"
                options: ["We went home. It was late.", "We went home .It was late.", "We went home . It was late."]
                answer: "We went home. It was late."
                option_audio: false
                feedback:
                  "We went home . It was late.": "There is a space before the full stop. The full stop goes straight after home."
                hints:
                  - "Look at the spaces round each full stop."
                  - "No space before a full stop, one space after it."
                  - "We went home. It was late."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap every card that is a stray full stop or comma, typed after a space."
                say: "Some full stops and commas have a space before them. Tap each one that stands on its own."
                show: { drawn: letter-card, text: "Jo has a dog , a cat and a rabbit ." }
                spans: [",", "."]
                hints:
                  - "Look for punctuation standing on its own card."
                  - "It should sit straight after a word."
                  - "The comma after dog and the full stop after rabbit."
              - id: l1-f5
                type: true_false
                text: "Is it true? You press the space bar once between two words."
                answer: true
                hints:
                  - "How big is a gap between words?"
                  - "Two spaces make a gap too big."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Caps lock is on. What happens when you type hello?"
                options: ["HELLO", "Hello", "hello"]
                answer: "HELLO"
                option_audio: false
                hints: ["Caps lock makes every letter a capital."]
              - id: l1-s2
                type: text_input
                text: "Type the name: mrs evans. Give it its capital letters."
                say: "Type the name Mrs Evans, with its capital letters."
                keyboard: letters
                answer: "Mrs Evans"
                hints: ["Mrs and Evans each start with a capital."]
              - id: l1-s3
                type: multiple_choice
                text: "Which is typed correctly?"
                options: ["I packed socks, shorts and a hat.", "I packed socks ,shorts and a hat.", "I packed socks , shorts and a hat ."]
                answer: "I packed socks, shorts and a hat."
                option_audio: false
                hints: ["A comma sits straight after the word, then one space."]
              - id: l1-s4
                type: true_false
                text: "Is it true? You need caps lock to type a capital letter at the start of a sentence."
                answer: false
                hints: ["Which key makes just one capital?"]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap every word that needs a capital letter."
                say: "This was typed with no capital letters. Tap every word that needs one."
                show: { drawn: letter-card, text: "on saturday i went to cardiff" }
                spans: ["on", "saturday", "i", "cardiff"]
                hints: ["The first word, a day, the word I and a city."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "You want to type the heading STOP in capitals. What is the quickest way?"
                options: ["turn on caps lock, type it, turn caps lock off", "hold shift for the S only", "type it in small letters"]
                answer: "turn on caps lock, type it, turn caps lock off"
              - id: l1-n2
                type: text_input
                text: "Type the name of the river: thames. Give it its capital letter."
                say: "Type the name of the river Thames, with its capital letter."
                keyboard: letters
                answer: "Thames"
              - id: l1-n3
                type: multiple_choice
                text: "Which is typed correctly?"
                options: ["Help! The bath is full.", "Help !The bath is full.", "Help ! The bath is full ."]
                answer: "Help! The bath is full."
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Is it true? There is one space after a full stop, before the next sentence."
                answer: true
              - id: l1-n5
                type: highlight_in_text
                text: "Tap every word that needs a capital letter."
                say: "This was typed with no capital letters. Tap every word that needs one."
                show: { drawn: letter-card, text: "my friend amir lives in bristol" }
                spans: ["my", "amir", "bristol"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Type the name: priya. Give it its capital letter."
            say: "Type the name Priya, with its capital letter."
            keyboard: letters
            answer: "Priya"
          - id: l1-c2
            type: multiple_choice
            text: "Which is typed correctly?"
            options: ["It rained. We stayed in.", "It rained .We stayed in.", "It rained.We stayed in."]
            answer: "It rained. We stayed in."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? You hold shift to type one capital letter."
            answer: true
          - id: l1-c4
            type: highlight_in_text
            text: "Tap the words that should start with a capital letter."
            say: "This was typed with no capital letters. Tap the words that should start with one."
            show: { drawn: letter-card, text: "last week my gran and i visited edinburgh" }
            spans: ["last", "i", "edinburgh"]
          - id: l1-c5
            type: multiple_choice
            text: "Which is typed correctly?"
            options: ["Look! A rainbow.", "Look ! A rainbow.", "Look !A rainbow."]
            answer: "Look! A rainbow."
            option_audio: false
          - id: l1-c6
            type: text_input
            text: "Type it with the right capital letters: i live in leeds"
            say: "Type, I live in Leeds, with the right capital letters."
            keyboard: letters
            answer: "I live in Leeds"

  - n: 2
    title: { de: Titel und Absätze, en: Titles and paragraphs }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is typed correctly?"
            options: ["Bees make honey. They live in hives.", "Bees make honey .They live in hives.", "Bees make honey . They live in hives ."]
            answer: "Bees make honey. They live in hives."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Type the name of the country: wales. Give it its capital letter."
            say: "Type the name of the country Wales, with its capital letter."
            keyboard: letters
            answer: "Wales"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Our trip to the zoo\n\nOn Monday, Class 5 went to the zoo. We saw lions and zebras.\n\nAfter lunch, we visited the penguins. They were being fed."
            say: "Here is a short typed report. The title is at the top, on its own line, and starts with a capital letter, like a sentence. Names in it keep their capitals too. Each paragraph is a block of sentences, with a gap before the next one."
          - text: "Press Enter to start a new paragraph."
            say: "On a computer the words move to the next line by themselves when a line is full. You press Enter only to start a new paragraph. Pressing Enter twice leaves a blank line between paragraphs."
          - text: "New paragraph for:\na new time\na new place\na new topic\na new speaker"
            say: "Start a new paragraph when the time changes, the place changes, the topic changes, or a new person speaks."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Where does the title of a typed report go?"
                options: ["at the top, on its own line", "at the end of the last paragraph", "in the middle of the first sentence"]
                answer: "at the top, on its own line"
                hints:
                  - "What do readers see first?"
                  - "The title tells them what the text is about before they start."
                  - "At the top, on its own line."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "You are typing a sentence and reach the end of the line. What should you do?"
                options: ["keep typing; the words move to the next line by themselves", "press Enter at the end of every line", "start a new paragraph"]
                answer: "keep typing; the words move to the next line by themselves"
                feedback:
                  "press Enter at the end of every line": "On a computer the words wrap round by themselves. Enter starts a new paragraph."
                hints:
                  - "This is different from writing on paper."
                  - "The computer moves words down when a line is full."
                  - "Keep typing."
              - id: l2-f3
                type: sorting
                text: "You have just written about the morning of a trip. New paragraph or same paragraph?"
                say: "You have just written about the morning of a trip. Does each next sentence start a new paragraph, or stay in the same one?"
                option_audio: false
                bins:
                  - { id: new, show: { text: "new paragraph" }, say: "New paragraph." }
                  - { id: same, show: { text: "same paragraph" }, say: "Same paragraph." }
                options:
                  - { text: "Later that afternoon, we went to the beach.", bin: new }
                  - { text: "We also ate our sandwiches on the coach.", bin: same }
                  - { text: "The next day, we visited a castle.", bin: new }
                  - { text: "It was a sunny morning too.", bin: same }
                hints:
                  - "Look for a change of time or place."
                  - "Later that afternoon and the next day are new times."
                  - "The afternoon and next-day sentences start new paragraphs."
              - id: l2-f4
                type: true_false
                text: "Is it true? A whole report typed as one long block is easy to read."
                answer: false
                hints:
                  - "How do readers find each part?"
                  - "Paragraphs break a text into clear parts."
                  - "No, it is not true."
              - id: l2-f5
                type: multiple_choice
                text: "In a story, Tom speaks. Then his sister answers. What do you do when she starts to speak?"
                options: ["start a new paragraph", "keep going on the same line", "type her words in capitals"]
                answer: "start a new paragraph"
                hints:
                  - "Who is speaking now?"
                  - "A new speaker gets a new paragraph."
                  - "Start a new paragraph."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which key do you press to start a new paragraph?"
                options: ["Enter", "Shift", "Caps lock"]
                answer: "Enter"
                hints: ["It moves you to a fresh line."]
              - id: l2-s2
                type: multiple_choice
                text: "Your report on hedgehogs has a paragraph on what they eat. Next you write about where they sleep. What do you do?"
                options: ["press Enter and start a new paragraph", "carry on in the same paragraph", "start a new title"]
                answer: "press Enter and start a new paragraph"
                hints: ["The topic has changed."]
              - id: l2-s3
                type: sorting
                text: "You have just written about what hedgehogs eat. New paragraph or same paragraph?"
                say: "You have just written about what hedgehogs eat. Does each next sentence start a new paragraph, or stay in the same one?"
                option_audio: false
                bins:
                  - { id: new, show: { text: "new paragraph" }, say: "New paragraph." }
                  - { id: same, show: { text: "same paragraph" }, say: "Same paragraph." }
                options:
                  - { text: "They also eat beetles and worms.", bin: same }
                  - { text: "In winter, hedgehogs hibernate in piles of leaves.", bin: new }
                  - { text: "Slugs are a favourite meal as well.", bin: same }
                  - { text: "Hedgehogs face many dangers, such as busy roads.", bin: new }
                hints: ["Food stays together; sleeping and dangers are new topics."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Pressing Enter twice leaves a blank line between paragraphs."
                answer: true
                hints: ["One Enter starts a new line; a second one leaves it empty."]
              - id: l2-s5
                type: text_input
                text: "Type the title of your report: rainforest animals. Give the first word its capital letter."
                say: "Type the title Rainforest animals. Start it with a capital letter."
                keyboard: letters
                answer: "Rainforest animals"
                hints: ["A title starts with a capital letter, like a sentence. There are no names in this one."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is the best layout for a typed letter to your head teacher?"
                options: ["short paragraphs with a gap between them", "one long block of text", "every sentence in capitals"]
                answer: "short paragraphs with a gap between them"
              - id: l2-n2
                type: true_false
                text: "Is it true? When typing, you press Enter at the end of every line, as on paper."
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "A story moves from the kitchen to the garden. What should the writer do?"
                options: ["start a new paragraph", "start a new title", "add an exclamation mark"]
                answer: "start a new paragraph"
              - id: l2-n4
                type: text_input
                text: "Type the title: my trip to york. Start it with a capital letter, and give the name its capital too."
                say: "Type the title My trip to York. Start it with a capital letter, and give the name its capital too."
                keyboard: letters
                answer: "My trip to York"
              - id: l2-n5
                type: highlight_in_text
                text: "Tap each card that is a stray full stop or comma, typed after a space."
                say: "Some full stops and commas have a space before them. Tap each one that stands on its own."
                show: { drawn: letter-card, text: "First , we packed . Then we left." }
                spans: [",", "."]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: capitals
            type: multiple_choice
            text: "You are typing: \"Zara has a kite.\" Which key do you hold down to make the capital Z?"
            say: "You are typing, Zara has a kite. Which key do you hold down to make the capital Z?"
            options: ["shift", "caps lock", "Enter"]
            answer: "shift"
            option_audio: false
          - id: l2-c2
            part: spacing
            type: multiple_choice
            text: "Which is typed correctly?"
            options: ["After tea, we played chess.", "After tea ,we played chess.", "After tea , we played chess ."]
            answer: "After tea, we played chess."
            option_audio: false
          - id: l2-c3
            part: capitals
            type: text_input
            text: "Type the name of the city: manchester. Give it its capital letter."
            say: "Type the name of the city Manchester, with its capital letter."
            keyboard: letters
            answer: "Manchester"
          - id: l2-c4
            part: paragraphs
            type: multiple_choice
            text: "Your report about the Romans moves on from their roads to their food. What should you do?"
            options: ["press Enter and start a new paragraph", "keep typing in the same paragraph", "type the next part in capitals"]
            answer: "press Enter and start a new paragraph"
          - id: l2-c5
            part: layout
            type: true_false
            text: "Is it true? The title of a report goes at the top, on its own line."
            answer: true
          - id: l2-c6
            part: capitals
            type: multiple_choice
            text: "You meant to type Hello, but caps lock was on and you typed HELLO. What should you do?"
            options: ["press caps lock to turn it off, then type it again", "hold shift for every letter", "nothing, because it is correct"]
            answer: "press caps lock to turn it off, then type it again"
            option_audio: false
          - id: l2-c7
            part: capitals
            type: true_false
            text: "Is it true? When you type the word I on its own, it needs a capital letter."
            say: "Is it true? When you type the word I on its own, it needs a capital letter."
            answer: true
          - id: l2-c8
            part: capitals
            type: text_input
            text: "Type the names with their capital letters: amy and tom"
            say: "Type, Amy and Tom, with their capital letters."
            keyboard: letters
            answer: "Amy and Tom"
          - id: l2-c9
            part: spacing
            type: multiple_choice
            text: "Which is typed correctly?"
            options: ["We ate pasta, peas and pie.", "We ate pasta ,peas and pie.", "We ate pasta,peas and pie."]
            answer: "We ate pasta, peas and pie."
            option_audio: false
          - id: l2-c10
            part: spacing
            type: highlight_in_text
            text: "Tap the comma that has a space typed before it."
            say: "One comma has a space before it. Tap it."
            show: { drawn: letter-card, text: "Mum said we could go , but it rained." }
            spans: [","]
          - id: l2-c11
            part: spacing
            type: true_false
            text: "\"We won.The crowd cheered.\"\n\nIs it true? This is typed correctly."
            say: "Look at the spaces. Is it true? This is typed correctly."
            answer: false
          - id: l2-c12
            part: spacing
            type: multiple_choice
            text: "How many times do you press the space bar between two words?"
            options: ["once", "twice", "three times"]
            answer: "once"
          - id: l2-c13
            part: paragraphs
            type: sorting
            text: "You have just written about getting ready for sports day. New paragraph or same paragraph?"
            say: "You have just written about getting ready for sports day. Does each next sentence start a new paragraph, or stay in the same one?"
            option_audio: false
            bins:
              - { id: new, show: { text: "new paragraph" }, say: "New paragraph." }
              - { id: same, show: { text: "same paragraph" }, say: "Same paragraph." }
            options:
              - { text: "When the whistle blew, the races began.", bin: new }
              - { text: "I also packed my water bottle.", bin: same }
              - { text: "At the end of the day, Mr Lee gave out the medals.", bin: new }
              - { text: "My trainers were by the door, ready.", bin: same }
          - id: l2-c14
            part: paragraphs
            type: multiple_choice
            text: "Which of these means you should start a new paragraph?"
            options: ["the story jumps to the next morning", "the next sentence is about the same thing", "the sentence has a comma in it"]
            answer: "the story jumps to the next morning"
          - id: l2-c15
            part: paragraphs
            type: true_false
            text: "Is it true? When a new person starts to speak in a story, you start a new paragraph."
            say: "Is it true? When a new person starts to speak in a story, you start a new paragraph."
            answer: true
          - id: l2-c16
            part: paragraphs
            type: multiple_choice
            text: "When you type, when do the words move onto a new line by themselves?"
            options: ["when the line is full", "after every full stop", "never, you always press Enter"]
            answer: "when the line is full"
          - id: l2-c17
            part: layout
            type: text_input
            text: "Type the title: the life of a frog. Start it with a capital letter."
            say: "Type the title The life of a frog. Start it with a capital letter."
            keyboard: letters
            answer: "The life of a frog"
          - id: l2-c18
            part: layout
            type: multiple_choice
            text: "Which title is typed correctly for the top of a report?"
            options: ["Volcanoes of the world", "volcanoes of the world", "VOLCANOES of the world"]
            answer: "Volcanoes of the world"
            option_audio: false
          - id: l2-c19
            part: layout
            type: true_false
            text: "Is it true? A typed report needs no title if it has paragraphs."
            say: "Is it true? A typed report needs no title if it has paragraphs."
            answer: false
          - id: l2-c20
            part: layout
            type: multiple_choice
            text: "Which layout is best for a typed fact file about sharks?"
            options: ["a title, then short paragraphs with gaps", "one long block with no title", "the title at the bottom"]
            answer: "a title, then short paragraphs with gaps"
