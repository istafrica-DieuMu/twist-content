# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.figurative-language
skill: lit-en.comprehension.figurative-language
curriculum: en-GB
language: en
title:
  de: Vergleiche und Metaphern verstehen
  en: Similes, metaphors and their effect
summary: >
  Children name figurative language and explain what it does to the
  reader. Lesson 1 tells similes (as brave as a lion, ran like the
  wind) from metaphors (the classroom was a zoo) and personification
  (the wind howled), and checks that a figure of speech is not meant
  literally. Lesson 2 explains the effect: what the comparison makes the
  reader picture or feel, and why the author chose it; it ends with the
  skill check. Extracts are short and written for Twist.
metadata:
  year: year-5
  topic: { de: Wie Texte wirken, en: How texts work }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.comprehension.language-structure]
  also_practises: [lit-en.comprehension.words-in-context]
  vocabulary: { en: [figurative language, simile, metaphor, personification, literal, compare, effect, reader, image, mood] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: identify, what: { de: "Vergleich, Metapher und Personifikation erkennen", en: "telling a simile, a metaphor and personification apart" } }
    - { id: literal, what: { de: "wissen, was verglichen wird und dass es nicht wörtlich gemeint ist", en: knowing what is compared and that it is not meant literally } }
    - { id: effect, what: { de: "erklären, was der Leser sich vorstellt oder fühlt", en: explaining what the reader pictures or feels } }
    - { id: word-choice, what: { de: "erklären, warum der Autor ein Wort für eine Wirkung wählt", en: explaining why the author chose a word for its effect } }
  misconceptions:
    - id: any-comparison-is-simile
      what: Calls every comparison a simile, including metaphors that have no like or as
      addressed: Learn screens 1 and 2 of lesson 1; l1-f2 (feedback), l1-f4, l1-s2, l1-n2, l2-c1
    - id: like-always-simile
      what: Thinks every sentence with like is a simile, even I like pizza
      addressed: Learn screen 1 of lesson 1; l1-f5, l1-s4, l1-n4
    - id: effect-is-definition
      what: Explains the effect by naming the device or retelling the words (it is a simile because it says like) instead of saying what the reader pictures or feels
      addressed: Learn of lesson 2; l2-f1 (feedback), l2-f3, l2-s1, l2-n1, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Vergleich oder Metapher, en: Simile or metaphor }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "\"The door creaked open slowly.\"\n\nWhich word helps you hear the door?"
            options: ["creaked", "door", "slowly"]
            answer: "creaked"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Why might an author write a heading in bold at the top of a page?"
            options: ["so the reader sees what the page is about", "to fill up space", "so the page is harder to read"]
            answer: "so the reader sees what the page is about"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Simile: Her hands were as cold as ice.\nSimile: He ran like the wind."
            say: "Authors compare things to help us picture them. A simile compares two things using like or as: as cold as ice, ran like the wind. Careful: in I like pizza, like is not comparing anything, so it is not a simile."
          - text: "Metaphor: The classroom was a zoo."
            say: "A metaphor says one thing is another. The classroom was not really a zoo, but it was noisy and wild, like a zoo. There is no like or as in a metaphor."
          - text: "Personification: The wind howled at the window."
            say: "Personification gives a thing human or animal actions. Wind cannot really howl, but howled makes it sound angry and alive."
          - text: "Figurative: not meant literally."
            say: "All of these are figurative language. They are not meant literally, which means they are not true word for word. They create a picture in the reader's mind."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"The baby's cheeks were as soft as a peach.\"\n\nWhat is this?"
                options: ["a simile", "a metaphor", "personification"]
                answer: "a simile"
                keep_order: true
                hints:
                  - "Look for the word like or as."
                  - "It compares cheeks to a peach using as."
                  - "A simile."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"My brother is a couch potato.\"\n\nWhat is this?"
                options: ["a simile", "a metaphor", "personification"]
                answer: "a metaphor"
                keep_order: true
                feedback:
                  "a simile": "There is no like or as. It says he IS a couch potato, so it is a metaphor."
                hints:
                  - "Is there a like or an as?"
                  - "It says he is something he is not."
                  - "A metaphor."
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the word that makes this personification."
                say: "Tap the word that gives the leaves a human action."
                show: { drawn: letter-card, text: "The autumn leaves danced across the playground." }
                spans: ["danced"]
                hints:
                  - "What do the leaves do?"
                  - "Can leaves really do it, like a person?"
                  - "Danced."
              - id: l1-f4
                type: sorting
                text: "Simile or metaphor?"
                say: "Is each one a simile or a metaphor? Sort them."
                option_audio: false
                bins:
                  - { id: simile, show: { text: "simile" }, say: "Simile." }
                  - { id: metaphor, show: { text: "metaphor" }, say: "Metaphor." }
                options:
                  - { text: "The stars were diamonds in the sky.", bin: metaphor }
                  - { text: "She swam like a fish.", bin: simile }
                  - { text: "Time is a thief.", bin: metaphor }
                  - { text: "The tea was as hot as lava.", bin: simile }
                hints:
                  - "Look for like or as."
                  - "No like or as: it says one thing is another."
                  - "Diamonds and thief: metaphors. Fish and lava: similes."
              - id: l1-f5
                type: true_false
                text: "Is it true? \"I like reading comics\" is a simile."
                answer: false
                hints:
                  - "Is like comparing two things here?"
                  - "Here like means enjoy."
                  - "No, it is not a simile."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"The thunder grumbled in the distance.\"\n\nWhat is this?"
                options: ["a simile", "a metaphor", "personification"]
                answer: "personification"
                keep_order: true
                hints: ["Can thunder really grumble?"]
              - id: l1-s2
                type: multiple_choice
                text: "\"The playground was an ice rink after the frost.\"\n\nWhat is this?"
                options: ["a simile", "a metaphor", "personification"]
                answer: "a metaphor"
                keep_order: true
                hints: ["Is there a like or an as?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the two things being compared."
                say: "Tap the two things this simile compares."
                show: { drawn: letter-card, text: "The snow was like a white blanket." }
                spans: ["snow", "blanket"]
                hints: ["What is like what?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which sentence contains a simile?"
                options: ["The dog barked like a lion.", "I would like a drink.", "The dog likes bones."]
                answer: "The dog barked like a lion."
                option_audio: false
                hints: ["Which one compares two things?"]
              - id: l1-s5
                type: true_false
                text: "Is it true? \"The car coughed and spluttered up the hill\" is personification."
                answer: true
                hints: ["Can a car really cough?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"The puppy was as quick as lightning.\"\n\nWhat is this?"
                options: ["a simile", "a metaphor", "personification"]
                answer: "a simile"
                keep_order: true
              - id: l1-n2
                type: multiple_choice
                text: "\"Grandad's garden is a jungle.\"\n\nWhat is this?"
                options: ["a simile", "a metaphor", "personification"]
                answer: "a metaphor"
                keep_order: true
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the word that makes this personification."
                say: "Tap the word that gives the sun a human action."
                show: { drawn: letter-card, text: "The sun smiled down on the beach." }
                spans: ["smiled"]
              - id: l1-n4
                type: true_false
                text: "Is it true? \"Her laugh sounded like a hyena\" is a simile."
                answer: true
              - id: l1-n5
                type: sorting
                text: "Simile, metaphor or personification?"
                say: "Is each one a simile, a metaphor or personification? Sort them."
                option_audio: false
                bins:
                  - { id: simile, show: { text: "simile" }, say: "Simile." }
                  - { id: metaphor, show: { text: "metaphor" }, say: "Metaphor." }
                  - { id: person, show: { text: "personification" }, say: "Personification." }
                options:
                  - { text: "The moon was a silver coin.", bin: metaphor }
                  - { text: "The kettle sang on the stove.", bin: person }
                  - { text: "Her voice was as sweet as honey.", bin: simile }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"The waves roared at the rocks.\"\n\nWhat is this?"
            options: ["a simile", "a metaphor", "personification"]
            answer: "personification"
            keep_order: true
          - id: l1-c2
            type: multiple_choice
            text: "\"His eyes sparkled like stars.\"\n\nWhat is this?"
            options: ["a simile", "a metaphor", "personification"]
            answer: "a simile"
            keep_order: true
          - id: l1-c3
            type: true_false
            text: "Is it true? A metaphor always uses the word like."
            answer: false
          - id: l1-c4
            type: sorting
            text: "Simile or personification? Sort them."
            say: "Is each one a simile or personification? Sort them."
            option_audio: false
            bins:
              - { id: simile, show: { text: "simile" }, say: "Simile." }
              - { id: person, show: { text: "personification" }, say: "Personification." }
            options:
              - { text: "The clouds raced across the sky.", bin: person }
              - { text: "The cat was as black as coal.", bin: simile }
              - { text: "The gate groaned as it opened.", bin: person }
              - { text: "The pond was like a mirror.", bin: simile }
          - id: l1-c5
            type: highlight_in_text
            text: "Tap the two things this metaphor compares."
            say: "Tap the two things this metaphor compares."
            show: { drawn: letter-card, text: "The road was a ribbon across the hills." }
            spans: ["road", "ribbon"]
          - id: l1-c6
            type: multiple_choice
            text: "Which sentence contains a metaphor?"
            options: ["The car park was an oven in the heat.", "The car park was as hot as an oven.", "The car park was hot."]
            answer: "The car park was an oven in the heat."
            option_audio: false

  - n: 2
    title: { de: Wie die Sprache wirkt, en: What it does to the reader }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"The fog was a grey wall.\"\n\nWhat is this?"
            options: ["a simile", "a metaphor", "personification"]
            answer: "a metaphor"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "\"The old house groaned in the storm.\"\n\nWhat is this?"
            options: ["a simile", "a metaphor", "personification"]
            answer: "personification"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The silence in the hall was as heavy as a stone."
            say: "To explain an effect, ask: what does it make me picture or feel? A stone is heavy and hard to move. So the silence feels tense and uncomfortable, as if nobody dares to break it."
          - text: "Not: It is a simile because it uses as.\nBut: It makes the silence feel tense, like a weight nobody can lift."
            say: "Naming the simile is only the start. A good explanation says what the reader pictures or feels, and why the author chose those words."
          - text: "The wind howled. / The wind whispered."
            say: "Changing one word changes the effect. Howled makes the wind sound wild and frightening. Whispered makes it sound gentle and calm. Authors choose words to set the mood."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"Zara's smile was a ray of sunshine.\"\n\nWhat does the metaphor tell the reader?"
                options: ["Zara's smile was warm and made people happy.", "It is a metaphor because there is no like.", "Zara was standing in the sun."]
                answer: "Zara's smile was warm and made people happy."
                option_audio: false
                feedback:
                  "It is a metaphor because there is no like.": "That names the metaphor but does not explain it. What does sunshine make you feel?"
                hints:
                  - "What does sunshine feel like?"
                  - "Sunshine is warm and bright and cheers us up."
                  - "Her smile was warm and made people happy."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "\"The corridor was as dark as a cave.\"\n\nWhat mood does this create?"
                options: ["spooky and uneasy", "happy and excited", "busy and noisy"]
                answer: "spooky and uneasy"
                hints:
                  - "How would you feel inside a dark cave?"
                  - "You could not see what was there."
                  - "Spooky and uneasy."
              - id: l2-f3
                type: multiple_choice
                text: "\"The tired old bus wheezed up the hill.\"\n\nWhy did the author choose wheezed?"
                options: ["to show the bus was struggling, like a person out of breath", "because buses really breathe", "to show the bus was new and fast"]
                answer: "to show the bus was struggling, like a person out of breath"
                option_audio: false
                hints:
                  - "Who wheezes?"
                  - "Someone out of breath, climbing slowly."
                  - "To show the bus was struggling."
              - id: l2-f4
                type: multiple_choice
                text: "Which simile makes a giant sound the most frightening?"
                options: ["His footsteps were like thunder.", "His footsteps were like a ticking clock.", "His footsteps were like a soft pillow."]
                answer: "His footsteps were like thunder."
                option_audio: false
                hints:
                  - "Which sound is loudest and scariest?"
                  - "Thunder booms and shakes the ground."
                  - "Like thunder."
              - id: l2-f5
                type: true_false
                text: "\"The river whispered over the stones.\"\n\nIs it true? Whispered makes the river sound calm and gentle."
                answer: true
                hints:
                  - "How loud is a whisper?"
                  - "A whisper is quiet and soft."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"The test was a mountain Ben had to climb.\"\n\nWhat does the metaphor tell the reader?"
                options: ["The test felt very hard to Ben.", "Ben went climbing.", "It is a metaphor because it says was."]
                answer: "The test felt very hard to Ben."
                option_audio: false
                hints: ["How does climbing a mountain feel?"]
              - id: l2-s2
                type: multiple_choice
                text: "\"The classroom buzzed like a beehive.\"\n\nWhat does the reader picture?"
                options: ["a busy, noisy room full of children", "a room full of real bees", "a quiet, empty room"]
                answer: "a busy, noisy room full of children"
                hints: ["What is a beehive like?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which sentence makes the storm sound angriest?"
                options: ["The storm raged over the town.", "The storm drifted over the town.", "The storm visited the town."]
                answer: "The storm raged over the town."
                option_audio: false
                hints: ["Which verb shows anger?"]
              - id: l2-s4
                type: true_false
                text: "\"The snowflakes were feathers falling from the sky.\"\n\nIs it true? This makes the snow sound heavy and hard."
                answer: false
                hints: ["How do feathers fall?"]
              - id: l2-s5
                type: multiple_choice
                text: "\"Mum's words were a warm hug.\"\n\nHow did Mum's words make the child feel?"
                options: ["comforted and loved", "cross and upset", "cold and lonely"]
                answer: "comforted and loved"
                hints: ["How does a hug feel?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"The library was a treasure chest.\"\n\nWhat does the metaphor tell the reader?"
                options: ["The library was full of exciting, valuable books.", "The library had gold coins in it.", "It is a metaphor because there is no as."]
                answer: "The library was full of exciting, valuable books."
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "\"The ice was as sharp as a knife.\"\n\nWhat mood does this create?"
                options: ["danger", "fun", "sleepiness"]
                answer: "danger"
              - id: l2-n3
                type: multiple_choice
                text: "\"The forest held its breath.\"\n\nWhat does this make the reader feel?"
                options: ["that something is about to happen", "that the trees are asleep", "that it is a sunny day"]
                answer: "that something is about to happen"
              - id: l2-n4
                type: true_false
                text: "\"The engine purred like a cat.\"\n\nIs it true? Purred makes the engine sound smooth and quiet."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Which simile makes a room sound the most peaceful?"
                options: ["The room was as quiet as a sleeping kitten.", "The room was as loud as a fire alarm.", "The room was like a busy station."]
                answer: "The room was as quiet as a sleeping kitten."
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: identify
            type: multiple_choice
            text: "\"Dad is a walking encyclopedia.\"\n\nWhat is this?"
            options: ["a simile", "a metaphor", "personification"]
            answer: "a metaphor"
            keep_order: true
          - id: l2-c2
            part: identify
            type: highlight_in_text
            text: "Tap the word that makes this personification."
            say: "Tap the word that gives the flowers a human action."
            show: { drawn: letter-card, text: "The flowers nodded in the breeze." }
            spans: ["nodded"]
          - id: l2-c3
            part: identify
            type: true_false
            text: "Is it true? \"She was as busy as a bee\" is a simile."
            answer: true
          - id: l2-c4
            part: effect
            type: multiple_choice
            text: "\"The night was a black velvet cloak.\"\n\nWhat does the metaphor tell the reader?"
            options: ["The night was very dark, soft and still.", "Someone wore a cloak at night.", "It is a metaphor because it says was."]
            answer: "The night was very dark, soft and still."
            option_audio: false
          - id: l2-c5
            part: word-choice
            type: multiple_choice
            text: "Which sentence makes the sea sound the most frightening?"
            options: ["The sea hurled itself at the cliffs.", "The sea lapped at the sand.", "The sea sparkled in the sun."]
            answer: "The sea hurled itself at the cliffs."
            option_audio: false
          - id: l2-c6
            part: identify
            type: sorting
            text: "Which kind of figurative language is each one? Sort them."
            say: "Is each one a simile, a metaphor or personification? Sort them."
            option_audio: false
            bins:
              - { id: simile, show: { text: "simile" }, say: "Simile." }
              - { id: metaphor, show: { text: "metaphor" }, say: "Metaphor." }
              - { id: person, show: { text: "personification" }, say: "Personification." }
            options:
              - { text: "The leaves whispered secrets.", bin: person }
              - { text: "The pillow was a cloud.", bin: metaphor }
              - { text: "He was as tall as a tree.", bin: simile }
          - id: l2-c7
            part: identify
            type: true_false
            text: "Is it true? \"The pencil danced across the page\" is a metaphor."
            say: "Is it true? The pencil danced across the page, is a metaphor."
            answer: false
          - id: l2-c8
            part: literal
            type: multiple_choice
            text: "\"Ella was a statue as she waited for her name to be called.\"\n\nWhat does this really mean?"
            options: ["Ella stood very still.", "Ella turned into stone.", "Ella was in a museum."]
            answer: "Ella stood very still."
            option_audio: false
          - id: l2-c9
            part: literal
            type: true_false
            text: "\"The baby's laugh was music.\"\n\nIs it true? The author means the baby really played music."
            say: "Read the sentence. Is it true? The author means the baby really played music."
            answer: false
          - id: l2-c10
            part: literal
            type: highlight_in_text
            text: "Tap the two things being compared in this simile."
            say: "Tap the two things this simile compares."
            show: { drawn: letter-card, text: "The lake was as smooth as glass." }
            spans: ["lake", "glass"]
          - id: l2-c11
            part: literal
            type: multiple_choice
            text: "\"The kitchen was a battlefield after the party.\"\n\nWhat does it really mean?"
            options: ["The kitchen was very messy.", "A battle took place in the kitchen.", "Soldiers came to the party."]
            answer: "The kitchen was very messy."
            option_audio: false
          - id: l2-c12
            part: literal
            type: true_false
            text: "\"The wind sang through the trees.\"\n\nIs it true? The wind cannot really sing, so this is not meant literally."
            say: "Read the sentence. Is it true? The wind cannot really sing, so this is not meant literally."
            answer: true
          - id: l2-c13
            part: effect
            type: multiple_choice
            text: "\"The stars were tiny lanterns guiding the travellers home.\"\n\nWhat does the reader picture?"
            options: ["small, friendly lights showing the way", "lamps hanging in the sky on strings", "a dark night with no light at all"]
            answer: "small, friendly lights showing the way"
            option_audio: false
          - id: l2-c14
            part: effect
            type: multiple_choice
            text: "\"The old man's voice was as rough as sandpaper.\"\n\nWhat does the simile tell the reader about his voice?"
            options: ["It was harsh and scratchy.", "It was soft and gentle.", "It was high and squeaky."]
            answer: "It was harsh and scratchy."
            option_audio: false
          - id: l2-c15
            part: effect
            type: true_false
            text: "\"Fear was a cold hand on Sam's neck.\"\n\nIs it true? This makes the reader feel that Sam was calm and relaxed."
            say: "Read the sentence. Is it true? This makes the reader feel that Sam was calm and relaxed."
            answer: false
          - id: l2-c16
            part: effect
            type: multiple_choice
            text: "\"The city never sleeps.\"\n\nWhat does this make the reader picture?"
            options: ["a busy place where things happen all day and night", "a city full of tired people", "a quiet city at night"]
            answer: "a busy place where things happen all day and night"
            option_audio: false
          - id: l2-c17
            part: word-choice
            type: multiple_choice
            text: "Which sentence makes the fire sound the most dangerous?"
            options: ["The fire devoured the barn.", "The fire warmed the barn.", "The fire glowed in the barn."]
            answer: "The fire devoured the barn."
            option_audio: false
          - id: l2-c18
            part: word-choice
            type: multiple_choice
            text: "\"The breeze tiptoed through the garden.\"\n\nWhy did the author choose tiptoed?"
            options: ["to show the breeze was light and gentle", "because the breeze has feet", "to show the breeze was strong and loud"]
            answer: "to show the breeze was light and gentle"
            option_audio: false
          - id: l2-c19
            part: word-choice
            type: true_false
            text: "\"The waves crashed against the harbour wall.\"\n\"The waves stroked the harbour wall.\"\n\nIs it true? Stroked makes the sea sound calmer than crashed."
            say: "Read both sentences. Is it true? Stroked makes the sea sound calmer than crashed."
            answer: true
          - id: l2-c20
            part: word-choice
            type: multiple_choice
            text: "Which simile makes the snow sound the softest?"
            options: ["The snow was like a thick white duvet.", "The snow was like broken glass.", "The snow was like a block of ice."]
            answer: "The snow was like a thick white duvet."
            option_audio: false
