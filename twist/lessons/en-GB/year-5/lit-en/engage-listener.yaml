# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.engage-listener
skill: lit-en.speaking.engage-listener
curriculum: en-GB
language: en
title:
  de: Zuhörer fesseln und mitnehmen
  en: Keeping your listener with you
summary: >
  Children learn how speakers hold a listener's interest and check that
  they are following. Lesson 1 takes interest: a hook at the start (a
  question, a surprising fact), a lively voice with pauses, looking at
  the audience and giving examples. Lesson 2 takes checking: reading
  the signs that a listener is lost, asking a check-in question, and
  saying it again in a new way; it ends with the skill check. Speak
  tasks are practised with the record-and-compare fallback and are
  never marked, so the skill check uses choice tasks: it marks what a
  screen can mark, and giving a talk to real listeners is left to
  Practise.
metadata:
  year: year-5
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.speaking.standard-english-speech]
  also_practises: [lit-en.speaking.standard-english-speech]
  vocabulary: { en: [audience, listener, hook, eye contact, pause, pace, volume, example, check in, recap] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: hook, what: { de: mit einem Aufhänger beginnen, en: starting with a hook } }
    - { id: voice, what: { de: "Interesse halten mit Stimme, Pausen, Blickkontakt und Beispielen", en: "keeping interest with voice, pauses, eye contact and examples" } }
    - { id: signs, what: { de: "erkennen, ob ein Zuhörer folgt oder nicht mehr mitkommt", en: reading the signs that a listener is following or lost } }
    - { id: check-in, what: { de: mit einer Frage oder Zusammenfassung nachprüfen, en: checking in with a question or a recap } }
    - { id: new-way, what: { de: etwas noch einmal anders erklären, en: explaining again in a new way } }
  misconceptions:
    - id: more-facts-more-interest
      what: Thinks a talk is interesting if it packs in as many facts as possible, read straight from the page
      addressed: Learn screens 1 and 3 of lesson 1; l1-f1 (feedback), l1-f3, l1-s3, l1-n3, l2-c1
    - id: silence-means-understood
      what: Thinks that if nobody says anything, everyone has understood
      addressed: Learn screen 1 of lesson 2; l2-f1 (feedback), l2-f3, l2-s1, l2-n1, l2-c3
    - id: repeat-louder
      what: Repeats the same words more loudly when a listener looks confused, instead of explaining in a new way
      addressed: Learn screen 3 of lesson 2; l2-f4 (feedback), l2-s4, l2-n4, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Interesse wecken, en: Hooking your listener }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which sentence is in Standard English?"
            options: ["We were late because the bus broke down.", "We was late because the bus broke down.", "Us was late cos the bus broke down."]
            answer: "We were late because the bus broke down."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? Speaking fluently means talking as fast as you can."
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Did you know that a blue whale's heart is as big as a small car?"
            say: "Listen to how Amira starts her talk about whales. She begins with a question and a surprising fact. That is a hook: it makes the audience want to hear more."
          - text: "Speak up. Change your pace. Pause before something important."
            say: "Keep your voice lively. Speak loudly enough for the back of the room, slow down for the important parts, and pause before a big fact so it lands."
          - text: "Look at your audience.\nGive an example they know."
            say: "Look up from your notes and around the room. Give examples your listeners know: a whale's heart as big as a car is easier to picture than a weight in kilograms."
          - text: "A list of facts read from the page loses listeners."
            say: "Reading a long list of facts with your eyes on the page is the quickest way to lose your audience, even if every fact is true."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is the best way to start a talk about volcanoes?"
                options: ["Imagine the ground under your feet shaking and turning hot.", "Volcanoes. Number one: lava. Number two: ash. Number three: magma.", "Um, my talk is about volcanoes, I think."]
                answer: "Imagine the ground under your feet shaking and turning hot."
                option_audio: false
                feedback:
                  "Volcanoes. Number one: lava. Number two: ash. Number three: magma.": "A list of facts at the start gives the listener no reason to care yet. A hook makes them want to hear more."
                hints:
                  - "Which start makes you want to hear more?"
                  - "A hook can ask you to imagine something."
                  - "Imagine the ground under your feet shaking."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Keeps listeners interested, or loses them?"
                say: "Does each one keep listeners interested, or lose them? Sort them."
                option_audio: false
                bins:
                  - { id: keeps, show: { text: "keeps them interested" }, say: "Keeps them interested." }
                  - { id: loses, show: { text: "loses them" }, say: "Loses them." }
                options:
                  - { text: "looking round at the audience", bin: keeps }
                  - { text: "mumbling into your notes", bin: loses }
                  - { text: "pausing before a surprising fact", bin: keeps }
                  - { text: "speaking in the same flat voice all the time", bin: loses }
                hints:
                  - "Think of a talk you enjoyed. What did the speaker do?"
                  - "Eye contact and pauses help; mumbling and a flat voice do not."
                  - "Looking round and pausing keep them; mumbling and a flat voice lose them."
              - id: l1-f3
                type: multiple_choice
                text: "Jake says a cheetah runs at 110 kilometres per hour. What could he add so his class can picture it?"
                options: ["It is as fast as a car on the motorway.", "It is a big number.", "Cheetahs live in Africa."]
                answer: "It is as fast as a car on the motorway."
                option_audio: false
                hints:
                  - "What do the listeners already know that is fast?"
                  - "Compare it with something familiar."
                  - "As fast as a car on the motorway."
              - id: l1-f4
                type: speak
                text: "Say a hook to start a talk about spiders. Start with: Did you know ..."
                say: "Say a hook to start a talk about spiders. Begin with Did you know. Then listen to an example."
                expected_text: "Did you know that some spiders can spin silk stronger than steel?"
                hints:
                  - "Think of the most surprising thing you know about spiders."
                  - "Did you know that some spiders ..."
                  - "Did you know that some spiders can spin silk stronger than steel?"
              - id: l1-f5
                type: true_false
                text: "Is it true? Pausing before an important fact helps the audience notice it."
                answer: true
                hints:
                  - "What does a short silence do to a room?"
                  - "Everyone waits to hear what comes next."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which hook would interest Year 5 listeners in a talk about the Romans?"
                options: ["What would you do if soldiers marched into our town tomorrow?", "The Romans were a people from Rome.", "This talk is about the Romans and it is quite long."]
                answer: "What would you do if soldiers marched into our town tomorrow?"
                option_audio: false
                hints: ["A question that puts the listener in the story."]
              - id: l1-s2
                type: true_false
                text: "Is it true? You should keep your eyes on your notes the whole time you speak."
                answer: false
                hints: ["Where are your listeners?"]
              - id: l1-s3
                type: multiple_choice
                text: "Lily's talk has 30 facts about bees. Her class gets bored. What should she change?"
                options: ["choose the most surprising facts and give examples", "add 20 more facts", "read faster so she finishes sooner"]
                answer: "choose the most surprising facts and give examples"
                hints: ["More facts is not more interesting."]
              - id: l1-s4
                type: speak
                text: "Say this sentence with a pause before the last part: \"The tallest tree in the world is ... taller than Big Ben.\""
                say: "Say the sentence with a pause where you see the dots. Then listen to an example."
                expected_text: "The tallest tree in the world is ... taller than Big Ben."
                hints: ["Stop for a moment, then say the surprising part."]
              - id: l1-s5
                type: sorting
                text: "Keeps listeners interested, or loses them?"
                say: "Does each one keep listeners interested, or lose them? Sort them."
                option_audio: false
                bins:
                  - { id: keeps, show: { text: "keeps them interested" }, say: "Keeps them interested." }
                  - { id: loses, show: { text: "loses them" }, say: "Loses them." }
                options:
                  - { text: "an example from everyday life", bin: keeps }
                  - { text: "talking with your back to the class", bin: loses }
                  - { text: "a question to start", bin: keeps }
                  - { text: "speaking too quietly to hear", bin: loses }
                hints: ["Can the listeners hear, see and picture it?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which start to a talk about the Moon is a hook?"
                options: ["If you stood on the Moon, you could jump six times higher than here.", "The Moon is round.", "My talk is about the Moon."]
                answer: "If you stood on the Moon, you could jump six times higher than here."
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "Is it true? Changing your pace, slower for the important parts, helps listeners follow."
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Which helps a listener picture how heavy an elephant is?"
                options: ["It weighs about as much as four cars.", "It weighs a lot.", "Elephants have trunks."]
                answer: "It weighs about as much as four cars."
                option_audio: false
              - id: l1-n4
                type: speak
                text: "Give a hook for a talk about your favourite food."
                say: "Give a hook for a talk about your favourite food. Then listen to an example."
                expected_text: "Have you ever smelled fresh bread straight from the oven?"
              - id: l1-n5
                type: multiple_choice
                text: "Ollie speaks so quietly that the back row cannot hear. What should he do?"
                options: ["speak up so the back row can hear", "speak faster", "turn to face the board"]
                answer: "speak up so the back row can hear"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is a hook for a talk about sharks?"
            options: ["Would you swim in water with a creature that has 300 teeth?", "Sharks are fish.", "This is my talk on sharks."]
            answer: "Would you swim in water with a creature that has 300 teeth?"
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Is it true? Looking at your audience helps keep them interested."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "What helps listeners picture a big number?"
            options: ["comparing it with something they know", "saying it twice as fast", "writing it on the back of your hand"]
            answer: "comparing it with something they know"
          - id: l1-c4
            type: sorting
            text: "Does each one keep listeners interested? Sort them."
            say: "Does each one keep listeners interested, or lose them? Sort them."
            option_audio: false
            bins:
              - { id: keeps, show: { text: "keeps them interested" }, say: "Keeps them interested." }
              - { id: loses, show: { text: "loses them" }, say: "Loses them." }
            options:
              - { text: "a funny example from school life", bin: keeps }
              - { text: "reading every word from the page", bin: loses }
              - { text: "changing your voice for a scary part", bin: keeps }
              - { text: "turning away from the audience", bin: loses }
          - id: l1-c5
            type: multiple_choice
            text: "Which start to a talk about chocolate is a hook?"
            options: ["What if I told you that cocoa beans were once used as money?", "Chocolate is a food.", "My talk is about chocolate."]
            answer: "What if I told you that cocoa beans were once used as money?"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Is it true? Giving an example your audience knows helps them picture a fact."
            say: "Is it true? Giving an example your audience knows helps them picture a fact."
            answer: true

  - n: 2
    title: { de: "Prüfen, ob alle folgen", en: Checking they are following }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which start to a talk about rainforests is a hook?"
            options: ["Imagine a place where it rains almost every single day.", "Rainforests are forests.", "Today I am talking about rainforests."]
            answer: "Imagine a place where it rains almost every single day."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? Reading a long list of facts from your notes keeps listeners interested."
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Signs a listener is lost:\nfrowning\nlooking away\nfidgeting\nwhispering to a friend"
            say: "Good speakers watch their listeners. A frown, eyes looking away, fidgeting or whispering can all mean someone is lost or bored. Silence does not always mean everyone understands."
          - text: "Does that make sense so far?\nHands up if you have ever seen frogspawn."
            say: "Check in with your audience. Ask a quick question, or ask them to put up a hand. Their answers tell you whether to go on or to explain again."
          - text: "Say it again in a new way:\nan example, a comparison, simpler words"
            say: "If listeners look confused, saying the same words louder does not help. Explain it in a new way: give an example, compare it with something they know, or use simpler words."
          - text: "So far: ...\nTo sum up: ..."
            say: "A quick recap helps too. So far, we have seen ... To sum up ... These phrases help listeners keep track."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Nobody asks a question during Zac's talk. What does that tell him?"
                options: ["not much; he should check in to find out", "that everyone understood every part", "that the talk was too short"]
                answer: "not much; he should check in to find out"
                feedback:
                  "that everyone understood every part": "Silence does not always mean everyone understood. Some listeners are lost but do not say so."
                hints:
                  - "Do people always say when they are lost?"
                  - "Some listeners stay quiet even when confused."
                  - "Not much; he should check in."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Following, or lost?"
                say: "Is the listener following, or lost? Sort the signs."
                option_audio: false
                bins:
                  - { id: following, show: { text: "following" }, say: "Following." }
                  - { id: lost, show: { text: "lost" }, say: "Lost." }
                options:
                  - { text: "nodding and smiling", bin: following }
                  - { text: "frowning and looking puzzled", bin: lost }
                  - { text: "asking a question about your point", bin: following }
                  - { text: "staring out of the window", bin: lost }
                hints:
                  - "What do faces and eyes tell you?"
                  - "A question about your point means they are listening."
                  - "Nodding and asking: following. Frowning and staring away: lost."
              - id: l2-f3
                type: multiple_choice
                text: "Which is a good check-in question in the middle of a talk?"
                options: ["Can anyone tell me what a predator is?", "Are you all asleep?", "Shall I stop now?"]
                answer: "Can anyone tell me what a predator is?"
                option_audio: false
                hints:
                  - "A check-in tests whether they followed your last point."
                  - "Ask about something you have just explained."
                  - "Can anyone tell me what a predator is?"
              - id: l2-f4
                type: multiple_choice
                text: "Rosa explains photosynthesis. Her friends look puzzled. What should she do?"
                options: ["explain it again with an example, like a plant making food from sunlight", "say exactly the same words again, more loudly", "skip to the end"]
                answer: "explain it again with an example, like a plant making food from sunlight"
                option_audio: false
                feedback:
                  "say exactly the same words again, more loudly": "Louder is not clearer. If the words did not work the first time, try a new way: an example or simpler words."
                hints:
                  - "Did the first explanation work?"
                  - "Try a different way of explaining."
                  - "Explain it again with an example."
              - id: l2-f5
                type: speak
                text: "Say a recap sentence after explaining what bees do. Start with: So far, ..."
                say: "Say a recap sentence after explaining what bees do. Begin with So far. Then listen to an example."
                expected_text: "So far, we have seen that bees collect nectar and help flowers make seeds."
                hints:
                  - "A recap gathers up the main points so far."
                  - "So far, we have seen that bees ..."
                  - "So far, we have seen that bees collect nectar and help flowers make seeds."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Is it true? If your listeners are quiet, they have all understood."
                answer: false
                hints: ["Some people stay quiet when they are lost."]
              - id: l2-s2
                type: multiple_choice
                text: "Which phrase helps listeners keep track near the end of a talk?"
                options: ["To sum up, ...", "Um, and also, ...", "Anyway, whatever, ..."]
                answer: "To sum up, ..."
                option_audio: false
                hints: ["Which one gathers the points together?"]
              - id: l2-s3
                type: sorting
                text: "Following, or lost?"
                say: "Is the listener following, or lost? Sort the signs."
                option_audio: false
                bins:
                  - { id: following, show: { text: "following" }, say: "Following." }
                  - { id: lost, show: { text: "lost" }, say: "Lost." }
                options:
                  - { text: "answering your check-in question", bin: following }
                  - { text: "whispering to a friend", bin: lost }
                  - { text: "looking at you and leaning forward", bin: following }
                  - { text: "fidgeting with a pencil", bin: lost }
                hints: ["Who is paying attention to you?"]
              - id: l2-s4
                type: multiple_choice
                text: "Max says, \"The river's mouth is where it meets the sea.\" His class looks confused. What could he say next?"
                options: ["It is the end of the river, where the water flows into the sea.", "THE RIVER'S MOUTH IS WHERE IT MEETS THE SEA.", "Never mind."]
                answer: "It is the end of the river, where the water flows into the sea."
                option_audio: false
                hints: ["Say it in a new way, in simpler words."]
              - id: l2-s5
                type: speak
                text: "Ask your audience a check-in question after explaining why leaves fall in autumn."
                say: "Ask your audience a check-in question after explaining why leaves fall in autumn. Then listen to an example."
                expected_text: "Can anyone tell me why trees drop their leaves in autumn?"
                hints: ["Ask them about what you have just said."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Halfway through her talk, Priya wants to know if her class is following. What should she do?"
                options: ["ask a quick question about what she has said", "carry on without stopping", "speak faster"]
                answer: "ask a quick question about what she has said"
              - id: l2-n2
                type: true_false
                text: "Is it true? A frown can mean a listener is lost."
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Which is a good check-in?"
                options: ["Hands up if you have ever seen a fossil.", "You do not need to listen to this bit.", "I will not take questions."]
                answer: "Hands up if you have ever seen a fossil."
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Ethan's listeners do not understand the word \"orbit\". What is the best next step?"
                options: ["compare it to running round a track, again and again", "repeat orbit more loudly", "leave the word out of the rest of the talk"]
                answer: "compare it to running round a track, again and again"
              - id: l2-n5
                type: speak
                text: "Sum up a talk about why we should recycle in one sentence. Start with: To sum up, ..."
                say: "Sum up a talk about why we should recycle in one sentence. Begin with To sum up. Then listen to an example."
                expected_text: "To sum up, recycling saves energy and keeps rubbish out of the sea."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: hook
            type: multiple_choice
            text: "Which is the best start for a talk about owls?"
            options: ["Did you know an owl can turn its head almost all the way round?", "Owls. Fact one: feathers. Fact two: beaks.", "Um, I am doing owls."]
            answer: "Did you know an owl can turn its head almost all the way round?"
            option_audio: false
          - id: l2-c2
            part: voice
            type: true_false
            text: "Is it true? Speaking in the same flat voice all the way through keeps listeners interested."
            answer: false
          - id: l2-c3
            part: check-in
            type: multiple_choice
            text: "Nobody says anything after Noah's explanation. What should he do?"
            options: ["check in with a quick question", "decide everyone understood", "move on to the next talk"]
            answer: "check in with a quick question"
          - id: l2-c4
            part: new-way
            type: multiple_choice
            text: "Grace's listeners look puzzled when she explains a food chain. What should she do?"
            options: ["give an example, like grass, then a rabbit, then a fox", "say the same sentence louder", "stop talking"]
            answer: "give an example, like grass, then a rabbit, then a fox"
          - id: l2-c5
            part: signs
            type: multiple_choice
            text: "Which is a sign that a listener is following?"
            options: ["they ask a question about your point", "they stare out of the window", "they whisper to a friend"]
            answer: "they ask a question about your point"
          - id: l2-c6
            part: hook
            type: multiple_choice
            text: "Which hook would make Year 5 want to hear a talk about the Titanic?"
            options: ["Imagine stepping onto the biggest ship in the world, sure that it could never sink.", "The Titanic was a ship.", "I am going to talk about the Titanic now."]
            answer: "Imagine stepping onto the biggest ship in the world, sure that it could never sink."
            option_audio: false
          - id: l2-c7
            part: hook
            type: true_false
            text: "\"My talk is about trees.\"\n\nIs it true? This is a good hook."
            say: "Read the start of the talk. Is it true? This is a good hook."
            answer: false
          - id: l2-c8
            part: hook
            type: sorting
            text: "Hook or not a hook? Sort the openings."
            say: "Is each opening a hook, or not a hook? Sort them."
            option_audio: false
            bins:
              - { id: hook, show: { text: "a hook" }, say: "A hook." }
              - { id: not, show: { text: "not a hook" }, say: "Not a hook." }
            options:
              - { text: "Have you ever wondered why the sky is blue?", bin: hook }
              - { text: "Today I will talk about the sky.", bin: not }
              - { text: "What would happen if the Sun went out?", bin: hook }
              - { text: "This talk is about the Sun.", bin: not }
          - id: l2-c9
            part: voice
            type: multiple_choice
            text: "Ava is giving her talk in a big hall. What should she do with her voice?"
            options: ["speak loudly and clearly so the back can hear", "whisper so it sounds mysterious", "speak as fast as she can"]
            answer: "speak loudly and clearly so the back can hear"
          - id: l2-c10
            part: voice
            type: multiple_choice
            text: "Where in a talk is the best place to slow down?"
            options: ["at the most important fact", "at the title", "at the thank you at the end"]
            answer: "at the most important fact"
          - id: l2-c11
            part: voice
            type: multiple_choice
            text: "Mia says a blue whale is about 30 metres long. What could she add so her class can picture it?"
            options: ["That is about as long as three buses in a row.", "That is a long way.", "Blue whales eat krill."]
            answer: "That is about as long as three buses in a row."
            option_audio: false
          - id: l2-c12
            part: signs
            type: sorting
            text: "Which signs show a listener is following, and which show they are lost?"
            say: "Is the listener following, or lost? Sort the signs."
            option_audio: false
            bins:
              - { id: following, show: { text: "following" }, say: "Following." }
              - { id: lost, show: { text: "lost" }, say: "Lost." }
            options:
              - { text: "nodding along", bin: following }
              - { text: "yawning and slumping", bin: lost }
              - { text: "answering your question correctly", bin: following }
              - { text: "playing with a rubber", bin: lost }
          - id: l2-c13
            part: signs
            type: multiple_choice
            text: "Which of these could mean a listener is bored?"
            options: ["looking at the clock again and again", "laughing at your joke", "writing down your key words"]
            answer: "looking at the clock again and again"
          - id: l2-c14
            part: signs
            type: multiple_choice
            text: "Halfway through Ben's talk, two children start whispering and the rest look out of the window. What does this tell Ben?"
            options: ["He may be losing his audience.", "Everyone is following.", "The talk is going perfectly."]
            answer: "He may be losing his audience."
            option_audio: false
          - id: l2-c15
            part: check-in
            type: multiple_choice
            text: "Which question checks that listeners understood what a habitat is?"
            options: ["Can someone tell me in their own words what a habitat is?", "Is everyone OK?", "Shall we have lunch?"]
