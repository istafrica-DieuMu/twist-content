# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.fluent-speed
skill: lit-en.handwriting.fluent-speed
curriculum: en-GB
language: en
title:
  de: Flüssig und zügig schreiben
  en: Writing fluently and at speed
summary: >
  Children choose how to write for the job in hand. Lesson 1 takes when
  to join and when not to: lower-case letters in a word join, capital
  letters stand alone, and printed letters suit labels, forms and email
  addresses. Lesson 2 takes speed and tools: quick but legible notes,
  a best copy for display, and the right pen or pencil for the task; it
  ends with the skill check. Writing-lines tasks use `script: joined`,
  so the model follows the school's scheme. The app does not yet time or
  judge the child's own writing (any ink counts), so the skill check uses
  choice tasks.
metadata:
  year: year-5
  topic: { de: Handschrift, en: Handwriting }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.handwriting.joined-legible]
  also_practises: [lit-en.handwriting.joined-legible]
  vocabulary: { en: [legible, fluent, speed, join, unjoined, print, capital letter, best copy, notes, fine pen, pencil, felt tip] }
  forms: [drawn, text, audio]
  drawn: [writing-lines, letter-card]
  facets: [script]
  misconceptions:
    - id: join-everything
      what: Joins capital letters to the next letter and joins letters on forms and labels, where print is clearer
      addressed: Learn screens 2 and 3 of lesson 1; l1-f2 (feedback), l1-f4, l1-s2, l1-n2, l2-c1
    - id: fast-means-messy
      what: Thinks fast writing may be messy because only neat writing has to be read
      addressed: Learn screen 1 of lesson 2; l2-f1 (feedback), l2-s1, l2-n1, l2-c2
    - id: any-pen-will-do
      what: Uses the same pen for everything, such as a thick felt tip for a small labelled diagram
      addressed: Learn screen 3 of lesson 2; l2-f3 (feedback), l2-s3, l2-n3, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Verbinden oder nicht, en: To join or not to join }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "In neat writing, how tall is the letter e?"
            options: ["the same height as a, o and n", "as tall as h and k", "below the line, like y"]
            answer: "the same height as a, o and n"
            difficulty: easy
          - id: l1-w2
            type: tracing
            text: "Trace the word."
            say: "Trace little. Keep the tall letters the same height."
            show: { drawn: writing-lines, text: "little", mode: trace, arrows: true, script: joined }
            char: "little"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Fluent writing flows.\nLegible writing is easy to read."
            say: "In Year 5 your writing should be fluent, which means it flows without stopping after every letter, and legible, which means anyone can read it. Joining the letters inside a word helps it flow."
            show: { drawn: writing-lines, text: "garden", mode: trace, arrows: false, script: joined }
          - text: "Capital letters do not join.\nLondon  Mrs Patel"
            say: "Capital letters stand on their own. Write the capital, lift your pen, then join the rest of the word."
          - text: "Print for:\nlabels on a diagram\nforms\nemail addresses and postcodes"
            say: "Sometimes printed letters are better than joined ones. Labels on a diagram, boxes on a form, an email address or a postcode must be read letter by letter, so we print them, often in capital letters."
          - text: "Join to write fast.\nPrint to be read letter by letter."
            say: "So the choice depends on the job. Join for stories, notes and letters. Print when each letter must be clear on its own."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Why do we join the letters inside a word?"
                options: ["so the writing flows and is quicker", "so it looks like a capital letter", "so nobody can read it"]
                answer: "so the writing flows and is quicker"
                hints:
                  - "Think about lifting your pen after every letter."
                  - "Lifting the pen slows you down."
                  - "So the writing flows and is quicker."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How do you write the word Monday in joined writing?"
                options: ["capital M on its own, then join o n d a y", "join the M to the o", "print every letter separately"]
                answer: "capital M on its own, then join o n d a y"
                feedback:
                  "join the M to the o": "Capital letters do not join. Write the M, lift your pen, then join the rest."
                hints:
                  - "Is the M a capital letter?"
                  - "Capitals stand on their own."
                  - "Capital M on its own, then join the rest."
              - id: l1-f3
                type: tracing
                text: "Trace the name."
                say: "Trace Leeds. The capital L stands alone, then the other letters join."
                show: { drawn: writing-lines, text: "Leeds", mode: trace, arrows: true, script: joined }
                char: "Leeds"
              - id: l1-f4
                type: sorting
                text: "Join or print?"
                say: "Should you write each one joined or printed? Put it in the right group."
                option_audio: false
                bins:
                  - { id: join, show: { text: "joined" }, say: "Joined." }
                  - { id: print, show: { text: "printed" }, say: "Printed." }
                options:
                  - { text: "a story in your book", bin: join }
                  - { text: "a label on a science diagram", bin: print }
                  - { text: "a thank-you letter", bin: join }
                  - { text: "your postcode on a form", bin: print }
                hints:
                  - "Which ones must be read letter by letter?"
                  - "Labels and forms need clear single letters."
                  - "Story and letter: joined. Label and postcode: printed."
              - id: l1-f5
                type: true_false
                text: "Is it true? An email address is best printed, letter by letter."
                answer: true
                hints:
                  - "What happens if one letter of an email address is wrong?"
                  - "The email does not arrive, so each letter must be clear."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: tracing
                text: "Trace the words."
                say: "Trace quick notes. Join inside each word and leave a gap between the words."
                show: { drawn: writing-lines, text: "quick notes", mode: trace, arrows: true, script: joined }
                char: "quick notes"
              - id: l1-s2
                type: multiple_choice
                text: "Which part of the word Africa stays unjoined?"
                options: ["the A", "the f", "the c"]
                answer: "the A"
                option_audio: false
                hints: ["Look for the capital letter."]
              - id: l1-s3
                type: sorting
                text: "Join or print?"
                say: "Should you write each one joined or printed? Put it in the right group."
                option_audio: false
                bins:
                  - { id: join, show: { text: "joined" }, say: "Joined." }
                  - { id: print, show: { text: "printed" }, say: "Printed." }
                options:
                  - { text: "a diary entry", bin: join }
                  - { text: "your name in the boxes of a form", bin: print }
                  - { text: "notes in a history lesson", bin: join }
                  - { text: "the labels on a map", bin: print }
                hints: ["Forms and labels are read letter by letter."]
              - id: l1-s4
                type: true_false
                text: "Is it true? In joined writing, every capital letter joins to the next letter."
                answer: false
                hints: ["Think of how you write London."]
              - id: l1-s5
                type: multiple_choice
                text: "A form says: WRITE IN BLOCK CAPITALS. What should you do?"
                options: ["print each letter as a capital", "use joined writing", "write in small letters"]
                answer: "print each letter as a capital"
                hints: ["Block capitals are printed capital letters."]

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Copy the name."
                say: "Copy Wales. The capital stands alone, the rest joins."
                show: { drawn: writing-lines, text: "Wales", mode: copy, arrows: false, script: joined }
                char: "Wales"
              - id: l1-n2
                type: multiple_choice
                text: "Ben labels the parts of a flower in his science book. How should he write the labels?"
                options: ["printed, so each letter is clear", "joined, as fast as he can", "in tiny joined letters"]
                answer: "printed, so each letter is clear"
              - id: l1-n3
                type: true_false
                text: "Is it true? A story in your English book is usually written in joined writing."
                answer: true
              - id: l1-n4
                type: highlight_in_text
                text: "Tap every word that starts with a letter you do not join."
                say: "Tap every word that starts with a capital letter. You do not join a capital."
                show: { drawn: letter-card, text: "On Friday we went to see Gran in York" }
                spans: ["On", "Friday", "Gran", "York"]
              - id: l1-n5
                type: multiple_choice
                text: "Which should you print, not join?"
                options: ["the postcode on an envelope", "a poem in your best book", "a list of ideas for a story"]
                answer: "the postcode on an envelope"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How do you write Tuesday in joined writing?"
            options: ["capital T on its own, then join u e s d a y", "join the T to the u", "print every letter"]
            answer: "capital T on its own, then join u e s d a y"
          - id: l1-c2
            type: true_false
            text: "Is it true? The labels on a diagram should be printed."
            answer: true
          - id: l1-c3
            type: tracing
            text: "Copy the words."
            say: "Copy best work. Join inside each word."
            show: { drawn: writing-lines, text: "best work", mode: copy, arrows: false, script: joined }
            char: "best work"

  - n: 2
    title: { de: Tempo und Stift wählen, en: Speed and the right pen }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which should you print, not join?"
            options: ["the labels on a map", "a letter to your gran", "a diary entry"]
            answer: "the labels on a map"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? You join a capital letter to the next letter."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Fast writing must still be legible."
            say: "When you write fast, your writing still has to be read, by you or by someone else. Notes you cannot read later are no use. Write quickly, but keep the letters clear."
          - text: "Notes: fast and legible.\nBest copy: neat and careful.\nForms and labels: printed."
            say: "Different jobs need different writing. Notes in a lesson or a dictation need speed. A best copy for a display needs your neatest writing, even if it takes longer. Forms and labels need print."
          - text: "pencil: maths, diagrams, drafts\nhandwriting pen: best copy\nfine pen: small labels\nfelt tip: big poster titles"
            say: "Choose the tool too. A pencil is good for maths, diagrams and drafts, because you can rub it out. A handwriting pen gives a smooth best copy. A fine pen suits small labels. A thick felt tip is for big titles on a poster, never for small writing."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Aisha writes notes while her teacher talks. How should she write?"
                options: ["quickly, but clearly enough to read later", "slowly, in her very best writing", "as fast as possible, even if it is messy"]
                answer: "quickly, but clearly enough to read later"
                feedback:
                  "as fast as possible, even if it is messy": "Notes you cannot read later are no use. Fast writing must still be legible."
                hints:
                  - "What will Aisha do with her notes later?"
                  - "She will read them again, so they must be clear."
                  - "Quickly, but clearly enough to read later."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Fast and legible, or neat best copy?"
                say: "Does each job need fast, legible writing or your neatest best copy? Sort them."
                option_audio: false
                bins:
                  - { id: fast, show: { text: "fast and legible" }, say: "Fast and legible." }
                  - { id: best, show: { text: "neat best copy" }, say: "Neat best copy." }
                options:
                  - { text: "notes during a talk", bin: fast }
                  - { text: "a poem for the class display", bin: best }
                  - { text: "a spelling dictation", bin: fast }
                  - { text: "a card for a friend's birthday", bin: best }
                hints:
                  - "Which jobs have little time?"
                  - "Displays and cards are read by others and kept."
                  - "Notes and dictation: fast. Poem and card: best copy."
              - id: l2-f3
                type: multiple_choice
                text: "Sam labels a small diagram of the heart. Which tool should he use?"
                options: ["a fine pen or a sharp pencil", "a thick felt tip", "a paintbrush"]
                answer: "a fine pen or a sharp pencil"
                feedback:
                  "a thick felt tip": "A thick felt tip makes big letters that will not fit on small labels. Save it for poster titles."
                hints:
                  - "The labels are small."
                  - "You need a tool with a thin point."
                  - "A fine pen or a sharp pencil."
              - id: l2-f4
                type: tracing
                text: "Copy the phrase quickly but clearly."
                say: "Copy the phrase. Keep a steady speed and keep it legible."
                show: { drawn: writing-lines, text: "the river floods", mode: copy, arrows: false, script: joined }
                char: "the river floods"
              - id: l2-f5
                type: true_false
                text: "Is it true? A pencil is a good choice for a maths diagram."
                answer: true
                hints:
                  - "What might you need to do if a line is wrong?"
                  - "You can rub out pencil."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Is it true? Quick notes can be messy because nobody needs to read them."
                answer: false
                hints: ["Who reads your notes later?"]
              - id: l2-s2
                type: multiple_choice
                text: "Your class makes a poster for the school fair. Which tool suits the big title?"
                options: ["a thick felt tip", "a fine pen", "a pencil"]
                answer: "a thick felt tip"
                hints: ["The title must be read from across the hall."]
              - id: l2-s3
                type: multiple_choice
                text: "Which job needs your neatest, careful writing?"
                options: ["a story copied out for the school magazine", "a shopping list", "notes in a science lesson"]
                answer: "a story copied out for the school magazine"
                hints: ["Which one will lots of people read?"]
              - id: l2-s4
                type: tracing
                text: "Copy the words."
                say: "Copy steady speed. Join inside each word."
                show: { drawn: writing-lines, text: "steady speed", mode: copy, arrows: false, script: joined }
                char: "steady speed"
              - id: l2-s5
                type: sorting
                text: "Which tool for each job?"
                say: "Which tool suits each job? Sort them."
                option_audio: false
                bins:
                  - { id: pencil, show: { text: "pencil" }, say: "Pencil." }
                  - { id: pen, show: { text: "handwriting pen" }, say: "Handwriting pen." }
                options:
                  - { text: "a first draft you will change", bin: pencil }
                  - { text: "the best copy of your letter", bin: pen }
                  - { text: "a graph in maths", bin: pencil }
                  - { text: "a final copy of your poem", bin: pen }
                hints: ["You may need to rub out drafts and graphs."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Leo writes so fast in a dictation that he cannot read his words afterwards. What should he do?"
                options: ["slow down a little so every word is legible", "write even faster", "print every letter in capitals"]
                answer: "slow down a little so every word is legible"
              - id: l2-n2
                type: true_false
                text: "Is it true? You should use the same pen for every writing job."
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Mia fills in the small boxes on a library form. What should she use?"
                options: ["a pen, printing one letter in each box", "a thick felt tip in joined writing", "a crayon"]
                answer: "a pen, printing one letter in each box"
              - id: l2-n4
                type: tracing
                text: "Copy the sentence."
                say: "Copy the sentence. The capital stands alone, the rest joins."
                show: { drawn: writing-lines, text: "Owls hunt at night.", mode: copy, arrows: false, script: joined }
                char: "Owls hunt at night."
              - id: l2-n5
                type: sorting
                text: "How should each be written?"
                say: "Should each be quick notes, a neat best copy or printed? Sort them."
                option_audio: false
                bins:
                  - { id: fast, show: { text: "quick notes" }, say: "Quick notes." }
                  - { id: best, show: { text: "neat best copy" }, say: "Neat best copy." }
                  - { id: print, show: { text: "printed" }, say: "Printed." }
                options:
                  - { text: "ideas from a class discussion", bin: fast }
                  - { text: "a letter to the head teacher", bin: best }
                  - { text: "your email address on a sign-up sheet", bin: print }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "How do you write the word Scotland in joined writing?"
            options: ["capital S on its own, then join c o t l a n d", "join the S to the c", "print every letter"]
            answer: "capital S on its own, then join c o t l a n d"
          - id: l2-c2
            type: multiple_choice
            text: "Ella writes notes from a video about volcanoes. How should she write?"
            options: ["quickly, but clearly enough to read later", "in tiny letters so they fit", "very slowly in her best copy"]
            answer: "quickly, but clearly enough to read later"
          - id: l2-c3
            type: true_false
            text: "Is it true? A quick shopping list needs your neatest best copy."
            answer: false
          - id: l2-c4
            type: multiple_choice
            text: "Which tool suits writing the labels on a small diagram of a plant?"
            options: ["a fine pen", "a thick felt tip", "a paint roller"]
            answer: "a fine pen"
          - id: l2-c5
            type: multiple_choice
            text: "Which job needs your neatest best copy?"
            options: ["a poem for the hall display", "notes in a lesson", "a list of ideas"]
            answer: "a poem for the hall display"
