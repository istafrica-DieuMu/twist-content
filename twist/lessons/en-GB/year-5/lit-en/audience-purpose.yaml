# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.audience-purpose
skill: lit-en.composition.audience-purpose
curriculum: en-GB
language: en
title:
  de: Passend für Leser und Zweck schreiben
  en: Writing for audience and purpose
summary: >
  Children choose form, tone and language to fit who will read a text
  and why it is written. Lesson 1 takes purpose and form: to instruct,
  inform, persuade or entertain, and the form that does each job
  (instructions, a report, a letter or leaflet, a story). Lesson 2 takes
  audience and tone: formal language for a head teacher, a council or a
  stranger, informal language for a friend, and the features that mark
  each; it ends with the skill check. Free writing is not marked, so
  children choose, sort and improve sentences.
metadata:
  year: year-5
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.composition.learn-from-models]
  also_practises: [lit-en.composition.learn-from-models]
  vocabulary: { en: [audience, purpose, form, tone, formal, informal, instruct, inform, persuade, entertain, contraction, imperative verb] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: purpose, what: { de: "den Zweck eines Textes nennen (anleiten, informieren, überzeugen, unterhalten)", en: "naming the purpose of a text (instruct, inform, persuade, entertain)" } }
    - { id: form, what: { de: "die Textform wählen, die zu Zweck und Leser passt", en: choosing the form that fits the purpose and the reader } }
    - { id: tone, what: { de: "formell oder informell: den Ton für den Leser wählen", en: "formal or informal: choosing the tone for the reader" } }
    - { id: clear-words, what: { de: "Wörter wählen, die der Leser versteht", en: choosing words the reader will understand } }
  misconceptions:
    - id: one-style-fits-all
      what: Writes in the same chatty style whoever the reader is
      addressed: Learn screens 1 and 2 of lesson 2; l2-f1 (feedback), l2-f2, l2-s1, l2-n1, l2-c3
    - id: formal-means-long-words
      what: Thinks formal writing means using the longest words possible, even when they make the text unclear
      addressed: Learn screen 3 of lesson 2; l2-f4 (feedback), l2-s4, l2-n4
    - id: form-ignores-purpose
      what: Picks a form that does not do the job, such as a story to explain how to set up a tent
      addressed: Learn of lesson 1; l1-f1 (feedback), l1-f2, l1-s1, l1-n1, l2-c1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Zweck und Textform, en: Purpose and form }
    goal:
      de: "Frag dich, warum du schreibst, und wähle die passende Textform, zum Beispiel einen Brief, wenn du jemanden überzeugen willst."
      en: "Ask yourself why you are writing, then pick the form that does the job, like a letter to persuade the council."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "You are going to write instructions. Which model text is most useful to read first?"
            options: ["a recipe for pancakes", "a fairy tale", "a poem about the sea"]
            answer: "a recipe for pancakes"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which feature do good instructions usually have?"
            options: ["numbered steps", "a villain", "rhyming lines"]
            answer: "numbered steps"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Purpose: why you write.\nto instruct  to inform  to persuade  to entertain"
            say: "Before you write, ask two questions. First: what is my purpose? Do I want to instruct, which means tell someone how to do something, inform, persuade or entertain?"
          - text: "Audience: who will read it."
            say: "Second: who is my audience? A friend, a younger child, a head teacher, a newspaper? The answers decide the form, the tone and the words."
          - text: "instruct → instructions, a recipe\ninform → a report, a fact file\npersuade → a letter, a leaflet, an advert\nentertain → a story, a poem, a play"
            say: "Each purpose has forms that do the job well. Instructions instruct. A report informs. A letter or a leaflet can persuade. A story or a poem entertains."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "You want to tell a new pupil how to get from the gate to Class 5. Which form fits best?"
                options: ["numbered directions", "a story about a dragon", "a poem about school"]
                answer: "numbered directions"
                feedback:
                  "a story about a dragon": "A story entertains, but the pupil needs to know the way. Your purpose is to instruct, so directions work best."
                hints:
                  - "What is your purpose: to instruct or to entertain?"
                  - "The pupil needs steps to follow."
                  - "Numbered directions."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Match each purpose to a form that does the job."
                say: "Match each purpose to a form that does the job."
                option_audio: false
                pairs:
                  - { left: { text: "to instruct" }, right: { text: "a recipe" } }
                  - { left: { text: "to inform" }, right: { text: "a report on owls" } }
                  - { left: { text: "to persuade" }, right: { text: "a leaflet to save the park" } }
                  - { left: { text: "to entertain" }, right: { text: "a funny poem" } }
                hints:
                  - "Ask what each text wants the reader to do."
                  - "A recipe tells you how; a leaflet tries to change your mind."
                  - "Instruct: the recipe. Inform: the report. Persuade: the leaflet. Entertain: the poem."
              - id: l1-f3
                type: multiple_choice
                text: "\"Ten reasons why our school needs a new library!\"\n\nWhat is the purpose of this text?"
                options: ["to persuade", "to instruct", "to entertain"]
                answer: "to persuade"
                hints:
                  - "What does the writer want the reader to agree with?"
                  - "Reasons are used to change someone's mind."
                  - "To persuade."
              - id: l1-f4
                type: multiple_choice
                text: "You write a book review for children in Year 2. Who is your audience?"
                options: ["children in Year 2", "your teacher only", "a newspaper editor"]
                answer: "children in Year 2"
                hints:
                  - "Who is going to read it?"
                  - "The review is written for them."
                  - "Children in Year 2."
              - id: l1-f5
                type: true_false
                text: "Is it true? A fact file about tigers is written to inform."
                answer: true
                hints:
                  - "What does a fact file give the reader?"
                  - "It gives facts and information."
                  - "Yes, it is true."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "You want the council to fix the swings in the park. Which form fits best?"
                options: ["a letter to the council", "a poem about swings", "a diary entry"]
                answer: "a letter to the council"
                hints: ["You want to persuade a particular reader."]
              - id: l1-s2
                type: multiple_choice
                text: "\"First, fill the pot with soil. Next, press the seed in.\"\n\nWhat is the purpose of this text?"
                options: ["to instruct", "to persuade", "to entertain"]
                answer: "to instruct"
                hints: ["Does it tell you how to do something?"]
              - id: l1-s3
                type: sorting
                text: "Which purpose does each text have?"
                say: "Does each text inform or entertain? Sort them."
                option_audio: false
                bins:
                  - { id: inform, show: { text: "to inform" }, say: "To inform." }
                  - { id: entertain, show: { text: "to entertain" }, say: "To entertain." }
                options:
                  - { text: "a report on the water cycle", bin: inform }
                  - { text: "a ghost story", bin: entertain }
                  - { text: "a news article about a flood", bin: inform }
                  - { text: "a limerick about a cat", bin: entertain }
                hints: ["Facts inform; stories and funny poems entertain."]
              - id: l1-s4
                type: true_false
                text: "Is it true? A diary entry is the best form for telling a stranger how to bake a cake."
                answer: false
                hints: ["Which form gives steps to follow?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which two questions should you ask before you write?"
                options: ["Why am I writing, and who will read it?", "How long is it, and what colour is the paper?", "Is it Monday, and is it raining?"]
                answer: "Why am I writing, and who will read it?"
                option_audio: false
                hints: ["Purpose and audience."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "You want to explain to Year 3 how a volcano erupts. Which form fits best?"
                options: ["an explanation with a labelled diagram", "a shopping list", "a birthday card"]
                answer: "an explanation with a labelled diagram"
              - id: l1-n2
                type: multiple_choice
                text: "\"Visit Seaview Farm! Feed the lambs and ride the tractor. You'll love it!\"\n\nWhat is the purpose of this text?"
                options: ["to persuade", "to instruct", "to inform only"]
                answer: "to persuade"
              - id: l1-n3
                type: multiple_choice
                text: "You write a play for the school assembly. What is your main purpose?"
                options: ["to entertain", "to instruct", "to complain"]
                answer: "to entertain"
              - id: l1-n4
                type: true_false
                text: "Is it true? Knowing your audience can change the words you choose."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "You write a letter to your local newspaper about litter. Who is your audience?"
                options: ["people who read the newspaper", "your best friend", "your class teacher only"]
                answer: "people who read the newspaper"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "You want to tell someone how to play a board game. Which form fits best?"
            options: ["a set of rules with steps", "a poem", "a postcard"]
            answer: "a set of rules with steps"
          - id: l1-c2
            type: multiple_choice
            text: "\"Hedgehogs are mammals. They eat beetles and worms.\"\n\nWhat is the purpose of this text?"
            options: ["to inform", "to persuade", "to entertain"]
            answer: "to inform"
          - id: l1-c3
            type: true_false
            text: "Is it true? A leaflet can be used to persuade."
            answer: true
          - id: l1-c4
            type: sorting
            text: "Instruct or persuade? Sort the texts."
            say: "Is each text written to instruct or to persuade? Sort them."
            option_audio: false
            bins:
              - { id: instruct, show: { text: "to instruct" }, say: "To instruct." }
              - { id: persuade, show: { text: "to persuade" }, say: "To persuade." }
            options:
              - { text: "a recipe for flapjacks", bin: instruct }
              - { text: "an advert for a new toy", bin: persuade }
              - { text: "how to make a paper plane", bin: instruct }
              - { text: "a poster asking people to recycle", bin: persuade }
          - id: l1-c5
            type: multiple_choice
            text: "Which form would entertain a Reception class at story time?"
            options: ["a picture book story", "a newspaper report", "a list of school rules"]
            answer: "a picture book story"
          - id: l1-c6
            type: true_false
            text: "Is it true? A recipe is written to entertain."
            say: "Is it true? A recipe is written to entertain."
            answer: false

  - n: 2
    title: { de: Leser und Ton, en: Audience and tone }
    goal:
      de: "Denk daran, wer deinen Text liest, und wähle den passenden Ton: förmlich für die Schulleiterin, locker für deinen Freund."
      en: "Think about who will read your writing and choose the right tone, formal for a head teacher and chatty for a friend."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"Join our club! You'll make friends and have loads of fun.\"\n\nWhat is the purpose of this text?"
            options: ["to persuade", "to instruct", "to inform only"]
            answer: "to persuade"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "You want to explain how to plant a sunflower. Which form fits best?"
            options: ["instructions", "a fairy tale", "a diary"]
            answer: "instructions"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Dear Mrs Okafor,\nI am writing to ask whether our class could visit the science museum.\nYours sincerely,\nLeo"
            say: "This letter is to a head teacher, so the tone is formal: polite, with full words and no slang. Formal writing uses I am, not I'm, and ends Yours sincerely."
          - text: "Hi Sam!\nGuess what? We're going to the science museum! Can't wait!\nSee you soon,\nLeo"
            say: "This message is to a friend, so the tone is informal. It is chatty, with contractions like we're and can't, and exclamation marks."
          - text: "formal: clear, polite, no slang\nnot: the longest words you can find"
            say: "Formal does not mean using the longest words you know. It means clear, polite and correct. Choose words your reader will understand."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which opening fits a letter to the council?"
                options: ["Dear Councillor Jones, I am writing about the broken lights in Mill Lane.", "Hiya! The lights are rubbish, sort it out!", "Yo, guess what, the lights are broken lol."]
                answer: "Dear Councillor Jones, I am writing about the broken lights in Mill Lane."
                option_audio: false
                feedback:
                  "Hiya! The lights are rubbish, sort it out!": "That is how you might talk to a friend. A councillor is a stranger in charge, so the tone should be formal and polite."
                hints:
                  - "Who is the audience?"
                  - "A councillor needs a polite, formal tone."
                  - "Dear Councillor Jones, I am writing about ..."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Formal or informal?"
                say: "Is each sentence formal or informal? Sort them."
                option_audio: false
                bins:
                  - { id: formal, show: { text: "formal" }, say: "Formal." }
                  - { id: informal, show: { text: "informal" }, say: "Informal." }
                options:
                  - { text: "I would be grateful for your help.", bin: formal }
                  - { text: "Can't wait to see you!", bin: informal }
                  - { text: "Thank you for your kind reply.", bin: formal }
                  - { text: "That film was awesome, mate!", bin: informal }
                hints:
                  - "Look for contractions and slang."
                  - "Can't and mate are chatty."
                  - "Grateful and kind reply: formal. Can't wait and awesome, mate: informal."
              - id: l2-f3
                type: highlight_in_text
                text: "Leo wants to send this to the head teacher. Tap the words that make it too informal."
                say: "Leo wants to send this to the head teacher. Tap the words that make it too informal."
                show: { drawn: letter-card, text: "We're dead keen to go on the trip" }
                spans: ["We're", "dead", "keen"]
                hints:
                  - "Look for a contraction and slang."
                  - "We're is a contraction; dead keen is slang."
                  - "We're, dead and keen."
              - id: l2-f4
                type: multiple_choice
                text: "Which sentence is formal and clear for a letter to a museum?"
                options: ["Could you tell us your opening times, please?", "Might one enquire as to the temporal parameters of your establishment?", "When r u open?"]
                answer: "Could you tell us your opening times, please?"
                option_audio: false
                feedback:
                  "Might one enquire as to the temporal parameters of your establishment?": "Very long words make it hard to understand. Formal means polite and clear."
                hints:
                  - "Formal means polite and clear."
                  - "One option is so wordy it is hard to follow."
                  - "Could you tell us your opening times, please?"
              - id: l2-f5
                type: multiple_choice
                text: "Which ending fits a formal letter that starts \"Dear Mr Patel\"?"
                options: ["Yours sincerely,", "Love from,", "See ya,"]
                answer: "Yours sincerely,"
                option_audio: false
                hints:
                  - "Which one is polite and formal?"
                  - "You know his name, so use sincerely."
                  - "Yours sincerely."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which sentence fits a message to your best friend?"
                options: ["Fancy coming to the park on Saturday?", "I would like to invite you to attend the park.", "I am writing to inform you of a visit."]
                answer: "Fancy coming to the park on Saturday?"
                option_audio: false
                hints: ["A friend gets a chatty, informal tone."]
              - id: l2-s2
                type: sorting
                text: "Formal or informal?"
                say: "Is each sentence formal or informal? Sort them."
                option_audio: false
                bins:
                  - { id: formal, show: { text: "formal" }, say: "Formal." }
                  - { id: informal, show: { text: "informal" }, say: "Informal." }
                options:
                  - { text: "We look forward to hearing from you.", bin: formal }
                  - { text: "Gotta go, bye!", bin: informal }
                  - { text: "Please find our questions below.", bin: formal }
                  - { text: "You'll never guess what happened!", bin: informal }
                hints: ["Contractions and slang are informal."]
              - id: l2-s3
                type: highlight_in_text
                text: "This is for a report to the governors. Tap the words that make it too informal."
                say: "This is for a report to the governors. Tap the words that make it too informal."
                show: { drawn: letter-card, text: "The new playground is totally brill" }
                spans: ["totally", "brill"]
                hints: ["Two slang words."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence would Year 2 children understand best in a fact file about frogs?"
                options: ["Frogs lay their eggs in ponds.", "Frogs deposit spawn in aquatic habitats.", "Frog eggs, ponds, yes."]
                answer: "Frogs lay their eggs in ponds."
                option_audio: false
                hints: ["Clear words for young readers."]
              - id: l2-s5
                type: true_false
                text: "Is it true? A letter to a head teacher should use slang to sound friendly."
                answer: false
                hints: ["What tone fits a head teacher?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which sentence fits a letter to a famous author asking her to visit your school?"
                options: ["We would be delighted if you could visit our school.", "Come to our school, it'll be epic!", "U should visit us."]
                answer: "We would be delighted if you could visit our school."
                option_audio: false
              - id: l2-n2
                type: highlight_in_text
                text: "This is for a letter to the mayor. Tap the words that make it too informal."
                say: "This is for a letter to the mayor. Tap the words that make it too informal."
                show: { drawn: letter-card, text: "The park is well dodgy at night" }
                spans: ["well", "dodgy"]
              - id: l2-n3
                type: multiple_choice
                text: "Which ending fits a postcard to your cousin?"
                options: ["Lots of love,", "Yours faithfully,", "Yours sincerely,"]
                answer: "Lots of love,"
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence suits a report about the school trip for parents?"
                options: ["On Tuesday, Year 5 visited the castle and learnt about knights.", "On Tuesday, Year 5 perambulated to the fortification for edification.", "Castle trip, was ok."]
                answer: "On Tuesday, Year 5 visited the castle and learnt about knights."
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? Contractions such as can't and we're are more common in informal writing."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: form
            type: multiple_choice
            text: "You want to tell younger children how to wash their hands properly. Which form fits best?"
            options: ["short numbered steps with pictures", "a long formal letter", "a mystery story"]
            answer: "short numbered steps with pictures"
          - id: l2-c2
            part: purpose
            type: multiple_choice
            text: "\"Save our library! Without it, children will have nowhere to read.\"\n\nWhat is the purpose of this text?"
            options: ["to persuade", "to instruct", "to entertain"]
            answer: "to persuade"
          - id: l2-c3
            part: tone
            type: multiple_choice
            text: "Which sentence fits a letter to the manager of a zoo?"
            options: ["I am writing to ask about school visits.", "Oi, can we come to your zoo or what?", "Zoo visit pls."]
            answer: "I am writing to ask about school visits."
            option_audio: false
          - id: l2-c4
            part: tone
            type: sorting
            text: "Mia writes to the head teacher and to her cousin. Formal or informal?"
            say: "Mia writes one letter to the head teacher and one to her cousin. Is each sentence formal or informal?"
            option_audio: false
            bins:
              - { id: formal, show: { text: "formal" }, say: "Formal." }
              - { id: informal, show: { text: "informal" }, say: "Informal." }
            options:
              - { text: "Thank you for considering our request.", bin: formal }
              - { text: "Wasn't it brilliant?", bin: informal }
              - { text: "I am pleased to accept your invitation.", bin: formal }
              - { text: "Catch you later!", bin: informal }
          - id: l2-c5
            part: clear-words
            type: true_false
            text: "Is it true? Formal writing means using the longest words you can find."
            answer: false
          - id: l2-c6
            part: purpose
            type: matching
            text: "What is each text for? Match it to its purpose."
            say: "Read each text. Match it to its purpose."
            option_audio: false
            pairs:
              - { left: { text: "Once upon a time, a fox found a golden key." }, right: { text: "to entertain" } }
              - { left: { text: "Owls can turn their heads a long way round." }, right: { text: "to inform" } }
              - { left: { text: "Mix the flour and the butter in a bowl." }, right: { text: "to instruct" } }
          - id: l2-c7
            part: purpose
            type: multiple_choice
            text: "\"Our class has raised £50 for the animal shelter. On Friday, Mr Lee will hand the money over.\"\n\nWhat is the purpose of this text?"
            options: ["to inform", "to persuade", "to instruct"]
            answer: "to inform"
          - id: l2-c8
            part: purpose
            type: true_false
            text: "\"Don't miss the best show in town! Tickets are selling fast!\"\n\nIs it true? This text is written to inform, not to persuade."
            say: "Read the text. Is it true? This text is written to inform, not to persuade."
            answer: false
          - id: l2-c9
            part: purpose
            type: sorting
            text: "What is each text for? Sort them."
            say: "Is each text written to inform or to persuade? Sort them."
            option_audio: false
            bins:
              - { id: inform, show: { text: "to inform" }, say: "To inform." }
              - { id: persuade, show: { text: "to persuade" }, say: "To persuade." }
            options:
              - { text: "a fact file on the planets", bin: inform }
              - { text: "a poster for a cake sale", bin: persuade }
              - { text: "a report on the class trip", bin: inform }
              - { text: "an advert for trainers", bin: persuade }
          - id: l2-c10
            part: form
            type: multiple_choice
            text: "You want to remember what you did each day of your holiday. Which form fits best?"
            options: ["a diary", "a recipe", "a leaflet"]
            answer: "a diary"
          - id: l2-c11
            part: form
            type: multiple_choice
            text: "You want your class to vote for you as school councillor. Which form fits best?"
            options: ["a speech with reasons", "a set of instructions", "a poem about the weather"]
            answer: "a speech with reasons"
          - id: l2-c12
            part: form
            type: true_false
            text: "Is it true? A short leaflet is a good form for telling visitors what is on at the school fair."
            say: "Is it true? A short leaflet is a good form for telling visitors what is on at the school fair."
            answer: true
          - id: l2-c13
            part: form
            type: multiple_choice
            text: "Mr Hill wants to tell parents the date of sports day. Which form fits best?"
            options: ["a short letter home", "a poem", "a comic strip"]
            answer: "a short letter home"
          - id: l2-c14
            part: tone
            type: highlight_in_text
            text: "Mia is writing to the head teacher. Tap the words that make this sentence too informal."
            say: "Mia is writing to the head teacher. Tap the words that make this sentence too informal."
            show: { drawn: letter-card, text: "Sports day was mega cool" }
            spans: ["mega", "cool"]
          - id: l2-c15
            part: tone
            type: multiple_choice
            text: "Which ending fits a formal letter to Mr Ahmed, the manager of the leisure centre?"
            options: ["Yours sincerely,", "Cheers,", "Love from,"]
            answer: "Yours sincerely,"
            option_audio: false
          - id: l2-c16
            part: tone
            type: multiple_choice
            text: "Which sentence fits a text message to your cousin?"
            options: ["Are you coming to the party? It'll be great!", "I would be most grateful if you could attend.", "I am writing to confirm the arrangements."]
            answer: "Are you coming to the party? It'll be great!"
            option_audio: false
          - id: l2-c17
            part: clear-words
            type: multiple_choice
            text: "Which sentence is formal and clear for a letter to the council about a broken bench?"
