# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.verb-formation
skill: lit-en.grammar.verb-formation
curriculum: en-GB
language: en
title:
  de: Verben mit Nachsilben und Vorsilben bilden
  en: Making verbs with suffixes and prefixes
summary: >
  The Year 5 word structure from Appendix 2 of the National Curriculum.
  Lesson 1 turns nouns and adjectives into verbs with the suffixes -ate,
  -ise and -ify (active to activate, apology to apologise, pure to
  purify), with the spelling changes: drop a final e, and change or drop
  a final y. Lesson 2 adds the verb prefixes dis-, de-, mis-, over- and
  re- and what each means (undo, take away, wrongly, too much, again);
  it ends with the skill check. England spells -ise (apologise,
  memorise), so -ize is not used.
metadata:
  year: year-5
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.a-an-word-families]
  also_practises: [lit-en.spelling.prefixes-suffixes-ks2]
  vocabulary: { en: [verb, noun, adjective, suffix, prefix, root word, word family, -ate, -ise, -ify, dis-, de-, mis-, over-, re-] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: suffix-no-spelling-change
      what: Adds the suffix without changing the root (pureify, beautyify, apologyise)
      addressed: Learn screen 3 of lesson 1; l1-f3 (feedback), l1-f4, l1-s2, l1-n2, l2-c2
    - id: suffix-keeps-word-class
      what: Thinks the new word is still a noun or adjective, not a verb
      addressed: Learn screen 1 of lesson 1; l1-f1 (feedback), l1-s4, l1-n4, l2-c1
    - id: prefixes-all-mean-not
      what: Thinks every verb prefix means not, so misspell means not spell and overcook means not cook
      addressed: Learn of lesson 2; l2-f1 (feedback), l2-f3, l2-s1, l2-n1, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "-ate, -ise und -ify", en: "-ate, -ise and -ify" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which word fits? \"I ate _ orange.\""
            options: ["an", "a"]
            answer: "an"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word belongs to the same word family as solve?"
            options: ["solution", "sole", "silver"]
            answer: "solution"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "active (adjective) → activate (verb)\napology (noun) → apologise (verb)\nclass (noun) → classify (verb)"
            say: "The suffixes ate, ise and ify turn a noun or an adjective into a verb. Active is an adjective; activate is a verb. Apology is a noun; apologise is a verb. Class is a noun; classify is a verb."
          - text: "Please apologise to your sister.\nWe classify the animals into groups."
            say: "You can tell it is a verb because it is something you do. You can put to in front of it: to apologise, to classify."
          - text: "pure → purify\nbeauty → beautify\nmemory → memorise"
            say: "Watch the spelling. A final e is dropped: pure, purify. A final y changes to i before ify: beauty, beautify. Before ise, the y is dropped: memory, memorise."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"Please memorise the poem.\"\n\nWhat word class is memorise?"
                options: ["verb", "noun", "adjective"]
                answer: "verb"
                keep_order: true
                feedback:
                  "noun": "Memory is the noun. The suffix ise turns it into a verb: something you do."
                hints:
                  - "Is memorise something you do?"
                  - "You can say to memorise."
                  - "Verb."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Match each word to its verb."
                say: "Match each noun or adjective to the verb made from it."
                option_audio: false
                pairs:
                  - { left: { text: "hyphen" }, right: { text: "hyphenate" } }
                  - { left: { text: "critic" }, right: { text: "criticise" } }
                  - { left: { text: "solid" }, right: { text: "solidify" } }
                  - { left: { text: "vaccine" }, right: { text: "vaccinate" } }
                hints:
                  - "Say each pair aloud: does it sound like a real verb?"
                  - "Solid takes ify; critic takes ise."
                  - "Hyphenate, criticise, solidify, vaccinate."
              - id: l1-f3
                type: multiple_choice
                text: "pure → ?"
                say: "Make a verb from pure. Which spelling is right?"
                options: ["purify", "pureify", "purefy"]
                answer: "purify"
                option_audio: false
                feedback:
                  "pureify": "Drop the final e of pure before adding ify: purify."
                hints:
                  - "Does pure end in e?"
                  - "Drop the e before the suffix."
                  - "Purify."
              - id: l1-f4
                type: fill_in_blank
                text: "Complete the verb."
                say: "Beauty becomes a verb. Fill the gap."
                frame: "beauty → beaut_fy"
                options: ["i", "y", "e"]
                answer: ["i"]
                option_audio: false
                hints:
                  - "What happens to the y before ify?"
                  - "The y changes to i."
                  - "i: beautify."
              - id: l1-f5
                type: text_input
                text: "apology → ?\nWrite the verb."
                say: "Make a verb from apology with the suffix ise. Write it."
                keyboard: letters
                answer: "apologise"
                hints:
                  - "Drop the y before ise."
                  - "apolog plus ise."
                  - "apologise"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which verb is made from simple?"
                options: ["simplify", "simplise", "simplate"]
                answer: "simplify"
                option_audio: false
                hints: ["Say each one. Which is a real word?"]
              - id: l1-s2
                type: multiple_choice
                text: "glory → ?"
                say: "Make a verb from glory. Which spelling is right?"
                options: ["glorify", "gloryify", "glorrify"]
                answer: "glorify"
                option_audio: false
                hints: ["The y changes to i before ify."]
              - id: l1-s3
                type: text_input
                text: "active → ?\nWrite the verb."
                say: "Make a verb from active with the suffix ate. Write it."
                keyboard: letters
                answer: "activate"
                hints: ["Drop the final e first."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the verb made with a suffix."
                say: "Tap the verb that was made with ate, ise or ify."
                show: { drawn: letter-card, text: "The scientists will classify the new beetles" }
                spans: ["classify"]
                hints: ["Look for ify."]
              - id: l1-s5
                type: true_false
                text: "Is it true? In England we usually spell the verb as apologise, with ise."
                answer: true
                hints: ["Think of memorise and criticise."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which verb is made from origin?"
                options: ["originate", "originify", "originise"]
                answer: "originate"
                option_audio: false
              - id: l1-n2
                type: text_input
                text: "sympathy → ?\nWrite the verb."
                say: "Make a verb from sympathy with the suffix ise. Write it."
                keyboard: letters
                answer: "sympathise"
              - id: l1-n3
                type: matching
                text: "Match each word to its verb."
                say: "Match each noun or adjective to the verb made from it."
                option_audio: false
                pairs:
                  - { left: { text: "intense" }, right: { text: "intensify" } }
                  - { left: { text: "motive" }, right: { text: "motivate" } }
                  - { left: { text: "modern" }, right: { text: "modernise" } }
              - id: l1-n4
                type: multiple_choice
                text: "\"We purify the water until it is pure.\"\n\nWhat word class is pure?"
                options: ["verb", "noun", "adjective"]
                answer: "adjective"
                keep_order: true
              - id: l1-n5
                type: true_false
                text: "Is it true? The verb from pure is spelt pureify."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "solid → ?"
            say: "Make a verb from solid. Which spelling is right?"
            options: ["solidify", "solidise", "solidate"]
            answer: "solidify"
            option_audio: false
          - id: l1-c2
            type: text_input
            text: "memory → ?\nWrite the verb."
            say: "Make a verb from memory with the suffix ise. Write it."
            keyboard: letters
            answer: "memorise"
          - id: l1-c3
            type: multiple_choice
            text: "\"Please hyphenate the word.\"\n\nWhat word class is hyphenate?"
            options: ["verb", "noun", "adjective"]
            answer: "verb"
            keep_order: true

  - n: 2
    title: { de: "Vorsilben: dis-, de-, mis-, over-, re-", en: "Prefixes: dis-, de-, mis-, over- and re-" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "class → ?"
            say: "Make a verb from class. Which one is right?"
            options: ["classify", "classise", "classate"]
            answer: "classify"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "beauty → ?"
            say: "Make a verb from beauty. Which spelling is right?"
            options: ["beautify", "beautyify", "beautefy"]
            answer: "beautify"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "dis- : disagree, disappear, disconnect\nde- : defrost, deflate, decode"
            say: "Prefixes go at the start of a verb and change its meaning. Dis and de often mean undo or take away: disconnect undoes connect, defrost takes the frost away."
          - text: "mis- : misspell, misunderstand, mislead\nover- : oversleep, overcook, overflow\nre- : rebuild, rewrite, reheat"
            say: "Mis means wrongly: misspell means spell wrongly. Over means too much: overcook means cook too much. Re means again: rewrite means write again."
          - text: "mis + spell = misspell\nre + build = rebuild"
            say: "The root word does not change when you add a prefix. Mis plus spell keeps both s letters: misspell."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What does misunderstand mean?"
                options: ["understand wrongly", "not understand at all", "understand again"]
                answer: "understand wrongly"
                feedback:
                  "not understand at all": "Mis does not mean not. It means wrongly: you understood, but got it wrong."
                hints:
                  - "What does the prefix mis mean?"
                  - "Think of misspell: spell wrongly."
                  - "Understand wrongly."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Match each prefix to its meaning."
                say: "Match each prefix to what it means."
                option_audio: false
                pairs:
                  - { left: { text: "re-" }, right: { text: "again" } }
                  - { left: { text: "mis-" }, right: { text: "wrongly" } }
                  - { left: { text: "over-" }, right: { text: "too much" } }
                  - { left: { text: "de-" }, right: { text: "take away" } }
                hints:
                  - "Think of rewrite, misspell, overcook and defrost."
                  - "Defrost takes the frost away."
                  - "Re: again. Mis: wrongly. Over: too much. De: take away."
              - id: l2-f3
                type: fill_in_blank
                text: "The bath was too full. Water spilled onto the floor.\nChoose the prefix."
                say: "The bath was too full. Water spilled onto the floor. Choose the prefix."
                frame: "The bath _flowed."
                options: ["over", "re", "dis"]
                answer: ["over"]
                option_audio: false
                hints:
                  - "The bath had too much water in it."
                  - "Which prefix means too much?"
                  - "Over: overflowed."
              - id: l2-f4
                type: text_input
                text: "mis + spell → ?\nWrite the word."
                say: "Add mis to spell. Write the new verb."
                keyboard: letters
                answer: "misspell"
                hints:
                  - "The root word does not change."
                  - "Keep the s of mis and the s of spell."
                  - "misspell"
              - id: l2-f5
                type: multiple_choice
                text: "Which verb means to let the air out of something?"
                options: ["deflate", "reflate", "misflate"]
                answer: "deflate"
                option_audio: false
                hints:
                  - "Which prefix means take away?"
                  - "You take the air away."
                  - "Deflate."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What does overcook mean?"
                options: ["cook for too long", "not cook", "cook again"]
                answer: "cook for too long"
                hints: ["Over means too much."]
              - id: l2-s2
                type: fill_in_blank
                text: "The wind knocked our tower down, so we built it again.\nChoose the prefix."
                say: "The wind knocked our tower down, so we built it again. Choose the prefix."
                frame: "We _built the tower."
                options: ["re", "de", "mis"]
                answer: ["re"]
                option_audio: false
                hints: ["Which prefix means again?"]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the verb with a prefix."
                say: "Tap the verb that starts with a prefix."
                show: { drawn: letter-card, text: "The magician made the rabbit disappear" }
                spans: ["disappear"]
                hints: ["Look for dis, de, mis, over or re."]
              - id: l2-s4
                type: text_input
                text: "re + heat → ?\nWrite the word."
                say: "Add re to heat. Write the new verb."
                keyboard: letters
                answer: "reheat"
                hints: ["Just put re in front."]
              - id: l2-s5
                type: true_false
                text: "Is it true? Defrost means to take the frost away."
                answer: true
                hints: ["De can mean take away."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What does mislead mean?"
                options: ["lead in the wrong direction", "not lead", "lead again"]
                answer: "lead in the wrong direction"
              - id: l2-n2
                type: fill_in_blank
                text: "Sam did not hear his alarm and slept far too long.\nChoose the prefix."
                say: "Sam did not hear his alarm and slept far too long. Choose the prefix."
                frame: "Sam _slept and was late."
                options: ["over", "mis", "dis"]
                answer: ["over"]
                option_audio: false
              - id: l2-n3
                type: text_input
                text: "dis + connect → ?\nWrite the word."
                say: "Add dis to connect. Write the new verb."
                keyboard: letters
                answer: "disconnect"
              - id: l2-n4
                type: matching
                text: "Match each verb to its meaning."
                say: "Match each verb to what it means."
                option_audio: false
                pairs:
                  - { left: { text: "rewrite" }, right: { text: "write again" } }
                  - { left: { text: "misplace" }, right: { text: "put in the wrong place" } }
                  - { left: { text: "overeat" }, right: { text: "eat too much" } }
              - id: l2-n5
                type: true_false
                text: "Is it true? Misbehave means to behave again."
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "\"We must standardise the test.\"\n\nWhat word class is standardise?"
            options: ["verb", "noun", "adjective"]
            answer: "verb"
            keep_order: true
          - id: l2-c2
            type: text_input
            text: "note → ?\nWrite the verb with the suffix ify."
            say: "Make a verb from note with the suffix ify. Write it."
            keyboard: letters
            answer: "notify"
          - id: l2-c3
            type: multiple_choice
            text: "Which verb is made from valid?"
            options: ["validate", "validify", "validise"]
            answer: "validate"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "What does overheat mean?"
            options: ["get too hot", "not get hot", "heat again"]
            answer: "get too hot"
          - id: l2-c5
            type: fill_in_blank
            text: "Raj copied the message but wrote a word wrongly.\nChoose the prefix."
            say: "Raj copied the message but wrote a word wrongly. Choose the prefix."
            frame: "Raj _spelt a word."
            options: ["mis", "re", "over"]
            answer: ["mis"]
            option_audio: false
