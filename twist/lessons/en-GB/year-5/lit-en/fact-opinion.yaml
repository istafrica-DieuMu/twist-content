# Lesson set: English, Year 5. Hand-authored draft.
id: en-GB.lit-en.fact-opinion
skill: lit-en.comprehension.fact-opinion
curriculum: en-GB
language: en
title:
  de: Tatsache oder Meinung?
  en: Fact or opinion?
summary: >
  A fact can be checked and shown to be true; an opinion is what someone
  thinks or feels, and others may disagree. Lesson 1 sorts single
  sentences and spots opinion words (best, I think, amazing); lesson 2
  finds facts and opinions mixed in one text, such as an advert or a
  review, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Sachtexte, en: Information texts }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.comprehension.retrieve]
  also_practises: [lit-en.comprehension.retrieve-present]
  vocabulary: { en: [fact, opinion, check, evidence, I think, best, amazing, advert, review] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: sentence, what: { de: "bei einem Satz sagen, ob er Tatsache oder Meinung ist", en: telling whether a sentence is a fact or an opinion } }
    - { id: opinion-words, what: { de: "die Wörter finden, die eine Meinung zeigen", en: spotting the words that show an opinion } }
    - { id: strong-opinion, what: { de: "eine Meinung bleibt Meinung, auch wenn sie sicher klingt oder viele sie teilen", en: an opinion said strongly or by many people is still an opinion } }
    - { id: in-a-text, what: { de: Tatsachen und Meinungen in einem Text unterscheiden, en: finding facts and opinions mixed in one text } }
  misconceptions:
    - id: wrong-is-opinion
      what: Calls a false statement an opinion (London is in France)
      addressed: Learn says a fact claim can be checked, true or false; a false claim is a wrong fact, not an opinion
    - id: strong-opinion-is-fact
      what: Thinks an opinion said strongly or by many people is a fact (Everyone knows football is the best game)
      addressed: lesson 2 sets confident opinions against plain facts; feedback asks "Could someone disagree?"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Prüfen oder meinen, en: Check it or think it }
    goal:
      de: "Finde heraus, ob ein Satz eine Tatsache ist, die man prüfen kann, oder eine Meinung, so wie: Pizza schmeckt am besten."
      en: "Decide if a sentence is a fact you can check or an opinion someone thinks, like pizza is the tastiest food."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Owls\nHunting: Most owls hunt at night.\nEyes: Their large eyes help them see in the dark.\n\nWhen do most owls hunt?"
            say: "Read the question at the bottom. Find the answer in the text."
            options: ["at night", "in the morning", "in the dark eyes"]
            answer: "at night"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? Scanning means looking for a key word."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Fact: Paris is the capital of France."
            say: "A fact is something you can check. You could look it up in an atlas and show it is true."
          - text: "Opinion: Paris is the most beautiful city in the world."
            say: "An opinion is what someone thinks or feels. Another person might disagree. Words like most beautiful, best, I think and amazing often show an opinion."
          - text: "London is in France."
            say: "Careful: this is not an opinion. It is a claim you can check, and it is wrong. A claim that is wrong can still be checked, so it is not an opinion."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"A week has seven days.\" Fact or opinion?"
                say: "Read the sentence. Is it a fact or an opinion?"
                options: ["fact", "opinion"]
                answer: "fact"
                hints:
                  - "Can you check it?"
                  - "Count the days in a calendar week."
                  - "Fact."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"Pizza is the tastiest food.\" Fact or opinion?"
                say: "Read the sentence. Is it a fact or an opinion?"
                options: ["fact", "opinion"]
                answer: "opinion"
                feedback:
                  "fact": "Could someone disagree? Yes, many people prefer other food. Tastiest shows an opinion."
                hints:
                  - "Could someone disagree?"
                  - "Tastiest is an opinion word."
                  - "Opinion."
              - id: l1-f3
                type: sorting
                text: "Sort the sentences."
                say: "Read each sentence. Is it a fact or an opinion? Put it in the right group."
                option_audio: false
                bins:
                  - { id: fact, show: { text: "fact" }, say: "Fact." }
                  - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
                options:
                  - { text: "Water freezes at 0 °C.", bin: fact }
                  - { text: "Winter is the best season.", bin: opinion }
                  - { text: "Spiders have eight legs.", bin: fact }
                  - { text: "Spiders are scary.", bin: opinion }
                hints:
                  - "For each one, ask: can I check it?"
                  - "Best and scary are feelings."
                  - "Freezing and legs are facts; best season and scary are opinions."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the opinion word."
                say: "Tap the word that shows this is an opinion."
                show: { drawn: letter-card, text: "This is an amazing film" }
                spans: ["amazing"]
                hints:
                  - "Which word tells you what someone feels?"
                  - "Could someone disagree that it is amazing?"
                  - "Amazing."
              - id: l1-f5
                type: multiple_choice
                text: "\"The Sun is a star.\" Fact or opinion?"
                say: "Read the sentence. Is it a fact or an opinion?"
                options: ["fact", "opinion"]
                answer: "fact"
                hints:
                  - "Could you check it in a science book?"
                  - "Yes, scientists have shown it."
                  - "Fact."
              - id: l1-f6
                type: true_false
                text: "Is it true? \"Cats are smaller than elephants\" is an opinion."
                answer: false
                hints:
                  - "Can it be checked?"
                  - "You could measure them."
                  - "No, it is a fact."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"Maths is the most fun subject.\" Fact or opinion?"
                say: "Read the sentence. Is it a fact or an opinion?"
                options: ["fact", "opinion"]
                answer: "opinion"
                hints: ["Could someone disagree?"]
              - id: l1-s2
                type: multiple_choice
                text: "\"Mount Everest is in Asia.\" Fact or opinion?"
                say: "Read the sentence. Is it a fact or an opinion?"
                options: ["fact", "opinion"]
                answer: "fact"
                hints: ["You could check it on a map."]
              - id: l1-s3
                type: sorting
                text: "Sort the sentences."
                say: "Read each sentence. Is it a fact or an opinion? Put it in the right group."
                option_audio: false
                bins:
                  - { id: fact, show: { text: "fact" }, say: "Fact." }
                  - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
                options:
                  - { text: "Honeybees make honey.", bin: fact }
                  - { text: "Honey is delicious.", bin: opinion }
                  - { text: "There are 12 months in a year.", bin: fact }
                  - { text: "I think June is the nicest month.", bin: opinion }
                hints: ["Ask: can I check it?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the opinion words."
                say: "Tap the words that show this is an opinion."
                show: { drawn: letter-card, text: "I think dogs are the best pets" }
                spans: ["think", "best"]
                hints: ["Two words."]
              - id: l1-s5
                type: true_false
                text: "Is it true? \"London is in France\" is an opinion."
                answer: false
                hints: ["It can be checked, and it is wrong."]
              - id: l1-s6
                type: multiple_choice
                text: "\"Rain is boring.\" Fact or opinion?"
                say: "Read the sentence. Is it a fact or an opinion?"
                options: ["fact", "opinion"]
                answer: "opinion"
                hints: ["Boring is a feeling."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"A triangle has three sides.\" Fact or opinion?"
                say: "Read the sentence. Is it a fact or an opinion?"
                options: ["fact", "opinion"]
                answer: "fact"
              - id: l1-n2
                type: multiple_choice
                text: "\"Football is better than tennis.\" Fact or opinion?"
                say: "Read the sentence. Is it a fact or an opinion?"
                options: ["fact", "opinion"]
                answer: "opinion"
              - id: l1-n3
                type: sorting
                text: "Sort the sentences."
                say: "Read each sentence. Is it a fact or an opinion? Put it in the right group."
                option_audio: false
                bins:
                  - { id: fact, show: { text: "fact" }, say: "Fact." }
                  - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
                options:
                  - { text: "The Thames flows through London.", bin: fact }
                  - { text: "London is the best city.", bin: opinion }
                  - { text: "Frogs lay eggs.", bin: fact }
                  - { text: "Frogs are cute.", bin: opinion }
              - id: l1-n4
                type: highlight_in_text
                text: "Tap the opinion word."
                say: "Tap the word that shows this is an opinion."
                show: { drawn: letter-card, text: "That was a brilliant match" }
                spans: ["brilliant"]
              - id: l1-n5
                type: true_false
                text: "Is it true? \"Ice melts when it gets warm\" is a fact."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"Tigers have stripes.\" Fact or opinion?"
            say: "Read the sentence. Is it a fact or an opinion?"
            options: ["fact", "opinion"]
            answer: "fact"
          - id: l1-c2
            type: multiple_choice
            text: "\"Tigers are the most beautiful animals.\" Fact or opinion?"
            say: "Read the sentence. Is it a fact or an opinion?"
            options: ["fact", "opinion"]
            answer: "opinion"
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the opinion word."
            say: "Tap the word that shows this is an opinion."
            show: { drawn: letter-card, text: "The park has a lovely pond" }
            spans: ["lovely"]
          - id: l1-c4
            type: true_false
            text: "Is it true? \"Bananas turn yellow when they are ripe\" is a fact."
            say: "Is it true? Bananas turn yellow when they are ripe, is a fact."
            answer: true
          - id: l1-c5
            type: sorting
            text: "Fact or opinion? Sort the sentences."
            say: "Read each sentence. Is it a fact or an opinion? Sort them."
            option_audio: false
            bins:
              - { id: fact, show: { text: "fact" }, say: "Fact." }
              - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
            options:
              - { text: "The Moon goes round the Earth.", bin: fact }
              - { text: "Films about space are exciting.", bin: opinion }
              - { text: "Sharks live in the sea.", bin: fact }
              - { text: "Sharks are horrible.", bin: opinion }
          - id: l1-c6
            type: multiple_choice
            text: "Which sentence is an opinion?"
            options: ["Hedgehogs are the sweetest animals.", "Hedgehogs eat beetles.", "Hedgehogs sleep through the winter."]
            answer: "Hedgehogs are the sweetest animals."
            option_audio: false

  - n: 2
    title: { de: Gemischt in einem Text, en: Mixed in one text }
    goal:
      de: "Finde die Tatsachen und die Meinungen, die in einer Werbung gemischt sind, so wie fünf Rutschen und den aufregendsten Tag überhaupt."
      en: "Spot the facts and the opinions mixed together in an advert, like five slides and the most exciting day out ever."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"Snow is white.\" Fact or opinion?"
            say: "Read the sentence. Is it a fact or an opinion?"
            options: ["fact", "opinion"]
            answer: "fact"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "\"Snow days are the best days.\" Fact or opinion?"
            say: "Read the sentence. Is it a fact or an opinion?"
            options: ["fact", "opinion"]
            answer: "opinion"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Sunny Bay Water Park opens at 9 am. It has five slides. It is the most exciting day out you will ever have!"
            say: "Adverts mix facts and opinions. Opening at nine and having five slides can be checked: facts. The most exciting day out is the advert's opinion."
          - text: "Everyone agrees it is the best park."
            say: "Watch out: saying everyone agrees does not make it a fact. Could someone disagree? Yes. So it is still an opinion."
          - text: "Adverts use opinions to persuade you."
            say: "Writers of adverts and reviews want to persuade you. Spotting the opinions helps you decide for yourself."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ocean World has over 200 kinds of fish. Its shark tunnel is truly breathtaking. Tickets cost £12.\n\nWhich sentence is an opinion?"
                say: "Read the advert. Which sentence is an opinion?"
                options: ["Its shark tunnel is truly breathtaking.", "Ocean World has over 200 kinds of fish.", "Tickets cost £12."]
                answer: "Its shark tunnel is truly breathtaking."
                option_audio: false
                hints:
                  - "Which sentence could someone disagree with?"
                  - "Breathtaking is a feeling."
                  - "The shark tunnel sentence."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ocean World has over 200 kinds of fish. Its shark tunnel is truly breathtaking. Tickets cost £12.\n\nHow many facts are in the advert?"
                say: "Read the advert. How many sentences are facts?"
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Check each sentence: can it be checked?"
                  - "Fish and ticket price can be checked."
                  - "Two facts."
              - id: l2-f3
                type: true_false
                text: "Everyone knows football is the greatest sport.\n\nIs it a fact?"
                say: "Read the sentence. Is it a fact?"
                answer: false
                feedback:
                  "true": "Everyone knows sounds sure, but could someone disagree? Yes. It is an opinion."
                hints:
                  - "Could someone disagree?"
                  - "Many people prefer other sports."
                  - "No, it is an opinion."
              - id: l2-f4
                type: sorting
                text: "Sort the sentences from the book review."
                say: "Read each sentence from the review. Is it a fact or an opinion?"
                option_audio: false
                bins:
                  - { id: fact, show: { text: "fact" }, say: "Fact." }
                  - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
                options:
                  - { text: "The book has 120 pages.", bin: fact }
                  - { text: "The ending is wonderful.", bin: opinion }
                  - { text: "It was written in 2019.", bin: fact }
                  - { text: "It is the funniest book this year.", bin: opinion }
                hints:
                  - "Pages and dates can be checked."
                  - "Wonderful and funniest are feelings."
                  - "Pages and 2019 are facts."
              - id: l2-f5
                type: highlight_in_text
                text: "Tap the opinion words."
                say: "Tap every word in the advert that shows an opinion."
                show: { drawn: letter-card, text: "Our tasty pies are made fresh with the finest flour" }
                spans: ["tasty", "finest"]
                hints:
                  - "Which words are about feelings or judgements?"
                  - "Tasty and one more."
                  - "Tasty and finest."
              - id: l2-f6
                type: multiple_choice
                text: "Why do adverts include opinions?"
                options: ["to persuade you to buy or visit", "to give you facts only", "to tell a story"]
                answer: "to persuade you to buy or visit"
                hints:
                  - "What does an advert want you to do?"
                  - "Buy or visit."
                  - "To persuade you."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The castle was built in 1086. It is the most magical place in England. It is open every day.\n\nWhich sentence is an opinion?"
                say: "Read the leaflet. Which sentence is an opinion?"
                options: ["It is the most magical place in England.", "The castle was built in 1086.", "It is open every day."]
                answer: "It is the most magical place in England."
                option_audio: false
                hints: ["Most magical."]
              - id: l2-s2
                type: multiple_choice
                text: "The castle was built in 1086. It is the most magical place in England. It is open every day.\n\nHow many facts are in the leaflet?"
                say: "Read the leaflet. How many sentences are facts?"
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["Check each sentence."]
              - id: l2-s3
                type: true_false
                text: "This bike is the best bike for every child.\n\nIs it a fact?"
                say: "Read the sentence. Is it a fact?"
                answer: false
                hints: ["Could someone disagree?"]
              - id: l2-s4
                type: sorting
                text: "Sort the sentences from the film review."
                say: "Read each sentence from the review. Is it a fact or an opinion?"
                option_audio: false
                bins:
                  - { id: fact, show: { text: "fact" }, say: "Fact." }
                  - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
                options:
                  - { text: "The film lasts 95 minutes.", bin: fact }
                  - { text: "The songs are catchy.", bin: opinion }
                  - { text: "It is set in Scotland.", bin: fact }
                  - { text: "The dragon is far too scary.", bin: opinion }
                hints: ["Times and places can be checked."]
              - id: l2-s5
                type: highlight_in_text
                text: "Tap the opinion words."
                say: "Tap every word in the advert that shows an opinion."
                show: { drawn: letter-card, text: "Come to our fantastic shop for the coolest trainers" }
                spans: ["fantastic", "coolest"]
                hints: ["Two words."]
              - id: l2-s6
                type: multiple_choice
                text: "Which sentence would fit in a fact file?"
                options: ["Giraffes are the tallest land animals.", "Giraffes are the prettiest animals.", "I love giraffes."]
                answer: "Giraffes are the tallest land animals."
                option_audio: false
                hints: ["A fact file has only facts."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The museum has a real dinosaur skeleton. Entry is free. You will have the time of your life!\n\nWhich sentence is an opinion?"
                say: "Read the leaflet. Which sentence is an opinion?"
                options: ["You will have the time of your life!", "Entry is free.", "The museum has a real dinosaur skeleton."]
                answer: "You will have the time of your life!"
                option_audio: false
              - id: l2-n2
                type: true_false
                text: "Most people say summer is the best season.\n\nIs it a fact that summer is the best season?"
                say: "Read the sentence. Is it a fact that summer is the best season?"
                answer: false
              - id: l2-n3
                type: sorting
                text: "Sort the sentences from the report."
                say: "Read each sentence from the report. Is it a fact or an opinion?"
                option_audio: false
                bins:
                  - { id: fact, show: { text: "fact" }, say: "Fact." }
                  - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
                options:
                  - { text: "The school has 300 pupils.", bin: fact }
                  - { text: "The lunches are yummy.", bin: opinion }
                  - { text: "School starts at 8.45 am.", bin: fact }
                  - { text: "The playground is too small.", bin: opinion }
              - id: l2-n4
                type: highlight_in_text
                text: "Tap the opinion words."
                say: "Tap every word in the advert that shows an opinion."
                show: { drawn: letter-card, text: "Try our delicious new ice cream in a gorgeous pot" }
                spans: ["delicious", "gorgeous"]
              - id: l2-n5
                type: multiple_choice
                text: "Which sentence would fit in a fact file?"
                options: ["Penguins cannot fly.", "Penguins are funny.", "Penguins are the best birds."]
                answer: "Penguins cannot fly."
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: sentence
            type: multiple_choice
            text: "\"The Earth goes round the Sun.\" Fact or opinion?"
            say: "Read the sentence. Is it a fact or an opinion?"
            options: ["fact", "opinion"]
            answer: "fact"
          - id: l2-c2
            part: strong-opinion
            type: true_false
            text: "Everyone agrees that chocolate is the best flavour.\n\nIs it a fact?"
            say: "Read the sentence. Is it a fact?"
            answer: false
          - id: l2-c3
            part: opinion-words
            type: highlight_in_text
            text: "Tap the opinion words."
            say: "Tap every word that shows an opinion."
            show: { drawn: letter-card, text: "It was a wonderful trip to a beautiful beach" }
            spans: ["wonderful", "beautiful"]
          - id: l2-c4
            part: in-a-text
            type: multiple_choice
            text: "The zoo has 40 kinds of monkey. The monkeys are the cutest in the country. It opens at 10 am.\n\nWhich sentence is an opinion?"
            say: "Read the leaflet. Which sentence is an opinion?"
            options: ["The monkeys are the cutest in the country.", "The zoo has 40 kinds of monkey.", "It opens at 10 am."]
            answer: "The monkeys are the cutest in the country."
            option_audio: false
          - id: l2-c5
            part: sentence
            type: true_false
            text: "Is it true? \"Paris is in Spain\" is wrong, but it is not an opinion."
            answer: true
          - id: l2-c6
            part: sentence
            type: sorting
            text: "Which are facts and which are opinions? Sort them."
            say: "Read each sentence. Is it a fact or an opinion? Sort them."
            option_audio: false
            bins:
              - { id: fact, show: { text: "fact" }, say: "Fact." }
              - { id: opinion, show: { text: "opinion" }, say: "Opinion." }
            options:
              - { text: "A spider is not an insect.", bin: fact }
              - { text: "Homework is a waste of time.", bin: opinion }
              - { text: "Wales has mountains.", bin: fact }
              - { text: "Swimming is more fun than running.", bin: opinion }
          - id: l2-c7
            part: sentence
            type: multiple_choice
            text: "Which sentence is a fact?"
            options: ["A year has 365 days, or 366 in a leap year.", "A year is too long to wait for a birthday.", "The summer holidays are never long enough."]
            answer: "A year has 365 days, or 366 in a leap year."
            option_audio: false
          - id: l2-c8
            part: sentence
            type: true_false
            text: "Is it true? \"The Titanic sank in 1912\" is a fact, because you can check it."
            say: "Is it true? The Titanic sank in nineteen twelve, is a fact, because you can check it."
            answer: true
          - id: l2-c9
            part: opinion-words
            type: highlight_in_text
            text: "Tap the opinion word."
            say: "Tap the word that shows an opinion."
            show: { drawn: letter-card, text: "The new library has a brilliant reading corner" }
            spans: ["brilliant"]
          - id: l2-c10
            part: opinion-words
            type: highlight_in_text
            text: "Tap the opinion words."
            say: "Tap every word that shows an opinion."
            show: { drawn: letter-card, text: "I believe our team played the best game" }
            spans: ["believe", "best"]
          - id: l2-c11
            part: opinion-words
            type: multiple_choice
            text: "\"The castle has a horrible dungeon under the tower.\"\n\nWhich word shows an opinion?"
            options: ["horrible", "castle", "tower"]
            answer: "horrible"
            option_audio: false
          - id: l2-c12
            part: opinion-words
            type: true_false
            text: "\"The bridge is 50 metres long.\"\n\nIs it true? This sentence has an opinion word in it."
            say: "Read the sentence. Is it true? This sentence has an opinion word in it."
            answer: false
          - id: l2-c13
            part: strong-opinion
            type: multiple_choice
            text: "\"All my friends say the new film is the best film ever.\"\n\nWhat is it?"
            options: ["an opinion, even though many people say it", "a fact, because lots of people say it", "a fact, because it is about a real film"]
            answer: "an opinion, even though many people say it"
            option_audio: false
          - id: l2-c14
            part: strong-opinion
            type: multiple_choice
            text: "Which sentence is a fact?"
            say: "Read the sentences. Which one is a fact?"
            options: ["Most children in our class walk to school.", "Everyone knows walking to school is best.", "Walking is the only sensible way to travel."]
            answer: "Most children in our class walk to school."
            option_audio: false
          - id: l2-c15
            part: strong-opinion
            type: true_false
            text: "\"Without doubt, maths is the hardest subject.\"\n\nIs it true? The words \"without doubt\" make this a fact."
            say: "Read the sentence. Is it true? The words without doubt make this a fact."
            answer: false
          - id: l2-c16
