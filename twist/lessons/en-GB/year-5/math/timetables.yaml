# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.timetables
skill: math.time.timetables
curriculum: en-GB
language: en
title:
  de: Fahrpläne lesen
  en: Timetables
summary: >
  Bus and train timetables in the 24-hour clock, as printed in England.
  Lesson 1 finds a time in the right row and column, works out how long a
  journey takes and which bus gets you there in time. Lesson 2 uses a
  timetable and a day's schedule to solve problems in steps (waiting
  time, the last bus, how often a bus runs, what time it is in 12-hour
  time) and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Zeitpunkt und Zeitdauer, en: Time and duration }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.time.units, math.data.read-tables]
  also_practises: [math.time.durations]
  vocabulary: { en: [timetable, schedule, depart, arrive, journey, stop, 24-hour clock, am, pm, every 20 minutes] }
  forms: [drawn, text, audio]
  drawn: [table]
  facets: []
  parts:
    - { id: read, what: { de: eine Zeit im Fahrplan ablesen, en: reading a time from a timetable or schedule } }
    - { id: duration, what: { de: "ausrechnen, wie lange eine Fahrt oder eine Aktivität dauert", en: working out how long a journey or activity takes } }
    - { id: problems, what: { de: Zeitaufgaben mit Fahrplänen in Schritten lösen, en: solving time problems in steps with a timetable } }
  misconceptions:
    - id: wrong-row-column
      what: Reads the time from the wrong row or column (the first stop instead of the one asked)
      addressed: lesson 1 Learn reads along the row and down the column; l1-f1 has feedback on both wrong cells, l1-s1 and l1-n1 ask again
    - id: duration-across-hour
      what: Subtracts times as ordinary numbers across the hour (09:50 to 10:15 is 65 minutes)
      addressed: lesson 1 Learn counts on to the next hour; l1-f4 has feedback on 65, l1-s4, l1-n4 and l2-c2 cross the hour
    - id: in-time
      what: Picks the bus that arrives after the time needed, or the first bus of the day
      addressed: lesson 1 Learn chooses the last bus that is still in time; l1-f3 has feedback on both, l1-s3 and l2-c3 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Fahrpläne lesen", en: "Reading a timetable" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is 3:40 pm in the 24-hour clock?"
            options: ["15:40", "13:40", "03:40"]
            answer: "15:40"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "How many minutes is it from 07:10 to 07:35?"
            say: "How many minutes is it from seven ten to seven thirty-five?"
            answer: "25"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Bus 12 timetable"
            say: "This is a bus timetable. The stops are down the left. Each column is one bus. The first bus leaves the station at seven ten and gets to school at seven thirty-two."
            show: { drawn: table, rows: [["Stop", "Bus A", "Bus B", "Bus C"], ["Station", "07:10", "07:40", "08:10"], ["Market Square", "07:18", "07:48", "08:18"], ["High Street", "07:25", "07:55", "08:25"], ["School", "07:32", "08:02", "08:32"]] }
          - text: "Bus B at High Street: 07:55"
            say: "To find when Bus B is at High Street, go along the High Street row until you reach the Bus B column. It says seven fifty-five."
            show: { drawn: table, rows: [["Stop", "Bus A", "Bus B", "Bus C"], ["Station", "07:10", "07:40", "08:10"], ["Market Square", "07:18", "07:48", "08:18"], ["High Street", "07:25", "07:55", "08:25"], ["School", "07:32", "08:02", "08:32"]], mark: [[3, 2]] }
          - text: "07:40 to 08:02\n07:40 to 08:00 is 20 minutes\n08:00 to 08:02 is 2 minutes\n22 minutes"
            say: "How long does Bus B take from the station to school? Count on to the hour: seven forty to eight o'clock is twenty minutes, then two more minutes. The journey takes twenty-two minutes. Never subtract times like ordinary numbers."
          - text: "School starts at 08:15.\nBus B arrives 08:02. Bus C arrives 08:32."
            say: "School starts at eight fifteen. Bus C arrives at eight thirty-two, which is too late. Bus B arrives at two minutes past eight, so Bus B is the last bus that gets you there in time."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "When is Bus B at Market Square?"
                show: { drawn: table, rows: [["Stop", "Bus A", "Bus B", "Bus C"], ["Station", "07:10", "07:40", "08:10"], ["Market Square", "07:18", "07:48", "08:18"], ["High Street", "07:25", "07:55", "08:25"], ["School", "07:32", "08:02", "08:32"]] }
                options: ["07:48", "07:40", "07:18"]
                answer: "07:48"
                feedback:
                  "07:40": "07:40 is when Bus B leaves the station. Look in the Market Square row."
                  "07:18": "07:18 is Bus A. Move along to the Bus B column."
                hints:
                  - "Find the Market Square row."
                  - "Go along that row to the Bus B column."
                  - "07:48."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "How many minutes does the train take from Ashford to Dover?"
                show: { drawn: table, rows: [["Station", "Train 1", "Train 2", "Train 3"], ["Ashford", "09:05", "10:05", "11:05"], ["Folkestone", "09:25", "10:25", "11:25"], ["Dover", "09:45", "10:45", "11:45"]] }
                answer: "40"
                hints:
                  - "Pick one train. When does it leave Ashford and arrive at Dover?"
                  - "Train 1 goes from 09:05 to 09:45."
                  - "40 minutes."
              - id: l1-f3
                type: multiple_choice
                text: "Priya must be at the park by 14:15. Which bus is the last one that gets her there in time?"
                show: { drawn: table, rows: [["Stop", "Bus 1", "Bus 2", "Bus 3"], ["Leisure Centre", "13:30", "14:00", "14:30"], ["Park", "13:42", "14:12", "14:42"], ["Town Hall", "13:50", "14:20", "14:50"]] }
                options: ["Bus 2", "Bus 1", "Bus 3"]
                answer: "Bus 2"
                feedback:
                  "Bus 3": "Bus 3 reaches the park at 14:42. That is too late."
                  "Bus 1": "Bus 1 is in time, but Bus 2 is later and still in time."
                hints:
                  - "Look in the Park row."
                  - "Which time is just before 14:15?"
                  - "Bus 2, at the park at 14:12."
              - id: l1-f4
                type: text_input
                text: "A bus leaves at 09:50 and arrives at 10:15. How many minutes is the journey?"
                say: "A bus leaves at nine fifty and arrives at ten fifteen. How many minutes is the journey?"
                answer: "25"
                feedback:
                  "65": "An hour has 60 minutes, not 100. Count on: 09:50 to 10:00, then on to 10:15."
                hints:
                  - "Count on to the next hour first."
                  - "09:50 to 10:00 is 10 minutes. 10:00 to 10:15 is 15 minutes."
                  - "25 minutes."
              - id: l1-f5
                type: true_false
                text: "The tram leaves the zoo every 20 minutes."
                show: { drawn: table, rows: [["Stop", "Tram 1", "Tram 2", "Tram 3"], ["Zoo", "15:15", "15:35", "15:55"], ["Museum", "15:24", "15:44", "16:04"], ["Harbour", "15:33", "15:53", "16:13"]] }
                answer: true
                hints:
                  - "Look at the Zoo row."
                  - "15:15, 15:35, 15:55: how many minutes between them?"
                  - "Yes, every 20 minutes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "When is Train 3 at Folkestone?"
                show: { drawn: table, rows: [["Station", "Train 1", "Train 2", "Train 3"], ["Ashford", "09:05", "10:05", "11:05"], ["Folkestone", "09:25", "10:25", "11:25"], ["Dover", "09:45", "10:45", "11:45"]] }
                options: ["11:25", "11:05", "10:25"]
                answer: "11:25"
                hints: ["Folkestone row, Train 3 column."]
              - id: l1-s2
                type: text_input
                text: "How many minutes does the tram take from the zoo to the harbour?"
                show: { drawn: table, rows: [["Stop", "Tram 1", "Tram 2", "Tram 3"], ["Zoo", "15:15", "15:35", "15:55"], ["Museum", "15:24", "15:44", "16:04"], ["Harbour", "15:33", "15:53", "16:13"]] }
                answer: "18"
                hints: ["Tram 1: from 15:15 to 15:33."]
              - id: l1-s3
                type: multiple_choice
                text: "Josh must be at Central by 10:30. Which is the last train from Riverside that gets him there in time?"
                show: { drawn: table, rows: [["Station", "Train 1", "Train 2", "Train 3"], ["Riverside", "09:40", "10:10", "10:40"], ["Bridge Road", "09:52", "10:22", "10:52"], ["Central", "10:01", "10:31", "11:01"]] }
                options: ["Train 1", "Train 2", "Train 3"]
                answer: "Train 1"
                hints: ["Look in the Central row for the last time before 10:30."]
              - id: l1-s4
                type: text_input
                text: "A train leaves at 11:48 and arrives at 12:20. How many minutes is the journey?"
                say: "A train leaves at eleven forty-eight and arrives at twelve twenty. How many minutes is the journey?"
                answer: "32"
                hints: ["11:48 to 12:00 is 12 minutes."]
              - id: l1-s5
                type: true_false
                text: "Bus B takes longer from the station to school than Bus A."
                show: { drawn: table, rows: [["Stop", "Bus A", "Bus B", "Bus C"], ["Station", "07:10", "07:40", "08:10"], ["Market Square", "07:18", "07:48", "08:18"], ["High Street", "07:25", "07:55", "08:25"], ["School", "07:32", "08:02", "08:32"]] }
                answer: false
                hints: ["Work out both journeys: 07:10 to 07:32 and 07:40 to 08:02."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "When is Bus 3 at the town hall?"
                show: { drawn: table, rows: [["Stop", "Bus 1", "Bus 2", "Bus 3"], ["Leisure Centre", "13:30", "14:00", "14:30"], ["Park", "13:42", "14:12", "14:42"], ["Town Hall", "13:50", "14:20", "14:50"]] }
                options: ["14:50", "14:30", "14:20"]
                answer: "14:50"
              - id: l1-n2
                type: text_input
                text: "How many minutes does Bus 1 take from the leisure centre to the town hall?"
                show: { drawn: table, rows: [["Stop", "Bus 1", "Bus 2", "Bus 3"], ["Leisure Centre", "13:30", "14:00", "14:30"], ["Park", "13:42", "14:12", "14:42"], ["Town Hall", "13:50", "14:20", "14:50"]] }
                answer: "20"
              - id: l1-n3
                type: multiple_choice
                text: "Grace must be at Central by 10:45. Which is the last train that gets her there in time?"
                show: { drawn: table, rows: [["Station", "Train 1", "Train 2", "Train 3"], ["Riverside", "09:40", "10:10", "10:40"], ["Bridge Road", "09:52", "10:22", "10:52"], ["Central", "10:01", "10:31", "11:01"]] }
                options: ["Train 2", "Train 1", "Train 3"]
                answer: "Train 2"
              - id: l1-n4
                type: text_input
                text: "A coach leaves at 13:35 and arrives at 14:10. How many minutes is the journey?"
                say: "A coach leaves at thirteen thirty-five and arrives at fourteen ten. How many minutes is the journey?"
                answer: "35"
              - id: l1-n5
                type: multiple_choice
                text: "Which stop does Bus C reach at 08:25?"
                show: { drawn: table, rows: [["Stop", "Bus A", "Bus B", "Bus C"], ["Station", "07:10", "07:40", "08:10"], ["Market Square", "07:18", "07:48", "08:18"], ["High Street", "07:25", "07:55", "08:25"], ["School", "07:32", "08:02", "08:32"]] }
                options: ["High Street", "Market Square", "School"]
                answer: "High Street"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "When is Train 2 at Dover?"
            show: { drawn: table, rows: [["Station", "Train 1", "Train 2", "Train 3"], ["Ashford", "09:05", "10:05", "11:05"], ["Folkestone", "09:25", "10:25", "11:25"], ["Dover", "09:45", "10:45", "11:45"]] }
            options: ["10:45", "10:05", "09:45"]
            answer: "10:45"
          - id: l1-c2
            type: text_input
            text: "A bus leaves at 16:45 and arrives at 17:05. How many minutes is the journey?"
            say: "A bus leaves at sixteen forty-five and arrives at seventeen oh five. How many minutes is the journey?"
            answer: "20"
          - id: l1-c3
            type: true_false
            text: "Tram 2 reaches the museum before 15:40."
            show: { drawn: table, rows: [["Stop", "Tram 1", "Tram 2", "Tram 3"], ["Zoo", "15:15", "15:35", "15:55"], ["Museum", "15:24", "15:44", "16:04"], ["Harbour", "15:33", "15:53", "16:13"]] }
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "When is Train 1 at Bridge Road?"
            show: { drawn: table, rows: [["Station", "Train 1", "Train 2", "Train 3"], ["Riverside", "09:40", "10:10", "10:40"], ["Bridge Road", "09:52", "10:22", "10:52"], ["Central", "10:01", "10:31", "11:01"]] }
            options: ["09:52", "09:40", "10:22"]
            answer: "09:52"
          - id: l1-c5
            type: text_input
            text: "How many minutes does Train 2 take from Riverside to Central?"
            show: { drawn: table, rows: [["Station", "Train 1", "Train 2", "Train 3"], ["Riverside", "09:40", "10:10", "10:40"], ["Bridge Road", "09:52", "10:22", "10:52"], ["Central", "10:01", "10:31", "11:01"]] }
            answer: "21"
          - id: l1-c6
            type: multiple_choice
            text: "Owen must be at the museum by 15:50. Which is the last tram from the zoo that gets him there in time?"
            show: { drawn: table, rows: [["Stop", "Tram 1", "Tram 2", "Tram 3"], ["Zoo", "15:15", "15:35", "15:55"], ["Museum", "15:24", "15:44", "16:04"], ["Harbour", "15:33", "15:53", "16:13"]] }
            options: ["Tram 2", "Tram 1", "Tram 3"]
            answer: "Tram 2"

  - n: 2
    title: { de: "Mit Fahrplänen und Tagesplänen rechnen", en: "Solving problems with timetables" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "A train leaves at 10:40 and arrives at 11:05. How many minutes is the journey?"
            say: "A train leaves at ten forty and arrives at eleven oh five. How many minutes is the journey?"
            answer: "25"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "When is Bus 2 at the park?"
            show: { drawn: table, rows: [["Stop", "Bus 1", "Bus 2", "Bus 3"], ["Leisure Centre", "13:30", "14:00", "14:30"], ["Park", "13:42", "14:12", "14:42"], ["Town Hall", "13:50", "14:20", "14:50"]] }
            options: ["14:12", "14:00", "13:42"]
            answer: "14:12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Holiday club"
            say: "A schedule shows what happens during a day. This one is for a holiday club. Each activity has a start time and an end time."
            show: { drawn: table, rows: [["Activity", "Start", "End"], ["Football", "09:30", "10:45"], ["Snack", "10:45", "11:05"], ["Art", "11:05", "12:15"], ["Lunch", "12:15", "13:00"]] }
          - text: "Art: 11:05 to 12:15\n11:05 to 12:05 is 1 hour\n12:05 to 12:15 is 10 minutes\n1 hour 10 minutes"
            say: "How long is art? From five past eleven to five past twelve is one hour. Then ten more minutes. Art lasts one hour and ten minutes."
          - text: "Ben gets to the bus stop at 08:05.\nBuses: 07:50, 08:20, 08:50\nHe waits 15 minutes."
            say: "Problems often have two steps. Ben reaches the stop at five past eight. The next bus is at eight twenty, so he waits fifteen minutes."
          - text: "17:45 = 5:45 pm"
            say: "Timetables use the 24-hour clock. For a time after midday, take away twelve hours to say it in the 12-hour clock: seventeen forty-five is five forty-five pm."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How long is football?"
                show: { drawn: table, rows: [["Activity", "Start", "End"], ["Football", "09:30", "10:45"], ["Snack", "10:45", "11:05"], ["Art", "11:05", "12:15"], ["Lunch", "12:15", "13:00"]] }
                options: ["1 hour 15 minutes", "1 hour 45 minutes", "45 minutes"]
                answer: "1 hour 15 minutes"
                feedback:
                  "1 hour 45 minutes": "From 09:30 to 10:30 is 1 hour. How many more minutes to 10:45?"
                hints:
                  - "Football starts at 09:30 and ends at 10:45."
                  - "09:30 to 10:30 is 1 hour. Then 10:30 to 10:45."
                  - "1 hour 15 minutes."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Maya gets to the bus stop at 08:35. Buses leave at 07:50, 08:20, 08:50 and 09:20. How many minutes does she wait?"
                say: "Maya gets to the bus stop at eight thirty-five. Buses leave at seven fifty, eight twenty, eight fifty and nine twenty. How many minutes does she wait?"
                answer: "15"
                hints:
                  - "Which bus is the next one after 08:35?"
                  - "The 08:20 bus has gone. The next is 08:50."
                  - "08:35 to 08:50 is 15 minutes."
              - id: l2-f3
                type: multiple_choice
                text: "The last train leaves at 22:15. What is that in the 12-hour clock?"
                options: ["10:15 pm", "10:15 am", "2:15 pm"]
                answer: "10:15 pm"
                hints:
                  - "22:15 is after midday."
                  - "Take away 12 hours: 22 − 12."
                  - "10:15 pm."
              - id: l2-f4
                type: multiple_choice
                text: "How often does the bus leave the station?"
                show: { drawn: table, rows: [["Stop", "Bus 1", "Bus 2", "Bus 3", "Bus 4"], ["Station", "06:45", "07:00", "07:15", "07:30"], ["Hospital", "06:57", "07:12", "07:27", "07:42"]] }
                options: ["every 15 minutes", "every 12 minutes", "every 45 minutes"]
                answer: "every 15 minutes"
                feedback:
                  "every 12 minutes": "12 minutes is the journey from the station to the hospital. Compare times in the Station row."
                hints:
                  - "Look along the Station row."
                  - "06:45, 07:00, 07:15: how many minutes between them?"
                  - "Every 15 minutes."
              - id: l2-f5
                type: text_input
                text: "Noah takes the 14:00 bus from the leisure centre and gets off at the town hall. He then walks for 10 minutes. How many minutes after 14:00 does he finish?"
                show: { drawn: table, rows: [["Stop", "Bus 1", "Bus 2", "Bus 3"], ["Leisure Centre", "13:30", "14:00", "14:30"], ["Park", "13:42", "14:12", "14:42"], ["Town Hall", "13:50", "14:20", "14:50"]] }
                answer: "30"
                hints:
                  - "First find when the 14:00 bus reaches the town hall."
                  - "It arrives at 14:20. Then 10 minutes walking."
                  - "14:30, which is 30 minutes after 14:00."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How long is lunch?"
                show: { drawn: table, rows: [["Activity", "Start", "End"], ["Football", "09:30", "10:45"], ["Snack", "10:45", "11:05"], ["Art", "11:05", "12:15"], ["Lunch", "12:15", "13:00"]] }
                options: ["45 minutes", "85 minutes", "1 hour 15 minutes"]
                answer: "45 minutes"
                hints: ["12:15 to 13:00: count on to the hour."]
              - id: l2-s2
                type: text_input
                text: "Leo gets to the station at 10:12. Trains leave at 09:40, 10:10 and 10:40. How many minutes does he wait?"
                say: "Leo gets to the station at ten twelve. Trains leave at nine forty, ten ten and ten forty. How many minutes does he wait?"
                answer: "28"
                hints: ["The 10:10 train has just gone."]
              - id: l2-s3
                type: multiple_choice
                text: "A film starts at 19:30. What is that in the 12-hour clock?"
                options: ["7:30 pm", "9:30 pm", "7:30 am"]
                answer: "7:30 pm"
                hints: ["19 − 12."]
              - id: l2-s4
                type: true_false
                text: "The bus leaves the station every 15 minutes, so Bus 5 leaves at 07:45."
                show: { drawn: table, rows: [["Stop", "Bus 1", "Bus 2", "Bus 3", "Bus 4"], ["Station", "06:45", "07:00", "07:15", "07:30"], ["Hospital", "06:57", "07:12", "07:27", "07:42"]] }
                answer: true
                hints: ["07:30 and 15 more minutes."]
              - id: l2-s5
                type: multiple_choice
                text: "Ruby must be at the harbour by 16:00. Which is the last tram she can take from the zoo?"
                show: { drawn: table, rows: [["Stop", "Tram 1", "Tram 2", "Tram 3"], ["Zoo", "15:15", "15:35", "15:55"], ["Museum", "15:24", "15:44", "16:04"], ["Harbour", "15:33", "15:53", "16:13"]] }
                options: ["Tram 2", "Tram 1", "Tram 3"]
                answer: "Tram 2"
                hints: ["Look in the Harbour row for the time just before 16:00."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How long is art?"
                show: { drawn: table, rows: [["Activity", "Start", "End"], ["Football", "09:30", "10:45"], ["Snack", "10:45", "11:05"], ["Art", "11:05", "12:15"], ["Lunch", "12:15", "13:00"]] }
                options: ["1 hour 10 minutes", "1 hour 50 minutes", "110 minutes"]
                answer: "1 hour 10 minutes"
              - id: l2-n2
                type: text_input
                text: "Isla gets to the bus stop at 17:52. Buses leave at 17:30, 17:50, 18:10 and 18:30. How many minutes does she wait?"
                say: "Isla gets to the bus stop at seventeen fifty-two. Buses leave at seventeen thirty, seventeen fifty, eighteen ten and eighteen thirty. How many minutes does she wait?"
                answer: "18"
              - id: l2-n3
                type: multiple_choice
                text: "The museum closes at 16:30. What is that in the 12-hour clock?"
                options: ["4:30 pm", "6:30 pm", "4:30 am"]
                answer: "4:30 pm"
              - id: l2-n4
                type: text_input
                text: "Football starts at 09:30 and the club ends at 13:00. How long is the club? Type the missing minutes: 3 hours and _ minutes."
                answer: "30"
              - id: l2-n5
                type: true_false
                text: "Ali leaves Ashford on Train 1 and waits 15 minutes at Dover. He is ready to go at 10:00."
                show: { drawn: table, rows: [["Station", "Train 1", "Train 2", "Train 3"], ["Ashford", "09:05", "10:05", "11:05"], ["Folkestone", "09:25", "10:25", "11:25"], ["Dover", "09:45", "10:45", "11:45"]] }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "When is Bus C at Market Square?"
            show: { drawn: table, rows: [["Stop", "Bus A", "Bus B", "Bus C"], ["Station", "07:10", "07:40", "08:10"], ["Market Square", "07:18", "07:48", "08:18"], ["High Street", "07:25", "07:55", "08:25"], ["School", "07:32", "08:02", "08:32"]] }
            options: ["08:18", "08:10", "07:48"]
            answer: "08:18"
          - id: l2-c2
