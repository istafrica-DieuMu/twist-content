# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.complex-buildings
skill: math.solids.complex-buildings
curriculum: en-GB
language: en
title:
  de: Komplexere Würfelgebäude
  en: Bigger cube buildings
summary: >
  Lesson 1 reads plans with three rows and up to three columns, counts
  every cube from the plan (also the ones the drawing hides), matches a
  plan to its building and back, where front and back or left and right
  are easily swapped, and works out how many cubes a cuboid still needs;
  lesson 2 finds the view from the front, from the right and from above
  straight from the plan (the tallest tower in each column, or in each
  row), and ends with the skill check. Building with real cubes waits for
  a hands-on task.
metadata:
  year: year-5
  topic: { de: Körper, en: 3D shapes }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.solids.cube-buildings, math.space.views]
  also_practises: [math.space.views]
  vocabulary: { en: [cube, cube building, plan, row, column, front, back, hidden, cuboid, view, from the front, from the right, from above] }
  forms: [text, audio, drawn]
  drawn: [cubes]
  facets: []
  parts:
    - { id: count, what: { de: die Würfel eines Gebäudes bestimmen und auch die verdeckten zählen, en: counting the cubes of a building and the hidden ones too } }
    - { id: match, what: { de: Bauplan und Gebäude einander zuordnen, en: matching a plan and its building } }
    - { id: views, what: { de: "die Ansichten von vorne, von rechts und von oben bestimmen", en: "finding the views from the front, from the right and from above" } }
  misconceptions:
    - id: counts-only-visible
      what: Counts only the cubes that can be seen in the drawing, or counts the squares of the plan instead of adding the numbers
      addressed: lesson 1 Learn counts from the plan and says the drawing hides cubes; l1-f1 and l1-f3 have feedback, l1-s1, l1-s3, l1-n1, l1-c3 and l2-c1 ask again
    - id: plan-rows-swapped
      what: Reads the top row of the plan as the front, or swaps left and right when matching a plan to its building
      addressed: lesson 1 Learn names the rows back, middle and front; l1-f2 has feedback on both swaps, l1-f4, l1-s2, l1-s4, l1-n2, l1-c2 and l2-c2 offer them
    - id: view-adds-numbers
      what: Adds the numbers of a column for the view from the front instead of taking the tallest tower, or takes only the front row
      addressed: lesson 2 Learn takes the tallest tower in each column and in each row; l2-f1, l2-f2 and l2-f4 have feedback on adding and on the front row, l2-s1, l2-s5, l2-n1 and l2-c3 offer both
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Baupläne und Gebäude", en: "Plans and buildings" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many cubes do you need for this building?"
            show: { drawn: cubes, plan: [[2, 1], [1, 3]], mode: plan, colour: blue }
            options: ["7", "4", "6"]
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Which is the view from the front?"
            show: { drawn: cubes, plan: [[1, 2], [2, 1]], mode: building, colour: blue }
            options:
              - { drawn: cubes, plan: [[1, 2], [2, 1]], mode: front, colour: blue, key: front }
              - { drawn: cubes, plan: [[2, 1]], mode: front, colour: blue, key: front-row }
            answer: front
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A plan with three rows"
            say: "This plan has three rows. The top row is the back of the building, then the middle row, and the bottom row is the front. Each number says how many cubes are stacked on that square. A square with no number stays empty."
            show: { drawn: cubes, plan: [[1, 2, 2], [0, 3, 1], [1, 1, 0]], mode: plan, colour: orange }
          - text: "The building"
            say: "Here is the same building drawn from the front and a little to the side. Some cubes are hidden behind the towers at the front."
            show: { drawn: cubes, plan: [[1, 2, 2], [0, 3, 1], [1, 1, 0]], mode: building, colour: orange }
          - text: "back 1 + 2 + 2, middle 3 + 1, front 1 + 1\n5 + 4 + 2 = 11 cubes"
            say: "How many cubes are there? In the drawing it is easy to miss the hidden ones, but the plan shows them all. Add row by row: five at the back, four in the middle, two at the front. That is eleven cubes."
          - text: "Matching a plan and a building"
            say: "When you match a plan to a building, check two things. Is the back really at the back, at the top of the plan? Is the left really on the left? Find the tallest tower first, then check the rest."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many cubes do you need for this building?"
                show: { drawn: cubes, plan: [[2, 1, 2], [1, 0, 1], [3, 1, 0]], mode: plan, colour: green }
                options: ["11", "7", "3"]
                answer: "11"
                feedback:
                  "7": "7 is the number of squares with cubes on. Add the numbers in the squares."
                hints:
                  - "Add up row by row."
                  - "Back 2 + 1 + 2 = 5, middle 1 + 1 = 2, front 3 + 1 = 4."
                  - "5 + 2 + 4 = 11."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Here is the plan. Which building matches it?"
                show: { drawn: cubes, plan: [[1, 3], [2, 1]], mode: plan, colour: red }
                options:
                  - { drawn: cubes, plan: [[1, 3], [2, 1]], mode: building, colour: red, key: correct }
                  - { drawn: cubes, plan: [[2, 1], [1, 3]], mode: building, colour: red, key: front-back }
                  - { drawn: cubes, plan: [[3, 1], [1, 2]], mode: building, colour: red, key: left-right }
                answer: correct
                feedback:
                  front-back: "Here the front and the back are swapped. The top row of the plan is the back."
                  left-right: "Here left and right are swapped. The tall tower is at the back on the right."
                hints:
                  - "Find the tallest tower in the plan first."
                  - "The 3 is in the top row on the right, so at the back on the right."
                  - "Pick the building with the tall tower at the back on the right."
              - id: l1-f3
                type: multiple_choice
                text: "Every tower in this building is 3 cubes tall. How many cubes are there?"
                show: { drawn: cubes, plan: [[3, 3], [3, 3]], mode: building, colour: yellow }
                options: ["12", "9", "6"]
                answer: "12"
                feedback:
                  "6": "There are towers at the back too, hidden behind the front ones."
                  "9": "Some cubes are hidden. There are 4 towers of 3 cubes."
                hints:
                  - "How many towers are there, at the front and at the back?"
                  - "There are 4 towers. Each has 3 cubes."
                  - "4 × 3 = 12."
              - id: l1-f4
                type: true_false
                text: "The tallest tower is at the front on the left. Is that true?"
                show: { drawn: cubes, plan: [[1, 0, 2], [3, 1, 1]], mode: plan, colour: purple }
                answer: true
                hints:
                  - "The bottom row of the plan is the front."
                  - "The 3 is in the bottom row, on the left."
                  - "Yes, that is true."
              - id: l1-f5
                type: multiple_choice
                text: "You want to turn this building into a cuboid 2 cubes tall. How many more cubes do you need?"
                show: { drawn: cubes, plan: [[2, 1], [1, 2]], mode: plan, colour: blue }
                options: ["2", "8", "6"]
                answer: "2"
                feedback:
                  "8": "8 cubes is the whole cuboid. Some cubes are there already."
                hints:
                  - "A cuboid 2 tall needs a 2 on every square."
                  - "That is 4 squares × 2 = 8 cubes. There are 6."
                  - "8 − 6 = 2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many cubes do you need for this building?"
                show: { drawn: cubes, plan: [[1, 1, 1], [2, 2, 2], [3, 0, 1]], mode: plan, colour: green }
                options: ["13", "8", "9"]
                answer: "13"
                hints: ["Add row by row: 3, then 6, then 4."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Here is the building. Which plan matches it?"
                show: { drawn: cubes, plan: [[1, 2], [3, 1]], mode: building, colour: orange }
                options:
                  - { drawn: cubes, plan: [[1, 2], [3, 1]], mode: plan, colour: orange, key: correct }
                  - { drawn: cubes, plan: [[3, 1], [1, 2]], mode: plan, colour: orange, key: front-back }
                  - { drawn: cubes, plan: [[2, 1], [1, 3]], mode: plan, colour: orange, key: left-right }
                answer: correct
                hints: ["The tall tower is at the front on the left, so the 3 goes in the bottom row on the left."]
              - id: l1-s3
                type: multiple_choice
                text: "How many cubes are in this building?"
                show: { drawn: cubes, plan: [[2, 2, 2], [1, 1, 1]], mode: building, colour: red }
                options: ["9", "6", "3"]
                answer: "9"
                hints: ["The taller back row is partly hidden: 3 towers of 2 at the back."]
              - id: l1-s4
                type: true_false
                text: "In a plan, the bottom row is the back of the building. Is that true?"
                answer: false
                hints: ["Imagine standing at the bottom of the plan, looking up at it."]
              - id: l1-s5
                type: multiple_choice
                text: "You want to turn this building into a cuboid 3 cubes tall. How many more cubes do you need?"
                show: { drawn: cubes, plan: [[3, 2], [3, 1]], mode: plan, colour: purple }
                options: ["3", "12", "9"]
                answer: "3"
                hints: ["The cuboid needs 4 × 3 = 12 cubes. Count what is there."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many cubes do you need for this building?"
                show: { drawn: cubes, plan: [[2, 0, 1], [1, 2, 1], [1, 1, 3]], mode: plan, colour: blue }
                options: ["12", "8", "9"]
                answer: "12"
              - id: l1-n2
                type: image_multiple_choice
                text: "Here is the plan. Which building matches it?"
                show: { drawn: cubes, plan: [[2, 1, 1], [1, 1, 3]], mode: plan, colour: green }
                options:
                  - { drawn: cubes, plan: [[2, 1, 1], [1, 1, 3]], mode: building, colour: green, key: correct }
                  - { drawn: cubes, plan: [[1, 1, 3], [2, 1, 1]], mode: building, colour: green, key: front-back }
                  - { drawn: cubes, plan: [[1, 1, 2], [3, 1, 1]], mode: building, colour: green, key: left-right }
                answer: correct
              - id: l1-n3
                type: text_input
                text: "How many cubes do you need for this building?"
                show: { drawn: cubes, plan: [[3, 3, 1], [2, 1, 0], [1, 0, 0]], mode: plan, colour: orange }
                answer: "11"
              - id: l1-n4
                type: multiple_choice
                text: "Where is the tallest tower?"
                show: { drawn: cubes, plan: [[1, 1, 4], [2, 1, 1]], mode: plan, colour: red }
                options: ["at the back on the right", "at the front on the right", "at the back on the left"]
                answer: "at the back on the right"
              - id: l1-n5
                type: text_input
                text: "A building has 10 cubes. It should become a cuboid 3 cubes wide, 2 cubes deep and 2 cubes tall. How many more cubes are needed?"
                answer: "2"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many cubes do you need for this building?"
            show: { drawn: cubes, plan: [[1, 2], [2, 3], [1, 1]], mode: plan, colour: purple }
            options: ["10", "6", "8"]
            answer: "10"
          - id: l1-c2
            type: image_multiple_choice
            text: "Here is the building. Which plan matches it?"
            show: { drawn: cubes, plan: [[3, 1, 1], [1, 1, 2]], mode: building, colour: blue }
            options:
              - { drawn: cubes, plan: [[3, 1, 1], [1, 1, 2]], mode: plan, colour: blue, key: correct }
              - { drawn: cubes, plan: [[1, 1, 2], [3, 1, 1]], mode: plan, colour: blue, key: front-back }
              - { drawn: cubes, plan: [[1, 1, 3], [2, 1, 1]], mode: plan, colour: blue, key: left-right }
            answer: correct
          - id: l1-c3
            type: multiple_choice
            text: "How many cubes are in this building?"
            show: { drawn: cubes, plan: [[3, 2], [2, 1]], mode: building, colour: green }
            options: ["8", "6", "5"]
            answer: "8"
          - id: l1-c4
            type: text_input
            text: "How many cubes do you need for this building?"
            show: { drawn: cubes, plan: [[1, 2, 1], [0, 2, 2], [3, 1, 0]], mode: plan, colour: red }
            answer: "12"
          - id: l1-c5
            type: true_false
            text: "The tallest tower is at the back on the left. Is that true?"
            show: { drawn: cubes, plan: [[1, 2, 1], [3, 1, 0]], mode: plan, colour: orange }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "You want to turn this building into a cuboid 3 cubes wide, 2 cubes deep and 2 cubes tall. How many more cubes do you need?"
            show: { drawn: cubes, plan: [[2, 1, 2], [1, 2, 0]], mode: plan, colour: blue }
            options: ["4", "12", "8"]
            answer: "4"

  - n: 2
    title: { de: "Ansichten aus dem Bauplan", en: "Views from the plan" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How many cubes do you need for this building?"
            show: { drawn: cubes, plan: [[2, 2], [1, 3]], mode: plan, colour: orange }
            options: ["8", "4", "7"]
            answer: "8"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Here is the plan. Which building matches it?"
            show: { drawn: cubes, plan: [[1, 2], [1, 1]], mode: plan, colour: red }
            options:
              - { drawn: cubes, plan: [[1, 2], [1, 1]], mode: building, colour: red, key: correct }
              - { drawn: cubes, plan: [[1, 1], [1, 2]], mode: building, colour: red, key: front-back }
              - { drawn: cubes, plan: [[2, 1], [1, 1]], mode: building, colour: red, key: left-right }
            answer: correct
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "From the front: the tallest tower in each column."
            say: "You can find the views of a building straight from its plan. Look at each column of the plan, from left to right. From the front you see the tallest tower in that column; the lower towers behind it are hidden. Here the columns give two, three and two."
            show: { drawn: cubes, plan: [[1, 3, 1], [2, 1, 2]], mode: plan, colour: green }
          - text: "The view from the front: 2, 3, 2"
            say: "So the view from the front is two cubes, then three, then two. Do not add the numbers in a column, and do not look only at the front row."
            show: { drawn: cubes, plan: [[1, 3, 1], [2, 1, 2]], mode: front, colour: green }
          - text: "From the right: the tallest tower in each row.\nBack row 3, front row 2"
            say: "From the right you look along the rows. You see the tallest tower in each row: three in the back row and two in the front row."
            show: { drawn: cubes, plan: [[1, 3, 1], [2, 1, 2]], mode: side, colour: green }
          - text: "From above: every square that has cubes on it."
            say: "From above you see one square for every place that has cubes, however tall the tower is. You cannot see the heights from above."
            show: { drawn: cubes, plan: [[1, 3, 1], [2, 1, 2]], mode: top, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Here is the plan. Which is the view from the front?"
                show: { drawn: cubes, plan: [[2, 1, 1], [1, 1, 3]], mode: plan, colour: blue }
                options:
                  - { drawn: cubes, plan: [[2, 1, 1], [1, 1, 3]], mode: front, colour: blue, key: correct }
                  - { drawn: cubes, plan: [[3, 2, 4]], mode: front, colour: blue, key: adds }
                  - { drawn: cubes, plan: [[1, 1, 3]], mode: front, colour: blue, key: front-row }
                answer: correct
                feedback:
                  adds: "This view adds the numbers in each column. From the front you only see the tallest tower."
                  front-row: "This is just the front row. The 2 at the back on the left is taller than the 1 in front of it."
                hints:
                  - "Take the tallest tower in each column."
                  - "Left column: 2 and 1, so 2. Middle: 1. Right: 1 and 3, so 3."
                  - "The view is 2, 1, 3."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "In the view from the front, how many cubes tall is the middle column?"
                show: { drawn: cubes, plan: [[1, 4, 1], [2, 2, 0]], mode: plan, colour: red }
                options: ["4", "6", "2"]
                answer: "4"
                feedback:
                  "6": "You added 4 and 2. From the front you see only the tallest tower."
                  "2": "That is the front tower only. The tower of 4 behind it sticks up above it."
                hints:
                  - "Look at the middle column of the plan."
                  - "It has a 4 at the back and a 2 at the front."
                  - "The tallest is 4."
              - id: l2-f3
                type: image_multiple_choice
                text: "Here is the building. Which is the view from above?"
                show: { drawn: cubes, plan: [[1, 0, 2], [3, 1, 0]], mode: building, colour: orange }
                options:
                  - { drawn: cubes, plan: [[1, 0, 2], [3, 1, 0]], mode: top, colour: orange, key: correct }
                  - { drawn: cubes, plan: [[1, 1, 2], [3, 1, 1]], mode: top, colour: orange, key: full }
                  - { drawn: cubes, plan: [[2, 0, 1], [0, 1, 3]], mode: top, colour: orange, key: mirrored }
                answer: correct
                hints:
                  - "From above you see every square that has cubes."
                  - "Back row: left and right. Front row: left and middle."
                  - "Pick the view with a gap in the middle at the back and on the right at the front."
              - id: l2-f4
                type: multiple_choice
                text: "Seen from the right, how many cubes tall is the back row?"
                show: { drawn: cubes, plan: [[1, 3, 2], [2, 1, 1]], mode: plan, colour: purple }
                options: ["3", "6", "1"]
                answer: "3"
                feedback:
                  "6": "You added the back row. From the right you see only its tallest tower."
                hints:
                  - "From the right you see the tallest tower in each row."
                  - "The back row is 1, 3, 2."
                  - "The tallest is 3."
              - id: l2-f5
                type: true_false
                text: "The view from the front shows only the front row. Is that true?"
                answer: false
                hints:
                  - "Can a tall tower at the back be seen over a low one?"
                  - "Yes, it sticks up behind it."
                  - "No. The view shows the tallest tower in each column."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Here is the building. Which is the view from the front?"
                show: { drawn: cubes, plan: [[1, 2], [3, 1]], mode: building, colour: green }
                options:
                  - { drawn: cubes, plan: [[1, 2], [3, 1]], mode: front, colour: green, key: correct }
                  - { drawn: cubes, plan: [[4, 3]], mode: front, colour: green, key: adds }
                  - { drawn: cubes, plan: [[3, 1]], mode: front, colour: green, key: front-row }
                answer: correct
                hints: ["Left column: 1 and 3. Right column: 2 and 1. Take the tallest of each."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Here is the building. Which is the view from above?"
                show: { drawn: cubes, plan: [[2, 0], [1, 1]], mode: building, colour: red }
                options:
                  - { drawn: cubes, plan: [[2, 0], [1, 1]], mode: top, colour: red, key: correct }
                  - { drawn: cubes, plan: [[1, 1], [1, 1]], mode: top, colour: red, key: full }
                  - { drawn: cubes, plan: [[0, 2], [1, 1]], mode: top, colour: red, key: mirrored }
                answer: correct
                hints: ["The back row has cubes only on the left."]
              - id: l2-s3
                type: multiple_choice
                text: "Seen from the right, how many cubes tall is the front row?"
                show: { drawn: cubes, plan: [[2, 2], [1, 3]], mode: plan, colour: blue }
                options: ["3", "4", "1"]
                answer: "3"
                hints: ["The front row is the bottom row of the plan: 1 and 3."]
              - id: l2-s4
                type: multiple_choice
                text: "Which view never shows how tall the towers are?"
                options: ["from above", "from the front", "from the right"]
                answer: "from above"
                hints: ["From which side do you look down on the tops?"]
              - id: l2-s5
                type: multiple_choice
                text: "How many squares does the view from the front have altogether?"
                show: { drawn: cubes, plan: [[1, 2, 1], [3, 1, 1]], mode: plan, colour: orange }
                options: ["6", "9", "5"]
                answer: "6"
                hints: ["Find the tallest in each column, then add those."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Here is the plan. Which is the view from the front?"
                show: { drawn: cubes, plan: [[2, 2, 1], [1, 0, 3]], mode: plan, colour: purple }
                options:
                  - { drawn: cubes, plan: [[2, 2, 1], [1, 0, 3]], mode: front, colour: purple, key: correct }
                  - { drawn: cubes, plan: [[3, 2, 4]], mode: front, colour: purple, key: adds }
                  - { drawn: cubes, plan: [[1, 0, 3]], mode: front, colour: purple, key: front-row }
                answer: correct
              - id: l2-n2
                type: multiple_choice
                text: "Seen from the right, how many cubes tall is the back row?"
                show: { drawn: cubes, plan: [[1, 1, 1], [2, 0, 1]], mode: plan, colour: green }
                options: ["1", "3", "2"]
                answer: "1"
              - id: l2-n3
                type: image_multiple_choice
                text: "Here is the building. Which is the view from above?"
                show: { drawn: cubes, plan: [[1, 1, 0], [0, 2, 1]], mode: building, colour: blue }
                options:
                  - { drawn: cubes, plan: [[1, 1, 0], [0, 2, 1]], mode: top, colour: blue, key: correct }
                  - { drawn: cubes, plan: [[1, 1, 1], [1, 2, 1]], mode: top, colour: blue, key: full }
                  - { drawn: cubes, plan: [[0, 1, 1], [1, 2, 0]], mode: top, colour: blue, key: mirrored }
                answer: correct
              - id: l2-n4
                type: true_false
                text: "From the front, you see the tallest tower of each column. Is that true?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "How many squares does the view from above have?"
                show: { drawn: cubes, plan: [[3, 0, 1], [1, 2, 0], [0, 1, 1]], mode: plan, colour: red }
                options: ["6", "9", "3"]
                answer: "6"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: count
            type: multiple_choice
            text: "How many cubes do you need for this building?"
            show: { drawn: cubes, plan: [[2, 1, 3], [1, 1, 0], [2, 0, 1]], mode: plan, colour: orange }
            options: ["11", "7", "3"]
            answer: "11"
          - id: l2-c2
            part: match
            type: image_multiple_choice
            text: "Here is the plan. Which building matches it?"
            show: { drawn: cubes, plan: [[3, 1], [1, 2]], mode: plan, colour: purple }
            options:
              - { drawn: cubes, plan: [[3, 1], [1, 2]], mode: building, colour: purple, key: correct }
              - { drawn: cubes, plan: [[1, 2], [3, 1]], mode: building, colour: purple, key: front-back }
              - { drawn: cubes, plan: [[1, 3], [2, 1]], mode: building, colour: purple, key: left-right }
            answer: correct
          - id: l2-c3
            part: views
            type: image_multiple_choice
            text: "Here is the plan. Which is the view from the front?"
            show: { drawn: cubes, plan: [[1, 3], [2, 1]], mode: plan, colour: green }
