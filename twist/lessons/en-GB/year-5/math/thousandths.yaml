# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.thousandths
skill: math.decimals.thousandths
curriculum: en-GB
language: en
title:
  de: Tausendstel
  en: Thousandths
summary: >
  Thousandths as a hundredth split into ten equal parts, written as
  fractions over 1000 and as decimals with three places (9/1000 = 0.009).
  Lesson 1 reads and writes thousandths in a place value chart and names
  the value of each digit; lesson 2 relates thousandths to tenths and
  hundredths (0.1 = 0.100, 100 thousandths), partitions decimals, uses
  millimetres and grams as thousandths of a metre and a kilogram, and
  ends with the skill check.
metadata:
  year: year-5
  topic: { de: Dezimalzahlen, en: Decimals }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.decimals.compare-round]
  also_practises: [math.decimals.hundredths]
  vocabulary: { en: [thousandth, hundredth, tenth, decimal point, decimal place, digit, value, partition, millimetre, gram] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart]
  facets: [number-format]
  misconceptions:
    - id: places-mixed
      what: Names the third decimal place as hundredths, or the second as thousandths
      addressed: lesson 1 Learn names each column; l1-f2 has feedback, l1-s2, l1-n2, l1-c2 and l2-c2 ask a digit's value
    - id: missing-zeros
      what: Writes 9/1000 as 0.09 or 23/1000 as 0.23, leaving out a zero place holder
      addressed: lesson 1 Learn writes 7/1000 as 0.007; l1-f3 has feedback, l1-s3, l1-s4, l1-c3, l2-w2 and l2-c3 need a zero
    - id: longer-is-bigger
      what: Thinks 0.700 is more than 0.7, or that 0.3 is 30 thousandths
      addressed: lesson 2 Learn shows 0.1 = 0.10 = 0.100; l2-f1 and l2-f3 have feedback, l2-s3, l2-n4, l2-n5 and l2-c4 ask it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Tausendstel in der Stellentafel, en: Thousandths in the chart }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is greater, 0.45 or 0.5?"
            options: ["0.5", "0.45"]
            answer: "0.5"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Round 3.7 to the nearest whole number."
            options: ["4", "3", "3.5"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1/1000 = 0.001"
            say: "Split one hundredth into ten equal parts. Each part is one thousandth. A whole is a thousand thousandths. We write one thousandth as zero point zero zero one, with three places after the decimal point."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [0, 0, 0, 1] }
          - text: "2.357\n2 ones, 3 tenths, 5 hundredths, 7 thousandths"
            say: "Two point three five seven. The first place after the decimal point is tenths, the second is hundredths and the third is thousandths. So the seven is worth seven thousandths."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [2, 3, 5, 7] }
          - text: "7/1000 = 0.007\n45/1000 = 0.045\n381/1000 = 0.381"
            say: "Seven thousandths is zero point zero zero seven: there are no tenths and no hundredths, so those places hold zeros. Forty-five thousandths is zero point zero four five. Three hundred and eighty-one thousandths is zero point three eight one."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [0, 4, 2, 6] }
                options: ["0.426", "4.26", "0.624"]
                answer: "0.426"
                hints:
                  - "Read the chart from left to right. The decimal point comes after the ones."
                  - "0 ones, 4 tenths, 2 hundredths, 6 thousandths."
                  - "The number is 0.426."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is the 7 in 3.147 worth?"
                options: ["7 tenths", "7 hundredths", "7 thousandths"]
                answer: "7 thousandths"
                keep_order: true
                feedback:
                  "7 hundredths": "The 7 is in the third place after the decimal point. That is the thousandths place."
                hints:
                  - "Count the places after the decimal point."
                  - "1 is in the tenths place, 4 in the hundredths place. The 7 is in the third place."
                  - "The third place is thousandths: 7 thousandths."
              - id: l1-f3
                type: multiple_choice
                text: "Write 9/1000 as a decimal."
                say: "Write nine thousandths as a decimal."
                options: ["0.009", "0.09", "0.9"]
                answer: "0.009"
                feedback:
                  "0.09": "0.09 is nine hundredths. Thousandths are in the third place: 0.009."
                hints:
                  - "Thousandths go in the third place after the decimal point."
                  - "There are no tenths and no hundredths, so those places are 0."
                  - "0.009."
              - id: l1-f4
                type: fill_in_blank
                text: "Write the number."
                frame: "4 ones, 0 tenths, 6 hundredths, 2 thousandths = _"
                options: ["4.062", "4.62", "4.602"]
                answer: ["4.062"]
                hints:
                  - "Write the digits in order: ones, tenths, hundredths, thousandths."
                  - "4, then the decimal point, then 0, 6, 2."
                  - "4.062."
              - id: l1-f5
                type: multiple_choice
                text: "In which number is the 5 worth 5 thousandths?"
                options: ["2.315", "2.153", "2.531"]
                answer: "2.315"
                hints:
                  - "The 5 must be in the third place after the decimal point."
                  - "Look at the last digit of each number."
                  - "In 2.315 the 5 is in the thousandths place."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [1, 0, 7, 4] }
                options: ["1.074", "1.74", "1.704"]
                answer: "1.074"
                hints: ["There are 0 tenths. Keep the zero."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the 3 in 6.238 worth?"
                options: ["3 tenths", "3 hundredths", "3 thousandths"]
                answer: "3 hundredths"
                keep_order: true
                hints: ["Which place after the decimal point is the 3 in?"]
              - id: l1-s3
                type: multiple_choice
                text: "Write 23/1000 as a decimal."
                say: "Write twenty-three thousandths as a decimal."
                options: ["0.023", "0.23", "2.3"]
                answer: "0.023"
                hints: ["The last digit must be in the thousandths place."]
              - id: l1-s4
                type: text_input
                keyboard: decimal
                text: "Write 5/1000 as a decimal."
                say: "Write five thousandths as a decimal."
                answer: "0.005"
                hints: ["Three places after the decimal point. The 5 goes in the last one."]
              - id: l1-s5
                type: true_false
                text: "Is it true? In 0.888, every 8 is worth the same."
                answer: false
                hints: ["Each 8 is in a different place."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                keyboard: decimal
                text: "3 ones, 2 tenths, 0 hundredths and 9 thousandths. Write the number."
                answer: "3.209"
              - id: l1-n2
                type: multiple_choice
                text: "What is the 9 in 5.629 worth?"
                options: ["9 tenths", "9 hundredths", "9 thousandths"]
                answer: "9 thousandths"
                keep_order: true
              - id: l1-n3
                type: multiple_choice
                text: "Which number is four hundred and six thousandths?"
                options: ["0.406", "0.46", "4.06"]
                answer: "0.406"
              - id: l1-n4
                type: text_input
                keyboard: decimal
                text: "Write 147/1000 as a decimal."
                say: "Write one hundred and forty-seven thousandths as a decimal."
                answer: "0.147"
              - id: l1-n5
                type: image_multiple_choice
                text: "Which chart shows 0.308?"
                options:
                  - { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [0, 3, 0, 8], key: "0.308" }
                  - { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [0, 3, 8, 0], key: "0.380" }
                  - { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [0, 0, 3, 8], key: "0.038" }
                answer: "0.308"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [0, 5, 1, 3] }
            options: ["0.513", "5.13", "0.315"]
            answer: "0.513"
          - id: l1-c2
            type: multiple_choice
            text: "What is the 4 in 7.294 worth?"
            options: ["4 tenths", "4 hundredths", "4 thousandths"]
            answer: "4 thousandths"
            keep_order: true
          - id: l1-c3
            type: multiple_choice
            text: "Write 61/1000 as a decimal."
            say: "Write sixty-one thousandths as a decimal."
            options: ["0.061", "0.61", "6.1"]
            answer: "0.061"

  - n: 2
    title: { de: "Zehntel, Hundertstel und Tausendstel", en: "Tenths, hundredths and thousandths" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [2, 0, 4, 5] }
            options: ["2.045", "2.45", "2.405"]
            answer: "2.045"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Write 3/1000 as a decimal."
            say: "Write three thousandths as a decimal."
            options: ["0.003", "0.03", "0.3"]
            answer: "0.003"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 = 10 tenths = 100 hundredths = 1000 thousandths"
            say: "Each place is ten times the place to its right. One whole is ten tenths, a hundred hundredths, or a thousand thousandths."
          - text: "0.1 = 0.10 = 0.100\n1 tenth = 10 hundredths = 100 thousandths"
            say: "One tenth is the same as ten hundredths and the same as one hundred thousandths. Zeros on the end after the decimal point do not change the number: zero point one, zero point one zero and zero point one zero zero are all equal."
          - text: "0.473 = 0.4 + 0.07 + 0.003\n= 473 thousandths"
            say: "Zero point four seven three is four tenths, seven hundredths and three thousandths. All together that is four hundred and seventy-three thousandths."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [0, 4, 7, 3] }
          - text: "1 m = 1000 mm, so 1 mm = 0.001 m\n1 kg = 1000 g, so 250 g = 0.250 kg = 0.25 kg"
            say: "Thousandths are everywhere in measures. A millimetre is one thousandth of a metre. A gram is one thousandth of a kilogram, so two hundred and fifty grams is zero point two five kilograms."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many thousandths make one tenth?"
                options: ["100", "10", "1000"]
                answer: "100"
                feedback:
                  "10": "10 thousandths make one hundredth. One tenth is 10 hundredths, so it is 100 thousandths."
                hints:
                  - "Go one place at a time: tenths, then hundredths, then thousandths."
                  - "1 tenth = 10 hundredths, and each hundredth is 10 thousandths."
                  - "10 × 10 = 100 thousandths."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Partition 0.586."
                frame: "0.586 = _ + _ + _"
                options: ["0.5", "0.8", "0.08", "0.06", "0.006"]
                answer: ["0.5", "0.08", "0.006"]
                hints:
                  - "Each digit has its own value: tenths, hundredths, thousandths."
                  - "5 tenths, 8 hundredths, 6 thousandths."
                  - "0.5 + 0.08 + 0.006."
              - id: l2-f3
                type: multiple_choice
                text: "Which is the same as 0.7?"
                options: ["0.700", "0.007", "0.070"]
                answer: "0.700"
                feedback:
                  "0.007": "0.007 is seven thousandths. The 7 has to stay in the tenths place."
                hints:
                  - "Where is the 7 in 0.7?"
                  - "The 7 is in the tenths place. Zeros can go after it."
                  - "0.700 is still 7 tenths."
              - id: l2-f4
                type: multiple_choice
                text: "How many thousandths are in 0.25?"
                options: ["250", "25", "2500"]
                answer: "250"
                hints:
                  - "Write 0.25 with three decimal places."
                  - "0.25 = 0.250."
                  - "0.250 is 250 thousandths."
              - id: l2-f5
                type: text_input
                keyboard: decimal
                text: "A beetle is 6 mm long. 1 mm = 0.001 m. Write its length in metres."
                answer: "0.006"
                hints:
                  - "6 mm is 6 thousandths of a metre."
                  - "Thousandths go in the third place after the decimal point."
                  - "0.006 m."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many hundredths make 0.3?"
                options: ["30", "3", "300"]
                answer: "30"
                hints: ["0.3 = 0.30."]
              - id: l2-s2
                type: fill_in_blank
                text: "Partition 2.904."
                frame: "2.904 = 2 + _ + _"
                options: ["0.9", "0.09", "0.04", "0.004"]
                answer: ["0.9", "0.004"]
                hints: ["There are 0 hundredths."]
              - id: l2-s3
                type: true_false
                text: "Is it true? 0.45 and 0.450 are the same number."
                answer: true
                hints: ["Does a zero at the end change the value of the 4 or the 5?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which number is 6 tenths, 2 hundredths and 8 thousandths?"
                options: ["0.628", "6.28", "0.826"]
                answer: "0.628"
                hints: ["Tenths first, then hundredths, then thousandths."]
              - id: l2-s5
                type: text_input
                text: "1 kg = 1000 g. How many grams is 0.375 kg?"
                answer: "375"
                hints: ["0.375 is 375 thousandths."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A bag of flour weighs 1.5 kg. How many grams is that?"
                answer: "1500"
              - id: l2-n2
                type: multiple_choice
                text: "A pencil is 0.145 m long. How many millimetres is that?"
                options: ["145 mm", "14.5 mm", "1450 mm"]
                answer: "145 mm"
              - id: l2-n3
                type: text_input
                keyboard: decimal
                text: "A runner's time is 9 seconds, 5 tenths, 8 hundredths and 1 thousandth. Write the time in seconds."
                answer: "9.581"
              - id: l2-n4
                type: multiple_choice
                text: "A recipe needs 40 thousandths of a litre of lemon juice. Which number is that, in litres?"
                options: ["0.04", "0.4", "0.004"]
                answer: "0.04"
              - id: l2-n5
                type: true_false
                text: "Is it true? 0.3 kg is the same as 30 thousandths of a kilogram."
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths, thousandths], values: [3, 6, 0, 2] }
            options: ["3.602", "3.62", "3.206"]
            answer: "3.602"
          - id: l2-c2
            type: multiple_choice
            text: "What is the 2 in 4.213 worth?"
            options: ["2 tenths", "2 hundredths", "2 thousandths"]
            answer: "2 tenths"
            keep_order: true
          - id: l2-c3
            type: text_input
            keyboard: decimal
            text: "Write 59/1000 as a decimal."
            say: "Write fifty-nine thousandths as a decimal."
            answer: "0.059"
          - id: l2-c4
            type: multiple_choice
            text: "How many thousandths make 0.06?"
            options: ["60", "6", "600"]
            answer: "60"
          - id: l2-c5
            type: fill_in_blank
            text: "Partition 0.718."
            frame: "0.718 = _ + _ + _"
            options: ["0.7", "0.1", "0.01", "0.08", "0.008"]
            answer: ["0.7", "0.01", "0.008"]
