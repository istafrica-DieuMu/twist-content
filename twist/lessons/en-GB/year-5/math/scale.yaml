# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.scale
skill: math.shapes.scale
curriculum: en-GB
language: en
title:
  de: Vergrößern, verkleinern, Maßstab
  en: Scaling and plans
summary: >
  Lesson 1 enlarges and reduces rectangles and squares on squared paper
  by multiplying or dividing every side by the scale factor (2 by 1 at
  scale factor 3 is 6 by 3), against the mistake of adding the same
  number to every side; lesson 2 reads simple scales on plans and maps (1
  cm stands for 1 m, 1 cm stands for 500 m), from the plan to real life
  and back, and ends with the skill check. Drawing an enlarged shape on
  squared paper waits for a drawing task.
metadata:
  year: year-5
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.grid-drawing, math.mult-div.all-tables]
  also_practises: [math.length.cm-m]
  vocabulary: { en: [enlarge, reduce, scale factor, half the size, plan, map, scale, stands for, in real life] }
  forms: [text, audio, drawn]
  drawn: [grid, ruler]
  facets: [units]
  parts:
    - { id: enlarge, what: { de: Figuren auf Kästchenpapier vergrößern und verkleinern, en: enlarging and reducing shapes on squared paper } }
    - { id: plan-to-real, what: { de: mit dem Maßstab vom Plan auf die Wirklichkeit schließen, en: using a scale to go from a plan to real lengths } }
    - { id: real-to-plan, what: { de: mit dem Maßstab von der Wirklichkeit auf den Plan schließen, en: using a scale to go from real lengths to a plan } }
  misconceptions:
    - id: adds-instead-of-multiplies
      what: Enlarges by adding the same number of squares to every side (2 by 3 at scale factor 2 becomes 4 by 5) instead of multiplying every side
      addressed: lesson 1 Learn shows the 4 by 3 rectangle that adding makes; l1-f1, l1-f2 and l1-s2 offer the added sizes with feedback in l1-f1 and l1-f2, l1-f4, l1-n1, l1-c1 and l2-c1 offer them too, l1-f5 and l1-n3 ask about an added enlargement
    - id: plan-length-is-real-length
      what: Keeps the plan length as the real length, or uses the scale the wrong way round
      addressed: lesson 2 Learn turns 9 cm on the plan into 9 m; l2-f1 (with feedback), l2-f3, l2-s4 and l2-c2 offer the plan length, l2-f5, l2-s5 and l2-n3 go from real life to the plan
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Vergrößern und verkleinern", en: "Enlarging and reducing" }
    goal:
      de: "Vergrößere und verkleinere Rechtecke, indem du jede Seite malnimmst oder teilst, so wie 2 mal 1 Kästchen wird 6 mal 3."
      en: "Enlarge and shrink rectangles by multiplying or dividing every side, like 2 by 1 squares becomes 6 by 3."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "A side is 4 squares long. You double it. How long is it now?"
            options: ["8 squares", "6 squares", "4 squares"]
            answer: "8 squares"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "7 × 6 = _"
            answer: "42"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Scale factor 3: multiply every side by 3.\n2 by 1 becomes 6 by 3."
            say: "To enlarge a shape, multiply every side by the scale factor. This rectangle is 2 by 1, which means two squares wide and one square tall. Enlarged by scale factor 3 it is six squares wide and three squares tall. It is the same shape, just bigger."
            show: { drawn: grid, cols: 10, rows: 3, lines: [[0, 2, 2, 2], [2, 2, 2, 3], [2, 3, 0, 3], [0, 3, 0, 2], [4, 0, 10, 0], [10, 0, 10, 3], [10, 3, 4, 3], [4, 3, 4, 0]] }
          - text: "Do not add!\n2 by 1, add 3 to each side: 5 by 4. The wrong shape."
            say: "Adding three squares to every side would give five by four. That rectangle is nearly a square, so it is not the same shape any more. Always multiply."
            show: { drawn: grid, cols: 5, rows: 4, lines: [[0, 0, 5, 0], [5, 0, 5, 4], [5, 4, 0, 4], [0, 4, 0, 0]] }
          - text: "Reduce: divide every side.\n6 by 4 at half the size is 3 by 2."
            say: "To make a shape smaller, divide every side. Half the size means divide by two, so six by four becomes three by two. A third of the size means divide by three."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A rectangle is 3 by 1. Enlarge it by scale factor 2. How big is it now?"
                options: ["6 by 2", "5 by 3", "6 by 1"]
                answer: "6 by 2"
                feedback:
                  "5 by 3": "You added 2 to each side. Scale factor 2 means multiply each side by 2."
                  "6 by 1": "The height must be multiplied by 2 as well."
                hints:
                  - "Multiply every side by 2."
                  - "2 × 3 = 6 and 2 × 1 = 2."
                  - "6 by 2."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Which rectangle is this one enlarged by scale factor 3?"
                show: { drawn: grid, cols: 2, rows: 1, lines: [[0, 0, 2, 0], [2, 0, 2, 1], [2, 1, 0, 1], [0, 1, 0, 0]] }
                options:
                  - { drawn: grid, cols: 6, rows: 4, lines: [[0, 0, 6, 0], [6, 0, 6, 3], [6, 3, 0, 3], [0, 3, 0, 0]], key: correct }
                  - { drawn: grid, cols: 6, rows: 4, lines: [[0, 0, 5, 0], [5, 0, 5, 4], [5, 4, 0, 4], [0, 4, 0, 0]], key: added }
                  - { drawn: grid, cols: 6, rows: 4, lines: [[0, 0, 6, 0], [6, 0, 6, 1], [6, 1, 0, 1], [0, 1, 0, 0]], key: width-only }
                answer: correct
                feedback:
                  added: "This one has 3 squares added to each side. It is 5 by 4, nearly a square."
                  width-only: "Only the width is multiplied here. The height must be multiplied by 3 too."
                hints:
                  - "The rectangle is 2 by 1."
                  - "3 × 2 = 6 and 3 × 1 = 3."
                  - "Pick the rectangle that is 6 wide and 3 tall."
              - id: l1-f3
                type: multiple_choice
                text: "A square has sides 2 squares long. Enlarge it by scale factor 4. How long is each side now?"
                options: ["8 squares", "6 squares", "16 squares"]
                answer: "8 squares"
                hints:
                  - "Multiply the side by the scale factor."
                  - "4 × 2."
                  - "8 squares."
              - id: l1-f4
                type: multiple_choice
                text: "A rectangle is 8 by 4. Draw it half the size. How big is it?"
                options: ["4 by 2", "6 by 2", "4 by 4"]
                answer: "4 by 2"
                hints:
                  - "Halve every side."
                  - "Half of 8 is 4. Half of 4 is 2."
                  - "4 by 2."
              - id: l1-f5
                type: true_false
                text: "Max enlarges a 2 by 3 rectangle by scale factor 2. He draws it 4 by 5. Is that right?"
                answer: false
                hints:
                  - "Multiply both sides by 2."
                  - "2 × 2 = 4, but 2 × 3 = 6."
                  - "No. It should be 4 by 6. Max added 2 to the 3."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A rectangle is 4 by 1. Enlarge it by scale factor 3. How big is it now?"
                options: ["12 by 3", "7 by 4", "12 by 1"]
                answer: "12 by 3"
                hints: ["Multiply both sides by 3."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which rectangle is this one enlarged by scale factor 2?"
                show: { drawn: grid, cols: 1, rows: 2, lines: [[0, 0, 1, 0], [1, 0, 1, 2], [1, 2, 0, 2], [0, 2, 0, 0]] }
                options:
                  - { drawn: grid, cols: 3, rows: 4, lines: [[0, 0, 2, 0], [2, 0, 2, 4], [2, 4, 0, 4], [0, 4, 0, 0]], key: correct }
                  - { drawn: grid, cols: 3, rows: 4, lines: [[0, 0, 3, 0], [3, 0, 3, 4], [3, 4, 0, 4], [0, 4, 0, 0]], key: added }
                  - { drawn: grid, cols: 3, rows: 4, lines: [[0, 0, 2, 0], [2, 0, 2, 2], [2, 2, 0, 2], [0, 2, 0, 0]], key: width-only }
                answer: correct
                hints: ["The rectangle is 1 wide and 2 tall. Double both."]
              - id: l1-s3
                type: true_false
                text: "A 9 by 6 rectangle drawn at a third of the size is 3 by 2. Is that true?"
                answer: true
                hints: ["Divide both sides by 3."]
              - id: l1-s4
                type: multiple_choice
                text: "A 5 by 2 rectangle is enlarged to 15 by 6. What is the scale factor?"
                options: ["3", "10", "2"]
                answer: "3"
                hints: ["5 times what makes 15?"]
              - id: l1-s5
                type: text_input
                text: "A triangle has a base 4 squares long. It is enlarged by scale factor 5. How many squares long is the new base?"
                answer: "20"
                hints: ["5 × 4."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "A rectangle is 3 by 2. Enlarge it by scale factor 4. How big is it now?"
                options: ["12 by 8", "7 by 6", "12 by 2"]
                answer: "12 by 8"
              - id: l1-n2
                type: multiple_choice
                text: "A rectangle is 10 by 6. Draw it half the size. How big is it?"
                options: ["5 by 3", "8 by 4", "5 by 6"]
                answer: "5 by 3"
              - id: l1-n3
                type: true_false
                text: "Enlarging by scale factor 2 means adding 2 squares to every side. Is that true?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "A 3 by 3 square is enlarged to 12 by 12. What is the scale factor?"
                options: ["4", "9", "3"]
                answer: "4"
              - id: l1-n5
                type: text_input
                text: "A rectangle is 7 squares wide. It is enlarged by scale factor 6. How many squares wide is it now?"
                answer: "42"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A rectangle is 2 by 5. Enlarge it by scale factor 3. How big is it now?"
            options: ["6 by 15", "5 by 8", "6 by 5"]
            answer: "6 by 15"
          - id: l1-c2
            type: multiple_choice
            text: "A rectangle is 12 by 8. Draw it a quarter of the size. How big is it?"
            options: ["3 by 2", "8 by 4", "3 by 8"]
            answer: "3 by 2"
          - id: l1-c3
            type: true_false
            text: "Jas enlarges a 1 by 3 rectangle by scale factor 2. She draws it 2 by 6. Is that right?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "A rectangle is 4 by 3. Enlarge it by scale factor 5. How big is it now?"
            options: ["20 by 15", "9 by 8", "20 by 3"]
            answer: "20 by 15"
          - id: l1-c5
            type: multiple_choice
            text: "A 6 by 2 rectangle is enlarged to 18 by 6. What is the scale factor?"
            options: ["3", "12", "4"]
            answer: "3"
          - id: l1-c6
            type: image_multiple_choice
            text: "Which rectangle is this one drawn half the size?"
            show: { drawn: grid, cols: 4, rows: 2, lines: [[0, 0, 4, 0], [4, 0, 4, 2], [4, 2, 0, 2], [0, 2, 0, 0]] }
            options:
              - { drawn: grid, cols: 4, rows: 2, lines: [[0, 0, 2, 0], [2, 0, 2, 1], [2, 1, 0, 1], [0, 1, 0, 0]], key: correct }
              - { drawn: grid, cols: 4, rows: 2, lines: [[0, 0, 2, 0], [2, 0, 2, 2], [2, 2, 0, 2], [0, 2, 0, 0]], key: width-only }
              - { drawn: grid, cols: 4, rows: 2, lines: [[0, 0, 3, 0], [3, 0, 3, 1], [3, 1, 0, 1], [0, 1, 0, 0]], key: take-away-one }
            answer: correct

  - n: 2
    title: { de: "Maßstab auf Plänen", en: "Scales on plans" }
    goal:
      de: "Nutze den Maßstab auf Plänen und Karten, so wie 1 Zentimeter steht für 500 Meter, und rechne echte Längen aus."
      en: "Use the scale on plans and maps, like 1 centimetre stands for 500 metres, to work out real lengths."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A rectangle is 4 by 2. Enlarge it by scale factor 2. How big is it now?"
            options: ["8 by 4", "6 by 4", "8 by 2"]
            answer: "8 by 4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "A rectangle is 6 by 3. Draw it a third of the size. How big is it?"
            options: ["2 by 1", "4 by 1", "2 by 3"]
            answer: "2 by 1"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A plan of the classroom: 1 cm stands for 1 m.\n9 cm on the plan is 9 m in real life."
            say: "A plan shows a room or a building from above, much smaller than in real life. The scale tells you how much smaller. On this plan, one centimetre stands for one metre. The classroom is nine centimetres long on the plan, so it is nine metres long in real life."
          - text: "The table on the plan is 2 cm long.\nIn real life: 2 m."
            say: "Measure on the plan with a ruler. The table is two centimetres long on the plan. Each centimetre stands for one metre, so the real table is two metres long."
            show: { drawn: ruler, to: 10, length: 2, colour: blue }
          - text: "A map: 1 cm stands for 500 m.\n4 cm on the map: 4 × 500 m = 2000 m = 2 km"
            say: "Maps use bigger scales. On this map one centimetre stands for five hundred metres. Four centimetres on the map is four times five hundred metres, which is two thousand metres, or two kilometres."
          - text: "From real life to the plan:\n1 cm stands for 1 m, so a 6 m wall is drawn 6 cm long."
            say: "You can go the other way too. To draw a six metre wall on a plan where one centimetre stands for one metre, draw it six centimetres long."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "On a plan, 1 cm stands for 1 m. The hall is 12 cm long on the plan. How long is it in real life?"
                options: ["12 m", "12 cm", "1.2 m"]
                answer: "12 m"
                feedback:
                  "12 cm": "12 cm is the length on the plan. A real hall is much bigger."
                hints:
                  - "Each centimetre on the plan stands for 1 m."
                  - "12 cm on the plan, so 12 lots of 1 m."
                  - "12 m."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "On a plan, 1 cm stands for 2 m. A path is 5 cm long on the plan. How long is it in real life?"
                options: ["10 m", "5 m", "7 m"]
                answer: "10 m"
                feedback:
                  "7 m": "You added 2. Each of the 5 centimetres stands for 2 m, so multiply."
                hints:
                  - "Each centimetre stands for 2 m."
                  - "5 centimetres: 5 × 2 m."
                  - "10 m."
              - id: l2-f3
                type: multiple_choice
                text: "The strip is a wall on a plan where 1 cm stands for 1 m. How long is the real wall?"
                show: { drawn: ruler, to: 10, length: 6, colour: red }
                options: ["6 m", "6 cm", "60 m"]
                answer: "6 m"
                hints:
                  - "Read the length of the strip first."
                  - "The strip is 6 cm long."
                  - "6 cm on the plan is 6 m."
              - id: l2-f4
                type: multiple_choice
                text: "On a map, 1 cm stands for 500 m. The school is 3 cm from the park on the map. How far is it in real life?"
                options: ["1500 m", "503 m", "150 m"]
                answer: "1500 m"
                hints:
                  - "Each centimetre stands for 500 m."
                  - "3 × 500 m."
                  - "1500 m."
              - id: l2-f5
                type: multiple_choice
                text: "On a plan, 1 cm stands for 1 m. A bed is 2 m long. How long is it on the plan?"
                options: ["2 cm", "2 m", "20 cm"]
                answer: "2 cm"
                hints:
                  - "This time go from real life to the plan."
                  - "Each metre is drawn as 1 cm."
                  - "2 cm."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "On a plan, 1 cm stands for 5 m. A field is 8 cm long on the plan. How long is it in real life?"
                options: ["40 m", "13 m", "8 m"]
                answer: "40 m"
                hints: ["8 × 5 m."]
              - id: l2-s2
                type: true_false
                text: "On a plan where 1 cm stands for 1 m, everything looks smaller than in real life. Is that true?"
                answer: true
                hints: ["1 cm is much shorter than 1 m."]
              - id: l2-s3
                type: multiple_choice
                text: "The strip is a fence on a plan where 1 cm stands for 3 m. How long is the real fence?"
                show: { drawn: ruler, to: 10, length: 4, colour: green }
                options: ["12 m", "7 m", "4 m"]
                answer: "12 m"
                hints: ["The strip is 4 cm long. Each centimetre stands for 3 m."]
              - id: l2-s4
                type: multiple_choice
                text: "On a map, 1 cm stands for 1 km. Two villages are 7 cm apart on the map. How far apart are they really?"
                options: ["7 km", "7 cm", "70 km"]
                answer: "7 km"
                hints: ["Each centimetre stands for 1 km."]
              - id: l2-s5
                type: text_input
                text: "On a plan, 1 cm stands for 2 m. A garden is 18 m long. How many centimetres long is it on the plan?"
                answer: "9"
                hints: ["How many lots of 2 m are in 18 m?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "On a plan, 1 cm stands for 4 m. A pool is 6 cm long on the plan. How long is it in real life?"
                options: ["24 m", "10 m", "6 m"]
                answer: "24 m"
              - id: l2-n2
                type: multiple_choice
                text: "On a map, 1 cm stands for 500 m. A footpath is 5 cm long on the map. How long is it in real life?"
                options: ["2.5 km", "505 m", "25 km"]
                answer: "2.5 km"
              - id: l2-n3
                type: true_false
                text: "On a plan where 1 cm stands for 1 m, a 3 m sofa is drawn 30 cm long. Is that true?"
                answer: false
              - id: l2-n4
                type: text_input
                text: "The strip is the playground on a plan where 1 cm stands for 10 m. How many metres long is the real playground?"
                show: { drawn: ruler, to: 10, length: 7, colour: blue }
                answer: "70"
              - id: l2-n5
                type: multiple_choice
                text: "A room is 5 m long. On the plan it is 5 cm long. What does 1 cm stand for?"
                options: ["1 m", "5 m", "10 cm"]
                answer: "1 m"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: enlarge
            type: multiple_choice
            text: "A rectangle is 5 by 3. Enlarge it by scale factor 2. How big is it now?"
            options: ["10 by 6", "7 by 5", "10 by 3"]
            answer: "10 by 6"
          - id: l2-c2
            part: plan-to-real
            type: multiple_choice
            text: "On a plan, 1 cm stands for 1 m. The library is 8 cm long on the plan. How long is it in real life?"
            options: ["8 m", "8 cm", "80 m"]
            answer: "8 m"
          - id: l2-c3
            part: plan-to-real
            type: multiple_choice
            text: "On a plan, 1 cm stands for 3 m. A path is 6 cm long on the plan. How long is it in real life?"
            options: ["18 m", "9 m", "6 m"]
            answer: "18 m"
          - id: l2-c4
            part: enlarge
            type: true_false
            text: "Mo draws a 6 by 4 rectangle half the size. He draws it 4 by 2. Is that right?"
            answer: false
          - id: l2-c5
            part: plan-to-real
            type: text_input
            text: "On a map, 1 cm stands for 500 m. A river is 6 cm long on the map. How many metres long is it in real life?"
            answer: "3000"
          - id: l2-c6
            part: enlarge
            type: image_multiple_choice
            text: "Which rectangle is this one enlarged by scale factor 2?"
            show: { drawn: grid, cols: 3, rows: 2, lines: [[0, 0, 3, 0], [3, 0, 3, 2], [3, 2, 0, 2], [0, 2, 0, 0]] }
            options:
              - { drawn: grid, cols: 6, rows: 4, lines: [[0, 0, 6, 0], [6, 0, 6, 4], [6, 4, 0, 4], [0, 4, 0, 0]], key: correct }
              - { drawn: grid, cols: 6, rows: 4, lines: [[0, 0, 5, 0], [5, 0, 5, 4], [5, 4, 0, 4], [0, 4, 0, 0]], key: added }
              - { drawn: grid, cols: 6, rows: 4, lines: [[0, 0, 6, 0], [6, 0, 6, 2], [6, 2, 0, 2], [0, 2, 0, 0]], key: width-only }
            answer: correct
          - id: l2-c7
            part: enlarge
            type: multiple_choice
            text: "A rectangle is 6 by 9. Draw it a third of the size. How big is it?"
            options: ["2 by 3", "3 by 6", "2 by 9"]
            answer: "2 by 3"
          - id: l2-c8
            part: enlarge
            type: text_input
            text: "A 4 by 2 rectangle is enlarged to 28 by 14. What is the scale factor?"
            answer: "7"
          - id: l2-c9
            part: enlarge
            type: true_false
            text: "Ali enlarges a 3 by 5 rectangle by scale factor 3. He draws it 9 by 15. Is that right?"
            answer: true
          - id: l2-c10
            part: enlarge
            type: multiple_choice
            text: "A square has sides 3 squares long. Enlarge it by scale factor 5. How long is each side now?"
            options: ["15 squares", "8 squares", "25 squares"]
            answer: "15 squares"
          - id: l2-c11
            part: plan-to-real
            type: multiple_choice
            text: "The strip is a hedge on a plan where 1 cm stands for 2 m. How long is the real hedge?"
            show: { drawn: ruler, to: 10, length: 9, colour: green }
            options: ["18 m", "11 m", "9 m"]
            answer: "18 m"
          - id: l2-c12
            part: plan-to-real
            type: text_input
            text: "On a plan, 1 cm stands for 10 m. A car park is 4 cm long on the plan. How many metres long is it in real life?"
            answer: "40"
          - id: l2-c13
            part: plan-to-real
            type: true_false
            text: "On a map, 1 cm stands for 1 km. Two towns are 9 cm apart on the map, so they are 9 km apart in real life. Is that true?"
            answer: true
          - id: l2-c14
            part: plan-to-real
            type: multiple_choice
            text: "On a map, 1 cm stands for 500 m. A lake is 2 cm long on the map. How long is it in real life?"
            options: ["1 km", "502 m", "100 m"]
            answer: "1 km"
          - id: l2-c15
            part: real-to-plan
            type: multiple_choice
            text: "On a plan, 1 cm stands for 2 m. A kitchen is 8 m long. How long is it on the plan?"
            options: ["4 cm", "16 cm", "8 cm"]
            answer: "4 cm"
          - id: l2-c16
            part: real-to-plan
            type: text_input
            text: "On a plan, 1 cm stands for 5 m. A football pitch is 100 m long. How many centimetres long is it on the plan?"
            answer: "20"
          - id: l2-c17
            part: real-to-plan
            type: true_false
            text: "On a plan, 1 cm stands for 3 m. Leo draws a 12 m wall 36 cm long. Is that right?"
            answer: false
          - id: l2-c18
            part: real-to-plan
            type: multiple_choice
            text: "On a map, 1 cm stands for 1 km. Two villages are 6 km apart. How far apart are they on the map?"
            options: ["6 cm", "6 km", "60 cm"]
            answer: "6 cm"
          - id: l2-c19
            part: real-to-plan
            type: multiple_choice
            text: "On a map, 1 cm stands for 500 m. The station is 2 km from the school. How far apart are they on the map?"
            options: ["4 cm", "2 cm", "40 cm"]
            answer: "4 cm"
          - id: l2-c20
            part: real-to-plan
            type: text_input
            text: "On a plan, 1 cm stands for 4 m. A bus is 12 m long. How many centimetres long is it on the plan?"
            answer: "3"
