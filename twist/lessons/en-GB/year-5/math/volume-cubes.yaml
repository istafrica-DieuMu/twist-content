# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.volume-cubes
skill: math.area-volume.volume-cubes
curriculum: en-GB
language: en
title:
  de: Rauminhalt mit Würfeln
  en: Volume in cubes
summary: >
  Lesson 1 measures the volume of a cuboid in unit cubes, layer by layer
  (one layer 3 × 2 = 6 cubes, two layers 12), with a layer shown from
  above as an array and the hidden cubes inside counted too; lesson 2
  finds the volume of cube buildings from their plan, compares volumes (a
  tower and a row of 6 cubes have the same volume), finds the cubes
  missing to complete a cuboid, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Rauminhalt, en: Volume }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.solids.cube-buildings, math.mult-div.arrays]
  also_practises: [math.mult-div.arrays]
  vocabulary: { en: [volume, unit cube, cuboid, layer, length, width, height, plan, compare] }
  forms: [text, audio, drawn]
  drawn: [cubes, dots]
  facets: []
  parts:
    - { id: cuboids, what: { de: den Rauminhalt eines Quaders in Einheitswürfeln bestimmen, en: finding the volume of a cuboid in unit cubes } }
    - { id: buildings, what: { de: den Rauminhalt eines Würfelgebäudes bestimmen, en: finding the volume of a cube building } }
    - { id: compare, what: { de: Rauminhalte vergleichen, en: comparing volumes } }
  misconceptions:
    - id: counts-one-layer
      what: Counts only one layer or only the cubes that can be seen, and forgets the other layers and the hidden cubes
      addressed: lesson 1 Learn stacks a second layer and says the hidden cubes count; l1-f2 and l1-f3 (with feedback), l1-s2, l1-s4, l1-n1, l1-n4, l1-c2 and l2-c1 offer the count of one layer, l1-f5 asks about the hidden cubes
    - id: adds-dimensions
      what: Adds length, width and height (4 + 2 + 3 = 9) instead of multiplying, or counts the squares of a plan instead of adding its numbers
      addressed: l1-f4 (with feedback), l1-s5 and l2-f1 (with feedback) offer or state the sum or the number of squares, l2-s1, l2-n1 and l2-c4 offer it too; lesson 2 Learn adds the numbers of a plan
    - id: taller-is-bigger
      what: Thinks a tall tower has a bigger volume than a row of the same cubes
      addressed: lesson 2 Learn compares a tower and a row of 6; l2-f2 (with feedback), l2-f5 and l2-n5 ask about it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Quader in Schichten", en: "Cuboids in layers" }
    goal:
      de: "Zähl das Volumen eines Quaders Schicht für Schicht in Würfeln, so wie 2 Schichten mit je 6 Würfeln sind 12 Würfel."
      en: "Count the volume of a cuboid in cubes, layer by layer, like 2 layers of 6 cubes make 12 cubes."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many cubes are in this building?"
            show: { drawn: cubes, plan: [[2, 1], [1, 1]], mode: building, colour: blue }
            options: ["5", "4", "3"]
            answer: "5"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many dots are in the array?"
            show: { drawn: dots, array: [3, 4] }
            options: ["12", "7", "14"]
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "How many small cubes do you think make this cuboid?"
            say: "Look at this cuboid made of small cubes. Some are hidden at the back and underneath. How many cubes do you think there are altogether? Make a guess."
            show: { drawn: cubes, plan: [[2, 2, 2], [2, 2, 2]], mode: building, colour: green }
          - text: "Volume: the space a shape takes up, counted in unit cubes."
            say: "The volume of a shape is how much space it takes up. We can measure it by counting unit cubes. This cuboid is three cubes long, two cubes deep and one cube tall. Its volume is six cubes."
            show: { drawn: cubes, plan: [[1, 1, 1], [1, 1, 1]], mode: building, colour: green }
          - text: "One layer from above: 2 rows of 3, so 2 × 3 = 6 cubes"
            say: "Look at one layer from above. It is an array of two rows of three cubes. Two times three is six."
            show: { drawn: dots, array: [2, 3] }
          - text: "Two layers: 2 × 6 = 12 cubes"
            say: "Now put a second layer on top. Some cubes are hidden at the back and underneath, but they still count. Two layers of six cubes make twelve cubes."
            show: { drawn: cubes, plan: [[2, 2, 2], [2, 2, 2]], mode: building, colour: green }
          - text: "Volume = length × width × height\n3 × 2 × 2 = 12 cubes"
            say: "So you can find the volume of a cuboid by multiplying: length times width gives one layer, times the height gives all the layers. Multiply, never add the three numbers."
          - text: "Did you know? A cube 10 cm long, 10 cm wide and 10 cm tall holds exactly 1 litre."
            say: "Did you know? Imagine a hollow cube, ten centimetres long, ten centimetres wide and ten centimetres tall. Fill it with water and it holds exactly one litre. That is a whole carton of juice!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "This is one layer of a cuboid, seen from above. How many cubes are in the layer?"
                show: { drawn: dots, array: [3, 4] }
                options: ["12", "7", "3"]
                answer: "12"
                feedback:
                  "7": "You added 3 and 4. The layer has 3 rows of 4 cubes: multiply."
                hints:
                  - "Count the rows and how many are in each row."
                  - "3 rows of 4."
                  - "3 × 4 = 12."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many cubes are in this cuboid?"
                show: { drawn: cubes, plan: [[2, 2], [2, 2], [2, 2]], mode: building, colour: orange }
                options: ["12", "6", "7"]
                answer: "12"
                feedback:
                  "6": "That is one layer. The cuboid is 2 layers tall."
                hints:
                  - "Find one layer first: 3 rows of 2."
                  - "One layer has 6 cubes. There are 2 layers."
                  - "2 × 6 = 12."
              - id: l1-f5
                type: true_false
                text: "Some cubes inside a cuboid are hidden, but they still count towards its volume. Is that true?"
                answer: true
                hints:
                  - "The volume is all the space the cuboid takes up."
                  - "The hidden cubes take up space too."
                  - "Yes, that is true."
              - id: l1-f3
                type: multiple_choice
                text: "How many cubes are in this cuboid?"
                show: { drawn: cubes, plan: [[3, 3], [3, 3]], mode: building, colour: red }
                options: ["12", "4", "8"]
                answer: "12"
                feedback:
                  "4": "That is only the top layer. Count the layers too."
                hints:
                  - "One layer is 2 rows of 2 cubes."
                  - "One layer has 4 cubes. There are 3 layers."
                  - "3 × 4 = 12."
              - id: l1-f4
                type: multiple_choice
                text: "A cuboid is 4 cubes long, 2 cubes wide and 3 cubes tall. What is its volume?"
                options: ["24 cubes", "9 cubes", "8 cubes"]
                answer: "24 cubes"
                feedback:
                  "9 cubes": "You added 4, 2 and 3. Multiply to find the volume."
                  "8 cubes": "8 cubes is one layer. There are 3 layers."
                hints:
                  - "Find one layer, then multiply by the height."
                  - "One layer: 4 × 2 = 8 cubes."
                  - "3 layers: 3 × 8 = 24 cubes."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "This is one layer of a cuboid, seen from above. How many cubes are in the layer?"
                show: { drawn: dots, array: [4, 5] }
                answer: "20"
                hints: ["4 rows of 5."]
              - id: l1-s2
                type: multiple_choice
                text: "How many cubes are in this cuboid?"
                show: { drawn: cubes, plan: [[3, 3, 3], [3, 3, 3]], mode: building, colour: purple }
                options: ["18", "6", "9"]
                answer: "18"
                hints: ["One layer has 6 cubes. How many layers are there?"]
              - id: l1-s3
                type: text_input
                text: "A cuboid is 5 cubes long, 3 cubes wide and 2 cubes tall. What is its volume in cubes?"
                answer: "30"
                hints: ["One layer: 5 × 3."]
              - id: l1-s4
                type: multiple_choice
                text: "One layer of a cuboid has 8 cubes. The cuboid has 3 layers. What is its volume?"
                options: ["24 cubes", "11 cubes", "8 cubes"]
                answer: "24 cubes"
                hints: ["3 lots of 8."]
              - id: l1-s5
                type: true_false
                text: "A cuboid 2 cubes long, 3 wide and 4 tall has a volume of 9 cubes. Is that true?"
                answer: false
                hints: ["2 + 3 + 4 = 9. Should you add or multiply?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many cubes are in this cuboid?"
                show: { drawn: cubes, plan: [[2, 2, 2], [2, 2, 2], [2, 2, 2]], mode: building, colour: yellow }
                options: ["18", "9", "6"]
                answer: "18"
              - id: l1-n2
                type: text_input
                text: "One layer of a cuboid has 6 rows of 4 cubes. There are 2 layers. What is its volume in cubes?"
                answer: "48"
              - id: l1-n3
                type: multiple_choice
                text: "Which cuboid has the larger volume?"
                options: ["4 by 3 by 2 cubes", "5 by 2 by 2 cubes", "They are the same."]
                answer: "4 by 3 by 2 cubes"
                keep_order: true
              - id: l1-n4
                type: multiple_choice
                text: "A cube is 3 unit cubes long, 3 wide and 3 tall. How many unit cubes is it made of?"
                options: ["27", "9", "12"]
                answer: "27"
              - id: l1-n5
                type: text_input
                text: "A box is packed with 2 layers of cubes. Each layer has 5 rows of 4. How many cubes are in the box?"
                answer: "40"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "This is one layer of a cuboid, seen from above. How many cubes are in the layer?"
            show: { drawn: dots, array: [2, 6] }
            options: ["12", "8", "6"]
            answer: "12"
          - id: l1-c2
            type: multiple_choice
            text: "How many cubes are in this cuboid?"
            show: { drawn: cubes, plan: [[1, 1, 1, 1], [1, 1, 1, 1]], mode: building, colour: blue }
            options: ["8", "4", "6"]
            answer: "8"
          - id: l1-c3
            type: text_input
            text: "A cuboid is 3 cubes long, 2 wide and 5 tall. What is its volume in cubes?"
            answer: "30"
          - id: l1-c4
            type: multiple_choice
            text: "How many cubes are in this cuboid?"
            show: { drawn: cubes, plan: [[3, 3, 3]], mode: building, colour: red }
            options: ["9", "3", "6"]
            answer: "9"
          - id: l1-c5
            type: true_false
            text: "A cuboid 3 cubes long, 3 wide and 2 tall has a volume of 8 cubes. Is that true?"
            answer: false
          - id: l1-c6
            type: text_input
            text: "One layer of a cuboid has 4 rows of 6 cubes. There are 3 layers. What is its volume in cubes?"
            answer: "72"

  - n: 2
    title: { de: "Würfelgebäude vergleichen", en: "Comparing cube buildings" }
    goal:
      de: "Finde das Volumen von Würfelgebäuden, vergleiche sie und zähl, wie viele Würfel bis zum fertigen Quader fehlen."
      en: "Find the volume of cube buildings, compare them, and work out how many cubes are missing to make a cuboid."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A cuboid is 2 cubes long, 2 wide and 3 tall. What is its volume?"
            options: ["12 cubes", "7 cubes", "6 cubes"]
            answer: "12 cubes"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many cubes are in this cuboid?"
            show: { drawn: cubes, plan: [[2, 2], [2, 2]], mode: building, colour: green }
            options: ["8", "4", "6"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A tower of 6 cubes and a row of 6 cubes.\nWhich do you think has the bigger volume?"
            say: "Here is a tall tower of six cubes. Next to it, six cubes lie in a row on the table. Which do you think has the bigger volume, the tower or the row? Have a guess."
            show: { drawn: cubes, plan: [[6]], mode: building, colour: purple }
          - text: "Same cubes, same volume.\nA tower of 6 and a row of 6 both have a volume of 6 cubes."
            say: "A tall tower of six cubes looks bigger than a row of six cubes lying on the table. But both are made of six cubes, so they have the same volume."
            show: { drawn: cubes, plan: [[6]], mode: building, colour: purple }
          - text: "A building from its plan: add the numbers.\n2 + 1 + 3 + 1 + 1 = 8 cubes"
            say: "A cube building that is not a cuboid has a volume too. Its plan says how many cubes stand on each square. Add up the numbers, not the squares: two, one, three, one and one make eight cubes. Its volume is eight cubes."
            show: { drawn: cubes, plan: [[2, 1, 0], [3, 1, 1]], mode: plan, colour: orange }
          - text: "Making a cuboid: 2 × 2 × 2 = 8 cubes, the building has 7.\n8 − 7 = 1 more cube"
            say: "How many more cubes turn this building into a cuboid two cubes tall? The cuboid would have four squares with two cubes each, so eight cubes. The building has seven. One more cube is needed."
            show: { drawn: cubes, plan: [[2, 1], [2, 2]], mode: building, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is the volume of this building in cubes?"
                show: { drawn: cubes, plan: [[3, 1], [2, 2]], mode: plan, colour: red }
                options: ["8", "4", "3"]
                answer: "8"
                feedback:
                  "4": "4 is the number of squares. Add the numbers in the squares."
                hints:
                  - "Each number is a tower of cubes."
                  - "3 + 1 + 2 + 2."
                  - "8 cubes."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which has the larger volume?"
                options: ["a tower of 6 cubes", "a row of 6 cubes", "They are the same."]
                answer: "They are the same."
                keep_order: true
                feedback:
                  "a tower of 6 cubes": "The tower is taller, but it uses the same 6 cubes as the row."
                  "a row of 6 cubes": "Cubes do not grow when they lie down for a rest! The row uses the same 6 cubes as the tower."
                hints:
                  - "Count the cubes in each."
                  - "Both are made of 6 cubes."
                  - "They have the same volume."
              - id: l2-f3
                type: multiple_choice
                text: "How many more cubes make this building into a cuboid 3 cubes tall?"
                show: { drawn: cubes, plan: [[3, 2], [1, 3]], mode: plan, colour: green }
                options: ["3", "12", "9"]
                answer: "3"
                feedback:
                  "12": "12 cubes is the whole cuboid. Some cubes are there already."
                hints:
                  - "The cuboid needs a 3 on every square."
                  - "4 squares × 3 = 12 cubes. The building has 9."
                  - "12 − 9 = 3."
              - id: l2-f4
                type: image_multiple_choice
                text: "Which building has a volume of 7 cubes?"
                options:
                  - { drawn: cubes, plan: [[2, 2], [2, 1]], mode: building, colour: orange, key: seven }
                  - { drawn: cubes, plan: [[2, 2], [2, 2]], mode: building, colour: orange, key: eight }
                  - { drawn: cubes, plan: [[1, 2], [2, 1]], mode: building, colour: orange, key: six }
                answer: seven
                hints:
                  - "Count the cubes in each building, the hidden ones too."
                  - "Each building has 4 towers. Add their heights."
                  - "2 + 2 + 2 + 1 = 7."
              - id: l2-f5
                type: true_false
                text: "Two buildings made of the same number of cubes have the same volume, even if they look different. Is that true?"
                answer: true
                hints:
                  - "Volume is counted in cubes."
                  - "The shape does not change the number of cubes."
                  - "Yes, that is true."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What is the volume of this building in cubes?"
                show: { drawn: cubes, plan: [[1, 2, 1], [2, 1, 2]], mode: plan, colour: purple }
                options: ["9", "6", "2"]
                answer: "9"
                hints: ["Add the numbers row by row."]
              - id: l2-s2
                type: multiple_choice
                text: "Which has the larger volume?"
                options: ["a cuboid 3 by 2 by 2 cubes", "a cube 2 by 2 by 2 cubes", "They are the same."]
                answer: "a cuboid 3 by 2 by 2 cubes"
                keep_order: true
                hints: ["Work out each volume by multiplying."]
              - id: l2-s3
                type: text_input
                text: "How many more cubes make this building into a cuboid 2 cubes tall?"
                show: { drawn: cubes, plan: [[2, 1], [1, 2]], mode: plan, colour: blue }
                answer: "2"
                hints: ["The cuboid needs 4 × 2 = 8 cubes."]
              - id: l2-s4
                type: multiple_choice
                text: "What is the volume of this building?"
                show: { drawn: cubes, plan: [[2, 2, 1], [1, 1, 1]], mode: building, colour: yellow }
                options: ["8 cubes", "6 cubes", "5 cubes"]
                answer: "8 cubes"
                hints: ["The back row is 2, 2 and 1 cubes tall."]
              - id: l2-s5
                type: true_false
                text: "A row of 3 towers, each 2 cubes tall, has the same volume as a cube 2 by 2 by 2. Is that true?"
                answer: false
                hints: ["Count the cubes in each."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "What is the volume of this building in cubes?"
                show: { drawn: cubes, plan: [[3, 0, 2], [1, 2, 1]], mode: plan, colour: green }
                options: ["9", "5", "3"]
                answer: "9"
              - id: l2-n2
                type: text_input
                text: "A cuboid is 4 cubes long, 3 wide and 2 tall. Zak takes away 5 cubes. How many cubes are left?"
                answer: "19"
              - id: l2-n3
                type: multiple_choice
                text: "Which has the smallest volume?"
                options: ["2 by 2 by 2 cubes", "3 by 3 by 1 cubes", "2 by 2 by 3 cubes"]
                answer: "2 by 2 by 2 cubes"
              - id: l2-n4
                type: text_input
                text: "How many more cubes make this building into a cuboid 3 cubes tall?"
                show: { drawn: cubes, plan: [[3, 2], [2, 1]], mode: plan, colour: red }
                answer: "4"
              - id: l2-n5
                type: true_false
                text: "Ella builds a tower of 10 cubes. Sam lays a row of 10 cubes. Ella's tower has the larger volume. Is that true?"
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: cuboids
            type: multiple_choice
            text: "This is one layer of a cuboid, seen from above. The cuboid has 2 layers. What is its volume?"
            show: { drawn: dots, array: [3, 5] }
            options: ["30 cubes", "15 cubes", "10 cubes"]
            answer: "30 cubes"
          - id: l2-c2
            part: cuboids
            type: multiple_choice
            text: "How many cubes are in this cuboid?"
            show: { drawn: cubes, plan: [[2, 2, 2], [2, 2, 2]], mode: building, colour: orange }
            options: ["12", "6", "8"]
            answer: "12"
          - id: l2-c3
            part: cuboids
            type: text_input
            text: "A cuboid is 6 cubes long, 2 wide and 2 tall. What is its volume in cubes?"
            answer: "24"
          - id: l2-c4
            part: buildings
            type: multiple_choice
            text: "What is the volume of this building in cubes?"
            show: { drawn: cubes, plan: [[2, 3], [1, 3]], mode: plan, colour: purple }
            options: ["9", "4", "3"]
            answer: "9"
          - id: l2-c5
            part: compare
            type: multiple_choice
            text: "Amy's cuboid is 4 by 3 by 1 cubes. Ben's cuboid is 2 by 2 by 2 cubes. How many more cubes does Amy's cuboid have?"
            options: ["4", "12", "2"]
            answer: "4"
          - id: l2-c6
            part: cuboids
            type: multiple_choice
            text: "How many cubes are in this cuboid?"
            show: { drawn: cubes, plan: [[4, 4], [4, 4]], mode: building, colour: yellow }
            options: ["16", "4", "8"]
            answer: "16"
          - id: l2-c7
            part: cuboids
            type: text_input
            text: "A cuboid is 5 cubes long, 4 wide and 3 tall. What is its volume in cubes?"
            answer: "60"
          - id: l2-c8
            part: cuboids
            type: true_false
            text: "A cuboid 6 cubes long, 2 wide and 1 tall has a volume of 12 cubes. Is that true?"
            answer: true
          - id: l2-c9
            part: cuboids
            type: multiple_choice
            text: "One layer of a cuboid has 3 rows of 3 cubes. The cuboid has 4 layers. What is its volume?"
            options: ["36 cubes", "10 cubes", "9 cubes"]
            answer: "36 cubes"
          - id: l2-c10
            part: buildings
            type: multiple_choice
            text: "What is the volume of this building in cubes?"
            show: { drawn: cubes, plan: [[4, 1], [2, 3]], mode: plan, colour: blue }
            options: ["10", "4", "6"]
            answer: "10"
          - id: l2-c11
            part: buildings
            type: image_multiple_choice
            text: "Which building has a volume of 6 cubes?"
            options:
              - { drawn: cubes, plan: [[3, 1], [1, 1]], mode: building, colour: green, key: six }
              - { drawn: cubes, plan: [[3, 1], [1, 2]], mode: building, colour: green, key: seven }
              - { drawn: cubes, plan: [[2, 1], [1, 1]], mode: building, colour: green, key: five }
            answer: six
          - id: l2-c12
            part: buildings
            type: text_input
            text: "How many more cubes make this building into a cuboid 2 cubes tall?"
            show: { drawn: cubes, plan: [[2, 1, 2], [1, 1, 2]], mode: plan, colour: orange }
            answer: "3"
          - id: l2-c13
            part: buildings
            type: multiple_choice
            text: "What is the volume of this building?"
            show: { drawn: cubes, plan: [[3, 1], [2, 1]], mode: building, colour: red }
            options: ["7 cubes", "4 cubes", "5 cubes"]
            answer: "7 cubes"
          - id: l2-c14
            part: buildings
            type: true_false
            text: "Is it true? This building has a volume of 10 cubes."
            show: { drawn: cubes, plan: [[2, 2], [3, 2]], mode: plan, colour: purple }
            answer: false
          - id: l2-c15
            part: buildings
            type: text_input
            text: "What is the volume of this building in cubes?"
            show: { drawn: cubes, plan: [[2, 0, 3], [1, 4, 1]], mode: plan, colour: yellow }
            answer: "11"
          - id: l2-c16
            part: compare
            type: multiple_choice
            text: "Compare the volumes. Which is larger?"
            options: ["a cuboid 4 by 2 by 1 cubes", "a cube 2 by 2 by 2 cubes", "They are the same."]
            answer: "They are the same."
            keep_order: true
          - id: l2-c17
            part: compare
            type: true_false
            text: "A tower of 8 cubes and a cube 2 by 2 by 2 have the same volume. Is that true?"
            answer: true
          - id: l2-c18
            part: compare
            type: multiple_choice
            text: "Which has the largest volume?"
            options: ["5 by 3 by 1 cubes", "2 by 2 by 4 cubes", "3 by 3 by 2 cubes"]
            answer: "3 by 3 by 2 cubes"
          - id: l2-c19
            part: compare
            type: image_multiple_choice
            text: "Which building has the largest volume?"
            options:
              - { drawn: cubes, plan: [[3, 2]], mode: building, colour: blue, key: five }
              - { drawn: cubes, plan: [[1, 1], [1, 1]], mode: building, colour: blue, key: four }
              - { drawn: cubes, plan: [[2, 2], [1, 2]], mode: building, colour: blue, key: seven }
            answer: seven
          - id: l2-c20
            part: compare
            type: text_input
            text: "Mia's building has 14 cubes. Leo's cuboid is 3 by 2 by 2 cubes. How many more cubes does Mia's building have?"
            answer: "2"
