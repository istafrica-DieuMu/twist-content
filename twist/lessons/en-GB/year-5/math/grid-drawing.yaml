# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.grid-drawing
skill: math.shapes.grid-drawing
curriculum: en-GB
language: en
title:
  de: Zeichnen auf Karo- und Punktpapier
  en: Drawing on squared and dotty paper
summary: >
  Lesson 1 copies shapes on squared paper by counting squares from a
  corner, counts slanted lines in two steps (4 right, 2 up), picks the
  correct copy and finds what is wrong with a copy; lesson 2 counts on a
  dot grid from dot to dot, draws a shape with every side doubled or
  halved, slanted sides too, and ends with the skill check. Enlarging by
  other scale factors is left to math.shapes.scale; drawing with a finger
  and buildings on isometric paper wait for a drawing task.
metadata:
  year: year-5
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.parallel-perpendicular]
  also_practises: [math.numbers-to-100.double-halve]
  vocabulary: { en: [copy, original, squared paper, square, dot grid, dot, corner, slanted, across, up, down, double, halve] }
  forms: [text, audio, drawn]
  drawn: [grid]
  facets: []
  parts:
    - { id: slanted, what: { de: schräge Linien in zwei Schritten zählen, en: counting a slanted line in two steps across and up or down } }
    - { id: copy, what: { de: eine richtige Kopie erkennen und Fehler in einer Kopie finden, en: telling a correct copy and finding what is wrong with a copy } }
    - { id: dot-grid, what: { de: auf dem Punktraster von Punkt zu Punkt zählen, en: counting from dot to dot on a dot grid } }
    - { id: double-halve, what: { de: eine Figur doppelt oder halb so groß zeichnen, en: drawing a shape at double or half the size } }
  misconceptions:
    - id: slant-by-eye
      what: Copies a slanted line by eye instead of counting how far it goes across and up, so the copy is steeper or flatter, or swaps the two steps
      addressed: lesson 1 Learn counts a slanted line in two steps; l1-f1 has feedback on swapped steps, l1-f2 and l1-s2 offer a copy with a wrong slant, l1-s3, l1-n3, l1-n4 and l2-c1 show copies with another slant
    - id: counts-dots-not-gaps
      what: On a dot grid counts the dots on a line instead of the gaps between them, so a line 4 long is called 5
      addressed: lesson 2 Learn counts from dot to dot; l2-f1 has feedback on counting dots, l2-s1, l2-s4, l2-n3, l2-n4 and l2-c5 ask again
    - id: enlarge-by-adding
      what: Makes a shape bigger by adding the same number of squares to every side, or doubles only the length and not the height
      addressed: lesson 2 Learn doubles every side; l2-f2 has feedback on both, l2-s2, l2-n1, l2-n2, l2-c3 and l2-c4 offer them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Figuren übertragen", en: "Copying shapes" }
    goal:
      de: "Übertrage Figuren auf Kästchenpapier und zähl schräge Linien in zwei Schritten, so wie 4 nach rechts und 2 nach oben."
      en: "Copy shapes on squared paper, counting slanted lines in two steps, like 4 right and 2 up."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "The two lines are parallel. Is that true?"
            show: { drawn: grid, cols: 5, rows: 3, lines: [[0, 0, 4, 0], [0, 3, 4, 2]] }
            answer: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many squares long is the line?"
            show: { drawn: grid, cols: 8, rows: 2, lines: [[1, 1, 7, 1]] }
            options: ["6", "7", "5"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A copy: the same size, in a different place"
            say: "On the left is the original, a boat. On the right is a copy. A copy is exactly the same size and shape, just somewhere else on the paper. Pick a corner to start from and count the squares along each side. The bottom of the boat is two squares long. Each slanted side goes one square across and one square up."
            show: { drawn: grid, cols: 11, rows: 4, lines: [[1, 4, 3, 4], [3, 4, 4, 3], [4, 3, 0, 3], [0, 3, 1, 4], [2, 3, 2, 0], [2, 0, 3, 2], [3, 2, 2, 2], [7, 4, 9, 4], [9, 4, 10, 3], [10, 3, 6, 3], [6, 3, 7, 4], [8, 3, 8, 0], [8, 0, 9, 2], [9, 2, 8, 2]] }
          - text: "Slanted lines: count across, then up.\n4 right, 2 up"
            say: "Never copy a slanted line by eye. Count it in two steps. This line starts at the bottom left. It goes four squares to the right and two squares up. Mark that point, then join the two points with a ruler."
            show: { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 5, 1]] }
          - text: "Last of all: check every side."
            say: "When you have finished, check each side of the copy against the original. Is each straight side the same number of squares? Does each slanted side go the same distance across and up?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The line starts at the bottom left. How does it go?"
                show: { drawn: grid, cols: 4, rows: 3, lines: [[0, 3, 2, 0]] }
                options: ["2 right, 3 up", "3 right, 2 up", "2 right, 2 up"]
                answer: "2 right, 3 up"
                feedback:
                  "3 right, 2 up": "You swapped the steps. Count the squares to the right first, then the squares up."
                hints:
                  - "Count the squares to the right first, then the squares up."
                  - "To the right it goes 2 squares."
                  - "2 right, 3 up."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Here is the original. Which copy is correct?"
                show: { drawn: grid, cols: 5, rows: 3, lines: [[0, 3, 4, 3], [4, 3, 0, 0], [0, 0, 0, 3]] }
                options:
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 5, 3], [5, 3, 1, 0], [1, 0, 1, 3]], key: correct }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 4, 3], [4, 3, 1, 0], [1, 0, 1, 3]], key: short }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 5, 3], [5, 3, 1, 1], [1, 1, 1, 3]], key: low }
                answer: correct
                feedback:
                  short: "The bottom side here is 3 squares. In the original it is 4."
                  low: "This one is only 2 squares tall. The original is 3 squares tall."
                hints:
                  - "Count the bottom side, then the upright side."
                  - "The original is 4 squares along the bottom and 3 squares up."
                  - "Pick the copy that is 4 along and 3 up."
              - id: l1-f3
                type: true_false
                text: "The copy on the right is exactly the same as the original on the left. Is that true?"
                show: { drawn: grid, cols: 11, rows: 3, lines: [[0, 3, 4, 3], [4, 3, 3, 1], [3, 1, 1, 1], [1, 1, 0, 3], [6, 3, 10, 3], [10, 3, 9, 1], [9, 1, 7, 1], [7, 1, 6, 3]] }
                answer: true
                hints:
                  - "Compare the bottom sides, then the top sides."
                  - "Both are 4 along the bottom and 2 along the top. Both slanted sides go 1 across and 2 up."
                  - "Yes, the copy is correct."
              - id: l1-f4
                type: multiple_choice
                text: "The original is on the left. What is wrong with the copy?"
                show: { drawn: grid, cols: 9, rows: 3, lines: [[0, 1, 3, 1], [3, 1, 3, 3], [3, 3, 0, 3], [0, 3, 0, 1], [5, 0, 8, 0], [8, 0, 8, 3], [8, 3, 5, 3], [5, 3, 5, 0]] }
                options: ["It is too tall.", "It is too wide.", "Nothing, it is right."]
                answer: "It is too tall."
                feedback:
                  "Nothing, it is right.": "Count how many squares tall each rectangle is."
                hints:
                  - "Count the width of both, then the height of both."
                  - "Both are 3 wide. The original is 2 tall, the copy is 3 tall."
                  - "The copy is too tall."
              - id: l1-f5
                type: multiple_choice
                text: "The line starts at the top left. How does it go?"
                show: { drawn: grid, cols: 4, rows: 3, lines: [[0, 0, 3, 2]] }
                options: ["3 right, 2 down", "2 right, 3 down", "3 right, 3 down"]
                answer: "3 right, 2 down"
                hints:
                  - "Count to the right first, then down."
                  - "To the right it goes 3 squares."
                  - "3 right, 2 down."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The line starts at the bottom left. How does it go?"
                show: { drawn: grid, cols: 5, rows: 1, lines: [[0, 1, 5, 0]] }
                options: ["5 right, 1 up", "1 right, 5 up", "5 right, 2 up"]
                answer: "5 right, 1 up"
                hints: ["Count to the right first, then up."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Here is the original. Which copy is correct?"
                show: { drawn: grid, cols: 5, rows: 2, lines: [[0, 2, 4, 2], [4, 2, 2, 0], [2, 0, 0, 2]] }
                options:
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 5, 3], [5, 3, 3, 1], [3, 1, 1, 3]], key: correct }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 5, 3], [5, 3, 3, 0], [3, 0, 1, 3]], key: tall }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 5, 3], [5, 3, 2, 1], [2, 1, 1, 3]], key: leaning }
                answer: correct
                hints: ["The top corner is 2 squares above the middle of the bottom side."]
              - id: l1-s3
                type: true_false
                text: "The copy on the right is exactly the same as the original on the left. Is that true?"
                show: { drawn: grid, cols: 12, rows: 2, lines: [[0, 2, 3, 2], [3, 2, 4, 0], [4, 0, 1, 0], [1, 0, 0, 2], [6, 2, 9, 2], [9, 2, 11, 0], [11, 0, 8, 0], [8, 0, 6, 2]] }
                answer: false
                hints: ["Count the slanted sides: how far across do they go?"]
              - id: l1-s4
                type: multiple_choice
                text: "The original is on the left. What is wrong with the copy?"
                show: { drawn: grid, cols: 9, rows: 3, lines: [[0, 3, 3, 3], [3, 3, 0, 0], [0, 0, 0, 3], [5, 3, 8, 3], [8, 3, 5, 1], [5, 1, 5, 3]] }
                options: ["It is not tall enough.", "The bottom side is too short.", "Nothing, it is right."]
                answer: "It is not tall enough."
                hints: ["Count the upright side of each triangle."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which line goes 4 right and 1 down?"
                options:
                  - { drawn: grid, cols: 5, rows: 4, lines: [[0, 0, 4, 1]], key: a }
                  - { drawn: grid, cols: 5, rows: 4, lines: [[0, 0, 1, 4]], key: b }
                  - { drawn: grid, cols: 5, rows: 4, lines: [[0, 0, 4, 2]], key: c }
                answer: a
                hints: ["Each line starts at the top left. Count across first."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The line starts at the bottom left. How does it go?"
                show: { drawn: grid, cols: 3, rows: 4, lines: [[0, 4, 3, 0]] }
                options: ["3 right, 4 up", "4 right, 3 up", "3 right, 3 up"]
                answer: "3 right, 4 up"
              - id: l1-n2
                type: true_false
                text: "The copy on the right is exactly the same as the original on the left. Is that true?"
                show: { drawn: grid, cols: 11, rows: 2, lines: [[0, 2, 2, 0], [2, 0, 4, 2], [4, 2, 0, 2], [6, 2, 8, 0], [8, 0, 10, 2], [10, 2, 6, 2]] }
                answer: true
              - id: l1-n3
                type: image_multiple_choice
                text: "Here is the original. Which copy is correct?"
                show: { drawn: grid, cols: 4, rows: 3, lines: [[0, 1, 2, 0], [2, 0, 4, 1], [4, 1, 2, 3], [2, 3, 0, 1]] }
                options:
                  - { drawn: grid, cols: 5, rows: 3, lines: [[1, 1, 3, 0], [3, 0, 5, 1], [5, 1, 3, 3], [3, 3, 1, 1]], key: correct }
                  - { drawn: grid, cols: 5, rows: 3, lines: [[1, 1, 3, 0], [3, 0, 5, 1], [5, 1, 3, 2], [3, 2, 1, 1]], key: short }
                  - { drawn: grid, cols: 5, rows: 3, lines: [[0, 1, 3, 0], [3, 0, 5, 1], [5, 1, 3, 3], [3, 3, 0, 1]], key: wide }
                answer: correct
              - id: l1-n4
                type: multiple_choice
                text: "The original is on the left. What is wrong with the copy?"
                show: { drawn: grid, cols: 7, rows: 2, lines: [[0, 0, 2, 0], [2, 0, 2, 2], [2, 2, 0, 2], [0, 2, 0, 0], [0, 2, 2, 0], [4, 0, 6, 0], [6, 0, 6, 2], [6, 2, 4, 2], [4, 2, 4, 0], [4, 0, 6, 2]] }
                options: ["The slanted line goes the other way.", "The square is too big.", "Nothing, it is right."]
                answer: "The slanted line goes the other way."
              - id: l1-n5
                type: multiple_choice
                text: "One side of the original is 5 squares long. How long is that side in a correct copy?"
                options: ["5 squares", "10 squares", "any length"]
                answer: "5 squares"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The line starts at the bottom left. How does it go?"
            show: { drawn: grid, cols: 4, rows: 2, lines: [[0, 2, 4, 0]] }
            options: ["4 right, 2 up", "2 right, 4 up", "4 right, 4 up"]
            answer: "4 right, 2 up"
          - id: l1-c2
            type: true_false
            text: "The copy on the right is exactly the same as the original on the left. Is that true?"
            show: { drawn: grid, cols: 11, rows: 2, lines: [[0, 1, 4, 1], [4, 1, 4, 2], [4, 2, 0, 2], [0, 2, 0, 1], [6, 0, 10, 0], [10, 0, 10, 2], [10, 2, 6, 2], [6, 2, 6, 0]] }
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Which line goes 1 right and 3 up?"
            options:
              - { drawn: grid, cols: 4, rows: 3, lines: [[0, 3, 1, 0]], key: a }
              - { drawn: grid, cols: 4, rows: 3, lines: [[0, 3, 3, 2]], key: b }
              - { drawn: grid, cols: 4, rows: 3, lines: [[0, 3, 1, 1]], key: c }
            answer: a
          - id: l1-c4
            type: multiple_choice
            text: "The line starts at the bottom left. How does it go?"
            show: { drawn: grid, cols: 2, rows: 5, lines: [[0, 5, 2, 0]] }
            options: ["2 right, 5 up", "5 right, 2 up", "2 right, 4 up"]
            answer: "2 right, 5 up"
          - id: l1-c5
            type: multiple_choice
            text: "The original is on the left. What is wrong with the copy?"
            show: { drawn: grid, cols: 9, rows: 3, lines: [[0, 3, 2, 3], [2, 3, 0, 0], [0, 0, 0, 3], [5, 3, 8, 3], [8, 3, 5, 0], [5, 0, 5, 3]] }
            options: ["The bottom side is too long.", "It is too tall.", "Nothing, it is right."]
            answer: "The bottom side is too long."
          - id: l1-c6
            type: true_false
            text: "The copy on the right is exactly the same as the original on the left. Is that true?"
            show: { drawn: grid, cols: 7, rows: 3, lines: [[0, 0, 0, 3], [0, 3, 2, 3], [2, 3, 2, 2], [2, 2, 1, 2], [1, 2, 1, 0], [1, 0, 0, 0], [4, 0, 4, 3], [4, 3, 6, 3], [6, 3, 6, 2], [6, 2, 5, 2], [5, 2, 5, 0], [5, 0, 4, 0]] }
            answer: true

  - n: 2
    title: { de: "Punktraster, doppelt und halb so groß", en: "Dot grids, double and half size" }
    goal:
      de: "Zähl auf dem Punktraster von Punkt zu Punkt und zeichne Figuren doppelt oder halb so groß."
      en: "Count from dot to dot on a dot grid, and draw shapes at double or half the size."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The line starts at the bottom left. How does it go?"
            show: { drawn: grid, cols: 3, rows: 1, lines: [[0, 1, 3, 0]] }
            options: ["3 right, 1 up", "1 right, 3 up", "3 right, 3 up"]
            answer: "3 right, 1 up"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "A correct copy of a shape is always ..."
            options: ["the same size as the original", "bigger than the original", "smaller than the original"]
            answer: "the same size as the original"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "On a dot grid, count from dot to dot."
            say: "On a dot grid there are no squares, only dots. Count the jumps from one dot to the next, not the dots themselves. This line touches five dots, but it is only four long."
            show: { drawn: grid, cols: 6, rows: 2, dots: true, lines: [[1, 1, 5, 1]] }
          - text: "Double the size: double every side.\n2 wide, 1 tall becomes 4 wide, 2 tall"
            say: "To draw a shape at double the size, double every side. This rectangle is two squares wide and one square tall. At double the size it is four wide and two tall. Adding two squares to each side would make the wrong shape."
            show: { drawn: grid, cols: 9, rows: 4, lines: [[0, 4, 2, 4], [2, 4, 2, 3], [2, 3, 0, 3], [0, 3, 0, 4], [4, 4, 8, 4], [8, 4, 8, 2], [8, 2, 4, 2], [4, 2, 4, 4]] }
          - text: "Slanted sides too:\n1 right, 2 up becomes 2 right, 4 up"
            say: "Slanted sides are doubled in both steps. A line that goes one right and two up becomes a line that goes two right and four up."
            show: { drawn: grid, cols: 6, rows: 4, lines: [[0, 4, 1, 2], [3, 4, 5, 0]] }
          - text: "Half the size: halve every side.\n6 wide, 4 tall becomes 3 wide, 2 tall"
            say: "Half the size works the same way. Halve every side, and halve both steps of a slanted side."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How long is the line on the dot grid?"
                show: { drawn: grid, cols: 5, rows: 1, dots: true, lines: [[0, 1, 4, 1]] }
                options: ["4", "5", "3"]
                answer: "4"
                feedback:
                  "5": "You counted the dots. Count the jumps from dot to dot."
                hints:
                  - "Count the jumps, not the dots."
                  - "From the first dot: 1, 2, 3, 4 jumps."
                  - "The line is 4 long."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Every side of this rectangle is doubled. Which is the new rectangle?"
                show: { drawn: grid, cols: 4, rows: 1, lines: [[0, 0, 3, 0], [3, 0, 3, 1], [3, 1, 0, 1], [0, 1, 0, 0]] }
                options:
                  - { drawn: grid, cols: 6, rows: 3, lines: [[0, 0, 6, 0], [6, 0, 6, 2], [6, 2, 0, 2], [0, 2, 0, 0]], key: correct }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[0, 0, 5, 0], [5, 0, 5, 3], [5, 3, 0, 3], [0, 3, 0, 0]], key: added }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[0, 0, 6, 0], [6, 0, 6, 1], [6, 1, 0, 1], [0, 1, 0, 0]], key: length }
                answer: correct
                feedback:
                  added: "This one has 2 squares added to each side. Doubling means each side becomes twice as long."
                  length: "Only the width is doubled here. The height must double too."
                hints:
                  - "The rectangle is 3 wide and 1 tall."
                  - "Double both: 2 × 3 and 2 × 1."
                  - "6 wide and 2 tall."
              - id: l2-f3
                type: multiple_choice
                text: "A side is 3 squares long. You double every side. How long is that side now?"
                options: ["6 squares", "5 squares", "3 squares"]
                answer: "6 squares"
                hints:
                  - "Double means twice as long."
                  - "2 × 3."
                  - "6 squares."
              - id: l2-f4
                type: multiple_choice
                text: "A slanted side goes 1 right and 2 up. You double every side. How does it go now?"
                options: ["2 right, 4 up", "2 right, 2 up", "3 right, 4 up"]
                answer: "2 right, 4 up"
                feedback:
                  "2 right, 2 up": "Both steps must be doubled, the up as well as the across."
                hints:
                  - "Double the step across and the step up."
                  - "2 × 1 = 2 and 2 × 2 = 4."
                  - "2 right, 4 up."
              - id: l2-f5
                type: multiple_choice
                text: "A square has sides 4 squares long. You halve every side. How long is each side now?"
                options: ["2 squares", "8 squares", "3 squares"]
                answer: "2 squares"
                feedback:
                  "8 squares": "That is double. Half the size means each side is half as long."
                hints:
                  - "Halve means split into two equal parts."
                  - "Half of 4."
                  - "2 squares."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How long is the line on the dot grid?"
                show: { drawn: grid, cols: 4, rows: 3, dots: true, lines: [[1, 0, 1, 3]] }
                options: ["3", "4", "2"]
                answer: "3"
                hints: ["Count the jumps from dot to dot."]
              - id: l2-s2
                type: multiple_choice
                text: "A rectangle is 2 squares wide and 3 squares tall. You double every side. How big is it now?"
                options: ["4 wide, 6 tall", "4 wide, 5 tall", "4 wide, 3 tall"]
                answer: "4 wide, 6 tall"
                hints: ["Double the width and double the height."]
              - id: l2-s3
                type: true_false
                text: "Lily halves a rectangle 6 wide and 4 tall. She draws it 3 wide and 2 tall. Is that right?"
                answer: true
                hints: ["Half of 6 and half of 4."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Which line on the dot grid is 3 long?"
                options:
                  - { drawn: grid, cols: 4, rows: 1, dots: true, lines: [[0, 1, 3, 1]], key: three }
                  - { drawn: grid, cols: 4, rows: 1, dots: true, lines: [[0, 1, 4, 1]], key: four }
                  - { drawn: grid, cols: 4, rows: 1, dots: true, lines: [[0, 1, 2, 1]], key: two }
                answer: three
                hints: ["A line 3 long touches 4 dots."]
              - id: l2-s5
                type: multiple_choice
                text: "A slanted side goes 4 right and 2 up. You halve every side. How does it go now?"
                options: ["2 right, 1 up", "2 right, 2 up", "4 right, 1 up"]
                answer: "2 right, 1 up"
                hints: ["Halve both steps."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A triangle has a base of 3 squares and a height of 2 squares. You double every side. What are the base and height now?"
                options: ["base 6, height 4", "base 5, height 4", "base 6, height 2"]
                answer: "base 6, height 4"
              - id: l2-n2
                type: image_multiple_choice
                text: "Every side of this rectangle is halved. Which is the new rectangle?"
                show: { drawn: grid, cols: 4, rows: 2, lines: [[0, 0, 4, 0], [4, 0, 4, 2], [4, 2, 0, 2], [0, 2, 0, 0]] }
                options:
                  - { drawn: grid, cols: 4, rows: 2, lines: [[0, 0, 2, 0], [2, 0, 2, 1], [2, 1, 0, 1], [0, 1, 0, 0]], key: correct }
                  - { drawn: grid, cols: 4, rows: 2, lines: [[0, 0, 3, 0], [3, 0, 3, 1], [3, 1, 0, 1], [0, 1, 0, 0]], key: minus-one }
