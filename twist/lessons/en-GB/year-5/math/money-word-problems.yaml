# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.money-word-problems
skill: math.money.word-problems
curriculum: en-GB
language: en
title:
  de: Sachaufgaben mit Geld
  en: Money problems
summary: >
  Lesson 1 solves shopping problems in steps: what is asked, what you
  know, each calculation, and an answer sentence (the total, then the
  change). Lesson 2 compares prices and offers (3 for £2.70 or 95p each,
  3 for 2, half price, £1 off) to find which is cheaper and how much you
  save, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Mit Geld rechnen, en: Calculating with money }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.money.calculate, math.word-problems.multi-step]
  also_practises: [math.money.decimal-notation]
  vocabulary: { en: [price, total, change, cheaper, more expensive, offer, save, each, half price, 3 for 2] }
  forms: [text, audio]
  drawn: []
  facets: [currency]
  parts:
    - { id: steps, what: { de: Einkaufsaufgaben in Schritten lösen, en: solving shopping problems in steps } }
    - { id: enough, what: { de: "prüfen, ob das Geld reicht", en: checking whether the money is enough } }
    - { id: compare, what: { de: Preise und Angebote vergleichen, en: comparing prices and offers } }
    - { id: save, what: { de: Angebote und Ersparnis ausrechnen, en: working out offers and savings } }
    - { id: answer, what: { de: den passenden Antwortsatz finden, en: choosing the answer sentence that fits } }
  misconceptions:
    - id: one-step-only
      what: Stops after the first step of a two-step problem (finds the total but forgets the change)
      addressed: lesson 1 Learn plans both steps; l1-f2, l1-s2 and l1-n2 offer the first-step result, with feedback in l1-f2
    - id: offer-always-cheaper
      what: Thinks the bigger pack or the offer is always cheaper
      addressed: lesson 2 Learn works out the price for the same number of items and says an offer is not always cheaper; l2-f4, l2-s3 and l2-n3 have an offer that is not cheaper, with feedback in l2-f4
    - id: pence-pounds
      what: Mixes pounds and pence when adding (£1.20 + 45p = £1.65 written as £46.20 or £1.245)
      addressed: lesson 1 Learn writes every price in pounds before adding; l1-f1 has feedback on the mixed-up total, l1-s1 asks again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Einkaufen in Schritten", en: "Shopping in steps" }
    goal:
      de: "Löse Einkaufsaufgaben Schritt für Schritt. Rechne erst den ganzen Preis aus, dann das Wechselgeld, und schreib einen Antwortsatz."
      en: "Solve shopping problems step by step. Find the total, then the change, and finish with an answer sentence."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "£2.40 + £1.80 = _"
            say: "Two pounds forty add one pound eighty."
            options: ["£4.20", "£3.20", "£4.02"]
            answer: "£4.20"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "£10 − £4.20 = _"
            say: "Ten pounds subtract four pounds twenty."
            options: ["£5.80", "£6.80", "£6.20"]
            answer: "£5.80"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lily buys a sandwich for £2.35 and a drink for 85p. She pays with a £5 note.\nHow much change does she get?"
            say: "Read the problem twice. What is the question? How much change Lily gets. What do you know? Two prices, and that she pays with five pounds."
          - text: "85p = £0.85\nStep 1: £2.35 + £0.85 = £3.20\nStep 2: £5.00 − £3.20 = £1.80"
            say: "Write every price in pounds, so eighty-five pence is nought point eight five pounds. Step one, find the total: three pounds twenty. Step two, find the change: five pounds subtract three pounds twenty is one pound eighty."
          - text: "Answer: Lily gets £1.80 change."
            say: "Finish with an answer sentence. Check it answers the question. The total was only halfway there."
          - text: "4 pencils at 65p each\n4 × 65p = 260p = £2.60"
            say: "Each means the price of one. Four pencils at sixty-five pence each cost four times sixty-five pence, which is two hundred and sixty pence, or two pounds sixty."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A comic costs £1.20 and a bag of sweets costs 45p. What is the total?"
                options: ["£1.65", "£46.20", "£1.25"]
                answer: "£1.65"
                feedback:
                  "£46.20": "45p is £0.45, not £45. Write both prices in pounds first."
                hints:
                  - "Write 45p in pounds."
                  - "45p is £0.45. Now add £1.20 and £0.45."
                  - "£1.20 + £0.45 = £1.65."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Sam buys a football for £6.50 and a pump for £2.30. He pays with a £10 note. How much change does he get?"
                options: ["£1.20", "£8.80", "£3.50"]
                answer: "£1.20"
                feedback:
                  "£8.80": "That is the total. The question asks for the change, so there is a second step."
                hints:
                  - "There are two steps: the total, then the change."
                  - "The total is £6.50 + £2.30 = £8.80. Now take that from £10."
                  - "£10 − £8.80 = £1.20."
              - id: l1-f3
                type: true_false
                text: "A cinema ticket costs £6.75. Is £20 enough for 3 tickets?"
                answer: false
                hints:
                  - "Work out the cost of 3 tickets first."
                  - "3 × £6 = £18 and 3 × 75p = £2.25."
                  - "No. 3 tickets cost £20.25, which is more than £20."
              - id: l1-f4
                type: fill_in_blank
                text: "Ava buys 3 notebooks at £1.40 each and a pen at 90p. Fill in the steps."
                frame: "3 × £1.40 = £_   then £4.20 + £0.90 = £_"
                options: ["4.20", "5.10", "2.30", "4.30"]
                answer: ["4.20", "5.10"]
                hints:
                  - "First the notebooks, then add the pen."
                  - "3 × £1.40: 3 × £1 = £3 and 3 × 40p = £1.20."
                  - "£4.20, then £5.10."
              - id: l1-f5
                type: multiple_choice
                text: "Which answer sentence fits?\nQuestion: How much do the drinks cost altogether?\n£1.25 + £1.25 + £1.25 = £3.75"
                options: ["The drinks cost £3.75 altogether.", "One drink costs £3.75.", "The change is £3.75."]
                answer: "The drinks cost £3.75 altogether."
                hints:
                  - "Read the question again. What does it ask for?"
                  - "£3.75 is the total for all the drinks."
                  - "The drinks cost £3.75 altogether."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A magazine costs £2.50 and a pencil costs 35p. What is the total?"
                options: ["£2.85", "£37.50", "£2.53"]
                answer: "£2.85"
                hints: ["35p is £0.35."]
              - id: l1-s2
                type: multiple_choice
                text: "Ella buys a book for £7.90 and a bookmark for £1.45. She pays with a £10 note. How much change does she get?"
                options: ["65p", "£9.35", "£1.65"]
                answer: "65p"
                hints: ["Find the total first, then the change from £10."]
              - id: l1-s3
                type: true_false
                text: "A swimming ticket costs £3.80. Is £15 enough for 4 children?"
                answer: false
                hints: ["4 × £3.80: 4 × £3 and 4 × 80p."]
              - id: l1-s4
                type: text_input
                text: "5 apples cost 30p each. How much do they cost altogether, in pence?"
                answer: "150"
                hints: ["5 × 30p."]
              - id: l1-s5
                type: true_false
                text: "Jack buys 2 drinks at 85p each. He pays with £2 and gets 30p change. Is that right?"
                answer: true
                hints: ["2 × 85p = £1.70. Then £2 − £1.70."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "4 bread rolls cost 45p each, and a tub of butter costs £1.85. What is the total?"
                options: ["£3.65", "£2.30", "£3.45"]
                answer: "£3.65"
              - id: l1-n2
                type: multiple_choice
                text: "Leo buys a T-shirt for £12.50 and socks for £4.75. He pays with a £20 note. How much change does he get?"
                options: ["£2.75", "£17.25", "£3.25"]
                answer: "£2.75"
              - id: l1-n3
                type: true_false
                text: "An ice cream costs £1.60. Is £8 enough for 5 ice creams?"
                answer: true
              - id: l1-n4
                type: text_input
                text: "A family ticket costs £24. Mum pays with two £20 notes. How much change does she get, in pounds?"
                answer: "16"
              - id: l1-n5
                type: multiple_choice
                text: "Which answer sentence fits?\nQuestion: How much money does Ruby have left?\n£20.00 − £13.40 = £6.60"
                options: ["Ruby has £6.60 left.", "Ruby spends £6.60.", "Ruby has £13.40 left."]
                answer: "Ruby has £6.60 left."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ali buys bread for £1.60 and cheese for £3.25. He pays with a £10 note. How much change does he get?"
            options: ["£5.15", "£4.85", "£6.15"]
            answer: "£5.15"
          - id: l1-c2
            type: true_false
            text: "A train ticket costs £4.50. Is £10 enough for 2 tickets?"
            answer: true
          - id: l1-c3
            type: text_input
            text: "6 stickers cost 15p each. How much do they cost altogether, in pence?"
            answer: "90"
          - id: l1-c4
            type: multiple_choice
            text: "Maya buys a sketchbook for £3.45 and 2 pencils at 60p each. What is the total?"
            options: ["£4.65", "£4.05", "£3.65"]
            answer: "£4.65"
          - id: l1-c5
            type: text_input
            text: "Tom buys a kite for £8.70. He pays with a £10 note. How much change does he get, in pence?"
            answer: "130"
          - id: l1-c6
            type: multiple_choice
            text: "Which sentence answers the question?\nQuestion: Is £5 enough for 2 books at £2.30 each?"
            options: ["Yes, 2 books cost £4.60, so £5 is enough.", "2 books cost £4.60.", "No, £5 is not enough."]
            answer: "Yes, 2 books cost £4.60, so £5 is enough."

  - n: 2
    title: { de: "Preise und Angebote vergleichen", en: "Which is cheaper?" }
    goal:
      de: "Vergleiche Preise und Angebote wie 3 für 2 oder halber Preis und finde heraus, was billiger ist und wie viel du sparst."
      en: "Compare prices and offers like 3 for 2 or half price, and find out which is cheaper and how much you save."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A notebook costs 95p. How much do 3 notebooks cost?"
            options: ["£2.85", "£2.75", "£3.15"]
            answer: "£2.85"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is less?"
            options: ["£2.70", "£2.85"]
            answer: "£2.70"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Notebooks: 95p each, or 3 for £2.70"
            say: "To compare prices, find the cost of the same number of things. Three notebooks at ninety-five pence each cost two pounds eighty-five."
          - text: "3 × 95p = £2.85\n£2.70 is less than £2.85\nYou save 15p."
            say: "Two pounds seventy is less than two pounds eighty-five, so the offer is cheaper. The saving is the difference: fifteen pence."
          - text: "3 for 2: pay for 2, get 3\nHalf price: pay half\n£1 off: take away £1"
            say: "Shops use offers like these. Three for two means you pay for two and get the third free. Half price means you pay half. One pound off means one pound less than the usual price."
          - text: "Juice: 80p each, or 6 for £5.10\n6 × 80p = £4.80"
            say: "Check every offer. Six juices at eighty pence each cost four pounds eighty, which is less than five pounds ten. Here the big pack is not cheaper."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Yoghurts cost 60p each, or a pack of 4 for £2.20. Which is cheaper for 4 yoghurts?"
                options: ["the pack of 4", "4 single yoghurts", "they cost the same"]
                answer: "the pack of 4"
                hints:
                  - "Work out what 4 single yoghurts cost."
                  - "4 × 60p = 240p = £2.40."
                  - "£2.20 is less than £2.40, so the pack is cheaper."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "4 single yoghurts cost £2.40. The pack of 4 costs £2.20. How much do you save with the pack, in pence?"
                answer: "20"
                hints:
                  - "The saving is the difference between the two prices."
                  - "£2.40 − £2.20."
                  - "20p."
              - id: l2-f3
                type: multiple_choice
                text: "Socks cost £2 a pair. The shop has 3 for 2. How much do 3 pairs cost?"
                options: ["£4", "£6", "£2"]
                answer: "£4"
                feedback:
                  "£6": "With 3 for 2 you only pay for 2 pairs."
                hints:
                  - "3 for 2 means you get 3 but pay for 2."
                  - "You pay for 2 pairs at £2."
                  - "2 × £2 = £4."
              - id: l2-f4
                type: multiple_choice
                text: "Pens cost 45p each, or a pack of 5 for £2.40. Which is cheaper for 5 pens?"
                options: ["5 single pens", "the pack of 5", "they cost the same"]
                answer: "5 single pens"
                feedback:
                  "the pack of 5": "A pack is not always cheaper. Work out 5 × 45p and compare."
                hints:
                  - "Find the cost of 5 single pens."
                  - "5 × 45p = 225p = £2.25."
                  - "£2.25 is less than £2.40, so single pens are cheaper."
              - id: l2-f5
                type: multiple_choice
                text: "Shop A: trainers £34.99. Shop B: the same trainers £40, half price today. Where are they cheaper?"
                options: ["Shop B", "Shop A", "the same in both"]
                answer: "Shop B"
                hints:
                  - "What is half of £40?"
                  - "Half price at Shop B is £20."
                  - "£20 is less than £34.99. Shop B is cheaper."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Bread rolls cost 35p each, or a bag of 6 for £1.80. Which is cheaper for 6 rolls?"
                options: ["the bag of 6", "6 single rolls", "they cost the same"]
                answer: "the bag of 6"
                hints: ["6 × 35p = £2.10."]
              - id: l2-s2
                type: multiple_choice
                text: "A game costs £18. Shop A takes £5 off. Shop B sells it at half price. Where is it cheaper?"
                options: ["Shop B", "Shop A", "the same in both"]
                answer: "Shop B"
                hints: ["£18 − £5 = £13, and half of £18 is £9."]
              - id: l2-s3
                type: true_false
                text: "Bottles of water cost 50p each, or a pack of 6 for £3.00. Is the pack cheaper than 6 single bottles?"
                answer: false
                hints: ["6 × 50p = £3.00."]
              - id: l2-s4
                type: text_input
                text: "A pencil case costs £4.50. It is half price. How much is it now, in pence?"
                answer: "225"
                hints: ["Half of £4.50 is £2.25."]
              - id: l2-s5
                type: text_input
                text: "One entry costs £4. A group ticket for 10 children costs £35. How much does the group save, in pounds?"
                answer: "5"
                hints: ["10 × £4 = £40."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Apples cost 30p each, or a bag of 10 for £2.50. Which is cheaper for 10 apples?"
                options: ["the bag of 10", "10 single apples", "they cost the same"]
                answer: "the bag of 10"
              - id: l2-n2
                type: multiple_choice
                text: "Shop A: a cap for £9.90. Shop B: the same cap for £10.09. Where is it cheaper?"
                options: ["Shop A", "Shop B", "the same in both"]
                answer: "Shop A"
              - id: l2-n3
                type: true_false
                text: "Postcards cost 85p each, or 4 for £3.50. Is the offer cheaper for 4 postcards?"
                answer: false
              - id: l2-n4
                type: text_input
                text: "Crisps cost 70p a packet. The shop has 3 for 2. How much do 6 packets cost, in pence?"
                answer: "280"
              - id: l2-n5
                type: multiple_choice
                text: "Grandad needs 4 tins of paint. One tin costs £8. Offer: buy 3, get 1 free. How much does he pay?"
                options: ["£24", "£32", "£8"]
                answer: "£24"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: steps
            type: multiple_choice
            text: "Zara buys a drink for £1.35 and a muffin for £1.90. She pays with a £5 note. How much change does she get?"
            options: ["£1.75", "£3.25", "£2.75"]
            answer: "£1.75"
          - id: l2-c2
            part: compare
            type: multiple_choice
            text: "Eggs cost 25p each, or a box of 6 for £1.45. Which is cheaper for 6 eggs?"
            options: ["the box of 6", "6 single eggs", "they cost the same"]
            answer: "the box of 6"
          - id: l2-c3
            part: answer
            type: multiple_choice
            text: "Which answer sentence fits?\nQuestion: How much does Ben save?\n£6.00 − £5.40 = £0.60"
            options: ["Ben saves 60p.", "Ben pays 60p.", "Ben saves £5.40."]
            answer: "Ben saves 60p."
          - id: l2-c4
            part: enough
            type: true_false
            text: "A notebook costs 85p. Is £3 enough for 4 notebooks?"
            answer: false
          - id: l2-c5
            part: save
            type: text_input
            text: "One ticket costs £7. A ticket for 4 friends together costs £24. How much do the 4 friends save, in pounds?"
            answer: "4"
          - id: l2-c6
            part: steps
            type: multiple_choice
            text: "Noah buys 3 cartons of juice at 75p each and a sandwich for £2.60. What is the total?"
            options: ["£4.85", "£3.35", "£4.75"]
            answer: "£4.85"
          - id: l2-c7
            part: steps
            type: multiple_choice
            text: "Chloe buys a scarf for £11.25 and gloves for £6.80. She pays with a £20 note. How much change does she get?"
            options: ["£1.95", "£18.05", "£2.05"]
            answer: "£1.95"
          - id: l2-c8
            part: steps
            type: fill_in_blank
            text: "Mr Patel buys 2 tickets at £5.40 each. He pays with a £20 note. Fill in the steps."
            frame: "2 × £5.40 = £_   change: £_"
            options: ["10.80", "9.20", "14.60", "10.20"]
            answer: ["10.80", "9.20"]
          - id: l2-c9
            part: enough
            type: true_false
            text: "A bike lock costs £7.45 and a bell costs £2.65. Is £10 enough for both?"
            answer: false
          - id: l2-c10
            part: enough
            type: true_false
            text: "A hot chocolate costs £1.90. Is £10 enough for 5 hot chocolates?"
            answer: true
          - id: l2-c11
            part: enough
            type: multiple_choice
            text: "Ollie has £15. He wants 3 books at £4.60 each. Has he got enough money?"
            options: ["Yes, with £1.20 left over.", "No, he needs £1.20 more.", "Yes, with £10.40 left over."]
            answer: "Yes, with £1.20 left over."
          - id: l2-c12
            part: compare
            type: multiple_choice
            text: "Muffins cost 55p each, or a box of 4 for £2.40. Which is cheaper for 4 muffins?"
            options: ["4 single muffins", "the box of 4", "they cost the same"]
            answer: "4 single muffins"
          - id: l2-c13
            part: compare
            type: multiple_choice
            text: "Shop A: a lunchbox for £8, with £2 off. Shop B: the same lunchbox for £12, at half price. Where is it cheaper?"
            options: ["Shop A", "Shop B", "the same in both"]
            answer: "the same in both"
          - id: l2-c14
            part: compare
            type: true_false
            text: "Batteries cost 40p each, or a pack of 8 for £2.80. Is the pack cheaper than 8 single batteries?"
            answer: true
          - id: l2-c15
            part: save
            type: text_input
            text: "A football usually costs £12. Today it is half price. How much do you save, in pounds?"
            answer: "6"
          - id: l2-c16
            part: save
            type: text_input
            text: "Comics cost £2.50 each. The shop has 3 for 2. How much do you save on 3 comics, in pence?"
            answer: "250"
          - id: l2-c17
            part: save
            type: multiple_choice
            text: "One swim costs £3.50. A pass for 6 swims costs £18. How much do you save with the pass?"
            options: ["£3", "£21", "£3.50"]
            answer: "£3"
          - id: l2-c18
            part: answer
            type: multiple_choice
            text: "Which answer sentence fits?\nQuestion: How much do 5 stamps cost?\n5 × 85p = 425p"
            options: ["5 stamps cost £4.25.", "5 stamps cost £425.", "One stamp costs £4.25."]
            answer: "5 stamps cost £4.25."
          - id: l2-c19
            part: answer
            type: multiple_choice
            text: "Which answer sentence fits?\nQuestion: Which is cheaper, 4 single cans or the pack of 4?\n4 × 65p = £2.60. The pack costs £2.40."
            options: ["The pack is cheaper, by 20p.", "4 single cans are cheaper.", "The pack costs 20p."]
            answer: "The pack is cheaper, by 20p."
          - id: l2-c20
            part: answer
            type: true_false
            text: "Question: How much change does Isla get from £5?\nIsla works out £1.80 + £2.45 = £4.25 and writes: Isla gets £4.25 change.\nIs her answer right?"
            answer: false
