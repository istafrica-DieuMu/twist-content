# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.area-rectangles
skill: math.area-volume.area-rectangles
curriculum: en-GB
language: en
title:
  de: Flächeninhalt von Rechtecken
  en: Area of rectangles
summary: >
  The area of a rectangle is length × width, in square centimetres (cm²)
  or square metres (m²). Lesson 1 calculates areas, finds a missing side
  and picks the unit; lesson 2 estimates the area of irregular shapes by
  counting whole and part squares, compares rectangles with the same area,
  solves floor, wall and garden problems, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.area-volume.area-unit-squares, math.length.calculate]
  also_practises: [math.area-volume.area-unit-squares]
  vocabulary: { en: [area, square centimetre, cm², square metre, m², length, width, rectangle, square, perimeter, estimate, irregular shape] }
  forms: [drawn, text, audio]
  drawn: [grid]
  facets: [currency]
  parts:
    - { id: calculate, what: { de: den Flächeninhalt eines Rechtecks in cm² und m² berechnen, en: calculating the area of a rectangle in cm² and m² } }
    - { id: missing-side, what: { de: eine fehlende Seite aus dem Flächeninhalt finden, en: finding a missing side from the area } }
    - { id: irregular, what: { de: den Flächeninhalt unregelmäßiger Figuren bestimmen und schätzen, en: finding and estimating the area of irregular shapes } }
    - { id: in-context, what: { de: Sachaufgaben mit Flächen, en: problems with area } }
  misconceptions:
    - id: area-perimeter
      what: Adds the sides (finds the perimeter) instead of multiplying
      addressed: lesson 1 Learn counts the squares inside; l1-f1 and l1-f2 have feedback on the perimeter, l1-s2 and l2-c1 offer it, l2-s5 asks whether equal areas mean equal perimeters
    - id: adds-sides
      what: Picks a rectangle whose sides add up to the area (4 cm by 8 cm for 12 cm²)
      addressed: l2-f4 has feedback, l2-s3 offers sides that add to the same total
    - id: halves-as-wholes
      what: Counts each half square as a whole one, or leaves part squares out of an estimate
      addressed: lesson 2 Learn pairs halves and counts squares more than half covered; l2-f1 has feedback, l2-f2, l2-s1, l2-n3 and l2-c4 count halves, l2-f3, l2-s2 and l2-c5 estimate
    - id: unit
      what: Writes cm or m for an area, or picks cm² for a large space
      addressed: lesson 1 Learn names cm² and m²; l1-f3 and l1-f5 choose the unit, l1-c3 checks it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Länge mal Breite, en: Length times width }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many squares does the blue shape cover?"
            show: { drawn: grid, cols: 6, rows: 5, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue], [4, 3, blue]] }
            options: ["12", "14", "7"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "A table is 1 m 20 cm long. How many centimetres is that?"
            options: ["120 cm", "102 cm", "1200 cm"]
            answer: "120 cm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Area = length × width\n5 cm × 3 cm = 15 cm²"
            say: "Each square here is one square centimetre. The rectangle has three rows of five squares, so you do not need to count them one by one: five times three is fifteen. The area is fifteen square centimetres."
            show: { drawn: grid, cols: 7, rows: 5, cells: [[1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [5, 1, green], [1, 2, green], [2, 2, green], [3, 2, green], [4, 2, green], [5, 2, green], [1, 3, green], [2, 3, green], [3, 3, green], [4, 3, green], [5, 3, green]] }
          - text: "Small things: cm². Big spaces: m².\nA playground 8 m by 4 m: 8 m × 4 m = 32 m²"
            say: "For small things like a book or a stamp, we use square centimetres. For big spaces like a room or a playground, we use square metres. A playground eight metres long and four metres wide has an area of thirty-two square metres."
          - text: "Area 24 cm², length 6 cm\nwidth = 24 ÷ 6 = 4 cm"
            say: "If you know the area and one side, divide to find the other side. The area is twenty-four square centimetres and the length is six centimetres. Twenty-four divided by six is four, so the width is four centimetres."
          - text: "Area is not perimeter.\n5 cm by 3 cm: area 15 cm², perimeter 16 cm"
            say: "Do not mix up area and perimeter. The perimeter is the distance all the way round the edge: five plus three plus five plus three is sixteen centimetres. The area is the space inside: fifteen square centimetres."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Each square is 1 cm². What is the area of the rectangle?"
                show: { drawn: grid, cols: 8, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [6, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [5, 2, blue], [6, 2, blue]] }
                options: ["12 cm²", "16 cm²", "8 cm²"]
                answer: "12 cm²"
                feedback:
                  "16 cm²": "16 is the perimeter, the distance round the edge. Area is the squares inside: 6 × 2."
                hints:
                  - "How many squares long and how many squares wide is it?"
                  - "It is 6 squares long and 2 squares wide."
                  - "6 × 2 = 12, so the area is 12 cm²."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A rectangle is 7 cm long and 4 cm wide. What is its area?"
                options: ["28 cm²", "22 cm²", "11 cm²"]
                answer: "28 cm²"
                feedback:
                  "22 cm²": "That adds all four sides: it is the perimeter. For the area, multiply the length by the width."
                hints:
                  - "Area = length × width."
                  - "Multiply 7 by 4."
                  - "7 × 4 = 28, so 28 cm²."
              - id: l1-f3
                type: fill_in_blank
                text: "A classroom floor is 9 m long and 6 m wide. Find its area."
                frame: "9 m × 6 m = _ _"
                options: ["15", "54", "m", "m²", "cm²"]
                answer: ["54", "m²"]
                hints:
                  - "Multiply, then choose the unit for an area in metres."
                  - "9 × 6 = 54. Metres times metres gives square metres."
                  - "54 m²."
              - id: l1-f4
                type: multiple_choice
                text: "A rectangle has an area of 24 cm². It is 6 cm long. How wide is it?"
                options: ["4 cm", "18 cm", "144 cm"]
                answer: "4 cm"
                hints:
                  - "Length × width = area, so 6 × ? = 24."
                  - "Divide the area by the length you know."
                  - "24 ÷ 6 = 4, so it is 4 cm wide."
              - id: l1-f5
                type: multiple_choice
                text: "Which unit would you use for the area of a football pitch?"
                options: ["m²", "cm²", "m"]
                answer: "m²"
                hints:
                  - "Is a football pitch small or very big?"
                  - "Big spaces are measured in square metres. Metres alone measure a length."
                  - "Square metres: m²."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "A rectangle is 8 cm long and 5 cm wide. What is its area in cm²?"
                answer: "40"
                hints: ["Multiply the length by the width."]
              - id: l1-s2
                type: multiple_choice
                text: "Each square is 1 cm². What is the area of the square?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 1, red], [2, 1, red], [3, 1, red], [1, 2, red], [2, 2, red], [3, 2, red], [1, 3, red], [2, 3, red], [3, 3, red]] }
                options: ["9 cm²", "12 cm²", "6 cm²"]
                answer: "9 cm²"
                hints: ["3 rows of 3 squares."]
              - id: l1-s3
                type: multiple_choice
                text: "A square has sides of 7 m. What is its area?"
                options: ["49 m²", "28 m²", "14 m²"]
                answer: "49 m²"
                hints: ["A square is as long as it is wide: 7 × 7."]
              - id: l1-s4
                type: text_input
                text: "A rectangle has an area of 36 m². It is 9 m long. How wide is it, in m?"
                answer: "4"
                hints: ["Divide the area by the length."]
              - id: l1-s5
                type: true_false
                text: "Is it true? A rectangle 10 cm by 2 cm has the same area as a square with sides of 5 cm."
                answer: false
                hints: ["Work out both areas: 10 × 2 and 5 × 5."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "A garden is 12 m long and 5 m wide. What is its area in m²?"
                answer: "60"
              - id: l1-n2
                type: multiple_choice
                text: "Which rectangle has the bigger area: 6 cm by 6 cm, or 9 cm by 4 cm?"
                options: ["6 cm by 6 cm", "9 cm by 4 cm", "They are the same."]
                answer: "They are the same."
                keep_order: true
              - id: l1-n3
                type: text_input
                text: "A poster is 30 cm wide and 40 cm tall. What is its area in cm²?"
                answer: "1200"
              - id: l1-n4
                type: multiple_choice
                text: "A rug has an area of 15 m². It is 5 m long. How wide is it?"
                options: ["3 m", "10 m", "75 m"]
                answer: "3 m"
              - id: l1-n5
                type: true_false
                text: "Is it true? A rectangle 8 m by 3 m has an area of 24 m²."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A rectangle is 9 cm long and 3 cm wide. What is its area?"
            options: ["27 cm²", "24 cm²", "12 cm²"]
            answer: "27 cm²"
          - id: l1-c2
            type: text_input
            text: "A square has sides of 6 m. What is its area in m²?"
            answer: "36"
          - id: l1-c3
            type: multiple_choice
            text: "Which unit would you use for the area of a postage stamp?"
            options: ["cm²", "m²", "cm"]
            answer: "cm²"
          - id: l1-c4
            type: text_input
            text: "A rectangle has an area of 56 cm². It is 8 cm long. How wide is it, in cm?"
            answer: "7"
          - id: l1-c5
            type: true_false
            text: "Is it true? A rectangle 6 cm by 5 cm has an area of 22 cm²."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Each square is 1 cm². What is the area of the rectangle?"
            show: { drawn: grid, cols: 7, rows: 4, cells: [[1, 1, orange], [2, 1, orange], [3, 1, orange], [4, 1, orange], [5, 1, orange], [1, 2, orange], [2, 2, orange], [3, 2, orange], [4, 2, orange], [5, 2, orange]] }
            options: ["10 cm²", "14 cm²", "7 cm²"]
            answer: "10 cm²"

  - n: 2
    title: { de: Flächen schätzen und vergleichen, en: Estimate and compare areas }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A rectangle is 5 m long and 4 m wide. What is its area?"
            options: ["20 m²", "18 m²", "9 m²"]
            answer: "20 m²"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "A rectangle has an area of 30 cm². It is 5 cm long. How wide is it, in cm?"
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "6 whole squares + 4 half squares\n= 6 + 2 = 8 cm²"
            say: "This shape is not a rectangle, so count. There are six whole squares. There are four half squares, and two halves make one whole, so they make two more. The area is eight square centimetres."
            show: { drawn: grid, cols: 6, rows: 4, cells: [[1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [2, 2, green], [3, 2, green]], halves: [[0, 1, br, green], [5, 1, bl, green], [1, 2, tr, green], [4, 2, tl, green]] }
          - text: "A leaf on 1 cm squares:\n9 whole squares, 6 squares more than half covered\nabout 9 + 6 = 15 cm²"
            say: "A leaf has curved edges, so you can only estimate its area. Count the whole squares. Then count each square that is more than half covered as one, and leave out the squares that are less than half covered. Nine and six make about fifteen square centimetres."
          - text: "12 cm² = 6 cm × 2 cm = 4 cm × 3 cm = 12 cm × 1 cm"
            say: "Different rectangles can have the same area. Six by two, four by three and twelve by one all have an area of twelve square centimetres. Their perimeters are different."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Each square is 1 cm². What is the area of the green shape?"
                show: { drawn: grid, cols: 5, rows: 4, cells: [[1, 1, green], [2, 1, green], [1, 2, green], [2, 2, green]], halves: [[0, 1, br, green], [3, 1, bl, green]] }
                options: ["5 cm²", "6 cm²", "4 cm²"]
                answer: "5 cm²"
                feedback:
                  "6 cm²": "Each half square is only half of 1 cm². Two halves make one whole square."
                hints:
                  - "Count the whole squares first, then the halves."
                  - "There are 4 whole squares and 2 half squares."
                  - "4 + 1 = 5, so 5 cm²."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Each square is 1 cm². What is the area of the green shape?"
                show: { drawn: grid, cols: 6, rows: 4, cells: [[3, 0, green], [1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [2, 2, green], [3, 2, green]], halves: [[0, 1, br, green], [5, 1, bl, green], [1, 2, tr, green], [4, 2, tl, green]] }
                options: ["9 cm²", "11 cm²", "7 cm²"]
                answer: "9 cm²"
                hints:
                  - "Count the whole squares, then pair up the halves."
                  - "7 whole squares and 4 halves. 4 halves make 2 wholes."
                  - "7 + 2 = 9, so 9 cm²."
              - id: l2-f3
                type: multiple_choice
                text: "A leaf is drawn on 1 cm squares. It covers 10 whole squares and 8 squares that are more than half covered. About what is its area?"
                options: ["about 18 cm²", "about 10 cm²", "about 8 cm²"]
                answer: "about 18 cm²"
                hints:
                  - "Squares that are more than half covered count as one each."
                  - "Add the whole squares and the more-than-half squares."
                  - "10 + 8 = 18, so about 18 cm²."
              - id: l2-f4
                type: multiple_choice
                text: "Which rectangle has an area of 12 cm²?"
                options: ["3 cm by 4 cm", "3 cm by 9 cm", "4 cm by 8 cm"]
                answer: "3 cm by 4 cm"
                feedback:
                  "4 cm by 8 cm": "4 + 8 = 12, but area multiplies: 4 × 8 = 32 cm²."
                hints:
                  - "Multiply the two sides of each rectangle."
                  - "3 × 4, 3 × 9 and 4 × 8."
                  - "3 × 4 = 12, so 3 cm by 4 cm."
              - id: l2-f5
                type: text_input
                text: "A wall is 4 m long and 3 m high. One tin of paint covers 6 m². How many tins are needed?"
                answer: "2"
                hints:
                  - "First find the area of the wall."
                  - "4 × 3 = 12 m². How many lots of 6 m² is that?"
                  - "12 ÷ 6 = 2 tins."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Each square is 1 cm². What is the area of the red shape?"
                show: { drawn: grid, cols: 5, rows: 3, cells: [[1, 0, red], [2, 0, red], [3, 0, red], [1, 1, red], [2, 1, red]], halves: [[0, 0, br, red], [3, 1, tl, red]] }
                options: ["6 cm²", "7 cm²", "5 cm²"]
                answer: "6 cm²"
                hints: ["Two half squares make one whole square."]
              - id: l2-s2
                type: multiple_choice
                text: "A puddle is drawn on 1 m squares. It covers 7 whole squares and 6 squares that are more than half covered. About what is its area?"
                options: ["about 13 m²", "about 7 m²", "about 6 m²"]
                answer: "about 13 m²"
                hints: ["Count each square that is more than half covered as one."]
              - id: l2-s3
                type: multiple_choice
                text: "Which two rectangles have the same area?"
                options: ["2 cm by 8 cm and 4 cm by 4 cm", "2 cm by 8 cm and 5 cm by 5 cm", "3 cm by 5 cm and 4 cm by 4 cm"]
                answer: "2 cm by 8 cm and 4 cm by 4 cm"
                hints: ["Multiply the sides of each rectangle, then compare."]
              - id: l2-s4
                type: text_input
                text: "A floor is 6 m by 5 m. Carpet costs £10 for each m². How much does carpet for the whole floor cost, in £?"
                answer: "300"
                hints: ["Find the area first: 6 × 5."]
              - id: l2-s5
                type: true_false
                text: "Is it true? Two rectangles with the same area always have the same perimeter."
                answer: false
                hints: ["Try 6 cm by 2 cm and 4 cm by 3 cm."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A vegetable patch is 7 m long and 4 m wide. What is its area in m²?"
                answer: "28"
              - id: l2-n2
                type: multiple_choice
                text: "Ava's bedroom floor is 4 m by 3 m. Ben's is 5 m by 2 m. Whose floor has the bigger area?"
                options: ["Ava's", "Ben's", "They are the same."]
                answer: "Ava's"
                keep_order: true
              - id: l2-n3
                type: text_input
                text: "A tile design is drawn on 1 cm squares. What is the area of the blue design, in cm²?"
                show: { drawn: grid, cols: 6, rows: 4, cells: [[1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue]], halves: [[0, 0, br, blue], [5, 0, bl, blue], [0, 1, tr, blue], [5, 1, tl, blue], [2, 2, tl, blue], [3, 2, tr, blue]] }
                answer: "11"
              - id: l2-n4
                type: multiple_choice
                text: "A patio is made of square slabs, each 1 m by 1 m. It is 6 slabs long and 4 slabs wide. What area does it cover?"
                options: ["24 m²", "20 m²", "10 m²"]
                answer: "24 m²"
              - id: l2-n5
                type: text_input
                text: "A rectangular lawn has an area of 48 m². It is 8 m long. How wide is it, in m?"
                answer: "6"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: calculate
            type: multiple_choice
            text: "Each square is 1 cm². What is the area of the rectangle?"
            show: { drawn: grid, cols: 9, rows: 4, cells: [[1, 1, purple], [2, 1, purple], [3, 1, purple], [4, 1, purple], [5, 1, purple], [6, 1, purple], [7, 1, purple], [1, 2, purple], [2, 2, purple], [3, 2, purple], [4, 2, purple], [5, 2, purple], [6, 2, purple], [7, 2, purple]] }
            options: ["14 cm²", "18 cm²", "9 cm²"]
            answer: "14 cm²"
          - id: l2-c2
            part: calculate
            type: text_input
            text: "A rectangle is 11 cm long and 4 cm wide. What is its area in cm²?"
            answer: "44"
          - id: l2-c3
            part: missing-side
            type: multiple_choice
            text: "A rectangle has an area of 42 m². It is 7 m long. How wide is it?"
            options: ["6 m", "35 m", "49 m"]
            answer: "6 m"
          - id: l2-c4
            part: irregular
            type: multiple_choice
            text: "Each square is 1 cm². What is the area of the orange shape?"
            show: { drawn: grid, cols: 5, rows: 3, cells: [[1, 1, orange], [2, 1, orange], [3, 1, orange]], halves: [[1, 0, bl, orange], [3, 0, br, orange], [0, 1, tr, orange], [4, 1, tl, orange]] }
            options: ["5 cm²", "7 cm²", "3 cm²"]
            answer: "5 cm²"
          - id: l2-c5
            part: irregular
            type: multiple_choice
            text: "A pond is drawn on 1 m squares. It covers 12 whole squares and 4 squares that are more than half covered. About what is its area?"
            options: ["about 16 m²", "about 12 m²", "about 4 m²"]
            answer: "about 16 m²"
          - id: l2-c6
            part: calculate
            type: true_false
            text: "Is it true? A square with sides of 9 cm has an area of 36 cm²."
            answer: false
          - id: l2-c7
            part: calculate
            type: multiple_choice
            text: "Which is the most sensible area for a classroom floor?"
            options: ["about 60 m²", "about 60 cm²", "about 6 m²"]
            answer: "about 60 m²"
          - id: l2-c8
            part: calculate
            type: text_input
            text: "A table top is 120 cm long and 50 cm wide. What is its area in cm²?"
            answer: "6000"
          - id: l2-c9
            part: missing-side
            type: text_input
            text: "A rectangle has an area of 63 cm². It is 9 cm wide. How long is it, in cm?"
            answer: "7"
          - id: l2-c10
            part: missing-side
            type: multiple_choice
            text: "A square has an area of 25 m². How long is each side?"
            options: ["5 m", "6 m", "25 m"]
            answer: "5 m"
          - id: l2-c11
            part: missing-side
            type: fill_in_blank
            text: "A rectangle has an area of 40 m². It is 8 m long. Find its width."
            frame: "8 m × _ m = 40 m²"
            options: ["4", "5", "32"]
            answer: ["5"]
          - id: l2-c12
            part: missing-side
            type: true_false
            text: "Is it true? A rectangle with an area of 32 cm² and a length of 8 cm is 4 cm wide."
            answer: true
          - id: l2-c13
            part: irregular
            type: multiple_choice
            text: "Each square is 1 cm². What is the area of the blue shape?"
            show: { drawn: grid, cols: 5, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [2, 2, blue]], halves: [[0, 1, br, blue], [4, 1, bl, blue], [1, 2, tr, blue], [3, 2, tl, blue]] }
            options: ["6 cm²", "8 cm²", "4 cm²"]
            answer: "6 cm²"
          - id: l2-c14
            part: irregular
            type: text_input
            text: "A cloud is drawn on 1 cm squares. It covers 14 whole squares and 5 squares that are more than half covered. About how many cm² is its area?"
            answer: "19"
          - id: l2-c15
            part: irregular
            type: multiple_choice
            text: "A footprint is drawn on 1 cm squares. It covers 20 whole squares, 6 squares that are more than half covered and 5 squares that are less than half covered. About what is its area?"
            options: ["about 26 cm²", "about 31 cm²", "about 20 cm²"]
            answer: "about 26 cm²"
          - id: l2-c16
            part: in-context
            type: text_input
            text: "A wall is 8 m long and 3 m high. One tin of paint covers 6 m². How many tins are needed?"
            answer: "4"
          - id: l2-c17
            part: in-context
            type: multiple_choice
            text: "Mia's garden is 10 m by 4 m. Leo's garden is 6 m by 7 m. Whose garden has the bigger area?"
            options: ["Mia's", "Leo's", "They are the same."]
            answer: "Leo's"
            keep_order: true
          - id: l2-c18
            part: in-context
            type: text_input
            text: "Turf costs £3 for each m². How much does turf for a lawn 9 m by 4 m cost, in £?"
            answer: "108"
          - id: l2-c19
            part: in-context
            type: true_false
            text: "A photo is 15 cm long and 10 cm wide. Is it true that its area is 150 cm²?"
            answer: true
          - id: l2-c20
