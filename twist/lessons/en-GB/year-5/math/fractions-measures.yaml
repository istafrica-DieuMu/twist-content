# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.fractions-measures
skill: math.fractions.everyday-measures
curriculum: en-GB
language: en
title:
  de: Brüche bei Größen
  en: Fractions of measures
summary: >
  Lesson 1 turns half, quarter and three quarters of an hour into minutes
  and of a metre into centimetres: first the whole in the smaller unit (1
  hour = 60 minutes, 1 m = 100 cm), then divide by 4 for a quarter and
  take three of them for three quarters, with a circle and a bar as the
  model; lesson 2 does the same for litres and kilograms (¼ l = 250 ml,
  ¾ kg = 750 g), adds one and a half, and ends with the skill check. Each
  unit keeps its own whole, so ½ hour is 30 minutes and not 50.
metadata:
  year: year-5
  topic: { de: Brüche, en: Fractions }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.fractions.halves-quarters, math.time.quarter-hours, math.length.cm-m]
  also_practises: [math.time.quarter-hours, math.mass-capacity.l-ml, math.mass-capacity.g-kg]
  vocabulary: { en: [half, quarter, three quarters, one and a half, hour, minutes, metre, centimetres, litre, millilitres, kilogram, grams] }
  forms: [text, audio, drawn]
  drawn: [fraction, clock]
  facets: []
  misconceptions:
    - id: denominator-as-amount
      what: Takes the number under the line as the amount (¼ hour = 4 minutes, ¼ m = 4 cm, ¼ l = 4 ml)
      addressed: lesson 1 Learn divides the whole by 4; l1-f2 and l1-f3 (with feedback), l2-f1 and l2-n2 offer the denominator as the amount
    - id: one-whole-for-all
      what: Uses 100 as the whole for every unit, so ½ hour becomes 50 minutes and ¼ l becomes 25 ml
      addressed: lesson 1 Learn screen 4 sets 1 hour = 60 minutes against 1 m = 100 cm; l1-f1, l1-f2 and l2-f1 have feedback on it, l1-s3, l1-c3 and l2-c5 ask it as true or false
    - id: three-quarters
      what: Reads ¾ as one quarter or as 3 and 4 side by side (¾ kg = 34 g or 340 g)
      addressed: lessons 1 and 2 Learn build ¾ as three quarters; l1-f4 and l2-f3 take three quarters step by step, l2-f4 (with feedback) and l2-n2 offer 340, l2-c4 compares ¾ kg with 800 g
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Stunden und Meter", en: "Hours and metres" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What time is it?"
            show: { drawn: clock, hour: 4, minute: 15 }
            options: ["quarter past 4", "quarter to 4", "half past 4"]
            answer: "quarter past 4"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "1 m = _ cm"
            say: "How many centimetres are in one metre?"
            answer: "100"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 hour = 60 minutes\n½ hour = 60 ÷ 2 = 30 minutes\n¼ hour = 60 ÷ 4 = 15 minutes"
            say: "An hour is sixty minutes. Half an hour is sixty divided by two, which is thirty minutes. A quarter of an hour is sixty divided by four, which is fifteen minutes."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
          - text: "¾ hour = 3 × 15 = 45 minutes"
            say: "Three quarters of an hour is three lots of fifteen minutes. That is forty-five minutes, from four o'clock to quarter to five."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
          - text: "1 m = 100 cm\n½ m = 50 cm   ¼ m = 25 cm   ¾ m = 75 cm"
            say: "A metre is one hundred centimetres. Half a metre is fifty centimetres. A quarter of a metre is one hundred divided by four, which is twenty-five centimetres. Three quarters of a metre is three lots of twenty-five, which is seventy-five centimetres."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }
          - text: "Each unit has its own whole.\n½ hour = 30 minutes, not 50.\n½ m = 50 cm."
            say: "Always start from the whole of that unit. An hour has sixty minutes, so half an hour is thirty minutes. A metre has one hundred centimetres, so half a metre is fifty centimetres."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "½ hour = _ minutes"
                options: ["30", "50", "2"]
                answer: "30"
                feedback:
                  "50": "An hour has 60 minutes, not 100. Half of 60 is 30."
                hints:
                  - "How many minutes are in a whole hour?"
                  - "60 minutes. Halve it."
                  - "30 minutes."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "¼ hour = _ minutes"
                options: ["15", "25", "4"]
                answer: "15"
                feedback:
                  "4": "The 4 says the hour is split into 4 equal parts. How long is one part?"
                  "25": "25 is a quarter of 100. An hour has 60 minutes."
                hints:
                  - "Split the 60 minutes into 4 equal parts."
                  - "60 ÷ 4."
                  - "15 minutes."
              - id: l1-f3
                type: multiple_choice
                text: "¼ m = _ cm"
                options: ["25", "4", "15"]
                answer: "25"
                feedback:
                  "4": "The 4 says the metre is split into 4 equal parts. How long is one part?"
                  "15": "15 minutes is a quarter of an hour. A metre has 100 cm."
                hints:
                  - "A metre is 100 cm."
                  - "100 ÷ 4."
                  - "25 cm."
              - id: l1-f4
                type: fill_in_blank
                text: "How many centimetres is three quarters of a metre?"
                frame: "¾ m = 3 × _ cm = _ cm"
                options: ["25", "75", "34", "50"]
                answer: ["25", "75"]
                hints:
                  - "First find one quarter of a metre."
                  - "¼ m is 25 cm. Three quarters is three of them."
                  - "3 × 25 cm = 75 cm."
              - id: l1-f5
                type: multiple_choice
                text: "A film starts at 4:00 and lasts ¾ hour. When does it end?"
                show: { drawn: clock, hour: 4, minute: 0 }
                options: ["4:45", "4:34", "4:15"]
                answer: "4:45"
                hints:
                  - "How many minutes is ¾ hour?"
                  - "3 × 15 = 45 minutes."
                  - "45 minutes after 4:00 is 4:45."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "¾ hour = _ minutes"
                answer: "45"
                hints: ["A quarter of an hour is 15 minutes. Take three of them."]
              - id: l1-s2
                type: multiple_choice
                text: "½ m = _ cm"
                options: ["50", "30", "2"]
                answer: "50"
                hints: ["Half of 100 cm."]
              - id: l1-s3
                type: true_false
                text: "Is it true? ½ hour = 50 minutes"
                answer: false
                hints: ["How many minutes are in a whole hour?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which is longer: ¾ m or 70 cm?"
                options: ["¾ m", "70 cm", "They are the same."]
                answer: "¾ m"
                keep_order: true
                hints: ["Change ¾ m into centimetres."]
              - id: l1-s5
                type: multiple_choice
                text: "Mia practises the piano for a quarter of an hour every day. How many minutes is that in 4 days?"
                options: ["60", "16", "100"]
                answer: "60"
                hints: ["A quarter of an hour is 15 minutes."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "¼ hour + ½ hour = _ minutes"
                answer: "45"
              - id: l1-n2
                type: multiple_choice
                text: "Lucy has ½ m of ribbon. She cuts it into two equal pieces. How long is each piece?"
                options: ["25 cm", "50 cm", "2 cm"]
                answer: "25 cm"
              - id: l1-n3
                type: true_false
                text: "Is it true? ¼ m is longer than 20 cm."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Which is the same as 15 minutes?"
                options: ["¼ hour", "½ hour", "¾ hour"]
                answer: "¼ hour"
                keep_order: true
              - id: l1-n5
                type: multiple_choice
                text: "A lesson starts at 9:15 and lasts ¾ hour. When does it end?"
                options: ["10:00", "9:60", "9:45"]
                answer: "10:00"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "¾ hour = _"
            options: ["45 minutes", "34 minutes", "75 minutes"]
            answer: "45 minutes"
          - id: l1-c2
            type: multiple_choice
            text: "½ m + ¼ m = _"
            options: ["75 cm", "3 cm", "35 cm"]
            answer: "75 cm"
          - id: l1-c3
            type: true_false
            text: "Is it true? ¼ hour = 25 minutes"
            answer: false

  - n: 2
    title: { de: "Liter und Kilogramm", en: "Litres and kilograms" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "½ hour = _"
            options: ["30 minutes", "50 minutes", "20 minutes"]
            answer: "30 minutes"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "¾ m = _"
            options: ["75 cm", "34 cm", "25 cm"]
            answer: "75 cm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 l = 1000 ml\n½ l = 500 ml   ¼ l = 250 ml   ¾ l = 750 ml"
            say: "A litre is one thousand millilitres. Half a litre is five hundred millilitres. A quarter of a litre is one thousand divided by four, which is two hundred and fifty millilitres. Three quarters is three lots of two hundred and fifty, which is seven hundred and fifty millilitres."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 1 }
          - text: "1 kg = 1000 g\n½ kg = 500 g   ¼ kg = 250 g   ¾ kg = 750 g"
            say: "Kilograms work the same way, because a kilogram is also one thousand grams. A quarter of a kilogram is two hundred and fifty grams, and three quarters of a kilogram is seven hundred and fifty grams."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
          - text: "1½ hours = 60 + 30 = 90 minutes\n1½ l = 1000 + 500 = 1500 ml"
            say: "One and a half means one whole and a half. One and a half hours is sixty minutes and thirty minutes, so ninety minutes. One and a half litres is one thousand millilitres and five hundred millilitres, so one thousand five hundred millilitres."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "¼ l = _ ml"
                options: ["250", "25", "4"]
                answer: "250"
                feedback:
                  "25": "A litre has 1000 ml, not 100. A quarter of 1000 is 250."
                  "4": "The 4 says the litre is split into 4 equal parts. How much is one part?"
                hints:
                  - "A litre is 1000 ml."
                  - "1000 ÷ 4. Half of 1000 is 500, half again is 250."
                  - "250 ml."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "½ kg = _ g"
                options: ["500", "50", "2"]
                answer: "500"
                hints:
                  - "A kilogram is 1000 g."
                  - "Half of 1000."
                  - "500 g."
              - id: l2-f3
                type: fill_in_blank
                text: "How many grams is three quarters of a kilogram?"
                frame: "¾ kg = 3 × _ g = _ g"
                options: ["250", "750", "340", "500"]
                answer: ["250", "750"]
                hints:
                  - "First find a quarter of a kilogram."
                  - "¼ kg is 250 g. Take three of them."
                  - "3 × 250 g = 750 g."
              - id: l2-f4
                type: multiple_choice
                text: "A pancake recipe needs ¾ l of milk. How many millilitres is that?"
                options: ["750 ml", "75 ml", "340 ml"]
                answer: "750 ml"
                feedback:
                  "340 ml": "¾ is not the digits 3 and 4. It means 3 quarters of a litre."
                  "75 ml": "A litre has 1000 ml, so a quarter is 250 ml."
                hints:
                  - "A quarter of a litre is 250 ml."
                  - "Three quarters is three lots of 250 ml."
                  - "750 ml."
              - id: l2-f5
                type: multiple_choice
                text: "1½ hours = _ minutes"
                options: ["90", "150", "80"]
                answer: "90"
                feedback:
                  "150": "One and a half hours is one hour and half an hour. An hour has 60 minutes."
                hints:
                  - "One whole hour and half an hour."
                  - "60 minutes + 30 minutes."
                  - "90 minutes."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "¼ kg = _ g"
                answer: "250"
                hints: ["Split 1000 g into 4 equal parts."]
              - id: l2-s2
                type: multiple_choice
                text: "Which is the same as 500 ml?"
                options: ["½ l", "¼ l", "5 l"]
                answer: "½ l"
                hints: ["What fraction of 1000 ml is 500 ml?"]
              - id: l2-s3
                type: true_false
                text: "Is it true? 1½ m = 150 cm"
                answer: true
                hints: ["One whole metre and half a metre."]
              - id: l2-s4
                type: multiple_choice
                text: "Which is heavier: ¾ kg or 700 g?"
                options: ["¾ kg", "700 g", "They are the same."]
                answer: "¾ kg"
                keep_order: true
                hints: ["Change ¾ kg into grams."]
              - id: l2-s5
                type: multiple_choice
                text: "Gran buys ½ kg of cherries and ¼ kg of strawberries. How many grams of fruit is that?"
                options: ["750 g", "3 g", "75 g"]
                answer: "750 g"
                hints: ["500 g + 250 g."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "¾ l = _ ml"
                answer: "750"
              - id: l2-n2
                type: multiple_choice
                text: "Which is the same as ¾ kg?"
                options: ["750 g", "340 g", "4 g"]
                answer: "750 g"
              - id: l2-n3
                type: text_input
                text: "2½ l = _ ml"
                answer: "2500"
              - id: l2-n4
                type: true_false
                text: "Is it true? ¼ l is more than 300 ml."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "A swimming lesson lasts 1¼ hours. How many minutes is that?"
                options: ["75", "125", "65"]
                answer: "75"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "A bus ride takes ½ hour and a train ride takes ¼ hour. How long is that altogether?"
            options: ["45 minutes", "75 minutes", "6 minutes"]
            answer: "45 minutes"
          - id: l2-c2
            type: true_false
            text: "Is it true? ¾ m = 75 cm"
            answer: true
          - id: l2-c3
            type: multiple_choice
            text: "Which is the same as 250 g?"
            options: ["¼ kg", "½ kg", "¾ kg"]
            answer: "¼ kg"
            keep_order: true
          - id: l2-c4
            type: multiple_choice
            text: "Which is heavier: ¾ kg or 800 g?"
            options: ["¾ kg", "800 g", "They are the same."]
            answer: "800 g"
            keep_order: true
          - id: l2-c5
            type: true_false
            text: "Is it true? ½ l = 50 ml"
            answer: false
