# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.decimals-calculate
skill: math.decimals.calculate
curriculum: en-GB
language: en
title:
  de: Mit Dezimalzahlen rechnen
  en: Calculating with decimals
summary: >
  Calculating with decimals in three lessons. Lesson 1 adds and subtracts
  decimals in columns with the decimal points lined up, filling empty
  places with zeros and exchanging; lesson 2 multiplies decimals by a
  one-digit whole number by partitioning and short multiplication, with an
  estimate first; lesson 3 divides by a one-digit number so that the
  answer has up to two decimal places (9 ÷ 4 = 2.25), checks with
  multiplication, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Dezimalzahlen, en: Decimals }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.decimals.thousandths, math.written-mult-div.div-one-digit]
  also_practises: [math.written-mult-div.div-one-digit]
  vocabulary: { en: [decimal point, line up, column method, exchange, tenths, hundredths, estimate, short multiplication, short division, remainder, share equally] }
  forms: [drawn, text, audio]
  drawn: [written-calc, short-division]
  facets: [number-format, currency, operation-signs]
  parts:
    - { id: add-sub, what: { de: Dezimalzahlen addieren und subtrahieren, en: adding and subtracting decimals } }
    - { id: multiply, what: { de: eine Dezimalzahl mit einer einstelligen Zahl multiplizieren, en: multiplying a decimal by a one-digit number } }
    - { id: divide, what: { de: mit bis zu zwei Nachkommastellen im Ergebnis teilen, en: dividing with up to two decimal places in the answer } }
    - { id: in-context, what: { de: Sachaufgaben mit Dezimalzahlen und Geld, en: word problems with decimals and money } }
  misconceptions:
    - id: right-aligned
      what: Lines up the last digits instead of the decimal points (2.4 + 1.35 = 1.59)
      addressed: lesson 1 Learn writes 1.2 as 1.20 under 3.45; l1-f1 has feedback, l1-f3, l1-s2 and l1-s3 offer the misaligned sum
    - id: smaller-from-bigger
      what: Takes the smaller digit from the bigger in each column instead of exchanging (7.3 − 2.6 = 5.3)
      addressed: lesson 1 Learn exchanges a whole for ten tenths; l1-f2 has feedback, l1-f5, l1-c2 and l1-n5 need an exchange
    - id: point-moves
      what: Puts the decimal point in the wrong place after multiplying (0.6 × 4 = 0.24 or 24)
      addressed: lesson 2 Learn counts tenths and estimates first; l2-f1 has feedback, l2-f4, l2-s4 and l2-n5 choose by estimate
    - id: remainder-as-decimal
      what: Writes a remainder as decimal digits (9 ÷ 4 = 2 r 1 written as 2.1)
      addressed: lesson 3 Learn shares the remainder as tenths and hundredths; l3-f3 has feedback, l3-s3 and l3-c4 offer it again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Addieren und subtrahieren, en: Adding and subtracting }
    goal:
      de: "Addiere und subtrahiere Dezimalzahlen schriftlich, mit den Kommas genau untereinander, so wie 3,45 plus 1,2."
      en: "Add and subtract decimals in columns with the decimal points lined up, like 3.45 plus 1.2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is the 6 in 2.468 worth?"
            options: ["6 tenths", "6 hundredths", "6 thousandths"]
            answer: "6 hundredths"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Work out 156 ÷ 4."
            answer: "39"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3.45 + 1.2\nIs it 4.65 or 3.57? Guess!"
            say: "Three point four five add one point two. Is the answer four point six five, or three point five seven? Have a guess."
          - text: "3.45 + 1.2: line up the decimal points.\n1.2 = 1.20"
            say: "To add decimals in columns, line up the decimal points, so tenths sit under tenths and hundredths under hundredths. One point two has no hundredths, so write it as one point two zero. Then add as usual: four point six five. Three point five seven comes from lining up the last digits, and that adds twelve hundredths, not one whole and two tenths."
            show: { drawn: written-calc, rows: ["3.45", "1.20"], op: "+", result: "4.65" }
          - text: "5.6 + 2.75 = 8.35"
            say: "Six tenths and seven tenths make thirteen tenths. That is one whole and three tenths, so write three and carry one into the ones."
            show: { drawn: written-calc, rows: ["5.60", "2.75"], op: "+", carry: "1   ", result: "8.35" }
          - text: "6.4 − 2.75 = 3.65"
            say: "To subtract, line up the points and write six point four as six point four zero. You cannot take five hundredths from zero, so exchange one tenth for ten hundredths. Then you cannot take seven tenths from three, so exchange one whole for ten tenths. The answer is three point six five."
            show: { drawn: written-calc, rows: ["6.40", "2.75"], op: "−", result: "3.65" }
          - text: "5 − 1.36 = 5.00 − 1.36 = 3.64"
            say: "A whole number has a decimal point after its ones. Write five as five point zero zero, then subtract: three point six four."
            show: { drawn: written-calc, rows: ["5.00", "1.36"], op: "−", result: "3.64" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "2.4 + 1.35 = _"
                show: { drawn: written-calc, rows: ["2.40", "1.35"], op: "+" }
                options: ["3.75", "1.59", "3.39"]
                answer: "3.75"
                feedback:
                  "1.59": "That lines up the last digits. Line up the decimal points instead: 2.40 + 1.35."
                hints:
                  - "Line up the decimal points and write 2.4 as 2.40."
                  - "Hundredths: 0 + 5. Tenths: 4 + 3. Ones: 2 + 1."
                  - "2.40 + 1.35 = 3.75."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "7.3 − 2.6 = _"
                show: { drawn: written-calc, rows: ["7.3", "2.6"], op: "−" }
                options: ["4.7", "5.3", "4.3"]
                answer: "4.7"
                feedback:
                  "5.3": "You cannot take 6 tenths from 3 tenths, so exchange one whole for 10 tenths: 13 − 6 = 7."
                hints:
                  - "Start with the tenths. Can you take 6 from 3?"
                  - "Exchange one whole for 10 tenths: 13 tenths − 6 tenths = 7 tenths."
                  - "6 − 2 = 4 ones left, so 4.7."
              - id: l1-f3
                type: fill_in_blank
                text: "Add 5.68 and 2.5."
                frame: "5.68 + 2.50 = _"
                options: ["8.18", "7.18", "5.93"]
                answer: ["8.18"]
                hints:
                  - "Hundredths, then tenths, then ones."
                  - "8 + 0 = 8. 6 + 5 = 11 tenths: write 1, carry 1 whole."
                  - "5 + 2 + 1 = 8, so 8.18."
              - id: l1-f4
                type: text_input
                keyboard: decimal
                text: "6 − 2.45 = _"
                answer: "3.55"
                hints:
                  - "Write 6 as 6.00."
                  - "Exchange: 6.00 is 5 ones, 9 tenths and 10 hundredths."
                  - "6.00 − 2.45 = 3.55."
              - id: l1-f5
                type: multiple_choice
                text: "Sam has £5.00. He spends £1.85. How much does he have left?"
                options: ["£3.15", "£4.25", "£3.25"]
                answer: "£3.15"
                hints:
                  - "Work out 5.00 − 1.85."
                  - "Count on: £1.85 + 15p = £2, then £3 more to £5."
                  - "15p + £3 = £3.15."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                keyboard: decimal
                text: "3.62 + 2.3 = _"
                answer: "5.92"
                hints: ["Write 2.3 as 2.30."]
              - id: l1-s2
                type: multiple_choice
                text: "8.15 − 3.7 = _"
                options: ["4.45", "5.48", "7.78"]
                answer: "4.45"
                hints: ["Write 3.7 as 3.70 and line up the points."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which shows 4.3 + 1.25 set out correctly?"
                options:
                  - { drawn: written-calc, rows: ["4.30", "1.25"], op: "+", key: points-lined-up }
                  - { drawn: written-calc, rows: ["4.3", "1.25"], op: "+", key: last-digits-lined-up }
                answer: points-lined-up
                hints: ["The decimal points must be in one column."]
              - id: l1-s4
                type: text_input
                keyboard: decimal
                text: "10 − 3.6 = _"
                answer: "6.4"
                hints: ["Count on from 3.6 to 4, then to 10."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 0.6 + 0.7 = 1.3"
                answer: true
                hints: ["6 tenths + 7 tenths = 13 tenths."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                keyboard: decimal
                text: "4.75 + 3.48 = _"
                answer: "8.23"
              - id: l1-n2
                type: text_input
                keyboard: decimal
                text: "9.2 − 4.56 = _"
                answer: "4.64"
              - id: l1-n3
                type: multiple_choice
                text: "Ruby jumps 2.85 m and then 3.4 m. How far is that altogether?"
                options: ["6.25 m", "3.19 m", "5.25 m"]
                answer: "6.25 m"
              - id: l1-n4
                type: text_input
                keyboard: decimal
                text: "A ribbon is 3 m long. Mia cuts off 1.25 m. How much is left, in metres?"
                answer: "1.75"
              - id: l1-n5
                type: true_false
                text: "Is it true? 5.4 − 2.15 = 3.39"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            keyboard: decimal
            text: "2.7 + 4.56 = _"
            answer: "7.26"
          - id: l1-c2
            type: multiple_choice
            text: "6.3 − 1.8 = _"
            options: ["4.5", "5.5", "4.4"]
            answer: "4.5"
          - id: l1-c3
            type: multiple_choice
            text: "£3.60 + £2.75 = _"
            options: ["£6.35", "£5.35", "£6.45"]
            answer: "£6.35"
          - id: l1-c4
            type: text_input
            keyboard: decimal
            text: "8.4 − 2.75 = _"
            answer: "5.65"
          - id: l1-c5
            type: true_false
            text: "Is it true? 3.5 + 1.25 = 1.60"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Ali runs 1.6 km and then walks 2.75 km. How far does he go altogether?"
            options: ["4.35 km", "2.91 km", "3.35 km"]
            answer: "4.35 km"

  - n: 2
    title: { de: Mit einer ganzen Zahl malnehmen, en: Multiplying by a whole number }
    goal:
      de: "Überschlage zuerst und nimm dann eine Dezimalzahl mit einer ganzen Zahl mal, so wie 2,4 mal 3 gleich 7,2."
      en: "Estimate first, then multiply a decimal by a whole number, like 2.4 times 3 is 7.2."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "4.5 + 2.8 = _"
            options: ["7.3", "6.3", "7.13"]
            answer: "7.3"
            difficulty: easy
          - id: l2-w2
            type: text_input
            keyboard: decimal
            text: "5 − 2.3 = _"
            answer: "2.7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "0.4 × 3\nIs the answer more than 1 or less than 1? Guess!"
            say: "Zero point four times three. Do you think the answer is more than one, or less than one? Have a guess."
          - text: "0.4 × 3 = 1.2\n4 tenths × 3 = 12 tenths = 1.2"
            say: "Think in tenths. Zero point four is four tenths. Four tenths times three is twelve tenths, and twelve tenths are one whole and two tenths: one point two."
          - text: "2.4 × 3\n2 × 3 = 6\n0.4 × 3 = 1.2\n6 + 1.2 = 7.2"
            say: "Partition the decimal. Two times three is six. Zero point four times three is one point two. Add them: seven point two."
          - text: "1.35 × 4 = 5.40 = 5.4"
            say: "Short multiplication works the same way. Five hundredths times four is twenty hundredths: write zero and carry two. Three tenths times four is twelve, plus two is fourteen: write four and carry one. One times four is four, plus one is five. The answer is five point four."
            show: { drawn: written-calc, rows: ["1.35", "4"], op: "×", carry: "1 2 ", result: "5.40" }
          - text: "Did you know? A 1p coin weighs 3.56 g. A 2p coin weighs 7.12 g.\n3.56 × 2 = 7.12"
            say: "Did you know? A one penny coin weighs three point five six grams. A two pence coin weighs seven point one two grams: exactly two times as much! Two one penny coins weigh the same as one two pence coin."
          - text: "3.9 × 5 is about 4 × 5 = 20\n3.9 × 5 = 19.5"
            say: "Estimate first, so you know where the decimal point goes. Three point nine is nearly four, and four times five is twenty. So the answer must be near twenty: nineteen point five, not one point nine five or one hundred and ninety-five."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "0.6 × 4 = _"
                options: ["2.4", "0.24", "24"]
                answer: "2.4"
                feedback:
                  "0.24": "6 tenths × 4 = 24 tenths. 24 tenths are 2 wholes and 4 tenths: 2.4."
                hints:
                  - "0.6 is 6 tenths."
                  - "6 tenths × 4 = 24 tenths."
                  - "24 tenths = 2.4."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Work out 3.2 × 4 by partitioning."
                frame: "3 × 4 = _, 0.2 × 4 = _, so 3.2 × 4 = _"
                options: ["8", "12", "0.8", "12.8", "20"]
                answer: ["12", "0.8", "12.8"]
                hints:
                  - "Split 3.2 into 3 and 0.2."
                  - "2 tenths × 4 = 8 tenths = 0.8."
                  - "12 + 0.8 = 12.8."
              - id: l2-f3
                type: multiple_choice
                text: "1.35 × 4 = _"
                show: { drawn: written-calc, rows: ["1.35", "4"], op: "×" }
                options: ["5.4", "4.12", "5.2"]
                answer: "5.4"
                hints:
                  - "Start with the hundredths: 5 × 4."
                  - "20 hundredths: write 0, carry 2. Then 3 × 4 + 2 = 14 tenths."
                  - "1 × 4 + 1 = 5, so 5.40 = 5.4."
              - id: l2-f4
                type: multiple_choice
                text: "Estimate first. Which is the answer to 4.9 × 6?"
                options: ["29.4", "2.94", "294"]
                answer: "29.4"
                hints:
                  - "4.9 is nearly 5."
                  - "5 × 6 = 30, so the answer is near 30."
                  - "29.4 is near 30."
              - id: l2-f5
                type: text_input
                keyboard: decimal
                text: "A pencil costs £0.45. How much do 3 pencils cost, in £?"
                answer: "1.35"
                hints:
                  - "Work out 0.45 × 3."
                  - "45p × 3 = 135p."
                  - "135p = £1.35."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                keyboard: decimal
                text: "0.7 × 5 = _"
                answer: "3.5"
                hints: ["7 tenths × 5 = 35 tenths."]
              - id: l2-s2
                type: multiple_choice
                text: "2.6 × 3 = _"
                options: ["7.8", "6.18", "6.8"]
                answer: "7.8"
                hints: ["2 × 3 = 6 and 0.6 × 3 = 1.8."]
              - id: l2-s3
                type: text_input
                keyboard: decimal
                text: "1.24 × 4 = _"
                answer: "4.96"
                hints: ["1 × 4 = 4 and 0.24 × 4 = 0.96."]
              - id: l2-s4
                type: multiple_choice
                text: "Which is the best estimate for 7.8 × 4?"
                options: ["32", "28", "3.2"]
                answer: "32"
                hints: ["Round 7.8 to the nearest whole number first."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 0.3 × 6 = 0.18"
                answer: false
                hints: ["3 tenths × 6 = 18 tenths."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                keyboard: decimal
                text: "A bottle holds 1.5 litres. How many litres do 5 bottles hold?"
                answer: "7.5"
              - id: l2-n2
                type: text_input
                keyboard: decimal
                text: "A ribbon is 2.35 m long. How long are 3 ribbons together, in metres?"
                answer: "7.05"
              - id: l2-n3
                type: multiple_choice
                text: "Bananas cost £0.28 each. How much do 5 bananas cost?"
                options: ["£1.40", "£10.40", "£1.04"]
                answer: "£1.40"
              - id: l2-n4
                type: text_input
                keyboard: decimal
                text: "One lap of the track is 0.4 km. Ella runs 7 laps. How far does she run, in km?"
                answer: "2.8"
              - id: l2-n5
                type: multiple_choice
                text: "A parcel weighs 3.6 kg. What do 4 of these parcels weigh?"
                options: ["14.4 kg", "12.24 kg", "1.44 kg"]
                answer: "14.4 kg"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: text_input
            keyboard: decimal
            text: "0.8 × 3 = _"
            answer: "2.4"
          - id: l2-c2
            type: multiple_choice
            text: "4.3 × 2 = _"
            options: ["8.6", "8.3", "0.86"]
            answer: "8.6"
          - id: l2-c3
            type: text_input
            keyboard: decimal
            text: "2.15 × 3 = _"
            answer: "6.45"
          - id: l2-c4
            type: multiple_choice
            text: "0.9 × 6 = _"
            options: ["5.4", "0.54", "54"]
            answer: "5.4"
          - id: l2-c5
            type: text_input
            keyboard: decimal
            text: "3.4 × 5 = _"
            answer: "17"
          - id: l2-c6
            type: multiple_choice
            text: "A tin of paint costs £5.95. Which is the best estimate for the cost of 4 tins?"
            options: ["£24", "£20", "£2.40"]
            answer: "£24"

  - n: 3
    title: { de: Teilen mit Dezimalstellen, en: Dividing with decimal answers }
    goal:
      de: "Teile weiter bis in die Zehntel und Hundertstel, so wie 9 geteilt durch 4 gleich 2,25, und prüf mit Malnehmen."
      en: "Keep dividing into tenths and hundredths, like 9 divided by 4 is 2.25, and check by multiplying."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "1.6 × 3 = _"
            options: ["4.8", "3.18", "0.48"]
            answer: "4.8"
            difficulty: easy
          - id: l3-w2
            type: text_input
            keyboard: decimal
            text: "0.9 × 4 = _"
            answer: "3.6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Share £9 between 4 friends. Each gets £2, and £1 is left over. Can you share that £1 too? Guess!"
            say: "Four friends share nine pounds. Each friend gets two pounds, and one pound is left over. Can you share that last pound fairly too? What do you think?"
          - text: "8.4 ÷ 2 = 4.2\n8 ÷ 2 = 4 and 0.4 ÷ 2 = 0.2"
            say: "Partition to divide. Eight divided by two is four. Four tenths divided by two is two tenths. So eight point four divided by two is four point two."
          - text: "7.5 ÷ 3\n7 ÷ 3 = 2 r 1\n1 whole = 10 tenths: 15 tenths ÷ 3 = 5 tenths\n7.5 ÷ 3 = 2.5"
            say: "Use short division. Seven divided by three is two, remainder one. Exchange the one whole for ten tenths. Now there are fifteen tenths, and fifteen tenths divided by three is five tenths. The answer is two point five."
            show: { drawn: short-division, divisor: 3, dividend: "7.5", quotient: "2.5", carries: "  1" }
          - text: "9 ÷ 4 = 9.00 ÷ 4\n9 ÷ 4 = 2 r 1\n10 tenths ÷ 4 = 2 tenths r 2 tenths\n20 hundredths ÷ 4 = 5 hundredths\n9 ÷ 4 = 2.25"
            say: "When there is a remainder, keep going. Write nine as nine point zero zero. Nine divided by four is two, remainder one. One whole is ten tenths, and ten tenths divided by four is two tenths, remainder two tenths. Two tenths are twenty hundredths, and twenty divided by four is five. So nine divided by four is two point two five. Yes, the last pound can be shared too: each friend gets two pounds and twenty-five pence."
            show: { drawn: short-division, divisor: 4, dividend: "9.00", quotient: "2.25", carries: "  12" }
          - text: "Check: 2.25 × 4 = 9"
            say: "Check with the inverse. Two point two five times four is nine, so the division is right."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "6.3 ÷ 3 = _"
                options: ["2.1", "2.01", "21"]
                answer: "2.1"
                feedback:
                  "2.01": "3 tenths ÷ 3 is 1 tenth, so the 1 goes in the tenths place: 2.1."
                hints:
                  - "Partition 6.3 into 6 and 0.3."
                  - "6 ÷ 3 = 2 and 3 tenths ÷ 3 = 1 tenth."
                  - "2 + 0.1 = 2.1."
                difficulty: easy
              - id: l3-f2
                type: fill_in_blank
                text: "Work out 7.5 ÷ 3."
                frame: "7 ÷ 3 = 2 r _, then _ tenths ÷ 3 = 5 tenths, so 7.5 ÷ 3 = _"
                options: ["1", "5", "15", "2.5", "2.15"]
                answer: ["1", "15", "2.5"]
                hints:
                  - "Divide the ones first, then exchange the remainder."
                  - "The remainder 1 is 10 tenths. Add the 5 tenths you already have."
                  - "2 r 1, then 15 tenths ÷ 3 = 5 tenths: 2.5."
              - id: l3-f3
                type: multiple_choice
                text: "9 ÷ 4 = _"
                options: ["2.25", "2.1", "2.4"]
                answer: "2.25"
                feedback:
                  "2.1": "2 r 1 is not 2.1. The 1 left over is 1 whole. Share it as tenths and hundredths: it makes 0.25 more."
                hints:
                  - "Write 9 as 9.00 and keep dividing after the remainder."
                  - "9 ÷ 4 = 2 r 1. 10 tenths ÷ 4 = 2 r 2. 20 hundredths ÷ 4 = 5."
                  - "9 ÷ 4 = 2.25."
              - id: l3-f4
                type: multiple_choice
                text: "Which multiplication checks 4.8 ÷ 6 = 0.8?"
                options: ["0.8 × 6 = 4.8", "4.8 × 6 = 28.8", "0.8 × 4.8 = 3.84"]
                answer: "0.8 × 6 = 4.8"
                hints:
                  - "Multiplication undoes division."
                  - "Multiply the answer by the number you divided by."
                  - "0.8 × 6 should give 4.8 again."
              - id: l3-f5
                type: text_input
                keyboard: decimal
                text: "Four friends share £9.80 equally. How much does each friend get, in £?"
                answer: "2.45"
                hints:
                  - "Work out 9.80 ÷ 4."
                  - "9 ÷ 4 = 2 r 1. The 1 and the 8 tenths make 18 tenths: 18 ÷ 4 = 4 r 2."
                  - "2 tenths are 20 hundredths, and 20 ÷ 4 = 5, so £2.45."

          - support: some
            tasks:
              - id: l3-s1
                type: text_input
