            answer: "6451"
          - id: l2-c6
            part: choose
            type: multiple_choice
            text: "76,548 + 15,867. Which method suits best?"
            say: "Seventy-six thousand five hundred and forty-eight add fifteen thousand eight hundred and sixty-seven. Which method suits best?"
            options: ["mentally", "informal steps", "column method"]
            answer: "column method"
            keep_order: true
          - id: l2-c7
            part: choose
