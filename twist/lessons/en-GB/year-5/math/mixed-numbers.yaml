# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.mixed-numbers
skill: math.fractions.mixed-numbers
curriculum: en-GB
language: en
title:
  de: Gemischte Zahlen und unechte Brüche
  en: Mixed numbers and improper fractions
summary: >
  Improper fractions (the numerator bigger than the denominator) and mixed
  numbers (a whole number and a fraction) for the same amount: 7/5 = 1 2/5.
  Lesson 1 sees wholes as rows of a fraction picture and turns improper
  fractions into mixed numbers by dividing; lesson 2 goes the other way by
  multiplying the wholes by the denominator, compares the two forms in
  recipes and races, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Brüche, en: Fractions }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.fractions.equivalent-families]
  also_practises: [math.fractions.equivalent-families]
  vocabulary: { en: [fraction, numerator, denominator, improper fraction, mixed number, whole, fifths, quarters, thirds, convert] }
  forms: [drawn, text, audio]
  drawn: [fraction]
  facets: []
  parts:
    - { id: to-mixed, what: { de: unechte Brüche in gemischte Zahlen umwandeln, en: converting improper fractions to mixed numbers } }
    - { id: to-improper, what: { de: gemischte Zahlen in unechte Brüche umwandeln, en: converting mixed numbers to improper fractions } }
    - { id: pictures, what: { de: Ganze und Teile in einem Bruchbild ablesen, en: reading wholes and parts in a fraction picture } }
    - { id: compare, what: { de: gemischte Zahlen und unechte Brüche vergleichen, en: comparing mixed numbers and improper fractions } }
  misconceptions:
    - id: whole-as-all-parts
      what: Counts all the parts of several wholes as one whole (5 shaded of 8 quarters read as 5/8, not 1 1/4)
      addressed: lesson 1 Learn shows one whole per row; l1-f1 has feedback, l1-s1, l1-c3 and l2-c3 read the rows
    - id: remainder-place
      what: Swaps the whole number and the remainder when dividing (13/4 written as 1 3/4)
      addressed: lesson 1 Learn divides 13 by 4; l1-f2, l1-f3 and l2-c1 offer the swap
    - id: multiplies-numerator
      what: Multiplies the whole number by the numerator instead of the denominator (2 3/4 = 9/4)
      addressed: lesson 2 Learn multiplies by the denominator; l2-f1 has feedback, l2-f2 sets out the steps, l2-s1 and l2-s3 offer wrong products
    - id: bigger-numbers-bigger
      what: Compares an improper fraction and a mixed number by the size of the digits
      addressed: lesson 2 Learn converts before comparing; l2-f4, l2-s5, l2-n5 and l2-c5 compare them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Vom unechten Bruch zur gemischten Zahl, en: Improper fractions to mixed numbers }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which fraction is equivalent to 1/2?"
            say: "Which fraction is equivalent to one half?"
            options: ["3/6", "2/3", "1/4"]
            answer: "3/6"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "2/5 = _/10"
            say: "Two fifths is how many tenths?"
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "7/5\nThe numerator is bigger than the denominator: an improper fraction."
            say: "Each row is one whole, cut into fifths. Seven fifths are shaded. Seven is bigger than five, so seven fifths is more than one whole. A fraction like this is called an improper fraction."
            show: { drawn: fraction, kind: rect, rows: 2, parts: 10, shaded: 7 }
          - text: "5/5 = 1\n7/5 = 5/5 + 2/5 = 1 2/5"
            say: "Five fifths make one whole row. Seven fifths are one whole and two more fifths: one and two fifths. A whole number with a fraction is called a mixed number."
            show: { drawn: fraction, kind: rect, rows: 2, parts: 10, shaded: 7 }
          - text: "13/4: 13 ÷ 4 = 3 r 1\n13/4 = 3 1/4"
            say: "To change an improper fraction into a mixed number, divide the numerator by the denominator. Thirteen divided by four is three, remainder one. That is three wholes and one quarter left over: three and one quarter."
            show: { drawn: fraction, kind: rect, rows: 4, parts: 16, shaded: 13 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Each row is one whole. How much is shaded?"
                show: { drawn: fraction, kind: rect, rows: 2, parts: 8, shaded: 5 }
                options: ["1 1/4", "5/8", "1 1/5"]
                answer: "1 1/4"
                option_audio: false
                feedback:
                  "5/8": "Each row is a whole, cut into quarters. 5 quarters are shaded: 1 whole and 1 quarter."
                hints:
                  - "How many parts are in one row?"
                  - "Each row has 4 quarters. One row is full, and 1 quarter of the next."
                  - "1 whole and 1 quarter: 1 1/4."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Write 7/5 as a mixed number."
                say: "Write seven fifths as a mixed number."
                options: ["1 2/5", "2 1/5", "7 1/5"]
                answer: "1 2/5"
                option_audio: false
                hints:
                  - "How many fifths make one whole?"
                  - "5 fifths make 1 whole. 7 − 5 = 2 fifths are left."
                  - "1 whole and 2 fifths: 1 2/5."
              - id: l1-f3
                type: fill_in_blank
                text: "Write 13/4 as a mixed number."
                say: "Write thirteen quarters as a mixed number."
                frame: "13 ÷ 4 = _ r _, so 13/4 = _"
                options: ["1", "3", "4", "3 1/4", "1 3/4"]
                answer: ["3", "1", "3 1/4"]
                hints:
                  - "Divide the numerator by the denominator."
                  - "13 ÷ 4 = 3 r 1. The 3 is the wholes, the 1 is the quarters left over."
                  - "3 wholes and 1 quarter: 3 1/4."
              - id: l1-f4
                type: multiple_choice
                text: "Which is an improper fraction?"
                options: ["9/7", "7/9", "1 2/7"]
                answer: "9/7"
                option_audio: false
                hints:
                  - "In an improper fraction, the numerator is bigger than the denominator."
                  - "The numerator is the top number."
                  - "In 9/7 the top number is bigger."
              - id: l1-f5
                type: multiple_choice
                text: "Write 11/3 as a mixed number."
                say: "Write eleven thirds as a mixed number."
                options: ["3 2/3", "2 3/3", "3 1/3"]
                answer: "3 2/3"
                option_audio: false
                hints:
                  - "Divide 11 by 3."
                  - "11 ÷ 3 = 3 r 2."
                  - "3 wholes and 2 thirds: 3 2/3."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Each row is one whole. How much is shaded?"
                show: { drawn: fraction, kind: rect, rows: 2, parts: 6, shaded: 4 }
                options: ["1 1/3", "4/6", "1 1/4"]
                answer: "1 1/3"
                option_audio: false
                hints: ["Each row has 3 thirds."]
              - id: l1-s2
                type: multiple_choice
                text: "Write 9/2 as a mixed number."
                say: "Write nine halves as a mixed number."
                options: ["4 1/2", "9 1/2", "3 1/2"]
                answer: "4 1/2"
                option_audio: false
                hints: ["9 ÷ 2 = 4 r 1."]
              - id: l1-s3
                type: text_input
                text: "17/5 = 3 _/5"
                say: "Seventeen fifths is three and how many fifths?"
                answer: "2"
                hints: ["3 wholes are 15 fifths."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 10/10 = 1"
                say: "Is it true? Ten tenths make one whole."
                answer: true
                hints: ["How many tenths make a whole?"]
              - id: l1-s5
                type: multiple_choice
                text: "Write 15/6 as a mixed number."
                say: "Write fifteen sixths as a mixed number."
                options: ["2 3/6", "2 1/6", "3 2/6"]
                answer: "2 3/6"
                option_audio: false
                hints: ["15 ÷ 6 = 2 r 3."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Write 8/3 as a mixed number."
                say: "Write eight thirds as a mixed number."
                options: ["2 2/3", "2 1/3", "3 2/3"]
                answer: "2 2/3"
                option_audio: false
              - id: l1-n2
                type: text_input
                text: "Write 23/5 as a mixed number."
                say: "Write twenty-three fifths as a mixed number."
                keyboard: fraction
                answer: "4 3/5"
              - id: l1-n3
                type: multiple_choice
                text: "Which improper fraction is equal to 2 wholes?"
                options: ["10/5", "5/10", "2/5"]
                answer: "10/5"
                option_audio: false
              - id: l1-n4
                type: text_input
                text: "19/4 = _ 3/4"
                say: "Nineteen quarters is how many wholes and three quarters?"
                answer: "4"
              - id: l1-n5
                type: true_false
                text: "Is it true? 11/5 = 1 1/5"
                say: "Is it true? Eleven fifths is one and one fifth."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Write 9/5 as a mixed number."
            say: "Write nine fifths as a mixed number."
            options: ["1 4/5", "4 1/5", "1 5/9"]
            answer: "1 4/5"
            option_audio: false
          - id: l1-c2
            type: text_input
            text: "14/3 = 4 _/3"
            say: "Fourteen thirds is four and how many thirds?"
            answer: "2"
          - id: l1-c3
            type: multiple_choice
            text: "Each row is one whole. How much is shaded?"
            show: { drawn: fraction, kind: rect, rows: 3, parts: 9, shaded: 7 }
            options: ["2 1/3", "7/9", "2 1/9"]
            answer: "2 1/3"
            option_audio: false
          - id: l1-c4
            type: text_input
            text: "Write 17/4 as a mixed number."
            say: "Write seventeen quarters as a mixed number."
            keyboard: fraction
            answer: "4 1/4"
          - id: l1-c5
            type: true_false
            text: "Is it true? 12/5 = 2 2/5"
            say: "Is it true? Twelve fifths is two and two fifths."
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Each row is one whole. How much is shaded?"
            show: { drawn: fraction, kind: rect, rows: 2, parts: 8, shaded: 7 }
            options: ["1 3/4", "7/8", "1 3/7"]
            answer: "1 3/4"
            option_audio: false

  - n: 2
    title: { de: Von der gemischten Zahl zum unechten Bruch, en: Mixed numbers to improper fractions }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Write 11/4 as a mixed number."
            say: "Write eleven quarters as a mixed number."
            options: ["2 3/4", "3 1/4", "2 1/4"]
            answer: "2 3/4"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "7/2 = 3 _/2"
            say: "Seven halves is three and how many halves?"
            answer: "1"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2 3/4\n2 wholes = 8 quarters\n8 quarters + 3 quarters = 11/4"
            say: "Now go the other way. Two and three quarters: each whole is four quarters, so two wholes are eight quarters. Add the three quarters: eleven quarters."
            show: { drawn: fraction, kind: rect, rows: 3, parts: 12, shaded: 11 }
          - text: "3 2/5\n3 × 5 = 15 fifths\n15 + 2 = 17\n3 2/5 = 17/5"
            say: "The quick way: multiply the whole number by the denominator, then add the numerator. Three times five is fifteen fifths. Add two: seventeen fifths. The denominator stays the same."
          - text: "2 1/3 or 8/3?\n8/3 = 2 2/3, and 2 2/3 > 2 1/3"
            say: "To compare a mixed number and an improper fraction, write them the same way. Eight thirds is two and two thirds. That is more than two and one third."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Write 2 3/4 as an improper fraction."
                say: "Write two and three quarters as an improper fraction."
                options: ["11/4", "9/4", "23/4"]
                answer: "11/4"
                option_audio: false
                feedback:
                  "9/4": "Multiply the whole number by the denominator, not the numerator: 2 × 4 = 8 quarters, then add 3."
                hints:
                  - "How many quarters are in 2 wholes?"
                  - "2 × 4 = 8 quarters. Then add the 3 quarters."
                  - "8 + 3 = 11, so 11/4."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Write 3 2/5 as an improper fraction."
                say: "Write three and two fifths as an improper fraction."
                frame: "3 × 5 = _, _ + 2 = _, so 3 2/5 = _/5"
                options: ["6", "10", "15", "17"]
                answer: ["15", "15", "17", "17"]
                hints:
                  - "Multiply the whole number by the denominator."
                  - "3 × 5 = 15 fifths. Add the 2 fifths."
                  - "15 + 2 = 17, so 17/5."
              - id: l2-f3
                type: multiple_choice
                text: "How many thirds are in 4 wholes?"
                options: ["12", "7", "4"]
                answer: "12"
                hints:
                  - "How many thirds are in 1 whole?"
                  - "1 whole is 3 thirds, so 4 wholes are 4 lots of 3 thirds."
                  - "4 × 3 = 12 thirds."
              - id: l2-f4
                type: multiple_choice
                text: "Which is bigger, 2 1/3 or 8/3?"
                say: "Which is bigger, two and one third, or eight thirds?"
                options: ["2 1/3", "8/3", "They are equal."]
                answer: "8/3"
                keep_order: true
                option_audio: false
                hints:
                  - "Write 8/3 as a mixed number."
                  - "8 ÷ 3 = 2 r 2, so 8/3 = 2 2/3."
                  - "2 2/3 is more than 2 1/3, so 8/3 is bigger."
              - id: l2-f5
                type: text_input
                text: "1 5/6 = _/6"
                say: "One and five sixths is how many sixths?"
                answer: "11"
                hints:
                  - "1 whole is 6 sixths."
                  - "6 sixths and 5 sixths."
                  - "6 + 5 = 11, so 11/6."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Write 1 3/8 as an improper fraction."
                say: "Write one and three eighths as an improper fraction."
                options: ["11/8", "4/8", "13/8"]
                answer: "11/8"
                option_audio: false
                hints: ["1 whole is 8 eighths."]
              - id: l2-s2
                type: text_input
                text: "4 1/2 = _/2"
                say: "Four and a half is how many halves?"
                answer: "9"
                hints: ["4 × 2 = 8 halves."]
              - id: l2-s3
                type: multiple_choice
                text: "Which improper fraction is equal to 3 3/4?"
                say: "Which improper fraction is equal to three and three quarters?"
                options: ["15/4", "12/4", "33/4"]
                answer: "15/4"
                option_audio: false
                hints: ["3 × 4 = 12 quarters, then add 3 more."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 2 2/5 = 12/5"
                say: "Is it true? Two and two fifths is twelve fifths."
                answer: true
                hints: ["2 × 5 = 10 fifths."]
              - id: l2-s5
                type: multiple_choice
                text: "Which is the smallest: 7/4, 1 1/2 or 2?"
                say: "Which is the smallest: seven quarters, one and a half, or two?"
                options: ["7/4", "1 1/2", "2"]
                answer: "1 1/2"
                option_audio: false
                hints: ["7/4 = 1 3/4."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "Mia eats 2 1/4 pizzas. Each pizza is cut into quarters. How many quarters does she eat?"
                say: "Mia eats two and a quarter pizzas. Each pizza is cut into quarters. How many quarters does she eat?"
                answer: "9"
              - id: l2-n2
                type: multiple_choice
                text: "A recipe uses 7/2 cups of flour. How many cups is that as a mixed number?"
                say: "A recipe uses seven halves of a cup of flour. How many cups is that as a mixed number?"
                options: ["3 1/2", "2 1/2", "7 1/2"]
                answer: "3 1/2"
                option_audio: false
              - id: l2-n3
                type: text_input
                text: "Ben runs 3 laps and 3/5 of a lap. How many fifths of a lap does he run?"
                say: "Ben runs three laps and three fifths of a lap. How many fifths of a lap does he run?"
                answer: "18"
              - id: l2-n4
                type: multiple_choice
                text: "Each jar holds 1/3 of a litre. Zara fills 10 jars. How many litres is that?"
                say: "Each jar holds one third of a litre. Zara fills ten jars. How many litres is that?"
                options: ["3 1/3 litres", "10 litres", "3 1/10 litres"]
                answer: "3 1/3 litres"
                option_audio: false
              - id: l2-n5
                type: multiple_choice
                text: "Which ribbon is longer: one 13/4 m long or one 3 1/2 m long?"
                say: "Which ribbon is longer: one thirteen quarters of a metre long, or one three and a half metres long?"
                options: ["13/4 m", "3 1/2 m", "They are the same length."]
                answer: "3 1/2 m"
                keep_order: true
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: to-mixed
            type: multiple_choice
            text: "Write 13/5 as a mixed number."
            say: "Write thirteen fifths as a mixed number."
            options: ["2 3/5", "3 2/5", "2 1/5"]
            answer: "2 3/5"
            option_audio: false
          - id: l2-c2
            part: to-improper
            type: text_input
            text: "Write 2 5/6 as an improper fraction."
            say: "Write two and five sixths as an improper fraction."
            keyboard: fraction
            answer: "17/6"
          - id: l2-c3
            part: pictures
            type: multiple_choice
            text: "Each row is one whole. How much is shaded?"
            show: { drawn: fraction, kind: rect, rows: 2, parts: 10, shaded: 9 }
            options: ["1 4/5", "9/10", "1 4/10"]
            answer: "1 4/5"
            option_audio: false
          - id: l2-c4
            part: to-mixed
            type: text_input
            text: "Write 29/8 as a mixed number."
            say: "Write twenty-nine eighths as a mixed number."
            keyboard: fraction
            answer: "3 5/8"
          - id: l2-c5
            part: compare
            type: multiple_choice
            text: "Which is bigger, 9/4 or 2 1/2?"
            say: "Which is bigger, nine quarters, or two and a half?"
            options: ["9/4", "2 1/2", "They are equal."]
            answer: "2 1/2"
            keep_order: true
            option_audio: false
          - id: l2-c6
            part: to-mixed
            type: fill_in_blank
            text: "Write 22/5 as a mixed number."
            say: "Write twenty-two fifths as a mixed number."
            frame: "22/5 = _ _/5"
            options: ["2", "4", "5"]
            answer: ["4", "2"]
          - id: l2-c7
            part: to-mixed
            type: multiple_choice
            text: "Write 17/3 as a mixed number."
            say: "Write seventeen thirds as a mixed number."
            options: ["5 2/3", "2 2/3", "5 1/3"]
            answer: "5 2/3"
            option_audio: false
          - id: l2-c8
            part: to-mixed
            type: true_false
            text: "Is it true? 19/6 = 3 1/6"
            say: "Is it true? Nineteen sixths is three and one sixth."
            answer: true
          - id: l2-c9
            part: to-improper
            type: text_input
            text: "Write 5 1/4 as an improper fraction."
            say: "Write five and one quarter as an improper fraction."
            keyboard: fraction
            answer: "21/4"
          - id: l2-c10
            part: to-improper
            type: multiple_choice
            text: "Write 2 4/7 as an improper fraction."
            say: "Write two and four sevenths as an improper fraction."
            options: ["18/7", "12/7", "24/7"]
            answer: "18/7"
            option_audio: false
          - id: l2-c11
            part: to-improper
            type: text_input
            text: "Sacha has 5 1/3 bars of chocolate. Each bar is cut into thirds. How many thirds does she have?"
            say: "Sacha has five and one third bars of chocolate. Each bar is cut into thirds. How many thirds does she have?"
            answer: "16"
          - id: l2-c12
            part: to-improper
            type: true_false
            text: "Is it true? 2 3/8 = 9/8"
            say: "Is it true? Two and three eighths is nine eighths."
            answer: false
          - id: l2-c13
            part: pictures
            type: multiple_choice
            text: "Each row is one whole. How much is shaded?"
            show: { drawn: fraction, kind: rect, rows: 3, parts: 12, shaded: 9 }
            options: ["2 1/4", "9/12", "2 1/12"]
            answer: "2 1/4"
            option_audio: false
          - id: l2-c14
            part: pictures
            type: text_input
            text: "Each row is one whole. How much is shaded? Write it as an improper fraction."
            show: { drawn: fraction, kind: rect, rows: 2, parts: 6, shaded: 5 }
            keyboard: fraction
            answer: "5/3"
          - id: l2-c15
            part: pictures
            type: multiple_choice
            text: "Each row is one whole. How much is shaded?"
            show: { drawn: fraction, kind: rect, rows: 3, parts: 15, shaded: 12 }
            options: ["2 2/5", "12/15", "2 2/15"]
            answer: "2 2/5"
            option_audio: false
          - id: l2-c16
            part: pictures
            type: true_false
            text: "Each row is one whole. Is it true? 8/12 is shaded."
            say: "Each row is one whole. Is it true? Eight twelfths is shaded."
            show: { drawn: fraction, kind: rect, rows: 2, parts: 12, shaded: 8 }
            answer: false
          - id: l2-c17
            part: compare
            type: multiple_choice
            text: "Which is bigger, 11/5 or 2 3/5?"
            say: "Which is bigger, eleven fifths, or two and three fifths?"
            options: ["11/5", "2 3/5", "They are equal."]
            answer: "2 3/5"
            keep_order: true
            option_audio: false
          - id: l2-c18
            part: compare
            type: true_false
            text: "Is it true? 1 3/4 > 9/4"
            say: "Is it true? One and three quarters is greater than nine quarters."
            answer: false
          - id: l2-c19
            part: compare
            type: multiple_choice
            text: "Which is the biggest: 5/2, 2 1/4 or 9/5?"
            say: "Which is the biggest: five halves, two and a quarter, or nine fifths?"
            options: ["5/2", "2 1/4", "9/5"]
            answer: "5/2"
            option_audio: false
          - id: l2-c20
            part: compare
            type: multiple_choice
            text: "Leo walks 9/4 km. Ella walks 2 1/4 km. Who walks further?"
            say: "Leo walks nine quarters of a kilometre. Ella walks two and a quarter kilometres. Who walks further?"
            options: ["Leo", "Ella", "They walk the same distance."]
            answer: "They walk the same distance."
            keep_order: true
