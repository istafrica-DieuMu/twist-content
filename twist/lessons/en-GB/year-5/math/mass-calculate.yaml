# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.mass-calculate
skill: math.mass-capacity.calculate-mass
curriculum: en-GB
language: en
title:
  de: Mit Gewichten rechnen
  en: Calculating with mass
summary: >
  Lesson 1 writes masses in different ways with the decimal point (1.5 kg
  = 1 kg 500 g = 1500 g, 2.05 kg = 2050 g), knowing that the three places
  after the point are hundreds, tens and ones of grams, and compares and
  orders masses in mixed units; lesson 2 adds, subtracts and multiplies
  masses in baking, shopping, parcel and suitcase problems, always in one
  unit first, checks with an estimate and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Gewichte, en: Mass }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mass-capacity.estimate-mass, math.length.notation]
  also_practises: [math.mass-capacity.g-kg, math.length.notation]
  vocabulary: { en: [gram, kilogram, mass, decimal point, convert, heavier, lighter, at most, kitchen scale] }
  forms: [text, audio, picture]
  drawn: []
  facets: [number-format, units]
  parts:
    - { id: write, what: { de: Gewichte auf verschiedene Arten schreiben, en: writing a mass in different ways } }
    - { id: compare, what: { de: Gewichte in verschiedenen Einheiten vergleichen und ordnen, en: comparing and ordering masses in mixed units } }
    - { id: add-subtract, what: { de: Gewichte in Sachaufgaben addieren und subtrahieren, en: adding and subtracting masses in problems } }
    - { id: multiply-steps, what: { de: Gewichte vervielfachen und in Schritten rechnen, en: multiplying masses and solving problems in steps } }
  misconceptions:
    - id: point-digits-as-grams
      what: Reads the digits after the decimal point as grams as they stand (2.5 kg = 2005 g, 0.8 kg = 80 g)
      addressed: lesson 1 Learn says the first place after the point is hundreds of grams; l1-f1 (with feedback), l1-s3, l1-n1, l1-c1 and l2-c1 offer the misread mass
    - id: compares-digits
      what: Compares the numbers without the units, so 1250 g looks heavier than 1.3 kg
      addressed: lesson 1 Learn changes both masses to grams; l1-f5 (with feedback), l1-s4, l1-n5 and l1-c3 compare mixed units
    - id: mixed-units-added
      what: Adds kg and g as they stand (1.5 kg + 750 g = 751.5 g) or turns 750 g into 0.075 kg
      addressed: lesson 2 Learn changes everything to grams first; l2-f1 (with feedback), l2-s4, l2-n1 and l2-c3 offer the unconverted sum
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gewichte mit Komma", en: "Masses with a decimal point" }
    goal:
      de: "Schreib Gewichte auf verschiedene Arten und vergleiche sie, so wie 1,5 Kilogramm gleich 1500 Gramm."
      en: "Write masses in different ways and compare them, like 1.5 kilograms is 1500 grams."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Which weighs about 1 kg?"
            options:
              - { object: bag-of-sugar }
              - { object: apple }
              - { object: bike }
            answer: bag-of-sugar
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "1 kg = _ g"
            say: "How many grams are in one kilogram?"
            options: ["1000", "100", "10"]
            answer: "1000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1.5 kg = 1 kg 500 g = 1500 g"
            say: "You can write a mass with a decimal point. One kilogram is one thousand grams, so half a kilogram is five hundred grams. One point five kilograms is one kilogram and five hundred grams, which is one thousand five hundred grams."
          - text: "kg . hundreds of g | tens of g | ones of g\n0.25 kg = 250 g\n2.05 kg = 2050 g"
            say: "There are three places after the point, one for the hundreds, tens and ones of grams. Zero point two five kilograms is two hundred and fifty grams. Watch the zeros: two point zero five kilograms is two kilograms and fifty grams, so two thousand and fifty grams."
          - text: "1750 g = 1.75 kg\n1300 g is more than 1250 g, so 1.3 kg is more than 1250 g"
            say: "To go from grams to kilograms, divide by one thousand. To compare masses, put them in the same unit first. One point three kilograms is one thousand three hundred grams, so it is heavier than one thousand two hundred and fifty grams, even though one point three looks smaller."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "2.5 kg = _"
                options: ["2500 g", "2005 g", "250 g"]
                answer: "2500 g"
                feedback:
                  "2005 g": "The 5 is straight after the point, so it stands for 5 hundred grams, not 5 grams."
                hints:
                  - "The first place after the point is hundreds of grams."
                  - "2.5 kg = 2 kg 500 g."
                  - "2500 g."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Write 1 kg 750 g in kilograms."
                frame: "1 kg 750 g = _ kg"
                options: ["1.75", "1.075", "17.5"]
                answer: ["1.75"]
                hints:
                  - "The whole kilograms go before the point."
                  - "750 g is 0.750 kg. You can leave off the last zero."
                  - "1.75 kg."
              - id: l1-f3
                type: multiple_choice
                text: "0.4 kg = _"
                options: ["400 g", "4 g", "40 g"]
                answer: "400 g"
                hints:
                  - "There are no whole kilograms."
                  - "The 4 is in the first place after the point: 4 hundred grams."
                  - "400 g."
              - id: l1-f4
                type: matching
                text: "Match the masses that are the same."
                pairs:
                  - { left: { text: "4.6 kg" }, right: { text: "4600 g" } }
                  - { left: { text: "4.06 kg" }, right: { text: "4060 g" } }
                  - { left: { text: "4.006 kg" }, right: { text: "4006 g" } }
                hints:
                  - "Look at the place of the 6 after the point."
                  - "In 4.6 the 6 is hundreds of grams, in 4.06 tens of grams, in 4.006 ones."
                  - "4.6 kg = 4600 g, 4.06 kg = 4060 g, 4.006 kg = 4006 g."
              - id: l1-f5
                type: multiple_choice
                text: "Which is heavier: 1.3 kg or 1250 g?"
                options: ["1.3 kg", "1250 g", "They are the same."]
                answer: "1.3 kg"
                keep_order: true
                feedback:
                  "1250 g": "1250 is a bigger number than 1.3, but the units are different. Change 1.3 kg into grams."
                hints:
                  - "Put both masses in grams."
                  - "1.3 kg = 1300 g."
                  - "1300 g is more than 1250 g, so 1.3 kg is heavier."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "3.75 kg = _"
                options: ["3750 g", "3075 g", "375 g"]
                answer: "3750 g"
                hints: ["3 whole kilograms and 0.75 kg. How many grams is 0.75 kg?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Write 2400 g in kilograms."
                frame: "2400 g = _ kg"
                options: ["2.4", "24", "0.24"]
                answer: ["2.4"]
                hints: ["Divide by 1000: 2000 g is 2 kg."]
              - id: l1-s3
                type: true_false
                text: "Is it true? 0.8 kg = 80 g"
                answer: false
                hints: ["0.8 kg is 8 tenths of a kilogram. One tenth of a kilogram is 100 g."]
              - id: l1-s4
                type: ordering
                text: "Put the masses in order, lightest first."
                options: ["1.2 kg", "900 g", "1050 g", "0.95 kg"]
                slot_count: 4
                answer: ["900 g", "0.95 kg", "1050 g", "1.2 kg"]
                hints: ["Change them all into grams: 1200 g, 900 g, 1050 g, 950 g."]
              - id: l1-s5
                type: text_input
                text: "1.08 kg = _ g"
                answer: "1080"
                hints: ["The 0 after the point means no hundreds of grams. Then 8 tens of grams."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "4.4 kg = _"
                options: ["4400 g", "4004 g", "440 g"]
                answer: "4400 g"
              - id: l1-n2
                type: text_input
                text: "6.25 kg = _ g"
                answer: "6250"
              - id: l1-n3
                type: fill_in_blank
                text: "Write 3500 g in kilograms."
                frame: "3500 g = _ kg"
                options: ["3.5", "35", "3.05"]
                answer: ["3.5"]
              - id: l1-n4
                type: true_false
                text: "Is it true? 2.09 kg = 2090 g"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which is the lightest?"
                options: ["0.6 kg", "550 g", "0.65 kg"]
                answer: "550 g"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "1.9 kg = _"
            options: ["1900 g", "1009 g", "190 g"]
            answer: "1900 g"
          - id: l1-c2
            type: text_input
            text: "0.35 kg = _ g"
            answer: "350"
          - id: l1-c3
            type: true_false
            text: "Is it true? 1.5 kg is heavier than 1450 g."
            answer: true
          - id: l1-c4
            type: text_input
            text: "2.6 kg = _ g"
            answer: "2600"
          - id: l1-c5
            type: fill_in_blank
            text: "Write 1050 g in kilograms."
            frame: "1050 g = _ kg"
            options: ["1.05", "1.5", "10.5"]
            answer: ["1.05"]
          - id: l1-c6
            type: multiple_choice
            text: "Which is lighter: 0.5 kg or 450 g?"
            options: ["0.5 kg", "450 g", "They are the same."]
            answer: "450 g"
            keep_order: true

  - n: 2
    title: { de: "Sachaufgaben mit Gewichten", en: "Mass problems" }
    goal:
      de: "Löse Aufgaben mit Gewichten beim Backen, Einkaufen und Paketepacken, und rechne immer erst in einer Einheit."
      en: "Solve mass problems about baking, shopping and parcels, changing everything into one unit first."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "1.25 kg = _"
            options: ["1250 g", "1025 g", "125 g"]
            answer: "1250 g"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is heavier: 2.1 kg or 1990 g?"
            options: ["2.1 kg", "1990 g", "They are the same."]
            answer: "2.1 kg"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Baking: 1.2 kg of flour and 450 g of sugar.\n1200 g + 450 g = 1650 g = 1.65 kg"
            say: "Ruby weighs out one point two kilograms of flour and four hundred and fifty grams of sugar. How much is that altogether? First change the kilograms into grams. One thousand two hundred add four hundred and fifty is one thousand six hundred and fifty grams, or one point six five kilograms."
          - text: "A parcel can weigh at most 2 kg. It holds 3 books of 480 g.\n3 × 480 g = 1440 g\n2000 g − 1440 g = 560 g"
            say: "A parcel can weigh at most two kilograms. It already holds three books of four hundred and eighty grams each. Step one: the books weigh one thousand four hundred and forty grams. Step two: two thousand take away one thousand four hundred and forty leaves five hundred and sixty grams. That much more can go in."
          - text: "Check: 3 books of about 500 g are about 1500 g.\n1440 g makes sense."
            say: "Check with an estimate. Each book is close to five hundred grams, so three books are about one and a half kilograms. One thousand four hundred and forty grams fits."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Mum buys 1.5 kg of potatoes and 750 g of carrots. How heavy is the shopping altogether?"
                options: ["2.25 kg", "751.5 g", "1.575 kg"]
                answer: "2.25 kg"
                feedback:
                  "751.5 g": "You added 1.5 and 750 as they stand. Change 1.5 kg into 1500 g first."
                  "1.575 kg": "750 g is 0.75 kg, not 0.075 kg."
                hints:
                  - "Put both masses in grams."
                  - "1500 g + 750 g."
                  - "2250 g = 2.25 kg."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "A bag of flour holds 1.5 kg. Ava uses 375 g for a cake. How much flour is left?"
                options: ["1125 g", "1875 g", "1225 g"]
                answer: "1125 g"
                feedback:
                  "1875 g": "Ava uses some flour, so there is less left. Subtract."
                hints:
                  - "Change 1.5 kg into grams."
                  - "1500 g − 375 g."
                  - "1125 g."
              - id: l2-f3
                type: multiple_choice
                text: "A crate holds 6 melons of 1.2 kg each. The empty crate weighs 800 g. How heavy is the full crate?"
                options: ["8 kg", "7.2 kg", "7.28 kg"]
                answer: "8 kg"
                feedback:
                  "7.2 kg": "That is just the melons. Add the crate too."
                hints:
                  - "First the melons, then the crate."
                  - "6 × 1.2 kg = 7.2 kg. 800 g is 0.8 kg."
                  - "7.2 kg + 0.8 kg = 8 kg."
              - id: l2-f4
                type: true_false
                text: "A suitcase can weigh at most 20 kg. It weighs 18.4 kg. Jacob adds trainers weighing 900 g. Is the suitcase still under 20 kg?"
                show: { object: suitcase }
                answer: true
                hints:
                  - "900 g is 0.9 kg."
                  - "18.4 kg + 0.9 kg = 19.3 kg."
                  - "Yes. 19.3 kg is under 20 kg."
              - id: l2-f5
                type: fill_in_blank
                text: "Pasta for 4 people needs 300 g. How much pasta do 12 people need?"
                frame: "_ g = _ kg"
                options: ["900", "0.9", "1200", "9"]
                answer: ["900", "0.9"]
                hints:
                  - "12 people is 3 times as many as 4 people."
                  - "3 × 300 g = 900 g."
                  - "900 g = 0.9 kg."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A kitten weighs 850 g. A puppy weighs 2.3 kg. How much heavier is the puppy?"
                options: ["1450 g", "1550 g", "3150 g"]
                answer: "1450 g"
                hints: ["2300 g − 850 g."]
              - id: l2-s2
                type: multiple_choice
                text: "A box holds 8 tins of beans. Each tin weighs 415 g. How heavy are the tins?"
                options: ["3.32 kg", "3.2 kg", "33.2 kg"]
                answer: "3.32 kg"
                hints: ["8 × 400 g = 3200 g and 8 × 15 g = 120 g."]
              - id: l2-s3
                type: true_false
                text: "Lucas weighs 34.5 kg and his dog weighs 12.8 kg. Lucas says: together we weigh 47.3 kg. Is he right?"
                answer: true
                hints: ["34 + 12 = 46, then 0.5 + 0.8 = 1.3."]
              - id: l2-s4
                type: multiple_choice
                text: "Grandad buys 2 kg of apples and 600 g of grapes. How heavy is that altogether?"
                options: ["2.6 kg", "602 g", "2.06 kg"]
                answer: "2.6 kg"
                hints: ["2000 g + 600 g."]
              - id: l2-s5
                type: text_input
                text: "A lift can carry at most 600 kg. 7 people of 80 kg each get in. How many more kilograms could it carry?"
                answer: "40"
                hints: ["7 × 80 kg = 560 kg."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Priya buys 1.8 kg of pears and 450 g of plums. How heavy is that altogether?"
                options: ["2.25 kg", "451.8 g", "1.845 kg"]
                answer: "2.25 kg"
              - id: l2-n2
                type: text_input
                text: "A 2 kg cheese is cut into 8 equal pieces. How many grams is each piece?"
                answer: "250"
              - id: l2-n3
                type: multiple_choice
                text: "A parcel can weigh at most 5 kg. It weighs 3.65 kg. How much more can go in?"
                options: ["1.35 kg", "2.35 kg", "1.45 kg"]
                answer: "1.35 kg"
              - id: l2-n4
                type: true_false
                text: "Tom puts 3 bags of 250 g on the kitchen scale. Does the scale show 1 kg?"
                show: { object: kitchen-scale }
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "A baker uses 1.25 kg of butter a day. How much does she use in 4 days?"
                options: ["5 kg", "4.25 kg", "500 g"]
                answer: "5 kg"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: write
            type: multiple_choice
            text: "3.7 kg = _"
            options: ["3700 g", "3007 g", "370 g"]
            answer: "3700 g"
          - id: l2-c2
            part: write
            type: fill_in_blank
            text: "Write 2 kg 80 g in kilograms."
            frame: "2 kg 80 g = _ kg"
            options: ["2.08", "2.8", "2.008"]
            answer: ["2.08"]
          - id: l2-c3
            part: add-subtract
            type: multiple_choice
            text: "Ella buys 950 g of rice and 1.4 kg of potatoes. How heavy is that altogether?"
            options: ["2.35 kg", "951.4 g", "1.495 kg"]
            answer: "2.35 kg"
          - id: l2-c4
            part: add-subtract
            type: multiple_choice
            text: "A bag of flour holds 2 kg. Kian uses 650 g. How much is left?"
            options: ["1.35 kg", "1.45 kg", "2.65 kg"]
            answer: "1.35 kg"
          - id: l2-c5
            part: multiply-steps
            type: text_input
            text: "A jar of jam weighs 340 g. How many grams do 5 jars weigh?"
            answer: "1700"
          - id: l2-c6
            part: write
            type: text_input
            text: "5.06 kg = _ g"
            answer: "5060"
          - id: l2-c7
            part: write
            type: fill_in_blank
            text: "Write 4250 g in kilograms."
            frame: "4250 g = _ kg"
            options: ["4.25", "42.5", "4.025"]
            answer: ["4.25"]
          - id: l2-c8
            part: write
            type: true_false
            text: "Is it true? 3 kg 5 g = 3.5 kg"
            answer: false
          - id: l2-c9
            part: compare
            type: multiple_choice
            text: "Which is heavier: 1.6 kg or 1650 g?"
            options: ["1.6 kg", "1650 g", "They are the same."]
            answer: "1650 g"
            keep_order: true
          - id: l2-c10
            part: compare
            type: ordering
            text: "Put the masses in order, heaviest first."
            options: ["2.5 kg", "2050 g", "2.45 kg", "2600 g"]
            slot_count: 4
            answer: ["2600 g", "2.5 kg", "2.45 kg", "2050 g"]
          - id: l2-c11
            part: compare
            type: true_false
            text: "Is it true? 0.75 kg is lighter than 700 g."
            answer: false
          - id: l2-c12
            part: compare
            type: multiple_choice
            text: "Which is the heaviest?"
            options: ["1.09 kg", "1150 g", "1.2 kg"]
            answer: "1.2 kg"
          - id: l2-c13
            part: compare
            type: multiple_choice
            text: "Which two masses are the same?"
            options: ["3.4 kg and 3400 g", "3.4 kg and 3040 g", "3.04 kg and 3400 g"]
            answer: "3.4 kg and 3400 g"
          - id: l2-c14
            part: add-subtract
            type: text_input
            text: "Sam's school bag weighs 3.2 kg. He takes out a book of 650 g. How many grams does the bag weigh now?"
            answer: "2550"
          - id: l2-c15
            part: add-subtract
            type: multiple_choice
            text: "A cake needs 250 g of butter, 300 g of sugar and 0.5 kg of flour. How heavy is that altogether?"
            options: ["1.05 kg", "550.5 g", "1.5 kg"]
            answer: "1.05 kg"
          - id: l2-c16
            part: add-subtract
            type: true_false
            text: "A melon weighs 1.4 kg and a pineapple weighs 900 g. Is the melon 500 g heavier?"
            answer: true
          - id: l2-c17
            part: multiply-steps
            type: multiple_choice
            text: "One apple weighs about 150 g. About how heavy are 6 apples?"
            options: ["900 g", "9 kg", "156 g"]
            answer: "900 g"
          - id: l2-c18
            part: multiply-steps
            type: text_input
            text: "A bag holds 5 tins of soup. Each tin weighs 0.4 kg. How many grams do the tins weigh altogether?"
            answer: "2000"
          - id: l2-c19
            part: multiply-steps
            type: multiple_choice
            text: "A shopping bag can hold at most 5 kg. It holds 3 bottles of 1.2 kg each. How much more can go in?"
            options: ["1.4 kg", "3.8 kg", "2.6 kg"]
            answer: "1.4 kg"
          - id: l2-c20
            part: multiply-steps
            type: true_false
            text: "Max works out 8 × 495 g and gets 396 g. Does that fit an estimate?"
            answer: false
