# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.negative-in-context
skill: math.large-numbers.negative-in-context
curriculum: en-GB
language: en
title:
  de: Negative Zahlen im Alltag
  en: Negative numbers in context
summary: >
  Negative numbers in temperatures, lifts and depths below sea level.
  Lesson 1 compares and orders temperatures below zero and works out a
  new temperature after it rises or falls across zero; lesson 2 finds
  differences across zero by counting up to 0 and on (from −4 °C to 7 °C
  is 11 degrees), uses them in weather, lift and diving problems, and
  ends with the skill check.
metadata:
  year: year-5
  topic: { de: Negative Zahlen, en: Negative numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.negative-numbers]
  also_practises: [math.large-numbers.negative-numbers]
  vocabulary: { en: [negative number, minus, below zero, degrees Celsius, °C, rise, fall, colder, warmer, difference, sea level, floor] }
  forms: [drawn, text, audio]
  drawn: [thermometer, number-line]
  facets: [number-format]
  parts:
    - { id: compare, what: { de: negative Temperaturen ablesen und vergleichen, en: reading and comparing temperatures below zero } }
    - { id: rise-fall, what: { de: die neue Temperatur nach einem Anstieg oder Fall, en: the new temperature after a rise or fall } }
    - { id: difference, what: { de: Unterschiede über die Null hinweg, en: differences across zero } }
    - { id: contexts, what: { de: negative Zahlen bei Stockwerken und unter dem Meeresspiegel, en: negative numbers for floors and depths below sea level } }
  misconceptions:
    - id: bigger-digit-warmer
      what: Thinks −6 °C is warmer than −2 °C because 6 is bigger than 2
      addressed: lesson 1 Learn puts the temperatures on a number line; l1-f1 has feedback, l1-f4, l1-s3, l1-s5, l1-n4 and l2-c3 compare or order them
    - id: wrong-direction
      what: Moves the wrong way across zero when a temperature rises or falls (−3 °C rises by 5 to −8 °C)
      addressed: lesson 1 Learn shows rises as jumps to the right; l1-f2 and l1-f3 offer the wrong direction, l1-s2, l1-n3 and l2-c2 cross zero
    - id: subtracts-digits
      what: Finds the difference across zero by taking one number from the other (−4 °C to 7 °C is 3 degrees)
      addressed: lesson 2 Learn counts to 0 and on; l2-f1 has feedback, l2-f2 splits the count at 0, l2-s5, l2-n2 and l2-c5 offer the subtraction
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Temperaturen unter null, en: Temperatures below zero }
    goal:
      de: "Vergleiche Temperaturen unter null und finde die neue Temperatur, wenn es wärmer oder kälter wird, so wie von minus 3 Grad auf 2 Grad."
      en: "Compare temperatures below zero and find the new temperature when it rises or falls, like minus 3 degrees up to 2 degrees."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Count back in ones: 2, 1, 0, _"
            options: ["−1", "−2", "1"]
            answer: "−1"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What temperature does the thermometer show?"
            show: { drawn: thermometer, from: -10, to: 10, step: 2, value: -4 }
            options: ["−4 °C", "4 °C", "−6 °C"]
            answer: "−4 °C"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "−4 °C is 4 degrees below zero."
            say: "When it is colder than zero degrees, the temperature is a negative number. Minus four degrees is four degrees below zero."
            show: { drawn: thermometer, from: -10, to: 10, step: 2, value: -4 }
          - text: "−5 < −2 < 0 < 3\n−5 °C is colder than −2 °C."
            say: "On a number line, the further left a number is, the smaller it is. Minus five is further below zero than minus two, so minus five degrees is colder, even though five is bigger than two."
            show: { drawn: number-line, from: -6, to: 6, labels: all }
          - text: "−3 °C rises by 5 degrees → 2 °C\n1 °C falls by 4 degrees → −3 °C"
            say: "A rise moves up the thermometer, to the right on a number line. From minus three, go up three degrees to zero, then two more: two degrees. A fall moves down. From one degree, fall one degree to zero and three more: minus three degrees."
            show: { drawn: number-line, from: -6, to: 6, labels: all, jumps: [[-3, 5]] }
          - text: "Lift: floor −1 is one floor below the ground floor (0).\nSea level is 0 m. A diver at −20 m is 20 m below it."
            say: "Negative numbers are not only for temperatures. In a lift, floor zero is the ground floor and floor minus one is one floor below it. Sea level is zero metres, so a diver at minus twenty metres is twenty metres below the surface."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is colder, −6 °C or −2 °C?"
                options: ["−6 °C", "−2 °C"]
                answer: "−6 °C"
                feedback:
                  "−2 °C": "6 is bigger than 2, but −6 is further below zero, so −6 °C is colder."
                hints:
                  - "Which one is further below zero?"
                  - "−6 is 6 degrees below zero. −2 is only 2 degrees below zero."
                  - "−6 °C is colder."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "It is −3 °C. The temperature rises by 5 degrees. What is it now?"
                show: { drawn: number-line, from: -6, to: 6, labels: all, jumps: [[-3, 5]] }
                options: ["2 °C", "−8 °C", "8 °C"]
                answer: "2 °C"
                hints:
                  - "A rise goes to the right on the number line."
                  - "From −3, it is 3 degrees up to 0. That leaves 2 more."
                  - "0 + 2 = 2, so it is 2 °C."
              - id: l1-f3
                type: multiple_choice
                text: "It is 2 °C. The temperature falls by 6 degrees. What is it now?"
                show: { drawn: thermometer, from: -10, to: 10, step: 2, value: 2 }
                options: ["−4 °C", "4 °C", "−8 °C"]
                answer: "−4 °C"
                hints:
                  - "A fall goes down the thermometer."
                  - "From 2 °C, fall 2 degrees to 0. That leaves 4 more to fall."
                  - "4 below zero is −4 °C."
              - id: l1-f4
                type: ordering
                text: "Put the temperatures in order, from coldest to warmest."
                options: ["−1 °C", "−7 °C", "3 °C", "−4 °C"]
                slot_count: 4
                answer: ["−7 °C", "−4 °C", "−1 °C", "3 °C"]
                hints:
                  - "The coldest is the one furthest below zero."
                  - "−7 is furthest below zero. 3 is the only one above zero."
                  - "−7 °C, −4 °C, −1 °C, 3 °C."
              - id: l1-f5
                type: multiple_choice
                text: "A lift is at floor 2. It goes down 4 floors. Which floor is it at now?"
                options: ["−2", "2", "−6"]
                answer: "−2"
                hints:
                  - "The ground floor is floor 0."
                  - "Down 2 floors from floor 2 is floor 0. There are 2 more to go."
                  - "Two floors below the ground floor is floor −2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What temperature does the thermometer show?"
                show: { drawn: thermometer, from: -10, to: 10, step: 2, value: -8 }
                options: ["−8 °C", "8 °C", "−6 °C"]
                answer: "−8 °C"
                hints: ["Is the top of the red line above or below 0 °C?"]
              - id: l1-s2
                type: text_input
                keyboard: decimal
                text: "It is −5 °C. The temperature rises by 7 degrees. What is it now, in °C?"
                answer: "2"
                hints: ["5 degrees gets you to 0."]
              - id: l1-s3
                type: multiple_choice
                text: "Which temperature is the warmest?"
                options: ["−1 °C", "−9 °C", "−4 °C"]
                answer: "−1 °C"
                hints: ["The warmest is the one closest to zero here."]
              - id: l1-s4
                type: point_on_line
                text: "Tap −6 on the number line."
                show: { drawn: number-line, from: -10, to: 5, labels: ends }
                answer: -6
                hints: ["Count on from −10: −9, −8, −7 ..."]
              - id: l1-s5
                type: true_false
                text: "Is it true? −10 °C is warmer than −3 °C."
                answer: false
                hints: ["Which is further below zero?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: text_input
                keyboard: decimal
                text: "At midnight it was −2 °C. By noon it was 6 degrees warmer. What was the temperature at noon, in °C?"
                answer: "4"
              - id: l1-n2
                type: multiple_choice
                text: "A diver is at −15 m. She swims up 6 m. Where is she now?"
                options: ["−9 m", "−21 m", "9 m"]
                answer: "−9 m"
              - id: l1-n3
                type: text_input
                keyboard: decimal
                text: "It is 3 °C in the evening. Overnight the temperature falls by 8 degrees. What is it in the morning, in °C?"
                answer: "−5"
              - id: l1-n4
                type: multiple_choice
                text: "Oslo −7 °C, London 2 °C, Moscow −12 °C, Paris −1 °C. Which city is the coldest?"
                options: ["Oslo", "London", "Moscow", "Paris"]
                answer: "Moscow"
              - id: l1-n5
                type: true_false
                text: "A freezer is at −18 °C and a fridge is at 4 °C. Is it true that the freezer is colder?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "It is −4 °C. The temperature rises by 6 degrees. What is it now?"
            options: ["2 °C", "−10 °C", "10 °C"]
            answer: "2 °C"
          - id: l1-c2
            type: multiple_choice
            text: "Which is colder, −3 °C or −8 °C?"
            options: ["−3 °C", "−8 °C"]
            answer: "−8 °C"
          - id: l1-c3
            type: text_input
            keyboard: decimal
            text: "It is 2 °C. The temperature falls by 5 degrees. What is it now, in °C?"
            answer: "−3"
          - id: l1-c4
            type: ordering
            text: "Put the temperatures in order, from warmest to coldest."
            options: ["−6 °C", "1 °C", "−10 °C", "−2 °C"]
            slot_count: 4
            answer: ["1 °C", "−2 °C", "−6 °C", "−10 °C"]
          - id: l1-c5
            type: multiple_choice
            text: "A lift is at floor −3. It goes up 5 floors. Which floor is it at now?"
            options: ["2", "−8", "8"]
            answer: "2"
          - id: l1-c6
            type: true_false
            text: "Is it true? The thermometer shows 2 °C."
            show: { drawn: thermometer, from: -10, to: 10, step: 2, value: -2 }
            answer: false

  - n: 2
    title: { de: Unterschiede über die Null, en: Differences across zero }
    goal:
      de: "Finde den Unterschied über die Null in zwei Sprüngen, so wie von minus 4 Grad bis 7 Grad sind es 11 Grad."
      en: "Find the difference across zero in two jumps, like from minus 4 degrees to 7 degrees is 11 degrees."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "It is −1 °C. The temperature rises by 4 degrees. What is it now?"
            options: ["3 °C", "−5 °C", "5 °C"]
            answer: "3 °C"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is warmer, −5 °C or −9 °C?"
            options: ["−5 °C", "−9 °C"]
            answer: "−5 °C"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "From −4 °C to 7 °C\n−4 to 0: 4 degrees\n0 to 7: 7 degrees\n4 + 7 = 11 degrees"
            say: "To find the difference across zero, count in two jumps. From minus four up to zero is four degrees. From zero up to seven is seven degrees. Four and seven make eleven, so the difference is eleven degrees."
            show: { drawn: number-line, from: -5, to: 8, labels: all, jumps: [[-4, 4], [0, 7]] }
          - text: "From −9 °C to −3 °C: 6 degrees"
            say: "When both temperatures are below zero, count on from one to the other. From minus nine to minus three is six degrees."
            show: { drawn: number-line, from: -10, to: 0, labels: all, jumps: [[-9, 6]] }
          - text: "A fish at −12 m, a bird at 8 m\n12 + 8 = 20 m apart"
            say: "The same works for heights and depths. A fish twelve metres below sea level and a bird eight metres above it are twelve and eight, twenty metres apart."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is the difference between −4 °C and 7 °C?"
                show: { drawn: number-line, from: -5, to: 8, labels: all }
                options: ["11 degrees", "3 degrees", "7 degrees"]
                answer: "11 degrees"
                feedback:
                  "3 degrees": "7 − 4 = 3 leaves out the 4 degrees below zero. Count from −4 up to 0, then on to 7."
                hints:
                  - "Count in two jumps: up to 0, then on."
                  - "From −4 to 0 is 4 degrees. From 0 to 7 is 7 degrees."
                  - "4 + 7 = 11 degrees."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Find the difference between −6 °C and 5 °C."
                frame: "−6 to 0: _ degrees, 0 to 5: _ degrees, difference: _ degrees"
                options: ["1", "5", "6", "11"]
                answer: ["6", "5", "11"]
                hints:
                  - "How far is −6 from 0?"
                  - "6 degrees up to 0, then 5 more."
                  - "6 + 5 = 11."
              - id: l2-f3
                type: multiple_choice
                text: "What is the difference between −9 °C and −3 °C?"
                options: ["6 degrees", "12 degrees", "3 degrees"]
                answer: "6 degrees"
                hints:
                  - "Both are below zero, so do not go past 0."
                  - "Count on from −9: −8, −7, −6, −5, −4, −3."
                  - "That is 6 steps, so 6 degrees."
              - id: l2-f4
                type: text_input
                text: "In the morning it was −5 °C. At lunchtime it was 3 °C. How many degrees did the temperature rise?"
                answer: "8"
                hints:
                  - "Count from −5 up to 0, then on to 3."
                  - "5 degrees, then 3 degrees."
                  - "5 + 3 = 8 degrees."
              - id: l2-f5
                type: multiple_choice
                text: "Last night it was −6 °C. The thermometer shows the temperature now. How much warmer is it now?"
                show: { drawn: thermometer, from: -10, to: 10, step: 2, value: 4, mark: -6 }
                options: ["10 degrees", "2 degrees", "4 degrees"]
                answer: "10 degrees"
                hints:
                  - "Read the temperature now first."
                  - "It is 4 °C now. From −6 to 0 is 6 degrees."
                  - "6 + 4 = 10 degrees."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "What is the difference between −3 °C and 4 °C, in degrees?"
                answer: "7"
                hints: ["3 degrees up to 0, then 4 more."]
              - id: l2-s2
                type: multiple_choice
                text: "What is the difference between −10 °C and −4 °C?"
                options: ["6 degrees", "14 degrees", "4 degrees"]
                answer: "6 degrees"
                hints: ["Both are below zero. Count on from −10 to −4."]
              - id: l2-s3
                type: multiple_choice
                text: "Which two temperatures are 10 degrees apart?"
                options: ["−4 °C and 6 °C", "−4 °C and 10 °C", "−4 °C and −6 °C"]
                answer: "−4 °C and 6 °C"
                hints: ["Work out each difference by counting to 0 and on."]
              - id: l2-s4
                type: text_input
                text: "A submarine is at −40 m. A seagull flies at 25 m. How far apart are they, in metres?"
                answer: "65"
                hints: ["40 m up to sea level, then 25 m more."]
              - id: l2-s5
                type: true_false
                text: "Is it true? The difference between −2 °C and 2 °C is 0 degrees."
                answer: false
                hints: ["Count from −2 up to 0, then on to 2."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "It was −6 °C at 6 am and 9 °C at 3 pm. How many degrees did the temperature rise?"
                answer: "15"
              - id: l2-n2
                type: multiple_choice
                text: "Amir takes the lift from floor −2 to floor 5. How many floors does he go up?"
                options: ["7", "3", "5"]
                answer: "7"
              - id: l2-n3
                type: text_input
                text: "The top of a cliff is 35 m above sea level. A diver is 12 m below sea level. How far is the diver below the top of the cliff, in metres?"
                answer: "47"
              - id: l2-n4
                type: multiple_choice
                text: "The coldest night of the year was −8 °C. The hottest day was 23 °C. What is the difference?"
                options: ["31 degrees", "15 degrees", "23 degrees"]
                answer: "31 degrees"
              - id: l2-n5
                type: text_input
                text: "It is −3 °C. How many degrees must the temperature rise to reach 5 °C?"
                answer: "8"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: compare
            type: multiple_choice
            text: "What temperature does the thermometer show?"
            show: { drawn: thermometer, from: -10, to: 10, step: 2, value: -6 }
            options: ["−6 °C", "6 °C", "−4 °C"]
            answer: "−6 °C"
          - id: l2-c2
            part: rise-fall
            type: text_input
            keyboard: decimal
            text: "It is −2 °C. The temperature falls by 5 degrees. What is it now, in °C?"
            answer: "−7"
          - id: l2-c3
            part: compare
            type: multiple_choice
            text: "Which temperature is the coldest?"
            options: ["−2 °C", "−11 °C", "0 °C", "−5 °C"]
            answer: "−11 °C"
          - id: l2-c4
            part: difference
            type: text_input
            text: "What is the difference between −5 °C and 8 °C, in degrees?"
            answer: "13"
          - id: l2-c5
            part: contexts
            type: multiple_choice
            text: "A bird is 6 m above sea level. A fish is 9 m below sea level. How far apart are they?"
            options: ["15 m", "3 m", "9 m"]
            answer: "15 m"
          - id: l2-c6
            part: compare
            type: ordering
            text: "Put the temperatures in order, from coldest to warmest."
            options: ["0 °C", "−3 °C", "5 °C", "−12 °C"]
            slot_count: 4
            answer: ["−12 °C", "−3 °C", "0 °C", "5 °C"]
          - id: l2-c7
            part: compare
            type: true_false
            text: "Is it true? −7 °C is colder than −9 °C."
            answer: false
          - id: l2-c8
            part: compare
            type: multiple_choice
            text: "Edinburgh −4 °C, Cardiff 1 °C, Belfast −2 °C, York −6 °C. Which city is colder than Belfast but warmer than York?"
            options: ["Edinburgh", "Cardiff", "Belfast", "York"]
            answer: "Edinburgh"
          - id: l2-c9
            part: rise-fall
            type: multiple_choice
            text: "It is −7 °C. The temperature rises by 10 degrees. What is it now?"
            options: ["3 °C", "−17 °C", "−3 °C"]
            answer: "3 °C"
          - id: l2-c10
            part: rise-fall
            type: text_input
            keyboard: decimal
            text: "It is −8 °C. The temperature rises by 3 degrees. What is it now, in °C?"
            answer: "−5"
          - id: l2-c11
            part: rise-fall
            type: multiple_choice
            text: "The thermometer shows the temperature at 6 pm. By midnight it falls by 10 degrees. What is the temperature at midnight?"
            show: { drawn: thermometer, from: -10, to: 10, step: 2, value: 4 }
            options: ["−6 °C", "6 °C", "−14 °C"]
            answer: "−6 °C"
          - id: l2-c12
            part: rise-fall
            type: true_false
            text: "It is 5 °C. The temperature falls by 8 degrees. Is it true that it is now −3 °C?"
            answer: true
          - id: l2-c13
            part: difference
            type: multiple_choice
            text: "What is the difference between −7 °C and 2 °C?"
            options: ["9 degrees", "5 degrees", "2 degrees"]
            answer: "9 degrees"
          - id: l2-c14
            part: difference
            type: text_input
            text: "What is the difference between −12 °C and −5 °C, in degrees?"
            answer: "7"
          - id: l2-c15
            part: difference
            type: text_input
            text: "At night it was −9 °C. In the afternoon it was 3 °C. How many degrees did the temperature rise?"
            answer: "12"
          - id: l2-c16
            part: difference
            type: multiple_choice
            text: "This morning it was 2 °C. The thermometer shows the temperature now. How much colder is it now?"
            show: { drawn: thermometer, from: -10, to: 10, step: 2, value: -6, mark: 2 }
            options: ["8 degrees", "4 degrees", "6 degrees"]
            answer: "8 degrees"
          - id: l2-c17
            part: contexts
            type: multiple_choice
            text: "A lift is at floor 4. It goes down 7 floors. Which floor is it at now?"
            options: ["−3", "3", "−11"]
            answer: "−3"
          - id: l2-c18
            part: contexts
            type: text_input
            text: "Mia takes the lift from floor −3 to floor 6. How many floors does she go up?"
            answer: "9"
          - id: l2-c19
            part: contexts
            type: text_input
            keyboard: decimal
            text: "A diver is at −8 m. She dives down another 7 m. Where is she now, in metres?"
            answer: "−15"
          - id: l2-c20
            part: contexts
            type: true_false
            text: "A kite flies 30 m above sea level. A diver is 14 m below sea level. Is it true that they are 16 m apart?"
            answer: false
