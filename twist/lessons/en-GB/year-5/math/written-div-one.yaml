# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.written-div-one
skill: math.written-mult-div.div-one-digit
curriculum: en-GB
language: en
title:
  de: Schriftlich durch einstellige Zahlen teilen
  en: Short division
summary: >
  Short division of three- and four-digit numbers by a one-digit
  number, working from the left. Lesson 1 divides place by place when
  every digit divides exactly (846 ÷ 2), then exchanges a remainder into
  the next place (736 ÷ 4: 7 ÷ 4 is 1 remainder 3, so 33 tens ÷ 4);
  lesson 2 divides four-digit numbers, explains each step, checks with
  the inverse, and ends with the skill check. All divisions here come
  out exactly; remainders and zeros in the answer follow in the next
  skill. The bus stop layout is drawn with its exchanged digits.
metadata:
  year: year-5
  topic: { de: Schriftlich teilen, en: Written division }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.mult-div-larger.semi-written-div, math.written-add-sub.sub-regroup]
  also_practises: [math.written-mult-div.mult-one-digit]
  vocabulary: { en: [short division, divide, dividend, divisor, exchange, remainder, inverse] }
  forms: [text, audio, drawn]
  drawn: [short-division]
  facets: []
  parts:
    - { id: three-digit, what: { de: "dreistellige Zahlen schriftlich teilen, Reste weitergeben", en: "dividing three-digit numbers by short division, exchanging remainders" } }
    - { id: four-digit, what: { de: "vierstellige Zahlen schriftlich teilen, Reste weitergeben", en: "dividing four-digit numbers by short division, exchanging remainders" } }
    - { id: explain, what: { de: jeden Schritt erklären und Fehler finden, en: explaining each step and spotting mistakes } }
    - { id: in-context, what: { de: Sachaufgaben mit schriftlichem Teilen, en: word problems with short division } }
  misconceptions:
    - id: start-right
      what: Starts with the ones, as in multiplication
      addressed: lesson 1 Learn says division starts on the left; l1-f3 asks where to start, with feedback on the ones; every step frame goes from the left
    - id: drop-remainder
      what: Forgets the remainder and divides the next digit on its own (736 ÷ 4 = 1 r 3, then 3 ÷ 4 ...)
      addressed: lesson 1 Learn exchanges each remainder into the next place; l1-f5, l1-s5 and l2-f3 show a forgotten exchange, with feedback in l1-f5; l2-n3 has a correct one to judge
    - id: explain-step
      what: Cannot say what a step means (33 is 33 tens)
      addressed: lesson 2 Learn names the place in each step; l2-f2, l2-s2, l2-n2 and l2-c3 ask what a number in the working stands for
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Von links nach rechts teilen", en: "Dividing from the left" }
    goal:
      de: "Teile schriftlich von links nach rechts und tausche jeden Rest in die nächste Stelle, so wie bei 736 geteilt durch 4."
      en: "Use short division from the left, and exchange each remainder into the next place, like 736 divided by 4."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "960 ÷ 3 = _"
            say: "Nine hundred and sixty divided by three."
            answer: "320"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Column subtraction: 503 − 268 = _"
            say: "Column subtraction. Five hundred and three subtract two hundred and sixty-eight."
            answer: "235"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "846 ÷ 2. More or less than 400? What do you think?"
            say: "Eight hundred and forty-six divided by two. Do you think the answer is more or less than four hundred? Have a guess."
          - text: "846 ÷ 2"
            say: "Eight hundred and forty-six divided by two, in short division. Write the eight hundred and forty-six inside the bus stop and the two outside. Division starts on the left, with the biggest place."
            show: { drawn: short-division, divisor: 2, dividend: "846" }
          - text: "hundreds: 8 ÷ 2 = 4\ntens: 4 ÷ 2 = 2\nones: 6 ÷ 2 = 3\n846 ÷ 2 = 423"
            say: "Eight hundreds divided by two is four hundreds. Four tens divided by two is two tens. Six ones divided by two is three ones. The answer goes on top of the bus stop: four hundred and twenty-three. A little more than four hundred."
            show: { drawn: short-division, divisor: 2, dividend: "846", quotient: "423" }
          - text: "736 ÷ 4\nhundreds: 7 ÷ 4 = 1 r 3\nexchange: 3 hundreds = 30 tens, so 33 tens\ntens: 33 ÷ 4 = 8 r 1\nexchange: 1 ten = 10 ones, so 16 ones\nones: 16 ÷ 4 = 4\n736 ÷ 4 = 184"
            say: "Seven hundred and thirty-six divided by four. Seven hundreds divided by four is one, remainder three. Exchange the three hundreds for thirty tens and write a small three in front of the three tens: thirty-three tens. Thirty-three divided by four is eight, remainder one. Exchange the one ten for ten ones: sixteen ones. Sixteen divided by four is four. The answer is one hundred and eighty-four."
            show: { drawn: short-division, divisor: 4, dividend: "736", quotient: "184", carries: " 31" }
          - text: "Check: 184 × 4 = 736"
            say: "Check with the inverse. One hundred and eighty-four times four is seven hundred and thirty-six. It matches."
          - text: "Did you know? The ÷ sign was first printed for dividing in 1659, in a maths book by Johann Rahn from Switzerland."
            say: "Did you know? The divide sign, a line with a dot above and a dot below, was first printed for dividing in sixteen fifty-nine, in a maths book by Johann Rahn from Switzerland. Before that, people wrote divided by in words!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "963 ÷ 3. Start on the left."
                say: "Nine hundred and sixty-three divided by three. Start on the left."
                frame: "hundreds: 9 ÷ 3 = _; tens: 6 ÷ 3 = _; ones: 3 ÷ 3 = _"
                options: ["3", "2", "1", "6"]
                answer: ["3", "2", "1"]
                hints:
                  - "Hundreds first: nine divided by three."
                  - "Then six tens divided by three, then three ones divided by three."
                  - "3, 2 and 1. The answer is 321."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "684 ÷ 2 = _"
                say: "Six hundred and eighty-four divided by two."
                show: { drawn: short-division, divisor: 2, dividend: "684", quotient: "___" }
                answer: "342"
                hints:
                  - "Start on the left: six divided by two."
                  - "Then eight divided by two, then four divided by two."
                  - "342."
              - id: l1-f3
                type: multiple_choice
                text: "Where do you start in short division?"
                options: ["on the left, with the biggest place", "on the right, with the ones", "wherever the bus stops"]
                answer: "on the left, with the biggest place"
                feedback:
                  "on the right, with the ones": "That is how column multiplication starts. Division starts on the left, so remainders can be exchanged into the next place."
                  "wherever the bus stops": "This bus stop always starts on the left, with the biggest place!"
                hints:
                  - "Where do the remainders go?"
                  - "A remainder is exchanged into the next smaller place, to its right."
                  - "On the left."
              - id: l1-f4
                type: fill_in_blank
                text: "576 ÷ 4. Exchange each remainder."
                say: "Five hundred and seventy-six divided by four. Exchange each remainder."
                frame: "5 ÷ 4 = 1 r 1; 17 ÷ 4 = _ r _; 16 ÷ 4 = _"
                options: ["4", "1", "3", "2"]
                answer: ["4", "1", "4"]
                hints:
                  - "One hundred left over becomes ten tens, so 17 tens."
                  - "17 ÷ 4 = 4 remainder 1. That 1 ten becomes 10 ones, so 16 ones."
                  - "4 r 1, then 4. The answer is 144."
              - id: l1-f5
                type: multiple_choice
                text: "Is there a mistake? Amy works out 852 ÷ 6.\n8 ÷ 6 = 1 r 2\n5 ÷ 6 = 0\n2 ÷ 6 = 0\nAnswer: 100"
                show: { drawn: short-division, divisor: 6, dividend: "852", quotient: "100" }
                options: ["Yes, she did not exchange the remainder 2.", "Yes, she should start with the ones.", "No, it is correct."]
                answer: "Yes, she did not exchange the remainder 2."
                feedback:
                  "No, it is correct.": "Check: 100 × 6 = 600, not 852. The remainder 2 hundreds must become 20 tens, so 25 tens."
                hints:
                  - "What happens to the remainder after 8 ÷ 6?"
                  - "2 hundreds become 20 tens. With the 5 tens that makes 25 tens."
                  - "She forgot to exchange. 852 ÷ 6 = 142."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "848 ÷ 4. Start on the left."
                say: "Eight hundred and forty-eight divided by four. Start on the left."
                frame: "hundreds: 8 ÷ 4 = _; tens: 4 ÷ 4 = _; ones: 8 ÷ 4 = _"
                options: ["2", "1", "4", "0"]
                answer: ["2", "1", "2"]
                hints: ["Hundreds, then tens, then ones."]
              - id: l1-s2
                type: text_input
                text: "396 ÷ 3 = _"
                say: "Three hundred and ninety-six divided by three."
                answer: "132"
                hints: ["3 ÷ 3, then 9 ÷ 3, then 6 ÷ 3."]
              - id: l1-s3
                type: fill_in_blank
                text: "534 ÷ 6. There are not enough hundreds, so start with the tens."
                say: "Five hundred and thirty-four divided by six. There are not enough hundreds, so start with the tens."
                frame: "53 ÷ 6 = _ r _; 54 ÷ 6 = _"
                options: ["8", "5", "9", "6"]
                answer: ["8", "5", "9"]
                hints: ["8 × 6 = 48, and 53 − 48 = 5."]
              - id: l1-s4
                type: text_input
                text: "672 ÷ 4 = _"
                say: "Six hundred and seventy-two divided by four."
                show: { drawn: short-division, divisor: 4, dividend: "672", quotient: "___" }
                answer: "168"
                hints: ["6 ÷ 4 = 1 r 2, so 27 tens next."]
              - id: l1-s5
                type: true_false
                text: "Is there a mistake? 735 ÷ 5: 7 ÷ 5 = 1 r 2, 3 ÷ 5 = 0, 5 ÷ 5 = 1. Answer: 101"
                answer: true
                hints: ["What happened to the remainder 2?"]

          - support: none
            tasks:
              - id: l1-n2
                type: text_input
                text: "945 ÷ 5 = _"
                say: "Nine hundred and forty-five divided by five."
                answer: "189"
              - id: l1-n3
                type: text_input
                text: "498 ÷ 6 = _"
                say: "Four hundred and ninety-eight divided by six."
                answer: "83"
              - id: l1-n1
                type: fill_in_blank
                text: "639 ÷ 3. Start on the left."
                say: "Six hundred and thirty-nine divided by three. Start on the left."
                frame: "hundreds: 6 ÷ 3 = _; tens: 3 ÷ 3 = _; ones: 9 ÷ 3 = _"
                options: ["2", "1", "3", "0"]
                answer: ["2", "1", "3"]
              - id: l1-n4
                type: text_input
                text: "984 ÷ 8 = _"
                say: "Nine hundred and eighty-four divided by eight."
                answer: "123"
              - id: l1-n5
                type: text_input
                text: "A baker shares 774 rolls equally between 9 shops. How many rolls does each shop get?"
                answer: "86"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "826 ÷ 2 = _"
            say: "Eight hundred and twenty-six divided by two."
            answer: "413"
          - id: l1-c2
            type: text_input
            text: "516 ÷ 3 = _"
            say: "Five hundred and sixteen divided by three."
            answer: "172"
          - id: l1-c3
            type: multiple_choice
            text: "Where do you start in short division?"
            options: ["on the left, with the biggest place", "on the right, with the ones"]
            answer: "on the left, with the biggest place"
          - id: l1-c4
            type: text_input
            text: "856 ÷ 4 = _"
            say: "Eight hundred and fifty-six divided by four."
            answer: "214"
          - id: l1-c5
            type: fill_in_blank
            text: "783 ÷ 3"
            say: "Seven hundred and eighty-three divided by three."
            frame: "7 ÷ 3 = 2 r _; 18 ÷ 3 = _; 3 ÷ 3 = _"
            options: ["1", "6", "2", "3"]
            answer: ["1", "6", "1"]
          - id: l1-c6
            type: true_false
            text: "Is there a mistake? 975 ÷ 5: 9 ÷ 5 = 1 r 4, 47 ÷ 5 = 9 r 2, 25 ÷ 5 = 5. Answer: 195"
            say: "Is there a mistake? Nine hundred and seventy-five divided by five: nine divided by five is one remainder four, forty-seven divided by five is nine remainder two, twenty-five divided by five is five. Answer: one hundred and ninety-five."
            answer: false

  - n: 2
    title: { de: "Vierstellige Zahlen teilen und prüfen", en: "Four-digit numbers, step by step" }
    goal:
      de: "Teile vierstellige Zahlen schriftlich, erklär jeden Schritt mit seiner Stelle und prüf mit Malnehmen, so wie bei 5928 geteilt durch 4."
      en: "Divide four-digit numbers with short division, explain each step, and check by multiplying, like 5928 divided by 4."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "936 ÷ 3 = _"
            say: "Nine hundred and thirty-six divided by three."
            answer: "312"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "756 ÷ 6 = _"
            say: "Seven hundred and fifty-six divided by six."
            answer: "126"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5928 ÷ 4. Will the answer have 3 digits or 4? What do you think?"
            say: "Five thousand nine hundred and twenty-eight divided by four. Will the answer have three digits or four? Have a guess."
          - text: "5928 ÷ 4"
            say: "Four-digit numbers work the same way: start with the thousands. Five thousands divided by four is at least one thousand, so the answer will have four digits."
          - text: "thousands: 5 ÷ 4 = 1 r 1\nhundreds: 19 ÷ 4 = 4 r 3\ntens: 32 ÷ 4 = 8\nones: 8 ÷ 4 = 2\n5928 ÷ 4 = 1482"
            say: "Five thousands divided by four is one, remainder one thousand. Exchange it for ten hundreds: nineteen hundreds. Nineteen divided by four is four, remainder three hundreds. Exchange them for thirty tens: thirty-two tens. Thirty-two divided by four is eight. Eight ones divided by four is two. The answer is one thousand four hundred and eighty-two."
            show: { drawn: short-division, divisor: 4, dividend: "5928", quotient: "1482", carries: " 13 " }
          - text: "In 19 ÷ 4, the 19 means 19 hundreds."
            say: "When you explain a step, say the place. The nineteen is nineteen hundreds: one thousand exchanged for ten hundreds, and nine more hundreds."
          - text: "Check: 1482 × 4 = 5928"
            say: "Check with the inverse. One thousand four hundred and eighty-two times four is five thousand nine hundred and twenty-eight."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "4635 ÷ 3. Exchange each remainder."
                say: "Four thousand six hundred and thirty-five divided by three. Exchange each remainder."
                frame: "4 ÷ 3 = 1 r 1; 16 ÷ 3 = _ r _; 13 ÷ 3 = _ r _; 15 ÷ 3 = _"
                options: ["5", "1", "4", "3"]
                answer: ["5", "1", "4", "1", "5"]
                hints:
                  - "Each remainder joins the next digit."
                  - "16 ÷ 3 = 5 r 1, so 13 tens. 13 ÷ 3 = 4 r 1, so 15 ones."
                  - "5 r 1, 4 r 1, 5. The answer is 1545."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "In 3756 ÷ 6, the first step is 37 ÷ 6. What does the 37 stand for?"
                options: ["37 hundreds", "37 ones", "37 thousands"]
                answer: "37 hundreds"
                feedback:
                  "37 thousands": "3756 has only 3 thousands. 3 thousands are 30 hundreds, plus 7 hundreds."
                hints:
                  - "There are not enough thousands to divide by 6."
                  - "3 thousands are 30 hundreds. Add the 7 hundreds."
                  - "37 hundreds."
              - id: l2-f3
                type: true_false
                text: "Is there a mistake? 2196 ÷ 6: 21 ÷ 6 = 3 r 3, 9 ÷ 6 = 1 r 3, 6 ÷ 6 = 1. Answer: 311"
                answer: true
                hints:
                  - "What happens to the remainder 3 after 21 ÷ 6?"
                  - "3 hundreds become 30 tens, so 39 tens, not 9."
                  - "Yes. 39 ÷ 6 = 6 r 3, then 36 ÷ 6 = 6. The answer is 366."
              - id: l2-f4
                type: text_input
                text: "7368 ÷ 8 = _"
                say: "Seven thousand three hundred and sixty-eight divided by eight."
                show: { drawn: short-division, divisor: 8, dividend: "7368", quotient: " ___" }
                answer: "921"
                hints:
                  - "7 thousands are not enough for 8. Start with 73 hundreds."
                  - "73 ÷ 8 = 9 r 1, so 16 tens. 16 ÷ 8 = 2, then 8 ÷ 8 = 1."
                  - "921."
              - id: l2-f5
                type: multiple_choice
                text: "Which calculation checks 1356 ÷ 4 = 339?"
                options: ["339 × 4", "1356 × 4", "339 + 4"]
                answer: "339 × 4"
                hints:
                  - "Use the inverse of division."
                  - "Multiply the answer by the number you divided by."
                  - "339 × 4. It should give 1356."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "6384 ÷ 4. Exchange each remainder."
                say: "Six thousand three hundred and eighty-four divided by four. Exchange each remainder."
                frame: "6 ÷ 4 = 1 r 2; 23 ÷ 4 = _ r _; 38 ÷ 4 = _ r _; 24 ÷ 4 = _"
                options: ["5", "3", "9", "2", "6"]
                answer: ["5", "3", "9", "2", "6"]
                hints: ["Each remainder joins the next digit."]
              - id: l2-s2
                type: multiple_choice
                text: "In 2835 ÷ 7, the first step is 28 ÷ 7. What does the 28 stand for?"
                options: ["28 hundreds", "28 tens", "28 thousands"]
                answer: "28 hundreds"
                hints: ["2 thousands are 20 hundreds."]
              - id: l2-s3
                type: text_input
                text: "4752 ÷ 3 = _"
                say: "Four thousand seven hundred and fifty-two divided by three."
                show: { drawn: short-division, divisor: 3, dividend: "4752", quotient: "____" }
                answer: "1584"
                hints: ["4 ÷ 3 = 1 r 1, so 17 hundreds next."]
              - id: l2-s4
                type: true_false
                text: "Check with the inverse. Is 3192 ÷ 7 = 456?"
                say: "Check with the inverse. Is three thousand one hundred and ninety-two divided by seven equal to four hundred and fifty-six?"
                answer: true
                hints: ["456 × 7."]
              - id: l2-s5
                type: text_input
                text: "A farm packs 2934 eggs into boxes of 6. How many boxes does it fill?"
                answer: "489"
                hints: ["29 ÷ 6 = 4 r 5."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "8565 ÷ 5. Exchange each remainder."
                say: "Eight thousand five hundred and sixty-five divided by five. Exchange each remainder."
                frame: "8 ÷ 5 = 1 r 3; 35 ÷ 5 = _; 6 ÷ 5 = _ r _; 15 ÷ 5 = _"
                options: ["7", "1", "3", "0"]
                answer: ["7", "1", "1", "3"]
              - id: l2-n2
                type: multiple_choice
                text: "In 5928 ÷ 4, the step 32 ÷ 4 comes up. What does the 32 stand for?"
                options: ["32 tens", "32 hundreds", "32 ones"]
                answer: "32 tens"
              - id: l2-n3
                type: true_false
                text: "Is there a mistake? 3744 ÷ 9: 37 ÷ 9 = 4 r 1, 14 ÷ 9 = 1 r 5, 54 ÷ 9 = 6. Answer: 416"
                answer: false
              - id: l2-n4
                type: text_input
                text: "6125 ÷ 7 = _"
                say: "Six thousand one hundred and twenty-five divided by seven."
                answer: "875"
              - id: l2-n5
                type: text_input
                text: "A school library has 1848 books on 8 equal shelves. How many books are on each shelf?"
                answer: "231"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: three-digit
            type: text_input
            text: "868 ÷ 4 = _"
            say: "Eight hundred and sixty-eight divided by four."
            answer: "217"
          - id: l2-c2
            part: four-digit
            type: text_input
            text: "3474 ÷ 6 = _"
            say: "Three thousand four hundred and seventy-four divided by six."
            answer: "579"
          - id: l2-c3
            part: explain
            type: multiple_choice
            text: "In 4256 ÷ 8, the first step is 42 ÷ 8. What does the 42 stand for?"
            options: ["42 hundreds", "42 tens", "42 thousands"]
            answer: "42 hundreds"
          - id: l2-c4
            part: explain
            type: true_false
            text: "Is there a mistake? 954 ÷ 3: 9 ÷ 3 = 3, 5 ÷ 3 = 1 r 2, 4 ÷ 3 = 1. Answer: 311"
            answer: true
          - id: l2-c5
            part: in-context
            type: text_input
            text: "A charity packs 2385 tins into boxes of 5. How many boxes does it fill?"
            answer: "477"
          - id: l2-c6
            part: three-digit
            type: text_input
            text: "738 ÷ 6 = _"
            say: "Seven hundred and thirty-eight divided by six."
            answer: "123"
          - id: l2-c7
            part: three-digit
            type: fill_in_blank
            text: "915 ÷ 5. Exchange each remainder."
            say: "Nine hundred and fifteen divided by five. Exchange each remainder."
            frame: "9 ÷ 5 = 1 r _; 41 ÷ 5 = _ r _; 15 ÷ 5 = _"
            options: ["4", "8", "1", "3", "2"]
            answer: ["4", "8", "1", "3"]
          - id: l2-c8
