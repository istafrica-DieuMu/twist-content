# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.large-mental
skill: math.add-sub-to-1000.large-mental
curriculum: en-GB
language: en
title:
  de: Große Zahlen im Kopf addieren und subtrahieren
  en: Adding and subtracting large numbers mentally
summary: >
  Mental addition and subtraction with large numbers that match a known
  fact. Lesson 1 works with thousands (7000 + 5000 = 12,000, because
  7 + 5 = 12) and with a number of thousands and hundreds; lesson 2 works
  with ten thousands and hundred thousands (250,000 − 50,000), crosses a
  ten thousand or a hundred thousand, finds missing numbers to a million,
  and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.large-numbers.to-million, math.add-sub-to-1000.hundreds]
  also_practises: [math.add-sub-to-20.fluency-to-20]
  vocabulary: { en: [known fact, related fact, thousands, ten thousands, hundred thousands, mentally, million] }
  forms: [text, audio]
  drawn: [place-value-chart]
  facets: []
  parts:
    - { id: thousands, what: { de: mit Tausendern und Hundertern rechnen, en: adding and subtracting thousands and hundreds from a known fact } }
    - { id: big-units, what: { de: mit Zehntausendern und Hunderttausendern rechnen, en: adding and subtracting ten thousands and hundred thousands } }
    - { id: crossing, what: { de: über einen Zehntausender oder Hunderttausender rechnen, en: crossing a ten thousand or a hundred thousand } }
    - { id: to-million, what: { de: bis zur Million ergänzen, en: finding what makes a million } }
  misconceptions:
    - id: lose-zeros
      what: Writes the wrong number of zeros (7000 + 5000 = 1200 or 120,000)
      addressed: lesson 1 Learn says the answer counts thousands; l1-f1 has feedback on 1200, l1-s1 and l1-n1 offer the wrong-zeros answers, l2-f1 has feedback on 9,000,000
    - id: place-mismatch
      what: Adds digits from different places (250,000 − 50,000 = 245,000 or 200,000)
      addressed: lesson 2 Learn names the unit before calculating; l2-f2 has feedback on 245,000, l2-s2 and l2-n2 ask again
    - id: crossing
      what: Does not exchange across a ten thousand or hundred thousand (380,000 + 40,000 = 3,120,000)
      addressed: lesson 2 Learn bridges the hundred thousand; l2-f3, l2-s3 and l2-n3 cross a boundary, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit Tausendern rechnen", en: "Using facts with thousands" }
    goal:
      de: "Rechne mit Tausendern im Kopf, mit Aufgaben, die du schon kennst, so wie 7 Tausend plus 5 Tausend gleich 12 Tausend."
      en: "Use facts you know to add and subtract thousands in your head, like 7 thousand plus 5 thousand is 12 thousand."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "700 + 500 = _"
            answer: "1200"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many thousands are in 15,000?"
            say: "How many thousands are in fifteen thousand?"
            options: ["15", "150", "1500"]
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7000 + 5000: more or less than 10,000? Guess!"
            say: "Seven thousand add five thousand. Do you think the answer is more or less than ten thousand? Have a guess."
          - text: "7 + 5 = 12\n7 thousand + 5 thousand = 12 thousand\n7000 + 5000 = 12,000"
            say: "You know seven add five is twelve. Seven thousand add five thousand works the same way, but you are counting thousands. Twelve thousands are twelve thousand: more than ten thousand."
            show: { drawn: place-value-chart, columns: [ten-thousands, thousands, hundreds, tens, ones], values: [1, 2, 0, 0, 0] }
          - text: "13 − 6 = 7\n13,000 − 6000 = 7000"
            say: "Subtracting works the same. Thirteen subtract six is seven, so thirteen thousand subtract six thousand is seven thousand."
          - text: "4500 + 2300 = 6800\n45 hundreds + 23 hundreds = 68 hundreds"
            say: "With thousands and hundreds, count in hundreds. Forty-five hundreds add twenty-three hundreds is sixty-eight hundreds, which is six thousand eight hundred."
          - text: "8000 + 4000 = 12,000, not 1200"
            say: "Check the answer is about the right size. Eight thousand add four thousand must be more than eight thousand, so twelve hundred cannot be right."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "6000 + 8000 = _"
                options: ["14,000", "1400", "140,000"]
                answer: "14,000"
                feedback:
                  "1400": "6000 + 8000 must be bigger than 6000. You are counting thousands: 6 + 8 = 14 thousands."
                hints:
                  - "Which fact do you know? 6 + 8."
                  - "6 thousands and 8 thousands make 14 thousands."
                  - "14,000."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "11,000 − 4000 = _"
                say: "Eleven thousand subtract four thousand."
                answer: "7000"
                hints:
                  - "Use 11 − 4."
                  - "11 thousands subtract 4 thousands."
                  - "7000."
              - id: l1-f3
                type: fill_in_blank
                text: "Use the fact you know."
                say: "Nine add seven is sixteen. So nine thousand add seven thousand is?"
                frame: "9 + 7 = 16, so 9000 + 7000 = _"
                options: ["16,000", "1600", "160,000"]
                answer: ["16,000"]
                hints:
                  - "Each number is a number of thousands."
                  - "16 thousands."
                  - "16,000."
              - id: l1-f4
                type: text_input
                text: "3600 + 2200 = _"
                answer: "5800"
                hints:
                  - "Count in hundreds: 36 hundreds and 22 hundreds."
                  - "36 + 22 = 58."
                  - "58 hundreds is 5800."
              - id: l1-f5
                type: true_false
                text: "Is it true? 15,000 − 8000 = 7000"
                say: "Fifteen thousand subtract eight thousand equals seven thousand. Is it true?"
                answer: true
                hints:
                  - "Use 15 − 8."
                  - "15 − 8 = 7."
                  - "Yes, 7000."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "5000 + 9000 = _"
                options: ["14,000", "1400", "4000"]
                answer: "14,000"
                hints: ["5 + 9 thousands."]
              - id: l1-s2
                type: text_input
                text: "12,000 − 7000 = _"
                say: "Twelve thousand subtract seven thousand."
                answer: "5000"
                hints: ["12 − 7."]
              - id: l1-s3
                type: text_input
                text: "7400 − 2100 = _"
                answer: "5300"
                hints: ["74 hundreds subtract 21 hundreds."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 8000 + 6000 = 1400"
                answer: false
                hints: ["Is the answer bigger than 8000?"]
              - id: l1-s5
                type: text_input
                text: "A school raises £4500 in the autumn and £3500 in the spring. How much is that altogether, in pounds?"
                answer: "8000"
                hints: ["45 hundreds and 35 hundreds."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "7000 + 7000 = _"
                options: ["14,000", "1400", "140,000"]
                answer: "14,000"
              - id: l1-n2
                type: text_input
                text: "16,000 − 9000 = _"
                say: "Sixteen thousand subtract nine thousand."
                answer: "7000"
              - id: l1-n3
                type: text_input
                text: "5800 + 2700 = _"
                answer: "8500"
              - id: l1-n4
                type: multiple_choice
                text: "10,000 − 3000 = _"
                say: "Ten thousand subtract three thousand."
                options: ["7000", "700", "9700"]
                answer: "7000"
              - id: l1-n5
                type: text_input
                text: "A car has done 6000 miles. After a long holiday it has done 9000 miles. How many miles was the holiday?"
                answer: "3000"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "8000 + 5000 = _"
            answer: "13000"
          - id: l1-c2
            type: text_input
            text: "14,000 − 6000 = _"
            say: "Fourteen thousand subtract six thousand."
            answer: "8000"
          - id: l1-c3
            type: text_input
            text: "4300 + 3400 = _"
            answer: "7700"
          - id: l1-c4
            type: multiple_choice
            text: "9000 + 9000 = _"
            options: ["18,000", "1800", "180,000"]
            answer: "18,000"
          - id: l1-c5
            type: text_input
            text: "8600 − 2400 = _"
            answer: "6200"
          - id: l1-c6
            type: true_false
            text: "Is it true? 12,000 − 8000 = 3000"
            say: "Twelve thousand subtract eight thousand equals three thousand. Is it true?"
            answer: false

  - n: 2
    title: { de: "Mit Zehntausendern und Hunderttausendern", en: "Ten thousands and hundred thousands" }
    goal:
      de: "Rechne im Kopf mit Zehntausendern und Hunderttausendern und ergänze bis zu einer Million, so wie 700 Tausend plus 300 Tausend."
      en: "Add and subtract ten thousands and hundred thousands in your head, and make a million, like 700 thousand plus 300 thousand."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "9000 + 4000 = _"
            answer: "13000"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "11,000 − 5000 = _"
            say: "Eleven thousand subtract five thousand."
            answer: "6000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "250,000 − 50,000: 200,000 or 245,000? Guess!"
            say: "Two hundred and fifty thousand subtract fifty thousand. Is it two hundred thousand, or two hundred and forty-five thousand? Have a guess."
          - text: "25 − 5 = 20\n250,000 − 50,000 = 200,000"
            say: "Two hundred and fifty thousand subtract fifty thousand. Think in ten thousands: twenty-five ten thousands subtract five ten thousands is twenty ten thousands. That is two hundred thousand."
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [2, 5, 0, 0, 0, 0] }
          - text: "300,000 + 600,000 = 900,000\n3 + 6 = 9 hundred thousands"
            say: "Three hundred thousand add six hundred thousand. Three add six is nine, so nine hundred thousand."
          - text: "380,000 + 40,000\n= 380,000 + 20,000 + 20,000\n= 400,000 + 20,000 = 420,000"
            say: "Three hundred and eighty thousand add forty thousand crosses a hundred thousand. Make the next hundred thousand first: twenty thousand gets you to four hundred thousand. Then add the other twenty thousand: four hundred and twenty thousand."
          - text: "700,000 + _ = 1,000,000\n7 + 3 = 10, so 300,000"
            say: "To make one million from seven hundred thousand, use the number bond to ten. Seven and three make ten, so you need three hundred thousand."
          - text: "Did you know? Light travels about 300,000 km in one second."
            say: "Did you know? Light is the fastest thing there is. It travels about three hundred thousand kilometres in one second. In that one second, it could go all the way round the Earth more than seven times!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "400,000 + 500,000 = _"
                say: "Four hundred thousand add five hundred thousand."
                options: ["900,000", "90,000", "9,000,000", "a gazillion"]
                answer: "900,000"
                feedback:
                  "a gazillion": "Gazillion is not a real number! Count in hundred thousands: 4 + 5."
                  "9,000,000": "That has one zero too many. 4 hundred thousands and 5 hundred thousands make 9 hundred thousands."
                hints:
                  - "Count in hundred thousands."
                  - "4 hundred thousands add 5 hundred thousands."
                  - "9 hundred thousands: 900,000."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "250,000 − 50,000 = _"
                say: "Two hundred and fifty thousand subtract fifty thousand."
                options: ["200,000", "245,000", "150,000"]
                answer: "200,000"
                feedback:
                  "245,000": "50,000 is 5 ten thousands, not 5 thousands. Take 5 from the ten thousands."
                hints:
                  - "Think in ten thousands: 250,000 is 25 ten thousands."
                  - "25 − 5 = 20 ten thousands."
                  - "200,000."
              - id: l2-f3
                type: multiple_choice
                text: "380,000 + 40,000 = _"
                say: "Three hundred and eighty thousand add forty thousand."
                options: ["420,000", "320,000", "3,120,000"]
                answer: "420,000"
                feedback:
                  "3,120,000": "8 + 4 = 12 ten thousands. Exchange 10 of them for one more hundred thousand."
                hints:
                  - "Make the next hundred thousand first."
                  - "380,000 + 20,000 = 400,000. Then add the other 20,000."
                  - "420,000."
              - id: l2-f4
                type: fill_in_blank
                text: "Make one million."
                say: "Six hundred thousand add what makes one million?"
                frame: "600,000 + _ = 1,000,000"
                options: ["400,000", "40,000", "500,000"]
                answer: ["400,000"]
                hints:
                  - "Use a number bond to ten."
                  - "6 + 4 = 10."
                  - "400,000."
              - id: l2-f5
                type: true_false
                text: "Is it true? 72,000 + 8000 = 80,000"
                say: "Seventy-two thousand add eight thousand equals eighty thousand. Is it true?"
                answer: true
                hints:
                  - "Count in thousands: 72 + 8."
                  - "72 + 8 = 80 thousands."
                  - "Yes, 80,000."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "800,000 − 300,000 = _"
                say: "Eight hundred thousand subtract three hundred thousand."
                answer: "500000"
                hints: ["8 − 3 hundred thousands."]
              - id: l2-s2
                type: multiple_choice
                text: "460,000 − 60,000 = _"
                say: "Four hundred and sixty thousand subtract sixty thousand."
                options: ["400,000", "454,000", "360,000"]
                answer: "400,000"
                hints: ["46 − 6 ten thousands."]
              - id: l2-s3
                type: multiple_choice
                text: "570,000 + 50,000 = _"
                say: "Five hundred and seventy thousand add fifty thousand."
                options: ["620,000", "520,000", "5,120,000"]
                answer: "620,000"
                hints: ["570,000 + 30,000 = 600,000 first."]
              - id: l2-s4
                type: fill_in_blank
                text: "Make one million."
                say: "Two hundred and fifty thousand add what makes one million?"
                frame: "250,000 + _ = 1,000,000"
                options: ["750,000", "850,000", "650,000"]
                answer: ["750,000"]
                hints: ["25 + 75 = 100."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 1,000,000 − 100,000 = 0"
                say: "One million subtract one hundred thousand equals nought. Is it true?"
                answer: false
                hints: ["A million is ten hundred thousands."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "900,000 − 400,000 = _"
                say: "Nine hundred thousand subtract four hundred thousand."
                answer: "500000"
              - id: l2-n2
                type: multiple_choice
                text: "730,000 − 30,000 = _"
                say: "Seven hundred and thirty thousand subtract thirty thousand."
                options: ["700,000", "727,000", "430,000"]
                answer: "700,000"
              - id: l2-n3
                type: text_input
                text: "290,000 + 30,000 = _"
                say: "Two hundred and ninety thousand add thirty thousand."
                answer: "320000"
              - id: l2-n4
                type: fill_in_blank
                text: "Make one million."
                say: "Nine hundred and ten thousand add what makes one million?"
                frame: "910,000 + _ = 1,000,000"
                options: ["90,000", "190,000", "9000"]
                answer: ["90,000"]
              - id: l2-n5
                type: text_input
                text: "A football ground holds 60,000 people. 52,000 tickets are sold. How many tickets are left?"
                say: "A football ground holds sixty thousand people. Fifty-two thousand tickets are sold. How many tickets are left?"
                answer: "8000"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: thousands
            type: text_input
            text: "7000 + 6000 = _"
            answer: "13000"
          - id: l2-c2
            part: big-units
            type: multiple_choice
            text: "350,000 − 50,000 = _"
            say: "Three hundred and fifty thousand subtract fifty thousand."
            options: ["300,000", "345,000", "250,000"]
            answer: "300,000"
          - id: l2-c3
            part: crossing
            type: text_input
            text: "460,000 + 70,000 = _"
            say: "Four hundred and sixty thousand add seventy thousand."
            answer: "530000"
          - id: l2-c4
            part: to-million
            type: fill_in_blank
            text: "Make one million."
            say: "Three hundred thousand add what makes one million?"
            frame: "300,000 + _ = 1,000,000"
            options: ["700,000", "70,000", "600,000"]
            answer: ["700,000"]
          - id: l2-c5
            part: thousands
            type: text_input
            text: "6200 − 3500 = _"
            answer: "2700"
          - id: l2-c6
            part: thousands
            type: text_input
            text: "17,000 − 8000 = _"
            say: "Seventeen thousand subtract eight thousand."
            answer: "9000"
          - id: l2-c7
            part: thousands
            type: true_false
            text: "Is it true? 5600 + 2400 = 8000"
            answer: true
          - id: l2-c8
            part: thousands
            type: multiple_choice
            text: "A town has 8500 people. 1500 more move in. How many people live there now?"
            options: ["10,000", "9000", "100,000"]
            answer: "10,000"
          - id: l2-c9
            part: big-units
            type: text_input
            text: "600,000 + 300,000 = _"
            say: "Six hundred thousand add three hundred thousand."
            answer: "900000"
          - id: l2-c10
            part: big-units
            type: multiple_choice
            text: "540,000 − 40,000 = _"
            say: "Five hundred and forty thousand subtract forty thousand."
            options: ["500,000", "536,000", "140,000"]
            answer: "500,000"
          - id: l2-c11
            part: big-units
            type: true_false
            text: "Is it true? 120,000 + 30,000 = 420,000"
            say: "One hundred and twenty thousand add thirty thousand equals four hundred and twenty thousand. Is it true?"
            answer: false
          - id: l2-c12
            part: big-units
            type: text_input
            text: "A city has 450,000 people. A smaller city has 150,000 fewer people. How many people live in the smaller city?"
            say: "A city has four hundred and fifty thousand people. A smaller city has one hundred and fifty thousand fewer people. How many people live in the smaller city?"
            answer: "300000"
          - id: l2-c13
            part: crossing
            type: multiple_choice
            text: "470,000 + 50,000 = _"
            say: "Four hundred and seventy thousand add fifty thousand."
            options: ["520,000", "420,000", "4,120,000"]
            answer: "520,000"
          - id: l2-c14
            part: crossing
            type: text_input
            text: "610,000 − 30,000 = _"
            say: "Six hundred and ten thousand subtract thirty thousand."
            answer: "580000"
          - id: l2-c15
            part: crossing
            type: text_input
            text: "86,000 + 7000 = _"
            say: "Eighty-six thousand add seven thousand."
            answer: "93000"
          - id: l2-c16
            part: crossing
            type: true_false
            text: "Is it true? 340,000 − 60,000 = 280,000"
            say: "Three hundred and forty thousand subtract sixty thousand equals two hundred and eighty thousand. Is it true?"
            answer: true
          - id: l2-c17
            part: to-million
            type: fill_in_blank
            text: "Make one million."
            say: "What add two hundred thousand makes one million?"
            frame: "_ + 200,000 = 1,000,000"
            options: ["800,000", "80,000", "900,000"]
            answer: ["800,000"]
          - id: l2-c18
            part: to-million
            type: text_input
            text: "1,000,000 − 450,000 = _"
            say: "One million subtract four hundred and fifty thousand."
            answer: "550000"
          - id: l2-c19
            part: to-million
            type: multiple_choice
            text: "A charity wants to raise £1,000,000. So far it has £650,000. How much more does it need?"
            say: "A charity wants to raise one million pounds. So far it has six hundred and fifty thousand pounds. How much more does it need?"
            options: ["£350,000", "£450,000", "£35,000"]
            answer: "£350,000"
          - id: l2-c20
            part: to-million
            type: true_false
            text: "Is it true? 980,000 + 2000 = 1,000,000"
            say: "Nine hundred and eighty thousand add two thousand equals one million. Is it true?"
            answer: false
