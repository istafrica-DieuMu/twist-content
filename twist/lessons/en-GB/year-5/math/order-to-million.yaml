# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.order-to-million
skill: math.large-numbers.order-to-million
curriculum: en-GB
language: en
title:
  de: Ordnen, vergleichen und runden bis 1 000 000
  en: Ordering, comparing and rounding to 1,000,000
summary: >
  Numbers to a million on number lines, compared and ordered, and rounded
  to the nearest 10, 100, 1000, 10,000 and 100,000 as Year 5 asks, with
  sensible rounding in contexts (a crowd, a price, a distance). Lesson 1
  places and compares; lesson 2 rounds and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Zahlen bis 1 000 000, en: Numbers to 1 000 000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-million, math.large-numbers.order-to-10000]
  also_practises: []
  vocabulary: { en: [ascending, descending, greater than, less than, round, nearest 10,000, nearest 100,000, sensible] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: [operation-signs, currency]
  parts:
    - { id: number-line, what: { de: Zahlen bis 1 000 000 am Zahlenstrahl finden und ablesen, en: finding and reading numbers to 1 000 000 on a number line } }
    - { id: compare, what: { de: Zahlen bis 1 000 000 vergleichen und ordnen, en: comparing and ordering numbers to 1 000 000 } }
    - { id: round, what: { de: "auf Hunderter, Tausender, Zehntausender und Hunderttausender runden", en: "rounding to the nearest 100, 1000, 10,000 and 100,000" } }
    - { id: sensible, what: { de: Zahlen aus dem Alltag sinnvoll runden, en: rounding real-life numbers sensibly } }
  misconceptions:
    - id: length-first
      what: Compares by the first digit even when the numbers have different numbers of digits (99,999 > 100,000)
      addressed: lesson 1 Learn counts the digits first; feedback on that option says so
    - id: rounding-place
      what: Uses the wrong digit to decide when rounding to the nearest 10,000
      addressed: lesson 2 Learn names the deciding digit for each place; one number is rounded three ways
    - id: sensible
      what: Rounds to a place that makes no sense in context (a price of £3.47 to the nearest £100,000)
      addressed: lesson 2 asks which rounding is sensible in a context
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Vergleichen und ordnen, en: Comparing and ordering }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is the 5 in 652,104 worth?"
            options: ["5000", "50,000", "500,000"]
            answer: "50,000"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "4281 _ 4218"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "99,999 < 100,000"
            say: "First count the digits. Ninety-nine thousand, nine hundred and ninety-nine has five digits. One hundred thousand has six. More digits means greater."
          - text: "345,210 and 354,120"
            say: "Same number of digits? Compare from the left. The hundred thousands are both three. In the ten thousands, four is less than five. So three hundred and forty-five thousand, two hundred and ten is less."
          - text: "0 to 1,000,000"
            say: "On a number line from zero to one million in ten intervals, each interval is one hundred thousand."
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 600000 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "99,999 _ 100,000"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "Nines are big digits, but 100,000 has six digits and 99,999 only five."
                hints:
                  - "Count the digits."
                  - "Five digits against six."
                  - "99,999 is less than 100,000."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "345,210 _ 354,120"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "The hundred thousands are the same."
                  - "Compare the ten thousands: 4 and 5."
                  - "345,210 is less."
              - id: l1-f3
                type: ordering
                text: "Put the numbers in ascending order, smallest first."
                options: ["502,000", "250,000", "520,000", "205,000"]
                slot_count: 4
                answer: ["205,000", "250,000", "502,000", "520,000"]
                hints:
                  - "Which have 2 hundred thousands?"
                  - "205,000 and 250,000 first. Which is smaller?"
                  - "205,000, 250,000, 502,000, 520,000."
              - id: l1-f4
                type: multiple_choice
                text: "Where is the arrow pointing?"
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 300000 }
                options: ["3000", "30,000", "300,000"]
                answer: "300,000"
                hints:
                  - "What is each interval worth?"
                  - "Each interval is 100,000."
                  - "Three intervals: 300,000."
              - id: l1-f5
                type: multiple_choice
                text: "A football ground holds 74,140 people. Another holds 74,410. Which holds more?"
                options: ["74,140", "74,410"]
                answer: "74,410"
                hints:
                  - "The thousands are the same."
                  - "Compare the hundreds: 1 and 4."
                  - "74,410 holds more."
              - id: l1-f6
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ > 699,999"
                options: ["699,909", "700,000", "69,999"]
                answer: ["700,000"]
                hints:
                  - "It must be greater than 699,999."
                  - "One more than 699,999 is 700,000."
                  - "700,000."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "810,050 _ 801,500"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Compare the ten thousands."]
              - id: l1-s2
                type: ordering
                text: "Put the numbers in descending order, greatest first."
                options: ["90,909", "909,090", "99,000", "900,990"]
                slot_count: 4
                answer: ["909,090", "900,990", "99,000", "90,909"]
                hints: ["Six-digit numbers first."]
              - id: l1-s3
                type: multiple_choice
                text: "Where is the arrow pointing?"
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 800000 }
                options: ["8000", "80,000", "800,000"]
                answer: "800,000"
                hints: ["Each interval is 100,000."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 1,000,000 > 999,999"
                answer: true
                hints: ["Count the digits."]
              - id: l1-s5
                type: multiple_choice
                text: "Which is the smallest?"
                options: ["45,600", "456,000", "45,060"]
                answer: "45,060"
                hints: ["Five-digit numbers first, then compare."]
              - id: l1-s6
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ < 250,000"
                options: ["250,001", "205,000", "520,000"]
                answer: ["205,000"]
                hints: ["Less than 250,000."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "67,890 _ 678,900"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n2
                type: ordering
                text: "Put the numbers in ascending order, smallest first."
                options: ["330,033", "303,330", "333,000", "330,303"]
                slot_count: 4
                answer: ["303,330", "330,033", "330,303", "333,000"]
              - id: l1-n3
                type: multiple_choice
                text: "Where is the arrow pointing?"
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 500000 }
                options: ["5000", "50,000", "500,000"]
                answer: "500,000"
              - id: l1-n4
                type: true_false
                text: "Is it true? 456,789 < 465,789"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which is the greatest?"
                options: ["123,456", "132,465", "123,546"]
                answer: "132,465"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "520,400 _ 502,400"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c2
            type: ordering
            text: "Put the numbers in ascending order, smallest first."
            options: ["71,000", "710,000", "17,000", "170,000"]
            slot_count: 4
            answer: ["17,000", "71,000", "170,000", "710,000"]
          - id: l1-c3
            type: multiple_choice
            text: "Which is the smallest?"
            options: ["88,800", "88,080", "880,800"]
            answer: "88,080"
          - id: l1-c4
            type: point_on_line
            text: "Tap 200,000 on the number line."
            say: "Tap two hundred thousand on the number line."
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends }
            answer: 200000
          - id: l1-c5
            type: true_false
            text: "Is it true? 708,000 < 780,000"
            say: "Is it true? Seven hundred and eight thousand is less than seven hundred and eighty thousand."
            answer: true
          - id: l1-c6
            type: ordering
            text: "Put the numbers in descending order, greatest first."
            options: ["45,000", "405,000", "54,000", "450,000"]
            slot_count: 4
            answer: ["450,000", "405,000", "54,000", "45,000"]

  - n: 2
    title: { de: Sinnvoll runden, en: Rounding sensibly }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Round 7250 to the nearest 1000."
            options: ["7000", "7300", "8000"]
            answer: "7000"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "305,000 _ 350,000"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "364,820 → 360,000"
            say: "To round to the nearest ten thousand, look at the thousands digit. In three hundred and sixty-four thousand, eight hundred and twenty it is four, so round down: three hundred and sixty thousand."
          - text: "364,820 → 400,000"
            say: "To the nearest hundred thousand, look at the ten thousands digit. It is six, so round up: four hundred thousand. The digit just to the right of the place always decides."
          - text: "A crowd of 52,317"
            say: "In real life, round to a place that makes sense. For a crowd of fifty-two thousand, three hundred and seventeen, we might say about fifty-two thousand. Rounding to the nearest hundred thousand would give one hundred thousand, about twice the real crowd."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Round 364,820 to the nearest 10,000."
                options: ["360,000", "370,000", "364,000"]
                answer: "360,000"
                feedback:
                  "364,000": "That is the nearest 1000. For the nearest 10,000, the thousands digit decides."
                hints:
                  - "Which digit decides?"
                  - "The thousands digit is 4: round down."
                  - "360,000."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Round 651,000 to the nearest 100,000."
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 651000 }
                options: ["600,000", "700,000", "650,000"]
                answer: "700,000"
                hints:
                  - "The ten thousands digit decides."
                  - "It is 5: round up."
                  - "700,000."
              - id: l2-f3
                type: fill_in_blank
                text: "Round 248,563."
                frame: "nearest 1000: _  nearest 10,000: _  nearest 100,000: _"
                options: ["200,000", "249,000", "250,000", "248,000"]
                answer: ["249,000", "250,000", "200,000"]
                hints:
                  - "Nearest 1000: the hundreds digit 5. Nearest 10,000: the thousands digit 8."
                  - "Nearest 100,000: the ten thousands digit 4."
                  - "249,000, 250,000, 200,000."
              - id: l2-f4
                type: multiple_choice
                text: "A town has 52,317 people. Which is the most sensible rounding?"
                options: ["about 52,000", "about 100,000", "about 52,317"]
                answer: "about 52,000"
                hints:
                  - "Rounding makes a number easier to say and remember."
                  - "About 100,000 is twice the real number; 52,317 is not rounded."
                  - "About 52,000."
              - id: l2-f5
                type: true_false
                text: "Is it true? 95,000 rounded to the nearest 10,000 is 100,000."
                answer: true
                hints:
                  - "The thousands digit is 5."
                  - "Round up: 90,000 becomes 100,000."
                  - "Yes."
              - id: l2-f6
                type: text_input
                text: "Round 709,481 to the nearest 1000."
                answer: "709000"
                hints:
                  - "The hundreds digit decides."
                  - "It is 4: round down."
                  - "709,000."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Round 128,700 to the nearest 10,000."
                options: ["120,000", "130,000", "129,000"]
                answer: "130,000"
                hints: ["The thousands digit is 8."]
              - id: l2-s2
                type: multiple_choice
                text: "Round 449,999 to the nearest 100,000."
                options: ["400,000", "500,000", "450,000"]
                answer: "400,000"
                hints: ["The ten thousands digit is 4."]
              - id: l2-s3
                type: fill_in_blank
                text: "Round 583,250."
                frame: "nearest 1000: _  nearest 10,000: _  nearest 100,000: _"
                options: ["580,000", "583,000", "600,000", "590,000"]
                answer: ["583,000", "580,000", "600,000"]
                hints: ["A different digit decides each time."]
              - id: l2-s4
                type: multiple_choice
                text: "A car costs £18,950. Which is the most sensible rounding?"
                options: ["about £19,000", "about £20", "about £100,000"]
                answer: "about £19,000"
                hints: ["Round to a place that keeps the size clear."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 350,000 rounded to the nearest 100,000 is 300,000."
                answer: false
                hints: ["Halfway rounds up."]
              - id: l2-s6
                type: text_input
                text: "Round 64,820 to the nearest 10,000."
                answer: "60000"
                hints: ["The thousands digit is 4."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Round 875,000 to the nearest 100,000."
                options: ["800,000", "900,000", "880,000"]
                answer: "900,000"
              - id: l2-n2
                type: text_input
                text: "Round 312,560 to the nearest 1000."
                answer: "313000"
              - id: l2-n3
                type: fill_in_blank
                text: "Round 951,499."
                frame: "nearest 1000: _  nearest 10,000: _  nearest 100,000: _"
                options: ["951,000", "950,000", "1,000,000", "952,000"]
                answer: ["951,000", "950,000", "1,000,000"]
              - id: l2-n4
                type: multiple_choice
                text: "The Moon is 384,400 km away. Which is the most sensible rounding?"
                options: ["about 400,000 km", "about 380 km", "about 384,400 km"]
                answer: "about 400,000 km"
              - id: l2-n5
                type: true_false
                text: "Is it true? 4999 rounded to the nearest 10,000 is 0."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: compare
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "90,099 _ 90,909"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c2
            part: compare
            type: ordering
            text: "Put the numbers in descending order, greatest first."
            options: ["606,060", "660,600", "66,060", "600,666"]
            slot_count: 4
            answer: ["660,600", "606,060", "600,666", "66,060"]
          - id: l2-c3
            part: round
            type: multiple_choice
            text: "Round 237,500 to the nearest 10,000."
            options: ["230,000", "240,000", "238,000"]
            answer: "240,000"
          - id: l2-c4
            part: round
            type: text_input
            text: "Round 550,001 to the nearest 100,000."
            answer: "600000"
          - id: l2-c5
            part: sensible
            type: multiple_choice
            text: "A house costs £249,500. Which is the most sensible rounding?"
            options: ["about £250,000", "about £200,000", "about £249,500"]
            answer: "about £250,000"
          - id: l2-c6
            part: number-line
            type: point_on_line
            text: "Tap 700,000 on the number line."
            say: "Tap seven hundred thousand on the number line."
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends }
            answer: 700000
          - id: l2-c7
            part: number-line
            type: multiple_choice
            text: "Where is the arrow pointing?"
            show: { drawn: number-line, from: 0, to: 100000, step: 10000, labels: ends, mark: 40000 }
            options: ["4000", "40,000", "400,000"]
            answer: "40,000"
          - id: l2-c8
            part: number-line
            type: point_on_line
            text: "Tap 360,000 on the number line."
            say: "Tap three hundred and sixty thousand on the number line."
            show: { drawn: number-line, from: 300000, to: 400000, step: 10000, labels: ends }
            answer: 360000
          - id: l2-c9
            part: number-line
            type: multiple_choice
            text: "Where is the arrow pointing?"
            show: { drawn: number-line, from: 500000, to: 600000, step: 10000, labels: ends, mark: 530000 }
            options: ["530,000", "503,000", "53,000"]
            answer: "530,000"
          - id: l2-c10
            part: number-line
            type: true_false
            text: "Is it true? The arrow points to 900,000."
            say: "Is it true? The arrow points to nine hundred thousand."
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 900000 }
            answer: true
          - id: l2-c11
            part: compare
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "476,302 _ 476,230"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c12
            part: compare
            type: multiple_choice
            text: "Three cities have 245,800, 254,080 and 245,080 people. Which is the smallest population?"
            say: "Three cities have two hundred and forty-five thousand, eight hundred, two hundred and fifty-four thousand and eighty, and two hundred and forty-five thousand and eighty people. Which is the smallest population?"
            options: ["245,800", "254,080", "245,080"]
            answer: "245,080"
          - id: l2-c13
            part: compare
            type: true_false
            text: "Is it true? 89,999 > 100,000"
            say: "Is it true? Eighty-nine thousand, nine hundred and ninety-nine is greater than one hundred thousand."
            answer: false
          - id: l2-c14
            part: round
            type: text_input
            text: "Round 483,612 to the nearest 10,000."
            say: "Round four hundred and eighty-three thousand, six hundred and twelve to the nearest ten thousand."
            answer: "480000"
          - id: l2-c15
            part: round
            type: multiple_choice
            text: "Which number rounds to 300,000 to the nearest 100,000?"
            say: "Which number rounds to three hundred thousand to the nearest hundred thousand?"
            options: ["349,999", "350,000", "249,999"]
            answer: "349,999"
          - id: l2-c16
            part: round
            type: true_false
            text: "Is it true? 615,370 rounded to the nearest 100 is 615,300."
            say: "Is it true? Six hundred and fifteen thousand, three hundred and seventy rounded to the nearest hundred is six hundred and fifteen thousand, three hundred."
            answer: false
          - id: l2-c17
            part: sensible
            type: multiple_choice
            text: "A race has 41,276 runners. The newspaper says about 40,000 runners. To which place did it round?"
            say: "A race has forty-one thousand, two hundred and seventy-six runners. The newspaper says about forty thousand runners. To which place did it round?"
            options: ["the nearest 10,000", "the nearest 1000", "the nearest 100"]
            answer: "the nearest 10,000"
          - id: l2-c18
            part: sensible
            type: multiple_choice
            text: "A bike costs £348.99. Which is the most sensible rounding?"
            options: ["about £350", "about £300,000", "about £3"]
            answer: "about £350"
          - id: l2-c19
            part: sensible
            type: true_false
            text: "A stadium holds 60,318 people. Is it sensible to say it holds about 100,000 people?"
            say: "A stadium holds sixty thousand, three hundred and eighteen people. Is it sensible to say it holds about one hundred thousand people?"
            answer: false
          - id: l2-c20
            part: sensible
            type: multiple_choice
            text: "A town has 18,456 people. Which rounding is closest to the real number?"
            say: "A town has eighteen thousand, four hundred and fifty-six people. Which rounding is closest to the real number?"
            options: ["about 18,000", "about 20,000", "about 10,000"]
            answer: "about 18,000"
