# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.codes
skill: math.patterns.codes
curriculum: en-GB
language: en
title:
  de: Geheimcodes mit Zahlen
  en: Secret number codes
summary: >
  Lesson 1 uses the number code A = 1 to Z = 26 to decode and encode
  words, one number for each letter; lesson 2 adds a rule (add 3 to every
  number, double every number), decodes by working the rule backwards,
  judges whether an invented code works (no two letters may share a
  number), cracks number-lock riddles and ends with the skill check.
  Inventing a whole code of your own and sending it to a friend waits for
  a free-writing task.
metadata:
  year: year-5
  topic: { de: Muster, en: Patterns }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.patterns.number-patterns]
  also_practises: [math.mult-div.core-facts]
  vocabulary: { en: [code, encode, decode, key, rule, inverse, work backwards] }
  forms: [drawn, text, audio]
  drawn: [table]
  facets: []
  parts:
    - { id: decode, what: { de: mit dem Zahlencode entschlüsseln, en: decoding with the number code } }
    - { id: encode, what: { de: mit dem Zahlencode verschlüsseln, en: encoding with the number code } }
    - { id: rule, what: { de: Codes und Zahlenschlösser mit einer Rechenregel lösen, en: solving codes and number locks with a calculation rule } }
    - { id: invent, what: { de: "beurteilen, ob ein erfundener Code funktioniert", en: judging whether an invented code works } }
  misconceptions:
    - id: digits-as-letters
      what: Reads a two-digit number as two letters (12 as A and B instead of L)
      addressed: lesson 1 Learn says each number is one letter; l1-f5 and l1-s5 name the mistake, and the decoding tasks have numbers above 9
    - id: rule-not-reversed
      what: Decodes by using the rule again instead of working it backwards (adds 2 again instead of taking 2 away)
      addressed: lesson 2 Learn turns add into subtract and double into halve; l2-f1, l2-f3, l2-s4 and l2-c3 offer the letters from the wrong direction or from no rule, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der Zahlencode", en: "The number code" }
    goal:
      de: "Knacke Geheimwörter, in denen jeder Buchstabe eine Zahl ist, so wie 3, 1, 20 für cat, und schreib selbst welche."
      en: "Crack secret words where every letter is a number, like 3, 1, 20 for cat, and write your own."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Continue the sequence."
            frame: "4, 8, 12, 16, _, _"
            options: ["20", "24", "18", "22"]
            answer: ["20", "24"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is the rule of the sequence 5, 10, 15, 20?"
            options: ["add 5", "add 10", "times 2"]
            answer: "add 5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A secret message: 8 15 21 19 5\nWhat do you think it says?"
            say: "Here is a secret message: eight, fifteen, twenty-one, nineteen, five. Each number stands for a letter. What do you think it says? Have a guess."
          - text: "The key: A = 1, B = 2 ... Z = 26"
            say: "In this code, each letter of the alphabet has a number. A is one, B is two, and so on up to Z, which is twenty-six. This list is called the key."
            show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
          - text: "8 15 21 19 5\nH O U S E"
            say: "To decode, find each number in the key. Eight is H, fifteen is O, twenty-one is U, nineteen is S, five is E. The word is house. Each number, even a two-digit one, is one letter."
          - text: "B O O K\n2 15 15 11"
            say: "To encode, go the other way: find each letter and write its number. Book is two, fifteen, fifteen, eleven."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Decode: 3 1 20"
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                options: ["CAT", "BAT", "CAP"]
                answer: "CAT"
                hints:
                  - "Find each number in the key."
                  - "3 is C, 1 is A. What is 20?"
                  - "CAT."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Encode the word DOG."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                frame: "D = _, O = _, G = _"
                options: ["4", "15", "7", "14", "6"]
                answer: ["4", "15", "7"]
                hints:
                  - "Find each letter in the key."
                  - "D is in the first row. O starts the third row."
                  - "4, 15, 7."
              - id: l1-f3
                type: text_input
                text: "Decode: 6 9 19 8. Type the word in small letters."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                keyboard: letters
                answer: "fish"
                hints:
                  - "One letter for each number."
                  - "6 is F and 9 is I."
                  - "fish."
              - id: l1-f4
                type: true_false
                text: "Tom writes SUN as 19 21 14. Is he right?"
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                answer: true
                hints:
                  - "Check each letter in the key."
                  - "S is 19, U is 21."
                  - "N is 14. Yes, he is right."
              - id: l1-f5
                type: multiple_choice
                text: "Ella decodes 12 5 7 as A B E G. What went wrong?"
                options: ["She read 12 as two numbers, 1 and 2.", "She used the wrong letter for 5.", "Nothing, it is right."]
                answer: "She read 12 as two numbers, 1 and 2."
                feedback:
                  "Nothing, it is right.": "There are three numbers, so there should be three letters."
                hints:
                  - "How many numbers are there? How many letters did she write?"
                  - "12 is one number, so it is one letter."
                  - "She split 12 into 1 and 2. 12 5 7 is LEG."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Decode: 23 15 12 6"
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                options: ["WOLF", "GOLF", "WOOF"]
                answer: "WOLF"
                hints: ["Check each letter: 12 or 15?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Encode the word TEA."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                frame: "T = _, E = _, A = _"
                options: ["20", "5", "1", "2"]
                answer: ["20", "5", "1"]
                hints: ["T is in the third row."]
              - id: l1-s3
                type: text_input
                text: "Decode: 2 15 15 11. Type the word in small letters."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                keyboard: letters
                answer: "book"
                hints: ["15 is O."]
              - id: l1-s4
                type: true_false
                text: "In the code, A + B + C = 6."
                answer: true
                hints: ["A is 1, B is 2, C is 3."]
              - id: l1-s5
                type: true_false
                text: "Mia reads the number 15 as the letters A and E. Is she right?"
                answer: false
                hints: ["Is 15 one number or two?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Decode: 16 9 26 26 1"
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                options: ["PIZZA", "PIAZA", "BIZZA"]
                answer: "PIZZA"
              - id: l1-n2
                type: fill_in_blank
                text: "Encode the word ZOO."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                frame: "Z = _, O = _, O = _"
                options: ["26", "15", "16", "25"]
                answer: ["26", "15", "15"]
              - id: l1-n3
                type: text_input
                text: "Decode: 19 20 1 18. Type the word in small letters."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                keyboard: letters
                answer: "star"
              - id: l1-n4
                type: true_false
                text: "20 5 1 spells TEN."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Which letter is 20?"
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                options: ["T", "S", "U"]
                answer: "T"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Decode: 18 15 2 15 20. Type the word in small letters."
            show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
            keyboard: letters
            answer: "robot"
          - id: l1-c2
            type: multiple_choice
            text: "Encode the word MILK."
            show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
            options: ["13 9 12 11", "13 9 11 12", "12 9 12 11"]
            answer: "13 9 12 11"
          - id: l1-c3
            type: true_false
            text: "In the code, 26 stands for Z."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Decode: 16 9 7"
            show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
            options: ["PIG", "PIE", "BIG"]
            answer: "PIG"
            option_audio: false
          - id: l1-c5
            type: fill_in_blank
            text: "Encode the word OWL."
            show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
            frame: "O = _, W = _, L = _"
            options: ["15", "23", "12", "22", "13"]
            answer: ["15", "23", "12"]
          - id: l1-c6
            type: text_input
            text: "Decode: 10 1 13. Type the word in small letters."
            show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
            keyboard: letters
            answer: "jam"

  - n: 2
    title: { de: "Codes mit Regel", en: "Codes with a rule" }
    goal:
      de: "Knacke Codes mit einer Regel, indem du rückwärts rechnest, so wie bei der Regel plus 3 einfach minus 3."
      en: "Crack codes with a rule by working backwards, like taking away 3 when the rule was add 3."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Decode: 3 1 11 5. Type the word in small letters."
            show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
            keyboard: letters
            answer: "cake"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Encode the word HAT."
            show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
            options: ["8 1 20", "8 1 19", "9 1 20"]
            answer: "8 1 20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "6 4 23 decodes as F D W. Nonsense! What do you think went wrong?"
            say: "Here is another secret message: six, four, twenty-three. With the key, that is F, D, W. That is nonsense! What do you think the sender did to the numbers? Have a guess."
          - text: "Rule: add 3 to every number.\nC A T → 3 1 20 → 6 4 23"
            say: "A rule makes the code harder to crack. With the rule add three, cat is first three, one, twenty. Add three to every number: six, four, twenty-three."
          - text: "Decode 6 4 23: take away 3\n3 1 20 → C A T"
            say: "To decode, work backwards with the inverse. Add three becomes take away three: three, one, twenty, which is cat. If you added three again, you would get nonsense."
          - text: "Rule: double every number.\n16 2 40 → halve → 8 1 20 → H A T"
            say: "With the rule double every number, decode by halving. Sixteen, two, forty halved is eight, one, twenty: hat."
          - text: "A good code gives every letter its own number."
            say: "When you invent a code, no two letters may share a number. If A and B were both one, nobody could tell which letter you meant."
          - text: "Did you know? Julius Caesar wrote secret messages by moving every letter 3 places along the alphabet."
            say: "Did you know? More than two thousand years ago, the Roman leader Julius Caesar wrote secret messages by moving every letter three places along the alphabet. A became D, and B became E. It is just like the rule add three!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Rule: add 2 to every number. Decode: 10 3 22"
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                options: ["HAT", "LEX", "JCV"]
                answer: "HAT"
                feedback:
                  "LEX": "That adds 2 again. To decode, take 2 away."
                  "JCV": "That ignores the rule. First take 2 from every number."
                hints:
                  - "Work backwards: what undoes add 2?"
                  - "Take 2 from every number: 8, 1, 20."
                  - "HAT."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Rule: double every number. How do you encode ABC?"
                options: ["2 4 6", "1 2 3", "3 4 5"]
                answer: "2 4 6"
                hints:
                  - "First write the numbers for A, B and C."
                  - "A, B, C are 1, 2, 3. Now double each one."
                  - "2 4 6."
              - id: l2-f5
                type: text_input
                text: "Number lock: the code has 3 digits. Each digit is 2 more than the one before. The first digit is 3. What is the code?"
                answer: "357"
                hints:
                  - "Start with 3."
                  - "3, then 3 + 2 = 5, then 5 + 2."
                  - "357."
              - id: l2-f3
                type: multiple_choice
                text: "Rule: add 1 to every number. Decode: 5 16 8"
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                options: ["DOG", "FQI", "EPH"]
                answer: "DOG"
                hints:
                  - "Take 1 from every number."
                  - "4, 15, 7."
                  - "DOG."
              - id: l2-f4
                type: multiple_choice
                text: "Children invent codes. Which code works?"
                options: ["A = 2, B = 4, C = 6, and so on", "A = 1, B = 1, C = 2, D = 2, and so on", "A = 5, B = 5, C = 5, and so on"]
                answer: "A = 2, B = 4, C = 6, and so on"
                hints:
                  - "In a code that works, every letter has its own number."
                  - "In two of the codes, letters share a number."
                  - "The doubling code works."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Rule: double every number. Decode: 8 30 40. Type the word in small letters."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                keyboard: letters
                answer: "dot"
                hints: ["Halve every number first."]
              - id: l2-s2
                type: fill_in_blank
                text: "Rule: add 3 to every number. Encode EGG."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                frame: "E = _, G = _, G = _"
                options: ["8", "10", "5", "7"]
                answer: ["8", "10", "10"]
                hints: ["E is 5 and G is 7. Add 3 to each."]
              - id: l2-s3
                type: true_false
                text: "Max invents a code: A = 1, B = 1, C = 2, D = 2, and so on. It is a good code."
                answer: false
                hints: ["Can you tell A from B?"]
              - id: l2-s4
                type: multiple_choice
                text: "Rule: take 2 from every number. Decode: 24 13 13"
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                options: ["ZOO", "VKK", "XMM"]
                answer: "ZOO"
                hints: ["The inverse of take away 2 is add 2."]
              - id: l2-s5
                type: text_input
                text: "Number lock: the code has 4 digits. Each digit is double the one before. The first digit is 1. What is the code?"
                answer: "1248"
                hints: ["1, then 2, then double again."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Rule: add 1 to every number. Decode: 3 2 5. Type the word in small letters."
                show: { drawn: table, header: false, rows: [["A 1", "B 2", "C 3", "D 4", "E 5", "F 6", "G 7"], ["H 8", "I 9", "J 10", "K 11", "L 12", "M 13", "N 14"], ["O 15", "P 16", "Q 17", "R 18", "S 19", "T 20", "U 21"], ["V 22", "W 23", "X 24", "Y 25", "Z 26", "", ""]] }
                keyboard: letters
                answer: "bad"
