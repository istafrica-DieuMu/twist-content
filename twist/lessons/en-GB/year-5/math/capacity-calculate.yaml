# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.capacity-calculate
skill: math.mass-capacity.calculate-capacity
curriculum: en-GB
language: en
title:
  de: Mit Rauminhalten rechnen
  en: Calculating with capacity
summary: >
  Lesson 1 works out how many glasses a bottle fills (1 l ÷ 200 ml = 1000
  ml ÷ 200 ml = 5), sees that bigger glasses give fewer glasses, compares
  and orders capacities in litres and millilitres and estimates what a
  bucket, a kettle or a bath holds; lesson 2 solves problems with litres:
  juice for a class party, how many bottles to buy, water in a watering
  can or a paddling pool, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Rauminhalte, en: Capacity }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mass-capacity.l-ml, math.mult-div.div-facts]
  also_practises: [math.mass-capacity.l-ml, math.word-problems.multi-step]
  vocabulary: { en: [capacity, litre, millilitre, holds, fill, full, half full, estimate] }
  forms: [text, audio, picture]
  drawn: []
  facets: [units]
  parts:
    - { id: fill, what: { de: wie oft eine Menge in ein Gefäß passt, en: how many times one capacity fills another } }
    - { id: compare, what: { de: Rauminhalte in Litern und Millilitern vergleichen, en: comparing capacities in litres and millilitres } }
    - { id: estimate, what: { de: Rauminhalte schätzen, en: estimating capacities } }
    - { id: stories, what: { de: Sachaufgaben mit Rauminhalten, en: word problems with capacity } }
  misconceptions:
    - id: bigger-number-more
      what: Compares the numbers and not the amounts (900 ml is more than 1.5 l because 900 is bigger)
      addressed: lesson 1 Learn changes litres into millilitres first; l1-f2 (with feedback), l1-s2, l1-n2, l1-c2 and l2-c2 compare litres with millilitres
    - id: bigger-glass-more-glasses
      what: Thinks bigger glasses give more glasses from the same bottle
      addressed: lesson 1 Learn fills one bottle with 200 ml and 250 ml glasses; l1-f4 (with feedback), l1-s4, l1-c3 and l2-c4 ask which way round it goes
    - id: rounds-down-bottles
      what: Buys too few bottles because the division has a remainder (5 l from 1.5 l bottles is 3 bottles)
      addressed: lesson 2 Learn needs a fourth bottle for 7.5 l; l2-f2 (with feedback) and l2-n2 ask how many bottles are needed
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wie viele Gläser?", en: "How many glasses?" }
    goal:
      de: "Finde heraus, wie viele Gläser eine Flasche füllt, so wie 5 Gläser mit je 200 Millilitern aus 1 Liter."
      en: "Work out how many glasses a bottle fills, like 5 glasses of 200 millilitres from 1 litre."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1 l = _ ml"
            say: "How many millilitres are in one litre?"
            options: ["1000", "100", "10"]
            answer: "1000"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "36 ÷ 4 = _"
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A 1 litre bottle of squash. Each glass holds 200 ml. How many glasses can you fill?"
            say: "A bottle holds one litre of squash. Each glass holds two hundred millilitres. How many glasses do you think you can fill? Have a guess."
            show: { object: bottle }
          - text: "A 1 litre bottle of squash. Each glass holds 200 ml.\n1 l = 1000 ml\n1000 ml ÷ 200 ml = 5 glasses"
            say: "Change the litre into millilitres: one thousand. Then divide by two hundred. You can fill five glasses."
            show: { object: bottle }
          - text: "Glasses of 250 ml:\n1000 ml ÷ 250 ml = 4 glasses"
            say: "With bigger glasses of two hundred and fifty millilitres, the same bottle fills only four. Bigger glasses means fewer glasses."
            show: { object: glass }
          - text: "2 l or 500 ml?\n2 l = 2000 ml, so 2 l is more."
            say: "To compare capacities, put them in the same unit. Five hundred looks bigger than two, but two litres is two thousand millilitres. So two litres is more."
          - text: "About how much?\nmug: 300 ml   bucket: 10 l   bath: 150 l"
            say: "It helps to know a few capacities to estimate with. A mug holds about three hundred millilitres, a bucket about ten litres, and a bath about one hundred and fifty litres."
            show: { object: bucket }
          - text: "Did you know? In the UK, milk is still sold in pints. A pint is about 568 ml."
            say: "Did you know? In the UK, milk is often still sold in pints, an old unit. One pint is about five hundred and sixty-eight millilitres, a bit more than half a litre. So a four pint bottle of milk holds about two and a quarter litres!"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A 1 litre bottle of water fills glasses of 250 ml. How many glasses?"
                show: { object: bottle }
                options: ["4", "250", "5"]
                answer: "4"
                feedback:
                  "250": "250 ml is how much one glass holds. How many 250s fit into 1000?"
                hints:
                  - "Change 1 litre into millilitres."
                  - "1000 ml ÷ 250 ml. Two glasses make 500 ml."
                  - "4 glasses."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which holds more: 1.5 l or 900 ml?"
                options: ["1.5 l", "900 ml", "They are the same."]
                answer: "1.5 l"
                keep_order: true
                feedback:
                  "900 ml": "900 is a bigger number than 1.5, but the units are different. Change 1.5 l into millilitres."
                hints:
                  - "Put both in millilitres."
                  - "1.5 l = 1500 ml."
                  - "1500 ml is more than 900 ml."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which holds about 10 litres?"
                options:
                  - { object: bucket }
                  - { object: cup }
                  - { object: bath }
                answer: bucket
                hints:
                  - "10 litres is ten 1 litre bottles of water."
                  - "A cup holds much less. A bath holds much more."
                  - "The bucket."
              - id: l1-f3
                type: multiple_choice
                text: "A jug holds 2 l of juice. Each cup holds 250 ml. How many cups can be filled?"
                show: { object: jug }
                options: ["8", "4", "6"]
                answer: "8"
                hints:
                  - "Change 2 l into millilitres."
                  - "One litre fills 4 cups of 250 ml."
                  - "2 litres fill 8 cups."
              - id: l1-f4
                type: multiple_choice
                text: "Eva fills cups of 200 ml from a 1 l bottle. Sam fills glasses of 250 ml from the same size bottle. Who fills more cups or glasses?"
                options: ["Eva", "Sam", "Both the same"]
                answer: "Eva"
                feedback:
                  "Sam": "Sam's glasses are bigger, so the bottle is empty sooner. Bigger glasses means fewer of them."
                hints:
                  - "Work out each one: 1000 ml ÷ 200 ml and 1000 ml ÷ 250 ml."
                  - "Eva fills 5 cups. Sam fills 4 glasses."
                  - "Eva fills more."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A 1.5 l bottle of lemonade fills glasses of 300 ml. How many glasses?"
                options: ["5", "3", "50"]
                answer: "5"
                hints: ["1500 ml ÷ 300 ml."]
              - id: l1-s2
                type: ordering
                text: "Put the capacities in order, smallest first."
                options: ["0.5 l", "750 ml", "1 l", "300 ml"]
                slot_count: 4
                answer: ["300 ml", "0.5 l", "750 ml", "1 l"]
                hints: ["Change them all into millilitres: 500 ml, 750 ml, 1000 ml, 300 ml."]
              - id: l1-s3
                type: true_false
                text: "A 2 l bottle fills 10 glasses of 200 ml. Is that true?"
                answer: true
                hints: ["2000 ml ÷ 200 ml."]
              - id: l1-s4
                type: multiple_choice
                text: "A bottle fills 6 small glasses. With bigger glasses the same bottle fills ..."
                options: ["fewer than 6", "more than 6", "exactly 6"]
                answer: "fewer than 6"
                hints: ["Each big glass takes more of the bottle."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which holds about 150 litres?"
                options:
                  - { object: bath }
                  - { object: watering-can }
                  - { object: kettle }
                answer: bath
                hints: ["150 litres is fifteen full buckets."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "A 3 l bottle of water fills cups of 250 ml. How many cups?"
                answer: "12"
              - id: l1-n2
                type: multiple_choice
                text: "Which is more: 0.75 l or 800 ml?"
                options: ["0.75 l", "800 ml", "They are the same."]
                answer: "800 ml"
                keep_order: true
              - id: l1-n3
                type: true_false
                text: "A kettle holds about 15 l. Is that true?"
                show: { object: kettle }
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "A 1 l carton of milk fills 4 glasses exactly. How much does each glass hold?"
                options: ["250 ml", "4 ml", "400 ml"]
                answer: "250 ml"
              - id: l1-n5
                type: multiple_choice
                text: "About how much does a teaspoon hold?"
                options: ["5 ml", "5 l", "500 ml"]
                answer: "5 ml"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A 1.2 l bottle fills glasses of 200 ml. How many glasses?"
            options: ["6", "60", "12"]
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "Which holds more: 2.5 l or 2300 ml?"
            options: ["2.5 l", "2300 ml", "They are the same."]
            answer: "2.5 l"
            keep_order: true
          - id: l1-c3
            type: true_false
            text: "Glasses of 330 ml fill more glasses from a bottle than glasses of 250 ml. Is that true?"
            answer: false
          - id: l1-c4
            type: text_input
            text: "A 1.5 l bottle of water fills glasses of 250 ml. How many glasses?"
            answer: "6"
          - id: l1-c5
            type: ordering
            text: "Put the capacities in order, largest first."
            options: ["1.25 l", "900 ml", "2 l", "1500 ml"]
            slot_count: 4
            answer: ["2 l", "1500 ml", "1.25 l", "900 ml"]
          - id: l1-c6
            type: image_multiple_choice
            text: "Which holds about 250 ml?"
            options:
              - { object: cup }
              - { object: bucket }
              - { object: bath }
            answer: cup

  - n: 2
    title: { de: "Sachaufgaben mit Litern", en: "Problems with litres" }
    goal:
      de: "Löse Aufgaben mit Litern, zum Beispiel wie viele Flaschen Saft die Klasse für ihr Fest kaufen muss."
      en: "Solve problems with litres, like how many bottles of juice the class must buy for a party."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "1.5 l = _"
            options: ["1500 ml", "1005 ml", "150 ml"]
            answer: "1500 ml"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many cups of 200 ml does a 1 l jug fill?"
            options: ["5", "2", "200"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Class party: 30 children each drink 250 ml of juice. How many 2 l bottles should the class buy?"
            say: "Year 5 is having a party. Thirty children each drink two hundred and fifty millilitres of juice. The juice comes in two litre bottles. How many bottles do you think the class should buy? Have a guess."
          - text: "Class party: 30 children each drink 250 ml of juice.\n30 × 250 ml = 7500 ml = 7.5 l"
            say: "First the juice. Thirty times two hundred and fifty is seven thousand five hundred millilitres. That is seven and a half litres."
          - text: "Juice comes in 2 l bottles.\n3 bottles = 6 l: not enough.\n4 bottles = 8 l: enough."
            say: "The juice comes in two litre bottles. Three bottles hold only six litres, which is not enough. So the class must buy four bottles, even though some juice will be left over."
          - text: "A watering can holds 5 l.\nGrandad pours out 1.5 l, then 2 l.\n5 l − 1.5 l − 2 l = 1.5 l left"
            say: "A watering can holds five litres. Grandad waters one pot with one and a half litres and another with two litres. Five take away one and a half take away two leaves one and a half litres in the can. Check: he used three and a half litres, which is less than five, so the answer makes sense."
            show: { object: watering-can }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "24 children each have a 200 ml carton of milk. How much milk is that altogether?"
                options: ["4.8 l", "48 l", "2.4 l"]
                answer: "4.8 l"
                feedback:
                  "48 l": "24 × 200 ml is 4800 ml. 1000 ml is one litre, so 4800 ml is 4.8 l."
                hints:
                  - "Work in millilitres first."
                  - "24 × 200 ml = 4800 ml."
                  - "4800 ml = 4.8 l."
                difficulty: easy
              - id: l2-f4
                type: true_false
                text: "A shower uses about 9 l of water a minute. Leo showers for 5 minutes. He says he used about 45 l. Is he right?"
                answer: true
                hints:
                  - "Multiply the water for one minute by the minutes."
                  - "5 × 9 l."
                  - "Yes, 45 l."
              - id: l2-f2
                type: multiple_choice
                text: "Lemonade comes in 1.5 l bottles. The class needs 5 l. How many bottles must they buy?"
                options: ["4", "3", "5"]
                answer: "4"
                feedback:
                  "3": "3 bottles hold only 4.5 l. That is not quite enough."
                hints:
                  - "Count up in 1.5 l until you reach 5 l."
                  - "1.5 l, 3 l, 4.5 l, 6 l."
                  - "4 bottles."
              - id: l2-f3
                type: multiple_choice
                text: "A watering can holds 6 l. Mum pours out 2.5 l, then 1.5 l. How much water is left?"
                show: { object: watering-can }
                options: ["2 l", "4 l", "10 l"]
                answer: "2 l"
                feedback:
                  "4 l": "4 l is what Mum poured out. The question asks what is left."
                hints:
                  - "Work out how much Mum poured out altogether."
                  - "2.5 l + 1.5 l = 4 l."
                  - "6 l − 4 l = 2 l."
              - id: l2-f5
                type: fill_in_blank
                text: "A fish tank holds 60 l. Ben fills it with a 5 l bucket. How many buckets does he need?"
                frame: "60 l ÷ 5 l = _ buckets"
                options: ["12", "300", "55"]
                answer: ["12"]
                hints:
                  - "How many 5s make 60?"
                  - "10 buckets are 50 l, and 2 more make 60 l."
                  - "12 buckets."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A tap drips 50 ml of water a minute. How much does it drip in an hour?"
                options: ["3 l", "300 ml", "30 l"]
                answer: "3 l"
                hints: ["An hour is 60 minutes. 60 × 50 ml = 3000 ml."]
              - id: l2-s2
                type: multiple_choice
                text: "A bottle of olive oil holds 750 ml. How much do 4 bottles hold?"
                options: ["3 l", "2.8 l", "30 l"]
                answer: "3 l"
                hints: ["2 bottles hold 1500 ml."]
              - id: l2-s3
                type: true_false
                text: "Dad pours 6 glasses of 300 ml from a 2 l jug. Is there 200 ml left in the jug?"
                answer: true
                hints: ["6 × 300 ml = 1800 ml. The jug held 2000 ml."]
              - id: l2-s4
                type: multiple_choice
                text: "A paddling pool holds 400 l. It is half full. How much more water does it need to be full?"
                options: ["200 l", "400 l", "100 l"]
                answer: "200 l"
                hints: ["Half of 400 l is in already."]
              - id: l2-s5
                type: text_input
                text: "Soup for 4 bowls needs 1.2 l of stock. How many millilitres is that for 1 bowl?"
                answer: "300"
                hints: ["1200 ml ÷ 4."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "32 children each drink 250 ml of water at sports day. How many litres is that?"
                options: ["8 l", "80 l", "0.8 l"]
                answer: "8 l"
              - id: l2-n2
                type: multiple_choice
                text: "Water comes in 2 l bottles. The football team needs 9 l. How many bottles must they take?"
                options: ["5", "4", "9"]
                answer: "5"
              - id: l2-n3
                type: text_input
                text: "A tin of paint holds 5 l. Dad uses 3.25 l. How many millilitres are left?"
                answer: "1750"
              - id: l2-n4
                type: true_false
                text: "Freya's water bottle holds 500 ml. She drinks 4 full bottles in a day. She says she drank 2 l. Is she right?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Which makes sense? A washing-up bowl holds about ..."
                options: ["8 l", "8 ml", "800 l"]
                answer: "8 l"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: fill
            type: multiple_choice
            text: "A 1.8 l jug fills glasses of 300 ml. How many glasses?"
            options: ["6", "5", "60"]
            answer: "6"
          - id: l2-c2
            part: compare
            type: multiple_choice
            text: "Which holds the most?"
            options: ["1.2 l", "950 ml", "1100 ml"]
            answer: "1.2 l"
          - id: l2-c3
            part: stories
            type: multiple_choice
            text: "20 children each drink 300 ml of juice. How many litres is that?"
            options: ["6 l", "60 l", "0.6 l"]
            answer: "6 l"
          - id: l2-c4
            part: fill
            type: multiple_choice
            text: "Mugs hold more than cups. A flask fills 8 cups. How many mugs can it fill?"
            options: ["fewer than 8", "more than 8", "8"]
            answer: "fewer than 8"
          - id: l2-c5
            part: stories
            type: text_input
            text: "A watering can holds 4 l. Gran pours out 2.5 l. How many millilitres are left?"
            answer: "1500"
          - id: l2-c6
            part: fill
            type: text_input
            text: "A 2.4 l bottle of lemonade fills glasses of 300 ml. How many glasses?"
            answer: "8"
          - id: l2-c7
            part: fill
            type: true_false
            text: "A 750 ml bottle fills exactly 3 glasses of 250 ml. Is that true?"
            answer: true
          - id: l2-c8
            part: fill
            type: multiple_choice
            text: "A 2 l jug of water fills cups of 400 ml. How many cups?"
            show: { object: jug }
            options: ["5", "8", "50"]
            answer: "5"
          - id: l2-c9
            part: compare
            type: multiple_choice
            text: "Which is more: 0.4 l or 350 ml?"
            options: ["0.4 l", "350 ml", "They are the same."]
            answer: "0.4 l"
            keep_order: true
          - id: l2-c10
            part: compare
            type: ordering
            text: "Put the capacities in order, smallest first."
            options: ["2.2 l", "1800 ml", "0.9 l", "2050 ml"]
            slot_count: 4
            answer: ["0.9 l", "1800 ml", "2050 ml", "2.2 l"]
          - id: l2-c11
            part: compare
            type: true_false
            text: "Is it true? 0.6 l is the same as 60 ml."
            answer: false
          - id: l2-c12
            part: compare
            type: multiple_choice
            text: "Which holds the least?"
            options: ["0.3 l", "250 ml", "0.5 l"]
            answer: "250 ml"
          - id: l2-c13
            part: estimate
            type: image_multiple_choice
            text: "Which holds about 1.5 litres?"
            options:
              - { object: kettle }
              - { object: spoon }
              - { object: bath }
            answer: kettle
          - id: l2-c14
            part: estimate
            type: multiple_choice
            text: "About how much does a full watering can hold?"
            show: { object: watering-can }
            options: ["about 5 l", "about 5 ml", "about 500 l"]
            answer: "about 5 l"
          - id: l2-c15
            part: estimate
            type: true_false
            text: "A glass of milk holds about 2 l. Is that true?"
            show: { object: glass }
            answer: false
          - id: l2-c16
            part: estimate
            type: multiple_choice
            text: "A bucket holds about 10 l. A bath holds about 150 l. About how many buckets of water fill the bath?"
            options: ["15", "150", "5"]
            answer: "15"
          - id: l2-c17
            part: estimate
            type: multiple_choice
            text: "Which makes sense? A paddling pool holds about ..."
            options: ["300 l", "3 l", "30 ml"]
            answer: "300 l"
          - id: l2-c18
            part: stories
            type: multiple_choice
            text: "Juice comes in 750 ml cartons. A punch recipe needs 4 l of juice. How many cartons must Dad buy?"
            options: ["6", "5", "4"]
            answer: "6"
          - id: l2-c19
            part: stories
            type: multiple_choice
            text: "A bath holds 120 l. The taps fill it with 8 l of water a minute. How long does it take to fill?"
            options: ["15 minutes", "12 minutes", "112 minutes"]
            answer: "15 minutes"
          - id: l2-c20
            part: stories
            type: text_input
            text: "The school kitchen has 6 l of milk. Each child gets a 200 ml glass. How many children get a glass?"
            answer: "30"
