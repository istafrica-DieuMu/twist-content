# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.reflect-translate
skill: math.coordinates.reflect-translate
curriculum: en-GB
language: en
title:
  de: Spiegeln und Verschieben
  en: Reflect and translate
summary: >
  Where a shape ends up after a reflection in a mirror line that goes up
  and down or across, or after a translation, on a coordinate grid in the
  first quadrant, and that the shape itself does not change. Lesson 1
  reflects points and shapes and counts squares to the mirror line;
  lesson 2 translates and describes translations, tells a reflection from
  a translation, and ends with the skill check. In every stage and both
  checks the child also taps where a reflected or translated point lands
  (point_on_grid).
metadata:
  year: year-5
  topic: { de: Koordinaten, en: Coordinates }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.coordinates.translate, math.symmetry.complete]
  also_practises: [math.coordinates.translate]
  vocabulary: { en: [reflect, reflection, mirror line, image, translate, translation, coordinates, x-coordinate, y-coordinate, position, left, right, up, down] }
  forms: [drawn, text, audio]
  drawn: [coordinates]
  facets: []
  misconceptions:
    - id: wrong-coordinate
      what: Changes the y-coordinate when reflecting in a mirror line that goes up and down (or x for one that goes across)
      addressed: lesson 1 Learn shows which coordinate changes for each line; l1-f1 has feedback, l1-s5 asks it, l1-c3 checks it
    - id: wrong-distance
      what: Puts the image the wrong number of squares from the mirror line
      addressed: lesson 1 Learn counts squares to the line; l1-f3, l1-n4 and l2-c1 offer an image one square too far, l1-n5 asks for the distance
    - id: swaps-directions
      what: Swaps right and up when translating (moves 3 up and 2 right for 3 right and 2 up)
      addressed: lesson 2 Learn says right and left change x, up and down change y; l2-f1 has feedback, l2-f2 and l2-s3 offer the swap, and the taps in l2-f3, l2-s1 and l2-c2 have feedback on it
    - id: shape-changes
      what: Thinks a reflected or translated shape changes size or angles, or that a translation flips it
      addressed: lesson 1 Learn and lesson 2 Learn say the shape stays the same; l1-f4, l1-n3, l2-s4, l2-s5, l2-n4 and l2-c5 ask it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Spiegeln an einer Achse, en: Reflecting in a mirror line }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Point A at (2, 3) moves 3 right and 1 up. Where is it now?"
            show: { drawn: coordinates, quadrants: 1, max: 10, points: [[2, 3, A]] }
            options: ["(5, 4)", "(3, 6)", "(5, 2)"]
            answer: "(5, 4)"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Point B is 2 squares to the left of the red mirror line. Where is its reflection?"
            show: { drawn: coordinates, quadrants: 1, max: 10, points: [[3, 4, B]], mirror: { axis: y, at: 5 } }
            options: ["2 squares to the right of the line", "2 squares to the left of the line", "4 squares to the right of the line"]
            answer: "2 squares to the right of the line"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Reflection in a mirror line that goes up and down"
            say: "The purple triangle is reflected in the red mirror line. Each corner moves straight across the line and lands the same distance away on the other side. The corner at one, two is four squares to the left of the line, so its image at nine, two is four squares to the right."
            show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 2], [3, 2], [1, 5]], moved: [[9, 2], [7, 2], [9, 5]], mirror: { axis: y, at: 5 } }
          - text: "A (2, 7) → (2, 3)\nMirror line across: x stays, y changes."
            say: "Now the mirror line goes across. Point A at two, seven is two squares above the line, so its image is two squares below it, at two, three. With a mirror line that goes across, the x-coordinate stays the same and the y-coordinate changes. With a line that goes up and down, it is the other way round."
            show: { drawn: coordinates, quadrants: 1, max: 10, points: [[2, 7, A], [2, 3, "A′"]], mirror: { axis: x, at: 5 } }
          - text: "The image is the same shape and the same size.\nOnly its position changes, and it is flipped over."
            say: "A reflection never changes the shape. The sides stay the same length and the angles stay the same. The image is in a new position, and it is flipped over, like your face in a mirror."
            show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 6], [4, 6], [1, 8]], moved: [[1, 4], [4, 4], [1, 2]], mirror: { axis: x, at: 5 } }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_grid
                text: "A at (2, 6) is reflected in the red mirror line. Tap where its image goes."
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[2, 6, A]], mirror: { axis: y, at: 4 } }
                answer: [6, 6]
                feedback:
                  "2,2": "This mirror line goes up and down, so the point moves left or right. The y-coordinate stays 6."
                  "8,6": "That is 4 squares from the line. A is only 2 squares from it, so its image is 2 squares away on the other side."
                hints:
                  - "How far is A from the mirror line?"
                  - "A is 2 squares to the left of the line, so its image is 2 squares to the right of it."
                  - "The line is at 4, and 4 + 2 = 6. Tap (6, 6)."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "B at (7, 8) is reflected in the red mirror line. Where is its image?"
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[7, 8, B]], mirror: { axis: x, at: 5 } }
                options: ["(7, 2)", "(3, 8)", "(7, 3)"]
                answer: "(7, 2)"
                hints:
                  - "This mirror line goes across, so the point moves up or down."
                  - "B is 3 squares above the line. Its image is 3 squares below it."
                  - "5 − 3 = 2. The image is at (7, 2)."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which grid shows the reflection of the purple triangle in the mirror line?"
                options:
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 1], [3, 1], [1, 4]], moved: [[7, 1], [5, 1], [7, 4]], mirror: { axis: y, at: 4 }, key: reflected }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 1], [3, 1], [1, 4]], moved: [[5, 1], [7, 1], [5, 4]], mirror: { axis: y, at: 4 }, key: not-flipped }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 1], [3, 1], [1, 4]], moved: [[8, 1], [6, 1], [8, 4]], mirror: { axis: y, at: 4 }, key: too-far }
                answer: reflected
                hints:
                  - "Check each corner. It must be the same distance from the line on the other side."
                  - "The corner at (1, 1) is 3 squares left of the line, so its image is 3 squares right, at (7, 1)."
                  - "The right image has corners at (7, 1), (5, 1) and (7, 4). It is flipped over."
              - id: l1-f4
                type: true_false
                text: "Is it true? After a reflection, the shape has the same size and the same angles."
                answer: true
                hints:
                  - "Think of your face in a mirror. Is it bigger or smaller?"
                  - "Every corner moves, but the sides between them stay the same length."
                  - "Yes. Only the position changes, and the shape is flipped."
              - id: l1-f5
                type: multiple_choice
                text: "The corner at (2, 9) is reflected in the red mirror line. Where is its image?"
                show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 6], [4, 6], [4, 9], [2, 9]], mirror: { axis: x, at: 5 } }
                options: ["(2, 1)", "(2, 5)", "(9, 2)"]
                answer: "(2, 1)"
                hints:
                  - "The mirror line goes across, so x stays 2."
                  - "The corner is 4 squares above the line, so the image is 4 squares below it."
                  - "5 − 4 = 1. The image is at (2, 1)."

          - support: some
            tasks:
              - id: l1-s1
                type: point_on_grid
                text: "C at (3, 4) is reflected in the red mirror line. Tap where its image goes."
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[3, 4, C]], mirror: { axis: y, at: 6 } }
                answer: [9, 4]
                feedback:
                  "3,8": "This mirror line goes up and down, so the point moves left or right. The y-coordinate stays 4."
                  "6,4": "That is on the mirror line. The image is as far from the line as C is, on the other side."
                hints: ["C is 3 squares to the left of the line."]
              - id: l1-s2
                type: multiple_choice
                text: "D at (5, 7) is reflected in the red mirror line. Where is its image?"
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[5, 7, D]], mirror: { axis: x, at: 4 } }
                options: ["(5, 1)", "(3, 7)", "(5, 4)"]
                answer: "(5, 1)"
                hints: ["D is 3 squares above the line."]
              - id: l1-s3
                type: true_false
                text: "E is on the mirror line. Is it true that its image is in the same place?"
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[5, 3, E]], mirror: { axis: y, at: 5 } }
                answer: true
                hints: ["E is 0 squares from the line."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Which grid shows the reflection of the purple triangle in the mirror line?"
                options:
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 6], [5, 6], [2, 8]], moved: [[2, 4], [5, 4], [2, 2]], mirror: { axis: x, at: 5 }, key: reflected }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 6], [5, 6], [2, 8]], moved: [[2, 2], [5, 2], [2, 4]], mirror: { axis: x, at: 5 }, key: not-flipped }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 6], [5, 6], [2, 8]], moved: [[8, 6], [5, 6], [8, 8]], mirror: { axis: x, at: 5 }, key: other-line }
                answer: reflected
                hints: ["The corner at (2, 8) is 3 squares above the line, so its image is 3 squares below it."]
              - id: l1-s5
                type: multiple_choice
                text: "A point is reflected in a mirror line that goes up and down. Which coordinate changes?"
                options: ["the x-coordinate", "the y-coordinate", "both coordinates"]
                answer: "the x-coordinate"
                hints: ["The point moves left or right, straight across the line."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "F at (1, 8) is reflected in the red mirror line. Where is its image?"
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[1, 8, F]], mirror: { axis: y, at: 5 } }
                options: ["(9, 8)", "(1, 2)", "(8, 8)"]
                answer: "(9, 8)"
              - id: l1-n2
                type: point_on_grid
                text: "G at (4, 9) is reflected in the red mirror line. Tap where its image goes."
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[4, 9, G]], mirror: { axis: x, at: 6 } }
                answer: [4, 3]
                feedback:
                  "4,2": "That is 4 squares below the line. G is 3 squares above it, so its image is 3 squares below."
                  "8,9": "This mirror line goes across, so the point moves up or down. The x-coordinate stays 4."
              - id: l1-n3
                type: true_false
                text: "Is it true? A reflected shape is a different size from the shape it came from."
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Which grid shows the reflection of the purple triangle in the mirror line?"
                options:
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 2], [4, 2], [4, 6]], moved: [[8, 2], [6, 2], [6, 6]], mirror: { axis: y, at: 5 }, key: reflected }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 2], [4, 2], [4, 6]], moved: [[6, 2], [8, 2], [8, 6]], mirror: { axis: y, at: 5 }, key: not-flipped }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 2], [4, 2], [4, 6]], moved: [[9, 2], [7, 2], [7, 6]], mirror: { axis: y, at: 5 }, key: too-far }
                answer: reflected
              - id: l1-n5
                type: text_input
                text: "H at (3, 5) is reflected in the red mirror line. Its image is at (7, 5). How many squares is H from the mirror line?"
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[3, 5, H], [7, 5, "H′"]], mirror: { axis: y, at: 5 } }
                answer: "2"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: point_on_grid
            text: "J at (1, 6) is reflected in the red mirror line. Tap where its image goes."
            show: { drawn: coordinates, quadrants: 1, max: 10, points: [[1, 6, J]], mirror: { axis: y, at: 3 } }
            answer: [5, 6]
            feedback:
              "6,6": "That is 3 squares from the line. J is 2 squares from it, so its image is 2 squares away on the other side."
              "1,0": "This mirror line goes up and down, so the point moves left or right. The y-coordinate stays 6."
          - id: l1-c2
            type: multiple_choice
            text: "K at (6, 5) is reflected in the red mirror line. Where is its image?"
            show: { drawn: coordinates, quadrants: 1, max: 10, points: [[6, 5, K]], mirror: { axis: x, at: 3 } }
            options: ["(6, 1)", "(0, 5)", "(6, 2)"]
            answer: "(6, 1)"
          - id: l1-c3
            type: true_false
            text: "Is it true? A point reflected in a mirror line that goes across keeps its x-coordinate."
            answer: true

  - n: 2
    title: { de: Verschieben und vergleichen, en: Translating and comparing }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A at (1, 3) is reflected in the red mirror line. Where is its image?"
            show: { drawn: coordinates, quadrants: 1, max: 10, points: [[1, 3, A]], mirror: { axis: y, at: 4 } }
            options: ["(7, 3)", "(1, 5)", "(6, 3)"]
            answer: "(7, 3)"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "B at (3, 6) is reflected in the red mirror line. Where is its image?"
            show: { drawn: coordinates, quadrants: 1, max: 10, points: [[3, 6, B]], mirror: { axis: x, at: 5 } }
            options: ["(3, 4)", "(3, 3)", "(7, 6)"]
            answer: "(3, 4)"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Translation: 4 right, 3 down"
            say: "In a translation, the shape slides. Every corner moves the same way: here four squares right and three squares down. The corner at one, six moves to five, three."
            show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 6], [3, 6], [1, 9]], moved: [[5, 3], [7, 3], [5, 6]] }
          - text: "(6, 7) → 3 left, 2 up → (3, 9)\nRight or left changes x. Up or down changes y."
            say: "Right and left change the x-coordinate: add for right, take away for left. Up and down change the y-coordinate: add for up, take away for down. Six, seven moved three left and two up is three, nine."
          - text: "Reflection or translation: same size, same sides, same angles.\nA translation keeps the shape facing the same way.\nA reflection flips it over."
            say: "Reflection or translation, the shape itself never changes. The sides and the angles stay the same. A translation keeps the shape facing the same way. A reflection flips it over. That is how you tell them apart."
            show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 1], [4, 1], [1, 3]], moved: [[9, 1], [6, 1], [9, 3]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The triangle is translated 3 right and 2 up. Where does the corner at (1, 1) move to?"
                show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 1], [3, 1], [1, 3]] }
                options: ["(4, 3)", "(3, 4)", "(4, 1)"]
                answer: "(4, 3)"
                feedback:
                  "(3, 4)": "That moves 2 right and 3 up. Right changes x: 1 + 3 = 4. Up changes y: 1 + 2 = 3."
                hints:
                  - "Right changes the x-coordinate. Up changes the y-coordinate."
                  - "x: 1 + 3. y: 1 + 2."
                  - "The corner moves to (4, 3)."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The purple triangle is translated to the green one. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 2], [3, 2], [1, 4]], moved: [[6, 3], [8, 3], [6, 5]] }
                options: ["5 right, 1 up", "1 right, 5 up", "5 right, 3 up"]
                answer: "5 right, 1 up"
                hints:
                  - "Pick one corner and find where it went."
                  - "The corner at (1, 2) moves to (6, 3). How far right? How far up?"
                  - "6 − 1 = 5 right, 3 − 2 = 1 up."
              - id: l2-f3
                type: point_on_grid
                text: "Point P at (8, 7) is translated 5 left and 4 down. Tap where it lands."
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[8, 7, P]] }
                answer: [3, 3]
                feedback:
                  "4,2": "That is 4 left and 5 down. Left changes x: 8 − 5 = 3. Down changes y: 7 − 4 = 3."
                hints:
                  - "Left and down mean take away."
                  - "x: 8 − 5. y: 7 − 4."
                  - "Tap (3, 3)."
              - id: l2-f4
                type: multiple_choice
                text: "Was the purple triangle reflected or translated to make the green one?"
                show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 5], [3, 5], [1, 8]], moved: [[9, 5], [7, 5], [9, 8]] }
                options: ["reflected", "translated"]
                answer: "reflected"
                keep_order: true
                hints:
                  - "Is the green triangle facing the same way as the purple one?"
                  - "The purple triangle has its right angle on the left. Where is the right angle on the green one?"
                  - "It is flipped over, so it was reflected."
              - id: l2-f5
                type: true_false
                text: "A rectangle is 3 squares wide. It is translated 4 right. Is it still 3 squares wide?"
                answer: true
                hints:
                  - "Every corner moves 4 right."
                  - "The left and right sides both move by the same amount."
                  - "Yes. A translation does not change the size."

          - support: some
            tasks:
              - id: l2-s1
                type: point_on_grid
                text: "Point A at (2, 5) is translated 4 right and 3 down. Tap where it lands."
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[2, 5, A]] }
                answer: [6, 2]
                feedback:
                  "6,8": "That is 3 up. Down takes away from y: 5 − 3 = 2."
                  "5,1": "That is 3 right and 4 down. Right changes x: 2 + 4 = 6. Down changes y: 5 − 3 = 2."
                hints: ["Right adds to x. Down takes away from y."]
              - id: l2-s2
                type: multiple_choice
                text: "The purple triangle is translated to the green one. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[5, 6], [7, 6], [5, 9]], moved: [[1, 2], [3, 2], [1, 5]] }
                options: ["4 left, 4 down", "4 right, 4 up", "4 left, 3 down"]
                answer: "4 left, 4 down"
                hints: ["The corner at (5, 6) moves to (1, 2)."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which grid shows the triangle translated 2 right and 3 up?"
                options:
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 1], [3, 1], [1, 3]], moved: [[3, 4], [5, 4], [3, 6]], key: r2u3 }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 1], [3, 1], [1, 3]], moved: [[4, 3], [6, 3], [4, 5]], key: r3u2 }
                  - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 1], [3, 1], [1, 3]], moved: [[5, 4], [3, 4], [5, 6]], key: flipped }
                answer: r2u3
                hints: ["The corner at (1, 1) must land on (3, 4), and the triangle must face the same way."]
              - id: l2-s4
                type: multiple_choice
                text: "A shape is translated. What changes?"
                options: ["its position", "its size", "its angles"]
                answer: "its position"
                hints: ["The shape slides. Does it grow or bend?"]
              - id: l2-s5
                type: true_false
                text: "Is it true? A translation flips the shape over."
                answer: false
                hints: ["In a translation every corner slides the same way."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: point_on_grid
                text: "In a computer game, robot R at (2, 3) moves 6 right and 4 up. Tap where it stops."
                show: { drawn: coordinates, quadrants: 1, max: 10, points: [[2, 3, R]] }
                answer: [8, 7]
                feedback:
                  "7,8": "You swapped the numbers. x comes first: 2 + 6 = 8. Then y: 3 + 4 = 7."
                  "6,9": "That is 4 right and 6 up. Right changes x by 6, up changes y by 4."
              - id: l2-n2
                type: multiple_choice
                text: "On a garden plan, the shed is moved from the purple place to the green place. Describe the translation."
                show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[2, 7], [5, 7], [5, 9], [2, 9]], moved: [[5, 2], [8, 2], [8, 4], [5, 4]] }
                options: ["3 right, 5 down", "5 right, 3 down", "3 right, 5 up"]
                answer: "3 right, 5 down"
              - id: l2-n3
                type: multiple_choice
                text: "A tile pattern uses a purple triangle and a green one. Was the triangle reflected or translated?"
                show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 6], [3, 6], [1, 9]], moved: [[6, 2], [8, 2], [6, 5]] }
                options: ["reflected", "translated"]
                answer: "translated"
                keep_order: true
              - id: l2-n4
                type: text_input
                text: "A rectangle has sides of 4 cm and 2 cm. It is reflected in a mirror line. How long is its longer side now, in cm?"
                answer: "4"
              - id: l2-n5
                type: multiple_choice
                text: "A treasure marker is at (9, 4). After a translation it is at (5, 8). Describe the translation."
                options: ["4 left, 4 up", "4 right, 4 down", "4 left, 4 down"]
                answer: "4 left, 4 up"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "R at (4, 2) is reflected in the red mirror line. Where is its image?"
            show: { drawn: coordinates, quadrants: 1, max: 10, points: [[4, 2, R]], mirror: { axis: y, at: 6 } }
            options: ["(8, 2)", "(4, 10)", "(9, 2)"]
            answer: "(8, 2)"
          - id: l2-c2
            type: point_on_grid
            text: "Point B at (3, 8) is translated 4 right and 5 down. Tap where it lands."
            show: { drawn: coordinates, quadrants: 1, max: 10, points: [[3, 8, B]] }
            answer: [7, 3]
            feedback:
              "8,4": "That is 5 right and 4 down. Right changes x: 3 + 4 = 7. Down changes y: 8 − 5 = 3."
          - id: l2-c3
            type: multiple_choice
            text: "The purple triangle is translated to the green one. Describe the translation."
            show: { drawn: coordinates, quadrants: 1, max: 10, shape: [[6, 1], [8, 1], [6, 4]], moved: [[3, 5], [5, 5], [3, 8]] }
            options: ["3 left, 4 up", "4 left, 3 up", "3 right, 4 up"]
            answer: "3 left, 4 up"
          - id: l2-c4
            type: image_multiple_choice
            text: "The red mirror line goes across. Which grid shows the purple triangle reflected in it?"
            options:
              - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 5], [4, 5], [1, 7]], moved: [[1, 3], [4, 3], [1, 1]], mirror: { axis: x, at: 4 }, key: reflected }
              - { drawn: coordinates, quadrants: 1, max: 10, shape: [[1, 5], [4, 5], [1, 7]], moved: [[1, 1], [4, 1], [1, 3]], mirror: { axis: x, at: 4 }, key: not-flipped }
