# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.large-mult-mental
skill: math.mult-div-larger.large-mental
curriculum: en-GB
language: en
title:
  de: Große Zahlen im Kopf multiplizieren und dividieren
  en: Multiplying and dividing mentally with multiples of 10, 100 and 1000
summary: >
  Mental multiplication and division with multiples of 10, 100 and 1000
  from a times table fact. Lesson 1 multiplies (40 × 300: 4 × 3 = 12,
  then 10 × 100 = 1000, so 12,000) and multiplies by 10, 100 and 1000;
  lesson 2 divides (36,000 ÷ 9 = 4000, 2400 ÷ 60 = 40), finds missing
  numbers, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.mult-div-larger.tens, math.large-numbers.to-million]
  also_practises: [math.mult-div.all-tables]
  vocabulary: { en: [multiple, times table fact, multiply by 10, 100 and 1000, divide, place value, zeros] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart]
  facets: []
  misconceptions:
    - id: count-zeros-wrong
      what: Puts the wrong number of zeros on the answer (40 × 300 = 1200 or 120,000)
      addressed: lesson 1 Learn splits into the fact and the 10 × 100; l1-f2 has feedback on 1200, l1-s2 and l1-n2 offer wrong-zero answers
    - id: fact-zero
      what: Loses a zero that belongs to the fact (50 × 400 = 2000, because 5 × 4 = 20 already ends in 0)
      addressed: lesson 1 Learn sets 50 × 40; l1-f4 has feedback on 2000, l1-s4, l1-n4 and l2-c2 use a fact ending in 0
    - id: divide-zeros
      what: Takes away zeros from only one number when dividing by a multiple of 10 (2400 ÷ 60 = 400)
      addressed: lesson 2 Learn divides both by 10 first; l2-f4 has feedback on 400, l2-s4 and l2-n4 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Multiplizieren mit Zehnern, Hundertern und Tausendern", en: "Multiplying with multiples of 10, 100 and 1000" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 × 70 = _"
            say: "Six times seventy."
            answer: "420"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "320 ÷ 8 = _"
            say: "Three hundred and twenty divided by eight."
            answer: "40"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "34 × 100 = 3400"
            say: "Multiplying by one hundred moves every digit two places to the left. Three tens and four ones become three thousands and four hundreds. The empty places are filled with zeros."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [3, 4, 0, 0] }
          - text: "40 × 300\n= 4 × 10 × 3 × 100\n= 4 × 3 × 10 × 100\n= 12 × 1000 = 12,000"
            say: "Forty times three hundred. Split each number: forty is four times ten, three hundred is three times one hundred. Use the fact four times three is twelve. Ten times one hundred is one thousand. So twelve thousand."
          - text: "50 × 40 = 5 × 4 × 10 × 10 = 20 × 100 = 2000"
            say: "Careful when the fact already ends in nought. Five times four is twenty. Times one hundred is two thousand. The nought from the twenty stays."
          - text: "7 × 6000 = 42,000"
            say: "Seven times six thousand. Seven sixes are forty-two, so seven times six thousand is forty-two thousand."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "56 × 100 = _"
                say: "Fifty-six times one hundred."
                answer: "5600"
                hints:
                  - "Each digit moves two places to the left."
                  - "5 tens become 5 thousands, 6 ones become 6 hundreds."
                  - "5600."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "60 × 200 = _"
                say: "Sixty times two hundred."
                options: ["12,000", "1200", "120,000"]
                answer: "12,000"
                feedback:
                  "1200": "6 × 2 = 12, and 10 × 100 = 1000. So 12 × 1000."
                hints:
                  - "Use the fact 6 × 2."
                  - "6 × 2 = 12. Then 10 × 100 = 1000."
                  - "12 × 1000 = 12,000."
              - id: l1-f3
                type: fill_in_blank
                text: "Split it into a fact and the hundreds."
                say: "Eight times nine hundred. Use the fact eight times nine."
                frame: "8 × 900 = 8 × 9 × 100 = _ × 100 = _"
                options: ["72", "7200", "720", "72,000"]
                answer: ["72", "7200"]
                hints:
                  - "What is 8 × 9?"
                  - "8 × 9 = 72. Then times 100."
                  - "72, then 7200."
              - id: l1-f4
                type: multiple_choice
                text: "50 × 400 = _"
                say: "Fifty times four hundred."
                options: ["20,000", "2000", "200,000"]
                answer: "20,000"
                feedback:
                  "2000": "5 × 4 = 20. Then 20 × 1000. Keep the zero from the 20."
                hints:
                  - "Use 5 × 4, then 10 × 100."
                  - "5 × 4 = 20. 10 × 100 = 1000."
                  - "20 × 1000 = 20,000."
              - id: l1-f5
                type: true_false
                text: "Is it true? 3 × 7000 = 21,000"
                say: "Three times seven thousand equals twenty-one thousand. Is it true?"
                answer: true
                hints:
                  - "Use 3 × 7."
                  - "3 × 7 = 21, then thousands."
                  - "Yes, 21,000."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "48 × 1000 = _"
                say: "Forty-eight times one thousand."
                answer: "48000"
                hints: ["Each digit moves three places to the left."]
              - id: l1-s2
                type: multiple_choice
                text: "70 × 300 = _"
                say: "Seventy times three hundred."
                options: ["21,000", "2100", "210,000"]
                answer: "21,000"
                hints: ["7 × 3, then 10 × 100."]
              - id: l1-s3
                type: text_input
                text: "6 × 800 = _"
                say: "Six times eight hundred."
                answer: "4800"
                hints: ["6 × 8 = 48."]
              - id: l1-s4
                type: multiple_choice
                text: "40 × 500 = _"
                say: "Forty times five hundred."
                options: ["20,000", "2000", "200,000"]
                answer: "20,000"
                hints: ["4 × 5 = 20. Keep its zero."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 90 × 90 = 810"
                say: "Ninety times ninety equals eight hundred and ten. Is it true?"
                answer: false
                hints: ["9 × 9 = 81, then 10 × 10."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "730 × 100 = _"
                say: "Seven hundred and thirty times one hundred."
                answer: "73000"
              - id: l1-n2
                type: multiple_choice
                text: "80 × 600 = _"
                say: "Eighty times six hundred."
                options: ["48,000", "4800", "480,000"]
                answer: "48,000"
              - id: l1-n3
                type: text_input
                text: "9 × 4000 = _"
                say: "Nine times four thousand."
                answer: "36000"
              - id: l1-n4
                type: text_input
                text: "60 × 50 = _"
                say: "Sixty times fifty."
                answer: "3000"
              - id: l1-n5
                type: text_input
                text: "A school orders 30 boxes of pencils. Each box holds 200 pencils. How many pencils is that?"
                answer: "6000"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "50 × 700 = _"
            say: "Fifty times seven hundred."
            answer: "35000"
          - id: l1-c2
            type: text_input
            text: "8 × 3000 = _"
            say: "Eight times three thousand."
            answer: "24000"
          - id: l1-c3
            type: multiple_choice
            text: "40 × 400 = _"
            say: "Forty times four hundred."
            options: ["16,000", "1600", "160,000"]
            answer: "16,000"

  - n: 2
    title: { de: "Dividieren mit Zehnern, Hundertern und Tausendern", en: "Dividing with multiples of 10, 100 and 1000" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "70 × 400 = _"
            say: "Seventy times four hundred."
            answer: "28000"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "65 × 100 = _"
            say: "Sixty-five times one hundred."
            answer: "6500"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "36,000 ÷ 9\n36 ÷ 9 = 4\n36 thousands ÷ 9 = 4 thousands = 4000"
            say: "Thirty-six thousand divided by nine. You know thirty-six divided by nine is four. Thirty-six thousands shared into nine groups gives four thousands in each. So four thousand."
          - text: "5600 ÷ 100 = 56"
            say: "Dividing by one hundred moves every digit two places to the right. Five thousand six hundred divided by one hundred is fifty-six."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [0, 0, 5, 6] }
          - text: "2400 ÷ 60\n= 240 ÷ 6\n= 40"
            say: "Two thousand four hundred divided by sixty. Divide both numbers by ten first: two hundred and forty divided by six. Twenty-four divided by six is four, so two hundred and forty divided by six is forty. The answer is forty."
          - text: "Check: 40 × 60 = 2400"
            say: "Check with the inverse. Forty times sixty is two thousand four hundred, so the answer is right."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: text_input
                text: "4200 ÷ 7 = _"
                say: "Four thousand two hundred divided by seven."
                answer: "600"
                hints:
                  - "Which fact helps? 42 ÷ 7."
                  - "42 ÷ 7 = 6, so 42 hundreds ÷ 7 = 6 hundreds."
                  - "600."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "36,000 ÷ 4 = _"
                say: "Thirty-six thousand divided by four."
                options: ["9000", "900", "90,000"]
                answer: "9000"
                hints:
                  - "Use 36 ÷ 4."
                  - "36 ÷ 4 = 9, and these are thousands."
                  - "9000."
              - id: l2-f3
                type: text_input
                text: "7300 ÷ 100 = _"
                say: "Seven thousand three hundred divided by one hundred."
                answer: "73"
                hints:
                  - "Each digit moves two places to the right."
                  - "7 thousands become 7 tens, 3 hundreds become 3 ones."
                  - "73."
              - id: l2-f4
                type: multiple_choice
                text: "3600 ÷ 90 = _"
                say: "Three thousand six hundred divided by ninety."
                options: ["40", "400", "4"]
                answer: "40"
                feedback:
                  "400": "Divide both numbers by 10 first: 360 ÷ 9. Check: 400 × 90 would be 36,000."
                hints:
                  - "Divide both numbers by 10 first."
                  - "3600 ÷ 90 is the same as 360 ÷ 9."
                  - "36 ÷ 9 = 4, so 360 ÷ 9 = 40."
              - id: l2-f5
                type: fill_in_blank
                text: "Find the missing number."
                say: "What times three hundred equals twenty-four thousand?"
                frame: "_ × 300 = 24,000"
                options: ["80", "8", "800"]
                answer: ["80"]
                hints:
                  - "Use the fact 8 × 3 = 24."
                  - "8 × 300 = 2400. You need ten times as much."
                  - "80 × 300 = 24,000."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "5400 ÷ 6 = _"
                say: "Five thousand four hundred divided by six."
                answer: "900"
                hints: ["54 ÷ 6 = 9."]
              - id: l2-s2
                type: multiple_choice
                text: "56,000 ÷ 8 = _"
                say: "Fifty-six thousand divided by eight."
                options: ["7000", "700", "70,000"]
                answer: "7000"
                hints: ["56 ÷ 8 = 7 thousands."]
              - id: l2-s3
                type: text_input
                text: "90,000 ÷ 1000 = _"
                say: "Ninety thousand divided by one thousand."
                answer: "90"
                hints: ["Each digit moves three places to the right."]
              - id: l2-s4
                type: multiple_choice
                text: "4800 ÷ 80 = _"
                say: "Four thousand eight hundred divided by eighty."
                options: ["60", "600", "6"]
                answer: "60"
                hints: ["Same as 480 ÷ 8."]
              - id: l2-s5
                type: fill_in_blank
                text: "Find the missing number."
                say: "Seventy times what equals thirty-five thousand?"
                frame: "70 × _ = 35,000"
                options: ["500", "50", "5000"]
                answer: ["500"]
                hints: ["7 × 5 = 35. Count the zeros you still need."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "2700 ÷ 9 = _"
                say: "Two thousand seven hundred divided by nine."
                answer: "300"
              - id: l2-n2
                type: text_input
                text: "63,000 ÷ 7 = _"
                say: "Sixty-three thousand divided by seven."
                answer: "9000"
              - id: l2-n3
                type: text_input
                text: "48,000 ÷ 100 = _"
                say: "Forty-eight thousand divided by one hundred."
                answer: "480"
              - id: l2-n4
                type: multiple_choice
                text: "4200 ÷ 70 = _"
                say: "Four thousand two hundred divided by seventy."
                options: ["60", "600", "6"]
                answer: "60"
              - id: l2-n5
                type: text_input
                text: "A farm packs 32,000 eggs into boxes of 8. How many boxes does it fill?"
                say: "A farm packs thirty-two thousand eggs into boxes of eight. How many boxes does it fill?"
                answer: "4000"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "90 × 300 = _"
            say: "Ninety times three hundred."
            answer: "27000"
          - id: l2-c2
            type: multiple_choice
            text: "500 × 60 = _"
            say: "Five hundred times sixty."
            options: ["30,000", "3000", "300,000"]
            answer: "30,000"
          - id: l2-c3
            type: text_input
            text: "45,000 ÷ 9 = _"
            say: "Forty-five thousand divided by nine."
            answer: "5000"
          - id: l2-c4
            type: text_input
            text: "2800 ÷ 40 = _"
            say: "Two thousand eight hundred divided by forty."
            answer: "70"
          - id: l2-c5
            type: text_input
            text: "640 × 100 = _"
            say: "Six hundred and forty times one hundred."
            answer: "64000"
