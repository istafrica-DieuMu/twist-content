# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.length-word-problems
skill: math.length.word-problems
curriculum: en-GB
language: en
title:
  de: Sachaufgaben mit Längen
  en: Length problems
summary: >
  Lesson 1 changes both lengths into one unit before calculating (1.35 m
  + 90 cm = 135 cm + 90 cm = 225 cm, 2.4 km + 750 m = 3150 m), in
  stories from sports day, the school fair and a canal walk; lesson 2
  solves problems in two steps (bunting cut into equal lengths, laps of
  a track), checks the answer with an estimate and asks whether a length
  can be true (a classroom 900 m long?), and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Längen, en: Length }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.notation, math.word-problems.multi-step]
  also_practises: [math.length.notation, math.word-problems.check-plausible]
  vocabulary: { en: [convert, unit, kilometre, metre, centimetre, altogether, left over, estimate, makes sense] }
  forms: [text, audio]
  drawn: []
  facets: [units]
  parts:
    - { id: mixed-units, what: { de: Längen erst in eine Einheit umwandeln und dann rechnen, en: changing lengths into one unit before calculating } }
    - { id: two-step, what: { de: Sachaufgaben mit Längen in zwei Schritten lösen, en: solving length problems in two steps } }
    - { id: estimate-check, what: { de: ein Ergebnis mit einem Überschlag prüfen, en: checking an answer with an estimate } }
    - { id: makes-sense, what: { de: "prüfen, ob eine Länge zur Wirklichkeit passt", en: checking that a length makes sense in real life } }
  misconceptions:
    - id: mixed-units-added
      what: Adds or subtracts lengths in different units as they stand (3 m + 45 cm = 48 cm)
      addressed: lesson 1 Learn converts both lengths first; l1-f1, l1-f2, l1-s1, l1-n1 and l1-c1 offer the unconverted answer, with feedback in l1-f1 and l1-f2
    - id: unit-not-checked
      what: Accepts an answer whose size or unit cannot be true (a classroom 900 m long, a bus 12 cm long)
      addressed: lesson 2 Learn checks the answer against real life; l2-f3, l2-f5, l2-s4, l2-n2, l2-n5, l2-c3 and l2-c4 ask whether a length makes sense
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Erst in eine Einheit", en: "One unit first" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1.35 m = _"
            say: "How many centimetres is one point three five metres?"
            options: ["135 cm", "1035 cm", "13 cm"]
            answer: "135 cm"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "3.2 km = _"
            say: "How many metres is three point two kilometres?"
            options: ["3200 m", "3002 m", "320 m"]
            answer: "3200 m"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Sports day: Kai jumps 1.35 m. Then he jumps 90 cm.\nHow far is that altogether?"
            say: "On sports day Kai does two jumps. The first is one point three five metres, the second is ninety centimetres. How far is that altogether? The lengths are in different units. Before you calculate, change them into the same unit."
          - text: "1.35 m = 135 cm\n135 cm + 90 cm = 225 cm = 2.25 m"
            say: "One point three five metres is one hundred and thirty-five centimetres. One hundred and thirty-five add ninety is two hundred and twenty-five centimetres. That is two point two five metres."
          - text: "A canal walk: 2.4 km, then 750 m more.\n2400 m + 750 m = 3150 m = 3.15 km"
            say: "Kilometres and metres work the same way. Two point four kilometres is two thousand four hundred metres. Add seven hundred and fifty metres and you get three thousand one hundred and fifty metres, which is three point one five kilometres."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A plank is 1.50 m long. Dad saws off 45 cm. How long is the piece that is left?"
                options: ["105 cm", "195 cm", "1.05 cm"]
                answer: "105 cm"
                feedback:
                  "195 cm": "Dad saws a piece off, so the plank gets shorter. Subtract."
                  "1.05 cm": "The plank is still more than a metre long. 105 cm is the same as 1.05 m."
                hints:
                  - "Change 1.50 m into centimetres first."
                  - "150 cm − 45 cm."
                  - "105 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "One skipping rope is 3 m long. Another is 45 cm. How long are they end to end?"
                options: ["3.45 m", "48 cm", "48 m"]
                answer: "3.45 m"
                feedback:
                  "48 cm": "You added 3 and 45. Change 3 m into centimetres first: 300 cm."
                  "48 m": "You added 3 and 45. 45 cm is less than a metre."
                hints:
                  - "Put both lengths in the same unit."
                  - "300 cm + 45 cm = 345 cm."
                  - "3.45 m."
              - id: l1-f3
                type: fill_in_blank
                text: "Grace runs 1.6 km in the park and then 800 m home. How far does she run?"
                frame: "1600 m + 800 m = _ m = _ km"
                options: ["2400", "2.4", "2.8", "1680"]
                answer: ["2400", "2.4"]
                hints:
                  - "1.6 km is 1600 m."
                  - "1600 + 800 = 2400. 1000 m is 1 km."
                  - "2400 m = 2.4 km."
              - id: l1-f4
                type: multiple_choice
                text: "A bookcase is 1.85 m tall. Mum wants to put a box 30 cm tall on top. The ceiling is 2.20 m high. Does the box fit?"
                options: ["Yes, with 5 cm to spare.", "No, it is 5 cm too tall.", "Yes, with 50 cm to spare."]
                answer: "Yes, with 5 cm to spare."
                hints:
                  - "Change everything into centimetres."
                  - "185 cm + 30 cm = 215 cm. The ceiling is 220 cm high."
                  - "Yes, with 5 cm to spare."
              - id: l1-f5
                type: true_false
                text: "Dad jogs 4 laps of the field. One lap is 600 m. Ruby says: Dad ran 2.4 km. Is she right?"
                answer: true
                hints:
                  - "Work in metres first."
                  - "4 × 600 m = 2400 m."
                  - "Yes. 2400 m is 2.4 km."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "In the long jump, Amir jumps 2.42 m and Leo jumps 1.87 m. How much further does Amir jump?"
                options: ["55 cm", "65 cm", "4.29 m"]
                answer: "55 cm"
                hints: ["242 cm − 187 cm."]
              - id: l1-s2
                type: multiple_choice
                text: "A roll of ribbon is 4 m long. Zara cuts 5 pieces of 60 cm. How much is left?"
                options: ["1 m", "3 m", "3.40 m"]
                answer: "1 m"
                hints: ["5 × 60 cm = 300 cm. 4 m is 400 cm."]
              - id: l1-s3
                type: fill_in_blank
                text: "The Patel family drive 14.5 km to the coast, then walk 1.8 km along the cliffs. How far is that altogether?"
                frame: "_ km"
                options: ["16.3", "15.3", "14.68"]
                answer: ["16.3"]
                hints: ["14.5 + 1.8: add the whole kilometres, then the tenths."]
              - id: l1-s4
                type: true_false
                text: "The hall is 18.50 m long. Noah writes: that is 1850 m. Is he right?"
                answer: false
                hints: ["18.50 m is 18 m and 50 cm. Which unit did Noah need?"]
              - id: l1-s5
                type: multiple_choice
                text: "A fence has 8 panels. Each panel is 1.50 m long. How long is the fence?"
                options: ["12 m", "9.50 m", "8.15 m"]
                answer: "12 m"
                hints: ["Two panels are 3 m long."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Oliver has 1.75 m of string. He needs 2 m. How much more does he need?"
                options: ["25 cm", "75 cm", "1.25 m"]
                answer: "25 cm"
              - id: l1-n2
                type: multiple_choice
                text: "It is 650 m from Freya's house to the shop. She walks there and back. How far does she walk?"
                options: ["1.3 km", "13 km", "650 m"]
                answer: "1.3 km"
              - id: l1-n3
                type: fill_in_blank
                text: "A nature trail is 6 km long. The class stops for lunch after 3.7 km. How far is left?"
                frame: "_ km"
                options: ["2.3", "3.3", "2.7"]
                answer: ["2.3"]
              - id: l1-n4
                type: true_false
                text: "A felt-tip pen is 14 cm long. Ali says: 10 pens laid end to end are 14 m long. Is he right?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "One lap of the cycle track is 1.5 km. Isla rides 6 laps. How many kilometres does she ride?"
                answer: "9"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "One table is 1.40 m long. A second table is 80 cm long. How long are they when pushed together end to end?"
            options: ["2.20 m", "81.40 m", "1.48 m"]
            answer: "2.20 m"
          - id: l1-c2
            type: multiple_choice
            text: "Grandma lives 4 km away. Harry has cycled 2.6 km. How far is left?"
            options: ["1.4 km", "2.4 km", "1.6 km"]
            answer: "1.4 km"
          - id: l1-c3
            type: true_false
            text: "A 5 m rope is cut in half. Is each piece 250 cm long?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "A ribbon is 2 m long. Mia uses 35 cm. How much ribbon is left?"
            options: ["1.65 m", "1.75 m", "165 m"]
            answer: "1.65 m"
          - id: l1-c5
            type: text_input
            text: "A path is 1.2 km long. Tom has walked 450 m. How many metres are left?"
            answer: "750"
          - id: l1-c6
            type: true_false
            text: "Lucy jumps 1.15 m and then 95 cm. She says that is 2 m altogether. Is she right?"
            answer: false

  - n: 2
    title: { de: "In Schritten rechnen und prüfen", en: "Steps and checks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "1.60 m + 75 cm = _"
            options: ["2.35 m", "76.60 m", "1.67 m"]
            answer: "2.35 m"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "5 km − 300 m = _"
            options: ["4.7 km", "4.3 km", "4.97 km"]
            answer: "4.7 km"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Bunting for the school fair: a string is 6 m long.\nThe class hangs 8 flags, each taking 45 cm.\nHow much string is left?"
            say: "The class makes bunting for the school fair. The string is six metres long. Each of the eight flags takes forty-five centimetres. How much string is left? This takes two steps."
          - text: "Step 1: 8 × 45 cm = 360 cm\nStep 2: 600 cm − 360 cm = 240 cm = 2.40 m"
            say: "First work out how much string the flags take: eight times forty-five is three hundred and sixty centimetres. Then take that away from six hundred centimetres. Two hundred and forty centimetres are left, which is two point four metres."
          - text: "Check: 8 × 45 cm is about 8 × 50 cm = 4 m.\nAbout 2 m is left. 2.40 m makes sense."
            say: "Now check. Forty-five is close to fifty, and eight lots of fifty centimetres are four metres. So about two metres are left. Two point four metres fits the estimate."
          - text: "Does it make sense?\nA classroom 900 m long? No: 9 m."
            say: "Also check the unit. Think about the real thing. A classroom is about nine metres long, never nine hundred. If an answer is far too big or far too small, look for a mistake in the units."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Gran has 5 m of fabric. She makes 6 curtains for a dolls' house, each needing 70 cm. How much fabric is left?"
                options: ["80 cm", "4.20 m", "4.30 m"]
                answer: "80 cm"
                feedback:
                  "4.20 m": "4.20 m is the fabric Gran uses. The question asks what is left."
                  "4.30 m": "That is what is left after one curtain. Gran makes 6."
                hints:
                  - "First find how much fabric all 6 curtains need."
                  - "6 × 70 cm = 420 cm. 5 m is 500 cm."
                  - "500 cm − 420 cm = 80 cm."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ethan lives 1.8 km from school. He walks there and back every day for 5 days. How far does he walk that week?"
                options: ["18 km", "9 km", "3.6 km"]
                answer: "18 km"
                feedback:
                  "9 km": "That is 5 trips one way. Ethan walks there and back each day."
                hints:
                  - "Start with one day: there and back."
                  - "2 × 1.8 km = 3.6 km. Then times 5."
                  - "18 km."
              - id: l2-f3
                type: true_false
                text: "A desk is 1.20 m long. Sophie works out that 10 desks in a row are 120 m long. Does that make sense?"
                answer: false
                hints:
                  - "Estimate: 10 desks of about 1 m."
                  - "10 × 120 cm = 1200 cm. That is 12 m."
                  - "No. Sophie mixed up centimetres and metres."
              - id: l2-f4
                type: multiple_choice
                text: "A vegetable patch is 4.50 m long and 2.50 m wide. Grandad puts string all the way round it once. How long is the string?"
                options: ["14 m", "7 m", "11.25 m"]
                answer: "14 m"
                feedback:
                  "7 m": "That is one long side and one short side, only half way round."
                hints:
                  - "The patch has two long sides and two short sides."
                  - "4.50 m + 2.50 m = 7 m. That is half way round."
                  - "2 × 7 m = 14 m."
              - id: l2-f5
                type: multiple_choice
                text: "Which length makes sense? The walk from school to the park is ..."
                options: ["700 m", "700 cm", "700 km"]
                answer: "700 m"
                hints:
                  - "Picture each length."
                  - "700 cm is only 7 m. 700 km is further than London to Edinburgh."
                  - "700 m."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A train engine is 22 m long. It pulls 6 carriages, each 24 m long. How long is the whole train?"
                options: ["166 m", "144 m", "46 m"]
                answer: "166 m"
                hints: ["First the 6 carriages, then add the engine."]
              - id: l2-s2
                type: multiple_choice
                text: "Lily has 2 m of ribbon. Each bow needs 35 cm. How many whole bows can she make?"
                options: ["5", "6", "35"]
                answer: "5"
                hints: ["200 cm ÷ 35 cm = 5 remainder 25. Is 25 cm enough for another bow?"]
              - id: l2-s3
                type: true_false
                text: "A sponsored walk is 15 km. By lunchtime the class has walked 8.5 km. Are 6.5 km left?"
                answer: true
                hints: ["15 km − 8.5 km: 15 − 8 = 7, then take away another half."]
              - id: l2-s4
                type: multiple_choice
                text: "Which length makes sense? A football pitch is about ... long."
                options: ["100 m", "100 cm", "100 km"]
                answer: "100 m"
                hints: ["100 cm is one metre: shorter than you are."]
              - id: l2-s5
                type: multiple_choice
                text: "In the welly throw, Josh throws 12.40 m. Mia throws 2.80 m further than Josh. How far do they throw altogether?"
                options: ["27.60 m", "15.20 m", "24.80 m"]
                answer: "27.60 m"
                hints: ["First work out how far Mia throws."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Dad needs 5 shelves, each 70 cm long. The shop sells planks 2 m long. How many planks must he buy?"
                options: ["3", "2", "5"]
                answer: "3"
              - id: l2-n2
                type: true_false
                text: "A school bus is 11 m long. Evie says: that is 110 cm. Does that make sense?"
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "The running track is 400 m long. Jacob runs 7 laps. How far is that?"
                options: ["2.8 km", "28 km", "2.08 km"]
                answer: "2.8 km"
              - id: l2-n4
                type: multiple_choice
                text: "A ladder is 2.75 m long. Mum pulls it out by another 1.40 m. How long is it now?"
                options: ["4.15 m", "1.35 m", "3.15 m"]
                answer: "4.15 m"
              - id: l2-n5
                type: multiple_choice
                text: "Which length makes sense? A door is about ... tall."
                options: ["2 m", "20 m", "20 cm"]
                answer: "2 m"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: two-step
            type: multiple_choice
            text: "A rope is 6 m long. Amelia cuts 4 pieces of 1.30 m. How much is left?"
            options: ["80 cm", "5.20 m", "4.70 m"]
            answer: "80 cm"
          - id: l2-c2
            part: mixed-units
            type: multiple_choice
            text: "Theo walks 1.4 km to the library and then 850 m on to the swimming pool. How far does he walk?"
            options: ["2250 m", "1485 m", "864 m"]
            answer: "2250 m"
          - id: l2-c3
            part: makes-sense
            type: true_false
            text: "A car is 4 m long. Daniel says: 5 cars in a queue are 20 km long. Does that make sense?"
            answer: false
          - id: l2-c4
            part: makes-sense
            type: multiple_choice
            text: "Which length makes sense? A pencil is about ... long."
            options: ["18 cm", "18 m", "18 mm"]
            answer: "18 cm"
          - id: l2-c5
            part: mixed-units
            type: multiple_choice
            text: "A cycle path is 3.6 km long. It is split into 4 equal parts. How long is one part?"
            options: ["900 m", "90 m", "9 km"]
            answer: "900 m"
          - id: l2-c6
            part: mixed-units
            type: text_input
            text: "A fence is 2.35 m tall. A sunflower grows 80 cm higher than the fence. How tall is the sunflower, in centimetres?"
            answer: "315"
          - id: l2-c7
            part: mixed-units
            type: multiple_choice
            text: "A canal boat trip is 5.2 km long. The boat has gone 1800 m. How far is left?"
            options: ["3.4 km", "4.2 km", "3.6 km"]
            answer: "3.4 km"
          - id: l2-c8
            part: mixed-units
            type: true_false
            text: "Ruby's paper chain is 3.5 m long. She adds 75 cm more. Is it now 4.25 m long?"
            answer: true
          - id: l2-c9
            part: two-step
            type: multiple_choice
            text: "A garden path is made of 12 slabs, each 45 cm long. At the end is a gate 1.2 m wide. How long are the path and the gate together?"
            options: ["6.60 m", "5.40 m", "17.40 m"]
            answer: "6.60 m"
          - id: l2-c10
            part: two-step
            type: text_input
            text: "Maya swims 4 lengths of a 25 m pool every day for 5 days. How many metres does she swim?"
            answer: "500"
          - id: l2-c11
            part: two-step
            type: multiple_choice
            text: "A shelf is 1.2 m long. Each book is 3 cm thick. There are already 25 books on the shelf. How many more books fit?"
            options: ["15", "40", "25"]
            answer: "15"
          - id: l2-c12
            part: two-step
            type: multiple_choice
            text: "The park is 1.2 km from school. The class walks there and back, and also 600 m round the park. How far do they walk?"
            options: ["3 km", "1.8 km", "2.4 km"]
            answer: "3 km"
          - id: l2-c13
            part: estimate-check
            type: multiple_choice
            text: "About how long are 9 pieces of string, each 48 cm long?"
            options: ["about 4.5 m", "about 45 cm", "about 45 m"]
            answer: "about 4.5 m"
          - id: l2-c14
            part: estimate-check
            type: true_false
            text: "A rope is 5 m long. Leo cuts 4 pieces of 98 cm and says 1.08 m is left. Does that fit an estimate?"
            answer: true
          - id: l2-c15
            part: estimate-check
            type: true_false
            text: "Nina walks 2.9 km and then 2.1 km. She says she walked 50 km. Does that fit an estimate?"
            answer: false
          - id: l2-c16
            part: estimate-check
            type: multiple_choice
            text: "Jack works out how far 6 laps of a 390 m track are. Which answer fits the estimate?"
            options: ["2340 m", "234 m", "23,400 m"]
            answer: "2340 m"
          - id: l2-c17
            part: estimate-check
            type: text_input
            text: "7 planks, each 1.95 m long, are laid end to end. Round each plank to the nearest metre. About how many metres long is the row?"
            answer: "14"
          - id: l2-c18
            part: makes-sense
            type: multiple_choice
            text: "Which length makes sense? A swimming pool is about ... long."
            options: ["25 m", "25 cm", "25 km"]
            answer: "25 m"
          - id: l2-c19
            part: makes-sense
            type: true_false
            text: "Alfie measures his thumb. He writes 5 m. Does that make sense?"
            answer: false
          - id: l2-c20
            part: makes-sense
            type: multiple_choice
            text: "Each bus is 12 m long. Priya works out the length of 8 buses in a row and writes 96 cm. What went wrong?"
            options: ["The unit: it should be 96 m.", "Nothing, it makes sense.", "She should have added 8."]
            answer: "The unit: it should be 96 m."
