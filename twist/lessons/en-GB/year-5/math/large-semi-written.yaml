# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.large-semi-written
skill: math.add-sub-to-1000.large-semi-written
curriculum: en-GB
language: en
title:
  de: Große Zahlen halbschriftlich
  en: Informal methods with large numbers
summary: >
  Adding and subtracting four- and five-digit numbers with an informal
  written method, estimating first. Lesson 1 rounds both numbers for the
  estimate and adds in steps, place by place, on paper and on an empty
  number line (4600 + 2350: thousands, then hundreds, then tens);
  lesson 2 subtracts in steps, finds a difference by counting on, checks
  the answer against the estimate to catch mistakes, and ends with the
  skill check.
metadata:
  year: year-5
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.add-sub-to-1000.large-mental, math.add-sub-to-1000.estimate]
  also_practises: [math.add-sub-to-1000.large-mental]
  vocabulary: { en: [estimate, round, approximately, in steps, partition, empty number line, count on, difference] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: []
  parts:
    - { id: estimate, what: { de: vorher durch Runden überschlagen, en: estimating first by rounding } }
    - { id: add-steps, what: { de: "schrittweise addieren, Stelle für Stelle", en: "adding in steps, place by place" } }
    - { id: subtract-steps, what: { de: schrittweise subtrahieren oder den Unterschied durch Ergänzen finden, en: subtracting in steps or counting on to find a difference } }
    - { id: check, what: { de: das Ergebnis mit dem Überschlag prüfen und Fehler finden, en: checking an answer against the estimate and finding mistakes } }
  misconceptions:
    - id: lost-step
      what: Starts the next step from the first number instead of the last result
      addressed: lesson 1 Learn carries each result into the next step; l1-f3 shows that mistake with feedback, l1-s3 and l1-n3 ask whether there is a mistake
    - id: estimate-ignored
      what: Accepts an answer that is far from the estimate
      addressed: lesson 1 and lesson 2 Learn compare the answer with the estimate; l1-f5, l1-s5, l2-f2, l2-s2, l2-n2 and l2-c4 ask whether an answer fits the estimate
    - id: subtract-both-ways
      what: Subtracts the smaller digit from the bigger in each place (5200 − 1800 = 4600)
      addressed: lesson 2 Learn counts on for differences across a thousand; l2-f4 has feedback on 4600, l2-s4 and l2-n4 count on
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Überschlagen und schrittweise addieren", en: "Estimate, then add in steps" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6000 + 7000 = _"
            answer: "13000"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Round 4380 to the nearest thousand."
            options: ["4000", "5000", "4400"]
            answer: "4000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4600 + 2350\nEstimate: 4600 + 2350 ≈ 5000 + 2000 = 7000"
            say: "Before you calculate, estimate. Round each number to the nearest thousand: four thousand six hundred is about five thousand, two thousand three hundred and fifty is about two thousand. So the answer should be about seven thousand. The sign that looks like a wavy equals means is approximately equal to."
          - text: "4600 + 2000 = 6600\n6600 + 300 = 6900\n6900 + 50 = 6950"
            say: "Now add in steps. Keep the first number whole and add the second one place at a time: first the thousands, then the hundreds, then the tens. Each step starts from the last answer."
            show: { drawn: rechenstrich, start: 4600, jumps: [2000, 300, 50] }
          - text: "6950 ≈ 7000"
            say: "Six thousand nine hundred and fifty is close to the estimate of seven thousand, so the answer is sensible."
          - text: "24,500 + 13,200\nEstimate: 25,000 + 13,000 = 38,000\n24,500 + 13,000 = 37,500\n37,500 + 200 = 37,700"
            say: "Five-digit numbers work the same way. Estimate thirty-eight thousand. Add thirteen thousand, then two hundred: thirty-seven thousand seven hundred."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Estimate: 3800 + 5100 ≈ ?"
                options: ["9000", "8000", "10,000"]
                answer: "9000"
                hints:
                  - "Round each number to the nearest thousand."
                  - "3800 is about 4000. 5100 is about 5000."
                  - "4000 + 5000 = 9000."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Add 5200 + 3450 in steps."
                show: { drawn: rechenstrich, start: 5200, jumps: [3000, 400, 50] }
                frame: "5200 + 3000 = _; then + 400 = _; then + 50 = _"
                options: ["8200", "8600", "8650", "5600", "8250"]
                answer: ["8200", "8600", "8650"]
                hints:
                  - "Add the thousands first, then the hundreds, then the tens."
                  - "5200 + 3000 = 8200. Go on from 8200."
                  - "8200, 8600, 8650."
              - id: l1-f3
                type: multiple_choice
                text: "Is there a mistake? Ben adds 2700 + 4620.\n2700 + 4000 = 6700\n2700 + 600 = 3300\n3300 + 20 = 3320"
                options: ["Yes, the second step starts from 2700 again.", "Yes, the first step is wrong.", "No, it is all correct."]
                answer: "Yes, the second step starts from 2700 again."
                feedback:
                  "No, it is all correct.": "Estimate: 3000 + 5000 = 8000. 3320 is far too small."
                hints:
                  - "Each step must start from the last answer."
                  - "After 6700, the next step should be 6700 + 600."
                  - "The second step starts from 2700 again. The answer is 7320."
              - id: l1-f4
                type: text_input
                text: "4300 + 2500 = _"
                answer: "6800"
                hints:
                  - "Start with 4300 and add 2000."
                  - "6300, then add 500."
                  - "6800."
              - id: l1-f5
                type: true_false
                text: "Does this fit the estimate? 6100 + 2800 = 8900"
                answer: true
                hints:
                  - "Estimate first: round both numbers to the nearest thousand."
                  - "6000 + 3000 = 9000."
                  - "Yes, 8900 is close to 9000."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Estimate: 6900 + 2200 ≈ ?"
                options: ["9000", "8000", "10,000"]
                answer: "9000"
                hints: ["7000 + 2000."]
              - id: l1-s2
                type: fill_in_blank
                text: "Add 3600 + 4270 in steps."
                frame: "3600 + 4000 = _; then + 200 = _; then + 70 = _"
                options: ["7600", "7800", "7870", "3870", "7670"]
                answer: ["7600", "7800", "7870"]
                hints: ["Each step starts from the last answer."]
              - id: l1-s3
                type: true_false
                text: "Is there a mistake? Ella adds 5400 + 2360.\n5400 + 2000 = 7400\n7400 + 300 = 7700\n7400 + 60 = 7460"
                answer: true
                hints: ["Which number should the last step start from?"]
              - id: l1-s4
                type: text_input
                text: "32,400 + 15,300 = _"
                say: "Thirty-two thousand four hundred add fifteen thousand three hundred."
                answer: "47700"
                hints: ["Add 15,000 first, then 300."]
              - id: l1-s5
                type: true_false
                text: "Does this fit the estimate? 3900 + 4200 = 4100"
                answer: false
                hints: ["4000 + 4000 = 8000."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Estimate: 7200 + 1900 ≈ ?"
                options: ["9000", "8000", "10,000"]
                answer: "9000"
              - id: l1-n2
                type: fill_in_blank
                text: "Add 6300 + 2540 in steps."
                frame: "6300 + 2000 = _; then + 500 = _; then + 40 = _"
                options: ["8300", "8800", "8840", "6840", "8340"]
                answer: ["8300", "8800", "8840"]
              - id: l1-n3
                type: true_false
                text: "Is there a mistake? Sam adds 1800 + 5130.\n1800 + 5000 = 6800\n6800 + 100 = 6900\n6900 + 30 = 6930"
                answer: false
              - id: l1-n4
                type: text_input
                text: "5600 + 3350 = _"
                answer: "8950"
              - id: l1-n5
                type: text_input
                text: "A charity walk raises £14,600 on Saturday and £22,300 on Sunday. How much is that altogether, in pounds?"
                say: "A charity walk raises fourteen thousand six hundred pounds on Saturday and twenty-two thousand three hundred pounds on Sunday. How much is that altogether, in pounds?"
                answer: "36900"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Estimate: 2800 + 6300 ≈ ?"
            options: ["9000", "8000", "10,000"]
            answer: "9000"
          - id: l1-c2
            type: fill_in_blank
            text: "Add 4100 + 3680 in steps."
            frame: "4100 + 3000 = _; then + 600 = _; then + 80 = _"
            options: ["7100", "7700", "7780", "4780", "7180"]
            answer: ["7100", "7700", "7780"]
          - id: l1-c3
            type: text_input
            text: "3200 + 5400 = _"
            answer: "8600"
          - id: l1-c4
            type: multiple_choice
            text: "Estimate: 3100 + 4800 ≈ ?"
            options: ["8000", "7000", "9000"]
            answer: "8000"
          - id: l1-c5
            type: true_false
            text: "Does this fit the estimate? 5800 + 2100 = 9900"
            answer: false
          - id: l1-c6
            type: text_input
            text: "6200 + 2650 = _"
            answer: "8850"

  - n: 2
    title: { de: "Schrittweise subtrahieren", en: "Subtract in steps" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Estimate: 5900 + 3200 ≈ ?"
            options: ["9000", "8000", "10,000"]
            answer: "9000"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "2300 + 4600 = _"
            answer: "6900"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8950 − 3100\nEstimate: 9000 − 3000 = 6000"
            say: "Subtraction starts with an estimate too. Eight thousand nine hundred and fifty is about nine thousand. Three thousand one hundred is about three thousand. The answer should be about six thousand."
          - text: "8950 − 3000 = 5950\n5950 − 100 = 5850"
            say: "Take away in steps: first the thousands, then the hundreds. Each step starts from the last answer. Five thousand eight hundred and fifty is close to six thousand."
            show: { drawn: rechenstrich, start: 8950, jumps: [-3000, -100] }
          - text: "5200 − 4800\n4800 + 200 = 5000\n5000 + 200 = 5200\n200 + 200 = 400"
            say: "When two numbers are close together, count on from the smaller one to find the difference. From four thousand eight hundred to five thousand is two hundred. On to five thousand two hundred is another two hundred. The difference is four hundred."
            show: { drawn: rechenstrich, start: 4800, jumps: [200, 200] }
          - text: "Ben: 8400 − 3200 = 7200\nEstimate: 8000 − 3000 = 5000"
            say: "Ben got seven thousand two hundred. The estimate is five thousand, which is a long way off. So Ben should check his steps. The right answer is five thousand two hundred."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Subtract 9480 − 4200 in steps."
                show: { drawn: rechenstrich, start: 9480, jumps: [-4000, -200] }
                frame: "9480 − 4000 = _; then − 200 = _"
                options: ["5480", "5280", "5680", "9280"]
                answer: ["5480", "5280"]
                hints:
                  - "Take away the thousands first, then the hundreds."
                  - "9480 − 4000 = 5480. Go on from 5480."
                  - "5480, then 5280."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Does this fit the estimate? 6800 − 2100 = 8900"
                answer: false
                hints:
                  - "Estimate first: round both numbers to the nearest thousand."
                  - "7000 − 2000 = 5000."
                  - "No. 8900 is far from 5000. It looks like an addition."
              - id: l2-f3
                type: multiple_choice
                text: "Estimate: 9200 − 3900 ≈ ?"
                options: ["5000", "6000", "13,000"]
                answer: "5000"
                hints:
                  - "Round each number to the nearest thousand."
                  - "9200 is about 9000. 3900 is about 4000."
                  - "9000 − 4000 = 5000."
              - id: l2-f4
                type: multiple_choice
                text: "Find the difference by counting on: 6100 − 5700"
                show: { drawn: rechenstrich, start: 5700, jumps: [300, 100] }
                options: ["400", "1600", "600"]
                answer: "400"
                feedback:
                  "1600": "That takes the smaller digit from the bigger one in each place. Count on from 5700 instead."
                hints:
                  - "Start at 5700 and count on to 6100."
                  - "5700 to 6000 is 300. 6000 to 6100 is 100."
                  - "300 + 100 = 400."
              - id: l2-f5
                type: text_input
                text: "7650 − 2300 = _"
                answer: "5350"
                hints:
                  - "Take away 2000 first."
                  - "7650 − 2000 = 5650. Then take away 300."
                  - "5350."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Subtract 6590 − 3400 in steps."
                frame: "6590 − 3000 = _; then − 400 = _"
                options: ["3590", "3190", "3990", "6190"]
                answer: ["3590", "3190"]
                hints: ["Start the second step from 3590."]
              - id: l2-s2
                type: true_false
                text: "Does this fit the estimate? 9100 − 4800 = 4300"
                answer: true
                hints: ["9000 − 5000 = 4000."]
              - id: l2-s3
                type: multiple_choice
                text: "Estimate: 47,800 − 21,900 ≈ ?"
                say: "Estimate forty-seven thousand eight hundred subtract twenty-one thousand nine hundred."
                options: ["26,000", "36,000", "70,000"]
                answer: "26,000"
                hints: ["48,000 − 22,000."]
              - id: l2-s4
                type: text_input
                text: "Count on to find the difference: 8200 − 7900 = _"
                answer: "300"
                hints: ["7900 to 8000, then 8000 to 8200."]
              - id: l2-s5
                type: text_input
                text: "5870 − 1500 = _"
                answer: "4370"
                hints: ["Take away 1000, then 500."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Subtract 8260 − 5100 in steps."
                frame: "8260 − 5000 = _; then − 100 = _"
                options: ["3260", "3160", "3360", "8160"]
                answer: ["3260", "3160"]
              - id: l2-n2
                type: true_false
                text: "Does this fit the estimate? 7300 − 3200 = 7100"
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Estimate: 8900 − 6200 ≈ ?"
                options: ["3000", "2000", "15,000"]
                answer: "3000"
              - id: l2-n4
                type: text_input
                text: "Count on to find the difference: 10,000 − 9600 = _"
                say: "Count on to find the difference. Ten thousand subtract nine thousand six hundred."
                answer: "400"
              - id: l2-n5
                type: text_input
                text: "A stadium has 45,800 seats. 23,500 are filled. How many seats are empty?"
                say: "A stadium has forty-five thousand eight hundred seats. Twenty-three thousand five hundred are filled. How many seats are empty?"
                answer: "22300"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: estimate
            type: multiple_choice
            text: "Estimate: 4900 + 3800 ≈ ?"
            options: ["9000", "8000", "7000"]
            answer: "9000"
          - id: l2-c2
            part: add-steps
            type: fill_in_blank
            text: "Add 3400 + 5270 in steps."
            frame: "3400 + 5000 = _; then + 200 = _; then + 70 = _"
            options: ["8400", "8600", "8670", "3670", "8470"]
            answer: ["8400", "8600", "8670"]
          - id: l2-c3
            part: subtract-steps
            type: text_input
            text: "8640 − 3200 = _"
            answer: "5440"
          - id: l2-c4
            part: check
            type: true_false
            text: "Does this fit the estimate? 9300 − 2800 = 8500"
            answer: false
          - id: l2-c5
            part: subtract-steps
            type: text_input
            text: "Count on to find the difference: 7100 − 6800 = _"
            answer: "300"
          - id: l2-c6
            part: estimate
            type: multiple_choice
            text: "Estimate: 6400 + 1800 ≈ ?"
            options: ["8000", "9000", "7000"]
            answer: "8000"
          - id: l2-c7
            part: estimate
            type: multiple_choice
            text: "Estimate: 8700 − 4400 ≈ ?"
            options: ["5000", "4000", "13,000"]
            answer: "5000"
          - id: l2-c8
            part: estimate
            type: text_input
            text: "Round to the nearest thousand and estimate: 23,800 + 41,200 ≈ _"
            say: "Round to the nearest thousand and estimate. Twenty-three thousand eight hundred add forty-one thousand two hundred."
            answer: "65000"
          - id: l2-c9
            part: estimate
            type: true_false
            text: "Is this a good estimate? 5900 + 3100 ≈ 6000 + 3000 = 9000"
            answer: true
          - id: l2-c10
            part: add-steps
            type: fill_in_blank
            text: "Add 2700 + 6140 in steps."
            frame: "2700 + 6000 = _; then + 100 = _; then + 40 = _"
            options: ["8700", "8800", "8840", "2840", "8740"]
            answer: ["8700", "8800", "8840"]
          - id: l2-c11
            part: add-steps
            type: text_input
            text: "4200 + 3750 = _"
            answer: "7950"
          - id: l2-c12
            part: add-steps
            type: text_input
            text: "21,300 + 46,500 = _"
            say: "Twenty-one thousand three hundred add forty-six thousand five hundred."
            answer: "67800"
          - id: l2-c13
            part: add-steps
            type: multiple_choice
            text: "Which steps add 5300 + 2460 correctly?"
            options: ["5300 + 2000, then + 400, then + 60", "5300 + 2000, then + 46", "5000 + 2000, then + 460"]
            answer: "5300 + 2000, then + 400, then + 60"
          - id: l2-c14
            part: subtract-steps
            type: fill_in_blank
            text: "Subtract 7860 − 2500 in steps."
            frame: "7860 − 2000 = _; then − 500 = _"
            options: ["5860", "5360", "5460", "7360"]
            answer: ["5860", "5360"]
          - id: l2-c15
            part: subtract-steps
            type: text_input
            text: "Count on to find the difference: 6050 − 5800 = _"
            answer: "250"
          - id: l2-c16
            part: subtract-steps
            type: multiple_choice
            text: "A school has £36,400. It spends £12,300 on a new playground. How much money is left?"
            say: "A school has thirty-six thousand four hundred pounds. It spends twelve thousand three hundred pounds on a new playground. How much money is left?"
            options: ["£24,100", "£48,700", "£24,700"]
            answer: "£24,100"
          - id: l2-c17
            part: check
            type: true_false
            text: "Does this fit the estimate? 4700 + 3200 = 7900"
            answer: true
          - id: l2-c18
            part: check
            type: multiple_choice
            text: "Is there a mistake? Mia subtracts 7450 − 3200.\n7450 − 3000 = 4450\n7450 − 200 = 7250"
            options: ["Yes, the second step should start from 4450.", "Yes, 7450 − 3000 is not 4450.", "No, the answer is 7250."]
            answer: "Yes, the second step should start from 4450."
          - id: l2-c19
            part: check
            type: multiple_choice
            text: "Ali works out 8200 − 2900 and gets 6300. Which estimate shows that his answer is too big?"
            options: ["8000 − 3000 = 5000", "8000 − 2000 = 6000", "9000 − 3000 = 6000"]
            answer: "8000 − 3000 = 5000"
          - id: l2-c20
            part: check
            type: true_false
            text: "Is there a mistake? Leo adds 3500 + 4280.\n3500 + 4000 = 7500\n7500 + 200 = 7700\n7700 + 80 = 7780"
            answer: false
