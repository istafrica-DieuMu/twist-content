# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.squares-cubes
skill: math.mult-div-larger.squares-cubes
curriculum: en-GB
language: en
title:
  de: Quadrat- und Kubikzahlen
  en: Square and cube numbers
summary: >
  Square numbers as dots in a square and cube numbers as small cubes in a
  big cube, with the notation 5² (five squared, 5 × 5) and 2³ (two cubed,
  2 × 2 × 2). Lesson 1 works out and recognises square numbers up to 12²;
  lesson 2 builds cube numbers, squares multiples of ten (30² = 900),
  uses both in tile, box and tank problems, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.squares, math.mult-div-larger.tens]
  also_practises: [math.mult-div.squares]
  vocabulary: { en: [square number, squared, cube number, cubed, notation, product, multiple of ten] }
  forms: [drawn, text, audio]
  drawn: [dots, cubes]
  facets: [operation-signs]
  parts:
    - { id: squares, what: { de: Quadratzahlen mit der Schreibweise 5² ausrechnen, en: working out square numbers written as 5² } }
    - { id: cubes, what: { de: Kubikzahlen mit der Schreibweise 2³ ausrechnen, en: working out cube numbers written as 2³ } }
    - { id: recognise, what: { de: Quadrat- und Kubikzahlen erkennen, en: recognising square and cube numbers } }
    - { id: in-context, what: { de: Sachaufgaben mit Quadrat- und Kubikzahlen, en: problems with square and cube numbers } }
  misconceptions:
    - id: times-the-power
      what: Reads 5² as 5 × 2 or 2³ as 2 × 3
      addressed: lesson 1 Learn and lesson 2 Learn say what the small number means; l1-f1 and l2-f1 have feedback, l1-s4, l2-s4 and every power task offers the product
    - id: square-cube-mixed
      what: Mixes up square and cube numbers (3³ = 9)
      addressed: lesson 2 Learn shows a square of dots beside a cube of cubes; l2-s3, l2-s4, l2-n5 and l2-c4 ask it
    - id: tens-squared
      what: Squares a multiple of ten and writes one zero too few (30² = 90 or 300)
      addressed: lesson 2 Learn squares 30 as 3 × 3 and two zeros; l2-f5, l2-s5 and l2-c5 ask it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Quadratzahlen, en: Square numbers }
    goal:
      de: "Erkenne Quadratzahlen bis 144 und rechne sie aus, so wie 5 hoch 2 ist 5 mal 5, also 25."
      en: "Find and recognise square numbers up to 144, like 5 squared is 5 times 5, which is 25."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "6 × 6 = _"
            options: ["36", "12", "30"]
            answer: "36"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "3 × 40 = _"
            options: ["120", "12", "1200"]
            answer: "120"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Can you lay 16 counters in a square? What about 15? Guess!"
            say: "You want to lay counters in a square, with the same number of rows as counters in each row. Can you do it with sixteen counters? What about fifteen? Have a guess."
          - text: "4 × 4 = 16\n16 is a square number."
            say: "Four rows of four dots make a square. Four times four is sixteen, so sixteen is a square number. Fifteen counters can never make a square, so fifteen is not a square number."
            show: { drawn: dots, array: [4, 4] }
          - text: "5² = 5 × 5 = 25\nSay: five squared."
            say: "There is a short way to write a number times itself. Write a small two at the top: five with a small two means five times five. We say five squared, and it is twenty-five."
            show: { drawn: dots, array: [5, 5] }
          - text: "5² is not 5 × 2."
            say: "Be careful. The small two does not mean times two. It means two fives multiplied together: five times five."
          - text: "1² = 1, 2² = 4, 3² = 9, 4² = 16, 5² = 25, 6² = 36\n7² = 49, 8² = 64, 9² = 81, 10² = 100, 11² = 121, 12² = 144"
            say: "These are the square numbers up to twelve squared. You know them from the times tables: they are where each times table meets itself."
          - text: "Did you know? Add up odd numbers from 1 and you always get a square number.\n1 + 3 = 4\n1 + 3 + 5 = 9\n1 + 3 + 5 + 7 = 16"
            say: "Did you know? Start at one and add the odd numbers in order. One add three is four. Add five more: nine. Add seven more: sixteen. Every time, you land on a square number! Each odd number adds a new row and a new column round the corner of the square."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is 3²?"
                say: "What is three squared?"
                options: ["9", "6", "32"]
                answer: "9"
                feedback:
                  "6": "3² means 3 × 3, not 3 × 2."
                hints:
                  - "The small 2 means the number times itself."
                  - "3² = 3 × 3."
                  - "3 × 3 = 9."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which square number do the dots show?"
                show: { drawn: dots, array: [6, 6] }
                options: ["36", "12", "24"]
                answer: "36"
                hints:
                  - "How many rows, and how many in each row?"
                  - "6 rows of 6 dots: 6²."
                  - "6 × 6 = 36."
              - id: l1-f3
                type: fill_in_blank
                text: "Work out 7²."
                say: "Work out seven squared."
                frame: "7² = _ × _ = _"
                options: ["2", "7", "14", "49"]
                answer: ["7", "7", "49"]
                hints:
                  - "7² is 7 times itself."
                  - "7 × 7."
                  - "7 × 7 = 49."
              - id: l1-f4
                type: multiple_choice
                text: "Which number is a square number?"
                options: ["64", "24", "32"]
                answer: "64"
                hints:
                  - "A square number is a number times itself."
                  - "Is there a number that times itself makes 64, 24 or 32?"
                  - "8 × 8 = 64."
              - id: l1-f5
                type: text_input
                text: "10² = _"
                say: "What is ten squared?"
                answer: "100"
                hints:
                  - "10² = 10 × 10."
                  - "Ten tens."
                  - "100."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What is 8²?"
                say: "What is eight squared?"
                options: ["64", "16", "82"]
                answer: "64"
                hints: ["8 × 8."]
              - id: l1-s2
                type: text_input
                text: "9² = _"
                say: "What is nine squared?"
                answer: "81"
                hints: ["9 × 9."]
              - id: l1-s3
                type: multiple_choice
                text: "Which number is not a square number?"
                options: ["49", "81", "50"]
                answer: "50"
                hints: ["7 × 7 = 49 and 9 × 9 = 81."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 4² = 8"
                say: "Is it true? Four squared is eight."
                answer: false
                hints: ["4² means 4 × 4."]
              - id: l1-s5
                type: multiple_choice
                text: "Which is the same as 11 × 11?"
                options: ["11²", "22", "11 + 11"]
                answer: "11²"
                option_audio: false
                hints: ["A number times itself is that number squared."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "12² = _"
                say: "What is twelve squared?"
                answer: "144"
              - id: l1-n2
                type: multiple_choice
                text: "A square garden has sides of 7 m. Its area is 7² m². What is the area?"
                say: "A square garden has sides of seven metres. Its area is seven squared square metres. What is the area?"
                options: ["49 m²", "14 m²", "28 m²"]
                answer: "49 m²"
              - id: l1-n3
                type: text_input
                text: "6² + 1 = _"
                say: "What is six squared add one?"
                answer: "37"
              - id: l1-n4
                type: multiple_choice
                text: "Which square number is between 70 and 90?"
                options: ["81", "75", "80"]
                answer: "81"
              - id: l1-n5
                type: true_false
                text: "Is it true? 1² = 1"
                say: "Is it true? One squared is one."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is 5²?"
            say: "What is five squared?"
            options: ["25", "10", "52"]
            answer: "25"
          - id: l1-c2
            type: text_input
            text: "4² = _"
            say: "What is four squared?"
            answer: "16"
          - id: l1-c3
            type: multiple_choice
            text: "Which number is a square number?"
            options: ["36", "26", "18"]
            answer: "36"
          - id: l1-c4
            type: text_input
            text: "2² = _"
            say: "What is two squared?"
            answer: "4"
          - id: l1-c5
            type: true_false
            text: "Is it true? 9² = 18"
            say: "Is it true? Nine squared is eighteen."
            answer: false
          - id: l1-c6
            type: true_false
            text: "Is it true? The dots show 3² = 9."
            say: "Is it true? The dots show three squared, which is nine."
            show: { drawn: dots, array: [3, 3] }
            answer: true

  - n: 2
    title: { de: Kubikzahlen, en: Cube numbers }
    goal:
      de: "Bau Kubikzahlen aus kleinen Würfeln, so wie 2 hoch 3 ist 2 mal 2 mal 2, also 8."
      en: "Build cube numbers from small cubes, like 2 cubed is 2 times 2 times 2, which is 8."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is 11²?"
            say: "What is eleven squared?"
            options: ["121", "22", "112"]
            answer: "121"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "3² = _"
            say: "What is three squared?"
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "You build a bigger cube out of small cubes. What is the smallest number of small cubes you need? Guess!"
            say: "You want to build a bigger cube out of small cubes, all the same size. What is the smallest number of small cubes you need? Have a guess."
          - text: "2 × 2 × 2 = 8\n8 is a cube number."
            say: "Two layers of two by two small cubes make a bigger cube. Two times two times two is eight, so eight is a cube number. Eight is the smallest number of small cubes that makes a bigger cube."
            show: { drawn: cubes, plan: [[2, 2], [2, 2]], mode: building }
          - text: "2³ = 2 × 2 × 2 = 8\nSay: two cubed."
            say: "A small three at the top means three of the number multiplied together. Two with a small three is two times two times two. We say two cubed. It is eight, not two times three."
          - text: "3³ = 3 × 3 × 3 = 9 × 3 = 27\nCube numbers: 1, 8, 27, 64, 125 ... 10³ = 1000"
            say: "Three cubed is three times three times three. Three times three is nine, and nine times three is twenty-seven. The cube numbers start one, eight, twenty-seven, sixty-four, one hundred and twenty-five. Ten cubed is one thousand."
            show: { drawn: cubes, plan: [[3, 3, 3], [3, 3, 3], [3, 3, 3]], mode: building }
          - text: "30² = 30 × 30 = 900\n3 × 3 = 9, then two zeros"
            say: "Use your times tables to square a multiple of ten. Thirty squared is thirty times thirty. Three times three is nine, and each thirty brings a zero, so the answer is nine hundred."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is 2³?"
                say: "What is two cubed?"
                options: ["8", "6", "23"]
                answer: "8"
                feedback:
                  "6": "2³ means 2 × 2 × 2, not 2 × 3."
                hints:
                  - "The small 3 means three 2s multiplied together."
                  - "2 × 2 = 4, then × 2 again."
                  - "4 × 2 = 8."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How many small cubes make this big cube?"
                show: { drawn: cubes, plan: [[3, 3, 3], [3, 3, 3], [3, 3, 3]], mode: building }
                options: ["27", "9", "18"]
                answer: "27"
                hints:
                  - "Count the cubes in one layer first."
                  - "One layer is 3 × 3 = 9 cubes. There are 3 layers."
                  - "9 × 3 = 27."
              - id: l2-f3
                type: fill_in_blank
                text: "Work out 4³."
                say: "Work out four cubed."
                frame: "4³ = 4 × 4 × 4 = 16 × 4 = _"
                options: ["12", "16", "48", "64"]
                answer: ["64"]
                hints:
                  - "4 × 4 = 16 first."
                  - "Then 16 × 4: double 16, then double again."
                  - "16 × 4 = 64."
              - id: l2-f4
                type: multiple_choice
                text: "Which number is a cube number?"
                options: ["125", "25", "100"]
                answer: "125"
                hints:
                  - "A cube number is a number times itself, times itself again."
                  - "Try 5 × 5 × 5."
                  - "5 × 5 = 25, and 25 × 5 = 125."
              - id: l2-f5
                type: text_input
                text: "30² = _"
                say: "What is thirty squared?"
                answer: "900"
                hints:
                  - "30² = 30 × 30."
                  - "3 × 3 = 9. Each 30 brings a zero."
                  - "900."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "5³ = _"
                say: "What is five cubed?"
                answer: "125"
                hints: ["5 × 5 = 25, then × 5."]
              - id: l2-s2
                type: multiple_choice
                text: "What is 10³?"
                say: "What is ten cubed?"
                options: ["1000", "30", "100"]
                answer: "1000"
                hints: ["10 × 10 × 10."]
              - id: l2-s3
                type: multiple_choice
                text: "Which number is both a square number and a cube number?"
                options: ["64", "16", "27"]
                answer: "64"
                hints: ["8 × 8 and 4 × 4 × 4."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 3³ = 9"
                say: "Is it true? Three cubed is nine."
                answer: false
                hints: ["3³ = 3 × 3 × 3."]
              - id: l2-s5
                type: multiple_choice
                text: "What is 40²?"
                say: "What is forty squared?"
                options: ["1600", "160", "80"]
                answer: "1600"
                hints: ["4 × 4 = 16, and two zeros."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A box is a cube made of small cubes, 4 along each edge. How many small cubes are in it?"
                answer: "64"
              - id: l2-n2
                type: multiple_choice
                text: "A square tile pattern has 9 tiles along each side. How many tiles are there?"
                options: ["81", "18", "36"]
                answer: "81"
              - id: l2-n3
                type: text_input
                text: "A puzzle says: 2³ + 3² = _"
                say: "A puzzle says: two cubed add three squared. What is the answer?"
                answer: "17"
              - id: l2-n4
                type: multiple_choice
                text: "A cube-shaped tank is 10 cm along each edge. It holds 10³ cm³. How much is that?"
                say: "A cube-shaped tank is ten centimetres along each edge. It holds ten cubed cubic centimetres. How much is that?"
                options: ["1000 cm³", "30 cm³", "100 cm³"]
                answer: "1000 cm³"
              - id: l2-n5
                type: true_false
                text: "Is it true? 6² is greater than 3³."
                say: "Is it true? Six squared is greater than three cubed."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: squares
            type: multiple_choice
            text: "What is 6²?"
            say: "What is six squared?"
            options: ["36", "12", "62"]
            answer: "36"
          - id: l2-c2
            part: cubes
            type: text_input
            text: "1³ + 2³ = _"
            say: "What is one cubed add two cubed?"
            answer: "9"
          - id: l2-c3
            part: recognise
            type: multiple_choice
            text: "Which number is a square number?"
            options: ["100", "50", "20"]
            answer: "100"
          - id: l2-c4
            part: recognise
            type: multiple_choice
            text: "Which number is a cube number?"
            options: ["27", "9", "12"]
            answer: "27"
          - id: l2-c5
            part: squares
            type: text_input
            text: "20² = _"
            say: "What is twenty squared?"
            answer: "400"
          - id: l2-c6
            part: squares
            type: multiple_choice
            text: "_² = 81"
            say: "Which number squared makes eighty-one?"
            options: ["9", "8", "40"]
            answer: "9"
          - id: l2-c7
            part: squares
            type: text_input
            text: "50² = _"
            say: "What is fifty squared?"
            answer: "2500"
          - id: l2-c8
            part: squares
            type: true_false
            text: "Is it true? 7² = 14"
            say: "Is it true? Seven squared is fourteen."
            answer: false
          - id: l2-c9
            part: in-context
            type: multiple_choice
            text: "A chessboard is a square with 8 small squares along each side. How many small squares does it have?"
            options: ["64", "16", "32"]
            answer: "64"
          - id: l2-c10
            part: cubes
            type: text_input
            text: "6³ = _"
            say: "What is six cubed?"
            answer: "216"
          - id: l2-c11
            part: cubes
            type: multiple_choice
            text: "What is 1³?"
            say: "What is one cubed?"
            options: ["1", "3", "13"]
            answer: "1"
          - id: l2-c12
            part: cubes
            type: true_false
            text: "Is it true? 10³ is ten times as much as 10²."
            say: "Is it true? Ten cubed is ten times as much as ten squared."
            answer: true
          - id: l2-c13
            part: cubes
            type: multiple_choice
            text: "Which is the same as 4 × 4 × 4?"
            say: "Which is the same as four times four times four?"
            options: ["4³", "4²", "12"]
            answer: "4³"
            option_audio: false
          - id: l2-c14
            part: recognise
            type: multiple_choice
            text: "Which number is not a square number?"
            options: ["121", "144", "124"]
            answer: "124"
          - id: l2-c15
            part: recognise
            type: true_false
            text: "Is it true? 1000 is a cube number."
            say: "Is it true? One thousand is a cube number."
            answer: true
          - id: l2-c16
            part: recognise
            type: multiple_choice
            text: "Which two numbers are both square numbers?"
            options: ["25 and 49", "25 and 50", "16 and 27"]
            answer: "25 and 49"
          - id: l2-c17
            part: in-context
            type: text_input
            text: "A square patio has 11 slabs along each side. How many slabs are there in all?"
            answer: "121"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "A big cube is built from small cubes, 5 along each edge. How many small cubes is that?"
            options: ["125", "15", "25"]
            answer: "125"
          - id: l2-c19
            part: in-context
            type: true_false
            text: "A square has sides of 9 cm. Mia says its area is 18 cm². Is she right?"
            answer: false
          - id: l2-c20
            part: in-context
            type: text_input
            text: "Sam thinks of a number. He squares it and gets 49. What was his number?"
            answer: "7"
