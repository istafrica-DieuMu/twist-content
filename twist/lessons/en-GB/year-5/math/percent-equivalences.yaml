# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.percent-equivalences
skill: math.percentages-ratio.equivalences
curriculum: en-GB
language: en
title:
  de: Brüche, Prozent und Dezimalzahlen
  en: Fractions, percentages and decimals
summary: >
  The fractions Year 5 should know as percentages and decimals by heart:
  1/2, 1/4, 3/4, 1/5, 2/5 and 4/5, then any fraction over 10 or 25.
  Lesson 1 sees halves, quarters and fifths on a hundred field; lesson 2
  turns tenths and twenty-fifths into hundredths, compares amounts written
  in different ways, uses them in test scores, and ends with the skill
  check.
metadata:
  year: year-5
  topic: { de: Prozent, en: Percentages }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.percentages-ratio.percent-meaning]
  also_practises: [math.percentages-ratio.percent-meaning]
  vocabulary: { en: [per cent, percentage, fraction, decimal, hundredths, half, quarter, fifth, tenth, twenty-fifth, equivalent] }
  forms: [drawn, text, audio]
  drawn: [hundred-field]
  facets: [number-format]
  parts:
    - { id: known, what: { de: "Halbe, Viertel und Fünftel als Prozent und Dezimalzahl", en: "halves, quarters and fifths as percentages and decimals" } }
    - { id: tenths-25ths, what: { de: Brüche mit dem Nenner 10 oder 25 als Prozent und Dezimalzahl, en: fractions over 10 or 25 as percentages and decimals } }
    - { id: compare, what: { de: verschieden geschriebene Anteile vergleichen, en: comparing amounts written in different ways } }
    - { id: in-context, what: { de: Prozent und Brüche in Sachaufgaben, en: using them in scores and everyday amounts } }
  misconceptions:
    - id: digits-joined
      what: Writes the digits of the fraction side by side (1/2 as 12%, 4/5 as 0.45)
      addressed: lesson 1 Learn builds each percentage from the hundred field; l1-f1 and l1-f4 have feedback on the joined digits, l1-s1 and l1-n2 offer them again
    - id: denominator-as-percent
      what: Reads the denominator as the percentage (1/4 is 4%, 1/5 is 5%)
      addressed: l1-f2 has feedback on 4%, l1-n1 and l1-n3 offer 5%
    - id: not-out-of-100
      what: Reads a fraction over 10 or 25 as hundredths without converting (3/25 is 3%, 7/10 is 7%)
      addressed: lesson 2 Learn multiplies top and bottom to make hundredths; l2-f1 and l2-f3 have feedback, l2-s5, l2-n2 and l2-c3 ask it again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Halbe, Viertel und Fünftel", en: "Halves, quarters and fifths" }
    goal:
      de: "Lerne Halbe, Viertel und Fünftel als Prozent und als Dezimalzahl auswendig, so wie ein Viertel ist 25 Prozent."
      en: "Learn halves, quarters and fifths as percentages and decimals by heart, like 1 quarter is 25 per cent."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Write 37/100 as a percentage."
            say: "Write thirty-seven hundredths as a percentage."
            options: ["37%", "3.7%", "0.37%"]
            answer: "37%"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Write 45% as a decimal."
            options: ["0.45", "4.5", "45.0"]
            answer: "0.45"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1/2 = 50/100 = 50% = 0.5"
            say: "The whole field is one hundred per cent. Half of the field is fifty dots out of a hundred. So one half is fifty per cent, and as a decimal it is zero point five."
            show: { drawn: hundred-field, filled: 50 }
          - text: "1/4 = 25/100 = 25% = 0.25\n3/4 = 75/100 = 75% = 0.75"
            say: "A quarter of a hundred is twenty-five. So one quarter is twenty-five per cent, or zero point two five. Three quarters are three lots of twenty-five: seventy-five per cent, or zero point seven five."
            show: { drawn: hundred-field, filled: 25 }
          - text: "1/5 = 20/100 = 20% = 0.2\n2/5 = 40% = 0.4\n4/5 = 80% = 0.8"
            say: "A fifth of a hundred is twenty. So one fifth is twenty per cent, or zero point two. Two fifths are forty per cent, and four fifths are eighty per cent."
            show: { drawn: hundred-field, filled: 20 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is 1/2 as a percentage?"
                say: "What is one half as a percentage?"
                options: ["50%", "12%", "2%"]
                answer: "50%"
                feedback:
                  "12%": "1/2 is not the digits 1 and 2 put together. Half of 100 is 50, so it is 50%."
                hints:
                  - "Per cent means out of 100."
                  - "What is half of 100?"
                  - "Half of 100 is 50, so 1/2 = 50%."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "The whole field is 100%. What percentage is filled?"
                show: { drawn: hundred-field, filled: 25 }
                options: ["25%", "4%", "75%"]
                answer: "25%"
                feedback:
                  "4%": "There are 4 quarters in a whole, but each quarter is 25 out of 100."
                hints:
                  - "Count the dots that are filled, out of 100."
                  - "Two and a half rows are filled. Each row is 10."
                  - "25 out of 100 is 25%."
              - id: l1-f3
                type: fill_in_blank
                text: "Write 1/5 as a percentage and as a decimal."
                say: "Write one fifth as a percentage and as a decimal."
                frame: "1/5 = _% = _"
                options: ["5", "20", "0.2", "0.5"]
                answer: ["20", "0.2"]
                hints:
                  - "Split 100 into 5 equal parts."
                  - "100 ÷ 5 = 20, so one fifth is 20 out of 100."
                  - "20% and 0.2."
              - id: l1-f4
                type: multiple_choice
                text: "What is 4/5 as a decimal?"
                say: "What is four fifths as a decimal?"
                options: ["0.8", "0.45", "0.4"]
                answer: "0.8"
                feedback:
                  "0.45": "That puts the 4 and the 5 side by side. One fifth is 0.2, so four fifths are 4 × 0.2 = 0.8."
                hints:
                  - "Start with one fifth."
                  - "One fifth is 0.2. Four fifths are four lots of 0.2."
                  - "4 × 0.2 = 0.8."
              - id: l1-f5
                type: matching
                text: "Match each fraction with its percentage."
                pairs:
                  - { left: { text: "1/2" }, right: { text: "50%" } }
                  - { left: { text: "1/4" }, right: { text: "25%" } }
                  - { left: { text: "3/4" }, right: { text: "75%" } }
                  - { left: { text: "2/5" }, right: { text: "40%" } }
                hints:
                  - "Turn each fraction into hundredths."
                  - "A quarter is 25 out of 100 and a fifth is 20 out of 100."
                  - "1/2 = 50%, 1/4 = 25%, 3/4 = 75%, 2/5 = 40%."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What is 3/4 as a percentage?"
                say: "What is three quarters as a percentage?"
                options: ["75%", "34%", "25%"]
                answer: "75%"
                hints: ["One quarter is 25%. Three quarters are three lots of that."]
              - id: l1-s2
                type: multiple_choice
                text: "What is 2/5 as a decimal?"
                say: "What is two fifths as a decimal?"
                options: ["0.4", "0.25", "0.2"]
                answer: "0.4"
                hints: ["One fifth is 0.2."]
              - id: l1-s3
                type: multiple_choice
                text: "The whole field is 100%. What percentage is filled?"
                show: { drawn: hundred-field, filled: 80 }
                options: ["80%", "8%", "20%"]
                answer: "80%"
                hints: ["Each full row is 10 dots, so 10%."]
              - id: l1-s4
                type: text_input
                text: "1/4 = _%"
                say: "One quarter is how many per cent?"
                answer: "25"
                hints: ["Split 100 into 4 equal parts."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 1/5 = 20% = 0.2"
                say: "Is it true? One fifth is twenty per cent, and zero point two."
                answer: true
                hints: ["100 ÷ 5 = 20."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What is 1/5 as a percentage?"
                say: "What is one fifth as a percentage?"
                options: ["20%", "15%", "5%"]
                answer: "20%"
              - id: l1-n2
                type: multiple_choice
                text: "Write 3/4 as a decimal."
                say: "Write three quarters as a decimal."
                options: ["0.75", "0.34", "3.4"]
                answer: "0.75"
              - id: l1-n3
                type: multiple_choice
                text: "Which is the same as 0.5?"
                options: ["1/2", "1/5", "5%"]
                answer: "1/2"
              - id: l1-n4
                type: text_input
                text: "4/5 = _%"
                say: "Four fifths is how many per cent?"
                answer: "80"
              - id: l1-n5
                type: true_false
                text: "Is it true? 1/4 = 0.4"
                say: "Is it true? One quarter is zero point four."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is 2/5 as a percentage?"
            say: "What is two fifths as a percentage?"
            options: ["40%", "25%", "20%"]
            answer: "40%"
          - id: l1-c2
            type: multiple_choice
            text: "Write 1/4 as a decimal."
            say: "Write one quarter as a decimal."
            options: ["0.25", "0.4", "0.14"]
            answer: "0.25"
          - id: l1-c3
            type: multiple_choice
            text: "Which is the same as 75%?"
            options: ["3/4", "7/5", "1/4"]
            answer: "3/4"
          - id: l1-c4
            type: multiple_choice
            text: "The whole field is 100%. Which fraction of the field is filled?"
            show: { drawn: hundred-field, filled: 40 }
            options: ["2/5", "1/4", "4/5"]
            answer: "2/5"
          - id: l1-c5
            type: matching
            text: "Match each fraction with its decimal."
            pairs:
              - { left: { text: "1/2" }, right: { text: "0.5" } }
              - { left: { text: "1/5" }, right: { text: "0.2" } }
              - { left: { text: "3/4" }, right: { text: "0.75" } }
              - { left: { text: "4/5" }, right: { text: "0.8" } }
          - id: l1-c6
            type: true_false
            text: "Is it true? 3/4 = 0.34"
            say: "Is it true? Three quarters is zero point three four."
            answer: false

  - n: 2
    title: { de: Zehntel und Fünfundzwanzigstel, en: Tenths and twenty-fifths }
    goal:
      de: "Mach aus Zehnteln und Fünfundzwanzigsteln Hundertstel und dann Prozent, so wie 7 Fünfundzwanzigstel sind 28 Prozent."
      en: "Turn tenths and twenty-fifths into hundredths and then per cent, like 7 twenty-fifths is 28 per cent."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is 1/2 as a decimal?"
            say: "What is one half as a decimal?"
            options: ["0.5", "0.2", "1.2"]
            answer: "0.5"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "1/5 = _%"
            say: "One fifth is how many per cent?"
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3/10 = 30/100 = 30% = 0.3"
            say: "To turn tenths into a percentage, make hundredths. Ten times ten is a hundred, so multiply the top and the bottom by ten. Three tenths are thirty hundredths: thirty per cent, or zero point three."
            show: { drawn: hundred-field, filled: 30 }
          - text: "7/25 = 28/100 = 28% = 0.28\n(× 4 on the top and the bottom)"
            say: "Twenty-fifths work the same way. Twenty-five times four is a hundred, so multiply the top and the bottom by four. Seven twenty-fifths are twenty-eight hundredths: twenty-eight per cent, or zero point two eight."
            show: { drawn: hundred-field, filled: 28 }
          - text: "2/5 or 35%?\n2/5 = 40%, and 40% > 35%"
            say: "To compare amounts written in different ways, write them all as percentages. Two fifths is forty per cent. Forty per cent is more than thirty-five per cent, so two fifths is bigger."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is 7/10 as a percentage?"
                say: "What is seven tenths as a percentage?"
                options: ["70%", "7%", "17%"]
                answer: "70%"
                feedback:
                  "7%": "7/10 is seven tenths. Each tenth is 10%, so seven tenths are 70%."
                hints:
                  - "Make hundredths first."
                  - "Multiply the top and the bottom by 10: 7/10 = 70/100."
                  - "70/100 is 70%."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Write 9/25 as hundredths and as a percentage."
                say: "Write nine twenty-fifths as hundredths and as a percentage."
                frame: "9/25 = _/100 = _%"
                options: ["9", "34", "36"]
                answer: ["36", "36"]
                hints:
                  - "What do you multiply 25 by to make 100?"
                  - "25 × 4 = 100, so multiply 9 by 4 as well."
                  - "9 × 4 = 36: 36/100 = 36%."
              - id: l2-f3
                type: multiple_choice
                text: "What is 3/25 as a decimal?"
                say: "What is three twenty-fifths as a decimal?"
                options: ["0.12", "0.03", "0.325"]
                answer: "0.12"
                feedback:
                  "0.03": "3/25 is not 3 hundredths. Multiply the top and the bottom by 4: 12/100 = 0.12."
                hints:
                  - "Turn 3/25 into hundredths first."
                  - "Multiply the top and the bottom by 4: 3 × 4 = 12."
                  - "12/100 = 0.12."
              - id: l2-f4
                type: multiple_choice
                text: "Which is bigger, 3/5 or 55%?"
                say: "Which is bigger, three fifths or fifty-five per cent?"
                options: ["3/5", "55%", "They are equal."]
                answer: "3/5"
                keep_order: true
                hints:
                  - "Write 3/5 as a percentage too."
                  - "One fifth is 20%, so three fifths are 60%."
                  - "60% is more than 55%, so 3/5 is bigger."
              - id: l2-f5
                type: text_input
                text: "Amir got 21 out of 25 in a times tables quiz. What percentage is that?"
                answer: "84"
                hints:
                  - "21 out of 25 is the fraction 21/25."
                  - "Multiply the top and the bottom by 4 to make hundredths."
                  - "21 × 4 = 84, so it is 84%."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What is 9/10 as a decimal?"
                say: "What is nine tenths as a decimal?"
                options: ["0.9", "0.09", "9.1"]
                answer: "0.9"
                hints: ["Nine tenths: the 9 goes straight after the decimal point."]
              - id: l2-s2
                type: text_input
                text: "11/25 = _%"
                say: "Eleven twenty-fifths is how many per cent?"
                answer: "44"
                hints: ["Multiply the top and the bottom by 4."]
              - id: l2-s3
                type: multiple_choice
                text: "Which fraction is the same as 0.64?"
                options: ["16/25", "64/25", "6/4"]
                answer: "16/25"
                hints: ["0.64 is 64/100. Which twenty-fifths make 64 hundredths?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which is the smallest?"
                options: ["1/4", "0.3", "22%"]
                answer: "22%"
                hints: ["Write them all as percentages: 1/4 = 25%, 0.3 = 30%."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 6/25 = 6%"
                say: "Is it true? Six twenty-fifths is six per cent."
                answer: false
                hints: ["Multiply the top and the bottom by 4 to make hundredths."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "Zara scored 18 out of 25 in a spelling test. What percentage is that?"
                answer: "72"
              - id: l2-n2
                type: multiple_choice
                text: "A water bottle is 3/10 full. What percentage of the bottle is full?"
                say: "A water bottle is three tenths full. What percentage of the bottle is full?"
                options: ["30%", "3%", "70%"]
                answer: "30%"
              - id: l2-n3
                type: multiple_choice
                text: "In a survey, 13/25 of the class walk to school. Write 13/25 as a decimal."
                say: "In a survey, thirteen twenty-fifths of the class walk to school. Write thirteen twenty-fifths as a decimal."
                options: ["0.52", "0.13", "0.26"]
                answer: "0.52"
              - id: l2-n4
                type: multiple_choice
                text: "Leo ate 1/4 of a pizza. Mia ate 30% of a pizza of the same size. Who ate more?"
                say: "Leo ate one quarter of a pizza. Mia ate thirty per cent of a pizza of the same size. Who ate more?"
                options: ["Leo", "Mia", "They ate the same."]
                answer: "Mia"
                keep_order: true
              - id: l2-n5
                type: true_false
                text: "80% of the tiles are blue. Is it true that 1/5 of the tiles are not blue?"
                say: "Eighty per cent of the tiles are blue. Is it true that one fifth of the tiles are not blue?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: known
            type: multiple_choice
            text: "Write 0.4 as a fraction in fifths."
            options: ["2/5", "4/5", "1/4"]
            answer: "2/5"
          - id: l2-c2
            part: known
            type: text_input
            text: "3/5 = _%"
            say: "Three fifths is how many per cent?"
            answer: "60"
          - id: l2-c3
            part: tenths-25ths
            type: multiple_choice
            text: "What is 17/25 as a percentage?"
            say: "What is seventeen twenty-fifths as a percentage?"
            options: ["68%", "17%", "42%"]
            answer: "68%"
          - id: l2-c4
            part: tenths-25ths
            type: multiple_choice
            text: "Write 8/10 as a decimal."
            say: "Write eight tenths as a decimal."
            options: ["0.8", "0.08", "8.1"]
            answer: "0.8"
          - id: l2-c5
            part: compare
            type: multiple_choice
            text: "Which is the biggest?"
            options: ["2/5", "0.45", "42%"]
            answer: "0.45"
          - id: l2-c6
            part: known
            type: multiple_choice
            text: "Which fraction is the same as 80%?"
            say: "Which fraction is the same as eighty per cent?"
            options: ["4/5", "1/8", "3/4"]
            answer: "4/5"
          - id: l2-c7
            part: known
            type: multiple_choice
            text: "The whole field is 100%. Which fraction of the field is filled?"
            show: { drawn: hundred-field, filled: 75 }
            options: ["3/4", "1/4", "7/5"]
            answer: "3/4"
          - id: l2-c8
            part: known
            type: true_false
            text: "Is it true? 0.2 = 1/2"
            say: "Is it true? Zero point two is one half."
            answer: false
          - id: l2-c9
            part: tenths-25ths
            type: text_input
            text: "4/25 = _%"
            say: "Four twenty-fifths is how many per cent?"
            answer: "16"
          - id: l2-c10
            part: tenths-25ths
            type: multiple_choice
            text: "Write 0.6 as a fraction in tenths."
            say: "Write zero point six as a fraction in tenths."
            options: ["6/10", "6/100", "1/6"]
            answer: "6/10"
          - id: l2-c11
            part: tenths-25ths
            type: fill_in_blank
            text: "Write 23/25 as hundredths and as a decimal."
            say: "Write twenty-three twenty-fifths as hundredths and as a decimal."
            frame: "23/25 = _/100 = _"
            options: ["23", "92", "0.92", "0.23"]
            answer: ["92", "0.92"]
          - id: l2-c12
            part: compare
            type: multiple_choice
            text: "Which is bigger, 7/10 or 65%?"
            say: "Which is bigger, seven tenths or sixty-five per cent?"
            options: ["7/10", "65%", "They are equal."]
            answer: "7/10"
            keep_order: true
          - id: l2-c13
            part: compare
            type: ordering
            text: "Put them in order, smallest first."
            options: ["0.5", "3/10", "45%", "1/4"]
            slot_count: 4
            answer: ["1/4", "3/10", "45%", "0.5"]
          - id: l2-c14
            part: compare
            type: true_false
            text: "Is it true? 3/5 > 0.65"
            say: "Is it true? Three fifths is greater than zero point six five."
            answer: false
          - id: l2-c15
            part: compare
            type: multiple_choice
            text: "Which two are equal?"
            options: ["2/5 and 40%", "1/4 and 0.4", "1/5 and 0.5"]
            answer: "2/5 and 40%"
          - id: l2-c16
            part: in-context
            type: text_input
            text: "Ben scored 19 out of 25 in a maths quiz. What percentage is that?"
            answer: "76"
          - id: l2-c17
            part: in-context
            type: multiple_choice
            text: "A tank is 4/5 full. What percentage of the tank is empty?"
            say: "A tank is four fifths full. What percentage of the tank is empty?"
            options: ["20%", "80%", "45%"]
            answer: "20%"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "Ava has read 3/4 of a book. Sam has read 70% of the same book. Who has read more?"
            say: "Ava has read three quarters of a book. Sam has read seventy per cent of the same book. Who has read more?"
            options: ["Ava", "Sam", "They have read the same."]
            answer: "Ava"
            keep_order: true
          - id: l2-c19
            part: in-context
            type: true_false
            text: "In a class, 7/10 of the children have a pet. Is it true that 70% of the children have a pet?"
            say: "In a class, seven tenths of the children have a pet. Is it true that seventy per cent of the children have a pet?"
            answer: true
          - id: l2-c20
            part: in-context
            type: text_input
            keyboard: decimal
            text: "A bakery sells 12/25 of its cakes by lunchtime. Write 12/25 as a decimal."
            say: "A bakery sells twelve twenty-fifths of its cakes by lunchtime. Write twelve twenty-fifths as a decimal."
            answer: "0.48"
