# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.circles-compass
skill: math.shapes.circles-compass
curriculum: en-GB
language: en
title:
  de: Kreise mit dem Zirkel
  en: Circles and compasses
summary: >
  Lesson 1 names the centre and the radius of a circle (every point on
  the circle is the same distance from the centre) and the diameter,
  which is twice the radius; lesson 2 opens a pair of compasses on a
  ruler to the radius, keeps the point on the centre, draws arcs and
  circles round one centre, and ends with the skill check. Drawing a
  circle with the compasses on screen waits for a drawing task.
metadata:
  year: year-5
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.lines-segments]
  also_practises: [math.length.cm-m]
  vocabulary: { en: [circle, centre, radius, radii, diameter, pair of compasses, point, arc] }
  forms: [text, audio, drawn]
  drawn: [shape, ruler]
  facets: [units]
  misconceptions:
    - id: radius-is-diameter
      what: Takes the radius for the whole width of the circle, so opens the compasses to the width the circle should have
      addressed: lesson 1 Learn says a circle with a 3 cm radius is 6 cm wide; l1-f3 and l2-f1 offer the doubled length with feedback, l2-f3 (with feedback), l2-s3 and l2-n3 ask how far to open the compasses for a given width, l1-s4 and l2-c4 compare a radius with a diameter
    - id: radius-changes-with-direction
      what: Thinks points on the circle can be different distances from the centre, or that the compasses may open wider while drawing
      addressed: lesson 1 Learn says every point on the circle is the same distance away; l1-f2, l1-s2 and l2-f4 ask about it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mittelpunkt, Radius, Durchmesser", en: "Centre, radius and diameter" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is this shape called?"
            show: { drawn: shape, kind: circle, colour: blue }
            options: ["circle", "sphere", "rectangle"]
            answer: "circle"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How long is the strip?"
            show: { drawn: ruler, to: 10, length: 6 }
            options: ["6 cm", "7 cm", "5 cm"]
            answer: "6 cm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The centre is the point in the very middle of a circle."
            say: "The point in the very middle of a circle is its centre. Every point on the circle is exactly the same distance from the centre. That is what makes it a circle."
            show: { drawn: shape, kind: circle, colour: green }
          - text: "The radius: from the centre to the circle.\nHere the radius is 3 cm."
            say: "A straight line from the centre to the circle is a radius. It is the same length whichever way you measure it. This radius is three centimetres long."
            show: { drawn: ruler, to: 10, length: 3, colour: blue }
          - text: "The diameter: right across, through the centre.\ndiameter = 2 × radius\nradius 3 cm, diameter 6 cm"
            say: "A straight line right across the circle through the centre is the diameter. It is made of two radii, so it is twice as long. A circle with a radius of three centimetres is six centimetres wide."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is a line from the centre to the circle called?"
                options: ["radius", "diameter", "centre"]
                answer: "radius"
                feedback:
                  "diameter": "The diameter goes right across the circle. This line stops at the centre."
                hints:
                  - "It starts at the centre."
                  - "It is half of the diameter."
                  - "It is the radius."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Every point on a circle is the same distance from its centre. Is that true?"
                answer: true
                hints:
                  - "Think of a radius pointing up and another pointing sideways."
                  - "All radii of one circle are the same length."
                  - "Yes, that is true."
              - id: l1-f3
                type: multiple_choice
                text: "A circle has a radius of 4 cm. How far is a point on the circle from the centre?"
                options: ["4 cm", "8 cm", "2 cm"]
                answer: "4 cm"
                feedback:
                  "8 cm": "8 cm is the diameter, right across the circle. From the centre to the circle is the radius."
                hints:
                  - "From the centre to the circle is the radius."
                  - "The radius is 4 cm."
                  - "4 cm."
              - id: l1-f4
                type: multiple_choice
                text: "The strip goes from the centre to the circle. How long is the radius?"
                show: { drawn: ruler, to: 10, length: 5 }
                options: ["5 cm", "10 cm", "6 cm"]
                answer: "5 cm"
                hints:
                  - "Read the ruler at the end of the strip."
                  - "The strip starts at 0."
                  - "5 cm."
              - id: l1-f5
                type: multiple_choice
                text: "A circle has a radius of 2.5 cm. What is its diameter?"
                options: ["5 cm", "2.5 cm", "1.25 cm"]
                answer: "5 cm"
                feedback:
                  "1.25 cm": "The diameter is longer than the radius, not shorter. Double the radius."
                hints:
                  - "The diameter is two radii."
                  - "2 × 2.5 cm."
                  - "5 cm."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Where is the centre of a circle?"
                options: ["exactly in the middle", "on the circle", "outside the circle"]
                answer: "exactly in the middle"
                hints: ["It is the same distance from every point on the circle."]
              - id: l1-s2
                type: true_false
                text: "If you measure the radius in a different direction, it is longer. Is that true?"
                answer: false
                hints: ["Every point on the circle is the same distance from the centre."]
              - id: l1-s3
                type: multiple_choice
                text: "A circle is 10 cm across through its centre. What is its radius?"
                options: ["5 cm", "10 cm", "20 cm"]
                answer: "5 cm"
                hints: ["10 cm is the diameter. The radius is half of it."]
              - id: l1-s4
                type: multiple_choice
                text: "Which circle is bigger?"
                options: ["radius 4 cm", "diameter 6 cm", "They are the same."]
                answer: "radius 4 cm"
                keep_order: true
                hints: ["A radius of 4 cm gives a diameter of 8 cm."]
              - id: l1-s5
                type: multiple_choice
                text: "The strip goes from the centre to the circle. It starts at 2. How long is the radius?"
                show: { drawn: ruler, to: 10, start: 2, length: 4, colour: blue }
                options: ["4 cm", "6 cm", "2 cm"]
                answer: "4 cm"
                hints: ["Count the centimetres from 2 to the end of the strip."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "A circle has a radius of 6 cm. What is its diameter in cm?"
                answer: "12"
              - id: l1-n2
                type: multiple_choice
                text: "A round pizza has a radius of 15 cm. How wide is it?"
                options: ["30 cm", "15 cm", "45 cm"]
                answer: "30 cm"
              - id: l1-n3
                type: true_false
                text: "The centre of a circle lies on the circle. Is that true?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "A bike wheel has a diameter of 60 cm. What is its radius?"
                options: ["30 cm", "60 cm", "120 cm"]
                answer: "30 cm"
              - id: l1-n5
                type: multiple_choice
                text: "The strip goes from the centre to the circle. How long is the radius?"
                show: { drawn: ruler, to: 10, length: 8, colour: green }
                options: ["8 cm", "16 cm", "4 cm"]
                answer: "8 cm"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is the radius?"
            options: ["the line from the centre to the circle", "the line right across the circle", "the curved line round the edge"]
            answer: "the line from the centre to the circle"
          - id: l1-c2
            type: multiple_choice
            text: "A circle has a radius of 9 cm. How far is every point on the circle from the centre?"
            options: ["9 cm", "18 cm", "4.5 cm"]
            answer: "9 cm"
          - id: l1-c3
            type: text_input
            text: "A circle is 8 cm across through its centre. How long is its radius in cm?"
            answer: "4"

  - n: 2
    title: { de: "Mit dem Zirkel zeichnen", en: "Drawing with compasses" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A circle has a radius of 3 cm. What is its diameter?"
            options: ["6 cm", "3 cm", "9 cm"]
            answer: "6 cm"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is the line right across a circle, through its centre, called?"
            options: ["diameter", "radius", "centre"]
            answer: "diameter"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Open the compasses to 4 cm."
            say: "A pair of compasses has a sharp point and a pencil. To draw a circle with a radius of four centimetres, put the point on zero on your ruler and open the compasses until the pencil is on four."
            show: { drawn: ruler, to: 10, length: 4 }
          - text: "Point on the centre. Turn once round."
            say: "Press the point gently onto the centre. Keep it still, hold the compasses at the top and turn them once all the way round. Do not let them open or close while you turn. The pencil draws the circle."
          - text: "Part of the way round: an arc.\nCircles round the same centre: a target."
            say: "If you turn only part of the way round, you draw an arc, a piece of a circle. If you keep the point on the same centre and open the compasses wider each time, you get circles inside each other, like a target."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The compasses are open as wide as the strip. What radius will the circle have?"
                show: { drawn: ruler, to: 10, length: 3, colour: green }
                options: ["3 cm", "6 cm", "4 cm"]
                answer: "3 cm"
                feedback:
                  "6 cm": "6 cm will be the diameter. The opening of the compasses is the radius."
                hints:
                  - "The gap between the point and the pencil is the radius."
                  - "The strip ends at 3."
                  - "3 cm."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Where do you put the point of the compasses?"
                options: ["on the centre", "on the circle", "anywhere outside the circle"]
                answer: "on the centre"
                hints:
                  - "The point stays still while the pencil goes round."
                  - "Every point on the circle must be the same distance from it."
                  - "On the centre."
              - id: l2-f3
                type: multiple_choice
                text: "The circle must be 10 cm wide. How far do you open the compasses?"
                options: ["5 cm", "10 cm", "20 cm"]
                answer: "5 cm"
                feedback:
                  "10 cm": "10 cm is the diameter. The compasses open to the radius, which is half of it."
                hints:
                  - "10 cm wide is the diameter."
                  - "The compasses open to the radius."
                  - "Half of 10 cm is 5 cm."
              - id: l2-f4
                type: true_false
                text: "While you draw, the compasses can open wider. Is that true?"
                answer: false
                hints:
                  - "What would happen to the radius?"
                  - "Some points would be further from the centre than others."
                  - "No. The opening must stay the same, or it is not a circle."
              - id: l2-f5
                type: multiple_choice
                text: "You turn the compasses only part of the way round. What do you draw?"
                options: ["an arc", "a whole circle", "a straight line"]
                answer: "an arc"
                hints:
                  - "The pencil still moves on a curve."
                  - "It stops before it gets back to the start."
                  - "An arc, a piece of a circle."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The compasses are open as wide as the strip. What radius will the circle have?"
                show: { drawn: ruler, to: 10, length: 7, colour: blue }
                options: ["7 cm", "14 cm", "8 cm"]
                answer: "7 cm"
                hints: ["The opening is the radius."]
              - id: l2-s2
                type: true_false
                text: "In a target, all the circles have the same centre. Is that true?"
                answer: true
                hints: ["The point stays in one place, only the opening changes."]
              - id: l2-s3
                type: multiple_choice
                text: "The circle must be 4 cm wide. How far do you open the compasses?"
                options: ["2 cm", "4 cm", "8 cm"]
                answer: "2 cm"
                hints: ["4 cm wide is the diameter."]
              - id: l2-s4
                type: multiple_choice
                text: "Two circles share a centre. Their radii are 2 cm and 5 cm. How far apart are the two circles?"
                options: ["3 cm", "7 cm", "5 cm"]
                answer: "3 cm"
                hints: ["Both radii start at the centre. Find the difference."]
              - id: l2-s5
                type: multiple_choice
                text: "Which part of the compasses draws the circle?"
                options: ["the pencil", "the point", "the hinge"]
                answer: "the pencil"
                hints: ["One part stays still on the centre."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The compasses are open as wide as the strip. What radius will the circle have?"
                show: { drawn: ruler, to: 15, length: 9 }
                options: ["9 cm", "18 cm", "10 cm"]
                answer: "9 cm"
              - id: l2-n2
                type: true_false
                text: "The point of the compasses stays on the centre while you draw. Is that true?"
                answer: true
              - id: l2-n3
                type: text_input
                text: "A circle must be 14 cm wide. How many cm do you open the compasses?"
                answer: "7"
              - id: l2-n4
                type: multiple_choice
                text: "You open the compasses wider. What happens to the circle?"
                options: ["It gets bigger.", "It gets smaller.", "It stays the same size."]
                answer: "It gets bigger."
                keep_order: true
              - id: l2-n5
                type: multiple_choice
                text: "Three circles share a centre. Their radii are 1 cm, 2 cm and 3 cm. How wide is the biggest circle?"
                options: ["6 cm", "3 cm", "9 cm"]
                answer: "6 cm"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "The point is at 1 and the pencil at 6 on the ruler. What radius will the circle have?"
            show: { drawn: ruler, to: 10, start: 1, length: 5, colour: green }
            options: ["5 cm", "6 cm", "10 cm"]
            answer: "5 cm"
          - id: l2-c2
            type: multiple_choice
            text: "What is the centre of a circle?"
            options: ["the point that is the same distance from every point on the circle", "the top point of the circle", "a point outside the circle"]
            answer: "the point that is the same distance from every point on the circle"
          - id: l2-c3
            type: text_input
            text: "A round plate is 24 cm across. How long is its radius in cm?"
            answer: "12"
          - id: l2-c4
            type: true_false
            text: "A circle with a radius of 5 cm is wider than a circle with a diameter of 8 cm. Is that true?"
            answer: true
          - id: l2-c5
            type: multiple_choice
            text: "Josh draws two circles round the same centre, with radii of 3 cm and 6 cm. How much wider is the big circle?"
            options: ["6 cm", "3 cm", "12 cm"]
            answer: "6 cm"
