# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.numbers-to-million
skill: math.large-numbers.to-million
curriculum: en-GB
language: en
title:
  de: Zahlen bis 1 000 000
  en: Numbers to 1,000,000
summary: >
  Year 5 opens with numbers to a million. Digits are grouped in threes
  with a comma (250,000), and each group is read like a three-digit number
  followed by "thousand". Lesson 1 puts six-digit numbers in a place value
  chart and says what each digit is worth; lesson 2 reads and writes them
  in words and counts in powers of ten, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Zahlen bis 1 000 000, en: Numbers to 1 000 000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-10000]
  also_practises: [math.numbers-to-1000.read-write]
  vocabulary: { en: [ten thousand, hundred thousand, million, digit, place value, comma, powers of ten] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart]
  facets: []
  parts:
    - { id: chart, what: { de: Zahlen aus der Stellentafel und aus ihren Teilen bilden, en: making numbers from a place value chart and from their parts } }
    - { id: digit-value, what: { de: den Wert einer Ziffer nennen, en: saying what a digit is worth } }
    - { id: read-write, what: { de: Zahlen bis 1 000 000 in Wörtern und Ziffern lesen und schreiben, en: reading and writing numbers to 1 000 000 in words and digits } }
    - { id: powers-of-ten, what: { de: in Zehnerpotenzen vorwärts und rückwärts zählen, en: counting on and back in powers of ten } }
  misconceptions:
    - id: grouping
      what: Reads 250,000 as two hundred and fifty or loses track of the places
      addressed: lesson 1 Learn reads the thousands group first, then the rest
    - id: zeros-dropped
      what: Writes three hundred thousand and forty as 30040 or 340
      addressed: lesson 2 sets numbers with zeros inside both groups; full-stage feedback counts the places
    - id: digit-value
      what: Says the 4 in 342,615 is worth 4000
      addressed: lesson 1 asks for the value of digits in the thousands group
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Die Stellentafel bis 1 000 000, en: Place value to a million }
    goal:
      de: "Stell sechsstellige Zahlen in der Stellentafel dar und sag, wie viel jede Ziffer wert ist, so wie die 4 in 342615 ist 40 Tausend wert."
      en: "Say what each digit in a six-digit number is worth, like the 4 in 342615 is worth 40 thousand."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is the 7 in 4721 worth?"
            options: ["7", "70", "700"]
            answer: "700"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many thousands make 10,000?"
            options: ["10", "100", "1000"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "HTh | TTh | Th | H | T | O"
            say: "After thousands come ten thousands and hundred thousands. Ten hundred thousands make one million."
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [3, 4, 2, 6, 1, 5] }
          - text: "342,615"
            say: "Read the number in two groups. The thousands group is three hundred and forty-two, so we say three hundred and forty-two thousand. Then the rest: six hundred and fifteen."
          - text: "the 4 is worth 40,000"
            say: "Each digit has a value. In three hundred and forty-two thousand, six hundred and fifteen, the four is in the ten thousands column, so it is worth forty thousand."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [2, 5, 0, 3, 1, 8] }
                options: ["250,318", "25,318", "2,503,18"]
                answer: "250,318"
                hints:
                  - "There are six digits. The first three are the thousands group."
                  - "2, 5, 0 thousands, then 3, 1, 8."
                  - "250,318."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is the 4 in 342,615 worth?"
                options: ["4000", "40,000", "400,000"]
                answer: "40,000"
                feedback:
                  "4000": "The 4 is one place further left, in the ten thousands."
                hints:
                  - "Which column is the 4 in?"
                  - "Count from the right: ones, tens, hundreds, thousands, ten thousands."
                  - "The 4 is worth 40,000."
              - id: l1-f3
                type: fill_in_blank
                text: "Partition 506,240."
                frame: "506,240 = _ + 6000 + _ + 40"
                options: ["500", "5000", "200", "500,000"]
                answer: ["500,000", "200"]
                hints:
                  - "The 5 is in the hundred thousands."
                  - "The 2 is in the hundreds."
                  - "500,000 + 6000 + 200 + 40."
              - id: l1-f4
                type: multiple_choice
                text: "In which number is the 7 in the ten thousands column?"
                options: ["7000", "170,000", "700,000"]
                answer: "170,000"
                hints:
                  - "Ten thousands are the fifth column from the right."
                  - "In 170,000 the 7 is in that column."
                  - "170,000."
              - id: l1-f5
                type: true_false
                text: "Is it true? In 909,090 every 9 is worth the same."
                answer: false
                hints:
                  - "Where is each 9?"
                  - "Hundred thousands, thousands, tens."
                  - "No: 900,000, 9000 and 90."
              - id: l1-f6
                type: text_input
                text: "What is 300,000 + 20,000 + 500 + 7?"
                answer: "320507"
                hints:
                  - "Put each part in its column."
                  - "3 HTh, 2 TTh, 0 Th, 5 H, 0 T, 7 O."
                  - "320,507."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [7, 0, 4, 0, 6, 0] }
                options: ["704,060", "74,060", "740,600"]
                answer: "704,060"
                hints: ["Six digits, zeros included."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the 8 in 128,503 worth?"
                options: ["800", "8000", "80,000"]
                answer: "8000"
                hints: ["The 8 is in the thousands."]
              - id: l1-s3
                type: fill_in_blank
                text: "Partition 640,315."
                frame: "640,315 = 600,000 + _ + 300 + _"
                options: ["4000", "40,000", "15", "150"]
                answer: ["40,000", "15"]
                hints: ["The 4 is in the ten thousands."]
              - id: l1-s4
                type: multiple_choice
                text: "In which number is the 3 in the hundred thousands column?"
                options: ["30,000", "300,000", "3000"]
                answer: "300,000"
                hints: ["Six digits."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 1,000,000 is ten hundred thousands."
                answer: true
                hints: ["Count in hundred thousands."]
              - id: l1-s6
                type: text_input
                text: "What is 800,000 + 9000 + 40?"
                answer: "809040"
                hints: ["No ten thousands, no hundreds, no ones."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [1, 3, 9, 0, 0, 2] }
                options: ["139,002", "13,902", "139,200"]
                answer: "139,002"
              - id: l1-n2
                type: multiple_choice
                text: "What is the 6 in 961,032 worth?"
                options: ["6000", "60,000", "600,000"]
                answer: "60,000"
              - id: l1-n3
                type: fill_in_blank
                text: "Partition 205,780."
                frame: "205,780 = 200,000 + _ + 700 + _"
                options: ["5000", "50,000", "80", "8"]
                answer: ["5000", "80"]
              - id: l1-n4
                type: multiple_choice
                text: "In which number is the 2 in the thousands column?"
                options: ["20,000", "432,000", "200,000"]
                answer: "432,000"
              - id: l1-n5
                type: text_input
                text: "What is 600,000 + 6?"
                answer: "600006"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [4, 0, 8, 1, 5, 0] }
            options: ["408,150", "48,150", "481,500"]
            answer: "408,150"
          - id: l1-c2
            type: multiple_choice
            text: "What is the 5 in 652,104 worth?"
            options: ["5000", "50,000", "500,000"]
            answer: "50,000"
          - id: l1-c3
            type: text_input
            text: "What is 70,000 + 3000 + 20?"
            answer: "73020"
          - id: l1-c4
            type: fill_in_blank
            text: "Partition 870,423."
            say: "Partition eight hundred and seventy thousand, four hundred and twenty-three."
            frame: "870,423 = _ + 70,000 + 400 + 20 + _"
            options: ["800,000", "80,000", "3", "30"]
            answer: ["800,000", "3"]
          - id: l1-c5
            type: true_false
            text: "Is it true? In 563,912 the 6 is worth 6000."
            say: "Is it true? In five hundred and sixty-three thousand, nine hundred and twelve, the six is worth six thousand."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "In which number is the 5 in the hundreds column?"
            options: ["5000", "120,500", "500,000"]
            answer: "120,500"

  - n: 2
    title: { de: "Lesen, schreiben und in Zehnerpotenzen zählen", en: "Reading, writing and counting in powers of ten" }
    goal:
      de: "Lies und schreib große Zahlen bis zu einer Million und zähl in Schritten von 10000 oder 100000 weiter."
      en: "Read and write big numbers up to a million, and count on in steps of 10000 or 100000."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is the 3 in 534,210 worth?"
            options: ["3000", "30,000", "300,000"]
            answer: "30,000"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "What is 200,000 + 40,000 + 600?"
            answer: "240600"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "four hundred and seven thousand and thirty"
            say: "Writing a big number: four hundred and seven thousand gives the thousands group, four, zero, seven. Thirty is the rest: zero, three, zero. So four hundred and seven thousand and thirty is written four, zero, seven, comma, zero, three, zero."
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [4, 0, 7, 0, 3, 0] }
          - text: "The rest always has three digits"
            say: "After the comma there are always three digits. Thirty becomes zero, three, zero."
          - text: "10, 100, 1000, 10,000, 100,000"
            say: "Counting in powers of ten: add ten, a hundred, a thousand, ten thousand or a hundred thousand. Only one digit changes each time, unless it goes past nine."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Two hundred and sixty thousand, four hundred and five. Which number is it?"
                options: ["260,405", "26,405", "260,450"]
                answer: "260,405"
                option_audio: false
                feedback:
                  "26,405": "Two hundred and sixty thousand needs 260 in the thousands group: six digits."
                  "260,450": "The last group is four hundred and five: 405."
                hints:
                  - "Two hundred and sixty thousand: 260 in the thousands group."
                  - "Four hundred and five: 405."
                  - "260,405."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Listen and write the number."
                say: "Five hundred and eight thousand and thirty. Write the number."
                answer: "508030"
                hints:
                  - "Five hundred and eight thousand: 508 in the thousands group."
                  - "Thirty after the comma is three digits: 030."
                  - "508,030."
              - id: l2-f3
                type: multiple_choice
                text: "Which word matches 75,200?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["seventy-five thousand, two hundred", "seven hundred and fifty-two thousand", "seventy-five thousand and twenty"]
                answer: "seventy-five thousand, two hundred"
                option_audio: false
                hints:
                  - "The thousands group is 75."
                  - "The rest is 200."
                  - "Seventy-five thousand, two hundred."
              - id: l2-f4
                type: multiple_choice
                text: "What is 10,000 more than 395,000?"
                options: ["396,000", "405,000", "495,000"]
                answer: "405,000"
                feedback:
                  "396,000": "That is 1000 more. 10,000 more changes the ten thousands."
                hints:
                  - "Which digit changes for 10,000 more?"
                  - "The ten thousands: 9 and 1 more makes 10, so the hundred thousands go up."
                  - "405,000."
              - id: l2-f5
                type: fill_in_blank
                text: "Count in 100,000s."
                frame: "250,000, 350,000, 450,000, _ , _"
                options: ["460,000", "550,000", "650,000", "551,000"]
                answer: ["550,000", "650,000"]
                hints:
                  - "Which digit changes?"
                  - "Only the hundred thousands."
                  - "550,000, 650,000."
              - id: l2-f6
                type: true_false
                text: "Is it true? One million is written 1,000,000."
                answer: true
                hints:
                  - "A million is ten hundred thousands."
                  - "A 1 and six zeros."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Listen and write the number."
                say: "Nine hundred and twelve thousand, six hundred and fifty. Write the number."
                answer: "912650"
                hints: ["912 then 650."]
              - id: l2-s2
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Forty thousand and nine. Which number is it?"
                options: ["40,009", "4009", "400,009"]
                answer: "40,009"
                option_audio: false
                hints: ["After the comma: 009."]
              - id: l2-s3
                type: multiple_choice
                text: "Which word matches 603,018?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["six hundred and three thousand and eighteen", "sixty-three thousand and eighteen", "six hundred and thirty thousand and eighteen"]
                answer: "six hundred and three thousand and eighteen"
                option_audio: false
                hints: ["The thousands group is 603."]
              - id: l2-s4
                type: multiple_choice
                text: "What is 100,000 less than 720,500?"
                options: ["710,500", "620,500", "720,400"]
                answer: "620,500"
                hints: ["The hundred thousands digit changes."]
              - id: l2-s5
                type: fill_in_blank
                text: "Count back in 10,000s."
                frame: "84,000, 74,000, 64,000, _ , _"
                options: ["54,000", "44,000", "63,000", "640,000"]
                answer: ["54,000", "44,000"]
                hints: ["The ten thousands digit goes down."]
              - id: l2-s6
                type: text_input
                text: "Read the number word and write the number.\nseven hundred thousand, seven hundred"
                say: "Read the number word and write the number."
                answer: "700700"
                hints: ["700 thousand, then 700."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Listen and write the number."
                say: "Three hundred and one thousand, two hundred and nine. Write the number."
                answer: "301209"
              - id: l2-n2
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Eighty-eight thousand, eight hundred. Which number is it?"
                options: ["88,800", "8880", "880,800"]
                answer: "88,800"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "What is 1000 more than 299,500?"
                options: ["300,500", "299,600", "309,500"]
                answer: "300,500"
              - id: l2-n4
                type: fill_in_blank
                text: "Count in 10,000s."
                frame: "970,000, 980,000, 990,000, _"
                options: ["1,000,000", "991,000", "1,090,000"]
                answer: ["1,000,000"]
              - id: l2-n5
                type: text_input
                text: "Read the number word and write the number.\nfive hundred thousand and fifty"
                say: "Read the number word and write the number."
                answer: "500050"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: chart
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [9, 0, 2, 4, 0, 1] }
            options: ["902,401", "92,401", "902,410"]
            answer: "902,401"
          - id: l2-c2
            part: digit-value
            type: multiple_choice
            text: "What is the 2 in 425,316 worth?"
            options: ["2000", "20,000", "200,000"]
            answer: "20,000"
          - id: l2-c3
            part: read-write
            type: text_input
            text: "Listen and write the number."
            say: "Six hundred and forty thousand, five hundred and three. Write the number."
            answer: "640503"
          - id: l2-c4
            part: powers-of-ten
            type: multiple_choice
            text: "What is 10,000 more than 190,250?"
            options: ["191,250", "200,250", "290,250"]
            answer: "200,250"
          - id: l2-c5
            part: read-write
            type: multiple_choice
            text: "Which word matches 30,070?"
            say: "Which number word matches the number? Read the words yourself."
            options: ["thirty thousand and seventy", "three hundred thousand and seventy", "thirty thousand, seven hundred"]
            answer: "thirty thousand and seventy"
            option_audio: false
          - id: l2-c6
            part: chart
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [6, 1, 0, 0, 7, 3] }
            options: ["610,073", "61,073", "610,730"]
            answer: "610,073"
          - id: l2-c7
            part: chart
            type: text_input
            text: "What is 400,000 + 50,000 + 8000 + 6?"
            say: "What is four hundred thousand add fifty thousand add eight thousand add six?"
            answer: "458006"
          - id: l2-c8
            part: chart
            type: fill_in_blank
            text: "Partition 371,054."
            say: "Partition three hundred and seventy-one thousand and fifty-four."
            frame: "371,054 = 300,000 + _ + 1000 + _"
            options: ["70,000", "7000", "54", "540"]
            answer: ["70,000", "54"]
          - id: l2-c9
            part: chart
            type: true_false
            text: "Is it true? The chart shows 53,200."
            say: "Is it true? The chart shows fifty-three thousand, two hundred."
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [5, 0, 3, 2, 0, 0] }
            answer: false
          - id: l2-c10
            part: digit-value
            type: multiple_choice
            text: "What is the 9 in 194,603 worth?"
            say: "What is the nine in one hundred and ninety-four thousand, six hundred and three worth?"
            options: ["9000", "90,000", "900,000"]
            answer: "90,000"
          - id: l2-c11
            part: digit-value
            type: multiple_choice
            text: "In which number is a 4 worth 400,000?"
            say: "In which number is a four worth four hundred thousand?"
            options: ["414,000", "44,000", "140,400"]
            answer: "414,000"
          - id: l2-c12
            part: digit-value
            type: true_false
            text: "Is it true? In 777,777 the first 7 is worth 700,000."
            say: "Is it true? In seven hundred and seventy-seven thousand, seven hundred and seventy-seven, the first seven is worth seven hundred thousand."
            answer: true
          - id: l2-c13
            part: digit-value
            type: text_input
            text: "What is the 3 in 236,915 worth?"
            say: "What is the three in two hundred and thirty-six thousand, nine hundred and fifteen worth?"
            answer: "30000"
          - id: l2-c14
            part: read-write
            type: text_input
            text: "Listen and write the number."
            say: "Two hundred and five thousand and six. Write the number."
            answer: "205006"
          - id: l2-c15
            part: read-write
            type: multiple_choice
            text: "Which word matches 480,090?"
            say: "Which number word matches the number? Read the words yourself."
            options: ["four hundred and eighty thousand and ninety", "forty-eight thousand and ninety", "four hundred and eighty thousand, nine hundred"]
            answer: "four hundred and eighty thousand and ninety"
            option_audio: false
          - id: l2-c16
            part: read-write
            type: multiple_choice
            text: "Listen. Which number is it?"
            say: "Ninety thousand, three hundred and twelve. Which number is it?"
            options: ["90,312", "9312", "900,312"]
            answer: "90,312"
            option_audio: false
          - id: l2-c17
            part: powers-of-ten
            type: multiple_choice
            text: "What is 100,000 more than 856,200?"
            say: "What is one hundred thousand more than eight hundred and fifty-six thousand, two hundred?"
            options: ["956,200", "866,200", "857,200"]
            answer: "956,200"
          - id: l2-c18
            part: powers-of-ten
            type: fill_in_blank
            text: "Count back in 1000s."
            say: "Count back in thousands."
            frame: "403,000, 402,000, 401,000, _ , _"
            options: ["400,000", "399,000", "390,000", "400,900"]
            answer: ["400,000", "399,000"]
          - id: l2-c19
            part: powers-of-ten
            type: multiple_choice
            text: "What is 10,000 less than 205,600?"
            say: "What is ten thousand less than two hundred and five thousand, six hundred?"
            options: ["195,600", "204,600", "105,600"]
            answer: "195,600"
          - id: l2-c20
            part: powers-of-ten
            type: true_false
            text: "Is it true? 1000 more than 999,000 is 1,000,000."
            say: "Is it true? One thousand more than nine hundred and ninety-nine thousand is one million."
            answer: true
