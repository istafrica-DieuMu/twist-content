# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.mental-moves
skill: math.space.mental-moves
curriculum: en-GB
language: en
title:
  de: "Kopfgeometrie: drehen und kippen"
  en: Turning and tipping in your head
summary: >
  Lesson 1 turns letters, numbers and shapes in the head (a half turn
  makes b into q and 16 into 91; a quarter turn stands a lying rectangle
  upright) and tells a turn from a reflection (b in a side mirror is d);
  lesson 2 tips a dice in the head, using that opposite faces add up to
  7 and that tipping brings the face from the opposite side to the top,
  and ends with the skill check. Turning a drawn shape and choosing its
  picture waits for a drawn component that shows rotated shapes and dice
  from an angle.
metadata:
  year: year-5
  topic: { de: Orientierung, en: Position and direction }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.space.views, math.solids.nets]
  also_practises: []
  vocabulary: { en: [turn, half turn, quarter turn, reflect, reflection, mirror, tip, dice, face, opposite] }
  forms: [text, audio, drawn]
  drawn: [shape, letter-card, dots]
  facets: []
  parts:
    - { id: turn, what: { de: Buchstaben und Zahlen im Kopf drehen, en: turning letters and numbers in your head } }
    - { id: turn-or-reflect, what: { de: eine Drehung von einer Spiegelung unterscheiden, en: telling a turn from a reflection } }
    - { id: dice-opposite, what: { de: "wissen, dass gegenüberliegende Würfelseiten zusammen 7 ergeben", en: knowing that opposite faces of a dice add up to 7 } }
    - { id: dice-tip, what: { de: einen Würfel im Kopf kippen, en: tipping a dice in your head } }
  misconceptions:
    - id: turn-is-reflection
      what: Mixes up a half turn with a reflection (turns b and picks d)
      addressed: lesson 1 Learn turns b into q and reflects b into d; l1-f1 (with feedback), l1-s1, l1-n1, l1-c1 and l2-c1 offer the reflection, l1-f2, l1-s2, l1-n2, l1-n4 and l2-c2 ask for a reflection
    - id: tipped-face-comes-up
      what: When a dice is tipped, thinks the face on the side it tips towards comes on top, instead of the face on the opposite side
      addressed: lesson 2 Learn tips the dice forward and brings the back face up; l2-f2 and l2-f4 (with feedback), l2-s2, l2-s5, l2-n2, l2-n3, l2-n4, l2-c4 and l2-c5 offer the face in the tipping direction
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Drehen und spiegeln", en: "Turning and reflecting" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many faces does a cube have?"
            show: { drawn: shape, kind: cube, colour: blue }
            options: ["6", "4", "8"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "A tin stands on the table. What shape do you see when you look at it from above?"
            options: ["a circle", "a rectangle", "a triangle"]
            answer: "a circle"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A half turn: b becomes q."
            say: "Imagine the letter b on a card. Give the card a half turn, so it is upside down, like the minute hand going from twelve to six. Now the b looks like a q."
            show: { drawn: letter-card, text: "b q" }
          - text: "A reflection: b becomes d."
            say: "Now hold the b up to a mirror at its side. In the mirror it looks like a d. A reflection is not a turn: however you turn a b on the table, it never becomes a d."
            show: { drawn: letter-card, text: "b d" }
          - text: "16 after a half turn: 91"
            say: "With a number, the digits turn and swap places too. Turn sixteen upside down. The six becomes a nine and moves to the front, so you read ninety-one."
            show: { drawn: letter-card, text: "16" }
          - text: "A quarter turn: a lying rectangle stands up."
            say: "A quarter turn is like the minute hand going from twelve to three. A rectangle lying on its long side stands up on its short side after a quarter turn."
            show: { drawn: shape, kind: rectangle, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "You give the card a half turn. Which letter do you see?"
                show: { drawn: letter-card, text: "b" }
                options: ["q", "d", "p"]
                answer: "q"
                option_audio: false
                feedback:
                  "d": "d is what you see in a mirror at the side. A half turn turns the card upside down."
                hints:
                  - "Turn the card upside down in your head."
                  - "The round part moves to the left and the stick points down."
                  - "It looks like a q."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "You hold the card up to a mirror at its side. Which letter do you see?"
                show: { drawn: letter-card, text: "b" }
                options: ["d", "q", "p"]
                answer: "d"
                option_audio: false
                hints:
                  - "In a side mirror, left and right swap. Up and down stay."
                  - "The round part moves to the left, the stick still points up."
                  - "It looks like a d."
              - id: l1-f3
                type: multiple_choice
                text: "You give the card a half turn. What number do you read?"
                show: { drawn: letter-card, text: "16" }
                options: ["91", "61", "19"]
                answer: "91"
                feedback:
                  "61": "The digits swap places, but each digit turns upside down too: the 6 becomes a 9."
                hints:
                  - "Each digit turns upside down, and they swap places."
                  - "The 6 becomes a 9 and goes to the front. The 1 stays a 1."
                  - "91."
              - id: l1-f4
                type: multiple_choice
                text: "Which word looks exactly the same after a half turn?"
                options: ["SOS", "BOB", "DAD"]
                answer: "SOS"
                hints:
                  - "Turn each word upside down in your head."
                  - "S and O look the same upside down. B and D do not."
                  - "SOS."
              - id: l1-f5
                type: multiple_choice
                text: "A rectangle lies on its long side. You give it a quarter turn. What happens?"
                show: { drawn: shape, kind: rectangle, colour: orange }
                options: ["It stands up on its short side.", "It looks the same as before.", "It is upside down on its long side."]
                answer: "It stands up on its short side."
                hints:
                  - "A quarter turn is like the minute hand going from 12 to 3."
                  - "The long side that was at the bottom now goes up the side."
                  - "It stands up on its short side."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "You give the card a half turn. Which letter do you see?"
                show: { drawn: letter-card, text: "d" }
                options: ["p", "b", "q"]
                answer: "p"
                option_audio: false
                hints: ["Upside down, the stick points down and the round part moves to the right."]
              - id: l1-s2
                type: multiple_choice
                text: "You hold the card up to a mirror at its side. Which letter do you see?"
                show: { drawn: letter-card, text: "p" }
                options: ["q", "d", "b"]
                answer: "q"
                option_audio: false
                hints: ["Left and right swap, up and down stay."]
              - id: l1-s3
                type: multiple_choice
                text: "You give the card a half turn. What number do you read?"
                show: { drawn: letter-card, text: "68" }
                options: ["89", "86", "98"]
                answer: "89"
                hints: ["The digits swap places and each turns upside down. What does 6 become?"]
              - id: l1-s4
                type: true_false
                text: "After a half turn, n looks like u. Is that true?"
                answer: true
                hints: ["Picture an n upside down."]
              - id: l1-s5
                type: multiple_choice
                text: "Which capital letter looks the same after a half turn?"
                options: ["N", "E", "A"]
                answer: "N"
                option_audio: false
                hints: ["Turn each letter upside down in your head."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "You give the card a half turn. Which letter do you see?"
                show: { drawn: letter-card, text: "q" }
                options: ["b", "p", "d"]
                answer: "b"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "You hold the card up to a mirror at its side. Which letter do you see?"
                show: { drawn: letter-card, text: "d" }
                options: ["b", "p", "q"]
                answer: "b"
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "You give the card a half turn. What does it say?"
                show: { drawn: letter-card, text: "SWIMS" }
                options: ["SWIMS", "SMIWS", "SWIWS"]
                answer: "SWIMS"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "In a mirror at its side, b looks like q. Is that true?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "How far is a quarter turn?"
                options: ["the minute hand from 12 to 3", "the minute hand from 12 to 6", "the minute hand from 12 all the way round"]
                answer: "the minute hand from 12 to 3"
                keep_order: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "You give the card a half turn. Which letter do you see?"
            show: { drawn: letter-card, text: "p" }
            options: ["d", "q", "b"]
            answer: "d"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "You hold the card up to a mirror at its side. Which letter do you see?"
            show: { drawn: letter-card, text: "q" }
            options: ["p", "b", "d"]
            answer: "p"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "After a half turn, 6 looks like 9. Is that true?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "You give the card a half turn. What number do you read?"
            show: { drawn: letter-card, text: "19" }
            options: ["61", "91", "16"]
            answer: "61"
          - id: l1-c5
            type: true_false
            text: "After a half turn, d looks like b. Is that true?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Which word looks exactly the same in a mirror at its side?"
            options: ["TOT", "TOP", "TAP"]
            answer: "TOT"
            option_audio: false

  - n: 2
    title: { de: "Den Würfel kippen", en: "Tipping a dice" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "You give the card a half turn. What does it say?"
            show: { drawn: letter-card, text: "MOW" }
            options: ["MOW", "WOM", "MOM"]
            answer: "MOW"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "A quarter turn is as far as the minute hand goes from 12 to 6. Is that true?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Opposite faces add up to 7."
            say: "On a dice, the dots on two opposite faces always add up to seven. If the one is on top, the six is underneath. The two is opposite the five, and the three is opposite the four."
            show: { drawn: dots, count: 1, layout: dice }
          - text: "1 on top, 2 at the front.\nTip it forward, towards you: the 5 comes on top."
            say: "The dice has the one on top and the two facing you. Tip it forward, towards you. The one rolls to the front and the two goes underneath. The face that was at the back comes up to the top. The back face is opposite the two, so it is the five."
          - text: "Tip it to the right: the face on the left comes on top."
            say: "It works the same in every direction. When you tip a dice to the right, the face that was on the left comes on top. The face on the side you tip towards goes underneath."
          - text: "Turn it flat on the table: the top stays the same."
            say: "If you turn the dice round flat on the table, without tipping it, the number on top stays the same. Only the side faces move round."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The 3 is on top. Which number is underneath?"
                show: { drawn: dots, count: 3, layout: dice }
                options: ["4", "3", "6"]
                answer: "4"
                hints:
                  - "Opposite faces add up to 7."
                  - "3 + _ = 7"
                  - "4."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The 1 is on top and the 2 is at the front. You tip the dice forward, towards you. Which number is on top now?"
                options: ["5", "2", "6"]
                answer: "5"
                feedback:
                  "2": "The 2 was at the front. Tipping forward rolls it underneath. The face from the back comes on top."
                  "6": "The 6 was underneath. It rolls to the back. The face from the back comes on top."
                hints:
                  - "Which face was at the back?"
                  - "The back face is opposite the 2. 2 + _ = 7"
                  - "5."
              - id: l2-f3
                type: true_false
                text: "You turn the dice flat on the table without tipping it. The number on top stays the same. Is that true?"
                answer: true
                hints:
                  - "Does the dice roll over?"
                  - "The top face stays on top; only the side faces move round."
                  - "Yes, that is true."
              - id: l2-f4
                type: multiple_choice
                text: "The 2 is on top and the 3 is at the front. You tip the dice forward, towards you. Which number is on top now?"
                options: ["4", "3", "5"]
                answer: "4"
                feedback:
                  "3": "The front face goes underneath when you tip forward. The back face comes on top."
                  "5": "The 5 was underneath. It goes to the back."
                hints:
                  - "The face from the back comes on top."
                  - "The back is opposite the front, the 3. 3 + _ = 7"
                  - "4."
              - id: l2-f5
                type: multiple_choice
                text: "The 4 is on top. You tip the dice over once, in any direction. Which number can never come on top?"
                options: ["3", "1", "5"]
                answer: "3"
                hints:
                  - "Tipping once brings a side face to the top."
                  - "The bottom face goes to a side, never to the top in one tip."
                  - "The bottom face is 3, opposite the 4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The 5 is on top. Which number is underneath?"
                show: { drawn: dots, count: 5, layout: dice }
                options: ["2", "5", "1"]
                answer: "2"
                hints: ["5 + _ = 7"]
              - id: l2-s2
                type: multiple_choice
                text: "The 1 is on top and the 3 is at the front. You tip the dice forward, towards you. Which number is on top now?"
                options: ["4", "3", "6"]
                answer: "4"
                hints: ["The back face comes on top. It is opposite the 3."]
              - id: l2-s3
                type: true_false
                text: "Two numbers on opposite faces of a dice always add up to 7. Is that true?"
                answer: true
                hints: ["Check 1 and 6, 2 and 5, 3 and 4."]
              - id: l2-s4
                type: multiple_choice
                text: "The 2 is on top. You tip the dice forward twice. Which number is on top now?"
                options: ["5", "2", "6"]
                answer: "5"
                hints: ["Two tips forward roll the top face all the way underneath, and the bottom face comes up."]
              - id: l2-s5
                type: multiple_choice
                text: "The 6 is on top and the 4 is on the right. You tip the dice to the right. Which number is on top now?"
                options: ["3", "4", "1"]
                answer: "3"
                hints: ["The face from the left comes on top. It is opposite the 4."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "The 2 is on top. Which number is underneath?"
                show: { drawn: dots, count: 2, layout: dice }
                answer: "5"
              - id: l2-n2
                type: multiple_choice
                text: "The 3 is on top and the 1 is at the front. You tip the dice forward, towards you. Which number is on top now?"
                options: ["6", "1", "4"]
                answer: "6"
              - id: l2-n3
                type: true_false
                text: "You tip a dice forward. The number that was at the front comes on top. Is that true?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "The 5 is on top and the 3 is on the right. You tip the dice to the right. Which number is on top now?"
                options: ["4", "3", "2"]
                answer: "4"
              - id: l2-n5
                type: multiple_choice
                text: "The 4 is on top and the 2 is at the front. You turn the dice a quarter turn, flat on the table. Which number is on top now?"
                options: ["4", "2", "3"]
                answer: "4"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: turn
            type: multiple_choice
            text: "You give the card a half turn. Which letter do you see?"
            show: { drawn: letter-card, text: "u" }
            options: ["n", "u", "h"]
            answer: "n"
            option_audio: false
          - id: l2-c2
            part: turn-or-reflect
            type: true_false
            text: "In a mirror at its side, the word bid looks exactly the same. Is that true?"
            show: { drawn: letter-card, text: "bid" }
            answer: true
          - id: l2-c3
            part: dice-opposite
            type: multiple_choice
            text: "The 1 is on top. Which number is underneath?"
            show: { drawn: dots, count: 1, layout: dice }
            options: ["6", "1", "5"]
            answer: "6"
          - id: l2-c4
            part: dice-tip
            type: multiple_choice
            text: "The 6 is on top and the 2 is at the front. You tip the dice forward, towards you. Which number is on top now?"
            options: ["5", "2", "1"]
            answer: "5"
          - id: l2-c5
            part: dice-tip
            type: multiple_choice
            text: "The 1 is on top and the 5 is on the right. You tip the dice to the right. Which number is on top now?"
            options: ["2", "5", "6"]
            answer: "2"
          - id: l2-c6
            part: turn
            type: multiple_choice
            text: "You give the card a half turn. What number do you read?"
            show: { drawn: letter-card, text: "18" }
            options: ["81", "18", "88"]
            answer: "81"
          - id: l2-c7
            part: turn
            type: multiple_choice
            text: "Which number looks exactly the same after a half turn?"
            options: ["69", "16", "68"]
            answer: "69"
          - id: l2-c8
            part: turn
            type: true_false
            text: "After a half turn, the word NOON still reads NOON. Is that true?"
            show: { drawn: letter-card, text: "NOON" }
            answer: true
          - id: l2-c9
            part: turn
            type: multiple_choice
            text: "You give the card a half turn. What number do you read?"
            show: { drawn: letter-card, text: "86" }
            options: ["98", "68", "89"]
            answer: "98"
          - id: l2-c10
            part: turn-or-reflect
            type: multiple_choice
            text: "Which move makes b look like d?"
            options: ["a reflection in a mirror at its side", "a half turn", "a quarter turn"]
            answer: "a reflection in a mirror at its side"
          - id: l2-c11
            part: turn-or-reflect
            type: true_false
            text: "However you turn a card with p on it, flat on the table, it never shows q. Is that true?"
            answer: true
          - id: l2-c12
            part: turn-or-reflect
            type: multiple_choice
            text: "The card shows b. Ali moves it and now sees q. What did Ali do?"
            options: ["He gave it a half turn.", "He held it up to a mirror at its side.", "He gave it a quarter turn."]
            answer: "He gave it a half turn."
          - id: l2-c13
            part: turn-or-reflect
            type: true_false
            text: "In a mirror at its side, the word DAD looks exactly the same. Is that true?"
            show: { drawn: letter-card, text: "DAD" }
            answer: false
          - id: l2-c14
            part: dice-opposite
            type: text_input
            text: "The 4 is on top. Which number is underneath?"
            show: { drawn: dots, count: 4, layout: dice }
            answer: "3"
          - id: l2-c15
            part: dice-opposite
            type: multiple_choice
            text: "The 6 is at the front of a dice. Which number is at the back?"
            options: ["1", "6", "5"]
            answer: "1"
          - id: l2-c16
            part: dice-opposite
            type: true_false
            text: "On a dice, the 2 and the 4 are on opposite faces. Is that true?"
            answer: false
          - id: l2-c17
            part: dice-opposite
            type: multiple_choice
            text: "You can see three faces of a dice: 1 on top, 2 at the front and 3 on the right. What do the three hidden faces add up to?"
            options: ["15", "6", "21"]
            answer: "15"
          - id: l2-c18
            part: dice-tip
            type: multiple_choice
            text: "The 4 is on top and the 6 is at the front. You tip the dice forward, towards you. Which number is on top now?"
            options: ["1", "6", "3"]
            answer: "1"
          - id: l2-c19
            part: dice-tip
            type: true_false
            text: "The 2 is on top and the 1 is on the right. You tip the dice to the right. Is the 6 on top now?"
            answer: true
          - id: l2-c20
            part: dice-tip
            type: multiple_choice
            text: "The 3 is on top and the 2 is at the front. You tip the dice forward, towards you, and then turn it flat on the table. Which number is on top now?"
            options: ["5", "2", "3"]
            answer: "5"
