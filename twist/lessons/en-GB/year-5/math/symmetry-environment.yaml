# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.symmetry-environment
skill: math.symmetry.in-environment
curriculum: en-GB
language: en
title:
  de: Symmetrie in der Umwelt
  en: Symmetry around us
summary: >
  Lesson 1 finds symmetry in nature and in things people make (a
  butterfly, a fir tree, a fork; not a cup with a handle) and in
  reflections in water, where the mirror line is the water's edge and the
  reflection is upside down; lesson 2 finds symmetry in words (MUM with a
  vertical line, BOX with a horizontal one, MAT with none), in mirror
  writing on an ambulance, snowflakes, rangoli patterns and patterns on
  squared paper, and ends with the skill check. Taking photos of symmetry
  around the child or making a picture waits for a camera or drawing task.
metadata:
  year: year-5
  topic: { de: Symmetrie, en: Symmetry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.symmetry.identify]
  also_practises: [math.symmetry.several-axes]
  vocabulary: { en: [symmetrical, line of symmetry, mirror line, reflection, reflect, vertical, horizontal, mirror writing, rangoli, pattern] }
  forms: [text, audio, picture, drawn]
  drawn: [grid, letter-card, shape]
  facets: []
  misconceptions:
    - id: reflection-line-upright
      what: Thinks the mirror line of a reflection in water runs up through the object, not along the water's edge
      addressed: lesson 1 Learn puts the line on the water's edge; l1-f2 (with feedback), l1-n2, l1-c2, l2-w2 and l2-c2 ask where the line is, l1-f4 and l1-s3 ask what the reflection looks like
    - id: symmetric-letters-make-symmetric-word
      what: Thinks a word has a vertical line of symmetry as soon as all its letters do, without checking that it reads the same backwards (MAT, TOY)
      addressed: lesson 2 Learn shows MAT becoming TAM in a mirror; l2-f3 and l2-s3 ask about MAT and TOY, l2-f1, l2-s1, l2-n1 and l2-c3 offer words of symmetrical letters that do not read the same backwards
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Symmetrie in Natur und Spiegelbild", en: "Symmetry in nature and reflections" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "The dashed line is a line of symmetry of the pattern. Is that true?"
            show: { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[1, 1, blue], [4, 1, blue], [2, 0, red], [3, 0, red]] }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many lines of symmetry does a square have?"
            show: { drawn: shape, kind: square, colour: blue }
            options: ["4", "2", "1"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Symmetry in nature"
            say: "Look at this butterfly. A line down the middle of its body is a line of symmetry: one wing is the mirror image of the other. Leaves, flowers and many animals seen from the front are symmetrical too."
            show: { object: butterfly }
          - text: "Things people make"
            say: "Lots of things people make are symmetrical, like a fork, a T-shirt or a crown. Some are not. A cup with a handle on one side has no line of symmetry."
            show: { object: fork }
          - text: "Reflections in water: the mirror line is the water's edge, where the water meets the land."
            say: "Think of a tree beside a still lake. You see the tree in the water, upside down. The line of symmetry runs along the water's edge, flat across the picture, not up through the tree."
          - text: "Check: every part has a partner."
            say: "To check for symmetry, look at each part on one side of the line. Is there a matching part on the other side, the same distance from the line? If one part has no partner, the picture is not symmetrical."
            show: { object: cup }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which picture is symmetrical?"
                options:
                  - { object: butterfly }
                  - { object: snail }
                  - { object: giraffe }
                answer: butterfly
                feedback:
                  snail: "The snail's shell is on one side and its head on the other. One half does not mirror the other."
                hints:
                  - "Imagine a line down the middle of each picture."
                  - "Which one would match if you folded it along that line?"
                  - "The butterfly."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A tree stands beside a lake. Where is the mirror line between the tree and its reflection?"
                options: ["along the water's edge", "down the middle of the tree", "at the top of the tree"]
                answer: "along the water's edge"
                feedback:
                  "down the middle of the tree": "That line would split the tree into left and right. The reflection is below the tree, in the water."
                hints:
                  - "Where does the tree end and the reflection start?"
                  - "The reflection hangs down from the edge of the lake."
                  - "Along the water's edge."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which picture is not symmetrical?"
                options:
                  - { object: heart }
                  - { object: fir-tree }
                  - { object: cup }
                answer: cup
                feedback:
                  heart: "A heart has a line of symmetry straight down its middle."
                hints:
                  - "Look for a part on one side that has no partner."
                  - "Which one has something sticking out on only one side?"
                  - "The cup, because of its handle."
              - id: l1-f4
                type: true_false
                text: "A tree's reflection in a lake is upside down. Is that true?"
                answer: true
                hints:
                  - "The top of the tree is furthest from the water."
                  - "In the reflection, the top is furthest from the water too, but below it."
                  - "Yes, the reflection is upside down."
              - id: l1-f5
                type: multiple_choice
                text: "Where is the line of symmetry of a butterfly with open wings?"
                show: { object: butterfly }
                options: ["down the middle of its body", "across its wings", "it has none"]
                answer: "down the middle of its body"
                hints:
                  - "One wing mirrors the other."
                  - "The line goes between the two wings."
                  - "Down the middle of its body."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which picture is symmetrical?"
                options:
                  - { object: fork }
                  - { object: watering-can }
                  - { object: shoe }
                answer: fork
                hints: ["Which one has nothing sticking out on just one side?"]
              - id: l1-s2
                type: true_false
                text: "This cup is symmetrical. Is that true?"
                show: { object: cup }
                answer: false
                hints: ["Does the handle have a partner on the other side?"]
              - id: l1-s3
                type: multiple_choice
                text: "You see a mountain reflected in a still lake. What does the reflection look like?"
                options: ["the mountain upside down", "the mountain the same way up", "half of the mountain"]
                answer: "the mountain upside down"
                hints: ["The mirror line is the water's edge, across the picture."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Which picture has a line of symmetry?"
                options:
                  - { object: owl }
                  - { object: kettle }
                  - { object: cow }
                answer: owl
                hints: ["Which one is seen straight from the front?"]
              - id: l1-s5
                type: multiple_choice
                text: "A leaf has a line of symmetry. Where is it?"
                show: { object: leaf }
                options: ["along the vein down the middle", "across the leaf", "round the edge"]
                answer: "along the vein down the middle"
                hints: ["The two halves of the leaf mirror each other."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Which picture is symmetrical?"
                options:
                  - { object: star }
                  - { object: jug }
                  - { object: elephant }
                answer: star
              - id: l1-n2
                type: multiple_choice
                text: "A boat is reflected in calm water. Where is the mirror line?"
                options: ["the surface of the water", "the mast of the boat", "the front of the boat"]
                answer: "the surface of the water"
              - id: l1-n3
                type: image_multiple_choice
                text: "Which picture is not symmetrical?"
                options:
                  - { object: t-shirt }
                  - { object: light-bulb }
                  - { object: giraffe }
                answer: giraffe
              - id: l1-n4
                type: true_false
                text: "Every animal is symmetrical when you see it from the side. Is that true?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "How many lines of symmetry does this heart have?"
                show: { object: heart }
                options: ["1", "2", "0"]
                answer: "1"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which picture is symmetrical?"
            options:
              - { object: crown }
              - { object: snail }
              - { object: kettle }
            answer: crown
          - id: l1-c2
            type: multiple_choice
            text: "A house stands by a river. In the water you see it upside down. Where is the mirror line?"
            options: ["the edge of the water", "the roof", "the front door"]
            answer: "the edge of the water"
          - id: l1-c3
            type: true_false
            text: "A fir tree has a line of symmetry down its middle. Is that true?"
            show: { object: fir-tree }
            answer: true

  - n: 2
    title: { de: "Symmetrie in Wörtern, Mustern und Kunst", en: "Symmetry in words, patterns and art" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Which picture is symmetrical?"
            options:
              - { object: heart }
              - { object: cup }
              - { object: snail }
            answer: heart
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "A swan is reflected in a pond. Where is the mirror line?"
            options: ["the surface of the pond", "the swan's neck", "the swan's tail"]
            answer: "the surface of the pond"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "MUM: a vertical line of symmetry"
            say: "Words can be symmetrical too. M and U each have a vertical line of symmetry, and MUM reads the same backwards. So a vertical mirror line through the middle of the word works."
            show: { drawn: letter-card, text: "MUM" }
          - text: "MAT: no line of symmetry. In a mirror it reads TAM."
            say: "Be careful. M, A and T are all symmetrical letters, but MAT reads TAM in a mirror at its side. The letters swap places, so the word is not symmetrical. A word needs symmetrical letters and must read the same backwards."
            show: { drawn: letter-card, text: "MAT" }
          - text: "BOX: a horizontal line of symmetry"
            say: "Some letters have a horizontal line of symmetry: B, C, D, E, H, I, K, O and X. A word made only from these, like BOX, has a horizontal mirror line through the middle. Top and bottom swap, but the order of the letters stays the same."
            show: { drawn: letter-card, text: "BOX" }
          - text: "Snowflakes, rangoli and ambulances"
            say: "Symmetry is all around us in art and patterns. A snowflake usually has six lines of symmetry. Rangoli patterns, made for Diwali, often have four or eight. On the front of an ambulance, the word AMBULANCE is written back to front, so drivers in front read it the right way round in their mirror."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which word has a vertical line of symmetry?"
                options: ["WOW", "WOE", "OWL"]
                answer: "WOW"
                feedback:
                  "OWL": "L is not symmetrical, and OWL does not read the same backwards."
                hints:
                  - "The letters must be symmetrical and the word must read the same backwards."
                  - "Read each word backwards."
                  - "WOW."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which word has a horizontal line of symmetry?"
                options: ["BOOK", "BOOT", "MOON"]
                answer: "BOOK"
                feedback:
                  "MOON": "M and N do not match top to bottom. Try folding them along a line across the middle."
                hints:
                  - "Every letter must match top and bottom."
                  - "B, O and K are symmetrical top to bottom. T, M and N are not."
                  - "BOOK."
              - id: l2-f3
                type: true_false
                text: "MAT has a vertical line of symmetry, because M, A and T are all symmetrical. Is that true?"
                answer: false
                hints:
                  - "Read the word backwards."
                  - "In a mirror at its side, MAT reads TAM."
                  - "No. The letters swap places, so the word is not symmetrical."
              - id: l2-f4
                type: multiple_choice
                text: "Why is AMBULANCE written back to front on the front of an ambulance?"
                options: ["so drivers in front can read it in their mirror", "to make it look modern", "by mistake"]
                answer: "so drivers in front can read it in their mirror"
                hints:
                  - "Who sees the front of the ambulance?"
                  - "The drivers ahead see it in their rear-view mirror."
                  - "A mirror flips the writing back the right way."
              - id: l2-f5
                type: multiple_choice
                text: "How many lines of symmetry does a snowflake usually have?"
                options: ["6", "4", "1"]
                answer: "6"
                hints:
                  - "A snowflake has six arms."
                  - "A line goes through each arm and the gap opposite it."
                  - "6."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which word has a vertical line of symmetry?"
                options: ["TOOT", "TOOK", "TOOL"]
                answer: "TOOT"
                hints: ["Which word reads the same backwards?"]
              - id: l2-s2
                type: multiple_choice
                text: "Which word has a horizontal line of symmetry?"
                options: ["HIDE", "RIDE", "WIDE"]
                answer: "HIDE"
                hints: ["R and W do not match top to bottom."]
              - id: l2-s3
                type: true_false
                text: "TOY has a vertical line of symmetry. Is that true?"
                answer: false
                hints: ["What does TOY look like in a mirror at its side?"]
              - id: l2-s4
                type: true_false
                text: "The pattern is symmetrical about the dashed line. Is that true?"
                show: { drawn: grid, cols: 6, rows: 4, axis: 3, cells: [[0, 0, red], [5, 0, red], [1, 1, blue], [4, 1, blue], [2, 2, green], [2, 3, yellow], [3, 3, yellow]] }
                answer: false
                hints: ["Does every coloured square have a partner on the other side?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which has the most lines of symmetry?"
                options: ["a snowflake", "a butterfly", "a heart"]
                answer: "a snowflake"
                hints: ["A butterfly and a heart have one each."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which word has a vertical line of symmetry?"
                options: ["TOT", "TOP", "POT"]
                answer: "TOT"
              - id: l2-n2
                type: multiple_choice
                text: "Which word has a horizontal line of symmetry?"
                options: ["KID", "KIT", "KIN"]
                answer: "KID"
              - id: l2-n3
                type: true_false
                text: "The pattern is symmetrical about the dashed line. Is that true?"
                show: { drawn: grid, cols: 6, rows: 3, axis: 3, cells: [[0, 1, purple], [5, 1, purple], [1, 0, orange], [4, 0, orange], [2, 2, green], [3, 2, green]] }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Which word looks the same in a mirror at its side?"
                options: ["MUM", "MAN", "ARM"]
                answer: "MUM"
              - id: l2-n5
                type: multiple_choice
                text: "You drop wet paint on paper, fold it in half and open it again. What is the fold?"
                options: ["a line of symmetry", "a right angle", "the edge of the picture"]
                answer: "a line of symmetry"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Which picture is symmetrical?"
            options:
              - { object: fly }
              - { object: shoe }
              - { object: giraffe }
            answer: fly
          - id: l2-c2
            type: multiple_choice
            text: "A bridge is reflected in a canal. Where is the mirror line?"
            options: ["the surface of the water", "the middle of the bridge", "the top of the bridge"]
            answer: "the surface of the water"
          - id: l2-c3
            type: multiple_choice
            text: "Which word has a vertical line of symmetry?"
            options: ["OXO", "OXEN", "BOX"]
            answer: "OXO"
          - id: l2-c4
            type: multiple_choice
            text: "Which word has a horizontal line of symmetry?"
            options: ["CODE", "COPE", "CUBE"]
            answer: "CODE"
          - id: l2-c5
            type: true_false
            text: "The pattern is symmetrical about the dashed line. Is that true?"
            show: { drawn: grid, cols: 4, rows: 4, axis_row: 2, cells: [[0, 0, red], [0, 3, red], [1, 1, blue], [1, 2, blue], [3, 0, green]] }
            answer: false
