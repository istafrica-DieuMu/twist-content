# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.fractions-times-whole
skill: math.fractions.multiply-by-whole
curriculum: en-GB
language: en
title:
  de: Brüche mit ganzen Zahlen malnehmen
  en: Multiplying fractions by whole numbers
summary: >
  Multiplying a fraction by a whole number as repeated addition: multiply
  the numerator and keep the denominator (2/7 × 3 = 6/7), and write an
  answer greater than 1 as a mixed number (2/5 × 3 = 1 1/5). Lesson 1
  multiplies proper fractions; lesson 2 multiplies mixed numbers, either
  by multiplying the whole number and the fraction separately or by
  changing to an improper fraction first, solves recipe, running and
  plank problems, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.fractions.mixed-numbers]
  also_practises: [math.fractions.mixed-numbers]
  vocabulary: { en: [fraction, numerator, denominator, multiply, lots of, repeated addition, mixed number, improper fraction, whole number] }
  forms: [drawn, text, audio]
  drawn: [fraction]
  facets: [operation-signs]
  parts:
    - { id: proper, what: { de: einen echten Bruch mit einer ganzen Zahl malnehmen, en: multiplying a proper fraction by a whole number } }
    - { id: to-mixed, what: { de: ein Ergebnis größer als 1 als gemischte Zahl schreiben, en: writing an answer greater than 1 as a mixed number } }
    - { id: mixed-numbers, what: { de: "eine gemischte Zahl mit einer ganzen Zahl malnehmen, Teil für Teil oder als unechten Bruch", en: "multiplying a mixed number by a whole number, part by part or as an improper fraction" } }
    - { id: in-context, what: { de: Sachaufgaben mit Brüchen mal ganzen Zahlen, en: word problems with fractions times whole numbers } }
  misconceptions:
    - id: multiplies-denominator
      what: Multiplies the denominator too (2/7 × 3 = 6/21)
      addressed: lesson 1 Learn adds the fraction again and again so the parts stay sevenths; l1-f1 has feedback, l1-s4 asks it, every proper-fraction task offers it
    - id: whole-part-only
      what: Multiplies only the whole number of a mixed number, or only the fraction (1 1/4 × 3 = 3 1/4)
      addressed: lesson 2 Learn multiplies both parts; l2-f1 has feedback, l2-f3, l2-s4, l2-n4 and l2-c4 offer one part multiplied
    - id: improper-left
      what: Loses a whole when changing the answer to a mixed number (9/4 = 1 1/4)
      addressed: lesson 1 Learn and lesson 2 Learn change answers into mixed numbers; l1-s3, l2-s5 and l2-c3 offer a wrong mixed number, l1-n2 asks for the mixed number typed
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Echte Brüche malnehmen, en: Multiplying proper fractions }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Write 7/4 as a mixed number."
            say: "Write seven quarters as a mixed number."
            options: ["1 3/4", "3 1/4", "1 4/7"]
            answer: "1 3/4"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "2 1/3 = _/3"
            say: "Two and one third is how many thirds?"
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2/7 × 3 = 2/7 + 2/7 + 2/7 = 6/7"
            say: "Two sevenths times three means three lots of two sevenths. Add them: two sevenths, four sevenths, six sevenths."
            show: { drawn: fraction, kind: bar, parts: 7, shaded: 6 }
          - text: "3/8 × 2 = 6/8\nMultiply the numerator. The denominator stays the same."
            say: "The quick way: multiply the numerator by the whole number and keep the denominator. The parts are still eighths, so three eighths times two is six eighths."
          - text: "2/5 × 3 = 6/5 = 1 1/5"
            say: "Sometimes the answer is more than one whole. Two fifths times three is six fifths. Five fifths make one whole, so six fifths is one and one fifth."
            show: { drawn: fraction, kind: rect, rows: 2, parts: 10, shaded: 6 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "2/7 × 3 = _"
                say: "Two sevenths times three."
                options: ["6/7", "6/21", "5/7"]
                answer: "6/7"
                option_audio: false
                feedback:
                  "6/21": "Only the numerator is multiplied. 3 lots of 2 sevenths are 6 sevenths: the parts stay sevenths."
                hints:
                  - "It means 3 lots of 2/7."
                  - "2/7 + 2/7 + 2/7. The parts are sevenths."
                  - "2 × 3 = 6, so 6/7."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Work out 3/10 × 3."
                say: "Work out three tenths times three."
                frame: "3/10 + 3/10 + 3/10 = _/10"
                options: ["6", "9", "30"]
                answer: ["9"]
                hints:
                  - "Add the tenths."
                  - "3 + 3 + 3."
                  - "9 tenths: 9/10."
              - id: l1-f3
                type: multiple_choice
                text: "2/5 × 3 = _"
                say: "Two fifths times three."
                options: ["1 1/5", "6/15", "1 2/5"]
                answer: "1 1/5"
                option_audio: false
                hints:
                  - "Multiply the numerator: 2 × 3."
                  - "6/5. How many fifths make one whole?"
                  - "5 fifths make 1, so 6/5 = 1 1/5."
              - id: l1-f4
                type: multiple_choice
                text: "Which is the same as 4 × 1/3?"
                say: "Which is the same as four times one third?"
                options: ["4/3", "4/12", "1/12"]
                answer: "4/3"
                option_audio: false
                hints:
                  - "4 lots of one third."
                  - "1/3 + 1/3 + 1/3 + 1/3."
                  - "4 thirds: 4/3."
              - id: l1-f5
                type: text_input
                text: "5/8 × 4 = _/8"
                say: "Five eighths times four is how many eighths?"
                answer: "20"
                hints:
                  - "Multiply the numerator. The denominator stays 8."
                  - "5 × 4."
                  - "20/8."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "3/8 × 2 = _"
                say: "Three eighths times two."
                options: ["6/8", "6/16", "5/8"]
                answer: "6/8"
                option_audio: false
                hints: ["2 lots of 3 eighths."]
              - id: l1-s2
                type: text_input
                text: "4/9 × 2 = _/9"
                say: "Four ninths times two is how many ninths?"
                answer: "8"
                hints: ["4 × 2."]
              - id: l1-s3
                type: multiple_choice
                text: "3/4 × 3 = _"
                say: "Three quarters times three."
                options: ["2 1/4", "9/12", "1 1/4"]
                answer: "2 1/4"
                option_audio: false
                hints: ["9/4. Each 4 quarters make a whole."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 1/6 × 5 = 5/30"
                say: "Is it true? One sixth times five is five thirtieths."
                answer: false
                hints: ["5 lots of one sixth are still sixths."]
              - id: l1-s5
                type: multiple_choice
                text: "5 × 2/3 = _"
                say: "Five times two thirds."
                options: ["3 1/3", "10/15", "2 1/3"]
                answer: "3 1/3"
                option_audio: false
                hints: ["10/3. How many wholes are in 10 thirds?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "2/9 × 4 = _/9"
                say: "Two ninths times four is how many ninths?"
                answer: "8"
              - id: l1-n2
                type: text_input
                keyboard: fraction
                text: "3/5 × 4 = _\nWrite the answer as a mixed number."
                say: "Three fifths times four. Write the answer as a mixed number."
                answer: "2 2/5"
              - id: l1-n3
                type: text_input
                text: "1/4 × 8 = _"
                say: "One quarter times eight. How many wholes is that?"
                answer: "2"
              - id: l1-n4
                type: multiple_choice
                text: "Which is bigger, 3/10 × 3 or 1/2?"
                say: "Which is bigger, three tenths times three, or one half?"
                options: ["3/10 × 3", "1/2", "They are equal."]
                answer: "3/10 × 3"
                keep_order: true
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? 4/7 × 2 = 8/7 = 1 1/7"
                say: "Is it true? Four sevenths times two is eight sevenths, which is one and one seventh."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "2/9 × 3 = _"
            say: "Two ninths times three."
            options: ["6/9", "6/27", "5/9"]
            answer: "6/9"
            option_audio: false
          - id: l1-c2
            type: text_input
            text: "5/6 × 2 = _/6"
            say: "Five sixths times two is how many sixths?"
            answer: "10"
          - id: l1-c3
            type: multiple_choice
            text: "3/4 × 2 = _"
            say: "Three quarters times two."
            options: ["1 2/4", "6/8", "1 1/4"]
            answer: "1 2/4"
            option_audio: false
          - id: l1-c4
            type: text_input
            text: "1/12 × 7 = _/12"
            say: "One twelfth times seven is how many twelfths?"
            answer: "7"
          - id: l1-c5
            type: true_false
            text: "Is it true? 3/5 × 2 = 6/10"
            say: "Is it true? Three fifths times two is six tenths."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "4/6 × 2 = _"
            say: "Four sixths times two."
            options: ["1 2/6", "8/12", "1 4/6"]
            answer: "1 2/6"
            option_audio: false

  - n: 2
    title: { de: Gemischte Zahlen malnehmen, en: Multiplying mixed numbers }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "2/5 × 4 = _"
            say: "Two fifths times four."
            options: ["1 3/5", "8/20", "1 2/5"]
            answer: "1 3/5"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "3/7 × 2 = _/7"
            say: "Three sevenths times two is how many sevenths?"
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 1/4 × 3\n1 × 3 = 3\n1/4 × 3 = 3/4\n1 1/4 × 3 = 3 3/4"
            say: "To multiply a mixed number, multiply both parts. One times three is three. One quarter times three is three quarters. Together: three and three quarters."
            show: { drawn: fraction, kind: rect, rows: 4, parts: 16, shaded: 15 }
          - text: "2 2/3 × 2\n2 × 2 = 4\n2/3 × 2 = 4/3 = 1 1/3\n4 + 1 1/3 = 5 1/3"
            say: "Two and two thirds times two. Two times two is four. Two thirds times two is four thirds, which is one and one third. Four add one and one third is five and one third."
          - text: "Or: 2 2/3 = 8/3\n8/3 × 2 = 16/3 = 5 1/3"
            say: "Another way is to change the mixed number into an improper fraction first. Two and two thirds is eight thirds. Eight thirds times two is sixteen thirds, and sixteen thirds is five and one third. Both ways give the same answer."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "1 1/4 × 3 = _"
                say: "One and one quarter times three."
                options: ["3 3/4", "3 1/4", "1 3/4"]
                answer: "3 3/4"
                option_audio: false
                feedback:
                  "3 1/4": "Multiply the fraction as well: 1/4 × 3 = 3/4."
                hints:
                  - "Multiply the whole number and the fraction."
                  - "1 × 3 = 3 and 1/4 × 3 = 3/4."
                  - "3 and 3/4: 3 3/4."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Work out 2 2/3 × 2."
                say: "Work out two and two thirds times two."
                frame: "2 × 2 = _, 2/3 × 2 = 4/3 = 1 _/3, so 2 2/3 × 2 = _"
                options: ["1", "2", "4", "4 2/3", "5 1/3"]
                answer: ["4", "1", "5 1/3"]
                hints:
                  - "Multiply the 2 wholes first, then the 2/3."
                  - "4/3 is 1 whole and 1 third."
                  - "4 + 1 1/3 = 5 1/3."
              - id: l2-f3
                type: multiple_choice
                text: "1 2/5 × 2 = _"
                say: "One and two fifths times two."
                options: ["2 4/5", "2 2/5", "1 4/5"]
                answer: "2 4/5"
                option_audio: false
                hints:
                  - "Multiply both parts by 2."
                  - "1 × 2 = 2 and 2/5 × 2 = 4/5."
                  - "2 4/5."
              - id: l2-f4
                type: text_input
                text: "1 1/2 × 4 = _"
                say: "One and a half times four."
                answer: "6"
                hints:
                  - "1 × 4 = 4. Then 1/2 × 4."
                  - "4 halves make 2 wholes."
                  - "4 + 2 = 6."
              - id: l2-f5
                type: multiple_choice
                text: "1 3/4 = 7/4. Work out 7/4 × 3."
                say: "One and three quarters is seven quarters. Work out seven quarters times three."
                options: ["5 1/4", "3 3/4", "5 3/4"]
                answer: "5 1/4"
                option_audio: false
                hints:
                  - "Multiply the numerator: 7 × 3."
                  - "21/4. How many wholes are in 21 quarters?"
                  - "20 quarters are 5 wholes, so 21/4 = 5 1/4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "2 1/3 × 3 = _"
                say: "Two and one third times three."
                options: ["7", "6 1/3", "6 3/9"]
                answer: "7"
                option_audio: false
                hints: ["1/3 × 3 = 3/3 = 1."]
              - id: l2-s2
                type: text_input
                text: "1 1/5 × 4 = 4 _/5"
                say: "One and one fifth times four is four and how many fifths?"
                answer: "4"
                hints: ["1/5 × 4."]
              - id: l2-s3
                type: multiple_choice
                text: "3 1/2 × 2 = _"
                say: "Three and a half times two."
                options: ["7", "6 1/2", "6 2/4"]
                answer: "7"
                option_audio: false
                hints: ["Two halves make a whole."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 1 1/4 × 2 = 2 1/4"
                say: "Is it true? One and one quarter times two is two and one quarter."
                answer: false
                hints: ["Multiply the quarter by 2 as well."]
              - id: l2-s5
                type: multiple_choice
                text: "2 3/4 × 2 = _"
                say: "Two and three quarters times two."
                options: ["5 2/4", "4 6/8", "4 3/4"]
                answer: "5 2/4"
                option_audio: false
                hints: ["3/4 × 2 = 6/4 = 1 2/4."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A recipe needs 1 1/2 cups of flour. Mo makes the recipe 3 times. How much flour does he need?"
                say: "A recipe needs one and a half cups of flour. Mo makes the recipe three times. How much flour does he need?"
                options: ["4 1/2 cups", "3 1/2 cups", "6 cups"]
                answer: "4 1/2 cups"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "One lap of the park path is 3/4 km. Zara runs 5 laps. How far does she run?"
                say: "One lap of the park path is three quarters of a kilometre. Zara runs five laps. How far does she run?"
                options: ["3 3/4 km", "15/20 km", "5 3/4 km"]
                answer: "3 3/4 km"
                option_audio: false
              - id: l2-n3
                type: text_input
                text: "A bottle holds 2/5 of a litre. How many fifths of a litre do 6 bottles hold?"
                say: "A bottle holds two fifths of a litre. How many fifths of a litre do six bottles hold?"
                answer: "12"
              - id: l2-n4
                type: multiple_choice
                text: "A plank is 2 1/3 m long. How long are 3 planks laid end to end?"
                say: "A plank is two and one third metres long. How long are three planks laid end to end?"
                options: ["7 m", "6 1/3 m", "2 3/3 m"]
                answer: "7 m"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Sam walks 1/2 km to school and 1/2 km home, every day for 5 days. Is it true that he walks 5 km in all?"
                say: "Sam walks half a kilometre to school and half a kilometre home, every day for five days. Is it true that he walks five kilometres in all?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: proper
            type: multiple_choice
            text: "3/11 × 3 = _"
            say: "Three elevenths times three."
            options: ["9/11", "9/33", "6/11"]
            answer: "9/11"
            option_audio: false
          - id: l2-c2
            part: proper
            type: text_input
            text: "7/10 × 3 = _/10"
            say: "Seven tenths times three is how many tenths?"
            answer: "21"
          - id: l2-c3
            part: to-mixed
            type: multiple_choice
            text: "5/6 × 4 = _"
            say: "Five sixths times four."
            options: ["3 2/6", "20/24", "3 1/6"]
            answer: "3 2/6"
            option_audio: false
          - id: l2-c4
            part: mixed-numbers
            type: multiple_choice
            text: "1 3/5 × 2 = _"
            say: "One and three fifths times two."
            options: ["3 1/5", "2 3/5", "2 6/10"]
            answer: "3 1/5"
            option_audio: false
          - id: l2-c5
            part: mixed-numbers
            type: text_input
            text: "2 1/4 × 4 = _"
            say: "Two and one quarter times four."
            answer: "9"
          - id: l2-c6
            part: proper
            type: text_input
            text: "4/11 × 2 = _/11"
            say: "Four elevenths times two is how many elevenths?"
            answer: "8"
          - id: l2-c7
            part: proper
            type: true_false
            text: "Is it true? 2/9 × 4 = 8/36"
            say: "Is it true? Two ninths times four is eight thirty-sixths."
            answer: false
          - id: l2-c8
            part: proper
            type: multiple_choice
            text: "Which multiplication is the same as 2/9 + 2/9 + 2/9 + 2/9 + 2/9?"
            say: "Which multiplication is the same as two ninths plus two ninths plus two ninths plus two ninths plus two ninths?"
            options: ["2/9 × 5", "2/9 × 2", "2/45 × 5"]
            answer: "2/9 × 5"
            option_audio: false
          - id: l2-c9
            part: to-mixed
            type: text_input
            keyboard: fraction
            text: "3/8 × 5 = _\nWrite the answer as a mixed number."
            say: "Three eighths times five. Write the answer as a mixed number."
            answer: "1 7/8"
          - id: l2-c10
            part: to-mixed
            type: multiple_choice
            text: "2/3 × 4 = _"
            say: "Two thirds times four."
            options: ["2 2/3", "8/12", "1 2/3"]
            answer: "2 2/3"
            option_audio: false
          - id: l2-c11
            part: to-mixed
            type: true_false
            text: "Is it true? 5/9 × 3 = 1 6/9"
            say: "Is it true? Five ninths times three is one and six ninths."
            answer: true
          - id: l2-c12
            part: to-mixed
            type: multiple_choice
            text: "Which calculation has an answer greater than 1?"
            say: "Which calculation has an answer greater than one?"
            options: ["3/10 × 4", "2/9 × 4", "1/6 × 5"]
            answer: "3/10 × 4"
            option_audio: false
          - id: l2-c13
            part: mixed-numbers
            type: fill_in_blank
            text: "Work out 2 1/6 × 4."
            say: "Work out two and one sixth times four."
            frame: "2 × 4 = _, 1/6 × 4 = _/6, so 2 1/6 × 4 = _"
            options: ["4", "8", "2 4/6", "8 4/6"]
            answer: ["8", "4", "8 4/6"]
          - id: l2-c14
            part: mixed-numbers
            type: text_input
            keyboard: fraction
            text: "4 1/5 × 2 = _"
            say: "Four and one fifth times two."
            answer: "8 2/5"
          - id: l2-c15
            part: mixed-numbers
            type: multiple_choice
            text: "1 3/8 × 3 = _"
            say: "One and three eighths times three."
            options: ["4 1/8", "3 3/8", "3 9/24"]
            answer: "4 1/8"
            option_audio: false
          - id: l2-c16
            part: in-context
            type: multiple_choice
            text: "A ribbon is 3/8 m long. Kim needs 3 ribbons. How much ribbon does she need?"
            say: "A ribbon is three eighths of a metre long. Kim needs three ribbons. How much ribbon does she need?"
            options: ["1 1/8 m", "9/24 m", "1 3/8 m"]
            answer: "1 1/8 m"
            option_audio: false
          - id: l2-c17
            part: in-context
            type: text_input
            text: "A jug holds 1 1/2 litres. How many litres do 6 jugs hold?"
            say: "A jug holds one and a half litres. How many litres do six jugs hold?"
            answer: "9"
          - id: l2-c18
            part: in-context
            type: true_false
            text: "Each cake needs 2/3 of a cup of sugar. Ana bakes 3 cakes. Is it true that she needs 2 cups of sugar?"
            say: "Each cake needs two thirds of a cup of sugar. Ana bakes three cakes. Is it true that she needs two cups of sugar?"
            answer: true
          - id: l2-c19
            part: in-context
            type: multiple_choice
            text: "A snail crawls 1 1/4 m every minute. How far does it crawl in 5 minutes?"
            say: "A snail crawls one and a quarter metres every minute. How far does it crawl in five minutes?"
            options: ["6 1/4 m", "5 1/4 m", "5 5/20 m"]
            answer: "6 1/4 m"
            option_audio: false
          - id: l2-c20
            part: in-context
            type: text_input
            keyboard: fraction
            text: "Four friends each drink 2/5 of a litre of juice. How many litres do they drink altogether? Write the answer as a mixed number."
            say: "Four friends each drink two fifths of a litre of juice. How many litres do they drink altogether? Write the answer as a mixed number."
            answer: "1 3/5"
