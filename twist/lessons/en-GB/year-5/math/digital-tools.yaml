# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.digital-tools
skill: math.data.digital-tools
curriculum: en-GB
language: en
title:
  de: Daten mit dem Tabellenprogramm
  en: Data in a spreadsheet
summary: >
  Lesson 1 enters survey data in a spreadsheet: columns have letters, rows
  have numbers, and a cell is named column first (B3 is column B, row 3);
  headings go in row 1, the answers in column A and the numbers in column
  B, one thing per cell, the number instead of the tally marks, and the
  entries are checked against the tally chart. Lesson 2 lets the program
  draw a bar chart: select the cells with the data, insert the chart, give
  it a title, see that a changed number changes its bar and that a typing
  mistake (51 for 15) is drawn as well, because the program does not know
  it is wrong; it ends with the skill check. Tables are drawn as a
  spreadsheet; typing into a real spreadsheet stays in the classroom.
metadata:
  year: year-5
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.data.plan-survey]
  also_practises: [math.data.plan-survey, math.data.read-charts]
  vocabulary: { en: [spreadsheet, table, cell, column, row, heading, enter, select, insert chart, bar chart, title, typing mistake] }
  forms: [text, audio, drawn]
  drawn: [bar-chart, table]
  facets: []
  misconceptions:
    - id: row-column-swap
      what: Names a cell row first or mixes up column and row (2C or B3 for column C, row 2)
      addressed: lesson 1 Learn names C2 as column C, row 2; l1-f1 (with feedback), l1-s1, l1-s3, l1-n1, l1-c1, l2-w1 and l2-c1 ask for a cell name, l1-f2, l1-s2, l1-n2 and l1-c2 ask what is in a cell
    - id: program-is-always-right
      what: Trusts the chart because the computer drew it, and does not check the entries
      addressed: lesson 1 Learn checks the table against the tally chart and lesson 2 Learn shows a typing mistake drawn as a far too tall bar; l1-f5, l1-s5, l1-n5, l2-f5, l2-s3, l2-s5, l2-n5 and l2-c4 find or talk about the mistake
    - id: forgets-to-select-all
      what: Selects only part of the data, so a bar or the numbers are missing
      addressed: lesson 2 Learn selects A1 to B4; l2-f1 and l2-f2 (with feedback), l2-s1, l2-s2, l2-n1, l2-n2, l2-c3 and l2-c5 ask which cells to select or which bar is missing
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Daten in die Tabelle", en: "Entering data" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Favourite sport. How many children chose netball?"
            show: { drawn: bar-chart, tally: true, rows: [["Football", 11], ["Netball", 7], ["Swimming", 5]] }
            options: ["7", "11", "5"]
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Football 11, netball 7, swimming 5. There are 23 children in the class, and each chose one sport. Does that fit?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Columns: A, B, C\nRows: 1, 2, 3\nC2 = column C, row 2"
            say: "A spreadsheet is a table on a computer. The columns go down and are named with letters. The rows go across and are numbered. Each box is a cell. A cell is named with its column letter first, then its row number. The yellow cell is C2: column C, row 2."
            show: { drawn: table, sheet: true, header: false, rows: [["", "", ""], ["", "", ""], ["", "", ""]], mark: [[1, 2]] }
          - text: "A survey in a spreadsheet"
            say: "Here is a survey of favourite fruit. The headings go in row 1. The answers go down column A and the numbers down column B. Each cell holds just one thing: a word or a number."
            show: { drawn: table, sheet: true, rows: [["Fruit", "Children"], ["Apple", 9], ["Banana", 6], ["Grapes", 4]] }
          - text: "Type the number, not the tally marks.\nIn B2 you type: 9"
            say: "The tally chart shows nine tally marks for apple. In the spreadsheet you do not draw tally marks. You type the number nine in cell B2."
            show: { drawn: bar-chart, tally: true, rows: [["Apple", 9], ["Banana", 6], ["Grapes", 4]] }
          - text: "Check every number against the tally chart."
            say: "When you have finished, check each number in the spreadsheet against the tally chart. It is easy to press a wrong key, and then every chart you make will be wrong too."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which cell is marked?"
                show: { drawn: table, sheet: true, header: false, rows: [["", "", ""], ["", "", ""], ["", "", ""]], mark: [[2, 1]] }
                options: ["B3", "3B", "C2"]
                answer: "B3"
                feedback:
                  "3B": "The column letter comes first, then the row number."
                  "C2": "Column and row are swapped. The cell is in column B, row 3."
                hints:
                  - "First find the column letter, then the row number."
                  - "The cell is in column B and in row 3."
                  - "B3."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is in cell B3?"
                show: { drawn: table, sheet: true, rows: [["Fruit", "Children"], ["Apple", 9], ["Banana", 6], ["Grapes", 4]] }
                options: ["6", "9", "Banana"]
                answer: "6"
                hints:
                  - "Go down column B to row 3."
                  - "Row 3 is the banana row."
                  - "B3 holds 6."
              - id: l1-f3
                type: multiple_choice
                text: "Which cell does the heading Children go in?"
                show: { drawn: table, sheet: true, rows: [["Fruit", "?"], ["Apple", 9], ["Banana", 6]] }
                options: ["B1", "A1", "B2"]
                answer: "B1"
                hints:
                  - "Headings go in row 1."
                  - "The numbers of children are in column B."
                  - "B1."
              - id: l1-f4
                type: multiple_choice
                text: "Apple has 9 tally marks. What do you type in cell B2?"
                options: ["9", "IIII IIII", "Apple 9"]
                answer: "9"
                feedback:
                  "Apple 9": "Each cell holds one thing. The word Apple is already in A2."
                hints:
                  - "Type the number, not the tally marks."
                  - "Apple is already in column A."
                  - "9."
              - id: l1-f5
                type: multiple_choice
                text: "The tally chart says Apple 9, Banana 6, Grapes 4. Which cell has a typing mistake?"
                show: { drawn: table, sheet: true, rows: [["Fruit", "Children"], ["Apple", 9], ["Banana", 6], ["Grapes", 40]] }
                options: ["B4", "B2", "A4"]
                answer: "B4"
                hints:
                  - "Check each number against the tally chart."
                  - "Grapes should be 4."
                  - "B4 says 40, so B4 has the mistake."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which cell is marked?"
                show: { drawn: table, sheet: true, header: false, rows: [["", "", ""], ["", "", ""], ["", "", ""]], mark: [[1, 2]] }
                options: ["C2", "2C", "B3"]
                answer: "C2"
                hints: ["Column letter first."]
              - id: l1-s2
                type: multiple_choice
                text: "What is in cell A4?"
                show: { drawn: table, sheet: true, rows: [["Pet", "Votes"], ["Dog", 8], ["Cat", 5], ["Fish", 2]] }
                options: ["Fish", "2", "Cat"]
                answer: "Fish"
                hints: ["Go down column A to row 4."]
              - id: l1-s3
                type: true_false
                text: "In a spreadsheet, a cell is named with its row number first, then its column letter. Is that true?"
                answer: false
                hints: ["Think of the cell C2."]
              - id: l1-s4
                type: multiple_choice
                text: "In which column are the numbers?"
                show: { drawn: table, sheet: true, rows: [["Pet", "Votes"], ["Dog", 8], ["Cat", 5]] }
                options: ["column B", "column A", "row 1"]
                answer: "column B"
                hints: ["The answers are in column A."]
              - id: l1-s5
                type: multiple_choice
                text: "The tally chart says Dog 8, Cat 5, Fish 2. Which cell has a typing mistake?"
                show: { drawn: table, sheet: true, rows: [["Pet", "Votes"], ["Dog", 8], ["Cat", 50], ["Fish", 2]] }
                options: ["B3", "B2", "A3"]
                answer: "B3"
                hints: ["Check each number against the tally chart."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which cell is marked?"
                show: { drawn: table, sheet: true, header: false, rows: [["", "", ""], ["", "", ""], ["", "", ""]], mark: [[0, 0]] }
                options: ["A1", "1A", "B1"]
                answer: "A1"
              - id: l1-n2
                type: text_input
                text: "What number is in cell B2?"
                show: { drawn: table, sheet: true, rows: [["Day", "Books"], ["Mon", 12], ["Tue", 15]] }
                answer: "12"
              - id: l1-n3
                type: multiple_choice
                text: "Which cell holds the heading for the answers?"
                show: { drawn: table, sheet: true, rows: [["Sport", "Children"], ["Football", 11]] }
                options: ["A1", "B1", "A2"]
                answer: "A1"
              - id: l1-n4
                type: true_false
                text: "You should type tally marks into the spreadsheet. Is that true?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "The tally chart says Mon 12, Tue 15, Wed 9. Which cell has a typing mistake?"
                show: { drawn: table, sheet: true, rows: [["Day", "Books"], ["Mon", 12], ["Tue", 51], ["Wed", 9]] }
                options: ["B3", "B4", "A3"]
                answer: "B3"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which cell is marked?"
            show: { drawn: table, sheet: true, header: false, rows: [["", "", ""], ["", "", ""], ["", "", ""]], mark: [[2, 2]] }
            options: ["C3", "3C", "B2"]
            answer: "C3"
          - id: l1-c2
            type: multiple_choice
            text: "What is in cell B4?"
            show: { drawn: table, sheet: true, rows: [["Colour", "Votes"], ["Red", 7], ["Blue", 9], ["Green", 3]] }
            options: ["3", "Green", "9"]
            answer: "3"
          - id: l1-c3
            type: true_false
            text: "Each cell should hold just one thing: a word or a number. Is that true?"
            answer: true

  - n: 2
    title: { de: "Ein Diagramm einfügen", en: "Making a chart" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which cell is marked?"
            show: { drawn: table, sheet: true, header: false, rows: [["", "", ""], ["", "", ""], ["", "", ""], ["", "", ""]], mark: [[3, 0]] }
            options: ["A4", "4A", "D1"]
            answer: "A4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is in cell B2?"
            show: { drawn: table, sheet: true, rows: [["Game", "Votes"], ["Tag", 14], ["Hopscotch", 6]] }
            options: ["14", "Tag", "6"]
            answer: "14"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Select the data: A1 to B4"
            say: "To make a chart, first select the cells with the data. Drag from A1 to B4, so the headings, the answers and the numbers are all selected."
            show: { drawn: table, sheet: true, rows: [["Fruit", "Children"], ["Apple", 9], ["Banana", 6], ["Grapes", 4]], mark: [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1], [3, 0], [3, 1]] }
          - text: "Insert a bar chart and give it a title: Favourite fruit"
            say: "Then choose insert chart and pick a bar chart. The program draws a bar for each row. Give the chart a title, so everyone knows what it shows."
            show: { drawn: bar-chart, step: 2, rows: [["Apple", 9], ["Banana", 6], ["Grapes", 4]] }
          - text: "Change B4 from 4 to 7: the grapes bar grows."
            say: "If you change a number in the table, the chart changes by itself. Change B4 from four to seven, and the grapes bar grows to seven."
          - text: "A typing mistake is drawn too.\nTue: 51 instead of 15"
            say: "The program draws whatever you type. Here someone typed fifty-one instead of fifteen for Tuesday. The Tuesday bar is far too tall. The program does not know it is wrong, so you must check."
            show: { drawn: bar-chart, step: 10, rows: [["Mon", 12], ["Tue", 51], ["Wed", 9]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "You want a bar chart of this table. Which cells do you select?"
                show: { drawn: table, sheet: true, rows: [["Fruit", "Children"], ["Apple", 9], ["Banana", 6], ["Grapes", 4]] }
                options: ["A1 to B4", "A1 to A4", "B1 to B4"]
                answer: "A1 to B4"
                feedback:
                  "A1 to A4": "Then the numbers in column B are missing, so the bars have no height."
                  "B1 to B4": "Then the fruit names in column A are missing, so the bars have no labels."
                hints:
                  - "The chart needs the answers and the numbers."
                  - "They are in columns A and B, rows 1 to 4."
                  - "A1 to B4."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Lily selected A1 to B3. Which bar is missing from her chart?"
                show: { drawn: table, sheet: true, rows: [["Pet", "Votes"], ["Dog", 8], ["Cat", 5], ["Fish", 2]] }
                options: ["Fish", "Dog", "Cat"]
                answer: "Fish"
                feedback:
                  "Cat": "Cat is in row 3, and Lily selected down to row 3."
                hints:
                  - "Which rows did Lily select?"
                  - "Rows 1 to 3. Row 4 is left out."
                  - "Fish is in row 4, so its bar is missing."
              - id: l2-f3
                type: image_multiple_choice
                text: "Pet votes: Dog 8, Cat 5, Fish 2. Which chart matches the table?"
                options:
                  - { drawn: bar-chart, step: 2, rows: [["Dog", 8], ["Cat", 5], ["Fish", 2]], key: correct }
                  - { drawn: bar-chart, step: 2, rows: [["Dog", 5], ["Cat", 8], ["Fish", 2]], key: swapped }
                  - { drawn: bar-chart, step: 2, rows: [["Dog", 8], ["Cat", 5]], key: missing }
                answer: correct
                hints:
                  - "Check every bar against the table."
                  - "Dog must be the tallest bar, and there must be a bar for Fish."
                  - "Pick the chart with Dog 8, Cat 5 and Fish 2."
              - id: l2-f4
                type: multiple_choice
                text: "In the pet table, Mo changes B3 from 5 to 9. What happens to the chart?"
                show: { drawn: table, sheet: true, rows: [["Pet", "Votes"], ["Dog", 8], ["Cat", 5], ["Fish", 2]] }
                options: ["The cat bar gets taller.", "Nothing changes.", "The dog bar gets taller."]
                answer: "The cat bar gets taller."
                hints:
                  - "Which pet is in row 3?"
                  - "Row 3 is Cat."
                  - "The cat bar grows from 5 to 9."
              - id: l2-f5
                type: multiple_choice
                text: "Books read. The tally chart says Mon 12, Tue 15, Wed 9. Which bar shows a typing mistake?"
                show: { drawn: bar-chart, step: 10, rows: [["Mon", 12], ["Tue", 51], ["Wed", 9]] }
                options: ["Tue", "Mon", "Wed"]
                answer: "Tue"
                feedback:
                  "Mon": "Monday is 12, the same as the tally chart. Look for a bar that is far too tall."
                hints:
                  - "Compare each bar with the tally chart."
                  - "One bar is far taller than its tally."
                  - "Tue shows 51 instead of 15."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "You want a bar chart of this table. Which cells do you select?"
                show: { drawn: table, sheet: true, rows: [["Sport", "Children"], ["Football", 11], ["Netball", 7], ["Swimming", 5]] }
                options: ["A1 to B4", "B1 to B4", "A1 to A4"]
                answer: "A1 to B4"
                hints: ["You need columns A and B, all the rows."]
              - id: l2-s2
                type: multiple_choice
                text: "Sam selected A1 to B2 of the sports table. How many bars will his chart have?"
                show: { drawn: table, sheet: true, rows: [["Sport", "Children"], ["Football", 11], ["Netball", 7], ["Swimming", 5]] }
                options: ["1", "3", "2"]
                answer: "1"
                hints: ["Row 1 is the headings. Which rows hold data?"]
              - id: l2-s3
                type: true_false
                text: "The program always notices typing mistakes in the table. Is that true?"
                answer: false
                hints: ["What happened to the 51 for Tuesday?"]
              - id: l2-s4
                type: multiple_choice
                text: "What should a chart have, so people know what it shows?"
                options: ["a title", "lots of colours", "no numbers"]
                answer: "a title"
                hints: ["It tells you what the chart is about."]
              - id: l2-s5
                type: multiple_choice
                text: "Ice creams sold. The tally chart says Mon 6, Tue 8, Wed 7. Which bar shows a typing mistake?"
                show: { drawn: bar-chart, step: 10, rows: [["Mon", 6], ["Tue", 80], ["Wed", 7]] }
                options: ["Tue", "Mon", "Wed"]
                answer: "Tue"
                hints: ["Look for a bar far taller than its tally."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "You want a bar chart of this table. Which cells do you select?"
                show: { drawn: table, sheet: true, rows: [["Month", "Rainy days"], ["Oct", 12], ["Nov", 15], ["Dec", 14], ["Jan", 11]] }
                options: ["A1 to B5", "A1 to B4", "B1 to B5"]
                answer: "A1 to B5"
              - id: l2-n2
                type: multiple_choice
                text: "Ava selected A1 to B3. Which bar is missing from her chart?"
                show: { drawn: table, sheet: true, rows: [["Colour", "Votes"], ["Red", 7], ["Blue", 9], ["Green", 3]] }
                options: ["Green", "Blue", "Red"]
                answer: "Green"
              - id: l2-n3
                type: image_multiple_choice
                text: "Snack votes: Crisps 6, Fruit 9, Toast 4. Which chart matches the table?"
                options:
                  - { drawn: bar-chart, step: 2, rows: [["Crisps", 6], ["Fruit", 9], ["Toast", 4]], key: correct }
                  - { drawn: bar-chart, step: 2, rows: [["Crisps", 9], ["Fruit", 6], ["Toast", 4]], key: swapped }
                  - { drawn: bar-chart, step: 2, rows: [["Crisps", 6], ["Fruit", 9]], key: missing }
                answer: correct
              - id: l2-n4
                type: true_false
                text: "If you change a number in the table, the chart changes too. Is that true?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Before you share a chart, what should you check?"
                options: ["that the numbers in the table are right", "that the bars are blue", "that the chart is big"]
                answer: "that the numbers in the table are right"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which cell is marked?"
            show: { drawn: table, sheet: true, header: false, rows: [["", "", ""], ["", "", ""], ["", "", ""]], mark: [[1, 0]] }
            options: ["A2", "2A", "B1"]
            answer: "A2"
          - id: l2-c2
            type: multiple_choice
            text: "What number is in cell B4?"
            show: { drawn: table, sheet: true, rows: [["Pet", "Votes"], ["Dog", 8], ["Cat", 5], ["Fish", 2]] }
            options: ["2", "Fish", "5"]
            answer: "2"
          - id: l2-c3
            type: multiple_choice
            text: "Kim wants a bar chart of the drinks. Which cells should she select?"
            show: { drawn: table, sheet: true, rows: [["Drink", "Children"], ["Milk", 10], ["Water", 12], ["Juice", 8]] }
            options: ["A1 to B4", "A1 to A4", "A2 to A4"]
            answer: "A1 to B4"
          - id: l2-c4
            type: multiple_choice
            text: "Raffle tickets. The tally chart says 5A 14, 5B 17, 5C 13. Which bar shows a typing mistake?"
            show: { drawn: bar-chart, step: 10, rows: [["5A", 14], ["5B", 71], ["5C", 13]] }
            options: ["5B", "5A", "5C"]
            answer: "5B"
          - id: l2-c5
            type: multiple_choice
            text: "Tom selected A1 to B3 of the drinks table. Which bar is missing from his chart?"
            show: { drawn: table, sheet: true, rows: [["Drink", "Children"], ["Milk", 10], ["Water", 12], ["Juice", 8]] }
            options: ["Juice", "Water", "Milk"]
            answer: "Juice"
