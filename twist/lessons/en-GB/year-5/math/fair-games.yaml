# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.fair-games
skill: math.chance.fair-games
curriculum: en-GB
language: en
title:
  de: Faire Spiele
  en: Fair games
summary: >
  Lesson 1 calls a game fair when every player has the same number of
  ways to win, counted on one dice or one spinner (Zoe 1, 2, 3 and Ravi
  4, 5, 6: 3 ways each, fair; one colour each on a spinner with three red
  sectors and one blue: not fair), and changes a rule to make a game
  fair. Lesson 2 counts the ways with two coins (HH, HT, TH, TT: one of
  each happens two ways) and two dice (a total of 7 six ways, 12 one way,
  3 + 4 and 4 + 3 counted apart), decides whether games with them are
  fair, and ends with the skill check. Playing the games in the app waits
  for an experiment task.
metadata:
  year: year-5
  topic: { de: Wahrscheinlichkeit, en: Chance }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.chance.compare-chances, math.chance.combinations]
  also_practises: [math.chance.compare-chances, math.chance.combinations]
  vocabulary: { en: [fair, unfair, chance, equally likely, more likely, way, outcome, total, heads, tails, even, odd] }
  forms: [text, audio, drawn]
  drawn: [spinner, dots]
  facets: []
  parts:
    - { id: one-dice, what: { de: "bei einem Würfel oder Glücksrad die Möglichkeiten zählen und sagen, ob ein Spiel fair ist", en: counting the ways on one dice or spinner to tell whether a game is fair } }
    - { id: two-coins, what: { de: die Möglichkeiten mit zwei Münzen zählen, en: counting the ways with two coins } }
    - { id: two-dice, what: { de: die Möglichkeiten für eine Augensumme mit zwei Würfeln zählen, en: counting the ways to make a total with two dice } }
    - { id: explain-fix, what: { de: begründen und ein Spiel fair machen, en: explaining why a game is fair or not and making it fair } }
  misconceptions:
    - id: one-each-is-fair
      what: Calls a game fair because each player has one colour or one rule, without counting how many ways each has
      addressed: lesson 1 Learn shows a spinner with one colour each that is not fair; l1-f3, l1-s3 (with feedback), l1-n2, l1-n5 and l2-c1 give each player one colour on an uneven spinner, l2-f5 and l2-c4 one result each with different numbers of ways
    - id: mixed-counts-once
      what: Counts mixed results once (two coins give three results; a total of 7 only as 3 + 4, 2 + 5, 1 + 6)
      addressed: lesson 2 Learn lists HT and TH and both orders on two dice; l2-f1 and l2-f3 (with feedback), l2-s1, l2-s3, l2-n1, l2-n5 and l2-c3 count the ways with both orders
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gewinnmöglichkeiten zählen", en: "Counting the ways to win" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which colour is the pointer more likely to land on?"
            show: { drawn: spinner, sectors: [red, red, red, blue] }
            options: ["red", "blue", "both equally likely"]
            answer: "red"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "You roll a dice. How many different numbers can you roll?"
            options: ["6", "5", "12"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A game is fair when every player has the same chance of winning."
            say: "Is a game fair? To find out, count the ways each player can win. If every player has the same number of ways, and each way is equally likely, the game is fair."
          - text: "Zoe wins on 1, 2 or 3. Ravi wins on 4, 5 or 6.\n3 ways each: fair."
            say: "Zoe and Ravi roll a dice. Zoe wins on one, two or three. Ravi wins on four, five or six. Each has three ways to win, so the game is fair."
            show: { drawn: dots, count: 3, layout: dice }
          - text: "Zoe wins on red, Ravi wins on blue.\n3 red, 1 blue: not fair."
            say: "Now they use this spinner. Zoe wins on red and Ravi wins on blue. They have one colour each, but that does not make it fair. Three sectors are red and only one is blue. Zoe has three ways to win and Ravi has one."
            show: { drawn: spinner, sectors: [red, red, red, blue] }
          - text: "Make it fair: colour one red sector blue.\n2 ways each."
            say: "You can change a rule to make a game fair. Colour one of the red sectors blue. Now there are two red and two blue, so each player has two ways to win."
            show: { drawn: spinner, sectors: [red, red, blue, blue] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Kai and Jess roll a dice. Kai wins on 1, 2 or 3. Jess wins on 4, 5 or 6. Is the game fair?"
                answer: true
                hints:
                  - "Count the ways each player can win."
                  - "Kai has 3 ways. Jess has 3 ways."
                  - "Yes, the game is fair."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ali wins on a 6. Beth wins on 1, 2, 3, 4 or 5. Who is more likely to win?"
                options: ["Beth", "Ali", "both equally likely"]
                answer: "Beth"
                keep_order: true
                hints:
                  - "Count the ways for each player."
                  - "Ali has 1 way. Beth has 5 ways."
                  - "Beth is more likely to win."
              - id: l1-f3
                type: true_false
                text: "Zoe wins on red and Ravi wins on blue. Each has one colour. Is the game fair?"
                show: { drawn: spinner, sectors: [red, red, red, blue] }
                answer: false
                hints:
                  - "Count the sectors of each colour."
                  - "3 sectors are red and 1 is blue."
                  - "No. Zoe has 3 ways and Ravi only 1."
              - id: l1-f4
                type: multiple_choice
                text: "Kai wins on an even number. Jess wins on an odd number. Is the game fair?"
                options: ["Yes, 3 ways each.", "No, Kai has more ways.", "No, Jess has more ways."]
                answer: "Yes, 3 ways each."
                hints:
                  - "Write out the even numbers and the odd numbers on a dice."
                  - "Even: 2, 4, 6. Odd: 1, 3, 5."
                  - "3 ways each, so it is fair."
              - id: l1-f5
                type: multiple_choice
                text: "Green wins for Tom and yellow wins for Ella. Which change makes the game fair?"
                show: { drawn: spinner, sectors: [green, green, yellow, yellow, yellow, yellow] }
                options: ["Colour one yellow sector green.", "Colour one green sector yellow.", "Add another yellow sector."]
                answer: "Colour one yellow sector green."
                feedback:
                  "Colour one green sector yellow.": "Then Ella has 5 ways and Tom only 1. That is even less fair."
                hints:
                  - "Count the sectors now: 2 green, 4 yellow."
                  - "Each player needs the same number, 3 and 3."
                  - "Colour one yellow sector green."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Sam wins on 1 or 2. Priya wins on 3, 4, 5 or 6. How many ways does each player have?"
                options: ["Sam 2, Priya 4", "Sam 2, Priya 2", "Sam 1, Priya 4"]
                answer: "Sam 2, Priya 4"
                hints: ["List the numbers for each player."]
              - id: l1-s2
                type: true_false
                text: "Red wins for Ali and blue wins for Ben. Is the game fair?"
                show: { drawn: spinner, sectors: [red, blue, red, blue] }
                answer: true
                hints: ["Count the red sectors and the blue sectors."]
              - id: l1-s3
                type: multiple_choice
                text: "Blue wins for Max and yellow wins for Lea. Is the game fair?"
                show: { drawn: spinner, sectors: [blue, blue, yellow] }
                options: ["No, Max has 2 ways and Lea 1.", "Yes, one colour each.", "No, Lea has more ways."]
                answer: "No, Max has 2 ways and Lea 1."
                feedback:
                  "Yes, one colour each.": "One colour each is not enough. Count the sectors of each colour."
                hints: ["Count the sectors of each colour."]
              - id: l1-s4
                type: multiple_choice
                text: "Mia wins on a number less than 3. Jo wins on a number greater than 3. Who is more likely to win?"
                options: ["Jo", "Mia", "both equally likely"]
                answer: "Jo"
                keep_order: true
                hints: ["Less than 3: 1, 2. Greater than 3: 4, 5, 6."]
              - id: l1-s5
                type: multiple_choice
                text: "Ella wins on 1, 2 or 3. Tom wins on 5 or 6. Which new rule makes the game fair?"
                options: ["Tom also wins on 4.", "Ella also wins on 4.", "Nobody wins on 6."]
                answer: "Tom also wins on 4."
                hints: ["Tom needs 3 ways, like Ella."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Asha wins on 5 or 6. Leo wins on 1, 2, 3 or 4. Is the game fair?"
                answer: false
              - id: l1-n2
                type: multiple_choice
                text: "Red wins for Ben, green for Kim and blue for Sara. Who is most likely to win?"
                show: { drawn: spinner, sectors: [red, red, green, green, green, blue] }
                options: ["Kim", "Ben", "Sara"]
                answer: "Kim"
              - id: l1-n3
                type: multiple_choice
                text: "Josh wins on a number greater than 4. Ana wins on a number less than 3. Is the game fair?"
                options: ["Yes, 2 ways each.", "No, Josh has more ways.", "No, nobody can win."]
                answer: "Yes, 2 ways each."
              - id: l1-n4
                type: text_input
                text: "Yellow wins for Ali and purple wins for Zac. How many purple sectors must be added to make the game fair?"
                show: { drawn: spinner, sectors: [yellow, yellow, yellow, yellow, purple, purple] }
                answer: "2"
              - id: l1-n5
                type: true_false
                text: "A game where each player has one colour on the spinner is always fair. Is that true?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Lily wins on 1 or 2. Noah wins on 5 or 6. On 3 or 4 nobody wins and they roll again. Is the game fair?"
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "Blue wins for Sam and red wins for Isla. Is the game fair?"
            show: { drawn: spinner, sectors: [blue, blue, blue, red, red, red] }
            options: ["Yes, 3 ways each.", "No, Sam has more ways.", "No, Isla has more ways."]
            answer: "Yes, 3 ways each."
          - id: l1-c3
            type: multiple_choice
            text: "Ravi wins on a 6. Zoe wins on a 1. Is the game fair?"
            options: ["Yes, 1 way each.", "No, 6 is a bigger number.", "No, Zoe has more ways."]
            answer: "Yes, 1 way each."
          - id: l1-c4
            type: true_false
            text: "Ivy wins on an odd number. Rob wins on a 2 or a 4. On a 6 they roll again. Is the game fair?"
            answer: false
          - id: l1-c5
            type: text_input
            text: "Blue wins for Leo and green wins for Ada. How many blue sectors must be coloured green to make the game fair?"
            show: { drawn: spinner, sectors: [blue, green, blue, blue, blue, green] }
            answer: "1"
          - id: l1-c6
            type: multiple_choice
            text: "Three children roll a dice. Ali wins on 1 or 2, Bo on 3 or 4 and Cara on 5 or 6. Is the game fair?"
            options: ["Yes, 2 ways each.", "No, Cara has the biggest numbers.", "No, Ali has more ways."]
            answer: "Yes, 2 ways each."

  - n: 2
    title: { de: "Zwei Münzen und zwei Würfel", en: "Two coins and two dice" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Mo wins on 1, 2, 3 or 4. Kai wins on 5 or 6. Is the game fair?"
            answer: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Green wins for Ali and red wins for Jo. Is the game fair?"
            show: { drawn: spinner, sectors: [green, green, red, red] }
            options: ["Yes, 2 ways each.", "No, Ali has more ways.", "No, Jo has more ways."]
            answer: "Yes, 2 ways each."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Two coins: HH, HT, TH, TT\n4 ways"
            say: "Toss two coins, a first coin and a second coin. They can land heads heads, heads tails, tails heads or tails tails. Heads tails and tails heads are different ways: in one the first coin is heads, in the other the second coin is. So there are four ways."
          - text: "Tom wins if the coins match: HH, TT.\nElla wins if they are different: HT, TH.\n2 ways each: fair."
            say: "Tom wins if the two coins match. That happens two ways. Ella wins if they are different. That also happens two ways. So the game is fair."
          - text: "Two dice, a total of 7:\n1 + 6, 2 + 5, 3 + 4, 4 + 3, 5 + 2, 6 + 1\n6 ways"
            say: "Now roll two dice, a red one and a blue one, and add them. A total of seven can be made in six ways. Three on red and four on blue is a different way from four on red and three on blue, so count both."
            show: { drawn: dots, groups: [3, 4], layout: dice }
          - text: "A total of 12: only 6 + 6. 1 way.\nWinning on 7 against winning on 12 is not fair."
            say: "A total of twelve can only be made one way, six and six. So a game where one player wins on seven and the other wins on twelve is not fair at all, even though each player has one total."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "You toss two coins. How many different ways can they land?"
                options: ["4", "3", "2"]
                answer: "4"
                feedback:
                  "3": "Heads tails and tails heads are two different ways. Count them both."
                hints:
                  - "Think of a first coin and a second coin."
                  - "HH, HT, TH, TT."
                  - "4 ways."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Two coins. Tom wins if they land the same. Ella wins if they are different. Is the game fair?"
                answer: true
                hints:
                  - "List the 4 ways the coins can land."
                  - "The same: HH, TT. Different: HT, TH."
                  - "Yes. 2 ways each."
              - id: l2-f3
                type: multiple_choice
                text: "You roll two dice and add them. How many ways can you make a total of 7?"
                options: ["6", "3", "1"]
                answer: "6"
                feedback:
                  "3": "3 + 4 and 4 + 3 are different ways: the red and the blue dice swap. Count both orders."
                hints:
                  - "Start with 1 on the first dice: 1 + 6."
                  - "1 + 6, 2 + 5, 3 + 4, 4 + 3, 5 + 2, 6 + 1."
                  - "6 ways."
              - id: l2-f4
                type: multiple_choice
                text: "You roll two dice and add them. How many ways can you make a total of 12?"
                options: ["1", "2", "6"]
                answer: "1"
                hints:
                  - "What is the biggest number on a dice?"
                  - "Both dice must show 6."
                  - "1 way."
              - id: l2-f5
                type: multiple_choice
                text: "Jade wins on a total of 7. Will wins on a total of 2. Is the game fair?"
                options: ["No, 7 can happen 6 ways and 2 only 1 way.", "Yes, they have one total each.", "No, Will is more likely to win."]
                answer: "No, 7 can happen 6 ways and 2 only 1 way."
                hints:
                  - "Count the ways for each total."
                  - "A total of 2 needs 1 + 1."
                  - "7 has 6 ways and 2 has 1, so it is not fair."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "You toss two coins. How many ways can you get one head and one tail?"
                options: ["2", "1", "4"]
                answer: "2"
                hints: ["HT and TH."]
              - id: l2-s2
                type: true_false
                text: "Two coins. Ana wins if both land heads. Ben wins if both land tails. If they are different, toss again. Is the game fair?"
                answer: true
                hints: ["HH is one way, TT is one way."]
              - id: l2-s3
                type: multiple_choice
                text: "You roll two dice and add them. How many ways can you make a total of 6?"
                options: ["5", "3", "6"]
                answer: "5"
                hints: ["1 + 5, 2 + 4, 3 + 3, and the other orders."]
              - id: l2-s4
                type: multiple_choice
                text: "Two coins. Ali wins if both land heads. Sara wins in every other case. Who is more likely to win?"
                options: ["Sara", "Ali", "both equally likely"]
                answer: "Sara"
                keep_order: true
                hints: ["Ali has HH. Sara has HT, TH and TT."]
              - id: l2-s5
                type: multiple_choice
                text: "Which total is the hardest to roll with two dice?"
                options: ["2", "7", "6"]
                answer: "2"
                hints: ["Which total can be made only one way?"]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "You roll two dice and add them. How many ways can you make a total of 4?"
                answer: "3"
              - id: l2-n2
                type: true_false
                text: "Max wins on a total of 7. Lea wins on a total of 8. Is the game fair?"
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Two coins. Kim wins if there is at least one head. Jo wins on two tails. Is the game fair?"
                options: ["No, Kim has 3 ways and Jo 1.", "Yes, it is fair.", "No, Jo has more ways."]
                answer: "No, Kim has 3 ways and Jo 1."
              - id: l2-n4
                type: multiple_choice
                text: "With two dice, which is more likely: a total of 3 or a total of 11?"
                options: ["They are equally likely.", "a total of 3", "a total of 11"]
                answer: "They are equally likely."
                keep_order: true
              - id: l2-n5
                type: true_false
                text: "With two dice, 3 on the first and 4 on the second is a different way from 4 on the first and 3 on the second. Is that true?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: one-dice
            type: true_false
            text: "Red wins for Ella and yellow wins for Tom. Is the game fair?"
            show: { drawn: spinner, sectors: [red, red, red, yellow, yellow] }
            answer: false
          - id: l2-c2
            part: one-dice
            type: multiple_choice
            text: "Zac wins on 1 or 6. Amy wins on 2, 3, 4 or 5. Who is more likely to win?"
            options: ["Amy", "Zac", "both equally likely"]
            answer: "Amy"
            keep_order: true
          - id: l2-c3
            part: two-dice
            type: multiple_choice
            text: "You roll two dice and add them. How many ways can you make a total of 8?"
            options: ["5", "3", "6"]
            answer: "5"
          - id: l2-c4
            part: two-coins
            type: multiple_choice
            text: "Two coins. Mia wins on two heads. Leo wins on one head and one tail. Is the game fair?"
            options: ["No, Leo has 2 ways and Mia 1.", "Yes, one result each.", "No, Mia has more ways."]
            answer: "No, Leo has 2 ways and Mia 1."
          - id: l2-c5
            part: explain-fix
            type: multiple_choice
            text: "Green wins for Ravi and blue wins for Zoe. Which change makes the game fair?"
            show: { drawn: spinner, sectors: [green, green, green, green, blue, blue] }
            options: ["Colour one green sector blue.", "Colour one blue sector green.", "Add two more green sectors."]
            answer: "Colour one green sector blue."
          - id: l2-c6
            part: one-dice
            type: true_false
            text: "Ana and Joe roll a dice. Ana wins on a number less than 4. Joe wins on a number greater than 4. On a 4 they roll again. Is the game fair?"
            answer: false
          - id: l2-c7
            part: one-dice
            type: image_multiple_choice
            text: "Red wins for Kai and blue wins for Nia. Which spinner makes the game fair?"
            options:
              - { drawn: spinner, sectors: [red, blue, red, red], key: "3-to-1" }
              - { drawn: spinner, sectors: [blue, red, blue, red, blue, red], key: "3-to-3" }
              - { drawn: spinner, sectors: [red, blue, blue], key: "1-to-2" }
            answer: "3-to-3"
          - id: l2-c8
            part: one-dice
            type: text_input
            text: "Pip wins on red and Tess wins on green. How many ways does Pip have to win?"
            show: { drawn: spinner, sectors: [red, green, red, red, green, red, green, red] }
            answer: "5"
          - id: l2-c9
            part: two-coins
            type: text_input
            text: "You toss two coins. In how many of the ways does the first coin land heads?"
            answer: "2"
          - id: l2-c10
            part: two-coins
            type: true_false
            text: "Lily tosses two coins. She says they can land only 3 ways: two heads, two tails, or one of each. Is she right?"
            answer: false
          - id: l2-c11
            part: two-coins
            type: multiple_choice
            text: "Two coins. Omar wins on HT: the first coin heads and the second tails. Freya wins on TT. If neither happens, they toss again. Is the game fair?"
            options: ["Yes, 1 way each.", "No, Omar has more ways.", "No, Freya has more ways."]
            answer: "Yes, 1 way each."
          - id: l2-c12
            part: two-coins
            type: multiple_choice
            text: "You toss two coins. Which result is most likely?"
            options: ["one head and one tail", "two heads", "two tails"]
            answer: "one head and one tail"
          - id: l2-c13
            part: two-dice
            type: text_input
            text: "You roll two dice and add them. How many ways can you make a total of 10?"
            answer: "3"
          - id: l2-c14
            part: two-dice
            type: multiple_choice
            text: "You roll two dice and add them. How many ways can you make a total of 5?"
            options: ["4", "2", "5"]
            answer: "4"
          - id: l2-c15
            part: two-dice
            type: true_false
            text: "With two dice, a total of 9 can be made in as many ways as a total of 5. Is that true?"
            answer: true
          - id: l2-c16
            part: two-dice
            type: multiple_choice
            text: "You roll two dice and add them. Which total can be made in the most ways?"
            options: ["6", "7", "8"]
            answer: "7"
            keep_order: true
          - id: l2-c17
            part: explain-fix
            type: multiple_choice
            text: "Finn wins on 1, 2, 3 or 4. Isla wins on 5 or 6. Which change makes the game fair?"
            options: ["Isla wins on 4 instead of Finn.", "Finn wins on 5 instead of Isla.", "Nobody wins on 1."]
            answer: "Isla wins on 4 instead of Finn."
          - id: l2-c18
            part: explain-fix
            type: multiple_choice
            text: "Noor wins on yellow and Sam wins on purple. Why is the game not fair?"
            show: { drawn: spinner, sectors: [yellow, purple, yellow, purple, yellow] }
            options: ["Yellow has 3 sectors and purple only 2.", "Each player has only one colour.", "Purple has 3 sectors and yellow only 2."]
            answer: "Yellow has 3 sectors and purple only 2."
          - id: l2-c19
            part: explain-fix
            type: true_false
            text: "Two dice. Jo wins on a total of 6 and Kit on a total of 8. Jo says the game is fair because each total can be made in 5 ways. Is Jo right?"
            answer: true
          - id: l2-c20
            part: explain-fix
            type: multiple_choice
            text: "Two dice. Ella wins on a total of 2 or 3. If nobody wins, they roll again. Which rule for Max makes the game fair?"
            options: ["Max wins on a total of 4.", "Max wins on a total of 12.", "Max wins on a total of 7."]
            answer: "Max wins on a total of 4."
