# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.estimate-or-exact
skill: math.word-problems.estimate-or-exact
curriculum: en-GB
language: en
title:
  de: Überschlag oder genau?
  en: Estimate or exact?
summary: >
  Lesson 1 decides from the situation whether an estimate is enough (Is
  £20 enough? Will everyone fit on the coach? About how many people
  came?) or an exact answer is needed (the change, a receipt, a dose of
  medicine); lesson 2 makes an estimate safe by rounding up when
  something must be enough, works out the exact answer when the estimate
  lands close to the limit, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.word-problems.multi-step, math.add-sub-to-1000.estimate]
  also_practises: [math.money.calculate]
  vocabulary: { en: [estimate, exact, about, round up, round down, enough, close to the limit] }
  forms: [text, audio]
  drawn: []
  facets: [currency]
  parts:
    - { id: decide, what: { de: "entscheiden, ob ein Überschlag reicht oder ob man genau rechnen muss", en: deciding whether an estimate is enough or an exact answer is needed } }
    - { id: safe-estimate, what: { de: "mit aufgerundeten Zahlen sicher prüfen, ob etwas reicht", en: rounding up to check safely that something is enough } }
    - { id: close, what: { de: bei einem knappen Überschlag genau nachrechnen, en: calculating exactly when the estimate is close to the limit } }
    - { id: exact, what: { de: "das genaue Ergebnis berechnen, wenn es nötig ist", en: working out the exact answer when it is needed } }
  misconceptions:
    - id: always-exact
      what: Thinks every word problem needs an exact answer, even when the question only asks whether something is enough
      addressed: lesson 1 Learn sets a question an estimate answers beside one that needs the exact answer; l1-f1, l1-s1 and l1-n1 have an is-it-enough question, with feedback in l1-f1; l1-f3, l1-s3 and l1-n3 are sorting tasks
    - id: close-estimate-trusted
      what: Trusts an estimate that lands next to the limit, or rounds prices down when the money must be enough
      addressed: lesson 2 Learn rounds up and works out exactly when the estimate is close; l2-f1, l2-f3, l2-s3, l2-n2 and l2-c3 offer the rounded-down or close answer, with feedback in l2-f1 and l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Reicht ein Überschlag?", en: "Is an estimate enough?" }
    goal:
      de: "Entscheide, ob ein Überschlag reicht oder du genau rechnen musst, so wie beim Wechselgeld im Laden."
      en: "Decide if an estimate is enough or you need the exact answer, like when a shop gives you change."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "About how much is 398 + 207?"
            options: ["about 600", "about 500", "about 700"]
            answer: "about 600"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Jade buys a book for £6 and a game for £9. She pays with a £20 note. How much change does she get, in pounds?"
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Paint £4.95, brushes £2.10, tape £1.85. Is £10 enough?"
            say: "Is ten pounds enough? Round each price up: five pounds, three pounds and two pounds make ten pounds. Even rounded up, it is not more than ten pounds, so ten pounds is enough. An estimate answers the question."
          - text: "How much change from £10?"
            say: "Now the question is how much change. The shop must give back the exact amount, so you need the exact total: eight pounds ninety. The change is one pound ten."
          - text: "Estimate is enough: Is it enough? About how many? Roughly how far?\nExact answer needed: change, a receipt, medicine, a recipe for a cake"
            say: "Ask what the answer is for. To decide whether something is enough, or to say about how many, an estimate is fine. When money changes hands, or the amount must be just right, like medicine, you need the exact answer."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ollie has £20. A ball costs £8.99 and a pump costs £4.50. Is his money enough? Do you need an estimate or the exact answer?"
                options: ["an estimate is enough", "the exact answer"]
                answer: "an estimate is enough"
                keep_order: true
                feedback:
                  "the exact answer": "The question is only whether £20 is enough. Rounded up, £9 + £5 = £14, which is well under £20."
                hints:
                  - "What does the question ask?"
                  - "It asks whether the money is enough, not how much is left."
                  - "An estimate is enough: about £14 is less than £20."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A nurse works out a dose of medicine for a child: 2.5 ml for every 5 kg the child weighs. Estimate or exact?"
                options: ["the exact answer", "an estimate is enough"]
                answer: "the exact answer"
                keep_order: true
                hints:
                  - "What happens if the amount is a bit too much?"
                  - "Medicine must be just right."
                  - "The exact answer."
              - id: l1-f3
                type: sorting
                text: "Sort the questions."
                option_audio: false
                bins:
                  - { id: estimate, show: { text: "an estimate is enough" }, say: "An estimate is enough." }
                  - { id: exact, show: { text: "the exact answer" }, say: "The exact answer." }
                options:
                  - { text: "About how many people were at the match?", bin: estimate }
                  - { text: "How much change do I get?", bin: exact }
                  - { text: "Will 60 chairs be enough for 47 guests?", bin: estimate }
                  - { text: "What total goes on the receipt?", bin: exact }
                hints:
                  - "Ask what the answer is for."
                  - "About how many and is it enough can be estimated."
                  - "Change and the receipt need the exact amount."
              - id: l1-f4
                type: true_false
                text: "A coach has 53 seats. 28 children and 19 adults are going. An estimate is enough to know that everyone fits."
                answer: true
                hints:
                  - "Round up: 30 + 20."
                  - "Even rounded up it is 50, which is less than 53."
                  - "Yes, an estimate shows everyone fits."
              - id: l1-f5
                type: multiple_choice
                text: "Which question needs the exact answer?"
                options: ["How much do I pay for 3 tickets at £7.45?", "Is £30 enough for 3 tickets at £7.45?", "About how much do 3 tickets at £7.45 cost?"]
                answer: "How much do I pay for 3 tickets at £7.45?"
                hints:
                  - "Which question asks for an amount of money that changes hands?"
                  - "When you pay, the amount must be exact."
                  - "How much do I pay for 3 tickets?"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Freya has £15. She wants a T-shirt for £5.99 and a cap for £3.49. Is her money enough? Estimate or exact?"
                options: ["an estimate is enough", "the exact answer"]
                answer: "an estimate is enough"
                keep_order: true
                hints: ["Round up: £6 + £4."]
              - id: l1-s2
                type: multiple_choice
                text: "A baker needs 350 g of flour for a cake. She has a bag of 1 kg. How much flour is left after the cake? She will write it on the label. Estimate or exact?"
                options: ["the exact answer", "an estimate is enough"]
                answer: "the exact answer"
                keep_order: true
                hints: ["A label must be right."]
              - id: l1-s3
                type: sorting
                text: "Sort the questions."
                option_audio: false
                bins:
                  - { id: estimate, show: { text: "an estimate is enough" }, say: "An estimate is enough." }
                  - { id: exact, show: { text: "the exact answer" }, say: "The exact answer." }
                options:
                  - { text: "Roughly how far is it to the beach?", bin: estimate }
                  - { text: "How much does the shop owe me?", bin: exact }
                  - { text: "How much do I pay at the till?", bin: exact }
                  - { text: "Will 4 pizzas be enough for 9 children?", bin: estimate }
                hints: ["Is it about how many, or is it enough? Or must it be just right?"]
              - id: l1-s4
                type: true_false
                text: "A lift can carry 600 kg. Four people weighing 78 kg, 85 kg, 91 kg and 69 kg get in. An estimate is enough to know they are safe."
                answer: true
                hints: ["Round up each one to 100 kg."]
              - id: l1-s5
                type: multiple_choice
                text: "Which question needs the exact answer?"
                options: ["What is the total on the shopping receipt?", "Is £50 enough for the shopping?", "About how much did the shopping cost?"]
                answer: "What is the total on the shopping receipt?"
                hints: ["Which one is written down and paid?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Dad has £40. He buys trainers for £24.99 and socks for £3.50. Is his money enough? Estimate or exact?"
                options: ["an estimate is enough", "the exact answer"]
                answer: "an estimate is enough"
                keep_order: true
              - id: l1-n2
                type: multiple_choice
                text: "A chemist measures 5 ml of cough syrup for a child. Estimate or exact?"
                options: ["the exact answer", "an estimate is enough"]
                answer: "the exact answer"
                keep_order: true
              - id: l1-n3
                type: sorting
                text: "Sort the questions."
                option_audio: false
                bins:
                  - { id: estimate, show: { text: "an estimate is enough" }, say: "An estimate is enough." }
                  - { id: exact, show: { text: "the exact answer" }, say: "The exact answer." }
                options:
                  - { text: "About how many sweets are in the jar?", bin: estimate }
                  - { text: "What is my bank balance?", bin: exact }
                  - { text: "Will 3 packs of 10 bags of crisps be enough for 28 children?", bin: estimate }
                  - { text: "How much change from £20?", bin: exact }
              - id: l1-n4
                type: true_false
                text: "A hall holds 300 people. 128 parents and 145 children come to the play. An estimate shows that everyone fits."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which question needs the exact answer?"
                options: ["How much must Jo pay for 4 cinema tickets at £6.80?", "Is £30 enough for 4 cinema tickets at £6.80?", "About how much do 4 cinema tickets at £6.80 cost?"]
                answer: "How much must Jo pay for 4 cinema tickets at £6.80?"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Nina has £10. She wants a pen for £2.49 and a pad for £3.99. Is her money enough? Estimate or exact?"
            options: ["an estimate is enough", "the exact answer"]
            answer: "an estimate is enough"
            keep_order: true
          - id: l1-c2
            type: multiple_choice
            text: "A shop assistant works out the change from £20. Estimate or exact?"
            options: ["the exact answer", "an estimate is enough"]
            answer: "the exact answer"
            keep_order: true
          - id: l1-c3
            type: true_false
            text: "A minibus has 16 seats. 4 girls and 5 boys are going. An estimate shows everyone fits."
            answer: true
          - id: l1-c4
            type: sorting
            text: "Estimate or exact? Sort the questions."
            option_audio: false
            bins:
              - { id: estimate, show: { text: "an estimate is enough" }, say: "An estimate is enough." }
              - { id: exact, show: { text: "the exact answer" }, say: "The exact answer." }
            options:
              - { text: "What total does the till print on the receipt?", bin: exact }
              - { text: "About how many children are in the school?", bin: estimate }
              - { text: "How much do 2 drinks at £1.35 cost at the till?", bin: exact }
              - { text: "Is a 1 litre jug big enough for 4 cups of 200 ml?", bin: estimate }
          - id: l1-c5
            type: true_false
            text: "Kai has £5. He wants to know how much change he gets after buying a comic for £3.75. An estimate is enough."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "A theatre has 400 seats. 186 adults and 97 children have tickets. Will everyone have a seat? Estimate or exact?"
            options: ["an estimate is enough", "the exact answer"]
            answer: "an estimate is enough"
            keep_order: true

  - n: 2
    title: { de: "Sicher schätzen und genau rechnen", en: "Safe estimates and close calls" }
    goal:
      de: "Runde Preise auf, damit dein Überschlag sicher ist, und rechne genau, wenn es knapp wird."
      en: "Round prices up so your estimate is safe, and work it out exactly when it is a close call."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which question needs the exact answer?"
            options: ["How much change do I get from £5?", "Is £5 enough for a drink and a snack?"]
            answer: "How much change do I get from £5?"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "To find out about how many people came to a fair, an estimate is enough."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "£20. Prices: £6.40, £7.30, £5.20\nRounded down: £6 + £7 + £5 = £18\nRounded up: £7 + £8 + £6 = £21"
            say: "Is twenty pounds enough? If you round the prices down, you get eighteen pounds, which looks enough. But that estimate is too small. To be safe when money must be enough, round the prices up. Rounded up it is twenty-one pounds, so you cannot be sure."
          - text: "Exact: £6.40 + £7.30 + £5.20 = £18.90"
            say: "When the safe estimate is close to the limit, work out the exact answer. Eighteen pounds ninety is less than twenty pounds, so the money is enough."
          - text: "Far from the limit: estimate is enough\nClose to the limit: work it out exactly"
            say: "So: first estimate. If the estimate is far from the limit, you have your answer. If it is close, calculate exactly."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Leah has £15. She wants three books at £4.20, £5.40 and £4.30. How should she estimate to be safe?"
                options: ["round up: £5 + £6 + £5", "round down: £4 + £5 + £4", "do not estimate at all"]
                answer: "round up: £5 + £6 + £5"
                feedback:
                  "round down: £4 + £5 + £4": "Rounding down makes the books look cheaper than they are. Then the money might not be enough."
                hints:
                  - "Should the estimate be too big or too small to be safe?"
                  - "If a bigger estimate still fits, the real total fits too."
                  - "Round up."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Rounded up, Leah's books cost £16. Her limit is £15. What should she do next?"
                options: ["work out the exact total", "decide it is not enough", "decide it is enough"]
                answer: "work out the exact total"
                hints:
                  - "Is £16 far from £15, or close?"
                  - "The safe estimate is just over the limit, so you cannot be sure."
                  - "Work out the exact total: £13.90, so it is enough."
              - id: l2-f3
                type: multiple_choice
                text: "A bridge holds 3000 kg. A van weighs 2850 kg and its load 180 kg. Is it safe to cross?"
                options: ["No, 3030 kg is too heavy.", "Yes, it is about 3000 kg.", "Yes, 2800 + 200 = 3000."]
                answer: "No, 3030 kg is too heavy."
                feedback:
                  "Yes, it is about 3000 kg.": "About 3000 is too close to the limit. Work it out exactly: 2850 + 180 = 3030."
                hints:
                  - "Is the estimate close to the limit?"
                  - "Close to the limit means work it out exactly."
                  - "2850 + 180 = 3030, which is more than 3000. Not safe."
              - id: l2-f4
                type: true_false
                text: "A coach has 52 seats. 31 children and 24 adults are going. Rounded down, 30 + 20 = 50, so everyone fits."
                answer: false
                hints:
                  - "Rounding down makes the group look smaller."
                  - "Work it out: 31 + 24."
                  - "No. 55 people need 55 seats."
              - id: l2-f5
                type: text_input
                text: "Sam has £25. He buys a jumper for £14.99 and a hat for £8.50. How much change does he get, in pence?"
                answer: "151"
                hints:
                  - "Change needs the exact answer."
                  - "£14.99 + £8.50 = £23.49."
                  - "£25.00 − £23.49 = £1.51, which is 151p."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Max has £12. He wants a kite for £6.30 and string for £2.40. How should he estimate to be safe?"
                options: ["round up: £7 + £3", "round down: £6 + £2", "do not estimate at all"]
                answer: "round up: £7 + £3"
                hints: ["The money must be enough."]
              - id: l2-s2
                type: multiple_choice
                text: "Rounded up, the shopping costs £30. The limit is £50. What should you do next?"
                options: ["decide it is enough", "work out the exact total", "decide it is not enough"]
                answer: "decide it is enough"
                hints: ["Is £30 close to £50?"]
              - id: l2-s3
                type: multiple_choice
                text: "A lorry can carry 2000 kg. It is loaded with 1460 kg and 570 kg. Is the load safe?"
                options: ["No, 2030 kg is too much.", "Yes, it is about 2000 kg.", "Yes, 1400 + 500 = 1900."]
                answer: "No, 2030 kg is too much."
                hints: ["Close to the limit: work it out exactly."]
              - id: l2-s4
                type: true_false
                text: "A hall has 250 chairs. 118 parents and 139 pupils come. Rounded down, 100 + 100 = 200, so there are enough chairs."
                answer: false
                hints: ["118 + 139."]
              - id: l2-s5
                type: text_input
                text: "Asha pays for a £3.65 sandwich and a £1.20 drink with a £10 note. How much change does she get, in pence?"
                answer: "515"
                hints: ["£3.65 + £1.20 = £4.85."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mum has £40. She needs shoes for £18.20 and a coat for £19.40. How should she estimate to be safe?"
                options: ["round up: £19 + £20", "round down: £18 + £19", "do not estimate at all"]
                answer: "round up: £19 + £20"
              - id: l2-n2
                type: multiple_choice
                text: "A school has £500 for a trip. The coach costs £289 and the tickets £198. Is the money enough?"
                options: ["Yes, exactly £487.", "No, it is about £500.", "No, 300 + 200 = 500 is the limit."]
                answer: "Yes, exactly £487."
              - id: l2-n3
                type: true_false
                text: "A boat holds 12 people. 5 adults and 4 children get in. You need to work it out exactly to know they fit."
                answer: false
              - id: l2-n4
                type: text_input
                text: "A recipe needs 750 g of flour. Raj has a 1 kg bag and uses the flour for the recipe. How many grams are left?"
                answer: "250"
              - id: l2-n5
                type: text_input
                text: "Kim pays for 3 notebooks at £1.85 each with a £10 note. How much change does she get, in pence?"
                answer: "445"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: decide
            type: multiple_choice
            text: "Ivy has £30. She wants a game for £12.99 and a book for £6.49. Is her money enough? Estimate or exact?"
            options: ["an estimate is enough", "the exact answer"]
            answer: "an estimate is enough"
            keep_order: true
          - id: l2-c2
            part: decide
            type: multiple_choice
            text: "Which question needs the exact answer?"
            options: ["How much should the receipt for the school trip say?", "Is £200 enough for the school trip?", "About how much will the school trip cost?"]
            answer: "How much should the receipt for the school trip say?"
          - id: l2-c3
            part: close
            type: multiple_choice
            text: "A trailer holds 1500 kg. It carries 870 kg of sand and 640 kg of stones. Is it safe?"
            options: ["No, 1510 kg is too much.", "Yes, it is about 1500 kg.", "Yes, 800 + 600 = 1400."]
            answer: "No, 1510 kg is too much."
          - id: l2-c4
            part: safe-estimate
            type: multiple_choice
            text: "Ella has £10. She wants paints for £3.70 and a pad for £4.60. How should she estimate to be safe?"
            options: ["round up: £4 + £5", "round down: £3 + £4", "do not estimate at all"]
            answer: "round up: £4 + £5"
          - id: l2-c5
            part: exact
            type: text_input
            text: "Tom buys 2 comics at £2.75 each and pays with a £10 note. How much change does he get, in pence?"
            answer: "450"
          - id: l2-c6
            part: decide
            type: sorting
            text: "Which questions can an estimate answer? Sort them."
            option_audio: false
            bins:
              - { id: estimate, show: { text: "an estimate is enough" }, say: "An estimate is enough." }
              - { id: exact, show: { text: "the exact answer" }, say: "The exact answer." }
            options:
              - { text: "How much do I pay for 2 tickets at £8.75?", bin: exact }
              - { text: "About how long is the walk to school?", bin: estimate }
              - { text: "How many grams of sugar go into the cake?", bin: exact }
              - { text: "Will 5 boxes of 12 eggs be enough for 50 eggs?", bin: estimate }
          - id: l2-c7
            part: decide
            type: true_false
            text: "A newspaper reports how many fans were at the match. An estimate is enough."
            answer: true
          - id: l2-c8
            part: decide
            type: multiple_choice
            text: "Which of these needs the exact answer?"
            options: ["the number of eggs in a cake recipe", "about how many people live in a town", "whether 3 buses are enough for 140 children"]
            answer: "the number of eggs in a cake recipe"
          - id: l2-c9
            part: safe-estimate
            type: text_input
            text: "Zac has £20. He wants a torch for £7.60 and batteries for £4.30. He rounds both prices up to check that his money is enough. What is his estimate, in pounds?"
            answer: "13"
          - id: l2-c10
            part: safe-estimate
            type: true_false
            text: "Ben has £10. He wants crisps for £1.40, a drink for £1.75 and a sandwich for £3.20. Rounded up, £2 + £2 + £4 = £8, so £10 is enough."
            answer: true
          - id: l2-c11
            part: safe-estimate
            type: multiple_choice
            text: "Why do you round the prices up when you check that your money is enough?"
            options: ["So the real total cannot be more than the estimate.", "So the sum is easier to work out.", "So you get more change."]
            answer: "So the real total cannot be more than the estimate."
          - id: l2-c12
            part: safe-estimate
            type: multiple_choice
            text: "Ali has £15. His things cost £3.20, £4.10 and £2.30. Rounded up, £4 + £5 + £3 = £12. Is his money enough?"
            options: ["Yes, even rounded up it is less than £15.", "No, £12 is too close to £15.", "You cannot tell without working it out exactly."]
            answer: "Yes, even rounded up it is less than £15."
          - id: l2-c13
            part: close
            type: multiple_choice
            text: "A lift can carry 400 kg. Three people weigh 128 kg, 135 kg and 142 kg. Is it safe for all three to go in?"
            options: ["No, 405 kg is too much.", "Yes, it is about 400 kg.", "Yes, 100 + 100 + 100 = 300."]
            answer: "No, 405 kg is too much."
          - id: l2-c14
            part: close
            type: true_false
            text: "Rounded up, Jen's shopping costs £51. She has £50. So her money is not enough."
            answer: false
          - id: l2-c15
            part: close
            type: text_input
            text: "A van can carry 1200 kg. It has 785 kg on board, and then 390 kg more is loaded. How many kilograms below the limit is it?"
            answer: "25"
          - id: l2-c16
            part: close
            type: true_false
            text: "A rope can hold 250 kg. A climber weighs 82 kg and his bag weighs 18 kg. You need to work it out exactly to know the rope is safe."
            answer: false
          - id: l2-c17
            part: exact
            type: text_input
            text: "Lily buys a magazine for £3.45 and a pen for £1.30. She pays with a £5 note. How much change does she get, in pence?"
            answer: "25"
          - id: l2-c18
            part: exact
            type: text_input
            text: "A baker has 2 kg of flour. She uses 1250 g for bread. How many grams are left?"
            answer: "750"
          - id: l2-c19
            part: exact
            type: multiple_choice
            text: "What should the receipt say for 3 tickets at £4.85 each?"
            options: ["£14.55", "£15", "£12.55"]
            answer: "£14.55"
          - id: l2-c20
            part: exact
            type: text_input
            keyboard: decimal
            text: "A nurse gives a child 2.5 ml of medicine 3 times a day. How many millilitres is that a day?"
            answer: "7.5"
