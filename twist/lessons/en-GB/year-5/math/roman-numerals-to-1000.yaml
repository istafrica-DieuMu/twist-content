# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.roman-numerals-to-1000
skill: math.large-numbers.roman-numerals-large
curriculum: en-GB
language: en
title:
  de: Römische Zahlen bis 1000
  en: Roman numerals to 1000
summary: >
  Roman numerals with D (500) and M (1000), read in parts like place value:
  hundreds, then tens, then ones (CMXLIV = 900 + 40 + 4). Lesson 1 adds a
  smaller numeral after a bigger one and takes it away before (DC = 600,
  CD = 400, CM = 900); lesson 2 reads years on buildings, at the end of
  films and in history (MDCLXVI, MMXXVI), and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Römische Zahlen, en: Roman numerals }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.roman-numerals, math.numbers-to-1000.place-value]
  also_practises: [math.large-numbers.roman-numerals]
  vocabulary: { en: [Roman numerals, I, V, X, L, C, D, M, year, add, take away, hundreds, tens, ones] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: [time-format]
  parts:
    - { id: read, what: { de: römische Zahlen bis 1000 lesen, en: reading Roman numerals to 1000 } }
    - { id: write, what: { de: die römischen Zahlzeichen für eine Zahl finden, en: finding the Roman numerals for a number } }
    - { id: years, what: { de: Jahreszahlen in römischen Zahlen erkennen, en: recognising years written in Roman numerals } }
  misconceptions:
    - id: order-ignored
      what: Adds a smaller numeral that comes before a bigger one (CD read as 600, CM as 1100)
      addressed: lesson 1 Learn sets DC beside CD; l1-f2, l1-f3 and l2-f2 have feedback, l1-s3, l1-n5 and l2-c3 ask it
    - id: reads-left-to-right
      what: Adds every numeral in turn instead of reading the hundreds, tens and ones as groups
      addressed: lesson 1 Learn reads CMXLIV in parts; l1-f4, l2-f3 split a numeral into parts, l1-n2 and l2-n4 need several groups
    - id: d-and-m
      what: Mixes up D and M, or reads D as 50
      addressed: lesson 1 Learn lists every letter; l1-f1, l1-s1 and l1-n4 ask them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: D und M, en: D and M }
    goal:
      de: "Lies römische Zahlen bis 1000 in Teilen, erst die Hunderter, dann die Zehner und Einer, so wie 944."
      en: "Read Roman numerals up to 1000 in parts, first the hundreds, then the tens and ones, like 944."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "XLVII = _"
            say: "What number do these Roman numerals show?"
            options: ["47", "67", "43"]
            answer: "47"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What time does the clock show?"
            show: { drawn: clock, hour: 4, minute: 0, roman: true }
            options: ["4 o'clock", "6 o'clock", "11 o'clock"]
            answer: "4 o'clock"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The Romans wrote 100 as C. Which letter do you think they used for 1000? Guess!"
            say: "The Romans wrote one hundred as the letter C. Which letter do you think they used for one thousand? Have a guess."
          - text: "I = 1   V = 5   X = 10   L = 50\nC = 100   D = 500   M = 1000"
            say: "You know the Roman numerals up to C, one hundred. Two more letters take us to a thousand. D is five hundred and M is one thousand."
          - text: "DC = 500 + 100 = 600\nDCCL = 500 + 200 + 50 = 750"
            say: "When a smaller numeral comes after a bigger one, add it. D then C is five hundred and one hundred: six hundred. D, C, C, L is five hundred, two hundred and fifty: seven hundred and fifty."
          - text: "CD = 500 − 100 = 400\nCM = 1000 − 100 = 900"
            say: "When a smaller numeral comes before a bigger one, take it away. C before D is five hundred take away one hundred: four hundred. C before M is nine hundred. This works just like I V for four and X C for ninety."
          - text: "Did you know? Many clocks with Roman numerals show 4 as IIII, not IV."
            say: "Did you know? Look closely at a clock with Roman numerals. On many of them, four is written as I, I, I, I, not as I V! Clockmakers have done this for hundreds of years. Next time you see one, check which way it is written."
          - text: "CMXLIV\nCM = 900, XL = 40, IV = 4\n900 + 40 + 4 = 944"
            say: "Read a long numeral in parts, like place value: first the hundreds, then the tens, then the ones. C M is nine hundred, X L is forty and I V is four. Together they make nine hundred and forty-four."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "D = _"
                say: "What number is the Roman numeral D?"
                options: ["500", "50", "1000"]
                answer: "500"
                hints:
                  - "L is 50 and M is 1000."
                  - "D is halfway between C and M."
                  - "D = 500."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "DCL = _"
                say: "What number do these Roman numerals show?"
                options: ["650", "450", "550"]
                answer: "650"
                feedback:
                  "450": "In DCL, the C comes after the D, so add it: 500 + 100 + 50."
                hints:
                  - "Is each numeral smaller than the one before it?"
                  - "D, C, L get smaller each time, so add them all."
                  - "500 + 100 + 50 = 650."
              - id: l1-f3
                type: multiple_choice
                text: "CM = _"
                say: "What number do these Roman numerals show?"
                options: ["900", "1100", "800"]
                answer: "900"
                feedback:
                  "1100": "C comes before M, so take it away: 1000 − 100 = 900."
                hints:
                  - "Which comes first, the smaller or the bigger numeral?"
                  - "C (100) comes before M (1000), so take it away."
                  - "1000 − 100 = 900."
              - id: l1-f4
                type: fill_in_blank
                text: "Read CDXXV in parts."
                say: "Read these Roman numerals in parts."
                frame: "CD = _, XX = _, V = 5, so CDXXV = _"
                options: ["20", "400", "425", "600", "625"]
                answer: ["400", "20", "425"]
                hints:
                  - "Start with the hundreds: C before D."
                  - "CD = 500 − 100 = 400. XX = 20."
                  - "400 + 20 + 5 = 425."
              - id: l1-f5
                type: multiple_choice
                text: "Which Roman numerals show 700?"
                options: ["DCC", "CCM", "DDC"]
                answer: "DCC"
                option_audio: false
                hints:
                  - "700 is 500 and 200."
                  - "500 is D. 200 is two Cs."
                  - "D, C, C: DCC."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "M = _"
                say: "What number is the Roman numeral M?"
                options: ["1000", "100", "500"]
                answer: "1000"
                hints: ["M is the biggest of the seven letters."]
              - id: l1-s2
                type: text_input
                text: "DCCLX = _"
                say: "What number do these Roman numerals show?"
                answer: "760"
                hints: ["500 + 200 + 50 + 10."]
              - id: l1-s3
                type: multiple_choice
                text: "CDL = _"
                say: "What number do these Roman numerals show?"
                options: ["450", "650", "550"]
                answer: "450"
                hints: ["C comes before D."]
              - id: l1-s4
                type: text_input
                text: "CMXC = _"
                say: "What number do these Roman numerals show?"
                answer: "990"
                hints: ["CM is 900. XC is 90."]
              - id: l1-s5
                type: multiple_choice
                text: "Which Roman numerals show 400?"
                options: ["CD", "DC", "MC"]
                answer: "CD"
                option_audio: false
                hints: ["400 is 100 less than 500."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "DCCCLXXX = _"
                say: "What number do these Roman numerals show?"
                answer: "880"
              - id: l1-n2
                type: text_input
                text: "CMXLIV = _"
                say: "What number do these Roman numerals show?"
                answer: "944"
              - id: l1-n3
                type: multiple_choice
                text: "Which Roman numerals show 590?"
                options: ["DXC", "DCX", "XCD"]
                answer: "DXC"
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Which is the largest number?"
                options: ["CM", "DCCC", "DCCCL"]
                answer: "CM"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? CD and DC are the same number."
                say: "Is it true? C D and D C are the same number."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "DCX = _"
            say: "What number do these Roman numerals show?"
            options: ["610", "490", "590"]
            answer: "610"
          - id: l1-c2
            type: text_input
            text: "CDLXV = _"
            say: "What number do these Roman numerals show?"
            answer: "465"
          - id: l1-c3
            type: multiple_choice
            text: "Which Roman numerals show 900?"
            options: ["CM", "MC", "DM"]
            answer: "CM"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "CDXC = _"
            say: "What number do these Roman numerals show?"
            options: ["490", "690", "610"]
            answer: "490"
          - id: l1-c5
            type: true_false
            text: "Is it true? DCCC = 800"
            say: "Is it true? D, C, C, C is eight hundred."
            answer: true
          - id: l1-c6
            type: text_input
            text: "CMLV = _"
            say: "What number do these Roman numerals show?"
            answer: "955"

  - n: 2
    title: { de: Jahreszahlen, en: Years in Roman numerals }
    goal:
      de: "Lies Jahreszahlen in römischen Zahlen, wie sie auf alten Gebäuden und am Ende von Filmen stehen, so wie 1666."
      en: "Read years written in Roman numerals, like the ones on old buildings and at the end of films, such as 1666."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "CMX = _"
            say: "What number do these Roman numerals show?"
            options: ["910", "1110", "890"]
            answer: "910"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "DXLV = _"
            say: "What number do these Roman numerals show?"
            answer: "545"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A film ends with MMXXVI. Which year was it made? Guess!"
            say: "At the very end of a film, you see the letters M, M, X, X, V, I. Which year do you think the film was made? Have a guess."
          - text: "MM = 2000\nMMXXVI = 2000 + 20 + 6 = 2026"
            say: "Years are often written in Roman numerals. Two Ms are two thousand. M, M, X, X, V, I is two thousand and twenty-six."
          - text: "MCMXCIX\nM = 1000, CM = 900, XC = 90, IX = 9\n= 1999"
            say: "Read a year in parts too: thousands, hundreds, tens and ones. M is one thousand, C M is nine hundred, X C is ninety and I X is nine. The year is nineteen ninety-nine."
          - text: "MDCLXVI = 1000 + 600 + 60 + 6 = 1666"
            say: "M, D, C, L, X, V, I uses every letter once, biggest first. One thousand, six hundred and sixty-six: the year of the Great Fire of London."
          - text: "You see Roman numerals on clocks, on old buildings, at the end of films and TV programmes, and in the names of kings and queens."
            say: "Look out for Roman numerals around you: on clock faces, carved on old buildings, in the small print at the end of a film, and in names like Queen Elizabeth the Second."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "MMXXVI = _"
                say: "Which year do these Roman numerals show?"
                options: ["2026", "2024", "2046"]
                answer: "2026"
                hints:
                  - "MM is 2000."
                  - "XX is 20 and VI is 6."
                  - "2000 + 20 + 6 = 2026."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "MCMXCIX = _"
                say: "Which year do these Roman numerals show?"
                options: ["1999", "2199", "1901"]
                answer: "1999"
                feedback:
                  "2199": "CM is 900, not 1100: the C comes before the M, so take it away."
                hints:
                  - "Split it: M, CM, XC, IX."
                  - "M = 1000, CM = 900, XC = 90, IX = 9."
                  - "1000 + 900 + 90 + 9 = 1999."
              - id: l2-f3
                type: fill_in_blank
                text: "Read MDCLXVI in parts."
                say: "Read these Roman numerals in parts."
                frame: "M = 1000, DC = _, LX = _, VI = 6, so MDCLXVI = _"
                options: ["40", "60", "400", "600", "1446", "1666"]
                answer: ["600", "60", "1666"]
                hints:
                  - "In DC and LX, the smaller numeral comes second, so add."
                  - "DC = 500 + 100 = 600. LX = 50 + 10 = 60."
                  - "1000 + 600 + 60 + 6 = 1666."
              - id: l2-f4
                type: multiple_choice
                text: "Which Roman numerals show the year 2010?"
                options: ["MMX", "MMXX", "MXM"]
                answer: "MMX"
                option_audio: false
                hints:
                  - "2010 is 2000 and 10."
                  - "2000 is MM. 10 is X."
                  - "MMX."
              - id: l2-f5
                type: text_input
                text: "A stone on a church says it was built in MDCCCL. Which year is that?"
                say: "A stone on a church shows the year it was built in Roman numerals. Which year is that?"
                answer: "1850"
                hints:
                  - "M is 1000. Then D and three Cs."
                  - "DCCC = 500 + 300 = 800. L = 50."
                  - "1000 + 800 + 50 = 1850."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "MCMLXX = _"
                say: "Which year do these Roman numerals show?"
                options: ["1970", "1930", "2170"]
                answer: "1970"
                hints: ["M = 1000, CM = 900, LXX = 70."]
              - id: l2-s2
                type: text_input
                text: "MMXV = _"
                say: "Which year do these Roman numerals show?"
                answer: "2015"
                hints: ["MM = 2000."]
              - id: l2-s3
                type: multiple_choice
                text: "Which Roman numerals show 1900?"
                options: ["MCM", "CMM", "MMC"]
                answer: "MCM"
                option_audio: false
                hints: ["1900 is 1000 and 900."]
              - id: l2-s4
                type: multiple_choice
                text: "A film ends with the year MCMXCV. Which year was it made?"
                say: "A film ends with the year it was made, in Roman numerals. Which year was it made?"
                options: ["1995", "1905", "2195"]
                answer: "1995"
                hints: ["XC is 90 and V is 5."]
              - id: l2-s5
                type: true_false
                text: "Is it true? MMXX is the year 2020."
                say: "Is it true? M, M, X, X is the year twenty twenty."
                answer: true
                hints: ["MM = 2000, XX = 20."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A clock tower has the date MDCCCXCV on it. Which year is that?"
                say: "A clock tower has a date in Roman numerals on it. Which year is that?"
                answer: "1895"
              - id: l2-n2
                type: multiple_choice
                text: "Two old photos are dated MCMLX and MCMXL. Which date is earlier?"
                say: "Two old photos have dates in Roman numerals. Which date is earlier?"
                options: ["MCMLX", "MCMXL"]
                answer: "MCMXL"
                option_audio: false
              - id: l2-n3
                type: text_input
                text: "A school opened in MCMXC. How many years after that is MMXX?"
                say: "A school opened in the first year shown. How many years after that is the second year shown?"
                answer: "30"
              - id: l2-n4
                type: multiple_choice
                text: "The Battle of Hastings was in 1066. How is that written in Roman numerals?"
                options: ["MLXVI", "MXLVI", "MLVXI"]
                answer: "MLXVI"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "A museum sign shows MCMLXXXIV for 1984. Is it right?"
                say: "A museum sign shows the year nineteen eighty-four in Roman numerals. Is it right?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "DCCXL = _"
            say: "What number do these Roman numerals show?"
            options: ["740", "760", "540"]
            answer: "740"
          - id: l2-c2
            part: read
            type: text_input
            text: "CMLXXV = _"
            say: "What number do these Roman numerals show?"
            answer: "975"
          - id: l2-c3
            part: write
            type: multiple_choice
            text: "Which Roman numerals show 450?"
            options: ["CDL", "DCL", "LD"]
            answer: "CDL"
            option_audio: false
          - id: l2-c4
            part: years
            type: multiple_choice
            text: "MMXI = _"
            say: "Which year do these Roman numerals show?"
            options: ["2011", "2009", "2101"]
            answer: "2011"
          - id: l2-c5
            part: years
            type: text_input
            text: "A building shows the year MCMXXXVIII. Which year was it built?"
            say: "A building shows the year it was built in Roman numerals. Which year was it built?"
            answer: "1938"
          - id: l2-c6
            part: read
            type: text_input
            text: "DCCCXL = _"
            say: "What number do these Roman numerals show?"
            answer: "840"
          - id: l2-c7
            part: read
            type: multiple_choice
            text: "CDXCIX = _"
            say: "What number do these Roman numerals show?"
            options: ["499", "699", "501"]
            answer: "499"
          - id: l2-c8
            part: read
            type: true_false
            text: "Is it true? CMXX = 1120"
            say: "Is it true? C, M, X, X is one thousand, one hundred and twenty."
            answer: false
          - id: l2-c9
            part: read
            type: multiple_choice
            text: "Which is the smallest number?"
            options: ["CD", "DC", "CDL"]
            answer: "CD"
            option_audio: false
          - id: l2-c10
            part: read
            type: text_input
            text: "DLXXIII = _"
            say: "What number do these Roman numerals show?"
            answer: "573"
          - id: l2-c11
            part: write
            type: multiple_choice
            text: "Which Roman numerals show 640?"
            options: ["DCXL", "CDXL", "DCLX"]
            answer: "DCXL"
            option_audio: false
          - id: l2-c12
            part: write
            type: multiple_choice
            text: "Which Roman numerals show 940?"
            options: ["CMXL", "CMLX", "MCXL"]
            answer: "CMXL"
            option_audio: false
          - id: l2-c13
            part: write
            type: true_false
            text: "Sam writes 870 in Roman numerals as DCCCLXX. Is he right?"
            say: "Sam writes eight hundred and seventy in Roman numerals as D, C, C, C, L, X, X. Is he right?"
            answer: true
          - id: l2-c14
            part: write
            type: true_false
            text: "Is it true? 1000 in Roman numerals is D."
            say: "Is it true? One thousand in Roman numerals is D."
            answer: false
          - id: l2-c15
            part: write
            type: multiple_choice
            text: "Which Roman numerals show 350?"
            options: ["CCCL", "CDL", "DCCL"]
            answer: "CCCL"
            option_audio: false
          - id: l2-c16
            part: years
            type: multiple_choice
            text: "MCMLXXX = _"
            say: "Which year do these Roman numerals show?"
            options: ["1980", "2180", "1960"]
            answer: "1980"
          - id: l2-c17
            part: years
            type: text_input
            text: "A bridge has the year it opened on it: MDCCCLXXXIV. Which year is that?"
            say: "A bridge has the year it opened on it, in Roman numerals. Which year is that?"
            answer: "1884"
          - id: l2-c18
            part: years
            type: true_false
            text: "Is it true? The year MMV comes after the year MCMXCVIII."
            say: "Is it true? The year M, M, V comes after the year M, C, M, X, C, V, I, I, I."
            answer: true
          - id: l2-c19
            part: years
            type: multiple_choice
            text: "Which Roman numerals show the year 1950?"
            options: ["MCML", "MCMLX", "MDCCCL"]
            answer: "MCML"
            option_audio: false
          - id: l2-c20
            part: years
            type: multiple_choice
            text: "A castle wall shows MCCLXXXIII, the year the castle was finished. Which year is that?"
            say: "A castle wall shows the year the castle was finished, in Roman numerals. Which year is that?"
            options: ["1283", "1233", "1483"]
            answer: "1283"
