# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.measure-angles
skill: math.angles.measure-draw
curriculum: en-GB
language: en
title:
  de: Winkel schätzen und messen
  en: Estimate and measure angles
summary: >
  Angles in degrees: estimate first, then measure with a protractor,
  reading the scale that starts at 0 on the arm. Lesson 1 estimates and
  reads acute and obtuse angles on both scales; lesson 2 measures reflex
  angles by taking the small angle from 360°, puts the steps for drawing
  an angle in order, and ends with the skill check. Drawing an angle with
  a finger on the protractor waits for a drawing task type.
metadata:
  year: year-5
  topic: { de: Winkel, en: Angles }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.angles.acute-obtuse, math.shapes.parallel-perpendicular]
  also_practises: [math.angles.acute-obtuse]
  vocabulary: { en: [angle, degrees, protractor, estimate, measure, arm, vertex, scale, acute, obtuse, right angle, straight line, reflex angle, whole turn] }
  forms: [drawn, text, audio]
  drawn: [angle]
  facets: []
  parts:
    - { id: estimate-kind, what: { de: Winkel schätzen und ihre Art benennen, en: estimating an angle and naming its kind } }
    - { id: measure, what: { de: Winkel mit dem Winkelmesser auf der richtigen Skala ablesen, en: reading an angle on the right scale of a protractor } }
    - { id: reflex, what: { de: überstumpfe Winkel aus dem kleinen Winkel bestimmen, en: finding a reflex angle from the small angle } }
    - { id: draw, what: { de: einen Winkel mit dem Winkelmesser zeichnen, en: drawing an angle with a protractor } }
  misconceptions:
    - id: wrong-scale
      what: Reads the other scale of the protractor (writes 130° for a 50° angle)
      addressed: lesson 1 Learn shows both scales and which 0 to start from; l1-f2 and l1-f4 have feedback, every protractor task offers the other-scale reading, l2-n4 asks it in a drawing
    - id: no-estimate
      what: Does not check a reading against an estimate, so accepts 150° for an acute angle
      addressed: lesson 1 Learn estimates before measuring; l1-f1, l1-s1, l1-c2, l2-n3 and l2-c2 estimate, l1-n4 catches a wrong reading
    - id: reflex-as-small
      what: Gives the small angle, or 180° minus it, instead of the reflex angle
      addressed: lesson 2 Learn takes the small angle from 360°; l2-f2 has feedback on 180° minus, l2-f5 offers the small angle, l2-s2 and l2-c3 ask it again
    - id: reflex-named-obtuse
      what: Calls any big angle obtuse, even past a straight line
      addressed: lesson 2 Learn lists the kinds of angle; l2-f1 has feedback, l2-s1, l2-s5 and l2-c4 ask it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Schätzen und mit dem Winkelmesser messen, en: Estimate and use a protractor }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Is this angle acute, a right angle or obtuse?"
            show: { drawn: angle, degrees: 120, label: false }
            options: ["acute", "right angle", "obtuse"]
            answer: "obtuse"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Two lines meet at a right angle. What are they called?"
            options: ["perpendicular", "parallel", "diagonal"]
            answer: "perpendicular"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "right angle = 90°\nstraight line = 180°\nwhole turn = 360°"
            say: "We measure angles in degrees. A right angle is ninety degrees. Two right angles make a straight line: one hundred and eighty degrees. A whole turn is three hundred and sixty degrees."
            show: { drawn: angle, degrees: 90 }
          - text: "Estimate first.\nLess than 90°: acute. Between 90° and 180°: obtuse."
            say: "Before you measure, estimate. This angle is smaller than a right angle, so it is acute. It looks about two thirds of a right angle: about sixty degrees."
            show: { drawn: angle, degrees: 60, label: "?" }
          - text: "1. Centre on the vertex.\n2. Line up 0 with one arm.\n3. Read the scale that starts at 0 on that arm."
            say: "Put the centre of the protractor on the vertex, where the arms meet. Line up the zero line with one arm. Here the arm on the right lies on the zero of the outer scale, so read the outer scale: forty degrees. The inner scale says one hundred and forty, but that cannot be right: the angle is acute."
            show: { drawn: angle, degrees: 40, protractor: true, label: false }
          - text: "This arm lies on 0 of the inner scale: 70°."
            say: "Now the angle opens from the arm on the left. That arm lies on the zero of the inner scale, so count round the inner scale: seventy degrees."
            show: { drawn: angle, degrees: 70, rotate: 110, protractor: true, label: false }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "About how big is this angle?"
                show: { drawn: angle, degrees: 30, label: "?" }
                options: ["30°", "90°", "150°"]
                answer: "30°"
                hints:
                  - "Compare it with a right angle."
                  - "It is much smaller than a right angle, about a third of one."
                  - "A third of 90° is 30°."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Read the protractor. How big is the angle?"
                show: { drawn: angle, degrees: 50, protractor: true, label: false }
                options: ["50°", "130°", "40°"]
                answer: "50°"
                feedback:
                  "130°": "That is the other scale. The arm on the right lies on 0 of the outer scale, so count from that 0."
                hints:
                  - "Which scale has its 0 on the arm on the right?"
                  - "The outer scale starts at 0 there. Count round it to the other arm."
                  - "The angle is acute, so it is 50°."
              - id: l1-f3
                type: multiple_choice
                text: "Read the protractor. How big is the angle?"
                show: { drawn: angle, degrees: 120, protractor: true, label: false }
                options: ["120°", "60°", "100°"]
                answer: "120°"
                feedback:
                  "60°": "60° is on the inner scale. This angle is obtuse, so it must be more than 90°."
                hints:
                  - "Estimate first: is it acute or obtuse?"
                  - "It is obtuse. Read the outer scale, which starts at 0 on the right arm."
                  - "The angle is 120°."
              - id: l1-f4
                type: multiple_choice
                text: "Read the protractor. How big is the angle?"
                show: { drawn: angle, degrees: 70, rotate: 110, protractor: true, label: false }
                options: ["70°", "110°", "80°"]
                answer: "70°"
                feedback:
                  "110°": "This angle opens from the arm on the left. That arm lies on 0 of the inner scale, so read the inner scale."
                hints:
                  - "Which arm lies along the bottom of the protractor?"
                  - "The arm on the left lies on 0 of the inner scale. Count round the inner scale."
                  - "The angle is acute: 70°."
              - id: l1-f5
                type: true_false
                text: "Is it true? An angle of 95° is obtuse."
                answer: true
                hints:
                  - "An obtuse angle is bigger than a right angle."
                  - "A right angle is 90°. Is 95° bigger?"
                  - "Yes. 95° is between 90° and 180°."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "About how big is this angle?"
                show: { drawn: angle, degrees: 140, label: "?" }
                options: ["40°", "90°", "140°"]
                answer: "140°"
                hints: ["It is bigger than a right angle, nearly a straight line."]
              - id: l1-s2
                type: multiple_choice
                text: "Read the protractor. How big is the angle?"
                show: { drawn: angle, degrees: 80, protractor: true, label: false }
                options: ["80°", "100°", "90°"]
                answer: "80°"
                hints: ["It is a little less than a right angle."]
              - id: l1-s3
                type: multiple_choice
                text: "Read the protractor. How big is the angle?"
                show: { drawn: angle, degrees: 30, rotate: 150, protractor: true, label: false }
                options: ["30°", "150°", "20°"]
                answer: "30°"
                hints: ["The arm on the left lies on 0 of the inner scale."]
              - id: l1-s4
                type: multiple_choice
                text: "Read the protractor. How big is the angle?"
                show: { drawn: angle, degrees: 160, protractor: true, label: false }
                options: ["160°", "20°", "150°"]
                answer: "160°"
                hints: ["The angle is obtuse, nearly a straight line."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which angle is about 45°?"
                options:
                  - { drawn: angle, degrees: 45, label: false, key: "45" }
                  - { drawn: angle, degrees: 90, label: false, key: "90" }
                  - { drawn: angle, degrees: 135, label: false, key: "135" }
                answer: "45"
                hints: ["45° is half a right angle."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Read the protractor. How big is the angle?"
                show: { drawn: angle, degrees: 110, protractor: true, label: false }
                options: ["110°", "70°", "100°"]
                answer: "110°"
              - id: l1-n2
                type: multiple_choice
                text: "Read the protractor. How big is the angle?"
                show: { drawn: angle, degrees: 45, rotate: 135, protractor: true, label: false }
                options: ["45°", "135°", "55°"]
                answer: "45°"
              - id: l1-n3
                type: text_input
                text: "Read the protractor. How many degrees is the angle?"
                show: { drawn: angle, degrees: 20, protractor: true, label: false }
                answer: "20"
              - id: l1-n4
                type: multiple_choice
                text: "Mia measures this angle and writes 150°. What is it really?"
                show: { drawn: angle, degrees: 30, protractor: true, label: false }
                options: ["30°", "150°", "60°"]
                answer: "30°"
              - id: l1-n5
                type: true_false
                text: "Is it true? An angle of 89° is obtuse."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Read the protractor. How big is the angle?"
            show: { drawn: angle, degrees: 60, protractor: true, label: false }
            options: ["60°", "120°", "70°"]
            answer: "60°"
          - id: l1-c2
            type: multiple_choice
            text: "About how big is this angle?"
            show: { drawn: angle, degrees: 100, label: "?" }
            options: ["10°", "100°", "170°"]
            answer: "100°"
          - id: l1-c3
            type: multiple_choice
            text: "Read the protractor. How big is the angle?"
            show: { drawn: angle, degrees: 140, rotate: 40, protractor: true, label: false }
            options: ["140°", "40°", "130°"]
            answer: "140°"
          - id: l1-c4
            type: multiple_choice
            text: "Read the protractor. How big is the angle?"
            show: { drawn: angle, degrees: 25, rotate: 155, protractor: true, label: false }
            options: ["25°", "155°", "35°"]
            answer: "25°"
          - id: l1-c5
            type: true_false
            text: "Is it true? An angle of 175° is acute."
            answer: false
          - id: l1-c6
            type: text_input
            text: "Read the protractor. How many degrees is the angle?"
            show: { drawn: angle, degrees: 115, protractor: true, label: false }
            answer: "115"

  - n: 2
    title: { de: Überstumpfe Winkel und Winkel zeichnen, en: Reflex angles and drawing angles }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Read the protractor. How big is the angle?"
            show: { drawn: angle, degrees: 130, protractor: true, label: false }
            options: ["130°", "50°", "120°"]
            answer: "130°"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "About how big is this angle?"
            show: { drawn: angle, degrees: 20, label: "?" }
            options: ["20°", "70°", "110°"]
            answer: "20°"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A reflex angle is more than 180° and less than 360°."
            say: "An angle bigger than a straight line is a reflex angle. It is more than one hundred and eighty degrees and less than a whole turn. This one is two hundred and fifty degrees."
            show: { drawn: angle, degrees: 250 }
          - text: "360° − 110° = 250°"
            say: "A protractor only goes to one hundred and eighty, so measure the small angle on the other side instead. Here it is one hundred and ten degrees. The two angles make a whole turn, so take the small angle away from three hundred and sixty: two hundred and fifty degrees."
            show: { drawn: angle, degrees: 250, label: "?" }
          - text: "To draw 65°:\ndraw an arm, put the centre on its end, line up 0,\nmark 65 on the scale that starts at 0, join the mark to the end."
            say: "To draw an angle of sixty-five degrees, draw a straight arm. Put the centre of the protractor on one end and line up zero with the arm. Count round the scale that starts at that zero to sixty-five and make a mark. Join the mark to the end of the arm."
            show: { drawn: angle, degrees: 65, protractor: true }
          - text: "acute: less than 90°\nright angle: 90°\nobtuse: between 90° and 180°\nstraight line: 180°\nreflex: between 180° and 360°"
            say: "Acute angles are less than ninety degrees. A right angle is ninety. Obtuse angles are between ninety and one hundred and eighty. A straight line is one hundred and eighty. Reflex angles are between one hundred and eighty and three hundred and sixty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What kind of angle is this?"
                show: { drawn: angle, degrees: 230, label: false }
                options: ["acute", "obtuse", "reflex"]
                answer: "reflex"
                keep_order: true
                feedback:
                  "obtuse": "Obtuse angles are smaller than a straight line. This one goes past a straight line."
                hints:
                  - "Is the angle bigger or smaller than a straight line?"
                  - "It goes past a straight line, so it is more than 180°."
                  - "More than 180° is a reflex angle."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The small angle on the other side is 100°. How big is the reflex angle?"
                show: { drawn: angle, degrees: 260, label: "?" }
                options: ["260°", "80°", "200°"]
                answer: "260°"
                feedback:
                  "80°": "80° and 100° make a straight line. The two angles here make a whole turn: 360° − 100°."
                hints:
                  - "The small angle and the reflex angle make a whole turn."
                  - "A whole turn is 360°. Take away the small angle."
                  - "360° − 100° = 260°."
              - id: l2-f3
                type: fill_in_blank
                text: "The small angle is 75°. Find the reflex angle."
                frame: "360° − 75° = _°"
                options: ["105", "275", "285"]
                answer: ["285"]
                hints:
                  - "Take 75 away from 360."
                  - "360 − 70 = 290, then take away 5 more."
                  - "290 − 5 = 285."
              - id: l2-f4
                type: ordering
                text: "Put the steps for drawing an angle of 65° in order."
                options:
                  - "Mark 65 on the scale that starts at that 0."
                  - "Put the centre of the protractor on one end of the arm."
                  - "Join the mark to the end of the arm."
                  - "Draw a straight arm with a ruler."
                  - "Line up 0 with the arm."
                slot_count: 5
                answer:
                  - "Draw a straight arm with a ruler."
                  - "Put the centre of the protractor on one end of the arm."
                  - "Line up 0 with the arm."
                  - "Mark 65 on the scale that starts at that 0."
                  - "Join the mark to the end of the arm."
                hints:
                  - "You need a line before you can put the protractor on it."
                  - "The protractor goes on the end of the arm before you line up 0."
                  - "Arm, centre, line up 0, mark 65, join."
              - id: l2-f5
                type: image_multiple_choice
                text: "Which drawing shows an angle of 300°?"
                options:
                  - { drawn: angle, degrees: 300, label: false, key: "300" }
                  - { drawn: angle, degrees: 60, label: false, key: "60" }
                  - { drawn: angle, degrees: 240, label: false, key: "240" }
                answer: "300"
                hints:
                  - "300° is almost a whole turn."
                  - "The small angle left over is 360° − 300° = 60°."
                  - "Find the reflex angle with only 60° left over on the other side."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What kind of angle is this?"
                show: { drawn: angle, degrees: 200, label: false }
                options: ["acute", "obtuse", "reflex"]
                answer: "reflex"
                keep_order: true
                hints: ["Does it go past a straight line?"]
              - id: l2-s2
                type: multiple_choice
                text: "The small angle on the other side is 40°. How big is the reflex angle?"
                show: { drawn: angle, degrees: 320, label: "?" }
                options: ["320°", "140°", "220°"]
                answer: "320°"
                hints: ["The two angles make 360°."]
              - id: l2-s3
                type: multiple_choice
                text: "You draw an angle of 110° with a protractor. Where does the centre of the protractor go?"
                options: ["on the end of the arm, where the angle starts", "in the middle of the arm", "on the 110 mark"]
                answer: "on the end of the arm, where the angle starts"
                hints: ["The centre goes where the two arms will meet."]
              - id: l2-s4
                type: text_input
                text: "The small angle is 135°. How big is the reflex angle, in degrees?"
                answer: "225"
                hints: ["360 − 135."]
              - id: l2-s5
                type: multiple_choice
                text: "Which angle is reflex?"
                options: ["190°", "170°", "90°"]
                answer: "190°"
                hints: ["Reflex means more than 180°."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "At 3 o'clock the hands of a clock make a right angle. How big is the reflex angle between them?"
                options: ["270°", "90°", "180°"]
                answer: "270°"
              - id: l2-n2
                type: text_input
                text: "Leo draws a reflex angle. The small angle left over is 85°. How big is Leo's angle, in degrees?"
                answer: "275"
              - id: l2-n3
                type: multiple_choice
                text: "A dancer turns this far on one foot. About how big is the angle she turns through?"
                show: { drawn: angle, degrees: 270, label: "?" }
                options: ["90°", "180°", "270°"]
                answer: "270°"
              - id: l2-n4
                type: multiple_choice
                text: "Sam wants to draw 40°. He marks 140 on the protractor by mistake. What should he do?"
                options: ["Mark 40 on the scale that starts at 0 on his arm.", "Draw his arm longer.", "Turn the protractor upside down."]
                answer: "Mark 40 on the scale that starts at 0 on his arm."
              - id: l2-n5
                type: true_false
                text: "Is it true? Every reflex angle is bigger than every obtuse angle."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: measure
            type: multiple_choice
            text: "Read the protractor. How big is the angle?"
            show: { drawn: angle, degrees: 150, rotate: 30, protractor: true, label: false }
            options: ["150°", "30°", "140°"]
            answer: "150°"
          - id: l2-c2
            part: estimate-kind
            type: multiple_choice
            text: "About how big is this angle?"
            show: { drawn: angle, degrees: 80, label: "?" }
            options: ["10°", "80°", "150°"]
            answer: "80°"
          - id: l2-c3
            part: reflex
            type: text_input
            text: "The small angle is 65°. How big is the reflex angle, in degrees?"
            answer: "295"
          - id: l2-c4
            part: estimate-kind
            type: multiple_choice
            text: "What kind of angle is 182°?"
            options: ["obtuse", "straight line", "reflex"]
            answer: "reflex"
            keep_order: true
          - id: l2-c5
            part: measure
            type: multiple_choice
            text: "Read the protractor. How big is the angle?"
            show: { drawn: angle, degrees: 35, protractor: true, label: false }
            options: ["35°", "145°", "45°"]
            answer: "35°"
          - id: l2-c6
            part: estimate-kind
            type: image_multiple_choice
            text: "Which angle is about 120°?"
            options:
              - { drawn: angle, degrees: 60, label: false, key: "60" }
              - { drawn: angle, degrees: 170, label: false, key: "170" }
              - { drawn: angle, degrees: 120, label: false, key: "120" }
            answer: "120"
          - id: l2-c7
            part: estimate-kind
            type: multiple_choice
            text: "About how big is this angle?"
            show: { drawn: angle, degrees: 160, label: "?" }
            options: ["20°", "90°", "160°"]
            answer: "160°"
          - id: l2-c8
            part: estimate-kind
            type: true_false
            text: "Is it true? An angle of 270° is obtuse."
            answer: false
          - id: l2-c9
            part: measure
            type: multiple_choice
            text: "Read the protractor. How big is the angle?"
            show: { drawn: angle, degrees: 100, protractor: true, label: false }
            options: ["100°", "80°", "110°"]
            answer: "100°"
          - id: l2-c10
            part: measure
            type: text_input
            text: "Read the protractor. How many degrees is the angle?"
            show: { drawn: angle, degrees: 55, rotate: 125, protractor: true, label: false }
            answer: "55"
          - id: l2-c11
            part: measure
            type: true_false
            text: "Read the protractor. Is the angle 25°?"
            show: { drawn: angle, degrees: 155, rotate: 25, protractor: true, label: false }
            answer: false
          - id: l2-c12
            part: reflex
            type: multiple_choice
            text: "The small angle on the other side is 150°. How big is the reflex angle?"
            show: { drawn: angle, degrees: 210, label: "?" }
            options: ["210°", "30°", "150°"]
            answer: "210°"
          - id: l2-c13
            part: reflex
            type: fill_in_blank
            text: "The small angle is 48°. Find the reflex angle."
            frame: "360° − 48° = _°"
            options: ["132", "312", "322"]
            answer: ["312"]
          - id: l2-c14
            part: reflex
            type: text_input
            text: "A reflex angle is 290°. How big is the small angle on the other side, in degrees?"
            answer: "70"
          - id: l2-c15
            part: reflex
            type: true_false
            text: "The small angle is 120°. Is the reflex angle 240°?"
            answer: true
          - id: l2-c16
            part: draw
            type: multiple_choice
            text: "You are drawing an angle of 75°. You have lined up 0 with the arm. What do you do next?"
            options: ["Mark 75 on the scale that starts at that 0.", "Join the two ends of the arm.", "Draw a second arm at any angle."]
            answer: "Mark 75 on the scale that starts at that 0."
          - id: l2-c17
            part: draw
            type: multiple_choice
            text: "Ravi wants to draw an angle of 50°. Here is his drawing. What is wrong?"
            show: { drawn: angle, degrees: 130, protractor: true, label: false }
            options: ["He used the wrong scale: this is 130°.", "Nothing, it is 50°.", "His arms are too short."]
            answer: "He used the wrong scale: this is 130°."
          - id: l2-c18
            part: draw
            type: multiple_choice
            text: "A protractor only goes to 180°. How can you draw a reflex angle of 300°?"
            options: ["Draw 60°: the reflex angle is on the other side.", "Draw 120°: the reflex angle is on the other side.", "Mark 300 on the outer scale."]
            answer: "Draw 60°: the reflex angle is on the other side."
          - id: l2-c19
            part: draw
            type: true_false
            text: "Ella wants an angle of 35°. Here is her drawing. Is it right?"
            show: { drawn: angle, degrees: 35, protractor: true, label: false }
            answer: true
          - id: l2-c20
            part: draw
            type: multiple_choice
            text: "Kai wants to draw 140°. His arm lies on the 0 of the inner scale. Where does he make his mark?"
            options: ["at 140 on the inner scale", "at 140 on the outer scale", "at 40 on the inner scale"]
            answer: "at 140 on the inner scale"
