# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.percent-meaning
skill: math.percentages-ratio.percent-meaning
curriculum: en-GB
language: en
title:
  de: Was Prozent bedeutet
  en: What per cent means
summary: >
  Lesson 1 learns that per cent means out of a hundred and meets the %
  sign on a hundred square (37 of 100 filled is 37%), then writes
  percentages as fractions over 100 (37% = 37/100) and as decimals (37% =
  0.37, 7% = 0.07); lesson 2 moves between all three ways of writing the
  same amount, finds the rest of the whole (100% − 62% = 38%), compares
  amounts written in different ways and reads percentages in real life (a
  battery at 20%, 100% attendance), and ends with the skill check. Halves,
  quarters and fifths as percentages are left to
  math.percentages-ratio.equivalences.
metadata:
  year: year-5
  topic: { de: Prozent, en: Percentages }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.decimals.fraction-equivalents]
  also_practises: [math.decimals.fraction-equivalents, math.decimals.hundredths]
  vocabulary: { en: [per cent, percentage, "%", out of 100, hundredth, fraction, decimal, whole] }
  forms: [text, audio, drawn]
  drawn: [hundred-field, place-value-chart]
  facets: [number-format]
  misconceptions:
    - id: one-digit-percent-as-tenths
      what: Writes a one-digit percentage as tenths (7% = 0.7) or reads 0.4 as 4%
      addressed: lesson 1 Learn says 7% is 0.07; l1-f5 (with feedback), l1-n3, l1-n4, l2-f3 (with feedback), l2-s1, l2-n4 and l2-c3 ask about one-digit percentages or tenths
    - id: filled-or-empty
      what: Gives the empty part instead of the filled part, or cannot find the rest of the whole
      addressed: lesson 2 Learn takes 75% from 100%; l1-f1 (with feedback), l1-s1, l1-n1, l1-c1, l2-w1 and l2-c1 offer the other part, l2-f2 (with feedback), l2-s2, l2-n3 and l2-c4 ask for the rest
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Prozent heißt von Hundert", en: "Per cent means out of 100" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which fraction is the same as 0.25?"
            options: ["25/100", "25/10", "2/5"]
            answer: "25/100"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Write 7/100 as a decimal."
            options: ["0.07", "0.7", "7.0"]
            answer: "0.07"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "per cent = out of 100\n30 out of 100 = 30%"
            say: "Per cent means out of a hundred. We write it with the per cent sign. Here thirty of the hundred dots are filled. That is thirty per cent."
            show: { drawn: hundred-field, filled: 30 }
          - text: "37% = 37/100"
            say: "Thirty-seven per cent means thirty-seven out of a hundred, so you can write it as the fraction thirty-seven hundredths."
            show: { drawn: hundred-field, filled: 37 }
          - text: "37% = 0.37"
            say: "Thirty-seven hundredths is also the decimal zero point three seven: three tenths and seven hundredths."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 3, 7] }
          - text: "100% is the whole.\n7% = 7/100 = 0.07, not 0.7"
            say: "One hundred per cent is the whole thing. Be careful with small percentages. Seven per cent is seven hundredths, so the decimal is zero point zero seven. Zero point seven would be seventy per cent."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What percentage of the hundred square is filled?"
                show: { drawn: hundred-field, filled: 45 }
                options: ["45%", "55%", "4.5%"]
                answer: "45%"
                feedback:
                  "55%": "55% is the part that is not filled. Count the filled dots."
                hints:
                  - "Count the filled dots in rows of ten."
                  - "4 full rows and 5 more: 45 out of 100."
                  - "45%."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What does per cent mean?"
                options: ["out of 100", "out of 10", "out of 1000"]
                answer: "out of 100"
                hints:
                  - "Think of a century: 100 years."
                  - "A hundred square shows 100%."
                  - "Out of 100."
              - id: l1-f3
                type: fill_in_blank
                text: "Write 63% as a fraction."
                frame: "63% = _"
                options: ["63/100", "63/10", "6/3"]
                answer: ["63/100"]
                hints:
                  - "Per cent means out of 100."
                  - "63 out of 100."
                  - "63/100."
              - id: l1-f4
                type: multiple_choice
                text: "Write 29% as a decimal."
                options: ["0.29", "2.9", "29.0"]
                answer: "0.29"
                feedback:
                  "2.9": "2.9 is more than 2 wholes. 29% is less than one whole."
                hints:
                  - "29% is 29 hundredths."
                  - "2 tenths and 9 hundredths."
                  - "0.29."
              - id: l1-f5
                type: multiple_choice
                text: "Write 8% as a decimal."
                options: ["0.08", "0.8", "8.0"]
                answer: "0.08"
                feedback:
                  "0.8": "0.8 is 8 tenths, which is 80 hundredths, so 80%. 8% is only 8 hundredths."
                hints:
                  - "8% is 8 hundredths."
                  - "There are no tenths, so the tenths place holds a 0."
                  - "0.08."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What percentage of the hundred square is filled?"
                show: { drawn: hundred-field, filled: 72 }
                options: ["72%", "28%", "7.2%"]
                answer: "72%"
                hints: ["Count the full rows of ten, then the rest."]
              - id: l1-s2
                type: fill_in_blank
                text: "Write 41/100 as a percentage."
                frame: "41/100 = _"
                options: ["41%", "4.1%", "59%"]
                answer: ["41%"]
                hints: ["41 out of 100."]
              - id: l1-s3
                type: true_false
                text: "50% means half. Is that true?"
                answer: true
                hints: ["50 out of 100."]
              - id: l1-s4
                type: multiple_choice
                text: "Write 0.6 as a percentage."
                options: ["60%", "6%", "0.6%"]
                answer: "60%"
                hints: ["0.6 is 6 tenths, which is 60 hundredths."]
              - id: l1-s5
                type: multiple_choice
                text: "A quiz has 100 questions. Zara gets 87 right. What percentage is that?"
                options: ["87%", "13%", "8.7%"]
                answer: "87%"
                hints: ["87 out of 100."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What percentage of the hundred square is not filled?"
                show: { drawn: hundred-field, filled: 18 }
                options: ["82%", "18%", "8.2%"]
                answer: "82%"
              - id: l1-n2
                type: fill_in_blank
                text: "Write 5% as a fraction."
                frame: "5% = _"
                options: ["5/100", "5/10", "1/5"]
                answer: ["5/100"]
              - id: l1-n3
                type: multiple_choice
                text: "Write 0.03 as a percentage."
                options: ["3%", "30%", "0.3%"]
                answer: "3%"
              - id: l1-n4
                type: true_false
                text: "7% is the same as 0.7. Is that true?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "35% of the children in a class walk to school. What percentage do not walk? Type the number."
                answer: "65"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What percentage of the hundred square is filled?"
            show: { drawn: hundred-field, filled: 64 }
            options: ["64%", "36%", "6.4%"]
            answer: "64%"
          - id: l1-c2
            type: multiple_choice
            text: "Write 91% as a decimal."
            options: ["0.91", "9.1", "0.091"]
            answer: "0.91"
          - id: l1-c3
            type: true_false
            text: "25% = 25/100. Is that true?"
            answer: true

  - n: 2
    title: { de: "Drei Schreibweisen", en: "Three ways to write it" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What percentage of the hundred square is filled?"
            show: { drawn: hundred-field, filled: 33 }
            options: ["33%", "67%", "3.3%"]
            answer: "33%"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Write 12% as a decimal."
            options: ["0.12", "1.2", "12.0"]
            answer: "0.12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "75/100 = 0.75 = 75%"
            say: "The same amount can be written in three ways. Seventy-five of the hundred dots are filled. That is the fraction seventy-five hundredths, the decimal zero point seven five, and seventy-five per cent."
            show: { drawn: hundred-field, filled: 75 }
          - text: "The whole is 100%.\n100% − 75% = 25% is empty."
            say: "All the dots together are one hundred per cent. If seventy-five per cent are filled, the rest is one hundred minus seventy-five, so twenty-five per cent are empty."
          - text: "0.4 = 40 hundredths = 40%\n0.04 = 4 hundredths = 4%"
            say: "A decimal with one place has tenths. Zero point four is four tenths, which is forty hundredths, so it is forty per cent. Zero point zero four is only four hundredths, which is four per cent."
            show: { drawn: place-value-chart, columns: [ones, tenths, hundredths], values: [0, 4, 0] }
          - text: "Percentages around us:\na battery at 20%, 100% attendance"
            say: "You see percentages all around you. A phone battery at twenty per cent has twenty out of every hundred parts of its full charge left. One hundred per cent attendance means every child came to school every day."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Match each decimal to its percentage."
                pairs:
                  - { left: { text: "0.5" }, right: { text: "50%" } }
                  - { left: { text: "0.05" }, right: { text: "5%" } }
                  - { left: { text: "0.15" }, right: { text: "15%" } }
                  - { left: { text: "0.51" }, right: { text: "51%" } }
                hints:
                  - "Turn each decimal into hundredths."
                  - "0.5 is 50 hundredths, 0.05 is 5 hundredths."
                  - "0.5 = 50%, 0.05 = 5%, 0.15 = 15%, 0.51 = 51%."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "62% of the hundred square is filled. What percentage is not filled?"
                show: { drawn: hundred-field, filled: 62 }
                options: ["38%", "62%", "48%"]
                answer: "38%"
                feedback:
                  "62%": "62% is the filled part. The question asks for the part that is not filled."
                  "48%": "Check the subtraction: 100 − 62. 62 + 38 = 100."
                hints:
                  - "The whole square is 100%."
                  - "100% − 62%."
                  - "38%."
              - id: l2-f3
                type: multiple_choice
                text: "0.4 = _"
                options: ["40%", "4%", "0.4%"]
                answer: "40%"
                feedback:
                  "4%": "0.4 is 4 tenths. That is 40 hundredths, so 40%."
                hints:
                  - "The 4 is in the tenths place."
                  - "4 tenths are 40 hundredths."
                  - "40%."
              - id: l2-f4
                type: fill_in_blank
                text: "Write 0.83 in two other ways."
                frame: "0.83 = _ = _"
                options: ["83/100", "83%", "8.3%", "83/10"]
                answer: ["83/100", "83%"]
                hints:
                  - "0.83 is 83 hundredths."
                  - "As a fraction: over 100. As a percentage: out of 100."
                  - "83/100 = 83%."
              - id: l2-f5
                type: multiple_choice
                text: "A phone battery shows 20%. What does that mean?"
                options: ["20 out of 100 parts of the charge are left", "20 minutes are left", "the battery is full"]
                answer: "20 out of 100 parts of the charge are left"
                hints:
                  - "A full battery is 100%."
                  - "20% is 20 out of 100."
                  - "20 out of 100 parts of the charge are left."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "0.09 = _"
                options: ["9%", "90%", "0.9%"]
                answer: "9%"
                hints: ["0.09 is 9 hundredths."]
              - id: l2-s2
                type: multiple_choice
                text: "35% of the books in the class library are poetry. What percentage are not poetry?"
                options: ["65%", "35%", "75%"]
                answer: "65%"
                hints: ["100% − 35%."]
              - id: l2-s3
                type: true_false
                text: "0.7 = 70%. Is that true?"
                answer: true
                hints: ["7 tenths are 70 hundredths."]
              - id: l2-s4
                type: ordering
                text: "Put these in order, smallest first."
                options: ["0.3", "25%", "0.08", "61/100"]
                slot_count: 4
                answer: ["0.08", "25%", "0.3", "61/100"]
                hints: ["Write them all as percentages: 30%, 25%, 8%, 61%."]
              - id: l2-s5
                type: multiple_choice
                text: "In a survey of 100 children, 46 chose swimming. What percentage chose swimming?"
                options: ["46%", "54%", "4.6%"]
                answer: "46%"
                hints: ["46 out of 100."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is the same as 0.75?"
                options: ["75%", "7.5%", "0.75%"]
                answer: "75%"
              - id: l2-n2
                type: multiple_choice
                text: "Which is the largest?"
                options: ["0.6", "45%", "9/100"]
                answer: "0.6"
              - id: l2-n3
                type: text_input
                text: "A battery is at 100%. A game uses 28% of it. What percentage is left? Type the number."
                answer: "72"
              - id: l2-n4
                type: true_false
                text: "0.5 and 5% are the same. Is that true?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Every child in the class came to school on Monday. What was the attendance on Monday?"
                options: ["100%", "0%", "50%"]
                answer: "100%"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What percentage of the hundred square is filled?"
            show: { drawn: hundred-field, filled: 56 }
            options: ["56%", "44%", "5.6%"]
            answer: "56%"
          - id: l2-c2
            type: fill_in_blank
            text: "Write 19% as a fraction."
            frame: "19% = _"
            options: ["19/100", "19/10", "1/9"]
            answer: ["19/100"]
          - id: l2-c3
            type: multiple_choice
            text: "Write 4% as a decimal."
            options: ["0.04", "0.4", "4.0"]
            answer: "0.04"
          - id: l2-c4
            type: multiple_choice
            text: "A water tank is 70% full. What percentage is empty?"
            options: ["30%", "70%", "40%"]
            answer: "30%"
          - id: l2-c5
            type: multiple_choice
            text: "Which is the smallest?"
            options: ["0.2", "15%", "31/100"]
            answer: "15%"
