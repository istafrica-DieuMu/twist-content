# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.tessellations
skill: math.shapes.tessellations
curriculum: en-GB
language: en
title:
  de: Bandornamente und Parkette
  en: Frieze patterns and tessellations
summary: >
  Lesson 1 continues frieze patterns from their repeating unit, with
  shapes and with letters, and says whether the unit is slid along or
  reflected (b b b b, b d b d, b p b p); lesson 2 learns what a
  tessellation is (no gaps, no overlaps), finds which shapes tessellate
  on their own (squares, rectangles, triangles, hexagons) and which do not
  (circles, pentagons), counts the shapes that meet at a point, where the
  angles make a whole turn, and ends with the skill check. Inventing and
  drawing a frieze or tessellation waits for a drawing task.
metadata:
  year: year-5
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.patterns.repeating, math.shapes.more-shapes]
  also_practises: [math.patterns.repeating]
  vocabulary: { en: [frieze pattern, repeating unit, slide, translate, reflect, tessellation, tessellate, tile, gap, overlap, honeycomb] }
  forms: [text, audio, drawn]
  drawn: [shape, letter-card]
  facets: []
  parts:
    - { id: continue, what: { de: Bandornamente fortsetzen, en: continuing frieze patterns } }
    - { id: slide-reflect, what: { de: "beschreiben, ob das Grundmuster verschoben oder gespiegelt wird", en: saying whether the unit is slid along or reflected } }
    - { id: tile, what: { de: "Formen finden, die lückenlos aneinanderpassen", en: finding shapes that tessellate } }
    - { id: describe, what: { de: Parkette und ihre Ecken beschreiben, en: describing tessellations and the corners that meet at a point } }
  misconceptions:
    - id: copies-last-item
      what: Continues a frieze by repeating the last item or by alternating two items, without finding the whole repeating unit
      addressed: lesson 1 Learn names the unit circle, triangle, triangle; l1-f1 (with feedback), l1-f4, l1-n1, l1-c1 and l2-c1 have a unit of three or four, l1-f5 and l1-s4 ask for the unit itself
    - id: every-shape-tessellates
      what: Thinks any shape, circles and pentagons too, can cover a floor with no gaps
      addressed: lesson 2 Learn shows the gaps between circles; l2-f2 (with feedback), l2-f5, l2-s2, l2-s3, l2-n1 and l2-c3 ask about shapes that do not tessellate
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bandornamente fortsetzen", en: "Continuing frieze patterns" }
    goal:
      de: "Finde den Teil, der sich in einem Bandmuster wiederholt, setz das Muster fort und sag, ob er verschoben oder gespiegelt wird."
      en: "Find the part that repeats in a frieze pattern, carry the pattern on, and say whether it slides along or is reflected."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What comes next?"
            show: { drawn: shape, row: [square, triangle, square, triangle, "?"], colours: green }
            options: ["square", "triangle", "circle"]
            answer: "square"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is this shape called?"
            show: { drawn: shape, kind: hexagon, colour: yellow }
            options: ["hexagon", "pentagon", "octagon"]
            answer: "hexagon"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A border on a wall: what do you think comes next?"
            say: "Here is a border on a wall: circle, triangle, triangle, circle, triangle, triangle. What do you think comes next? Have a guess."
            show: { drawn: shape, row: [circle, triangle, triangle, circle, triangle, triangle, "?"], colours: orange }
          - text: "A frieze pattern: one unit repeats along a strip."
            say: "A frieze pattern is a strip, like a border on a wall, where the same unit repeats again and again. Here the repeating unit is circle, triangle, triangle. To continue the pattern, find the whole unit first, not just the last shape. A new unit starts next, with a circle."
            show: { drawn: shape, row: [circle, triangle, triangle, circle, triangle, triangle], colours: orange }
          - text: "b b b b\nThe b is slid along."
            say: "In this frieze the letter b is slid along the strip. It is not turned or flipped, just moved along. We say it is translated."
            show: { drawn: letter-card, text: "b b b b" }
          - text: "b d b d\nThe b is reflected."
            say: "Here every second b is reflected, as if there were a mirror line between the letters. A b reflected left to right becomes a d. Reflected top to bottom, a b becomes a p."
            show: { drawn: letter-card, text: "b d b d" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What comes next?"
                show: { drawn: shape, row: [square, circle, circle, square, circle, circle, "?"], colours: purple }
                options: ["square", "circle", "triangle"]
                answer: "square"
                feedback:
                  "circle": "That just copies the last shape. Find the repeating unit: square, circle, circle."
                hints:
                  - "Find the unit that repeats."
                  - "The unit is square, circle, circle. It has just finished."
                  - "Next is a square."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "What comes next?"
                show: { drawn: letter-card, text: "b d b d b ?" }
                frame: "b d b d b _"
                options: ["d", "b", "p"]
                answer: ["d"]
                hints:
                  - "The letters take turns."
                  - "After every b comes a d."
                  - "Next is d."
              - id: l1-f3
                type: true_false
                text: "In this pattern, the p is slid along. Is that true?"
                show: { drawn: letter-card, text: "p p p p" }
                answer: true
                hints:
                  - "Do the letters look different from each other?"
                  - "Every p looks exactly the same."
                  - "The p is slid along."
              - id: l1-f4
                type: multiple_choice
                text: "What comes next?"
                show: { drawn: shape, row: [triangle, square, square, triangle, square, square, triangle, "?"], colours: blue }
                options: ["square", "triangle", "circle"]
                answer: "square"
                hints:
                  - "Find the repeating unit."
                  - "It is triangle, square, square. A new unit has just started."
                  - "Next is a square."
              - id: l1-f5
                type: multiple_choice
                text: "How many shapes are in the repeating unit?"
                show: { drawn: shape, row: [circle, square, triangle, circle, square, triangle], colours: red }
                options: ["3", "6", "2"]
                answer: "3"
                feedback:
                  "6": "6 is all the shapes. Look for the part that repeats."
                hints:
                  - "Where does the pattern start again?"
                  - "After circle, square, triangle it starts again."
                  - "3 shapes."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "What comes next?"
                show: { drawn: letter-card, text: "d b d b d ?" }
                frame: "d b d b d _"
                options: ["b", "d", "q"]
                answer: ["b"]
                hints: ["After every d comes a b."]
              - id: l1-s2
                type: multiple_choice
                text: "How does the pattern repeat?"
                show: { drawn: letter-card, text: "p q p q" }
                options: ["The p is reflected.", "The p is slid along.", "The p is turned."]
                answer: "The p is reflected."
                hints: ["A p seen in a mirror at its side looks like a q."]
              - id: l1-s3
                type: multiple_choice
                text: "What colour comes next?"
                show: { drawn: shape, row: [circle, circle, circle, circle, circle, circle, circle, circle, "?"], colours: [blue, blue, yellow, blue, blue, yellow, blue, blue, null] }
                options: ["yellow", "blue", "green"]
                answer: "yellow"
                hints: ["The unit is blue, blue, yellow."]
              - id: l1-s4
                type: multiple_choice
                text: "What is the repeating unit?"
                show: { drawn: shape, row: [hexagon, circle, hexagon, circle, hexagon, circle], colours: green }
                options: ["hexagon, circle", "hexagon, circle, hexagon", "circle"]
                answer: "hexagon, circle"
                hints: ["Find the smallest part that repeats."]
              - id: l1-s5
                type: true_false
                text: "In this pattern, the q is reflected. Is that true?"
                show: { drawn: letter-card, text: "q q q q" }
                answer: false
                hints: ["Does any q look different?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "What comes next?"
                show: { drawn: shape, row: [pentagon, pentagon, circle, pentagon, pentagon, circle, "?"], colours: orange }
                options:
                  - { drawn: shape, kind: pentagon, colour: orange }
                  - { drawn: shape, kind: circle, colour: orange }
                  - { drawn: shape, kind: square, colour: orange }
                answer: pentagon
              - id: l1-n2
                type: fill_in_blank
                text: "What comes next?"
                show: { drawn: letter-card, text: "q p q p q ?" }
                frame: "q p q p q _"
                options: ["p", "q", "b"]
                answer: ["p"]
              - id: l1-n3
                type: multiple_choice
                text: "How does the pattern repeat?"
                show: { drawn: letter-card, text: "d b d b" }
                options: ["The d is reflected.", "The d is slid along.", "The d is turned."]
                answer: "The d is reflected."
              - id: l1-n4
                type: multiple_choice
                text: "What comes next?"
                show: { drawn: shape, row: [triangle, circle, square, triangle, circle, "?"], colours: red }
                options: ["square", "triangle", "circle"]
                answer: "square"
              - id: l1-n5
                type: true_false
                text: "In a frieze pattern, the repeating unit changes as you go along. Is that true?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What comes next?"
            show: { drawn: shape, row: [square, square, triangle, square, square, triangle, square, "?"], colours: green }
            options: ["square", "triangle", "circle"]
            answer: "square"
          - id: l1-c2
            type: multiple_choice
            text: "What comes next? b p b p b ?"
            show: { drawn: letter-card, text: "b p b p b ?" }
            options: ["p", "b", "d"]
            answer: "p"
          - id: l1-c3
            type: multiple_choice
            text: "What is a frieze pattern?"
            options: ["a strip where one unit repeats again and again", "a single picture on a strip", "a pattern with no rule"]
            answer: "a strip where one unit repeats again and again"
          - id: l1-c4
            type: multiple_choice
            text: "What comes next?"
            show: { drawn: shape, row: [circle, triangle, square, square, circle, triangle, square, square, "?"], colours: purple }
            options: ["circle", "square", "triangle"]
            answer: "circle"
          - id: l1-c5
            type: multiple_choice
            text: "How does the pattern repeat?"
            show: { drawn: letter-card, text: "q p q p" }
            options: ["The q is reflected.", "The q is slid along.", "The q is turned."]
            answer: "The q is reflected."
          - id: l1-c6
            type: multiple_choice
            text: "How many shapes are in the repeating unit?"
            show: { drawn: shape, row: [square, square, circle, circle, square, square, circle, circle], colours: green }
            options: ["4", "2", "8"]
            answer: "4"

  - n: 2
    title: { de: "Parkette", en: "Tessellations" }
    goal:
      de: "Finde heraus, welche Formen eine Fläche ohne Lücken und ohne Überlappen bedecken, so wie die Sechsecke einer Bienenwabe."
      en: "Find out which shapes cover a surface with no gaps and no overlaps, like the hexagons in a honeycomb."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What comes next? d q d q d ?"
            show: { drawn: letter-card, text: "d q d q d ?" }
            options: ["q", "d", "b"]
            answer: "q"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How does the pattern repeat?"
            show: { drawn: letter-card, text: "d d d d" }
            options: ["The d is slid along.", "The d is reflected."]
            answer: "The d is slid along."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Could you tile a floor with circles, with no gaps? What do you think?"
            say: "Could you cover a whole floor with round tiles, with no gaps between them? What do you think? Have a guess."
            show: { drawn: shape, kind: circle, colour: red }
          - text: "A tessellation: shapes cover a surface with no gaps and no overlaps."
            say: "When shapes fit together to cover a whole surface, with no gaps between them and none lying on top of another, they make a tessellation. Tiles on a bathroom wall are a tessellation of squares."
            show: { drawn: shape, kind: square, colour: blue }
          - text: "Squares, rectangles, triangles and hexagons tessellate on their own."
            say: "Some shapes tessellate on their own. Squares, rectangles, triangles and regular hexagons all do. Bees build their honeycomb from hexagons."
            show: { drawn: shape, kind: hexagon, colour: yellow }
          - text: "Circles and pentagons leave gaps.\nOctagons need small squares to fill the gaps."
            say: "So the answer is no: circles do not tessellate. However you push them together, there are gaps between them. Regular pentagons leave gaps too. Some shapes tessellate only with a second shape: octagons fit together with small squares in the gaps."
            show: { drawn: shape, kind: circle, colour: red }
          - text: "At each point the corners make a whole turn, 360°.\n4 squares, 3 hexagons or 6 triangles meet at a point."
            say: "Look at a point where tiles meet. Their corners fill a whole turn, three hundred and sixty degrees. Four squares meet at a point, because four right angles make a whole turn. Three hexagons meet at a point, and six equilateral triangles."
            show: { drawn: shape, kind: triangle, colour: green }
          - text: "Did you know? The artist M. C. Escher made tessellations of lizards, birds and fish."
            say: "Did you know? An artist from the Netherlands called M. C. Escher made tessellations out of animals. His lizards, birds and fish fit together with no gaps and no overlaps, like tiles!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Squares can cover a floor with no gaps and no overlaps. Is that true?"
                show: { drawn: shape, kind: square, colour: green }
                answer: true
                hints:
                  - "Think of tiles on a bathroom wall."
                  - "The squares fit edge to edge, four at every point."
                  - "Yes, squares tessellate."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which shape does not tessellate?"
                options:
                  - { drawn: shape, kind: circle, colour: orange }
                  - { drawn: shape, kind: square, colour: orange }
                  - { drawn: shape, kind: hexagon, colour: orange }
                answer: circle
                option_audio: false
                feedback:
                  square: "Squares fit together edge to edge with no gaps."
                  hexagon: "Hexagons fit together like a honeycomb."
                hints:
                  - "Imagine covering a table with each shape."
                  - "Which one leaves gaps however you push them together?"
                  - "The circle."
              - id: l2-f3
                type: multiple_choice
                text: "In a tiling of squares, how many squares meet at one point?"
                options: ["4", "3", "6"]
                answer: "4"
                hints:
                  - "Each square has a right angle at its corner."
                  - "Right angles must make a whole turn."
                  - "4 right angles make a whole turn, so 4 squares."
              - id: l2-f4
                type: multiple_choice
                text: "Bees build their honeycomb from one shape. Which?"
                options: ["hexagon", "pentagon", "circle"]
                answer: "hexagon"
                hints:
                  - "The shape tessellates on its own."
                  - "It has six sides."
                  - "A hexagon."
              - id: l2-f5
                type: multiple_choice
                text: "Why are circles no good for tiling a floor?"
                options: ["They leave gaps.", "They are too small.", "They have too many corners."]
                answer: "They leave gaps."
                hints:
                  - "Imagine coins pushed together on a table."
                  - "Between the curved edges, the table shows through."
                  - "They leave gaps."

          - support: some
            tasks:
              - id: l2-s2
                type: true_false
                text: "Regular pentagons tessellate on their own. Is that true?"
                answer: false
                hints: ["Three pentagon corners leave a gap, and four would overlap."]
              - id: l2-s1
                type: multiple_choice
                text: "In a honeycomb, how many hexagons meet at one point?"
                options: ["3", "4", "6"]
                answer: "3"
                hints: ["Three hexagon corners make a whole turn."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which shape tessellates on its own?"
                options:
                  - { drawn: shape, kind: triangle, colour: purple }
                  - { drawn: shape, kind: circle, colour: purple }
                  - { drawn: shape, kind: octagon, colour: purple }
                answer: triangle
                option_audio: false
                hints: ["Octagons need small squares to fill their gaps."]
              - id: l2-s4
                type: multiple_choice
                text: "In a tiling of equilateral triangles, how many triangles meet at one point?"
                options: ["6", "3", "4"]
                answer: "6"
                hints: ["Each corner of an equilateral triangle is 60°. How many 60° corners make 360°?"]
              - id: l2-s5
                type: true_false
                text: "In a tessellation, tiles may overlap. Is that true?"
                answer: false
                hints: ["A tessellation has no gaps and no overlaps."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Which shape tessellates on its own?"
                options:
                  - { drawn: shape, kind: rectangle, colour: blue }
                  - { drawn: shape, kind: circle, colour: blue }
                  - { drawn: shape, kind: pentagon, colour: blue }
                answer: rectangle
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "A tessellation covers a surface ..."
                options: ["with no gaps and no overlaps", "with small gaps", "with tiles on top of each other"]
                answer: "with no gaps and no overlaps"
              - id: l2-n3
                type: true_false
                text: "Regular hexagons tessellate. Is that true?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Octagons cover a floor together with a second shape. Which shape fills the gaps?"
                options: ["square", "circle", "pentagon"]
                answer: "square"
              - id: l2-n5
                type: multiple_choice
                text: "4 squares meet at a point. Each has a right angle there. How many degrees is that altogether?"
                options: ["360°", "180°", "90°"]
                answer: "360°"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: continue
            type: multiple_choice
            text: "What comes next?"
            show: { drawn: shape, row: [circle, square, square, square, circle, square, square, square, "?"], colours: blue }
            options: ["circle", "square", "triangle"]
            answer: "circle"
          - id: l2-c2
            part: continue
            type: multiple_choice
            text: "What comes next? p b p b p b ?"
            show: { drawn: letter-card, text: "p b p b p b ?" }
            options: ["p", "b", "d"]
            answer: "p"
          - id: l2-c3
            part: tile
            type: image_multiple_choice
            text: "Which shape leaves gaps when you try to tile with it?"
            options:
              - { drawn: shape, kind: triangle, colour: red }
              - { drawn: shape, kind: circle, colour: red }
              - { drawn: shape, kind: rectangle, colour: red }
            answer: circle
            option_audio: false
          - id: l2-c4
            part: tile
            type: true_false
            text: "Rectangles tessellate. Is that true?"
            answer: true
          - id: l2-c5
            part: describe
            type: multiple_choice
            text: "Why do squares tessellate?"
            options: ["Four right angles make a whole turn, so they fit round a point.", "They are small.", "They are all the same colour."]
            answer: "Four right angles make a whole turn, so they fit round a point."
          - id: l2-c6
            part: slide-reflect
            type: multiple_choice
            text: "How does the pattern repeat?"
            show: { drawn: letter-card, text: "q d q d" }
            options: ["The q is reflected.", "The q is slid along.", "The q is turned."]
            answer: "The q is reflected."
          - id: l2-c7
            part: slide-reflect
            type: true_false
            text: "In the pattern b p b p, every second b is reflected. Is that true?"
            show: { drawn: letter-card, text: "b p b p" }
            answer: true
          - id: l2-c8
            part: slide-reflect
            type: multiple_choice
            text: "How does the pattern repeat?"
            show: { drawn: letter-card, text: "L L L L" }
            options: ["The L is slid along.", "The L is reflected.", "The L is turned."]
            answer: "The L is slid along."
          - id: l2-c9
            part: slide-reflect
            type: multiple_choice
            text: "Which pattern shows the q slid along?"
            options: ["q q q q", "q p q p", "q d q d"]
            answer: "q q q q"
            option_audio: false
          - id: l2-c10
            part: slide-reflect
            type: multiple_choice
            text: "A b is reflected top to bottom. Which letter does it become?"
            options: ["p", "d", "q"]
            answer: "p"
            option_audio: false
          - id: l2-c11
            part: continue
            type: multiple_choice
            text: "What comes next?"
            show: { drawn: shape, row: [hexagon, triangle, triangle, hexagon, triangle, triangle, hexagon, triangle, "?"], colours: yellow }
            options: ["triangle", "hexagon", "square"]
            answer: "triangle"
          - id: l2-c12
            part: continue
            type: multiple_choice
            text: "What comes next? q d q d q ?"
            show: { drawn: letter-card, text: "q d q d q ?" }
            options: ["d", "q", "p"]
            answer: "d"
            option_audio: false
          - id: l2-c13
            part: continue
            type: multiple_choice
            text: "What colour comes next?"
            show: { drawn: shape, row: [square, square, square, square, square, square, square, square, "?"], colours: [red, green, green, green, red, green, green, green, null] }
            options: ["red", "green", "blue"]
            answer: "red"
          - id: l2-c14
            part: tile
            type: true_false
            text: "Regular octagons tessellate on their own. Is that true?"
            answer: false
          - id: l2-c15
            part: tile
            type: image_multiple_choice
            text: "Which shape tessellates on its own?"
            options:
              - { drawn: shape, kind: hexagon, colour: green }
              - { drawn: shape, kind: pentagon, colour: green }
              - { drawn: shape, kind: circle, colour: green }
            answer: hexagon
            option_audio: false
          - id: l2-c16
            part: tile
            type: multiple_choice
            text: "Which shapes all tessellate on their own?"
            options: ["squares, triangles and hexagons", "squares, circles and hexagons", "triangles, pentagons and squares"]
            answer: "squares, triangles and hexagons"
          - id: l2-c17
            part: describe
            type: multiple_choice
            text: "In a tiling of rectangles, how many rectangles meet at one point?"
            options: ["4", "2", "6"]
            answer: "4"
          - id: l2-c18
            part: describe
            type: multiple_choice
            text: "6 equilateral triangles meet at a point, and their corners make a whole turn. How big is each corner?"
            options: ["60°", "90°", "30°"]
            answer: "60°"
          - id: l2-c19
            part: describe
            type: true_false
            text: "Where tiles meet at a point, their corners make a whole turn. Is that true?"
            answer: true
          - id: l2-c20
            part: describe
            type: multiple_choice
            text: "Which of these is a tessellation?"
            options: ["floor tiles laid edge to edge", "coins scattered on a table", "plates stacked in a pile"]
            answer: "floor tiles laid edge to edge"
