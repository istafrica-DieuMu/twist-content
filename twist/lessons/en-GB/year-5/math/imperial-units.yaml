# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.imperial-units
skill: math.length.imperial
curriculum: en-GB
language: en
title:
  de: Imperiale Einheiten
  en: Imperial units
summary: >
  Imperial units still used in the UK and their rough metric equivalents:
  1 inch is about 2.5 cm, 1 foot about 30 cm, 1 kg about 2.2 pounds, 1 pint
  about 570 ml, and 5 miles about 8 km. Lesson 1 compares and converts
  inches, feet, pounds and pints; lesson 2 converts between miles and
  kilometres with a table built from 5 miles ≈ 8 km, uses it on road signs
  and journeys, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Längen, en: Length }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.notation, math.mass-capacity.calculate-mass]
  also_practises: [math.mass-capacity.calculate-mass]
  vocabulary: { en: [imperial, metric, inch, foot, feet, mile, pound, lb, pint, approximately, about, convert, kilometre] }
  forms: [drawn, picture, text, audio]
  drawn: [ruler, table]
  facets: []
  parts:
    - { id: inches-feet, what: { de: Zoll und Fuß ungefähr in Zentimeter umrechnen, en: changing inches and feet roughly into centimetres } }
    - { id: pounds-pints, what: { de: Pfund und Pint mit Kilogramm und Litern vergleichen und umrechnen, en: comparing and converting pounds with kilograms and pints with litres } }
    - { id: miles-km, what: { de: Meilen in Kilometer umrechnen, en: converting miles to kilometres } }
    - { id: km-miles, what: { de: Kilometer in Meilen umrechnen und Entfernungen vergleichen, en: converting kilometres to miles and comparing distances } }
  misconceptions:
    - id: same-size
      what: Treats an imperial unit as the same size as the metric one beside it (6 inches = 6 cm, 1 pound = 1 kg)
      addressed: lesson 1 Learn sets each unit next to its metric size; l1-f2 and l1-f3 have feedback, l1-s4, l1-c3 and l2-n5 compare them
    - id: adds-instead
      what: Adds the same amount to both sides of 5 miles ≈ 8 km instead of scaling (10 miles ≈ 13 km)
      addressed: lesson 2 Learn doubles and trebles the pair in a table; l2-f2 has feedback, l2-s2 offers the added amount
    - id: wrong-way
      what: Converts the wrong way, so the number of miles comes out bigger than the number of kilometres
      addressed: lesson 2 Learn says a mile is longer than a kilometre; l2-f1 asks it, l2-n2 and l2-n3 offer the wrong way round
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zoll, Fuß, Pfund und Pint", en: "Inches, feet, pounds and pints" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "2.5 km = _ m"
            options: ["2500 m", "250 m", "25 m"]
            answer: "2500 m"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "1.5 kg = _ g"
            options: ["1500 g", "150 g", "15 g"]
            answer: "1500 g"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Imperial units are older units still used in the UK.\nLength: inch, foot, mile\nMass: pound (lb)\nCapacity: pint"
            say: "Metric units like centimetres, kilograms and litres are used in maths and science. But in the UK you still see older units, called imperial units. People give their height in feet and inches, buy milk in pints, and road signs show miles."
          - text: "1 inch ≈ 2.5 cm\n1 foot = 12 inches ≈ 30 cm"
            say: "An inch is about two and a half centimetres, like the strip on the ruler. The sign with two wavy lines means is about. A foot is twelve inches, about thirty centimetres: about the length of a school ruler."
            show: { drawn: ruler, to: 10, length: 2.5, colour: blue }
          - text: "1 kg ≈ 2.2 pounds\n1 pound ≈ 450 g"
            say: "A bag of sugar weighs one kilogram. That is about two point two pounds. So one pound is a bit less than half a kilogram: about four hundred and fifty grams."
            show: { object: bag-of-sugar }
          - text: "1 pint ≈ 570 ml, a bit more than half a litre"
            say: "A pint is about five hundred and seventy millilitres. That is a bit more than half a litre. Two pints are a bit more than one litre."
            show: { object: measuring-jug }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "About how many centimetres is 1 inch?"
                options: ["about 2.5 cm", "about 25 cm", "about 1 cm"]
                answer: "about 2.5 cm"
                hints:
                  - "An inch is a small length, a bit longer than your thumbnail is wide."
                  - "It is more than 1 cm but much less than 25 cm."
                  - "1 inch is about 2.5 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A pencil is 6 inches long. About how long is it in centimetres?"
                options: ["about 15 cm", "about 6 cm", "about 60 cm"]
                answer: "about 15 cm"
                feedback:
                  "about 6 cm": "An inch is longer than a centimetre, about 2.5 cm. So 6 inches is about 6 × 2.5 cm."
                hints:
                  - "Each inch is about 2.5 cm."
                  - "6 × 2.5 is 6 × 2 and 6 halves."
                  - "12 + 3 = 15, so about 15 cm."
              - id: l1-f3
                type: multiple_choice
                text: "Which is heavier, 1 kg or 1 pound?"
                options: ["1 kg", "1 pound", "They are the same."]
                answer: "1 kg"
                keep_order: true
                feedback:
                  "1 pound": "1 kg is about 2.2 pounds, so a kilogram is more than twice as heavy as a pound."
                hints:
                  - "How many pounds make about 1 kg?"
                  - "1 kg is about 2.2 pounds."
                  - "So 1 kg is heavier."
              - id: l1-f4
                type: multiple_choice
                text: "Milk comes in a 2-pint bottle. About how much is that in litres?"
                show: { object: bottle }
                options: ["about 1.1 litres", "about 2 litres", "about 0.5 litres"]
                answer: "about 1.1 litres"
                hints:
                  - "1 pint is a bit more than half a litre."
                  - "2 pints are 2 lots of about 570 ml."
                  - "About 1140 ml, which is about 1.1 litres."
              - id: l1-f5
                type: matching
                text: "Match each imperial unit with its rough metric size."
                pairs:
                  - { left: { text: "1 inch" }, right: { text: "about 2.5 cm" } }
                  - { left: { text: "1 foot" }, right: { text: "about 30 cm" } }
                  - { left: { text: "1 pound" }, right: { text: "about 450 g" } }
                  - { left: { text: "1 pint" }, right: { text: "about 570 ml" } }
                hints:
                  - "Two are lengths, one is a mass and one is a capacity."
                  - "A foot is 12 inches. A pound is a bit less than half a kilogram."
                  - "inch 2.5 cm, foot 30 cm, pound 450 g, pint 570 ml."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "About how many pounds is 1 kg?"
                options: ["about 2.2 pounds", "about 10 pounds", "about 0.5 pounds"]
                answer: "about 2.2 pounds"
                hints: ["A pound is a bit less than half a kilogram."]
              - id: l1-s2
                type: text_input
                text: "A book is 10 inches tall. About how many centimetres is that?"
                answer: "25"
                hints: ["10 lots of 2.5 cm."]
              - id: l1-s3
                type: multiple_choice
                text: "Which of these is an imperial unit of capacity?"
                options: ["pint", "litre", "pound"]
                answer: "pint"
                hints: ["Capacity is how much a container holds. Litres are metric."]
              - id: l1-s4
                type: multiple_choice
                text: "A baby weighs 4 kg. About how many pounds is that?"
                options: ["about 9 pounds", "about 2 pounds", "about 4 pounds"]
                answer: "about 9 pounds"
                hints: ["Each kilogram is about 2.2 pounds."]
              - id: l1-s5
                type: true_false
                text: "Is it true? A pint is a bit more than half a litre."
                answer: true
                hints: ["Half a litre is 500 ml."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Grandad says he is 6 feet tall. About how tall is that in centimetres?"
                options: ["about 180 cm", "about 60 cm", "about 6 cm"]
                answer: "about 180 cm"
              - id: l1-n2
                type: text_input
                text: "A recipe needs 2 pounds of potatoes. A pound is about 450 g. About how many grams is that?"
                answer: "900"
              - id: l1-n3
                type: multiple_choice
                text: "A jug holds 4 pints. About how many litres is that?"
                show: { object: measuring-jug }
                options: ["about 2.3 litres", "about 4 litres", "about 8 litres"]
                answer: "about 2.3 litres"
              - id: l1-n4
                type: multiple_choice
                text: "A TV screen measures 40 inches across. About how many centimetres is that?"
                options: ["about 100 cm", "about 40 cm", "about 16 cm"]
                answer: "about 100 cm"
              - id: l1-n5
                type: true_false
                text: "Is it true? A 1-foot ruler is about 12 cm long."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "About how many centimetres is 4 inches?"
            options: ["about 10 cm", "about 4 cm", "about 40 cm"]
            answer: "about 10 cm"
          - id: l1-c2
            type: multiple_choice
            text: "About how many pounds is 2 kg?"
            options: ["about 4.4 pounds", "about 1 pound", "about 20 pounds"]
            answer: "about 4.4 pounds"
          - id: l1-c3
            type: multiple_choice
            text: "Which is more, 1 litre or 1 pint?"
            options: ["1 litre", "1 pint", "They are the same."]
            answer: "1 litre"
            keep_order: true
          - id: l1-c4
            type: text_input
            text: "A ruler is 12 inches long. About how many centimetres is that?"
            answer: "30"
          - id: l1-c5
            type: multiple_choice
            text: "A cat weighs 9 pounds. About how many kilograms is that?"
            options: ["about 4 kg", "about 9 kg", "about 20 kg"]
            answer: "about 4 kg"
          - id: l1-c6
            type: true_false
            text: "Is it true? 1 inch is longer than 1 cm."
            answer: true

  - n: 2
    title: { de: Meilen und Kilometer, en: Miles and kilometres }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "About how many centimetres is 1 foot?"
            options: ["about 30 cm", "about 12 cm", "about 100 cm"]
            answer: "about 30 cm"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is heavier, 3 pounds or 1 kg?"
            options: ["3 pounds", "1 kg", "They are the same."]
            answer: "3 pounds"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5 miles ≈ 8 km\n1 mile ≈ 1.6 km"
            say: "Road signs in the UK show distances in miles. Five miles is about eight kilometres. So one mile is about one point six kilometres: a mile is longer than a kilometre."
          - text: "10 miles ≈ 16 km\n15 miles ≈ 24 km"
            say: "Use the pair five miles and eight kilometres. Double both: ten miles is about sixteen kilometres. Three lots of both: fifteen miles is about twenty-four kilometres. Always multiply both numbers by the same amount."
            show: { drawn: table, rows: [["miles", "km"], ["5", "8"], ["10", "16"], ["15", "24"], ["20", "32"]] }
          - text: "40 km ≈ ? miles\n40 ÷ 8 = 5, and 5 × 5 = 25\n40 km ≈ 25 miles"
            say: "To go from kilometres to miles, find how many lots of eight kilometres there are. Forty is five lots of eight, so it is five lots of five miles: about twenty-five miles. The number of miles is always smaller than the number of kilometres."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is longer, 1 mile or 1 km?"
                options: ["1 mile", "1 km", "They are the same."]
                answer: "1 mile"
                keep_order: true
                hints:
                  - "5 miles is about 8 km."
                  - "It takes fewer miles than kilometres to go the same distance."
                  - "So a mile is longer than a kilometre."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "5 miles ≈ 8 km. About how many kilometres is 10 miles?"
                say: "Five miles is about eight kilometres. About how many kilometres is ten miles?"
                options: ["about 16 km", "about 13 km", "about 6 km"]
                answer: "about 16 km"
                feedback:
                  "about 13 km": "Adding 5 to both does not keep them equal. 10 miles is 2 lots of 5 miles, so it is 2 lots of 8 km."
                hints:
                  - "How many lots of 5 miles are in 10 miles?"
                  - "10 miles is 2 lots of 5 miles. Double the 8 km as well."
                  - "2 × 8 = 16, so about 16 km."
              - id: l2-f3
                type: fill_in_blank
                text: "Use the table to fill in the gaps."
                show: { drawn: table, rows: [["miles", "km"], ["5", "8"], ["15", "?"], ["?", "40"]] }
                frame: "15 miles ≈ _ km, _ miles ≈ 40 km"
                options: ["18", "20", "24", "25"]
                answer: ["24", "25"]
                hints:
                  - "15 miles is 3 lots of 5 miles. 40 km is how many lots of 8 km?"
                  - "3 × 8 for the first gap. 40 ÷ 8 = 5 lots for the second."
                  - "24 km, and 5 × 5 = 25 miles."
              - id: l2-f4
                type: text_input
                text: "About how many miles is 32 km?"
                answer: "20"
                hints:
                  - "How many lots of 8 km are in 32 km?"
                  - "32 ÷ 8 = 4. Each 8 km is about 5 miles."
                  - "4 × 5 = 20 miles."
              - id: l2-f5
                type: multiple_choice
                text: "A road sign says: London 30 miles. About how many kilometres is that?"
                options: ["about 48 km", "about 38 km", "about 19 km"]
                answer: "about 48 km"
                hints:
                  - "30 miles is how many lots of 5 miles?"
                  - "30 ÷ 5 = 6 lots. Each lot is about 8 km."
                  - "6 × 8 = 48, so about 48 km."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "About how many kilometres is 20 miles?"
                answer: "32"
                hints: ["20 miles is 4 lots of 5 miles."]
              - id: l2-s2
                type: multiple_choice
                text: "About how many miles is 16 km?"
                options: ["about 10 miles", "about 21 miles", "about 26 miles"]
                answer: "about 10 miles"
                hints: ["16 km is 2 lots of 8 km."]
              - id: l2-s3
                type: multiple_choice
                text: "About how many kilometres is 1 mile?"
                options: ["about 1.6 km", "about 0.6 km", "about 16 km"]
                answer: "about 1.6 km"
                hints: ["A mile is a bit longer than a kilometre and a half."]
              - id: l2-s4
                type: text_input
                text: "A cycle ride is 25 miles long. About how many kilometres is that?"
                answer: "40"
                hints: ["25 miles is 5 lots of 5 miles."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 80 km is about 50 miles."
                answer: true
                hints: ["80 km is 10 lots of 8 km."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A family drives 45 miles to the seaside. About how many kilometres is that?"
                answer: "72"
              - id: l2-n2
                type: multiple_choice
                text: "On holiday in France, a sign says: Paris 120 km. About how many miles is that?"
                options: ["about 75 miles", "about 192 miles", "about 115 miles"]
                answer: "about 75 miles"
              - id: l2-n3
                type: multiple_choice
                text: "Which is further, 30 km or 15 miles?"
                options: ["30 km", "15 miles", "They are the same."]
                answer: "30 km"
                keep_order: true
              - id: l2-n4
                type: text_input
                text: "A runner runs 5 miles every day for 4 days. About how many kilometres is that altogether?"
                answer: "32"
              - id: l2-n5
                type: multiple_choice
                text: "Zara walks 4 km. Leo walks 4 miles. Who walks further?"
                options: ["Zara", "Leo", "They walk the same distance."]
                answer: "Leo"
                keep_order: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: inches-feet
            type: multiple_choice
            text: "About how many centimetres is 8 inches?"
            options: ["about 20 cm", "about 8 cm", "about 32 cm"]
            answer: "about 20 cm"
          - id: l2-c2
            part: pounds-pints
            type: multiple_choice
            text: "A suitcase weighs 10 kg. About how many pounds is that?"
            show: { object: suitcase }
            options: ["about 22 pounds", "about 5 pounds", "about 10 pounds"]
            answer: "about 22 pounds"
          - id: l2-c3
            part: pounds-pints
            type: multiple_choice
            text: "About how many litres is 8 pints?"
            options: ["about 4.5 litres", "about 8 litres", "about 16 litres"]
            answer: "about 4.5 litres"
          - id: l2-c4
            part: miles-km
            type: text_input
            text: "About how many kilometres is 35 miles?"
            answer: "56"
          - id: l2-c5
            part: km-miles
            type: text_input
            text: "About how many miles is 64 km?"
            answer: "40"
          - id: l2-c6
            part: inches-feet
            type: text_input
            text: "A ribbon is 20 inches long. About how many centimetres is that?"
            answer: "50"
          - id: l2-c7
            part: inches-feet
            type: multiple_choice
            text: "About how many centimetres is 3 feet?"
            options: ["about 90 cm", "about 36 cm", "about 30 cm"]
            answer: "about 90 cm"
          - id: l2-c8
            part: inches-feet
            type: true_false
            text: "Is it true? 2 feet is about 60 cm."
            answer: true
          - id: l2-c9
            part: inches-feet
            type: multiple_choice
            text: "Which is longer, 10 inches or 10 cm?"
            options: ["10 inches", "10 cm", "They are the same."]
            answer: "10 inches"
            keep_order: true
          - id: l2-c10
            part: pounds-pints
            type: text_input
            text: "About how many pounds is 5 kg?"
            answer: "11"
          - id: l2-c11
            part: pounds-pints
            type: multiple_choice
            text: "Which is heavier, 2 pounds or 1 kg?"
            options: ["2 pounds", "1 kg", "They are the same."]
            answer: "1 kg"
            keep_order: true
          - id: l2-c12
            part: pounds-pints
            type: true_false
            text: "Is it true? 2 pints is less than 1 litre."
            answer: false
          - id: l2-c13
            part: miles-km
            type: multiple_choice
            text: "5 miles ≈ 8 km. About how many kilometres is 50 miles?"
            say: "Five miles is about eight kilometres. About how many kilometres is fifty miles?"
            options: ["about 80 km", "about 53 km", "about 31 km"]
            answer: "about 80 km"
          - id: l2-c14
            part: miles-km
            type: fill_in_blank
            text: "Use the table to fill in the gaps."
            show: { drawn: table, rows: [["miles", "km"], ["5", "8"], ["10", "?"], ["?", "48"]] }
            frame: "10 miles ≈ _ km, _ miles ≈ 48 km"
            options: ["13", "16", "30", "43"]
            answer: ["16", "30"]
          - id: l2-c15
            part: miles-km
            type: text_input
            text: "A train journey is 60 miles. About how many kilometres is that?"
            answer: "96"
          - id: l2-c16
            part: miles-km
            type: true_false
            text: "Is it true? 15 miles is about 20 km."
            answer: false
          - id: l2-c17
            part: km-miles
            type: multiple_choice
            text: "On holiday in Spain, a sign says: Madrid 24 km. About how many miles is that?"
            options: ["about 15 miles", "about 38 miles", "about 19 miles"]
            answer: "about 15 miles"
          - id: l2-c18
            part: km-miles
            type: text_input
            text: "About how many miles is 88 km?"
            answer: "55"
          - id: l2-c19
            part: km-miles
            type: multiple_choice
            text: "Which is further, 20 miles or 30 km?"
            options: ["20 miles", "30 km", "They are the same."]
            answer: "20 miles"
            keep_order: true
          - id: l2-c20
            part: km-miles
            type: true_false
            text: "Is it true? 48 km is about 30 miles."
            answer: true
