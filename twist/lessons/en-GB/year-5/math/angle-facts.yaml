# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.angle-facts
skill: math.angles.angle-facts
curriculum: en-GB
language: en
title:
  de: Winkel an der Geraden und am Punkt
  en: Angles on a line and at a point
summary: >
  Angles on a straight line make 180° (half a turn) and angles at a point
  make 360° (a whole turn), and both facts find a missing angle. Lesson 1
  works on straight lines and turns in multiples of 90°; lesson 2 works
  round a point, mixes both facts in pizza, clock and wheel problems, and
  ends with the skill check. Angles are given in the text; marking angles
  on a drawn diagram waits for a component that draws several angles at
  one point.
metadata:
  year: year-5
  topic: { de: Winkel, en: Angles }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.angles.measure-draw]
  also_practises: [math.angles.measure-draw]
  vocabulary: { en: [angle, degrees, straight line, at a point, half turn, whole turn, quarter turn, three-quarter turn, right angle, missing angle, reflex] }
  forms: [text, drawn, audio]
  drawn: [angle]
  facets: []
  misconceptions:
    - id: wrong-total
      what: Uses 360° for angles on a straight line, or 180° for angles at a point
      addressed: lesson 1 Learn and lesson 2 Learn give each total with its picture; l1-f1 and l2-f1 have feedback, l1-s3, l1-c1, l2-s1 and l2-c2 offer the wrong total
    - id: forgets-an-angle
      what: Takes only one known angle away when there are two or three
      addressed: lesson 2 Learn adds the known angles first; l1-f5, l2-f2, l2-f5, l2-s2 and l2-c5 have several known angles
    - id: turns-degrees
      what: Does not link quarter, half and three-quarter turns with 90°, 180° and 270°
      addressed: lesson 1 Learn lists the turns; l1-f3, l1-s2, l1-s5, l1-n2 and l2-c3 ask them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Winkel an der Geraden, en: Angles on a straight line }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Read the protractor. How big is the angle?"
            show: { drawn: angle, degrees: 70, protractor: true, label: false }
            options: ["70°", "110°", "80°"]
            answer: "70°"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "The small angle is 120°. How big is the reflex angle on the other side?"
            show: { drawn: angle, degrees: 240, label: "?" }
            options: ["240°", "60°", "300°"]
            answer: "240°"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Angles on a straight line add up to 180°.\n130° + 50° = 180°"
            say: "A straight line is half a turn: one hundred and eighty degrees. When a line meets a straight line, it splits the half turn into two angles. Together they always make one hundred and eighty degrees."
            show: { drawn: angle, degrees: 180 }
          - text: "One angle is 130°. The missing angle:\n180° − 130° = 50°"
            say: "To find a missing angle on a straight line, take the angle you know away from one hundred and eighty. One hundred and eighty take away one hundred and thirty is fifty degrees."
          - text: "quarter turn = 90°\nhalf turn = 180°\nthree-quarter turn = 270°\nwhole turn = 360°"
            say: "Turns go up in right angles. A quarter turn is ninety degrees, a half turn one hundred and eighty, a three-quarter turn two hundred and seventy, and a whole turn three hundred and sixty."
            show: { drawn: angle, degrees: 270 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Two angles sit on a straight line. One is 130°. How big is the other?"
                options: ["50°", "230°", "60°"]
                answer: "50°"
                feedback:
                  "230°": "That is 360° − 130°. Angles on a straight line make 180°, not 360°."
                hints:
                  - "What do angles on a straight line add up to?"
                  - "They make 180°. Take away the angle you know."
                  - "180° − 130° = 50°."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Two angles sit on a straight line. One is 75°. Find the other."
                frame: "75° + _° = 180°"
                options: ["105", "115", "285"]
                answer: ["105"]
                hints:
                  - "Count on from 75 to 180."
                  - "75 + 25 = 100, then 80 more to 180."
                  - "25 + 80 = 105."
              - id: l1-f3
                type: multiple_choice
                text: "How many degrees is a three-quarter turn?"
                options: ["270°", "180°", "300°"]
                answer: "270°"
                hints:
                  - "A quarter turn is a right angle."
                  - "Three quarter turns are three right angles."
                  - "3 × 90° = 270°."
              - id: l1-f4
                type: true_false
                text: "Is it true? Angles of 65° and 125° can sit together on a straight line."
                answer: false
                hints:
                  - "Add the two angles."
                  - "65° + 125° = 190°."
                  - "190° is not 180°, so they cannot."
              - id: l1-f5
                type: multiple_choice
                text: "Three angles sit on a straight line: 40°, 60° and a missing angle. How big is the missing angle?"
                options: ["80°", "140°", "260°"]
                answer: "80°"
                hints:
                  - "All three angles together make 180°."
                  - "Add the two you know: 40° + 60° = 100°."
                  - "180° − 100° = 80°."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Two angles sit on a straight line. One is 110°. How big is the other, in degrees?"
                answer: "70"
                hints: ["180 − 110."]
              - id: l1-s2
                type: multiple_choice
                text: "How many right angles make a half turn?"
                options: ["2", "3", "4"]
                answer: "2"
                hints: ["A half turn is 180°. A right angle is 90°."]
              - id: l1-s3
                type: multiple_choice
                text: "Two angles sit on a straight line. One is 35°. How big is the other?"
                options: ["145°", "155°", "325°"]
                answer: "145°"
                hints: ["Count on from 35 to 180."]
              - id: l1-s4
                type: true_false
                text: "Is it true? Two right angles side by side make a straight line."
                answer: true
                hints: ["90° + 90°."]
              - id: l1-s5
                type: multiple_choice
                text: "A quarter turn and then a half turn, the same way. How many degrees is that in all?"
                options: ["270°", "180°", "150°"]
                answer: "270°"
                hints: ["90° + 180°."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Two angles sit on a straight line. One is 48°. How big is the other, in degrees?"
                answer: "132"
              - id: l1-n2
                type: multiple_choice
                text: "A robot turns 180°, then 90° more the same way. How far has it turned in all?"
                options: ["270°", "90°", "360°"]
                answer: "270°"
              - id: l1-n3
                type: text_input
                text: "Three angles sit on a straight line: 25°, 90° and a missing angle. How big is the missing angle, in degrees?"
                answer: "65"
              - id: l1-n4
                type: multiple_choice
                text: "Which pair of angles makes a straight line?"
                options: ["72° and 108°", "72° and 118°", "72° and 288°"]
                answer: "72° and 108°"
              - id: l1-n5
                type: true_false
                text: "Is it true? A three-quarter turn is the same as three right angles."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Two angles sit on a straight line. One is 140°. How big is the other?"
            options: ["40°", "220°", "50°"]
            answer: "40°"
          - id: l1-c2
            type: text_input
            text: "How many degrees is a half turn?"
            answer: "180"
          - id: l1-c3
            type: multiple_choice
            text: "Two angles sit on a straight line. One is 95°. How big is the other?"
            options: ["85°", "95°", "265°"]
            answer: "85°"

  - n: 2
    title: { de: Winkel um einen Punkt, en: Angles at a point }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Two angles sit on a straight line. One is 120°. How big is the other?"
            options: ["60°", "240°", "80°"]
            answer: "60°"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "How many degrees is a whole turn?"
            answer: "360"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Angles at a point add up to 360°.\n100° + 120° + 140° = 360°"
            say: "When lines meet at a point, the angles all the way round make a whole turn: three hundred and sixty degrees. Here one hundred, one hundred and twenty and one hundred and forty make three hundred and sixty."
          - text: "Angles at a point: 150°, 90° and a missing angle.\n150° + 90° = 240°\n360° − 240° = 120°"
            say: "To find a missing angle at a point, add the angles you know first. One hundred and fifty and ninety make two hundred and forty. Then take that from three hundred and sixty: one hundred and twenty degrees."
          - text: "Two angles at a point: 110° and 250°."
            say: "With only two angles at a point, one of them is reflex. One hundred and ten and two hundred and fifty make three hundred and sixty."
            show: { drawn: angle, degrees: 250 }
          - text: "On a straight line: 180°.\nAll the way round a point: 360°."
            say: "So, before you work out a missing angle, ask: is it on a straight line, or all the way round a point? A straight line is one hundred and eighty degrees. All the way round a point is three hundred and sixty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Two angles meet at a point. One is 100°. How big is the other?"
                options: ["260°", "80°", "160°"]
                answer: "260°"
                feedback:
                  "80°": "80° would make a straight line with 100°. All the way round a point is 360°."
                hints:
                  - "Angles at a point make a whole turn."
                  - "A whole turn is 360°. Take away 100°."
                  - "360° − 100° = 260°."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Three angles meet at a point: 150°, 90° and a missing angle. Find it."
                frame: "360° − 150° − 90° = _°"
                options: ["30", "120", "210"]
                answer: ["120"]
                hints:
                  - "Take away both angles you know."
                  - "150° + 90° = 240°."
                  - "360° − 240° = 120°."
              - id: l2-f3
                type: multiple_choice
                text: "Four angles meet at a point. Three of them are right angles. How big is the fourth?"
                options: ["90°", "180°", "270°"]
                answer: "90°"
                hints:
                  - "Three right angles are 270°."
                  - "The four angles make 360°."
                  - "360° − 270° = 90°."
              - id: l2-f4
                type: multiple_choice
                text: "Which three angles can meet at a point?"
                options: ["100°, 110°, 150°", "100°, 110°, 130°", "90°, 90°, 90°"]
                answer: "100°, 110°, 150°"
                hints:
                  - "Angles at a point must make 360°."
                  - "Add each set: 100 + 110 = 210, then add the third angle."
                  - "210 + 150 = 360."
              - id: l2-f5
                type: text_input
                text: "Four angles meet at a point: 80°, 100°, 70° and a missing angle. How big is the missing angle, in degrees?"
                answer: "110"
                hints:
                  - "Add the three angles you know."
                  - "80 + 100 + 70 = 250."
                  - "360 − 250 = 110."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Two angles meet at a point. One is 75°. How big is the other?"
                options: ["285°", "105°", "295°"]
                answer: "285°"
                hints: ["All the way round is 360°."]
              - id: l2-s2
                type: text_input
                text: "Three angles meet at a point: 130°, 130° and a missing angle. How big is the missing angle, in degrees?"
                answer: "100"
                hints: ["130 + 130 = 260."]
              - id: l2-s3
                type: multiple_choice
                text: "Three equal angles meet at a point. How big is each one?"
                options: ["120°", "60°", "90°"]
                answer: "120°"
                hints: ["Share 360° into three equal parts."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Angles of 200°, 100° and 50° can meet at a point."
                answer: false
                hints: ["Add them and compare with 360°."]
              - id: l2-s5
                type: multiple_choice
                text: "Two equal angles sit on a straight line. How big is each one?"
                options: ["90°", "180°", "45°"]
                answer: "90°"
                hints: ["Share 180° into two equal parts."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A pizza is cut from the centre into 4 slices. Three slices have angles of 90°, 100° and 80°. What is the angle of the last slice?"
                options: ["90°", "10°", "180°"]
                answer: "90°"
              - id: l2-n2
                type: text_input
                text: "A cake is cut from the centre into 3 slices. Two slices have angles of 140° and 110°. What is the angle of the third slice, in degrees?"
                answer: "110"
              - id: l2-n3
                type: text_input
                text: "A ladder stands on flat ground and makes an angle of 70° with the ground on one side. What angle does it make with the ground on the other side, in degrees?"
                answer: "110"
              - id: l2-n4
                type: multiple_choice
                text: "The hands of a clock make a small angle of 120°. What is the reflex angle between them?"
                options: ["240°", "60°", "120°"]
                answer: "240°"
              - id: l2-n5
                type: true_false
                text: "A wheel has 6 spokes with equal angles between them. Is it true that each angle is 60°?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Two angles sit on a straight line. One is 57°. How big is the other, in degrees?"
            answer: "123"
          - id: l2-c2
            type: multiple_choice
            text: "Three angles meet at a point: 90°, 160° and a missing angle. How big is the missing angle?"
            options: ["110°", "70°", "20°"]
            answer: "110°"
          - id: l2-c3
            type: multiple_choice
            text: "A three-quarter turn and then a quarter turn, the same way. How many degrees is that in all?"
            options: ["360°", "270°", "180°"]
            answer: "360°"
          - id: l2-c4
            type: multiple_choice
            text: "Which pair of angles makes a straight line?"
            options: ["45° and 135°", "45° and 145°", "45° and 315°"]
            answer: "45° and 135°"
          - id: l2-c5
            type: text_input
            text: "Four angles meet at a point: 95°, 85°, 90° and a missing angle. How big is the missing angle, in degrees?"
            answer: "90"
