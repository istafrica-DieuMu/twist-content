# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.nets
skill: math.solids.nets
curriculum: en-GB
language: en
title:
  de: Würfelnetze
  en: Nets of a cube
summary: >
  Lesson 1 shows that a net of a cube is six squares that fold into a
  cube, tells nets from shapes that do not fold (a 2 by 3 rectangle, five
  or more in a line, four in a block, two flaps that fold onto the same
  face) and finds where the sixth square must go. Lesson 2 finds which
  faces are opposite each other when the net is folded (in a line of
  three, the first and the third), uses the rule that opposite faces of a
  dice add up to 7, and ends with the skill check. Folding a net with a
  finger waits for a 3D folding view.
metadata:
  year: year-5
  topic: { de: Körper, en: 3D shapes }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.solids.more-solids]
  also_practises: [math.solids.cube-cuboid-sphere]
  vocabulary: { en: [net, cube, face, edge, square, fold, opposite, flap, dice] }
  forms: [drawn, text, audio]
  drawn: [shape, grid]
  facets: []
  misconceptions:
    - id: any-six-squares
      what: Thinks any six squares that touch make a net of a cube (a 2 by 3 rectangle, six in a line, a block of four)
      addressed: lesson 1 Learn shows the 2 by 3 rectangle and gives the warning signs; l1-f3 has feedback on two non-nets, l1-f4, l1-s3 and l1-n3 ask why a shape does not fold, l1-s2, l1-n2, l1-c2 and l2-c2 show non-nets
    - id: neighbour-is-opposite
      what: Takes a square next to a face in the net, or two squares further along, as the opposite face
      addressed: lesson 2 Learn says opposite faces have exactly one square between them in a line; l2-f1 and l2-f2 have feedback on the neighbour and on two further, l2-s1, l2-n1 and l2-c3 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was ist ein Würfelnetz?", en: "What is a net of a cube?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many faces does a cube have?"
            show: { drawn: shape, kind: cube, colour: orange }
            options: ["6", "8", "12"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What shape is each face of a cube?"
            options: ["a square", "a rectangle with long and short sides", "a triangle"]
            answer: "a square"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A cube has 6 square faces, all the same size."
            say: "A cube has six faces. Each one is a square, and they are all the same size. If you cut a cube-shaped box along some of its edges and open it out flat, you get a net."
            show: { drawn: shape, kind: cube, colour: yellow }
          - text: "A net of a cube"
            say: "This is a net of a cube. The square where the line across meets the line going down becomes the base. Fold the four squares that touch it up to make the sides. The last square at the bottom folds over as the lid."
            show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, yellow], [0, 1, yellow], [1, 1, yellow], [2, 1, yellow], [1, 2, yellow], [1, 3, yellow]] }
          - text: "Not a net of a cube"
            say: "This rectangle has six squares too. But when you fold it, some faces land on top of each other and one side stays open. It is not a net of a cube."
            show: { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue]] }
          - text: "Warning signs:\nfour squares in a block\nfive or more in a line\ntwo flaps that fold onto the same face"
            say: "Look for warning signs. Four squares in a two by two block: not a net. Five or more squares in a line: not a net. Two flaps on the same side of a line of four, at its two ends, fold onto the same face: not a net."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many squares does a net of a cube have?"
                options: ["6", "4", "8"]
                answer: "6"
                hints:
                  - "Each square in the net becomes one face of the cube."
                  - "Think of a dice: each face has a different number, from 1 to 6."
                  - "6 squares."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Does this net fold into a cube?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [1, 2, green], [1, 3, green]] }
                answer: true
                hints:
                  - "Use the middle square of the line across as the base."
                  - "Left, right, top and bottom fold up as the sides. The last square is the lid."
                  - "Yes, it is a net of a cube."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which is a net of a cube?"
                options:
                  - { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, orange], [1, 0, orange], [2, 0, orange], [0, 1, orange], [1, 1, orange], [2, 1, orange]], key: rectangle }
                  - { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, orange], [1, 0, orange], [2, 0, orange], [3, 0, orange], [4, 0, orange], [5, 0, orange]], key: line }
                  - { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, orange], [0, 1, orange], [1, 1, orange], [2, 1, orange], [1, 2, orange], [1, 3, orange]], key: net }
                answer: net
                feedback:
                  rectangle: "This has four squares in a block. Some faces would land on top of each other."
                  line: "Six in a line: after four squares the ring is closed and the other two overlap. There is no base or lid."
                hints:
                  - "Check each shape for the warning signs."
                  - "The rectangle has a block of four. The long line has six in a line."
                  - "It is the cross shape."
              - id: l1-f4
                type: multiple_choice
                text: "Why does this not fold into a cube?"
                show: { drawn: grid, cols: 5, rows: 2, cells: [[1, 0, purple], [0, 1, purple], [1, 1, purple], [2, 1, purple], [3, 1, purple], [4, 1, purple]] }
                options: ["It has 5 squares in a line.", "It has too few squares.", "The squares are too small."]
                answer: "It has 5 squares in a line."
                feedback:
                  "It has too few squares.": "Count them: there are 6 squares. Look at how they are arranged."
                hints:
                  - "Count the squares first, then look at the long line."
                  - "Four squares in a line close up into a ring. Where does the fifth go?"
                  - "It has 5 squares in a line."
              - id: l1-f5
                type: true_false
                text: "Does this net fold into a cube?"
                show: { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red], [3, 2, red]] }
                answer: true
                hints:
                  - "Look for a line of four. Where are the other two squares?"
                  - "One flap is above the line and one is below it, so they fold to opposite ends."
                  - "Yes. One becomes the lid and one the base."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Does this net fold into a cube?"
                show: { drawn: grid, cols: 4, rows: 3, cells: [[1, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [1, 2, blue]] }
                answer: true
                hints: ["A line of four with one flap above and one below."]
              - id: l1-s2
                type: true_false
                text: "Does this net fold into a cube?"
                show: { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [3, 1, green]] }
                answer: false
                hints: ["Look for four squares in a block."]
              - id: l1-s3
                type: multiple_choice
                text: "Why does this not fold into a cube?"
                show: { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, orange], [3, 0, orange], [0, 1, orange], [1, 1, orange], [2, 1, orange], [3, 1, orange]] }
                options: ["Both flaps fold onto the same face.", "It has 5 squares in a line.", "It has too many squares."]
                answer: "Both flaps fold onto the same face."
                hints: ["Both flaps are above the line of four. Where does each one fold to?"]
              - id: l1-s4
                type: multiple_choice
                text: "The sixth square is missing. Where must it go to make a net of a cube?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, yellow], [0, 1, yellow], [1, 1, yellow], [2, 1, yellow], [1, 2, yellow]], labels: [[1, 3, A], [0, 0, B], [2, 2, C]] }
                options: ["A", "B", "C"]
                answer: "A"
                option_audio: false
                hints: ["B and C would each make a block of four."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which is a net of a cube?"
                options:
                  - { drawn: grid, cols: 5, rows: 2, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [2, 1, red], [3, 1, red], [4, 1, red]], key: steps }
                  - { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [0, 1, red], [1, 1, red], [2, 1, red]], key: rectangle }
                  - { drawn: grid, cols: 5, rows: 2, cells: [[0, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red], [4, 1, red]], key: five }
                answer: steps
                hints: ["Two of them show a warning sign."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Does this net fold into a cube?"
                show: { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, purple], [1, 0, purple], [1, 1, purple], [2, 1, purple], [2, 2, purple], [3, 2, purple]] }
                answer: true
              - id: l1-n2
                type: true_false
                text: "Does this net fold into a cube?"
                show: { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [5, 0, blue]] }
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Why does this not fold into a cube?"
                show: { drawn: grid, cols: 3, rows: 3, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [1, 2, green]] }
                options: ["Four squares are in a block.", "It has 5 squares in a line.", "It has too few squares."]
                answer: "Four squares are in a block."
              - id: l1-n4
                type: multiple_choice
                text: "The sixth square is missing. Where must it go to make a net of a cube?"
                show: { drawn: grid, cols: 4, rows: 3, cells: [[0, 1, orange], [1, 1, orange], [2, 1, orange], [3, 1, orange], [0, 0, orange]], labels: [[1, 0, A], [3, 0, B], [2, 2, C]] }
                options: ["A", "B", "C"]
                answer: "C"
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "A net of a cube is folded up. How many edges does the cube have?"
                options: ["12", "6", "8"]
                answer: "12"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: true_false
            text: "Does this net fold into a cube?"
            show: { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, yellow], [0, 1, yellow], [1, 1, yellow], [2, 1, yellow], [3, 1, yellow], [0, 2, yellow]] }
            answer: true
          - id: l1-c2
            type: true_false
            text: "Does this net fold into a cube?"
            show: { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [0, 1, red], [1, 1, red], [2, 1, red]] }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "How many squares does a net of a cube have?"
            options: ["6", "5", "8"]
            answer: "6"

  - n: 2
    title: { de: "Was liegt gegenüber?", en: "Which faces are opposite?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Does this net fold into a cube?"
            show: { drawn: grid, cols: 4, rows: 3, cells: [[1, 0, yellow], [0, 1, yellow], [1, 1, yellow], [2, 1, yellow], [3, 1, yellow], [2, 2, yellow]] }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Why does this not fold into a cube?"
            show: { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [0, 1, red], [1, 1, red], [2, 1, red]] }
            options: ["Four squares are in a block.", "It has too few squares."]
            answer: "Four squares are in a block."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "B and D are opposite."
            say: "When you fold this net, which faces end up opposite each other? Look at the line B, C, D. There is exactly one square between B and D, so they are opposite on the cube. In the same way A and E are opposite, and C and F."
            show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, yellow], [0, 1, yellow], [1, 1, yellow], [2, 1, yellow], [1, 2, yellow], [1, 3, yellow]], labels: [[1, 0, A], [0, 1, B], [1, 1, C], [2, 1, D], [1, 2, E], [1, 3, F]] }
          - text: "Squares next to each other are never opposite."
            say: "Two squares that touch along an edge in the net also touch on the cube. So they can never be opposite."
          - text: "On a dice, opposite faces add up to 7."
            say: "On a normal dice, the spots on opposite faces always add up to seven: one and six, two and five, three and four."
            show: { drawn: shape, kind: cube, colour: white }
          - text: "What is opposite the 2?"
            say: "In this net there is one square between the two and the five, so they are opposite. Two add five is seven, which is right for a dice."
            show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, white], [0, 1, white], [1, 1, white], [2, 1, white], [1, 2, white], [1, 3, white]], labels: [[1, 0, "3"], [0, 1, "2"], [1, 1, "1"], [2, 1, "5"], [1, 2, "4"], [1, 3, "6"]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The net is folded into a cube. Which face is opposite B?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [1, 2, green], [1, 3, green]], labels: [[1, 0, A], [0, 1, B], [1, 1, C], [2, 1, D], [1, 2, E], [1, 3, F]] }
                options: ["D", "C", "A"]
                answer: "D"
                option_audio: false
                feedback:
                  "C": "C is next to B. On the cube they meet at an edge."
                hints:
                  - "Find the line that B is in."
                  - "In the line B, C, D, which square has exactly one square between it and B?"
                  - "D."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The net is folded into a cube. Which face is opposite A?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [1, 2, green], [1, 3, green]], labels: [[1, 0, A], [0, 1, B], [1, 1, C], [2, 1, D], [1, 2, E], [1, 3, F]] }
                options: ["E", "F", "C"]
                answer: "E"
                option_audio: false
                feedback:
                  "F": "There are two squares between A and F. Opposite faces have exactly one between them."
                  "C": "C is next to A. They meet at an edge."
                hints:
                  - "A is in the line going down: A, C, E, F."
                  - "Move one square on from A, then one more."
                  - "E."
              - id: l2-f3
                type: multiple_choice
                text: "On a dice, which number is opposite 2?"
                options: ["5", "4", "6"]
                answer: "5"
                hints:
                  - "Opposite faces of a dice add up to the same number every time."
                  - "They add up to 7."
                  - "2 + 5 = 7, so 5."
              - id: l2-f4
                type: true_false
                text: "This is a dice net. Are 3 and 4 opposite when it is folded?"
                show: { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, white], [0, 1, white], [1, 1, white], [2, 1, white], [3, 1, white], [3, 2, white]], labels: [[0, 0, "1"], [0, 1, "2"], [1, 1, "3"], [2, 1, "5"], [3, 1, "4"], [3, 2, "6"]] }
                answer: true
                hints:
                  - "Look at the line of four: 2, 3, 5, 4."
                  - "Opposite faces have exactly one square between them. What is between 3 and 4?"
                  - "Yes. The 5 is between them, so 3 and 4 are opposite, and 3 + 4 = 7."
              - id: l2-f5
                type: multiple_choice
                text: "On a dice, opposite faces add up to 7. Which number is missing on the face opposite 6?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, white], [0, 1, white], [1, 1, white], [2, 1, white], [1, 2, white], [1, 3, white]], labels: [[1, 0, "6"], [0, 1, "2"], [1, 1, "3"], [2, 1, "5"], [1, 2, "?"], [1, 3, "4"]] }
                options: ["1", "4", "6"]
                answer: "1"
                option_audio: false
                hints:
                  - "Which square is opposite the 6?"
                  - "6 is at the top of the line going down. The square one further on, with the ?, is opposite."
                  - "6 + 1 = 7, so 1."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The net is folded into a cube. Which face is opposite C?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [1, 2, blue], [1, 3, blue]], labels: [[1, 0, A], [0, 1, B], [1, 1, C], [2, 1, D], [1, 2, E], [1, 3, F]] }
                options: ["F", "E", "D"]
                answer: "F"
                option_audio: false
                hints: ["Look down the line C, E, F."]
              - id: l2-s2
                type: multiple_choice
                text: "On a dice, which number is opposite 3?"
                options: ["4", "6", "1"]
                answer: "4"
                hints: ["Opposite faces add up to 7."]
              - id: l2-s3
                type: multiple_choice
                text: "The net is folded into a cube. Which face is opposite A?"
                show: { drawn: grid, cols: 5, rows: 2, cells: [[0, 0, purple], [1, 0, purple], [2, 0, purple], [2, 1, purple], [3, 1, purple], [4, 1, purple]], labels: [[0, 0, A], [1, 0, B], [2, 0, C], [2, 1, D], [3, 1, E], [4, 1, F]] }
                options: ["C", "B", "D"]
                answer: "C"
                option_audio: false
                hints: ["A, B, C is a line of three."]
              - id: l2-s4
                type: true_false
                text: "Two squares that touch in a net can be opposite faces of the cube."
                answer: false
                hints: ["Squares that touch in the net share an edge on the cube."]
              - id: l2-s5
                type: multiple_choice
                text: "On a dice, opposite faces add up to 7. Which number goes on the ? face?"
                show: { drawn: grid, cols: 4, rows: 3, cells: [[1, 0, white], [0, 1, white], [1, 1, white], [2, 1, white], [3, 1, white], [1, 2, white]], labels: [[1, 0, "1"], [0, 1, "2"], [1, 1, "3"], [2, 1, "?"], [3, 1, "4"], [1, 2, "6"]] }
                options: ["5", "4", "6"]
                answer: "5"
                option_audio: false
                hints: ["The ? is opposite the 2."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The net is folded into a cube. Which face is opposite D?"
                show: { drawn: grid, cols: 5, rows: 2, cells: [[0, 0, orange], [1, 0, orange], [2, 0, orange], [2, 1, orange], [3, 1, orange], [4, 1, orange]], labels: [[0, 0, A], [1, 0, B], [2, 0, C], [2, 1, D], [3, 1, E], [4, 1, F]] }
                options: ["F", "E", "C"]
                answer: "F"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "On a dice, which number is opposite 1?"
                options: ["6", "2", "5"]
                answer: "6"
              - id: l2-n3
                type: true_false
                text: "This is a dice net. Are 1 and 6 opposite when it is folded?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, white], [0, 1, white], [1, 1, white], [2, 1, white], [1, 2, white], [1, 3, white]], labels: [[1, 0, "1"], [0, 1, "3"], [1, 1, "2"], [2, 1, "4"], [1, 2, "6"], [1, 3, "5"]] }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Is this a proper dice net? Opposite faces must add up to 7."
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, white], [0, 1, white], [1, 1, white], [2, 1, white], [1, 2, white], [1, 3, white]], labels: [[1, 0, "1"], [0, 1, "2"], [1, 1, "3"], [2, 1, "4"], [1, 2, "6"], [1, 3, "5"]] }
                options: ["No, 2 and 4 are opposite.", "Yes, all opposite faces add up to 7.", "No, 1 and 6 are opposite."]
                answer: "No, 2 and 4 are opposite."
              - id: l2-n5
                type: multiple_choice
                text: "The net is folded into a cube. Which face is opposite E?"
                show: { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red], [3, 2, red]], labels: [[0, 0, A], [0, 1, B], [1, 1, C], [2, 1, D], [3, 1, E], [3, 2, F]] }
                options: ["C", "D", "F"]
                answer: "C"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: true_false
            text: "Does this net fold into a cube?"
            show: { drawn: grid, cols: 5, rows: 2, cells: [[0, 1, green], [1, 1, green], [2, 1, green], [2, 0, green], [3, 0, green], [4, 0, green]] }
            answer: true
          - id: l2-c2
            type: true_false
            text: "Does this net fold into a cube?"
            show: { drawn: grid, cols: 5, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [3, 0, blue], [4, 0, blue], [2, 1, blue]] }
            answer: false
          - id: l2-c3
            type: multiple_choice
            text: "The net is folded into a cube. Which face is opposite B?"
            show: { drawn: grid, cols: 4, rows: 3, cells: [[1, 0, orange], [0, 1, orange], [1, 1, orange], [2, 1, orange], [3, 1, orange], [1, 2, orange]], labels: [[1, 0, A], [0, 1, B], [1, 1, C], [2, 1, D], [3, 1, E], [1, 2, F]] }
            options: ["D", "C", "E"]
            answer: "D"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "On a dice, which number is opposite 4?"
            options: ["3", "2", "5"]
            answer: "3"
          - id: l2-c5
