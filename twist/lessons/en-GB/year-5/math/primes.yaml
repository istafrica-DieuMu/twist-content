# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.primes
skill: math.mult-div-larger.primes
curriculum: en-GB
language: en
title:
  de: Primzahlen
  en: Prime numbers
summary: >
  Prime numbers have exactly two factors, 1 and themselves; composite
  numbers have more. Lesson 1 sorts primes from composite numbers and
  learns the primes up to 19 by heart (1 is not prime, 2 is the only even
  prime); lesson 2 tests whether a number up to 100 is prime by dividing by
  2, 3, 5 and 7, breaks numbers into prime factors with a factor tree, and
  ends with the skill check.
metadata:
  year: year-5
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.multiples-divisors]
  also_practises: [math.mult-div-larger.multiples-divisors]
  vocabulary: { en: [prime number, composite number, factor, multiple, prime factor, factor tree, product, divisible, even, odd] }
  forms: [drawn, text, audio]
  drawn: [hundred-square]
  facets: [operation-signs]
  misconceptions:
    - id: odd-is-prime
      what: Thinks every odd number is prime (9, 15, 21, 51)
      addressed: lesson 1 Learn shows 9 and 15 as products; l1-f1 and l2-f1 have feedback, l1-s5, l1-n4 and l2-c3 ask it
    - id: one-is-prime
      what: Counts 1 as a prime number
      addressed: lesson 1 Learn says 1 has only one factor; l1-f3 asks it, l2-c2 offers a list with 1
    - id: two-not-prime
      what: Thinks no even number can be prime, so leaves out 2
      addressed: lesson 1 Learn names 2 as the only even prime; l1-f5, l1-s3 and l2-c5 ask it
    - id: factors-not-prime
      what: Stops a factor tree at a composite factor (18 = 2 × 9)
      addressed: lesson 2 Learn splits until every factor is prime; l2-f4, l2-n2 offer unfinished products, l2-f3, l2-s3 and l2-c4 finish them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Primzahl oder nicht, en: Prime or composite }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which number is a factor of 12?"
            options: ["4", "5", "7"]
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many factors does 6 have?"
            options: ["4", "3", "2"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 = 1 × 7\n7 has exactly two factors: 1 and 7.\n7 is a prime number."
            say: "A prime number has exactly two factors: one and itself. The only way to make seven by multiplying whole numbers is one times seven. So seven is a prime number."
          - text: "9 = 1 × 9 = 3 × 3\n15 = 1 × 15 = 3 × 5\n9 and 15 are composite numbers."
            say: "A number with more than two factors is called a composite number. Nine is odd, but three times three is nine, so nine is composite. Fifteen is three times five, so it is composite too."
          - text: "1 has only one factor, so 1 is not prime.\n2 is the only even prime."
            say: "One has only one factor, itself, so one is not a prime number. Two is prime: its factors are one and two. Every other even number has two as a factor, so two is the only even prime."
          - text: "The primes up to 19:\n2, 3, 5, 7, 11, 13, 17, 19"
            say: "Learn the prime numbers up to nineteen by heart: two, three, five, seven, eleven, thirteen, seventeen and nineteen."
            show: { drawn: hundred-square, highlight: [2, 3, 5, 7, 11, 13, 17, 19] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which number is prime?"
                options: ["7", "9", "15"]
                answer: "7"
                feedback:
                  "9": "9 is odd, but 9 = 3 × 3. It has the factor 3, so it is not prime."
                hints:
                  - "A prime number can only be made as 1 × itself."
                  - "Try 3 × 3 and 3 × 5."
                  - "Only 7 has just the factors 1 and 7."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many factors does a prime number have?"
                options: ["exactly 1", "exactly 2", "more than 2"]
                answer: "exactly 2"
                keep_order: true
                hints:
                  - "Think of a prime number you know, like 5."
                  - "5 = 1 × 5. Which numbers are its factors?"
                  - "1 and 5: exactly 2 factors."
              - id: l1-f3
                type: true_false
                text: "Is it true? 1 is a prime number."
                answer: false
                hints:
                  - "How many factors does 1 have?"
                  - "The only factor of 1 is 1."
                  - "A prime needs exactly two factors, so 1 is not prime."
              - id: l1-f4
                type: sorting
                text: "Sort the numbers into prime and composite."
                bins:
                  - { id: prime, show: { text: "prime" }, say: "Prime." }
                  - { id: composite, show: { text: "composite" }, say: "Composite." }
                options:
                  - { text: "2", bin: prime }
                  - { text: "11", bin: prime }
                  - { text: "13", bin: prime }
                  - { text: "4", bin: composite }
                  - { text: "15", bin: composite }
                  - { text: "21", bin: composite }
                hints:
                  - "For each number, look for a multiplication other than 1 × the number."
                  - "4 = 2 × 2, 15 = 3 × 5, 21 = 3 × 7."
                  - "Prime: 2, 11, 13. Composite: 4, 15, 21."
              - id: l1-f5
                type: multiple_choice
                text: "Which is the only even prime number?"
                options: ["2", "4", "10"]
                answer: "2"
                hints:
                  - "Every even number has 2 as a factor."
                  - "Which even number has only the factors 1 and itself?"
                  - "2 = 1 × 2 only. 2 is the only even prime."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which number is prime?"
                options: ["13", "21", "27"]
                answer: "13"
                hints: ["Try 3 × 7 and 3 × 9."]
              - id: l1-s2
                type: multiple_choice
                text: "Which number is not prime?"
                options: ["17", "19", "15"]
                answer: "15"
                hints: ["Which one is in the 5 times table?"]
              - id: l1-s3
                type: true_false
                text: "Is it true? 2 is a prime number."
                answer: true
                hints: ["What are the factors of 2?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Complete the prime numbers up to 19."
                frame: "2, 3, 5, 7, _, 13, _, 19"
                options: ["9", "11", "15", "17"]
                answer: ["11", "17"]
                hints: ["9 = 3 × 3 and 15 = 3 × 5 are not prime."]
              - id: l1-s5
                type: multiple_choice
                text: "Why is 21 not a prime number?"
                options: ["21 = 3 × 7", "21 is odd.", "21 is bigger than 19."]
                answer: "21 = 3 × 7"
                hints: ["A composite number has a factor other than 1 and itself."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which number is prime?"
                options: ["19", "25", "9"]
                answer: "19"
              - id: l1-n2
                type: text_input
                text: "How many prime numbers are there between 10 and 20?"
                answer: "4"
              - id: l1-n3
                type: multiple_choice
                text: "Which number is composite?"
                options: ["3", "5", "14"]
                answer: "14"
              - id: l1-n4
                type: true_false
                text: "Is it true? Every odd number is a prime number."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Mo says 17 is prime. Which fact shows he is right?"
                options: ["17 has only the factors 1 and 17.", "17 is odd.", "17 is less than 20."]
                answer: "17 has only the factors 1 and 17."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which number is prime?"
            options: ["11", "12", "15"]
            answer: "11"
          - id: l1-c2
            type: multiple_choice
            text: "Which number is not prime?"
            options: ["2", "5", "9"]
            answer: "9"
          - id: l1-c3
            type: text_input
            text: "What is the largest prime number less than 20?"
            answer: "19"

  - n: 2
    title: { de: Primfaktoren, en: Prime factors }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which number is prime?"
            options: ["5", "6", "8"]
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which number is composite?"
            options: ["10", "7", "13"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Is 37 prime?\n37 ÷ 2, 37 ÷ 3, 37 ÷ 5, 37 ÷ 7: none divide exactly.\n37 is prime."
            say: "To test a number up to one hundred, try dividing it by the primes two, three, five and seven. Thirty-seven is odd, its digits add to ten so three does not go, it does not end in nought or five, and it is not in the seven times table. So thirty-seven is prime."
          - text: "Is 91 prime?\n91 = 7 × 13\n91 is not prime."
            say: "Ninety-one looks prime, but test it. Seven times thirteen is ninety-one. So ninety-one is a composite number."
          - text: "12 = 2 × 6\n6 = 2 × 3\n12 = 2 × 2 × 3"
            say: "Every composite number can be broken into prime factors. Twelve is two times six. Six is not prime, so break it again: two times three. Now every factor is prime: twelve is two times two times three. This is a factor tree."
          - text: "30 = 2 × 15 = 2 × 3 × 5"
            say: "Thirty is two times fifteen, and fifteen is three times five. So the prime factors of thirty are two, three and five."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Is 51 prime?"
                options: ["No, 51 = 3 × 17.", "Yes, because it is odd.", "Yes, nothing divides it."]
                answer: "No, 51 = 3 × 17."
                feedback:
                  "Yes, because it is odd.": "Being odd only means 2 is not a factor. Try 3: the digits of 51 add up to 6."
                hints:
                  - "Try dividing by 2, 3, 5 and 7."
                  - "The digits 5 and 1 add up to 6, so 3 is a factor."
                  - "51 = 3 × 17, so it is not prime."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which number is prime?"
                options: ["29", "39", "49"]
                answer: "29"
                hints:
                  - "Test each number with 3 and 7."
                  - "39 = 3 × 13 and 49 = 7 × 7."
                  - "Only 29 has just the factors 1 and 29."
              - id: l2-f3
                type: fill_in_blank
                text: "Break 12 into prime factors."
                frame: "12 = 2 × 6 = 2 × _ × _"
                options: ["2", "3", "4", "6"]
                answer: ["2", "3"]
                hints:
                  - "6 is not prime. Break it again."
                  - "6 = 2 × 3."
                  - "12 = 2 × 2 × 3."
              - id: l2-f4
                type: multiple_choice
                text: "Which shows 18 as a product of prime factors?"
                options: ["2 × 3 × 3", "2 × 9", "3 × 6"]
                answer: "2 × 3 × 3"
                hints:
                  - "Every factor in the answer must be prime."
                  - "9 and 6 are not prime. Break them: 9 = 3 × 3."
                  - "18 = 2 × 3 × 3."
              - id: l2-f5
                type: text_input
                text: "30 = 2 × 3 × _"
                answer: "5"
                hints:
                  - "2 × 3 = 6. What times 6 makes 30?"
                  - "30 ÷ 6 = 5."
                  - "5 is prime, so 30 = 2 × 3 × 5."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Is 57 prime?"
                options: ["No, 57 = 3 × 19.", "No, 57 = 7 × 8.", "Yes, 57 is prime."]
                answer: "No, 57 = 3 × 19."
                hints: ["The digits 5 and 7 add up to 12."]
              - id: l2-s2
                type: multiple_choice
                text: "Which number is prime?"
                options: ["31", "33", "35"]
                answer: "31"
                hints: ["33 is in the 3 times table and 35 in the 5 times table."]
              - id: l2-s3
                type: fill_in_blank
                text: "Break 20 into prime factors."
                frame: "20 = 2 × 10 = 2 × _ × _"
                options: ["2", "4", "5", "10"]
                answer: ["2", "5"]
                hints: ["10 is not prime: 10 = 2 × 5."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 28 = 2 × 2 × 7, so the prime factors of 28 are 2 and 7."
                answer: true
                hints: ["Check that 2 and 7 are both prime and that 2 × 2 × 7 makes 28."]
              - id: l2-s5
                type: text_input
                text: "8 = 2 × 2 × _"
                answer: "2"
                hints: ["2 × 2 = 4. What times 4 makes 8?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A locker number is prime and between 40 and 50. Which could it be?"
                options: ["41", "45", "49"]
                answer: "41"
              - id: l2-n2
                type: multiple_choice
                text: "Ali writes 24 as a product of prime factors. Which is right?"
                options: ["2 × 2 × 2 × 3", "2 × 12", "4 × 6"]
                answer: "2 × 2 × 2 × 3"
              - id: l2-n3
                type: text_input
                text: "Ella's secret number is 42 = 2 × 3 × _. Which prime is missing?"
                answer: "7"
              - id: l2-n4
                type: true_false
                text: "A puzzle book says 87 is a prime number. Is it true?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "23 children want to stand in equal rows, with more than one child in each row and more than one row. Can they?"
                options: ["No, because 23 is prime.", "Yes, in rows of 3.", "Yes, in rows of 2."]
                answer: "No, because 23 is prime."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which number is prime?"
            options: ["17", "27", "21"]
            answer: "17"
          - id: l2-c2
            type: multiple_choice
            text: "Which list shows all the prime numbers up to 10?"
            options: ["2, 3, 5, 7", "1, 3, 5, 7, 9", "1, 2, 3, 5, 7"]
            answer: "2, 3, 5, 7"
          - id: l2-c3
            type: multiple_choice
            text: "Is 63 prime?"
            options: ["No, 63 = 7 × 9.", "Yes, because it is odd.", "No, 63 = 6 × 3."]
            answer: "No, 63 = 7 × 9."
          - id: l2-c4
            type: fill_in_blank
            text: "Break 45 into prime factors."
            frame: "45 = 5 × 9 = 5 × _ × _"
            options: ["1", "3", "5", "9"]
            answer: ["3", "3"]
          - id: l2-c5
            type: text_input
            text: "What is the smallest prime number?"
            answer: "2"
