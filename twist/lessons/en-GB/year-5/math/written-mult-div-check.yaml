# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.written-mult-div-check
skill: math.written-mult-div.check
curriculum: en-GB
language: en
title:
  de: Malnehmen und Teilen überprüfen
  en: Checking multiplication and division
summary: >
  Two ways to check a written multiplication or division. Lesson 1
  estimates by rounding to find whether an answer is about the right
  size (387 × 4 is about 400 × 4 = 1600, so 15,480 is wrong); lesson 2
  checks with the inverse (a division with multiplication, a
  multiplication with division, a remainder added back on), finds which
  answer is wrong, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Schriftlich teilen, en: Written division }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.written-mult-div.div-one-digit, math.mult-div-larger.estimate]
  also_practises: [math.written-mult-div.mult-one-digit]
  vocabulary: { en: [check, estimate, round, inverse, about, remainder, sensible] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: estimate, what: { de: mit einem Überschlag prüfen, en: checking with an estimate } }
    - { id: inverse, what: { de: mit der Umkehraufgabe prüfen, en: checking with the inverse } }
    - { id: correct, what: { de: mit Überschlag oder Umkehraufgabe ein falsches Ergebnis finden und verbessern, en: finding and correcting a wrong answer with an estimate or the inverse } }
  misconceptions:
    - id: estimate-proves-right
      what: Thinks an answer close to the estimate must be exactly right
      addressed: lesson 1 Learn says an estimate only catches big mistakes; l1-f5 and l1-s5 have an answer near the estimate that is still wrong, with feedback in l1-f5; lesson 2 checks exactly with the inverse
    - id: wrong-inverse
      what: Checks a division by dividing again or by adding (checks 1356 ÷ 4 = 339 with 339 + 4)
      addressed: lesson 2 Learn pairs × with ÷; l2-f1, l2-s1, l2-n1 and l2-c3 ask which calculation checks, with feedback in l2-f1
    - id: forget-remainder
      what: Leaves out the remainder when checking (214 × 4 = 856, so 857 ÷ 4 = 214 r 1 looks wrong)
      addressed: lesson 2 Learn adds the remainder back; l2-f3, l2-s3 and l2-n3 check divisions with remainders, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit dem Überschlag prüfen", en: "Checking with an estimate" }
    goal:
      de: "Runde die Zahlen und überschlage, ob ein Ergebnis ungefähr stimmt, so wie 387 mal 4 ist etwa 400 mal 4."
      en: "Round the numbers to estimate whether an answer is about the right size, like 387 times 4 is about 400 times 4."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Round 387 to the nearest hundred."
            answer: "400"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "936 ÷ 4 = _"
            say: "Nine hundred and thirty-six divided by four."
            answer: "234"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lucy says 387 × 4 = 15,480. Do you think she is right?"
            say: "Lucy worked out three hundred and eighty-seven times four and got fifteen thousand four hundred and eighty. Do you think she is right? Have a guess, without working it out."
          - text: "387 × 4 = 15,480?\nEstimate: 400 × 4 = 1600"
            say: "Estimate: round three hundred and eighty-seven to four hundred. Four hundred times four is one thousand six hundred. Lucy's answer is about ten times too big."
          - text: "387 × 4 = 1548"
            say: "The right answer is one thousand five hundred and forty-eight, which is close to the estimate of one thousand six hundred."
          - text: "2436 ÷ 6\nEstimate: 2400 ÷ 6 = 400"
            say: "For division, round to a number that divides easily. Two thousand four hundred and thirty-six is close to two thousand four hundred, and two thousand four hundred divided by six is four hundred. So the answer should be about four hundred. It is four hundred and six."
          - text: "An estimate catches big mistakes, not small ones."
            say: "If an answer is far from the estimate, it is wrong. If it is close, it may still be a little wrong. To be sure, check with the inverse."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which estimate fits 412 × 6?"
                options: ["400 × 6 = 2400", "400 × 60 = 24,000", "40 × 6 = 240"]
                answer: "400 × 6 = 2400"
                hints:
                  - "Round 412 to the nearest hundred."
                  - "412 is about 400. Keep the 6."
                  - "400 × 6 = 2400."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Does it fit the estimate? 598 × 7 = 41,860"
                say: "Does it fit the estimate? Five hundred and ninety-eight times seven equals forty-one thousand, eight hundred and sixty."
                answer: false
                hints:
                  - "Round 598 to the nearest hundred."
                  - "600 × 7 = 4200."
                  - "No. 41,860 is about ten times too big. The answer is 4186."
              - id: l1-f3
                type: multiple_choice
                text: "Which estimate fits 3564 ÷ 9?"
                options: ["3600 ÷ 9 = 400", "360 ÷ 9 = 40", "36 ÷ 9 = 4"]
                answer: "3600 ÷ 9 = 400"
                hints:
                  - "Round to a number that 9 divides easily."
                  - "3564 is close to 3600, and 36 ÷ 9 = 4."
                  - "3600 ÷ 9 = 400."
              - id: l1-f4
                type: multiple_choice
                text: "Which answer fits the estimate? 789 × 5"
                options: ["3945", "39,450", "394"]
                answer: "3945"
                hints:
                  - "Estimate: 800 × 5."
                  - "800 × 5 = 4000."
                  - "3945 is close to 4000."
              - id: l1-f5
                type: multiple_choice
                text: "Ali says: 304 × 6 = 1814. The estimate is 300 × 6 = 1800, so I must be right. Is he?"
                options: ["Not sure: an estimate only shows it is about right.", "Yes, it matches the estimate.", "No, it is far from the estimate."]
                answer: "Not sure: an estimate only shows it is about right."
                feedback:
                  "Yes, it matches the estimate.": "An estimate catches big mistakes. Here 304 × 6 is really 1824, so 1814 is a little wrong."
                hints:
                  - "Is 1814 close to 1800?"
                  - "Close means about right, not exactly right."
                  - "Not sure. In fact 304 × 6 = 1824."

          - support: some
            tasks:
              - id: l1-s2
                type: true_false
                text: "Does it fit the estimate? 4872 ÷ 8 = 609"
                say: "Does it fit the estimate? Four thousand eight hundred and seventy-two divided by eight equals six hundred and nine."
                answer: true
                hints: ["4800 ÷ 8 = 600."]
              - id: l1-s1
                type: multiple_choice
                text: "Which estimate fits 693 × 8?"
                options: ["700 × 8 = 5600", "700 × 80 = 56,000", "70 × 8 = 560"]
                answer: "700 × 8 = 5600"
                hints: ["693 is about 700."]
              - id: l1-s3
                type: multiple_choice
                text: "Which estimate fits 2780 ÷ 7?"
                options: ["2800 ÷ 7 = 400", "280 ÷ 7 = 40", "28 ÷ 7 = 4"]
                answer: "2800 ÷ 7 = 400"
                hints: ["28 ÷ 7 = 4."]
              - id: l1-s4
                type: multiple_choice
                text: "Which answer fits the estimate? 1205 × 4"
                options: ["4820", "48,200", "482"]
                answer: "4820"
                hints: ["1200 × 4."]
              - id: l1-s5
                type: true_false
                text: "Mia's answer is close to the estimate, so it must be exactly right. Is that true?"
                answer: false
                hints: ["Can a small slip still be close to the estimate?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which estimate fits 506 × 9?"
                options: ["500 × 9 = 4500", "500 × 90 = 45,000", "50 × 9 = 450"]
                answer: "500 × 9 = 4500"
              - id: l1-n2
                type: true_false
                text: "Does it fit the estimate? 812 × 3 = 2436"
                say: "Does it fit the estimate? Eight hundred and twelve times three equals two thousand four hundred and thirty-six."
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Which estimate fits 4518 ÷ 5?"
                options: ["4500 ÷ 5 = 900", "4000 ÷ 5 = 800", "45 ÷ 5 = 9"]
                answer: "4500 ÷ 5 = 900"
              - id: l1-n4
                type: multiple_choice
                text: "Which answer fits the estimate? 6345 ÷ 9"
                options: ["705", "75", "7050"]
                answer: "705"
              - id: l1-n5
                type: multiple_choice
                text: "Sam buys 4 bikes at £289 each. The shop says the total is £11,560. Is that sensible?"
                say: "Sam buys four bikes at two hundred and eighty-nine pounds each. The shop says the total is eleven thousand, five hundred and sixty pounds. Is that sensible?"
                options: ["No, it should be about £1200.", "Yes, it is about right.", "No, it should be about £120."]
                answer: "No, it should be about £1200."
                feedback:
                  "Yes, it is about right.": "Only if the bikes are made of gold! 4 × about £300 is about £1200."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which estimate fits 297 × 6?"
            options: ["300 × 6 = 1800", "300 × 60 = 18,000", "30 × 6 = 180"]
            answer: "300 × 6 = 1800"
          - id: l1-c2
            type: true_false
            text: "Does it fit the estimate? 3208 ÷ 4 = 82"
            say: "Does it fit the estimate? Three thousand two hundred and eight divided by four equals eighty-two."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Which answer fits the estimate? 902 × 7"
            options: ["6314", "63,140", "631"]
            answer: "6314"
          - id: l1-c4
            type: multiple_choice
            text: "Which estimate fits 5382 ÷ 9?"
            options: ["5400 ÷ 9 = 600", "540 ÷ 9 = 60", "54 ÷ 9 = 6"]
            answer: "5400 ÷ 9 = 600"
          - id: l1-c5
            type: true_false
            text: "Does it fit the estimate? 498 × 6 = 2988"
            say: "Does it fit the estimate? Four hundred and ninety-eight times six equals two thousand nine hundred and eighty-eight."
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which answer fits the estimate? 3108 ÷ 4"
            options: ["777", "77", "7770"]
            answer: "777"

  - n: 2
    title: { de: "Mit der Umkehraufgabe prüfen", en: "Checking with the inverse" }
    goal:
      de: "Prüf eine Geteiltaufgabe mit Malnehmen und eine Malaufgabe mit Teilen, so wie 339 mal 4 ist wieder 1356."
      en: "Check a division by multiplying and a multiplication by dividing, like 339 times 4 gives back 1356."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which estimate fits 589 × 4?"
            options: ["600 × 4 = 2400", "600 × 40 = 24,000", "60 × 4 = 240"]
            answer: "600 × 4 = 2400"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Does it fit the estimate? 2709 ÷ 3 = 903"
            say: "Does it fit the estimate? Two thousand seven hundred and nine divided by three equals nine hundred and three."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1356 ÷ 4 = 339. How could you check it, without dividing again?"
            say: "One thousand three hundred and fifty-six divided by four is three hundred and thirty-nine. How could you check that, without doing the division again? Have a think."
          - text: "1356 ÷ 4 = 339\nCheck: 339 × 4 = 1356"
            say: "Multiplication and division are inverses: one undoes the other. To check a division, multiply the answer by the number you divided by. Three hundred and thirty-nine times four is one thousand three hundred and fifty-six, so the division is right."
          - text: "246 × 7 = 1722\nCheck: 1722 ÷ 7 = 246"
            say: "To check a multiplication, divide the answer by one of the numbers. One thousand seven hundred and twenty-two divided by seven is two hundred and forty-six. It is right."
          - text: "857 ÷ 4 = 214 r 1\nCheck: 214 × 4 = 856, 856 + 1 = 857"
            say: "With a remainder, multiply and then add the remainder back on. Two hundred and fourteen times four is eight hundred and fifty-six. Add one: eight hundred and fifty-seven."
          - text: "504 ÷ 6 = 74?\nCheck: 74 × 6 = 444, not 504"
            say: "If the check does not give the number you started with, there is a mistake. Seventy-four times six is four hundred and forty-four, so seventy-four is wrong. The answer is eighty-four."
          - text: "Did you know? In 1999 a spacecraft flying to Mars was lost, because two teams used different units and nobody checked."
            say: "Did you know? In nineteen ninety-nine, a NASA spacecraft called the Mars Climate Orbiter flew all the way to Mars, and was lost. One team's computer program worked in pounds, the old units. The other team expected metric units. Nobody checked, so the spacecraft came too close to Mars. Always check your answer!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which calculation checks 2184 ÷ 6 = 364?"
                options: ["364 × 6", "364 ÷ 6", "364 + 6"]
                answer: "364 × 6"
                feedback:
                  "364 + 6": "Adding is the inverse of subtracting. The inverse of dividing is multiplying."
                hints:
                  - "Which operation undoes division?"
                  - "Multiply the answer by the number you divided by."
                  - "364 × 6."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Check with the inverse. Is 3248 ÷ 8 = 406?"
                say: "Check with the inverse. Is three thousand two hundred and forty-eight divided by eight equal to four hundred and six?"
                answer: true
                hints:
                  - "Work out 406 × 8."
                  - "400 × 8 = 3200 and 6 × 8 = 48."
                  - "3248. Yes."
              - id: l2-f3
                type: multiple_choice
                text: "Which calculation checks 643 ÷ 5 = 128 r 3?"
                options: ["128 × 5 + 3", "128 × 5", "128 × 3 + 5"]
                answer: "128 × 5 + 3"
                feedback:
                  "128 × 5": "128 × 5 = 640. You must add the remainder 3 to get back to 643."
                hints:
                  - "Multiply by the number you divided by."
                  - "Then add the remainder back on."
                  - "128 × 5 + 3 = 643."
              - id: l2-f4
                type: multiple_choice
                text: "Which calculation checks 315 × 6 = 1890?"
                options: ["1890 ÷ 6", "1890 × 6", "1890 − 6"]
                answer: "1890 ÷ 6"
                hints:
                  - "Which operation undoes multiplication?"
                  - "Divide the answer by one of the numbers."
                  - "1890 ÷ 6. It should give 315."
              - id: l2-f5
                type: text_input
                text: "Ella says 1932 ÷ 4 = 433. Check with the inverse, then type the right answer."
                say: "Ella says one thousand nine hundred and thirty-two divided by four is four hundred and thirty-three. Check with the inverse, then type the right answer."
                answer: "483"
                hints:
                  - "433 × 4 = 1732, not 1932."
                  - "Divide again: 19 ÷ 4 = 4 r 3, 33 ÷ 4 = 8 r 1, 12 ÷ 4 = 3."
                  - "483."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which calculation checks 3010 ÷ 7 = 430?"
                options: ["430 × 7", "430 ÷ 7", "430 + 7"]
                answer: "430 × 7"
                hints: ["Undo dividing by multiplying."]
              - id: l2-s2
                type: true_false
                text: "Check with the inverse. Is 2214 ÷ 9 = 256?"
                say: "Check with the inverse. Is two thousand two hundred and fourteen divided by nine equal to two hundred and fifty-six?"
                answer: false
                hints: ["256 × 9 = 2304."]
              - id: l2-s3
                type: true_false
                text: "Check with the inverse. Is 925 ÷ 4 = 231 r 1?"
                say: "Check with the inverse. Is nine hundred and twenty-five divided by four equal to two hundred and thirty-one remainder one?"
                answer: true
                hints: ["231 × 4 + 1."]
              - id: l2-s4
                type: multiple_choice
                text: "Which calculation checks 128 × 7 = 896?"
                options: ["896 ÷ 7", "896 × 7", "896 + 7"]
                answer: "896 ÷ 7"
                hints: ["Undo multiplying by dividing."]
              - id: l2-s5
                type: text_input
                text: "Use the inverse to find the mistake. 2556 ÷ 6 = 416? Type the right answer."
                say: "Use the inverse to find the mistake. Two thousand five hundred and fifty-six divided by six. Is it four hundred and sixteen? Type the right answer."
                answer: "426"
                hints: ["416 × 6 = 2496."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which calculation checks 4515 ÷ 5 = 903?"
                options: ["903 × 5", "903 ÷ 5", "903 − 5"]
                answer: "903 × 5"
              - id: l2-n2
                type: true_false
                text: "Check with the inverse. Is 268 × 6 = 1608?"
                say: "Check with the inverse. Is two hundred and sixty-eight times six equal to one thousand six hundred and eight?"
                answer: true
              - id: l2-n3
                type: true_false
                text: "Check with the inverse. Is 762 ÷ 5 = 152 r 3?"
                say: "Check with the inverse. Is seven hundred and sixty-two divided by five equal to one hundred and fifty-two remainder three?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Which answer is wrong? Check each one."
                options: ["1428 ÷ 7 = 214", "1428 ÷ 4 = 357", "1428 ÷ 6 = 238"]
                answer: "1428 ÷ 7 = 214"
              - id: l2-n5
                type: text_input
                text: "Ben says 3 boxes of 248 pens make 644 pens. Use an estimate or the inverse to check. How many pens are there really?"
                answer: "744"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: estimate
            type: multiple_choice
            text: "Which estimate fits 812 × 5?"
            options: ["800 × 5 = 4000", "800 × 50 = 40,000", "80 × 5 = 400"]
            answer: "800 × 5 = 4000"
          - id: l2-c2
            part: estimate
            type: true_false
            text: "Does it fit the estimate? 4215 ÷ 5 = 8430"
            say: "Does it fit the estimate? Four thousand two hundred and fifteen divided by five equals eight thousand four hundred and thirty."
            answer: false
          - id: l2-c3
            part: inverse
            type: multiple_choice
            text: "Which calculation checks 1695 ÷ 3 = 565?"
            options: ["565 × 3", "565 ÷ 3", "565 + 3"]
            answer: "565 × 3"
          - id: l2-c4
            part: inverse
            type: true_false
            text: "Check with the inverse. Is 538 ÷ 6 = 89 r 4?"
            say: "Check with the inverse. Is five hundred and thirty-eight divided by six equal to eighty-nine remainder four?"
            answer: true
          - id: l2-c5
            part: correct
            type: text_input
            text: "Use the inverse to find the right answer. 2793 ÷ 7 = 389? Type the right answer."
            say: "Use the inverse to find the right answer. Two thousand seven hundred and ninety-three divided by seven. Is it three hundred and eighty-nine? Type the right answer."
            answer: "399"
          - id: l2-c6
            part: estimate
            type: multiple_choice
            text: "Which estimate fits 4134 ÷ 6?"
            options: ["4200 ÷ 6 = 700", "420 ÷ 6 = 70", "42 ÷ 6 = 7"]
            answer: "4200 ÷ 6 = 700"
          - id: l2-c7
            part: estimate
            type: true_false
            text: "Does it fit the estimate? 703 × 8 = 5624"
            say: "Does it fit the estimate? Seven hundred and three times eight equals five thousand six hundred and twenty-four."
            answer: true
          - id: l2-c8
            part: estimate
            type: multiple_choice
            text: "Which answer fits the estimate? 4116 ÷ 6"
            options: ["686", "68", "6860"]
            answer: "686"
          - id: l2-c9
            part: estimate
            type: true_false
            text: "Does it fit the estimate? 389 × 9 = 35,001"
            say: "Does it fit the estimate? Three hundred and eighty-nine times nine equals thirty-five thousand and one."
            answer: false
          - id: l2-c10
            part: estimate
            type: multiple_choice
            text: "6 coaches have 52 seats each. Which is the best estimate of the number of seats?"
            options: ["300 seats", "3000 seats", "30 seats"]
            answer: "300 seats"
          - id: l2-c11
            part: inverse
            type: multiple_choice
            text: "Ana checks 427 × 8 = 3416 by working out 3416 ÷ 8. Which answer shows she was right?"
            options: ["427", "3408", "8"]
            answer: "427"
          - id: l2-c12
            part: inverse
            type: true_false
            text: "Check with the inverse. Is 4734 ÷ 9 = 526?"
            say: "Check with the inverse. Is four thousand seven hundred and thirty-four divided by nine equal to five hundred and twenty-six?"
            answer: true
          - id: l2-c13
            part: inverse
            type: fill_in_blank
            text: "Check 2851 ÷ 6 = 475 r 1 with the inverse."
            say: "Check two thousand eight hundred and fifty-one divided by six equals four hundred and seventy-five remainder one with the inverse."
            frame: "475 × 6 = _; _ + 1 = 2851"
            options: ["2850", "2856", "2845"]
            answer: ["2850", "2850"]
          - id: l2-c14
            part: inverse
            type: true_false
            text: "Check with the inverse. Is 1645 ÷ 7 = 253?"
            say: "Check with the inverse. Is one thousand six hundred and forty-five divided by seven equal to two hundred and fifty-three?"
            answer: false
          - id: l2-c15
            part: inverse
            type: fill_in_blank
            text: "Check 2016 ÷ 8 = 252 with the inverse."
            say: "Check two thousand and sixteen divided by eight equals two hundred and fifty-two with the inverse."
            frame: "252 × 8 = _, so the division is _."
            options: ["2016", "2061", "right", "wrong"]
            answer: ["2016", "right"]
          - id: l2-c16
            part: correct
            type: text_input
            text: "Jo says 1854 ÷ 3 = 518. Check with the inverse, then type the right answer."
            say: "Jo says one thousand eight hundred and fifty-four divided by three is five hundred and eighteen. Check with the inverse, then type the right answer."
            answer: "618"
          - id: l2-c17
            part: correct
            type: multiple_choice
            text: "Which answer is wrong? Check each one."
            options: ["2135 ÷ 5 = 427", "2135 ÷ 7 = 305", "2136 ÷ 8 = 276"]
            answer: "2136 ÷ 8 = 276"
          - id: l2-c18
            part: correct
            type: text_input
            text: "Sam says 346 × 7 = 2322. He has made a mistake. Type the right answer."
            say: "Sam says three hundred and forty-six times seven is two thousand three hundred and twenty-two. He has made a mistake. Type the right answer."
            answer: "2422"
          - id: l2-c19
            part: correct
            type: multiple_choice
            text: "Tom says 6 × 1250 = 750. Which check shows his mistake fastest?"
            options: ["an estimate: 6 × 1000 = 6000", "adding 6 and 1250", "counting on in ones"]
            answer: "an estimate: 6 × 1000 = 6000"
          - id: l2-c20
            part: correct
            type: true_false
            text: "Priya works out 409 × 6 = 2454. Her estimate is 400 × 6 = 2400, so her answer must be wrong. Is that true?"
            answer: false
