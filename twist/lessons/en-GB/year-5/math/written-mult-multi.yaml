# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.written-mult-multi
skill: math.written-mult-div.mult-multi-digit
curriculum: en-GB
language: en
title:
  de: Schriftlich mit mehrstelligen Zahlen malnehmen
  en: Long multiplication
summary: >
  Long multiplication by a two-digit number. Lesson 1 works out the two
  partial products of a two-digit by two-digit multiplication (23 × 4
  and 23 × 10), writes the tens row with a placeholder zero and adds the
  rows in columns; lesson 2 does the same with three- and four-digit
  numbers, estimates first, and ends with the skill check. The long
  multiplication is drawn in columns with its partial products.
metadata:
  year: year-5
  topic: { de: Schriftlich malnehmen, en: Written multiplication }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.written-mult-div.mult-one-digit, math.mult-div-larger.large-mental]
  also_practises: [math.mult-div-larger.estimate]
  vocabulary: { en: [long multiplication, partial product, placeholder, column, exchange, estimate] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: two-digit, what: { de: zweistellige Zahlen schriftlich malnehmen, en: long multiplication of two two-digit numbers } }
    - { id: bigger, what: { de: drei- und vierstellige Zahlen mit zweistelligen malnehmen, en: long multiplication of three- and four-digit numbers by a two-digit number } }
    - { id: partials, what: { de: die Teilprodukte mit der Platzhalter-Null bilden und stellengerecht addieren, en: finding the partial products with the placeholder zero and adding them in the right columns } }
    - { id: estimate, what: { de: das Ergebnis mit einem Überschlag prüfen, en: checking the answer with an estimate } }
  misconceptions:
    - id: no-placeholder
      what: Leaves out the placeholder zero, so the tens row is added as ones (24 × 12 = 48 + 24 = 72)
      addressed: lesson 1 Learn writes the placeholder zero; l1-f2 has feedback on the missing zero, l1-s4, l1-n4 and l1-c3 show the mistake
    - id: one-partial-product
      what: Multiplies by only one digit of the two-digit number
      addressed: l1-f1, l1-s2 and l1-n2 ask which partial products are needed; l2-f2 has feedback on a single partial product, l2-c3 asks again
    - id: estimate-skipped
      what: Accepts an answer that is ten times too big or too small
      addressed: lesson 2 Learn estimates first; l2-f1, l2-s1, l2-n1 and l2-c4 ask for or use an estimate
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zweistellig mal zweistellig", en: "Two digits times two digits" }
    goal:
      de: "Rechne zwei Teilergebnisse aus, vergiss die Platzhalter-Null nicht und addiere sie in Spalten, so wie bei 23 mal 14."
      en: "Work out two rows, remember the placeholder zero, and add the rows in columns, like 23 times 14."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "34 × 3 = _"
            say: "Thirty-four times three."
            answer: "102"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "45 × 10 = _"
            say: "Forty-five times ten."
            answer: "450"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "23 × 14\n14 = 10 + 4"
            say: "Twenty-three times fourteen. Fourteen is ten and four, so we multiply twenty-three by four and twenty-three by ten, then add."
            show: { drawn: written-calc, rows: ["23", "14"], op: "×" }
          - text: "23 × 4 = 92\n23 × 10 = 230"
            say: "First row: twenty-three times four is ninety-two. Second row: twenty-three times ten. Write a nought in the ones column first, as a placeholder, because you are now multiplying by tens. Then one times three is three and one times two is two. Two hundred and thirty."
            show: { drawn: written-calc, rows: ["23", "14"], op: "×", partials: ["92", "230"] }
          - text: "92 + 230 = 322"
            say: "Add the two rows in columns. Two ones. Nine tens and three tens are twelve tens: write two, exchange one hundred. Two hundreds and the exchanged hundred are three hundreds. Twenty-three times fourteen is three hundred and twenty-two."
            show: { drawn: written-calc, rows: ["23", "14"], op: "×", partials: ["92", "230"], result: "322" }
          - text: "Without the 0: 92 + 23 = 115\n115 is far too small."
            say: "If you forget the placeholder, you add twenty-three instead of two hundred and thirty. An estimate shows the mistake: twenty times fifteen is three hundred."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which partial products do you need for 36 × 24?"
                say: "Thirty-six times twenty-four. Which partial products do you need?"
                options: ["36 × 4 and 36 × 20", "36 × 2 and 36 × 4", "30 × 20 and 6 × 4"]
                answer: "36 × 4 and 36 × 20"
                feedback:
                  "36 × 2 and 36 × 4": "The 2 in 24 is 2 tens, worth 20."
                  "30 × 20 and 6 × 4": "That leaves out 30 × 4 and 6 × 20. Multiply the whole of 36 by each part."
                hints:
                  - "Partition 24 into tens and ones."
                  - "24 = 20 + 4. Multiply all of 36 by each part."
                  - "36 × 4 and 36 × 20."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Work out 32 × 15 in rows."
                say: "Thirty-two times fifteen. Fill in the two rows and the total."
                frame: "32 × 5 = _; 32 × 10 = _; total _"
                options: ["160", "320", "480", "32", "192"]
                answer: ["160", "320", "480"]
                feedback:
                  "192": "That adds 32, not 320. The tens row needs the placeholder zero."
                hints:
                  - "Ones row first, then the tens row with a placeholder."
                  - "32 × 5 = 160. 32 × 10 = 320."
                  - "160 + 320 = 480."
              - id: l1-f3
                type: text_input
                text: "Add the partial products for 47 × 13."
                show: { drawn: written-calc, rows: ["47", "13"], op: "×", partials: ["141", "470"], result: "___" }
                answer: "611"
                hints:
                  - "Add ones, then tens, then hundreds."
                  - "1 + 0 = 1. 4 + 7 = 11: write 1, exchange 1 hundred."
                  - "611."
              - id: l1-f4
                type: multiple_choice
                text: "Why does the second row start with a 0?\n28 × 13\n28 × 3 = 84\n28 × 10 = 280"
                options: ["Because it is 28 × 10, so the digits move a place to the left.", "Because 28 has no ones.", "To make the answer look bigger."]
                answer: "Because it is 28 × 10, so the digits move a place to the left."
                hints:
                  - "What does the 1 in 13 stand for?"
                  - "It is 1 ten. 28 × 10 = 280."
                  - "The zero holds the ones place because the row is 28 × 10."
              - id: l1-f5
                type: text_input
                text: "A cinema has 18 rows with 25 seats in each row. How many seats is that?"
                answer: "450"
                hints:
                  - "Work out 25 × 18 in rows: 25 × 8 and 25 × 10."
                  - "25 × 8 = 200. 25 × 10 = 250."
                  - "200 + 250 = 450."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Work out 43 × 12 in rows."
                say: "Forty-three times twelve. Fill in the two rows and the total."
                frame: "43 × 2 = _; 43 × 10 = _; total _"
                options: ["86", "430", "516", "129"]
                answer: ["86", "430", "516"]
                hints: ["The tens row needs a placeholder zero."]
              - id: l1-s2
                type: multiple_choice
                text: "Which partial products do you need for 47 × 35?"
                say: "Forty-seven times thirty-five. Which partial products do you need?"
                options: ["47 × 5 and 47 × 30", "47 × 3 and 47 × 5", "40 × 30 and 7 × 5"]
                answer: "47 × 5 and 47 × 30"
                hints: ["35 = 30 + 5."]
              - id: l1-s3
                type: text_input
                text: "Add the partial products for 56 × 24."
                show: { drawn: written-calc, rows: ["56", "24"], op: "×", partials: ["224", "1120"], result: "____" }
                answer: "1344"
                hints: ["Ones, tens, hundreds, thousands."]
              - id: l1-s4
                type: true_false
                text: "Is there a mistake? 24 × 12 = 48 + 24 = 72"
                answer: true
                hints: ["24 × 12 is more than 24 × 10."]
              - id: l1-s5
                type: text_input
                text: "A crate holds 24 bottles. How many bottles are in 15 crates?"
                answer: "360"
                hints: ["24 × 5 = 120 and 24 × 10 = 240."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Work out 26 × 31 in rows."
                say: "Twenty-six times thirty-one. Fill in the two rows and the total."
                frame: "26 × 1 = _; 26 × 30 = _; total _"
                options: ["26", "780", "806", "78"]
                answer: ["26", "780", "806"]
              - id: l1-n2
                type: multiple_choice
                text: "Which partial products do you need for 58 × 27?"
                say: "Fifty-eight times twenty-seven. Which partial products do you need?"
                options: ["58 × 7 and 58 × 20", "58 × 2 and 58 × 7", "50 × 20 and 8 × 7"]
                answer: "58 × 7 and 58 × 20"
              - id: l1-n3
                type: text_input
                text: "Add the partial products for 39 × 26."
                show: { drawn: written-calc, rows: ["39", "26"], op: "×", partials: ["234", "780"], result: "____" }
                answer: "1014"
              - id: l1-n4
                type: true_false
                text: "Is there a mistake? 42 × 13 = 126 + 420 = 546"
                answer: false
              - id: l1-n5
                type: text_input
                text: "A school bus travels 34 miles every day. How many miles does it travel in 21 days?"
                answer: "714"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "34 × 12 = _"
            say: "Thirty-four times twelve."
            answer: "408"
          - id: l1-c2
            type: text_input
            text: "25 × 16 = _"
            say: "Twenty-five times sixteen."
            answer: "400"
          - id: l1-c3
            type: true_false
            text: "Is there a mistake? 31 × 22 = 62 + 62 = 124"
            answer: true
          - id: l1-c4
            type: text_input
            text: "53 × 16 = _"
            say: "Fifty-three times sixteen."
            answer: "848"
          - id: l1-c5
            type: fill_in_blank
            text: "Work out 41 × 26 in rows."
            say: "Forty-one times twenty-six. Fill in the two rows and the total."
            frame: "41 × 6 = _; 41 × 20 = _; total _"
            options: ["246", "820", "1066", "82", "328"]
            answer: ["246", "820", "1066"]
          - id: l1-c6
            type: multiple_choice
            text: "Which partial products do you need for 63 × 18?"
            say: "Sixty-three times eighteen. Which partial products do you need?"
            options: ["63 × 8 and 63 × 10", "63 × 1 and 63 × 8", "60 × 10 and 3 × 8"]
            answer: "63 × 8 and 63 × 10"

  - n: 2
    title: { de: "Drei- und vierstellig mal zweistellig", en: "Bigger numbers times two digits" }
    goal:
      de: "Überschlage zuerst und multipliziere dann drei- und vierstellige Zahlen mit zweistelligen, so wie 124 mal 23."
      en: "Estimate first, then multiply bigger numbers by a two-digit number in rows, like 124 times 23."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "31 × 14 = _"
            say: "Thirty-one times fourteen."
            answer: "434"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "143 × 2 = _"
            say: "One hundred and forty-three times two."
            answer: "286"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "124 × 23\nEstimate: 100 × 20 = 2000"
            say: "One hundred and twenty-four times twenty-three. Estimate first: about one hundred times twenty, which is two thousand. The answer should be a bit more than that."
          - text: "124 × 3 = 372\n124 × 20 = 2480"
            say: "First row: one hundred and twenty-four times three is three hundred and seventy-two. Second row: times twenty. Write the placeholder nought, then multiply by two: two thousand four hundred and eighty."
          - text: "372 + 2480 = 2852"
            say: "Add the rows in columns: two thousand eight hundred and fifty-two. That is a bit more than the estimate of two thousand, so it makes sense."
            show: { drawn: written-calc, rows: ["124", "23"], op: "×", partials: ["372", "2480"], result: "2852" }
          - text: "1204 × 15\n1204 × 5 = 6020\n1204 × 10 = 12,040\n6020 + 12,040 = 18,060"
            say: "Four-digit numbers work the same way. One thousand two hundred and four times five is six thousand and twenty. Times ten is twelve thousand and forty. Add them: eighteen thousand and sixty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which estimate fits 198 × 21?"
                options: ["200 × 20 = 4000", "200 × 2 = 400", "100 × 20 = 2000"]
                answer: "200 × 20 = 4000"
                hints:
                  - "Round each number."
                  - "198 is about 200, 21 is about 20."
                  - "200 × 20 = 4000."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Work out 213 × 32 in rows."
                say: "Two hundred and thirteen times thirty-two. Fill in the two rows and the total."
                frame: "213 × 2 = _; 213 × 30 = _; total _"
                options: ["426", "6390", "6816", "639", "1065"]
                answer: ["426", "6390", "6816"]
                feedback:
                  "1065": "That adds 639 without its placeholder zero. 213 × 30 is 6390."
                hints:
                  - "Ones row, then the tens row with a placeholder zero."
                  - "213 × 2 = 426. 213 × 3 = 639, so 213 × 30 = 6390."
                  - "426 + 6390 = 6816."
              - id: l2-f3
                type: text_input
                text: "Add the partial products for 245 × 34."
                show: { drawn: written-calc, rows: ["245", "34"], op: "×", partials: ["980", "7350"], result: "____" }
                answer: "8330"
                hints:
                  - "Add column by column from the right."
                  - "0 + 0 = 0. 8 + 5 = 13: write 3, exchange 1."
                  - "8330."
              - id: l2-f4
                type: true_false
                text: "Does the answer fit the estimate? 312 × 19 = 59,280"
                say: "Does the answer fit the estimate? Three hundred and twelve times nineteen equals fifty-nine thousand, two hundred and eighty."
                answer: false
                hints:
                  - "Estimate: 300 × 20."
                  - "300 × 20 = 6000."
                  - "No. 59,280 is about ten times too big. The answer is 5928."
              - id: l2-f5
                type: text_input
                text: "1203 × 14 = _"
                say: "One thousand two hundred and three times fourteen."
                answer: "16842"
                hints:
                  - "Rows: 1203 × 4 and 1203 × 10."
                  - "4812 and 12,030."
                  - "16,842."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which estimate fits 412 × 29?"
                options: ["400 × 30 = 12,000", "400 × 3 = 1200", "500 × 30 = 15,000"]
                answer: "400 × 30 = 12,000"
                hints: ["412 is about 400, 29 is about 30."]
              - id: l2-s2
                type: fill_in_blank
                text: "Work out 142 × 25 in rows."
                say: "One hundred and forty-two times twenty-five. Fill in the two rows and the total."
                frame: "142 × 5 = _; 142 × 20 = _; total _"
                options: ["710", "2840", "3550", "284", "994"]
                answer: ["710", "2840", "3550"]
                hints: ["142 × 2 = 284, so 142 × 20 = 2840."]
              - id: l2-s3
                type: text_input
                text: "Add the partial products for 326 × 17."
                show: { drawn: written-calc, rows: ["326", "17"], op: "×", partials: ["2282", "3260"], result: "____" }
                answer: "5542"
                hints: ["Exchange when a column makes ten or more."]
              - id: l2-s4
                type: true_false
                text: "Does the answer fit the estimate? 205 × 31 = 6355"
                say: "Does the answer fit the estimate? Two hundred and five times thirty-one equals six thousand three hundred and fifty-five."
                answer: true
                hints: ["200 × 30 = 6000."]
              - id: l2-s5
                type: text_input
                text: "A factory makes 135 bikes a day. How many bikes does it make in 24 days?"
                answer: "3240"
                hints: ["135 × 4 = 540 and 135 × 20 = 2700."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which estimate fits 589 × 41?"
                options: ["600 × 40 = 24,000", "600 × 4 = 2400", "500 × 40 = 20,000"]
                answer: "600 × 40 = 24,000"
              - id: l2-n2
                type: fill_in_blank
                text: "Work out 321 × 23 in rows."
                say: "Three hundred and twenty-one times twenty-three. Fill in the two rows and the total."
                frame: "321 × 3 = _; 321 × 20 = _; total _"
                options: ["963", "6420", "7383", "642", "1605"]
                answer: ["963", "6420", "7383"]
              - id: l2-n3
                type: text_input
                text: "234 × 26 = _"
                say: "Two hundred and thirty-four times twenty-six."
                answer: "6084"
              - id: l2-n4
                type: true_false
                text: "Does the answer fit the estimate? 2104 × 12 = 2524"
                say: "Does the answer fit the estimate? Two thousand one hundred and four times twelve equals two thousand five hundred and twenty-four."
                answer: false
              - id: l2-n5
                type: text_input
                text: "A stadium has 156 rows of 45 seats. How many seats is that?"
                answer: "7020"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: two-digit
            type: text_input
            text: "27 × 13 = _"
            say: "Twenty-seven times thirteen."
            answer: "351"
          - id: l2-c2
            part: partials
            type: fill_in_blank
            text: "Work out 132 × 24 in rows."
            say: "One hundred and thirty-two times twenty-four. Fill in the two rows and the total."
            frame: "132 × 4 = _; 132 × 20 = _; total _"
            options: ["528", "2640", "3168", "264", "792"]
            answer: ["528", "2640", "3168"]
          - id: l2-c3
            part: partials
            type: multiple_choice
            text: "Which partial products do you need for 415 × 36?"
            say: "Four hundred and fifteen times thirty-six. Which partial products do you need?"
            options: ["415 × 6 and 415 × 30", "415 × 3 and 415 × 6", "400 × 30 and 15 × 6"]
            answer: "415 × 6 and 415 × 30"
          - id: l2-c4
            part: estimate
            type: true_false
            text: "Does the answer fit the estimate? 497 × 22 = 10,934"
            say: "Does the answer fit the estimate? Four hundred and ninety-seven times twenty-two equals ten thousand, nine hundred and thirty-four."
            answer: true
          - id: l2-c5
            part: bigger
            type: text_input
            text: "A school buys 1250 pencils for each of 12 classes. How many pencils is that?"
            answer: "15000"
          - id: l2-c6
            part: two-digit
            type: text_input
            text: "46 × 23 = _"
            say: "Forty-six times twenty-three."
            answer: "1058"
          - id: l2-c7
            part: two-digit
            type: multiple_choice
            text: "38 × 27 = _"
            say: "Thirty-eight times twenty-seven."
            options: ["1026", "342", "1062"]
            answer: "1026"
          - id: l2-c8
            part: two-digit
            type: text_input
            text: "A trip costs £14 for each child. 28 children go. How much does the trip cost in all? Type the pounds."
            answer: "392"
          - id: l2-c9
            part: two-digit
            type: true_false
            text: "Is there a mistake? 52 × 14 = 208 + 520 = 728"
            say: "Is there a mistake? Fifty-two times fourteen equals two hundred and eight add five hundred and twenty, which is seven hundred and twenty-eight."
            answer: false
          - id: l2-c10
            part: bigger
            type: text_input
            text: "317 × 24 = _"
            say: "Three hundred and seventeen times twenty-four."
            answer: "7608"
          - id: l2-c11
            part: partials
            type: fill_in_blank
            text: "Work out 1032 × 13 in rows."
            say: "One thousand and thirty-two times thirteen. Fill in the two rows and the total."
            frame: "1032 × 3 = _; 1032 × 10 = _; total _"
            options: ["3096", "10,320", "13,416", "1032", "4128"]
            answer: ["3096", "10,320", "13,416"]
          - id: l2-c12
            part: bigger
            type: text_input
            text: "A farm sells 245 eggs a day. How many eggs does it sell in 31 days?"
            answer: "7595"
          - id: l2-c13
            part: bigger
            type: multiple_choice
            text: "2015 × 21 = _"
            say: "Two thousand and fifteen times twenty-one."
            options: ["42,315", "6045", "40,315"]
            answer: "42,315"
          - id: l2-c14
            part: bigger
            type: text_input
            text: "406 × 35 = _"
            say: "Four hundred and six times thirty-five."
            answer: "14210"
          - id: l2-c15
            part: partials
            type: text_input
            text: "Add the partial products for 64 × 37."
            show: { drawn: written-calc, rows: ["64", "37"], op: "×", partials: ["448", "1920"], result: "____" }
            answer: "2368"
          - id: l2-c16
            part: partials
            type: true_false
            text: "Is there a mistake? 135 × 22 = 270 + 270 = 540"
            say: "Is there a mistake? One hundred and thirty-five times twenty-two equals two hundred and seventy add two hundred and seventy, which is five hundred and forty."
            answer: true
          - id: l2-c17
            part: estimate
            type: multiple_choice
            text: "Which estimate fits 296 × 52?"
            options: ["300 × 50 = 15,000", "300 × 5 = 1500", "200 × 50 = 10,000"]
