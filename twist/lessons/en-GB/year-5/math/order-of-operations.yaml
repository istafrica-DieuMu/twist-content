# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.order-of-operations
skill: math.mult-div-larger.order-of-operations
curriculum: en-GB
language: en
title:
  de: Punkt vor Strich und Klammern
  en: Order of operations
summary: >
  Calculations with more than one operation. Lesson 1 does × and ÷
  before + and − (5 + 4 × 3 = 17); lesson 2 does brackets first
  ((5 + 4) × 3 = 27), compares the same numbers with and without
  brackets, works left to right when the operations are of the same kind,
  and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.mult-div.div-facts, math.add-sub-to-100.sub-two-digit]
  also_practises: [math.mult-div.all-tables]
  vocabulary: { en: [operation, order of operations, brackets, multiply, divide, add, subtract, left to right] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: mult-first, what: { de: Punkt vor Strich rechnen, en: working out × and ÷ before + and − } }
    - { id: brackets, what: { de: die Klammer zuerst rechnen, en: working out the brackets first } }
    - { id: what-first, what: { de: "erkennen, was du zuerst rechnest und welche Aufgabe passt", en: spotting which step comes first and which calculation fits } }
    - { id: left-right, what: { de: gleiche Rechenarten von links nach rechts rechnen, en: working from left to right when the operations are of the same kind } }
  misconceptions:
    - id: left-to-right
      what: Works from left to right whatever the operations (5 + 4 × 3 = 27)
      addressed: lesson 1 Learn shows why × comes first; l1-f1, l1-s1 and l1-n1 ask what to do first; l1-f3, l1-n3 and l1-c3 give the left-to-right result, and l1-f2 has it as a chip with feedback
    - id: ignore-brackets
      what: Ignores the brackets and does × first anyway ((5 + 4) × 3 = 17)
      addressed: lesson 2 Learn sets the same numbers with and without brackets; l2-f3, l2-s3 and l2-n3 are pair tasks, and l2-f4 and l2-n4 give the result without the brackets
    - id: add-before-subtract
      what: Thinks + always comes before − (20 − 5 + 3 = 12)
      addressed: lesson 2 Learn says same-kind operations go left to right; l2-f5 has feedback on 12, l2-s5 and l2-c5 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Punkt vor Strich", en: "Multiply and divide first" }
    goal:
      de: "Rechne Mal und Geteilt vor Plus und Minus, so wie bei 5 plus 4 mal 3 ist 17."
      en: "Do the times and divide before the add and subtract, like 5 add 4 times 3 is 17."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "56 ÷ 8 = _"
            say: "Fifty-six divided by eight."
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "73 − 28 = _"
            say: "Seventy-three subtract twenty-eight."
            answer: "45"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5 + 4 × 3"
            say: "This calculation has two operations, an add and a times. If two people work it out in a different order, they get different answers. So mathematicians agree on one order."
          - text: "5 + 4 × 3 = 5 + 12 = 17"
            say: "Multiply and divide come before add and subtract. First four times three is twelve. Then five add twelve is seventeen. Working from left to right would give twenty-seven, which is wrong."
          - text: "30 − 18 ÷ 6 = 30 − 3 = 27"
            say: "Divide counts as well. First eighteen divided by six is three. Then thirty subtract three is twenty-seven."
          - text: "6 × 4 + 7 × 2 = 24 + 14 = 38"
            say: "With two multiplications, work out both first. Six times four is twenty-four, seven times two is fourteen. Then add: thirty-eight."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "7 + 6 × 5. What do you work out first?"
                say: "Seven add six times five. What do you work out first?"
                options: ["6 × 5", "7 + 6"]
                answer: "6 × 5"
                feedback:
                  "7 + 6": "Multiply comes before add, even when the add is written first."
                hints:
                  - "Which operations come first: × and ÷, or + and −?"
                  - "There is a × in the middle. That goes before the +."
                  - "First 6 × 5."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Work it out step by step."
                say: "Seven add six times five. Do the multiplication first."
                frame: "7 + 6 × 5 = 7 + _ = _"
                options: ["30", "37", "65", "13"]
                answer: ["30", "37"]
                feedback:
                  "65": "That is 7 + 6 first, then × 5. Multiply comes first."
                hints:
                  - "Start with six times five."
                  - "Six fives are thirty. Then add the seven."
                  - "30, then 37."
              - id: l1-f3
                type: true_false
                text: "Is it true? 4 + 8 × 2 = 24"
                say: "Four add eight times two equals twenty-four. Is it true?"
                answer: false
                hints:
                  - "Which part do you work out first?"
                  - "Eight times two is sixteen. Then four add sixteen."
                  - "No. 4 + 8 × 2 = 20."
              - id: l1-f4
                type: fill_in_blank
                text: "Work it out step by step."
                say: "Forty subtract thirty-five divided by five. Do the division first."
                frame: "40 − 35 ÷ 5 = 40 − _ = _"
                options: ["7", "33", "1", "5"]
                answer: ["7", "33"]
                hints:
                  - "Which part is a division?"
                  - "Thirty-five divided by five is seven. Then take seven from forty."
                  - "7, then 33."
              - id: l1-f5
                type: text_input
                text: "12 + 9 × 4 = _"
                say: "Twelve add nine times four."
                answer: "48"
                hints:
                  - "Multiply before you add."
                  - "Nine times four is thirty-six."
                  - "12 + 36 = 48."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "50 − 6 × 7. What do you work out first?"
                say: "Fifty subtract six times seven. What do you work out first?"
                options: ["6 × 7", "50 − 6"]
                answer: "6 × 7"
                hints: ["× comes before −."]
              - id: l1-s2
                type: fill_in_blank
                text: "Work it out step by step."
                say: "Eight times seven add nine. Do the multiplication first."
                frame: "8 × 7 + 9 = _ + 9 = _"
                options: ["56", "65", "128"]
                answer: ["56", "65"]
                hints: ["Start with eight times seven."]
              - id: l1-s3
                type: true_false
                text: "Is it true? 15 + 3 × 3 = 24"
                say: "Fifteen add three times three equals twenty-four. Is it true?"
                answer: true
                hints: ["Work out three times three first."]
              - id: l1-s4
                type: text_input
                text: "100 − 72 ÷ 8 = _"
                say: "One hundred subtract seventy-two divided by eight."
                answer: "91"
                hints: ["Seventy-two divided by eight comes first."]
              - id: l1-s5
                type: text_input
                text: "5 × 9 − 7 = _"
                say: "Five times nine subtract seven."
                answer: "38"
                hints: ["Start with five times nine."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "26 + 48 ÷ 6. What do you work out first?"
                say: "Twenty-six add forty-eight divided by six. What do you work out first?"
                options: ["48 ÷ 6", "26 + 48"]
                answer: "48 ÷ 6"
              - id: l1-n2
                type: text_input
                text: "90 − 8 × 9 = _"
                say: "Ninety subtract eight times nine."
                answer: "18"
              - id: l1-n3
                type: true_false
                text: "Is it true? 20 + 5 × 4 = 100"
                say: "Twenty add five times four equals one hundred. Is it true?"
                answer: false
              - id: l1-n4
                type: text_input
                text: "7 × 6 + 3 × 8 = _"
                say: "Seven times six add three times eight."
                answer: "66"
              - id: l1-n5
                type: text_input
                text: "Tom buys 3 packs of 6 stickers. He already has 25 stickers. 25 + 3 × 6 = _"
                say: "Tom buys three packs of six stickers. He already has twenty-five stickers. Twenty-five add three times six."
                answer: "43"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "9 + 7 × 6 = _"
            say: "Nine add seven times six."
            answer: "51"
          - id: l1-c2
            type: text_input
            text: "60 − 54 ÷ 9 = _"
            say: "Sixty subtract fifty-four divided by nine."
            answer: "54"
          - id: l1-c3
            type: true_false
            text: "Is it true? 3 + 5 × 5 = 40"
            say: "Three add five times five equals forty. Is it true?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "36 + 24 ÷ 4. What do you work out first?"
            say: "Thirty-six add twenty-four divided by four. What do you work out first?"
            options: ["24 ÷ 4", "36 + 24"]
            answer: "24 ÷ 4"
          - id: l1-c5
            type: text_input
            text: "8 × 9 − 30 = _"
            say: "Eight times nine subtract thirty."
            answer: "42"
          - id: l1-c6
            type: true_false
            text: "Is it true? 50 − 4 × 6 = 26"
            say: "Fifty subtract four times six equals twenty-six. Is it true?"
            answer: true

  - n: 2
    title: { de: "Klammern zuerst", en: "Brackets first" }
    goal:
      de: "Rechne zuerst, was in der Klammer steht, und sieh, wie dieselben Zahlen mit Klammer ein anderes Ergebnis geben."
      en: "Work out the part in brackets first, and see how the same numbers give a different answer with brackets."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "8 + 4 × 9 = _"
            say: "Eight add four times nine."
            answer: "44"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "45 − 20 ÷ 5. What do you work out first?"
            say: "Forty-five subtract twenty divided by five. What do you work out first?"
            options: ["20 ÷ 5", "45 − 20"]
            answer: "20 ÷ 5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "(5 + 4) × 3 = 9 × 3 = 27"
            say: "Brackets tell you to do that part first, before anything else. Five add four is nine. Then nine times three is twenty-seven."
          - text: "5 + 4 × 3 = 17\n(5 + 4) × 3 = 27"
            say: "The same numbers give different answers. Without brackets, multiply first and get seventeen. With brackets, the bracket comes first and you get twenty-seven."
          - text: "20 − 5 + 3 = 15 + 3 = 18\n24 ÷ 4 × 2 = 6 × 2 = 12"
            say: "When the operations are both add and subtract, or both multiply and divide, work from left to right. Twenty subtract five is fifteen, add three is eighteen. Twenty-four divided by four is six, times two is twelve."
          - text: "Brackets, then × and ÷, then + and −"
            say: "So the order is: brackets first, then multiply and divide, then add and subtract. Some schools remember it as BODMAS or BIDMAS."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Work it out step by step."
                say: "Open bracket, six add two, close bracket, times seven. Do the brackets first."
                frame: "(6 + 2) × 7 = _ × 7 = _"
                options: ["8", "56", "20", "48"]
                answer: ["8", "56"]
                feedback:
                  "20": "That is 6 + 2 × 7 without the brackets. The brackets come first."
                hints:
                  - "What is inside the brackets?"
                  - "Six add two is eight. Then multiply by seven."
                  - "8, then 56."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "(32 − 8) ÷ 4. What do you work out first?"
                say: "Open bracket, thirty-two subtract eight, close bracket, divided by four. What do you work out first?"
                options: ["32 − 8", "8 ÷ 4"]
                answer: "32 − 8"
                feedback:
                  "8 ÷ 4": "Divide usually comes before subtract, but brackets come before everything."
                hints:
                  - "Are there any brackets?"
                  - "The subtraction is inside the brackets, so it goes first."
                  - "First 32 − 8."
              - id: l2-f3
                type: fill_in_blank
                text: "With and without brackets\n3 + 6 × 4 = _\n(3 + 6) × 4 = _"
                say: "Work out both. Look out for the brackets."
                frame: "_ and _"
                options: ["27", "36", "24"]
                answer: ["27", "36"]
                hints:
                  - "First one: multiply first. Second one: brackets first."
                  - "Six times four is twenty-four, add three. Three add six is nine, times four."
                  - "27 and 36."
              - id: l2-f4
                type: true_false
                text: "Is it true? (7 + 3) × 6 = 25"
                say: "Open bracket, seven add three, close bracket, times six, equals twenty-five. Is it true?"
                answer: false
                hints:
                  - "What do you work out first?"
                  - "Seven add three is ten. Ten times six is ..."
                  - "No. (7 + 3) × 6 = 60."
              - id: l2-f5
                type: multiple_choice
                text: "30 − 10 + 4 = _"
                say: "Thirty subtract ten add four."
                options: ["24", "16", "40"]
                answer: "24"
                feedback:
                  "16": "That adds 10 + 4 first. With only + and −, work from left to right."
                hints:
                  - "There are no brackets and no × or ÷."
                  - "Go left to right: thirty subtract ten first."
                  - "20 + 4 = 24."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Work it out step by step."
                say: "Nine times, open bracket, twelve subtract five, close bracket. Do the brackets first."
                frame: "9 × (12 − 5) = 9 × _ = _"
                options: ["7", "63", "103"]
                answer: ["7", "63"]
                hints: ["Twelve subtract five first."]
              - id: l2-s2
                type: multiple_choice
                text: "8 × (5 + 4). What do you work out first?"
                say: "Eight times, open bracket, five add four, close bracket. What do you work out first?"
                options: ["5 + 4", "8 × 5"]
                answer: "5 + 4"
                hints: ["Brackets come first."]
              - id: l2-s3
                type: fill_in_blank
                text: "With and without brackets\n40 − 4 × 5 = _\n(40 − 4) × 5 = _"
                say: "Work out both. Look out for the brackets."
                frame: "_ and _"
                options: ["20", "180", "36"]
                answer: ["20", "180"]
                hints: ["Without brackets, multiply first."]
              - id: l2-s4
                type: true_false
                text: "Is it true? (11 − 4) × 8 = 56"
                say: "Open bracket, eleven subtract four, close bracket, times eight, equals fifty-six. Is it true?"
                answer: true
                hints: ["Work out the brackets, then multiply."]
              - id: l2-s5
                type: text_input
                text: "36 ÷ 4 × 3 = _"
                say: "Thirty-six divided by four times three."
                answer: "27"
                hints: ["Only × and ÷: go from left to right."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "(45 + 15) ÷ 6 = _"
                say: "Open bracket, forty-five add fifteen, close bracket, divided by six."
                answer: "10"
              - id: l2-n2
                type: multiple_choice
                text: "Which calculation equals 40?"
                say: "Which calculation equals forty?"
                options: ["(2 + 6) × 5", "2 + 6 × 5", "2 × 6 + 5"]
                answer: "(2 + 6) × 5"
              - id: l2-n3
                type: fill_in_blank
                text: "With and without brackets\n18 + 12 ÷ 3 = _\n(18 + 12) ÷ 3 = _"
                say: "Work out both. Look out for the brackets."
                frame: "_ and _"
                options: ["22", "10", "30"]
                answer: ["22", "10"]
              - id: l2-n4
                type: true_false
                text: "Is it true? 6 × (9 − 4) = 50"
                say: "Six times, open bracket, nine subtract four, close bracket, equals fifty. Is it true?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "Mia has £50. She buys 4 books at £8 each. How much money is left? 50 − 4 × 8 = _"
                say: "Mia has fifty pounds. She buys four books at eight pounds each. How much money is left? Fifty subtract four times eight."
                answer: "18"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: mult-first
            type: text_input
            text: "14 + 6 × 8 = _"
            say: "Fourteen add six times eight."
            answer: "62"
          - id: l2-c2
            part: brackets
            type: text_input
            text: "(14 + 6) × 8 = _"
            say: "Open bracket, fourteen add six, close bracket, times eight."
            answer: "160"
          - id: l2-c3
            part: what-first
            type: multiple_choice
            text: "75 − 42 ÷ 7. What do you work out first?"
            say: "Seventy-five subtract forty-two divided by seven. What do you work out first?"
            options: ["42 ÷ 7", "75 − 42"]
            answer: "42 ÷ 7"
          - id: l2-c4
            part: brackets
            type: text_input
            text: "(63 − 27) ÷ 9 = _"
            say: "Open bracket, sixty-three subtract twenty-seven, close bracket, divided by nine."
            answer: "4"
          - id: l2-c5
            part: left-right
            type: multiple_choice
            text: "50 − 20 + 10 = _"
            say: "Fifty subtract twenty add ten."
            options: ["40", "20", "80"]
            answer: "40"
          - id: l2-c6
            part: mult-first
            type: text_input
            text: "48 − 5 × 7 = _"
            say: "Forty-eight subtract five times seven."
            answer: "13"
          - id: l2-c7
            part: mult-first
            type: true_false
            text: "Is it true? 6 + 30 ÷ 5 = 12"
            say: "Six add thirty divided by five equals twelve. Is it true?"
            answer: true
          - id: l2-c8
            part: mult-first
            type: text_input
            text: "8 × 4 + 6 × 3 = _"
            say: "Eight times four add six times three."
            answer: "50"
          - id: l2-c9
            part: mult-first
            type: multiple_choice
            text: "100 − 9 × 8 = _"
            say: "One hundred subtract nine times eight."
            options: ["28", "728", "92"]
            answer: "28"
          - id: l2-c10
            part: brackets
            type: text_input
            text: "7 × (13 − 6) = _"
            say: "Seven times, open bracket, thirteen subtract six, close bracket."
            answer: "49"
          - id: l2-c11
            part: brackets
            type: fill_in_blank
            text: "With and without brackets\n24 − 6 ÷ 2 = _\n(24 − 6) ÷ 2 = _"
            say: "Twenty-four subtract six divided by two. Then, open bracket, twenty-four subtract six, close bracket, divided by two. Work out both."
            frame: "_ and _"
            options: ["21", "9", "3"]
            answer: ["21", "9"]
          - id: l2-c12
            part: brackets
            type: true_false
            text: "Is it true? (9 + 6) × 4 = 33"
            say: "Open bracket, nine add six, close bracket, times four, equals thirty-three. Is it true?"
            answer: false
          - id: l2-c13
            part: what-first
            type: multiple_choice
            text: "(48 − 12) ÷ 6 + 3. What do you work out first?"
            say: "Open bracket, forty-eight subtract twelve, close bracket, divided by six, add three. What do you work out first?"
            options: ["48 − 12", "12 ÷ 6", "6 + 3"]
            answer: "48 − 12"
          - id: l2-c14
            part: what-first
            type: multiple_choice
            text: "4 + 7 × (10 − 2). What do you work out first?"
            say: "Four add seven times, open bracket, ten subtract two, close bracket. What do you work out first?"
            options: ["10 − 2", "7 × 10", "4 + 7"]
            answer: "10 − 2"
          - id: l2-c15
            part: what-first
            type: multiple_choice
            text: "A ticket costs £9. Ella buys 4 tickets and a programme for £6. Which calculation gives the total?"
            options: ["4 × 9 + 6", "4 × (9 + 6)", "(4 + 6) × 9"]
            answer: "4 × 9 + 6"
          - id: l2-c16
            part: what-first
            type: multiple_choice
            text: "Which calculation equals 26?"
            say: "Which calculation equals twenty-six?"
            options: ["(3 + 2) × 4", "2 + 3 × 8", "(2 + 3) × 8"]
            answer: "2 + 3 × 8"
          - id: l2-c17
            part: left-right
            type: text_input
            text: "45 − 15 + 5 = _"
            say: "Forty-five subtract fifteen add five."
            answer: "35"
          - id: l2-c18
            part: left-right
            type: multiple_choice
            text: "48 ÷ 6 × 2 = _"
            say: "Forty-eight divided by six times two."
            options: ["16", "4", "96"]
            answer: "16"
          - id: l2-c19
            part: left-right
            type: true_false
            text: "Is it true? 60 − 20 − 10 = 50"
            say: "Sixty subtract twenty subtract ten equals fifty. Is it true?"
            answer: false
          - id: l2-c20
            part: left-right
            type: text_input
            text: "Sam has 40 marbles. He gives away 15 and then wins 8. 40 − 15 + 8 = _"
            say: "Sam has forty marbles. He gives away fifteen and then wins eight. Forty subtract fifteen add eight."
            answer: "33"
