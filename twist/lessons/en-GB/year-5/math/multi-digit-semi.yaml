# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.multi-digit-semi
skill: math.mult-div-larger.multi-digit-semi
curriculum: en-GB
language: en
title:
  de: Halbschriftlich multiplizieren und dividieren
  en: Grid method and dividing in chunks
summary: >
  Informal written multiplication and division. Lesson 1 multiplies a
  two-digit number by a two-digit number with the grid method
  (23 × 45 = 800 + 100 + 120 + 15 = 1035), partitioning both numbers;
  lesson 2 divides four-digit numbers by a one-digit number in chunks
  that are easy to divide (2568 ÷ 4 = 2400 ÷ 4 + 160 ÷ 4 + 8 ÷ 4), divides
  by multiples of ten through the one-digit fact (840 ÷ 20: ÷ 2, then
  ÷ 10), checks with the inverse, and ends with the skill check. Every
  division here works out exactly; remainders come with the written
  method.
metadata:
  year: year-5
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.mult-div-larger.semi-written-div, math.mult-div-larger.large-mental]
  also_practises: [math.mult-div-larger.large-mental]
  vocabulary: { en: [grid method, partition, partial product, chunk, divide, inverse, multiple of ten] }
  forms: [drawn, text, audio]
  drawn: [table]
  facets: []
  misconceptions:
    - id: tens-times-tens-only
      what: Multiplies only tens by tens and ones by ones (23 × 45 = 20 × 40 + 3 × 5)
      addressed: lesson 1 Learn fills all four boxes of the grid; l1-f3, l1-s3 and l1-n3 show that slip, with feedback in l1-f3
    - id: forget-a-part
      what: Leaves out one partial product when adding up the grid
      addressed: lesson 1 frames ask for each box, then the total (l1-f2, l1-s2, l1-n2); lesson 2 frames ask for each chunk and the total (l2-f1, l2-s1, l2-n1)
    - id: tens-divisor-one-step
      what: Divides by a multiple of ten as if by its digit alone (840 ÷ 20 = 420)
      addressed: lesson 2 Learn splits ÷ 20 into ÷ 2 then ÷ 10; l2-f3 has feedback on 420, l2-s3 and l2-n3 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die Gittermethode", en: "The grid method" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "20 × 40 = _"
            say: "Twenty times forty."
            answer: "800"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "96 ÷ 4 = _"
            say: "Ninety-six divided by four."
            answer: "24"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "23 × 45\n23 = 20 + 3, 45 = 40 + 5"
            say: "Twenty-three times forty-five is too big for a times table fact. Partition both numbers: twenty-three is twenty and three, forty-five is forty and five."
          - text: "Grid method for 23 × 45"
            say: "Draw a grid with the parts along the top and down the side. Multiply each pair. Twenty times forty is eight hundred. Twenty times five is one hundred. Three times forty is one hundred and twenty. Three times five is fifteen."
            show: { drawn: table, rows: [["×", "40", "5"], ["20", "800", "100"], ["3", "120", "15"]] }
          - text: "800 + 100 + 120 + 15 = 1035"
            say: "Add all four boxes: eight hundred add one hundred is nine hundred, add one hundred and twenty is one thousand and twenty, add fifteen is one thousand and thirty-five. Every box counts."
          - text: "Estimate: 20 × 50 = 1000"
            say: "Check with an estimate. Twenty-three is about twenty and forty-five is about fifty. Twenty times fifty is one thousand, which is close to one thousand and thirty-five."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which number goes in the box with the ?"
                show: { drawn: table, rows: [["×", "10", "4"], ["30", "300", "?"], ["2", "20", "8"]] }
                options: ["120", "12", "34"]
                answer: "120"
                hints:
                  - "The ? is in the 30 row and the 4 column."
                  - "Work out 30 × 4."
                  - "3 × 4 = 12, so 30 × 4 = 120."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Use the grid to work out 32 × 14."
                show: { drawn: table, rows: [["×", "10", "4"], ["30", "300", "120"], ["2", "20", "8"]] }
                frame: "300 + 120 + 20 + 8 = _"
                options: ["448", "428", "420"]
                answer: ["448"]
                hints:
                  - "Add all four boxes."
                  - "300 + 120 = 420. Then add 20 and 8."
                  - "448."
              - id: l1-f3
                type: multiple_choice
                text: "Is there a mistake? Leo works out 24 × 13.\n24 × 13 = 20 × 10 + 4 × 3 = 212"
                options: ["Yes, he left out 20 × 3 and 4 × 10.", "Yes, 20 × 10 is not 200.", "No, it is correct."]
                answer: "Yes, he left out 20 × 3 and 4 × 10."
                feedback:
                  "No, it is correct.": "Estimate: 24 × 13 is more than 20 × 13 = 260. So 212 is too small."
                hints:
                  - "In a grid there are four boxes. How many did Leo use?"
                  - "He only did tens × tens and ones × ones."
                  - "He left out 20 × 3 = 60 and 4 × 10 = 40. The answer is 312."
              - id: l1-f4
                type: fill_in_blank
                text: "Fill in the grid for 15 × 27."
                show: { drawn: table, rows: [["×", "20", "7"], ["10", "?", "?"], ["5", "?", "?"]] }
                frame: "10 × 20 = _; 10 × 7 = _; 5 × 20 = _; 5 × 7 = _"
                options: ["200", "70", "100", "35", "50"]
                answer: ["200", "70", "100", "35"]
                hints:
                  - "Multiply the row number by the column number in each box."
                  - "10 × 20 = 200 and 10 × 7 = 70. Now the 5 row."
                  - "200, 70, 100, 35."
              - id: l1-f5
                type: text_input
                text: "15 × 27 = 200 + 70 + 100 + 35 = _"
                say: "Fifteen times twenty-seven. Add the four boxes: two hundred add seventy add one hundred add thirty-five."
                answer: "405"
                hints:
                  - "Add the hundreds first."
                  - "200 + 100 = 300. 70 + 35 = 105."
                  - "300 + 105 = 405."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which number goes in the box with the ?"
                show: { drawn: table, rows: [["×", "30", "6"], ["40", "1200", "240"], ["3", "?", "18"]] }
                options: ["90", "9", "120"]
                answer: "90"
                hints: ["3 row, 30 column."]
              - id: l1-s2
                type: fill_in_blank
                text: "Use the grid to work out 43 × 36."
                show: { drawn: table, rows: [["×", "30", "6"], ["40", "1200", "240"], ["3", "90", "18"]] }
                frame: "1200 + 240 + 90 + 18 = _"
                options: ["1548", "1440", "1538"]
                answer: ["1548"]
                hints: ["1200 + 240 = 1440, then add 90 and 18."]
              - id: l1-s3
                type: true_false
                text: "Is there a mistake? 35 × 12 = 30 × 10 + 5 × 2 = 310"
                answer: true
                hints: ["How many boxes would the grid have?"]
              - id: l1-s4
                type: text_input
                text: "21 × 34 = _"
                say: "Twenty-one times thirty-four."
                answer: "714"
                hints: ["20 × 34 = 680, and 1 × 34 = 34."]
              - id: l1-s5
                type: multiple_choice
                text: "Which estimate fits 48 × 21?"
                options: ["about 1000", "about 100", "about 10,000"]
                answer: "about 1000"
                hints: ["48 is about 50, 21 is about 20."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which number goes in the box with the ?"
                show: { drawn: table, rows: [["×", "50", "2"], ["20", "?", "40"], ["6", "300", "12"]] }
                options: ["1000", "100", "70"]
                answer: "1000"
              - id: l1-n2
                type: fill_in_blank
                text: "Use the grid to work out 26 × 52."
                show: { drawn: table, rows: [["×", "50", "2"], ["20", "1000", "40"], ["6", "300", "12"]] }
                frame: "1000 + 40 + 300 + 12 = _"
                options: ["1352", "1340", "1052"]
                answer: ["1352"]
              - id: l1-n3
                type: true_false
                text: "Is there a mistake? 52 × 14 = 50 × 10 + 50 × 4 + 2 × 10 + 2 × 4 = 728"
                answer: false
              - id: l1-n4
                type: text_input
                text: "41 × 17 = _"
                say: "Forty-one times seventeen."
                answer: "697"
              - id: l1-n5
                type: text_input
                text: "A cinema has 24 rows with 35 seats in each row. How many seats is that?"
                answer: "840"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Use the grid to work out 13 × 42."
            show: { drawn: table, rows: [["×", "40", "2"], ["10", "400", "20"], ["3", "120", "6"]] }
            frame: "400 + 20 + 120 + 6 = _"
            options: ["546", "526", "420"]
            answer: ["546"]
          - id: l1-c2
            type: text_input
            text: "23 × 31 = _"
            say: "Twenty-three times thirty-one."
            answer: "713"
          - id: l1-c3
            type: true_false
            text: "Is it true? 14 × 15 = 200"
            say: "Fourteen times fifteen equals two hundred. Is it true?"
            answer: false

  - n: 2
    title: { de: "In Schritten dividieren", en: "Dividing in chunks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "12 × 25 = _"
            say: "Twelve times twenty-five."
            answer: "300"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which number goes in the box with the ?"
            show: { drawn: table, rows: [["×", "30", "4"], ["10", "300", "40"], ["5", "?", "20"]] }
            options: ["150", "15", "35"]
            answer: "150"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2568 ÷ 4\n2568 = 2400 + 160 + 8"
            say: "To divide two thousand five hundred and sixty-eight by four, split it into chunks that four goes into exactly: two thousand four hundred, one hundred and sixty and eight."
          - text: "2400 ÷ 4 = 600\n160 ÷ 4 = 40\n8 ÷ 4 = 2\n600 + 40 + 2 = 642"
            say: "Divide each chunk. Two thousand four hundred divided by four is six hundred. One hundred and sixty divided by four is forty. Eight divided by four is two. Add the answers: six hundred and forty-two."
          - text: "840 ÷ 20\n840 ÷ 2 = 420\n420 ÷ 10 = 42"
            say: "Dividing by twenty is the same as dividing by two and then by ten. Eight hundred and forty divided by two is four hundred and twenty. Divided by ten is forty-two."
          - text: "Check: 642 × 4 = 2568"
            say: "Check with the inverse: multiply the answer by the number you divided by. Six hundred and forty-two times four is two thousand five hundred and sixty-eight. It matches."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Divide 3654 ÷ 6 in chunks."
                frame: "3600 ÷ 6 = _; 54 ÷ 6 = _; total _"
                options: ["600", "9", "609", "60", "690"]
                answer: ["600", "9", "609"]
                hints:
                  - "Divide each chunk, then add."
                  - "36 ÷ 6 = 6, so 3600 ÷ 6 = 600. 54 ÷ 6 = 9."
                  - "600, 9, 609."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How could you split 1752 to divide it by 4?"
                options: ["1600 + 152", "1750 + 2", "1710 + 42"]
                answer: "1600 + 152"
                hints:
                  - "Each chunk must divide by 4 exactly."
                  - "4 goes into 16 exactly. Does 4 go into 2, or into 1710?"
                  - "1600 + 152."
              - id: l2-f3
                type: multiple_choice
                text: "960 ÷ 30 = _"
                say: "Nine hundred and sixty divided by thirty."
                options: ["32", "320", "3"]
                answer: "32"
                feedback:
                  "320": "That is 960 ÷ 3. Dividing by 30 means ÷ 3 and then ÷ 10."
                hints:
                  - "Divide by 3 first, then by 10."
                  - "960 ÷ 3 = 320."
                  - "320 ÷ 10 = 32."
              - id: l2-f4
                type: true_false
                text: "Check with the inverse. Is 4528 ÷ 8 = 566?"
                say: "Check with the inverse. Is four thousand five hundred and twenty-eight divided by eight equal to five hundred and sixty-six?"
                answer: true
                hints:
                  - "Multiply the answer by 8."
                  - "566 × 8 = 4000 + 480 + 48."
                  - "Yes, 4528."
              - id: l2-f5
                type: text_input
                text: "2835 ÷ 5 = _"
                say: "Two thousand eight hundred and thirty-five divided by five."
                answer: "567"
                hints:
                  - "Split into 2500 + 300 + 35."
                  - "500 + 60 + 7."
                  - "567."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Divide 2856 ÷ 7 in chunks."
                frame: "2800 ÷ 7 = _; 56 ÷ 7 = _; total _"
                options: ["400", "8", "408", "40", "480"]
                answer: ["400", "8", "408"]
                hints: ["28 ÷ 7 = 4, so 2800 ÷ 7 = 400."]
              - id: l2-s2
                type: multiple_choice
                text: "How could you split 4392 to divide it by 6?"
                options: ["4200 + 192", "4300 + 92", "4390 + 2"]
                answer: "4200 + 192"
                hints: ["6 goes into 42 exactly."]
              - id: l2-s3
                type: multiple_choice
                text: "1440 ÷ 40 = _"
                say: "One thousand four hundred and forty divided by forty."
                options: ["36", "360", "3.6"]
                answer: "36"
                hints: ["÷ 4, then ÷ 10."]
              - id: l2-s4
                type: true_false
                text: "Check with the inverse. Is 1935 ÷ 9 = 225?"
                say: "Check with the inverse. Is one thousand nine hundred and thirty-five divided by nine equal to two hundred and twenty-five?"
                answer: false
                hints: ["225 × 9 = 1800 + 180 + 45."]
              - id: l2-s5
                type: text_input
                text: "3248 ÷ 8 = _"
                say: "Three thousand two hundred and forty-eight divided by eight."
                answer: "406"
                hints: ["3200 + 48."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Divide 4545 ÷ 9 in chunks."
                frame: "4500 ÷ 9 = _; 45 ÷ 9 = _; total _"
                options: ["500", "5", "505", "50", "550"]
                answer: ["500", "5", "505"]
              - id: l2-n2
                type: multiple_choice
                text: "How could you split 2163 to divide it by 3?"
                options: ["2100 + 63", "2000 + 163", "1000 + 1163"]
                answer: "2100 + 63"
              - id: l2-n3
                type: text_input
                text: "1280 ÷ 20 = _"
                say: "One thousand two hundred and eighty divided by twenty."
                answer: "64"
              - id: l2-n4
                type: true_false
                text: "Check with the inverse. Is 3276 ÷ 4 = 819?"
                say: "Check with the inverse. Is three thousand two hundred and seventy-six divided by four equal to eight hundred and nineteen?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "A school shares 1536 exercise books equally between 6 classes. How many books does each class get?"
                answer: "256"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Use the grid to work out 34 × 23."
            show: { drawn: table, rows: [["×", "20", "3"], ["30", "600", "90"], ["4", "80", "12"]] }
            frame: "600 + 90 + 80 + 12 = _"
            options: ["782", "692", "612"]
            answer: ["782"]
          - id: l2-c2
            type: text_input
            text: "16 × 25 = _"
            say: "Sixteen times twenty-five."
            answer: "400"
          - id: l2-c3
            type: fill_in_blank
            text: "Divide 2464 ÷ 8 in chunks."
            frame: "2400 ÷ 8 = _; 64 ÷ 8 = _; total _"
            options: ["300", "8", "308", "30", "380"]
            answer: ["300", "8", "308"]
          - id: l2-c4
            type: text_input
            text: "1680 ÷ 40 = _"
            say: "One thousand six hundred and eighty divided by forty."
            answer: "42"
          - id: l2-c5
            type: true_false
            text: "Check with the inverse. Is 2958 ÷ 6 = 483?"
            say: "Check with the inverse. Is two thousand nine hundred and fifty-eight divided by six equal to four hundred and eighty-three?"
            answer: false
