# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.data-critical
skill: math.data.critical
curriculum: en-GB
language: en
title:
  de: Diagramme kritisch lesen
  en: Spotting misleading charts
summary: >
  Lesson 1 looks at bar charts whose scale does not start at 0 (the scale
  starts at 40, so 48 bags of litter look twice as many as 44): the child
  checks where the scale starts, reads the real numbers and works out the
  real difference, and compares with an honest chart from 0. Lesson 2
  adds other tricks: steps of different sizes on the scale, a scale with
  no numbers, too few or the wrong people asked, and a claim that says
  more than the data; it ends with the skill check.
metadata:
  year: year-5
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.data.read-charts]
  also_practises: [math.data.read-charts, math.data.plan-survey]
  vocabulary: { en: [bar chart, scale, axis, starts at, difference, misleading, honest, survey, claim] }
  forms: [text, audio, drawn]
  drawn: [bar-chart]
  facets: []
  parts:
    - { id: cut, what: { de: "eine Skala erkennen, die nicht bei 0 beginnt", en: spotting a scale that does not start at 0 } }
    - { id: real, what: { de: die wirklichen Werte und Unterschiede ablesen, en: reading the real values and differences } }
    - { id: scale, what: { de: ungleiche Schritte und fehlende Zahlen auf einer Skala erkennen, en: spotting unequal steps and missing numbers on a scale } }
    - { id: survey, what: { de: "prüfen, wer gefragt wurde und ob eine Aussage zu den Daten passt", en: checking who was asked and whether a claim fits the data } }
  misconceptions:
    - id: bar-length-is-value
      what: Compares the length of the bars instead of the numbers when the scale does not start at 0 (a bar twice as long means twice as much)
      addressed: lesson 1 Learn puts a cut chart next to the honest one; l1-f2 (with feedback), l1-s3, l1-n5, l2-w1 and l2-c1 ask whether twice as long is twice as much, l1-f5 picks the honest chart
    - id: ignores-scale-steps
      what: Reads a scale without checking that its steps are equal or that it has numbers at all
      addressed: lesson 2 Learn shows a scale 0, 10, 20, 50, 100; l2-f1 (with feedback), l2-f2, l2-s1, l2-s2, l2-n1 and l2-c3 ask what is wrong with the scale
    - id: trusts-any-survey
      what: Accepts a claim about everyone from a survey of three people or of the wrong group
      addressed: lesson 2 Learn compares 3 children asked with a whole year group; l2-f3 (with feedback), l2-f4, l2-s3, l2-n3, l2-n4 and l2-c4 ask whether the claim holds
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wo beginnt die Skala?", en: "Where does the scale start?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "House points this week. How many points did Kestrel earn?"
            show: { drawn: bar-chart, step: 10, rows: [["Kestrel", 70], ["Falcon", 50], ["Osprey", 60]] }
            options: ["70", "7", "60"]
            answer: "70"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many more points did Kestrel earn than Falcon?"
            show: { drawn: bar-chart, step: 10, rows: [["Kestrel", 70], ["Falcon", 50], ["Osprey", 60]] }
            options: ["20", "120", "2"]
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Bags of litter picked up\n5A: 48   5B: 44"
            say: "On a litter pick, class 5A filled forty-eight bags and 5B filled forty-four. On this bar chart the scale starts at zero. The bars are nearly the same length, and that is right: the difference is small."
            show: { drawn: bar-chart, step: 10, rows: [["5A", 48], ["5B", 44]] }
          - text: "The same numbers. The scale starts at 40."
            say: "Here are the same numbers again, but this scale does not start at zero. It starts at forty, so the bars only show the part above forty. Now the bar for 5A looks twice as long as the bar for 5B."
            show: { drawn: bar-chart, from: 40, step: 1, rows: [["5A", 48], ["5B", 44]] }
          - text: "48 − 44 = 4\nOnly 4 bags more, not twice as many."
            say: "Did 5A pick up twice as much? No. Forty-eight take away forty-four is four. 5A filled just four more bags. The second chart is misleading."
          - text: "1. Where does the scale start?\n2. Read the numbers.\n3. Work out the real difference."
            say: "With every chart, first check where the scale starts. If it does not start at zero, do not compare the lengths of the bars. Read the numbers and work out the real difference."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Children at breakfast club. Where does the scale start?"
                show: { drawn: bar-chart, from: 80, step: 2, rows: [["Mon", 92], ["Tue", 86]] }
                options: ["at 80", "at 0", "at 92"]
                answer: "at 80"
                hints:
                  - "Look at the lowest number on the scale."
                  - "The bars start from the bottom of the scale."
                  - "The scale starts at 80."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Times tables scores. Kai's bar looks twice as long as Leo's. Did Kai score twice as many points?"
                show: { drawn: bar-chart, from: 40, step: 2, rows: [["Kai", 52], ["Leo", 46]] }
                options: ["No, only 6 more.", "Yes, twice as many.", "No, Leo scored more."]
                answer: "No, only 6 more."
                feedback:
                  "Yes, twice as many.": "The scale starts at 40, so the bars hide the first 40 points. Read the numbers: 52 and 46."
                hints:
                  - "Where does the scale start?"
                  - "It starts at 40. Kai scored 52 and Leo 46."
                  - "52 − 46 = 6. Only 6 more."
              - id: l1-f3
                type: multiple_choice
                text: "School council vote. How many more votes did Red get than Blue?"
                show: { drawn: bar-chart, from: 90, step: 1, rows: [["Red", 97], ["Blue", 93]] }
                options: ["4", "2", "190"]
                answer: "4"
                hints:
                  - "Read the number at the top of each bar."
                  - "Red got 97 and Blue got 93."
                  - "97 − 93 = 4."
              - id: l1-f4
                type: true_false
                text: "Pets in Year 5. This scale starts at 0, so you can compare the lengths of the bars. Is that true?"
                show: { drawn: bar-chart, step: 5, rows: [["Cats", 15], ["Dogs", 30]] }
                answer: true
                hints:
                  - "Look at the bottom of the scale."
                  - "It starts at 0, so each bar shows the whole number."
                  - "Yes. Here the dogs' bar really is twice as long: 30 is twice 15."
              - id: l1-f5
                type: image_multiple_choice
                text: "Tickets sold: 5A sold 68, 5B sold 64. Which chart shows the difference honestly?"
                options:
                  - { drawn: bar-chart, step: 10, rows: [["5A", 68], ["5B", 64]], key: honest }
                  - { drawn: bar-chart, from: 60, step: 1, rows: [["5A", 68], ["5B", 64]], key: cut }
                answer: honest
                hints:
                  - "Check where each scale starts."
                  - "One starts at 0, the other at 60."
                  - "The chart with the scale from 0 is honest."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Sunny days. Where does the scale start?"
                show: { drawn: bar-chart, from: 10, step: 1, rows: [["June", 18], ["July", 14]] }
                options: ["at 10", "at 0", "at 14"]
                answer: "at 10"
                hints: ["Look at the lowest number on the scale."]
              - id: l1-s2
                type: multiple_choice
                text: "Children on the school trip. How many more children went from Year 5 than Year 6?"
                show: { drawn: bar-chart, from: 70, step: 2, rows: [["Year 5", 84], ["Year 6", 78]] }
                options: ["6", "3", "162"]
                answer: "6"
                hints: ["84 − 78."]
              - id: l1-s3
                type: true_false
                text: "Books read. The Oak bar is twice as long as the Ash bar. So Oak class read twice as many books. Is that true?"
                show: { drawn: bar-chart, from: 20, step: 1, rows: [["Oak", 30], ["Ash", 25]] }
                answer: false
                hints: ["The scale starts at 20. Read the numbers: 30 and 25."]
              - id: l1-s4
                type: multiple_choice
                text: "Visitors to the school fair. Why can this chart trick you?"
                show: { drawn: bar-chart, from: 100, step: 2, rows: [["2025", 112], ["2026", 106]] }
                options: ["The scale does not start at 0.", "The bars are the wrong colour.", "There are too few bars."]
                answer: "The scale does not start at 0."
                hints: ["Look at the bottom of the scale."]
              - id: l1-s5
                type: multiple_choice
                text: "Quiz points. What is the real difference between the teams?"
                show: { drawn: bar-chart, from: 60, step: 1, rows: [["Team A", 69], ["Team B", 63]] }
                options: ["6", "3", "9"]
                answer: "6"
                hints: ["69 − 63."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Fruit sold at break. Where does the scale start?"
                show: { drawn: bar-chart, from: 30, step: 1, rows: [["Apples", 38], ["Pears", 34]] }
                options: ["at 30", "at 0", "at 34"]
                answer: "at 30"
              - id: l1-n2
                type: multiple_choice
                text: "Visitors to the library. How many more came on Saturday than on Sunday?"
                show: { drawn: bar-chart, from: 200, step: 5, rows: [["Sat", 235], ["Sun", 215]] }
                options: ["20", "2", "15"]
                answer: "20"
              - id: l1-n3
                type: true_false
                text: "Favourite sport. Twice as many children chose running as swimming. Is that true?"
                show: { drawn: bar-chart, step: 2, rows: [["Swim", 8], ["Run", 16]] }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Before you compare the bars of a chart, what should you check first?"
                options: ["where the scale starts", "the colour of the bars", "how wide the bars are"]
                answer: "where the scale starts"
              - id: l1-n5
                type: true_false
                text: "Children at football club. The Monday bar is twice as long, so twice as many children came on Monday. Is that true?"
                show: { drawn: bar-chart, from: 80, step: 1, rows: [["Mon", 90], ["Tue", 85]] }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Rainy days and sunny days. Where does the scale start?"
            show: { drawn: bar-chart, from: 40, step: 1, rows: [["Rain", 46], ["Sun", 43]] }
            options: ["at 40", "at 0", "at 43"]
            answer: "at 40"
          - id: l1-c2
            type: multiple_choice
            text: "Raffle tickets sold. What is the real difference between 5A and 5B?"
            show: { drawn: bar-chart, from: 120, step: 2, rows: [["5A", 134], ["5B", 128]] }
            options: ["6", "3", "262"]
            answer: "6"
          - id: l1-c3
            type: true_false
            text: "Favourite colour. Twice as many children chose red as blue. Is that true?"
            show: { drawn: bar-chart, step: 5, rows: [["Red", 20], ["Blue", 10]] }
            answer: true
          - id: l1-c4
            type: text_input
            text: "Bikes in the bike shed. How many more bikes were there on Monday than on Tuesday?"
            show: { drawn: bar-chart, from: 20, step: 1, rows: [["Mon", 28], ["Tue", 24]] }
            answer: "4"
          - id: l1-c5
            type: true_false
            text: "Spellings correct. This scale starts at 0. Is that true?"
            show: { drawn: bar-chart, from: 10, step: 1, rows: [["Jo", 16], ["Max", 13]] }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "The scale of a chart starts at 50. Team A's bar ends at 58 and Team B's bar ends at 54. How many more points did Team A get?"
            options: ["4", "2", "8"]
            answer: "4"

  - n: 2
    title: { de: "Weitere Tricks", en: "More tricks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Children at choir. Monday's bar looks twice as long. How many more children really came on Monday?"
            show: { drawn: bar-chart, from: 70, step: 1, rows: [["Mon", 78], ["Tue", 74]] }
            options: ["4", "74", "2"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Trees planted. Where does the scale start?"
            show: { drawn: bar-chart, from: 20, step: 1, rows: [["Ash", 28], ["Elm", 24]] }
            options: ["at 20", "at 0", "at 24"]
            answer: "at 20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A scale: 0, 10, 20, 50, 100\nThe steps are not equal."
            say: "Look at the steps on a scale, not just where it starts. On this scale the steps go up by ten, then ten, then thirty, then fifty, but the gaps look the same. A bar at a hundred would look only a little longer than a bar at fifty. Every step on a scale should be the same size."
          - text: "No numbers on the scale?\nYou can see which is biggest, but not how many."
            say: "Some charts have no numbers on the scale at all. Then you can see which bar is longest, but you cannot tell how many, or how big the difference really is."
          - text: "Mia asked 3 friends. Ben asked all 60 children in Year 5."
            say: "Also ask who was asked. Mia asked three friends, and two of them like football best. That tells us nothing about the whole school. Ben asked all sixty children in Year 5, so his results tell us much more about Year 5."
          - text: "Does the claim match the data?"
            say: "Last of all, check what people say about a chart. If one hundred and twenty children chose pizza and eighty chose pasta, then more children chose pizza. It does not mean that every child loves pizza, or that nobody likes pasta."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The scale on a chart goes 0, 10, 20, 50, 100. What is wrong with it?"
                options: ["The steps are not equal.", "It starts at 0.", "It goes up to 100."]
                answer: "The steps are not equal."
                feedback:
                  "It starts at 0.": "Starting at 0 is right. Look at the gaps between the numbers."
                hints:
                  - "Work out each step: 0 to 10, 10 to 20, 20 to 50."
                  - "The steps are 10, 10, 30 and 50."
                  - "The steps are not equal."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "A chart has bars but no numbers on its scale. What can you tell from it?"
                options: ["which bar is longest, but not how many", "exactly how many are in each bar", "nothing at all"]
                answer: "which bar is longest, but not how many"
                hints:
                  - "You can still see the bars."
                  - "Without numbers you cannot read how many."
                  - "Which bar is longest, but not how many."
              - id: l2-f3
                type: multiple_choice
                text: "Mia asks 3 friends. 2 like football best. Mia says: most children in our school like football best. Why is that not fair?"
                options: ["She only asked 3 children.", "Football is not a sport.", "2 is more than 1."]
                answer: "She only asked 3 children."
                feedback:
                  "2 is more than 1.": "That is true for her friends, but she says it about the whole school."
                hints:
                  - "Who did Mia ask?"
                  - "3 friends are a tiny part of a whole school."
                  - "She only asked 3 children."
              - id: l2-f4
                type: true_false
                text: "A newspaper asks 5 people in one street. It says: everyone in the town loves the new park. Is that a fair claim?"
                answer: false
                hints:
                  - "How many people were asked, and where?"
                  - "5 people in one street are not the whole town."
                  - "No, it is not a fair claim."
              - id: l2-f5
                type: multiple_choice
                text: "In a survey, 120 children chose pizza and 80 chose pasta. Which claim fits the data?"
                options: ["More children chose pizza than pasta.", "Every child loves pizza.", "Nobody likes pasta."]
                answer: "More children chose pizza than pasta."
                hints:
                  - "What do the numbers really tell you?"
                  - "80 children chose pasta, so some do like it."
                  - "More children chose pizza than pasta."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A scale goes 0, 5, 10, 20, 40. Are the steps equal?"
                options: ["No, they get bigger.", "Yes, they all go up by 5.", "Yes, they all go up by 10."]
                answer: "No, they get bigger."
                hints: ["Work out each step."]
              - id: l2-s2
                type: true_false
                text: "A chart with no numbers on its scale tells you exactly how many people chose each answer. Is that true?"
                answer: false
                hints: ["What do you need to read how many?"]
              - id: l2-s3
                type: multiple_choice
                text: "Leo wants to know what Year 5 likes to eat for lunch. Who should he ask?"
                options: ["children from every Year 5 class", "only his two best friends", "only the teachers"]
                answer: "children from every Year 5 class"
                hints: ["He wants to know about the whole of Year 5."]
              - id: l2-s4
                type: multiple_choice
                text: "Survey: do you want a longer break? A poster says: most children want a longer break. Does the chart agree?"
                show: { drawn: bar-chart, step: 2, rows: [["Yes", 12], ["No", 13]] }
                options: ["No, more children said no.", "Yes, most said yes.", "The chart does not say."]
                answer: "No, more children said no."
                hints: ["Read both bars: 12 and 13."]
              - id: l2-s5
                type: true_false
                text: "A shop asked 10 customers, and 9 liked its cakes. The shop says: 9 out of 10 customers we asked liked our cakes. Is that a fair claim?"
                answer: true
                hints: ["Does the claim say who was asked?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A scale goes 0, 2, 4, 8, 16. What is wrong with it?"
                options: ["The steps are not equal.", "It starts at 0.", "The numbers are all even."]
                answer: "The steps are not equal."
              - id: l2-n2
                type: multiple_choice
                text: "Cakes sold. The 5A bar looks much longer. What is the real difference?"
                show: { drawn: bar-chart, from: 50, step: 1, rows: [["5A", 56], ["5B", 52]] }
                options: ["4", "2", "56"]
                answer: "4"
              - id: l2-n3
                type: true_false
                text: "To find out what Year 5 thinks, asking every child in Year 5 is fairer than asking 3 of them. Is that true?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Which survey gives the best picture of the whole school?"
                options: ["asking 10 children from every class", "asking 10 children from Reception", "asking 1 child"]
                answer: "asking 10 children from every class"
              - id: l2-n5
                type: multiple_choice
                text: "In a survey, 14 children chose dogs and 7 chose cats. Which claim fits the data?"
                options: ["Twice as many chose dogs as cats.", "All children love dogs.", "7 more chose cats."]
                answer: "Twice as many chose dogs as cats."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: real
            type: multiple_choice
            text: "House points. The Robins' bar looks twice as long. How many more points did Robins really get?"
            show: { drawn: bar-chart, from: 60, step: 1, rows: [["Robins", 68], ["Wrens", 64]] }
            options: ["4", "2", "64"]
            answer: "4"
          - id: l2-c2
            part: cut
            type: multiple_choice
            text: "Visitors to the museum. What makes this chart misleading?"
            show: { drawn: bar-chart, from: 300, step: 5, rows: [["2025", 330], ["2026", 315]] }
            options: ["Its scale starts at 300, not 0.", "It has only two bars.", "The years are in order."]
            answer: "Its scale starts at 300, not 0."
          - id: l2-c3
            part: scale
            type: multiple_choice
            text: "A scale goes 0, 1, 2, 5, 10. What is wrong with it?"
            options: ["The gaps between the numbers are not equal.", "It does not start at 1.", "It stops at 10."]
            answer: "The gaps between the numbers are not equal."
          - id: l2-c4
            part: survey
            type: true_false
            text: "Sam asked 4 people at his football club. 3 said football is the best sport. Sam says: three quarters of all children think football is the best sport. Is that a fair claim?"
            answer: false
          - id: l2-c5
            part: survey
            type: multiple_choice
            text: "200 children voted for a class trip: 90 for the zoo and 110 for the seaside. Which claim fits the data?"
            options: ["More children voted for the seaside.", "Nobody wanted the zoo.", "Twice as many voted for the seaside."]
            answer: "More children voted for the seaside."
          - id: l2-c6
            part: cut
            type: multiple_choice
            text: "Bags of litter collected. Where does the scale start?"
            show: { drawn: bar-chart, from: 50, step: 1, rows: [["Oak", 57], ["Ash", 53]] }
            options: ["at 50", "at 0", "at 53"]
            answer: "at 50"
          - id: l2-c7
            part: cut
            type: true_false
            text: "Laps run. This scale starts at 0, so you can compare the lengths of the bars. Is that true?"
            show: { drawn: bar-chart, from: 20, step: 1, rows: [["Amy", 27], ["Raj", 23]] }
            answer: false
          - id: l2-c8
            part: cut
            type: image_multiple_choice
            text: "Cakes sold: 5A sold 47, 5B sold 42. Which chart is misleading?"
            options:
              - { drawn: bar-chart, step: 10, rows: [["5A", 47], ["5B", 42]], key: honest }
              - { drawn: bar-chart, from: 40, step: 1, rows: [["5A", 47], ["5B", 42]], key: cut }
            answer: cut
          - id: l2-c9
            part: cut
            type: multiple_choice
            text: "Minutes of reading. Ali says: the Monday bar is three times as long, so I read three times as much on Monday. Why is he wrong?"
            show: { drawn: bar-chart, from: 30, step: 1, rows: [["Mon", 36], ["Tue", 32]] }
            options: ["The scale starts at 30, so the bars leave out the first 30 minutes.", "He read the bars in the wrong order.", "The bars are too thin."]
            answer: "The scale starts at 30, so the bars leave out the first 30 minutes."
          - id: l2-c10
            part: real
            type: text_input
            text: "Swimming badges. How many more badges did Year 6 get than Year 5?"
            show: { drawn: bar-chart, from: 40, step: 2, rows: [["Year 5", 44], ["Year 6", 52]] }
            answer: "8"
          - id: l2-c11
            part: real
            type: multiple_choice
            text: "Litres of milk drunk at school. The Tuesday bar looks four times as long as the Monday bar. How much milk was really drunk on Tuesday?"
            show: { drawn: bar-chart, from: 100, step: 5, rows: [["Mon", 105], ["Tue", 120]] }
            options: ["120 litres", "20 litres", "4 times as much as on Monday"]
            answer: "120 litres"
          - id: l2-c12
            part: real
            type: true_false
            text: "Goals scored this season. Is it true that the Lions scored 3 more goals than the Tigers?"
            show: { drawn: bar-chart, from: 30, step: 1, rows: [["Lions", 39], ["Tigers", 36]] }
            answer: true
          - id: l2-c13
            part: real
            type: multiple_choice
            text: "Cars driving past the school. How many cars drove past on Friday?"
            show: { drawn: bar-chart, from: 150, step: 5, rows: [["Thu", 165], ["Fri", 180]] }
            options: ["180", "30", "15"]
            answer: "180"
          - id: l2-c14
            part: scale
            type: multiple_choice
            text: "A scale goes 0, 25, 50, 75, 100. Is it a fair scale?"
            options: ["Yes, every step is 25.", "No, the steps are not equal.", "No, it should start at 25."]
            answer: "Yes, every step is 25."
          - id: l2-c15
            part: scale
            type: true_false
            text: "A scale goes 0, 3, 6, 12, 24. Is it true that its steps are equal?"
            answer: false
          - id: l2-c16
            part: scale
            type: multiple_choice
            text: "A chart shows how many children chose each fruit, but its scale has no numbers. Which question can you answer?"
            options: ["Which fruit was chosen most?", "How many children chose apples?", "How many more chose bananas than pears?"]
            answer: "Which fruit was chosen most?"
          - id: l2-c17
            part: scale
            type: multiple_choice
            text: "Which scale has equal steps?"
            options: ["0, 4, 8, 12, 16", "0, 4, 8, 16, 32", "0, 5, 10, 20, 30"]
            answer: "0, 4, 8, 12, 16"
          - id: l2-c18
            part: survey
