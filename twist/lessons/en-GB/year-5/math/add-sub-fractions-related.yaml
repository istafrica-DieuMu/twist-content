# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.add-sub-fractions-related
skill: math.fractions.add-sub-related
curriculum: en-GB
language: en
title:
  de: Brüche mit verwandten Nennern addieren und subtrahieren
  en: Adding and subtracting fractions with related denominators
summary: >
  Adding and subtracting fractions when one denominator is a multiple of
  the other: change one fraction so both have the same denominator, then
  add or subtract the numerators (2/3 + 1/6 = 4/6 + 1/6 = 5/6). Lesson 1
  works with answers less than 1; lesson 2 writes answers greater than 1
  as mixed numbers, subtracts from a mixed number, solves cooking, walking
  and pizza problems, and ends with the skill check.
metadata:
  year: year-5
  topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.fractions.add-sub-same-denominator, math.fractions.equivalent-families]
  also_practises: [math.fractions.mixed-numbers]
  vocabulary: { en: [fraction, numerator, denominator, equivalent, common denominator, multiple, mixed number, improper fraction] }
  forms: [drawn, text, audio]
  drawn: [fraction]
  facets: []
  parts:
    - { id: add, what: { de: Brüche mit verwandten Nennern addieren, en: adding fractions with related denominators } }
    - { id: subtract, what: { de: Brüche mit verwandten Nennern subtrahieren, en: subtracting fractions with related denominators } }
    - { id: over-one, what: { de: Ergebnisse größer als 1 als gemischte Zahl und von einer gemischten Zahl abziehen, en: answers greater than 1 as mixed numbers and taking away from a mixed number } }
    - { id: in-context, what: { de: Sachaufgaben mit Brüchen, en: word problems with fractions } }
  misconceptions:
    - id: adds-denominators
      what: Adds the numerators and the denominators (1/2 + 1/4 = 2/6)
      addressed: lesson 1 Learn says never to add the denominators; l1-f1 and l2-f1 have feedback, l1-s4 asks it, every sum offers the added denominators
    - id: no-conversion
      what: Adds or subtracts the numerators without first changing one fraction (3/4 − 3/8 = 0)
      addressed: lesson 1 Learn changes one fraction first; l1-f3 has feedback, l1-f2, l1-f5, l1-s2 and l2-c4 show the step
    - id: answer-over-one
      what: Leaves an answer like 11/8 or writes it as 1 1/8, losing parts when changing to a mixed number
      addressed: lesson 2 Learn turns 11/8 into 1 3/8; l2-f1, l2-f3, l2-s1 and l2-c3 offer a wrong mixed number
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Einen Nenner anpassen, en: Changing one denominator }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "2/7 + 3/7 = _"
            say: "Two sevenths add three sevenths."
            options: ["5/7", "5/14", "6/7"]
            answer: "5/7"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "3/4 = _/8"
            say: "Three quarters is how many eighths?"
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1/2 + 1/4\n1/2 = 2/4\n2/4 + 1/4 = 3/4"
            say: "Halves and quarters are different sizes, so you cannot add them straight away. Two is a factor of four, so change the half into quarters: one half is two quarters. Now add the quarters: two quarters add one quarter is three quarters."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }
          - text: "2/3 + 1/6\n2/3 = 4/6 (× 2 on the top and the bottom)\n4/6 + 1/6 = 5/6"
            say: "Six is a multiple of three, so use sixths. Multiply the top and the bottom of two thirds by two: four sixths. Four sixths add one sixth is five sixths."
          - text: "3/4 − 3/8\n3/4 = 6/8\n6/8 − 3/8 = 3/8"
            say: "Subtracting works the same way. Change three quarters into eighths: six eighths. Six eighths take away three eighths is three eighths."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 6 }
          - text: "1/2 + 1/4 is not 2/6."
            say: "Never add the denominators. The denominator tells you the size of the parts, and adding fractions does not change the size of the parts."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1/2 + 1/4 = _"
                say: "One half add one quarter."
                options: ["3/4", "2/6", "2/4"]
                answer: "3/4"
                option_audio: false
                feedback:
                  "2/6": "Do not add the denominators. Change 1/2 into 2/4, then add the quarters: 2/4 + 1/4."
                hints:
                  - "Make both fractions quarters."
                  - "1/2 = 2/4."
                  - "2/4 + 1/4 = 3/4."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Work out 2/3 + 1/6."
                say: "Work out two thirds add one sixth."
                frame: "2/3 = _/6, so 2/3 + 1/6 = _/6"
                options: ["2", "3", "4", "5"]
                answer: ["4", "5"]
                hints:
                  - "Change thirds into sixths."
                  - "Multiply the top and the bottom of 2/3 by 2: 4/6."
                  - "4/6 + 1/6 = 5/6."
              - id: l1-f3
                type: multiple_choice
                text: "3/4 − 3/8 = _"
                say: "Three quarters take away three eighths."
                options: ["3/8", "0/4", "3/4"]
                answer: "3/8"
                option_audio: false
                feedback:
                  "0/4": "3/4 and 3/8 are not the same amount. Change 3/4 into 6/8 first: 6/8 − 3/8."
                hints:
                  - "Change the quarters into eighths."
                  - "3/4 = 6/8."
                  - "6/8 − 3/8 = 3/8."
              - id: l1-f4
                type: multiple_choice
                text: "Which denominator would you use to work out 1/5 + 3/10?"
                say: "Which denominator would you use to work out one fifth add three tenths?"
                options: ["10", "15", "5"]
                answer: "10"
                hints:
                  - "Look for the denominator the other one goes into."
                  - "5 goes into 10, so fifths can be changed into tenths."
                  - "Use 10."
              - id: l1-f5
                type: text_input
                text: "1/3 + 5/9 = _/9"
                say: "One third add five ninths is how many ninths?"
                answer: "8"
                hints:
                  - "Change 1/3 into ninths."
                  - "1/3 = 3/9."
                  - "3/9 + 5/9 = 8/9."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "1/4 + 3/8 = _"
                say: "One quarter add three eighths."
                options: ["5/8", "4/12", "4/8"]
                answer: "5/8"
                option_audio: false
                hints: ["1/4 = 2/8."]
              - id: l1-s2
                type: text_input
                text: "5/6 − 1/3 = _/6"
                say: "Five sixths take away one third is how many sixths?"
                answer: "3"
                hints: ["1/3 = 2/6."]
              - id: l1-s3
                type: multiple_choice
                text: "7/10 − 1/2 = _"
                say: "Seven tenths take away one half."
                options: ["2/10", "6/8", "6/10"]
                answer: "2/10"
                option_audio: false
                hints: ["1/2 = 5/10."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 1/2 + 1/6 = 2/8"
                say: "Is it true? One half add one sixth is two eighths."
                answer: false
                hints: ["Change 1/2 into sixths first."]
              - id: l1-s5
                type: multiple_choice
                text: "3/5 + 1/10 = _"
                say: "Three fifths add one tenth."
                options: ["7/10", "4/15", "4/10"]
                answer: "7/10"
                option_audio: false
                hints: ["3/5 = 6/10."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "2/9 + 1/3 = _/9"
                say: "Two ninths add one third is how many ninths?"
                answer: "5"
              - id: l1-n2
                type: multiple_choice
                text: "11/12 − 3/4 = _"
                say: "Eleven twelfths take away three quarters."
                options: ["2/12", "8/8", "8/12"]
                answer: "2/12"
                option_audio: false
              - id: l1-n3
                type: text_input
                text: "1/2 − 3/8 = _/8"
                say: "One half take away three eighths is how many eighths?"
                answer: "1"
              - id: l1-n4
                type: multiple_choice
                text: "3/7 + 5/14 = _"
                say: "Three sevenths add five fourteenths."
                options: ["11/14", "8/21", "8/14"]
                answer: "11/14"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? 2/5 + 3/10 = 7/10"
                say: "Is it true? Two fifths add three tenths is seven tenths."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "1/2 + 3/8 = _"
            say: "One half add three eighths."
            options: ["7/8", "4/10", "4/8"]
            answer: "7/8"
            option_audio: false
          - id: l1-c2
            type: text_input
            text: "2/3 − 1/6 = _/6"
            say: "Two thirds take away one sixth is how many sixths?"
            answer: "3"
          - id: l1-c3
            type: multiple_choice
            text: "4/5 − 3/10 = _"
            say: "Four fifths take away three tenths."
            options: ["5/10", "1/5", "1/10"]
            answer: "5/10"
            option_audio: false
          - id: l1-c4
            type: text_input
            text: "1/4 + 7/12 = _/12"
            say: "One quarter add seven twelfths is how many twelfths?"
            answer: "10"
          - id: l1-c5
            type: true_false
            text: "Is it true? 3/10 + 1/5 = 4/15"
            say: "Is it true? Three tenths add one fifth is four fifteenths."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "5/6 − 1/2 = _"
            say: "Five sixths take away one half."
            options: ["2/6", "4/4", "4/6"]
            answer: "2/6"
            option_audio: false

  - n: 2
    title: { de: Ergebnisse größer als 1, en: Answers greater than 1 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "1/4 + 1/2 = _"
            say: "One quarter add one half."
            options: ["3/4", "2/6", "2/4"]
            answer: "3/4"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "7/8 − 1/4 = _/8"
            say: "Seven eighths take away one quarter is how many eighths?"
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3/4 + 5/8\n= 6/8 + 5/8\n= 11/8\n= 1 3/8"
            say: "Three quarters add five eighths. Change the quarters into eighths: six eighths add five eighths is eleven eighths. Eight eighths make one whole, so eleven eighths is one and three eighths."
            show: { drawn: fraction, kind: rect, rows: 2, parts: 16, shaded: 11 }
          - text: "2/3 + 5/6\n= 4/6 + 5/6\n= 9/6\n= 1 3/6"
            say: "Two thirds add five sixths. Four sixths add five sixths is nine sixths. Six sixths make a whole, so it is one and three sixths."
          - text: "1 1/4 − 1/2\n1 1/4 = 5/4 and 1/2 = 2/4\n5/4 − 2/4 = 3/4"
            say: "To take a fraction from a mixed number, write the mixed number as an improper fraction. One and one quarter is five quarters, and one half is two quarters. Five quarters take away two quarters is three quarters."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "3/4 + 5/8 = _"
                say: "Three quarters add five eighths."
                options: ["1 3/8", "8/12", "1 1/8"]
                answer: "1 3/8"
                option_audio: false
                feedback:
                  "8/12": "That adds the denominators. Change 3/4 into 6/8, then add the eighths."
                hints:
                  - "Change 3/4 into eighths first."
                  - "6/8 + 5/8 = 11/8."
                  - "8/8 is one whole, so 11/8 = 1 3/8."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Work out 2/3 + 5/6."
                say: "Work out two thirds add five sixths."
                frame: "4/6 + 5/6 = _/6 = 1 _/6"
                options: ["3", "4", "9", "11"]
                answer: ["9", "3"]
                hints:
                  - "Add the sixths."
                  - "4 + 5 = 9, so 9/6. Six sixths make one whole."
                  - "9/6 = 1 3/6."
              - id: l2-f3
                type: multiple_choice
                text: "7/10 + 1/2 = _"
                say: "Seven tenths add one half."
                options: ["1 2/10", "8/12", "1 2/5"]
                answer: "1 2/10"
                option_audio: false
                hints:
                  - "Change 1/2 into tenths."
                  - "7/10 + 5/10 = 12/10."
                  - "12/10 = 1 2/10."
              - id: l2-f4
                type: multiple_choice
                text: "1 1/4 − 1/2 = _"
                say: "One and one quarter take away one half."
                options: ["3/4", "1/4", "1 1/2"]
                answer: "3/4"
                option_audio: false
                hints:
                  - "Write both in quarters."
                  - "1 1/4 = 5/4 and 1/2 = 2/4."
                  - "5/4 − 2/4 = 3/4."
              - id: l2-f5
                type: text_input
                text: "Tom drinks 1/2 litre of water in the morning and 3/8 litre at lunch. How many eighths of a litre is that?"
                say: "Tom drinks half a litre of water in the morning and three eighths of a litre at lunch. How many eighths of a litre is that?"
                answer: "7"
                hints:
                  - "Change 1/2 into eighths."
                  - "1/2 = 4/8."
                  - "4/8 + 3/8 = 7/8."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "5/6 + 1/2 = _"
                say: "Five sixths add one half."
                options: ["1 2/6", "6/8", "1 1/6"]
                answer: "1 2/6"
                option_audio: false
                hints: ["1/2 = 3/6."]
              - id: l2-s2
                type: text_input
                text: "3/5 + 7/10 = 13/10 = 1 _/10"
                say: "Three fifths add seven tenths is thirteen tenths. That is one and how many tenths?"
                answer: "3"
                hints: ["Ten tenths make one whole."]
              - id: l2-s3
                type: multiple_choice
                text: "7/8 − 1/2 = _"
                say: "Seven eighths take away one half."
                options: ["3/8", "6/6", "6/8"]
                answer: "3/8"
                option_audio: false
                hints: ["1/2 = 4/8."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 3/4 + 1/2 = 1 1/4"
                say: "Is it true? Three quarters add one half is one and one quarter."
                answer: true
                hints: ["1/2 = 2/4."]
              - id: l2-s5
                type: multiple_choice
                text: "Which sum is more than 1?"
                options: ["1/2 + 3/8", "3/4 + 1/8", "1/2 + 5/8"]
                answer: "1/2 + 5/8"
                option_audio: false
                hints: ["Change each sum into eighths. Is it more than 8/8?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A recipe uses 3/4 kg of flour and 1/8 kg of sugar. How many eighths of a kilogram is that altogether?"
                say: "A recipe uses three quarters of a kilogram of flour and one eighth of a kilogram of sugar. How many eighths of a kilogram is that altogether?"
                answer: "7"
              - id: l2-n2
                type: multiple_choice
                text: "Ava walks 2/5 km to the shop and then 7/10 km to the park. How far does she walk?"
                say: "Ava walks two fifths of a kilometre to the shop and then seven tenths of a kilometre to the park. How far does she walk?"
                options: ["1 1/10 km", "9/15 km", "1 1/5 km"]
                answer: "1 1/10 km"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "A jug holds 3/4 litre of juice. Sam pours out 1/8 litre. How much is left?"
                say: "A jug holds three quarters of a litre of juice. Sam pours out one eighth of a litre. How much is left?"
                options: ["5/8 litre", "2/4 litre", "2/8 litre"]
                answer: "5/8 litre"
                option_audio: false
              - id: l2-n4
                type: text_input
                text: "A ribbon is 5/6 m long. Mia cuts off 1/3 m. How many sixths of a metre are left?"
                say: "A ribbon is five sixths of a metre long. Mia cuts off one third of a metre. How many sixths of a metre are left?"
                answer: "3"
              - id: l2-n5
                type: multiple_choice
                text: "Leo eats 1/4 of a pizza. Zara eats 5/8 of the same pizza. How much of the pizza is left?"
                say: "Leo eats one quarter of a pizza. Zara eats five eighths of the same pizza. How much of the pizza is left?"
                options: ["1/8", "6/12", "3/8"]
                answer: "1/8"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: multiple_choice
            text: "1/3 + 1/6 = _"
            say: "One third add one sixth."
            options: ["3/6", "2/9", "2/6"]
            answer: "3/6"
            option_audio: false
          - id: l2-c2
            part: subtract
            type: text_input
            text: "9/10 − 2/5 = _/10"
            say: "Nine tenths take away two fifths is how many tenths?"
            answer: "5"
          - id: l2-c3
            part: over-one
            type: multiple_choice
            text: "7/8 + 3/4 = _"
            say: "Seven eighths add three quarters."
            options: ["1 5/8", "10/12", "1 1/8"]
            answer: "1 5/8"
            option_audio: false
          - id: l2-c4
            part: add
            type: fill_in_blank
            text: "Work out 5/12 + 1/4."
            say: "Work out five twelfths add one quarter."
            frame: "5/12 + _/12 = _/12"
            options: ["1", "3", "6", "8"]
            answer: ["3", "8"]
          - id: l2-c5
            part: in-context
            type: text_input
            text: "Ben has 5/8 of a bottle of water. He drinks 1/4 of a bottle. How many eighths of a bottle are left?"
            say: "Ben has five eighths of a bottle of water. He drinks a quarter of a bottle. How many eighths of a bottle are left?"
            answer: "3"
          - id: l2-c6
            part: add
            type: text_input
            text: "1/6 + 7/12 = _/12"
            say: "One sixth add seven twelfths is how many twelfths?"
            answer: "9"
          - id: l2-c7
            part: add
            type: true_false
            text: "Is it true? 1/5 + 1/10 = 2/15"
            say: "Is it true? One fifth add one tenth is two fifteenths."
            answer: false
          - id: l2-c8
            part: add
            type: multiple_choice
            text: "Which sum has the same answer as 1/3 + 2/9?"
            say: "Which sum has the same answer as one third add two ninths?"
            options: ["3/9 + 2/9", "1/9 + 2/9", "1/12 + 2/12"]
            answer: "3/9 + 2/9"
            option_audio: false
          - id: l2-c9
            part: subtract
            type: multiple_choice
            text: "4/5 − 1/10 = _"
            say: "Four fifths take away one tenth."
            options: ["7/10", "3/5", "3/10"]
            answer: "7/10"
            option_audio: false
          - id: l2-c10
            part: subtract
            type: text_input
            text: "5/6 − 7/12 = _/12"
            say: "Five sixths take away seven twelfths is how many twelfths?"
            answer: "3"
          - id: l2-c11
            part: subtract
            type: true_false
            text: "Is it true? 1/2 − 1/10 = 4/10"
            say: "Is it true? One half take away one tenth is four tenths."
            answer: true
          - id: l2-c12
            part: subtract
            type: multiple_choice
            text: "Which subtraction has the answer 1/8?"
            say: "Which subtraction has the answer one eighth?"
            options: ["3/4 − 5/8", "1/2 − 1/4", "7/8 − 1/2"]
            answer: "3/4 − 5/8"
            option_audio: false
          - id: l2-c13
            part: over-one
            type: multiple_choice
            text: "4/5 + 7/10 = _"
            say: "Four fifths add seven tenths."
            options: ["1 5/10", "11/15", "1 1/10"]
            answer: "1 5/10"
            option_audio: false
          - id: l2-c14
            part: over-one
            type: text_input
            text: "5/9 + 2/3 = _\nType the answer as a mixed number."
            say: "Five ninths add two thirds. Type the answer as a mixed number."
            keyboard: fraction
            answer: "1 2/9"
          - id: l2-c15
            part: over-one
            type: fill_in_blank
            text: "Work out 1 1/2 − 3/4."
            say: "Work out one and a half take away three quarters."
            frame: "1 1/2 = _/4, so 1 1/2 − 3/4 = _/4"
            options: ["2", "3", "6", "9"]
            answer: ["6", "3"]
          - id: l2-c16
            part: over-one
            type: true_false
            text: "Is it true? 5/8 + 1/2 = 1 1/8"
            say: "Is it true? Five eighths add one half is one and one eighth."
            answer: true
          - id: l2-c17
            part: in-context
            type: text_input
            text: "Nadia uses 1/3 of a bag of flour for a cake and 1/12 of the bag for biscuits. How many twelfths of the bag does she use?"
            say: "Nadia uses one third of a bag of flour for a cake and one twelfth of the bag for biscuits. How many twelfths of the bag does she use?"
            answer: "5"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "Ella runs 3/4 km. Then she walks 3/8 km. How far does she go altogether?"
            say: "Ella runs three quarters of a kilometre. Then she walks three eighths of a kilometre. How far does she go altogether?"
            options: ["1 1/8 km", "6/12 km", "1 3/8 km"]
            answer: "1 1/8 km"
            option_audio: false
          - id: l2-c19
            part: in-context
            type: true_false
            text: "Ruby reads 1/4 of her book on Monday and 1/2 of it on Tuesday. She says: \"I have read 2/6 of my book.\" Is she right?"
            say: "Ruby reads one quarter of her book on Monday and one half of it on Tuesday. She says: I have read two sixths of my book. Is she right?"
            answer: false
          - id: l2-c20
            part: in-context
            type: text_input
            text: "A tin holds 7/10 litre of paint. Dad uses 1/5 litre. How many tenths of a litre are left?"
            say: "A tin holds seven tenths of a litre of paint. Dad uses one fifth of a litre. How many tenths of a litre are left?"
            answer: "5"
