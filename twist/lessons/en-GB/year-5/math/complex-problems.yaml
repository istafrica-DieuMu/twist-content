# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.complex-problems
skill: math.word-problems.complex
curriculum: en-GB
language: en
title:
  de: Komplexe Sachaufgaben
  en: Multi-step problems from tables and charts
summary: >
  Lesson 1 solves problems from a price list and a class table: find the
  facts the question needs, leave the others out, and compare ways of
  buying (a family ticket or single tickets). Lesson 2 takes its facts
  from a bar chart and a line graph, solves the same problem in two ways
  ((45 + 30 + 60 + 35) × 50p or £22.50 + £15 + £30 + £17.50), and ends
  with the skill check.
metadata:
  year: year-5
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.word-problems.estimate-or-exact, math.data.read-charts]
  also_practises: [math.data.read-tables, math.money.word-problems]
  vocabulary: { en: [table, price list, bar chart, line graph, information, method, cheaper, difference, altogether] }
  forms: [drawn, text, audio]
  drawn: [table, bar-chart, line-graph]
  facets: [currency]
  misconceptions:
    - id: uses-every-number
      what: Uses every number in the table, also the ones the question does not need
      addressed: lesson 1 Learn picks out the facts the question needs; l1-f5, l1-s5, l1-n5 and l1-c3 ask which fact is not needed, and lesson 2 charts have rows the question does not ask about
    - id: one-way-only
      what: Thinks only one way of calculating can be right, or stops at the first step (gives the cost of the family ticket instead of the saving)
      addressed: lesson 1 Learn compares two ways of buying tickets and lesson 2 Learn solves one problem in two ways; l2-f4, l2-s4, l2-n4 and l2-c4 ask who is right, with both ways right in three of them; l1-f2 and l2-f1 have feedback on the first-step answer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Tabellen und Preislisten", en: "Tables and price lists" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many children read 4 books?"
            show: { drawn: bar-chart, rows: [["2 books", 6], ["3 books", 9], ["4 books", 5], ["5 books", 3]] }
            options: ["5", "9", "4"]
            answer: "5"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ben has £10. He buys a drink for £1.40 and a sandwich for £3.20. Is £10 enough? Estimate or exact?"
            options: ["an estimate is enough", "the exact answer"]
            answer: "an estimate is enough"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wildlife Park prices"
            say: "Here is the price list for a wildlife park. Read the question first, then pick out only the facts you need."
            show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
          - text: "2 adults and 2 children. Is the family ticket cheaper?\nSingle tickets: 2 × £12 + 2 × £7 = £24 + £14 = £38\nFamily ticket: £32"
            say: "Mum, Dad and two children want to visit. Is the family ticket cheaper? Single tickets cost two times twelve and two times seven pounds: thirty-eight pounds. The family ticket costs thirty-two pounds. The under-three price is not needed here."
          - text: "£38 − £32 = £6. The family saves £6."
            say: "The question asks how much they save, so there is one more step: thirty-eight subtract thirty-two is six pounds. Answer: the family ticket is cheaper, and they save six pounds."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What do 3 child tickets cost?"
                show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
                options: ["£21", "£36", "£10"]
                answer: "£21"
                hints:
                  - "Find the child price in the table."
                  - "A child ticket is £7."
                  - "3 × £7 = £21."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Gran and Grandad take 2 children to the park. How much do they save with the family ticket?"
                show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
                options: ["£6", "£32", "£38"]
                answer: "£6"
                feedback:
                  "£32": "That is the cost of the family ticket. The question asks how much they save."
                hints:
                  - "Work out the single tickets, then compare."
                  - "Single tickets: £24 + £14 = £38. The family ticket is £32."
                  - "£38 − £32 = £6."
              - id: l1-f3
                type: text_input
                text: "Class 5B goes to the park: 28 children and 3 adults. They buy single tickets. How much do the tickets cost, in pounds?"
                show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
                answer: "232"
                hints:
                  - "Children and adults pay different prices."
                  - "28 × £7 = £196. 3 × £12 = £36."
                  - "£196 + £36 = £232."
              - id: l1-f4
                type: multiple_choice
                text: "Which class needs the most coach seats, counting children and adults?"
                show: { drawn: table, rows: [["Class", "Children", "Adults"], ["5A", "29", "2"], ["5B", "28", "3"], ["5C", "27", "5"]] }
                options: ["5C", "5A", "5B"]
                answer: "5C"
                hints:
                  - "Add children and adults for each class."
                  - "5A: 31. 5B: 31. 5C: 32."
                  - "5C needs 32 seats."
              - id: l1-f5
                type: multiple_choice
                text: "A coach has 53 seats. Classes 5A and 5B travel together. Do they fit on one coach? Which fact do you not need?"
                show: { drawn: table, rows: [["Class", "Children", "Adults"], ["5A", "29", "2"], ["5B", "28", "3"], ["5C", "27", "5"]] }
                options: ["the 5C row", "the 5A children", "the coach has 53 seats"]
                answer: "the 5C row"
                hints:
                  - "Which classes are in the question?"
                  - "Only 5A and 5B travel together."
                  - "The 5C row is not needed."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What do 2 adult tickets and 1 child ticket cost?"
                show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
                options: ["£31", "£26", "£38"]
                answer: "£31"
                hints: ["2 × £12 + £7."]
              - id: l1-s2
                type: multiple_choice
                text: "Café: sandwich £3.20, juice £1.40, apple 60p. Priya buys a sandwich, a juice and an apple. How much change from £10?"
                options: ["£4.80", "£5.20", "£5.80"]
                answer: "£4.80"
                hints: ["The total is £5.20. Then find the change from £10."]
              - id: l1-s3
                type: text_input
                text: "Classes 5A and 5B travel together. How many seats do they need?"
                show: { drawn: table, rows: [["Class", "Children", "Adults"], ["5A", "29", "2"], ["5B", "28", "3"], ["5C", "27", "5"]] }
                answer: "62"
                hints: ["Add all four numbers in the two rows."]
              - id: l1-s4
                type: true_false
                text: "A family of 2 adults, 2 children and a baby of 1 pays £32 in all."
                show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
                answer: true
                hints: ["What does a child under 3 pay?"]
              - id: l1-s5
                type: multiple_choice
                text: "Café: sandwich £3.20, juice £1.40, muffin £1.85. Tim buys 2 sandwiches. How much does he pay? Which fact do you not need?"
                options: ["the muffin price", "the sandwich price", "that he buys 2"]
                answer: "the muffin price"
                hints: ["What does Tim buy?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What do 4 child tickets cost?"
                show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
                options: ["£28", "£48", "£11"]
                answer: "£28"
              - id: l1-n2
                type: multiple_choice
                text: "2 adults and 3 children visit. Which is cheapest?"
                show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
                options: ["a family ticket and 1 child ticket: £39", "all single tickets: £45", "two family tickets: £64"]
                answer: "a family ticket and 1 child ticket: £39"
              - id: l1-n3
                type: text_input
                text: "All three classes go on two coaches of 53 seats. How many seats are left empty?"
                show: { drawn: table, rows: [["Class", "Children", "Adults"], ["5A", "29", "2"], ["5B", "28", "3"], ["5C", "27", "5"]] }
                answer: "12"
              - id: l1-n4
                type: text_input
                text: "Café: sandwich £3.20, juice £1.40, apple 60p. A teacher buys 5 juices. How much is that, in pence?"
                answer: "700"
              - id: l1-n5
                type: multiple_choice
                text: "How many children from 5A and 5C go on the trip? Which fact do you not need?"
                show: { drawn: table, rows: [["Class", "Children", "Adults"], ["5A", "29", "2"], ["5B", "28", "3"], ["5C", "27", "5"]] }
                options: ["the Adults column", "the 5A row", "the Children column"]
                answer: "the Adults column"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What do 1 adult and 3 children pay with single tickets?"
            show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
            options: ["£33", "£32", "£43"]
            answer: "£33"
          - id: l1-c2
            type: text_input
            text: "How many people are in class 5C's group?"
            show: { drawn: table, rows: [["Class", "Children", "Adults"], ["5A", "29", "2"], ["5B", "28", "3"], ["5C", "27", "5"]] }
            answer: "32"
          - id: l1-c3
            type: multiple_choice
            text: "Café: sandwich £3.20, juice £1.40, apple 60p. How much do 2 apples cost? Which fact do you not need?"
            options: ["the sandwich price", "the apple price", "that there are 2 apples"]
            answer: "the sandwich price"

  - n: 2
    title: { de: "Diagramme und zwei Lösungswege", en: "Charts and two ways" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What do 2 adult tickets cost?"
            show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
            options: ["£24", "£14", "£32"]
            answer: "£24"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "How many children are in 5A and 5B together?"
            show: { drawn: table, rows: [["Class", "Children", "Adults"], ["5A", "29", "2"], ["5B", "28", "3"], ["5C", "27", "5"]] }
            answer: "57"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Cakes sold at the school fair, 50p each"
            say: "This bar chart shows how many cakes were sold each day of the school fair. Each cake cost fifty pence. How much money did the cake stall make?"
            show: { drawn: bar-chart, rows: [["Monday", 45], ["Tuesday", 30], ["Wednesday", 60], ["Thursday", 35]], step: 10 }
          - text: "Way 1: 45 + 30 + 60 + 35 = 170 cakes\n170 × 50p = 8500p = £85"
            say: "One way: add up all the cakes first. One hundred and seventy cakes. Then times fifty pence: eight thousand five hundred pence, which is eighty-five pounds."
          - text: "Way 2: £22.50 + £15 + £30 + £17.50 = £85"
            say: "Another way: work out the money for each day, then add. Twenty-two pounds fifty, fifteen pounds, thirty pounds and seventeen pounds fifty make eighty-five pounds. Both ways give the same answer. Choose the one you find easier."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many more cakes were sold on Wednesday than on Tuesday?"
                show: { drawn: bar-chart, rows: [["Monday", 45], ["Tuesday", 30], ["Wednesday", 60], ["Thursday", 35]], step: 10 }
                options: ["30", "60", "90"]
                answer: "30"
                feedback:
                  "60": "60 is the number sold on Wednesday. The question asks how many more than on Tuesday."
                hints:
                  - "Read both bars."
                  - "Wednesday: 60. Tuesday: 30."
                  - "60 − 30 = 30."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "How much money did the cake stall make on Monday and Tuesday together, in pence?"
                show: { drawn: bar-chart, rows: [["Monday", 45], ["Tuesday", 30], ["Wednesday", 60], ["Thursday", 35]], step: 10 }
                answer: "3750"
                hints:
                  - "Add the cakes first, or work out each day."
                  - "45 + 30 = 75 cakes."
                  - "75 × 50p = 3750p."
              - id: l2-f3
                type: multiple_choice
                text: "The line graph shows the temperature in a greenhouse. How much warmer was it at 2 pm than at 8 am?"
                show: { drawn: line-graph, rows: [["8 am", 12], ["10 am", 18], ["12 noon", 24], ["2 pm", 27], ["4 pm", 21]], step: 5, ylabel: "°C" }
                options: ["15 °C", "27 °C", "3 °C"]
                answer: "15 °C"
                hints:
                  - "Read the temperature at 8 am and at 2 pm."
                  - "8 am: 12 °C. 2 pm: 27 °C."
                  - "27 − 12 = 15 °C."
              - id: l2-f4
                type: multiple_choice
                text: "How much did Thursday's cakes make?\nZoe: 35 × 50p = 1750p = £17.50\nAdam: half of 35 is 17.5, so £17.50"
                show: { drawn: bar-chart, rows: [["Monday", 45], ["Tuesday", 30], ["Wednesday", 60], ["Thursday", 35]], step: 10 }
                options: ["both", "only Zoe", "only Adam"]
                answer: "both"
                keep_order: true
                hints:
                  - "Check each way."
                  - "50p is half of £1, so 35 cakes make half of £35."
                  - "Both are right: £17.50."
              - id: l2-f5
                type: text_input
                text: "The stall wants to make £100 in all. How much more money does it need after the four days, in pounds?"
                show: { drawn: bar-chart, rows: [["Monday", 45], ["Tuesday", 30], ["Wednesday", 60], ["Thursday", 35]], step: 10 }
                answer: "15"
                hints:
                  - "First find the total money."
                  - "170 cakes × 50p = £85."
                  - "£100 − £85 = £15."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many cakes were sold on Monday and Thursday together?"
                show: { drawn: bar-chart, rows: [["Monday", 45], ["Tuesday", 30], ["Wednesday", 60], ["Thursday", 35]], step: 10 }
                options: ["80", "70", "105"]
                answer: "80"
                hints: ["45 + 35."]
              - id: l2-s2
                type: text_input
                text: "Books borrowed from the library. Each book borrowed earns a sticker, and stickers come on sheets of 5. How many sheets does Year 5 need?"
                show: { drawn: bar-chart, rows: [["Year 3", 40], ["Year 4", 55], ["Year 5", 65], ["Year 6", 50]], step: 10 }
                answer: "13"
                hints: ["Year 5 borrowed 65 books. 65 ÷ 5."]
              - id: l2-s3
                type: multiple_choice
                text: "Between which two times did the temperature in the greenhouse fall?"
                show: { drawn: line-graph, rows: [["8 am", 12], ["10 am", 18], ["12 noon", 24], ["2 pm", 27], ["4 pm", 21]], step: 5, ylabel: "°C" }
                options: ["2 pm and 4 pm", "8 am and 10 am", "12 noon and 2 pm"]
                answer: "2 pm and 4 pm"
                hints: ["Where does the line go down?"]
              - id: l2-s4
                type: multiple_choice
                text: "How many books did Year 3 and Year 4 borrow?\nLuca: 40 + 55 = 95\nNell: 50 + 50 − 5 = 95"
                show: { drawn: bar-chart, rows: [["Year 3", 40], ["Year 4", 55], ["Year 5", 65], ["Year 6", 50]], step: 10 }
                options: ["both", "only Luca", "only Nell"]
                answer: "both"
                keep_order: true
                hints: ["Nell moved 10 from Year 4 to Year 3 and took 5 off. Check it."]
              - id: l2-s5
                type: text_input
                text: "The library wants 250 books borrowed. How many more are needed?"
                show: { drawn: bar-chart, rows: [["Year 3", 40], ["Year 4", 55], ["Year 5", 65], ["Year 6", 50]], step: 10 }
                answer: "40"
                hints: ["Find the total first: 40 + 55 + 65 + 50."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many fewer books did Year 6 borrow than Year 5?"
                show: { drawn: bar-chart, rows: [["Year 3", 40], ["Year 4", 55], ["Year 5", 65], ["Year 6", 50]], step: 10 }
                options: ["15", "50", "115"]
                answer: "15"
              - id: l2-n2
                type: text_input
                text: "Cakes cost 50p each. How much did Wednesday's cakes make, in pounds?"
                show: { drawn: bar-chart, rows: [["Monday", 45], ["Tuesday", 30], ["Wednesday", 60], ["Thursday", 35]], step: 10 }
                answer: "30"
              - id: l2-n3
                type: multiple_choice
                text: "By how much did the temperature in the greenhouse rise from 8 am to 12 noon?"
                show: { drawn: line-graph, rows: [["8 am", 12], ["10 am", 18], ["12 noon", 24], ["2 pm", 27], ["4 pm", 21]], step: 5, ylabel: "°C" }
                options: ["12 °C", "24 °C", "6 °C"]
                answer: "12 °C"
              - id: l2-n4
                type: multiple_choice
                text: "How much money did the stall make on Tuesday and Wednesday?\nRosa: 30 + 60 = 90 cakes, 90 × 50p = £45\nKai: £15 + £30 = £35"
                show: { drawn: bar-chart, rows: [["Monday", 45], ["Tuesday", 30], ["Wednesday", 60], ["Thursday", 35]], step: 10 }
                options: ["both", "only Rosa", "only Kai"]
                answer: "only Rosa"
                keep_order: true
              - id: l2-n5
                type: text_input
                text: "How many books were borrowed by all four year groups?"
                show: { drawn: bar-chart, rows: [["Year 3", 40], ["Year 4", 55], ["Year 5", 65], ["Year 6", 50]], step: 10 }
                answer: "210"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "3 adults and 2 children visit the wildlife park. Which is cheapest?"
            show: { drawn: table, rows: [["Ticket", "Price"], ["Adult", "£12"], ["Child (3 to 15)", "£7"], ["Under 3", "free"], ["Family (2 adults, 2 children)", "£32"]] }
            options: ["a family ticket and 1 adult ticket: £44", "all single tickets: £50", "two family tickets: £64"]
            answer: "a family ticket and 1 adult ticket: £44"
          - id: l2-c2
            type: text_input
            text: "Cakes cost 50p each. How much did the stall make on Monday and Wednesday together, in pence?"
            show: { drawn: bar-chart, rows: [["Monday", 45], ["Tuesday", 30], ["Wednesday", 60], ["Thursday", 35]], step: 10 }
            answer: "5250"
          - id: l2-c3
            type: multiple_choice
            text: "What was the temperature in the greenhouse at 10 am, and how much did it rise by 2 pm?"
            show: { drawn: line-graph, rows: [["8 am", 12], ["10 am", 18], ["12 noon", 24], ["2 pm", 27], ["4 pm", 21]], step: 5, ylabel: "°C" }
            options: ["18 °C, then 9 °C warmer", "18 °C, then 27 °C warmer", "12 °C, then 15 °C warmer"]
            answer: "18 °C, then 9 °C warmer"
          - id: l2-c4
            type: multiple_choice
            text: "How many books did Year 5 and Year 6 borrow?\nMo: 65 + 50 = 115\nIzzy: 60 + 50 + 5 = 115"
            show: { drawn: bar-chart, rows: [["Year 3", 40], ["Year 4", 55], ["Year 5", 65], ["Year 6", 50]], step: 10 }
            options: ["both", "only Mo", "only Izzy"]
            answer: "both"
            keep_order: true
          - id: l2-c5
            type: multiple_choice
            text: "Classes 5B and 5C travel together on one coach of 53 seats. Which fact do you not need to decide whether they fit?"
            show: { drawn: table, rows: [["Class", "Children", "Adults"], ["5A", "29", "2"], ["5B", "28", "3"], ["5C", "27", "5"]] }
            options: ["the 5A row", "the 5C adults", "the coach has 53 seats"]
            answer: "the 5A row"
